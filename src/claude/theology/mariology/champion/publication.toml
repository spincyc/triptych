pdfsubject = '''A source-audited apparition study of Champion, Wisconsin: the reported October 1859 apparitions to Adele Brise read in their two earliest published witnesses, Eliza Allen Starr's account of 1871 and Peter Pernin's of 1874; the stratigraphy of the received message; the fire of 8 October 1871 separated into contemporary record and later devotional narration; the decree of Bishop David L. Ricken of 8 December 2010 quoted at its operative clause and read against the 1978 norms then in force; and what a diocesan approval of a private revelation does and does not oblige'''
