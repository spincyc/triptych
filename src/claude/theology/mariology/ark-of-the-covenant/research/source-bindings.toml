# Claude edition. Bindings are catalog-level: the passage checks were
# performed against live web transcriptions, scans, and page images (URLs,
# dates, and evidence states in research/source-audit.md), not against
# registered artifact bytes, so no acquisition/inspection/verification state
# is claimed against the source-library records themselves. Most of this
# publication's witnesses (the drbo.org Douay-Rheims chapter pages, the
# archive.org Patrologia scans, the ANF/NPNF transcriptions, the FOTC
# lending volumes, Field's Hexapla, the 1942 Breviarium scan, and the other
# public-domain scans named in the References) are not registered in the
# source library; they are identified in the publication's References and
# audited in research/source-audit.md. The bindings below cover the sources
# actually used for which registered edition records already exist.

