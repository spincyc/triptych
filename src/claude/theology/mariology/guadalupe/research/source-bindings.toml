  "parte II, cap. 3, pp. 81-92",
  "apéndice I",
  "apéndice IV, pp. 227-238",
  "apéndice VII",
]
role = "context"
states = ["cataloged"]
context = "The reconstruction of Bustamante's sermon of 8 September 1556 and of the Informacion de 1556, the analysis of that file's procedural irregularities and unofficial character, the exposition and critique of Garibay's dating of the Nican mopohua, and the documented chronology of the file's suppression and nineteenth-century publication together with the 1887 coronation brief, the 1894 Office revision, the 1895 coronation and the 1896 provincial-council edict. Read at first hand 2026-07-25 in the UNAM-IIH open-access PDFs. A strongly anti-apparitionist work, used at that level, with its conclusions attributed to it and its reported acts marked as reported where the Holy See's own organs were searched and did not contain them. The edition's non-lucrative-reproduction condition is observed. Catalog-level binding."

