# Claude edition. Bindings are catalog-level: the actual passage checks were
# performed against live web pages, downloaded Holy See OCR scans, rendered
# page images, and IIIF page images (loci, URLs, dates, and limits in
# research/source-audit.md), not against registered artifact bytes, so no
# acquisition/inspection/verification state is claimed against the
# source-library records themselves.

[[bindings]]
source_id = "edition.luis-laso-de-la-vega.huei-tlamahuicoltica.mexico-juan-ruiz-1649"
loci = [
  "heading of the Nican mopohua",
  "fol. 1r",
  "fol. 2r",
  "fol. 5r",
  "heading of the Nican motecpana",
  "Nican tlantica",
  "closing prayer",
  "structure of the tract",
]
role = "direct-witness"
states = ["cataloged"]
context = "The controlling witness of the apparition narrative. The heading and opening sentence (fol. 1r), the self-identification (fol. 2r) and the fourfold cuix amo consolation (fol. 5r) are quoted in sections 2 and 7 of the publication and were collated 2026-07-25 against IIIF page images of the John Carter Brown Library copy at scan leaf indices 13, 15 and 21, including a magnified crop of leaf 21; the Nahuatl passages were further collated against the independent printing in Agustin de la Rosa, Dissertatio historico-theologica (Guadalajara, 1887), which agrees word for word. The section headings and the tract's six movements were read in the same scan's OCR with the first heading collated against its page image. The closing prayer is identified and expressly not reproduced anywhere in the publication, under the received-prayer rule of guidance/editorial.md. Catalog-level binding."

