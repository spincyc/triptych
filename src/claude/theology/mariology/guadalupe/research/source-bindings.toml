context = "Current procedural law, governing sections 5 and 9 of the publication: the six determinations of art. 18 with their descriptions at nn. 17-22; the n. 23 rule that as a rule no authority will declare supernatural origin; the art. 22 rule that the faithful are not to take any determination as an approval of supernatural nature; the n. 13 canonization principle applied to the beatification and canonization of Juan Diego; the replacement of the 1978 norms by art. 27; and the presentation's and note 24's statement of what ecclesiastical approval of a private revelation means, quoted from Benedict XVI, Verbum Domini n. 14. The same Dicastery's documents index was retrieved and searched on 2026-07-25 for the recorded negative result that it contains nothing concerning Guadalupe, Tepeyac or Juan Diego. Read 2026-07-25 at the live Vatican English page. Catalog-level binding."
