context = "The classical statement of the argument from silence, quoted at length in section 3 of the publication and used in sections 3, 6 and 8. Quoted 2026-07-25 from the Biblioteca Virtual Miguel de Cervantes transcription and collated the same day against the 1896 imprint in the Harvard copy digitized by Google; the readings agree, and the transcription's silent expansion of the imprint's abbreviations is recorded in the publication. Public domain. Catalog-level binding."

