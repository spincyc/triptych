[[bindings]]
source_id = "edition.melanie-calvat.secret-complet-de-la-salette.louvain-lefever-1881-archive-web"
loci = [
  "front matter",
  "preface",
  "printed pp. 5-22",
  "text subscription",
  "imprimatur formula",
  "letters of Melanie",
  "letter of Bishop Zola",
]
role = "direct-witness"
states = ["cataloged"]
context = "The principal analyzed text of the publication. Documentary use in section 5.3-5.6: the imprint's title-page identification, the anonymous avant-propos, the subscription dated Castellammare 21 November 1878, the Nihil obstat and imprimatur formula of 15 November 1879 with its Lecce curia signature, Melanie's letters of 25 March and 9 May 1880, and Bishop Zola's letter of 24 May 1880 supplying the custody chronology, the account of the 3-4 July 1851 writing at Corenc and Grenoble, and his admission that the 1879 text is not what went to Pius IX. Analytical use in section 6, which publishes the 1879 text at its principal elements, quotes its load-bearing sentences, compares its version of the public discourse element by element with the 1854 printing of the diocesan documents, and reaches a labelled project-synthesis judgment that the 1879 text is not the 1851 text. Every French sentence quoted from this volume in the publication was collated against the scan's page images on 2026-07-25; the volume is not reproduced integrally, and it is quoted neither as true nor as revealed. Catalog-level binding."

[[bindings]]
source_id = "edition.i-roubaud.verite-sur-le-secret-de-melanie.louvain-lefever-1882-archive-web"
loci = ["printed pp. 3-10"]
role = "direct-witness"
states = ["cataloged"]
context = "A partisan 1882 defence of the secret, bound only for the facts it concedes against its own case and used at that ceiling in sections 5.6, 6.8, and 6.11: the press controversy opened by the communique of 25 June 1882 in the Semaine religieuse d'Amiens; the Congregation of the Index's refusal to condemn the booklet; the Holy Office's taking up of the matter because a revelation was at issue; the letter of Cardinal Prospero Caterini of 14 August 1880 with its 'si la chose est possible', known to the defenders only in translation; the 1882 charge of non-conformity between the Lecce text and the 1851 text; and the report of a private audience of Leo XIII and of the coronation of 20 August 1879. Its arguments and evaluations are attributed to their author and are not adopted; the periodicals it names were not consulted. The pages used were collated against the scan's page images on 2026-07-25. Catalog-level binding."

