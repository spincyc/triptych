# Claude edition. Bindings are catalog-level: the actual passage checks were
# performed against live web pages, the Holy See's archive text files, Internet
# Archive OCR text, and — for the two Louvain imprints of 1881 and 1882 — the
# page images of those scans (loci, URLs, dates, and limits in
# research/source-audit.md), not against registered artifact bytes, so no
# acquisition, search, inspection, or verification state is claimed against the
# source-library records themselves.
#
# 2026-07-25: posture change. Earlier states of this file recorded that the
# content of the secret was neither quoted nor characterized in the
# publication. The publication now publishes and analyzes the 1879 text under
# the disclosure at its section 5.1; the bindings below are revised
# accordingly, and a new binding for the 1882 Roubaud pamphlet is added.

