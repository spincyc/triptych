[[bindings]]
source_id = "edition.thomas-aquinas.summa-theologiae.english-newadvent-web-2026-07-25"
loci = ["II-II.173.2.corpus", "II-II.173.4.corpus", "II-II.174.1.corpus"]
role = "context"
states = ["cataloged"]
context = "The classical account the 2000 theological commentary applies: the distinction between the reception of a prophetic representation and the judgment upon it (q. 173 a. 2); the prophet's mind as a deficient instrument, so that 'even true prophets know not all that the Holy Ghost means by the things they see' (q. 173 a. 4); and the prophecy of denunciation, which 'is not always fulfilled' because it announces a causal tendency that may be hindered (q. 174 a. 1). Quoted from the English Dominican Province translation at the host page; the Latin was not collated and no Latin wording is quoted. Cited as tradition, never as an authority on Fatima; read 2026-07-25. Catalog-level binding."

