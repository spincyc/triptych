context = "CCC 2745 (footnote citing Origen, De orat. 12) and CCC 2847 (footnote citing Origen, De orat. 29: PG 11, 544CD) document selective Catholic reception of Origen's teaching on prayer; both paragraphs were read at the live Vatican English pages on 2026-07-24. The checks were made against the live site, not against this edition's registered artifact bytes, so only catalog-level use is claimed. Reception of two paragraphs neither rehabilitates Origen's corpus nor bears on the anathema question."
