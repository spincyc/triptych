# --- The act printed in the official gazette -------------------------------

[[bindings]]
source_id = "artifact.holy-see.acta-apostolicae-sedis.volume-82-1990.vatican-ocr-pdf-629766ef"
loci = ["533-534"]
role = "direct-witness"
states = ["cataloged", "acquired", "inspected"]
context = "The rescript from the audience of 18 October 1988, Quia peculiare munus, by which John Paul II granted the Cardinal President of the Pontifical Commission Ecclesia Dei six faculties transcending the customary order of law: n. 1 the 1962 Missal to all petitioners; n. 2 dispensation from the irregularities of canon 1044 s. 1 nn. 1-2 and sanatio in radice of marriages null for want of the form of canon 1108; n. 3 a) the erection of the Fraternitas Sacerdotalis Sancti Petri as a clerical society of apostolic life of pontifical right with the notae peculiares of Ecclesia Dei n. 6 a and approval of its constitutions, and 3 b) the erection of its seminary at Wigratzbad in the diocese of Augsburg with the diocesan bishop's prior consent; nn. 4-5 the erection of further communities and associations; and n. 6 the exercise of the authority of the Holy See over the same societies and associations, donec aliter provideatur. Also the closing formula recording the audience of 18 October 1988, the signature of Augustinus card. Mayer, and the archive number 283/88. This is the constitutional centre of the publication."
source_fingerprint = "sha256:e45776ca340891686ef08b5dea7ed1d59015cfe87aa6cdeeb40864eb7615ab78"

