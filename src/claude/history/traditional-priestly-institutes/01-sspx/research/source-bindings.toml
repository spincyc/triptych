# Claude edition. Every binding below records a real event of this research on
# 2026-07-25: exact bytes acquired over HTTPS and hashed, then read. The
# Acta Apostolicae Sedis volumes and fascicles were read through the rendered
# text of their own text layers at the cited pages; the HTML acts were read in
# full. Bindings whose state list goes beyond "cataloged" carry the canonical
# source fingerprint of the bound record and its evidence ancestors.

