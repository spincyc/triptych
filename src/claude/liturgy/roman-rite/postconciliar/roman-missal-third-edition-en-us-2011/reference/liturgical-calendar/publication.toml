[[structure]]
role = "source-bindings"
source = "research/source-bindings.toml"

[document]
type = "liturgy-reference-v1"

[document.main]
pdftitle = 'The Liturgical Calendar of the Roman Missal, Third Edition'
pdfsubject = 'A source-first reference to the norms of the postconciliar liturgical year for the dioceses of the United States of America: the structure of the year, the table of liturgical days, ranks, occurrence and transfer, the movable cycle, Ordinary Time and its omitted week, the Sunday and weekday Lectionary cycles, and the proper calendars of nation, diocese and church'
headings = "class"
front = "none"
appendix = "none"
closing = "small-tight"
# This reference is set at the class's normal size rather than the deep-study
# sequence's \small, so its body opens by restoring it; its first section sets
# its own title block and contents.
body = [
  '\normalsize',
  '\pagestyle{plain}',
  'sections/00-front',
  '\clearpage',
  'sections/10-year',
  'sections/20-ranks',
  'sections/30-table',
  'sections/40-occurrence',
  'sections/50-movable',
  'sections/60-ordinary-time',
  'sections/70-cycles',
  'sections/80-particular',
  'sections/85-worked-years',
  'sections/88-synthesis',
]
apparatus = [
  { source = 'sections/90-timeline', roles = ['timeline'] },
  { source = 'sections/95-scope', roles = ['scope-appendix'] },
  { source = 'sections/99-references', roles = ['references'] },
]
