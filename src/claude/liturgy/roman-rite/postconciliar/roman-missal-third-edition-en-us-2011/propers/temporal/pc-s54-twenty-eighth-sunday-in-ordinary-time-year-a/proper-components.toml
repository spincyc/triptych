# --- Interpretive readings of the whole formulary ------------------------------
#
# Lane keys are those of research/interpretations.md. `authors` names every
# Father, Doctor or saint whose own exegesis the lane's section develops;
# `carrying_authors` names those the research record says carry the reading,
# as src/sources/inventories/author-standing-v1.toml names them. Cyril of
# Jerusalem, who has no standing row, and Lucien Fromage, an ecclesiastical
# writer, are cited in the sections as supporting witnesses only and are not
# listed.
#
# wedding-feast: Augustine (two feasts; Psalm 33:11 with John 6:51; the vision
# of 1 John 3:2), John Chrysostom (why it is a marriage; the burnt city) and
# Robert Bellarmine (Psalm 22) support and carry nothing.
#
# wedding-garment: Jerome and Hilary of Poitiers are developed, Hilary as the
# disagreement over what the garment names; Robert Bellarmine (Psalm 129) and
# Ildefonso Schuster (the Collect and the Gospel) support. None of them
# carries the reading.
#
# farm-and-merchandise: Hilary of Poitiers and Jerome (Matthew 22:5-6, 9) and
# Robert Bellarmine (Psalm 33:11) support and carry nothing.

[[lanes]]
key = "wedding-feast"
authors = ["Gregory the Great", "Jerome", "Hilary of Poitiers", "Irenaeus of Lyons", "Thomas Aquinas", "Augustine of Hippo", "John Chrysostom", "Robert Bellarmine"]
carrying_authors = ["Gregory the Great", "Jerome", "Hilary of Poitiers", "Irenaeus of Lyons", "Thomas Aquinas"]
sources = ["research/interpretations.md", "research/scope.md", "research/source-bindings.toml"]
