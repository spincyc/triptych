metadata = 'edition-branch'
preamble = [
  '\usepackage{titlesec}',
  '\input{liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/shared/exposition-format}',
  '\setlength{\emergencystretch}{2.5em}',
  '\widowpenalty=10000',
  '\clubpenalty=10000',
  '\displaywidowpenalty=10000',
  '\titleformat{\section}{\large\bfseries}{\thesection}{0.5em}{}',
  '\titleformat{\subsection}{\normalsize\bfseries}{\thesubsection}{0.5em}{}',
  '\titlespacing*{\section}{0pt}{1.0em}{0.35em}',
  '\titlespacing*{\subsection}{0pt}{0.85em}{0.25em}',
]
opening = [
  '\pagestyle{plain}',
