  { component = "source-grounded-synthesis" },
  { component = "notable-and-quotable" },
  { component = "exploratory-synthesis" },
]
apparatus = [
  '\clearpage',
  'sections/80-liturgical-resolution',
  'sections/90-scope-and-qualifications',
  'sections/99-references',
  '\end{deepstudy}',
  '\begingroup',
  '\setlength{\parskip}{0pt}',
  '',
  '\small',
  'generation-metadata',
  '\endgroup',
