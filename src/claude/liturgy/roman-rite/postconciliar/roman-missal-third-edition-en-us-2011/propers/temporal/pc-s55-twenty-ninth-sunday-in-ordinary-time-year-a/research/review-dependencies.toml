# Controlling evidence this leaf's research reads outside the leaf and outside
# the ancestry of its registered source bindings. The engine separately seals
# the leaf's own research/, propers/ and instance/ records, every bound source
# record with its ancestry and available payloads, and, for the chronology, the
# computation code, the stable PC identity registry, every file the chronology
# computation opens and every source its answer cites.
#
# - The Week XXIX directory is this edition's canonical shared Missal owner.
#   It alone carries the formulary's witnesses, and the research stage added
#   six bounded findings to it (passage records; the Collect's, the Prayer
#   over the Offerings' and the Prayer after Communion's early witnesses; the
#   antiphons against the Nova Vulgata; the Year B form of Mark 10:45 in the
#   Ordo). It is fingerprinted into research/chronology.toml.
# - The edition registry directory holds the index, the formula dispositions
#   (row PC-S55-A, which names the owner) and the 2026 occurrence record (row
#   PC-S55-A, which now links the instance manifest). The first two are
#   fingerprinted into the chronology record; the third carries the dated
#   occurrence that research/context.md resolves.
# - The two postconciliar calendar files are the finding aids
#   research/context.md used for the day and precedence computations. They are
#   computation inputs to that record and not appointment authorities; the
#   index's Entrance antiphon citation lacks a per-entry Vulgate flag, which
#   research/context.md records and does not follow.
# - Rights. The two postconciliar proper inventories hold the ot-29 rows read
#   as leads (the Collect's recorded Old Gelasian source and the Prayer over
#   the Offerings' recorded Verona source, which the research stage then
#   checked; the quarantined approved English of the Prayer after Communion,
#   which is not used). The Latin and English rights records settle why
#   neither the Latin typical text nor the approved English is reproduced; the
#   Catholic Encyclopedia rights record settles the public-domain standing of
#   the article texts quoted in short phrases in research/scope.md section 8.
#   Artifact records name these only in prose, so binding ancestry does not
#   reach them.
# - The author-standing registry is the one record of which authors may carry
#   a reading (research/interpretations.md names the carrying authors of each;
#   the absence of Cyril of Alexandria, Cyprian and Justin Martyr from it is
#   why they support only). The formulary-loci file and the passage-commentary
#   index are the finding aids that located, or found no, liturgical
#   commentators' loci and the named commentaries of research/scope.md section
#   4. None of them is a witness to any text.
# - The five authored Scripture-chronology files are the corpus whose answer is
#   research/chronology.toml and research/chronology-annotations.tex. Every date
#   the concise opening may print comes from them and from nowhere else. The
#   sources they cite for this leaf's answers are bound by source ID in
#   research/source-bindings.toml, which seals each cited record and, for the
#   Catholic Encyclopedia articles, the tracked article text that was read.
#   Their bindings file is also the record that Psalms 16 and 95 carry no
#   traditional-attribution answer (research/scope.md section 8.1).
# - The canon and concordance data the chronology computation opens to convert
#   the Hebrew-numbered psalm (Psalm 96 to Vulgate 95): the Clementine book
#   index and chapter files, and the verse texts of the three editions that
#   build the Psalter concordance (the Douay-Rheims (Challoner), the Revised
#   Version and the World English Bible Catholic edition), each declared by
#   edition directory. The Douay directory is also where the research stage
#   read its study-text boundaries.
# - The liturgical authorities (national calendar, Missal, Universal Norms,
#   General Calendar, 2008 variation list, Antiphonary, Ordo lectionum Missae,
#   dated readings page, the governing United States English GIRM in its three
#   chapter states, Nostra aetate) are not declared here because each is bound
#   by source ID in research/source-bindings.toml, which seals its record and
#   ancestry.
