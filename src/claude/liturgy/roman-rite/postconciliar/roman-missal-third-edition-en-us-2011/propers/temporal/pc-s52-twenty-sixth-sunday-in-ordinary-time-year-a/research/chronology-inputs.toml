# Appointment-query input for tools/tpt proper-chronology. It carries citations
# and ownership only. It authors no date and is not a chronology source.
# Citations are those of instance/manifest.md and propers/verified.md; Missal
# elements are owned by the Week XXVI shared owner, Lectionary elements by this
# leaf. Each printed ref keeps the numbering of the witness that prints it.
#
# - Responsorial psalm: Hebrew numbering, the printed form of the United States
#   witnesses (Psalm 25; the Latin Ordo prints Ps 24, 4bc-5), converted by the
#   canonical concordance. The Ordo's "4bc" is the Hebrew v. 4 whole, so the
#   Hebrew query is closed at whole verses; the response is v. 6a.
# - Entrance antiphon: the Missal's own locator, Dan 3, 31.29.30.43.42, in the
#   order printed. Vulgate numbering is the only numbering that has these verses
#   of the Greek addition to Daniel 3 (the Prayer of Azariah); an
#   Aramaic-numbered Daniel 3:29-31 is a different text. The Missal prints no
#   Cf., but the owner's finding 1 shows a composite adaptation, so the
#   relationship is recorded as adaptation, not appointed wording.
# - Communion antiphon A: the Missal's printed Vulgate locator with its Cf.
#   (2002 Latin "Cf. Ps 118, 49-50"; ICEL excerpt "Cf. Ps 118: 49-50"); Hebrew
#   Psalm 119:49-50. The United States Lectionary does not print the antiphon.
# - The two forms of the second reading are separate element keys, as the
#   manifest keeps them; so are the two Communion antiphons.
