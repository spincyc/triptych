# Publication-local record of how this leaf's research used the reusable source
# library. First written on 2026-10-16 in the context-resolution and research
# stages of run 4d16b5e19d25dad9; revised on 2026-10-16 by the research stage
# of the revision run 821c824684b0c7a7 (proper-study v12). It supplements
# propers/verified.md (text control), research/scope.md (reception matrix,
# bounds, negatives) and research/interpretations.md.
#
# States say what research did, not what a record could support. `inspected`
# means a research or context stage of one of those runs read the stated loci
# itself, in the language and form each binding's context states; where the
# reading was the first run's and was not repeated in the revision, the context
# says so. Nothing here is `verified`: no reception witness was collated
# against a modern critical edition. Remote and restricted artifacts bound as
# inspected were fetched whole over verified TLS on 2026-10-16 and matched to
# their registered SHA-256 before any page was read.
#
# Registered by the first research (src/sources/works): facsimile excerpts of
# Migne PL 9, 26 and 24, of the Venice Aquinas tomus III and of the Parma
# Aquinas vol. 14; passage records for the Week XXIX formulary, the ICEL
# excerpt, 18 October in the 2026 calendar and no. 145 of the 1981 Ordo; the
# readings page in its state of 2026-10-16; and three US GIRM chapter states
# registered from the context stage's recorded hashes.
#
# Registered by the revision's research (handoff items 1-7): Internet Archive
# captures of the official US GIRM chapters VII and VIII and of the readings
# page, read whole; the NABRE Psalms and Isaiah introductions in the states
# read; the Holy See's message and video message for the 100th World Mission
# Day and the Pontifical Mission Societies (USA) page for World Mission Sunday
# 2026; Feltoe's Verona sacramentary (complete scan, tracked) and Wilson's Old
# Gelasian (parent scan with three tracked page extractions); page-image
# excerpts of Schuster, The Sacramentary III, pp. 182-185 and of The
# Liturgical Year XI, pp. 472-485; and the Lewis and Short Latin Dictionary
# (Harper issue) with a tracked excerpt of its title leaf and p. 1101.
#
# Still read from public deliveries the library does not register, and
# therefore unbound: the Nova Vulgata books and the SBL 1 Thessalonians and
# Philippians files; their retrieval dates, sizes and SHA-256 values are in
# research/scope.md section 5.


