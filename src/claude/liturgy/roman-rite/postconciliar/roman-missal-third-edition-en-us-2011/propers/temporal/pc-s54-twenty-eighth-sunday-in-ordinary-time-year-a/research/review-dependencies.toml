# Controlling evidence this leaf's research reads outside the leaf and outside
# the ancestry of its registered source bindings. The engine separately seals
# the leaf's own research/, propers/ and instance/ records, every bound source
# record with its ancestry and available payloads, and, for the chronology, the
# computation code, the stable PC identity registry, every file the chronology
# computation opens and every source its answer cites.
#
# - The Week XXVIII directory is this edition's canonical shared Missal owner.
#   It alone carries the formulary's witnesses, and the research stage added
#   seven bounded findings to it (passage records; the Collect's, the Prayer
#   over the Offerings' and the Prayer after Communion's early witnesses; the
#   Entrance antiphon's ending; the antiphons against the Nova Vulgata; and, at
#   the re-entry, the United States English of the General Instruction). It is
#   fingerprinted into research/chronology.toml.
# - The edition registry directory holds the index, the formula dispositions
#   (row PC-S54-A, which names the owner) and the 2026 occurrence record. The
#   first two are fingerprinted into the chronology record; the third carries
#   the dated occurrence that research/context.md resolves.
# - The two postconciliar calendar files are the finding aids
#   research/context.md used for the day and precedence computations. They are
#   computation inputs to that record and not appointment authorities; the
#   index's antiphon citations are Vulgate-numbered by its own convention and
#   its psalm in Hebrew numbering, and its omissions of Cf. are not followed.
# - Rights. The two postconciliar proper inventories hold the ot-28 rows read
#   as leads (the Collect's recorded Hadrianum source and the Prayer after
#   Communion's recorded Verona source, which the research stage then checked;
#   the English antecedent of the Prayer over the Offerings, which belongs to
#   another form of the rite and is not used). The Latin and English rights
#   records settle why neither the Latin typical text nor the approved English
#   is reproduced; the Catholic Encyclopedia rights record settles the
#   public-domain standing of the article texts quoted in short phrases in
#   research/scope.md. Artifact records name these only in prose, so binding
#   ancestry does not reach them.
# - The author-standing registry is the one record of which authors may carry
#   a reading (research/interpretations.md names the carrying authors of each;
#   Cyril of Jerusalem's absence from it is why he supports only). The
#   formulary-loci file is the finding aid that located the liturgical
#   commentators' loci on the Collect. Neither is a witness to any text.
# - The five authored Scripture-chronology files are the corpus whose answer is
#   research/chronology.toml and research/chronology-annotations.tex. Every date
#   the concise opening may print comes from them and from nowhere else. The
#   sources they cite for this leaf's answers are bound by source ID in
#   research/source-bindings.toml, which seals each cited record and, for the
#   Catholic Encyclopedia articles, the tracked article text that was read.
#   Their Davidic attribution binding is also the record that Psalm 22 carries
#   no traditional-attribution answer (research/scope.md section 8.1).
# - The canon and concordance data the chronology computation opens to convert
#   the Hebrew-numbered psalm (Psalm 23 to Vulgate 22): the Clementine book
#   index and chapter files, and the verse texts of the three editions that
#   scripts/_psalter.py and scripts/_deuterocanon.py read to build the Psalter
#   concordance (the Douay-Rheims (Challoner), the Revised Version and the
#   World English Bible Catholic edition), each declared by edition directory.
#   The Douay directory is also where the research stage read its study-text
#   boundaries. The proper-study-v4 seal traces these reads itself; they are
#   declared here as well so that the declaration is complete under v3.
# - The liturgical authorities (national calendar, Missal, Universal Norms,
#   General Calendar, 2008 variation list, Antiphonary, Ordo lectionum Missae,
#   dated readings page, Nostra aetate) are not declared here because each is
#   bound by source ID in research/source-bindings.toml, which seals its
#   record and ancestry. The General Instruction relied on is the governing
#   United States English, read at the research re-entry and bound by source
#   ID in its hash-identified chapter II and chapter VII states; the Latin text
#   printed in the 2002 Missal artifact, also bound, was read beside it.
