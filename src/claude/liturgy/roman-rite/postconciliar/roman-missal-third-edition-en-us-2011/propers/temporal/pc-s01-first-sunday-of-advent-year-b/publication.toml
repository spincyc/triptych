[document.homily]
pdftitle = 'First Sunday of Advent, Year B: God Is Faithful'
pdfsubject = '''A homily for an adult parish assembly on the proper of the First Sunday of Advent, Year B, in the Roman Missal, Third Edition, for the dioceses of the United States of America, with Lectionary no. 2, 29 November 2026: the command to watch spoken to all, the people of Isaiah who confess that none calls on God's name and then call him Father, the clay and the potter, the petition that God turn his people and give them the will to meet Christ, the servants given their work, Paul's thanks for a faulty church and God's fidelity, and the prayers of the Mass'''
title = 'The First Sunday of Advent, Year B'
