# Publication-local record of how this leaf's research used the reusable source
# library on 2026-09-24, in the research stage of run ed9acebf389f8706. It
# supplements propers/verified.md (text control), research/scope.md (reception
# matrix, bounds, negatives) and research/interpretations.md.
#
# States say what this stage did, not what a record could support. `inspected`
# means this stage read the stated loci itself, in the language and form each
# binding's context states. Nothing here is `verified`: no reception witness
# was collated against a modern critical edition. Remote and restricted
# artifacts bound as inspected were fetched whole over verified TLS on
# 2026-09-24 and matched to their registered SHA-256 before any page was read.
# Several library records were registered by earlier productions; their
# existence was used to find the text, and every locus bound as `inspected`
# was re-read here.
#
# Registered at this stage (src/sources/works): the Jerome In Hiezechielem work
# and its 1845 Migne edition with three page images; a Migne 1845 edition of
# Jerome In Danielem with one page image; facsimile excerpts of PL 26 (cols.
# 155-156), PL 9 (cols. 1039-1042), PL 37 (cols. 1539-1542) and the Venice
# Aquinas tomus III (pp. 275-276, 660, 668); two CSEL 22 page images; the
# passage records for 27 September in the 2026 calendar and its Spanish title
# list, the Week XXVI formulary at artifact pp. 289-290, the ICEL excerpt's
# Twenty-sixth Sunday, OLM no. 136 and Praenotanda no. 80; the dated readings
# page for 27 September; and two dated states of GIRM chapters II and VII.
#
# Read from public deliveries the library does not register, and therefore
# unbound: the Nova Vulgata Gospel of Matthew and the current NABRE Psalms
# introduction; their retrieval dates, sizes and SHA-256 values are in
# research/scope.md section 5.
#
# Research re-entry, 2026-09-24 (iteration 1). Registered then: a new dated
# state of the readings page for 27 September (same length, different
# SHA-256, restricted and not retained) with a passage describing the order of
# the sons and the answer of Matthew 21:31. Bound then: that passage; Nostra
# aetate 4 in its registered English web state, fetched whole over verified
# TLS and matched to its registered SHA-256 before it was read; and the
# searches of the negative result on Augustine and the parable of the two
# sons (research/scope.md sections 3.1 and 6).
#
# Negative searches. The search for an exposition of the parable of the two
# sons by Augustine ran over three tracked, indexable text/plain artifacts,
# and is bound below: each zero-result query as `negative-search`, and each
# query with hits as a `searched` lead whose hits were read and are named.
# The other negative searches this leaf records (the two orations' earlier
# witnesses, in research/scope.md section 6 and the Week XXVI owner) ran over
# remote OCR files or a PDF text layer that are not registered as indexable
# text/plain representations, so they have no replayable receipt and no
# binding; they are described there with their limits.

