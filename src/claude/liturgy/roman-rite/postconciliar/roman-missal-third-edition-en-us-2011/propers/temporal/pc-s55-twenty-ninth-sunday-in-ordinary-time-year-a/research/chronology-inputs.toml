# Appointment-query input for tools/tpt proper-chronology. It carries citations
# and ownership only. It authors no date and is not a chronology source.
# Citations are those of instance/manifest.md and propers/verified.md; Missal
# elements are owned by the Week XXIX shared owner, Lectionary elements by
# this leaf. Each printed ref keeps the numbering of the witness that prints it.
#
# - Entrance antiphon: the Missal's own locator, Cf. Ps 16, 6.8, in Vulgate
#   numbering (Hebrew 17:6, 8). The owner's finding 1 shows an adaptation (v. 6
#   without mihi, v. 7 passed over, the opening phrase of v. 8 omitted and a
#   vocative added), so the relationship is adaptation.
# - Responsorial psalm: Hebrew numbering, the printed form of the United States
#   witnesses (Psalm 96; the Latin Ordo prints Ps 95, 1 et 3. 4-5. 7-8.
#   9-10a et c), converted by the canonical concordance. The Hebrew and Vulgate
#   verse numbers of this psalm coincide. The dated page prints the fourth
#   strophe's locator as 9-10 but gives only 10a and 10c, as the Ordo cites; the
#   Ordo's locator is entered. The response is v. 7b as the Ordo and the dated
#   page cite it.
# - Second reading: 1 Thessalonians 1:1-5b; the appointment ends within v. 5.
# - Gospel acclamation: Philippians 2:15d, 16a as the Ordo and the dated page
#   print it, without Cf. The Ordo's Latin gives the two cola as the
#   Clementine has them without the opening inter quos, so the citation is
#   entered as appointed partial-verse wording, not as an adaptation. The
#   element is keyed acclamation, as in instance/manifest.md: the orientation
#   projection gives every key beginning with gospel a narrated-event row
#   (research/scope.md section 8.1).
# - Communion antiphon A: the Missal's printed Vulgate locator with its Cf.
#   (2002 Latin "Cf. Ps 32, 18-19"; ICEL excerpt "Cf. Ps 32: 18-19"); Hebrew
#   Psalm 33:18-19, the verse numbers coinciding.
# - Communion antiphon B: the Missal prints Mc 10, 45 without Cf., but the
#   owner's finding 3 shows an adaptation (Nam et and the contrast of service
#   omitted), so the relationship is adaptation.
