location = "src/sources/chronology/bindings.yaml, the `traditional-attribution` bindings of `israel.monarchy.david-traditional-era`; src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s54-twenty-eighth-sunday-in-ordinary-time-year-a/research/scope.md section 8.1"
note = "The Davidic attribution bindings reach Psalms 32, 33, 39, 70, 85, 94, 97, 107, 118, 137, 140 and 144. They do not reach Vulgate Psalm 22, although its tracked Clementine title reads 'Psalmus David' (Douay 'A psalm for David'). So the responsorial psalm's chronology carries no attribution era, which scripture-chronology section 8 says should not disappear with the unproved occasion. The leaf correctly preserves the corpus state and names the gap. This is a shared-corpus binding gap for its maintainers, not a research defect of this leaf."
