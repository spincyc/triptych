# Publication-local record of how this leaf's research used the reusable source
# library. Written on 2026-11-26 by the research stage (iteration 0) of
# proper-study run 99f04ef5cf9b711b. Research iteration 1 (the same day) added
# the Jerome-on-Matthew binding (Migne PL 26, last), restated the Bede binding's
# attributions and added the official loci research/context.md cites. It supplements propers/verified.md and the
# shared owner's verified.md (text control), research/scope.md (reception
# matrix, bounds, negatives) and research/interpretations.md.
#
# States say what research did, not what a record could support. `inspected`
# means this run's research or context-resolution stage read the stated loci
# itself, in the language and form each context states; for the official
# controls read by the context stage the context says so. Nothing here is
# `verified`: no reception witness was collated against a modern critical
# edition. Remote and restricted artifacts bound as inspected were fetched
# whole over verified TLS on 2026-11-26 and matched to their registered SHA-256
# before any page was read. A `["cataloged"]` binding records a registered
# source that was not read (a lead, or a registered state that differs from the
# state read).
#
# Reconciled on 2026-11-26 by the source-registration stage (iteration 0) of
# the same run. The deliveries research and context read that the library did
# not yet hold are now registered from their re-hashed receipts and bound
# below: the Nova Vulgata Isaiah page, the NABRE Isaiah 64 page with its notes,
# the readings page in its state of 2026-11-26, the Internet Archive capture of
# GIRM chapter II, the Catholic Culture Advent-wreath transcription in its
# state of 2026-11-26, and seven New Advent pages read only as cross-checks of
# tracked texts. The bindings of the earlier, unread states of the readings
# page and of the transcription are replaced by bindings of the states read.
# The Gelasian OCR and the inventory's Verona passage, both inspected as
# finding aids, are bound as context rather than as leads. Two deliveries are
# deliberately unregistered because nothing in them is the source: the NABRE
# Isaiah 63 challenge page and the 4,608-byte augustinus.it response
# (research/scope.md section 5). research/source-dispositions.toml records the
# reusable-source disposition of every binding.
#
# Reconciled again by the source-registration stage (iteration 1) after
# research iteration 1. Nothing new was read that the library did not hold;
# the Jerome-on-Matthew reading is also bound (last) through the library's
# existing segment for Jerome's commentary inside the Migne volume, so that the
# witness carries Jerome's work identity as well as the container's.


