# The twelve keys of instance/manifest.md and propers/verified.md, in
# liturgical order. The Preface is appointed by the formulary's rubric; the
# solemn blessing is optional. The Alleluia verse is keyed `acclamation`
# (research/context.md, Appointed inventory).
element_keys = ["entrance-antiphon", "collect", "first-reading", "responsorial-psalm", "second-reading", "acclamation", "gospel", "prayer-over-offerings", "preface", "communion-antiphon", "prayer-after-communion", "solemn-blessing"]

# Physical-page roles of the concise companion's fixed opening
# (guidance/liturgy/propers-three-documents.md), to be written by the concise
# author. The chronology role is the generated page; the study's reviewed home
# for the same chronology is its terminal Scriptural Date and Location
# appendix (component scriptural-date-location).
[presentation]
inventory = "concise-inventory"
overview = "concise-overview"
chronology = "concise-date-location"
themes = "concise-themes"
