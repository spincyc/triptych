# --- Interpretations of the whole Mass ----------------------------------------
#
# Lane keys are those of research/interpretations.md. `authors` names every
# Father, Doctor or saint whose own exegesis the lane's section develops, as
# src/sources/inventories/author-standing-v1.toml names them; `carrying_authors`
# names those whose checked reasoning carries the reading in that record.
# Theophylact, an ecclesiastical writer read only through the Catena aurea, is
# not cited.
#
# rend-the-heavens: Bellarmine supports the psalm, the acclamation and the
# Communion antiphon; Chrysostom supports on 1 Corinthians 1:7; Gregory and
# Bede support on the man gone abroad. They do not carry the reading.
#
# watch-at-the-door: Aquinas (1 Corinthians 1:8) and Bellarmine (Psalm 24)
# support the element contributions and do not carry the reading. Bede carries
# it for Mark 13:34-37 only; his comments on 13:32-33 are Jerome's.
#
# clay-and-faithful-potter: Bellarmine (Psalm 79) and Bede (Mark 13:34) support
# and do not carry the reading.

[[lanes]]
key = "rend-the-heavens"
authors = ["Jerome", "Thomas Aquinas", "Augustine of Hippo", "Cyril of Jerusalem", "Robert Bellarmine", "John Chrysostom", "Gregory the Great", "Bede"]
carrying_authors = ["Jerome", "Augustine of Hippo", "Cyril of Jerusalem", "Thomas Aquinas"]
sources = ["research/interpretations.md", "research/scope.md", "research/source-bindings.toml"]
senses = ["literal", "allegorical", "moral", "anagogical"]
element_keys = ["entrance-antiphon", "collect", "first-reading", "responsorial-psalm", "second-reading", "acclamation", "gospel", "prayer-over-offerings", "preface", "communion-antiphon", "prayer-after-communion", "solemn-blessing"]
component_keys = ["rend-the-heavens"]

