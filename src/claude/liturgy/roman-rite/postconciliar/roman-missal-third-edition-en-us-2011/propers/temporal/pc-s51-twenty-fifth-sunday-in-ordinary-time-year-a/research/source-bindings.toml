# Publication-local record of how this leaf's research used the reusable source
# library on 2026-09-19, in the research stage of run 472e2eb20876b22a. It
# supplements propers/verified.md (text control), research/scope.md (reception
# matrix, bounds, negatives) and research/interpretations.md.
#
# States say what this stage did, not what a record could support. `inspected`
# means this stage read the stated loci itself, in the language stated. Nothing
# here is `verified`: no reception witness was collated against a critical
# edition or an original-language text. Each binding's context says whether the
# locus was read on a page image of a printed edition, in an electronic text,
# in OCR, or in an English translation. Several of these library records were registered by an
# earlier production for another provider. Their existence was used to find
# the text; every locus bound as `inspected` was re-read here, and no earlier
# reading, summary or verdict was relied on.
#
# No `negative-search` binding appears. The one negative this stage records
# (oration incipits) was a recursive literal search of tracked files, which is
# not a canonical tool mode over a registered search representation, so it has
# no replayable receipt. It is described, with its limits, in the Week XXV
# owner and in research/scope.md.
#
# Scripture is bound at the per-book verse-text artifacts actually opened, since
# an edition record cannot carry an inspected state.
#
# Read from public deliveries the library does not register, and therefore
# unbound: Augustine, Enarrationes in Psalmos 118 (sermons 2-4) and 144, Latin,
# augustinus.it; the Nova Vulgata Gospel of Matthew, vatican.va; and, on the
# second re-entry, the current delivery of the NABRE Psalms introduction,
# bible.usccb.org, whose registered earlier state is bound below. Retrieval
# dates, byte sizes and SHA-256 values are in research/scope.md section 5. The
# sentences of Enarr. 118 s. 4.1-2 and 144.10-11 that the records quote were
# checked on the research re-entry against Migne PL 37, which is bound below.
#
# Research re-entry, iteration 1 (2026-09-19). Added: the calendar, Missal,
# Ordo lectionum, variation-list, Antiphonary and General Instruction records
# this leaf's identity, occurrence, boundaries and branches rest on, each
# re-read from hash-matched bytes fetched over verified TLS; Jerome on Isaiah
# from an edition-identified printing (Migne PL 24, 1865) in place of the
# unverifiable remote delivery, which is no longer bound; and the second and
# later-tier reception witnesses of research/scope.md section 3.
#
# Research re-entry, iteration 2 (2026-09-19). Added, at the end of the file:
# the nine source records the Scripture chronology corpus cites for every
# answer in research/chronology.toml, on which the page-2 Date column rests.
# Each of the eight Catholic Encyclopedia articles is bound twice: the exact
# record the corpus cites (the remote New Advent delivery, whose bytes this
# stage did not re-obtain: catalogued only) and its tracked article-text
