context = "Extent read: Chapter 41 entire with the end of chapter 40 (container physical lines 50380-50450), re-read on the research re-entry. Augustine argues from Colossians 4:3, where the apostle asks prayer that God open a door for the word, that the beginning of faith is God's gift, since it would not be asked of him unless it were believed to be given by him; he then names Lydia (Acts 16:14) as one on whom 'this gift of heavenly grace had descended', whose heart the Lord opened, 'for she was so called that she might believe'. Acts 16:14 is his instance of the gift; the argument from prayer is made from Colossians. Doctrinal use of the verse in controversy, not a commentary on Acts."

