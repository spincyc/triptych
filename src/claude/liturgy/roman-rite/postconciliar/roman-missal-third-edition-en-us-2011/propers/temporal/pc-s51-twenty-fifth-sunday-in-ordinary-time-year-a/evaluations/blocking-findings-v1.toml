[[advisories]]
stage = "web-review"
id = "WEB-001"
severity = "advisory"
location = "build/web/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s51-twenty-fifth-sunday-in-ordinary-time-year-a.md, whole document: nothing between the title block (lines 5-14) and the first section (line 16) stands for the PDF's Contents on p. 1"
problem = "The study PDF opens with a Contents list of its eleven sections with page numbers. tools/web-edition (line 1099) deletes \\tableofcontents, and neither the Markdown nor the site layout supplies any replacement. The published page is about 54,000 px tall at a 1280 px viewport and about 74,000 px tall at 500 px. It has 11 h2 and 51 h3 headings and no in-page navigation. Every heading carries an id, so nothing is unreachable by link, and the loss is navigation apparatus rather than text. guidance/web-editions.md neither declares this omission nor gives a reason for it, and the generate-web audit lists it only as an item for the reviewer."
required_result = "Either the canonical web edition offers in-page navigation equivalent to the PDF's Contents, or the decision to drop print navigation from long studies is recorded in guidance/web-editions.md where a reviewer will meet it. For the first, the converter could emit a [TOC] marker for an entrypoint that requests \\tableofcontents, and the site's already-enabled toc extension would render it as a linked list of the sections."

[[advisories]]
stage = "web-review"
id = "WEB-002"
severity = "advisory"
location = "build/web/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s51-twenty-fifth-sunday-in-ordinary-time-year-a.md lines 258-268, 320-330 and 386-396 (the three 'The four senses of this interpretation' blocks), and line 13 (the title-block subtitle); PDF pp. 17-18, 23 and 29"
problem = "The source sets the four senses as a description list (fourSenses in format.tex). The PDF therefore prints each label (Literal., Allegorical., Moral., Anagogical.) as a bold term with its text in a hanging indent. The converter writes each label as plain text followed by a two-space Markdown hard break. On the site that break is lost: render_source_page runs rewrite_links, which calls rstrip() on every line (tools/public-alpha, line 2968) before rendering, so the trailing spaces are gone first. In headless Chromium the rendered page carries no <br> in <main> at all. Each label runs straight into its paragraph at body weight, for example 'Literal. A landowner hires workers at five hours of one day…'. The generate-web note that each label is 'followed by a line break' is true only of scripts/_markdown_render.py on its own. The same stripping joins the two lines of the subtitle at line 13, which does no harm. Nothing is lost or confusable: all four senses are present, named, in order, each in its own paragraph under its own h3. But the one structure the three-documents contract requires of every interpretation is the one place where the source's distinction between label and body is dropped rather than adapted."
required_result = "On the published page, the four sense labels carry a weight or structure that survives the site's page path, so that each interpretation's senses can be scanned as easily as in the PDF. For example, the converter could write each description term as a bold run-in label, '**Literal.** …' (the form the tracked gpt proper editions already use and the site already renders), or the site could stop stripping Markdown hard breaks."

