[[advisories]]
stage = "homily-review"
id = "HOM-001"
severity = "advisory"
location = "sections/homily/90-note.tex, paragraph 'Relation to the reviewed interpretations', the sentence beginning 'That the psalm's two words describe the householder's two dealings' (lines 36-41); with sections/homily/10-homily.tex lines 82-85 ('That is why this wage cannot be cut into shares ... he has no smaller self to give the latecomer'), lines 65-67 ('The men at the back of the line reasoned by the thoughts of men: more hours, more pay') and lines 112-114 ('So the murmur in this parable is no report from heaven. It is set before us now')"
problem = "The note names four connections as the study's own, 'drawn from the wording of the texts; no Father makes them', and the sentence reads as the list of them. It leaves out the largest editorial step in the speech, the one its title rests on: that the parable's denarius is God giving himself and therefore cannot be divided. In the body that step is spoken in the preacher's voice directly after Jerome on the coin and Augustine on Psalm 144:18, and the accepted study marks it expressly as a joining of separate texts ('Two other witnesses say what the last reward is, each of his own text and neither of the parable', sections/40-because-i-am-good.tex lines 104-105). Two smaller steps of the same kind are also unlisted: the application of Isaiah 55:8 and Aquinas's antithesis to the labourers' arithmetic, and the inference drawn after Chrysostom's sentence that the murmur is set before the hearers now. It does not block because the body introduces Augustine as preaching on the psalm, the loci paragraph places his sentence at Enarrationes 144.22, and each attribution in the speech is accurate, so no reader is told that a Father said what he did not say; the defect is an incomplete account of which steps are the study's."
required_result = "Beside the four connections already listed, the note says that identifying the parable's wage with God's gift of himself joins Jerome on the coin to Augustine on Psalm 144:18 and is the study's synthesis, and either names the two smaller applications as well or words the sentence so that it does not read as a complete list. The speech itself needs no change."

[[advisories]]
stage = "homily-review"
id = "HOM-002"
severity = "advisory"
location = "sections/homily/10-homily.tex, the spoken body as a whole; most nearly the sixth movement, lines 138-143 ('Before this Mass ends another line will form ... The Lord himself, the pledge of that one wage')"
problem = "The three-document profile makes the Homiletic Directory's orientation govern the homily's movement: the readings and prayers lead through Christ's Paschal mystery to Eucharistic participation and daily life. The speech reaches Communion and the coming week, but it never names the Lord's death or rising and never names Jesus as the teller of the parable. A search of the spoken body finds 'Christ' only in the three sentences on Philippians and 'The Lord himself' once at the Communion line, and finds no cross, blood, sacrifice, resurrection or 'Jesus'. The central claim, that the householder's wage is the giver himself, is therefore preached without the act in which he gives himself. The accepted study holds material that the derivation left out (Gregory on the thief as the labourer of the eleventh hour, Hom. in Evang. 19.3, and on the shepherd who feeds the redeemed with his own body and blood, 14.1). It does not block because the Communion movement does carry the assembly to Eucharistic participation, Christ is proclaimed as the wage in the Philippians movement, and the argument is complete and true without the addition."
required_result = "If the speech is revised, one sentence, most naturally at the second line, says that the Lord given alike to each is the one who gave himself in his death and rising, so that the claim 'he gives himself' names how; the speech stays within its present length and adds no unsourced attribution."

[[advisories]]
stage = "research-review"
id = "RES-017"
severity = "advisory"
location = "research/scope.md section 4 'Consequence' (final sentence) and section 3.6 (closing paragraph, 'independently and a generation apart'); research/interpretations.md Reading 1, Jerome on Matthew row ('An earlier witness to the scheme than Augustine or Gregory') and 'Strongest difficulty' ('Jerome, the earliest witness read for the scheme'), and Reading 3, 'Augustine's development' with the Gregory 19.4 and Hilary Aleph 12 rows ('independently')"
problem = "The records rank the witnesses read by date and call several of them independent, yet no dating or dependence evidence for any patristic work is cited or bound. Scope section 4 says the earliest witness read for the ages of a life as his own view is Jerome. Chrysostom was read, holds that reading as his own (Hom. in Matt. 64.3), and the library's sealed work record places his homilies at Antioch in the 390s, while the library's record for Jerome's commentary, which is outside the seal, gives 398; on the library's own records that limb is unsupported and probably false. The sealed work record for Augustine's Sermo 87 gives its composition as unknown, so 'an earlier witness than Augustine' is unsupported as well. 'A generation apart' is said of Hilary (library: c. 364-367) and Augustine's Enarr. 118, whose date the record nowhere gives. 'Independently' reads as a claim that Gregory did not draw on Augustine, nor Augustine on Hilary, which nothing read establishes, and the record itself reports an editor's statement that Hilary drew on Origen. This reviewer verified none of these dates at a source; the defect is that the record asserts an order and an independence it has not evidenced. No reading, element contribution or sense depends on them, and the standing limits already forbid calling a reading the earliest, which is why this does not block."
required_result = "Remove the statements of priority, interval and independence, keeping what each author says and that Jerome reports the ages-of-the-world reading as others'; or support each with a checked and bound dating or dependence source. In particular do not name Jerome the earliest witness read for the ages of a life while Chrysostom 64.3 holds it as his own, and replace 'independently' with wording that says only that the author states the point himself of his own passage. Until then the studies should state no order of priority among the witnesses."

[[advisories]]
stage = "research-review"
id = "RES-018"
severity = "advisory"
location = "research/context.md, 'The Ordo's own tituli (added on research re-entry)', first sentence"
problem = "Praenotanda no. 106 is given in English inside quotation marks ('is shown by the careful choice of the tituli set over the individual readings'). Research read the paragraph only in Latin, and this review confirmed the Latin on the page image of printed p. XLV: 'Relatio autem inter lectiones eiusdem Missae ostenditur per accuratam selectionem titulorum qui singulis lectionibus praeponuntur.' The English is therefore this leaf's own rendering presented as a quotation; no English witness of the General Introduction to the Lectionary is bound, and whether the wording coincides with the approved English was not checked. A study author may print it as the document's English. The leaf audit states the same point without quotation marks and is not affected."
required_result = "Quote the Latin sentence with its locator, or give the English without quotation marks as this leaf's paraphrase of the Latin."

[[advisories]]
stage = "research-review"
id = "RES-019"
severity = "advisory"
location = "research/scope.md section 3, 'Quotation check', first sentence"
problem = "The count does not reconcile: thirty-three quotations searched, thirty-two matched, and two of Gregory's corrected. Thirty-two matches leave one quotation that did not match, and two are said to have been corrected, so the fate of at least one quotation is unstated. Two reviews have since matched the quotations in the texts, so no quotation is known to be unverified; the defect is in the audit statement."
required_result = "State counts that reconcile: how many quotations were searched, how many matched as first written, which did not, and what was done with each."

[[advisories]]
stage = "synthesis-review"
id = "SYN-001"
severity = "advisory"
location = "sections/concise/10-commentary.tex, subsection 'The murmur, and what the householder's reply decides', first paragraph, lines 105-110 (rendered page 6): 'Chrysostom will have neither as a fact about the saved ... The complaint is a device of the story (64.3). On his account the murmuring and the reply, a third of the parable, have little to do'"
problem = "Two compressions in one place say more about Chrysostom than the accepted study or Hom. in Matt. 64.3-4 does. (1) 'Chrysostom will have neither' makes him set aside Gregory's and Jerome's explanations, which he does not address. Gregory starts from the very premise Chrysostom voices (Hom. in Evang. 19.4: 'Coelorum etenim regnum nullus murmurans accipit, nullus qui accipit murmurare potest'), which the paragraph's opening clause gives without a name, and Jerome's envy is that of every earlier calling toward the Gentiles, not a state of the saved. The study says only that on the second interpretation the murmuring cannot be a fact about the saved and that Chrysostom says so with force; research/scope.md section 7 classes the three accounts of the murmuring as complementary. (2) The concise drops what Chrysostom says the device is for ('to teach us that these have enjoyed such honor, as could even have begotten envy in others', 64.3) and moves the study's judgement 'on this interpretation they have little to do' onto 'his account', although the same subsection two paragraphs later reports his statement that the Lord frames the story to show 'that the whole is of His love to man' (64.4). The reader is given a mild opposition the sources do not state and a harsher verdict on Chrysostom than the study reaches. It does not block because every quotation is exact, the three positions are each reported truly, and the sentence carries its own limit ('as a fact about the saved')."
required_result = "State Chrysostom's account beside the other two in his own terms without making him answer them: for him the complaint depicts no real grievance of those men and is brought in to show how great an honour the late comers receive (64.3). Keep the judgement that the murmuring and the reply are left with little to do as a judgement about the second interpretation, as the study has it, and not as a description of Chrysostom's account."

[[advisories]]
stage = "synthesis-review"
id = "SYN-002"
severity = "advisory"
location = "sections/concise/01-inventory.tex, note under the map, line 40 ('every other element is required'), with sections/concise/90-apparatus.tex, paragraph 'Text and English'"
problem = "The accepted study makes the same statement under its map and qualifies it in its scope appendix: 'Whether the United States Lectionary admits another Alleluia verse from a common set was not determined' (sections/90-apparatus.tex), which propers/verified.md also lists as outstanding. The concise apparatus keeps the study's other open question of text (the Greek evidence for Matthew 20:16 and the 16a lettering) and drops this one, so the concise says without qualification that the Alleluia verse is required while the records hold the point open. The appointment itself is not in doubt and no argument rests on the verse being the only one admitted, which is why this does not block."
required_result = "Restore the open question in the concise scope note in one sentence, beside the sentence on Matthew 20:16, or word the page-one note so that it does not assert more about the Alleluia verse than the records establish."

[[advisories]]
stage = "synthesis-review"
id = "SYN-003"
severity = "advisory"
location = "sections/concise/10-commentary.tex, subsection 'Whose work is the coming? The opened heart and the psalmist's wish', last sentence, lines 250-252 (rendered page 9): 'The step rests on Augustine's argument and on no agreement between the two, and it does not reach the claim with which the third interpretation began, which Chrysostom states for himself.'"
problem = "In the study the corresponding sentence has Chrysostom's different reading of Acts 16:14 as its subject: that difference 'does not reach the first step or the claim with which this interpretation began'. Compression joined it to a sentence whose subject is 'the step', so 'it' now reads as the second step and the clause says that the step does not reach the claim, which is not what is meant; 'the first step' was dropped as well. A reader can recover the sense from the preceding sentences, so nothing false is conveyed, but the sentence that bounds the one real difference in the third interpretation is the least clear in its paragraph."
required_result = "Give the clause its own subject, for example that the difference between the two readings of Acts 16:14 touches neither the first step nor the claim with which the third interpretation began, which Chrysostom states for himself."

[[advisories]]
