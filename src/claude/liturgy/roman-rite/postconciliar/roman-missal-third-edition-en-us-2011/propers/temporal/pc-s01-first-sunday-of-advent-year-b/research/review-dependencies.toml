# Controlling evidence this leaf's research reads outside the leaf and outside
# the ancestry of its registered source bindings. Written on 2026-11-26 by the
# research stage (iteration 0) of proper-study run 99f04ef5cf9b711b. The engine
# separately seals the leaf's own research/, propers/ and instance/ records,
# every bound source record with its ancestry and available payloads, and, for
# the chronology, the computation code, the stable PC identity registry, every
# file the chronology computation opens and every source its answer cites.
#
# - The First Sunday of Advent directory is this edition's canonical shared
#   Missal owner. It alone carries the formulary's witnesses; the research
#   stage added findings 5-8 to it (the antiphons against the Nova Vulgata; the
#   Collect's Old Gelasian witness; the Verona witnesses of the Prayer over the
#   Offerings, the Prayer after Communion and the Preface's closing clause).
# - The edition registry directory holds the index, the formula dispositions
#   and the 2026 occurrence record (row PC-S01-B) that research/context.md
#   resolves.
# - The two postconciliar calendar files are the finding aids
#   research/context.md used for the day and precedence. Their index gives the
#   Entrance antiphon as Psalm 25:1-3 with no Cf. and no numbering flag, which
#   this leaf records and does not follow.
# - Rights and provenance. The two postconciliar proper inventories hold the
#   advent-1 rows read as leads (the Prayer over the Offerings' recorded Verona
#   source, which research checked on page images). The Latin and English
#   rights records settle why neither the Latin typical text nor the approved
#   English is reproduced; the Catholic Encyclopedia rights record settles the
#   standing of the Maas passages behind the Gospel's event row.
# - The author-standing registry decides which authors carry a reading
#   (research/interpretations.md); the formulary-loci file and the
#   passage-commentary index are the finding aids that located the reception
#   witnesses and found no liturgical commentator for this Mass.
# - The six Scripture-chronology files are the corpus whose answer is
#   research/chronology.toml, chronology-annotations.tex and chronology-table.tex.
# - The canon and concordance data the chronology computation opens to convert
#   the Hebrew-numbered psalm: the Clementine book index and chapter files and
#   the verse texts of the three editions that build the Psalter concordance.
#   The Douay directory is also where research read its study-text boundaries.
