appointment_notes = ["entrance-antiphon: Cf. Psalm 24:1-3; adaptation; vulgate numbering; canonical verse queries, not appointed wording.", "collect: Composed oration with no scriptural locator. Its petition to go out with righteous deeds to meet Christ as he comes, and to be placed at his right hand, echoes several Gospel scenes (the virgins going out to meet the bridegroom, the sheep at the right hand) without being drawn from any one verse, which the page-2 rule excludes.", "first-reading: Isaiah 63:16b-17; 64:1, 3-8; appointed; vulgate numbering; whole-verse query envelope, not subverse chronology or appointed wording.", "responsorial-psalm: Psalm 80:2a, 2c, 3b, 15-16, 18-19; appointed; hebrew numbering; whole-verse query envelope, not subverse chronology or appointed wording.", "responsorial-psalm: Psalm 80:4; response; hebrew numbering; canonical verse queries, not appointed wording.", "second-reading: 1 Corinthians 1:3-9; appointed; vulgate numbering; canonical verse queries, not appointed wording.", "acclamation: Psalm 84:8; appointed; vulgate numbering; canonical verse queries, not appointed wording.", "gospel: Mark 13:33-37; appointed; vulgate numbering; canonical verse queries, not appointed wording.", "prayer-over-offerings: Composed oration with no scriptural locator; its offering of gifts drawn from God's own gifts is a commonplace of the Roman orations, not the wording of a verse.", "preface: Composed Preface with no scriptural locator. It gives thanks for Christ's two comings; its closing clause agrees in wording with a Verona sacramentary prayer for the Ascension, not with a verse of Scripture.", "communion-antiphon: Psalm 84:13; adaptation; vulgate numbering; canonical verse queries, not appointed wording.", "prayer-after-communion: Composed oration with no scriptural locator; its wording agrees with phrases of two Verona sacramentary prayers, not with a verse of Scripture.", "solemn-blessing: Optional composed blessing of three invocations and the Trinitarian blessing, with no scriptural locator; its references to Christ's two comings are not drawn from any one verse."]

