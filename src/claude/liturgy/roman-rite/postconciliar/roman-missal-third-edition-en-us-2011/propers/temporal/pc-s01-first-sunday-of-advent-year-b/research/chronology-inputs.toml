# Appointment-query input for tools/tpt proper-chronology. It carries citations
# and ownership only. It authors no date and is not a chronology source.
# Citations are those of instance/manifest.md and propers/verified.md; Missal
# elements are owned by the First Sunday of Advent shared owner, Lectionary
# elements by this leaf.
#
# - Entrance antiphon: the Missal's own locator, Cf. Ps 24, 1-3, in Vulgate
#   numbering (Hebrew 25:1-3). The owner's finding 1 shows an adaptation, so
#   the relationship is adaptation.
# - First reading: the Lectionary and the Ordo number Isaiah 63-64 with the
#   Hebrew chapter division (the Ordo: 63:16b-17, 19b; 64:2b-7; the United
#   States witnesses: 63:16b-17, 19b; 64:2-7). The vulgate query system is the
#   Clementine's, which keeps the older division: Lectionary 63:19b is
#   Clementine 64:1 (the whole verse, the cry to rend the heavens and the
#   mountains flowing down), and Lectionary 64:2-7 is Clementine 64:3-8. The
#   query therefore gives the same text in Clementine numbering, the numbering
#   the Douay-Rheims study text prints. Clementine 64:3 is a whole-verse
#   envelope: the Ordo reads its second member and the United States text its
#   first (propers/verified.md, Isaiah 64:2). Clementine 63:19 (Hebrew 63:19a,
#   omitted) and 64:2 (Hebrew 64:1, omitted) are not queried.
# - Responsorial psalm: Hebrew numbering, the printed form of the United States
#   witnesses (Psalm 80; the Ordo prints Ps 79, 2ac et 3b. 15-16. 18-19). The
#   Hebrew and Vulgate verse numbers of this psalm coincide. The Ordo's members
#   2a, 2c and 3b are entered, which the readings page's first strophe sings,
#   although that page's locator says 2-3. The response is v. 4, whose wording
#   the Ordo gives exactly.
# - Second reading: 1 Corinthians 1:3-9.
# - Gospel acclamation: Psalm 84:8 in Vulgate numbering (Hebrew 85:8), as the
#   Ordo prints it, without Cf., agreeing word for word with the Clementine.
#   The element is keyed acclamation, as in instance/manifest.md, so the
#   orientation projection gives it no narrated-event row.
# - Preface and solemn blessing: composed texts, not Scripture.
# - Communion antiphon: the Missal prints Ps 84, 13 without Cf., but the
#   owner's finding 2 shows the opening Etenim omitted, so the relationship is
#   adaptation.
