# Appointment-query input for tools/tpt proper-chronology. It carries citations
# and ownership only. It authors no date and is not a chronology source.
# Citations are those of instance/manifest.md and propers/verified.md; Missal
# elements are owned by the Week XXVIII shared owner, Lectionary elements by
# this leaf. Each printed ref keeps the numbering of the witness that prints it.
#
# - Entrance antiphon: the Missal's own locator, Ps 129, 3-4, in Vulgate
#   numbering (Hebrew 130:3-4; the verse numbers coincide). The Missal prints no
#   Cf., but the owner's finding 1 shows an adaptation (v. 3, the first colon of
#   v. 4 and a closing vocative found in neither Latin psalter read), so the
#   relationship is recorded as adaptation, not appointed wording.
# - Responsorial psalm: Hebrew numbering, the printed form of the United States
#   witnesses (Psalm 23; the Latin Ordo prints Ps 22, 1-3a. 3b-4. 5, 6), converted
#   by the canonical concordance. The Hebrew and Vulgate verse numbers of this
#   psalm coincide. The response is v. 6cd as the Ordo and the dated page cite it.
# - Gospel acclamation: the Ordo and the dated page print Cf. Ephesians 1:17-18;
#   the verse recasts Paul's prayer in the first person plural.
# - Communion antiphon A: the Missal's printed Vulgate locator with its Cf.
#   (2002 Latin "Cf. Ps 33, 11"; ICEL excerpt "Cf. Ps 33: 11"); Hebrew Psalm
#   34:11 in the count that numbers the title, 34:10 in English Bibles that do
#   not. The United States Lectionary does not print the antiphon.
# - Communion antiphon B: the Missal prints 1 Io 3, 2 without Cf., but the
#   owner's finding 3 shows an adaptation (the opening clause omitted, the
#   subject Dominus supplied), so the relationship is adaptation.
# - The two forms of the Gospel are separate element keys, as the manifest keeps
#   them; so are the two Communion antiphons.
