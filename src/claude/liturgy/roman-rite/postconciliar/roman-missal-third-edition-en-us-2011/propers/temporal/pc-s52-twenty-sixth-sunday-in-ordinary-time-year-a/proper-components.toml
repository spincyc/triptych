# --- Interpretive readings of the whole formulary ------------------------------
#
# Lane keys are those of research/interpretations.md. `authors` names every
# Father, Doctor or saint whose own exegesis the lane's section develops;
# `carrying_authors` names those the research record says carry the reading,
# as src/sources/inventories/author-standing-v1.toml names them.
#
# turning: Robert Bellarmine (on Psalm 24 and Psalm 129) and Ildefonso Schuster
# (on the Entrance Antiphon and the Collect) support and carry nothing.
#
# two-peoples: Augustine is developed for Psalm 24, for Ezekiel 18:25 (where he
# names no people) and, on John 10:26, as the contrary position to the
# reading's hope for the second son; Gregory the Great for the one fold of
# John 10:16; Hilary of Poitiers for his contrary identification of the sons,
# set beside the reading's claim. None of the three carries it.
#
# obedient-son: Hilary (on Psalm 118:50), Gregory (on John 10:15), Robert
# Bellarmine (on Psalm 24:9) and Ildefonso Schuster (on the Collect) support
# and carry nothing.

[[lanes]]
key = "turning"
authors = ["Jerome", "John Chrysostom", "Augustine", "Thomas Aquinas", "Robert Bellarmine", "Ildefonso Schuster"]
carrying_authors = ["Jerome", "John Chrysostom", "Augustine", "Thomas Aquinas"]
sources = ["research/interpretations.md", "research/scope.md", "research/source-bindings.toml"]
senses = ["literal", "allegorical", "moral", "anagogical"]
element_keys = ["entrance-antiphon", "collect", "first-reading", "responsorial-psalm", "second-reading-long", "second-reading-short", "gospel-acclamation", "gospel", "prayer-over-offerings", "communion-antiphon-a", "communion-antiphon-b", "prayer-after-communion"]
