# --- Interpretive readings of the whole formulary ------------------------------
#
# Lane keys are those of research/interpretations.md. `authors` names every
# Father, Doctor or saint whose own exegesis the lane's section develops;
# `carrying_authors` names those the research record says carry the reading,
# as src/sources/inventories/author-standing-v1.toml names them. Cyril of
# Alexandria, Justin Martyr and Cyprian, who have no standing row, and
# Novatian and the Epistle of Barnabas, witnesses to a variant reading only,
# are cited in the sections as supporting witnesses and are not listed.
#
# image-and-inscription: Jerome is developed as the literal alternative the
# reading carries; John Chrysostom (1 Thessalonians) and Bede (Mark 10:45)
# support the element contributions. None of them carries the reading.
#
# cyrus-and-caesar: Hilary of Poitiers and Ambrose of Milan are developed as
# the preserved disagreement over the ground of the debt; Bede (Mark 10:42-45)
# and Robert Bellarmine (Psalm 95) support. None of them carries the reading.
#
# sincere-heart: Hilary of Poitiers supports the christological point;
# Robert Bellarmine (Psalms 16 and 32) and Bede (Mark 10:45) support the
# element contributions. None of them carries the reading.

[[lanes]]
key = "image-and-inscription"
authors = ["Augustine of Hippo", "Ambrose of Milan", "Hilary of Poitiers", "Thomas Aquinas", "Jerome", "John Chrysostom", "Bede"]
carrying_authors = ["Augustine of Hippo", "Ambrose of Milan", "Hilary of Poitiers", "Thomas Aquinas"]
sources = ["research/interpretations.md", "research/scope.md", "research/source-bindings.toml"]
senses = ["literal", "allegorical", "moral", "anagogical"]
