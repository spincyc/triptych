role = "direct-witness"
states = ["cataloged"]
context = "The Missal formulary treated by this leaf. The authoring agent read the registered artifact publication-locally on 2026-07-25 at its pages 280-281 and recorded the heading, the antiphon citations with their Vulgate numbering, the three orations, and both Communion alternatives; the retrieved bytes hashed to the value recorded in the artifact manifest. The publication reproduces no complete oration in Latin and no protected English wording at all. This binding records the dependence without claiming to have replayed any central fingerprint; the publication-local reading recorded in research/source-audit.md is the verification ceiling asserted here."

[[bindings]]
source_id = "edition.catholic-church.missale-romanum.vatican-typica-tertia-2002"
loci = [
  "Tempus per annum, introductory rubrics 1-6",
  "Dominica XXVI per annum, Collecta",
  "Prex eucharistica I, Supra quae",
]
role = "textual-control"
states = ["cataloged"]
context = "Three further places in the same edition control claims in the guide: rubrics 1-6 of Tempus per annum govern the Gloria and Creed, the Preface selection, and the choice between the two Communion antiphons; the Twenty-sixth Sunday Collect (artifact page 289) supplies the Missal's own statement of Wisdom 12's theology of power shown in sparing; and the Roman Canon's Supra quae supplies the Abel formula that the Week XVI Prayer over the Offerings repeats. All three were read publication-locally on 2026-07-25 in the registered reproduction. No printed-page locus is asserted for them beyond the artifact pagination recorded in the audit."

