role = "reception"
states = ["cataloged"]
context = "Thomistic reception of the two appointed New Testament passages. The three tares loci carry the objection-and-reply structure in which Matthew 13:28-30 is used against compelling unbelievers, against tolerating heretics, and against killing sinners, with Chrysostom's Homily 46 and Augustine's Contra epistolam Parmeniani III.2 cited by Aquinas himself. The q. 83 loci carry his gloss that the Spirit 'asks' because he makes us ask. Read publication-locally on 2026-07-25 in the English Dominican translation at New Advent. A further check of q. 157 for a citation of Wisdom 12:18 returned nothing and is recorded as a bounded negative result in research/source-audit.md; the repository's registered edition record does not cover these questions, so this binding remains at the work level."

