context = "The Latin of XX.9 was read publication-locally on 2026-07-25 in the repository's tracked CSEL 40 TEI artifact to control the English quotation; the phrases quoted in the guide (de isto ergo regno eius, quod est hic ecclesia; ergo et nunc ecclesia regnum Christi est regnumque caelorum; nec tamen cum illo regnant zizania, quamuis in ecclesia cum tritico crescant) were read there. The transcription carries OCR defects elsewhere on the same pages, and only clean phrases were quoted."
