context = "Augustine's two treatments of the appointed Gospel in The City of God: XX.5 uses the parable as a proof of the coming judgment, and XX.9 argues from 'out of His kingdom' that the weeds are gathered from the present Church, which is therefore the kingdom of Christ. Read publication-locally on 2026-07-25 in the repository's tracked artifact for this edition, `pg45305-body-lf/city-of-god-volume-2.txt`, at lines 14100-14112 and 14547-14600. No registered passage exists for these loci, so the binding is at edition level; no central fingerprint replay is claimed."

