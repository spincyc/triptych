role = "currentness-control"
states = ["cataloged"]
context = "The official variation list for the 2008 emended reprint bounds substantive change to the 2002 text. Its Tempus per annum block was read publication-locally on 2026-07-25 in the Notitiae 44 (2008) PDF at pp. 368-387 and names only pp. 457 and 471, neither of which falls on the Week XVI formulary at pp. 465-466. The 2008 reprint's own pages were not inspected, so typography and layout remain outside this control."

[[bindings]]
