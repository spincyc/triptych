loci = ["48", "51", "61", "62", "74", "87", "363", "365", "367"]
role = "official-control"
states = ["cataloged"]
context = "These articles govern the entrance and communion chant options in force for the dioceses of the United States, the permitted Sunday sprinkling, the responsorial psalm and the acclamation, the absence of a Missal Offertory antiphon, the use of Ordinary Time orations on ferias, and the Eucharistic Prayer norms including the invariable Preface of Eucharistic Prayer IV. Read publication-locally on 2026-07-25 in the Holy See's English web text; the guide quotes only short phrases with attribution."

[[bindings]]
