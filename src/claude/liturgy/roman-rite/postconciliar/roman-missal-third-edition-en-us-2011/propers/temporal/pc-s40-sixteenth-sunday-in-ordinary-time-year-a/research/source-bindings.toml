role = "official-control"
states = ["cataloged"]
context = "Articles 43-44 define Ordinary Time and its reckoning; the Table of Liturgical Days fixes the precedence of Sundays in Ordinary Time at rank 6, which is the ground of the statement that no celebration replaced this Sunday in 2026. Read publication-locally on 2026-07-25 in the approved English text published by the Bishops' Conference of England and Wales."

[[bindings]]
source_id = "work.second-vatican-council.dignitatis-humanae"
loci = ["2", "11-12"]
role = "reception"
states = ["cataloged"]
context = "The Council uses the parable of the cockle among the wheat at n. 11 as one ground of the freedom of the act of faith, declares immunity from coercion at n. 2, and at n. 12 acknowledges that ways of acting at times appeared that were hardly in accord with the spirit of the Gospel. These loci are the controlling teaching against which the guide sets the coercion strand of the parable's reception history. Read publication-locally on 2026-07-25 in the Holy See's English web text; short excerpts are quoted with attribution."

[[bindings]]
