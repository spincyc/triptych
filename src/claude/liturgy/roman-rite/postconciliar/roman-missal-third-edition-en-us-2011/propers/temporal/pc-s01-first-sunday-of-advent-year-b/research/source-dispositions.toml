# Reusable-source dispositions for this leaf's research bindings
# (proper-study-source-dispositions-v1). One or more rows per binding in
# research/source-bindings.toml, pinned to that binding's digest and to its
# source's reviewed fingerprint. Written on 2026-11-26 by the
# source-registration stage (iteration 0) of proper-study run
# 99f04ef5cf9b711b, after it registered the deliveries research and context
# read that the library did not hold and reconciled the bindings.
# Research iteration 1 (the same day) added the row
# 'jerome-in-matthaeum-iv-matt-24-36-43', restated the Bede row's attribution
# reason and criteria, widened the official rows' loci, and refreshed the
# binding digests those changes moved.
# Research iteration 2 added the row 'lapide-in-marcum-13-negative' for the
# new binding 67 and refreshed the digests of bindings 29 and 31, whose
# contexts it restated.
# The source-registration stage (iteration 1) added binding 66, the same
# Jerome reading bound through his commentary's segment, with its row
# 'jerome-in-matthaeum-iv-matt-24-36-43-segment'.
# The source-registration stage (iteration 2) restated the row
# 'lapide-in-marcum-13-negative': its candidate extent is now the passage
# Lapide's volume was opened for (Mark 13:33-37) and its failed criterion
# 'exposition-of-the-extent', in place of the extents he does expound (13:6,
# 13:11) under a criterion keyed to this Mass's appointment, which is no
# admission criterion and would have read as a rejection of those comments.
# It also refreshed the digests of bindings 32 and 47, whose contexts now
# record the loci research iteration 2 re-read for Reading 3.
#
# admitted        the verified passage named has a canonical Scripture edge in
#                 src/sources/commentary/fragment-loci.yaml
# deferred        read and used here, but not yet an admissible Catena fragment;
#                 missing_criteria says what is still needed
# rejected        a candidate witness of the extent given that cannot be
#                 admitted; missing_criteria names the failed criteria. Its
#                 use as publication-local evidence is unchanged
# not-commentary  Bible text, textual note, liturgical text or law, calendar,
#                 locating aid or encyclopedia; no fragment claim is made
# lead            a catalog-only binding not read here
#
# Missing criteria used below:
#   passage-record            no passage record holds the excerpt
#   natural-excerpt-boundary  the excerpt's natural extent is not fixed
#   verified-transcription    read on page images; no checked transcription
#                             exists to carry the wording
#   tracked-text-controller   the text read is a remote or restricted delivery;
#                             a passage text needs a tracked, indexable controller
#   publishable-controller    the only held witness of the wording is
#                             restricted or of unresolved rights, so it cannot
#                             control a published fragment (Catena Rule 9)
#   unabridged-text           the translation read is expressly abridged
#   edition-translator-credit the edition record names no translator, so the
#                             Catena refuses a translation fragment from it
#   original-language-text    read in translation; the original is not held
#   work-locus-grammar        the work record's locus_pattern cannot express
#                             the locus read
#   quoted-text-attribution   part of the comment is another author's text
#                             quoted in this work; a fragment would hang under
#                             that author
#   scripture-extent          the Scripture the source expounds is genuinely
#                             unresolved; no extent is inferred from this leaf
#   canonical-scripture-edge  no canonical edge exists or can yet be proposed
#   unrevised-wording         the delivery is a modern revision of the
#                             historical translation, not the printing
#   exposition-of-the-extent  (rejected rows) the locus read does not
#                             expound the candidate extent; nothing is said of
#                             what else it expounds
#
# Scripture extents are canonical Vulgate numbering (Catena Rule 3); for
# Isaiah this is the Clementine division, in which Lectionary 63:19b is 64:1.

