[[advisories]]
stage = "study-review"
id = "STU-029"
severity = "advisory"
location = "sections/90-apparatus.tex lines 81-88"
problem = "The apparatus lists 'Advent's double character (Universal Norms 39) is the Preface's two comings' among 'Four relations ... stated by the liturgical books'. The shared verified.md Relationship classes table classes 'Universal Norms 39 to the Preface' as a textual observation: two texts of the Missal, each in its own words, with no rubric or norm joining them. The other three are stated relations (Praenotanda 67 and 93; GIRM 61; GIRM 62). This raises a textual observation to a relation the books state."
required_result = "Say 'Three relations are stated by the liturgical books' and put the Universal Norms and the Preface with the study's observations, for example: 'The Universal Norms (39) and the Preface both speak of two comings, each in its own words.'"

[[advisories]]
