[[advisories]]
stage = "homily-review"
id = "HOM-007"
severity = "advisory"
location = "sections/homily/10-homily.tex lines 84-87 ('The refrain ... asks God to turn them and show them his face ... Saint Augustine, preaching on that refrain, explained it in one sentence: ...'); sections/homily/90-note.tex lines 63-64 ('Augustine's one sentence on the refrain')"
problem = "The speech says Augustine 'explained' the refrain 'in one sentence'. The antecedent of 'it' is the whole refrain, which the speech has just given as asking God to turn his people and to show his face. Augustine's comment on the refrain (En. in Ps. 79.3, the tracked NPNF English) begins with that sentence on 'O God, convert us' ('For averse we have been from Thee, and except Thou convert us, we shall not be converted'). It then goes on at length to 'illumine Thy face': the face that a cloud of flesh veiled and that was acknowledged after the resurrection and ascension. The expansive study states this correctly ('Augustine's comment on it begins with one sentence', sections/40-clay-and-faithful-potter.tex line 102). The homily turns 'begins with' into a claim about the whole of Augustine's comment, and the note repeats it. The sentence reported is accurate, and the listener is not misled about what it says. 'In one sentence' is the only inaccuracy, and it adds an emphasis of brevity that the source does not support. Isolated instance."
required_result = "Do not claim that one sentence is Augustine's whole explanation. For example: 'Saint Augustine, preaching on that refrain, says of its first words: we have turned away from God, and unless he turns us, we will not be turned.' Or: 'Saint Augustine, preaching on that refrain, begins with one sentence: ...'. In the note, say 'Augustine's sentence on the refrain's \"convert us\"' or 'Augustine on the refrain's first petition' instead of 'Augustine's one sentence on the refrain'."

[[advisories]]
stage = "homily-review"
id = "HOM-008"
severity = "advisory"
location = "sections/homily/90-note.tex lines 57-58 ('The speech states this as what the texts say and does not stage it as a turn.')"
problem = "The note is reader-facing apparatus. Its purpose is the audience, the length, the loci, the routes of quotation and the homily's own links. This sentence certifies that the speech meets the three-document profile ('the speech states that change as what the text says, not as a staged turn'). It tells the reader nothing about a source or about delivery. editorial.md, 'State the finding, not the process', says that naming the discipline is itself the defect: compliance should be shown, not narrated. The profile places this judgment in the production audit, where a reviewer checks it, and research/production-review.md already records the change and the detail that makes it possible. Isolated instance. The rest of the paragraph, which gives the difficulty and the textual detail, is useful to a reader who would preach from this note."
required_result = "Delete the sentence 'The speech states this as what the texts say and does not stage it as a turn.' and leave the paragraph's account of the difficulty and the verses unchanged."

[[advisories]]
stage = "research-review"
id = "RES-NEG-002"
severity = "advisory"
location = "research/scope.md section 3.2, the row 'Theodoret, Theophylact, Peter Lombard, Rabanus, Origen fragments, Denis, Lyra, Hugh' (line 152); section 3.1, the row 'Albert the Great, Hugh of Saint-Cher, Nicholas of Lyra, Denis the Carthusian' (line 124)."
problem = "The negative results are right (not opened), but the reasons given for them are not. The 1 Corinthians row says that Theodoret and Theophylact 'are held only inside containers whose extent does not include 1 Corinthians at a read locus'. `tools/tpt commentary-work-index discover --passage \"1 Corinthians 1:3-9\"` reports two holdings. Theophylact's In omnes D. Pauli epistolas is inside the remote Migne PG 124 Latin-column OCR (`artifact.theophylact-of-ohrid.enarratio-in-evangelium-ioannis.migne-pg-124-latin-column-1864.ia-djvu-ocr-9a1fc730`), with the locator '1 Corinthians 1:4 at line 45001'. Theodoret's Interpretatio in xiv epistulas is held whole in the remote PG 82 OCR and facsimile (`...1864-migne-pg82-paris.ia-djvu-ocr-db2067fd`, `...wikimedia-pdf-7d6dd76e`). Both are held at the passage, and neither was opened. Likewise, the Mark row says that Hugh of Saint-Cher is 'not held at this locus or not held at all'. Discover reports his Postillae held in three restricted artifacts, as section 4 correctly says. All three are ecclesiastical writers who could only support a reading, so no reading changes. But a later sweep that trusts these rows would treat available witnesses as unavailable. This is the class of defect RES-NEG-001 cleared for Lapide on Mark."
required_result = "Restate the 1 Corinthians row. Theophylact (PG 124 Latin column, remote OCR, 1 Cor 1:4 at line 45001) and Theodoret (PG 82, remote OCR and facsimile, the whole commentary) are held at the passage and were not opened; both are ecclesiastical writers and could only support. Restate Hugh in the Mark row as held only in restricted whole-Bible artifacts and not read, as section 4 already says."

[[advisories]]
stage = "study-review"
id = "STU-023"
severity = "advisory"
location = "sections/20-rend-the-heavens.tex lines 171-173; sections/30-watch-at-the-door.tex lines 218-221"
problem = "Two closing sentences set a text or a Father beside the argument without saying why it bears on it. editorial.md ('Plain is not flat') asks for the reason one text or Father bears on another, not quotations left side by side. (1) 20:171-173 closes a paragraph on Paul's waiting, Chrysostom's 'Revelation' and Aquinas's 'blessed now in hope' with the Prayer over the Offerings: 'what devotion does in this passing time become the reward of eternal redemption'. Nothing ties it to the waiting. (2) 30:218-221, in the moral sense of the watch: 'Augustine, preaching on the verse the Communion Antiphon sings ... asks that God give increase to the seed he has sown in his hearers'. That is the preacher's own prayer. How it is a moral sense of keeping watch is not stated. Not counted: the clauses STU-016(a)-(c) and STU-017(c) prescribed verbatim (20:170-171 Collect; 30:119-120 Prayer over the Offerings; 30:217 Alleluia). Each is a clause the profile allows for a lightly touched text, and its neighbour supplies the connection. Two instances in a 13,500-word study are not a recurring pattern."
required_result = "Give each sentence its reason in plain words, or reduce it to a clause where the reason is obvious. For example: (1) 'The Prayer over the Offerings is a prayer of that waiting: it asks that what devotion does in this passing time become the reward of eternal redemption.' (2) Either 'The Communion Antiphon sings that \"our earth shall yield her fruit\"; the fruit the returning master looks for is the work of servants who stayed awake.', stated as the study's own inference and without Augustine, or move Augustine's 84.15 prayer to the third interpretation, where 84.15 already makes its point."

[[advisories]]
stage = "study-review"
id = "STU-024"
severity = "advisory"
location = "sections/20-rend-the-heavens.tex lines 100-102 and 184-188; sections/40-clay-and-faithful-potter.tex lines 167-170"
problem = "editorial.md 'Say it once'. Three restatements remain. (1) 20:100-102 repeats the note at 05-appointed-texts.tex 151-155: the son of man ends v. 16 in the Latin and in the US psalm, as it ends v. 18, while a translation from the Hebrew reads 'branch'. (2) The lead (20:7-9) and the Aquinas subsection (20:56-66) already give his three readings of Descendisti and his preference for the Exodus as the literal sense. The strain at 20:184-188 then restates them: 'he keeps the Incarnation as a sense of the words and adds the judgment, and so reads the one verb of three descents: the descent that freed Israel from Egypt, the descent into the womb ..., and the descent to judge'. production-review.md says this content was moved to the strain and not repeated, but the body still holds it. (3) 40:167-170 quotes and translates Bede's 'facultatem tribuit bonis operibus serviendi' again, in the same sense as at 30-watch-at-the-door.tex 159-163. Each is isolated. STU-017's pattern of rosters, formulas and refrains is gone."
required_result = "Say each thing once. (1) Cut 20:100-102. The psalm note in section 05 already gives the fact. (2) Reduce the strain's first paragraph to the difficulty and its answer, for example: 'Jerome and Aquinas disagree over the verb on which Jerome's answer rests. For Jerome the past tense is the answer; for Aquinas, in the sense he prefers, it is a memory of the Exodus on which the people dare to ask. He keeps the Incarnation among the senses of the word, so Jerome's answer stands, though not as the literal sense.' (3) At 40:167-170 refer to Bede's reading in a clause, for example 'Bede's gloss on the servants' authority, the Spirit's grace given for good works, says the same of the Gospel', without quoting and translating it a second time."

[[advisories]]
stage = "study-review"
id = "STU-025"
severity = "advisory"
location = "sections/20-rend-the-heavens.tex line 163"
problem = "'Paul names both comings in one sentence' credits Paul with the study's inference. In 1 Cor 1:4-7 he thanks God for grace given in Christ Jesus and speaks of the Corinthians as 'waiting for the manifestation of our Lord Jesus Christ'. He names gifts given and a revelation awaited, not a first coming. editorial.md: a text does only what texts do. Isolated instance."
required_result = "Say what the sentence says, for example: 'In one sentence Paul thanks God for gifts already given in Christ and describes the Corinthians as \"waiting for the manifestation of our Lord Jesus Christ\" (1 Cor 1:7).'"

[[advisories]]
stage = "study-review"
id = "STU-026"
severity = "advisory"
location = "sections/40-clay-and-faithful-potter.tex lines 95-96"
problem = "'Aquinas cites Jeremiah 18, where the potter remakes a spoiled vessel in his hand.' At Super Isaiam c. 64 [85024] Aquinas quotes Jer 18:6, 'sicut lutum in manu figuli, sic nos in manu Dei', with Job 10:9. He uses them as the people's reason for asking mercy of the Father who made them. The remaking of a spoiled vessel (Jer 18:4) is not his point. The sentence also stands alone at the end of the paragraph and leaves his inference unstated. In the same place Aquinas glosses 'ne irascaris satis' as 'idest nimis, vel secundum quod merita nostra exigunt', which bears on this interpretation's thesis and is not used."
required_result = "Report what Aquinas adduces and to what end, for example: 'Aquinas gives the people's reason for asking mercy in Jeremiah's words, \"as clay in the hand of the potter, so are we in the hand of God\", and reads \"be not very angry\" as \"not as our merits demand\" (c. 64).' Otherwise cut the sentence."

