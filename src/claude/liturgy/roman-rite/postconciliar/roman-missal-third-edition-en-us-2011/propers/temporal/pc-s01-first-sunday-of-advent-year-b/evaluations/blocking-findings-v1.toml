[[advisories]]
stage = "synthesis-review"
id = "SYN-006"
severity = "advisory"
location = "sections/concise/10-commentary.tex lines 354-355 ('The solemn blessing, where it is used, asks God to make the faithful firm in faith, glad in hope and active in charity.')"
problem = "The postconciliar profile allows the Missal's prayers and blessing only a Latin incipit and a description of what they ask. It forbids a rendering of the project's own and any paraphrase of the ICEL text close enough to reconstruct it. The approved English of the Advent blessing's second invocation reads 'may he make you firm in faith, joyful in hope and active in charity'. This wording was checked in a secondary web transcription of the 2010 ICEL Missal (liturgies.net, Advent Mass page), not in the printed altar book. The concise's clause changes only 'joyful' to 'glad', so it reconstructs the ICEL clause in an output whose PDF and web forms the ICEL permission does not clearly cover. The reader is not misled, and the extent is one clause. The concise took the wording from the accepted expansive study (see observation)."
required_result = "Describe the invocation without the approved English's wording. For example: 'The solemn blessing, where it is used, asks that in this present life the faithful be given faith, hope and charity.' Alternatively, delete the sentence: the blessing's two comings are already given in the themes and the commentary. Make no other change to the paragraph."

