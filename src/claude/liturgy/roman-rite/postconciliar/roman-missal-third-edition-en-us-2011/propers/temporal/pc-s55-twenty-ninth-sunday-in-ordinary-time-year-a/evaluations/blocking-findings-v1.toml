[[advisories]]
stage = "research-review"
id = "RES-015"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/research/interpretations.md, Reading 3, 'The strongest difficulty, and how the witnesses meet it', second sentence ('Matthew says only that the Pharisees went and took counsel how to ensnare him in his speech (22:15 ...); the text does not say whether their purpose was known')"
problem = "Matthew 22:18 says that Jesus knew their wickedness: Douay 'But Jesus knowing their wickedness' (47-matthew.tsv line 746); Clementine 'Cognita autem Jesus nequitia eorum'. Those are the words that prompt this difficulty. Jerome's 'Prima virtus est respondentis ...' (PL 26 col. 163, page image) and Aquinas's 'Et primo respondet ad mentem eorum ... Dei autem respondere ad mentem' (Venice p. 283, page image) are each written under that lemma. The paragraph instead anchors the question in 22:15 and says that 'the text does not say whether their purpose was known'. That means known to others beforehand, but read plainly it contradicts v. 18. A study following it could write that Matthew is silent on whether their purpose was known."
required_result = "The paragraph anchors the question in 22:18 ('knowing their wickedness', cognita ... nequitia eorum), the lemma under which Jerome and Aquinas write. It says only that the text does not say whether anyone else knew their purpose beforehand. The rest of the RES-009 repair stays as it stands."

[[advisories]]
stage = "study-review"
id = "STU-010"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/10-each-element.tex lines 230-231 ('Bellarmine calls the pupil ``frail and delicate''.'); src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/30-cyrus-and-caesar.tex lines 229-231 ('In the psalm the verse continues by asking protection from those who resist God's right hand')"
problem = "Two small misdescriptions at Psalm 16 (17):8. (a) Bellarmine (O'Sullivan, tracked text line 535) calls the apple of the eye 'a most delicate, though valuable article', then says 'such are we, frail and delicate'. The quoted words describe the petitioners, not the pupil. (b) In the Clementine and the Douay-Rheims, 'From them that resist thy right hand' opens v. 8, before 'keep me', as the study itself prints at 05-appointed-texts.tex lines 33-34 and 44. The verse does not 'continue' with it."
required_result = "(a) attributes the quoted words to their own referent, for example 'Bellarmine calls the pupil \"a most delicate, though valuable article\", and those who pray \"frail and delicate\"'. (b) says that the same verse opens by asking protection from those who resist God's right hand, words the antiphon leaves out."

[[advisories]]
stage = "study-review"
id = "STU-011"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/30-cyrus-and-caesar.tex lines 190-196 ('For Chrysostom and Augustine the debt is one of justice that binds every Christian ... They disagree about why Caesar is owed anything at all'); src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/50-comparison.tex lines 33-34 and 76-78"
problem = "The preserved disagreement over the ground of the debt is fully evidenced for Hilary and Ambrose, by quotation, but only asserted for Chrysostom and Augustine. The only Chrysostom ground the reader is shown is the coin's image and superscription (lines 107-112). That is close to Hilary's 'si rebus illius incubamus', so the summary 'They disagree about why Caesar is owed anything at all' is not made intelligible by the evidence on the page. The sentences that show the other ground stand at loci the study already cites: Augustine En. in Ps. 124.7, 'thus hath God ordained His Church, that every power ordained in the world may have honour, and sometimes from those who are better than those in power' (NPNF tracked line 61102-61103); and Chrysostom Hom. in Rom. 23, 'if thou be an Apostle even, or an Evangelist, or a Prophet, or anything whatsoever, inasmuch as this subjection is not subversive of religion' (tracked lines 46234-46236), whose last clause the study already quotes."
required_result = "The disagreement section shows the Chrysostom and Augustine ground in their own words at the loci already cited. Otherwise the section and the comparison narrow the stated difference to what the quoted words show: whether one who keeps nothing of the world's goods still owes Caesar."

[[advisories]]
stage = "study-review"
id = "STU-012"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/90-apparatus.tex lines 101-109 ('The questioners' paragraph, last sentence: 'Augustine's definition of the whited wall is used without the application he gives it in its section.')"
problem = "The sentence closes a paragraph about Fathers who pass from the questioners to the Jewish people, and about Nostra aetate 4. Placed there, it implies that Augustine's whited-wall application at En. in Ps. 95.3 is anti-Jewish. In that section the application is to the Donatist party ('Getulia, Numidia, Mauritania, Byzacium'; NPNF tracked lines 47915-47940), as research/scope.md section 3.10 and research/production-review.md record."
required_result = "The appendix names the application as Augustine's charge against the Donatist party, or moves the sentence out of the paragraph about the questioners, so that no reader takes it for anti-Jewish polemic."

