[[advisories]]
stage = "web-review"
id = "WEB-002"
severity = "advisory"
location = "build/web/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a.md lines 583-596 (Appendix: Liturgical Resolution, branches table), as rendered by the site at 1280 px and 1920 px with release/public-alpha/assets/site.css line 263 (.page-shell.reading table { display: block; width: max-content; max-width: 100%; overflow-x: auto; })"
problem = "The five-column branches table cannot shrink to the reading column. Its narrowest possible width is 655 px: the widest unbreakable words are 'evangelization-', 'Evangelization', 'substitution', 'Responsorial' and 'replacement', each with 14.4 px of padding on either side. The reading column is 632 px at 1280 and 619 px at 1920. The stylesheet therefore makes the table a horizontal scroller and cuts off the right edge of the Resolution column by about 23-36 px. The header reads 'Resolutio', and the communion-antiphon-gospel row reads 'Rubric (', 'prefer' and 'fron'. The only sign that the table scrolls is a 15 px scrollbar at the foot of a table that stands 4,406 px tall at 1280, so a reader of the upper rows meets clipped words with no visible cause. No words are lost, since scrolling shows them, and the PDF sets the table within its measure. The published edition f7b4a079... renders identically, so this revision did not introduce the defect. Nothing the conversion owner or the leaf's study owner may change in this run would fix it without restructuring settled source."
required_result = "At ordinary desktop widths, the branches table shows every column in full within the reading column, or signals its sideways scroll where the reader first meets it, with no change to its words. The proportionate remedy is a shared stylesheet rule that tightens cell padding or type for reading-page tables whose narrowest width exceeds the column, and it belongs to the stylesheet's owner, outside this run. If the study's apparatus is reopened for another reason, a four-column arrangement, for example with Status and Units affected combined, would also fit."

