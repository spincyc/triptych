[[advisories]]
stage = "homily-review"
id = "HOM-001"
severity = "advisory"
location = "sections/homily/10-homily.tex, fourth movement (the worn coin restamped), the sentence beginning \"In Saint Mark's words, which one of the two Communion antiphons today takes up\""
problem = "The relative clause \"which one of the two Communion antiphons today takes up\" puts liturgical apparatus inside the speech. It refers to a Missal option that an assembly rarely hears as such, because a hymn often replaces the antiphon. It also holds a ten-word aside between \"In Saint Mark's words\" and the quotation, which makes this the hardest sentence in the speech to follow by ear. The argument does not need it: Mark 10:45 carries the point as Scripture, and the terminal note already records the branch and the antiphon relation."
required_result = "Introduce Mark 10:45 directly as Scripture without the embedded antiphon clause, for example \"In Saint Mark's Gospel the Son of man came ...\". If the link to the Communion antiphon is kept, give it a short sentence of its own after the quotation, one that stays true whichever antiphon or substitute is sung. Keep the terminal note's branch statement consistent with whatever the speech then says."

[[advisories]]
stage = "homily-review"
id = "HOM-002"
severity = "advisory"
location = "research/scope.md section 2, textual-observations paragraph (\"in v. 8, bring sacrifices (*tollite hostias*, not sung)\"), on which the sentence \"The psalm told us how to come: 'Bring up sacrifices, and come into his courts.'\" in the seventh movement of sections/homily/10-homily.tex depends"
problem = "Scope section 2's parenthetical says that v. 8's \"bring sacrifices\" is not sung. That contradicts three other statements in the records: the Ordo and US locator 7-8, given as whole verses in propers/verified.md (unit 4) and research/context.md (row 4); context.md's list of what is not sung (v. 2, v. 6 and the middle clause of v. 10 only); and scope.md's own section-2 table row for Psalm 95, which marks v. 8 without \"not sung\". The homily's claim that the psalm told the assembly to come into his courts with sacrifices holds only if v. 8b is sung. The bound locator supports the homily, so the defect is the research record's inconsistent parenthetical and not the speech. A later reader of scope.md would still find the homily's sentence contradicted there."
required_result = "Make the research records agree that v. 8 is sung whole by correcting the scope.md section 2 parenthetical when the research owner next touches that file. Alternatively, if a reading of the printed Lectionary shows v. 8b omitted, revise the homily's sentence so that it no longer says the psalm told the assembly to bring sacrifices into his courts."

[[advisories]]
stage = "research-review"
id = "RES-016"
severity = "advisory"
location = "research/interpretations.md, Reading 3, 'The strongest difficulty, and how the witnesses meet it', second sentence ('Clementine *Cognita autem Jesus nequitia eorum*), the lemma under which Jerome and Aquinas write')"
problem = "Jerome's lemma does read nequitia (PL 26 col. 163, page image: 'Cognita autem Jesus nequitia eorum, ait'). Aquinas's printed lemma at the same verse reads 'Cognita autem Iesus malitia eorum, ait' (Venice t. III p. 283, page image, right column, before 'Et primo respondet ad mentem eorum'). The sentence presents the Clementine's nequitia as the wording under which both write. A study following it could quote nequitia as Aquinas's lemma."
required_result = "Name each lemma as printed: Jerome's 'Cognita autem Jesus nequitia eorum' with the Clementine, and Aquinas's 'Cognita autem Iesus malitia eorum' (Venice p. 283). Say that both comment on Matthew 22:18. The rest of the RES-015 repair stands."

[[advisories]]
stage = "research-review"
id = "RES-017"
severity = "advisory"
location = "research/scope.md section 3.6, Robert Bellarmine row (Psalm 16), 'What he argues' cell: 'the apple of the eye, \"frail and delicate\", and the shadow of the wings (8)'"
problem = "Bellarmine (O'Sullivan, tracked text line 535) calls the apple of the eye 'a most delicate, though valuable article'. He then says 'such are we, frail and delicate': the words describe those who pray, not the pupil. The research row attaches 'frail and delicate' to the apple of the eye. That is the misdescription standing finding STU-010(a) found in the study, and the study took it from this record."
required_result = "The row gives each phrase its own referent. The apple of the eye is 'a most delicate, though valuable article' and those who pray are 'frail and delicate' (line 535)."

[[advisories]]
stage = "research-review"
id = "RES-018"
severity = "advisory"
location = "research/scope.md section 3.1, rows for John Chrysostom, Hom. in Rom. 23, and Augustine, En. in Ps. 118 (Schin) and 124 secs. 7-8; section 3.1 paragraph 'Is Caesar's claim a duty or a concession'; section 7, row 'On what ground is tribute owed?'; research/interpretations.md Reading 2, 'The strongest difficulties', item (3)"
problem = "The records state that Chrysostom and Augustine make tribute a debt that holds for every Christian, against Hilary's and Ambrose's condition of possession. That disagreement is real, but the record quotes none of the sentences that carry it. The sentences quoted ('not to give but to render', 'this subjection is not subversive of religion', the soldiers of Julian) do not show that the debt binds one who keeps nothing. The decisive sentences stand at the loci already cited. Chrysostom: 'to show that these regulations are for all, even for priests, and monks, and not for men of secular occupations only ... if thou be an Apostle even, or an Evangelist, or a Prophet, or anything whatsoever' (NPNF 11, tracked lines 46231-46236). Augustine: 'thus hath God ordained His Church, that every power ordained in the world may have honour, and sometimes from those who are better than those in power' (NPNF 8, tracked lines 61102-61103). Standing finding STU-011 shows that the study, working from this record, asserted the difference without showing it."
required_result = "Quote these sentences, or equivalent ones at the same loci, in the section 3.1 rows and in Reading 2's difficulty (3), as the ground on Chrysostom's and Augustine's side. Otherwise narrow the stated difference in sections 3.1 and 7 and in Reading 2 to what the quoted words show."

[[advisories]]
stage = "research-review"
id = "RES-019"
severity = "advisory"
location = "research/context.md, 'World Mission Day on 18 October 2026' ('none is registered in the source library'), 'Sources read for this revision' ('None of the new states ... is registered') and 'Remaining verification for research'; research/chronology-inputs.toml header comment on the acclamation key; shared/ordinary-time/weeks/29/propers/verified.md, 'Witnesses actually inspected', General Instruction row"
problem = "Several statements that were true when written are now false. context.md says the World Mission witnesses and the three Internet Archive captures are unregistered, and it lists as outstanding the work the research has since done. The research registered and bound them, and scope.md section 11 records this. The chronology-inputs header still says that the orientation projection gives every key beginning with 'gospel' a narrated-event row, which v2 no longer does. The owner's GIRM row says that neither the chapter II state (d10afff3) nor the chapter VII state (e803093d) matches a registered artifact. Both are now registered. That row also rests nos. 363-365 on the chapter VII state, which no later stage could re-read, without naming the June 2026 capture that the leaf now relies on."
required_result = "Each place carries a short dated note of its current state, and the context stage's historical record is not rewritten. In context.md, point to scope.md section 11 and the bindings. In the input header, note the v2 behaviour. In the owner's GIRM row, name the registered states and the chapter VII capture of 13 June 2026 (e973bb8f) read at nos. 363-365."

[[advisories]]
stage = "research-review"
id = "RES-020"
severity = "advisory"
location = "shared/ordinary-time/weeks/29/propers/verified.md, research addition 6 (and addition 5, 'the antiphon's omission of the clause of service is the Missal's'); research/context.md, 'One cross-cycle fact bearing on rubric 6'; propers/verified.md finding 8"
problem = "The records note that the Ordo at no. 146 gives Mark 10:45 as the Year B Alleluia verse with the clause of service. They do not note the Year B Gospel's titulus on the same page (Ordo 1981, printed p. 79, artifact p. 133, page image): 'Filius hominis venit ut daret animam suam redemptionem pro multis'. That titulus is word for word the shortened form of Communion antiphon B. So the records omit the one edition-controlled witness that already has the antiphon's form without the clause of service. That fact bears on how the adapted antiphon is described and on the rubric 6 question."
required_result = "Record the no. 146 Gospel titulus beside addition 6 and the context's cross-cycle fact as an edition fact. Make no inference about why the antiphon was chosen or which text depends on which."

[[advisories]]
stage = "research-review"
id = "RES-021"
severity = "advisory"
location = "research/scope.md section 2, Psalm 95 (Hebrew 96) row; section 3.3, 'The title'; section 8.1 and section 8.3 row row-b6be5603e767096a"
problem = "The psalm's text stands, with small differences, in 1 Paralipomenon 16:23-33, within the praise David committed to Asaph on the day the ark was set in his tent (tracked Douay 1Par 16:1, 7, 23-33). The NPNF editor's note to Augustine's sermon, which the research read, points to it (note 4415, '1 Chron. xvi. 23, etc.', tracked line 48218). The records give only the Greek and Latin title's second-Temple setting and say that the Hebrew psalm has no title. The chronology corpus has no binding for this scriptural occasion, so no date may be supplied. Unrecorded, the title's setting can still read in the expansive study's historical appendix as the psalm's only attested setting."
required_result = "Record the 1 Paralipomenon 16 parallel in section 2 and section 3.3 as scriptural context, and in section 8 as a chronology-corpus lead for its owner. Supply no date, and leave the generated row unchanged."

[[advisories]]
stage = "study-review"
id = "STU-014"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/30-cyrus-and-caesar.tex lines 190-208 ('Chrysostom and Augustine say otherwise, each at a passage already quoted ... For them the debt does not wait on what a Christian holds of Caesar's; it binds the one who has left everything as well'); src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/50-comparison.tex lines 33-37 (comparison table, Disagreement row, Cyrus and Caesar cell: 'yes, for Chrysostom (...) and Augustine (honour from \"those who are better\")') and lines 79-81"
problem = "The narrowed disagreement is whether one who keeps nothing of the world's goods still owes Caesar. Chrysostom's answer is shown: Hom. in Rom. 23 names priests, monks, Apostles and Evangelists among those bound by 'let every soul be subject' (NPNF 1/11 tracked text lines 46231-46236). Augustine's is not. En. in Ps. 124.7 (NPNF 1/8 tracked text lines 61094-61145) grounds the honour due to every ordained power in God's ordering of his Church and says it is paid 'sometimes from those who are better than those in power'; in that section 'better' means the righteous serving unrighteous masters, kings and Julian, not those who have left the world's goods. Neither 124.7 nor 118 under Schin (lines 59520-59535) speaks of possession or renunciation. The study still says Augustine 'says otherwise' than Hilary and Ambrose on that question, and the table records his answer as 'yes'. His ground is shown accurately; the answer credited to him is the study's inference from it."
required_result = "Credit Augustine with what 124.7 states, honour owed to every ordained power by God's ordinance, even by the better to the worse. Either present his bearing on the possession question as an inference from that ground, or give the 'yes' in the 'For them' sentence and in the comparison cell to Chrysostom alone. No new evidence is needed."

[[advisories]]
stage = "study-review"
id = "STU-015"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/20-image-and-inscription.tex line 76 ('In the exposition of Psalm~57') and lines 286-287 (Moral sense: 'Augustine on Psalm 115', 'Augustine on Psalm 95'); src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/40-sincere-heart.tex line 145 ('In his exposition of Psalm~57'); src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/30-cyrus-and-caesar.tex line 323 (Allegorical sense: 'Bellarmine on Ps 95'); against the convention stated at src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/00-opening.tex lines 22-25"
problem = "The opening tells the reader that psalms are numbered as the Lectionary numbers them, with the Vulgate number in parentheses, and that the Vulgate number alone marks a verse quoted from the Douay-Rheims. These prose references give the commentators' Vulgate numbers bare, with no verse quoted. A reader who applies the stated rule looks up Psalms 57, 115 and 95 in the Lectionary's numbering and finds the wrong psalms; Augustine's and Bellarmine's 57, 115 and 95 are Psalms 58, 116 and 96. The scope appendix uses the Lectionary's numbering for bare numbers (sections/90-apparatus.tex lines 74-75, 'Basil on Psalm 33; Cassiodorus beyond the title of Psalm 96'), so the document applies both systems to the same form."
required_result = "Give these prose references in the declared form, for example 'Psalm 58 (57)', 'Psalm 116 (115)' and 'Psalm 96 (95)', or mark them as the commentators' Vulgate numbering. Work-and-section citations such as Enarrationes in Psalmos 57.8 may stay as they are."

[[advisories]]
stage = "study-review"
id = "STU-016"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/10-each-element.tex lines 72-75 ('the Clementine Vulgate and the Nova Vulgata differ in a mood, a spelling and the naming of Jesus in v. 20'); the statement it follows, src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/propers/verified.md lines 122-123"
problem = "In Matthew 22:15-21 the two Latin texts differ in two spellings, not one. Besides numisma/nomisma in v. 19, v. 20 reads superscriptio in the Clementine (tracked 47-matthew.tsv, Matt 22:20) and suprascriptio in the Nova Vulgata as the Holy See publishes it (re-read on 16 October 2026). The study's sentence and the verified.md statement it follows ('differ only in videtur/videatur, numisma/nomisma and the Clementine's Jesus in v. 20') both undercount. Nothing in the argument turns on it."
required_result = "Say 'a mood, two spellings and the naming of Jesus in v. 20', or name nomisma and suprascriptio. Correct propers/verified.md when its owner next reopens it."

[[advisories]]
stage = "study-review"
id = "STU-017"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/05-appointed-texts.tex lines 32-37 ('adding the vocative Domine after Custodi me ... its added vocative stands in neither Latin psalter')"
problem = "The sentence is true of the Clementine (Ps 16:8 'A resistentibus dexterae tuae custodi me ut pupillam oculi') and the Nova Vulgata ('Custodi me ut pupillam oculi'), but its wording presents Domine as the antiphon's addition. The older Latin psalter has it. Augustine's text, which the study cites at this verse, reads 'Keep Me, O Lord, as the apple of Thine eye' (En. in Ps. 16.8, NPNF 1/8 tracked text lines 5500-5501). Ambrose quotes 'Custodi me, Domine, ut pupillam oculi (Ps. XVI, 8)' (Hexameron VI.9.54, tracked Latin text line 221). A reader is left to think the Missal introduced the vocative."
required_result = "Keep the comparison with the two named psalters and add that the vocative stands in the older Latin psalter Augustine expounds (En. in Ps. 16.8). Alternatively, reword 'added' so that it no longer implies the Missal introduced the vocative."

[[advisories]]
stage = "synthesis-review"
id = "SYN-004"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/sections/concise/10-commentary.tex lines 215-217: 'Hilary: Christ knew interna cogitationum secreta, \"for God sees everything hidden within men\" (23.1)' (PDF pp. 7-8)"
problem = "After the SYN-002 repair this is the one witness phrase in the commentary still given only in Latin. The English beside it renders Hilary's parenthesis and not the phrase itself, which is the object of what Christ knew. A reader without Latin gets the sense from context but not Hilary's words. The expansive study renders the phrase as 'knowing the inner secrets of their thoughts' (sections/40-sincere-heart.tex lines 83-85)."
required_result = "Give the phrase the expansive study's rendering (for example 'the inner secrets of their thoughts') beside or in place of the Latin. Add no new claim and do not change the type size."

[[advisories]]
stage = "synthesis-review"
id = "SYN-005"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/propers/temporal/pc-s55-twenty-ninth-sunday-in-ordinary-time-year-a/research/production-review.md, 'Derive-synthesis, iteration 1', Repairs, SYN-002 bullet: 'and so do four further unglossed phrases (Aquinas's \"as if he said\", his \"to Christ, that is, to the king\", \"because it belongs to man to answer words\", and \"inasmuch as they have something of the light\")'"
problem = "The record undercounts what the repair changed. A fifth phrase outside SYN-002's list also lost its Latin to an English rendering: Jerome's 'Prima virtus est respondentis, interrogantium mentem cognoscere' is now 'the first virtue of one who answers is to know the mind of those who ask' (10-commentary.tex lines 220-221), and the record does not mention it. The production audit is meant to state the revision exactly."
required_result = "The next author to update the production record corrects the bullet to five further phrases and names Jerome's 'the first virtue of one who answers'. Nothing else needs to change."

