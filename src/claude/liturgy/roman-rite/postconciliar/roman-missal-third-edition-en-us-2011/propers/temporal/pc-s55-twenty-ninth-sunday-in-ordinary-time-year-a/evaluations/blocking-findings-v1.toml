[[advisories]]
stage = "visual-review"
id = "VIS-004"
severity = "advisory"
location = "Homily, physical page 1, left column, the movement break after 'and he calls them hypocrites.' (sections/homily/10-homily.tex inside the shared properhomily environment)"
problem = "The two-column environment sets flush-bottom columns, and the left column's only stretchable glue is this \\bigskip, so the break opens to about 0.8 in (158 px at 200 dpi) where every other movement break in the speech measures about 0.28-0.30 in (55-60 px). On the homily's first page it reads as a hole rather than one of the uniform breaks a speaker uses to find his place."
required_result = "Every movement break in the speech of the same height on every page, without changing the spoken text; the general remedy is ragged-bottom columns in the shared homily environment, a maintainer-level shared change beyond this leaf."

[[observations]]
stage = "research-review"
location = "src/sources/chronology/bindings.yaml, traditional-attribution bindings for Psalms (scope [{book: Ps, chapter: 32}] and others)"
note = "Psalm 32 carries a Davidic traditional-attribution binding from its Douay and Clementine title. Psalm 16, headed 'Oratio David' in the Clementine and 'The prayer of David' in the Douay, has none, and neither has Psalm 95 ('Canticum ipsi David'). Psalm 95 also has no binding for its 1 Paralipomenon 16 setting. The page-2 table therefore attributes only the Communion psalm to David. This is a corpus coverage question for its owner; the research recorded the asymmetry (scope.md 8.1) and may not alter the corpus."

