context = "The publication quotes n. 20 in full as the governing principle of the 2011 translation, and cites nn. 8, 25, 27, 43, 51, 53, 56, 57, 64, 74, 131, and 133 at their own numbers for the replacement of previous norms, the standard of intelligibility, the sacred-vernacular expectation, concrete biblical imagery, lexical variety, difficult terms including consubstantialis, the named formulas Et cum spiritu tuo and mea culpa, the concise Roman manner, the stability of memorized texts, and the all-at-once manner of revision with catechesis. Record created for this publication from the exact fetched response (SHA-256 01c63c12...); wording extracted verbatim from those bytes. The promulgated Latin in AAS 93 (2001) 685-726 was not consulted, and the publication makes no claim about the instruction's present force after later instruments."

