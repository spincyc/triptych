loci = ["complete-text"]
role = "direct-witness"
states = ["cataloged"]
context = "The publication's account of why the 2011 English says 'for many' rests entirely on this letter: the 9 July 2005 consultation it recites, the protocol number and date, the statement that a text corresponding to pro multis has been the Latin Roman formula since the first centuries, the affirmation of the validity of Masses using an equivalent of 'for all' and of the dogma that Christ died for all, the six arguments for a more precise rendering, and the directive to prepare the faithful by catechesis. Records created for this publication from the exact official Dicastery PDF (SHA-256 942aacc0...); the letter was read at artifact pages 57-59 on 2026-07-25 and short phrases were rendered from that Italian. The 1974 CDF declaration cited inside the letter was not independently examined and is cited in the publication only as the letter cites it."

