context = "Source of the published English of the four psalm chants, read in the exact tracked verse file with surrounding verses. This edition carries the Vulgate/Septuagint psalm numbers the missal cites, so every locus resolves without conversion. The file is also the witness for five of the guide's declared English gaps. At Ps. 73:19 it reads 'forget not', the Clementine's obliviscaris, where the Introit sings derelinquas; at Ps. 73:22 it reads 'Arise, O God', where both chants sing exsurge, Domine; at Ps. 73:23 it reads 'the voices of thy enemies', where the Introit sings voces quaerentium te; at Ps. 89:1 it reads 'from generation to generation', where the Alleluia sings a generatione et progenie; and at Ps. 30:16 it reads 'My lots are in thy hands', where the Offertory sings in manibus tuis tempora mea. None of these gaps is filled: the Douay verses are printed whole with the antiphons' fragments marked, and no English of a chant's own form is supplied anywhere. Ps. 88:51 was read because the Gradual verse's second clause is verbally identical with it, minus the vocative, rather than with the Ps. 73:22b the missal's printed reference names; it is quoted in the guide only as apparatus. Ps. 30:6 was read because it is the commendation verse of the Offertory's own psalm, and Ps. 77:24 because the Communion antiphon's verb dedisti is that verse's and not Wisdom's."

