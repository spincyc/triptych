context = "Recorded so that a later reader can find the library's holding of the work this guide quotes, and so that the difference is visible rather than hidden. The guide's quotation of Session VI chapter 10 - the decree's one liturgical citation in that chapter, which is this Sunday's Collect - was read in the 1863 Tauchnitz printing, together with that printing's own footnote 'Dominica XIII. post Pentecosten'. The library holds an 1887 Tauchnitz printing, which is a different printing of the same edition and was not the copy read; no locus in this guide rests on the library's copy, and no fingerprint is pinned because no exact witness held here was reviewed for this publication. The English quoted in the guide is Waterworth's 1848 translation, of which the library holds an undated reprint that was likewise not the copy read."

