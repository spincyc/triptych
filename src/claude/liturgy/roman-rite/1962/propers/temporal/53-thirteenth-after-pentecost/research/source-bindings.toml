context = "The witness that carries all three of this Sunday's orations together on one numbered Sunday, and the source of the guide's most striking chronological claim: Wilson's note prints Vat. Reg. 337's marginal antiphonary cues at this Mass - Ant. Respice domine in testamentum, Resp. Respice domine, Off. In te speraui domine, Com. Panem de caelo - which his Introduction dates, with the manuscript's text, to the first half of the ninth century. Introit, Gradual, Offertory and Communion of the 1962 formulary are therefore attached to the same Mass as its three orations in a ninth-century witness. That these numbered Sunday sections belong to the supplement and not to the Hadrianum proper is explicit in the same Introduction. The attribution of the supplement itself is deliberately not settled in the guide: Wilson-era scholarship credits Alcuin, and the modern revision of that attribution rests on protected literature that was not consulted. A sibling publication has registered a passage record in this edition for the Twelfth Sunday; nothing here duplicates it."

