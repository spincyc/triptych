context = "Read at printed pp. 75-76 (the after-Communion devotion), p. 81 (Communion of the sick) and pp. 261-262 (the Corpus Christi procession); no locus token is recorded because this work's registered locus grammar addresses titles and chapters and the printed pages of the 1872 Ratisbon printing were not resolved to it for this guide. The witness for the other liturgical life of Wisdom 16:20. The same verse that this Sunday's Communion adapts is, in this book, the versicle and response of Benediction of the Blessed Sacrament, is used in the singular at the Communion of the sick, and follows the Tantum ergo in the Corpus Christi procession under a rubric extending it to all processions with the Sacrament. The guide uses this to make a distinction it would otherwise be easy to lose: the wording most Catholics have heard is praestitisti eis, the Rituale's form, and not the missal Communion's adapted dedisti nobis. It is also what identifies the route of the Joyce entry in the quotation gallery, which quotes the Benediction versicle and not the antiphon."

