# Publication-local record of how this guide used the reusable source library.
# It supplements and does not replace `propers/verified.md`, which is the text
# control for every appointed form, or `research/scope.md`, which owns the
# reception matrix, the audits, and the material negative results.
#
# Three limits govern the whole file. First, `states` describe what this
# publication actually did with the record, not what the record could support;
# where a source was read in an electronic transmission rather than collated
# against a page image, the context says so. Second, several witnesses this
# guide cites are not in the library at all - among them Jerome and
# Ambrosiaster on Galatians, Marius Victorinus, Augustine's Quaestiones
# Evangeliorum and Sermo 176, Bruno of Segni, the pseudo-Augustinian De vera
# et falsa poenitentia, Rabanus Maurus, the Glossa ordinaria on Galatians and on
# the Psalter, Cassiodorus, Jerome on the Psalms, and Theodoret on Galatians -
# and they are cited in the guide's References with their own loci rather than
# bound here. Third, no `negative-search` binding appears below:
# the bounded negatives this guide publishes were established by reading
# printed editions, and the relevant artifacts are not registered as
# indexable, so no replayable literal-search receipt exists for them.

