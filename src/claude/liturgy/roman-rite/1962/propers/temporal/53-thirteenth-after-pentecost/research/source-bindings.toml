loci = ["Ps. 73 at coll. 1453-1465", "Ps. 89 at coll. 1597-1601", "Ps. 30 at coll. 1081-1084"]
role = "bibliographic"
states = ["cataloged"]
context = "Recorded so the difference between the library's witness and the one read is visible. The library holds this Migne volume as a remote facsimile PDF whose extracted optical text is expressly not textual control. Theodoret's Greek was read for this guide in two other, independent digitisations of the same Migne text, which agree letter for letter at every passage used, and the running heads at four column anchors were read from the page images of a further scan in a parallel pass. No fingerprint is pinned because the library's exact artifact was not the witness reviewed for this publication. Three findings rest on those readings and are published: that Theodoret argues the Roman destruction by eliminating Antiochus and Babylon; that his lemma at Ps. 73:20 is corrupt and he glosses the covenant not at all; and that at Ps. 73:22 he makes the chant's causam tuam the point of his whole note. His modern English translation is in copyright, so he is summarised and never quoted."

