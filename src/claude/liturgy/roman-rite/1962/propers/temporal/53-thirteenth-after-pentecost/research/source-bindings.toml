context = "The classic patristic manna-and-Eucharist passage, read to test whether it is a witness to this Sunday's Communion antiphon. It is not, and the guide publishes the negative: Ambrose builds the typology on Ps. 77:24-25, and the wording of Wis. 16:20 - omne delectamentum - does not occur in the treatise. He is therefore cited as theological background to the antiphon and expressly not as a witness to its text."

