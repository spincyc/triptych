context = "The chapter read is liber V on Lk. 17:11-19; the embedded Migne markers bound it at PL 92, 542B-544D, with the 17:20 section beginning at 545A. The principal Latin witness on the appointed Gospel, and the source of the guide's central distinction that the ten were cleansed while the one was saved, and that faith's working rather than its bare acknowledgement is what saves. The passage was re-retrieved for this guide and the retrieved byte size matched this artifact's registered extent exactly. Two findings are published from it. First, the chapter is a proven mosaic: the leprosy-as-false-doctrine blocks, the Paul-and-Cornelius material, the custos etymology and the number theology match Augustine's Quaestiones Evangeliorum II.40 line for line, and one sentence is verbatim Gregory, Moralia V.11 n. 28. Second, Bede drops Augustine's sentence declaring that the nine, being Jews, had lost the kingdom by pride - a sentence Aquinas's Catena aurea later restores. Bede has no comment on the route clause, which is recorded as a negative within the witness. The column bounds above are the transcription's embedded markers; no column-bearing scan was opened, and this artifact is a normalised text and not a facsimile."

