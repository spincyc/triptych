context = "The guide's principal witness to liturgical reception, and the only commentator located who binds this Sunday's chants to its Epistle and this Sunday's Gospel to the preceding Sunday's. Both bindings come through Rupert of Deutz as Guéranger excerpts him, and both are published under that limitation: Rupert's De divinis officiis was not opened, so he is an unverified lead and is never cited as though he had been read. Guéranger is also the witness for the sacramental reading of the cure on the road. His supersessionist framings are harsher than any patristic witness in this dossier and are attributed to him by name wherever cited, and the guide records that he ends the chapter in a Romans 11 key. Material negative: heading searches over the optical text of the neighbouring volumes of this English set were empty, so this Sunday's chapter exists in volume 11 alone. This edition supplies no English printed as the text of any appointed element. Metadata review 2026-09-05: the authenticated facsimile title page (PDF 4) and preface (PDF 6–7) identify the 1909 second edition and an unnamed posthumous continuation. This supersedes the former Duffy 1900 catalogue description; Guéranger names the series here, not an established personal authorship of this volume. The exact bound page texts and loci remain unchanged. Existing evidence states and their original verification dates are retained."

