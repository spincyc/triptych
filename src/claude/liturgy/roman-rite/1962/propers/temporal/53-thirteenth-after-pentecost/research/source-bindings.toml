context = "Twentieth-century liturgical commentary, used for the analysis of the Collect's two movements, the Secret's order of petitions, and the every-taste clause of the Communion, and quoted in short compass with attribution. His chapter title documents the older naming of these Sundays from the feast of St Laurence. His sentence about the apostles driven out by Judea is his own and is quoted as his own. Two limits: his cross-reference of this Postcommunion to the Monday after the Fourth Sunday in Lent is reported as his statement and was not independently collated in a missal scan; and the work is public domain in the United States but may remain protected in life-plus-seventy jurisdictions, which is why the quotations are brief."

