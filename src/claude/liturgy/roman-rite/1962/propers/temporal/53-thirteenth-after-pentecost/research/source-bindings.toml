source_fingerprint = "sha256:16ac7d35f9c67b7c26bcb3a5079a878420a6bbe862a462a944f44e0f59e4f6d9"
context = "The registered public-domain English of Augustine's exposition of the Alleluia's psalm, read at the appointed verse. Two published claims come from it. First, Augustine denies outright that Moses composed the psalm - the name is used for the sake of an intimation - which is the patristic precedent for the distinction this guide's page-2 dossier has to draw between traditional ascription and authorship. Second, he offers two senses of the verse's repeated noun, either every generation or two of them, old and new, because Moses was minister of the one covenant and prophet of the other; on that reading the Alleluia states the Epistle's thesis in one line. The Latin behind both was read separately at a text site and the PL 37 columns were not read from a scan, so none is asserted. New Advent heads the page by the Hebrew number 90 while Augustine's own references are Vulgate, as the passage record notes; the guide cites the Vulgate number the missal prints."

[[bindings]]
source_id = "edition.robert-bellarmine.commentary-on-the-book-of-psalms.osullivan-duffy-1866"
loci = ["Psalm 30, printed p. 78", "Psalm 73, printed pp. 223-226", "Psalm 89, printed pp. 277-279"]
role = "bibliographic"
states = ["cataloged"]
context = "Recorded so the relation between the library's holding and the copies read is visible. This guide quotes O'Sullivan's public-domain English at the three psalms and quotes Bellarmine's 1611 Rome Latin wherever a textual point is at stake, because the English announces that it omits whatever is purely philological or concerns the reconciliation of texts and versions, and substitutes the Douay headings for Bellarmine's own prefaces. Three published claims depend on the Latin the English cut: his rejection of Augustine's causam meam at Ps. 73:22; his judgment that the Greek reading behind the Introit's quaerentium te is a corruption at Ps. 73:23; and, at Ps. 30:16, his conjecture that the Greek word for lots should be read as the word for times, with the Office of the Mass and the Psalter of the Church of St Peter at Rome named as his witnesses. Neither copy read is pinned here. The 1611 Latin folio is not in the library at all; and the English was read in the Internet Archive item commentaryonpsal0000bell, whereas the library's registered facsimile for this edition is a Commons copy of a different Internet Archive item whose printed pagination that record describes as damaged, so the printed page numbers cited above have not been reconciled against the registered artifact's page ranges. The library's edition record also corrects the imprint this lane was briefed with: Dublin and London, James Duffy, 1866."

