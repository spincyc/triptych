context = "The witness for three published claims about the orations. First, the Collect and the Postcommunion already stand in one Mass at p. 229, among sixteen unnumbered Sunday Masses, so the pair is older than any Sunday number attached to it. Second, Wilson's apparatus at p. 249 shows that the Secret's received doubled imperative - propitiare, Domine, populo tuo, propitiare muneribus - is the Rheinau and S. Gallen reading, while the Vatican manuscript has one imperative and a participle. Third, the Postcommunion's proficiamus, which the 1962 book prints and on which the guide's argument about who advances depends, is the reading of a second S. Gallen hand, Gerbert and Pamelius, and of the Vatican manuscript at the prayer's two Book II reuses. Wilson's notes are also the source of the Sunday-number drift reported for the Rheinau, S. Gallen, Pamelius and Menard witnesses, which were not themselves opened. The guide claims no GeV numbering; Wilson's printed pages are the locators. A sibling publication has registered a passage record in this edition for a different Mass; nothing here duplicates it."

