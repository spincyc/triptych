verified_on = "2026-08-19"
source_fingerprint = "sha256:a9afb98ab105429203477b5f6e9b5f1cf1a567beeefcb066bc073027d5182888"
context = "The only ancient witness located that comments on the pericope's route clause, 'in the middle of Samaria and Galilee', which he reads as marking the thankful man's foreign descent. He also supplies the evidential reading of the sending to the priests. A bound is published with him: the Syriac of the sermons covering this pericope is lost, and what survives here is catena matter under two verse lemmata, so the guide cites fragments and never an integral sermon on the ten lepers. The retrieved byte size matched this artifact's registered extent. Payne Smith's 1859 English is public domain and is quoted; Cyril's supersessionist sentence in the same fragments is reported and attributed to him."

