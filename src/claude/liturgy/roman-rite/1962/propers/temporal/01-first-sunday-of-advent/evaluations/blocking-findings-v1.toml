problem = "Unchanged. Research was not re-entered in this round. The study credits Sicard with the Epistle fitted to the Erunt signa Gospel and with the reading of the Communion as flesh and good works, and says Durandus copies him (40 L141-144, L165-168; 50 L145-148; 90 L77-78). The tracked PL 213 OCR of Mitrale V confirms this ('Quaedam vero Ecclesiae legunt Evangelium: Erunt signa ... cui adaptatur epistola ... benignitatem, id est affectum bonum, et terra nostra, scilicet caro, dabit fructum suum, id est opera bona. Orationes etiam congrue secundo adaptari possunt adventui.'). The research record still says only that Sicard reproduces Rupert's reading (scope.md L164). It says that Durandus 'adds' the second-coming clause on the orations (L205; section 8.5), although Sicard already has it. And it says to cite Rupert and Sicard only for the elements they share (interpretations.md L503-504). The reviewed research therefore does not record the Sicard passage on which the study rests."
required_result = "When research is next re-entered, record Sicard's Erunt signa paragraph in research/scope.md: the Epistle fitted to Prope est regnum Dei by Propior est nostra salus; benignitas as affectus bonus, the earth as caro and the fruit as opera bona; and the orations fitted to the second coming. Note that Durandus copies it, correct 'adds' at L205 and in section 8.5, and bring the citation rule at interpretations.md L503-504 into line with the scope appendix's one clause."

[[advisories]]
stage = "synthesis-review"
id = "SYN-010"
severity = "advisory"
location = "sections/concise/10-commentary.tex L301-302, L310-311, L317 (The lifted soul and those who wait)"
problem = "Unchanged since iteration 1; only the line numbers moved by one. The unit opens 'The Introit's psalmist lifts his soul to God, and three of the authors take up from what and toward what it is lifted' (L301-302). It later says 'Both make the lifting a raising of the mind' (L310-311) and 'Gregory and Aquinas speak of where the soul goes' (L317). Gregory says nothing of the psalmist's soul. Hom. in Ev. I.1.3 explains the Gospel's levate ('Levare itaque capita est mentes nostras ad gaudia patriae coelestis erigere'). The tie to the Introit belongs to the first interpretation, and L312-314 say so correctly. The framing sentences still credit Gregory with a reading of the psalm. This is an isolated instance."
required_result = "Make the framing true of each author. For example, at L301-302: 'The Introit's psalmist lifts his soul to God, and the Gospel tells the disciples to lift their heads. Three authors say what the lifting is, and from what or toward what.' At L317: 'Gregory and Aquinas speak of where the mind is raised; Augustine, of what the soul leaves.' Keep L312-314, which give the link between the psalmist and the Gospel's command to the first interpretation."

[[advisories]]
stage = "synthesis-review"
id = "SYN-011"
severity = "advisory"
location = "sections/concise/10-commentary.tex L404-422 (The Collect, the Secret and the Postcommunion, first paragraph): topic sentence L407-408; L411-412; Schuster sentence L404-406"
problem = "Unchanged since iteration 1 except at L418-419, where the second interpretation's sentence on the Secret now correctly reads 'the cleansing the Secret asks for would take them away'. The topic sentence 'The interpretations differ on where the cleansing from sin comes from' still does not match what the paragraph shows. In all four interpretations the cleansing comes from the gifts the Secret names. The first and third set the Secret beside what Gregory and Paul tell the sinner to do, and L414-416 says they 'make the same contrast'. The second says what the cleansing removes, and the fourth what it prepares for. The sentence presents complementary uses as a disagreement. Two smaller points remain. 'The Secret asks the cleansing of the gifts themselves' (L411-412) can be read as asking that the gifts be cleansed. The opening Schuster paraphrase of the Collect (L404-406) sets up a parallel between 'by his power' and 'by their mighty power' that the paragraph never draws. This is an isolated instance."
required_result = "Replace the topic sentence with one the paragraph supports. For example: 'The interpretations set the Secret's cleansing beside different things: the first and third beside what Gregory and Paul tell the sinner to do, the second beside what the cleansing takes away, the fourth beside what it prepares for.' At L411-412 write 'and the Secret asks for the cleansing that the gifts themselves give.' Either open with the Secret and drop the Schuster sentence, or keep it and say in a clause what the two powers have to do with each other."

[[advisories]]
stage = "synthesis-review"
id = "SYN-012"
severity = "advisory"
location = "sections/concise/10-commentary.tex L30-32; L469-471 (against L378-388)"
problem = "Two of the three small defects recorded at iteration 1 remain. (a) L30-32: 'He counts what his hearers had seen, nation rising against nation, earthquakes, pestilence, and \"fiery battle lines in the sky\"'. Checked again in the tracked Wikisource text of Hom. in Ev. I.1.1. Gregory says the strife of nations is seen ('cernimus') and the fiery battle lines were seen ('vidimus'). Earthquakes are heard of from other parts of the world ('ex aliis mundi partibus scitis quam frequenter audivimus'), and pestilences are suffered ('patimur'). (b), the missing antecedent of 'them', was repaired this round: L224-225 now read 'Of the joys of the heavenly homeland Gregory says'. (c) L469-471, the commentary's last sentence, repeats what the earth unit says at L379-388. editorial.md, 'Say it once': a closing comparison compares and does not re-argue."
required_result = "(a) For example: 'He counts what his hearers had seen or heard of: nation rising against nation, earthquakes reported from other lands, pestilence without end, and \"fiery battle lines in the sky\" before Italy fell to the sword of the heathen'. (c) Cut the last sentence, or replace it with a comparison the earth unit has not already made."

[[advisories]]
stage = "synthesis-review"
id = "SYN-013"
severity = "advisory"
location = "sections/concise/10-commentary.tex L210-214 (the Collect's te liberánte salvári) and L247 (the Alleluia)"
problem = "The concise now marks the counterparts of WEB-001's five sentences as the interpretations' inferences, but two links that are the study's own are still stated as what a text asks. (1) L211-214: the Collect's last words 'ask Christ, with the same verb, for the deliverance Augustine asked for'. The verb (liberaret / liberánte) is the same, and the deliverer is Christ in both. That the Collect's request to be saved from 'the threatening dangers of our sins' is the deliverance Augustine sought from his bondage (Conf. VIII.5.12) is the third interpretation's inference. The study is narrower: it says the Collect's words 'use the same verb and name the same deliverer' (sections/40-hour-to-rise.tex L100-102). (2) L247: 'Between the lessons the Alleluia asks for that salvation as a gift', where 'that salvation' is Paul's salus as Aquinas expounds it at L230-240. The Alleluia's salutáre and Paul's salus are different words, and identifying them is the study's link. The counterpart is sections/40-hour-to-rise.tex L150-152, which study review passed after the WEB-001 repair. The derive-synthesis record names it as following the reviewed study. These are two mild residues in a document where the pattern is otherwise repaired, so they are isolated and not recurring."
required_result = "State each as a fact about the text or mark it as the interpretation's inference, without moving it into a Father's mouth. Plain rewrites: (1) 'Its last words, te liberánte salvári, \"that we may be saved, with thee setting us free,\" ask Christ, with the verb of Augustine's question, to set us free.' (2) 'Between the lessons the Alleluia asks, \"grant us thy salvation,\" and the interpretations hear the request in different ways.' The next sentences already say how. If the study's owner later marks its L150-152, the concise follows it."

[[advisories]]
stage = "synthesis-review"
id = "SYN-014"
severity = "advisory"
location = "sections/concise/10-commentary.tex L225-226 (against L98-99 and L347-348)"
problem = "The sentence rewritten this round ends 'and he adds that only the friend of the world grieves to see the end come'. The commentary has already given this point in full at L98-99 ('Whoever does not rejoice as the end approaches shows, by St James's rule, that he is the world's friend'), and L347-348 recall it again ('whose ruin, Gregory has said, grieves only those who love it'), where it does work in the argument. At L225-226 it adds nothing (editorial.md, 'Say it once'; 'Let the source have the last word'). 'Adds' also misplaces it. In I.1.3 the friend-of-the-world sentences ('Qui ergo appropinquante mundi fine non gaudet, amicum se illius esse testatur ... Ex mundi enim destructione lugere eorum est ...') come before 'Nos autem qui coelestis patriae gaudia aeterna cognovimus, festinare ad ea quantocius debemus', not after it. This is an isolated instance."
required_result = "End the sentence on Gregory's words: 'Of the joys of the heavenly homeland Gregory says, \"we ought to hasten to them as fast as we can\" (I.1.3).' Keep L98-99 as the point's one full statement."

