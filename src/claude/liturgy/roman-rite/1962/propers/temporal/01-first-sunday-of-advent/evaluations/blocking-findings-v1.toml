note = "The concise now retells Chrysostom's scene on Rom 13:12 as the registered NPNF vol. 11 text has it (artifact ccel-text-8bdb50c6 near line 46773: 'For this is what is done in the things of this life ... we each of us awake our neighbor'). The expansive study still frames it as 'a household before dawn', which is STU-025, standing for the study's owner, and the derive-synthesis record says the homily does too. On this point the concise is more exact than its upstream. It is a correction, not a new claim."

