note = "Page-2 lookups. First, the passage Lk 21:25-33. The row 'Gospel: Luke 21:25--33' gives the event ('Jesus foretells Jerusalem's fall and His coming'), the place ('Jerusalem, by the Temple in Luke's narrative; Mount Olivet in Matthew and Mark') and 'c. A.D. 29 (derived; Maas's chronology)'. The row beneath gives the Gospel's composition as 'Disputed: c. A.D. 70; Before Acts and the end of Paul's Roman imprisonment'. Passage, event, place and date pair at a glance, so the lookup succeeds. Second, the passage Rom 13:11-14. The row gives 'Composition: The Epistle to the Romans' and 'Proposals span A.D. 57--58'. Passage and date pair, but no place of writing is given or marked unknown, and the row cites 13:11--14 for a lesson that stops at 14a. Both belong to the shared projection, not to this synthesis, as the iteration-0 and iteration-1 lookups also recorded."

