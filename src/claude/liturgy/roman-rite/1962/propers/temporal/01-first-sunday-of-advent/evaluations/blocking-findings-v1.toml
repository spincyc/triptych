[[observations]]
stage = "homily-review"
location = "sections/homily/10-homily.tex L45-50, against src/claude/liturgy/roman-rite/1962/propers/temporal/68-twenty-fourth-after-pentecost/sections/homily/10-homily.tex (closing paragraph)"
note = "This is still true, as at iteration 0. The previous Sunday's Claude homily ends on the same sentence of Gregory, Hom. in Ev. I.1.3 (those who love God rejoice at the world's end because they soon find him whom they love). This homily, on the verse Gregory is expounding, makes that sentence its central argument, so a listener to the series hears it on two Sundays running."

[[observations]]
stage = "homily-review"
location = "sections/homily/90-note.tex (whole)"
note = "The note is now about 1,945 words against a 1,384-word spoken body, by a plain count with comments and commands removed. It was about 1,750 at iteration 0, and it is the longest homily note in the Claude series, where the others run from 793 to 1,841 words by the same count. 'What the text changes' and much of 'Connections that are the homily's own' repeat research/production-review.md. The profile asks for a 'brief' note but sets no measure, so this may be a missing criterion rather than a defect of this leaf."

[[observations]]
stage = "homily-review"
location = "sections/homily/10-homily.tex L119-122, against the closing invitations of src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany, 67-resumed-sixth-after-epiphany and 68-twenty-fourth-after-pentecost sections/homily/10-homily.tex"
note = "Four Claude 1962 homilies in a row tie their one response to a coming moment of the Mass ('So before you come to the altar today, forgive...'; 'So when you come to Communion today, ask for this...'; 'Before Communion today, then, forgive...'; here 'The same words return at the Offertory. When they do, lift up to Christ...'). Here the response is earned: the Offertory repeats the Introit's 'levavi', which shares its verb with the Gospel's 'levate', and the response takes up Augustine's 'presently' and the Collect's 'set free'. The profile's reading test compares invitations by their wording, and nothing in it names a recurring shape. That may be a missing criterion."

