required_result = "The appointed English of Rom 13:12 and the body's quotations of it agree and read as Challoner's verse reads (the witness corrected to Challoner's pointing with the correction recorded in propers/verified.md, or the verse taken from a witness that prints it correctly), and the Offertory's words at 40:133 are quoted in the Missal's form, 'in te confído'."

[[advisories]]
stage = "web-review"
id = "WEB-004"
