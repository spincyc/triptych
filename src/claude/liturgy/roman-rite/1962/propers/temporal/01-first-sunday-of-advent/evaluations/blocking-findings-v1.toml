[[findings]]
stage = "web-review"
id = "WEB-001"
severity = "blocking"
location = "sections/20-lift-up-your-heads.tex:85-88 and 90-94 (web Markdown lines 275, 277); sections/30-coming-through-the-church.tex:237-240 (line 387); sections/40-hour-to-rise.tex:129-135 (line 441); sections/50-mercy-shown-salvation-given.tex:168-172 (line 517)"
problem = "Register, guidance/editorial.md 'Say what the texts say, plainly' (texts credited with the study's own inferences). In the paragraphs that bring the Mass's other texts into each interpretation, the study's own connection is stated as a fact about a proper text, unmarked, in every one of the four interpretations, while neighbouring connections in the same paragraphs are marked ('If ...', 'would be'). Instances: (1) 20:85-88 'In this Mass Paul's night and Gregory's road ask the same of the hearer, to hurry as the end draws near' - the study's synthesis of Paul, Chrysostom's runners and Gregory's road is credited to 'Paul's night' and 'this Mass'; (2) 20:92-94 'Sung just before the Gospel, it [the Alleluia] is the prayer of the people Gregory describes' - Gregory says nothing of the verse; the identification is the study's; (3) 30:237-240 'Over the gifts the Secret asks for the cleansing that would take that obstacle away' - the Secret asks to be cleansed and made purer; that the cleansing removes Ambrose's eclipse of the moon is the study's link, put into the Secret's request; (4) 40:131-132 'the Offertory's lifted soul is the opposite of that weight' - the contrast with Augustine's sarcina saeculi is the study's, stated as what the Offertory is; (5) 50:170-172 'in this Mass the one waited for is the Christ whom the Alleluia and the Collect have asked for' - the psalm's 'qui te exspectant' addresses God; identifying the one waited for with Christ is the study's inference, stated as the Mass's meaning. The pattern recurs through the document and is not an isolated instance."
required_result = "Each listed sentence states its connection in the study's own voice as an inference where it is drawn, in varied ordinary words (not one repeated formula such as 'Taken this way'), keeping every attribution and qualification and moving nothing into a Father's mouth; what a source does say (Aquinas on 'in te confido', Bellarmine on waiting, Ambrose on the moon, Gregory on those who sought redemption) stays attributed to him. Plain rewrites: (1) 'Paul tells the Romans it is the hour to rise, Chrysostom urges them to run the harder near the goal, and Gregory says we ought to hasten; Gregory adds that only the friend of the world grieves to see the end come.' (2) 'Gregory's hearers are those who have sought redemption and are then told that it is near; sung just before the Gospel, the Alleluia's request can be heard as theirs.' (3) 'Over the gifts the Secret asks that the holy gifts, cleansing us by their power, bring us purer ad suum princípium, to their source; set beside Ambrose's moon, that cleansing would clear what keeps the Church from the sun's light.' (4) 'Augustine felt the world's baggage press on him like sleep. Against that weight the Offertory, sung after Paul's command, lifts the soul; its next words, Deus meus, in te confído, are the trust Aquinas finds in this verse, placed in God through Christ and not in ourselves.' (5) 'Bellarmine explains such waiting as expectation in the certain hope of help. Since the Alleluia and the Collect have just asked for Christ, the one waited for in this Mass can be understood as he.'"
repair_target = "study"

[[advisories]]
stage = "homily-review"
id = "HOM-006"
severity = "advisory"
location = "sections/homily/10-homily.tex L32-34, L38-39, L45-47, L125-126"
problem = "Four sentences in the Gregory passages are hard for a listener to follow on one hearing, though each is accurate to the source. (1) L32-34, 'He makes known the blows that come before its end, so that...': the sentence before has 'Gregory says' inside it, so 'He' can be heard as Gregory rather than the Lord, and 'its' as the Lord's end rather than the world's. (2) L38-39, '\"Do not love, my brothers,\" he says, \"what you see cannot stand for long.\"': 'he says' splits the relative clause, so a hearer takes 'what you see' as the object of 'Do not love' and is left with 'cannot stand for long' as a fragment. Gregory's 'quem' (I.1.5) refers back to mundum, so the world can be named. (3) L45-47, 'they will soon find the one they love, while the one they did not love passes away': 'the one they did not love' is Gregory's 'is quem non amaverunt', the world. In English it sounds like a person. The previous Sunday's Claude homily renders the same clause 'what they did not love'. (4) L125-126, 'Gregory reads the fruit of the world as its ruin, for the world grows in order to fall': Gregory's step is not spoken. In I.1.3, as summer is known from the fruit of the trees, so the kingdom is known to be near from the world's ruin. Without it, 'the fruit of the world' comes straight after the fig tree with nothing to connect them. Each slip is small, the movement stays intelligible and nothing is misattributed, so the defect does not block."
required_result = "Make each sentence clear on one hearing without changing its source or attribution. Plain rewrites: (1) 'The Lord makes known the blows that come before the world's end, so that if we will not fear God in quiet, we may at least fear his judgment when we are worn down by blows.' (2) '\"Do not love, my brothers,\" he says, \"a world that you see cannot stand for long.\"' (quem taken as the world, its antecedent), or as paraphrase: 'So he tells his people not to love a world they can see will not stand for long.' (3) '...because they will soon find the one they love, while the world they did not love passes away.' (4) 'Gregory explains the likeness: as the fruit on the trees tells us that summer is near, the ruin of the world tells us that the kingdom is near, for the world grows only to fall.' If (2) changes from quotation to paraphrase, update the note's I.1.5 entry to match."

[[advisories]]
stage = "study-review"
id = "STU-024"
severity = "advisory"
location = "sections/40-hour-to-rise.tex L150-152 (and, lesser, L160-161)"
problem = "One unmarked instance of the WEB-001 pattern remains after the repair, in a paragraph WEB-001 did not list (guidance/editorial.md, 'A text does what texts do': texts credited with the study's own inferences). L150-152: 'Between the two lessons the Alleluia asks, salutáre tuum da nobis, \"grant us thy salvation\": the salvation Paul has just called nearer is asked for as God's gift.' The Alleluia asks for 'thy salvation'. That this is the salvation Paul calls nearer in Rom 13:11 is the study's link, drawn through Aquinas's Advent sense (Super Rom. 13 lect. 3, 'nostra salus scilicet Christus') and Augustine's 'salutare tuum, Christum tuum' (En. in Ps. 84.9). The sentence states it as what the Alleluia asks, unmarked. The next sentence marks its own extension ('If Paul's words bear that sense'). A lesser instance is at L160-161, 'The Secret asks God for a cleansing like it'. The likeness to Paul's casting off is the study's comparison, and it is placed inside the Secret's request. The five sentences WEB-001 listed are repaired, and no other unmarked instance was found in the four interpretations, so this is an isolated instance."
required_result = "State each link in the study's own voice where it is drawn, without the colon that turns it into the Alleluia's content and without another 'If ...' formula. For example, at L150-152: 'Between the two lessons the Alleluia asks, salutáre tuum da nobis, \"grant us thy salvation.\" Sung after the Epistle, the request can be taken as asking God to give the salvation Paul has just called nearer.' At L160-163: 'Paul makes the casting off of the works of darkness the hearers' own task. The Secret also asks for cleansing, but asks it of the holy gifts: that poténti virtúte, \"by their mighty power,\" they make us mundátos and purióres, cleansed and purer.'"

