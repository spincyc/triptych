# Reusable-source dispositions for this leaf's research bindings
# (proper-study-source-dispositions-v1). One or more rows per binding in
# research/source-bindings.toml, pinned to that binding's digest and to its
# source's reviewed fingerprint. Written by the source-registration stage
# (iteration 0) of proper-study run 77c1ca91ef2d5e93 on 2026-11-25, for the 62
# bindings left after this stage bound the checked Ambrose passage on
# Lk 21:29-30 (17), Augustine's
# Tractate 41 on John (22) that Bede copies on Lk 21:32, the two texts research
# read in new fetches and this stage registered (31 Augustine on Ps 24 from
# augustinus.it; 32 Confessions VIII from The Latin Library), and Pilkington's
# English of Confessions VIII (33-34), and added Coxe's English of Ps 84 to the
# NPNF I.8 binding (30). Every tracked bound artifact was re-hashed against its
# registered record and matched; every remote or restricted one was matched
# through the research or resolve-context receipt or this stage's refetch.
# binding_sha256 values come from scripts/_proper_study.py binding-digests.
#
# The research stage (iteration 1) of the same run restored Gregory's homily to
# its six sections (bindings 13-14: section 6 is printed inline on physical line
# 19 of the tracked text, after section 5), restated Ambrose's identifications of
# sun, moon and stars at his own sections (16), corrected the contexts of the two
# Bellarmine Psalm 24 bindings (35-36), and re-pinned those rows' binding digests.
#
# The source-registration stage (iteration 1) of the same run corrected the shared
# passage record bound at 14 from locus 1.1-5 to 1.1-6, after rereading its
# line-19 transcription segment against the artifact (hash recomputed and
# matched), together with the section count in its Catena edge and in the two
# English excerpts' records; it re-pinned binding 14's digest and fingerprint.
#
# This stage admitted five new Augustine fragments, each a verified passage with
# its canonical edge in src/sources/commentary/fragment-loci.yaml: Enarrationes
# in Psalmos 84.1 and 84.9 (Ps 84:8) and 84.15 (Ps 84:13) in Latin, and Coxe's
# English of 84.9 and 84.15, linked to the Latin as excerpt English versions. It
# added to the edges of Bede on Lk 21:28, 29-31 and 32 the attribution of their
# words to Gregory (Hom. in Ev. 1.3) and Augustine (In Ioh. tr. 41.3-4).
#
# admitted        the verified passage named has a canonical Scripture edge in
#                 src/sources/commentary/fragment-loci.yaml
# deferred        read and used here, but not yet an admissible Catena fragment;
#                 missing_criteria says what is still needed
# not-commentary  liturgical text, Bible text, translation control, a locating
#                 aid, narrative reception, a reference article or a chronology
#                 source; no fragment claim is made
# lead            catalog-only; not read
#
# Scripture extents are the source's own reach in canonical Vulgate numbering,
# never the appointment that led this study to it: Chrysostom on Matthew and
# Cyril of Jerusalem are anchored to Matthew 24, Augustine's Tractate to John 8,
# Leo to Lk 21:34, and the liturgical commentators to the Scripture they cite.
#
# Missing criteria used below:
#   passage-record            no passage record holds the excerpt
#   natural-excerpt-boundary  the excerpt's natural extent is not fixed
#   page-image-collation      read on OCR or a transcription, not collated with
#                             a page image
#   verified-transcription    read on page images or damaged OCR, but no checked
#                             transcription exists to carry the wording
#   retained-page-image       the page read is in a remote scan only; no page
#                             of it is retained in the library
#   original-language-text    read in translation; the original was not read
#                             or is not held
#   edition-translator-credit the edition record names no translator, so the
#                             Catena refuses a translation fragment from it
#   work-record               the work read has no work record of its own, or
#                             is held only inside a book that is not a declared
#                             anthology of it
#   publishable-controller    the only held witness of the wording is
#                             restricted or of unresolved rights, so it cannot
#                             control a published fragment (Catena Rule 9)
#   harvest-alias-group       work-aliases.yaml has no harvest group for the
#                             work, so a Catena row could not name a work_alias
#   quoted-text-attribution   the block carries, or may carry, another author's
#                             words beside the author's own; a fragment must
#                             bound and credit them
#   scripture-extent          no single Scripture extent is expounded

