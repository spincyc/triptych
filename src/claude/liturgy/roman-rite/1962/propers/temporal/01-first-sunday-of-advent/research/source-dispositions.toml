locus = "Expositio in Lucam X.36-43 on Lk 21:25-27"
relationship = "direct-exegesis"
disposition = "deferred"
reason = "Reread here (hash recomputed and matched here), and again by the research stage, iteration 1: under the printing's lemmata (Vers. 25.) at X.36 and (Vers. 26, 27.) at X.39, Ambrose reads the darkened sun as Christ, the heavenly sun that 'mea fide vel minuitur, vel augetur', obscured when many fall from religion; the moon as the Church, which cannot borrow his light when the vices of the flesh stand in the way (X.37); and the falling stars as the patriarchs and prophets already shining with the glory of the resurrection, lost to men if the bitterness of persecution grows strong, 'sic enim probantur boni, sic produntur infirmi' (X.38). The powers of heaven are moved by an increase of grace (X.39-40), and the clouds are prophets and saints (X.41-43). His stars are not those who fall in persecution, and his sun is not Augustine's (Ep. 199.39, where the Church is sun, moon and stars). Not admitted: no passage record holds these sections, and the Wikisource transcription was not collated with a page image. Rights are recorded (Wikisource CC BY-SA, tracked)."
missing_criteria = ["passage-record", "page-image-collation"]
scripture_extents = [{ token = "Luke", first_chapter = 21, first_verse = 25, last_chapter = 21, last_verse = 27 }]

