pdfsubject = "A homily for an adult parish assembly on the 1962 Missale Romanum proper of the First Sunday of Advent, said on Sunday 29 November 2026: the signs that make men wither and the disciples told to lift their heads; St Gregory the Great on the aging world, the lifted head as a gladdened heart and the road no one wants to end; the Gradual's waiting and the Gospel's expectation; St Paul's hour to rise with St John Chrysostom's runners, neighbours waking before dawn and garment; St Augustine's sweet burden of the world, his 'presently' and his deliverance; the Collect's prayer that Christ come and set us free, the Secret, and the Introit and Offertory's lifted soul; and Gregory's summer of the kingdom"
