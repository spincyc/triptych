# --- Interpretations of the whole Mass ----------------------------------------
#
# `authors` names every author an interpretation cites; `carrying_authors`
# names those who carry it, each a Father, a canonized saint or one of the
# Blessed in src/sources/inventories/author-standing-v1.toml, at least one a
# Father or a canonized saint (guidance/liturgy/propers-three-documents.md,
# "Liturgical commentators"). Rupert, Sicard and Durandus are ecclesiastical
# writers and Schuster is Blessed; they support only. Chrysostom on Matthew
# and Cyril of Jerusalem comment on the synoptic parallels of the Gospel.

[[lanes]]
key = "lift-up-your-heads"
authors = ["Gregory the Great", "Cyril of Alexandria", "Cyril of Jerusalem", "Bede", "Augustine of Hippo"]
