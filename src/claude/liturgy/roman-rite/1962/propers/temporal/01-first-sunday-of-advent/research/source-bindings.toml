# Publication-local record of how this leaf's research used the reusable source
# library. It supplements, and does not replace, propers/verified.md (text control,
# publication basis and English), research/scope.md (reception matrix, witness
# register, commentators, difficulties, disagreements, negative results and bounds)
# and research/interpretations.md.
#
# States describe what the research stage (iteration 0) of run 77c1ca91ef2d5e93 did
# with each record on 2026-11-25. 'inspected' means this stage read the bound locus
# itself in the bytes named; 'verified' is claimed only for page images read to
# control a form, a publication basis or quoted English (the 1962 facsimile, Pustet
# 1862, Lasance 1945). Remote and restricted artifacts were fetched whole and matched
# to their registered SHA-256 before any locus was read; tracked artifacts were
# re-hashed and matched. Fingerprints were taken from tools/source-library
# fingerprint on 2026-11-25. The Scripture chronology sources are cited by
# research/chronology.toml and sealed with it.
#
# The source-registration stage (iteration 0) of the same run registered the two
# texts the research stage read in new fetches (Augustine on Ps 24 in Latin from
# augustinus.it, and Confessions VIII in Latin from The Latin Library), refetched
# both and matched their bytes, and bound them below. It also bound the records it
# read itself to establish attribution, English and admission (Pilkington's English
# of Confessions VIII, Augustine's Tractate 41 on John in the NPNF English, and the
# checked Ambrose passage on Lk 21:29-30), and added the Psalm LXXXV English it
# read beside the Latin of Ps 84. Each binding's disposition is in
# research/source-dispositions.toml.
#
# The research stage (iteration 1) of the same run reread Gregory's first homily
# in the tracked text (hash recomputed and matched) and restored the extent of
# bindings 13-14 to sections 1-6: section 6 is printed inline on physical line 19,
# after section 5, and runs to the homily's closing sentence. It also corrected the
# contexts of the two Bellarmine bindings on Psalm 24 to name the readings that
# use them.
#
# The source-registration stage (iteration 1) of the same run corrected the shared
# passage record bound at 14 from locus 1.1-5 to 1.1-6 (its text already held
# section 6), with the same count in its Catena edge and in the two English
# excerpts' records, and re-pinned binding 14 to the corrected record.

