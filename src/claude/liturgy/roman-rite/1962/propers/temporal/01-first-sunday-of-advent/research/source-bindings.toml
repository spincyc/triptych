context = "Gregory's first homily on the Gospels, on Lk 21:25-32 (he also treats v. 33), read whole in the tracked extracted text (hash recomputed and matched): inscription and lesson at physical lines 10-14; Homily I sections 1-6 at lines 15-19, with section 6 printed inline on line 19 after section 5 ('6. Sed considerandum nobis est ...' to '... quanto nunc districtionem illius timendo praevenitis'). Line 20 is the extractor's source note. The inscription reads 'Habita ad populum in basilica sancti Petri apostoli, Dominica secunda Adventus Domini' and the lesson text reads 'in nubibus'. Section 1 reports earthquakes heard of from other parts of the world; section 5 names the sudden whirlwind ('subito turbine') that threw down trees, houses and churches three days before; section 6 says the judge moved the wind and the cloud, undermined the ground and shook the foundations of buildings, and never calls it an earthquake (research/scope.md 8.4). Carrying author of reading 1."

