source_fingerprint = "sha256:cce6b5473906365bb5f402f0f1aa8403a135408cc439a43ff50c5a36ffc05d21"
context = "Source of the published English of the Collect (printed p. 418), Secret and Postcommunion (both printed p. 420). The transcription is addressed by 1962 formulary rather than by the 1861 book's own heading, and the identification was confirmed on the printed incipits where the book gives them: the collect row's incipit Omnipotens answers Omnipotens sempiterne Deus and the postcommunion row's Sentiamus answers Sentiamus, quaesumus. The Secret's incipit field is empty, so that oration was confirmed by matching its English clause for clause against the appointed Latin - 'Look down, O Lord, we beseech thee, on our homage' against Respice, Domine, quaesumus, nostram propitius servitutem, 'a help to our weakness' against nostrae fragilitatis subsidium - and the six orations of the tenth and twelfth Sundays were read to prove that the filing does not slip by one. All three orations occur once and only once in the whole file, so no competing rendering of the same Latin under another formulary could have been quoted by mistake. Three divergences between the English and its Latin are published at the point of use: the Collect's 'we dare not presume to ask' makes the petitioners the subject where quod oratio non praesumit makes the prayer itself the thing that does not presume; the Postcommunion inverts mentis et corporis to 'body and mind'; and its 'enjoy the full effect' stands where gloriemur says 'may we glory'. The printing's abbreviated conclusion Thro'. is reproduced as printed and not expanded."

