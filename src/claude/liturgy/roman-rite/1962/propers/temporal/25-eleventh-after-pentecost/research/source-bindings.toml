context = "Source of the published English of the four psalm chants: Ps. 67:6-7 and 36 are the Introit's centonised antiphon with Ps. 67:2 its psalm verse, Ps. 27:7 and 1 the Gradual, Ps. 80:2-3 the Alleluia verse, and Ps. 29:2-3 the Offertory. Every locus was read in the exact tracked verse file with its surrounding verses, and each Missal locus resolves directly because this edition's psalm numbers are the Vulgate/Septuagint numbers the Missal cites. The findings that control the page are recorded in verified.md: the Douay renders unius moris at Ps. 67:7 (of one manner) and so cannot be quoted for the chant's unanimes, which is declared and left in Latin; the Douay's Ps. 27:1 renders clamabo (will I cry) and has no counterpart for the chant's ne discedas a me; the Douay's Ps. 29:3 carries the Deus meus the Offertory drops; and the Introit and Alleluia are centonisations, so their Douay verses are printed whole with the sung fragments marked rather than stitched into project-made joins."

