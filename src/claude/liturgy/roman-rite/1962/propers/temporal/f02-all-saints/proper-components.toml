# The fourteen elements said in the Mass of Sunday 1 November 2026, in the
# order of the Mass: the feast's ten texts (printed pp. 702-703, nos.
# 3974-3983) with the three orations of the Twenty-third Sunday after
# Pentecost (pp. 416-417, nos. 1720, 1726, 1728) commemorated after the
# feast's Collect, Secret and Postcommunion. The feast prints no Preface; the
# general rubrics can be read for the Trinity Preface or for the common
# Preface (research/context.md), so the preface key anchors a locator that
# names both and gives neither text.
element_keys = ["introit", "collect", "commemoration-collect", "lesson", "gradual", "alleluia", "gospel", "offertory", "secret", "commemoration-secret", "preface", "communion", "postcommunion", "commemoration-postcommunion"]

