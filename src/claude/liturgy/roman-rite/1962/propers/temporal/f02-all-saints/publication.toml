[document.main]
pdftitle = 'All Saints: A Study of the Proper in the 1962 Roman Missal'
pdfsubject = 'Expansive study of the 1962 Missale Romanum proper of the feast of All Saints, as said on Sunday 1 November 2026 with the commemoration of the Twenty-third Sunday after Pentecost: appointed texts, each text in its setting, three interpretations of the whole Mass with their four senses, a comparison, and the scriptural date and location of its passages'
subtitle = 'In Festo Omnium Sanctorum'
occasion-line = '''The sealed and the uncounted, the way of the Beatitudes, and the just in the hand of God:\\
a study of the proper in three interpretations'''
