[document.homily]
pdftitle = 'All Saints: No Want to Them That Fear Him'
pdfsubject = '''A homily for an adult parish assembly on the 1962 Missale Romanum proper of the feast of All Saints, as said on Sunday 1 November 2026: the Gradual's promise of no want to those who fear the Lord and the saints who went without, Augustine's hearer and his verdict on him, Basil's dilemma, Aquinas's help in need and the physician he takes from Augustine, the two present-tense beatitudes read with Augustine's pairing of the poor in spirit and the fear of the Lord, the Offertory's just in the hand of God and the Secret, the Lesson's multitude, Bernard on the command to fear, the Collect and Postcommunion, the Communion and the Introit'''
subtitle = 'No Want to Them That Fear Him'
