pdfsubject = 'Concise study of the 1962 Missale Romanum proper of the feast of All Saints, as said on Sunday 1 November 2026 with the commemoration of the Twenty-third Sunday after Pentecost: the appointed texts, four overview senses, the scriptural date and location of each passage, the themes of the propers, and a commentary comparing three interpretations of the whole Mass'
subtitle = 'In Festo Omnium Sanctorum'
