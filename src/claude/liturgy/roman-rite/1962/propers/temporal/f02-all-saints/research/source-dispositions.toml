id = "durandus-beleth-feast-history"
binding_index = 28
binding_sha256 = "a64e023d58cbdfd88d386a3cda8f81be6c828fd51e5e32b01b54235ba7398a49"
source_id = "artifact.william-durandus.rationale-divinorum-officiorum.1568-durandus-and-beleth-composite.ia-djvu-ocr-2bd5ccb5"
source_fingerprint = "sha256:0743746c9c3b58e9410502e22024af6353831bc135a69f0530a4c7919a0a3b7e"
locus = "Durandus, Rationale VII c. 34, physical lines 67273-67395, the Collect at line 67349; Beleth, Summa c. 127, physical lines 81693-81725, and c. 158 at line 83349; the 15 matches of the search tolerant of the OCR's readings of sanctorum"
relationship = "not-commentary"
disposition = "not-commentary"
reason = "The history of the feast and Durandus's four causes. He names the Lesson, the Gospel, the Collect and an Alleluia, and his Collect reads multiplicatis intercessionibus against the 1962 intercessoribus. That is a variant reading, shared with Ménard's Gregorian codex (PL 78) and the Monte Suavicino sacramentary (PL 151), while the Leonine and Gelasian prayer of the apostles and the Gilbertine, Sarum and Roman Missals read intercessoribus; no witness read establishes which came first, and his use is limited to what he says of the petition both forms share. Beleth gives history only. At the loci read neither author expounds a passage of Scripture; the use is liturgical history and comparison, not Scripture commentary."

