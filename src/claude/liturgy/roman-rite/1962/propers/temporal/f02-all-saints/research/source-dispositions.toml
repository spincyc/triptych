source_fingerprint = "sha256:f46dd80fe29ddd52cbaf7d81009b328bf011400b6917c0473b5f04f9bb443bae"
locus = "Expositio in Matthaeum II on Mt 5:1-12, physical lines about 91690-92200 (cols. about 794-798): Mt 5:3 at 91773-91783, Mt 5:8 at 91859-91872 (col. 796), Mt 5:9-10 at 92066-92077, Mt 5:12 from 92188"
relationship = "direct-exegesis"
disposition = "deferred"
reason = "The poor in spirit as the humble who fear God (from Augustine); on 5:8, God seen 'hic in aenigmate per gratiam, in futuro autem facie ad faciem', in Rabanus's own words; on 5:9-10, Augustine's sentence that the promises can be fulfilled in this life and that the eighth goes back to the start. A compilation whose sentences are marked by source (Hieron., Aug., Maur.), so most of the comment is not his own. The OCR is badly garbled (5:9-10 is held only in paraphrase), only cols. 796-797 were read on the page image, and the comment's boundaries are approximate; no passage record."
missing_criteria = ["passage-record", "natural-excerpt-boundary", "source-attribution", "page-image-collation", "verified-transcription"]
scripture_extents = [{ token = "Matt", first_chapter = 5, first_verse = 1, last_chapter = 5, last_verse = 12 }]

