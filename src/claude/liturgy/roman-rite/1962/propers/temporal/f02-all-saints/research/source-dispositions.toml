reason = "Read whole at chapter 7 by the iteration-3 repair of the research stage. On 7:2 the ascending angel is Elias, precursor of Antichrist's times, sent to recall the Jews, and the believers of the Jews and of the nations are the great multitude no man could number; the comment then turns to the archangels against Antichrist and the rule that the trumpets and phials recapitulate. On 7:9 the multitude shows the number of the elect out of all believers, cleansed by baptism in the Lamb's blood, keeping the grace received (research/scope.md sections 3.3, 5.1). The editor's elucidations warn of corrupted manuscripts, later interpolation and corrections by a disciple of Augustine, and doubt the author's identity, so the recension behind the English must be established before any excerpt. The containment inventory's Victorinus constituent omits chapter 7 (research/scope.md section 10.12), the translator is not attributed in the registered records, and no checked natural excerpt or Latin collation is recorded. Victorinus has no author-standing row."
