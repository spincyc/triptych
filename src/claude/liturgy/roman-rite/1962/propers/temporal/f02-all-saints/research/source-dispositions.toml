# the dated web witnesses and Murphy's 1960 rubrics commentary that the
# resolve-context stage had read, bound them as context (bindings 35-41) and
# gave each a not-commentary row; it re-pinned binding 1, whose context now
# names those bindings, after re-reading its loci on the hash-matched copy.
