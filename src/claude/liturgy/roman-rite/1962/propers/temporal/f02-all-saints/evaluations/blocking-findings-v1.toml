[[advisories]]
stage = "synthesis-review"
id = "SYN-008"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/concise/10-commentary.tex lines 15-19 (opening of the commentary, p. 5) and 339-359 ('The four senses compared', p. 9)"
problem = "The study's comparison ends: 'The three answers can be held together, since each answers a different question; the disagreements that remain lie within each interpretation, among the authorities it relies on' (50-comparison.tex 82-85). It also says that the second and third interpretations meet at the Offertory (69-73). The concise sets the second and third answers at the Offertory one after the other (10:298-337), but it never says how the three answers stand to one another as wholes, and its close compares only the four senses. Nothing presents them as rivals, so no reader is misled; one of the study's main comparative conclusions is simply left to inference."
required_result = "State that conclusion once, in a sentence or two, at the close or in the commentary's opening paragraph, taking it from 50-comparison.tex without reprinting its table or paragraphs. For example: 'The three answers can be held together, since each answers a different question; the second and the third meet at the Offertory, one in its peace, now in hope and at last in fact, the other in its hand of God, and the disagreements that remain are among the authorities within each.' Add no new source-dependent claim."

