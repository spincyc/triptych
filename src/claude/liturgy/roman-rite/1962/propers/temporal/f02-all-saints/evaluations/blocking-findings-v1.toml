[[advisories]]
stage = "research-review"
id = "RES-019"
severity = "advisory"
location = "proper-components.toml lane records (line 229 beatitudes-way-of-the-saints carrying_authors; line 238 no-want-just-in-gods-hand carrying_authors) against research/interpretations.md (Reading B 'Supporting reception (not carrying)' lines 293-298; Reading C 'Supporting reception (not carrying)' lines 402-412)"
problem = "The manifest names carrying_authors that the research record itself excludes from carrying. For beatitudes-way-of-the-saints the manifest lists Augustine, Chrysostom, Aquinas and Hilary, while interpretations.md marks Aquinas (doctor) and Hilary (father) 'Supporting reception (not carrying)' (this half was already noted in the run's evaluation record). For no-want-just-in-gods-hand the manifest lists Basil, Bellarmine, Augustine and Aquinas, while interpretations.md carries C on Basil with Bellarmine and lists Augustine and Aquinas as supporting only (lines 402-409, 498-499); this half has not been recorded before. The two records disagree about which authors carry lanes B and C. Nothing downstream breaks today -- each lane retains two standing-compliant carriers in interpretations.md, which governs authoring, and the checker rule passes on either list -- but the manifest overstates the carrying base, and any consumer that reads carrying_authors (the terminal apparatus, a later reviewer, the checker if it gains a stricter criterion) will get an answer the research record contradicts."
required_result = "Align the two records: either narrow each lane's carrying_authors in proper-components.toml to the authors interpretations.md marks as carrying (B: Augustine, Chrysostom; C: Basil, Bellarmine), keeping the others in the lane's authors list, or, if research judges Aquinas, Hilary or Augustine genuinely carry those lanes, record their carrying contribution at their loci in interpretations.md instead. The two files must tell one story about who carries each reading."

[[advisories]]
stage = "study-review"
id = "STU-014"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/30-beatitudes-way-of-the-saints.tex L124-127"
problem = "The quoted Latin 'in paternae majestatis positus celsitudine' drops a word of Hilary's text without marking the omission. The registered source (PL 9, col. 934, In Matthaeum cap. IV.1, ia-djvu-text-db389fea) reads 'in paternae scilicet majestatis positus celsitudine, ccelestis vitae praecepta constituit'. The study's other two Hilary quotations in the same paragraph ('caelestis vitae praecepta'; 'ejus corporis, quod ipse Dominus assumpsit habitaculum') are exact."
required_result = "Quote Hilary as the registered text has him: restore 'scilicet' ('in paternae scilicet majestatis positus celsitudine'), or mark the omission with an ellipsis."

[[advisories]]
stage = "synthesis-review"
id = "SYN-001"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/concise/90-apparatus.tex L49-52, against src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/research/interpretations.md (Reading B 'Supporting reception (not carrying)' lines 293-298; Reading C lines 402-412) and standing advisory RES-019"
problem = "The concise apparatus tells the reader: 'The carrying witnesses of the three interpretations are Bede and Augustine of Hippo (the first); Augustine, John Chrysostom, Thomas Aquinas and Hilary of Poitiers (the second); Basil of Caesarea, Robert Bellarmine, Augustine and Thomas Aquinas (the third).' This imports the manifest's carrying_authors into reader-facing prose, but the reviewed research record marks Aquinas and Hilary 'Supporting reception (not carrying)' for the second reading and Augustine and Aquinas 'Supporting reception (not carrying)' for the third. The underlying manifest-versus-interpretations.md discrepancy already stands as advisory RES-019 (research owner); the synthesis has propagated the manifest's side to a new reader-facing locus, so a consumer of the synthesis now meets the contested answer in prose. Advisory, not blocking: the substance was weighed and left advisory at research-review (each lane retains two standing-compliant carriers in interpretations.md, which governs authoring, and the checker passes on either list, so nothing downstream breaks); the sentence faithfully echoes a sealed authoritative input rather than inventing a claim; and which record should prevail is RES-019's open question for the research owner, not this review's to settle from the chair."
required_result = "When RES-019 is cleared and the manifest and interpretations.md tell one story, restate this sentence to match the aligned records -- naming as carrying the authors the aligned record marks as carrying, and presenting the others as supporting if they remain named. Until then this advisory stands beside RES-019 so that no later cold reader meets the claim as unweighed."

[[advisories]]
stage = "synthesis-review"
id = "SYN-002"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/05-appointed-texts.tex L22 and sections/90-apparatus.tex L37 (accepted expansive study; owner: study)"
problem = "The accepted study twice says 'the seven orations', but six orations exist in this 1962 occurrence -- the feast's Collect, Secret and Postcommunion and the commemorated Twenty-third Sunday after Pentecost's three -- and section 05 itself prints exactly six Lasance oration English blocks (lines 70, 96, 307, 327, 401, 422). Independently verified in this review. The defect was reported during derivation (research/production-review.md lines 402-408) for the study owner and has never been weighed by a reviewer; no standing id covers it. The synthesis under review does not carry the defect: it says 'the orations' without a count (sections/concise/90-apparatus.tex L42). Advisory, not blocking: the error is contained and non-load-bearing -- no map, table or interpretation uses the count, and the same section prints six oration texts, so a careful reader recovers -- and this lane's standing calibration for a comparable contained fidelity slip (STU-014, one word silently dropped from a Hilary quotation) is advisory."
required_result = "In the study, correct the count at both loci: 'the seven orations' becomes 'the six orations', or the count is dropped as the synthesis already drops it. The synthesis needs no change."

