required_result = "Either say that the search covered tracked text layers and YAML data but not TOML records, or include TOML records, correct the counts, and add the Lasance 1945 record to the hit list as a Roman Missal witness of intercessoribus."

[[advisories]]
stage = "study-review"
id = "STU-013"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/20-sealed-number-uncounted-crowd.tex lines 181-189; src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/30-beatitudes-way-of-the-saints.tex lines 177-183; src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/40-no-want-just-in-gods-hand.tex lines 169-181; the Preface clause at src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/10-each-element.tex lines 254-256, 20-...tex lines 150-151, 30-...tex line 183 and 40-...tex lines 180-181"
problem = "The STU-002 repair removed the manufactured roles. Each interpretation now ends its section on the other texts with a paragraph of bare clauses for the texts it does not use. Lane 2's last three sentences list the feast's three orations, the Sunday's three prayers and the Preface. Lane 3's paragraph lists ten texts (Collect, Secret, Lesson, Alleluia, Communion, Postcommunion, the Sunday's three prayers, the Preface), each with a Latin word, and never says what the interpretation makes of them. Lane 1's last paragraph does the same for the Offertory and the Sunday prayers; its Sicard sentence is a real connection and is not part of this finding. The clauses repeat what the map, the appointed texts and the element settings already give, and 'Either Preface ends with the praise of the angels' appears four times. Nothing in them is false and no role is claimed, and the profile gives a lightly touched text a clause. But gathered at the end of a section, with no bearing on the argument, they serve only to show coverage (guidance/editorial.md, 'Each sentence adds something', 'Say it once'). In lane 3 the bare words abundantiam, salutaria, reficiam, muniri and humanis periculis invite the reader to supply the roles that STU-002 removed. Advisory: the clauses are the ones the earlier required result asked for, they mislead no one, and they cost the reader a paragraph."
required_result = "Mention a text where the interpretation's argument, or an author it cites, touches it. For the texts it does not touch, give at most one sentence, of the kind already at 20:186-189. State the Preface fact once, in the element settings, and in an interpretation only where the angels matter (lane 1). Plain rewrites: (1) replace 40:169-181 with 'The other texts of the Mass, the orations of the feast and of the Sunday among them, ask mercy, pardon and protection; none of the authors above reads them with the Gradual's promise.' (2) Replace 30:177-183 ('The feast's three orations venerate ... Either Preface ends with the praise of the angels.') with 'The feast's orations and the Sunday's three prayers ask mercy through the saints, pardon and protection; no author above reads them with the Beatitudes.'"

[[advisories]]
stage = "study-review"
id = "STU-014"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/30-beatitudes-way-of-the-saints.tex line 188 ('The tenses of the Gospel are the hardest point.') and line 202 ('The difference is real, and it changes what the Gospel describes'); src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/40-no-want-just-in-gods-hand.tex lines 107-108 ('and the disagreement stands'), lines 187-188 ('and the difference is not only of emphasis') and lines 29-30 ('but the singers still know saints who were poor.')"
problem = "Four sentences tell the reader that a difficulty is hard, or that a disagreement is real or still stands, before saying what it is. That is performed emphasis, and 'the disagreement stands' names the discipline of keeping a difference rather than simply carrying it (guidance/editorial.md, 'Let emphasis come from content'; 'State the finding, not the process', on prose saying a difference was retained). 40:29-30 ends its paragraph on a turn that the next paragraph's objection already makes. These are isolated instances in different wordings, and the content after each is right."
required_result = "Let the content carry the weight and cut the certifying clause. Rewrites: (1) 30:201-204 -> 'Hilary places the rewards in heaven, for those changed by immortality. On his account the Gospel describes chiefly the state the saints now possess; on the others', the life they already lived.' (2) 40:106-109 -> 'The four agree that the fearer lacks nothing that matters, and disagree whether bodily need is included: Basil excludes bodily goods by the apostles' example, and Aquinas meets the same example with the physician.' (3) 30:188 -> begin at 'The first and the eighth beatitude are in the present, est, and the six between in the future.' (4) 40:186-188 -> 'The four Fathers meet it in different ways.' (5) 40:28-30 -> end at 'The Mass sings the promise without the half-verse about the rich.'"

[[advisories]]
stage = "study-review"
id = "STU-015"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/40-no-want-just-in-gods-hand.tex lines 92-93 and 102-103; src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/30-beatitudes-way-of-the-saints.tex line 190; src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/90-apparatus.tex lines 57-61"
problem = "Small precision points. (a) 40:92-93 says Aquinas meets 'the objection of St Paul'. In Super Ps. 33 n. 10 (Parma, checked) the objection is Augustine's, drawn from Paul's words: 'Sed objicit Augustinus in serm. Dom. in mont. quia Apostolus ait 1 Cor. 4 ...'. (b) 40:102-103, 'He says nothing of the vision of God', denies a link that the lane no longer draws (guidance/editorial.md, 'Deny only what someone holds'). (c) 30:190, 'The Fathers do not divide the rewards by those tenses', states a general negative about the Fathers, where research/scope.md 5.2 records only that no witness read divides them. (d) The scope appendix gives retrieval mechanics: 'held only in remote volumes that were not fetched' and 'which the library does not hold'. The 1962 profile's Terminal Apparatus leaves those in research/scope.md; 'not read' is the bound."
required_result = "(a) 'He meets the objection Augustine draws from St Paul's \"Even unto this hour we both hunger and thirst\" (1 Cor 4:11) with the physician ...'. (b) Cut the sentence. (c) 'None of these authors divides the rewards by those tenses.' (d) Keep the list of works not read and drop the reasons for which they were not fetched or held."

[[advisories]]
stage = "synthesis-review"
id = "SYN-004"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/concise/03-date-location.tex lines 16, 20, 24 and 28 (place phrases of rows row-e88e943a6faaa20b, row-fb6656afd6f4b4f0, row-43dce930fad06090 and row-8b85083df79d6e95); physical p. 2"
problem = "Four rows on the rendered p. 2 table still give no place and do not say that the place is unknown. They are: the traditional-attribution row for the two psalms ('Two psalms of praise and of the fear of the Lord ...'); the Psalter's composition ('The Psalter, the book in which both psalms stand.'); Wisdom's composition, which names the Ptolemaic reigns but no place of writing; and Matthew's composition ('The Gospel according to St Matthew, from which ...'). The three-document profile asks the table to keep the writer's place distinct and to 'say when a location is unknown'. The file has not changed since iteration 1, and the same phrases stand in sections/80-date-location.tex."
required_result = "Where the chronology record supplies no place for a composition or attribution row, say so in that row's phrase, for example 'place of writing not given', instead of leaving the place unstated. If a phrase changes, make the same change in the expansive study's Scriptural Date and Location appendix."

[[advisories]]
stage = "synthesis-review"
id = "SYN-005"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/concise/10-commentary.tex lines 27-29 (p. 5), 110-111 (p. 6) and 347-349 (p. 9)"
problem = "Three framing clauses still say more than the sources as the study and research records hold them. (a) Lines 27-29 say that 'Three early commentators on the Apocalypse agree that the multitude holds the elect of every nation.' For the anonymous Expositio, the study (20-sealed-number-uncounted-crowd.tex 75-83) and research/scope.md (PL 35 cols. 2425-2426) record only the angel (the Church) and the number ('omnis omnino Ecclesia est'), nothing on the multitude. Bede's first account of 7:9 is the victors of the last persecution, and only his second names the Gentiles (research/interpretations.md 57-59). The study writes 'Two other early commentators differ from Bede on the angel', with no three-way agreement. (b) Lines 110-111 say that 'Augustine and Aquinas agree that the multitude no man could number has a number'. Ench. 29 and ST I q. 23 a. 7 speak of the number of the saints and of the predestined; the registered English Dominican text was checked for Aquinas. Applying their words to the Lesson's multitude is the study's own inference, and the study keeps it as one (20:116-119, 203-205). (c) Lines 347-349 give the third interpretation's allegory as Israel 'which killed the Bread of life and went hungry'. Basil's Israel suffers 'the famine of hearing the word' (40-no-want-just-in-gods-hand.tex 55-56, 206-207), and the concise itself says 'now hungers for the word' at line 217. In an interpretation about bodily want, 'went hungry' reads as bodily hunger. None of the three changes a controlling claim, and the paragraphs that follow give each commentator's own words."
required_result = "(a) Replace lines 27-29 with 'Three early commentators on the Apocalypse differ over the number and over the angel who seals; Bede, in the second of his two accounts of verse 9, and Victorinus find the nations in the multitude.' Alternatively, keep only the sentence on where they differ. (b) Replace lines 110-111 with 'Augustine and Aquinas agree that the number of the saints is fixed and known to God.' (c) At line 348, write 'Israel, which killed the Bread of life and now hungers for the word'. Add no new source or locus."

[[advisories]]
stage = "synthesis-review"
id = "SYN-006"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/f02-all-saints/sections/concise/10-commentary.tex lines 34-36, 98-99, 113-116, 124-125, 150-153, 169-170, 208-210, 212-213, 254-256 and 311-313, against sections/concise/04-themes.tex lines 26-27, 64-65, 79-84, 87-89, 100-102, 105-106 and 117-119"
problem = "Most of pp. 5-9 goes beyond the opening, but in about ten places the commentary repeats what pp. 3-4 have just given. The sentence on the Beatitudes' tenses (04:100-102) returns almost word for word at 10:254-256. Gal 3:29 is quoted on p. 3 (04:64-65) and again on p. 5 (10:35-36). Bernard on the night-office verse is given on p. 4 (04:82-84) and twice more (10:113-116, 208-210). Each of the following appears twice: Augustine's objection (04:79-82; 10:212-213), Chrysostom's 'not this or that person' (04:87-89; 10:124-125), Fromage's filled choirs (04:26-27; 10:98-99), Augustine's gloss from Enarr. 87 (04:117-119; 10:311-313), and the eighth beatitude's return to the start (04:105-106; 10:169-170). The first unit also ends (10:150-153) by listing again the four differences it has just set out. Each repeat is short and sets up a comparison, so this is not the section's habit under 'Say it once' (guidance/editorial.md), but the reader crosses the same ground twice in eleven pages."
required_result = "Where the commentary needs a point that pp. 3-4 already gave, name it in a clause and go straight to what is new; do not quote it again. Rewrites: (1) Replace 10:254-257 ('The Beatitudes do not keep one tense ... None of these authors divides the rewards along those lines.') with 'None of these authors divides the rewards by the Beatitudes' tenses.' (2) At 10:113-116, drop the restatement of the night-office point and keep only what is new: 'Bernard, in the same sermon, calls those still in the fight holy juxta solam adhuc praedestinationem, \"so far only by predestination,\" with a holiness that latet ... penes Deum, lies hidden with God (sermo 5, nn. 2-3).' (3) Cut the closing list at 10:150-153 ('Its authorities differ on the angel who seals ... makes salvation easy.'). (4) At 10:35-36, cite Gal 3:29 without quoting it again. Keep every claim-local qualification."

[[advisories]]
stage = "synthesis-review"
id = "SYN-007"
