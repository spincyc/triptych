[[advisories]]
stage = "visual-review"
id = "VIS-005"
severity = "advisory"
location = "Concise study f02-all-saints-synthesis.pdf, physical page 2, Occurrence and place cells, and the identical table on expansive study page 27; sources sections/concise/03-date-location.tex and sections/80-date-location.tex (the authored place phrases in \\chronologyorientationrow)"
problem = "The lookup's place leg is unanswered in four of the eight rows. The traditional-attribution row ('David's reign. Two psalms of praise and of the fear of the Lord ...'), the Psalm 32 historical-setting row ('A hymn bidding the just rejoice ...'), the Psalter composition row ('The Psalter, the book in which both psalms stand') and the Matthew composition row ('The Gospel according to St Matthew, from which the Alleluia verse, the Gospel and the Communion are taken') each describe the occurrence, but none names a place or says that the place is unknown. The Wisdom row gives Egypt only by implication, through 'reigns of Ptolemaic kings of Egypt'. The profile asks the author's phrase to name the place of the dated subject and to say when a location is unknown (propers-three-documents.md, A table that locates the passage; scripture-chronology.md section 14.1). The event rows (Galilee, Achis and Geth, Patmos) do answer it. Nothing is misstated, so a reader is not misled, but a reader who asks where a passage was written finds no answer for these rows."
required_result = "In both tables, each of these rows' place phrase either names the sourced place of the subject it dates, as the chronology's own sources give it (the writer's place for a composition row, the attribution's geographic frame for the Davidic row), or says in a few words that the place is unknown. The phrase must not invent a place, add a date, or restate the psalm numbering. The two tables stay identical, and the page-2 table still fits its page without smaller type."

[[observations]]
