[[advisories]]
stage = "homily-review"
id = "HOM-009"
severity = "advisory"
location = "research/scope.md lines 1105-1107 (Aquinas, In Ps. 33 n. 10); research/interpretations.md line 407-408 (Reading C, Aquinas); sections/40-no-want-just-in-gods-hand.tex lines 92-95 and 105-109; sections/concise/10-commentary.tex lines 235-238 and 244-250; research/source-bindings.toml, the binding of the NPNF I.6 text (lines 441-452)"
problem = "The homily now credits the physician to Augustine as Aquinas reports him (10-homily.tex lines 53-56; 90-note.tex lines 50-55 and 141-144; References line 163; the PDF subject). That matches Aquinas, In Ps. 33 n. 10 (Parma vol. 14 p. 206, registered OCR lines 42642-42652): 'Sed objicit Augustinus in serm. Dom. in mont. quia Apostolus ait 1 Cor. 4 ... Et dicit quod Deus est nutritor et medicus.' The homily part of this advisory is therefore cleared. The research records and both studies still say only that Aquinas raises the objection of 1 Cor 4:11 and answers it with the physician, without saying that he reports Augustine. The homily and the reviewed studies now name different saints for the same image. The homily also cites De serm. Dom. II.17.58 (NPNF I.6, registered text lines 5850-5878), which no research record names and which the leaf's binding of that registered text does not list among its loci. The argument and the Basil-Aquinas difference over bodily goods are unaffected."
required_result = "When the research records and the two studies are next revised, scope.md, interpretations.md, section 40 and the concise commentary say that Aquinas takes the objection of St Paul's hunger and the physician's answer from Augustine. For example: 'He meets St Paul's \"Even unto this hour we both hunger and thirst\" (1 Cor 4:11), an objection he says Augustine raised, with Augustine's answer (De serm. Dom. II.17.58): God is nourisher and physician, and a physician withholds food from the sick for their health.' The NPNF I.6 binding in research/source-bindings.toml also names De serm. Dom. II.17.58 at its registered lines."

[[advisories]]
stage = "homily-review"
id = "HOM-011"
severity = "advisory"
location = "sections/homily/10-homily.tex line 72 (paragraph 7) and lines 110-111 (paragraph 12); 90-note.tex lines 107-113"
problem = "The speech uses one word in two senses five paragraphs apart. In paragraph 7, 'the beatitudes' are the Gospel's eight sayings: 'He matches the beatitudes with the gifts of the Holy Spirit ... so that the fear of the Lord stands first, and he gives that fear to the humble, the poor in spirit.' In paragraph 12, Bernard's 'tota interim beatitudo nostra est timere Deum' is quoted as \"our whole beatitude is to fear God\", where beatitude means blessedness. A listener who has just heard that Augustine puts the fear of the Lord first among the beatitudes will most easily hear Bernard saying that the Beatitudes all come down to fearing God. Bernard does not say that (sermo 5 n. 3, PL 183, registered OCR lines 42623-42639). He says that our blessedness for now lies in the fear of God, while the saints' festivity lies in exultation and praise. This is one sentence, so the finding is advisory."
required_result = "Bernard's word reaches the ear as blessedness or happiness, not as the Gospel's sayings. For example, lines 110-111: 'For now, he said, our whole happiness is to fear God, while the saints keep their feast in joy and praise.' The note's account of what is quoted and what is paraphrased (90-note.tex lines 107-113 and 119-120) then lists Bernard's n. 3 sentence among the paraphrases. Alternatively, the quotation stays and paragraph 7 says 'the eight blessings of the Gospel' where it now says 'the beatitudes'."

