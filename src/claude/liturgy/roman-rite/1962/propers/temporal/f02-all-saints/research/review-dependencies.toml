#
# Rights, ledgers, standing and joins
# - missale-romanum-1962-facsimile-rights-v1.toml: the 17 U.S.C. 103(b) holding
#   on which the Latin's publication basis rests, with Mame 1922 and Pustet 1862
#   as the witnesses (propers/verified.md; research/scope.md section 9).
# - lasance-new-roman-missal-rights-v1.toml: the nonrenewal record and excluded
