# - author-standing-v1.toml: the standing column of the witness register
#   (research/scope.md section 4) and the missing rows for Bernard, Victorinus,
#   Cyprian, Bonaventure, Alphonsus Liguori, Peter of Celle and (iteration 2)
#   Bruno of Würzburg that keep them from carrying a reading, and Rabanus
#   Maurus's saint row, on which iteration 2 makes him a carrying author.
# - source-containment-v1.toml and commentary/passage-commentary-index.yaml: the
#   joins behind `commentary-work-index discover` for every appointed passage,
#   including the Victorinus extent defect and the Wis 3:1-3 entry that maps no
#   commentary although Bonaventure's is contained (research/scope.md sections 3
#   and 10).
# - commentary/formulary-loci.yaml: the empty `formulary` result for
#   omnium-sanctorum and pentecost-23 (research/scope.md section 3.1).
# - calendars/roman-1962/propers.yaml and rubrics.yaml: the occurrence and
#   precedence inputs research/context.md adopts, and the Gospel and Offertory
#   ranges research/scope.md sections 8.2 and 10 report.
#
# Ordinary marginal numbers
