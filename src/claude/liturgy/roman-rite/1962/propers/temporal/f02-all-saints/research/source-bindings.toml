context = "Loci follow the work's grammar, Vulgate psalm number and exposition section, using the NPNF printing's own section numbers; their correspondence to the Benedictine sections was not checked. In Ps 32 NPNF's sections 1 and 12 are its comments on vv. 1 and 12. In Ps 33 sections 13-14 comment on the Gradual's Vulgate vv. 10-11 and section 15 on Vulgate v. 12. NPNF numbers Ps 33's verses by the English psalter, which leaves the inscription unnumbered, so NPNF ver. 9, 10 and 11 are Vulgate 33.10, 33.11 and 33.12; in Ps 32 its verse numbers agree with the Vulgate's. Read whole for both psalms: Ps 32 Vulgate (NPNF Psalm XXXIII), lines 7871-8011, and Ps 33 Vulgate (NPNF Psalm XXXIV), lines 8012-8624. The Gradual's Vulgate vv. 10-11 are NPNF ver. 9-10, sections 13-14 at lines 8237-8288; NPNF ver. 11 (Vulgate v. 12, Come, ye children; section 15, from line 8289) lies outside the Gradual and supports no reading. Seconds interpretation A (the one nation of the heavenly city) and supports C (the scandal of the prosperous wicked resolved spiritually). The same artifact's exposition of Ps 118 Vulgate (NPNF Psalm CXIX, whose verse numbers there agree with the Vulgate's), section Nun, comment 108 on ver. 109 (My soul is alway in Thy hand), physical lines 58646-58658, was read at the verse: it quotes the souls of the righteous are in God's hand (line 58648; NPNF note [5293] at line 58717 gives Wisd. iii. 1) and is recorded as Offertory reception in research/scope.md §3.7. That comment carries no locus above because NPNF's comment number 108 is not a section number the work's grammar can state; research/source-dispositions.toml keeps its native locus. The numbering hazard is recorded in research/scope.md §6.9."

