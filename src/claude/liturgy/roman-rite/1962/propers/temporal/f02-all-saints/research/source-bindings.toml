source_fingerprint = "sha256:f46dd80fe29ddd52cbaf7d81009b328bf011400b6917c0473b5f04f9bb443bae"
context = "OCR, with the quoted loci read on the page images of the remote scan bound next. Physical lines: Expositio in Matthaeum II on Mt 5:1-12, about 91700-92080 (cols. about 794-798; the column heads 790 and 810 stand at lines 91375 and 92844), with Mt 5:3 at 91773-91783, Mt 5:8 at 91859-91872 (col. 796) and Mt 5:9-10 at 92066-92077; the Lord's Prayer passage at 93916-93937 (cols. 821-822); Expositio IV on Mt 11:28 at 101134-101141 (col. 916). Rabanus Maurus (standing saint), Expositio in Matthaeum, a compilation that names many of its sources in parenthetical labels in the running text, such as (Hieron.), (Aug.) and (MAURUS.) for his own words. On Mt 5:1-12: the poor in spirit as the humble who fear God, 'Initium autem sapientiae timor Domini' (from Augustine); on 5:8 in his own words, God seen 'hic in aenigmate per gratiam, in futuro autem facie ad faciem'; on 5:9-10 Augustine's sentence that the promises can be fulfilled in this life and that the eighth goes back to the start (OCR garbled, paraphrased). On the Lord's Prayer, Augustine's matching of the petitions to the beatitudes (De serm. Dom. II.11.38). On Mt 11:28 the burden is sin (Zach 5, Ps 37), or else the Law's heavy yoke, from which the call is to the Gospel's grace; that comment carries no label and is Jerome's (In Matth. II, PL 26 col. 75), taken over nearly word for word, as is the Eunomius sentence of the comment on 11:27. Carries reading B; disagreement 6.8 (research/scope.md sections 3.0, 3.6, 3.7, 4, 5.2 and 6). Lines 91859 (5:8 lemma), 93920 (the Lord's Prayer passage) and 101134 (the 11:28 lemma) are the hits of the whitespace-tolerant replay of iteration 1's queries; line 107010 (ascendit in montem) is Lk 9:28 at the Transfiguration, not Mt 5:1, and line 87794 (in pace sunt omnia quae possidet) is Lk 11:21, a phrase coincidence (research/scope.md section 3.0)."

