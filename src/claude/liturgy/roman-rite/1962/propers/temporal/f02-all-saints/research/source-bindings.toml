#
# States describe what the research stage of run 450355254538c1ba did with each
# record on 2026-10-27. `inspected` means this stage read the bound locus itself
# in the bytes named; `verified` is claimed only for page images read to control
# a form or a publication basis (the 1962 facsimile, Mame 1922, Pustet 1862 and
# the Lasance English). Remote artifacts were fetched whole and matched to their
# registered SHA-256 before any page was read; nothing was retained in the
# library by this stage, and no source was registered by it.
#
# Sources read outside the library were named in research/scope.md with their
# hashes and handed to the source-registration stage, which registered them and
# bound them at the end of this file: St Bernard's sermons In
# festo omnium Sanctorum (PL 183, Internet Archive), and the New Advent page of
# Summa theologiae I q. 23 (whose wording was then confirmed in the registered
# Gutenberg text bound below). The Scripture chronology sources are cited by
# research/chronology.toml and are sealed with it; they are not repeated here.
# Fingerprints were taken from tools/tpt source-library fingerprint on
# 2026-10-27.
#
# Iteration 1 of the research stage (same run, 2026-10-27) widened the loci
# and contexts of bindings it re-read (Durandus and Beleth, Fromage, Cyprian,
# Augustine's sermons and psalms, Bellarmine, the Parma Aquinas, the PG 29 and
# PL 183 text layers, NPNF I.10, ANF VII and the Bible context bindings) and
# appended the bindings after the last section below for the sources it newly
# read, searched or used to locate a passage. Every appended source was already
# registered; each fingerprint was taken from tools/source-library fingerprint
# on 2026-10-27. Existing bindings keep their positions.
#
# Iteration 2 (same run) replayed the research's literal queries with
# whitespace-tolerant matching over the whole text of each tracked file, because
# many Internet Archive text layers double-space words and break phrases across
# lines. It replaced iteration 1's five negative-search receipts against PL 107,
# which the replay overturned, with reception records for Rabanus Maurus and for
# the remote scans of PL 107 and PL 9 read for Rabanus and Hilary; corrected the
# contexts of the bindings whose claims changed (the scan once cited as the 1920
# Missal, Augustine's De sermone Domini loci, Hilary, Durandus and Beleth, the
# PL 78, PL 142, PL 151 and PL 202 volumes, Gregory's Moralia, Fromage and the
# Parma Aquinas); and appended context bindings for the registered artifacts
# whose replay hits it read at the line. Every source was already registered;
# fingerprints were taken from tools/source-library fingerprint on 2026-10-27.
#
# The source-registration stage of the same iteration retained the scan pages
# on which Rabanus and Hilary were read as two tracked facsimile excerpts, bound
# at the end of this file, and added to the Bonaventure, PL 78 and PL 107
# contexts the replay hits it read at the line. Their fingerprints were taken
# from tools/source-library fingerprint on 2026-10-27.
#
# Iteration 3 (same run) restated the Collect's intercessoribus and
# intercessionibus as two variants without assigning either priority, and
# corrected the contexts that had called intercessionibus the older reading
# (Durandus, the Legg Sarum Missal, PL 78, PL 151). It read the prayer of all
# the apostles that the Collect adapts in the Leonine (Feltoe) and Gelasian
# (Wilson) Sacramentaries, searched the whole library for the Collect and
# read Jerome on Mt 11:28 on the remote PL 26 scan; it widened the contexts
# of the Roman Missal text layers, PL 107, the Hadrianum and Sicard's PL 213,
