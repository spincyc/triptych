context = "Read at the paragraph by the iteration-3 repair of the research stage. Cyprian reads the great multitude which no man could number, washed in the Lamb's blood, as the Christian martyrs, whose number, unlike the ancient examples, cannot be counted, so that no one should think martyrdom hard. A third reading of the crowd, against Bede's whole Church; Bede at v. 14 and the anonymous Expositio in PL 35 (binding 46) both reject the martyrs-only reading. Cyprian has no author-standing row and cannot carry (research/scope.md sections 3.3, 4, 6)."

