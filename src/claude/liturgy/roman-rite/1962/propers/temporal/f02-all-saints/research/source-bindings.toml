context = "The anonymous Expositio in Apocalypsim printed in PL 35's appendix of Augustine's works (col. 2417 in the volume's Elenchus). The iteration-3 repair of the research stage fetched the registered remote whole scan from its recorded source_url on 2026-10-26; its SHA-256 and byte size (62,548,064) matched the artifact record before any page was rendered. PDF p. 557 (cols. 2415-2416), the editors' Admonitio, and PDF pp. 562-563 (cols. 2425-2428), Homily VI's comment on Apoc 7 in cols. 2426-2427 and its recapitulation in col. 2428, were read on page images rendered at 150 to 300 dpi; the Internet Archive OCR of the item served only as a finding aid (now the registered artifact ...ia-djvu-text-54f87784, binding 47). The source-registration stage (iteration 3) retained the four pages as this tracked excerpt, checked each extracted page's embedded image byte for byte against the parent scan, and re-rendered and read the excerpt's pages; the binding moved from the remote whole scan to this excerpt so the checked pages are openable without the network, the parent staying remote for its measured size. The loci are the printed columns; the page mapping is: the Admonitio (columns 2415-2416) at excerpt PDF p. 1 = parent PDF p. 557, the Expositio's opening (column 2417) at excerpt PDF p. 2 = parent PDF p. 558, and Homily VI on Apoc 7 (columns 2426-2427, recapitulation column 2428) at excerpt PDF pp. 3-4 = parent PDF pp. 562-563. The Admonitio says the exposition is largely stitched together from the words of Victorinus, Primasius and Bede, that some wished it to be Tyconius's, and that the Louvain theologians judged it annotations collected by someone and later put into homily form; it makes no attribution to Caesarius of Arles. The comment reads the 144,000 as the whole Church (tota Ecclesia intelligitur), the innumerable multitude as the same Church, the Gentiles grafted into the root by believing, the white robes as the gift of the Holy Spirit, the angels around the throne as the Church, the angel ascending from the east as the Church rising from the Lord's passion or resurrection, and the washed robes as said of the whole Church and not of martyrs only, fulfilled through the sacrament of baptism. Agreement with Bede from an anonymous, dependent compilation: reception without standing, not an independent witness (research/scope.md sections 3.3, 4, 7)."

