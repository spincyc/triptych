context = "Read at the chapter by the iteration-3 repair of the research stage. In his exposition of Tyconius's rule of legitimate numbers Augustine (father) states that the number 144, twelve multiplied into itself, signifies in the Apocalypse the whole body of the saints, and that this number refers not to times but to men. The text does not separate Tyconius's own application from Augustine's statement of it. A hermeneutical statement on the Lesson's number (Apoc 7:4), not a verse commentary; it seconds Bede's reading of the number as the whole Church (research/scope.md sections 3.3 and 5.1)."

