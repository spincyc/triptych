source_fingerprint = "sha256:f3e73dde77b3f5cefed09f8434f7e1d070ba005508c320851c66d617b3e618ae"
context = "The oldest Latin commentary on the Lesson held in the library, read by the iteration-3 repair of the research stage in the tracked CCEL text of ANF VII. On 7:2 the angel ascending from the east is Elias, precursor of the times of Antichrist (Mal 4:5-6), sent to recall the Jews; the number of those that shall believe, of the Jews and of the nations, is the great multitude which no man could number; seven archangels smite Antichrist's kingdom; and the trumpets and phials recapitulate, so order is not to be sought in the Apocalypse. On 7:9 the multitude out of every tribe shows the number of the elect out of all believers, cleansed by baptism in the blood of the Lamb, keeping the grace received. On 12:6 the 144,000 are those who believe at Elias's preaching in the last times. The commentary passes over vv. 3-8 and 10-17. The editor's elucidations warn that the manuscripts are corrupted and interpolated, possibly corrected by a later disciple of Augustine, and that the author's identity is doubted; the recension behind the English is not established in the registered records. The containment inventory maps the Victorinus constituent only to Rev 1, 5 and 19, which is why discover reported Apoc 7 outside its extent (research/scope.md section 10.12). Victorinus has no author-standing row, so he cannot carry; he is a developed supporting and rival witness for interpretation A (research/scope.md sections 3.3, 5.1, 6)."

