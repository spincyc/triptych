  "the same commentary, from the twelfth chapter (line 33901), the comment on 12:6 at lines 33964-33974: in the last times a hundred and forty-four thousands should believe on the preaching of Elias",
  "the volume's elucidations to the commentary, items 9-18 at lines 34467-34545 (Dan in the ch. 4 comment against Rev 7:5-8; corrupted manuscripts, interpolation, a later Augustinian corrector, the author's identity)",
]
role = "bibliographic"
