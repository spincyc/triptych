[[advisories]]
stage = "research-review"
id = "RES-005"
severity = "advisory"
location = "research/interpretations.md section 5, carrying-authors table, `word-at-a-distance` row ('Gregory: presence by the Spirit everywhere')"
problem = "The iteration-1 revision removed the paraphrase that was quoted as Augustine's, turned the Gregory sentence in the homily notes (now section 4.7) into a description, and section 1.2 now leaves per spiritum in Gregory's Latin, saying the records do not settle it as the Holy Spirit. The carrying-authors table in section 5 still sums up Gregory's developed contribution as 'presence by the Spirit everywhere', which is the capitalised reading section 1.2 disclaims. This is the row a manifest lane record is most likely to copy."
required_result = "Reword the section 5 entry so that it does not resolve Gregory's per spiritum as the Holy Spirit (for example: the Lord sought in bodily presence who was nowhere absent; healing by command alone), in line with section 1.2."

[[advisories]]
stage = "research-review"
id = "RES-010"
severity = "advisory"
location = "research/interpretations.md section 2.5, second bullet ('so he shares the Rock-is-Christ reading and differs from Augustine only by adding the literal and allegorical senses'), and section 2.6, fifth bullet ('Augustine, Hilary, Cassiodorus and Bellarmine read the little ones dashed on the Rock as sins killed young against Christ'); research/scope.md section 4.9, closing paragraph ('Augustine, Hilary, Cassiodorus and Bellarmine (in his moral sense) agree that the little ones dashed on the rock are sins or desires killed while young')"
problem = "The RES-003 repair quotes Bellarmine's three senses of Ps 136:7-9 accurately at the locus (O'Sullivan tracked text, physical line 4843), but its summary sentences go too far the other way and claim an agreement he does not hold. In both of Bellarmine's spiritual senses the little ones are persons, not desires. Allegorically they are the pagans' children, converted and brought 'to the rock, Christ, to get a fortunate dash against it, and die the death of the old man, to rise a new man'. Morally, set against the king of Babylon's snares for 'the little ones of Christ', the blessed man 'by a happy dash on the rock, kills sin, those who have not been too deeply stained with it, that they may live to justice'. Augustine (Enarr. 136.12, NPNF1-8: 'What are the little ones of Babylon? Evil desires at their birth'), Hilary (Tract. 136.14, PL 9 col. 784: 'tenera adhuc corporis vitia') and Cassiodorus (CCSL 98 p. 1235: 'carnis scilicet errores') make the little ones the nascent vices themselves. Bellarmine shares the Rock as Christ and the early killing of sin, but he differs on what the little ones are. 'Differs only by adding the literal and allegorical senses' is therefore untrue, and a study following section 2.6 would credit him with Augustine's identification."
required_result = "Revise the three sentences so that Bellarmine is credited with the Rock as Christ and the early death of sin against it, and record the difference: his little ones are Babylon's young (the pagans' children, or those not yet deeply stained), brought to Christ to die to sin and live, where Augustine, Hilary and Cassiodorus make them the nascent desires or vices."

[[advisories]]
stage = "research-review"
id = "RES-011"
severity = "advisory"
location = "research/scope.md section 2.1 (Berno row and the bullet 'The wedding-feast Gospel is the source of both the chant voices and the two choirs'), section 3.2 (Collect, Berno), section 4.4 (Berno bullet) and the note after the section 1.3 table; research/interpretations.md section 2.2 (Sicard, Durandus and Berno bullet, 'Propter haec omnia'), section 2.3 Collect row and section 3.2 (documented reception of the compilation, Berno)"
problem = "The RES-009 repair records that Rupert's chant voices and Fromage's two choirs are read out of the wedding-feast Gospel, and bounds them. Berno's locus has the same shape and is not recorded that way. In Libellus c. 5 (PL 142 cols. 1070-1071, tracked OCR lines 85820-85870) the scene of the guest without the wedding garment, cast into the outer darkness (Mt 22), comes first. Then 'Quod intuens populus poenitens: Super flumina ... dum recordaremur tui, Sion' follows, then the cantor's Omnia quae fecisti and the responsory 'jam aspirans ad convivium Dei'. The Collect's petition is 'Propter haec omnia', and that 'all' includes the scene. The records use Berno's penitent people, his cantor and his 'propter haec omnia' join (scope 4.4; interpretations 2.2, 2.3 and 3.2) without saying that the parable is their motive; only the responsory's banquet terms are flagged (scope 3.4). Separately, the note under the section 1.3 table names Berno only for the Offertory's tui. The same locus also quotes the Gradual as 'tu das illis escam', the Missal's order that the table reports as not found in any psalter text, and the Communion with 'servo tuo, Domine'."
required_result = "Record in section 2.1, as was done for Rupert and Fromage, that Berno's penitent people, his cantor and his Collect join follow the wedding-feast scene of his Mass ('Quod intuens ...'). Bound their use so that a study cites only what he says of a shared element, without that frame. Complete the section 1.3 note with Berno's chant forms of the Gradual and Communion, kept as chant witnesses and not as sources of the wording."

[[advisories]]
stage = "research-review"
id = "RES-012"
severity = "advisory"
location = "research/scope.md section 3.5 (Alleluia, Ps 107:2) and section 1.3 (Alleluia row, 'PL 9 has no tractate of Hilary on Ps 107')"
problem = "The Alleluia's words are Ps 56:8-9 as well as Ps 107:2-3 (scope 1.2), and the sweep follows that route for Augustine (Enarr. 56, NPNF1-8) and Bellarmine (Ps 56:8). It does not follow it for Hilary. His Tractatus in Ps 56 stands in the bound PL 9 OCR layer: the edition's psalm-text heading at about physical lines 29070-29095 prints 'Paratum cor meum, Deus, paratum cor meum: cantabo et psalmum dicam tibi. Exsurge gloria mea', and the commentary follows. `commentary-work-index discover` reports Hilary as held for Psalm 56. The matrix records neither a reading nor a disposition. Section 1.3 says only that PL 9 has no tractate on Ps 107, which leaves out a psalter-text witness to the same verse."
required_result = "Read Hilary's Tract. in Ps 56 on vv. 8-9 in the bound PL 9 layer, giving the column and checking the page image before any Latin is quoted. Record in section 3.5 what it says of the prepared heart and the song, and add its psalm-text heading and lemma to the section 1.3 Alleluia row. Alternatively, record the lead and say why it was not opened."

[[advisories]]
stage = "study-review"
id = "STU-004"
severity = "advisory"
location = "sections/50-comparison.tex lines 27-30 (the witness sentence beginning 'St Augustine speaks in all three'); evidence at sections/20-word-at-a-distance.tex 141-145, 163-169, 193-198 and sections/30-songs-of-sion.tex 51-61, 182-189, 195-197"
problem = "The comparison says that Augustine speaks 'for the order of prayer, the prepared heart and the physician's due time in the first, for the rivers of Babylon and the road of the law in the second'. The second reading uses all three of the loci credited to the first. It quotes Enarr. 144 on v. 17 (the saints first praised his justice) at 30:51-61. It reads the Gradual's due time as Augustine's physician's care at 30:195-197. And its Alleluia account quotes the same sentence of Enarr. 56 on v. 8, 'the patience of good men with preparation of heart accepteth the will of God', at 30:184-186. The first reading repeats that sentence at 20:164-166. The iteration-1 repair added 'the prepared heart' to the first reading's list, extending an allocation that already overlapped. Nothing false is asserted, but the sentence presents as the first reading's own a body of Augustinian evidence that the first and second readings share. That shared evidence is exactly what the comparison exists to show, and it leaves unsaid how differently the two readings use it: the first for accepting another means than the one asked, and the father's night of waiting; the second for glorying and singing in tribulation, and the exiles' waiting."
required_result = "The comparison names Augustine's order of prayer (Enarr. 144 on v. 17), his physician's due time (144 on vv. 15-16) and his prepared heart (56 on v. 8) as evidence shared by the first and second readings. In a clause, it says how each reading uses them differently. It does not credit them to the first reading alone. No other sentence needs to change."

[[advisories]]
stage = "study-review"
id = "STU-005"
severity = "advisory"
location = "sections/20-word-at-a-distance.tex lines 170-171 ('Neither speaks of the Gospel, and the join is the editor's'), 179-181 ('Here too the join to the Gospel is the editor's: ...'), 187-189 ('On the editor's reading the ready heart and the mind at rest are one disposition'); sections/50-comparison.tex lines 4-5 ('and what they share can be said exactly')"
problem = "The new Alleluia and Collect prose names the evidence class of its own connections three times, and the comparison opens by announcing its own precision. guidance/editorial.md ('Speaking from within the tradition'; 'State the finding, not the process that produced it') treats a qualifying sentence as legitimate when its subject is a source, a text or a witness. The same sentence is the defect when its subject is the guide, the reading or an evidence class: 'Naming the discipline is itself the defect.' The three-document profile leaves the synthesis label to research/interpretations.md. The study meets that bound by crediting each Father only with what he said. Line 170, 'Neither speaks of the Gospel', already does so with the sources as subject, so the added label adds nothing. These clauses answer the wording of STU-001's required result ('Mark any join ... as the editor's'). That instruction was satisfied by the source-subject sentence, and it is the reviewer's wording that invited the label. The sentence at 179-181 is also hard to parse: it announces a join and then gives it only as a negation, with 'the ruler's' left to stand for 'the ruler's rank'. No reader is misled, since no join is attributed to a Father. The phrasing occurs nowhere else in the study, and the house-voice screen, which is partial by construction, passed it."
required_result = "In those places, a source, a text or the father is the grammatical subject. 'Neither speaks of the Gospel' stays. The clause 'and the join is the editor's', the sentence opener 'Here too the join to the Gospel is the editor's' and the phrase 'On the editor's reading' go. The gloria mea contrast is stated directly: the glory the verse sings is God, while the honour Gregory says pride pays to rank is the honour the ruler expected. The comparison's 'and what they share can be said exactly' goes. No attribution changes, and no Father is credited with any join."

[[advisories]]
stage = "study-review"
id = "STU-006"
severity = "advisory"
location = "research/interpretations.md section 4.1 'What the three share' (lines 622-630)"
problem = "The reasoning record still says that all three readings take Filius tuus vivit and the Communion's hope as the formulary's hinge, read the Introit's confession as the right beginning of prayer, and rest on the Fathers' agreement that the healing was by word without presence. Its own section 2.1 ('The reading's centre is not the Gospel but the chants and Epistle') and section 2.5 contradict this for the second reading. Section 3 hears the third reading's Introit as Israel's confession and not in Augustine's order of prayer. The reviewed comparison (sections/50-comparison.tex 4-33) now states the shared ground correctly, and research/production-review.md lines 250-254 report the discrepancy as an upstream item. No reader-facing text now depends on section 4.1. It is, however, the interpretation reasoning record that the concise-study and homily authors read, and as it stands it invites them to restore the overstatement STU-002 removed. Only a research re-entry can repair it, and that would rerun every dependent document and review for a sentence no reader sees. That is why it is not raised as blocking."
required_result = "Whenever research is next re-entered, section 4.1 claims as common to all three readings only what all three hold: the Postcommunion's oboedire mandatis answering the Introit's non oboedivimus, the Introit's confession heard three ways, and a place for the Communion's hope in God's word. It credits the Gospel hinge and the healing-by-word agreement to readings 1 and 3, and Augustine's order of prayer to readings 1 and 2, as the study's comparison does. Until then, the concise and homily authors take the readings' shared ground from the reviewed comparison, not from section 4.1."

