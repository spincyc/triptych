location = "research/chronology.toml, introit claim composition.book-of-daniel.prayer-of-azarias (src/sources/chronology/composition.yaml lines 1869-1906)"
note = "Still true at this iteration: the corpus prefers, as catholic-traditional-v1 composition, the CE 'Book of Daniel' author's own judgment that the Prayer of Azarias is 'most likely' by an author 'long after the Exile', and it gives that judgment against the view the same article reports of 'nearly all Catholic writers' (the time of Daniel). The corpus note settles the order under scripture-chronology section 4.4 and records the contrary view without authoring it, so the record (scripture-chronology query --evidence at Dan 3:29 returns no alternative) gives the page-2 dossier no received alternative to foreground. That is a tension for the chronology and profile owners, not a defect of this leaf."
