label = "B.C. 588"
date = "588 B.C."
precision = "year"
disposition = "alternate"
answerability = "answerable"
basis_class = "reported-traditional"
profile = "catholic-traditional-v1"
sources = ["artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c"]
index = 3
qualification = "Petavius table reported by Sloet; retained transcription checked, printed-page verification still pending"
basis = "The Petavius table in Sloet's \"Chronology of the Kings\" (Catholic Encyclopedia, New York, 1910) closes the Juda column at \"B.C. ... 588\" after Sedecias, and the Remarks cell attached to that final entry reads \"Capture of Jerusalem\"."
note = "Table extraction, with the Remarks cell paired to the final Sedecias entry. Re-verify against a page image before publishing. CHECKED 2026-09-02 against the RETAINED ARTICLE TEXT, which this repository did not hold when the caveat above was written. In newadvent-08654a-645bba6c-article-text.txt the table's label cells and its year cells are stored as two consecutive blocks of lines, and inside a block the year belonging to a label stands a CONSTANT number of lines further on: 21 in the first Juda block, 19 in the second, 17 in the Israel block. All ten figures this corpus takes from the Petavius table pair on that constant - 1055 David, 1015 Solomon, 1012 \"(Building of the Temple)\", 975 Roboam, 727 Ezechias, 641 Josias, 610 Joakim, 599 Sedecias, 588 on the Sedecias \"(end)\" row whose Remarks cell reads \"Capture of Jerusalem\", and 721 on the Osee \"(end)\" row whose Remarks cell reads \"Taking of Samaria\" - and across each block's paired range every blank line in the label column faces a blank line in the year column, the only label lines facing a blank being lines of a label that wraps onto two. So the pairing rests on a skeleton the two columns share and not on a judgement about which year looked nearest which label. THE CAVEAT IS NARROWED, NOT WITHDRAWN. What is now checkable offline is the pairing inside New Advent's delivery. What is still unchecked is whether that delivery reproduces the printed page's rows, and the volume-8 facsimile that would settle it is registered remote at 135,877,116 bytes and is not retained here, so the page-image check still cannot be run without a network. The figures stand where they stood; what has changed is that a reader can reopen the pairing in this repository instead of taking it on trust."
