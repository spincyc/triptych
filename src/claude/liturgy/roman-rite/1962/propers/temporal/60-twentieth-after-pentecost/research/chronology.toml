index = 0
qualification = "Haydock reporting Ussher; A.M. is not converted"
basis = "The Haydock edition's note at Psalm 70:1 prints a chronology the page attributes to Usher by the siglum standing after the figures, giving \"the last, when the city was destroyed and Sedecias was taken, 3416\", after the first captivity at A.M. 3398 and the second at 3405."
note = "Usher's figure as transmitted by the Haydock edition, recorded as that Catholic edition's testimony and never as Usher standing alone. The Anno Mundi figure is kept exactly as printed and is not converted. The passage record states that these figures are not printed at Psalm 88 and do not prove the Babylonian setting proposed there."
reporting_exception = "ussher-reported-by-a-ranked-catholic-source"

