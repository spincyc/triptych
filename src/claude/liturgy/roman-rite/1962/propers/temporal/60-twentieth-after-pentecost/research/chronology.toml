index = 1
qualification = "Reid and Meistermann, Catholic Encyclopedia"
basis = "George Reid's \"Captivities of the Israelites\" (Catholic Encyclopedia, New York, 1908) writes that \"the Babylonians finally entered through a breach in the wall, 586 B.C.\", and Meistermann's \"Temple of Jerusalem\" (1912) says the Temple \"was destroyed by Nabuchodonozor in 586 B.C.\""
note = "Two Catholic Encyclopedia articles agreeing on 586 against three other figures inside the same encyclopedia. \"Nabuchodonozor\" is the Temple article's spelling."

[[anchor_contexts.candidates]]
relation = "anchor-context"
subject = "israel.exile.third-captivity"
title = "The third captivity of Juda: the destruction of Jerusalem under Sedecias"
label = "the fall of Jerusalem (587 B.C.)"
date = "587 B.C."
precision = "year"
disposition = "alternate"
answerability = "answerable"
basis_class = "traditional-catholic"
profile = "catholic-traditional-v1"
sources = ["artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08652a-189e1a8f"]
index = 2
qualification = "Schets, Catholic Encyclopedia"
basis = "Joseph Schets's \"Third and Fourth Books of Kings\" (Catholic Encyclopedia, New York, 1910), arguing about the date of those books, dates the event in passing: Jeremias, if the author, \"wrote the book not long before, or shortly after, the fall of Jerusalem (587 B.C.)\"."
note = "Incidental to an argument about authorship, and one year later than the figure Reid prints. Meistermann's \"Jerusalem (Before A.D. 71)\" likewise ends Sedecias's reign at 587."

[[anchor_contexts.candidates]]
