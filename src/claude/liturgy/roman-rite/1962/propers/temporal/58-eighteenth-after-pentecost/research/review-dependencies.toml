# Controlling evidence this leaf's research reads outside the leaf and outside the
# ancestry of its registered source bindings. The engine separately seals the
# leaf's own research/ and propers/ records, every bound source record with its
# ancestry and available payloads, and the chronology computation code and
# identity registry as computation inputs.
#
# - The 1962 calendar index is the finding aid research/context.md used for
#   identity and occurrence and the index the mass-propers and proper-chronology
#   tools resolve this formulary through; the companion rubric registry drove the
#   precedence computation that record reports. Neither is the source of record
#   for any wording.
# - The facsimile-rights inventory settles, once for the repository, the Latin
#   publication basis that propers/verified.md relies on. The Latin provenance
#   ledger carries four of this Sunday's ten elements as collated and permitted
#   and is the record research/scope.md section 9 reports the other six against.
# - The roman-1962 English-translation overlay carries four `untranslated` rows
#   for mass `pentecost-18` -- Collect, Secret, Postcommunion and Offertory --
#   each `availability = "unavailable"` with a `rights-withheld` reason over the
