#   this Mass's English position and research/scope.md section 9.1 answers them
#   against the bound Cummiskey passage, so the file has to be reviewable with
#   the leaf. It is another owner's record and is not edited here.
# - The five authored Scripture-chronology files are the corpus whose answer is
#   research/chronology.toml and research/chronology-annotations.tex.
# - The canon and concordance data the chronology computation actually opens when
#   it answers this leaf, traced on 2026-09-22 with a Python audit hook over
#   `proper-chronology record --check`: the Clementine book index, the Clementine
#   chapter files, and the Douay-Rheims (Challoner), Revised Version and World
#   English Bible Catholic verse texts. The three verse-text editions are declared
#   by edition directory, the smallest owner that covers every verse text the
#   computation opens.
#
# The tolerant literal searches this stage ran over the whole Clementine chapter
# store (research/scope.md section 5.1) read the same directory that is already
# declared below for the chronology computation.
#
# Nothing else outside this leaf is read that is not reached through the ancestry
# of a registered binding. In particular the patristic and liturgical-history
# witnesses added on re-entry -- Jerome at PL 26, Hilary's CSEL 22 Tractatus,
