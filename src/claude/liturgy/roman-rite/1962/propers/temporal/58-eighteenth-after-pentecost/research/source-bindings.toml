context = "The chapter on this Sunday in the English Liturgical Year, Time after Pentecost vol. II (series vol. XI), second edition, 1909, in the facsimile this checkout tracks (SHA-256 recomputed and matched, 95ba98e2...92690). WHOSE WORDS: the edition record says the preface identifies this as the second volume of the Continuation after Gueranger's death and does not name the continuator, and the work record's responsible party is Prosper Gueranger and continuators; Gueranger died in 1875. Every sentence research/scope.md and research/interpretations.md take from it is therefore cited as the continuation's and none as Gueranger's. The library's author-standing registry and formulary-loci inventory name the continuator Dom Lucien Fromage OSB (1845-1916); this stage read the French original's preface signature, Fr. L. F., O. S. B., Solesmes, in the Internet Archive text layer lanneliturgiqu11gu (digest c24539c7...fd6c07, as the registry records) and did not re-open the BnF records the registry cites. The chapter runs from printed p. 393 to p. 409 = PDF pp. 414-430 (printed + 21). It was read in the PDF's text layer and every sentence research/scope.md quotes was checked on the page images of PDF pp. 414, 415, 422, 423, 424, 426 and 427. What it gives, in research/scope.md sections 2.7 and 3.11: the Sunday follows the September Ember days and the medieval liturgists discussed its having replaced the vacant Sunday after ordinations (footnotes 1 and 2 on p. 393 cite Berno cap. v and the Micrologus cap. xxix, both read on the third re-entry); the interruption of the Ephesians epistles by 1 Cor 1; the Epistle's gifts read of the powers conferred at the Ember ordinations; Rupert's report of another Gospel, the chair of Moses, and its harmony with the Moses Offertory, which the continuation dates, at p. 402, to the thirteenth century, in many Churches of the west -- the qualifier is the book's and is kept, and the dating is the continuation's or its translator's, not Rupert's; the present Gospel read of the prerogative which these same men -- the Church's pastors -- have of forgiving sins; and the Offertory's two ancient verses printed in full. It is a liturgical commentator on the Roman Missal of its day, documented reception of the compilation, never the Fathers'."

