source_fingerprint = "sha256:e0d26f1d5ef32e38d769894f8d3e50a837bb632a3b92d95868bfc1e1c1b4f412"
context = "Rabanus Maurus, Commentariorum in Matthaeum lib. III, at Mt 9:1-8, PL 107, cols. 870-873, read on the page images at native 300 ppi; the scan of col. 873 is faint and was read with contrast raised, against the optical text. What this settles is in research/scope.md section 3.5: at v. 1 Rabanus reproduces Augustine's harmony (De cons. evang. II.25.58) without a siglum and gives no allegory of the city; at v. 2, under (Beda.), the bearers are the good teachers who suggest the hope of healing and the help of intercession; at v. 3 he prints, inside a passage marked (Hieron.), Sed, licet nescientes, verum dicebant, quia nemo dimittere peccata nisi Deus potest: qui per eos quoque dimittit, quibus dimittendi dedit potestatem; at v. 6 his spiritual sense -- surgere de lecto est animam se a carnalibus desideriis ... abstrahere. Lectum vero tollere, est ipsam quoque carnem, per continentiae frena correptam, spe coelestium praemiorum a deliciis segregare terrenis. Sublato autem lecto domum ire, ad paradisum redire est -- with an Aliter on the soul's return ad internam sui custodiam; and at v. 8, under (Beda.), praise of the power's speed, and nothing of ministers. The Catena aurea's Rabanus lemma (lectum tollere est carnem a terrenis desideriis ad voluptatem spiritus attollere) is not this wording."

