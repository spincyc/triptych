context = "Rupert of Deutz's chapters on the Eighteenth and Nineteenth Sundays after Pentecost, in a layer this checkout tracks (SHA-256 recomputed and matched, 2e2ca850...ed376). The artifact's own note requires that wording quoted from this volume be collated against page images, so every word research/scope.md sections 2.7 and 3.11 quote was read on the Internet Archive page images of the same item, leaves n168 (cols. 325-326) and n169 (cols. 327-328), unregistered, digests in research/scope.md section 6.3; the layer's reading Matth. xxi for the image's Matth. xxiii is one of the corrections that made the check necessary. Caput XVIII (heading at physical line 23433, col. 326) expounds a Mass with this formulary's Introit Da pacem, Epistle 1 Cor 1, Gradual Fiat pax, Offertory Sanctificavit Moses with its verse Videns Moses procidens adoravit ... dimitte peccata populi tui, and Communion Tollite hostias, but with the Gospel of the scribes and Pharisees on the chair of Moses (Matth. xxiii). Caput XIX (heading at line 23488, cols. 326-327) gives the paralytic of Matthew 9 to the Nineteenth Sunday, with the Epistle of Eph 4 and the chants Salus populi, Elevatio manuum (as the Gradual's verse), Si ambulavero and Tu mandasti. Rupert reads the whole Eighteenth-Sunday Mass of the rectors of souls: Da pacem as peccata dimitte, for pax Dei peccatorum remissio est; Fiat pax in virtute tua as remissio peccatorum in Spiritu sancto; the Offertory's Moses as the pastor's model of intercession for the people's sins; Tollite hostias as the office of intercession for subjects. At the Nineteenth he reads the bearers of the paralytic as the prelates who offer him by prayer. This is a named liturgical commentator expounding the Mass as his books gave it, and it is documented reception of the compilation, not patristic exegesis of the passages."

