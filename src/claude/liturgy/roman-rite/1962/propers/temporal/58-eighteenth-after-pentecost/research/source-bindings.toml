context = "Fetched 2026-09-22 and hashed (039123ca...684d84) before use. Liber III section XIV, headed Item alia Missa with no Sunday number, carries this formulary's Collect, Secret and Postcommunion as a set, with a second Collect beside the first, and Wilson's footnote assigning the Mass to the twenty-second Sunday after Pentecost in R, S and Gerbert and to the nineteenth in Pamelius. BOTH of Wilson's Liber I cross-references at III. xiv were resolved in this layer on re-entry. The Postcommunion stands a second time at 15341-15344 in the Mass for the dedication of a place that had been a synagogue, and the section number is now settled from the edition's own table of contents at line 640 (xciii, printed p. 141) rather than from the running heads, which read I. xciv over both printed p. 142 and printed p. 143 because this compositor heads a page with the section it runs into. The Secret stands a second time at 12585-12598 in Liber I section lix, reading cognovimus and dignis moribus without et mentibus -- the 1962's own readings -- under four OCR corruptions (huiiis, commerda, partidpes, efiecisti) that are why literal probes on the ordinary spellings missed it. Every reading and every apparatus note cited in research/scope.md section 2.1 from Liber III was confirmed on the page image of printed p. 232 (Internet Archive LiberSacramentorumRomanaeEcclesiae leaf n324, unregistered); both Liber I occurrences were read in this layer only and no Liber I page image was opened."

