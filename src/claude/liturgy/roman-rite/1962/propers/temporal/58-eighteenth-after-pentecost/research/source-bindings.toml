source_fingerprint = "sha256:a8214a57556d9412ed34e019cedb24cfaeaa8a7160276453c7b23875c0214805"
context = "Bede, In Lucae evangelium expositio II, on Lk 5:18, 5:21 and 5:24, read to identify the source of three passages Rabanus prints at Mt 9:2, 9:3 and 9:6. At PL 92 col. 387A (the transcription's marker), on the bearers: ministris qui eam sublevent et Christo afferant, id est, bonis doctoribus qui spem sanationis opemque intercessionis suggerant -- which Rabanus prints under (Beda.). The registered remote delivery was re-fetched on 2026-09-22 and matched its registered SHA-256 (116db0ca...247d8a, 973,336 bytes). At PL 92 col. 388B (the transcription's embedded marker): Verum dicunt scribae, quia nemo dimittere peccata nisi Deus potest, qui per eos quoque dimittit, quibus dimittendi tribuit potestatem. At cols. 388D-389A: Spiritaliter de lecto surgere, est animam se a carnalibus desideriis, ubi aegra quiescebat, abstrahere. Lectum vero tollere est, ipsam quoque carnem per continentiae frena correptam, spe coelestium praemiorum deliciis privare terrenis ... Sublato autem lecto domum ire, ad paradisum redire est ... Aliter. Sanus qui languebat, lectum reportat domum, cum anima peccatorum remissione accepta, ad internam sui custodiam cum ipso se corpore refert. Rabanus's v. 6 paragraph is this, with small variants. A transcription, not collated with page images."

