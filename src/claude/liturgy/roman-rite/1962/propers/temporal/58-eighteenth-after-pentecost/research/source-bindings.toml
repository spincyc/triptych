context = "Hilary of Poitiers, Commentarius in Matthaeum, caput VIII (Mt 8:23-9:8), sections 1-8, in the Maurist text reprinted at PL 9, read whole on the page images at native 400 ppi: section 3 at col. 959, section 4 at cols. 959-960, section 5 at col. 960, sections 6-8 at cols. 961-962, with the Maurist notes (h), (j) at col. 960 and (a)-(f) at cols. 961-962. The Maurist italic section headings are editorial. What this settles is in research/scope.md section 3.5: at section 4 the Gerasene town is the figure of the Jewish people and the law, which rejects Christ, and he returns in civitatem suam, Deo civitas fidelium plebs est (the Maurists read Deo against the older editions' Dei, note h), entering it by the boat, id est Ecclesia; at section 5 the paralytic is the whole of the nations offered for healing, called son because Adam is the first work of God, and forgiven the first transgression, for we do not read that the paralytic had sinned; the clause quod lex laxare non poterat; fides enim sola justificat stands in section 6, on the scribes' murmur; at section 7 the return home is the way back to paradise; and at section 8, on v. 8, the honour went to God because potestas hominibus ac via data sit per verbum ejus, et peccatorum remissionis, et corporum resurrectionis, et reversionis in coelum. Hilary does not say ut fiant filii Dei; that is Aquinas's summary in his lectura."

