# Publication-local record of how this leaf's research used the reusable source
# library. It supplements, and does not replace, propers/verified.md (the text
# control), research/scope.md (reception matrix, witness register, negative
# results and bounds) and research/interpretations.md.
#
# States describe what the research stage of run 71b6f89518984232 did with each
# record on 2026-09-22, not what the record could support. `inspected` means this
# stage read the bound locus itself; `verified` is claimed only for the
# liturgical page images collated word for word. Reception witnesses stand at
# `inspected` where they are registered and have no binding where they are not.
#
# No `negative-search` binding appears. Every negative this leaf records
# (research/scope.md section 5.1) was reached by a tolerant literal search that
# strips diacritics and folds i/j and u/v, which is not one of the library's
# canonical search modes, so no replayable receipt exists and no `searched`
# state is claimed. The scope record states each negative's exact boundary
# instead.
#
# The re-entry of 2026-09-22 swept the library a second time, for the reception
# witnesses this study actually uses and not only for the leads it had recorded
# as unreached, and found registered routes for five of them that the first pass
# had not tried. Those routes were opened and are bound below: the tracked CCEL
# NPNF1-8 English of the whole Enarrationes (Pss 95, 101 and 121), the registered
# New Advent page for Enarr. in Ps. 101, the tracked Migne Latin of the
# Enarrationes for Pss 95 and 101, the tracked CCEL NPNF1-10 and NPNF1-6 texts
# carrying Chrysostom's Hom. in Matth. 29 and Augustine's De consensu
# evangelistarum, and Migne's own PL 70 for Cassiodorus. research/scope.md
# section 6.3 states, per witness, which route was tried and what it gave.
#
# Witnesses read from public deliveries the library does not register — New
# Advent for Chrysostom on 1 Corinthians and on Hebrews and for Augustine on
# Pss 95 and 121; Corpus Thomisticum for the Catena aurea in Matthaeum, of which
# this library holds no state; the Internet Archive page images of the 1862
# Pustet (leaves n435, n436), of the Benziger 1962 (leaves n480, n481) and of
# Wilson's Gelasian (leaves n324, n325); and the live USCCB Psalms introduction —
# have no binding. Their retrieval, extent and SHA-256 are recorded in
# research/scope.md section 6, and they are cited in References in the ordinary
# way. The New Advent page for Enarr. in Ps. 101 is the one delivery of that set
# the library does register, and it is now bound.
#
# The SECOND re-entry of 2026-09-22 swept the library a third way: by artifact
# coverage and not only by work record. tools/commentary-work-index discover was
# run for every appointed locus (Ps 95:8, Ps 101:16, Ps 121:1, Ps 121:7, Mt 9:1,
# 1 Cor 1:4, Ex 24:4, Sir 36:18), and for each lead it returned the registered
# collected-volume and whole-volume artifacts were checked for the work. Eleven
# registered routes that earlier passes had recorded as unreached, or had not
# named, were opened and are bound in the last two groups below: Chrysostom in
# PG 55 and Theodoret in PG 80 on Ps 121, Theodoret in PG 80 and Athanasius in
# PG 27 on Pss 95 and 101, Theodoret in PG 82 on 1 Cor 1:4-8, Bellarmine's
# Explanatio on all three psalms, Augustine's own Latin in PL 37 and on
# augustinus.it, Aquinas's lectura on Matthew in the Venice 1745 volume, Cornelius
# a Lapide on Ex 24:4-8, and -- as documented reception of the compilation and not
# as exegesis -- Rupert of Deutz in PL 170 and the continuation of Gueranger's
# Liturgical Year vol. XI. research/scope.md sections 3, 4, 5.2 and 6.3 carry what
# each gave.
#
# The THIRD re-entry of 2026-09-22 took the registered set of whole volumes from
# the artifact records themselves, read each lead author's artifact records for
# provenance and extent, and ran tools/commentary-work-index formulary for this
# Mass. It bound Theophylact on 1 Cor 1:4-8 in the PG 124 whole-volume layer (which
# an earlier pass had called a John-only holding); St Anthony's Sunday sermon on
# Mt 9:1; the registered liturgical commentators on this Mass -- Bl. Ildefonso
# Schuster, Durandus, Sicard, Honorius (the 1895 PL 172 layer), Berno and the
# Micrologus -- beside Rupert and the continuation; and the transmission lists the
# library registers: the Wuerzburg epistle and gospel lists, the Comes of Murbach
# and the Liber Comitis of PL 30. The Liturgical Year vol. XI is the posthumous
# continuation, and its binding now says so. Ambrosiaster on 1 Cor 1:4-8 was read on
# a later delivery of its registered page whose digest did not match, and is not
# bound. research/scope.md sections 2.7, 3.5-3.7, 3.11, 4 and 6.3 carry the result.

