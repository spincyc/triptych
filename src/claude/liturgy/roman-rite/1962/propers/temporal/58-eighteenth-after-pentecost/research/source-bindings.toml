source_fingerprint = "sha256:c2006d04da072c4dc606413e5328a3048b3f97d28e8b04c19278bcb743ebc4b4"
context = "Ambrose, Expositio Evangelii secundum Lucam V.10-14, on the paralytic of Lk 5:18-24, the parallel of this Gospel, in the tracked Wikisource transcription of Migne's PL 15 (SHA-256 recomputed and matched, fde2303a...0ac52; the embedded column markers put V.10-14 in cols. 1357-1358). Read because two sentences the study had met only in the Catena and in Rabanus stand here. V.10: unusquisque aeger petendae precatores salutis debet adhibere, per quos nostrae vitae compago resoluta, actuumque nostrorum clauda vestigia verbi coelestis remedio reformentur. Sint igitur aliqui monitores mentis -- the sentence the Catena aurea gives under Jerome's name after Jerome's own juxta tropologiam. V.11: Magnus Dominus qui aliorum merito ignoscit aliis ... adhibe precatores, adhibe Ecclesiam quae pro te precetur. V.13: quis enim potest peccata dimittere nisi solus Deus, qui per eos quoque dimittit, quibus dimittendi tribuit potestatem. V.14: domum suam repetere, hoc est, ad paradisum redire ... ea est enim vera domus, quae hominem prima suscepit: non jure amissa, sed fraude. On Luke, not Matthew, and on v. 21 (Mt 9:3), not on the crowd's words. A transcription, not collated with page images."
