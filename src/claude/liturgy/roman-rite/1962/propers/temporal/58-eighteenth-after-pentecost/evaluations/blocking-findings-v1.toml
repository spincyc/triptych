problem = "The paragraph says vv. 2-8 agree word for word 'with `Jesus` for `Iesus`, `jacentem` for `iacéntem`, `filius` for `Fílius`'. The bound Clementine does not read filius. Both src/sources/bibles/clementine-vulgate/chapters/Matt/9.json and row 'Matt 9 6' of the bound artifact.catholic-church.vulgata-clementina.ebible-latvuc.verse-text-47-matthew-2d02758d read 'Ut autem sciatis, quia Filius hominis habet potestatem'. Lower-case filius is the 1862 Pustet's reading, which this record's own 1862 table prints ('quia filius hóminis'). This is the same misattribution of an 1862 reading to the Clementine that the paragraph's own correction diagnoses for the stray comma at v. 5 (RES-011). It survives in the same sentence of the text-control record, which says both witnesses were re-read on 2026-09-22."
required_result = "Re-collate the paragraph's orthography list token by token against the bound Clementine artifact. Remove the filius/Fílius item (at v. 6 the two differ only by the Missal's accent), so that every difference stated is one the bound witness actually carries."
