[[findings]]
stage = "research-review"
id = "RES-001"
severity = "blocking"
location = "research/scope.md section 3.6 ('What the index returns for the Epistle': 'No registered route ... Theophylact, two rows (John only is held)'), section 5.2 (the rule paragraph that enumerates the registered whole volumes checked, and the Epistle list under 'The later and Doctoral reception of the two large lections'), sections 4.7 and 10.13; research/source-bindings.toml"
problem = "The re-entry says that for every lead the index returns 'the registered work records and the registered collected and whole volumes' were checked before anything was called unreached, and research-0003 reports RES-001 repaired on that basis. It was not done for one Epistle lead, and the miss is exactly the container defect RES-001 named. tools/commentary-work-index discover --passage '1 Cor 1:4' returns Theophylact twice (In omnes D. Pauli apostoli epistolas enarrationes; Expositio in epistolas sancti Pauli). Section 3.6 lists both rows as 'No registered route' because 'John only is held', and section 5.2 repeats Theophylact among the Epistle's unreached leads. But the John holding is artifact.theophylact-of-ohrid.enarratio-in-evangelium-ioannis.migne-pg-124-latin-column-1864.ia-djvu-ocr-9a1fc730, whose own provenance reads 'Internet Archive optical character recognition text of the whole Patrologia Graeca volume 124'. This reviewer fetched it on 2026-09-22 (3,544,388 bytes, SHA-256 9a1fc730...c5e66c, matched). Its table of contents (physical lines 211-232) reads 'Commentarius in omnes divi Pauli Epistolas ... in Epistolam 1 ad Corinthios 563'. The heading IN EPISTOLAM 1 AD CORINTHIOS stands at line 44683 and 'Vers. 4. Gratias ago' at 45001. On v. 7 (col. 567, line 45045) Theophylact answers how Paul can praise men he later calls carnal: 'neque omnes fuerint spirituales, neque omnes carnales. Quare quae nunc dicit, ad spirituales dicit; illa vero, ad carnales'. At col. 568 (lines 45087-45090) he adds 'Neque encomia, neque accusationes aeque omnino in omnes ... Alii enim ex illis adhuc diligentes, alii negligentes erant', and a third solution, that the praise is economy. On v. 8 (lines 45153-45157) he reads 'Confirmabit' as showing them 'nonnihil concussos' and 'Sine crimine' as 'eos jam criminibus obnoxios'. So a registered Greek later witness on the Epistle is recorded as unheld, and the omission is material. Section 4.7 ('Four readers in two pairs') sets Chrysostom and Theodoret against Aquinas and a Lapide. Theophylact sides with the first pair at v. 8 and gives the second pair's solution (praise for some members, blame for others) at vv. 4-7. The same rule paragraph of section 5.2 lists the registered Migne volumes as 'PL 24, 26, 30, 37, 56, 70, 78, 92, 105, 170 and PG 27, 29, 55, 57, 80, 82'. The library also holds whole-volume layers of PG 124 and of PL 142, 151, 202 and 213 (see RES-021), so the stated coverage of the sweep is itself inaccurate."
required_result = "Read Theophylact on 1 Cor 1:4-8 in the registered PG 124 layer (Latin column; a page image for any Greek word quoted). Bind it and record it in section 3.6 and in section 4.7's division. Correct 'John only is held' in sections 3.6 and 5.2. Make the section 5.2 list of whole volumes checked the actual registered set. Then re-check every remaining 'no registered route' and 'X only is held' statement in sections 3.1, 3.5, 3.6, 3.7 and 5.2 against the artifact records of that author's registered works, reading their provenance and extent and not only their work titles."
repair_target = "research"

[[findings]]
stage = "research-review"
id = "RES-021"
severity = "blocking"
location = "research/scope.md section 5.2, paragraph 'The Ordines and the medieval liturgical commentators' ('Durandus and Honorius have no registered route and were not reached'), with sections 2.7, 3.11, 4.3, 10.3 and 10.15; research/interpretations.md section 2.2 ('Documented reception of the compilation, not exegesis'), section 2.5 ('What the later witnesses do support, and where'), the section 4.2 'Where it is weakest' row, and sections 4.3 and 4.5"
problem = "RES-017's repair opened Rupert and the Liturgical Year but did not sweep the other registered liturgical commentators on this Mass. Section 5.2 now records two of them falsely as having no registered route. (a) Durandus: work.william-durandus.rationale-divinorum-officiorum has two tracked whole-volume layers. In the Lyon 1612 tomus II layer (...1612-lyon-tomus-secundus.ia-djvu-ocr-b9b266dd, SHA-256 recomputed and matched), VI.135 'De dominica decimaoctava post Pentecosten' (physical lines 17086-17126) expounds this Mass: Introit Da pacem ('Prophetae tui, id est, Praelati fideles inveniantur'), 1 Cor 1, Laetatus sum, Offertory Sanctificavit Moses and Communion Tollite hostias ('loquitur enim de Praelatis'). Its Gospel is 'in quibusdam Ecclesiis' Mt 23 or Mt 22 (Accesserunt). VI.136 (line 17131ff.) puts Mt 9:1-8 at the Nineteenth 'in quibusdam Ecclesiis', with the paralytics healed 'merito fide Praelatorum' (line 17141). (b) Honorius: work.honorius-augustodunensis.gemma-animae is registered over the complete PL 172 facsimile of the Gemma animae (restricted). This record elsewhere treats a restricted registered facsimile (CCSL 98) as a route. (c) Other registered commentators are not named at all. Sicard, Mitrale (PL 213, tracked whole-volume layer, line 29686), 'DOMINICA DECIMA OCTAVA POST PENTECOSTEN', has Gospel 'Accesserunt', 'secundum alios' Mt 23, and the paralytic at the Nineteenth; it reads the Introit, Gradual, Offertory and Communion of the people returning from captivity. Blessed Ildefonso Schuster, The Sacramentary vol. III (tracked OCR ...ia-volume-3-ocr-4d8c8988, lines 10500-10660, printed pp. 167-170), treats 'Eighteenth Sunday after Pentecost. Tertia post natale Sancti Cypriani', the 1962 Mass itself with every element. He reads v. 8 (lines 10616-10620): 'This power of remitting sins had to be communicated to men -- that is, to the apostles and to their successors in the priesthood; ... the crowd at once rejoices that men also have received from heaven such truly divine authority.' He calls the Mass a Dominica vacat formulary whose Corinthians Epistle is 'fairly ancient, since it is recorded by Paul the Deacon' (line 10508), and he describes the Offertory's ancient verses. The Micrologus (PL 151) and Berno (PL 142) are both tracked whole-volume layers. They are the two works the Liturgical Year chapter cites for the Dominica vacat question that section 2.7 reports, in its footnotes 1 and 2 at printed p. 393: 'BERNO AUG., cap. v, etc.' and 'MICROLOG., cap. xxix', read on the page image. The same Sunday loci are inventoried in the maintainer's record of 2026-09-22, guidance/liturgy/liturgical-commentators-plan-2026-09-22.md sections 1.2 and 1.5. The omission changes claims that the record passes to the study. Interpretations section 2.5, scope section 4.3 and section 10.15 say the ministerial sense 'stands in three places', and interpretations section 4.3 limits it to 'Aquinas at v. 6, the liturgical commentators on the Mass', meaning Rupert and the Liturgical Year. But a registered commentator on the 1962 Mass itself reads v. 8 as the power communicated to the apostles and their successors, and Durandus reads the Mass and the paralytic's bearers as prelates. Section 2.7 rests the Gospel's placement on Rupert as 'one witness to one set of books', while four registered commentators carry the same divergence. The prohibition 'must not present Rupert's reading as a reading of the 1962 pairing' leaves unrecorded that one registered commentator reads that pairing directly."
required_result = "Correct section 5.2's statement about Durandus and Honorius. Read at minimum Schuster vol. III pp. 167-170, Durandus VI.135-136 and Sicard's chapters on the Eighteenth and Nineteenth Sundays. For Honorius IV.84-86 on the registered facsimile, either read it or record it as a registered route deliberately not used, with the reason. Name the Micrologus and Berno likewise. Record in sections 2.7 and 3.11 what each gives, labelled as documented reception of the compilation and attributed by name, and bind what is used. Then restate scope sections 4.3, 10.3 and 10.15 and interpretations sections 2.2, 2.5, 4.2, 4.3 and 4.5 so that their account of where the ministerial sense stands, and of which commentators read which Gospel with this Mass, is true of the registered witnesses."
repair_target = "research"

[[findings]]
stage = "research-review"
id = "RES-022"
severity = "blocking"
location = "research/scope.md sections 2.7, 3.7, 3.11 ('Prosper Guéranger, The Liturgical Year ... He reads ...'), 4.3 ('Guéranger, on the Mass'), the section 6.3 row 'Guéranger, The Liturgical Year XI', and sections 9, 10.3 and 10.15; research/interpretations.md 'Two further boundaries', sections 2.2, 2.5 and 4.3; research/source-bindings.toml, context of the ...the-liturgical-year.english-duffy-1900-volume-11.ia-pdf-95ba98e2 binding"
problem = "Every reading the record takes from The Liturgical Year vol. XI is attributed to Prosper Guéranger in his own voice. Examples: 'Prosper Guéranger ... He reads the Epistle's gifts ...'; the pastors' 'prerogative ... of forgiving sins' '(Guéranger)'; 'Guéranger, commenting on the Mass with its present Gospel, reads ...'; 'A nineteenth-century liturgical commentator on the Tridentine Mass'. Both sealed library records say otherwise. work.prosper-gueranger.the-liturgical-year gives responsible = 'Prosper Guéranger and continuators' and says 'the registered Time after Pentecost II volume identifies itself as a Continuation without naming its writer in the checked preface'. The sealed edition record ...english-duffy-1900-volume-11 says its preface 'identifies this as the second volume of the Continuation after Guéranger's death but does not name the continuator'. The volume is dated 1909; Guéranger died in 1875. The record therefore puts a continuator's sentences in Guéranger's mouth. One of them is load-bearing: it is one of the liturgical witnesses on which interpretations sections 2.2, 2.5, 4.3 and 4.5 and scope sections 4.3 and 10.15 rest the ministerial reading. The studies drafted from this record would print the misattribution."
required_result = "Attribute every reading and quotation taken from vol. XI to the continuation of Guéranger's Liturgical Year (Time after Pentecost, vol. II, 1909), as the library's work and edition records describe it. Do this in scope.md, interpretations.md and the binding context. Name Guéranger as author of no sentence of that volume, and name a continuator only on a checked source."
repair_target = "research"

[[findings]]
stage = "research-review"
id = "RES-023"
severity = "blocking"
location = "research/interpretations.md section 2.3, the offertory row ('Historical note: the pairing of this Offertory with this Gospel is the 1962 book's and not immemorial'), and section 4.3 ('a placing that is the 1962 book's and not ancient, since Rupert's Mass set the same Offertory beside the Gospel of the chair of Moses'); with section 4.5 and research/scope.md section 2.7 (the 'thirteenth century' paragraph)"
problem = "Interpretations sections 2.3 and 4.3 hand the study a historical claim about the compilation that the evidence does not support: that this Gospel's pairing with this Offertory is 'the 1962 book's' and 'not ancient'. (i) The record's own text control places the whole formulary, this Gospel with this Offertory, in the 1862 Pustet (propers/verified.md; scope section 2.6). The pairing is therefore not the 1962 book's in any sense beyond being printed there. (ii) Scope section 2.7 itself says Rupert 'is one witness to one set of books' and 'It does not establish when, where or by whom the Gospel was moved, and no such claim is made'. One twelfth-century witness to a divergent usage cannot show that the usage the 1962 inherits is late. (iii) The Liturgical Year chapter the record cites, at printed p. 402, dates the other Gospel to 'the thirteenth century, in many Churches of the west'. That is a regional usage, and scope section 2.7 quotes the date without the qualifier. (iv) Registered, tracked transmission evidence the record did not open points the other way. The mid-seventh-century Roman gospel list of Würzburg (Morin, Revue Bénédictine 28, 1911; tracked layer ...ia-djvu-ocr-3de8a598, lines 19716-19789) appoints Mt 22 at 'EBD. II' and Mt 9:1-8 at 'EBD. III POST NT. SCI. CYPRIANI' ('Ascendens Ihs. in nauicula ... glorificauerunt qui dedit talem potestatem hominib.'). 'Tertia post natale Sancti Cypriani' is the old Roman name that Schuster (tracked, p. 167) gives this very Sunday. The Frankish Comes of Murbach (Wilmart, RB 30, 1913; tracked layer, lines 3641-3659) has the divergent pairing: 1 Cor 1:4 with Mt 22 at the item the OCR renders 'Ebd. xvint post pentect.', and Mt 9:1 at 'Ebd. xx'. The contract permits compilation history only as specific checked fact. This record instead forwards an unsupported, and on registered evidence probably false, claim about the age of the pairing, and section 4.3's comparison builds on it."
required_result = "Remove from interpretations sections 2.3 and 4.3 every assertion that the Gospel-Offertory pairing is 'the 1962 book's', 'not immemorial' or 'not ancient'. Alternatively, establish what can be established from registered transmission evidence read at its locus, such as the Würzburg and Murbach lists and the Sextuplex report already in section 2.3, stating exactly which Sunday each witness gives the Gospel and the chant-set, and inferring no compiler's intention. Restate section 4.5's bound so that the study asserts the pairing's age in neither direction unless research establishes it. Restore 'in many Churches of the west' to scope section 2.7's report of the Liturgical Year's dating."
repair_target = "research"

