[[accepted]]
stage = "homily-review"
id = "HOM-011"
severity = "accepted"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/sections/40-nothing-of-our-own.tex lines 242-246 (the expansive study, 'Not quietism'): 'The sick man had three disabilities: he lay in bed, he was carried by others, and he could not walk; so Christ says Surge to the one who lay, and quia portabatur, praecepit ut portaret ...'"
problem = "The homily author reported this upstream gap in research/production-review.md ('Upstream observation reported for the homily's cold reviewer'), and I confirmed it. The study announces Aquinas's three disabilities and gives two of his three answers. The third, 'quia ire non poterat, dixit, Et ambula', stands in the controlling facsimile. I read it on the page image of the Venice 1745 PDF p. 140 (printed p. 122; SHA-256 adb333e0...85de8 matched). The homily now gives all three, so the homily and the study differ on this one point. Neither misquotes."
required_result = "If the study is re-entered for any other reason, complete the triad in this sentence with the third answer. Record the locus in research/scope.md 3.5 and research/interpretations.md 3.4, beside the portabatur clause that RES-034 already names."
accepted_because = "The two answers the study gives are exact, and the reading's claim does not rest on the third. The study has passed its own review. Adding the clause would re-enter an accepted upstream owner, which reruns the concise study, the homily and every dependent review, all for one missing clause. A reader of the study misses a completed triad but is told nothing false."

[[advisories]]
stage = "homily-review"
id = "HOM-008"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/sections/homily/10-homily.tex lines 66-69: 'Once laid down, says Chrysostom, he \"gives himself up to the power of the healer.\"' followed directly by 'Then the first word: \"Be of good heart, son, thy sins are forgiven thee.\"'"
problem = "The quotation is exact, but its occasion has moved. In Homily 29 the sentence stands in section 2 (tracked CCEL NPNF1-10 text, lines 18568-18575), after the scribes reason within themselves. There Chrysostom says that the sick man, who had come to be healed and was forgiven instead, might have complained: 'One thing I came to have healed, and amendest Thou another?' 'But now he for his part utters no such word, but gives himself up to the power of the healer.' The homily sets the sentence at the moment the man is laid down and then says 'Then the first word'. A listener therefore takes Chrysostom's remark as said of the man before Christ spoke to him. The reviewed study anchors it correctly (sections/40-nothing-of-our-own.tex lines 134-136: 'when the scribes murmur, the one who might have complained is silent'). The man's surrender is Chrysostom's and no doctrine changes, so this does not block. But a Father's sentence is given a setting he did not give it."
required_result = "Put the quotation where Chrysostom puts it: after the word of forgiveness, as the silence of a man given what he had not come for. Alternatively, drop 'Once laid down' and the sequence it implies. Chrysostom's own point also serves the homily's opening line, 'He is forgiven before he has asked for anything'."

[[advisories]]
stage = "homily-review"
id = "HOM-009"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/sections/homily/10-homily.tex lines 64-66: 'Whatever faith he had brought him exactly as far as he was carried, and if he had any, that too was given him.'"
problem = "Heard once, the opening words parse as 'whatever faith he had brought him', a pluperfect in which 'he' is the one who brought. The listener reaches the real main verb only after the clause has already gone wrong. This sentence carries the movement's conclusion, the ground both sides of the whose-faith dispute grant, so it is the one a hearer most needs to recover. 'Exactly as far as' also claims a measured equivalence the sources do not state. The reviewed study says 'it brought him only as far as he was carried' (sections/40-nothing-of-our-own.tex lines 150-151)."
required_result = "Recast the sentence so that it can be understood on one hearing, for example: 'Whatever faith he had, it brought him only as far as he was carried; and if he had any, that too was given him.'"

[[advisories]]
stage = "homily-review"
id = "HOM-010"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/sections/homily/10-homily.tex lines 107-124, the fifth movement (the Postcommunion's 'this holy sacrifice ... what we have received' and the Communion's 'Bring up sacrifices, and come into his courts'), read against the speech as a whole."
problem = "The three-documents profile makes the Homiletic Directory's orientation govern the homily's movement: the readings and prayers lead through Christ's Paschal mystery to Eucharistic participation and daily life (guidance/liturgy/propers-three-documents.md, 'The homily'). The daily-life leg is concrete and well made. The other two exist only inside quotations. The speech never names Christ's death or resurrection; the only resurrection in it is the general one in Hilary's list. It never names the altar, the Eucharist or the Lord's Body, and 'Communion' occurs only as the name of the chant. The Postcommunion is quoted for its thanks and its plea, but the assembly, which is about to receive it, is never told what 'what we have received' is. The Communion movement answers 'what are we to bring?' with the humble heart and never says what is given back at this altar. The homily's own line, 'the end is given as the beginning was', would carry this without strain. No hearer is misled and the movement toward the courts is real, so this does not block."
required_result = "Within the fifth movement, replacing words rather than adding to a speech already at the top of its length: say plainly that what the Postcommunion thanks God for is the Lord's own sacrifice, received at this altar, and let the assembly hear its own approach to Communion in the verse's 'come into his courts'. Where it serves the argument, let one sentence ground the forgiveness spoken 'on earth' in Christ's Passion and Resurrection. Credit neither statement to a Father."

[[advisories]]
stage = "research-review"
id = "RES-031"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 2.2, Ambrose paragraph: '**What Ambrose says of the command to rise is not penitential.**' and the sentences after it (lines 446-451). research/scope.md 3.5, V.14 bullet ('No contrition or satisfaction: the penitential tropology of the command is Aquinas's (below), not Ambrose's', lines 1215-1220); 10 item 1, the Aquinas bullet (lines 3624-3625); and the header paragraph on the fifth re-entry (lines 77-78)."
problem = "Carried unchanged from research-review 6; unrepaired. This round extended the V.14 quotation inside this same paragraph (adding 'ea est enim vera domus ...') and left the bold negative in place. In the tracked transcription (ambrose-luke5-raw.txt, SHA-256 fde2303a... matched), V.14 says that the bed is the body, which David washes nightly with tears (Ps 6:7). It calls the bed 'lectus doloris, in quo anima nostra gravi conscientiae aegra cruciatu jacebat'. That is penitential imagery, even without the scholastic contritio and satisfactio. The negative states more than the locus bears. The study does not repeat it, and no reading or sense rests on it."
required_result = "Withdraw 'is not penitential' and 'Aquinas's ..., not Ambrose's'. Keep the true fence: 'per contritionem ... per satisfactionem ... in domum aeternitatis, vel in conscientiam propriam' is Aquinas's and no Father's. Describe V.14 as it stands, in all four places: the body as bed, washed with the tears of Ps 6:7; the bed of pain where the soul lay in the torment of conscience; the bed of rest for one who keeps Christ's precepts; and the return to paradise, the true home lost by fraud."

[[advisories]]
stage = "research-review"
id = "RES-032"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/scope.md 3.5: the Rabanus v. 2 bullet ('... was not found in Bede's In Lucam and is not traced here', lines 1143-1155); the bullet 'The Catena's other lemmata at this pericope' ('Neither is checked at its own locus', lines 1187-1190); and 'No Father of the Gospel's is now reported only by another' (line 1346). Also 4.2 (lines 2201-2206) and 10 item 1 ('is untraced', lines 3615-3620). research/source-bindings.toml, context of the PL 107 cols. 870-873 binding ('whose untraced sequel')."
problem = "Carried unchanged from research-review 6; unrepaired, because scope.md and the bindings did not move this round. Two things the record treats as separate are one text. The sequel to the '(Joan. Chrysost.)' passage at PL 107 col. 871 ('Audit veniam et tacet paralyticus ... et vecordiam sic jacentis respicit') and the Catena's unchecked 'Ioannes episcopus' lemma are both Peter Chrysologus, Sermo 50, De paralytico curato. That sermon preaches Mt 9:1-8 as the day's reading and takes the bearers' side in the whose-faith dispute. It is also transmitted under Maximus of Turin, and it has not been read in a controlled edition. The record honestly calls the passage untraced, and no reading depends on it."
required_result = "In scope 3.5, 4.2 and 10 item 1, and in the PL 107 binding context, record three things: that the sequel and the Catena's 'Ioannes episcopus' lemma are one text; that it is identified as a lead, Chrysologus, Sermo 50; and that it is also transmitted under Maximus of Turin. Then either read it in a controlled edition (PL 52 or CCSL 24) and add it to the whose-faith dispute, or state that it is identified but unchecked and not quotable. Qualify 'No Father of the Gospel's is now reported only by another' to match. Keep the passage off Chrysostom's name."

[[advisories]]
stage = "research-review"
id = "RES-033"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md, 'Two further boundaries', second bullet ('The five medieval Masses share this one's Introit, Gradual, Offertory antiphon and Communion', lines 49-52). research/scope.md 2.7, 'What this adds to section 2.5', first bullet (lines 560-563); and 10 item 16 (lines 3787-3790)."
problem = "Carried unchanged from research-review 6; unrepaired. For Sicard the sentence goes beyond the library's controlled element comparison. Mitrale VIII.18 names the Offertory and Communion together only by their sense ('in offerenda et communione invitat et monet populum revertentem ... altaria erigere et hostias immolare'). The locus inventory's Sicard VIII.18 row records no Communion element, and commentary-work-index formulary lists communion among the elements Sicard does not name. This is scope-record material that D11 keeps out of the readings, so no reading is misled."
required_result = "In all three places, say that four of the five name this Communion, and that Sicard names the Offertory and Communion together only by their sense, which the locus inventory does not identify as Tollite hostias. Alternatively, state the shared elements commentator by commentator, as the 2.7 table and commentary-work-index report them."

[[advisories]]
stage = "research-review"
id = "RES-034"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 2.4 Moral (lines 624-633) and the 2.3 communion row (lines 600-601); 3.4 Moral (lines 959-963); research/scope.md 3.11 and the 6.3 witness-register row for the continuation (line 3054: 'every sentence quoted checked on the rendered pages (PDF pp. 414, 415, 422, 423, 424, 426, 427)'). Study places that rely on the missing loci: sections/30-authority-on-earth.tex, 'The exchange and the courts' (last sentence) and the fourSenses Moral item; sections/40-nothing-of-our-own.tex, the Collect subsection ('The surest way to obtain grace ...', vol. XI p. 395), 'Not quietism' (Aquinas: 'quia portabatur, praecepit ut portaret') and the fourSenses Moral item."
problem = "STU-020 asked research review to confirm the record against the study. On the points STU-020 named, the record now agrees with the study. The two moral senses and three loci the study quotes are not in any research record. (1) The second reading's moral sense and its Communion subsection quote the continuation of The Liturgical Year: 'other victims, that is ourselves' (vol. XI, pp. 408-409; PDF pp. 429-430, where I read it). Record 2.4 Moral and the 2.3 communion row do not carry it. Scope's register lists the continuation pages it checked, and pp. 429-430 are not among them. (2) The third reading's moral sense ends on Aquinas's 'quia portabatur, praecepit ut portaret' (Super Matth. IX; in the Venice 1745 layer at lines 16509-16511, where I read it). Record 3.4 Moral does not carry it, and neither record quotes it. production-review.md discloses this one as the author's own check. (3) The Collect subsection quotes the continuation's p. 395 (PDF p. 416, read), which no research record carries. All three quotations are accurate and come from sealed, tracked sources. The record's senses are a subset of the study's and do not contradict it, so no concise or homily author is misled. But the record no longer records every locus the readings' senses rest on."
required_result = "Record the continuation's Communion reading (vol. XI, pp. 408-409) in scope 3.11 and in interpretations 2.3 (communion) and 2.4 (Moral), under the continuator's name and not Guéranger's. Record Aquinas's 'quia portabatur, praecepit ut portaret' (Super Matth. IX, Venice 1745, p. 122) in scope 3.5 and in interpretations 3.4 (Moral). Record the continuation's p. 395 where the record treats the Collect. Add the PDF pages read to the 6.3 register row. Alternatively, state in 2.4 and 3.4 that the study's moral senses add these checked loci."

[[advisories]]
stage = "research-review"
id = "RES-035"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 4.4, 'Notes for the concise study's page-1 overview', Anagogical bullet: 'the forgiven man's way home is the way back to paradise (the second, with Hilary, Ambrose and Aquinas)' (lines 1171-1175)."
problem = "This row is new this round. It groups Aquinas under 'the way back to paradise'. Aquinas's own words (Super Matth. IX; Venice 1745 layer, lines 16520-16521) are 'vade in domum tuam, in domum aeternitatis, vel in conscientiam propriam'. They name the house of eternity or one's own conscience, not paradise. Paradise is Hilary's (VIII.7, 'iter in paradisum') and Ambrose's (V.14, 'ad paradisum redire'). Record 2.4 and the study keep the three apart correctly. This note, which the concise author is pointed to, blurs them."
required_result = "Rephrase the second reading's clause so that each witness keeps his own word. For example: 'the forgiven man's way home is the way back to paradise (Hilary, Ambrose) and to the house of eternity (Aquinas)'. Alternatively, drop the names from the overview note and point to 2.4."

[[advisories]]
stage = "research-review"
id = "RES-036"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 3.2, Chrysostom's Hom. in 1 Cor. 2, last bullet: '**This covert accusation is Chrysostom's whole reading of v. 8.** He does not read the verse as a promise; Aquinas, Ambrosiaster and a Lapide do' (lines 793-797)."
problem = "This sentence is new this round, and it goes beyond both section 7 of the homily and the study. In the New Advent delivery (re-fetched; SHA-256 66bffe29...5858 matched), section 7 has two parts. It first says: 'Here he seems to court them, but the saying is free from all flattery; for he knows also how to press them home'. Only then does it say: 'But he is also covertly accusing them'. 'Whole reading' drops the first sentence and the force of 'also'. The study keeps both. It writes 'For Chrysostom the promise that Christ \"will confirm you unto the end without crime\" is \"also covertly accusing them\"'. Scope 4.7's accusation/promise division, accepted earlier, is not at issue. The problem is the new negative, which a later author could take as Chrysostom denying the promise. No sense rests on it: 3.4 frames the alternatives and concludes that the confirming is Christ's on either reading."
required_result = "Replace the bold sentence and its sequel with section 7 as it stands. Chrysostom says the verse seems to court them but is free of flattery, and that Paul is also covertly accusing them, since 'He shall confirm' and 'unreprovable' mark them as still wavering. He gives the verse no promissory exposition, which Aquinas, Ambrosiaster and a Lapide do. Drop 'whole reading'."

[[advisories]]
stage = "study-review"
id = "STU-023"
severity = "advisory"
location = "research/interpretations.md, 2.4 The four senses, Literal: 'At Capernaum a paralysed man is carried to Jesus' (line 610). Also 1.2, the paragraph on Hilary on the Gospel: 'This is the one checked witness that reads the Gospel's civitatem suam as a city in the sense the chants mean' (lines 249-250); and 1.3, the gospel row: 'It rests on Hilary's allegorical identification ... and on nothing Chrysostom or Augustine says' (lines 268-271)."
problem = "These sentences are not among the points STU-020 named, and they still diverge from the study and from the record's own 4.3. (1) The second reading's literal sense in the record decides the town. The record's 4.3 says instead that the Chrysostom (Capernaum) and Jerome (Nazareth) dispute 'sits inside authority-on-earth ... and the reading should report it there without deciding it'. The study does that. Its Literal item reads 'Jesus, come to his own city', and it says 'Chrysostom and Jerome disagree about the town, and nothing in the text settles it'. The wording has stood since research iteration 3 (commit 964d8999f). The concise overview, themes and commentary components name this record as a reference. A concise author who takes the second reading's literal sense from 2.4 could print a decided town that the reviewed study leaves open. (2) 1.2 and 1.3 rest the first reading's city allegory on Hilary alone. The study's first reading sets Aquinas beside him ('scilicet in civitatem gentium, quae sibi datae sunt', Super Matth. c. 9) and concludes 'Read with Hilary and Aquinas ...'. The record's own 4.3 cites the same lecture. Neither divergence misleads a reader of the study, which is correct on both points."
required_result = "In 2.4 Literal, replace 'At Capernaum' with 'In his own city', or name both towns with their witnesses as 4.3 does. In 1.2, qualify 'the one checked witness' (for example, 'the one Father'). In 1.3, add Aquinas, Super Matth. IX, 'in civitatem gentium, quae sibi datae sunt', beside Hilary as a second allegorical witness the first reading uses."

[[advisories]]
stage = "study-review"
id = "STU-024"
severity = "advisory"
location = "sections/10-each-element.tex, Offertory subsection, last paragraph ('Cornelius a Lapide, commenting on Ex 24:4--8, reads the twelve tituli as the share of the twelve tribes ...'), and Secret subsection ('Schuster explains the exchange: ``whilst we offer him our gifts he, in his turn, bestows on us the gift of himself'''). Against these: sections/30-authority-on-earth.tex, 'Moses at the altar, and the blood of the covenant', second paragraph ('Cornelius a Lapide, commenting on Exodus~24 itself, reads the twelve tituli as the twelve tribes' share ...'), and 'The exchange and the courts', first paragraph ('Schuster explains the exchange: ...')."
problem = "The contract asks the expansive study to give each substantial argument one fullest home. Two sentences appear twice, once in the element-by-element section and again in the second reading. The a Lapide sentence (the twelve tituli, the firstborn as priests before Aaron, the covenant blood as the type of the blood Christ named at the institution) is nearly word for word the same in both places. Schuster's sentence on the exchange repeats with the same lead-in, 'Schuster explains the exchange'. Schuster's regret that the Offertory has lost its verses is also given twice, in different words. The repetition is not used to reach the page minimum, and it misleads no one, so it does not block. It does make the reader read the same argument twice. The repeated account of Augustine's harmonisation of 'his own city' in the element section, the second reading and the comparison is excluded from this finding, because STU-002 required it in more than one place."
required_result = "Keep the a Lapide reading and Schuster's sentence on the exchange in the second reading, where they carry its argument. Reduce the element section's Offertory and Secret to their textual and liturgical setting, with at most a one-clause pointer to the second reading. Give Schuster's regret over the lost Offertory verses one home."

[[advisories]]
stage = "synthesis-review"
id = "SYN-008"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/sections/concise/04-themes.tex lines 8-9 (PDF p.3, the opening thesis: 'and confesses in its single prayer that without God we cannot please God'), with lines 37-38 (p.3: 'It is the Mass's only oration.')"
problem = "The first sentence of the Themes says the Mass has a 'single prayer', but the same paragraph closes on 'a prayer to be made worthy of what has been received' (the Postcommunion). The page-1 map also lists the Secret and Postcommunion as prayers, and page 4 says the Mass 'ends its prayers with thanks'. The study's rubrical sense is exact: 'The Mass has one Collect' and 'a single oration of each kind' (sections/00-opening.tex). 'Only oration' is also the study's own usage (sections/05-appointed-texts.tex, 50-comparison.tex), and the page-1 note 'one oration of each kind' explains it. But 'single prayer' in plain English says something false, and an adult lay reader meets it in the thesis sentence. No argument rests on it, and the Collect is plainly the prayer meant."
required_result = "Name the Collect in the thesis, for example 'and confesses in its Collect that without God we cannot please God' or 'in its one Collect'. For the same reason, line 38 could read 'It is the Mass's only collect'. Leave the rest of the paragraph unchanged."

