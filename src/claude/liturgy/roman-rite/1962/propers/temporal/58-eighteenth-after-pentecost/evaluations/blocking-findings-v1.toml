problem = "The Hilary Latin is quoted in italics as though transcribed from the registered CSEL 22 layer. On several pages of this tractatus, however, the layer's recognition is badly damaged: physical lines 29660-29665, for example, read 'Sfd (|ui;i unum ecclesiie c(ir|tus est. iicn (iu;i(l;iin C(ir|Mtium ...'. The quoted wording is therefore an undeclared reconstruction. Section 6.3 describes the layer as 'good in the body text' and names the a Lapide Latin as the one quotation that is not a transcription. The reconstruction is mostly right but misreads twice, as the page images of the same Internet Archive item show (shilariiepiscopi22hilauoft leaves n600 = CSEL 22 p. 571 and n602 = p. 573, fetched 2026-09-22). Section 2 prints 'sed illam liberam et caelestem Hierusalem, quia eadem et Sion est', not 'quae eadem' (scope section 3.2 and interpretations section 1.2). Section 5 prints 'tunc sancta Hierusalem, quia Hierusalem aedificatur ut ciuitas', not 'dum' (scope section 3.2). Both change Hilary's connective. The section 5 body sentence and the section 14 sentence on p. 579 are read correctly."
required_result = "Check every Hilary quotation against the CSEL 22 page images (pp. 570-573 and 578-579) and correct 'quae' and 'dum' to 'quia'. Either declare the Latin as normalised from a damaged layer or cite the page image as the reading's control. Correct section 6.3's description of the layer and its statement that the a Lapide Latin is the only quotation that is not a transcription."

