[[advisories]]
stage = "research-review"
id = "RES-024"
severity = "advisory"
location = "research/interpretations.md section 2.2 (the Schuster bullet: 'the one registered witness who reads Mt 9:8 itself of the ministry') and section 4.3 ('The one registered witness who reads v. 8 itself of the ministry is Schuster'); research/scope.md section 4.3 (the Schuster bullet) and section 3.11 (the continuation's p. 405 item); research/source-bindings.toml, context of the Schuster binding"
problem = "The record calls Bl. Schuster 'the one registered witness who reads Mt 9:8 itself of the ministry', and the continuation contradicts that. The continuation of The Liturgical Year (vol. XI, printed p. 405 = PDF p. 426 of the tracked facsimile ...ia-pdf-95ba98e2) reads the paralytic as the human race, brought to the Church by the apostles' faith. The Church then says 'Be of good heart, son! thy sins are forgiven thee!', and the passage closes: 'And the angels, beholding such a spectacle of conversion and holiness, are in amazement, and sing glory to God, who gave such power to men.' That applies v. 8's own words to the power of remitting sins the Church exercises. On pp. 403-404 the same chapter calls it 'the superhuman powers of the priesthood' and the power of the keys exercised 'by the priest'. Scope section 3.11 reports p. 405 only as 'the paralytic as the human race, carried to the Church by the apostles' faith' and leaves out the application to v. 8. What is true is narrower: Schuster is the one eligible author (a Blessed) who reads v. 8 of the ministry. Separately, interpretations section 2.2 and scope section 4.3 give Schuster's p. 169 two senses and make the ministerial one his 'deeper' sense. The page gives three, in order. First, the crowd's words as a subjective judgement. Second, 'a still deeper meaning': the divine nature working through the human nature, hypostatically united. Third, introduced by 'Further', the 'symbolical and prophetic' sense of the power communicated to the apostles and their successors. Scope section 3.11 reports this correctly. No argument depends on the uniqueness claim or on the compression. But a study drafted from section 2.2 would print a claim about the evidence that the registered evidence contradicts."
required_result = "In scope section 3.11, record that the continuation at p. 405 applies Mt 9:8's 'who gave such power to men' to the Church's power of forgiving. Record it as the continuator's allegorical reading and as reception of the compilation. Wherever 'the one registered witness who reads (Mt 9:)8 itself of the ministry' stands, replace it with a statement true of the registered witnesses. That means interpretations sections 2.2 and 4.3, scope section 4.3 and the Schuster binding context. For example: Schuster is the one eligible author who does so, and the continuation applies the verse's words allegorically. Give Schuster's senses of v. 8 in his own order: the crowd's judgement; the hypostatic 'deeper meaning'; then the 'symbolical and prophetic' communication to the apostles and their successors."

[[advisories]]
stage = "research-review"
id = "RES-025"
severity = "advisory"
location = "research/scope.md section 4.3 (the continuation bullet: 'A liturgical commentator writing in 1909'); research/interpretations.md, 'Two further boundaries' ('the posthumous continuation (1909)')"
problem = "1909 is the date of the English second-edition printing read here, not the date of writing. The sealed src/sources/commentary/formulary-loci.yaml records for this very locus: '1909 Stanbrook printing, pp. 393-409; the first edition of 1883 prints it at vol. II p. 407'. The library's record of the French original (edition ...french-oudin-1911-volume-11) reports its preface dated 27 October 1882. Scope section 3.11 says correctly that 'the volume is of 1909'. Section 4.3, though, turns the printing date into the date of writing, and interpretations dates 'the posthumous continuation' itself to 1909. Earlier drafts of the record correctly called the writer a nineteenth-century commentator. A study following section 4.3 would date the witness a generation late."
required_result = "Describe the continuation as written in the early 1880s (the French volume prefaced in 1882, the English first edition of 1883), and give 1909 only as the date of the printing read. Remove 'writing in 1909' from scope section 4.3, and make the '(1909)' in interpretations.md refer to the printing."

[[advisories]]
stage = "research-review"
id = "RES-026"
severity = "advisory"
location = "research/interpretations.md section 1 ('is read by two Greek Fathers of the rebuilt earthly city') and the section 4.2 table, peace-of-the-house row 'Where it is weakest' ('the Greek Fathers read its governing psalm of the earthly city rebuilt'); research/scope.md section 4.6 ('for Ps 121 two Greek Fathers read it of a place')"
problem = "The two Greek readers of Ps 121 are Chrysostom and Theodoret. The author-standing registry, sealed in this research for the first time this round, records Theodoret as ecclesiastical-writer and not as a Father. It says the plan's patrological-convention claim is not borne out. The profile's Liturgical commentators subsection makes that registry the source of an author's standing. 'The Greek Fathers' in the section 4.2 table also breaks interpretations.md's own rule at its head: 'No reading below may say \"the Fathers\" about a psalm: it says which witnesses'. No reading's two-author count depends on Theodoret, so the arguments stand. A study would still print a standing for him that the house registry does not give."
required_result = "In those three places, name the two witnesses (Chrysostom and Theodoret) or describe them in terms consistent with the registry, for example 'a Greek Father and a Greek exegete'. Do not use 'the Greek Fathers'."

[[advisories]]
stage = "research-review"
id = "RES-027"
severity = "advisory"
location = "research/scope.md section 2.7 (the Wuerzburg gospel list row, 'Ebd. IIII is Mt 22:2, the wedding feast'; the Offertory bullet, 'item CLII' for Ex 32:11-14), section 3.5 ('the library's one Theophylact artifact is the whole-volume layer of PG 124'), section 6.3 (the table of unregistered deliveries, lanneliturgiqu11gu row: 'Unregistered'), sections 2.7 and 3.11 (Honorius IV.84's Alleluia); research/source-bindings.toml, contexts of the RB 27 and RB 28 bindings"
problem = "The new transmission and holdings statements contain five small factual slips. None of them changes an argument. (a) In the RB 28 layer, line 19808 reads 'EBp. IIII POST NT. SCI. CYPRIANI ... Mt. k. CLXXXVIIII. Simile est regnum caelorum homini regi qui uoluit rationem ... fratri suo de cordibus uestris'. That is Mt 18:23-35, the unforgiving servant, not Mt 22:2. The wedding feast stands at Ebd. VIII post Theoph. (line 18684), and the Liber Comitis gives Mt 18:23 at Dominica III post S. Cypriani (PL 30 layer, lines 42161-42171). (b) Morin's notes number the Jeremiah lesson CXLVI, the Leviticus lesson CXLVII and the Hebrews lesson CLI (RB 27 layer, lines 3863-3868). The Exodus 32 lesson at line 3851 is therefore item CL, and In nat. angeli is CLII; the record gives Ex 32 as item CLII. (c) The French layer the record calls 'Unregistered' is registered and tracked at the same digest, c24539c7... It is artifact.prosper-gueranger.the-liturgical-year.french-oudin-1911-volume-11.ia-djvu-text-c24539c7, registered on 2026-09-22 before this research was committed. (d) The library holds three Theophylact artifacts, not one: the PG 124 layer and two checked-text excerpts on Jn 20 under the same edition (...in-io-20-credidit-checked-text-6a55059a and ...in-io-20-anti-theft-checked-text-bdc9929f). (e) Honorius IV.84 names the Alleluia 'Laudate Dominum' (PL 172 layer, line 56990), which differs from the 1962's Timebunt gentes. The profile asks research/scope.md to record the elements a commentator's Mass does not share, but only the binding context says 'another Alleluia'."
required_result = "Make five corrections. (a) Correct Ebd. IIII post nt. sci. Cypriani to Mt 18:23-35 in scope section 2.7 and the RB 28 binding context. (b) Correct the Ex 32:11-14 lesson to item CL in scope section 2.7 and the RB 27 binding context. (c) Record the French volume 11 layer as the registered artifact it is. (d) State Theophylact's holdings accurately in section 3.5. (e) Record Honorius IV.84's differing Alleluia in scope section 2.7 or 3.11."

[[observations]]
stage = "research-review"
location = "research/interpretations.md section 3.2 ('Theophylact, and Ambrosiaster beside him') and research/scope.md sections 3.6 and 4.7; src/sources/inventories/author-standing-v1.toml"
note = "Theophylact of Ohrid was an archbishop of the Byzantine Church writing after 1054. The record uses him as a supporting exegete for nothing-of-our-own ('puts this reading's thesis in one line') but records no standing for him, as it does for Anthony. The registry has no row for him, or for Ambrosiaster or Anthony. The profile limits a writer outside Catholic communion to structural and contextual evidence, so whether that limit applies to Theophylact is a registry judgment that the maintainer has not made. The registry covers lane authors and liturgical commentators but not the exegetes a record cites in support, which looks like a gap in its coverage rather than this leaf's defect."

[[observations]]
stage = "research-review"
location = "src/sources/commentary/formulary-loci.yaml, Honorius IV.85 row (lines 174-190), as reported by tools/commentary-work-index formulary --calendar roman-1962 --mass pentecost-18"
note = "The IV.85 row lists no Alleluia and no Offertory, so the tool reports 'not named by him: alleluia, offertory'. But IV.85 names both: 'In Alleluia populum monet, ut Deum pro pace laudet' and 'Offertorium vero innotescit quod sacrificium laudis ... obtulit' (PL 172 1895 layer, lines 57016 and 57019). The research record reads the Offertory correctly at the locus. The omission is library data that no stage of this run may repair."
