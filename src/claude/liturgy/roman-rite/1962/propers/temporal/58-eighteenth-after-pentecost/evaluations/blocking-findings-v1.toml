[[findings]]
stage = "research-review"
id = "RES-001"
severity = "blocking"
location = "research/scope.md section 5.2 ('Still not reached, and why': the psalm-commentator paragraph and 'The later and Doctoral reception of the two large lections'), with sections 3.2-3.6, 3.8, 10.2 and 10.13; research/review-dependencies.toml closing paragraph (the index queries run); research/source-bindings.toml"
problem = "The re-entry again records as unregistered or unreached some direct and later witnesses that this library registers, several of them in files tracked in this checkout. (a) Bellarmine, Explanatio in Psalmos: artifact.robert-bellarmine.commentary-on-the-book-of-psalms.2026-09-05-osullivan-ecatholic2000.historical-text-357551e1 is storage = tracked (text.txt, SHA-256 357551e1..., 'All 150 Psalm chapters'). It carries Psalm 95 at physical line 3413, Psalm 101 at 3565 and Psalm 121 at 4535. At Ps 121:1 it reads the joy first of the return from captivity and then of the heavenly house. At 121:7 it reads secure walls that ensure peace. (b) Chrysostom, Expositio in Ps. 121: the registered whole-volume PG 55 layer artifact.john-chrysostom.expositio-in-psalmos.migne-pg-55-paris.ia-djvu-ocr-d9b83186 (re-fetched 2026-09-22; 9,609,040 bytes, SHA-256 d9b83186... matched) prints its heading 'ΕΙΣ ΤῸΝ ΡΚΑ' ΨΑΛΜΟΝ' at line 45635, the v. 1 lemma at 45636 and v. 7 ('Γενέσθω δὴ εἰρήνη ἐν τῇ δυνάμει σου ... Καὶ εὐθηνία ἐν ταῖς πυργοβάρεσί σου') at 45881-45887. This is direct Greek exegesis that reads the psalm of the city rebuilt after the captivity. (c) Theodoret, Interpretatio in Psalmos: artifact.theodoret-of-cyrus.interpretatio-in-psalmos.migne-pg80-paris-1860.wikimedia-pdf-72ee8714 is the whole PG 80 facsimile. Registered passages at Ps 87 (cols. 1567-1573) and Ps 103 (cols. 1693-1707) already fix its column arithmetic. Section 3.6 itself says Theodoret 'is held for the Psalms'. (d) Theodoret on the Epistle: the registered whole-volume PG 82 layer artifact.theodoret-of-cyrus.interpretatio-epistolae-ad-galatas.1864-migne-pg82-paris.ia-djvu-ocr-db2067fd (re-fetched, SHA-256 db2067fd... matched) carries the heading of his commentary on 1 Corinthians at line 16372, v. 4 at 16583 and v. 8 at 16773. Section 3.6 says he is held 'for the Psalms and Galatians only'. (e) Aquinas's lectura on Matthew: artifact.thomas-aquinas.opera-editio-altera-veneta-tomus-3.venice-bettinelli-1745.ia-djvu-ocr-10aa155e is tracked (SHA-256 10aa155e... matched). Its work record says it holds 'Aquinas's lectures on Matthew and on John'. Caput IX opens at line 16227, and the exposition of Mt 9:1-8 runs to about 16540. It includes a penitential tropology ('Surge, a peccato per contritionem; tolle lectum, per satisfactionem ... vade in domum tuam, in domum aeternitatis, vel in conscientiam propriam', from 16514). It also reports Hilary on v. 8: 'Qui dedit talem potestatem hominibus, ut fiant filii Dei', with Jn 1:12 (16535). Yet sections 3.5 and 10.13 say the library holds Aquinas 'not for the Matthew lectura' and record the Gospel's later reception as a negative 'bounded by the registered library'. (f) The index was queried only for Sirach 36, Exodus 24, Ps 121:1, Mt 9:1 and 1 Cor 1:4 (review-dependencies.toml). For Ps 95:8 and Ps 101:16 it also returns Athanasius (whose whole PG 27 layer ...ia-djvu-ocr-969a381f is registered), Arnobius the Younger, Prosper, Alcuin, Gregory the Great on the penitential psalms, Jerome's Tractatus and Euthymius. None of these is named. The section 5.2 psalm list, drawn from Ps 121:1 alone, is presented as covering all three psalms. The Mt 9:1 list in sections 3.5 and 5.2 omits Theophylact, Bruno of Segni and the Glossa ordinaria, which the same query returns. As a result, section 5.2's 'none has a registered artifact for the psalms this formulary appoints' is false, and so are section 3.6's Theodoret statement and the Gospel negative of sections 3.5 and 10.13. The psalm rows carry no Greek and no later reception, although a tracked Doctor and two registered Greek Fathers cover them. Section 10.2's agreement that 'the psalms are read of it and not of a place' is stated without the two readers now in hand (Chrysostom, Bellarmine) who read Ps 121 first of the earthly city. This is the defect RES-001 named: a registered or tracked witness recorded as out of reach. It also leaves the profile's Greek-and-Latin sampling unmet for the four psalm-borne elements, where the Greek is registered."
required_result = "Sweep by artifact coverage and not only by work record. Run the index for every appointed locus, at least Ps 95:8, Ps 101:16, Ps 121:1, Ps 121:7, Mt 9:1, 1 Cor 1:4 and Ex 24:4. For each lead, check whether a registered collected-volume or whole-volume artifact contains it. At minimum, read and record in section 3 (with bindings): Chrysostom on Ps 121 in PG 55; Bellarmine on Pss 95, 101 and 121 in the tracked text; and Aquinas on Mt 9:1-8 in the tracked Venice 1745 layer. For Theodoret (PG 80 on Pss 95, 101 and 121; PG 82 on 1 Cor 1:4-8) and for Athanasius (PG 27 on Pss 95 and 101), either read them or name each as a registered route deliberately not used, with the reason. Preserve any material disagreement they carry, notably the historical reading of Ps 121 against the Latin allegorical one. Correct sections 3.5, 3.6, 5.2, 10.2 and 10.13 and every statement that the library holds none of these. Make each lead list match what the index actually returns for the locus it names."
repair_target = "research"

[[findings]]
stage = "research-review"
id = "RES-009"
severity = "blocking"
location = "research/scope.md section 6.3 (the Augustine rows and 'Registered routes that exist and were deliberately not used'), section 5.2 ('How this section is now kept'), sections 5.1.7 and 10.12; research/source-bindings.toml, context of the wikisource-part-11-latin-text binding"
problem = "Section 5.2 now claims that section 6.3 'names, per reception witness, which registered route was tried and what it gave, including the three where a registered route exists and was deliberately not used'. For the witness the first reading leans on hardest, it does not. The library registers Migne's own printing of Augustine on Pss 80-150: artifact.jacques-paul-migne.patrologia-latina-volume-37.paris-1845.internet-archive-google-pdf-afe6878f (whole-volume facsimile, 48,479,761 bytes; the work record reads 'containing the second part of Augustine's Enarrationes in Psalmos, Psalms 80-150'). Registered records already fix its column-to-page rule: segment ...latin-migne-pl37-paris-1845.psalm-88-columns-1139-1140 at PDF p. 63, and the tracked two-page derivative at PDF pp. 248 (cols. 1509-1510) and 431 (cols. 1875-1876). It is the only registered route to Augustine's own Latin on Ps 121, the psalm the formulary appoints three times, and to Migne's print of him on Pss 95 and 101. It is named nowhere in the leaf. Section 6.3 and the part-11 binding say instead that Augustine on the Introit verse and the Gradual 'stands on the English routes alone'. The library also registers augustinus.it Latin deliveries of both sermons on Ps 101 (artifact.augustine.enarrationes-in-psalmos.latin-augustinus-it-web-2026-09-05.augustinus-it-ps101-i-9c30d781 and -ii-71f61f8e), which are likewise unnamed. Section 5.1.7 settles Augustine's Ps 95:9 lemma on the web transcription alone. Yet for Cassiodorus the same record found it necessary to confirm the transcription against Migne's own print, and for Augustine that print is registered. The per-witness route account that RES-009 required is therefore still incomplete, and section 5.2's claim for it is unsupported."
required_result = "Name PL 37 in section 6.3 for Augustine on Pss 95, 101 and 121. Either read Augustine's Latin there (at minimum Ps 121 sections 2 and 12, and Ps 95 section 10 for the atrio lemma) and bind it, or record PL 37 as a registered route deliberately not used, with the reason. Name the augustinus.it Ps 101 routes the same way. Remove the 'English routes alone' statement from section 6.3 and the binding unless it is still true afterwards. Make the claims in sections 5.2 and 10.12 about the completeness of the second sweep true of what was actually tried."
repair_target = "research"

[[findings]]
stage = "research-review"
id = "RES-017"
severity = "blocking"
location = "research/scope.md section 5.2 (the paragraph 'The Ordines and the medieval liturgical commentators'), with sections 2 and 4.3; research/interpretations.md sections 2.5, 4.3 and 4.5"
problem = "The record names Rupert of Deutz's De divinis officiis as registered and declines to open it 'deliberately', because 'nothing in § 3 or § 4 turns on it, and § 2.5 forbids the compilation claim it would bear on'. The artifact is tracked in this checkout: artifact.rupert-of-deutz.de-divinis-officiis.latin-migne-pl-170.ia-djvu-ocr-2e2ca850, SHA-256 2e2ca850... matched. At physical lines 23433-23486 (Caput XVIII, 'Dominica, decima octava post Pentecosten') it expounds this Sunday's Mass as his books gave it. The Mass he expounds has the same Introit Da pacem, Epistle 1 Cor 1, Gradual Fiat pax, Communion Tollite hostias and Offertory Sanctificavit Moses. The Offertory carries its verses: 'Videns Moses, procidens adoravit, dicens: Obsecro, Domine, dimitte peccata populi tui'. But the Gospel is that of the chair of Moses (Mt 23). Caput XIX (heading at 23488) gives the paralytic of Mt 9 to the Nineteenth Sunday. He reads Da pacem as 'peccata dimitte. Pax enim Dei, peccatorum remissio est', and Fiat pax in virtute tua as 'remissio peccatorum in Spiritu sancto tuo'. He reads the Offertory's Moses as the pastor's model of intercession for the people's sins. At the Nineteenth Sunday he reads fidem illorum as the prelates offering the paralytic by prayer. The tracked continuation of Gueranger's The Liturgical Year, vol. XI (artifact.prosper-gueranger.the-liturgical-year.english-duffy-1900-volume-11.ia-pdf-95ba98e2), has a chapter on this Sunday at PDF pp. 414-424. It covers Dominica vacat after the September ordinations, the interruption of the Ephesians epistles, and Rupert's other Gospel with its harmony with the Moses Offertory. It reads the Gospel as 'the prerogative which these same men have of forgiving sins'. The three-document contract names exactly this kind of witness, 'a named liturgical commentator [who] expounds the Mass of the day as his books gave it', as documented reception of the compilation. It lists 'a commentator whose Mass had another Gospel' among the compilation facts to record. The omission changes claims in the record. Scope section 4.3 and interpretations sections 2.5 and 4.5 tell the study that no checked witness supports the ministerial or priestly sense and that it must be presented as the editor's. Interpretations section 4.3 says authority-on-earth is 'the only one that accounts for why a Mosaic altar stands at the offering of this Gospel', although the registered commentator's Mass paired that Offertory with another Gospel. And scope section 2 records where the chant-set and the oration-set stood but not where the Gospel stood."
required_result = "Read Rupert, De div. off. XII.18-19, in the tracked PL 170 layer, quoting only what the volume's page images confirm, as that artifact's own note requires. Read the Eighteenth-Sunday chapter of the tracked Gueranger vol. XI. Record the Gospel placement his books show in scope section 2, and record his readings in sections 3-4. Label them documented reception of the compilation, kept distinct from patristic exegesis of the passages, and bind both sources. Replace the section 5.2 rationale for leaving Rupert unopened. Then restate interpretations sections 2.5, 4.3 and 4.5 (and scope section 4.3) so that what they say no witness supports is true of the witnesses now checked. Attribute any use of the liturgical commentators to them and not to the Fathers."
repair_target = "research"

