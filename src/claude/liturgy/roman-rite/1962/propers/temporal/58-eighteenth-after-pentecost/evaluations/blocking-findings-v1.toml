[[findings]]
stage = "study-review"
id = "STU-020"
severity = "blocking"
location = "research/interpretations.md: 4.3, the paragraph 'Where they agree, and it is worth saying because it looks like a disagreement' (lines 943-959: 'All three treat qui dedit potestatem talem hominibus the same way ... 1 gives the verse no weight either ... a study that staged that contest would be inventing it') and the last bullet of 'Where the real disagreements stand' (line 997: 'none of the three readings turns on it'); 3.2 and the 3.3 gospel row (line 823), which carry no Hilary at Mt 9:8; 3.4 Anagogical (lines 857-860); 2.4 Anagogical (line 587); 2.3 epistle row (lines 534-536). Contradicted by sections/40-nothing-of-our-own.tex (subsection 'The man who was carried', last paragraph, and the Anagogical item), sections/30-authority-on-earth.tex (Anagogical item) and sections/50-comparison.tex (first paragraph, and the paragraph 'One disagreement runs between two readings')."
problem = "The manifest declares this record as every reading's source and as the reference of the concise overview, themes and commentary and of the homily body. It no longer records the readings the study gives, and it contradicts them on three points. (1) Mt 9:8. This round the study took route (a) of STU-014. The third reading now takes Hilary's side on the crowd's praise. I read In Matth. VIII.8 (PL 9, cols. 961-962) in the tracked layer db389fea: 'Conclusa sunt omnia suo ordine ... alioquin laus de uno homine, non de pluribus exstitisset: sed delati Deo honoris hinc causa est, quod potestas hominibus ac via data sit per verbum ejus ...'. The comparison now names the Chrysostom-Hilary difference as the one disagreement that runs between two readings. Record 4.3 says the opposite: all three readings treat the verse the same way, none turns on it, and 'a study that staged that contest would be inventing it'. Record 3 lists no Hilary at v. 8 among the third reading's witnesses. (2) The anagogical senses. Since the iteration-1 repair of STU-004, the study grounds the second reading's anagogical sense in Hilary VIII.7, Ambrose (Exp. in Lc. V.14) and Aquinas's domus aeternitatis. It grounds the third reading's in 1 Cor 1:8, where the confirming is Christ's on either reading, and in the Postcommunion's perficias. 1 Cor 1:8 is an anchor of the third reading only. Record 2.4 still gives the second reading 1 Cor 1:8, and record 3.4 still gives the third reading 'perfection, not completion'. (3) Record 2.3 (the epistle row) and record 3.4 set Chrysostom's 'not only the beginnings must be good, but the end also' beside v. 8's 'confirmabit vos usque in finem'. I re-fetched the New Advent delivery of Hom. in 1 Cor. 2; its SHA-256, 66bffe29...5858, matches research/scope.md 6.3. In it the sentence stands in section 6, on v. 7 ('Waiting for the revelation'). Chrysostom's reading of v. 8 is covert accusation (section 7), as the record's own 3.2 and scope 4.7 say. STU-003 removed this misplacement from the study, but it survives in the record. The contract requires research/interpretations.md to record each interpretation's four senses and the differences within and between interpretations. The concise and homily authors are pointed to this record, and its 4.5 points the homily to the third reading, whose 3.4 carries the misplaced quotation. As things stand, those authors would work from a record that denies the disagreement the reviewed study states, gives superseded senses, and attaches a Chrysostom sentence to the wrong verse. The author-study stage may not edit the record; it reported the 4.3 drift for routing in research/production-review.md this round. The study's own prose needs no change for this finding."
required_result = "Research re-enters and brings research/interpretations.md into line with the study as reviewed. This needs no new retrieval and changes no evidence. (a) In 3.2 and the 3.3 gospel row, record Hilary, In Matth. VIII.8 (PL 9, cols. 961-962), as a witness of the third reading at Mt 9:8, with its locus and wording. Label the join of the Gospel's end to the Epistle's opening as editorial synthesis. (b) In 4.3, withdraw three statements: 'All three treat qui dedit potestatem talem hominibus the same way', 'a study that staged that contest would be inventing it' and 'none of the three readings turns on it'. State what the study states. The first reading does not use v. 8. The second reports Chrysostom first and Hilary after, takes its own sense of the verse from Schuster, and cites Hilary only to show that the men of the verse receive forgiveness and do not minister it. The third takes Hilary's side. Record the Chrysostom-Hilary difference as the one disagreement that runs between two readings. (c) Restate the anagogical senses of 2.4 and 3.4 as the study gives them, with 1 Cor 1:8 and perficias as anchors of the third reading only. (d) In 2.3 and 3.4, attach Chrysostom's 'not only the beginnings must be good, but the end also' and 'need of many labors' to 1 Cor 1:7 (Hom. in 1 Cor. 2, section 6), and give his reading of v. 8 only as covert accusation (section 7). Alternatively, take those sentences out of the v. 8 context. Research review then confirms the record against the study."
repair_target = "research"

[[advisories]]
stage = "research-review"
id = "RES-031"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 2.2, Ambrose paragraph: '**What Ambrose says of the command to rise is not penitential.**' and the sentences after it (lines 446-451). research/scope.md 3.5, V.14 bullet ('No contrition or satisfaction: the penitential tropology of the command is Aquinas's (below), not Ambrose's', lines 1215-1220); 10 item 1, the Aquinas bullet (lines 3624-3625); and the header paragraph on the fifth re-entry (lines 77-78)."
problem = "Carried unchanged from research-review 6; unrepaired. This round extended the V.14 quotation inside this same paragraph (adding 'ea est enim vera domus ...') and left the bold negative in place. In the tracked transcription (ambrose-luke5-raw.txt, SHA-256 fde2303a... matched), V.14 says that the bed is the body, which David washes nightly with tears (Ps 6:7). It calls the bed 'lectus doloris, in quo anima nostra gravi conscientiae aegra cruciatu jacebat'. That is penitential imagery, even without the scholastic contritio and satisfactio. The negative states more than the locus bears. The study does not repeat it, and no reading or sense rests on it."
required_result = "Withdraw 'is not penitential' and 'Aquinas's ..., not Ambrose's'. Keep the true fence: 'per contritionem ... per satisfactionem ... in domum aeternitatis, vel in conscientiam propriam' is Aquinas's and no Father's. Describe V.14 as it stands, in all four places: the body as bed, washed with the tears of Ps 6:7; the bed of pain where the soul lay in the torment of conscience; the bed of rest for one who keeps Christ's precepts; and the return to paradise, the true home lost by fraud."

[[advisories]]
stage = "research-review"
id = "RES-032"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/scope.md 3.5: the Rabanus v. 2 bullet ('... was not found in Bede's In Lucam and is not traced here', lines 1143-1155); the bullet 'The Catena's other lemmata at this pericope' ('Neither is checked at its own locus', lines 1187-1190); and 'No Father of the Gospel's is now reported only by another' (line 1346). Also 4.2 (lines 2201-2206) and 10 item 1 ('is untraced', lines 3615-3620). research/source-bindings.toml, context of the PL 107 cols. 870-873 binding ('whose untraced sequel')."
problem = "Carried unchanged from research-review 6; unrepaired, because scope.md and the bindings did not move this round. Two things the record treats as separate are one text. The sequel to the '(Joan. Chrysost.)' passage at PL 107 col. 871 ('Audit veniam et tacet paralyticus ... et vecordiam sic jacentis respicit') and the Catena's unchecked 'Ioannes episcopus' lemma are both Peter Chrysologus, Sermo 50, De paralytico curato. That sermon preaches Mt 9:1-8 as the day's reading and takes the bearers' side in the whose-faith dispute. It is also transmitted under Maximus of Turin, and it has not been read in a controlled edition. The record honestly calls the passage untraced, and no reading depends on it."
required_result = "In scope 3.5, 4.2 and 10 item 1, and in the PL 107 binding context, record three things: that the sequel and the Catena's 'Ioannes episcopus' lemma are one text; that it is identified as a lead, Chrysologus, Sermo 50; and that it is also transmitted under Maximus of Turin. Then either read it in a controlled edition (PL 52 or CCSL 24) and add it to the whose-faith dispute, or state that it is identified but unchecked and not quotable. Qualify 'No Father of the Gospel's is now reported only by another' to match. Keep the passage off Chrysostom's name."

[[advisories]]
stage = "research-review"
id = "RES-033"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md, 'Two further boundaries', second bullet ('The five medieval Masses share this one's Introit, Gradual, Offertory antiphon and Communion', lines 49-52). research/scope.md 2.7, 'What this adds to section 2.5', first bullet (lines 560-563); and 10 item 16 (lines 3787-3790)."
problem = "Carried unchanged from research-review 6; unrepaired. For Sicard the sentence goes beyond the library's controlled element comparison. Mitrale VIII.18 names the Offertory and Communion together only by their sense ('in offerenda et communione invitat et monet populum revertentem ... altaria erigere et hostias immolare'). The locus inventory's Sicard VIII.18 row records no Communion element, and commentary-work-index formulary lists communion among the elements Sicard does not name. This is scope-record material that D11 keeps out of the readings, so no reading is misled."
required_result = "In all three places, say that four of the five name this Communion, and that Sicard names the Offertory and Communion together only by their sense, which the locus inventory does not identify as Tollite hostias. Alternatively, state the shared elements commentator by commentator, as the 2.7 table and commentary-work-index report them."

[[advisories]]
stage = "research-review"
id = "RES-034"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 2.4 Moral (lines 624-633) and the 2.3 communion row (lines 600-601); 3.4 Moral (lines 959-963); research/scope.md 3.11 and the 6.3 witness-register row for the continuation (line 3054: 'every sentence quoted checked on the rendered pages (PDF pp. 414, 415, 422, 423, 424, 426, 427)'). Study places that rely on the missing loci: sections/30-authority-on-earth.tex, 'The exchange and the courts' (last sentence) and the fourSenses Moral item; sections/40-nothing-of-our-own.tex, the Collect subsection ('The surest way to obtain grace ...', vol. XI p. 395), 'Not quietism' (Aquinas: 'quia portabatur, praecepit ut portaret') and the fourSenses Moral item."
problem = "STU-020 asked research review to confirm the record against the study. On the points STU-020 named, the record now agrees with the study. The two moral senses and three loci the study quotes are not in any research record. (1) The second reading's moral sense and its Communion subsection quote the continuation of The Liturgical Year: 'other victims, that is ourselves' (vol. XI, pp. 408-409; PDF pp. 429-430, where I read it). Record 2.4 Moral and the 2.3 communion row do not carry it. Scope's register lists the continuation pages it checked, and pp. 429-430 are not among them. (2) The third reading's moral sense ends on Aquinas's 'quia portabatur, praecepit ut portaret' (Super Matth. IX; in the Venice 1745 layer at lines 16509-16511, where I read it). Record 3.4 Moral does not carry it, and neither record quotes it. production-review.md discloses this one as the author's own check. (3) The Collect subsection quotes the continuation's p. 395 (PDF p. 416, read), which no research record carries. All three quotations are accurate and come from sealed, tracked sources. The record's senses are a subset of the study's and do not contradict it, so no concise or homily author is misled. But the record no longer records every locus the readings' senses rest on."
required_result = "Record the continuation's Communion reading (vol. XI, pp. 408-409) in scope 3.11 and in interpretations 2.3 (communion) and 2.4 (Moral), under the continuator's name and not Guéranger's. Record Aquinas's 'quia portabatur, praecepit ut portaret' (Super Matth. IX, Venice 1745, p. 122) in scope 3.5 and in interpretations 3.4 (Moral). Record the continuation's p. 395 where the record treats the Collect. Add the PDF pages read to the 6.3 register row. Alternatively, state in 2.4 and 3.4 that the study's moral senses add these checked loci."

[[advisories]]
stage = "research-review"
id = "RES-035"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 4.4, 'Notes for the concise study's page-1 overview', Anagogical bullet: 'the forgiven man's way home is the way back to paradise (the second, with Hilary, Ambrose and Aquinas)' (lines 1171-1175)."
problem = "This row is new this round. It groups Aquinas under 'the way back to paradise'. Aquinas's own words (Super Matth. IX; Venice 1745 layer, lines 16520-16521) are 'vade in domum tuam, in domum aeternitatis, vel in conscientiam propriam'. They name the house of eternity or one's own conscience, not paradise. Paradise is Hilary's (VIII.7, 'iter in paradisum') and Ambrose's (V.14, 'ad paradisum redire'). Record 2.4 and the study keep the three apart correctly. This note, which the concise author is pointed to, blurs them."
required_result = "Rephrase the second reading's clause so that each witness keeps his own word. For example: 'the forgiven man's way home is the way back to paradise (Hilary, Ambrose) and to the house of eternity (Aquinas)'. Alternatively, drop the names from the overview note and point to 2.4."

[[advisories]]
stage = "research-review"
id = "RES-036"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/58-eighteenth-after-pentecost/research/interpretations.md 3.2, Chrysostom's Hom. in 1 Cor. 2, last bullet: '**This covert accusation is Chrysostom's whole reading of v. 8.** He does not read the verse as a promise; Aquinas, Ambrosiaster and a Lapide do' (lines 793-797)."
problem = "This sentence is new this round, and it goes beyond both section 7 of the homily and the study. In the New Advent delivery (re-fetched; SHA-256 66bffe29...5858 matched), section 7 has two parts. It first says: 'Here he seems to court them, but the saying is free from all flattery; for he knows also how to press them home'. Only then does it say: 'But he is also covertly accusing them'. 'Whole reading' drops the first sentence and the force of 'also'. The study keeps both. It writes 'For Chrysostom the promise that Christ \"will confirm you unto the end without crime\" is \"also covertly accusing them\"'. Scope 4.7's accusation/promise division, accepted earlier, is not at issue. The problem is the new negative, which a later author could take as Chrysostom denying the promise. No sense rests on it: 3.4 frames the alternatives and concludes that the confirming is Christ's on either reading."
required_result = "Replace the bold sentence and its sequel with section 7 as it stands. Chrysostom says the verse seems to court them but is free of flattery, and that Paul is also covertly accusing them, since 'He shall confirm' and 'unreprovable' mark them as still wavering. He gives the verse no promissory exposition, which Aquinas, Ambrosiaster and a Lapide do. Drop 'whole reading'."

[[advisories]]
stage = "study-review"
id = "STU-021"
severity = "advisory"
location = "sections/30-authority-on-earth.tex, subsection 'What the crowd said', the sentence 'St Ambrose, at Luke's parallel, judges the onlookers' fear in the same way: divini operis miracula malunt timere quam credere ... (Expositio in Lucam V.15)'; sections/50-comparison.tex, paragraph 'One disagreement runs between two readings', the sentence 'Ambrose, at Luke's parallel, judges the onlookers' fear in the same way.'"
problem = "I read Exp. in Lc. V.15 in the tracked transcription (ambrose-luke5-raw.txt, SHA-256 fde2303a..., line 35). There the people who fear are unbelievers, and Ambrose identifies them with the calumniators: 'Spectant surgentem increduli ... et divini operis miracula malunt timere quam credere. Nam si credidissent, non timuissent utique, sed dilexissent ... Et ideo isti, quia non diligebant, calumniabantur.' He then turns to the scribes' evil thoughts and the leprosy in the hearts of the Jews. Chrysostom's crowd are glorifying God. Their confession falls short, and Christ 'does not rebuke them but raises their thoughts', as the study itself reports. research/scope.md 4.3 records Ambrose's identification of the fearers with the calumniators. 'In the same way' drops it, and it puts Ambrose on Chrysostom's side of the comparison's one between-reading disagreement with more agreement than his text supports. The direction of the judgement, negative, is right, so this does not block."
required_result = "In both places, say that Ambrose judges the fear more severely: in V.15 those who fear are the unbelieving, who would rather fear than believe, and he identifies them with those who calumniated. Do not present his judgement as Chrysostom's. Alternatively, drop Ambrose from the comparison's statement of the Chrysostom-Hilary difference."

[[advisories]]
stage = "study-review"
id = "STU-022"
severity = "advisory"
location = "sections/10-each-element.tex, Gradual subsection, last paragraph ('The gregorien.info database reports the chant at this Sunday in the six manuscripts of the Antiphonale Missarum Sextuplex: by its report, Laetatus sum is the Gradual of the Eighteenth Sunday after Pentecost in four of them, beside this Sunday's Introit, Offertory and Communion.')"
problem = "research/scope.md 2.3 sets out what the database's day 823 prints for this Sunday. Laetatus sum stands in R B K S; the Offertory and Communion stand in R B K S; the Da pacem Introit stands only in R B K. M has another Gradual, and C does not appear. So the first clause reads as if the database reported the chant at this Sunday in all six books, and the next clause corrects that to four. 'Beside this Sunday's Introit' also does not hold for Senlis. This sentence is this round's repair of STU-011. It attributes correctly, but it states the placings loosely."
required_result = "Say that the database's report for this Sunday gives Laetatus sum as the Gradual in four of the six books (Rheinau, Mont-Blandin, Corbie, Senlis), with this Sunday's Offertory and Communion in the same four and its Introit in three of them. Alternatively, drop the Introit from the 'beside' clause and the 'six manuscripts' framing from the first clause."

