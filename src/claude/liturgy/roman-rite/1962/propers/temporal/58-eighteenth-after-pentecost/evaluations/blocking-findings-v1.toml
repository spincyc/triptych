[[advisories]]
stage = "study-review"
id = "STU-015"
severity = "advisory"
location = "sections/20-peace-of-the-house.tex, subsection 'Going up to the house', paragraph beginning 'What Hilary adds to Augustine' ('Among his proofs he sets Paul's plea to the Corinthians, \"that you all speak the same thing and that there be no schisms among you\"'), and subsection 'Peace in thy strength' ('pax enim ecclesiae et unitas uirtutem nobis firmitatemque praestat ... (in Ps.~121, 13)')"
problem = "(1) I read Tract. in Ps. 121, section 5 on the Internet Archive page image of CSEL 22 p. 573 (item shilariiepiscopi22hilauoft, leaf n602). Hilary's proof reads 'in quod nos Paulus hortatur dicens: obsecro uos, fratres, ut idipsum sapiatis omnes eandem caritatem exercentes'. Zingerle refers it to 1 Cor 1:10, but Hilary's wording asks for one mind and the same charity, and has no schisms clause. The study quotes the Douay's 'that there be no schisms among you' as the plea Hilary sets, and that clause is what bridges the paragraph to Chrysostom's divided Corinth. It puts in Hilary's proof words he does not give. (2) 'pax atque uirtus domus huius conexa sunt sibi' stands in section 13. 'pax enim ecclesiae et unitas uirtutem nobis firmitatemque praestat' stands in section 14 (CSEL 22 p. 578), but the study cites both to section 13."
required_result = "Give Hilary's own form of the plea (that all be of one mind, exercising the same charity), identified as 1 Cor 1:10's plea two verses after the lesson ends, without the schisms clause. If the schisms clause is wanted, attribute it to Paul at 1 Cor 1:10 and not to Hilary's proof. Cite 'pax enim ecclesiae ...' to section 14."

[[advisories]]
stage = "study-review"
id = "STU-016"
severity = "advisory"
location = "sections/30-authority-on-earth.tex, subsection 'Son and man: who forgives, and where', last sentence of its first paragraph ('Chrysostom and Augustine reach the same conclusion by different roads, ... Augustine from the word \\latin{fili}')"
problem = "In De cons. evang. II.25.57 (tracked NPNF1-6 text ce371798, lines 12679-12698), Augustine's argument turns on Luke's 'man' beside Matthew's 'son'. The sins were forgiven to the 'man', and 'that mode of address served to indicate that He who forgave sins to man was Himself God'. The study's own previous sentence ('One word establishes that the patient is every man ...') rests on 'man', and the allegorical sense says 'the word \"Son\" beside Luke's \"Man\"'. 'Augustine from the word fili' names the other word."
required_result = "Say that Augustine argues from Luke's 'man' beside Matthew's 'son' (homo beside fili)."

[[advisories]]
stage = "study-review"
id = "STU-017"
severity = "advisory"
location = "sections/30-authority-on-earth.tex, subsection 'Where the ministerial sense stands, and where it does not', paragraph beginning 'Not every commentator on these chants reads them of the ministry' ('... and Honorius reads the Gospel's city as the Jerusalem to which the people returned with Jeshua the priest')"
problem = "Honorius's reading of Mt 9:1 stands in Gemma animae IV.86 (PL 172, col. 723; tracked layer 2ebfcb5f, lines 57040-57052), where he expounds the Mass Salus populi. He says there that the Gospel 'concordat' with that Mass's theme of the return, because 'populum cum Jesu sacerdote Jerusalem redisse constat'. His reading of this Mass's chants is in IV.84. The clause sets the IV.86 reading directly after the IV.84 one, so the reader is led to think Honorius read these chants and this Gospel together as the return from captivity. His book did not set them together. The profile says never to cite such a commentator in support of a connection between a shared element and this formulary's Gospel."
required_result = "Cite Honorius's reading of Mt 9:1 on its own, at IV.86, as reception of the Gospel and not as part of his reading of these chants. Otherwise drop the Gospel clause from this sentence."

[[advisories]]
stage = "study-review"
id = "STU-018"
severity = "advisory"
location = "sections/30-authority-on-earth.tex and sections/40-nothing-of-our-own.tex, the Anagogical item of each fourSenses block"
problem = "The STU-004 repair gives the third reading an anagogical sense of its own: the end is given as the beginning was, the confirming of 1 Cor 1:8 is Christ's, and the Postcommunion's perficias has God as its subject. But both anagogical senses now rest on the same Hilarian idea, taken from adjacent sections. The second uses VIII.7: the way into paradise given back to believers. The third uses VIII.8: a way given to men, of the resurrection of bodies and the return to heaven. A reader comparing the readings meets Hilary's restored way home twice. The third item's 'What the many receive at the last is a way given them' also shifts Hilary's tense. He says the power and the way have been given through Christ's word; the resurrection and the return are where the way ends, not when it is given."
required_result = "Keep Hilary's way home in the anagogical sense of the reading that develops it most fully. In the other, drop it or state plainly the different use it serves. Render VIII.8 as a way given now through Christ's word, whose end is the resurrection of bodies and the return to heaven."

[[advisories]]
stage = "study-review"
id = "STU-019"
severity = "advisory"
location = "sections/10-each-element.tex, Introit subsection, third paragraph ('The liturgical commentators on the Mass read the antiphon in three ways'), and Postcommunion subsection, last sentence ('The Mass that began with the Epistle's \\latin{Gratias ago}'); sections/20-peace-of-the-house.tex, subsection 'The earthly city rebuilt, and the strongest objection', last paragraph ('the chants are simply four psalm verses, each chosen for a word, pacem, domum, gentes, hostias'); sections/90-apparatus.tex, References, the entries for Rupert (XII.18--19), Durandus (VI.135--136) and Sicard (VIII.18--19)"
problem = "There are four small precision slips. (1) After 'in three ways' the paragraph gives at least five readings: Rupert; Durandus with the continuation; Honorius and Sicard; Honorius's second reading; and Schuster. (2) The Mass begins with the Introit, not with the Epistle. (3) 'pacem' is the word of the Introit antiphon, which comes from Ecclesiasticus, not from a psalm verse. (4) The study now cites nothing from Rupert XII.19, Durandus VI.136 or Sicard VIII.19, because their readings of Mt 9 were withdrawn, but the reference ranges still include those chapters."
required_result = "Correct the count or drop it. Say 'the Mass whose Epistle begins Gratias ago'. Describe the four words as the chants' words rather than as four psalm verses. Narrow the three reference ranges to the chapters the study cites."

