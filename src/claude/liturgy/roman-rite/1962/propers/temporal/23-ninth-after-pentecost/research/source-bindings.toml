source_fingerprint = "sha256:cce6b5473906365bb5f402f0f1aa8403a135408cc439a43ff50c5a36ffc05d21"
context = "Source of the published English of the Collect (printed p. 414), Secret and Postcommunion (both printed p. 415). The transcription is addressed by 1962 formulary rather than by the 1861 book's own heading, and the identification was confirmed on the printed Latin incipits, not on that heading: the collect row's incipit 'Pateant' answers Pateant aures misericordiae tuae and the postcommunion row's 'Tui nobis' answers Tui nobis, quaesumus, Domine. The Secret's incipit field is empty, because the 1861 book prints no incipit for it, so that one oration could not be confirmed by incipit; it was confirmed instead by matching its English clause for clause against the appointed Latin - frequently and worthily to celebrate these mysteries against haec digne frequentare mysteria, as many times as ... so often against quoties ... exercetur - and the six orations of the eighth and tenth Sundays were read to prove that the filing does not slip by one. All three orations occur once and only once in the whole file, so no competing rendering of the same Latin under another formulary could have been quoted by mistake. One divergence between the English and the Latin is published at the point of use in both editions: the Collect's 'that they may succeed in their desires' makes the petitioners the subject where ut petentibus desiderata concedas makes God the one who grants, so the guide conducts the grammatical argument on the Latin. The printing's abbreviated conclusion Thro'. is reproduced as printed and not expanded."

