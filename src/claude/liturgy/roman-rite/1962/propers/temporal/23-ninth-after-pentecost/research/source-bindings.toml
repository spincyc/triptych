# --- English of the appointed text -------------------------------------------
# Under the profile's published-text-and-English rule the guide composes,
# translates and paraphrases nothing. Scriptural propers take the
# Douay-Rheims (Challoner), which is the English of the Clementine Vulgate the
# missal prints; the orations take a registered public-domain hand missal,
# addressed by 1962 formulary rather than by the missal's own heading.
#
# Both works declare a locus_pattern, so every locus below is a bare token in
# that grammar. Loci are omitted for the three reference tables, whose rows are
# not verse loci; what was read in them is stated in their context.

