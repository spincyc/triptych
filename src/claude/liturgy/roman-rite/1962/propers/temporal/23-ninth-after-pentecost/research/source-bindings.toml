context = "Source of the published English of the four psalm chants: Ps. 8:2 is the whole Gradual, Ps. 18:9-12 the verses the Offertory centonises, Ps. 53:6-7 the Introit antiphon with Ps. 53:3 its psalm verse, and Ps. 58:2 the Alleluia verse. Every locus was read in the exact tracked verse file with its surrounding verses, and each Missal locus resolves directly because this edition's psalm numbers are the Vulgate/Septuagint numbers the Missal cites. Three findings are published from it. Ps. 8:2 carries both halves of the Gradual in a single verse, which independently confirms that the chant is one biblical verse divided at its own caesura. Ps. 53:3 reads 'and judge me in thy strength' - the Clementine's judica me - where the Introit sings libera me, so the Douay cannot be quoted for the missal's verb and the guide declares the gap instead of filling it. Ps. 53:6-7 has no counterpart to the antiphon's closing protector meus, Domine, which is likewise declared and left in Latin. The Offertory is not quoted continuously from this file: because the antiphon is a centonisation of vv. 9a, 10c, 11b and 12a, the four verses are printed whole with the fragments marked, so that no English sentence in either edition is a project-made join."

