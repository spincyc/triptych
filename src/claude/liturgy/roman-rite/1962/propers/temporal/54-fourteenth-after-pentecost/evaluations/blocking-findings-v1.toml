note = "Re-checked because content-revision edited this file again this production, dropping the published figure from the clause at ll. 153–156; neither subsection was touched and both stand as at iterations 0–2. Subsection 1 joins three appointed elements — Epistle, Gospel, Communion — on one named reception witness, Chrysostom at ll. 27–30, Robinson–Pierpont at ll. 25–26 being a Greek text and not a reader. Subsection 3 carries eight witnesses — Augustine, Christian of Stavelot, Jerome, Bruno of Segni, Godfrey of Admont, Hilary, Chrysostom, Paschasius — but names one appointed element, the Gospel, its Mt. 6:33 material at ll. 81–84 still never attributed to the Communion that appoints the verse a second time. Neither is a criterion 4 finding, and the scope distinction is worth leaving in the record because it is easy to misapply: guidance/liturgy/roman-1962-propers.md puts the per-unit multiple-elements-and-witnesses requirement at l. 305 and at ll. 185–190, both of them of the synthesis companion's integrated commentary, while l. 303 governs The Propers: Themes and Movement and asks only for three to five developed functional units accounting for every appointed element. The five units do account for all ten, subsection 5 alone naming every one, and at this iteration the integrated commentary's six units carry between two and ten appointed elements and between six and sixteen named witnesses each."

