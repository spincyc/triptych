note = "Restated from iterations 1 and 2, the tracked file being rewritten whole at each evaluation and the passage unchanged. The sibling leaf's own collated record, src/claude/liturgy/roman-rite/1962/propers/temporal/48-eighth-after-pentecost/propers/verified.md ll. 353-354, gives that Communion accented. My criterion 2 is anchored to this leaf's own propers/verified.md and the Eighth Sunday's Communion is not this formulary's appointed Latin, so the criterion does not reach it; P4's own limit field at ll. 223-226 declares the route for that reading as the Pustet Ratisbon 1862 and Venice 1570 text layers, which carry no accents, so the bare form is consistent with its declared witnesses. The leaf is not uniform either way: the Thirteenth Sunday's \\latin{redemptiónis ætérnæ \\dots\\ augméntum} is accented at sections/30-commentary.tex ll. 2630-2632 and sections/05-appointed-text.tex l. 282, while the Fourth, Trinity and Eleventh Sunday oration phrases at sections/35-source-grounded-synthesis.tex ll. 590-593 are bare. What would settle it is a stated convention for quoting another formulary's appointed Latin, which no criterion in this stage's list asks for."

