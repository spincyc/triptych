location = "src/claude/liturgy/roman-rite/1962/propers/temporal/54-fourteenth-after-pentecost/sections/90-scope.tex ll. 314-319, the paragraph naming what the liturgical instruments could not reach"
note = "research/scope.md §4.16(n) records that two 1935 editions were deliberately not used because they are in copyright -- \"Klauser's *Capitulare evangeliorum* (1935) and Hesbert's *Sextuplex* (1935) were deliberately not used, not even as leads\" -- and the appendix names only Hesbert. `Klauser` occurs zero times in all eleven section files, so a lectionary edition the sweep declined for a stated reason is absent from both editions' record of what was not reached, where its companion is named. This is a provenance-record gap rather than a reception gap: Klauser is an edition of a capitulary and not a patristic or saintly witness, so criterion 3's \"negative results recorded rather than left silent\" does not reach it and neither does criterion 6 or 11; the nearest owner is criterion 10, which belongs to another lane, and it is recorded here rather than reported there."

[[observations]]
lane = "synthesis-argument"
location = "workflows/fragments/propers/content-evaluation.md, criterion 4 (\"Cross-proper synthesis\") and criterion 5 (\"Exploratory proposals\"), read against guidance/liturgy/roman-1962-propers.md line 305, \"Give each substantial claim one fullest home; remove repeated quotations, recaps, thin subsections, name lists, and stretched links\", and line 347, \"The Propers: Interpretive Possibilities is a required discovery section, not a recap ... Reject generic applications, decorative symbolism, numerology without textual control, and restatements of the detailed commentary.\""
note = "Restated from iterations 0 through 6 because the tracked standing-findings file records only blocking findings and observations --- an advisory reaches it not at all, which I confirmed by reading evaluations/blocking-findings-v1.toml, whose twenty entries carry no CON-SYN id --- so this sighting would otherwise leave no record. Offered plainly as the fourth orphaned class the lane fragment invites me to name rather than as a fact about this document. The profile states the rule twice --- one fullest home for the synthesis sections, no recap for the proposals --- and neither sentence has an owner among the twelve shared criteria. Criterion 4's two tests are whether the synthesis is redistilled and whether each unit draws on multiple elements and witnesses, and this leaf passes both while a companion reader still meets four of its six arguments twice at close to full strength and two sentences three times over. Criterion 5's three tests are the exploratory label, the two joined elements and the four mandated fields, and this leaf passes all three while four of its six proposals still build their Mechanism out of a claim the same built document asserts a few pages earlier as source-grounded. What this iteration adds is a second negative in a row: the seventh revision edited two of the four sections this defect lives in --- one sentence of sections/20-themes.tex and one citation of sections/35-source-grounded-synthesis.tex --- and removed none of the repetitions, exactly as the sixth revision's nine compressions did not. That is what it looks like when the only stage that reads this document's defects is never told about them. The three earlier orphaned classes were given owners in criteria 5, 7 and 2; if this one is to be repaired rather than recorded a ninth time, criterion 4 needs a sentence making cross-section redundancy within one built document reportable, and criterion 5 needs the profile's own \"not a recap\" clause added to its enumeration. No repair target in this run owns workflows/fragments/, which is why this is an observation and not a finding."

[[observations]]
lane = "synthesis-argument"
location = "sections/20-themes.tex:12-33, subsection 1 of the brief synthesis (\"1. The kingdom, said three times\"), read against guidance/liturgy/roman-1962-propers.md line 303 and line 305."
note = "Re-checked because this revision's single edit to this file falls inside this unit --- lines 24-27 now read \"That clause closes an arc the Vulgate opens at Mt. 6:1, where Robinson--Pierpont's Byzantine text reads alms\" --- and an edit to a synthesis-bearing unit could have cost it an element or a witness. It cost it neither: subsection 1 still joins the Epistle, the Gospel and the Communion on \\latin{regnum Dei}, and the section's five units still account for all ten appointed elements between them, which is what line 303 asks of The Propers: Themes and Movement. What it still stands on is a single named reception witness: a scan of lines 12 to 33 against thirty names returns Chrysostom at line 27 and no other reader, where subsections 2 through 5 carry four, eight, seven and seven. I am not raising this as a criterion 4 finding, and the reason is a distinction worth stating: the profile puts the per-unit multiple-witnesses requirement at line 305 and at lines 186-187, both of the integrated commentary, while line 303 governs this section and asks only for three to five developed functional units accounting for every appointed element. So no criterion I own is violated, and the witnesses on this unit's own hinge --- Augustine and Paschasius on \\latin{primum} --- do stand in the same section, at lines 81-84 under subsection 3. Recorded rather than found because it is the one place where this revision's edit and this lane's criterion come close to touching, and a person reading the standing record after the run should be able to see that it was checked again."

