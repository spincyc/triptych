note = "Restated from iterations 5 and 6 and still true in three files, one of them reaching the synthesis edition only. Transliterated Greek is set in the \\latin{} macro: Chrysostom's sarka gar entautha, ou to soma kalei, organon gar estin he sarx and ouch he psyche kai to soma stand in the same face and macro as, and at 35 interleaved with, the genuine Latin of Marius Victorinus and the Glossa in the following sentences. The leaf's own convention everywhere else is \\emph{} for transliterated Greek -- sections/30-commentary.tex l. 1113, l. 1132, l. 1162, l. 1923 and l. 2241, sections/35-source-grounded-synthesis.tex l. 24 and l. 224, and sections/synthesis/20-integrated-commentary.tex l. 191 and l. 297. The surrounding prose names the language correctly at each place, so no evidence-state claim is wrong and neither of my criteria reaches it; it is markup, and it is worth repairing in one pass with CON-EVI-050, which is the same class of the leaf's typography not tracking what it is setting."

