note = "Restated from iterations 1 and 2 because the tracked file holding it is rewritten whole at each evaluation and every passage is unchanged at this commit. The guide states a rights rule about the Catholic Encyclopedia — an article read from the volume facsimile may be quoted, the same article read from a per-article web transcription may be summarised but not reproduced — and then acts against it two paragraphs later: 90-scope says the Galatians and Matthew articles \"are held here as tracked, public-domain, indexable article text, and page 2 accordingly reports what each says\", and page 2 at 10-date-location ll. 95-97 reproduces Aherne verbatim, \"the majority of the upholders of the South-Galatian theory suppose, with much greater probability\". Neither article carries a References entry of its own naming its route and state, where every other witness in the guide does; the only entry that reaches them is the chronology-corpus one at ll. 294-302, which names volumes VI, X, XI, XII and XIV as the corpus's sources and states no route or state for the article text quoted. My own criteria do not reach it: the five evidence states are about what a source can support, and this is a rights disposition and its internal consistency, which sections/90-scope.tex ll. 511-518 itself says is enforced by authorship and by no mechanical gate. I do not think it is a fourth missing class, only one instance of rights discipline."

