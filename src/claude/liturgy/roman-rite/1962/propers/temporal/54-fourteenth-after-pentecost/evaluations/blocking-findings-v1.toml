note = "The seventh reviser referred this passage to this lane as a judgement it had deliberately left, and the judgement is that criterion 12 does not reach it and it must not be cut. \\pfield{Strongest limit} is the controlling-limit field guidance/liturgy/roman-1962-propers.md requires of every proposal -- end with the strongest material limit, alternative, or disconfirming condition -- which the criterion's out-of-scope list exempts as qualification by design `however that field is labelled`, and the fragment states that list is the entire boundary. guidance/editorial.md says the same of the limit fields of the proposals where it describes what the house-voice screen masks. The passage is also not one of CON-PRO-002's four loci, all of which stood in sections/30-commentary.tex, and this lane established at iteration 4 that pressing the class past its boundary re-opens an evidence-lane defect: those two clauses are what states the evidential standing of the Benziger form of adiicere on which the proposal's own limit turns, so deleting them would remove the limit rather than rewrite it. Recorded so that the judgement outlives this run and no later pass re-opens it."

