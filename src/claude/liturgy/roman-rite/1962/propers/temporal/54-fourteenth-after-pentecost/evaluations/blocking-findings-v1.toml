[[findings]]
id = "CON-EVI-052"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/54-fourteenth-after-pentecost/sections/30-commentary.tex l. 12-17, the head paragraph of \"The typical edition against the Benziger printing\" (\"Three of the readings in the Benziger column were read on the Internet Archive item's own single-page JP2 derivative of printed pp.~389--390: the Introit's \\latin{míllia}, the \\latin{fi}-ligature accents and the acute in \\latin{adiícere} at Mt.\\ 6:27\"), and the two comparison-table cells that carry those readings, l. 21 (\"read on that JP2 page image\") and l. 25 (\"read on the same JP2 page images\"). The file is input only when \\TriptychSynthesisEdition is undefined (main.tex l. 27-29), so these three reach the canonical edition alone."
problem = "The three page-image readings are printed at the one section that actually tables and argues from them without the evidence-state label the leaf's own record and its own appendix say travels with them, and the section states no bound at all about the derivative's standing. propers/verified.md's fifth re-confirmation records that the JP2 zip is a derivative of the same scan as the registered .djvu but \"is not one of this repository's records\", and instructs in terms that \"until it is, a reading taken from it is a reading of an unregistered derivative of a registered item and is labelled so wherever it is used\". sections/90-scope.tex l. 34-40 repeats that as a declaration about this guide: the three readings \"are readings of an unregistered derivative of a registered item and are labelled so wherever they are used\". They are so labelled at the other two places the leaf uses them -- sections/50-interpretive.tex l. 100-102 (\"read on the Internet Archive item's own single-page JP2 derivative and so a reading of an unregistered derivative of a registered item\") and sections/99-references.tex l. 30-36 -- but the word \"unregistered\" does not occur anywhere in sections/30-commentary.tex, on a grep of the whole file, and neither does any equivalent. So on the page where the Introit's \\latin{míllia}, the \\latin{fi}-ligature accents and the Mt. 6:27 acute do their work, and where they stand three lines from the registered, hash-matched CMAA facsimile that controls the Latin column beside them, a reading of a file this repository holds no record for is presented on the same footing as one taken from a registered artifact, and sections/90-scope.tex l. 39-40's \"and are labelled so wherever they are used\" is false of the leaf as printed. This is the same class as CON-EVI-048 and CON-EVI-045, both of which I re-read and confirm repaired, and it is not a restatement of either: neither named this locus and neither concerned the Benziger readings. It takes the new id CON-EVI-052. The seventh revision reports rewriting these three surfaces this round so that the readings and the page images are the subject; whatever they said before, the qualifier is not in them now, and no earlier finding of mine reached them."
required_result = "sections/30-commentary.tex says at the place of use that the JP2 derivative is one this repository registers no artifact for, so that the three readings are labelled readings of an unregistered derivative of a registered item -- in the head paragraph at l. 12-17, which is the sentence that introduces all three, and in whichever of the two table cells the sentence does not already govern. The form is already in the leaf and does not reintroduce the register-narration CON-PRO-002 removed, because it takes the reading as its subject: sections/50-interpretive.tex l. 100-102 is the model. Nothing else in the section changes: the three readings themselves, \"Every other Benziger reading in the table stands in that item's uncorrected optical text layer and not on any page of the book\", and the Introit cell's \"printed with two \\latin{l}s at the head of the right column of p.~389\" are all right as printed and agree with propers/verified.md, and sections/90-scope.tex l. 30-45 must be left as it stands."
repair_target = "authoring"

