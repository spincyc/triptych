note = "Re-measured at this iteration rather than carried, this record being rewritten whole and the revision having edited this same file at ll. 592–594. Both sentences are unchanged, and both are evidence bounds whose demonstrative has no antecedent in its own paragraph. At ll. 82–83 the sentence before states no count at all — it says that Chrysostom's citation drops \\latin{et iustítiam eius} as the antiphon does, so the abbreviation is ordinary — and the nearest cross-formulary count, that \\latin{regnum Dei} occurs in this formulary alone at exactly three loci, stands about fifty-five lines earlier at ll. 25–27 already carrying this same bound inline. At ll. 641–642 the bound now opens a paragraph of its own, and the sentences it points back over are the settled-grammar concession, “No count of Roman orations outside these fifteen stands behind the contrast” and the \\latin{crucifixérunt} qualification, none of them a count needing a denominator; the two counts in C6 that do need one, at ll. 585–587 and l. 598, likewise carry the bound inline, and “too” points back to the equally orphaned sentence at ll. 82–83. My criteria do not reach it: criterion 7 owns a stated count its enumeration contradicts and this arithmetic is right; criterion 12 expressly protects an evidence bound whose subject is the formulary rather than this repository's handling of one, which is the form both take; and criterion 4 asks about redistillation and about elements and witnesses per unit, which a dangling demonstrative does not touch. It is a copy-editing defect in the section this lane reads most closely, and I do not think it is a missing class."

