note = "Re-recorded rather than dropped, for the same reason: this file is rewritten whole and the brief is read-only to this run. Sec. 2.5 reports Jerome's \"labor exercendus est, sollicitudo tollenda\" (ad v. 25) as anchored at vv. 25 and 31 and available in Latin in his own Commentarii in Matthaeum, and sec. 7.5 instructs a worker to prefer it there; sec. 2.10.5 says the same sentence \"reaches this brief only as quoted inside ST II-II q. 55 a. 6 ad 2\" and rules that \"It must not be cited as Jerome's until his own commentary is read.\" The leaf follows sec. 2.5, quoting the Latin in the Jerome witnessnote and recording the commentary at References as read on the appointed verses. I judge the leaf right and raise no finding: sec. 2.10.5's own parenthesis concedes that a verified segment covers PL 26 cols. 15-218 and so the appointed verses, and the leaf states that same fact at sections/90-scope.tex ll. 293-295 and sections/99-references.tex ll. 361-363. Jerome is swept, retained and correctly attributed. Recorded so that a later reader meeting sec. 2.10.5 alone does not strip a Latin citation the earlier join established."

