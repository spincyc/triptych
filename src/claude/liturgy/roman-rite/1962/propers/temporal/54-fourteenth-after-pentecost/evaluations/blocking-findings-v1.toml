note = "My read on naming the guide's own edition in reader-facing prose, recorded at length because two of this run's revisions have now turned on it and because a later pass that cuts these clauses would trade criterion 12's defect for criteria 1 and 2's, which my lane fragment warns against by name. The five rewritten sentences fall into two classes and neither is a criterion 12 matter. Three References entries and the scope appendix's English paragraph now name the canonical edition; both files are wholly out of criterion 12's scope, which excludes References and Appendix: Scope and Qualifications as qualification by design, so nothing there is mine to judge and the ground the reviser gave — that 90-scope.tex l. 525 already used the phrasing — is beside the point, since l. 525 is in the same exempt appendix. The two gallery sentences are in scope, and there the repair did not import the locution at all: it deleted “printed above” and left “where the Douay reads ‘or he will sustain the one, and despise the other’”, whose subject is a text. That is the right answer, and the general one I would give: naming the canonical edition inside body prose is a statement about the guide's apparatus and not about a text — “the canonical edition prints X” makes this publication the subject and reports what it does, the same shape as “it stands bracketed above in the missal's own Latin and untranslated” that criterion 12 names as a defect — while “the Douay reads X” and “the 1861 book prints X” name the source. Confining the edition-naming to the two exempt sections and naming the source in the body is the correct split, and it is the split the leaf now has. Separately re-examined and judged conforming, so that a later pass does not cut them: the five “this guide has collated” clauses in body prose, every one a restrictive relative modifying a denominator noun whose sentence subject is a formulary, a substantive or a count — the test guidance/editorial.md ll. 121--129 states, and the form scripts/_house_voice.py names in terms as prose the screen exists to protect; the “unregistered derivative of a registered item” and “uncorrected optical text layer” qualifiers at sections/30-commentary.tex ll. 12--17, 21 and 25, whose subject is the reading or the volume; and the eight \\englishgap blocks at sections/05-appointed-text.tex, which now say only what the Latin has and the English has not and never how the guide handled the gap."

