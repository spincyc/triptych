required_result = "Every sentence in a file main.tex inputs outside the \\ifdefined\\TriptychSynthesisEdition branch that locates material \"above\", \"here\", or in \"the commentary\" is true of both published editions. I believe the locators are wrong and the substance is right: the AAS double numbering, the Decreta negative, Migne's three misplaced references, the Cyril and Ambrose renderings at NPNF second series vols. 7 and 10, Christian of Stavelot's Solomon note, the Super Matthaeum misattribution and Anthony's Latin are all correct where the canonical edition carries them. Take the same route already taken for the five repaired loci -- name the canonical edition, as the Cummiskey and Clementine entries now do (\"recorded in the canonical edition\", \"as the canonical edition's commentary records\", \"the rendering quoted in the canonical edition\", \"is what is quoted there\") -- or fence the clauses with \\ifdefined\\TriptychSynthesisEdition. Never write \"the commentary\" unqualified in a shared file: both editions build a section of that name out of different files. Then sweep the class to completion rather than these nine loci alone, testing each candidate against the built synthesis PDF: any \"above\", \"here\", \"as the commentary records\", \"reported there\" or \"corrected above\" in 00-map, 10-date-location, 20-themes, 35-source-grounded-synthesis, 40-notable, 50-interpretive, 90-scope or 99-references whose referent lives only in sections/05-appointed-text.tex or sections/30-commentary.tex belongs to it. Negative claims (\"nothing of that homily is quoted above\", \"neither text is quoted above\") are true in the abridged edition a fortiori and need no change. Nothing needs retrieval: every value the repaired sentences state already stands in sections/30-commentary.tex and research/scope.md."
repair_target = "authoring"

[[findings]]
id = "CON-CIT-110"
lane = "citation-integrity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/54-fourteenth-after-pentecost/sections/30-commentary.tex ll. 2639-2642, the paragraph headed \"\\textbf{\\latin{Semper}, a second time.}\" at the Postcommunion: \"Of the fifteen 1962 formularies this guide has collated, three carry \\latin{semper} in an oration and \\textbf{this is the only one of those fifteen that carries it twice.}\" main.tex inputs 30-commentary only inside the \\else branch of \\ifdefined\\TriptychSynthesisEdition, so the sentence reaches the canonical edition alone; in the rebuilt build/claude/liturgy/roman-rite/1962/propers/temporal/54-fourteenth-after-pentecost.pdf it stands at p. 41."
problem = "Both halves of the sentence are false against the collated records its own denominator names, and the leaf contradicts itself about it. sections/90-scope.tex ll. 364-366 fixes that denominator as twenty-one collated text records covering fifteen distinct 1962 identities and forty-five orations, which are the fifteen temporal identities 39, 41, 43-55 held under src/claude and src/gpt. I swept `semper` across all twenty-one of those records. It stands in an appointed oration of four of the fifteen, not three: Trinity Sunday's Collect (`ab omnibus semper muniamur adversis`), the Eighth Sunday's Collect (`Largire nobis, quaesumus, Domine, semper spiritum cogitandi quae recta sunt`), this Sunday's Collect and Postcommunion, and the Fifteenth Sunday after Pentecost's Collect (`tuo semper munere gubernetur`, no. 1583) and Secret (`et contra diabolicos semper tueantur incursus`, no. 1589). The remaining two records that carry the word carry it in a chant and not an oration -- the Fifth Sunday's Introit at Ps. 15:8 and the Twelfth Sunday's Ps. 33:2 -- so no reading of the sweep yields three. And because the Fifteenth Sunday carries it in two of its three orations, `this is the only one of those fifteen that carries it twice` is false on any reading of `three`, including one that means three others. The leaf already holds the disproof at src/claude/liturgy/roman-rite/1962/propers/temporal/54-fourteenth-after-pentecost/sections/50-interpretive.tex ll. 158-161, where P3's Strongest limit says in terms that `semper` is one of the four things this Collect shares with the very next Sunday's Collect; a reader who holds both pages sees the guide assert and deny the same fact. The record is src/gpt/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/propers/verified.md ll. 48-50 and ll. 115-118."
required_result = "I believe the numbers are wrong and the sweep is right: the list of formularies is not printed here, so what must change is the sentence. Restate it as the collated records return it -- `semper` standing in an oration of four of the fifteen collated identities, and twice in two of them, this Sunday and the Fifteenth -- or drop the cross-formulary figures entirely and let the paragraph say only what it can support from this formulary, that the Collect's `tuis semper auxiliis` is answered by the Postcommunion's `Purificent semper`. If the second clause is kept in any form it must not say `only`, since the Fifteenth Sunday's Collect and Secret carry the word too. Whichever route is taken, the sentence must agree with sections/50-interpretive.tex ll. 158-161, which already names `semper` as shared with the Fifteenth Sunday's Collect. No retrieval is required: the counter-example stands in the collated records the denominator itself names, at src/gpt/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/propers/verified.md, and research/scope.md ll. 7139-7141 already records the shared `semper`."
repair_target = "authoring"

