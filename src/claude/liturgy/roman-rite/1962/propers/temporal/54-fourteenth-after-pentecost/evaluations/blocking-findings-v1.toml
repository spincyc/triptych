note = "Recorded at iterations 5 and 6 and still standing. The brief lists the five Patrologia Latina hits as Gelasian XLI, Gelasian X, the Gregorian `DOMINICA I ANTE NATALEM DOMINI`, \"Gelasian XVI\", and the saint-adapted Gelasian LXVIII; the commentary and the Wilson References entry give the fourth of those as \"the floating series of unassigned Postcommunions appended after the Canon at printed p.~237\". Nothing in the brief or the leaf states whether \"Gelasian XVI\" and that floating series name the same place. The division of the five between the two prayers, three and two, is unambiguous in both and is what CON-CIT-032's repair rests on, so no finding follows; recorded so that the unexplained section number is not later mistaken for a locus the leaf dropped."

