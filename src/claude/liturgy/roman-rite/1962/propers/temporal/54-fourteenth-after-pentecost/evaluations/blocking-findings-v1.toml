note = "Re-recorded rather than dropped, this file being rewritten whole at each evaluation and the brief being untouched by this run. The brief still writes the a Lapide negative two ways: sec. 11.7(c)'s \"Still unswept, and named\" list says \"Cornelius a Lapide on Galatians\" flatly, while sec. 4.3 says \"Cornelius a Lapide's commentary proper\" and sec. 5.2 says the repository holds only the Galatians argumentum and prooemium and that the rest was not fetched. The later and narrower layer is the true one, and the leaf now carries it in all three places -- 30-commentary and 90-scope both read \"at the appointed verses\", and the References entry at l. 325 reads \"His commentary on the appointed verses was not swept\" -- which is what two evaluations spent findings reaching. Only research-synthesis may write research/scope.md and this run has no such stage, so my criteria do not reach the brief; I record it because a later authoring pass meeting sec. 11.7(c) alone would reinstate the looser wording, and because sections/99-references.tex l. 325 is the shortest route to the true bound. One near-miss inside the repaired sentence, recorded so a fourth pass does not reopen it: sections/30-commentary.tex ll. 1395-1396 and sections/synthesis/20-integrated-commentary.tex ll. 157-159 both say Anthony of Padua defines all twelve fruits individually, which research/scope.md l. 280 confirms, so a reader could ask why he is not the second Latin witness on whether fides at Gal. 5:22 is faith or fidelity. He is not, and the sentence is right as it stands: only his definitions of continentia and castitas are printed above, the sentence is bounded to what stands above, and the brief's own framing at sec. 5.2 treats a Lapide and not Anthony as the missing second voice. I raise nothing on it."

