note = "Restated from iterations 4, 5 and 6 and unrepaired, in a file the seventh revision did edit. The manuscript's name is misspelled Compiètgne for Compiègne, two lines after the same entry spells it correctly at l. 103, and where sections/35-source-grounded-synthesis.tex ll. 450-476 and sections/90-scope.tex ll. 192 and 322 all have it right. References is out of scope for criterion 12 and the misspelling is not a source disagreement, a sweep gap or a voice defect, so no criterion of this lane reaches it; it is recorded here because the entry is the leaf's only route to the Compiègne readings that four sections rest on."

[[observations]]
