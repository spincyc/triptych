note = "Recorded at iterations 4, 5 and 6 and still standing, research/scope.md being untouched by the seventh revision. The read-only brief states \"Six comparatives of degree in four Latin constructions stand in exactly three of the ten elements\" while enumerating seven in the same cell -- Introit `melior … super millia`, Gradual `Bonum est … quam` twice, Gospel `plus quam` twice, `Nonne … magis pluris`, `quanto magis`. The leaf prints seven and four and three and is right on its own enumeration, which I recounted again this round against the appointed Latin of the Introit, the Gradual and the Gospel, and its strongest-limit clause divides the seven correctly into the Gospel's four and the three that may be Hebraisms. The leaf needs no change and only research-synthesis may write the brief, so this reaches no repair target through my criteria; it is recorded so the discrepancy is not read back as a leaf defect at a later round."

