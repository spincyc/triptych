problem = "This id's five named loci are repaired and I verified each: the gallery's two comparanda now read \"where the Douay reads\", the Cummiskey entry names the canonical edition, the Clementine entry names \"the divergence table of the canonical edition\", the Douay entry names the canonical edition's scriptural propers and the gallery's own Douay readings, and 90-scope ll. 53-54 reads \"as the canonical edition prints them\". What was not done is the sweep of the class that this finding's required_result demanded, and nine sentences of the same class still stand. Each asserts positively that something is recorded, reported, corrected or quoted in a place the synthesis edition does not have. The Honorius entry is the sharpest, because \"as the commentary records\" resolves wrongly rather than merely dangling: the synthesis edition builds a section titled \"The Propers: Detailed Commentary\" out of sections/synthesis/20-integrated-commentary.tex, and that file records nothing about Migne's three misplaced parenthetical references -- the strings \"misplaced\", \"parenthetical\" and \"wrong sentences\" occur nowhere in the synthesis edition outside this References sentence itself. The two rights sentences about Anthony are the next worst: they justify a quotation of his thirteenth-century Latin, and the synthesis edition quotes no word of it, its only mentions of him being reports in the guide's own words at sections/synthesis/20-integrated-commentary.tex ll. 158-164 and sections/35-source-grounded-synthesis.tex l. 699. The Cyril and Ambrose entries claim a Nicene and Post-Nicene Fathers second-series rendering \"quoted above\" whose every string -- \"chanter inviting you\", \"Trust not the judgment to your bodily palate\", \"In that sacrament is Christ\" -- returns nothing from the whole 45-page synthesis PDF. The AAS, Decreta, Christian of Stavelot and Super Matthaeum entries are the same shape at a lower temperature. The References section opens \"Only sources