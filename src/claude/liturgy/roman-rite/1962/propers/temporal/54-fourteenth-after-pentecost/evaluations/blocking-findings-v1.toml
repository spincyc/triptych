note = "The staleness my lane observed at iterations 5 and 6 is gone, and I record the closure rather than the complaint: I checked both paragraphs against the tree and both are true. All seven loci of the accent table print confidere and fidei bare, a grep over every section file returns no accented form of either as appointed Latin, and my own ten-block character comparison of the guide's appointedlatin blocks against the record's ten blockquotes returns ten identical; the one accented pair left in the guide is the Benziger column of sections/30-commentary.tex l. 25, which is that book's own reading. sections/30-commentary.tex no longer argues from the text layer at the Introit, and both it and sections/90-scope.tex carry the fi-ligature accent difference and name three page-image readings. What that record now says about the JP2 derivative is also what CON-EVI-052 holds the guide to."

[[observations]]
lane = "reception-sweep"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/54-fourteenth-after-pentecost/sections/35-source-grounded-synthesis.tex l. 456 and src/claude/liturgy/roman-rite/1962/propers/temporal/54-fourteenth-after-pentecost/sections/synthesis/20-integrated-commentary.tex l. 373, both reading \"For four of the five Gelasian books --- Rheinau, S.~Gallen, Pamelius and Menard --- the disagreement stands on Wilson's apparatus and not on their own pages\""
note = "Restated from iterations 5 and 6 and unrepaired. Two of those five are editions of the Gregorian sacramentary and not Gelasian books, and the same file says so a hundred and twenty lines earlier: sections/35-source-grounded-synthesis.tex l. 333 opens \"And the two Gregorian editions that disagree about this Sunday's number are editions of two different manuscripts\", naming Pamelius's Grimoldus codex and Menard's Rodradus codex, and sections/30-commentary.tex ll. 359-364 makes the distinction load-bearing, which is the whole of the \"four against one is not four independent witnesses\" argument. sections/20-themes.tex l. 117 keeps them apart correctly (\"Menard's book and the Frankish Gelasian books\") and sections/30-commentary.tex says only \"the five books\" at ll. 310 and 380. The mislabel reaches both published editions. No criterion of this lane reaches it -- it is not a source disagreement dropped, not a sweep gap and not a voice defect -- and it is not the arithmetic class criterion 7 owns either; the nearest owner is criterion 7's \"no invented ... historical facts\", and this may be a fourth recurring class needing a criterion of its own: reader-facing prose that misdescribes what a named source is, where the same guide elsewhere describes it correctly."

