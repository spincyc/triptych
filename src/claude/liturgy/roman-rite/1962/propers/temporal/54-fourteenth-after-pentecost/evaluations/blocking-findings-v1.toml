note = "A revision tell — a sentence whose comparison is to an earlier draft of this guide — standing in reader-facing prose of both editions, and my criteria do not reach it: criterion 12's out-of-scope list exempts the controlling-limit field of each proposal outright, and that list is stated to be the entire boundary. I record it because I think this is a real gap in the boundary rather than a fact about the leaf, which is the case my lane fragment asks me to state plainly. The exemption exists because a limit field must qualify, and qualification read as process narration would produce the fault the criterion means to prevent; but “deeper than when this was drafted” qualifies nothing about the evidence — it dates the guide's own drafting, and the limit would be identical and stronger as “Both divisions are deeper than they look, and one of them may be shallower.” An earlier revision of this leaf was told to remove “the revision tells” from the detailed commentary, so the class is one the run has already acted on elsewhere; inside the limit field nothing reaches it. A boundary drawn by section leaves this sheltered, where a boundary that exempted qualification of the evidence rather than a whole field would not. I raise no finding and propose no edit: acting on it would be reaching past the carve-out my own criterion sets."

