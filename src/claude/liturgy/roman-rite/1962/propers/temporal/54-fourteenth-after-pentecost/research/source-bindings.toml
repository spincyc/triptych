context = "The held public-domain authority carrying the traditional side of the Galatians dossier, on the form the published sibling leaf 53 uses. He reports the Syriac and Greek end-subscriptions and Jerome, Athanasius and Theodoret for Rome, then Chrysostom and Baronius for Ephesus or another Greek city, and concludes that neither the epistle nor other evidence permits a certain determination of its time or place. That refusal is preserved in the guide and not flattened. Bytes not retained: summarised. One asymmetry is kept in view: a Lapide is a witness to the received tradition and substitutes for the traditional side, not for the modern critical horizon."

