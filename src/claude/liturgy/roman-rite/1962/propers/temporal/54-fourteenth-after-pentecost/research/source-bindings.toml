context = "The registered public-domain English for the three orations, reproduced with the book's own nineteenth-century spelling and its abbreviated conclusion. The book's own heading agrees with the 1962 formulary's number, and the correspondence was confirmed on the heading and on the Latin incipits rather than assumed from the number. Three places where this English does not answer the Latin are stated at their elements and left open rather than filled: propitiatio and semper vanish from the Collect, tuae propitiatio potestatis becomes a verb in the Secret, and perpetuae salvationis effectum collapses in the Postcommunion. The repository's translation ledger records the Secret and the Postcommunion as page-image collated at printed p. 427, the Secret corrected in that collation, and the Collect as resting on an agreement-between-two-scans detector with no printed page recorded; the guide states that at the Collect, correcting its own earlier record, which had it the other way round. REPINNED 2026-09-02 by the source-audit stage, after the review the changed fingerprint obliges and not as a mechanical copy. The controlling artifact was rewritten by commit a8d1720b2 on 2026-08-27, so the pin recorded here (sha256:473570a7...) no longer reproduced and source-library validate failed on this file. The review: the two versions of temporal-orations-en.tsv differ in four rows only -- three printed_page values at epiph-06 and septuagesima and one truncated conclusion at ssmi-corporis-christi -- and physical lines 152-154, which are this formulary's three orations, are byte-identical across the change. Nothing this guide prints moves, and the pin is raised to the reviewed value. The ledger statement above is also now stale in a way this binding cannot repair: the 2026-08-28 disposition of roman-1962-proper-translations-v1.toml replaced the pentecost-14 rows with text-free untranslated records, so the collated and detector fields it cites no longer exist there. It no longer matters for the Collect, because this run collated all three orations against page images of the registered 1861 scan (artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-scan-pdf, sha256 85034c90..., printed pp. 425 and 427), and each is exactly the English the guide prints."

