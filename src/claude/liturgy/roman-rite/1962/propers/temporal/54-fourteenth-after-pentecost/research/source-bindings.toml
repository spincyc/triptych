context = "Cited in the Introit and Alleluia dossiers for the antiquity and ordinary evidentiary weight of the psalm titles and for David as principal author, and specifically for the category of psalms expressly attributed to David in Scripture, which is what carries the Alleluia's attribution beside Heb. 4:7. The guide states in terms that this is a criterion about titles in general and not a ruling on any psalm of this formulary. Bytes not retained: summarised. It supplies no basis for attributing an untitled psalm to David, which is part of why the Gradual's Date cell reports a negative."

