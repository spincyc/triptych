# Publication-local record of how this guide used the reusable source library.
# It supplements and does not replace `propers/verified.md`, which is the text
# control for every appointed form, or `research/scope.md`, which owns the
# reception matrix, the audits and the material negative results.
#
# Three limits govern the whole file.
#
# First, `states` describe what this publication actually did with the record,
# not what the record could support. Where a source was read in an electronic
# transmission rather than collated against a page image, the context says so.
#
# Second, the patristic and medieval layer is bound here almost not at all,
# because none of its witnesses has a passage record in this library at the loci
# used. That much is uniform across the layer. What is NOT uniform is whether a
# witness was reached at all, and an earlier form of this comment collapsed the
# two into a single claim that all of them "were every one reached at an exact
# locus and read directly". That claim was false of most of the list. The two
# halves are stated separately below, on the authority of research/scope.md
# 3.2, 3.3, 4.2, 4.3 and 11.6, which is this publication's record of what was
# actually reached.
#
# REACHED at an exact locus and read directly this run, unbound only for want of
# a passage record, and cited in the guide's References with their own loci and
# evidence states: Augustine's Enarrationes in Psalmos on Psalms 33, 83, 94 and
# 117; Augustine's De sermone Domini in monte and De opere monachorum;
# Chrysostom on Matthew and on Galatians; Cyril of Jerusalem; Ambrose; Aquinas
# on Galatians and the Catena aurea in Matthaeum; and Anthony of Padua. Reached
# and read directly, and cited in the guide but outside that References
# subsection: Gueranger, Wilson's two sacramentary editions, and Honorius. Not
# one of these is verified in the source-library sense, because Migne was opened
# for none of them; the References state the route, the evidence state and the
# translation for each.
#
# NOT REACHED. These are named here rather than left to be inferred, because
# this file is what a later run reads to decide what still needs retrieving, and
# a record asserting direct reading of a witness the same publication declares
# unretrieved is worse than one that says nothing:
#   - Cassiodorus on Psalms 33, 83, 94 and 117: registered with no payload; the
#     probe of the host that carries him failed on certificate verification.
#   - Chrysostom, Expositio in Psalmum CXVII: not retrieved.
#   - Theodoret on Psalms 83 and 94: PG 80 is held public-domain, there is no
#     passage record, and the volume was not opened at these psalms. (Theodoret
#     on Psalm 33 is a separate matter and IS bound below.)
#   - Theodoret on Galatians: registered only at 3:16-22, so it reaches no verse
#     of the appointed pericope.
#   - Jerome on Galatians, Comm. in Gal. lib. II prol.: held in this repository
#     in no form -- no work, edition, artifact, segment or passage record.
#   - Ambrosiaster, Cassian and Marius Victorinus on Galatians: not swept.
#   - Papias, and Eusebius Historia ecclesiastica III.24.6 and III.39.16: held
#     in no form; only Book VI of the Historia ecclesiastica is held here.
#   - Irenaeus, Adversus haereses III.1.1: held as tracked, public-domain,
#     searchable bytes, but with no registered passage record for that locus.
#   - Jerome, De viris illustribus: registered at ch. 2 and not the ch. 3 cited,
#     in an English edition registered against a claim of Latin reading, and the
#     artifact is no longer byte-reproducible.
#   - Gregory on Ezekiel: not retrieved, and not cited anywhere in this guide.
#   - Schuster, Liber Sacramentorum vol. 3: registered here and deliberately not
#     retrieved.
#   - No Veronense edition is registered at all, Feltoe included.
# Nothing in this second list is used as a source in the guide's References,
# which carries used sources only. Where the guide names one of them at all --
# Theodoret on Psalms 83 and 94 and on Galatians, Cassiodorus, Ambrosiaster,
# Cassian, Marius Victorinus, Chrysostom on Psalm 117, Papias, Eusebius,
# Irenaeus, Jerome De viris illustribus -- it names it inside a bounded negative
# on page 2, in the commentary, or in the scope appendix, and quotes it nowhere.
# Theodoret's exposition of Psalm 33 is the single exception in his case and it
# is not in this list: it is bound below, is used, and is in the References.
#
# Cited without a binding and outside the patristic layer: the AAS 1960 page
# images, the newspaper and parliamentary material of the gallery, and the four
# printed missals of 1570, 1604, 1920 and 1947 other than the two bound below as
# rights controls.
#
# Third, no `negative-search` binding appears. The bounded negatives this guide
# publishes were established either by reading printed editions or by literal
# search over optical layers that are not registered as indexable, so no
# replayable search receipt exists for any of them.

