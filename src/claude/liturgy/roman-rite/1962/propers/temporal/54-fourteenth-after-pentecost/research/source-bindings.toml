context = "The only registered locus of this restricted edition that this guide uses, and the only modern critical horizon available to it for any appointed passage. Its rights basis requires consumers to summarise rather than reproduce it, so the Galatians dossier reports its north-Galatian audience near Ancyra, its Ephesus composition about AD 54-55, its less likely southern alternative in Pisidia, Lycaonia and Pamphylia at perhaps AD 48-50, and its identification of the recipients as pagan converts pressed to add Mosaic observances, all in the guide's own words, and quotes none of it. An earlier form of this leaf carried nine claims attributed to this edition, of which eight had no registered locus at all and five of them were quoted; the eight are gone, and this one is summarised. Note what the record positively refuses: it gives no southern-theory composition place, so the guide's earlier 'from Antioch on the southern theory' is not merely unsourced but contrary to the only record it had."
