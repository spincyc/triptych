# Publication-local record of how this guide used the reusable source library.
# It supplements and does not replace `propers/verified.md`, which is the text
# control for every appointed form, or `research/scope.md`, which owns the
# reception matrix, the audits and the material negative results.
#
# Three limits govern the whole file.
#
# First, `states` describe what this publication actually did with the record,
# not what the record could support. Where a source was read in an electronic
# transmission rather than collated against a page image, the context says so.
#
# Second, the patristic and medieval layer is bound here in two parts. The
# witnesses this run reached on Migne page images, in the printed liturgical
# books, and in the cultural-afterlife corpora ARE bound below, because the
# source library now registers them. The witnesses of the earlier runs, read
# from transcriptions the library does not register, are NOT bound, and the
# reason is that they have no record at the loci used and not that they were
# unreached. What is NOT uniform is whether a witness was reached at all, and an
# earlier form of this comment collapsed the two into a single claim that all of
# them "were every one reached at an exact locus and read directly". That claim
# was false of most of the list. The two halves are stated separately below, on
# the authority of research/scope.md 3.2, 3.3, 3.8, 4.2, 4.3, 10.3 and 11.6,
# which is this publication's record of what was actually reached.
#
# REACHED at an exact locus and read directly, unbound only for want of a
# passage record, and cited in the guide's References with their own loci and
# evidence states: Augustine's Enarrationes in Psalmos on Psalms 33, 83, 94 and
# 117; Augustine's De sermone Domini in monte, De opere monachorum and
# Retractationes; Chrysostom on Matthew and on Galatians; the spurious In
# Psalmum 94 of the Chrysostomic corpus; Cyril of Jerusalem; Ambrose; Aquinas
# on Galatians and the Catena aurea in Matthaeum; Anthony of Padua; Jerome on
# Matthew and, at lib. III on the appointed verses, on Galatians; Cassiodorus
# on Psalms 33, 83, 94 and 117; Theodoret on Psalms 83, 94 and 117, read in
# Greek, his Psalm 33 exposition standing outside the volumes retrieved for that
# reading and bound below from a held passage record instead;
# Ambrosiaster and Marius Victorinus on Galatians; the Glossa ordinaria,
# Prosper, Arnobius the Younger, Rabanus, Paschasius Radbertus, Christian of
# Stavelot, the Matthew exposition printed under Bede's name, Bruno of Segni,
# Bruno the Carthusian, Peter Lombard and Godfrey of Admont. Reached and read
# directly, and cited in the guide but outside that References subsection:
# Gueranger; Schuster's Liber Sacramentorum vol. 3, read on page images of the
# registered artifact with its digest matched before reading; Feltoe's 1896
# Sacramentarium Leonianum, over whose two registered optical artifacts the
# seventeen-string Veronense search was run; Wilson's two sacramentary
# editions; and Honorius. Not one of these is verified in the source-library
# sense, because Migne was opened for none of them; the References state the
# route, the evidence state and the translation for each, and the medieval
# Latin layer stands throughout at inspected on one optical transcription of
# Patrologia Latina.
#
# Two of them carry a further restriction the References repeat: the passages
# at PL 152:1250 (Bruno the Carthusian) and PL 174:583 (Godfrey of Admont)
# must be checked at a page image before any word of them is quoted, and the
# guide quotes neither, reporting both witnesses in its own words instead.
#
# NOT REACHED. These are named here rather than left to be inferred, because
# this file is what a later run reads to decide what still needs retrieving, and
# a record asserting direct reading of a witness the same publication declares
# unretrieved is worse than one that says nothing:
#   - Chrysostom, Expositio in Psalmum CXVII: FORMERLY NOT RETRIEVED, and now
#     read in Greek on a page image of Patrologia Graeca 55 col. 331; it is
#     bound below.
#   - Theodoret on Galatians: his REGISTERED PASSAGE stands at 3:16-22 and so
#     reaches no verse of the appointed pericope, but the statement this file
#     formerly made -- that no Pauline commentary of his was found -- is now
#     false. His Interpretatio Epistolae ad Galatas cap. V is registered in
#     Patrologia Graeca 82 and was read verse by verse across the whole
#     appointed pericope on page images of cols. 495-498; it is bound below.
#   - Cassian on Galatians: not swept.
#   - Papias, and Eusebius Historia ecclesiastica III.24.6 and III.39.16: Papias
#     is held in no form, and of the Historia ecclesiastica only Books VI-X in
#     Greek and Book VI in English are held here, so Book III is out of reach.
#   - Irenaeus, Adversus haereses III.1.1: held as tracked, public-domain,
#     searchable bytes, but with no registered passage record for that locus.
#   - Jerome, De viris illustribus: registered at ch. 2 and not the ch. 3 cited,
#     in an English edition registered against a claim of Latin reading, and the
#     artifact is no longer byte-reproducible.
#   - Gregory on Ezekiel: not retrieved, and not cited anywhere in this guide.
#   - Of the nine Greek authors this file formerly listed as swept for no
#     appointed passage, SIX are now swept and bound below: the Selecta in
#     Psalmos under Origen's name at the Introit and the Offertory, the
#     Expositiones in Psalmos under Athanasius's name at the Introit and the
#     Alleluia, Basil at the Offertory, Chrysostom at the Gradual and at the
#     Gospel and Communion, and Theodoret across the whole appointed Epistle.
#     THREE remain unswept and the reason is that the routes tried failed rather
#     than that nobody looked: Cyril of Alexandria, Theophylact and Euthymius
#     Zigabenus stand in digitised Patrologia Graeca items that return a file
#     count of zero, and the alternative collection failed certificate
#     verification. Gregory of Nyssa, Gregory of Nazianzus and Didymus were not
#     attempted.
# Nothing in this second list is used as a source in the guide's References,
# which carries used sources only. Where the guide names one of them at all --
# Theodoret on Galatians, Cassian, Chrysostom on Psalm 117, Papias, Eusebius,
# Irenaeus, Jerome De viris illustribus -- it names it inside a bounded negative
# on page 2, in the commentary, or in the scope appendix, and quotes it nowhere.
#
# Holdings, stated because an earlier form of this comment stated one of them
# wrongly: the Sacramentarium Veronense IS registered here, as
# work.catholic-church.sacramentarium-veronense with the Feltoe 1896 edition and
# two Internet Archive optical artifacts
# (ia-djvu-ocr-sacramentariuml00feltgoog, ia-djvu-ocr-sacramentariumle00cath),
# which is what makes the Veronense negative replayable; and Schuster's vol. 3
# is registered and was retrieved and read. The earlier comment denied both.
#
# Cited without a binding and outside the patristic layer: the AAS 1960 page
# images, the newspaper and parliamentary material of the gallery, and the four
# printed missals of 1570, 1604, 1920 and 1947 other than the two bound below as
# rights controls.
#
# Third, no `negative-search` binding appears, and the reason has two halves
# that an earlier form of this comment collapsed into one. It is right about the
# sacramentary optical layers, the Benziger text layer, the Migne and Centro
# Studi facsimiles and the Corpus Orationum entry, all of which are
# indexable = false, and that covers the Veronense and sacramentary negatives.
# It is WRONG as a blanket: the Pustet Ratisbon 1862 and Venice 1570 full texts
# are both tracked, text/plain and indexable = true, and the real limit on them
# is the optical one the Pustet artifact's own notes record and this guide
# publishes as a standing warning. No published negative is called into doubt by
# that; what is at stake is whether the strongest of them could be pinned as a
# replayable receipt rather than resting on prose.
#
# Fourth, two statements this file formerly made about the library are false at
# named witnesses and are corrected here rather than left standing. Anthony of
# Padua is NOT "unbound only for want of a passage record": he has three passage
# records over the Centro Studi artifact, at states cataloged, acquired,
# inspected and verified, one of them reaching Gal. 5:22-23. And Jerome's
# Matthew commentary has a verified segment covering Patrologia Latina 26
# cols. 15-218, which contains the appointed verses, so the References statement
# that none of the patristic witnesses has a source-library record at the loci
# used is false of him. Both corrections are carried into the guide's own
# References and scope appendix.

