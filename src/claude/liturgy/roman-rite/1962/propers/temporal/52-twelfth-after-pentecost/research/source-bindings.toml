context = "Source of the published English of the Collect (printed p. 420), Secret (printed p. 422) and Postcommunion (printed p. 423). The transcription is addressed by 1962 formulary rather than by the 1861 book's own heading. The collect row's incipit Omnipotens answers Omnipotens et misericors Deus and the postcommunion row's Vivificet answers Vivificet nos; the Secret's incipit field is empty because the 1861 book prints no incipit for it, so that oration was confirmed by matching its English clause for clause against the appointed Latin - the offerings we lay on thy holy altar against quas sacris altaribus exhibemus, to the honour of thy name, by obtaining pardon for us against nobis indulgentiam largiendo, tuo nomini dent honorem - and the six orations of the eleventh and thirteenth Sundays were read to prove that the filing does not slip by one. Three divergences between the English and the Latin are declared at the point of use: the Collect's single adverb worthily for digne et laudabiliter, the Secret's reversed order of honour and pardon, and the Postcommunion's flattened be to us both for tribuat with pariter. The printing's abbreviated conclusion Thro'. is reproduced as printed and not expanded."

