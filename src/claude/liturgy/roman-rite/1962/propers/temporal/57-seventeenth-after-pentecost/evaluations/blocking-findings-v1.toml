[[advisories]]
stage = "homily-review"
id = "HOM-001"
severity = "advisory"
location = "sections/homily/90-note.tex, References, the fifth entry: \"St Augustine, \\work{Enarrationes in Psalmos} 109, 3--6, Latin text of Migne, PL 37.\""
problem = "The entry cites the Latin as \"Latin text of Migne, PL 37\" without saying that it was read from a tracked digital transcription rather than from the printed columns. The reviewed expansive study's own apparatus discloses the delivery for this very source at sections/90-apparatus.tex line 114, \"Latin text of Migne, PL 36--37 (Wikisource and Corpus Corporum)\", and the leaf binds the passage to artifact.augustine.enarrationes-in-psalmos.latin-migne-corpus-corporum-wikisource-web-2026-09-05.wikisource-part-11-latin-text, which is where I verified the quoted matter (\"Respondeamus omnino quod Judaei, sed non remaneamus ubi Judaei\" and \"in forma Dei ... ideo Dominus David: sed temetipsum exinanisti formam servi accipiens; inde filius David\"). The same holds for the Jerome entry, whose passage record states in terms that printed-image collation was not performed. The note is otherwise scrupulous about routes, flagging the 1861 Cummiskey English as a historical study aid and not an approved liturgical translation, naming the NPNF translators for both Greek and Latin Fathers quoted in English, and saying that the Offertory antiphon is a compilation quoted in no English at all, so these two entries are the only place a reader could take a printed-page reading to have been performed when it was not."
required_result = "The References either name the delivery through which each Latin text was actually read, matching the disclosure the reviewed study's apparatus already carries for the Enarrationes, or the note's \"English quoted, and its route\" paragraph states once that the Latin of Augustine on Ps 109 and of Jerome on Daniel is read from tracked digital transcriptions of Migne and not from the printed columns."

[[advisories]]
stage = "research-review"
id = "RES-018"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/57-seventeenth-after-pentecost/research/scope.md section 3.3 ('Direct ancient exegesis, Greek' row, line 654) and section 4.5 ('What each adds', lines 816-819); research/interpretations.md section 2.1 ('this attribute, which is owned to be the Son's') and section 2.2 (the Chrysostom In Eph. hom. 11 bullet, line 316)"
problem = "Standing advisory from research-review iteration 3, restated because it is not cleared and this stage's entries replace the previous ones in evaluations/blocking-findings-v1.toml. Both loci still print the NPNF1 13 English 'Now this they own to be an attribute of the Son' with Migne's Greek 'Kaitoi tou Huiou, touto einai phesin' in parentheses as its original. The Greek has the singular phesin, 'he says', whose subject is Paul, whom the homily introduces with phesi throughout; the English has a plural 'they own'. Section 3.3 still implies that the absence of a word for 'the Lord' is the only divergence between Migne and the NPNF, and interpretations section 2.1 still carries the English's passive 'is owned to be the Son's'. The controlling claim of reading 2 is unaffected -- under either text an attribute ascribed to the Son is here said of the Father and so cannot mark inferiority -- but a study that quotes the NPNF sentence and cites PG 62 for it would give Migne's Greek a subject it does not have."
required_result = "scope.md sections 3.3 and 4.5 record that PG 62 col. 80 reads phesin ('he says') where the NPNF English has 'this they own', and that the Greek text behind the NPNF was not identified for this sentence either; the NPNF sentence is no longer presented as a rendering of the quoted Greek (quote the English alone as the registered NPNF, or give the Greek with its own sense); interpretations.md section 2.1 is adjusted to match; the identification of 'this' with 'through all' stays labelled as the record's own inference."

[[advisories]]
stage = "research-review"
id = "RES-019"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/57-seventeenth-after-pentecost/research/scope.md section 9, 'Rights, quotation and publication bounds', the 'Patristic and medieval texts' bullet"
problem = "The rights bullet names Migne PL 25, 26 and 170, the ANF and NPNF volumes, the Cassiodorus and Augustine Latin, Wilson, Schuster and Gueranger. It names none of the three sources read on the second and third reentries whose original-language text the readings depend on and will quote: Chrysostom's Greek in Migne PG 62 col. 80 (scope 3.3, 4.5; interpretations 2.2), Theodoret's Greek in Migne PG 82 cols. 532-533 (scope 3.3, 4.5; interpretations 1.2, 2.2, 2.5), and Hilary's Latin in CSEL 22, Zingerle 1891, pp. 500-501 and 515 (scope 3.1, 4.11; interpretations 3.2, 3.3, where Hilary is a principal witness of reading 3). Section 6.2 marks the Hilary optical layer 'rights unresolved' and section 10 item 1 lists all three among unregistered witnesses citable in References, but neither states whether the underlying printings may be quoted in a publication. The three-document profile makes research/scope.md the record of 'unresolved evidence and rights', and the study's terminal rights boundary is drawn from it, so the study author is left either to derive the basis independently -- a second source of truth for a fact this repository holds once -- or to carry a quotation whose rights the leaf never recorded. The underlying facts are benign: the Hilary artifact record's own rights_basis states that the CSEL 22 printing is public domain in the United States by publication date and that only the Internet Archive OCR derivative's distribution grant is unestablished, and the 1860 and 1864 Migne volumes stand on the same footing as PL 25, 26 and 170 already listed. No reader is misled and nothing unlawful is proposed; the record is simply silent where the profile asks it to speak."
required_result = "scope.md section 9 states the publication rights basis for Migne PG 62 (1860), Migne PG 82 (1864) and CSEL 22 (Zingerle, 1891) alongside the PL volumes already listed, and distinguishes the public-domain underlying printings from the Internet Archive optical derivatives whose own grant is unestablished, so that the Greek of Chrysostom and Theodoret and the Latin of Hilary each carry a recorded basis before the study quotes them."

[[advisories]]
stage = "research-review"
id = "RES-020"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/57-seventeenth-after-pentecost/research/scope.md section 7.4, first bullet ('No traditional attribution for any of the four psalms is in the corpus's answer') and section 10 item 6; consequence in research/chronology-annotations.tex, the gradual macro"
problem = "The record establishes, correctly and at its own loci, that Ps 32 meets the exact criterion of the chronology corpus's own Davidic binding -- Douay Ps 32:1 'A psalm for David.' and Clementine 'Psalmus David.', which I confirmed in both tracked verse texts -- while falling outside that binding's scope (src/sources/chronology/bindings.yaml, first binding, scoped to Pss 33, 39, 70, 85, 94 and 97, whose note excludes only the anonymous, Sabbath and Korahite headings and does not mention Ps 32). The consequence reaches the reader: the Gradual's Date cell will carry only the critical-profile boundary 'Before c. 165 B.C.' with no traditional attribution, although the 1962 profile's page-2 rule asks that the responsibly sourced traditional attribution and chronology be foregrounded and expressly allows a Davidic attribution to carry David's sourced regnal era as a named reference point. The research filed a request to the corpus owner rather than acting, which is the right instinct, but the reason it gives -- that bindings.yaml is 'a shared corpus file that other publications' chronology records are computed from' -- overstates the blast radius as it applies here: no other chronology record in the repository reaches a Ps.32 locus (the seven tracked research/chronology.toml files were checked), so the tracked artifacts that would change are this leaf's two chronology files and the gated derived view src/sources/chronology/coverage.tsv. That is a real cross-owner change and not one this stage should make unilaterally mid-run, but it is a much smaller one than the stated reason implies, and the difference is what a maintainer needs in order to weigh the request."
required_result = "Either the corpus owner's correction is carried out under guidance/scripture-chronology.md section 15 -- Ps 32 added to the traditional-attribution binding's scope citing bible:douay-rheims:Ps.32.1 and the Clementine title, the corpus checks run, coverage.tsv rebuilt, and this leaf's research/chronology.toml and research/chronology-annotations.tex regenerated with tools/tpt proper-chronology -- or scope.md section 7.4 states the actual scope of the change (this leaf's two generated files and the derived coverage.tsv, no other publication's chronology record reaching Ps 32) so that the standing request in section 10 item 6 carries what the owner needs to decide."

[[advisories]]
stage = "study-review"
id = "STU-003"
severity = "advisory"
location = "sections/20-whole-heart-one-body.tex, \"Two commandments, one love\" (PDF p. 14): \"One of his homilies on the Gospels expounds the parable that stands just before this Gospel in Matthew, the king's wedding feast (Mt 22:1--13).\""
problem = "Standing advisory from study-review iteration 0, restated unchanged because it is not cleared and this stage's entries replace the previous ones in evaluations/blocking-findings-v1.toml. The wedding feast does not stand just before this Gospel. Two pericopes intervene, as the study's own Gospel section says nine pages earlier (sections/10-each-element.tex: \"the tribute to Caesar (22:15--22), the Sadducees' question about the resurrection (22:23--33), and now the Pharisees\"). The research record is careful and says only that Gregory's homily is on \"the pericope that precedes this Gospel in Mt 22\" (research/scope.md 3.6). Nothing in the argument turns on it -- Gregory's contribution is correctly presented as doctrinal reception of the double commandment cited from Mk 12:30, not as exegesis of Mt 22:34--46 -- but the sentence contradicts the study elsewhere and a reader who follows the chapter will notice. The verse range itself is defensible: the tracked Wikisource Migne text heads Homily 38 \"LECTIO S. EVANG. SEC. MATTH. XXII, 1-13\", so 22:1--13 is that homily's own lection, although the parable runs to v. 14 as the study's own each-element section prints it."
required_result = "The sentence places Gregory's parable accurately in Matthew 22, for example \"the parable that opens the same chapter\" or \"the parable of the king's wedding feast earlier in Matthew 22\", without disturbing the correct statement that Gregory expounds the parable and cites the commandment from Mark."

[[advisories]]
stage = "study-review"
id = "STU-004"
severity = "advisory"
location = "sections/30-son-and-lord-of-david.tex, end of \"By the word of the Lord and the spirit of his mouth\" (PDF p. 23): \"The Trinitarian sense of the verse is the Fathers' reading and not a signal of the page.\""
problem = "Standing advisory from study-review iteration 0, restated unchanged because it is not cleared and this stage's entries replace the previous ones. The sentence tells the reader that the study has declined to press an inference from the Missal's typography. That register belongs to the audit record, where research/interpretations.md 2.5 already holds it, and not to the body: a constraint on what may be asserted is met by not asserting it (guidance/liturgy/roman-1962-propers.md, Evidence and Claim Discipline). It also leaves the paragraph arguing against itself, since the lower-case spiritu is introduced only to be set aside while the votive Mass's capital is offered as evidence of how the same book read the verse. This remains the one sentence of its kind in a study that is otherwise disciplined about stating findings rather than the restraint behind them, so it does not amount to the recurring habit the editorial standard treats as a failure."
required_result = "The paragraph states the typographic facts and the Fathers' reading of Ps 32:6 directly, without a sentence whose subject is what the study does or declines to conclude from the printing."

[[advisories]]
stage = "study-review"
id = "STU-005"
severity = "advisory"
location = "proper-components.toml, [[lanes]] key = \"son-and-lord-of-david\", authors list (as REVIEW_INPUTS component_contract carries it); against sections/30-son-and-lord-of-david.tex (PDF pp. 21 and 24)"
problem = "Standing advisory from study-review iteration 0, half cleared and restated for the remainder. The record half is now repaired: research/interpretations.md 2.6 no longer says Theodoret \"is not one of this reading's witnesses\" and instead states how he is used there (\"Theodoret is the second witness of that line here, and only of it ... He must not be credited with the distribution\"), which is accurate to the prose. The manifest half is not: the son-and-lord-of-david lane's authors list still reads Jerome, Augustine, John Chrysostom, Thomas Aquinas, Irenaeus, Basil the Great, Cassiodorus, Robert Bellarmine, with Theodoret absent, while the section names him twice and gives him substantive work (\"Theodoret of Cyrus names the same three relations lordship, providence and indwelling\", and again in \"The difficulties this confession must carry\", where he stands with Chrysostom against the distribution of Eph 4:6 among the Persons)."
required_result = "The lane record and the prose agree: Theodoret of Cyrus is added to the son-and-lord-of-david lane's authors in proper-components.toml, matching research/interpretations.md 2.6 as it now stands; or, alternatively, the three relations in that section are attributed to Chrysostom alone and Theodoret is left to the first reading, with 2.6 adjusted back to match."

[[advisories]]
stage = "study-review"
id = "STU-006"
severity = "advisory"
location = "proper-components.toml, the authors lists of [[lanes]] key = \"son-and-lord-of-david\" and key = \"just-judge-merciful-hearer\" (as REVIEW_INPUTS component_contract carries them); against sections/30-son-and-lord-of-david.tex (PDF pp. 23--24) and sections/40-just-judge-merciful-hearer.tex (PDF pp. 27, 29); and research/interpretations.md section 3"
problem = "Beyond the single omission STU-005 names, the lane author lists do not describe the sections as written, in the same direction each time (no declared name is undeveloped; developed names are missing). The son-and-lord-of-david lane omits Rupert of Deutz and William Durandus, although the section develops both: Rupert \"says that Daniel was so exalted by the vision that he not only foresaw Christ coming for our salvation but learnt beforehand the times of his coming (De divinis officiis XII.17)\", which is what carries that reading's Christological weight for the Offertory, and Durandus \"reads its second half as Christ reproving the Pharisees de infidelitate, quia non credebant ipsum esse Deum\", which supports its controlling claim about the Gospel's second half. research/interpretations.md 2.2 and 2.3 already record both for that reading, so only the manifest is out of step. The just-judge-merciful-hearer lane omits John Chrysostom, whom the section uses for the Epistle (\"the lowliness that Chrysostom calls 'the basis of all virtue' because 'all is of grace'\") and whom research/interpretations.md 3.2 and 3.3 already record as a principal witness of that reading; and it omits Thomas Aquinas, whom the section develops at the Offertory (\"prayer must be made with confidence of obtaining, and that confidence comes from God's mercy\", Super Philippenses c. 4, on 4:6) and credits by name in that reading's moral sense. Aquinas is the harder case, because research/interpretations.md section 3 does not name him among that reading's witnesses either, although the evidence itself is properly held and honestly labelled at research/scope.md 3.7 (\"Aquinas uses Dan 9:18 as doctrine on prayer; he does not expound Daniel\"), which is exactly how the study uses it. Nothing here is a false claim to a reader of the PDF; the declared records simply no longer make the correspondence inspectable, which is what the manifest and audit exist for."
required_result = "The lane records and the prose agree. Rupert of Deutz and William Durandus are added to the son-and-lord-of-david lane's authors; John Chrysostom and Thomas Aquinas are added to the just-judge-merciful-hearer lane's authors; and research/interpretations.md section 3 records Aquinas among that reading's witnesses with his locus (Super Phil. c. 4, on 4:6) and the source role scope.md 3.7 already gives him, doctrine on prayer rather than exegesis of Daniel. Alternatively, any name the repair chooses not to declare is removed from the prose that develops it."

[[advisories]]
stage = "study-review"
id = "STU-007"
severity = "advisory"
location = "sections/10-each-element.tex, \"Introit: the just God and the servant's plea\" (PDF p. 9): \"Three verses further on, in the strophe the antiphon passes over, the psalm prays Faciem tuam illumina super servum tuum (v. 135)\""
problem = "The offset is wrong on every reading available to the reader. The verses named in the sentences before are Ps 118:124 and the psalm verse Ps 118:1, and v. 135 is eleven verses after the first and a hundred and thirty-four after the second; counted from the antiphon's opening v. 137 it is two verses earlier, not three later. The rest of the sentence is exact and checkable -- v. 135 is the right verse, it does stand in the strophe Phe (vv. 129--136) that the antiphon passes over between v. 124 and v. 137, and it does carry the verb and construction the Offertory uses of the sanctuary, as research/scope.md 1.1a records. Only the numeral has no anchor, and a reader who counts finds nothing at the place the sentence sends him."
required_result = "The sentence locates Ps 118:135 by something a reader can check -- for example \"Two verses before the antiphon's own verse 137, in the strophe the antiphon passes over\" -- or drops the offset and keeps the strophe and the verse number, which already fix the place."

[[advisories]]
stage = "synthesis-review"
id = "SYN-007"
severity = "advisory"
location = "sections/concise/04-themes.tex, penultimate paragraph (PDF p. 4): \"Two habits of speech run through the whole of it. The first is the word ``one'': seven times in three verses of the Epistle, once in the Collect's te solum Deum, and once more in the Gospel, where the Lord of David's psalm sits at the right hand of the God whom the great commandment names.\""
problem = "The verse span is now right (SYN-002 is cleared), but two of the three sites the sentence counts are not occurrences of the word it announces. The Collect reads te solum Deum: solum is 'alone, only', not unus, and the 1962 Latin collated in propers/verified.md section 2 carries no unus anywhere in the prayer, which is why the 1861 English prints 'thee, the only true God' and the concise study's own map glosses it 'the one God'. The Gospel carries none either: I read Mt 22:34-46 in the tracked Clementine text (src/sources/bibles/clementine-vulgate/chapters/Matt/22.json) and the pericope has no unus, the only 'one' in the Douay of the passage being 'one of them, a doctor of the law' (v. 35) in an unrelated sense; and the clause the sentence offers in its place -- 'where the Lord of David's psalm sits at the right hand of the God whom the great commandment names' -- states an identification, not a word. So the paragraph opens by naming a habit of the appointed wording and then, at two of three sites, silently moves from the word to the theme. Only the Epistle's sevenfold unus is a count of a word; the second habit the same paragraph names, the plea to be heard, is described as a theme and is exact. Nothing in the argument turns on it and the paragraph's real point -- that the Mass keeps returning to the oneness of the God it asks to be loved -- is sound, which is why this does not block. I file it at the severity this leaf has fixed for the same class of textual slip, SYN-002 in this component and STU-007 in the study, both advisory and standing. The sentence is the concise study's own; the corresponding passage does not stand in the expansive study, so the slip enters at this derivation."
required_result = "The sentence counts as the word 'one' only what the appointed Latin carries -- the Epistle's sevenfold unus -- and names the Collect's te solum and the Gospel's identification of the one God for what they are, or else the whole habit is stated as a habit of thought rather than of wording, so that a reader who turns to the Missal's Collect and Gospel finds what the sentence sends him for."

[[advisories]]
stage = "synthesis-review"
id = "SYN-008"
severity = "advisory"
location = "sections/concise/10-commentary.tex, 'The voice in which this people prays', second paragraph (PDF p. 9): \"The Offertory is the one element where a disagreement touches the praying subject himself.\""
problem = "The paragraph eight lines above it reports a disagreement that touches the praying subject at least as directly. There Augustine hears the poor man of Ps 101 as Christ, head and body, 'Vox ergo una, quia caro una', and Cassiodorus declines to put the psalm in Christ's mouth and hears the poor of Christ instead -- a dispute precisely about whose voice the Alleluia is, which the same subsection then turns to account by giving the two answers to different readings. The Offertory's disagreement (Jerome allowing that a sinless Daniel joined himself to a sinful people out of humility, Augustine resting on 'My sins, and the sins of my people') is real and correctly reported, but it is not the only one of its kind in the formulary and the counter-example is printed on the same page. This is the third editorial superlative of the kind in this component: SYN-005 named the other two -- 'the one place in this formulary where two lines of exegesis run against each other' at Eph 4:6 and the Alleluia 'divid[ing] its witnesses more sharply than any other element' -- and both were repaired at iteration 1, leaving this one standing. Neither the expansive study nor research/interpretations.md section 3.6 claims uniqueness here; the study's comparison section lists six narrow disagreements without ranking them. No witness is misrepresented and nothing in the argument turns on it, which is why it does not block; it is filed at the severity SYN-005 fixed for the class."
required_result = "The sentence introduces the Offertory's disagreement without the uniqueness claim -- for example 'At the Offertory the disagreement touches the praying subject himself' -- or says what distinguishes it from the Alleluia's disagreement over whose voice prays, so that the two statements in the same subsection agree."
