[[advisories]]
stage = "homily-review"
id = "HOM-010"
severity = "advisory"
location = "sections/homily/90-note.tex, \"Relation to the reviewed readings\", the sentence beginning \"What joins them is not an editorial device but Saint John Chrysostom's reading of the Gospel's two halves\""
problem = "The note rests the join of the two carrying readings on Chrysostom's seventy-first homily on Matthew, \"where the question about the Christ follows from the commandment that names one God\". The commandment of the appointed pericope is Deut 6:5 as Mt 22:37 gives it, \"Thou shalt love the Lord thy God with thy whole heart and with thy whole soul and with thy whole mind\", and it names no \"one God\". The confession \"There is one God, and there is none other but He\" is Mark 12:32, which Chrysostom brings in expressly (\"But wherefore doth Matthew say that he asked, tempting Him, but Mark the contrary?\") and on which he then hangs the question (\"after having praised this man that said, that there is one God, He asks the question\"). I read the whole exposition in the tracked CCEL text of NPNF1 10, SHA-256 adb8f1c9a988c5050a20fb9fdbf75143dcb227e95e3dad2f560a63b757923648, at the lines the passage record passage.john-chrysostom.homiliae-in-matthaeum.ccel-web-2026-09-17.homily-71 bounds, and all three phrases the note credits to that homily stand there verbatim. The substance of the note's claim is therefore true and the guard it exists to satisfy is met: Chrysostom really does join the two halves in his own sequence, so the join is not an editorial construction wearing a Father's name. What is inexact is only which text carries \"one God\", in the one sentence whose whole work is to be exact about that. Nothing reaches a listener, because the spoken body is careful at the same point and says \"When Scripture says that there is one God\" without placing those words in today's Gospel."
required_result = "The sentence names the text Chrysostom actually attaches the question to -- the scribe's confession he takes from Mark, which Matthew does not print -- or drops \"that names one God\" and rests the join on Chrysostom's own sequence, so that the note's single justification for calling the join patristic rather than editorial is exact about the text it rests on."

[[advisories]]
stage = "homily-review"
id = "HOM-011"
severity = "advisory"
location = "sections/homily/10-homily.tex, fifth movement, the sentence \"Later, when the gifts are carried up, the Church borrows the words of Daniel, praying in exile for a desolate sanctuary and for the people that carries God's name\", read against sections/homily/90-note.tex, \"Texts quoted, and their route\""
problem = "The note says the Offertory antiphon \"is a compilation that no Douay verse renders, so the homily describes it and quotes no English of it\". The homily does quote no English of it, and the second half of the description is the antiphon's own matter: populum istum, super quem invocatum est nomen tuum. The first half is not. The antiphon reads illumina faciem tuam super sanctuarium tuum and stops there, and the clause quod desertum est -- the sanctuary's desolation -- is precisely one of the departures from the Vulgate that propers/verified.md records the compiler as having cut, both in section 7 under Construction and in the Offertory row of the appointed-text-against-Bible table. Read of Daniel's own prayer at Dan 9:17 the description is true, and the participle attaches most naturally to Daniel, so no listener is told anything false and the movement's argument -- that Daniel prays as one of a people -- rests on matter the antiphon does carry. Read as the note says it should be read, as a description of the antiphon, it restores a word the antiphon does not have, in a leaf that is otherwise exact about which words this Mass sings."
required_result = "Either the description keeps to what the antiphon carries -- the sanctuary and the people that bears God's name -- or the note states that what the fifth movement describes is Daniel's prayer in Daniel 9 and not the antiphon alone, so that the description and the note's account of it agree with propers/verified.md on what the compiler left out."

[[advisories]]
stage = "homily-review"
id = "HOM-012"
severity = "advisory"
location = "sections/homily/10-homily.tex, third movement, first paragraph (\"Now the second question, which looks at first like a change of subject\"), the two sentences beginning \"Chrysostom reads the two halves of this Gospel as one lesson\""
problem = "This paragraph carries the speech's structural turn from the commandment to the question, and it is the one place where the spoken line goes slack. The listener is given \"When Scripture says that there is one God\" as a premise with nothing to attach it to: those words are not in the Gospel he has just heard, and the speech never says where they stand. The sentence that follows is forty-three words with two parentheticals (\"he writes\", \"it is said\") wrapped round a quotation, and it then claims a consequence with \"and so\" from the unanchored premise, ending in \"the question that will not let anyone keep the commandment and lose him\", which asks a listener to hold two clauses in tension and resolve an implied \"both\" in the time it takes to say them. Three of the paragraph's five sentences are quotation or attribution, which is the nearest this homily comes to the assembled-from-quotations failure the criteria name; every other paragraph in the speech is markedly clearer and more concrete. The movement is not lost, because the next paragraph makes the same turn plainly and well (\"First we are told whom we must love with everything we have. Then we are shown who he is. The God of the great commandment has a face, and it is the face of the man asking the question\"), which is why this does not block."
required_result = "The hinge either gives the listener the confession Chrysostom is glossing in words an adult assembly can place -- that Israel was told the Lord its God is one Lord -- or states the join in the speech's own voice and keeps Chrysostom only for \"to confess Him also to be God\", so that the paragraph turns the argument at the pace and concreteness the rest of the speech keeps."

[[advisories]]
stage = "research-review"
id = "RES-018"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/57-seventeenth-after-pentecost/research/scope.md section 3.3 ('Direct ancient exegesis, Greek' row, line 654) and section 4.5 ('What each adds', lines 816-819); research/interpretations.md section 2.1 ('this attribute, which is owned to be the Son's') and section 2.2 (the Chrysostom In Eph. hom. 11 bullet, line 316)"
problem = "Standing advisory from research-review iteration 3, restated because it is not cleared and this stage's entries replace the previous ones in evaluations/blocking-findings-v1.toml. Both loci still print the NPNF1 13 English 'Now this they own to be an attribute of the Son' with Migne's Greek 'Kaitoi tou Huiou, touto einai phesin' in parentheses as its original. The Greek has the singular phesin, 'he says', whose subject is Paul, whom the homily introduces with phesi throughout; the English has a plural 'they own'. Section 3.3 still implies that the absence of a word for 'the Lord' is the only divergence between Migne and the NPNF, and interpretations section 2.1 still carries the English's passive 'is owned to be the Son's'. The controlling claim of reading 2 is unaffected -- under either text an attribute ascribed to the Son is here said of the Father and so cannot mark inferiority -- but a study that quotes the NPNF sentence and cites PG 62 for it would give Migne's Greek a subject it does not have."
required_result = "scope.md sections 3.3 and 4.5 record that PG 62 col. 80 reads phesin ('he says') where the NPNF English has 'this they own', and that the Greek text behind the NPNF was not identified for this sentence either; the NPNF sentence is no longer presented as a rendering of the quoted Greek (quote the English alone as the registered NPNF, or give the Greek with its own sense); interpretations.md section 2.1 is adjusted to match; the identification of 'this' with 'through all' stays labelled as the record's own inference."

[[advisories]]
stage = "research-review"
id = "RES-019"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/57-seventeenth-after-pentecost/research/scope.md section 9, 'Rights, quotation and publication bounds', the 'Patristic and medieval texts' bullet"
problem = "The rights bullet names Migne PL 25, 26 and 170, the ANF and NPNF volumes, the Cassiodorus and Augustine Latin, Wilson, Schuster and Gueranger. It names none of the three sources read on the second and third reentries whose original-language text the readings depend on and will quote: Chrysostom's Greek in Migne PG 62 col. 80 (scope 3.3, 4.5; interpretations 2.2), Theodoret's Greek in Migne PG 82 cols. 532-533 (scope 3.3, 4.5; interpretations 1.2, 2.2, 2.5), and Hilary's Latin in CSEL 22, Zingerle 1891, pp. 500-501 and 515 (scope 3.1, 4.11; interpretations 3.2, 3.3, where Hilary is a principal witness of reading 3). Section 6.2 marks the Hilary optical layer 'rights unresolved' and section 10 item 1 lists all three among unregistered witnesses citable in References, but neither states whether the underlying printings may be quoted in a publication. The three-document profile makes research/scope.md the record of 'unresolved evidence and rights', and the study's terminal rights boundary is drawn from it, so the study author is left either to derive the basis independently -- a second source of truth for a fact this repository holds once -- or to carry a quotation whose rights the leaf never recorded. The underlying facts are benign: the Hilary artifact record's own rights_basis states that the CSEL 22 printing is public domain in the United States by publication date and that only the Internet Archive OCR derivative's distribution grant is unestablished, and the 1860 and 1864 Migne volumes stand on the same footing as PL 25, 26 and 170 already listed. No reader is misled and nothing unlawful is proposed; the record is simply silent where the profile asks it to speak."
required_result = "scope.md section 9 states the publication rights basis for Migne PG 62 (1860), Migne PG 82 (1864) and CSEL 22 (Zingerle, 1891) alongside the PL volumes already listed, and distinguishes the public-domain underlying printings from the Internet Archive optical derivatives whose own grant is unestablished, so that the Greek of Chrysostom and Theodoret and the Latin of Hilary each carry a recorded basis before the study quotes them."

[[advisories]]
stage = "research-review"
id = "RES-020"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/57-seventeenth-after-pentecost/research/scope.md section 7.4, first bullet ('No traditional attribution for any of the four psalms is in the corpus's answer') and section 10 item 6; consequence in research/chronology-annotations.tex, the gradual macro"
problem = "The record establishes, correctly and at its own loci, that Ps 32 meets the exact criterion of the chronology corpus's own Davidic binding -- Douay Ps 32:1 'A psalm for David.' and Clementine 'Psalmus David.', which I confirmed in both tracked verse texts -- while falling outside that binding's scope (src/sources/chronology/bindings.yaml, first binding, scoped to Pss 33, 39, 70, 85, 94 and 97, whose note excludes only the anonymous, Sabbath and Korahite headings and does not mention Ps 32). The consequence reaches the reader: the Gradual's Date cell will carry only the critical-profile boundary 'Before c. 165 B.C.' with no traditional attribution, although the 1962 profile's page-2 rule asks that the responsibly sourced traditional attribution and chronology be foregrounded and expressly allows a Davidic attribution to carry David's sourced regnal era as a named reference point. The research filed a request to the corpus owner rather than acting, which is the right instinct, but the reason it gives -- that bindings.yaml is 'a shared corpus file that other publications' chronology records are computed from' -- overstates the blast radius as it applies here: no other chronology record in the repository reaches a Ps.32 locus (the seven tracked research/chronology.toml files were checked), so the tracked artifacts that would change are this leaf's two chronology files and the gated derived view src/sources/chronology/coverage.tsv. That is a real cross-owner change and not one this stage should make unilaterally mid-run, but it is a much smaller one than the stated reason implies, and the difference is what a maintainer needs in order to weigh the request."
required_result = "Either the corpus owner's correction is carried out under guidance/scripture-chronology.md section 15 -- Ps 32 added to the traditional-attribution binding's scope citing bible:douay-rheims:Ps.32.1 and the Clementine title, the corpus checks run, coverage.tsv rebuilt, and this leaf's research/chronology.toml and research/chronology-annotations.tex regenerated with tools/tpt proper-chronology -- or scope.md section 7.4 states the actual scope of the change (this leaf's two generated files and the derived coverage.tsv, no other publication's chronology record reaching Ps 32) so that the standing request in section 10 item 6 carries what the owner needs to decide."

[[advisories]]
stage = "study-review"
id = "STU-006"
severity = "advisory"
location = "research/interpretations.md section 3 (3.2 'Principal witnesses and their reasoning', the 3.3 element table's Offertory row, the 3.4 moral sense, and the lane's row in 'The three readings in brief'), against proper-components.toml [[lanes]] key = 'just-judge-merciful-hearer' and sections/40-just-judge-merciful-hearer.tex, 'Daniel's prayer and Daniel's people' (PDF p. 27) and that reading's moral sense (PDF p. 30)"
problem = "Standing advisory from study-review iterations 0, 2, 3, 4, 5 and 6, still uncleared at iteration 7 and restated because this stage's entries replace its previous ones in evaluations/blocking-findings-v1.toml. It stays advisory: the severity was decided when the defect was first seen and does not change because the round has come round again. proper-components.toml declares Thomas Aquinas among the just-judge-merciful-hearer lane's authors, and sections/40 develops him there -- 'prayer must be made with confidence of obtaining, and that confidence comes from God's mercy' (Super Philippenses c. 4, on 4:6, using Dan 9:18, PDF p. 27) -- and credits him by name in that reading's moral sense ('Ask mercy and not reward, and pray with confidence because of God's mercies and not your justifications (Aquinas)', PDF p. 30). research/interpretations.md section 3 names him at none of its four loci; I counted the occurrences in this dispatch's own read of the sealed bytes and 'Aquinas' appears zero times between the section 3 heading and the section 4 heading. The evidence itself is sound and I checked it independently this round, not merely the record of it: research/scope.md 3.7 gives the locus, the Dessain 1857 vol. 2 p. 398 route, and exactly the source role the study uses ('Aquinas uses Dan 9:18 as doctrine on prayer; he does not expound Daniel'), and I read the sentence in the tracked Dessain OCR -- 'Item debet esse cum fiducia impetrandi, et hoc ex Dei misericordia. (Dan. 9.) Neque enim in justificationibus nostris prosternimus preces ante faciem tuam, sed in miserationibus tuis multis' -- which is the study's claim exactly. The same section's 'three readings in brief' row for this lane also omits John Chrysostom, whom the manifest declares and whom 3.2 and the 3.3 Epistle row both carry, so the summary row is narrower than the section it summarises as well as narrower than the manifest. The author of iteration 7 again declined to repair it and said so plainly in research/production-review.md, which is the right call: research/interpretations.md is the research stage's reviewed file and editing it from author-study would be the silent revision of a reviewed upstream document. No record of the leaf claims the repair has been made. No reader of the PDF meets a false claim; what is broken is the correspondence between the manifest, the interpretation audit and the section, which those records exist to make inspectable."
required_result = "research/interpretations.md section 3 records Thomas Aquinas among the just-judge-merciful-hearer reading's witnesses, with his locus (Super Philippenses c. 4, on 4:6) and the source role research/scope.md 3.7 gives him, and his name in the 3.3 Offertory row, the 3.4 moral sense and the lane's row in 'The three readings in brief'; that same summary row also names John Chrysostom, whom 3.2 and the 3.3 Epistle row already carry. Its owner is the research stage, whose file this is; the author-study stage cannot clear it and should not try. Until that owner does it, no record of the leaf may state that it has been done."

[[advisories]]
stage = "study-review"
id = "STU-017"
severity = "advisory"
location = "research/interpretations.md section 2.3, the `alleluia` row ('For Augustine the one who prays is the eternal Word made poor, \"In principio erat Verbum … Verbum caro factum est\", head and body ... [A] Augustine En. 101 s. 1, 1–2'), and research/scope.md section 3.5, the 'Direct ancient exegesis, Latin' row; against sections/30-son-and-lord-of-david.tex, 'The other texts as confession', the Alleluia paragraph (PDF pp. 23–24)"
problem = "The iteration-7 repair of STU-016 is sound and I verified it at its source, but it has left the interpretation audit behind the section it audits. sections/30 now quotes Augustine's sentence in full -- 'Christus et Ecclesia, utrumque unus: sed Verbum et caro non utrumque unum; Pater et Verbum utrumque unum; Christus et Ecclesia utrumque unus, unus quidam vir perfectus' -- and builds the reading's central Christological distinction on the two middle members of it, that the Father and the Word are one in substance while the Word and the flesh are not one substance and are nonetheless one person. Neither research record carries those two members. research/scope.md 3.5 quotes the sentence only as 'Christus et Ecclesia utrumque unus … unus quidam vir perfectus', eliding exactly the clause the second reading now turns on; research/interpretations.md 2.3 gives the Alleluia row a different Augustine quotation altogether ('In principio erat Verbum … Verbum caro factum est'), which the study no longer prints at that place. The evidence behind the study is not missing and that is why this does not block: the locus is registered and its reading recorded (scope.md 6.2 has 'En. in Ps. 101 s. 1, 1–3, tracked Migne text, part 11, re-hashed on the second reentry and s. 1, 2 re-read for the exact wording'), and I read the whole sentence myself in that tracked artifact (SHA-256 8b9dafef805536c0d4551fc427a6b7060fc1655326b0d1e14507b317dfcf711f) and found the study's transcription exact, down to the punctuation. What is missing is the transcription in the records, so the leaf's audit of the second reading does not show the clause on which that reading's hardest doctrinal sentence rests, and a later reader checking the section against the audit will not find it there. This is the same records-correspondence class the leaf has repeatedly weighed and fixed at advisory (STU-006, STU-008, HOM-001, SYN-009). Its owner is the research stage; the author-study stage was right not to edit a reviewed upstream file and, as with STU-006, cannot clear this one either."
required_result = "research/scope.md section 3.5 quotes Augustine's sentence at En. in Ps. 101, s. 1, 2 including the members the study uses ('sed Verbum et caro non utrumque unum; Pater et Verbum utrumque unum'), and research/interpretations.md section 2.3's Alleluia row records that clause and the unus/unum distinction the second reading draws from it, in place of or beside the 'In principio erat Verbum' quotation the study no longer prints there, so that the interpretation audit shows the evidence for the reading's Christological distinction at the locus it already registers."

[[advisories]]
stage = "synthesis-review"
id = "SYN-020"
severity = "advisory"
location = "sections/concise/01-inventory.tex, the note under the page-1 map (PDF p. 1): \"The Mass is of the second class, in green with Gloria and Credo; it says one set of orations and admits no commemoration.\""
problem = "The clause states the rubric as a universal property of the Mass, and as a rule it is false: a Sunday of the second class does admit the commemoration of a second-class feast. The expansive study says so and supplies the reason it does not arise here -- \"The calendar's commemoration of Saints Eustace and Companions on that day gives way to the Sunday, since a Sunday of the second class admits no commemoration but that of a feast of the same class (Rubricae generales 111 b; Rubricae generales Missalis 434 b)\" (sections/00-opening.tex) -- and propers/verified.md 2 records the same bound, adding that none is due on 20 September 2026. The concise clause is that sentence truncated at exactly the point where the qualification begins, so the only rubrical statement page 1 makes is true of this occurrence and wrong as a rule, in a document whose profile makes the occurrence rule a sourced identity claim. The wording arrived from the required_result of SYN-018 at iteration 3, which asked only that the note stop appearing to contradict the three orations printed above it; it was not asked to state the commemoration rule without its bound, and the concise's own scope appendix cites RG 111 b and RGMR 434 b without restating it."
required_result = "The page-1 note either restores the study's qualification -- no commemoration but that of a feast of the same class, and none due on 20 September 2026 -- or ties the clause explicitly to this occurrence, so that page 1 states no false rubric while still reading against the three orations in the map above it."

[[advisories]]
stage = "synthesis-review"
id = "SYN-021"
severity = "advisory"
location = "sections/concise/10-commentary.tex, \"The voice in which this people prays\", first paragraph (PDF p. 8): \"Augustine supplies that third reading a second sentence on the same verse ---si me extollo, longe fis; si me humilio, inclinas aurem tuam ad me---\""
problem = "That sentence is Augustine's gloss on Ps 101:3, not on the Alleluia's Ps 101:2, and the paragraph's \"the same verse\" can only mean the Alleluia's, which the paragraph opens by calling one verse long and which Bellarmine is then cited on in the next clause. In the leaf's own tracked Migne text (src/sources/works/augustine/enarrationes-in-psalmos/editions/latin-migne-corpus-corporum-wikisource-web-2026-09-05/artifacts/wikisource-part-11-latin-text/enarrationes-part-11.txt) Enarr. in Ps. 101, s. 1, 3 is headed \"[vers. 2, 3.]\": it quotes \"Exaudi, Domine, orationem meam, et clamor meus ad te perveniat\" and glosses it \"in geminatione affectus petentis est\", and only then quotes \"In quacumque die tribulor, inclina aurem tuam ad me\" and answers \"Tribulor enim deorsum; tu autem es sursum: si me extollo, longe fis; si me humilio, inclinas aurem tuam ad me\" -- the sentence is the gloss on v. 3's inclina aurem tuam ad me. research/scope.md 3.5 records it correctly, \"on v. 3\". The imprecision is not the concise's invention: the accepted expansive study carries it in its own words at sections/40-just-judge-merciful-hearer.tex, \"Augustine hears in its second verse humility inclining God's ear\", with the section locus (s. 1, 3) right beside it. It is advisory and not blocking because the edition's own lemma covers vv. 2-3 together, the section locus printed in the References (\"Ps 101, s. 1, 2-3\") is correct, and nothing doctrinal or comparative in the third reading turns on which of the two verses the sentence answers; but the document elsewhere is exact about which words this Mass sings, and here it is not."
required_result = "The clause places the sentence where Augustine puts it -- in the same section of the same sermon, on the verse that follows the Alleluia's, rather than on the Alleluia's own verse -- and, if the expansive study is reopened for any other reason, its corresponding sentence is brought into agreement with research/scope.md 3.5 in the same way."

[[advisories]]
stage = "synthesis-review"
id = "SYN-022"
severity = "advisory"
location = "sections/concise/90-apparatus.tex, References, \"Liturgical books and Bibles\", the Douay--Rheims entry (PDF p. 11)"
problem = "The themes section states that the lawyer \"is answered with Deut 6:5 and, unasked, with Lev 19:18 'like to this'\" (sections/concise/04-themes.tex, PDF p. 3). The Douay--Rheims entry lists Deut 6:5 among its loci but not Lev 19:18, so of the two Old Testament texts named in one sentence only one can be checked against a listed locus, and Leviticus appears nowhere in the References. propers/verified.md 6 records both as embedded citations of the pericope (Deut 6:5 at v. 37, Lev 19:18 at v. 39), so the claim is verifiable from the leaf's records; it is the apparatus that is asymmetric. The accepted expansive study's References carry the same omission."
required_result = "Lev 19:18 is added to the Douay--Rheims loci beside Deut 6:5, so that both Old Testament texts the body names in that sentence are locatable from the References."

[[advisories]]
stage = "visual-review"
id = "VIS-001"
severity = "advisory"
location = "57-seventeenth-after-pentecost-synthesis.pdf p. 2 (every full-width explanatory and event row of the Scriptural Date and Location dossier) and 57-seventeenth-after-pentecost.pdf pp. 33-34 (the same rows in the terminal dossier); set by \\dossierprose and \\dossierevent in src/claude/liturgy/roman-rite/1962/propers/temporal/57-seventeenth-after-pentecost/format.tex"
problem = "The spanning explanatory and event rows are set in \\scriptsize (about 8pt on an 11pt base) across 0.98\\linewidth, which yields lines of roughly 115-125 characters -- by some margin the smallest type on the longest measure anywhere in the three documents. The glyphs themselves are clean and legible at print size, and the leaf documents the reduction as deliberate deviation D2 taken so that all seven dossiers stand on the single physical page the concise contract fixes for page 2, which the 1962 profile's own clause on changing measurements permits. But the profile fixes that spanning row at 0.92\\linewidth, and the leaf widened rather than narrowed it, so the one setting in the production that most taxes the eye is also the one that moved furthest from the fixed measure in the direction that hurts reading."
required_result = "The dossier's full-width explanatory and event rows carry no more than about 100 characters per line at their present size -- for example by returning the spanning row to the profile's 0.92\\linewidth, or by indenting it under the summary tier -- while the complete seven-dossier inventory still occupies exactly physical page 2 of the concise PDF, page 2 still carries nothing else, and no evidence is dropped from any dossier. If no such setting keeps all seven dossiers on one page, the present measurement stands and the reason is recorded beside deviation D2 in format.tex."

[[observations]]
stage = "homily-review"
location = "research/interpretations.md section 1.2, the John Chrysostom In Mt. hom. 71 bullet (\"Chrysostom reads the second as the way that leads to the first and by which the first is established\")"
note = "The interpretation audit gives the establishing to the second commandment, where the accepted expansive study reads both clauses of Chrysostom's sentence of the second and says the opposite way round -- \"the love of neighbour opens the road to the love of God, and the love of God in its turn re-establishes the love of neighbour ... Each commandment holds the other up\" (sections/20-whole-heart-one-body.tex) -- and the spoken body follows the study (\"Each holds the other up\"). I read the sentence and its four proof texts myself in the tracked CCEL NPNF1 10 text and the study's reading is the better one: Jn 3:20 and 1 Tim 6:10 run from the failure of charity to the loss of God, Ps 13:1 and Jn 14:15 run back from God to the neighbour. So the homily is supported and I raise nothing against it; what is out of step is the audit, whose owner is the research stage. I record it rather than route it because the speech's own use is sound, because this is the records-correspondence class the leaf has repeatedly weighed at advisory (STU-006, STU-017), and because a repair here would reopen research review and every document below it for a sentence that misleads no reader."

[[observations]]
stage = "homily-review"
location = "sections/homily/90-note.tex, \"Length and pace\", the third pace figure (\"and at 110 words a minute just under thirteen\")"
note = "The arithmetic is right (1,429 words at 110 w.p.m. is 12.99 minutes) and the disclosure is the honest thing to print, but it is the one figure in the note that falls outside the profile's default 10-12 minute scope. The two figures the note leads with, 120 and 130 words a minute, put the speech at 11.9 and 11.0 minutes and inside it. I record this rather than raise it because the profile sets an unhurried pace as the standard and 110 w.p.m. is slower than unhurried, so the speech is within scope on the note's own leading figures; a reader who meets only the third figure could think otherwise."

[[observations]]
stage = "study-review"
location = "sections/90-apparatus.tex, References: the entries for St Augustine (Enarrationes in Psalmos, 'on Ps 32, I, 6, 12, and II, s. 2, 5, 8, 15-18', PDF p. 37), Rupert of Deutz (De divinis officiis XII.17-18) and St Robert Bellarmine (on Pss 32:6, 12; 75:9-13; 101:2; 118:1, 124, 137) (PDF p. 38)"
note = "Three reference loci still reach past what the study actually cites, unchanged in count from the last round. The body uses Augustine on Ps 32 at I, 12 and at II, s. 2, 5 and II, s. 2, 15-18, but nowhere at I, 6 or at II, s. 2, 8; it uses Rupert at XII.17 only, XII.18 being his Eighteenth Sunday, whose Gospel is Mt 23 and which reaches no claim of the study; and it uses Bellarmine on Ps 32:6 and 12, Ps 75, Ps 101:2 and Ps 118:124 and 137, but nowhere on Ps 118:1, which research/scope.md 3.1 records as read. Each is one item wider than the claims it supports rather than an unused source, which is ordinary scholarly latitude and does not reach my criteria as a finding; I record it again because a reader checking the apparatus against the body will find the mismatch."

[[observations]]
stage = "study-review"
location = "sections/80-date-location.tex, the Date column of the Offertory dossier ('Historical setting: Duration: all these nations shall serve the king of Babylon seventy years', PDF p. 33) and of the Gospel dossier ('Event - No narrated-event date in the chronology corpus', PDF p. 34)"
note = "Two of the seven Date cells still report a state of the chronology corpus rather than a date. The Offertory's historical-setting group prints a duration quoted from Jeremias instead of a date for the prayer in the first year of Darius the Mede that the same dossier's Location cell identifies, though its composition group does give B.C. 570-536; the Gospel's narrated event -- the controversy in the Temple, which the Location cell dates by nothing but Mt 21:23 -- has no date in the corpus and says so. Both are exactly what research/chronology-annotations.tex generates from research/chronology.toml, the study is forbidden to hand-author over them, and sections/90-apparatus.tex discloses the limit honestly, so this is not a defect of the study. I record it because these two cells are carried unchanged into the concise companion's physical page 2, where the Date column is the point of the sheet, and because the gap is in the shared chronology corpus rather than in this leaf."

[[observations]]
stage = "synthesis-review"
location = "generation-metadata.tex, the shared revision record printed at the foot of the concise study (PDF p. 12): \"Last revised (UTC): 2026-09-19T08:05:00Z\""
note = "The stamp is ahead of the record it dates. generation-metadata.tex was last written at 2026-09-19T07:28:33Z and the reviewed artifact (derive-synthesis-0004) was built at 07:32Z, and 08:05Z had not yet arrived when this review read the document (07:46Z). The same pattern runs back through the iterations -- 20:40Z, 21:30Z, 01:30Z, 07:10Z -- all round figures rather than the moment of writing, so the field reads as an estimate rather than a finalization timestamp. The record is shared by all three artifacts and is not the concise study's to own alone, which is why this is recorded rather than routed."

[[observations]]
stage = "synthesis-review"
location = "sections/concise/10-commentary.tex, the six subsection titles and the way the three readings are named across them (PDF pp. 5-10)"
note = "The themes page introduces the readings as \"The first\", \"The second\" and \"The third\", and the commentary then never uses those ordinals, naming them instead by descriptive tags that vary from unit to unit: \"the reading anchored in the commandment\" and \"the reading of the whole heart and the one body\" and \"the reading of the one body\"; \"the reading of David's son and David's Lord\" and \"the reading of David's Lord\"; \"the reading of the humbled people\", \"the reading anchored in the Introit\" and, in the first two units, no tag at all but \"Read from the Introit instead\". Nothing is misattributed and a careful reader can map every tag, so this is not raised as a finding; it is the one place where following three alternatives across six cross-proper questions costs the reader more than the interleaving itself does."

[[observations]]
stage = "visual-review"
location = "57-seventeenth-after-pentecost-homily.pdf, document catalog"
note = "The homily's PDF catalog declares /PageMode/UseOutlines but carries no /Outlines object, so a viewer that honours the page mode opens an empty bookmark pane; the study and the concise study both carry real outline trees alongside the same page mode. The homily is five pages and needs no bookmarks to be navigable, and my lane's criteria ask for navigation only of the study, so this is noted rather than raised."

