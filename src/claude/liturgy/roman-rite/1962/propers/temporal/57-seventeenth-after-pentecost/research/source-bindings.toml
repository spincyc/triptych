context = "Gregory the Great, Homily 38 on the Gospels (on Matt 22:1-13, the wedding garment), read in the tracked Latin at sections 9-10: the wedding garment is charity, woven like cloth on two beams, the love of God and of neighbour; the neighbour is loved with a measure (sicut teipsum), God without measure (ex toto), 'quia ille veraciter Deum diligit, qui sibi de se nihil relinquit'; the doubly-dyed scarlet of the tabernacle as love of God that does not neglect the neighbour and love of neighbour that does not abandon the contemplation of God. Doctrinal exposition of the double commandment (cited from Mark 12:30) in the homily on the pericope that precedes this Sunday's Gospel in Matthew 22; not a commentary on Matt 22:34-46 itself. On reentry (2026-09-18) the tracked text was re-hashed and searched with the tolerant method of research/scope.md section 5.1: no homily on Matt 22:34-46 and none of its distinctive wording; at 20.11, on the two tunics of Luke 3:11, Gregory uses the second commandment, 'Diliges proximum tuum sicut teipsum', to show that he loves his neighbour less who does not share even what he needs, a moral reuse that the earlier literal search missed."

