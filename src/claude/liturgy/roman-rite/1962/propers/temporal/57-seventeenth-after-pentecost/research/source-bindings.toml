context = "Loci (stated here because the work's locus pattern admits only Galatians): Interpretatio epistolae ad Ephesios, heading at physical line 38335 of the layer; c. 4, vv. 1-6, PG 82 cols. 532-533. The registered whole-volume optical layer of Migne PG 82, which the library files under Theodoret's Galatians commentary but which carries his commentary on Ephesians. Re-fetched on the research stage's second reentry (2026-09-18) and matched (8,475,812 bytes), and used only to locate Eph 4:1-6: its Greek recognition is corrupt, so every word used was read in the Greek on the Internet Archive page images of the same item, leaves n288-n289 (cols. 531-534; unregistered, hashes in research/scope.md section 6.2). Direct Greek exegesis of the Epistle: the memory of Paul's bonds rouses to virtue; a way of life fitting the calling; one grace, 'one spring sends out the different streams'; one Spirit, one body, one hope of the resurrection and the kingdom; 'one' set everywhere to join the Church in concord; above all, through all and in all read as lordship, providence and indwelling, not distributed among the Persons (research/scope.md sections 3.3, 4.5)."

