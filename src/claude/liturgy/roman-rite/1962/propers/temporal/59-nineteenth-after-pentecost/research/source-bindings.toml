# Publication-local record of how this leaf's research used the reusable source
# library. It supplements, and does not replace, propers/verified.md (the text
# control), research/scope.md (reception matrix, witness register, negative
# results and bounds) and research/interpretations.md.
#
# States describe what the research stage of run a27462e34ec9c09a did with each
# record on 2026-09-30. `inspected` means this stage read the bound locus itself
# in the bytes named; `verified` is claimed only for the 1962 page images and the
# 1962 orations passage collated word for word. Remote whole volumes were
# fetched whole and matched to their registered digests before any page was
# read; nothing remote was retained. The five chronology sources are bound at
# `cataloged` only, because a fresh delivery did not reproduce the registered
# bytes (research/scope.md section 7.3).
#
# No `negative-search` or `searched` binding appears: every literal search this
# research reports used ad hoc tolerant matching, not a canonical replayable
# mode. research/scope.md section 5 states each negative with its exact bound.
#
# Iteration 1 of the same research stage (2026-09-30) added the loci it read in
# answer to research review RES-001 and RES-002: the Ordo Missae numbers and the
# Trinity Preface re-read on the facsimile with their passage records; Hilary on
# Pss 118 and 140 (PL 9 page images, CSEL 22 layer); Chrysostom on Ps 137 (PG 55
# layer); Bellarmine on Pss 137 and 140; Aquinas on Eph 4:23-28 (tracked
# facsimile); and the Expositiones in Psalmos printed under Athanasius's name on
# Pss 77, 104 and 118 (PG 27 layer). The remote volumes reused from iteration 0
# (1962 facsimile, PL 9, PL 26, PG 55, CSEL 22) were re-hashed and matched their
# registered digests before any page was read again; the PG 27 layer was
# fetched and matched in iteration 1. Nothing remote was retained.
#
# Iteration 2 (2026-09-30), in answer to research review RES-008, added
# Augustine's Quaestiones evangeliorum I.31 on Mt 22:2-9 (and II.30 on Lk
# 14:21, 23) in the tracked Latin transcription of PL 35, collated on the page
# images of PL 35 cols. 1329 and 1343. PL 35 had no registered route: this
# stage fetched the Internet Archive's copy of a Google scan whole, hashed it,
# registered it (work, edition, remote scan) under
# src/sources/works/jacques-paul-migne/patrologia-latina-volume-35/, and
# retained the two pages it read as a tracked facsimile excerpt. It also bound
# Augustine's Sermo 112 (NPNF Sermon LXII) on Lk 14 and re-read Rabanus's
# catena on Mt 22:8-10.
#
# A post-acceptance correction of 2026-09-30, made outside run
# a27462e34ec9c09a in answer to its standing advisory STU-012
# (research/production-review.md), bound the four Challoner Douay-Rheims
# verse-text artifacts from which the three documents print or quote their
# scriptural English (Psalms, Matthew, Ephesians, 1 Timothy), at the Douay loci
# the documents' References cite in those books, and added 104.1 to the NPNF1-8
# Enarrationes binding. Their states describe what that correction did: each
# artifact's SHA-256 was recomputed and matched, every bound locus was read in
# the tracked bytes, and the fingerprints were taken from tools/source-library.

