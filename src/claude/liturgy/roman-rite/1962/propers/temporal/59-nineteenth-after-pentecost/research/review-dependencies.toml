# Controlling external evidence this research reads outside its leaf and that
# registered source bindings do not already seal (research/source-bindings.toml
# seals every bound record and its ancestry). Declared on 2026-09-30 in the
# research stage of run a27462e34ec9c09a and revised in its iteration 1. Every
# path is a tracked record under src/ in the roman-1962 family or the
# provider-neutral source library.
#
# Rights, ledgers, standing and joins
# - missale-romanum-1962-facsimile-rights-v1.toml: the rights holding (17 U.S.C.
#   103(b) with a public-domain antecedent) on which every Latin element's
#   publication basis rests (propers/verified.md; research/scope.md section 9).
# - roman-1962-proper-latin-provenance-v1.toml: the ledger whose four
#   pentecost-19 rows are relied on, and whose missing scriptural rows are
#   reported (research/scope.md section 9).
# - roman-1962-proper-translations-v1.toml: the same-family overlay whose four
#   pentecost-19 rows say the English is rights-withheld; research/scope.md
#   section 9 answers them.
# - author-standing-v1.toml: the standing of every author the readings name and
#   every carrying author (research/interpretations.md section 5).
# - source-containment-v1.toml and commentary/passage-commentary-index.yaml: the
#   joins behind the holdings and mappings research/scope.md sections 3 and 5
#   report for every appointed locus, and behind the lead-by-lead disposition
#   of research/scope.md section 3.13. In iteration 2 this stage added the
#   containment entry for Patrologia Latina 35, which it registered to read
#   Augustine's Quaestiones evangeliorum on a page image; the PL 35 records
#   themselves are bound in research/source-bindings.toml.
# - commentary/formulary-loci.yaml: the liturgical commentators' element
#   comparison (research/scope.md sections 2.1 and 3.12).
# - calendars/roman-1962/propers.yaml and rubrics.yaml: the computation inputs
#   research/context.md adopts for occurrence and precedence (finding aids).
# - bibles/clementine-vulgate/chapters: the complete biblical contexts read, the
#   whole-Clementine literal search for the Introit antiphon's phrases
#   (research/scope.md sections 1.2, 3.1 and 5.1), and the chapter files the
#   chronology computation opens to resolve the appointed loci.
#
# The Scripture chronology corpus and the data its computation opens
# research/scope.md section 7.3 records an audit-hook trace of
# `tools/tpt proper-chronology record --check` and `annotations --check` for this
# leaf. Every date the concise study's page 2 will print is read from the five
# authored corpus files below, and the computation validates its canon and
# deuterocanon numbering against the edition data after them on every run. The
# engine's v3 contract seals only the computation code and the identity
# registry, so these are declared here.
# - chronology/profiles.yaml: the evidence profiles (catholic-comprehensive-v1,
#   catholic-traditional-v1, catholic-critical-v1) that decide which claims the
#   record keeps and which it prefers.
# - chronology/composition.yaml: the composition claims (Matthew, Ephesians, the
#   psalms' critical boundary) the record prints, and, since the post-acceptance
#   revision of 2026-09-30, the two catholic-critical-v1 claims for Matthew and
#   Ephesians that the record carries as profile comparisons. Those are selected
#   by this leaf's own research/chronology-profile-comparisons.toml, which the
#   computation also opens; being a record of this leaf, sealed with its
#   research and fingerprinted in research/chronology.toml, it is not an
#   external owner and is not listed below.
# - chronology/events.yaml: the narrated-event claims; that none reaches
#   Mt 22:1-14 is why the Gospel's Date cell reports no event date
#   (research-pending, the corpus's unauthored default).
# - chronology/bindings.yaml: the joins of claims to appointed loci and to their
#   cited sources, which decide each element's status and relation labels.
# - chronology/gaps.yaml: its authored undated-in-tradition row for the whole
#   Psalter, which the record reaches for all five psalm elements under
#   catholic-traditional-v1 (research/scope.md section 7.2).
# - the Clementine ebible-latvuc book index: the canon (book identity and order)
#   against which every appointed locus is resolved.
# - the Douay-Rheims challoner-gutenberg-1581 edition: its verse texts witness
#   the Vulgate arrangement, and its deuterocanon-numbering table is the
#   concordance the computation loads and validates.
# - the Revised Version ebible-eng-rv edition and the World English Bible
#   Catholic catholic-eng-web-c edition: the verse texts that witness the Greek
#   and World-English-Catholic arrangements that concordance is validated
#   against.
#
