[[advisories]]
stage = "research-review"
id = "RES-010"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/research/interpretations.md § 2.4, Allegorical bullet, clause 'the servants are prophets and apostles sent by one God (Irenaeus; Gregory; Hilary; Chrysostom)'"
problem = "This is the same class of defect as RES-009, in the bullet repaired for it: a joint citation credits an author with a clause he does not state. Hilary, In Matth. XXII.4 (scope § 3.6, PL 9 page image), makes the servants sent to call the apostles ('Servi missi, qui invitatos vocarent, apostoli sunt'). Those sent again are 'apostolici … viri et successores apostolorum'. He names no prophets. 'Sent by one God' is Irenaeus's anti-Marcionite argument (Adv. haer. IV.36.5), not a claim Gregory, Hilary or Chrysostom makes. § 2.6 and § 2.2 state the four identifications correctly, but a study that follows the § 2.4 bullet would say that Hilary reads the servants as prophets."
required_result = "Cite each clause to the author who states it. For example: 'the servants are prophets and then apostles (Gregory § 3; Chrysostom, with John and the Son between them), sent by the one God who called those of old (Irenaeus); for Hilary, the apostles and then apostolic men, their successors'."

[[advisories]]
stage = "research-review"
id = "RES-011"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/research/scope.md § 3.6, Augustine Sermo 95 bullet, sentence 'in iteration 2 a search of both sermons whole (lines 37787–38310 and 39237–39464) for … found only …'"
problem = "I replayed the stated terms over the stated line ranges of the sealed NPNF1-6 text (ccel-text-ce371798). The sentence omits several of the hits the search returns. Omitted in Sermo 90: 'be invited as one who is to remain' (line 38048), 'thou hast now come invited hither' (38122, 38125) and 'when the Jews tempted Him' (38184, the tribute money). Omitted in Sermo 95: 'The Master of the house who had invited them' and 'that Bridegroom invited them' (39291, 39293), 'the Master of the house Who had invited him' (39338) and 'ye have been invited through me … He invited you by my ministry' (39347–39348). None of these identifies the refusing guests or the highways, so the record's conclusion stands. But the 'found only' list is not what the search returns, and a replay contradicts it."
required_result = "State the result so that a replay matches it. Either list every hit, or say that no hit identifies the refusing guests or the highways and name the kinds of hits there are (the hearers and the guests as invited; the servants who invite good and bad; the Jews in the Stephen and tribute passages; the Israelites and Pharaoh's magicians)."

[[advisories]]
stage = "study-review"
id = "STU-008"
severity = "advisory"
location = "sections/00-opening.tex, lines 66-71 ('... and St Gregory the Great, St Augustine and St Jerome carry it: the garment is charity, the new man put on, Christ himself, shown in the Epistle's plain acts and asked for in the Communion's wish') and lines 79-82 ('St Augustine and St Gregory carry it, with St John Chrysostom's address to those who have partaken of the mysteries: the feast is the Church now, at the Lord's table, ...')"
problem = "The colon construction gives each reading's composite answer to the Fathers named before it. For the first reading, Gregory (Hom. 38, 9) and Augustine (Sermo 90, 5-6) say the garment is charity. Jerome (In Matth. III, PL 26 cols. 160-161; In Eph. II, col. 508) says it is the Lord's precepts kept, the garment of the new man, and that the new man is Christ. None of the three calls the wedding garment 'Christ himself'; that is Aquinas (Super Matth. c. 22) and, of the Epistle's garment, Schuster. None joins the garment to the Epistle's four acts or to the Communion's wish. research/interpretations.md section 1.3 marks those joins as editorial synthesis, and the reading's own body presents them that way ('Put together, ...'). For the third reading, 'at the Lord's table' is Augustine's phrase. The same reading says Gregory's feast is the banquet of the Word and of Scripture and that he 'does not name the altar at all'. The body attributes every step exactly, so a reader is corrected a few pages later. But the opening's summary implies consensus by proximity (guidance/liturgy/roman-1962-propers.md, 'Evidence and Claim Discipline'), and the concise page 1 and themes are likely to reuse it. This is advisory, not blocking: unlike STU-003, no named witness holds a view contrary to the claim."
required_result = "The opening states each reading's answer so that each named witness is credited only with what he says. For example: Gregory and Augustine make the garment charity; Jerome makes it the garment of the new man, woven of the Lord's precepts kept, and names the new man Christ; the reading finds that garment shown in the Epistle's acts and asked for in the Communion's wish. For the third reading, the present-Church feast is credited to Augustine and Gregory, with 'the Lord's Table' given to Augustine or replaced by a term both of them use."

[[advisories]]
stage = "study-review"
id = "STU-009"
severity = "advisory"
location = "(a) sections/40-feast-that-now-is.tex, subsection 'Commanded and asked, healed and held', second paragraph, 'The Postcommunion names the sacrament's work in the language of medicine, medicinalis operatio'; (b) sections/10-each-element.tex, opening paragraph, 'four are the Church's own composition' and 'The Introit's antiphon and the three orations are not Scripture'; (c) psalm citations outside the appointed verses, e.g. Ps 34:3 and 90:15 (sections/05-appointed-texts.tex and 10-each-element.tex), Ps 137:3 (10-each-element.tex) and Ps 138:16 (20-wedding-garment.tex)"
problem = "(a) The Latin names only 'tua ... medicinalis operatio'. The study's own Postcommunion note (sections/05-appointed-texts.tex) says that 'These thy mysteries' is the 1861 translator's addition. research/scope.md section 1.3 records that the formulary nowhere names the Eucharist; the Eucharistic reading is Schuster's (p. 174), and the next sentence rightly gives it to him. As a textual statement in the study's own voice, the sentence gives the prayer a word it does not contain. (b) The antiphon's source is unidentified. The scope appendix says it 'was not traced to a scriptural or liturgical source'. research/scope.md sections 3.1 and 5.1 record that no Old Latin or Roman psalter was searched, that Schuster suggests the Itala, and that the continuation calls the antiphon a cento of Scripture; neither claim was adopted. Calling it 'the Church's own composition' and 'not Scripture' asserts an origin the evidence leaves open. (c) sections/05-appointed-texts.tex says that 'Psalms are cited in the Missal's numbering, with the Hebrew numbering in parentheses', and guidance/liturgy/roman-1962-propers.md requires the common modern number in parentheses where it differs. The five appointed psalms carry it in the map, loci and dossiers, but Pss 34, 90, 137:3 and 138 are cited without it, so a reader using a modern Bible finds another psalm."
required_result = "(a) Say that the Postcommunion names God's work, 'tua ... medicinalis operatio', in the language of medicine, and keep the Eucharistic reading as Schuster's. (b) Describe the antiphon as standing in no verse of the Vulgate, with its source unidentified, and make no claim about its origin; the orations may remain the Church's composition. (c) Give the Hebrew number in parentheses at least at the first citation of each psalm outside the formulary (Ps 34:3 (35:3), Ps 90:15 (91:15), Ps 138:16 (139:16)), or restate the convention so that it is true of the text."

[[advisories]]
stage = "study-review"
id = "STU-010"
severity = "advisory"
location = "sections/90-apparatus.tex, References, 'St Hilary of Poitiers ... Tractatus super Psalmos, in Ps. 118, Aleph 11-12, and in Ps. 140, 3-4', and 'Appendix: Scope and Qualifications', 'Reception' paragraph ('... and with them Rupert of Deutz, William Durandus and Berno of Reichenau, expounded a Mass that shared ... but read another Gospel'); claim at sections/10-each-element.tex, Offertory subsection ('St Augustine and St Hilary read the verse with the Vulgate's past')"
problem = "guidance/liturgy/roman-1962-propers.md ('References and metadata') requires References to carry exact loci sufficient to verify each claim. The Offertory subsection makes a claim about Hilary's lemma of Ps 137:7. Its evidence is Tract. in Ps. 137, section 15, in the CSEL 22 layer (research/scope.md section 3.7), but References names Hilary's tractates only on Pss 118 and 140. The scope appendix attributes the other Gospel to the Masses of Rupert, Durandus and Berno. research/scope.md sections 2.1 and 3.12 hold that evidence (De divinis officiis XII.19-20; Rationale VI.136; Libellus, PL 142), but neither the clause nor References gives a work or locus for any of the three."
required_result = "Add Hilary, Tractatus super Psalmos, in Ps. 137, 15 (CSEL 22, ed. Zingerle, p. 748), to References, or drop Hilary from the sentence. Give the three commentators' works and loci in References, or in the scope clause itself."

[[advisories]]
stage = "study-review"
id = "STU-011"
severity = "advisory"
location = "research/interpretations.md: the table 'The three readings in brief', last column of the feast-that-now-is row; section 3.2, Schuster paragraph ('His standing (Blessed) lets him be one of two carrying authors beside Augustine'); section 4.2, 'Carrying authors' row; section 5, feast-that-now-is row; section 2.3, the introit, collect, epistle and gradual rows (Honorius); section 2.5, 'Alternative' ('Honorius reads the shared chants as the song of a people returning from exile ..., which would make the formulary a homecoming rather than a mission'); section 4.2, 'The Gradual's lifted hands' row ('(Augustine; Honorius)')"
problem = "After the iteration-1 repairs of STU-001 and STU-003, the study, its comparison table and proper-components.toml name Augustine, Gregory and Chrysostom as the carrying authors of feast-that-now-is. They record Schuster's own reading of this Gospel's banquet as the heavenly one (The Sacramentary III, p. 173; research/scope.md section 3.6) beside the claim, and they cite Honorius only in the element-by-element section. The canonical interpretation record still names Schuster a carrying author and does not set his p. 173 reading beside the controlling claim in section 3.1. It still keeps Honorius in the call-to-the-nations reading, and section 2.5 still credits him with an implication about 'the formulary', the attribution STU-001 removed from the study. The concise components (concise-overview, concise-themes, concise-commentary) and both homily components declare research/interpretations.md as a reference, so their authors will read the superseded statements. research/production-review.md reports the divergence as an upstream research item. It is advisory because the reviewed study and manifest are correct, and the record discloses the divergence."
required_result = "At the next research revision of this leaf, research/interpretations.md agrees with the reviewed study. Augustine, Gregory and Chrysostom are the carrying authors of feast-that-now-is. Schuster is a supporting witness for the Gradual, Secret and Postcommunion, with his p. 173 heavenly-banquet reading recorded beside the controlling claim. Honorius is removed from the call-to-the-nations rows and alternative, and no sentence credits him with a reading of the formulary; his shared-element readings stay in research/scope.md section 3.12."

[[advisories]]
stage = "study-review"
id = "STU-012"
severity = "advisory"
location = "research/source-bindings.toml: the only Douay-Rheims binding is artifact.english-college-of-douay.douay-rheims-bible.challoner-gutenberg-1581.psalm-numbering-ee3c7757 (role 'context'); the binding of artifact.augustine.enarrationes-in-psalmos.english-npnf8-ccel-web-2026-09-05.ccel-npnf108-text-d6841950, loci ['77.1-2', '118.4-5', '137.10-11', '140.2-4']"
problem = "guidance/liturgy/roman-1962-propers.md says that research/source-bindings.toml 'declares which registered sources this publication used, in which role, at which loci'. The study prints the Challoner Douay as its scriptural English for all six scriptural elements and quotes further verses. The registered verse-text artifacts it draws on (verse-text-21-psalms-578f023d, verse-text-47-matthew-dd0ba183, verse-text-56-ephesians-10c79be0, and verse-text-61-1-timothy-1f76a59e for 1 Tim 2:8) are bound in no role. The study also quotes the NPNF1-8 English of Enarr. in Ps. 104, 1 in the Alleluia subsection of sections/10-each-element.tex and in sections/40-feast-that-now-is.tex, but that binding's loci omit Ps 104. research/review-dependencies.toml seals the whole Challoner edition directory, so change detection for review is not lost, and the gap is advisory. The source library's use and impact queries will still not list this publication for those artifacts. research/production-review.md reports both gaps as upstream research items."
