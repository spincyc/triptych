[[advisories]]
stage = "homily-review"
id = "HOM-001"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/sections/homily/10-homily.tex, opening sentence of the Cross movement (line 96), 'St Augustine hears that verse differently', which follows the movement break after Hilary's quotation of Mt 25:35, 'I was hungry, and you gave me to eat' (line 92)"
problem = "In speech, 'that verse' first attaches to the last verse the assembly heard, Mt 25:35, and not to the Gradual's Ps 140:2, which was quoted four sentences earlier. The listener recovers the referent only in the next sentence, when Augustine's 'evening sacrifice' arrives. A reader can look back on the page; a listener cannot, so the new movement opens on a misreference across a pause."
required_result = "Name the verse when the movement begins, for example 'St Augustine hears the Gradual's verse differently: first of Christ, ...', and leave the rest of the movement unchanged."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "The Cross movement now opens 'St Augustine hears the Gradual's verse differently', naming the verse at the movement break; the rest of the movement is unchanged. Augustine's reading of that verse of the Passion was re-read at Enarr. in Ps. 140, 3 (NPNF1-8, tracked CCEL text, digest re-matched)."

[[advisories]]
stage = "homily-review"
id = "HOM-002"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/sections/homily/10-homily.tex, second movement (lines 41-42), 'This morning's Collect asks for the freedom to do it'"
problem = "The spoken body has to be speakable verbatim at any Mass of this Sunday. 'This morning' is false when the homily is preached at a later Mass of the day, such as an afternoon or evening Sunday Mass, so the preacher would have to edit the text before reading it. The note gives the occasion only as the Mass of 4 October 2026, with no hour."
required_result = "Use a time-neutral phrase such as 'Today's Collect' or 'The Collect of this Mass', and leave the rest of the sentence unchanged."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "'This morning's Collect' now reads 'Today's Collect'; the rest of the sentence is unchanged. With HOM-001's added word the spoken body is still 1,453 words by the rule recorded in research/production-review.md, which the note states."

[[advisories]]
stage = "homily-review"
id = "HOM-003"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/sections/homily/90-note.tex, 'Exact loci' (lines 53-55: 'Gradual, Ps 140:2', 'Communion, Ps 118:4-5', '... and Ps 138:16') and References, Douay-Rheims entry (line 73: 'Ps 118:4-5; 138:16; 140:2')"
problem = "guidance/liturgy/roman-1962-propers.md ('Source Records and Text Control') requires psalm citations in the Missal's Vulgate numbering, 'with the common modern number in parentheses where it differs'. All three psalms the note cites differ: they are 119, 139 and 141 in the modern numbering. The note gives none of the modern numbers and does not say its numbering is the Vulgate's. A reader who checks Ps 140:2 or Ps 138:16 in a modern Bible finds other psalms. The note's own Augustine reference does give the other numbering ('Psalms CXIX and CXLI in that translation'), so the apparatus is inconsistent with itself. STU-009(c) records the same class of defect in the study as advisory."
required_result = "Add the modern number in parentheses at the first citation of each psalm in the note and in the References: Ps 140:2 (141:2), Ps 118:4-5 (119:4-5) and Ps 138:16 (139:16)."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Checked against the Douay-Rheims psalm-numbering table (artifact psalm-numbering-ee3c7757: Vulgate 118, 138 and 140 are Hebrew 119, 139 and 141, verses unchanged). The note's Exact loci and its Douay-Rheims References entry now give Ps 140:2 (141:2), Ps 118:4-5 (119:4-5) and Ps 138:16 (139:16) at first citation."

[[advisories]]
stage = "research-review"
id = "RES-010"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/research/interpretations.md § 2.4, Allegorical bullet, clause 'the servants are prophets and apostles sent by one God (Irenaeus; Gregory; Hilary; Chrysostom)'"
problem = "This is the same class of defect as RES-009, in the bullet repaired for it: a joint citation credits an author with a clause he does not state. Hilary, In Matth. XXII.4 (scope § 3.6, PL 9 page image), makes the servants sent to call the apostles ('Servi missi, qui invitatos vocarent, apostoli sunt'). Those sent again are 'apostolici … viri et successores apostolorum'. He names no prophets. 'Sent by one God' is Irenaeus's anti-Marcionite argument (Adv. haer. IV.36.5), not a claim Gregory, Hilary or Chrysostom makes. § 2.6 and § 2.2 state the four identifications correctly, but a study that follows the § 2.4 bullet would say that Hilary reads the servants as prophets."
required_result = "Cite each clause to the author who states it. For example: 'the servants are prophets and then apostles (Gregory § 3; Chrysostom, with John and the Son between them), sent by the one God who called those of old (Irenaeus); for Hilary, the apostles and then apostolic men, their successors'."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Verified on the tracked witnesses: Gregory, Hom. 38, 3 (Wikisource transcription: et prius prophetas, et postmodum apostolos fecit); Chrysostom, Hom. 69 (NPNF1-10, lines 39016-39023: by all the prophets, by John, by the Son, and after the Ascension by Peter and those with him); Irenaeus, Adv. haer. IV.36.5 (ANF 1 OCR layer: He who has called us everywhere by the apostles is He who called those of old by the prophets); Hilary, In Matth. XXII.4 (PL 9 OCR layer, lines 82594-82599: Servi missi ... apostoli sunt; those sent again apostolici viri et successores apostolorum). research/interpretations.md section 2.4 now cites each clause to its author, in the wording the study's allegorical sense already uses; sections 2.2 and 2.6 already stated the identifications correctly, and no other sentence of the research records carried the joint clause. One correction to the finding's problem: Hilary's sentence does name the prophets, as those whose invitation the apostles recall (quos invitaverant prophetae), but not as the servants, so its conclusion stands."

[[advisories]]
stage = "research-review"
id = "RES-011"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/research/scope.md § 3.6, Augustine Sermo 95 bullet, sentence 'in iteration 2 a search of both sermons whole (lines 37787–38310 and 39237–39464) for … found only …'"
problem = "I replayed the stated terms over the stated line ranges of the sealed NPNF1-6 text (ccel-text-ce371798). The sentence omits several of the hits the search returns. Omitted in Sermo 90: 'be invited as one who is to remain' (line 38048), 'thou hast now come invited hither' (38122, 38125) and 'when the Jews tempted Him' (38184, the tribute money). Omitted in Sermo 95: 'The Master of the house who had invited them' and 'that Bridegroom invited them' (39291, 39293), 'the Master of the house Who had invited him' (39338) and 'ye have been invited through me … He invited you by my ministry' (39347–39348). None of these identifies the refusing guests or the highways, so the record's conclusion stands. But the 'found only' list is not what the search returns, and a replay contradicts it."
required_result = "State the result so that a replay matches it. Either list every hit, or say that no hit identifies the refusing guests or the highways and name the kinds of hits there are (the hearers and the guests as invited; the servants who invite good and bad; the Jews in the Stephen and tribute passages; the Israelites and Pharaoh's magicians)."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Replayed with tools/source-library search (case-folded literal within each physical line) over the NPNF1-6 text ccel-text-ce371798, SHA-256 re-matched, keeping the hits inside lines 37787-38310 and 39237-39464: 23 lines, including every hit the finding lists and two substring matches it does not (ways inside always, line 39261; nation inside explanation, line 39360); Gentile, highway and streets return nothing. research/scope.md section 3.6 now states that no hit identifies the refusing guests or the highways and lists every hit by line, grouped by kind; the conclusion is unchanged. A dated note in the record's opening names the replay's method and claims no searched binding."

[[advisories]]
stage = "study-review"
id = "STU-008"
severity = "advisory"
location = "sections/00-opening.tex, lines 66-71 ('... and St Gregory the Great, St Augustine and St Jerome carry it: the garment is charity, the new man put on, Christ himself, shown in the Epistle's plain acts and asked for in the Communion's wish') and lines 79-82 ('St Augustine and St Gregory carry it, with St John Chrysostom's address to those who have partaken of the mysteries: the feast is the Church now, at the Lord's table, ...')"
problem = "The colon construction gives each reading's composite answer to the Fathers named before it. For the first reading, Gregory (Hom. 38, 9) and Augustine (Sermo 90, 5-6) say the garment is charity. Jerome (In Matth. III, PL 26 cols. 160-161; In Eph. II, col. 508) says it is the Lord's precepts kept, the garment of the new man, and that the new man is Christ. None of the three calls the wedding garment 'Christ himself'; that is Aquinas (Super Matth. c. 22) and, of the Epistle's garment, Schuster. None joins the garment to the Epistle's four acts or to the Communion's wish. research/interpretations.md section 1.3 marks those joins as editorial synthesis, and the reading's own body presents them that way ('Put together, ...'). For the third reading, 'at the Lord's table' is Augustine's phrase. The same reading says Gregory's feast is the banquet of the Word and of Scripture and that he 'does not name the altar at all'. The body attributes every step exactly, so a reader is corrected a few pages later. But the opening's summary implies consensus by proximity (guidance/liturgy/roman-1962-propers.md, 'Evidence and Claim Discipline'), and the concise page 1 and themes are likely to reuse it. This is advisory, not blocking: unlike STU-003, no named witness holds a view contrary to the claim."
required_result = "The opening states each reading's answer so that each named witness is credited only with what he says. For example: Gregory and Augustine make the garment charity; Jerome makes it the garment of the new man, woven of the Lord's precepts kept, and names the new man Christ; the reading finds that garment shown in the Epistle's acts and asked for in the Communion's wish. For the third reading, the present-Church feast is credited to Augustine and Gregory, with 'the Lord's Table' given to Augustine or replaced by a term both of them use."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Verified: Gregory, Hom. 38, 9 (tracked Wikisource transcription: Quid ergo debemus intelligere nuptialem vestem, nisi charitatem?) and 38, 11 and 14 (Scripturae sacrae epulis; divini Verbi epulas; the homily has no word for the altar); Augustine, Sermo 90, 1 and 6 (NPNF1-6, tracked CCEL text: the Lord's Table; the wedding garment is charity); Jerome, In Matth. III, PL 26 col. 160 D, and In Eph. II, col. 508, on the registered PL 26 scan re-fetched and matched to its digest, read on page images (praecepta sunt Domini ... novique hominis efficiunt vestimentum; Iste quippe est novus homo). The opening now says that Gregory and Augustine make the garment charity and Jerome the garment of the new man, made of the Lord's precepts kept, with the new man Christ, and gives the reading the joins to the Epistle's acts and the Communion's wish; for the third reading Augustine and Gregory say the feast is the Church now, the Lord's Table for Augustine and the banquet of the Word for Gregory. No 'carry it:' sentence remains in the opening. The third reading's allegorical sense, which gave the Lord's Table and the banquet of the Word to both jointly, now gives each his own, and research/interpretations.md section 3.4 follows. The concise themes already credited each witness with his own clause; the concise page 1 is SYN-001."

[[advisories]]
stage = "study-review"
id = "STU-009"
severity = "advisory"
location = "(a) sections/40-feast-that-now-is.tex, subsection 'Commanded and asked, healed and held', second paragraph, 'The Postcommunion names the sacrament's work in the language of medicine, medicinalis operatio'; (b) sections/10-each-element.tex, opening paragraph, 'four are the Church's own composition' and 'The Introit's antiphon and the three orations are not Scripture'; (c) psalm citations outside the appointed verses, e.g. Ps 34:3 and 90:15 (sections/05-appointed-texts.tex and 10-each-element.tex), Ps 137:3 (10-each-element.tex) and Ps 138:16 (20-wedding-garment.tex)"
problem = "(a) The Latin names only 'tua ... medicinalis operatio'. The study's own Postcommunion note (sections/05-appointed-texts.tex) says that 'These thy mysteries' is the 1861 translator's addition. research/scope.md section 1.3 records that the formulary nowhere names the Eucharist; the Eucharistic reading is Schuster's (p. 174), and the next sentence rightly gives it to him. As a textual statement in the study's own voice, the sentence gives the prayer a word it does not contain. (b) The antiphon's source is unidentified. The scope appendix says it 'was not traced to a scriptural or liturgical source'. research/scope.md sections 3.1 and 5.1 record that no Old Latin or Roman psalter was searched, that Schuster suggests the Itala, and that the continuation calls the antiphon a cento of Scripture; neither claim was adopted. Calling it 'the Church's own composition' and 'not Scripture' asserts an origin the evidence leaves open. (c) sections/05-appointed-texts.tex says that 'Psalms are cited in the Missal's numbering, with the Hebrew numbering in parentheses', and guidance/liturgy/roman-1962-propers.md requires the common modern number in parentheses where it differs. The five appointed psalms carry it in the map, loci and dossiers, but Pss 34, 90, 137:3 and 138 are cited without it, so a reader using a modern Bible finds another psalm."
required_result = "(a) Say that the Postcommunion names God's work, 'tua ... medicinalis operatio', in the language of medicine, and keep the Eucharistic reading as Schuster's. (b) Describe the antiphon as standing in no verse of the Vulgate, with its source unidentified, and make no claim about its origin; the orations may remain the Church's composition. (c) Give the Hebrew number in parentheses at least at the first citation of each psalm outside the formulary (Ps 34:3 (35:3), Ps 90:15 (91:15), Ps 138:16 (139:16)), or restate the convention so that it is true of the text."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "(a) Verified on the Latin (tua ... medicinalis operatio, propers/verified.md) and Schuster, The Sacramentary III, p. 174 (tracked 1927 OCR, line 10890). The Postcommunion subsection now says the prayer names God's work in the language of medicine, with the Eucharistic reading kept as Schuster's; the third reading's opening, which said 'the sacrament's healing work', now says God's healing work, which Schuster reads of the Eucharist, and research/interpretations.md section 3.1 follows. (b) The opening of Each Element in Its Setting now says that the three orations are the Church's composition and that the Introit's antiphon stands in no verse of the Vulgate and its source is unidentified; the Introit subsection's 'no single verse of Scripture' now reads 'of the Vulgate'. (c) Checked against the Douay-Rheims psalm-numbering table and verse texts (Ps 34:3, 90:15, 138:16): Ps 34:3 (35:3) and Ps 90:15 (91:15) at their first citation in The Appointed Texts and Ps 138:16 (139:16) at its first in the first reading; the convention now says the Hebrew numbering follows at each psalm's first citation and in the loci. Ps 137:3 is a later citation of the Offertory's psalm, first cited in the map as Ps 137:7 (138:7). The concise study cites only the formulary's psalms, and its convention was already true."

[[advisories]]
stage = "study-review"
id = "STU-010"
severity = "advisory"
location = "sections/90-apparatus.tex, References, 'St Hilary of Poitiers ... Tractatus super Psalmos, in Ps. 118, Aleph 11-12, and in Ps. 140, 3-4', and 'Appendix: Scope and Qualifications', 'Reception' paragraph ('... and with them Rupert of Deutz, William Durandus and Berno of Reichenau, expounded a Mass that shared ... but read another Gospel'); claim at sections/10-each-element.tex, Offertory subsection ('St Augustine and St Hilary read the verse with the Vulgate's past')"
problem = "guidance/liturgy/roman-1962-propers.md ('References and metadata') requires References to carry exact loci sufficient to verify each claim. The Offertory subsection makes a claim about Hilary's lemma of Ps 137:7. Its evidence is Tract. in Ps. 137, section 15, in the CSEL 22 layer (research/scope.md section 3.7), but References names Hilary's tractates only on Pss 118 and 140. The scope appendix attributes the other Gospel to the Masses of Rupert, Durandus and Berno. research/scope.md sections 2.1 and 3.12 hold that evidence (De divinis officiis XII.19-20; Rationale VI.136; Libellus, PL 142), but neither the clause nor References gives a work or locus for any of the three."
required_result = "Add Hilary, Tractatus super Psalmos, in Ps. 137, 15 (CSEL 22, ed. Zingerle, p. 748), to References, or drop Hilary from the sentence. Give the three commentators' works and loci in References, or in the scope clause itself."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Verified: Hilary, Tract. in Ps. 137, 15, in the registered CSEL 22 OCR layer re-fetched and matched to its digest, physical lines 37995-38030, lemma extendisti manus tuas: et saluum me fecit dextera tua, and on the Internet Archive's page images of the same item, leaves n771-n772: section 15 stands on pp. 742-743 (the first round's p. 748, which the finding's own required result also gives, is the OCR layer's misreading of p. 743's running head, as the independent re-review REV-C-001 found; the real p. 748 is in the tractate on Ps 138); and in the tracked layers, digests re-matched, Rupert, De divinis officiis XII.19-20 (PL 170, lines 23487-23560), Durandus, Rationale VI.136 (Lyon 1612, lines 17130-17159) and Berno's Libellus (PL 142, lines 85800-85822), each giving these chants the paralytic's Gospel. The study's References now carry Hilary's tractate on Ps 137, 15 (CSEL 22, ed. Zingerle, pp. 742-743) and the three commentators' works and loci, and their bindings say so; the scope clause is unchanged. The concise study makes neither claim."

[[advisories]]
stage = "study-review"
id = "STU-011"
severity = "advisory"
location = "research/interpretations.md: the table 'The three readings in brief', last column of the feast-that-now-is row; section 3.2, Schuster paragraph ('His standing (Blessed) lets him be one of two carrying authors beside Augustine'); section 4.2, 'Carrying authors' row; section 5, feast-that-now-is row; section 2.3, the introit, collect, epistle and gradual rows (Honorius); section 2.5, 'Alternative' ('Honorius reads the shared chants as the song of a people returning from exile ..., which would make the formulary a homecoming rather than a mission'); section 4.2, 'The Gradual's lifted hands' row ('(Augustine; Honorius)')"
problem = "After the iteration-1 repairs of STU-001 and STU-003, the study, its comparison table and proper-components.toml name Augustine, Gregory and Chrysostom as the carrying authors of feast-that-now-is. They record Schuster's own reading of this Gospel's banquet as the heavenly one (The Sacramentary III, p. 173; research/scope.md section 3.6) beside the claim, and they cite Honorius only in the element-by-element section. The canonical interpretation record still names Schuster a carrying author and does not set his p. 173 reading beside the controlling claim in section 3.1. It still keeps Honorius in the call-to-the-nations reading, and section 2.5 still credits him with an implication about 'the formulary', the attribution STU-001 removed from the study. The concise components (concise-overview, concise-themes, concise-commentary) and both homily components declare research/interpretations.md as a reference, so their authors will read the superseded statements. research/production-review.md reports the divergence as an upstream research item. It is advisory because the reviewed study and manifest are correct, and the record discloses the divergence."
required_result = "At the next research revision of this leaf, research/interpretations.md agrees with the reviewed study. Augustine, Gregory and Chrysostom are the carrying authors of feast-that-now-is. Schuster is a supporting witness for the Gradual, Secret and Postcommunion, with his p. 173 heavenly-banquet reading recorded beside the controlling claim. Honorius is removed from the call-to-the-nations rows and alternative, and no sentence credits him with a reading of the formulary; his shared-element readings stay in research/scope.md section 3.12."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Checked against the reviewed study (sections/40-feast-that-now-is.tex, 30-call-to-the-nations.tex, 50-comparison.tex) and proper-components.toml, and Schuster against the tracked 1927 OCR of The Sacramentary III (Introit p. 171, Collect pp. 171-172, Gradual p. 172, Gospel, Offertory, Secret and Communion p. 173, Postcommunion p. 174). research/interpretations.md: the reading table, section 4.2 and section 5 name Augustine, Gregory and Chrysostom as the carrying authors of feast-that-now-is; section 3.1 records Schuster's heavenly-banquet reading of the Gospel (p. 173) beside the controlling claim; sections 3.1, 3.2 and 5 make him a supporting witness, cited on the Introit, Collect, Gradual, Offertory, Secret, Communion and Postcommunion as section 3.3 cites him, and section 3.2 names the Gradual, Secret and Postcommunion as the three he reads in this reading's direction. Honorius leaves the introit, collect, epistle and gradual rows of section 2.3, the lifted-hands row of section 4.2 and the call-to-the-nations row of section 5; the alternative of section 2.5 is now Gregory's moral reading of the highways, which the study's comparison and section 4.3 already call the second reading's alternative, beside the controlling reading of the four Fathers for whom the highways are the nations and of Augustine for whom they are the Gentiles' teachings. In the lifted-hands row of section 4.2 Augustine is credited only with the whole Christ's prayer to the end of the world, and the people on the road is marked as editorial synthesis; the study's comparison table still credits the road to Augustine, an open item for the study's next revision recorded in research/production-review.md. No sentence credits Honorius with a reading of the formulary; his shared-element readings stay unchanged in research/scope.md section 3.12."

[[advisories]]
stage = "study-review"
id = "STU-012"
severity = "advisory"
location = "research/source-bindings.toml: the only Douay-Rheims binding is artifact.english-college-of-douay.douay-rheims-bible.challoner-gutenberg-1581.psalm-numbering-ee3c7757 (role 'context'); the binding of artifact.augustine.enarrationes-in-psalmos.english-npnf8-ccel-web-2026-09-05.ccel-npnf108-text-d6841950, loci ['77.1-2', '118.4-5', '137.10-11', '140.2-4']"
problem = "guidance/liturgy/roman-1962-propers.md says that research/source-bindings.toml 'declares which registered sources this publication used, in which role, at which loci'. The study prints the Challoner Douay as its scriptural English for all six scriptural elements and quotes further verses. The registered verse-text artifacts it draws on (verse-text-21-psalms-578f023d, verse-text-47-matthew-dd0ba183, verse-text-56-ephesians-10c79be0, and verse-text-61-1-timothy-1f76a59e for 1 Tim 2:8) are bound in no role. The study also quotes the NPNF1-8 English of Enarr. in Ps. 104, 1 in the Alleluia subsection of sections/10-each-element.tex and in sections/40-feast-that-now-is.tex, but that binding's loci omit Ps 104. research/review-dependencies.toml seals the whole Challoner edition directory, so change detection for review is not lost, and the gap is advisory. The source library's use and impact queries will still not list this publication for those artifacts. research/production-review.md reports both gaps as upstream research items."
required_result = "At the next research revision, bind the Challoner verse-text artifacts the study prints or quotes, with their loci and a role such as 'study-text', and add '104.1' to the NPNF1-8 binding's loci. Validate the file with tools/source-library validate."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "research/source-bindings.toml now binds, in role translation-control (study-text is not a declared binding role; translation-control is the role sibling leaves give these artifacts) and states cataloged, acquired, inspected, the Challoner verse-text artifacts of Psalms (578f023d), Matthew (dd0ba183), Ephesians (10c79be0) and 1 Timothy (1f76a59e), the four from which the study, concise study and homily print or quote Douay English, found by matching the documents' text against every verse file of the edition. Their loci are the Douay loci the study's References cite in those books, of which the concise study's and homily's are subsets; each SHA-256 was re-matched, each locus read, and each fingerprint taken from tools/source-library fingerprint. 104.1 is added to the NPNF1-8 Enarrationes binding, read at Psalm CV section 1, lines 52659-52675, against the quotations in the study and concise study. tools/source-library validate passes, and source-library uses now lists this leaf for all five. The References also cite the Douay at 1 Par 15:3; 16:1, 7-8 and Rom 13:14, where the documents print no Douay English; those two artifacts are left unbound."

[[advisories]]
stage = "synthesis-review"
id = "SYN-001"
severity = "advisory"
location = "sections/concise/02-overview.tex, Allegorical row, clause 'The garment is charity, which the Bridegroom himself wore (Gregory; Augustine)' (physical page 1)"
problem = "The parenthesis credits both Fathers with the whole clause, including its reason. That reason is Gregory's: the Bridegroom himself had charity when he came to the wedding at which he joined the Church to himself (Hom. in Ev. 38, 9: 'quia hanc in se conditor noster habuit, dum ad sociandae sibi Ecclesiae nuptias venit'). Augustine, in Sermo 90 (NPNF1-6, sections 5-6 and 9), makes the garment charity, puts it on 'to do honour to the Bridegroom', 'in honour of the union', and sets the Bridegroom's prayer for his enemies before the guest as the pattern. He does not say that the Bridegroom wore the garment. The study's own allegorical sense in sections/20-wedding-garment.tex and research/interpretations.md section 1.4 give this clause to Gregory alone. The component's header comment also says that each witness is named beside the clause he states and no other. This is advisory, like STU-008 and RES-010, because Augustine holds no view contrary to the clause."
required_result = "Cite each clause to the Father who states it. For example: 'The garment is charity (Gregory; Augustine), which the Bridegroom himself wore (Gregory), or ...'. Keep the row otherwise unchanged, so that page 1 still holds the map and exactly four sense rows."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Verified: Gregory, Hom. 38, 9 (tracked transcription: quia hanc in se conditor noster habuit, dum ad sociandae sibi Ecclesiae nuptias venit); Augustine, Sermo 90, 5-6 (NPNF1-6) makes the garment charity, put on to do honour to the Bridegroom, and does not say the Bridegroom wore it. The row now reads 'The garment is charity (Gregory; Augustine), which the Bridegroom himself wore (Gregory)'; the rebuilt aux file still puts the map and all four sense markers on page 1."

[[advisories]]
stage = "synthesis-review"
id = "SYN-002"
severity = "advisory"
location = "sections/concise/10-commentary.tex: 'The evening sacrifice', last paragraph ('At a Mass celebrated with incense the priest says the Gradual's verse again ... (Ordo Missae, no. 1037)', page 10); 'Many called, few chosen', third paragraph ('the Gradual that the priest says again over the altar at a Mass with incense ... the Secret whose words the Placeat repeats', page 10) and last paragraph ('The Mass that began with God promising to hear his people from any tribulation ends by asking to cleave to his commandments always', page 11); compare sections/concise/04-themes.tex, the Gradual paragraph (page 3) and the Offertory-Secret and Communion-Postcommunion paragraphs (page 4)"
problem = "The commentary restates textual observations that the Themes pages already make. The priest's saying of Ps 140:2 as he incenses the altar at the Offertory appears three times (themes page 3; commentary page 10, twice). The Secret's and the Placeat's shared 'oculis tuae maiestatis' is stated in the themes and invoked again in the commentary. The themes' closing sentence, 'The Mass that began with God promising ... ends with a prayer to hold to his commandments semper', returns almost word for word as the commentary's penultimate sentence. The three-document profile asks that the page-5 commentary 'deepen and compare the earlier movement instead of repeating it', and the document is already at its 12-page ceiling. This is advisory because each repetition is short and true and none misleads."
required_result = "Change the commentary, not pages 3-4, whose extent is fixed. Where a reading needs an observation the Themes pages already give, refer back to it in a clause rather than restating it. For example, reduce the Ordo Missae no. 1037 sentence in 'The evening sacrifice' to the clause the third reading needs. Also rewrite the closing of 'Many called, few chosen' so that it does not repeat the themes' 'The Mass that began ...' sentence."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "Checked against pages 3-4 of the built concise study. In 'The evening sacrifice' the Ordo Missae no. 1037 sentence is reduced to a clause on the Offertory; in 'Many called, few chosen' the third reading's prayers are named without restating the incensing or the Placeat's words; and the sentence that repeated the themes' 'The Mass that began ...' is removed. Pages 3-4 keep their extent and the concise study its twelve pages."

[[advisories]]
stage = "synthesis-review"
id = "SYN-003"
severity = "advisory"
location = "sections/concise/04-themes.tex, last paragraph ('each developed at length in the expansive study with four senses of its own', page 4); sections/concise/90-apparatus.tex, 'Relation to the expansive study' (page 11); synthesis.tex and main.tex, \\propertitle first field"
problem = "The concise's body sends the reader to 'the expansive study'. That is a term from the production contract, and the reader has not been told what it names. The scope appendix identifies the companion only as 'The Nineteenth Sunday after Pentecost'. The concise prints the same title on its own page 1, because both entrypoints open with \\propertitle{The Nineteenth Sunday after Pentecost}{Dominica decima nona post Pentecosten}. A reader holding the concise is therefore told that the full argument is in a work carrying the title on the page in front of him. In print, only main.tex's fourth \\propertitle field distinguishes the study: 'The wedding garment, the call to the highways, and the evening sacrifice: a study of the proper in three readings'."
required_result = "Identify the companion so that a reader can tell it from the concise. For example, call it 'the full study' in the body. In the scope appendix, name it by its distinguishing subtitle, or by its catalogue label 'Full PDF'. Leave the extent of pages 3-4 unchanged."
resolution = "repaired"
resolution_date = "2026-09-30"
resolution_note = "The themes now send the reader to 'the full study', and the scope appendix's 'Relation to the full study' names it as the Full PDF subtitled The wedding garment, the call to the highways, and the evening sacrifice: a study of the proper in three readings, the fourth title field of main.tex. Pages 3-4 keep their extent. The homily note's 'expansive study' also reads 'full study'."

