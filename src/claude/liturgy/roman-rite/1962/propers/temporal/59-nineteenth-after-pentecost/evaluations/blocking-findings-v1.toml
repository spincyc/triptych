# the 'carry it' sentence form, first as open while the profile lacked their
# criterion), writing the same three keys into each entry it addressed.
# The coordinator then wrote the keys into the remaining observations: the
# profile now states the two criteria the observations found missing, the
# example drift was recaptured, and `not-a-defect` marks the one observation
# whose own investigation found no defect. After that revision's independent
# re-review (REV-C-001 to REV-C-005, recorded in research/production-review.md),
# a second round of the same day corrected the note of STU-010.

