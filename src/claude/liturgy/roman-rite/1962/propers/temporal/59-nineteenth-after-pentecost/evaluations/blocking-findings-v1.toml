[[advisories]]
stage = "research-review"
id = "RES-010"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/research/interpretations.md § 2.4, Allegorical bullet, clause 'the servants are prophets and apostles sent by one God (Irenaeus; Gregory; Hilary; Chrysostom)'"
problem = "This is the same class of defect as RES-009, in the bullet repaired for it: a joint citation credits an author with a clause he does not state. Hilary, In Matth. XXII.4 (scope § 3.6, PL 9 page image), makes the servants sent to call the apostles ('Servi missi, qui invitatos vocarent, apostoli sunt'). Those sent again are 'apostolici … viri et successores apostolorum'. He names no prophets. 'Sent by one God' is Irenaeus's anti-Marcionite argument (Adv. haer. IV.36.5), not a claim Gregory, Hilary or Chrysostom makes. § 2.6 and § 2.2 state the four identifications correctly, but a study that follows the § 2.4 bullet would say that Hilary reads the servants as prophets."
required_result = "Cite each clause to the author who states it. For example: 'the servants are prophets and then apostles (Gregory § 3; Chrysostom, with John and the Son between them), sent by the one God who called those of old (Irenaeus); for Hilary, the apostles and then apostolic men, their successors'."

[[advisories]]
stage = "research-review"
id = "RES-011"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/59-nineteenth-after-pentecost/research/scope.md § 3.6, Augustine Sermo 95 bullet, sentence 'in iteration 2 a search of both sermons whole (lines 37787–38310 and 39237–39464) for … found only …'"
problem = "I replayed the stated terms over the stated line ranges of the sealed NPNF1-6 text (ccel-text-ce371798). The sentence omits several of the hits the search returns. Omitted in Sermo 90: 'be invited as one who is to remain' (line 38048), 'thou hast now come invited hither' (38122, 38125) and 'when the Jews tempted Him' (38184, the tribute money). Omitted in Sermo 95: 'The Master of the house who had invited them' and 'that Bridegroom invited them' (39291, 39293), 'the Master of the house Who had invited him' (39338) and 'ye have been invited through me … He invited you by my ministry' (39347–39348). None of these identifies the refusing guests or the highways, so the record's conclusion stands. But the 'found only' list is not what the search returns, and a replay contradicts it."
required_result = "State the result so that a replay matches it. Either list every hit, or say that no hit identifies the refusing guests or the highways and name the kinds of hits there are (the hearers and the guests as invited; the servants who invite good and bad; the Jews in the Stephen and tribute passages; the Israelites and Pharaoh's magicians)."

