# Post-acceptance revision, 2026-09-30. On the maintainer's request of that day
# for the correction, a revision outside the run recorded below repaired the
# four standing advisories owned by this leaf's research records (RES-010,
# RES-011, STU-011, STU-012), checking each against the witnesses it cites, and
# wrote its disposition into those four entries by hand: `resolution`,
# `resolution_date` and `resolution_note`. No other entry was touched, and no
# render input changed. The engine's reader keeps only the keys its writer
# writes, so a later evaluation that rewrites this file drops them;
# research/production-review.md carries the same dispositions durably. The keys
# above still describe the run's last write. After that revision's independent
# re-review (REV-B-001 to REV-B-004, recorded in research/production-review.md,
# "Independent re-review and second round"), a second round of the same day
# amended the notes of STU-011 and STU-012. A post-acceptance revision of the
