[[findings]]
id = "SYN-FID-001"
lane = "derivation-fidelity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/synthesis/20-integrated-commentary.tex, whole file, against sections/30-commentary.tex"
problem = "The companion is the canonical element-by-element sweep compressed, not a redistillation. Measured with Latin quotations and the divergence table excluded, 2137 of 4501 words of the companion's English prose (47.5%) fall in seven-word-or-longer verbatim runs against sections/30-commentary.tex; with Latin quotations counted the figure is 55.3% and 55.5% against 30-commentary plus 05-appointed-text together. The longest English-prose run is 83 words (companion lines 8-16, 'through the Introit, the Collect ... the Clementine reads the o', reproducing 30-commentary lines 8-18); further runs of 75 words (companion lines 397-405 on the two eighth-century books' wording, from 30-commentary lines 109-117), 68 words (companion lines 421-426 on the Collect's semicolon, from 30-commentary lines 271-275), 68 words (companion lines 64-70 on the Ps. 72-88 ascriptions, from 30-commentary lines 207-213), 50 words (companion lines 408-414 on the four sacramentaries, from 30-commentary lines 977-984) and 48 words (companion lines 483-486 on the Lenten Thursday, from 30-commentary lines 773-777). The four sibling leaves' companions measure 29.6% (52), 18.4% (53), 31.6% (54) and 15.3% (56) on the identical measure, with longest runs of 21 to 49 words, and the run that made this a criterion measured 36.8% with a 47-word run. By bytes the companion is 52.5% of its canonical commentary where the siblings run 17.1-33.7%. What the reuse costs the reader: the Collect's semicolon, the Ps. 72-88 ascription sweep, the Benziger collation and the two sacramentaries' word-order movement are each reproduced at full canonical strength with their working intact, so a reader who has the canonical edition meets the same argument twice at the same weight, and a reader who has only the companion is given the sweep's evidence rather than the cross-proper argument the edition promises; sections 1, 2, 3 and 6 walk the canonical subsections in the canonical's own order and reach the canonical's own conclusions in the canonical's own sentences."
required_result = "The integrated commentary is rewritten so that its English prose falls inside the family's measured band against sections/30-commentary.tex - at or below roughly 32% of its words in seven-word verbatim runs, with no run approaching 83 words - by stating the canonical sweep's conclusions in the companion's own sentences and leaving their working in the larger edition, rather than by deleting paragraphs whole."
repair_target = "derivation"

[[findings]]
id = "SYN-FID-002"
lane = "derivation-fidelity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/synthesis/20-integrated-commentary.tex lines 35-41 and 176-177"
problem = "The companion's commentary reproduces passages of sections the companion itself prints, so the companion reader meets them twice or three times in one 24-page sitting, and in both cases the canonical reader does not. (a) Lines 35-41, 'no page image of any of them was opened here; the source records of the 1604 and the 1570 classify their layers degraded and forbid resting any negative search on them, the Pustet's classifies its layer prose Latin ... only through a checked passage', is a 49-word verbatim run against sections/90-scope.tex lines 42-46. In the built companion that bound now stands at pdftotext lines 288, 1006 and 1205 - three times; in the built canonical it stands twice, at 1686 and 1880, because canonical 30-commentary does not carry it at all. The derivation added a third statement of one bound to the shorter edition. (b) Lines 176-177, 'divides the day between the time when it goes well with us and the time of tribulation, giving the psalm's mercy to the one and its truth to the other', is a 30-word verbatim run against sections/20-themes.tex lines 143-145. The canonical prints this reading once in English (20-themes) and once in Augustine's Latin (30-commentary lines 474-476); the companion turned the Latin into 20-themes' own English, so the phrase now appears twice in the companion PDF (lines 241 and 386) and only once in the canonical PDF (line 241)."
required_result = "Neither passage is restated in the integrated commentary: the degraded-optical-layer bound is left to sections/90-scope.tex, which the companion prints, and the Gradual versicle's mercy-and-truth division is either left to sections/20-themes.tex or carried in the companion's own words rather than in 20-themes' sentence."
repair_target = "derivation"

[[findings]]
id = "SYN-FID-003"
lane = "derivation-fidelity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/synthesis/20-integrated-commentary.tex lines 440-442, sentence 'The Hadrianum heads the section carrying these orations as the Sixteenth while its own margin carries the chant set 1962 gives the Seventeenth.'"
problem = "The canonical edition nowhere identifies any margin's chant set with the 1962 Seventeenth Sunday. What canonical 30-commentary states is that in the margins of Ottobonianus 313 the chant series and the oration series run two Sundays apart across five consecutive sections (line 168), and that the four-element Mass standing under this Sunday's Introit in that margin - Introit Inclina domine aurem, respond Bonum est confidere, Offertory Expectans expectaui, Communion Qui manducat - is not the 1962 four (lines 170-173); the Hadrianum enters canonical only as Wilson's section XXXIIII at printed p. 174, with the chant margins attributed to Ottobonianus 313 at p. 173 in sections/99-references.tex line 41. The word 'Seventeenth' occurs in the canonical edition only inside Wilson's quoted apparatus about Rheinau, S. Gallen, Gerbert and Menard. The companion's sentence is instead a near-verbatim lift of research/scope.md lines 1352-1353, 'The Hadrianum heads the section carrying these orations DOMINICA .XVI. while its margin carries the chant set 1962 gives the Seventeenth (LIT-001, LIT-007)': an eleven-word and an eight-word run match the research brief and match nothing in any canonical file. The companion is asserting from the brief a claim the canonical edition declined to state in those terms, and stating it two sentences before its own paragraph gives the same margin a chant set containing this Sunday's own Introit and Offertory."
required_result = "The sentence is replaced by what the canonical edition actually asserts about the numbering witnesses and the chant margins - Ottobonianus 313's two-Sunday offset across five consecutive sections and the Hadrianum's DOMINICA .XVI. heading - or it is cut. No claim in the companion is sourced from research/scope.md rather than from the canonical edition."
repair_target = "derivation"

[[findings]]
id = "SYN-FID-004"
lane = "derivation-fidelity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/synthesis/20-integrated-commentary.tex lines 104-105, 'Augustine's fullest paragraph is an exposition of the verse the antiphon removes'"
problem = "A ranking claim about the relative length of Augustine's paragraphs in Enarratio in Psalmum 39 that the canonical edition does not make anywhere. 'Fullest' occurs in no canonical file. What canonical 30-commentary says of that enarratio is that the pit of misery, which the antiphon cuts, stands at section 3 (lines 809-811), and its only statement about the length of any paragraph there runs the other way: 'The exposition opens with a long anti-Donatist prologue at section 1' (lines 817-818). research/scope.md does not carry the claim either. The companion is therefore asserting a fact about the source text that neither the canonical edition nor the brief behind it establishes, in the one sentence of that paragraph that carries its rhetorical weight."
required_result = "The sentence states only what the canonical edition establishes - that Augustine's exposition of the verse the antiphon cuts is where his reading of the psalm sits - without ranking his paragraphs by length, or the ranking is dropped."
repair_target = "derivation"

[[findings]]
id = "SYN-FID-005"
lane = "derivation-fidelity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/synthesis/20-integrated-commentary.tex lines 218-219, 'neither the Latin nor the Douay distinguishes it from the other verbs of bearing'"
problem = "The canonical claim is narrower and is about the three appointed occurrences only. Canonical 30-commentary lines 332-336 read: 'the appointed text prints portate, portabit and qui portabant within one Mass. The Latin does not distinguish them and neither does the English' - that is, the Vulgate and the Douay do not distinguish the three occurrences of bastazo from one another. The companion's rewrite asserts instead that Latin and Douay do not distinguish bastazo from other Greek verbs of bearing, a lexical claim about the wider rendering of phero, airo and their kin that no canonical sentence makes and that research/scope.md (line 410-413, SCR-021) does not support: the research entry states only the twenty-seven occurrences, the four in Galatians, the two in the lesson and the three appointed Latin forms. There are in fact no other verbs of bearing in the appointed text, so the claim can only be about the Bible at large, where nothing here checked it."
required_result = "The clause is restored to the canonical claim - that the Latin renders all three occurrences by one verb and the Douay follows it, so the identity of the lesson's verb with the bier-bearers' is invisible in both columns - and asserts nothing about Latin or Douay renderings of other Greek verbs of bearing."
repair_target = "derivation"

[[findings]]
id = "SYN-FID-006"
lane = "derivation-fidelity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/synthesis/20-integrated-commentary.tex lines 443-445, 'The Liber Comitis heads it Dominica mensis vi, its count from the feast of St Lawrence having stopped one Sunday earlier, where Schuster calls this one the fifth after St Lawrence and the last of that series.'"
problem = "The bound the canonical attaches to exactly this heading does not travel. Canonical 30-commentary lines 143-151 print the same heading and then hold unsettled 'What Migne prints there under Jerome's name - its date, its provenance, its textual authority, and whether the mensis vi and mensis viii headings with no mensis vii between them are the book's own or Migne's arrangement'. The companion places the heading in a paragraph whose subject is precisely which Sunday the sources make this - 'What the sources disagree about is which Sunday this is' - so the numbering is the load-bearing part, and it prints it flat. The companion's own appendix does not restore it: sections/90-scope.tex lines 151-154 bound only 'date, provenance and authority', which does not reach the question of whether the mensis numbering is the book's own or Migne's arrangement. Every other numbering witness in that paragraph carries its bound (Wilson's five 'None of the five was opened here', the antiphonary figures 'the gregorien.info database's report of Hesbert's printed pages'); this one alone stands unqualified."
required_result = "The Liber Comitis sentence carries the canonical's bound - that the mensis vi heading may be Migne's arrangement rather than the book's own - wherever the companion uses that heading as a witness to the Sunday's number."
repair_target = "derivation"

[[findings]]
id = "SYN-CON-001"
lane = "companion-conformance"
severity = "blocking"
location = "sections/20-themes.tex (10 instances, lines 25, 39, 42, 47, 91, 112, 114, 117, 142, 159); sections/35-source-grounded-synthesis.tex (8 instances, lines 21, 31, 46, 54, 81-82, 87, 109, 117); sections/50-interpretive.tex (6 instances, lines 23, 27, 58, 90, 119, 148) - rendered at companion pages 3, 4, 11, 12, 15 and 16"
problem = "Twenty-four locators in three files both editions input send the reader to a named element subsection of `The Propers: Detailed Commentary` - \"as the Gospel subsection sets out in Cyril's own words (Payne Smith, vol. 1, pp. 132-133)\" (20-themes.tex:25, p3), \"both grammars being set out at the Collect and Postcommunion subsections\" (20-themes.tex:39, p3), \"the sentence the Introit subsection prints (En. Ps. 85.2)\" (20-themes.tex:42, p3), \"the Introit and Alleluia subsections carry the collation\" (35-source-grounded-synthesis.tex:31, p11), \"the Offertory subsection of the commentary giving the extent\" (50-interpretive.tex:119, p16), and nineteen more. In the canonical build these resolve: sections/30-commentary.tex carries ten element subsections (Introit, Collect, Epistle, Gradual, Alleluia, Gospel, Offertory, Secret, Communion, Postcommunion) with twenty-three \\witnessnote blocks under them. In the companion's own build there is no element subsection anywhere - sections/synthesis/20-integrated-commentary.tex is six numbered cross-proper units - so all twenty-four pointers dangle. One of them is also a count: \"The loci stand at the four element subsections\" (35-source-grounded-synthesis.tex:81-82, companion p12) states a number of a structure the companion does not have, so both halves of the sentence are unavailable to the companion's reader. I checked the referents rather than assuming: the substance behind most of these pointers does survive into the companion's units (Cyril's Capharnaum/Naim contrast at 20-integrated-commentary.tex:331, Augustine's `Inclinat aurem . . . cervicem` at :78, the misericordia/veritas collocation counted through the psalter at :150-151, the four Lenten loci at :470ff), so what is wrong is the pointer and not the material. This is not house form: the four sibling leaves 52, 53, 54 and 56 carry zero occurrences of \"subsection of the commentary\" in any shared section file."
required_result = "Every one of the twenty-four pointers must resolve in the companion's own build, and \"the four element subsections\" must either name something the companion contains or go. Which half is wrong is the pointer, not the number: the canonical does have four element subsections carrying those loci, and the companion has none. Note plainly that this may not be clearable inside the reviser's remit. workflows/fragments/propers/synthesis-revision.md limits it to synthesis.tex, the \\ifdefined branches in main.tex, sections/synthesis/, proper-components.toml and generation-metadata.tex, and none of those can create an element subsection in the companion (the profile forbids per-element headings in the integrated commentary) or reword a sentence in 20-themes.tex, 35-source-grounded-synthesis.tex or 50-interpretive.tex. There is one in-remit-adjacent route with house precedent, and the reviser should take it only if it judges it permitted: wrap each locator clause in `\\ifdefined\\TriptychSynthesisEdition ... \\else ... \\fi` so the canonical rendering is byte-identical and the companion's clause points at its own units instead - this leaf's own format.tex already uses that mechanism for the \\editionnote, and sibling leaf 56 uses it inside sections/90-scope.tex and sections/99-references.tex for exactly this purpose. If the reviser judges that editing those three files at all is editing settled canonical prose, it must report this finding `not-repaired`, naming the three files, so the maintainer can decide whether the guards may be added."
repair_target = "derivation"

[[findings]]
id = "SYN-CON-002"
lane = "companion-conformance"
severity = "blocking"
location = "sections/90-scope.tex lines 48-49, 63, 71-72 and 83-85 - rendered at companion pages 17 and 18"
problem = "The terminal scope appendix, which both editions print unchanged, makes four statements about an appointed-text component the companion omits. (1) Line 48-49, companion p17: \"where the commentary or the appointed-text section reports one of their readings, a spelling or a point\" - the companion has no appointed-text section. (2) Line 63, companion p18: \"The three orations are quoted from The Roman Missal translated into the English language for the use of the laity, first revised edition (Philadelphia: Eugene Cummiskey, 1861)\" - the companion quotes none of the three orations in English anywhere; I searched its build for the 1861 renderings and it carries only references to the book, never its text. (3) Line 71-72, companion p18: \"Where the registered English does not answer the Latin, the appointed-text section says so at the element and leaves the gap open\" - nothing in the companion says so at any element, because there are no elements to say it at; the paragraph then enumerates the four gaps itself, so the reader learns them, but the sentence describes an apparatus the edition in hand does not contain. (4) Line 83-85, companion p18: \"is answered by neither of the Englishes printed at those elements, the Douay's and the 1861 book's\" - the companion prints no English at any element at all. Each is true of the canonical build, whose sections/05-appointed-text.tex prints the Latin and both Englishes element by element with the gaps flagged in place. No sibling leaf carries \"appointed-text section\" in its 90-scope.tex."
required_result = "These four sentences must be true of the companion as built, or must not print in it. The half that is wrong is the sentence, not the companion: omitting the appointed text is what the profile requires of the companion, so nothing should be added to the companion to satisfy them. As with SYN-CON-001 the only repair lies in a file the reviser's remit does not list; the house-precedented route is an `\\ifdefined\\TriptychSynthesisEdition\\else ... \\fi` guard around each clause, leaving the canonical rendering byte-identical, exactly as sibling leaf 56 does in its own sections/90-scope.tex. If the reviser judges it may not touch sections/90-scope.tex, it must report this `not-repaired` naming that file and these four line ranges."
repair_target = "derivation"

[[findings]]
id = "SYN-CON-003"
lane = "companion-conformance"
severity = "blocking"
location = "sections/90-scope.tex lines 101-103, rendered at companion page 18, judged against sections/synthesis/20-integrated-commentary.tex"
problem = "The scope appendix tells the reader of whichever edition is in hand: \"A checked quotation is a published claim read at an exact locus in the edition named at the point of use; that is every patristic, medieval and liturgical citation here.\" That is true of the canonical build, whose element sweep carries twenty-three \\wlocus blocks giving loci of the form \"Augustine, Enarratio in Psalmum 85 SS1-6 (PL 37, 1081-1090)\" and \"Cassiodorus, Expositio Psalmorum on Ps. 85 (PL 70)\". It is false of the companion. Its integrated commentary names Augustine 12 times, Ambrose 8, Cassiodorus 7, Chrysostom 5, Cyril 5, Aquinas 4, Bede 4, Gregory of Nyssa 3, Jerome 2 and Hilary once, and quotes some sixty-seven Latin passages, with no exact locus at any point of use: the file contains no \\witnessnote or \\wlocus block, no PL volume or column, no enarratio, sermo, tractate or section number, and no Payne Smith or Pusey page. The only two locus-shaped tokens in the whole file, V.86 and VI.64, appear in the single passage reporting a negative search. The nearest the companion comes is descriptive - \"his second and third paragraphs\", \"at his fifth paragraph\" - which is not an exact locus in a named edition. The shared sentences in the surrounding files even cite loci the companion never prints: 20-themes.tex sends the reader to \"(En. Ps. 85.2)\", \"(En. Ps. 85.1)\", \"(En. Ps. 39.5)\" and \"(PL 70)\", and 35-source-grounded-synthesis.tex to \"(Exp. Luc. V.90)\", none of which occurs anywhere in the companion. Unlike the two findings above this one is repairable inside the reviser's own remit, because it owns the file where the citations are."
required_result = "Supply the exact locus in a named edition at each point of use in sections/synthesis/20-integrated-commentary.tex - enarratio and section for Augustine, PL volume and column for Cassiodorus and Bede, Exp. Luc. book and section for Ambrose, Payne Smith or Pusey volume and page for Cyril, and the corresponding locus for Jerome, Chrysostom, Aquinas, Hilary and Gregory of Nyssa - so that sections/90-scope.tex line 101-103 is true of the companion's own build as it is of the canonical's. The wrong half is the companion, not the sentence: the loci exist in the canonical leaf and were dropped in derivation, so this needs no new research. Do not clear it by changing the scope sentence, which is canonical prose and out of remit."
repair_target = "derivation"

