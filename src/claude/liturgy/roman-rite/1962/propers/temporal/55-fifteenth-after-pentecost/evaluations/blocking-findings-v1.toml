[[findings]]
id = "CON-EVI-037"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/40-notable.tex lines 4-8 (built p. 24, the gallery's opening paragraph): 'Two elements supply all five: Gal. 6:2, 6:5, 6:7 and 6:9 have each become free-standing English proverbs, and the Introit, the Gradual, the Alleluia and the Communion have not.'"
problem = "A flat negative stated at a strength the record does not hold and the leaf's own appendix contradicts. sections/90-scope.tex lines 201-208 (built p. 31) bound the same result to four corpora searched on one day and state that the Alleluia 'is closed to that sweep as a matter of text and not of effort, because no English corpus can be searched for a reading the English Bibles do not carry'; research/scope.md section 7 (lines 1368-1370) says of the Introit, Gradual and Communion only that on this sweep's evidence they have not become proverbs, and section 7.5 that 'a different corpus, a different phrasing or a non-English literature could overturn any of it'. The gallery therefore asserts of the Alleluia what the appendix says could not be tested, and of the other three a universal negative where the record holds a bounded one: one bound stated at two strengths on pp. 24 and 31."
required_result = "The sentence states the bound the record holds - the four Epistle verses have become free-standing English proverbs, the sweep behind this gallery located no such afterlife for the Introit, the Gradual or the Communion, and the Alleluia's wording could not be searched for at all - or its second clause is dropped and the appendix's bounded statement stands alone. Afterwards p. 24 and p. 31 state the Alleluia's negative at one strength."
repair_target = "authoring"

[[findings]]
id = "CON-CIT-028a"
lane = "citation-integrity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md lines 747-749, section 2.5 'Bounded absence': \"counted over the whole chapter the lemma frequencies are Ambrosius 25, Beda 20, Cyrillus 11, Chrysostomus 8, Titus 5, Theophylactus 3, Eusebius 2, Gregorius 2 plus `Gregorius in Evang.` once, and both bare hits are the lect. 6 ones\" (PAT-019)."
problem = "The figures do not describe the registered witness. The Corpus Thomisticum page the brief cites and the library registers (artifact.thomas-aquinas.catena-aurea-in-lucam.latin-corpusthomisticum-web-2026-09-05.corpusthomisticum-clc04-d43a7afc, source_url https://www.corpusthomisticum.org/clc04.html) was refetched for this evaluation on 2026-09-09 and hashes to the registered sha256 d43a7afccc949ce48ef24778651c7b9de0ded2fb500e78974dbd477a48d65865 at the registered 289,517 bytes, so the bytes counted are the bytes the lane registered. Over Catena in Lc. cap. 7 lect. 1-6 (Marietti paragraphs 85816-85821) that page carries 134 excerpt headings, each heading being the plain-text author name that precedes one italicised excerpt: Ambrosius 32 plus 'Ambrosius in Lucam' 2; Beda 22; Cyrillus 16 plus 'Cyrillus in Ioannem' 1; Chrysostomus 8 plus 'Chrysostomus in Matthaeum' 7; Titus 9; Theophylactus 4; Eusebius 2 plus 'Eusebius in Lucam' 1; Gregorius bare 9, 'Gregorius in Evang.' 3 and 'Gregorius Nyssenus' 5; and, unlisted in the brief, 'Augustinus de Cons. Evang.' 3, 'Augustinus de quaest. Evang.' 3, Graecus 4, Glossa 2 and 'Isidorus abbas' 1. No counting convention reproduces the brief's row: bare headings alone give Ambrosius 32, Beda 22, Cyrillus 16, Titus 9, Theophylactus 4 and Gregorius 9, and the bare Gregorius hits are nine, not two, all nine standing at lect. 6 with the three 'in Evang.' headings. The bounded negative the count supports is true on the page -- no heading of Gregory the Great stands at lect. 2, and every one of his twelve stands at lect. 6 on Lk. 7:36-50, the five 'Gregorius Nyssenus' headings at lect. 2, 5 and 6 being another Gregory -- but the numbers stated for it are false of the witness. The material is held and misstated, no retrieval is needed, and the leaf reproduces the brief's figures at sections/30-commentary.tex lines 740-745 (CON-CIT-028b)."
required_result = "Section 2.5's count is restated from the registered page: either the per-author heading frequencies over Luke 7 as the page carries them, with the counting basis named (excerpt headings, bare and qualified forms distinguished) and 'Gregorius Nyssenus' separated from Gregory the Great's bare and 'in Evang.' headings, or the figures withdrawn and the negative kept as the page bears it out -- no heading of Gregory the Great at lect. 2, all twelve at lect. 6. Whichever is done, a reader who counts the registered page finds the brief's figures there."
repair_target = "brief"

[[findings]]
id = "CON-CIT-028b"
lane = "citation-integrity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 740-745 (built edition p. 19), 'What the commentators do not supply', the sentence \"Within Luke 7 the Catena aurea cites Gregorius in Evang. only at lect. 6, on the sinful woman of Lk. 7:36-50; counted over the whole chapter the lemma frequencies are Ambrose twenty-five, Bede twenty, Cyril eleven, Chrysostom eight, Titus five, Theophylact three, Eusebius two and Gregory two plus one in Evang., and both bare hits are the lect. 6 ones.\""
problem = "A stated count of the guide's own evidence that the cited witness does not bear out. The Corpus Thomisticum page for Catena in Lc. cap. 7 (registered artifact ...corpusthomisticum-clc04-d43a7afc, refetched 2026-09-09 at the registered digest) carries over the six lectiones Ambrosius 34 (32 bare, 2 'in Lucam'), Beda 22, Cyrillus 17 (16 bare, 1 'in Ioannem'), Chrysostomus 15 (8 bare, 7 'in Matthaeum'), Titus 9, Theophylactus 4, Eusebius 3 (2 bare, 1 'in Lucam'), Gregorius bare 9 and 'in Evang.' 3, 'Gregorius Nyssenus' 5, Augustinus 6, Graecus 4, Glossa 2 and Isidorus 1; a reader who counts finds none of the eight figures the sentence prints except Chrysostom's eight bare headings, and finds nine bare Gregorius headings where the sentence says two. The clause the figures serve is true -- 'Gregorius in Evang.' and every bare Gregorius heading stand at lect. 6 and none at lect. 2 -- and the appendix's sentence at sections/90-scope.tex lines 178-180, which names the lemma frequencies without printing them, is not at issue. The figures were inherited from research/scope.md lines 747-749, which CON-CIT-028a corrects; the leaf's sentence is this finding's."
required_result = "The sentence prints either the frequencies the corrected brief records, with Gregory of Nyssa's headings distinguished from Gregory the Great's and the counting basis stated, or no per-author figures at all, keeping the fact that carries the negative: within Luke 7 every heading of Gregory the Great, bare or 'in Evang.', stands at lect. 6 on the sinful woman and none at lect. 2. Afterwards no number the sentence states about the Catena's Luke 7 disagrees with the registered page."
repair_target = "authoring"

[[findings]]
id = "CON-PRO-004"
lane = "profile-conformance"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/05-appointed-text.tex lines 225-231 (built edition p. 8), the Offertory's namedtranslation card: its title 'English: Douay--Rheims (Challoner), Ps. 39:2--4 printed whole, with the portions the chant sings in bold' and its v. 3 text 'And he heard my prayers, and brought me out of the pit of misery and the mire of dregs. And he set my feet upon a rock, and directed my steps.'"
problem = "The legend states that the portions the chant sings are set in bold, and the card sets v. 3a, 'And he heard my prayers,', in roman while v. 2 and v. 4a are bold; the built p. 8 raster confirms it. The antiphon sings v. 3a as et exaudivit deprecationem meam, as every other statement of the extent in the guide says: the Latin card directly above (line 221), the gap block directly beneath (lines 244-247: only 'the whole of v. 3 from et eduxit me de lacu miseriae to direxit gressus meos is cut, and so is the second half of v. 4'), the divergence table (30-commentary.tex line 56, 'Off., Ps. 39:3 -- et exaudivit deprecationem meam: / Et exaudivit preces meas,'), the fourth gallery entry (40-notable.tex lines 129-132, the antiphon 'keeps only the opening clause of v. 3 and cuts the rest of it'), and propers/verified.md (English, item 2: 'he heard my prayers' for et exaudivit deprecationem meam, 'the antiphon stops at Deo nostro'). The card's own convention bolds v. 2b 'and he was attentive to me' although the chant's respexit me departs from the Clementine there exactly as deprecationem meam does at v. 3a, so the departure is no ground for the difference. A reader using the bold to see what the antiphon sings is told that v. 3 is wholly unsung, which the guide's own text contradicts at four places. The Introit and Communion cards agree with their legends."
required_result = "The Offertory card is true of its own legend: 'And he heard my prayers,' at v. 3 is set bold with v. 2 and v. 4a, so that the bold marks exactly the three clauses the antiphon sings -- v. 2, v. 3a and v. 4a -- as the Latin card, the gap block, the divergence table and propers/verified.md state them; or, if the bold is meant to mark only clauses whose Douay wording answers the chant, the legend says so and v. 2b is unbolded to match, and the Introit and Communion legends are checked against the same rule. No retrieval and no change to the brief is needed: the sung extent stands in the leaf's own appointed Latin and in propers/verified.md."
repair_target = "authoring"

