note = "The two cuts the same paragraph then describes stop short of two different things and not one theme - the Offertory's cut withholds the hope of Ps. 39:4b-5, the Introit's centonisation passes over the guarding of Ps. 85:2a - so the opening sentence misdescribes the mechanism the rest of the entry sets out correctly. The leaf's corresponding proposal, P4 at sections/50-interpretive.tex lines 114-123, states it accurately as two cuts each withholding a word another element of the same Mass carries."

