note = "Restated and re-verified at this iteration. The gallery's opening sentence sets out to account for the scriptural propers and reaches six of the seven: two elements supply all five entries, `the Introit, the Gradual and the Communion have no such afterlife in the four corpora searched', and the Alleluia cannot be searched. The Gospel -- the widow of Naim, the day's most quotable scene -- is named nowhere in the accounting, and the reason it has no entry (`On this selection the gallery has no Gospel entry: the one located non-preaching use of the appointed Gospel is contestable under the profile's own rule') stands only in the scope appendix seven pages later. research/scope.md lines 1401-1403 account for the elements the same way and omit the Gospel likewise, so the leaf is following its brief. My criterion 7 does not reach it: `Two elements supply all five' is a true count over the five entries I counted, the four Epistle verses named as proverbs are supported at research/scope.md line 1402 and CUL-010, and the clause about the elements without an afterlife states no number, so nothing here is a count its own list contradicts; nor is it criterion 14, since every statement the paragraph makes about the guide's contents is true as far as it goes. What is real is an enumeration over the appointed elements that silently drops one, and no lane's criteria appear to reach an incomplete-but-true enumeration."

