[[observations]]
lane = "reception-sweep"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/90-scope.tex line 128 (built canonical edition p. 30, 'Bede and Cassiodorus were read on optical layers of Migne whose recognition is poor and which corrupt individual words') and sections/99-references.tex lines 215-218 (built p. 35), against the tracked Corpus Corporum Latin texts at .../monumenta-ps85-apparatus-latin-text/cassiodorus-ps85-latin.txt and .../monumenta-ps39-apparatus-latin-text/cassiodorus-ps39-latin.txt."
note = "Restated from the standing record and re-verified by me: every Cassiodorus sentence the leaf prints from Pss. 85 and 39 verifies word for word in those two tracked files -- including the Ps. 85:1 lemma 'Inclina, Domine, aurem tuam ad me' on which the sixth-century attestation of the Introit's added ad me rests at C1 of the source-grounded synthesis, and the Ps. 39:2-3 lemma identical to the Offertory antiphon -- while the leaf declares only the remote Migne optical layer for Cassiodorus at all four psalms, so a reader is told the weaker state for two psalms whose text this repository now holds; the re-verifiability gap that genuinely remains is Ps. 91 and Ps. 94, for which no tracked transcription exists. The same file also settles the independence question the brief's C4 raises at scope.md lines 206-210: Cassiodorus's one naming of 'doctor Augustinus' in the Ps. 85 exposition falls at v. 13 on the two parts of hell and not on the head-and-members reading, so the leaf's 'two Latin commentators state the reading' at sections/20-themes.tex lines 113-115 (built p. 4) claims nothing the evidence does not bear. Criterion 3 is met and this is a fact about the evidence, not a defect."

[[observations]]
lane = "synthesis-argument"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md line 1868, section 8 IP-1 'Mechanism': \"so the prayer's own grammar states the incapacity before it asks anything\"."
note = "Restated from the standing record and unchanged, the brief not having been rewritten since the fifth evaluation: the brief overstates the Collect's grammar, since `miseratio continuata mundet et muniat` is already a petition before the causal clause, so the incapacity precedes only the last petition -- which is what the leaf's P1 says at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/50-interpretive.tex line 22 (built p. 26, 'before its last petition'). The leaf is right and did not inherit the error. A brief sentence wrong where the leaf is right is a class no criterion in the shared list reaches, and only brief-revision may write that file; recorded so that a later authoring pass reading IP-1 does not conform the leaf to it."

[[observations]]
