note = "Restated from this lane's iteration-1 observation in the standing record, and re-checked at this iteration: the class is unchanged and now on its second consecutive round. The canonical edition publishes two exact English quotations from the 1861 Cummiskey book whose bytes no registered passage record holds and which the immutable brief does not carry either -- the Alleluia versicle at sections/05-appointed-text.tex lines 174-177 and the Offertory rendering at lines 242-246. The tracked transcription artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.temporal-orations-en covers orations only, at physical lines 155-157, and the only registered passages for this formulary are the aggregate post-pentecosten-15 record and the per-oration Secret and Postcommunion records -- three in all, two of them `verified', none for a chant, which I re-counted in the source library this round and which is exactly what sections/90-scope.tex line 93 states. research/scope.md records that Cummiskey 1861 renders `super omnem terram' at printed p. 428 but not its wording, gives the Offertory's three phrases to Keating 1806 alone, and states that using any such rendering `means registering a passage over the exact bytes and reading the printed page'. The leaf declares its basis at sections/90-scope.tex lines 66-67 -- in scope this round, and the surrounding sentences at lines 78-86 were rewritten in it -- that this audit read the page images of the registered scan at printed pp. 427-429, propers/verified.md lines 806-830 carries both strings verbatim, and References attributes both to the edition and page. So my own criteria are met: the witness is registered and public-domain and nothing is composed, translated or adapted (criterion 8), and I found no evidence of invention (criterion 7). What I still cannot reach is whether two published strings may rest on a page-image reading that neither a passage record nor the brief holds; criterion 2 as my fragment bounds