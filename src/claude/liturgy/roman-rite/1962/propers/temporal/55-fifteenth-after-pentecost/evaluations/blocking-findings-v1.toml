problem = "Restated from the standing record at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/evaluations/blocking-findings-v1.toml and re-established at this iteration by reading all three passages: neither profile line has been altered. The profile states the required contents of the Interpretive-proposal audit twice, and the two lists differ in one field each way, with a third field named differently. Line 376: \"Record an `Interpretive-proposal audit` in `research/scope.md` naming the anchors, mechanism, nearest located precedent or analogue, search boundary, and controlling limit.\" Line 404, in Profile Gates: \"the research scope records each proposal's anchors, mechanism, targeted precedent result, fruit, and strongest limit\". Line 376 requires the search boundary and does not name the fruit; line 404 requires the fruit and does not name the search boundary; and the precedent field is `nearest located precedent or analogue' in the one and `targeted precedent result' in the other. Neither list is a superset of the other, so a leaf cannot satisfy both by following either. This leaf's scope.md section 8 follows line 376: each of IP-1 to IP-6 carries Anchors, Mechanism, Nearest located precedent or analogue, Classification and Controlling limit, the section preamble at lines 1864-1868 binds the search boundary of every classification to section 3.5, and no entry carries a Fruit field -- though the leaf publishes \\pfield{Fruit} for every one of the five proposals it prints (sections/50-interpretive.tex). The published collection is split on it in the way a rule stated twice produces, and I re-read both siblings this round: claude/54's audit (its scope.md section 9.14, from line 7018) gives each entry Anchors, Mechanism, **Fruit**, a `misses' field, a **Precedent result** and a Controlling limit, and states the targeted search boundary once for the whole section rather than per entry; claude/56's audit (its scope.md section 9, from line 3523) gives each entry a per-entry **Search boundary** and a **Nearest located precedent or analogue** and no Fruit. Three leaves, three arrangements, and each defensible under one of the two statements. No stage of this workflow may write guidance, so no repair_target is true of the defect; and because the leaf conforms to one of the two statements, I have raised no brief finding against research/scope.md."
required_result = "The maintainer decides which list is the Interpretive-proposal audit's -- whether the fruit, the search boundary, or both are required of it, and which name the precedent field takes -- states it once, and makes the other passage link there rather than restate it, as Reader-Facing Order was settled at profile lines 248-250. If line 404's list controls, a Fruit field is owed to section 8 of this leaf's research/scope.md and to claude/56's, and the writer of the brief is the stage that adds it; if line 376's list controls, claude/54's audit owes an explicit per-entry or section-level search-boundary field under that name and this leaf's section-level binding to section 3.5 is confirmed as sufficient."
escalated_to = "guidance/liturgy/roman-1962-propers.md, lines 376 and 404"
