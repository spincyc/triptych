[[accepted]]
id = "SYN-CON-009"
lane = "companion-conformance"
severity = "accepted"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/99-references.tex, the Variationes entry at lines 94-98, specifically the clause at lines 96-97, 'with the \\latin{Rubricae generales} n.~18 at printed p.~599 distinguished from it.'; rendered unbranched in the companion build at page 22 (under 'The Missal and the liturgical witnesses') and in the canonical build at page 33."
problem = "This is the one remaining entry in the file of the shape SYN-CON-005, SYN-CON-006 and SYN-CON-008 named, and this round's sweep of the file left it unbranched without recording why. Under the References convention those findings established -- an entry states, in that section's own idiom, what the cited edition supplied to the edition in hand -- the second locus is supplied only to the canonical. The distinction between Variationes cap. IV n. 18 at AAS 52 printed p. 709 and the Rubricae generales n. 18 at printed p. 599 is drawn at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex line 96, inside the 'Psalm numbering, and the rubrics behind the colour and the single oration' subsection of the element-by-element sweep, and renders at canonical build p. 11, closing 'so the bare numeral names two different instruments.' The companion prints no sweep: the strings 'p. 599' and 'Rubricae generales n. 18' occur nowhere in the companion outside this References line itself, and the sixth unit of its commentary (companion p. 10) cites only cap. IV n. 18 at p. 709. I swept the whole file for the same shape this round and this is the only remaining instance: the Schuster, Guéranger and Hesbert entries were branched this round and each companion branch resolves against companion pp. 10 and 12, and the Wilson Gregorian folio mark [fo. 168v] and the Gelasian marginal sigla R. S. / Gerb. 175. / Pam. 411. / Men. 179. are locus identifiers for material the companion does carry at p. 10."
required_result = "If anyone chose to act on it: the clause at sections/99-references.tex lines 96-97 wrapped in \\ifdefined\\TriptychSynthesisEdition with the canonical rendering left byte-identical and the entry head, the Orationes pro diversitate Temporum abolentur title and the closing 'Read on a rendering of the Holy See's own scan' outside the branch, the companion branch saying that AAS 52 carries two distinct instruments numbered 18 and that this guide cites cap. IV n. 18 at printed p. 709, with the account of the confusion attributed to the canonical full edition. The repair would be inside sections/99-references.tex alone; no rubrical datum is to be added to the companion and sections/30-commentary.tex must not be edited."
accepted_because = "Unlike the Hesbert clause, which told a companion reader that eight loci had been reached in support of nothing he could find in his book, this clause carries its own content: it names both instruments and both printed pages, so the bare-numeral hazard it exists to guard against is legible in the entry itself in either edition, and nothing in it is a pointer that fails to resolve. The companion's reader is not misled and is not sent anywhere. Branching it would trade one true sentence for another in settled terminal apparatus -- which is the same judgement this run's revision made explicitly for the Anthony of Padua entry, and the judgement it appears to have made silently here."

