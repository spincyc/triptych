problem = "A thin unit resting on a single reception witness, whose two load-bearing passages are reprinted from the commentary. Its first paragraph (lines 123-127) restates the Epistle subsection's \"Both of the lesson's boundaries fall just clear of the cross\" with both Clementine quotations (30-commentary.tex 299-302; 12- and 11-word runs); its second (lines 131-136) prints whole the Ambrose Expositio V.90 quotation spem resurgendi habebat ... per crucis patibulum refundendam that the Ambrose witnessnote prints whole at 642-646 (13- and 16-word runs). Ambrose is the only witness the unit draws on, where the criterion asks that each unit draw on more than one. What is C4's own -- that no appointed element prints the word, that the Communion stops before the discourse says how the flesh is given, that the pericope puts a visitation and three petitions where the word would stand -- is three sentences."
required_result = "C4 is removed, or rebuilt so that it draws on at least two checked witnesses -- the commentary already holds Bede's bier and bearers at 30-commentary.tex 695-712, Augustine's Sermo 98 at 662-672 and Cyril's touching of the bier at 683-690 -- and states the cross's absence and its patristic supply without reprinting the Epistle-boundary sentences or the Ambrose V.90 quotation whole; those keep their fullest home at 30-commentary.tex 299-302 and 642-646, and C4 cites the locus and quotes at most a phrase."
