note = "Both halves are false of the appointed Latin the leaf prints: the Alleluia at sections/05-appointed-text.tex lines 160-161 reads 'Quóniam Deus magnus Dóminus, et Rex magnus super omnem terram', two magnus predications inside the one versicle, and the Gospel at lines 189-190 adds 'prophéta magnus', making three across the two elements; and the Alleluia and the Gospel are the leaf's own appointed elements 5 and 6 and so consecutive, not four apart. The leaf's P2 Mechanism at sections/50-interpretive.tex lines 52-58 has been rewritten and now names the two phrases without asserting a total, so the defect survives only in the brief."

