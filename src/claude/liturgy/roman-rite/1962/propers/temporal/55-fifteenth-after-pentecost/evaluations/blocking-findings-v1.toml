problem = "The Hadrianum section number is written down wrong. The registered page image of Wilson's printed p. 174 -- artifact.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915.ia-page-image-leaf-231-ad3bbaac, whose bytes are tracked in this repository at src/sources/works/catholic-church/sacramentarium-gregorianum-hadrianum/editions/wilson-1915/artifacts/ia-page-image-leaf-231-ad3bbaac/leaf-231.jpg and which was read for this evaluation with the numeral enlarged three times -- prints at the head of the Mass carrying this formulary's three orations 'a/XXXIIII.    DOMINICA .XVI. POST PENTECOSTEN.    [fo. 168v', and at the next Mass on the same page 'bXXXV.    DOMINICA .XVII. POST PENTECOSTEN.' The superscript a and b are the footnote markers keyed to the two chant notes at the page foot ('a Ant. Iustus es domine. Resp. Unam petii a domino...', 'b Ant. Da pacem domine...'), and the '/' is the manuscript line mark Wilson also sets at 'ut /eius mereamur esse participes . [fo. 169' lower on the same page; neither belongs to the numeral, and no C stands before either number, which at that magnification is not a bowl but a thin straight diagonal unlike the C of DOMINICA on the same line. The printed page 174, the heading and the folio mark [fo. 168v] are right and are not at issue, and neither are the readings the same page settles and the guide reports from it -- 'contra diabolicos tueantur semper incursus' and 'possideat quaesumus domine', both confirmed on the image. The witness is held and its bytes are tracked; no retrieval is needed. The leaf inherited the numeral (CON-CIT-035b)."
required_result = "Section 1.1 gives the Hadrianum section as Wilson's page prints it, XXXIIII, or cites the Mass by its heading, printed page and folio mark without a section number; no 'CXXXIIII' remains anywhere in the brief."
repair_target = "brief"

