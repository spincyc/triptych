location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/proper-components.toml lines 25-32 ([[components]] key = \"appointed-text\", path sections/05-appointed-text.tex) and lines 34-41 (key = \"per-element-sweep\", kind = \"proper-treatment\", path sections/30-commentary.tex), both standing ahead of lines 43-50 (key = \"brief-synthesis\", path sections/20-themes.tex), read against guidance/liturgy/roman-1962-propers.md lines 162-163 (the manifest declares \"every ordered component\"), lines 168-171 (\"The two editions differ in which components they contain, never in the order those components appear. Sequence is stated once, in Reader-Facing Order below\") and lines 246-267, whose list puts `The Propers: Themes and Movement` at position 3, the complete appointed text at 4 and `The Propers: Detailed Commentary` at 5, and whose line 267 reads \"Positions 4 and 5 follow the thematic movement and never precede it.\""
problem = "The leaf's ordered component graph declares a reader order the profile forbids. The nine [[components]] tables stand in the file as orientation, appointed-text, per-element-sweep, brief-synthesis, integrated-commentary, source-grounded-synthesis, notable-and-quotable, exploratory-synthesis, terminal-apparatus, so the two components at reader positions 4 and 5 are declared ahead of the component at position 3, which the profile settled on 2026-08-20 and states categorically at line 267 and again at lines 270-271 (\"a guide that front-loads either ahead of it is non-conforming\"). The array order is the manifest's statement of sequence and not a dependency order: `depends_on` carries the dependencies separately, and `tools/check-proper-components` lines 245-262 read the same array as reader order when it enforces brief-synthesis before integrated-commentary before source-grounded-synthesis before notable-quotable before exploratory-synthesis, citing the profile's Reader-Facing Order for the last pair. That gate is the reason the defect has stood: its `ordered` list names only those five kinds, so appointed-text and proper-treatment are unmeasured, and running it and check-content-preflight for this evaluation reports no fault. The built canonical edition is correct at every page (map p. 1, the dossier sheet alone on p. 2, the thematic movement filling pp. 3-4, `The Appointed Formulary in Full` opening p. 5, the detailed commentary p. 10, the source-grounded synthesis p. 22, the gallery p. 24, the proposals p. 26, the scope appendix p. 28, References p. 32 and the terminal metadata on p. 35), because main.tex lines 21-30 fix the input order itself and the manifest drives nothing in the build; the defect is in the tracked declaration of the leaf's structure and not in what a reader sees. The last authoring pass touched this file for exactly this rule and stopped short of it: generation-metadata.tex records \"the component manifest set in the profile's reader order\", and the change made under that sentence, at commit 3acca06c9, only swapped notable-and-quotable ahead of exploratory-synthesis, which is the half the gate measures."
required_result = "The [[components]] tables of proper-components.toml stand in the profile's Reader-Facing Order, with brief-synthesis (sections/20-themes.tex) ahead of appointed-text (sections/05-appointed-text.tex) and per-element-sweep (sections/30-commentary.tex): orientation, brief-synthesis, appointed-text, per-element-sweep, integrated-commentary, source-grounded-synthesis, notable-and-quotable, exploratory-synthesis, terminal-apparatus. Every key, kind, path, modes, depends_on, element_keys and references value stays exactly as it is - only the order of the tables changes - and the generation-metadata sentence claiming the manifest is set in the profile's reader order is then true."
repair_target = "authoring"

