[[findings]]
id = "CON-EVI-051"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/90-scope.tex lines 76-77 (built canonical edition p. 29: 'Of the four the Communion is a genuine negative --- no English witness examined renders either reading distinctly'), against src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/05-appointed-text.tex lines 234-247 (built p. 8, the Offertory gap block: the 1861 hand missal is 'half a help here ... following the Douay at the first two and the missal at the third') and lines 46-54 (built p. 5, the Introit gap block, which names no English witness at all for the added ad me)."
problem = "One evidence bound stated at two strengths in one edition, and the appendix's form is the stronger. The sentence enumerates four sung elements at which the Douay has no counterpart - the Introit's ad me, the Alleluia's super omnem terram, the Offertory's three departed phrases, the Communion's dédero and sǽculi - and then says that of the four only the Communion is a genuine negative, defining a genuine negative in its own next clause as a reading no English witness examined renders. That singling-out asserts of the other three that some English witness examined does render them, and the leaf's own pages carry that only for the Alleluia, where p. 7 prints the 1861 book's 'a great King over all the earth' from printed p. 428. For the Offertory the leaf says the opposite two pages earlier: p. 8 states that the 1861 follows the Douay at et respéxit me and et exaudívit deprecatiónem meam and the missal only at hymnum, so on the guide's own showing no English it names renders the first two, and the one witness that does answer all three - Keating 1806 - is recorded in research/scope.md section 11 item 4 and appears nowhere in the leaf except in the Communion bullet at 90-scope.tex line 169. For the Introit's added ad me neither the leaf nor the brief records any English witness that renders it: verified.md's Rights item 4 records only that the Douay's Ps. 86:1 has no 'to me', the brief's coverage result (research/scope.md lines 2417-2427) names which witness answers which phrase for the Alleluia, the Offertory and the Communion and does not reach the Introit, and 90-scope.tex line 166 answers only the Greek, 'Nothing in Swete answers the Introit's added ad me'. So two of the four are presented as closed gaps on no record, and one of those two is contradicted by the appointed-text section of this same edition. The strength the record supports is that the Alleluia's gap is closed by an identified English printed at that element, the Communion's is answered by none of the five English witnesses examined, and the Introit's ad me and the first two of the Offertory's three phrases are answered by no English this guide names."
required_result = "The appendix sentence states the evidence state each of the four gaps actually has, so that p. 5, p. 7, p. 8 and p. 29 agree: the Alleluia's gap closed by the 1861 book's rendering the appointed-text section already prints; the Communion's answered by none of the English witnesses examined, as the negative-results bullet at 90-scope.tex lines 168-171 already says; and the Introit's ad me and the Offertory's et respéxit me and et exaudívit deprecatiónem meam answered by no English witness this guide names. The list of the four Douay gaps, the untranslated-cues clause beside it and the Communion bullet are unaffected and stand."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-052"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/35-source-grounded-synthesis.tex lines 90-93 (built canonical edition p. 23, C3: 'The Sixteenth Sunday takes both the Introit's psalm and the Offertory's up where this Sunday leaves them --- Ps.~85 at v.~3 with v.~1 as its verse, Ps.~39 at vv.~14--15 --- so this Mass sings the head of both psalms and the next their continuation'), with src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 261-266 (built p. 13: 'Ps.~85:3 is also the Sixteenth Sunday's Introit incipit and Ps.~85:1 its psalm verse ... the head of the psalm here and its continuation a week later')."
problem = "A source-grounded conclusion that the loci printed beside it contradict, because the record is reported short by one verse. The registry the passage cites, src/sources/calendars/roman-1962/propers.yaml under key pentecost-16, gives the Sixteenth Sunday's Introit as Ps. 85:3 and 85:5 with Ps. 85:1 as its psalm verse, and I confirmed the same extent independently on the tracked Vatican typica 1604 optical layer at line 38,687 and following, which prints that Sunday's antiphon as 'Miserere mihi Domine, quoniam ad te clamavi tota die: quia tu Domine suavis ac mitis es, et copiosus in misericordia omnibus invocantibus te' - Ps. 85:3 and 85:5 - with 'Psalm. Inclina Domine aurem tuam mihi, et exaudi me' as its verse. The brief states the full extent at research/scope.md line 2022, 'pentecost-16 Introit Ps. 85:3, 5 with v. 1 as psalm verse'. The leaf prints v. 3 alone at both places, and on that reduced datum the conclusion is false rather than merely thin: this Sunday's antiphon already sings vv. 1, 2b and 3 with v. 4 as its psalm verse, so a Sixteenth Sunday singing only v. 3 with v. 1 as its verse repeats what this Sunday sings and continues nothing, and 'takes up where this Sunday leaves them' and 'the next their continuation' are carried entirely by the v. 5 the leaf does not print. The Ps. 39 leg is sound: this Mass sings vv. 2-4 and the Sixteenth vv. 14-15."
required_result = "Both passages give the Sixteenth Sunday's Introit at the extent the registry and the brief hold - Ps. 85:3 and 5, with Ps. 85:1 as its psalm verse - so that the continuation the two sentences assert rests on the verse that carries it; or the continuation claim is narrowed to the Offertory's Ps. 39, which the printed loci do support. The registry bound already stated at both places, the Ember-Friday Ps. 85:2 clause, the Ps. 39 vv. 14-15 leg and the Twelfth and Ninth Sunday clauses are unaffected and stand."
repair_target = "authoring"

[[findings]]
id = "CON-SYN-001"
lane = "synthesis-argument"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/20-themes.tex lines 21–23, 40, 56–58, 84–87, 87–90, 140, 145–147 and 149–150 (built canonical edition pp. 3–4), each against the same quotation in src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex — lines 222–224 and 233–235 (built p. 13, the Introit's Augustine and Cassiodorus witnessnotes), 281–283 (built p. 13, the Collect subsection), 425–427 (built p. 15, the Epistle's Aquinas witnessnote), 683–686 and 691–694 (built p. 18, the Gospel's Cyril witnessnote), 820–822 (built p. 20, the Offertory's Ambrose witnessnote) and 936–938 (built p. 21, the Communion's Aquinas witnessnote)."
problem = "Eight witness quotations are printed twice in this edition, once in the thematic movement and once in the detailed commentary, which is the criterion's own defect (\"a quotation printed whole in both\"). Pair by pair, with the themes locus first: (1) Augustine, `quia munera ipsius sunt, non merita tua`, at themes line 57 and commentary lines 282–283, and printed whole in both, under the identical framing \"expounding the Gradual's own psalm\" and to the identical point about progress and merit; (2) Augustine, `humiliato enim appropinquat; ab exaltato longe discedit`, at themes line 40 and inside the commentary's longer `Inclinat aurem, si tu non erigas cervicem: …` at lines 222–224; (3) Aquinas, `in hac vita, quae est tempus seminandi`, at themes lines 149–150 and inside the commentary's `dum tempus habemus, id est …` at lines 425–427; (4) Aquinas, `Christus tactu suo sanabat infirmos`, at themes lines 89–90 and at the close of the commentary's Aquinas quotation at lines 937–938; (5) Ambrose, `non est perfecti exspectare, sed exspectasse`, at themes lines 146–147 and as the head of the commentary's longer quotation at lines 821–822; (6) Cassiodorus, `totius vitae tempus ostenditur`, at themes line 140 and as the head of the commentary's longer quotation at lines 233–234; (7) Cyril, “He draws near without being invited” and “of His own accord”, at themes lines 22–23 and inside the commentary's Cyril quotation at lines 684–686; (8) Cyril, “the body of life”, at themes line 86 and inside the same witnessnote at line 692. The profile's sentence at guidance/liturgy/roman-1962-propers.md line 332 requires repeated quotations removed, and this leaf demonstrably knows how: the Source-Grounded Synthesis points at its homes instead of reprinting them (C4 at sections/35-source-grounded-synthesis.tex lines 120–122 defers Cyril's touch to \"the third unit of the thematic movement\", C1 at lines 9–10 defers the divergence table to the commentary), and themes unit 3 renders Augustine's `Tract. in Io.` 26.13 into English rather than reprinting the commentary's Latin. The page-1 four senses at sections/00-map.tex line 28, which also carries “the body of life”, is required to ground each sense in appointed text or documented reception and is not part of this finding."
required_result = "Each of the eight quotations is printed at one place in the canonical edition and stated by attribution at the other, so that no witness's words are set out twice. The commentary's element witnessnote is the fullest home for the witness's own words in pairs 2–8 — that is where the profile puts the exegesis and reception that prove the synthesis — so the thematic movement states and attributes each reading in its own prose, or points to the subsection, without reprinting the Latin or the translated phrase; the arguments of themes units 1, 3 and 5 stand unchanged, since each already says in English what the quotation shows. Pair 1 is the exception: the commentary Collect passage prints `quia munera ipsius sunt, non merita tua` with no locus while themes line 57 gives `En. Ps.` 91.3 and develops it, so the quotation stays in themes unit 2 and sections/30-commentary.tex lines 281–283 makes the Collect's point about `Tuo semper múnere` by attribution alone. No locus, evidence bound or qualification is dropped in the process, and the reading attributed at each place stays the reading the witness holds."
repair_target = "authoring"

[[findings]]
id = "CON-SYN-002"
lane = "synthesis-argument"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/20-themes.tex lines 118–124 (built canonical edition p. 4, \"The orations move with it…\"), lines 43–46 (built p. 3, \"The Gradual pairs the mercy with truth…\") and lines 109–111 (built p. 4, \"At the Offertory's psalm he answers the question of the speaker outright…\"), against src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 972–977 (built p. 22, the Postcommunion subsection), lines 458–460 (built p. 15, the Gradual subsection) and lines 812–814 (built p. 20, the Offertory's Augustine witnessnote)."
problem = "Three substantial claims are met at full strength in both of these sections, which the criterion's closing clause forbids. (a) The narrowing of the three orations: themes lines 118–124 reads \"Their objects narrow from `Ecclesiam tuam` to `nos` to `mentes nostras et corpora`, while their verbs go from cleansing and fortifying to guarding and defending to possessing and going before … Objects narrowing across a Mass is a common euchological shape, and this formulary is one instance of it rather than its inventor\", and commentary lines 972–977 reads \"Read across the three orations, the objects narrow — `Ecclesiam tuam`, then `nos`, then `mentes nostras et corpora` — while the verbs move from cleansing and fortifying, through guarding and defending, to possessing and going before. Each oration's object is largely determined by its ritual slot, so the narrowing is as much a property of the euchological genre as of this formulary.\" Same three objects, same three verb pairs, same controlling limit, eighteen pages apart, and the commentary paragraph adds nothing the themes paragraph lacks. (b) The Gradual's collocation: themes lines 43–46 states that `misericordiam tuam et veritatem tuam` is carried by the tracked Clementine \"at three psalms only, and two of them, Ps. 39 and Ps. 91, are psalms this Mass sings from\", which is the whole of the claim commentary lines 458–460 makes with all three loci named. (c) Augustine on the Offertory psalm's speaker: themes lines 109–111, \"he answers the question of the speaker outright, Christ speaking now as our Head and now as ourselves, his members\", is commentary lines 812–814, \"he answers the question of the psalm's speaker outright: it is Christ, speaking now in the name of our Head and now of us who are his members\", almost word for word. The page-2 dossier row at sections/10-date-location.tex lines 21–22 and the English-gap block at sections/05-appointed-text.tex lines 309–311 also touch (c) and the Postcommunion's held-back subject, but the profile requires those sections to carry claim-local sources and to say what the registered English leaves of the Latin unanswered, so neither is part of this finding."
required_result = "Each of the three claims stands at full strength at one place and is used, not re-established, at the other. (a) The cross-oration narrowing has its fullest home at themes lines 118–124, which is where it does work — it carries unit 4's conclusion that the singular of the chants and the plural of the prayers are one body addressed at closer range — so the recap at sections/30-commentary.tex lines 972–977 goes, the Postcommunion subsection keeping its own contribution, the held-back subject and the pointing at lines 964–970; the forward pointer at line 865, \"the objects continue to narrow at the Postcommunion\", is redirected so that it does not dangle. (b) and (c) have their fullest homes in the commentary, at lines 458–460 and 812–814, which carry the three Clementine loci and the section context; themes lines 43–46 and 109–111 keep the fact they need and drop the re-establishing of it, the collocation named as the Gradual's pairing of mercy with truth without recounting the psalms, and Augustine's reading of the Ps. 39 speaker attributed without restating the commentary's sentence. Every locus, count and evidence bound now carried survives at the home that keeps the claim."
repair_target = "authoring"

