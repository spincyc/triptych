location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/05-appointed-text.tex line 244 (built canonical edition p. 8), the Offertory English-gap block: the 1861 hand missal 'following the Douay at the first two and the missal at the third'; the same characterisation at propers/verified.md lines 823-826."
note = "Restated, and re-established this iteration from the records themselves: the tracked Douay reads 'And he heard my prayers' at Ps. 39:3, plural, which is exactly what the leaf prints in the Offertory's namedtranslation at line 227, while the 1861 book prints 'and he heard my prayer', singular, as the leaf quotes it at line 243 and as propers/verified.md line 825 transcribes it from the registered scan; the antiphon's `deprecationem meam` is singular, so at the second of the three phrases the 1861 takes the Douay's verb with the missal's number and matches neither exactly. The English the leaf quotes is exact at both witnesses and criterion 8 is met; whether a characterisation of the relation between two witness texts is true is neither a citation nor a count, and this is the fourth consecutive iteration it has arrived with no owner."

