location = "sections/20-themes.tex, units 1, 3, 4 and 5 (built PDF pp. 3-4), each passage against the passage of sections/30-commentary.tex named in the problem. main.tex line 23 inputs the section unconditionally."
problem = "Witness quotations are printed whole in both the brief synthesis and the commentary: 204 of the section's 1,681 words (12.1%) sit in verbatim runs of ten or more words shared with 30-commentary.tex, and the runs are the quotations themselves. Unit 3 lines 84-89 print Cyril's \"that thou mightest learn ... annihilates the influence of death and corruption\" in 52 consecutive words identical to the Cyril witnessnote at 685-689; unit 3 lines 90-92 print Augustine's De Spiritu Christi non vivit ... ut vivificetur, which the Tract. 26 witnessnote prints whole at 892-895; unit 4 lines 104-107 print qui et oret pro nobis ... oretur a nobis and Unus homo usque in finem saeculi extenditur, both whole at 214-218; unit 4 lines 108-109 print \"it is Christ, speaking now in the name of our Head and now of us who are his members\", 21 words identical to 804-805; unit 4 lines 111-114 print Cassiodorus's Ex forma servi ... supplicat Patri and Ecclesia catholica ... patientiae virtutem praedicat, whole at 226-228 and 829-830; unit 5 lines 138-141 print Augustine's Mane dicitur ... lauda veritatem whole as at 469-471; unit 5 lines 143-146 print Ambrose's non est perfecti exspectare ... salvus erit together with the identical Matt. 10:22 tag of 813-815 (16- and 17-word runs); unit 1 lines 43-46 repeat the misericordiam et veritatem collocation sentence of 452-456 word for word. In each pair the commentary's witnessnote is the fullest home: it carries the locus, the surrounding argument and the edition state."
