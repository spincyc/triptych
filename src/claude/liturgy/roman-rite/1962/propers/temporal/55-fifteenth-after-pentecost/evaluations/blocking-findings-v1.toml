location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/00-map.tex line 27 (built canonical edition p. 1, the Moral row of 'The four senses': 'Jerome, Augustine and Aquinas make Gal. 6:1 a discipline of the corrector before a remedy for the corrected'), against the Aquinas witnessnote at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 413-428 (built p. 15) and the summary sentence at lines 430-435 of the same file (built p. 15)."
note = "New this iteration. Page 1 puts Aquinas with Jerome and Augustine on the corrector side of the Gal. 6:1 disagreement, while the Epistle's own Aquinas witnessnote on p. 15 presents him reading the verse from the side of the corrected (praeoccupatus as overtaken by surprise, in aliquo excluding the habitual sinner, instruite and not corrigite) and the sentence closing that subsection names only Jerome and Augustine on the corrector side; the one Aquinas sentence that grounds the page-1 grouping, 'Nihil autem ita frangit hominis severitatem in corrigendo, quam timor proprii casus', reaches the built edition only as an English paraphrase inside P1 of the exploratory section (built p. 26), under a studyframe that tells the reader nothing below it is documented reception. The attribution is true -- the brief holds the sentence at scope.md line 1880 -- so criterion 11 is met, and the disagreement itself is present and attributed to the sources that hold it, so criterion 6 is met; what differs between two sections is the roster of a reading, not a bound or an attribution, and criterion 1's same-bound question and my criterion 6 both stop just short of it."

