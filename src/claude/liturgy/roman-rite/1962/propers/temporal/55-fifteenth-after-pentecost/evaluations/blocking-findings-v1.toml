required_result = "At all four sites `independently` is removed or replaced by what is verified (that Cassiodorus also states the reading, in his own words), and the sentence at 20-themes.tex lines 111-112 no longer infers independence - 'two Latin commentators state it' or the like. The witnessnotes keep their quotations."
