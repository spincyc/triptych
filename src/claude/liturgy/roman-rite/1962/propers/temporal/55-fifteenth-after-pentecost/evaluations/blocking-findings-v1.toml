[[findings]]
id = "CON-SYN-005"
lane = "synthesis-argument"
severity = "blocking"
location = "sections/50-interpretive.tex lines 112-141, proposal P4 \"Four different operations on the extent of what is read or sung\" (built PDF pp. 27-28), against sections/30-commentary.tex lines 30-60 (the divergence subsection and table), 199-201, 579-582, 770-772 and 871-872."
problem = "The proposal restates the detailed commentary with its fields filled in. Its Mechanism is four facts the commentary already states one by one -- the Introit's three-segment cento in the commentary's own words (30-commentary.tex 199-201: \"a three-segment centonisation: v. 1a as far as exaudi me, then v. 2b from salvum fac, then v. 3 entire\"; 13-word verbatim run), the Offertory's excised middle (770-772; 11-word run), the Communion's dropped half-verse (871-872) and the Gospel's substituted incipit (579-582) -- and the divergence subsection at 38-40 already groups them: \"four extents cut, the lesson's prefixed address, the Gospel's substituted incipit\". What P4 adds is four labels, cento, excision, halving, substitution. No relation between the four elements is proposed -- nothing in one element's cut bears on another's -- so the Mechanism is a classification of four independent facts, the Fruit (\"a better instruction in how to read any Mass\") is the generic application the profile rejects, and the Strongest limit concedes the point: \"the pattern is a description of what the 1962 book prints and not evidence of an act of composition\". A description of the divergence table is a recap, not a discovery; P5 in the same section shows the difference, relating one element's cut to another element's word."
required_result = "P4 is removed, leaving five proposals within the profile's four to six, or is replaced by a proposal whose mechanism is a relation between at least two appointed elements that neither the commentary nor the synthesis states, drawn from a conjunction the brief's section 8 or 8.1 reached (research/scope.md lines 1826-1996) so that its precedent classification is already recorded; the four extent facts keep their one home in the commentary's divergence table and element subsections."
repair_target = "authoring"

[[findings]]
id = "CON-CIT-027"
lane = "citation-integrity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/90-scope.tex lines 67-70, subsection \"Published text, English, and rights\", the sentence \"Three places where the registered English does not answer the Latin are declared at their elements and left open: the Alleluia's super omnem terram, the Offertory's three departed phrases, and the Communion's dédero and sǽculi.\" Rendered at built page 30. main.tex line 34 inputs the file unconditionally."
problem = "The stated count is short of what the leaf itself declares. The appointed-text section prints a \"Where the registered English does not answer the Latin\" block under every element, and beyond the three the appendix names it declares, in the same terms, at least three further places where the registered English has no counterpart to the Latin printed above it: sections/05-appointed-text.tex lines 49-51 at the Introit (\"Ad me is added at v. 1 and the Douay's 'Incline thy ear, O Lord, and hear me' has no counterpart for it\", built page 5), lines 120-123 at the Epistle (\"Fratres: at the head is the lesson's added address ... with no counterpart in the Douay\", built page 6), lines 207-210 at the Gospel (\"the missal's opening is its own and has no Douay counterpart\", built page 8), with the Secret's and Collect's conclusions \"untranslated there\" at lines 263-265 (built page 9). The Introit's ad me is not a liturgical cue but one of the eight word-level chant departures the leaf itself counts at built pages 10 and 22, where sections/35-source-grounded-synthesis.tex says \"Nothing in Swete answers the Introit's ad me either\"; propers/verified.md, under \"Declared places where the registered English does not answer the Latin\", lists seven items and puts the Introit's ad me at item 4 (\"with no 'to me'\"). So a reader who turns from the appendix to the elements finds the leaf declaring more than the three places the appendix says it declares. This is a count the leaf states about its own material and its own material contradicts it. The brief's sentence at research/scope.md section 11 item 4 (\"Three places ... are declared in propers/verified.md\") is scoped to the three chant readings for which COV-009 sought a substitute English witness and is not the source of the defect; the leaf's sentence generalises it to every declared place, which is where it becomes false."
required_result = "The number is wrong and the list is incomplete; the leaf's element declarations are right and stand. sections/90-scope.tex lines 67-70 state a figure that agrees with what sections/05-appointed-text.tex declares, either by counting every declared place (the Introit's added ad me alongside the Alleluia, Offertory and Communion readings, with the missal's own untranslated address, incipit and conclusion cues named as a class or counted in) or by narrowing the sentence's subject so that \"three\" is true of what it then names, for example the three elements whose sung wording departs substantively from the Bible text and for which the coverage sweep sought another English witness, without asserting that only three places are declared at the elements. Whichever form is chosen, the sentence must not say that three places are declared when the appointed-text section declares more. No retrieval is required and no correction to the brief is required: propers/verified.md's seven-item list of declared places and the leaf's own englishgap blocks hold every fact the repair needs."
repair_target = "authoring"

