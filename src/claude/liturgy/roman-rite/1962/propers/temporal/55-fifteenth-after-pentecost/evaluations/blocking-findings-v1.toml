note = "Third restatement of a sighting no lane's criteria reach, re-checked at this iteration; the file is in REVIEW_SCOPE this round because the timestamp was refreshed and a twentieth contribution record appended at line 20. (a) Line 3 still describes the first authoring pass as producing \"its twenty witness dossiers\", \"the six cross-proper claims of the source-grounded synthesis\" and \"the six audited interpretive proposals\", where the leaf now carries 23 \\witnessnote blocks, four claims C1-C4 and five proposals P1-P5; its \"five audited notable-and-quotable entries\" is right. The figures may be accurate history of what that pass wrote. (b) The records are not in chronological order: lines 18-20 record this run's proper-finish v6 authoring and two content revisions, and lines 21-26 record six earlier claude-fable-5-1 passes of proper-finish v5, which stand after them. Grouping by model may be deliberate. Nothing in this stage decides either question, and that is the point of recording them: guidance/editorial.md line 326 makes model identity and contribution history non-reader-facing (\\AIModelContribution renders only the revision timestamp, src/common/preamble.tex lines 82-89), so criterion 14 does not reach the file, and criterion 10 names only propers/verified.md, propers/retrieved.txt and research/scope.md, so the profile's own requirement at line 392 that generation metadata be accurate is owned by nobody in this stage. A lane of the previous production and this lane at iterations 0 and 1 recorded the same class for the same reason. This is a missing criterion in some lane's fragment and not a fact about this document."

