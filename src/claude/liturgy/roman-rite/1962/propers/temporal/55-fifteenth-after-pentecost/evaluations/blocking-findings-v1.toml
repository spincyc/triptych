location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md line 1892, section 8 IP-2 'Mechanism': \"the two `magnus` predications stand four elements apart\"."
note = "Restated, unchanged. The Alleluia and the Gospel are adjacent in the rite with nothing between them, and the leaf's P2 says so at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/50-interpretive.tex line 53 (built p. 27, 'the Gospel that follows it directly'); the brief's count is wrong and the leaf is right. Same unowned class as the observation above."

[[observations]]
lane = "synthesis-argument"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md line 1965, section 8 IP-5 'Mechanism': \"Two cuts in one Mass stop one clause short of the same theme, and the Secret then prays the word one of them withheld\"."
note = "Restated, unchanged. The Offertory's cut withholds hope and the Introit's withholds guarding -- two themes and not one, as the brief's own next sentences at lines 1966-1972 show -- and the leaf's P4 reads 'each withhold a word that another element of the same Mass carries' at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/50-interpretive.tex lines 114-116 (built p. 28) and must not be conformed back. This is the fifth consecutive evaluation at which this lane has recorded a brief sentence the leaf was right not to inherit, and I say again what the fragments invite: the recurrence is a missing criterion in the shared list rather than a fact about this document. No criterion reaches a defect in `research/scope.md` that the leaf did not take up, so nothing routes it to `brief-revision`, the one stage that may write the file."

[[observations]]
lane = "synthesis-argument"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/50-interpretive.tex lines 133-138 (built canonical edition p. 28), P4's 'Strongest limit': \"Ps.\\ 39:5 reads `spes ejus`, so it is a hope-beatitude in another grammar and must not be counted as a further instance of that formula.\""
note = "Restated, unchanged. The prohibition guards a tally this edition never makes. src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md lines 1978-1982 shows where it comes from -- the brief's controlling limit for IP-5 says that `claude/54`'s P4 'restricts itself to the exact formula `beatus ... qui sperat` and counts exactly two Clementine verses', so citing Ps. 39:5 as a third instance 'would misstate its count' -- and the leaf carried the sentence across without the sibling leaf that owns the count, leaving a reader of this edition told not to add to a formula's instances that no passage of this edition enumerates. Not a finding of mine: my criterion 5 asks whether the mandated limit field is present and does the work the profile asks of it, and it is and it does, the first and third limits in the same field being material and self-standing. Recorded because the defect is a self-reference to material outside the built edition, which sits between criterion 5 and criterion 14's 'cross-reference to a section that does not carry what it is said to carry', and neither plainly owns a reference whose target is another leaf."

[[observations]]
lane = "citation-integrity"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md line 583 (section 2.4, \"returning to `Hodie si vocem eius audieritis` four times at Heb. 3:7-11, 3:15, 4:3, 4:5, 4:7\"); lines 965 and 972 (section 2.8, 'Four further witnesses number the Mass and disagree by one' above a list of five names, and 'the three prayers all four numbering witnesses carry'); lines 1700 and 1708 (section 7, NQ-5, 'Paul sets the two sentences four verses apart' and 'Two sentences read aloud four verses apart')."
note = "Restated from the standing record, which is rewritten whole, and re-verified this iteration: three brief-internal miscounts, none of them inherited by the leaf, which is right at every one. Sweeping all 35,809 verses of the tracked Clementine for this evaluation returns `Hodie si vocem eius audieritis` at Ps. 94:8, Heb. 3:7, 3:15 and 4:7 only -- three places in Hebrews, which is what the leaf prints at 10-date-location.tex lines 84-85, 20-themes.tex lines 301-302 and 30-commentary.tex lines 520-522; the brief's own section 2.8 names Rheinau, S. Gallen, Gerbert, Menard and Pamelius, which is five on Wilson's `R. S. / Gerb. 175. / Pam. 411. / Men. 179.`, and the leaf counts five at 30-commentary.tex lines 127 and 136; and Gal. 6:2 to 6:5 is three verses, which is what the leaf prints at 40-notable.tex line 295. A stated count confined to the brief is reader-facing in neither edition, so criterion 7 does not reach it and no criterion in the shared list does. This is the fifth consecutive iteration the class has arrived unowned, and I say plainly as the fragment invites that it is a missing criterion rather than a fact about the document: only brief-revision may write research/scope.md, and nothing routes a brief-internal miscount there."

