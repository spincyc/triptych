note = "A second instance in this leaf of the class the observation above names, and I record it for that reason rather than as a defect I can substantiate. Both sentences agree with the lists they head -- four expositors are named and two Latin readings are named -- so under my criterion 7's own test (count what follows and check the two agree) neither is a miscount, and both follow research/scope.md lines 762-767 word for word; the leaf also justifies leaving Bede out of the four by saying at line 704 that he `takes Augustine's moral reading'. What a reader who counts nonetheless meets is five expositor entries under a heading summarised as four, and three Latin readings of the widow under a definite `the two'. The lane fragment's own examples include `a `both' against a list of three', which is this shape, but only where the number and its own list disagree; here they do not, and the material the number is incomplete against is the surrounding section rather than the sentence's list. I say plainly, as the fragment invites, that this and the observation above look like one missing criterion -- an enumeration or summary that is true of what it names and incomplete against the document's own material -- and not a fourth class of fact about this leaf."

