location = "sections/35-source-grounded-synthesis.tex, unit C1 lines 6-40 and unit C3 lines 86-113 (built PDF pp. 22-23), each passage against the passage of sections/30-commentary.tex named in the problem."
problem = "The units' cross-proper points -- C1's three-group taxonomy of the eight departures, C3's Lenten-reuse pattern -- are real synthesis, but the sentences that carry them stand at full strength in the commentary as well. In C1: lines 6-15 re-enumerate the eight departures and the three-missal bound that 30-commentary.tex lines 30-38 and the divergence table already print (22- and 23-word verbatim runs); lines 21-24 repeat the deeseos/hymnon sentence of 784-787 word for word (21 words); lines 29-34 restate the miserere mihi / ad me result of 239-247; lines 36-40 restate the dedero/saeculi result of 881-884. In C3: lines 100-104 reproduce the Gospel's Lenten-Thursday paragraph at 761-766 (22- and 15-word runs); lines 106-108 reproduce the Sixteenth-Sunday psalm-stock sentences of 253-259 (12- and 11-word runs) and lines 108-111 the Ps. 39/Ps. 69 sentence of 839-841; lines 90-95 reproduce the per-element registry notes at 505-508, 846-848, 949-950 and 256-257 (12-, 10-, 10- and 19-word runs). Fullest homes: for C1's four textual results, the commentary's divergence subsection and table at 30-60 and its Introit, Offertory and Communion subsections at 239-247, 784-787 and 881-884, C1 keeping the grouping and a pointer to the table; for C3's reuse pattern, C3 itself, which is the only place the pattern is stated, the commentary's per-element registry sentences at 253-259, 505-508, 761-766, 839-848 and 949-952 keeping only what C3 does not carry."
required_result = "Each named claim stands at full strength in exactly one of the two places. C1 states its three-group result and refers the reader to the divergence table and the element subsections for the enumeration and the Greek comparisons, or the element subsections drop the sentences C1 now repeats; C3 keeps the reuse pattern and the commentary's per-element registry notes shrink to a clause and a cross-reference, or the reverse. Re-running the same comparison finds no run of ten or more consecutive words shared between C1 or C3 and sections/30-commentary.tex other than the appointed Latin itself."
