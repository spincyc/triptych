required_result = "The maintainer is asked to decide whether the two `notes` fields are corrected in place -- naming `Tua nos, Domine, sacramenta custodiant` at marginal number 1589 and `Mentes nostras et corpora possideat` at marginal number 1591, both at printed p. 397 -- and, if so, how the fingerprint change is to be propagated to the bindings pinned to these records in this leaf and in any other leaf that cites them; or whether the erroneous verification notes stand and the correction is recorded elsewhere, as this leaf's propers/verified.md and research/source-bindings.toml already do."
escalated_to = "src/sources/works/eugene-cummiskey/roman-missal-english-laity/editions/philadelphia-1861/passages/post-pentecosten-15--secret.toml line 16 and src/sources/works/eugene-cummiskey/roman-missal-english-laity/editions/philadelphia-1861/passages/post-pentecosten-15--postcommunion.toml line 16"

