[[findings]]
id = "CON-EVI-033"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 63-66 (built edition p. 11), the paragraph after the divergence table: \"pointing at the joins, where the Introit runs \\\\latin{exáudi me: salvum fac} and the Gradual \\\\latin{Altíssime. ℣.~Ad annuntiándum} across what the Clementine sets as sentence ends\"."
problem = "False of the Bible text at the Gradual, and inverted: the tracked Clementine (chapters/Ps/91.json, read for this evaluation) prints Ps. 91:2 as 'Bonum est confiteri Domino, et psallere nomini tuo, Altissime:' with a colon and runs on into v. 3 'ad annuntiandum' in lower case; it is the 1962 book that sets the sentence end there, with a full stop and the versicle sign. propers/verified.md records exactly this at row 14 ('full stop and versicle sign for colon') and in its 'Two classes' paragraph ('the Gradual runs Altíssime. ℣. Ad annuntiándum where it has a colon'). At the Introit's first join the Clementine has a comma after 'exaudi me' and a semicolon before 'salvum fac' (rows 2-3), the sentence end 'ego.' lying inside the cut; the one join the leaf could name as a Clementine sentence end is the second, 'in te: miserére' (row 4, 'colon for full stop'), which the sentence does not cite. The leaf therefore tells the reader the Clementine's pointing at these two joins is the reverse of what its own record and the tracked Bible show."
required_result = "The sentence states the joins as propers/verified.md rows 3, 4 and 14 record them: at the Gradual the 1962 book sets a full stop and the versicle sign where the Clementine has a colon, and at the Introit the chant's colons stand at a cut that spans a Clementine sentence end (exáudi me: salvum fac) and at a Clementine full stop (in te: miserére); or the clause names only the join that is a Clementine sentence end. No retrieval and no change to the brief is needed; the record and the tracked Clementine hold every fact."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-034"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/50-interpretive.tex lines 116-117 (built edition p. 28), proposal P4 'What lies immediately past the cuts', the first sentence of the Mechanism field: \"Two cuts in one Mass stop one clause short of the same theme, and a prayer of the same Mass then asks for a word one of them withheld.\""
problem = "False of the two cuts as the proposal itself then describes them and as propers/verified.md records them. The Offertory's cut (row 29) stops short of Ps. 39:4b 'Videbunt multi ... et sperabunt in Domino' and Ps. 39:5 'spes ejus', which is hope, answered by the Introit's 'sperántem in te'; the Introit's cut (row 3) passes over Ps. 85:2a 'Custodi animam meam', which is guarding, answered by the Secret's 'custódiant'. The two cuts stop short of two different themes, each supplied by a different element, which is what the proposal's heading, its Fruit ('what its chants stop just short of singing') and its own second and third sentences say; only the thesis sentence claims 'the same theme', and nothing in the appointed texts bears that out."
required_result = "The thesis sentence states what the mechanism shows: two cuts in one Mass each stop short of a word or theme that another element of the same Mass carries, the Offertory's hope sung already at the Introit and the Introit's custodire asked at the Secret, without claiming that the two cuts stop short of one shared theme. No retrieval is needed; propers/verified.md rows 3, 4 and 29 and the leaf's own mechanism hold the facts."
repair_target = "authoring"

[[findings]]
id = "CON-SYN-006"
lane = "synthesis-argument"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/35-source-grounded-synthesis.tex lines 121-128, unit C4, the sentence 'Cyril reads the touch as instruction ... naming John Damascene for it (Super Ioannem cap. 6 lect. 6)' (built PDF p. 24), against src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/20-themes.tex lines 83-91, unit 3, 'One Father turns the noun in both places ... on a checked witness's own sentence' (built PDF p. 4). The quotations' home is src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 685-690 (Cyril on Luke), 906-914 (Cyril on John) and 928-933 (Aquinas), built pp. 18 and 21. main.tex lines 23 and 31 input both sections unconditionally."
problem = "A substantial claim stands at full strength in two synthesis sections of the canonical edition. Both passages make the same cross-proper join with the same two witnesses, the same loci and the same quoted phrases: Cyril's touching of the bier teaches that the holy body of Christ is effectual for salvation, the Word's flesh being 'the body of life' (Payne Smith, vol. 1, p. 135); Aquinas makes the same inference at the Communion's verse, naming John Damascene, in the words Christus tactu suo sanabat infirmos (Super Ioannem cap. 6 lect. 6); therefore the bier of the Gospel and the bread of the Communion are joined on a checked witness's own sentence. Unit 3 of the themes is the fuller home -- it also carries Augustine's Tract. 26.13 ecclesial half and the lemma bounds (dabo, pro mundi vita) -- and C4 adds only the Pusey heading, which the commentary's Cyril-on-John witnessnote already prints. The commentary's Aquinas witnessnote (932-933, 'That last clause reaches the Gospel of this same Mass') and Cyril-on-John witnessnote (911-913, 'the same doctrine Cyril states at the Gospel's bier') carry the join a third and fourth time. The rebuilding of C4 that cleared CON-SYN-003 produced this repetition; C4's own matter -- that no element prints the word for the cross, that Ambrose's wood of the bier is where the cross enters this Mass, and that a visitation and three petitions stand where the word would -- is real and is not the defect."
required_result = "The Cyril-touch / Aquinas-Damascene join is stated with its loci and its quoted phrases in exactly one of the two synthesis sections. Either C4 keeps one clause -- that the flesh which touches the bier is, on Cyril's and Aquinas's showing, the flesh the Communion sings, as unit 3 of the themes sets out -- and drops lines 121-128's loci and quotations; or unit 3 of the themes shrinks to the claim and a pointer and C4 becomes the fullest home, carrying Augustine's ecclesial half and the lemma bounds with it. Whichever is done, 'the body of life' and Christus tactu suo sanabat infirmos stand whole in the commentary witnessnotes and in at most one synthesis section, and re-reading the canonical edition finds the join argued with witnesses and loci in one place outside the per-element witnessnotes."
repair_target = "authoring"

[[findings]]
id = "CON-PRO-001"
lane = "profile-conformance"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/10-date-location.tex lines 15-16, 45-46, 71-72, 87 and 98-100 (built edition p. 2), the explanatory rows of the Offertory, Gradual, Gospel, Communion and Epistle dossiers."
problem = "The explanatory rows recur in describing the chronology apparatus and the sheet's own Date cells rather than stating the datings and the witnesses who hold them: Offertory, 'beside a later reckoning the article itself names, which is why the corpus marks it disputed' and 'the composition answer is one whole-Psalter boundary'; Gradual, 'so the Date cell carries no attribution, and the composition answer is again the whole-Psalter boundary'; Gospel, 'The two composition answers are both marked disputed and answer differently'; Communion, 'Both composition answers are marked disputed'; Epistle, 'Five composition answers stand within one traditional profile ... one preferred and four alternate, and the preferred one alone would misreport the received chronology'. 'Composition answer(s)' stands five times, 'marked disputed' or 'marks it disputed' three times, one sentence reports what the Date cell carries and one justifies why all five dates are printed, across five of the seven dossiers. That is the page-2 form criterion 12 names -- a dossier narrating the sheet's own conduct where the fact and the witnesses who differ would say it -- and it is a recurring habit, not a claim-local qualification. Every fact these sentences carry is required content and is not at issue: Corbett's usual chronology and the later reckoning his article names, the 1910 responsa, Drum's silence, the whole-Psalter bound and the critical judgment behind it, Durand against the 1912 responsa, Fonck against Durand, a Lapide's 58 against the alternatives in Aherne and Prat, and the absence of a modern critical date, which the sheet is right to state. The reference-point qualification on the Davidic reign at line 12 is a necessary claim-local qualification and is outside this finding. The rows were rewritten after the iteration-0 evaluation (generation-metadata.tex, last contribution), so no earlier id for this defect exists."
required_result = "Each of the five explanatory rows states its datings as facts about the passage and its witnesses, keeping every date, source, alternative, disposition and absence it now carries: the Offertory names Corbett's usual chronology and the later reckoning his article names without 'which is why the corpus marks it disputed', and gives the whole-Psalter bound as the critical judgment that no individual psalm can be dated securely rather than as 'the composition answer'; the Gradual says the title names no author and the only bound is the whole Psalter's; the Gospel and the Communion say that Durand gives about the year 70 and the 1912 responsa before the end of the Roman imprisonment, and that Fonck gives 96 or after and Durand 90-100, and that the two differ, without 'marked disputed'; the Epistle names a Lapide's 58 and the four alternatives with their sources without 'the preferred one alone would misreport the received chronology'. The phrases 'composition answer(s)', 'marked disputed', 'marks it disputed' and 'the Date cell carries' no longer stand in the explanatory rows; the statements that no modern critical date stands among the sources remain, as does the line-12 qualification that the reign is a reference point and not the psalm's date; the Date cells and research/chronology-annotations.tex are untouched; and the sheet still occupies exactly page 2."
repair_target = "authoring"

[[findings]]
id = "CON-PRO-002"
lane = "profile-conformance"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/format.tex lines 215-223, the canonical-arm \\editionnote (the \\else branch of \\ifdefined\\TriptychSynthesisEdition), printed by sections/90-scope.tex line 4 at built edition pp. 28-29: 'A mechanical synthesis companion is compiled from the same source at the same identity with a -synthesis suffix; it omits the appointed texts and the element-by-element sweep and adds nothing this edition does not contain.'"
problem = "False of the two builds. main.tex lines 25-30 print, under \\ifdefined\\TriptychSynthesisEdition, sections/synthesis/20-integrated-commentary.tex, a 320-line integrated 'The Propers: Detailed Commentary' that proper-components.toml lines 52-56 declare with modes = [\"synthesis\"] only, while the canonical edition this note describes prints the element-by-element sweep in its place and the integrated commentary nowhere. The companion therefore adds a whole section this edition does not contain, exactly as the profile requires of it ('replaces the sweep with a dedicated integrated The Propers: Detailed Commentary'), and the synthesis arm of the same macro (format.tex lines 205-213) itself lists 'an integrated cross-proper commentary' among the companion's contents. A reader of the canonical edition is told the companion is a strict subset of what is in hand and is not told that it carries a commentary this edition lacks. The statement is in the canonical arm and is this edition's own; nothing under sections/synthesis/ is at issue."
required_result = "The canonical-arm \\editionnote states the companion's contents as the manifest and main.tex build them: it omits the complete appointed text and the element-by-element sweep and replaces the sweep with an integrated cross-proper commentary the canonical edition does not print, while owning no prose, research record or source audit of its own. The clause 'adds nothing this edition does not contain' is removed or rewritten so that it is true of the build. The synthesis arm of the macro is not this finding's and is left alone."
repair_target = "authoring"

[[findings]]
id = "CON-PRO-003"
lane = "profile-conformance"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/90-scope.tex lines 72-75 (built edition p. 29): 'beside them stand the missal's own untranslated cues: the lesson's prefixed Fratres, the Gospel's incipit, and the conclusions of the Collect and the Secret, which the 1861 book leaves untranslated'; and src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/05-appointed-text.tex lines 263-265 (built edition p. 9), the Secret's 'Where the registered English does not answer the Latin' block: 'the long form the typical edition sets out to in unitáte. is untranslated there, as is the short Per Dóminum. at the Collect.'"
