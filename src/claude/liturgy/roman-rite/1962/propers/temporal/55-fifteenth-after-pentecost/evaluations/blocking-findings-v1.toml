[[findings]]
id = "CON-EVI-055"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/05-appointed-text.tex line 159, the \\begin{appointedlatin} caption of element 5 (built canonical edition p. 7: 'Allelúia — Ps. 94, 3 — marginal no. 1586'), against propers/verified.md line 283 ('**Printed form and reference:** no separate heading; the reference `Ps. 94, 3` ... is printed inline after the versicle sign') and against the same section's own preamble at lines 3-7 (built p. 5: 'the Latin of the Vatican editio typica exactly as the controlling facsimile has it, each element under its own printed heading, scriptural reference and marginal number')."
problem = "The canonical edition presents a printed heading for the Alleluia that the identified edition does not print. The caption apparatus of this section is, by the section's own preamble and by its use at the other nine elements, the book's printed heading followed by the book's printed reference and the marginal number: `Ant. ad Introitum` · `Ps. 85, 1 et 2-3`, `Oratio`, `Léctio Epístolæ beáti Pauli Apóstoli ad Gálatas.` · `Gal. 5, 25-26; 6, 1-10`, `Graduale` · `Ps. 91, 2-3`, `✠ Sequéntia sancti Evangélii secúndum Lucam.` · `Luc. 7, 11-16`, `Ant. ad Offertorium`, `Secreta`, `Ant. ad Communionem` · `Io. 6, 52`, `Postcommunio` — and each of those nine reproduces exactly the 'Printed heading and reference' field of the corresponding section of propers/verified.md. The Alleluia's field in that record is not of that shape: it reads 'no separate heading', and it records that the reference `Ps. 94, 3` stands inline after the versicle sign, which is where the leaf's own body correctly puts it ('Allelúia, allelúia. ℣. Ps. 94, 3 Quóniam Deus magnus Dóminus...'). The typical edition sets the chant directly under the Gradual with no rubric of its own, and the leaf's own machine pull of the second 1962 witness shows the same layout at propers/retrieved.txt lines 159-170, where `Graduale Ps. 91, 2-3 Bonum est...` is followed straight by `Alleluia, alleltiia. ℣. ps. 94, 3 Qu6niam...` with no heading line between. So a reader is told, by the uniform apparatus and by the preamble that governs it, that the 1962 typical edition prints `Allelúia` and `Ps. 94, 3` as this element's heading and reference. It prints neither; the word is the chant's own first word and the reference is inline. This is a departure from what the identified edition puts on the page, in the one section whose stated office is to reproduce it exactly, and the leaf's own text control declares the point in terms."
required_result = "Element 5 of sections/05-appointed-text.tex no longer presents a printed heading the Vatican typical edition does not print. Either the caption drops the fabricated heading and carries only what the book prints for this element — the marginal number, with the reference left where the book puts it, inline after the versicle sign in the body — or it marks the supplied label as the guide's own and says that the missal prints no separate heading here and prints the reference inline, as propers/verified.md line 283 records. Whichever form is chosen, the preamble's promise at lines 3-7 must be true of all ten elements as built: no caption may present as the book's printed heading a heading the book does not carry. The appointed Latin of the Alleluia, the inline `℣. Ps. 94, 3`, the marginal number 1586, the Douay verse beneath it and the English-gap block are unaffected and stand."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-056"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/05-appointed-text.tex lines 288-289 (built canonical edition p. 9, the Communion English-gap block: 'No registered public-domain English renders either reading distinctly') and sections/35-source-grounded-synthesis.tex lines 36-37 (built p. 22, C1: 'and no registered public-domain English renders either reading distinctly'), against sections/90-scope.tex lines 81-82 (built p. 29: 'the Communion's two readings are rendered distinctly by none of the five English witnesses examined') and lines 173-176 (built p. 31: 'no English witness examined — the tracked Douay, the Keating of 1806, the Cummiskey of 1861, the Lasance of 1945, Guéranger's 1909 volume — renders either distinctly')."
problem = "One evidence bound stated at two strengths inside the canonical edition, and the two point-of-use statements are the stronger. On p. 9 and again on p. 22 the guide asserts the negative over the whole class of registered public-domain English: no such English renders `dédero` or `sæculi` distinctly. On pp. 29 and 31 it bounds the same negative to five named witnesses actually examined. The record supports only the bounded form: research/scope.md states it three times and bounds it every time — line 953-954, 'no witness checked by the coverage lane — the tracked Douay, Keating 1806, Cummiskey 1861, Lasance 1945, Gueranger 1909 — carries a future perfect for `dedero` or renders'; lines 1218-1219, 'no English witness checked renders either distinctly — not the tracked Douay, Keating 1806, Cummiskey 1861, Lasance 1945 or Gueranger 1909 (COV-009)'; and line 2437, 'the Communion's `dedero` and `saeculi` are answered by none', inside a paragraph whose whole subject is which of those five witnesses answers which phrase. The class the stronger form ranges over is larger than the five: this repository registers further public-domain English editions, including the Douay-Rheims American 1899, the Catholic Public Domain Version, the Revised Version 1895, the King James Version and the World English Bible Catholic under src/sources/bibles, none of which was opened for this formulary. The leaf is scrupulous about exactly this bound at the neighbouring gap — sections/90-scope.tex lines 79-81 says the Offertory's two unanswered phrases 'are answered by neither of the Englishes printed at those elements, the Douay's and the 1861 book's', naming the set searched — so the Communion's unbounded form is out of step with the leaf's own practice as well as with its own appendix. What a reader takes from p. 9 and p. 22 is that the registry was swept and found empty; what was swept is five books, and the sentence that says so stands twenty pages later."
required_result = "The Communion negative carries at its two points of use the bound the record supports and the appendix already states: that none of the English witnesses examined — the tracked Douay, the Keating of 1806, the Cummiskey of 1861, the Lasance of 1945 and Guéranger's 1909 volume, five in number — renders `dédero` or `pro sæculi vita` distinctly, rather than that no registered public-domain English does. Both sections/05-appointed-text.tex lines 288-289 and sections/35-source-grounded-synthesis.tex lines 36-37 must agree with sections/90-scope.tex lines 81-82 and 173-176, and no passage of the edition may state the negative over a class wider than the one the sweep ran over. Everything else in both passages stands: that the Douay answers neither departure, that the Greek has a simple future and `kosmou`, that `dédero` is a future perfect and `sæculi` a second noun where the Bible text has neither, that both readings stand in the uncorrected optical layers of the Pustet 1862, the Venice 1570 and the 1604 typica, and C1's grouping of the Communion's two departures outside the other two groups."
repair_target = "authoring"

[[findings]]
id = "CON-CIT-002"
lane = "citation-integrity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex line 127 ('Five sacramentary witnesses number this Mass and they do not agree'), with the same count restated at lines 136-137 ('the three prayers all five numbering witnesses carry'); built canonical edition p. 11, subsubsection 'The Sunday number, and witnesses that disagree by one'. Counted against the leaf's own sentence at sections/30-commentary.tex lines 104-107 (same built page, eleven printed lines above): 'All three composed orations stand together, as one Mass and in liturgical order, in the Gregorian Hadrianum as Wilson prints it: section XXXIIII, heading DOMINICA .XVI. POST PENTECOSTEN., printed p. 174.'"
problem = "The count is false of the material the leaf itself prints. Six sacramentary witnesses number this Mass on the same page: the Gregorian Hadrianum at DOMINICA .XVI., and the five Wilson's Gelasian apparatus reports -- Rheinau, S. Gallen, Gerbert and Menard at the seventeenth Sunday, Pamelius at the sixteenth. Only the Old Gelasian, which the leaf says carries 'no Sunday number at all', is outside the count. The omission is not incidental to the subsubsection's subject: the Hadrianum's XVI is a second witness on Pamelius's side of the very one-Sunday split the section is about, so the reader is given a 4-1 division where the leaf's own evidence gives 4-2. The read-only brief carries the correct form and the leaf dropped one word from it: research/scope.md line 975 reads 'Five FURTHER witnesses number the Mass and disagree by one', 'further' being explicitly further than the Hadrianum and Old Gelasian attestations of section 1.1 to which the same sentence points; and the brief's section 6 item 1 at lines 1349-1354 lists the Hadrianum among the numbering witnesses in terms ('The Hadrianum heads the section carrying these orations DOMINICA .XVI.'). No retrieval and no brief correction is needed."
required_result = "The number is what is wrong, not the list: the five Wilson names are right, and the total asserted over sacramentary witnesses is what the leaf's own Hadrianum sentence contradicts. Sentence one of the subsubsection must either carry the bound the brief carries -- five FURTHER witnesses, or five witnesses in Wilson's apparatus at Gelasian III.XI, beyond the Hadrianum already given -- or count the Hadrianum in and say six, in which case the sentence that follows must place the Hadrianum with Pamelius at one Sunday later rather than leaving the split at four-and-one. The restatement at lines 136-137 ('all five numbering witnesses') must be brought into agreement with whichever form is chosen, since the Hadrianum carries all three prayers too. No sentence of the leaf may assert a total over the witnesses that number this Mass which the Hadrianum heading printed on the same page contradicts."
repair_target = "authoring"

[[findings]]
id = "CON-PRO-001"
lane = "profile-conformance"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/99-references.tex lines 146-147, the closing sentence of the `The Scripture chronology corpus` bullet under `Scriptural witnesses` — `No date printed in this guide comes from anywhere else.` — built canonical edition p. 34"
problem = "The sentence is a statement about the guide's own contents and it is not true of the built canonical edition. Its bullet enumerates the corpus's sources for this Mass (the NABRE Psalms introduction, Corbett's `King David`, Durand's `The New Testament`, Aherne, Prat, Fonck, Maas, the 1912 responsa and Cornelius a Lapide) and then asserts, without qualification, that every date the guide prints comes from that list. Opening the guide shows otherwise on one page alone: sections/30-commentary.tex line 153 (built p. 12) prints `Honorius Augustodunensis, writing c. 1120--1130`, and lines 174-177 of the same file (built p. 12) print `Delisle assigns the manuscript to the second half of the ninth century and Ebner follows him, though Ebner's later judgment favoured an earlier date`, neither of which stands on that list; the gallery adds 1890, 1917, 1942 and 1988 datings from its own witnesses. The guide's own terminal appendix states the same bound correctly and narrowly at sections/90-scope.tex line 247 (built p. 32), `Every biblical date printed in this work comes from the Scripture chronology corpus and from nowhere else`, so the References sentence has dropped the one qualifier that makes the claim true and now contradicts the appendix on the same bound."
required_result = "The References sentence states the bound as narrowly as it is true, so that a reader who opens the passages it points at finds it holds — the biblical dates, or the dates of the page-2 Date column, and not every date the guide prints. Restoring the qualifier the terminal appendix already carries (`No biblical date printed in this guide comes from anywhere else`) satisfies this; so does any wording that leaves the guide's non-biblical datings, such as Honorius's c. 1120--1130 and Delisle's and Ebner's datings of Ottobonianus 313 at built p. 12, outside the claim. The two statements of the bound, at sections/99-references.tex and sections/90-scope.tex line 247, must agree."
repair_target = "authoring"

[[observations]]
lane = "evidence-discipline"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md line 96, the run-in heading of §1.1's third result: '**The Alleluia is the one element with no reception at all, and the reason is textual.**', against §2.8 of the same file at lines 2450-2455, which records that the Collect, the Secret and the Postcommunion 'have **no witness of that class in any source this production opened**'."
note = "On the brief's own record four elements, not one, have no exposition of their text, so the heading is false as written and is true only under the gloss its own next sentences supply — that the Alleluia is the element whose substituted predicate carries both retained expositions away with it. The leaf did not inherit the universal form: the canonical edition's Alleluia subsection at sections/30-commentary.tex lines 526-529 (built p. 16) states the negative of the chant's substituted predicate and says in the same breath that the three composed orations have no expositor in any source opened here, which is right. My CON-EVI-053 at the sixth evaluation reached the neighbouring sentence of this section and brief-revision repaired §2.4; this heading form stands. It is recorded rather than raised because criterion 1 asks the same-bound question of the canonical edition, which is right, and only brief-revision may write research/scope.md — and I say plainly, as the fragments invite, that this is the recurring unowned class four other lanes have now recorded five iterations running: a fact stated wrongly inside the brief that the leaf did not reproduce, which no criterion in the shared list reaches and which nothing therefore routes to the one stage that may correct it. The repair, if anyone owns it, is to carry §2.4's own corrected wording into the §1.1 heading so that a later authoring pass reading it does not conform the leaf back to it."

[[observations]]
lane = "reception-sweep"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 238-240, the closing sentence of the Cassiodorus witnessnote at the Introit (built canonical edition p. 13: 'his verse numbering runs one lower than the Vulgate's in psalms carrying an inscription, so his Vers. 1 at a titled psalm is the Vulgate's v. 2'), repeated as a blanket rule at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/99-references.tex lines 215-218 (built p. 35), against src/sources/works/cassiodorus/expositio-psalmorum/editions/latin-corpus-corporum-monumenta-web-2026-09-05/artifacts/monumenta-ps85-apparatus-latin-text/cassiodorus-ps85-latin.txt and .../monumenta-ps39-apparatus-latin-text/cassiodorus-ps39-latin.txt."
note = "Restated from the standing record and re-verified in the tracked bytes at this iteration: at Ps. 85, the one psalm whose witnessnote prints the caution, Cassiodorus's numbering runs level with the Vulgate -- his (Vers. 1.) is 'Inclina, Domine, aurem tuam ad me, et exaudi me, quoniam egenus et pauper sum ego', his (Vers. 3.) 'Miserere mei, Domine, quoniam ad te clamavi tota die' and his (Vers. 4.) 'Laetifica animam servi tui', the block in which the 'Iucundari petit animam suam' the same witnessnote quotes at v. 4 actually stands -- so the caution is false where it is printed and the witnessnote's own next paragraph (commentary lines 246-250, reading his Laetifica as the missal's v. 4 and his miserere mei against the missal's v. 3) depends on the level numbering it has just denied; the tracked Ps. 39 text shows the rule holding there, his (Vers. 1.) being Vulgate 39:2, and the discriminator is whether the inscription is numbered as a separate verse (Pss. 39 and 91) or counted inside v. 1 (Pss. 85 and 94), which the leaf's own psalm-numbering correction box at sections/30-commentary.tex lines 82-88 (built p. 11) states rightly and research/scope.md line 571-573 states narrowly at Ps. 91. Not a finding of mine: criterion 3 asks whether the sweep was made and its witnesses and negatives retained, which they are, and criterion 6 whether the sources' disagreements and the uncertainties bearing on them are carried, which they are. This is the second consecutive iteration this lane has had to record it, and I say plainly as the fragment invites that it looks like a missing criterion rather than a fact about this leaf: a misstated textual convention of a reception witness's own edition falls between criterion 2 (the appointed Latin's transcription), criterion 7 (invented citations and stated counts), criterion 13 (the appointed texts) and criterion 14 (the guide's statements about its own contents), and none of them reaches it. The repair, if anyone owns it, is one clause of the commentary and one of the References."

