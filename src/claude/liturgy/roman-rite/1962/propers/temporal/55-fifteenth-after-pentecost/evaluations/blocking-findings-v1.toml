problem = "On the registered page (artifact augustinus-it-ps085-3909c029, source_url https://www.augustinus.it/latino/esposizioni_salmi/esposizione_salmo_104_testo.htm, refetched 2026-09-09 and matching the registered SHA-256 3909c029b75092eb11f8c353b295b24c5fb3bcf8d7ba52f196040914b7a6692b at 70,331 bytes) the sentence 'Humilem respicit Deus, superbum repellit.' occurs exactly once, as the <H5> heading set between the end of paragraph 1 and the anchor of paragraph 2, in the page's series of twenty-two editorial paragraph headings ('Christus Deus et homo.', 'Humilem respicit Deus, superbum repellit.', 'Dei pauper quis est.', 'Sancti dicimur quia a Deo sanctificati.', 'Sursum cor!' ...), and nowhere in Augustine's own text. Paragraph 2 itself opens 'Inclina, Domine, aurem tuam, et exaudi me. Ille ex forma servi dicit; tu, serve, in forma Domini tui: Inclina, Domine, aurem tuam. Inclinat aurem, si tu non erigas cervicem: humiliato enim appropinquat; ab exaltato longe discedit, nisi quem ipse humiliatum exaltaverit.' The brief therefore attributes to Augustine at 85.2 a rubric the edition's editors wrote, and the leaf prints it as his words at two sites (CON-CIT-030b). No retrieval is needed: the registered page holds the heading and the paragraph."
