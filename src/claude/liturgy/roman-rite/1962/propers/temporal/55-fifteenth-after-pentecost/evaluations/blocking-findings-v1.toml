note = "My iteration-2 observation on this file is cleared and is not re-recorded: line 24 now reads 'The companion builds at 24 pages with its brief synthesis still on exactly two, pages 3 and 4', which is what the .aux resolves (start 3, end 4, next 5, in both editions) and what the build shows. Two colophon defects remain, and neither is reachable by any criterion I was given. Line 22's report of the seam repair as 'twenty-one clauses in the four files both editions input' is now further from the truth than when the derivation-fidelity lane first recorded it: I counted the guards this round at 10 in sections/20-themes.tex, 8 in sections/35-source-grounded-synthesis.tex, 6 in sections/50-interpretive.tex, 4 in sections/90-scope.tex and 8 in sections/99-references.tex -- thirty-six clauses in five files, three of the eight in 99-references.tex added by this round's own repair. And line 24, new this round, carries a mangled sentence: 'The class SYN-CON-005, SYN-CON-006 and SYN-CON-008 have each named one site of was then swept rather than decremented', which reads as two clauses collapsed into one. \\AIModelContribution renders nothing but the revision timestamp (src/common/preamble.tex lines 88-90), so no reader of either edition meets either sentence, and neither admitted repair owner fits: the file is not under sections/synthesis/ and carries no canonical sentence made false by the companion's form, so no branch would repair it. This is the fourth colophon sighting recorded as an observation across two lanes in this run. A class that keeps arriving as an observation is a missing criterion in some lane's fragment rather than a fact about this document: no lane is given the colophon's own arithmetic about the edition it describes, or its prose."

