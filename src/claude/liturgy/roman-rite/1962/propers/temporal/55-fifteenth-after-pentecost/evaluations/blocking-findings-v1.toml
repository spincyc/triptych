[[findings]]
id = "CON-EVI-041"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/99-references.tex lines 28-30 (built canonical edition p. 32, the three-older-Missals entry: 'They carry all ten elements in the same order and at the same references'), against src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/90-scope.tex lines 37-42 (built p. 29: 'Nine of the ten elements are printed, in the same order and at the same references, in three Missals ... and the Gospel in two of them') and src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 773-774 (built p. 19: 'the Pustet 1862 does not print this Sunday's Gospel at all but cross-references it there')."
problem = "One evidence bound stated at two strengths in one edition, and the stronger form is false. The Pustet Ratisbon 1862 prints no Gospel at this formulary at all: propers/verified.md records the printing's own cross-reference ('Evangelium. Ibat Jesus, ut Feria v. post Dom. iv. Quadrag. fol. 110'), states at line 666 that 'The Pustet's Gospel is a cross-reference and not a printed pericope ... so the Gospel's presence in a public-domain witness rests on the 1604 and the 1570', and I confirmed against the tracked Pustet optical layer (src/sources/works/catholic-church/missale-romanum/editions/pustet-ratisbon-1862/artifacts/missale-romanum-1862-text-f34bc7cf, lines 50324-50454, read for this evaluation) that the only Gospel line in the formulary's own range is that cross-reference. The record's loose summary sentence at verified.md line 569 ('All ten appointed elements above are printed ... in three Missals') is what the References entry reproduces; verified.md's own Bounds paragraph at line 666 corrects it, and p. 29 and p. 19 of this edition carry the corrected form. The strength the record supports is nine elements in three witnesses and the Gospel in two, which is also what the 17 U.S.C. 103(b) basis printed on p. 29 actually rests on, so p. 32 states the preexisting-material coverage of the appointed Gospel more strongly than any witness read supports."
required_result = "The References entry states the coverage the record holds - the 1604 and the 1570 carry all ten elements in the same order and at the same references, and the Pustet nine, its Gospel standing there as a cross-reference to the Lenten Thursday that shares the pericope - so that p. 19, p. 29 and p. 32 agree with propers/verified.md line 666 and with each other; the entry's loci, its degraded-layer caveat and its 'no negative result rests on any of the three' sentence are unaffected and stand."
repair_target = "authoring"

