note = "Re-recorded from iterations 1 and 2 because the standing file is rewritten whole and the sighting still stands unchanged; neither passage moved this round. The redirect is sound -- the companion branch reads 'at the third unit of the commentary' and unit 3 does carry both readings of 'tota die', Augustine's and Cassiodorus's. What is unsettled is the section number: the thematic movement gives '(En. Ps. 85.5; PL 70)' at line 184 while unit 3 cites the same sentence group at 'En. Ps. 85 §2', so the companion states two different sections for one reading in two places a reader meets in one sitting. The canonical does not show the mismatch, and unit 3's own '(En. Ps. 85 §§1--6; PL 37, 1081--1090)' at line 184 of the integrated commentary is the only place §5 falls inside anything the companion prints. I raise no finding: which section of Augustine carries a sentence is a citation question, and my criteria reach whether a statement is true of the companion, not whether a citation aligns."

