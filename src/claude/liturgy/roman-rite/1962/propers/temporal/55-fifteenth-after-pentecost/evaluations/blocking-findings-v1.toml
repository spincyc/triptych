location = "research/scope.md line 18, the caption above the formulary table in the opening identification block: \"Appointed formulary, as collated in `propers/verified.md` against the CMAA facsimile of the 1962 typical edition, printed pp. 396-398, marginal nos. 1582-1591\"."
note = "Unrepaired, and this lane recorded it at the previous evaluation. The brief states this formulary's printed extent as pp. 396-398 where the record it cites states 396-397: propers/verified.md, Provenance, \"Printed location\" (line 31) reads \"Printed pages 396-397\" and fixes both boundaries on those two pages, and the CMAA PDF leaves it names, 477-478, are two. Every other locus in research/scope.md uses p. 396 or p. 397 only; the sole other \"396-398\" is at line 2532 inside a quotation of claude/54's prose, which is where the figure looks to have come from. The leaf did not inherit the error -- sections/00-map.tex, sections/05-appointed-text.tex, sections/90-scope.tex and sections/99-references.tex all print pp. 396-397. My criterion 10 asks whether the source records exist and follow the profile's format, and this record does: the profile fixes what research/scope.md must contain -- corpora searched, claim roles, negative results, rejected and unresolved leads, competing historical judgments, displaced operational qualifications -- and printed pages are not among them, while the record whose format does fix printed pages states them correctly. So the defect is a factual slip inside a record my criterion reaches only as to format, and no criterion in the shared list reaches the factual correctness of the brief. That looks to me like a missing criterion, and the standing record already carried sightings of the same class from another lane, each recorded for the same reason -- to stop a later pass correcting the leaf into the brief's error."
