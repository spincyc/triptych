lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 41-43 (built edition p. 10), the close of the paragraph 'Where the appointed text is not the Bible's text': \"with one word form that runs the other way: those same layers show \\\\latin{Adolescens} with the Clementine\" -- where 'those same layers' are the three named at lines 35-37, 'the uncorrected optical layers of the Pustet Ratisbon 1862, the Venice 1570 and the Vatican \\\\latin{typica} of 1604'."
problem = "A reading is attributed to a witness that does not contain the passage. The Pustet 1862 prints no Gospel for this Sunday: its tracked layer at the lines the leaf itself cites (missale-romanum-1862-text.txt 50,324-50,454) carries at line 50,418 only the cross-reference 'Evangelium. Ibat Jesus, ut [Feria v. post Dom. iv. Quadrag. fol. 110]', read directly for this evaluation; propers/verified.md (Rights, Pustet entry) records that the pericope's 'words are on another page and were not opened'; and the leaf states the same fact three times -- sections/30-commentary.tex lines 765-766, sections/35-source-grounded-synthesis.tex lines 103-104, sections/90-scope.tex lines 49-52. The two places where the leaf reports the Adolescens corroboration accurately name only the two layers that carry it, 'the Venice 1570 and the 1604 typica' (sections/30-commentary.tex lines 17-18; sections/05-appointed-text.tex lines 211-212), so the same evidence is stated at two strengths inside one section. Both of those layers do show the reading: the 1604 at line 38,710 'AdoIefceS', the 1570 at line 53,485 'Zidolcfcene'."
required_result = "Lines 41-43 attribute the Adolescens reading to the Venice 1570 and the 1604 typica only, in the terms lines 17-18 already use, and no longer to 'those same layers' as a set that includes the Pustet. No retrieval and no change to the brief is needed: propers/verified.md and research/scope.md section 10.1 item 9 both record that the Pustet cross-references this Gospel and prints none of its words."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-030"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/40-notable.tex lines 129-131 (built edition p. 25), fourth gallery entry 'Offertory, Ps. 39:2--4 -- the psalm closing a rock album', the sentence beginning 'The overlap with the appointed wording': \"the antiphon is the Roman chant's Latin, which departs from the Vulgate at three places here and cuts the whole of v.~3 --- the pit, the rock and the established goings --- which the song keeps.\""
problem = "False of the antiphon as the leaf prints it. The appointed Offertory (sections/05-appointed-text.tex lines 221-222; propers/verified.md section 7) sings 'et exaudívit deprecatiónem meam', which is the first clause of Vulgate Ps. 39:3 -- the Douay's 'And he heard my prayers', set in bold as sung at sections/05-appointed-text.tex line 227 -- and cuts only the rest of the verse, from 'et eduxit me de lacu miseriæ' to 'direxit gressus meos', together with v. 4b. propers/verified.md rows 27-28 record exactly that division ('et exaudívit deprecatiónem meam' kept; 'rest of v. 3 absent'), and the leaf states it correctly at sections/05-appointed-text.tex lines 244-247, sections/30-commentary.tex lines 770-772 and sections/50-interpretive.tex lines 118-120. The gallery sentence alone says the whole verse is cut. The paragraph's own psalm citations ('Ps. 39(40)', 'Ps. 39:2-4') put Vulgate numbering in force, and under the Authorised Version's numbering the sentence would be wrong the other way (AV v. 3 is the new song, which the antiphon keeps), so no numbering rescues it."
required_result = "The sentence states the cut as the appointed text makes it: the antiphon keeps v. 3's opening clause and cuts the remainder of v. 3 -- the pit, the rock and the established goings -- and v. 4b, in agreement with sections/05-appointed-text.tex lines 244-247 and sections/30-commentary.tex lines 770-772. Nothing has to be retrieved; propers/verified.md rows 27-29 hold the division."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-031"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 272-274 (built edition p. 13), the Collect commentary: \"\\\\latin{Miserátio continuáta} makes mercy an attribute and not a request, and the participle is the Mass's first word of duration.\""
problem = "False of the order of the appointed texts on the leaf's own showing. The Introit, sung before the Collect, closes its antiphon 'quóniam ad te clamávi tota die' (sections/05-appointed-text.tex line 32), and the leaf itself lists 'tota die (Int.)' first in the Mass's 'vocabulary of duration' at sections/20-themes.tex lines 130-131, expounds it as the marker Augustine and Cassiodorus stretch to a lifetime (sections/20-themes.tex lines 136-138; sections/30-commentary.tex lines 217-219, 229-231), and brief section 1.2 C6 lists the same markers in the same order. So the Collect's participle is not the Mass's first word of duration; it is the first of the orations'."
required_result = "The clause states what is true of the formulary's order: either that continuáta is the first word of duration among the three orations, or that it is the Collect's first, or the ordinal claim is dropped. No retrieval is needed; the Introit's 'tota die' and its place before the Collect are in propers/verified.md sections 1-2 and in the leaf's own thematic section."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-032a"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md section 2.5 'Text', item 7, lines 666-668: \"`surge` at v. 14 and `surrexit` at v. 16 are the one Greek verb EGEIRO:, aorist passive imperative and aorist passive indicative; the Latin does not preserve the identity with Deut. 18:15, which reads `suscitabit`.\" (SCR-016)."
problem = "The brief asserts an identity between Lk. 7:16 and Deut. 18:15 that its own evidence does not hold and that the Greek does not bear. What the record supports is two facts: Luke's two verbs are one Greek verb (Nestle 1904, collated by the scripture lane), and the Vulgate Deut. 18:15 reads 'suscitabit' (checked here in the tracked Clementine, chapters/Deut/18.json). No Greek Deuteronomy was collated anywhere in the production: section 3.1 lists Swete's Psalmi, Regnorum III and Regnorum IV only, and the leaf's References (sections/99-references.tex lines 121-125) name Swete at Pss. 39, 85, 94 and 3 Kingdoms 17 only. The Septuagint of Deut. 18:15 reads 'prophētēn ... anastēsei soi kyrios ho theos sou' (Deut. 18:18 'anastēsō'; Acts 3:22 and 7:37 quoting it 'anastēsei') -- the verb anistēmi, not egeirō -- so the Greek carries no identity of verb with Lk. 7:16's ēgerthē for the Latin to fail to preserve. That Greek reading is stated on this evaluator's knowledge of the LXX text and not from a tracked witness, which is precisely the gap: the record holds nothing on which the sentence could rest. The sentence reaches the reader verbatim at sections/30-commentary.tex lines 630-632 (CON-EVI-032b)."
required_result = "Section 2.5 item 7 states only what the record holds: that surge and surrexit are one Greek verb in Luke, that the Vulgate Deut. 18:15 reads suscitabit, and -- if Deut. 18:15 is to be mentioned at all -- that its Greek was not collated and no identity of verb between the two passages is asserted. If an identity is to be claimed, the item names the Greek witness and the verb form it rests on. No retrieval is required to remove the claim; retrieval would be required only to make it."
repair_target = "brief"

[[findings]]
id = "CON-EVI-032b"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 630-632 (built edition p. 17), Gospel commentary, last of the 'Seven results from the text itself': \"\\\\latin{Surge} at v.~14 and \\\\latin{surréxit} at v.~16 are one Greek verb in two forms; the Latin does not preserve the identity with Deut.\\\\ 18:15, which reads \\\\latin{suscitabit}.\""
problem = "The second clause presents as verified a claim about the Greek text that no witness in the record supports and that the leaf's own References show could not have been checked (Swete consulted at Pss. 39, 85, 94 and 3 Kingdoms 17 only; Nestle 1904 covers the New Testament). It tells the reader that Lk. 7:16 and Deut. 18:15 share a verb the Latin conceals; in the Septuagint Deut. 18:15 reads anastēsei (anistēmi) where Luke has ēgerthē (egeirō), so the identity does not exist in the Greek either. The first clause is sound and is retained. The leaf inherited the sentence from research/scope.md lines 666-668 (CON-EVI-032a), so the leaf's repair follows the brief's."
required_result = "Lines 630-632 keep the first clause and either drop the Deut. 18:15 clause or restate it as what the record supports -- that the Vulgate Deut. 18:15 promises a prophet with a different Latin verb, suscitabit, and that no identity with Luke's verb is claimed -- consistent with the corrected brief."
repair_target = "authoring"

[[findings]]
id = "CON-SYN-001"
lane = "synthesis-argument"
severity = "blocking"
location = "sections/35-source-grounded-synthesis.tex lines 45-82, unit C2 \"The strongest joins in this formulary are in the Greek, and the Latin the priest reads hides them\" (built PDF p. 23), against sections/30-commentary.tex lines 588-598, 603-620, 770-779 and 940-948. main.tex line 31 inputs the synthesis section unconditionally."
problem = "The unit is an abridged procession, not a cross-proper argument. Its four bold paragraphs treat one appointed element each -- Gospel (Elias at Sarepta, LXX 3 Kingdoms 17:23), Gospel again (monogenes, splanchnizomai), Offertory (Ps. 39:7-9 against Heb. 10:5), Communion (the 6:51/6:52 numbering) -- and none relates two appointed elements of this formulary to each other: the \"joins\" the heading promises are between an appointed text and a text outside the Mass (3 Kingdoms, Jn. 1:14, the Benedictus, Hebrews) or, at the Communion, no join at all but a citation caution. No reception witness carries any of them; the only authorities are Swete's Greek, the Vulgate and Hebrews, so the unit draws on neither more than one element nor more than one witness per claim. And every paragraph is the commentary's own paragraph reprinted: lines 47-55 reproduce 30-commentary.tex 588-598 in runs of 37, 51 and 15 consecutive words; lines 57-67 reproduce 603-620 (a 16-word run plus close paraphrase of the nine monogenes loci and the three splanchnizomai loci); lines 69-74 reproduce 770-779 (11-, 17- and 13-word runs); lines 76-82 reproduce the \\correction at 940-948 (20- and 14-word runs). The commentary is the fullest home in each case: it alone carries the two weaker supports at 594-598, the nine monogenes loci at 611-613, the antiphon stopping three verses short of the Hebrews seam at 779-781, and the \\correction's frame."
required_result = "C2 is removed, or replaced by a unit that relates at least two appointed elements of this formulary to each other through at least two checked witnesses and states something no single element's commentary already states. Whichever is done, the Elias/Sarepta, monogenes/splanchnizomai, Heb. 10:5 and 6:51/6:52 passages keep their one fullest home at sections/30-commentary.tex lines 588-598, 603-620, 770-779 and 940-948 and are not reprinted in the synthesis beyond a clause and a cross-reference."
repair_target = "authoring"

