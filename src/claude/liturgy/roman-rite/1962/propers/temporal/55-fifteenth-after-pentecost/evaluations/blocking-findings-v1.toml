problem = "Restated from the standing record at evaluations/blocking-findings-v1.toml under the same id, and re-established at this iteration by reading both passage files again: neither `notes` field has been altered, byte for byte, and neither passage file is in this iteration's REVIEW_SCOPE or in the leaf at all. Both registered passage records state a verification that names the wrong prayer. The Secret record's notes say the formulary correspondence was `checked against the Latin `Tua nos, Domine, sacramenta custodiant` at marginal number 1571 of the 1962 Vatican typical edition'; this Secret stands at marginal number 1589, and I re-confirmed against src/sources/calendars/roman-1962/propers.yaml this iteration that 1571 is the Thirteenth Sunday's Postcommunion `Sumptis, Domine' at printed p. 394, while 1589 is `Tua nos, Domine' at printed p. 397. The Postcommunion record's notes say it was `checked against the Latin `Mentes nostras, quaesumus, Domine, lumine tuae claritatis illustra` at marginal number 1573', which is not this formulary's Postcommunion at all -- that prayer is `Mentes nostras et corpora possideat' at marginal number 1591, printed p. 397 -- and 1573 is the Fourteenth Sunday's Collect `Custodi, Domine' at printed p. 395, again confirmed in propers.yaml this iteration. The English each record carries is nonetheless the right English: propers/verified.md lines 726-746 record that this audit read the registered scan's printed pp. 427-429 as page images and found all three orations `word for word and point for point the tracked transcription's lines 155-157', and the leaf prints exactly that English. So the defect is in the recorded citation and not in any text this guide publishes, and the leaf is right to cite these records; it also declares the defect itself at propers/verified.md lines 783-803 and in research/source-bindings.toml at the two per-oration binding contexts (lines 224-236), and leaves it to the source library. No stage of this run may