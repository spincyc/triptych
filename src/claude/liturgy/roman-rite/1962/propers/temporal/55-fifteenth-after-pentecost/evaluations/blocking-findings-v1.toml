# Blocking findings standing against this publication, and the
# observations its evaluation lanes recorded outside their own
# criteria. Written by tpt after each evaluation of this leaf and
# rewritten whole, so it states what stands now.
#
# It exists because a run's own results live under build/, which
# is ignored, which `make clean` and `wt tidy` delete without
# asking, and which nothing preserves between productions.
#
# Nothing reads this back into a run. Carrying findings from one
# production into the next wants doing where the run's identity
# can cover it -- a committed record, or this file's hash in the
# run id and the acceptance audit -- and until then this is a
# record for people.
#
# Escalations -- defects in artifacts no stage of the run may
# write: guidance, the source library, the tools, the workflow --
# are written here too, from the run's whole ledger, so that the
# decision they ask of a maintainer outlives the run directory.
#
# Accepted findings are true defects a lane judged not worth a
# repair round, with the reason it judged so. Advisories are
# defects that did not merit blocking. Both are here because a
# verdict that dies with the run is met again by the next cold
# read as though nobody had ever weighed it, and weighed again --
# which is how a document in good shape spends a whole iteration
# budget. A later evaluation reads these before it raises.

