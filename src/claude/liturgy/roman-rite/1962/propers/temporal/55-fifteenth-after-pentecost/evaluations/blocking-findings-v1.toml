note = "Restated from the standing record, unchanged and re-checked: both are named as witnesses examined and neither reaches any References entry, edition, artifact or locus anywhere in the guide, although research/scope.md section 11 records both by tracked artifact id and physical line range (`roman-missal-laity-1806-text-e9f54379`, lines 22189-22270; `new-roman-missal-text-80b34759`, lines 73459-73780). Criterion 7 asks whether only sources actually used are cited, which is met and which tools/check-content-preflight confirms mechanically ('references-used: 40 entries, every one used in the body'); the converse -- a witness the guide says it examined, cited by surname and year alone, whose edition identification and References entry are absent -- sits between criterion 7 and criterion 2's 'edition-identified sources' and is claimed by neither lane's fragment. Fourth consecutive iteration unowned; on the fragment's invitation I record it as a probable missing criterion, or an unclear boundary between 2 and 7, rather than a fact about the document."

[[observations]]
