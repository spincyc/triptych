[[findings]]
id = "CON-EVI-035a"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md lines 713-715 (section 2.5, the Bede entry: 'and the only son is mother Church, `licet e multis collecta personis, una sit perfecta et immaculata virgo`, with Gal. 4:19 quoted in support') and line 2342 (section 11 item 1: 'Bede (the only son as mother Church, the gate as a bodily sense)')."
problem = "The brief inverts Bede's figure. The registered text of Bede's In Lucam (artifact ...in-lucae-evangelium-expositio.latin-migne-corpus-corporum-web-2026-07-25.wikisource-in-lucam-116db0ca, fetched from its registered source_url for this evaluation and matching the registered SHA-256 116db0ca16f41a0388e3dd3ba08624dc14da88cdb079d3d2efaa73b604247d8a at 973,336 bytes) reads at PL 92 col. 417C: `Qui bene filius unicus matris suae fuisse perhibent, quia licet e multis collecta personis, una sit perfecta et immaculata virgo, mater Ecclesia, singuli quique tamen fidelium universalis se Ecclesiae filios rectissime fatentur. Nam et electus quilibet, quando ad fidem imbuitur, filius est. Quando alios imbuit, mater. An non materno erga parvulos agebat affectu, qui ait: Filioli mei, quos iterum parturio, donec formetur Christus in vobis?` The one perfect and immaculate virgin gathered from many persons is mater Ecclesia, the mother; the only son is each of the faithful, who confesses himself a son of the universal Church; Gal. 4:19 is quoted for the Church's motherhood. The brief's own next clauses (`veramque matrem Ecclesiam`; `Redditur matri, cum ... communioni sociatur Ecclesiae`) already have the mother as the Church. The witness is held (read on the PL 92 optical layer, PAT-005) and stated wrongly, and the leaf inherited the inversion at two places (CON-EVI-035b)."
required_result = "Section 2.5's Bede entry and section 11 item 1 state Bede's reading as the text has it: the widowed mother is mother Church, one perfect and immaculate virgin though gathered from many persons, and each of the faithful is her only son, Gal. 4:19 being quoted for her motherhood; the Latin tag `licet e multis collecta personis, una sit perfecta et immaculata virgo` is attached to the mother and not to the son. No retrieval is needed; the registered artifact holds the text."
repair_target = "brief"

[[findings]]
id = "CON-EVI-035b"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/00-map.tex line 26 (built edition p. 1, the four senses, Allegorical row: 'Bede makes the only son mother Church, licet e multis collecta personis, una sit perfecta et immaculata virgo, and the gate one of the bodily senses'), and src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 700-703 (built p. 18, the Bede witnessnote: 'and the only son is mother Church, licet e multis collecta personis, una sit perfecta et immaculata virgo, with Gal. 4:19 quoted in support')."
problem = "Both passages attribute to Bede a reading he does not give. At PL 92 col. 417C (registered text, hash-verified for this evaluation) Bede makes mater Ecclesia the `una perfecta et immaculata virgo` gathered from many persons and each of the faithful (`singuli quique fidelium`) her only son; the leaf reverses mother and son and hangs Bede's description of the mother on the son. The same witnessnote's later clauses (Novatian denying that `veramque matrem Ecclesiam` should be consoled; `Redditur matri, cum ... communioni sociatur Ecclesiae`) and C4's 'the restoration to the mother his return to the Church's communion' (35-source-grounded-synthesis.tex lines 125-126) already have the mother as the Church, so the leaf contradicts itself about one witness on one page. The brief carries the same inversion (CON-EVI-035a), on which this repair depends."
required_result = "Both passages state that Bede makes the widowed mother the Church - one perfect and immaculate virgin though gathered from many persons - and each of the faithful her only son, with Gal. 4:19 standing for the Church's motherhood; the Latin tag is attached to the mother. Afterwards the four-senses row, the witnessnote's opening, its `Redditur matri` clause and C4 agree about who the mother is."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-036a"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md lines 198-201 (section 1.2, C4: 'Cassiodorus reads both psalms the same way independently - ... (PAT-024) - so the reading rests on two Latin witnesses and not on one') and line 243 (C6: 'and Cassiodorus independently')."
problem = "The brief asserts Cassiodorus's independence of Augustine as a fact and records no evidence for it; PAT-024 records only what Cassiodorus says. The tracked Cassiodorus text at Ps. 85 (src/sources/works/cassiodorus/expositio-psalmorum/editions/latin-corpus-corporum-monumenta-web-2026-09-05/artifacts/monumenta-ps85-apparatus-latin-text/cassiodorus-ps85-latin.txt) names Augustine inside the same exposition - `pro meritorum tamen discretione superiorem locum sanctis, inferiorem peccatoribus doctor Augustinus aestimat esse deputandum` - and opens on Augustine's head-and-members division (`Secunda pro membris suis, quorum ipse caput est`), so the exposition the brief calls independent uses Augustine. `Independently` raises a second statement of one reading to the evidence state of two independent witnesses, which is the consensus by proximity the profile's Evidence and Claim Discipline forbids, and the leaf prints the adverb at four sites (CON-EVI-036b)."
required_result = "C4 and C6 state what the record supports: that Cassiodorus also expounds both psalms on the totus Christus principle and reads tota die of the whole of life, in his own words, so that two Latin commentators state the reading; no claim that he reached it independently of Augustine is made, or, if one is, it is sourced. No retrieval is needed."
repair_target = "brief"

