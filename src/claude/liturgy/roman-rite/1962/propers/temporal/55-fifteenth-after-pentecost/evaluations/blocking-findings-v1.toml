[[findings]]
id = "CON-EVI-027"
lane = "evidence-discipline"
severity = "blocking"
location = "sections/90-scope.tex lines 39-43, in the subsection \"Published text, English, and rights\": \"All ten elements are printed, in the same order and at the same references, in three Missals tracked in this repository as public-domain text --- the Vatican \\latin{typica} of 1604, the Pustet Ratisbon 1862 and the Venice 1570 --- read in uncorrected optical layers classified degraded in their own source records, of which no page image was opened here.\" The same claim is restated at sections/99-references.tex lines 25-27: \"All three were read only in uncorrected public-domain optical layers, classified degraded in their own source records, and no page image of any of them was opened.\" main.tex lines 34 and 35 input both files unconditionally, so both sentences reach the canonical full edition and the synthesis companion alike."
problem = "The classification is false of one of the three, and the leaf's own records say so. The tracked Pustet artifact artifact.catholic-church.missale-romanum.pustet-ratisbon-1862.missale-romanum-1862-text-f34bc7cf classifies its optical layer prose-latin and not degraded; its own notes read \"OCR QUALITY, AND IT IS THE BEST OF THE FIVE LATIN AND ENGLISH SCANS FOLDED IN FROM THIS CORPUS. Measured here by scripts/_ocr_quality.py at a Latin function-word share of 0.1792 over 357,261 tokens, English 0.033, classified `prose-latin` -- comfortably above the roughly ten per cent at which that tool says running Latin prose sits, and more than twice the 1570's and the 1604's\", and it carries only \"QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE\" without the \"DO NOT REST A NEGATIVE SEARCH ON IT\" the other two carry. Only the other two are degraded-latin: the 1604 layer at a share of 0.0763 and the 1570 layer at 0.0788, each with that prohibition. The brief states the bound correctly and narrowly and does not extend it to the Pustet: research/scope.md section 10.1 item 9, lines 2179-2184, reads \"No page image of the Vatican typica 1604 or the Venice 1570 was opened for this formulary, and neither has a passage record, so the Gospel's preexisting-material antecedent rests on two optical layers whose own records classify them `degraded-latin`\", and it goes on to say separately that the Pustet does not print this Sunday's Gospel at all. The leaf's own binding record agrees with the brief and not with its reader-facing prose: research/source-bindings.toml line 115 says of the Venice 1570 alone that \"The artifact's own record classifies its optical character recognition as degraded and forbids resting a negative search on it\", while the Pustet binding at line 105 and the 1604 binding at line 94 say only that each was read in an uncorrected optical layer with no page image opened. The misstatement is load-bearing rather than cosmetic. The Pustet layer is the leaf's corroborating witness at seven reported readings and points -- the Collect's comma before `tuo semper` (sections/05-appointed-text.tex lines 75-77, sections/30-commentary.tex lines 275-278), the Gradual's comma after `misericórdiam tuam` (sections/05-appointed-text.tex lines 149-151, sections/30-commentary.tex lines 74-78), the Alleluia's `super omnem terram` (sections/05-appointed-text.tex lines 170-172), the Offertory's three phrases (lines 239-240), the Communion's `dédero` and `sǽculi` (lines 288-289), the Secret's short conclusion (lines 266-268) and the Postcommunion's absent comma after `nostras` (lines 315-317), with the same corroborations restated at sections/30-commentary.tex lines 36-38 and sections/35-source-grounded-synthesis.tex lines 12-15 -- and the sentence under finding is the very sentence that tells the reader how much weight those seven reports carry. Read against the layer itself at the loci the leaf cites, text-layer lines 50,324-50,454, the Pustet's Fifteenth Sunday is plainly legible running Latin whose only systematic damage is the digit-for-accent substitution its record names, so the guide states the evidence to be worse than it is and attributes to a source record a classification that record does not hold."
required_result = "Both sentences state the classification each source record actually carries. Either the clause names only the two whose records classify them degraded-latin -- the Vatican typica of 1604 and the Venice 1570 -- and the Pustet Ratisbon 1862 is removed from it; or the classification is dropped from both sentences and the qualification the leaf already carries in the same breath, that all three were read only in uncorrected optical layers with no page image opened and that what is reported from them is what those layers show, is left to stand alone. Both places must be repaired together: repairing sections/90-scope.tex and leaving sections/99-references.tex, or the reverse, leaves the same false classification published in the same document. No retrieval is required and no correction to the brief is required. research/scope.md section 10.1 item 9 already restricts degraded-latin to the 1604 and the 1570; research/source-bindings.toml line 115 already restricts the attribution to the Venice 1570; and the three artifact records carry the classifications verbatim."
repair_target = "authoring"

[[findings]]
id = "CON-EVI-028"
lane = "evidence-discipline"
severity = "blocking"
location = "sections/40-notable.tex line 93, the closing sentence of the \"The turn, twice.\" paragraph in the third gallery entry (\"Offertory, Ps. 39:2 --- the incipit as the title of a soldier's poem, and the choir taking it back\"): \"The confident Latin \\latin{exspectavi} stands over a poem about not having been paying attention.\" main.tex line 32 inputs sections/40-notable unconditionally, so the sentence reaches both editions."
problem = "The word is printed in a spelling neither of the two texts it could be quoting carries. The appointed Offertory, as propers/verified.md collates it off the controlling facsimile at its section 7 -- printed p. 397, marginal no. 1588, checked 2026-09-05 at 500 ppi -- reads `Exspéctans exspectávi Dóminum`, with the acute on the second `a`; this same entry prints it correctly four lines earlier at line 71, and the leaf prints it correctly at sections/00-map.tex line 14, sections/05-appointed-text.tex line 221 and sections/20-themes.tex line 130. Sorley's 1916 title, which is what literally stands over the poem, is `Expectans expectavi` without the missal's `s` after `Exp`, and this same entry prints it that way at line 75 and at lines 83-84, explains the older spelling at lines 71-73 as what the three older Missals' optical layers show, and returns to it at lines 99-100 (\"the words are the same words, in the older spelling those three layers show\"). Line 93 prints a third form, the missal's `xs` cluster carrying none of the missal's accentuation. The entry's own subject makes the referent the appointed antiphon's word -- the entry is titled for the Offertory's incipit and its \"Appointed text and locus\" field at lines 69-71 gives the missal's `Exspéctans exspectávi Dóminum` -- so on the reading the entry itself invites, this is the appointed Latin printed in the gallery without the accent propers/verified.md records for it. On the other reading it is Sorley's title printed in a spelling his volume does not use. Either way the leaf prints a form no identified edition of either text carries, and it is the one site out of five in this leaf where the missal's word stands without its acute."
required_result = "Line 93 prints one of the two words as its own edition prints it, and the sentence makes clear which text it is quoting. If it means the appointed antiphon's word, which the entry's title and its \"Appointed text and locus\" field make the natural referent, it reads `exspectávi` -- the form propers/verified.md section 7 collates and the form sections/00-map.tex line 14, sections/05-appointed-text.tex line 221, sections/20-themes.tex line 130 and sections/40-notable.tex line 71 already carry. If it means the title standing over Sorley's poem, it reads `expectavi`, as lines 75 and 83-84 of the same entry already print it, and the sentence names it as the poem's title rather than as \"the confident Latin\" simply. No third form may stand anywhere in the entry. No retrieval is required: propers/verified.md holds the missal's accentuation and the entry itself holds Sorley's spelling and the 1570 layer's `expectaui`."
repair_target = "authoring"

[[findings]]
id = "CON-CIT-026"
lane = "citation-integrity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/20-themes.tex, unit 4 \"One voice through every change of person\", lines 122-125, the clause \"And at three places in this Mass's two psalm-antiphons Augustine's lemma is not the chant's, so there what he expounds is the psalm and not the sung text\". main.tex line 23 inputs sections/20-themes unconditionally, so the sentence is published in both the canonical full edition and the synthesis companion."
problem = "The stated count is short. The two psalm-antiphons are the Introit's Ps. 85 and the Offertory's Ps. 39, and the leaf's own detailed commentary lists four places where Augustine's lemma is not the chant's, not three. Three of them are at Ps. 85, set out at sections/30-commentary.tex lines 239-245: \"Augustine's v. 1 has no ad me\", \"his v. 3 reads Miserere mei where the missal prints mihi\", and \"his v. 4 reads Iucunda where the missal prints Laetifica\". The fourth is at Ps. 39 and the same file states it in the same terms, sections/30-commentary.tex lines 793-795, the Offertory witnessnote opening \"The dative is Augustine's point, and his lemma is not the antiphon's\" and quoting \"Attendit mihi\" where the antiphon sings respexit me. sections/35-source-grounded-synthesis.tex lines 18-21 confirms the same asymmetry from the other side: Cassiodorus carries respexit me, deprecationem meam and hymnum at Ps. 39:2-4 while \"Augustine carries deprecationem meam and hymnum\" only. research/scope.md puts the figure higher still: its C4 limit at lines 206-208 reads \"Augustine's lemma at Ps. 85:1 lacks the antiphon's ad me and reads Miserere mei, and at Ps. 39:2 reads Sustinens sustinui and Attendit mihi\", and section 2.1 at lines 352-354 adds the Iucunda departure at Ps. 85:4, so the brief holds five places and the leaf publishes three. The neighbouring clause in the same sentence is scoped correctly to both antiphons and is right -- \"Cassiodorus's lemma departs from them at miserere mei alone\" is true of Ps. 85 and Ps. 39 together -- which is what makes the Augustine half read as a count of both antiphons rather than of the Introit's alone. As it stands the guide tells a reader that Augustine's exposition is of the psalm rather than of the sung text at three places when it is at four, and the place it silently drops is the Offertory's, the one place where the number matters to the argument that unit 4 is making about both antiphons at once."
required_result = "The number is wrong and the list is right. sections/20-themes.tex must state a figure that agrees with the four departures the leaf itself prints -- Augustine's missing ad me at Ps. 85:1, Miserere mei at Ps. 85:3, Iucunda at Ps. 85:4 and Attendit mihi at Ps. 39:2 -- or, if Sustinens sustinui at Ps. 39:2 is carried in from research/scope.md lines 80-81 and 206-208, a figure that agrees with five. Alternatively the clause may keep \"three\" and narrow its scope to the Introit's psalm, in which case the Offertory's departure must be stated beside it rather than absorbed, since the sentence's whole point is that Augustine expounds both psalm-antiphons on one principle. Nothing has to be retrieved and no correction to the brief is required: research/scope.md lines 80-81, 206-208, 352-354 and 1177-1179 record every departure by name and by locus, and sections/30-commentary.tex lines 239-245 and 793-795 already carry all four correctly into the guide."
repair_target = "authoring"

[[observations]]
lane = "evidence-discipline"
location = "sections/50-interpretive.tex lines 11-12, the closing clause of the exploratory notice: \"The precedent search behind each, its corpus and its bounds, is recorded in \\texttt{research/scope.md} and summarised in the terminal appendix.\" main.tex line 33 inputs the file unconditionally, so both editions render the notice."
note = "The second half is still untrue, as this lane recorded at the fourth, fifth and sixth evaluations. sections/90-scope.tex names the precedent search exactly once, at line 247 in \"Review state\", and only as one of the things research/scope.md holds; its \"Search limits and material negative results\" list at lines 148-213 runs ten bullets and none of them is the precedent corpus or its boundary, which research/scope.md section 3.5 states -- 669 proper-guide files, 628 article files, both providers' theology and history trees, the tracked calendar registry, with the open web and every external database excluded -- and which reaches no reader-facing page of either edition. My criterion 1 reaches whether the proposals are labelled exploratory, which they are, and criterion 2 reaches transcription fidelity to the identified edition; neither reaches whether a cross-reference the guide prints from one of its own sections to another is satisfied by the section it points at. Four consecutive evaluations have had to record this outside every lane's criteria, which by the shared fragment's own test makes it a missing criterion rather than a fact about this leaf: after the mandated proposal fields, a stated count its own list contradicts, and the appointed Latin against propers/verified.md, no criterion in the shared list owns whether an internal cross-reference the guide prints is true. Recorded again only because the tracked standing record is rewritten whole and would otherwise drop it."

[[observations]]
lane = "evidence-discipline"
location = "research/scope.md line 51, in section 1.1: \"Between the eighth-century book and 1962 the wording changed in exactly one place: the Secret's adverb moved, both ancient Roman witnesses reading `contra diabolicos tueantur semper incursus` against the 1962 `contra diabolicos semper tueantur incursus` (LIT-002)\", with section 2.8 pointing back to it at line 942 as \"the one word-order change\"."
note = "The brief contradicts itself, and the contradiction is of a kind that seeds a reader-facing error. Section 6 item 5, at lines 1332-1335, records a second wording difference between an eighth-century book and 1962: \"The Old Gelasian reads `possideat, Domine, quaesumus` where the Hadrianum and 1962 read `possideat, quaesumus, Domine` (LIT-002, COV-007)\". That is a second place where the wording of the appointed orations moves between the eighth-century books and 1962, so \"exactly one place\" is not what the brief's own record of competing judgments holds, and section 2.8's back-reference propagates it. The leaf did not inherit the error: sections/30-commentary.tex lines 172-181 and sections/synthesis/20-integrated-commentary.tex lines 260-267 both state two places and correctly add that the Hadrianum stands apart from 1962 at one and the Old Gelasian at two. My criteria reach the leaf's reader-facing claims and the evidence state each carries; criterion 2 is transcription fidelity in the leaf and the brief is not reader-facing, so neither reaches the internal consistency of research/scope.md. Recorded because an author who read section 1.1 alone would print \"exactly one place\" and be wrong, and because only research-synthesis may write that file. A cross-reference in section 1.1 to section 6 item 5, or striking \"exactly\", would close it."

[[observations]]
