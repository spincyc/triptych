[[findings]]
id = "CON-EVI-053"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md lines 585-586 (section 2.5, the Alleluia: 'Nothing further needs restating except its extent: this is the only element of the ten for which no checked witness expounds the appointed wording, and no dedicated search for one was made (PAT-021)'), against lines 233-238 of the same file (section 1.2, the grouping of the eight departures: 'Unattested in any witness any lane opened: miserere mihi for mei at Ps. 85:3, which Augustine and Cassiodorus both read mei ... and super omnem terram at Ps. 94:3 ... The Communion's two departures, dedero for dabo and pro saeculi vita for pro mundi vita ... and neither is Augustine's or Aquinas's lemma') and lines 938-942 (section 2.7, the Communion: Augustine's lemma 'caro mea est pro mundi vita'; 'Aquinas's likewise, and his gloss on the tense turns on the simple future and cannot be transferred to dedero, nor his exposition of the universality of the effect to saeculi')."
problem = "The brief states a uniqueness claim that the evidence it already holds contradicts, and the canonical leaf reproduces it (see CON-EVI-054). Section 2.5 asserts that the Alleluia is the only one of the ten elements for which no checked witness expounds the appointed wording. Section 1.2 of the same brief puts three readings, not one, outside every lemma any lane opened - miserere mihi at Ps. 85:3, super omnem terram at Ps. 94:3, and the Communion's dedero and saeculi - and section 2.7 records at the Communion that Augustine's lemma is dabo and pro mundi vita and that Aquinas's gloss on the tense cannot be transferred to dedero nor his exposition of the effect to saeculi. So the Introit and the Communion are elements whose appointed wording no checked witness expounds on the brief's own record, and the Alleluia is not the only one. The brief holds the true and narrower statement in two other places and does not carry it into section 2.5: line 93, 'The Alleluia is the one element with no reception at all, and the reason is textual', is glossed in its own next sentences as the element where the substituted word is the one both expositions are built on and neither development survives it, and line 2447 states only that the Alleluia is the one element for which the brief supplies no reception of the appointed wording. No retrieval is needed: every fact the correction requires is in sections 1.2, 2.1, 2.5 and 2.7 already."
required_result = "Section 2.5 of research/scope.md states what its own sections 1.2 and 2.7 hold: that no checked witness expounds the Alleluia's substituted predicate, and that what is proper to this element is that both retained expositions of Ps. 94:3 are built on the word the chant removes, so that neither survives the substitution - not that it is the only element of the ten whose appointed wording no witness expounds, the Introit's miserere mihi and the Communion's dedero and saeculi standing outside every lemma the brief records as well. The Alleluia's own negative, its bound at PAT-021 that no dedicated search was made, the Ps. 46:3 collocation and the section's grouping of the eight departures are unaffected and stand."
repair_target = "brief"

[[findings]]
id = "CON-EVI-054"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 527-528 (built canonical edition p. 16, the Alleluia subsection: 'Of the seven scriptural elements this is the one whose appointed wording no checked witness expounds') and src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/50-interpretive.tex lines 64-66 (built p. 27, P2's 'What the element-by-element reading misses': 'Treated on its own the Alleluia is the least integrated element of the ten, a verse of general praise whose own wording no checked witness expounds'), against sections/30-commentary.tex lines 246-252 (built p. 13, the Introit: 'miserere mihi stands in no Bible witness and in no patristic lemma opened here'), lines 905-907 (built p. 21, the Communion's Augustine witnessnote: 'His lemma is dabo and pro mundi vita, so this is exposition of the verse and not of the antiphon as sung') and lines 943-946 (built p. 21, the Communion's Aquinas witnessnote: 'His gloss on the tense turns on the simple future and cannot be transferred to dedero, nor his exposition of the universality of the effect to saeculi'), sections/20-themes.tex lines 97-99 (built p. 4: 'Augustine's and Aquinas's lemmata at that verse read dabo and pro mundi vita, so their expositions belong to the verse and not to the antiphon as it is sung'), sections/35-source-grounded-synthesis.tex lines 27-38 (built p. 22, C1: 'Two of the eight stand in no Bible witness and in no Latin or Greek lemma collated here: miserere mihi at Ps. 85:3 ... and super omnem terram at Ps. 94:3' and 'The Communion's two stand outside both groups'), and sections/90-scope.tex lines 167-170 (built p. 31: 'No Bible witness and no patristic or Greek lemma collated here reads super omnem terram at Ps. 94:3 or miserere mihi at Ps. 85:3')."
problem = "One evidence bound stated at two strengths inside the canonical edition, and the bolded form on p. 16 is the stronger. The sentence asserts of the Alleluia alone, among the seven scriptural elements, that no checked witness expounds its appointed wording; P2 on p. 27 repeats it of the Alleluia's 'own wording'. Five other passages of the same edition state the same negative of two further elements. On p. 13 the leaf says miserere mihi 'stands in no Bible witness and in no patristic lemma opened here'; on p. 21 it says twice, of the Communion, that Augustine's exposition is 'of the verse and not of the antiphon as sung' and that Aquinas's cannot be transferred to dedero or to saeculi; p. 4 says the same of both; C1 on p. 22 puts miserere mihi and super omnem terram together in one group of readings standing in no lemma collated, and the Communion's two in a group of their own outside every witness; and the appendix bullet on p. 31 repeats the Introit-and-Alleluia pair. The claim also fails in the other direction on the leaf's own showing: at the Alleluia Augustine's and Cassiodorus's lemmata carry the chant's Quoniam Deus magnus Dominus and Rex magnus and differ only in the predicate, exactly as Augustine's Communion lemma carries Panis and caro mea est and differs only at dabo and pro mundi vita, so 'appointed wording' picks out no property the Alleluia holds alone. P2's own 'Strongest limit' two lines below already carries the strength the record supports - 'No checked witness expounds the chant's predicate at all' - and the commentary carries it too, at 'Two continuous expositions of Ps. 94:3 stand here and both expound a different predicate; no witness located expounds the chant's'. The strength the record supports is that the Alleluia is the element whose departure is the word both retained expositions are built on, so that, as the same subsection already says, neither development survives the substitution."
required_result = "The Alleluia sentence on p. 16 and P2's 'What the element-by-element reading misses' field on p. 27 state the negative at the strength pp. 4, 13, 21, 22 and 31 state it - that no checked witness expounds the chant's substituted predicate, and that what is proper to this element is that both retained expositions of Ps. 94:3 are built on the word the chant removes, so that neither survives it - and drop the assertion that the Alleluia is the one scriptural element, or the one element of the ten, whose appointed wording no checked witness expounds, which the Introit's miserere mihi and the Communion's dedero and saeculi contradict in this edition's own pages. The clause about the three composed orations having no expositor, the two Alleluia witnessnotes, 'no witness located expounds the chant's', P2's anchors, mechanism, fruit and its threefold Strongest limit, and the Introit, Communion, C1 and appendix passages named above are unaffected and stand."
repair_target = "authoring"

[[findings]]
id = "CON-SYN-003"
lane = "synthesis-argument"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/20-themes.tex lines 158-164 (built canonical edition p. 4, the closing paragraph of unit 5, \"The one element that could have said ‘today’ is the one whose today is left unsung\"), against src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 517-522 (built p. 16, the opening paragraph of the Alleluia subsection)."
problem = "One substantial claim is established at full strength in both sections, with the same quotation printed in both, which is the criterion's own defect. Commentary lines 517-522 read \"Ps.~94 is a summons to worship in vv.~1--7 and an oracle of warning in vv.~8--11, the turn falling at v.~7/8; the chant's verse stands inside the summons as the first of its reason clauses, four verses before the turn, so the chant carries in the summons and not the warning. The warning half is what Hebrews quotes at length, at Heb.\\ 3:7--11, 3:15, 4:3, 4:5 and 4:7, three of the five returning to `Hodie si vocem ejus audieritis`.\" Themes lines 158-164 read \"The Alleluia sings Ps.~94 from inside the summons to worship, five verses before the oracle of warning opens at v.~8, and leaves that oracle unsung; the unsung half is where the psalm's whole New Testament reception falls: Hebrews quotes it at five places and three of them return to `Hodie si vocem ejus audieritis`.\" Both state the chant's position inside the summons, the warning left unsung, the psalm's whole New Testament reception falling in the unsung half, the count of Hebrews places and the three that return to the clause, and both print that Latin clause. The commentary carries the evidence the themes paragraph does not -- the psalm's two-part structure, the turn at v.~7/8 and the five loci named one by one -- and the themes paragraph needs none of it: its point is that the day's one possible `hodie` is the half the chant does not reach. The page-2 dossier row at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/10-date-location.tex lines 50-53 (built p. 2) carries the same claim a third time with the same five loci and the same Latin clause, but the profile requires that explanatory row to give the passage's textual history and claim-local sources, so it is not part of this finding."
required_result = "The claim stands at full strength at one place and is used, not re-established, at the other. Its fullest home is the commentary's Alleluia subsection at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 517-522, which is where the profile puts the textual analysis that proves the synthesis and which alone carries the summons/warning structure, the turn at v.~7/8 and the five Hebrews loci. Themes unit 5 keeps only the fact its argument needs -- that the Alleluia sings from inside the summons and leaves unsung the half in which the psalm's `hodie` stands -- and drops the re-establishing of the New Testament reception, the count of places and the reprinting of `Hodie si vocem ejus audieritis`, naming the Alleluia subsection instead if a pointer is wanted. Unit 5's conclusion, that what this Mass sings is the waiting and the `hodie` that would cut it short is the half the chant does not reach, stands unchanged, and no locus, count or evidence bound is lost from the home that keeps the claim."
repair_target = "authoring"

[[findings]]
id = "CON-SYN-004"
lane = "synthesis-argument"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/20-themes.tex lines 31-39 (built canonical edition p. 3, \"The first and last orations of the Mass say the same thing negatively, and their grammar says it too…\"), against src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 268-271 and 277-280 (built p. 13, the Collect subsection) and lines 963-970 (built p. 22, the Postcommunion subsection)."
problem = "Two substantial claims are met at full strength in both sections, which the criterion's closing clause forbids. (a) The Collect's incapacity and its semicolon. Themes lines 32-35 read \"The Collect denies the Church any standing of her own, `quia sine te non potest salva consístere`, and its semicolon is the hinge, so that the incapacity is stated before the prayer asks that she be governed\"; commentary lines 268-271 read \"The prayer's hinge is its semicolon, which divides the causal clause from the single petition it grounds, so that the two verbs of the first limb stand on one side of it and the one verb of the second on the other\", and lines 277-280 read \"`Sine te non potest salva consístere` denies the Church any standing of her own, and the same denial returns at the Postcommunion in the first person plural.\" The seven-word clause \"denies the Church any standing of her own\" is verbatim in both, the hinge is stated in both, and the commentary's sentence also makes the Collect-and-Postcommunion pairing that is themes unit 1's own conclusion. (b) The Postcommunion's held-back subject. Themes lines 36-39 read \"holds its subject back to the end of the clause behind two objects and a vocative: what possesses is named last, and what is possessed, `mentes nostras et córpora`, is named first\"; commentary lines 965-967 read \"The subject is held back to the end of its clause, behind two objects and a vocative: it is `doni cæléstis operátio` that is asked to possess, and its `efféctus` --- not `noster sensus` --- that is asked to go before.\" Same analysis, the phrase \"behind two objects and a vocative\" verbatim in both, nineteen pages apart, and the themes paragraph adds nothing to it. The English-gap block at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/05-appointed-text.tex lines 309-315 (built p. 9) also states the held-back subject, but the profile requires that block to say what the registered English leaves of the Latin unanswered, so it is not part of this finding."
required_result = "Each of the two claims stands at full strength at one place and is used, not re-established, at the other, and in both cases the fullest home is the element subsection: that is where the profile puts the grammatical analysis and claim-local qualification that prove the synthesis, and each subsection carries evidence the thematic movement does not -- the Collect's at lines 268-273 the disposition of the verbs about the semicolon and the pointing of the Benziger, Pustet, Venice and 1604 layers, the Postcommunion's at lines 965-970 the absent comma after `nostras` and the colon after `operátio`. (a) Themes unit 1 keeps its own conclusion, that the first and last orations say the same thing negatively, states that the Collect's semicolon puts the Church's incapacity before the petition it grounds, and drops the re-establishing of it, so that the sentence \"denies the Church any standing of her own\" stands once in the edition; the commentary's second load-bearing item at lines 277-280 takes the treatment its third item at lines 280-283 already has, naming the clause and pointing at the thematic movement for what the two prayers do together, rather than restating the want of standing and the Postcommunion's repetition of it. (b) Themes says that the Postcommunion denies the same standing in the first person plural and holds its subject to the end, and drops the analysis of the two objects and the vocative and the renaming of what possesses and what is possessed, which stay at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 963-970. Every Latin lemma, locus and evidence bound now carried survives at the home that keeps the claim, and unit 1's argument that the singular of the chants and the plural of the prayers are one body is untouched."
repair_target = "authoring"

[[findings]]
id = "CON-SYN-005"
lane = "synthesis-argument"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/35-source-grounded-synthesis.tex lines 49-57 and 116-126 (built canonical edition pp. 23-24, C2's expositors and C4's second paragraph), against src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 647-653 (built p. 18, the Ambrose witnessnote), lines 667-670 (built p. 18, the Augustine `Sermo` 98 witnessnote) and lines 711-714 (built p. 19, the Bede witnessnote)."
problem = "The Source-Grounded Synthesis prints the bier expositors' own words that the commentary's witnessnotes already print, and prints one of their readings twice inside itself. Four cases, with the synthesis locus first: (1) Ambrose, `nostri funeris portitores`, at synthesis lines 56-57 (\"Ambrose's bearers are the body's own fluxes, `nostri funeris portitores` (`Exp. Luc.` V.90)\") and at the close of the commentary's longer quotation at line 653 -- the same Latin tag printed in both. (2) Ambrose, `in ligno` and `per crucis patibulum`, at synthesis lines 117-118 (\"the dead man carried `in ligno` already had hope of rising, the wood being a sign of salvation `per crucis patibulum`\"), both fragments lifted from the single commentary quotation at lines 648-650, `spem resurgendi habebat, quia ferebatur in ligno \\dots\\ ut esset indicio salutem populo per crucis patibulum refundendam`, with the English around them rendering the rest of it. (3) Augustine, `Sermo` 98 §5, at synthesis line 123, \"the young man carried out of the gate is sin gone out into the deed\", which is commentary line 669, \"the young man carried out of the gate but not yet buried is sin gone out into the deed\", the same clause. (4) Bede: the commentary prints `male secura desperati peccatoris conscientia` with its bearers at lines 711-713, the synthesis renders that whole witnessnote into English at C2, lines 52-55 (\"Bede, at the bier, makes the thing carried the falsely secure conscience of a despairing sinner, and its bearers his unclean desires, the enticements of flatterers and poisonous company (`In Luc.` II, PL~92, 417--420)\"), and prints the same reading again a page later at C4, lines 124-126 (\"the bier is the sinner's falsely secure conscience… (`In Luc.` II, PL~92, 417--420)\"), so it stands three times in the edition and twice inside the synthesis with the same locus at both places. The section demonstrably knows the other way: C4 defers Cyril's touch to \"the third unit of the thematic movement\" at lines 120-122 and the Epistle's cut boundaries to \"the Epistle subsection of the commentary\" at line 110, and C1 defers the divergence table the same way at lines 9-11."
required_result = "Each of these four readings is set out at one place in the canonical edition. The commentary's witnessnote is the fullest home for the expositor's own words in all four -- that is where the profile puts the reception that proves the synthesis, and each witnessnote carries the full quotation, its section number and its text-state bound -- so C2 and C4 name and attribute each reading in their own prose, or point at the Gospel subsection, without printing `nostri funeris portitores`, `in ligno` or `per crucis patibulum` a second time, without repeating the commentary's clause about the young man carried out of the gate, and without rendering the Bede witnessnote back into English at its full extent. Bede's bier reading stands at one place in the synthesis: C2 keeps it, since the identity of the thing carried is C2's own claim, and C4 keeps only what its own claim adds, the restoration to the mother read as return to the Church's communion by priestly judgement. Every locus, work title and evidence bound the synthesis now carries -- `Exp. Luc.` V.90, `Sermo` 98 §5, `In Luc.` II, PL~92, 417--420, and the Syriac-through-English bound on Cyril at line 134 -- survives, and the arguments of C2 and C4 are unchanged: the verb keeps its object across the two elements and reverses its office, and the expositors of the bier supply the cross, the life-giving flesh and the sin."
repair_target = "authoring"

[[findings]]
id = "CON-CIT-001"
lane = "citation-integrity"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/50-interpretive.tex lines 53-56 (P2, the Mechanism field; built canonical edition p. 27), counted against the appointed Latin the same leaf prints at sections/05-appointed-text.tex lines 160-161 (built p. 7) and lines 189-190 (built p. 7)."
problem = "'Two magnus predications stand across those two elements, one of God as king over the whole earth and one of a prophet risen among us' is false of the two elements it counts over: three stand there. The Alleluia as the leaf prints it reads 'Quoniam Deus magnus Dominus, et Rex magnus super omnem terram' -- two magnus predications inside the one appointed versicle, of which the sentence counts only the second -- and the Gospel adds 'propheta magnus surrexit in nobis'. The leaf itself carries 'Quoniam Deus magnus Dominus' as the Alleluia's incipit in the page-1 map row and in the Alleluia commentary, so the uncounted third is not hidden anywhere: a reader who looks at the versicle the proposal anchors on finds it in the same clause. Under the stricter reading of 'predication' the count is wrong the other way -- the two genuine predications are both in the chant (Dominus is Deus magnus; Dominus is Rex magnus) and the Gospel's magnus is attributive to propheta -- so neither construal supports the sentence as written, and the number is load-bearing: the proposal's whole mechanism is the pairing of one universal predication with one local one. The brief carries the same figure at research/scope.md line 1892 ('the two magnus predications stand four elements apart'), but the material counted is the appointed Latin printed in the leaf and the repair needs no retrieval and no brief correction."
required_result = "The number is what is wrong, not the list. P2's Mechanism must state the count truly of the two elements it names -- either by counting the three magnus predications the Alleluia and Lk. 7:16 actually carry and saying which two the proposal pairs, or by dropping the count and naming the two phrases directly ('the chant's Rex magnus super omnem terram and the Gospel's propheta magnus'). Whichever form is chosen, no sentence of the leaf may assert a total over those two elements that the appointed Latin printed at pp. 7 and 7-8 contradicts."
repair_target = "authoring"

[[observations]]
lane = "evidence-discipline"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/35-source-grounded-synthesis.tex lines 85-88 (built canonical edition p. 23, C3: 'The Gospel's other appointment reads it against its own Old Testament figure. At the Thursday of the fourth week of Lent the Missal sets this pericope beside Eliseus and the Sunamitess's son, 4 Kings 4'), read against src/sources/calendars/roman-1962/propers.yaml."
note = "The tracked registry C3 measures itself against gives the appointed Gospel Lk. 7:11-16 at two other Masses, not one: key lent-4-thursday, and key s-monicae-viduae (S. Monicae Viduae, 4 May), whose Gospel is Lk. 7:11-16 - the widow of Naim at the Mass of Augustine's own mother, in a leaf that runs on Augustine throughout - so C3's definite singular 'The Gospel's other appointment' undercounts its own bounded collection; my criterion 13 checks a statement about an appointed text against propers/verified.md and the appointed-text section, and neither holds the registry, while criterion 7 is described as a stated count checked by counting what follows it, so I record it here rather than raise it in either lane. If a fourth class of unowned defect exists, this is a candidate for it: a definite article asserting a count over the calendar registry, which no criterion names."

[[observations]]
lane = "reception-sweep"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 238-240, the closing sentence of the Cassiodorus witnessnote at the Introit (built canonical edition p. 13: 'his verse numbering runs one lower than the Vulgate's in psalms carrying an inscription, so his Vers. 1 at a titled psalm is the Vulgate's v. 2'), and the same clause repeated at sections/99-references.tex lines 215-218 (built p. 35), against src/sources/works/cassiodorus/expositio-psalmorum/editions/latin-corpus-corporum-monumenta-web-2026-09-05/artifacts/monumenta-ps85-apparatus-latin-text/cassiodorus-ps85-latin.txt."
note = "New this iteration and verified in the tracked bytes: at Ps. 85 Cassiodorus's numbering runs level with the Vulgate, his (Vers. 1.) being 'Inclina, Domine, aurem tuam ad me' and his (Vers. 4.) 'Laetifica animam servi tui', so the caution is false at the one psalm whose witnessnote prints it, and the same witnessnote's own next paragraph uses his Laetifica as the Vulgate's v. 4 and contradicts it; the tracked Ps. 39 text shows the rule holding there, his (Vers. 1.) being Vulgate 39:2, and research/scope.md states it correctly and narrowly at line 568 as an instance at Ps. 91, the discriminator being whether the inscription is numbered as a separate verse (Pss. 39 and 91) or counted inside v. 1 (Pss. 85 and 94), which the leaf's own psalm-numbering correction box at sections/30-commentary.tex lines 83-88 (built p. 11) states rightly. I think this is a fourth class with no owner in the shared criteria list rather than a fact about this leaf alone: criterion 7 owns invented citations and stated counts, criterion 2 the appointed Latin's transcription, criterion 13 the appointed texts and criterion 14 the guide's statements about its own contents, and a misstated textual convention of a reception witness's edition falls between them; the repair, if it is a defect anyone owns, is one clause of the leaf and one of the References."

