problem = "Both passage records state a verification that names the wrong prayer. The Secret record's notes say the formulary correspondence was 'checked against the Latin `Tua nos, Domine, sacramenta custodiant` at marginal number 1571 of the 1962 Vatican typical edition', where this Secret stands at marginal number 1589; the Postcommunion record's notes say it was 'checked against the Latin `Mentes nostras, quaesumus, Domine, lumine tuae claritatis illustra` at marginal number 1573', which is not this formulary's Postcommunion at all -- that prayer is `Mentes nostras et corpora possideat` at marginal number 1591. The English each record carries is nonetheless the right English: I collated both against the tracked transcription artifact.eugene-cummiskey...temporal-orations-en at physical lines 156 and 157 and they are word for word what the leaf prints. So the defect is in the recorded citation and not in any text this guide publishes, and the leaf is right to cite these records; it also declares the defect itself at propers/verified.md lines 784-803 and leaves it to the source library. No stage of this run may write src/sources/, and amending either record would move the fingerprint the leaf's source-bindings are pinned to, so no repair_target is true of it."
required_result = "The maintainer is asked to decide whether the two `notes` fields are corrected in place -- naming `Tua nos, Domine, sacramenta custodiant` at marginal number 1589 and `Mentes nostras et corpora possideat` at marginal number 1591 -- and, if so, how the fingerprint change is to be propagated to the bindings pinned to these records in this leaf and in any other leaf that cites them; or whether the erroneous verification notes stand and the correction is recorded elsewhere."
escalated_to = "src/sources/works/eugene-cummiskey/roman-missal-english-laity/editions/philadelphia-1861/passages/post-pentecosten-15--secret.toml line 16 and src/sources/works/eugene-cummiskey/roman-missal-english-laity/editions/philadelphia-1861/passages/post-pentecosten-15--postcommunion.toml line 16"
