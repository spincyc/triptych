[[findings]]
id = "CON-EVI-038a"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md lines 575-577 (section 2.4, 'Text and its literary frame': 'Ps. 94 is a summons to worship in vv. 1-7 and an oracle of warning in vv. 8-11, and the chant takes the verse at the hinge, carrying in the summons and not the warning')."
problem = "The brief mislocates the appointed verse inside its psalm. The tracked Clementine (src/sources/bibles/clementine-vulgate/chapters/Ps/94.json, read for this evaluation) has the summons at vv. 1-7 (Venite, exsultemus v. 1; Venite, adoremus v. 6) and the oracle at vv. 8-11 (Hodie si vocem ejus audieritis v. 8), exactly as the brief's own sentence divides it; the appointed verse, v. 3 `quoniam Deus magnus Dominus, et rex magnus super omnes deos`, is the first reason clause of the summons and stands four verses before the turn at v. 7/8. Nothing about v. 3 is at a hinge. The evidence is held and stated wrongly; no retrieval is needed. The leaf inherits the sentence at three sites (CON-EVI-038b)."
required_result = "Section 2.4 locates v. 3 where the tracked Clementine puts it: inside the summons, as the first of its reason clauses, before the warning begins at v. 8; the words 'at the hinge' are removed or the hinge is placed at v. 7/8 and the chant's verse said to fall inside the first half. The rest of the paragraph (the summons half sung, the warning half unsung and quoted by Hebrews) stands."
repair_target = "brief"

[[findings]]
id = "CON-EVI-038b"
lane = "evidence-discipline"
severity = "blocking"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/10-date-location.tex lines 82-83 (built p. 2, the Alleluia explanatory row: 'The chant takes the verse at the psalm's hinge, carrying in the summons and leaving the warning unsung'); src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/20-themes.tex line 155 (built p. 4, unit 5: 'The Alleluia takes Ps. 94 at the psalm's hinge, carrying in the summons to worship and leaving the oracle of warning behind'); src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 516-517 (built p. 16, the Alleluia subsection: 'Ps. 94 is a summons to worship in vv. 1-7 and an oracle of warning in vv. 8-11, and the chant takes the verse at the hinge')."
problem = "A statement about where the appointed text stands in its psalm that is false of the text as the leaf prints it. The Alleluia sings Ps. 94:3, `Quoniam Deus magnus Dominus, et Rex magnus super omnem terram`, the first reason clause of the summons; the hinge between the halves the leaf itself names (summons vv. 1-7, warning vv. 8-11; the dossier's own summary cell at 10-date-location.tex line 80 prints exactly that) falls at v. 7/8, four verses later. The tracked Clementine at Ps. 94 (read for this evaluation) confirms the halves. The figure is repeated at three sites and the fifth thematic unit builds its 'today left unsung' contrast on it; the contrast survives without the hinge, but the hinge is not so. The brief carries the same sentence (CON-EVI-038a), on which a later authoring pass would otherwise regenerate it."
required_result = "All three sites say where v. 3 stands - inside the summons, its first reason clause, before the warning that opens at v. 8 - or drop the hinge figure and keep the two-halves contrast; afterwards no sentence of the leaf says the appointed verse stands at the psalm's hinge, and p. 2, p. 4 and p. 16 agree with the tracked Clementine's Ps. 94."
repair_target = "authoring"

