location = "research/scope.md, sec. 2.8 (lines 942 and 948), sec. 10.1 item 8 (line 2177) and sec. 11 item 5 (line 2418) - \"Four further witnesses number the Mass\", \"the three prayers all four numbering witnesses carry\", \"the four-witness Sunday-numbering split\", \"Wilson's four numbering witnesses\""
note = "The brief states this count as four at four places while its own reproduced apparatus names five witnesses - Rheinau, S. Gallen, Gerbert and Menard at 1962+2 and Pamelius at 1962+1, from the marginal citations `R. S. / Gerb. 175. / Pam. 411. / Men. 179.` - and sec. 6 item 1 lists all five without a count. The leaf itself is right and consistent, printing five at sections/30-commentary.tex lines 124 and 133 and in the synthesis companion's unit 6, so nothing reaches the reader wrongly; what is at risk is a later author or repair pass taking the number from the brief. I believe this is a gap in a lane's criteria rather than a fact about the document: criterion 7 owns \"a stated count its own list contradicts\" but scopes itself to reader-facing prose (\"Every stated count in reader-facing prose is this criterion's\"), and criterion 10 reaches scope.md only for its existence and format, so an arithmetic slip inside the brief is owned by nobody. My own lane fragment forbids me to report or observe the reader-facing form of this class, and this is not that form."

[[observations]]
lane = "synthesis-argument"
location = "sections/20-themes.tex lines 32-34, unit 1: \"and its semicolon is the hinge, so that the incapacity is stated before anything at all is asked\"; and sections/50-interpretive.tex line 22, proposal P1 'Mechanism': \"The Collect's own grammar states the incapacity before it asks anything\". main.tex lines 23 and 33 input both files unconditionally, so both sentences reach both editions."
note = "Unrepaired, and I reach the same verdict reading the Collect fresh against sections/05-appointed-text.tex lines 60-61, which print it as \\latin{Ecclésiam tuam, Dómine, miserátio continuáta mundet et múniat: et quia sine te non potest salva consístere; tuo semper múnere gubernétur.} The first limb is already a petition -- Cummiskey's registered English at line 65 renders it \"May thy continual mercy purify and defend thy church\" -- so the causal clause does not precede everything the prayer asks; sections/30-commentary.tex describes the same pointing accurately as dividing the causal clause from the single petition it grounds, and P1's own next clause at sections/50-interpretive.tex lines 24-25 gives the accurate narrower form, \"before it asks that she be governed\", so only these two sentences overstate it. sections/50-interpretive.tex was edited in the most recent pass and the sentence survived it. My criteria test the shape of a synthesis unit and of a proposal -- whether the unit is cross-proper and draws on more than one element and more than one witness, whether the proposal is labelled exploratory, anchors two named elements and carries its four mandated fields -- and not the truth of a claim asserted inside one; criterion 2 is transcription fidelity to the identified edition and criterion 7 is stated counts, and neither reaches it either. This is the third consecutive evaluation at which this lane has had to record it outside every lane's criteria, which by the shared fragment's own test makes it a missing criterion rather than a fact about this leaf: after the mandated proposal fields, a stated count its own list contradicts, and the appointed Latin against propers/verified.md, no criterion in the shared list owns whether a textual claim asserted inside a synthesis unit or a proposal is true of the text it is made about. Recorded again because the tracked standing record is rewritten whole and would otherwise drop it."

[[observations]]
lane = "synthesis-argument"
location = "sections/20-themes.tex lines 30-31, unit 1, the run-in thesis of the second paragraph: \"The two prayers that frame the communion rite say the same thing negatively, and their grammar says it too.\" The two prayers the paragraph then treats are the Collect at lines 31-32 and the Postcommunion at line 34. main.tex line 23 inputs sections/20-themes.tex unconditionally, so the sentence reaches both editions."
note = "Unrepaired since this lane first recorded it, and still wrong on the leaf's own map: sections/00-map.tex lines 9 and 15-17 place the Collect among the propers of the Mass of the Catechumens, said before the lesson, while what stands on the near side of the communion rite is the Secret and the Communion antiphon. The pair the paragraph actually treats, Collect and Postcommunion, frames the whole Mass and not the communion rite. The argument does not depend on the phrase -- what the paragraph demonstrates is that the first and last orations deny standing to the Church and to the communicant respectively, which unit 4 of the same section restates accurately at lines 116-120 as objects narrowing from \\latin{Ecclésiam tuam} to \\latin{nos} to \\latin{mentes nostras et córpora} -- so calling the pair the Mass's outer prayers would carry it unchanged. Recorded rather than raised for the same reason as the observation above and as the same candidate missing criterion: my criterion 4 reaches whether a synthesis unit is a cross-proper argument drawing on more than one element and more than one witness, which unit 1 plainly is (Introit, Collect, Gradual, Gospel and Postcommunion; Cyril and Augustine), and not whether a descriptive sentence inside it is true of the rite."

[[observations]]
lane = "citation-integrity"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/99-references.tex, taken as a whole and in three particular entries: the tracked-Clementine entry (lines 77-81), the Douay-Rheims entry (lines 82-87) and the Cummiskey 1861 entry (lines 88-95), read against sections/30-commentary.tex lines 234-247 and 978-987, sections/synthesis/20-integrated-commentary.tex lines 313-316 and sections/05-appointed-text.tex lines 234-247."
note = "Three used witnesses are cited in a way that understates or omits the use, and the shortfall is now in its second consecutive evaluation. The Clementine entry lists \"Pss. 39, 46, 85, 91 and 94, Gal. 5--6, Lk. 7 and Jn. 6\" while the guide reports tracked-Clementine readings and exhaustive sweeps at the ascriptions of Pss. 72-88, the doxologies at Ps. 71:19-20 and Ps. 88:53, Ps. 87:12, Ps. 69:2-3, Ps. 5, Ps. 37:5, Ps. 117:19, Ecclus. 48:25, 3 Kings 17:23, 4 Kings 4, Eph. 2:19, Gal. 4:19, Heb. 3:7-11, 3:15, 4:3, 4:5, 4:7 and Heb. 10:5. The Douay entry's locus list omits Ps. 46:3, which sections/30-commentary.tex line 568 quotes as the Douay's. The Cummiskey entry names the Collect, Secret and Postcommunion and \"the source of the nineteenth-century rendering of the Alleluia's versicle\", but not the Offertory rendering the guide also quotes from it, at sections/05-appointed-text.tex lines 241-244. And the four books behind the orations' published negative -- the Veronense in two scans, Ferotin's Liber mozarabicus sacramentorum, Bannister's Missale Gothicum and Lowe's Bobbio Missal -- are named by editor in both editions' reader-facing prose and reach no References entry at all, with no edition, date or locus anywhere in the guide. My criterion 7 asks whether only sources actually used are cited, and by that test nothing here is wrong: every one of these is used, and every locus is right where it is used. No criterion in the shared list appears to own the converse -- a used witness whose References entry understates the use, or never appears there. The same sighting was recorded by this lane at the previous evaluation for the first two entries; that it has had to be recorded again, with two further instances, is by the shared fragment's own test a missing criterion rather than a fact about this leaf."

[[observations]]
lane = "citation-integrity"
location = "research/scope.md lines 941-950 (section 2.8, the Gelasian numbering witnesses), line 570 (section 2.4, the Hebrews loci) and line 1687 (section 7, NQ-5, the distance between Gal. 6:2 and 6:5), each against the corresponding passage of the leaf."
note = "Three stated counts in the read-only brief are wrong and the leaf has already corrected all three; recorded so that a later pass does not conform the leaf back to the brief. (1) Section 2.8 opens \"Four further witnesses number the Mass and disagree by one\" and then names five in the apparatus it quotes -- Rheinau, S. Gallen, Gerbert, Pamelius, Menard -- and closes \"the three prayers all four numbering witnesses carry\"; sections/30-commentary.tex lines 160-170 and sections/synthesis/20-integrated-commentary.tex lines 269-274 correctly print five in both places, which is what the five sigla `R. S. / Gerb. 175. / Pam. 411. / Men. 179.` support. (2) Section 2.4 says Hebrews returns to `Hodie si vocem eius audieritis` \"four times at Heb. 3:7-11, 3:15, 4:3, 4:5, 4:7\"; the tracked Clementine carries the phrase at Heb. 3:7, 3:15 and 4:7 and not at 4:3 or 4:5, and sections/10-date-location.tex line 47, sections/20-themes.tex line 154 and sections/30-commentary.tex lines 516-517 all correctly print three of the five. (3) NQ-5 twice says Paul sets Gal. 6:2 and 6:5 \"four verses apart\"; sections/40-notable.tex line 158 correctly prints three. My criterion 7 reaches stated counts in reader-facing prose, and the brief is not reader-facing prose; the profile-conformance lane recorded a factual slip in the same record at the previous evaluation for the same reason, so this looks like the same missing criterion -- nothing in the shared list reaches the factual correctness of research/scope.md -- rather than a defect in the leaf, which is right at all three sites."

[[observations]]
lane = "profile-conformance"
location = "sections/90-scope.tex lines 80-81, in the subsection \"Published text, English, and rights\": \"the ledger is not cited as evidence either way, and reconciling it belongs to the lane that owns it.\" main.tex line 34 inputs sections/90-scope unconditionally, so the sentence reaches both editions."
note = "Unrepaired, and this is the third consecutive evaluation at which this lane has had to record it outside its own criteria. A reader-facing sentence prints this production workflow's own vocabulary -- \"the lane that owns it\" -- which qualifies no claim and means nothing to a reader of a hand-missal companion. Criterion 12 cannot reach it: `Appendix: Scope and Qualifications` stands on that criterion's out-of-scope list as qualification by design and the shared fragment states that the out-of-scope list is the entire boundary; criteria 9 and 10 do not reach a sentence's register at all. Nor does the mechanical screen, although its rule for exactly this form exists: scripts/_house_voice.py's \"the production pipeline is named\" rule matches `(this|the|no|any|one) lanes?`, but EXEMPT_SECTION masks `Appendix\\b.*` whole before any rule runs, so the appendix is unread by the one check that would refuse the phrase. I think this is a missing criterion rather than a fact about this leaf: the appendix's exemption is a blanket exemption from register review, and run-state or pipeline vocabulary printed for a reader is not qualification by design. A criterion reaching workflow and run vocabulary in any reader-facing section, appendix included, would own it. Recorded again only because the tracked standing record is rewritten whole and would otherwise drop it."

[[observations]]
