[[observations]]
lane = "reception-sweep"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/research/scope.md line 1092 (section 3.2 witness table, Cassiodorus row: 'PL 70, IA item patrologiaecurs27goog | OCR of a Google scan of Migne; poor, mangles individual words') and line 342, with the quotations it supports at src/claude/liturgy/roman-rite/1962/propers/temporal/55-fifteenth-after-pentecost/sections/30-commentary.tex lines 219-231, 470-478, 566-573 and 838-847 (built pp. 12, 15, 16 and 20) and the References entry at sections/99-references.tex line 214."
note = "Cassiodorus is the leaf's second Latin witness at all four psalms and carries load beyond his own subsections -- the totus Christus reading at two psalms, and the sixth-century attestation of ad me, respexit me, deprecationem meam and hymnum that C1 and C5 date. The single text state the brief declares for him is that Google-scanned Migne OCR, and I re-downloaded it (5.2 MB, IA metadata confirms volume 70, 1865): it contains 'CASSIODORI' and 'EXPOSITIO IN PSALTERIUM' in its running heads but none of the ten sentences the leaf quotes, and not the psalm incipits 'Bonum est confiteri', 'Inclina, Domine' or 'Expectans expectavi' either, its recognition being bad enough to mangle the publisher's own English boilerplate. That is a false-negative machine exactly as the brief's own section 10.5 warning describes, so it disconfirms nothing; what it means is that no later reader can re-verify these quotations from the source the brief names. I found no other transcription of the Expositio at these four psalms -- la.wikisource carries the work but its subpages for Pss. 39, 85, 91 and 94 are stubs, and Corpus Corporum and Documenta Catholica Omnia returned no usable text -- and one indirect corroboration, Rabanus Maurus's Expositio in librum Judith reproducing the hymn definition 'laus carminum lege composita ... quos idolis suis etiam gentilitas personabat' that the leaf prints as Cassiodorus's. Not a finding of mine: criterion 3 asks whether the sweep was made and its witnesses retained, and both are so, and I have no evidence of invention. Recorded because re-verifiability of a retained patristic lemma against its own declared text state is a real property of this evidence that no criterion in the shared list plainly owns -- criterion 2 is confined to the appointed Latin and criterion 7 to invention -- and because the cheap repair is a registration, the library already holding no Cassiodorus record at any of these psalms."

