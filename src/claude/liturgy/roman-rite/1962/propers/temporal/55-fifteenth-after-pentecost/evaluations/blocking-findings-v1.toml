location = "research/scope.md line 1217, section 4 item 19: 'The counts are at §7.4.'"
note = "An internal pointer slip in the brief: the per-element counts for the Introit, Gradual, Alleluia, Gospel, Communion and Offertory sweeps stand at section 7.5, 'Material negative results for the gallery' (lines 1776-1825); section 7.4 is 'Candidates recorded and not selected'. The leaf's own pointer is right, sections/90-scope.tex lines 200-201 saying only that the counts are recorded in research/scope.md, so nothing reaches the reader; recorded so that a later pass does not follow the brief's pointer to the wrong section. Same class as the observation above: a fact inside the brief that no criterion owns."
