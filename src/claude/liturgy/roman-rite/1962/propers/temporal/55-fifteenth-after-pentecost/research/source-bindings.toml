context = "The declared corpus over which the guide's bounded negative on the three orations was run: the Veronense in two independent scans, Ferotin's Liber mozarabicus sacramentorum, Bannister's Missale Gothicum and Lowe's Bobbio Missal, beside the two Wilson layers that are the positive control. Fourteen distinctive strings were searched after de-hyphenation, accent stripping and letter folding, returning zero in all five negative layers and hitting twelve of fourteen in Wilson. It is bound as a boundary and not as a search receipt: the layers are not registered as indexable, so no replayable receipt exists, and the four bounds the guide publishes with the negative -- literal search cannot see a paraphrase, three of the four are diplomatic editions, the ae-ligature failure mode is demonstrated on this very material, and the corpus excludes every eighth-century Gelasian and every later Roman book -- travel with it."

