context = "Every Greek word this guide prints from the New Testament comes from this text and from no other Greek edition. It supplies the two different nouns at Gal. 6:2 and 6:5 that the Latin renders by one; the simple future and the genitive at Jn. 6:52 that the Communion's `dedero` and `saeculi` answer to neither; the connective at Lk. 7:11 that the missal's incipit replaces; and the exhaustive lemma sweeps behind the counts of the carrying verb, of `only-begotten`, of the verb rendered `misericordia motus` and of the visitation verb, each of which agrees verse for verse with the corresponding Latin-stem sweep. The transliteration is this guide's, and the file is a morphologically tagged digitisation and not a critical apparatus."

