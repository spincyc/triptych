# Publication-local record of how this guide used the reusable source library.
# It supplements and does not replace `propers/verified.md`, which is the text
# control for every appointed form, or `research/scope.md`, which owns the
# reception matrix, the audits and the material negative results.
#
# Four things govern the whole file.
#
# First, `states` describe what this publication actually did with the record,
# not what the record could support. Nothing patristic or medieval below is
# `verified`: every one of those witnesses was read in an optical layer, a web
# presentation of the Maurist or Migne text, or a page image transcribed by eye,
# and no critical edition later than 1919 was opened anywhere. The `verified`
# state appears only where a page-image collation was actually made -- the 1962
# facsimile, the three orations' English in the 1861 Philadelphia scan -- or
# where a tracked machine-readable text was read directly for the exact loci
# named, which is the case for the Clementine and the Douay.
#
# Second, the patristic and medieval layer is bound here at ARTIFACT level and
# not at passage level, because this repository registers no passage record at
# any locus of Luke 7, at any of the four appointed psalms, or at any verse of
# the appointed Epistle. Each such binding therefore names its own loci in the
# edition's own citation form, and the guide's References carry the same loci
# with the edition state each witness must be cited in.
#
# Third, four classes of source the guide uses are NOT bound here, and each for
# a stated reason. Hesbert's `Antiphonale Missarum Sextuplex` is registered at
# catalogue level with no artifact and cannot be reached under the rights policy
# in force, so what is bound instead is the gregorien.info database's own pages,
# which is what the guide actually cites. Rheinau, S. Gallen 348, Pamelius,
# Menard and Gerbert were not opened, so the Sunday-numbering split is bound
# through Wilson's Gelasian edition, whose apparatus reports them. Anthony of
# Padua's two sermons are storage- and rights-restricted and are named in the
# guide only for the ordinal hazard, so nothing rests on them. And the tracked
# 1962 calendar registry is a repository derivative rather than a registered
# source, and is cited as such.
#
# Fourth, no `negative-search` binding appears. The bounded negatives this guide
# publishes were established by reading printed editions, by exhaustive sweeps
# over tracked bible text, and by literal search over optical layers that are not
# registered as indexable, so no replayable search receipt exists for any of
# them. The corpus of ancient sacramentaries over which the orations' negative
# was run is bound below as a corpus boundary and not as a search receipt.


