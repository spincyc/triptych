# The leaf's document type: its entrypoints and its Scriptural Date and
# Location page are generated by `tools/tpt document-types refresh`.
[document]
type = "proper-guide-v1"

[document.main]
pdftitle = 'Sixteenth Sunday after Pentecost: 1962 Roman Missal Proper Guide (Full Edition)'
pdfsubject = 'Full source-first companion to the 1962 Roman Missal propers, including complete appointed texts, per-element reception, source-grounded and exploratory synthesis, and documented cultural afterlives'
synthesis-pdftitle = 'Sixteenth Sunday after Pentecost (Synthesis Edition)'
synthesis-pdfsubject = 'Synthesis companion to the 1962 Roman Missal propers; complete appointed texts and the per-element reception sweep are omitted'
metadata = 'edition-branch'
preamble = [
  'format',
]
opening = [
  '\hypersetup{pageanchor=true}',
  '',
  '\begin{deepstudy}',
  { component = "orientation" },
]
body = [
  { component = "brief-synthesis" },
  '\label{triptych:brief-synthesis:next}%',
  '\ifdefined\TriptychSynthesisEdition',
  { component = "integrated-commentary" },
  '\else',
  { component = "appointed-text" },
  { component = "per-element-sweep" },
  '\fi',
  { component = "source-grounded-synthesis" },
  { component = "notable-and-quotable" },
  { component = "exploratory-synthesis" },
]
apparatus = [
  { component = "terminal-apparatus" },
  'sections/99-references',
  'sections/main-apparatus',
  'generation-metadata',
  '\par\endgroup',
  '\Needspace{3\baselineskip}',
  '\TriptychRightsNotice',
  '\end{deepstudy}',
]

[document.synthesis]
