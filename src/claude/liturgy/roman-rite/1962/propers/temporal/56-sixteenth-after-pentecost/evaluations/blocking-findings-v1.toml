problem = "Restated unrepaired from the leaf's standing-findings record, with the same id and the same severity, line numbers re-checked against the file as it now stands; the reviser reports leaving it deliberately because the brief synthesis sits inside the profile's exactly-two-page Themes constraint, and this lane may not raise as blocking an id it filed advisory. The same conclusion is stated at full strength in both passages and its closing sentence is reproduced near-verbatim across twenty-one words: `so every christological reading of these chants rests on the psalms' wider context, on typology or on the commentators above, and on no apostolic citation of the words sung' at sections/20-themes.tex l. 157-160, against `Every christological reading of these five chants therefore rests on the psalms' wider context, on typology, or on the commentators above, and on no apostolic citation of the words actually sung' at sections/30-commentary.tex l. 1098-1101. The commentary is the fullest home: it names Heb. 1:10-12 and Heb. 10:5-7 and enumerates the six appointed psalm excerpts, where the brief synthesis compresses all of that to `Hebrews reaching Ps. 101 and Ps. 39 only at verses the chants do not sing'. What is duplicated is therefore not the evidence, which is properly layered, but the guide's own concluding sentence, which is the recap the profile's closing clause asks to have removed."
