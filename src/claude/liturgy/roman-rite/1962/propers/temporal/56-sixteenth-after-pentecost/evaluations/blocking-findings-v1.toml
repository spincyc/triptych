note = "The record has not been brought forward past the iteration-1 revision. Its file mtime is 17:30 local, which is the 22:30:04Z it declares; the iteration-2 revision then rewrote sections/30-commentary.tex, 35-source-grounded-synthesis.tex, 40-notable.tex, 90-scope.tex and 99-references.tex at 18:07-18:11 local (23:07-23:11Z) to clear CON-EVI-024 and CON-CIT-010/011/012, and neither refreshed the timestamp nor appended a contribution for that pass -- so the leaf's ten contribution records run authoring, four prior-production revisions, this run's author-proper and its first two content revisions, and stop one revision short. The profile requires both halves at guidance/liturgy/roman-1962-propers.md l. 365 (`refresh the UTC revision timestamp and accurately append materially distinct AI contributions'), and its publication gate at l. 381 asks that generation metadata be `accurate and terminal'. No mechanical gate catches it: `tools/tpt check-generation-metadata --provider claude' returns `Generation metadata valid' because it validates the record's shape, and content-preflight's `provenance-matches-run' holds only the five run identity fields, which are correct. No lane of this stage owns it either -- criterion 9 reaches reader order and page assignment and the record does stand terminal at position 12; criterion 10 names verified.md, retrieved.txt and scope.md and no other record; criterion 7 reaches stated counts. I think this is a fourth unowned class in the sense the stage fragment means: the currency and completeness of the terminal generation-metadata record, which the profile requires, which no criterion of this stage names, and which the reviser is not told to update because only the author-proper fragment carries the instruction (workflows/fragments/propers/author-proper.md l. 70-103) and the content-revision fragment mentions the file nowhere."
