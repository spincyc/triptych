location = "sections/30-commentary.tex l. 320-331 (element 2, Collect, the paragraph beginning `A second Latin voice reaches the prevenient half of the doctrine'), against sections/30-commentary.tex l. 984-1003 (element 9, Communion, the Cassiodorus witnessnote, quotations at l. 987-989), l. 965-982 (element 9, the Augustine witnessnote, quotations at l. 971 and l. 973-974) and l. 804-820 (element 7, Offertory, the Cassiodorus witnessnote, quotation at l. 811-812); with sections/20-themes.tex l. 34-39 (brief synthesis, unit 1)."
problem = "Restated unrepaired from the leaf's standing-findings record, with the same id, the same severity and line numbers checked against the file as it now stands; the reviser reports leaving it deliberately because clearing it would strike four whole quotations and move pagination, and this lane may not raise as blocking an id it filed advisory. The claim that Cassiodorus at the Communion's psalm says what Augustine says there, so that at that clause the two Latins are one judgment restated and not two, has three homes in the canonical edition and no fullest one, and four quotations are printed whole twice inside the detailed commentary alone. Commentary element 2 prints `quae nullis meritis praecedentibus gratis semper impenditur' and `Cum totus hic psalmus gratiam Domini, quae gratis datur, summa intentione commendet' at l. 322-324; both stand whole again in the Cassiodorus witnessnote at element 9, l. 987-989, which repeats the characterisation too (`he says what Augustine says and nearly in Augustine's words'). Element 2 prints `aliter enim liberari non possumus, nisi nos Divinitas propitiata respiciat' at l. 325-326; it stands whole again inside the Cassiodorus witnessnote at element 7, l. 811-812. `nihil tuum praecessit' and `docuisti me nihil in me praecessisse' stand at element 2, l. 327-329, and again in the Augustine witnessnote at element 9, l. 971-974. The brief synthesis states the same claim with one of the same quotations a third time at sections/20-themes.tex l. 34-39. The element-2 passage and the two witnessnotes are at the same layer of the edition and do the same proving work, so the repetition is not the profile's state-then-prove design; the brief synthesis's short statement is that design and is not the defect."
required_result = "Each of the four quotations is printed whole in exactly one reader-facing place: the two Cassiodorus Ps. 70 clauses and the two Augustine clauses in the element-9 witnessnotes, the Cassiodorus Offertory gloss in the element-7 witnessnote. The cross-element point at sections/30-commentary.tex l. 320-331 is made by naming the fact and pointing to those elements rather than by reprinting their Latin, so that the claim that the two Latins are one judgment restated and not two keeps one fullest home, stated once in the detailed commentary. The brief synthesis's summary at sections/20-themes.tex l. 34-39 may stand as it is."

