note = "Unchanged from iterations 0 and 1 and still standing deliberately; re-recorded because evaluations/blocking-findings-v1.toml is rewritten whole for this stage after each evaluation, so dropping it erases a live sighting. I re-checked every passage against the files as they now stand. The canonical commentary still says each of Cassiodorus's four agreements with the chants \"rests on one word of one printing\", while three files both editions input call them lemmata -- the scope appendix's \"lemmata on which his agreement with the chant turns\" and \"lemmata on which four of the agreements above rest\", and the References entry's \"no critical text was collated at those four lemmata\" -- and three of the four are clauses and not single words (suavis ac mitis es ... copiosus in misericordia, videbitur in maiestate sua, quia mirabilia fecit Dominus, Domine in auxilium meum respice). The companion prints \"each of them hangs on one lemma of a single printing\", which is what the shared files support. The revision was instructed not to revert the companion and did not touch the canonical sentence. Not raised as a finding: the defect is the canonical edition's and the companion did not inherit it, so no repair owner this run admits reaches it. A person may want to decide whether the canonical sentence should follow."

