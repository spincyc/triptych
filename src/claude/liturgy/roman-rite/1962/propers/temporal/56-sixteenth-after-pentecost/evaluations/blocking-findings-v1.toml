location = "sections/30-commentary.tex l. 22-27 (no running head names this Sunday anywhere in the facsimile), l. 29-32 (the facsimile's text layer giving `extranet' for `extrahet'), l. 38-45 (the 1920 and pre-1955 Benziger optical layers and their damaged numerals), l. 546-548 and l. 1089-1093 (the Chronicling America negatives); and sections/35-source-grounded-synthesis.tex l. 76-77 (the Sarum reading's optical state, 'with no page image of them opened') -- each against the same bound in sections/90-scope.tex l. 22-24, l. 31-33, l. 44-51, l. 277-283 and l. 256-258."
note = "This lane raised this class at iteration 0 of this production and at earlier productions of this leaf, and the tracked record is rewritten whole after each evaluation, so it is restated here or lost. Line numbers are refreshed against the leaf as it now stands; the Communion negative moved to l. 1089-1093 when this round's CON-CIT-001 repair reattributed it to the Douay. Each of these body passages states a bound the terminal appendix also states; guidance/liturgy/roman-1962-propers.md l. 279 confines work-wide bounds and qualifications to the terminal appendices and l. 386 forbids duplicating that apparatus earlier, while l. 279 also permits a qualification beside a claim 'when it materially changes that claim'. Reading them again this round I judge all six claim-local on that test -- the absent running head is the evidence for the last row of the Benziger collation table, 'extranet' is the evidence for the reading printed at Luke 14:5, the two damaged optical layers are why the century claim is split into its two halves, the two Chronicling America results are material negative results stated at the claims they bound, and Dickinson's optical state is why the Sarum arrangement is reported as it is -- so I raise no finding against any of them. What recurs is not a defect in this leaf but the absence of an owner for the judgement: criterion 9 reaches reader order and page assignment and not where a bound sits inside a section, criterion 10 reaches the existence and format of the three source records, and criterion 12 does not reach a passage whose subject is a book or a corpus. Saying it plainly as the fragment asks: I think this is a class wanting an owner in some lane's fragment -- deciding which bounds are claim-local and which are work-wide duplication -- and the repair belongs to the fragments rather than to this lane's diligence. One clause among the six, sections/35-source-grounded-synthesis.tex l. 77 'with no page image of them opened', is written about the guide's conduct rather than about the book; sweeping the whole canonical body again this round it is still the only such clause outside the proposals' controlling-limit fields, which criterion 12 puts out of scope, and criterion 12's own threshold is recurrence, so it is not a finding either."

