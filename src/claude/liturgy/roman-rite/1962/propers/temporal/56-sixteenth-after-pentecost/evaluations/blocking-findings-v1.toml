location = "The stage fragment propers/content-evaluation.md, criterion 13 ('Is every reader-facing statement about what an appointed text says, asks, or does true of the text as the leaf prints it?') and criterion 2's list of sites ('the appointed-text section, the page-1 map, the detailed commentary, the gallery, the proposals, the synthesis edition's own prose'), read against the lane fragment propers/lanes/content-evidence-discipline.md, whose criterion 13 says 'every statement the guide makes', and against this packet's REVIEW_SCOPE, which is research/scope.md alone for the second consecutive iteration. The passage read under them this round is research/scope.md §0.3 l. 198–214."
note = "Restated from this lane's own observation in the standing-findings record, because the record is rewritten per stage and the gap it names is unchanged. Both criteria I verified §0.3 under are worded for the reader-facing guide, while the whole of this round's REVIEW_SCOPE is again a research record no reader of the canonical edition meets, and neither fragment says whether the two criteria reach it. I read them as reaching it, on the same four things in the packet: the lane fragment's opening instruction to 'Read the canonical leaf and its research records'; criterion 2's 'wherever in the leaf it stands'; the existence of `brief` as a repair owner, defined as 'the evidence is there and the research brief states it wrongly', which presupposes an evaluation that can find such a thing; and the fact that an evaluation whose REVIEW_SCOPE is the brief alone would otherwise be one no lane could find anything in. The stakes have changed sign since iteration 2: there the reading produced a blocking finding (CON-EVI-015, now repaired), here it produced a verification that the repair holds, and a lane that read the fragments the other way would have returned a PASS this round without checking the only file that moved. Saying it plainly as the stage fragment asks: I still think this is a gap in the fragments and not a fact about this leaf — two lanes have now had to decide for themselves, across three iterations, that a criterion worded for reader-facing prose reaches research/scope.md when research/scope.md is what the run's own REVIEW_SCOPE points them at — and the repair is for the fragments to say which criteria are asked of the brief when it is what changed."

