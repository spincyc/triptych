note = "Restated because the tracked record is rewritten whole after each evaluation and this class is otherwise lost; this lane raised it at iterations 0, 1 and 2 of this production and at earlier ones. Neither sections/30-commentary.tex nor sections/35-source-grounded-synthesis.tex is in this iteration's REVIEW_SCOPE, so both are unchanged since this stage last read the document, and I re-opened l. 24-32 and l. 1093-1097 of the first and l. 75-78 of the second this round and found each passage at the line recorded. Each body passage states a bound the terminal appendix also states; guidance/liturgy/roman-1962-propers.md l. 279 confines work-wide bounds and qualifications to the terminal appendices and l. 386 forbids duplicating that apparatus earlier, while l. 279 also permits a qualification beside a claim `when it materially changes that claim'. I judge all six claim-local on that test, so I raise no finding against any of them. What recurs is not a defect in this leaf but the absence of an owner for the judgement: criterion 9 reaches reader order and page assignment and not where a bound sits inside a section, criterion 10 reaches the existence and format of the source records, and criterion 12 does not reach a passage whose subject is a book or a corpus. Saying it plainly as the fragment asks: I think this is a class wanting an owner in some lane's fragment --- deciding which bounds are claim-local and which are work-wide duplication --- and the repair belongs to the fragments rather than to this lane's diligence. One clause among the six, sections/35-source-grounded-synthesis.tex l. 77 `with no page image of them opened', is written about the guide's conduct rather than about the book; it is still the only such clause outside the proposals' controlling-limit fields, which criterion 12 puts out of scope, and criterion 12's own threshold is recurrence, so it is not a finding either."

