note = "Unchanged from iterations 0 and 1 and re-recorded for the same reason as the first observation; I re-checked all four pairs against the files as they now stand. Several of the companion's conclusions are still stated at full strength twice in one sitting, because sections/20-themes.tex renders in the companion immediately before the integrated commentary: the Sermo 165 tie to the Collect with auxilium and the close at section 7.9 (themes l. 121-122), the three places where Augustine's lemma differs and carries his argument (l. 142-146), the Offertory's verbatim identity with Ps. 70:12 (l. 136-137), and the four-way division of solius with the grace-alone verdict (l. 41-45). Measured against the brief synthesis alone this is 2.6 per cent of the companion's 3,627 authorial words with a longest run of eleven words, well inside tolerance, so I raise nothing; the duplication is conceptual rather than verbatim, and the same two-tier relation holds between 20-themes and 30-commentary in the canonical edition that passed its own content evaluation. The criterion's measure does not reach non-verbatim restatement of a section the companion itself prints, which may be a gap in the lane fragment rather than a fact about this document."

