note = "Restated from the leaf's standing-findings record with line numbers refreshed against the file as it now stands; SYN-CON-002's branch put this text in the \\else arm, where it reaches only the canonical reader, and the sighting survives the branch. A canonical defect the companion no longer inherits, recorded because my lane may not block on one. The name Sennacherib is printed nowhere in either edition's body. What the canonical sweep carries is Theodoret's Latin, 'Praecinit autem et Assyriorum in Hierosolymam impetum, et Ezechiae spem' -- the Assyrian assault on Jerusalem and Hezekiah's hope -- which is that episode without the king's name, so the canonical appendix supplies from research/scope.md a name the guide itself never prints. A reader of the larger book meets this exactly as the companion's reader would have, so it is the canonical edition's and not the derivation's."

[[observations]]
