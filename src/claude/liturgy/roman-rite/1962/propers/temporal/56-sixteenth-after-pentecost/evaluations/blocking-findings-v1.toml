note = "In the companion the reader has met no element-by-element reading; the profile replaces it with the integrated commentary they read at pp. 5-9. I judged this not a finding because the label names a way of reading the propers rather than a section of this guide, and a companion reader can take it as such without being sent anywhere -- and because for the companion it arguably reads better, the proposals' justification being exactly what an element-by-element procession would miss. I record it so that the sighting reaches the run rather than dying here, since a reader who takes the label as pointing at a section of the book in hand finds none."
