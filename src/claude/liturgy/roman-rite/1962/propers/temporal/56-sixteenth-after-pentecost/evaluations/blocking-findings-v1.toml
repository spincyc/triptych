location = "sections/99-references.tex l. 158-162, the companion arm of the Gueranger entry ('two passages of the chapter, at printed pp.~358 and 360, rest on the volume's own extracted text layer', companion p. 26), against the canonical arm at l. 168-172 ('the sentence quoted from p.~360 and the observation reported from p.~358') and the four-measures quotation the companion prints at sections/synthesis/20-integrated-commentary.tex l. 119-122, companion p. 6."
note = "New this round and recorded rather than raised, because the direction of the error is conservative and my criterion 2 is about bounds that go missing, not bounds that go vague. The companion quotes Gueranger at the four measures and cites it as 'one place within pp.~358--360'; its References note then says two passages at pp. 358 and 360 rest on the volume's uncorrected text layer while p. 359 was rendered. A companion reader therefore cannot tell whether the one Gueranger passage he has read is page-image verified. The canonical reader can, because the canonical arm names the two text-layer items --- the Epistle's grace sentence and the Church's-borrowing observation, neither of them the quotation the companion carries --- so p. 359 follows by elimination. Nothing here overstates the evidence: the companion's reader is left able to distrust a quotation that is in fact verified, which is the safe direction, and I judge it no finding on that ground. The reviser's own decision not to assert p. 359 is right on my criteria --- the canonical never states that page for this quotation, and asserting it would be a locus the companion has and the canonical has not --- so the elimination is what would have to be restored, not the page number: naming the two text-layer passages in the companion arm as passages this edition does not quote would do it in one clause of a file both editions input, with the canonical arm untouched. I record it because it falls between this lane's criteria and the conformance lane's: it is neither a bound dropped nor a statement about the other edition, and no criterion in either fragment owns the legibility of an evidence state after an abridgement renumbers what its reader can eliminate."

[[observations]]
stage = "synthesis-evaluation"
lane = "companion-conformance"
location = "format.tex l. 200-209, the canonical arm of \\editionnote (the arm that runs when \\TriptychSynthesisEdition is undefined), printed at sections/90-scope.tex l. 10 and reaching only the canonical build: 'A mechanical \\textit{synthesis companion} is compiled from the same source at the same identity with a \\texttt{-synthesis} suffix; it omits the appointed texts and the element-by-element sweep and adds nothing this edition does not contain.'"
note = "Restated unchanged, because evaluations/blocking-findings-v1.toml is rewritten whole for this stage after each evaluation and dropping it would erase a live sighting; format.tex did not change this round and I re-read the sentence rather than re-deriving it. Read as a claim about content --- that the companion asserts no claim, witness, locus, date, attribution or count the canonical edition lacks --- its truth is criterion 1 and the derivation-fidelity lane's, and I do not answer for it. Read as a claim about the artifact it is still not right: the companion does not only omit, it substitutes, printing a dedicated integrated commentary (sections/synthesis/20-integrated-commentary.tex, 366 lines, companion pp. 5-9) whose prose stands nowhere in the canonical edition, as guidance/liturgy/roman-1962-propers.md l. 176-193 requires it to. Recorded rather than raised because neither repair owner this run admits can clear it: the clause sits inside the canonical arm of an \\ifdefined branch, so the seam licence does not reach a sentence the companion's reader never meets, and nothing under sections/synthesis/ is the file that would have to change. What is still missing is a repair route for the half of it that no branch fixes. The companion's own arm, by contrast, is sound: 'owns no prose, research record or source audit of its own' restates the profile's own rule at l. 157-159 that the companion is not another leaf and owns no prose, and the leaf owns the integrated commentary file."

