location = "sections/90-scope.tex l. 107-116, the Theodoret sentences of 'English, and the translations of the witnesses', rendered on companion p. 21: 'every quotation above is Migne's Latin, his Greek being named where the two part and quoted nowhere --- his lemma at the Gradual, the Alleluia's word for a polity that Migne flattens to \\latin{religionem}, and the Communion's genitive. Two of the column stretches quoted above stand on the PG facsimile's uncorrected optical layer and on no page image: cols.\\ 1553--1554 ... and cols.\\ 1423--1424 ... The other six ranges --- cols.\\ 1159--1160, 1425--1426, 1555--1556, 1657--1658, 1679--1680 and 1681--1682 --- were read on rendered page images.'"
problem = "Two distinct dangles in one paragraph. (a) Three places are named where Theodoret's Greek is named above; the middle one is not in the companion. 'Polity' and 'religionem' occur in this leaf only at sections/30-commentary.tex l. 602-605, inside the omitted Alleluia witnessnote; the companion's only statement about Theodoret's Greek at the Alleluia is that it agrees with the chant (sections/synthesis/20-integrated-commentary.tex l. 175-176, 'Theodoret's Greek supplies the Alleluia's subject as the chant does'), which is a place where the two do not part. The Gradual lemma (l. 176-178) and the Communion genitive (l. 288-291) do stand above. (b) The eight column stretches are said to be 'quoted above'; in the companion no PG 80 column range is quoted anywhere above this sentence. I checked every occurrence of a column figure in the companion's rendered text: 1553, 1423, 1159, 1657 and 1679 appear only in this appendix sentence on p. 21 and in the References entry on p. 28, which is below it, not above. In the canonical build the five ranges stand above as \\wlocus headings of the Theodoret witnessnotes at sections/30-commentary.tex l. 184, 490, 599, 849 and 1020."
required_result = "Both clauses are branched on \\ifdefined\\TriptychSynthesisEdition in sections/90-scope.tex with the canonical arms unchanged. The companion arm of (a) names only the two partings its own text carries, the Gradual lemma and the Communion genitive; the wrong half there is the list, not the count-free claim about Migne's Latin. The companion arm of (b) either drops the 'quoted above' locator and states the two optical-layer ranges as an evidence bound on the Theodoret material this edition uses, or points to the References entry that carries the columns; the wrong half is 'quoted above', the eight ranges and their two states being correct as records of what was read."
