location = "sections/90-scope.tex l. 41-47 (the Benziger collation: 'differs from the typical edition at eight places, two of them substantive ... and six of pointing, abbreviation or paging') and l. 49-56 (the century chain: 'The stability claimed of the century before 1962 is therefore claimed of the ten texts and their order'), both unbranched and rendered on companion p. 20."
note = "Restated from the leaf's standing-findings record; both paragraphs still bound claims the companion never makes, and neither moved this round. The eight-place Benziger collation lives at sections/30-commentary.tex l. 20-49 and the century-chain claim at l. 43-45, both inside the omitted sweep; no sentence of the companion reports either. I again did not raise these because nothing in them is false of the companion and neither sends a reader anywhere: they over-disclose, stating the evidence state of material this edition does not print, where the findings I raise assert that absent material stands above or is quoted or used here. The same line puts on this side the residual clause in the newly branched 1861 passage at l. 68-75 -- 'all three orations were collated against that book's page images at printed pp.~429 and 431 and stand there character for character, including the abbreviated conclusion ``Thro'.''' -- which the reviser's own new prefix, 'which this edition reports on and does not print', turns from a claim about this edition's printing into a claim about the source record. I hold that line deliberately and consistently and say so again in case the run wants it drawn elsewhere; if it does, these are seam repairs of the same shape as SYN-CON-009."

