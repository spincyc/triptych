location = "research/scope.md §3.4 (\"Precedent corpus\"), item 3 of \"Three figures this brief carried at iteration 1 are corrected here\", l. 1812-1821: the total stated at l. 1813, \"Enumerated by `main.tex`, the two provider liturgy trees hold **62 documents**\", against the breakdown the same sentence's colon introduces at l. 1814-1818."
problem = "A total that its own rows do not reach. The breakdown enumerates fourteen claude documents (7 1962 proper leaves, 2 postconciliar proper leaves, an ordinary, two reference works, a comparative, a postconciliar ordinary) and forty-three gpt documents (15 1962 proper leaves, a ritual leaf, 11 postconciliar proper leaves, an ordinary, 13 reference works, a comparative, a postconciliar ordinary), which is fifty-seven against the sixty-two the sentence states -- a shortfall of five. The half I believe is wrong is the breakdown, not the total: the total is described as a machine enumeration by `main.tex` and sits beside the same paragraph's other measured figures at l. 1789-1791 (2,902 files, 332,704 indexed lines, 190 `main.tex`), all of them bound at l. 1788-1789 to one re-measurement \"at iteration 1 on the same commit\"; and the breakdown demonstrably omits at least one whole category, since neither provider's list names a postconciliar reference work and both trees carry one (`roman-rite/postconciliar/roman-missal-third-edition-en-us-2011/reference/liturgical-calendar/main.tex`, under `src/claude/liturgy` and under `src/gpt/liturgy` alike). Naming those two still leaves fifty-nine against sixty-two, so at least one further category or category figure is short, and the brief does not say which. This is advisory and not blocking on the evidence rather than as a queue position, and the discriminator is the one CON-CIT-014 used: the figure is reachable by no reader of the published guide. It stands nowhere in sections/ -- the leaf's counterpart sentence at sections/90-scope.tex l. 339-344 describes the same sweep with no numbers at all -- and §3.4's force as the bound on every \"not located\" in §9 rests on the measured corpus rather than on the prose categories. Severity is decided here and stays here for the life of the run. A fresh id: evaluations/blocking-findings-v1.toml names this defect in none of its four collections, and CON-CIT-012, CON-CIT-013, CON-CIT-014 and CON-CIT-015 are four other defects at four other passages, so none of their ids may carry it."
required_result = "The breakdown at research/scope.md l. 1814-1818 accounts for the sixty-two documents the same sentence states, or the stated total is brought down to the number the categories actually name. The number I believe is right is the sixty-two and the rows are what is short, so the cheaper repair is to add the missing categories -- the two postconciliar reference works at minimum -- and to check the remaining three against the same iteration-1 enumeration the figure came from. What must not happen is a recount against the repository as it stands now: this is a count over the collection and it is correctly bound at l. 1788-1789 to one re-measurement on one commit, and the two liturgy trees today hold sixty-four `main.tex` because a sibling leaf (claude's 55-fifteenth-after-pentecost) landed after the sweep, which the brief's own claude list at l. 1814-1815 shows by naming leaves 48, 49, 51, 52, 53, 54 and 56 and not 55. Nothing else in §3.4 changes: the file, line and `main.tex` figures at l. 1789-1791, the registry figures in item 2 (491 = 128 + 30 + 18 + 8 + 307, of which 430 carry an element, 3,259 elements, 1,034 with Latin body text) and the thirteen postconciliar leaves at l. 1818-1821 all reconcile as printed, and no passage of the canonical leaf changes for this."

[[advisories]]
stage = "content-evaluation"
id = "CON-PRO-002"
lane = "profile-conformance"
severity = "advisory"
location = "sections/90-scope.tex l. 177-182, the canonical arm (the \\else arm of the \\ifdefined\\TriptychSynthesisEdition guard opened at l. 173) of the closing sentence of `Dates, and the psalm numbering', rendered on canonical p. 37: `The psalm commentators quoted above give each psalm a speaker and an occasion --- Theodoret's Assyrian assault on Jerusalem at Ps.~85 and Babylonian captives at Ps.~101, Bellarmine's David with the bear and the lion at Ps.~70, Cassiodorus's Christ in the assumed humanity at Ps.~85 --- and each stands above as what that source says, never as the date or setting of the passage.' Read against sections/30-commentary.tex l. 559-645, element 5, the Alleluia's four witnessnotes on Ps.~97, which open at l. 565 (Augustine), l. 584 (Cassiodorus), l. 598 (Theodoret) and l. 610 (Bellarmine)."
problem = "Restated at the id evaluations/blocking-findings-v1.toml already carries for it under [[advisories]], and at the severity that record fixes: this lane filed it advisory at iteration 0, severity is decided once and is not a queue position, and the id is reused because the record names this defect. It is restated rather than dropped because the record is rewritten whole after each evaluation, so an advisory left out of this report is erased rather than closed. It is not repaired. sections/90-scope.tex is not in this iteration's REVIEW_SCOPE, which is research/scope.md alone, so it is unchanged since this stage last read the document; I re-opened l. 168-186 this round and the sentence stands word for word as the record quotes it, with the guard still opened at l. 173 and the canonical arm still at l. 177-182, and I re-opened sections/30-commentary.tex l. 559-650 and found the four Ps.~97 witnessnotes still at the lines the record names. The defect stands as recorded: the canonical arm asserts of all five appointed psalms what the detailed commentary supplies for four. Ps.~85 has Theodoret's Assyrian assault and Cassiodorus's Christ in the form of a servant; Ps.~101 Cassiodorus's nameless afflicted poor man and Theodoret's people in the Babylonian captivity; Ps.~39 Augustine's `Christus in passione loquitur' and Theodoret's Church buffeted by the waves of the impious; Ps.~70 Augustine's `vox est enim Ecclesiae' and Bellarmine's David with the bear and the lion. At Ps.~97, the Alleluia's psalm, no commentator quoted above gives the psalm an occasion at all -- Bellarmine's note there supplies a referent for the `mirabilia' and not a setting -- and the page-2 dossier's own Alleluia cell keeps referent and occasion apart by printing `Prophetic referent --- disputed' rather than a setting. It stays advisory on the evidence it was weighed on: nothing in the guide rests on the universal, the bound the sentence exists to state is true wherever such a thing stands above, no reader is misled about a claim he might act on, and the companion arm three lines above already carries the conditional form that is exactly right."
required_result = "The canonical arm of sections/90-scope.tex l. 177-182 no longer asserts of all five appointed psalms what the detailed commentary supplies for four. The cheapest repair is the wording the companion arm already uses at l. 173-176 --- `Where a psalm commentator quoted above gives a psalm a speaker and an occasion' --- keeping the four exemplars and the closing clause exactly as they stand. Naming the exception in place satisfies it equally, as would adding a speaker or occasion at Ps.~97 if a checked witness supplies one. The exemplar list needs no change, the companion arm needs none, and the repair must not move the canonical rendering off forty-five pages."

[[advisories]]
stage = "content-evaluation"
id = "CON-PRO-008"
lane = "profile-conformance"
severity = "advisory"
location = "research/scope.md section 9.1 (`--- P1. Two systems of measurement in one formulary'), the `Search boundary' field at l. 3598-3601 and specifically l. 3599: `each return exactly one line in the 326,844-line prose index, and it is this leaf's own `verified.md`'. Read against the same brief's section 3.4 l. 1788-1794, section 2.5 l. 1047 and section 5.9 l. 2492, which each fix the iteration-1 prose corpus at 2,902 files and an index of 332,704 lines."
problem = "The Interpretive-proposal audit's search boundary --- the field guidance/liturgy/roman-1962-propers.md l. 376 requires the record to name, and the bound every `NOT LOCATED IN THE CHECKED CORPUS' classification in section 9 rests on --- states the prose corpus at a size the brief's own measurement supersedes. Section 3.4 records the iteration-1 re-measurement as 2,902 files through `an accent-stripped case-folded index of 332,704 lines' and then says in terms, under `Three figures this brief carried at iteration 1 are corrected here', that the prose-corpus figures move each time the leaf under work is authored and that `no figure from any of the three sets may be quoted as though it were another's'. 326,844 is such a figure and section 9.1 is the one place in the file that still quotes it: the other three statements of the corpus size (section 2.5 l. 1047, section 3.4 l. 1791, section 5.9 l. 2492) all read 332,704, and sections 9.2 through 9.6 cite `the prose index' without a line count. This is a fresh id, not a restatement: the tracked record names this defect in none of its four collections, so there is none to reuse, and it is numbered above CON-PRO-007, the highest CON-PRO id either that record or the brief's own section 13.2 evidences. It is advisory on the evidence it is weighed on and not softened to get there: the figure reaches no reader, the leaf's terminal appendix states the precedent corpus without any line count, the searches this field bounds returned `exactly one line' under either index, and no classification, controlling limit or retained proposal in section 9 turns on the difference of 5,860 lines."
required_result = "research/scope.md l. 3599 states the prose-index size the brief's own section 3.4 fixes --- 332,704 lines, over 2,902 files --- or drops the figure and cites section 3.4 for the corpus, as sections 9.2 through 9.6 already do. Nothing else in section 9 changes: the anchors, the mechanism, the located-precedent result, the classification and the controlling limit are unaffected, and no other statement of the corpus size in the file needs touching. research/scope.md has one writer in this pipeline, `brief-revision', so the change can be made in no other stage."

[[advisories]]
stage = "content-evaluation"
id = "CON-PRO-009"
lane = "profile-conformance"
severity = "advisory"
location = "research/scope.md l. 5-9, the provenance paragraph under the title: `Written by `research-synthesis` of run `e4aebcbd941b6b1a` (workflow `proper v25`, commit `b66eb4b44d8e76801a86275b19c3a2e45713b4ab`, 2026-09-05). This file is rewritten at each iteration of this stage, which is its sole writer; the research lanes were forbidden to touch it and no later stage may add to it or amend it.' Read against the same file's section 12 l. 4402-4404 (`**Sec. 12 was re-transcribed from the regenerated record by this run's `brief-revision` stage**, run `53bdb2eaab3ba398`, on findings `CON-EVI-002` and `CON-PRO-001`') and section 13 l. 4691-4694 (`returns exactly one path, `build/tpt-runs/e4aebcbd941b6b1a/state.json`, **which is this run**, and `build/tpt-runs/` contains exactly one directory')."
problem = "The audit record's statement of its own custody is contradicted by the record. The head of the file says that research-synthesis is its sole writer and that no later stage may add to it or amend it; section 12 records that a later stage did amend it, naming `brief-revision` of run 53bdb2eaab3ba398 and the two findings it repaired; and this iteration's REVIEW_SCOPE is research/scope.md precisely because a further brief-revision amended sections 0.2, 0.3, 0.5 and 1.1 between the last evaluation and this one. Two different runs are each called `this run' inside one file --- e4aebcbd941b6b1a at l. 6 and again at l. 4693, 53bdb2eaab3ba398 at l. 4403 --- and neither is the run now under work, so l. 4693's `build/tpt-runs/ contains exactly one directory' is false of the machine this file is being read on. Profile gate l. 399 requires this record to be coherent, and the provenance block is the one place in an audit record where an error costs a later reader the ability to tell what was written when and by whom. This is a fresh id for the same reason CON-PRO-008 is: the tracked record names the defect nowhere. Two things are deliberately not part of it. Section 13.2's figures for the leaf's tracked evaluation record are not a defect --- that section dates its own reading (`as of the iteration-1 evaluation') and the file it reports is rewritten after every evaluation, so no statement of its contents can be current when an evaluator reads it. Nor are the `build/tpt-runs/.../artifacts/` receipts at l. 618 and l. 1647 machine-local data under l. 399: they are repository-relative, they record where bytes were receipted at the time of the sweep, and every witness they stand behind carries its own title, URL and digest. It is advisory because no reader-facing claim, published text or citation rests on the paragraph, the research content it heads is unaffected, and the correction is a paragraph that only the brief's writer may make."
required_result = "research/scope.md l. 5-9 names every stage that has written the file --- `research-synthesis` of run e4aebcbd941b6b1a and the `brief-revision` stages of runs 53bdb2eaab3ba398 and b16414357535992e --- and drops or qualifies `no later stage may add to it or amend it', which is false of `proper-finish`, where `brief-revision` is a writer of the brief. Wherever the file says `this run' it names the run it means, at l. 4403 and at l. 4693, and l. 4694's count of the run directories is either dated or struck. No research content changes, no section is rewritten, and no figure elsewhere in the file moves."

