problem = "Restated unrepaired from the leaf's standing-findings record at evaluations/blocking-findings-v1.toml, at the id and the severity that record fixes under [[advisories]]. It is restated rather than dropped because that record is rewritten whole per stage after each evaluation, so an advisory left out of this report is erased rather than closed. Severity is unchanged and is not a queue position: this lane recorded it advisory and may not raise as blocking an id it filed advisory, and the three rounds it has now stood unrepaired are not evidence about the defect, only about the route. Every passage was re-read against the files as they now stand and every line range the record gives is exact and unmoved. Neither sections/20-themes.tex nor sections/30-commentary.tex is in this iteration's REVIEW_SCOPE, which is research/scope.md alone; both were nevertheless re-read this round because the stage fragment directs an evaluator to the passages its own standing findings name, and no `out_of_scope_reason` arises because this is not a blocking finding. Nothing in the leaf moved this round: this iteration's whole change is in research/scope.md --- the stale headings at section 0.2 (`four lanes' to `five lanes') and section 0.5 (`three species' to `six species'), the merit-and-glory vocabulary enumeration rewritten at section 0.3 l. 198-214, and the accent restored at section 1.1 l. 557 --- and `content-revision` then verified the canonical edition against the corrected brief and changed nothing, the edition making no such inventory. None of that reaches either of this lane's criteria or any of the passages below. The defect: one sentence is printed twice at the same strength in the two reader-facing sections. The brief synthesis reads `Mitis as a whole word stands in exactly two verses of the Clementine Vulgate, Ps. 85:5 and Matt. 11:29, where Christ pairs it with humilis corde and iugum meum suave est follows at once in v. 30: across those two verses the antiphon's suavis and mitis are joined'; the commentary reads `Mitis as a whole word stands in exactly two verses of the Clementine, Ps. 85:5 and Matt. 11:29, where Christ pairs it with humilis corde; iugum meum suave est follows immediately at 11:30, so it is across those two verses that the antiphon's suavis and mitis are joined'. The longest-common-run measurement taken over the two files at iteration 1 put the shared material at three verbatim runs inside that one sentence-pair --- thirteen words, then fourteen, then the eleven-word emphasised clause `across those two verses the antiphon's suavis and mitis are joined' --- some thirty-eight words in all, the largest near-verbatim block between `The Propers: Themes and Movement' and `The Propers: Detailed Commentary' in this edition and larger than the twenty-one-word run CON-SYN-002 names; an independent re-measure this round, neither file having moved, reproduces the same three shared regions in that one sentence-pair --- the thirteen-word opening, the locus run through `humilis corde' and the emphasised `across those two verses ... the antiphon's suavis and mitis are joined' clause --- at some forty words in all, the arithmetic differing from the record's thirty-eight only in whether `Ps. 85:5' and `Matt. 11:29' are counted as one token or two. What is duplicated is the datum and its compressed restatement rather than the conclusion --- the brief synthesis closes on the Gospel tie, `the humility the Gospel ends on is in the Mass's first sung line', which stands nowhere else in the edition, and the commentary closes on the bound `and neither verse carries both alone' --- but a thirty-eight-word sentence reproduced almost whole is a recap in the profile's own closing clause whatever conclusion is hung on its end. It is advisory and not blocking on exactly the evidence of CON-SYN-003 and consistently with it: both statements are true and agree, so no reader who never learns of it is misled; the commentary's bound and the brief synthesis's Gospel tie are each unique to their own passage so no claim is lost either way; and the passage sits inside the profile's exactly-two-page Themes constraint, so the repair touches settled prose and bears on pagination."
required_result = "The canonical relation has one fullest home, which is the commentary at sections/30-commentary.tex l. 239-244, since it alone carries the bound `and neither verse carries both alone' and stands among the four canonical relations that frame it. The brief synthesis at sections/20-themes.tex l. 148-154 keeps its own cross-proper point --- that a departure running the other way ties the Introit's first sung line to the humility the Gospel ends on --- without reproducing the commentary's sentence: naming Matt. 11:29 and the joined `suavis'/`mitis' in its own compressed wording satisfies it, as would dropping the eleven-word emphasised clause `across those two verses the antiphon's suavis and mitis are joined' and letting the Gospel tie carry the sentence. The commentary's passage needs no change, and `The Propers: Themes and Movement' must still fill two complete pages at the settled typesetting size, which is the reason this is not raised blocking."

