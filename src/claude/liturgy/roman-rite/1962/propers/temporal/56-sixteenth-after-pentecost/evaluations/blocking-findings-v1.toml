note = "Restated with line numbers re-checked against the file as it now stands; unchanged this round. SYN-CON-002's branch put this text in the \\else arm, where it reaches only the canonical reader, and the sighting survives the branch. I searched both rendered builds: the name Sennacherib occurs exactly once in the canonical PDF, inside this appendix sentence itself on p. 36, and nowhere in the companion. What the canonical sweep carries at Ps. 85 is Theodoret's Latin, 'Praecinit autem et Assyriorum in Hierosolymam impetum, et Ezechiae spem' --- the Assyrian assault on Jerusalem and Hezekiah's hope --- which is that episode without the king's name, so the canonical appendix supplies from research/scope.md a name the guide itself never prints. A reader of the larger book meets this exactly as the companion's reader would have, so it is the canonical edition's and not the derivation's, and my lane may not block on one."

