note = "Restated because evaluations/blocking-findings-v1.toml is rewritten whole after each evaluation, so dropping it erases a live sighting; this lane recorded the same block at iterations 0, 1 and 2 of this production and at iterations of the two before it. format.tex is not in this iteration's REVIEW_SCOPE, which is research/scope.md alone, so it is unchanged since this stage last read the document, and I re-opened l. 86-92 and l. 152-156 this round and found the measurement note and the row macros at the lines recorded. The leaf varies four of the measurements guidance/liturgy/roman-1962-propers.md l. 293 fixes for the page-2 dossier table --- the four summary-tier column widths, the spanning row's width, the spanning row's size, and the summary tier's own size from \\footnotesize to \\scriptsize --- and records them as three numbered deviations in the file's own comment. The verdict is unchanged: l. 293 permits a measurement change `only when the complete inventory cannot remain legible after the hierarchy and evidence have been preserved', l. 295 directs `redesign its dossiers or table rather than spill, omit evidence, or move unrelated apparatus onto page 2', and the hierarchy the profile fixes is intact. I record it rather than raise it because no criterion of this stage reaches typesetting conformance: criterion 9 reaches reader order and page assignment, both of which are met, and whether \\scriptsize over a 6.4pt explanatory tier stays legible on the rendered page is measured by visual-evaluation and not here. This is the boundary between this stage and that one rather than a fourth unowned class, and I state it so the judgement stands on the run's record and not only in a source comment."

