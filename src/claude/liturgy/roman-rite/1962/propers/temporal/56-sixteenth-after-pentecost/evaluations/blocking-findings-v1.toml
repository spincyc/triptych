note = "Restated unchanged from the leaf's standing-findings record, because evaluations/blocking-findings-v1.toml is rewritten whole after each evaluation and dropping it would erase a live sighting. format.tex is unchanged this round and I re-read the sentence rather than re-deriving it. Read as a claim about content -- that the companion asserts no claim, witness, locus, date, attribution or count the canonical edition lacks -- its truth is criterion 1 and the derivation-fidelity lane's, and I do not answer for it. Read as a claim about the artifact it is still not right: the companion does not only omit, it substitutes, printing a dedicated integrated commentary (sections/synthesis/20-integrated-commentary.tex, 366 lines, companion pp. 5-9) whose prose stands nowhere in the canonical edition, as the profile at guidance/liturgy/roman-1962-propers.md l. 176-193 requires it to. I record it rather than raise it because neither repair owner this run admits can clear it: the clause already sits inside the canonical arm of an \\ifdefined branch, so the seam licence does not reach a sentence the companion's reader never meets, and nothing under sections/synthesis/ is the file that would have to change. What is still missing is a repair route for the half of it that no branch fixes."

