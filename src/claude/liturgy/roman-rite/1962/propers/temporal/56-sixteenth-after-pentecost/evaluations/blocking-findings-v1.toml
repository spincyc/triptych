location = "sections/synthesis/20-integrated-commentary.tex lines 126-135, 180-191, 217-219 and 269-291, against sections/20-themes.tex lines 117-129, 142-146, 136-137 and 41-48"
note = "Several of the companion's conclusions are stated at full strength twice in one sitting, because sections/20-themes.tex renders in the companion immediately before the integrated commentary: the Sermo 165 tie to the Collect with auxilium and the close at 7.9, the list of the three places where Augustine's lemma differs and carries his argument with the same three lemmata, the Offertory's verbatim identity with Ps. 70:12, and the four-way division of solius with the grace-alone verdict. Criterion 3 as my fragment defines it is measured in verbatim runs, and by that measure this is only 4.0% of the companion's words (3.6% authorial, longest run 15 words), well inside tolerance, so I did not raise it; the duplication is conceptual rather than verbatim, and the same two-tier relation holds between 20-themes and 30-commentary in the canonical edition that passed. I note it because the criterion's measure does not reach non-verbatim restatement of a section the companion itself prints, which may be a gap in the lane fragment rather than a fact about this document."

[[observations]]
stage = "synthesis-evaluation"
lane = "companion-conformance"
location = "format.tex l. 200-209, the canonical arm of \\editionnote, printed at sections/90-scope.tex l. 10 and reaching only the canonical build: 'A mechanical \\textit{synthesis companion} is compiled from the same source at the same identity with a \\texttt{-synthesis} suffix; it omits the appointed texts and the element-by-element sweep and adds nothing this edition does not contain.'"
note = "My fragment names this sentence as mine, so I checked it and am reporting what I found rather than leaving it. Read as a claim about content -- that the companion asserts no claim, witness, locus, date, attribution or count the canonical edition lacks -- its truth is criterion 1 and belongs to the derivation-fidelity lane, and I do not answer for it. Read as a claim about the artifact it is not right: the companion does not only omit, it substitutes, printing a dedicated integrated commentary (sections/synthesis/20-integrated-commentary.tex, 361 lines, companion pp. 5-9) whose prose stands nowhere in the canonical edition, as the profile at guidance/liturgy/roman-1962-propers.md l. 176-193 requires it to. I record this instead of raising it because neither repair owner this run admits can clear it: the clause is already inside the canonical arm of an \\ifdefined branch, so the seam licence -- wrap one clause so the companion's reader gets a true sentence while the canonical rendering stays byte-identical -- does not reach a sentence the companion's reader never meets, and nothing under sections/synthesis/ is the file that would have to change. The content evaluation recorded the same sentence as a class wanting an owner at iteration 1 of this production (evaluations/blocking-findings-v1.toml, [[observations]] lane evidence-discipline); it now has one in my fragment, and what is still missing is a repair route for the half of it that no branch fixes."

[[observations]]
