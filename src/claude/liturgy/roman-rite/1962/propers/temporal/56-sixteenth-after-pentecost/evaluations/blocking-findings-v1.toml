note = "Unchanged this iteration and restated because evaluations/blocking-findings-v1.toml is rewritten whole after each evaluation, so dropping it erases a live sighting; this lane recorded the same sentence at iteration 0 of this production and at four consecutive iterations of the previous one. The canonical edition asserts a property of a companion that does not exist at this stage -- that it adds nothing this edition does not contain -- and the sequenced pipeline positions no evaluation to check it: this stage reads only the canonical edition and may not reach the companion, and the later synthesis evaluation judges the companion rather than this sentence in the canonical one. My criteria reach evidence states, verification of the appointed Latin against propers/verified.md, and the truth of what the guide says about the appointed texts; none of them reaches a claim about a derived sibling artifact of the publication apparatus, and criterion 14 reaches statements about the built canonical edition's own contents rather than about another document. Saying it plainly as the stage fragment asks: I believe this is a class wanting an owner in some lane's fragment -- a claim the canonical edition makes about the companion derived from it -- and the repair is to the stage fragments rather than to any lane's diligence. It is repairable in the leaf, format.tex being the leaf's, so it is not an escalation; it is outside this lane's criteria and not outside this run's reach."

