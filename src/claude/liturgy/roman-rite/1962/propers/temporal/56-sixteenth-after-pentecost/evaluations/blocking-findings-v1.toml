note = "Restated with the line numbers re-checked, both ranges having moved down one line under this round's insertion; the note itself is unchanged and the insertion did not touch it. Recorded rather than raised, and distinct from SYN-CON-013 although it sits in the same entry, which is now otherwise repaired. The canonical arm identifies its two text-layer items by content --- the Epistle's grace sentence and the Church's-borrowing observation, neither of them the quotation the companion carries --- so a canonical reader can eliminate to p. 359 and knows the four-measures passage is page-image verified. The companion arm identifies them only by page, and its reader, told he has read 'one place within pp.~358--360' of which 358 and 360 rest on an uncorrected text layer, cannot tell whether the passage he has read is verified. Nothing here is false and nothing overstates the evidence: the direction of the loss is conservative, the reader left able to distrust a quotation that is in fact verified. I do not raise it because no criterion of mine reaches it --- it is not a count about the companion's own text and not a statement either edition makes about the other --- and no criterion of the derivation-fidelity lane's reached it either when that lane recorded the same sighting. The legibility of an evidence state after an abridgement has renumbered what its reader can eliminate is owned by no lane fragment, and I think that is a missing criterion rather than a fact about this document. The repair, if the run wants it, is one clause in the companion arm naming the two text-layer passages as passages this edition does not quote, with the canonical arm untouched."

