note = "Restated from the leaf's standing-findings record with line numbers re-checked against the file as it now stands, which is unchanged this round; I reach the same verdict a third time. In the companion the reader has met no element-by-element reading; the profile replaces it with the integrated commentary at pp. 5-9. I judge it not a finding because the label names a way of reading the propers rather than a section of this guide, and a companion reader can take it as such without being sent anywhere -- and because for the companion it arguably reads better, the proposals' justification being exactly what an element-by-element procession would miss. I record it so the sighting reaches the run rather than dying here, since a reader who takes the label as pointing at a section of the book in hand finds none."

