location = "sections/90-scope.tex l. 93-101, 'Translations of the reception witnesses': 'Augustine's \\work{Enarrationes}, \\work{Epistula}~55, the \\work{Tractatus} on John, the \\work{Enchiridion} and \\work{De gratia et libero arbitrio} [and Chrysostom's Homily~7 on Ephesians] are quoted in English from the \\work{Nicene and Post-Nicene Fathers}; that English is named at each use'. Rendered on companion p. 21."
note = "New this round, and recorded rather than raised because the defect is the canonical edition's and the companion inherits it. Of the works the sentence names, this edition quotes NPNF English at two: the Enarrationes, at sections/synthesis/20-integrated-commentary.tex l. 256-259, 'as the \\work{Nicene and Post-Nicene Fathers} render that exposition, ``had no form nor comeliness''', and Chrysostom's Homily 7, at l. 100-106, where Gross Alexander's NPNF English is named. The Enchiridion and De gratia et libero arbitrio are quoted in Latin only, at l. 333-340 ('operatur' and 'cooperatur'), and Epistula 55.14.25 and In Iohannis euangelium tractatus 118.5 are cited without quotation at l. 107-111. The canonical build does the same: its Enchiridion witnessnote at sections/30-commentary.tex l. 299-306 is Latin throughout, so the sentence over-reaches for the larger book exactly as it does for the companion, and no branch is the right instrument. The sentence was already branched once this production, to take Gregory's \\work{Regula pastoralis} out of the companion arm, so a reviser has been over it; I note the residue rather than send anyone back to it. If the run wants it, the fix belongs to both arms together."
