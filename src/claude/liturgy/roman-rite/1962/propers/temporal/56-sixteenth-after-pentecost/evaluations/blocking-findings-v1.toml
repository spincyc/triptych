problem = "False of the companion, and contradicted four lines above it on the same printed page. The companion omits the entire complete appointed formulary (main.tex l. 25-30 fences sections/05-appointed-text.tex out of the synthesis build), so everything between nos. 1591 and 1602 except the three Latin excerpts the gallery prints at its own entries is omitted here. The companion's own arm of \\editionnote, printed at sections/90-scope.tex l. 10 and standing on p. 20 immediately before this subsection heading, says the opposite in terms: 'It deliberately omits two things the canonical full edition prints: the complete appointed Latin with its English, and the element-by-element reception sweep.' The sentence is true of the canonical build, where sections/05-appointed-text.tex prints the formulary whole from p. 5 and says so ('Everything the 1962 Missale Romanum prints for this Mass, in the order it prints it'), and nothing under sections/synthesis/ can make it true of the companion, because the profile (guidance/liturgy/roman-1962-propers.md l. 176-184) is what forbids the companion the appointed text."
required_result = "The clause 'nothing between those boundaries is omitted here' is branched on \\ifdefined\\TriptychSynthesisEdition inside sections/90-scope.tex, the canonical arm keeping the present wording so the canonical rendering stays byte-identical, and the companion arm saying instead that the complete text between those boundaries is printed in the canonical full edition and not in this one, the ten elements reaching this edition through the map and the page-2 dossier sheet. The number of the wrong half is the sentence, not the boundaries: nos. 1591 and 1602 are correct and stay."
