note = "The canonical commentary says each of Cassiodorus's four agreements with the chant \"rests on one word of one printing,\" but three of the four are clauses and not words (suavis ac mitis es ... copiosus in misericordia; Domine, in auxilium meum respice; quia mirabilia fecit Dominus), and the canonical scope appendix calls them \"the four lemmata on which his agreement with the chant turns\"; the companion prints \"one lemma of a single printing,\" which is what the scope appendix supports, so the derivation corrected a canonical inaccuracy it is not permitted to revise and the two editions now state the same bound in different words. The defect is the canonical edition's and the companion did not inherit it, so I raised no finding; a person may want to decide whether the canonical sentence should follow."

[[observations]]
