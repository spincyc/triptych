[[findings]]
stage = "synthesis-evaluation"
id = "SYN-FID-001"
lane = "derivation-fidelity"
severity = "blocking"
location = "sections/synthesis/20-integrated-commentary.tex, subsection 1, lines 19-21 (\"Augustine, at Quaestiones euangeliorum II q. 29, sets the dropsical man beside the beast in the well, both of them weighed down by a humour\")"
problem = "The companion attributes the humour to both terms of Augustine's comparison. The canonical edition attributes it to the dropsical man alone and makes it the ground of the comparison, not a shared property: sections/30-commentary.tex lines 694-696 read \"The dropsical man is compared to the animal fallen into the well, because he laboured under a humour, and then to the covetous rich man,\" and sections/99-references.tex lines 236-239 - a file the companion itself prints - describes the same comparison with no humour on the animal's side. Nothing anywhere in the canonical edition says the animal in the well laboured under a humour. The canonical bound on this witness makes the slip sharper: the same References entry records that the retrieved Quaestiones transcription carries optical damage in this paragraph, so its sense is reported and its wording is not quoted, and the sense the companion reports is not the sense the canonical reports."
required_result = "The clause states the ground of Augustine's comparison as the canonical edition states it - the humour is the dropsical man's - or drops the attribution entirely; no reading of the sentence leaves the animal in the well weighed down by a humour."
repair_target = "derivation"

[[findings]]
stage = "synthesis-evaluation"
id = "SYN-FID-002"
lane = "derivation-fidelity"
severity = "blocking"
location = "sections/synthesis/20-integrated-commentary.tex, subsection 4, lines 293-300 (the bolded \"Twice a single commentator makes two elements of this Mass name one thing\" and its second instance)"
problem = "The generalisation is true of the first instance and false of the second. Cassiodorus does make the Gradual's second half and the Communion's first clause name one event by carrying his own sheep-and-goats formula between them. The second instance is Aquinas citing 2 Kings (2 Samuel) 7:27 at the Offertory's cor meum dereliquit me and Augustine reaching for the same verse at the Introit - two commentators meeting at one verse, and a relation the guide observes rather than one a commentator makes. The canonical edition says only \"the same verse Augustine reaches for at this Mass's Introit, for the same fugitive heart\" (sections/30-commentary.tex lines 828-831) and nowhere attributes to Aquinas any join between two elements of this Mass; no file both editions input supports it either. As printed, the companion credits Aquinas with an act he did not perform, in a bolded thesis sentence."
required_result = "The generalisation matches the evidence set under it - either restricted to the Cassiodorus case, or restated so that the Offertory-Introit relation is described as two commentators reaching one verse - so that no sentence of the companion attributes to Aquinas a join between two elements of this Mass."
repair_target = "derivation"

[[findings]]
