r context, on typology or on the commentators above, and on no apostolic citation of the words sung' at sections/20-themes.tex l. 157-160, against `Every christological reading of these five chants therefore rests on the psalms' wider context, on typology, or on the commentators above, and on no apostolic citation of the words actually sung' at sections/30-commentary.tex l. 1102-1105. An independent re-measure of the two files this round returns that run unchanged and still the longest between the two sections. The commentary is the fullest home: it names Heb. 1:10-12 and Heb. 10:5-7 and enumerates the six appointed psalm excerpts, where the brief synthesis compresses all of that to `Hebrews reaching Ps. 101 and Ps. 39 only at verses the chants do not sing'. What is duplicated is therefore not the evidence, which is properly layered, but the guide's own concluding sentence, which is the recap the profile's closing clause asks to have removed. The reviser's recorded reason for leaving it is that the brief synthesis sits inside the profile's exactly-two-page Themes constraint."
