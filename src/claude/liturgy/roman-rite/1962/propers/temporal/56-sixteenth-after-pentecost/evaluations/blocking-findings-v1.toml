note = "Fourth consecutive iteration of this production, the three passages unchanged in all four, and recorded again only because evaluations/blocking-findings-v1.toml is rewritten whole after each evaluation and dropping it would erase a live sighting from the tracked record. Within one canonical edition a reader meets a categorical denial of a chant-repertory sweep in two proposals and, a few pages earlier, a reported sweep of six named graduals at AMS 188; only the terminal appendix reconciles them, by saying the antiphonary results are a modern database's report of Hesbert's numbering and not the books themselves. The brief agrees with the leaf here -- research/scope.md sec. 5.7 states the same categorical bound and sec. 9.3 repeats it inside P3's own audited limit -- so nothing is misreported; what is wrong is that two reader-facing sections state the same evidence-state bound at different strengths. Both proposals' limit fields do the work criterion 5 asks of them, so this is not a criterion 5 finding, and my criteria do not reach whether one reader-facing section contradicts another on its face. Saying it plainly as the fragment asks: I think this is a genuine fourth class wanting an owner in some lane's fragment -- a reader-facing section stating an evidence-state bound more categorically than another reader-facing section's own reported evidence, reconciled only in 'Appendix: Scope and Qualifications' -- and not a fact about this leaf, since nothing in criteria 1-12 as partitioned asks whether two sections' statements of the same bound agree. The repair belongs to the stage fragments and not to this lane's diligence."

