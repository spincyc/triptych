note = "Restated unchanged from the leaf's standing-findings record, because evaluations/blocking-findings-v1.toml is rewritten whole after each evaluation and dropping it would erase a live sighting. Criterion 4 and this lane's fragment say `the synthesis' in the singular, and the canonical edition of a 1962 propers leaf carries two of them: the profile calls 20-themes.tex `the two-page brief synthesis' and 35-source-grounded-synthesis.tex `the complete source-grounded synthesis' at guidance/liturgy/roman-1962-propers.md l. 181-182, and both are built here when \\TriptychSynthesisEdition is undefined. The criterion's own exemplar --- a claim met at full strength in the commentary and again at full strength in the synthesis --- reads naturally for the companion's one-synthesis shape, and the lane has to decide for itself which of the two sections it names. I read the redistilled-argument and multiple-elements-and-witnesses questions against 35-source-grounded-synthesis.tex, and the `one fullest home in the edition' clause against the whole canonical edition, which is why both findings above reach 20-themes.tex; a lane reading it the other way would have left the brief synthesis unexamined by any criterion of this stage, since criteria 9, 11 and 12 reach its order and its register but not its economy. It bore on this iteration concretely: a verbatim scan of the canonical sections found three further near-verbatim runs of thirteen to fifteen words between the brief synthesis and the detailed commentary besides the one CON-SYN-002 names --- sections/20-themes.tex l. 66-67 against sections/30-commentary.tex l. 717-718 (Bede's argument that the conclusion must be read typice), l. 125-126 against l. 573-574 (Augustine moving from the new song to the new man to an inward healing), and l. 149 against l. 239-240 (mitis standing in exactly two verses of the Clementine) --- and I judged each of the three to be the profile's state-then-prove layering rather than a defect, since in every case the brief synthesis draws a different conclusion from the shared datum than the commentary does, where CON-SYN-002's sentence is a conclusion reproduced as a conclusion. That judgement had to be made without the fragment saying which section the criterion is asked of. Saying it plainly as the fragment asks: I think this is a gap in the lane fragment rather than a fact about this leaf, of the same shape as the appointed-text ambiguity criterion 12 had to be widened to settle, and the repair is for the fragment to name which section each half of criterion 4 is asked of in a canonical propers edition."

