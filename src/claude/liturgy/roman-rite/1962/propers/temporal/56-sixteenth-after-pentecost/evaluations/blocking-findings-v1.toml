note = "Restated because the tracked standing record is rewritten whole after each evaluation and would otherwise lose it: this lane raised the same class at iteration 0 of this run and at five consecutive iterations of the prior production, and the two revisions since have enlarged it rather than reduced it -- CON-EVI-024's repair at iteration 2 put the Sarum optical-layer bound into the body of C1 as well as into the appendix and References, which is the third bound to travel that way. The profile tells the terminal appendix to give one terse account of edition identity, verification state and source scope and then says `Do not duplicate this apparatus earlier or inside References' (guidance/liturgy/roman-1962-propers.md l. 359), and l. 279 confines work-wide bounds and qualifications to the terminal apparatus; the publication gate at l. 382 repeats it. Every one of these body passages is now written as a fact about a book or a corpus, so criterion 12 does not reach it -- the register is right and only the placement is in question -- and criterion 9 reaches reader order and page assignment, not where a work-wide bound sits inside a section. I think this is a missing criterion rather than a fact about this leaf, which is what the stage fragment asks a lane to say plainly: no lane in this stage owns `a work-wide bound duplicated between the terminal apparatus and the body', and each round of repair enlarges it because a blocking finding about a claim's evidence state is discharged by writing the bound beside the claim as well as into the appendix. Either criterion 9 should widen from reader order and page assignment to the placement of work-wide bounds, or criterion 10 from the existence and format of the three source records to the profile's own non-duplication rule. Note that the profile also permits a limit that materially changes a claim to stand beside that claim, so the widened criterion would have to say which of these five is claim-local and which is work-wide; that judgement is exactly what no lane is currently asked to make."

