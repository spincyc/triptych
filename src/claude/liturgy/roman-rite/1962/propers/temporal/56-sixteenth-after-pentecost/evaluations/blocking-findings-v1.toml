note = "Restated from the previous evaluation with line numbers refreshed; the sentence did not move this round and I re-read it rather than re-deriving it. SYN-CON-003's branch is otherwise correct: the two partings the synthesis arm names both stand above in the companion, the Gradual lemma at l. 180-181 and the Communion's genitive at l. 292-295, and the eight PG column stretches are stated as evidence on the Theodoret material this edition uses rather than as quoted above, which holds because the companion uses Theodoret at all five psalms. But the companion names his Greek at a third place where Migne's Greek and Migne's facing Latin part, at l. 181-182: 'at Ps.~39:14 he has the Septuagint, which Migne's facing Latin puts back into the Clementine's words.' The canonical arm's list omits that parting too, though the canonical body carries it at sections/30-commentary.tex l. 94-96, so both arms enumerate one parting fewer than their own edition names. A reader of the larger book meets this exactly as the companion's reader does; the governing claim, that his Greek is named where the two part and quoted nowhere, is true in both editions, and only the em-dash roll-call under it is short. If the run wants it, the fix belongs to both arms together and not to the synthesis branch alone."

[[observations]]
stage = "synthesis-evaluation"
