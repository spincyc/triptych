note = "Second consecutive iteration for the same three passages, unchanged in all three, and recorded again only because the standing-findings file is rewritten whole. The counts are sound everywhere -- four Cassiodorus lemmata are named and four are listed at 90-scope, and two items are named and two listed at 35-source-grounded-synthesis -- so my criterion, which reaches the number, is met and none of these is a finding of mine. The inaccuracy is in the noun: of the four items at 90-scope only maiestate is a single word, the others being clauses of four, seven and four words, and in auxilium meum respice is likewise a four-word clause called one of \"the two Latin words\". CON-CIT-010 was the same habit crossing into a count and it was repaired at iteration 2 (sections/30-commentary.tex line 251 now reads \"that four-word petition\"), so the count side of the habit is cleared and only the descriptive side stands. I do not think this is a missing criterion in any lane's fragment: it is one leaf's word choice rather than a recurring class, and it wants a reviser's eye rather than an owner."

