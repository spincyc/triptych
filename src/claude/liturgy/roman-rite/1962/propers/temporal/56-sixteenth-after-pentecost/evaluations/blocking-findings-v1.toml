location = "sections/90-scope.tex l. 152-157, the words 'Theodoret's Sennacherib at Ps.~85', read against sections/30-commentary.tex l. 185-187 in the canonical build."
note = "A canonical defect the companion inherits, recorded because my lane may not block on one. The name Sennacherib is printed nowhere in either edition's body. What the canonical sweep carries is Theodoret's Latin, 'Praecinit autem et Assyriorum in Hierosolymam impetum, et Ezechiae spem' -- the Assyrian assault on Jerusalem and Hezekiah's hope -- which is that episode without the king's name, so the appendix supplies from research/scope.md l. 4223 and l. 4393 a name the guide itself never prints. A reader of the larger book meets this exactly as the companion's reader would, so it is the canonical edition's and not the derivation's; it is folded into SYN-CON-002 only as evidence of where the reading stands, and the naming question is separate from that finding and survives whatever the branch does."

