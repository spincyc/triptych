severity = "advisory"
location = "sections/20-themes.tex l. 18–19, unit 1 of the brief synthesis: 'The Secret puts \\latin{mereámur} inside a purpose clause under \\latin{pérfice miserátus in nobis}, so what is merited is the completing.' Against the Secret as printed at sections/05-appointed-text.tex l. 241–242 and propers/verified.md l. 335–336, and against the same point made at sections/05-appointed-text.tex l. 250–252 and sections/30-commentary.tex l. 917–921."
problem = "Restated unrepaired from the leaf's standing-findings record at evaluations/blocking-findings-v1.toml, with the same id and the same severity, the record being rewritten per stage each evaluation. Both line ranges were re-read against the files as they now stand this iteration and the sentence is unchanged; neither file has been written since this stage last read it, the round's only change being the brief repair at research/scope.md. Severity is unchanged because this lane recorded it advisory and may not raise as blocking an id it filed advisory. The Secret reads `Munda nos, quǽsumus, Dómine, sacrifícii præséntis efféctu: et pérfice miserátus in nobis; ut eius mereámur esse partícipes.` What the purpose clause says is merited is `esse partícipes` — being partakers of `eius` — and not the completing that governs it. The leaf states this correctly twice: at sections/05-appointed-text.tex l. 250–252, 'what the Latin asks God to complete is one thing and the sharing that follows from it another', and at sections/30-commentary.tex l. 919–921, 'the merit named is God's completed work and not a prior claim', which reads the theology without misdescribing the syntax. The leaf also records at sections/30-commentary.tex l. 1125–1126 that it leaves open whether `eius` refers to the sacrifice or to its effect, which rules out reading `eius` as the completing. The brief is right and is not the seed: research/scope.md l. 3897–3899, moved down eight lines by this round's §0.3 repair, has `mereámur` 'standing in a purpose clause under `pérfice miserátus in nobis`, so the merit is God's completed work in us'. The compression in the brief synthesis is intelligible as 'the merit rests on the completing' and its doctrinal point survives, which is why this does not block; as written it states the object of `mereámur` wrongly. The file it names is outside this round's REVIEW_SCOPE and is re-read here because the scope rule directs a lane to the passages its own standing findings name."
required_result = "The clause at sections/20-themes.tex l. 19 says what the Latin says: that the merit follows God's completing and does not precede it, or that what is asked is that we be made worthy to share in it — not that the completing is the thing merited. The two fuller statements at sections/05-appointed-text.tex l. 250–252 and sections/30-commentary.tex l. 917–921 stand unchanged and are the model."

[[advisories]]
stage = "content-evaluation"
id = "CON-EVI-014"
lane = "evidence-discipline"
severity = "advisory"
location = "sections/30-commentary.tex l. 1112–1114, the closing clause of the Postcommunion's opening paragraph — 'and \\latin{rénova}, which asks as a petition the renewal the Epistle asks for \\latin{in interíorem hóminem}' — and the same claim at sections/20-themes.tex l. 128–129, 'the renewal the Epistle asks for within and the Postcommunion asks for in \\latin{rénova}'. Against the appointed Epistle as sections/05-appointed-text.tex prints it at l. 82–88 and propers/verified.md at l. 222–232, and against this same commentary file at l. 333–335."
problem = "Restated unrepaired from the leaf's standing-findings record at evaluations/blocking-findings-v1.toml, with the same id and the same severity, the record being rewritten per stage each evaluation. All four passages were re-read against the files as they now stand this iteration and every line range is exact and unchanged; neither file has been written since this stage last read it. Severity is unchanged because this lane recorded it advisory and may not raise as blocking an id it filed advisory. The appointed Epistle petitions no renewal. What it asks at that clause is strengthening — 'ut det vobis secúndum divítias glóriæ suæ, virtúte corroborári per Spíritum eius in interíorem hóminem' at sections/05-appointed-text.tex l. 82–84 — and the pericope's three further petitions are that Christ dwell by faith in their hearts, that they be able to comprehend, and that they be filled unto all the fullness of God. Ephesians' renewal vocabulary stands at Eph. 4:23, which this Mass does not read, and the leaf says so itself in the same file at l. 333–335, where the Postcommunion's `rénova … mentes nostras` is said to share vocabulary with Eph. 2:10 and Eph. 4:23, 'both outside the appointed pericope; those are echoes'. So the edition keeps that bound at element 2 and crosses it at element 10, about the same two elements, and a reader who has met both is told that the tie is an echo from outside the pericope and then that the Epistle itself asks for the thing. Nothing needs retrieving and the brief needs no correction: research/scope.md l. 4183–4185, moved down eight lines by this round's §0.3 repair, states the relation in the right two verbs — 'which is where the Epistle asks for strengthening (`in interíorem hóminem`) and what the Postcommunion asks for (`rénova`)' — and the leaf compressed those two verbs into one. It is advisory and not blocking on the evidence that the cross-element link the two passages exist to make is real and the brief supports it, that the repair is one noun in each of two places, and that the Epistle's own verb stands printed at sections/05-appointed-text.tex l. 83 where any reader of the canonical edition meets it. The files it names are outside this round's REVIEW_SCOPE and are re-read here because the scope rule directs a lane to the passages its own standing findings name."
required_result = "Neither passage attributes a petition for renewal to the appointed Epistle. Both say what the two texts ask, in the brief's own two verbs: the Epistle asks to be strengthened in the inward man and the Postcommunion asks in `rénova` for the renewal, so that the tie between them is stated without either text being given the other's word. Naming the tie without a verb for the Epistle at all satisfies it equally. The `cánticum novum` half of the commentary sentence at l. 1113–1114 and the Alleluia material at sections/20-themes.tex l. 125–128 are unaffected, and sections/30-commentary.tex l. 333–335 is correct as it stands and must not be brought up to match."

