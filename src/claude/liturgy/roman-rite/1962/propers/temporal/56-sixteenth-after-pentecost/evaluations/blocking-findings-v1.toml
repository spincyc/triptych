location = "sections/20-themes.tex, `The Propers: Themes and Movement' (main.tex canonical position 3), read against sections/35-source-grounded-synthesis.tex, `Source-Grounded Synthesis Across the Propers' (canonical position 6), and against research/scope.md section 10, `Cross-proper claims settled for the synthesis commentary'."
note = "Restated from this lane's own observation in the leaf's standing-findings record, because evaluations/blocking-findings-v1.toml is rewritten whole per stage each evaluation and dropping it would erase a live sighting, and the class it names is still unowned. Criterion 4 and this lane's fragment say `the synthesis' in the singular, and the canonical edition of a 1962 propers leaf carries two of them: guidance/liturgy/roman-1962-propers.md l. 181-182 calls 20-themes.tex the two-page brief synthesis and 35-source-grounded-synthesis.tex the complete source-grounded synthesis, and main.tex l. 23 and l. 31 build both when \\TriptychSynthesisEdition is undefined. The criterion's own exemplar --- a claim met at full strength in the commentary and again at full strength in the synthesis --- reads naturally for the companion's one-synthesis shape, and the lane must decide for itself which of the two sections it names. As the standing record shows this lane reading it in every earlier round, all four of its advisories reaching 20-themes.tex, I read the redistilled-argument and multiple-elements-and-witnesses questions against 35-source-grounded-synthesis.tex, whose four units C1-C4 meet them comfortably, and the `one fullest home in the edition' clause against the whole canonical edition, which is why all four of this lane's standing advisories reach 20-themes.tex; a lane reading it the other way would leave the brief synthesis unexamined by any criterion of this stage, since criteria 9, 11 and 12 reach its order and its register but not its economy. This iteration's REVIEW_SCOPE is research/scope.md alone, and the in-scope file sharpens the same gap from the other side, unchanged at section 10 by this round's repair: section 10 settles six cross-proper claims for `the synthesis commentary', again in the singular, and the canonical edition distributes them across two sections rather than one --- four units in the brief synthesis (C1, C2, C6 and C5 of the brief) and four in the source-grounded synthesis, two of which (`What the 1962 book prints around this formulary' and `The published English reaches this Mass's doctrine at one element') map onto no single settled claim at all. So the brief, the profile and the criterion each speak of one synthesis and the canonical edition builds two, and which one the criterion is asked of is decided nowhere. The iteration-1 longest-common-run measurement was re-run independently this round and returns the same six cross-section runs of eleven words or more, all of them between the brief synthesis and the detailed commentary --- sections/20-themes.tex l. 158-160 against sections/30-commentary.tex l. 1103-1105 (21 words, CON-SYN-002), l. 66-67 against l. 718-719 (15), l. 150-151 against l. 240-241 (14, part of CON-SYN-004), l. 136-137 against l. 896-897 (13), l. 125-126 against l. 573-574 (13) and l. 33 against l. 981 (13) --- while the source-grounded synthesis shares only two runs with the commentary, both the calendar-appointment data its comparative claim is built from, and the interpretive proposals share none at all with either, with the commentary, with the brief synthesis or with the source-grounded synthesis. Saying it plainly as the stage fragment asks: I think this is a gap in this lane's fragment rather than a fact about this leaf, of the same shape as the appointed-text ambiguity criterion 12 had to be widened to settle, and the repair is for the fragment to name which section each half of criterion 4 is asked of in a canonical propers edition, and to say whether, and at what length, prose shared between the two-page brief synthesis and the element-by-element commentary is the profile's state-then-prove layering or the recap its closing clause asks to have removed."

[[observations]]
