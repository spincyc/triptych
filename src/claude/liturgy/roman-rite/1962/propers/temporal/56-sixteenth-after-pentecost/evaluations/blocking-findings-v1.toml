note = "Criterion 3's measure, recomputed against the files as they now stand and recorded here because the criterion asks for the number and a number is not a finding. Stripping LaTeX markup, quoted Latin, work titles and quoted English, 654 of the companion's 3,536 authorial words -- 18.5 per cent -- fall in verbatim runs of seven words or more against the canonical prose the companion stands in place of. The longest strictly contiguous run is 21 words, at l. 303-306: '2~Kings (2~Samuel)~7:27, the same verse Augustine reaches for at this Mass's Introit, for the same fugitive heart', against sections/30-commentary.tex l. 830-832 (canonical p. 19). Against sections/20-themes.tex, which the companion itself prints, 2.0 per cent with a longest run of 10 words; against the other seven shared sections, 1.9 per cent with a longest run of 14 words, 'his \\work{Postilla super Psalmos} breaking off inside Psalm~54, and Jerome adjudicates the wording at the Offertory' at l. 229-231 against sections/90-scope.tex l. 205-209. All three are far inside the 36.8 per cent and 47-word run the lane fragment names as the case that made this a criterion, and I raise nothing under criterion 3: the companion is organised as five cross-proper arguments where the canonical is organised as ten elements plus two collations, no unit of it walks the appointed order, and its conclusions are stated where its own argument needs them rather than reproduced with their working. Two movements this round, both small and both explicable. The replaced-prose figure is unchanged at 18.5 per cent on the same clause and the same 21-word run the previous round measured, because this round's derivation change removed one word from a heading and added two to a sentence and neither sits inside a verbatim run. The shared-section figure rose from 1.6 to 1.9 per cent entirely because the seam repair to sections/99-references.tex introduced a nine-word identity with the companion's own l. 45-46 -- 'the homilist the