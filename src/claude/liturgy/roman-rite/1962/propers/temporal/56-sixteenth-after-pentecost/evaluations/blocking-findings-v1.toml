[[findings]]
stage = "synthesis-evaluation"
id = "SYN-FID-005"
lane = "derivation-fidelity"
severity = "blocking"
location = "sections/synthesis/20-integrated-commentary.tex l. 229-231, the inventory that opens unit 4 --- 'Aquinas reaches one of the five, his \\work{Postilla super Psalmos} breaking off inside Psalm~54, and Jerome adjudicates the wording at one of them, the Offertory's.' --- rendered on companion p. 7. Read against sections/30-commentary.tex l. 1039-1045, the Epistula 106 section 43 witnessnote, on canonical p. 23, and against sections/90-scope.tex l. 211-212, the canonical arm 'Jerome adjudicates the wording at the Offertory and the Communion', on canonical p. 37."
problem = "The companion states a count of Jerome's adjudications that the canonical edition contradicts. The sentence is an inventory of the reception standing over the five appointed psalms, and every other clause in it is a fact about a commentator rather than about this edition: Augustine 'expounds all five', three others 'stand beside him' at each, and 'Aquinas reaches one of the five' is given its reason in Aquinas's own work, the Postilla breaking off inside Psalm 54. Read in that register --- the only register the sentence offers, since no clause marks the number as this edition's coverage and no reason is given for it --- 'Jerome adjudicates the wording at one of them, the Offertory's' tells the companion's reader that Jerome's adjudications touch one of these five psalms. The canonical edition says two. Epistula 106 section 43 rules on two clauses of the Communion's own verses --- that meus is superfluous in 'Deus, docuisti me a iuventute mea', and that brachium and not 'mirabilia tua' is right at 'donec annuntiem brachium tuum' --- and the canonical witnessnote closes at sections/30-commentary.tex l. 1044-1045 with 'He is adjudicating the exact wording this antiphon sings'; the canonical scope appendix repeats the two at l. 211-212. Before this round the clause read 'at two', which was the canonical's number and false of the companion's own enumeration; the repair replaced a count false of this edition with a count false of Jerome. The decision the revision took --- not importing section 43 into the shorter book --- is not what this finding disturbs; only the count left standing in its place, which is an assertion about a Father that the edition this companion derives from does not make and does contradict. The scope appendix's companion arm at sections/90-scope.tex l. 209-210 does not carry the same defect and needs no change on its account: it stands under the heading 'Source scope, and what was not reached', in a paragraph whose subject is what this guide reached, and it states no count."
required_result = "No sentence of the companion states a count of Jerome's adjudications that the canonical edition contradicts. The repair that keeps this round's decision intact is to strike the count: sections/synthesis/20-integrated-commentary.tex l. 230-231 reading '... and Jerome adjudicates the wording at the Offertory's', which is then the same form the scope appendix's companion arm carries at sections/90-scope.tex l. 209-210 and the References entry at sections/99-references.tex l. 339-345. A clause that marks the number as this edition's coverage rather than Jerome's extent --- that the adjudication of the wording this edition follows is the Offertory's --- satisfies it equally. Carrying Jerome's two Communion rulings into unit 3 beside the Offertory ruling at l. 191-195 would satisfy it too, but only if the companion arms of sections/90-scope.tex l. 209-210 and sections/99-references.tex l. 339-345 are brought back to two with it. Under the first two routes neither shared file changes at all, and under every route the canonical arms of both stay byte-identical and the canonical rendering stays at forty-five pages."
repair_target = "derivation"

[[findings]]
stage = "synthesis-evaluation"
id = "SYN-CON-012"
lane = "companion-conformance"
severity = "blocking"
location = "sections/synthesis/20-integrated-commentary.tex l. 40-45, the paragraph closing unit 1 --- 'Not one of the four reads this Gospel together with any other element of this Mass. Gueranger does: he carries the closing axiom straight into the doctrine of grace by way of Ecclus.~3:20--21 --- \"The greater thou art, the more humble thyself in all things, and thou shalt find grace before God\" --- and \\textbf{among the witnesses on this formulary he alone ties one of its elements outright to another}.' --- rendered on companion p. 5. Read against the same file's l. 219-221, rendered on companion p. 7, and l. 296-302, rendered on companion p. 8."
problem = "The 'alone' is false of the companion's own text, twice over, and the two counter-instances are bolded claims of the same document. At l. 219-221 (p. 7): 'Cassiodorus makes the first of those joins himself, two verses past the Gradual's cut, where he quotes the Alleluia outright: Hic laudabit Dominum, novo scilicet cantico, sicut in alio psalmo dictum est: Cantate Domino canticum novum' --- a witness used on this formulary tying the Gradual's psalm to the Alleluia, in the same word 'outright'. At l. 298-302 (p. 8): '\\textbf{One commentator makes two elements of this Mass name one thing.} Cassiodorus glosses the Communion's Judgment with the sheep-and-goats formula he had already used at Ps.~101:17 over the Gradual's videbitur in maiestate sua, so in his hands the Gradual's second half and the Communion's first clause are one event.' A companion reader who scans the bold meets 'he alone ties one of its elements outright to another' on p. 5 and 'One commentator makes two elements of this Mass name one thing' on p. 8, and the two cannot both stand. The canonical edition carries the same claim with the restriction that makes it true, at sections/30-commentary.tex l. 763-764 inside the omitted element-by-element sweep: 'No other witness on this formulary \\emph{as a whole} joins two of its elements outright' --- 'as a whole' confining it to witnesses who read the formulary as a whole, which is the narrowing the canonical revision made and which the canonical's own evaluation passed. The companion's sentence drops those three words, and nothing else in the companion supplies the restriction: the companion reserves a separate phrase, 'formulary-level commentator', for that sense at sections/90-scope.tex l. 205 as rendered on p. 22, and 'the witnesses on this formulary' is the phrase it uses elsewhere for Bede, Cassiodorus and the rest (l. 28-29, 'What earns Bede his place at this formulary'). This is not a question of whether the companion says more than the canonical, which is the other lane's; it is an 'only' measured against a second instance elsewhere in the companion, and both instances are the companion's own prose. The file is inside REVIEW_SCOPE this iteration."
required_result = "The companion's sentence at l. 44-45 and its two reports of Cassiodorus's joins at l. 219-221 and l. 298-302 agree. The wrong half is the 'alone', not the Cassiodorus joins, which are correct and are the whole point of two units: keep them and restrict the claim, either by restoring the canonical's own qualifier so that the clause reads that no other witness on this formulary as a whole joins two of its elements outright, or by naming the exception in place, so that Gueranger is the only formulary-level witness who does it and Cassiodorus is the exegete who does. Do not cure it by striking either Cassiodorus passage. The canonical rendering is untouched by this: sections/30-commentary.tex is not in the companion's build and needs no edit, and the repair is confined to sections/synthesis/20-integrated-commentary.tex."
repair_target = "derivation"

