problem = "Restated unrepaired from the leaf's standing-findings record at evaluations/blocking-findings-v1.toml, at the id and the severity that record fixes under [[advisories]]. It is restated rather than dropped because that record is rewritten whole per stage after each evaluation, so an advisory left out of this report is erased rather than closed. Severity is unchanged and is not a queue position: this lane recorded it advisory and may not raise as blocking an id it filed advisory, and the three rounds it has now stood unrepaired are not evidence about the defect, only about the route. Every passage was re-read against the files as they now stand and every line range the record gives is exact and unmoved. Neither sections/20-themes.tex nor sections/30-commentary.tex is in this iteration's REVIEW_SCOPE, which is research/scope.md alone; both were nevertheless re-read this round because the stage fragment directs an evaluator to the passages its own standing findings name, and no `out_of_scope_reason` arises because this is not a blocking finding. Nothing in the leaf moved this round: this iteration's whole change is in research/scope.md --- the stale headings at section 0.2 (`four lanes' to `five lanes') and section 0.5 (`three species' to `six species'), the merit-and-glory vocabulary enumeration rewritten at section 0.3 l. 198-214, and the accent restored at section 1.1 l. 557 --- and `content-revision` then verified the canonical edition against the corrected brief and changed nothing, the edition making no such inventory. None of that reaches either of this lane's criteria or any of the passages below. The defect: the claim that Cassiodorus at the Communion's psalm says what Augustine says there, so that at that clause the two Latins are one judgment restated and not two, has three homes in the canonical edition and no fullest one, and four quotations are printed whole twice inside the detailed commentary alone. Commentary element 2 prints `quae nullis mer