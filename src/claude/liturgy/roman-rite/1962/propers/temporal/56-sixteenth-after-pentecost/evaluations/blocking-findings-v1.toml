[[findings]]
stage = "synthesis-evaluation"
id = "SYN-CON-009"
lane = "companion-conformance"
severity = "blocking"
location = "sections/99-references.tex l. 364-368, the Council of Trent entry under 'Patristic, medieval and conciliar witnesses' -- 'Council of Trent, Session~VI, cap.~X, cap.~XVI and can.~32, from the Tauchnitz 1887 printing of the \\work{Canones et decreta}, page-verified in this repository. \\textit{Cap.~X quotes a Sunday collect of this series, which the printing's own footnote identifies as the Thirteenth Sunday's, and quotes it altered.}' -- rendered on companion p. 28, under the section's own opening promise at l. 3, 'Only sources actually used above, with loci sufficient to check the claims made from them.'"
problem = "The entry names three Trent loci; this edition uses two of them. Cap. XVI and cap. X both stand above in the companion, at sections/20-themes.tex l. 50-54 as rendered on p. 4 ('Trent, Session~VI, cap.~XVI puts the doctrine in three verbs where the Collect has two ... and cap.~X quotes not this Collect but the Thirteenth Sunday's, altered'). Can. 32 stands above nowhere in it. Its one use in this leaf is the canonical Trent witnessnote at sections/30-commentary.tex l. 313, 'Cap.~X and can.~32 stand with it', inside the element-by-element sweep the companion omits. I searched the companion's rendered text for 'can. 32' and 'canon 32': the string occurs once in the whole 29-page build, inside this References entry on p. 28, which is the entry itself and not a use above it. The italic note that follows is sound -- it describes cap. X alone and is true of what this edition prints -- so the defect is the third locus in the citation line and nothing else. This is the same class as SYN-CON-005, SYN-CON-007 and SYN-CON-008, and the reviser's widened sweep of the class this round did not reach it. The locus is right in the canonical build, where that witnessnote uses it; the profile is what withholds the sweep from the companion, so the natural repair is the branch and not an import of canonical detail the companion is not meant to carry."
required_result = "The Trent entry's citation line is branched on \\ifdefined\\TriptychSynthesisEdition inside sections/99-references.tex, the canonical arm byte-identical. The companion arm reads 'Council of Trent, Session~VI, cap.~X and cap.~XVI, from the Tauchnitz 1887 printing ...', dropping 'and can.~32'; the italic note that follows stays exactly as it stands. The wrong half is the can. 32 locus, not the identification of the witness, the Tauchnitz printing or its page-verified state, all of which are correct in both editions."
repair_target = "seam"

[[findings]]
stage = "synthesis-evaluation"
id = "SYN-CON-010"
lane = "companion-conformance"
severity = "blocking"
location = "sections/synthesis/20-integrated-commentary.tex l. 229-231, the inventory that opens unit 4 -- 'Aquinas reaches one of the five, his \\work{Postilla super Psalmos} breaking off inside Psalm~54, and Jerome adjudicates the wording at two.' -- rendered on companion p. 7. Read against the one Jerome adjudication this edition carries, at l. 191-195 of the same file, also on p. 7."
problem = "The count is two and the companion carries one. Jerome reaches this edition once: at l. 191-195, ruling on the Offertory's clause at Epistula 106 against a reported festina and carrying in adiutorium meum respice. His second adjudication -- the two rulings on the Communion's wording at Epistula 106 section 43, that meus is superfluous in Deus, docuisti me a iuventute mea and that mirabilia tua was carried up from the preceding verse where brachium is right -- stands in this leaf only at sections/30-commentary.tex l. 1039-1045, inside the sweep the companion omits. I searched the companion's rendered text for 'Sunniam', 'docuisti', 'mirabilia tua' and 'brachium tuum' and found no Jerome ruling at the Communion anywhere in it; every occurrence of the name in the companion's body is the Offertory ruling (pp. 4 and 7), Bede's list of authors he drew on (p. 5), or Jerome K. Jerome in the gallery. The sentence is the inventory of who stands at the five appointed psalms in this edition, and the two counts beside it are both borne out by what follows -- Augustine at all five and Aquinas at one -- so the reader has no reason to read this third one differently. This round's repair of SYN-CON-007 sharpened it rather than causing it: the References entry now cites section 23 alone for the Offertory, so the companion states two in its body (p. 7), two in its scope appendix (p. 22, SYN-CON-011) and one in its References (p. 28), and contradicts itself about how many places Jerome rules at. I record that the clause can be read as a bare fact about Jerome's letter, which is true; in an inventory paragraph governing a unit in which Jerome never appears again, that is not how it reads."
required_result = "The companion says the same number of Jerome adjudications in all three places. Either l. 231 states what this edition carries -- Jerome adjudicating the wording at the Offertory, one of the five -- which also settles SYN-CON-011 only if the scope appendix is branched to match, or the derivation carries his Communion rulings into unit 3 beside the Offertory ruling at l. 191-195, which makes l. 231, sections/90-scope.tex l. 208-209 and the References entry all true at once and dissolves SYN-CON-011. The wrong half is the count as this edition bears it out, not the fact that Jerome's letter rules at two of these psalms, which is true and which the canonical edition prints at sections/30-commentary.tex l. 1039-1045. Say in the repair report which of the two routes was taken, because SYN-CON-011 stands or falls on it."
repair_target = "derivation"

