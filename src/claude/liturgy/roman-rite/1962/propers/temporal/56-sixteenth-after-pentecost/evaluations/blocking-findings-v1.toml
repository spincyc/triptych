note = "Unchanged from iterations 0, 1 and 2 and still standing deliberately; re-recorded because evaluations/blocking-findings-v1.toml is rewritten whole for this stage after each evaluation, so dropping it erases a live sighting. I re-checked every passage against the files as they now stand and refreshed the line numbers, which moved in sections/90-scope.tex and sections/99-references.tex when this round's branches were installed. The canonical commentary still says each of Cassiodorus's four agreements with the chants 'rests on one word of one printing', while three passages in files both editions input call them lemmata --- the scope appendix's 'the four lemmata on which his agreement with the chant turns' and 'the four Cassiodorus lemmata on which four of the agreements above rest', and the References entry's 'no critical text was collated at those four lemmata' --- and three of the four are clauses and not single words (suavis ac mitis es ... copiosus in misericordia, videbitur in maiestate sua, quia mirabilia fecit Dominus, Domine in auxilium meum respice). The companion prints 'each of them hangs on one lemma of a single printing', which is what the shared files support. The defect is the canonical edition's and the companion did not inherit it, so no repair owner this run admits reaches it; the reviser reports finding it again this round and leaving it. A person may want to decide whether the canonical sentence should follow the other three."

