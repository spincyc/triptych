location = "guidance/liturgy/roman-1962-propers.md l. 376 (the `Interpretive-proposal audit' instruction in `Themes, commentary, and exploration') against l. 404 (the corresponding bullet of `Profile Gates'). The record they judge is research/scope.md section 9, `Interpretive-proposal audit' (heading at l. 3553), entries 9.1 through 9.6 at l. 3580-3804, with 9.7 opening at l. 3806. Section 9 is inside this iteration's REVIEW_SCOPE and was not edited this round."
problem = "Restated at the id evaluations/blocking-findings-v1.toml already carries for it under [[escalations]], because that record is rewritten whole after each evaluation and an escalation left out of this report is erased rather than answered. Both ends re-verified this round. The profile still states the required fields of the `Interpretive-proposal audit' twice and not compatibly, and criterion 10 cannot be answered without choosing between them. Line 376 directs: `Record an `Interpretive-proposal audit` in `research/scope.md` naming the anchors, mechanism, nearest located precedent or analogue, search boundary, and controlling limit', and adds the novelty classification in the next sentence. Line 404 makes the publication gate `the research scope records each proposal's anchors, mechanism, targeted precedent result, fruit, and strongest limit'. The lists differ in both directions: l. 404 requires a *fruit* that l. 376 does not name, and l. 376 requires a *search boundary* that l. 404 does not. A leaf that follows l. 376 exactly therefore fails the gate at l. 404. Judged on section 9 as this round leaves it: each of 9.1 through 9.6 carries Anchors, Mechanism, `What the element-by-element reading misses', `Nearest located precedent or analogue', `Search boundary', a `Classification' drawn from l. 376's three admitted formulas, and a `Controlling limit' -- six of each field, counted across l. 3580-3804 -- and a case-insensitive sweep of l. 3545-3850 returns `fruit' nowhere, though all six proposals print a `Fruit' field in the leaf at sections/50-interpretive.tex (\\pfield{Fruit} at l. 28, 57, 88, 124, 154 and 193). This round's edits to research/scope.md fell in sections 0.2, 0.3, 0.5 and 1.1 and moved no field of section 9; the entries sit about eight lines lower than the tracked record quotes them only because section 0.3 was rewritten above them. So the record conforms to l. 376 exactly as it did and fails l. 404 exactly as it did, and the difference remains one labelled field in six entries. It is an escalation and not a blocking finding because the defect is in guidance/liturgy/roman-1962-propers.md, which no stage of this workflow may write: the leaf is not departing from a rule, it is conforming to one of two rules that do not agree, and naming `brief' here would spend a repair round on a reading of the profile that the profile itself does not settle. It is not an observation either, because criterion 10 --- whether the source records follow the profile's format --- is mine and reaches it; what it cannot reach is the file the contradiction lives in."
required_result = "The maintainer decides which list of fields the `Interpretive-proposal audit' must carry, and makes the two passages say it once. Either the audit must record the proposal's fruit, in which case l. 376 should name it alongside the anchors, mechanism, nearest located precedent or analogue, search boundary and controlling limit, and the audits of already-published leaves gain a field; or it need not, in which case l. 404's `fruit' should go and the gate should name the search boundary that l. 376 requires. No decision is asked of this run, and no edit to this leaf follows from the escalation until the profile settles which reading governs."
escalated_to = "guidance/liturgy/roman-1962-propers.md, l. 376 and l. 404"
