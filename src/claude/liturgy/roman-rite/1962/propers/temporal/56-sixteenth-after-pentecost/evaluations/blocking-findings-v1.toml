note = "Unchanged this round and restated because evaluations/blocking-findings-v1.toml is rewritten whole after each evaluation and dropping it would erase a live sighting. The leaf varies four of the measurements guidance/liturgy/roman-1962-propers.md l. 293 fixes for the page-2 dossier table -- the four summary-tier column widths, the spanning row's width, the spanning row's size, and the summary tier's own size from \\footnotesize to \\scriptsize -- and records them as three numbered deviations in format.tex. I checked it again against the profile's own escape clause and reach the same verdict: l. 293 permits a measurement change 'only when the complete inventory cannot remain legible after the hierarchy and evidence have been preserved', l. 295 directs 'redesign its dossiers or table rather than spill, omit evidence, or move unrelated apparatus onto page 2', and the same passage directs that the Date column be given enough width for the relation labels. The hierarchy the profile fixes is intact -- two tiers, \\cmidrule(lr){1-4} within a dossier and \\midrule only between complete dossiers, the italic event row set between two \\cmidrule rules at the Gospel, \\arraystretch 1.02, \\LTpre 0.15em, \\LTpost 0pt, the 0.1em breathing space -- all seven dossiers and all eighteen of the regenerated record's carried assertions are printed, and the sheet holds exactly one physical page (the canonical .aux resolves triptych:brief-synthesis:start to page 3, so page 1 is the map and page 2 the sheet alone). I record it rather than raise it because no criterion of this stage reaches typesetting conformance: criterion 9 reaches reader order and page assignment, both of which are met, and whether \\scriptsize over a 6.4pt explanatory tier remains legible on the rendered page is measured by visual-evaluation and not here. I do not think this is a fourth unowned class so much as the boundary between this stage and that one, and I state it so the judgement stands on the run's record and not only in a source comment."

