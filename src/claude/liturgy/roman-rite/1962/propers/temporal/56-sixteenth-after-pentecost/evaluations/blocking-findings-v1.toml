problem = "Restated unrepaired from the leaf's standing-findings record at evaluations/blocking-findings-v1.toml, at the id and the severity that record fixes under [[advisories]]. It is restated rather than dropped because that record is rewritten whole per stage after each evaluation, so an advisory left out of this report is erased rather than closed. Severity is unchanged and is not a queue position: this lane recorded it advisory and may not raise as blocking an id it filed advisory, and the three rounds it has now stood unrepaired are not evidence about the defect, only about the route. Every passage was re-read against the files as they now stand and every line range the record gives is exact and unmoved. Neither sections/20-themes.tex nor sections/30-commentary.tex is in this iteration's REVIEW_SCOPE, which is research/scope.md alone; both were nevertheless re-read this round because the stage fragment directs an evaluator to the passages its own standing findings name, and no `out_of_scope_reason` arises because this is not a blocking finding. Nothing in the leaf moved this round: this iteration's whole change is in research/scope.md --- the stale headings at section 0.2 (`four lanes' to `five lanes') and section 0.5 (`three species' to `six species'), the merit-and-glory vocabulary enumeration rewritten at section 0.3 l. 198-214, and the accent restored at section 1.1 l. 557 --- and `content-revision` then verified the canonical edition against the corrected brief and changed nothing, the edition making no such inventory. None of that reaches either of this lane's criteria or any of the passages below. The defect: the Trent comparison is stated at nearly full strength in both places and its quotation is printed whole in both. The brief synthesis prints `virtus ... bona eorum opera semper antecedit et comitatur et subsequitur' at l. 51-52 and the commentary witnessnote prints the same clause at l. 310-311; the observation that follows it is reproduced almost word for word, `and shares iugiter and semper with it at the doctrinal point' at l. 52-53 against `which shares iugiter and semper with this Collect at the doctrinal point' at l. 311-312; and both passages then draw the same two conclusions, that the middle verb is Trent's and not the Collect's (l. 53 against l. 313-314) and that cap. X quotes the Thirteenth Sunday's collect altered rather than this one (l. 54 against l. 314-317). This is unlike the short runs shared between the brief synthesis and the commentary that state a common datum and draw different conclusions from it, which are the profile's state-then-prove layering; here the conclusion itself is the thing repeated. The commentary is the fullest home and is fullest by a real margin, carrying can. 32 and the Tauchnitz printing's own footnote as the identification of the Thirteenth Sunday's collect, neither of which the brief synthesis has. It is advisory and not blocking on the evidence it was weighed on: both statements are true and agree so no reader who never learns of it is misled, and the passage sits inside the profile's exactly-two-page Themes constraint, so the repair touches settled prose and bears on pagination."
required_result = "The Trent claim has one fullest home, which is the commentary witnessnote at sections/30-commentary.tex l. 309-318, since it alone carries can. 32 and the footnote identifying the collect cap. X actually quotes. The brief synthesis at sections/20-themes.tex l. 50-54 makes its cross-proper point --- that the doctrine the Collect puts in two verbs a council puts in three, and that the council cites a collect of this series and not this one --- without reprinting the cap. XVI Latin whole and without repeating the `iugiter'/`semper' observation in the commentary's own words. Either half would satisfy it on its own: dropping the nine-word `and shares iugiter and semper with it at the doctrinal point' clause from the brief synthesis removes the recap while leaving the quotation, and dropping the quotation leaves the point intact. Whichever route is taken, `The Propers: Themes and Movement' must still fill two complete pages at the settled typesetting size, which is the reason this is not raised blocking."

