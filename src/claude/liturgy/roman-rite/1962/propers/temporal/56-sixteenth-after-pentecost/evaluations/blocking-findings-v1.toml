note = "Criterion 3's measure, recomputed against the files as they now stand and reported here because the criterion asks for the number and the number is not a finding. Stripping LaTeX markup, quoted Latin, work titles and quoted English, 621 of the companion's 3,468 authorial words --- 17.9 per cent --- fall in verbatim runs of seven words or more against the canonical prose the companion stands in place of, longest run 21 words ('2 Kings (2 Samuel) 7:27, the same verse Augustine reaches for at this Mass's Introit, for the same fugitive heart', at l. 303-306). Against the brief synthesis the companion itself prints, 2.0 per cent, longest run 10 words; against the other shared sections, 1.6 per cent, longest run 12 words, and the longest of those is the scope appendix's own psalm-commentator roll-call. All three are far inside the 36.8 per cent and 47-word run the lane fragment names as the case that made this a criterion, and I raise nothing. What I restate is the pattern the previous two rounds recorded: the measure rose again while the document improved. Clearing my own earlier advisory SYN-FID-003 struck seven companion-only words at l. 152 and left the sentence that follows beginning exactly as the canonical's does, and the Jerome repair added four; covered words did not move at all, so coverage went from 17.89 to 17.91 per cent on a denominator three words shorter. That is the fifth time in three rounds that a required_result of this lane's, asking the companion to state a thing as the canonical states it, has raised the redistillation measure by satisfying criterion 1. The lane fragment still gives no rule for the case where restating a claim faithfully is the only way to state it and the same restatement counts against criterion 3; I think that is a gap in the fragment rather than a fact about this document."

