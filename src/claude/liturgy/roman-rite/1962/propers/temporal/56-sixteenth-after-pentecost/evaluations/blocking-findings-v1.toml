location = "sections/90-scope.tex l. 152-157, in 'Dates, and the psalm numbering', rendered on companion p. 21: 'The psalm commentators quoted above give each psalm a speaker and an occasion --- Theodoret's Sennacherib at Ps.~85 and Babylonian captives at Ps.~101, Bellarmine's David with the bear and the lion at Ps.~70, Cassiodorus's Christ in the assumed humanity at Ps.~85 --- and each stands above as what that source says, never as the date or setting of the passage.'"
problem = "The sentence names four readings and says each stands above. In the companion only one of the four does. Theodoret's Babylonian captives at Ps. 101 stands at sections/synthesis/20-integrated-commentary.tex l. 248-249 ('Theodoret gives it to the people in the Babylonian captivity'). The other three stand only in the element-by-element sweep the companion omits: Theodoret's Assyrian assault and Hezekiah at Ps. 85 at sections/30-commentary.tex l. 185-187, Bellarmine's bear and lion at Ps. 70 at l. 1006-1012 ('I, an unarmed youth, fought with a bear and a lion'), and Cassiodorus's Christ in the form of a servant at Ps. 85 at l. 157-165 ('conditionem, quam susceperat humanitatis'). I checked the companion's rendered text for each: 'Sennacherib', 'bear', 'lion' and 'assumed humanity' occur nowhere in it outside this appendix sentence. Nothing under sections/synthesis/ can make the three resolve, because the passages that carry them are the per-element witnessnotes the profile forbids the companion."
required_result = "The list inside the dashes is branched on \\ifdefined\\TriptychSynthesisEdition in sections/90-scope.tex, the canonical arm unchanged so its rendering stays byte-identical, and the companion arm naming only the reading its own text carries -- Theodoret's Babylonian captives at Ps. 101 -- or restating the point without the roll-call, so that 'each stands above' is true of the edition in hand. The wrong half is the list and not the claim: the claim that a commentator's speaker and occasion is reported as that source's own and never as the passage's date is correct and stays."
repair_target = "seam"

