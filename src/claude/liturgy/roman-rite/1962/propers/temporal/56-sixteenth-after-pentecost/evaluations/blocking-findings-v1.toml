location = "sections/30-commentary.tex l. 113-123, the \\correction block \"Psalm numbering, and where the two modern series part\": the head at l. 113-115, \"The printings of the three commentators who stand beside him at these psalms depart from the missal's numbering three further ways, and no two of the three are the same\", against its third item at l. 121-123, the Migne Theodoret facsimile whose pp. 878-879 reprint the same opening as pp. 876-877. Rendered on canonical p. 12."
note = "Restated from the leaf's standing record, unchanged and re-read this iteration against the file as it now stands, because a fresh evaluation replaces its own stage's entries and this lane's sighting would otherwise drop out of the record; the passage is outside this iteration's REVIEW_SCOPE and no reviser has been near it. My criterion is satisfied and I raise nothing: the head says three and the paragraph supplies three. What does not fit is the category the head puts them under. Two of the three are departures from the missal's numbering -- Migne's Cassiodorus numerals running three ahead at Ps. 39 and one ahead at Ps. 97, and the 1866 Bellarmine printing the appointed verses one below the Vulgate at Ps. 39 and Ps. 101 -- while the third is a duplicated opening inside a PG 80 facsimile's own page sequence, a hazard of citing that artifact by page which touches the missal's numbering nowhere. All three are true and all three are held in research/scope.md §0.5, which groups them as numbering hazards rather than as departures from the missal, and the leaf's own \"no two of the three are the same\" warns the reader they are unlike in kind. Criterion 7 reaches the number, which is right; the fit of an umbrella clause over a list of citation hazards is the sentence around the number, which my fragment assigns away from this lane, and criteria 13 and 14 reach statements about the appointed texts and about the built edition's own contents rather than about a third party's printing. I do not think this is a missing criterion in any lane's fragment -- it is one loose generalisation and not a recurring kind -- but the run may want the clause narrowed to the two items it holds of, or widened to \"three numbering hazards\" as the brief has it."

