required_result = "The page inventory and the two-state disclosure are branched on \\ifdefined\\TriptychSynthesisEdition in sections/90-scope.tex, the canonical arm byte-identical, and the companion arm listing only the pages its own text quotes -- 357, 358-360, 365, 367-368, 370 and 370-371 -- and dropping or rewording the clause about p. 360's sentence and p. 358's observation, neither of which this edition prints. The wrong half is the list of pages and the two named items, not the two-state fact about Gueranger's volume, which is correct and belongs in References either way."
