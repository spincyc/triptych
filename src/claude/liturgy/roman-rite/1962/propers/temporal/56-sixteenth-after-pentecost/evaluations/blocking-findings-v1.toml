note = "Unchanged from iterations 0, 1 and 2 and re-recorded for the same reason as the first observation; I re-checked all four pairs against the files as they now stand and neither file moved at these places this round. Several of the companion's conclusions are still stated at full strength twice in one sitting, because sections/20-themes.tex renders in the companion immediately before the integrated commentary: the Sermo 165 tie to the Collect with auxilium and the close at section 7.9, the three places where Augustine's lemma differs and carries his argument, the Offertory's verbatim identity with Ps. 70:12, and the four-way division of solius with the grace-alone verdict. Measured, this is 2.0 per cent of the companion's authorial words with a longest run of ten words, well inside tolerance, so I raise nothing: the duplication is conceptual rather than verbatim, and the same two-tier relation holds between 20-themes.tex and 30-commentary.tex in the canonical edition that passed its own content evaluation. Criterion 3's measure does not reach non-verbatim restatement of a section the companion itself prints, which may be a gap in the lane fragment rather than a fact about this document."

