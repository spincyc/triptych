problem = "Restated unrepaired from the leaf's standing-findings record at evaluations/blocking-findings-v1.toml, at the id and the severity that record fixes under [[advisories]]. It is restated rather than dropped because that record is rewritten whole per stage after each evaluation, so an advisory left out of this report is erased rather than closed. Severity is unchanged and is not a queue position: this lane recorded it advisory and may not raise as blocking an id it filed advisory, and the three rounds it has now stood unrepaired are not evidence about the defect, only about the route. Every passage was re-read against the files as they now stand and every line range the record gives is exact and unmoved. Neither sections/20-themes.tex nor sections/30-commentary.tex is in this iteration's REVIEW_SCOPE, which is research/scope.md alone; both were nevertheless re-read this round because the stage fragment directs an evaluator to the passages its own standing findings name, and no `out_of_scope_reason` arises because this is not a blocking finding. Nothing in the leaf moved this round: this iteration's whole change is in research/scope.md --- the stale headings at section 0.2 (`four lanes' to `five lanes') and section 0.5 (`three species' to `six species'), the merit-and-glory vocabulary enumeration rewritten at section 0.3 l. 198-214, and the accent restored at section 1.1 l. 557 --- and `content-revision` then verified the canonical edition against the corrected brief and changed nothing, the edition making no such inventory. None of that reaches either of this lane's criteria or any of the passages below. The defect: the claim that Cassiodorus at the Communion's psalm says what Augustine says there, so that at that clause the two Latins are one judgment restated and not two, has three homes in the canonical edition and no fullest one, and four quotations are printed whole twice inside the detailed commentary alone. Commentary element 2 prints `quae nullis meritis praecedentibus gratis semper impenditur' at l. 322-323 and `Cum totus hic psalmus gratiam Domini, quae gratis datur, summa intentione commendet' at l. 323-324; both stand whole again in the Cassiodorus witnessnote at element 9, l. 988-990, which repeats the characterisation too (`he says what Augustine says and nearly in Augustine's words', l. 987-988). Element 2 prints `aliter enim liberari non possumus, nisi nos Divinitas propitiata respiciat' at l. 325-326; it stands whole again inside the Cassiodorus witnessnote at element 7, l. 812-813. `nihil tuum praecessit' and `docuisti me nihil in me praecessisse' stand at element 2, l. 327-329, and again in the Augustine witnessnote at element 9, l. 972 and l. 974-975. The brief synthesis states the same claim with one of the same quotations a third time at sections/20-themes.tex l. 34-39, and `docuisti me nihil in me praecessisse' stands twice inside the brief synthesis itself, at sections/20-themes.tex l. 29-30 and again at l. 36-37, so that one six-word Augustine clause is printed whole in four reader-facing places in this edition. The element-2 passage and the two witnessnotes are at the same layer of the edition and do the same proving work, so the repetition is not the profile's state-then-prove design; the brief synthesis's short statement is that design and is not the defect. The reviser's recorded reason for leaving it is that clearing it strikes four whole quotations and moves pagination."
required_result = "Each of the four quotations is printed whole in exactly one reader-facing place: the two Cassiodorus Ps. 70 clauses and the two Augustine clauses in the element-9 witnessnotes, the Cassiodorus Offertory gloss in the element-7 witnessnote. The cross-element point at sections/30-commentary.tex l. 320-331 is made by naming the fact and pointing to those elements rather than by reprinting their Latin, so that the claim that the two Latins are one judgment restated and not two keeps one fullest home, stated once in the detailed commentary. The brief synthesis's summary at sections/20-themes.tex l. 34-39 may stand as it is."

