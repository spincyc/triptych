note = "Restated from the previous evaluation with line numbers re-checked; the sentence did not move this round. Of the works it names, this edition quotes NPNF English at two: the Enarrationes, at sections/synthesis/20-integrated-commentary.tex l. 256-259, 'as the \\work{Nicene and Post-Nicene Fathers} render that exposition, \"had no form nor comeliness\"', and Chrysostom's Homily~7, at l. 100-106, where Gross Alexander's NPNF English is named. The Enchiridion and De gratia et libero arbitrio are quoted in Latin only, at l. 333-340 ('operatur' and 'cooperatur'), and Epistula 55.14.25 and In Iohannis euangelium tractatus 118.5 are cited without quotation at l. 107-111. The canonical build does the same: its Enchiridion witnessnote at sections/30-commentary.tex l. 299-306 is Latin throughout, so the sentence over-reaches for the larger book exactly as it does for the companion, and no branch is the right instrument. The sentence was already branched once this production, to take Gregory's \\work{Regula pastoralis} out of the companion arm, so a reviser has been over it; I note the residue rather than send anyone back to it. If the run wants it, the fix belongs to both arms together."

[[observations]]
stage = "synthesis-evaluation"
lane = "companion-conformance"
location = "sections/99-references.tex l. 100-106, the 1955 general decree entry, unbranched and rendered on companion pp. 25-26: 'Sacred Congregation of Rites, general decree \\work{De rubricis ad simpliciorem formam redigendis}, 23~March 1955, in \\work{Acta Apostolicae Sedis} 47 (1955) 218--224, Tit.~II nn.~1 and 5, Tit.~V~a) n.~1 and Tit.~V~b) nn.~7--8', under the section's own opening promise at l. 3, 'Only sources actually used above, with loci sufficient to check the claims made from them.'"
note = "New this round, found by re-running the class sweep SYN-CON-005, SYN-CON-007, SYN-CON-008 and SYN-CON-009 belong to --- every References entry enumerating the specific loci, canons, sections, columns or pages a source supplies, each item checked against the rendered text above it --- and recorded rather than raised because the defect is the canonical edition's and the companion inherits it unchanged. The entry names four loci and both editions use three. Tit.~II n.~1, Tit.~V~a) n.~1 and Tit.~V~b) n.~7 are all quoted above, at sections/35-source-grounded-synthesis.tex as rendered on companion p. 12 and canonical p. 27, a file both editions input and which I diffed as identical between the two builds. I searched both rendered PDFs for 'Tit.': in each, the only occurrences are those three uses and this entry itself. Tit.~II n.~5 and Tit.~V~b) n.~8 stand above nowhere in either edition, so this is not a seam --- no branch would fix it, because the canonical arm would be as wrong as the companion's --- and it is not the derivation's either, the companion having dropped nothing. My own lane fragment puts this case here: where the profile's requirement is missed by both builds, the canonical edition's evaluation is what should have caught it, and this is an observation rather than a blocking finding against the derivation. The revising agent reached the same verdict on the same two loci and said so in its provenance record; I checked it independently and confirm it. A person may want to decide whether the canonical entry should be narrowed to the three loci it uses."
