source_fingerprint = "sha256:9d95a0cbb4ee56aeb865b6994fa8305fd3cc4c30325ce055b2ea9ec22b1ee90c"
context = "English of the Nicene and Post-Nicene Fathers, first series, as New Advent delivers it, named at each quotation in the guide. The strongest single cross-element result in this leaf: sections 1, 2 and 4 are exactly the Communion antiphon's three verses. Section 3 cites Ps. 85:11, the psalm of this Mass's own Introit, for the point that grace must lead as well as start. Two bounds are carried in the guide: the most quotable formula on this doctrine, sua dona coronabit non merita tua, stands at section 5 on v. 19, one verse past where the antiphon stops; and the NPNF English runs a single section series across both discourses while the Latin restarts at 1 for Sermo II, so a citation must give the verse. The host's markup is registered with its rights unresolved, so quotation is short and is attributed to the translation and never to the host's presentation. The series titles each exposition by the Hebrew psalm number, so this one is filed as Psalm 71."

