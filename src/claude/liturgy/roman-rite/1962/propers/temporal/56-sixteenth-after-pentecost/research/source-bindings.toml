context = "English of the Nicene and Post-Nicene Fathers, first series, as New Advent delivers it, named at each quotation in the guide. Nothing later in the psalm is appointed, so section 1 is the whole of the direct exposition: the new song of the new man, canticum novum in toto non in parte cantatur, the mirabilia as the raising of the world by the holy arm, and the movement to an inward healing. His lemma for the half-verse the chant does not sing reads Sanavit ei dextera eius against the Clementine's Salvavit sibi, and the distinction he builds on it is not a reading of the missal's text. The New Advent page is visibly abbreviated by the NPNF editors with their own ellipses, and the Latin is the fuller witness. The host's markup is registered with its rights unresolved, so quotation is short and is attributed to the translation and never to the host's presentation. The series titles each exposition by the Hebrew psalm number, so this one is filed as Psalm 98."

