context = "The fullest continuous Latin exposition of the appointed Gospel and the load-bearing witness for this formulary, because his de meritis gloriando at 512A is the vocabulary of this Mass's Collect and Communion. He holds Tunc erit tibi gloria in an eschatological and a present sense at 512D without choosing, and at 513A argues that the closing sentence proves the parable must be read typice. Bede supplies his own caution in the letter to Acca prefixed to the work: he says he marked each borrowing with its author's initial in the margin, and the retrieved transcription carries no such marks, so the guide attributes to him only what was checked."

