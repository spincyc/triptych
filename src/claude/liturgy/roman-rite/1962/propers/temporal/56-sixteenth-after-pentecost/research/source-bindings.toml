context = "Locus in Ps. CI, sections 2-3, 22-23. Cassiodorus on the Gradual's two verses, whose lemma carries the missal's maiestate where the Clementine reads gloria. He records Augustine's identification of the psalm's speaker with Christ and declines it, assigning the psalm to a nameless afflicted poor man; he reads the building as finished and the seeing in majesty as the Judgment, in the sheep-and-goats formula he uses again at the Communion's psalm. Same edition state and same citation rule as the Ps. 85 binding above: cited by lemma, the page's verse numerals running level with the missal here."

