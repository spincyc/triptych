context = "Locus in Ps. LXXXV, sections 2, 4, 6, 8, 10, 18, 23-24. Cassiodorus on the Introit's psalm: the divisio assigning all three appointed verses to Christ alone, the poor man as Christ in the form of a servant, tota die as one human life crying by its works, and the formal definition of suavis ac mitis at v. 5. His lemma at v. 5 is the Introit antiphon's second half word for word, against the Clementine, with no manuscript variant recorded in Migne's apparatus; his v. 1 reads egenus and aurem tuam ad me where the missal reads inops and mihi, which is why the guide does not let his poverty word stand in for the chant's. A Migne-derived web transcription delivered by monumenta.ch, not Adriaen's CCSL 98 and not PL 70 read at a column: the section numbers are the host's, no PL 70 column marker stands on the page, and the four single words on which his agreement with the chant turns were not collated against a critical text. The host's rights are unresolved, so quotation is short and is attributed to the text and never to the host's presentation."

