context = "The one Greek psalm commentary this guide reaches, and the only witness in it independent of the Latin line throughout. Antiochene at every one of the five: a historical hypothesis at the Introit, Symmachus reported instead of an allegory at tota die, a change of dispensation at the Alleluia's new song, the Church as speaker at the Offertory, the age of Moses at the Communion, and Jerusalem restored rather than the Judgment at the Gradual. Migne's reprint of Schulze's Halle recension with a facing Latin version and not a critical Greek text; the Greek and that Latin do not always agree, and at Ps. 101:17 the Greek is a future with the Clementine's noun where Migne's Latin prints the Vulgate's perfect, so every quotation in the guide says which of the two it is. The stable locus in this facsimile is the column, its PDF pp. 878-879 reprinting the opening of pp. 876-877. R. C. Hill's English of this work is in copyright and was not used."

