context = "The one non-Roman Western witness the guide uses: this Epistle, Eph. 3:13-21 entire and with the same liturgical incipit adaptation the Roman book makes, appointed as the baptismal lesson of Easter Saturday with the neophyte chant quasi modo geniti infantes in the same stream. Optical layer only, no page image, and the heading and rubric were read in the same noisy stream as the pericope; an eighteenth-century printing is evidence about that book and not about the medieval Ambrosian lectionary. The guide states the adjacency and claims no design in it."

