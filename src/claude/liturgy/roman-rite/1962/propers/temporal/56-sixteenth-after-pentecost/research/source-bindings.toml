context = "English of the Nicene and Post-Nicene Fathers, first series, as New Advent delivers it, named at each quotation in the guide. The whole exposition of the Introit's psalm, read as one sermon. It supplies the totus Christus frame at section 1; the reading of the psalm verse at section 2, humiliato enim appropinquat, with the boasting Pharisee against the needy publican; the rich who are in Deo pauperes at section 3; tota die as the cry of the Body at section 5; and the exposition of suavis at section 7. Its lemma differs from the missal at three of the Introit's five departures, so no sentence of his is a gloss on the chant's own wording. The host's markup is registered with its rights unresolved, so quotation is short and is attributed to the translation and never to the host's presentation. The series titles each exposition by the Hebrew psalm number, so this one is filed as Psalm 86."

