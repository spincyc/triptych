context = "Locus in Ps. LXX, sections 4, 21-23, 32-33. Cassiodorus on the Communion's three verses. He opens and closes the psalm on gratuitous grace in Augustine's own words, quae nullis meritis praecedentibus gratis semper impenditur, and names doctor Augustinus inside these five psalms, so at that clause he corroborates and does not judge independently -- the guide says so where it uses him there. Where he differs he is a second judgment: solius refers the remembering to the Judgment rather than excluding the singer's own righteousness, and the Church's three ages are periodised unlike Augustine's."

