context = "English of the Nicene and Post-Nicene Fathers, first series, as New Advent delivers it, named at each quotation in the guide. The exposition of the Offertory's two verses. Section 24 states the speaker, Christus in passione loquitur; the heart that has forsaken me is the heart that cannot comprehend itself; the confounding is fulfilled in the Resurrection; and convertantur retrorsum, which the Offertory does not print, is read benevolently. His lemma is a third form of the petition, in adiuvandum mihi respice, which is neither the missal's nor the Clementine's. The host's markup is registered with its rights unresolved, so quotation is short and is attributed to the translation and never to the host's presentation. The series titles each exposition by the Hebrew psalm number, so this one is filed as Psalm 40."

