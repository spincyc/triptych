context = "Direct Latin exposition of the appointed Epistle, headed De verbis Apostoli (Eph 3, 13-18) deque gratia et libera voluntate, contra Pelagianos. It reads the reading's hinge as the Collect's own distinction, Peto enim a vobis propter arbitrium voluntatis: rogo det vobis propter auxilium maiestatis, and closes on unde gratiam tuam meritum meum praecedat? Non. Two bounds travel with it and are printed in the guide: it covers 3:13-18 and stops three verses short of the doxology, and its opening remark that the day's readings agreed is about Augustine's own African order, the psalm named there being Ps. 56:2. At section 2.2 he defends the translator's altitudo, which is his text's reading where the missal prints sublimitas."

