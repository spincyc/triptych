context = "Locus in Ps. XXXIX, sections 13, 21-24, 27-28. Cassiodorus on the Offertory's verses. His lemma is the missal's clause word for word, Domine, in auxilium meum respice, with no manuscript variant recorded against it in Migne's apparatus, and his gloss on it -- that God's regard is itself our protection -- is the thesis Aquinas states seven centuries later. On the imprecation he reads a prayer for the persecutors' conversion, which is one of the four ways the checked witnesses relieve it and not the received reading. The page's verse numerals run three ahead of the missal at this psalm, beginning at Exspectans exspectavi, so the locus is cited by lemma."

