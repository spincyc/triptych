context = "Two consecutive sermons dividing the appointed pericope exactly where it divides internally. The evidence state controls the use and the guide says so: the commentary survives entire only in Syriac, Payne Smith's 1859 English translates that Syriac, and no Greek or Syriac witness was opened, so Cyril's argument is reported and his wording is not quoted. His lemma at Luke 14:5 reads son or ox, on which his whole appeal to a father's endangered child depends, and it does not transfer to the missal's asinus. The delivery registered here for sermons 110-123 is a different artifact and does not contain this pericope at all."

