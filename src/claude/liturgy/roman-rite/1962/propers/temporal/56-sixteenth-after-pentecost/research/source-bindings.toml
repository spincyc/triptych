context = "Locus in Ps. XCVII, sections 2, 4, 6-7, 14. Cassiodorus on the Alleluia's verse: the new song as regeneration and Incarnation, sung by those taking the sacraments of the new birth, with the Gospel healings named and then set aside because the saints did them too, so that the novelty is the Resurrection. His lemma carries the chant's explicit Dominus against the Clementine. His psalter reads salvavit eum in the unsung half-verse where Augustine reads Sanavit ei and the Clementine Salvavit sibi, which is why the guide states that the material past the Alleluia's cut is not one text. The page's verse numerals run one ahead of the missal from the first verse, so the locus is cited by lemma."

