# Publication-local record of how this guide used the reusable source library.
# It supplements and does not replace `propers/verified.md`, which is the text
# control for every appointed form, or `research/scope.md`, which owns the
# reception matrix, the audits and the material negative results.
#
# Four things govern the whole file.
#
# First, `states` describe what this publication actually did with the record
# and not what the record could support. Every reception witness below stands at
# `inspected`: it was retrieved and read at its own locus, and none of them was
# collated against a critical edition or against a page image of Migne. No Migne
# column was verified against a facsimile anywhere in this leaf, which is why
# every Augustinian citation in the guide is by enarratio, sermo and section.
#
# Second, the sources of the page-2 Date column stand at `cataloged` and carry
# no fingerprint, and that is deliberate. The Catholic Encyclopedia articles,
# the Biblical Commission responsa, the Haydock printing and the New American
# Bible introduction reach this guide only through the Scripture chronology
# corpus and the generated projection at `research/chronology-annotations.tex`.
# No lane of this run opened any of them for anything but the label the corpus
# already carried, so `acquired` and `inspected` would both overstate what was
# done. They are bound because `research-staleness` watches the records these
# ids name and the Date column moves with them.
#
# Third, one registered artifact is bound as a control against citing it. The
# Antwerp 1614 Lapide artifact is titled `Commentaria in omnes D. Pauli
# Epistolas` and stops at Galatians 6:17: its whole optical layer carries no
# `ad Ephesios` running head, while the repository's own commentary discovery
# index lists Lapide against this Sunday's pericope. Nothing of his exposition
# is cited from it; the extent itself is published and carried in References.
#
# Fourth, no `negative-search` binding appears. Every bounded negative this
# guide publishes was established either by reading a printed edition or by
# literal search over optical layers that are not registered as indexable, so no
# replayable search receipt exists for any of them.
#
# REACHED SINCE THIS FILE WAS FIRST WRITTEN, and named because the earlier form
# of this note listed three of them as unreached: Cassiodorus, `Expositio
# psalmorum`, at all five appointed psalms through the Corpus Corporum text as
# monumenta.ch delivers it -- the library already registered three editions of
# that work when the note said otherwise, and the la.wikisource edition among
# them transcribes Psalms 1-30 only and reaches none of this Mass's five;
# Theodoret of Cyrus, `Interpretatio in Psalmos`, at all five in PG 80; and
# Robert Bellarmine's `Explanatio in Psalmos` in the 1866 English, at all five.
# Jerome's `Epistula` 106 was reached at sections 23 and 43. Fifteen passage
# records at those five psalms, five per witness, are wanted and do not yet
# exist; the bindings below therefore stand against artifacts and editions.
#
# STILL NOT REACHED, and named here rather than left to be inferred, because this
# file is what a later run reads to decide what still needs retrieving: the Latin
# original of Bellarmine's `Explanatio in Psalmos`, of which only the abridged
# English was read; a second Greek psalm commentary, Theodoret being the only one
# held; Jerome, `Tractatus in psalmos` and `Commentarii in epistulam ad
# Ephesios`, of which the second has no work record here at all; Hilary,
# `Tractatus super psalmos`; Chrysostom, `Expositiones in psalmos` -- and whether
# any of those three reaches these five psalms is not established, no extent
# record for them being tracked; Ambrosiaster and Marius Victorinus on Ephesians;
# Gregory of Nyssa on the dimensions of the Cross; Theophylact of Ohrid; the
# Basilian ascetica; Gregory the Great, `Moralia in Iob`; the Second Council of
# Orange; the medieval `expositores missae`; Klauser's `Capitulare
# Evangeliorum`; the Wuerzburg comes; Mohlberg's and Deshusses's critical
# editions of the sacramentaries; a critical text of Cassiodorus at the four
# lemmata that agree with the chant; and every printed chant repertory.


