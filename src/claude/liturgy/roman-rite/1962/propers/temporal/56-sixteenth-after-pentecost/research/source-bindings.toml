context = "Henry William Herbert's 1882 use of 'the inner man' in the gastric sense, the page fixed by the running head standing immediately above it in the scan. It is seven years earlier than the gallery's Jerome K. Jerome witness and is what makes that entry's limiting qualification -- that the gastric sense is an idiom of the language and not a joke either novelist invented -- a statement of fact. It stands in volume 2 and not in volume 1, which is bound beside it and which an earlier search of this work went to."
