[document.homily]
pdftitle = 'The Fifth Sunday after the Epiphany, Resumed after Pentecost: Suffer Both to Grow'
pdfsubject = "A homily for an adult parish assembly on the 1962 Missale Romanum proper of the Fifth Sunday after the Epiphany as resumed in the twenty-fourth place after Pentecost, said on Sunday 8 November 2026: the householder's refusal to let his servants gather the cockle, read with St Jerome on the likeness of wheat and darnel and on room for repentance, St Augustine's sermon on the tares and St John Chrysostom on the cockle that may become wheat; the Church's correction kept; St Paul's bearing with and forgiving one another, with St Rabanus Maurus on the householder's patience; Jeremias's letter to the exiles, from which the Introit comes, and St Jerome on prayer for enemies; the cry from the depths, the Secret and Augustine's wish that the harvest find the servants wheat; the Collect and the Gradual with St Thomas Aquinas; the Communion and St Bede on forgiving in order to be heard; the harvest and the Postcommunion"
