# --- Interpretations of the whole Mass ----------------------------------------
#
# `authors` names every author an interpretation draws on; `carrying_authors`
# names those who carry it, each a Father, a canonized saint or one of the
# Blessed in src/sources/inventories/author-standing-v1.toml, at least one a
# Father or a canonized saint (guidance/liturgy/propers-three-documents.md,
# "Liturgical commentators"). The Psalm expositions printed in PG 27 under
# St Athanasius's name are cited under that printed attribution; he has no
# standing row, contributes to the second interpretation and carries none.
# Honorius, Cassiodorus, Theodoret, Theophylact, Rupert, Durandus and Sicard
# are ecclesiastical writers and support only.

[[lanes]]
key = "patience-of-the-field"
authors = ["Augustine of Hippo", "Jerome", "John Chrysostom", "Rabanus Maurus", "Thomas Aquinas", "Bede", "Honorius Augustodunensis"]
carrying_authors = ["Augustine of Hippo", "Jerome", "John Chrysostom", "Rabanus Maurus"]
sources = ["research/interpretations.md", "research/scope.md", "research/source-bindings.toml"]
senses = ["literal", "allegorical", "moral", "anagogical"]
element_keys = ["introit", "collect", "epistle", "gradual", "alleluia", "gospel", "offertory", "secret", "communion", "postcommunion"]
component_keys = ["patience-of-the-field"]

