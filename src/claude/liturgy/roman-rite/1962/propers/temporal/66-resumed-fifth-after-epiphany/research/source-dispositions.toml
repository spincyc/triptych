locus = "Homiliae in Matthaeum 46.1 on Mt 13:24-30, physical lines 27066-27201 (NPNF I.10, CCEL)"
relationship = "direct-exegesis"
disposition = "deferred"
reason = "Read whole in the tracked NPNF English: the tares as heretical societies sown beside the truth, the sleepers, the prohibition of killing with its two reasons, and the harvest. The comment is one natural unit, from the homily's lemma of 13:24-30 to the turn to the mustard seed at section 2 (line 27203). Not admitted: the constituent edition this text would hang under (edition.john-chrysostom.homiliae-in-matthaeum.ccel-web-2026-09-17) names no translator, so the Catena refuses a translation fragment from it, and adding the credit (Prevost, revised by Riddle, per the constituent title at lines 149-155 of the volume text) would move the reviewed fingerprints of the other leaves that pin that edition's segment and passages. The Greek (PG 58) is not held; PG 57 holds homilies 1-44 only. No passage record exists."
missing_criteria = ["edition-translator-credit", "passage-record", "original-language-text"]
scripture_extents = [{ token = "Matt", first_chapter = 13, first_verse = 24, last_chapter = 13, last_verse = 30 }]

