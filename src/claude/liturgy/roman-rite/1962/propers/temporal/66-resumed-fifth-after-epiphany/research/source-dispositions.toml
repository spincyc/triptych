# Reusable-source dispositions for this leaf's research bindings
# (proper-study-source-dispositions-v1). One or more rows per binding in
# research/source-bindings.toml, pinned to that binding's digest and to its
# source's reviewed fingerprint. Written by the source-registration stage
# (iteration 0) of run eb621aedbeee828e on 2026-11-05, and reconciled by the
# same stage (iteration 1) of that run on 2026-11-05 after research iteration 1:
# the rows of bindings 22 and 36 are re-pinned to their changed bindings, and
# bindings 37-55 receive their rows.
#
# admitted        the verified passage named has a canonical Scripture edge in
#                 src/sources/commentary/fragment-loci.yaml
# deferred        read and used here, but not yet an admissible Catena fragment;
#                 missing_criteria says what is still needed
# rejected        opened as a candidate for the extent given and found not to
#                 expound it; missing_criteria names the failed criterion
# not-commentary  liturgical text, Bible text, translation control, a locating
#                 aid, a calendar witness, a letter's argument or a
#                 non-commentary sighting; no fragment claim is made
#
# Missing criteria used below:
#   passage-record            no passage record holds the excerpt
#   natural-excerpt-boundary  the excerpt's natural extent is not fixed
#   page-image-collation      read on OCR or a transcription, not collated with
#                             a page image
#   verified-transcription    read on page images, but no checked transcription
#                             exists to carry the wording
#   retained-page-image       the page read is in a remote scan only; no page
#                             of it is retained in the library
#   original-language-text    read in translation; the original was not read
#                             or is not held
#   unabridged-text           the translation read is expressly abridged
#   edition-translator-credit the edition record names no translator, so the
#                             Catena refuses a translation fragment from it
#   work-locus-grammar        the work record's locus_pattern cannot express
#                             the locus read
#   tracked-text-controller   the text read is a remote layer; a passage text
#                             needs a tracked, indexable controller
#   publishable-controller    the only held witness of the wording is
#                             restricted or of unresolved rights, so it cannot
#                             control a published fragment (Catena Rule 9)
#   work-record               the work read has no work record of its own; it
#                             is held only inside another work's artifact
#   harvest-alias-group       work-aliases.yaml has no harvest group for the
#                             work, so a Catena row could not name a work_alias
#   attribution-review        the ascription rests on the printing and has not
#                             been reviewed
#   quoted-text-attribution   the comment is another author's text quoted in
#                             this work; a fragment would hang under that author
#   exposition-of-the-extent  (rejected rows) the locus does not expound the
#                             candidate extent

