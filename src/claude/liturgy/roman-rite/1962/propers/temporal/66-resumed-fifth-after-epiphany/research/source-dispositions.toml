id = "chrysostom-hom-col-9-col-3-16-17"
binding_index = 22
binding_sha256 = "b0dd6a6d814275e1b093aaead30f43893f5b3552ecd4856fb81bb7620f078ef8"
source_id = "artifact.nicene-and-post-nicene-fathers.series-1-volume-13.english-ccel-web-2026-09-05.ccel-npnf113-text-54274dd9"
