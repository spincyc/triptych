context = "Rabanus Maurus (saint), Commentaria in Matthaeum IV on Mt 13:24-30, read on page images rendered at 200 dpi from the whole remote PDF, fetched on 2026-11-05 and matched to its registered SHA-256 and byte length. The good seed is sown by one who in his own body strives to bring the seed of good will to the fruit of good works; Cum autem dormirent homines warns us to beware the enemy's seed, ne dum somno inertiae torpemus, fructum laboris nostri perdamus; the householder did not blaze into anger or seek quick revenge but waited patiently, so we, when injured by enemies, must not rush to vengeance but have recourse to patience; Ecce habes exemplum discretionis. Aequanimiter ergo debemus sufferre malos propter bonos, lest by retaliating we give the good occasion of scandal; Sinite utraque crescere builds longanimity to the end of life (Mt 24:13); at the harvest he who bore patiently repays by justice, ut in patiendo justitiam meditemur, et in judicando patientiam habere non negligamus; then (Aug.) the bundles are the sects of heretics, and many who are first tares afterwards become wheat. Carries interpretation 1's moral sense and supports interpretation 3."

