context = "William Durandus (ecclesiastical writer) read in OCR: in the last three Sundays one office, in which the Church shows the wedding garment of charity by praying for the conversion of the Jews at the end, signified in Joseph; the Introit concerns their conversion and the Lord's promise, quia ad hoc tendunt mala quae vobis infero: ut reconciliem vos mihi; the Gradual is David's thanks for deliverance from spiritual and bodily captivity; the Offertory asks pardon as Joseph's brothers did; the Communion is Christ-Joseph's answer, Nolite timere, because the Lord is liberal and quickly forgives. His Mass for this Sunday has Phil 3 and the Gospel of the tribute money (Abeuntes), and an Alleluia Qui sanat contritos corde in some churches; VI.141 says the twenty-fourth Sunday has no chant office of its own; VI.142 sets the same chants with the Epistle Jer 23 and the Gospel of the five loaves. Evidence for the four chants only (research/scope.md 6). The file opens with LIBER SEXTVS; the iteration-0 doubt that it held book VI is withdrawn."

