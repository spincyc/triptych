context = "Chrysostom's Greek read in the uncorrected OCR of the whole remote layer, fetched on 2026-11-05 and matched to its registered SHA-256; no column figure is claimed and no page image was read. Ps 43:7-9: when you fight the devil, say I trust not in my arms, my strength or my righteousness but in God's mercy (Dan 9:18); at 'For thou hast saved us': why speak of the old things of our forefathers? we ourselves hold many pledges of his providence and can count trophies; 'put to shame' means rescued with the shame of the attackers; 'all the day' is the whole life, and we boast not only when you help but also when you forsake us (Gal 6:14; Rom 5:11). Ps 129:1-2: 'out of the depths' is not simply from the mouth or tongue, for words pour out while the mind wanders, but from the deepest heart; such prayers, rooted like a tree, stand against the devil's assault, while those from mouth and lips cannot rise to God; seek in prayer not only to receive what you ask but to make the soul better; and two lessons: it is not possible simply to obtain from God unless our part be supplied, so he first says I cried and then Hear, and intent prayer full of compunction has great power to persuade God. Carries interpretations 2 and 3 for the Gradual and the Alleluia and Offertory."

