context = "Aquinas's lectures on Ps 43 (Reginald's reportatio), read in the exact registered Corpus Thomisticum response, fetched again on 2026-11-05 and matched to its registered SHA-256 and byte length. n. 1: the sons of Core are the sons of Christ's passion, properly the martyrs; the psalm turns from past prosperity to present adversity (Nunc autem repulisti) to petition. n. 3, at Salvasti enim nos: vel in praesenti, quia etsi corporaliter nobis noceant, spiritualiter tamen nocere non possunt; vel in futuro; Sancti dupliciter affliguntur ... quandoque affliguntur spiritualiter, quando peccant illi qui habitant apud eos, and from these afflictions God frees them; the haters are confounded here and will be hereafter. n. 4: tota die means eternity; the saints will be praised in God. Doctor; direct exegesis of the Gradual, supporting interpretations 1 and 2."

