problem = "Record inconsistencies left by the iteration-1 repair. (a) context.md still says of the two Ordos 'Neither response is retained or registered, and neither changes any registration; both are held only in this run's scratch area', and only a following parenthesis says research registered and bound both; line 359 still calls the ICRSP entry 'an unadopted lead' although it is now a bound context witness of the adopted occurrence chain. (b) Scope section 5 and interpretations.md give Ambrose's standing as 'doctor'; author-standing-v1.toml, which section 5 says it follows, records 'father'. (c) Section 9's Maccabean statement rests on the Catholic Encyclopedia 'Psalms' article-text derivative (artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25-article-text, line 218), which is neither bound nor among the sealed chronology sources; only the remote base artifact is sealed."
