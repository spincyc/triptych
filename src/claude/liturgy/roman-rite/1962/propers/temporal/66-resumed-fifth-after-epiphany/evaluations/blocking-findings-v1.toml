[[observations]]
stage = "homily-review"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/sections/20-patience-of-the-field.tex lines 265-267; src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/sections/concise/10-commentary.tex lines 154-157"
note = "The study's first interpretation and the concise study give Bede on Mk 11:25 as 'those not yet perfect obtain what they ask', without his 'postulent sibi peccata dimitti'. The expansive element section keeps that clause. This is the same compression HOM-007 reports in the homily, and it is for the study and concise owners at their next revision."

[[observations]]
stage = "research-review"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/chronology-table.tex, Alleluia and Offertory rows (Ps 129:1-2 Vg.; Heb. 130)"
note = "The rows print only the collection-wide bound 'Before c. 165 B.C.' and 'Occasion date unresolved', which is honest; but the controlling Catholic Encyclopedia 'Psalms' article (article text line 126) places the Songs of Ascents (Pss 119-133 Vg.) as a pilgrim psalter, 'now commonly received', with the return from exile as a less likely setting, and the shared corpus has no group record for them. A corpus gap for its owner, not a defect of this research."

[[observations]]
stage = "research-review"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/scope.md section 2.4 (lines 158-169); guidance/liturgy/roman-1962-propers.md, Published Text and English"
note = "The profile says scriptural elements take the Douay and allows 'say so and give the Latin' only where no public-domain English exists; it does not say which English carries a chant whose Missal form departs from the Vulgate when a registered public-domain hand missal prints it. The research's recommendation of Lasance's attributed chant English composes nothing and is lawful, but it rests on reading between two rules: a missing criterion in the profile."

[[observations]]
stage = "research-review"
location = "src/sources/commentary/formulary-loci.yaml; tools/commentary-work-index formulary --calendar roman-1962 --mass resumed-epiphany-5 and --mass epiphany-5"
note = "Both queries report 0 of 40 loci. The index cannot surface a commentator's Epiphany-season chapter (Durandus, Rationale VI.22) for the lessons this resumed formulary shares, any more than his Twenty-third Sunday for its chants; the same missing criterion the previous round observed, now on the lessons' side."

[[observations]]
stage = "study-review"
location = "research/source-bindings.toml, the Bede binding (In Marc. III on Mk 11:22-25), context field; research/interpretations.md lines 448, 558 and 594"
note = "Research records still disagree with the study, as round 2 observed. The Bede context says his locus is used in interpretations 1 and 2, but the study uses it in 1 and 3. interpretations.md still frames the third reading as the heart 'as a field in which the word is sown', which the study corrected under STU-015. Its comparison table lists Schuster among the second interpretation's witnesses, and section 30 does not cite him. All three are for the research owner at its next revision."

[[observations]]
stage = "study-review"
location = "workflows/fragments/proper-study/study-review.md, the paragraph on element treatment and roll calls"
note = "The label pattern cleared this round because the author took over the light clauses that the round-2 required result wrote out (rewrites 1-5). The fragment states the roll-call ban and the coverage floor but gives no model of the permitted light clause. This round supports the round-2 observation that a criterion may be missing there."

[[observations]]
stage = "synthesis-review"
location = "generated/scriptural-date-location-page.tex and research/chronology-table.tex, row 'Communion: Mark 11:24'; research/chronology.toml, element 'communion' (status 'composition-only')"
note = "The page-2 lookup for the Communion finds only the composition of Mark: Rome traditionally, Egypt reported by Chrysostom; disputed A.D. 38-40 to after Matthew. There is no narrated-event row for the saying itself, which Jesus spoke to the disciples beside the withered fig tree the morning after he cursed it (Mk 11:20-24). A reader therefore cannot pair this passage with its occurrence and place, as the Gospel row allows ('Jesus tells the parable of the wheat and cockle beside the sea'). The gap belongs to the shared corpus and projection, not to this synthesis."

[[observations]]
stage = "synthesis-review"
location = "generated/scriptural-date-location-page.tex and research/chronology-table.tex, row group 'Introit: Jer. 29:11--12,14'"
note = "As round 0 recorded, and still true on this round's render: the composition row of Jeremias's letter gives only the relative answer 'After Jechonias and the deportees had departed from Jerusalem', with no year or range. The 1962 profile asks for a conventional date wherever the received chronology supplies one. This is for the shared corpus."

[[observations]]
stage = "synthesis-review"
location = "tools/check-content-preflight, references-used locus test (the section headed 'The loci a References entry names')"
note = "Still true, and stated in the tool's own comments as a deliberate trade-off. The test judges a commentary's psalms only where the body cites the entry by a word of its title followed by a number, so the abbreviated '\\work{Enarr.\\ in Ps.} 84.2' does not bring the 'Enarrationes in Psalmos' entry under test. A single-verse Bible-list locus also passes when its chapter is named whole anywhere. This round's References were therefore checked by hand, and every locus is cited. The missing criterion is for the tool's owner."

[[observations]]
stage = "synthesis-review"
location = "sections/30-cry-from-captivity.tex line 276 (the second interpretation's anagogical sense); sections/90-apparatus.tex line 53 (Reception paragraph of the expansive scope appendix)"
note = "The study owner still has two items that the concise has now repaired in its own text. First, the study's anagogical sense compresses Bellarmine to 'the deliverance is accomplished \"in the resurrection only\"'; his text reads 'complete delivery from captivity, which will be thoroughly accomplished in the resurrection only ... We are at present only partially free'. Second, the expansive scope appendix leaves Bede out of the authors read in web text, although the study quotes his Latin from the Wikisource Migne text."

[[observations]]
stage = "web-review"
location = "sections/20-patience-of-the-field.tex lines 38, 97, 176 and 186; sections/30-cry-from-captivity.tex line 192; sections/40-word-in-the-heart.tex lines 42, 45 and 106"
note = "These eight inner quotations close with the TeX sequence ''' (for example `Wilt Thou?'''). A pdflatex test under the leaf's T1/lmodern setup sets that as a double closing quote followed by a single one (‘Wilt Thou?”’), so the native print edition nests the marks the wrong way round, while the web reader sets ‘Wilt Thou?’” correctly; writing '\\,'' gives the right order in both. No screen or review criterion covers this sequence, which points to a missing typography lint rather than to anything particular to this leaf."

[[observations]]
stage = "web-review"
location = "sections/20-patience-of-the-field.tex lines 153 and 156 (Augustine, Ep. 93.34 and 93.36, quoted from NPNF)"
note = "The quotations \"at the end of the world,--meanwhile\" and \"even to apostles,--namely\" copy the CCEL plain text, which writes its dashes as ASCII -- (the same file has \"formless;--on account\"). In TeX, -- sets an en dash, so the print and web editions both show \"world,–meanwhile\"; the printed NPNF very likely has an em dash there (---), but this was not checked against page images."
