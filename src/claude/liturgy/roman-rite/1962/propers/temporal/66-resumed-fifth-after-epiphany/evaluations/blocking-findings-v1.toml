[[advisories]]
stage = "homily-review"
id = "HOM-003"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/sections/homily/10-homily.tex lines 34-36 and 106-108"
problem = "Two sentences are hard to follow on one hearing. The two instances this id named in round 0 are repaired: the 35-word sentence was split, and the Collect is now described without a quotation. (a) Lines 34-36 are the second sentence of that split: 'Other translations call it tares, and he would not let his people think the tares grew only among them.' It joins a remark about translation and Augustine's argument with 'and', so a listener hears the second as following from the first. (b) Lines 106-108: 'The wish that Augustine puts among the Lord's words to the zealous servants is therefore meant for us as well: \"That time will come, may it only find you wheat!\"' The sentence opens with a fifteen-word subject that names words the listener has not heard. The speech has not said that Augustine, in Sermo 73.1, retells the householder's answer in the Lord's voice. The wish itself arrives only after the verb."
required_result = "Each sentence carries one idea a listener can hold. Plain rewrites: (a) 'Other translations call the cockle tares. Augustine would not let his people think the tares grew only among them.' (b) 'When Augustine gives the Lord's answer to the zealous servants, he puts a wish among the words: \"That time will come, may it only find you wheat!\" We are those servants, and the wish is for us as well.'"

[[advisories]]
stage = "homily-review"
id = "HOM-006"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/sections/homily/10-homily.tex line 82; src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/sections/homily/90-note.tex lines 55-57"
problem = "'St Rabanus Maurus finds the same patience in the householder himself' puts the identification of his patience with the bearing-with of Col 3:13, just quoted, inside Rabanus's finding. Rabanus (In Matthaeum IV on Mt 13:24-30, PL 107 col. 947, read on the page image) finds patience in the injured householder and draws the moral for us, but he does not mention Colossians. The note records the identification as the preacher's: 'Rabanus's patience in the householder is said to be the same patience; neither Rabanus nor Paul mentions the other's text.' The speech's grammar and the note disagree. This is a single instance, and the rest of the paragraph renders Rabanus exactly."
required_result = "The preacher states the identification in his own voice, and Rabanus is credited only with what he says. Plain rewrites: 'The householder himself shows that patience. St Rabanus Maurus points out that he had been wronged, and he knew who had done it: \"An enemy hath done this.\" ...' or 'St Rabanus Maurus finds patience in the householder himself.'"

[[advisories]]
stage = "homily-review"
id = "HOM-007"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/sections/homily/10-homily.tex lines 126-128"
problem = "Bede's comment on Mk 11:25 (In Marci evangelium expositio III, bound Migne Latin text, the paragraph beginning 'Notanda distinctio deprecantium') distinguishes two kinds of people who pray. Faith made perfect moves mountains. Those not yet so perfect are to ask that their sins be forgiven them ('postulent sibi peccata dimitti'), and 'without doubt they will obtain what they ask, provided that they first forgive others who sin against them'. The speech keeps 'will obtain what they ask' but drops what they ask, and it does so directly after the Communion's 'whatsoever you ask'. A listener therefore hears Bede promising the not-yet-perfect whatever they ask on that condition. The expansive study's element section (sections/10-each-element.tex lines 237-242) gives the clause. The first interpretation (sections/20-patience-of-the-field.tex lines 265-267) and the concise study compress it in the same way, so the homily inherits the compression. The response that follows stays true to Bede, whose next sentence says that those who refuse to forgive can neither work mighty deeds by prayer nor obtain pardon. This is a single instance."
required_result = "The sentence keeps the object of the petition. Plain rewrite: 'Those who are not yet perfect, he says, should ask for the forgiveness of their own sins, and they will obtain what they ask, \"provided that they first forgive others who sin against them.\"'"

[[advisories]]
stage = "research-review"
id = "RES-008"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/interpretations.md, interpretation 3 `word-in-the-heart`, 'Four senses', Anagogical (lines 567-573, the clause at line 570)"
problem = "The anagogy rewritten in repair of RES-007 says 'the one who bore patiently is repaid by justice (Rabanus)'. Rabanus, In Mt. IV on Mt 13:30 (PL 107 cols. 947-948, binding 50; tracked OCR artifact.jacques-paul-migne.patrologia-latina-volume-107.1864-paris.ia-djvu-text-5b8a4b8b about lines 103520-103527) writes 'Qui ante per longanimitatem patienter sustinuit, modo per justitiam meritis condigna rependit. Nobisque exemplum in hoc tribuit, ut in patiendo justitiam meditemur ...': the subject is the long-suffering householder, who bore the tares patiently and now repays each by justice. It is not the patient one who is repaid. Scope section 5 (line 328) and interpretation 1 (lines 100-102) read him correctly; this clause inverts him and credits a saint with a reward-of-the-patient anagogy he does not state."
required_result = "Restate the clause as Rabanus says it, e.g. 'the householder who bore the tares with long-suffering repays each at the harvest by justice, and gives us the example ut in patiendo justitiam meditemur, et in judicando patientiam habere non negligamus (Rabanus)'. If the anagogy wants the reward of the patient, cite Honorius, Speculum Ecclesiae (binding 35), 'pro patientia habundantius remunerari mereantur', as a supporting ecclesiastical writer, or drop the clause."

[[advisories]]
stage = "research-review"
id = "RES-009"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/interpretations.md, interpretation 2 `cry-from-captivity`, end of 'Carrying authors and their reasoning' (lines 314-319)"
problem = "'Jerome, Augustine, Hilary and Chrysostom agree on the controlling claim: the captivity is turned by God, the people are commanded to pray within a promise already made, and the full return is still to come.' Jerome (In Hier. V on 29:10-14) and Augustine (En. in Ps. 84.2-4; 43.6-8) state these clauses. Hilary (Tract. in Ps. 129.2-3) says nothing of captivity, a promise or a return to come; he says God hears by nature and faith asks to be heard. Chrysostom on Ps 129:1-2 says one's own part comes first; on Ps 43:8-9 he speaks of present pledges and of glorying even when forsaken (scope 7.5 records his reading as a present experience), not of a return still to come. The sentence has the form the three-document profile names ('these Fathers carry it: <thesis>'), and a study drafted from it would credit Hilary and Chrysostom with the whole synthesis."
required_result = "Credit each author with the clause he states, e.g. 'Jerome and Augustine state the controlling claim: God turns the captivity and commands prayer within a promise already made (Jerome), and the full deliverance is still to come (Augustine; Jerome's anagogy). On the Mass's own Ps 129 Hilary and Chrysostom give the reason prayer is commanded: God hears by nature and faith asks to be heard (Hilary); one's own part comes first (Chrysostom). Chrysostom's reading of Ps 43:8 as present pledges is compatible with the claim but does not state it.'"

[[advisories]]
stage = "research-review"
id = "RES-010"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/scope.md sections 7.1 (lines 372-418) and 8 (lines 562-634); src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/interpretations.md, interpretation 1, Jerome entry (lines 73-84), Limits (lines 215-227) and the comparison row 'The people' (line 598)"
problem = "Jerome, In Mt. II on 13:36-43 (PL 26 col. 93, PDF p. 54, page image; binding 23) identifies the householder's servants: 'Servos patrisfamilias, ne alios accipias quam angelos, qui quotidie vident faciem Patris'. Augustine, Sermo 73.4, likens us to the servants ('We in this time present are like those servants'); Honorius makes them prelates; Aquinas, Super Mt. c. 13, praises their zeal as acting at the lord's command. The record keeps the witnesses' differences over the tares (8.5) and the sleepers (8.3) but not this one, although interpretation 1 builds its application on the servants' question ('servants tempted to uproot'; the Alleluia contribution at line 161). Jerome draws his lesson for the hearer from ne forte and locus poenitentiae ('monemur ne cito amputemus fratrem'), not from identifying the hearer with the servants."
required_result = "Record, in 7.1 or a new 8.6, who the servants are for each witness (Jerome: angels; Augustine, Sermo 73.4: we, men who may be deceived; Honorius: prelates; Aquinas: servants zealous at the lord's command), and add to interpretation 1's Limits that Jerome's application to the hearer rests on ne forte, not on the servants, so that no study credits Jerome with making the servants the Church's members."

[[advisories]]
stage = "research-review"
id = "RES-011"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/scope.md section 3, third bullet (lines 187-197), section 6 (lines 333-364) and section 10; src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/source-bindings.toml binding 41"
problem = "Durandus, Rationale VI.22 'De dominica quinta post Epiphan.' (1612 tomus secundus OCR, artifact.william-durandus.rationale-divinorum-officiorum.1612-lyon-tomus-secundus.ia-djvu-ocr-b9b266dd, from line 3883; the same chapter in the 1568 composite OCR ia-djvu-ocr-2bd5ccb5 from line 42630) expounds this formulary's Epistle: 'bene convenit epistola ad Coloss. 3 c. induite mansuetudinem, et pietatem, id est, induite vos nova veste: ut cum novo Rege novi sitis'. His own Gospel is Mt 11:25 (Confiteor tibi), and he reports 'Aliae vero ecclesiae legunt Evangelium: Simile est regnum caelorum, quod est Matthaei 13'. research/context.md directed that a commentator's 'Fifth Sunday after the Epiphany' be identified by its elements, but the section 3 heading search used only the English 'Fifth Sunday after the Epiphany' for that Mass, and section 6 records no commentator's Epiphany-season chapter. A held commentator's locus on a shared element is therefore missing from the record. Rupert and Sicard treat only the first three or four Sundays after the Epiphany, and the held Honorius text has none; the Epiphany-season volumes of The Liturgical Year and of Schuster are not held. The omission changes no reading."
required_result = "Enter Durandus VI.22 in section 6 by elements (shared: the Epistle, Col 3:12-17; differing: his Gospel Mt 11:25-30 and the Epiphany chants), with his gloss on Col 3:12 and his report that other churches read the tares Gospel, cited for the Epistle only; bind the locus (extend binding 41's loci or add a binding) with a disposition row; and record in sections 3 and 10 the Latin heading search for the Fifth Sunday after the Epiphany in each held commentator, with its results, and that the Epiphany-season volumes of Gueranger and Schuster are not held."

[[advisories]]
stage = "research-review"
id = "RES-012"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/scope.md section 2.3 (lines 120-127), section 3.1 rows for Ps 129:1-2, Augustine and Cassiodorus (lines 244-245), section 10 (lines 693-700) and section 13.4 (lines 897-901); src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/source-bindings.toml binding 45; src/claude/liturgy/roman-rite/1962/propers/temporal/66-resumed-fifth-after-epiphany/research/source-dispositions.toml row cassiodorus-expositio-ps-129-1"
problem = "A narrow residue of RES-003, which required a concrete reason wherever a held artifact reaching an appointed passage was not opened. (a) Cassiodorus on Ps 129:1-2 (PL 70 OCR, lines 72518-72590, immediately after the bound range 72423-72520 in a layer already fetched and hash-matched) is recorded 'not read' with no reason. It expounds the Mass's Alleluia and Offertory verse (the deep as the deep of sins; Jonah 'tacitus vociferabatur'; prayer heard 'quanto de imis penetralibus clamabat'), and its lemma reads 'Domine, exaudi orationem [mss. A., B., et ed., vocem] meam', the chant's form against the Clementine 'vocem'. The disposition row nevertheless gives the preface that was read the extent Ps 129:1 as direct exegesis. (b) Section 13.4 says 'Ps 129 is not held in Latin', but section 3.1 says the PL 37 container reaches it and 'PL 37 not opened', and the library holds PL 37 (Psalms 80-150) as a remote scan; Augustine on Ps 129, a carrying locus of interpretation 2, was read only in the abridged NPNF English, with no reason given for not opening the Latin. (c) The section 2.3 datum is narrower than its evidence: Ambrose's lemma at PL 14 col. 1154 (page image read) also reads 'et eos qui oderunt nos, confudisti ... in saecula', the Gradual's other two departures from the Clementine."
required_result = "Read Cassiodorus on Ps 129:1-2 and record what he says, or give the concrete reason it was not read; correct the disposition row's extent and relationship to the lines actually read; reconcile section 13.4 with section 3.1 and either read Augustine's Latin of Ps 129 in PL 37 or state why it was not opened; and extend the section 2.3 datum to Ambrose's full lemma and to Cassiodorus's 'orationem meam' with its recorded variant, still asserting no origin for the chant forms."

