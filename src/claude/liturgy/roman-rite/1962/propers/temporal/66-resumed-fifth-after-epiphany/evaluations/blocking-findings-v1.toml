[[advisories]]
stage = "study-review"
id = "STU-019"
severity = "advisory"
location = "sections/20-patience-of-the-field.tex lines 257-258 (the Introit paragraph under 'Bearing with one another')"
problem = "The register repair turned the round-2 sentence 'Because the command and the promise stand in one letter, this interpretation takes the promise to cover the prayer Jerome finds in verse 7' into 'Since the command and the promise stand in one letter, the promise of a hearing covers the prayer for the city that the letter commands.' The study's take has become a deduction about the scope of Jeremias's promise, and the ground given does not carry it. In the letter the hearing of v. 12 follows v. 10 ('When the seventy years shall begin to be accomplished in Babylon, I will visit you ... to bring you again to this place') and leads into the seeking, finding and return of vv. 13-14, while v. 7 gives the prayer for the city its own reason, 'for in the peace thereof shall be your peace.' Jerome, at the locus the second interpretation quotes (In Hier. V on 29:10-14, PL 24 col. 893, read on the page image), glosses 'Tunc invocabitis me, et ibitis Jerusalem: et orabitis, et exaudiam vos' and says that God urges the captives to pray 'ut quod promissum est, mereantur accipere'. In his reading the call that God hears is the prayer for the promised return. The sentence is the Introit's only contribution to this interpretation. It is advisory because it is a single sentence whose ground the reader can see and judge, and the interpretation's argument does not rest on it. The review fragment classes a repair that drops a qualification as a source defect, not a style one."
required_result = "The sentence says what the letter does and does not assert that the promise of v. 12 covers the prayer of v. 7. If the extension is kept, it is stated as the study's own and given a ground that carries it. Plain rewrite: 'The same letter that commands this prayer promises a hearing to those who call on God, invocábitis me, et ego exáudiam vos; servants who may not weed the field can still pray for the cockle, asking for the change Augustine's sermon asks of the tares.'"

[[advisories]]
stage = "study-review"
id = "STU-020"
severity = "advisory"
location = "sections/30-cry-from-captivity.tex lines 36-37 (the closing sentence of the paragraph 'In the letter the exiles are told to call on God ...')"
problem = "The repair replaced the labelled sentence 'This interpretation takes the harvest of the parable as a term of the same kind as the letter's seventy years ...' with 'In the parable as in the letter, the one who promises fixes the term and tells those who wait what to do until it comes.' The two preceding sentences already give the letter's term and instruction and the householder's: he 'also tells his servants beforehand what he will do and when ... and until then both are to grow.' The closer restates them as a general formula, and deleting it loses nothing (guidance/editorial.md, 'Each sentence adds something'). The defect is a single instance, so it is advisory."
required_result = "The paragraph ends on the householder's words and instruction, or its closing sentence adds something the paragraph has not yet said. Plain rewrite: delete the sentence, so that the paragraph closes on '... and until then both are to grow.'"

[[advisories]]
stage = "study-review"
id = "STU-021"
severity = "advisory"
location = "proper-components.toml line 207 (lane cry-from-captivity, authors); research/production-review.md, 'Author-study, iteration 3', Repairs paragraph"
problem = "(a) The cry-from-captivity lane lists Bede and Alfredo Ildefonso Schuster among its authors, but sections/30-cry-from-captivity.tex cites neither. Bede left the second interpretation in the iteration-1 repair and is used in the first and third (20:262-269, 40:238-249). Schuster appears only in section 10. The manifest therefore credits the second interpretation with two contributors whose reasoning it does not use. The file is unchanged this round, and no reader sees the defect. (b) The production record says 'Each interpretation names its own step once, in its opening'. The first and third openings do (20:16-17, 40:13-17). The second carries no such statement, as the author's own result note ('1, 0 and 1') records."
required_result = "(a) The lane's authors name only those whose reasoning section 30 uses: Bede and Schuster are removed, or their contribution is restored in the prose where the argument needs it. (b) The record says that the first and third openings name the study's step and the second carries no such statement."

[[advisories]]
stage = "synthesis-review"
id = "SYN-005"
severity = "advisory"
location = "sections/concise/04-themes.tex lines 19-21 and 38-42; sections/concise/10-commentary.tex lines 175-180 and 212-223"
problem = "Twice in this round's text, a point is stated again just after the reader has been given it (guidance/editorial.md, 'Say it once'). (1) Jerome's answer on Jer 29:12 is that the Lord could have fulfilled his promise without the captives' prayer, but urges them to pray so that they may be worthy to receive it. The opening thesis gives it (04-themes 19-21). The Introit paragraph fifteen lines later gives it again (38-42). The commentary gives it a third time, in Latin and English (10-commentary 175-180). Page 1 and the compared senses also summarise it. The commentary's version adds the Latin and its context: the false prophets, Futurorum scientia and Mt 7:7. The Introit paragraph adds nothing to the thesis on the same page. (2) The commentary quotes Bede's two statements on Mk 11:23-25 (212-219): the unclean spirit is driven out when the word is preached, and the perfect in faith move such mountains by praying. The next sentence restates both in a relative clause to reach its inference (219-223): 'the unclean spirit that Bede says is driven from the heart when the word is preached, and that the perfect in faith move by praying, is the parable's enemy'. This paraphrases what the reader has just read, and it leaves 'move' without its object, which is Bede's mountain. These are two instances, not a pattern that recurs through a section. Neither changes an attribution or a claim, and both attributions were checked against PL 24 col. 893 and Bede's Migne text."
required_result = "Each point is given once, at its fullest place. Plain rewrites: (1) 04-themes 38-42: 'God has promised the return and still tells the captives to call on him; that is the difficulty St Jerome answers (In Hieremiam V, PL 24 col. 893).' This leaves his answer to the thesis above it, and its Latin and reasoning to the commentary. (2) 10-commentary 219-223: 'Since the Lord names the devil as the enemy who sowed the cockle (Mt 13:39), Bede's mountain is the parable's enemy, and the Communion makes its promise to the faith that moves it by praying.'"

[[advisories]]
stage = "web-review"
id = "WEB-001"
severity = "advisory"
location = "sections/40-word-in-the-heart.tex lines 15-17 (web Markdown line 463, the last sentence of the opening paragraph of 'While Men Slept: The Field Kept by the Word That Dwells in the Heart')"
problem = "\"They are set together here because both ask something of each hearer\" names the study's own joining of the parable and Col 3:16 instead of stating the connection. This is the editor's synthesis labelled in the body, which 'State the finding, not the process that produced it' in guidance/editorial.md excludes; deleting the clause loses nothing. It is the only instance found in the study, so it does not block."
required_result = "State the connection without the process clause, keeping the preceding qualification that Chrysostom does not set the two passages side by side. For example: \"Both ask something of each hearer: the parable, as Chrysostom reads it, asks him to stay awake, and Paul says what he is to keep in his heart.\""

