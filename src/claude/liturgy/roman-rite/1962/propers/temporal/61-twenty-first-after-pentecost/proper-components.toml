# --- Interpretive readings of the whole formulary ------------------------------
#
# `authors` names every author a reading draws on; `carrying_authors` names the
# ones who carry it, each a Father, a canonized saint or one of the Blessed in
# src/sources/inventories/author-standing-v1.toml, at least one a Father or a
# canonized saint (guidance/liturgy/propers-three-documents.md, "Liturgical
# commentators"). St Alphonsus Liguori has no standing row in that registry;
# he contributes to the second reading and carries none. The Psalm expositions
# printed in PG 27 under St Athanasius's name are cited under that printed
# attribution, contribute to the first and third readings, and carry none.

[[lanes]]
key = "armour-under-providence"
authors = ["Gregory the Great", "John Chrysostom", "Jerome", "Hilary of Poitiers", "Thomas Aquinas", "Rabanus Maurus", "Robert Bellarmine", "Rupert of Deutz", "William Durandus", "Sicard of Cremona", "Alfredo Ildefonso Schuster", "Lucien Fromage"]
