[[advisories]]
stage = "research-review"
id = "RES-012"
severity = "advisory"
location = "propers/verified.md, 'St Luke's orations in the 1862 (research iteration 2)', the Oratio, Secreta and Postcommunio rows of the collation table"
problem = "On PDF p. 770, read at 300 dpi, the 1962 prints the Collect's 'pro tui nóminis honóre, portávit' with a comma, and verified.md's own transcription of no. 3883 keeps it. On scan PDF p. 646, read at 300 dpi, the 1862 prints 'pro tui nóminis ho-/nóre portávit' with no comma. The Oratio row's 'Kind of difference' cell lists the comma after quæsumus, the unaccented quæsumus and júgiter, but not this difference. The Secreta and Postcommunio rows likewise omit the 1862's unaccented 'quæsumus' (1962 'quǽsumus'), although the Oratio row lists it. The 'same words' conclusion and the publication basis are unaffected."
required_result = "Add 'no comma after honóre' to the Oratio row, and 'quæsumus for quǽsumus' to the Secreta and Postcommunio rows. Alternatively, state that the table does not list every accent or pointing difference."

[[advisories]]
stage = "research-review"
id = "RES-013"
severity = "advisory"
location = "research/interpretations.md 3.3 'What follows' ('each draws his time from his own reading of the unsung v. 84a'; 'it neither needs nor uses the unsung Quot sunt dies'); research/scope.md 4.4 closing paragraph ('the difference is driven by how each reads the unsung v. 84a … Augustine takes it as the body of Christ asking about its days and so the judgment as the end, until which the Church remains')"
problem = "These iteration-2 sentences say that Augustine draws his end-directed time from the unsung v. 84a. Reading 3's controlling claim is that same Augustinian answer: the judgment is the end, and the Church remains on earth until it. Yet 3.3 then says that reading 3 rests on what Augustine says of the sung v. 84b, and 'neither needs nor uses' v. 84a. At NPNF1-8 lines 58205-58216, Augustine's 'showing indeed that the Church would exist on earth until the judgment' explains why the judgment question follows the days question ('when he had enquired concerning the days, he added also respecting the judgment'). The martyrs' plea answered by long-suffering (Rev 6:10-11), and 'when vengeance shall fall upon Her persecutors', bear on the judgment question itself. Section 3.2 states that bearing, but 3.3 and 4.4 now describe the reading's dependence on the unsung half in two incompatible ways. The reading itself stands on the sung words through Augustine's martyrs' plea, Cassiodorus, the PG 27 exposition at v. 86b and Aquinas on the reckoning. The defect is therefore in the record's account of itself, not in its evidence."
required_result = "Make 3.3 and 4.4 agree. One way: say that Augustine's 'the Church on earth until the judgment' comes from the order of the verse's two questions, the first of which is unsung. Then name what reading 3 takes from his comment on the sung half: the martyrs' plea answered by long-suffering, and the vengeance at the judgment. The other way: drop 'neither needs nor uses', and label the Augustinian 'until the judgment' as drawn in part from the unsung days question."
