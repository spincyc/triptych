severity = "advisory"
location = "propers/verified.md, 'St Luke's orations in the 1862 (research iteration 2)', the Oratio, Secreta and Postcommunio rows of the collation table"
problem = "Unchanged since iteration 2. The file is byte-identical to the sealed bytes, and its table rows and its transcription of no. 3883 were re-read for this review. The page readings that follow are iteration 2's and were not repeated here. On PDF p. 770, read at 300 dpi, the 1962 prints the Collect's 'pro tui nóminis honóre, portávit' with a comma, and verified.md's own transcription of no. 3883 keeps it. On scan PDF p. 646, read at 300 dpi, the 1862 prints 'pro tui nóminis ho-/nóre portávit' with no comma. The Oratio row's 'Kind of difference' cell lists the comma after quæsumus, the unaccented quæsumus and júgiter, but not this difference. The Secreta and Postcommunio rows likewise omit the 1862's unaccented 'quæsumus' (1962 'quǽsumus'), although the Oratio row lists it. The 'same words' conclusion and the publication basis are unaffected."
required_result = "Add 'no comma after honóre' to the Oratio row, and 'quæsumus for quǽsumus' to the Secreta and Postcommunio rows. Alternatively, state that the table does not list every accent or pointing difference."

[[advisories]]
stage = "research-review"
id = "RES-013"
severity = "advisory"
location = "research/interpretations.md 3.3 'What follows' (lines 581-590: 'each draws his time from his own reading of the unsung v. 84a'; 'it neither needs nor uses the unsung Quot sunt dies'); research/scope.md 4.4 closing paragraph (lines 1145-1157: 'the difference is driven by how each reads the unsung v. 84a ... Augustine takes it as the body of Christ asking about its days and so the judgment as the end, until which the Church remains')"
problem = "Unchanged since iteration 2; both files are byte-identical to the sealed bytes. These sentences say that Augustine draws his end-directed time from the unsung v. 84a. Reading 3's controlling claim is that same Augustinian answer: the judgment is the end, and the Church remains on earth until it. Yet 3.3 then says that reading 3 rests on what Augustine says of the sung v. 84b, and 'neither needs nor uses' v. 84a. At NPNF1-8 lines 58205-58216 (re-read for this review), Augustine's 'showing indeed that the Church would exist on earth until the judgment' explains why the judgment question follows the days question ('when he had enquired concerning the days, he added also respecting the judgment'). The martyrs' plea answered by long-suffering, and 'when vengeance shall fall upon Her persecutors', bear on the judgment question itself. Section 3.2 states that bearing, but 3.3 and 4.4 describe the reading's dependence on the unsung half in two incompatible ways. The reading itself stands on the sung words, so the defect is in the record's account of itself, not in its evidence."
required_result = "Make 3.3 and 4.4 agree. One way: say that Augustine's 'the Church on earth until the judgment' comes from the order of the verse's two questions, the first of which is unsung. Then name what reading 3 takes from his comment on the sung half: the martyrs' plea answered by long-suffering, and the vengeance at the judgment. The other way: drop 'neither needs nor uses', and label the Augustinian 'until the judgment' as drawn in part from the unsung days question."

[[advisories]]
stage = "research-review"
id = "RES-014"
severity = "advisory"
location = "research/scope.md 3.5, Bellarmine authorship entry (line 483, 'His judgment stands against Augustine's Enarr. 89.2'); 4.7 (line 1200, 'A real disagreement between a Doctor's probable judgment for the title ... and a Father's judgment against Moses' entire authorship'); 7.4 (line 1419, 'For Moses: the title itself, and Bellarmine'; line 1434, 'the title and Bellarmine are for Moses'). Routed to this review as STU-012 (research/production-review.md, author-study iterations 1 and 2)."
problem = "This was checked at the bound locus and holds. The O'Sullivan transcription (artifact ...historical-text-357551e1, text.txt) prints Preface II §5 (line 63) directly after the §4 sentence the record quotes: 'But neither is it improbable, it is perhaps even more likely, that all of the Psalms are by David, as Saint Augustine maintains in Book 17 of The City of God, Chapter 14'. Preface I §5 (line 47) also calls the Davidic opinion 'more probable'. In the bound locus 'Psalm 89:1-7, lines 3209-3226', Bellarmine's own exposition of Ps 89 names the psalmist as David: 'David is not alone in denouncing such folly' (v. 6, line 3223); compare v. 8, line 3227. The record omits §5 and the exposition. It files Bellarmine 'For Moses' and says that his judgment 'stands against' Enarr. 89.2. In 4.7 it calls his position a 'probable judgment for the title'. In fact both prefaces make the Davidic view his probable judgment, and that is the view he credits to Augustine. He admits Moses only as 'not unlikely' or 'acceptable'. He and Augustine therefore differ only on whether Mosaic authorship is admissible. The iteration-0 required result of RES-001 itself prescribed the 'for Moses ... Augustine against' framing. The 7.4 parenthesis does keep the 'more probable' preference, and no reading rests on Ps 89's unsung title (4.7). The study (sections/10-each-element.tex, 80-date-location.tex) states the narrow difference correctly, as does the concise page-2 row ('the unsung title of Ps 89 names Moses'), so no reader is misled. The defect is the record misplacing a Doctor's preferred opinion, which is how STU-002 entered the first study draft."
required_result = "On the research record's next revision, add Preface II §5 (line 63) and the Davidic reading of the Ps 89 exposition (v. 6, line 3223) to the 3.5 entry. In 3.5, 4.7 and 7.4, describe Bellarmine as admitting Mosaic authorship as tenable while preferring David's, with Augustine. That puts him with Augustine except on whether Moses is admissible. Restate 7.4's 'what the studies may say' to match."

[[advisories]]
