note = "Still stands from iterations 1 and 2. The speech quotes the 1861 Cummiskey English of the Introit ('All things, O Lord, are in thy power: and no one can resist thy will') and of the Communion ('when wilt thou judge those who persecute me?'). No tracked record carries them: the registered temporal-orations-en rows for post-pentecosten-21 (lines 173-175) cover only the Collect, Secret and Postcommunion, and the scan and OCR artifacts are remote with no retained payload. This review read both on pp. 459 and 461 (printed pp. 450 and 452) of a local copy of the registered scan whose SHA-256 matched 85034c90..., and found them exactly as quoted. A passage record, like the pentecost-19 and pentecost-20 checked-English artifacts, would let later stages verify them without the scan."

