[[advisories]]
stage = "study-review"
id = "STU-005"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/61-twenty-first-after-pentecost/sections/20-armour-under-providence.tex:291-304 (third objection; proof p. 20), sections/40-last-exodus-of-the-church.tex:226-243 (second objection; p. 29) and sections/50-comparison.tex:68-92 ('Where they differ'; p. 31)"
problem = "Unchanged since iteration 2. The three files are byte-identical to the sealed bytes and were re-read for this review. Each passage names the same four witnesses on the Communion's plea in near-identical words. These are Hilary's present power and 'not the judgment of the resurrection', Augustine's martyrs and the Church's persecutors, Bellarmine's 'wicked who persecute and tempt', and Cassiodorus joining 'the devil with his ministers' to 'the judgment at the end of the world'. Each then says the Fathers differ 'in what is asked and in whom the plea names, not only in the time', and that the answers are compatible but not identical through Thomas's instruments moved by the devil. Every account is accurate. Read straight through, the reader meets the same comparison three times in twelve pages, which works against the profile's 'one fullest home'."
required_result = "Keep the full account of the four witnesses in 50-comparison.tex only. In each reading's objection, state that reading's own answer and the chief contrary one in a sentence or two, keeping the qualifications that make them true: what is asked and whom the plea names differ, not only the time, and the answers are compatible but not the same. Then point to the comparison. Do not reintroduce any claim that the witnesses agree on the persecutors or on the thing asked."

[[advisories]]
stage = "study-review"
id = "STU-013"
severity = "advisory"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/61-twenty-first-after-pentecost/sections/20-armour-under-providence.tex:291-298 ('Hilary asks for power in this life ... what the prophet now asks'; 'The Fathers differ', line 297; p. 20), sections/40-last-exodus-of-the-church.tex:236-243 ('The Fathers differ', lines 236-237; 'without making it the only one', line 243; p. 29) and sections/50-comparison.tex:68-69 ('it is a difference between Fathers, not only between readings'; p. 31)"
problem = "Unchanged since iteration 2; the files are byte-identical to the sealed bytes. There are three small slips. (1) 'The Fathers differ' (20, 40), and in the comparison 'a difference between Fathers', follow lists that include St Robert Bellarmine and Cassiodorus. Neither is a Father: author-standing-v1.toml records Bellarmine as 'doctor' and Cassiodorus as 'ecclesiastical-writer'. The comparison instance was not named at iteration 2 but is the same slip. (2) In 20 one sentence says both 'Hilary asks for power in this life' and 'what the prophet now asks'. In Hilary's text the prophet prays and Hilary expounds, so the reader cannot tell who is asking. (3) 40 ends with 'without making it the only one'. That clause tells the reader the study's own stance, a form the 1962 profile excludes ('Do not tell the reader ... that the guide has declined to press an inference'). None of the three misstates a witness's position."
required_result = "Say 'the witnesses differ' (or name them) in place of 'the Fathers differ' and 'a difference between Fathers' wherever Bellarmine or Cassiodorus is included. In 20, make the prophet the one who asks in Hilary's reading (for example 'In Hilary's reading the prophet asks for power in this life ... and what he now asks is not ...'). Delete 'without making it the only one'."

