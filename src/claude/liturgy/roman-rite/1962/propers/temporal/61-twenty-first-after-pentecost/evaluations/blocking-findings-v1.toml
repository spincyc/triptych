location = "research/interpretations.md 4.1, line 674 ('All three use Chrysostom; two use Augustine; Gregory and Aquinas serve readings 1 and 3'). Routed to this review as part of STU-012."
problem = "The same record makes Aquinas a contributing witness to reading 2: the 2.2 witness list and the carrying-author line (lines 356-357); the 2.3 inference; the 2.5 allegorical and anagogical senses; and 2.7. Section 4.4 also meets reading 2's most demanding feature, the reversed pardon, 'with Aquinas's distinction kept'. At the locus (Opera, Venice 1745, t. 3, tracked OCR lines 31278-31283), he says 'Hic videtur innuere quod peccata dimissa redeant, sicut vult Origenes ... Sed hoc non videtur, eo quod remissio efficaciam habet a sacramentis ... Dicuntur autem redire per ingratitudinem.' The 4.1 summary therefore contradicts the record's own sections: Aquinas serves all three readings. The study's comparison repeated 4.1 and was corrected under STU-003, and sections/50-comparison.tex now states it correctly, so no reader is misled."
