[[advisories]]
stage = "homily-review"
id = "HOM-006"
severity = "advisory"
location = "sections/homily/10-homily.tex lines 43-45 ('Who is that servant? St~Augustine answers that every one of us is both men in this story at once. We owe God a debt we cannot pay. And somewhere there is someone who owes us.')"
problem = "Unchanged since iteration 1: the file is byte-identical to the sealed bytes, and I re-read the passage and its locus for this review. The attributed sentence says that each of us is 'both men in this story', which a listener hears as both the forgiven servant and the fellow servant. The two glossing sentences describe only the forgiven servant's double position, a debtor to God who has a debtor of his own. That is the rule Sermon 83.2 states ('every man is at once God's debtor, and hath also some brother a debtor to himself', NPNF1-6 lines 34993-34995). Augustine's other clause, that every man is also 'bounden to his brother by some sin' (lines 34998-34999), is what would make him both men, and the speech does not say it. The listener therefore cannot tell which two men are meant."
required_result = "Make the attributed sentence say what the gloss says and what Augustine says, for example that every one of us stands where that servant stands, at once a debtor to God and the creditor of some brother. Alternatively, keep 'both men' and add Augustine's other clause, that every man is also bound to his brother by some sin, so that the listener hears both roles."

[[advisories]]
stage = "homily-review"
id = "HOM-007"
severity = "advisory"
location = "sections/homily/10-homily.tex line 64 ('He goes ``straightway'', Chrysostom notices') against line 101 ('Explaining this passage, St~John Chrysostom says something startling')"
problem = "Unchanged since iteration 1; the file is byte-identical to the sealed bytes. Chrysostom is first named by his bare surname, in a parenthetical clause, and is quoted twice more under that name (lines 71 and 85). The full form 'St John Chrysostom' first appears at the fourth mention, where it sounds like an introduction. The listener therefore meets an unexplained name first and a belated introduction later. Augustine and Aquinas are both introduced in full at first mention."
required_result = "Give the full name, 'St John Chrysostom', at line 64, and use the short form at line 101 and afterwards."

[[advisories]]
stage = "homily-review"
id = "HOM-008"
severity = "advisory"
location = "sections/homily/10-homily.tex lines 40-41 ('And the servant asks only for time. He is given the whole debt.')"
problem = "Unchanged since iteration 2, when it was first raised; the file is byte-identical to the sealed bytes. In current English, to be 'given' a debt means to be made to owe it. The intended sense is that the whole debt is remitted, and that needs 'forgiven'. The obsolete sense of 'give' as 'remit' is not available to a modern assembly. The sentence announces the parable's first gift in a homily whose subject is a debt that is forgiven and then 'comes back'. Its literal sense is the opposite of the intended one, at the place where the contrast with 'asks only for time' should be clearest. The witness the speech follows here says it plainly: 'He gave more than he asked, remission and forgiveness of the entire debt' (Chrysostom, Hom. 61.3, NPNF1-10 lines 34993-34995, re-located for this review). Most listeners will recover the sense from the contrast, and the next movement opens 'the king forgives with a word', so this is advisory only."
required_result = "Say 'He is forgiven the whole debt', or 'He is given the remission of the whole debt', keeping the contrast with 'asks only for time'. No other change is needed."

[[advisories]]
