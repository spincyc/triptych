authors = ["Hilary of Poitiers", "Thomas Aquinas", "Bede", "Augustine of Hippo", "Robert Bellarmine", "Jerome", "John Chrysostom", "Cyril of Alexandria", "Cassiodorus", "Theodoret of Cyrus", "Victorinus of Pettau", "Alfredo Ildefonso Schuster", "Pius XI"]
