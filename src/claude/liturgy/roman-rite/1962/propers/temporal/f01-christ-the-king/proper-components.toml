# --- Interpretive readings of the whole formulary ------------------------------
#
# `authors` names every author a reading draws on; `carrying_authors` names the
# ones who carry it, each a Father, a canonized saint or one of the Blessed in
# src/sources/inventories/author-standing-v1.toml, at least one a Father or a
# canonized saint (guidance/liturgy/propers-three-documents.md, "Liturgical
# commentators"). Cassiodorus and Theodoret of Cyrus stand there as
# ecclesiastical writers, and Cyril of Alexandria, Cyril of Jerusalem,
# Hippolytus (the Daniel scholia transmitted under his name) and Victorinus of
# Pettau have no standing row: each supports claims his checked locus makes and
# carries no reading. Blessed Ildefonso Schuster is the one witness read to
# this Mass as a Mass; he is cited element by element and carries none of the
# three readings here. Pius XI's Quas primas is the instituting act, cited by
# number for the second reading's difficulty. The evidence map for every lane
# is research/interpretations.md, sections 2-4.

