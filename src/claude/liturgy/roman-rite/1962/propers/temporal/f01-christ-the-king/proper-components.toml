# The eleven elements said in the Mass of 25 October 2026, in liturgical
# order, the proper Preface (printed p. 291, no. 1080) among them. The Missal
# also prints, at nos. 3943-3944, a Tract for votive Masses after Septuagesima
# and an Alleluia for Paschaltide. The feast is kept on the last Sunday of
# October, which falls in neither season, so neither is ever said on the feast
# and neither is an element of this Mass: the study sets both out under their
# rubrics as printed text for other days (sections/05-appointed-texts.tex) and
# gives them no proper anchor. The chronology projection, which reads the
# shared calendar entry, still carries the Tract's two rows; the study's
# Scriptural Date and Location appendix and the concise page 2 print them
# with the rubric's label (research/scope.md section 8.2).
element_keys = ["introit", "collect", "epistle", "gradual", "alleluia", "gospel", "offertory", "secret", "preface", "communion", "postcommunion"]

[outputs]
research = "liturgy/roman-rite/1962/propers/temporal/f01-christ-the-king"
synthesis = "liturgy/roman-rite/1962/propers/temporal/f01-christ-the-king-synthesis"
