note = "Still present. The page-2 instructions rest on tools/check-content-preflight (_orientation_tables), which the engine does not seal: only the chronology computation inputs are sealed. A change to that gate would not stale this research. This is a seal-coverage gap in the tooling, not a leaf defect."

[[observations]]
stage = "research-review"
location = "tools/tpt commentary-work-index discover (holdings line)"
note = "Iteration 1 observed this for Hugh of Saint-Cher, and it now recurs. discover reports Cornelius a Lapide as 'held' for Jn 18, Dan 7, Apoc 1 and 5 and Col 1, through title and identity joins to the Pauline (to Galatians) and Pentateuch records. It reports Athanasius as 'held' for Ps 2 and Ps 28 through a whole-volume OCR whose record forbids quotation. The holdings line does not say whether a held artifact reaches the passage or can be used, so every research stage must re-derive this by hand (RES-010, RES-012). This is a missing criterion in the tool, not a fact about this leaf."

[[observations]]
stage = "research-review"
location = "research/chronology-annotations.tex, rows row-6c43dd5e0531017f and row-7fbe70097919820b (Passage cell)"
note = "Still present, as observed at iterations 0 and 1. The generator labels the composite Introit's psalm 'Ps 71:1' but the single-citation elements 'Psalms 71:8,11' and 'Psalms 2:8' in the same cell. This is a presentation inconsistency in tools/tpt proper-chronology annotations."

[[observations]]
