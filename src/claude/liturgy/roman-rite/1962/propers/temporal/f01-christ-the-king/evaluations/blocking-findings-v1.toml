note = "Page 11 opens with the last paragraph of the commentary under the head 'Scope and References', the head of the appendix that begins lower on that page. This is the shared first-mark running-head behaviour, and it is left to the visual evaluation."

[[observations]]
stage = "synthesis-review"
location = "rendered concise study p. 2, Passage cells of row-6c43dd5e0531017f and row-7fbe70097919820b"
note = "The generator writes 'Ps 71:1 (Vulgate numbering ...)' for the Introit but 'Psalms 71:8,11', 'Psalms 2:8' and 'Psalms 28:10-11' for the other elements in the same cell. The Introit's '71:1' is the Missal's count, not the Clementine's, which numbers the title as verse 1 (sections/05-appointed-texts.tex l.62-64). This is a presentation inconsistency in tools/tpt proper-chronology annotations."

[[observations]]
stage = "synthesis-review"
location = "sections/concise/04-themes.tex l.105-112 (p. 4), carried from sections/10-each-element.tex l.271-280 and sections/00-opening.tex l.48"
note = "Both studies render the Preface's central sentence clause by clause in the editor's own English ('offering himself on the altar of the cross as a spotless and peace-making victim, he might accomplish the mysteries of man's redemption ...'). They quote the Lasance English, which propers/verified.md holds for the whole Preface, only for the goods. The study review accepted this form, and the concise inherits it. No gate tests where description of an oration ends and the guide's own translation begins, and the 1962 profile's English rule ('never composed, translated, adapted, or paraphrased by the guide') reaches that line. That boundary looks like a missing criterion rather than a defect of this leaf."

[[observations]]
stage = "synthesis-review"
location = "tools/check-content-preflight, references-used check (synthesis edition)"
note = "The v12 check holds Bible-list loci and commentary divisions to citations in the body. It does not test a printed page range on a non-commentary entry (SYN-007's Lasance pp. 1257-1260 passes), and it does not test whether the listed loci exist in the witness's own versification. Locus hygiene for such entries is still left to the reviewer."

[[observations]]
stage = "visual-review"
location = "workflows/fragments/proper-study/visual-review.md (whole fragment) and the visual-review packet header"
note = "The fragment tells the reviewer to open the contact sheets and full-size rasters, but it names no destination for rasters the reviewer generates itself, although guidance/repository.md requires a dedicated stage-iteration raster directory. This review used the build-artifacts-0000 rasters, verified against the sealed PDF hashes, and wrote only crops to its own scratch directory."

[[observations]]
stage = "web-review"
location = "release/public-alpha/assets/site.css (shared `table { display: block; overflow-x: auto }` at the 760px query), as it renders the opening element map under sec:opening and the comparison table under sec:comparison"
note = "At 390 px the three-column map is 425 px wide in a 342 px measure, so its 'What it says' column (131 px, two or three words a line) is partly behind a horizontal scroll. The four-column comparison is 498 px wide, so the third reading's column is off-screen until scrolled. The published Claude Twenty-first Sunday edition measures the same, so this is shared site styling and not this conversion. The no-clip treatment decided for the dossier on 2026-09-23 does not reach the proper-study map or comparison tables, which may be a missing criterion for those tables."

[[observations]]
stage = "web-review"
