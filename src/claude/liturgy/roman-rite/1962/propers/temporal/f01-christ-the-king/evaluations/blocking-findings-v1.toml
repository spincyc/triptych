note = "The generated Passage labels mix 'Ps 71:1' with 'Psalms 71:8,11', 'Psalms 2:8' and 'Psalms 28:10–11', and set verse lists without a space after the comma. The study prose writes 'Ps 71:8, 11'. The same mix appears in the published Claude Twenty-first Sunday edition, so this is a cosmetic matter of the shared generator, not of this leaf."
