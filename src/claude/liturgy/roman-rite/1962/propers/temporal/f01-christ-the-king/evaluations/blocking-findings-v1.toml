[[accepted]]
stage = "study-review"
id = "STU-010"
severity = "accepted"
location = "research/interpretations.md section 5: table row 'Witness against it, kept' (l.621, Reading C cell); 'What they share' (l.623-628); 'Where their answers differ' (l.638-642)"
problem = "The research record's comparison still carries the wording that STU-002 found untrue of the readings as written. It says all three 'place the cross at the centre', with B 'as the place where the king testifies before Pilate'. It says Hilary contributes 'to A and C' only. It puts the third reading's internal differences in the column of witnesses against it. And it says 'The difference between A and B is real at Jn 18:37'. The study no longer follows any of this (50-comparison.tex l.37-70 and l.79-100), and research/production-review.md l.165-174 records the discrepancy. The record now disagrees with the study it supports."
required_result = "Whenever the research of this leaf is next reopened, rewrite research/interpretations.md section 5 so that it agrees with sections/50-comparison.tex: the cross per reading, Hilary in all three readings, the third reading's objection as the teaching that the reign ends, its internal differences under their own label, and the A/B difference at the Gospel with the Jn 18:37 split inside the second reading."
accepted_because = "No reader-facing text now repeats the record's wording, and the production record already names the discrepancy for the concise and homily authors. Correcting it would mean reopening the research seal and rerunning research review and every dependent stage, all to change a planning paragraph that the reviewed study has superseded."

