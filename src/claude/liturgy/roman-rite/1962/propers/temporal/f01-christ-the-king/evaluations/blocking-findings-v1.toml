note = "The Tract's row still prints the generated A.M. 3416 / B.C. 586-588 setting under the rubric's label. It lacks the Haydock qualification (Calmet's Babylonian proposal, Worthington's Davidic alternative), which research/scope.md section 8.4 does not record. This is the standing research advisory RES-014 and study advisory STU-007(c), left in this run by the driver's decision."

