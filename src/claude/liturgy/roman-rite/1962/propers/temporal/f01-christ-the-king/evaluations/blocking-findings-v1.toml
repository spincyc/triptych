note = "Still present. The entry's own notes say it 'carries no fixed date and a synthetic registry id' and that 'Nothing of its formulary has been read'. Both are stale against registry 'F01' and this run's collation, and research/scope.md section 10 reports only the file-header note."

[[observations]]
stage = "study-review"
location = "rendered study (own build, SHA-256 0af471dc...699f), physical pages 14, 23, 31 and 32"
note = "The first-mark running-head behaviour observed at iteration 0 persists at new page positions. Each of these pages carries the head of a section that begins lower on the page, while the page opens with the previous section's text: p. 14 opens with the element section's Communion under 'The Lamb Receives the Kingdom', and p. 31 opens with the date-location notes under 'Scope and References'. This is behaviour of the shared head and is left to the visual evaluation."

[[observations]]
stage = "study-review"
location = "workflows/pipelines/proper-study.json, routing of study-review findings that need a research-record change"
note = "Two defects in research records are known in this run and the study-review advisories cannot route them: STU-007 (c), which waits on RES-014, and STU-010. Once the research seal is set, the only reviser that receives ADVISORY_FINDINGS is author-study, which may not write research. So a research-owned defect too small to block has no route to an owner within the run. This looks like a missing route in the pipeline, not a fact about this leaf."

[[observations]]
