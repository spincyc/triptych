context = "Tracked HTML of book VII (hash recomputed and matched), read in locally parsed text; VII.176-194 (PL 15 cols. 1746-1752), the whole exposition of Lk 13:18-21, ending where chapter XIV opens at VII.195. Mustard seed (176-186): faith and the kingdom as the seed; its power poured out when crushed, faith pressed by adversity, the martyrs; the Lord the seed, sown and buried in the garden. Leaven (187-194): at 187 he notes that the parable has drawn many opinions and reports that many take the leaven for Christ, and on that reading the Church hides the Lord Jesus in the mind; at 188 it seemed fitting (congruere visum est), from Matthew's three measures, to believe the Son hidden in the Law, covered in the Prophets, fulfilled in the Gospel; at 189 he reports some who take it of the world. At 190-191 he states his own preference (Me tamen sequi iuvat): the leaven is the Church's spiritual doctrine (Mt 16:6; 1 Cor 5:8); the Church sanctifies the reborn man, body, soul and spirit, with spiritual leaven; the three measures are flesh, soul and spirit (1 Thess 5:23); the woman mixes in doctrine until the whole inner man is leavened. 192-194: the three made one leaven; at the resurrection an incorrupt communion of body, soul and spirit, and then we obtain all we ask, which many take Mt 18:19 to signify; readings of the two who agree; in the resurrection we shall be one (1 Jn 3:2). He cites Mt 13:32 (183) and Matthew's three measures (188, 191)."

