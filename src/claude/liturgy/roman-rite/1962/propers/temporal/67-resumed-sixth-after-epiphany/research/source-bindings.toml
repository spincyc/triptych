context = "In Lucae evangelium expositio IV on Lk 13:18-21, physical lines 1376-1384 of the registered remote wikitext, embedded Migne markers 0506C-0507D (PL 92). Fetched whole from its registered source_url by the research stage (iteration 2) on 2026-11-11 and matched (973,336 bytes, SHA-256 equal to the record); no bytes retained. The Lukan parallel of the Gospel. Jerome's, Augustine's and Ambrose's words in it are named as theirs in research/scope.md 5. Bede's own, as far as the Fathers read here and the library's tracked texts show: on the seed, growth in each believer by degrees and, as a further sense, the incarnation's humility buried by Joseph in the garden, risen and ascended, the preachers its branches; on the leaven, love (in Augustine's words) hidden in the three measures because the Church commands love of God with the whole heart, soul and strength; the meal ourselves, ground by fear and hope into one bread; the measures also the three yields of the married, continent and virgins; and charity hidden in the mind growing until it changes the whole mind, begun here and perfected where God is all in all. Rabanus, In Mt. IV (bindings 23-24), repeats the incarnation passage and the yields-and-donec passage word for word."

