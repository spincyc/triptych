source_fingerprint = "sha256:f7ef227833c6454f7bea588021ba7c000d14f6dc1220746e710f6f3d8a19f761"
context = "Tracked OCR of PL 213 (hash recomputed and matched), read by the research stage (iteration 2) to test whether the words quoted from Durandus VI.140 are his own. Sicard reads the Dicit Dominus chants as one sequence: Israel's remnant to be saved at the end, announced in the Introit (quoted Ego cogito ... de cunctis locis), answering in the Gradual Liberasti and the Offertory De profundis, assured of salvation in the Communion Amen dico vobis; his Mass's Gospel is the tribute money and its Epistle Phil 3. No Joseph, and neither of Durandus's quoted sentences. VIII.23 closes at the heading of VIII.24 (line 29976); on each of its lines the OCR also carries the right column, which is VIII.25. Read by the source-registration stage (iteration 2): VIII.24, a Sunday with the Gospel of the ruler's daughter, has no chants of its own, the preceding office fitting its Gospel; VIII.25, the Sunday with the lesson Ecce dies veniunt (Jer 23) and the Gospel of the five loaves, reads the same chants again with that lesson: the Introit's Reducam captivitatem vestram de cunctis locis answers the lesson's de cunctis terris, those freed from captivity give thanks in the Gradual Liberasti, pray in the Offertory De profundis and receive certification in the Communion Amen dico vobis. No Joseph there either. Uncorrected OCR with interleaved columns; liturgical commentary on the chants only, supporting."
