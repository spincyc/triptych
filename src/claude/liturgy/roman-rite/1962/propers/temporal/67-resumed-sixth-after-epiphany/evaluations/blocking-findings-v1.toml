note = "The study quotes Douay-Rheims English outside the bound loci in more places than the production record hands to the research owner. Mt 16:6 (10:151-152, 30:5-6) and Mt 17:19 (20:48-49) lie outside the Matthew binding's 13:1-35. 1 Thess 2:2 (10:60, 20:301-302) and 3:1-7 (10:67-70) lie outside 1:1-10. 1 Cor 2:4 (20:200-202) and 5:7 (10:152) come from a registered artifact (artifact.english-college-of-douay.douay-rheims-bible.challoner-gutenberg-1581.verse-text-53-1-corinthians-ffc4f260) that has no binding at all. Every quotation was checked word for word in the tracked verse texts and is exact, and the References list the loci, so nothing the reader sees is wrong. But production-review.md names only Mt 17:19, 1 Cor 2:4 and 5:7. The bindings-valid and references-used preflight checks do not test whether a quoted verse lies inside its binding's loci. This is the second round in which the gap has reached the run only as an observation, which suggests a missing mechanical check rather than a defect in the study."

