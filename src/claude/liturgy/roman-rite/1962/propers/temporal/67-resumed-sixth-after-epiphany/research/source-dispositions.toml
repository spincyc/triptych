locus = "Mitrale VIII.25, Dominica vicesima quinta post Pentecosten, physical lines 29998-30015 (left column) continued in the right column of lines 29951-29956 of the tracked PL 213 OCR"
relationship = "liturgical-commentary"
disposition = "deferred"
reason = "Read by the source-registration stage (iteration 2) in the tracked OCR, because the right column printed beside VIII.23 belongs to this chapter. On the Sunday whose Gospel is the five loaves and whose lesson is Ecce dies veniunt (Jer 23), Sicard says the preceding chant office concords with the lesson: as the lesson says the Lord led Israel out de cunctis terris, so the Introit sings Reducam captivitatem vestram de cunctis locis; those freed from captivity give thanks in the Gradual Liberasti, pray in the Offertory De profundis, and in the Communion Amen dico vobis receive certification of their petition. No Joseph; neither of Durandus's quoted sentences (a literal search of the whole layer finds liberalis est and ut reconciliem nowhere). VIII.24 (lines 29976-29997) gives the Sunday of the ruler's daughter no chants of its own, the preceding office fitting its Gospel; it expounds no chant. Only the chant verses he cites are recorded as extents; his lesson and Gospel are not this formulary's. The chapter runs on in the right column past the chants into his account of the year's histories, so its close is not fixed in this layer; uncorrected OCR, not collated with a page image; no passage record; no harvest alias group for the Mitrale."
missing_criteria = ["natural-excerpt-boundary", "page-image-collation", "passage-record", "harvest-alias-group"]
