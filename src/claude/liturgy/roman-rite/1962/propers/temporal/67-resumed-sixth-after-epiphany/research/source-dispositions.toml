locus = "Mitrale VIII.23, Dominica vicesima tertia post Pentecosten, physical lines 29951-29975 of the tracked PL 213 OCR (the left column under the chapter heading)"
relationship = "liturgical-commentary"
disposition = "deferred"
reason = "Read by research in iteration 2 in the tracked OCR and reread at registration: Sicard reads the four chants as the remnant of Israel, to be saved at the end, answering the promise of the Introit (Jer 29:11-12, 14, quoted Ego cogito ... de cunctis locis) in the Gradual Liberasti (Ps 43:8) and the Offertory De profundis (Ps 129:1), and assured of salvation in the Communion Amen dico vobis (Mk 11:24); his Mass's Gospel (the tribute money) and Epistle (Phil 3:21) are not this formulary's, and the extents are the chant verses he cites. The chapter closes in the left column at the heading of VIII.24 (line 29976), but every one of its physical lines also carries the right column, which is VIII.25 (row sicard-mitrale-viii-25-dicit-dominus-chants), so no line range of this layer holds the chapter alone; uncorrected OCR, not collated with a page image; no passage record; the harvest has no alias group for the Mitrale."
missing_criteria = ["natural-excerpt-boundary", "page-image-collation", "passage-record", "harvest-alias-group"]
scripture_extents = [{ token = "Jer", first_chapter = 29, first_verse = 11, last_chapter = 29, last_verse = 12 }, { token = "Jer", first_chapter = 29, first_verse = 14, last_chapter = 29, last_verse = 14 }, { token = "Ps", first_chapter = 43, first_verse = 8, last_chapter = 43, last_verse = 8 }, { token = "Ps", first_chapter = 129, first_verse = 1, last_chapter = 129, last_verse = 1 }, { token = "Mark", first_chapter = 11, first_verse = 24, last_chapter = 11, last_verse = 24 }]

