id = "bede-in-lucam-iv-13-18-21"
binding_index = 47
binding_sha256 = "a6f1cfe1a685e23326b858bb02d21fd7f7b24fa4e71f90d542ff5b01f7b97179"
source_id = "artifact.bede.in-lucae-evangelium-expositio.latin-migne-corpus-corporum-web-2026-07-25.wikisource-in-lucam-116db0ca"
source_fingerprint = "sha256:a8214a57556d9412ed34e019cedb24cfaeaa8a7160276453c7b23875c0214805"
locus = "In Lucae evangelium expositio IV on Lk 13:18-21, PL 92 cols. 506C-507D (embedded Migne markers), physical lines 1376-1384 of the registered remote wikitext"
relationship = "analogue"
disposition = "deferred"
reason = "Read by research in iteration 2 in the remote wikitext, fetched whole from its registered source_url on 2026-11-11 and matched (973,336 bytes). Lines 1376-1382 expound Lk 13:18-19 and line 1384 Lk 13:20-21; the next line opens the lemma of 13:23, so the two natural units are fixed. Bede's exposition carries Jerome's words (the kingdom as the preaching of the gospel and knowledge of the Scriptures, the branches as diversities of doctrine, the satum), Augustine's (the seed's fervour and power against poison, the leaven as love that heats and rouses, the three yields) and a phrase of Ambrose (cujus farina nos sumus), beside what the research found in none of them: growth in each believer by degrees; the incarnation's humility buried in the garden, risen and ascended; the Church commanding love of the whole person; the meal ground by fear and hope into one bread; the yields as married, continent and virgins; and charity growing until it changes the whole mind, perfected where God is all in all. Rabanus, In Mt. IV (bindings 23-24), repeats the last passages word for word. The Scripture expounded is Luke's parallel of the Gospel, which is the extent recorded. Not admitted: the text read is a remote layer (indexable = false), so a passage needs a tracked, indexable controller; the transcription was not collated with a page image, none being reachable for PL 92 at these columns; the inherited words of Jerome, Augustine and Ambrose must be attributed in any fragment; no passage record exists for Lc.13.18 or Lc.13.20."
missing_criteria = ["tracked-text-controller", "page-image-collation", "quoted-text-attribution", "passage-record"]
scripture_extents = [{ token = "Luke", first_chapter = 13, first_verse = 18, last_chapter = 13, last_verse = 21 }]

