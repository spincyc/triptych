# both changed bindings were reread in their tracked bytes, every row's pins
# were checked against binding-digests and the library's fingerprints, and the
# Ambrose row was divided at its two natural units, VII.176-186 on the mustard
# seed (Lk 13:18-19) and VII.187-194 on the leaven (Lk 13:20-21). Their missing
# criteria now name the work's locus grammar, which cannot express a section
# range, in place of page-image collation, which the Catena does not require of
# a Wikisource Latin transcription (Augustine's Quaestiones were admitted on one).
#
# Revised by the research stage (iteration 2) of the same run, answering the
# second research review. The two Rabanus rows (bindings 23-24) now say that
# the passages he marks Rab. are Bede's, In Lucam IV, word for word; Bede's
# exposition of Lk 13:18-21 has its own row (binding 47). The Jerome rows
# (bindings 20, 36) reach cols. 93 and 894; the Communion's Matthean parallel,
# Mt 21:20-22, has rows for Chrysostom (18), Jerome (20) and Hilary (22); and
# Sicard's Mitrale VIII.23 has a row (48). Every binding_sha256 was recomputed
# with scripts/_proper_study.py binding-digests.
#
# Reconciled by the source-registration stage (iteration 2) of the same run:
# the receipts research named were re-hashed and matched, the new and changed
# loci were reread, and every row's pins were checked against binding-digests
# and the library's fingerprints. Binding 48 now also names Mitrale VIII.24-25,
# because the OCR's right column beside VIII.23 is VIII.25, which reads the same
# chants; VIII.25 has its own row, and the VIII.23 row's extents now skip
# Jer 29:13, which the Introit does not carry.
#
# admitted        the verified passage named has a canonical Scripture edge in
#                 src/sources/commentary/fragment-loci.yaml
# deferred        read and used here, but not yet an admissible Catena fragment;
#                 missing_criteria says what is still needed
# not-commentary  liturgical text, Bible text, translation control, a locating
#                 aid, a calendar witness, a reference article or a rubrical
#                 statement; no fragment claim is made
#
# Scripture extents are the source's own reach in canonical Vulgate numbering,
# never the appointment that led this study to it: the parallels in Ambrose,
# Chrysologus and Bede are anchored to Luke and Mark, and Chrysostom's Homily
# 47.2 to Mt 13:44-46.
#
# Missing criteria used below:
#   passage-record            no passage record holds the excerpt
#   natural-excerpt-boundary  the excerpt's natural extent is not fixed
#   page-image-collation      read on OCR or a transcription, not collated with
#                             a page image
#   verified-transcription    read on page images, but no checked transcription
#                             exists to carry the wording
#   retained-page-image       the page read is in a remote scan only; no page
#                             of it is retained in the library
#   original-language-text    read in translation; the original was not read
#                             or is not held
#   unabridged-text           the translation read is expressly abridged
#   edition-translator-credit the edition record names no translator, so the
#                             Catena refuses a translation fragment from it
#   work-locus-grammar        the work record's locus_pattern cannot express
#                             the locus read
#   tracked-text-controller   the text read is a remote layer; a passage text
#                             needs a tracked, indexable controller
#   publishable-controller    the only held witness of the wording is
#                             restricted or of unresolved rights, so it cannot
