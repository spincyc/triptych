[[observations]]
stage = "study-review"
location = "sections/30-flight-without-turning-back.tex l.225-234; sections/20-where-the-body-is.tex l.254-260; sections/40-words-that-do-not-pass.tex l.257-263"
note = "Consequential-difficulty test, with each author's inference checked at its cited locus. Section 30: Hilary's claim that the housetop precept, taken literally, 'rationem dicti factique non recipit' (In Matth. 25.5, PL 9) and Chrysostom's reading of it as the Roman war (Hom. in Mt. 76.1-2) are both reported as they stand. The prose teaches the question of method and does not settle it. Section 20: Jerome In Hier. on Jer 29 (PL 24), 'Secundum anagogen ...', is now given as he gives it. Augustine is credited only with the captivity of Ps 84, and the step to the antiphon is marked as the interpretation's choice. Section 40: Chrysostom 77.1 ('of the believers'), Jerome on 24:34 ('genus hominum ... Judaeorum') and Bede on Mk 13:30 ('aut omne hominum significat genus, aut specialiter Judaeorum') match the answers given. All three pass."

[[observations]]
stage = "study-review"
location = "sections/30-flight-without-turning-back.tex l.172-174"
note = "At iteration 1 this sentence read 'are read together as the same kind of safety'. The iteration-2 rewrite states the link between the roof and the darts in the study's own voice and moves nothing into Jerome's or Aquinas's mouth. Jerome's roof as the place 'quo non possint ignita diaboli jacula pervenire' is confirmed in PL 26, and Aquinas's 'vel in praesenti ... spiritualiter tamen nocere non possunt' is confirmed at Super Psalmo 43 n. 3."

