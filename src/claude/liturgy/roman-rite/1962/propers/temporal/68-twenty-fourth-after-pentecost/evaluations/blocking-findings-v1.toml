note = "Bede's house is given as 'either this world or the flesh', where the expansive study gives the flesh only. This follows STU-015 and the Bede source text ('Domus namque nostra, vel mundus hic, vel ipsa in qua degimus, nostra intelligenda est caro'). The departure is faithful to the source and recorded upstream, so it is not a new unsupported claim."

[[observations]]
stage = "synthesis-review"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/68-twenty-fourth-after-pentecost/sections/concise/10-commentary.tex:332-333"
note = "'Hilary stresses that created things can cease, Jerome and Bede that they will be changed; they differ in emphasis and not in doctrine' compresses the expansive study (sections/40-words-that-do-not-pass.tex:108-109) and research/scope.md:575-577 exactly. The PL 9 OCR of In Mt. 26.3 reads 'coelum videlicet et terram, non futura' and 'habeant id in se necessitatis ut non sint'. 'Can cease' is a softer gloss than Hilary's 'non futura', and the harmonizing verdict is the study's own judgment. It is inherited, not introduced here, and the study owner may want to revisit it."

[[observations]]
stage = "synthesis-review"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/68-twenty-fourth-after-pentecost/sections/concise/10-commentary.tex:96-98"
note = "'Jerome, Hilary, Augustine and Chrysostom agree that the body is Christ's and the eagles are the saints' is inherited from the research. Chrysostom's identification of the carcase is implicit, and his eagles include 'the multitude of the angels'. The concise quotes that phrase at 121-122, so the reader can see the difference."

[[observations]]
stage = "synthesis-review"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/68-twenty-fourth-after-pentecost/sections/concise/10-commentary.tex:81-82"
note = "'On Chrysostom's account the passage is a fulfilled history, read on this Sunday as proof ...' drops the expansive study's conditional, 'Chrysostom's reading would make the passage a fulfilled history' (sections/30-flight-without-turning-back.tex:229-231). 'On Chrysostom's account' still marks this as a consequence of his view and not his words, so it is not raised."

[[observations]]
stage = "synthesis-review"
location = "src/claude/liturgy/roman-rite/1962/propers/temporal/68-twenty-fourth-after-pentecost/sections/concise (study-review advisories STU-012..STU-016)"
note = "Confirmed in the concise: the eagles' feeding is not made Eucharistic (439-442); Fromage's credentials appear once (themes 133-134); no maxim closers were found; the Epistle division is Col 1:9-11 and 12-14; Aquinas reads the translation into the kingdom 'in two ways'."
