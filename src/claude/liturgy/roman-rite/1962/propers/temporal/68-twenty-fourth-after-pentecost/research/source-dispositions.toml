reason = "Read by research and reread here in the tracked OCR (hash recomputed and matched), and reread by research (iteration 1) against Sicard: the four chants as one sequence on Israel's remnant received as Joseph received his brothers, citing the Introit's cogitationes pacis (Jer 29:11), Liberasti (Ps 43:8), De profundis (Ps 129:1) and Amen dico vobis, quidquid orantes petitis (Mk 11:24). In his own words: Soluti ergo illi, qui nunc tenentur, captivitate animarum, clamabunt alta devotione gratiarum actionem, quam sequens innuit graduale; the Offertory's supplication is what the brothers will say to the great Joseph, Obsecramus ut obliviscaris sceleris fratrum (Gen 50:17); the Communion is Joseph's answer, Nolite timere ... Deus vertit illud in bonum (Gen 50:19-21). Sicard VIII.25 later rewords his Gradual sentence and reads the Communion otherwise; Durandus VI.142 reproduces Sicard, not Rupert. XII.24 (line 23779) is on the summer night lessons. The OCR interleaves the columns and the chapter's close is not fixed; not collated with a page image; no passage record; the harvest has no alias group for De divinis officiis. The extents are the chant verses he cites."
