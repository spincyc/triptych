# (proper-study-source-dispositions-v1). One or more rows per binding in
# research/source-bindings.toml, pinned to that binding's digest and to its
# source's reviewed fingerprint. Written by the source-registration stage
# (iteration 0) of proper-study run 11c5af05fe374203 on 2026-11-16, for the 44
# bindings left after this stage recorded the Bede binding's (24) lines in its
# context, corrected the Sicard binding's (34) line range, and bound the four Catholic Encyclopedia
# article texts research read for the chronology (40-43) and the Augustinus.it
# chronology table this stage read to date the passages it admitted (44). Every
# research receipt was re-hashed against its registered record and matched
# before its row was written; each locus whose bytes are tracked or held in the
# run's scratch area was reread here; binding_sha256 values come from
# scripts/_proper_study.py binding-digests.
#
# Revised by the research stage (iteration 1) of the same run on 2026-11-16,
# answering the research review: two rows were added for Sicard's Mitrale
# VIII.23 and VIII.25 on the Sicard binding (34); the Durandus VI.142 row now
# attributes his words on the chants to Sicard VIII.25, which he reproduces;
# the Rupert row names only what Rupert writes; the Maas row (41) records the
# Gospel's new narrated-event row; and a row was added for the printed Maas page
# compared in an Internet Archive page image (45). The changed bindings' digests
# were recomputed with scripts/_proper_study.py binding-digests.
#
# Reconciled by the source-registration stage (iteration 2) of the same run on
# 2026-11-16: research's changed rows and loci were reread in the tracked bytes
# (Sicard VIII.23-25, Durandus VI.142, Rupert XII.23, Maas lines 131-134, all
# hashes recomputed and matched), and the printed Maas page (45) was read in the
# complete registered facsimile, acquired and matched to its SHA-256; binding 45
# and its row record that check and carry the recomputed digest.
#
# This stage admitted nine Augustine fragments: Quaestiones Evangeliorum I.37,
# I.38, I.39 and I.42 (Mt 24:20, 23-27, 32, 28) and Enarrationes in Psalmos
# 84.3, 84.4, 84.5 (Ps 84:2, 2, 3-4) and 43.8, 43.9 (Ps 43:8, 9), each a
# verified passage of its bound tracked Latin witness with its canonical edge
# in src/sources/commentary/fragment-loci.yaml.
#
# admitted        the verified passage named has a canonical Scripture edge in
#                 src/sources/commentary/fragment-loci.yaml
# deferred        read and used here, but not yet an admissible Catena fragment;
#                 missing_criteria says what is still needed
# not-commentary  liturgical text, Bible text, translation control, a locating
#                 aid, a calendar witness, a reference article or a chronology
#                 table; no fragment claim is made
#
# Scripture extents are the source's own reach in canonical Vulgate numbering,
# never the appointment that led this study to it: Gregory's homily is anchored
# to Luke 21, Bede's to Mark 11 and 13, Sicard and Durandus VI.141 to the
# Scripture of their own Sunday, and the liturgical commentators on the chants
# to the chant verses they cite.
#
# Missing criteria used below:
#   passage-record            no passage record holds the excerpt
#   natural-excerpt-boundary  the excerpt's natural extent is not fixed
#   page-image-collation      read on OCR or a transcription, not collated with
#                             a page image
#   verified-transcription    read on page images, but no checked transcription
#                             exists to carry the wording
#   retained-page-image       the page read is in a remote scan only; no page
#                             of it is retained in the library
#   original-language-text    read in translation; the original was not read
#                             or is not held
#   unabridged-text           the translation read is expressly abridged
#   edition-translator-credit the edition record names no translator, so the
#                             Catena refuses a translation fragment from it
#   work-locus-grammar        the work record's locus_pattern cannot express
#                             the locus read
#   work-record               the work read has no work record of its own; it
#                             is held only inside another work's artifact
#   publishable-controller    the only held witness of the wording is
#                             restricted or of unresolved rights, so it cannot
#                             control a published fragment (Catena Rule 9)
#   harvest-alias-group       work-aliases.yaml has no harvest group for the
#                             work, so a Catena row could not name a work_alias
#   quoted-text-attribution   the block carries, or may carry, another author's
#                             words beside the author's own; a fragment must
#                             bound and credit them

