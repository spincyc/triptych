reason = "Read by research (iteration 1) in the tracked OCR (hash recomputed and matched). His Mass shares this formulary's Introit Dicit Dominus (Jer 29:11-12, 14, quoted to reducam captivitatem vestram de cunctis locis), Gradual Liberasti (Ps 43:8), Offertory De profundis (Ps 129:1) and Communion Amen dico vobis (Mk 11:24); it differs in the tribute Gospel (si liceat censum dari Caesari, Mt 22:17) and the Epistle he quotes, Corpus humilitatis nostrae configurabit corpori claritatis suae (Phil 3:21). The people under affliction figure Antichrist's time; because Israel's remnant will then be saved, the Lord announces it in the Introit, they answer in the Gradual and Offertory, and the Lord in the Communion again assures them of salvation (Quos denuo Dominus in communione certificat de salute). The chapter fills lines 29951-29975 of the left column only; the right column of those lines carries VIII.25, so no line range holds the chapter alone. Uncorrected OCR, not collated with a page image; no passage record; no harvest alias group for the Mitrale. The extents are the Scripture he expounds and the chant verses he cites, not this formulary's lessons."
