relationship = "liturgical-commentary"
disposition = "deferred"
reason = "Read by research (iteration 1) in the tracked OCR (hash recomputed and matched). His Mass shares this formulary's Introit (reducam captivitatem vestram de cunctis locis, Jer 29:14), Gradual Liberasti (Ps 43:8), Offertory De profundis (Ps 129:1) and Communion Amen dico vobis (Mk 11:24); it differs in the lesson Ecce dies veniunt (Jer 23:5-8) and the Gospel of the five loaves (Jn 6). Huic quoque lectioni praecedens cantuale concordat officium: as the lesson says the Lord brought Israel de cunctis terris, the Introit sings de cunctis locis; Soluti ergo illi, qui nunc tenentur captivitate, give thanks in the Gradual, offer prayer in the Offertory, and in the Communion receive the assurance of their petition (suae petitionis ... recipiunt certificationem). In hac ultima Dominica the office is one quod ad utramque Domini pertinere possit adventum, with Jer 23:5-6 read of the first and second comings; five Sundays then run to Christmas. The Gradual clause rewords Rupert XII.23 (Soluti ergo illi, qui nunc tenentur, captivitate animarum ... gratiarum actionem), so that sentence must be bounded with Rupert's; the Communion as the assurance of their petition is not Rupert's reading, which makes it Joseph's answer. The chapter runs from the left column into the right column of the preceding lines; after mentio continetur (line 29980) the right column turns to a general note on the night lessons and the months, which touches no element of this formulary. Uncorrected OCR, not collated with a page image; no passage record; no harvest alias group. Durandus VI.142 reproduces this chapter."
