disposition = "deferred"
reason = "Reread here, and by research (iteration 1) against Sicard: the chants agree with the lesson's return de cunctis terris (Jer 23): the Introit's reducam captivitatem vestram de cunctis locis (Jer 29:14), the freed giving thanks in the Gradual Liberasti (Ps 43:8), still praying in the Offertory De profundis (Ps 129:1) and receiving sanctification in the Communion Amen dico (Mk 11:24); then the last Sunday's office for both comings and the five Sundays to Christmas. All of this reproduces Sicard, Mitrale VIII.25, almost word for word (Durandus's sanctificationem where Sicard reads certificationem), as VI.141 repeats VIII.24; the words are Sicard's and are cited as Sicard's (row sicard-mitrale-viii-25-dicit-dominus-chants). The Gospel clause on the refreshment Joseph gave his brothers is not in VIII.25; it is the figure Rupert XII.23 gives, and Durandus's immediate source for it is not established here. The extents are the chant verses he cites, not his Mass's lesson and Gospel (Jer 23, Jn 6). Uncorrected OCR, not collated with a page image; no passage record; no harvest alias group."
