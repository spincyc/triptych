context = "Uncorrected OCR, re-hashed and matched. Rupert reads the four Dicit Dominus chants (with Jer 23 and Jn 6) as Israel's remnant reconciled, prefigured in Joseph: the freed give thanks in the Gradual; the Offertory is the brothers' plea to Joseph (Gen 50:17); the Communion is Joseph's answer (Gen 50:19-21). Sicard VIII.25 later rewords his Gradual sentence and reads the Communion otherwise. His book has no chapter for a twenty-fourth Sunday."

