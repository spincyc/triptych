context = "Uncorrected OCR, re-hashed and matched. Three chapters. VIII.23 (tribute Gospel, Mt 22; Epistle Phil 3:21) reads this formulary's four Dicit Dominus chants of Israel's saved remnant: the Introit announces it, the Gradual Liberasti and Offertory De profundis answer, the Communion Amen dico vobis assures them of salvation (certificat de salute). VIII.24 shares only the Epistle (Col 1:9), with the Gospel of Mt 9:18-26 and no proper chants; its reasons for the borrowed chants are Sicard's. VIII.25 (lesson Jer 23, Gospel of the five loaves, Jn 6) reads the same chants with the lesson: the freed give thanks in the Gradual, pray in the Offertory, and in the Communion receive the assurance (certificationem) of their petition; the last Sunday's office belongs to both comings. Its Gradual clause rewords Rupert XII.23's sentence; its Communion reading is not Rupert's. Durandus VI.141 repeats VIII.24 and VI.142 reproduces VIII.25."

