context = "Uncorrected OCR, re-hashed and matched. VI.141 shares the Epistle and reports that some churches read Cum videritis abominationem (Mt 24) on that Sunday; his account of the borrowed chants repeats Sicard VIII.24. VI.142 reproduces Sicard VIII.25 almost word for word (the chants with Jer 23, the Communion's recipiunt sanctificationem for Sicard's certificationem, the office for both comings, the five Sundays to Christmas); its words on the chants are Sicard's and are cited as Sicard's. Its Gospel clause on the refreshment Joseph gave his brothers is not in VIII.25; it is the figure Rupert XII.23 gives (Joseph's banquet, signified by the five-loaves Gospel), and Durandus's immediate source for it is not established here."

