context = "The promulgated text, used to control the Missal's reprint and to supply RG 237-238, the Te Deum rule on which RGMR 431 a depends and which the Missal does not print. The segment also carries the Variationes; cap. II n. 13 (abolition of the Suffragium de omnibus Sanctis and the commemoratio de Cruce) and cap. IV n. 18 (abolition of the orationes pro diversitate Temporum), on printed pp. 708-709, are the only parts of the Variationes used and are outside the code's own numbering, so they are named here rather than in the loci. RG 237-239 and those two Variationes rubrics were read as 200 dpi page images; nn. 1-8, 269 and 525-530 were compared against the Missal's reprint in the optical text layer and agree. The Acta's Tabella occurrentiae, Tabella concurrentiae and Notanda were inspected only to establish that the Missal omits them. No word-for-word collation of the whole code across the two witnesses is claimed."
verified_on = "2026-07-26"
