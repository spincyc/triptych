context = "The controlling witness for every rule this publication cites as RG n or RGMR n and for every formulary direction it reports. Loci are artifact pages of the 1,088-page facsimile; the offset to the Missal's own printed folios is +2, established by reading the running heads on artifact pages 12-18 and 34 as images. Artifact pages 10-34 carry the code (Rubricae generales nn. 1-137 and Rubricae generales Missalis Romani nn. 269-530) and the Missal's own 'Hic omittuntur' in place of part two; the remaining loci are the Ritus servandus, the Feria IV post dominicam I Passionis Mass, Palm Sunday's proper last Gospel, the Ordo Missae, the sixteen prefaces, the resumed Sundays after Epiphany, St Francis Xavier, the Purification rubric 'habetur tamquam festum Domini', St Patrick, the Annunciation, St Francis of Paola, the Transfiguration, All Souls with its three Masses, the weekly votive Masses, and the final Index alphabeticus whose Festa Domini list includes the Lateran dedication. Every rule quoted in Latin in the publication was read as a 260 dpi page image; the balance was read in the artifact's optical text layer with the two-column layout preserved."
verified_on = "2026-07-27"
