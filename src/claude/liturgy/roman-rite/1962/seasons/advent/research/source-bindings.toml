# Source bindings for the Advent primer (1962 Roman Rite).
#
# Written by collation lane C1 on 2026-11-18. One binding per library record the
# primer relies on. `states` mirror each record's own evidence states;
# `claim_keys` name the rows of research/source-audit.md that rest on the record.
# Fingerprints were computed with the library's own source_fingerprint over the
# library as it stood on 2026-11-18; a later change to a bound record or its
# artifacts moves the fingerprint and must be re-reviewed.
#
# The AAS 52 records were re-collated on a microfilm facsimile of the issue on
# 2026-11-18 (see source-audit.md); the Holy See's digitisation is a
# re-typesetting of its optical recognition. Pins were refreshed at install on
# 2026-11-18, after the two cold reviews and the fix pass, which read the AAS 52,
# Trent and NPNF records as corrected that day; no quoted wording moved.

schema = 2
record_type = "bindings"
