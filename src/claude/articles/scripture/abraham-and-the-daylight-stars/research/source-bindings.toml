context = "Josephus's paraphrase of Genesis 15 at I.7.2 deletes the command to look, the counting, and every temporal marker in the chapter, which is one of the study's material negative results; I.8.2 carries his claim that Abram taught arithmetic and astronomy to the Egyptians. Both were read on 2026-07-26 in the University of Chicago transcription of Whiston's public-domain translation; no exact artifact was retained, so this binding claims catalog identity only. Loci follow Whiston's book-chapter-section numbering, as the edition record requires."

