context = "Philo on Genesis 15 is the study's earliest witness for two things: the reading of the bringing-out as an exit from body, senses, and self-sufficiency (chapter XVI), and the identification of Chaldean star-fatalism as what Abram was brought out of, attached to Genesis 15:7 rather than 15:5 (chapter XX). Chapters LI to LIII supply the allegorization of the setting sun as the setting of the human intellect, which is the study's explanation of the ancient silence about the hour. Loci are the chapter numbers of Yonge's translation, not the modern section numbering."

