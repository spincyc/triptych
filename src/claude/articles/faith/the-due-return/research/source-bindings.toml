context = "These loci govern the article's adopted analysis of justice, the annexed virtues, religion, its elicited acts, sacrifice, and gratitude: the definition of justice (58.1), religion unable to render the equal due (80.1, citing Ps 115:12), religion's relation to God with its elicited and commanded acts (81.1), its status as virtue (81.2), special virtue (81.4), moral rather than theological virtue commanded by the theological virtues (81.5), chief of the moral virtues (81.6), worship profiting the worshipper alone (81.7), devotion (82.1), prayer within providence (83.2), twofold adoration and the profession of prostration (84.2), sacrifice of the natural law with its positive determination (85.1) and its sign-structure (85.2), and the ranked causes of debt with the exceeding, limitless debt of gratitude (106.1, 106.6). The authoring agent checked the English Dominican translation at New Advent for every locus and the Corpus Thomisticum Latin for II-II.58.1, 80.1, 81.7, 82.1, 83.2, and 85.1, all on 2026-07-24 (see research/source-audit.md). The repository's registered Leonine edition record covers only ST I qq. 1-49, so this binding remains at the work level; no collation against a printed edition or registered artifact is claimed, and the publication-local check is the verification ceiling asserted here."

