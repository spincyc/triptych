context = "These loci supply the article's adopted architecture: providence as the plan of things ordered to an end, its universal extension, immediacy of design with mediated execution, contingency preserved through contingent causes, the divine motion of the created will without coercion, God working in every agent without displacing it, the antecedent and consequent will, the refusal to let God will the evil of fault, fate, presumption, and patience. The authoring agent read the public-domain English Dominican translation at New Advent and the Latin at Corpus Thomisticum on 2026-07-25, quoting both. The repository's Leonine edition record identifies a printed witness for the Prima pars, but no collation against it is claimed; this binding therefore remains at the work level with a publication-local verification ceiling."

