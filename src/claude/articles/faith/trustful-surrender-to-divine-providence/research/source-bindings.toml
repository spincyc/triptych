context = "The article quotes Henri Ramiere's editorial preface (three principles, the rules for classes of events, and the rejection of the Fenelon sacrifice) and the treatise's opening chapter on fidelity to the order of God and the duty of the present moment. Both were read on 2026-07-25 in the public-domain English translation of Ella McMahon from the eighth French edition (Benziger, 1887) at the Internet Archive item abandonmentorabs00caus; the 1921 Strickland translation from the tenth French edition (item divineprovidence00causuoft) was consulted for edition identity only. The article reports the modern attribution debate at the ceiling of a named scholarly witness and does not assert Caussade's authorship."

