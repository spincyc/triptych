context = "Books 8 and 9 supply the article's account of the signified will and the will of good pleasure, the three acts of the divine will regarding resistance, the distinction of resignation from indifference, the ball-of-wax image, the sentence governed by the supposition of an impossible thing, the sickbed rule for using remedies while the outcome is undeclared, and the treatment of conformity in the permission of another's sins. The authoring agent read the public-domain English translation of Henry Benedict Mackey, O.S.B., at the Christian Classics Ethereal Library on 2026-07-25 and quoted it verbatim at these chapters. No collation against the French Annecy edition was performed; the English translation is the witness, and the chapter divisions are those printed there."

