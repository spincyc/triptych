context = "The condemned propositions of Molinos (Coelestis Pastor, 1687; DS 2201-2268 with the graded censure at DS 2269) and of Fenelon (Cum alias ad apostolatus, 12 March 1699; DS 2351-2373 with the censure at DS 2374) govern the article's boundary section and its condemned-propositions table. The authoring agent read the Latin with both numberings at the patristica.net web presentation on 2026-07-25 and glossed the quoted propositions into English as labeled working glosses. The transcription does not identify the print edition transcribed, and no original printing of either act was collated; the conflicting dates for Coelestis Pastor in Denzinger (20 November 1687) and the 1913 Catholic Encyclopedia (2 November 1687) are recorded in the article rather than resolved."

