context = "The sermons Sur la soumission a la volonte de Dieu, Sur la confiance en Dieu, Sur la priere, and Sur les adversites are identified as the sources compiled into Part II, ch. IV of the English anthology, by correspondence between the English chapter heads and the printed theses of those sermons. The authoring agent read the public-domain OCR of the 1832 Oeuvres, vol. 5, at the Internet Archive item uvresdurpclauded05laco on 2026-07-25, together with volumes 1-4 and the 1684 Reflexions chretiennes searched by keyword. No sermon-by-sermon collation with the English was performed; the correspondence is the stated evidentiary ceiling."

