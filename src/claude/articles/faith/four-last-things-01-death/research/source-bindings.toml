context = "Book XIII of the City of God is the article's principal patristic source and supplies four distinct arguments: the analysis of the death of the soul, the death of the body, and the death of the whole man (13.2); the insistence that bodily death is good to no one while it is being endured, and that the wrenching apart of soul and body jars horridly on nature (13.6); the account of why the baptized still die, with the martyr's inversion 'Die, that thou sin not' and the refusal to call death good in itself (13.4-13.5, 13.7); and the aporia about the moment of death, with life as a race toward death (13.9-13.11). On 2026-07-26 the authoring agent read the whole of chapters 1 to 11 in this edition's tracked transcription of the 1871 printing, volume I (artifact pg45304-body-lf), at artifact lines 20744 to 21195, and every quotation in the article was copied from those lines. Passage records registered with this revision fix the bounds and the checked wording for 13.2 and 13.11. No collation against the Latin or against the later NPNF English was performed, and the article identifies the Dods translation wherever it quotes. This binding records the edition-level dependence without claiming to have replayed any central artifact fingerprint."

