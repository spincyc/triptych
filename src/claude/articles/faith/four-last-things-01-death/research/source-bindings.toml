role = "textual-control"
states = ["cataloged"]
context = "The article quotes point 3 (the Church affirms that a spiritual element survives and subsists after death, endowed with consciousness and will, so that the human self subsists, and uses the word soul for it), point 4 (that the Church's prayers, funeral rites, and religious acts for the dead are in their substance loci theologici), and point 5 (that the glorious manifestation of the Lord is distinct and deferred with respect to the situation of people immediately after death), together with the letter's caution against arbitrary imaginative representations. These are the article's evidence that the magisterium has bounded, without condemning by name, the proposal that the resurrection occurs for each person at death. The authoring agent fetched the Holy See English page and read the whole letter on 2026-07-26; the edition registered with this revision is that dated web state. The article classifies the letter as authoritative non-definitive teaching and says expressly that it recalls rather than defines."

