role = "direct-witness"
states = ["cataloged"]
context = "The article's treatment of the ars moriendi rests entirely on this tracked OCR text of Comper's 1917 edition, acquired and read on 2026-07-26. It quotes the prologue's address to laymen and its list of six chapters; chapter 1's commendation of death, including the Platonizing catalogue of death as 'a going out of prison ... a discharging of an heavy burden, that is the body ... paying of the debt of natural duty,' which supplies the article's title and its diagnosis of a drift away from the conciliar anthropology; chapter 2's five temptations, with the observation that men then rarely died of old age and that spiritual complacence besets the devout; chapter 3's seven interrogations attributed to Anselm; chapter 4's five acts of Christ on the cross; chapter 5's complaint about physicians, false comfort, and the Chancellor of Paris; the provision that the dying be exhorted 'by a priest, or for need by another'; and Comper's editorial note on authorship, transmission, and the block-books. The evidentiary limits are recorded in the article and in the artifact manifest: the bytes are uncorrected optical character recognition, the printed text is Comper's modernized spelling of Bodleian MS 423, and that text is itself an English translation of a lost anonymous Latin original. No manuscript and no Latin witness was consulted, so the article asserts nothing about the Latin wording. The tract's own attributions to Anselm, Scotus, Isidore, and an unnamed decretal are reported as the tract's claims and were not verified against those authors, another limit the article states. The article classifies the whole tradition as devotional literature of no doctrinal authority. The binding is recorded at the cataloged state and pins no source fingerprint: the shared library's fingerprint query was unavailable while unrelated in-flight records elsewhere in the tree failed validation. The artifact's exact SHA-256 and byte size are recorded in its own manifest and the payload is tracked, so the reading is reproducible from the repository."

