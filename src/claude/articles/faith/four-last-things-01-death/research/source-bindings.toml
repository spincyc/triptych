context = "These loci govern the article's adopted analysis of the composite, its dissolution, and the separated soul: that man is not a soul only (I.75.4) and that the human soul is incorruptible (I.75.6); that the separated soul understands in a changed mode and that to be separated from the body is not in accordance with its nature (I.89.1); that sin causes death only accidentally, by removing the obstacle of original justice, with the pillar-and-stone image and the reply explaining why the baptized still die (I-II.85.5 with ad 1); that man is naturally corruptible as regards his matter left to itself but not as regards his form, with the knife-and-rust comparison and the gift of original justice supplying the defect of nature (I-II.85.6); the compressed formula that death is both natural on account of a condition attaching to matter and penal on account of the loss of the divine favour (II-II.164.1 ad 1); and that in Christ's death the Godhead was separated neither from the flesh nor from the soul (III.50.2-3). The authoring agent read every locus in this registered English web state on 2026-07-26 and quoted from it verbatim. The article labels this material common or school theology at every appearance and never as defined doctrine. This binding remains at the edition level; no printed edition was collated and no artifact is retained, and the publication-local reading is the verification ceiling asserted here."

