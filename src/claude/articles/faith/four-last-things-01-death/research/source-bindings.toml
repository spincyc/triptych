context = "Every scriptural quotation in the article comes from this registered electronic state of the Challoner Douay-Rheims and no other English Bible was used. On 2026-07-26 the authoring agent read each locus directly in the edition's tracked per-book verse-text artifacts (Genesis, Job, Psalms, Ecclesiastes, Wisdom, Ecclesiasticus, Matthew, Luke, John, Romans, 1 Corinthians, 2 Corinthians, Philippians, 1 Thessalonians, 2 Timothy, Hebrews, James, Apocalypse) and copied the wording verbatim. Chapter and verse are Vulgate numbering throughout, which the article states and which matters at Psalms, Ecclesiasticus, and 1 Thessalonians. Each quoted verse was also checked against this edition's registered american-edition-divergences table and none of them diverges from the American 1899 reading, a negative result the article's appendix records. The loci carry the article's scriptural argument at every level: the name of the last things and its setting among works of mercy (Ecclus 7.37-40); the threat and the sentence (Gen 2.16-17, 3.17-19); God made not death and man created incorruptible (Wis 1.13, 2.23-24); sin and death entering together and the wages of sin (Rom 5.12, 6.23); the Old Testament's reticence and its late development (Job 14, Ps 6.6, Eccles 12.7, Wis 3.1-3); the intermediate-state texts (Luke 16.22-26, 23.43, 2 Cor 5.1-10, Phil 1.21-24, Apoc 6.9-11); the two tenses about death (2 Tim 1.10, Heb 2.14-15, 1 Cor 15.21-26); the judgment clause and its argument (Heb 9.27-28); and the apostolic warrant for the anointing of the sick (James 5.14-15). The publication-local reading of the tracked artifacts is the verification ceiling asserted here: no Greek or Hebrew witness was examined at any locus, and the article says so."

