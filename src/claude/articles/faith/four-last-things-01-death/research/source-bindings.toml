context = "The article quotes canon 1004 §§1-2 on the time and repetition of anointing, canon 1005 on administering the sacrament in a case of doubt whether the sick person is dead, and canons 921-922 on Viaticum and on not delaying it, urging that the sick be nourished while fully conscious. Canon 1005 carries the article's synthesis about law at a boundary that cannot be located. The authoring agent fetched the two Holy See English canon-range pages on 2026-07-26 and read the canons verbatim; the edition registered with this revision is that dated web state. The governing law is that of the Latin Church, in force since 27 November 1983, and the article states its as-of date, notes that the Latin text remains the law, and records that the Eastern code was not examined. The drafting history of canon 1005 was not examined, a limitation the article's synthesis block states as the finding that would defeat it."

