context = "The article quotes Trent's first canon on original sin (that Adam incurred, through the offence of that prevarication, the wrath and indignation of God, and consequently death, and that the entire Adam was changed in body and soul for the worse), the second canon's presupposition that bodily death was transmitted, the doctrine and four canons on extreme unction, and the chapter and canon on reserving the Eucharist and carrying it to the sick. The load-bearing locus is session XIV chapter III: 'this unction is to be applied to the sick, but to those especially who lie in such danger as to seem to be about to depart this life: whence also it is called the sacrament of the departing,' which the article uses to show that the restriction of the sacrament to the dying was custom rather than the council's teaching. On 2026-07-26 the authoring agent acquired the whole-volume OCR text of this printing from the Internet Archive item registered with this revision as a remote artifact, and read each locus in it. The promulgated text alone was read: the conciliar acts, schemata, and debates were not examined, which bounds the article's claim that canon 1 does not define the constitution of Adam's body."

