context = "The article cites this encyclopedia article for one bibliographic fact only: that among Denys the Carthusian's theological treatises is De quatuor novissimis, the title from which the fourfold enumeration of the last things takes its familiar shape. The authoring agent read the article on 2026-07-26 in New Advent's web transcription of the volume. The encyclopedia is a dated reference work and not a doctrinal authority; the article says so and makes no claim that Denys originated the enumeration. The printed page prints the title as 'De quatuor Novissimus', evidently for Novissimis, and the article records the discrepancy rather than silently correcting it. This is a lead-grade citation: no primary witness to Denys's treatise was examined."
