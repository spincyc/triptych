context = "The article quotes Augustine's definition of the three deaths ('The death, then, of the soul takes place when God forsakes it, as the death of the body when the soul forsakes it. Therefore the death of both---that is, of the whole man---occurs when the soul, forsaken by God, forsakes the body') from this passage, whose bounds and checked wording were registered with this revision from artifact lines 20776-20781 inside the chapter body at 20768-20812. The quotation is the article's warrant for treating death as a relational term throughout, and for the claim that Augustine can describe bodily death without reference to sin and then treat its penal character as a further question. The binding is recorded at the cataloged state and pins no source fingerprint: the shared library's fingerprint query was unavailable while unrelated in-flight records elsewhere in the tree failed validation, so the publication-local reading of the tracked artifact at the registered bounds is the verification ceiling asserted here."

