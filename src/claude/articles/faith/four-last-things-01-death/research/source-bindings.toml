context = "The article quotes, in Latin with labelled working glosses, the argument that the immortality of the soul cannot repair a denial of the bodily resurrection: that the soul is naturally united to the body and separated from it against its nature and per accidens, so that the soul stripped of the body is imperfect (anima ... separatur autem ab eo contra suam naturam, et per accidens; unde anima exuta a corpore, quamdiu est sine corpore, est imperfecta); the sentence anima mea non est ego with its context (anima autem cum sit pars corporis hominis, non est totus homo); and the premise that in the other life there are no meritorious works (in alia vita nulla sunt opera meritoria). The authoring agent read the passage on 2026-07-26 on the site page carrying chapters 11 to 16, which that site labels reportatio vulgata. The article states this transmission caveat wherever it quotes the passage and classifies the sentence as school theology whose fame exceeds its textual security. No printed edition was collated and no artifact is retained; the publication-local reading is the verification ceiling asserted here."

