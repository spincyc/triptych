context = "The article quotes four magisterial acts in Latin through this dated web presentation of the Latin Enchiridion: the Council of Vienne's definition that the rational or intellective soul is per se and essentially the form of the human body, with the note of heresy (DS 902); John XXII's declaration Ne super his of 3 December 1334 that the purified souls separated from their bodies see God and the divine essence face to face clearly, in so far as the state and condition of a separated soul allows (DS 990-991); Benedict XII's Benedictus Deus of 29 January 1336 defining that they see the divine essence with an intuitive and facial vision, no creature mediating, immediately after death and before the resumption of their bodies and the general judgment, and that those dying in actual mortal sin descend immediately to hell (DS 1000-1002); and the Fifth Lateran Council's Apostolici regiminis condemning the assertion that the intellective soul is mortal or one in all men and stating that it is immortal and individually multiplied (DS 1440-1441). The authoring agent fetched and read the page on 2026-07-26, one day after the date the registered edition records, and observed no material difference at these loci. The presentation does not name the printed edition it transcribes; it is used as a finding aid and a convenient Latin witness to acts that are themselves the article's cited authorities. No printed Denzinger was collated, and every English rendering of these loci in the article is a labelled working gloss except the central Benedictus Deus clause, which is quoted in the official English of CCC 1023. The publication-local reading is the verification ceiling asserted here."

