context = "The article quotes the Catechism for the anthropology (365, the union of soul and body forming a single nature, citing Vienne; 366, the soul created immediately by God and immortal), the progressive revelation of the resurrection (992), the definition of death and its natural and penal aspects (1005, 1006, 1007, 1008), the transformation of Christian death (1009-1011), the end of the earthly pilgrimage and the exclusion of reincarnation (1013), the encouragement to prepare for the hour of death with the litany's petition against sudden death (1014), the In Brief paragraphs (1016, 1018), the commendation of the dying with the Prayer of Commendation from the Order of Christian Funerals (1020), the particular judgment (1021-1022 with its footnoted authorities), the Benedictus Deus definition in official English (1023), and the anointing of the sick and viaticum (1517, 1520-1525, 1528-1529). It also uses the arrangement of Articles 11 and 12 as evidence that the Catechism files death under the resurrection of the body rather than under life everlasting. The authoring agent fetched the relevant Vatican archive content pages publication-locally on 2026-07-26 and extracted the quoted paragraphs verbatim; the registered edition is the 2026-07-23 dated web state and no material difference was observed at the cited loci. IntraText delivery artifacts, including lowercased sentence-initial articles and spaced hyphens for dashes, are recorded in the audit and do not affect any quoted wording. No central artifact fingerprint is claimed; the publication-local check is the verification ceiling asserted here."

