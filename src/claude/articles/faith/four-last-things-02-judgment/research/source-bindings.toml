context = "Registered by this publication. Read for the twofold pain of loss and sense, the conclusion that the least pain of purgatory surpasses the greatest pain of this life, the sermon attributed to Augustine on which the sed contra rests, and the corpus's own admission that the soul's suffering from bodily fire is at that point taken for granted. Articles 2 and 6 were read for the qualified sense in which the punishment is voluntary and for the question whether one is delivered sooner than another. These are used as examples of school opinion with its own hedges, never as defined doctrine."

