context = "These loci govern the article's Latin framework: the vision of the divine essence and its two arguments (I.12.1, with the Chrysostom objection and the comprehension reply); the exclusion of any created likeness (12.2); the impossibility of a bodily vision, with the Job reply and the judgment that Augustine speaks conditionally (12.3); the insufficiency of natural power (12.4); the light of glory as a supernatural disposition and a medium quo, not in quo (12.5 with all three replies); the degrees and their measure in charity, with the same object presented to all (12.6); non-comprehension (12.7); the limits of the blessed's knowledge (12.8); the body and happiness, with the increase in extent and not intensity (I-II.4.5-6); the fellowship of friends as concomitant and not essential (I-II.4.8, the article's stated strongest counterargument); the order of charity in heaven (II-II.26.13); and, from the Supplement, glorified motion (84.3), clarity as overflow (85.1), and the aurea/aureola distinction (96.1). The authoring agent read the English Dominican translation at New Advent for every locus on 2026-07-26 and the Corpus Thomisticum Latin for I.12.1, 2, 4, 5, 6, and 7. The Supplement is identified at every use as compiled after Aquinas's death from his commentary on the Sentences. Aquinas's own Augustinian citations at I.12.7 and I-II.4.8 were not checked at their loci and are reported as he gives them. This binding remains at the work level; no collation against a printed edition or registered artifact is claimed, and the publication-local check is the verification ceiling asserted here."

[[bindings]]
source_id = "edition.augustine.de-civitate-dei.dods-1871"
loci = ["22.15", "22.16", "22.17", "22.19", "22.20", "22.21", "22.29", "22.30"]
role = "direct-witness"
states = ["cataloged"]
context = "The article's principal patristic witness for the risen body, for the degrees of glory, and for the tentativeness of the tradition's own best authority. The authoring agent read the chapters on 2026-07-26 in this edition's tracked transcription artifact (pg45305-body-lf) at lines 20263-21600, locating the Book XXII chapter headings by scanning the artifact and reading chapter 29 complete at lines 21214-21426. Quoted: the age of the prime and the concession that follows it (22.15-16); that both sexes rise and that the Lord denied marriages and not women (22.17); the removal of blemishes and the restoration of what was lost (22.19-21); the disclaimer at 22.21 (rash to pronounce, no experience); at 22.29 the whole apparatus of the beatific-vision chapter, including 'I do not say what I see, but I say what I believe', the gloss on 'the face' of God, and the decisive concession that Scripture does not definitely pronounce; and at 22.30 the degrees of honour with the further gift of contentment and the finger-and-eye image. Chapter 22.30 already carries a registered passage record created by another publication; this article did not modify it and reads the chapter in the same artifact. No fingerprint replay is claimed; the publication-local reading is the ceiling asserted here."

[[bindings]]
source_id = "edition.gregory-palamas.triads.english-gendle-1983"
loci = ["III.i.29", "III.i.33", "III.i.34", "III.ii.5", "III.ii.8", "III.ii.9", "III.ii.10", "III.iii.9"]
role = "direct-witness"
states = ["cataloged"]
context = "The article states the Eastern essence-and-energies doctrine at full strength in Palamas's own words and quotes short clauses from these sections. The authoring agent read them on 2026-07-26 in an optical-character transcription of a scanned copy of the 1983 Paulist Press printing hosted at the Internet Archive, locating the printed section markers within the transcription. The Greek was not consulted; no printed copy was collated; the transcription contains visible uncorrected scanning errors elsewhere in the file. This is a copyrighted translation: only short clauses are quoted, always with attribution, and no bulk text is incorporated in the publication. A public-domain English witness for Palamas was sought and not found; two hosted PDFs of the same translation proved to be image-only scans and a portal hosting a different modern translation was blocked. Meyendorff's introduction to the same volume is separately relied on, at a secondary-witness ceiling, for the reception history of the councils of 1341, 1347, and 1351; the acts of those councils were not reached in any edition, and the article's judgment about formal contradiction is held at low confidence for that reason."

