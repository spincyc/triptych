loci = ["complete-text"]
role = "direct-witness"
states = ["cataloged"]
context = "The article's central definition. The authoring agent read the Latin of DS 1000-1002 on 2026-07-26 at the registered patristica.net presentation of the Latin Enchiridion symbolorum and quotes the doctrinal core verbatim, construing it phrase by phrase (secundum communem Dei ordinationem; etiam ante resumptionem suorum corporum et iudicium generale; post Domini Jesu Christi passionem et mortem; viderunt et vident divinam essentiam; visione intuitiva et etiam faciali; nulla mediante creatura in ratione obiecti visi se habente; sunt vere beatae et habent vitam et requiem aeternam), together with DS 1001 on the voiding of faith and hope and the uninterrupted continuance of the vision. DS 1002 is noted and left to the companion volumes. The official English of the central clause is taken from CCC 1023. No printed Denzinger edition was collated and the web presentation does not identify its printing; that is the publication-local verification ceiling."

[[bindings]]
source_id = "edition.john-xxii.ne-super-his.latin-denzinger"
loci = ["complete-text"]
role = "direct-witness"
states = ["cataloged"]
context = "Quoted in Latin at DS 990-991 for the clause Fatemur siquidem et credimus... in quantum status et condicio compatitur animae separatae, which the article treats as the immediate antecedent of the 1336 definition and reads with attention to the qualifying clause. Read 2026-07-26 at the registered patristica.net Latin presentation; same ceiling as above. The article makes no judgment about the person of John XXII and treats the document as a declaration and submission, not a definition."

