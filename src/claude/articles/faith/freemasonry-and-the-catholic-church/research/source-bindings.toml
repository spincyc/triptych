context = "The essay quotes this unattributed English translation for In eminenti's description of the lodges ('men of any Religion or sect', the oath 'upon the Holy Bible', 'an inviolable silence'), its stated grounds ('For if they were not doing evil they would not have so great a hatred of the light'; harm 'not only to the peace of the temporal state but also to the well-being of souls'; 'other just and reasonable motives known to Us'), the condemnation clause, the ipso facto excommunication with absolution reserved to the Roman Pontiff except at the hour of death, and the direction to proceed against transgressors 'as being most suspect of heresy'. The bounded negative claim that this delivery contains no allegation of devil-worship is a publication-local reading of the complete translation, recorded in research/source-audit.md. The witness is an unattributed translation on an editorially uncontrolled page (injected advertising text observed); the essay identifies it as such and rests no wording-critical claim on it beyond what is quoted. Publication-local check of the registered exact response is the ceiling asserted."

