context = "These loci govern the article's adopted analysis of the last end, beatitude, the vision of God, hope, and charity as friendship: the necessity of a last end (I-II.1.4) with desire under the aspect of good (1.6) and the formal agreement of all (1.7); no created good constituting happiness, with the universal-good and participation argument (2.8); beatitude as vision of the divine essence (3.8); the incapacity of natural powers with the nobility of assisted capacity (5.5 with ad 2); the natural desire and the blessed seeing God's essence (I.12.1), the light of glory (12.2), grace-union (12.4), and the deiform blessed (12.5, quoting 1 Jn 3:2); hope's object and its leaning on the divine help (II-II.17.1) with nothing less than God Himself as its proper hope (17.2); charity as the friendship of man for God founded on communicated beatitude (23.1 with the Jn 15:15 sed contra and the twofold-life reply), its primacy and form-giving role cited summarily (23.6, 23.8); its infusion as participation of the Holy Spirit (24.2 with the Rom 5:5 sed contra); and the inherited gratitude arrow (106.6 ad 2, quoted in Part II and re-read for this part). The authoring agent checked the English Dominican translation at New Advent for every locus and the Corpus Thomisticum Latin for I-II.1.4, 2.8, 3.8, 5.5, I.12.1-2, I.12.5, II-II.17.2, 23.1, and 24.2, all on 2026-07-25 (see research/source-audit.md). This binding remains at the work level; no collation against a printed edition or registered artifact is claimed, and the publication-local check is the verification ceiling asserted here."

