context = "These loci govern the article's adopted metaphysical and moral framework: the First Way with its limits and the per se / accidental series distinction, essence and existence, the creation of primary matter and the history of causes, creation as a relation in the creature, innermost presence, the one-sided real relation with its reply on divine lordship, the name signifying present existence, the non-necessity of God's willing things other than himself, divine love as creative of goodness with its scriptural warrant and Dionysian gloss, the Trinity boundary, participation, the non-demonstrability of a temporal beginning, conservation, primary and secondary causality, adoration, and the humility-magnanimity pairing. The authoring agent checked the English Dominican translation at New Advent for every locus, and the Corpus Thomisticum Latin for the Prima Pars loci quoted in Latin, on 2026-07-24 (first edition) and again on 2026-07-25, when the loci added in the deepened edition (I.13.7.reply-5, I.13.11, I.19.3, I.20.2 sed contra and reply 1, I.44.2, I.45.3, I.46.2 reply 7, I.105.5 with replies 1-2, II-II.84.1 corpus, II-II.129.1, II-II.161.2 reply 2, II-II.161.3) were read for the first time (see research/source-audit.md). The repository's registered Leonine edition record covers only ST I qq. 1-49, so this binding remains at the work level; no collation against a printed edition or registered artifact is claimed, and the publication-local check is the verification ceiling asserted here."

