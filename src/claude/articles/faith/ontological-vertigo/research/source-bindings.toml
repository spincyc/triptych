context = "These loci govern the article's adopted metaphysical and moral framework: the First Way with its limits, essence and existence, innermost presence, the one-sided real relation, divine love as creative of goodness, the Trinity boundary, participation, the non-demonstrability of a temporal beginning, conservation, adoration, and the humility-magnanimity pairing. The authoring agent checked the English Dominican translation at New Advent for every locus and the Corpus Thomisticum Latin for the eight Prima Pars loci quoted in Latin, all on 2026-07-24 (see research/source-audit.md). The repository's registered Leonine edition record covers only ST I qq. 1-49, so this binding remains at the work level; no collation against a printed edition or registered artifact is claimed, and the publication-local check is the verification ceiling asserted here."

