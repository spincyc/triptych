context = "Every pre-modern conciliar and papal act quoted in the article was read in Latin at this dated web transcription on 2026-07-25, each in its surrounding context: the Quicumque's closing verses; Orange II's anathema on predestination to evil; the nine canons against Origen, which this witness heads as published in the Synod of Constantinople in 543 and places under Vigilius rather than under Constantinople II; canon 11 of Constantinople II, which names Origen without specifying a proposition; Lateran IV's Firmiter; the Lyons II profession and its Florentine and Avignon recensions; Benedictus Deus, where the hell clause carries no word for eternity while the vision clause four lines earlier reads usque in sempiternum; Cantate Domino; Trent session 6 chapter 13 and canons 17 and 25; Trent session 14 canon 5 on attrition; and Paul V's 1607 formula ending the disputations de auxiliis. The article states in the body and in its references that this compilation is a finding aid to its underlying documents and not a substitute witness: no printed Denzinger, no conciliar critical edition, no Mansi volume, and no papal register was collated, and the delivery does not identify its printed exemplar. That is the verification ceiling asserted here."

