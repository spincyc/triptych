pdftitle = 'Chastity, Continence, Celibacy'
pdfsubject = 'A discursive canon-law article on the clerical discipline of the Catholic Churches: the three distinct obligations of chastity, continence, and celibacy; the Latin discipline of the 1983 Code (cc. 277, 1031, 1036-1037, 1042, 1078, 1087, 1394, 290-293); the Eastern common law of the 1990 Codex Canonum Ecclesiarum Orientalium (cc. 1-2, 180, 373-375, 758, 762, 804, 394-398) quoted from the Acta Apostolicae Sedis promulgation text; the twenty-four Churches sui iuris; the permanent diaconate; the historical development from Elvira to Trent; convert-clergy and ordinariate provisions; and the modern magisterial file from Presbyterorum ordinis to Querida Amazonia.'
kicker = 'A Triptych Article'
title = 'Chastity, Continence,\\ Celibacy'
subtitle = 'Three Obligations, Two Codes,\\ and Twenty-Four Churches'
note = 'Governing law: the 1983 \emph{Codex Iuris Canonici} for the Latin Church and the 1990 \emph{Codex Canonum Ecclesiarum Orientalium} for the Eastern Catholic Churches, each as amended, stated as of 25 July 2026; see the terminal Scope, Method, and Qualifications appendix. This is a study aid, not canonical advice: no personal case is decided here.'
