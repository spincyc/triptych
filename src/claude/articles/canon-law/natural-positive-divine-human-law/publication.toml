[document]
type = "article-v1"
pdftitle = 'Natural and Positive, Divine and Human'
pdfsubject = '''A discursive canon-law article on the classical taxonomy of law and its canonical reception: eternal law, natural law, divine positive law, and human law in Aquinas's treatise on law (ST I-II qq. 90-97), its sources in Isidore of Seville, its reception in Gratian's opening distinctions, the 1983 Code of Canon Law's working uses of the distinctions (divine law, merely ecclesiastical law, custom, dispensation), the Catechism's and Veritatis splendor's natural-law expositions, and the boundaries of what the Church claims to declare rather than constitute.'''
kicker = 'A Triptych Article'
title = 'Natural and Positive,\\ Divine and Human'
subtitle = 'The Classical Taxonomy of Law and Its Reception\\ in the Canon Law of the Latin Church'
note = 'Governing law: the 1983 \emph{Codex Iuris Canonici} for the Latin Church, as amended, stated as of 25 July 2026; see the terminal Scope, Method, and Qualifications appendix. This is a study aid, not canonical advice.'
tocdepth = '2'
notes-font = '\footnotesize'
notes-parskip = '0.28em'
notes = "endnotes"

