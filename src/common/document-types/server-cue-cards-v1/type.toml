schema = 1
record_type = "document-type"
id = "server-cue-cards-v1"
description = """
The printable cue-card companions of the sung-Mass altar-server guides
(guidance/liturgy/roman-1962-server-training.md): the shared response cards
and the form's action cards, both drawn from the family's shared card sources,
whose grids own every face, its geometry and its duplex mirroring. The type
owns the preamble, the cards-only flag, the PDF metadata, the end hook that
prints the leaf's revision and rights notice below the last back grid, and the
two shared inputs. A leaf supplies its PDF title and subject, chooses its
form (which selects the form flag and its action-card source) and whether its
profile admits the terminal reference sheet, and may add raw front-of-document
settings in its front region.
"""
kinds = ["server-cards"]

[editions.main]
role = "canonical"
template = "main.template.tex"
entrypoint = "main.tex"
fields = ["pdftitle", "pdfsubject"]
optional_regions = ["front"]
options = { form = "missa-cantata", terminal-sheet = "without" }
