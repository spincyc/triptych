# The LaTeX-to-Markdown converter that builds every web edition from its
# canonical TeX at site-build time (tools/web-edition products). The
# web-editions browser-product family refuses any other Pandoc version; CI
# installs exactly this official binary with
# scripts/_install_web_edition_pandoc.py. On 2026-11-04 this binary and the
# Arch Linux pandoc-cli 3.11 build produced byte-identical editions for all
# 141 then-tracked web editions.
