schema_version = 1
record_type = "document-schema-registry"
manifest_name = "publication.toml"
description = "Typed publication ownership and declared structure; source and rendered review remain separate gates."

[[types]]
kind = "article-faith"
patterns = ["articles/faith/*"]
profile = "guidance/articles.md"
required_roles = ["scope", "source-audit"]
requirements = ["Free argumentative order; no compulsory opening thesis or chapter template.", "Scope, used references and revision are terminal; authority and claim-local qualifications stay local."]

[[types]]
kind = "article-canon-law"
patterns = ["articles/canon-law/*"]
profile = "guidance/articles.md"
required_roles = ["scope", "source-audit"]
requirements = ["Legal scope identifies governing text, jurisdiction, persons, assumed facts, amendments and as-of date.", "Validity, liceity, obligation, permission, interpretation and exceptions remain distinct."]

[[types]]
kind = "article-scripture"
patterns = ["articles/scripture/*"]
profile = "guidance/articles.md"
required_roles = ["scope", "source-audit"]
requirements = ["One bounded passage or claim, original-language and relevant reception witnesses, exact loci and negative findings."]

[[types]]
kind = "biography"
patterns = ["biographies/*"]
profile = "guidance/biographies.md"
required_roles = ["scope", "source-audit", "chronology", "tradition-audit"]
requirements = ["Sustained chronological life; distinct witness dates, uncertain events and later tradition.", "Terminal scope/chronology/evidence, references and revision; no empty life headings."]

[[types]]
kind = "history-parish"
patterns = ["history/catholic-parish-histories/*"]
profile = "guidance/history/historical-accounts.md"
required_roles = ["scope", "source-audit", "evidence-map", "pastor-succession"]
requirements = ["Required pastor succession after scope and before orientation timeline/references; exact offices, dates, witnesses and explicit gaps."]

[[types]]
kind = "history-translation"
patterns = ["history/biblical-translations/*"]
profile = "guidance/history/historical-accounts.md"
required_roles = ["scope", "source-audit", "evidence-map"]
requirements = ["Periodized textual history, source/target languages and defining witnesses; title/corpus and translation/revision distinctions."]

[[types]]
kind = "history-account"
patterns = ["history/traditional-priestly-institutes/*", "history/catholic-exorcism/*"]
profile = "guidance/history/historical-accounts.md"
required_roles = ["scope", "source-audit", "evidence-map"]
requirements = ["Historical narrative and evidence map; contemporary evidence, later reception and critical reconstruction distinct.", "An orientation timeline is optional, not a universal history requirement."]

[[types]]
kind = "novena-companion"
patterns = ["devotions/novenas/*-daily-prayer"]
profile = "guidance/devotions/novenas.md"
required_roles = ["derivation"]
requirements = ["Mechanical exact canonical prayer imports, nine days, minimum rubrics; no independent exposition or adapted prayer.", "Own revision with inherited generation; common prayers printed once."]

[[types]]
kind = "novena"
patterns = ["devotions/novenas/*"]
profile = "guidance/devotions/novenas.md"
required_roles = ["scope", "source-audit", "prayer-inventory", "daily-prayers"]
requirements = ["Common order, exactly nine distinct days, received hymns/prayers, exposition, terminal scope/calendar and references.", "Each day has scriptural centre, meditation, examination/act, intention and unique exact received prayer."]

[[types]]
kind = "proper-1962"
patterns = ["liturgy/roman-rite/1962/propers/temporal/*", "liturgy/roman-rite/1962/propers/ritual/*"]
profile = "guidance/liturgy/roman-1962-propers.md"
required_roles = ["scope", "appointed-source", "retrieved-source"]
gates = ["proper-components", "proper-content"]
requirements = ["Preserve component schema, chronology presentation and legacy contracts; no invented appointment, date or interpretation.", "Schema two: 2–5 interpretations, four senses and whole-appointment coverage each, authored concise study and homily.", "Reference-only requires exact recorded authorization; source inspection and chronology remain mandatory."]

[[types]]
kind = "proper-postconciliar"
patterns = ["liturgy/roman-rite/postconciliar/*/propers/temporal/*", "liturgy/roman-rite/postconciliar/*/propers/general-calendar/*"]
profile = "guidance/liturgy/postconciliar-propers.md"
required_roles = ["scope", "instance-manifest", "appointed-source"]
gates = ["proper-components", "proper-content"]
requirements = ["Exact edition/territory/cycle/form/branches and single reusable formulary owner; no cross-family imports.", "Official correlation, semi-continuous reading and editorial synthesis remain distinct."]

[[types]]
kind = "mass-ordinary"
patterns = ["liturgy/roman-rite/1962/ordinary/*", "liturgy/roman-rite/postconciliar/*/ordinary/*"]
profile = "guidance/liturgy/ordinary-expositions.md"
required_roles = ["scope", "edition-manifest", "sequence-inventory", "source-audit"]
requirements = ["Ordered movement inventory records wording boundaries, roles, actions, modes and conditional status; exposition is proportional, not uniform dossiers."]

[[types]]
kind = "mass-comparison"
patterns = ["liturgy/roman-rite/comparative/*"]
profile = "guidance/liturgy/ordinary-expositions.md"
required_roles = ["scope", "edition-manifest", "sequence-inventory", "source-audit"]
requirements = ["Separate source trails for each received edition and direct comparison; no synthetic generic Mass."]

[[types]]
kind = "assembly-reference"
patterns = ["liturgy/roman-rite/1962/reference/assembling-the-mass"]
profile = "guidance/liturgy/roman-1962-assembly.md"
required_roles = ["scope", "edition-manifest", "rubric-index", "worked-cases", "source-audit"]
requirements = ["Day, precedence, impediment, category admission and assembly are five distinct ordered decisions.", "Cases identify conditions, competitors, exact rubric, impediment result, permission, inserted texts and uncertainty."]

[[types]]
kind = "calendar-reference"
patterns = ["liturgy/roman-rite/1962/reference/liturgical-calendar", "liturgy/roman-rite/postconciliar/*/reference/liturgical-calendar"]
profile = "guidance/liturgy/roman-calendar-references.md"
required_roles = ["scope", "edition-manifest", "source-audit", "evidence-map", "calendar-inventory"]
requirements = ["Complete normative movable/fixed/territorial inventory and dated modifications; no inferred annual Ordo."]

[[types]]
kind = "curriculum-guide"
patterns = ["curriculums/ecclesiastical-latin/00-course-guide"]
profile = "guidance/curriculums/ecclesiastical-latin.md"
required_roles = ["scope", "companion-map", "curriculum-map", "source-audit"]
gates = ["curriculum"]
requirements = ["Course entry/final abilities, stable packet/lesson dependencies, lookup/answer/repetition methods; qualitative readiness."]

[[types]]
kind = "curriculum-reference"
patterns = ["curriculums/ecclesiastical-latin/00-reference-grammar"]
profile = "guidance/curriculums/ecclesiastical-latin.md"
required_roles = ["scope", "companion-map", "source-audit"]
gates = ["curriculum"]
requirements = ["Reference selection and reader order declared; received/adapted/project examples and translations distinct."]

[[types]]
kind = "curriculum-memory"
patterns = ["curriculums/ecclesiastical-latin/00-memory-workbook"]
profile = "guidance/curriculums/ecclesiastical-latin.md"
required_roles = ["scope", "companion-map", "vocabulary-map", "answer-key-audit"]
gates = ["curriculum"]
requirements = ["Populated and reusable blank memory sheets; canonical vocabulary, recurrence and exact answer coupling."]

[[types]]
kind = "curriculum-assessment"
patterns = ["curriculums/ecclesiastical-latin/05-stage-assessments/*"]
profile = "guidance/curriculums/ecclesiastical-latin.md"
required_roles = ["scope", "companion-map", "answer-key-audit"]
gates = ["curriculum"]
requirements = ["Stable review IDs, checkable answers/acceptable alternatives and open-task inspection points; answers after tasks; qualitative readiness, no scores."]

[[types]]
kind = "curriculum-poetry"
patterns = ["curriculums/ecclesiastical-latin/04-advanced/poetry/*"]
profile = "guidance/curriculums/ecclesiastical-latin.md"
required_roles = ["scope", "companion-map", "passage-inventory", "answer-key-audit"]
gates = ["curriculum"]
requirements = ["Eight-part advanced branch, declared prerequisites and canonical exercises/answers; prosody distinct from pronunciation."]

[[types]]
kind = "curriculum-packet"
patterns = ["curriculums/ecclesiastical-latin/01-foundations/*", "curriculums/ecclesiastical-latin/02-core-grammar/*", "curriculums/ecclesiastical-latin/03-missal-reading/*", "curriculums/ecclesiastical-latin/04-advanced/*"]
profile = "guidance/curriculums/ecclesiastical-latin.md"
required_roles = ["scope", "module-map", "module-selection", "curriculum-map", "passage-inventory", "vocabulary-map", "answer-key-audit"]
gates = ["curriculum"]
requirements = ["Teaching, Memory, Reading/Composition, Cumulative Practice, Answers/Models, Scope/Sources in order.", "All four worksheet variants per stable lesson with matching answers, one owner for prompt/solution selections; qualitative readiness."]

[[types]]
kind = "server-cards"
patterns = ["liturgy/roman-rite/1962/reference/altar-server-guides/*-flash-cards", "liturgy/roman-rite/1962/reference/altar-server-guides/*-cue-cards"]
profile = "guidance/liturgy/roman-1962-server-training.md"
required_roles = ["guide-map", "response-inventory", "flash-card-manifest"]
requirements = ["Mechanical exact selected paired faces; own revision/inherited generation, no cover or terminal apparatus.", "Low Mass eight-up/fixed 11.5pt; sung six-up; mirrored duplex backs and odd front-page parity."]

[[types]]
kind = "server-trainer"
patterns = ["liturgy/roman-rite/1962/reference/altar-server-guides/01-low-mass-trainer-manual"]
profile = "guidance/liturgy/roman-1962-server-training.md"
required_roles = ["scope", "guide-map", "response-inventory", "ceremonial-inventory", "pronunciation-audit"]
requirements = ["Child/trainer page and action correspondence, distinct trainer rail, complete two-server model and routes."]

[[types]]
kind = "server-low-mass"
patterns = ["liturgy/roman-rite/1962/reference/altar-server-guides/01-low-mass"]
profile = "guidance/liturgy/roman-1962-server-training.md"
required_roles = ["scope", "guide-map", "response-inventory", "ceremonial-inventory", "pronunciation-audit"]
requirements = ["Continuous two-server sacristy-to-sacristy route, actor/cue/action/finish state; no trainer-only IPA, quiz or mastery records."]

[[types]]
kind = "server-sung"
patterns = ["liturgy/roman-rite/1962/reference/altar-server-guides/02-missa-cantata", "liturgy/roman-rite/1962/reference/altar-server-guides/03-solemn-mass"]
profile = "guidance/liturgy/roman-1962-server-training.md"
required_roles = ["scope", "guide-map", "response-inventory", "ceremonial-inventory", "pronunciation-audit"]
requirements = ["Declared roster, role sheets, team rehearsal and full chronology; exact actor/mode, branches and object handoffs."]

[[types]]
kind = "pictorial-dictionary"
patterns = ["liturgy/roman-rite/1962/reference/roman-sanctuary-dictionary/*"]
profile = "guidance/liturgy/roman-1962-pictorial-dictionaries.md"
required_roles = ["scope", "guide-map", "dictionary-schema", "dictionary-selections", "object-records", "artwork-manifest", "plate-manifest", "source-audit"]
gates = ["dictionary-artwork"]
requirements = ["Existing typed object/claim/variant/source/artwork records and curated audience/plate selections stay canonical.", "Stable object identities, sourced morphology/status/handlers and scale/rights; image-dominant plates, no universal card layout."]

[[types]]
kind = "sacraments-summary"
patterns = ["theology/sacraments-at-a-glance"]
profile = "guidance/theology/sacramental-reference.md"
required_roles = ["sacrament-matrix", "sacrament-lexicon", "sacrament-summaries", "initiation-table"]
requirements = ["Exactly imported matrix, lexicon, seven canonical summaries, initiation table; no independent theology."]

[[types]]
kind = "sacraments"
patterns = ["theology/sacraments"]
profile = "guidance/theology/sacramental-reference.md"
required_roles = ["scope", "source-audit", "sacrament-matrix", "sacrament-summaries", "initiation-table"]
requirements = ["Seven sacramental treatments with matter/form/subject/minister/intermediate reality/grace/effects/change/ends.", "References precede terminal appendices; scope, matrix, 24-Church initiation table and seven one-page summaries; revision last."]

[[types]]
kind = "virtues"
patterns = ["theology/virtues"]
profile = "guidance/theology/virtues.md"
required_roles = ["scope", "source-audit", "virtue-inventory", "terminology-audit"]
requirements = ["Source-defined habit taxonomy and reproducible order; object/act/parent, warranted opposition and typed absent flanks; terminal census."]

[[types]]
kind = "angelology"
patterns = ["theology/angelology"]
profile = "guidance/theology/angelology.md"
required_roles = ["scope", "source-audit", "question-inventory", "order-inventory", "terminology-audit"]
requirements = ["Every Summa article in I 50–64 and 106–114 once in census, proposition grade and source basis.", "Fifteen Celestial Hierarchy chapters in order, loci and Aquinas reception; separate source-specific comparative orders."]

[[types]]
kind = "heresies"
patterns = ["theology/heresies/*"]
profile = "guidance/theology/heresies.md"
required_roles = ["scope", "source-audit", "corpus-inventory", "timeline-audit"]
requirements = ["Typed census dispositions, proposition/authority/act/censure/jurisdiction dossiers and A–D access grade.", "One timeline row per datable ecclesial response; civil enforcement separate, with source uncertainty."]

[[types]]
kind = "marian-rosary"
patterns = ["theology/mariology/rosary"]
profile = "guidance/theology/mariology.md"
required_roles = ["scope", "source-audit", "prayer-text-audit"]
requirements = ["Complete prayer before exposition; distinct 15/20-mystery and five-decade forms, source-grounded mystery treatment."]

[[types]]
kind = "marian-prayer"
patterns = ["theology/mariology/angelus", "theology/mariology/regina-coeli"]
profile = "guidance/theology/mariology.md"
required_roles = ["scope", "source-audit", "prayer-text-audit"]
requirements = ["Exact complete received prayer first; witness/translation/variants/rights, sourced history and dated mutable discipline."]

[[types]]
kind = "marian-dogma"
patterns = ["theology/mariology/marian-dogmas"]
profile = "guidance/theology/mariology.md"
required_roles = ["scope", "source-audit"]
requirements = ["Exactly four dogmas; defined object/authority, reception/development and one page-bounded synopsis each."]

[[types]]
kind = "marian-apparition"
patterns = ["theology/mariology/apparitions", "theology/mariology/champion", "theology/mariology/fatima", "theology/mariology/guadalupe", "theology/mariology/la-salette", "theology/mariology/lourdes"]
profile = "guidance/theology/mariology.md"
required_roles = ["scope", "source-audit", "corpus-status"]
requirements = ["Reproducible event corpus, exact competent act/object/formula/regime/jurisdiction and current status; legacy and six post-2024 conclusion classes distinct."]

[[types]]
kind = "marian-monograph"
patterns = ["theology/mariology/ark-of-the-covenant"]
profile = "guidance/theology/mariology.md"
required_roles = ["scope", "source-audit"]
requirements = ["Local monograph scope and source roles; literal narrative, typology, reception, doctrine and synthesis distinct; source-backed maps/plates and textual equivalents."]

[[types]]
kind = "marian-authority"
patterns = ["theology/mariology/doctrinal-authority"]
profile = "guidance/theology/mariology.md"
required_roles = ["scope", "source-audit"]
requirements = ["Authority classes, competent acts and exact objects/loci; no imposed prayer/apparition template."]
