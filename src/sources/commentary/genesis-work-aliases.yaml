# The names under which each Genesis commentary was looked for.
#
# `guidance/sources.md` makes this file policy: "Resolve a source's aliases
# before retrieving it... The aliases a retrieval used are part of how it was
# made, so record them with the artifact. A later reader must be able to see
# which names were tried, because that is the only way to tell a work that is
# genuinely unreachable from one that was looked for under the wrong name."
#
# The promoted index names 84 works on Genesis 1-50 across 1,298 attributions.
# It names them as three model runs happened to name them, so the 84 are not 84
# works: `Bede` and `Bede the Venerable` head the same commentary, Cajetan heads
# five spellings of one, and Pererius four. Grouping them is the first act of
# this survey, and it is recorded here rather than performed silently, because a
# work searched twice under two names and found once reads afterwards as one
# found and one absent.
#
# Each group carries, where they exist: the Latin title, the Greek title, the
# vernacular title, the incipit where it stands in for a title, the Migne PL or
# PG volume, the author named by see, by epithet, in Latin and in the
# vernacular, and the modern editor's or series' short form. `searched` is
# written by `scripts/_availability.py`, which drives its queries from this file
# and from nothing else, so a name absent here was not tried.
#
# `distinct_works` is derived and checked: it is the number of groups, and the
# sum of each group's `index_names` must be the 84 the index holds.
schema: triptych-genesis-work-aliases/v1
updated: '2026-08-01'
index_names_total: 84
distinct_works: 62
attributions_total: 1298
