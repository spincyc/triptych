        notes: "English translation (Burns Oates & Washbourne, 1927) of an Italian original not held; he quotes the Mass in English, so its parts are identified by the references he gives and by what he says of the Missal's orations. He calls this Sunday, by the Roman rite, a 'Dominica vacat' after the vigil at St Peter's."

