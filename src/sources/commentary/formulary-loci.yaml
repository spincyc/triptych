# Mass-keyed commentary loci: each commentator's Mass as HE gives it.
#
# THE QUESTION THIS ANSWERS. Which liturgical commentators expound a given
# Mass? Not "which chapter is headed with its Sunday number": a commentator's
# numbering drifts from any calendar's, and a heading files him under the wrong
# Mass. Rupert of Deutz's "Dominica decima octava" has the 1962 Eighteenth
# Sunday's chants and Epistle with the Gospel of the chair of Moses; the 1962
# Gospel of that Sunday is his NINETEENTH. So each locus records the elements
# the commentator names, and `tools/tpt commentary-work-index formulary
# --calendar C --mass M` compares them with that calendar's mass, element by
# element, every run. No match to any calendar is stored here, so none can
# drift from the calendar it would restate (guidance/the-shape.md section 2).
# guidance/catena.md section 12 owns how the file is read.
#
# THE MATCH IS A FINDING AID. It says where a commentator's Mass and a
# calendar's share elements. It verifies nothing about what he says of them;
# a study still reads the locus and binds it in its own source records.
#
# A LOCUS ROW.
#   locus             his own division, in the work's `locus_grammar`
#   read_in, lines    the tracked text layer the locus was read in, and its
#                     physical lines; `make check-sources` replays the heading
#                     against them. A locus read in a facsimile gives `pages`
#                     instead, which are bounded but not replayed.
#   own_label         his heading, as a reading of the page; where the text
#                     layer's optical recognition differs, `own_label_in_layer`
#                     carries the layer's exact string, which is what is replayed
#   season, ordinal   his heading's Sunday, never a calendar's; absent when his
#                     heading carries no number
#   occasion          where his text places the Sunday in the year without a
#                     number, such as the Sunday after an Ember Saturday
#   treatment         whole-office: he expounds the formulary as one office;
#                     per-element: he comments on its parts in turn;
#                     single-element: one part only; structural: the Sunday's
#                     place in the year, naming no element, listed by occasion
#   elements          what he names. `incipit` is words he quotes. `ref` is the
#                     scripture he quotes, cites or unambiguously describes, in
#                     Clementine Vulgate numbering, at the narrowest extent his
#                     words establish -- a chapter only where he gives no more.
#                     `said` is his own words where he describes rather than
#                     quotes; an element with `said` is reported as described,
#                     and its incipit or ref is the identification of what he
#                     describes. `alternative` carries his own qualifier where
#                     he gives a second text ("in quibusdam Ecclesiis").
#   state, checked_on located: read in a text layer; inspected: read on a page
#                     image. Every row here is `located` on the date given.
#
# EVERY STRING IS QUOTED. An unquoted comma or colon in a Latin incipit
# silently splits it into a second key (guidance/sources.md); the check refuses
# any unquoted string.
#
# WHAT IS HERE. The loci of every registered liturgical commentary for the 1962
# Eighteenth Sunday after Pentecost (registry 58), with the neighbouring chapter
# wherever a commentator's Gospel of the paralytic sits under another Sunday; and
# every other Mass locus the library's own work, edition, artifact and passage
# records name for these works, each read in its layer. A structural chapter
# with no occasion in the year carries a `topic` instead, and no mass lists it.
# Standing is never recorded here; it is the author-standing registry's
# (src/sources/inventories/author-standing-v1.toml). Holdings are never recorded
# here; they are the containment inventory's.

