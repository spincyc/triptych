# Which commentary titles name one work.
#
# Derived by `tools/tpt harvest aliases --rebuild` from the alias claims the
# harvest runs themselves made, not hand-typed: `groups` is the connected
# components of the "these names are the same work" graph, per author, and is
# regenerated whole. `review` is the part that cannot be derived, because
# whether a group is one work is a judgement about the works; each entry
# carries the reason it was made. Loading validates that no title reaches two
# groups, that no name declared ambiguous still groups a work, that no chain of
# aliases has re-joined works declared distinct, and that no group's canonical
# title names a book its own other names do not share.
#
# `evidence_sha256` covers the alias claims alone, so recording a run that
# asserts a new alias ages the table and `harvest promote` refuses until the
# new grouping has been looked at.
schema: triptych-commentary-work-aliases/v1
derived_on: '2026-07-31'
evidence_sha256: 6a9af2d38d5a14ee58440b8d3e3de175305e377e1284a355f6f999b57f9497ba
review:
  ambiguous_titles:
  - author: Peter Lombard
    title: Magna Glossatura
    reason: 'Names both the Psalms gloss and the Collectanea on Paul, which are two works.
      Two of the three runs offered it as an alias of each, so it joined Commentarium in Psalmos
      (374 uses) to Collectanea in omnes divi Pauli epistolas (111) under one identity. Corroboration
      would not have caught it: both runs were right about the name and wrong about what it
      picks out.'
  - author: Thomas Cajetan
    title: Thomas de Vio
    reason: 'His own name, offered as a name of a work. As an edge it joins everything he
      wrote: the Psalms commentary, the Isaiah commentary and the Pentateuch came out one
      work whose canonical title named Psalms and whose own names named Isaiah. A name that
      names a person names no work. The ledger''s author column already refuses the six such
      aliases spelled exactly as some author is spelled; these four are not, because the column
      holds Thomas Cajetan and Thomas de Vio Cajetan and never these.'
  - author: Thomas Cajetan
    title: Thomas de Vio Caietanus
    reason: The same name in its fuller Latin form.
  - author: Thomas Cajetan
    title: Tommaso de Vio
    reason: The same name in Italian.
  - author: Thomas Cajetan
    title: Caietanus
    reason: The same name, the cognomen alone.
  not_aliases:
  - author: Jerome
    titles:
    - Commentarioli in Psalmos
    - Tractatus in Psalmos
    reason: 'Two Jerome works on the psalter, not one: the Commentarioli are brief scholia
      (CCSL 72) and the Tractatus are homilies (CCSL 78). Asserted by one run of three; the
      other two kept them apart.'
  - author: Jerome
    titles:
    - Commentarioli in Psalmos
    - Tractatus sive Homiliae in Psalmos
    reason: The same claim under the Tractatus's fuller title.
  - author: Jerome
    titles:
    - Commentarioli in Psalmos
    - Homilies on the Psalms
    reason: The same claim in English. The homilies are the Tractatus, so this name belongs
      to that work rather than to the Commentarioli.
  - author: Jerome
    titles:
    - Commentarioli in Psalmos
    - Tractatus in librum Psalmorum
    reason: The same claim under a second of the Tractatus's titles.
  also_aliases:
  - author: Jerome
    titles:
    - Tractatus in Psalmos
    - Tractatus in librum Psalmorum
    reason: One title is the other's fuller form. It reached its group only through the denied
      Commentarioli edge, and would otherwise stand alone on 10 uses.
  - author: John Calvin
    titles:
    - Praelectiones in librum prophetiarum Ieremiae et Lamentationes
    - Praelectiones in librum prophetiarum Ieremiae
    reason: Calvin lectured once on Jeremiah and Lamentations and the lectures were printed
      once, in 1563; the runs spelled the one work six ways and no run joined the fuller Latin
      title to the shorter, so it came out three groups. One of the three held no name of
      the whole at all — Commentaries on the Prophet Jeremiah beside Praelectiones ... Ieremiae
      et Lamentationes — and so could not be named by anything it had.
  - author: John Calvin
    titles:
    - Praelectiones in librum prophetiarum Ieremiae
    - Praelectiones in Jeremiam prophetam
    reason: The third of the same three, joined for the same reason.
  canonical_titles:
  - author: Albert the Great
    instead_of: Commentarii in Amos prophetam
    title: Commentarii in duodecim prophetas minores
    reason: 'A group spanning six of the minor prophets, named after Amos, which the check
      turned up beside the two Pauline groups. Borgnet prints the work as Enarrationes in
      XII prophetas minores (Opera omnia XIX, Paris: Vives 1892); that exact name is already
      the canonical title of another of Albert''s groups, so this one takes the whole-naming
      title it already holds. Albert''s minor prophets stand in four separate groups because
      no run asserted the aliases that would join them — a grouping question, left for review,
      not settled by renaming.'
  - author: Alonso Tostado
    instead_of: Commentaria in Leviticum
    title: Tostatus, Commentaria in Pentateuchum
    reason: 'Fifteen groups came out of the 34 new loci named after one book of the several
      they reach, and this is the first of them: Tostado''s Genesis, Exodus, Leviticus and
      Numbers under the name of Leviticus. The two whole-naming names the group holds both
      carry his by-name, because no run offered a bare Commentaria in Pentateuchum, and a
      reviewed title must be one the group already holds.'
  - author: Andrew of Saint Victor
    instead_of: 'Expositio super Heptateuchum: In Exodum'
    title: Expositiones historicae in Heptateuchum
    reason: Exodus and Leviticus under the name of Exodus. The Heptateuch title is the work.
  - author: Andrew of Saint Victor
    instead_of: Expositio super Isaiam
    title: Expositio in Ezechielem et Isaiam
    reason: Isaiah and Ezekiel under the name of Isaiah, and the group holds the name of both.
  - author: Augustin Calmet
    instead_of: 'Commentaire littéral sur tous les livres de l''Ancien et du Nouveau Testament:
      la Genèse'
    title: Commentaire littéral sur tous les livres de l'Ancien et du Nouveau Testament
    reason: The Aquinas defect again, and this time Genesis caused it. Calmet's commentary
      is one work over the whole canon, published in twenty-three volumes at Paris between
      1707 and 1716, and its group holds fifty-seven names reaching Exodus, Leviticus, Numbers,
      Job, Wisdom, Isaiah, Jeremiah, Daniel, Osee, Zacharias, the twelve minor prophets, the
      Maccabees and Acts. Harvesting all fifty chapters of Genesis made the Genesis volume's
      title the most-used one, so derivation named the whole after the part and Rule 8 refused
      it. The title taken here is the group's own name for the whole, which the runs assert
      in French and in Latin alike. The grouping is not in question; only the name was.
  - author: Augustine of Hippo
    instead_of: 'Locutiones in Heptateuchum, Liber I: Locutiones de Genesi'
    title: Locutionum in Heptateuchum libri septem
    reason: One work in seven books over the seven books of the Heptateuch, named after the
      first. Its own group holds Locutiones de Exodo and Locutiones de Numeris, so the Genesis
      book cannot be the name of the whole. The title taken here is the group's own name for
      the collected work, as Migne prints it at PL 34.
  - author: Bruno of Segni
    instead_of: Expositio in Leviticum
    title: Expositio in Pentateuchum
    reason: Exodus, Leviticus and Numbers under the name of Leviticus.
  - author: Carl Friedrich Keil
    instead_of: Biblischer Commentar uber die zwolf kleinen Propheten
    title: Keil and Delitzsch, Commentary on the Minor Prophets
    reason: 'One commentary on the twelve, named after Amos. Two things are worth separating
      here, because only one of them is a cataloguing error. The grouping and the renaming
      are right: Keil''s minor-prophets volume covers all twelve and the group''s own English
      name says so, while the German name it was carrying reached Obadiah as well as Amos.
      But the word that made the check fire is `zwolf` — German for twelve — which the derivation
      had proved a book name because every title in the ledger carrying it happened to land
      on Amos, two authors used it and three titles did. `guidance/catena.md` calls the derived
      lexicon "sound where incomplete", meaning an unproved word is never read as a book name
      so the check under-reports rather than invents. That is true of omissions and not of
      this: a numeral was proved a name of Amos, and the check over-reported. It over-reported
      onto a group that did need renaming, so nothing wrong reached the table, but the next
      one need not be so lucky. Recorded here rather than fixed because narrowing the lexicon
      is a change to the derivation and belongs with its own regression test.'
  - author: Haymo of Auxerre
    instead_of: Expositio in Epistulam ad Romanos
    title: Haymo of Halberstadt, In divi Pauli epistolas expositio
    reason: Haymo's Pauline commentary is one work over the epistles and the group reaches
      Philippians as well as Romans, so naming it for Romans repeats exactly the Aquinas and
      Theophylact defect this list already carries twice. The whole-naming title is the one
      the group already holds, which prints the work under Haymo of Halberstadt — the attribution
      Migne inherited and modern scholarship gives to Haymo of Auxerre. The disputed name is
      kept because a reviewed title must be a name the group holds; the dispute belongs to
      the work record, not to the alias table.
  - author: Cassiodorus
    instead_of: Complexiones in Actus Apostolorum
    title: Complexiones in epistulas et acta apostolorum et apocalypsin
    reason: The Complexiones are one work over the Epistles, Acts and the Apocalypse; the
      group reaches Acts and the Apocalypse and was named for Acts alone.
  - author: Cyril of Alexandria
    instead_of: Glaphyra in Genesim
    title: Glaphyra in Pentateuchum
    reason: The Glaphyra are one work of thirteen books over the Pentateuch, of which seven
      are on Genesis; the group reaches Exodus, Leviticus, Numbers and Deuteronomy as well.
      Genesis dominated the derivation only because Genesis is what was harvested. The title
      taken here is the group's own name for the whole, as Migne prints it at PG 69.
  - author: Ephrem the Syrian
    instead_of: Commentary on Genesis
    title: Commentarii in Genesim et in Exodum
    reason: The Syriac commentary is transmitted as one work on Genesis and Exodus together,
      and the group's own names say so. Naming it for Genesis alone would hide the Exodus
      half, which is the same defect the Aquinas entry records.
  - author: Jacques-Bénigne Bossuet
    instead_of: 'Libri Salomonis: Sapientia (notes and exposition)'
    title: Libri Salomonis, Proverbia, Ecclesiastes, Canticum Canticorum, Sapientia, Ecclesiasticus,
      cum notis
    reason: Five Solomonic books under the name of Wisdom. The group holds the title of the
      whole.
  - author: John Calvin
    instead_of: Praelectiones in librum prophetiarum Ieremiae et Lamentationes
    title: Commentaries on Jeremiah and Lamentations
    reason: 'One work in three fragments, joined in also_aliases above. The Latin name the
      work is printed under, Praelectiones in librum prophetiarum Ieremiae et Lamentationes,
      is not taken as the canonical: the genitive Ieremiae is not among the forms the coverage
      check knows, so that name reads as naming Lamentations alone and would trade one part-naming
      title for another. The English name of the whole is exact and is what the group takes.'
  - author: Juan Maldonado
    instead_of: Commentarii in Ieremiam prophetam
    title: 'Maldonatus, Commentarii in prophetas quatuor: Ieremiam, Baruch, Ezechielem, Danielem'
    reason: The second spelling of the same work, with the only whole-naming name that group
      holds.
  - author: Juan Maldonado
    instead_of: Commentarii in Jeremiam
    title: 'Maldonatus, Commentarii in prophetas IV: Ieremiam, Baruch, Ezechielem, Danielem'
    reason: The third spelling of the same work, with the only whole-naming name that group
      holds.
  - author: Juan Maldonado
    instead_of: Commentarii in Jeremiam prophetam
    title: 'Commentarii in prophetas quatuor: Ieremiam, Baruch, Ezechielem et Danielem'
    reason: Jeremiah, Baruch, Ezekiel and Daniel under the name of Jeremiah. Maldonado's four
      prophets stand in three groups, one per spelling of the same work; each is renamed to
      the whole-naming name it holds rather than merged, because merging is an assertion about
      the works and renaming is not.
  - author: Julian of Eclanum
    instead_of: Tractatus in Osee, Iohel et Amos
    title: Expositio libri Iob et tractatus prophetarum Osee, Iohel et Amos
    reason: A second Julian group, reaching Job as well as the prophets, named after the prophets
      alone. The name of both is the one the group already holds.
  - author: Julian of Eclanum
    instead_of: Tractatus prophetarum Osee, Iohel et Amos
    title: Commentary on Hosea, Joel and Amos
    reason: 'The group reaches Hosea, Joel and Amos and was named after two of the three.
      Only the English name of the three is read as naming all of them: the Latin names in
      the group spell Joel Iohel, which is not among the forms the coverage check knows.'
  - author: Martin Luther
    instead_of: 'Praelectiones in prophetas minores: in Michaeam'
    title: Praelectiones in prophetas minores
    reason: Hosea and Micah under the name of Micah.
  - author: Michael Ghislieri
    instead_of: Commentarii in Ieremiam prophetam
    title: Ghislerius, In Ieremiam prophetam commentarii, item in Baruch et Threnos
    reason: Jeremiah, Baruch and Lamentations under the name of Jeremiah, the same defect
      Theodoret's group carries and on the same three books.
  - author: Peter Comestor
    instead_of: 'Historia Scholastica: Historia libri Genesis'
    title: Historia Scholastica
    reason: The Historia Scholastica is one continuous history over the whole biblical narrative;
      its group holds the Exodus and Daniel books. The part cannot name the whole, and the
      group already carries the whole's name.
  - author: Procopius of Gaza
    instead_of: Commentary on Genesis
    title: Commentarii in Octateuchum
    reason: Procopius's epitome runs over the Octateuch, and the group reaches Exodus, Leviticus,
      Numbers and Deuteronomy. The Genesis portion is the part that survives best and is what
      the Genesis harvest asked about, which is exactly why derivation picked it.
  - author: Rupert of Deutz
    instead_of: 'De sancta Trinitate et operibus eius: In Genesim'
    title: De sancta Trinitate et operibus eius
    reason: 'Rupert''s Genesis exposition is books I to IX of a forty-two book treatise, and
      the group reaches Exodus, Leviticus, Numbers and the twelve minor prophets because the
      same treatise contains those too. This is the case src/sources/commentary/pilot-genesis/licence-survey.md
      singles out as the sharpest test in its set: the work identity, the extent and the container
      are three different things, and only the first of them is a name.'
  - author: Theophylact of Ohrid
    instead_of: Expositio in epistulam Iacobi
    title: Commentarius in epistulas catholicas
    reason: 'Nine uses over James, 1 Peter and 1 John under the name of James alone, which
      the check does not reach: the words that would prove it, petri and ioannis, are used
      too narrowly to qualify as book names, so this one was found by measuring the promoted
      index rather than by the gate. Migne''s heading, Expositio in epistolas catholicas,
      is already another Theophylact group''s canonical title, so this group takes the whole-naming
      title it already holds.'
  - author: Theophylact of Ohrid
    instead_of: Expositio in epistulam ad Romanos
    title: In omnes D. Pauli apostoli epistolas enarrationes
    reason: 'The same defect as the Aquinas entry, on the same corpus: 140 uses over the ten
      epistles named after Romans. The standard Latin form is Lonicerus''s version, Theophylacti
      Bulgariae archiepiscopi in omnes D. Pauli apostoli epistolas enarrationes (Cologne,
      Cervicornus 1532, and the reprints behind Migne PG 124-125). Migne''s own short heading,
      Expositio in epistolas S. Pauli, is not used here: two other Theophylact groups already
      carry that name, and one title may not reach two groups.'
  - author: Thomas Aquinas
    instead_of: Super Epistolam ad Romanos lectura
    title: Super Epistolas S. Pauli lectura
    reason: 'One work over ten epistles, named after the first of them. Derivation takes the
      most-used title and Romans is what the missals quote, so 242 uses across the Pauline
      corpus were filed under the Romans lectura. The collected commentary is printed as Super
      epistolas S. Pauli lectura (Marietti, ed. R. Cai, 8th revised edition, Turin-Rome 1953,
      2 vols), which is the title taken here. The grouping is not in question: the runs themselves
      assert Expositio in omnes S. Pauli epistolas as one of its names.'
  - author: Thomas de Vio Cajetan
    instead_of: 'Commentarii in Pentateuchum: In Leviticum'
    title: Commentarii illustres in quinque Mosaicos libros
    reason: Leviticus and Numbers under the name of Leviticus.
