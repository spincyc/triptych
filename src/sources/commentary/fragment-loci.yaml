- passage_id: passage.ambrose.hexameron.latin-migne-pl-14.1
  work_id: work.ambrose.hexameron
  work_alias:
    author: Ambrose of Milan
    work: Hexameron
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 1
    last_chapter: 1
    last_verse: 5
  basis: The first book is the proem against the philosophers and the exposition of the first day.
    It opens on 'In principio fecit Deus coelum et terram', which Migne cites at Gen. I, 1, and
    runs through the earth invisible and unfinished, the Spirit borne on the waters and the making
    and dividing of the light, closing on the day being called one rather than first, which is Genesis
    1:5. Migne's citations in this book are Gen. I, 1, I, 2, I, 3, I, 4 and I, 5, and reach no further.
- passage_id: passage.ambrose.hexameron.latin-migne-pl-14.2
  work_id: work.ambrose.hexameron
  work_alias:
    author: Ambrose of Milan
    work: Hexameron
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 6
    last_chapter: 1
    last_verse: 8
  basis: The second book is the second day, headed in the printing 'DE OPERE SECUNDI DIEI'. It opens
    by saying the first day has been finished, and expounds the firmament in the midst of the waters,
    the waters above it, and the firmament called Heaven, which Migne cites at Gen. I, 6, I, 7 and
    I, 8. Its recollection of the light of 1:3 in the last chapter is a back-reference and does
    not widen the extent.
- passage_id: passage.ambrose.hexameron.latin-migne-pl-14.3
  work_id: work.ambrose.hexameron
  work_alias:
    author: Ambrose of Milan
    work: Hexameron
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 9
    last_chapter: 1
    last_verse: 12
  basis: 'The third book is the third day, headed ''DE OPERE TERTII DIEI'', and opens ''Dies tertius
    nobis hodie in sermone nascatur'' on ''Congregetur aqua quae est sub coelo in congregatione
    una'', which Migne cites at Gen. I, 9. It runs through the dry land and the seas at I, 10 and
    the whole of the vegetation at I, 11, and its last chapters are still on the seed being in itself,
    which is 1:12. It never reaches the evening and morning of 1:13: that formula is absent from
    the book, so the extent closes at 12.'
- passage_id: passage.ambrose.hexameron.latin-migne-pl-14.4
  work_id: work.ambrose.hexameron
  work_alias:
    author: Ambrose of Milan
    work: Hexameron
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 14
    last_chapter: 1
    last_verse: 19
  basis: The fourth book is the fourth day, headed 'DE OPERE QUARTI DIEI', and expounds 'Fiant luminaria
    in firmamento coeli' from Migne's citation at Gen. I, 14 through the lights as signs, the two
    great lights and their sizes, and the moon's changes, closing 'Pulchre, ut arbitror, cessit
    dies quartus', which is the evening and morning of 1:19.
- passage_id: passage.ambrose.hexameron.latin-migne-pl-14.5
  work_id: work.ambrose.hexameron
  work_alias:
    author: Ambrose of Milan
    work: Hexameron
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 20
    last_chapter: 1
    last_verse: 23
  basis: The fifth book is the fifth day, headed 'DE OPERE QUINTI DIEI', and opens on 'Producant
    aquae reptilia animarum viventium, et volatilia volantia super terram secundum firmamentum coeli',
    which Migne cites at Gen. I, 20. It runs through the fishes and then the birds, reaching the
    great sea-creatures of 1:21, and closes 'gratulemur quod factus est nobis vespere dies quintus;
    fiat nobis mane dies sextus', which is the evening and morning of 1:23.
- passage_id: passage.ambrose.hexameron.latin-migne-pl-14.6
  work_id: work.ambrose.hexameron
  work_alias:
    author: Ambrose of Milan
    work: Hexameron
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 24
    last_chapter: 2
    last_verse: 2
  basis: 'The sixth book is the sixth day, headed ''DE OPERE SEXTI DIEI''. Migne cites Gen. I, 24,
    25 and 26 in its second chapter, on the beasts of the earth, and the exposition of man from
    chapter seven onwards is on ''Faciamus hominem ad nostram imaginem, et ad similitudinem nostram'',
    which he cites at Gen. I, 26. The last chapter, whose Maurist argument reads ''Diei sexto, totique
    adeo operi finem positurus quomodo Deus requievisse dicatur, aperit'', expounds God''s rest,
    which is Genesis 2:2, so the extent crosses the chapter boundary and is stored once. Genesis
    1:27 to 1:31 are not separately expounded between them: the extent is the reach of the book
    and not a claim that every verse inside it is treated.'
- passage_id: passage.bede.in-principium-genesis.latin-migne-pl-91.1-1
  work_id: work.bede.in-principium-genesis
