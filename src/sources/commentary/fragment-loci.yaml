- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-10
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  text_date: 415
  text_date_basis: Written between about 401 and 415 and issued as a whole at the end of that span; Augustine
    reviews it in the Retractationes as long in the making. The date is the composition of the work, not
    Migne's printing of 1841.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 7
    last_chapter: 2
    last_verse: 7
  basis: THE ARGUMENT NAMES NO VERSE. It reads only "In quo tractatur de animarum origine". The extent
    is declared at Genesis 2:7 because that is the verse books VI and VII expound and whose inbreathing
    raises the question this book continues; the anchor is this project's inference from the argument
    and from the two books it follows, and is recorded as an inference rather than as a statement of the
    printing. A reader who thinks the book belongs nowhere in Genesis has the ground to say so.
