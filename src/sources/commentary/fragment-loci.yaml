- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-10
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 7
    last_chapter: 2
    last_verse: 7
  basis: THE ARGUMENT NAMES NO VERSE. It reads only "In quo tractatur de animarum origine". The
    extent is declared at Genesis 2:7 because that is the verse books VI and VII expound and whose
    inbreathing raises the question this book continues; the anchor is this project's inference
    from the argument and from the two books it follows, and is recorded as an inference rather
    than as a statement of the printing. A reader who thinks the book belongs nowhere in Genesis
    has the ground to say so.
- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-11
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 25
    last_chapter: 3
    last_verse: 24
  basis: The argument states the book treats chapter 2 verse 25, "Et erant nudi", and the whole
    of chapter 3. It therefore spans the boundary between the second and third chapters and stands
    under both at its full extent.
- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-12
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 8
    last_chapter: 2
    last_verse: 8
  basis: THE ARGUMENT NAMES NO VERSE. It reads "In quo de paradiso et tertio coelo quo raptus est
    Paulus, deque multiplici visionum genere disputatur", and the greater part of the book is on
    2 Corinthians 12 and on the kinds of vision. The extent is declared at Genesis 2:8, where paradise
    is planted, because that is the Genesis question the book argues from; the anchor is this project's
    inference and not Migne's.
- passage_id: passage.martin-luther.lectures-on-genesis.lenker-minneapolis-1904.genesis-1
  work_id: work.martin-luther.lectures-on-genesis
  work_alias:
    author: Martin Luther
    work: Lectures on Genesis
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 2
    last_chapter: 1
    last_verse: 30
  basis: The printed lemmata run from "V. 2a. And the earth was waste and void" to "V. 30. And every
    green herb". The untitled introduction that opens the chapter argues about the age of the world
    and the order of the six days, but it prints no lemma at 1:1 and the extent is not widened to
    reach it; nor is there a lemma at 1:31.
