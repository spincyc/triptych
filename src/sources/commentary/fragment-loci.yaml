- passage_id: passage.severian-of-gabala.in-cosmogoniam-homiliae.pta-grc1-2018.homilia-1
  work_id: work.severian-of-gabala.in-cosmogoniam-homiliae
  work_alias:
    author: Severian of Gabala
    work: In cosmogoniam homiliae sex
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 1
    last_chapter: 1
    last_verse: 5
  basis: The homily is titled 'Εἰς τὴν πρώτην ἡμέραν τῆς κοσμοποιίας', on the first day, and the
    edition's own biblical annotation places Genesis 1:1 in its second and third chapters, 1:2 in
    the third and fourth, 1:3 in the fourth to sixth and 1:5 in the sixth. Its single pointer to
    2:7 stands in the fourth chapter as a forward reference to the making of man and does not widen
    the extent.
- passage_id: passage.severian-of-gabala.in-cosmogoniam-homiliae.pta-grc1-2018.homilia-2
  work_id: work.severian-of-gabala.in-cosmogoniam-homiliae
  work_alias:
    author: Severian of Gabala
    work: In cosmogoniam homiliae sex
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 2
    last_chapter: 1
    last_verse: 8
  basis: The homily is titled on the second day. Its third chapter expounds 'Ἡ δὲ γῆ ἦν ἀόρατος',
    which the edition annotates at Genesis 1:2 and which it treats at length rather than in passing,
    and then the firmament of 1:6, so the extent opens at 1:2 rather than at 1:6. The second day
    closes at 1:8. The pointer to Genesis 27:28 in the same chapter is an illustration from Isaac's
    blessing and is not an extent.
- passage_id: passage.severian-of-gabala.in-cosmogoniam-homiliae.pta-grc1-2018.homilia-3
  work_id: work.severian-of-gabala.in-cosmogoniam-homiliae
  work_alias:
    author: Severian of Gabala
    work: In cosmogoniam homiliae sex
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 9
    last_chapter: 1
    last_verse: 18
  basis: 'The homily is titled on the third day and the resurrection, and its first chapter is on
    the gathering of the waters and the vegetation, which the edition annotates at Genesis 1:9 and
    1:11. Its exposition then moves to the lights: chapters two, three, five and six carry 1:14,
    1:16, 1:17 and 1:18, and the third chapter opens by quoting ''Γενηθήτωσαν φωστῆρες ἐν τῷ στερεώματι
    τοῦ οὐρανοῦ''. Severian''s homily numbers do not answer the days one for one, and the extent
    follows the exposition rather than the title. The pointers to Genesis 14 and 19 are illustrations.'
- passage_id: passage.severian-of-gabala.in-cosmogoniam-homiliae.pta-grc1-2018.homilia-4
  work_id: work.severian-of-gabala.in-cosmogoniam-homiliae
  work_alias:
    author: Severian of Gabala
    work: In cosmogoniam homiliae sex
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 20
    last_chapter: 1
    last_verse: 31
  basis: The homily is titled on the fourth day and expounds the living creatures and man. Its second
    chapter quotes 'Ἐξαγαγέτω τὰ ὕδατα ἑρπετὰ ψυχῶν ζωσῶν', annotated at Genesis 1:20, and carries
    1:21 and 1:22; the third and fifth carry 1:22 and 1:24; the fifth quotes 'Ἐξαγαγέτω ἡ γῆ ψυχὴν
    ζῶσαν κατὰ γένος'; the sixth and seventh are on 'ποιήσωμεν ἄνθρωπον' at 1:26; and the tenth
    closes on 1:31. The pointers to Genesis 18, 22 and 26 are illustrations from Abraham and Isaac.
- passage_id: passage.severian-of-gabala.in-cosmogoniam-homiliae.pta-grc1-2018.homilia-5
  work_id: work.severian-of-gabala.in-cosmogoniam-homiliae
  work_alias:
    author: Severian of Gabala
    work: In cosmogoniam homiliae sex
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 26
    last_chapter: 2
    last_verse: 25
  basis: The homily is titled on the fifth day and expounds the making of man and paradise. Its
    fourth chapter opens by quoting 'Ποιήσωμεν ἄνθρωπον κατ' εἰκόνα ἡμετέραν', annotated at Genesis
    1:26, and the fifth to ninth carry 2:7, 2:8, 2:9, 2:10, 2:12, 2:15, 2:17, 2:19, 2:21, 2:22,
    2:23, 2:24 and 2:25 in that order — the breathing of the soul, the four rivers, the trees of
    the garden, the rib and the woman, and the two of them naked and unashamed. The extent crosses
    the chapter boundary and is stored once. Its pointers to Genesis 3:23-24 and 8:21 are forward
    references.
- passage_id: passage.severian-of-gabala.in-cosmogoniam-homiliae.pta-grc1-2018.homilia-6
  work_id: work.severian-of-gabala.in-cosmogoniam-homiliae
  work_alias:
    author: Severian of Gabala
    work: In cosmogoniam homiliae sex
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 3
    first_verse: 1
    last_chapter: 3
    last_verse: 24
  basis: 'The homily is titled on the sixth day and the first-formed and the serpent and the tree
    of knowledge and the sojourn in paradise, and its first chapter opens by saying the subject
    of paradise begun in the last homily will now be finished. The edition''s annotation runs through
    Genesis 3 continuously and completely: 3:1 in the first and third chapters, then 3:2 to 3:7
    in the third, fifth and sixth, 3:8 to 3:12 and 3:21 in the seventh, 3:13 to 3:19 in the eighth,
    3:14 and 3:16 in the ninth, 3:16 to 3:19 in the tenth, and 3:24 in the first. Its recollections
    of Genesis 2:9 to 2:25 are back-references to the homily before it and do not widen the extent.'
