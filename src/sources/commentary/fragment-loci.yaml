- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-9
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 18
    last_chapter: 2
    last_verse: 24
  basis: The argument states the book treats chapter 2 verse 18, "Non est bonum hominem esse solum",
