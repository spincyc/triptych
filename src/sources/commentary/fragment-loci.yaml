  basis: Section 1 states that the works of the first day have been recounted and that this
    is the second day. The homily expounds "let there be a firmament in the midst of the waters"
    and closes on the firmament being called Heaven, which is Genesis 1:6 to 1:8. Its recollection
    of the light of 1:3 is a back-reference and does not widen the extent.
- passage_id: passage.nicene-and-post-nicene-fathers.series-2-volume-8.new-york-1895.basil-hexaemeron-4
