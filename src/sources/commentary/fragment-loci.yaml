  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 1
    last_chapter: 1
    last_verse: 5
  basis: 'Migne prints the Maurist argument at the head of the book: it expounds the beginning of Genesis,
    chapter 1 verse 1, "In principio fecit Deus coelum et terram", as far as verse 5, "Et vocavit Deus
    lucem diem". The extent is that argument and not an inference from the text.'
