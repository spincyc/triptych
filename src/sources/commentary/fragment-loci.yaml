- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-6
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 7
    last_chapter: 2
    last_verse: 7
  basis: The argument states the book treats chapter 2 verse 7, "Et finxit Deus hominem pulverem
    de terra", asking how and when man was formed of the slime, and speaking of Adam's body while
    deferring the soul. One verse, and the book says so.
- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-7
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 7
    last_chapter: 2
    last_verse: 7
  basis: The argument states the book treats the same chapter 2 verse 7, "Et flavit in faciem ejus
    flatum vitae", at length concerning the soul. Two books on one verse is what the printing says,
    and neither is widened to make them look different.
- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-8
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  numbering: vulgate
  extent:
