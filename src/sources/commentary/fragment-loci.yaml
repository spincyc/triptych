# Which scripture each held commentary fragment comments on.
#
# The missing edge. A `passage` record in the source library already holds a
# commentary fragment's text, its edition, its rights and its locator, and it is
# validated against hash-pinned bytes. What it cannot say is *what scripture the
# fragment is about*. Its `locus` is an address in the commentary's own work
# ("11.7" is book eleven, chapter seven of De civitate Dei), and `context` is
# prose. So there is no way to ask "every fragment commenting on Genesis 1", and
# that inverted index is the whole machinery of the catena.
#
# This file is that edge and nothing else. It adds no field to any source
# record, so no artifact manifest changes, no `source_fingerprint` moves, and
# none of the pinned research bindings acquires a review obligation.
#
# Each row also carries the reconciliation `src/sources/commentary/README.md`
# asks for and nothing has performed: `work_id` is the source-library identity
# and `work_alias` is the harvest identity, and `catena check` fails unless they
# name the same author. Every `work_id` in `passage-commentary-index.yaml` is
# still null, so this is the first place the two identity spaces meet.
#
# Rules, from `guidance/catena.md`:
#   Rule 3  `extent` is in CANONICAL (Vulgate) numbering, always, and says so.
#   Rule 5  the extent is the range the commentator actually addressed; the
#           chapter view is derived from it and stored nowhere.
#   Rule 6  an extent may cross a chapter boundary. It is never split there.
#   Rule 7  the date is the date of the text. It is READ FROM THE WORK RECORD's
#           `composed` field and is not restated here: `guidance/sources.md`
#           settles that a work is dated by when it was written and an edition
#           by when it was printed or translated, and `catena check` refuses a
#           `text_date` that merely agrees with what the work already states.
#           `text_date` survives for the two cases that need it — a text whose
#           date is not its claimed author's, and a work whose record cannot yet
#           carry `composed` — and each such row says which it is.
#   Rule 8  `catena check` refuses a fragment whose work-alias group has a
#           canonical title naming a book the group does not everywhere name.
#
# The author is derived and never stored: it is the `responsible` of the
# work record `work_id` names. `work_alias.author` is half of the key into
# `work-aliases.yaml`, not a second copy, and the two must agree.
#
# WHERE THE EXTENTS COME FROM. Not from reading the Latin and judging it. Every
# extent below is the printing's own statement of what its block expounds, read
# by `scripts/_lemmata.py`, which consults no model and reaches no network:
# Angelomus and Remigius head each block `VERS. 11-13.`, Jerome heads each
# quaestio `(Cap. II.—Vers. 8.)`, Alcuin's answers carry Migne's `(Gen. II, 7)`,
# and Bede's paragraphs open with the Vulgate lemma itself. Where the printing's
# CAPUT markers are stale — they are missing at Genesis 5 in both Angelomus and
# Remigius, at 30 in Angelomus, at 43 in Remigius and at 50 in both — the lemma
# overrules them, and every fragment's `basis` says which settled it.
#
# Severian's Greek is annotated by its editors with Septuagint references rather
# than Vulgate ones. Genesis is not a book the two numberings divide differently,
# unlike the Psalter and Jeremiah; the references are read as they stand and the
# extents are declared `vulgate` because that is what `_projection.CANONICAL` is.
# The Two identity spaces name some people differently, and where they do the
# equivalence is declared and reasoned rather than matched by resemblance. The
# source library names a person as its work records do; the harvest names them
# as the runs did. Neither is wrong and a validator cannot tell "Basil the
# Great" from "Basil of Caesarea" without being told.
author_aliases:
- source_library: Basil of Caesarea
  harvest: Basil the Great
  reason: One person. The library names bishops by see and the harvest took the epithet the runs
    used. Both name the Cappadocian who died in 379.
