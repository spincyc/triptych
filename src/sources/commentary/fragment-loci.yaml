  text_date: 379
  text_date_basis: Written about 379, soon after Basil's death in January of that year, as
    the supplement his brother's Hexaemeron left undone. The date is the treatise's, not that
    of the 1893 translation which carries it.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 26
    last_chapter: 1
    last_verse: 27
  basis: The treatise expounds one utterance and its accomplishment. Chapter XVI is a contemplation
    of "let us make man after our image and likeness" and the surrounding chapters turn on
    "God created man, in the image of God created he him; male and female created he them",
    which are Genesis 1:26 and 1:27; between them those two verses are quoted nineteen times
    and no other verse of Genesis is expounded at all. The single mention of the tree of life
    in chapter XX is an allusion inside an argument about the life in paradise, not an exposition
    of Genesis 2, so the extent is not widened to it.
