    first_chapter: 4
    first_verse: 1
    last_chapter: 4
    last_verse: 14
  basis: Volume I breaks off inside the fourth chapter. Its lemmata run from verse 1 to verse 14,
    under the printed part-headings on the birth, marriage and offerings of Cain and Abel. The rest
    of the chapter is in volume II and stands here as its own fragment.
- passage_id: passage.martin-luther.lectures-on-genesis.lenker-minneapolis-1904.genesis-4-volume-2
  work_id: work.martin-luther.lectures-on-genesis
  work_alias:
    author: Martin Luther
    work: Lectures on Genesis
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 4
    first_verse: 8
    last_chapter: 4
    last_verse: 26
  basis: 'Volume II resumes the fourth chapter at its Part IV, "Cain murders his brother; called
    to account", and its lemmata run from verse 8 to verse 26. It overlaps volume I at verses 8
    to 14 because the two volumes divide the chapter there, and the overlap is left standing rather
    than trimmed: trimming would cut a printed part in half.'
- passage_id: passage.martin-luther.lectures-on-genesis.lenker-minneapolis-1904.genesis-5
  work_id: work.martin-luther.lectures-on-genesis
  work_alias:
    author: Martin Luther
    work: Lectures on Genesis
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 5
    first_verse: 1
    last_chapter: 5
    last_verse: 31
  basis: The printed lemmata run the whole chapter. The last of them is verse 32 in the English
    numbering Lenker prints, and the Clementine Vulgate this project anchors in ends the chapter
    at verse 31; Rule 3 stores the CANONICAL address, so the extent is stated at 5:31 and the printing's
    own last lemma is recorded here rather than silently renumbered.
