    first_chapter: 1
    first_verse: 2
    last_chapter: 1
    last_verse: 5
  basis: The lemma is "the earth was invisible and unfinished", which is Genesis 1:2 in the
    Septuagint reading the homily follows. It runs on through the Spirit borne upon the waters,
    the making of light and its division from the darkness, and closes in section 8 on "and
    the evening and the morning were one day", which is Genesis 1:5.
