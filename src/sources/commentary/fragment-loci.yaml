  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 1
    last_chapter: 1
    last_verse: 1
  basis: 'The first homily is the proem and the exposition of "In the beginning God made the
    heaven and the earth", which it quotes and expounds at length. It reaches no further verse:
    Homily III opens by saying the works of the first day have been recounted, so nothing
    between 1:2 and 1:5 belongs here.'
