  constituent_of: edition.nicene-and-post-nicene-fathers.series-2-volume-8.new-york-1895
  text_date: 378
  text_date_basis: Delivered at Caesarea in Lent 378, two years before Basil's death.
    The date is the homilies' delivery, not the 1895 translation that carries them.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 1
    last_chapter: 1
    last_verse: 1
  basis: The first homily is the proem and the exposition of "In the beginning God
    made the heaven and the earth", which it quotes and expounds at length. It reaches
    no further verse. The series as a whole stops at Genesis 1:26 and the ninth homily
    breaks off before the creation of man, so nothing here may be extended past that.

- passage_id: passage.augustine.de-civitate-dei.dods-1871.11.6
  work_id: work.augustine.de-civitate-dei
  work_alias:
    author: Augustine of Hippo
    work: De civitate Dei
  text_date: 417
  text_date_basis: Books XI-XIV were issued about 417; the whole work was finished in
    426 and Augustine died in 430. The date of this text is the first of the three.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 1
    last_chapter: 2
    last_verse: 2
  basis: The excerpt opens on "in the beginning God created the heavens and the earth,
    in order that it may be understood that He had made nothing previously" and closes
    on "the sixth day, all things which God then made were finished, and on the seventh
    the rest of God was mysteriously and sublimely signalized". It therefore runs from
    Genesis 1:1 to Genesis 2:2 and crosses the chapter boundary.
- passage_id: passage.augustine.de-civitate-dei.dods-1871.11.7
  work_id: work.augustine.de-civitate-dei
  work_alias:
    author: Augustine of Hippo
    work: De civitate Dei
  text_date: 417
  text_date_basis: Books XI-XIV were issued about 417; the whole work was finished in
    426 and Augustine died in 430. The date of this text is the first of the three.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 3
    last_chapter: 1
    last_verse: 5
  basis: The excerpt expounds "light was made by the word of God, and God, we read,
    separated it from the darkness, and called the light Day, and the darkness Night",
    which is Genesis 1:3-5. The fourth day is named only as the premise that the sun
    did not yet exist, so Genesis 1:14-19 is outside the extent.
- passage_id: passage.augustine.de-civitate-dei.dods-1871.11.19
  work_id: work.augustine.de-civitate-dei
  work_alias:
    author: Augustine of Hippo
    work: De civitate Dei
  text_date: 417
  text_date_basis: Books XI-XIV were issued about 417; the whole work was finished in
    426 and Augustine died in 430. The date of this text is the first of the three.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 1
    first_verse: 4
    last_chapter: 1
    last_verse: 5
  basis: The excerpt quotes "God divided the light from the darkness; and God called
    the light Day, and the darkness He called Night" and reads it of the separation
    of the angels. That is Genesis 1:4-5. The chapter's later appeal to the luminaries
    of the fourth day is a contrast drawn against the reading and is not expounded.

