    reviews it in the Retractationes as long in the making. The date is the composition of the work, not
    Migne's printing of 1841.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 25
    last_chapter: 3
    last_verse: 24
  basis: The argument states the book treats chapter 2 verse 25, "Et erant nudi", and the whole of chapter
    3. It therefore spans the boundary between the second and third chapters and stands under both at
    its full extent.
- passage_id: passage.augustine.de-genesi-ad-litteram.migne-pl-34.liber-12
  work_id: work.augustine.de-genesi-ad-litteram
  work_alias:
    author: Augustine of Hippo
    work: De Genesi ad litteram
  text_date: 415
  text_date_basis: Written between about 401 and 415 and issued as a whole at the end of that span; Augustine
    reviews it in the Retractationes as long in the making. The date is the composition of the work, not
    Migne's printing of 1841.
  numbering: vulgate
  extent:
    token: Gen
    first_chapter: 2
    first_verse: 8
    last_chapter: 2
    last_verse: 8
  basis: THE ARGUMENT NAMES NO VERSE. It reads "In quo de paradiso et tertio coelo quo raptus est Paulus,
    deque multiplici visionum genere disputatur", and the greater part of the book is on 2 Corinthians
    12 and on the kinds of vision. The extent is declared at Genesis 2:8, where paradise is planted, because
    that is the Genesis question the book argues from; the anchor is this project's inference and not
    Migne's.
