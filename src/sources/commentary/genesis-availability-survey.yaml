landed:
- work: Basil of Caesarea, Homiliae in Hexaemeron
  fragments: 9
  extent: Genesis 1:1 to 1:26
  language: en
  edition: NPNF second series volume 8, New York 1895, tr. Blomfield Jackson
  note: Landed by the pilot lane from Wikisource NPNF 2-8; not re-acquired here.
- work: Basil of Caesarea, Homiliae in Hexaemeron
  fragments: 9
  extent: Genesis 1:1 to 1:26
  language: la
  edition: Metaphrasis Latina Hexaemeri, Eustathius, Migne PL 53, Paris 1847
  note: 'Landed by THIS lane. The ancient Latin version of Basil, made for the deaconess Syncletica about 440, and
    the form in which the Hexaemeron reached the West — Bede''s own preface names it. Registered as a SECOND EDITION
    of the same work, never as a second text on one edition, so the page can offer a reader Basil in either language.
    Its nine books answer the nine homilies, and the correspondence was checked from the Latin''s own lemmata rather
    than assumed from the numbering: LIBER IV is titled De congregatione aquarum, VII quotes Ejiciant aquae reptilia,
    IX closes on Faciamus hominem.'
- work: Augustine of Hippo, De Genesi ad litteram
  fragments: 12
  extent: Genesis 1:1 to 3:24
  language: la
  edition: Patrologia Latina 34, Paris 1841
  note: 'Landed by THIS lane, all twelve books. Each book''s extent is the Maurist argument Migne prints at its
    head, quoted in the fragment''s basis, EXCEPT books X and XI-XII: book X''s argument names no verse of Genesis
    and book XII''s names none either, and both are anchored by this project''s stated inference rather than by
    the printing. Held in Latin ONLY: the first complete English is J. H. Taylor''s of 1982 and is in copyright.'
- work: Gregory of Nyssa, De hominis opificio
  fragments: 1
  extent: Genesis 1:26 to 1:27
  language: en
  edition: NPNF second series volume 5, New York 1893
  note: Landed by the pilot lane; one passage holding the whole thirty-chapter treatise.
- work: Augustine of Hippo, De civitate Dei
  fragments: 3
  extent: Genesis 1
  language: en
  edition: Dods, Edinburgh 1871
  note: Landed by another lane before this one; counted here because it renders in the Genesis catena.
- work: Martin Luther, Enarrationes in Genesin
  fragments: 10
  extent: Genesis 1:2 to 9:29
  language: en
  edition: Lenker, Minneapolis 1904 and 1910, two volumes
  note: 'Registered as a holding by the previous lane with ZERO fragments because the catena file could not carry
    them; the fragments land here now that it is split. Each is bounded by the lemmata Lenker''s printing actually
    prints, so Genesis 1 stops at verse 30 and Genesis 3 at verse 23. Genesis 4 stands as two fragments because
    the two volumes divide the chapter inside it and the printed parts overlap at verses 8 to 14; the overlap is
    left standing rather than trimmed. Held in English only, and only to Genesis 9: the rest of Luther''s course
    reaches English solely in the copyrighted American Edition.'
- work: Ambrose of Milan, Hexameron
  fragments: 6
  extent: Genesis 1 to 2
  language: la
  edition: Patrologia Latina 14, Paris 1845
  note: Landed by THIS lane, all six books, one to a day of creation. The Maurist arguments Migne prints over each
    caput are topical rather than verse-keyed, so each book's extent is taken from the day it expounds and from
    the lemmata it quotes, both quoted in the fragment's basis. Book III closes at 1:12 and not 1:13, because the
    evening-and-morning formula is absent from it; book VI reaches 2:2, because its last chapter expounds God's
    rest.
- work: Bede, In principium Genesis
  fragments: 314
  extent: Genesis 1 to 21
  language: la
  edition: Patrologia Latina 91, Paris 1850
  note: 'Landed by THIS lane. Migne''s printing marks neither chapter nor verse anywhere: every paragraph opens
    with the Vulgate lemma it expounds, so the fragments are the lemmata, placed by fitting the whole commentary
    as one non-decreasing walk through Genesis. Reading each paragraph on its own and keeping a running maximum
    - the obvious method, and the one tried first - produced a first book claiming Genesis 1, 2 and 5 and never
    3 or 4, with every verse number in it right.'
- work: Jerome, Liber quaestionum hebraicarum in Genesim
  fragments: 218
  extent: Genesis 1 to 49
  language: la
  edition: Patrologia Latina 23, Paris 1845, reprinting Vallarsi and Maffei 1767
  note: 'Landed by THIS lane, one fragment per quaestio, each bounded by the printing''s own (Cap. II.-Vers. 8.).
    The Hebrew and Greek words the work exists to compare were being DELETED by the transcriber, which held them
    inside wiki templates it removed whole, and it exited zero: the work came out reading ''Pro paradiso, in Hebraeo
    hortum habet: id est, ().'' scripts/migne_transcribe.py now unwraps a closed table of prose-bearing templates
    and its --census flag prints an export''s template names so the next corpus is read before its bytes are kept.'
- work: Alcuin of York, Interrogationes et responsiones in Genesim
  fragments: 115
  extent: Genesis 1 to 48
  language: la
  edition: Patrologia Latina 100, Paris 1851
  note: Landed by THIS lane, all 280 questions held as passages. Only the 115 that carry Migne's own (Gen. II, 7)
    reference are given an extent and appear under a chapter; the other 165 name no verse and are recorded as naming
    none. Supplying one would be the reference that resolves successfully and wrongly.
- work: Angelomus of Luxeuil, Commentarius in Genesim
  fragments: 253
  extent: Genesis 1 to 50
  language: la
  edition: Patrologia Latina 115, Paris 1852
  note: Landed by THIS lane, one fragment per VERS. 11-13. block. The printing's CAPUT markers are the chapter and
    are MISSING at Genesis 5, 30 and 50, so believing them would have filed Adam's genealogy under Cain's chapter
    and Joseph's death under Jacob's blessing, with every check passing. Each block's chapter is therefore checked
    against its own lemma matched to the Clementine, and the disposition is recorded on every fragment.
- work: Remigius of Auxerre, Commentarius in Genesim
  fragments: 395
  extent: Genesis 1 to 50
  language: la
  edition: Patrologia Latina 131, Paris 1853
  note: Landed by THIS lane, one fragment per gloss. The CAPUT marker is missing at Genesis 5 and 50, and at Genesis
    43 the running head prints a bare XLIII. over a lemma that is Genesis 42:1 - a chapter number that is right
    about the page and wrong about the block under it.
- work: Severian of Gabala, In cosmogoniam homiliae sex
  fragments: 6
  extent: Genesis 1 to 3
  language: grc
  edition: Patristic Text Archive pta-grc1, Berlin-Brandenburgische Akademie der Wissenschaften 2018, over Migne
    PG 56, Paris 1862
  note: 'Landed by THIS lane and THE FIRST GREEK THIS LIBRARY HOLDS. The previous pass of this survey found the
    route, priced it, and did not take it. Each homily is bounded by its own title and by the editors'' biblical
    annotation, and the two disagree: the homily titled on the fourth day expounds the fifth and sixth, and the
    one titled on the fifth expounds the making of man and the whole of the garden. The extent follows the exposition.
    The archive''s licence is per file and was read per file: these six are CC BY-SA 4.0, not the CC BY 4.0 this
    survey previously recorded for the archive as a whole, and the ShareAlike obligation is recorded in THIRD_PARTY.md.'
verified_by_fetching_bytes:
- work: Nicholas of Lyra, Postilla litteralis super totam Bibliam
  index_rank: 1st, 50/50 chapters, confidence 1.00
  prior_claim: no machine-readable text in any language
  finding: CONFIRMED for Genesis.
  evidence: Two Internet Archive items carry a text layer. postillasupertot00nich is 7,781 bytes of blackletter
    incunabulum OCR scoring 0.06 on the Latin function-word measure against 0.24 for a Migne scan, and it covers
    Proverbs, Ecclesiastes and Canticles, not Genesis. Item5.5_25 is 3,322 bytes of a Digital Scriptorium catalogue
    card for a single cropped leaf with zero images available. Neither is a text and neither is Genesis.
- work: Hugh of Saint-Cher, Postillae in universa Biblia
  index_rank: joint 1st by confidence, 44/50 chapters
  prior_claim: no machine-readable text in any language
  finding: OVERTURNED as to the work, CONFIRMED as to Genesis.
  evidence: 'The Lyons Opera omnia IS digitised with a usable Latin text layer: bub_gb_xXJxILOIgIIC (1669) is 8.17
    MB scoring 0.138 Latin, Public Domain Mark 1.0. But the four items held are tomus secundus (the Psalter), tomus
    quartus (Isaiah and Jeremiah) and tomus sextus twice (the Gospels). Tomus primus, which holds Genesis, is not
    among them. The work is reachable; its Genesis volume is not.'
- work: Denis the Carthusian, Enarrationes in Genesim
  index_rank: 3rd, 50/50 chapters
  prior_claim: no machine-readable text in any language
  finding: OVERTURNED as to the work, CONFIRMED as to Genesis.
  evidence: 'The 1896-1935 Montreuil Opera omnia is digitised with a good Latin text layer: doctorisecstati01denigoog
    is 2.71 MB scoring 0.262 Latin. But the tomes on the Archive run t.19 to t.25, which are the later volumes;
    volume 1, the Enarratio in Genesim, is not among them. Rights on these items are unresolved: no licenceurl and
    no rights field, so they could not be tracked even if the right volume were there.'
- work: Augustine of Hippo, De Genesi ad litteram
  prior_claim: the hashed Migne PL 34 OCR is unreachable by the retrieval route
  finding: OVERTURNED.
  evidence: patrologiae_cursus_completus_lat_vol_034_djvu.txt is 4.6 MB and downloads whole with curl in under a
    minute, scoring 0.245 on the Latin measure. The pilot's finding that it 'truncates to its front matter' was
    a property of the model-mediated route, not of the file. Its OCR is still roughly one corrupted word in eight,
    so it remains a finding aid and not publishable text - but it is reachable, and the two statements are different.
size_finding:
  measured_on: '2026-08-01'
  file: src/web/data/structure/catena/Gen.json
  total_bytes: 605923
  fragments_bytes: 459992
  leads_bytes: 119218
  fragment_metadata_only_bytes: 15590
  largest_single_fragment_bytes: 204430
  fragments_held: 13
  chapters_those_fragments_touch: 1
  problem: All thirteen fragments sit on Genesis 1, and the browser fetches the whole book file to render any of
    the fifty chapters. A reader on Genesis 40 downloads 606 KB to be shown nothing. Luther alone, now held, is
    1.68 MB of text; wiring it in unsplit would make Gen.json 2.3 MB, and the 84 works of the index would make it
    tens of megabytes.
  proposed_split: 'Keep <Token>.json as a spine holding token, name, chapters, numbering, leads, refusals, blocked,
    and each fragment''s METADATA only - id, work, author, date, extent, edition, language, rights, locator. Move
    each fragment''s `text` to its own file, catena/text/<passage_id>.json, fetched only when a chapter the fragment
    touches is displayed. Measured effect on Genesis today: the spine is about 135 KB against 606 KB now, so chapters
    2 to 50 fetch 22 per cent of what they fetch today, and chapter 1 fetches the spine plus only the texts it actually
    renders. This keeps both constraints browser-core.js sets: counts stay ADDITIVE, because one fragment is one
    file and a translation of a fragment is another fragment and so another file, and the join stays at READ TIME
    in the browser. Per-chapter text files were rejected: a fragment spanning chapters would be written into each,
    which is the multiplication that header forbids and which Rule 6 forbids for a second reason - it would split
    words written about one chapter into another.'
  status: IMPLEMENTED 2026-08-01, and in a stronger form than proposed. See guidance/web-data.md.
  implemented:
    layout: structure/catena/<NN-book>/<chapter>.json is the chapter spine and carries no prose; structure/catena/text/<passage_id>.json
      is one fragment, stored once and fetched when the reader opens it. Paths are lowercase, numbered by the canon
      so a listing reads as the Bible, and zero-padded so they sort.
    why_two_addressings: Addressed BY chapter a spanning fragment is NAMED under both chapters, which is what the
      page promises; storing its TEXT by chapter would WRITE it into both, which is the multiplication browser-core.js
      forbids and which Rule 6 forbids a second time. So the spine is chapter-addressed and the payload is content-addressed.
    before_bytes_any_chapter: 605923
    after_bytes_genesis_40: 2745
    after_median_chapter_spine: 2965
    after_worst_chapter_spine: 26148
    after_bytes_to_open_one_fragment_median: 43835
    after_bytes_to_open_one_fragment_worst: 286251
    note: Measured after 31 further fragments landed, so the after-figures are against a corpus more than three
      times the size of the one that produced the 606 KB. A chapter with nothing at all now has a file only because
      every Genesis chapter carries leads; a chapter with neither would have none, and index.json says which chapters
      have one.
rights_note: 'Of 327 catalogue candidates examined, the ones carrying a text layer split into an affirmative public-domain
  or Creative Commons statement and a majority carrying NO rights field at all. 34 of 66 works have at least one
  text-bearing item with an affirmative basis. The rest are not ''in copyright'' and are not ''free'': they are
  unresolved, and guidance/sources.md forbids tracking on an unresolved basis however old the author.'
