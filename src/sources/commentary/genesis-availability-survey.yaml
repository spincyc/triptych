schema: triptych-genesis-availability-survey/v1
updated: '2026-08-01'
question: for each work the promoted index names on Genesis 1-50, is there a reachable text, and may it be redistributed
driven_by: src/sources/commentary/genesis-work-aliases.yaml
probe: scripts/_availability.py then scripts/_reachability.py; neither consults a model
method_note: 'Every query was issued from the recorded aliases and from nothing else, so a name absent from the
  alias table was not tried. Rights were read per item from the item''s own metadata and never inferred from the
  author''s dates: an item with no licenceurl and no rights field is recorded `unresolved`, which is not the same
  as free and not the same as in copyright.'
bound_note: '`reachable: text` means at least one Internet Archive item whose title overlaps the work''s aliases
  carries a machine-readable text layer. It is an UPPER BOUND on reachability and not a confirmed holding: it does
  not establish that the item is this work, nor that it is the volume containing Genesis. Three of the highest-ranked
  were checked by fetching the bytes and two of those three fall inside this gap - see `verified_by_fetching_bytes`.
  Every other row is a lead until its bytes are pulled.'
