  - tlg2040 (Basil)
  - tlg2062 (Chrysostom)
  - tlg2017 (Gregory of Nyssa)
  - tlg4089 (Theodoret)
  routes_examined:
  - route: Greek Wikisource
    finding: no patristic commentary on Genesis. The Hexaemeron searches return Cosmas Indicopleustes, Eusebius
      and Philo, and the Basil results are the Books of Kingdoms and a funeral oration.
  - route: OpenGreekAndLatin/First1KGreek (CC BY-SA 4.0)
    finding: 312 author directories and none of tlg2040, tlg2062 or tlg2017. tlg4089 (Theodoret) is present but
      holds only tlg003 and tlg004, not the Quaestiones in Octateuchum.
  - route: Patristic Text Archive (CC BY 4.0)
    finding: pta0001 IS Severian of Gabala, whose In cosmogoniam homiliae sex the index names on Genesis, and the
      archive carries In Genesim sermo 1 and 2, De sacrificiis Caini, De serpente homilia, Quomodo animam acceperit
      Adamus, In Noe et filios eius and Homilia de Noe et de arca. This is a real and licensed Greek route on Genesis
      and it was found but NOT landed in this lane.
  - route: Migne PG on the Internet Archive
    finding: facsimiles exist; the polytonic OCR is not usable text, which is the same finding the Latin scans gave
      and which the keyed corpora answered for Latin.
  conclusion: 'CLOSED 2026-08-01. The Patristic Text Archive route was taken and Severian''s six homilies In cosmogoniam
    are held in Greek: the library''s first. The archive''s rights are PER FILE and this survey''s earlier note
    that it is CC BY 4.0 is true of some of its files and false of these, which are CC BY-SA 4.0 and carry a ShareAlike
    obligation now recorded in THIRD_PARTY.md. The rest of the bounded negative stands: Greek Wikisource still carries
    no patristic Genesis commentary, First1KGreek still holds none of Basil, Chrysostom or Gregory of Nyssa, and
    Migne''s PG on the Internet Archive is still OCR that is not usable text. What has changed is that one route
    through it is proven.'
  also_reachable_not_yet_landed:
  - 'Severian''s other Genesis homilies stand in the same archive and are not landed: In Genesim sermo 1 (pta044)
    and sermo 2 (pta013), Quomodo animam acceperit Adamus (pta010), De serpente homilia (pta011), De sacrificiis
    Caini (pta024), In Noe et filios eius (pta036), Homilia de Noe et de arca (pta043) and In illud: Secundum imaginem
    et similitudinem (pta038). Their rights differ file by file - pta024, pta036, pta043 and pta038 are CC BY 4.0
    and the rest CC BY-SA 4.0 - and each would need reading before its extents could be declared. The route is now
    proven; what remains for them is reading.'
