languages_held:
  question: in which languages is each landed work held, and in which is it not
  rule: A translation is a separate EDITION of the same work with its own artifact and its own rights, never a second
    text on one edition. That is what lets a father's Greek be publishable while a modern English of him is not,
    and it is what the commentary-language selector on the page reads.
  basil-hexaemeron:
    held:
    - en
    - la
    not_held:
    - grc
    greek_note: The Greek original is NOT held. Latin Wikisource and English Wikisource both carry the work; Greek
      Wikisource does not — searched under Ἑξαήμερον, Εἰς τὴν Ἑξαήμερον, Βασίλειος and Γένεσιν, 4 queries, no patristic
      Hexaemeron among the results. The Open Greek and Latin First1KGreek corpus, which is CC BY-SA 4.0 and would
      be a usable basis, carries no tlg2040 directory at all. Migne PG 29 is on the Internet Archive but its polytonic
      OCR is not usable text. So the Greek is reachable in facsimile and not in transcription, which is a different
      statement from unavailable.
  augustine-de-genesi-ad-litteram:
    held:
    - la
    not_held:
    - en
    english_note: No public-domain English exists. The first complete translation is J. H. Taylor's, Ancient Christian
      Writers 41 to 42, 1982, in copyright until 2078 in a life-plus-seventy jurisdiction. This is the finding the
      pilot's licence survey made across the board and it is not a gap more effort closes.
  augustine-de-civitate-dei:
    held:
    - en
    not_held:
    - la
    latin_note: The Latin of PL 41 was not pursued in this lane. It is on Latin Wikisource under Patrologia Latina/41
      and is the same Corpus Corporum keyed corpus as the two Latin works landed here, so it is a short step and
      is recorded as one.
  gregory-de-hominis-opificio:
    held:
    - en
    not_held:
    - grc
    - la
    note: Neither the Greek nor the Latin was pursued. The same Greek difficulty as Basil applies.
  luther-lectures-on-genesis:
    held:
    - en
    not_held:
    - la
    - de
    note: The lectures were delivered and printed in Latin, and the Weimar edition's Latin is the scholarly text;
      no public-domain digital Latin of it was located in this lane and none was searched for beyond the alias table.
latin_corpus_finding:
  measured_on: '2026-08-01'
  overturns: guidance/catena.md's finding that 'the unencumbered Latin is OCR wreckage and the clean Latin is encumbered',
    which measured Migne PL 34's Internet Archive text layer at roughly one corrupted word in eight and concluded
    that for the Latin-only works 'the cost is transcription, not download'.
  finding: 'TRUE OF THE SCAN, FALSE OF THE VOLUME. Latin Wikisource carries the University of Zurich''s Corpus Corporum
    TEI encodings of Migne, keyed rather than scanned, republished under a CC BY-SA 4.0 markup licence over a public-domain
    1841-1849 printing. The text is therefore both clean AND unencumbered, and no transcription project is needed
    for these works: they download whole through Special:Export in one request.'
  licence_route: Latin Wikisource states its contributor licence through its own API (action=query&meta=siteinfo&siprop=rightsinfo)
    as Creative Commons Attribution-Share Alike 4.0. That response was fetched and hashed BEFORE any payload was
    kept, which is the order guidance/sources.md requires.
  transformation: scripts/migne_transcribe.py, a declared and re-runnable transformation. It removes the wiki templates
    whole by counting braces, the Patrologia Latina navigation line, the Corpus Corporum encoding note, categories,
    footnotes, tags and headings, and Migne's inline column markers; it consults no model and reaches no network.
  also_reachable_not_yet_landed: 'CLOSED 2026-08-01. All six were landed: Ambrose, Bede, Jerome, Alcuin, Angelomus
    and Remigius. What the previous lane called reading rather than retrieval was the whole of the work, and it
    turned up two defects retrieval alone would never have shown - a transcriber that deleted Jerome''s Hebrew and
    exited zero, and Migne''s own CAPUT markers missing at five places across two commentaries. The six exports
    were re-fetched rather than assumed: every page stood at the revision this file recorded, and the two already
    landed works re-derived to their landed hashes byte for byte.'
  retrieved_whole_and_hashed: All six were retrieved in one Special:Export request together with the two landed
    works, 2,035,058 bytes, sha256 b32b189628e77b2f11378c8e68dbd27742b58aec3a4c7f89b7fbc2312bde42ef, on 2026-08-01.
    They are NOT landed because each still needs its scriptural extents determined from its own text, which is editorial
    work and not retrieval. The bytes are reachable and the route is proven; what remains is reading them.
