  extent: Genesis 1
  language: en
  note: Landed by another lane before this one; counted here because it renders in the Genesis catena.
verified_by_fetching_bytes:
- work: Nicholas of Lyra, Postilla litteralis super totam Bibliam
  index_rank: 1st, 50/50 chapters, confidence 1.00
  prior_claim: no machine-readable text in any language
  finding: CONFIRMED for Genesis.
  evidence: Two Internet Archive items carry a text layer. postillasupertot00nich is 7,781 bytes of
    blackletter incunabulum OCR scoring 0.06 on the Latin function-word measure against 0.24 for a Migne
    scan, and it covers Proverbs, Ecclesiastes and Canticles, not Genesis. Item5.5_25 is 3,322 bytes
    of a Digital Scriptorium catalogue card for a single cropped leaf with zero images available. Neither
    is a text and neither is Genesis.
- work: Hugh of Saint-Cher, Postillae in universa Biblia
  index_rank: joint 1st by confidence, 44/50 chapters
  prior_claim: no machine-readable text in any language
  finding: OVERTURNED as to the work, CONFIRMED as to Genesis.
  evidence: 'The Lyons Opera omnia IS digitised with a usable Latin text layer: bub_gb_xXJxILOIgIIC
    (1669) is 8.17 MB scoring 0.138 Latin, Public Domain Mark 1.0. But the four items held are tomus
    secundus (the Psalter), tomus quartus (Isaiah and Jeremiah) and tomus sextus twice (the Gospels).
    Tomus primus, which holds Genesis, is not among them. The work is reachable; its Genesis volume
    is not.'
- work: Denis the Carthusian, Enarrationes in Genesim
  index_rank: 3rd, 50/50 chapters
  prior_claim: no machine-readable text in any language
  finding: OVERTURNED as to the work, CONFIRMED as to Genesis.
  evidence: 'The 1896-1935 Montreuil Opera omnia is digitised with a good Latin text layer: doctorisecstati01denigoog
    is 2.71 MB scoring 0.262 Latin. But the tomes on the Archive run t.19 to t.25, which are the later
    volumes; volume 1, the Enarratio in Genesim, is not among them. Rights on these items are unresolved:
    no licenceurl and no rights field, so they could not be tracked even if the right volume were there.'
- work: Augustine of Hippo, De Genesi ad litteram
  prior_claim: the hashed Migne PL 34 OCR is unreachable by the retrieval route
  finding: OVERTURNED.
  evidence: patrologiae_cursus_completus_lat_vol_034_djvu.txt is 4.6 MB and downloads whole with curl
    in under a minute, scoring 0.245 on the Latin measure. The pilot's finding that it 'truncates to
    its front matter' was a property of the model-mediated route, not of the file. Its OCR is still
    roughly one corrupted word in eight, so it remains a finding aid and not publishable text - but
    it is reachable, and the two statements are different.
size_finding:
  measured_on: '2026-08-01'
  file: src/web/data/structure/catena/Gen.json
  total_bytes: 605923
  fragments_bytes: 459992
  leads_bytes: 119218
  fragment_metadata_only_bytes: 15590
  largest_single_fragment_bytes: 204430
  fragments_held: 13
  chapters_those_fragments_touch: 1
  problem: All thirteen fragments sit on Genesis 1, and the browser fetches the whole book file to render
    any of the fifty chapters. A reader on Genesis 40 downloads 606 KB to be shown nothing. Luther alone,
    now held, is 1.68 MB of text; wiring it in unsplit would make Gen.json 2.3 MB, and the 84 works
    of the index would make it tens of megabytes.
  proposed_split: 'Keep <Token>.json as a spine holding token, name, chapters, numbering, leads, refusals,
    blocked, and each fragment''s METADATA only - id, work, author, date, extent, edition, language,
    rights, locator. Move each fragment''s `text` to its own file, catena/text/<passage_id>.json, fetched
    only when a chapter the fragment touches is displayed. Measured effect on Genesis today: the spine
    is about 135 KB against 606 KB now, so chapters 2 to 50 fetch 22 per cent of what they fetch today,
    and chapter 1 fetches the spine plus only the texts it actually renders. This keeps both constraints
    browser-core.js sets: counts stay ADDITIVE, because one fragment is one file and a translation of
    a fragment is another fragment and so another file, and the join stays at READ TIME in the browser.
    Per-chapter text files were rejected: a fragment spanning chapters would be written into each, which
    is the multiplication that header forbids and which Rule 6 forbids for a second reason - it would
    split words written about one chapter into another.'
  status: PROPOSED, not implemented. No fragment was landed that would make Gen.json larger.
rights_note: 'Of 327 catalogue candidates examined, the ones carrying a text layer split into an affirmative
  public-domain or Creative Commons statement and a majority carrying NO rights field at all. 34 of
  66 works have at least one text-bearing item with an affirmative basis. The rest are not ''in copyright''
  and are not ''free'': they are unresolved, and guidance/sources.md forbids tracking on an unresolved
  basis however old the author.'
