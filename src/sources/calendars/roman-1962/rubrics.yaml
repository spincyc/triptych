- id: the-office-of-our-lady-on-saturday-and-the-mass-it-takes
  source: RG 78; RG 91 rows 27-28; RGMR 270; RGMR 299; RG 111 d, read off the controlling
    facsimile 2026-08-01
  date: '2026-08-01'
  why: >-
    The whole of what row 27 is for, on the date that exposed it. 1 August 2026
    is a Saturday carrying a fourth-class feria, so RG 78 puts the Office of Our
    Lady on Saturday there and RG 91 gives it row 27, one above the fourth-class
    ferias. Three things follow and each was wrong before this case existed. The
    day is the Office and not the feria, so it is named as such. It is not a
    feria at all, so RGMR 299 does not reach it and it takes its own seasonal
    Mass rather than the Ninth Sunday after Pentecost's. And being a fourth-class
    day it admits two commemorations under RG 111 d, so the Machabees are
    commemorated - where a second-class Sunday's ceiling, RG 111 b, had been
    dropping them.
  expect:
    winner_row: 27
    formulary: missa-de-s-maria-in-sabbato-5
    commemorated: [comm-ss-machabaeorum-martyrum]
    orations_low_mass: 2
    settled: true
- id: a-choice-the-rubric-states-in-so-many-words
  source: the Missal's own rubric at 16 July, printed p. 587, read off the controlling
    facsimile 2026-08-01
  date: '2022-07-16'
  why: >-
    The one place in this calendar where the book says the Mass may be either of
    two, and says it in those words: Missa dici potest aut de sancta Maria in
    sabbato, aut propria de Commemoratione B. Mariae Virg. de Monte Carmelo. It
    fires only when 16 July is a Saturday whose Office is of Our Lady, which is
    15 of the 101 emitted years. The case exists to hold two things at once: that
    both arms resolve to a formulary the index actually carries, and that the day
    stays SETTLED. A choice the rubrics create is an answer, not a gap, and the
    moment it starts clearing `settled` the page will render a permission as a
    failure.
  expect:
    winner_row: 27
    settled: true
    mass_choices:
      carmel-on-a-saturday: [de-sancta-maria-in-sabbato, propria-de-commemoratione]
- id: a-feria-borrows-the-preceding-sundays-mass
  source: RGMR 299; RG 91 row 28; RG 111 d
  date: '2026-07-27'
  why: >-
    The other side of the same rule, on a weekday. A fourth-class feria after
    Pentecost is row 28 and takes the Mass of the preceding Sunday under RGMR
    299 - but it is the feria that is the day, not the Sunday. Classified as the
    Sunday it borrowed, this date stood at row 15 and its commemoration of St
    Pantaleon was dropped under the second-class Sunday's ceiling. 30 dates in
    2026 lost a commemoration that way.
  expect:
    winner_row: 28
    formulary: pentecost-9
    commemorated: [comm-s-pantaleonis-martyris]
    orations_low_mass: 2
    settled: true
# --- The Triduum of 2026, end to end -------------------------------------
# Five consecutive days, asserted on `readable` as well as on the winner,
# because the winner alone would pass a page that offered a displaced Mass as
# though it were the day's. Easter 2026 is 5 April. The same five days are
# carried in the postconciliar source, and a third missal added to this
# repository should carry them too: the Triduum is where a calendar's hardest
# claims all fall in one week, and it is the cheapest place to notice a
# regression.
- id: triduum-2026-palm-sunday
  source: RG 91 row 6; the 1962 temporal cycle
  date: '2026-03-29'
  why: a first-class Sunday of Passiontide, which nothing on the date competes with.
  expect:
    winner: palm-sunday
    winner_row: 6
    settled: true
    readable: {said: [palm-sunday]}
- id: triduum-2026-holy-thursday-offers-the-chrism-mass
  source: RG 91 row 2; the Missal's own heading at the Chrism Mass
  date: '2026-04-02'
  why: >-
    The Chrism Mass is not a competitor and must never be ranked against the
    Mass of the Lord's Supper: it is a second Mass of the same liturgical day,
    said in the cathedral that morning, and this file classifies it
    `additional-mass` with no row at all. So it is OFFERED and not ranked, and
    this case holds exactly that - `chrism-mass` under `additional`, never under
    `said`. St Francis of Paola, a third-class feast, is displaced by the day
    and may be read but is not said.
  expect:
    winner: mass-of-the-lords-supper
    winner_row: 2
    settled: true
    readable:
      said: [mass-of-the-lords-supper]
      additional: [chrism-mass]
      displaced: [s-francisci-paula-confessoris]
- id: triduum-2026-good-friday
  source: RG 91 row 2
  date: '2026-04-03'
  why: >-
    The one day of the year with no Mass in the ordinary sense. The page is
    known to break its Ordinary-interleaving frame here and to say so; that
    statement is correct behaviour and must not regress into silence.
  expect:
    winner: good-friday
    winner_row: 2
    settled: true
    readable: {said: [good-friday]}
- id: triduum-2026-holy-saturday
  source: RG 91 row 2; RG 28
  date: '2026-04-04'
  why: >-
    The Vigil is not a vigil in the sense of RG 28 - the code says so expressly,
    cum non sit dies liturgicus - and it sits in the Triduum at row 2. St Isidore
    is displaced.
  expect:
    winner: easter-vigil
    winner_row: 2
    settled: true
    readable:
      said: [easter-vigil]
      displaced: [s-isidori-episcopi-confessoris-ecclesiae-doctoris]
- id: triduum-2026-easter-sunday
  source: RG 91 row 1; RG 111 a
  date: '2026-04-05'
  why: >-
    The starkest displacement in the year and the reason the selector states
    standing on every entry: row 1 against row 24. A reader may ask to see St
    Vincent Ferrer's Mass on this date, and the page must say in terms that it
    is not said.
  expect:
    winner: easter-sunday
    winner_row: 1
    settled: true
    readable:
      said: [easter-sunday]
      displaced: [s-vincentii-ferrerii-confessoris]
