schema: triptych-calendar-masses/v1
edition: Missale Romanum, editio typica 1962
calendar: roman-1962
series: deterministic temporal Sunday masses with the Sacred Triduum
ordering: liturgical year, beginning with the First Sunday of Advent; the resumed Sundays
  after the Epiphany stand between the Twenty-third and the Last Sunday after Pentecost
registry: guidance/liturgy/roman-1962-propers.md (Sunday spine 01-52, Triduum T01-T03)
citation_convention: Vulgate book names and Vulgate psalm numbering as printed in the Missal
orthography: 1962 missal Latin (j retained, ae/oe digraphs, no accent marks)
conventions:
- every Introit concludes with the Gloria Patri and the repeated antiphon; the doxology is
  not repeated per entry
- propers stand in the order the Missal appoints them, not in a fixed template; Tracts, Sequences,
  and ritual texts appear only where appointed
- the invariant Ordinary is out of scope; prefaces are not recorded
verification: unverified model-generated leads; every citation and text requires collation
  against the controlling edition before any evidentiary reuse
open_collation_items:
- oration conclusions reproduce the abbreviated printed cue, but the cue's expansion is not
  uniform across entries (Per Dominum nostrum Jesum Christum... against Per Dominum.); settle
  one rendering at collation
- some chant citations were collapsed from the source's discrete verse list to a contiguous
  range; confirm each against the facsimile
- pre-1960 commemorations, suffrages, and suppressed octave texts were omitted as not appointed
  in 1962; confirm against the controlling edition's rubrics
