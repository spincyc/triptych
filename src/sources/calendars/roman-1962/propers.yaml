      - name: Blessing of the Baptismal Water
        incipit: Omnipotens sempiterne Deus, adesto magnae pietatis tuae mysteriis
        source: composed
        text: |
          Omnipotens sempiterne Deus, adesto magnae pietatis tuae mysteriis,
          adesto sacramentis: et ad recreandos novos populos, quos tibi fons
          baptismatis parturit, spiritum adoptionis emitte; ut, quod nostrae
          humilitatis gerendum est ministerio, virtutis tuae impleatur
          effectu. Per Dominum nostrum Jesum Christum, Filium tuum: Qui tecum
          vivit et regnat in unitate Spiritus Sancti Deus: per omnia saecula
          saeculorum.
    
          Vere dignum et justum est, aequum et salutare, nos tibi semper et
          ubique gratias agere, Domine, sancte Pater, omnipotens aeterne Deus:
          qui invisibili potentia, sacramentorum tuorum mirabiliter operaris
          effectum: et licet nos tantis mysteriis exsequendis simus indigni:
          tu tamen gratiae tuae dona non deserens, etiam ad nostras preces
          aures tuae pietatis inclinas. Deus, cujus Spiritus super aquas inter
          ipsa mundi primordia ferebatur: ut jam tunc virtutem
          sanctificationis, aquarum natura conciperet. Deus, qui nocentis
          mundi crimina per aquas abluens, regenerationis speciem in ipsa
          diluvii effusione signasti: ut, unius ejusdemque elementi mysterio,
          et finis esset vitiis, et origo virtutibus. Respice, Domine, in
          faciem Ecclesiae tuae, et multiplica in ea regenerationes tuas, qui
          gratiae tuae affluentis impetu laetificas civitatem tuam:
          fontemque baptismatis aperis toto orbe terrarum gentibus
          innovandis: ut, tuae majestatis imperio, sumat Unigeniti tui
          gratiam de Spiritu Sancto.
    
          Qui hanc aquam, regenerandis hominibus praeparatam, arcana sui
          numinis admixtione fecundet: ut, sanctificatione concepta, ab
          immaculato divini fontis utero, in novam renata creaturam,
          progenies caelestis emergat: et quos aut sexus in corpore, aut
          aetas discernit in tempore, omnes in unam pariat gratia mater
          infantiam. Procul ergo hinc, jubente te, Domine, omnis spiritus
          immundus abscedat: procul tota nequitia diabolicae fraudis
          absistat. Nihil hoc loci habeat contrariae virtutis admixtio: non
          insidiando circumvolet: non latendo subrepat: non inficiendo
          corrumpat.
    
          Sit haec sancta et innocens creatura, libera ab omni impugnatoris
          incursu, et totius nequitiae purgata discessu. Sit fons vivus, aqua
          regenerans, unda purificans: ut omnes hoc lavacro salutifero
          diluendi, operante in eis Spiritu Sancto, perfectae purgationis
          indulgentiam consequantur.
    
          Unde benedico te, creatura aquae, per Deum vivum, per Deum verum,
          per Deum sanctum: per Deum, qui te, in principio, verbo separavit ab
          arida: cujus Spiritus super te ferebatur. Qui te paradisi fonte
          manare fecit, et in quatuor fluminibus totam terram rigare
          praecepit. Qui te in deserto amaram, suavitate indita, fecit esse
          potabilem, et sitienti populo de petra produxit. Benedico te et per
          Jesum Christum Filium ejus unicum, Dominum nostrum: qui te in Cana
          Galilaeae signo admirabili, sua potentia convertit in vinum. Qui
          pedibus super te ambulavit: et a Joanne in Jordane in te baptizatus
          est. Qui te una cum sanguine de latere suo produxit: et discipulis
          suis jussit, ut credentes baptizarentur in te, dicens: Ite, docete
          omnes gentes, baptizantes eos in nomine Patris, et Filii, et
          Spiritus Sancti.
    
          Haec nobis praecepta servantibus tu, Deus omnipotens, clemens
          adesto: tu benignus aspira. Tu has simplices aquas tuo ore
          benedicito: ut praeter naturalem emundationem, quam lavandis possunt
          adhibere corporibus, sint etiam purificandis mentibus efficaces.
    
          Descendat in hanc plenitudinem fontis virtus Spiritus Sancti.
    
          Totamque hujus aquae substantiam, regenerandi fecundet effectu.
    
          Hic omnium peccatorum maculae deleantur: hic natura ad imaginem tuam
          condita, et ad honorem sui reformata principii, cunctis vetustatis
          squaloribus emundetur: ut omnis homo, sacramentum hoc regenerationis
          ingressus, in verae innocentiae novam infantiam renascatur. Per
          Dominum nostrum Jesum Christum Filium tuum: qui venturus est
          judicare vivos et mortuos, et saeculum per ignem.
    
          Sanctificetur et fecundetur fons iste Oleo salutis renascentibus ex
          eo, in vitam aeternam. Amen.
    
          Infusio Chrismatis Domini nostri Jesu Christi, et Spiritus Sancti
          Paracliti, fiat in nomine sanctae Trinitatis. Amen.
    
          Commixtio Chrismatis sanctificationis, et Olei unctionis, et aquae
          baptismatis, pariter fiat in nomine Patris, et Filii, et Spiritus
          Sancti. Amen.
        notes: Where the church has no baptismal font this blessing is omitted and the rite passes
          from the first part of the Litany to the renewal of baptismal promises.
      - name: Tract at the Procession to the Font
        incipit: Sicut cervus desiderat ad fontes aquarum
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 41, verse: 2}
            end: {chapter: 41, verse: 4}
          ref: Psalm 41:2-4
      - name: Prayer at the Font
        incipit: Omnipotens sempiterne Deus, respice propitius
        source: composed
        text: |
          Omnipotens sempiterne Deus, respice propitius ad devotionem populi
          renascentis, qui sicut cervus, aquarum tuarum expetit fontem: et
          concede propitius; ut fidei ipsius sitis, baptismatis mysterio,
          animam corpusque sanctificet. Per Dominum nostrum Jesum Christum,
          qui tecum vivit et regnat in unitate Spiritus Sancti, Deus, per
          omnia saecula saeculorum.
      - name: Renewal of Baptismal Promises
        incipit: Hac sacratissima nocte, fratres carissimi
        source: composed
        text: |
          Hac sacratissima nocte, fratres carissimi, sancta Mater Ecclesia,
          recolens Domini nostri Jesu Christi mortem et sepulturam, eum
          redamando vigilat; et, celebrans ejusdem gloriosam resurrectionem,
          laetabunda gaudet.
    
          Quoniam vero, ut docet Apostolus, consepulti sumus cum Christo per
          baptismum in mortem, quomodo Christus resurrexit a mortuis, ita et
          nos in novitate vitae oportet ambulare; scientes, veterem hominem
          nostrum simul cum Christo crucifixum esse, ut ultra non serviamus
          peccato. Existimemus ergo nos mortuos quidem esse peccato,
          viventes autem Deo in Christo Jesu Domino nostro.
    
          Quapropter, fratres carissimi, quadragesimali exercitatione
          absoluta, sancti baptismatis promissiones renovemus, quibus olim
          satanae et operibus ejus, sicut et mundo, qui inimicus est Dei,
          abrenuntiavimus, et Deo in sancta Ecclesia catholica fideliter
          servire promisimus. Itaque:
    
          Abrenuntiatis Satanae? Abrenuntiamus.
          Et omnibus operibus ejus? Abrenuntiamus.
          Et omnibus pompis ejus? Abrenuntiamus.
          Creditis in Deum, Patrem omnipotentem, Creatorem coeli et terrae?
          Credimus.
          Creditis in Jesum Christum, Filium ejus unicum, Dominum nostrum,
          natum et passum? Credimus.
          Creditis et in Spiritum Sanctum, sanctam Ecclesiam catholicam,
          Sanctorum communionem, remissionem peccatorum, carnis
          resurrectionem, et vitam aeternam? Credimus.
    
          Nunc autem una simul Deum precemur, sicut Dominus noster Jesus
          Christus orare nos docuit: Pater noster, qui es in coelis,
          sanctificetur nomen tuum. Adveniat regnum tuum. Fiat voluntas tua,
          sicut in coelo et in terra. Panem nostrum quotidianum da nobis
          hodie, et dimitte nobis debita nostra, sicut et nos dimittimus
          debitoribus nostris. Et ne nos inducas in tentationem, sed libera
          nos a malo.
    
          Et Deus omnipotens, Pater Domini nostri Jesu Christi, qui nos
          regeneravit ex aqua et Spiritu Sancto, quique nobis dedit
          remissionem peccatorum, ipse nos custodiat gratia sua in eodem
          Christo Jesu Domino nostro in vitam aeternam. Amen.
        notes: The address and the renewal may be made in the vernacular, in a version approved
          by the local Ordinary.
      - name: Litany of the Saints, second part
        incipit: Propitius esto
        source: composed
        text: |
          Propitius esto. Parce nobis, Domine.
          Propitius esto. Exaudi nos, Domine.
          Ab omni malo. Libera nos, Domine.
          Ab omni peccato. Libera nos, Domine.
          A morte perpetua. Libera nos, Domine.
          Per mysterium sanctae Incarnationis tuae. Libera nos, Domine.
          Per adventum tuum. Libera nos, Domine.
          Per nativitatem tuam. Libera nos, Domine.
          Per baptismum et sanctum jejunium tuum. Libera nos, Domine.
          Per crucem et passionem tuam. Libera nos, Domine.
          Per mortem et sepulturam tuam. Libera nos, Domine.
          Per sanctam resurrectionem tuam. Libera nos, Domine.
          Per admirabilem ascensionem tuam. Libera nos, Domine.
          Per adventum Spiritus Sancti Paracliti. Libera nos, Domine.
          In die judicii. Libera nos, Domine.
          Peccatores. Te rogamus, audi nos.
          Ut nobis parcas. Te rogamus, audi nos.
          Ut Ecclesiam tuam sanctam regere et conservare digneris. Te rogamus,
          audi nos.
          Ut domnum apostolicum et omnes ecclesiasticos ordines in sancta
          religione conservare digneris. Te rogamus, audi nos.
          Ut inimicos sanctae Ecclesiae humiliare digneris. Te rogamus, audi
          nos.
          Ut regibus et principibus christianis, pacem et veram concordiam
          donare digneris. Te rogamus, audi nos.
          Ut nosmetipsos in tuo sancto servitio confortare et conservare
          digneris. Te rogamus, audi nos.
          Ut omnibus benefactoribus nostris sempiterna bona retribuas. Te
          rogamus, audi nos.
          Ut fructus terrae dare et conservare digneris. Te rogamus, audi nos.
          Ut omnibus fidelibus defunctis requiem aeternam donare digneris. Te
          rogamus, audi nos.
          Ut nos exaudire digneris. Te rogamus, audi nos.
          Agnus Dei, qui tollis peccata mundi. Parce nobis, Domine.
          Agnus Dei, qui tollis peccata mundi. Exaudi nos, Domine.
          Agnus Dei, qui tollis peccata mundi. Miserere nobis.
          Christe, audi nos. Christe, exaudi nos.
        notes: At the end of this second part the cantors solemnly begin the Kyrie of the Mass.
