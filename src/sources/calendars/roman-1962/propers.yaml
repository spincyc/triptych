schema: triptych-calendar-masses/v1
edition: Missale Romanum, editio typica 1962
edition_short: 1962 Missal
calendar: roman-1962
series: deterministic fixed-date feast masses
ordering: sections in christological, common, marian, sanctoral, seasonal order;
  dated masses in civil date order within their kind, seasonal masses in
  liturgical-year order, and the Commons in the order the Commune Sanctorum
  prints them
registry: guidance/liturgy/roman-1962-propers.md (calendar-spine filtered by kind)
psalm_numbering: vulgate
citation_convention: Vulgate book names and Vulgate psalm numbering as printed in
  the 1962 Missal
orthography: 1962 missal Latin (j retained, ae/oe digraphs, no accent marks)
verification: four tiers; the seasonal Sundays, the Triduum and Palm Sunday carry
  unverified model-generated leads whose every citation and text requires collation
  against the controlling edition before any evidentiary reuse; the seasonal ferias,
  vigils, Ember Days and movable feasts of the Lord added afterwards carry only their
  scripture-bearing propers, read from an OCR text layer of that edition and equally
  uncollated; the common section carries every Commune the Missal prints, orations
  only, read from the embedded text layer of the CMAA facsimile of the
  controlling edition, corroborated against an independent scan of the 1962
  Benziger editio iuxta typicam, and read on the facsimile page image wherever
  the two scans did not settle a reading between them - two machine readings
  plus a page reading where they disagreed, which is not a page collation of
  the whole Commune; and the sanctoral, marian and christological entries that
  carry propers hold only their scripture-bearing slots, whose citations were
  read from the same facsimile's text layer in column order on 2026-08-01, each
  attached to its day by the printed saint's name rather than by position, and
  each then measured against the text it points to in the tracked Clementine.
  No image was read for any of them. Every remaining entry in those three
  sections is still a placeholder skeleton
conventions:
- every Introit concludes with the Gloria Patri and the repeated antiphon; the
  doxology is not repeated per entry
- propers stand in the order the Missal appoints them, not in a fixed template;
  Tracts, Sequences, and ritual texts appear only where appointed
- the invariant Ordinary is out of scope; prefaces are not recorded
- a mass whose propers cover only the scripture-bearing slots says so in its own
  notes; the omitted orations and composed chants are appointed, not absent
open_collation_items:
- oration conclusions reproduce the abbreviated printed cue, but the cue's expansion
  is not uniform across entries (Per Dominum nostrum Jesum Christum... against
  Per Dominum.); settle one rendering at collation
- some chant citations were collapsed from the source's discrete verse list to
  a contiguous range; confirm each against the facsimile
- pre-1960 commemorations, suffrages, and suppressed octave texts were omitted
  as not appointed in 1962; confirm against the controlling edition's rubrics
- 60 commemorations stood inside another celebration's name, in the shape the
  calendar reference prints them, a feast then a semicolon then comm. and the
  saint. Each is now its own dated entry with rank Comm., the shape the calendar
  already used for the 44 entries it inscribes as commemorations outright, so that
  each can be looked up and reached as the second or third oration it is. The split
  follows the reference's own stated convention, that a commemoration following a
  feast is shown after a semicolon, and never a reading of the name, so a joint
  title such as Ss. Perpetuae et Felicitatis Martyrum or Ss. Petri et Pauli
  Apostolorum stays one celebration
- their registry ids read 1962-<date>-comm and are synthetic, as the temporal
  1962-T-<key> ids are. The sanctoral registry carries one id per civil date and
  the reference prints no identifier for a commemoration standing beside a feast;
  settle a scheme at collation
- nothing was read for those 60 beyond identity, date and the fact of the
  commemoration. Each carries a placeholder, and the three orations a commemoration
  actually consists of are still absent
- 25 December keeps its commemoration of S. Anastasia in a note rather than in an
  entry of its own. It is proper to the second Mass and printed inside that
  formulary, not inscribed on the date, and a dated entry would put it through the
  occurrence rules RG 111 a would then refuse it under; settle at collation
- 25 April holds two celebrations in one entry, the Litania maior and S. Marci
  Evangelistae. Neither is a commemoration, the reference prints no comm. there,
  so this is not the same defect and nothing was split; the rank II the entry
  carries is the Evangelist's
- D. N. Iesu Christi Regis and Sanctissimi Nominis Iesu are the two feasts RG 17
  assigns perpetually to a Sunday that the temporal registry gives no ordinal.
  guidance/liturgy/roman-1962-propers.md reserves the F series for exactly this
  case and enumerates no F identity, so both were given the synthetic
  1962-T-<key> id this file already uses for its undated temporal entries rather
  than an F number nothing here fixes; settle the scheme at collation
- the fifth, sixth and seventh days within the octave of the Nativity are three
  dated entries, as the calendar prints them, and the Missal gives all three one
  shared formulary. Settled 2026-07-31 against the CMAA facsimile of the 1962
  typica, the artifact this repository already records at
  src/sources/works/catholic-church/missale-romanum/editions/vatican-typica-1962/
  artifacts/cmaa-facsimile-pdf (sha256 648fdb8f...3518a, 82815941 bytes, matched
  on retrieval). At 29, 30 and 31 December the Missal prints no propers at all,
  only Missa Puer natus est nobis, ut supra 28 (printed pp. 29, 31 and 31;
  digital pp. 110, 112 and 112, visually collated), which points back to the
  formulary headed Diebus infra octavam Nativitatis Domini, II classis, at
  printed pp. 28-29. So the calendar's three entries and this file's one shared
  formulary are both right - three liturgical days, one Mass. That Mass is not the
  Mass of Christmas Day. It takes the third Mass's Introit Puer natus est nobis
  (Isai. 9, 6; Ps. 97, 1), Collect Concede quaesumus, Gradual Viderunt omnes
  (Ps. 97, 3-4 et 2), Alleluia Dies sanctificatus, Offertory Tui sunt caeli
  (Ps. 88, 12 et 15), Communion Viderunt omnes (Ps. 97, 3), Secret Oblata Domine
  munera and Postcommunion Praesta quaesumus, but reads Titus 3, 4-7 and
  Luke 2, 15-20 - the Aurora Mass's readings - where the Day Mass reads
  Hebrews 1, 1-12 and John 1, 1-14. Only the two readings move, and that is
  enough to make it a formulary of its own rather than a repetition of Christmas
  Day. Nothing was added to this file; only the question is answered,
  and the shared Mass is still absent
- the Office of Our Lady on Saturday has no entry. Its rubrical place is settled
  (RG 78, RG 79, RG 91 row 27, and RGMR 515 b, which says its Mass exists and may
  be sung) and src/sources/calendars/roman-1962/rubrics.yaml already constitutes
  the day from it, but it falls on any Saturday carrying a fourth-class feria,
  which this file's own implied rules place in five different seasons, and the
  schema admits exactly one season on an undated entry. Its seasonal formularies
  have now been read, and there are five. Settled 2026-07-31 against the CMAA
  facsimile named in the Nativity-octave item above, visually collated at digital
  pp. 851-856. The Commune carries a section headed Missae de S. Maria in
  sabbato, quae dici etiam possunt aliis diebus ut votivae de B. Maria Virgine,
  iuxta rubricas vel, ex indulto, pro temporum diversitate, printed pp. [43]-[48],
  whose five Masses are numbered I to V - I Tempore Adventus (Rorate caeli);
  II A Nativitate Domini usque ad Purificationem (Vultum tuum); III A die 3
  februarii usque ad feriam IV Hebdomadae sanctae (Salve sancta parens);
  IV Tempore paschali (Salve sancta parens, with alleluias); V A festo Ss.
  Trinitatis usque ad sabbatum ante dominicam I Adventus (Salve sancta parens).
  RGMR 309 a calls them the Masses assigned pro sancta Maria in sabbato iuxta
  temporum diversitatem. Form III carries its own internal switch rather than a
  sixth form - after Septuagesima the Alleluia and its verse give way to the Tract
  Gaude Maria Virgo. What remains is the schema question alone - five seasonal
  forms against a schema that admits one season on an undated entry - and the
  five Masses themselves, none of which was transcribed here
- all entries in this file are placeholders pending source-backed completion
- the Commune Sanctorum now has a section. Until 2026-07-31 this repository held
  no Common at all, which is why 307 sanctoral entries could hold nothing but a
  placeholder - in the 1962 book a third-class saint ordinarily takes the whole
  Mass from a Common and the day prints only its own orations, and the schema
  could not say so. It can now, through takes_from. On 2026-07-31 one Commune
  was transcribed, the Commune Doctorum of printed pp. [22]-[23], and one
  sanctoral entry took it, S. Hilarii at 01-14. On 2026-08-01 the other twelve
  were added, as 28 further entries covering every Mass the Commune Sanctorum
  prints from [1] to [48], and 115 orations. What is still absent from them is
  not a Common but the rest of each Mass - these 28 carry their orations and
  nothing else, no Introit, reading, chant or Communion antiphon, in the state
  the 63 seasonal entries below are already in. The Commune Doctorum remains the
  one entry here that carries a whole formulary
- twenty of the Commune's 115 orations are carried by a reference rather than a
  copy. The Missal sets the same prayer out twice in 37 places - the whole of the
  Commune Martyrum tempore paschali repeats the orations of the two Commons
  before it - and where the two settings are the same to the letter, this file
  writes the prayer once and points at it. Where they are not, it writes both.
  The difference is almost always the conclusion, which the typica sets at three
  lengths apparently as line-fill - 21 of the 37 repetitions print a shorter or
  longer conclusion than their first setting, so grouping on the prayer without
  its conclusion would have served text the page does not print
- a proper that takes another's text is rendered under the printing proper's
  name, because resolve_propers returns the referenced object itself rather than
  a copy of it, which is the property the whole mechanism exists for. The cost
  shows in the Commune Martyrum tempore paschali, whose three Collects are
  labelled in the Missal Pro pluribus Martyribus Pontificibus, Pro pluribus
  Martyribus tantum and Item altera oratio, and which the browser lists as three
  propers all named Collect with their provenance beneath. The labels are in this
  file; nothing shows them. Settle whether the referring name should win at
  render time
- the Commons' registry ids read 1962-C-<key> and are synthetic, as the temporal
  1962-T-<key> and the commemorations' 1962-<date>-comm ids are. The registry in
  guidance/liturgy/roman-1962-propers.md numbers no Common; settle a scheme at
  collation
- the Missal itself says which Common each sanctoral day takes, in a printed
  line of the form Missa In medio, de Communi Doctorum [22]. Those lines are
  extractable rather than inferable, and a first mechanical pass over the
  Proprium Sanctorum of an independent 1962 scan on 2026-07-31 recovered 109 of
  them, keyed by the date heading they stand under. That pass is not landed here
  and must not be until it is corroborated against the CMAA facsimile line by
  line and mapped onto this file's mass keys, because a pointer resolving to the
  wrong Common would give a saint a whole Mass that is not his, and it would
  resolve cleanly and look right
- that refusal was tested again on 2026-08-01, now that the Commons those
  pointers would land on exist, and it stands. Both witnesses print the lines and
  print them richly - the CMAA facsimile's text layer carries 180 occurrences of
  de Communi in its Proprium Sanctorum and the Benziger scan 171, and each names
  the Common, the Mass within it by its printed loco N, and the Commune's own
  bracketed page, so which formulary is meant is rarely in doubt. What is in
  doubt is which saint. A pass over the Benziger text recovered 153 candidates
  and attributed a date to every one, which looked like a complete answer and was
  not - the date came from the nearest preceding DIE N MENSIS heading, and the
  scan loses enough of those headings that eleven consecutive candidates fell
  under 21 December. A pointer carrying the right Common and the wrong saint is
  the exact defect the paragraph above refuses, and a run reporting a date for
  every candidate while doing it is worse than one reporting none. Nothing was
  landed. What is now known and was not is that the Common each line names is
  machine-readable from two independent scans; what remains is to key the lines
  to the day headings by page and position rather than by proximity in a linear
  text, and to collate the result
- that keying was done later on 2026-08-01 and its result is
  src/sources/inventories/roman-1962-sanctoral-commons-v1.toml, which carries
  148 pointers keyed by page, by column and by the printed saint's name, with
  the method, the four corroborations and the reason each unlanded row is
  unlanded. Thirteen are landed here, off six page images - nine days the Missal
  gives the whole Mass of a Common with no oration proper to them, and four
  whose own Collect it substitutes, transcribed beside the reference. Reading
  the images also recovered the letter the Missal prints beside each oration
  heading, C for of the Common and P for proper to the day, with a numeral
  saying which of the Common's sets; S. Bedae is marked C 2 under a pointer
  naming only de Communi Doctorum [22], and C 2 is the set pro Doctore non
  Pontifice, so the bracket alone would have given a Doctor who was not a bishop
  the bishop's Secret and Postcommunion. The other 135 are recovered and not
  landed, and the record says why for each - 85 because the day prints orations
  this repository has not transcribed and the Common's beati N. would stand in
  their place, 12 because the day carries several pointers or one under a
  seasonal condition this schema cannot express, 2 because the day could not be
  attached to an entry, and 36 for no reason but that nobody has yet read the
  page image
- the two forms of a Common are two masses here, the second taking the first and
  replacing only the propers that differ, because a mass printed in forms cannot
  carry takes_from and a form cannot reference its sibling. Where a Common prints
  more than two alternatives the same shape should extend; nothing has tested it
- the Commune Doctorum's Tract and its Paschaltide Alleluia stand as propers of
  their own rather than as conditions on the Gradual and the Alleluia. The
  Missal prints them as substitutions governed by season, and this file has no
  way to say when a proper is said; the notes on each say it in prose instead
- 63 seasonal entries were added for the temporal days the Missal keeps and this
  file did not, namely the three Advent Ember Days; Ash Wednesday and the three days
  after it; every feria of Lent weeks 1-4 with the Lenten Ember Days; the ferias
  of Passion week and Holy Week to Wednesday; the Chrism Mass; the Easter octave;
  the Rogation Mass; the Vigil of the Ascension, the Ascension, and the Vigil of
  Pentecost; the Whitsun octave with its Ember Days; the Mass of the First Sunday
  after Pentecost; Corpus Christi; the Sacred Heart; and the September Ember Days
- those 63 entries carry only scripture-bearing propers. Identity, rank and the
  printed scripture references were read from an OCR text layer of the CMAA 1962
  facsimile, not from the facsimile images; confidence in the day's identity and
  rank is high, in each citation only as high as an unproofed scan allows, and
  nothing here has been visually collated
- their registry ids read 1962-T-<key> and are synthetic. The temporal registry in
  guidance/liturgy/roman-1962-propers.md numbers only the 52 Sundays and T01-T03,
  so no printed identifier exists for a feria; settle a scheme at collation
- citations in those entries were normalised into this file's English form (Psalm
  24:1-3) from the Missal's printed Latin (Ps. 24, 1-3), mapping 3 Reg. to 1 Kings,
  4 Reg. to 2 Kings, Eccli. to Sirach, Sap. to Wisdom and 2 Esdrae to Nehemiah;
  the printed strings themselves are not preserved
- the 1962 typica prints i where this file prints j (Iesu, Iudica, Iubilate, eius),
  so the orthography line describes a hand-missal witness rather than the edition
  named above. The new incipits were normalised to this file's j to keep one
  spelling; no incipit here reproduces the typica's letterforms
- an Introit's psalm verse was recorded only where the scan showed its printed
  verse numbers, so a new Introit carrying one passage is not evidence that the
  Missal appoints no psalm verse there
- in easter-thursday the scan reads the Introit psalm verse as Ps. 79, 1 while the
  words printed are those of Psalm 97:1; it is recorded as Psalm 97:1
- in lent-3-thursday the Missal prints no scriptural reference for the Introit
  antiphon Salus populi ego sum, only for its psalm verse
- the 1962 books have no octave of the Ascension, of Corpus Christi, or of the
  Epiphany, and no Vigil of the Epiphany; nothing was added for them
- 'the days this calendar constitutes from a rule rather than from an entry were
  censused over 2026 on 2026-08-01, because "a day with no mass key" had been read as a
  gap and most of it is not one. 84 dates of that year are won by a celebration carrying
  no mass key of its own. 80 of them reach a formulary all the same - 68 by the RGMR 299
  borrowing that `ferial_formulary` records, and 12 by the Office of Our Lady on
  Saturday, which is not a feria at all but row 27 and takes one of the five Missae de
  S. Maria in sabbato by season. Keylessness is therefore not the defect; it is how this
  schema says a day is constituted and its Mass named elsewhere'
- 'what that census does leave is four date-options in 2026 that reach no formulary by
  any route, and they are two different things. 5 January is a declared refusal and is
  right - the Most Holy Name occupies the Sunday those ferias follow, so RGMR 299''s
  Mass of the preceding Sunday is a Mass this index does not carry, and borrowing the
  feast''s own would decide by preference what no rubric decides. The other three, 14,
  21 and 22 May, appear only inside the `ascension-transferred-to-sunday` territorial
  option and never in the Thursday option, where all three resolve. The cause is stated
  in `tools/calendar-days`, which ties the Missal''s nine-day Ascension window at
  printed p. 352 to the Thursday form and refuses to tag it otherwise, on the ground
  that the Missal states that rubric from the Ascension''s own day. Under a transfer the
  question is whether the window moves with the feast or stays with the Thursday, and
  the 1962 books answer it nowhere, because the transfer is an indult and not a rubric
  of theirs. Nothing was changed - an unstated case answered by preference is the defect
  this file exists to refuse, and the three dates are recorded here so the question can
  be put to a witness rather than to a program'
- no feria of Advent outside the Ember Days, and no fourth-class feria of
  Septuagesima, of Epiphanytide, of Paschaltide or of the season after Pentecost,
  has a Mass formulary of its own, so the absence of such entries from this file
  is correct and not a gap. Settled 2026-07-31 against the CMAA facsimile named
  above. RGMR 299, printed p. XXII under the heading IV - De Missa in dominicis
  et feriis and visually collated, reads in full - Item propriam Missam habent
  omnes feriae temporis Quadragesimae et Passionis necnon Quatuor Temporum
  Adventus et septembris. In reliquis feriis dicitur Missa dominicae praecedentis,
  nisi a rubricis aliter provisum sit. The Proprium de Tempore agrees, printing
  a formulary for every feria of Lent and Passiontide and for the six Ember Days
  of Advent and September, and for no other feria of any season. Four printed
  rubrics say the same at the day - at Dominica secunda Adventus, printed p. 3,
  orationes de dominica, quando de feria, quae Missam propriam non habeat,
  facienda sit commemoratio iuxta rubricas; at Dominica I post Epiphaniam,
  printed p. 40, si Missa dominicae celebratur in feriis temporis Epiphaniae; at
  Septuagesima, Sexagesima and Quinquagesima, quando in feriis adhibetur Missa
  dominicae; and at Dominica II post Pentecosten, non dicitur autem in diebus
  ferialibus, quando adhibetur Missa dominicae praecedentis
- the nisi a rubricis aliter provisum sit of RGMR 299 was chased and yields one
  instance inside the seasons above, and it does not give a feria a Mass of its
  own either. At In Ascensione Domini, printed p. 352, the Missal directs -
  Diebus a feria VI post Ascensionem usque ad feriam VI ante vigiliam Pentecostes
  inclusive, dicitur Missa de festo Ascensionis, cum Gloria et praefatione de
  Ascensione, sine Credo et Communicantes proprio. So those nine days take the
  Ascension's Mass rather than the preceding Sunday's. Everything else the
  rubrics provide otherwise for in these seasons - the Easter and Whitsun octave
  days, the Litaniae maiores et minores, the Vigils of the Ascension and of
  Pentecost, the September Ember Days - is already a separately printed
  formulary in this file and is not a fourth-class feria
- chasing RGMR 299 turned up a formulary this file did not carry. At printed
  p. 40 the Missal prints MISSA DOMINICAE PRIMAE post Epiphaniam, Introit In
  excelso throno, under the rubric Haec Missa dicenda est diebus ferialibus huius
  hebdomadae, because the Holy Family occupies that Sunday. It is the exact twin
  of mass-of-the-first-sunday-after-pentecost, which this file already carried and
  which src/sources/calendars/roman-1962/rubrics.yaml classifies as an
  alternative-formulary. It is now the entry mass-of-the-first-sunday-after-epiphany,
  named after the twin rather than epiphany-1 because it is not a Sunday of the
  cycle and the key_matches rule for those Sundays would have swept an epiphany-1
  into row 15. Its formulary was transcribed from the facsimile and visually
  collated, so it is not a placeholder
- the same Secret and Postcommunion, Oblatum tibi Domine and Supplices te rogamus,
  stand at sexagesima, which holds them as an unverified model-generated lead. The
  Postcommunions agree word for word. The Secrets do not. Sexagesima reads
  sacrificium, vivificet where the facsimile prints sacrificium vivificet at printed
  p. 41. One comma, and the entry outside this collation was not touched; settle
  which is right when the Sunday leads are collated
- the Commemoratio septem Dolorum B. Mariae Virg. on the Friday after Passion
  Sunday has no entry, and the commemoration model landed on 2026-07-31 does not
  reach it. That model is dated - each of the 104 entries of rank Comm. carries a
  civil date and a 1962-<date>-comm registry id, and this celebration is movable,
  so it has neither. The Missal is not silent about it. At printed pp. 499-501,
  between the March and April feasts of the Proprium Sanctorum, it prints the
  heading Feria VI post dominicam I Passionis / Septem Dolorum beatae Mariae
  Virginis / Commemoratio, then the rubric Hodie, ubi peculiaria pietatis
  exercitia in honorem beatae Mariae Virg. Matris dolorosae peraguntur,
  permittuntur duae Missae festivae de septem Doloribus beatae Mariae Virginis,
  then a complete formulary - Introit Stabant iuxta Crucem Iesu mater (Io. 19,
  25), Lesson Iudith 13, 22 et 23-25, Sequence Stabat Mater dolorosa, and the
  rest, with a commemoration of the feria at each oration. So an entry of rank
  Comm. holding only a placeholder would understate what the Missal prints here,
  which the sixty unfolded commemorations do not. Two things must be settled
  before it can be written - a registry scheme for a movable commemoration, which
  is the same open item recorded above for the ferias, and whether a Comm. that
  carries its own printed Mass is filed as a commemoration or as a mass
- ascension, corpus-christi, sacred-heart and chrism-mass are filed seasonal
  because the Missal prints them in the Proprium de Tempore and each is placed by
  the liturgical year rather than a civil date; by kind they are christological,
  and which section should hold them is open
- four formularies the Missal carries are still absent from this file, namely
  D. N. Iesu Christi Regis (last Sunday of October, I classis), Sanctissimi
  Nominis Iesu, the
  Mass for the days within the Octave of the Nativity that 12-29, 12-30 and 12-31
  use, which the collation above identifies as Diebus infra octavam Nativitatis
  Domini, II classis, printed pp. 28-29, and the Commemoratio septem Dolorum
  B. Mariae Virg. of printed pp. 499-501. The fifth, the Missa dominicae primae
  post Epiphaniam of printed p. 40, is now carried. All four are movable or shared
  and none is in the fixed-date spine, which is why nothing reports them
- the sanctoral, marian and christological scripture citations added on
  2026-08-01 were recovered mechanically from the CMAA facsimile's own text
  layer, read in column order and in bands delimited by the full-width lines,
  which is what makes the attribution safe - the earlier linear pass over the
  same book lost its day headings and put eleven consecutive candidates under
  21 December. 308 printed Die N mensis headings were read; 298 were attached
  to an entry of this file by matching the printed saint's name against the
  entry's name, and 10 were refused because the OCR of the heading left no name
  to match. The date sequence was checked for monotonicity through the book and
  exactly one heading fell out of order, S. Caeciliae read as 12 November for
  22 November; it is among the ten refused. 149 masses received 883
  scripture-bearing propers carrying 984 citations. Nothing here was read from
  a page image and nothing has been visually collated; the confidence is that
  of the 63 seasonal entries already in this file and no higher
- every citation added in that pass was measured against the text it points to -
  resolved in the tracked Clementine and compared word for word with the OCR of
  the page it was read from, on the reasoning that the Missal prints the
  antiphon or the reading on the same page as its reference, so a right
  citation overlaps its own page and a wrong one does not. The median overlap
  is 0.825. Two citations were dropped outright - the Communion of In
  Conversione S. Pauli, printed Mt. 19, 28 et 29 and read Mt. 19, 2, which
  scanned as a reference and shared no word with the page; and the Introit of
  S. Ioannis Leonardi, printed Eccli. 42, 15-16 and read Eccl., which put
  Sirach 42 into a book of twelve chapters. Both slots are therefore absent
  rather than wrong. A further 16 citations were refused before validation, 14
  of them an Introit psalm verse printed Ps. ibid. with no antecedent citation
  on the page, and 2 outside this repository's canon
- 84 of those 984 citations overlap their own page by less than half. Most are
  short antiphons that quote loosely, but two classes are real and neither is
  corrected here. The Missal's Eccli. 44, 16 - the Gradual Ecce sacerdos
  magnus, appointed on ten days - reaches Enoch placuit Deo in the tracked
  Clementine, so the Missal's Sirach numbering and this edition's disagree
  across chapter 44. And Ps. 115, 16-17 and Ps. 115, 15 address verses beyond
  the tracked Clementine's Psalm 115, which ends at 10, because the Missal's
  Gallican psalter numbers that psalm continuously with 113B. Both are
  divergences between witnesses, not misreadings, and settling them needs a
  citation_divergences ruling this file does not yet carry
sections:
  seasonal:
    kind: seasonal
    label: Seasonal
    masses:
    - key: advent-1
      name: First Sunday of Advent
      registry: '39'
      season: advent
      propers:
      - name: Introit
        incipit: Ad te levavi
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 24, verse: 1}
            end: {chapter: 24, verse: 3}
          ref: Psalm 24:1-3
        - book: Psalms
          ranges:
          - begin: {chapter: 24, verse: 4}
            end: {chapter: 24, verse: 4}
          ref: Psalm 24:4
