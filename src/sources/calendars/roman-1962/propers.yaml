        source: composed
        text: |
          Deus, qui hodierna die corda fidelium Sancti Spiritus illustratione
          docuisti: da nobis in eodem Spiritu recta sapere; et de ejus semper
          consolatione gaudere. Per Dominum... in unitate ejusdem Spiritus
          Sancti...
      - name: Lesson
        source: scripture
        verses:
        - book: Acts
          ranges:
          - begin: {chapter: 2, verse: 1}
            end: {chapter: 2, verse: 11}
          ref: Acts 2:1-11
      - name: Alleluia
        incipit: Emitte Spiritum tuum
        source: mixed
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 103, verse: 30}
            end: {chapter: 103, verse: 30}
          ref: Psalm 103:30
        text: |
          Alleluja, alleluja. V. Emitte Spiritum tuum, et creabuntur: et
          renovabis faciem terrae. Alleluja. V. Veni, Sancte Spiritus, reple
          tuorum corda fidelium: et tui amoris in eis ignem accende.
        notes: All kneel at the verse Veni, Sancte Spiritus.
      - name: Sequence
        incipit: Veni, Sancte Spiritus
        source: composed
        text: |
          Veni, Sancte Spiritus, et emitte caelitus lucis tuae radium.
          Veni, pater pauperum; veni, dator munerum; veni, lumen cordium.
          Consolator optime, dulcis hospes animae, dulce refrigerium.
          In labore requies, in aestu temperies, in fletu solacium.
          O lux beatissima, reple cordis intima tuorum fidelium.
          Sine tuo numine nihil est in homine, nihil est innoxium.
          Lava quod est sordidum, riga quod est aridum, sana quod est saucium.
          Flecte quod est rigidum, fove quod est frigidum, rege quod est devium.
          Da tuis fidelibus, in te confidentibus, sacrum septenarium.
          Da virtutis meritum, da salutis exitum, da perenne gaudium.
          Amen. Alleluja.
      - name: Gospel
        source: scripture
        verses:
        - book: John
          ranges:
          - begin: {chapter: 14, verse: 23}
            end: {chapter: 14, verse: 31}
          ref: John 14:23-31
      - name: Offertory
        incipit: Confirma hoc, Deus
