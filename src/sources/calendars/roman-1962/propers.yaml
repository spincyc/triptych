    - key: missa-de-s-maria-in-sabbato-5
      name: 'Missa de S. Maria in sabbato V: a festo Ss. Trinitatis usque ad sabbatum
        ante dominicam I Adventus'
      registry: 1962-C-s-maria-in-sabbato-5
      notes: 'The Commune Sanctorum of the 1962 typica, printed pp. [47]-[48]. The three
        orations, at marginal nos. 4531, 4537 and 4539, were transcribed 2026-08-01 from
        the CMAA facsimile of the controlling edition and corroborated against the text
        layer of an independent scan of the 1962 Benziger editio iuxta typicam; every
        reading the two scans did not settle between them was read off the facsimile page
        image. The scripture-bearing propers were added 2026-08-01 from the page images
        of the same facsimile at digital pp. 855-856. As in Masses III and IV, the Missal
        heads this Introit''s antiphon Sedulius rather than with a scriptural reference,
        so only its psalm verse is recorded as scripture. This is the Mass the Office of
        Our Lady on Saturday takes for most of the year, from Trinity Sunday to the
        Saturday before the First Sunday of Advent, so it is the one a reader is likeliest
        to reach. Three chants are still untranscribed and none carries a scriptural
        reference: the Gradual Benedicta et venerabilis es (no. 4533), the Alleluia Post
        partum (no. 4534) and the Communion Beata viscera (no. 4538). They are appointed,
        not absent.'
