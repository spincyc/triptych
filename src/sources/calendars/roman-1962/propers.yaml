      name: S. Anselmi Episcopi, Confessoris et Ecclesiae Doctoris
      registry: '1962-04-21'
      date: 04-21
      rank: III
      kind: sanctoral
      notes: 'The Missal gives this day the whole Mass of the Common named below; the
        pointer carries no qualifier and ends at the bracket. The Missal names the Common of
        Doctors without saying in the pointer which of its two sets of orations, and the
        letters settle it: the Collect is marked C at no. 2422, and the Secret and
        Postcommunion C 1 at nos. 2423 and 2424. Set 1 is pro Doctore Pontifice, and this
        Doctor was a bishop, so the reference is to that entry and not to the Doctor who is
        not a bishop. Read on 2026-08-01 from the page image of the CMAA facsimile of the
        controlling edition at printed p. 508 (digital p. 589), rendered at 140 dpi from the
        tracked PDF whose sha256 is 648fdb8f, and corroborated against a geometric
        extraction of the same page''s text layer.'
      takes_from:
