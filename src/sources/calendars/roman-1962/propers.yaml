          Per Dominum nostrum.
      - name: Secret
        incipit: Sancti N. Confessoris
        source: composed
        notes: Printed p. [21], no. 4327.
        text: |
          Sancti N. Confessoris tui atque Pontificis, quaesumus, Domine, annua
          solemnitas pietati tuae nos reddat acceptos: ut, per haec piae
          placationis officia, et illum beata retributio comitetur, et nobis
          gratiae tuae dona conciliet. Per Dominum nostrum.
      - name: Postcommunion
        incipit: Deus, fidelium remunerator
        source: composed
        notes: Printed p. [21], no. 4329.
        text: |
          Deus, fidelium remunerator animarum: praesta; ut beati N. Confessoris
          tui atque Pontificis, cujus venerandam celebramus festivitatem, precibus
          indulgentiam consequamur. Per Dominum nostrum.
    - key: commune-doctorum-pontificis
      name: Commune Doctorum, pro Doctore Pontifice
      registry: 1962-C-doctorum-pontificis
      notes: The Commune Doctorum of the 1962 typica, printed pp. [22]-[23] at marginal
        nos. 4330-4344, transcribed 2026-07-31. The Missal prints one Common here with
        two forms of the Secret and the Postcommunion, labelled 1 Pro Doctore Pontifice
        and 2 Pro Doctore non Pontifice; this entry is the first, and commune-doctorum-non-pontificis
        takes it and replaces those two. The Alleluia of Paschaltide replaces the Gradual
        and its Alleluia, and the Tract replaces the Alleluia after Septuagesima, as
        the printed rubrics direct; both stand as their own propers rather than as conditions
        on one. The second Epistle is printed after the Postcommunions under the rubric
        Item altera Epistola pro Doctoribus.
      propers:
      - name: Introit
        incipit: In medio Ecclesiae
        source: scripture
        verses:
        - book: Sirach
          ranges:
          - begin:
              chapter: 15
              verse: 5
            end:
              chapter: 15
              verse: 5
          ref: Sirach 15:5
        - book: Psalms
          ranges:
          - begin:
              chapter: 91
              verse: 1
            end:
              chapter: 91
              verse: 1
          ref: Psalm 91:1
      - name: Collect
        incipit: Deus, qui populo tuo
        source: composed
        text: 'Deus, qui populo tuo aeternae salutis beatum N. ministrum tribuisti:

          praesta, quaesumus; ut, quem Doctorem vitae habuimus in terris,

          intercessorem habere mereamur in caelis. Per Dominum...

          '
      - name: Epistle
        source: scripture
        verses:
        - book: 2 Timothy
          ranges:
          - begin:
              chapter: 4
              verse: 1
            end:
              chapter: 4
              verse: 8
          ref: 2 Timothy 4:1-8
      - name: Gradual
        incipit: Os justi meditabitur
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin:
              chapter: 36
              verse: 30
            end:
              chapter: 36
              verse: 31
          ref: Psalm 36:30-31
      - name: Alleluia
        incipit: Amavit eum Dominus
        source: scripture
        verses:
        - book: Sirach
          ranges:
          - begin:
              chapter: 45
              verse: 9
            end:
              chapter: 45
              verse: 9
          ref: Sirach 45:9
      - name: Tract
        incipit: Beatus vir, qui timet Dominum
        source: scripture
        notes: Said after Septuagesima in place of the Alleluia and its verse.
        verses:
        - book: Psalms
          ranges:
          - begin:
              chapter: 111
              verse: 1
            end:
              chapter: 111
              verse: 3
          ref: Psalm 111:1-3
      - name: Alleluia (Tempore paschali)
        incipit: Amavit eum Dominus
        source: scripture
        notes: In Paschaltide the Gradual is omitted and this is said in its place.
        verses:
        - book: Sirach
          ranges:
          - begin:
              chapter: 45
              verse: 9
            end:
              chapter: 45
              verse: 9
          ref: Sirach 45:9
        - book: Hosea
          ranges:
          - begin:
              chapter: 14
              verse: 6
            end:
              chapter: 14
              verse: 6
          ref: Hosea 14:6
      - name: Gospel
        source: scripture
        verses:
        - book: Matthew
          ranges:
          - begin:
              chapter: 5
              verse: 13
            end:
              chapter: 5
              verse: 19
          ref: Matthew 5:13-19
      - name: Offertory
        incipit: Justus ut palma florebit
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin:
              chapter: 91
              verse: 13
            end:
              chapter: 91
              verse: 13
          ref: Psalm 91:13
      - name: Secret
        incipit: Sancti N. Pontificis
        source: composed
        text: 'Sancti N. Pontificis tui atque Doctoris nobis, Domine, pia non desit

          oratio: quae et munera nostra conciliet; et tuam nobis indulgentiam

          semper obtineat. Per Dominum...

          '
      - name: Communion
        incipit: Fidelis servus et prudens
        source: scripture
        verses:
        - book: Luke
          ranges:
          - begin:
              chapter: 12
              verse: 42
            end:
              chapter: 12
              verse: 42
          ref: Luke 12:42
      - name: Postcommunion
        incipit: Ut nobis, Domine
        source: composed
        text: 'Ut nobis, Domine, tua sacrificia dent salutem: beatus N. Pontifex tuus

          et Doctor egregius, quaesumus, precator accedat. Per Dominum...

          '
      - name: Epistle (altera pro Doctoribus)
        source: scripture
        notes: Printed after the Postcommunions as an alternative Epistle for Doctors.
        verses:
        - book: Sirach
          ranges:
          - begin:
              chapter: 39
              verse: 6
            end:
              chapter: 39
              verse: 14
          ref: Sirach 39:6-14
