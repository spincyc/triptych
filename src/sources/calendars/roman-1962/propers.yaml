            end: {chapter: 13, verse: 15}
          ref: John 13:12-13, 15
      - name: Postcommunion
        incipit: Refecti vitalibus alimentis
        source: composed
        text: |
          Refecti vitalibus alimentis, quaesumus, Domine, Deus noster: ut,
          quod tempore nostrae mortalitatis exsequimur, immortalitatis tuae
          munere consequamur. Per Dominum nostrum Jesum Christum...
      - name: Hymn at the Translation of the Blessed Sacrament
        incipit: Pange lingua, gloriosi Corporis mysterium
        source: composed
        text: |
          Pange lingua, gloriosi
          Corporis mysterium,
          Sanguinisque pretiosi,
          Quem in mundi pretium
          Fructus ventris generosi
          Rex effudit gentium.
    
          Nobis datus, nobis natus
          Ex intacta Virgine,
          Et in mundo conversatus,
          Sparso verbi semine,
          Sui moras incolatus
          Miro clausit ordine.
    
          In supremae nocte coenae
          Recumbens cum fratribus,
          Observata lege plene
          Cibis in legalibus,
          Cibum turbae duodenae
          Se dat suis manibus.
    
          Verbum caro, panem verum
          Verbo carnem efficit;
          Fitque sanguis Christi merum:
          Et si sensus deficit,
          Ad firmandum cor sincerum
          Sola fides sufficit.
    
          Tantum ergo Sacramentum
          Veneremur cernui:
          Et antiquum documentum
          Novo cedat ritui:
          Praestet fides supplementum
          Sensuum defectui.
    
          Genitori, Genitoque
          Laus et jubilatio:
          Salus, honor, virtus quoque
          Sit et benedictio
          Procedenti ab utroque
          Compar sit laudatio. Amen.
        notes: The hymn is sung as far as Tantum ergo during the procession, and repeated if need
          be; Tantum ergo is sung at the place of reposition.
