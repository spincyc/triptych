          Deus, a quo et Judas reatus sui poenam, et confessionis suae latro
          praemium sumpsit, concede nobis tuae propitiationis effectum: ut
          sicut in passione sua Jesus Christus Dominus noster diversa utrisque
          intulit stipendia meritorum; ita nobis, ablato vetustatis errore,
          resurrectionis suae gratiam largiatur: Qui tecum vivit et regnat...
      - name: Second Lesson
