            end: {chapter: 8, verse: 2}
          ref: Psalm 8:2
      - name: Collect
        incipit: Omnipotens sempiterne Deus
        source: composed
        text: |
          Omnipotens sempiterne Deus, qui dedisti famulis tuis in confessione
          verae fidei, aeternae Trinitatis gloriam agnoscere, et in potentia
          majestatis adorare Unitatem: quaesumus; ut, ejusdem fidei firmitate, ab
          omnibus semper muniamur adversis. Per Dominum.
      - name: Epistle
        source: scripture
        verses:
        - book: Romans
          ranges:
          - begin: {chapter: 11, verse: 33}
            end: {chapter: 11, verse: 36}
          ref: Romans 11:33-36
      - name: Gradual
        incipit: Benedictus es, Domine, qui intueris abyssos
        source: scripture
        verses:
        - book: Daniel
          ranges:
          - begin: {chapter: 3, verse: 55}
            end: {chapter: 3, verse: 56}
          ref: Daniel 3:55-56
      - name: Alleluia
        incipit: Benedictus es, Domine, Deus patrum nostrorum
        source: scripture
        verses:
