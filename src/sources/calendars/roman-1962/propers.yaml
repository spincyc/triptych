    - key: comm-s-romani-martyris
      name: Comm. S. Romani Martyris
      registry: '1962-08-09-comm'
      date: 08-09
      rank: Comm.
      kind: sanctoral
      notes: 'The Missal gives this day the fourth Mass of the Common of one Martyr
        except for the Secret and the Postcommunion, which it prints in full and which
        are transcribed below; its Collect is marked C, of the Common. The pointer reads
        cum orationibus ut infra, which is why this row was held until the page was read.
        Until 2026-08-01 this entry carried a Gospel and a Communion that the Missal does
        not print for S. Romanus at all: they are the Vigil of S. Laurentius, in whose
        Mass he has only a commemoration, and they are moved to that entry. The same two
        orations are printed twice on the opening, once at nos. 3330 and 3333 as the
        commemoration inside the Vigil and once at nos. 3335 and 3336 in this Mass. Read
        on 2026-08-01 from the page images of the CMAA facsimile of the controlling
        edition at printed pp. 620-621 (digital pp. 701-702), rendered at 140 dpi from
        the tracked PDF whose sha256 is 648fdb8f. The orthography is this file''s, not
        the typica''s.'
      takes_from:
        mass: commune-unius-martyris-4
        citation: Missa Laetabitur, de Communi unius Martyris IV loco [8], cum orationibus
          ut infra
      propers:
      - name: Secret
        incipit: 'Muneribus nostris, quaesumus'
        source: composed
        notes: Printed p. 621, no. 3335, marked P.
        text: |
          Muneribus nostris, quaesumus, Domine, precibusque susceptis: et caelestibus
          nos munda mysteriis, et clementer exaudi. Per Dominum.
      - name: Postcommunion
        incipit: 'Quaesumus, omnipotens Deus'
        source: composed
        notes: Printed p. 621, no. 3336, marked P.
        text: |
          Quaesumus, omnipotens Deus: ut, qui caelestia alimenta percepimus,
          intercedente beato Romano Martyre tuo, per haec contra omnia adversa
          muniamur. Per Dominum.
