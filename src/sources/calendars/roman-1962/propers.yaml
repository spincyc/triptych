    - key: palm-sunday
      name: Second Sunday of the Passion (Palm Sunday)
      registry: '06'
      season: passiontide
      propers:
      - name: Antiphon at the Blessing of Palms
        incipit: Hosanna filio David
        source: scripture
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 21, verse: 9}
            end: {chapter: 21, verse: 9}
          ref: Matthew 21:9
      - name: Blessing of the Palms
        incipit: Benedic, quaesumus, Domine
        source: composed
        text: |
          Benedic, quaesumus, Domine, hos palmarum (seu olivarum aut aliarum
          arborum) ramos: et praesta; ut, quod populus tuus in tui venerationem
          hodierna die corporaliter agit, hoc spiritualiter summa devotione
          perficiat, de hoste victoriam reportando et opus misericordiae
          summopere diligendo. Per Christum Dominum nostrum.
        notes: The celebrant then sprinkles and incenses the branches in silence.
      - name: First Antiphon at the Distribution of Palms
        incipit: Pueri Hebraeorum, portantes ramos olivarum
        source: mixed
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 21, verse: 9}
            end: {chapter: 21, verse: 9}
          ref: Matthew 21:9
        - book: Psalms
          ranges:
          - begin: {chapter: 23, verse: 1}
            end: {chapter: 23, verse: 2}
          - begin: {chapter: 23, verse: 7}
            end: {chapter: 23, verse: 10}
          ref: Psalm 23:1-2, 7-10
        text: |
          Pueri Hebraeorum, portantes ramos olivarum, obviaverunt Domino,
          clamantes et dicentes: Hosanna in excelsis.
      - name: Second Antiphon at the Distribution of Palms
        incipit: Pueri Hebraeorum vestimenta prosternebant
        source: mixed
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 21, verse: 8}
            end: {chapter: 21, verse: 9}
          ref: Matthew 21:8-9
        - book: Psalms
          ranges:
          - begin: {chapter: 46}
            end: {chapter: 46}
          ref: Psalm 46
        text: |
          Pueri Hebraeorum vestimenta prosternebant in via, et clamabant
          dicentes: Hosanna filio David; benedictus qui venit in nomine Domini.
        notes: The two antiphons with their psalms are repeated until the distribution is finished.
      - name: Gospel of the Blessing of Palms
        source: scripture
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 21, verse: 1}
            end: {chapter: 21, verse: 9}
          ref: Matthew 21:1-9
      - name: Versicle at the Beginning of the Procession
        incipit: Procedamus in pace
        source: composed
        text: |
          V. Procedamus in pace. R. In nomine Christi. Amen.
      - name: Procession Antiphon
        incipit: Occurrunt turbae cum floribus et palmis
        source: composed
        text: |
          Occurrunt turbae cum floribus et palmis Redemptori obviam: et victori
          triumphanti digna dant obsequia: Filium Dei ore gentes praedicant: et
          in laudem Christi voces tonant per nubila: Hosanna in excelsis.
        notes: The procession antiphons may be sung all or in part, as opportunity allows.
      - name: Procession Antiphon
        incipit: Cum Angelis et pueris
        source: composed
        text: |
          Cum Angelis et pueris fideles inveniantur, triumphatori mortis
          clamantes: Hosanna in excelsis.
      - name: Procession Antiphon
        incipit: Turba multa
        source: mixed
        verses:
        - book: John
          ranges:
          - begin: {chapter: 12, verse: 12}
            end: {chapter: 12, verse: 12}
          ref: John 12:12
        - book: Matthew
          ranges:
          - begin: {chapter: 21, verse: 9}
            end: {chapter: 21, verse: 9}
          ref: Matthew 21:9
        text: |
          Turba multa, quae convenerat ad diem festum, clamabat Domino:
          Benedictus, qui venit in nomine Domini: Hosanna in excelsis.
      - name: Procession Antiphon
        incipit: Coeperunt omnes turbae
        source: scripture
        verses:
        - book: Luke
          ranges:
          - begin: {chapter: 19, verse: 37}
            end: {chapter: 19, verse: 38}
          ref: Luke 19:37-38
      - name: Hymn to Christ the King
        incipit: Gloria, laus et honor
        source: composed
        text: |
          Gloria, laus et honor tibi sit, Rex Christe, Redemptor: Cui puerile
          decus prompsit Hosanna pium.
          Israel es tu Rex, Davidis et inclita proles: Nomine qui in Domini, Rex
          benedicte, venis.
          Coetus in excelsis te laudat caelicus omnis, Et mortalis homo, et
          cuncta creata simul.
          Plebs Hebraea tibi cum palmis obvia venit: Cum prece, voto, hymnis,
          adsumus ecce tibi.
          Hi tibi passuro solvebant munia laudis: Nos tibi regnanti pangimus
          ecce melos.
          Hi placuere tibi, placeat devotio nostra: Rex bone, Rex clemens, cui
          bona cuncta placent.
        notes: The opening couplet is the refrain, repeated by all after each verse of the chorus.
      - name: Procession Antiphon
        incipit: Omnes collaudant nomen tuum
        source: mixed
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 21, verse: 9}
            end: {chapter: 21, verse: 9}
          ref: Matthew 21:9
        - book: Psalms
          ranges:
          - begin: {chapter: 147}
            end: {chapter: 147}
          ref: Psalm 147
        text: |
          Omnes collaudant nomen tuum, et dicunt: Benedictus qui venit in nomine
          Domini: Hosanna in excelsis.
      - name: Procession Antiphon
        incipit: Fulgentibus palmis
        source: composed
        text: |
          Fulgentibus palmis prosternimur advenienti Domino: huic omnes
          occurramus cum hymnis et canticis, glorificantes et dicentes:
          Benedictus Dominus.
      - name: Procession Antiphon
        incipit: Ave, Rex noster
        source: composed
        text: |
          Ave, Rex noster, Fili David, Redemptor mundi, quem prophetae
          praedixerunt Salvatorem domui Israel esse venturum. Te enim ad
          salutarem victimam Pater misit in mundum, quem exspectabant omnes
          sancti ab origine mundi, et nunc: Hosanna Filio David. Benedictus qui
          venit in nomine Domini. Hosanna in excelsis.
      - name: Responsory at the Entrance into the Church
        incipit: Ingrediente Domino
        source: composed
        text: |
          Ingrediente Domino in sanctam civitatem, Hebraeorum pueri
          resurrectionem vitae pronuntiantes, cum ramis palmarum: Hosanna,
          clamabant, in excelsis. V. Cum audisset populus, quod Jesus veniret
          Jerosolymam, exierunt obviam ei. Cum ramis palmarum: Hosanna,
          clamabant, in excelsis.
      - name: Oration to Conclude the Procession
        incipit: Domine Jesu Christe, Rex ac Redemptor noster
        source: composed
        text: |
          Domine Jesu Christe, Rex ac Redemptor noster, in cujus honorem, hos
          ramos gestantes, solemnes laudes decantavimus: concede propitius ut,
          quocumque hi rami deportati fuerint, ibi tuae benedictionis gratia
          descendat, et quavis daemonum iniquitate vel illusione profligata,
