        Proprium Sanctorum, and what follows it over the leaf is the Commune Sanctorum,
        whose Commune unius aut plurium Summorum Pontificum opens at printed p. [1] with
        exactly those propers - Introit Io. 21, 15-17 Si diligis me and the rest. The
        citation pass that placed them ran off the end of one division of the book into
        the next. They are removed rather than moved: the Commune''s own entry in this
        file carries its orations, and its scripture propers need their own reading.
        Read on 2026-08-01 from the page images of the CMAA facsimile of the controlling
        edition at printed pp. 726-727 and [1] (digital pp. 807-809), rendered at 140 dpi
