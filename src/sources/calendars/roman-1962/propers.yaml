    - key: s-hilarii-episcopi-confessoris-ecclesiae-doctoris
      name: S. Hilarii Episcopi, Confessoris et Ecclesiae Doctoris
      registry: '1962-01-14'
      date: 01-14
      rank: III
      kind: sanctoral
      notes: Transcribed 2026-07-31 from the CMAA facsimile of the 1962 typica at
        printed p. 442, nos. 1915, 1917 and 1919, and corroborated word for word
        against an independent scan of a second 1962 printing. The Missal sends
        the day to the Commune Doctorum and then prints these three orations in
        full with the saint's name supplied, marking each C or C 1 - that is, of
        the Common, first form. They are transcribed as printed rather than
        derived from the Common, because a name substitution is not something
        this schema performs. The commemoration of S. Felicis Presbyteri et
        Martyris that the day carries is its own dated entry and its orations are
        still absent.
      takes_from:
        mass: commune-doctorum-pontificis
        citation: Missa In medio, de Communi Doctorum [22]
      propers:
      - name: Collect
        incipit: Deus, qui populo tuo
        source: composed
        text: |
          Deus, qui populo tuo aeternae salutis beatum Hilarium ministrum
          tribuisti: praesta, quaesumus; ut, quem Doctorem vitae habuimus in
          terris, intercessorem habere mereamur in caelis. Per Dominum...
      - name: Secret
        incipit: Sancti Hilarii Pontificis
        source: composed
        text: |
          Sancti Hilarii Pontificis tui atque Doctoris nobis, Domine, pia non
          desit oratio: quae et munera nostra conciliet; et tuam nobis
          indulgentiam semper obtineat. Per Dominum...
      - name: Postcommunion
        incipit: 'Ut nobis, Domine'
        source: composed
        text: |
          Ut nobis, Domine, tua sacrificia dent salutem: beatus Hilarius Pontifex
          tuus et Doctor egregius, quaesumus, precator accedat. Per Dominum...
