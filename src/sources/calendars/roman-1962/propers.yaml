    - key: commune-confessoris-non-pontificis-1
      name: 'Commune Confessoris non Pontificis, Missa I: Os justi meditabitur'
      registry: 1962-C-confessoris-non-pontificis-1
      notes: Orations only. The Commune Sanctorum of the 1962 typica, printed pp. [24]-[25]
        at marginal nos. 4346, 4354, 4356, transcribed 2026-08-01 from the CMAA facsimile
        of the controlling edition and corroborated against the text layer of an independent
        scan of the 1962 Benziger editio iuxta typicam; every reading the two scans did
        not settle between them was read off the facsimile page image. The Introit, readings,
        chants and Communion antiphon of this Mass are not transcribed, as they are not
        for the 63 seasonal entries this file already carries in that state. An entry
        that takes this Mass therefore takes its orations and nothing else.
      propers:
      - name: Collect
        incipit: Deus, qui nos
        source: composed
        notes: Printed p. [24], no. 4346.
        text: |
          Deus, qui nos beati N. Confessoris tui annua solemnitate laetificas:
          concede propitius; ut, cujus natalicia colimus, etiam actiones imitemur.
          Per Dominum nostrum.
      - name: Secret
        incipit: Laudis tibi, Domine
        source: composed
        notes: Printed p. [25], no. 4354.
        text: |
          Laudis tibi, Domine, hostias immolamus in tuorum commemoratione
          Sanctorum: quibus nos et praesentibus exui malis confidimus, et futuris.
          Per Dominum nostrum.
      - name: Postcommunion
        incipit: Refecti cibo potuque
        source: composed
        notes: Printed p. [25], no. 4356.
        text: |
          Refecti cibo potuque caelesti, Deus noster, te supplices exoramus: ut,
          in cujus haec commemoratione percepimus, ejus muniamur et precibus. Per
          Dominum.
    - key: commune-confessoris-non-pontificis-2
      name: 'Commune Confessoris non Pontificis, Missa II: Justus ut palma florebit'
      registry: 1962-C-confessoris-non-pontificis-2
      notes: Orations only. The Commune Sanctorum of the 1962 typica, printed pp. [25]-[26]
        at marginal nos. 4358, 4366, 4368, transcribed 2026-08-01 from the CMAA facsimile
        of the controlling edition and corroborated against the text layer of an independent
        scan of the 1962 Benziger editio iuxta typicam; every reading the two scans did
