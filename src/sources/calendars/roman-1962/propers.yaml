          Ipse tibi, quaesumus, Domine sancte, Pater omnipotens, aeterne Deus,
          sacrificium nostrum reddat acceptum, qui discipulis suis in sui
          commemorationem hoc fieri hodierna traditione monstravit, Jesus
          Christus, Filius tuus, Dominus noster: Qui tecum vivit et regnat...
