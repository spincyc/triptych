      - name: Mandatum Antiphon 8
        incipit: Ubi caritas et amor
        source: composed
        text: |
          Ubi caritas et amor, Deus ibi est.
          Congregavit nos in unum Christi amor.
          Exsultemus et in ipso jucundemur.
          Timeamus et amemus Deum vivum.
          Et ex corde diligamus nos sincero.
          Ubi caritas et amor, Deus ibi est.
          Simul ergo cum in unum congregamur:
          Ne nos mente dividamur, caveamus.
          Cessent jurgia maligna, cessent lites.
          Et in medio nostri sit Christus Deus.
          Ubi caritas et amor, Deus ibi est.
          Simul quoque cum Beatis videamus
          Glorianter vultum tuum, Christe Deus:
          Gaudium, quod est immensum atque probum,
          Saecula per infinita saeculorum. Amen.
        notes: This antiphon with its verses is never omitted, the preceding ones being dropped
          if the washing of feet ends sooner.
      - name: Prayer of the Mandatum
        incipit: Adesto, Domine, quaesumus, officio servitutis nostrae
        source: composed
        text: |
          Adesto, Domine, quaesumus, officio servitutis nostrae: et quia tu
          discipulis tuis pedes lavare dignatus es, ne despicias opera manuum
          tuarum, quae nobis retinenda mandasti: ut, sicut hic nobis, et a
          nobis exteriora abluuntur inquinamenta; sic a te omnium nostrum
          interiora laventur peccata. Quod ipse praestare digneris, qui vivis
          et regnas Deus: per omnia saecula saeculorum.
      - name: Offertory
