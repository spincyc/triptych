      rank: III
      kind: sanctoral
      notes: The Missal names the Common of Doctors without saying which of its two sets
        of orations, and marks this day’s Secret and Postcommunion C 2 - of the Common,
        second set - which is the form pro Doctore non Pontifice, the saint not having
        been a bishop. The reference is therefore to that entry and not to the Doctor
        Bishop’s. The Collect, marked P, is transcribed below. Read on 2026-08-01 from
        the page image of the CMAA facsimile at printed p. 537 (digital p. 618).
