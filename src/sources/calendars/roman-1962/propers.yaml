          Deus, qui peccati veteris hereditariam mortem, in qua posteritatis
          genus omne successerat, Christi tui, Domini nostri, passione
          solvisti: da, ut, conformes eidem facti; sicut imaginem terrenae
          naturae necessitate portavimus, ita imaginem coelestis gratiae
          sanctificatione portemus. Per eundem Christum Dominum nostrum.
