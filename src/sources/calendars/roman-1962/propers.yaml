      - name: Solemn Intercessions
        incipit: Oremus, dilectissimi nobis, pro Ecclesia sancta Dei
        source: composed
        text: |
          Oremus, dilectissimi nobis, pro Ecclesia sancta Dei: ut eam Deus et
          Dominus noster pacificare, adunare, et custodire dignetur toto orbe
          terrarum: subjiciens ei principatus, et potestates: detque nobis
          quietam et tranquillam vitam degentibus, glorificare Deum Patrem
          omnipotentem. Omnipotens sempiterne Deus, qui gloriam tuam omnibus
          in Christo gentibus revelasti: custodi opera misericordiae tuae; ut
          Ecclesia tua toto orbe diffusa, stabili fide in confessione tui
          nominis perseveret. Per eundem Dominum nostrum Jesum Christum,
          Filium tuum: qui tecum vivit et regnat in unitate Spiritus Sancti
          Deus, per omnia saecula saeculorum.
    
          Oremus et pro beatissimo Papa nostro N., ut Deus et Dominus noster,
          qui elegit eum in ordine episcopatus, salvum atque incolumem
          custodiat Ecclesiae suae sanctae, ad regendum populum sanctum Dei.
          Omnipotens sempiterne Deus, cujus judicio universa fundantur:
          respice propitius ad preces nostras, et electum nobis Antistitem tua
          pietate conserva; ut christiana plebs, quae te gubernatur auctore,
          sub tanto pontifice, credulitatis suae meritis augeatur. Per Dominum
          nostrum Jesum Christum, Filium tuum: qui tecum vivit et regnat in
          unitate Spiritus Sancti Deus, per omnia saecula saeculorum.
    
          Oremus et pro omnibus Episcopis, Presbyteris, Diaconibus,
          Subdiaconibus, Acolythis, Exorcistis, Lectoribus, Ostiariis,
          Confessoribus, Virginibus, Viduis: et pro omni populo sancto Dei.
          Omnipotens sempiterne Deus, cujus spiritu totum corpus Ecclesiae
          sanctificatur et regitur: exaudi nos pro universis ordinibus
          supplicantes; ut gratiae tuae munere, ab omnibus tibi gradibus
          fideliter serviatur. Per Dominum nostrum Jesum Christum, Filium
          tuum: qui tecum vivit et regnat in unitate ejusdem Spiritus Sancti
          Deus, per omnia saecula saeculorum.
    
          Oremus et pro omnibus res publicas moderantibus, eorumque
          ministeriis et potestatibus: ut Deus et Dominus noster mentes et
          corda eorum secundum voluntatem suam dirigat ad nostram perpetuam
          pacem. Omnipotens sempiterne Deus, in cujus manu sunt omnium
          potestates et omnium jura populorum: respice benignus ad eos, qui
          nos in potestate regunt; ut ubique terrarum, dextera tua protegente,
          et religionis integritas, et patriae securitas indesinenter
          consistat. Per Dominum nostrum Jesum Christum, Filium tuum: qui
          tecum vivit et regnat in unitate Spiritus Sancti Deus, per omnia
          saecula saeculorum.
    
          Oremus et pro catechumenis nostris: ut Deus et Dominus noster
          adaperiat aures praecordiorum ipsorum, januamque misericordiae; ut
          per lavacrum regenerationis accepta remissione omnium peccatorum, et
          ipsi inveniantur in Christo Jesu Domino nostro. Omnipotens
          sempiterne Deus, qui Ecclesiam tuam nova semper prole foecundas:
          auge fidem et intellectum catechumenis nostris; ut renati fonte
          baptismatis, adoptionis tuae filiis aggregentur. Per Dominum nostrum
          Jesum Christum, Filium tuum: qui tecum vivit et regnat in unitate
          Spiritus Sancti Deus, per omnia saecula saeculorum.
    
          Oremus, dilectissimi nobis, Deum Patrem omnipotentem, ut cunctis
          mundum purget erroribus: morbos auferat: famem depellat: aperiat
          carceres: vincula dissolvat: peregrinantibus reditum: infirmantibus
          sanitatem: navigantibus portum salutis indulgeat. Omnipotens
          sempiterne Deus, moestorum consolatio, laborantium fortitudo:
          perveniant ad te preces de quacumque tribulatione clamantium; ut
          omnes sibi in necessitatibus suis misericordiam tuam gaudeant
          affuisse. Per Dominum nostrum Jesum Christum, Filium tuum: qui tecum
          vivit et regnat in unitate Spiritus Sancti Deus, per omnia saecula
          saeculorum.
    
          Oremus et pro haereticis et schismaticis: ut Deus et Dominus noster
          eruat eos ab erroribus universis; et ad sanctam matrem Ecclesiam
          Catholicam atque Apostolicam revocare dignetur. Omnipotens
          sempiterne Deus, qui salvas omnes, et neminem vis perire: respice ad
          animas diabolica fraude deceptas; ut omni haeretica pravitate
          deposita, errantium corda resipiscant, et ad veritatis tuae redeant
          unitatem. Per Dominum nostrum Jesum Christum, Filium tuum: qui tecum
          vivit et regnat in unitate Spiritus Sancti Deus, per omnia saecula
          saeculorum.
    
          Oremus et pro Judaeis: ut Deus et Dominus noster auferat velamen de
          cordibus eorum; ut et ipsi agnoscant Jesum Christum, Dominum
          nostrum. Omnipotens sempiterne Deus, qui Judaeos etiam a tua
          misericordia non repellis: exaudi preces nostras, quas pro illius
          populi obcaecatione deferimus; ut, agnita veritatis tuae luce, quae
          Christus est, a suis tenebris eruantur. Per eundem Dominum nostrum
          Jesum Christum, Filium tuum: qui tecum vivit et regnat in unitate
          Spiritus Sancti Deus, per omnia saecula saeculorum.
    
          Oremus et pro paganis: ut Deus omnipotens auferat iniquitatem a
          cordibus eorum; ut relictis idolis suis, convertantur ad Deum vivum
          et verum, et unicum Filium ejus Jesum Christum Deum et Dominum
          nostrum. Omnipotens sempiterne Deus, qui non mortem peccatorum, sed
          vitam semper inquiris: suscipe propitius orationem nostram, et
          libera eos ab idolorum cultura; et aggrega Ecclesiae tuae sanctae ad
          laudem et gloriam nominis tui. Per Dominum nostrum Jesum Christum,
          Filium tuum: qui tecum vivit et regnat in unitate Spiritus Sancti
          Deus, per omnia saecula saeculorum.
        notes: Each of the nine intercessions has its own invitation, then Oremus, Flectamus genua
          and Levate, and then the oration.
      - name: Showing of the Cross
        incipit: Ecce lignum Crucis
        source: composed
        text: |
          Ecce lignum Crucis, in quo salus mundi pependit. Venite, adoremus.
        notes: Sung three times, each time at a higher pitch, as the Cross is progressively unveiled.
      - name: Improperia
        incipit: Popule meus, quid feci tibi?
        source: mixed
        verses:
        - book: Micah
          ranges:
          - begin: {chapter: 6, verse: 3}
            end: {chapter: 6, verse: 4}
          ref: Micah 6:3-4
        - book: Isaiah
          ranges:
          - begin: {chapter: 5, verse: 4}
            end: {chapter: 5, verse: 4}
          ref: Isaiah 5:4
        - book: Psalms
          ranges:
          - begin: {chapter: 66, verse: 2}
            end: {chapter: 66, verse: 2}
          ref: Psalm 66:2
        text: |
          Popule meus, quid feci tibi? aut in quo contristavi te? Responde
          mihi. Quia eduxi te de terra Aegypti, parasti crucem Salvatori tuo.
          Agios o Theos! Sanctus Deus! Agios ischyros! Sanctus fortis! Agios
          athanatos, eleison imas. Sanctus immortalis, miserere nobis.
    
          Quia eduxi te per desertum quadraginta annis, et manna cibavi te, et
          introduxi te in terram satis bonam: parasti Crucem Salvatori tuo.
          Agios o Theos! Sanctus Deus! Agios ischyros! Sanctus fortis! Agios
          athanatos, eleison imas. Sanctus immortalis, miserere nobis.
    
          Quid ultra debui facere tibi, et non feci? Ego quidem plantavi te
          vineam meam speciosissimam: et tu facta es mihi nimis amara: aceto
          namque sitim meam potasti: et lancea perforasti latus Salvatori tuo.
          Agios o Theos! Sanctus Deus! Agios ischyros! Sanctus fortis! Agios
          athanatos, eleison imas. Sanctus immortalis, miserere nobis.
    
          Ego propter te flagellavi Aegyptum cum primogenitis suis: et tu me
          flagellatum tradidisti. Popule meus, quid feci tibi? aut in quo
          contristavi te? Responde mihi.
          Ego eduxi te de Aegypto, demerso Pharaone in Mare Rubrum: et tu me
          tradidisti principibus sacerdotum.
          Ego ante te aperui mare: et tu aperuisti lancea latus meum.
          Ego ante te praeivi in columna nubis: et tu me duxisti ad praetorium
          Pilati.
          Ego te pavi manna per desertum: et tu me cecidisti alapis et
          flagellis.
          Ego te potavi aqua salutis de petra: et tu me potasti felle, et
          aceto.
          Ego propter te Chananaeorum reges percussi: et tu percussisti
          arundine caput meum.
          Ego dedi tibi sceptrum regale: et tu dedisti capiti meo spineam
          coronam.
          Ego te exaltavi magna virtute: et tu me suspendisti in patibulo
          Crucis.
    
          Ant. Crucem tuam adoramus, Domine: et sanctam resurrectionem tuam
          laudamus, et glorificamus: ecce enim propter lignum venit gaudium in
          universo mundo. Deus misereatur nostri, et benedicat nobis.
          Illuminet vultum suum super nos, et misereatur nostri. Crucem tuam
          adoramus, Domine: et sanctam resurrectionem tuam laudamus, et
          glorificamus: ecce enim propter lignum venit gaudium in universo
          mundo.
    
          Ant. Crux fidelis, inter omnes Arbor una nobilis! Nulla silva talem
          profert, Fronde, flore, germine: Dulce lignum, dulces clavos, Dulce
          pondus sustinet.
    
          Pange, lingua, gloriosi
          Lauream certaminis,
          Et super Crucis trophaeo
          Dic triumphum nobilem:
          Qualiter Redemptor orbis
          Immolatus vicerit.
    
          De parentis protoplasti
          Fraude Factor condolens,
          Quando pomi noxialis
          In necem morsu ruit:
          Ipse lignum tunc notavit,
          Damna ligni ut solveret.
    
          Hoc opus nostrae salutis
          Ordo depoposcerat:
          Multiformis proditoris
          Ars ut artem falleret:
          Et medelam ferret inde,
          Hostis unde laeserat.
    
          Quando venit ergo sacri
          Plenitudo temporis,
          Missus est ab arce Patris
          Natus, orbis Conditor:
          Atque ventre virginali
          Carne amictus prodiit.
    
          Vagit infans inter arcta
          Conditus praesepia:
          Membra pannis involuta
          Virgo Mater alligat:
          Et Dei manus, pedesque
          Stricta cingit fascia.
    
          Lustra sex qui jam peregit,
          Tempus implens corporis,
          Sponte libera Redemptor
          Passioni deditus,
          Agnus in Crucis levatur
          Immolandus stipite.
    
          Felle potus ecce languet:
          Spina, clavi, lancea,
          Mite corpus perforarunt,
          Unda manat, et cruor:
          Terra, pontus, astra, mundus,
          Quo lavantur flumine!
    
          Flecte ramos, arbor alta,
          Tensa laxa viscera,
          Et rigor lentescat ille,
          Quem dedit nativitas:
          Et superni membra Regis
          Tende miti stipite.
    
          Sola digna tu fuisti
          Ferre mundi victimam:
          Atque portum praeparare
          Arca mundo naufrago:
          Quam sacer cruor perunxit,
          Fusus Agni corpore.
    
          Sempiterna sit beatae
          Trinitati gloria:
          Aequa Patri, Filioque;
          Par decus Paraclito:
          Unus Trinique nomen
          Laudet universitas. Amen.
        notes: The chant is prolonged as the number of those adoring requires, but always concludes
          with the doxology Sempiterna sit beatae Trinitati gloria; the two choirs alternate the
          reproaches and the antiphons Crux fidelis and Dulce lignum between the stanzas.
      - name: Antiphons at the Translation of the Blessed Sacrament
        incipit: Adoramus te, Christe
        source: composed
        text: |
          Adoramus te, Christe, et benedicimus tibi, quia per Crucem tuam
          redemisti mundum.
          Per lignum servi facti sumus, et per sanctam Crucem liberati sumus:
          fructus arboris seduxit nos, Filius Dei redemit nos.
          Salvator mundi, salva nos: qui per Crucem et Sanguinem tuum
          redemisti nos, auxiliare nobis, te deprecamur, Deus noster.
      - name: Psalm at the Communion
        incipit: Deus, Deus meus, respice in me
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 21}
            end: {chapter: 21}
          ref: Psalm 21
        notes: This psalm, or one of the responsories of this day's Matins, may be sung while
          Communion is distributed.
      - name: First Prayer after Communion
        incipit: Super populum tuum, quaesumus, Domine
        source: composed
        text: |
          Super populum tuum, quaesumus, Domine, qui passionem et mortem Filii
          tui devota mente recoluit, benedictio copiosa descendat, indulgentia
          veniat, consolatio tribuatur, fides sancta succrescat, redemptio
          sempiterna firmetur. Per eundem Christum Dominum nostrum.
      - name: Second Prayer after Communion
        incipit: Omnipotens et misericors Deus
        source: composed
        text: |
          Omnipotens et misericors Deus, qui Christi tui beata passione et
          morte nos reparasti: conserva in nobis operam misericordiae tuae;
          ut hujus mysterii participatione, perpetua devotione vivamus. Per
          eundem Christum Dominum nostrum.
      - name: Third Prayer after Communion
        incipit: Reminiscere miserationum tuarum
        source: composed
        text: |
          Reminiscere miserationum tuarum, Domine, et famulos tuos aeterna
          protectione sanctifica, pro quibus Christus, Filius tuus, per suum
          cruorem instituit paschale mysterium. Per eundem Christum Dominum
          nostrum.
    - key: easter-vigil
      name: Easter Vigil
      registry: T03
      season: triduum
      propers:
      - name: Blessing of the New Fire
        incipit: Deus, qui per Filium tuum, angularem scilicet lapidem
        source: composed
        text: |
          Deus, qui per Filium tuum, angularem scilicet lapidem, claritatis
          tuae ignem fidelibus contulisti: productum e silice, nostris
          profuturum usibus, novum hunc ignem sanctifica: et concede nobis,
          ita per haec festa paschalia coelestibus desideriis inflammari; ut
          ad perpetuae claritatis, puris mentibus, valeamus festa pertingere.
          Per eundem Christum Dominum nostrum.
      - name: Blessing of the Paschal Candle
        incipit: Christus heri et hodie
        source: composed
        text: |
          Christus heri et hodie. Principium et Finis. Alpha et Omega. Ipsius
          sunt tempora et saecula. Ipsi gloria et imperium per universa
          aeternitatis saecula. Amen.
    
          Per sua sancta vulnera gloriosa custodiat et conservet nos Christus
          Dominus. Amen.
    
          Lumen Christi gloriose resurgentis dissipet tenebras cordis et
          mentis.
        notes: The three formulas accompany the incising of the cross, Alpha and Omega and the
          current year, the fixing of the five grains of incense, and the lighting of the candle
          from the new fire.
      - name: Blessing of the Lighted Candle
        incipit: Veniat, quaesumus, omnipotens Deus
        source: composed
        text: |
          Veniat, quaesumus, omnipotens Deus, super hoc incensum cereum larga
          tuae benedictionis infusio: et hunc nocturnum splendorem invisibilis
          regenerator, intende; ut non solum sacrificium, quod hac nocte
          litatum est, arcana luminis tui admixtione refulgeat; sed in
          quocumque loco ex hujus sanctificationis mysterio aliquid fuerit
          deportatum, expulsa diabolicae fraudis nequitia, virtus tuae
          majestatis assistat. Per Christum Dominum nostrum.
      - name: Lumen Christi
        incipit: Lumen Christi
        source: composed
        text: |
          V. Lumen Christi. R. Deo gratias.
        notes: Sung three times in the procession, each time at a higher pitch, at the door, in
          the middle of the church, and before the altar.
      - name: Exsultet (Praeconium paschale)
        incipit: Exsultet jam Angelica turba coelorum
        source: composed
        text: |
          Exsultet jam Angelica turba coelorum: exsultent divina mysteria: et
          pro tanti Regis victoria tuba insonet salutaris. Gaudeat et tellus
          tantis irradiata fulgoribus: et aeterni Regis splendore illustrata,
          totius orbis se sentiat amisisse caliginem. Laetetur et mater
          Ecclesia, tanti luminis adornata fulgoribus: et magnis populorum
          vocibus haec aula resultet. Quapropter astantes vos, fratres
          carissimi, ad tam miram hujus sancti luminis claritatem, una mecum,
          quaeso, Dei omnipotentis misericordiam invocate. Ut, qui me non meis
          meritis intra Levitarum numerum dignatus est aggregare: luminis sui
          claritatem infundens, Cerei hujus laudem implere perficiat. Per
          Dominum nostrum Jesum Christum, Filium suum: qui cum eo vivit et
          regnat in unitate Spiritus Sancti Deus: per omnia saecula
          saeculorum.
    
          Vere dignum et justum est, invisibilem Deum Patrem omnipotentem
          Filiumque ejus unigenitum, Dominum nostrum Jesum Christum, toto
          cordis ac mentis affectu et vocis ministerio personare. Qui pro
          nobis aeterno Patri Adae debitum solvit: et veteris piaculi
          cautionem pio cruore detersit. Haec sunt enim festa paschalia, in
          quibus verus ille Agnus occiditur, cujus sanguine postes fidelium
          consecrantur. Haec nox est, in qua primum patres nostros, filios
          Israel eductos de Aegypto, Mare Rubrum sicco vestigio transire
          fecisti. Haec igitur nox est, quae peccatorum tenebras columnae
          illuminatione purgavit. Haec nox est, quae hodie per universum
          mundum in Christo credentes, a vitiis saeculi et caligine peccatorum
          segregatos, reddit gratiae, sociat sanctitati. Haec nox est, in qua,
          destructis vinculis mortis, Christus ab inferis victor ascendit.
          Nihil enim nobis nasci profuit, nisi redimi profuisset. O mira circa
          nos tuae pietatis dignatio! O inaestimabilis dilectio caritatis: ut
          servum redimeres, Filium tradidisti! O certe necessarium Adae
          peccatum, quod Christi morte deletum est! O felix culpa, quae talem
          ac tantum meruit habere Redemptorem! O vere beata nox, quae sola
          meruit scire tempus et horam, in qua Christus ab inferis resurrexit!
          Haec nox est, de qua scriptum est: Et nox sicut dies illuminabitur:
          Et nox illuminatio mea in deliciis meis. Hujus igitur sanctificatio
          noctis fugat scelera, culpas lavat: et reddit innocentiam lapsis et
          maestis laetitiam. Fugat odia, concordiam parat et curvat imperia.
    
          In hujus igitur noctis gratia, suscipe, sancte Pater, incensi hujus
          sacrificium vespertinum: quod tibi in hac Cerei oblatione solemni,
          per ministrorum manus de operibus apum, sacrosancta reddit Ecclesia.
          Sed jam columnae hujus praeconia novimus, quam in honorem Dei
          rutilans ignis accendit. Qui licet sit divisus in partes, mutuati
          tamen luminis detrimenta non novit. Alitur enim liquantibus ceris,
          quas in substantiam pretiosae hujus lampadis apis mater eduxit. O
          vere beata nox, quae exspoliavit Aegyptios, ditavit Hebraeos! Nox,
          in qua terrenis caelestia, humanis divina junguntur.
    
          Oramus ergo te, Domine: ut Cereus iste in honorem tui nominis
          consecratus, ad noctis hujus caliginem destruendam, indeficiens
          perseveret. Et in odorem suavitatis acceptus, supernis luminaribus
          misceatur. Flammas ejus lucifer matutinus inveniat. Ille, inquam,
          lucifer, qui nescit occasum. Ille, qui regressus ab inferis, humano
          generi serenus illuxit. Precamur ergo te, Domine: ut nos famulos
          tuos, omnemque clerum, et devotissimum populum: una cum beatissimo
          Papa nostro N., et Antistite nostro N., quiete temporum concessa, in
          his paschalibus gaudiis, assidua protectione regere, gubernare et
          conservare digneris. Respice etiam ad eos, qui nos in potestate
          regunt, et, ineffabili pietatis et misericordiae tuae munere, dirige
          cogitationes eorum ad justitiam et pacem, ut de terrena operositate
          ad caelestem patriam perveniant cum omni populo tuo. Per eundem
          Dominum nostrum Jesum Christum, Filium tuum: Qui tecum vivit et
          regnat in unitate Spiritus Sancti Deus: per omnia saecula
          saeculorum.
      - name: First Prophecy
        source: scripture
        verses:
        - book: Genesis
          ranges:
          - begin: {chapter: 1, verse: 1}
            end: {chapter: 1, verse: 31}
          - begin: {chapter: 2, verse: 1}
            end: {chapter: 2, verse: 2}
          ref: Genesis 1:1-31; 2:1-2
      - name: Oration after the First Prophecy
        incipit: Deus, qui mirabiliter creasti hominem
        source: composed
        text: |
          Deus, qui mirabiliter creasti hominem, et mirabilius redemisti: da
          nobis, quaesumus, contra oblectamenta peccati, mentis ratione
          persistere; ut mereamur ad aeterna gaudia pervenire. Per Dominum
          nostrum Jesum Christum...
        notes: No tract follows the first prophecy; the oration is said at once.
      - name: Second Prophecy
        source: scripture
        verses:
        - book: Exodus
          ranges:
          - begin: {chapter: 14, verse: 24}
            end: {chapter: 14, verse: 31}
          - begin: {chapter: 15, verse: 1}
            end: {chapter: 15, verse: 1}
          ref: Exodus 14:24-31; 15:1
      - name: Tract
        incipit: Cantemus Domino
        source: scripture
        verses:
        - book: Exodus
          ranges:
          - begin: {chapter: 15, verse: 1}
            end: {chapter: 15, verse: 2}
          ref: Exodus 15:1-2
      - name: Oration after the Second Prophecy
        incipit: Deus, cujus antiqua miracula
        source: composed
        text: |
          Deus, cujus antiqua miracula etiam nostris saeculis coruscare
          sentimus: dum quod uni populo, a persecutione Aegyptiaca liberando,
          dexterae tuae potentia contulisti, id in salutem gentium per aquam
          regenerationis operaris: praesta; ut in Abrahae filios, et in
          Israeliticam dignitatem, totius mundi transeat plenitudo. Per
          Dominum nostrum Jesum Christum...
      - name: Third Prophecy
        source: scripture
        verses:
        - book: Isaiah
          ranges:
          - begin: {chapter: 4, verse: 2}
            end: {chapter: 4, verse: 6}
