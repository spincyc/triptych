          ranges:
          - begin: {chapter: 3, verse: 52}
            end: {chapter: 3, verse: 52}
          ref: Daniel 3:52
      - name: Gospel
        source: scripture
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 28, verse: 18}
            end: {chapter: 28, verse: 20}
          ref: Matthew 28:18-20
      - name: Offertory
        incipit: Benedictus sit Deus Pater
        source: scripture
        verses:
        - book: Tobit
          ranges:
          - begin: {chapter: 12, verse: 6}
            end: {chapter: 12, verse: 6}
          ref: Tobit 12:6
      - name: Secret
        incipit: Sanctifica, quaesumus, Domine
        source: composed
        text: |
          Sanctifica, quaesumus, Domine, Deus noster, per tui sancti nominis
          invocationem, hujus oblationis hostiam: et per eam nosmetipsos tibi
          perfice munus aeternum. Per Dominum.
      - name: Communion
        incipit: Benedicimus Deum coeli
        source: scripture
        verses:
        - book: Tobit
          ranges:
          - begin: {chapter: 12, verse: 6}
            end: {chapter: 12, verse: 6}
          ref: Tobit 12:6
      - name: Postcommunion
        incipit: Proficiat nobis ad salutem
        source: composed
        text: |
          Proficiat nobis ad salutem corporis et animae, Domine, Deus noster,
          hujus sacramenti susceptio: et sempiternae sanctae Trinitatis
          ejusdemque individuae Unitatis confessio. Per Dominum.
