    - key: mass-of-the-first-sunday-after-epiphany
      name: Mass of the First Sunday after the Epiphany
      registry: '1962-T-mass-of-the-first-sunday-after-epiphany'
      season: epiphanytide
      notes: 'The Missal prints this formulary at printed p. 40 headed MISSA DOMINICAE
        PRIMAE post Epiphaniam, under the rubric Haec Missa dicenda est diebus ferialibus
        huius hebdomadae, because the Holy Family occupies the Sunday itself. The rubric
        at printed p. 39 states the rest: De dominica I post Epiphaniam suo die nihil fit,
        sed eius locum tenet festum Sanctae Familiae Iesu, Mariae, Ioseph, cum omnibus
        iuribus et privilegiis dominicae, and then, Diebus ferialibus a 7 ad 12 ianuarii
        ante dominicam I post Epiphaniam occurrentibus, dicitur Missa de festo Epiphaniae;
        post eandem dominicam vero Missa de eadem dominica In excelso throno, ut infra 40.
        So the ferias before that Sunday take the Mass of the Epiphany and the ferias after
        it take this one. It is the twin of mass-of-the-first-sunday-after-pentecost, and
        registry 44 is the Holy Family''s, so this entry carries a synthetic id like the
        twin. Read and visually collated 2026-07-31 against the CMAA facsimile of the 1962
        typica named in this file''s open collation items, printed pp. 40-42, digital
        pp. 121-123, items 273 to 282. The Introit antiphon carries no printed scriptural
        reference; only its psalm verse does. Three rubrics printed inside the formulary are
        not recorded here: the Gloria is said when the Mass is used on a feria of
        Epiphanytide and not when it is used after 13 January, the Credo is not said, and
        the preface is of the Epiphany within that season and otherwise the common preface.'
