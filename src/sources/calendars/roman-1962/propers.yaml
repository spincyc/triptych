  common:
    kind: common
    label: Commune Sanctorum
    masses:
    - key: commune-summorum-pontificum
      name: Commune unius aut plurium Summorum Pontificum
      registry: 1962-C-summorum-pontificum
      notes: Orations only. The Commune Sanctorum of the 1962 typica, printed pp. [1]-[4]
        at marginal nos. 4176, 4177, 4178, 4179, 4187, 4188, 4190, 4191, 4192, transcribed
        2026-08-01 from the CMAA facsimile of the controlling edition and corroborated
        against the text layer of an independent scan of the 1962 Benziger editio iuxta
        typicam; every reading the two scans did not settle between them was read off
        the facsimile page image. The Introit, readings, chants and Communion antiphon
        of this Mass are not transcribed, as they are not for the 63 seasonal entries
        this file already carries in that state. An entry that takes this Mass therefore
        takes its orations and nothing else.
      propers:
      - name: Collect
        incipit: Gregem tuum, Pastor
        source: composed
        notes: Printed p. [1], no. 4176.
        text: |
          Gregem tuum, Pastor aeterne, placatus intende: et per beatum N.
          (Martyrem tuum atque) Summum Pontificem perpetua protectione custodi;
          quem totius Ecclesiae praestitisti esse pastorem. Per Dominum.
      - name: Collect (in plurali)
        incipit: Gregem tuum, Pastor
        source: composed
        notes: Printed p. [2], no. 4177.
        text: |
          Gregem tuum, Pastor aeterne, placatus intende: et per beatos N. et N.
          (Martyres tuos atque) Summos Pontifices perpetua protectione custodi;
          quos totius Ecclesiae praestitisti esse pastores. Per Dominum.
      - name: Collect (Altera oratio)
        incipit: Deus, qui Ecclesiam
        source: composed
        notes: Printed p. [2], no. 4178.
        text: |
          Deus, qui Ecclesiam tuam, in apostolicae petrae soliditate fundatam, ab
          infernarum eruis terrore portarum: praesta, quaesumus; ut, intercedente
          beato N. (Martyre tuo atque) Summo Pontifice, in tua veritate
          persistens, continua securitate muniatur. Per Dominum.
      - name: Collect (Altera oratio, in plurali)
        incipit: Deus, qui Ecclesiam
        source: composed
        notes: Printed p. [2], no. 4179.
        text: |
          Deus, qui Ecclesiam tuam, in apostolicae petrae soliditate fundatam, ab
          infernarum eruis terrore portarum: praesta, quaesumus; ut,
          intercedentibus beatis N. et N. (Martyribus tuis atque) Summis
          Pontificibus, in tua veritate persistens, continua securitate muniatur.
          Per Dominum.
      - name: Secret
        incipit: Oblatis muneribus, quaesumus
        source: composed
        notes: Printed p. [3], no. 4187.
        text: |
          Oblatis muneribus, quaesumus, Domine, Ecclesiam tuam benignus illumina:
          ut et gregis tui proficiat ubique successus, et grati fiant nomini tuo,
          te gubernante, pastores. Per Dominum nostrum.
      - name: Secret (Altera secreta)
        incipit: Munera, quae tibi
        source: composed
        notes: Printed p. [3], no. 4188.
        text: |
          Munera, quae tibi, Domine, laetantes offerimus, suscipe benignus, et
          praesta: ut, intercedente beato N. (intercedentibus beatis N. et N.),
          Ecclesia tua et fidei integritate laetetur, et temporum tranquillitate
          semper exsultet. Per Dominum nostrum Jesum Christum, Filium tuum: Qui
          tecum vivit et regnat in unitate.
      - name: Postcommunion
        incipit: Refectione sancta enutritam
        source: composed
        notes: Printed p. [3], no. 4190.
        text: |
          Refectione sancta enutritam guberna, quaesumus, Domine, tuam placatus
          Ecclesiam: ut, potenti moderatione directa, et incrementa libertatis
          accipiat et in religionis integritate persistat. Per Dominum.
      - name: Postcommunion (Altera postcommunio)
        incipit: Multiplica, quaesumus, Domine
        source: composed
        notes: Printed p. [3], no. 4191.
        text: |
          Multiplica, quaesumus, Domine, in Ecclesia tua spiritum gratiae, quem
          dedisti: ut, beati N. (Martyris tui atque) Summi Pontificis
          deprecatione, nec pastori oboedientia gregis nec gregi desit cura
          pastoris. Per Dominum.
      - name: Postcommunion (in plurali)
        incipit: Multiplica, quaesumus, Domine
        source: composed
        notes: Printed p. [3], no. 4192.
        text: |
          Multiplica, quaesumus, Domine, in Ecclesia tua spiritum gratiae, quem
          dedisti: ut, beatorum N. et N. (Martyrum tuorum atque) Summorum
          Pontificum deprecatione, nec pastori oboedientia gregis nec gregi desit
          cura pastoris. Per Dominum.
