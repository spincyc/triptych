schema: triptych-calendar-rubrics/v1
calendar: roman-pre-1955
code: >-
  Rubricae in recitatione Divini Officii et in Missarum celebratione servandae
  ad normam Constitutionis Apostolicae Divino afflatu, Titulus II, De Festorum
  praestantia, AAS 3 (1911) 641-642
citation_forms:
  DA: >-
    Divino afflatu, Rubricae generales, Titulus II (De Festorum praestantia),
    AAS 3 (1911) 641-642
  DAI: >-
    Divino afflatu, Rubricae generales, Titulus III (De occurrentia et
    translatione Festorum), AAS 3 (1911) 642-644
  DAV: >-
    Divino afflatu, Rubricae generales, Titulus V (De concurrentia), AAS 3
    (1911) 645-646
  DAVI: >-
    Divino afflatu, Rubricae generales, Titulus VI (De Commemorationibus), AAS
    3 (1911) 646-648
  ADA: >-
    Abhinc duos annos, Decretum generale, Titulus IV (De occurrentia et
    translatione Festorum, eorumque concurrentia), AAS 5 (1913) 461-463
advisory: >-
  This file is a LINEARIZATION and not the rule itself. The pre-1955 order of
  precedence is five ordered criteria stated in Divino afflatu (1911) Titulus
  II — higher rite, primary or secondary, personal dignity, external
  solemnity, and propriety of the feast — taken in order until one separates
  two days. It is not a numbered table. This repository's rubrics schema
  admits only a numbered table, and assembly-model.js picks a winner by
  comparing one integer. Flattening five criteria into rows produces a file
  that validates, resolves every day, and decides some of them wrongly: the
  fifth criterion applies in occurrence and translation but NOT in concurrence,
  so the same two days can be ordered differently under two questions, and a
  single row number cannot express that. Every divergence from the rule is
  recorded in the `divergences` section below. This file states which rubric
  governs a decision. It does not state what was celebrated anywhere.
  Precedence is only one of five decisions, and a day resolved here is still
  subject to the particular calendar of the church, the place, the diocese and
  the religious institute, to a legitimate indult, and to the competent annual
  Ordo, which controls. Nothing here is an occurrence witness and nothing here
  authorises the use of any book.
