# ---------------------------------------------------------------------------
# Assignment. Ordered; the first rule whose predicate matches a mass wins.
# The pre-1955 calendar has 484 unstated base masses among the 489 masses its
# effective projection serves. Their source is the 1962 typical
# edition via the recension projection. The 1962 rank (I, II, III, Comm.) is
# the only grade information the mass index carries, and it is an
# APPROXIMATION of the pre-1955 grade:
#   1962 I   -> duplex I classis (rows 2-5)
#   1962 II  -> duplex II classis (rows 7-10)
#   1962 III -> semiduplex (rows 21-22) or simplex (row 23)
#   1962 Comm. -> commemoration
# The personal dignity sub-row is read from the `kind` field where the mass
# index carries one: christological -> of the Lord, marian -> of the BVM,
# sanctoral -> of other saints (with Apostles etc. not distinguished).
# ---------------------------------------------------------------------------
assignment:
# --- the five masses the pre-1955 calendar states explicitly ---
- {basis: row-1-triduum, keys: [mass-of-the-lords-supper, good-friday, easter-vigil], note: 'the pre-1955 Triduum services, the highest liturgical days'}
- {basis: alternative-formulary, keys: [blessing-of-palms], note: 'the pre-1955 blessing of palms is a service of fourteen units the 1962 book does not print; it precedes the Palm Sunday Mass and is not a competitor for the day'}
- {basis: alternative-formulary, keys: [mass-of-the-first-sunday-after-pentecost], note: 'the Missal''s own formulary for the first Sunday after Pentecost, whose slot Trinity Sunday occupies'}
- {basis: alternative-formulary, keys: [mass-of-the-first-sunday-after-epiphany], note: 'the Missal''s own formulary for the first Sunday after the Epiphany, whose slot the Holy Family occupies'}
- {basis: additional-mass, keys: [rogation-mass], note: 'the Rogation Mass is a further Mass appointed on the day, not a competitor for it'}
# --- temporal masses: duplex I classis of the Lord ---
- {basis: row-2-duplex-i-lord, keys: [easter-sunday, pentecost], note: 'Easter and Pentecost, duplex I classis with privileged octaves'}
- {basis: row-2-duplex-i-lord, keys: [nativitate-domini-octave], note: 'the Nativity of the Lord, duplex I classis with a privileged octave'}
- {basis: row-2-duplex-i-lord, keys: [epiphania-domini, ascension, trinity, corpus-christi, sacred-heart, christ-the-king], note: 'duplex I classis feasts of the Lord named in the calendar'}
- {basis: row-2-duplex-i-lord, keys: [pretiosissimi-sanguinis-domini-nostri-iesu-christi], note: 'the Precious Blood, duplex I classis of the Lord'}
- {basis: row-2-vigil, keys: [vigil-nativity-lord, vigil-of-pentecost], note: 'the privileged vigils of the Nativity and Pentecost'}
- {basis: row-2-octave-day, keys: [low-sunday], note: 'Low Sunday, the octave day of Easter, duplex I classis'}
- {basis: row-2-octave-day, keys: [easter-monday, easter-tuesday, easter-wednesday, easter-thursday, easter-friday, easter-saturday, pentecost-monday, pentecost-tuesday, pentecost-ember-wednesday, pentecost-thursday, pentecost-ember-friday, pentecost-ember-saturday], note: 'days within the privileged octaves of Easter and Pentecost'}
# --- temporal masses: duplex I classis of other saints ---
- {basis: row-5-duplex-i-other, keys: [omnium-sanctorum, commemoratione-omnium-fidelium-defunctorum], note: 'All Saints and All Souls, duplex I classis feasts not of the Lord, BVM, Angels or Apostles'}
# --- temporal masses: major Sundays ---
- {basis: row-6-major-sunday, keys: [advent-1, advent-2, advent-3, advent-4, lent-1, lent-2, lent-3, lent-4, passion-sunday, palm-sunday], note: 'the Sundays of Advent, Lent and Passiontide, semiduplex privileged'}
# --- temporal masses: privileged ferias ---
- {basis: row-20-privileged-feria, keys: [ash-wednesday, holy-monday, holy-tuesday, holy-wednesday], note: 'Ash Wednesday and the ferias of Holy Week (Monday to Wednesday), semiduplex privileged ferias'}
- {basis: row-20-privileged-feria, key_matches: '(^advent-ember-|^september-ember-|^lent-\d+-ember-)'}
- {basis: row-20-privileged-feria, key_matches: '^(thursday|friday|saturday)-after-ash-wednesday$'}
- {basis: row-20-privileged-feria, key_matches: '^(lent-\d+|passion)-(monday|tuesday|wednesday|thursday|friday|saturday)$'}
# --- temporal masses: greater vigils ---
- {basis: row-20-vigil, keys: [vigil-of-the-ascension, vigil-assumption, vigil-nativity-saint-john-baptist, vigil-saints-peter-paul], note: 'the greater vigils, semiduplex in grade'}
# --- temporal masses: duplex II classis ---
- {basis: row-7-duplex-ii-lord, keys: [holy-family, most-holy-name-of-jesus], note: 'duplex II classis feasts of the Lord, assigned to the Sunday they occupy'}
- {basis: row-8-duplex-ii-bvm, keys: [purificatione-beatae-mariae-virginis], note: 'the Purification, treated as a feast of the Lord in the Missal''s own rubric, here classified as duplex II classis of the BVM; the pre-1955 book heads it with the Purification of the BVM'}
# --- temporal masses: minor Sundays ---
- {basis: row-19-minor-sunday, keys: [sunday-within-octave-of-nativity, last-sunday-after-pentecost]}
- {basis: row-19-minor-sunday, key_matches: '^(epiphany|easter|pentecost|resumed-epiphany)-\d+$'}
- {basis: row-19-minor-sunday, keys: [septuagesima, sexagesima, quinquagesima, sunday-after-ascension]}
# --- temporal masses: days within the Christmas octave ---
- {basis: row-15-christmas-octave, keys: [fifth-day-within-octave, sixth-day-within-octave, seventh-day-within-octave], note: 'days within the octave of the Nativity that carry no feast of their own'}
# --- temporal masses: simplex vigil ---
- {basis: row-23-simplex-feast, keys: [vigil-saint-lawrence], note: 'the common vigil of St Lawrence, simplex in grade'}
# --- the one movable commemoration this calendar inscribes ---
- {basis: calendar-commemoration, keys: [comm-septem-dolorum-beatae-mariae-virginis], note: 'the Commemoration of the Seven Sorrows, inscribed as a commemoration on the Friday after Passion Sunday'}
# --- dated sanctorale: commemoration ---
- {basis: calendar-commemoration, dated: true, rank: Comm.}
# --- dated sanctorale: duplex I classis ---
- {basis: row-2-duplex-i-lord, dated: true, rank: I, kind: christological, note: 'duplex I classis feasts of the Lord, mapped from 1962 class I'}
- {basis: row-3-duplex-i-bvm, dated: true, rank: I, kind: marian, note: 'duplex I classis feasts of the BVM, mapped from 1962 class I'}
- {basis: row-4-duplex-i-angels-apostles, dated: true, rank: I, kind: sanctoral, note: 'duplex I classis feasts of Apostles etc., mapped from 1962 class I; the mass index does not distinguish Apostles from other saints, so all sanctoral class I feasts are placed at row 4 as an approximation'}
# --- dated sanctorale: duplex II classis ---
- {basis: row-7-duplex-ii-lord, dated: true, rank: II, kind: christological, note: 'duplex II classis feasts of the Lord, mapped from 1962 class II'}
- {basis: row-8-duplex-ii-bvm, dated: true, rank: II, kind: marian, note: 'duplex II classis feasts of the BVM, mapped from 1962 class II'}
- {basis: row-10-duplex-ii-other, dated: true, rank: II, note: 'duplex II classis feasts of other saints, mapped from 1962 class II'}
# --- dated sanctorale: semiduplex (from 1962 class III) ---
- {basis: row-21-semiduplex-lord-bvm, dated: true, rank: III, kind: marian, note: 'semiduplex feasts of the BVM, mapped from 1962 class III'}
- {basis: row-22-semiduplex-other, dated: true, rank: III, note: 'semiduplex feasts of other saints, mapped from 1962 class III; some may be simplex in the pre-1955 system, but the mass index does not distinguish them'}

# ---------------------------------------------------------------------------
# Implied days. The calendar index holds a formulary only where the Missal
# prints one. On many dates the day that a feast is measured against carries
# no mass key at all. These rules constitute that day from the season.
# ---------------------------------------------------------------------------
implied:
- id: advent-feria-late
  label: a feria of Advent from 17 to 23 December
  season: advent
  from: 12-17
  to: 12-23
  weekday_only: true
  basis: row-20-privileged-feria
  certain: true
  note: >-
    A semiduplex privileged feria of Advent. An Advent Ember Day falling in
    this window is also a privileged feria, so the row holds either way.
- id: advent-feria-early
  label: a feria of Advent before 17 December
  season: advent
  to: 12-16
  weekday_only: true
  basis: row-24-simplex-feria
  certain: true
  note: >-
    A simplex feria of Advent before 17 December, which yields to any feast
    and is commemorated if impeded.
- id: christmas-octave-day
  label: a day within the octave of the Nativity
  season: christmastide
  from: 12-26
  to: 12-31
  weekday_only: true
  basis: row-15-christmas-octave
  certain: true
- id: christmastide-feria
  label: a feria of Christmastide
  season: christmastide
  from: 01-02
  to: 01-05
  weekday_only: true
  basis: row-24-simplex-feria
  certain: true
- id: epiphanytide-feria
  label: a feria after the Epiphany
  season: epiphanytide
  weekday_only: true
  basis: row-24-simplex-feria
  certain: true
  note: >-
    The pre-1955 system celebrates the octaves of Christmas, Easter and
    Pentecost only, so the days after the Epiphany are ordinary ferias.
- id: septuagesima-feria
  label: a feria of Septuagesima
  season: septuagesima
  weekday_only: true
  basis: row-24-simplex-feria
  certain: true
- id: paschaltide-feria
  label: a feria of Paschaltide
  season: paschaltide
  weekday_only: true
  basis: row-24-simplex-feria
  certain: true
- id: september-feria
  label: a feria after Pentecost, in September
  season: after-pentecost
  from: 09-01
  to: 09-30
  weekday_only: true
  basis: row-24-simplex-feria
  certain: true
  note: >-
    A September Ember Day is a privileged feria at row 20, but an implied rule
    fires only where no candidate constitutes the day and none is temporal, so
    a weekday this rule reaches is one the year file has already shown carries
    no Ember Day.
- id: after-pentecost-feria
  label: a feria after Pentecost
  season: after-pentecost
  weekday_only: true
  basis: row-24-simplex-feria
  certain: true
saturday_office:
  basis: row-25-our-lady-on-saturday
  when_implied_basis: row-24-simplex-feria
  locus: the pre-1955 Breviary rubrics, De Sabbato
  latin: >-
    In sabbatis, in quibus occurrit Officium de feria simplici, fit de sancta
    Maria in sabbato.
  why: >-
    On a Saturday carrying a simplex feria the Office is of Our Lady on
    Saturday. Its Mass exists and may be sung, but any occurring feast
    displaces it, because row 25 sits below every semiduplex feast.
  mass:
    locus: the pre-1955 Missal, Commune Sanctorum, Missae de S. Maria in sabbato
    why: >-
      The Mass agrees with the Office of the day, and the Office is of Our
      Lady. This Saturday is not a simplex feria but the Office of Our Lady on
      Saturday, one row above it.
    printed: Commune Sanctorum, Missae de S. Maria in sabbato
    heading: >-
      Missae de S. Maria in sabbato, quae dici etiam possunt aliis diebus ut
      votivae de B. Maria Virgine
    forms:
    - mass: missa-de-s-maria-in-sabbato-1
      printed: Tempore Adventus
      season: advent
      note: >-
        Never reached as the Mass of the day. Every Saturday of Advent is a
        feria of row 24 or row 20, never of row 25.
    - mass: missa-de-s-maria-in-sabbato-2
      printed: A Nativitate Domini usque ad Purificationem
      from: 12-25
      to: 02-02
    - mass: missa-de-s-maria-in-sabbato-3
      printed: A die 3 februarii usque ad feriam IV Hebdomadae sanctae
      from: 02-03
      to_anchor: {anchor: easter, offset_days: -4}
    - mass: missa-de-s-maria-in-sabbato-4
      printed: Tempore paschali
      from_anchor: {anchor: easter, offset_days: 0}
      to_anchor: {anchor: easter, offset_days: 55}
    - mass: missa-de-s-maria-in-sabbato-5
      printed: A festo Ss. Trinitatis usque ad sabbatum ante dominicam I Adventus
      from_anchor: {anchor: trinity, offset_days: 0}
      before_anchor: {anchor: next_first_sunday_of_advent, offset_days: 0}

# ---------------------------------------------------------------------------
# Choices the rubrics themselves create.
# ---------------------------------------------------------------------------
mass_choices: []

# ---------------------------------------------------------------------------
# Decision three. What becomes of the day that lost.
# ---------------------------------------------------------------------------
known_absences: []

impediment:
  outcomes: [omission, commemoration, transfer, reposition]
  outcomes_locus: DA, Titulus III
  transfer:
    locus: DA, Titulus III
    applies_to: first-class feasts only
    destination:
      locus: DA, Titulus III
      rule: the next following day that is not duplex I classis or duplex II classis
      computed_here: false
      why_not: >-
        The destination depends on the grade of every following day and on the
        order in which several transferred feasts are placed. This repository
        does not compute it, and a page that guessed it would be asserting an
        Ordo result it has not checked. The two destinations the rubric fixes
        by name are computed, because the rubric states them.
    proper_seats:
    - key: annuntiatio-beatae-mariae-virginis
      locus: DA, Titulus III
      own_date: 03-25
      when: 25 March falls between Palm Sunday and the Saturday after Easter inclusive
      impeded_when_easter_offset_between: [-7, 6]
      destination: the Monday after Low Sunday
      seat_easter_offset: 8
    - key: commemoratione-omnium-fidelium-defunctorum
      locus: DA, Titulus III
      own_date: 11-02
      when: 2 November falls on a Sunday
      impeded_when_weekday: sunday
      destination: the following Monday
      seat_offset_days: 1
    keeps_its_class:
      locus: DA, Titulus III
  reposition:
    locus: DA, Titulus IV
    stated_only: true
    why: >-
      Reposition answers a perpetual collision, which is a permanent fact about
      a particular calendar rather than a fact about a date. This repository
      carries no particular calendar, so nothing here is ever repositioned.
  fixed_commemoration:
    locus: DA, Titulus III
    gloss: >-
      A commemoration attached to a date does not travel with the feast it
      accompanies.
  sunday_not_resumed:
    locus: DA, Titulus III
    gloss: >-
      An impeded Sunday is gone for that year. It is not moved forward, back,
      or into the following week.
  vigil_dropped:
    locus: DA, Titulus III
    gloss: >-
      A vigil is dropped altogether if it falls on a Sunday or on a duplex I
      classis feast, or if the feast it precedes is itself transferred or
      reduced to a commemoration.

# ---------------------------------------------------------------------------
# Commemoration. The pre-1955 system has a richer commemoration apparatus
# than the 1962 code: octaves, vigils, and the orationes pro diversitate
# Temporum all contribute commemorations. This section states the structure
# the assembly model needs and marks the complex cases as not decided here.
# ---------------------------------------------------------------------------
commemoration:
  kinds:
    locus: DA, Titulus VI
    gloss: >-
      An ordinary commemoration is made at every Low Mass and at the
      conventual Mass, and at no other sung Mass. A sung parish Mass that is
      not a conventual Mass drops every ordinary commemoration.
  privileged:
    locus: DA, Titulus VI
    list:
    - {clause: a, what: of the Sunday}
    - {clause: b, what: of a duplex I classis liturgical day}
    - {clause: c, what: of the days within a privileged octave}
    - {clause: d, what: of the privileged ferias of Advent, Lent and Passiontide}
    - {clause: e, what: of the greater Litanies, in the Mass}
  ceilings:
    locus: DA, Titulus VI
    rules:
    - {clause: a, when_class: I, max: 1, privileged_only: true, what: 'On a duplex I classis day, one commemoration only and it must be privileged.'}
    - {clause: b, when_class: II, when_nature: sunday, max: 1, privileged_only: false, second_class_feasts_only: true, displaced_by_privileged: true, what: 'On a duplex II classis Sunday, one commemoration only, of a duplex II classis feast; omitted if a privileged commemoration is due.'}
    - {clause: c, when_class: II, max: 1, privileged_only: false, what: 'On any other duplex II classis day, exactly one commemoration, privileged or ordinary.'}
    - {clause: d, when_class: [III, IV], max: 2, privileged_only: false, what: 'On a lower-grade day, two commemorations.'}
    sung_non_conventual:
      locus: DA, Titulus VI
      max: 1
      privileged_only: true
      what: >-
        A sung Mass that is not the conventual Mass admits one privileged
        commemoration and no more.
  exclusions:
    locus: DA, Titulus VI
    list:
    - {clause: a, what: 'A feast or mystery of one divine Person excludes a commemoration of another feast or mystery of the same Person.', applied: false}
    - {clause: b, what: 'The Sunday excludes a commemoration of a feast or mystery of the Lord, and conversely.', applied: true}
    - {clause: c, what: 'A commemoration de Tempore excludes another de Tempore.', applied: true}
    - {clause: d, what: 'A feast of Our Lady or of a saint excludes another commemoration asking the same intercession.', applied: false}
    not_applied_note: >-
      Clauses a and d turn on the identity of a divine Person or of a saint,
      which this file cannot read off a mass key. They are stated at the step
      where they would apply and are never applied.
  inseparable:
    locus: DA, Titulus VI
    what: >-
      The mutual commemoration of Ss Peter and Paul is inseparable: two
      prayers counting as one.
    applied: false
  order:
    locus: DA, Titulus VI
    gloss: The season first, then the order of precedence.
  surplus:
    locus: DA, Titulus VI
  abolished:
    what: >-
      The pre-1955 system carries the full commemoration apparatus that the
      1955 simplification removed: the Suffragium de omnibus Sanctis, the
      commemoratio de Cruce, and the seasonal second and third orations of
      Advent, Lent and the Sundays. These are NOT modelled here. A reader
      holding a pre-1955 hand missal is holding a book whose commemoration
      apparatus is richer than this file represents, and the printed second
      and third collects must be checked against the particular calendar
      before use.

# ---------------------------------------------------------------------------
# Decision five, as far as the orations.
# ---------------------------------------------------------------------------
orations:
  what_counts:
    locus: the pre-1955 Missal, Rubricae generales, De Orationibus
    what: >-
      the oration of the Mass being celebrated; the orations of a commemorated
      Office and of any occurring commemoration; other orations the rubrics
      prescribe; the prayer imposed by the local Ordinary; and the votive
      prayer.
  ceiling_covers_all:
    locus: DA, Titulus VI
    what: The ceiling counts all of them together, not only the commemorations.
  absolute_cap:
    locus: the pre-1955 Missal, Rubricae generales, De Orationibus
    value: 3
    gloss: Three orations at most, as in the 1960 code.
  conclusions:
    locus: the pre-1955 Missal, Rubricae generales, De Orationibus
    what: >-
      The Mass's own oration is said under its own conclusion unless another is
      joined to it; commemorations are said under a second conclusion.
  tracked_by:
  - {slot: Secret, locus: the pre-1955 Missal, De Orationibus, what: 'as many as there were orations at the beginning of Mass'}
  - {slot: Postcommunion, locus: the pre-1955 Missal, De Orationibus, what: 'the same number and order'}
  prayer_over_the_people:
    locus: the pre-1955 Missal, Rubricae generales, De Orationibus
    what: >-
      Added after the last postcommunion in Masses of the ferias of Lent and
      Passiontide, the Sacred Triduum excepted; under its own conclusion; said
      even when three postcommunions have preceded.
    applies_when_winner_basis: [row-20-privileged-feria]
  imposed_prayer:
    locus: the pre-1955 Missal, Rubricae generales, De Orationibus
    applied: false
    what: >-
      The local Ordinary may impose one prayer for a grave and public
      necessity. Whether one is imposed is a fact about a diocese.
  votive_prayer:
    locus: the pre-1955 Missal, Rubricae generales, De Orationibus
    applied: false
    what: >-
      Any priest may add one at his discretion in read non-conventual Masses
      on lower-grade days, placed last.

# ---------------------------------------------------------------------------
# Decision four is not taken here at all.
# ---------------------------------------------------------------------------
mass_category:
  assumed: the Mass of the Office of the day
  locus: the pre-1955 Missal, Rubricae generales, De Missa
  not_tested:
  - {category: festive Mass, locus: the pre-1955 Missal, Rubricae generales}
  - {category: votive Mass, locus: the pre-1955 Missal, Rubricae generales}
  - {category: Requiem and funeral Mass, locus: the pre-1955 Missal, Rubricae generales}
  - {category: ritual and nuptial Mass, locus: the pre-1955 Missal, Rubricae generales}
  - {category: external solemnity, locus: the pre-1955 Missal, Rubricae generales}
  warning: >-
    A day's grade tells you only that a category is not excluded. What admits
    it is a separate fact, and permission is never inferred from rank.

not_decided_here:
- Which calendar binds the celebrant, and every particular, diocesan, religious,
  patronal, titular and dedication feast that calendar carries. This file
  carries only the universal calendar.
- The Gloria, which depends on whether the Te Deum was said at Matins.
- The Creed, the Preface, the colour, the Last Gospel and the tone.
- Whether a duplex I classis feast transferred from an earlier date occupies
  this one, except at the two proper seats the rubric names.
- Concurrence, which disposes of Vespers and never of the next morning's Mass.
- The full commemoration apparatus of the pre-1955 rite, including the
  Suffragium de omnibus Sanctis, the commemoratio de Cruce, and the seasonal
  orations of Advent, Lent and the Sundays. These are richer than this file
  models and must be checked against the particular calendar.

# ---------------------------------------------------------------------------
# Divergences from the rule. This file is a linearization, and every place it
# departs from the five criteria is recorded here.
# ---------------------------------------------------------------------------
divergences:
- what: primary and secondary first-class are merged
  rule_states: >-
    Criterion (b) of Divino afflatu distinguishes primary first-class feasts
    from secondary. A primary first-class feast outranks a secondary one of the
    same personal dignity.
  this_file_reads: >-
    All duplex I classis feasts of the same personal dignity share one row
    (rows 2-5). The mass index carries no field that distinguishes primary
    from secondary, so the table cannot separate them.
  consequence: >-
    Where a primary and a secondary first-class feast of the same dignity
    occur on the same day, the table reports a tie and the day is marked
    unsettled. In practice this is rare and usually involves feasts that do
    not collide in the universal calendar.
  reported: true
- what: major Sundays are placed between duplex I classis and duplex II classis
  rule_states: >-
    Criterion (a) says the higher rite wins "unless a Sunday ... occurs". The
    exception means major Sundays (Advent, Lent, Passiontide) do not yield to
    duplex II classis or below, but they do yield to duplex I classis.
  this_file_reads: >-
    Major Sundays are at row 6, between duplex I classis (rows 2-5) and duplex
    II classis (rows 7-10). This is the ordering the exception clause produces:
    the Sunday yields to duplex I classis but not to anything below.
  consequence: >-
    A duplex II classis feast occurring on a major Sunday is correctly
    displaced. A duplex I classis feast occurring on a major Sunday correctly
    displaces it.
  reported: true
- what: criterion (e) propriety of feasts is not expressed in the table
  rule_states: >-
    Criterion (e) says a proper feast outranks a common feast of the same
    grade, in occurrence and in reposition/translation, but NOT in concurrence.
    So the same two days can be ordered differently depending on the question
    being asked.
  this_file_reads: >-
    A single row number is one order for all questions. This file cannot
    express criterion (e). Where a proper and common feast of the same grade
    occur, the table reports a tie and the day is marked unsettled.
  consequence: >-
    Occurrence cases where propriety would separate two same-grade feasts are
    not resolved here. Concurrence cases where propriety does NOT apply are
    correctly left as ties, which is the right answer for the wrong reason.
  reported: true
- what: 1962 class III maps to semiduplex only
  rule_states: >-
    The pre-1955 system distinguishes duplex minus, semiduplex, and simplex
    below duplex majus. The 1962 system collapsed all three into class III.
  this_file_reads: >-
    All 1962 rank III masses are mapped to semiduplex (rows 21-22). Some were
    duplex minus or simplex in the pre-1955 system, but the mass index does
    not distinguish them.
  consequence: >-
    A 1962 class III feast that was simplex in the pre-1955 system is placed
    one row too high, and a class III feast that was duplex minus is placed
    too low. Both are approximations.
  reported: true
- what: personal dignity is approximated from the kind field
  rule_states: >-
    Criterion (c) orders feasts by personal dignity: Lord > BVM > Angels >
    John Baptist > Joseph > Apostles/Evangelists > other saints.
  this_file_reads: >-
    The mass index carries a `kind` field with values christological, marian,
    and sanctoral. It does not distinguish Angels, John Baptist, Joseph, or
    Apostles from other saints. All sanctoral feasts of a given grade are
    placed at the same row (the "other saints" row), regardless of whether
    they are Apostles or non-Apostles.
  consequence: >-
    An Apostle and a non-Apostle saint of the same grade share a row. Where
    they occur on the same day, the table reports a tie.
  reported: true

# ---------------------------------------------------------------------------
# Unsettled cases. Questions this file does not answer.
# ---------------------------------------------------------------------------
unsettled:
- what: the twenty-three-Sunday shortfall after Pentecost
  why: >-
    This structural recension inherits the base calendar's computation, which
    emits both the numbered Sunday and the last Sunday in the shared slot and
    refuses to choose between them. The former citation to "the pre-1955
    Breviary rubrics, De Dominica" did not identify a precise, collated locus in
    a target-edition witness and cannot override that date-scoped refusal. A
    competent dated Ordo is required.
- what: two candidates that land on the same row
  why: >-
    The table orders within several rows by properties — primary before
    secondary, proper before common, Apostles before other saints — that a
    mass key does not carry. Where two candidates tie, the derivation stops
    and says the day is not settled here.
- what: 'a fixed-date feast inherited as 1962 class III colliding with a day in rows 15 through 23'
  scope: 'occurrence'
  when:
    candidate_basis:
    - 'row-21-semiduplex-lord-bvm'
    - 'row-22-semiduplex-other'
    candidate_origin: 'fixed-date'
    with_precedence_place:
      min: 15
      max: 23
  why: 'The inherited mass index says only that the feast was class III in
    1962. In the pre-1955 system it may instead have been duplex minus,
    semiduplex, or simplex, occupying rows 15 through 23 according to personal
    dignity. Against another day in that same range, the missing historical
    grade can change the winner, tie, or commemoration disposition. No target
    edition source held here identifies that grade, so this occurrence must
    remain unresolved. A competitor above row 15 defeats every possible grade,
    and one below row 23 loses to every possible grade; those deterministic
    cases remain settled.'
- what: criterion (e) propriety in occurrence
  why: >-
    Where a proper feast and a common feast of the same grade occur on the
    same day, criterion (e) would separate them in occurrence. This file
    cannot express that, so the day is marked unsettled.
- what: DA Titulus III second paragraph and Titulus VI clauses a and d
  why: >-
    All turn on the identity of a divine Person or of a saint, which cannot be
    read off a mass key. They are stated where they would apply and never
    applied.
- what: the full pre-1955 commemoration apparatus
  why: >-
    The Suffragium de omnibus Sanctis, the commemoratio de Cruce, and the
    seasonal orations of Advent, Lent and the Sundays are not modelled here.
    A page serving pre-1955 from this file shows fewer orations than a
    pre-1955 hand missal prints.

# ---------------------------------------------------------------------------
# Solved cases. Each is checked by running the browser's own derivation
# against the generated data, so the page and this file cannot drift apart
# silently.
# ---------------------------------------------------------------------------
worked_cases:
- id: case-easter-sunday-displaces-a-saint
  source: composed for this file from the 1962 worked-case ledger, adapted to the pre-1955 grade system
  date: '2026-04-05'
  why: >-
    Easter Sunday, a duplex I classis feast of the Lord at row 2, displaces
    St Vincent Ferrer, a semiduplex feast at row 22. The saint is omitted,
    not transferred, because only duplex I classis feasts are transferred and
    he is semiduplex; and he is not commemorated, because Easter is a
    first-class day that admits one privileged commemoration only.
  expect:
    winner: easter-sunday
    winner_row: 2
    orations_low_mass: 1
    settled: true
    readable:
      said: [easter-sunday]
      displaced: [s-vincentii-ferrerii-confessoris]
- id: case-all-saints-on-a-sunday
  source: composed for this file, adapted from the 1962 Case at 2026-11-01
  date: '2026-11-01'
  why: >-
    All Saints, a duplex I classis feast of other saints at row 5, displaces
    a minor Sunday at row 19. The Sunday's commemoration is privileged, so
    it survives even at a sung Mass.
  expect:
    winner: omnium-sanctorum
    winner_row: 5
    commemorated: [pentecost-23]
    orations_low_mass: 2
    orations_sung_non_conventual: 2
    settled: true
