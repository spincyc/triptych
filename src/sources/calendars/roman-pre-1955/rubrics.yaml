# ---------------------------------------------------------------------------
# Where every rule below came from
#
# The pre-1955 Missal defers precedence to the Office/Breviary. The rule is
# Titulus II De Festorum praestantia of Divino afflatu, AAS 3 (1911) 641-642.
# It was located, fetched and read on 2026-08-01; being a 1911 publication it
# is in the public domain. The full sourcing record — seven located sources
# with rights, the repositories searched, and the aliases each was searched
# under — is at `src/sources/inventories/pre-1955-rubrics-sources-v1.toml`.
#
# This file is an APPROXIMATION produced by linearizing the five criteria into
# numbered rows, because this repository's tooling requires it. The sourcing
# record's own finding `the-rule-is-criteria-not-rows` states the blocker
# plainly: the rule is five ordered criteria and `tools/calendar-rubrics` can
# only express a table of numbered rows. This file is written with that
# limitation acknowledged in every section that departs from the rule.
# ---------------------------------------------------------------------------
derived_from:
  publication: src/sources/inventories/pre-1955-rubrics-sources-v1.toml
  rule: Divino afflatu, Titulus II, De Festorum praestantia, AAS 3 (1911) 641-642
  sections:
  - Titulus II, De Festorum praestantia (the five criteria)
  - Titulus III, De occurrentia et translatione Festorum
  - Titulus V, De concurrentia
  - Titulus VI, De Commemorationibus
  worked_cases: composed for this file from the 1962 worked-case ledger, adapted to the pre-1955 grade system
  witnesses:
  - id: segment.catholic-church.rubricae-divino-afflatu.aas-03-1911.pages-641-642
    role: direct-witness
    what: >-
      the promulgated text of the precedence rule, at AAS 3 (1911) 641-642,
      sha256 590a78b670da67f013ea6fc0b62bb7ed347dc89a9267fbb7ddc0380f1e872f7c,
      fetched from vatican.va 2026-08-01
  - id: src/sources/inventories/pre-1955-rubrics-sources-v1.toml
    role: sourcing-record
    what: the sourcing record that located, read and graded every source this file rests on

# ---------------------------------------------------------------------------
# Precedence. The five criteria of Divino afflatu Titulus II, linearized.
#
# The rule opens: "Ut recte dignoscatur quale ex pluribus Officiis sit
# praestantius ... sequentes praestantiae characteres considerandi sunt" —
# five characters, in order, until one separates two days:
#
#   a) Ritus altior — higher grade, unless a Sunday, feria, privileged octave
#      or octave day occurs
#   b) Ratio Primarii aut Secundarii — primary or secondary first-class
#   c) Dignitas Personalis — Lord > BVM > Angels > John Baptist > Joseph >
#      Apostles/Evangelists > other
#   d) Sollemnitas externa — obligation + octave
#   e) Proprietas Festorum — proper > common, in occurrence and reposition/
#      translation ONLY, not in concurrence
#
# The linearization flattens (a)-(d) into numbered rows. Criterion (e) is
# handled through `overrides` for known occurrence cases and marked
# `unsettled` where a proper and common feast of the same grade would tie in
# concurrence. The grade system is: duplex I classis > duplex II classis >
# duplex majus > duplex minus > semiduplex > simplex.
#
# DIVERGENCE: Primary and secondary first-class are MERGED. The rule
# distinguishes them by criterion (b); this file cannot read that distinction
# off a mass key, so all duplex I classis feasts of the same personal dignity
# share one row. Where a primary and a secondary first-class feast of the same
# dignity occur, the table cannot separate them and the day is marked
# unsettled. See `divergences`.
# ---------------------------------------------------------------------------
precedence:
  stated: true
  locus: DA, Titulus II
  latin: >-
    Ut recte dignoscatur quale ex pluribus Officiis sit praestantius et proinde
    sive in occurrentia, sive in concurrentia, sive in ordine repositionis aut
    translationis praeferendum, sequentes praestantiae characteres considerandi
    sunt: a) Ritus altior; b) Ratio Primarii aut Secundarii; c) Dignitas
    Personalis; d) Sollemnitas externa; e) Proprietas Festorum.
  gloss: >-
    Five ordered criteria, not a table. This file flattens criteria (a)-(d)
    into twenty-five numbered rows by grade and personal dignity. Criterion
    (e) is handled separately. A lower row number wins.
  rows:
  - {row: 1, class: I, label: 'The Sacred Triduum: Maundy Thursday, Good Friday, Holy Saturday'}
  - {row: 2, class: I, label: 'Duplex I classis of the Lord (Nativity, Easter, Pentecost, Epiphany, Ascension, Trinity, Corpus Christi, Sacred Heart, Christ the King, Precious Blood, and their privileged vigils and octave days)'}
  - {row: 3, class: I, label: 'Duplex I classis of the Blessed Virgin Mary'}
  - {row: 4, class: I, label: 'Duplex I classis of the Angels, St John Baptist, St Joseph, the Apostles and Evangelists'}
  - {row: 5, class: I, label: 'Duplex I classis of other saints'}
  - {row: 6, class: I, label: 'Major Sundays: the Sundays of Advent, Lent and Passiontide', note: 'Semiduplex in grade but privileged under criterion (a): these Sundays yield only to duplex I classis. Placed below duplex I classis and above duplex II classis, which is the ordering the exception clause produces.'}
  - {row: 7, class: II, label: 'Duplex II classis of the Lord'}
  - {row: 8, class: II, label: 'Duplex II classis of the Blessed Virgin Mary'}
  - {row: 9, class: II, label: 'Duplex II classis of the Angels, St John Baptist, St Joseph, the Apostles and Evangelists'}
  - {row: 10, class: II, label: 'Duplex II classis of other saints'}
  - {row: 11, class: II, label: 'Duplex majus of the Lord'}
  - {row: 12, class: II, label: 'Duplex majus of the Blessed Virgin Mary'}
  - {row: 13, class: II, label: 'Duplex majus of the Angels, St John Baptist, St Joseph, the Apostles and Evangelists'}
  - {row: 14, class: II, label: 'Duplex majus of other saints'}
  - {row: 15, class: III, label: 'Duplex minus of the Lord'}
  - {row: 16, class: III, label: 'Duplex minus of the Blessed Virgin Mary'}
  - {row: 17, class: III, label: 'Duplex minus of the Angels, St John Baptist, St Joseph, the Apostles and Evangelists'}
  - {row: 18, class: III, label: 'Duplex minus of other saints'}
  - {row: 19, class: III, label: 'Minor Sundays (all Sundays not of Advent, Lent or Passiontide)'}
  - {row: 20, class: III, label: 'Privileged ferias and greater vigils: the ferias of Lent, Ash Wednesday, the ferias of Advent from 17 to 23 December, the Ember Days, and the greater vigils'}
  - {row: 21, class: III, label: 'Semiduplex feasts of the Lord, the Blessed Virgin Mary, the Angels, St John Baptist, St Joseph, the Apostles and Evangelists'}
  - {row: 22, class: III, label: 'Semiduplex feasts of other saints'}
  - {row: 23, class: IV, label: 'Simplex feasts and common vigils'}
  - {row: 24, class: IV, label: 'Simplex ferias'}
  - {row: 25, class: IV, label: 'The Office of Our Lady on Saturday'}
  occurrence:
    locus: DA, Titulus III; ADA, Titulus IV
    gloss: >-
      Occurrence is the meeting of two or more Offices on the same day.
      Accidental occurrence may lead to transfer; perpetual occurrence may lead
      to reposition. Criterion (e) — propriety of feasts — applies in
      occurrence but NOT in concurrence.
  effect:
    locus: DA, Titulus III
    gloss: >-
      The Office of lower rank yields: by omission, commemoration, transfer, or
      reposition. Only duplex I classis feasts may be transferred; others are
      commemorated or omitted.
  concurrence:
    locus: DA, Titulus V
    gloss: >-
      Concurrence is the meeting of one evening's Vespers, not of two days. It
      never decides which Mass is said the next morning. Criterion (e) does NOT
      apply in concurrence, so a proper feast and a common feast of the same
      grade tie rather than being separated by propriety.
    decides_the_mass: false

# ---------------------------------------------------------------------------
# Overrides. Rules that defeat a straight comparison of row numbers.
# ---------------------------------------------------------------------------
overrides:
- id: all-souls-yields-to-a-sunday
  key: commemoratione-omnium-fidelium-defunctorum
  yields_to: sunday
  locus: DA, Titulus III; the pre-1955 Breviary rubrics
  why: >-
    The Commemoration of All the Faithful Departed yields to an occurring
    Sunday. The 1962 code states this in the table row itself; the pre-1955
    rule states it in the occurrence rubrics of the Breviary, to which the
    Missal defers.
- id: same-divine-person-or-same-saint
  locus: DA, Titulus III
  stated_only: true
  why: >-
    Two feasts of the same divine Person, or of the same saint, do not
    commemorate one another: the lower is simply omitted and is not
    transferred. This file cannot detect that identity from a mass key, so it
    is stated and never applied.

