schema: triptych-calendar-masses/v1
edition: Missale Romanum, editio typica Vaticana 1920
edition_short: Pre-1955 Missal
calendar: roman-pre-1955

# --- what this file is ------------------------------------------------------
#
# A RECENSION: the Roman Missal as it stood before the Holy Week reform of 1955,
# held as its DEPARTURES from a calendar already in this repository and never as
# a second copy of it. guidance/recensions.md Rule 2 owns that rule; the
# mechanism is `scripts/_calendars.py`, and `tools/tpt check-calendar-masses`
# refuses a departure that names a mass the base does not hold.
#
# The file is six rows long. That is not a stub: under a projection the shared
# remainder of the year expresses no departure, which is to say NO ROWS AT ALL,
# and the size of this file is therefore a measurement of how far the pre-1955
# book sits from the 1962 one in the part anyone has established. Five rows are
# the liturgies guidance/recensions.md section 7 named as the place to start; the
# sixth is the Chrism Mass, which was carried as an open question until the
# witnesses were read on 2026-08-01 and is the first row here established by
# reading a pre-1955 book rather than by reading an act.

# --- the two relations, which are not the same claim -------------------------
#
# `text_from` is MECHANICAL and points at where text has been transcribed IN
# THIS REPOSITORY. Every entry this file does not state is served from
# `roman-1962` and stamped as such, because the 1962 typical edition is the only
# printing anyone here has read a proper from. That is Rule 2a: a text resides in
# the base, its witnesses are recorded per witness, and a text attested by only
# one printing says so.
#
# It is NOT a claim that the pre-1955 book descends from the 1962 one. It does
# not, and `stands_before` is where the descent is recorded, in the vocabulary of
# acts rather than of books.
#
# WHY RESIDENCE HAS NOT BEEN FLIPPED. The maintainer's ruling is that the
# pre-1955 book is the base and 1962 a revision on top of it, and the measurement
# below supports it. Flipping residence — moving 2,312 propers into this
# directory and leaving 1962 as the departure file — is refused HERE and now for
# one reason, stated in guidance/recensions.md section 6 as precondition 0: no
# proper in this repository yet records which printings have been read for it.
# Until it does, moving the transcriptions under a 1920 heading would assert a
# provenance nobody established, which is the defect the whole apparatus exists
# to catch. The flip is the work; declaring the recension is not blocked on it.
text_from: roman-1962
stands_before: maxima-redemptionis-1955

# This warning is public data, not renderer-owned copy. Consumers must preserve
# it beside the coverage record so a projected 1962 formulary cannot be
# described as a complete transcription of the target recension.
advisory: >-
  Structural-only pre-1955 projection, not a complete 1920 Missal corpus. Only
  six Holy Week departures are established here. Every unstated formulary is
  served mechanically from roman-1962 without target-recension collation and
  must be described as inherited and uncollated rather than complete for 1920.

# This is the executable boundary around the projection. It accounts for what
# this recension independently establishes, what it inherits without a target-
# edition collation, and what must be acquired or modelled before `complete`
# could be true. `scripts/_calendars.py` validates the closed fields and enums.
recension_coverage:
  schema: triptych-recension-coverage/v1
  as_of: '2026-08-26'
  status: structural-only
  domains:
    calendar:
      state: partial
      basis: >-
        Six Holy Week departures are stated. The remainder of the temporal and
        sanctoral calendar is inherited from roman-1962 without a pre-1955
        kalendarium collation, including the octaves and vigils affected by the
        March 1955 simplification.
    precedence:
      state: partial
      basis: >-
        The companion rubrics source openly linearizes the five Divino afflatu
        criteria into numbered rows. It records divergences and supports a
        finding aid, but it does not implement the criteria as criteria.
    propers:
      state: none
      basis: >-
        No Proper wording in this departure file is transcribed from or
        page-collated against the 1920 typical edition. Known-different bundled
        formularies carry typed unavailable status and no pseudo-Proper rows;
        unstated formularies are mechanical roman-1962 fallback, not pre-1955
        attestations.
    commons:
      state: inherited-uncollated
      basis: >-
        Every Common is inherited from roman-1962. No pre-1955 witness has been
        collated against those formularies, so inheritance proves availability
        in the projection and not identity in the target recension.
    ordinary:
      state: partial
      basis: >-
        A separate Ordinary inventory transcribes the 1861 Cummiskey lay
        missal, including its facing Latin where printed. It is neither the 1920
        altar book nor an element-by-element collation against that typical
        edition.
    ceremonies:
      state: structural-only
      basis: >-
        The act history records structural units for Palm Sunday and the
        Triduum from OCR and promulgating acts. It expressly excludes a complete
        ceremonial, notation, the Office, and unstated units.
  inheritance:
    source_calendar: roman-1962
    status: uncollated
    basis: >-
      `text_from` is a mechanical fallback to the only target altar-book corpus
      transcribed in this repository. It does not assert that any unstated 1962
      entry was checked in a pre-1955 witness or remained unchanged.
  evidence:
  - id: roman-holy-week-structure
    domains: [calendar, ceremonies, propers]
    grade: ocr-structure-read
    record: src/sources/inventories/roman-holy-week-acts-v1.toml
    basis: >-
      The inventory records the unit-level structure and acts behind these Holy
      Week departures, while refusing its OCR readings as witnesses to wording.
    witnesses:
    - missale-romanum-1920
    - pustet-1862
    - aas-47-1955
    - benziger-iuxta-typicam-1962
  - id: divino-afflatu-precedence
    domains: [calendar, precedence]
    grade: source-read
    record: src/sources/inventories/pre-1955-rubrics-sources-v1.toml
    basis: >-
      Titulus II of the 1911 rubrics was read in the publisher PDF. The current
      table is a disclosed linearization of its five criteria rather than a
      claim that the source printed numbered precedence rows.
    witnesses:
    - aas-03-1911
  - id: cummiskey-ordinary
    domains: [ordinary]
    grade: page-image-collated
    record: src/sources/inventories/roman-pre-1955-ordo-missae-v1.toml
    basis: >-
      The 1861 witness was transcribed from page images at the grades its
      inventory states. This establishes that witness only, not the wording of
      the 1920 typical edition.
    witnesses:
    - edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861
  blockers:
  - id: register-1920-typical-edition
    kind: unregistered-artifact
    status: open
    record: src/sources/inventories/missal-acquisition-audit-v1.toml#missale-romanum-1920-typica
    requirement: >-
      Register and fingerprint one complete page-image artifact of the 1920
      Vatican typical edition before its wording or page loci become corpus
      evidence.
  - id: collate-1920-typical-edition
    kind: page-image-collation
    status: open
    record: src/sources/inventories/missal-acquisition-audit-v1.toml#missale-romanum-1920-typica
    requirement: >-
      Transcribe and page-collate the target edition's calendar, Propers,
      Commons, Ordinary, and Holy Week. OCR may locate text but may not supply
      it; the measured correction rate was 38 of 99 orations.
  - id: record-per-proper-attestation
    kind: provenance-gap
    status: open
    record: guidance/recensions.md#6-what-must-be-true-before-any-data-moves
    requirement: >-
      Give every Proper a per-witness attestation before residence is moved
      from roman-1962 or inherited text is described as pre-1955.
  - id: transcribe-pre-1955-kalendarium
    kind: data-transcription
    status: open
    record: src/sources/inventories/pre-1955-rubrics-sources-v1.toml#pre-1955-kalendarium-read-as-data
    requirement: >-
      Read a pre-1955 general calendar from page images, including grades,
      octaves, and vigils; do not reconstruct it by subtracting 1962.
  - id: implement-criteria-precedence
    kind: schema-gap
    status: open
    record: src/sources/inventories/pre-1955-rubrics-sources-v1.toml#the-rule-is-criteria-not-rows
    requirement: >-
      Model the five ordered criteria directly, including the different role of
      propriety in occurrence and concurrence, and replace the present numbered
      linearization with source-shaped evaluation and solved cases.
  - id: acquire-1900-typical-edition
    kind: missing-witness
    status: blocked
    record: src/sources/inventories/missal-acquisition-audit-v1.toml#missale-romanum-1900-typica
    requirement: >-
      Locate the 1900 typical edition that the 1920 decree names as its parent,
      closing the act history's one `via_unrepresented` edge.
  - id: distinguish-1956-1960-holy-week
    kind: unmodeled-recension
    status: blocked
    record: src/sources/inventories/missal-acquisition-audit-v1.toml#ordo-hebdomadae-sanctae-1956
    requirement: >-
      Read the restricted 1956 Ordo in a lawful accessible copy and model the
      1956-1960 middle state before attributing every pre-1955-to-1962 Holy Week
      difference to the 1955 reform.
  - id: scope-pre-1955-pontifical
    kind: scope-exclusion
    status: open
    record: src/sources/inventories/pre-1955-rubrics-sources-v1.toml#pontificale-pre-1955
    requirement: >-
      Keep the blessing of oils outside the Missal claim until an identified
      pre-1955 Pontificale Romanum edition is registered and read.

series: departures of the pre-1955 Roman Missal from the 1962 typical edition
ordering: departures in the order the Missal prints the days they fall on
registry: src/sources/inventories/roman-holy-week-acts-v1.toml (unit-level record)
psalm_numbering: vulgate
citation_convention: Vulgate book names and Vulgate psalm numbering
orthography: 1920 typical edition Latin (j retained, ae/oe digraphs)

verification: |
  NO TEXT IS TRANSCRIBED IN THIS FILE, and no row below carries a word of Latin
  read from any book. Every departure states an identity, a placement, or a
  structural fact, and cites the record that established it.

  That is a bound, not an oversight, and it has two causes worth separating.

  The pre-1955 witnesses this project holds — the 1920 typical edition and the
  1862 Pustet printing — are read only through Internet Archive OCR text layers,
  which `src/sources/inventories/roman-holy-week-acts-v1.toml` grades `ocr-only`
  and refuses to treat as a witness to wording. This repository has measured what
  that grade is worth: on 2026-07-31 it collated 99 orations taken from the OCR
  of a single printing against that printing's page images and CORRECTED 38 of
  them. Landing OCR here as payload would put a known 38-in-99 error rate into a
  file a page reads from.

  The reformed rite's own book — the Ordo Hebdomadae Sanctae instauratus of 1956
  — is located, identified and NOT retrievable: both Internet Archive items
  report `access-restricted-item: true`, and its rights are `holy-see-post-1929`
  with `may_publish_text = no`
  [src/sources/inventories/missal-acquisition-audit-v1.toml, ordo-hebdomadae-sanctae-1956].

  So the extent claimed here is structure, and the silence about text is silence
  because nothing was established — guidance/recensions.md Rule 4 — never because
  the text was checked and found the same.

extent: |
  Four liturgies: Palm Sunday, Thursday, Friday and Saturday of Holy Week, plus
  the blessing of palms that precedes the first of them and the Chrism Mass that
  the reform gave the second of them and the pre-1955 books do not print. This
  file claims nothing about any other day, about the Ordinary, about the Canon,
  about the Office, or about the octaves and vigils the 1955 simplification of
  the rubrics removed.

  THIS DIRECTORY NOW SHIPS AN EXPLICITLY APPROXIMATE `rubrics.yaml`. It
  linearizes the five ordered criteria of Divino afflatu, Titulus II, into the
  numbered rows the current calendar tooling can consume, records every known
  divergence from that reduction, and allows the browser to offer this
  recension. It is a finding aid and not the pre-1955 rule itself.

  The source is Titulus II, De Festorum praestantia, of the rubrics issued under
  Divino afflatu, at Acta Apostolicae Sedis 3 (1911) 641-642. The rule is five
  criteria - higher rite, primary or secondary, dignity of the Person, external
  solemnity, and propriety of the feast - taken in order until one separates two
  days, with the fifth applying in occurrence and translation and NOT in
  concurrence. A single row number cannot preserve that distinction.

  The rubrics file therefore does not establish that any inherited 1962 rank,
  feast, octave, vigil, commemoration, or formulary is correct for the target
  recension. Its classifications are an acknowledged projection over the 1962
  mass index wherever this file states no departure. The full sourcing record,
  including the located sources, rights, searched repositories, aliases, and
  schema limitation, is at
  `src/sources/inventories/pre-1955-rubrics-sources-v1.toml`.

conventions:
- a departure states one primary `departure` kind, which is what the machinery
  acts on, and carries any further kinds under `also`, each with its own basis.
  The Triduum is where one liturgy departs several ways at once, and a schema
  admitting one kind per row would have made this file choose which difference to
  record and drop the rest. Where the inherited formulary is known to differ,
  `replaced` is primary so the unverified 1962 words cannot be served under a
  pre-1955 heading; movement, renaming and reslotting remain under `also`
- a `renamed` or `moved` departure overlays only the scalar fields it restates; the
  formulary stays the base's, because saying the liturgy is the same one and then
  reprinting it beside itself is the copy Rule 2 refuses
- every departure cites the record that established it. A departure with no basis
  is a difference someone asserted, not one someone read
- unit-level detail — which prophecy, which oration, which antiphon — lives once,
  in `src/sources/inventories/roman-holy-week-acts-v1.toml`, and is referenced
  here rather than copied. That file holds 38 units of these same four liturgies
  with their loci in the 1920 and 1862 witnesses; restating them here would be
  the second source of truth guidance/the-shape.md section 2 forbids

open_collation_items:
- The 1955 reform and the 1962 typical edition are NOT DISTINGUISHED by the
  evidence behind this file, and that is its largest open question. The act
  history reads the post-reform state entirely from a 1962 printing, so every
  row below states a pre-1955-against-1962 difference and attributes it to
  Maxima Redemptionis on the strength of the decree's own text. Whether the
  1956-1960 book differs from the 1962 one in these liturgies is UNRECORDED
  here, and settling it needs the restricted 1956 Ordo. Anyone reading this file
  as a record of the middle state is reading it wrongly; see
  guidance/recensions.md Rule 5, which is exactly this hazard.
- >-
  FOUR ACTS PRODUCE THIS DELTA, NOT ONE, AND THE FILE'S LABEL NAMES ONLY THE
  SECOND. The distance from the state this file holds to `roman-1962` was made
  by `de-rubricis-simpliciorem-1955` of 23 March 1955, which owns the octaves,
  the vigils and the `semiduplex` vocabulary and is answerable for ZERO of the
  rows below; `maxima-redemptionis-1955` of 16 November 1955, which owns the
  Holy Week order and 36 of the departures the act history records;
  `codex-rubricarum-1960`, which owns 2; and `editio-typica-1962`, which owns 4.
  `stands_before` is a scalar and names the second of them, so a reader who
  takes this file as the 1962 book minus one reform charges the 1960 code's work
  to Pius XII, which is precisely the blending of states this project forbids.
  Two mechanical fixes are open and neither is made here: whether
  `stands_before` should name the EARLIEST act a state stands before or admit a
  list of act ids, which is a schema decision for the maintainer; and whether a
  departure row should carry an optional `act`, so each row says which act made
  it instead of the file attributing all of them to one. Until the second lands,
  the apportionment above is the only place the difference is written down.
- The 1955 simplification of the rubrics (de-rubricis-simpliciorem, 23 March
  1955) removed most octaves and vigils and changed the ranking vocabulary.
  Those are calendar-wide departures — probably the largest set this recension
  will ever carry — and NOT ONE is stated as a departure in this file. The
  companion `rubrics.yaml` classifies the inherited 1962 mass list through a
  documented linearization; it is not a pre-1955 calendar witness and does not
  establish which inherited feasts, octaves or vigils belong in the target
  state. The absence is on the record rather than left for a reader to infer
  from a short file.
- >-
  THE CHRISM MASS QUESTION IS CLOSED, AND HOW IT CLOSED IS THE POINT. This file
  carried it as an open question rather than writing `absent`, because a separate
  Chrism Mass being `widely understood` to be a 1955 creation is not evidence,
  and a row written on that basis would have been a 1955 calendar reconstructed
  by undoing 1962. On 2026-08-01 the two pre-1955 witnesses were fetched whole
  and read, each prints exactly one Mass on Holy Thursday, and the departure is
  now stated with that reading as its basis. The question stood open for one day
  and cost one fetch; had it been answered from what is widely understood, it
  would have been right for the wrong reason and nothing would have recorded the
  difference.
- >-
  THE TWO PRE-1955 WITNESSES DISAGREE ABOUT THE HOUR RUBRIC, AND THIS FILE'S
  LARGEST DEPARTURE RESTS ON IT. The `easter-vigil` row below argues from the
  general rubric De hora celebrandi Missam, which the 1920 typical edition prints
  as `Missa privata saltem post Matutinum et Laudes quacumque hora ab aurora
  usque ad meridiem dici potest` [MissaleRomanum1920_djvu.txt 9710-9713]. The
  1942 Benziger prints the SAME title with a WIDER window - `ab una hora ante
  auroram usque ad unam horam post meridiem` [ia-djvu-ocr-724a04fa 5248-5250] -
  which is the measure of canon 821 of the 1917 Code rather than the older
  rubric. So `the pre-1955 book allows Mass only from dawn to noon` is true of
  the 1920 printing and NOT of every pre-1955 printing, and this file says so
  rather than letting one witness stand for a whole state of the rite. The
  conclusion the row draws is untouched, because one hour after noon is still
  not the night the reform moved the Vigil to; the reasoning is narrowed, and the
  narrowing is recorded because the next reader would otherwise inherit the
  stronger claim.
- >-
  LOCI IN THIS FILE ARE PINNED TO BYTES, BECAUSE INTERNET ARCHIVE DERIVATIVES ARE
  REGENERATED. `src/sources/inventories/roman-holy-week-acts-v1.toml` records the
  1920 witness as `MissaleRomanum1920_djvu.txt, 123278 lines, 2918085 bytes`. The
  copy fetched on 2026-08-01 from the same item is 119621 lines and 2932349
  bytes, so every line number pinned against the older derivative resolves
  somewhere else in the newer one, or nowhere. Nothing has been changed in that
  inventory here; the divergence is recorded so that a reader who follows one of
  its loci and lands on the wrong page knows why. Every locus THIS file states
  carries the sha256 of the bytes it was read from.

  FOUR OF THIS FILE'S OWN 1920 LOCI WERE CHECKED AGAINST THE NEW BYTES AND ALL
  FOUR PASSAGES ARE THERE, at drifts of +96, -67, -204 and -461 lines
  [src/sources/inventories/pre-1955-rubrics-sources-v1.toml, `derivative_hazard`].
  The drift changes sign and grows through the book, so no constant converts the
  old addresses and none should be computed. The bases below are sound and their
  addresses are stale, which is a smaller problem than it looks and a different
  one from the problem it looks like.
- The four rows below name their liturgies as the pre-1955 books head them.
  Whether `key` should also move — `easter-vigil` is a 1962 name for a service
  the pre-1955 book prints as Sabbato Sancto — is left alone deliberately, because
  the key is the join to the base, and renaming it would break the only thing
  holding the two states together. The printed name moves; the key does not.

citation_divergences:
- book: Acts
  chapters:
  - 7
  divergence: the Vulgate joins the two verses of Stephen's vision into one, its 7:55 carrying
    both the sight of the glory of God and the Ecce video caelos apertos that the Greek numbers
    7:56, so its chapter 7 ends at 59 where the Greek ends at 60 and everything from the Greek's
    7:56 stands one verse lower, its 7:59 also carrying the Greek's 8:1a. This day's four
    Acts citations do not all speak one system. The Lesson, printed 7, 54-59, is the Vulgate's
    - it ends at obdormivit in Domino, which the Vulgate numbers 7:59 and the Greek 7:60 -
    and it resolves to itself. The Alleluia, Offertory and Communion carry the Greek's numbers
    against chants whose words the Vulgate prints elsewhere. Video caelos apertos is the Vulgate's
    7:55, not its 7:56, which is the crowd stopping its ears. Accipe spiritum meum is the
    Vulgate's 7:58, not its 7:59, which is ne statuas illis hoc peccatum. And 7:60 is past
    the end of the Vulgate's chapter altogether. The mass reaches this calendar through the
    projection from roman-1962, which is where the citations are written; this locus is carried
    here only because the projection does not carry the base's own
  numbering:
    hebrew: unrecorded
  citations:
    Acts 7:54-59: Acts 7:54-59
    Acts 7:56: Acts 7:55
    Acts 7:56,59-60: Acts 7:55, 58-59
    Acts 7:59: Acts 7:58
sections:
  seasonal:
    kind: seasonal
    masses:

    - key: palm-sunday
      name: Dominica in Palmis
      registry: 1962-T-palm-sunday
      season: holy-week
      ordinary_frame:
        applicability: unavailable
        basis: >-
          This row withholds the whole bundled Palm Sunday entry because its
          blessing and procession are known to be the reformed service, while
          the boundary around the following Mass has not been collated or
          represented. Applying the ordinary frame to this unavailable bundle
          would present the 1861 Ordinary as though the withheld pre-1955 bundle
          had been established. The structural difference and its pre-1955 loci are
          recorded at roman-holy-week-acts-v1.toml under
          `palmis.benedictio.*` and `palmis.distributio.*`.
      departure: replaced
      basis: >-
        The inherited entry includes the reformed blessing and procession of
        palms. The pre-1955 books instead print the fourteen-unit service
        recorded under `palmis.benedictio.*` and `palmis.distributio.*`, while
        eleven of those units are absent from the 1962 witness
        [roman-holy-week-acts-v1.toml]. The Mass formulary after the procession
        has not been collated separately. Because the base bundles the known-
        different service with that Mass, serving the base entry would present
        reformed Holy Week material under a pre-1955 heading; this row therefore
        withholds the whole bundled entry until the boundary can be represented.
      also:
      - departure: renamed
        basis: >-
          The 1962 book heads the day Dominica II Passionis seu in Palmis, and
          that title is the reform's own: Maxima Redemptionis fixes it in the
          sentence that says when the new Order begins, `Novus hic Ordo servari
          debet a die 25 Martii, dominica II Passionis seu in palmis, anni 1956`
          [roman-holy-week-acts-v1.toml, departure
          maxima-redemptionis-1955/renamed, act cited at aas-47-1955
          51853-51854]. The pre-1955 witnesses head it Dominica in Palmis [same
          file, mass dominica-in-palmis, attested by pustet-1862 28094 and
          missale-romanum-1920 31875-31877].
      - departure: reslotted
        basis: >-
          The Gospel of the entry into Jerusalem, Matthew 21, 1-9, is the same
          text in a different place in the service. The pre-1955 books read it
          BEFORE the blessing prayers [missale-romanum-1920 32017-32022,
          pustet-1862 28242-28247]; the 1962 book reads it AFTER the distribution
          of palms, under its own heading [roman-holy-week-acts-v1.toml, unit
          palmis.benedictio.evangelium]. Neither book is missing it, which is why
          this is `reslotted` and not `absent` — the case the vocabulary was
          extended to name.
      text_status:
        state: unavailable
        scope: missal-formulary
        reasons:
        - kind: witness-gap
          source_id: artifact.catholic-church.missale-romanum.vatican-typica-1920.missale-romanum-1920-text-aa646196

    - key: blessing-of-palms
      name: Benedictio Palmarum
      registry: pre-1955-T-blessing-of-palms
      season: holy-week
      ordinary_frame:
        applicability: none
        basis: >-
          This is the blessing and distribution of palms which precedes the
          Mass, not a Mass formulary to be seated in the Ordo Missae. Its
          fourteen units, including its own Preface and Sanctus, are recorded
          from the 1920 and 1862 witnesses at roman-holy-week-acts-v1.toml under
          `palmis.benedictio.*` and `palmis.distributio.*`.
      departure: added
      basis: >-
        The pre-1955 blessing of palms is a service of fourteen units the 1962
        book does not print, and it is `added` rather than a difference within
        Palm Sunday because the base holds no entry for it at all. Eleven of the
        fourteen are recorded `absent` at the 1955 station with a per-unit basis
        [roman-holy-week-acts-v1.toml, units palmis.benedictio.* and
        palmis.distributio.*, each attested by pustet-1862 and
        missale-romanum-1920 with loci]. Among them are a Lectio from Exodus, a
        Graduale, a full Preface and Sanctus, and six orations; the 1962 blessing
        runs from the antiphon straight to a single blessing prayer.
      text_status:
        state: unavailable
        scope: missal-formulary
        reasons:
        - kind: witness-gap
          source_id: artifact.catholic-church.missale-romanum.vatican-typica-1920.missale-romanum-1920-text-aa646196

    - key: chrism-mass
      name: Missa Chrismatis
      registry: 1962-T-chrism-mass
      season: holy-week
      departure: absent
      basis: >-
        SETTLED ON 2026-08-01 BY READING THE WITNESSES, having been carried as an
        open question because nothing in this repository established it. Both
        pre-1955 witnesses were fetched whole and read locally, and each prints
        EXACTLY ONE MASS ON HOLY THURSDAY.

        In the 1920 typical edition the day is headed `Feria V IN CCENA DOMINI`,
        `Statio ad S. Joannem in Laterano - duplex I classis`, and the span from
        that heading to the heading `FERIA VI IN PARASCEVE` contains ONE
        `Introitus`, `Gal. 6, 14`, `Nos autem gloriari`
        [MissaleRomanum1920_djvu.txt 34612-35196, the single Introit at 34620,
        the next day's heading at 35197; sha256
        eaf3ba379d4d9c0227ce991ac34be66e5177ab52642a8e0376776be81fd0041a,
        119621 lines, 2932349 bytes, fetched 2026-08-01]. Immediately BEFORE the
        heading the book prints its own rubric `Triduo sequenti prohibentur omnes
        Missae privatae` [same file 34607-34608], which forbids the other Masses
        rather than merely omitting them.

        The 1942 Benziger editio IV iuxta typicam Vaticanam agrees exactly - one
        Introit, the same one, in the span from `FERIA QUINTA IN COENA DOMINI` to
        `FERIA SEXTA IN PARASCEVE` [artifact
        artifact.catholic-church.missale-romanum.unidentified-pre-1955-witness-ia-1947.ia-djvu-ocr-724a04fa,
        32721-33444, the single Introit at 32730; the fetched bytes hash to the
        sha256 that artifact record already carries, so this reading is against
        the exact object the source library registers].

        Neither witness prints the string `Chrismatis` anywhere in Holy Week. The
        eight occurrences of it in the 1920 witness and the eight in the 1942 one
        are the infusion of chrism into the font at the Easter Vigil and the
        appended rites of baptism and confirmation, and none is a Mass.

        WHAT THIS DOES NOT SAY. It is a statement about THE MISSAL and about
        nothing else. In the pre-1955 rite the oils are blessed by a bishop
        within the one Mass of the Lord's Supper, by a rite the Pontificale
        Romanum carries and the Missal does not; neither witness prints a word
        about the oils on this day. This repository holds no pre-1955 Pontificale
        read for that rite, so the recension says the Missal prints no Chrism Mass
        and says NOTHING about the blessing of the oils.

        WHY OCR IS ADMISSIBLE HERE AND NOT FOR WORDING. This file transcribes no
        text and this row states none. The claim is that a heading and an Introit
        occur once in a span of some six hundred lines, which is a structural
        fact that survives character-level OCR error; the 38-in-99 correction rate
        this file's `verification` records is a rate of WORD errors, and a second
        Mass formulary cannot be spelt away.
      text_status:
        state: unavailable
        scope: missal-formulary
        reasons:
        - kind: witness-gap
          source_id: artifact.catholic-church.missale-romanum.vatican-typica-1920.missale-romanum-1920-text-aa646196

    - key: mass-of-the-lords-supper
      name: Feria V in Coena Domini
      registry: 1962-T-mass-of-the-lords-supper
      season: holy-week
      departure: moved
      basis: >-
        Maxima Redemptionis moved the Mass of the Lord's Supper to the evening;
        section 7 of the decree carries the provision [aas-47-1955 51905-51908,
        recorded at roman-holy-week-acts-v1.toml, departure
        maxima-redemptionis-1955/moved, mass feria-v-in-coena-domini]. The hour
        the pre-1955 books appoint is NOT ESTABLISHED: the act history's own mass
        row records `hour = "not established"` for this liturgy, where it fixes an
        hour for the other three. It is recorded moved because the decree says it
        moved, and the origin is left unstated rather than inferred from the
        general rubric on the hours of Mass.
