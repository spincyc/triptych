    - key: good-friday
      name: Feria VI in Parasceve
      registry: 1962-T-good-friday
      season: triduum
      ordinary_frame:
        applicability: none
        basis: >-
          Feria VI in Parasceve is the exceptional Good Friday service, not a
          Mass formulary to be seated in the Ordinary transcribed from the 1861
          lay missal. Its pre-1955 identity and hour were read at
          missale-romanum-1920 35401-35408 and pustet-1862 31916, and its known
          unit-level differences are recorded at roman-holy-week-acts-v1.toml
          under `parasceve.*`.
      departure: replaced
      basis: >-
        The solemn prayer for the Jews differs in its invitatory, rubric and
        oration between the pre-1955 witnesses and the inherited 1962 entry
        [roman-holy-week-acts-v1.toml, units
        parasceve.orationes.pro-iudaeis-*]. The correspondence of the complete
        service has not been established. Serving the inherited formulary would
        therefore present known-different words under the pre-1955 heading, so
        this row serves no formulary wording.
      also:
      - departure: moved
        basis: >-
          The pre-1955 books celebrate the liturgy of Good Friday in the
          morning, in choir after None [roman-holy-week-acts-v1.toml, mass
          feria-vi-in-parasceve, attested by pustet-1862 31916 and
          missale-romanum-1920 35401-35403 with the hour at 35408]. Maxima
          Redemptionis moved it to the afternoon in terms: `Feria VI in
          Passione et Morte Domini solemnis actio liturgica celebratur horis
          postmeridianis` [aas-47-1955 51910-51911].
      - departure: renamed
        basis: >-
          The same sentence renames the day. The pre-1955 heading is Feria VI in
          Parasceve; the reformed books head it Feria VI in Passione et Morte
          Domini and print that title in their running heads
          [roman-holy-week-acts-v1.toml, departure maxima-redemptionis-1955/renamed].
      - departure: unrecorded
        basis: >-
          The solemn prayer for the Jews differs between the witnesses in its
          invitatory, its rubric and its oration, and NO ACT FOR THE CHANGE WAS
          FOUND. The act history records all three as `unrecorded` and refuses to
          attach them to the 1962 edition merely because that is the first witness
          in which the words are gone [roman-holy-week-acts-v1.toml, departures
          editio-typica-1962/unrecorded, units parasceve.orationes.pro-iudaeis-*].
          It is carried here rather than dropped so that a page serving pre-1955
          Good Friday cannot claim the base's text was checked for these units.
      text_status:
        state: unavailable
        scope: missal-formulary
        reasons:
        - kind: witness-gap
          source_id: artifact.catholic-church.missale-romanum.vatican-typica-1920.missale-romanum-1920-text-aa646196

    - key: easter-vigil
      name: 'Sabbato Sancto'
      registry: 1962-T-easter-vigil
      season: triduum
      ordinary_frame:
        applicability: unavailable
        basis: >-
          The pre-1955 Holy Saturday bundle has twelve prophecies, a Mass with
          no Postcommunion, and Vespers where the reformed entry has another
          structure. None of that pre-1955 wording is transcribed here, and the
          service has not been separated into a frame that can safely borrow the
          1861 Ordinary. The established structure and witness loci are recorded
          at roman-holy-week-acts-v1.toml under `sabbato.prophetiae.01` through
          `.12`, `sabbato.missa.*`, and `sabbato.vesperae.*`.
      departure: replaced
      basis: >-
        The pre-1955 books print twelve prophecies where the reformed book
        prints four lessons, suppress a Postcommunion, and follow the Mass with
        Vespers rather than Lauds [roman-holy-week-acts-v1.toml, units
        sabbato.prophetiae.01 through .12, sabbato.missa.* and
        sabbato.vesperae.*]. Those are known structural and textual differences,
        while no pre-1955 wording has been verified for service here. The
        inherited reformed Vigil is therefore replaced by a typed unavailable
        formulary state.
      also:
      - departure: moved
        basis: >-
          The largest single departure in this file. The pre-1955 service is
          held on Saturday MORNING: it begins `Dicta Nona in Choro`, and the
          general rubric De hora celebrandi Missam allows Mass only `ab aurora
          usque ad meridiem` [missale-romanum-1920 37276 and 9614-9615,
          pustet-1862 33479 and 8151-8152; recorded at
          roman-holy-week-acts-v1.toml, mass sabbato-sancto, with the reasoning
          for the hour set out in `hour_basis` because no rubric in either
          witness fixes an hour in words]. Section 9 of Maxima Redemptionis
          moved it to the night, and the act history calls the evidence for
          this its strongest single piece: the decree's sentence at
          aas-47-1955 51915-51921 is reproduced WORD FOR WORD in the 1962
          witness at benziger-iuxta-typicam-1962 40203-40212.
      - departure: renamed
        basis: >-
          The day keeps its name and the liturgy within it is renamed: the decree
          speaks of the `solemnis paschalis vigilia` [aas-47-1955 51915] and the
          reformed book prints SABBATO SANCTO with DE VIGILIA PASCHALI beneath it
          [benziger-iuxta-typicam-1962 40187, 40195].
      - departure: reslotted
        basis: >-
          The case this repository's recension model was built to carry, and the
          one that generated false absences before it existed. The pre-1955 Mass
          of Holy Saturday HAS NO POSTCOMMUNION — its own rubric suppresses one —
          and the office that follows is VESPERS, whose Oratio is the prayer
          Spiritum nobis. The reformed book suppresses no Postcommunion and prints
          one, and the office that follows is LAUDS of the Resurrection, with
          Benedictus for Magnificat and the antiphon Valde mane for Vespere autem
          sabbati [roman-holy-week-acts-v1.toml, units
          sabbato.missa.rubrica-nec-postcommunio and sabbato.vesperae.*]. A matcher
          keyed on (mass, proper-name) asked the pre-1955 book for a slot the
          reform created, got nothing, and wrote down an absence; the words were
          on the page the whole time, in another slot.
      text_status:
        state: unavailable
        scope: missal-formulary
        reasons:
        - kind: witness-gap
          source_id: artifact.catholic-church.missale-romanum.vatican-typica-1920.missale-romanum-1920-text-aa646196
