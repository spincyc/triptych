          Deus, qui hodierna die, per Unigenitum tuum, aeternitatis nobis aditum,
          devicta morte, reserasti, da nobis, quaesumus, ut, qui resurrectionis
          dominicae sollemnia colimus, per innovationem tui Spiritus in lumine
          vitae resurgamus. Per Dominum.
      - name: First Reading
        source: scripture
