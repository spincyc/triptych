          ranges:
          - begin: {chapter: 118, verse: 1}
            end: {chapter: 118, verse: 2}
          - begin: {chapter: 118, verse: 16}
            end: {chapter: 118, verse: 17}
          - begin: {chapter: 118, verse: 22}
            end: {chapter: 118, verse: 23}
          ref: Psalm 118:1-2, 16-17, 22-23
      - name: Second Reading
        source: scripture
        verses:
        - book: Colossians
          ranges:
          - begin: {chapter: 3, verse: 1}
            end: {chapter: 3, verse: 4}
          ref: Colossians 3:1-4
        notes: The Lectionary appoints 1 Corinthians 5:6b-8 as an alternative second reading.
      - name: Sequence
        incipit: Victimae paschali laudes
        source: composed
        text: |
          Victimae paschali laudes immolent Christiani. Agnus redemit oves:
          Christus innocens Patri reconciliavit peccatores. Mors et vita duello
          conflixere mirando: dux vitae mortuus regnat vivus. Dic nobis, Maria,
          quid vidisti in via? Sepulcrum Christi viventis, et gloriam vidi
          resurgentis: angelicos testes, sudarium et vestes. Surrexit Christus
          spes mea: praecedet suos in Galilaeam. Scimus Christum surrexisse a
          mortuis vere: tu nobis, victor Rex, miserere.
      - name: Gospel Acclamation
        incipit: Pascha nostrum immolatus est Christus
        source: scripture
        verses:
        - book: 1 Corinthians
          ranges:
          - begin: {chapter: 5, verse: 7, part: b}
            end: {chapter: 5, verse: 8, part: a}
          ref: 1 Corinthians 5:7b-8a
      - name: Gospel
        source: scripture
        verses:
        - book: John
          ranges:
          - begin: {chapter: 20, verse: 1}
            end: {chapter: 20, verse: 9}
          ref: John 20:1-9
        notes: At an evening Mass on this day Luke 24:13-35 may be read instead.
      - name: Prayer over the Offerings
        incipit: Sacrificia, Domine, paschalibus gaudiis
        source: composed
        text: |
          Sacrificia, Domine, paschalibus gaudiis exsultantes offerimus, quibus
          Ecclesia tua mirabiliter renascitur et nutritur. Per Christum.
      - name: Communion Antiphon
        incipit: Pascha nostrum immolatus est Christus
        source: scripture
        verses:
        - book: 1 Corinthians
          ranges:
          - begin: {chapter: 5, verse: 7}
            end: {chapter: 5, verse: 8}
          ref: 1 Corinthians 5:7-8
      - name: Prayer after Communion
        incipit: Perpetuo, Deus, Ecclesiam tuam
        source: composed
        text: |
          Perpetuo, Deus, Ecclesiam tuam pio favore tuere, ut, paschalibus
          renovata mysteriis, ad resurrectionis perveniat claritatem. Per
          Christum.
