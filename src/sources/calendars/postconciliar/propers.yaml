      - name: Prayer after the First Reading
        incipit: Omnipotens sempiterne Deus, qui es in omnium operum tuorum
        source: composed
        text: |
          Omnipotens sempiterne Deus,
          qui es in omnium operum tuorum dispensatione mirabilis,
          intellegant redempti tui, non fuisse excellentius,
          quod initio factus est mundus,
          quam quod in fine saeculorum
          Pascha nostrum immolatus est Christus.
          Qui vivit et regnat in saecula saeculorum.
      - name: Prayer after the First Reading (alternative)
        incipit: Deus, qui mirabiliter creasti hominem
        source: composed
        notes: Alternative prayer, De creatione hominis.
        text: |
          Deus, qui mirabiliter creasti hominem
          et mirabilius redemisti,
          da nobis, quaesumus,
          contra oblectamenta peccati mentis ratione persistere,
          ut mereamur ad aeterna gaudia pervenire.
          Per Christum Dominum nostrum.
