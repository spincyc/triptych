          source: composed
          text: |
            Omnipotens sempiterne Deus, qui paschale sacramentum quinquaginta
            dierum voluisti mysterio contineri, praesta, ut, gentium facta
            dispersione, divisiones linguarum ad unam confessionem tui nominis
