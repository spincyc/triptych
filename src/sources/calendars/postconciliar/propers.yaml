      - name: Prayer after the Seventh Reading
        incipit: Deus, incommutabilis virtus et lumen aeternum
        source: composed
        text: |
          Deus, incommutabilis virtus et lumen aeternum,
          respice propitius ad totius Ecclesiae sacramentum,
          et opus salutis humanae
          perpetuae dispositionis effectu
          tranquillius operare;
          totusque mundus experiatur et videat
          deiecta erigi, inveterata renovari
          et per ipsum Christum redire omnia in integrum,
          a quo sumpsere principium.
          Qui vivit et regnat in saecula saeculorum.
      - name: Prayer after the Seventh Reading (alternative)
        incipit: Deus, qui nos ad celebrandum paschale sacramentum
        source: composed
        notes: Either of the two prayers may be used.
        text: |
          Deus, qui nos ad celebrandum paschale sacramentum
          utriusque Testamenti paginis instruis,
          da nobis intellegere misericordiam tuam,
          ut ex perceptione praesentium munerum
          firma sit exspectatio futurorum.
          Per Christum Dominum nostrum.
      - name: Collect
