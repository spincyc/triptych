              ranges:
              - begin: {chapter: 9, verse: 1}
                end: {chapter: 9, verse: 41}
              ref: John 9:1-41
          B:
            verses:
            - book: John
              ranges:
              - begin: {chapter: 3, verse: 14}
                end: {chapter: 3, verse: 21}
              ref: John 3:14-21
          C:
            verses:
            - book: Luke
              ranges:
              - begin: {chapter: 15, verse: 1}
                end: {chapter: 15, verse: 3}
              - begin: {chapter: 15, verse: 11}
                end: {chapter: 15, verse: 32}
              ref: Luke 15:1-3, 11-32
        notes: 'Short form in Year A: John 9:1, 6-9, 13-17, 34-38; the Year A readings may be
          used in Years B and C, especially where the Scrutinies are celebrated.'
      - name: Prayer over the Offerings
        incipit: Remedii sempiterni munera
        source: composed
        text: |
          Remedii sempiterni munera, Domine, laetantes offerimus, suppliciter
          exorantes, ut eadem nos et fideliter venerari, et pro salute mundi
          congruenter exhibere perficias. Per Christum.
      - name: Communion Antiphon
        incipit: Dominus linivit oculos meos
        source: scripture
        verses:
        - book: John
          ranges:
          - begin: {chapter: 9, verse: 11}
            end: {chapter: 9, verse: 11}
          - begin: {chapter: 9, verse: 38}
            end: {chapter: 9, verse: 38}
          ref: John 9:11, 38
        notes: Used when the Gospel of the man born blind is read.
      - name: Communion Antiphon
        incipit: Oportet te, fili, gaudere
        source: scripture
        verses:
        - book: Luke
          ranges:
          - begin: {chapter: 15, verse: 32}
            end: {chapter: 15, verse: 32}
          ref: Luke 15:32
        notes: Used when the Gospel of the prodigal son is read.
      - name: Communion Antiphon
        incipit: Ierusalem, quae aedificatur ut civitas
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 122, verse: 3}
            end: {chapter: 122, verse: 4}
          ref: Psalm 122:3-4
        notes: Used when another Gospel is read.
      - name: Prayer after Communion
        incipit: Deus, qui illuminas omnem hominem
        source: composed
        text: |
          Deus, qui illuminas omnem hominem venientem in hunc mundum, illumina,
          quaesumus, corda nostra gratiae tuae splendore, ut digna ac placita
          maiestati tuae cogitare semper, et te sincere diligere valeamus. Per
          Christum.
      - name: Prayer over the People
        incipit: Tuere, Domine, supplices tuos
        source: composed
        text: |
          Tuere, Domine, supplices tuos, sustenta fragiles, et inter tenebras
          mortalium ambulantes tua semper luce vivifica, atque a malis omnibus
          clementer ereptos, ad summa bona pervenire concede. Per Christum.
        notes: Given for this day and used at the Priest's discretion.
    - key: lent-5
