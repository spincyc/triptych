      - name: Responsorial Psalm
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 67, verse: 2}
            end: {chapter: 67, verse: 3}
          - begin: {chapter: 67, verse: 5}
            end: {chapter: 67, verse: 5}
          - begin: {chapter: 67, verse: 6}
            end: {chapter: 67, verse: 6}
          - begin: {chapter: 67, verse: 8}
            end: {chapter: 67, verse: 8}
          ref: Psalm 67:2-3, 5, 6, 8
      - name: Second Reading
        source: scripture
        verses:
