          vivit et regnat in saecula saeculorum.
    - key: nativity
      name: The Nativity of the Lord
      registry: pc-s05
      season: christmas
      forms:
      - name: Vigil Mass
        propers:
        - name: Entrance Antiphon
          incipit: Hodie scietis
          source: mixed
          verses:
          - book: Exodus
            ranges:
            - begin: {chapter: 16, verse: 6}
              end: {chapter: 16, verse: 7}
            ref: Exodus 16:6-7
          text: |
            Hodie scietis, quia veniet Dominus, et salvabit nos, et mane
            videbitis gloriam eius.
        - name: Collect
          incipit: Deus, qui nos redemptionis
          source: composed
          text: |
            Deus, qui nos redemptionis nostrae annua exspectatione laetificas,
            praesta, ut Unigenitum tuum, quem laeti suscipimus Redemptorem,
            venientem quoque Iudicem securi videre mereamur Dominum nostrum,
            Iesum Christum. Qui tecum.
        - name: First Reading
          source: scripture
          verses:
          - book: Isaiah
            ranges:
            - begin: {chapter: 62, verse: 1}
              end: {chapter: 62, verse: 5}
            ref: Isaiah 62:1-5
        - name: Responsorial Psalm
          source: scripture
          verses:
          - book: Psalms
            ranges:
            - begin: {chapter: 89, verse: 4}
              end: {chapter: 89, verse: 5}
            - begin: {chapter: 89, verse: 16}
              end: {chapter: 89, verse: 17}
            - begin: {chapter: 89, verse: 27}
              end: {chapter: 89, verse: 27}
            - begin: {chapter: 89, verse: 29}
              end: {chapter: 89, verse: 29}
            ref: Psalm 89:4-5, 16-17, 27, 29
        - name: Second Reading
          source: scripture
          verses:
          - book: Acts
            ranges:
            - begin: {chapter: 13, verse: 16}
              end: {chapter: 13, verse: 17}
            - begin: {chapter: 13, verse: 22}
              end: {chapter: 13, verse: 25}
            ref: Acts 13:16-17, 22-25
        - name: Gospel Acclamation
          incipit: Crastina die delebitur
          source: composed
          text: |
            Crastina die delebitur iniquitas terrae, et regnabit super nos
            Salvator mundi.
        - name: Gospel
          source: scripture
          verses:
          - book: Matthew
            ranges:
            - begin: {chapter: 1, verse: 1}
              end: {chapter: 1, verse: 25}
            ref: Matthew 1:1-25
          notes: 'Short form: Matthew 1:18-25.'
        - name: Prayer over the Offerings
          incipit: Tanto nos, Domine
          source: composed
          text: |
            Tanto nos, Domine, quaesumus, promptiore servitio haec praecurrere
            concede sollemnia, quanto in his constare principium nostrae
            redemptionis ostendis. Per Christum.
        - name: Communion Antiphon
          incipit: Revelabitur gloria Domini
          source: mixed
          verses:
          - book: Isaiah
            ranges:
            - begin: {chapter: 40, verse: 5}
              end: {chapter: 40, verse: 5}
            ref: Isaiah 40:5
          text: |
            Revelabitur gloria Domini, et videbit omnis caro salutare Dei
            nostri.
        - name: Prayer after Communion
          incipit: Da nobis, quaesumus, Domine
          source: composed
          text: |
            Da nobis, quaesumus, Domine, Unigeniti Filii tui recensita
            nativitate vegetari, cuius caelesti mysterio pascimur et potamur.
            Qui vivit et regnat in saecula saeculorum.
      - name: Mass during the Night
        propers:
        - name: Entrance Antiphon
          incipit: Dominus dixit ad me
          source: scripture
          verses:
          - book: Psalms
            ranges:
            - begin: {chapter: 2, verse: 7}
              end: {chapter: 2, verse: 7}
            ref: Psalm 2:7
        - name: Entrance Antiphon (alternative)
          incipit: Gaudeamus omnes in Domino
          source: composed
          text: |
            Gaudeamus omnes in Domino, quia Salvator noster natus est in mundo.
            Hodie nobis de caelo pax vera descendit.
          notes: The Missal appoints this antiphon as an alternative (Vel) to the entrance antiphon.
        - name: Collect
          incipit: Deus, qui hanc sacratissimam noctem
          source: composed
          text: |
            Deus, qui hanc sacratissimam noctem veri luminis fecisti
            illustratione clarescere, da, quaesumus, ut, cuius in terra mysteria
            lucis agnovimus, eius quoque gaudiis perfruamur in caelo. Qui
            tecum.
        - name: First Reading
          source: scripture
          verses:
          - book: Isaiah
            ranges:
            - begin: {chapter: 9, verse: 1}
              end: {chapter: 9, verse: 6}
            ref: Isaiah 9:1-6
        - name: Responsorial Psalm
          source: scripture
          verses:
          - book: Psalms
            ranges:
            - begin: {chapter: 96, verse: 1}
              end: {chapter: 96, verse: 2, part: a}
            - begin: {chapter: 96, verse: 2, part: b}
              end: {chapter: 96, verse: 3}
            - begin: {chapter: 96, verse: 11}
              end: {chapter: 96, verse: 12}
            - begin: {chapter: 96, verse: 13}
              end: {chapter: 96, verse: 13}
            ref: Psalm 96:1-2a, 2b-3, 11-12, 13
        - name: Second Reading
          source: scripture
          verses:
          - book: Titus
            ranges:
            - begin: {chapter: 2, verse: 11}
              end: {chapter: 2, verse: 14}
            ref: Titus 2:11-14
        - name: Gospel Acclamation
          source: scripture
          verses:
          - book: Luke
            ranges:
            - begin: {chapter: 2, verse: 10}
              end: {chapter: 2, verse: 11}
            ref: Luke 2:10-11
        - name: Gospel
          source: scripture
          verses:
          - book: Luke
            ranges:
            - begin: {chapter: 2, verse: 1}
              end: {chapter: 2, verse: 14}
            ref: Luke 2:1-14
        - name: Prayer over the Offerings
          incipit: Grata tibi sit, Domine
          source: composed
          text: |
            Grata tibi sit, Domine, quaesumus, hodiernae festivitatis oblatio,
            ut, per haec sacrosancta commercia, in illius inveniamur forma, in
            quo tecum est nostra substantia. Qui vivit et regnat in saecula
            saeculorum.
        - name: Communion Antiphon
          incipit: Verbum caro factum est
          source: scripture
          verses:
          - book: John
            ranges:
            - begin: {chapter: 1, verse: 14}
              end: {chapter: 1, verse: 14}
            ref: John 1:14
        - name: Prayer after Communion
          incipit: Da nobis, quaesumus, Domine Deus noster
          source: composed
          text: |
            Da nobis, quaesumus, Domine Deus noster, ut, qui nativitatem
            Redemptoris nostri frequentare gaudemus, dignis conversationibus ad
            eius mereamur pervenire consortium. Qui vivit et regnat in saecula
            saeculorum.
      - name: Mass at Dawn
        propers:
        - name: Entrance Antiphon
          incipit: Lux fulgebit hodie super nos
          source: mixed
          verses:
          - book: Isaiah
            ranges:
            - begin: {chapter: 9, verse: 1}
              end: {chapter: 9, verse: 1}
            ref: Isaiah 9:1
          - book: Isaiah
            ranges:
            - begin: {chapter: 9, verse: 5}
              end: {chapter: 9, verse: 5}
            ref: Isaiah 9:5
          - book: Luke
            ranges:
            - begin: {chapter: 1, verse: 33}
              end: {chapter: 1, verse: 33}
            ref: Luke 1:33
          text: |
            Lux fulgebit hodie super nos, quia natus est nobis Dominus; et
            vocabitur admirabilis, Deus, Princeps pacis, Pater futuri saeculi:
            cuius regni non erit finis.
        - name: Collect
          incipit: Da, quaesumus, omnipotens Deus
          source: composed
          text: |
            Da, quaesumus, omnipotens Deus, ut dum nova incarnati Verbi tui luce
            perfundimur, hoc in nostro resplendeat opere, quod per fidem fulget
            in mente. Per Dominum.
        - name: First Reading
          source: scripture
          verses:
          - book: Isaiah
            ranges:
            - begin: {chapter: 62, verse: 11}
              end: {chapter: 62, verse: 12}
            ref: Isaiah 62:11-12
        - name: Responsorial Psalm
          source: scripture
          verses:
          - book: Psalms
            ranges:
            - begin: {chapter: 97, verse: 1}
              end: {chapter: 97, verse: 1}
            - begin: {chapter: 97, verse: 6}
              end: {chapter: 97, verse: 6}
            - begin: {chapter: 97, verse: 11}
              end: {chapter: 97, verse: 12}
            ref: Psalm 97:1, 6, 11-12
        - name: Second Reading
          source: scripture
          verses:
          - book: Titus
            ranges:
            - begin: {chapter: 3, verse: 4}
              end: {chapter: 3, verse: 7}
            ref: Titus 3:4-7
        - name: Gospel Acclamation
          source: scripture
          verses:
          - book: Luke
            ranges:
            - begin: {chapter: 2, verse: 14}
              end: {chapter: 2, verse: 14}
            ref: Luke 2:14
        - name: Gospel
          source: scripture
          verses:
          - book: Luke
            ranges:
            - begin: {chapter: 2, verse: 15}
              end: {chapter: 2, verse: 20}
            ref: Luke 2:15-20
        - name: Prayer over the Offerings
          incipit: Munera nostra, quaesumus, Domine
          source: composed
          text: |
            Munera nostra, quaesumus, Domine, nativitatis hodiernae mysteriis
            apta proveniant, ut sicut homo genitus idem praefulsit et Deus, sic
            nobis haec terrena substantia conferat quod divinum est. Per
            Christum.
        - name: Communion Antiphon
          incipit: Exsulta, filia Sion
          source: mixed
          verses:
          - book: Zechariah
            ranges:
            - begin: {chapter: 9, verse: 9}
              end: {chapter: 9, verse: 9}
            ref: Zechariah 9:9
          text: |
            Exsulta, filia Sion, lauda, filia Ierusalem: ecce Rex tuus veniet
            sanctus et salvator mundi.
        - name: Prayer after Communion
          incipit: Da nobis, Domine, Filii tui nativitatem
          source: composed
          text: |
            Da nobis, Domine, Filii tui nativitatem laeta devotione colentibus,
            huius arcana mysterii et plena fide cognoscere, et pleniore
            caritatis ardore diligere. Per Christum.
      - name: Mass during the Day
        propers:
        - name: Entrance Antiphon
          incipit: Puer natus est nobis
          source: mixed
          verses:
          - book: Isaiah
            ranges:
            - begin: {chapter: 9, verse: 5}
              end: {chapter: 9, verse: 5}
            ref: Isaiah 9:5
          text: |
            Puer natus est nobis, et filius datus est nobis, cuius imperium
            super humerum eius, et vocabitur nomen eius magni consilii Angelus.
        - name: Collect
          incipit: Deus, qui humanae substantiae dignitatem
          source: composed
          text: |
            Deus, qui humanae substantiae dignitatem et mirabiliter condidisti,
            et mirabilius reformasti, da, quaesumus, nobis eius divinitatis esse
            consortes, qui humanitatis nostrae fieri dignatus est particeps. Qui
            tecum.
        - name: First Reading
          source: scripture
          verses:
          - book: Isaiah
            ranges:
            - begin: {chapter: 52, verse: 7}
              end: {chapter: 52, verse: 10}
            ref: Isaiah 52:7-10
        - name: Responsorial Psalm
          source: scripture
          verses:
          - book: Psalms
            ranges:
            - begin: {chapter: 98, verse: 1}
              end: {chapter: 98, verse: 1}
            - begin: {chapter: 98, verse: 2}
              end: {chapter: 98, verse: 3, part: a}
            - begin: {chapter: 98, verse: 3, part: b}
              end: {chapter: 98, verse: 4}
            - begin: {chapter: 98, verse: 5}
              end: {chapter: 98, verse: 6}
            ref: Psalm 98:1, 2-3a, 3b-4, 5-6
        - name: Second Reading
          source: scripture
          verses:
          - book: Hebrews
            ranges:
            - begin: {chapter: 1, verse: 1}
              end: {chapter: 1, verse: 6}
            ref: Hebrews 1:1-6
        - name: Gospel Acclamation
          incipit: Dies sanctificatus illuxit nobis
          source: composed
          text: |
            Dies sanctificatus illuxit nobis: venite, gentes, et adorate
            Dominum, quia hodie descendit lux magna super terram.
        - name: Gospel
          source: scripture
          verses:
          - book: John
            ranges:
            - begin: {chapter: 1, verse: 1}
              end: {chapter: 1, verse: 18}
            ref: John 1:1-18
          notes: 'Short form: John 1:1-5, 9-14.'
        - name: Prayer over the Offerings
          incipit: Oblatio tibi sit, Domine
          source: composed
          text: |
            Oblatio tibi sit, Domine, hodiernae sollemnitatis accepta, qua et
            nostrae reconciliationis processit perfecta placatio, et divini
            cultus nobis est indita plenitudo. Per Christum.
        - name: Communion Antiphon
          incipit: Viderunt omnes fines terrae
          source: mixed
          verses:
          - book: Psalms
            ranges:
            - begin: {chapter: 98, verse: 3}
              end: {chapter: 98, verse: 3}
            ref: Psalm 98:3
          text: |
            Viderunt omnes fines terrae salutare Dei nostri.
        - name: Prayer after Communion
          incipit: Praesta, misericors Deus
          source: composed
          text: |
            Praesta, misericors Deus, ut natus hodie Salvator mundi, sicut
            divinae nobis generationis est auctor, ita et immortalitatis sit
            ipse largitor. Qui vivit et regnat in saecula saeculorum.
    - key: holy-family
      name: The Holy Family of Jesus, Mary, and Joseph
      registry: pc-s06
      season: christmas
      propers:
      - name: Entrance Antiphon
