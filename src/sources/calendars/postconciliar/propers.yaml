        text: |
          Deus, qui primis temporibus
          impleta miracula novi testamenti luce reserasti,
          ut et Mare Rubrum forma sacri fontis exsisteret,
          et plebs a servitute liberata
          christiani populi sacramenta praeferret,
          da, ut omnes gentes,
          Israelis privilegium merito fidei consecutae,
