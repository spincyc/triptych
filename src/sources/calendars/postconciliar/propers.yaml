      - name: Prayer over the Offerings
        incipit: Exaudi nos, omnipotens Deus
        source: composed
        text: |
          Exaudi nos, omnipotens Deus, et famulos tuos, quos fidei christianae
          eruditionibus imbuisti, huius sacrificii tribuas operatione mundari.
          Per Christum.
      - name: Communion Antiphon
        incipit: Omnis qui vivit et credit in me
        source: scripture
        verses:
        - book: John
          ranges:
          - begin: {chapter: 11, verse: 26}
            end: {chapter: 11, verse: 26}
          ref: John 11:26
        notes: Used when the Gospel of Lazarus is read.
      - name: Communion Antiphon
        incipit: Nemo te condemnavit, mulier?
        source: scripture
        verses:
        - book: John
          ranges:
          - begin: {chapter: 8, verse: 10}
            end: {chapter: 8, verse: 11}
          ref: John 8:10-11
        notes: Used when the Gospel of the woman taken in adultery is read.
      - name: Communion Antiphon
        incipit: Amen, amen dico vobis
        source: scripture
        verses:
        - book: John
          ranges:
          - begin: {chapter: 12, verse: 24}
            end: {chapter: 12, verse: 25}
          ref: John 12:24-25
        notes: Used when another Gospel is read.
      - name: Prayer after Communion
        incipit: Quaesumus, omnipotens Deus
        source: composed
        text: |
          Quaesumus, omnipotens Deus, ut inter eius membra semper numeremur,
          cuius Corpori communicamus et Sanguini. Qui vivit et regnat in saecula
          saeculorum.
      - name: Prayer over the People
        incipit: Benedic, Domine, plebem tuam
        source: composed
        text: |
          Benedic, Domine, plebem tuam, quae munus tuae miserationis exspectat,
          et concede, ut, quod, te inspirante, desiderat, te largiente percipiat.
          Per Christum.
        notes: Given for this day and used at the Priest's discretion.
    - key: palm-sunday
      name: Palm Sunday of the Passion of the Lord
      registry: pc-s16
      season: holy-week
      propers:
      - name: Antiphon at the Commemoration of the Lord's Entrance
        incipit: Hosanna filio David
        source: scripture
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 21, verse: 9}
            end: {chapter: 21, verse: 9}
          ref: Matthew 21:9
      - name: Address before the Blessing of Branches
        incipit: Fratres carissimi, postquam iam ab initio Quadragesimae
        source: composed
        text: |
          Fratres carissimi, postquam iam ab initio Quadragesimae corda nostra
          paenitentia et operibus caritatis praeparavimus, hodierna die
          congregamur, ut cum tota Ecclesia praeludamus paschale Domini nostri
          mysterium, eius nempe passionem atque resurrectionem, ad quod
          implendum ipse ingressus est civitatem suam Ierusalem. Quare cum omni
          fide et devotione memoriam agentes huius salutiferi ingressus, sequamur
          Dominum, ut, per gratiam consortes effecti crucis, partem habeamus
          resurrectionis et vitae.
        notes: The Missal appoints this text or similar words.
      - name: Blessing of Branches
        incipit: Omnipotens sempiterne Deus, hos palmites
        source: composed
        text: |
          Omnipotens sempiterne Deus, hos palmites tua benedictione sanctifica,
          ut nos, qui Christum Regem exsultando prosequimur, per ipsum valeamus
          ad aeternam Ierusalem pervenire. Qui vivit et regnat in saecula
          saeculorum.
      - name: Blessing of Branches
        incipit: Auge fidem in te sperantium, Deus
        source: composed
        text: |
          Auge fidem in te sperantium, Deus, et supplicum preces clementer
          exaudi, ut, qui hodie Christo triumphanti palmites exhibemus, in ipso
          fructus tibi bonorum operum afferamus. Qui vivit et regnat in saecula
          saeculorum.
        notes: Appointed as the alternative form of the blessing of branches.
      - name: Gospel of the Lord's Entrance into Jerusalem
        source: scripture
        cycles:
          A:
            verses:
            - book: Matthew
              ranges:
              - begin: {chapter: 21, verse: 1}
                end: {chapter: 21, verse: 11}
              ref: Matthew 21:1-11
          B:
            verses:
            - book: Mark
              ranges:
              - begin: {chapter: 11, verse: 1}
                end: {chapter: 11, verse: 10}
              ref: Mark 11:1-10
          C:
            verses:
            - book: Luke
              ranges:
              - begin: {chapter: 19, verse: 28}
                end: {chapter: 19, verse: 40}
              ref: Luke 19:28-40
        notes: In Year B John 12:12-16 may be read instead.
      - name: Invitation to the Procession
        incipit: Imitemur, fratres carissimi, turbas acclamantes Iesum
        source: composed
        text: |
          Imitemur, fratres carissimi, turbas acclamantes Iesum, et procedamus
          in pace.
        notes: The Missal appoints this text or similar words.
      - name: Procession Antiphon 1
        incipit: Pueri Hebraeorum, portantes ramos olivarum
        source: composed
        text: |
          Pueri Hebraeorum, portantes ramos olivarum, obviaverunt Domino,
          clamantes et dicentes: Hosanna in excelsis.
        notes: Sung with Psalm 24, the antiphon repeated between the strophes.
      - name: Procession Antiphon 2
        incipit: Pueri Hebraeorum vestimenta prosternebant
        source: composed
        text: |
          Pueri Hebraeorum vestimenta prosternebant in via, et clamabant
          dicentes: Hosanna filio David; benedictus, qui venit in nomine Domini.
        notes: Sung with Psalm 47, the antiphon repeated between the strophes.
      - name: Hymn to Christ the King
        incipit: Gloria, laus et honor
        source: composed
        text: |
          Gloria, laus et honor tibi sit, rex Christe redemptor, cui puerile
          decus prompsit Hosanna pium. Israel es tu rex, Davidis et inclita
          proles, nomine qui in Domini, rex benedicte, venis. Coetus in excelsis
          te laudat caelicus omnis, et mortalis homo, et cuncta creata simul.
          Plebs Hebraea tibi cum palmis obvia venit; cum prece, voto, hymnis,
          adsumus ecce tibi. Hi tibi passuro solvebant munia laudis; nos tibi
          regnanti pangimus ecce melos. Hi placuere tibi, placeat devotio
          nostra: rex bone, rex clemens, cui bona cuncta placent.
      - name: Responsory at the Entrance into the Church
        incipit: Ingrediente Domino in sanctam civitatem
        source: composed
        text: |
          Ingrediente Domino in sanctam civitatem, Hebraeorum pueri,
          resurrectionem vitae pronuntiantes, cum ramis palmarum: Hosanna,
          clamabant, in excelsis. Cum audisset populus, quod Iesus veniret
          Hierosolymam, exierunt obviam ei. Cum ramis.
      - name: Entrance Antiphon
        incipit: Ante sex dies sollemnis Paschae
        source: mixed
        verses:
        - book: John
          ranges:
          - begin: {chapter: 12, verse: 1}
            end: {chapter: 12, verse: 1}
          - begin: {chapter: 12, verse: 12}
            end: {chapter: 12, verse: 13}
          ref: John 12:1, 12-13
        - book: Psalms
          ranges:
          - begin: {chapter: 24, verse: 9}
            end: {chapter: 24, verse: 10}
          ref: Psalm 24:9-10
        text: |
          Ante sex dies sollemnis Paschae, quando venit Dominus in civitatem
          Ierusalem, occurrerunt ei pueri: et in manibus portabant ramos
          palmarum et clamabant voce magna, dicentes: Hosanna in excelsis:
          Benedictus, qui venisti in multitudine misericordiae tuae. Attollite,
          portae, capita vestra, et elevamini, portae aeternales, et introibit
          rex gloriae. Quis est iste rex gloriae? Dominus virtutum ipse est rex
          gloriae.
        notes: Used at Masses celebrated with the Simple Entrance, the third form of the commemoration.
      - name: Collect
        incipit: Omnipotens sempiterne Deus, qui humano generi
        source: composed
        text: |
          Omnipotens sempiterne Deus, qui humano generi, ad imitandum
          humilitatis exemplum, Salvatorem nostrum carnem sumere, et crucem
          subire fecisti, concede propitius, ut et patientiae ipsius habere
          documenta et resurrectionis consortia mereamur. Qui tecum.
      - name: First Reading
        source: scripture
        verses:
        - book: Isaiah
          ranges:
          - begin: {chapter: 50, verse: 4}
            end: {chapter: 50, verse: 7}
          ref: Isaiah 50:4-7
      - name: Responsorial Psalm
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 22, verse: 8}
            end: {chapter: 22, verse: 9}
          - begin: {chapter: 22, verse: 17}
            end: {chapter: 22, verse: 18}
          - begin: {chapter: 22, verse: 19}
            end: {chapter: 22, verse: 20}
          - begin: {chapter: 22, verse: 23}
            end: {chapter: 22, verse: 24}
          ref: Psalm 22:8-9, 17-18, 19-20, 23-24
      - name: Second Reading
        source: scripture
        verses:
        - book: Philippians
          ranges:
          - begin: {chapter: 2, verse: 6}
            end: {chapter: 2, verse: 11}
          ref: Philippians 2:6-11
      - name: Gospel Acclamation
        source: scripture
        verses:
        - book: Philippians
          ranges:
          - begin: {chapter: 2, verse: 8}
            end: {chapter: 2, verse: 9}
          ref: Philippians 2:8-9
        notes: In Lent the Alleluia is replaced by one of the appointed acclamations, such as
          Laus tibi, Christe, rex aeternae gloriae.
      - name: Passion of the Lord
        source: scripture
        cycles:
          A:
            verses:
            - book: Matthew
              ranges:
              - begin: {chapter: 26, verse: 14}
                end: {chapter: 27, verse: 66}
              ref: Matthew 26:14-27:66
          B:
            verses:
            - book: Mark
              ranges:
              - begin: {chapter: 14, verse: 1}
                end: {chapter: 15, verse: 47}
              ref: Mark 14:1-15:47
          C:
            verses:
            - book: Luke
              ranges:
              - begin: {chapter: 22, verse: 14}
                end: {chapter: 23, verse: 56}
              ref: Luke 22:14-23:56
        notes: 'Short forms: Matthew 27:11-54, Mark 15:1-39, Luke 23:1-49.'
      - name: Prayer over the Offerings
        incipit: Per Unigeniti tui passionem
        source: composed
        text: |
          Per Unigeniti tui passionem placatio tua nobis, Domine, sit propinqua,
          quam, etsi nostris operibus non meremur, interveniente sacrificio
          singulari, tua percipiamus miseratione praeventi. Per Christum.
      - name: Communion Antiphon
        incipit: Pater, si non potest hic calix transire
        source: scripture
        verses:
        - book: Matthew
          ranges:
          - begin: {chapter: 26, verse: 42}
            end: {chapter: 26, verse: 42}
          ref: Matthew 26:42
      - name: Prayer after Communion
        incipit: Sacro munere satiati
        source: composed
        text: |
          Sacro munere satiati, supplices te, Domine, deprecamur, ut, qui
          fecisti nos morte Filii tui sperare quod credimus, facias nos, eodem
          resurgente, pervenire quo tendimus. Per Christum.
      - name: Prayer over the People
        incipit: Respice, quaesumus, Domine
        source: composed
        text: |
          Respice, quaesumus, Domine, super hanc familiam tuam, pro qua Dominus
          noster Iesus Christus non dubitavit manibus tradi nocentium, et crucis
          subire tormentum. Qui vivit et regnat in saecula saeculorum.
        notes: Given for this day and used at the Priest's discretion.
    - key: mass-of-the-lords-supper
      name: Evening Mass of the Lord's Supper
      registry: pc-t01
      season: triduum
      propers:
      - name: Entrance Antiphon
        incipit: Nos autem gloriari oportet
        source: mixed
        verses:
        - book: Galatians
          ranges:
