            year.
        - name: Prayer over the Offerings
          incipit: Praesta, quaesumus, Domine, ut, secundum promissionem
          source: composed
          text: |
            Praesta, quaesumus, Domine, ut, secundum promissionem Filii tui,
            Spiritus Sanctus huius nobis sacrificii copiosius revelet arcanum,
            et omnem propitius reseret veritatem. Per Christum.
        - name: Communion Antiphon
