            end: {chapter: 6, verse: 14}
          ref: Galatians 6:14
        text: |
          Nos autem gloriari oportet
          in cruce Domini nostri Iesu Christi,
          in quo est salus, vita et resurrectio nostra,
          per quem salvati et liberati sumus.
      - name: Collect
        incipit: Sacratissimam, Deus, frequentantibus Cenam
        source: composed
        text: |
          Sacratissimam, Deus, frequentantibus Cenam,
          in qua Unigenitus tuus, morti se traditurus,
          novum in saecula sacrificium
          dilectionisque suae convivium Ecclesiae commendavit,
          da nobis, quaesumus, ut ex tanto mysterio
          plenitudinem caritatis hauriamus et vitae.
          Per Dominum.
