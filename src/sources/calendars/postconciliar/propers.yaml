# Where the citations above do not address the text the tracked editions print.
# This calendar cites the Nova Vulgata; the Douay-Rheims, the Clementine Vulgate
# and every other bible in this library follow the Vulgate division, and in
# these books one reference names different verses in the two. The mismatch is
# not a miss but a hit on the wrong words, which is why it went unnoticed:
# Joel 3:1-5 returned the valley of Josaphat rather than the outpoured spirit,
# and Isaiah 9:5 the garments rolled in blood rather than the Child born to us.
#
# No witness of the Nova Vulgata is tracked here, so there is nothing to compile
# a concordance from and each affected citation is resolved by hand against the
# printed Douay text. `chapters` narrows a claim to the chapters whose verses
# are displaced, and is omitted where the two divide the book into a different
# number of chapters and the whole division is therefore in question. A citation
# reaching a divergent locus with no resolution recorded here is refused rather
# than resolved: it is left out of every index and reported, because a plausible
# wrong verse is worse than a missing one. See `tools/index-bible`, which
# validates these entries against the citations actually made before it indexes.
citation_divergences:
- book: Joel
  divergence: the Nova Vulgata divides Joel into four chapters where the Vulgate has
    three; Nova Vulgata 3 is Vulgate 2:28-32 and Nova Vulgata 4 is Vulgate 3
  citations:
    "Joel 2:12-13": "Joel 2:12-13"
    "Joel 3:1-5": "Joel 2:28-32"
- book: Malachi
  divergence: the Vulgate divides Malachi into four chapters where the Nova Vulgata
    has three; Nova Vulgata 3:19-24 is Vulgate 4:1-6
  citations:
    "Malachi 1:14b-2:2b, 8-10": "Malachi 1:14b-2:2b, 8-10"
    "Malachi 3:1": "Malachi 3:1"
    "Malachi 3:19-20a": "Malachi 4:1-2a"
- book: Isaiah
  chapters: [9, 64]
  divergence: the Vulgate opens chapter 9 one verse earlier than the Nova Vulgata
    and chapter 64 one verse later, so Nova Vulgata 8:23 is Vulgate 9:1, the rest
    of chapter 9 runs one verse ahead, Nova Vulgata 63:19b is Vulgate 64:1, and the
    rest of chapter 64 runs one verse behind
  citations:
    "Isaiah 8:23-9:3": "Isaiah 9:1-4"
    "Isaiah 9:1": "Isaiah 9:2"
    "Isaiah 9:1-6": "Isaiah 9:2-7"
    "Isaiah 9:5": "Isaiah 9:6"
    "Isaiah 63:16b-17, 19b; 64:2-7": "Isaiah 63:16b-17; 64:1, 3-8"
- book: Micah
  chapters: [5]
  divergence: the Vulgate opens chapter 5 one verse earlier than the Nova Vulgata,
    so Nova Vulgata 4:14 is Vulgate 5:1 and the rest of chapter 5 runs one verse
    ahead
  citations:
    "Micah 5:1-4a": "Micah 5:2-5a"
