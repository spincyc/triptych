schema: triptych-calendar-masses/v1
edition: Missale Romanum, editio typica tertia 2008, reimpressio emendata 2008
calendar: postconciliar
series: deterministic fixed-date feast masses
ordering: sections in christological, marian, saintly, seasonal order;
  dated masses in civil date order within their kind, seasonal masses in
  liturgical-year order
registry: guidance/liturgy/postconciliar-propers-registry.md (calendar-spine filtered
  by kind)
psalm_numbering: hebrew
citation_convention: Lectionary readings and antiphons preserve the numbering in the
  controlling missal
orthography: 2002 missal Latin (j for i, ae/oe digraphs, no accent marks)
verification: two tiers; the seasonal section carries unverified model-generated
  leads whose every citation and text requires collation against the controlling
  edition before any evidentiary reuse, and the marian, christological and saintly
  sections remain a placeholder skeleton pending formula migration
conventions:
- cycle-varying elements carry a cycles mapping keyed A, B, C
- celebrations with several Mass formularies use forms instead of propers
- the Missal's Vel alternatives are separate propers carrying a notes line, not
  cycle entries, except where the alternative is genuinely cycle-linked
- the invariant Ordinary is out of scope; prefaces are not recorded
open_collation_items:
- antiphon psalm numbering is not yet uniform, because some entries kept the Missal's
  printed Vulgate or Neo-Vulgate number while others were converted to Hebrew
  numbering; normalize to the printed cue at collation
- part-verse letters such as 8b-12 are retained in some Lectionary citations and
  dropped in others; settle one notation at collation
- oration conclusions are rendered both as the terse printed cue and in expanded
  form; settle one rendering at collation
- where the 1998 US Lectionary and the Ordo Lectionum diverge, the Ordo reading
  was preferred; confirm against the approved edition actually in use
- proper prefaces and the Oratio super populum are recorded inconsistently across
  seasons; decide whether either belongs in this index at all
- all entries in this file are placeholders pending source-backed completion
- an audit of every non-Psalm citation against the tracked Douay text found a
  further 23 that still resolve to the wrong verses, in Exodus 22, Hosea 2 and 6,
  Esther 4, Wisdom 6 and 11, Sirach 3, 27 and 35, Mark 9, John 6, and Acts 14;
  each needs a citation_divergences entry once its numbering is settled. Two of
  those groups do not come from the Nova Vulgata at all — the Sirach and Wisdom
  refs follow the Greek that the US Lectionary numbers, and several John 6
  antiphons are already Clementine-numbered and correct while the John 6 readings
  beside them are not. Settle which system each ref speaks before correcting it
- a citation naming a verse beyond the end of a chapter is silently clamped
  rather than reported, because `index-bible` derives a chapter's bounds from
  the verses the edition prints; `Mark 4:41`, `1 Thessalonians 4:18` and
  `Acts 7:60` are each dropped this way and each happens to lose no text,
  because the verse the Vulgate merged them into carries it. The remedy is a
  `merged-verse` row in the edition's own verse-aliases artifact rather than an
  entry below, because the two Vulgate editions disagree here — the Douay ends
  1 Thessalonians 4 at verse 17 and the Clementine at 18 — so this is a property
  of an edition and cannot be recorded once for all of them
# The psalm loci this file carries that its own numbering cannot hold. The
# calendar declares Hebrew numbering, and eleven antiphons reproduce the number
# their missal prints, which is the Vulgate's across most of the psalter; the
# `citation_convention` above predicts exactly this, because antiphons keep the
# controlling missal's number while responsorial psalms take the Lectionary's.
# So `Psalm 118:137` is not a resolvable verse here at all, Hebrew 118 ending at
# 29, though it is a real verse under the numbering the antiphon was printed in.
#
# This block is temporary. It exists so that the psalter-bounds gate can stay
# shut over the rest of the calendar while these eleven remain uncorrected, and
# it is not a licence to leave them: `check-calendar-masses` reports every locus
# below on each run without failing, fails on any psalm-bound breach that is not
# listed, and fails on any locus listed here that has stopped breaching. An
# entry therefore cannot outlive the defect that earned it. Correcting the
# antiphons belongs to TASK-32, which measures each one against its incipit and
# decides per slot whether the number moves or the declaration does; when it
# lands this block empties and goes. Nothing here anticipates that decision:
# `divergence` states only what the two systems number, never what an antiphon
# says.
psalm_numbering_exceptions:
- psalm: 15
  divergence: Vulgate 15 is Hebrew 16; Hebrew 15 ends at verse 5 and Hebrew 16 runs
    to 11
  loci:
    "Psalm 15:11": ot-31/Communion Antiphon (Notas mihi fecisti vias vitae)
- psalm: 17
