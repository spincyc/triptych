        - name: Collect
          incipit: Praesta, quaesumus, omnipotens Deus, ut claritatis tuae
          source: composed
          text: |
            Praesta, quaesumus, omnipotens Deus, ut claritatis tuae super nos
            splendor effulgeat, et lux tuae lucis corda eorum, qui per tuam
            gratiam sunt renati, Sancti Spiritus illustratione confirmet.
            Per Dominum.
