      - name: Litany of the Saints
        incipit: Kyrie, eleison
        source: composed
        notes: Omitted if there are no candidates for Baptism and the font is not to be blessed.
        text: |
          Kyrie, eleison. Kyrie, eleison.
          Christe, eleison. Christe, eleison.
          Kyrie, eleison. Kyrie, eleison.
    
          Sancta Maria, Mater Dei, ora pro nobis.
          Sancte Michael, ora pro nobis.
          Sancti Angeli Dei, orate pro nobis.
          Sancte Ioannes Baptista, ora pro nobis.
          Sancte Ioseph, ora pro nobis.
          Sancti Petre et Paule, orate pro nobis.
          Sancte Andrea, ora pro nobis.
          Sancte Ioannes, ora pro nobis.
          Sancta Maria Magdalena, ora pro nobis.
          Sancte Stephane, ora pro nobis.
          Sancte Ignati Antiochene, ora pro nobis.
          Sancte Laurenti, ora pro nobis.
          Sanctae Perpetua et Felicitas, orate pro nobis.
          Sancta Agnes, ora pro nobis.
          Sancte Gregori, ora pro nobis.
          Sancte Augustine, ora pro nobis.
          Sancte Athanasi, ora pro nobis.
          Sancte Basili, ora pro nobis.
          Sancte Martine, ora pro nobis.
          Sancte Benedicte, ora pro nobis.
          Sancti Francisce et Dominice, orate pro nobis.
          Sancte Francisce (Xavier), ora pro nobis.
          Sancte Ioannes Maria (Vianney), ora pro nobis.
          Sancta Catharina (Senensis), ora pro nobis.
          Sancta Teresia a Iesu, ora pro nobis.
          Omnes Sancti et Sanctae Dei, orate pro nobis.
    
          Propitius esto, libera nos, Domine.
          Ab omni malo, libera nos, Domine.
          Ab omni peccato, libera nos, Domine.
          A morte perpetua, libera nos, Domine.
          Per incarnationem tuam, libera nos, Domine.
          Per mortem et resurrectionem tuam, libera nos, Domine.
          Per effusionem Spiritus Sancti, libera nos, Domine.
    
          Peccatores, te rogamus, audi nos.
          Ut hos electos per gratiam
          Baptismi regenerare digneris, te rogamus, audi nos.
          Vel: Ut hunc fontem,
          regenerandis tibi filiis,
          gratia tua sanctificare digneris, te rogamus, audi nos.
          Iesu, Fili Dei vivi, te rogamus, audi nos.
    
          Christe, audi nos. Christe, audi nos.
          Christe, exaudi nos. Christe, exaudi nos.
      - name: Prayer after the Litany
        incipit: Omnipotens sempiterne Deus, adesto magnae pietatis tuae sacramentis
        source: composed
        notes: Said when there are candidates for Baptism.
        text: |
          Omnipotens sempiterne Deus,
          adesto magnae pietatis tuae sacramentis,
          et ad recreandos novos populos,
          quos tibi fons baptismatis parturit,
          spiritum adoptionis emitte,
          ut, quod nostrae humilitatis gerendum est mysterio,
          virtutis tuae impleatur effectu.
          Per Christum Dominum nostrum.
      - name: Blessing of Baptismal Water
        incipit: Deus, qui invisibili potentia
        source: composed
        text: |
          Deus, qui invisibili potentia
          per sacramentorum signa mirabilem operaris effectum,
          et creaturam aquae multis modis praeparasti,
          ut baptismi gratiam demonstraret;
          Deus, cuius Spiritus
          super aquas inter ipsa mundi primordia ferebatur,
          ut iam tunc virtutem sanctificandi
          aquarum natura conciperet;
          Deus, qui regenerationis speciem
          in ipsa diluvii effusione signasti,
          ut unius eiusdemque elementi mysterio
          et finis esset vitiis et origo virtutum;
          Deus, qui Abrahae filios
          per Mare Rubrum sicco vestigio transire fecisti,
          ut plebs, a Pharaonis servitute liberata,
          populum baptizatorum praefiguraret;
          Deus, cuius Filius, in aqua Iordanis a Ioanne baptizatus,
          Sancto Spiritu est inunctus,
          et, in cruce pendens,
          una cum sanguine aquam de latere suo produxit,
          ac, post resurrectionem suam, discipulis iussit:
          "Ite, docete omnes gentes, baptizantes eos
          in nomine Patris, et Filii, et Spiritus Sancti":
          respice in faciem Ecclesiae tuae,
          eique dignare fontem baptismatis aperire.
          Sumat haec aqua Unigeniti tui gratiam de Spiritu Sancto,
          ut homo, ad imaginem tuam conditus,
          sacramento baptismatis
          a cunctis squaloribus vetustatis ablutus,
          in novam infantiam
          ex aqua et Spiritu Sancto resurgere mereatur.
    
          Descendat, quaesumus, Domine,
          in hanc plenitudinem fontis
          per Filium tuum virtus Spiritus Sancti,
          ut omnes, cum Christo consepulti
          per baptismum in mortem,
          ad vitam cum ipso resurgant.
          Qui tecum vivit et regnat in unitate Spiritus Sancti, Deus,
          per omnia saecula saeculorum.
      - name: Acclamation after the Blessing of Baptismal Water
        incipit: Benedicite, fontes, Domino
        source: scripture
        verses:
        - book: Daniel
          ranges:
          - begin: {chapter: 3, verse: 77}
            end: {chapter: 3, verse: 77}
          ref: Daniel 3:77
      - name: Blessing of Water
        incipit: Domine Deus noster, populo tuo hac nocte sacratissima vigilanti
        source: composed
        notes: Used in place of the blessing of the font when there are no candidates for Baptism.
        text: |
          Dominum Deum nostrum, fratres carissimi,
          suppliciter exoremus,
          ut hanc creaturam aquae benedicere dignetur,
          super nos aspergendam in nostri memoriam baptismi.
          Ipse autem nos renovare dignetur,
          ut Spiritui, quem accepimus, fideles maneamus.
    
          Domine Deus noster,
          populo tuo hac nocte sacratissima vigilanti
          adesto propitius:
          et nobis, mirabile nostrae creationis opus,
          sed et redemptionis nostrae mirabilius, memorantibus,
          hanc aquam benedicere tu dignare.
          Ipsam enim tu fecisti,
          ut et arva fecunditate donaret,
          et levamen corporibus nostris munditiamque praeberet.
          Aquam etiam tuae ministram misericordiae condidisti:
          nam per ipsam solvisti tui populi servitutem
          illiusque sitim in deserto sedasti;
          per ipsam novum foedus nuntiaverunt prophetae,
          quod eras cum hominibus initurus;
          per ipsam denique, quam Christus in Iordane sacravit,
          corruptam naturae nostrae substantiam
          in regenerationis lavacro renovasti.
          Sit igitur haec aqua nobis suscepti baptismatis memoria,
          et cum fratribus nostris, qui sunt in Paschate baptizati,
          gaudia nos tribuas sociare.
          Per Christum Dominum nostrum.
      - name: Renewal of Baptismal Promises
        incipit: Abrenuntiatis Satanae?
        source: composed
        notes: A second form of the renunciations is also provided.
        text: |
          Sacerdos: Abrenuntiatis Satanae?
          Omnes: Abrenuntio.
          Sacerdos: Et omnibus operibus eius?
          Omnes: Abrenuntio.
          Sacerdos: Et omnibus pompis eius?
          Omnes: Abrenuntio.
    
          Sacerdos: Creditis in Deum Patrem omnipotentem,
          creatorem caeli et terrae?
          Omnes: Credo.
          Sacerdos: Creditis in Iesum Christum, Filium eius unicum,
          Dominum nostrum, natum ex Maria Virgine,
          passum et sepultum, qui a mortuis resurrexit
          et sedet ad dexteram Patris?
          Omnes: Credo.
          Sacerdos: Creditis in Spiritum Sanctum, sanctam Ecclesiam
          catholicam, sanctorum communionem, remissionem
          peccatorum, carnis resurrectionem et vitam aeternam?
          Omnes: Credo.
    
          Et Deus omnipotens, Pater Domini nostri Iesu Christi,
          qui nos regeneravit ex aqua et Spiritu Sancto,
          quique nobis dedit remissionem peccatorum,
          ipse nos custodiat gratia sua,
          in Christo Iesu Domino nostro,
          in vitam aeternam.
          Omnes: Amen.
      - name: Antiphon at the Sprinkling
        incipit: Vidi aquam egredientem de templo
        source: mixed
        verses:
        - book: Ezekiel
          ranges:
          - begin: {chapter: 47, verse: 1}
            end: {chapter: 47, verse: 2}
          - begin: {chapter: 47, verse: 9}
            end: {chapter: 47, verse: 9}
          ref: Ezekiel 47:1-2, 9
        text: |
          Ant. Vidi aquam egredientem de templo,
          a latere dextro, alleluia;
          et omnes, ad quos pervenit aqua ista, salvi facti sunt
          et dicent: Alleluia, alleluia.
      - name: Prayer over the Offerings
        incipit: Suscipe, quaesumus, Domine, preces populi tui
        source: composed
        text: |
          Suscipe, quaesumus, Domine, preces populi tui
          cum oblationibus hostiarum,
          ut, paschalibus initiata mysteriis,
          ad aeternitatis nobis medelam, te operante, proficiant.
          Per Christum.
      - name: Communion Antiphon
        incipit: Pascha nostrum immolatus est Christus
        source: scripture
        verses:
        - book: 1 Corinthians
          ranges:
          - begin: {chapter: 5, verse: 7}
            end: {chapter: 5, verse: 8}
          ref: 1 Corinthians 5:7-8
        notes: Psalm 118 is sung with it as opportune.
      - name: Prayer after Communion
        incipit: Spiritum nobis, Domine, tuae caritatis infunde
        source: composed
        text: |
          Spiritum nobis, Domine, tuae caritatis infunde,
          ut, quos sacramentis paschalibus satiasti,
          tua facias pietate concordes.
          Per Christum.
      - name: Solemn Blessing
        incipit: Benedicat vos omnipotens Deus
        source: composed
        text: |
          Benedicat vos omnipotens Deus,
          hodierna interveniente sollemnitate paschali,
          et ab omni miseratus defendat incursione peccati.
          R. Amen.
          Et qui ad aeternam vitam
          in Unigeniti sui resurrectione vos reparat,
          vos praemiis immortalitatis adimpleat.
          R. Amen.
          Et qui, expletis passionis dominicae diebus,
          paschalis festi gaudia celebratis,
          ad ea festa, quae laetitiis peraguntur aeternis,
          ipso opitulante, exsultantibus animis veniatis.
          R. Amen.
          Benedicat vos omnipotens Deus,
          Pater, et Filius, et Spiritus Sanctus.
          R. Amen.
    - key: easter-sunday
      name: Easter Sunday of the Resurrection of the Lord
      registry: pc-s17
      season: easter
      propers:
