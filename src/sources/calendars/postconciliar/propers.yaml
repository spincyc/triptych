            end: {chapter: 13, verse: 34}
          ref: John 13:34
      - name: Washing of Feet, Antiphon 7
        incipit: Maneant in vobis fides, spes, caritas
        source: scripture
        verses:
        - book: 1 Corinthians
          ranges:
          - begin: {chapter: 13, verse: 13}
            end: {chapter: 13, verse: 13}
          ref: 1 Corinthians 13:13
      - name: Antiphon at the Presentation of the Gifts
        incipit: Ubi caritas est vera
        source: composed
        text: |
          Ant. Ubi caritas est vera, Deus ibi est.
          V. Congregavit nos in unum Christi amor.
          V. Exsultemus et in ipso iucundemur.
          V. Timeamus et amemus Deum vivum.
          V. Et ex corde diligamus nos sincero.
          Ant. Ubi caritas est vera, Deus ibi est.
          V. Simul ergo cum in unum congregamur:
          V. Ne nos mente dividamur, caveamus.
          V. Cessent iurgia maligna, cessent lites.
          V. Et in medio nostri sit Christus Deus.
          Ant. Ubi caritas est vera, Deus ibi est.
          V. Simul quoque cum beatis videamus
          V. Glorianter vultum tuum, Christe Deus:
          V. Gaudium, quod est immensum atque probum,
          V. Saecula per infinita saeculorum. Amen.
      - name: Prayer over the Offerings
        incipit: Concede nobis, quaesumus, Domine
        source: composed
        text: |
          Concede nobis, quaesumus, Domine,
          haec digne frequentare mysteria,
          quia, quoties huius hostiae commemoratio celebratur,
          opus nostrae redemptionis exercetur.
          Per Christum.
      - name: Communion Antiphon
        incipit: Hoc Corpus, quod pro vobis tradetur
        source: scripture
        verses:
        - book: 1 Corinthians
          ranges:
          - begin: {chapter: 11, verse: 24}
            end: {chapter: 11, verse: 25}
          ref: 1 Corinthians 11:24-25
      - name: Prayer after Communion
        incipit: Concede nobis, omnipotens Deus
        source: composed
        text: |
          Concede nobis, omnipotens Deus,
          ut, sicut Cena Filii tui reficimur temporali,
          ita satiari mereamur aeterna.
          Per Christum.
      - name: Hymn at the Transfer of the Blessed Sacrament
        incipit: Pange, lingua, gloriosi Corporis mysterium
        source: composed
        notes: The last two stanzas are excluded here and sung at the place of reposition.
        text: |
          Pange, lingua, gloriosi
          Corporis mysterium,
          Sanguinisque pretiosi,
          quem in mundi pretium
          fructus ventris generosi
          Rex effudit gentium.
    
          Nobis datus, nobis natus
          ex intacta Virgine,
          et in mundo conversatus,
          sparso verbi semine,
          sui moras incolatus
          miro clausit ordine.
    
          In supremae nocte cenae
          recumbens cum fratribus,
          observata lege plene
          cibis in legalibus,
          cibum turbae duodenae
          se dat suis manibus.
    
          Verbum caro panem verum
          Verbo carnem efficit,
          fitque Sanguis Christi merum,
          et si sensus deficit,
          ad firmandum cor sincerum
          sola fides sufficit.
      - name: Chant at the Place of Reposition
        incipit: Tantum ergo Sacramentum
        source: composed
        text: |
          Tantum ergo Sacramentum
          veneremur cernui,
          et antiquum documentum
          novo cedat ritui;
          praestet fides supplementum
          sensuum defectui.
    
          Genitori Genitoque
          laus et iubilatio,
          salus, honor, virtus quoque
          sit et benedictio;
          procedenti ab utroque
          compar sit laudatio. Amen.
    - key: good-friday
      name: Celebration of the Lord's Passion
      registry: pc-t02
      season: triduum
      propers:
      - name: Prayer
        incipit: Reminiscere miserationum tuarum, Domine
        source: composed
        notes: Said after the prostration and silent prayer, without the invitation Oremus.
        text: |
          Reminiscere miserationum tuarum, Domine,
          et famulos tuos aeterna protectione sanctifica,
          pro quibus Christus, Filius tuus,
          per suum cruorem instituit paschale mysterium.
          Qui vivit et regnat in saecula saeculorum.
      - name: Prayer (alternative)
        incipit: Deus, qui peccati veteris hereditariam mortem
        source: composed
        notes: Either of the two prayers may be used.
        text: |
          Deus, qui peccati veteris hereditariam mortem,
          in qua posteritatis genus omne successerat,
          Christi Filii tui, Domini nostri, passione solvisti,
          da, ut conformes eidem facti,
          sicut imaginem terreni hominis
          naturae necessitate portavimus,
          ita imaginem caelestis
          gratiae sanctificatione portemus.
          Per Christum Dominum nostrum.
      - name: First Reading
        source: scripture
        verses:
        - book: Isaiah
          ranges:
          - begin: {chapter: 52, verse: 13}
            end: {chapter: 53, verse: 12}
          ref: Isaiah 52:13-53:12
      - name: Responsorial Psalm
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 31, verse: 2}
            end: {chapter: 31, verse: 2}
          - begin: {chapter: 31, verse: 6}
            end: {chapter: 31, verse: 6}
          - begin: {chapter: 31, verse: 12}
            end: {chapter: 31, verse: 13}
          - begin: {chapter: 31, verse: 15}
            end: {chapter: 31, verse: 16}
          - begin: {chapter: 31, verse: 17}
            end: {chapter: 31, verse: 17}
          - begin: {chapter: 31, verse: 25}
            end: {chapter: 31, verse: 25}
          ref: Psalm 31:2, 6, 12-13, 15-16, 17, 25
      - name: Second Reading
        source: scripture
        verses:
        - book: Hebrews
          ranges:
          - begin: {chapter: 4, verse: 14}
            end: {chapter: 4, verse: 16}
          - begin: {chapter: 5, verse: 7}
            end: {chapter: 5, verse: 9}
          ref: Hebrews 4:14-16; 5:7-9
      - name: Chant before the Gospel
        incipit: Christus factus est pro nobis oboediens
        source: scripture
        verses:
        - book: Philippians
          ranges:
          - begin: {chapter: 2, verse: 8}
            end: {chapter: 2, verse: 9}
          ref: Philippians 2:8-9
      - name: Passion
        source: scripture
        verses:
        - book: John
          ranges:
          - begin: {chapter: 18, verse: 1}
            end: {chapter: 19, verse: 42}
          ref: John 18:1-19:42
      - name: 'Solemn Intercession I: For Holy Church'
        incipit: Oremus, dilectissimi nobis, pro Ecclesia sancta Dei
        source: composed
        text: |
          Oremus, dilectissimi nobis, pro Ecclesia sancta Dei,
          ut eam Deus et Dominus noster
          pacificare, adunare et custodire dignetur
          toto orbe terrarum,
          detque nobis, quietam et tranquillam vitam degentibus,
          glorificare Deum Patrem omnipotentem.
    
          Omnipotens sempiterne Deus,
          qui gloriam tuam omnibus in Christo gentibus revelasti:
          custodi opera misericordiae tuae,
          ut Ecclesia tua, toto orbe diffusa,
          stabili fide in confessione tui nominis perseveret.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession II: For the Pope'
        incipit: Oremus et pro beatissimo Papa nostro N.
        source: composed
        text: |
          Oremus et pro beatissimo Papa nostro N.,
          ut Deus et Dominus noster,
          qui elegit eum in ordine episcopatus,
          salvum atque incolumem custodiat Ecclesiae suae sanctae,
          ad regendum populum sanctum Dei.
    
          Omnipotens sempiterne Deus,
          cuius iudicio universa fundantur,
          respice propitius ad preces nostras,
          et electum nobis Antistitem tua pietate conserva,
          ut christiana plebs, quae te gubernatur auctore,
          sub ipso Pontifice, fidei suae meritis augeatur.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession III: For all orders and degrees of the faithful'
        incipit: Oremus et pro Episcopo nostro N.
        source: composed
        text: |
          Oremus et pro Episcopo nostro N.,
          pro omnibus Episcopis, presbyteris, diaconis Ecclesiae,
          et universa plebe fidelium.
    
          Omnipotens sempiterne Deus,
          cuius Spiritu totum corpus Ecclesiae
          sanctificatur et regitur,
          exaudi nos pro ministris tuis supplicantes,
          ut, gratiae tuae munere, ab omnibus tibi fideliter serviatur.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession IV: For catechumens'
        incipit: Oremus et pro catechumenis (nostris)
        source: composed
        text: |
          Oremus et pro catechumenis (nostris),
          ut Deus et Dominus noster
          adaperiat aures praecordiorum ipsorum
          ianuamque misericordiae,
          ut, per lavacrum regenerationis
          accepta remissione omnium peccatorum,
          et ipsi inveniantur in Christo Iesu Domino nostro.
    
          Omnipotens sempiterne Deus,
          qui Ecclesiam tuam nova semper prole fecundas,
          auge fidem et intellectum catechumenis (nostris),
          ut, renati fonte baptismatis,
          adoptionis tuae filiis aggregentur.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession V: For the unity of Christians'
        incipit: Oremus et pro universis fratribus in Christum credentibus
        source: composed
        text: |
          Oremus et pro universis fratribus in Christum credentibus,
          ut Deus et Dominus noster eos, veritatem facientes,
          in una Ecclesia sua congregare et custodire dignetur.
    
          Omnipotens sempiterne Deus,
          qui dispersa congregas et congregata conservas,
          ad gregem Filii tui placatus intende,
          ut, quos unum baptisma sacravit,
          eos et fidei iungat integritas
          et vinculum societ caritatis.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession VI: For the Jewish people'
        incipit: Oremus et pro Iudaeis
        source: composed
        text: |
          Oremus et pro Iudaeis,
          ut, ad quos prius locutus est Dominus Deus noster,
          eis tribuat in sui nominis amore
          et in sui foederis fidelitate proficere.
    
          Omnipotens sempiterne Deus,
          qui promissiones tuas Abrahae eiusque semini contulisti,
          Ecclesiae tuae preces clementer exaudi,
          ut populus acquisitionis prioris
          ad redemptionis mereatur plenitudinem pervenire.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession VII: For those who do not believe in Christ'
        incipit: Oremus et pro iis qui in Christum non credunt
        source: composed
        text: |
          Oremus et pro iis qui in Christum non credunt,
          ut, luce Sancti Spiritus illustrati,
          viam salutis et ipsi valeant introire.
    
          Omnipotens sempiterne Deus,
          fac ut qui Christum non confitentur,
          coram te sincero corde ambulantes, inveniant veritatem,
          nosque, mutuo proficientes semper amore
          et ad tuae vitae mysterium plenius percipiendum sollicitos,
          perfectiores effice tuae testes caritatis in mundo.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession VIII: For those who do not believe in God'
        incipit: Oremus et pro iis qui Deum non agnoscunt
        source: composed
        text: |
          Oremus et pro iis qui Deum non agnoscunt,
          ut, quae recta sunt sincero corde sectantes,
          ad ipsum Deum pervenire mereantur.
    
          Omnipotens sempiterne Deus,
          qui cunctos homines condidisti,
          ut te semper desiderando quaererent
          et inveniendo quiescerent,
          praesta, quaesumus,
          ut inter noxia quaeque obstacula
          omnes, tuae signa pietatis
          et in te credentium testimonium
          bonorum operum percipientes,
          te solum verum Deum nostrique generis Patrem
          gaudeant confiteri.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession IX: For those in public office'
        incipit: Oremus et pro omnibus rempublicam moderantibus
        source: composed
        text: |
          Oremus et pro omnibus rempublicam moderantibus,
          ut Deus et Dominus noster
          mentes et corda eorum secundum voluntatem suam dirigat
          ad veram omnium pacem et libertatem.
    
          Omnipotens sempiterne Deus,
          in cuius manu sunt hominum corda et iura populorum,
          respice benignus ad eos, qui nos in potestate moderantur,
          ut ubique terrarum populorum prosperitas,
          pacis securitas et religionis libertas,
          te largiente, consistant.
          Per Christum Dominum nostrum.
      - name: 'Solemn Intercession X: For those in tribulation'
        incipit: Oremus, dilectissimi nobis, Deum Patrem omnipotentem
        source: composed
        text: |
          Oremus, dilectissimi nobis, Deum Patrem omnipotentem,
          ut cunctis mundo purget erroribus,
          morbos auferat, famem depellat,
          aperiat carceres, vincula solvat,
          viatoribus securitatem, peregrinantibus reditum,
          infirmantibus sanitatem
          atque morientibus salutem indulgeat.
    
          Omnipotens sempiterne Deus,
          maestorum consolatio, laborantium fortitudo,
          perveniant ad te preces
          de quacumque tribulatione clamantium,
          ut omnes sibi in necessitatibus suis
          misericordiam tuam gaudeant affuisse.
          Per Christum Dominum nostrum.
      - name: Showing of the Holy Cross
        incipit: Ecce lignum Crucis
        source: composed
        notes: Sung three times, at the successive unveilings or in the procession.
        text: |
          Ecce lignum Crucis,
          in quo salus mundi pependit.
          R. Venite, adoremus.
      - name: Antiphon at the Adoration of the Holy Cross
        incipit: Crucem tuam adoramus, Domine
        source: mixed
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 67, verse: 2}
            end: {chapter: 67, verse: 2}
          ref: Psalm 67:2
        text: |
          Ant. Crucem tuam adoramus, Domine,
          et sanctam resurrectionem tuam laudamus et glorificamus:
          ecce enim propter lignum
          venit gaudium in universo mundo.
    
          Deus misereatur nostri, et benedicat nobis:
          illuminet vultum suum super nos,
          et misereatur nostri.
    
          Et repetitur antiphona: Crucem tuam...
      - name: Improperia
        incipit: Popule meus, quid feci tibi?
        source: mixed
        verses:
        - book: Micah
          ranges:
          - begin: {chapter: 6, verse: 3}
            end: {chapter: 6, verse: 4}
          ref: Micah 6:3-4
        text: |
          I
          Popule meus, quid feci tibi?
          Aut in quo contristavi te? Responde mihi!
          Quia eduxi te de terra Aegypti:
          parasti Crucem Salvatori tuo.
          Hagios o Theos.
          Sanctus Deus.
          Hagios Ischyros.
          Sanctus Fortis.
          Hagios Athanatos, eleison himas.
          Sanctus Immortalis, miserere nobis.
    
          Quia eduxi te per desertum quadraginta annis,
          et manna cibavi te,
          et introduxi te in terram satis bonam:
          parasti Crucem Salvatori tuo.
          Hagios o Theos.
          Sanctus Deus.
          Hagios Ischyros.
          Sanctus Fortis.
          Hagios Athanatos, eleison himas.
          Sanctus Immortalis, miserere nobis.
    
          Quid ultra debui facere tibi, et non feci?
          Ego quidem plantavi te
          vineam electam meam speciosissimam:
          et tu facta es mihi nimis amara:
          aceto namque sitim meam potasti,
          et lancea perforasti latus Salvatori tuo.
          Hagios o Theos.
          Sanctus Deus.
          Hagios Ischyros.
          Sanctus Fortis.
          Hagios Athanatos, eleison himas.
          Sanctus Immortalis, miserere nobis.
    
          II
          Ego propter te flagellavi Aegyptum
          cum primogenitis suis:
          et tu me flagellatum tradidisti.
          Popule meus, quid feci tibi?
          Aut in quo contristavi te? Responde mihi!
    
          Ego eduxi te de Aegypto,
          demerso Pharaone in Mare Rubrum:
          et tu me tradidisti principibus sacerdotum.
          Popule meus...
    
          Ego ante te aperui mare:
          et tu aperuisti lancea latus meum.
          Popule meus...
    
          Ego ante te praeivi in columna nubis:
          et tu me duxisti ad praetorium Pilati.
          Popule meus...
    
          Ego te pavi manna per desertum:
          et tu me cecidisti alapis et flagellis.
          Popule meus...
    
          Ego te potavi aqua salutis de petra:
          et tu me potasti felle et aceto.
          Popule meus...
    
          Ego propter te Chananaeorum reges percussi:
          et tu percussisti arundine caput meum.
          Popule meus...
    
          Ego dedi tibi sceptrum regale:
          et tu dedisti capiti meo spineam coronam.
          Popule meus...
    
          Ego te exaltavi magna virtute:
          et tu me suspendisti in patibulo Crucis.
          Popule meus...
      - name: Hymn at the Adoration of the Holy Cross
        incipit: Crux fidelis, inter omnes arbor una nobilis
        source: mixed
        verses:
        - book: Genesis
          ranges:
          - begin: {chapter: 3, verse: 6}
            end: {chapter: 3, verse: 6}
          ref: Genesis 3:6
        - book: John
          ranges:
          - begin: {chapter: 19, verse: 29}
            end: {chapter: 19, verse: 29}
          - begin: {chapter: 19, verse: 34}
            end: {chapter: 19, verse: 34}
          ref: John 19:29, 34
        text: |
          Crux fidelis, inter omnes arbor una nobilis,
          Nulla talem silva profert, flore, fronde, germine!
          Dulce lignum dulci clavo dulce pondus sustinens!
    
          Pange, lingua, gloriosi proelium certaminis,
          Et super crucis tropaeo dic triumphum nobilem,
          Qualiter Redemptor orbis immolatus vicerit.
    
          Crux fidelis, inter omnes arbor una nobilis,
          Nulla talem silva profert, flore, fronde, germine!
    
          De parentis protoplasti fraude factor condolens,
          Quando pomi noxialis morte morsu corruit,
          Ipse lignum tunc notavit, damna ligni ut solveret.
    
          Dulce lignum dulci clavo dulce pondus sustinens!
    
          Hoc opus nostrae salutis ordo depoposcerat,
          Multiformis perditoris arte ut artem falleret,
          Et medelam ferret inde, hostis unde laeserat.
    
          Crux fidelis, inter omnes arbor una nobilis,
          Nulla talem silva profert, flore, fronde, germine!
    
          Quando venit ergo sacri plenitudo temporis,
          Missus est ab arce Patris Natus, orbis conditor,
          Atque ventre virginali carne factus prodiit.
    
          Dulce lignum dulci clavo dulce pondus sustinens!
    
          Vagit infans inter arta conditus praesepia,
          Membra pannis involuta Virgo Mater alligat,
          Et manus pedesque et crura stricta cingit fascia.
    
          Crux fidelis, inter omnes arbor una nobilis,
          Nulla talem silva profert, flore, fronde, germine!
    
          Lustra sex qui iam peracta tempus implens corporis,
          se volente, natus ad hoc, passioni deditus,
          agnus in crucis levatur immolandus stipite.
    
          Dulce lignum dulci clavo dulce pondus sustinens!
    
          En acetum, fel, arundo, sputa, clavi, lancea;
          Mite corpus perforatur, sanguis, unda profluit;
          Terra, pontus, astra, mundus quo lavantur flumine!
    
          Crux fidelis, inter omnes arbor una nobilis,
          Nulla talem silva profert, flore, fronde, germine!
    
          Flecte ramos, arbor alta, tensa laxa viscera,
          Et rigor lentescat ille, quem dedit nativitas,
          Ut superni membra Regis miti tendas stipite.
    
          Dulce lignum dulci clavo dulce pondus sustinens!
    
          Sola digna tu fuisti ferre saecli pretium
          Atque portum praeparare nauta mundo naufrago,
          Quem sacer cruor perunxit fusus Agni corpore.
    
          Crux fidelis, inter omnes arbor una nobilis,
          Nulla talem silva profert, flore, fronde, germine!
    
          Conclusio numquam omittenda:
          Aequa Patri Filioque, inclito Paraclito,
          Sempiterna sit beatae Trinitati gloria;
          cuius alma nos redemit atque servat gratia. Amen.
      - name: Psalm during Communion
        source: scripture
        verses:
        - book: Psalms
          ranges:
          - begin: {chapter: 22}
            end: {chapter: 22}
          ref: Psalm 22
        notes: No Communion Antiphon is appointed; this psalm or another suitable chant may be
          sung.
      - name: Prayer after Communion
        incipit: Omnipotens sempiterne Deus, qui nos Christi tui
        source: composed
        text: |
          Omnipotens sempiterne Deus,
          qui nos Christi tui beata morte et resurrectione reparasti,
          conserva in nobis opus misericordiae tuae,
          ut huius mysterii participatione
          perpetua devotione vivamus.
          Per Christum Dominum nostrum.
      - name: Prayer over the People
        incipit: Super populum tuum, quaesumus, Domine
        source: composed
        text: |
          Super populum tuum, quaesumus, Domine,
          qui mortem Filii tui in spe suae resurrectionis recoluit,
          benedictio copiosa descendat,
          indulgentia veniat, consolatio tribuatur,
          fides sancta succrescat, redemptio sempiterna firmetur.
          Per Christum Dominum nostrum.
    - key: easter-vigil
      name: The Easter Vigil in the Holy Night
      registry: pc-t03
      season: triduum
      propers:
      - name: Blessing of the Fire
        incipit: Deus, qui per Filium tuum
        source: composed
        text: |
          Deus, qui per Filium tuum
          claritatis tuae ignem fidelibus contulisti,
          novum hunc ignem sanctifica,
          et concede nobis,
          ita per haec festa paschalia
          caelestibus desideriis inflammari,
          ut ad perpetuae claritatis
          puris mentibus valeamus festa pertingere.
          Per Christum Dominum nostrum.
      - name: Inscription of the Paschal Candle
        incipit: Christus heri et hodie
        source: composed
        text: |
          1. Christus heri et hodie;
          2. Principium et Finis;
          3. Alpha;
          4. et Omega;
          5. Ipsius sunt tempora;
          6. et saecula;
          7. Ipsi gloria et imperium;
          8. per universa aeternitatis saecula. Amen.
      - name: Insertion of the Grains of Incense
        incipit: Per sua sancta vulnera gloriosa
        source: composed
        notes: The five grains of incense may be inserted in the form of a cross.
        text: |
          1. Per sua sancta vulnera
          2. gloriosa
          3. custodiat
          4. et conservet nos
          5. Christus Dominus. Amen.
      - name: Lighting of the Paschal Candle
        incipit: Lumen Christi gloriose resurgentis
        source: composed
        text: |
          Lumen Christi gloriose resurgentis
          dissipet tenebras cordis et mentis.
      - name: Acclamation in the Procession
        incipit: Lumen Christi
        source: composed
        notes: Sung three times, at the church door, in the middle of the church, and before the
          altar.
        text: |
          Lumen Christi.
          R. Deo gratias.
      - name: Easter Proclamation (Exsultet)
        incipit: Exsultet iam angelica turba caelorum
        source: composed
        notes: A shorter form of the Proclamation may also be sung.
        text: |
          Exsultet iam angelica turba caelorum:
          exsultent divina mysteria:
          et pro tanti Regis victoria tuba insonet salutaris.
          Gaudeat et tellus tantis irradiata fulgoribus:
          et, aeterni Regis splendore illustrata,
          totius orbis se sentiat amisisse caliginem.
          Laetetur et mater Ecclesia,
          tanti luminis adornata fulgoribus:
          et magnis populorum vocibus haec aula resultet.
    
          (Quapropter astantes vos, fratres carissimi,
          ad tam miram huius sancti luminis claritatem,
          una mecum, quaeso,
          Dei omnipotentis misericordiam invocate.
          Ut, qui me non meis meritis
          intra Levitarum numerum dignatus est aggregare,
          luminis sui claritatem infundens,
          cerei huius laudem implere perficiat).
    
          (V. Dominus vobiscum.
          R. Et cum spiritu tuo.)
          V. Sursum corda.
          R. Habemus ad Dominum.
          V. Gratias agamus Domino Deo nostro.
          R. Dignum et iustum est.
    
          Vere dignum et iustum est,
          invisibilem Deum Patrem omnipotentem
          Filiumque eius Unigenitum,
          Dominum nostrum Iesum Christum,
          toto cordis ac mentis affectu et vocis ministerio personare.
          Qui pro nobis aeterno Patri Adae debitum solvit,
          et veteris piaculi cautionem pio cruore detersit.
          Haec sunt enim festa paschalia,
          in quibus verus ille Agnus occiditur,
          cuius sanguine postes fidelium consecrantur.
          Haec nox est,
          in qua primum patres nostros,
          filios Israel eductos de Aegypto,
          Mare Rubrum sicco vestigio transire fecisti.
          Haec igitur nox est,
          quae peccatorum tenebras columnae illuminatione purgavit.
          Haec nox est,
          quae hodie per universum mundum in Christo credentes,
          a vitiis saeculi et caligine peccatorum segregatos,
          reddit gratiae, sociat sanctitati.
          Haec nox est,
          in qua, destructis vinculis mortis,
          Christus ab inferis victor ascendit.
          Nihil enim nobis nasci profuit, nisi redimi profuisset.
          O mira circa nos tuae pietatis dignatio!
          O inaestimabilis dilectio caritatis:
          ut servum redimeres, Filium tradidisti!
          O certe necessarium Adae peccatum,
          quod Christi morte deletum est!
          O felix culpa,
          quae talem ac tantum meruit habere Redemptorem!
          O vere beata nox,
          quae sola meruit scire tempus et horam,
          in qua Christus ab inferis resurrexit!
          Haec nox est, de qua scriptum est:
          Et nox sicut dies illuminabitur:
          et nox illuminatio mea in deliciis meis.
          Huius igitur sanctificatio noctis fugat scelera, culpas lavat:
          et reddit innocentiam lapsis et maestis laetitiam.
          Fugat odia, concordiam parat et curvat imperia.
    
          In huius igitur noctis gratia,
          suscipe, sancte Pater, laudis huius sacrificium vespertinum,
          quod tibi in hac cerei oblatione sollemni,
          per ministrorum manus
          de operibus apum, sacrosancta reddit Ecclesia.
          Sed iam columnae huius praeconia novimus,
          quam in honorem Dei rutilans ignis accendit.
          Qui, licet sit divisus in partes,
          mutuati tamen luminis detrimenta non novit.
          Alitur enim liquantibus ceris,
          quas in substantiam pretiosae huius lampadis
          apis mater eduxit.
          O vere beata nox,
          in qua terrenis caelestia, humanis divina iunguntur!
          Oramus ergo te, Domine,
          ut cereus iste in honorem tui nominis consecratus,
          ad noctis huius caliginem destruendam,
          indeficiens perseveret.
          Et in odorem suavitatis acceptus,
          supernis luminaribus misceatur.
          Flammas eius lucifer matutinus inveniat:
          Ille, inquam, lucifer, qui nescit occasum:
          Christus Filius tuus,
          qui, regressus ab inferis, humano generi serenus illuxit,
          et vivit et regnat in saecula saeculorum.
