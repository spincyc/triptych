      registry: pc-s07
      season: christmas
      propers:
      - name: Entrance Antiphon
        incipit: Salve, sancta Parens
        source: composed
        text: |
          Salve, sancta Parens, enixa puerpera Regem, qui caelum terramque regit
          in saecula saeculorum.
      - name: Entrance Antiphon (alternative)
        incipit: Lux fulgebit hodie super nos
        source: mixed
        verses:
        - book: Isaiah
          ranges:
          - begin: {chapter: 9, verse: 1}
            end: {chapter: 9, verse: 1}
          ref: Isaiah 9:1
        - book: Isaiah
          ranges:
          - begin: {chapter: 9, verse: 5}
            end: {chapter: 9, verse: 5}
          ref: Isaiah 9:5
        - book: Luke
          ranges:
          - begin: {chapter: 1, verse: 33}
            end: {chapter: 1, verse: 33}
          ref: Luke 1:33
        text: |
          Lux fulgebit hodie super nos, quia natus est nobis Dominus; et vocabitur
          admirabilis, Deus, Princeps pacis, Pater futuri saeculi: cuius regni non
          erit finis.
        notes: The Missal appoints this antiphon as an alternative (Vel) to the entrance antiphon.
      - name: Collect
        incipit: Deus, qui salutis aeternae
        source: composed
        text: |
          Deus, qui salutis aeternae, beatae Mariae virginitate fecunda, humano
          generi praemia praestitisti, tribue, quaesumus, ut ipsam pro nobis
          intercedere sentiamus, per quam meruimus Filium tuum auctorem vitae
          suscipere. Qui tecum.
