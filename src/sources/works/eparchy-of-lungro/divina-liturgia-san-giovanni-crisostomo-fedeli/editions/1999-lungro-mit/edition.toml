notes = "Direct original image inspection: PDF/printed p. 3 names the Eparchy of Lungro, 1999 and Greek transliteration with Albanian and Italian for the faithful. P. 4 names the diocesan liturgical commission, states general ecclesiastical approval and gives MIT, Cosenza, 1999. No approving person, dated decree or protocol is identified there. Notes/drawings credit Gogol's Palermo 1972 volume; icons credit Nikos Iannakakis. PP. 34–35 show the liturgy opening; pp. 114–115 carry feast-specific dismissals and Holy Week distinctions; p. 143 is the contents index. No exact Greek exemplar, textual relation to the Roma 1967 or reported 1968 printing, actual parish implementation, Piana/Grottaferrata reception or complete source-language collation is established."
