notes = "WHICH PRINTING THIS ACTUALLY IS, read off the bytes rather than taken from the catalogue. The retrieving lane records the Internet Archive item orthodox00ches as catalogued by the University of Toronto \"G. K. Chesterton, Orthodoxy (New York: John Lane, 1909)\". The copy's own impressions list says otherwise: \"First published in 1908 / Reprinted 1908 / Reprinted 1909 / Reprinted 1911 / Reprinted 1915 / Reprinted 1919 / Reprinted 1921 / Reprinted 1924 / Reprinted 1926 / First Published in 'The Week-End Library' in 1927\", and its colophon reads \"MADE AND PRINTED IN GREAT BRITAIN BY WILLIAM CLOWES AND SONS, LIMITED, LONDON AND BECCLES\". It is the 1927 London impression, not a 1909 New York one, and the copy carries a 1931 accession stamp of the Institute of Mediaeval Studies, Toronto. The printed page numbers the retrieving lane cites -- the canvassing sentence at p. 219 -- are this impression's."
