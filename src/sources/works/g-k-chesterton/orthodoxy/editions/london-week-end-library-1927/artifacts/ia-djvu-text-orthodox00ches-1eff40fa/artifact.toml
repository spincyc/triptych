rights_basis = "The volume was published at London in 1927, and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A could not reach it either: ninety-five years from 1927 ran out in 2022, so nothing remained to restore on 1 January 1996. The text reprinted in it was first published in 1908, and a mechanical reprint of a public-domain text originates no new copyright in that text; the impression adds no editorial matter, its only additions being the series title page and the impressions list. G. K. Chesterton died in 1936, so the work is also out of copyright in life-plus-seventy jurisdictions. THE GOOGLE QUESTION WAS DECIDED ON THESE BYTES. Probes run case-insensitively over the whole file with runs of non-alphanumeric characters collapsed, because this class of scan doubles its spaces: \"usage guidelines\" 0; \"about google book search\" 0; \"this is a digital copy\" 0; \"digitized by google\" 0; \"google book search\" 0. Google's front-matter block is absent and no notice, licence, reservation or condition of any kind appears in the file; the file's own scanning credit reads \"Digitized by the Internet Archive in 2011 with funding from University of Toronto\". A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it. NOT RELIED ON: that the item is available, that the download succeeded, or that any host marks the scan public domain."
