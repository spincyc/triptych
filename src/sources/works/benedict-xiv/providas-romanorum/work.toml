description = "Benedict XIV's constitution of 1751 confirming and renewing In eminenti and its excommunication. Gasparri's fontes to canon 2335 of the 1917 Code cite it as const. Providas, 18 mart. 1751; the notes printed with the Vatican English web text of Humanum genus give 'May 18, 1751'. This record preserves the witness disagreement over the day rather than resolving it. Catalog-level identity only: no complete textual witness has been inspected for this record; the papalencyclicals.net page for the work was found to be a stub containing no document text on 2026-07-25."
