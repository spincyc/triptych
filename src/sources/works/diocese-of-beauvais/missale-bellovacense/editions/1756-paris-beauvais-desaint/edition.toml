notes = "Title at offered image 9 identifies the 1756 Paris/Beauvais Fratres Desaint imprint with episcopal authority and chapter consent. Complete 830 offered Numelyo web-resolution JPEG images are acquired and retained in two 415-image parts; this is offered digital-sequence completeness, not physical-volume completeness. The complete episcopal mandate at images 11–14 is dated 19 April 1756. The mandate directs all churches, chapters, colleges, monasteries and orders of his diocese, and all priests who are bound by law or custom to celebrate or recite the Beauvais Office, to use this missal henceforth. The institutional list and qualified priest clause preserve the source syntax; uniform actual uptake is not established. Images 16–27 carry the calendar; image 267 opens Ordo Missae, printed p.193; image 303 opens Canon Missae, p.229; image 313, p.239, carries notated final Per omnia/Amen and Pater. Image 292, p.218, has notated preface text in the left column and the unnotated Advent preface in the right. These identify contents, not complete wording or collation. Provider sommaire labels do not always match printed pagination. BnF B-225 and Lyon SJ L 013/12 remain distinct uncollated copies; no exact predecessor or text inheritance is asserted."
