description = "An English bishop's narrative of his 1854 journey to Corps and the mountain of La Salette, written with access to the diocesan documents of the 1847 inquiry and reproducing them in English translation. It is a documentary carrier of first importance for this dossier: the depositions of Pierre Selme and Jean-Baptiste Pra signed 27 November 1847; the superioress of Corps's 1847 opinion of both children; the children's recital of the discourse printed in parallel French, local patois, and English columns; their interrogation answers about the secret, including the report that Melanie's was given in patois and Maximin's in French; the declaration of the mandement of 19 September 1851; and the 1850 Ars episode with Maximin's own reported answers. Openly favourable to La Salette and apologetic in argument; not a critical edition. Loci are printed page numbers of the 1854 imprint."
relations = ["work.diocese-of-grenoble.mandement-apparition-la-salette-1851"]
