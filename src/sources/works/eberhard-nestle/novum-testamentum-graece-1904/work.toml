composed_basis = "Nestle prepared this text for the British and Foreign Bible Society and it was published in 1904; the date is the editing and printing of the Greek text, not the date of any book of the New Testament, and not the date of the electronic tagging registered under it."
alternate_titles = ["Nestle 1904", "Novum Testamentum Graece (Nestle 1904)", "BFBS 1904 Greek New Testament"]
