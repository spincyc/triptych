description = "Eberhard Nestle's 1904 Greek New Testament, prepared for the British and Foreign Bible Society. It is the last Nestle text to have entered the public domain and is widely used where the current Nestle-Aland text may not be reproduced. It is neither Nestle-Aland 28 nor the SBL Greek New Testament, and its readings must not be attributed to either. A locus is book chapter:verse in the Greek versification, which differs from the Clementine Vulgate in several places."
