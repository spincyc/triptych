notes = "The acquired full periodical volume controls the serialization witness. The identified page is printed p. 163, digital leaf 173. Attribution is corroborated by Dickens's letter to Mrs. James T. Fields, Glasgow, 16 December 1868, naming Percy Fitzgerald as author in the separately acquired 1882 volume III of Dickens's letters. This segment establishes only the one inspected page, not the extent of the full serialization. Recipient metadata corrected on 2026-09-05 against the retained Dickens text, letter heading at physical lines 7716–7718 and attribution at 7797–7798; the bound journal page is unchanged."
