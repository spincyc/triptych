transformation = "Transcribe only the ten named Lasance Latin prayers; join printed line wraps; expand printed ae/oe ligatures to ae/oe; omit headings, English, rubrics, stress accents, and layout; use the repository's j orthography; and project only the controlling 1962 printing's non-substantive spelling, capitalization, punctuation, and standard conclusion expansion, subject to that j-orthography convention. Specifically: Cyril uses Genetricem/Genetrici and Per eundem rather than Lasance Genitricem/Genitrici and Per eumdem, with the Secret and Postcommunion conclusions expanded; Peter Canisius adopts the 1962 pointing while the normalized text retains ejus; Ephrem expands Per Dominum; John Eudes adopts the 1962 pointing and expanded Per eundem conclusion while the normalized text retains cujus; Sylvester adopts the 1962 pointing and capitalization and expands the Secret conclusion; Damasus omits Lasance's comma after Pontificem. No lexical petition, proper name, or other substantive wording is supplied from the later witness. Preserve the already hash-bound target line wrapping so the artifact ranges reproduce the restored calendar bodies byte for byte."
