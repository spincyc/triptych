notes = "Scope is closed at ten bodies. It excludes John Mary Vianney because Lasance reads beatum where 1962 reads sanctum; Cornelius and Cyprian because the named formula is a local application of a Common rather than an exact Lasance target; Albert the Great because its transformation/publication basis remains unresolved; and every structure-only or uncollated row. The unresolved Lasance whole-PDF artifact remains the visual witness; this focused normalized artifact is the independently distributable publication source."
