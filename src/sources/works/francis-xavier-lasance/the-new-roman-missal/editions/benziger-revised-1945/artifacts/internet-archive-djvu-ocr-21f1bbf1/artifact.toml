notes = "Internet Archive item fr-lasance-missal-1937, uploaded 2023-01-27 by a private uploader, collections catechismbooks and folkscanomy_religion. Its item metadata was retrieved the same day and records 1879 page images at 300 ppi, page_number_confidence 98.20, and an autonomous machine text layer produced by tesseract 5.3.0-1-gd3a4 with `-l lat+eng+Latin`; it carries NO licence, rights, publisher, creator or date field, and its title is the bare identifier. The uploaded scan is stamped 'http://ccwatershed.org' at the foot of every page, 1865 times in this file; no Corpus Christi Watershed copyright notice appears anywhere in the bytes. 199,051 LF-terminated lines, valid UTF-8, no CR bytes. The file name asserts 1937 and is wrong; see the edition record. Two observations that are recorded and NOT relied on: the plate copyright lines scattered through the file OCR mostly as 'Copyright, 1936, by Benziger Brothers' but one, at line 67061 under the Corpus Christi plate, OCRs as 'Copyright, 1956'. A single scanned digit is not a printing date and 3 misread as 5 is an ordinary tesseract error, so this does not close `[the_appendix_exclusion]`, which asks for a title page or copyright leaf from a physical copy. It is written down because it points the same way as the internal evidence and because the next reader should not have to find it again."
