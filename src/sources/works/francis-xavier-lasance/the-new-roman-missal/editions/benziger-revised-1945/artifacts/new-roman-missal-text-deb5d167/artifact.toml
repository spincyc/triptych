notes = "WHAT THIS IS: uncorrected optical character recognition of a whole hand missal, 198,099 LF-terminated lines, landed as a plain source artifact and nothing more. It is deliberately NOT structured as liturgical records. The prior lt-hist corpus divided the same text into eleven markdown 'sections' whose only structural claim was a line range over the downloaded file, so a comparison of two such sections compares the scanner's disagreements rather than the liturgy's; nothing of that shape is reproduced here. Addressability by identity -- this collect, of this Mass -- belongs to passage records with real loci bound to physical line ranges over these exact bytes, which this schema already supports and which requires reading the pages rather than slicing the file. Until such a passage exists, this artifact is a finding aid.\n\nWHAT SURVIVED THE APPENDIX EXCLUSION, STATED SO IT IS NOT DISCOVERED LATER. The excised pages are gone, but two references to them remain in the body because they are not on those pages: at line 109815-109816 the sanctoral gives '31 May - Feast of the Blessed Virgin Mary, Queen / Page 1298g', and at lines 198080-198094 the general index carries an 'Appendix' block naming the Queenship, St Isidore the Farmer, St Frances Xavier Cabrini and St Pius X. Both are post-1954 insertions into the body of this printing, so the recorded exclusion by page range is not a complete account of the printing's new matter. They are retained because they are feast titles and page numbers -- a pointer, not the appendix's expression -- and because deleting body text the exclusion does not name would put an undisclosed editorial hand into the bytes. A reader must not take them as dating evidence and must not reconstruct the appendix from them.\n\nOCR QUALITY. Measured here by scripts/_ocr_quality.py at a function-word share of en=0.24 and la=0.08 over 697,509 tokens, classified prose-english. The two figures must be read together and against a monolingual comparator: the book prints Latin and English in facing columns, so neither language can approach the 0.39-0.41 a keyed English text reaches, and their sum of 0.33 is the number that means the pages are prose. Individual lines are nonetheless corrupt in the ordinary ways -- 'Benriger' for Benziger at line 70, 'Missat' for Missal, running heads fused to body text -- and diacritics on the Latin survive unevenly. Quote from this artifact only through a checked passage, and do not rest a negative search on it: the raw-line modes establish absence of a string, not absence of a text.\n\nIDENTITY. A printing of about 1955-56 of the 1945 revised edition, not the 1937 first edition; see the edition record. The 'http://ccwatershed.org' stamp at the foot of every scanned page is present 1865 times and is the scan host's watermark, carrying no notice and no claim."
