rights_basis = "Public domain in the United States by failure to renew, on an affirmative record and on no other ground. The New Roman Missal was registered twice and neither registration was renewed in its twenty-eighth year: A 110108, copyright 15 July 1937, renewal window closed 15 July 1965; A 192159, copyright 1 November 1945, renewal window closed 1 November 1973. The finding was made at registration-number level across five bodies of the Copyright Office's published record and carries three positive controls drawn from the same OCR layer, so that the negative could be distinguished from a failed search; it is recorded in full, with its citations, its caveats and what would overturn it, at src/sources/inventories/lasance-new-roman-missal-rights-v1.toml. The 'Copyright, 1936, by Benziger Brothers' notice printed in the book is not disturbed and does not need to be: a notice establishes that a term began, and that record establishes that it ended. THE APPENDIX AT PRINTED PAGES 1298a-1298n IS NOT COVERED BY THAT BASIS AND IS NOT IN THESE BYTES. It is new matter first published after October 1954 under no registration found, dated only by inference, and it was removed by the transformation named below rather than carried across and disclaimed in prose. THE SCAN AND ITS TEXT LAYER ADD NOTHING FOR ANYONE TO OWN. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it: this text layer was produced autonomously by tesseract 5.3.0, and there is no author to hold a right in it. That is the same reasoning this repository already applies to the CMAA facsimile at guidance/missals.md:325-346, with the difference that there it stood alone and disposed only of a licence, while here the underlying work has an affirmative basis of its own and the scan argument completes the case instead of substituting for one. NOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, that the download succeeded, or that any host marks the scan public domain. guidance/sources.md:395-400 holds that availability and successful download are insufficient, the item in fact carries no licence field at all, and this basis would be unchanged if it carried one."
