notes = "Internet Archive item fr-lasance-missal-1937 is an opaque delivery locator supplied by a private uploader, not bibliographic evidence. Its name is wrong: the exact images show the Benziger 1945 revised edition in a printing of about 1955-56, as established and bounded in the edition record and the Lasance rights inventory. Do not describe this artifact as the 1937 edition or broaden it into a witness for a different edition. Artifact page N corresponds to Internet Archive BookReader leaf n(N-1); the passage records state the visible printed pagination, full IA leaf range, and full one-based artifact-page range independently. Every page image is stamped http://ccwatershed.org, but no host rights claim is relied on. Exact wording was read from rendered page images; the OCR artifacts remain finding aids only."
