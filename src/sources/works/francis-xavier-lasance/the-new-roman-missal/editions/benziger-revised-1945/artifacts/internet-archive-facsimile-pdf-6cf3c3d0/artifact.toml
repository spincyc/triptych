rights_basis = "MIXED, WHICH IS WHY THESE EXACT WHOLE-BOOK BYTES ARE NOT TRACKED OR REDISTRIBUTED. The underlying English of the 1937 and 1945 registered editions is in the United States public domain by failure to renew, established at registration-number level in src/sources/inventories/lasance-new-roman-missal-rights-v1.toml. This later printing also contains the appendix at printed pages 1298a-1298n, new matter first published after October 1954 for which that record establishes no registration, renewal result, or publication date from a physical copy. Other lettered insert matter, including printed pages 1302a-1302d, has likewise not been established as part of either registered edition. A single rights status cannot say public domain except for unresolved leaves, so this record is unresolved over the whole PDF. The independently registered tracked OCR derivative artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.new-roman-missal-text-80b34759 excludes pages 1298a-1298n and 1302a-1302d and carries the affirmative United States public-domain basis used for publication. The page images registered here are evidence for visual inspection and exact loci, not a redistribution source. Nothing rests on availability from, or any rights representation by, the Internet Archive."
