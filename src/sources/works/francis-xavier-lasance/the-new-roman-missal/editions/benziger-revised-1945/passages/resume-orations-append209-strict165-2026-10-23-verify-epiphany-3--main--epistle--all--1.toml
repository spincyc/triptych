notes = "Historical Latin comparison transcription: Fratres: Nolite esse prudentes apud vosmetipsos: nulli malum pro malo reddentes: providentes bona non tantum coram Deo, sed etiam coram omnibus hominibus. Si fieri potest, quod ex vobis est, cum omnibus hominibus pacem habentes: Non vosmetipsos defendentes, carissimi, sed date locum irae. Scriptum est enim: Mihi vindicta: ego retribuam, dicit Dominus. Sed si esurierit inimicus tuus, ciba illum: si sitit, potum da illi: hoc enim faciens, carbones ignis congeres super caput ejus. Noli vinci a malo, sed vince in bono malum. Complete checked English SHA256 6fac307f8320ea370075af1bd1c914c86c86aed974fcaf82e5e123794b4cf02d. Complete seed canonical Latin SHA256 010ba3a551b5b9231efb0f22727180102d6b030aa47ccc9defa423d544ccd2da. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-epiphany-3-epistle-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Strict entire historical and target Latin word sequences including actual ending agree under declared typography only. Typography normalizes case, stress accents, ae/oe ligatures, punctuation and layout only; no i/j or spelling substitutions. Source qualifications \"Full word sequence and appointed extent equal after declared case/stress/ligature/pointing transcription.\". One actual historical source inspection, not one per derived recipient."
