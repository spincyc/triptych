notes = "Historical Latin comparison transcription: Fratres: Mementote praepositorum vestrorum, qui vobis locuti sunt verbum Dei: quorum intuentes exitum conversationis imitamini fidem. Jesus Christus heri, et hodie: ipse et in saecula. Doctrinis variis et peregrinis nolite abduci. Optimum est enim gratia stabilire cor, non escis, quae non profuerunt ambulantibus in eis. Habemus altare, de quo edere non habent potestatem, qui tabernaculo deserviunt. Quorum enim animalium infertur sanguis pro peccato in Sancta per pontificem, horum corpora cremantur extra castra. Propter quod et Jesus, ut sanctificaret per suum sanguinem populum, extra portam passus est. Exeamus igitur ad eum extra castra, improperium ejus portantes. Non enim habemus hic manentem civitatem, sed futuram inquirimus. Per ipsum ergo offeramus hostiam laudis semper Deo, id est, fructum labiorum confitentium nomini ejus. Beneficentiae autem et communionis nolite oblivisci: talibus enim hostiis promeretur Deus. Obedite praepositis vestris, et subjacete eis. Ipsi enim pervigilant, quasi rationem pro animabus vestris reddituri. Complete checked English SHA256 93094ad8496153cc790d51c668d18d9e9d772c0f313d6cb6d03bf246494219c3. Complete seed canonical Latin SHA256 b62b6ef14ad7be35c6247159da9fcb761a764561a64700036caaa723bcc9a087. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-s-nicolai-episcopi-confessoris-epistle-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Strict entire historical and target Latin word sequences including actual ending agree under declared typography only. Typography normalizes case, stress accents, ae/oe ligatures, punctuation and layout only; no i/j or spelling substitutions. Source qualifications \"Complete source/target words and appointed terminal extent equal after declared stress/ligature/case/pointing transcription.\". One actual historical source inspection, not one per derived reci