", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-spellings-fetus-foetus\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-fourth-declension\"]}], \"orthography_differences\": [{\"source\": \"coelestium\", \"target\": \"caelestium\", \"source_word_index_zero_based\": 19, \"target_word_index_zero_based\": 19, \"contextual_parse\": {\"lexeme\": \"coelestis/caelestis\", \"part_of_speech\": \"adjective\", \"gender\": \"neuter\", \"number\": \"plural\", \"case\": \"genitive\"}, \"contextual_parse_evidence\": \"Both describe the same donorum in ... donorum semper participatione gaudere; the genitive plural adjective agrees with the same neuter genitive plural noun. Only the printed oe/ae spelling differs.\"}], \"source_latin_ending\": \"Per Dominum.\", \"target_latin_ending\": \"Per Dominum.\", \"literal_english_ending\": \"Through our Lord.\", \"source_english_expanded\": false, \"response_added\": false}. The existing canonical target retains tribue nobis; while the1962 image prints tribue nobis:. Its selected projection payload and current Latin proof agree at e1503f1b8200e8c1fa8237668c85918030b650159e67b159d63715b9d2f918b8; the old projection-passage prose note names a stale hash. This receiving assembly preserves both old records and exact target bytes; it does not claim a new diplomatic target transcription or a repaired Latin publication basis."
