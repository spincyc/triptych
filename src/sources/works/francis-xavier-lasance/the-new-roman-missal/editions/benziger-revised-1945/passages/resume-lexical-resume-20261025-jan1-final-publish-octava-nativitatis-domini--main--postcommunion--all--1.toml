ource_form\": \"eumdem\", \"target_form\": \"eundem\", \"source_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, agreeing with Dominum as the object of per\"}, \"target_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, agreeing with Dominum as the object of per\"}, \"contextual_parse_evidence\": \"Both actual endings explicitly print Per eumdem/eundem Dominum. Per governs the accusative, Dominum is masculine singular, and each token modifies that same noun. This is the same Lord mentioned through the Mother of God, not a genitive eiusdem or a change of person.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"parse_materialization_map_sha256\": \"530e299d08f936c059acab696bc7d038475f979d49622e669ccbb6b7f465b7ca\", \"map_entry_sha256\": \"584b992e1ca886166277718805ac2e0bc44b44d3b5152e206a044613051c20de\", \"root_approval_sha256\": \"37eb49a0536c1b13ca400b5aefed1a45a34867b0f1617d5914b1cd34a4fd7872\"}, \"source_word_index_zero_based\": 20, \"target_word_index_zero_based\": 20}], \"orthography_differences\": [{\"source_word_index_zero_based\": 12, \"target_word_index_zero_based\": 12, \"source\": \"genitrice\", \"target\": \"genetrice\", \"received_declaration_count\": 1, \"original_proof_value_sha256\": \"5c86407747dea70b3d709df379fdfee860dc3785177c68e3fdf8f7a32f0c931f\"}], \"orthography_raw_evidence_declarations\": 1, \"orthography_unique_word_changes\": 1, \"subroute\": \"same-witness-conclusion-table\", \"donor_fanout\": false, \"particular_prayer_person_proof\": \"The actual petition contains the direct invocation Domine / O Lord. Mary remains a third-person intercessor in intercedente beata Virgine Dei Genitrice Maria / by the intercession of the Blessed Virgin Mary, Mother of God; the petition contains no tuum/tuae/tibi or Thy/Thee. The actual source Per eumdem Dominum. / Through the same. identifies the same printed through-the-same family whose full table wording explicitly says Jesus Christ, Thy Son, Who liveth and reigneth with Thee. That table establishes address to the Father through the Son; its words are explanatory authority and are not inserted into the received English. The corrected target Per eundem ... Filium tuum: Qui tecum ... has that same address and family under the separately positioned accepted eumdem/eundem pair. The source English stays only Through the same.\"}. Literal historical English remains unexpanded; no official1962English or new source-recipient calendar attestation is asserted."
