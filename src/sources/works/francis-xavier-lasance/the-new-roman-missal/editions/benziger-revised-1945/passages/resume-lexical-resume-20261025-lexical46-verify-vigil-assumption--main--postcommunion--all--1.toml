notes = "Historical Latin comparison transcription: Concede, misericors Deus, fragilitati nostrae praesidium: ut, qui sanctae Dei Genitricis festivitatem praevenimus: intercessionis ejus auxilio, a nostris iniquitatibus resurgamus. Per eumdem Dominum. Complete checked English SHA256 9e091bd25dab165f34ee5d388152bb055856edf060fa573c5e7315b7aa355ca4. Complete canonical Latin SHA256 7e2eced416486fc392b0bebaffaea3c3fd78addc9bef8cbcd314bb15c70e9c34. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-vigil-assumption-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, modifying Dominum as object of per\"}, \"contextual_parse_evidence\": \"Both complete actual endings explicitly say Per eumdem/eundem Dominum (or the immediately abbreviated Per eumdem); Dominum is masculine accusative singular governed by per. The same Lord referred to in the petition is the Son; no genitive eiusdem is conflated.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"1ac890f989e0144d52aae6f59de4c6a7d75f078d298cfed6d169561109d90b0c\", \"original_proof_pointer\": \"/14/exact_lexical_spelling_differences/0\", \"original_proof_value_sha256\": \"6a0644f7d8c7da90873940cb45d8266bfc3ced34a2130811fcd6afb038da1dca\", \"original_parse_proof_pointer\": \"/14/exact_lexical_spelling_differences/0\", \"original_parse_proof_value_sha256\": \"6a0644f7d8c7da9