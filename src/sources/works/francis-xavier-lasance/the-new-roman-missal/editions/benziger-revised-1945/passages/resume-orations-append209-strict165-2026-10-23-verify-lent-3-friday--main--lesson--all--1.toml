notes = "Historical Latin comparison transcription: In diebus illis: Convenerunt filii Israel adversum Moysen et Aaron: et versi in seditionem, dixerunt: Date nobis aquam, ut bibamus. Ingressusque Moyses et Aaron, dimissa multitudine, tabernaculum foederis, corruerunt proni in terram, clamaveruntque ad Dominum, atque dixerunt: Domine Deus, audi clamorem hujus populi, et aperi eis thesaurum tuum, fontem aquae vivae, ut satiati, cesset murmuratio eorum. Et apparuit gloria Domini super eos. Locutusque est Dominus ad Moysen, dicens: Tolle virgam, et congrega populum, tu et Aaron frater tuus, et loquimini ad petram coram eis, et illa dabit aquas. Cumque eduxeris aquam de petra, bibet omnis multitudo et jumenta ejus. Tulit igitur Moyses virgam, quae erat in conspectu Domini, sicut praeceperat ei, congregata multitudine ante petram dixitque eis: Audite, rebelles et increduli: Num de petra hac vobis aquam poterimus ejicere? Cumque elevasset Moyses manum, percutiens virga bis silicem, egressae sunt aquae largissimae, ita ut populus biberet, et jumenta. Dixitque Dominus ad Moysen et Aaron: Quia non credidistis mihi, ut sanctificaretis me coram filiis Israel, non introducetis hos populos in terram, quam dabo eis. Haec est aqua contradictionis, ubi jurgati sunt filii Israel contra Dominum, et sanctificatus est in eis. Complete checked English SHA256 59af17d203ad1745dfc7d2d2d02efbc4daeb0f919d6047df779164ac9a7157f2. Complete seed canonical Latin SHA256 111843299f69747b9bce31c7acfc2930000021bbcdcaa7e251b4dd1a68305ab7. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-lent-3-friday-lesson-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Strict entire historical and target Latin word sequences including actual ending agree under declared typography only. Typography normalizes case, stress accents, ae/oe ligatures, punctuation and layout only; no i/j or spelling substitutions. Source qu