notes = "Historical Latin comparison transcription: Deus, qui fidei sacramenta, in Unigeniti tui gloriosa Transfiguratione, patrum testimonio roborasti, et adoptionem filiorum perfectam, voce delapsa in nube lucida, mirabiliter praesignasti: concede propitius; ut ipsius Regis gloriae nos coheredes efficias, et ejusdem gloriae tribuas esse consortes. Per eumdem Dominum. Complete checked English SHA256 450e79eb6b20305fa59ca2095778ca02cf5815ad5cdc253c5c1e502b65ed262b. Complete canonical Latin SHA256 17a39c85ea9d13a7bf72b7f12d7c8f3d03f42a29592548ce5fb6ced453a3a1c0. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-transfiguratione-domini-nostri-iesu-christi-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, modifying Dominum as object of per\"}, \"contextual_parse_evidence\": \"Both complete actual endings explicitly say Per eumdem/eundem Dominum (or the immediately abbreviated Per eumdem); Dominum is masculine accusative singular governed by per. The same Lord referred to in the petition is the Son; no genitive eiusdem is conflated.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"1ac890f989e0144d52aae6f59de4c6a7d75f078d298cfed6d169561109d90b0c\", \"original_proof_pointer\": \"/12/exact_lexical_spelling_differences/0\", \"original_proof_value_sha256\": \"a4f48d588576f4e8346f3e9dd528f1079c485d59bf62b716b55989fb6