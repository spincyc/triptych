notes = "Historical Latin comparison transcription: Deus, qui hodierna die Unigenitum tuum gentibus stella duce revelasti: concede propitius; ut, qui jam te ex fide cognovimus, usque ad contemplandam speciem tuae celsitudinis perducamur. Per eumdem Dominum. Complete checked English SHA256 c1f055940db671688ec8a0be704d5c8150076ead7e5bee1728ff8643c5c88832. Complete canonical Latin SHA256 4a3f6c7bc60cea967f7e201ac4265b91fbe061f3fd16487cb991269e0bc9d062. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-epiphania-domini-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, modifying Dominum as object of per\"}, \"contextual_parse_evidence\": \"Both complete actual endings explicitly say Per eumdem/eundem Dominum (or the immediately abbreviated Per eumdem); Dominum is masculine accusative singular governed by per. The same Lord referred to in the petition is the Son; no genitive eiusdem is conflated.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"1ac890f989e0144d52aae6f59de4c6a7d75f078d298cfed6d169561109d90b0c\", \"original_proof_pointer\": \"/1/exact_lexical_spelling_differences/0\", \"original_proof_value_sha256\": \"00d40dc37cd6664121e6d5fbcc4e23a6fa186e72b844636378c948441089f40a\", \"original_parse_proof_pointer\": \"/1/exact_lexical_spelling_differences/0\", \"original_parse_proof_value_sha256\": \"00d40dc37cd