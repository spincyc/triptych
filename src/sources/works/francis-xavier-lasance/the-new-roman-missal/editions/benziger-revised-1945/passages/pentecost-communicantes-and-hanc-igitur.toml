context = "After the Preface of Pentecost the book prints the proper Communicantes whole, Latin and English, under a rubric saying it is not said after the octave, and then, under a rubric for Pentecost week, the proper Hanc igitur, Latin and English, returning the reader to the Canon at the Quam oblationem."
verified_on = "2026-10-19"
notes = "Read on the rendered page images at 300 ppi after hashing the PDF against its registered digest. Hanc igitur: the English renders every clause of the 1962 Latin of n. 1099 and adds none, and is bound for the Easter and Pentecost Hanc igitur (artifact hanc-igitur-easter-pentecost-checked-english). Communicantes: the English is NOT bound. It renders the Virgin as mother of 'the same' Lord, a word the Pentecost Latin of this book and of the 1962 does not print, so under the 2026-09-03 words rule it is a variant; and like every public-domain English the repository holds it has no clause naming Saint Joseph. This book's own facing Latin also departs from the 1962 at one word of the continuation ('et' for 'ac' before Martyrum) and misprints 'sacratissimun'; it is not used for the Latin. Both pages are ordinary numbered pages outside the excluded inserts."
