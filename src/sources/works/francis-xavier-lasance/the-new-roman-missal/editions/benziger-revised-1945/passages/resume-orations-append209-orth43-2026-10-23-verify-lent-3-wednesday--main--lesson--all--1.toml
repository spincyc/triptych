notes = "Historical Latin comparison transcription: Haec dicit Dominus Deus: Honora patrem tuum et matrem tuam, ut sis longaevus super terram, quam Dominus Deus tuus dabit tibi. Non occides. Non moechaberis. Non furtum facies. Non loqueris contra proximum tuum falsum testimonium. Non concupisces domum proximi tui: nec desiderabis uxorem ejus, non servum, non ancillam, non bovem, non asinum, nec omnia, quae illius sunt. Cunctus autem populus videbat voces, et lampades, et sonitum buccinae, montemque fumantem: et perterriti ac pavore concussi, steterunt procul, dicentes Moysi: Loquere tu nobis, et audiemus: non loquatur nobis Dominus, ne forte moriamur. Et ait Moyses ad populum: Nolite timere: ut enim probaret vos, venit Deus, et ut terror illius esset in vobis, et non peccaretis. Stetitque populus de longe, Moyses autem accessit ad caliginem, in qua erat Deus. Dixit praeterea Dominus ad Moysen: Haec dices filiis Israel: Vos vidistis, quod de coelo locutus sim vobis. Non facietis deos argenteos, nec deos aureos facietis vobis. Altare de terra facietis mihi, et offeretis super eo holocausta et pacifica vestra, oves vestras, et boves in omni loco, in quo memoria fuerit nominis mei. Complete checked English SHA256 477f8ebdca364556f5ee096f014b77e71008b1761308f179585af09293abff0c. Complete seed canonical Latin SHA256 5452e7f8d1ab7be215c8a1b71cde7b914433b4acabd5e3e057fa0b5aa6328efc. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-lent-3-wednesday-lesson-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Own-appointment complete-word/actual-ending equality after exactly the recorded spelling substitutions [{\"source_word_1_based\": 140, \"target_word_1_based\": 140, \"source\": \"coelo\", \"target\": \"caelo\", \"rule\": \"declared-coel-cael\"}]. Source/target/English bytes unchanged. Dated own-appointment method, 2026-10-23: base typography treats case, stress, ae/oe ligatures