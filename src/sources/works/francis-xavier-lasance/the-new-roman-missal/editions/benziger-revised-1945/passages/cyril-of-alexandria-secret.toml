notes = "Both complete images were rendered and read from exact artifact pp. 913-914, corresponding to the full IA BookReader range n912-n913 and visible printed pp. 914-915. The facing Latin is the 1962 slot's prayer apart from pointing and an abbreviated conclusion. This passage records both leaves rather than silently treating the starting leaf as the whole prayer. It establishes the historical wording and locus, while the independently tracked appendix-excluded OCR derivative carries the United States public-domain basis."
