notes = "Historical Latin comparison transcription: Haec dicit Dominus Deus: Clama, ne cesses: quasi tuba exalta vocem tuam: et annuntia populo meo scelera eorum, et domui Jacob peccata eorum. Me etenim de die in diem quaerunt, et scire vias meas volunt: quasi gens, quae justitiam fecerit, et judicium Dei sui non dereliquerit: rogant me judicia justitiae: appropinquare Deo volunt. Quare jejunavimus, et non aspexisti: humiliavimus animas nostras, et nescisti? Ecce in die jejunii vestri invenitur voluntas vestra, et omnes debitores vestros repetitis. Ecce ad lites, et contentiones jejunatis, et percutitis pugno impie. Nolite jejunare sicut usque ad hanc diem, ut audiatur in excelso clamor vester. Numquid tale est jejunium, quod elegi, per diem affligere hominem animam suam? numquid contorquere quasi circulum caput suum, et saccum et cinerem sternere? numquid istud vocabis jejunium, et diem acceptabilem Domino? Nonne hoc est magis jejunium, quod elegi? dissolve colligationes impietatis, solve fasciculos deprimentes: dimitte eos, qui confracti sunt, liberos, et omne onus dirumpe. Frange esurienti panem tuum, et egenos, vagosque induc in domum tuam: cum videris nudum, operi eum, et carnem tuam ne despexeris. Tunc erumpet quasi mane lumen tuum, et sanitas tua citius orietur, et anteibit faciem tuam justitia tua, et gloria Domini colliget te. Tunc invocabis, et Dominus exaudiet: clamabis, et dicet: Ecce adsum. Quia misericors sum, Dominus Deus tuus. Complete checked English SHA256 d78968436d65c3edff9cdcda478885f514f9d8917931ce64498d4165f4bad696. Complete seed canonical Latin SHA256 56857341f26a570aa09809161129f89970d514e246d3bb6d0cb66024f60b0c43. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-friday-after-ash-wednesday-lesson-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Strict entire historical and target Latin word sequences including actual ending agree under declare