notes = "Historical Latin comparison transcription: Deus, qui beatum Petrum Confessorem tuum admirabilis poenitentiae et altissimae contemplationis munere illustrare dignatus es: da nobis, quaesumus; ut, ejus suffragantibus meritis, carne mortificati, facilius coelestia capiamus. Per Dominum. Complete checked English SHA256 5f9ae2bcb27bbb92dada0d0fc44208f7c8e9a04e57e3e73b8df43714e9f4fbb1. Complete canonical Latin SHA256 a81c1921269774b26c1c0f25ced4e4304cda0b98e555a017bcc6d66ab0de9c6d. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-s-petri-alcantara-confessoris-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"poenitentiae\", \"target\": \"paenitentiae\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"paenitentia/poenitentia\", \"gender\": \"feminine\", \"case\": \"genitive\", \"number\": \"singular\", \"part_of_speech\": \"noun\", \"reviewed_parse_text\": \"feminine genitive singular noun, paenitentia/poenitentia\"}, \"contextual_parse_evidence\": \"The coordinated genitives admirabilis poenitentiae and altissimae contemplationis depend on ablative-singular munere: by the gift of wonderful penance and lofty contemplation. Admirabilis modifies the singular noun poenitentiae and parallels feminine-genitive-singular contemplationis with altissimae. This determines genitive singular in both full contexts; neither a dative nor a nominative plural is selected. The received English explicitly couples a wonderful spirit of penance and most lofty contemplation.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-spellings-paenitentia-poenitentia\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-first-declension\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"49b9ae2aecc0b0187fb2cdb19987ba9de4498ae43b4f6e50f119084c57e11d68\", \"original_proof_pointer\": \"/1/lexical_substitutions/0\", \"original_proof_value_sha256\": \"3faec26f6aeb9f961bb5c3a03646a19d5328944797e29924d890e2eb266502cd\", \"original_parse_proof_pointer\": \"/1/lexical_substitutions/0/source_and_target_parse\", \"original_parse_proof_value_sha256\": \"b91c09244bd1504514205ea6f8ce037a04bf39dad54dbde1c4eec20767b8c149\", \"source_form\": \"poenitentiae\", \"target_form\": \"paenitentiae\", \"source_parse\": {\"lexeme\": \"paenitentia/poenitentia\", \"gender\": \"feminine\", \"case\": \"genitive\", \"number\": \"singular\", \"part_of_speech\": \"noun\", \"reviewed_parse_text\": \"feminine genitive singular noun, paenitentia/poenitentia\"}, \"target_parse\": {\"lexeme\": \"paenitentia/poenitentia\", \"gender\": \"feminine\", \"case\": \"genitive\", \"number\": \"singular\", \"part_of_speech\": \"noun\", \"reviewed_parse_text\": \"feminine genitive singular noun, paenitentia/poenitentia\"}, \"contextual_parse_evidence\": \"The coordinated genitives admirabilis poenitentiae and altissimae contemplationis depend on ablative-singular munere: by the gift of wonderful penance and lofty contemplation. Admirabilis modifies the singular noun poenitentiae and parallels feminine-genitive-singular contemplationis with altissimae. This determines genitive singular in both full contexts; neither a dative nor a nominative plural is selected. The received English explicitly couples a wonderful spirit of penance and most lofty contemplation.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-spellings-paenitentia-poenitentia\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-first-declension\"], \"parse_materialization_map_sha256\": \"5036c1760cd1d557be7b60d52b0dc60d636830a6fa5b8ad5592554766025e292\", \"map_entry_sha256\": \"8bae135b2698c32a9cd36f43a3