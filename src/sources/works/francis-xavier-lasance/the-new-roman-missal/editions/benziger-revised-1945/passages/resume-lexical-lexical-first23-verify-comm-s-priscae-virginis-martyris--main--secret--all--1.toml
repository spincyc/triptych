 not a feminine nominative form or an arbitrary adjective.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-spellings-natalicius-natalitius\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-second-declension-neuter\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-adjective-declension\"], \"source_word_index_zero_based\": 7, \"target_word_index_zero_based\": 7}], \"orthography_differences\": [], \"subroute\": \"same-witness-conclusion-table\", \"donor_fanout\": false}. Comparison-only substitutions never alter source Latin, target Latin or received English. Historical earlier mismatches/refusals remain recorded; no unlisted spellings, words, names, options or inferred conclusion."
