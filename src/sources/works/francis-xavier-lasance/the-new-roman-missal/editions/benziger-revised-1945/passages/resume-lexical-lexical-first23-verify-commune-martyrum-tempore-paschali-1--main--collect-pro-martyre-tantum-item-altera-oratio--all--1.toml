notes = "Historical Latin comparison transcription: Praesta, quaesumus, omnipotens Deus: ut qui beati N. Martyris tui natalitia colimus, intercessione ejus in tui nominis amore roboremur. Per Dominum. Complete checked English SHA256 371697de24b9ff7b2641c3c636a27a627ca657ad2098034c190c07e3b10a76c2. Complete canonical Latin SHA256 20c9af3a72d7ffb4ae746c3a2c52962c3b2e9dfb33a308431eaee3cd52646001. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-commune-martyrum-tempore-paschali-1-orations retained. Complete petitions agree after only exact recorded pairs; actual Latin conclusions are prefixes of the same own-book family through-our-lord, with person God the Father. Source rule passage.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-verify; tracked formula artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-7dbb4a25. Target response tokens [] remain separate and are not added to English. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"natalitia\", \"target\": \"natalicia\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"natalitium/natalicium, substantive birthday celebration\", \"gender\": \"neuter\", \"number\": \"plural\", \"case\": \"accusative\", \"function\": \"direct object of colimus\", \"part_of_speech\": \"substantive noun\", \"part_of_speech_basis\": \"Original reviewed lexeme explicitly says substantive; its particular nominative or accusative function remains unchanged.\"}, \"contextual_parse_evidence\": \"Both complete contexts govern natalitia/natalicia with colimus. The transitive verb or observing participle requires its object in the accusative; the saint-name/saints modifier is genitive. Thus this is the neuter accusative plural substantive, not a feminine nominative form or an arbitrary adjective.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-spellings-natalicius-natalitius\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-second-declension-neuter\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-adjective-declension\"], \"source_word_index_zero_based\": 10, \"target_word_index_zero_based\": 10}], \"orthography_differences\": [], \"subroute\": \"same-witness-conclusion-table\", \"donor_fanout\": false}. Comparison-only substitutions never alter source Latin, target Latin or received English. Historical earlier mismatches/refusals remain recorded; no unlisted spellings, words, names, options or inferred conclusion."
