notes = "Historical Latin comparison transcription: Deus, qui de beatae Mariae Virginis utero Verbum tuum, Angelo nuntiante, carnem suscipere voluisti: praesta supplicibus tuis; ut, qui vere eam Genitricem Dei credimus, ejus apud te intercessionibus adjuvemur. Per eumdem Dominum. Complete checked English SHA256 719f7c042e33454da65496d80de752837e4b62bd1c8ee32cbd2871ebb56cc20a. Complete canonical Latin SHA256 4f39aa21ec6962ed5a99bfd22f4cdd7c472deb243c54c9e21c8c331fccbc009b. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-missa-de-s-maria-in-sabbato-1-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"number\": \"singular\", \"case\": \"accusative\", \"function\": \"agrees with Dominum governed by Per\", \"part_of_speech\": \"demonstrative pronoun/adjective\", \"part_of_speech_basis\": \"Exact independently verified idem paradigm and reviewed same masculine accusative singular contextual parse. This includes the separately reviewed Louis anaphoric petition object, not only concluding modifiers.\"}, \"contextual_parse_evidence\": \"Both actual endings have Per eumdem/eundem Dominum; Per governs accusative, and Dominum is masculine singular. The pronoun refers to the same Son named as Verbum tuum or Christi Filii tui in the complete petition. It is neither genitive eiusdem nor a mixed formula.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"source_word_index_zero_based\": 30, \"target_word_index_zero_based\": 30}], \"orthography_differences\": [{\"source_word_index_zero_based\": 21, \"target_word_index_zero_based\": 21, \"source\": \"genitricem\", \"target\": \"genetricem\"}], \"subroute\": \"strict\", \"donor_fanout\": false}. Comparison-only substitutions never alter source Latin, target Latin or received English. Historical earlier mismatches/refusals remain recorded; no unlisted spellings, words, names, options or inferred conclusion."
