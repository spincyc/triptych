notes = "Genuine Phase3 page-image inspection on 2026-10-22, recorded once for this prayer, not once per recipient. Source raster read at 150 dpi; paired complete Latin and English and actual endings read. Historical Latin transcription (layout reflowed): Súscipe, quæsumus, Dómine, preces pópuli tui, cum oblatiónibus hostiárum: ut paschálibus initiáta mystériis, ad æternitátis nobis medélam, te operánte, profíciant. Per Dóminum. Source Latin ending: Per Dominum. Target Latin ending: Per Dominum. English ending: Through our Lord. Historical Latin word sequence, including its conclusion, matches the canonical seed after only case, stress-accent, ae/oe-ligature and punctuation/layout normalization. Exact checked English field SHA256 (no terminal LF) c7c74e3316775d206cb470614af0864ef8daa6af0c9b3c4a2540811a90a057f1. Canonical seed easter-sunday/main/Secret/all/1, complete Latin SHA256 dce82177ab5f5f17769452580b48615019f12d028f9ac618787fb4f546f62980. Fresh target page-image seed check at 165 dpi: passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-easter-sunday-orations, printed p. 330, no. 1148; artifact PDF p. 411, artifact SHA256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a. The existing Roman Latin verification record retains its ownership and bytes; this record owns only the new English source inspection. Join print wraps/division hyphens and render initial small caps as sentence case; no wording, name, conclusion or Amen is supplied. Ordinary numbered page outside both excluded inserts; existing US public-domain expression basis retained. The source is the older Holy Saturday order; this inspection does not assert a whole-formulary match to 1962 Holy Saturday. Independent cold source review remains required; no independent acceptance is claimed."
