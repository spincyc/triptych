notes = "Historical Latin comparison transcription: Munera nostra, Domine, apud clementiam tuam Dei Genitricis commendet oratio: quam idcirco de praesenti saeculo transtulisti; ut pro peccatis nostris apud te fiducialiter intercedat. Per eumdem Dominum. Complete checked English SHA256 e67bad1af10f0208660fb6ac0a4acbb2b02c7f8631665acda60e64a7cdd65a73. Complete canonical Latin SHA256 840f408adc48651dfca76b8a27f9aadf233f23c21509025d33282729fd467aa2. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-vigil-assumption-orations retained. Complete petitions agree after only exact recorded pairs; actual Latin conclusions are prefixes of the same own-book family through-the-same, with person Prayer making mention of our Blessed Lord. Source rule passage.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-verify; tracked formula artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-7dbb4a25. Target response tokens [] remain separate and are not added to English. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, modifying Dominum as object of per\"}, \"contextual_parse_evidence\": \"Both complete actual endings explicitly say Per eumdem/eundem Dominum (or the immediately abbreviated Per eumdem); Dominum is masculine accusative singular governed by per. The same Lord referred to in the petition is the Son; no genitive eiusdem is conflated.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"