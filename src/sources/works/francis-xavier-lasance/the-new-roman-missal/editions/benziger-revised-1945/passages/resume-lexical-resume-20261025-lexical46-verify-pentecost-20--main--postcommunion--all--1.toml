notes = "Historical Latin comparison transcription: Ut sacris, Domine, reddamur digni muneribus: fac nos, quaesumus, tuis semper obedire mandatis. Per Dominum. Complete checked English SHA256 f940666f53d3ebb0a7af677988471c647c730e8e2049d19f3c8a4ce5cc3d557a. Complete canonical Latin SHA256 76533c5879f838e218a947f66800c14748f888bcf7bdda0b2b6fe3fcfe859967. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-pentecost-20-orations retained. Complete petitions agree after only exact recorded pairs; actual Latin conclusions are prefixes of the same own-book family through-our-lord, with person God the Father. Source rule passage.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-verify; tracked formula artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-7dbb4a25. Target response tokens [] remain separate and are not added to English. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"obedire\", \"target\": \"oboedire\", \"method_id\": \"own-appointment-lexical-supplement-six-exact-pairs-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"oboedio / obedio\", \"part_of_speech\": \"verb\", \"conjugation\": \"fourth\", \"tense\": \"present\", \"voice\": \"active\", \"mood\": \"infinitive\", \"gender\": null, \"number\": null, \"case\": null}, \"contextual_parse_evidence\": \"Fac nos ... tuis semper obedire/oboedire mandatis selects the active infinitive: nos is its accusative subject; tuis mandatis is its dative complement; semper modifies obedience. This is neither a passive imperative nor a passive infinitive. The preceding ut sacris ... reddamur digni muneribus clause has the same purpose and wording in both complete prayers. L&S prefers oboedio over obedio; that preference is retained.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-supplement-v2-obedio-oboedio\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-supplement-v2-fourth-conjugation-infinitive\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"47afc75e148454b1d6b72a80b4cb248dc22161a2d5e824e1eb8f5d195a4155bb\", \"original_proof_pointer\": \"/2/lexical_comparison\", \"original_proof_value_sha256\": \"d2919d66783310e3b2a3b7811f4b2180798460b0d35094f99713305e43710047\", \"original_parse_proof_pointer\": \"/2/lexical_comparison\", \"original_parse_proof_value_sha256\": \"d2919d66783310e3b2a3b7811f4b2180798460b0d35094f99713305e43710047\", \"source_form\": \"obedire\", \"target_form\": \"oboedire\", \"source_parse\": {\"lexeme\": \"oboedio / obedio\", \"part_of_speech\": \"verb\", \"conjugation\": \"fourth\", \"tense\": \"present\", \"voice\": \"active\", \"mood\": \"infinitive\", \"gender\": null, \"number\": null, \"case\": null}, \"target_parse\": {\"lexeme\": \"oboedio / obedio\", \"part_of_speech\": \"verb\", \"conjugation\": \"fourth\", \"tense\": \"present\", \"voice\": \"active\", \"mood\": \"infinitive\", \"gender\": null, \"number\": null, \"case\": null}, \"contextual_parse_evidence\": \"Fac nos ... tuis semper obedire/oboedire mandatis selects the active infinitive: nos is its accusative subject; tuis mandatis is its dative complement; semper modifies obedience. This is neither a passive imperative nor a passive infinitive. The preceding ut sacris ... reddamur digni muneribus clause has the same purpose and wording in both complete prayers. L&S prefers oboedio over obedio; that preference is retained.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-supplement-v2-obedio-oboedio\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-supplement-v2-fourth-conjugation-infinitive\"], \"parse_materialization_map_sha256\": \"5036c1760cd1d557be7b60d52b0dc60d636830a6fa5b8ad5592554766025e292\", \"map_entry_sha256\": \"ca6