# Exact checked English cells of the controlling TSV rows, for prose Source Reader display.
text = "IT IS truly meet and just, right and profitable for us, at all times, and in all places, to give thanks to Thee, O holy Lord, Father almighty, eternal God: through Christ, our Lord, in Whom the hope of a happy resurrection has shone on us, so that those whom the certain fate of dying renders sad, may be consoled by the promise of future immortality. For with regard to Thy faithful, O Lord, life is changed, not taken away; and the house of their earthly dwelling being destroyed, an eternal dwelling in heaven is obtained. So with the angels and archangels, with the dominions and powers, with all the hosts of the heavenly army, we sing of Thy glory without end, saying:"
