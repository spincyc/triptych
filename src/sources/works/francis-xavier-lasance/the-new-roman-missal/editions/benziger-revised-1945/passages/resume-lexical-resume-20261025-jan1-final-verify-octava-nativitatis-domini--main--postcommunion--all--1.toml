notes = "Historical Latin comparison transcription: Haec nos communio, Domine, purget a crimine: et intercedente beata Virgine Dei Genitrice Maria, caelestis remedii faciat esse consortes. Per eumdem Dominum. Complete checked English SHA256 dfe2944c54c45e79f0e4d5ec2060ef811b013c4ce2d49529153c3334ca03e8f5. Complete canonical Latin SHA256 9fefc62baab9a5c336bae60a00bc065deca16a01ca41b14c0f92cf0841ae7b49. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.next-leads-3-octava-nativitatis-domini-postcommunion-20261023 retained. Complete petitions agree after only exact recorded pairs; actual Latin conclusions are prefixes of the same own-book family through-the-same, with person Prayer making mention of our Blessed Lord. Source rule passage.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-verify; tracked formula artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.resume-orations-conclusion-table-2026-10-23-7dbb4a25. Target response tokens [] remain separate and are not added to English. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, agreeing with Dominum as the object of per\"}, \"contextual_parse_evidence\": \"Both actual endings explicitly print Per eumdem/eundem Dominum. Per governs the accusative, Dominum is masculine singular, and each token modifies that same noun. This is the same Lord mentioned through the Mother of God, not a genitive eiusdem or a change of person.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"13a6cee88396c27b075706c87b7d25114d6a7945cbfdac28c7090463d7ad6b12\", \"original_proof_pointer\": \"/5/exact_lexical_spelling_differences/0\", \"original_proof_value_sha256\": \"5cfd7e21e203182d2e2caad8d294443b051309a130423c4fb6c8a53c0e089512\", \"original_parse_proof_pointer\": \"/5/exact_lexical_spelling_differences/0\", \"original_parse_proof_value_sha256\": \"5cfd7e21e203182d2e2caad8d294443b051309a130423c4fb6c8a53c0e089512\", \"source_form\": \"eumdem\", \"target_form\": \"eundem\", \"source_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, agreeing with Dominum as the object of per\"}, \"target_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, agreeing with Dominum as the object of per\"}, \"contextual_parse_evidence\": \"Both actual endings explicitly print Per eumdem/eundem Dominum. Per governs the accusative, Dominum is masculine singular, and each token modifies that same noun. This is the same Lord mentioned through the Mother of God, not a genitive eiusdem or a change of person.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"parse_materialization_map_sha256\": \"530e299d08f936c059acab696bc7d038475f979d49622e669ccbb6b7f465b7ca\", \"map_entry_sha256\": \"584b992e1ca886166277718805ac2e0bc44b44d3b5152e206a044613051c20de\", \"root_approval_sha256\": \"37eb49a0536c1b13ca400b5aefed1a45a34867b0f1617d5914b1cd34a4fd7872\"}, \"source_word_index_zero_based\": 20, \"target_word_index_zero_based\": 20}], \"orthography_differences\": [{\"source_word_index_zero_based\": 12, \"target_word_index_zero_based\": 12, \"source\": \"genitrice\", \"target\": \"genetrice\", \"received_declaration_count\": 1, \"original_proof_value_sha256\": \"5c86407747dea70b3d709df379fdfee860dc3785177c68e3fdf8f7a32f0c931f\"}], \"orthography_raw_evidence_declarations\": 1, \"orthography_unique_word_changes\": 1, \"subroute\": \"same-witness-conclusion-table\", \"donor_fanout\": false, \"particular_prayer_person_proof\": \"The actual petition contains the direct invocation Domine / O Lord. Mary remains a third-person intercessor in intercedente beata Virgine Dei Genitrice Maria / by the intercession of the Blessed Virgin Mary, Mother of God; the petition contains no tuum/tuae/tibi or Thy/Thee. The actual source Per eumdem Dominum. / Through the same. identifies the same printed through-the-same family whose full table wording explicitly says Jesus Christ, Thy Son, Who liveth and reigneth with Thee. That table establishes address to the Father through the Son; its words are explanatory authority and are not inserted into the received English. The corrected target Per eundem ... Filium tuum: Qui tecum ... has that same address and family under the separately positioned accepted eumdem/eundem pair. The source English stays only Through the same.\"}. Comparison-only substitutions never alter source Latin, target Latin or received English. Historical earlier mismatches/refusals remain recorded; no unlisted spellings, words, names, options or inferred conclusion."
