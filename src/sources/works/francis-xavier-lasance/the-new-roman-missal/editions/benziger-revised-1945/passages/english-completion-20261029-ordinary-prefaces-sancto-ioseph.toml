notes = "The English was directly read from the exact images and independently checked; retains literal source wording and punctuation. Bounded comparison with the 1962 typical edition n. 1084, printed p. 295, CMAA artifact PDF p. 376 (registered artifact SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) identifies the corresponding Preface, not an approved English witness. No exact-target English grade or target ritual applicability is inferred. Source Latin and English print Festivitate/Veneratione and festivity (veneration); target also has solemnitate for May 1, absent from this historical English. Preserve the source alternatives and restrict any use accordingly. The explanatory eternal Father phrase is the source human translation, not supplied wording."

# Exact checked English cells of the controlling TSV rows, for prose Source Reader display.
text = "IT IS truly meet and just, right and profitable for us, at all times, and in all places, to give thanks to Thee, O holy Lord, Father almighty, eternal God, and on the festivity (veneration) of St. Joseph to magnify Thee with due praise, to bless and proclaim Thee. The just man who was given by Thee as a spouse to the Virgin Mother of God, and was placed over Thy Family as a faithful and prudent servant; so that taking the place of the eternal Father, he might guard the only-begotten Son conceived by the shadow of the Holy Ghost, Jesus Christ, Our Lord, through Whom the angels praise Thy majesty, the dominions worship it, the powers are in awe, the heavens and the heavenly hosts and the blessed seraphim join together in celebrating their joy. With these, we pray Thee, join our own voices also, while we sing with lowly praise:"
