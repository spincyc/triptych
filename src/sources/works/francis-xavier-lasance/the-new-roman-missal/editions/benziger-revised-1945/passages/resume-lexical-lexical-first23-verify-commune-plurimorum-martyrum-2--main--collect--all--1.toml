: 10}], \"orthography_differences\": [], \"subroute\": \"strict\", \"donor_fanout\": false}. Comparison-only substitutions never alter source Latin, target Latin or received English. Historical earlier mismatches/refusals remain recorded; no unlisted spellings, words, names, options or inferred conclusion."
