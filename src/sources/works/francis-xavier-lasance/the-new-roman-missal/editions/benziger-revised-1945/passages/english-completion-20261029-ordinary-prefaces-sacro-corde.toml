# Exact checked English cells of the controlling TSV rows, for prose Source Reader display.
text = "IT IS truly meet and just, right and availing unto salvation, that we should at all times and in all places give thanks unto thee, O holy Lord, Father almighty, everlasting God; who hast willed that thine only-begotten Son hanging on the cross should be transfixed with a soldier’s lance, so that the opened Heart, treasure-place of divine bounty, might flood us with the torrents of compassion and grace, and that that which never ceased to burn with love for us, should be repose for the devout and to the penitent should open the shelter of salvation. And therefore with the angels and archangels, with the thrones and dominations, and with all the array of the heavenly host, we sing a hymn to Thy glory and unceasingly repeat:"
