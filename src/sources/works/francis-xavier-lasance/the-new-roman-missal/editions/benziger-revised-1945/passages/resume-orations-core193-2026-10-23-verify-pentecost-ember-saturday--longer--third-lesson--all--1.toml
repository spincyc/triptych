notes = "Historical Latin comparison transcription: In diebus illis: Dixit Moyses filiis Israel: Audi, Israel, quae ego praecipio tibi hodie. Cum intraveris terram, quam Dominus Deus tuus tibi daturus est possidendam, et obtinueris eam, atque habitaveris in ea: tolles de cunctis frugibus tuis primitias, et pones in cartallo, pergesque ad locum, quem Dominus Deus tuus elegerit, ut ibi invocetur nomen ejus: accedesque ad sacerdotem, qui fuerit in diebus illis, et dices ad eum: Profiteor hodie coram Domino Deo tuo, qui exaudivit nos, et respexit humilitatem nostram, et laborem, atque angustiam: et eduxit nos de Aegypto in manu forti, et brachio extento, in ingenti pavore, in signis atque portentis: et introduxit ad locum istum, et tradidit nobis terram lacte et melle manantem. Et idcirco nunc offero primitias frugum terrae, quam Dominus dedit mihi. Et dimittes eas in conspectu Domini Dei tui, et adorato Domino Deo tuo. Et epulaberis in omnibus bonis, quae Dominus Deus tuus dederit tibi. Complete checked English SHA256 9155ac6a4c437b3fc8dad8e8658af38aa25a7bc8a504021e7168d0140e872d1e. Complete seed canonical Latin SHA256 75e48f07ca420b83a64765ce663e104f1b83449f0f1d53665ece460c93a4a6f1. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-pentecost-ember-saturday-third-lesson-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Strict entire historical and target Latin word sequences including actual ending agree under declared typography only. Typography normalizes case, stress accents, ae/oe ligatures, punctuation and layout only; no i/j or spelling substitutions. Source qualifications \"Only source stress accents, ligatures, case and pointing; the entire source word sequence through dederit tibi corresponds exactly to canonical target. No chapter-range inference.\". One actual historical source inspection, not one per derived recipient."
