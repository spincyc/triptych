notes = "Historical Latin transcription: Deus, qui Ecclesiam tuam, beati Francisci meritis foetu novae prolis amplificas: tribue nobis: ex ejus imitatione, terrena despicere, et coelestium donorum semper participatione gaudere. Per Dominum. Exact checked English SHA256 23da8912c08b729082e732d7d32a6d90fe817464c4f060d691aefb2ff6bd7a02. Complete actual Latin word sequences and short Per Dominum. endings agree after only the original authorized foetu/fetu pair at token7 and declared coelestium/caelestium spelling at token19. Both source and target retain the same fourth-declension masculine ablative singular noun and the same neuter genitive plural adjective modifying donorum. Literal historical English ends Through our Lord. with no response or expansion. Exact comparison {\"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"subroute\": \"strict\", \"donor_fanout\": false, \"lexical_differences\": [{\"source\": \"foetu\", \"target\": \"fetu\", \"source_word_index_zero_based\": 7, \"target_word_index_zero_based\": 7, \"contextual_parse\": {\"lexeme\": \"fetus/foetus\", \"part_of_speech\": \"noun\", \"gender\": \"masculine\", \"number\": \"singular\", \"case\": \"ablative\"}, \"contextual_parse_evidence\": \"Both occur in the identical clause Ecclesiam tuam beati Francisci meritis ... novae prolis amplificas. Ecclesiam is the object of amplificas; meritis and fetu express means. The genitive novae prolis depends on the same noun. This is not the adjective fetus (whose ablative is feto), and no dative-recipient relation is present.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-spellings-fetus-foetus\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-fourth-declension\"]}], \"orthography_differences\": [{\"source\": \"coelestium\", \"target\": \"caelestium\", \"source_word_index_zero_based\": 19, \"target_word_index_zero_based\": 19, \"contextual_parse\": {\"lexeme\": \"coelestis/caelestis\", \"part_of_speech\": \"adjective\", \"gender\": \"neuter\", \"number\": \"plural\", \"case\": \"genitive\"}, \"contextual_parse_evidence\": \"Both describe the same donorum in ... donorum semper participatione gaudere; the genitive plural adjective agrees with the same neuter genitive plural noun. Only the printed oe/ae spelling differs.\"}], \"source_latin_ending\": \"Per Dominum.\", \"target_latin_ending\": \"Per Dominum.\", \"literal_english_ending\": \"Through our Lord.\", \"source_english_expanded\": false, \"response_added\": false}. The existing canonical target retains tribue nobis; while the1962 image prints tribue nobis:. Its selected projection payload and current Latin proof agree at e1503f1b8200e8c1fa8237668c85918030b650159e67b159d63715b9d2f918b8; the old projection-passage prose note names a stale hash. This receiving assembly preserves both old records and exact target bytes; it does not claim a new diplomatic target transcription or a repaired Latin publication basis."
