notes = "Historical Latin comparison transcription: Lectio Actuum Apostolorum. Cum complerentur dies Pentecostes, erant omnes discipuli pariter in eodem loco: et factus est repente de coelo sonus, tamquam advenientis spiritus vehementis: et replevit totam domum ubi erant sedentes. Et apparuerunt illis dispertitae linguae tamquam ignis, seditque supra singulos eorum; et repleti sunt omnes Spiritu Sancto, et coeperunt loqui variis linguis, prout Spiritus Sanctus dabat eloqui illis. Erant autem in Jerusalem habitantes Judaei, viri religiosi ex omni natione, quae sub coelo est. Facta autem hac voce, convenit multitudo, et mente confusa est, quoniam audiebat unusquisque lingua sua illos loquentes. Stupebant autem omnes, et mirabantur, dicentes: Nonne ecce omnes isti, qui loquuntur, Galilaei sunt? et quomodo nos audivimus unusquisque linguam nostram, in qua nati sumus? Parthi, et Medi, et Aelamitae, et qui habitant Mesopotamiam, Judaeam, et Cappadociam, Pontum, et Asiam, Phrygiam, et Pamphyliam, Aegyptum, et partes Libyae, quae est circa Cyrenen, et advenae Romani, Judaei quoque, et Proselyti, Cretes, et Arabes: audivimus eos loquentes nostris linguis magnalia Dei. Complete checked English SHA256 5850e396a735a124a91acd8bb3b812fd7c351bbd3b155a112bf75f6780c45db9. Complete seed canonical Latin SHA256 6393934d1bdf8037ba17e93da4c680a40cfe553063f35501598a028489c5954b. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-pentecost-chants-and-readings retained with original date; no new target-image inspection claimed. Own-appointment complete-word/actual-ending equality after exactly the recorded spelling substitutions [{\"source_word_1_based\": 20, \"target_word_1_based\": 20, \"source\": \"coelo\", \"target\": \"caelo\", \"rule\": \"declared-coel-cael\"}, {\"source_word_1_based\": 74, \"target_word_1_based\": 74, \"source\": \"coelo\", \"target\": \"caelo\", \"rule\": \"declared-coel-cael\"}]. Source/target/English bytes uncha