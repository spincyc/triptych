sitional to Virgine Maria in intercedente beata Virgine Dei Genetrice Maria.\", \"case_binding_basis\": \"Actual full Latin context is retained verbatim above; the pre-existing independent source/context reviews remain external decisions. Intercedente beata Virgine Maria is an ablative absolute; Dei is genitive dependent on the feminine title. The title has the same case, number, gender and referent, and is not the prayer addressee.\"}, \"received_declaration_count\": 2, \"original_proof_value_sha256\": \"b7b973552a787074ba0804d9c90e82e0e8cd70e04c5866c04a3242b45cfe88dc\"}, {\"source_word_index_zero_based\": 14, \"target_word_index_zero_based\": 14, \"source\": \"coelestis\", \"target\": \"caelestis\", \"received_declaration_count\": 2, \"original_proof_value_sha256\": \"44b56db4c3efdc147ca514749cfc0a453044ade7b1fcaaf22936d8702bfc0204\"}], \"orthography_raw_evidence_declarations\": 4, \"orthography_unique_word_changes\": 2, \"subroute\": \"strict\", \"donor_fanout\": false}. Literal historical English remains unexpanded; no official1962English or new source-recipient calendar attestation is asserted."
