notes = "Historical Latin comparison transcription: Deus, qui per immaculatam Virginis Conceptionem dignum Filio tuo habitaculum praeparasti: quaesumus; ut, qui ex morte ejusdem Filii tui praevisa, eam ab omni labe praeservasti, nos quoque mundos ejus intercessione ad te pervenire concedas. Per eumdem Dominum. Complete checked English SHA256 abd233b9c6490754395ca30e01909ba75ac750e7989a94b9d188eacaca9e86f4. Complete canonical Latin SHA256 3dd9b9b0db918ec4f65b9a175e77347c0a54b5875fb874f50ed0bbe636b311f2. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.immaculate-conception-selected-feast-four-propers-word-collation-2026-10-20 retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, modifying Dominum as object of per\"}, \"contextual_parse_evidence\": \"Both complete actual endings explicitly say Per eumdem/eundem Dominum (or the immediately abbreviated Per eumdem); Dominum is masculine accusative singular governed by per. The same Lord referred to in the petition is the Son; no genitive eiusdem is conflated.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"1ac890f989e0144d52aae6f59de4c6a7d75f078d298cfed6d169561109d90b0c\", \"original_proof_pointer\": \"/0/exact_lexical_spelling_differences/0\", \"original_proof_value_sha256\": \"b90ae114ec6f2efdb65a395651acbfa2aba39f820f582d572b361d692a4414d7\", \"original_parse_proof_pointer\": \"