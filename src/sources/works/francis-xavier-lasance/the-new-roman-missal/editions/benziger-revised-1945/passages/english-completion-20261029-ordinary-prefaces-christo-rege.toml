# Exact checked English cells of the controlling TSV rows, for prose Source Reader display.
text = "IT IS truly meet and just, right and profitable, for us; at all times, and in all places, to give thanks to Thee, O Lord, the holy One, the Father almighty, the everlasting God: Who didst anoint with the oil of gladness Thine only-begotten Son, our Lord Jesus Christ, eternal Priest and King of the universe: that, offering Himself as a stainless peace-offering on the altar of the cross, He might fulfill the pledges of man’s redemption; and, having all creatures subject to His power, might deliver to Thy sublime majesty an eternal and universal kingdom, a kingdom of truth and life; a kingdom of holiness and grace, a kingdom of justice, love and peace. And therefore with the angels and archangels, with the thrones and dominations, and with all the array of the heavenly host, we sing a hymn to Thy glory and unceasingly repeat:"
