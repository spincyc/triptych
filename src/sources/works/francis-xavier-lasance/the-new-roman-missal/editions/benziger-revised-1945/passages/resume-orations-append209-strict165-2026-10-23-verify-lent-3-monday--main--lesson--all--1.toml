notes = "Historical Latin comparison transcription: In diebus illis: Naaman princeps militiae regis Syriae, erat vir magnus apud dominum suum, et honoratus: per illum enim dedit Dominus salutem Syriae: erat autem vir fortis et dives, sed leprosus. Porro de Syria egressi fuerant latrunculi, et captivam duxerant de terra Israel puellam parvulam, quae erat in obsequio uxoris Naaman, quae ait ad dominam suam: Utinam fuisset dominus meus ad prophetam, qui est in Samaria: profecto curasset eum a lepra quam habet. Ingressus est itaque Naaman ad dominum suum, et nuntiavit ei, dicens: Sic et sic locuta est puella, de terra Israel. Dixitque ei rex Syriae. Vade, et mittam litteras ad regem Israel. Qui cum profectus esset, et tulisset secum decem talenta argenti, et sex millia aureos, et decem mutatoria vestimentorum, detulit litteras ad regem Israel in haec verba: Cum acceperis epistolam hanc, scito quod miserim ad te Naaman servum meum, ut cures eum a lepra sua. Cumque legisset rex Israel litteras, scidit vestimenta sua, et ait: Numquid Deus ego sum, ut occidere possim, et vivificare, quia iste misit ad me, ut curem hominem a lepra sua? animadvertite, et videte quod occasiones quaerat adversum me. Quod cum audisset Eliseus vir Dei, scidisse videlicet regem Israel vestimenta sua, misit ad eum, dicens: Quare scidisti vestimenta tua? veniat ad me, et sciat esse prophetam in Israel. Venit ergo Naaman cum equis, et curribus, et stetit ad ostium domus Elisei: misitque ad eum Eliseus nuntium, dicens: Vade, et lavare septies in Jordane et recipiet sanitatem caro tua, atque mundaberis. Iratus Naaman recedebat, dicens: Putabam quod egrederetur ad me, et stans invocaret nomen Domini Dei sui, et tangeret manu sua locum leprae, et curaret me. Numquid non meliores sunt Abana et Pharphar fluvii Damasci, omnibus aquis Israel, ut laver in eis, et munder? Cum ergo vertisset se, et abiret indignans, accesserunt ad eum servi sui, et locuti sunt ei: Pater, et si rem grandem dixisset tibi propheta, certe facere debueras: quanto magis quia nunc dixit tibi: Lavare, et mundaberis? Descendit, et lavit in Jordane septies, juxta sermonem viri Dei, et restituta est caro ejus, sicut caro pueri parvuli, et mundatus est. Reversusque ad virum Dei cum universo comitatu suo, venit, et stetit coram eo, et ait: Vere scio, quod non sit alius Deus in universa terra, nisi tantum in Israel. Complete checked English SHA256 8ad26e7e48bdd2a6c867c588e70db11132e4bf9fdb147f361ce420fe0fb5437a. Complete seed canonical Latin SHA256 8344c98df10e95ed1a1a47d6b12ec20b74a3a85dbb232950bab49c46607aedd0. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-lent-3-monday-lesson-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Strict entire historical and target Latin word sequences including actual ending agree under declared typography only. Typography normalizes case, stress accents, ae/oe ligatures, punctuation and layout only; no i/j or spelling substitutions. Source qualifications \"Complete source/target words and appointed terminal extent equal after declared stress/ligature/case/pointing transcription.\". One actual historical source inspection, not one per derived recipient."
