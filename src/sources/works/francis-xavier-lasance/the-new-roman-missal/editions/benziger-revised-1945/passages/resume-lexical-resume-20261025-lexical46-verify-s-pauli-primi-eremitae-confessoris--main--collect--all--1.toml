notes = "Historical Latin comparison transcription: Deus, qui nos beati Pauli Confessoris tui annua solemnitate laetificas: concede propitius; ut, cujus natalitia colimus, etiam actiones imitemur. Per Dominum. Complete checked English SHA256 b815a87520a7ba1230bd18bf89b8e1e14db4459c609f184d49705ed48883b3bd. Complete canonical Latin SHA256 34d7d9b821fca7e701c737fc6d8222188d1fe765d900e7a5591f7861a4be2222. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-s-pauli-primi-eremitae-confessoris-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"natalitia\", \"target\": \"natalicia\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"natalicium/natalitium, neuter substantive festival/birthday\", \"part_of_speech\": \"noun/substantive\", \"gender\": \"neuter\", \"number\": \"plural\", \"case\": \"accusative\"}, \"contextual_parse_evidence\": \"Both complete clauses make natalitia/natalicia the direct object of colimus (we celebrate). The personal genitive beati Valentini / beati N. / cujus identifies whose festival is celebrated. Colimus is a first-person plural finite verb; the -a form here is its neuter accusative plural object, not a nominative or feminine form.\", \"lexical_passage_ids\": [\"passage.charlton-t-lewis.a-latin-dictionary.harper-new-york-1879.lexical-spellings-natalicius-natalitius\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-second-declension-neuter\", \"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-adjective-declension\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"012214b92aeeebb571f653fe0702f0a1ec39269cec22d0840d99c489158ae9ac\", \"original_proof_pointer\": \"/2/lexical_substitutions/0\", \"original_proof_value_sha2