notes = "Historical Latin comparison transcription: Per haec divina mysteria, ad novi quaesumus, testamenti mediatorem Jesum accedamus: et super altaria tua, Domine virtutum, aspersionem sanguinis melius loquentem, quam Abel, innovemus. Per eumdem Dominum. Complete checked English SHA256 3304dbf26a2500c9e8ed4debecde127e5b240268ae71e1525f18aac73491fab8. Complete canonical Latin SHA256 c6dcee0855c3def8079735d182fb62494a3328b675826ef30f34b56bab88c228. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-pretiosissimi-sanguinis-domini-nostri-iesu-christi-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, modifying Dominum as object of per\"}, \"contextual_parse_evidence\": \"Both complete actual endings explicitly say Per eumdem/eundem Dominum (or the immediately abbreviated Per eumdem); Dominum is masculine accusative singular governed by per. The same Lord referred to in the petition is the Son; no genitive eiusdem is conflated.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"1ac890f989e0144d52aae6f59de4c6a7d75f078d298cfed6d169561109d90b0c\", \"original_proof_pointer\": \"/11/exact_lexical_spelling_differences/0\", \"original_proof_value_sha256\": \"780fe914cbe2dff61a61177643638a882af556283d0e6310a4a4559c53703bfb\", \"original_parse_proof_pointer\": \"/11/exact_lexical_spelling_differences/0\", \"original_parse_