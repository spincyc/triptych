notes = "Historical Latin comparison transcription: Haec dicit Dominus Deus: Si abstuleris de medio tui catenam, et desieris extendere digitum, et loqui quod non prodest. Cum effuderis esurienti animam tuam, et animam afflictam repleveris, orietur in tenebris lux tua, et tenebrae tuae erunt sicut meridies. Et requiem tibi dabit Dominus semper, et implebit splendoribus animam tuam, et ossa tua liberabit, et eris quasi hortus irriguus, et sicut fons aquarum, cujus non deficient aquae. Et aedificabuntur in te deserta saeculorum: fundamenta generationis et generationis suscitabis: et vocaberis aedificator sepium, avertens semitas in quietem. Si averteris a sabbato pedem tuum, facere voluntatem tuam in die sancto meo, et vocaveris sabbatum delicatum et sanctum Domini gloriosum, et glorificaveris eum dum non facis vias tuas, et non invenitur voluntas tua, ut loquaris sermonem: tunc delectaberis super Domino: et sustollam te super altitudines terrae, et cibabo te hereditate Jacob patris tui. Os enim Domini locutum est. Complete checked English SHA256 6d17ea8a034d0533e21a611c0b0aa48a31aa79d8848f75027362ce5da7850ef0. Complete seed canonical Latin SHA256 f7c22da26fb3c560dfb9bca5c6983b4fde069651044ec8017c29f14ec2e7f077. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.primary-saturday-after-ash-wednesday-lesson-word-collation-2026-10-20 retained with original date; no new target-image inspection claimed. Strict entire historical and target Latin word sequences including actual ending agree under declared typography only. Typography normalizes case, stress accents, ae/oe ligatures, punctuation and layout only; no i/j or spelling substitutions. Source qualifications \"Complete source/target words and appointed terminal extent equal after declared stress/ligature/case/pointing transcription.\". One actual historical source inspection, not one per derived recipient."
