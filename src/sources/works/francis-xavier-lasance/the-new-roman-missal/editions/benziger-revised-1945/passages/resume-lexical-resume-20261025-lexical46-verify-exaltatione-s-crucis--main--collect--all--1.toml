notes = "Historical Latin comparison transcription: Deus, qui nos hodierna die Exaltationis sanctae Crucis annua solemnitate laetificas: praesta quaesumus; ut, cujus mysterium in terra cognovimus, ejus redemptionis praemia in coelo mereamur. Per eumdem Dominum. Complete checked English SHA256 877db78a6722ac3231ac80986c1595e58c10754ec6c04dc5da9b5e2eee1eb4fc. Complete canonical Latin SHA256 7aaff31588cc21086a64b33c2fc970f7edbb7118c512c1be786ecfc6afc98f40. Existing target Latin verification passage.catholic-church.missale-romanum.vatican-typica-1962.temporal-exaltatione-s-crucis-orations retained. Entire spoken-word sequences and actual endings agree after only the exact recorded comparison pairs. Dated exact lexical/context proof {\"lexical_differences\": [{\"source\": \"eumdem\", \"target\": \"eundem\", \"method_id\": \"own-appointment-lexically-attested-spelling-2026-10-23\", \"contextual_parse\": {\"lexeme\": \"idem\", \"gender\": \"masculine\", \"case\": \"accusative\", \"number\": \"singular\", \"part_of_speech\": null, \"reviewed_parse_text\": \"masculine accusative singular of idem, modifying Dominum as object of per\"}, \"contextual_parse_evidence\": \"Both complete actual endings explicitly say Per eumdem/eundem Dominum (or the immediately abbreviated Per eumdem); Dominum is masculine accusative singular governed by per. The same Lord referred to in the petition is the Son; no genitive eiusdem is conflated.\", \"lexical_passage_ids\": [\"passage.joseph-henry-allen.new-latin-grammar.ginn-1903.lexical-spellings-idem-eundem-eumdem\"], \"materialization_binding\": {\"accepted_review_receipt_sha256\": \"1ac890f989e0144d52aae6f59de4c6a7d75f078d298cfed6d169561109d90b0c\", \"original_proof_pointer\": \"/2/exact_lexical_spelling_differences/0\", \"original_proof_value_sha256\": \"036e76279263f8e006a8a346ab33f4adaa1dbf9dc6849599fe2b8760c7d5e7cd\", \"original_parse_proof_pointer\": \"/2/exact_lexical_spelling_differences/0\", \"original_parse_proof_value_sha256\": \"036