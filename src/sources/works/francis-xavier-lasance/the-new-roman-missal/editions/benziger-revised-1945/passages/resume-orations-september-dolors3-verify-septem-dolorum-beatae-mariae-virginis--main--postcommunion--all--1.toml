sh conclusion is expanded.\", \"explicit_source_referral\": {\"source_pdf_page\": 1193, \"source_printed_page\": \"1198\", \"appointed_Friday_heading_pdf_page\": 959, \"appointed_Friday_heading_printed_page\": \"966\", \"instruction\": \"Mass as on the Friday after Passion Sunday, page 966, except:\", \"excluded_exceptions\": \"Own Prayer and named chants; Secret/Postcommunion are not exceptions. Nicomedes and Feria commemoration prayers remain distinct.\"}, \"complete_canonical_Latin_identity_to_Friday\": {\"donor_target\": [\"comm-septem-dolorum-beatae-mariae-virginis\", \"main\", \"Postcommunion\", \"all\", 1], \"source_target_sha256\": \"c557628e6c50fef9abd51c8b52657da465a153c989d4959ed9f07e3bf1c16002\", \"includes_actual_ending_wraps_punctuation_and_final_LF\": true, \"new_recipient_publication_row_required\": true, \"old_Friday_publication_row_is_not_reassigned\": true}}. No source Latin, target Latin or received English is altered. Historical earlier mismatches/refusals remain recorded; no unlisted spellings, words, names, options or inferred conclusion."
