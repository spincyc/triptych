notes = "Visual controller: passage.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.verify-postconciliar-easter-vigil-fifth-reading-20261023. Source spelling, capitals and punctuation preserved; line wraps joined. Complete historical Latin petition agrees word for word with the photographed 1970 and separately inspected secondary 2002 petitions, after accent, case, ligature, pointing and line-wrap normalization only. Every conclusion is separately compared: Lasance prints Per Dominum. and Through our Lord.; both modern witnesses print Per Christum Dominum nostrum. followed by the response Amen. No complete-prayer string identity, cue equivalence, English ending expansion, or added Amen is asserted. The English is exactly the older prayer's, not a translation of the modern prayer. Photographed 1970 is direct primary evidence; printed-2002 fidelity of the secondary digital witness and correspondence to the 2008 reimpressio remain unresolved."
