notes = "Bilingual throughout: the Latin of the Missale Romanum as revised through Benedict XV stands in one column and the compilers' English in the other, so `language = \"en\"` records the edition's own contribution and not the whole of what is printed. THIS EDITION IS NOT A TYPICAL EDITION AND NOT AN APPROVED ENGLISH EDITION OF ONE. It is a publisher's hand missal, and binding it as a witness to the Tridentine recension as promulgated would be an accuracy error that its rights position does nothing to prevent; for the Latin, cite work.catholic-church.missale-romanum and an edition of it. THE ONLY PHYSICAL EXEMPLAR REPRESENTED BY THIS EDITION'S THREE ARTIFACT RECORDS IS A LATER PRINTING OF THIS EDITION, NOT OF THE 1937 FIRST EDITION AND NOT OF THE 1945 IMPRESSION. The scanned copy is a printing of about 1955-56: at printed pages 1298a-1298n it carries an appendix stating that its feasts are 'additions to the 1945 Copyright edition', and it prints the Queenship of the Blessed Virgin Mary on 31 May and St Pius X on 3 September, neither of which could have been set before late 1954, while the body still carries the pre-1955 Holy Week with twelve prophecies on Holy Saturday and no renewal of baptismal promises. The uploaded item, the file name it is served under, and the prior lt-hist corpus all call it 1937; they are wrong, and anything citing this text as a 1937 witness is citing it wrongly. The base text is the 1945 revision, which is what this record names. The printing year itself is an inference from the text and is not established from a physical copy; see src/sources/inventories/lasance-new-roman-missal-rights-v1.toml `[the_local_artifact]`, `[the_appendix_exclusion]`, and `[the_1302_insert_exclusion]`."
