description = "A commercial hand missal compiled by Francis Xavier Lasance (1860-1946) and Francis Augustine Walsh, O.S.B. (1884-1938), published by Benziger Brothers and printed with the Latin of the Missale Romanum facing an English rendering, together with the compilers' own prefaces, instructions, meditations, saints' lives, glossary of liturgical terms and prayers for private devotion, and William R. Kelly's illustrated study plan 'Read Mass with the Priest'. It is a devotional book made for a layperson following the Mass, not an official liturgical book and not an approved English edition of any typical edition: its English is its compilers' and carries no authority of its own. It witnesses what an English-speaking Catholic of the mid twentieth century read alongside the altar book, and any use of it as evidence for the Roman Rite must say so. The work is named for its compilers rather than for the Church because the compilation, the arrangement and the English are theirs; the Latin it prints belongs to work.catholic-church.missale-romanum and is not made this work's by being reprinted here."
