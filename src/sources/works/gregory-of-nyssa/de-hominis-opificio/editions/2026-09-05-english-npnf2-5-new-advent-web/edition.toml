notes = "A dated web delivery of a public-domain 1893 English translation, read as a reception witness and not as control over the Greek. It is the first edition registered for this work. Language pairing: this edition is a translation, and the work's original was not retrieved in the sweep that produced this record. Register the original alongside it before treating any wording question as settled from this edition alone. Gregory's Greek was not retrieved: the standard text is Migne, Patrologia Graeca 44, cols. 123-256, and the modern critical edition of Hubertus R. Drobner in Gregorii Nysseni Opera, neither of which was sought in the sweep that produced this record."
