id = "work.gregory-of-nyssa.de-hominis-opificio"
title = "De hominis opificio"
responsible = "Gregory of Nyssa"
work_type = "patristic-treatise"
composed = "379"
composed_basis = "Written in the Easter of 379, months after Basil's death, and sent to Peter of Sebaste as the completion of the Hexaemeron Basil had left unfinished, which its own preface states. The date is the writing, not the 1893 English translation in the Nicene and Post-Nicene Fathers."
alternate_titles = ["On the Making of Man", "De opificio hominis", "Peri kataskeues anthropou"]
languages = ["grc"]
description = "Gregory of Nyssa's treatise on the making of man, written about 379 for his brother Peter as the supplement his brother Basil's Hexaemeron left undone: the Hexaemeron breaks off at the sixth day before the creation of man, and this work expounds what Basil did not reach. It is a treatise in thirty chapters preceded by a dedicatory letter, and its scriptural subject is the divine utterance of Genesis 1:26 and its accomplishment in 1:27."
