description = "Gregory of Nyssa's late fourth-century handbook for catechists, in a prologue and forty chapters, addressed by chapter number. Chapter numbering differs between editions and translations; a consumer citing a chapter should name the edition. Several chapters, notably the twenty-sixth, state a restoration of all things extending to the author of evil himself, and Greek manuscripts of the work carry marginal warnings to that effect."
