authority = "PDF page 232 carries the imprimatur of Carolus Lavigne S.J., Vic. Apos. Kottayamensis, dated Changanacherry, 16 November 1893; page 233 carries Aloysius Pareparambil’s examination letter of the same date. The 1893 authorization is distinct from the catalogue’s 1898 printing date."
jurisdiction = "Syro-Malabar Catholic Church liturgical tradition"
notes = "Native title at PDF page 235. Bonn identifies this as a Syro-Malabar ritual for preparation for Mass, thanksgiving and the Apostles liturgy, 144 and 82 printed pages; exact PDF has 239 pages. Latin front matter directly identifies a collection of Syriac prayers selected by P. Cherubim, including two previously unprinted translations; it does not prove that the entire book is a newly promulgated altar order. No relation of substantive revision to the 1906 Ordo is asserted. Catalogue: https://digitale-sammlungen.ulb.uni-bonn.de/content/titleinfo/6834153. No complete textual collation or present-day liturgical authorization is claimed."
