authority = "The Latin title at PDF page 510 states superiorum permissu. The approval at PDF page 6, dated 15 October 1905 and signed Aloysius Pareparambil, Bishop of Tiana and Vicar Apostolic of Ernakulam, refers to his permission of 10 June 1904 and to appended new Masses approved by the Sacred Congregation of Rites on 31 July 1905. The cited Congregation act has not been independently inspected."
jurisdiction = "Syro-Malabar Catholic Church liturgical tradition"
notes = "Latin title at PDF page 510; Syriac title at page 511; additional Latin permissions at pages 508–509; final approval and English imprint at page 6. The full PDF has 515 pages; Bonn describes separate pagination and a Malabar lectionary with Apostles liturgy (Reise-Missale). The 1905 approval expressly attests appended new Masses, but their individual texts and the complete difference from earlier printings remain uncollated. English occurs in the printer’s imprint, not as a registered liturgical translation. Catalogue: https://digitale-sammlungen.ulb.uni-bonn.de/content/titleinfo/3724391. No complete textual collation or present-day liturgical authorization is claimed."
editors = ["Andreas Kalapura (catalogue: Andreas Qālāpūrā)"]
