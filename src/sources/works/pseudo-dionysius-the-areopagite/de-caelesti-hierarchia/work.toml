description = "The Dionysian treatise, in fifteen chapters addressed to Timothy, on the heavenly hierarchy: its definition and purpose, the symbolic forms under which Scripture presents the angels, and the nine orders in three triads (seraphim, cherubim, thrones; dominions, powers, authorities; principalities, archangels, angels). A locus is chapter.section as divided in Migne, Patrologia Graeca 3, or the chapter alone."
