description = "The standard nineteenth-century English dictionary of classical realia. Its article Mantele describes the napkins used at Greek and Roman meals, including the mappa that guests brought with them to the table, and records no signalling function for any of them. Registered as an identified working authority on Greco-Roman dining, not as modern scholarship. Loci are article headwords."
