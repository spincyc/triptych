notes = "The title and reprint leaves identify this exact volume as the 1967 Herder reprint, not the 1935 Vromant printing. Its editorial apparatus is French and its six diplomatic witness columns are Latin. Registration searched the local source library for the aliases 'Antiphonale Missarum Sextuplex' and 'René-Jean Hesbert' and found only the separate 1935 catalog record. The upstream receipts supplied no English translation, and this registration stage does not retrieve new sources, so no English edition is registered or claimed."
