composed_basis = "Hesbert's own preface is dated at Solesmes on 12 March 1935 and describes the completed editorial work. The date is the writing, not the inspected Herder reprint's 1967 printing date."
description = "Hesbert's synoptic edition of six early witnesses to the Mass antiphonary: the Gradual of Monza and the antiphonaries of Rheinau, Mont-Blandin, Compiègne, Corbie, and Senlis. Its numbered entries and witness sigla require direct inspection in a materially identified edition before they are treated as verified."
