description = "An English lay hand missal of the English mission, giving the Masses of the Roman Missal for a layperson following the Mass. Its Ordinary and its Canon stand in facing Latin and English columns; its Epistles, Lessons and Gospels are, by its own introduction, taken from the Rheims and Douay version as revised by Richard Challoner, so its scriptural English is not the compiler's; the orations and the remaining English are anonymous and unattributed. Its sanctoral is that of the English vicariates, keeping St George as patron of England at the first class, St Augustine the apostle of England and St Edward with octaves, and St Cuthbert, St Dunstan, St Alban proto-martyr, the Venerable Bede, St Winefrid and St Thomas of Canterbury in place. Its introduction directs the reader to the Laity's Directory for the year's variable observance, so it is a book made to be used with an annual ordo rather than to be complete in itself. IT IS A DEVOTIONAL COMPANION AND NOT AN OFFICIAL LITURGICAL TRANSLATION, and its rubrics are those in force long before the 1911, 1955 and 1960 reforms -- it grades feasts as double of the first and second class, greater double, double and semidouble. It stands beside the three sibling hand-missal families in this library, the Cummiskey, Husenbeth and Lefebvre books, and like them its only common object with them is the Latin Missal itself; whether its English of the orations is the same anonymous translation as the Philadelphia Cummiskey missals' has not been collated and must not be assumed from the shared title formula."
