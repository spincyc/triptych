notes = "WHAT THIS IS: uncorrected optical character recognition of a whole English lay missal, 36,485 LF-terminated lines, valid UTF-8, no CR bytes, landed as a plain source artifact and nothing more. It is deliberately NOT structured as liturgical records; the prior lt-hist corpus cut the same text into six markdown 'sections' bounded by line ranges over the downloaded file, and reproducing that shape here would reproduce a defect with better provenance attached. Addressability by identity belongs to passage records with real loci over these exact bytes. Until such a passage exists this artifact is a finding aid.\n\nOCR QUALITY. Measured here by scripts/_ocr_quality.py at an English function-word share of 0.3149 over 225,027 tokens, Latin 0.0339, classified `prose-english`. The two figures must be read together: the Ordinary and Canon print Latin beside English, and a large part of the book is calendar and index matter that is neither, so the English share is a floor rather than a ceiling on the prose. The damage is the ordinary damage of a 2006 scan of small-type letterpress with the long s: `fuch of the Laity` and `MifTal` for such of the Laity and Missal at lines 33 and 34, `Poflcommunion`, `Semidoublc`, and Latin words worse used than English ones -- `fupp- / liciter` broken across lines, `rogamu.?` for rogamus at line 2875 and `Kcclesia` for Ecclesia at line 2881. Quote from this artifact only through a checked passage, and do not rest a negative search on it: the raw-line modes establish absence of a string, not absence of a text. TWO NEGATIVE SEARCHES THAT ARE ARTEFACTS AND NOT FINDINGS, named so nobody repeats them. The strings `Keating` and `1806` both return zero hits in this file, the first because the title-page imprint is optically destroyed and the second because the printed year was not captured at all; neither absence says anything about the book.\n\nWHAT THE TEXT LAYER CONTAINS AND WHERE. The introduction explaining the book's use to the laity opens at line 33; the note attributing the Epistles, Lessons and Gospels to the Rheims and Douay version as revised by Challoner stands at lines 109 to 113, and the table of abbreviations with the pre-1911 grades at lines 115 to 123; the calendar with the English proper saints runs from about line 158, St George as patron of England at the first class at line 269 and St Augustine the apostle of England at line 320; the Ordinary is headed from line 1283; the Canon of the Mass is present entire in facing columns, headed at line 2868 and opening at line 2871 with `TE igitur clementissi- / me^Pater, per Jesum / Christum` against `WE humbly pray / and beseech thee, / therefore, most merciful / Father` from line 2894; and the proper Masses begin at line 3987.\n\nIDENTITY. Internet Archive item a550137400unknuoft, scanned in 2006 on a Scribe station at 600 ppi from a copy contributed by Saint Mary's College of California under the Toronto collection, sponsored by the National Institute for Newman Studies; 744 page images, page_number_confidence 87. Its catalogue record supplies creator `Catholic Church`, publisher `London : P. Keating, Brown` and date 1806, and links OpenLibrary edition OL13990585M. The publisher line is the catalogue's conflation of two names the book keeps apart: P. Keating published it and Brown and Co. printed it, per the title page and the final leaf respectively. See the edition record."
