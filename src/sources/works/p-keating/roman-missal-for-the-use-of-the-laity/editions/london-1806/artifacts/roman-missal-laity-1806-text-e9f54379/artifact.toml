rights_basis = "Public domain in the United States because the book was first published outside the United States before the pre-1931 line, and on that ground alone. THE LINE, AND THE YEAR IT WAS DERIVED FOR. Any work first published abroad before 1931 is out of United States copyright; that is the line guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026, correcting the commissioning brief's 'before 1930'. THE LINE MOVES EVERY JANUARY, which guidance/missals.md:249 states in terms, so it is written here as derived for calendar year 2026 and not as a standing rule: on 1 January 2027 it becomes before 1932, and a later reader must re-derive it rather than quote this sentence. Publication in 1806 clears the line by a hundred and twenty-five years, and the margin survives the fact that the book's own printed year has not been read from the bytes: the edition record explains that 1806 is the cataloguer's date, and any London printing by this publisher at this address is of the early nineteenth century, so the ground holds under any reading of the year that the evidence permits. THE SCAN AND ITS TEXT LAYER ADD NOTHING FOR ANYONE TO OWN. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it: this text layer was produced autonomously by the Internet Archive's ABBYY pipeline in its 2006 Scribe workflow and converted by abbyy-to-hocr 1.1.7 per the item's own `ocr_converted` field, and there is no author to hold a right in it. NOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, that the download succeeded, or that the host marks it public domain. guidance/sources.md:395-400 holds that availability and successful download are insufficient for `tracked`, and the item's public-domain licence URL was the whole of the prior lt-hist corpus's ground for this book -- the ground refused at src/sources/inventories/lt-hist-rights-audit-v1.toml, and the same kind of ground that corpus used to import the 2011 Roman Missal. The mark is recorded as a fact about the item and is not a link in this basis, which would be unchanged if the item carried no mark or a contradictory one. NO THIRD-PARTY DIGITISATION CLAIM ARISES HERE, and this is worth saying because it is what separates this book from its 1843 sibling. The scan was made by the Internet Archive itself on a Scribe station in 2006, sponsored by the National Institute for Newman Studies from a copy contributed by Saint Mary's College of California; there is no Google front matter, no usage-guidelines leaf, and no scanner-asserted claim anywhere in the bytes, which a search of the whole file for `google`, `copyright`, `all rights reserved` and `creative commons` confirms returns nothing."
