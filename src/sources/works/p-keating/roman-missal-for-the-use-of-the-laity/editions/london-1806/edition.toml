notes = "THIS BOOK CANNOT STAND AS A WITNESS TO THE 1570 RECENSION, AND THE CAVEAT TRAVELS WITH THE TEXT WHEREVER IT GOES. It is a commercial lay missal, not an official English edition of any typical edition of the Missale Romanum and not an approved translation of one. A lay missal is a devotional book whose English is its compiler's, arranged for a congregation following along; it is evidence of what an English Catholic read in 1806 and not evidence of what the altar book said. Binding it as a witness to the Tridentine text as promulgated would be an accuracy error that its rights position does nothing to prevent, and the prior lt-hist corpus is the one place that recorded the point -- `an early English lay missal, not an official English edition of the 1570 typical Latin text` -- while recording it about this book and not about its 1843 sibling, which carries the same defect and no such note. For the Latin, cite work.catholic-church.missale-romanum and an edition of it. THE PARTS OF THIS BOOK ARE NOT ALL OF THE SAME STANDING, and a consumer must not treat them alike. Its Epistles and Gospels are Challoner's revision of the Rheims-Douay and may be cited as that; its Ordinary and Canon print the Latin beside the English, so the Latin columns are a reprint of the altar book's text at a London press in 1806 and are a printing witness of the ordinary rank, neither authoritative nor negligible; its orations in English are an anonymous rendering of no authority whatever. THE IMPRINT AND THE DATE. The title page's publisher line and the final printer's line are both damaged in the only text layer held -- `C 1'iiMi/hftl l>\\- /'. Kc,ititt<i\\ Jli- / Duke Stivt-l . tVrosvT S<|uai` and `r.wn, and Co. Printers, 37, / C rvswior Square` -- and neither carries a legible year. The 1806 of this record is the Internet Archive item's catalogue date, corroborated by nothing in the bytes; the book's own printed year has not been read. The identification is nonetheless secure at the level that matters here, since the publisher, the street, the Challoner scriptures and the pre-1911 grading all place it in the English mission of the early nineteenth century."
