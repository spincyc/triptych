description = "Swete's three-volume Cambridge manual edition of the Greek Old Testament, printing Codex Vaticanus where it survives with a foot apparatus of readings from Alexandrinus, Sinaiticus, and other identified uncials. Volume I covers Genesis through 4 Kings. It is a diplomatic manual edition, not a fully reconstructed critical text; consumers must not treat its readings as the judgment of the Gottingen Septuaginta. A locus is BookToken.chapter.verse in the Greek versification, which differs from the Hebrew in several books."
