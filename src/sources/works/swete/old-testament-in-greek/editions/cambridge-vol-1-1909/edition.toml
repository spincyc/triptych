notes = "Volume I of Swete's edition, covering Genesis through 4 Kings. Its base text is Codex Vaticanus; the foot apparatus cites Alexandrinus, the Cotton Genesis, and other identified witnesses by siglum. Swete died in 1917 and the edition is in the public domain. Keep it distinct from Rahlfs' Septuaginta and from the Gottingen Septuaginta, whose Genesis was edited by Wevers; neither of those was consulted for any record registered here."
