notes = "Retained because the Greek of Genesis 15 diverges from the Hebrew and the Vulgate at verses 11, 12, 17, and 18 in ways that carry a chronological argument, and because the base text is Codex Vaticanus rather than a reconstructed critical text. Swete's apparatus on this chapter records variants at verses 1, 7, 10, and 13 only; those readings are not reproduced here and a consumer needing them must return to the edition."
