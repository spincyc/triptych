notes = "Complete Greek Psalter as Swete prints it. Measured on these exact bytes: 34,551 token lines over 2,551 distinct verse references, chapters 1-151 with no gap, that is LXX Psalms 1-151 in Septuagint numbering. One line-level defect: the title of Psalm 94 is emitted at the anomalous reference 27.94.23 rather than before verse 1, so titles in this file cannot be relied on for verse numbering. Septuagint psalm numbers are the Vulgate's, not the Hebrew's."
