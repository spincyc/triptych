description = "The Federation of Diocesan Liturgical Commissions' free online leaflets that reprint the Collect (and, in the 2016 series, the Prayer after Communion) of the Sundays and Solemnities of the Roman Missal whole, each beside a short mystagogical reflection, and each carrying the acknowledgment \"Excerpt from The Roman Missal, Third Edition (c) 2010, ICEL. Reprinted with approval of the Committee on Divine Worship, United States Conference of Catholic Bishops.\" The English reprinted is ICEL's approved translation of the Missale Romanum 2002/2008; the FDLC is the reprinter and not the rightsholder. Registered because these leaflets are the only publicly reachable, exact copy of a large block of the Missal's orations in ICEL English, and the maintainer has accepted the FDLC reprint as an acceptable exemplar of that text."
