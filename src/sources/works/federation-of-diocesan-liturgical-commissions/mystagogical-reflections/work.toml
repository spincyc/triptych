description = "The Federation of Diocesan Liturgical Commissions' free online leaflets are composite publications: FDLC compiles contributor-authored mystagogical reflections and design or artwork around excerpts identified by the leaflets as ICEL's 2010 English of the Roman Missal. The files state that the liturgical excerpts were reprinted with approval of the USCCB Committee on Divine Worship, but they do not identify the underlying authorization instrument or establish a right to redistribute the composite PDFs. The source library tracks text-free identity and remote artifact metadata only."
