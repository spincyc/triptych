publication = "A set of free PDF leaflets published by the Federation of Diocesan Liturgical Commissions for the 2012-2013 liturgical year under \"Mystagogical Reflections on the Collects of the Roman Missal\", each reprinting the Collect of a Sunday or Solemnity whole under the acknowledgment \"Excerpt from The Roman Missal, Third Edition (c) 2010, ICEL. Reprinted with approval of the Committee on Divine Worship, United States Conference of Catholic Bishops.\" The files read in this lane were collect_mystogogy.advent.pdf, collect_mystogogy.christmas.pdf, collect_mystogogy.lent.pdf and collect_mystogogy.easter.pdf, hosted at https://www.evdio.org/uploads/2/6/3/0/26308718/; state retrieved 2026-08-21."
