notes = """
A REPRINT CONTAINER, NOT THE MISSAL. FDLC publishes the reflection compilation;
the embedded liturgical excerpts identify ICEL as translation rightsholder.
The files report USCCB committee approval for the reprint but do not identify
the authorization instrument, and that statement does not establish a right
for Triptych to redistribute the composite PDFs. The leaflets carry no rubrics,
no Order of Mass, and no apparatus of their own beyond the reflection beside
each oration. They must never be cited as the Missal or as a ritual edition.

WHY THIS EDITION IS AN ACCEPTABLE EXEMPLAR. The maintainer has decided that the
FDLC reprint is an acceptable exemplar of ICEL's English: each oration is
reprinted whole, the acknowledgment on every page names ICEL as the
rightsholder, and the reprint is made with the approval of the USCCB's
Committee on Divine Worship. It is a second-tier exemplar -- the rightsholder's
own copy (ICEL's chant library) is the higher tier -- and it needs collating
rather than trusting. One Collect contains a documented typographical error;
that slot remains withheld rather than reproducing the wording here.

AS OF WHEN. The reprint is of the 2010 English and predates the May 2020
correction to the collect conclusions. Exact wording remains quarantined;
metadata records that the superseded conclusion occurs. No artifact payload
path or liturgical wording is tracked; the artifact records use remote storage.
