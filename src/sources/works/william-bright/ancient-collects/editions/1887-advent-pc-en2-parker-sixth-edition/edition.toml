notes = "Read on the title page of the registered facsimile (PDF page 5): by William Bright, D.D., Regius Professor of Ecclesiastical History and Canon of Christ Church, Sixth Edition, Parker and Co., 1887. In the seasonal section printed page n is PDF page n+20 (printed 16 is PDF 36; printed 18 is PDF 38; printed 60 is PDF 80). Bright gives the source of each prayer by a lettered footnote (Leonine, Gelasian, Gregorian, Ibid.); a prayer's conclusion, where he prints one, is his own English expansion and is not evidence of the Latin cue. Only three prayers are registered as passages; the rest of the book is not examined. Created by the advent-pc-en2 English-witness lane on 2026-11-27."
