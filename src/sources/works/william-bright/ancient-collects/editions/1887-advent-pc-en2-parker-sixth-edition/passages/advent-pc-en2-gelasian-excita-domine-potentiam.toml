context = "Bright's English of the first prayer of the Gelasian Orationes de Adventum Domini (Wilson 1894, II.LXXX, p. 214: Excita, Domine, potentiam tuam, et veni, et quod ecclesiae tuae usque in finem saeculi promisisti clementer operare. Per.; passage.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.advent-five-missae-a3, artifact line 3), which his footnote q marks Gelasian. Word for word the same prayer: Stir up = Excita, O Lord = Domine, Thy power = potentiam tuam, and come = et veni, and mercifully fulfil = et ... clementer operare, that which Thou hast promised to Thy Church = quod ecclesiae tuae ... promisisti, unto the end of the world = usque in finem saeculi. Bright prints no conclusion for the Latin Per. This is not the pre-1970 Missal's First Sunday Collect (Excita, quaesumus, Domine, potentiam tuam, et veni: ut ab imminentibus ...), which adds quaesumus and continues otherwise."
physical_line_ranges = [[2, 4]]
text = "Advent. Stir up, O Lord, Thy power, and come; and mercifully fulfil that which Thou hast promised to Thy Church unto the end of the world. Gelasian."
