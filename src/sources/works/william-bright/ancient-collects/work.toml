description = "William Bright's English renderings of prayers chosen from the ancient Western service books, among them the Leonine, Gelasian and Gregorian sacramentaries, the Mozarabic and Gallican books and the Sarum Missal, arranged for devotional use by season and subject. A lettered footnote names the rite or book from which each prayer is taken. Cited by printed page and footnote letter."
