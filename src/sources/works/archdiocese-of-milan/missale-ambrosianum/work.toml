description = "The altar book of the Ambrosian rite -- the Latin use of the church of Milan, the largest non-Roman Latin rite still celebrated, and one of the uses left standing by the exempting clause of Quo primum. It is a Missal in the ordinary sense and it is NOT the Missale Romanum: it carries its own kalendar with its own Milanese archbishop-saints, its own Ordo Missae and Canon, a temporal cycle that begins six Sundays before Christmas, its own Holy Week and Easter Vigil, Commons, votive and Requiem Masses, blessings and Mass tones. IT MUST NOT BE FILED WITH THE ROMAN BOOK. work.catholic-church.missale-romanum is the Roman Rite's book; this is a different rite's, and the edge that does not exist between them is the point -- src/sources/inventories/latin-missal-acts-v1.toml records at its own line note that drawing one from the Roman line into the Ambrosian would assert a derivation in exactly the direction history runs the other way. It is registered under the archdiocese, on the pattern of work.archdiocese-of-braga.missale-bracarense, because the rite is the church of Milan's and the authority over the book has been the archbishop's throughout its printed tradition. The three editions registered here are printings, not promulgations: none of them carries a papal instrument, and what the 1640 and 1712 carry instead is an archbishop's own letter to his clergy."
