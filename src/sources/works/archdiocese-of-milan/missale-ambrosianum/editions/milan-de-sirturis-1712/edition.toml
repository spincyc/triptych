publication = "Missale Ambrosianum ... novissime Cardinalis Archinti Archiepiscopi auctoritate recognitum. MEDIOLANI, MDCCXII. Apud Beniamin, & Fratres de Sirturis, Impressores Archiepiscopales. CUM PRIVILEGIO. The copy digitised is Munich, Bayerische Staatsbibliothek, Res/2 Liturg. 182, urn:nbn:de:bvb:12-bsb10869665-9, digitised by the Munchener DigitalisierungsZentrum and re-uploaded to the Internet Archive by a private uploader as item 10869665bsb."
