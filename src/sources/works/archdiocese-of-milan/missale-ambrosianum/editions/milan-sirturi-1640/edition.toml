publication = "Missale Ambrosianum. Mediolani, Apud Io. Ambrosium Sirturum, haer. Pontij, & Picaleae, Impress. Archiep., M DC XL. Engraved title page signed C. Bassanus F. (Cesare Bassano). The copy digitised is the National Central Library of Rome's, scanned by Google and uploaded to the Internet Archive as item bub_gb_6ApfhlfCMksC. The catalogue collation is [36], 554, 176 p., folio, text printed in red and black."
