notes = "Uncorrected optical text of the whole of the same Pars I printing from Internet Archive item bub_gb_RIkPAAAAIAAJ, a second derivation of the same Google scan. 58191 LF-terminated lines. Extent as measured by the retrieving lane: Complete Internet Archive DjVu optical-text layer of the whole of the same work and printing, Pars I (Sankt Blasien, 1777), from a second and independently produced scan (New York Public Library copy, 557 leaves per its scandata). Produced independently of the layer above and used throughout as its control. ACCESS LIMITATION. What is not retained is this optical layer, and it is not retained because Google's own matter is inside it and no distribution grant for that matter was established; a reader without the network cannot replay a search over it. What can be opened instead is the page images of leaves n194, n228 and n232 of item monumentaveteri00gerbgoog, retained on this edition, which carry printed pp. 146, 180 and 184 -- the three pages every reading in this run was taken from. ONE GOOGLE DIGITISATION UNDERLIES BOTH INTERNET ARCHIVE ITEMS OF PARS I, and the metadata registered on this edition says so in its own fields: item monumentaveteri00gerbgoog gives source = \"http://books.google.com/books?id=RIkPAAAAIAAJ\", scanner = \"google\", contributor = \"New York Public Library\" and description = \"Book digitized by Google from the library of the New York Public Library and uploaded to the Internet Archive by user tpb\"; the sibling item is named bub_gb_RIkPAAAAIAAJ, which is that same Google volume id. The two are separate derivations of one scan of one copy -- their leaf counts differ, 561 against 557, and their optical layers differ -- and not two independent scans of two copies. Anything resting on one as a control on the other should say so."
