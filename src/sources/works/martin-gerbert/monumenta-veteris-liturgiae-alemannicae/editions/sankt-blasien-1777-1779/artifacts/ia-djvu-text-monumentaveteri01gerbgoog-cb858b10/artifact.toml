rights_basis = "The volume was published at Sankt Blasien in 1777, and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A could not reach it either: ninety-five years from 1777 ran out in 1872, so nothing remained to restore on 1 January 1996. These exact bytes are another matter. The same probes were run over this file: \"usage guidelines\" 1; \"about google book search\" 1; \"this is a digital copy\" 1; \"digitized by google\" 0; \"google book search\" 5. Google's front-matter block stands entire at the head of the file. That is Google-authored matter and no distribution grant for it was established, so the file is recorded and not retained, following the disposition already settled at artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr."
