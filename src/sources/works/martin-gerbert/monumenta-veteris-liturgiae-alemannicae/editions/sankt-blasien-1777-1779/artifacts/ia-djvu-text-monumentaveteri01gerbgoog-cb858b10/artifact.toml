notes = "Uncorrected optical text of the Internet Archive item catalogued as the 1779 volume of the same work. 45577 LF-terminated lines. Extent as measured by the retrieving lane: Complete optical-text layer of the Internet Archive scan catalogued as the 1779 volume of the same work. Searched for this formulary's orations, for 'Dominica vacat' and for the numbering notes; none is present, so this volume does not carry the Sundays after Pentecost and is recorded as a bounded negative. ACCESS LIMITATION. What is not retained is this optical layer, and it is not retained because Google's own matter is inside it and no distribution grant for that matter was established; a reader without the network cannot replay a search over it. What can be opened instead is the page images of leaves n194, n228 and n232 of item monumentaveteri00gerbgoog, retained on this edition, which carry printed pp. 146, 180 and 184 -- the three pages every reading in this run was taken from. ONE GOOGLE DIGITISATION UNDERLIES BOTH INTERNET ARCHIVE ITEMS OF PARS I, and the metadata registered on this edition says so in its own fields: item monumentaveteri00gerbgoog gives source = \"http://books.google.com/books?id=RIkPAAAAIAAJ\", scanner = \"google\", contributor = \"New York Public Library\" and description = \"Book digitized by Google from the library of the New York Public Library and uploaded to the Internet Archive by user tpb\"; the sibling item is named bub_gb_RIkPAAAAIAAJ, which is that same Google volume id. The two are separate derivations of one scan of one copy -- their leaf counts differ, 561 against 557, and their optical layers differ -- and not two independent scans of two copies. Anything resting on one as a control on the other should say so."
