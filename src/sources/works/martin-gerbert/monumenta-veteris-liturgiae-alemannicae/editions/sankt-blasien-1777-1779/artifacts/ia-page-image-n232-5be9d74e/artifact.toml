notes = "One complete scanned page image, Internet Archive leaf n232 of item monumentaveteri00gerbgoog = printed p. 184, carrying the running head \"184  DOMINICA XX. POST PENTECOST.\", the heading \"Dominica XX. Post Pentecosten. Gelas. (1)\", the Collect \"Tua nos, Dne quaesumus, gratia per & praeveniat & sequatur\", the Secret \"Munda nos\" and the Postcommunion \"Purifica\", each with Gerbert's own sigla, and footnote (1) beneath. The leaf-to-page correspondence was fixed from the item's own scandata table, retained beside this file, and then confirmed against the page number printed in the running head of the image itself. Extent as measured by the retrieving lane: One page image, 5942x6509 px greyscale, of printed p. 184 in the first scan -- the whole leaf. The running head 'DOMINICA XX. POST PENTECOST.' and the page number 184 are legible; the outer margin of the right-hand column is clipped by the scan, cutting the last two or three letters of most of its lines. This is visual evidence, not text: it is not searchable and no negative may be read off it by machine."
