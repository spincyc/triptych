notes = "One complete scanned page image, Internet Archive leaf n193 of item bub_gb_RIkPAAAAIAAJ = printed p. 146. THIS IS THE SCAN WHOSE OUTER MARGIN IS NOT CLIPPED, which is why the retrieving lane fetched it: it supplies the line-ends that the sibling derivation cuts. Extent as measured by the retrieving lane: One page image, 2500x3397 px, of printed p. 146 in the second scan -- the whole leaf, carrying the running head 'FESTIVITAS S. PAULI APOST.' with the page number and footnote (3) entire. ACCESS LIMITATION. What is not retained is a page image carrying Google's watermark; it is not retained for the reason in `rights_basis`. What a reader without the network can open instead is the same printed page in the sibling derivation, retained on this edition at artifact.martin-gerbert.monumenta-veteris-liturgiae-alemannicae.sankt-blasien-1777-1779.ia-page-image-n194-285ae7df, whose text is legible throughout and whose only loss is two or three letters at the outer margin of the right-hand column. ONE GOOGLE DIGITISATION UNDERLIES BOTH INTERNET ARCHIVE ITEMS OF PARS I, and the metadata registered on this edition says so in its own fields: item monumentaveteri00gerbgoog gives source = \"http://books.google.com/books?id=RIkPAAAAIAAJ\", scanner = \"google\", contributor = \"New York Public Library\" and description = \"Book digitized by Google from the library of the New York Public Library and uploaded to the Internet Archive by user tpb\"; the sibling item is named bub_gb_RIkPAAAAIAAJ, which is that same Google volume id. The two are separate derivations of one scan of one copy -- their leaf counts differ, 561 against 557, and their optical layers differ -- and not two independent scans of two copies. Anything resting on one as a control on the other should say so."
