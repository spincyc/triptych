rights_basis = "The volume was published at Sankt Blasien in 1777, and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A could not reach it either: ninety-five years from 1777 ran out in 1872, so nothing remained to restore on 1 January 1996. These exact bytes are another matter, and the question was settled by eye rather than by a text probe, because a watermark is a picture. Leaf n227 of this item was opened and read at full width: \"Digitized by Google\" is stamped in grey at the lower right of the page, outside the printed text block and inside the image. The item's own optical layer corroborates it, recognising that stamp once per leaf over most of the volume. That is Google-authored matter in the bytes and no distribution grant for it was established, so the image is recorded and not retained, following the disposition already settled at artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr."
