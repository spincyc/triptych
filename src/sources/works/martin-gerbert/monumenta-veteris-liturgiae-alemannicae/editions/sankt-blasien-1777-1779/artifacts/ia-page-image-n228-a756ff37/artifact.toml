notes = "One complete scanned page image, Internet Archive leaf n228 of item monumentaveteri00gerbgoog = printed p. 180, carrying the running head \"180  DOM. XIX. POST PENT.  DEPOS. S. EUSTORGII.\", the heading \"Dominica vacat. (1)\" with its Mass, and footnote (1) beneath. The leaf-to-page correspondence was fixed from the item's own scandata table, retained beside this file, and then confirmed against the page number printed in the running head of the image itself. Extent as measured by the retrieving lane: One page image of printed p. 180 in the first scan -- the whole leaf, retrieved as the control on the second scan's reading of the 'Dominica vacat' Mass. This is visual evidence, not text: it is not searchable and no negative may be read off it by machine."
