rights_basis = "The volume was published at Sankt Blasien in 1777, and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A could not reach it either: ninety-five years from 1777 ran out in 1872, so nothing remained to restore on 1 January 1996. THE GOOGLE QUESTION WAS DECIDED ON THESE BYTES, BY EYE, because a watermark is a picture and no text probe can see it. This image was opened and read at full width and carries no Google notice anywhere on it -- not in the margins, not in the gutter, not at the foot; the whole visible page is the 1777 printing, with the outer margin of the right-hand column clipped by the scan. The contrast is exact and was checked on the sibling derivation: leaf n227 of item bub_gb_RIkPAAAAIAAJ, the same Google volume, carries \"Digitized by Google\" stamped in grey at the lower right of the page, and every page image from that item is therefore recorded and not retained. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)). NOT RELIED ON: that the item is available, that the download succeeded, or that Internet Archive's \"possible-copyright-status\" field reads NOT_IN_COPYRIGHT."
