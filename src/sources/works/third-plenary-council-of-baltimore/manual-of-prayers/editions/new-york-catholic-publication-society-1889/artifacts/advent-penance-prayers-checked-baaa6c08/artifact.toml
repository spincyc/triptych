rights_basis = "Public domain in the United States by publication date. The edition prints 'Copyright, 1888, by Clarence E. Woodman' (title verso) and Cardinal Gibbons's approval of 17 May 1889 (PDF p. 6): the book was published in the United States in 1889. Its printed 'All rights reserved' is a lapsed nineteenth-century claim. A work published in the United States before 1931 is out of United States copyright: that is the line guidance/missals.md section 5 records from Cornell's public-domain chart, and because it moves every January it is written here as derived for calendar year 2026 and not as a standing rule. This file is literal historical wording of that printing, transcribed and checked against its page images; it adds no translation, paraphrase or editorial wording beyond the declared mechanical normalizations, and the bracketed locators are bare finding labels."
