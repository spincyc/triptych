transformation = "Hand transcription made from the page images, rendered locally with pdftoppm from the registered facsimile; the parent OCR was used only to locate the pages and was diffed word by word against this file afterwards, every difference being resolved on the image. No source text passed through a language model. Typographic quotation marks are rendered as straight ASCII quotes; thin spaces before ? ! ; : are removed; line-end hyphenation is joined (a compound printed with a hyphen keeps it); footnote reference numerals are omitted; italics are not marked; small capitals are rendered in mixed case, with full capitals kept where printed larger. One sense unit per line, each prefixed by a bracketed locator that is a finding label, not printed text. Selected lines only: the fasting and abstinence tables and the closed times for marriage (pp. 18-19), the Act of Contrition (p. 54), the Angelus in Latin and English (pp. 55-56) and the Act of Contrition in the rite of confession (p. 286). Footnote order is moved to follow the list it annotates. The Latin and English Angelus, printed in parallel, are given Latin first."
provenance = "Image check against artifact.third-plenary-council-of-baltimore.manual-of-prayers.new-york-catholic-publication-society-1889.ia-pdf-c64f9d31 on 2026-11-18: PDF pp. 26-27, 62-64 and 294."
notes = "The Angelus prints no 'Ora pro nobis' versicle and response in either language: p. 56 passes from the third Ave/Hail Mary directly to Oremus / Let us pray; this is the printed text, not a lost OCR column. A '(1)' reference mark on THE ANGELUS heading was not resolved to its note. The OCR drops 'until' in 'from Ash Wednesday until Low Sunday'."
