context = "Printed pp. 18-19 (PDF pp. 26-27): the obligation of fasting and abstinence under pain of mortal sin, the abstinence days, and the fasting days, of which the first is 'The Fridays of Advent', with the footnote exempting some dioceses, as in the Province of New Orleans."
notes = "United States discipline of 1889 as this book prints it; it is not current law. The Advent Ember Days are the Wednesday, Friday and Saturday after the third Sunday of Advent; the Christmas Vigil is a fasting day."
physical_line_ranges = [[1, 11]]
text = "It should be borne in mind that these practices of Fasting and Abstinence are not merely penitential works of counsel, recommended to our observance, but acts of mortification of precept, enjoined by laws binding strictly on the conscience; and therefore not to be evaded or omitted without Mortal Sin. ABSTINENCE DAYS. All the Fridays of the Year. Note.—When a Friday happens to be Christmas Day, it is not a day of abstinence. FASTING-DAYS. 1. The Fridays of Advent.* 2. Every Day in Lent; except Sundays. 3. The Four Quarter-Tenses, or Ember-Days, viz.: The Wednesday, Friday, and Saturday following—1. the first Sunday in Lent; 2. Whitsunday; 3. the fourteenth day of September; and, 4. the third Sunday of Advent. 4. The Vigils of Whitsunday, of the Assumption, of All Saints, and of Christmas. Note.—When a Fasting-day falls upon a Sunday, it is kept on the Saturday previous. * In some Dioceses (as in the Province of New Orleans) the Fridays of Advent are not fasting-days."
