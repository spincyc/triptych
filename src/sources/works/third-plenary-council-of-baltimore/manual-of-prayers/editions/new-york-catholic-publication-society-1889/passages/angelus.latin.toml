text = "THE ANGELUS. To be said Morning, Noon, and Night; kneeling, except on Saturday evening and throughout Sunday. Angelus Domini nuntiavit Mariæ. R. Et concepit de Spiritu Sancto. Ave, Maria, etc. V. Ecce ancilla Domini. R. Fiat mihi secundum verbum tuum. Ave, Maria, etc. V. Et Verbum caro factum est. R. Et habitavit in nobis. Ave, Maria, etc. Oremus. Gratiam tuam, quæsumus, Domine, mentibus nostris infunde, ut qui, Angelo nuntiante, Christi filii tui incarnationem cognovimus, per passionem ejus et crucem ad resurrectionis gloriam perducamur; per eumdem Christum Dominum nostrum. Amen."
