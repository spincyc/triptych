physical_line_ranges = [[41, 42]]
text = "While he is giving you Absolution, devoutly bow your head, and with all possible fervor recite the following Act of Contrition: O my God, I am heartily sorry for having offended Thee, and I detest all my sins, because I dread the loss of heaven and the pains of hell, but most of all because they offend Thee, my God, who art all-good and deserving of all my love. I firmly resolve, with the help of Thy grace, to confess my sins, to do penance, and to amend my life."
