text = "The Angel of the Lord declared unto Mary. R. And she conceived by the Holy Ghost. Hail, Mary, etc. V. Behold the handmaid of the Lord. R. Be it done unto me according to Thy word. Hail, Mary, etc. V. And the Word was made Flesh. R. And dwelt among us. Hail, Mary, etc. Let us pray. Pour forth, we beseech Thee, O Lord, Thy grace into our hearts; that as we have known the Incarnation of Christ Thy Son by the message of an Angel, so, by His Passion and Cross, we may be brought to the glory of His resurrection; through the same Christ our Lord. Amen. In Eastertide, instead of the Angelus, the Regina Cœli (p. 78) is said standing."
