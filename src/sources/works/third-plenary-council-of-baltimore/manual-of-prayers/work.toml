description = "The lay prayer book ordered by the Third Plenary Council of Baltimore (1884) and approved by James Cardinal Gibbons on 17 May 1889, companion to the Baltimore catechisms. It prints the ordinary prayers, the seasonal Marian antiphons of Compline in Latin and English, and a full method of reciting the Rosary of the Blessed Virgin Mary with a meditation and a petition for each of the fifteen traditional mysteries. Cited by printed page."
