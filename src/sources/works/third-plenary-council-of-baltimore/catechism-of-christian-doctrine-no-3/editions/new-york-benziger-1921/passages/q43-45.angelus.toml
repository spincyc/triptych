text = "Q. 43. What is the Angelus? A. The Angelus is a prayer giving a brief history of the Incarnation. Q. 44. Say the Angelus. A. The Angel of the Lord declared unto Mary. And she conceived of the Holy Ghost. Hail Mary, &c. Behold the handmaid of the Lord. Be it done unto me according to Thy Word. Hail Mary, &c. And the Word was made flesh. And dwelt among us. Hail Mary, &c. Pray for us, O Holy Mother of God! That we may be made worthy of the promises of Christ. Let us pray: Pour forth, we beseech Thee, O Lord, Thy grace into our hearts that we to whom the Incarnation of Christ Thy Son was made known by the message of an angel, may, by His Passion and cross, be brought to the glory of His resurrection, through the same. Christ Our Lord. Amen. Q. 45. At what time is the Angelus usually said? A. The Angelus is said in the evening, in memory of the Incarnation; in the morning, in memory of the Resurrection, and at noon in memory of the Passion of Our Lord."
