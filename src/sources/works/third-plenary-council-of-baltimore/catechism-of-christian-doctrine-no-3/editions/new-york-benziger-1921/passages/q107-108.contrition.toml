text = "Q. 107. Say the Act of Contrition. A. O my God! I am heartily sorry for having offended Thee, and I detest all my sins, because I dread the loss of heaven and the pains of hell, but most of all because they offend Thee, my God, who art all-good and deserving of all my love. I firmly resolve, with the help of Thy grace, to confess my sins, to do penance, and to amend my life. Q. 108. Give the substance of an Act of Contrition. A. The substance of an Act of Contrition is: I am sorry for my sins, because they have offended God, and I will never sin again."
