text = "Q. 813. Which are the chief spiritual works of mercy? A. The chief spiritual works of mercy are seven: To admonish the sinner, to instruct the ignorant, to counsel the doubtful, to comfort the sorrowful, to bear wrongs patiently, to forgive all injuries, and to pray for the living and the dead. Q. 819. Which are the chief corporal works of mercy? A. The chief corporal works of mercy are seven: To feed the hungry, to give drink to the thirsty, to clothe the naked, to ransom the captive, to harbor the harborless, to visit the sick, and to bury the dead. Q. 820. How may we briefly state the corporal works of mercy? A. We may briefly state the corporal works of mercy by saying that we are obliged to help the poor in all their forms of want."
