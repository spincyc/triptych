notes = "The 1921 Benziger Brothers printing, bearing the imprimaturs of John Cardinal McCloskey (New York, 6 April 1885), Michael Augustine [Corrigan] (New York, 21 February 1901), and Patrick J. Hayes (New York, 29 June 1921), with Archbishop James Gibbons's approval of 6 April 1885, and copyright lines of 1885 (Spalding), 1901 (Kinkead), and 1921 (Benziger Brothers). Published in the United States in 1921 and therefore public domain in the United States. Catalog-level record: no exact artifact bytes are retained here. A complete page-imaged exemplar is publicly delivered by the Internet Archive as item catechismofchris00unse; consumers collating prayer texts record the exact leaves inspected locally."
