rights_basis = "Public domain in the United States by publication date. The title page (PDF p. 3) and its imprimatur and copyright leaf (PDF p. 4) identify the 1921 Benziger Brothers printing 'In Accordance with the New Canon Law', with copyright lines of 1885, 1901 and 1921: it was published in the United States in 1921. A work published in the United States before 1931 is out of United States copyright: that is the line guidance/missals.md section 5 records from Cornell's public-domain chart, and because it moves every January it is written here as derived for calendar year 2026 and not as a standing rule. This file is literal historical wording of that printing, transcribed and checked against its page images; it adds no translation, paraphrase or editorial wording beyond the declared mechanical normalizations, and the bracketed locators are bare finding labels."
