transformation = "Hand transcription made from the page images, rendered locally with pdftoppm from the registered facsimile; the parent OCR was used only to locate the pages and was diffed word by word against this file afterwards, every difference being resolved on the image. No source text passed through a language model. Typographic quotation marks are rendered as straight ASCII quotes; thin spaces before ? ! ; : are removed; line-end hyphenation is joined (a compound printed with a hyphen keeps it); footnote reference numerals are omitted; italics are not marked; small capitals are rendered in mixed case, with full capitals kept where printed larger. One sense unit per line, each prefixed by a bracketed locator that is a finding label, not printed text. Selected questions only: the Act of Contrition among the prayers (p. 6), questions 43-45 on the Angelus (pp. 14-15), 107-108 (p. 27) and 813, 819-820 on the works of mercy (pp. 171-173)."
provenance = "Image check against artifact.third-plenary-council-of-baltimore.catechism-of-christian-doctrine-no-3.new-york-benziger-1921.ia-pdf-508f4e3f on 2026-11-18: PDF pp. 8, 16-17, 29 and 173-175."
notes = "The Angelus collect prints a stop-like mark after 'through the same' before 'Christ Our Lord'; it is on the page and in the OCR and is kept. The p. 6 Act of Contrition has a semicolon after 'hell', Q. 107 a comma; neither has Amen."
