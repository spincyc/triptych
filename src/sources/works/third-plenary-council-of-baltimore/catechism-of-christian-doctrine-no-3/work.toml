description = "The graded No. 3 catechism of the Baltimore series descending from the catechism approved by Archbishop James Gibbons on 6 April 1885 as ordered by the Third Plenary Council of Baltimore. Its opening Prayers section prints the received English texts of the Lord's Prayer, the Angelical Salutation (Hail Mary), the Apostles' Creed, and other common prayers; the Doxology and the Rosary are treated in the question-and-answer lessons. Cited by printed page and question number."
