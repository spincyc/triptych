description = "Sicard of Cremona's summa on the ecclesiastical offices. Book VIII chapter 14 is the chapter on the Fourteenth Sunday after Pentecost, read for this run on the page image at column 596: Sicard opens on the Introit 'Protector noster' and reads the Gospel as the ten lepers, and his September historia for the Sunday is Tobias. The composition date is not established in this registration and is therefore not recorded."
