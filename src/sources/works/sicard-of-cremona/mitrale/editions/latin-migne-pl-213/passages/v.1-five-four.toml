text = "In officialibus autem quibusdam, ut in lectionario et evangeliario quinque notantur hebdomadæ propter quinque ætates sæculi præcedentis, in quibus præcessit venturi præconium Salvatoris: et in quibus electi fuere, qui credidere, speravere et dilexere Adventum Domini. In quibusdam vero, ut in antiphonario et graduali duntaxat quatuor attitulantur propter legem, psalmos, prophetias et gentilium libros, in quibus omnibus adventus Domini prænotabatur."
