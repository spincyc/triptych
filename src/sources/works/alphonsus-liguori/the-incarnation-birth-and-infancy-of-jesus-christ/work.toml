title = "The Incarnation, Birth and Infancy of Jesus Christ; or, The Mysteries of the Faith"
responsible = "Alphonsus Liguori"
work_type = "devotional-meditations"
alternate_titles = ["The Mysteries of the Faith: The Incarnation", "Novena del Santo Natale (the Novena of Christmas)", "Meditations for Every Day of Advent"]
languages = ["it"]
description = "Alphonsus's Christmas-cycle writings in the arrangement of Eugene Grimm's English Centenary Edition, volume IV: the discourses for the Novena of Christmas, meditations for every day of Advent, meditations for the Novena, and further meditations and devotions. A locus names a section and a meditation number, for example advent.14 or novena.1."
composed = "1750-1758 for the Novena of Christmas; the other parts are not dated here"
composed_basis = "The editor's notice printed at p. 12 of the 1886 Grimm edition says that Alphonsus wrote the following little work in 1750 but did not publish it until 1758. The notice stands before the Novena discourses; it is not established here that it covers the Advent meditations, and no Italian edition was read."
