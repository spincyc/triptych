text = "Meditations for the Novena for Christmas.* * Further on, page 300, we shall find another Novena of meditations with the chaplet to be recited before every meditation. MEDITATION I. December 16. God has given Us his only Son to save Us. Consider that the Eternal Father addressed these words to the Infant Jesus at the instant of his conception: I have given Thee to be the light of the Gentiles, that Thou mayest be My salvation. MEDITATION II. December 17. Bitterness of the Heart of Jesus in the Womb of his Mother. Consider the great bitterness with which the heart of the Infant Jesus must have felt itself afflicted and oppressed in the womb of Mary at the first moment when his Father proposed to his consideration all the series of contempt, sorrow, and agonies which he was to suffer during his life, to deliver men from their miseries: In the morning He wakeneth my ear, and I do not resist; I have given my body to the strikers. MEDITATION III. December 18. Jesus made Himself a Child to gain our Confidence and our Love. Consider that after so many centuries, after so many prayers and sighs, the Messias, whom the holy patriarchs and prophets were not worthy to see, whom the nations sighed for, \"the Desire of the eternal hills,\" our Saviour, is come; MEDITATION IV. December 19. The Passion of Jesus lasted during His Whole Life. Consider that in the first moment that the soul of Jesus Christ was created and united to his little body in the womb of Mary, the Eternal Father intimated to his Son his will that he should die for the redemption of the world; MEDITATION V. December 20. Jesus Offered Himself for our Salvation from the Beginning. The divine Word, from the first instant that he was made man and an infant in Mary's womb, offered himself of his own accord to suffer and to die for the ransom of the world: He was offered because it was His own will. MEDITATION VI. December 21. Jesus a Prisoner in the Womb of Mary. Consider the painful life that Jesus Christ led in the womb of his Mother, and the long-confined and dark imprisonment that he suffered there for nine months. MEDITATION VII. December 22. The Sorrow that the Ingratitude of Men has caused Jesus. In these days of the holy Nativity St. Francis of Assisi went about the highways and woods with sighs and tears and inconsolable lamentations. MEDITATION VIII. December 23. The Love of God manifested to Men by the Birth of Jesus. Consider that by the grace that is said here to have appeared is meant the tender love of Jesus Christ towards men,—a love that we have not merited, which therefore is called \"grace.\" MEDITATION IX. December 24. Saint Joseph goes to Bethlehem with His Holy Spouse. God had decreed that his Son should be born not in the house of Joseph, but in a cavern and stable of beasts, in the poorest and most painful way that a child can be born; and therefore he caused Cæsar to publish an edict, by which people were commanded to go and enroll themselves, every one in his own city whence he drew his origin."
