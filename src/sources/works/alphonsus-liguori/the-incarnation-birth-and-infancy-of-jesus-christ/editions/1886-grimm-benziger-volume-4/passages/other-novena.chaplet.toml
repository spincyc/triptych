text = "Other Meditations for the Novena of Christmas. Chaplet to be recited before every Meditation. 1. My most sweet Jesus, who wert born in a cave and wert afterwards laid in a manger upon straw, have mercy upon us. R. Have mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 2. My most sweet Jesus, who wert presented and offered by Mary in the temple, to be afterwards one day sacrificed for us upon the cross, have mercy upon us. R. Have Mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 3. My most sweet Jesus, who wert persecuted by Herod and constrained to fly into Egypt, have mercy upon us. R. Have mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 4. My most sweet Jesus, who didst dwell in Egypt for seven years, poor, unknown, and despised by that barbarous nation, have mercy upon us. R. Have mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 5. My most sweet Jesus, who didst return to Thy country to be one day crucified there in the midst of two thieves, have mercy upon us. R. Have mercy O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 6. My most sweet Jesus, who at the age of twelve years didst remain in the temple to dispute with the Doctors, and after three days wert found by Mary, have mercy upon us. R. Have mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 7. My most sweet Jesus, who didst live concealed from the world for so many years in the shop at Nazareth, serving Mary and Joseph, have mercy upon us. R. Have mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 8. My most sweet Jesus, who for three years before Thy Passion didst go about preaching and teaching the way of salvation, have mercy upon us. R. Have mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc. 9. My most sweet Jesus, who for the love of us didst terminate Thy life by dying on the cross, have mercy upon us. R. Have mercy, O Lord, have mercy upon us. Our Father, Hail Mary, Glory be to the Father, etc."
