notes = "The notice dates the writing to 1750 and publication to 1758 and fixes the first day of the Christmas novena on 16 December. It is signed '-Ed.' and is Grimm's, not Alphonsus's."
physical_line_ranges = [[1, 3]]
text = "St. Alphonsus wrote the following little work in 1750; but his infirmities and his many duties did not permit him to publish it till the year 1758. By a Novena we mean the nine days that precede a feast; the first day of the novena of Christmas is, therefore, the 16th of December. These discourses may serve either for meditation or for spiritual reading. After the discourses will be found novenas of meditations and of prayers. There is also added a list of the indulgences attached to this exercise.—Ed."
