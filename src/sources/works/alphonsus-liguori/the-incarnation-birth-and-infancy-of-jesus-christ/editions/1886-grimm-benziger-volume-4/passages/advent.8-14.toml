context = "Advent meditations VIII-XIV (Second Sunday to Second Saturday), printed pp. 190-205, with the footnote to Meditation XIV on p. 204: '* On December 16 we begin the Novena, page 214.'"
notes = "The switch footnote belongs to Meditation XIV (Second Saturday), p. 204, not to XVIII. The Advent series therefore yields to the Novena on 16 December whatever its count; in 2026 (Advent Sunday 29 November) Meditation XVIII falls on 16 December, the day of Novena I."
physical_line_ranges = [[63, 91]]
text = "MEDITATION VIII. Second Sunday. God Sends His Son to die in order to restore us to Life. Consider that sin is the death of the soul; because this enemy of God deprives us of divine grace, which is the life of the soul. MEDITATION IX. Second Monday. The Love that the Son of God has shown us in the Redemption. Consider that the eternal Word is that God who is so infinitely happy in himself that his happiness cannot be greater than it is, nor could the salvation of all mankind have added anything to it or have diminished it; MEDITATION X. Second Tuesday. Jesus, the Man of Sorrows, from the Womb of His Mother. Thus does the prophet Isaias designate our Lord Jesus Christ \"the man of sorrows;\" yes, because this man was created on purpose to suffer, and from his infancy began to endure the greatest sorrows that any man ever suffered. MEDITATION XI. Second Wednesday. Jesus charged with the Sins of the Whole World. Consider that the divine Word, in becoming man, chose not only to take the form of a sinner, but also to bear all the sins of men, and to satisfy for them as if they were his own: He bore their iniquities. MEDITATION XII. Second Thursday. Jesus suffers during His Whole Life. Consider that all the sufferings and ignominy that Jesus endured in his life and death, all were present to him from the first moment of his life: My sorrow is continually before me; and even from his childhood he began to offer them in satisfaction for our sins, beginning even then to fulfil his office of Redeemer. MEDITATION XIII. Second Friday. Jesus wished to suffer so much in order to gain our Hearts. Consider that Jesus suffered, even from the first moment of his life, and all for the love of us. MEDITATION XIV.* Second Saturday. The Greatest Sorrow of Jesus. Jesus Christ revealed to the Venerable Agatha of the Cross that whilst he was in his Mother's womb, that which afflicted him more than any other sorrow was the hardness of the hearts of men, who should, after his Redemption, despise the graces which he came into the world to diffuse. * On December 16 we begin the Novena, page 214."
