physical_line_ranges = [[92, 107]]
text = "MEDITATION XV. Second Sunday. The Poverty of the Infant Jesus. The Holy Church, in contemplating this great mystery and prodigy of a God being born in a stable, exclaims, full of admiration, \"O great mystery! O wonderful sacrament! for animals to behold the Lord lying in a manger.\" MEDITATION XVI. Third Monday. Jesus is the Fountain of Grace. Consider the four fountains of grace that we have in Jesus Christ, as contemplated by St. Bernard. MEDITATION XVII. Third Tuesday. Jesus the Charitable Physician of our Souls. Your physician will come, says the prophet, to cure the infirm; and he will come swiftly like the bird that flies, and like the sun, which on rising from the horizon, instantly sends its light to the other pole. MEDITATION XVIII. Third Wednesday. We should hope all Things from the Merits of Jesus Christ. Consider that, since the Eternal Father has given us his own Son to be our mediator and advocate with him, and the victim in satisfaction for our sins, we cannot despair of obtaining from God whatever favor we ask of him, if we avail ourselves of the help of such a Redeemer."
