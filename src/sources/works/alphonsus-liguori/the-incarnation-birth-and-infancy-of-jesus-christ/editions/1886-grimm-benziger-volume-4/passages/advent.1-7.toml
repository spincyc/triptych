text = "Meditations for Every Day of Advent. MEDITATION I. First Sunday. Goodness of God in the Work of the Redemption. Consider that God, having created the first man, in order that he might serve him and love him in this life, and be conducted afterwards to reign with him forever in Paradise, enriched him for this end with knowledge and grace. But ungrateful man rebelled against God, refusing him the obedience which he owed him in justice and gratitude; and thus, miserable sinner, was he left with all his posterity as a rebel, deprived of divine grace, and forever excluded from paradise. MEDITATION II. First Monday. Grandeur of the Mystery of Incarnation. Our Lord sent St. Augustine to write upon the heart of St. Mary Magdalene of Pazzi the words, And the Word was made flesh. MEDITATION III. First Tuesday. The Love of God for Men. Consider that the eternal Father, in giving us his Son for a Redeemer, for victim and price of our ransom, could not have given us stronger motives for hope and love, to inspire us with confidence, and to oblige us to love him. MEDITATION IV. First Wednesday. The Word was made Man in the Fulness of Time. Consider that God allowed four thousand years to pass, after the transgression of Adam, before he sent his Son upon earth to redeem the world. MEDITATION V. First Thursday. The Abasement of Jesus. The eternal Word descends on earth to save man; and whence does he descend? His going out is from the end of heaven. MEDITATION VI. First Friday. Jesus enlightens the World and glorifies God. Before the coming of the Messias the world was buried in a dark night of ignorance and sins. MEDITATION VII. First Saturday. The Son of God was laden with all our Iniquities. Consider the humble state to which the Son of God chose to abase himself; he not only vouchsafed to take upon him the form of a servant, but that of a sinful servant: In the likeness of sinful flesh."
