rights_basis = "Public domain in the United States by publication date. The approbation leaf (PDF p. 10) prints 'Copyright, 1886, by Elias Frederick Schauer.': the English text was published in the United States in 1886. This copy's title page reads SECOND EDITION and is undated; the leaves read carry no later notice, and a reprint of the 1886 text adds no new term to it. A work published in the United States before 1931 is out of United States copyright: that is the line guidance/missals.md section 5 records from Cornell's public-domain chart, and because it moves every January it is written here as derived for calendar year 2026 and not as a standing rule. This file is literal historical wording of that printing, transcribed and checked against its page images; it adds no translation, paraphrase or editorial wording beyond the declared mechanical normalizations, and the bracketed locators are bare finding labels."
