notes = "Read on 2026-11-18 on the page images of Internet Archive item incarnationofjes04liguuoft (Regis College copy, University of Toronto). The title page (PDF p. 9) names St. Alphonsus de Liguori, 'EDITED BY REV. EUGENE GRIMM, Priest of the Congregation of the Most Holy Redeemer', 'SECOND EDITION', and is undated. The approbation leaf (PDF p. 10) prints Elias Fred. Schauer's sanction of 'The Mysteries of the Faith - The Incarnation' as vol. IV of the Centenary Edition, Baltimore, September 8, 1886, and 'Copyright, 1886, by Elias Frederick Schauer.' The date recorded is that copyright year: this copy's own printing year is not printed. PDF page = printed page + 4 in the body. Section map: contents pp. 7-8; editor's notice p. 12; Meditations for Every Day of Advent I-XVIII pp. 172-213; Meditations for the Novena for Christmas I-IX pp. 214-237; Other Meditations for the Novena with the chaplet pp. 300-301. Printed irregularities seen: Meditation XV is headed 'Second Sunday.' though by sequence it is the Third Sunday; several running titles differ from the contents wording (recorded in the checked transcription's notes)."
