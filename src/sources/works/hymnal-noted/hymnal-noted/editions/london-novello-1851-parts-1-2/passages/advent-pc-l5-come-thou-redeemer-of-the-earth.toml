physical_line_ranges = [[1, 8]]
text = "Come, Thou Redeemer of the earth, Come, testify Thy Virgin-birth: All lands admire, all times applaud: Such is the birth that fits a God. Proceeding from His Chamber free, The royal hall of chastity, Giant of twofold substance, straight His destin'd way He runs elate. From God the Father He proceeds: To God the Father back He speeds: Proceeds, as far as very hell; Speeds back, to light ineffable. Thy cradle here shall glitter bright, And darkness breathe a newer light; Where endless faith shall shine serene, And twilight never intervene."
