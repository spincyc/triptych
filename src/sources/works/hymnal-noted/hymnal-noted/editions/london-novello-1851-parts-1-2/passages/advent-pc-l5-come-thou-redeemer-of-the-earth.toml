notes = "The translator is not named on these pages; the held NPNF2-10 (New York 1896) note on Ambrose's hymn calls the version with The royal hall of chastity Dr. Neale's, in the Hymnal Noted. In stanza 1 the hyphen of Virgin-birth may be a syllable hyphen of the underlay; quote stanzas 4, 5 and 7 when that matters."
