notes = "The Gospel according to Mark. One LF-delimited header line followed by one physical line per verse in chapter,verse,text form, except where a quoted verse text itself contains a newline; verse text carries accents, breathings, and inline {NA ...} or {Byz ...} apparatus braces. Because the apparatus braces sit inside the verse text, a raw literal search over this artifact can match apparatus wording as well as edition wording; the artifact is registered as a citable exact witness rather than as a search representation. Chapter and verse numbers are the Greek edition's own and differ in places from the Clementine Vulgate numbering the Douay-Rheims follows."
