notes = "The repository distributes Robinson's official BETA-code CCAT and Strong's files together with Unicode CSV forms generated from them by the repository's own conversion scripts; the repository states that Robinson's files remain the source of truth and that all code and text in it are in the public domain. The registered artifacts are the CSV form, not Robinson's official files, and their conversion input has not been separately acquired or hashed here. In-line braces mark apparatus notes: {NA x > y} records a Nestle-Aland divergence and {Byz x > y} an internal Byzantine variant. The apparatus is a divergence note, not a full critical apparatus."
