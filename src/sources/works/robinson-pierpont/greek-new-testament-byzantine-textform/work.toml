description = "Robinson and Pierpont's edition of the Greek New Testament following the Byzantine textform, published in 2005 and revised in 2018. The maintained editions carry an apparatus recording Byzantine internal variants and divergences from the Nestle-Aland and Editio Critica Maior texts. The edition represents one textual tradition and is not a critical eclectic text; consumers state which readings they rely on and whether the apparatus records a divergence there."
