title = "Praying Together, the 1998 revision of the ELLC common liturgical texts"
language = "en"
publication = "English Language Liturgical Consultation, 1998. The texts and the Consultation's commentary on each are published on the Consultation's own site at https://www.englishtexts.org/, one page per text."
date = "1998"
notes = "The 1998 revision supersedes the International Consultation on English Texts' Prayers we have in common (1970, 1971, 1975), whose texts remain in use in some churches and which the Consultation's reproduction guidelines cover under a parallel acknowledgement. The Consultation prepares the texts in standard American spelling and expects other standards to be substituted where preferred, and it expects the printed sense lines to be kept; both expectations are recorded here rather than acted on, and the texts are carried exactly as the site sets them. This edition is dated by the copyright year the Consultation's own acknowledgement wording requires; the site state actually read is fixed by the exact hashes on this edition's artifacts."
