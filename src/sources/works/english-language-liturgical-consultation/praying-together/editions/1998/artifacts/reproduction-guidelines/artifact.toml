notes = "This is the document that bounds the grant, and the bound matters here. It repeats the permission for the liturgical texts and then states the exception: \"The reproduction of other texts from Praying Together such as the Introduction or notes on each text, does require permission from the Secretary.\" Each text's page on the Consultation's site carries such notes below the text; none of them is reproduced by this project. It also states two expectations about presentation - that the printed sense lines be kept, and that a modified or adapted text carry \"(adapted)\" in its acknowledgement - and gives the parallel acknowledgement for the older ICET texts."
