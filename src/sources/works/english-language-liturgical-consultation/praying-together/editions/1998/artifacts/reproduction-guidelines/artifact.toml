rights_basis = "The Consultation's own guidance document, dated July 2017. Its final section permits free reproduction of ELLC material other than the liturgical texts for non-commercial use, which would very likely cover retaining this file; the question was not settled, and it does not need to be, because nothing here reuses the document's wording beyond the grant it states. The bytes are recorded and not retained."
