rights_basis = "The rightsholder grants free use in terms, on its own permissions page and again in its Guidelines for Reproducing ELLC Texts: \"The texts in Praying Together may be used freely and without the need for prior permission. The liturgical text(s) should be properly acknowledged.\" Both statements were read from bytes fetched and hashed by this project on 2026-07-31 and are registered as the sibling permissions-page and reproduction-guidelines artifacts. The grant is to the liturgical texts only; the Consultation's introduction and its notes on each text are expressly excluded and nothing here reproduces them. The acknowledgement the grant requires is: English translations of the Kyrie eleison, Gloria in excelsis, the Nicene Creed, the Apostles' Creed, the Sursum corda, the Sanctus and Benedictus, the Agnus Dei, the Lord's Prayer and the Gloria Patri, (c) 1998, English Language Liturgical Consultation (ELLC), and used by permission. www.englishtexts.org. That wording must travel with the text to every place it is served; it is carried in the ordo-missae inventory that consumes this artifact and rendered by the browser at the point of use."
