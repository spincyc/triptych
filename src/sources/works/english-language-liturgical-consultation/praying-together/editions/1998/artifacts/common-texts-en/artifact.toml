rights_basis = "The rightsholder grants free use in terms, on its own permissions page and again in its Guidelines for Reproducing ELLC Texts: \"The texts in Praying Together may be used freely and without the need for prior permission. The liturgical text(s) should be properly acknowledged.\" Both statements were read from bytes fetched and hashed by this project on 2026-07-31 and are registered as the sibling permissions-page and reproduction-guidelines artifacts. The grant is to the liturgical texts only; the Consultation's introduction and its notes on each text are expressly excluded. The acknowledgement the grant requires is: English translations of the Kyrie eleison, Gloria in excelsis, the Nicene Creed, the Apostles' Creed, the Sursum corda, the Sanctus and Benedictus, the Agnus Dei, the Lord's Prayer and the Gloria Patri, (c) 1998, English Language Liturgical Consultation (ELLC), and used by permission. www.englishtexts.org. The grant also expects the printed sense lines to be kept. The former tracked TSV did preserve one physical row per sense line, but its raw public-Git/download surface did not carry the required acknowledgement at the point of use and the repository's assembled Day/Missal surfaces cannot treat this ecumenical text as approved Roman-Rite English. The payload is therefore removed from the current tree and this record is text-free, restricted source evidence. A future explicitly labelled non-recitation source-study view would require a separate surface decision proving that the exact acknowledgement and sense lines travel with every served copy."
