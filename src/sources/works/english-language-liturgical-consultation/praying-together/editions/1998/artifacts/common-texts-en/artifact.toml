transformation = "The nine text pages named in the source_url column were fetched over HTTPS with curl and parsed locally with a Python script; nothing passed through a model. Only the `<div class=\"Prayer\">` block of each page was read. Its sibling `<div class=\"notes\">` block, which carries the Consultation's commentary and lies outside the grant, was never touched. Each `<li>` sense line became one row, in printed order, with its `class` attribute carried through verbatim in `line_class` as the printed indentation cue rather than interpreted; each `<h1>` became the row's `printed_title` and each `<h3>` opened a new element key. Text was HTML-unescaped and internal whitespace collapsed to single spaces; no word, spelling or punctuation mark was changed, and American spelling is left as the Consultation sets it."
