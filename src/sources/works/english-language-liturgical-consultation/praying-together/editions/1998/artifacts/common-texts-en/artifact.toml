notes = "One header line and 121 data lines, one physical line per sense line, with no embedded tabs or newlines. Columns: seq, element_key, printed_title, line, line_class, text, source_url. Thirteen element keys: kyrie, gloria-in-excelsis, nicene-creed, apostles-creed, sursum-corda, sanctus-benedictus, agnus-dei, agnus-dei-alternative, lords-prayer, and gloria-patri-layout-1 through -3. THIS IS NOT THE ROMAN MISSAL'S ENGLISH and must never be served as though it were. It is the ecumenical text; the Roman Missal's is the International Commission on English in the Liturgy's, and the two differ where a reader will notice at once - here the Sursum corda answers \"And also with you\" and the Nicene Creed opens \"We believe in one God\", against \"And with your spirit\" and \"I believe in one God\" in the 2011 Roman Missal. Three things the site's own pages do that are reproduced as found rather than corrected: the Sanctus page sets a stray bare paragraph \"Hosanna in the highest.\" above its list, which is not part of the list and is therefore not carried; the Gloria Patri is given in three alternative line layouts of one text, all three carried; and Layout 3 of the Gloria Patri prints \"and to the Son,.\" with both a comma and a stop, which stands as the page sets it. The Agnus Dei is given in two forms, the Consultation's own and a more traditional alternative, and both are carried because the choice between them is the reader's and not this project's. Not a liturgical book: nothing here is approved for use in the Roman Rite by the fact of being recorded."
