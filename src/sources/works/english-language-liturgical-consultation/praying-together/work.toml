description = "The ecumenical English translations of the liturgical texts the Western churches hold in common: the Lord's Prayer, Kyrie eleison, Gloria in excelsis, the Nicene and Apostles' Creeds, the Sursum corda, the Sanctus and Benedictus, the Agnus Dei, the Gloria Patri, the Te Deum, and the three gospel canticles. ELLC is an ecumenical consultation of English-speaking liturgical bodies and is not an organ of any one church. These translations are therefore NOT the approved liturgical English of the Roman Rite: the Roman Missal's English is the International Commission on English in the Liturgy's, a different body with a different text, and the two must never be conflated. Where the two are compared the difference is visible at once - this work reads 'And also with you' where the 2011 Roman Missal reads 'And with your spirit', and 'We believe in one God' where it reads 'I believe in one God'."
relations = ["work.catholic-church.missale-romanum"]
