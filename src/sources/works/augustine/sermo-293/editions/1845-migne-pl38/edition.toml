notes = "Registered on the pattern of the companion editions edition.augustine.sermo-185.1845-migne-pl38 and edition.augustine.sermo-191.1845-migne-pl38: the edition is the sermon as Migne prints it, and the whole-volume PDF (artifact.augustine.sermo-185.1845-migne-pl38.ia-pdf-829acec8) and optical text layer are filed under the Sermo 185 edition, whose notes give the title-page evidence and the Google Books origin of the scan. Section 3 begins in column 1328 (PDF page 671) and continues in column 1329 (PDF page 672): in this stretch columns 2n-1 and 2n stand on PDF page n+7, as that edition's notes record for columns 997-1010."
