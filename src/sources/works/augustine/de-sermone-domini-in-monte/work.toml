description = "Augustine's two books on the Sermon on the Mount. Book II covers Matthew 6 and 7 and therefore the whole of the Gospel of the Roman Fourteenth Sunday after Pentecost, Matthew 6:24-33. The composition date is not established in this registration and is therefore not recorded. Registered here only in English: the Latin was not retrieved by any lane of this run and this stage does not retrieve, so the pair is half-filled and the half that is missing is the original, which is the half that could settle a question about Augustine's own wording. guidance/sources.md counts 169 works held here only in translation and asks that the backlog not be added to; this is one addition to it, made knowingly, because the alternative was to leave a source a lane actually read unregistered."
