description = "Augustine's second sermon In Natali Domini in the Maurist numbering, on Psalm 84:12, Truth is sprung out of the earth. Modern sermon numbering calls it Sermo 185; the Maurists record its older title as sermon 62 de diversis. A locus is the sermon number and the Maurist section."
