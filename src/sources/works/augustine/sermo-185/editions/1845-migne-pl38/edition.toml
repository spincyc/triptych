notes = "Registered on the pattern this library uses for a constituent of a Migne volume: the edition is the sermon as Migne prints it, and the artifacts are the Internet Archive's derivatives of the whole volume, the narrowest exact witness actually retrieved. The scanned copy is a Google Books digitization (Google Books id _iZKAAAAcAAJ) re-uploaded to the Internet Archive as item patrologiae_cursus_completus_lat_vol_038. Its series title page (PDF page 8, read on the image) reads Patrologiae Tomus XXXVIII. S. Aurelii Augustini Tomus Quintus (Pars Prior) and is dated 1845, and the Augustine Opera Omnia title page that follows (PDF page 10, read on the image) is dated 1841; the edition is dated by the series title. Printed column 2n-1 and 2n stand on PDF page n+7 in this stretch (columns 997-998 on PDF page 506; columns 1009-1010 on PDF page 512). Sermo CLXXXV, In Natali Domini II, begins in column 997 with Maurist note (a) Alias, de Diversis 62, and note (b), which records that the Navarre codex gives the sermon to Maximus and the other manuscripts to Augustine, whose style and mind the Maurists find in it. The whole-volume PDF and optical text layer are filed here; the companion edition edition.augustine.sermo-191.1845-migne-pl38 cites them."
