rights_basis = "The volume was published at Paris in 1845 (series title page, artifact PDF page 8, read on the image: Patrologiae Tomus XXXVIII. S. Aurelii Augustini Tomus Quintus (Pars Prior), J.-P. Migne, Petit-Montrouge, 1845; the Augustine Opera Omnia title page at PDF page 10 is dated 1841), and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A could not reach it: ninety-five years from 1845 ran out in 1940. The scan is Google's digitization of a library copy (the PDF producer is Google Books PDF Converter; Google Books id _iZKAAAAcAAJ), re-uploaded to the Internet Archive; a faithful mechanical reproduction adds no original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191, S.D.N.Y. 1999). Google's shorter front matter (This is a reproduction of a library book that was digitized by Google ...) is artifact PDF page 1, and the text pages carry the Digitized by Google page-foot stamp; both are Google's prose, not the book's, kept in the exact bytes and disposed of under src/sources/inventories/google-usage-guidelines-rights-v1.toml, never quoted, cited or counted as Migne's or Augustine's text and not licensed under Triptych's licence. Non-Google Internet Archive scans of volume 38 exist (microfilm items bim_early-english-books-1641-1700_patrologiae-cursus-completus-_1845_38, PDF 569,683,930 bytes, and bim_early-english-books-1641-1700_1858_38, PDF 491,259,367 bytes, from their file listings); they were not fetched or compared for legibility in this lane, so whether the rule's preference for an equally complete and legible non-Google scan applies is open. No host rights label is relied on. The whole PDF is not retained for its measured size alone."
