notes = "The quoted scripture (Veritas de terra orta est, et justitia de cœlo prospexit; Surge, qui dormis ...) is printed in italic, with references Psal. LXXXIV, 12 and Ephes. V, 14 in parentheses (omitted). The page reads Expergiscere, homo: pro te Deus factus est homo, with no quia. Maurist note (b) on the heading records that the Navarre codex gives the sermon to Maximus and the other manuscripts to Augustine. No public-domain English translation of this sermon was found (see the lane bank)."
