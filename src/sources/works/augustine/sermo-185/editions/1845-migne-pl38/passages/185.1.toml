context = "Section 1 of Sermo CLXXXV, In Natali Domini II, whole, from Natalis Domini dicitur in column 997 to Perisses, nisi venisset in column 998, after the italic chapter summary Verbi incarnatione Veritas orta de terra (omitted)."
physical_line_ranges = [[1, 17]]
text = "Natalis Domini dicitur, quando Dei Sapientia se demonstravit infantem, et Dei Verbum sine verbis vocem carnis emisit. Illa tamen occulta divinitas, et Magis cœlo teste significata, et pastoribus angelica voce nuntiata est. Hanc igitur anniversaria solemnitate celebramus diem, qua impleta est prophetia dicens: Veritas de terra orta est, et justitia de cœlo prospexit. Veritas quæ est in sinu Patris, de terra orta est, ut esset etiam in sinu matris. Veritas qua mundus continetur, de terra orta est, ut femineis manibus portaretur. Veritas qua beatitudo Angelorum incorruptibiliter alitur, de terra orta est, ut carnalibus uberibus lactaretur. Veritas cui cœlum non sufficit, de terra orta est, ut in præsepio poneretur. Cujus bono in tanta humilitate venit tanta sublimitas? Nulli utique suo; sed magno, si credimus, nostro. Expergiscere, homo: pro te Deus factus est homo. Surge, qui dormis, et exsurge a mortuis, et illuminabit te Christus. Pro te, inquam, Deus factus est homo. In æternum mortuus esses, nisi in tempore natus esset. Nunquam liberareris a carne peccati, nisi suscepisset similitudinem carnis peccati. Perpetua te possideret miseria, nisi fieret hæc misericordia. Non revixisses, nisi tuæ morti convenisset. Defecisses, nisi subvenisset. Perisses, nisi venisset."
