notes = "A dated web delivery of a public-domain nineteenth-century translation, read as a reception witness and not as textual control over the Latin. The page prints '[XCVIII. Ben.]' as its own heading, which is what fixes this English Sermon 48 as Sermo 98 in the Benedictine numbering; nothing on the page states the translator's name, and the attribution to MacMullen is taken from the printed volume's own table and not from these bytes."
