notes = "A dated Latin web delivery, not a critical edition. The site's internal file number is 127 while its own heading and sermon concordance identify modern Sermo 98 and the older New Testament Sermon 48; the file number is not the sermon number and must not be cited as one. The site reproduces the Maurist text as printed in Migne, Patrologia Latina 38, cols. 591-595. Language pairing: this is the work's original Latin, and the English is registered beside it at edition.augustine.sermo-98.english-npnf1-6-new-advent-web-2026-09-05, so both members of the pair are held."
