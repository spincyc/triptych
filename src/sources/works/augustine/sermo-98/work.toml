composed = "c. 410-412"
composed_basis = "A sermon preached at Carthage or Hippo; the Maurist and later chronologies place it in the first years of the fifth century. The date is the preaching, not Migne's 1841 printing nor the 1888 English translation."
alternate_titles = ["Sermon 98", "Sermon 48 on the New Testament", "De verbis Evangelii Lucae 7"]
languages = ["la"]
locus_pattern = '98\.[1-7](?:-[1-7])?'
description = "Augustine's sermon on the appointed Gospel of the Fifteenth Sunday after Pentecost, Luke 7:11-16, which reads the three raisings the Gospels record as three grades of sin: the girl raised inside the house, the young man carried out of the gate, and Lazarus four days buried. Modern sermon numbering calls it Sermo 98; the older English New Testament series calls the same work Sermon 48. A locus is 98 followed by the section number."
