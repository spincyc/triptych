description = "Augustine’s unfinished literal exposition of Genesis, CPL 268. Distinct from the twelve-book De Genesi ad litteram (CPL 266), already registered separately. The known commentary discovery index names this work in its own right. The acquired English expression runs from section 1.1 through 16.62 and ends in the exposition of Genesis 1:26–27. The translator identifies 16.61–62 as later additions reported in Retractations 1.18; those additions are not treated as an independently dated witness."
