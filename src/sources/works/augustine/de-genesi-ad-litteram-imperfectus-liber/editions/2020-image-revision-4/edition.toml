notes = "Complete revision 4: title and English sections 1.1–16.62, with translator’s headings, explanatory material and source notice. PDF has 25 pages. Its own note identifies PL 34, column 219 and CSEL 28, pp. 457–503 as Latin locations. Revision 4 source note expressly releases this translation into the public domain. This is not the twelve-book Literal Meaning of Genesis translated by John Hammond Taylor or Edmund Hill. Exact PDF and Word deliveries were retrieved and hashed; searchable plaintext is retained. Entire native text was acquired; only the named passage sections received bounded wording and locus inspection."
