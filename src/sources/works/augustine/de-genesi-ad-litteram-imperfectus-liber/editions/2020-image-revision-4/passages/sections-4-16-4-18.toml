physical_line_ranges = [[121, 137]]
text = "(4.16) And God’s Spirit passed over the water. It did not ‘pass over’ like oil on water or water on the earth, where the liquid is contained. If physical analogies are to be used, then a better one is that it passed like sunlight or moonlight over the bodies they illuminate. These bodies do not contain the light; the sky contains the light, which ‘passes over’ the bodies. Also, we should be careful not to think that God’s Spirit ‘passed over’ the primordial matter like through physical space. Rather, it was like a power that creates and crafts what it passes over, the way a craftsman’s intention passes over wood or whatever he is working on – or indeed over his own limbs as he moves them to do the work. This last simile is better than any other physical one, but it is still poor, indeed almost useless in explaining how God’s Spirit ‘passes’ while fashioning the world-matter. But I can’t think of a better or closer analogy for this out of things more or less intelligible to humans. For this kind of reflection we do best to stick to Scripture: Bless the Lord and exalt him as much as you can; he shall always pass over you [Sir. 43:30]. All this applies if the ‘spirit of God’ in this passage means the Holy Spirit, whom we honour as a member of the indescribable and unchangeable Trinity. (4.17) But we could also understand this reference a different way. ‘God’s spirit’ could mean a created thing – the breath of life – which fills this entire visible world and all bodily things, and gives them motion; God Almighty gave it a power to serve him by working in things that reproduce. It is not unreasonable to call this spirit or breath ‘God’s’ because it is even more excellent than any of the luminaries (invisible created things always come before visible ones). After all, what is not God’s? He made everything, even the earth itself: The earth is the Lord’s and everything in it [Ps. 23:1]. The following text embraces the whole cosmos: For all things are yours, O Lord who loves souls [Wis. 11:27]. It only works to take ‘spirit’ this way if the words In the beginning God made heaven and earth refer to the visible creation. Then this invisible spirit or breath can be understood as moving over the raw material as it was first fashioned into visible things. But this spirit was itself created – not God, but a nature made and established by God. However, if we take the word ‘water’ as denoting all creation whether spiritual, animal, or bodily, then the words ‘God’s spirit’ here can only be understood as the unchanging Holy Spirit: it ‘passed over’ the matter underlying all things which God then made and established. (4.18) There could be a third possibility about this ‘spirit’ [breath], which is that the word designates the element air; the text thus indicates the four elements of the visible world, namely sky, earth, water, and air. These elements were not yet separated and arranged, but the terminology indicates they would arise from that matter although it was currently unshaped and muddled. The unshaped muddle was described with the words ‘shadows’ and ‘abyss’. At any rate, whichever of these various theories is correct, we must believe that God created and fashioned all things, whether visible or invisible. He made their natures, but he did not make their faults (which are contrary to nature). There is no creature whatsoever which is not begun and completed in him, in terms of both its species and individual substance."
