physical_line_ranges = [[89, 93]]
text = "(4.12) And there was darkness above the abyss. Does this mean there was an abyss below and darkness above, like two different places? Alternatively, since Scripture is still explaining the jumbled matter – which is called chaos in Greek – does the phrase mean that there was no light yet? If there had been it certainly would have been higher up, to be more obvious and to lighten what was below. In fact, anyone considering carefully what darkness is will realize it is merely the absence of light; so the phrase darkness was over the abyss is the same as saying ‘there was no light over the abyss’. That explains why this primordial matter (which God subsequently disentangled and structured) was called an ‘invisible’ and unformed’ earth, and a ‘depth’ with no light. When it was called ‘heaven and earth’ earlier, this meant the embryo of heaven and earth, as I have already said. Or again, by ‘heaven and earth’ the writer may have wished to denote creation as a whole, so that he could describe the underlying matter first and then go on to discuss the individual parts."
