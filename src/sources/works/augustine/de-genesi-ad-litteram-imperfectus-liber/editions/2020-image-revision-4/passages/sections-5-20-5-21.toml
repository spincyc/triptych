physical_line_ranges = [[151, 159]]
text = "(5.20) And God said, Let there be light. Does this mean the light which is visible to our bodily eyes, or a hidden one which we can’t physically see? And if it is hidden, then is it: physical, spreading through space in the world’s higher planes; unbodily, like the one in the soul, which investigates the world through the bodily senses so as to know what to avoid and what to pursue (even animals have this kind); or the higher light which we perceive by contemplation, the beginning of all creation [Prov. 8:22]? At any rate, we must believe this ‘light’ was made and created. God’s own Wisdom [the Son] is a shining light, but one that was begotten rather than made; otherwise we’d think God had no light before the one he created, which is the one we are now talking about. (5.21) People are often concerned about how there could have been physical light before the sky or its luminaries existed, since these are only mentioned later. As if it were easy – or indeed at all possible – for humans to ascertain whether there was some other light beyond the sky, when it is in different places and scattered through space and surrounds the world! But at any rate, the words ‘let there be light’ could also include unbodily light – since this book [Genesis] deals with all of creation, not just visible creation. So we don’t need to waste any more time on this issue. Another option is that the light here refers to the angels; people sometimes ask when they were made. If so the mention is somewhat concise, but it is not inappropriate or unsuitable to refer to angels like this."
