context = "Complete source section block 5.22-5.25, beneath the translator’s heading 'Light and darkness (Gen. 1:4)', read with surrounding sections; direct commentary on Genesis 1:4."
physical_line_ranges = [[163, 183]]
text = "(5.22) God saw that the light was good. We should not understand this sentence as meaning God had some unexpected pleasure, but that he was pleased with his work. The most helpful way to speak of God is with language humans use amongst themselves, like ‘he said, he made, he was pleased’. ‘He said’ reveals his command; ‘he made’ reveals his power; ‘he was pleased’ reveals his goodness. These indescribable things had to be expressed somehow, by one human [the writer] for other humans, so that everyone could benefit from them. (5.23) And God separated the light from the darkness. This shows us how easy it was for God to accomplish his work! No-one would think that light was created mixed up with darkness, and needed separating as a subsequent stage. Rather, the act of creating light naturally led to darkness as a separate thing. For what fellowship does light have with darkness [2Cor. 6:14]? God separated light from darkness inasmuch as he made light, and its absence is called darkness. The relationship between light and darkness is the same as that between clothing and nakedness, or being full and being empty, and other such examples. (5.24) Earlier I discussed various ways of understanding ‘light’. The absence of these can be called kinds of ‘darkness’. Firstly, there is the physical light seen by our physical eyes. Examples include light from the sun, moon, stars, and so on; its corresponding darkness is when any physical place has no light. Secondly, there is a light which animals use for perception and for distinguishing signals which the body sends the mind to be assessed: black and white, melodious and discordant, fragrant and foul-smelling, sweet and bitter, hot and cold, and so on. (The light perceived by the eyes is different from the one which uses the eyes for perception; the former is physical, but the latter is in the mind, even though it uses the body to perceive). The corresponding ‘darkness’ is a sort of lack of perception or (more accurately) of feeling – an inability to sense, even when objects are present that could be sensed by those who do have the perceptive light. This is not a physical deficiency as with blind or deaf people, since their minds still have the type of light we’re currently discussing despite their physical disability. Nor is it like when a sound cannot be heard in the midst of silence, because in this case the mind still has the perceptive light and the physical ability, but does not pick up anything. In these instances, perceptive light is not missing. Rather, it is missing when the mind cannot sense – although then it can’t be called a ‘mind’ really, just a living thing like a vine or a tree or any plant, if indeed plants can be said to ‘live’ in the same sense. (Actually some heretics think, although it is utterly ridiculous, that plants not only have physical senses – namely seeing, hearing, sensing temperature and heat – but even have rational thought and can think like we do! But that’s another issue entirely.) Thus lack of perception is the ‘darkness’ corresponding to the light of perception, and it occurs in living things with no sense faculty. (If light is defined as something that brings clarity to things, that still applies for this particular light. When we say ‘this is clearly a melody, this is clearly sweet, this is clearly cold’ or the like, then what makes these clear is a light; it is definitely in the mind, even though it is the body which perceives the sense-objects.) A third kind of light can be understood in creatures – the one by which we reason. Its corresponding ‘darkness’ is the lack of reason, like the minds of animals. (5.25) Regardless of the type of light (whether it was in the upper ether, or was the perception-light used by minds, or the reasoning-light possessed by angels and men), this text tells us that light was the very first thing created. We should accept that God distinguished light from darkness by the very act of creating light, since light is one thing and its absence quite another. God decreed this absence should be the ‘darkness’. It does not say anywhere that God created the darkness. God created actual things; he did not create absences, which are part of the nothingness from which the divine Craftsman drew all things. However, although he did not create absences, the phrase ‘God separated the light from the darkness’ teaches us that he did give them a place. God manages and governs everything, even the absence of things! In singing, there are silent pauses at fixed points; skilled singers place them properly and they contribute to the charm of the whole piece of music, even though they are an absence of sound. In painting, shadows help to bring out the highlights, and give pleasure not because they are shadows per se but because of the way they are placed. God did not create our faults, but he gave them a place when he condemned sinners and made them suffer what they deserve. This is also illustrated by parable of the sheep put on the right and the goats on the left [Mt. 25:33]. God both created and gave a place to the former; the latter were merely given a place. The righteous he both creates and gives a place to; as for sinners, he does not create them to be sinners, but merely gives them a place. Of course, when he put the former on the right, and the latter on the left and ordered them into the eternal fire, this illustrates the place they deserve. In conclusion, actual things and natures he both creates and places; he does not however create absences or deficiencies, but only gives them a place. So he said: ‘Let there be light!’, and there was light. He did not say ‘Let there be darkness’, resulting in darkness. God made the former but not the latter; he only gave it a place, when he separated darkness from light. The things he created are beautiful individually; and his placement of things is beautiful as a whole."
