physical_line_ranges = [[43, 63]]
text = "(3.6) So with this text, in the beginning God made heaven and earth, we should ask whether this should only be interpreted in a historical-literal way; whether it also means something symbolic; how it agrees with the Gospel; and why the book starts like this. Let’s start with history. We should ask whether ‘in the beginning’ refers to the beginning of time, or the beginning of God’s Wisdom itself. After all God’s Son called himself the ‘beginning’, when he was asked Who are you? and he answered, I the Beginning, am speaking to you [Jn. 8:25]. There is a ‘Beginning un-begun’ and a ‘Beginning which had a beginning’. Only the Father is ‘Beginning un-begun’, and it is our faith that all things come from one sole Beginning. In the Son’s case, he is Beginning but he came from the Father. (Indeed, the first intellectual creature can be called ‘beginning’ of God’s creatures: she is their head [Prov. 8:22]. It is appropriate to call a beginning ‘head’; the Apostle used the same ranking system when he said that women are not anyone’s head. He said that man is the head of woman, and Christ is the head of man, and God is the head of Christ [1Cor. 11:3], and thus every creature is ranked under God.) (3.7) Does In the beginning indicate that heaven and earth were made first? If the angels and all spiritual beings were made first, can’t heaven and earth have been included at this first stage? We must believe that angels are part of God’s creation too, and that he made them. In Psalm 148 the Psalmist is including the angels when he says: He gave the order, and they were made; he commanded and they were created [Ps. 148:5]. Assuming the angels were made first, then were they made within time; or before all time; or at the start of time? If they were made within time, then there was a time before any angels existed; and because time too is created, this implies something was created before the angels. If we say they were made at the start of time, and that time began with them, then this disproves the hypothesis that time began when heaven and earth started. (3.8) But if the angels were created before time, then what does this later text mean?: And God said, let there be heavenly bodies in the vault of heaven to illuminate the earth, and divide night from day, and to indicate times and days and years [Gen. 1:14]. One could presume time began at that point, when the sky and the luminaries began to run their prescribed orbits. But in that case, days existed before time did! Time arises from the orbit of the luminaries, but Scripture says they were not made until the fourth day. Was the sequence of so-called ‘days’ merely a necessary narrative device? That is how divine concepts are introduced to simple mortals: every discussion has to have a beginning, middle and end. Or does it mean the luminaries were actually created within time? Humans measure time by how long it takes for physical bodies to move. If there were no luminaries moving, then there was no time of this sort; and this is the meaning of ‘time’ most obvious to humans. Granted, but then we should ask whether time could be measured by the movement of unbodily creatures (like the soul, or the mind itself) rather than in the movement of physical bodies. The mind ‘moves’, of course, when it thinks, and therefore has different states ‘before’ and ‘after’. This can only be understood as a time interval. If we accept this, then we can deduce time did exist before the heaven and earth as long as angels were made first. Then there were already creatures with non-bodily movements, which implies time existed. If this logic applies for the human soul (despite it being accustomed to bodily movements due to its bodily senses) then it applies all the more for the angels. But then again, perhaps the angels and higher beings did not exist before heaven and earth? This is all quite baffling and impossible for humans to understand. But at any rate and whatever the explanation, we must certainly take the following statement on trust even if is beyond us: every creature had a beginning, and time itself is created and had a beginning, and time is not co-eternal with the Creator."
