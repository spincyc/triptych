text = "(8.29) And God said, “Let there be a vault between the waters, and let it divide the waters from each other.” And it was done: and God made the vault, and divided the waters below the vault from the waters above it. Are the ‘waters’ above the vault the same as physical water below the vault? This appears to be the same ‘water’ which the Spirit passed over, and which we interpreted as the world’s primordial matter. So should we here take it that the vault divided up this ‘water’, with physical matter below, and spiritual matter above? For what he calls ‘vault’ here, he later calls ‘sky’. But there is no body more noble than the ones in the sky. Bodies on earth and in the sky are completely different [1Cor. 15:40]. And of course, the latter are more noble: they are the most excellent natures that can still be called a physical body. (There is a possible exception if we count as a ‘body’ the rational capacity that we use to recognize God and Truth. It would be appropriate for Holy Scripture to call this ‘water’ because it seems almost material, inasmuch as it may be shaped when we are righteous and sensible, and this gives it an alertness which stabilizes it and prevents it from being volatile. Despite being here on earth this mental capacity is better than the bodies in the sky, because it is incorporeal.) He called the vault ‘sky’ [‘heaven’]; everything there is calm and stable, so logically we can interpret anything below it as more likely to change and disintegrate. There used to be some who believed that the surface of the sky was made up of actual cold water, until physical matter of this sort was separated into individual forms and designated as ‘under the vault’. They tried to prove it from the fact one of the seven planets is slower than the others [Saturn]. It is higher than the others, and is called Phainōn in Greek, and takes thirty years to trace its orbit through the zodiac; they claim it is slow because it is closer to the cold waters which are above the sky. I have no idea how they can defend their hypothesis against astronomical experts. One should not arrogantly state theories like this; they should all be researched carefully and sensibly."
