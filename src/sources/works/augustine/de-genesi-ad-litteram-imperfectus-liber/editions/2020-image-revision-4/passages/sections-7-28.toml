context = "Complete source section block 7.28, beneath the translator’s heading 'Evening and morning (Gen. 1:5)', read with surrounding sections; direct commentary on Genesis 1:5."
physical_line_ranges = [[203, 209]]
text = "(7.28) And evening was made, and morning was made: one day. This is a different kind of day from earlier; this one is a day in the sense as when for example we say that a month has thirty days. This definition of day includes nights, whereas earlier ‘day’ was the opposite of night. The text suggests that God made day while it was light, so accordingly the text continues by saying evening was made and morning was made: one day. This ‘one day’ is the period from the start of one day until the start of the next, i.e. from daybreak to daybreak; as I mentioned, we include nights when we define days in this way. But how were evening and morning made? When God made light and separated light from darkness, did that take a time span as long as our daylight hours (excluding night time)? But then why does Scripture say: You can do anything the moment you wish to [Wis. 12:18], if God needs a period of time to get things done?! Isn’t it more likely that God skilfully and rationally accomplished it all, not over some time period, but with the same power he used to create things which we experience as transient while himself remaining anchored!? When we talk, words pass and others follow. In the art of oratory, on the other hand, the whole speech is present in its entirety, anchored in the orator’s mind. Similarly God creates from outside time (since ‘he can do anything the moment he wishes to’), but temporal creatures still pursue their business within time. So perhaps the words ‘Evening was made and morning was made, one day’ anticipate that this logically should or could be the case, and are not a comment on the time that passed. [The writer of Ecclesiasticus] applied this same logic when contemplating on God’s creation while divinely inspired; this is why it says: The One who dwells in eternity created everything instantaneously [Sir. 18.1]. In the current book [Genesis] however, the story helpfully proceeds as if God created things in steps, one after the other. We weaker souls cannot take in the process all at once; the narrative is arranged in steps so that we may visualize it as if before our eyes."
