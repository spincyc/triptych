text = "(4.11) Now the earth was invisible and formless, and there was darkness over the abyss; and God’s Spirit passed over the waters. Heretics who reject the Old Testament tend to throw scorn on this passage, saying “How did God make heaven and earth in the beginning, if the earth already existed!?” They don’t realize that this part was put in to explain ‘earth’ in the previous sentence. This is how we should take it: the ‘earth’ God ‘made’ was invisible and shapeless until God himself disentangled it and transformed it from a muddle into an ordered system. Alternatively, a better way to understand this may be that the same primordial material from the first sentence (there called ‘heaven and earth’) is mentioned again in the next one. So the sentence God made heaven and earth means he made an earth which was invisible and formless with darkness over the abyss. In other words, it refers to a muddle of matter, from which the world was created when the two great parts (namely heaven and earth) were separated and configured as they are now. Ordinary people should understand a reference to this jumbled primordial matter whenever words like ‘invisible’ earth are used, or ‘unformed’ or ‘disordered’ or ‘unprepared’, or ‘shadows above the abyss’ – ‘abyss’ means an immense depth. (Or perhaps it was called ‘abyss’ because it is impenetrable for anyone to understand, due to being shapeless.)"
