text = "(9.31) And God called the vault ‘sky’. I have already discussed the issue of God naming things, and it applies here too: not every vault is the same as the sky. And God saw that it was good. I could just repeat what I said earlier on this phrase, but I realize the narrative comes in a different order. Earlier it says God saw the light was good, and then that God divided the light form the darkness; and God called the light ‘day’ and the darkness he called ‘night’. But here, the phrase God saw that it was good comes *after* the statement that vault was made, and was called ‘sky’. Unless the writer is just varying the text to avoid being boring, we must definitely take this in the sense that God ‘created everything instantaneously’ [Sir. 18:1]. The first time, he saw something was good and then named it; so why does it say here he acted the other way round? The similarity must mean that God works outside time (even though these precise creations are subject to time!) A narrative has to be told in stages with one thing happening and then the next, but God achieved it all instantaneously. And there was evening, and there was morning: the second day. I have dealt with this above, and I believe the same logic holds here too."
