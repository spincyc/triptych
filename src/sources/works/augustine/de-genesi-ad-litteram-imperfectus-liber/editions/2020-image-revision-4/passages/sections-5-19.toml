text = "(5.19) God said, Let there be light; and there was light. When God said ‘let there be light’, we should not think of his speech as a sound coming from the lungs or from tongue or teeth. This is a fleshly way of thinking, but the mind governed by the flesh is death [Rom. 8:6]. Rather, the words ‘let there be light’ were spoken without being articulated aloud. Next, let us ask whether the words were spoken to the Only-Begotten Son, or whether the words were themselves the Only-Begotten Son; after all he is called God’s Word, through whom all things were made [Jn. 1:2]. At the same time, we should avoid the sacrilege of believing that the Only-Begotten Son God’s Word is a sound like the ones we humans articulate. No! God’s Word – through whom all things were made – has neither beginning nor end. He was begotten, but had no beginning because he is co-eternal with the Father. So the phrase ‘let there be light’ is more likely to have been spoken by the Son than to have been the Son, since it began and then ended. On the other hand, it was spoken without being articulated; we should not imagine something physical, and trouble our devout awareness that this is a spiritual occurrence. It is arrogant and dangerous to believe that anything in God’s nature actually begins and ends (however, we must be charitable and excuse fleshly people or small children if they do believe this – as long as they don’t remain in error, but grow from there). Whenever God is said to ‘begin’ or ‘stop’ something, it should on no account be taken as referring to his own nature but rather to that of his creature, who submits to him admirably."
