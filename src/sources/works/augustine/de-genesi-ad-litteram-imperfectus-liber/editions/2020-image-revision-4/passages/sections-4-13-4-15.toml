physical_line_ranges = [[97, 117]]
text = "(4.13) And God’s Spirit passed above the water. It has not yet said that God made the water. Still, we should certainly believe that God made the water, and that it did not exist before he made it. He is the one from whom and through whom and in whom all things come [Rom. 11:36], as the Apostle says. So God made the water, and it is a huge mistake to believe otherwise. But why doesn’t it say that God made the water? Is water included in the primordial matter which he called ‘heaven and earth’ and ‘invisible unformed earth’ and ‘abyss’? (It might just as well be called ‘earth’ as ‘water’, because at this point earth had not been disentangled and shaped, and neither had anything else.) But perhaps there is a reason why it was called ‘heaven and earth’ the first time, ‘unformed earth and dark abyss’ the second time, and ‘water’ the third time. The first phrase ‘heaven and earth’ points to the all-encompassing scope of the underlying matter, made of absolutely nothing [ex nihilo] for this purpose. The second phrase (‘unformed earth and abyss’) suggests its shapelessness, because earth is the least defined of the elements and reflects light the least. The third phrase suggests the matter when subjected to the Craftsman’s work; water is more pliable than earth, so when worked by Craftsman the matter was called ‘water’ rather than ‘earth’ to suggest it was easy to work and mould. (4.14) Admittedly air is more pliable than water; and indeed we can reasonably assume that ether is even more pliable than air. But ‘air’ and ‘ether’ are less appropriate words to describe matter. These two elements are more active than passive, whereas the reverse is the case for earth and water. This may not be immediately apparent, but it is I think extremely obvious that wind moves water, and occasionally parts of earth too; yet wind is just air moving in ebbs and flows. And air obviously moves water; but it is unclear what moves air, to make it wind. So who would doubt that pliable matter is better called ‘water’ (which is movable) rather than ‘air’ (which moves other things)? To be moved is to undergo an action, but to move something else is to perform an action. In addition, anything that grows in earth needs water to sprout and thrive; it almost seems as if water is transformed into sprouting plants. In summary, ‘water’ is a better name for the primordial matter than ‘air’ because it suggests something that the Craftsman could work on, which is pliable and transforms into sprouting bodies. The word ‘air’ only indicates pliability and not the primordial matter’s other properties, so this matter it is better expressed with other terms. So the whole meaning is as follows: In the beginning God made heaven and earth (i.e. primordial matter which could take the form of heaven and earth); and the matter was invisible and unformed earth (i.e. it was an unshaped depth with no light); and when the Craftsman worked on it and moulded it, it was called water because it yielded to being modelled. (4.15) So with the phrases Scripture uses for this primordial matter, the first suggests the purpose for which it was made; the second its shapelessness; and the third the fact that the Craftsman uses it and works on it. That is why it is first called ‘heaven and earth’ (because they were made from this matter), secondly ‘invisible unformed earth and shadows above the abyss’ (i.e. shapeless and without light, which explains why it is ‘invisible’), and thirdly ‘water’ (which the Spirit will work on to give it form and shape). Thus God’s spirit passed over the water: we should understand the ‘spirit’ as doing the crafting and ‘water’ as the material being crafted, since it is workable. If we want phrases that describe the same matter in three ways – that it will make the world, is shapeless, and is workable – then the first is well expressed by heaven and earth; the second by darkness, chaos, depth, shadows; and the third by malleability so that the Craftsman’s Spirit can pass over it and fashion it."
