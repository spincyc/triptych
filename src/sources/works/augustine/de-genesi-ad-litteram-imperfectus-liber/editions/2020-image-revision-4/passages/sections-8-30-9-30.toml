text = "(8.30) And God said, “Let there be a vault between the waters, and let it divide the waters from each other.” And it was done... After saying ‘it was done’, why did the writer need to add: And God made the vault, and divided the water which was below the vault from the water which was above the vault? Earlier the writer said, And God said ‘Let there be light’, and there was light; but he didn’t then add, “And God made light”. But here, after he said God said ‘let there be’... and there was..., he then adds that God did it. Does this indicate that light should not be thought of as physical, which is why God (by which I mean the Trinity) created it without the intermediary of another creature; whereas the sky’s vault, being physical, can be assumed to have received its nature and shape via some spiritual intermediary? Under this theory, as a first stage Truth imprinted the sky’s vault onto something spiritual using Reason, and this imprint was then reproduced in the physical realm. That could explain the words, And God said ‘let it happen’... and it was done; it may have been made first on a rational being, and then that was used to make the physical vault. (9.30) But it also adds: God made the vault, and divided the waters below the vault from the waters above it. Does this refer to God working the primordial material himself to make the physical sky? Or was it just for variety that the writer put here something different from before – to avoid the narrative becoming boring? We shouldn’t over-analyze the text! Take your pick; but just don’t be arrogant and claim you know things you don’t. Remember you are only human, and that you only investigate God’s handiwork because he lets you."
