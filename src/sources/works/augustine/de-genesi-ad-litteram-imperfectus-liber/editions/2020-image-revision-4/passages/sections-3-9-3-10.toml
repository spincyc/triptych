physical_line_ranges = [[67, 77]]
text = "(3.9) The phrase ‘heaven and earth’ may designate everything created. It could be that ‘heaven’ refers to the visible vault of the sky as well as the part of creation encompassing the invisible higher powers, while ‘earth’ refers to the lower part of the world inhabited by animals. Alternatively, ‘heaven’ refers to all the beautiful invisible creatures, and ‘earth’ of course to all the visible ones; that would be another way that the text In the beginning God created heaven and earth can be understood as referring to the whole of creation. Of course, if the invisible part of creation is being called ‘heaven’ then perhaps it is quite appropriate to call visible creatures ‘earth’ to distinguish them. Indeed, the soul is invisible; but even that is called ‘earth’ when it lusts for visible things or gloats at getting them. As Scripture says, What do earth and ash have to be proud about? [Sir. 10:9]. (3.10) But we can ask: did the phrase heaven and earth refer to everything already marked out and assembled? Or was the writer referring to the shapeless primordial matter, which at God’s unarticulated command was later assembled into the present well-arranged forms? (It’s true that Scripture tells us You made the world from shapeless matter [Wis. 11:18]. But it was still God who created that matter, regardless of what form it took -- because our creed and belief tell us he created everything.) In that case, ‘world’ means that he composed and arranged each individual thing that had to be shaped and set apart. So in fact ‘heaven and earth’ refers to the primordial matter which is the embryo of heaven and earth. The ‘heaven and earth’ were all muddled and mixed together as it were, ready for the Creator God to shape things out of it. Everything I’ve said so far about the phrase In the beginning God made heaven and earth is only a hypothesis; it would be arrogant to claim for certain what it truly means."
