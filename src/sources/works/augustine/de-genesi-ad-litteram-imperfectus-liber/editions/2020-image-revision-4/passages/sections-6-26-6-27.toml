context = "Complete source section block 6.26-6.27, beneath the translator’s heading 'Day and night (Gen. 1:5)', read with surrounding sections; direct commentary on Genesis 1:5."
physical_line_ranges = [[187, 199]]
text = "(6.26) God called the light ‘day’, and the darkness he called ‘night’. The names ‘light’ and ‘day’ refer to the same thing, and the names ‘darkness’ and ‘night’ refer to the same thing. We should deduce two names were given so that the thing in question could be designated with either name (obviously). So it says God called the light ‘day’ but you could just as well say it the other way round: “God called the day ‘light’, and the night he called ‘darkness’”. Someone might ask me: was the light given the name ‘day’, or was the day given the name ‘light’? (Both are certainly names, inasmuch as both are words used to designate things.) Likewise one could ask about the other two terms: was the darkness given the name ‘night’, or was the night given the name ‘darkness’? Scripture settles the matter: clearly, light was given the name ‘day’ and night was called ‘darkness’. When Scripture says God made the light and separated the light from the darkness, the terminology was not yet important. Afterwards the names ‘day’ and ‘night’ were given. (Admittedly ‘light’ and ‘darkness’ are also names which designate things.) Should we assume that these things could not be designated with their first name, so another was needed? No; the separation of light and darkness was the reason for this new terminology. Not all light is day, nor is all darkness night. But when light and darkness are separated and put in their respective places alternating with each other, then they are called ‘day’ and ‘night’. The very point of any word, of course, is to distinguish it from other things. (Indeed, the word ‘name’ [nomen] comes from the fact that it ‘marks out’ things [notare], as if with their own ‘mark’ [notamen]; it ‘marks out’ a thing in the sense that it distinguishes it, and helps anyone mentioning it to identify it.) So perhaps the act of calling the light ‘day’ and the darkness ‘night’ itself was the separation of light and darkness: giving them names was the same as allocating them their places. Another possibility is that the later terms were meant to specify what exactly which light and darkness were being referred to. It’s as if Scripture were saying: “God made light; he divided light from darkness; the light in question was the day, and the darkness in question was the night. Don’t think that any other type of light or darkness are being referred to here.” After all, if every light was ‘day’ and every darkness could be thought of as ‘night’ then there would be no need for the statement God called the light ‘day’ and the darkness he called ‘night’. (6.27) This begs the question what exactly was meant by ‘day’ and ‘night’. There’s no way this could refer to the day which lasts from sunrise to sunset, or to the night which lasts from sunset until sunrise, since the luminaries in the sky had not yet been created! Or maybe the appropriate time periods could still be called ‘days’ and ‘nights’ even when not demarcated by light and darkness? Alternatively, if ‘light’ here refers to the light of reason or the light of perception, how does it alternate in the way suggested by the words ‘day’ and ‘night’? Maybe it indicates not what was happening but what could happen, inasmuch as error can follow reason, and dullness can follow perceptiveness?"
