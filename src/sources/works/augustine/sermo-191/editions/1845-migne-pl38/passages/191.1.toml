notes = "The page prints panis, fons, lux and via in lower case. The a of factor has damaged type that can look like fæctor; read as factor. A stray vertical mark crosses the comma after accusaretur. Maurist footnote 1, at Verbum Patris, prints the longer exordium that some manuscripts prefix (Unigenitus Christus Dei Filius, verus sol justitiae ...), which includes Deus factus est homo, ut homo Deus fieret; it is not part of this transcription. Footnote 1 of column 1010, at indigna, reads Sic aliquot Mss. Editi autem, loco, indigna, habebant, se inclinans: the reading indigna is the manuscripts', against the earlier editions' se inclinans. No public-domain English translation of this sermon was found (see the lane bank)."
