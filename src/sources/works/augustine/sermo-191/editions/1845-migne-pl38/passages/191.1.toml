context = "Section 1 of Sermo CXCI, In Natali Domini VIII, whole, from Verbum Patris per quod facta sunt tempora in column 1009 to nunquam et nusquam esse potuisset in column 1010, after the italic chapter summary Verbum ut indigna pro indignis ferret incarnatum est (omitted)."
