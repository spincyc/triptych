text = "Verbum Patris per quod facta sunt tempora, caro factum, Natalem suum nobis fecit in tempore: et in ortu humano habere voluit unum diem, sine cujus nutu divino nullus volvitur dies. Ipse apud Patrem præcedit cuncta spatia sæculorum: ipse de matre in hac die cursibus se ingessit annorum. Homo factus, hominis factor: ut sugeret ubera, regens sidera; ut esuriret panis, ut sitiret fons, dormiret lux, ab itinere via fatigaretur, falsis testibus veritas accusaretur, judex vivorum et mortuorum a judice mortali judicaretur, ab injustis justitia damnaretur, flagellis disciplina cæderetur, spinis botrus coronaretur, in ligno fundamentum suspenderetur, virtus infirmaretur, salus vulneraretur, vita moreretur. Ad hæc atque hujusmodi sustinenda pro nobis indigna, ut liberaret indignos; quando nec ille aliquid mali, qui propter nos tanta pertulit mala, nec nos boni aliquid merebamur, qui per eum tanta accepimus bona: propter hæc ergo, qui erat ante omnia sæcula sine initio dierum Dei Filius, esse in novissimis diebus dignatus est hominis filius; et qui de Patre natus, non a Patre factus erat, factus est in matre quam fecerat; ut ex illa ortus hic aliquando esset, quæ nisi per illum nunquam et nusquam esse potuisset."
