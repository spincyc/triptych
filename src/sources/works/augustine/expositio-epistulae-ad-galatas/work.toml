description = "Augustine's single-book continuous commentary on the whole Epistle to the Galatians, written as a presbyter at Hippo. It comments on the appointed Epistle of the Fifteenth Sunday after Pentecost, Galatians 5:25-6:10, at its sections 52-62. A locus is the section number in the conventional division into sixty-four sections."
