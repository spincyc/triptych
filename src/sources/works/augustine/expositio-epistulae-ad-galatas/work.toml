title = "Expositio epistulae ad Galatas"
responsible = "Augustine of Hippo"
work_type = "biblical-commentary"
composed = "394-395"
composed_basis = "Augustine lists the work in the Retractationes among the writings of his presbyterate at Hippo, between the unfinished commentary on Romans and the Contra Adimantum, which places it in 394-395. The date is the writing, not the nineteenth-century printing this record's edition delivers."
alternate_titles = ["Epistolae ad Galatas expositionis liber unus", "Commentary on the Epistle to the Galatians", "Expositio in epistulam ad Galatas"]
