context = "Complete chapter 18.32, body raw lines 10215-10340, read with the chapter heading at lines 10212 onward and adjacent complete paragraph/chapter context. George Wilson translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. Complete chapter XVIII.32 is a successive exposition of Habakkuk's prayer from O Lord I have heard to the concluding strength, feet and song. The opening canonical verse 1 is the prayer's title; the expounded prayer is 3:2-19, checked against the actual held Challoner chapter. Augustine's Greek/Old Latin wording materially differs at several clauses from the Vulgate, including the two living creatures and the final Jesus/salvation discussion; its English is preserved. Supporting Psalms and Gospel quotations create no added edges."
