context = "The complete chapter body was inspected at artifact lines 17748-17782: Augustine's 'amicable controversy' with tender-hearted Christians who held that the damned would be delivered after a fixed term, his report that Origen went further and included the devil and his angels, his statement that the Church condemned Origen for this and for the ceaseless alternation of happiness and misery, and the reductio that a merciful principle consistently applied would have to reach the devil himself."
physical_line_ranges = [[17748, 17782]]
text = "I must now, I see, enter the lists of amicable controversy with those tender-hearted Christians who decline to believe that any, or that all of those whom the infallibly just Judge may pronounce worthy of the punishment of hell, shall suffer eternally, and who suppose that they shall be delivered after a fixed term of punishment, longer or shorter according to the amount of each man's sin."
