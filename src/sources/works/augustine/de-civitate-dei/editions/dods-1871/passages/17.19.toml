context = "Complete chapter 17.19, body raw lines 8260-8281, read with the chapter heading at lines 8257 onward and adjacent complete paragraph/chapter context. George Wilson translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. Complete chapter XVII.19 expounds the gall/vinegar clause and the immediately following table, eyes and bowed-back clauses. They are Psalm 69:21-23 in this English witness's notes 473-474; actual held Vulgate Psalm 68:22-24 supplies the canonical address. The short final notice closes the chapter and is retained. The Gospel fulfilment is a supporting comparison rather than a separately mapped commentary."
physical_line_ranges = [[8257, 8281]]
text = "But when the Jews will not in the least yield to the testimonies of this prophecy, which are so manifest, and are also brought by events to so clear and certain a completion, certainly that is fulfilled in them which is written in that psalm which here follows. For when the things which pertain to His passion are prophetically spoken there also in the person, of Christ, that is mentioned which is unfolded in the Gospel: \"They gave me gall for my meat; and in my thirst they gave me vinegar for drink.\" And as it were after such a feast and dainties in this way given to Himself, presently He brings in [these words]: \"Let their table become a trap before them, and a retribution, and an offence: let their eyes be dimmed that they see not, and their back be always bowed down,\" etc. Which things are not spoken as wished for, but are predicted under the prophetic form of wishing. What wonder, then, if those whose eyes are dimmed that they see not do not see these manifest things? What wonder if those do not look up at heavenly things whose back is always bowed down that they may grovel among earthly things? For these words transferred from the body signify mental faults. Let these things which have been said about the Psalms, that is, about king David's prophecy, suffice, that we may keep within some bound. But let those readers excuse us who knew them all before; and let them not complain about those perhaps stronger proofs which they know or think I have passed by."
