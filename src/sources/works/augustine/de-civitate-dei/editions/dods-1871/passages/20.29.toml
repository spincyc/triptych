context = "Complete chapter 20.29, body raw lines 15999-16045, read with the chapter heading at lines 15995 onward and adjacent complete paragraph/chapter context. Marcus Dods translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. Complete chapter XX.29 quotes and expounds the sending of Elijah before the day and his turning fathers/children, retaining Augustine's explicit Septuagint singular/plural and Father/Son interpretations. The actual held canonical Malachi 4:5-6 fixes the extent and agrees with note 833. Elijah's earlier translation and the murmuring phrases from Malachi recalled at the close support this interpretation rather than supplying new primary edges."
