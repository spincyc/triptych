context = "Complete naturally separated named-prophet paragraph 18.30, body raw lines 10138-10147, read with the chapter heading at lines 10107 onward and adjacent complete paragraph/chapter context. George Wilson translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. The complete third paragraph of XVIII.30 treats Joel separately from the preceding Micah and Jonah paragraphs. It identifies the Spirit-promise as the text quoted by the apostles at Pentecost and quotes the sons/daughters, old/young and servants/handmaids clauses. Both the witness's note 528 and the held canonical Challoner verses identify Joel 2:28-29. The paragraph is not an edge covering all of mixed chapter XVIII.30."
physical_line_ranges = [[10138, 10147]]
text = "I should be obliged to use many words in explaining all that Joel prophesies in order to make clear those that pertain to Christ and the Church. But there is one passage I must not pass by, which the apostles also quoted when the Holy Spirit came down from above on the assembled believers according to Christ's promise. He says, \"And it shall come to pass after these things, that I will pour out my Spirit upon all flesh; and your sons and your daughters shall prophesy, and your old men shall dream, and your young men shall see visions: and even on my servants and mine handmaids in those days will I pour out my Spirit.\""
