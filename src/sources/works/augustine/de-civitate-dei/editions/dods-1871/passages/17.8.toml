notes = "Exact historical text from the retained normalized Gutenberg witness, not the revised New Advent wording and not a new image collation. Whitespace is joined within each paragraph. Reference-only note callouts [405]-[408] are omitted by ordered substring selection; no note prose is included. The translator's internal [hath told] bracket is retained. In the initial quotation, the house-building clause at lines 7599-7600 differs from the Clementine/Douay wording of 2 Samuel 7:11; that source-local difference is preserved. The complete natural biblical unit reaches canonical 2 Kings (= modern 2 Samuel) 7:1-16: the opening explains the proposed house and God's never-commanded cedar house from 7:1-7, before quoting and expounding Nathan's promise at 7:8-16. The whole chapter is transcribed, with no extension to David's prayer at 7:18-29."
