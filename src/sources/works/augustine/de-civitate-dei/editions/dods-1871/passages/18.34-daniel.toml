context = "Complete naturally separated named-prophet paragraph 18.34, body raw lines 10411-10421, read with the chapter heading at lines 10408 onward and adjacent complete paragraph/chapter context. George Wilson translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. The complete first paragraph of XVIII.34 introduces Daniel and Ezekiel and then treats Daniel's Son of man, Ancient of days and everlasting dominion as Christ's power and glory. Its actual quotation and note 559 correspond to canonical Daniel 7:13-14, checked in the held Challoner text. The general mention of Daniel's chronological computation supplies no chapter-9 edge, and the separate Ezekiel paragraph is not included."
physical_line_ranges = [[10411, 10421]]
text = "Daniel and Ezekiel, other two of the greater prophets, also first prophesied in the very captivity of Babylon. Daniel even defined the time when Christ was to come and suffer by the exact date. It would take too long to show this by computation, and it has been done often by others before us. But of His power and glory he has thus spoken: \"I saw in a night vision, and, behold, one like the Son of man was coming with the clouds of heaven, and He came even to the Ancient of days, and He was brought into His presence. And to Him there was given dominion, and honour, and a kingdom: and all people, tribes, and tongues shall serve Him. His power is an everlasting power, which shall not pass away, and His kingdom shall not be destroyed.\""
