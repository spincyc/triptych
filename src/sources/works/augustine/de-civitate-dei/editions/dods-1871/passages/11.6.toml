context = "The complete chapter body was inspected at artifact lines 17603-17633, under the heading 'That the world and time had both one beginning, and the one did not anticipate the other'. Augustine argues that time cannot precede creation, reads 'in the beginning God created the heavens and the earth' as excluding anything made earlier, and closes on the order of the first six or seven days through the seventh day's rest. The heading occupies lines 17603-17604 and the body begins at 17606."
physical_line_ranges = [[17603, 17633]]
text = "And if the sacred and infallible Scriptures say that in the beginning God created the heavens and the earth, in order that it may be understood that He had made nothing previously,--for if He had made anything before the rest, this thing would rather be said to have been made \"in the beginning,\"--then assuredly the world was made, not in time, but simultaneously with time. For that which is made in time is made both after and before some time,--after that which is past, before that which is future. But none could then be past, for there was no creature by whose movements its duration could be measured. But simultaneously with time the world was made, if in the world's creation change and motion were created, as seems evident from the order of the first six or seven days. For in these days the morning and evening are counted, until, on the sixth day, all things which God then made were finished, and on the seventh the rest of God was mysteriously and sublimely signalized. What kind of days these were it is extremely difficult, or perhaps impossible for us to conceive, and how much more to say!"
