context = "Complete chapter 20.26, body raw lines 15847-15937, read with the chapter heading at lines 15844 onward and adjacent complete paragraph/chapter context. Marcus Dods translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. Complete chapter XX.26 continues the exposition of sacrifices in righteousness and the primitive days, then explains the judgment witness and unchanging Lord. Its actual expounded clauses are the consecutive canonical Malachi 3:3-6, checked in the held Challoner verses. Isaiah 65:22, Proverbs, Genesis and Pauline quotations are its supporting argument; this complete chapter is not also mapped onto those separate passages."
