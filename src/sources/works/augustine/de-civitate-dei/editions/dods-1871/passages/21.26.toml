context = "The complete chapter was inspected at artifact lines 18318-18475: Augustine's account of what it is to have Christ for a foundation; his reading of 1 Corinthians 3:11-15, in which the fire that tries every man's work is the fire of tribulation in this life and the loss suffered is the loss of the earthly goods a man loved; his argument that the fire of 1 Corinthians 3 cannot be the everlasting fire of Matthew 25:41, since the latter saves no one; and his measured concession about a purgative fire in the interval between death and the last judgment. The chapter heading is at artifact lines 18318-18319."
