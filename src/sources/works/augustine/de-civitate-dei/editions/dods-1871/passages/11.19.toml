context = "The complete chapter body was inspected at artifact lines 18145-18180, under the heading 'What, seemingly, we are to understand by the words, \\\"God divided the light from the darkness\\\"'. Augustine reads the division of light from darkness as the separation of the holy from the unclean angels, then distinguishes that light from the luminaries of the fourth day. The heading occupies lines 18145-18146."
physical_line_ranges = [[18145, 18180]]
text = "To me it does not seem incongruous with the working of God, if we understand that the angels were created when that first light was made, and that a separation was made between the holy and the unclean angels, when, as is said, \"God divided the light from the darkness; and God called the light Day, and the darkness He called Night.\" For He alone could make this discrimination, who was able also, before they fell, to foreknow that they would fall, and that, being deprived of the light of truth, they would abide in the darkness of pride."
