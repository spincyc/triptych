context = "The complete chapter body was inspected at artifact lines 21111-21195, under the heading 'Whether one can both be living and dead at the same time': the three times and three corresponding states; the argument that a man is never in death because before death he lives and after it he is dead; the comparison with the unlocatable present instant of time; the question whether it follows that there is no death of the body at all; Augustine's refusal to draw that conclusion; his decision to keep speaking in the customary way on the warrant of scriptural usage, quoting Psalm 6:6; and the closing remark about the damned as endlessly dying. The chapter is the classical statement of the aporia about the moment of death, and Augustine leaves it unresolved."
physical_line_ranges = [[21111, 21195]]
text = "thus, before death, he cannot be said to be in death; but when, on the other hand, the soul has departed, and all bodily sensation is extinct, death is past, and the man is dead. Between these two states the dying condition finds no place; for if a man yet lives, death has not arrived; if he has ceased to live, death is past. Never, then, is he dying, that is, comprehended in the state of death. So also"
