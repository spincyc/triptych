context = "Complete Book XVII chapter 9, with its own heading at raw lines 7671-7673 and the next chapter heading at 7732-7735 checked. The chapter directly interprets two discontinuous Psalm 89 units in this English witness, canonical Vulgate Psalm 88:4-5 and 88:20-38, comparing the promise with Nathan's correction-and-mercy clause at canonical 2 Kings 7:14-15 (modern 2 Samuel). These true plural relationships are recorded here without fabricating a single continuous Catena edge. George Wilson translated Book XVII, as the retained edition front matter states."
