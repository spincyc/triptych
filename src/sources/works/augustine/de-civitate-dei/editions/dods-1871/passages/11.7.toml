context = "The complete chapter body was inspected at artifact lines 17636-17677, under the heading 'Of the nature of the first days, which are said to have had morning and evening, before there was a sun'. Augustine holds that the first three days passed without a sun, that light was made by the word of God and separated from the darkness, and that what kind of light it was lies beyond the senses. The remainder of the chapter, at lines 17648-17677, offers the figurative reading of morning and evening as the creature's knowledge and runs through the sixth day. The heading occupies lines 17636-17637."
physical_line_ranges = [[17636, 17677]]
text = "We see, indeed, that our ordinary days have no evening but by the setting, and no morning but by the rising, of the sun; but the first three days of all were passed without sun, since it is reported to have been made on the fourth day. And first of all, indeed, light was made by the word of God, and God, we read, separated it from the darkness, and called the light Day, and the darkness Night; but what kind of light that was, and by what periodic movement it made evening and morning, is beyond the reach of our senses; neither can we understand how it was, and yet must unhesitatingly believe it."
