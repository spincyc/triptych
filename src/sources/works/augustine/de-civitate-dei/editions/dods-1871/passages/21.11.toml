context = "The complete chapter body was inspected at artifact lines 17451-17508: the objection that eternal punishment is unjust for sins committed in a brief span, Cicero's eight kinds of legal penalty, the argument that no human law measures penalty by the duration of the offence, the parallel between the first death cutting a man off from the mortal city and the second death cutting him off from the immortal city, and the reply on 'with the same measure'."
physical_line_ranges = [[17451, 17508]]
text = "Nor is there any one who would suppose that the pains of punishment should occupy as short a time as the offence; or that murder, adultery, sacrilege, or any other crime, should be measured, not by the enormity of the injury or wickedness, but by the length of time spent in its perpetration."
