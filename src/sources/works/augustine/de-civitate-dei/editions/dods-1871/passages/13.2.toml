context = "The complete chapter body was inspected at artifact lines 20768-20812, under the heading 'Of that death which can affect an immortal soul, and of that to which the body is subject': the soul called immortal because it does not cease to live and feel, the body called mortal because it can be forsaken of all life; the death of the soul when God forsakes it and the death of the body when the soul forsakes it; the death of the whole man as the compound of the two; the second death that follows; the appeal to Matthew 10:28; and the closing judgment that the first and bodily death is 'to the good it is good, and evil to the evil' while the second can be good for none. The chapter is the tradition's most careful early statement of what the word death is being used to name."
physical_line_ranges = [[20768, 20812]]
text = "of all life, and cannot by itself live at all. The death, then, of the soul takes place when God forsakes it, as the death of the body when the soul forsakes it. Therefore the death of both--that is, of the whole man--occurs when the soul, forsaken by God, forsakes the body. For, in this case, neither is God the life of the soul, nor the soul the life of the body. And this death of the whole man is"
