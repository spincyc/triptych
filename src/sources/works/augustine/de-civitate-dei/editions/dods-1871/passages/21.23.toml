context = "The complete chapter body was inspected at artifact lines 17958-18013: why no cleansing was tolerated for the devil, the appeal to Matthew 25:41 and Apocalypse 20:10, the statement that 'everlasting' and 'for ever' in Scripture mean nothing else than endless duration, the argument that a sentence pronounced on men and angels alike cannot be true of the angels and false of the men, and the correlativity argument from Matthew 25:46."
