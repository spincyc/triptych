notes = "The chapter heading is at artifact lines 17958-17959. This is the locus of the correlativity argument from Matthew 25:46 that later Latin theology repeats. Augustine's supporting appeal in chapter 9 to the threefold Marcan repetition rests on Mark 9:44 and 9:46 in the received text, verses the modern critical text treats as assimilation to 9:48."
