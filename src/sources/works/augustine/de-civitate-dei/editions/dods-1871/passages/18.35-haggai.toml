text = "There remain three minor prophets, Haggai, Zechariah, and Malachi, who prophesied at the close of the captivity. Of these Haggai more openly prophesies of Christ and the Church thus briefly: \"Thus saith the Lord of hosts, Yet one little while, and I will shake the heaven, and the earth, and the sea, and the dry land; and I will move all nations, and the desired of all nations shall come.\" The fulfilment of this prophecy is in part already seen, and in part hoped for in the end. For He moved the heaven by the testimony of the angels and the stars, when Christ became incarnate. He moved the earth by the great miracle of His birth of the virgin. He moved the sea and the dry land, when Christ was proclaimed both in the isles and in the whole world. So we see all nations moved to the faith; and the fulfilment of what follows, \"And the desired of all nations shall come,\" is looked for at His last coming. For ere men can desire and wait for Him, they must believe and love Him."
