context = "Complete naturally separated named-prophet paragraph 18.35, body raw lines 10445-10459, read with the chapter heading at lines 10442 onward and adjacent complete paragraph/chapter context. George Wilson translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. The complete first paragraph of XVIII.35 treats Haggai: the shaking of heaven/earth/sea/dry land and nations, and the coming of the desired of nations, receive Christological exposition. The English witness's short note 562 says Hag. ii. 6, but actual clauses fall at Vulgate/Challoner Aggeus 2:7-8. This canonical mapping was checked by reading those exact verses, rather than copying the witness's reference or assuming a same-number match. The separate Zechariah and Malachi paragraphs are not included."
