  { line = 7031, text = "weak are girded with strength.\" The bow is made weak, that is, the" },
  { line = 7032, text = "intention of those who think themselves so powerful, that without the" },
  { line = 7033, text = "gift and help of God they are able by human sufficiency to fulfil the" },
  { line = 7034, text = "divine commandments; and those are girded with strength whose inward" },
  { line = 7035, text = "cry is, \"Have mercy upon me, O Lord, for I am weak.\"" },
  { line = 7037, text = "\"They that were full of bread,\" she says, \"are diminished, and the" },
  { line = 7038, text = "hungry have gone beyond the earth.\" Who are to be understood as full of" },
  { line = 7039, text = "bread except those same who were as if mighty, that is, the Israelites," },
  { line = 7040, text = "to whom were committed the oracles of God?" },
  { line = 7040, text = "But among that people" },
  { line = 7041, text = "the children of the bond maid were diminished,--by which word minus," },
  { line = 7042, text = "although it is Latin, the idea is well expressed that from being" },
  { line = 7043, text = "greater they were made less,--because, even in the very bread, that" },
  { line = 7044, text = "is, the divine oracles, which the Israelites alone of all nations have" },
  { line = 7045, text = "received, they savour earthly things. But the nations to whom that law" },
  { line = 7046, text = "was not given, after they have come through the New Testament to these" },
  { line = 7047, text = "oracles, by thirsting much have gone beyond the earth, because in them" },
  { line = 7048, text = "they have savoured not earthly, but heavenly things. And the reason why" },
  { line = 7049, text = "this is done is as it were sought; \"for the barren,\" she says, \"hath" },
  { line = 7050, text = "born seven, and she that hath many children is waxed feeble.\" Here" },
  { line = 7051, text = "all that had been prophesied hath shone forth to those who understood" },
  { line = 7052, text = "the number seven, which signifies the perfection of the universal" },
  { line = 7053, text = "Church. For which reason also the Apostle John writes to the seven" },
  { line = 7054, text = "churches," },
  { line = 7054, text = "showing in that way that he writes to the totality of" },
  { line = 7055, text = "the one Church; and in the Proverbs of Solomon it is said aforetime," },
  { line = 7056, text = "prefiguring this, \"Wisdom hath builded her house, she hath strengthened" },
  { line = 7057, text = "her seven pillars.\"" },
  { line = 7057, text = "For the city of God was barren in all nations" },
  { line = 7058, text = "before that child arose whom we see." },
  { line = 7058, text = "We also see that the temporal" },
  { line = 7059, text = "Jerusalem, who had many children, is now waxed feeble. Because," },
  { line = 7060, text = "whoever in her were sons of the free woman were her strength; but now," },
  { line = 7061, text = "forasmuch as the letter is there, and not the spirit, having lost her" },
  { line = 7062, text = "strength, she is waxed feeble." },
  { line = 7064, text = "\"The Lord killeth and maketh alive:\" He has killed her who had many" },
  { line = 7065, text = "children, and made this barren one alive, so that she has born seven." },
  { line = 7066, text = "Although it may be more suitably understood that He has made those same" },
  { line = 7067, text = "alive whom He has killed. For she, as it were, repeats that by adding," },
  { line = 7068, text = "\"He bringeth down to hell, and bringeth up.\" To whom truly the apostle" },
  { line = 7069, text = "says, \"If ye be dead with Christ, seek those things which are above," },
  { line = 7070, text = "where Christ sitteth on the right hand of God.\"" },
  { line = 7070, text = "Therefore they are" },
  { line = 7071, text = "killed by the Lord in a salutary way, so that he adds, \"Savour things" },
  { line = 7072, text = "which are above, not things on the earth;\" so that these are they who," },
  { line = 7073, text = "hungering, have passed beyond the earth. \"For ye are dead,\" he says:" },
  { line = 7074, text = "behold how God savingly kills! Then there follows, \"And your life is" },
  { line = 7075, text = "hid with Christ in God:\" behold how God makes the same alive! But does" },
  { line = 7076, text = "He bring them down to hell and bring them up again? It is without" },
  { line = 7077, text = "controversy among believers that we best see both parts of this work" },
  { line = 7078, text = "fulfilled in Him, to wit, our Head, with whom the apostle has said our" },
  { line = 7079, text = "life is hid in God. \"For when He spared not His own Son, but delivered" },
  { line = 7080, text = "Him up for us all,\"" },
  { line = 7080, text = "in that way, certainly, He has killed Him." },
  { line = 7081, text = "And forasmuch as He raised Him up again from the dead, He has made Him" },
  { line = 7082, text = "alive again. And since His voice is acknowledged in the prophecy, \"Thou" },
  { line = 7083, text = "wilt not leave my soul in hell,\"" },
  { line = 7083, text = "He has brought Him down to hell" },
  { line = 7084, text = "and brought Him up again. By this poverty of His we are made rich;" },
  { line = 7085, text = "for \"the Lord maketh poor and maketh rich.\" But that we may know what" },
  { line = 7086, text = "this is, let us hear what follows: \"He bringeth low and lifteth up;\"" },
  { line = 7087, text = "and truly He humbles the proud and exalts the humble. Which we also" },
  { line = 7088, text = "read elsewhere, \"God resisteth the proud, but giveth grace to the" },
  { line = 7089, text = "humble.\"" },
  { line = 7089, text = "This is the burden of the entire song of this woman whose" },
  { line = 7090, text = "name is interpreted \"His grace.\"" },
  { line = 7092, text = "Farther, what is added, \"He raiseth up the poor from the earth,\" I" },
  { line = 7093, text = "understand of none better than of Him who, as was said a little ago," },
  { line = 7094, text = "\"was made poor for us, when He was rich, that by His poverty we might" },
  { line = 7095, text = "be made rich.\" For He raised Him from the earth so quickly that His" },
  { line = 7096, text = "flesh did not see corruption. Nor shall I divert from Him what is" },
  { line = 7097, text = "added, \"And raiseth up the poor from the dunghill.\" For indeed he who" },
  { line = 7098, text = "is the poor man is also the beggar." },
  { line = 7098, text = "But by the dunghill from which" },
  { line = 7099, text = "he is lifted up we are with the greatest reason to understand the" },
  { line = 7100, text = "persecuting Jews, of whom the apostle says, when telling that when he" },
  { line = 7101, text = "belonged to them he persecuted the Church, \"What things were gain to" },
  { line = 7102, text = "me, those I counted loss for Christ; and I have counted them not only" },
  { line = 7103, text = "loss, but even dung, that I might win Christ.\"" },
  { line = 7103, text = "Therefore that poor" },
  { line = 7104, text = "one is raised up from the earth above all the rich, and that beggar is" },
  { line = 7105, text = "lifted up from that dunghill above all the wealthy, \"that he may sit" },
  { line = 7106, text = "among the mighty of the people,\" to whom He says, \"Ye shall sit upon" },
  { line = 7107, text = "twelve thrones,\"" },
  { line = 7107, text = "\"and to make them inherit the throne of glory.\"" },
  { line = 7108, text = "For these mighty ones had said, \"Lo, we have forsaken all and followed" },
  { line = 7109, text = "Thee.\" They had most mightily vowed this vow." },
  { line = 7111, text = "But whence do they receive this, except from Him of whom it is here" },
  { line = 7112, text = "immediately said, \"Giving the vow to him that voweth?\" Otherwise they" },
  { line = 7113, text = "would be of those mighty ones whose bow is weakened. \"Giving,\" she" },
  { line = 7114, text = "saith, \"the vow to him that voweth.\" For no one could vow anything" },
  { line = 7115, text = "acceptable to God, unless he received from Him that which he might" },
  { line = 7116, text = "vow. There follows, \"And He hath blessed the years of the just,\" to" },
  { line = 7117, text = "wit, that he may live for ever with Him to whom it is said, \"And" },
  { line = 7118, text = "Thy years shall have no end.\" For there the years abide; but here" },
  { line = 7119, text = "they pass away, yea, they perish: for before they come they are not," },
  { line = 7120, text = "and when they shall have come they shall not be, because they bring" },
  { line = 7121, text = "their own end with them. Now of these two, that is, \"giving the vow" },
  { line = 7122, text = "to him that voweth,\" and \"He hath blessed the years of the just,\"" },
  { line = 7123, text = "the one is what we do, the other what we receive. But this other" },
  { line = 7124, text = "is not received from God, the liberal giver, until He, the helper," },
  { line = 7125, text = "Himself has enabled us for the former; \"for man is not mighty in" },
  { line = 7126, text = "strength.\" \"The Lord shall make his adversary weak,\" to wit, him who" },
  { line = 7127, text = "envies the man that vows, and resists him, lest he should fulfil" },
  { line = 7128, text = "what he has vowed. Owing to the ambiguity of the Greek, it may also" },
  { line = 7129, text = "be understood \"his own adversary.\" For when God has begun to possess" },
  { line = 7130, text = "us, immediately he who had been our adversary becomes His, and is" },
  { line = 7131, text = "conquered by us; but not by our own strength, \"for man is not mighty" },
  { line = 7132, text = "in strength.\" Therefore \"the Lord shall make His own adversary weak," },
  { line = 7133, text = "the Lord is holy,\" that he may be conquered by the saints, whom the" },
  { line = 7134, text = "Lord, the Holy of holies, hath made saints. For this reason, \"let" },
  { line = 7135, text = "not the prudent glory in his prudence, and let not the mighty glory" },
  { line = 7136, text = "in his might, and let not the rich glory in his riches; but let him" },
  { line = 7137, text = "that glorieth glory in this,--to understand and know the Lord, and to" },
  { line = 7138, text = "do judgment and justice in the midst of the earth.\" He in no small" },
  { line = 7139, text = "measure understands and knows the Lord who understands and knows that" },
  { line = 7140, text = "even this, that he can understand and know the Lord, is given to him" },
  { line = 7141, text = "by the Lord. \"For what hast thou,\" saith the apostle, \"that thou hast" },
  { line = 7142, text = "not received? But if thou hast received it, why dost thou glory as" },
  { line = 7143, text = "if thou hadst not received it?\"" },
  { line = 7143, text = "That is, as if thou hadst of" },
  { line = 7144, text = "thine own self whereof thou mightest glory. Now, he does judgment and" },
  { line = 7145, text = "justice who lives aright. But he lives aright who yields obedience to" },
  { line = 7146, text = "God when He commands. \"The end of the commandment,\" that is, to which" },
  { line = 7147, text = "the commandment has reference, \"is charity out of a pure heart, and" },
  { line = 7148, text = "a good conscience, and faith unfeigned.\" Moreover, this \"charity,\"" },
  { line = 7149, text = "as the Apostle John testifies, \"is of God.\"" },
  { line = 7149, text = "Therefore to do" },
  { line = 7150, text = "justice and judgment is of God. But what is \"in the midst of the" },
  { line = 7151, text = "earth?\" For ought those who dwell in the ends of the earth not to do" },
  { line = 7152, text = "judgment and justice? Who would say so? Why, then, is it added, \"In" },
  { line = 7153, text = "the midst of the earth?\" For if this had not been added, and it had" },
  { line = 7154, text = "only been said, \"To do judgment and justice,\" this commandment would" },
  { line = 7155, text = "rather have pertained to both kinds of men,--both those dwelling" },
  { line = 7156, text = "inland and those on the sea-coast. But lest any one should think" },
  { line = 7157, text = "that, after the end of the life led in this body, there remains a" },
  { line = 7158, text = "time for doing judgment and justice which he has not done while he" },
  { line = 7159, text = "was in the flesh, and that the divine judgment can thus be escaped," },
  { line = 7160, text = "\"in the midst of the earth\" appears to me to be said of the time" },
  { line = 7161, text = "when every one lives in the body; for in this life every one carries" },
  { line = 7162, text = "about his own earth, which, on a man's dying, the common earth takes" },
  { line = 7163, text = "back, to be surely returned to him on his rising again. Therefore \"in" },
  { line = 7164, text = "the midst of the earth,\" that is, while our soul is shut up in this" },
  { line = 7165, text = "earthly body, judgment and justice are to be done, which shall be" },
  { line = 7166, text = "profitable for us hereafter, when \"every one shall receive according" },
  { line = 7167, text = "to that he hath done in the body, whether good or bad.\"" },
  { line = 7167, text = "For when" },
  { line = 7168, text = "the apostle there says \"in the body,\" he means in the time he has" },
  { line = 7169, text = "lived in the body. Yet if any one blaspheme with malicious mind and" },
  { line = 7170, text = "impious thought, without any member of his body being employed in it," },
  { line = 7171, text = "he shall not therefore be guiltless because he has not done it with" },
  { line = 7172, text = "bodily motion, for he will have done it in that time which he has" },
  { line = 7173, text = "spent in the body. In the same way we may suitably understand what we" },
  { line = 7174, text = "read in the psalm, \"But God, our King before the worlds, hath wrought" },
  { line = 7175, text = "salvation in the midst of the earth;\"" },
  { line = 7175, text = "so that the Lord Jesus" },
  { line = 7176, text = "may be understood to be our God who is before the worlds, because by" },
  { line = 7177, text = "Him the worlds were made, working our salvation in the midst of the" },
  { line = 7178, text = "earth, for the Word was made flesh and dwelt in an earthly body." },
  { line = 7180, text = "Then after Hannah has prophesied in these words, that he who glorieth" },
  { line = 7181, text = "ought to glory not in himself at all, but in the Lord, she says, on" },
  { line = 7182, text = "account of the retribution which is to come on the day of judgment," },
  { line = 7183, text = "\"The Lord hath ascended into the heavens, and hath thundered: He" },
  { line = 7184, text = "shall judge the ends of the earth, for He is righteous.\" Throughout" },
  { line = 7185, text = "she holds to the order of the creed of Christians: For the Lord" },
  { line = 7186, text = "Christ has ascended into heaven, and is to come thence to judge the" },
  { line = 7187, text = "quick and dead." },
  { line = 7187, text = "For, as saith the apostle, \"Who hath ascended" },
  { line = 7188, text = "but He who hath also descended into the lower parts of the earth? He" },
  { line = 7189, text = "that descended is the same also that ascended up above all heavens," },
  { line = 7190, text = "that He might fill all things.\"" },
  { line = 7190, text = "Therefore He hath thundered" },
  { line = 7191, text = "through His clouds, which He hath filled with His Holy Spirit when" },
  { line = 7192, text = "He ascended up. Concerning which the bond maid Jerusalem that is," },
  { line = 7193, text = "the unfruitful vineyard is threatened in Isaiah the prophet that" },
  { line = 7194, text = "they shall rain no showers upon her. But \"He shall judge the ends" },
  { line = 7195, text = "of the earth\" is spoken as if it had been said, \"even the extremes" },
  { line = 7196, text = "of the earth.\" For it does not mean that He shall not judge the" },
  { line = 7197, text = "other parts of the earth, who, without doubt, shall judge all men." },
  { line = 7198, text = "But it is better to understand by the extremes of the earth the" },
  { line = 7199, text = "extremes of man, since those things shall not be judged which, in" },
  { line = 7200, text = "the middle time, are changed for the better or the worse, but the" },
  { line = 7201, text = "ending in which he shall be found who is judged. For which reason" },
  { line = 7202, text = "it is said, \"He that shall persevere even unto the end, the same" },
  { line = 7203, text = "shall be saved.\"" },
  { line = 7203, text = "He, therefore, who perseveringly does judgment" },
  { line = 7204, text = "and justice in the midst of the earth shall not be condemned when" },
  { line = 7205, text = "the extremes of the earth shall be judged. \"And giveth,\" she saith," },
  { line = 7206, text = "\"strength to our kings,\" that He may not condemn them in judging." },
  { line = 7207, text = "He giveth them strength whereby as kings they rule the flesh, and" },
  { line = 7208, text = "conquer the world in Him who hath poured out His blood for them." },
  { line = 7209, text = "\"And shall exalt the horn of His Christ.\" For He of whom it was said" },
  { line = 7210, text = "above, \"The Lord hath ascended into the heavens,\" meaning the Lord" },
  { line = 7211, text = "Christ, Himself, as it is said here, \"shall exalt the horn of His" },
  { line = 7212, text = "Christ.\" Who, therefore, is the Christ of His Christ? Does it mean" },
  { line = 7213, text = "that He shall exalt the horn of each one of His believing people," },
  { line = 7214, text = "as she says in the beginning of this hymn, \"Mine horn is exalted in" },
  { line = 7215, text = "my God?\" For we can rightly call all those christs who are anointed" },
  { line = 7216, text = "with His chrism, forasmuch as the whole body with its head is one" },
  { line = 7217, text = "Christ." },
  { line = 7217, text = "These things hath Hannah, the mother of Samuel, the holy" },
  { line = 7218, text = "and much-praised man, prophesied, in which, indeed, the change of the" },
  { line = 7219, text = "ancient priesthood was then figured and is now fulfilled, since she" },
  { line = 7220, text = "that had many children is waxed feeble, that the barren who hath" },
  { line = 7221, text = "born seven might have the new priesthood in Christ." },
]
