context = "Complete chapter 17.4, body raw lines 6926-7221, read with the chapter heading at lines 6922 onward and adjacent complete paragraph/chapter context. George Wilson translated this book, as the retained volume II translator attribution at lines 133-135, title-page Dods credit and edition identity state. Complete chapter XVII.4: Hannah's thanksgiving is quoted and expounded successively from the rejoicing heart and horn to the final exaltation of the Christ. Canonical Vulgate 1 Kings 2:1-10 is modern 1 Samuel 2:1-10. The chapter's Greek/Old Latin form includes clauses absent from the held Challoner form; those differences remain in Wilson's English. Supporting Pauline, Psalm and Gospel parallels create no additional edges."
