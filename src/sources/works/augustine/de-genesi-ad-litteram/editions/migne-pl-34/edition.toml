notes = "Migne's reprint of the Maurist text, complete in twelve books, each preceded by the Maurists' own argument stating which verses of Genesis the book expounds. Those arguments are the ground on which each book's scriptural extent is declared here, and they are carried in the transcription rather than paraphrased beside it. No English translation of this work is in the public domain: the first complete one is J. H. Taylor's, Ancient Christian Writers 41-42, 1982, which is in copyright, so this work is held in Latin only and the site says so."
