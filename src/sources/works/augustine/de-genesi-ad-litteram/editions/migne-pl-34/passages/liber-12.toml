Intellectualis visio non fallit. In aliis falli non semper est perniciosum. Non enim magnum est, tunc eum dignoscere, cum ad aliqua pervenerit vel perduxerit, quae sunt contra bonos mores vel regulam fidei: tunc enim a multis discernitur. Illo autem dono, in ipso primordio quo multis adhuc bonus apparet, continuo dijudicatur an malus sit.\
