context = "The whole of book XII of De Genesi ad litteram as Migne prints it in Patrologia Latina 34, in all 39 of the paragraphs the printing gives it, the running head and the Maurist argument included. The argument reads \"In quo de paradiso et tertio coelo quo raptus est Paulus, deque multiplici visionum genere disputatur\" and names no verse of Genesis. The extent is declared at Genesis 2:8, where paradise is planted, because that is the Genesis question the book argues from; the greater part of the book is on 2 Corinthians 12 and on the kinds of vision, and this anchor is this project's inference rather than Migne's."
