text = """
LIBER DUODECIMUS. In quo de paradiso et tertio coelo quo raptus est Paulus, deque multiplici visionum genere disputatur.

De paradiso locus Apostoli examinandus. 1. Ab exordio Scripturae sanctae, quae inscribitur Genesis, donec homo primus de paradiso dimissus est, undecim libris sive asserendo atque defendendo quae certa nobis sunt, sive inquirendo et ambigendo de incertis, quae potuimus, et sicut potuimus, disseruimus atque conscripsimus; non tam praescribentes de rebus obscuris unicuique quid sentiat, quam nos docendos in quibus dubitavimus ostendentes, temeritatemque affirmandi amoventes a lectore, ubi non valuimus praebere sententiae firmitatem: iste autem duodecimus liber ea jam cura expeditus, qua nos pertractandus textus sacrarum Litterarum occupabat, liberius atque prolixius versabit de paradiso quaestionem; ne putemur evitasse, quod videtur Apostolus in tertio coelo insinuare paradisum, ubi ait: Scio hominem in Christo ante annos quatuordecim, sive in corpore nescio, sive extra corpus nescio, Deus scit, raptum ejusmodi usque in tertium coelum: et scio ejusmodi hominem sive in corpore sive extra corpus nescio, Deus scit, quia raptus est in paradisum, et audivit ineffabilia verba, quae non licet homini loqui (II Cor. XII, 2 4). 2. In his verbis primum quaeri solet, quid dicat tertium coelum: deinde, utrum illic intelligi voluerit paradisum, an posteaquam raptus est in tertium coelum, raptum esse et in paradisum, ubicumque sit paradisus; non ut hoc fuerit rapi in tertium coelum quod in paradisum, sed prius in tertium coelum, et post inde in paradisum. Et hoc sic ambiguum est, ut non mihi videatur posse dissolvi, nisi aliquis non ex praesentibus Apostoli verbis, sed ex aliis forte Scripturarum locis, vel ratione perspicua, inveniat aliquid, quo doceat sive in tertio coelo esse paradisum, sive non esse, cum et ipsum tertium coelum quid sit non liquido appareat, utrum in rebus corporalibus, an forte in spiritualibus intelligendum sit. Posset quidem dici nonnisi in locum aliquem corporalem hominem rapi potuisse cum corpore; sed quia et hoc ita posuit ut nescire se dixerit, utrum in corpore, an extra corpus raptus sit, quis audeat dicere se scire quod se nescire Apostolus dixit? Verumtamen si neque spiritus sine corpore ad loca corporalia rapi potest, nec corpus ad spiritualia, haec ipsa dubitatio ejus velut cogit intelligi (siquidem de seipso haec eum scripsisse nemo ambigit), tale fuisse illud quo raptus est, quod utrum corporale an spirituale esset, dignosci discernique non posset.

Apostolum potuisse nescire an extra corpus paradisum viderit, si vidit in ecstasi. 3. Cum enim vel in somnis, vel in ecstasi, corporum exprimuntur imagines, non discernuntur omnino a corporibus, nisi cum homo redditus sensibus corporis, recognoscit se in illis fuisse imaginibus, quas non per sensum corporis hauriebat. Quis enim cum a somno evigilaverit, non continuo sentiat imaginaria fuisse quae videbat, quamvis cum ea videret dormiens, a vigilantium corporalibus visis discernere non valebat? Quanquam mihi accidisse scio, et ob hoc etiam aliis accidere potuisse vel posse non dubito, ut in somnis videns, in somnis me videre sentirem; illasque imagines, quae ipsam nostram consensionem ludificare consueverunt, non esse vera corpora, sed in somnis eas praesentari firmissime, etiam dormiens, tenerem atque sentirem. Hoc tamen fallebar aliquando, quod amico meo, quem similiter in somnis videbam, idipsum persuadere conabar, non esse illa corpora, quae videbamus, sed esse imagines somniantium, cum et ipse utique inter illa sic mihi appareret quomodo illa: cui et hoc dicebam, neque id verum esse quod pariter loqueremur, sed etiam ipsum tunc aliud aliquid videre dormientem, et utrum ista ego viderem omnino non scire; verum cum eidem ipsi persuadere moliebar quod ipse non esset, adducebar ex parte etiam ipsum putare esse, cui profecto non loquerer, si omni modo sic afficerer quod ipse non esset. Ita non poterat, quamvis mirabiliter vigilans, anima dormientis, nisi duci imaginibus corporum, ac si corpora ipsa essent. 4. In ecstasi autem unum audire potui, et eum rusticanum vix valentem quod sentiebat exprimere, qui et vigilare se sciret, et videre quiddam non oculis corporis. Nam ut ejus verbis utar, quantum recolere possum: Anima mea, inquit, videbat eum, non oculi mei. Non tamen sciebat utrum corpus esset, an imago corporis. Non enim erat talis, ut ista discerneret, verum tam simpliciter fidelis, ut eum sic audirem, ac si illud quod se vidisse narrabat, ipse vidissem. 5. Ac per hoc si paradisum Paulus ita vidit, ut apparuit Petro ille discus submissus e coelo (Act. X, 11), ut Joanni quidquid in Apocalypsi se vidisse conscripsit (Apoc. I, 12, etc.), ut Ezechieli campus ille cum ossibus mortuorum et illa eorum resurrectio (Ezech. XXXVII, 1-10), ut Isaiae sedens Deus, et in conspectu ejus Seraphim, et ara unde carbo assumptus Prophetae labia mundavit (Isai. VI, 1-7); manifestum est eum ignorare potuisse utrum in corpore, an extra corpus ea viderit.

Apostolus certus se vidisse tertium coelum, incertus quomodo viderit. 6. Sed si extra corpus visa sunt, et corpora non fuerunt, adhuc quaeri potest utrum imagines corporum fuerint, an ea substantia quae nullam corporis similitudinem gerit, sicut Deus, sicut ipsa mens hominis, vel intelligentia, vel ratio, sicut virtutes, prudentia, justitia, castitas, charitas, pietas, et quaecumque aliae sunt, quas intelligendo atque cogitando enumeramus, discernimus, definimus, non utique intuentes lineamenta earum vel colores, aut quomodo sonent, aut quid oleant, aut quid inore sapiant, aut quid contrectantibus de calore seufrigore, mollitudine seu duritia, lenitate seu asperitate renuntient; sed alia quadam visione, alia luce, alia rerum evidentia, et ea longe caeteris praestantiore atque certiore. 7. Rursus igitur ad eadem ipsa Apostoli verba redeamus, et ea diligentius perscrutemur, hoc sine dubitatione primitus constituto, multo magis atque incomparabiliter amplius Apostolum scisse, quod de incorporea corporeaque natura nos ut sciamus utcumque, conamur. Si ergo sciebat, spiritualia per corpus, corporalia extra corpus videri omnino non posse; cur non per ea ipsa quae vidit, quomodo etiam potuerit videre, discrevit? Si enim certus erat illa esse spiritualia, cur non consequenter extra corpus ea se vidisse certus nihilominus erat? Si autem corporalia esse noverat, nonnisi per corpus videri potuisse cur non etiam noverat? Unde ergo dubitat utrum in corpore an extra corpus ea viderit, nisi forte ita etiam dubitat utrum illa corpora an similitudines corporum fuerint? Prius itaque videamus quid sit in verborum istorum contextione unde non dubitet, atque ita cum remanserit unde dubitet, fortassis ex his de quibus non dubitat, quomodo etiam illud dubitet apparebit. 8. Scio, inquit, hominem in Christo ante annos quatuordecim, sive in corpore nescio, sive extra corpus nescio, Deus scit, raptum ejusmodi usque in tertium coelum. Scit ergo ante annos quatuordecim in Christo raptum hominem usque ad tertium coelum, hoc omnino non dubitat; nec nos ergo dubitemus: sed utrum in corpore an extra corpus, dubitat; unde illo dubitante, quis nostrum certus esse audeat? Num forte hinc etiam illud consequens erit ut tertium coelum fuisse dubitemus, quo raptum hominem dixit? Si enim res ipsa demonstrata est, tertium coelum demonstratum est: si autem imago aliqua corporalium similis facta est, non erat illud tertium coelum, sed illa ostensio sic ordinata est, ut videretur sibi ascendere primum coelum, super quod videret alterum, quo rursus ascendens iterum alterum videret superius, quo cum pervenisset, posset dicere se in tertium coelum raptum. Sed illud quod tertium coelum esset, quo raptus est, neque dubitavit, neque dubitare nos voluit: ad hoc enim praemisit, Scio, et inde coepit, ut id quod se scire Apostolus dicit, solus ille non credat verum esse, qui non credit Apostolo.

Vere tertium coelum fuisse illud quo raptus est Apostolus. Difficultas quomodo Apostolus certus sit de coelo viso, et incertus de modo quo visum fuit. 9. Scit ergo hominem raptum esse usque in tertium coelum: proinde illud quo raptus est, vere tertium coelum est; non signum aliquod corporale, quod cum ostenderetur Moysi, usque adeo sentiebat aliud esse ipsam Dei substantiam, aliud visibilem creaturam, in qua se Deus humanis et corporalibus sensibus praesentabat, ut diceret, Ostende mihi temetipsum (Exod. XXXIII, 13); nec aliqua imago rei corporalis, quam cum Joannes videret in spiritu, quaerebat quid esset, eique respondebatur, vel, Civitas est, vel, Populi sunt, vel aliquid aliud, cum videret ille bestiam, sive mulierem, sive aquas, sive quid ejusmodi (Apoc. XIII, 1, et XVII, 15, 18): sed, Scio, inquit, hominem raptum usque in tertium coelum. 10. Quod si spiritualem imaginem corporali similem coelum appellare voluisset, sic erat etiam imago corporis ejus, in qua illuc raptus ascenderat: sic ergo et suum corpus appellaret, quamvis imaginem corporis, quomodo illud coelum, quamvis imaginem coeli; neque curaret discernere quid sciret, et quid nesciret, id est quia sciret raptum hominem usque ad tertium coelum, nesciret autem utrum in corpore an extra corpus; sed simpliciter narraret visionem, earum rerum nominibus appellans illa quae vidit, quarum erant similia. Nam et nos dicimus, cum somnia nostra narramus vel aliquam in eis revelationem, Vidi montem, vidi fluvium, vidi tres homines, et si quid ejusmodi; ea nomina tribuentes illis imaginibus, quae habent res ipsae quarum similes erant: Apostolus autem, Illud, inquit, scio, illud nescio. 11. At si utrumque imaginaliter apparuit, utrumque pariter scitur, pariterve nescitur: si autem proprie coelum, et ideo scitur; quomodo potuit imaginaliter corpus illius hominis apparere? 12. Nam si coelum corporeum videbatur, quare latebat utrum corporeis oculis videretur? Si autem incertum erat utrum oculis corporeis an spiritu videretur, et ideo dictum est, Sive in corpore, sive extra corpus, nescio; quomodo non incertum erat et illud, utrum vere coelum corporeum videretur, an imaginaliter ostenderetur? Itemque si substantia incorporea videbatur, non in aliqua imagine corporis, sed sicut videtur justitia, sapientia, et si quid ejusmodi, et hoc erat coelum; id quoque manifestum est, oculis hujus corporis videri aliquid tale non posse: ac per hoc si aliquid tale se vidisse sciebat, non per corpus se vidisse dubitare non poterat. Scio, inquit, hominem in Christo ante annos quatuordecim: hoc scio, nemo dubitet qui mihi credit; sed utrum in corpore an extra corpus, nescio, Deus scit.

Eadem difficultas enodatur. 13. Quid ergo scis, quod discernis ab eo quod nescis, ne credentes fallantur? Raptum, inquit, eumdem hominem usque in tertium coelum. At illud coelum aut corpus erat, aut spiritus: si corpus erat, et corporeis oculis visum est; cur illud coelum esse scitur, et in corpore visum esse nescitur? Si autem spiritus erat; aut corporis imaginem praebuit, et tam incertum est utrum corpus fuerit, quam incertum est utrum in corpore visum sit; aut sic visum est, quomodo videtur mente sapientia, sine ullis imaginibus corporum, et nihilominus certum est videri non potuisse per corpus: aut ergo utrumque certum est, aut utrumque incertum; aut quomodo certum quod visum est, incertum autem per quod visum est? Manifestum est enim incorpoream naturam ab eo videri non potuisse per corpus. Corpora vero etiam si possunt videri sine corpore, non utique sic videntur per corpus, sed longe ille dispar modus est si quis est; unde mirum si posset Apostolum tanquam simillimus fallere, aut ad dubitationem cogere, ut si corporeum coelum non corporeis oculis vidit, incertum sibi esse diceret utrum in corpore an extra corpus id viderit. 14. Restat ergo fortasse ut quoniam mentiri non posset Apostolus, qui tanta cura egit, ut discerneret quid sciret, et quid nesciret, hoc ipsum eum intelligamus ignorasse, utrum quando in tertium coelum raptus est, in corpore fuerit, quomodo est anima in corpore, cum corpus vivere dicitur, sive vigilantis, sive dormientis, sive in ecstasi a sensibus corporis alienata; an omnino de corpore exierit, ut mortuum corpus jaceret, donec peracta illa demonstratione membris mortuis anima redderetur, et non quasi dormiens evigilaret, aut ecstasi alienatus denuo rediret in sensus, sed mortuus omnino revivisceret. Proinde quod vidit raptus usque in tertium coelum, quod etiam se scire confirmat, proprie vidit, non imaginaliter. Sed quia ipsa a corpore alienata, utrum omnino mortuum corpus reliquerit, an secundum modum quemdam viventis corporis ibi anima fuerit, sed mens ejus ad videnda vel audienda ineffabilia illius visionis arrepta sit, hoc incertum erat, ideo forsitan dixit, Sive in corpore sive extra corpus, nescio, Deus scit.

Visionum genera tria. 15. Quod autem non imaginaliter, sed proprie videtur, et non per corpus videtur, hoc ea visione videtur, quae omnes caeteras superat. Harum species atque differentias, quantum me Dominus adjuverit, explicare curabo. Ecce in hoc uno praecepto cum legitur, Diliges proximum tuum tanquam teipsum (Matth. XXII, 39), tria genera visionum occurrunt: unum per oculos, quibus ipsae litterae videntur; alterum per spiritum hominis quo proximus et absens cogitatur; tertium per contuitum mentis, quo ipsa dilectio intellecta conspicitur. In his tribus generibus, illud primum manifestum est omnibus: in hoc enim videtur coelum et terra, et omnia quae in eis conspicua sunt oculis nostris. Nec illud alterum, quo absentia corporalia cogitantur, insinuare difficile est: ipsum quippe coelum et terram, et ea quae in eis videre possumus, etiam in tenebris constituti cogitamus; ubi nihil videntes oculis corporis, animo tamen corporales imagines intuemur, seu veras, sicut ipsa corpora videmus, et memoria retinemus; seu fictas, sicut cogitatio formare potuerit. Aliter enim cogitamus Carthaginem quam novimus, aliter Alexandriam quam non novimus. Tertium vero illud quo dilectio intellecta conspicitur, eas res continet, quae non habent imagines sui similes, quae non sunt quod ipsae. Nam homo vel arbor vel sol, et quaecumque alia corpora, sive coelestia sive terrestria, et praesentia videntur in suis formis, et absentia cogitantur imaginibus animo impressis; et faciunt duo genera visorum, unum per corporis sensus, alterum per spiritum, quo illae imagines continentur. Dilectio autem numquid aliter videtur praesens in specie qua est, et aliter absens in aliqua imagine sui simili? Non utique; sed quantum mente cerni potest, ab alio magis, ab alio minus ipsa cernitur: si autem aliquid corporalis imaginis cogitatur, non ipsa cernitur.

Genera visionum: corporale, spirituale, intellectuale. Corporale proprie et translate. Spirituale pluribus modis. 16. Haec sunt tria genera visionum, de quibus et in superioribus libris aliquid diximus, sicut res postulare videbatur, non tamen eorum numerum commemoravimus; et nunc breviter eis insinuatis, quoniam suscepta quaestio flagitat ut de his aliquanto uberius disseramus, debemus ea certis et congruis signare nominibus, ne assidue circumloquendo moras faciamus. Primum ergo appellemus corporale, quia per corpus percipitur et corporis sensibus exhibetur. Secundum spirituale; quidquid enim corpus non est et tamen aliquid est, jam recte spiritus dicitur: et utique non est corpus, quamvis corpori similis sit, imago absentis corporis, nec ille ipse obtutus quo cernitur. Tertium vero intellectuale, ab intellectu; quia mentale, a mente, ipsa vocabuli novitate nimis absurdum est, ut dicamus. 17. Horum vocabulorum rationem si subtilius reddam, et prolixior et perplexior sermo erit, cum hoc vel nulla, vel certe non tanta necessitas exigat. Satis est ergo scire corporale aliquid vel proprie dici, cum de corporibus agitur, vel etiam translato vocabulo, sicut dictum est, Quia in ipso inhabitat omnis plenitudo divinitatis corporaliter. Neque enim divinitas corpus est, sed quia sacramenta Veteris Testamenti appellat umbras futuri, propter umbrarum comparationem corporaliter dixit habitare in Christo plenitudinem divinitatis, quod in illo impleantur omnia, quae in illis umbris figurata sunt, ac sic quodammodo umbrarum illarum ipse sit corpus (Coloss. II, 9, 17), hoc est figurarum et significationum illarum ipse sit veritas. Sicut ergo ipsae figurae significative, translato utique vocabulo, non proprie dictae sunt umbrae; ita et quod ait plenitudinem divinitatis corporaliter habitare, translato verbo usus est. 18. Spirituale autem pluribus modis dicitur. Nam et corpus, quod futurum est in resurrectione sanctorum, spirituale appellat Apostolus, ubi ait, Seminatur corpus animale, resurget corpus spirituale (I Cor. XV, 44); eo quod miris modis ad omnem facilitatem et incorruptionem spiritui subdatur, et sine ulla indigentia corporalium alimentorum solo vivificetur spiritu, non quod incorpoream substantiam sit habiturum: neque enim et hoc corpus, quale nunc habemus, animae habet substantiam, et hoc est quod anima, quia dictum est animale. Item spiritus dicitur, vel aer iste, vel flatus ejus, id est motus ejus, sicut dictum est: Ignis, grando, nix, glacies, spiritus tempestatis (Psal. CXLVIII, 8). Dicitur etiam spiritus anima, sive pecoris, sive hominis, sicut scriptum est: Et quis scit, spiritus filiorum hominis si ascendat ipse sursum, et spiritus pecoris si descendat ipse deorsum in terram (Eccle. III, 21)? Dicitur spiritus et ipsa mens rationalis, ubi est quidam tanquam oculus animae, ad quem pertinet imago et agnitio Dei. Unde dicit Apostolus, Renovamini spiritu mentis vestrae, et induite novum hominem, qui secundum Deum creatus est (Ephes. IV, 23, 24); cum et alibi dicat de interiore homine, Qui renovatur in agnitione Dei, secundum imaginem ejus qui creavit eum (Coloss. III, 10). Item cum dixisset, Igitur ipse ego mente servio legi Dei, carne autem legi peccati (Rom. VII, 25); alio loco eamdem sententiam commemorans, Caro, inquit, concupiscit adversus spiritum, et spiritus adversus carnem, ut non ea quae vultis faciatis (Galat. V, 17), quam dixit mentem, hanc etiam spiritum appellavit. Dicitur spiritus etiam Deus, sicut ait Dominus in Evangelio: Spiritus est Deus, et eos qui adorant eum, in spiritu et veritate oportet adorare (Joan. IV, 24).

Unde spirituale dicitur visionum genus secundum. 19. Ex his omnibus modis, quos commemoravimus, quibus appellatur spiritus, non traximus hoc vocabulum, quo appellavimus spirituale hoc visionis genus de quo nunc agimus; sed ex illo uno modo quem invenimus in Epistola ad Corinthios, quo spiritus a mente distinguitur evidentissimo testimonio. Si enim oravero, inquit, lingua, spiritus meus orat, mens autem mea infructuosa est. Cum ergo linguam intelligatur hoc loco dicere obscuras et mysticas significationes, a quibus si intellectum mentis removeas, nemo aedificatur, audiendo quod non intelligit; unde etiam dicit, Qui enim loquitur lingua, non hominibus loquitur, sed Deo; nemo enim audit, spiritus autem loquitur mysteria: satis indicat eam se linguam hoc loco appellare, ubi sunt significationes velut imagines rerum ac similitudines, quae ut intelligantur, indigent mentis obtutu. Cum autem non intelliguntur, in spiritu eas dicit esse, non in mente: unde apertius ait, Si benedixeris spiritu; qui supplet locum idiotae, quomodo dicet, Amen, super tuam benedictionem, quandoquidem nescit quid dicas? Quia ergo etiam lingua, id est membro corporis quod movemus in ore cum loquimur, signa utique rerum dantur, non res ipsae proferuntur; propterea translato verbo linguam appellavit quamlibet signorum prolationem priusquam intelligantur: quo cum intellectus accesserit, qui mentis est proprius, fit revelatio, vel agnitio, vel prophetia, vel doctrina. Proinde ait, Si venero ad vos linguis loquens, quid vobis prodero, nisi loquar vobis in revelatione, aut in agnitione, aut in prophetia, aut in doctrina (I Cor. XIV, 14, 2, 16, 6)? id est cum signis; hoc est, linguae accesserit intellectus, ut non spiritu tantum, sed etiam mente agatur quod agitur.

Prophetiam ad mentem pertinere. 20. Proinde, quibus signa per aliquas rerum corporalium similitudines demonstrabantur in spiritu, nisi accessisset mentis officium, ut etiam intelligerentur, nondum erat prophetia; magisque propheta erat, qui interpretabatur quod alius vidisset, quam ipse qui vidisset. Unde apparet magis ad mentem pertinere prophetiam, quam ad istum spiritum, qui modo quodam proprio vocatur spiritus, vis animae quaedam mente inferior, ubi corporalium rerum similitudines exprimuntur. Itaque magis Joseph propheta, qui intellexit quid significarent septem spicae et septem boves, quam Pharao qui eas vidit in somnis (Gen. XLI, 1-32). Illius enim spiritus informatus est, ut videret; hujus mens illuminata, ut intelligeret. Ac per hoc in illo erat lingua, in isto prophetia; quia in illo rerum imaginatio, in isto imaginationum interpretatio. Minus ergo propheta, qui rerum quae significantur, sola ipsa signa in spiritu per rerum corporalium imagines videt; et magis propheta, qui solo earum intellectu praeditus est: sed et maxime propheta, qui utroque praecellit, ut et videat in spiritu corporalium rerum significativas similitudines, et eas vivacitate mentis intelligat, sicut Danielis excellentia tentata est et probata, qui regi et somnium quod viderat dixit, et quid significaret aperuit (Dan. II, 27-45, et IV, 16-24). Et ipsae quippe imagines corporales in spiritu ejus expressae sunt, et earum intellectus revelatus in mente. Ex hoc ergo modo quo appellatur in ista distinctione spiritus, secundum quem dixit Apostolus, Orabo spiritu, orabo autem et mente (I Cor. XIV, 15), ut et signa rerum formarentur in spiritu, et eorum refulgeret intellectus in mente; secundum hanc, inquam, distinctionem spirituale nunc appellavimus tale genus visorum, quali etiam corporum absentium imagines cogitamus.

Intellectuale genus visionis. 21. Intellectuale autem illud excellentius, quod mentis est proprium. Nec mihi occurrit omnino, ita pluribus modis dici posse intellectum, sicut spiritum multis modis appellatum esse comperimus. Sive autem intellectuale dicamus, sive intelligibile, hoc idem significamus. Quanquam nonnihil interesse nonnulli voluerunt, ut intelligibilis sit res ipsa, quae solo intellectu percipi potest; intellectualis autem, mens quae intelligit: sed esse aliquam rem quae solo intellectu cerni possit, ac non etiam intelligat, magna et difficilis quaestio est. Esse autem rem quae intellectu percipiat, et non etiam intellectu percipi possit, non arbitror quemquam vel putare, vel dicere; mens quippe non videtur nisi mente. Quia ergo videri potest, intelligibilis; quia et videre, intellectualis est, secundum illam distinctionem. Quapropter sequestrata illa difficillima quaestione, utrum sit aliquid quod tantum intelligatur nec intelligat, nunc intellectuale et intelligibile sub eadem significatione appellamus.

Corporalem visionem referri ad spiritualem, hanc vero ad intellectualem. 22. Tria igitur ista genera visionum, corporale, spirituale, et intellectuale, singillatim consideranda sunt, ut ab inferioribus ratio ad superiora conscendat. Jam quidem superius exemplum proposuimus, quo in una sententia omnia tria videantur genera. Cum enim legitur, Diliges proximum tuum tanquam teipsum (Matth. XXII, 39), corporaliter litterae videntur, spiritualiter proximus cogitatur, intellectualiter dilectio conspicitur. Sed et litterae absentes possunt spiritualiter cogitari, et proximus praesens potest corporaliter videri; dilectio autem nec per substantiam suam potest oculis corporis cerni, nec per imaginem corporis similem spiritu cogitari, sed sola mente, id est intellectu, cognosci et percipi. Corporalis sane visio nulli horum generi praesidet, sed quod per eam sentitur, illi spirituali tanquam praesidenti nuntiatur. Nam cum aliquid oculis cernitur, continuo fit imago ejus in spiritu; sed non dignoscitur facta, nisi cum ablatis oculis ab eo quod per oculos videbamus, imaginem ejus in animo invenerimus. Et siquidem spiritus irrationalis est, veluti pecoris, hoc usque oculi nuntiant. Si autem anima rationalis est, etiam intellectui nuntiatur, qui et spiritui praesidet, ut si illud quod hauserunt oculi, atque id spiritui, ut ejus illic imago fieret, nuntiaverunt, alicujus rei signum est, aut intelligatur continuo quid significet, aut quaeratur; quoniam nec intelligi nec requiri nisi officio mentis potest. 23. Vidit rex Balthasar articulos manus scribentis in pariete, continuoque per corporis sensum imago rei corporaliter factae spiritui ejus impressa est, atque ipso viso facto ac praeterito, illa in cogitatione permansit: videbatur in spiritu, et nondum intelligebatur, nec tunc intellectum erat hoc signum, cum corporaliter fieret atque oculis corporalibus appareret; jam tamen signum esse intelligebatur, id habens ex mentis officio. Et quia requirebatur quid significaret, etiam ipsam inquisitionem utique mens agebat. Quo non comperto Daniel accessit, et spiritu prophetico mente illustrata, perturbato regi quid illo signo portenderetur aperuit (Dan. V, 5-28); ipse potius propheta per hoc genus visionis, quod mentis est proprium, quam ille qui et signum corporaliter factum corporaliter viderat, et transacti ejus imaginem in spiritu cogitando cernebat, nec aliquid intellectu poterat, nisi nosse signum esse, et quid significaret inquirere. 24. Vidit Petrus in alienatione mentis vas quatuor lineis alligatum submitti de coelo plenum variis animalibus, cum audivit et vocem, Macta, et manduca. Qui cum redditus sensibus de visu disceptaret, ecce quos Cornelius miserat, nuntiavit ei spiritus dicens: Ecce viri quaerunt te; sed surge, descende, et vade cum illis, quia ego misi eos. Qui cum venisset ad Cornelium, quid in illa visione intellexerit, ubi audierat, Quae Deus mundavit, tu ne communia dixeris, ipse indicavit dicens: Sed mihi Deus ostendit neminem communem aut immundum hominem dicere (Act. X, 10-28). Cum ergo illum discum videret alienatus a corporis sensibus, et illas voces, Macta, et manduca, et, Quae Deus mundavit, tu communia ne dixeris, in spiritu audiebat. Redditus autem corporis sensibus, idipsum quod visum atque auditum memoria tenuerat, in eodem spiritu cogitando cernebat. Quae omnia non corporalia, sed corporalium imagines erant, sive cum primum in ipsa alienatione visae sunt, sive cum postea recordatae atque cogitatae. Cum vero disceptabatur, et requirebatur ut illa signa intelligerentur, mentis erat actio conantis, sed deerat effectus donec nuntiati sunt qui venerant a Cornelio; hac vero corporali etiam accedente visione, cum et Spiritus sanctus rursus in spiritu ei diceret, Vade cum eis, ubi et illud signum ostenderat, et impresserat voces, adjuta divinitus mens intellexit quid illis signis omnibus ageretur. His atque hujusmodi rebus diligenter consideratis, satis apparet corporalem visionem referri ad spiritualem, eamque spiritualem referri ad intellectualem.

Corporalis et spiritualis visio. 25. Sed cum vigilantes, neque mente a sensibus corporis alienata, in visione corporali sumus, discernimus ab ea visionem spiritualem, qua corpora absentia imaginaliter cogitamus, sive memoriter recordantes quae novimus, sive quae non novimus et tamen sunt, in ipsa spiritus cogitatione utcumque formantes, sive quae omnino nusquam sunt, pro arbitrio vel opinatione fingentes. Ab his omnibus ita discernimus illa corporalia quae videmus, et in quibus praesentibus sunt sensus corporis nostri, ut non dubitemus haec esse corpora, illas vero imagines corporum. Cum autem vel nimia cogitationis intentione, vel aliqua vi morbi, ut phreneticis per febrem accidere solet, vel commixtione cujusquam alterius spiritus seu mali seu boni, ita corporalium rerum in spiritu exprimuntur imagines, tanquam ipsis corporis sensibus corpora praesententur, manente tamen etiam in sensibus corporis intentione; sic videntur quae in spiritu fiunt imagines corporum, quemadmodum corpora ipsa per corpus; ita ut simul cernatur et homo aliquis praesens oculis, et absens alius spiritu tanquam oculis. Nam experti sumus sic affectos et cum eis locutos qui vere aderant, et cum aliis qui non aderant, tanquam adessent. Resipiscentes autem aliqui referunt quod vidissent, aliqui non possunt. Sic enim et somnia quidam obliviscuntur, quidam meminerunt. Quando autem penitus avertitur atque abripitur animi intentio a sensibus corporis, tunc magis ecstasis dici solet. Tunc omnino quaecumque sint praesentia corpora, etiam patentibus oculis non videntur, nec ullae voces prorsus audiuntur: totus animi contuitus aut in corporum imaginibus est per spiritualem, aut in rebus incorporeis nulla corporis imagine figuratis per intellectualem visionem. 26. Sed cum spiritualis visio, penitus alienato a sensibus corporis animo, imaginibus corporalium detinetur, sive in somnis sive in ecstasi, si nihil significant quae videntur, ipsius animae sunt imaginationes: sicut etiam vigilantes et sani, et nulla alienatione moti, multorum corporum quae non adsunt sensibus corporis, cogitatione imagines versant. Verum hoc interest, quod eas a praesentibus verisque corporibus constanti affectione discernunt. Si autem aliquid significant; sive dormientibus exhibeantur, sive vigilantibus, cum et oculis vident praesentia corpora, et absentium imagines cernunt spiritu, tanquam oculis praesto sint, sive illa quae ecstasis dicitur, alienato prorsus animo a sensibus corporis; mirus modus est: sed commixtione alterius spiritus fieri potest ut ea quae ipse scit, per hujusmodi imagines ei cui miscetur ostendat, sive intelligenti, sive ut ab alio intellecta pandantur. Si enim demonstrantur haec, nec utique a corpore demonstrari possunt, quid restat nisi ut ab aliquo spiritu demonstrentur?

An insit in anima vis divinationis. 27. Nonnulli quidem volunt animam humanam habere vim quamdam divinationis in seipsa. Sed si ita est, cur non semper potest, cum semper velit? An quia non semper adjuvatur ut possit? Cum ergo adjuvatur, numquid a nullo, aut a corpore ad hoc adjuvari potest? Proinde restat ut a spiritu adjuvetur. Deinde quomodo adjuvatur? Utrum in corpore fit aliquid, ut inde quasi relaxetur et emicet ejus intentio, quo in id veniat, ubi in seipsa videat significantes similitudines, quae ibi jam erant, nec videbantur, sicut multa habemus et in memoria, quae non semper intuemur? An fiunt illic, quae ante non fuerant, vel in aliquo spiritu sunt, quo illa erumpens et emergens ibi eas videat? Sed si jam in illa erant quasi proprie, cur eas non etiam consequenter intelligit? Aliquando enim, imo plerumque non intelligit. An sicut spiritus ejus adjutus est, ut eas in se videret, ita et mens nisi adjuvetur, ea quae habet spiritus, intelligere non potest? An forte non corporea removentur, vel quasi relaxantur impedimenta, ut suo impetu anima in ea quae videnda sunt, exseratur; sed ipsa prorsus in haec assumitur, sive tantum spiritualiter cernenda, sive etiam intellectualiter cognoscenda? An aliquando in seipsa videt ista, aliquando per alterius spiritus commixtionem? Quidquid horum est, temere affirmari non oportet. Illud tamen dubium esse non debet, corporales imagines, quae spiritu cernuntur, non semper signa esse aliarum rerum, sive in vigilantibus, sive in dormientibus, sive in aegrotantibus: mirum est autem, si aliquando ecstasis fieri potest, ut non illae corporalium rerum similitudines aliquid significent. 28. Non sane mirum est si et daemonium habentes aliquando vera dicunt, quae absunt a praesentium sensibus; quod certe nescio qua occulta mixtura ejusdem spiritus fit, ut tanquam unus sit patientis atque vexantis. Cum autem spiritus bonus in haec visa humanum spiritum assumit aut rapit, nullo modo illas imagines signa rerum aliarum esse dubitandum est, et earum quas nosse utile est: Dei enim munus est. Discretio sane difficillima est, cum spiritus malignus quasi tranquillus agit, ac sine aliqua vexatione corporis assumpto humano spiritu dicit quod potest; quando etiam vera dicit, et utilia praedicat, transfigurans se, sicut scriptum est, velut angelum lucis (II Cor. XI, 14), ad hoc ut cum illi in manifestis bonis creditum fuerit, seducat ad sua. Hunc discerni non arbitror, nisi dono illo de quo ait Apostolus, cum de diversis Dei muneribus loqueretur, Alii dijudicatio spirituum (I Cor. XII, 10).

Intellectualis visio non fallit. In aliis falli non semper est perniciosum. Non enim magnum est, tunc eum dignoscere, cum ad aliqua pervenerit vel perduxerit, quae sunt contra bonos mores vel regulam fidei: tunc enim a multis discernitur. Illo autem dono, in ipso primordio quo multis adhuc bonus apparet, continuo dijudicatur an malus sit.

29. Tamen et per corporalem visionem, et per imagines corporalium quae demonstrantur in spiritu, et boni instruunt, et mali fallunt. Intellectualis autem visio non fallitur. Aut enim non intelligit, qui aliud opinatur quam est; aut si intelligit, continuo verum est. Quid enim faciant oculi non habent, cum simile corpus viderint, quod ab alio discernere non possint: aut quid faciat animi intentio, cum in spiritu facta fuerit corporis similitudo, quam non valeat distinguere a corpore? Sed adhibetur intellectus, quaerens quid illa significent vel utile doceant; et aut inveniens ad fructum suum pervenit, aut non inveniens in disceptatione se tenet, ne aliqua perniciosa temeritate prolabatur in exitiabilem errorem. 30. Judicat autem sobrius intellectus divinitus adjutus, quae vel quanta sint, in quibus etiam aliud putare quam est, non sit animae perniciosum. Nec enim putantium periculo, et non potius exitio suo, quisque a bonis putatur bonus, etiamsi occultus sit malus, si in rebus ipsis, id est in ipso bono quo fit quisque bonus, non erretur: aut aliquid obest omnibus hominibus, quod cum dormiunt, vera corpora esse arbitrantur, quorum similitudines in somnis vident: aut aliquid obfuit Petro, quod soluto se a vinculis, seque angelo deducente, factum est repentino miraculo ut putaret se visum videre (Act. XII, 7-9): vel cum in illa ecstasi respondit, Nequaquam, Domine, quia nunquam manducavi omne commune et immundum; putans ea ipsa quae in disco demonstrabantur, tanquam vera animalia (Id. X, 11-14). Haec quando aliter inventa fuerint, quam putata sunt, cum viderentur, non nos poenitet ita nobis fuisse visa, si non arguatur vel infidelitas dura, vel opinatio vana sive sacrilega. Quapropter et cum visis corporalibus diabolus fallit, nihil obest quod Indificantur oculi, si non erratur in veritate fidei, et intelligentiae sanitate, qua docet Deus subjectos sibi. Aut si ludificet animam spirituali visione imaginibus corporum, ut putet corpus esse quod non est, non aliquid obest animae si perniciosae suasioni non consentiat.

Somnia venerea sine peccato contingere. 31. Unde aliquando fit quaestio de consensionibus somniantium, cum etiam concumbere sibi videntur, vel contra propositum suum, vel contra etiam licitos mores. Quod non contingit, nisi cum ea quae vigilantes etiam cogitamus, non cum placito consensionis, sed sicut etiam talia propter aliquid loquimur, sic admoventur in somnis, et exprimuntur, ut eis naturaliter etiam caro moveatur, et quod naturaliter colligit, per genitales vias emittat; sicut hoc ipsum dicere utique non possem, nisi etiam cogitarem. Porro imagines rerum corporalium, quas necessario cogitavi, ut hoc dicerem, si tanta expressione praesentarentur in somnis, quanta praesentantur corpora vigilantibus, fieret illud quod sine peccato fieri a vigilante non posset. Quis enim vel cum loquitur, et postulante necessitate sermonis de suo concubitu aliquid dicit, possit non cogitare quod dicit? Porro ipsa phantasia, quae fit in cogitatione sermocinantis, cum ita expressa fuerit in visione somniantis, ut inter illam et veram commixtionem corporum non discernatur, continuo movetur caro, et sequitur quod eum motum sequi solet, cum hoc tam sine peccato fiat, quam sine peccato a vigilante dicitur, quod ut diceretur, sine dubio cogitatum est. Verumtamen propter animae affectionem bonam, quae desiderio meliore mundata multas interficit cupiditates, quae ad naturalem carnis motum non pertinent; quem casti vigilantes cohibent et refrenant, dormientes autem ideo non possunt, quia non habent in potestate quae admoveatur expressio corporalis imaginis, quae discerni non possit a corpore: propter illam ergo affectionem animae bonam, etiam in somnis quaedam ejus merita clarent. Nam etiam dormiens Salomon sapientiam praeposuit omnibus rebus, eamque neglectis caeteris est precatus a Domino: et sicut Scriptura testatur, placuit hoc coram Domino, nec distulit retributionem bonam pro desiderio bono (III Reg. III, 5 15).

Corporalium similitudines a spiritu in seipso formari. 32. Quae cum ita sint, pertinet corporis sensus ad visa corporalia, qui per quinque quasi rivulos distanter valentes distribuitur: cum illud quod est subtilissimum in corpore, et ob hoc animae vicinius quam caetera, id est lux, primum per oculos sola diffunditur, emicatque in radiis oculorum ad visibilia contuenda; deinde mixtura quadam, primum cum aere puro, secundo cum aere caliginoso atque nebuloso, tertio cum corpulentiore humore, quarto cum terrena crassitudine, quinque sensus cum ipso, ubi sola excellit, oculorum sensu efficit: sicut in libro quarto, itemque in septimo disseruisse me recolo. Est autem hoc coelum oculis conspicuum, unde luminaria et sidera effulgent, excellentius utique omnibus corporeis elementis, sicut oculorum sensus excellit in corpore. Quia vero spiritus omnis omni est corpore sine dubitatione praestantior, sequitur ut non loci positione, sed naturae dignitate praestantior sit natura spiritualis isto corporeo coelo, etiam illa ubi rerum corporalium exprimuntur imagines. 33. Hic existit quiddam mirabile, ut cum prior sit corpore spiritus, et posterior corporis imago quam corpus, tamen quia illud quod tempore posterius est, fit in eo quod natura prius est, praestantior sit imago corporis in spiritu, quam ipsum corpus in substantia sua. Nec sane putandum est facere aliquid corpus in spiritu, tanquam spiritus corpori facienti, materiae vice subdatur. Omni enim modo praestantior est qui facit, ea re de qua aliquid facit; neque ullo modo spiritu praestantius est corpus; imo perspicuo modo spiritus corpore. Quamvis ergo prius videamus aliquod corpus, quod antea non videramus, atque inde incipiat imago ejus esse in spiritu nostro, quo illud cum absens fuerit recordemur: tamen eamdem ejus imaginem non corpus in spiritu, sed ipse spiritus in seipso facit celeritate mirabili, quae ineffabiliter longe est a corporis tarditate; cujus imago mox ut oculis visum fuerit, in spiritu videntis nullius puncti temporalis interpositione formatur. Itemque in auditu, nisi auribus perceptae vocis imaginem continuo spiritus in seipso formaret, ac memoria retineret, ignoraretur secunda syllaba utrum secunda esset, cum jam prima utique nulla esset, quae percussa aure transiisset: ac sic omnis locutionis usus, omnis cantandi suavitas, omnis postremo in actibus nostris corporalis motus dilapsus occideret; neque ullum progressum nancisceretur, si transactos corporis motus memoriter spiritus non teneret, quibus consequentes in agendo connecteret. Quos utique non tenet, nisi imaginaliter a se factos in se. Ipsarum etiam futurarum motionum imagines praeveniunt fines actuum nostrorum. Quid enim agimus per corpus, quod non cogitando praeoccupaverit spiritus, omniumque visibilium operum similitudines in seipso primitus viderit, et quodammodo disposuerit?

Similitudines animo expressae unde innotescant daemonibus. Visiones quaedam mirae. Phrenetici. Puer aegrotans. 34. Quae spirituales corporalium similitudines in animo nostro, quemadmodum innotescant spiritibus etiam immundis, vel quid obstaculi patiatur anima nostra ex isto terreno corpore, ut eas invicem in nostro spiritu videre nequeamus, invenire et explicare difficile est. Certissimis tamen indiciis apud nos constitit enuntiatas a daemonibus cogitationes hominum, qui tamen si virtutum internam speciem possent in hominibus cernere, non tentarent: sicut illam in Job nobilem ac mirabilem patientiam procul dubio, si posset diabolus cernere, nollet a tentato utique superari. Caeterum alicubi longe jam facta quod nuntiant, quae post aliquot dies vera esse firmentur, non est mirandum. Possunt enim hoc efficere, non solum acrimonia cernendi etiam corporalia incomparabiliter praestantiore quam nostra est, sed etiam corporum ipsorum, longe utique subtiliorum, mira velocitate. 35. Comperimus etiam in domo constitutum patientem spiritum immundum, dicere solere quando ad eum venire coepisset ex duodecim millibus presbyter, et per omnia loca itineris ubi esset, et quam propinquaret, et quando ingrederetur et fundum et domum et cubiculum, donec in conspectu ejus astaret. Quae omnia etsi non oculis patiens ille cernebat, tamen nisi aliquo modo cerneret, non tam veraciter enuntiaret. Erat autem iste febriens, et tanquam in phrenesi ista dicebat. Et forte revera phreneticus erat, sed propter ista daemonium pati putabatur. Nullum refectionis cibum accipiebat a suis, sed a solo presbytero. Resistebat etiam suis violenter quantum valebat; illo solo presbytero veniente quiescebat, illi tantum subditus erat, et subdite respondebat. Nec tamen eidem saltem presbytero illa cessit mentis alienatio sive daemonium, nisi cum sanus esset a febribus, sicut phrenetici sanari solent; nec aliquando postea tale aliquid passus est. 36. Novimus etiam sine dubitatione phreneticum futuram mortem cujusdam feminae praedixisse; non sane specie divinandi, sed tanquam factum ac praeteritum recolentem. Nam cum ejus apud eum commemoratio fieret, Mortua est, inquit, ego eam vidi efferri, hac cum ejus corpore transierunt; cum illa incolumis viveret: post paucos autem dies repente defuncta, et per eum locum elata est, qua ille praedixerat. 37. Fuit item apud nos puer, qui in exordio pubertatis dolorem acerrimum genitalium patiebatur, medicis nequaquam valentibus quid illud esset agnoscere, nisi quod nervus ipse introrsum reconditus erat, ita ut nec praeciso praeputio, quod immoderata longitudine propendebat, apparere potuerit, sed postea vix esset inventus. Humor autem viscosus et acer exsudans testes et inguina urebat. Sed acutum dolorem non continuum patiebatur, et cum patiebatur, ejulabat vehementer cum jactatione membrorum mente sanissima, sicut in cruciatibus corporalium dolorum fieri solet. Deinde inter voces suas abripiebatur ab omnibus sensibus, et jacebat patentibus oculis neminem circumstantium videns, ad nullam vellicationem se movens. Post aliquantum tanquam evigilans, nec jam dolens, quae videret indicabat. Tum interpositis paucis diebus eadem patiebatur. In omnibus sane vel pene omnibus visionibus suis, duos se dicebat videre, unum provectioris aetatis, alterum puerum, a quibus ei vel dicebantur, vel demonstrabantur, quae se audisse et vidisse narrabat. 38. Vidit quodam die chorum piorum psallentium, laetantium in luce mirabili, et impiorum in tenebris diversas et atrocissimas poenas; illis ducentibus et ostendentibus, et felicitatis aliorum, aliorumque infelicitatis meritum insinuantibus. Hoc autem vidit die dominico Paschae, cum per totam Quadragesimam nihil doluisset, cui vix intervallo tridui antea parcebatur. Viderat autem in ipso ingressu Quadragesimae illos promittentes sibi quod per quadraginta dies nullum sensurus esset dolorem; postea ipsi ei dederunt tanquam medicinale consilium, ut ei praeputii longitudo praecideretur, quo facto diu non doluit. Cum vero iterum similiter doleret, et similia videre coepisset, accepit ab eis rursus consilium, ut in mare pube tenus intraret, ac post aliquantam moram inde discederet, promittentibus sane quod jam deinceps vehementem illum dolorem non esset passurus, sed solius illius viscosi humoris molestiam: atque ita secutum est; nec unquam talem aliquam postea passus est aversionem mentis a sensibus, nec tale aliquid vidit quale antea cum in mediis doloribus et horrendis vocibus repente obmutescens abriperetur. Postea tamen medicis caetera curantibus et sanantibus, non permansit in proposito sanctitatis.

De visionum causis. 39. Istarum visionum et divinationum causas et modos vestigare si quis potest, certoque comprehendere, eum magis audire vellem, quam de me exspectari ut ipse dissererem. Quid tamen putem, ita ut nec docti me tanquam confirmantem derideant, nec indocti tanquam docentem accipiant, sed utrique disceptantem et quaerentem potius quam scientem, non occultabo. Ego visa ista omnia visis comparo somniantium. Sicut enim aliquando et haec falsa, aliquando autem vera sunt, aliquando perturbata, aliquando tranquilla; ipsa autem vera, aliquando futuris omnino similia, vel aperte dicta, aliquando obscuris significationibus et quasi figuratis locutionibus praenuntiata: sic etiam illa omnia. Sed amant homines inexperta rimari, et causas insolitorum requirere, cum quotidiana plerumque talia saepe etiam latentioris originis nosse non curent. Nam quemadmodum in vocibus, hoc est signis quibus loquendo utimur, audito verbo inusitato, quaerunt primo quid sit, hoc est quid significet; quo cognito deinde quaerunt unde ita dictum sit, cum tam multa sine cura nesciant, quae in usu sermonis habent, unde ita sint dicta: sic cum aliquid inusitatum in rebus acciderit, sive corporalibus, sive spiritualibus, causas rationemque sollicite inquirunt, et sibi reddi a doctoribus flagitant. 40. Soleo autem cum me quisque interrogat, verbi gratia, quid sit catus, et respondeo, Prudens vel acutus, nec ei sufficit, sed pergit quaerere unde dictus sit catus, vicissim referre et quaerere unde dictus sit acutus, quod nihilominus utique ignorabat, sed quia usitatum nomen erat, patienter ejus originem nesciebat: quod autem novum insonuit auribus, parum putat nosse quid significando valeat, nisi etiam unde dicatur exquirat. Quisquis ergo ex me quaerit unde visa corporalibus similia in ecstasi appareant, quae raro accidit animae, vicissim quaero, unde appareant dormientibus, quae quotidie sentit anima, et nemo istud aut non multum curat inquirere. Quasi vero ideo minus mira sit talium natura visorum, quia quotidiana est; aut ideo minus curanda, quia omnium est; aut si recte faciunt qui ista non quaerunt, non rectius fecerint si nec in illa curiosi sint. Ego vero multo amplius admiror, multoque maxime stupeo quanta celeritate ac facilitate in se anima fabricetur imagines corporum, quae per corporis oculos viderit, quam somniantium vel etiam in ecstasi visiones. Quaecumque tamen illa natura visorum est, procul dubio corpus non est. Hoc nosse cui non sufficit, unde etiam existant, inquirat ab aliis; me ignorare confiteor.

Unde nascantur visiones. 41. Illud plane exemplorum experimentis colligi datur, sicut corporum pallor, rubor, tremor, vel etiam morbus aliquando a corpore habet causas, aliquando ab anima; et a corpore quidem, cum vel humor suffunditur, vel cibus vel aliquid aliud corpori injectum extrinsecus; ab anima vero, cum vel timore turbatur, vel pudore confunditur, vel irascitur, vel amat, vel si quid ejusmodi; nec immerito, si id quod animat et regit, etiam cum vehementius movetur, vehementius exagitat: ita et ipsi animae ut in ea visa pergat, quae non ei per sensus corporis nuntiantur, sed per incorporalem substantiam, et ita pergat ut non discernat utrum corpora sint an similitudines corporum, aliquando a corpore accidit, aliquando a spiritu: et a corpore quidem, sive naturali vicissitudine, ut sunt visa somniantium, dormire quippe a corpore est homini; sive aliqua mala valetudine sensibus perturbatis, ut cum a phreneticis simul et corpora videntur, et visa similia corporibus tanquam et ipsa prae oculis adsint: aut penitus interclusis, sicut saepe male affecti morbo aliquo ingravescente, praesente corpore diu absentes, deinde hominibus redditi, multa se vidisse dixerunt: a spiritu vero, cum omnino sano atque integro corpore in alienationem rapiuntur, sive ita ut et per sensus corporis corpora videant, et in spiritu quaedam similia quae a corporibus non discernant; sive penitus avertantur a sensibus carnis, et nihil per eos omnino sentientes, illa spirituali visione habitent in similitudinibus corporum. Sed cum malus in haec arripit spiritus, aut daemoniacos facit, aut arreptitios, aut falsos prophetas: cum autem bonus, fideles mysteria loquentes, aut accedente etiam intelligentia veros prophetas, aut ad tempus quod per eos oportet ostendi, videntes atque narrantes.

Visa quae a corpore occasionem habent, non tamen exhiberi a corpore. 42. Sed cum a corpore causa est ut talia visa cernantur, non ea corpus exhibet; neque enim habet eam vim, ut formet aliquid spirituale: sed sopito, aut perturbato, aut etiam intercluso itinere intentionis a cerebro, qua dirigitur sentiendi motus, anima ipsa quae motu proprio cessare ab hoc opere non potest, quia per corpus non sinitur, vel non plene sinitur corporalia sentire, vel ad corporalia vim suae intentionis dirigere, spiritu corporalium similitudines agit, aut intuetur objectas. Et si quidem eas ipsa agit, phantasiae tantum sunt; si autem objectas intuetur, ostensiones sunt. Denique cum oculi dolent vel exstincti sunt, quia non est causa in sede cerebri, unde ipsa dirigitur intentio sentiendi, non fiunt hujusmodi visiones, quamvis cernendis corporalibus obstaculum existat a corpore. Magis enim caeci aliquid dormientes quam vigilantes vident. Dormientibus quippe in cerebro consopitur via sentiendi, quae intentionem ad oculos ducit, ideoque ipsa intentio in aliud aversa, cernit visa somniorum tanquam species corporales adsint, ut sibi dormiens vigilare videatur, et non similia corporibus, sed ipsa corpora intueri se putet: cum autem vigilant caeci, ducitur per illa itinera intentio cernendi, quae cum ad loca venerit oculorum, non exseritur foras, sed ibi remanet, ut vigilare se sentiant, potiusque esse in tenebris vigilando etiam per diem, quam dormiendo, sive per diem sive per noctem. Nam et qui caeci non sunt, plerique patentibus oculis dormiunt nihil per eos videntes, sed non ideo nihil videntes, cum spiritu cernant visa somniorum: si autem clausis oculis vigilent, neque dormientium praesto sunt visionibus neque vigilantium. Tantum tamen valet, quod usque ad oculos eorum nec sopita nec perturbata nec interclusa pervenit a cerebro via sentiendi, et animae intentionem usque ad ipsas quamvis clausas fores corporis ducit, ut cogitentur quidem imagines corporum, sed nullo modo pro eis habeantur corporibus quae per oculos sentiuntur. 43. Tantum interest, ubi fiat impedimentum sentiendi corporalia, cum fit in corpore. Si enim non fit nisi in ipsis aditibus, et quasi januis sensuum, velut in oculis, in auribus, caeterisque sensibus corporalibus, sola impeditur perceptio corporalium; non autem animae intentio in aliud sic avertitur, ut pro corporibus habeat imagines corporum: si autem causa est intus in cerebro, unde diriguntur viae ad ea quae foris sunt, sentienda; ipsius intentionis vasa sopiuntur, vel turbantur, vel intercluduntur, quibus nititur anima in ea quae foris sunt, intuenda vel sentienda. Quem nisum quoniam non amittit, tanta expressione format similia, ut imagines corporalium a corporibus discernere non valens, utrum in illis an in istis sit nesciat; et cum scit, longe alio modo sciat, quam dum in cogitando versantur sive occurrunt similitudines corporum. Qui modus nisi ab expertis capi utcumque non potest. Hinc enim erat, quod me dormiens in somnis videre sciebam, nec tamen illas corporalium rerum similitudines quas videbam, sic ab ipsis corporalibus discernebam, quemadmodum eas cogitantes etiam clausis oculis vel in tenebris constituti discernere solemus. Tantum valet ipsa animi intentio utrum perducatur usque ad sensus licet clausos, an in ipso cerebro, unde in haec nititur, aliqua causa existente in aliud avertatur, ut quamvis aliquando se noverit non corpora, sed corporum similitudines cernere, vel minus erudita etiam ipsa esse corpora existimans, sentiat se non ea corpore, sed spiritu videre, longe sit tamen ab affectione qua suo corpori praesentatur: unde se norunt et caeci vigilare, cum similitudines corporum cogitatas a corporibus, quae videre non possunt, certa notione discernunt.

Visa corporalibus similia in quae anima rapitur, non ideo esse naturae diversae. 44. Cum autem sano corpore, nec somno sensibus consopitis, aliquo occulto opere spirituali in ea visa quae similia sunt corporalibus anima rapitur, non quia modus diversus est, ideo est etiam diversa natura visorum; cum et in illis causis quae de corpore existunt, sit utique differentia, et aliquando a contrario. Nam phrenetici non dormiendo potius perturbatas habent sentiendi vias in capite, ut talia videant, qualia somniantes vident, quorum dormiendo avertitur intentio a sensu vigilandi, et in ea videnda convertitur. Cum ergo illud fiat non dormiendo, hoc autem dormiendo, non tamen ea quae videntur ex alio genere sunt, quam ex natura spiritus, de quo vel in quo fiunt similitudines corporum. Ita quamvis diversa sit causa intentionis alienatae, quando sano corpore vigilantis occulta quadam vi spirituali anima rapitur, ut vice corporum expressas corporalium rerum similitudines in spiritu videat, eadem tamen est natura visorum. Neque enim dici potest, cum causa in corpore est, tunc animam sine ulla praesensione futurorum ex seipsa versare imagines corporum, sicut etiam cogitando eas solet; cum vero in ea videnda spiritu assumitur, divinitus haec demonstrari: quandoquidem aperte Scriptura dicit, Effundam de spiritu meo super omnem carnem, et juvenes visa videbunt, et senes somnia somniabunt (Joel. II, 28), divinae operationi utrumque tribuens; et, Angelus Domini apparuit Joseph in somnis dicens, Noli timere accipere Mariam conjugem tuam; et iterum, Tolle puerum, et vade in Aegyptum (Matth. I, 20; et II, 13).

Quomodo contingant visa illa, ex quibus divinationes occulto instinctu seu casu factae. 45. Itaque bono quidem spiritu assumi spiritum hominis ad has videndas imagines, nisi aliquid significent, non puto: cum vero in corpore causa est, ut in eas expressius intuendas humanus intendatur spiritus, non semper aliquid significare credendum est; sed tunc significant, cum inspirantur a demonstrante spiritu, sive dormienti, sive aliquid aliud ex corpore, ut a carnis sensibus alienaretur, patienti. Vigilantibus etiam neque ullo morbo afflictis nec furore exagitatis, occulto quodam instinctu ingestas esse cogitationes quas promendo divinarent, non solum aliud agentes, sicut Caiphas pontifex prophetavit (Joan. XI, 51), cum ejus intentio non haberet voluntatem prophetandi, verum etiam id suscipientes, ut divinandi modo aliquid dicerent, novimus. 46. Nam quidam juvenes jocando ut fallerent, ubi peregrini iter agebant, mathematicos se esse finxerunt, ignorantes omnino utrum duodecim signa dicerentur. Qui cum hospitem suum mirari cernerent quae dicebant, et attestari esse verissima, audacius in plura progressi sunt. At ille attestans ad omnia mirabatur. Postremo ab eis de filii salute quaesivit, quem diu absentem desiderabat, et quod inopinate tardaret, ne quid ei accidisset sollicitus erat. At illi non curantes quid post eorum abscessum veri cognosceretur, dum tamen in praesentia laetum hominem redderent, mox profecturi responderunt salvum ac propinquantem, et eo ipso die quo haec loquebantur, esse venturum: neque enim metuebant, ne cum totus dies peractus esset, eos ille redarguendos postridie sequeretur. Quid multa? dum jam abire disponerent, ecce subito adhuc eis illic positis venit. 47. Item alius ante symphoniacum saltabat, ubi erant multa idola per quamdam Paganorum solemnitatem, non aliquo spiritu arreptus, sed imitatione ludicra arreptitios aemulatus, scientibus circumstantibus et spectantibus. Moris enim erat ut ante prandium peractis sacrificiis agitatisque fanaticis, si qui adolescentes post prandium vellent eo more ludere, nullus prohiberetur. Ille ergo inter saltandum, facto sibi silentio, jocabundus, et ridente multitudine circumseptus, ea nocte quae impendebat, in ea silva quae juxta erat, hominem a leone interemptum iri, ad cujus cadaver spectandum illucescente die confluxuram turbam, et illius solemnitatis locum deserturam, praedixit. Et factum est; cum satis cunctis qui aderant in omnibus ejus motibus claruisset, hoc eum ludendo et jocando nusquam perturbata vel alienata mente dixisse; ipso etiam tanto amplius mirante quod accidit, quanto magis nosset quo id animo atque ore protulerit. 48. Quonam modo haec visa in spiritum hominis veniant, utrum ibi primitus formentur, an formata ingerantur, et quadam conjunctione cernantur, ut sic hominibus angeli ostendant cogitationes suas, et corporalium rerum similitudines, quas in suo spiritu futurorum cognitione praeformant, quemadmodum et ipsi nostras cogitationes, non utique oculis, quia non corpore, sed spiritu vident; verum hoc intersit, quod illi nostras, etiam si nolimus, noverunt, nos autem ipsorum, nisi ostendantur, nosse non possumus; quia sic eas, ut opinor, habent in potestate occultare spiritualibus modis, quemadmodum nos quibusdam interjectis obstaculis, nostra corpora ne aliorum oculis videantur, abscondimus: et quid fiat in spiritu nostro, ut aliquando cernantur tantummodo significantes imagines, et utrum aliquid significent ignoretur; aliquando autem aliquid significare sentiantur, sed quid significent nesciatur; aliquando vero tanquam pleniore demonstratione anima humana et spiritu ipsas et mente quid significent videat; et scire difficillimum est, et si jam sciamus, disserere atque explicare operosissimum.

Spiritualem naturam, ubi tam multis causis similitudines corporalium formentur, in nobis existere. 49. Quod autem nunc insinuare satis arbitror, certum est esse spiritualem quamdam naturam in nobis, ubi corporalium rerum formantur similitudines; sive cum aliquod corpus sensu corporis tangimus, et continuo formatur ejus similitudo in spiritu, memoriaque reconditur; sive cum absentia corpora jam nota cogitamus, ut ex eis formetur quidam spiritualis aspectus, quae jam erant in spiritu et antequam ea cogitaremus; sive cum eorum corporum quae non novimus, sed tamen esse non dubitamus, similitudines, non ita ut sunt illa, sed ut occurrit, intuemur; sive cum alia, quae vel non sunt, vel esse nesciuntur, pro arbitrio vel opinatione cogitamus; sive unde unde, neque id agentibus, neque volentibus nobis variae formae corporalium similitudinum versantur in animo; sive cum aliquid corporaliter acturi, ea ipsa disponimus quae in illa actione futura sunt, et omnia cogitatione antecedimus; sive jam in ipso actu, vel cum loquimur, vel cum facimus, omnes corporales motus, ut exseri possint, praeveniuntur similitudinibus suis intus in spiritu; neque enim ulla vel brevissima syllaba in ordine suo nisi prospecta sonuisset: sive cum a dormientibus somnia videntur, vel nihil vel aliquid significantia; sive cum valetudine corporali turbatis intrinsecus itineribus sentiendi, imagines corporum spiritus veris corporibus ita miscet, ut internosci vel vix possint, vel omnino non possint; et aut significent aliquid, aut sine ulla significatione oboriantur; sive prorsus ingravescente aliquo morbo vel dolore corporis, et intercludente intus vias quibus animae, ut per carnem sentiret, exserebatur ac nitebatur intentio, altius quam somno absentato spiritu, corporalium rerum existunt aut monstrantur imagines, vel significantes aliquid vel sine ulla significatione apparentes; sive nulla ex corpore causa existente, sed assumente atque rapiente aliquo spiritu tollitur anima in hujusmodi videndas similitudines corporum, miscens eis visa corporalia, cum simul etiam corporis sensibus utitur; sive ita spiritu assumente alienatur ab omni corporis sensu, et avertitur, ut solis similitudinibus corporum spirituali visione teneatur, ubi nescio utrum possint aliqua nihil significantia videri. CAPUT XXIV.-- Visionem intellectualem spirituali, spiritualem corporali praestare. 50. Haec igitur natura spiritualis, in qua non corpora, sed corporum similitudines exprimuntur, inferioris generis visiones habet, quam illud mentis atque intelligentiae lumen, quo et ista inferiora dijudicantur, et ea cernuntur quae neque sunt corpora, neque ullas gerunt formas similes corporum; velut ipsa mens et omnis animae affectio bona, cui contraria sunt ejus vitia, quae recte culpantur atque damnantur in hominibus. Quo enim alio modo ipse intellectus nisi intelligendo conspicitur? Ita et charitas, gaudium, pax, longanimitas, benignitas, bonitas, fides, mansuetudo, continentia, et caetera hujusmodi, quibus propinquatur Deo (Galat. V, 22, 23): et ipse Deus, ex quo omnia, per quem omnia, in quo omnia (Rom. XI, 36). 51. Quanquam itaque in eadem anima fiant visiones, sive quae sentiuntur per corpus, sicut hoc corporeum coelum, terra, et quaecumque in eis nota esse possunt, quemadmodum possunt; sive quae spiritu videntur similia corporum, de quibus multa jam diximus; sive cum mente intelliguntur, quae nec corpora sunt, nec similitudines corporum; habent utique ordinem suum, et est aliud alio praecellentius. Praestantior est enim visio spiritualis quam corporalis, et rursus praestantior intellectualis quam spiritualis. Corporalis enim sine spirituali esse non potest; quandoquidem momento eodem quo corpus sensu corporis tangitur, fit etiam in animo tale aliquid, non quod hoc sit, sed quod simile sit; quod si non fieret, nec sensus ille esset, quo ea quae extrinsecus adjacent, sentiuntur. Neque enim corpus sentit, sed anima per corpus, quo velut nuntio utitur ad formandum in seipsa quod extrinsecus nuntiatur. Non potest itaque fieri visio corporalis, nisi etiam spiritualis simul fiat: sed non discernitur, nisi cum fuerit sensus ablatus a corpore, ut id quod per corpus videbatur, inveniatur in spiritu. At vero spiritualis visio etiam sine corporali fieri potest, cum absentium corporum similitudines in spiritu apparent, et finguntur multae pro arbitrio, vel praeter arbitrium demonstrantur. Item spiritualis visio indiget intellectuali ut dijudicetur, intellectualis autem ista spirituali inferiore non indiget; ac per hoc spirituali corporalis, intellectuali autem utraque subjecta est. Cum ergo legimus, Spiritualis omnia judicat, ipse autem a nemine dijudicatur (I Cor. II, 15); non secundum spiritum, a quo mens discernitur, sicut illud quod dictum est, Orabo spiritu, orabo et mente (Id. XIV, 15), sed ex illa notione debemus accipere qua dictum est, Renovamini autem spiritu mentis vestrae (Eph. IV, 23). Jam enim supra docuimus alio modo et ipsam mentem spiritum dici, secundum quam spiritualis omnia dijudicat. Quapropter non absurde neque inconvenienter arbitror spiritualem visionem inter intellectualem et corporalem tanquam medietatem quamdam obtinere. Puto enim non incongruenter medium dici, quod corpus quidem non est, sed simile est corporis, inter illud quod vere corpus est, et illud quod nec corpus est, nec simile corporis.

Solam intellectualem visionem non fallere. 52. Illuditur autem anima similitudinibus rerum, non earum vitio, sed opinionis suae, cum approbat quae similia sunt pro iis quibus similia sunt, ab intelligentia deficiens. Fallitur ergo in visione corporali, cum in ipsis corporibus fieri putat quod fit in corporis sensibus; sicut navigantibus videntur in terra moveri quae stant, et intuentibus coelum stare sidera quae moventur, et divaricatis radiis oculorum duas lucernae species apparere, et in aqua remus infractus, et multa hujusmodi: aut cum putat aliquid hoc esse, quod similiter coloratum est, vel similiter sonat, vel olet, vel sapit, vel tangitur; hinc enim et medicamentum aliquod ceratum coctum in cacabo putatur legumen, et sonitus transeuntis vehiculi putatur ex tonitruo, et si nullis aliis sensibus exploretur, sed soli adjaceat olfactui, citrium putatur herba quae vocatur apiaria, et cibus aliquo dulciculo succo affectus putatur melle conditus; et ignotus annulus contrectatus in tenebris, putatur aureus, cum sit aereus aut argenteus. aut cum repentinis inopinatisque corporalibus visis anima turbata vel in somnis videre se putat, vel aliquo hujusmodi spirituali viso affici: unde in omnibus corporalibus visis, et aliorum sensuum contestatio, et maxime ipsius mentis atque rationis adhibetur, ut quod in hoc rerum genere verum est, inveniatur quantum inveniri potest. In visione autem spirituali, id est in corporum similitudinibus, quae spiritu videntur, fallitur anima, cum ea quae sic videt, ipsa corpora esse arbitratur; vel quod sibi suspicione falsaque conjectura finxerit, hoc etiam in corporibus putat, quae non visa conjectat. At vero in illis intellectualibus visis non fallitur: aut enim intelligit, et verum est; aut si verum non est, non intelligit: unde aliud est in his errare quae videt, aliud ideo errare quia non videt.

Raptus animae duplex, spirituali visione et intellectuali. 53. Quapropter cum rapitur anima in ea visa quae spiritu cernuntur similia corporalibus, ita ut omnino a sensibus corporis avertatur amplius quam in somno solet, sed minus quam in morte; jam divinae admonitionis est et adjutorii, ut se non corpora, sed visa corporum similia spiritualiter noverit cernere, sicuti quae se in somnis videre, etiam antequam evigilent, sciunt. Ibi si etiam videntur futura, ita ut omnino futura noscantur, quorum imagines praesentes videntur, sive ipsa hominis mente divinitus adjuta, sive aliquo inter ipsa visa quid significent exponente, sicut in Apocalypsi Joanni exponebatur (Apoc. I, 10 sqq.), magna revelatio est: etiamsi forte ignoret ille cui haec demonstrantur, utrum e corpore exierit, an adhuc sit in corpore, sed spiritu a sensibus corporis alienato ista videat; potest enim sic raptus id ignorare, si ei et hoc non ostendatur. 54. Porro autem, si quemadmodum raptus est a sensibus corporis, ut esset in istis similitudinibus corporum, quae spiritu videntur, ita et ab ipsis rapiatur, ut in illam quasi regionem intellectualium vel intelligibilium subvehatur, ubi sine ulla corporis similitudine perspicua veritas cernitur; nullis opinionum falsarum nebulis offuscatur: ibi virtutes animae non sunt operosae ac laboriosae. Neque enim opere temperantiae libido frenatur, aut opere fortitudinis tolerantur adversa, aut opere justitiae iniqua puniuntur, aut opere prudentiae mala devitantur. Una ibi et tota virtus est amare quod videas, et summa felicitas habere quod amas. Ibi enim beata vita in fonte suo bibitur, inde aspergitur aliquid huic humanae vitae, ut in tentationibus hujus saeculi, temperanter, fortiter, juste, prudenterque vivatur. Propter illud quippe adipiscendum, ubi secura quies erit et ineffabilis visio veritatis, labor suscipitur, et continendi a voluptate, et sustinendi adversitates, et subveniendi indigentibus, et resistendi decipientibus. Ibi videtur claritas Domini, non per visionem significantem, sive corporalem, sicut visa est in monte Sina (Exod. XIX, 18), sive spiritualem, sicut vidit Isaias (Isai. VI, 1), vel Joannes in Apocalypsi: sed per speciem, non per aenigmata, quantum eam capere mens humana potest, secundum assumentis Dei gratiam, ut os ad os loquatur ei quem dignum tali Deus colloquio fecerit; non os corporis, sed mentis,

Quo genere visionis Deus a Moyse visus. Sicut intelligendum arbitror quod de Moyses scriptum est (Num. XII, 8).

55. Concupiverat enim, sicut in Exodo legimus, videre Deum; non utique sicut viderat in monte, nec sicut videbat in tabernaculo (Exod. XIX, 18, et XXXIII, 9), sed in ea substantia qua Deus est, nulla assumpta corporali creatura, quae mortalis carnis sensibus praesentetur: neque in spiritu figuratis similitudinibus corporum; sed per speciem suam, quantum eam capere creatura rationalis et intellectualis potest, sevocata ab omni corporis sensu, et ab omni significativo aenigmate spiritus. Sic enim scriptum est, Si ergo inveni gratiam in conspectu tuo, ostende mihi temetipsum manifeste, ut videam te; cum paulo superius legatur locutus Dominus ad Moysen facie ad faciem, sicut quis loquitur ad amicum suum. Sentiebat ergo quid videbat, et quod non videbat desiderabat. Nam et paulo post, cum dixisset ei Deus, Invenisti enim gratiam in conspectu meo, et scio te prae omnibus; respondit ei, Ostende mihi claritatem tuam. Et tunc quidem responsum accepit a Domino figuratum, de quo nunc longum est disputare, quando ei dixit: Non poteris videre faciem meam, et vivere. Non enim videbit homo faciem meam, et vivet. Deinde subjecit et ait illi: Ecce locus penes me, et stabis super petram, statim ut transiet mea majestas, et ponam te in spelunca petrae, et tegam manu mea super te donec transeam; et auferam manum, et tunc videbis posteriora mea: nam facies mea non apparebit tibi (Id. XXXIII, 11-23). Nec tamen secuta Scriptura hoc etiam corporaliter factum esse narravit, satisque per hoc demonstratum est figurate dictum esse in Ecclesiae significatione. Ipse est enim locus penes Dominum, quia Ecclesia est templum ejus et ipsa aedificata est super petram, et caetera quae ibi dicta sunt, eidem intelligentiae congruunt. Nisi tamen concupitam et desideratam Dei claritatem Moyses videre meruisset, non in libro Numerorum diceret Deus ad Aaron et Mariam fratres ejus: Audite verba mea, Si fuerit propheta inter vos Domino, in visione illi cognoscar, et in somno loquar illi; non ita quomodo famulus meus Moyses in tota domo mea fidelis est. Os ad os loquar ad illum in specie, et non per aenigmata, et claritatem Domini vidit (Num. XII, 6-8). Neque enim hoc secundum substantiam corporis, quae carnis sensibus praesentatur, intelligendum est; nam utique sic loquebatur ad Moysen facie ad faciem, contra in contra, quando tamen dixit ei, Ostende mihi temetipsum; et nunc etiam ad ipsos quos objurgabat, et quibus Moysi meritum ita praeferebat, sic loquebatur per creaturam corporalem praesentatam sensibus carnis. Illo ergo modo, in illa specie qua Deus est, longe ineffabiliter secretius et praesentius loquitur locutione ineffabili, ubi eum nemo videns vivet vita ista, qua mortaliter vivitur in istis sensibus corporis: sed nisi ab hac vita quisque quodammodo moriatur, sive omnino exiens de corpore, sive ita aversus et alienatus a carnalibus sensibus, ut merito nesciat, sicut Apostolus ait, utrum in corpore an extra corpus sit (II Cor. XII, 3), cum in illam rapitur et subvehitur visionem.

Tertium coelum et paradisum de quo Apostolus, posse intelligi tertium genus visionis. 56. Quapropter si hoc tertium visionis genus, quod superius est, non solum omni corporali, quo per corporis sensus corpora sentiuntur, verum etiam omni illo spirituali, quo similitudines corporum spiritu et non mente cernuntur, tertium coelum appellavit Apostolus; in hoc videtur claritas Dei, cui videndae corda mundantur, unde dictum est, Beati mundo corde, quia ipsi Deum videbunt (Matth. V, 8): non per aliquam corporaliter vel spiritualiter figuratam significationem tanquam per speculum in aenigmate, sed facie ad faciem (I Cor. XIII, 12), quod de Moyse dictum est, os ad os; per speciem scilicet qua est Deus quidquid est, quantulumcumque eum mens, quae non est quod ipse, etiam ab omni terrena labe mundata, et ab omni corpore et similitudine corporis alienata et abrepta capere potest: a quo peregrinamur mortali et corruptibili onere gravati, quamdiu per fidem ambulamus, non per speciem (II Cor. V, 6, 7), et cum hic juste vivimus. Cur autem non credamus, quod tanto Apostolo doctori Gentium, rapto usque ad istam excellentissimam visionem, voluerit Deus demonstrare vitam, in qua post hanc vitam vivendum est in aeternum? Et cur non dicatur iste paradisus, excepto illo in quo corporaliter vixit Adam inter ligna nemorosa atque fructuosa? Quandoquidem et Ecclesia, quae nos congregat in charitatis sinum, paradisus dicta est cum fructu pomorum (Cant. IV, 13). Sed hoc figurate dictum est, tanquam illo paradiso, ubi proprie fuit Adam, Ecclesia significata sit per formam futuri. Quanquam diligentius considerantibus fortassis occurrat illo paradiso corporali, in quo Adam corporaliter fuit, et istam vitam sanctorum significatam, quae nunc agitur in Ecclesia, et illam quae post hanc erit in aeternum: sicut Jerusalem, quae interpretatur Visio pacis, et tamen quaedam terrena civitas demonstratur, significat Jerusalem matrem nostram aeternam in coelis, sive in iis qui spe salvi facti sunt, et quod non vident sperantes per patientiam exspectant (Rom. VIII, 24, 25), secundum quos multi filii desertae, magis quam ejus quae habet virum (Galat. IV, 26, 27); sive in ipsis Angelis sanctis per Ecclesiam multiformis sapientiae Dei (Ephes. III, 10), cum quibus post hanc peregrinationem sine labore et sine fine vivendum est.

An ut plures coeli, ita in spirituali et intellectuali visione plures gradus. 57. Si autem sic accipimus tertium coelum quo Apostolus raptus est, ut quartum etiam, et aliquot ultra superius coelos esse credamus, infra quos est hoc tertium coelum, sicut eos alii septem, alii octo, alii novem vel etiam decem perhibent, et in ipso uno quod dicitur firmamentum, multos gradatim esse confirmant; ac per hoc corporeos esse vel ratiocinantur vel opinantur, de quorum ratione sive opinione nunc disserere longum est: potest etiam fieri, ut etiam in spiritualibus vel intellectualibus multos quosdam gradus quisquam esse contendat, aut si possit ostendat, eosque distinctos juxta aliquem provectum magis minusve illustrium revelationum. Sed utcumque se ista habeant, et accipiantur ut libet, ab alio sic, ab alio autem sic; ego visorum vel visionum praeter ista tria genera, aut corpore, aut spiritu, aut mente, usque adhuc vel nosse vel docere non possum. Sed quot et quantae singulorum generum sint differentiae, ut in unoquoque aliud alio gradatim superferatur, ignorare me fateor.

In spirituali genere visionis alia visa quasi divina, alia humana. 58. Sicut autem in ista luce corporea est coelum, quod super terras suspicimus, unde luminaria clarent et sidera, quae corpora longe sunt meliora terrestribus: sic in illo genere spirituali, in quo videntur corporum similitudines luce quadam incorporali ac sua, sunt quaedam excellentia et merito divina, quae demonstrant Angeli miris modis; utrum visa sua facili quadam et praepotenti junctione vel commixtione etiam nostra esse facientes, an scientes nescio quomodo nostram in spiritu nostro informare visionem, difficilis perceptu, et difficilior dictu res est. Sunt autem alia visa usitata et humana, quae sive ex ipso spiritu nostro multipliciter existunt, sive ex corpore spiritui quodammodo suggeruntur, sicut fuerimus affecti vel carne vel animo. Non solum enim vigilantes homines curas suas cogitando versant in similitudinibus corporum, verum etiam dormientes hoc saepe somniant, quo indigent: nam et negotia sua gerunt ex animi cupiditate, et epulis poculisque inhiantes insistunt, si forte esurientes sitientesque dormierunt. Quae omnia puto comparata illis angelicis demonstrationibus sic habenda, ac si in ista natura corporum terrena coelestibus comparentur.

In intellectuali visione alia sunt quae in anima videntur, aliud lumen quo ipsa illustratur. Lumen animae Deus. 59. Sic etiam in illo genere intellectualium visorum alia sunt, quae in ipsa anima videntur, velut virtutes quibus vitia sunt contraria; sive permansurae, ut pietas; sive utiles huic vitae, et postea non futurae, sicut fides qua credimus ea quae nondum videmus, et spes qua futura cum patientia exspectamus, et ipsa patientia qua omnia toleramus adversa, donec quo volumus veniamus. Istae quippe et hujusmodi virtutes, quae nunc propter transigendam istam peregrinationem valde necessariae sunt; non erunt in illa vita, propter quam adipiscendam sunt necessariae: et tamen etiam ipsae intellectualiter videntur; neque enim aut corpora sunt, aut species habent similes corporum. Aliud autem est ipsum lumen, quo illustratur anima, ut omnia vel in se vel in illo veraciter intellecta conspiciat: nam illud jam ipse Deus est, haec autem creatura, quamvis rationalis et intellectualis ad ejus imaginem facta, quae cum conatur lumen illud intueri, palpitat infirmitate, et minus valet. Inde est tamen quidquid intelligit sicut valet. Cum ergo illuc rapitur, et a carnalibus subtracta sensibus, illi visioni expressius praesentatur non spatiis localibus, sed modo quodam suo, etiam supra se videt illud, quo adjuta videt quidquid etiam in se intelligendo videt.

Anima corpore exuta quo feratur. 60. Si autem quaeritur, cum anima de corpore exierit, utrum ad aliqua loca corporalia feratur, an ad incorporalia corporalibus similia, an vero nec ad ipsa, sed ad illud quod et corporibus et similitudinibus corporum est excellentius; cito quidem responderim, ad corporalia loca eam vel non ferri nisi cum aliquo corpore, vel non localiter ferri. Jam utrum habeat aliquod corpus, cum de hoc corpore exierit, ostendat qui potest; ego autem non puto: spiritualem enim arbitror esse, non corporalem. Ad spiritualia vero pro meritis fertur, aut ad loca poenalia similia corporibus: qualia saepe demonstrata sunt iis qui rapti sunt a corporis sensibus, et mortuis similes jacuerunt, et infernales poenas viderunt, cum et ipsi in seipsis gererent quamdam similitudinem corporis sui, per quam possent ad illa ferri, et talia similitudinibus sensuum experiri. Neque enim video cur habeat anima similitudinem corporis sui, cum, jacente sine sensu ipso corpore, nondum tamen penitus mortuo, videt talia, qualia multi ex illa subductione vivis redditi narraverunt; et non habeat, cum perfecta morte penitus de corpore exierit. Aut ergo ad illa fertur poenalia, aut ad illa itidem similia corporalibus, nec tamen poenarum, sed quietis atque gaudiorum. 61. Neque enim recte dici potest, vel illas falsas esse poenas, vel illam falsam requiem atque laetitiam: tunc enim haec falsa sunt, quando per opinationis errorem alia pro aliis putantur. Nam Petrus non solum cum discum illum videbat, et in eo non similitudines corporum, sed corpora putabat (Act. X, 11, 12), in hoc utique fallebatur; verum etiam cum alio tempore ab angelo solutus e vinculis ibat in corpore ambulans, et praesentatus corporalibus formis, et putabat se visum videre (Id. XII, 7-9), nihilominus fallebatur. Nam et illae in disco erant spirituales formae corporalibus similes; et ista corporalis expressio soluti de vinculis, propter miraculum spirituali similis erat. Fallebatur autem anima in utrisque, nonnisi cum alia pro aliis approbaret. Quamvis ergo non sint corporalia, sed similia corporalibus, quibus animae corporibus exutae afficiuntur, seu bene seu male, cum et ipsae corporibus suis similes sibimet appareant; sunt tamen et vera laetitia et vera molestia facta de substantia spirituali. Nam et in somnis magni interest utrum in laetis an in tristibus simus. Unde quidam in rebus quas concupiverant constituti, se evigilasse doluerunt; et rursus gravibus terroribus atque cruciatibus exagitati atque vexati, cum expergefacti essent, dormire timuerunt, ne in eadem mala revocarentur. Et utique dubitandum non est quod expressiora sint illa quae inferna dicuntur, atque ob hoc vehementius sentiantur. Nam et qui subtracti sunt sensibus corporis, minus quidem quam si omni modo morerentur, sed tamen amplius quam si dormirent, expressiora se vidisse narraverunt, quam si somnia narravissent. Est ergo prorsus inferorum substantia, sed eam spiritualem arbitror esse, non corporalem.

De inferis quaestio. Animam esse incorpoream. Sinus Abrahae. 62. Nec audiendi sunt, qui affirmant inferos in hac vita explicari, nec esse post mortem. Viderint enim quemadmodum poetica figmenta interpretentur; nos ab auctoritate divinarum Scripturarum, quibus solis de hac re fides habenda est, recedere non debemus. Quanquam possimus ostendere, illorum quoque sapientes de inferorum substantia minime dubitasse, quae post hanc vitam excipit animas mortuorum. Unde autem sub terris esse dicantur inferi, si corporalia loca non sunt, aut unde inferi appellentur, si sub terris non sunt, merito quaeritur. Animam vero non esse corpoream non me putare, sed plane scire, audeo profiteri: tamen habere posse similitudinem corporis et corporalium omnino membrorum quisquis negat, potest negare animam esse, quae in somnis videt vel se ambulare, vel sedere, vel hac atque illac gressu aut etiam volatu ferri ac referri, quod sine quadam similitudine corporis non fit. Proinde si hanc similitudinem etiam apud inferos gerit, non corporalem, sed corpori similem; ita etiam in locis videtur esse non corporalibus, sed corporalium similibus, sive in requie, sive in doloribus. 63. Quanquam et illud me nondum invenisse confiteor, inferos appellatos, ubi justorum animae requiescunt. Et Christi quidem animam venisse usque ad ea loca in quibus peccatores cruciantur, ut eos solveret a tormentis quos esse solvendos occulta nobis sua justitia judicabat, non immerito creditur. Quomodo enim aliter accipiendum sit quod dictum est, Quem Deus suscitavit ex mortuis, solutis doloribus inferorum, quia non poterat teneri ab eis (Act. II, 24), non video nisi ut quorumdam dolores apud inferos eum solvisse accipiamus, ea potestate qua Dominus est, cui omne genu flectitur, coelestium, terrestrium, et infernorum (Philipp. II, 10), per quam potestatem etiam illis doloribus, quos solvit, non potuit attineri. Neque enim Abraham, vel ille pauper in sinu ejus, hoc est in secreto quietis ejus, in doloribus erat, inter quorum requiem et illa inferni tormenta legimus magnum chaos firmatum: sed nec apud inferos esse dicti sunt. Contigit enim, inquit, mori inopem illum, et auferri ab Angelis in sinum Abrahae: mortuus est autem et dives, et sepultus est; et cum apud inferos in tormentis esset (Luc. XVI, 22-26), et caetera. Videmus itaque inferorum mentionem non esse factam in requie pauperis, sed in supplicio divitis. 64. Illud etiam quod Jacob dicit ad filios suos, Deducetis senectam meam cum tristitia ad inferos (Gen. XLIV, 29), videtur hoc magis timuisse, ne nimia tristitia sic perturbaretur, ut non ad requiem beatorum iret, sed ad inferos peccatorum. Neque enim parvum animae malum est tristitia, cum et Apostolus cuidam tam sollicite timuerit, ne majore tristitia absorberetur (II Cor. II, 7). Proinde, ut dixi, nondum inveni, et adhuc quaero, nec mihi occurrit inferos alicubi in bono posuisse Scripturam duntaxat canonicam: non autem in bono accipiendum sinum Abrahae, et illam requiem quo ab Angelis pius pauper ablatus est, nescio utrum quisquam possit audire; et ideo quomodo eam apud inferos credamus esse, non video.

De Paradiso et tertio coelo quo raptus est Paulus. 65. Verum hoc dum quaerimus, et aut invenimus, aut non invenimus, urget nos longitudo libri hujus eum aliquando concludere. Quapropter quoniam de paradiso sermonem instituimus, propter illud quod Apostolus ait, scire se raptum hominem usque in tertium coelum, nescire autem sive in corpore sive extra corpus, et quia raptus est in paradisum, et audivit ineffabilia verba, quae non licet homini loqui; non temere affirmamus, utrum in tertio coelo sit paradisus, an etiam in tertium coelum, et inde rursus in paradisum raptus sit. Si enim proprie quidem nemorosus locus, translato autem verbo, omnis etiam spiritualis quasi regio, ubi animae bene est, merito paradisus dici potest; non solum tertium coelum, quidquid illud est, quod profecto magnum sublimiterque praeclarum est, verum etiam in ipso homine laetitia quaedam bonae conscientiae paradisus est. Unde et Ecclesia in sanctis temperanter et juste et pie viventibus paradisus recte dicitur (Eccli. XL, 28), pollens affluentia gratiarum, castisque deliciis: quandoquidem et in tribulationibus gloriatur de ipsa patientia plurimum gaudens, quia secundum multitudinem dolorum in corde consolationes Dei jucundant animam ejus (Psal. XCIII, 19). Quanto magis ergo post hanc vitam etiam sinus ille Abrahae paradisus dici potest, ubi jam nulla tentatio, ubi tanta requies post omnes dolores vitae hujus? Neque enim et lux ibi non est propria quaedam et sui generis, et profecto magna, quam dives ille de tormentis et tenebris inferorum, tam utique de longinquo, cum magnum chasma esset in medio, sic tamen vidit, ut ibi illum quondam contemptum pauperem agnosceret. 66. Quae si ita sunt, ideo sub terris dicuntur inferi vel creduntur, quia congruenter in spiritu per illas corporalium rerum similitudines sic demonstrantur, ut quoniam defunctorum animae inferis dignae, carnis amore peccaverunt, hoc eis per illas corporalium similitudines exhibeatur, quod ipsi carni mortuae solet, ut sub terram recondatur. Denique inferi eo quod infra sint, latine appellantur: sicut autem secundum corpus si ponderis sui ordinem teneant, inferiora sunt omnia graviora; ita secundum spiritum inferiora sunt omnia tristiora: unde et in graeca lingua origo nominis quo appellantur inferi, ex eo quod nihil suave habeant, resonare perhibetur. Nec ipsam tamen rerum partem noster Salvator mortuus pro nobis visitare contempsit, ut inde solveret quos esse solvendos secundum divinam secretamque justitiam ignorare non potuit. Quapropter animae illius latronis cui dixit, Hodie mecum eris in paradiso (Luc. XXIII, 43), non utique inferos praestitit, ubi poenae sunt peccatorum: sed aut illam requiem sinus Abrahae; non enim alicubi non est Christus, cum ipse sit Sapientia Dei attingens ubique propter suam munditiam (Sap. VII, 24); aut illum paradisum, sive in tertio coelo, sive ubicumque alibi est, quo post tertium coelum est raptus Apostolus: si tamen non aliquid unum est diversis nominibus appellatum, ubi sunt animae beatorum. 67. Si ergo coelum primum recte accipimus hoc omne corporeum generali nomine quidquid est super aquas et terram; secundum autem, in similitudine corporali quod spiritu cernitur, sicut illud unde animalibus plenus in ecstasi Petro discus ille submissus est (Act. X, 10-12); tertium vero, quod mente conspicitur ita secreta et remota et omnino abrepta a sensibus carnis atque mundata, ut ea quae in illo coelo sunt, et ipsam Dei substantiam, Verbumque Deum per quod facta sunt omnia, in charitate Spiritus sancti ineffabiliter valeat videre et audire: non incongruenter arbitramur, et illuc esse Apostolum raptum (II Cor. XII, 2-4), et ibi fortassis esse paradisum omnibus meliorem, et si dici oportet, paradisum paradisorum. Si enim animae bonae laetitia in rebus bonis est in omni creatura, quid ea laetitia praestantius quae in Verbo Dei est per quod facta sunt omnia?

Resurrectio corporum ad perfectam beatitudinem animae cur sit necessaria. 68. Sed si quem movet, quid opus sit spiritibus defunctorum corpora sua in resurrectione recipere, si potest eis etiam sine corporibus summa illa beatitudo praeberi; difficilior quidem quaestio est, quam ut perfecte possit hoc sermone finiri: sed tamen minime dubitandum est, et raptam hominis a carnis sensibus mentem, et post mortem ipsa carne deposita, transcensis etiam similitudinibus corporalium, non sic videre posse incommutabilem substantiam, ut sancti Angeli vident; sive alia latentiore causa, sive ideo quia inest ei naturalis quidam appetitus corpus administrandi; quo appetitu retardatur quodammodo ne tota intentione pergat in illud summum coelum, quamdiu non subest corpus, cujus administratione appetitus ille conquiescat. Porro autem si tale sit corpus, cujus sit difficilis et gravis administratio, sicut haec caro quae corrumpitur, et aggravat animam (Sap. IX, 15), de propagine transgressionis existens, multo magis avertitur mens ab illa visione summi coeli: unde necessario abripienda erat ab ejusdem carnis sensibus, ut ei, quomodo capere posset, illud ostenderetur. Proinde cum hoc corpus jam non animale, sed per futuram commutationem spirituale receperit Angelis coaequata, perfectum habebit naturae suae modum, obediens et imperans, vivificata et vivificans, tam ineffabili facilitate, ut sit ei gloriae quod sarcinae fuit.

Tria visionum genera quomodo erunt in beatis. 69. Nimirum enim erunt et tunc ista tria genera visionum, sed nulla falsitate aliud pro alio approbabitur, nec in corporalibus, nec in spiritualibus visis; multo minus in intellectualibus, quibus ita praesentatis et perspicuis perfruetur ut longe minore evidentia nunc nobis adjaceant istae species corporales, quas sensu carnis attingimus, et eis multi ita sunt dediti, ut solas esse arbitrentur, et quidquid tale non est, putent omnino non esse. Sapientes autem ita sunt in his corporalibus visis, ut quamvis ea praesentiora videantur, certiores sint tamen in illis quae praeter corporis speciem praeterque corporis similitudinem intelligendo utcumque perspiciunt; quamvis ea non valeant ita mente conspicere, ut haec sensu corporis intuentur. Sancti vero Angeli et his corporalibus judicandis atque administrandis praesunt, nec eis tanquam praesentioribus familiarius inclinantur; et eorum significativas similitudines in spiritu ita discernunt, et tanta potentia quodammodo tractant, ut eas possint etiam hominum spiritibus revelando miscere; et illam incommutabilem substantiam Creatoris ita conspiciunt, ut visione atque amore et eam praeponant omnibus, et secundum eam judicent de omnibus, et in eam dirigantur ut agantur, et ex ea dirigant quidquid agunt. Denique quamvis abrepto Apostolo a carnis sensibus in tertium coelum et paradisum, hoc ipsum certe defuit ad plenam perfectamque cognitionem rerum, quae Angelis inest, quod sive in corpore sive extra corpus esset, nesciebat. Hoc utique non deerit, cum receptis corporibus in resurrectione mortuorum corruptibile hoc induetur incorruptione, et mortale hoc induetur immortalitate (I Cor. XV, 53). Omnia enim evidentia erunt sine ulla falsitate, sine ulla ignorantia, suis ordinibus distributa et corporalia et spiritualia et intellectualia, in natura integra et beatitate perfecta.

