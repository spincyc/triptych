Corporalium similitudines a spiritu in seipso formari. 32. Quae cum ita sint, pertinet corporis sensus ad visa corporalia, qui per quinque quasi rivulos distanter valentes distribuitur: cum illud quod est subtilissimum in corpore, et ob hoc animae vicinius quam caetera, id est lux, primum per oculos sola diffunditur, emicatque in radiis oculorum ad visibilia contuenda; deinde mixtura quadam, primum cum aere puro, secundo cum aere caliginoso atque nebuloso, tertio cum corpulentiore humore, quarto cum terrena crassitudine, quinque sensus cum ipso, ubi sola excellit, oculorum sensu efficit: sicut in libro quarto, itemque in septimo disseruisse me recolo. Est autem hoc coelum oculis conspicuum, unde luminaria et sidera effulgent, excellentius utique omnibus corporeis elementis, sicut oculorum sensus excellit in corpore. Quia vero spiritus omnis omni est corpore sine dubitatione praestantior, sequitur ut non loci positione, sed naturae dignitate praestantior sit natura spiritualis isto corporeo coelo, etiam illa ubi rerum corporalium exprimuntur imagines. 33. Hic existit quiddam mirabile, ut cum prior sit corpore spiritus, et posterior corporis imago quam corpus, tamen quia illud quod tempore posterius est, fit in eo quod natura prius est, praestantior sit imago corporis in spiritu, quam ipsum corpus in substantia sua. Nec sane putandum est facere aliquid corpus in spiritu, tanquam spiritus corpori facienti, materiae vice subdatur. Omni enim modo praestantior est qui facit, ea re de qua aliquid facit; neque ullo modo spiritu praestantius est corpus; imo perspicuo modo spiritus corpore. Quamvis ergo prius videamus aliquod corpus, quod antea non videramus, atque inde incipiat imago ejus esse in spiritu nostro, quo illud cum absens fuerit recordemur: tamen eamdem ejus imaginem non corpus in spiritu, sed ipse spiritus in seipso facit celeritate mirabili, quae ineffabiliter longe est a corporis tarditate; cujus imago mox ut oculis visum fuerit, in spiritu videntis nullius puncti temporalis interpositione formatur. Itemque in auditu, nisi auribus perceptae vocis imaginem continuo spiritus in seipso formaret, ac memoria retineret, ignoraretur secunda syllaba utrum secunda esset, cum jam prima utique nulla esset, quae percussa aure transiisset: ac sic omnis locutionis usus, omnis cantandi suavitas, omnis postremo in actibus nostris corporalis motus dilapsus occideret; neque ullum progressum nancisceretur, si transactos corporis motus memoriter spiritus non teneret, quibus consequentes in agendo connecteret. Quos utique non tenet, nisi imaginaliter a se factos in se. Ipsarum etiam futurarum motionum imagines praeveniunt fines actuum nostrorum. Quid enim agimus per corpus, quod non cogitando praeoccupaverit spiritus, omniumque visibilium operum similitudines in seipso primitus viderit, et quodammodo disposuerit?\
