Similitudines animo expressae unde innotescant daemonibus. Visiones quaedam mirae. Phrenetici. Puer aegrotans. 34. Quae spirituales corporalium similitudines in animo nostro, quemadmodum innotescant spiritibus etiam immundis, vel quid obstaculi patiatur anima nostra ex isto terreno corpore, ut eas invicem in nostro spiritu videre nequeamus, invenire et explicare difficile est. Certissimis tamen indiciis apud nos constitit enuntiatas a daemonibus cogitationes hominum, qui tamen si virtutum internam speciem possent in hominibus cernere, non tentarent: sicut illam in Job nobilem ac mirabilem patientiam procul dubio, si posset diabolus cernere, nollet a tentato utique superari. Caeterum alicubi longe jam facta quod nuntiant, quae post aliquot dies vera esse firmentur, non est mirandum. Possunt enim hoc efficere, non solum acrimonia cernendi etiam corporalia incomparabiliter praestantiore quam nostra est, sed etiam corporum ipsorum, longe utique subtiliorum, mira velocitate. 35. Comperimus etiam in domo constitutum patientem spiritum immundum, dicere solere quando ad eum venire coepisset ex duodecim millibus presbyter, et per omnia loca itineris ubi esset, et quam propinquaret, et quando ingrederetur et fundum et domum et cubiculum, donec in conspectu ejus astaret. Quae omnia etsi non oculis patiens ille cernebat, tamen nisi aliquo modo cerneret, non tam veraciter enuntiaret. Erat autem iste febriens, et tanquam in phrenesi ista dicebat. Et forte revera phreneticus erat, sed propter ista daemonium pati putabatur. Nullum refectionis cibum accipiebat a suis, sed a solo presbytero. Resistebat etiam suis violenter quantum valebat; illo solo presbytero veniente quiescebat, illi tantum subditus erat, et subdite respondebat. Nec tamen eidem saltem presbytero illa cessit mentis alienatio sive daemonium, nisi cum sanus esset a febribus, sicut phrenetici sanari solent; nec aliquando postea tale aliquid passus est. 36. Novimus etiam sine dubitatione phreneticum futuram mortem cujusdam feminae praedixisse; non sane specie divinandi, sed tanquam factum ac praeteritum recolentem. Nam cum ejus apud eum commemoratio fieret, Mortua est, inquit, ego eam vidi efferri, hac cum ejus corpore transierunt; cum illa incolumis viveret: post paucos autem dies repente defuncta, et per eum locum elata est, qua ille praedixerat. 37. Fuit item apud nos puer, qui in exordio pubertatis dolorem acerrimum genitalium patiebatur, medicis nequaquam valentibus quid illud esset agnoscere, nisi quod nervus ipse introrsum reconditus erat, ita ut nec praeciso praeputio, quod immoderata longitudine propendebat, apparere potuerit, sed postea vix esset inventus. Humor autem viscosus et acer exsudans testes et inguina urebat. Sed acutum dolorem non continuum patiebatur, et cum patiebatur, ejulabat vehementer cum jactatione membrorum mente sanissima, sicut in cruciatibus corporalium dolorum fieri solet. Deinde inter voces suas abripiebatur ab omnibus sensibus, et jacebat patentibus oculis neminem circumstantium videns, ad nullam vellicationem se movens. Post aliquantum tanquam evigilans, nec jam dolens, quae videret indicabat. Tum interpositis paucis diebus eadem patiebatur. In omnibus sane vel pene omnibus visionibus suis, duos se dicebat videre, unum provectioris aetatis, alterum puerum, a quibus ei vel dicebantur, vel demonstrabantur, quae se audisse et vidisse narrabat. 38. Vidit quodam die chorum piorum psallentium, laetantium in luce mirabili, et impiorum in tenebris diversas et atrocissimas poenas; illis ducentibus et ostendentibus, et felicitatis aliorum, aliorumque infelicitatis meritum insinuantibus. Hoc autem vidit die dominico Paschae, cum per totam Quadragesimam nihil doluisset, cui vix intervallo tridui antea parcebatur. Viderat autem in ipso ingressu Quadragesimae illos promittentes sibi quod per quadraginta dies nullum sensurus esset dolorem; postea ipsi ei dederunt tanquam medicinale consilium, ut ei praeputii longitudo praecideretur, quo facto diu non doluit. Cum vero iterum similiter doleret, et similia videre coepisset, accepit ab eis rursus consilium, ut in mare pube tenus intraret, ac post aliquantam moram inde discederet, promittentibus sane quod jam deinceps vehementem illum dolorem non esset passurus, sed solius illius viscosi humoris molestiam: atque ita secutum est; nec unquam talem aliquam postea passus est aversionem mentis a sensibus, nec tale aliquid vidit quale antea cum in mediis doloribus et horrendis vocibus repente obmutescens abriperetur. Postea tamen medicis caetera curantibus et sanantibus, non permansit in proposito sanctitatis.\
