text = """
LIBER SEXTUS.

In vers. 7 cap. 2 Geneseos, Et finxit Deus hominem pulverem de terra, etc., quomodo seu quando de limo formatus fuerit homo inquiritur: tum, dilata tantisper consideratione animae, dicitur de corpore Adami.

An istud, Et finxit Deus, etc., de prima hominis formatione facta die sexto, an de altera posterius et per temporis moram facta intelligendum. 1. Et finxit Deus hominem pulverem de terra, et insufflavit in faciem ejus flatum vitae; et factus est homo in animam viventem. Hic primo videndum est utrum ista recapitulatio sit, ut nunc dicatur quomodo factus sit homo quem sexto illo die factum legimus; an vero tunc quidem cum fecit omnia simul, in his etiam latenter hominem fecit, sicut fenum terrae antequam esset exortum: ut eo modo et ipse cum jam esset in secreto quodam naturae aliter factus, sicut illa quae simul creavit cum factus est dies, accessu temporis etiam isto modo fieret, quo in hac perspicua forma vitam gerit, vel male vel bene; sicut fenum quod factum est antequam exoriretur super terram, accedente jam tempore et fontis illius irrigatione exortum est, ut esset super terram. 2. Prius ergo secundum recapitulationem id conemur accipere. Fortassis quippe ita homo factus sit in die sexto, sicut dies ipse primitus factus est, sicut firmamentum, sicut terra et mare. Neque enim haec dicenda sunt ante in quibusdam primordiis jam facta latuisse, ac deinde in hanc faciem qua mundus exstructus est, accessu temporis tanquam exorta claruisse; sed ab exordio saeculi, cum factus est dies, conditum mundum, in cujus elementis simul sunt condita, quae post accessu temporis orirentur, vel fruteta, vel animalia quaeque secundum suum genus. Nam nec ipsa sidera credendum est in elementis mundi primitus facta atque recondita, accessu postea temporis exstitisse, atque in has enituisse formas quae coelitus fulgent; sed illo senario perfectionis numero creata simul omnia, cum factus est dies. Utrum ergo sic et homo ista jam specie qua in sua natura vivit, et agit sive bonum sive malum? an et ipse in occulto sicut fenum agri antequam exortum est, ut hoc ei post esset accessu temporis exoriri, quod de pulvere factus est?

Res exploratur ex contextu Scripturae. 3. Accipiamus ergo eum sexto ipso die in hac perspicua visibilique forma de limo finctum, sed tunc non commemoratum quod nunc recapitulando insinuatur, et videamus utrum nobiscum ipsa Scriptura concordet. Sic certe scriptum est, cum adhuc diei sexti opera narrarentur: Et dixit Deus, Faciamus hominem ad imaginem et similitudinem nostram; et habeat potestatem piscium maris et volatilium coeli, et omnium pecorum, et omnis terrae, et omnium repentium quae repunt super terram. Et fecit Deus hominem, ad imaginem Dei fecit cum; masculum et feminam fecit eos, et benedixit eos Deus, dicens: Crescite et multiplicamini, et implete terram, et dominamini ejus; et habete potestatem piscium maris, et volatilium coeli, et omnium pecorum, et omnis terrae, et omnium reptilium repentium super terram (Gen. I, 26-28). Jam ergo de limo formatus erat, et illi jam soporato mulier ex latere jam facta erat, sed hoc tunc commemoratum non erat, quod nunc recapitulando commemoratum est. Neque enim sexto die factus est masculus, et accessu temporis postea facta femina; sed fecit eum, inquit; masculum et feminam fecit eos, et benedixit eos. Quomodo ergo jam homine in paradiso constituto mulier ei facta est? An et hoc praetermissum Scriptura recoluit? Nam sexto illo die etiam paradisus plantatus est, et ibi homo collocatus est, et soporatus est ut Eva formaretur, et ea formata evigilavit, eique nomen imposuit. Sed haec nisi per temporales moras fieri non possent. Non itaque ita facta sunt, sicut creata sunt omnia simul.

Eadem quaestio ex aliis locis Scripturae discutitur. 4. Quantamlibet enim homo cogitet facilitatem qua Deus etiam haec simul cum caeteris fecit, verba certe hominis novimus, nisi per temporales morulas emitti voce non posse. Cum ergo verba hominis audimus, vel cum animantibus, vel cum mulieri nomen imposuit, vel cum secutus etiam dixit, Propter hoc relinquet homo patrem suum et matrem, et conjungetur uxori suae; et erunt duo in carne una (Gen. II, 24); quibuslibet syllabis ista sonuerint, nec duae quaecumque in his verbis syllabae simul sonare potuerunt: quanto minus haec omnia cum iis quae simul creata sunt, simul fieri? Ac per hoc, aut et illa omnia non simul ab ipso summo exordio saeculorum, sed per moras atque intervalla temporum facta sunt, diesque ille non spirituali sed corporali substantia primum conditus, vel circuitu lucis nescio quomodo, vel emissione et contractione, mane ac vesperam faciebat: aut si consideratis omnibus quae superioribus sermonibus petractata sunt, probabilis ratio persuasit, illum diem spiritualem sublimiter ac primitus conditum lucem quamdam sapientem vocatum esse diem, cujus praesentia per ordinatam cognitionem conditioni rerum in numero senario praeberetur; atque huic sententiae Scripturae verba congruere quod ait postea, Cum factus est dies, fecit Deus coelum et terram, et omne viride agri antequam esset super terram, et omne fenum agri antequam exoriretur (Ibid., 4, 5); attestari etiam quod alibi scriptum est, Qui vivit in aeternum, creavit omnia simul (Eccli. XVIII, 1): non est dubium hoc quod homo de limo terrae finctus est, eique formata uxor ex latere, jam non ad conditionem qua simul omnia facta sunt, pertinere, quibus perfectis requievit Deus; sed ad eam operationem, quae fit jam per volumina saeculorum, qua usque nunc operatur. 5. Huc accedit quod ipsa etiam verba quibus narratur quomodo Deus paradisum plantaverit, in eoque hominem quem fecerat collocarit, ad eumque adduxerit animalia, quibus nomina imponeret, in quibus cum adjutorium simile illi non fuisset inventum, tunc ei mulierem costa ejus detracta formaverit, satis nos admonent haec non ad illam operationem Dei pertinere, unde requievit in die septimo, sed ad istam potius qua per temporum cursus usque nunc operatur. Cum enim paradisus plantaretur, ita narrat: Et plantavit Deus paradisum in Eden ad orientem, et posuit ibi hominem quem finxerat. Et ejecit Deus adhuc de terra omne lignum pulchrum ad aspectum, et bonum ad escam (Gen. II, 8, 9).

Idem expenditur ad Gen. II, 8, 9. Cum dicit ergo, Ejecit adhuc de terra omne lignum pulchrum ad aspectum; manifestat utique quod aliter nunc ejecerit de terra lignum, aliter tunc cum tertio die produxit terra herbam pabuli, seminantem semen secundum genus suum, et lignum fructuosum secundum suum genus. Hoc est enim, Ejecit adhuc, super illud scilicet quod jam ejecerat: tunc utique potentialiter et causaliter in opere pertinente ad creanda omnia simul, a quibus consummatis in die septimo requievit; nunc autem visibiliter in opere pertinente ad temporum cursum, sicut usque nunc operatur.

6. Nisi forte quis dicat non omne ligni genus tertio die creatum, sed dilatum aliquid quod sexto crearetur, cum homo factus est atque in paradiso constitutus. Sed quae sexto die creata sunt, apertissime Scriptura declarat; anima viva scilicet secundum unumquodque genus, quadrupedum et repentium et bestiarum, et ipse homo ad imaginem Dei masculus et femina. Proinde potuit praetermittere quomodo sit homo factus, quem tamen ipso die factum esse narravit, ut recapitulando postea, quemadmodum etiam factus fuerit intimaret, hoc est de terrae pulvere, et mulier illi de latere; non tamen aliquod creaturae genus praetermittere, vel in eo quod dixit Deus, Fiat, sive, Faciamus, vel in eo quod dicitur, Sic est factum, sive, Fecit Deus. Alioquin frustra per singulos dies tam diligenter distincta sunt omnia, si permixtionis dierum potest ulla suspicio residere, ut cum herba et lignum diei tertio sit attributum, aliqua ligna etiam sexto die creata esse credamus, quae ipso sexto die Scriptura tacuerit.

De eadem re. 7. Postremo quid respondebimus de bestiis agri, et volatilibus coeli, quae adduxit Deus ad Adam, ut videret quid ea vocaret? Quod ita scriptum est: Et dixit Dominus Deus; Non est bonum esse hominem solum; faciamus illi adjutorium secundum ipsum. Et finxit Deus adhuc de terra omnes bestias agri, et omnia volatilia coeli, et adduxit illa ad Adam, ut videret quid vocaret illa: et omne quodcumque illud vocavit Adam animam vivam, hoc nomen est illius. Et vocavit Adam nomina omnibus pecoribus et omnibus volatilibus coeli, et omnibus bestiis agri. Adae autem non est inventus adjutor similis ipsi. Et injecit Deus mentis alienationem super Adam, et obdormivit, et sumpsit unam de costis ejus, et adimplevit carnem in locum ejus, et aedificavit Dominus Deus costam, quam sumpsit de Adam, in mulierem (Cen. II, 18-22). Si ergo consequenter, cum in pecoribus et bestiis agri et volatilibus coeli non esset inventum adjutorium simile homini, fecit ei Deus adjutorium simile de costa lateris ejus; hoc autem factum est cum easdem bestias agri et volatilia coeli adhuc de terra finxisset, et ad illum adduxisset: quomodo sexto die factum hoc potest intelligi, quandoquidem illo die produxit terra animam vivam secundum verbum Dei; volatilia vero quinto die produxerunt aquae similiter secundum verbum Dei? Non itaque hic diceretur, Et finxit Deus adhuc de terra omnes bestias agri, et omnia volatilia coeli, nisi quia jam terra produxerat omnes bestias agri sexto die, et aqua omnia volatilia coeli quinto die. Aliter ergo tunc, id est potentialiter atque causaliter, sicut illi operi competebat, quo creavit omnia simul, a quibus in die septimo requievit: aliter autem nunc, sicut ea videmus, quae per temporalia spatia creat, sicut usque nunc operatur. Ac per hoc jam per istos notissimos lucis corporalis dies, qui circuitu solis fiunt, Eva facta est de latere viri sui. Tunc enim Deus adhuc finxit de terra bestias et volatilia, in quibus cum adjutorium simile ipsi Adam non esset inventum, illa formata est. In talibus ergo diebus etiam ipsum de limo finxit Deus. 8. Neque enim dicendum est, masculum quidem sexto die factum, feminam vero posterioribus diebus; cum ipso sexto die apertissime dictum sit, Masculum et feminam fecit eos, et benedixit eos, et caetera, quae de ambobus et ad ambos dicuntur. Aliter ergo tunc ambo, et nunc aliter ambo: tunc scilicet secundum potentiam per verbum Dei tanquam seminaliter mundo inditam, cum creavit omnia simul, a quibus in die septimo requievit, ex quibus omnia suis quaeque temporibus jam per saeculorum ordinem fierent; nunc autem secundum operationem praebendam temporibus, qua usque nunc operatur, et oportebat jam tempore suo fieri Adam de limo terrae, ejusque mulierem ex viri latere.

Sententiam suam liquidius explicat, ne male intelligatur. 9. In qua distributione operum Dei, partim ad illos dies invisibiles pertinentium, quibus creavit omnia simul, partim ad istos appositos, in quibus operatur quotidie quidquid ex illis tanquam involucris primordialibus in tempore evolvitur, si non importune atque absurde Scripturae verba secuti sumus, quae nos ad haec distinguenda duxerunt: cavendum est ne propter ipsarum rerum aliquanto difficilem perceptionem, quam tardiones assequi non sufficiunt, putemur aliquid sentire ac dicere, quod scimus nos nec sentire nec dicere. Quanquam enim praecedentibus sermonibus, quantum potuerim, lectorem praestruxerim; plures tamen arbitror caligare in his locis, et putare ita fuisse prius hominem in illo Dei opere, quo cuncta simul creata sunt, ut aliquam vitam duceret, ut Dei locutionem ad se directam, cum dixit Deus, Ecce dedi vobis omne pabulum seminale, discerneret, crederet, intelligeret. Noverit ergo qui hoc putat, non hoc me sensisse, neque dixisse. 10. Sed rursus, si dixero non ita fuisse hominem in illa prima rerum conditione, qua creavit Deus omnia simul, sicuti est non tantum perfectae aetatis homo, sed ne infans quidem, nec tantum infans, sed ne puerperium quidem in utero matris, nec tantum hoc, sed nec semen quidem visibile hominis; putabit omnino non fuisse. Redeat ergo ad Scripturam; inveniet sexto die hominem factum ad imaginem Dei, factos autem masculum et feminam. Item quaerat quando facta sit femina; inveniet extra illos sex dies: tunc enim facta est, quando Deus de terra finxit adhuc bestias agri et volatilia coeli; non quando volatilia produxerunt aquae, et animam vivam, in qua et bestiae sunt, produxit terra. Tunc autem factus est homo et masculus et femina: ergo et tunc et postea. Neque enim tunc, et non postea; aut vero postea, et non tunc: nec alii postea, sed iidem ipsi aliter tunc, aliter postea. Quaeret ex me quomodo. Respondebo, Postea visibiliter, sicut species humanae constitutionis nota nobis est; non tamen parentibus generantibus, sed ille de limo, illa de costa ejus. Quaeret tunc quomodo. Respondebo, Invisibiliter, potentialiter, causaliter, quomodo fiunt futura non facta. 11. Hic forte non intelliget. Subtrahuntur enim ei cuncta quae novit, usque ad ipsam seminum corpulentiam. Neque enim vel tale aliquid homo jam erat, cum in prima illa sex dierum conditione factus erat. Datur quidem de seminibus ad hanc rem nonnulla similitudo, propter illa quae in eis futura conserta sunt; verumtamen ante omnia visibilia semina sunt illae causae: sed non intelligit. Quid ergo faciam, nisi, quantum possum, salubriter moneam ut Scripturae Dei credat et tunc factum hominem, quando Deus, cum factus est dies, fecit coelum et terram, de quo alibi Scriptura dicit, Qui vivit in aeternum, creavit omnia simul (Eccli. XVIII, 1); et tunc quando jam non simul, sed suis quaeque temporibus creans, finxit eum de limo terrae, et ex ejus osse mulierem? nam nec isto modo eos illo sexto die factos, nec tamen eos illo sexto die non factos intelligere Scriptura permittit.

Dici non posse animas prius creatas quam corpora. 12. Forte ergo animae eorum sexto die illo factae erant, ubi et ipsa imago Dei recte intelligitur in spiritu mentis eorum, ut postea corpora formarentur? Sed neque hoc credere eadem Scriptura permittit. Primo propter illam operum consummationem; quae non video quomodo possit intelligi, si defuit aliquid tunc non causaliter conditum, quod postea visibiliter conderetur. Deinde quia sexus ipse masculi et feminae nisi in corporibus esse non potest. Quod si quisquam secundum intellectum et actionem tanquam utrumque sexum in una anima accipiendum putaverit; quid faciet de his quae ad escam Deus ipso die dedit de lignorum fructibus, quae nisi homini habenti corpus non utique congrua est? Nam si et hanc escam figurate accipere quisquam voluerit, recedet a proprietate rerum gestarum, quae primitus in hujusmodi narrationibus omni observatione fundanda est.

Difficultas de voce Dei ad hominem sexto die directa. 13. Quomodo ergo loquebatur, inquit, eis qui nondum audiebant, nec intelligebant; quia nec erant qui verba perciperent? Possem respondere sic eos allocutum Deum, quemadmodum Christus nos nondum natos, etiam longe post futuros, nec tantum nos, sed etiam eos omnes qui futuri sunt post nos. Omnibus enim dicebat, quos suos futuros videbat, Ecce ego vobiscum sum usque in consummationem saeculi (Matth. XXVIII, 20): sicut Deo notus erat propheta cui dixit, Priusquam te formarem in utero, novi te (Jerem. I, 5); sicut decimatus est Levi cum esset in lumbis Abraham (Hebr. VII, 9, 10). Cur enim non ita et ipse Abraham in Adam, et ipse Adam in primis operibus mundi, quae Deus creavit omnia simul? Sed verba Domini per os carnis ejus, et verba Dei per ora Prophetarum temporali corporis voce proferuntur, et omnibus syllabis suis congruas temporum moras sumunt, atque consumunt: cum vero Deus dicebat, Faciamus hominem ad imaginem et similitudinem nostram, et habeat potestatem piscium maris et volatilium coeli, et omnium pecorum, et omnis terrae, et omnium reptilium quae repunt super terram; et, Crescite, et multiplicamini, et replete terram, et dominamini ejus; et habete potestatem piscium maris, et volatilium coeli, et omnium pecorum, et omnis terrae, et omnium repentium quae repunt super terram; et, Ecce dedi vobis omne pabulum seminale, seminans semen quod est super omnem terram, et omne lignum fructiferum, quod habet in se fructum seminis seminalis, quod erit vobis ad escam (Gen. I, 26-29); ipse sermo ejus ante omnem aeris sonum, ante omnem carnis et nubis vocem, in illa summa ejus Sapientia, per quam facta sunt omnia, non quasi humanis auribus instrepebat, sed rebus factis rerum faciendarum causas inscrebat, et omnipotenti potentia futura faciebat, hominemque suo tempore formandum, in temporum tanquam semine vel tanquam radice condebat, quando condebat unde inciperent saecula, ab illo condita qui est ante saecula. Creaturae quippe aliae creaturas alias, quaedam tempore, quaedam causis praecedunt: ille autem omnia quae fecit, non solum excellentia, qua etiam causarum effector est, verum etiam aeternitate praecedit. Sed de hoc opportunioribus deinde Scripturarum locis fortassis plenius disserendum est.

Jeremias quomodo Deo notus antequam formatus. Merita nondum natorum. 14. Nunc de homine quod coeptum est terminetur, ea moderatione servata, ut in profundo Scripturae sensu magis praestemus diligentiam requirendi, quam affirmandi temeritatem. Quia enim noverat Jeremiam Deus priusquam eum formaret in utero, dubitare fas non est: apertissime quippe dicit, Priusquam te formarem in utero, novi te. Ubi autem illum nosset antequam ita formasset, etsi nostrae infirmitati assequi vel difficile vel impossibile est; utrum in aliquibus propinquioribus causis, sicut Levi in lumbis Abrahae decimatus est; an in ipso Adam, in quo genus humanum tanquam radicaliter institutum est; et in eo ipso utrum jam cum de limo formatus esset, an cum causaliter in his operibus factus quae creavit omnia simul; an vero ante omnem potius creaturam, sicut elegit et praedestinavit sanctos suos ante mundi constitutionem (Ephes. I, 4); an potius in omnibus praecedentibus causis, sive quas commemoravi, sive quas non commemoravi, priusquam in utero formaretur; non arbitror scrupulosius quaeri oportere, dummodo Jeremiam constet, ex quo est in hac luce a parentibus editus, ex illo egisse vitam propriam, qua grandescens aetatis accessu, posset vivere sive male sive beve; antea vero nullo modo, non solum priusquam in utero formaretur, sed nec jam ibi formatus, antequam natus. Neque enim habet ullam cunctationem apostolica illa sententia de geminis in Rebeccae utero nondum agentibus aliquid boni aut mali (Rom. IX, 11). 15. Nec tamen frustra scriptum est, nec infantem mundum esse a peccato, cujus est unius diei vita super terram (Job. XIV, 4, sec. LXX); et illud in Psalmo, Ego in iniquitatibus conceptus sum, et in peccatis mater mea (Psal. L, 7) me in utero aluit; et quod in Adam omnes moriuntur, in quo omnes peccaverunt (Rom. V, 12). Nunc autem liquido teneamus, quaelibet parentum merita trajiciantur in prolem, quaecumque gratia Dei, antequam nascatur, quemque sanctificet, nec iniquitatem esse apud Deum, nec boni malive agere quemquam quod ad propriam personam pertineat, antequam natus est: illamque sententiam qua nonnulli putant alibi peccasse magis minusque animas, et pro diversorum meritis peccatorum in diversa corpora esse detrusas, apostolicae non convenire sententiae; cum apertissime dictum sit, nihil egisse nondum natos seu boni seu mali. 16. Ac per hoc aliqua quaestio est suo loco retractanda, quid de peccato primorum parentum, qui duo soli fuerunt, generis humani contraxerit universa consparsio: nihil tamen talium meritorum habere potuisse hominem antequam de terrae pulvere finctus esset, antequam suo tempore viveret, nulla quaestio est. Sicut enim Esau et Jacob, quos nondum natos dixit Apostolus nihil egisse boni aut mali (Id. IX, 11), non possemus dicere traxisse aliquid meriti de parentibus, si nec ipsi parentes egissent aliquid boni aut mali; nec genus humanum peccasse in Adam, si ipse non peccasset Adam; non autem peccasset Adam, nisi jam suo tempore viveret, quo posset vivere sive bene sive male: ita frustra peccatum ejus, seu recte factum requiritur, cum adhuc in rebus simul creatis causaliter conditus, nec vita propria jam vivebat, nec in parentibus sic viventibus erat. In illa enim prima conditione mundi, cum Deus omnia simul creavit, homo factus est qui esset futurus, ratio creandi hominis, non actio creati.

Res variis modis existentes. 17. Sed haec aliter in Verbo Dei, ubi ista non facta, sed aeterna sunt; aliter in elementis mundi, ubi omnia simul facta futura sunt; aliter in rebus quae secundum causas simul creatas, non jam simul sed suo quaeque tempore creantur, in quibus Adam jam formatus ex limo, et Dei flatu animatus, sicut fenum exortum; aliter in seminibus, in quibus rursus quasi primordiales causae repetuntur, de rebus ductae quae secundum causas, quas primum condidit, exstiterunt, velut herba ex terra, semen ex herba. In quibus omnibus ea jam facta modos et actus sui temporis acceperunt, quae ex occultis atque invisibilibus rationibus, quae in creatura causaliter latent, in manifestas formas naturasque prodierunt: sicut herba exorta super terram, et homo factus in animam vivam, et caetera hujusmodi, sive fruteta sive animantia, ad illam operationem Dei pertinentia, quae usque nunc operatur. Sed etiam ista secum gerunt tanquam iterum seipsa invisibiliter in occulta quadam vi generandi, quam extraxerunt de illis primordiis causarum suarum, in quibus creato mundo cum factus est dies, antequam in manifestam speciem sui generis exorirentur, inserta sunt.

Opera creationis die sexto quomodo et jam consummata, et adhuc inchoata. 18. Si enim prima illa opera Dei, cum simul omnia creavit, in suo modo perfecta non essent, ea procul dubio post adderentur quae illis perficiendis defuissent; ut quaedam universitatis perfectio ex utrisque constaret singulis quasi semis, velut alicujus totius partes essent, quarum conjunctione ipsum totum cujus partes fuerant, compleretur. Rursus, si ita essent illa perfecta, sicut perficiuntur, cum suis quaeque temporibus in manifestas formas actusque procreantur; profecto aut nihil ex eis postea per tempora fieret, aut hoc fieret, quod ex istis quae suo quaeque jam tempore oriuntur, Deus non cessat operari. Nunc autem quia jam et consummata quodammodo, et quodammodo inchoata sunt ea ipsa quae consequentibus evolvenda temporibus primitus Deus omnia simul creavit, cum faceret mundum: consummata quidem quia nihil habent illa in naturis propriis, quibus suorum temporum cursus agunt, quod non in istis causaliter factum sit; inchoata vero, quoniam quaedam erant quasi semina futurorum, per saeculi tractum ex occulto in manifestum locis congruis exserenda: ipsius etiam Scripturae verba satis ad hoc admonendum insigniter vigent, si quis in eis evigilet. Nam et consummata ea dicit et inchoata: nisi enim consummata essent, non scriptum esset, Et consummata sunt coelum et terra, et omnis compositio illorum: et consummavit Deus in die sexto opera sua, quae fecit: et requievit Deus in die septimo ab omnibus operibus suis, quae fecit; et benedixit Deus diem septimum, et sanctificavit eum; rursusque nisi inchoata essent, non ita sequeretur, quia illa die requievit ab omnibus operibus suis quae inchoavit Deus facere. 19. Hic igitur si quis inquirat quomodo consummavit et quomodo inchoavit: neque enim alia consummavit, alia inchoavit, sed eadem ipsa utique a quibus in die septimo requievit, ex iis quae supra diximus clarum est. Consummasse quippe ista intelligimus Deum, cum creavit omnia simul ita perfecte, ut nihil ei adhuc in ordine temporum creandum esset, quod non hic ab eo jam in ordine causarum creatum esset: inchoasse autem, ut quod hic praefixerat causis, post impleret effectis. Proinde formavit Deus hominem pulverem terrae, vel limum terrae, hoc est de pulvere vel limo terrae; et inspiravit sive insufflavit in ejus faciem spiritum vitae, et factus est homo in animam vivam. Non tunc praedestinatus; hoc enim ante saeculum in praescientia Creatoris: neque tunc causaliter vel consummate inchoatus, vel inchoate consummatus; hoc enim a saeculo in rationibus primordialibus, cum simul omnia crearentur: sed creatus in tempore suo, visibiliter in corpore, invisibiliter in anima, constans ex anima et corpore.

Corpus hominis an singulari modo a Deo formatum. 20. Jam ergo videamus quomodo eum fecerit Deus, primum de terra corpus ejus; post etiam de anima videbimus, si quid valebimus. Quod enim manibus corporalibus Deus de limo finxerit hominem, nimium puerilis cogitatio est, ita ut si hoc Scriptura dixisset, magis eum qui scripsit translato verbo usum credere deberemus, quam Deum talibus membrorum lineamentis determinatum qualia videmus in corporibus nostris. Dictum est enim, Manus tua gentes disperdidit (Psal. XLIII, 3); et, Eduxisti populum tuum in manu forti et brachio excelso (Psal. CXXXV, 11, 12); sed pro potestate et virtute Dei positum hujus membri nomen quis usque adeo desipit, ut non intelligat? 21. Nec illud audiendum est, quod nonnulli putant, ideo praecipuum Dei opus esse hominem, quia caetera dixit, et facta sunt; hunc autem ipse fecit: sed ideo potius, quia hunc ad imaginem suam fecit. Nam illa quae dixit et facta sunt, ideo sic scriptum est (Psal. CXLVIII, 5), quia per Verbum ejus facta sunt, sicut per hominem hominibus dici potuit verbis, quae temporaliter cogitantur, et voce proferuntur. Non sic autem loquitur Deus, nisi cum per corporalem creaturam loquitur, sicut Abrahae, sicut Moysi, sicut per nubem de Filio suo. Ante vero omnem creaturam, ut esset ipsa creatura, eo Verbo dictum est, quod in principio erat Deus apud Deum: et quia omnia per ipsum facta sunt, et sine ipso factum est nihil (Joan. I, 1, 3), utique et homo per ipsum factus est. Certe enim coelum verbo fecit, quia dixit et factum est: scriptum est tamen, Et opera manuum tuarum sunt coeli (Psal. CI, 26). Et de hoc imo quasi fundo mundi scriptum est: Quoniam ipsius est mare, et ipse fecit illud, et aridam manus ejus finxerunt (Psal. XCIV, 5). Non igitur hoc in honorem hominis deputetur, velut caetera Deus dixerit, et facta sint, hunc autem ipse fecerit; aut verbo caetera, hunc autem manibus fecerit. Sed hoc excellit in homine, quia Deus ad imaginem suam hominem fecit, propter hoc quod ei dedit mentem intellectualem, qua praestat pecoribus; unde jam superiore loco disseruimus. In quo honore positus, si non intellexerit, ut bene agat, eisdem ipsis pecoribus quibus praelatus est comparabitur. Sic etenim scriptum est: Homo in honore positus non intellexit; comparatus est pecoribus insensatis, et similis factus est eis (Psal. XLVIII, 13). Nam et pecora Deus fecit, sed non ad imaginem suam. 22. Nec dicendum est, Hominem ipse fecit, pecora vero jussit, et facta sunt: et hunc enim et illa per Verbum suum fecit, per quod facta sunt omnia (Joan. I, 3). Sed quia idem Verbum et Sapientia et Virtus ejus est; dicitur et manus ejus, non visibile membrum, sed efficiendi potentia. Nam haec eadem Scriptura quae dicit quod Deus hominem de limo terrae finxerit, dicit etiam quod bestias agri de terra finxerit, quando eas cum volatilibus coeli ad Adam adduxit, ut videret quid ea vocaret. Sic enim scriptum est: Et finxit Deus adhuc de terra omnes bestias (Gen. I, 25). Si ergo et hominem de terra et bestias de terra ipse formavit, quid habet homo excellentius in hac re, nisi quod ipse ad imaginem Dei creatus est? Nec tamen hoc secundum corpus, sed secundum intellectum mentis, de quo post loquemur. Quanquam et in ipso corpore habeat quamdam proprietatem quae hoc indicet, quod erecta statura factus est, ut hoc ipso admoneretur non sibi terrena esse sectanda, velut pecora, quorum voluptas omnis ex terra est, unde in alvum cuncta prona atque prostrata sunt. Congruit ergo et corpus ejus animae rationali, non secundum lineamenta figurasque membrorum, sed potius secundum id quod in coelum erectum est, ad intuenda quae in corpore ipsius mundi superna sunt: sicut anima rationalis in ea debet erigi, quae in spiritualibus natura maxime excellunt, ut quae sursum sunt sapiat, non quae super terram (Coloss. III, 2).

Qua aetate aut statura conditus fuerit Adam. 23. Sed quomodo fecit eum Deus de limo terrae; utrum repente in aetate perfecta, hoc est virili atque juvenili, an sicut nunc usque format in uteris matrum? Neque enim alius haec facit, quam ille qui dixit, Priusquam te formarem in utero, novi te (Jerem. I, 5): ut illud tantum proprium habuerit Adam, quod non ex parentibus natus est, sed factus ex terra; eo tamen modo ut in hoc perficiendo, et per aetates augendo hi temporum numeri complerentur, quos naturae humani generis attributos videmus. An potius hoc non est requirendum? Utrumlibet enim fecerit, hoc fecit quod Deum et omnipotentem et sapientem posse ac facere congruebat. Ita enim certas temporum leges generibus qualitatibusque rerum in manifestum ex abdito producendis attribuit, ut ejus voluntas sit super omnia. Potentia quippe sua numeros creaturae dedit, non ipsam potentiam eisdem numeris alligavit. Nam Spiritus ejus ita faciendo mundo superferebatur (Gen. I, 2), ut et facto superferatur, non corporalibus locis, sed excellentia potestatis. 24. Quis enim nescit aquam concretam terrae, cum ad radices vitis venerit, duci in saginam ligni illius, atque in eo sumere qualitatem, qua in uvam procedat paulatim erumpentem; atque in ea grandescente vinum fiat, maturumque dulcescat, quod adhuc fervescat expressum, et quadam vetustate firmatum ad usum bibendi utilius jucundiusque perveniat? Num ideo Dominus lignum quaesivit aut terram, aut has temporum moras, cum aquam miro compendio convertit in vinum, et tale vinum quod ebrius etiam conviva laudaret (Joan. II, 9, 10)? Numquid adjutorio temporis eguit conditor temporis? Nonne certis dierum numeris suo cuique generi accommodatis, omnis natura serpentium coalescit, formatur, nascitur, roboratur? Num exspectati sunt hi dies, ut in draconem virga converteretur de manu Moysi et Aaron (Exod. VII, 10)? Nec ista cum fiunt, contra naturam fiunt, nisi nobis quibus aliter naturae cursus innotuit; non autem Deo, cui hoc est natura quod fecerit.

Rationes causales mundo primum inditae, cujus generis fuerint. 25. Quaeri autem merito potest, causales illae rationes, quas mundo indidit, cum primum simul omnia creavit, quomodo sint institutae: utrum ut, quemadmodum videmus cuncta nascentia vel fruticum vel animalium in suis conformationibus atque incrementis, sua pro diversitate generum diversa spatia peragerent temporum? an ut, quemadmodum creditur factus Adam sine ullo progressu incrementorum virili aetate, continuo conformarentur? Sed cur non utrumque illas credimus habuisse, ut hoc ex eis futurum esset, quod factori placuisset? Si enim illo modo dixerimus, incipiet contra ipsas factum videri, non solum etiam illud de aqua vinum, sed et omnia miracula quae contra naturae usitatum cursum fiunt: si autem isto modo, multo erit absurdius ipsas istas quotidianas naturae formas et species contra illas primarias omnium nascentium causales rationes suorum temporum peragere spatia. Restat ergo ut ad utrumque modum habiles creatae sint; sive ad istum quo usitatissime temporalia transcurrunt, sive ad illum quo rara et mirabilia fiunt, sicut Deo facere placuerit quod tempori congruat.

Primus homo non aliter quam primordiales causae haberent, formatus fuit. 26. Verumtamen sic factus est homo, quemadmodum illae primae causae habebant ut fieret primus homo, quem non ex parentibus nasci, qui nulli praecesserant, sed de limo formari oportebat, secundum causalem rationem, in qua primitus factus erat. Nam si aliter factus est, non eum Deus in illorum sex dierum operibus fecerat: in quibus cum dicitur factus, ipsam causam utique fecerat Deus, qua erat suo tempore homo futurus, et secundum quam fuerat ab illo faciendus, qui simul et consummaverat inchoata propter perfectionem causalium rationum, et inchoaverat consummanda propter ordinem temporum. Si ergo in illis primis rerum causis, quas mundo primitus Creator inseruit, non tantum posuit quod de limo formaturus erat hominem, sed etiam quemadmodum formaturus, utrum sicut in matris utero, an in forma juvenili; procul dubio sic fecit, ut illic praefixerat; neque enim contra dispositionem suam faceret: si autem vim tantum ibi posuit possibilitatis, ut homo fieret quoquo modo fieret, ut et sic et sic posset, id est ut id quoque ibi esset, quia et sic et sic posset; unum autem ipsum modum quo erat facturus in sua voluntate servavit, non mundi constitutioni contexuit: manifestum est etiam sic non factum esse hominem contra quam erat in illa prima conditione causarum; quia ibi erat etiam sic fieri posse, quamvis non ibi erat ita fieri necesse esse: hoc enim non erat in conditione creaturae, sed in placito Creatoris, cujus voluntas rerum necessitas est.

In rei natura est, ut quid esse possit; ut futurum sit, nonnisi in Dei voluntate. 27. Nam et nos pro captu infirmitatis humanae jam in ipsis rebus tempore exortis possumus nosse quid in cujusque natura sit, quod experimento perceperimus; sed utrum etiam futurum sit ignoramus. Est quippe in natura hujus, verbi gratia, juvenis ut senescat; sed utrum hoc etiam sit in Dei voluntate, nescimus. Sed nec in natura esset, nisi in Dei voluntate prius fuisset, qui condidit omnia. Et utique occulta ratio est senectutis in corpore juvenili, vel juventutis in corpore puerili: neque enim oculis cernitur, sicut ipsa in puero pueritia, sicut juventus in juvene; sed alia quadam notitia colligitur inesse in natura quiddam latens, quo educantur in promptu numeri occulti, vel juventutis a pueritia, vel senectutis a juventute. Occulta est ergo ista ratio, qua fit ut hoc esse possit, sed oculis; menti autem non est occulta: utrum autem hoc etiam necesse sit, omnino nescimus. Et illam quidem qua fit ut esse possit, esse in natura ipsius corporis novimus: illam vero qua fit ut necesse sit, manifestum est illic non esse.

Ex futuris quaenam vere futura. 28. Sed fortassis in mundo est, ut necesse sit istum hominem senescere. Si autem nec in mundo est, in Deo est. Hoc enim necessario futurum est quod ille vult, et ea vere futura sunt quae ille praescivit. Nam multa secundum inferiores causas futura sunt; sed si ita sunt et in praescientia Dei, vere futura sunt: si autem ibi aliter sunt, ita potius futura sunt, sicut ibi sunt, ubi qui praescit, falli non potest. Nam futura dicitur senectus in juvene, sed tamen futura non est, si ante moriturus est: hoc autem ita erit, sicut se habent aliae causae, sive mundo contextae, sive in Dei praescientia reservatae. Nam secundum quasdam futurorum causas moriturus erat Ezechias, cui Deus addidit quindecim annos ad vitam (Isai. XXXIII, 5); id utique faciens quod ante constitutionem mundi se facturum esse praesciebat, et in sua voluntate servabat. Non ergo id fecit quod futurum non erat: hoc enim magis erat futurum, quod se facturum esse praesciebat. Nec tamen illi anni additi recte dicerentur, nisi aliquid adderetur, quod se aliter in aliis causis habuerat. Secundum aliquas igitur causas inferiores jam vitam finierat: secundum illas autem quae sunt in voluntate et praescientia Dei, qui ex aeternitate noverat quid illo tempore facturus erat (et hoc vere futurum erat), tunc erat finiturus vitam quando finivit vitam. Quia etsi oranti concessum est, etiam sic eum oraturum ut tali orationi concedi oporteret ille utique praesciebat, cujus praescientia falli non poterat: et ideo quod praesciebat, necessario futurum erat.

Colligitur Adamum non formatum fuisse contra quam erat in primordialibus causis institutum. 29. Quapropter, si omnium futurorum causae mundo sunt insitae, cum ille factus est dies, quando Deus creavit omnia simul; non aliter Adam factus est, cum de limo formatus est, sicut est credibilius jam perfectae virilitatis, quam erat in illis causis, ubi Deus hominem in sex dierum operibus fecit. Ibi enim erat non solum ut ita fieri posset, verum etiam ut ita eum fieri necesse esset. Tam enim non fecit Deus contra causam, quam sine dubio volens praestituit, quam contra voluntatem suam non facit. Si autem non omnes causas in creatura primitus condita praefixit, sed aliquas in sua voluntate servavit; non sunt quidem illae quas in sua voluntate servavit, ex istarum quas creavit necessitate pendentes: non tamen possunt esse contrariae quas in sua voluntate servavit, illis quas sua voluntate instituit; quia Dei voluntas non potest sibi esse contraria. Istas ergo sic condidit, ut ex illis esse illud, cujus causae sunt, possit; sed non necesse sit: illas autem sic abscondit, ut ex eis esse necesse sit hoc, quod ex istis fecit ut esse possit.

Adamo non spirituale sed animale corpus a Deo formatum esse. 30. Solet item quaeri, utrum animale corpus prius homini formatum sit e limo, quale nunc habemus, an spirituale, quale resurgentes habebimus. Quanquam enim hoc in illud mutabitur; seminatur enim corpus animale, surget corpus spirituale: tamen quid prius homini factum sit, ideo disceptatur, quia si animale factum est, non hoc recipiemus, quod in illo perdidimus, sed tanto melius quanto spirituale animali praeponendum est, quando erimus aequales Angelis Dei (Matth. XXII, 30). Sed Angeli possunt aliis et justitia praeponi; numquid et Domino? De quo tamen dictum est: Minorasti eum paulo minus ab Angelis (Psal. VIII, 6). Unde, nisi propter carnis infirmitatem quam sumpsit ex Virgine, formam servi accipiens (Philipp. II, 7), in qua moriens nos a servitute redimeret? Sed quid hinc diutius disseramus? Non enim obscura est Apostoli sententia de hac re; qui cum voluisset adhibere testimonium, quo probaret esse corpus animale, non tam de suo vel de cujusquam hominis corpore, quod in praesenti videbatur, quam de hoc ipso Scripturae hujus loco recoluit et adhibuit, dicens: Si est corpus animale, est et spirituale; sic etenim scriptum est: Factus est primus homo Adam in animam viventem; novissimus Adam in spiritum vivificantem. Sed non primum quod spirituale est, sed quod animale; postea, spirituale. Primus homo de terra, terrenus; secundus homo de coelo, coelestis. Qualis terrenus, tales et terreni; et qualis coelestis, tales et coelestes. Et quomodo induimus imaginem terreni, induamus et imaginem ejus qui de coelo est (I Cor. XV, 44-49). Quid ad hoc dici potest? Imaginem ergo coelestis hominis nunc ex fide portamus, habituri in resurrectione quod credimus: imaginem autem terreni hominis ab ipso exordio humanae generationis induimus.

Difficultas contra superiorem sententiam. Opinio corpus Adami prius animale, postea spirituale factum fuisse in paradiso. 31. Hic occurrit alia quaestio, quomodo renovemur, si non ad hoc per Christum revocamur, quod in Adam prius eramus. Quanquam enim multa non in pristinum, sed in melius renoventur, ab inferiore tamen statu, quam quo erant antea, renovantur. Unde ergo ille filius mortuus erat, et revixit; perierat, et inventus est (Luc. XV, 32): unde illi profertur stola prima, si non immortalitatem recipit, quam perdidit Adam! Quomodo autem perdidit immortalitatem, si corpus habuit animale? Neque enim animale corpus, sed spirituale erit, cum corruptibile hoc induerit incorruptionem, et mortale hoc induerit immortalitatem (I Cor. XV, 53). Nonnulli his angustiis coarctati, ut et illa constet sententia qua exemplum de animali corpore hinc datum est, ut diceretur, Factus est primus homo Adam in animam viventem, novissimus Adam in spiritum vivificantem; et ista renovatio receptioque immortalitatis, non absurde dicatur in pristinum futura, in illud scilicet quod Adam perdidit: putaverunt prius quidem hominem fuisse corporis animalis; sed dum in paradiso constitutus est, eum fuisse mutatum, sicut nos quoque resurrectione mutabimur. Hoc quidem liber Geneseos non commemorat; sed ut possint utraque testimonia Scripturarum inter se consentire, sive illud quod de animali corpore dictum est, sive illa quae de renovatione nostra plurima in sanctis Litteris reperiuntur, hoc tanquam necessario consequi crediderunt.

Exploditur illa opinio. 32. Sed si ita est, frustra conamur paradisum et illas arbores earumque fructus, praeter figuratam significationem, prius accipere ad rerum gestarum proprietatem. Quis enim credat jam illius modi cibos ex arborum pomis immortalibus et spiritualibus corporibus necessarios esse potuisse? Verumtamen si aliud non potest inveniri, melius eligimus paradisum spiritualiter intelligere, quam vel putare non renovari hominem, cum toties hoc Scriptura commemoret; vel eum existimare recipere quod non ostenditur amisisse. Huc accedit quod et ipsa mors hominis, quam eum peccato commeruisse, multa divina testimonia colloquuntur, indicat eum sine morte futurum fuisse, nisi peccasset. Quomodo ergo sine morte mortalis? aut quomodo non mortalis, si corpus animale?

Adamum peccato mortem animae, non corporis meruisse, quidam non recte arbitrantes. 33. Unde quidam non eum mortem corporis peccato meruisse arbitrantur, sed mortem animae, quam fecit iniquitas. Nam credunt eum, propter corpus animale, exiturum fuisse de hoc corpore, ad requiem scilicet quam nunc habent sancti qui jam dormierunt, et in fine saeculi eadem membra immortaliter recepturum; ut videlicet mors corporis non de peccato accidisse videatur, sed naturaliter, ut animalium caeterorum. Verum his rursus Apostolus occurrit et dicit: Corpus quidem mortuum est propter peccatum, spiritus autem vita est propter justitiam. Si autem Spiritus ejus qui suscitavit Christum a mortuis habitat in vobis; qui suscitavit Christum a mortuis, vivificabit et mortalia corpora vestra per inhabitantem Spiritum ejus in vobis (Rom. VIII, 10, 11). Ac per hoc mors etiam corporis de peccato est. Si ergo non peccasset Adam, nec corpore moreretur; ideoque immortale haberet et corpus. Quomodo ergo immortale, si animale?

In eos qui dicunt Adae corpus ex animali spirituale factum in paradiso. 34. Sed rursus non vident, qui ejus corpus in paradiso mutatum putant, ut ex animali fieret spirituale, nihil impedire, si non peccasset, ut post paradisi vitam, quam juste obedienterque vixisset, acciperet eamdem corporis mutationem in vita aeterna, ubi jam cibis corporalibus non egeret. Quid ergo necesse est propter hoc jam cogi figurate, non proprie paradisum intelligere, quia non posset mori corpus nisi peccato? Verum est quidem quod non moreretur etiam corpore, nisi peccasset; aperte quippe dicit Apostolus, Corpus mortuum propter peccatum: animale tamen posset esse ante peccatum, et post vitam justitiae, cum Deus vellet, fieri spirituale.

In renovatione quomodo id recipimus, quod Adam perdidit. 35. Quomodo ergo, inquiunt, renovari dicimur, si non hoc recipimus, quod perdidit primus homo, in quo omnes moriuntur? Hoc plane recipimus secundum quemdam modum, et non hoc recipimus secundum quemdam modum. Non itaque immortalitatem spiritualis corporis recipimus, quam nondum habuit homo; sed recipimus justitiam, ex qua per peccatum lapsus est homo. Renovabimur ergo a vetustate peccati, non in pristinum corpus animale, in quo fuit Adam, sed in melius, id est in corpus spirituale, cum efficiemur aequales Angelis Dei (Matth. XXII, 30), apti coelesti habitationi, ubi esca quae corrumpitur non egebimus. Renovamur ergo spiritu mentis nostrae (Ephes. IV, 23) secundum imaginem ejus qui creavit nos, quam peccando Adam perdidit. Renovabimur autem etiam carne, cum hoc corruptibile induetur incorruptione, ut sit spirituale corpus; in quod nondum mutatus, sed mutandus erat Adam, nisi mortem etiam corporis animalis peccando meruisset. 36. Denique non ait Apostolus, Corpus quidem mortale propter peccatum; sed, Corpus mortuum propter peccatum.

Adae corpus mortale simul et immortale. Illud quippe ante peccatum, et mortale secundum aliam, et immortale secundum aliam causam dici poterat: id est mortale, quia poterat mori; immortale, quia poterat non mori. Aliud est enim non posse mori, sicut quasdam naturas immortales creavit Deus: aliud est autem posse non mori, secundum quem modum primus creatus est homo immortalis; quod ei praestabatur de ligno vitae, non de constitutione naturae: a quo ligno separatus est cum peccasset, ut posset mori, qui nisi peccasset posset non mori. Mortalis ergo erat conditione corporis animalis, immortalis autem beneficio Conditoris. Si enim corpus animale, utique mortale, quia et mori poterat; quamvis et immortale, ideo quia et non mori poterat. Neque enim immortale quod mori omnino non possit, erit nisi spirituale, quod nobis futurum in resurrectione promittitur. Ac per hoc illud animale et ob hoc mortale, quod propter justitiam spirituale fieret et ob hoc omni modo immortale, factum est propter peccatum non mortale, quod et antea erat, sed mortuum, quod posset non fieri, si homo non peccasset.

Corpus Adae et nostrum diversa. 37. Quomodo ergo corpus nostrum dicit Apost. mortuum, cum adhuc de viventibus loqueretur, nisi quia jam ipsa conditio moriendi ex peccato parentum haesit in prole? Animale est enim et hoc corpus, sicut et primi hominis fuit; sed hoc jam in ipso animalis genere multo est deterius: habet enim necessitatem moriendi, quod illud non habuit. Quamvis enim restabat adhuc ut immutaretur, et spirituale factum plenam immortalitatem perciperet, ubi cibo corruptibili non egeret; tamen si juste viveret homo, et in spiritualem habitudinem corpus ejus mutaretur, non iret in mortem. In nobis autem etiam juste viventibus, corpus moriturum est; propter quam necessitatem, ex illius primi hominis peccato venientem, non mortale, sed mortuum corpus nostrum dixit Apostolus, quia omnes in Adam morimur (Rom. V, 12; et I Cor. XV, 22). Item dicit: Sicut est veritas in Jesu, deponere vos secundum priorem conversationem hominem veterem; eum qui corrumpitur secundum concupiscentias deceptionis; hoc est, factus Adam per peccatum. Vide ergo quid sequatur: Renovamini autem spiritu mentis vestrae, et induite novum hominem; eum qui secundum Deum creatus est, in justitia et sanctitate veritatis (Ephes. IV, 21-24): ecce quod perdidit Adam per peccatum.

Quomodo mente et corpore ad id renovamur, quod Adam perdidit. In hoc ergo renovamur, secundum id quod amisit Adam, id est secundum spiritum mentis nostrae: secundum autem corpus quod seminatur animale, et resurget spirituale, in melius renovabimur, quod nondum fuit Adam.

38. Dicit item Apostolus: Exspoliantes vos veterem hominem cum actibus ejus, induite novum qui renovatur in agnitionem Dei, secundum imaginem ejus qui creavit eum (Coloss. III, 9, 10). Hanc imaginem in spiritu mentis impressam perdidit Adam per peccatum; quam recipimus per gratiam justitiae; non spirituale atque immortale corpus, in quo ille nondum fuit, et in quo erunt omnes sancti resurgentes a mortuis: hoc enim praemium est illius meriti, quod amisit. Proinde illa stola prima (Luc. XV, 22), aut ipsa justitia est unde lapsus est; aut, si indumentum corporalis immortalitatis significat, etiam hanc ille sic amisit, cum propter peccatum ad eam pervenire non potuit. Dicitur enim et amisisse uxorem, et amisisse honorem, qui speratum non acceperit, illo a quo sperabat offenso.

Adam licet spiritualis mente, corpore fuit animalis etiam in paradiso. 39. Secundum hanc ergo sententiam corpus animale habuit Adam, non tantum ante paradisum, sed etiam in paradiso constitutus: quamvis in interiore homine fuerit spiritualis, secundum imaginem ejus qui creavit eum; quod amisit peccando, meruitque etiam corporis mortem, qui non peccando mereretur et in corpus spirituale commutationem. Nam si et interius animaliter vixit, non possumus dici ad hoc ipsius renovari. Quibus enim dicitur, Renovamini spiritu mentis vestrae, hoc eis dicitur, ut spirituales fiant: quod si ille nec in ipsa mente fuit, quomodo nos renovamur ad id quod homo nunquam fuit? Apostoli autem et omnes justi animale utique corpus adhuc habebant, sed tamen spiritualiter interius vivebant; renovati scilicet in agnitionem Dei, secundum imaginem ejus qui creavit eos: non ideo tamen jam peccare non poterant, si consentirent iniquitati. Nam et spirituales posse cadere in tentatione peccati, ostendit Apostolus, ubi ait, Fratres, si praeoccupatus fuerit homo in aliquo delicto, vos qui spirituales estis, instruite hujusmodi in spiritu lenitatis, intendens te ipsum, ne et tu tenteris (Galat. VI, 1). Hoc dixi, ne cuiquam impossibile videatur quod peccavit Adam, si spiritualis erat mente, quamvis animalis esset corpore. Quae cum ita sint, nihil tamen adhuc praepropere confirmamus, sed exspectamus potius utrum etiam caetera Scriptura hunc intellectum non impediat.

De anima tractandum in sequenti libro. 40. Sequitur enim quaestio de anima valde difficilis, in qua multi laboraverunt, nobisque ubi laboremus reliquerunt. Sive enim quia non omnium omnia legere potui, qui de hac re secundum Scripturarum nostrarum veritatem ad aliquid liquidum minimeque dubium pervenire potuerunt; sive quia tanta quaestio est, ut etiam qui eam veraciter solvunt, non facile intelligantur a talibus, qualis ipse sum: fateor neminem adhuc mihi persuasisse quod sic habeam de anima, ut nihil amplius quaerendum putem. Utrum autem nunc certum aliquid inventurus sim et deliniturus, ignoro. Quod autem potuero, si conatum meum Dominus adjuverit, sequenti volumine explicare curabo.\
