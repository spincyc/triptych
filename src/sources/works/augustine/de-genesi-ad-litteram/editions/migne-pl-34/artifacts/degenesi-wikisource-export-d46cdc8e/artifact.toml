notes = "The pages carry the Corpus Corporum encoding note recording that the file was encoded in TEI XML for the University of Zurich's Corpus Corporum project by Ph. Roelli in 2013 from Migne's Patrologia Latina tomus 34. That is the encoder's statement about the file and is not part of Migne; the transformation below removes it. This retrieval also settles, in the opposite direction from the earlier finding, that PL 34 is reachable as keyed text and not only as the Internet Archive's corrupt scan."
