rights_basis = "Augustine's Latin is of the fifth century and Migne's printing is of 1841, so the text beneath these bytes is in the public domain everywhere. The bytes themselves are the wiki source of a Latin Wikisource transcription, and Latin Wikisource contributions are licensed CC BY-SA 4.0 — a condition on the contributors' markup rather than on Migne's text under it. The exact bytes are therefore hashed and recorded but not retained here, and only the printed Latin reaches the tracked derivative."
rights_jurisdiction = "United States"
source_url = "https://la.wikisource.org/wiki/Special:Export"
provenance = "Retrieved 2026-08-01 in one request, by POSTing the complete page list to Latin Wikisource's Special:Export with curonly=1, so all twelve books arrived as a single document rather than a book at a time. The document holds 12 pages, which is every book of the work; the current revision of each at retrieval was 230413 to 230424 for books I to XII in order. No model stood anywhere in the retrieval path: the bytes were fetched with curl, hashed, and read locally. Latin Wikisource states its contributor licence through its own API as Creative Commons Attribution-Share Alike 4.0, read and hashed before any payload was kept. Wikisource is a mutable witness, so this artifact identifies a dated state of it and not a stable republication."
