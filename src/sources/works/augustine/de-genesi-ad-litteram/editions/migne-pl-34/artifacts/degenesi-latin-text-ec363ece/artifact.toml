derived_from = "artifact.augustine.de-genesi-ad-litteram.migne-pl-34.degenesi-wikisource-export-d46cdc8e"
transformation = "python3 scripts/migne_transcribe.py <export> --unit page --out de-genesi-ad-litteram.txt, run over the exact bytes of the parent artifact. The script removes every wiki template whole by counting braces, the Patrologia Latina navigation line, the Corpus Corporum encoding note, categories, footnote bodies, comments, tags and wiki headings; unwraps links; folds typographic punctuation to ASCII; strips Migne's inline column markers; normalises to NFC; collapses runs of whitespace; and writes one LF-terminated UTF-8 line per source paragraph, prefixed by a braced book-and-chapter locator taken from the printing's own CAPUT divisions."
encoding = "utf-8"
indexable = true
notes = "Keyed text, not OCR, and that distinction is the whole finding here. guidance/catena.md records that Migne PL 34's Internet Archive text layer corrupts roughly one word in eight and concluded that \"the unencumbered Latin is OCR wreckage and the clean Latin is encumbered\". That is true of the scan and false of the volume: this is the University of Zurich's Corpus Corporum TEI encoding of the same columns, keyed rather than scanned, republished on Latin Wikisource under a stated CC BY-SA 4.0 markup licence over a public-domain printing. This is a transcription of a web witness of the 1841 printing and not a collation against the printed column, so no passage taken from it rises above inspected."
