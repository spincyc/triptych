provenance = "Derived on 2026-08-01 from the hashed export above by the tracked script named in transformation. No model stood anywhere in the path: the bytes were fetched with curl, hashed, and transformed locally. The file holds 360 lines, one per printed paragraph. Book I stands at lines 1-24, II at 25-42, III at 43-67, IV at 68-108, V at 109-133, VI at 134-166, VII at 167-202, VIII at 203-231, IX at 232-252, X at 253-277, XI at 278-321 and XII at 322-360. Each line is prefixed by a braced locator giving the book and the chapter of Migne's own division; chapter 0 is the running head and the Maurist argument that stand before the first chapter of a book."
