context = "English through Thomas Aquinas’s Catena Aurea. I.12 is named. The compiler omits the initial leaven lemma, reorders woman/wisdom and leaven/love, then gives all three triads ending with Noe, Daniel and Job."
physical_line_ranges = [[3554, 3554]]
text = "Or, The leaven signifies love, because it causes activity and fermentation; by the woman He means wisdom. By the three measures He intends either those three things in man, with the whole heart, with the whole soul, with the whole mind; or the three degrees of fruitfulness, the hundred-fold, the sixty-fold, the thirty-fold; or those three kinds of men, Noe, Daniel, and Job."
