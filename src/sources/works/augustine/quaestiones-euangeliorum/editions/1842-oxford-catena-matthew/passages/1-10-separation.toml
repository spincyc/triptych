context = "English through Thomas Aquinas’s Catena Aurea. The second citation of I.10 translates the separation at harvest and the contrast between the offices of punishment and mercy, to the close of the question. It substitutes “the Law” for the king in the held Latin."
physical_line_ranges = [[3604, 3604]]
text = "That the tares are first separated, signifies that by tribulation the wicked shall be separated from the righteous; and this is understood to be performed by good Angels, because the good can discharge duties of punishment with a good spirit, as a judge, or as the Law, but the wicked cannot fulfil offices of mercy."
