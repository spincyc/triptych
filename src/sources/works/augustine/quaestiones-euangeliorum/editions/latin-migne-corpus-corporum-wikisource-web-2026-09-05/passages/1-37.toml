context = "Book I, question XXXVII, the whole answer on fleeing in winter or on the sabbath (physical line 42, headed by the printing's reference [Ib. XXIV, 20] under the book's title In Evangelium secundum Matthaeum, line 5, whose capitula list titles it Quod ait, Orate ne fiat fuga vestra hieme vel sabbato). Read with questions XXXVI (Mt 23:37) and XXXVIII (Mt 24:23-27) on either side: winter and sabbath are any hindrance that would hold the disciples back, rain or cold, or the sabbath on which a journey was not lawful; or else, that no one be found on that day in the sadness or the gladness of temporal things."
physical_line_ranges = [[42, 42]]
text = "Quod Dominus dixit, Orate ne fiat fuga vestra hieme vel sabbato, id est, ne impedimento aliquo detineamini: quia et hieme, imbribus vel frigore; et sabbato, in quo proficisci non licebat, impediebatur quis ab itinere. Vel aliud, ne in tristitia aut laetitia rerum temporalium quis inveniatur a die illa."
