notes = "Mechanically copied as one exact substring of retained raw line 43, omitting only the question numeral and the editor's bracketed Scripture reference that head the line ('XXXVIII. [Ib. XXIV, 23-27.]'); no word was retyped, modernized or supplied. The whole answer is retained: the line ends where question XXXIX begins on line 44. The printing's Migne column marker (1331), which the transcription carries inline before the word tanquam, is not Augustine's text; the passage is therefore copied as two exact ordered substrings of the same line, divided at that marker, and the marker alone is omitted. The wording is that of this dated digital transcription of Migne, PL 35; it was not collated with a page image of the printed column and is not presented as diplomatic. Augustine's own Latin, so no translator is involved. Registered 2026-11-16 by the source-registration stage of proper-study run 11c5af05fe374203 after the artifact's SHA-256 and byte size were recomputed and matched."
