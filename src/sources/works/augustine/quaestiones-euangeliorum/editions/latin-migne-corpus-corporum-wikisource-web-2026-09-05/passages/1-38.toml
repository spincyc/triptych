context = "Book I, question XXXVIII, the whole answer on the lightning that goes out from the east (physical line 43, headed by the printing's reference [Ib. XXIV, 23-27.]). Read with questions XXXVII (Mt 24:20) and XXXIX (Mt 24:32): east and west signify the whole world through which the Church was to be, beginning from Jerusalem; the Church is fittingly called lightning, which flashes from the clouds; here and there are the schisms that hold a part of the earth, and the chambers and the desert the hidden conventicles of heretics."
physical_line_ranges = [[43, 43]]
text = "Quod Dominus dicit, Sicut enim fulgur exit ab oriente, et pervenit usque ad occidentem; ita erit et adventus Filii hominis; orientis et occidentis nomine totum orbem voluit significare, per quem futura erat Ecclesia, incipiente Evangelio ab Jerusalem (Luc. XXIV, 47), secundum illum sensum quo dixit, Amodo videbitis Filium hominis venientem in nubibus (Matth. XXVI, 64). Convenienter enim Ecclesiam nunc fulgur nominavit, quod maxime solet emicare de nubibus. Constituta ergo auctoritate Ecclesiae per orbem terrarum clara atque manifesta, consequenter discipulos admonet, atque omnes fideles, et qui in eum credere voluerint, ne schismaticis atque haereticis credant. Unumquodque enim schisma, et unaquaeque haeresis, aut locum suum habet in orbe terrarum, partem aliquam tenens; aut obscuris atque occultis conventiculis curiositatem hominum decipit. Quo pertinet quod ait, Si quis vobis dixerit, Ecce hic est Christus, aut illic, quod significat terrarum partes et provinciarum: aut in penetralibus, aut in deserto, quod significat obscura et occulta conventicula haereticorum. Quod ergo dixit, ab oriente in occidentem perventurum adventum suum, contra illos valet qui per terrarum particulas nominantur, et dicunt apud se esse Christum. Quod autem ait, Sicut fulgur, contra illos valet, qui occulte congregant tanquam in penetralibus, et paucos tanquam in deserto: ad manifestationem quippe claritatemque pertinet Ecclesiae fulguris nomen, significans etiam noctem vel nubila saeculi hujus; tunc enim fulguris candor apparet."
