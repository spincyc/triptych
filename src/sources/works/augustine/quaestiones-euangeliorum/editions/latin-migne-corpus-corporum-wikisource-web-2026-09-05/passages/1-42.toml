context = "Book I, question XLII, the whole answer on the body and the eagles (physical line 47, headed by the printing's reference [Ib. XXIV, 28.]); the printing places it after questions on Mt 26 (XL-XLI). Read with questions XLI (Mt 26:15) and XLIII (Mt 26:29): the body is gathered to heaven, whither he raised the body taken in the man assumed, and it is called a carcass because he spoke these words when about to die; the eagles are the spiritual, who are fed as from his body by imitating his passion and humility."
physical_line_ranges = [[47, 47]]
text = "Quod Dominus dicit, Ubi fuerit corpus, illo congregabuntur aquilae; id est in coelum, quo hinc secum levavit corpus in homine suscepto: quod etiam cadaver ideo appellatum est, quia moriturus haec loquebatur. Illo congregabuntur aquilae, dictum est de spiritualibus, qui ejus passionem humilitatemque imitando, tanquam de ejus corpore saturantur. Corpus enim propter humilitatem pro nobis passionemque suscepit."
