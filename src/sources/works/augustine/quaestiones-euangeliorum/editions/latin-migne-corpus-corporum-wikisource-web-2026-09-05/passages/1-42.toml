notes = "Mechanically copied as one exact substring of retained raw line 47, omitting only the question numeral and the editor's bracketed Scripture reference that head the line ('XLII. [Ib. XXIV, 28.]'); no word was retyped, modernized or supplied. The whole answer is retained: the line ends where question XLIII begins on line 48. The question stands out of the gospel's order in the printing, after questions on Matthew 26; its own reference names Mt 24:28 and its lemma is that verse. The wording is that of this dated digital transcription of Migne, PL 35; it was not collated with a page image of the printed column and is not presented as diplomatic. Augustine's own Latin, so no translator is involved. Registered 2026-11-16 by the source-registration stage of proper-study run 11c5af05fe374203 after the artifact's SHA-256 and byte size were recomputed and matched."
