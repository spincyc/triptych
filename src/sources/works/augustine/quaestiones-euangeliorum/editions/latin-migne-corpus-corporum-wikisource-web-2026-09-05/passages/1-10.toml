notes = "Mechanically copied as one exact substring of retained raw line 15, omitting only the question numeral and the editor's bracketed Scripture reference that head the line ('X. [Ib. XIII, 25-30.]'); no word was retyped, modernized or supplied. The whole answer is retained: the line ends where question XI begins on line 16. The wording is that of this dated digital transcription of Migne, PL 35; it was not collated with a page image of the printed column and is not presented as diplomatic. Augustine's own Latin, so no translator is involved."
