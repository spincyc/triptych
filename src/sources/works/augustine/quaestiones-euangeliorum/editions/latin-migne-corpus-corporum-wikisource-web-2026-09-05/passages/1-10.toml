context = "Book I, question X, the whole answer on the tares (physical line 15, headed by the printing's reference [Ib. XIII, 25-30.] under the book's title In Evangelium secundum Matthaeum, line 5). Read with questions IX (Mt 13:13, 23) and XI (Mt 13:31) on either side: the answer names all uncleanness in the crop as tares, explains why the tares are separated first by the prior separation of the wicked in tribulation, and assigns that work to the good angels, since the good may perform the offices of punishment with a good mind."
physical_line_ranges = [[15, 15]]
text = "Omnis immunditia in segete, zizania dicuntur. Quod primo separata zizania dicuntur, quia tribulatione praecedente separabuntur impii a piis: quod per bonos Angelos intelligitur fieri; quia officia vindictae possunt implere boni bono animo, quomodo rex, quomodo judex; officia vero misericordiae mali implere non possunt."
