context = "Book I, question XXXIX, the whole answer on the parable of the fig tree (physical line 44, headed by the printing's reference [Ib. XXIV, 32.]). Read with questions XXXVIII (Mt 24:23-27) and XL (Mt 26:24): the fig tree is the human race; its branch grows tender when the sons of men advance through faith in Christ to spiritual fruits and the honour of adoption as sons of God shines in them."
