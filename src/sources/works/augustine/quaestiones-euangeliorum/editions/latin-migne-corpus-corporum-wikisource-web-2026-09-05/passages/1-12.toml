notes = "Mechanically copied as one exact substring of retained raw line 17, omitting only the question numeral and the editor's bracketed Scripture reference that head the line ('XII. [Ib. XIII, 33.]'); no word was retyped, modernized or supplied. The whole answer is retained: the line ends where question XIII begins on line 18. The three parenthetical references inside the answer are the printing's own and are kept as printed; the first, (Matth. XII, 37), stands so in this transcription although the words it marks are those of Mt 22:37. The wording is that of this dated digital transcription of Migne, PL 35; it was not collated with a page image of the printed column and is not presented as diplomatic. Augustine's own Latin, so no translator is involved."
