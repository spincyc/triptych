context = "Book I, question XII, the whole answer on the leaven (physical line 17, headed by the printing's reference [Ib. XIII, 33.] under the book's title In Evangelium secundum Matthaeum, line 5). Read with questions XI (Mt 13:31) and XIII (Mt 13:44) on either side: the woman is wisdom and the leaven love, which heats and rouses; the three measures are heart, soul and mind, or the hundred, sixty and thirtyfold, or the three kinds of men, Noah, Daniel and Job."
physical_line_ranges = [[17, 17]]
text = "Fermentum quod accepit mulier, et abscondit in farinae satis tribus: mulierem, sapientiam dicit: fermentum, dilectionem; quod fervefacit et excitat. In farinae autem satis tribus, vel tria illa in homine, Ex toto corde, et ex tota anima, et ex tota mente (Matth. XII, 37); vel tria illa fructifera, Centenum, sexagenum, tricenum (Id. XIII, 8, 23); vel tria illa genera hominum, Noe, Daniel et Job (Ezech. XIV, 14)."
