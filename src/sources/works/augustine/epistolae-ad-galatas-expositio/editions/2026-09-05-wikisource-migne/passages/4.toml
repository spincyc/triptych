text = "Miror quod sic tam cito transferimini ab eo, qui vos vocavit in gloriam Christi, in aliud Evangelium, quod non est aliud. Evangelium enim si aliud est, praeter id quod, sive per se, sive per aliquem Dominus dedit; jam nec Evangelium recte dici potest. Vigilanter autem, cum dixisset, transferimini ab eo qui vos vocavit; adjunxit, in gloriam Christi, quam volebant illi evacuare, quasi frustra venerit Christus, si jam circumcisio carnis atque hujusmodi opera Legis tantum valebant, ut per illa homines salvi fierent. Nisi aliqui sunt conturbantes vos, et volentes convertere Evangelium Christi. Non quemadmodum istos conturbant, ita etiam convertunt Evangelium Christi, quia manet firmissimum: sed tamen convertere volunt, qui ab spiritualibus ad carnalia revocant intentionem credentium. Illis enim ad ista conversis, manet Evangelium non conversum. Et ideo cum dixisset, conturbantes vos, non dixit, et convertentes, sed, volentes, inquit, convertere Evangelium Christi. Sed licet nos, aut angelus de coelo vobis evangelizaverit praeterquam quod evangelizavimus vobis, anathema sit. Veritas propter seipsam diligenda est, non propter hominem, aut propter angelum, per quem annuntiatur. Qui enim propter annuntiatores diligit eam, potest etiam mendacia diligere, si qua forte ipsi sua protulerint. Sicut praediximus, et nunc iterum dico, si quis vobis evangelizaverit praeterquam quod accepistis, anathema sit. Aut praesens hoc praedixerat, aut quia iteravit quod dixit, propterea voluit dicere, Sicut praediximus. Tamen ipsa iteratio saluberrime intentionem movet ad firmitatem retinendi eam, quae sic commendatur, fidem."
