context = "Complete numbered section 7 of Augustine's continuous Galatians exposition, with its own Galatians 1:13-14 lemma. The preceding and following numbered sections were inspected to establish the natural section boundary. The body is the exact retained Latin digital witness; its section/reference heading and PL column markers are omitted from the transcription, while all Latin words, punctuation and source-internal biblical citations are preserved."
physical_line_ranges = [[13, 13]]
text = "« Audistis enim conversationem meam aliquando in Judaismo, quia supra modum persequebar Ecclesiam Dei, et vastabam illam; et proficiebam in Judaismo supra multos coaetaneos meos in genere meo, abundantius aemulator existens paternarum mearum traditionum. » Si persequendo et vastando Ecclesiam Dei proficiebat in Judaismo, apparet contrarium esse Judaismum Ecclesiae Dei; non per illam spiritualem Legem quam acceperunt Judaei, sed per carnalem conversationem servitutis ipsorum. Et si aemulator, id est, imitator paternarum suarum traditionum persequebatur Paulus Ecclesiam Dei, paternae ipsius traditiones contrariae sunt Ecclesiae Dei, non autem Legis illius culpa est; Lex enim spiritualis est (Rom. VII, 14), nec carnaliter se cogit intelligi: sed illorum vitium est, qui et illa quae acceperunt, carnaliter sentiunt, et multa etiam sua tradiderunt, dissolventes, sicut Dominus dicit, mandatum Dei, propter traditiones suas (Matth. XV, 3)."
