text = "Paulus apostolus non ab hominibus, neque per hominem, sed per Jesum Christum, et Deum Patrem, qui suscitavit illum a mortuis; et qui mecum sunt omnes fratres, Ecclesiis Galatiae. Qui ab hominibus mittitur, mendax est; qui per hominem mittitur, potest esse verax, quia et Deus verax potest per hominem mittere: qui ergo neque ab hominibus, neque per hominem, sed per Deum mittitur, ab illo verax est, qui etiam per hominem missos veraces facit. Priores ergo Apostoli veraces, qui non ab hominibus, sed a Deo per hominem missi sunt, per Jesum Christum scilicet adhuc mortalem. Verax etiam novissimus Apostolus, qui per Jesum Christum totum jam Deum post resurrectionem ejus missus est. Priores sunt caeteri Apostoli per Christum adhuc ex parte hominem, id est mortalem: novissimus est Paulus apostolus, per Christum jam totum Deum, id est, omni ex parte immortalem. Sit ergo testimonii ejus aequalis auctoritas, in cujus honorem implet clarificatio Domini, si quid habebat ordo temporis minus. Ideo enim cum dixisset, Et Deum Patrem, addidit, qui suscitavit illum a mortuis; ut etiam ex hoc modo breviter jam a clarificato missum se esse commemoraret."
