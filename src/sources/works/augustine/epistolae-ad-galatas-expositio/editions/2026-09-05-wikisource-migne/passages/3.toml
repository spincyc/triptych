text = "Gratia vobis et pax a Deo Patre et Domino Jesu Christo. Gratia Dei est qua nobis donantur peccata, ut reconciliemur Deo; pax autem, qua reconciliamur Deo. Qui dedit semetipsum pro peccatis nostris, ut eximeret nos de praesenti saeculo maligno. Saeculum praesens malignum propter malignos homines, qui in eo sunt, intelligendum est: sicut dicimus et malignam domum, propter malignos inhabitantes in ea. Secundum voluntatem Dei et Patris nostri, cui est gloria in saecula saeculorum, Amen. Quanto igitur magis homines non debent arroganter ad seipsos referre, si quid operantur boni; quando et ipse Dei Filius in Evangelio, non gloriam suam se quaerere dixit (Joan. VIII, 50), neque voluntatem suam venisse facere, sed voluntatem ejus qui eum misit (Id. VI, 38)? Quam voluntatem gloriamque Patris nunc commemoravit Apostolus, ut ipse quoque Domini exemplo, a quo missus est, non se quaerere gloriam suam significaret, nec facere voluntatem suam in praedicatione Evangelii, sicut paulo post dicit: Si hominibus placerem, Christi servus non essem. (Galat. I, 10)."
