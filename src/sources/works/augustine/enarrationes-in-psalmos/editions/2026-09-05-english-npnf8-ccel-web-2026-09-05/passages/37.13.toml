context = "Augustine on Psalm 37 (Vulgate; English Psalm XXXVIII), section 13 as numbered in this translation: the heart' + chr(39) + 's desire as prayer without ceasing. Section 13 (CCEL lines 11315-11340) was read whole with the end of section 12; the quoted sentences run from For it is thy heart' + chr(39) + 's desire to the continuance of thy prayer."
physical_line_ranges = [[11319, 11329]]
text = "For it is thy heart's desire that is thy prayer; and if thy desire continues uninterrupted, thy prayer continueth also. For not without a meaning did the Apostle say, \"Pray without ceasing.\" Are we to be \"without ceasing\" bending the knee, prostrating the body, or lifting up our hands, that he says, \"Pray without ceasing\"? Or if it is in this sense that we say that we \"pray,\" this, I believe, we cannot do \"without ceasing.\" There is another inward kind of prayer without ceasing, which is the desire of the heart. Whatever else you are doing, if you do but long for that Sabbath, you do not cease to pray. If you would never cease to pray, never cease to long after it. The continuance of thy longing is the continuance of thy prayer."
