notes = "PAGE COLLATION, NOT VERIFICATION OF A REGISTERED PRINT ARTIFACT: on 2026-11-18 these CCEL lines were collated against printed page 107, left column (running head PSALM XXXVIII.), of A Select Library of the Nicene and Post-Nicene Fathers, volume VIII, Saint Augustin: Expositions on the Book of Psalms (New York: The Christian Literature Company, 1888; title page read on the image at PDF page 7, copyright 1888 on its verso), rendered at 200 dots per inch from PDF page 125 of the whole PDF of Internet Archive item expositionsonboo0000augu (SHA-256 ed10ab29a779cf36619874600509648915be0ea94c33545af2713d2ea3cc7540; 78,817,959 bytes; SHA-1 equal to the item's file listing; bytes not retained). Wording, spelling and punctuation of the quoted extent agree with the page; the page prints curly quotation marks and superscript footnote numbers where CCEL has straight quotes and bracketed markers [981]-[982], which the segments omit. No print-edition record of NPNF first series volume VIII exists, so that facsimile is not registered and the state stays inspected. Internet Archive item selectlibraryofn08auguuoft is the 1956 Eerdmans photolithoprinted reprint (title page and verso at PDF pages 5-6), not the 1888 printing, and was not used."
