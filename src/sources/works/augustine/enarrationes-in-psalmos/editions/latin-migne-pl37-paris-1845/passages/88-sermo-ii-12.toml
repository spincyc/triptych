context = "On Psalm 88:51, Augustine says that, although Christ lives and sits at the Father's right hand, Christians long bore reproaches and Christ's name itself was treated as their crime. He reads the Church as the once-reproached fruitful widow and the servants' keeping of reproaches 'in the bosom' as Christians bearing them inwardly without retaliating, praying when blasphemed."
artifact_page_ranges = [[63, 63]]
verified_on = "2026-08-21"
notes = "Read directly at PL 37, col. 1139, on artifact PDF p. 63 (the page spans cols. 1139-1140). Section 12 is wholly in col. 1139. This supports Augustine's ecclesial reception of the servants' reproach as suffering borne by Christians because of Christ; it does not itself establish the Psalm's composition date, original historical referent, or a formulary compiler's intention."
