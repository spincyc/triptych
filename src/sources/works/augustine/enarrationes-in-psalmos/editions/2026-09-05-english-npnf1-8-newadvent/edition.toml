notes = "Five separately served expositions, preserving host numbering and historic translation omissions. The library holds a Latin Migne PL 37 edition for Psalms 80–150; the lanes supplied no fresh Latin artifact for these loci. Psalms 39 and 46 are outside that PL 37 extent. Pairing search bound: source-registration checked the complete seven-lane receipt set and the existing source catalog under the work title and its recorded aliases. No counterpart-language retrieval was supplied; this stage may not fetch additional sources. This records a bounded acquisition gap, not a claim that no translation or original is lawfully available."
