notes = "A dated delivery state of a transcription of Migne, not a critical edition and not a collation against the printed column. Each page's own banner names the edition as \"Migne 1841\" and the source as the University of Zurich Corpus Corporum. The work is divided at la.wikisource into numbered parts of ten psalms each, and each part is registered as its own pair of artifacts: the exact wiki bytes, and the printed Latin derived from them. Migne's column numbers stand inline in the text as bare numerals and are retained; consumers needing a critical text must use the Corpus Christianorum edition, which was not consulted."
