context = "Psalm 84, Enarratio (sermo ad plebem), section 3, complete, headed [«vers.» 2.]. Read with sections 1-2 (the title In finem, filiis Core) and 4-6: the prophet sings of the future in words of past time, because with God what is to come is already done, as in Ps 21:17-19, which every reader recognises as the Gospel; so here, Benedixisti, Domine, terram tuam, as though he had already done it."
physical_line_ranges = [[77, 77]]
text = "3. [«vers.» 2.] Itaque cantat ei Propheta in futurum, et utitur verbis quasi jam praeteriti temporis; tanquam facta dicit, quae futura erant; quia apud Deum et quod futurum est, jam factum est. Ibi ergo Propheta videbat futura nobis, jam vero facta in illius providentia et praedestinatione certissima, quomodo dicit et in illo psalmo ubi omnes Christum agnoscunt; sic enim recitatur, tanquam Evangelium legatur: «Foderunt manus meas et pedes, dinumeraverunt omnia ossa mea; ipsi vero consideraverunt et conspexerunt me, diviserunt sibi vestimenta mea et super vestem meam miserunt sortem» (Psal. XXI, 17-19). Quis non, legente lectore Psalmum, agnoscat Evangelium? Et tamen cum diceretur in Psalmo, non dictum est, Fossuri sunt manus meas et pedes; sed, «foderunt manus meas et pedes:» nec dictum est, Dinumeraturi sunt ossa mea; sed, «dinumeraverunt ossa mea:» nec dictum est, Divisuri sunt vestimenta mea; sed, «diviserunt sibi vestimenta mea.» Haec omnia quae futura videbat Propheta, tanquam praeterita indicabat: sic et hic, «Benedixisti, Domine, terram tuam;» tanquam jam fecerit."
