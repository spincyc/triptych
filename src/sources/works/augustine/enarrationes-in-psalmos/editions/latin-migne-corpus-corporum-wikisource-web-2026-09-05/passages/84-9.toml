context = "Psalm 84, Enarratio (sermo ad plebem), section 9, complete, headed [«vers. 8.]. Read with sections 7-8 (vv. 6-7) and 10 (v. 9). Ostende nobis, Domine, misericordiam tuam is what the people sang; the converted sees his converter; to be shown God's mercy is to learn that every good is from him, so that one is not proud; the salutare is Christ, to be seen not as the Jews saw and crucified him but as the angels see him and rejoice (1 Jn 3:2)."
physical_line_ranges = [[83, 83]]
text = "9. [«vers. 8.] Ostende nobis, Domine, misericordiam tuam.» Hoc est quod cantavimus, et jam hinc diximus. «Ostende nobis, Domine, misericordiam tuam; et salutare tuum da nobis; salutare tuum,» Christum tuum. Felix est cui ostendit Deus misericordiam suam. Ipse est qui superbire non potest, cui Deus ostendit misericordiam suam. Ostendendo enim illi misericordiam suam, persuadet illi quia quidquid boni habet ipse homo, non habet nisi ab illo qui omne bonum nostrum est. Et cum viderit homo quidquid boni habet non se habere a se, sed a Deo suo; videt quia totum quod in illo laudatur, de misericordia Dei est, non de meritis ipsius: et videndo ista non superbit, non superbiendo non extollitur, non se extollendo non cadit, non cadendo stat, stando inhaeret, inhaerendo manet, manendo perfruitur, et laetatur in Domino Deo suo. Erunt illi deliciae ipse qui fecit illum; et delicias ipsas nemo corrumpit, nemo interpellat, nemo aufert. Quis potens minabitur auferre? quis vicinus malus, quis latro, quis insidiator tibi tollit Deum? Et potest tibi tollere totum quod possides corpore, non tibi tollit eum quem possides corde. Ipsa est misericordia, quam utinam Deus ostendat nobis, «Ostende nobis, Domine, misericordiam tuam; et salutare tuum da nobis:» Christum tuum da nobis: in illo est enim misericordia tua. Dicamus illi et nos: Da nobis Christum tuum. Jam quidem dedit nobis Christum suum: adhuc illi tamen dicamus, Da nobis Christum tuum; quia dicimus illi, «Panem nostrum quotidianum da nobis hodie» (Matth. VI, 11). Et quis est panis noster, nisi ipse qui dixit, «Ego sum panis vivus, qui de coelo descendi» (Joan. VI, 41)? Dicamus illi: Da nobis Christum tuum. Dedit enim nobis Christum, sed hominem: quem nobis dedit hominem, eum ipsum nobis daturus est Deum. Hominibus enim hominem dedit; quia talem illum dedit hominibus qualis posset capi ab hominibus: Deum enim Christum nullus hominum capere poterat. Factus est hominibus homo, servavit se Deum diis. An forte arroganter dixi? Revera arroganter, nisi ipse dixisset: «Ego dixi, Dii estis, et filii Altissimi omnes» (Psal. LXXXI, 6; et Joan. X, 34). Ad ipsam adoptionem renovamur, ut efficiamur filii Dei. Jam quidem sumus, sed per fidem: sumus quidem in spe, nondum sumus in re. «Spe enim salvi facti sumus,» sicut dicit Apostolus. «Spes autem quae videtur, non est spes: quod enim videt quis, quid sperat? Si autem quod non videmus speramus, per patientiam exspectamus» (Rom. VIII, 24, 25). Quid enim «exspectamus per patientiam,» nisi videre quod credimus? Modo enim credimus quod non videmus: permanendo in eo quod credentes non videmus, merebimur videre quod credimus. Propterea Joannes in Epistola sua quid ait? «Dilectissimi, filii Dei sumus, et nondum apparuit quid erimus.» Quis non exsultet, si subito nescio cui peregrinanti et ignoranti genus suum, patienti aliquam egestatem, et in aerumna et labore constituto diceretur: Filius senatoris es; pater tuus amplo patrimonio gaudet in re vestra; revoco te ad patrem tuum? quali gaudio exsultaret, si hoc non fallax promissor diceret? Venit ergo non fallax apostolus Christi, et ait: Quid est quod de vobis desperatis? quid est quod vos affligitis, et moerore conteritis? quid est quod concupiscentias vestras sequendo, in egestate istarum voluptatum conteri vultis? Habetis patrem, habetis patriam, habetis patrimonium. Quis est iste pater? «Dilectissimi, filii Dei sumus.» Quare ergo nondum videmus patrem nostrum? Quia «nondum apparuit quid erimus.» Jam sumus, sed in spe: nam «quid erimus, nondum apparuit.» Et quid erimus? «Scimus,» inquit, «quia cum apparuerit, similes ei erimus, quoniam videbimus eum sicuti est» (I Joan. III, 2). Sed hoc de Patre dixit, de Filio autem Domino Jesu Christo non dixit: et forte videndo Patrem, non Filium, crimus beati? Ipsum audi Christum: «Qui me vidit, vidit et Patrem.» Cum enim unus Deus videtur, Trinitas videtur, Pater et Filius et Spiritus sanctus. Audi expressius quia ipsius Filii visio tribuet nobis beatitudinem, et nihil interest inter visionem ipsius et visionem Patris. Ipse ait in Evangelio: «Qui diligit me, mandata mea custodit, et ego diligam illum, et ostendam meipsum illi» (Joan. XIV, 9, 21). Loquebatur illis, et dicebat, «ostendam meipsum illi.» Quare? Non erat ipse qui loquebatur? Sed carnem caro videbat; divinitatem cor non videbat. Ad hoc autem caro carnem vidit, ut per fidem cor mundaretur, unde Deus videretur. Dictum est enim de Domino, «Fide mundans corda eorum» (Act. XV, 9): et dixit Dominus, «Beati mundo corde, quia ipsi Deum videbunt» (Matth. V, 8). Ergo nobis promisit ostendere se nobis. Qualis est pulchritudo ejus, fratres, cogitate. Omnia ista pulchra quae videtis, quae amatis, ipse fecit. Si haec pulchra sunt, quid est ipse? si haec magna sunt, quantus est ipse? Ergo ex istis quae hic amamus, illum magis desideremus; et contemnentes ista, illum diligamus: ut ipsa dilectione per fidem cor mundemus, et mundatum cor nostrum inveniat aspectus illius. Lux quae nobis ostendetur, sanos nos debet invenire: hoc agit modo fides. Hoc ergo hic diximus. «Et salutare tuum da nobis:» da nobis Christum tuum, noverimus Christum tuum, videamus Christum tuum; non quomodo illum viderunt Judaei, et crucifixerunt, sed quomodo illum vident Angeli, et gaudent."
