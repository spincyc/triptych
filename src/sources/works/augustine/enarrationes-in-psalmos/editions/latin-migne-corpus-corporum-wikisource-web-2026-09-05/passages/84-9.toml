notes = "Copied mechanically, without retyping or normalization, from the whole LF-delimited line 83 of the hash-checked retained part-9 Latin artifact (SHA-256 and byte size 341,344 recomputed and matched on 2026-11-25). The whole numbered section is the line; the preceding and following sections stand on their own lines. The section's verse heading is the printing's. The wording is that of this dated digital transcription of Migne, PL 37; it was not collated with a page image of the printed column and is not presented as diplomatic. Augustine's own Latin, so no translator is involved. Registered 2026-11-25 by the source-registration stage of proper-study run 77c1ca91ef2d5e93."
