context = "Psalm 84, Enarratio (sermo ad plebem), section 13, complete, headed [«vers. 12.] Veritas de terra orta est, et justitia de coelo prospexit. Read with sections 12 and 14: the Incarnational exposition of Psalm 84:12 — Truth (the Son of God) sprang from earth (mortal flesh born of the Virgin Mary) so that He could offer the saving sacrifice of the Cross."
physical_line_ranges = [[87, 87]]
text = "13. [«vers. 12.] Veritas de terra orta est, et justitia de coelo prospexit. Veritas de terra orta est:» Christus de femina natus est. «Veritas de terra orta est:» Filius Dei de carne processit. Quid est veritas? Filius Dei. Quid est terra? Caro. Interroga unde natus est Christus, et vides quia «veritas de terra orta est.» Sed haec veritas quae orta est de terra, erat ante terram, et per ipsam factum est coelum et terra; sed ut justitia de coelo prospiceret, id est, ut justificarentur homines divina gratia, veritas nata est de Maria virgine; ut posset pro illis justificandis offerre sacrificium, sacrificium passionis, sacrificium crucis. Et unde offerret sacrificium pro peccatis nostris, nisi moreretur? unde autem moreretur, nisi a nobis acciperet ubi moreretur? Id est, nisi a nobis sumeret carnem mortalem, Christus mori non posset; quia Verbum non moritur, divinitas non moritur, Virtus et Sapientia Dei non moritur. Quomodo offerret sacrificium victimam salutarem, si non moreretur? quomodo autem moreretur, nisi carnem indueret? quomodo carnem indueret, nisi veritas de terra oriretur? «Veritas de terra orta est, et justitia de coelo prospexit.»"
