context = "Psalm 84, Enarratio, section 5, complete, headed [«vers.» 3, 4.]. Read with sections 4 and 6: how he turned back the captivity of Jacob is shown in Remisisti iniquitatem plebis tuae; the liberation is spiritual and within; iniquity held the captive, and iniquity remitted, you are freed; confess that you are in captivity, that you may be worthy to be freed; operuisti, that he might not see them so as to punish them."
physical_line_ranges = [[79, 79]]
text = "5. [«vers.» 3, 4.] Quomodo enim avertit captivitatem Jacob? Videte quia ista liberatio spiritualis est, videte quia intus agitur: «Remisisti,» inquit, «iniquitatem plebis tuae; operuisti omnia peccata eorum.» Ecce unde avertit captivitatem, quia remisit iniquitatem: iniquitas tenebat captivum, remissa iniquitate liberaris. Confitere ergo te esse in captivitate, ut dignus sis liberari: nam qui hostem suum non intellexit, quomodo invocat liberatorem? «Operuisti omnia peccata eorum.» Quid est, «operuisti?» Ut non illa videres. Quid est, ut non illa videres? Ut non in illa vindicares. Noluisti videre peccata nostra; et ideo non vidisti, quia ipsa videre noluisti: «Operuisti omni a peccata eorum. Sedasti omnem iram tuam; avertisti ab ira indignationis tuae.»"
