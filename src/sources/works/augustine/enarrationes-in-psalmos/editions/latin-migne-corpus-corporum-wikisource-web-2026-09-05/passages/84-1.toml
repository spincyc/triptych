context = "Psalm 84, Enarratio (sermo ad plebem), section 1, complete: the section number stands alone on line 74 and the section on line 75; section 2, on the title In finem, filiis Core, follows on line 76. Augustine opens the sermon on the verse the people had just sung, Ostende nobis misericordiam tuam et salutare tuum da nobis (84:8): God has already shown his mercy to the nations, and in giving his salutare he heals the eyes by which it is seen, being himself both the physician and the light."
physical_line_ranges = [[74, 75]]
text = "1. Deprecati sumus Dominum Deum nostrum, ut ostendat nobis misericordiam suam, et salutare suum det nobis. Dictum est hoc quidem in prophetia, cum primum Psalmi isti dicerentur et scriberentur: caeterum quod attinet ad hoc tempus, jam ostendit Dominus Gentibus misericordiam suam, et dedit eis salutare suum. Ille quidem ostendit; sed multi sanari nolunt, ut videant quod ostendit. Sed quia ipse sanat oculos cordis ad videndum se; propterea cum dixisset, «Ostende nobis misericordiam tuam,» tanquam multis caecis dicturis, Quomodo videbimus, cum coeperit ostendere? adjunxit, «Et salutare tuum da nobis.» Dando enim salutare suum, sanat in nobis unde possimus videre quod ostendit: non quomodo medicus homo ipse curat, ut lucem istam ostendat eis quos curaverit; et aliud est ista lux quam demonstraturus est, aliud autem ipse medicus qui curat oculos quibus ostendat lucem, quae lux non est ipse. Non ergo sic Dominus Deus noster: ipse est enim medicus qui curat unde videre possimus, et ipse est lux quam videre possimus. Totum tamen Psalmum breviter, quantum possumus, quantum donat Dominus, pro angustia temporis attenti curramus."
