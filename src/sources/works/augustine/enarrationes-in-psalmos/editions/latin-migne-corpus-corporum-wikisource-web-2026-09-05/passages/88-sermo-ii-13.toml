text = "13. [«vers. 52.] Quod exprobraverunt inimici tui, Domine:» et Judaei et Pagani. «Quod exprobraverunt:» quid exprobraverunt? «Commutationem Christi tui.» Hoc exprobraverunt, «commutationem Christi tui:» hoc enim objecerunt, quia mortuus est Christus, quia crucifixus est Christus. Quid objicitis insani? Quamvis jam nemo est qui objiciat; tamen si qui reliqui remanserunt, quid objicitis quia mortuus est Christus? Ille non perimebatur, sed commutabatur. Mortuus dicitur propter triduum. Ecce quid exprobraverunt inimici tui: non amissionem, non perditionem: sed plane «commutationem Christi tui.» Mutatus est ille a temporali vita ad aeternam, mutatus est a Judaeis ad Gentes, mutatus est etiam a terra in coelum. Eant nunc vani inimici tui, et adhuc exprobrent «commutationem Christi tui.» Utinam et ipsi mutentur; commutationem Christi non exprobrabunt. Sed displicet Christi mutatio, quia ipsi mutari nolunt: neque enim est illis commutatio, et non timuerunt Deum (Psal. LIV, 20). «Quod exprobraverunt inimici tui, commutationem Christi tui.»"
