context = "Psalm 84, Enarratio, section 4, complete, on Avertisti captivitatem Jacob, the second half of verse 2. Read with sections 3 and 5: all who imitate Abraham's faith belong to Jacob; the captivity from which we wish to be freed is not among barbarians but the law in the members warring against the law of the mind (Rom 7:22-25); it is said to Christ, who turned back our captivity by freeing us from our sins, through which Satan ruled us."
physical_line_ranges = [[78, 78]]
text = "4. «Avertisti captivitatem Jacob.» Populus ejus antiquus Jacob, populus Israel, natus de semine Abrahae, in repromissione futurus aliquando haeres Dei. Erat quidem ergo ille populus, cui datum est Testamentum Vetus; sed in Vetere Testamento figurabatur Testamentum Novum: illa figura erat, haec expressio veritatis. In illa autem figura secundum quamdam praenuntiationem futurorum, data est illi populo terra quaedam promissionis, in quadam regione ubi habitavit populus Judaeorum; ubi est etiam Jerusalem civitas, cujus nomen omnes audivimus. Hanc ergo terram cum accepisset ille populus, ab hostibus suis vicinis circumquaque inimicantibus multas molestias patiebatur: et cum peccabat in Deum suum, dabatur in captivitatem; non ad interitum, sed ad disciplinam; non damnante patre, sed flagellante. Et cum possessa esset, liberabatur, et aliquoties captivata est et liberata est illa gens: et modo in captivitate est, et hoc pro peccato magno, quod Dominum suum crucifixit. Quid igitur secundum istos accipimus, quod ait, «Avertisti captivitatem Jacob?» An forte intelligimus hic aliam captivitatem, de qua omnes nos volumus liberari? Nam omnes pertinemus ad Jacob, si pertinemus ad semen Abrahae. Hoc enim dicit Apostolus: «In Isaac vocabitur tibi semen; id est, non hi qui filii carnis, hi filii Dei, sed filii promissionis deputantur» «in semen» (Rom. IX, 7, 8). Si filii promissionis in semen deputantur, offendendo Deum Judaei degeneraverunt; nos promerendo Deum, de genere Abrahae facti sumus, non pertinentes ad carnem, sed pertinentes ad fidem. Imitati enim fidem, filii facti sumus: illi autem degenerando a fide, exhaeredari meruerunt. Nam, ut noveritis quia perdiderunt illud, quod nati erant de Abraham, cum se arroganter jactarent audiente Domino Jesu Christo, gloriantes de sanguine et non de vita, et dicerent Domino, «Nos patrem habemus Abraham;» ait illis Dominus tanquam degenerantibus: «Si filii Abrahae estis, facta Abrahae facite» (Joan. VIII, 39). Si ergo illi propterea jam non filii, quia non faciebant facta Abrahae; nos propterea filii, quia facimus facta Abrahae. Quae sunt facta Abrahae quae facimus? Credidit autem Abraham Deo, et deputatum est illi ad justitiam (Gen. XV, 6, et Galat. III, 6). Ergo omnes ad Jacob pertinemus, imitantes Abrahae fidem, qui credidit Deo, et deputatum est illi ad justitiam. Quae est ergo illa captivitas unde nos volumus liberari? puto enim neminem nostrum modo esse apud Barbaros, nec aliquam gentem irruisse armatam, et captivos duxisse nos. Sed modo ostendo quamdam captivitatem, in qua gemimus, et unde nos liberari cupimus. Paulus apostolus procedat, ipse illam dicat; sit ipse speculum nostrum, ille loquatur, et nos ibi videamus: nemo est enim qui non hic se agnoscat. Ait ergo ille beatus apostolus, «Condelector enim legi Dei secundum interiorem hominem;» intus delectat me lex Dei: «video autem aliam legem in membris meis, repugnantem legi mentis meae.» Jam audisti legem, audisti pugnam; captivitatem nondum audieras, audi quae sequuntur: «Repugnantem,» inquit, «legi mentis meae, et captivum me ducentem in lege peccati, quae est in membris meis.» Agnovimus captivitatem: quis nostrum est qui nolit se de ista captivitate liberari? Et unde liberabitur? Quoniam hoc cantavit ipse Psalmus futurum: «Avertisti captivitatem Jacob.» Cui dixit? Christo, propter «In finem,» propter filios Core: ille enim avertit captivitatem Jacob. Audi et ipsum Paulum confitentem. Cum diceret se trahi captivum a lege in membris suis repugnante legi mentis suae, exclamavit sub illa captivitate, et ait: «Infelix ego homo, quis me liberabit de corpore mortis hujus?» Quaesivit quis esset, et statim illi occurrit, «Gratia Dei per Jesum Christum Dominum nostrum» (Rom. VII, 22-25). De hac gratia Dei Propheta dicit huic Domino nostro Jesu Christo, «Avertisti captivitatem Jacob.» Attendite captivitatem Jacob, attendite quia hoc est, Avertisti captivitatem nostram: non liberando nos a Barbaris, in quos non incurrimus; sed liberando nos ab operibus malis, a peccatis nostris, per quae nobis satanas dominabatur. Si quis enim liberatus fuerit a peccatis suis, non habet unde illi dominetur princeps peccatorum."
