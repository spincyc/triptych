context = "Psalm 84, Enarratio (sermo ad plebem), section 14, complete, continuing the exposition of Psalm 84:12 ('Possumus hinc dicere alterum sensum'). Read with sections 13 and 15: the penitential exposition of 'Veritas de terra orta est' as human confession of sin, answered by God's pardoning justice looking down from heaven."
physical_line_ranges = [[88, 88]]
text = "14. Possumus hinc dicere alterum sensum. «Veritas de terra orta est:» confessio ab homine. Homo enim peccator eras. O terra, qui quando peccasti, audisti, «Terra es, et in terram ibis» (Gen. III, 19), oriatur de te veritas, ut respiciat de coelo justitia. Quomodo a te oritur veritas, cum tu peccator sis, cum tu iniquus sis? Confitere peccata tua, et orietur de te veritas. Si enim cum sis iniquus, dicis te justum, quomodo a te veritas oriretur? Si autem cum sis iniquus, dicis te iniquum; «veritas de terra orta est.» Intende illum Publicanum longe a Pharisaeo in templo orantem, qui neque oculos ad coelum audebat levare, sed percutiebat pectus suum, dicens, «Domine, propitius esto mihi peccatori:» ecce «veritas de terra orta est,» quia confessio peccatorum ab homine facta est. Quid ergo sequitur? «Amen dico vobis, quia descendit justificatus Publicanus ille magis quam ille Pharisaeus: quia omnis qui se exaltat, humiliabitur; et qui se humiliat, exaltabitur» (Luc. XVIII, 13, 14). «Orta est veritas de terra,» in confessione peccatorum; «et justitia de coelo prospexit,» ut descenderet justificatus Publicanus ille magis quam ille Pharisaeus. Nam ut noveritis quia veritas pertinet ad confessionem peccatorum, ait Joannes evangelista: «Si dixerimus quia peccatum non habemus, nos ipsos seducimus, et veritas in nobis non est.» Quomodo ergo veritas de terra oritur, ut justitia de coelo prospiciat, audi illum sequentem et dicentem: «Si confiteamur peccata nostra, fidelis est et justus, ut remittat nobis peccata, et purget nos ab omni iniquitate» (I Joan. I, 8, 9). «Veritas» ergo «de terra orta est, et justitia de coelo prospexit.» Quae «justitia de coelo prospexit?» Tanquam Dei dicentis: Parcamus huic homini, quia ipse sibi non pepercit; ignoscamus, quia ipse agnoscit. Conversus est ad puniendum peccatum suum; convertar et ego ad eum liberandum. «Veritas de terra orta est, et justitia de coelo prospexit.»"
