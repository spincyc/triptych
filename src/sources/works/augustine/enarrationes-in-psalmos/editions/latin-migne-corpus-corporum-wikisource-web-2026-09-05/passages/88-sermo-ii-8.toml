text = "8. [«vers.» 47.] Videamus ergo utrum impleat Deus promissa sua. Post haec dura quae commemoravit evenisse illi populo et illi regno, ne ibi putaretur Deus implevisse quod promiserat, et non daret alterum regnum in Christo, cujus regni non erit finis; alloquitur eum Propheta, et dicit: «Quousque, Domine, averteris in finem?» Forte enim non in finem et ab ipsis; quia caecitas ex parte Israel facta est, ut plenitudo Gentium intraret, et sic omnis Israel salvus fieret (Rom. XI, 25). Interea tamen, «Exardescet sicut ignis ira tua»"
