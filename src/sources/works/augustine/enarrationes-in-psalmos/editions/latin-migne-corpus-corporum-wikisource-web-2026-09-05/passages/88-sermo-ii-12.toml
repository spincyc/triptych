notes = "Copied mechanically, without retyping or normalization, from the whole LF-delimited line 190 of the hash-checked retained part-9 Latin artifact. Read section 12 in the context of the Sermo II heading and sections 11-14. Compared the complete paragraph directly with PL 37, col. 1139, PDF page 63 of artifact.jacques-paul-migne.patrologia-latina-volume-37.paris-1845.internet-archive-google-pdf-afe6878f after retrieving the complete PDF and matching its registered SHA-256 afe6878f6241d34824942b0f057537b208f67978d36c94cbf251d9b0de397bb4. The lexical text agrees; the web transcription has its own quotation punctuation, expands print line-break hyphenation, and omits the apparatus marker after loquitur and the footnote beneath the column. This is the identified web transcription checked against the historical printing, not a diplomatic facsimile transcription or a modern critical text. The existing page-only passage passage.augustine.enarrationes-in-psalmos.latin-migne-pl37-paris-1845.88-sermo-ii-12 identifies the same locus under the print edition and must not be admitted as a second independent commentary witness. Composition-date evidence: the complete Augustinian Tavola cronologica at https://www.augustinus.it/italiano/esposizioni_salmi/tavola_cronologica.htm, retrieved and read 2026-10-23, row 88, s. 1-2, reports Zarb 411-412 at Hippo and Rondet 411 at Carthage. Its notes identify S. Zarb, Chronologia Enarrationum S. Augustini in Psalmos (Malta, 1948), pp. 253-256, and H. Rondet, Notes de exegese augustinienne, Recherches de Science religieuse 39 (1951), pp. 472-477. Those studies were not themselves consulted. A bounded 411-412 dating is therefore a sourced chronology-table proposal; the place remains disputed. It dates this discourse, not the entire Enarrationes collection or the Migne printing."
