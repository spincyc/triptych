physical_line_ranges = [[190, 190]]
text = "12. [«vers. 51.] Memento, Domine, opprobrii, servorum tuorum.» Jam illo vivente, jam in coelo ad dexteram Patris sedente, opprobria objecta sunt Christianis: crimen de Christo Christiani diu habuerunt. Vidua illa pariens, et habens filios abundantiores quam illa quae habebat virum (Isai. LIV, 1; Galat. IV, 27), audivit ignominias, audivit opprobria: sed Ecclesia multiplicata, extendens in dexteram atque sinistram, ignominiae viduitatis suae jam non est memor. «Memento, Domine,» apud quem est abundantia suavitatis memoriae tuae; «Memento,» noli oblivisci. Quid, «Memento? Memento opprobrii servorum tuorum, quod continui in sinu meo multarum gentium.» Ibam, inquit, praedicare, et opprobria audiebam, et in sinu meo continebam; quia implebam, «Blasphemamur, rogamus; quasi purgamenta mundi facti sumus, omnium peripsema» (I Cor. IV, 13). Diu continuerunt Christiani opprobria in sinu suo, in corde suo; nec audebant resistere conviciantibus: antea cum crimen videretur respondere pagano, nunc jam crimen est remanere paganum. Gratias Domino; memor fuit opprobriorum nostrorum: exaltavit cornu Christi sui, fecit admirabilem apud reges terrae. Jam modo nemo insultat Christianis, aut si insultat, non publice insultat: sic loquitur, ut plus timeat audiri, quam velit credi. «Quod continui in sinu meo multarum gentium.»"
