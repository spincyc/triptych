context = "Psalm 84, Enarratio (sermo ad plebem), section 15, complete, headed [«vers. 13.]. Read with section 14 (a second sense of v. 12) and 16 (v. 14). Unus versus restat: Etenim Dominus dabit suavitatem, et terra nostra dabit fructum suum. God gives the sweetness of doing right, so that what once delighted now repels; the preacher sows the word and only God's rain makes it spring up; the section ends by repeating the verse in the form Quoniam Dominus dabit suavitatem."
