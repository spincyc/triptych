text = "15. [«vers. 13.] Etenim Dominus dabit suavitatem, et terra nostra dabit fructum suum.» Unus versus restat, peto sine taedio sit quod dicturus sum. Attendite rem necessariam, fratres mei; attendite, percipite, auferte vobiscum, et non sit inane semen Dei in cordibus vestris. «Veritas,» inquit, «de terra orta est,» confessio peccatorum ab homine; «et justitia de coelo prospexit,» id est, a Domino Deo data est justificatio confitenti, ut ipse agnoscat impius pium se fieri non posse, nisi ille fecerit cui confitetur, credendo in eum qui justificat impium (Rom. IV, 5). Tua ergo peccata potes habere; fructum bonum non habebis, nisi ille dederit cui confiteris. Ideo cum dixisset, «Veritas de terra orta est, et justitia de coelo prospexit;» tanquam diceretur ei, Quid est quod dixisti, «Justitia de coelo prospexit? Etenim,» inquit, «Dominus dabit suavitatem et terra nostra dabit fructum suum.» Nos ergo respiciamus nos; et si nihil in nobis invenerimus nisi peccata, oderimus peccata, et desideremus justitiam. Cum enim coeperimus odisse peccata, jam ipsum odium peccatorum similes nos incipit facere Deo; quia hoc odimus quod odit et Deus. Cum ergo coeperis odisse peccata et confiteri Deo, cum te delectationes illicitae rapiunt et ducunt ad ea quae tibi non prosunt, ingemisce ad Deum: et confitens illi peccata tua, mereberis ab illo delectationem, et suavitatem justitiae faciendae dabit tibi, ut incipiat te delectare justitia, quem primo delectabat iniquitas; ut qui primo gaudebas in ebrietate, gaudeas in sobrietate; et qui primo gaudebas de furtis, ut tolleres homini quod non habebas, quaeras donare non habenti quod habebas; et quem delectabat rapere, delectet donare; quem delectabat spectare, delectet orare; quem delectabant cantica nugatoria et adulterina, delectet hymnum dicere Deo; currere ad ecclesiam, qui primo currebas ad theatrum. Unde nata est ista suavitas, nisi quia «Dominus dabit suavitatem, et terra nostra dabit fructum suum?» Ecce enim videte quod dico: ecce locuti sumus vobis verbum Dei, semen sparsimus devotis cordibus, tanquam sulcata invenientes pectora vestra aratro confessionis; devotione et intentione suscepistis semen, cogitate de verbo quod audistis, tanquam glebas frangentes, ne semen rapiant volatilia, ut possit ibi germinare quod seminatum est; et nisi Deus pluerit, quid prodest quod seminatur? Hoc est, «Dominus dabit suavitatem, et terra nostra dabit fructum suum.» Ille enim visitationibus suis, in otio, in negotio, in domo, in lecto, in convivio, in collocutione, in deambulatione visitet corda vestra, ubi nos non sumus. Veniat imber Dei, et fructificet quod ibi seminatum est; et ubi non sumus nos, et securi quiescimus, aut aliud agimus, Deus det incrementum seminibus quae sparsimus, ut attendentes postea bonos mores vestros, etiam de fructu gaudeamus: «Quoniam Dominus dabit suavitatem, et terra nostra dabit fructum suum.»"
