context = "Psalm 84, Enarratio (sermo ad plebem), section 16, complete, headed [«vers. 14.] Justitia ante eum praeibit, et ponet in; via gressus suos.» Read with section 15 and the closing of the enarratio: confession of sins is man's first righteousness, opening the way (Matt 3:3) so Christ may come and direct the believer by His own footsteps."
physical_line_ranges = [[90, 90]]
text = "16. [«vers. 14.] Justitia ante eum praeibit, et ponet in; via gressus suos.» Justitia illa est quae est in confessione peccatorum: veritas enim ipsa est. Justus enim debes esse in te, ut punias te: ipsa est prima hominis justitia, ut punias te malum, et faciat te Deus bonum. Quia ergo ipsa est prima hominis justitia, ipsa fit via Deo, ut veniat ad te Deus: ibi illi fac viam, in confessione peccatorum. Ideo et Joannes cum baptizaret in aqua poenitentiae, et vellet ad se venire poenitentes de suis prioribus factis, hoc dicebat: «Parate viam Domino, rectas facite semitas ejus» (Matth. III, 3). Placebas tibi in peccatis tuis, o homo; displiceat tibi quod eras, ut possis esse quod non eras. «Parate viam Domino:» praecedat ista justitia, ut confitearis peccata: veniet ille et visitabit te, quia «ponet in via gressus suos;» est enim jam ubi ponat gressus suos, est ubi ad te veniat. Ante autem quam confitereris peccata, intercluseras ad te viam Dei; non erat qua ad te veniret. Confitere vitam, et aperis viam; et veniet Christus, «et ponet in via gressus suos,» ut te informet vestigiis suis."
