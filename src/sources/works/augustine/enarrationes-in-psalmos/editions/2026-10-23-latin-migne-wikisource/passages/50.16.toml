text = "16. [vers. 13.] Ne projicias me a facie tua. Averte faciem tuam a peccatis meis: et ne projicias me a facie tua. Cujus faciem timet, ipsius faciem invocat. Ne projicias me a facie tua: et spiritum sanctum tuum ne auferas a me. Est enim spiritus sanctus in confitente. Jam ad donum Spiritus sancti pertinet, quia tibi displicet quod fecisti. Immundo spiritui peccata placent, sancto displicent. Quamvis ergo adhuc veniam depreceris, tamen ex alia parte quia tibi displicet malum quod commisisti, Deo conjungeris: hoc enim et tibi displicet, quod et illi. Jam duo estis ad expugnandam febrem tuam, tu et medicus. Quia ergo non potest esse confessio peccati et punitio peccati in homine a seipso; cum quisque sibi irascitur et sibi displicet, sine dono Spiritus sancti non est. Nec ait, spiritum sanctum tuum da mihi, sed, ne auferas a me. Et spiritum sanctum tuum ne auferas a me."
