context = "Augustine's complete Psalm 43 section 9, on the primary lemma at verse 9 (In Deo laudabimur tota die), an exact substring of the same physical line. Sections 8 and 10 were read around it: he mixes in verbs of future time, so that the past tenses already spoken are understood as foretold of the future; we shall be praised and confess because he has delivered us from all who afflict us and will give us an everlasting kingdom (Ps 83:5)."
physical_line_ranges = [[35, 35]]
text = "9. [vers. 9.] In Deo laudabimur tota die. Videte quemadmodum miscet etiam verba futuri temporis, ut intelligas et praeterita quae dicta sunt de futuro esse praedicta. In Deo laudabimur tota die: et in nomine tuo confitebimur in saecula. Quid, laudabimur? quid, confitebimur? Quia ex omnibus affligentibus nos eruisti nos, quia reguum perpetuum dabis nobis, quia complebitur in nobis, Beati qui habitant in domo tua, Domine, in saecula saeculorum laudabunt te (Psal. LXXXIII, 5)."
