notes = "Exact raw-line substring of the separately registered whole-part Latin derivative (SHA-256 and byte size recomputed and matched on 2026-11-16). Physical line 35 carries sections 6-11 of the Psalm 43 enarratio as one source paragraph; the substring begins at the section's own number and verse heading and ends before the next section's number, so the entire numbered section, including its final sentence, is retained and nothing of a neighbouring section enters it. No model generated or retyped the source wording. Source banner names Migne 1841/Corpus Corporum. The source's electronic wording and boundaries were inspected; no PL 36 page-image or critical-edition collation is claimed. Printed-style spelling, punctuation and source-local readings (for example lam and reguum) remain as the digital witness carries them. The derivative's CC BY-SA 4.0 attribution and transformation notice apply. Canonical anchoring is to the section's explicit main lemma; supporting references to other psalms remain in the complete text. Registered 2026-11-16 by the source-registration stage of proper-study run 11c5af05fe374203."
