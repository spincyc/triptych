context = "Augustine's complete Psalm 43 section 8, on the primary lemma at verse 8 (Salvos enim fecisti nos ex affligentibus nos), an exact substring of the physical line that also carries sections 6-11. Sections 6-7 and 9-10 were read around it: the past is said figuratively of the future, because what is to come is as certain as if it were done, as in Ps 21:17-19; give me a prophet to whom the future is as certain as the past is to you."
physical_line_ranges = [[35, 35]]
text = "8. [vers. 8.] Salvos enim fecisti nos ex affligentibus nos. Et hoc figura praeteriti de futuro dicitur: sed ideo tanquam praeteritum dicitur, quia tam certum est quasi factum sit. Intendite quare pleraque Prophetae ita dicunt tanquam praeterita sint, cum praenuntientur futura, non facta. Nam et de ipso Domino futura passio praenuntiabatur, et tamen, Foderunt, inquit, manus meas et pedes meos, dinumeraverunt omnia ossa mea: non dixit, Fodient, et dinumerabunt. Ipsi vero consideraverunt et conspexerunt me: non dixit, Considerabunt et conspicient. Diviserunt sibi vestimenta mea (Psal. XXI, 17, 19): non dixit, divident. Omnia ista tanquam praeterita dicuntur, cum futura sint; quia Deo et futura tam certa sunt, tanquam praeterita sint. Nobis enim ea quae praeterierunt, certa sunt; quae futura, incerta sunt. Novimus enim aliquid accidisse, et non potest fieri ut non acciderit quod accidit. Da prophetam cui tam certum sit futurum quam tibi praeteritum: et quam tibi quod meministi factum, non potest fieri ut non sit factum, lam illi quod novit futurum, non potest fieri ut non fiat. Ideo de securitate dicuntur tanquam praeterita, quae adhuc futura sunt. Hoc ergo speramus. Salvos enim fecisti nos ex affligentibus nos, et eos qui oderunt nos confudisti."
