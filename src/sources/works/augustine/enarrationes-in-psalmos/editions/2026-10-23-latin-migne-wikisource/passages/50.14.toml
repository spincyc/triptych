text = "14. [vers. 11.] Averte faciem tuam a peccatis meis, et omnes iniquitates meas dele. Jam enim exsultant ossa humiliata, jam hyssopo mundatus, humilis factus sum. Averte faciem tuam, non a me, sed a peccatis meis. Alibi quippe orans dicit: Ne avertas faciem tuam a me (Psal. XXVI, 9). Qui non vult a se averti faciem Dei, vult averti faciem Dei a peccatis suis. Peccatum enim unde se Deus non avertit, advertit: si advertit, animadvertit. Averte faciem tuam a peccatis meis, et omnes iniquitates meas dele. Satagit de illo grandi peccato: plus praesumit, omnes deleri vult iniquitates suas; praesumit de medici manu, de magna illa misericordia quam in principio Psalmi invocavit: Omnes iniquitates meas dele. Avertit faciem Deus, et sic delet; avertendo faciem peccata delet, advertendo scribit. Audisti avertendo delentem, audi advertendo quid facientem. Vultus autem Domini super facientes mala, ut perdat de terra memoriam eorum (Psal. XXXIII, 17): non delendo peccata eorum. Hic autem quid rogat? Averte faciem tuam a peccatis meis. Bene rogat. Ipse enim non avertit faciem a peccatis suis, dicens, Quoniam peccatum meum ego cognosco. Merito rogas, et bene rogas ut Deus avertat faciem a peccato tuo, si tu inde non avertis faciem: si vero tu peccatum tuum in dorso ponis, Deus ibi faciem ponit. Tu peccatum tuum ante faciem tuam converte, si vis ut inde Deus faciem suam avertat; et sic securus rogas, et exaudit."
