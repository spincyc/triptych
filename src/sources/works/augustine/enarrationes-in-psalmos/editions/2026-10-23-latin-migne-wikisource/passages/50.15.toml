text = "15. [vers. 12.] Cor mundum crea in me, Deus. Crea, non quasi novum aliquid institue, dicere voluit: sed quia poenitens orabat, qui commiserat aliquid quod priusquam committeret innocentior erat, ostendit quemadmodum dixerit, Crea. Et spiritum rectum innova in visceribus meis. Per factum, inquit, meum inveterata erat atque curvata rectitudo spiritus mei. Dicit enim ex alio psalmo: Curvaverunt animam meam (Psal. LVI, 7). Et quando se homo pronum facit ad terrenas concupiscentias, incurvatur quodammodo; cum autem erigitur in superna, rectum fit cor ejus, ut bonus illi sit Deus. Quam bonus enim Deus Israel rectis corde (Psal. LXXII, 1)! Proinde, fratres, audite. Aliquando Deus cui ignoscit in futuro saeculo, corripit eum de peccato in isto saeculo. Nam et ipsi David, cui dictum jam fuerat per Prophetam, Dimissum est peccatum tuum, evenerunt quaedam quae minatus erat Deus propter ipsum peccatum. Nam filius ejus Abessalon adversus eum cruentum bellum gessit, et in multis humiliavit patrem suum (II Reg. XV, 10). Ambulabat ille in dolore, in tribulatione humiliationis suae, ita subditus Deo, ut omnia justa ei tribuens confiteretur quod nihil pateretur indigne, habens jam rectum cor cui non displicebat Deus. Injuriosum quemdam et in os sibi dura maledicta jacientem patienter audiebat, ex adversa parte unum ex militibus qui erant cum filio ejus impio. Et cum ille jaceret maledicta in regem, iratus unus ex comitibus David voluit ire et percutere eum; sed prohibetur a David. Et quomodo prohibetur? Ut diceret, Deus illum misit, ut mihi malediceret (Id. XVI, 5, 10). Agnoscens culpam suam, amplexus est poenam suam, quaerens gloriam non suam; Dominum laudans in eo quod boni habebat, Dominum laudans in eo quod patiebatur, benedicens Dominum in omni tempore, semper laus ejus in ore ejus (Psal. XXXIII, 2). Tales sunt omnes recti corde: non hi perversi, qui se rectos putant, et perversum Deum; qui quando aliquid faciunt mali, gaudent; quando aliquid mali patiuntur, blasphemant; insuper positi in tribulatione et flagello, dicunt de corde distorto, Deus, quid tibi feci? Vere quia nihil Deo fecerunt; omnia enim sibi fecerunt. Et spiritum rectum innova in visceribus meis."
