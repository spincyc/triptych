notes = "Dated digital delivery, not a new ancient composition or an image-collated printing. The complete HTML reports revision 230394. The raw delivery contains all ten Psalm headings XLI-L and the complete Psalm L sermo with sections 1-24. Augustine of Hippo is the author of the ancient Latin. Digital transcription: Corpus Corporum, University of Zurich, as identified in this page’s own source banner, and Latin Wikisource contributors. Source and contributor history: https://la.wikisource.org/wiki/Enarrationes_in_Psalmos_(ed._Migne)/5 and https://la.wikisource.org/wiki/Enarrationes_in_Psalmos_(ed._Migne)/5?action=history. Licence: https://creativecommons.org/licenses/by-sa/4.0/. The ancient Latin remains separately public domain; no project licence replaces the source licence."
