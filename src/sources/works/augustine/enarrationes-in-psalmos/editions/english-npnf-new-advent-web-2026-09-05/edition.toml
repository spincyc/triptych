notes = "A dated web delivery of a public-domain 1888 English translation, revised and edited for New Advent. The pages were read as English reception witnesses, not as a critical Latin text. This is a third dated state of the same delivery: the siblings retrieved 2026-07-28 and 2026-07-29 hold other psalms, and the three must not be merged, because a New Advent page is a mutable witness and its state is dated for that reason. PAIRING: the Latin of this work is registered here at edition.augustine.enarrationes-in-psalmos.latin-migne-pl37-paris-1845, so the original and a translation stand together under one work; no Latin was retrieved by this run and none of these four psalms was collated against it."
