text = "13. \"For righteousness shall go before him, and he shall direct his steps in the way\" (ver. 14): that righteousness, namely, which consists in confession of sins: for this is truth itself. For thou oughtest to be righteous towards thyself, and to punish thyself: for this is the beginning of man's righteousness, that thou shouldest punish thyself, who art evil, and God should make thee good. Therefore since this is the beginning of man's righteousness, this becomes a way for God, that God may come unto thee: there make for Him a way, in confession of sins. Therefore John too, when he was baptizing in the water of repentance, and would have men come to him repenting of their former deeds, spoke thus: \"Prepare the way of the Lord, make His paths straight.\" [3939] Thou didst please thyself in thy sins, O man: let that which thou wast displease thee, that thou mayest be able to become what thou wast not. Prepare the way of the Lord: let that righteousness go before, of confession of sins: He will come and visit thee, for now He hath where to place His steps, He hath whereby He may come to thee. Before thou didst confess thy sins, thou hadst shut up the way of God: there was no way by which He might come unto thee. Confess thy past life, and thou openest a way; and Christ shall come unto thee, and \"shall place His steps in the way,\" that He may guide thee with His own footsteps."
