context = "Complete English section 3 of Psalm LXXX (Vulgate Psalm 79) in Coxe’s condensed NPNF I.8 edition, read with adjacent sections 2 and 4. Directly expounds Vulgate Psalm 79:4 (English v. 3): conversion by God’s grace and illumining the face of Christ veiled in the cloud of weak flesh. Bracketed footnote calls belong to the English edition. No Latin collation is claimed."
physical_line_ranges = [[39666, 39677]]
text = "3. \"O God, convert us.\" For averse we have been from Thee, and except Thou convert us, we shall not be converted. \"And illumine Thy face, and we shall be saved\" (ver. 3). Hath He anywise a darkened face? He hath not a darkened face, but He placed before it a cloud of flesh, and as it were a veil of weakness; and when He hung on the tree, He was not thought the Same as He was after to be acknowledged when He was sitting in Heaven. For thus it hath come to pass. Christ present on the earth, and doing miracles, Asaph knew not; but when He had died, after that He rose again, and ascended into Heaven, he knew Him. He was pricked to the heart, and he may have spoken [3752] also of Him this testimony which now we acknowledge in this Psalm. Thou didst cover Thy face, and we were sick: illumine Thou the same, and we shall be whole."
