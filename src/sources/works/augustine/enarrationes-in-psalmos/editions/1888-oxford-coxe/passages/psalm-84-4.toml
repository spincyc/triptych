context = "Latin Psalm 84 §4 corresponds to English Psalm LXXXV §2 in Coxe’s edition. Both begin at the change to the captivity of Jacob and end with the prince of sinners losing dominion. Coxe marks an internal omission after the question about captivity. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[41532, 41562]]
text = "\"Thou hast turned away the captivity of Jacob.\" His ancient people of Jacob, the people of Israel, born of Abraham's seed, in the promise to become one day the heir of God. That was indeed a real people, to whom the Old Testament was given; but in the Old Testament the New was figured: that was the figure, this the truth expressed. In that figure, by a kind of foretelling of the future, there was given to that people a certain land of promise, in a region where the people of the Jews abode; where also is the city of Jerusalem, whose name we have all heard of. When this people had received possession of this land, they suffered many troubles from their neighbouring enemies who surrounded them: and when they sinned against their God, they were given into captivity, not for destruction, but for discipline; their Father not condemning, but scourging them. And after being seized on, they were set free, and many times were both made captives, and set free; and they are now in captivity, and that for a great sin, even because they crucified their Lord. What then are we to understand them to mean by the words, \"Thou hast turned away the captivity of Jacob\"?...This Psalm hath prophesied in song. \"Thou hast turned away the captivity of Jacob.\" To whom did it speak? To Christ; for it said, \"for the end, for the sons of Core:\" for He hath turned away the captivity of Jacob. Hear Paul himself confessing: \"O wretched man that I am, who shall deliver me from the body of this death?\" He asked who it should be, and straightway it occurred to him, \"The grace of God through Jesus Christ our Lord.\" [3918] Of this grace of God the Prophet speaketh to our Lord Jesus Christ, \"Thou hast turned away the captivity of Jacob.\" Attend to the captivity of Jacob, attend, and see that it is this: Thou hast turned away our captivity, not by setting us free from the barbarians, with whom we had not met, but by setting us free from bad works, from our sins, by which Satan held sway over us. For if any one has been set free from his sins, the prince of sinners hath not whence he may hold sway over him."
