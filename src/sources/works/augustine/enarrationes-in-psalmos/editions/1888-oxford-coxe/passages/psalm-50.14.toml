context = "Latin Psalm 50 §14 corresponds to English Psalm LI §14 in Coxe’s edition. Both run from turning away God’s face from sins to the petitioner facing his own sin and being heard. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[20180, 20205]]
text = "14. \"Turn Thou away Thy face from my sins, and all mine iniquities blot out\" (ver. 9). For now bones humbled exult, now with hyssop cleansed, humble I have become. \"Turn Thou away Thy face,\" not from me, but \"from my sins.\" For in another place praying he saith, \"Turn not away Thy face from me.\" [1851] He that would not that God's face be turned away from himself, would that God's face be turned away from his sins. For to sin, when God turneth not Himself away, he adverteth: if he adverteth, he animadverteth. \"And all mine iniquities blot out.\" He is busied [1852] with that capital sin: he reckoneth on more, he would have all his iniquities to be blotted out: he relieth on the Physician's hand, on that \"great mercy,\" upon which he hath called in the beginning of the Psalm: \"All mine iniquities blot out.\" God turneth away His face, and so blotteth out; by \"turning away\" His face, sins He blotteth out. By \"turning towards,\" He writeth them. Thou hast heard of Him blotting out by turning away, hear of Him by turning towards, doing what? \"But the countenance of the Lord is upon men doing evil things, that He may destroy from the earth the remembrance of them:\" [1853] He shall destroy the remembrance of them, [1854] not by \"blotting out their sins.\" But here he doth ask what? \"Turn away Thy face from my sins.\" Well he asketh. For he himself doth not turn away his face from his own sins, saying, \"For my sin I acknowledge.\" With reason thou askest and well askest, that God turn away from thy sin, if thou from thence dost not turn away thy face: but if thou settest thy sin at thy back, God doth there set His face. Do thou turn sin before thy face, if thou wilt that God thence turn away His face; and then safely thou askest, and He heareth."
