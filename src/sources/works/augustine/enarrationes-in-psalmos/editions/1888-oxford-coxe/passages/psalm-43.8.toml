context = "Latin Psalm 43 §8 corresponds to English Psalm XLIV §6 in Coxe’s edition. The English opens with deliverance from enemies and closes with those who hated us; its ellipsis after past and future certainty omits the Latin discussion of a prophet’s foreknowledge. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[14966, 14982]]
text = "6. \"For Thou hast saved us from our enemies\" (ver. 7). This too is spoken of the future under the figure of the past. But this is the reason that it is spoken of as if it were past, that it is as certain as if it were past. Give heed, wherefore many things are expressed by the Prophets as if they were past; whereas it is things future, not past facts that are the subject of prophecy. For the future Passion of our Lord Himself was foretold: [1331] and yet it says, \"They pierced My hands and My feet. They told all My bones;\" not, \"They shall pierce,\" and \"shall tell.\" \"They looked and stared upon Me;\" not \"They shall look and stare upon Me.\" \"They parted My garments among them.\" It does not say, \"They shall part\" them. All these things are expressed as if they were past, although they were yet to come: because to God things to come also are as certain as if they were past....It is for this reason, in consequence of their certainty, that those things which are yet future, are spoken of as if past. This it is then that we hope. For it is, \"Thou hast saved us from our enemies, and hast put them to shame that hated us.\""
