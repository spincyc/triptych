context = "Latin Psalm 88, second sermon §11 corresponds to English Psalm LXXXIX §38 in Coxe’s edition. Both begin with the difficulty of belief in Christ and the rage of the nations; the martyrs’ words lead into the oath sworn to David at the close. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[44753, 44767]]
text = "38. But in the very faith in Christ great difficulties occurred, and the heathen in their rage long said, \"When shall he die, and his name perish?\" On account of these then who have now long believed in Christ, but were destined to doubt for some time, these words follow, \"Lord, where are Thy old loving-kindnesses?\" (ver. 49). We have now acknowledged Christ our purifier, we now possess Him in whom Thy promises were to be fulfilled; show forth in Him what Thou hast promised. It is He Himself that shall live, and not see death: Himself who delivers His own soul from the hand of Hell: and yet we are still in suffering. Thus spoke the Martyrs, whose birthdays we are celebrating. He shall live, and not see death: He delivers His soul from the hands of Hell: yet \"for Thy sake we are killed all the day long: and are counted as sheep appointed to be slain.\" [4223] \"Lord, where are Thy old loving-kindnesses which Thou swarest unto David in Thy truth?\""
