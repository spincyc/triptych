context = "Latin Psalm 88, second sermon §13 corresponds to English Psalm LXXXIX §40 in Coxe’s edition. Both begin with enemies’ reproaches and follow Christ’s change from death to life. The English ends with the citation about fearing God; the Latin then repeats the closing lemma about Christ’s change. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[44792, 44807]]
text = "40. \"Wherewith Thine enemies have blasphemed Thee, O Lord\" (ver. 51), both Jews and Pagans. \"Wherewith they have blasphemed.\" Wherewith have they blasphemed Thee? \"With the change of Thine Anointed.\" [4226] They objected that Christ died, and was crucified. Madmen, what is your reproach? Although there is now no one to use it: yet supposing some still remaining that so speak, what is your reproach? that Christ died? He was not destroyed, but changed. He is styled \"dead\" on account of the three days. Wherewith then have thine enemies blasphemed Thee? Not with the loss, not with the perdition of Thine Anointed, but with His \"change.\" He was changed from temporal to eternal life: He was changed from the Jews to the Gentiles; He was changed from earth to heaven. Let then Thy vain enemies blaspheme Thee still for the change of Thine Anointed. Would that they may be changed: they will not in that case blaspheme the change of Christ, which displeases them since they themselves will not be changed. \"For there is no change with them, and they fear not God.\" [4227]"
