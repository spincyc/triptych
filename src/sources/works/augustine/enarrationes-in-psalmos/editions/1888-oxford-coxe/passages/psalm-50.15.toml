context = "Latin Psalm 50 §15 corresponds to English Psalm LI §15 in Coxe’s edition. Both run from creating a clean heart to renewing an upright spirit. At the opening NPNF follows a different reading from the held Latin’s non: note 1855 records the negative in the Benedictine text. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[20207, 20242]]
text = "15. \"A clean heart create in me, O God\" (ver. 10). \"Create\"--he meant [1855] to say, \"as it were begin something new.\" But, because repentant he was praying (that had committed some sin, which before he had committed, he was more innocent), after what manner he hath said \"create\" he showeth. \"And a right spirit renew in my inner parts.\" By my doing, he saith, the uprightness of my spirit hath been made old and bowed. For he saith in another Psalm, \"They have bowed my soul.\" [1856] And when a man doth make himself stoop unto earthly lusts, he is \"bowed\" in a manner, but when he is made erect for things above, upright is his heart made, in order that God may be good to him. For, \"How good is the God of Israel to the upright of heart!\" [1857] Moreover, brethren, listen. Sometimes God in this world chastiseth for his sin him that He pardoneth in the world to come. For even to David himself, to whom it had been already said by the Prophet, \"Thy sin is put away,\" [1858] there happened certain things which God had threatened for that very sin. [1859] For his son Abessalom against him waged bloody war, and many ways humbled his father. [1860] He was walking in grief, in the tribulation of his humiliation, so resigned to God, that, ascribing to Him all that was just, he confessed that he was suffering nothing undeservedly, having now an heart upright, to which God was not displeasing. A slanderous person and one throwing in his teeth harsh curses [1861] he patiently heard, one of the soldiers on the opposite side, that were with his unnatural son. And when he was heaping curses upon the king, one of the companions of David, enraged, would have gone and smitten him; but he is kept back by David. And he is kept back how? For that he said, God sent him to curse me. Acknowledging his guilt he embraced his penance, seeking glory not his own, praising the Lord in that good which he had, praising the Lord in that which he was suffering, \"blessing the Lord alway, ever His praise was in his mouth.\" [1862] Such are all the upright in heart: not those crooked persons who think themselves upright and God crooked: who when they do any evil thing, rejoice; when they suffer any evil thing, blaspheme; nay, if set in tribulation and scourging, they say from their distorted heart, \"O God, what have I done to Thee?\" Truly it is because they have done nothing to God, for they have done all to themselves. \"And an upright spirit, renew in my inner parts.\""
