context = "Complete English section 1 of Psalm LXXX (Vulgate Psalm 79) in Coxe’s condensed NPNF I.8 edition, read with the psalm heading and following section 2. Expounds the title of Vulgate Psalm 79:1 ('For the end in behalf of them that shall be changed... a testimony to Asaph himself... for the Assyrians') as a song of the Advent of Christ and His vineyard, Head and Body. Opening ellipsis reflects Coxe’s abridgment; bracketed footnote calls belong to the English edition. No Latin collation is claimed."
physical_line_ranges = [[39604, 39620]]
text = "1. ...If perchance things obscure demand the office of an interpreter, those things which are evident ought to require of me the office of a reader. The song here is of the Advent of the Lord and of our Saviour Jesus Christ, and of His vineyard. But the singer of the song is that Asaph, as far as doth appear, enlightened and converted, by whose name ye know the synagogue to be signified. Lastly, the title of the Psalm is: \"For the end in behalf of them that shall be changed;\" that is, for the better. For Christ, the end of the Law, [3742] hath come on purpose that He should change men for the better. And he addeth, \"a testimony to Asaph himself.\" A good testimony of truth. Lastly, this testimony doth confess both Christ and the vineyard; that is, Head and Body, King and people, Shepherd and flock, and the entire mystery of all Scriptures, Christ and the Church. But the title of the Psalm doth conclude with, \"for the Assyrians.\" The Assyrians are interpreted, \"men guiding.\" Therefore it is no longer a generation which hath not guided the heart [3743] thereof, but now a generation guiding. Therefore hear we what he saith in this testimony."
