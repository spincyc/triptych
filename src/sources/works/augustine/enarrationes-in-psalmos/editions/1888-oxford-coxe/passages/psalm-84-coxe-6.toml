context = "Complete English section 6 of Psalm LXXXV (Vulgate Psalm 84) in Coxe’s condensed NPNF I.8 edition, read with adjacent sections 5 and 7. Directly expounds Vulgate Psalm 84:7–8 (English vv. 6–7): conversion and rejoicing in God the Light of the world, and 'Show us Thy mercy, O Lord, and grant us Thy salvation' interpreted as 'grant us Thy Christ', humbling pride and purifying the heart by faith. Internal ellipses reflect Coxe’s abridgments; bracketed footnote calls belong to the English edition. No Latin collation is claimed."
physical_line_ranges = [[41616, 41671]]
text = "6. \"O God, Thou shalt turn us again, and make us alive\" (ver. 6). Not as if we ourselves of our own accord, without Thy mercy, turn unto Thee, and then Thou shalt make us alive: but so that not only our being made alive is from Thee, but our very conversion, that we may be made alive. \"And Thy people shall rejoice in Thee.\" To their own evil they shall rejoice in themselves: to their own good they shall rejoice in Thee. For when they wished to have joy of themselves, they found in themselves woe: but now because God is all our joy, he that will rejoice securely, let him rejoice in Him who cannot perish. For why, my brethren, will ye rejoice in silver? Either thy silver perisheth, or thou: and no one knows which first: yet this is certain, that both shall perish; which first, is uncertain. For neither can man remain here always, nor can silver remain here always: so too gold, so garments, so houses, so money, so broad lands, so, lastly, this light itself. Be not thou willing then to rejoice in these: but rejoice in that light which hath no setting: rejoice in that dawn which no yesterday precedes, which no to-morrow follows. What light is that? \"I,\" saith He, \"am the Light of the world.\" [3922] He who saith unto thee, \"I am the Light of the world,\" calls thee to Himself. When He calls thee, He converts thee: when He converts thee, He healeth thee: when He hath healed thee, thou shalt see thy Converter, unto whom it is said, \"Show us Thy mercy, O Lord, and grant us Thy salvation\" (ver. 7): Thy salvation, that is, Thy Christ. [3923] Happy is he unto whom God showeth His mercy. He it is who cannot indulge in pride, unto whom God showeth His mercy. For by showing him His salvation He persuadeth him that whatever good man has, he hath not but from Him who is all our good. And when a man has seen that whatever good he has he hath not from himself, but from his God; he sees that everything which is praised in him is of the mercy of God, not of his own deserving; and seeing this, he is not proud; not being proud, he is not lifted up; not lifting himself up, he falleth not; not falling, he standeth; standing, he clingeth fast; clinging fast, he abideth; abiding, he enjoyeth, and rejoiceth in the Lord his God. He who made him shall be unto him a delight: and his delight no one spoileth, no one interrupteth, no one taketh away....Therefore, what saith John in his Epistle? \"Beloved, now are we the sons of God, and it doth not yet appear what we shall be.\" [3924] Who would not rejoice, if suddenly while he was wandering abroad, ignorant of his descent, suffering want, and in a state of misery and toil, it were announced, Thou art the son of a senator: thy father enjoys an ample patrimony on your family estate; I bid thee return to thy father: how would he rejoice, if this were said to him by some one whose promise he could trust? One whom we can trust, an Apostle of Christ, hath come and said to us, Ye have a father, ye have a country, ye have an inheritance. Who is that father? \"Beloved, we are the sons of God.\" [3925] ...Therefore He [3926] promised us to show Himself unto us. Think, my brethren, what His beauty is. All those beautiful things which ye see, which ye love, He made. If these are beautiful, what is He Himself? If these are great, how great is He? Therefore from these things which we love here, let us the more long for Him: and despising these things, let us love Him: that by that very love we may by faith purify our hearts, and His vision, when it cometh, may find our heart purified. The light which shall be shown unto us ought to find us whole: this is the work of faith now. This is what we have spoken here: \"And grant us Thy salvation:\" grant us Thy Christ, that we may know Thy Christ, see Thy Christ; not as the Jews saw Him and crucified Him, but as the Angels see Him, and rejoice."
