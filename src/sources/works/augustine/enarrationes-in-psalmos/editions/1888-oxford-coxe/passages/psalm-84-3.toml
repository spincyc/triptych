context = "Latin Psalm 84 §3 corresponds to English Psalm LXXXV §2 in Coxe’s edition. Both begin with prophecy speaking of the future in the past tense and end with the favour shown to the land. The English ellipsis omits the Latin’s example of the foretold Passion; the following captivity lemma belongs to §4. Bracketed footnote calls belong to the English edition."
