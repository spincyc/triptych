context = "Complete English section 9 of Psalm LXXX (Vulgate Psalm 79) in Coxe’s condensed NPNF I.8 edition, read with adjacent sections 8 and 10. Directly expounds Vulgate Psalm 79:15–16 (English vv. 14–15): turning to visit and perfect the vineyard upon the Son of Man, Christ the sole foundation (1 Cor 3:11). Bracketed footnote calls belong to the English edition. No Latin collation is claimed."
physical_line_ranges = [[39817, 39833]]
text = "9. But with what profit is this? \"O God of virtues turn Thou nevertheless\" (ver. 14). Although these things have been done, \"Turn Thou nevertheless.\" \"Look from heaven and see, and visit this vineyard.\" \"And perfect Thou her whom Thy right hand hath planted\" (ver. 15). No other plant Thou, but this make Thou perfect. For she is the very seed of Abraham, she is the very seed in whom all nations shall be blessed: [3768] there is the root where is borne the graffed wild olive. \"Perfect Thou this vineyard which Thy right hand hath planted.\" But wherein doth He perfect? \"And upon the Son of man, whom Thou hast strengthened to Thyself.\" What can be more evident? Why do ye still expect, that we should still explain to you in discourse, and should we not rather cry out with you in admiration, \"Perfect Thou this vineyard which Thy right hand hath planted, and upon the Son of man\" perfect her? What Son of man? Him \"whom Thou hast strengthened to Thyself.\" A mighty stronghold: build as much as thou art able. \"For other foundation no one is able to lay, except that which is laid, which is Christ Jesus.\" [3769]"
