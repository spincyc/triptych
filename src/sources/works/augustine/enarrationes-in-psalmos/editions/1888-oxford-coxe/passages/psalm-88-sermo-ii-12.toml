context = "Latin Psalm 88, second sermon §12 corresponds to English Psalm LXXXIX §39 in Coxe’s edition. Both begin with the reproach of God’s servants, trace the widow’s sufferings and the Christians’ changed public standing, and close with the reproaches borne in the bosom. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[44769, 44790]]
text = "39. \"Remember, Lord, the rebuke that Thy servants have\" (ver. 50). Even while Christ was living, and while He was sitting on His Father's right hand, reproaches were cast against the Christians: they long were reproached with the name of Christ. That widowed one who brought forth, and whose children were more than those of the married wife, [4224] heard ill names, heard reproaches: but the Church, multiplied as she is, extending right and left, no longer remembers the reproach of her widowhood. \"Remember, Lord,\" in the memory of whom there is abundant sweetness. \"Remember,\" forget not. Remember what? \"the rebuke that Thy servants have: and how I do bear in my bosom the rebukes of many people.\" I went, saith he, to preach of Thee, and I heard reproaches, and bore them in my bosom, because I was fulfilling the prophecy. \"Being defamed we entreat: we are made as the filth of the earth, and are the offscouring of all things unto this day.\" [4225] Long the Christians bore reproaches in their bosom, in their heart: nor dared resist their revilers; before, when it was a crime to answer a heathen: it is now a crime to remain a heathen. Thanks be to the Lord! He remembered our rebukes: He raised the horn of His Anointed on high, He made Him the Wonderful among the kings of the earth. Now no one insults Christians, or if he does, it is not in public: he speaks as if he were still more fearful of being heard, than anxious to be believed. \"I bear in my bosom the rebukes of many people.\""
