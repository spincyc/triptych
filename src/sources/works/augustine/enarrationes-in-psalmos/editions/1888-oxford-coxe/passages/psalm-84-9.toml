notes = "Copied mechanically, without retyping or normalization, from physical lines 41637-41671 of the hash-checked tracked NPNF I.8 CCEL text (SHA-256 and byte size 5,029,159 recomputed and matched on 2026-11-25), inside segment.augustine.enarrationes-in-psalmos.1888-oxford-coxe.psalm-lxxxv. The first segment begins mid-line at the lemma, after the words of §6 that render Latin §§7-8; the edition's §7 begins on line 41673. The CCEL edition prints Coxe's abridged Oxford translation; its ellipses are the edition's omissions. Not collated with a page image of the 1888 printing. Bracketed footnote calls belong to the English edition. Registered 2026-11-25 by the source-registration stage of proper-study run 77c1ca91ef2d5e93."
