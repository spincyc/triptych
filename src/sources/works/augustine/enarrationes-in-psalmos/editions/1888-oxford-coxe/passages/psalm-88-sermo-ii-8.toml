context = "Latin Psalm 88, second sermon §8 corresponds to English Psalm LXXXIX §35 in Coxe’s edition. After asking whether God fulfils his promises, both discuss Israel’s partial blindness and end with the question about wrath burning like fire. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[44681, 44690]]
text = "35. Let us therefore see whether God fulfils His promises. After these stern penalties which have been recorded as having been inflicted upon this people and kingdom, that God might not be supposed to have fulfilled His promises in it, and so not to grant another kingdom in Christ, of which kingdom there shall be no end; the Prophet addresses Him in these words, \"Lord, how long wilt Thou hide Thyself unto the end?\" (ver. 46). For possibly it was not from them and to the end; because \"blindness in part is happened to Israel, until the fulness of the Gentiles be come in, and so all Israel shall be saved.\" [4215] But in the mean while \"shall Thy wrath burn like fire.\""
