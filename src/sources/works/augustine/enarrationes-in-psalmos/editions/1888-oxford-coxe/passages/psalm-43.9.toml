context = "Latin Psalm 43 §9 corresponds to English Psalm XLIV §7 in Coxe’s edition. Both move from boasting in God all day, through the shift to future tense, to the closing quotation about praising God in his house. Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[14984, 14992]]
text = "7. \"In God will we boast [1332] all the day long\" (ver. 8). Observe how he intermingles words expressive of a future time, that you may perceive that what was spoken of before as in past time was foretold of future times. \"In God will we boast all day long; and in Thy name will we confess for ever.\" [1333] What is, \"We shall boast\"? What, \"We shall confess\"? That Thou hast \"saved us from our enemies;\" that Thou art to give us an everlasting kingdom: that in us are to be fulfilled the words, \"Blessed are they that dwell in Thine house: they will be always praising Thee.\" [1334]"
