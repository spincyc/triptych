text = "10. \"Truth hath sprung out of the earth, and righteousness hath looked down from heaven\" (ver. 11). \"Truth hath sprung out of the earth:\" Christ is born of a woman. The Son of God hath come forth of the flesh. What is truth? The Son of God. What is the earth? Flesh. Ask whence Christ was born, and thou seest that \"Truth is sprung out of the earth.\" But the Truth which sprang out of the earth was before the earth, and by It the heaven and the earth were made: but in order that righteousness might look down from heaven, that is, in order that men might be justified by Divine grace, Truth was born of the Virgin Mary; that He might be able to offer a sacrifice to justify them, the sacrifice of suffering, the sacrifice of the Cross. And how could He offer a sacrifice for our sins, except He died? How could He die, except He received from us that wherein He might die; that is, unless He received from us mortal flesh, Christ could not have died: because the Word of God dieth not, Godhead dieth not, the Virtue and Wisdom of God doth not die. How should He offer a sacrifice, a healing victim, if He died not? How should He die, unless He clothed Himself with flesh? How should He put on flesh, except truth sprang out of the earth?"
