context = "Latin Psalm 84 §15 corresponds to English Psalm LXXXV §12 in Coxe's edition (ver. 12 = Vulgate 84:13). Both begin with the lemma For the Lord shall give sweetness, and our land shall give her increase, and expound the sweetness of righteousness and God's rain on the sown word; the edition's ellipsis after the lemma omits the Latin's opening sentence."
physical_line_ranges = [[41844, 41870]]
text = "12. \"For the Lord shall give sweetness, and our land shall give her increase\" (ver. 12)....He will give unto thee the sweetness of working righteousness, so that righteousness shall begin to delight thee, whom before unrighteousness delighted: so that thou who at first didst delight in drunkenness, shall rejoice in sobriety: and thou who didst at first rejoice in theft, so as to take from another man what thou hadst not, shalt seek to give to him that hath not that which thou hast: and thou who didst take delight in robbing, shalt delight now in giving: thou whom shows delighted, shalt delight in prayer; thou who didst delight in trifling and lascivious songs, shalt now delight in singing hymns to God; in running to church, thou who at first didst run to the theatre. Whence is that sweetness born to thee, except from this, that \"God giveth sweetness\"? For, behold, ye see what I mean: behold, I have spoken unto you the word of God, I have sown seed in your devout hearts, finding your souls furrowed, as it were, with the plough of confession: with devout attention ye have received the seed; think now upon the word which ye have heard, like those who break up the clouds, lest the fowls should carry away the seed, that what is sown may be able to spring up there: and unless God rain upon it, what profits it that it is sown? This is what is meant by \"our land shall give her increase.\" May He with His visitations, in leisure, in business, in your house, in your bed, at meal-time, in conversation, in walks, visit your hearts, when we are not by. May the rain of God come and make to sprout what is sown there: and when we are not by, and are resting quietly, or otherwise employed, may God give increase to the seeds which we have sown, that remarking afterwards your improved characters, we too may rejoice for your fruit."
