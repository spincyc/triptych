context = "Latin Psalm 84 §14 corresponds to English Psalm LXXXV §11 in Coxe's edition. Both open with the second meaning of 'Truth is sprung out of the earth' as confession of sins and close with God sparing the penitent; Coxe marks an internal omission with an ellipsis (omitting the Publican/Pharisee and 1 John 1:8-9 citations). Bracketed footnote calls belong to the English edition."
physical_line_ranges = [[41829, 41842]]
text = "11. On the same passage we may mention another meaning. \"Truth is sprung out of the earth:\" confession from man. For thou, O man, wast a sinner. O earth, who when thou hadst sinned didst hear the sentence, \"Earth thou art, and unto earth shalt thou return,\" [3938] from thee let truth spring, that righteousness may look down from heaven. How doth truth spring from thee, whilst thou art a sinner, whilst thou art unrighteous? Confess thy sins, and truth shall spring out of thee. For if whilst thou art unrighteous, thou callest thyself just, how can truth spring out of thee? But if being unrighteous thou dost confess thyself to be so, \"truth hath sprung out of the earth.\"...What \"righteousness hath looked down from heaven\"? It is that of God, as though He said: Let us spare this man, for he spareth not himself: let us pardon him, for he himself confesseth. He is changed so as to punish his sin: I too will change, so as to set him free."
