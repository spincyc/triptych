notes = "A dated web delivery of a public-domain 1888 English translation, revised and edited for New Advent, read as an English reception witness and not as control over the Latin. Its page titles number the psalms in the Hebrew series while the expositions themselves are of the Vulgate psalms: 'Exposition on Psalm 86' is Vulgate Psalm 85, 'Psalm 92' is Vulgate 91, 'Psalm 95' is Vulgate 94 and 'Psalm 40' is Vulgate 39. Each was confirmed against the page's own internal verse citations rather than from its title."
