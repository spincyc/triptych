notes = "Complete text of Augustine's single sermon on Psalm 85, all 24 numbered sections with the editors' running rubrics, from section 1 to the end of the psalm. This is the exposition that carries the totus Christus formula on the Introit's psalm: Christ prays for us as our priest, prays in us as our head, and is prayed to by us as our God. HTML, not a facsimile. Not retained: the augustinus.it delivery, because the site states no licence for its own transcription, markup and presentation. A reader without the network cannot open this page from a checkout; the Latin inside it is public domain and reachable from Migne, and the wording a claim depends on must be quoted into the claim's own passage record."
