notes = "A dated Latin web delivery of the Maurist text as printed in Migne, Patrologia Latina 36-37, not a critical edition; the critical edition is Dekkers and Fraipont, CCSL 38-40, which was not consulted. The site's own file numbers run sequentially across the whole collection and are NOT psalm numbers: file 054 is Psalm 39, file 104 is Psalm 85, file 112 is Psalm 91 and file 115 is Psalm 94. A first attempt at guessing filenames from psalm numbers returned the wrong psalms, so the collection index that carries the map is registered here beside the four expositions. Psalm numbers throughout are the Vulgate's. Language pairing: this is the work's original Latin, and the English of the same four expositions is registered beside it at edition.augustine.enarrationes-in-psalmos.english-npnf-new-advent-web-2026-09-05, so both members of the pair are held."
