text = "5. \"In Thy truth guide me:\" avoiding error. \"And teach me:\" for by myself I know nothing, but falsehood. \"For Thou art the God of my salvation; and for Thee have I waited all the day\" (ver. 5). For dismissed by Thee from Paradise, and having taken my journey into a far country, [636] I cannot by myself return, unless Thou meetest the wanderer: for my return hath throughout the whole tract of this world's time waited for Thy mercy."
