text = "8. \"Gracious and upright is the Lord\" (ver. 8). The Lord is gracious, since even sinners and the ungodly He so pitied, as to forgive all that is past; but the Lord is upright too, who after the mercy of vocation and pardon, which is of grace without merit, will require merits meet for the last judgment. \"Wherefore He will establish a law for them that fail in the way.\" For He hath first bestowed mercy to bring them into the way."
