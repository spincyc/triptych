text = "1. Christ speaks, but in the person of the Church: for what is said has reference rather to the Christian People turned unto God. 2. \"Unto Thee, O Lord, have I lift up my soul\" (ver. 1): with spiritual longing have I lift up the soul, that was trodden down on the earth with carnal longings. \"O my God, in Thee I trust, I shall not be ashamed\" (ver. 2). O my God, from trusting in myself I was brought even to this weakness of the flesh; and I who on abandoning God wished to be as God, fearing death from the smallest insect, was in derision ashamed for my pride; now, therefore, \"in Thee I trust, I shall not be ashamed.\""
