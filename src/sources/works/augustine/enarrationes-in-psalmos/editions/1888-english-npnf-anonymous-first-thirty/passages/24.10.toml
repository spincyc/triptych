context = "Complete numbered section 10 of Augustine’s Psalm XXV in the anonymous NPNF I.8 translation, checked from the previous and following numbered paragraphs of the held CCEL volume. Its quoted biblical lemma corresponds to Vulgate Psalm 24:10. Footnote calls follow this edition."
physical_line_ranges = [[6916, 6928]]
text = "10. \"All the ways of the Lord are mercy and truth\" (ver. 10). And what ways will He teach them, but mercy wherein He is placable, and truth wherein He is incorrupt? Whereof He hath exhibited the one in forgiving sins, the other in judging deserts. And therefore \"all the ways of the Lord\" are the two advents of the Son of God, the one in mercy, the other in judgment. He then attaineth unto Him holding on His ways, who seeing himself freed by no deserts of his own, lays pride aside, and henceforward bewares of the severity of His trial, having experienced the clemency of His help. \"To them that seek His testament and His testimonies.\" For they understand the Lord as merciful at His first advent, and as the Judge at His second, who in meekness and gentleness seek His testament, when with His Own Blood He redeemed us to a new life; and in the Prophets and Evangelists, His testimonies."
