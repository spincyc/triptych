notes = "augustinus.it page titled \"Augustinus Hipponensis - In Psalmum 24 enarratio\". The site's own file number in the URL (026) is not the psalm number and must not be read as one; the page's title and heading (IN PSALMUM 24 ENARRATIO) identify it. Extent as measured on the exact bytes: the complete single Enarratio in Psalmum 24 (Vulgate numbering), headed Misericordia Domini convertimur, sections 1-22 with the site's verse markers [v 1.] to [v 22.], where section 1 is the title In finem, psalmus ipsi David and section 2 begins Ad te, Domine, levavi animam meam; the page ends with section 22 on Redime, Deus, Israel and the site's five numbered notes. The page states no limitation of its own. Its psalter reads Etenim universi qui te exspectant non confundentur (section 3) and Vias tuas, Domine, notas fac mihi (section 4). ACCESS LIMITATION. These exact bytes are not retained because the page states no licence and names no edition for its Latin. The library holds no tracked Latin of this enarratio; its English is held in the NPNF I.8 text, artifact.augustine.enarrationes-in-psalmos.english-npnf8-ccel-web-2026-09-05.ccel-npnf108-text-d6841950, as segment.augustine.enarrationes-in-psalmos.1888-english-npnf-anonymous-first-thirty.psalm-25."
