notes = "A dated delivery state, not a critical edition. The site presents the Latin alongside an Italian translation and does not identify its Latin exemplar on the page consulted. Its wording matches the Latin behind the Nicene and Post-Nicene Fathers English at the section read here; orthographic accidentals differ from Migne, which prints Joannem and adjunxit where this delivery prints Ioannem and adiunxit. Consumers needing a critical Latin text must use the Corpus Christianorum edition of Radbodus Willems, which was not consulted."
