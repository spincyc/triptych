notes = "A dated delivery state, not a critical edition. It is the same route as edition.augustine.in-iohannis-evangelium-tractatus.latin-augustinus-it-web-2026-07-25, which holds tractate 120 from the earlier consultation; this edition holds tractate 26 from the consultation of 2026-09-05. The site presents the Latin alongside an Italian translation and does not identify its Latin exemplar on the page consulted. Consumers needing a critical Latin text must use the Corpus Christianorum edition of Radbodus Willems, which was not consulted. Language pairing: this is the work's original Latin, and the English of the same tractate is registered beside it at edition.augustine.in-iohannis-evangelium-tractatus.english-npnf1-7-new-advent-web-2026-09-05, so both members of the pair are held."
