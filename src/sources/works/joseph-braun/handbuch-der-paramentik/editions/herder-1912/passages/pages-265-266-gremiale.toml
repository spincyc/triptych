context = "Braun describes the contemporary gremial as a cloth about 80 centimetres square spread over a seated bishop's lap. He distinguishes the silk pontifical-Mass gremial from washable linen lap-cloths used for distributions and anointments, explains their protective function, and surveys the gremial's history."
artifact_page_ranges = [[279, 280]]
notes = "Both printed pages were inspected in the exact scan. This passage supports approximate square dimensions, lap placement, the silk-versus-linen functional distinction, and the absence of any need to depict fastening ties. Its historical synthesis does not establish the official ceremonial moments independently of the Caeremoniale Episcoporum."
