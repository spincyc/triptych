context = "The complete numbered section was inspected in the exact raw OCR at artifact lines 72024-72062, under the chapter heading CHAP. XXVII at line 71974. It states that God grants communion to those who continue in love towards him and inflicts on those who depart the separation they have themselves chosen; that separation from God is death and consists in the loss of all the benefits he has in store; that God does not punish them immediately of himself, the punishment falling upon them because they are destitute of all that is good; and that because the good things are eternal, the loss of them is eternal. The blindness-in-a-flood-of-light comparison follows in the same section."
