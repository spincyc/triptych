title = "Decree on the Authenticity of the Apparitions of 1859 at the Shrine of Our Lady of Good Help, Diocese of Green Bay"
responsible = "David L. Ricken, Bishop of Green Bay"
work_type = "diocesan-decree"
languages = ["en"]
description = "The diocesan act of 8 December 2010 concluding an inquiry into the events reported by Adele Brise at Champion, Wisconsin, in October 1859. Structured as recitals under three GIVEN headings and a THEREFORE clause; the operative clause declares with moral certainty that the events, apparitions, and locutions given to Adele Brise in October 1859 do exhibit the substance of supernatural character and approves them as worthy of belief although not obligatory. Made under the CDF Norms of 25 February 1978. Countersigned by the Chancellor with the attestation Concordat cum Originali. The diocesan original was not consulted."
