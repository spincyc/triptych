notes = "The first printing. Public domain in text. Consulted through the John Carter Brown Library digitization at https://archive.org/details/hueitlamahuiolti00lass, whose page images the library states are made available under CC BY 4.0 with the credit line 'Courtesy of the John Carter Brown Library'; a second digitized copy, from the Center for the Study of the History of Mexico CARSO, is at the Library of Congress, https://www.loc.gov/item/2021666123/, which states it is unaware of any copyright or other restrictions in the World Digital Library Collection. The John Carter Brown volume is a composite binding: a later bilingual Spanish-Nahuatl sermon of Our Lady of Guadalupe follows the 1649 tract with its own pagination and is not part of it."
