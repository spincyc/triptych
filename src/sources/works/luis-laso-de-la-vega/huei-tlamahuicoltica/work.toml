description = "The Nahuatl tract printed at Mexico by Juan Ruiz in 1649 under the licences of Baltasar Gonzalez, S.J. (9 January 1649) and of Dr Pedro de Barrientos Lomelin (11 January 1649), published by Luis Laso de la Vega, chaplain and vicar of the Guadalupe hermitage at Tepeyac. It contains a Nahuatl dedicatory address, the apparition narrative conventionally called the Nican mopohua, a description of the image, the miracle list called the Nican motecpana, a closing section opening Nican tlantica, and a Nahuatl prayer. It is the first securely datable witness of the Guadalupe apparition narrative in Nahuatl. Authorship of the narrative itself, and its date of composition, are contested. Loci are the tract's sections and its printed folio numbers."
