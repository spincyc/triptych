  { line = 17800, text = "Why so? Because I am not immortal, but I shall shine more brightly than" },
  { line = 17801, text = "if I were so, for it is not the same thing for one immortal, and for" },
  { line = 17802, text = "one who is mortal, to despise death; so that not even instant death is" },
  { line = 17803, text = "shame to me, yet shall I not die; \"in nothing shall I be put to shame,\"" },
  { line = 17804, text = "neither in life nor death. For I will bear either nobly, whether life" },
  { line = 17805, text = "or death. Well says he! This is the part of a Christian soul! but he" },
  { line = 17806, text = "adds, \"with all boldness.\" Seest thou how entirely I am freed from" },
  { line = 17807, text = "shame? For if the fear of death had cut short my boldness, death would" },
  { line = 17808, text = "have been worthy of shame, but if death at its approach cast no terror" },
  { line = 17809, text = "on me, no shame is here; but whether it be through life I shall not be" },
  { line = 17810, text = "put to shame, for I still preach the Preaching, or whether it be" },
  { line = 17811, text = "through death I shall not be put to shame; fear does not hold me back," },
  { line = 17812, text = "since I still exhibit the same boldness. Do not, when I mention my" },
  { line = 17813, text = "bonds, think shame of the matter; so manifold good hath it caused to" },
  { line = 17814, text = "me, that it hath even given confidence to others. For that we should be" },
  { line = 17815, text = "bound for Christ, is no shame, but for fear of bonds to betray aught" },
  { line = 17816, text = "that is Christ's, this is shame. When there is no such thing, bonds are" },
  { line = 17817, text = "even a cause of boldness. But since I have ofttimes escaped dangers," },
  { line = 17818, text = "and have this to boast of to the unbelievers, do not straightway think" },
  { line = 17819, text = "I am put to shame, if now it should turn out otherwise. The one event" },
  { line = 17820, text = "no less than the other gives you boldness. Note how he brings this" },
  { line = 17821, text = "forward in his own person, which he does in many places, as in the" },
  { line = 17822, text = "Epistle to the Romans; \"For I am not ashamed of the Gospel.\" (Rom. i." },
  { line = 17823, text = "16.) And again in that to the Corinthians; \"And these things I have in" },
  { line = 17824, text = "a figure transferred to myself and Apollos.\" (1 Cor. iv. 6.)--\"Whether" },
  { line = 17825, text = "by life or by death\": this he says not as in ignorance, (for he knew" },
  { line = 17826, text = "that he was not then to die, but some time after); yet even now does he" },
  { line = 17827, text = "prepare their soul." },
  { line = 17829, text = "Ver. 21. \"For to me,\" he says, \"to live is Christ, and to die is gain.\"" },
  { line = 17831, text = "For even in dying, he means, I shall not have died, for I have my life" },
  { line = 17832, text = "in myself: then would they truly have slain me, had they had power" },
  { line = 17833, text = "through this fear to cast faith out of my soul. But as long as Christ" },
  { line = 17834, text = "is with me, even though death overtake me, still I live, and in this" },
  { line = 17835, text = "present life, not this, but Christ is my life. Since, then, not even in" },
  { line = 17836, text = "the present life is it so, \"but that life which I now live in the flesh" },
  { line = 17837, text = "I live in faith;\" so I say in that state also, \"I live, yet not I, but" },
  { line = 17838, text = "Christ liveth in me.\" (Gal. ii. 20.) Such ought a Christian to be! I" },
  { line = 17839, text = "live not, he says, the common life. How livest thou then, O blessed" },
  { line = 17840, text = "Paul? Dost thou not see the sun, dost thou not breathe the common air?" },
  { line = 17841, text = "art thou not nourished with the same food as others? dost thou not" },
  { line = 17842, text = "tread the earth as we? needest thou not sleep, nor clothing, nor shoes?" },
  { line = 17843, text = "what meanest thou by, \"I live not\"? how dost thou not live? Why" },
  { line = 17844, text = "boastest thou thyself? No boasting is here. For if indeed the fact did" },
  { line = 17845, text = "not witness to him, a man might with some show have called it boasting;" },
  { line = 17846, text = "but if facts do witness, how is boasting here? Let us then learn how he" },
  { line = 17847, text = "lives not, for he himself says in another place, \"I have been crucified" },
  { line = 17848, text = "to the world, and the world to me.\" (Gal. vi. 14.) Hear then how he" },
  { line = 17849, text = "says, \"I no longer live.\" And how he says, \"to me to live is Christ.\"" },
  { line = 17850, text = "The word \"life\" is much significant, beloved, as also the word \"death.\"" },
  { line = 17851, text = "There is this life of the body, there is the life of sin, as he himself" },
  { line = 17852, text = "elsewhere says, \"But if we died to sin, how shall we any longer live" },
  { line = 17853, text = "therein?\" (Rom. vi. 2.) It is then possible to live the life of sin." },
  { line = 17854, text = "Attend diligently, I entreat you, lest my labor be vain. There is the" },
  { line = 17855, text = "life everlasting and immortal; with eternal life the heavenly; \"for our" },
  { line = 17856, text = "citizenship,\" says he, \"is in heaven\" (Philip. iii. 20.) There is the" },
  { line = 17857, text = "life of the body whereof he speaks, \"through him we live and move and" },
  { line = 17858, text = "have our being.\" (Acts xvii. 28.) He does not then deny that he lives" },
  { line = 17859, text = "the natural life, but that of sin, which all men live. He who desires" },
  { line = 17860, text = "not the present life, how does he live it? He who is hastening to" },
  { line = 17861, text = "another, how does he live this life? He who despiseth death, how does" },
  { line = 17862, text = "he live this life? He who desires nothing, how does he live it? For as" },
  { line = 17863, text = "one made of adamant, though he were struck a thousand blows, would" },
  { line = 17864, text = "never attend to it, no more would Paul. And \"I live,\" says he, \"but no" },
  { line = 17865, text = "longer I,\" that is, no longer the old man; as again elsewhere," },
  { line = 17866, text = "\"Wretched man that I am, who shall deliver me out of the body of this" },
  { line = 17867, text = "death!\" (Rom. vii. 24.) How too does he live who does nought for the" },
  { line = 17868, text = "sake of food, nought for the sake of clothing, nought for any of these" },
  { line = 17869, text = "present things? Such an one does not even live the natural life: he who" },
  { line = 17870, text = "takes thought for none of the things which sustain life, lives not. We" },
  { line = 17871, text = "live this life, whose every action regards it. But he lived not; he" },
  { line = 17872, text = "busied himself about nought of the things here. How then lived he? Just" },
  { line = 17873, text = "as we are accustomed to say, in common matters, such an one is not with" },
  { line = 17874, text = "me, when he does nothing that pertains to me. Again, in like sort, such" },
  { line = 17875, text = "a man lives not for me. Elsewhere he shows that he rejects not the" },
  { line = 17876, text = "natural life: \"The life which I now live in the flesh, I live in the" },
  { line = 17877, text = "faith of the Son of God, who loved me, and gave himself for me\" (Gal." },
  { line = 17878, text = "ii. 20.); i.e. a certain new life I live, an altered one. And truly all" },
  { line = 17879, text = "these things he said to comfort the Philippians. Think not, says he," },
  { line = 17880, text = "that I shall be deprived of this life, for neither whilst alive did I" },
  { line = 17881, text = "live this life, but that which Christ willed. For tell me? He who" },
  { line = 17882, text = "despises money, luxury, hunger, thirst, dangers, health, safety, does" },
  { line = 17883, text = "he live this life? He who has nothing here, and is ofttimes willing to" },
  { line = 17884, text = "cast life away, if need be, and clings not to it, does he live this" },
  { line = 17885, text = "life? By no means. This I must make clear to you by a kind of example." },
  { line = 17886, text = "Let us imagine some one in great wealth, with many servants, and much" },
  { line = 17887, text = "gold, and who makes no use of all these things; is such an one rich for" },
  { line = 17888, text = "all his wealth? By no means. Let him see his children dissipating his" },
  { line = 17889, text = "property, strolling idly about; let him feel no concern for them; when" },
  { line = 17890, text = "beaten let him not even be pained; shall we call him a man of wealth?" },
  { line = 17891, text = "By no means; although his wealth is his own. \"To me,\" he says, \"to live" },
  { line = 17892, text = "is Christ;\" if you will enquire of my life, it is He. \"And to die is" },
  { line = 17893, text = "gain.\" Wherefore? Because I shall more clearly be present with Him; so" },
  { line = 17894, text = "that my death is rather a coming to life; they who kill me will work on" },
  { line = 17895, text = "me no dreadful thing, they will only send me onward to my proper life," },
  { line = 17896, text = "and free me from that which is not mine. What then, while thou wert" },
  { line = 17897, text = "here, wert thou not Christ's? Yes, and in a high degree." },
  { line = 17899, text = "Ver. 22. \"But if to live in the flesh,--if this is the fruit of my" },
  { line = 17900, text = "work, then what I shall choose I wot not.\"" },
  { line = 17902, text = "Lest any should say, If what you say is life, wherefore hath Christ" },
  { line = 17903, text = "left you here? \"It is,\" he says, \"the fruit of my work;\" so that it is" },
  { line = 17904, text = "possible to use to good purpose the present life, while not living it." },
  { line = 17905, text = "Lest you should think that reproach is cast upon life. For if we gain" },
  { line = 17906, text = "no advantage here, wherefore do we not make away with ourselves, nor" },
  { line = 17907, text = "slay ourselves? By no means, he answers. It is open to us to profit" },
  { line = 17908, text = "even here, if we live not this, but another life. But perchance one" },
  { line = 17909, text = "will say, does this bear thee fruit? Yes! he answers. Where are now the" },
  { line = 17910, text = "heretics? Behold now; \"to live in the flesh,\" this is \"the fruit of his" },
  { line = 17911, text = "work.\" \"That which I now live in the flesh, I live in faith;\" therefore" },
  { line = 17912, text = "it is \"the fruit of my work.\"" },
  { line = 17914, text = "\"And what I shall choose I know not.\" Marvelous! How great was his" },
  { line = 17915, text = "philosophy! How hath he both cast out the desire of the present life," },
  { line = 17916, text = "and yet thrown no reproach upon it! For in that he saith, \"to die is" },
  { line = 17917, text = "gain,\" by this he hath cast out the desire, but in that he saith, \"to" },
  { line = 17918, text = "live in the flesh is the fruit of my work,\" here he shows that the" },
  { line = 17919, text = "present life also is needful, if we use it as need is, if we bear" },
  { line = 17920, text = "fruit; since if it be unfruitful, it is no longer life. For we despise" },
  { line = 17921, text = "those trees which bear no fruit, as though they were dry, and give them" },
  { line = 17922, text = "up to the fire. Life itself belongs to that middle class of indifferent" },
  { line = 17923, text = "things, whilst to live well or ill is in ourselves. We do not then hate" },
  { line = 17924, text = "life, for we may live well too. So even if we use it ill, we do not" },
  { line = 17925, text = "even then cast the blame on it. And wherefore? Because not itself, but" },
  { line = 17926, text = "the free choice of those who use it ill is to blame. For God hath made" },
  { line = 17927, text = "thee live, that thou mayest live to Him. But thou, by living through" },
  { line = 17928, text = "corruption unto sin, makest thyself accountable for all blame. What" },
  { line = 17929, text = "sayest thou, tell me. Thou knowest not what to choose? Here hath he" },
  { line = 17930, text = "revealed a great mystery, in that his departure was in his own power;" },
  { line = 17931, text = "for where choice is, there have we power. \"What I shall choose,\" says" },
  { line = 17932, text = "he, \"I know not.\" Is it in thine own power? Yes, he answers, if I would" },
  { line = 17933, text = "ask this grace of God." },
  { line = 17935, text = "Ver. 23. \"I am in a strait betwixt the two, having the desire.\"" },
  { line = 17937, text = "See the affection of this blessed one; in this way too he comforts" },
  { line = 17938, text = "them, when they see that he is master of his own choice, and that this" },
  { line = 17939, text = "is done not by man's sin, but by the dispensation of God. Why mourn ye," },
  { line = 17940, text = "says he, at my death? It had been far better to have passed away long" },
  { line = 17941, text = "since. \"For to depart,\" he says, \"and to be with Christ, is very far" },
  { line = 17942, text = "better.\"" },
  { line = 17944, text = "Ver. 24. \"Yet to abide in the flesh is more needful for your sake.\"" },
  { line = 17946, text = "These words were to prepare them for his death when it came, that they" },
  { line = 17947, text = "might bear it nobly: this was to teach true wisdom. \"It is good for me" },
  { line = 17948, text = "to depart and be with Christ,\" for even death is a thing indifferent;" },
  { line = 17949, text = "since death itself is no ill, but to be punished after death is an ill." },
  { line = 17950, text = "Nor is death a good, but it is good after our departure \"to be with" },
  { line = 17951, text = "Christ.\" What follows death is either good or ill." },
  { line = 17953, text = "Let us then not simply grieve for the dead, nor joy for the living" },
  { line = 17954, text = "simply. But how? Let us grieve for sinners, not only when dying, but" },
  { line = 17955, text = "also while living. Let us joy for the just, not only while living, but" },
  { line = 17956, text = "also when dead. For those though living are dead, while these although" },
  { line = 17957, text = "dead, yet live: those even while here are to be pitied of all, because" },
  { line = 17958, text = "they are at enmity with God; the other even when they have departed" },
  { line = 17959, text = "Thither, are blessed, because they are gone to Christ. Sinners," },
  { line = 17960, text = "wherever they are, are far from the King. Therefore they are subjects" },
  { line = 17961, text = "for tears; while the just, be they here, or be they there, are with the" },
  { line = 17962, text = "King; and there, in a higher and nearer degree, not through an" },
  { line = 17963, text = "entrance," },
  { line = 17963, text = "or by faith, but \"face to face.\" (1 Cor. xiii. 12.)" },
  { line = 17965, text = "Let us then not make wailings for the dead simply, but for those who" },
  { line = 17966, text = "have died in sins. They deserve wailing; they deserve beating of the" },
  { line = 17967, text = "breast and tears. For tell me what hope is there, when our sins" },
  { line = 17968, text = "accompany us Thither, where there is no putting off sins? As long as" },
  { line = 17969, text = "they were here, perchance there was great expectation that they would" },
  { line = 17970, text = "change, that they would become better; but when they are gone to Hades," },
  { line = 17971, text = "where nought can be gained from repentance (for it is written, \"In" },
  { line = 17972, text = "Sheol who shall give thee thanks?\") (Ps. vi. 5.), are they not worthy" },
  { line = 17973, text = "of our lamentation? Let us wail for those who depart hence in such" },
  { line = 17974, text = "sort; let us wail, I hinder you not; yet in no unseemly way, not in" },
  { line = 17975, text = "tearing our hair, or baring our arms, or lacerating our face, or" },
  { line = 17976, text = "wearing black apparel, but only in soul, shedding in quiet the bitter" },
  { line = 17977, text = "tear. For we may weep bitterly without all that display. And not as in" },
  { line = 17978, text = "sport only. For the laments which many make differ not from sport." },
  { line = 17979, text = "Those public mournings do not proceed from sympathy, but from display," },
  { line = 17980, text = "from emulation and vainglory. Many women do this as of their craft." },
  { line = 17981, text = "Weep bitterly; moan at home, when no one sees you; this is the part of" },
  { line = 17982, text = "true sympathy; by this you profit yourself too. For he who laments" },
  { line = 17983, text = "another in such sort, will be much the more earnest never to fall into" },
  { line = 17984, text = "the same sins. Sin henceforth will be an object of dread to thee. Weep" },
  { line = 17985, text = "for the unbelievers; weep for those who differ in nowise from them," },
  { line = 17986, text = "those who depart hence without the illumination," },
  { line = 17986, text = "without the" },
  { line = 17987, text = "seal! they indeed deserve our wailing, they deserve our groans; they" },
  { line = 17988, text = "are outside the Palace, with the culprits, with the condemned: for," },
  { line = 17989, text = "\"Verily I say unto you, Except a man be born of water and the Spirit," },
  { line = 17990, text = "he shall not enter into the kingdom of Heaven.\" Mourn for those who" },
  { line = 17991, text = "have died in wealth, and did not from their wealth think of any solace" },
  { line = 17992, text = "for their soul, who had power to wash away their sins and would not." },
  { line = 17993, text = "Let us all weep for these in private and in public, but with propriety," },
  { line = 17994, text = "with gravity, not so as to make exhibitions of ourselves; let us weep" },
  { line = 17995, text = "for these, not one day, or two, but all our life. Such tears spring not" },
  { line = 17996, text = "from senseless passion, but from true affection. The other sort are of" },
  { line = 17997, text = "senseless passion. For this cause they are quickly quenched, whereas if" },
  { line = 17998, text = "they spring from the fear of God, they always abide with us. Let us" },
  { line = 17999, text = "weep for these; let us assist them according to our power; let us think" },
  { line = 18000, text = "of some assistance for them, small though it be, yet still let us" },
  { line = 18001, text = "assist them. How and in what way? By praying and entreating others to" },
  { line = 18002, text = "make prayers for them, by continually giving to the poor on their" },
  { line = 18003, text = "behalf. This deed hath some consolation; for hear the words of God" },
  { line = 18004, text = "Himself, when He says, \"I will defend this city for Mine own sake, and" },
  { line = 18005, text = "for My servant David's sake.\" (2 Kings xx. 6.) If the remembrance only" },
  { line = 18006, text = "of a just man had so great power when deeds are done for one, how great" },
  { line = 18007, text = "power will it not have? Not in vain did the Apostles order" },
  { line = 18007, text = "that" },
  { line = 18008, text = "remembrance should be made of the dead in the dreadful Mysteries. They" },
  { line = 18009, text = "know that great gain resulteth to them, great benefit; for when the" },
  { line = 18010, text = "whole people stands with uplifted hands, a priestly assembly, and that" },
  { line = 18011, text = "awful Sacrifice lies displayed, how shall we not prevail with God by" },
  { line = 18012, text = "our entreaties for them? And this we do for those who have departed in" },
  { line = 18013, text = "faith," },
  { line = 18013, text = "whilst the catechumens are not thought worthy even of this" },
  { line = 18014, text = "consolation, but are deprived of all means of help save one. And what" },
  { line = 18015, text = "is this? We may give to the poor on their behalf. This deed in a" },
  { line = 18016, text = "certain way refreshes them. For God wills that we should be mutually" },
  { line = 18017, text = "assisted; else why hath He ordered us to pray for peace and the good" },
  { line = 18018, text = "estate of the world? why on behalf of all men? since in this number are" },
  { line = 18019, text = "included robbers, violaters of tombs, thieves, men laden with untold" },
  { line = 18020, text = "crimes; and yet we pray on behalf of all; perchance they may turn. As" },
  { line = 18021, text = "then we pray for those living, who differ not from the dead, so too we" },
  { line = 18022, text = "may pray for them. Job offered sacrifice for his children, and freed" },
  { line = 18023, text = "them from their sins. \"It may be,\" said he, \"that they have renounced" },
  { line = 18024, text = "God in their hearts.\" (Job i. 5.) Thus does one provide for one's" },
  { line = 18025, text = "children! He said not, as many do nowadays, I will leave them property;" },
  { line = 18026, text = "he said not, I will procure them honor; he said not, I will purchase an" },
  { line = 18027, text = "office; he said not, I will buy them land; but, \"it may be that they" },
  { line = 18028, text = "have renounced God in their hearts.\" For what profit is there in those" },
  { line = 18029, text = "things? None at all, in those that remain here. I will make the King of" },
  { line = 18030, text = "all things favorable to them, and then they will no more want any" },
  { line = 18031, text = "thing. \"The Lord,\" saith one, \"is my Shepherd, I shall not want.\" (Ps." },
  { line = 18032, text = "xxiii. 4.) This is great wealth, this is treasure. If we have the fear" },
  { line = 18033, text = "of God, we want nothing; if we have not this, though we have royalty" },
  { line = 18034, text = "itself, we are the poorest of all men. Nothing is like the man that" },
  { line = 18035, text = "feareth the Lord. For \"the fear of the Lord,\" it is said, \"surpasseth" },
  { line = 18036, text = "all things.\" (Ecclus. xxv. 11.) This let us procure; let us do all" },
  { line = 18037, text = "things for its sake. If need be that we lay down our lives, if our body" },
  { line = 18038, text = "must be mangled, let us not spare them; let us do all, to obtain this" },
  { line = 18039, text = "fear. For thus shall we abound above all men; and shall obtain those" },
  { line = 18040, text = "good things to come in Christ Jesus our Lord, to whom, &c." },
]
verified_on = "2026-10-23"
notes = "Exact CCEL English digital witness inspected; no Greek or Latin original-language collation, no facsimile collation, and no claim of identity with New Advent revisions. Rechecked 2026-10-23: explicit translated body at physical lines 17717-18040, checked line by line against the hash-pinned controller. Text preserves the historical translation's wording, spelling, punctuation, verse labels and inline lexical glosses; only wrapping whitespace and numeric footnote calls are removed. The existing physical_line_ranges retain the notes as inspectable surrounding context; those notes are not attributed to Chrysostom in text."
