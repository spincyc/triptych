  { line = 18130, text = "for this, thou oughtest to desire thy release; were the present full of" },
  { line = 18131, text = "innumerable goods, yet for the sake of Christ thy Desire." },
  { line = 18133, text = "Oh that spirit of Paul! nothing was ever like it, nor ever will be!" },
  { line = 18134, text = "Thou fearest the future, thou art compassed by innumerable dreadful" },
  { line = 18135, text = "things, and wilt thou not be with Christ? No, he answers, and this for" },
  { line = 18136, text = "Christ's sake, that I may render more loving unto Him those whom I have" },
  { line = 18137, text = "made his servants, that I may make the plot" },
  { line = 18137, text = "which I have planted" },
  { line = 18138, text = "bear much fruit. (1 Cor. iii. 9.). Didst thou not hear me, when I" },
  { line = 18139, text = "declared that I sought not \"that which profited myself\" (1 Cor. x." },
  { line = 18140, text = "33.), but my neighbor? Heardest thou not these words, \"I could wish" },
  { line = 18141, text = "that I myself were anathema from Christ\" (Rom. ix. 3.), that many might" },
  { line = 18142, text = "come unto Him? I, who chose that part, shall I not much rather choose" },
  { line = 18143, text = "this, shall I not with pleasure harm myself by this delay and" },
  { line = 18144, text = "postponement, that they may be saved?" },
  { line = 18146, text = "\"Who shall utter Thy mighty acts, O Lord\" (Psa. cvi. 2.), because Thou" },
  { line = 18147, text = "sufferedst not Paul to be hidden, because Thou madest manifest to the" },
  { line = 18148, text = "world such a man? All the Angels of God praised Thee with one accord," },
  { line = 18149, text = "when Thou madest the stars (Job xxxviii. 7.), and so too surely when" },
  { line = 18150, text = "Thou madest the sun, but not so much as when Thou didst manifest Paul" },
  { line = 18151, text = "to the whole world. By this, the earth was made more brilliant than the" },
  { line = 18152, text = "heaven, for he is brighter than the solar light, he hath shot forth" },
  { line = 18153, text = "more brilliant rays, he hath shed abroad more joyous beams. What fruit" },
  { line = 18154, text = "hath this man borne for us! not by making fat our corn, not by" },
  { line = 18155, text = "nurturing our pomegranates, but by producing and perfecting the fruit" },
  { line = 18156, text = "of holiness, and when falling to pieces, continually recovering them." },
  { line = 18157, text = "For the sun itself can nothing profit fruits that are once decayed, but" },
  { line = 18158, text = "Paul has called out of their sins those who had manifold decays. And it" },
  { line = 18159, text = "gives place to the night, but he had mastery over the Devil. Nothing" },
  { line = 18160, text = "ever subdued him, nothing mastered him. The sun, when it mounts the" },
  { line = 18161, text = "heavens, darts down its rays, but he, as he rose from beneath, filled" },
  { line = 18162, text = "not the mid space of heaven and earth with light, but as soon as he" },
  { line = 18163, text = "opened his mouth, filled the Angels with exceeding joy. For if \"there" },
  { line = 18164, text = "is joy in heaven over one sinner that repenteth\" (Luke xv. 7.), while" },
  { line = 18165, text = "he at his first address caught multitudes, does he not fill with joy" },
  { line = 18166, text = "the Powers above? What say I? It sufficeth that Paul should only be" },
  { line = 18167, text = "named, and the heavens leap for joy. For if when the Israelites \"went" },
  { line = 18168, text = "forth out of Egypt, the mountains skipped like rams\" (Psa. cxiv. 4.)," },
  { line = 18169, text = "how great, thinkest thou, was the joy, when men ascended from earth to" },
  { line = 18170, text = "heaven!" },
  { line = 18172, text = "Ver. 24. For this cause \"to abide in the flesh is more needful for your" },
  { line = 18173, text = "sake.\"" },
  { line = 18175, text = "And what excuse is left to us? ofttimes it happens that a man who" },
  { line = 18176, text = "possesses a little and poor city, chooses not to depart to another" },
  { line = 18177, text = "place, preferring his own rest. Paul might depart to Christ, and would" },
  { line = 18178, text = "not, (Christ whom he so desired, as for his sake to choose even hell," },
  { line = 18179, text = ") but still remained in the contest on behalf of man. What excuse" },
  { line = 18180, text = "shall we have? May we then even make mention of Paul? Look to his" },
  { line = 18181, text = "deeds. He showed that to depart was better, persuading himself not to" },
  { line = 18182, text = "grieve: he showed them, that if he remained, he remained for their" },
  { line = 18183, text = "sake, that it proceeded not from wickedness of those who plotted" },
  { line = 18184, text = "against him. He subjoined also the reason, that he might secure their" },
  { line = 18185, text = "belief. For if this is necessary, that is, I shall by all means remain," },
  { line = 18186, text = "and I will not \"remain\" simply, but \"will remain with you.\" For this is" },
  { line = 18187, text = "the meaning of the word, \"and I shall abide with,\" i.e. I shall see" },
  { line = 18188, text = "you. For what cause? \"For your progress and joy in the faith.\" Here too" },
  { line = 18189, text = "he rouses them, to take heed unto themselves. If, says he, for your" },
  { line = 18190, text = "sakes I abide, see that ye shame not my abiding. \"For your progress,\" I" },
  { line = 18191, text = "have chosen to remain, when I was about to see Christ. I have chosen to" },
  { line = 18192, text = "remain, because my presence advances both your faith and your joy. What" },
  { line = 18193, text = "then? Did he remain for the sake of the Philippians only? He stayed not" },
  { line = 18194, text = "for their sake only; but this he says, that he may show regard to them." },
  { line = 18195, text = "And how were they to \"progress\" in \"the faith \"? That you may be more" },
  { line = 18196, text = "strengthened, like young fowl, who need their mother until their" },
  { line = 18197, text = "feathers are set. This is a proof of his great love. In like sort, we" },
  { line = 18198, text = "also rouse some of you, when we say, for your sake have I remained," },
  { line = 18199, text = "that I may make you good." },
  { line = 18201, text = "Ver. 26. \"That your glorying may abound in Christ Jesus in me, through" },
  { line = 18202, text = "my presence with you again.\"" },
  { line = 18204, text = "You see that this explains the word \"abide with you.\" Behold his" },
  { line = 18205, text = "humility. Having said, \"for your progress,\" he shows that it was for" },
  { line = 18206, text = "his own profit too. This also he does, when he writes to the Romans," },
  { line = 18207, text = "and says, \"That is, that we may be comforted together in you.\" (Rom. i." },
  { line = 18208, text = "11, 12.) Having previously said, \"That I may impart unto you some" },
  { line = 18209, text = "spiritual gift.\" And what means, \"That your glorying may abound\"? This" },
  { line = 18210, text = "glorying was, their establishment in the faith. For an upright life is" },
  { line = 18211, text = "glorying in Christ. And sayest thou, \"Your glorying in me, through my" },
  { line = 18212, text = "presence with you again\"? Yes, he answers; \"For what is our hope, or" },
  { line = 18213, text = "crown of glorying? Are not even ye?\" (1 Thess. ii. 19.) Because \"you" },
  { line = 18214, text = "are our glorying, even as we also are yours\" (2 Cor. i. 14.), i.e. that" },
  { line = 18215, text = "I may be able to rejoice in you greatly. How sayest thou, \"That your" },
  { line = 18216, text = "glorying may abound\"? I may glory the more when you make progress." },
  { line = 18219, text = "\"Through my presence with you again.\" What then! Did he come to them?" },
  { line = 18220, text = "Search ye whether he came." },
  { line = 18222, text = "Ver. 27. \"Only let your manner of life be worthy of the Gospel of" },
  { line = 18223, text = "Christ.\"" },
  { line = 18225, text = "Do you see, how all that he has said, tends to turn them to this one" },
  { line = 18226, text = "thing, advancement in virtue? \"Only let your manner of life be worthy" },
  { line = 18227, text = "of the Gospel of Christ.\" What means this word \"only,\" but that this," },
  { line = 18228, text = "and nought else, is the only thing we should seek? If we have this," },
  { line = 18229, text = "nothing grievous will befall us. \"That whether I come and see you, or" },
  { line = 18230, text = "be absent, I may hear of your state.\" This he says not as if he had" },
  { line = 18231, text = "changed his purpose, and no longer meant to visit them. But if this" },
  { line = 18232, text = "come to pass, he says, even though absent, I am able to rejoice. \"If,\"" },
  { line = 18233, text = "that is, \"I hear that ye stand fast in one spirit, with one soul.\" This" },
  { line = 18234, text = "is what above all things unites believers, and maintains love unbroken," },
  { line = 18235, text = "\"that they may be one.\" (John xvii. 11.) For a \"kingdom divided against" },
  { line = 18236, text = "itself shall not stand.\" (Mark iii. 24.) For this cause he everywhere" },
  { line = 18237, text = "counsels his disciples much to be of one mind. And Christ says, \"By" },
  { line = 18238, text = "this shall all men know that ye are My disciples, if ye love one" },
  { line = 18239, text = "another.\" (John xiii. 35.) That is, do not look with expectation toward" },
  { line = 18240, text = "me, and therefore slumber, as waiting for my coming, and then, when ye" },
  { line = 18241, text = "see me not coming faint. For even from report I can receive pleasure" },
  { line = 18242, text = "likewise." },
  { line = 18244, text = "What means, \"In one spirit\"? By the same gift of grace, viz. that of" },
  { line = 18245, text = "concord, and zeal; for the Spirit" },
  { line = 18245, text = "is one, and he shows it; for" },
  { line = 18246, text = "then are we able to stand in \"one soul,\" also, when we all have \"one" },
  { line = 18247, text = "Spirit.\" See how the word \"one\" is used for concord. See how their" },
  { line = 18248, text = "souls being many are called one. Thus was it of old. \"For they were" },
  { line = 18249, text = "all,\" it is written, \"of one heart and of one soul. Striving together" },
  { line = 18250, text = "for the faith of the Gospel.\" (Acts iv. 32.) Does he say, striving" },
  { line = 18251, text = "together for each other," },
  { line = 18251, text = "as though the faith did strive? For did" },
  { line = 18252, text = "they wrestle against each other? But help each other, he says, in your" },
  { line = 18253, text = "striving for the faith of the Gospel." },
  { line = 18255, text = "Ver. 28. \"And in nothing affrighted by the adversaries; which is for" },
  { line = 18256, text = "them an evident token of perdition, but to you of salvation.\"" },
  { line = 18258, text = "Well said he, \"affrighted,\" this is what befalls us from our enemies," },
  { line = 18259, text = "they only frighten. \"In nothing\" therefore, he says, whatever happens," },
  { line = 18260, text = "whether dangers--whether plots. For this is the part of those who stand" },
  { line = 18261, text = "upright; the enemy can do nought but frighten only. Since it was likely" },
  { line = 18262, text = "that they should be greatly troubled, when Paul suffered such" },
  { line = 18263, text = "numberless ills, he says, I exhort you not only not to be shaken, but" },
  { line = 18264, text = "not to be affrighted, yea rather to despise them heartily; for if ye" },
  { line = 18265, text = "are thus affected, ye will straightway, by this means, make evident at" },
  { line = 18266, text = "once their destruction, and your salvation. For when they see, that" },
  { line = 18267, text = "with their innumerable plots they are unable to frighten you, they will" },
  { line = 18268, text = "take it as a proof of their own destruction. For when the persecutors" },
  { line = 18269, text = "prevail not over the persecuted, the plotters over the objects of their" },
  { line = 18270, text = "plots, the powerful over those subject to their power, will it not be" },
  { line = 18271, text = "self-evident, that their perdition is at hand, that their power is" },
  { line = 18272, text = "nought, that their part is false, that their" },
  { line = 18272, text = "part is weak? \"And" },
  { line = 18273, text = "this,\" he says, \"comes from God.\"" },
  { line = 18275, text = "Ver. 29. \"For unto you it is given in the behalf of Christ, not only to" },
  { line = 18276, text = "believe on Him, but also to suffer in his behalf.\"" },
  { line = 18278, text = "Again does he teach them moderation of spirit by referring all to God," },
  { line = 18279, text = "and saying that sufferings in behalf of Christ are of grace, the gift" },
  { line = 18280, text = "of grace, a free gift. Be not then ashamed of the gift of grace, for it" },
  { line = 18281, text = "is more wonderful than the power of raising the dead, or working" },
  { line = 18282, text = "miracles; for there I am a debtor, but here I have Christ for my" },
  { line = 18283, text = "debtor. Wherefore ought we not only not to be ashamed, but even to" },
  { line = 18284, text = "rejoice, in that we have this gift. Virtues he calls gifts, yet not in" },
  { line = 18285, text = "like sort as other things, for those are entirely of God, but in these" },
  { line = 18286, text = "we have a share. But since even here the greatest part is of God, he" },
  { line = 18287, text = "ascribes it entirely to Him, not to overturn our free will, but to make" },
  { line = 18288, text = "us humble and rightly disposed." },
  { line = 18290, text = "Ver. 30. \"Having the same conflict which ye saw in me\"; i.e. ye have" },
  { line = 18291, text = "also an example. Here again he raises them up, by showing them that" },
  { line = 18292, text = "everywhere their conflicts were the same with his, their struggles were" },
  { line = 18293, text = "the same with his, both severally, and in that they united with him in" },
  { line = 18294, text = "bearing trials. He said not, ye have heard, but \"ye saw,\" for he strove" },
  { line = 18295, text = "too at Philippi. Truly this is an exceeding virtue. Wherefore writing" },
  { line = 18296, text = "to the Galatians, also he said, \"Did ye suffer so many things in vain," },
  { line = 18297, text = "if it be indeed in vain.\" (Gal. iii. 4.) And again, writing to the" },
  { line = 18298, text = "Hebrews, he said, \"But call to remembrance the former days, in which," },
  { line = 18299, text = "after ye were enlightened, ye endured a great conflict of suffering;" },
  { line = 18300, text = "partly, being made a gazing-stock both by reproaches and afflictions.\"" },
  { line = 18301, text = "(Heb. x. 32, 33.) And writing again to Macedonians, that is, to the" },
  { line = 18302, text = "Thessalonians, he said, \"For they themselves report concerning us, what" },
  { line = 18303, text = "manner of entering in we had unto you.\" (1 Thess. i. 9.) And again," },
  { line = 18304, text = "\"For yourselves, brethren, know our entering in unto you, that it hath" },
  { line = 18305, text = "not been found vain.\" (1 Thess. ii. 1.) And in like sort does he" },
  { line = 18306, text = "witness the same things of them all, labors and strivings. But such" },
  { line = 18307, text = "things ye will not now find among us; now it is much if one suffer a" },
  { line = 18308, text = "little in goods alone. And in respect of their goods also he witnesses" },
  { line = 18309, text = "great things of them. For to some he says, \"For ye took joyfully the" },
  { line = 18310, text = "spoiling of your possessions\" (Heb. x. 34.); and to others, \"For it" },
  { line = 18311, text = "hath been the good pleasure of Macedonia and Achaia to make a certain" },
  { line = 18312, text = "contribution for the poor\" (Rom. xv. 26.); and \"your zeal hath stirred" },
  { line = 18313, text = "up very many of them.\" (2 Cor. ix. 2.)" },
  { line = 18315, text = "Seest thou the praises of the men of that time? But we endure not so" },
  { line = 18316, text = "much as buffetings or blows, neither insult nor loss of our" },
  { line = 18317, text = "possessions: they were straightway zealous, and all of them strove as" },
  { line = 18318, text = "martyrs, whilst we have grown cold in love toward Christ. Again I am" },
  { line = 18319, text = "constrained to accuse things present; and what shall I do? It is" },
  { line = 18320, text = "against my will, yet am I constrained. Were I able by my silence of" },
  { line = 18321, text = "things which are done, by holding my peace, and not mentioning aught," },
  { line = 18322, text = "to remove them, it would behoove me to be silent. But if the contrary" },
  { line = 18323, text = "comes to pass; if not only are these things not removed by our silence," },
  { line = 18324, text = "but even become worse, we are forced to speak. For he who rebukes" },
  { line = 18325, text = "sinners, if he does nought else, suffers them not to go farther. For" },
  { line = 18326, text = "there is no such shameless and rash soul, as not to turn, and remit the" },
  { line = 18327, text = "extravagance of its evil deeds, on hearing any one continually rebuking" },
  { line = 18328, text = "it. There is, there is indeed, even in the shameless, a small portion" },
  { line = 18329, text = "of shame. For God hath sown in our nature the seeds of shame; for since" },
  { line = 18330, text = "fear was insufficient to bring us to a right tone, He hath also" },
  { line = 18331, text = "prepared many other ways for avoiding sin. For example, that a man" },
  { line = 18332, text = "should be accused, fear of the enacted laws," },
  { line = 18332, text = "love of reputation," },
  { line = 18333, text = "the desire of forming friendships; for all these are paths to avoid" },
  { line = 18334, text = "sin. Ofttimes that which was not done for God's sake, was done through" },
  { line = 18335, text = "shame; that which was not done for God's sake, was done for fear of" },
  { line = 18336, text = "men. That which we seek for is, in the first place not to sin, and we" },
  { line = 18337, text = "shall afterwards succeed in doing this for God's sake. Else why did" },
  { line = 18338, text = "Paul exhort those, who were about to overcome" },
  { line = 18338, text = "their enemies, not" },
  { line = 18339, text = "by the fear of God, but on the score of waiting for the vengeance?" },
  { line = 18340, text = "\"For by so doing,\" he says, \"thou shalt heap coals of fire upon" },
  { line = 18341, text = "his head.\" (Rom. xii. 20.) For this is his first wish, that our virtue" },
  { line = 18342, text = "should be established. As I said then, there is in us a sense of shame." },
  { line = 18343, text = "We have many good natural affections, which lead to virtue; as, for" },
  { line = 18344, text = "example, all of us men are naturally moved to pity, and no other good" },
  { line = 18345, text = "thing so inheres in our nature, but this alone. Whence any one might" },
  { line = 18346, text = "reasonably enquire, wherefore these seeds have above all others been" },
  { line = 18347, text = "sown in our nature, by which we melt" },
  { line = 18347, text = "at tears, by which we are" },
  { line = 18348, text = "turned to compassion, and are ready to pity. No one is naturally idle," },
  { line = 18349, text = "no one is naturally regardless of his reputation, no one is" },
  { line = 18350, text = "naturally above emulation, but pity lies deep in every one's nature," },
  { line = 18351, text = "however fierce and ungentle he be. And what wonder? we pity beasts," },
  { line = 18352, text = "such a superabundance of pity lies deep in us. If we see a lion's" },
  { line = 18353, text = "whelp, we are somewhat affected; much more in the case of one of our" },
  { line = 18354, text = "race. See, how many maimed are there! and this is sufficient to lead us" },
  { line = 18355, text = "to pity. Nothing so much pleases God as mercy." },
  { line = 18355, text = "Wherefore with" },
  { line = 18356, text = "this the priests were anointed, and the kings, and the prophets, for" },
  { line = 18357, text = "they had, in oil, a type of God's love to man; and they further learnt," },
  { line = 18358, text = "that rulers should have a greater share of mercy." },
  { line = 18358, text = "It showed that" },
  { line = 18359, text = "the Spirit is to come to men through mercy, since God pities and is" },
  { line = 18360, text = "kind to man. For, \"Thou hast mercy upon all,\" it is written, \"for Thou" },
  { line = 18361, text = "canst do all things.\" (Wisd. xi. 23.) For this cause they were anointed" },
  { line = 18362, text = "with oil: and indeed it was from mercy He appointed the priesthood. And" },
  { line = 18363, text = "kings were anointed with oil; and would one praise a ruler, he can make" },
  { line = 18364, text = "mention of nothing so becoming him as mercy. For pity is peculiar to" },
  { line = 18365, text = "power. Consider that the world was established by pity," },
  { line = 18365, text = "and then" },
  { line = 18366, text = "imitate thy Lord. \"The mercy of man is toward his neighbor, but the" },
  { line = 18367, text = "mercy of the Lord is upon all flesh.\" (Ecclus. xviii. 13.) How \"upon" },
  { line = 18368, text = "all flesh\"? Whether you mean sinners, or just men, we all need the" },
  { line = 18369, text = "mercy of God; we all enjoy it, be it Paul, be it Peter, or be it John." },
  { line = 18370, text = "And listen to their own words; there is no need of mine. For what says" },
  { line = 18371, text = "this blessed one? \"But I obtained mercy, because I did it ignorantly.\"" },
  { line = 18372, text = "(1 Tim. i. 13.) What then, was there afterwards no need of mercy? Hear" },
  { line = 18373, text = "what he says; \"But I labored more abundantly than they all; yet not I," },
  { line = 18374, text = "but the grace of God which was with me.\" (1 Cor. xv. 10.) And of" },
  { line = 18375, text = "Epaphroditus he says, \"For indeed he was sick, nigh unto death; but God" },
  { line = 18376, text = "had mercy on him; and not on him only, but on me also, that I might not" },
  { line = 18377, text = "have sorrow upon sorrow.\" (Philip. ii. 27.) And again he says, \"We were" },
  { line = 18378, text = "weighed down exceedingly, beyond our power, insomuch that we despaired" },
  { line = 18379, text = "even of life. Yea, we ourselves have had the answer of death within" },
  { line = 18380, text = "ourselves, that we should not trust in ourselves, but in God, who" },
  { line = 18381, text = "delivered us out of so great a death, and will deliver.\" (2 Cor. i. 8," },
  { line = 18382, text = "9, 10.) And again, \"And I was delivered out of the mouth of the lion;" },
  { line = 18383, text = "and the Lord will deliver me.\" (2 Tim. iv. 17, 18.) And everywhere we" },
  { line = 18384, text = "shall find him glorying in this, that by mercy he was saved. Peter," },
  { line = 18385, text = "too, became so great, because mercy was shown him. For hear Christ" },
  { line = 18386, text = "saying to him, \"Satan hath desired to sift you as wheat; and I made" },
  { line = 18387, text = "supplication for thee, that thy faith fail not.\" (Luke xxii. 31, 32.)" },
  { line = 18388, text = "John, too, became so great through mercy, and in short all of them. For" },
  { line = 18389, text = "listen to Christ when He says, \"Ye did not choose Me, but I chose you.\"" },
  { line = 18390, text = "(John xv. 16.) For we all have need of the mercy of God, as it is" },
  { line = 18391, text = "written, \"The mercy of God is upon all flesh.\"" },
  { line = 18391, text = "But if these men" },
  { line = 18392, text = "needed the mercy of God, what should one say of the rest? For why, tell" },
  { line = 18393, text = "me, doth He \"make the sun to rise on the evil and the good\"? Did He" },
  { line = 18394, text = "withhold the rain for one year, would He not destroy all? And what if" },
  { line = 18395, text = "He caused overwhelming rain? what if He rained down fire? what if He" },
  { line = 18396, text = "sent flies? But what do I say? if He were so to do" },
  { line = 18396, text = "as He once" },
  { line = 18397, text = "did, would not all perish? If He were to shake the earth, would not all" },
  { line = 18398, text = "perish? It is now seasonable to say, \"What is man, that Thou art" },
  { line = 18399, text = "mindful of him?\" (Ps. viii. 4.) Were He only to threaten the earth, all" },
  { line = 18400, text = "men would become one tomb. \"As a drop of water from the bucket,\" it is" },
  { line = 18401, text = "written, \"so are the nations in His sight, they shall be counted as" },
  { line = 18402, text = "very small dust, as the turning of the balance.\" (Isa. xl. 15.) It were" },
  { line = 18403, text = "as easy for Him to destroy all things, and to make them again, as for" },
  { line = 18404, text = "us to turn the balance. He then who has such power over us, and sees us" },
  { line = 18405, text = "sinning every day, and yet punishes us not, how is it but by mercy He" },
  { line = 18406, text = "bears with us? Since beasts too exist by mercy: \"Thou, Lord, wilt" },
  { line = 18407, text = "preserve both men and beasts.\" (Ps. xxxvi. 7.) He looked upon the" },
  { line = 18408, text = "earth, and filled it with living things. And wherefore? For thy sake!" },
  { line = 18409, text = "And wherefore did He make thee? Through His goodness." },
  { line = 18411, text = "There is nothing better than oil. It is the cause of light, and there" },
  { line = 18412, text = "also it is the cause of light." },
  { line = 18412, text = "\"Then shall thy light break forth" },
  { line = 18413, text = "as the morning\" (Isa. lviii. 8.), saith the Prophet, if thou showest" },
  { line = 18414, text = "pity upon thy neighbour. And as natural oil contains light, so then" },
  { line = 18415, text = "doth mercy [alms] grant us a great, a marvelous light. Much mention" },
  { line = 18416, text = "doth Paul, too, make of this mercy. In one place, hear him say, \"Only" },
  { line = 18417, text = "that we should remember the poor.\" (Gal. ii. 10.) And in another, \"If" },
  { line = 18418, text = "it be meet for me to go also.\" (1 Cor. xvi. 4.) And in every place," },
  { line = 18419, text = "turn where you will, ye see him anxious about this very thing. And" },
  { line = 18420, text = "again, \"And let our people also learn to maintain good works.\" (Tit." },
  { line = 18421, text = "iii. 14.) And again, \"These things are good and profitable unto men.\"" },
  { line = 18422, text = "(Tit. iii. 8.) Listen to a certain other one who saith, \"Alms" },
  { line = 18422, text = "do" },
  { line = 18423, text = "deliver from death\" (Tob. xii. 9.); If Thou takest away pity, \"Lord," },
  { line = 18424, text = "Lord, who shall stand\" (Ps. cxxx. 3.); and it is said, If Thou enterest" },
  { line = 18425, text = "\"into judgment with thy servant\" (Ps. cxliii. 2.); \"A great thing is" },
  { line = 18426, text = "man\"; why? \"and an honorable thing is a merciful man.\" (Prov. xx. 6," },
  { line = 18427, text = "LXX.) For this is the true character of man, to be merciful, yea rather" },
  { line = 18428, text = "the character of God, to show mercy. Dost thou see, how strong is the" },
  { line = 18429, text = "mercy of God? This made all things, this formed the world, this made" },
  { line = 18430, text = "the angels, it was through mere goodness. For this cause, too, He" },
  { line = 18431, text = "threatened hell, that we may attain unto the kingdom, and through mercy" },
  { line = 18432, text = "we do attain unto the kingdom. For wherefore did God, being alone," },
  { line = 18433, text = "create so many beings? was it not through goodness? was it not through" },
  { line = 18434, text = "love to men? If you ask why such and such things are, you will always" },
  { line = 18435, text = "find your answer in Goodness. Let us show mercy to our neighbors, that" },
  { line = 18436, text = "mercy may be shown to us. These acts of mercy" },
  { line = 18436, text = "we show not so much" },
  { line = 18437, text = "to them, as lay up for ourselves against That Day. When the flame of" },
  { line = 18438, text = "the fire is great, this oil (mercy) is that which quenches the fire," },
  { line = 18439, text = "and this brings light to us. Thus by this means shall we be freed from" },
  { line = 18440, text = "the fire of hell. For whence will He be compassionate and show mercy?" },
  { line = 18441, text = "Mercy comes of love! Nothing incenses God so much as to be pitiless. \"A" },
  { line = 18442, text = "man was brought to him who owed him ten thousand talents, and he was" },
  { line = 18443, text = "moved with compassion, and forgave him. And there were owing to that" },
  { line = 18444, text = "man from his fellow-servant a hundred pence, and he caught him by the" },
  { line = 18445, text = "throat. Therefore the Lord delivered him to the tormentors, till he" },
  { line = 18446, text = "should pay what was due.\" Let us on hearing this be merciful to those" },
  { line = 18447, text = "who are our debtors in money or in sins. Let no one remember evils, if" },
  { line = 18448, text = "at least he does not wish to injure himself; for he does not so much" },
  { line = 18449, text = "aggrieve the other (as he injures himself). For he" },
  { line = 18449, text = "either will" },
  { line = 18450, text = "follow him with vengeance, or he has not done so; but dost thou" },
  { line = 18451, text = "thyself, while not forgiving thy neighbor his sins, seek for a kingdom?" },
  { line = 18452, text = "Lest this should happen to us, let us forgive all, (for it is ourselves" },
  { line = 18453, text = "that we pardon,) that God may forgive us our sins, and so we may obtain" },
  { line = 18454, text = "the good things which are in store, through the grace and" },
  { line = 18455, text = "lovingkindness, &c." },
]
