notes = "Dated electronic witness of the historical NPNF translation. The controlling volume retains its print-basis and reprint imprint statements; no identity with a newly authenticated historical printing is claimed. Constituent text remains in the one container payload. No original-language or print-image collation is asserted. Translator attribution checked 2026-10-23 in the controlling volume: the Oxford preface credits W. C. Cotton for the Philippians translation (physical lines 16557-16559), and the constituent title credits John A. Broadus with revision and additional notes (16493-16495). The older Oxford preface assigns the homilies to Constantinople (16504-16514); this does not establish a secure composition year. Pauline Allen, Homilies on Paul's Letter to the Philippians (SBL, 2013), introduction pp. xii-xiv, reports insufficient evidence for securely locating or dating the individual homilies: https://www.sbl-site.org/wp-content/uploads/2024/11/JohnChrysostom_Allen_SBL.pdf (consulted 2026-10-23). That copyrighted modern delivery is not reproduced here. The work record's unknown composition date remains unresolved; no locality, translation, retrieval or author-life date is substituted for it."
