id = "work.john-chrysostom.commentary-on-galatians"
title = "Hypomnema eis ten pros Galatas epistolen: Commentarius in epistulam ad Galatas"
responsible = "John Chrysostom"
work_type = "biblical-commentary"
composed = "c. 393-397"
composed_basis = "Written at Antioch before Chrysostom's removal to Constantinople in 398; it is the only one of his Pauline expositions cast as a continuous commentary rather than a homily series. The date is the writing, not the 1889 English translation this record's edition delivers."
alternate_titles = ["Commentary on Galatians", "In epistulam ad Galatas commentarius", "Homilies on Galatians"]
languages = ["grc"]
locus_pattern = '[1-6](?:\.[1-9][0-9]?)?'
description = "Chrysostom's continuous commentary on the Epistle to the Galatians, in six parts following the letter's six chapters. It is conventionally cited by the chapter of Galatians commented on, and English editions print it in six sections titled by chapter. The appointed Epistle of the Fifteenth Sunday after Pentecost, Gal. 5:25-6:10, falls across the ends of chapters 5 and 6."
