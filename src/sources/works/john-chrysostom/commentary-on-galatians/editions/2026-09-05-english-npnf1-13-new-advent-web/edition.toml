notes = "A dated web delivery of a public-domain nineteenth-century translation, read as a reception witness and not as control over the Greek. The host serves the commentary one chapter to a page and only the chapter 6 page was retrieved, so this edition holds Gal. 6:1-18 and not the whole commentary. Language pairing: this edition is a translation, and the work's original was not retrieved in the sweep that produced this record. Register the original alongside it before treating any wording question as settled from this edition alone. Chrysostom's Greek is in Migne, Patrologia Graeca 61, cols. 611-682, which was not sought."
