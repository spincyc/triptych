notes = "Complete delivery of the comment on Galatians 6, from 6:1 ('In a spirit of meekness') to the end of the epistle at 6:18; the appointed verses 6:1-10 are complete within it. Bound: chapter 5, which carries the appointed lesson's first two verses at Gal. 5:25-26, is a separate page on the same host and was not retrieved, so this artifact answers nothing about them. Not retained: New Advent's exact delivery, because the site's navigation, styling, advertising markup and support solicitation carry no republication permission. A reader without the network cannot open this page from a checkout; the public-domain translation inside it is reachable from any print or reprint of the same volume, and the wording a claim depends on must be quoted into the claim's own passage record."
