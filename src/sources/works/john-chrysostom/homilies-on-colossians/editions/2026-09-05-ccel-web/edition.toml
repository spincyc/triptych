notes = "Dated CCEL digital witness of the historical NPNF English expression. The exact controlling anthology retains its print-basis and reprint statements. No identity with newly collated print images or New Advent’s revised delivery is asserted. The common constituent title credits John A. Broadus with revision and additional notes (16481-16495). The Oxford preface specifically credits J. Ashworth with the Colossians translation (16557-16561), separately from Cotton on Philippians and Tweed on Thessalonians. The American preface at 160-220 states its conformity to Field and its revisions of the Oxford translation. The held Oxford preface, physical lines 16504-16514 in the exact NPNF/CCEL container, assigns these homilies to Constantinople chiefly from episcopal language and singles out the close of Colossians Homily III; it supplies no secure calendar year for the selected Homilies I, II and IV. This review has not established a composition year and adopts neither a retrieval year nor an author-life date as a surrogate. Only the English expression is transcribed in these passages; no Greek original-language body or Greek collation is supplied. The selected wording is retained from the existing complete CCEL container, not downloaded again or reconstructed from a model."
