notes = "Mechanically selected exact historical English words; only wrapping whitespace and numeric editorial footnote calls are omitted. Verse labels, spelling, punctuation, inline glosses and references are preserved. Separate editorial footnote prose remains in the full unchanged container and is not attributed to Chrysostom. J.Ashworth’s translation and JohnA.Broadus’s revision credits follow the already registered constituent edition and were reread at physical16481–16495 and16557–16561. The natural unit ends before the return to Col3:5 in HomilyVIII; HomilyIX retains the whole argument through its conclusion, including its qualifications on healing and the Name."
