 about to have finished, our work would have been forward; ye would" }, { line = 27229, text = "both have given place to others, and would have helped us as well. Tell" }, { line = 27230, text = "me, were some to go to a grammarian and continue always learning their" }, { line = 27231, text = "letters, would they not give their teacher much trouble? How long shall" }, { line = 27232, text = "I have to discourse to you concerning life? In the Apostles' times it" }, { line = 27233, text = "was not thus, but they continually leaped from place to place," }, { line = 27234, text = "appointing those who first learned to be the teachers of any others" }, { line = 27235, text = "that were under instruction. Thus they were enabled to circle the" }, { line = 27236, text = "world, through not being bound to one place. How much instruction," }, { line = 27237, text = "think ye, do your brethren in the country stand in need of, [they] and" }, { line = 27238, text = "their teachers? But ye hold me riveted fast here. For, before the head" }, { line = 27239, text = "is set right, it is superfluous to proceed to the rest of the body. Ye" }, { line = 27240, text = "throw everything upon us. Ye alone ought to learn from us, and your" }, { line = 27241, text = "wives from you, your children from you; but ye leave all to us." }, { line = 27242, text = "Therefore our toil is excessive." }, { line = 27244, text = "\"Teaching,\" he saith, \"and admonishing one another with psalms and" }, { line = 27245, text = "hymns and spiritual songs.\" Mark also the considerateness of Paul." }, { line = 27246, text = "Seeing that reading is toilsome, and its irksomeness great, he led them" }, { line = 27247, text = "not to histories, but to psalms, that thou mightest at once delight thy" }, { line = 27248, text = "soul with singing, and gently beguile thy labors. \"Hymns,\" he saith," }, { line = 27249, text = "\"and spiritual songs.\" But now your children will utter songs and" }, { line = 27250, text = "dances of Satan, like cooks, and caterers, and musicians; no one" }, { line = 27251, text = "knoweth any psalm, but it seems a thing to be ashamed of even, and a" }, { line = 27252, text = "mockery, and a joke. There is the treasury house of all these evils." }, { line = 27253, text = "For whatsoever soil the plant stands in, such is the fruit it bears; if" }, { line = 27254, text = "in a sandy and salty soil, of like nature is its fruit; if in a sweet" }, { line = 27255, text = "and rich one, it is again similar. So the matter of instruction is a" }, { line = 27256, text = "sort of fountain. Teach him to sing those psalms which are so full of" }, { line = 27257, text = "the love of wisdom; as at once concerning chastity, or rather, before" }, { line = 27258, text = "all, of not companying with the wicked, immediately with the very" }, { line = 27259, text = "beginning of the book; (for therefore also it was that the prophet" }, { line = 27260, text = "began on this wise, \"Blessed is the man that hath not walked in the" }, { line = 27261, text = "counsel of the ungodly\"; (Ps. i. 1.), and again, \"I have not sat in the" }, { line = 27262, text = "council of vanity\"; (Ps. xxvi. 4, Sept.), and again, \"in his sight a" }, { line = 27263, text = "wicked doer is contemned, but he honoreth those that fear the Lord,\"" }, { line = 27264, text = "(Ps. xv. 4, Sept.,) of companying with the good, (and these subjects" }, { line = 27265, text = "thou wilt find there in abundance,) of restraining the belly, of" }, { line = 27266, text = "restraining the hand, of refraining from excess, of not overreaching;" }, { line = 27267, text = "that money is nothing, nor glory, and other things such like." }, { line = 27269, text = "When in these thou hast led him on from childhood, by little and little" }, { line = 27270, text = "thou wilt lead him forward even to the higher things. The Psalms" }, { line = 27271, text = "contain all things, but the Hymns again have nothing human." }, { line = 27271, text = "When" }, { line = 27272, text = "he has been instructed out of the Psalms, he will then know hymns also," }, { line = 27273, text = "as a diviner thing. For the Powers above chant hymns, not psalms. For" }, { line = 27274, text = "\"a hymn,\" saith one, \"is not comely in the mouth of a sinner\" (Ecclus." }, { line = 27275, text = "xv. 9.); and again, \"Mine eyes shall be upon the faithful of the land," }, { line = 27276, text = "that they sit together with me\" (Ps. ci. 6, 7, Sept.); and again, \"he" }, { line = 27277, text = "that worketh haughtiness hath not dwelt in the midst of my house\"; and" }, { line = 27278, text = "again, \"He that walketh in a blameless way, he ministered unto me.\"" }, { line = 27279, text = "(Ps. ci. 6, Sept.)" }, { line = 27281, text = "So that ye should safely guard them from intermixing themselves, not" }, { line = 27282, text = "only with friends, but even with servants. For the harm done to the" }, { line = 27283, text = "free is incalculable, when we place over them corrupt slaves. For if" }, { line = 27284, text = "when enjoying all the benefit of a father's affection and wisdom, they" }, { line = 27285, text = "can with difficulty be preserved safe throughout; when we hand them" }, { line = 27286, text = "over to the unscrupulousness of servants, they use them like enemies," }, { line = 27287, text = "thinking that they will prove milder masters to them, when they have" }, { line = 27288, text = "made them perfect fools, and weak, and worthy of no respect." }, { line = 27290, text = "More then than all other things together, let us attend seriously to" }, { line = 27291, text = "this. \"I have loved,\" saith he,\" those that love thy law.\" (Ps. cxix." }, { line = 27292, text = "165, not exact.) This man then let us too emulate, and such let us" }, { line = 27293, text = "love. And that the young may further be taught chastity, let them hear" }, { line = 27294, text = "the Prophet, saying, \"My loins are filled with illusions\"" }, { line = 27294, text = "(Ps." }, { line = 27295, text = "xxxviii. 7, Sept.); and again let them hear him saying, \"Thou wilt" }, { line = 27296, text = "utterly destroy every one that goeth a whoring from Thee.\" (Ps. lxxiii." }, { line = 27297, text = "27, Sept.) And, that one ought to restrain the belly, let them hear" }, { line = 27298, text = "again, \"And slew,\" he saith, \"the more part of them" }, { line = 27298, text = "while the" }, { line = 27299, text = "meat was yet in their mouths.\" (Ps. lxxviii. 30, Sept.) And that they" }, { line = 27300, text = "ought to be above bribes, \"If riches become abundant, set [not]" }, { line = 27301, text = "your heart upon them\" (Ps. lxii. 10.); and that they ought to keep" }, { line = 27302, text = "glory in subjection, \"Nor shall his glory descend together after him.\"" }, { line = 27303, text = "(Ps. xlix. 17.) And not to envy the wicked, \"Be not envious against" }, { line = 27304, text = "them that work unrighteousness.\" (Ps. xxxvii. 1.) And to count power as" }, { line = 27305, text = "nothing, \"I saw the ungodly in exceeding high place, and lifting" }, { line = 27306, text = "himself up as the cedars of Libanus, and I passed by, and lo! he was" }, { line = 27307, text = "not.\" (Ps. xxxvii. 35.) And to count these present things as nothing," }, { line = 27308, text = "\"They counted the people happy, that are in such a case; happy are the" }, { line = 27309, text = "people, whose helper is the Lord their God.\" (Ps. cxliv. 15, Sept.)" }, { line = 27310, text = "That we do not sin without notice, but that there is a retribution," }, { line = 27311, text = "\"for,\" he saith, \"Thou shalt render to every man according to his" }, { line = 27312, text = "works.\" (Ps. lxii. 12, Sept.) But why doth he not so requite them day" }, { line = 27313, text = "by day? \"God is a judge,\" he says, \"righteous, and strong, and" }, { line = 27314, text = "longsuffering.\" (Ps. vii. 11.) That lowliness of mind is good, \"Lord,\"" }, { line = 27315, text = "he saith, \"my heart is not lifted up\" (Ps. cxxxi. 1): that pride is" }, { line = 27316, text = "evil, \"Therefore,\" he said, \"pride took hold on them wholly\" (Ps." }, { line = 27317, text = "lxxiii. 6, Sept.); and again, \"The Lord resisteth the proud\"; and" }, { line = 27318, text = "again, \"Their injustice shall come out as of fatness.\" That almsgiving" }, { line = 27319, text = "is good, \"He hath dispersed, he hath given to the needy, his" }, { line = 27320, text = "righteousness endureth for ever.\" (Prov. iii. 34.) And that to pity is" }, { line = 27321, text = "praiseworthy, \"He is a good man that pitieth, and lendeth.\" (Ps." }, { line = 27322, text = "lxxiii. 7, Sept.) And thou wilt find there many more doctrines than" }, { line = 27323, text = "these, full of true philosophy; such as, that one ought not to speak" }, { line = 27324, text = "evil, \"Him that privily slandereth his neighbor, him did I chase from" }, { line = 27325, text = "me.\" (Ps. cxii. 9.)" }, { line = 27327, text = "What is the hymn of those above? The Faithful know. What say the" }, { line = 27328, text = "cherubim above? What say the Angels? \"Glory to God in the highest.\"" }, { line = 27329, text = "(Ps. cxii. 5.) Therefore after the psalmody come the hymns, as a thing" }, { line = 27330, text = "of more perfection. \"With psalms,\" he saith, \"with hymns, with" }, { line = 27331, text = "spiritual songs, with grace singing in your hearts to God.\" (Ps. ci. 5," }, { line = 27332, text = "Sept.) He means either this, that God because of grace hath given us" }, { line = 27333, text = "these things; or, with the songs in grace; or, admonishing and teaching" }, { line = 27334, text = "one another in grace; or, that they had these gifts in grace; or, it is" }, { line = 27335, text = "an epexegesis" }, { line = 27335, text = "and he means, from the grace of the Spirit." }, { line = 27336, text = "\"Singing in your hearts to God.\" Not simply with the mouth, he means," }, { line = 27337, text = "but with heedfulness. For this is to \"sing to God,\" but that to the" }, { line = 27338, text = "air, for the voice is scattered without result. Not for display, he" }, { line = 27339, text = "means. And even if thou be in the market-place, thou canst collect" }, { line = 27340, text = "thyself, and sing unto God, no one hearing thee. For Moses also in this" }, { line = 27341, text = "way prayed, and was heard, for He saith, \"Why criest thou unto Me?\"" }, { line = 27342, text = "(Ex. xiv. 15.) albeit he said nothing, but cried in thought--wherefore" }, { line = 27343, text = "also God alone heard him--with a contrite heart. For it is not" }, { line = 27344, text = "forbidden one even when walking to pray in his heart, and to dwell" }, { line = 27345, text = "above." }, { line = 27347, text = "Ver. 17. \"And whatsoever ye do,\" he saith, \"in word or in deed, do all" }, { line = 27348, text = "in the name of the Lord Jesus, giving thanks to God the Father through" }, { line = 27349, text = "Him.\"" }, { line = 27351, text = "For if we thus do, there will be nothing polluted, nothing unclean," }, { line = 27352, text = "wherever Christ is called on. If thou eat, if thou drink, if thou" }, { line = 27353, text = "marry, if thou travel, do all in the Name of God, that is, calling Him" }, { line = 27354, text = "to aid thee: in everything first praying to Him, so take hold of thy" }, { line = 27355, text = "business. Wouldest thou speak somewhat? Set this in front. For this" }, { line = 27356, text = "cause we also place in front of our epistles the Name of the Lord." }, { line = 27357, text = "Wheresoever the Name of God is, all is auspicious. For if the names of" }, { line = 27358, text = "Consuls make writings sure, much more doth the Name of Christ. Or he" }, { line = 27359, text = "means this; after God say ye and do everything, do not introduce the" }, { line = 27360, text = "Angels besides. Dost thou eat? Give thanks to God both before and" }, { line = 27361, text = "afterwards. Dost thou sleep? Give thanks to God both before and" }, { line = 27362, text = "afterwards. Launchest thou into the forum? Do the same--nothing" }, { line = 27363, text = "worldly, nothing of this life. Do all in the Name of the Lord, and all" }, { line = 27364, text = "shall be prospered to thee. Whereonsoever the Name is placed, there all" }, { line = 27365, text = "things are auspicious. If it casts out devils, if it drives away" }, { line = 27366, text = "diseases, much more does it render business easy." }, { line = 27368, text = "And what is to \"do in word or in deed\"? Either requesting or performing" }, { line = 27369, text = "anything whatever. Hear how in the Name of God Abraham sent his" }, { line = 27370, text = "servant; David in the Name of God slew Goliath. Marvelous is His Name" }, { line = 27371, text = "and great. Again, Jacob sending his sons saith, \"My God give you favor" }, { line = 27372, text = "in the sight of the man.\" (Gen. xliii. 14.) For he that doeth this hath" }, { line = 27373, text = "for his ally, God, without whom he durst do nothing. As honored then by" }, { line = 27374, text = "being called upon, He will in turn honor by making their business easy." }, { line = 27375, text = "Invoke the Son, give thanks to the Father. For when the Son is invoked," }, { line = 27376, text = "the Father is invoked, and when He is thanked, the Son has been" }, { line = 27377, text = "thanked." }, { line = 27379, text = "These things let us learn, not as far as words only, but to fulfill" }, { line = 27380, text = "them also by works. Nothing is equal to this Name, marvelous is it" }, { line = 27381, text = "everywhere. \"Thy Name,\" he saith, \"is ointment poured forth.\" (Cant. i." }, { line = 27382, text = "3.) He that hath uttered it is straightway filled with fragrance. \"No" }, { line = 27383, text = "man,\" it is said, \"can call Jesus Lord, but by the Holy Ghost.\" (1 Cor." }, { line = 27384, text = "xii. 3.) So great things doth this Name Work. If thou have said, In" }, { line = 27385, text = "the Name of Father, and Son, and Holy Ghost, with faith, thou" }, { line = 27386, text = "hast accomplished everything. See, how great things thou hast done!" }, { line = 27387, text = "Thou hast created a man, and wrought all the rest (that cometh) of" }, { line = 27388, text = "Baptism! So, when used in commanding diseases, terrible is The Name." }, { line = 27389, text = "Therefore the devil introduced those" }, { line = 27389, text = "of the Angels, envying us" }, { line = 27390, text = "the honor. Such incantations are for the demons. Even if it be Angel," }, { line = 27391, text = "even if it be Archangel, even if it be Cherubim, allow it not; for" }, { line = 27392, text = "neither will these Powers accept such addresses, but will even toss" }, { line = 27393, text = "them away from them, when they have beheld their Master dishonored. \"I" }, { line = 27394, text = "have honored thee,\" He saith, \"and have said, Call upon Me\"; and dost" }, { line = 27395, text = "thou dishonor Him? If thou chant this incantation with faith, thou wilt" }, { line = 27396, text = "drive away both diseases and demons," }, { line = 27396, text = "and even if thou have failed" }, { line = 27397, text = "to drive away the disease, this is not from lack of power, but because" }, { line = 27398, text = "it is expedient it should be so. \"According to Thy greatness,\" he" }, { line = 27399, text = "saith, \"so also is Thy praise.\" (Ps. xlviii. 10.) By this Name hath the" }, { line = 27400, text = "world been converted, the tyranny dissolved, the devil trampled on, the" }, { line = 27401, text = "heavens opened. We have been regenerated by this Name. This if we have," }, { line = 27402, text = "we beam forth; This maketh both martyrs and confessors; This let us" }, { line = 27403, text = "hold fast as a great gift, that we may live in glory, and be" }, { line = 27404, text = "well-pleasing to God, and be counted worthy of the good things promised" }, { line = 27405, text = "to them that love Him, through the grace and lovingkindness, &c." }]
