  { line = 23932, text = "a place with the saints. But he did not say simply placed us, but hath" },
  { line = 23933, text = "given us to enjoy even the very same things, for \"the portion\"" },
  { line = 23933, text = "is" },
  { line = 23934, text = "that which each one receives. For it is possible to be in the same" },
  { line = 23935, text = "city, and yet not enjoy the same things; but to have the same" },
  { line = 23936, text = "\"portion,\" and yet not enjoy the same, is impossible. It is possible to" },
  { line = 23937, text = "be in the same inheritance, and yet not to have the same portion; for" },
  { line = 23938, text = "instance, all we (clergy) are in the inheritance," },
  { line = 23938, text = "but we have not" },
  { line = 23939, text = "all the same portion." },
  { line = 23939, text = "But here he doth not say this, but with the" },
  { line = 23940, text = "inheritance adds the portion also. But why doth he call it inheritance" },
  { line = 23941, text = "(or lot)? To show that by his own achievements no one obtains the" },
  { line = 23942, text = "kingdom, but as a lot" },
  { line = 23942, text = "is rather the result of good luck," },
  { line = 23942, text = "so" },
  { line = 23943, text = "in truth is it here also. For a life so good as to be counted worthy of" },
  { line = 23944, text = "the kingdom doth no one show forth, but the whole is of His free gift." },
  { line = 23945, text = "Therefore He saith, \"When ye have done all, say, We are unprofitable" },
  { line = 23946, text = "servants, for we have done that which was our duty to do.\" (Luke xvii." },
  { line = 23947, text = "10.) \"To be partakers of the inheritance of the saints in light,\"--he" },
  { line = 23948, text = "means, both the future and the present light," },
  { line = 23948, text = "--that is, in" },
  { line = 23949, text = "knowledge. He seems to me to be speaking at once of both the present" },
  { line = 23950, text = "and the future. Then he shows of what things we have been counted" },
  { line = 23951, text = "worthy. For this is not the only marvel, that we are counted worthy of" },
  { line = 23952, text = "the kingdom; but it should also be added who we are that are so" },
  { line = 23953, text = "counted; for it is not unimportant. And he doth this in the Epistle to" },
  { line = 23954, text = "the Romans, saying, \"For scarcely for a righteous" },
  { line = 23954, text = "man will one" },
  { line = 23955, text = "die, but peradventure for the good man some one would even dare to" },
  { line = 23956, text = "die.\" (Rom. v. 7.)" },
]
