notes = "The explicit body preserves the historical translation’s spelling, punctuation, verse/section labels and inline lexical glosses, changing only wrapping whitespace and omitting numeric footnote calls. Separate editorial footnote prose remains in the complete segment and is not attributed to Chrysostom here. The passage’s locus is the enclosing homily number; this context and the exact line range identify its smaller natural unit. The common constituent title credits John A. Broadus with revision and additional notes (16481-16495). The Oxford preface specifically credits J. Ashworth with the Colossians translation (16557-16561), separately from Cotton on Philippians and Tweed on Thessalonians. The American preface at 160-220 states its conformity to Field and its revisions of the Oxford translation. The incidental plucked-out-your-eyes quotation is followed by the source reference Gal. v. 15., although its wording belongs to Galatians 4:15. The exact source reference is preserved; this supplies no Galatians edge."
