notes = "A dated web delivery of a public-domain nineteenth-century translation, used for reception rather than Greek textual control. It is the same route as edition.john-chrysostom.homilies-on-john.english-npnf1-14-new-advent-web-2026-07-29, which holds homilies 43-45; this edition holds homilies 46 and 47 from the consultation of 2026-09-05. Language pairing: this edition is a translation, and Chrysostom's Greek, printed in Migne, Patrologia Graeca 59, was not retrieved in the sweep that produced this record. Register the Greek alongside it before treating any wording question as settled from this English alone."
