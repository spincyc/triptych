notes = "Complete delivery of Homily 46, covering John 6:41-52 in the Greek numbering, from the opening on 6:41 to the close of the homily's moral exhortation. The Communion antiphon's verse, the missal's Io. 6, 52, is verse 51 in the numbering this homily follows. Not retained: New Advent's exact delivery, because the site's navigation, styling, advertising markup and support solicitation carry no republication permission. A reader without the network cannot open this page from a checkout; the public-domain translation inside it is reachable from any print or reprint of the same volume, and the wording a claim depends on must be quoted into the claim's own passage record."
