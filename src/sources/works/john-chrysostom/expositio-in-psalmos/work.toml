description = "Chrysostom's exposition of the Psalms. On Psalm 117:8-9, the Gradual verses of the Roman Fourteenth Sunday after Pentecost, he denies that the psalm's comparative form states a real comparison at all: Scripture uses that manner of speech even about things that admit of no comparison, because of the weakness of those who were then hearing. On his reading the Gradual's twice-repeated 'Bonum est ... quam' is condescension to weak hearers rather than a comparison."
