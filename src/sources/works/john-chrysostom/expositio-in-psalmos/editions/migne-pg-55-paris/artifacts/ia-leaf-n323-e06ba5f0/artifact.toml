rights_basis = "Migne's nineteenth-century Paris printing is in the public domain in the United States: the repository's own rights reading, recorded at guidance/missals.md section 5 against Cornell's public-domain chart current at 1 January 2026, is that a work first published abroad before 1931 is in the public domain with no term running. A faithful photographic reproduction of one page of a public-domain printing adds no original authorship of its own. The bytes are retained at 1.18 MB because this leaf is the only witness to the quoted Greek that this repository holds: the volume's optical text layer is left remote for its size and its recognition of the polytonic Greek face is corrupt, so a reader with no network has nothing else here to read these columns in."
