notes = "Registered on the pattern this library already uses for a constituent of a Migne volume: the edition is the constituent as Migne prints it, and the artifacts are the Internet Archive's derivatives of the whole volume, which is the narrowest exact witness that was retrieved. Migne prints the Greek with a facing Latin translation; the edition language records the language of the text of record, which is the Greek. The printing year of the scanned copy is not established from these bytes and is therefore not asserted: the Patrologia Graeca volumes were reissued repeatedly and no legible year was found in the front matter of the retained or retrieved layers. Homily XXI opens on Matthew 6:24 at columns 293-294, the lilies-of-the-field exposition of 6:28-29 stands at 299-300, and the whole 'not given but added' exposition of 6:33 at 303-304. PAIRING: the English of this work is already registered in this library, at edition.john-chrysostom.homiliae-in-matthaeum.prevost-riddle-npnf1-10-newadvent-web-2026-07-25, so the original and a translation now stand together under one work."
