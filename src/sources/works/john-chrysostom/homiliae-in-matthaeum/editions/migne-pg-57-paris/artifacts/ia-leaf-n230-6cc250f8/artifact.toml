rights_basis = "Migne's nineteenth-century Paris printing is in the public domain in the United States: the repository's own rights reading, recorded at guidance/missals.md section 5 against Cornell's public-domain chart current at 1 January 2026, is that a work first published abroad before 1931 is in the public domain with no term running. A faithful photographic reproduction of one page of a public-domain printing adds no original authorship of its own. The bytes are not retained, on the duplication ground guidance/sources.md gives for `remote`: this 3.65 MB page image reproduces one leaf of the volume whose complete optical text layer is retained in this repository at artifact.john-chrysostom.homiliae-in-matthaeum.migne-pg-57-paris.ia-djvu-ocr-1b95176e. That layer's recognition of the Greek column is poor, so it substitutes for the image only as a locating and searching aid; a reader who needs the printed Greek letterform must re-fetch the image at the recorded URL, and that is stated rather than glossed."
