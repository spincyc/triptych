text = "[2.] \"Unto my God.\"  Out of great affection he seizes on that which is common, and makes it his own; as the prophets also from time to time use to say, (Ps. xliii. 4; lxii. 1.) \"O God, my God;\" and by way of encouragement he incites them to use the same language also themselves. For such expressions belong to one who is retiring from all secular things, and moving towards Him whom he calls on with so much earnestness: since he alone can truly say this, who from things of this life is ever mounting upwards unto God, and always preferring Him to all, and giving thanks continually, not [only] for the grace already given, but whatever blessing hath been since at any time bestowed, for this also he offereth unto Him the same praise. Wherefore he saith not merely, \"I give thanks,\" but \"at all times, concerning you;\" instructing them to be thankful both always, and to no one else save God only."
