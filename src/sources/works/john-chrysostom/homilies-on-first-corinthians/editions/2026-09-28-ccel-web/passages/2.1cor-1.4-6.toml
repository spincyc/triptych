notes = "The explicit body preserves the historical translation’s spelling, punctuation, verse/section labels and inline lexical glosses, changing only wrapping whitespace and omitting numeric footnote calls. Separate editorial footnote prose remains in the complete segment and is not attributed to Chrysostom here. The passage’s locus is the enclosing homily number; this context and the exact line range identify its smaller natural unit. The constituent title credits Talbot W. Chambers with revision and additional notes (61-79). The Oxford preface credits Hubert Kestell Cornish and John Medley with the translation (173-176), and identifies the numbered Benedictine sections (171-173)."
