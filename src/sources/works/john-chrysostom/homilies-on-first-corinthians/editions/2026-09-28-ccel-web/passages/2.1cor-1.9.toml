context = "Homily 2: complete numbered section 8 directly expounding 1 Cor 1:9 ('God is faithful, by whom ye were called unto the fellowship of His Son'), including the Father’s call, non-coercive fidelity requiring willing response, and allusion to Isa 64:4 / 1 Cor 2:9, stopping before section 9’s broader free-will objections. Complete selected consecutive source unit read against the exact held digital expression with adjacent lemmata/section markers checked; no whole-homily, facsimile or original-Greek inspection is claimed."
