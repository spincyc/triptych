text = "[4.] Ver. 7. \"So that ye come behind in no gift.\" A great question here arises. They who had been \"enriched in all utterance,\" so as in no respect to \"come behind in any gift,\" are they carnal? For if they were such at the beginning, much more now. How then does he call them \"carnal?\" For, saith he, (1 Cor. iii. 1.) \"I was not able to speak unto you as unto spiritual, but as unto carnal.\" What must we say then? That having in the beginning believed, and obtained all gifts, (for indeed they sought them earnestly,) they became remiss afterwards. Or, if not so, that not unto all are either these things said or those; but the one to such as were amenable to his censures, the other to such as were adorned with his praises. For as to the fact that they still had gifts; (1 Cor. xiv. 26, 29.) \"Each one,\" saith he, \"hath a psalm, hath a revelation, hath a tongue, hath an interpretation; let all things be done unto edifying.\" And, \"Let the prophets speak two or three.\" Or we may state it somewhat differently; that as it is usual with us to call the greater part the whole, so also he hath spoken in this place. Withal, I think he hints at his own proceedings; for he too had shewn forth signs; even as also he saith in the second Epistle to them, (2 Cor. xii. 12, 13.) \"Truly the signs of an Apostle were wrought among you in all patience:\" and again, \"For what is there wherein you were inferior to other churches?\"\n\nOr, as I was saying, he both reminds them of his own miracles and speaks thus with an eye to those who were still approved. For many holy men were there who had \"set themselves to minister unto the saints,\" and had become \"the first fruits of Achaia;\" as he declareth (ch. xvi. 15.) towards the end.\n\n[5.] In any case, although the praises be not very close to the truth, still however they are inserted by way of precaution, (oikonomikos) preparing the way beforehand for his discourse. For whoever at the very outset speaks things unpleasant, excludes his words from a hearing among the weaker: since if the hearers be his equals in degree they feel angry; if vastly inferior they will be vexed. To avoid this, he begins with what seem to be praises. I say, seem; for not even did this praise belong to them, but to the grace of God. For that they had remission of sins, and were justified, this was of the Gift from above. Wherefore also he dwells upon these points, which shew the loving-kindness of God, in order that he may the more fully purge out their malady.\n\n[6.] \"Waiting for the revelation (apokalupsin.) of our Lord Jesus Christ.\" \"Why make ye much ado,\" saith he, \"why are ye troubled that Christ is not come? Nay, he is come; and the Day is henceforth at the doors.\" And consider his wisdom; how withdrawing them from human considerations he terrifies them by mention of the fearful judgment-seat, and thus implying that not only the beginnings must be good, but the end also. For with all these gifts, and with all else that is good, we must be mindful of that Day: and there is need of many labors to be able to come unto the end. \"Revelation\" is his word; implying that although He be not seen, yet He is, and is present even now, and then shall appear. Therefore there is need of patience: for to this end did ye receive the wonders, that ye may remain firm.\n\n[7.] Ver. 8. \"Who shall also confirm you unto the end, that ye may be unreprovable.\" Here he seems to court them, but the saying is free from all flattery; for he knows also how to press them home; as when he saith, (1 Cor. iv. 18, 21.) \"Now some are puffed up as though I would not come to you:\" and again, \"What will ye? shall I come unto you with a rod, or in love, and in the spirit of meekness?\" And, (2 Cor. xiii. 3.) \"Since ye seek a proof of Christ speaking in me.\" But he is also covertly accusing them: for, to say, \"He shall confirm,\" and the word \"unreprovable\" marks them out as still wavering, and liable to reproof.\n\nBut do thou consider how he always fasteneth them as with nails to the Name of Christ. And not any man nor teacher, but continually the Desired One Himself is remembered by him: setting himself, as it were to arouse those who were heavy-headed after some debauch. For no where in any other Epistle doth the Name of Christ occur so continually. But here it is, many times in a few verses; and by means of it he weaves together, one may say, the whole of the proem. Look at it from the beginning. \"Paul called [to be] an Apostle of Jesus Christ, to them that have been sanctified in Jesus Christ, who call upon the Name of our Lord Jesus Christ, grace [be] unto you and peace from God the Father, and the Lord Jesus Christ. I thank my God for the grace which hath been given you by Jesus Christ, even as the testimony of Christ hath been confirmed in you, waiting for the revelation of our Lord Jesus Christ, who shall confirm you unreprovable in the day of our Lord Jesus Christ. God is faithful, by whom ye have been called into the fellowship of His Son Jesus Christ our Lord. And I beseech you by the Name of our Lord Jesus Christ.\" Seest thou the constant repetition of the Name of Christ? From whence it is plain even to the most unobservant, that not by chance nor unwittingly he doeth this, but in order that by incessant application of that glorious Name he may foment their inflammation, and purge out the corruption of the disease.\n\n[8.] Ver. 9. \"God is faithful, by whom ye were called unto the fellowship of His Son.\" Wonderful!  How great a thing saith he here! How vast in the magnitude of the gift which he declares!  Into the fellowship of the Only-Begotten have ye been called, and do ye addict yourselves unto men? What can be worse than this wretchedness? And how have ye been called? By the Father. For since \"through Him,\" and \"in Him,\" were phrases which he was constantly employing in regard of the Son, lest men might suppose that he so mentioneth Him as being less, he ascribeth the same to the Father. For not by this one and that one, saith he, but \"by the Father\" have ye been called; by Him also have ye been \"enriched.\" Again, \"ye have been called;\" ye did not yourselves approach. But what means, \"into the fellowship of His Son?\" Hear him declaring this very thing more clearly elsewhere. (2 Tim. ii. 12.) If we suffer, we shall also reign with Him; if we die with Him, we shall also live with Him. Then, because it was a great thing which He had said, he adds an argument fraught with unanswerable conviction; for, saith he, \"God is faithful,\" i.e. \"true.\" Now if \"true,\" what things He hath promised He will also perform. And He hath promised that He will make us partakers of His only-begotten Son; for to this end also did He call us. For (Rom. xi. 29.) \"His gifts, and the calling of God,\" are without repentance.\n\nThese things, by a kind of divine art he inserts thus early, lest after the vehemence of the reproofs they might fall into despair. For assuredly God's part will ensue, if we be not quite impatient of His rein. (apheniasomen)  As the Jews, being called, would not receive the blessings; but this was no longer of Him that called, but of their lack of sense. For He indeed was willing to give, but they, by refusing to receive, cast themselves away. For, had He called to a painful and toilsome undertaking, not even in that case were they pardonable in making excuse; however, they would have been able to say that so it was: but if the call be unto cleansing, (Comp. i. 4-7.) and righteousness, and sanctification, and redemption, and grace, and a free gift, and the good things in store, which eye hath not seen, nor ear heard; and it be God that calls, and calls by Himself; what pardon can they deserve, who come not running to Him? Let no one therefore accuse God; for unbelief cometh not of Him that calleth, but of those who start away (apopedontas) from Him."
