notes = "The explicit body preserves the historical translation's spelling, punctuation, verse/section labels and inline lexical glosses, changing only wrapping whitespace and omitting the numeric footnote calls [10] and [11] at physical lines 810-811. Separate editorial footnote prose remains in the complete segment and is not attributed to Chrysostom here. The passage's locus is the enclosing homily number; this context and the exact line range identify its smaller natural unit. The constituent title credits Talbot W. Chambers with revision and additional notes (61-79). The Oxford preface credits Hubert Kestell Cornish and John Medley with the translation (173-176), and identifies the numbered Benedictine sections (171-173). Registered by the source-registration stage of the Claude PC-S01-B proper-study run on 2026-11-26 from the existing complete CCEL container, re-hashed before use; not downloaded again or reconstructed from a model."
