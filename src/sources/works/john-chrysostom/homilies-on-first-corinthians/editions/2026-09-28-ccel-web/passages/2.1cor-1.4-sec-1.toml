text = "[1.] That which he exhorts others to do, saying, \"(Phil. iv. 6.) Let your requests with thanksgiving be made known unto God,\" the same also he used to do himself: teaching us to begin always from these words, and before all things to give thanks unto God. For nothing is so acceptable to God as that men should be thankful, both for themselves and for others: wherefore also he prefaces almost every Epistle with this. But the occasion for his doing so is even more urgent here than in the other Epistles. For he that gives thanks, does so, both as being well off, and as in acknowledgment of a favor: now a favor is not a debt nor a requital nor a payment: which indeed every where is important to be said, but much more in the case of the Corinthians who were gaping after the dividers of the Church."
