notes = "Dated CCEL digital witness of the historical NPNF English expression. The exact controlling anthology retains its print-basis and reprint statements. No identity with newly collated print images or New Advent’s revised delivery is asserted. The constituent title credits Talbot W. Chambers with revision and additional notes (61-79). The Oxford preface credits Hubert Kestell Cornish and John Medley with the translation (173-176), and identifies the numbered Benedictine sections (171-173). The held Oxford preface in the exact NPNF/CCEL container, physical lines 153-169, explicitly says that the date of these homilies is not exactly known while assigning them to Antioch. No independent calendar year was established in this bounded review. This records the project’s present evidence limit, not a claim that scholarly dating is impossible. Only the English expression is transcribed in these passages; no Greek original-language body or Greek collation is supplied. The selected wording is retained from the existing complete CCEL container, not downloaded again or reconstructed from a model."
