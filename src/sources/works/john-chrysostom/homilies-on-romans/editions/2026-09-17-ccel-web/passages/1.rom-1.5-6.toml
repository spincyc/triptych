notes = "The explicit body preserves the historical translation’s spelling, punctuation, verse/section labels and inline lexical glosses, changing only wrapping whitespace and omitting numeric footnote calls. Separate editorial footnote prose remains in the complete segment and is not attributed to Chrysostom here. The passage’s locus is the enclosing homily number; this context and the exact line range identify its smaller natural unit. The constituent title credits J. B. Morris and W. H. Simcox as translators, with George B. Stevens as reviser and note author (30997-31023). The Oxford preface credits Morris with the translation and much note matter (31139-31141); the 1876 prefatory addendum identifies Simcox as revising the translation against Field (31145-31155)."
