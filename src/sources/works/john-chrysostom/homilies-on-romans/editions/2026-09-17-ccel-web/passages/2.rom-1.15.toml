text = "Ver. 15. \"So, as much as in me is, I am ready to preach the Gospel to you that are at Rome also.\"\n\nOh, noble soul! having taken on him a task laden of so great dangers, a voyage across the sea, temptations, plottings, risings--for it was likely, that one who was going to address so great a city which was under the tyrannic sway of impiety, should undergo temptations thick as snowflakes; and it was in this way that he lost his life in this city, being cut off by the tyrant of it--yet still expecting to undergo so great troubles, for none of these did he become less energetic, but was in haste and was in travail and was ready-minded. Wherefore he says, \"So, as much as in me is, I am ready to preach the Gospel to you that are at Rome also.\""
