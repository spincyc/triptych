text = "\"And that, knowing the time, that now it is high time to awake out of sleep.\" Since he had given them what commands were fitting, he again thrusts them on to the performance of good works, in consideration of what was pressing upon them. For the time of judgment, he means, is at the doors. So too he wrote to the Corinthians also, \"The remaining time is short. [1576] \" (1 Cor. vii. 29.) And to the Hebrews again, \"For yet a little while, and He that shall come will come, and will not tarry.\" (Heb. x. 37.) But in those cases it was to cheer those in trouble, and to solace the toils of their closely successive temptations, that he said those things: but in the passage before us he does it to rouse those that are asleep, this language being useful to us for both the purposes: and what is that which he says, \"Now it is high time to awake out of sleep?\" It is, that near is the Resurrection, near the awful Judgment, and the day that burneth as a furnace, near. Henceforward then we must be free from our listlessness; \"for now is our salvation nearer than when we believed.\" [1577] You see how he puts the Resurrection now close by them. For as the time advances, he means, the season of our present life is wasting away, and that of the life to come waxes nearer. If then thou be prepared, and hast done all whatsoever He hath commanded, the day is salvation to thee (3 mss. and Cat. soteria soi); but if the contrary, not so. For the present however, it is not upon alarming grounds that he exhorts them, but upon kindly ones, thus also to untie them from their fellow-feeling for the things of this present world. Then since it was not unlikely, that in the beginning of their early endeavors they would be most earnest, in that their desire was then at its full vigor, but that as the time went on, the whole of their earnestness would wither down to nothing; he says that they ought however to be doing the reverse, not to get relaxed as time went on, but to be the more full of vigor. For the nearer the King may be at hand, the more ought they to get themselves in readiness; the nearer the prize is, the more wide awake ought they to be for the contest, since even the racers do this, when they are upon the end of the course, and towards the receiving of the prize, then they rouse themselves up the more. This is why he said, \"Now is our salvation nearer than when we believed.\""
