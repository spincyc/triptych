context = "The lemma on Romans 13:11 and the entire following exposition end before the explicit verse-12 lemma at line 46770. The runner and approaching salvation are part of this unit. Morris and Simcox are credited by the historical constituent; New Advent is a separate revision. Numeric footnote calls in the CCEL witness are editorial."
