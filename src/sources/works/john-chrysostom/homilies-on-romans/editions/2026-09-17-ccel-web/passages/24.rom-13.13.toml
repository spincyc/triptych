text = "\"Let us walk becomingly,\" (A.V. honestly, in this sense) \"as in the day.\" For day it already is. And what most people insist upon very much in their exhortations, that he also uses to draw them on, the sense of the becoming. For they had a great regard to the esteem of the multitude. [1578] And he does not say, walk ye, but let us walk, so making the exhortation free from anything grating, and the reproof gentle. \"Not in rioting and drunkenness.\" Not that he would forbid drinking, but the doing it immoderately; not the enjoying of wine, but doing it to excess (meta paroinias). As also the next thing he states likewise with the same measure, in the words, \"Not in chambering and wantonness;\" for here also he does not prohibit the intercourse of the sexes, but committing fornication. \"Not in strife and envying.\" It is the deadly kind of passions then that he is for extinguishing, lust, namely, and anger. Wherefore it is not themselves only, but even the sources of them that he removes. For there is nothing that so kindles lust, and inflames wrath, as drunkenness, and sitting long at the wine. Wherefore after first saying, \"not in rioting and drunkenness,\" then he proceeded with, \"not in chambering and wantonness, not in strife and envying.\" And even here he does not pause, but after stripping us of these evil garments, hear how he proceeds to ornament us, when he says,"
