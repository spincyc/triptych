text = "Ver. 12. \"The night is far spent, the day is at hand.\" If then this is upon ending, and the latter is drawing near, let us henceforth do what belongs to the latter, not to the former. For this is what is done in the things of this life. And when we see the night pressing on towards the morning, and hear the swallow twittering, we each of us awake our neighbor, although it be night still. But so soon as it is actually departing, we hasten one another, and say It is day now! and we all set about the works of the day, dressing, and leaving our dreams, and shaking our sleep thoroughly off, that the day may find us ready, and we may not have to begin getting up, and stretching ourselves, when the sunlight is up. What then we do in that case, that let us do here also. Let us put off imaginings, let us get clear of the dreams of this life present, let us lay aside its deep slumber, and be clad in virtue for garments. For it is to point out all this that he says, \"Let us therefore cast off the works of darkness, and let us put on the armor of light.\" Yes, for the day is calling us to battle-array, and to the fight. Yet fear not at hearing of array and arms. For in the case of the visible suit of armor, to put it on is a heavy and abhorred task. But here it is desirable, and worth being prayed for. For it is of Light the arms are! Hence they will set thee forth brighter than the sunbeam, and giving out a great glistening, and they place thee in security: for they are arms, and glittering do they make thee: for arms of light are they! What then, is there no necessity for thee to fight? yea, needful is it to fight, yet not to be distressed and toil. For it is not in fact war, but a solemn dance and feast-day, such is the nature of the arms, such the power of the Commander. And as the bridegroom goes forth with joyous looks from his chamber, so doth he too who is defended with these arms. For he is at once soldier and bridegroom. But when he says, \"the day is at hand,\" he does not even allow it to be but near, but puts it even now beside us. For he says,"
