text = "Ver. 14. \"But put ye on the Lord Jesus Christ.\" He no longer speaks of works, but he rouses them to greater things. For when he was speaking of vice, he mentioned the works of it: but when of virtue, he speaks not of works, but of arms, to show that virtue putteth him that is possessed of it into complete safety, and complete brightness. And even here he does not pause, but leading his discourse on to what was greater, a thing far more awestriking; he gives us the Lord Himself for a garment, the King Himself: for he that is clad with Him, hath absolutely all virtue. [1579] But in saying, \"Put ye on,\" he bids us be girt about with Him upon every side. As in another place he says, \"But if Christ be in you.\" (Rom. viii. 10.) And again, \"That Christ may dwell in the inner man.\" (Eph. iii. 16, 17, al. punct.) For He would have our soul to be a dwelling for Himself, and Himself to be laid round about us as a garment, that He may be unto us all things both from within and from without. For He is our fulness; for He is \"the fulness of Him that filleth all in all\" (ib. i. 23): and the Way, and the Husband, and the Bridegroom;--for \"I have espoused you as a chaste virgin to one husband,\" (2 Cor. xi. 2): and a root, and drink, and meat, and life;--for he says, \"I live, yet not I, but Christ liveth in me;\" (Gal. ii. 20) and Apostle, and High-Priest, and Teacher, and Father, and Brother, and Joint-heir, and sharer of the tomb and Cross;--for it says, \"We were buried together with Him,\" and \"planted together in the likeness of His Death\" (Rom. vi. 4, 5): and a Suppliant;--\"For we are ambassadors in Christ's stead\" (2 Cor. v. 20): and an \"Advocate to the Father;\"--for \"He also maketh,\" it says, \"intercession for us:\" (Rom. viii. 34) and house and inhabitant;--for He says, \"He that abideth in Me and I in Him\" (John xv. 5): and a Friend; for, \"Ye are My friends\" (ib. 14): and a Foundation, and Corner-stone. And we are His members and His heritage, and building, and branches, and fellow-workers. For what is there that He is not minded to be to us, when He makes us cleave and fit on to Him in every way? And this is a sign of one loving exceedingly. Be persuaded then, and rousing thee from sleep, put Him on, and when thou hast done so, give thy flesh up to His bridle. For this is what he intimates in saying,"
