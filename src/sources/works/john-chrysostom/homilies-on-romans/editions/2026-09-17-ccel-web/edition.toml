notes = "Dated CCEL digital witness of the historical NPNF English expression. The exact controlling anthology retains its print-basis and reprint statements. No identity with newly collated print images or New Advent’s revised delivery is asserted. The constituent title credits J. B. Morris and W. H. Simcox as translators, with George B. Stevens as reviser and note author (30997-31023). The Oxford preface credits Morris with the translation and much note matter (31139-31141); the 1876 prefatory addendum identifies Simcox as revising the translation against Field (31145-31155). The held NPNF/CCEL prefatory discussion at physical lines 31062-31077 argues for delivery at Antioch rather than Constantinople, but supplies no calendar year for these homilies. This bounded source review has not established their composition year; no printing, translation, retrieval or author-life year is substituted. Only the English expression is transcribed in these passages; no Greek original-language body or Greek collation is supplied. The selected wording is retained from the existing complete CCEL container, not downloaded again or reconstructed from a model."
