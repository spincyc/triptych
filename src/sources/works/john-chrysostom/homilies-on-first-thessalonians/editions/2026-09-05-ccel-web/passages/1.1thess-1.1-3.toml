notes = "The explicit body preserves the historical translation’s spelling, punctuation, verse/section labels and inline lexical glosses, changing only wrapping whitespace and omitting numeric footnote calls. Separate editorial footnote prose remains in the complete segment and is not attributed to Chrysostom here. The passage’s locus is the enclosing homily number; this context and the exact line range identify its smaller natural unit. The common constituent title credits John A. Broadus with revision and additional notes (16481-16495). The Oxford preface credits James Tweed with the remainder of the volume after Philippians (Cotton) and Colossians (Ashworth), and identifies his Cambridge affiliation and Pastoral-Epistles translation (16557-16563). The separately printed first-Thessalonians title at 29086-29096 establishes the constituent represented here. The historical English text says Ephesians while immediately quoting Philippians; accompanying CCEL footnote 929 explicitly notices the mistake. The source wording is preserved without an emendation, and this supplies no Ephesians commentary edge."
