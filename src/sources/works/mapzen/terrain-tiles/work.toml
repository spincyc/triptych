description = "A worldwide tiled bare-earth elevation dataset published in Terrarium, normal-map, GeoTIFF, and Skadi formats. The exact documentation and AWS registry states are separately manifested. Because a cartographic crop may comprise many independently addressable tile objects and upstream source regions, no single source-library artifact is used to stand for a multi-tile acquisition."
