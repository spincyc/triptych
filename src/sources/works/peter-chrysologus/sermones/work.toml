composed_basis = "Preached by Peter Chrysologus as bishop of Ravenna: the volume title page of Migne's Patrologia Latina 52 (leaf n8) reads 'SANCTI PETRI CHRYSOLOGI ARCHIEPISCOPI RAVENNATIS OPERA OMNIA', and the head-note over it and over the Elenchus (leaf n9) reads 'TRADITIO CATHOLICA. SAECULUM V. ANNUS 450.', Migne's year for the author. No closer dating of the collection or of its single sermons is established here. Sebastiano Pauli's preface says the collection was first brought out of a private library by Felix, bishop of Ravenna, 'circa annum 707, usque ad annum 717' (PL 52:13-14, leaf n12)."
description = "The sermons of Peter Chrysologus, bishop of Ravenna, as Migne's Patrologia Latina 52 prints them from Sebastiano Pauli's recension, with notes that include selections from Dominicus Mita; the volume's Elenchus lists 'S. Petri Chrysologi Sermones' from col. 183. A locus is the sermon number of that recension. Pauli's preface declines to swear that every sermon is Chrysologus's own and says he marked those he suspected rather than removing them (PL 52:13-14). Sermo 50, De paralytico curato, preaches Matthew 9:1-8 as the day's reading ('lectio hodierna'); the same text is printed under Maximus of Turin as Homilia 108 in Patrologia Latina 57, whose editor's admonition records conflicting manuscript ascriptions."
