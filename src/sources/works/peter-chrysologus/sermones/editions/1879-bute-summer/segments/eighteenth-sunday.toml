context = "The three lessons attributed to Chrysologus in the Eighteenth Sunday after Pentecost office. Bute’s seventh to ninth lessons (p. 781) translate the sermon’s opening, from Christ working divine mysteries to men drawn by his gentleness. The Breviary omits the intervening PL 52 text on lines 10–14 apart from its repeated Gospel lemma. It stops at line 15, before the paralytic is brought; the rest of Sermon 50 is outside the English selection."
