context = "Sermo 50, headed 'De paralytico curato', preaches Matthew 9:1-8 as the day's Gospel ('lectio hodierna monstravit'): the crossing in the little ship read spiritually as Christ boarding the ship of his Church, then the paralytic carried to him on a bed, whose soul, the sermon says, was cured before his body 'fidei alienae suffragio', by the suffrage of another's faith, and the forgiving of sins as the proof of Christ's divinity against the Pharisees."
physical_line_ranges = [[25730, 25738], [25758, 25968]]
notes = "LOCUS, read on page images: PL 52:339C-342B. The heading 'SERMO L.', with note sign e, and the title 'De paralytico curato.' stand in section C of col. 339 (leaf n171); the sermon closes 'ne Christiana fide curatus, in viis Judaicae perfidiae jam moreris.' in section B of col. 342, and Sermo 51 follows at section C (leaf n172). The line ranges leave out lines 25739-25757, which carry the notes on Sermo 49 printed at the foot of col. 339; they keep the notes printed under Sermo 50 and the damaged running heads. The wording of this OCR layer is not collated as a whole; the readings quoted in these notes were read on the page images. ATTRIBUTION, as the sources held here state it, unsettled. (1) This edition prints the sermon as Chrysologus's. Its note e on the heading reads 'Vide quae de hujusmodi sermone diximus in praefatione.' (leaf n171) and does not say which statement of the preface it means. Pauli's preface (PL 52:13-14, leaf n12) declines to swear that all the sermons are genuine and says he marked, without removing, those he suspected; it also discusses the sermon titles Mita had prefixed, which the booksellers restored in this reprint. Nothing read in PL 52 for this record names Maximus of Turin, John Chrysostom or Severian in connection with this sermon. (2) Migne's Patrologia Latina 57 (1862) prints the same text as Homilia CVIII of Maximus of Turin, among Bruno Bruni's Homiliae de diversis and not in that volume's appendix of doubtful works; its editor's admonition, recorded on passage.maximus-of-turin.homiliae.1862-migne-pl-57.homilia-108, reports that part of the homily is read in the Roman Breviary on the Eighteenth Sunday after Pentecost under Chrysologus's name, that Pauli's Venice edition of 1750 ascribed it to him as Combefis had done long before, that Vatican codex 6451 names John Chrysostom, Monte Cassino codex 102 Severian, and Vatican 4222 and Laurentianus 36 Plut. XVII Maximus; the editor declines to impugn the commonly received ascription and reports the older one. (3) Rabanus Maurus, Commentariorum in Matthaeum III, prints this sermon's sentences from 'Audit veniam et tacet paralyticus' to 'ante curaretur quam corpus' at PL 107:871A-B, inside a passage he marks '(Joan. Chrysost.)'; read on the library's page facsimile artifact.jacques-paul-migne.patrologia-latina-volume-107.1864-paris.columns-869-874-facsimile-9d084bb1, PDF page 2. That passage opens with a sentence, 'Intuendum sane quantum propria cujusque fides apud Deum valeat', which a literal search of the PL 52 and PL 57 text layers did not find; OCR damage could hide it. The Catena aurea's lemma at Matthew 9 was not checked, because the library registers the Catena aurea on Luke only, and no modern critical edition of Chrysologus or of Maximus was consulted, so their judgment is not recorded here. READING TO NOTE: this printing reads 'Merito Christus offerentium fidem non respicit, et vecordiam respicit sic jacentis, ut fidei alienae suffragio paralytici anima ante curaretur quam corpus' (col. 341), and PL 57 reads 'non respicit' too (col. 504, its leaf n255). Rabanus at PL 107:871 reads 'Merito Christus offerentium fidem respicit, et vecordiam sic jacentis respicit', without the 'non', and this edition's own note b on the sentence says 'Offerentium fidem respexit Jesus'. Which reading is right is not settled here."
