verified_on = "2026-09-23"
notes = "LOCUS, read on page images: PL 52:339C-342B. The heading 'SERMO L.', with note sign e, and the title 'De paralytico curato.' stand in section C of col. 339 (leaf n171); the sermon closes 'ne Christiana fide curatus, in viis Judaicae perfidiae jam moreris.' in section B of col. 342, and Sermo 51 follows at section C (leaf n172). TEXT, collated 2026-09-23: the text and its segments are the checked transcription artifact.peter-chrysologus.sermones.1894-garnier-migne-pl-52.sermo-50-checked-text-bce4087b, taken from the volume's hashed text layer (artifact.peter-chrysologus.sermones.1894-garnier-migne-pl-52.ia-djvu-ocr-098e5136, lines 25730-25968, where the first line of col. 340 stands out of place at line 25693) and corrected word by word against the page images of cols. 339-342 on leaves n171 and n172, which govern. It is the sermon's text only: the heading and title, the footnote signs, Migne's notes a-k under each column and the running heads are left out. The printing's own misprints are kept and listed on the transcription's artifact record. Verified for wording against this printing only; no other edition or manuscript was collated, and the attribution below is not settled by it. ATTRIBUTION, as the sources held here state it, unsettled. (1) This edition prints the sermon as Chrysologus's. Its note e on the heading reads 'Vide quae de hujusmodi sermone diximus in praefatione.' (leaf n171) and does not say which statement of the preface it means. Pauli's preface (PL 52:13-14, leaf n12) declines to swear that all the sermons are genuine and says he marked, without removing, those he suspected; it also discusses the sermon titles Mita had prefixed, which the booksellers restored in this reprint. Nothing read in PL 52 for this record names Maximus of Turin, John Chrysostom or Severian in connection with this sermon. (2) Migne's Patrologia Latina 57 (1862) prints the same text as Homilia CVIII of Maximus of Turin, among Bruno Bruni's Homiliae de diversis and not in that volume's appendix of doubtful works; its editor's admonition, recorded on passage.maximus-of-turin.homiliae.1862-migne-pl-57.homilia-108, reports that part of the homily is read in the Roman Breviary on the Eighteenth Sunday after Pentecost under Chrysologus's name, that Pauli's Venice edition of 1750 ascribed it to him as Combefis had done long before, that Vatican codex 6451 names John Chrysostom, Monte Cassino codex 102 Severian, and Vatican 4222 and Laurentianus 36 Plut. XVII Maximus; the editor declines to impugn the commonly received ascription and reports the older one. (3) Rabanus Maurus, Commentariorum in Matthaeum III, prints this sermon's sentences from 'Audit veniam et tacet paralyticus' to 'ante curaretur quam corpus' at PL 107:871A-B, inside a passage he marks '(Joan. Chrysost.)'; read on the library's page facsimile artifact.jacques-paul-migne.patrologia-latina-volume-107.1864-paris.columns-869-874-facsimile-9d084bb1, PDF page 2. That passage opens with a sentence, 'Intuendum sane quantum propria cujusque fides apud Deum valeat', which a literal search of the PL 52 and PL 57 text layers did not find, and which this collation confirms is not in PL 52's text of the sermon. The Catena aurea's lemma at Matthew 9 was not checked, because the library registers the Catena aurea on Luke only, and no modern critical edition of Chrysologus or of Maximus was consulted, so their judgment is not recorded here. READING TO NOTE: this printing reads 'Merito Christus offerentium fidem non respicit, et vecordiam respicit sic jacentis, ut fidei alienae suffragio paralytici anima ante curaretur quam corpus' (col. 341), and PL 57 reads 'non respicit' too (col. 504, its leaf n255). Rabanus at PL 107:871 reads 'Merito Christus offerentium fidem respicit, et vecordiam sic jacentis respicit', without the 'non', and this edition's own note b on the sentence says 'Offerentium fidem respexit Jesus'. The transcription keeps 'non respicit' as printed. Which reading is right is not settled here."
