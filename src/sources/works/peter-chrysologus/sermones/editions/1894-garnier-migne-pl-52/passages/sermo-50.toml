context = "Sermo 50, headed 'De paralytico curato', preaches Matthew 9:1-8 as the day's Gospel ('lectio hodierna monstravit'): the crossing in the little ship read spiritually as Christ boarding the ship of his Church, then the paralytic carried to him on a bed, whose soul, the sermon says, was cured before his body 'fidei alienae suffragio', by the suffrage of another's faith, and the forgiving of sins as the proof of Christ's divinity against the Pharisees."
physical_line_ranges = [[1, 36]]
text = "Christum in humanis actibus divina gessisse mysteria, et in rebus visibilibus invisibilia exercuisse negotia, lectio hodierna monstravit. Ascendit, inquit, in naviculam, et transfretavit, et venit in civitatem suam (Matth. IX, 1). Nonne ipse est qui, fugatis fluctibus maris, profunda nudavit, ut Israeliticus populus inter stupentes undas sicco vestigio, velut montium concava, pertransiret (Exod. XIV)? Nonne hic est, qui Petri pedibus marinos vertices inclinavit, ut iter liquidum humanis gressibus solidum praeberet obsequium (Matth. XI)? Et quid est quod sibi maris sic denegat servitutem, ut brevissimi lacus transitum sub mercede nautica transferat? Ascendit, inquit, in naviculam, et transfretavit. Et quid mirum, fratres? Christus venit suscipere infirmitates nostras, et suas nobis conferre virtutes, humana quaerere, praestare divina, accipere injurias, reddere dignitates, ferre taedia, referre sanitates; quia medicus qui non fert infirmitates, infirmitates curare nescit; et qui non fuerit cum infirmo infirmatus, infirmo non potest conferre sanitatem. Christus ergo, si in suis mansisset virtutibus, commune cum hominibus nil haberet; et nisi implesset carnis ordinem, carnis in illo esset otiosa susceptio. Sustinuit ergo has necessitates, ut homo verus humanis necessitatibus probaretur. Ascendit, inquit, in naviculam. Christus Ecclesiae suae navem, saeculi fluctus semper mitigaturus ascendit, ut credentes in se ad coelestem patriam tranquilla navigatione perducat; et municipes civitatis suae faciat, quos humanitatis suae fecit esse consortes. Non ergo Christus indiget navi, sed navis indiget Christo, quia sine coelesti gubernatore navis Ecclesiae per mundanum pelagus tali et tanto discrimine ad caelestem portum non valet pervenire. Haec diximus, fratres, quantum ad intelligentiam pertinet spiritualem: verum nunc ipsius historiae ordinem prosequamur Ascendit, inquit, in naviculam et transfretavit, et venit in civitatem suam. Creator rerum, orbis Dominus, posteaquam se propter nos nostra augustiavit in carne, coepit habere humanam patriam, caepit civitatis Judaicae esse civis: parentes habere coepit parentum omnium ipse parens, ut invitaret amor, attraheret charitas, vinceret affectio, suaderet humanitas, quos fugurat dominatio, metus disperserat, fecerat vis potestatis extorres. Venit in civitatem suam, et ecce offerebant ei paralyticum jacentem in lecto, et respiciens, inquit, Jesus fidem illorum, dixit paralytico: Confide, fili: dimittuntur tibi peccata tua. Audit veniam, et tacet paralyticus, nec ullam respondet gratiam, quia plus corporis quam animae tendebat ad curam; et temporales aerumnas resoluti corporis sic deflebat, ut aeternas poenas resolutionis animae non defleret, gratiorem sibi praesentem vitam judicans quam futuram. Merito Christus offerentium fidem non respicit, et vecordiam respicit sic jacentis, ut fidei alienae suffragio paralytici anima ante curaretur quam corpus. Rescipiens, inquit, fidem illorum. Cernitis in hoc loco, fratres, Deum non quaerere insipientium voluntates, non spectare ignorantium fidem, non infirmorum stulta desideria perscrutari, sed ad alterius fidem subvenire, quod per solam gratiam conferebat, cum quidquid divinae voluntatis est, non negaret. Et re vera, fratres, quando medicus languentium aut quaerit, aut recipit voluntates, cum semper contraria desideret et requirat infirmus; hinc est quod nunc ferrum, nunc ignem, nunc amara pocula ingerit, et apponit invitis, ut curam sani sentiant, quam non poterant sentire aegrotantes. Et si homo injurias descipit, maledicta contemnit, ut sauciatis morbo sponte vitam conferat et salutem; quando magis Christus medicus bonitate divina morbis saucios peccatorum, et phrenesi criminum laborantes, ad salutem etiam invitos attrahit, et nolentes? O si velimus, fratres, o si velimus omnem mentis nostrae paralysim pervidere, animam nostram virtutibus destitutam jacere in vitiorum stratis cernere; luceret nobis quemadmodum Christus, et nostras quotidie noxias repicit voluntates, et ad salutaria nos remedia pertrahit, et perurget invitos. Fili, inquit, remittuntur tibi peccata tua. Haec dicens, Deum se volebat intelligi, qui per hominem oculis adhuc latebat humanis; virtutibus enim et signis comparabatur prophetis, qui per ipsum fecerant et ipsi virtutes: peccatis autem dare veniam, quia penes hominem non est, et est singulare deitatis insigne, Deum illum pectoribus inserebat humanis. Probat hoc Pharisaicus livor: nam dixisset: Remittuntur tibi peccata tua, responderunt Pharisaei: Hic blasphemat, quis enim potest peccata remittere nisi solus Deus? Pharisaee, qui sciendo nescis, confitendo negas, cum testaris, impugnas: si Deus est qui remittit peccata, cur tibi Christus Deus non est, qui unius indulgentiae suae munere totius mundi probatur abstulisse peccata? Ecce, inquit, Agnus Dei, ecce qui tollit peccata mundi (Joan. I). Ut autem possis majora capere ejus divinitatis insignia, audi eum pectoris tui penetrasse secretum; aspice eum ad cogitationum tuarum latebras pervenisse; intellige eum cordis tui tacita nudare consilia. Et cum vidisset, inquit, Jesus cogitationes eorum, dixit: Quid cogitatis mala in cordibus vestris? Quid enim est facilius dicere, Remittuntur tibi peccata tua, an dicere, Surge et ambula? Ut autem sciatis quia Filius Hominis habet potestatem dimittendi peccata, dixit paralytico, Surge, tolle lectum tuum, et vade in domum tuam; et surrexit et abiit in domum suam. Scrutator animarum praevenit mentium maligna consilia, et deitatis suae potentiam operis attestatione monstravit, dum dissipati corporis membra componit, nervos stringit, jungit ossa, complet viscera, firmat artus, et gressus ad cursum suscitat in vivo cadavere jam sepultos. Tolle lectum tuum. Hoc est, porta portantem, omnes muta vices, ut quod est infirmitatis testimonium sit probatio sanitatis, ut lectus doloris tui sit meae curationis indicium, ut receptae fortitudinis magnitudinem ponderis asserat magnitudo. Vade, inquit. in domum tuam, ne Christiana fide curatus, in viis Judaicae perfidiae jam moreris."
