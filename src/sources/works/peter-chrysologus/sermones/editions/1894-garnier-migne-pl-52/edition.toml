notes = "The Garnier reissue of Migne's Patrologia Latina 52. Both title pages were read on page images registered here: the series title page (leaf n6) and the volume title page (leaf n8) each carry the imprint of Garnier fratres, Avenue du Maine 208, dated 1894. The Internet Archive item metadata dates the item 1844, which is not the printing of these bytes; the same metadata notes that the imprint varies and that some volumes are reprints. The volume's Elenchus (leaf n9) places 'S. Petri Chrysologi Sermones' at col. 183, before Valerian of Cimiez at col. 681. Sermo 50, De paralytico curato, stands at PL 52:339C-342B (leaves n171-n172), physical lines 25730-25968 of the text layer; see its passage record for the attribution question. Registered on the pattern this library uses for a constituent of a Migne volume: the edition is the constituent as the volume prints it, and the volume's text layer is entered as a container in src/sources/inventories/source-containment-v1.toml. Valerian's and Nicetas's works, which the same volume prints, have no record of their own."
