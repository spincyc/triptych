notes = "One page image, leaf n12: cols. 13-14, the close of Sebastiano Pauli's Praefatio and the opening of the Vita from Agnellus, 2279 by 3721 pixels. Read on this image: 'Caeterum sancti hujus antistitis Sermones hos, primus omnium e privatae bibliothecae pluteis eruit Felix, et ipse episcopus Ravennas XL; qui sedem obtinuit sub initium saeculi octavi, circa annum 707, usque ad annum 717'; 'Non autem juramentum praestare vellem, omnes hos genuinos Chrysologi fetus esse: nam nonnullos reperies obscuros, intricatos eloquio, et nostro haud dignos auctore.'; 'Non autem ea, quae sublestae esse fidei suspicabar, expungere ausus sum. Indicavi tantum, religionis inde ducens privato judicio sacros vetustosque codices imminuere, et temerarias in eos manus injicere.'; and, on the sermon titles Mita had prefixed and Pauli had struck out, note (a): 'Etsi V. C. Sebastianus Pauli inscriptiones a Dominico Mita singulis Sermonibus praemissas, mss. codicum auctoritatem secutus, rejecerit; Bibliopolae tamen, habita legentium et concionatorum commodi ratione, eas denuo novissimae huic editioni apponendas esse censuerunt.' One leaf only."
