provenance = "Triptych transcription made on 2026-09-23 from the hashed Internet Archive text layer of Patrologia Latina 52, every word of it read against the registered page images of cols. 339-342 (leaves n171 and n172, artifact.peter-chrysologus.sermones.1894-garnier-migne-pl-52.ia-leaf-n171-e5985cda and artifact.peter-chrysologus.sermones.1894-garnier-migne-pl-52.ia-leaf-n172-eb5cba74), which govern wherever the two differ."
