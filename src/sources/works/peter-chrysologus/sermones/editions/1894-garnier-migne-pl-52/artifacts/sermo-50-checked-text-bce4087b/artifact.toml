rights_basis = "This focused transcription reproduces one sermon as Migne's Patrologia Latina 52 prints it at Paris in 1894, before 1931, which is in the public domain in the United States on the repository's own rights reading recorded at guidance/missals.md section 5. The transcription repairs recognition damage against the printing's own page images and adds no original authorship; it carries no Internet Archive markup and none of Migne's editorial notes."
