transformation = "Take the sermon's text from the hashed optical character recognition and correct it against the page images of PL 52:339C-342B, which govern; write one sentence per LF-terminated UTF-8 line, prefixed by a braced Migne column locator for the column the sentence begins in; preserve the printing's wording, spelling, capitalization and punctuation, including its evident misprints, while rejoining line-end hyphenation, writing the ligatures ae and oe as two letters as the printing distinguishes them, and closing up the space the printing sets before question marks, colons and semicolons; keep the scriptural references the printing sets in the text; omit the heading and title, footnote signs, the editorial footnotes, running heads, and column numbers and letters."
