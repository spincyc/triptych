notes = "Collated 2026-09-23. Misprints kept as printed, each read on the page image: 'augustiavit' and 'fugurat' in col. 340; 'Rescipiens', 'descipit' and 'repicit' in col. 341; 'caepit civitatis' in the sentence that twice sets 'coepit', and 'caelestem portum' after 'coelestem patriam' and 'coelesti', all in col. 340; '(Matth. XI)' for the walking on the sea in col. 340; 'nam dixisset' without 'cum' in col. 341; and 'Vade, inquit. in domum tuam' with a full stop after 'inquit' in col. 342. 'Non respicit' in col. 341 is the printing's reading; its note b and the Rabanus variant are recorded on the passage. The italic ligature in 'Pharisaei' in col. 341 is read as ae. Where the text layer differs from the page it is only by recognition damage, run-together words and a misplaced line: it reads 'cum sero per' for 'cum semper', 'Aescipiens' for 'Rescipiens', 'Pili' for 'Fili' and 'surreail' for 'surrexit', and it carries the first line of col. 340, 'pentes undas sicco vestigio, velut montium concava,', at its line 25693, beside the close of Sermo 49."
