notes = "One page image, leaf n171: cols. 339-340, 2267 by 3667 pixels. Read on this image: the close of Sermo 49, then in section C of col. 339 the heading 'e SERMO L.' and title 'De paralytico curato.', and the opening 'Christum in humanis actibus divina gessisse mysteria, et in rebus visibilibus invisibilia exercuisse negotia, lectio hodierna monstravit. Ascendit, inquit, in naviculam, et transfretavit, et venit in civitatem suam (Matth. IX, 1).' Note e at the foot of col. 339 reads 'Vide quae de hujusmodi sermone diximus in praefatione.' One leaf only."
