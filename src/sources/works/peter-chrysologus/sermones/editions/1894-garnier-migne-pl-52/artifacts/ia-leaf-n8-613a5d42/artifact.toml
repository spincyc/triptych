notes = "One page image, leaf n8: the volume title page, 2279 by 3721 pixels. Read on this image: 'TRADITIO CATHOLICA. SAECULUM V. ANNUS 450.', 'SANCTI PETRI CHRYSOLOGI ARCHIEPISCOPI RAVENNATIS OPERA OMNIA RECUSA AD CASTIGATISSIMAM RECENSIONEM SEBASTIANI PAULI, QUI PRAEFATUS EST, NOTASQUE ADJECIT IN QUIBUS MANUSCRIPTORUM CODICUM COLLATIONES, SELECTIORA QUAEDAM EX OBSEVATIONIBUS DOMINICI MITAE, VARIAE LECTIONES LATINI LATINII, NECNON CASTIGATIONES MEURSII COMPREHENDUNTUR.' (the printing's 'OBSEVATIONIBUS'), 'SEQUUNTUR SANCTORUM VALERIANI ET NICETAE, CEMELIENSIS ET AQUILEIENSIS EPISCOPORUM SCRIPTA UNIVERSA', 'TOMUS UNICUS', and the same Garnier imprint dated 1894. One leaf only."
