notes = "One page image, leaf n172: cols. 341-342, 2267 by 3667 pixels; the running head reads 'SERMO LI.' Read on this image, col. 341: 'Merito Christus b offerentium fidem non respicit, et vecordiam respicit sic jacentis, ut fidei alienae suffragio paralytici anima ante curaretur quam corpus. Rescipiens, inquit, fidem illorum.' (the printing's 'Rescipiens'); note b: 'In nonnullis, operantium. Offerentium fidem respexit Jesus. Nam sicut servo centurionis profuerat fides amicorum domini sui, ita huic aegroto profuit fides amicorum una cum sui ipsius fide.' Col. 342: the close 'Vade, inquit, in domum tuam, ne Christiana fide curatus, in viis Judaicae perfidiae jam moreris.' in section B, then 'SERMO LI / De daemoniaco surdo et muto curato.' at section C. One leaf only."
