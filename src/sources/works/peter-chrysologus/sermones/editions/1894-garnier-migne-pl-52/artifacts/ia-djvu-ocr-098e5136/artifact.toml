notes = "Extent as retrieved and measured: complete uncorrected OCR of Migne, Patrologia Latina vol. 52 (Peter Chrysologus, Valerian of Cimiez and Nicetas of Aquileia; Paris: Garnier, 1894), whole volume, 104,221 LF-terminated lines, ending 'FINIS TOMI QUINQUAGESIMI SECUNDI.' at line 103801 and a library date-due slip. The volume's own Elenchus stands at lines 354-477; its column figures are damaged in this layer and were read on leaf n9 instead. The containment inventory enters the works it lists. Chrysologus's Sermo 50 stands at lines 25730-25968. Uncorrected optical recognition: a locating and searching layer, not a text of record. Column figures, sermon numbers and running heads are damaged in places (the running head over cols. 341-342 reads 'SERMO LI.' although Sermo 50 runs on to col. 342), and a reading quoted from it is collated against a page image before it is relied on."
