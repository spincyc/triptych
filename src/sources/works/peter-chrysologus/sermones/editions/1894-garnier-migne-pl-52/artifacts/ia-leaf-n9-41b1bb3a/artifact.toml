notes = "One page image, leaf n9: the 'ELENCHUS AUCTORUM ET OPERUM QUI IN HOC TOMO LII CONTINENTUR', 2279 by 3721 pixels. Read on this image, with the columns it gives: S. PETRUS CHRYSOLOGUS -- Prolegomena (the epistle to Eutyches read at cols. 23 and 71) 9; Sebastiani Pauli Praefatio 9; Vita ex Libro Pontificali Agnelli, cum observationibus Benedicti Bacchinii 13; Vita altera, auctore Martino Castillo 27; Dominici Mitae Praefatio cui inest Vita 41; Schoenemanni Notitia litteraria 87; Jos. A. Amadesii Dissertatio de Metropoli ecclesiastica Ravennatensi 91; S. Petri Chrysologi Sermones 183. S. VALERIANUS CEMELIENSIS EPISCOPUS -- J. Sirmondi Epistola de hac editione 681; Testimonia de S. Valeriano 685; S. Valeriani Homiliae 691; Epistola ad Monachos 755; Apologia pro S. Valeriano, auctore Theophilo Raynaudo 757. S. NICETAS AQUILEIENSIS EPISCOPUS -- Monitum Editorum Patrologiae 837; Petri Braidae Praefatio 837; Schoenemanni Notitia 839; Veterum Testimonia 843; Officium S. Nicetae 845; Liber de ratione fidei 847; De Spiritus sancti potentia 853; De diversis appellationibus D. N. Jesu Christo convenientibus 863; Explanatio Symboli ad Competentes 865; Fragmenta sex 873; Petri Braidae Dissertatio 875; Vetera monumenta duo Capituli Aquileiensis 1135; Indices 1135. One leaf only."
