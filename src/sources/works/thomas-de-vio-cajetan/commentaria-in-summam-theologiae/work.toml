composed_basis = "Cajetan finished the commentary on the Prima Pars in 1507 and on the Tertia Pars in 1520; the Leonine edition of Aquinas prints it beneath the text."
description = "Cajetan's article-by-article commentary on the Summa theologiae, printed with the text in the Leonine edition. On the Prima Pars it defends Aquinas's theses that each angel is its own species (q. 50 a. 4) and that the angel is in place by the application of its power (q. 52 a. 1). A locus is question, article, and Cajetan's paragraph number."
