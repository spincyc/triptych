description = "The acts of the canonization of Bernadette Soubirous by Pius XI on 8 December 1933, feast of the Immaculate Conception, in the Vatican Basilica: the record of the canonization rite with the solemn formula (fixing her universal memory on 16 April) and the papal homily, and the Litterae decretales narrating her life, the cause (introduced 1913; heroic virtue 1923; beatification miracles decree 1 May 1925; beatification 14 June 1925; canonization miracles decree 31 May 1933; tuto 2 July 1933; consistory 16 October 1933) and decreeing the honors of the Saints. Published in Acta Apostolicae Sedis 26 (1934). Loci are the AAS volume's printed page numbers."
relations = ["work.holy-see.acta-apostolicae-sedis"]
