notes = "The title page states that the texts are taken from manuscripts and printed books in the British Museum and Bodleian libraries and are 'now first done into modern spelling.' The wording is therefore an editorially normalized English text, itself a translation of a Latin original; it is not a diplomatic transcription of any manuscript and is not a witness to the Latin. Comper's editorial notes, glosses, and collation footnotes are her own and are distinguished from the tract wording."
