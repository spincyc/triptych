description = "Comper's 1917 anthology of late-medieval English writings on dying, assembled from manuscripts and printed books in the British Museum and Bodleian libraries and printed in modernized spelling. The container is an edited anthology and its identity is distinct from the constituent tracts printed within it: The Craft of Dying (translated from an anonymous Latin ars moriendi, transcribed from Bodleian MS 423 and collated against Douce MS 322 and Rawlinson MS C. 894); an abridgment ascribed to William Caxton and translated from an untraced French source; a further abridgment; chapters from Suso's Horologium sapientiae, the Toure of all Toures, and Richard Rolle's Form of Living; a fragment from MS Bodley 423; and The Lamentation of the Dying Creature. Comper reports that the author of the older Latin original of The Craft of Dying is unknown, that the tract cites Gerson as an authority rather than being his work, and that the block-books of the Ars moriendi are a separate line of transmission. A locus is a page of the 1917 printing, optionally a page range."
