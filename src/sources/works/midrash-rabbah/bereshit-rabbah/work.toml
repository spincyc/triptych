description = "The classical exegetical midrash on Genesis, compiled in the Land of Israel and usually dated to the fifth century. It proceeds verse by verse and preserves competing interpretations side by side under the names of their tradents; a passage of Bereshit Rabbah is a record of disagreement, not a single reading. Section 44 covers Genesis 15. A locus is parashah:section."
