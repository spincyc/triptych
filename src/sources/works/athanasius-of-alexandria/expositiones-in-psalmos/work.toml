description = "The Psalm expositions printed under Athanasius's name in Migne's Patrologia Graeca 27. This run reads two places no Latin witness it checked carries: at Psalm 83:10b 'thy Christ' taken corporately, of the people called to a royal priesthood, and at 83:11a the one day in the courts read as the Saviour's resurrection day set against the thousand years of the worship under the Law; and at Psalm 94:1 the shout of 'iubilemus' glossed technically as the alalagmos. The attribution is the printing's and is recorded as an attribution."
