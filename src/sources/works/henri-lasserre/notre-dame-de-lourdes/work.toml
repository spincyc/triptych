description = "Henri Lasserre's narrative history of the 1858 Lourdes apparitions and their sequel, first published 1869, written with access to living witnesses and honored with a brief of Pius IX to the author. Apologetic narrative rather than critical edition; documentary carrier of the mandement of 18 January 1862 and of the author's recorded 1860s attempts to obtain the police and judicial records (refused; the prefecture reported the dossier disappeared). Container identity distinct from the diocesan act it reproduces. Loci are printed page numbers of the cited imprint."
