description = "Scotus's revised Oxford commentary on the Sentences of Peter Lombard. Book II, distinctions 2-11, treats the angels: their duration, place, and motion (d. 2), individuation and plurality in one species (d. 3), and their sin (d. 6). Question numbering differs between the Wadding-Vives and Vatican editions; a locus is book, distinction, part where divided, and question."
