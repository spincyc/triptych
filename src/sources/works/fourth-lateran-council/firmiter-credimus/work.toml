description = "The first constitution of the Fourth Lateran Council (1215), the profession of the Catholic faith opening with Firmiter credimus. It defines the one God and creator of all things visible and invisible, the Incarnation, the general resurrection in which all will rise with their own bodies which they now bear, the one universal Church outside which no one at all is saved, and transubstantiation."
