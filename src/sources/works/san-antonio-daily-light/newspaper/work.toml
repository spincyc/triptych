description = "A daily newspaper published at San Antonio, Texas, digitised for the Library of Congress's Chronicling America under Library of Congress control number sn86090439. One 1890 issue is registered here, for a paragraph that reprints Galatians 6:9 - appointed in the Epistle of the Fifteenth Sunday after Pentecost - with the harvest replaced by a cash prize. A locus is issue date, page and column."
