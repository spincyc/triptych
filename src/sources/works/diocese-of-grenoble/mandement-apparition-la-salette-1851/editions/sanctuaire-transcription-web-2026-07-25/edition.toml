notes = "A partial custodial transcription: the Sanctuary prints article 1 with its own bracketed ellipsis after 'sur la montagne de La Salette'. Consumers must reproduce the ellipsis and must not fill it. The same page attributes to Bishop Ginoulhiac, in 1855, the received formula 'La mission des bergers est finie, celle de l'Eglise commence'. Mutable web state; no exact bytes retained."
