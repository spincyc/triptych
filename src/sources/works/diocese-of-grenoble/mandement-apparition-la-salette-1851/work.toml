description = "The doctrinal mandement of the Bishop of Grenoble, dated 19 September 1851, the fifth anniversary of the reported apparition, closing five years of diocesan inquiry: it judges that the apparition of the Blessed Virgin to two shepherd children on 19 September 1846, on a mountain of the Alpine chain in the parish of La Salette, archpresbytery of Corps, bears in itself all the characteristics of truth and that the faithful have grounds for believing it indubitable and certain; states that the fact acquires a further degree of certainty from the concourse of the faithful and the prodigies that followed; authorizes the cult of Our Lady of La Salette and permits it to be preached; reserves every particular prayer formula, hymn, and book of devotion to prior written episcopal approval; forbids the faithful and priests of the diocese to rise publicly against the fact; announces the purchase of the ground, a church, and a hospice for pilgrims; exhorts to penance and the sanctification of Sunday; and orders the act read in every church and chapel of the diocese. The competent positive diocesan judgment on the La Salette apparition, retained in its historical formula. Its operative clause is cited by the Dicastery for the Doctrine of the Faith in the presentation of the 2024 norms. No French printing of the integral act has been registered here; the editions below are the witnesses in which its wording has been read. Loci are free-form descriptions of the act's parts."
