description = "The mandement of 1 May 1852 by which the Bishop of Grenoble instituted a body of diocesan missionaries to be called the Missionaries of Notre-Dame de La Salette, defining them by the ministry of welcome, preaching, reconciliation, and the Eucharist, calling their creation and existence, like the sanctuary itself, an eternal monument and perpetual memorial of the merciful apparition of Mary; providing for habitual residence in the episcopal city, summer service on the mountain and winter preaching in the parishes; and appealing for a novitiate house at Grenoble. The same act announced the arrangements for laying the foundation stone of the new church, fixed for 25 May 1852. Loci are free-form descriptions of the act's parts."
