context = "Article 89 (p. 122), the norms for revising the Office: (a) Lauds as morning prayer and Vespers as evening prayer, by the venerable tradition of the whole Church the twofold hinge of the daily Office, are to be held and celebrated as the chief Hours; (b) Compline is to be arranged to suit the end of the day; (c) the Hour called Matins (Hora quae Matutinum vocatur), while keeping the character of night praise in choir, is to be adapted so that it can be said at any hour of the day, with fewer psalms and longer readings; (d) Prime is to be suppressed; (e) in choir Terce, Sext and None are kept, and outside choir one of the three may be chosen to suit the time of day. The General Instruction of the Liturgy of the Hours n. 57 applies the words of (c) to the Office of Readings."
