context = "Article 102 (p. 125), opening chapter V De anno liturgico: Holy Mother Church celebrates her Spouse's saving work by sacred remembrance on fixed days through the year; weekly on the Lord's Day and yearly at Easter; she unfolds the whole mystery of Christ through the year, from the Incarnation and Nativity to the Ascension, Pentecost, and the expectation of blessed hope and of the Lord's coming (the Latin's 'adventus Domini'), and so opens the riches of the Lord's saving acts to the faithful, made present in some way in every time."
