notes = "This passage is intentionally narrower than articles 59-82 so the foundational theology of sacraments and sacramentals can propagate as a first-class reusable claim node apart from the subsequent disciplinary norms for revising particular rites. Verification is bounded to the official dated web delivery and is not a cross-language critical collation. The restricted HTML was not retained, so no central transcription or replayable physical-line locator is claimed."
