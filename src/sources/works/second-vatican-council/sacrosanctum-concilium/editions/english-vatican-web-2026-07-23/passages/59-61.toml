context = "The complete English articles 59-61 were inspected together. They describe the sacraments as sanctifying, ecclesial, worshipful, instructive signs that presuppose, nourish, strengthen, and express faith and impart grace; define sacramentals as Church-instituted sacred signs; and relate both to the paschal mystery's sanctification of human life and material things."
