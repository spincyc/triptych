notes = "This passage is intentionally narrower than articles 26-35 so the ecclesial and communal character of liturgical celebration can propagate as a first-class reusable claim node apart from the later norms on ministries, participation, signs, and instruction. Verification is bounded to the official dated web delivery and is not a cross-language critical collation. The restricted HTML was not retained, so no central transcription or replayable physical-line locator is claimed."
