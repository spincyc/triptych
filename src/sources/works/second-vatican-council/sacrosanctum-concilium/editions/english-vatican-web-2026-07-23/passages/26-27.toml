context = "The complete English articles 26-27 were inspected together. They state that liturgical services are celebrations of the Church rather than private functions, pertain to and manifest the whole ecclesial body while affecting members according to their roles, and prefer communal celebration with active participation wherever the rite provides for it, especially for Mass and the sacraments."
