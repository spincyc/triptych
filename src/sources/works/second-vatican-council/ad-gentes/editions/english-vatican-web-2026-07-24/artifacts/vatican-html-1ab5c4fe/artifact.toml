notes = "The content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19651207_ad-gentes_en.html returned a byte-identical 122003-byte response with this SHA-256 on 2026-07-24; the press route returned HTTP 404 and is not recorded as an alias. The response contains the complete numbered English body and chapter-separated notes but no promulgation or subscription block. Delivered defects include article 1's unclosed quotation and «overseer: of the ages»; article 2's «His life and His cry» where the Latin has vita et gloria; article 4's «Acts of the Apostles took again», omitted note marker 9, and malformed «a giving life, soul-like»; article 5's «disciples of a nations»; article 7's «1 Tim. 2:45» for 1 Timothy 2:4-6; recurrent Lumen gentium labels that point to Dei Verbum; recurrent Rerum Ecclesiae labels that point to Ex corde Ecclesiae; and note 24's corruption of Augustine, De civitate Dei 19.17 as «St. Augustine 7, City of God, 1917». This records known source-local defects without claiming an exhaustive diplomatic collation. Exact bytes are identified but not retained."
