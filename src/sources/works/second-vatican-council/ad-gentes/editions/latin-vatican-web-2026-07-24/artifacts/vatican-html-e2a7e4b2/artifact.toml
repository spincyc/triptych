notes = "The content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19651207_ad-gentes_lt.html returned a byte-identical 156429-byte response with this SHA-256 on 2026-07-24; the press route returned HTTP 404 and is not recorded as an alias. The response contains the complete numbered Latin body and consolidated notes; after article 42 it duplicates the promulgation formula, gives the date and papal signature, and appends only a partial shared subscription block ending with Cardinal Callori di Vignale. Known delivery defects include article 41's «sunti illi laici», note 102's AAS 51 (1919) for 1959, note 135's Princeps Pastorum link mislabeled Lumen gentium, and note 165's AAS 28 (1926) for volume 18. This records known source-local defects without claiming an exhaustive diplomatic collation. Exact bytes are identified but not retained."
