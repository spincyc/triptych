notes = "The press route https://press.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19641121_unitatis-redintegratio_lt.html and content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19641121_unitatis-redintegratio_lt.html returned byte-identical 66227-byte responses with this SHA-256 on 2026-07-24; the aliases are not duplicated. The response contains articles 1-24, formula and date, and a 43-entry subscription block abridged relative to the Acta. It then appends the distinct Lumen gentium Notificationes, embedded 6 March 1964 Doctrinal Commission declaration, and complete Nota explicativa praevia, with Pericle Felici's signature, before presenting Unitatis Redintegratio's notes. Those three works are not part of this Decree, and the response omits the remaining subscriptions and final attestations printed in the Acta. Exact bytes are identified but not retained."
