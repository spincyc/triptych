notes = "A dated Vatican delivery state of the Latin Decree. The exact response contains articles 1-24, formula and date, an abridged subscription block, and consolidated notes. Between the subscriptions and the Decree's notes, the delivery page appends the distinct Lumen gentium Notificationes, the Doctrinal Commission declaration of 6 March 1964, and the complete Nota explicativa praevia; those separate works are not absorbed into this edition."
