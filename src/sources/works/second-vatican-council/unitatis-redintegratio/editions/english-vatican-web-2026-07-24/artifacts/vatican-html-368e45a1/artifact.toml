notes = "The press route https://press.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19641121_unitatis-redintegratio_en.html and content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19641121_unitatis-redintegratio_en.html returned byte-identical 50959-byte responses with this SHA-256 on 2026-07-24; the aliases are not duplicated. The response contains the complete numbered body, translated promulgation formula and date, and consolidated notes. Delivered defects include article 2's «thou has», article 3's «embraces upon them», note 2's «Jn. 11, S2», note 11's Matthew 16:18 where the Latin and Acta witnesses give 16:19, note 15's «1 Petr. 2, 2S», «VATICANUM 1», and «Collac», note 22's «Enarr. 11», note 27's «LATERANSE», note 28's Ephesians 4:24 where the Latin gives 4:23, and note 36's «loannem». This list records known source-local defects without claiming an exhaustive diplomatic collation. Exact bytes are identified but not retained."
