notes = "The content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_lt.html returned a byte-identical 23616-byte response with this SHA-256 on 2026-07-24; the press route returned HTTP 404 and is not recorded as an alias. The response contains the complete numbered Latin body, promulgation formula, date, and papal signature. It then appends the distinct Vacatio legis pro decretis promulgatis in sessione VII and a shared subscription block that stops at Alexander Toki, omitting the remaining named subscriptions, continuation notice, and notarial attestations printed on Acta p. 701. Article 4 delivers «rami oleastri Genti» where the Acta prints «rami oleastri Gentium»; note 5 delivers «Gregorios VII» where the Acta prints «Gregorius VII»; and the final displayed subscription gives «ALEXANDER TOKI» where the Acta prints «ALEXANDER TOKIC». These appended materials and source-local defects are not part of the bounded articles 1-5. Exact bytes are identified but not retained."
