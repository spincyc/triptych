notes = "The press route https://press.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html and content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decl_19651028_nostra-aetate_en.html returned byte-identical 17231-byte responses with this SHA-256 on 2026-07-24; the aliases are not duplicated. The response contains the complete numbered English body and consolidated notes but no promulgation or subscription block. Delivered defects include article 3's «all- powerful»; article 4's broken punctuation in «Christ-Abraham's sons according to faith (6)-are», «Gentiles. making», and «calls He issues-such»; and note 5's presentation of Gregory VII's Epistola III, 21 as «letter XXI» with only the imprecise «Pl. 148, col. 450f.» citation. This list records known source-local defects without claiming an exhaustive diplomatic collation. Exact bytes are identified but not retained."
