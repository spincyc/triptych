notes = "The content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19641121_orientalium-ecclesiarum_lt.html returned a byte-identical 51347-byte response with this SHA-256 on 2026-07-24; the alias is not duplicated, while the corresponding press route returned HTTP 404. The response contains articles 1-30, formula and date, a vacatio-legis notice, and a 43-entry subscription block that is abridged relative to the Acta. It then appends the distinct Lumen gentium Notificationes, embedded 6 March 1964 Doctrinal Commission declaration, and Nota explicativa praevia before presenting the Decree's notes; those works are not part of Orientalium Ecclesiarum. The HTML title and keywords misspell the incipit as Orientalium ecclesiarium. The web note for Basil gives PG 32, 669 B where the Acta prints 689 B, and the web formula differs slightly from the Acta formula. Exact bytes are identified but not retained."
