notes = "The content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19641121_orientalium-ecclesiarum_en.html returned a byte-identical 33012-byte response with this SHA-256 on 2026-07-24; the alias is not duplicated. The response contains the complete numbered body, translated promulgation formula and date, and consolidated notes. Its HTML title, description, and keywords misspell the incipit as Orientalium ecclesiarium although the visible heading is correct. In article 26 the body markers for notes 31 and 32 are reversed relative to the note content, Latin web witness, and Acta witness. Exact bytes are identified but not retained."
