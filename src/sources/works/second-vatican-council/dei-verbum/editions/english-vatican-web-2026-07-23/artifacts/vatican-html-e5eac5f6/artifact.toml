notes = "The archive URL, https://press.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_const_19651118_dei-verbum_en.html, and https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_const_19651118_dei-verbum_en.html returned byte-identical 43095-byte responses with this SHA-256 on 2026-07-23. This artifact owns that one byte identity; the alias routes are not duplicated. The response contains articles 1-26 and consolidated notes but no promulgation or subscription block and no appended Notificatio. Its note to article 15 cites Mit brennender Sorge at AAS 29 (1937), p. 51, while the Latin web and AAS witnesses give p. 151; the discrepancy is preserved rather than harmonized. Exact bytes are identified but not retained."
