notes = "The press route https://press.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19651028_perfectae-caritatis_en.html and content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19651028_perfectae-caritatis_en.html returned byte-identical 36410-byte responses with this SHA-256 on 2026-07-24; the aliases are not duplicated. The response contains the complete numbered English body and its single Ambrose note but no promulgation or subscription block. Delivered defects include article 1's «ministry-the building»; article 2's malformed list marker «e )»; article 11's missing punctuation after «not Religious institutes» and «everywhere in and»; article 13's missing separator between Matthew 25:34-46 and James 2:15-16; article 15's «cf.Rom.» and «to-the diversity»; and article 19's «have recently established» with «been» omitted. This records known source-local defects without claiming an exhaustive diplomatic collation. Exact bytes are identified but not retained."
