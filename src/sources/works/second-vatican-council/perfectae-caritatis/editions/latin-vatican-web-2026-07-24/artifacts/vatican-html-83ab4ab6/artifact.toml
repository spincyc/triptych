notes = "The content-delivery route https://www.vatican.va/content/dam/wss/archive/hist_councils/ii_vatican_council/documents/vat-ii_decree_19651028_perfectae-caritatis_lt.html returned a byte-identical 40389-byte response with this SHA-256 on 2026-07-24; the press route returned HTTP 404 and is not recorded as an alias. The response contains the complete numbered Latin body, followed by the promulgation formula, date, papal signature, and a common subscription block that stops at Alexander TOKI and omits the later p. 701 signatories, continuation notice, and notarial attestations present in the Acta; its single Ambrose note appears after that block. Delivered defects include article 7's «Ecclesia e decus»; article 15's «Rom. 57, 5» for Romans 5:5 and «Io. 13 35»; «ALEXANDER TOKI» for TOKIC; and missing terminal punctuation after Cardinal MORANO. This records known source-local defects without claiming an exhaustive diplomatic collation. Exact bytes are identified but not retained."
