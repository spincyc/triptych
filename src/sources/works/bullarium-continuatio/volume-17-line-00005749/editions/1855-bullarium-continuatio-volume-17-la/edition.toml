notes = "Fully read LF5749–5912 plus 20 literal LF of outside context, using split('\\n') only. Actual Leo XII source issuer at LF5758; full Latin body and own closing consistent. CLXXXVII begins on native leaf43 right column, LF5749–5783; leaf44 left LF5789–5854 continues the same sentence/congregation recital, then right LF5858 completes asser- / vatur and proceeds through §§3–5 and dating LF5908–5912. All substantive columns proceed in that order. The full expressly inserted congregational decree at LF5800–5863 includes its own secretary attestation; §3 at LF5865 resumes papal confirmation, so that decree is retained inside this act. The incorporated decree quotes its source attestation as In quorum fidem etc. at LF5860; this conventional printed abbreviation remains literal. Referenced constitutions are the object of approval, not a separate annex claimed present in this witness. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
