notes = "Independent full-source audit supersedes this selected record only in a separately revised packet. Complete Mercedarian CorpusChristi octave grant71839–71987. Own14May marginal datum71916–71917 and own summaries71920–71945 included as separate LF blocks. Body71904 Fra- resumes71950 trum, own issuer71851 and final14May1763 closing present; no actual inline fusion. Metadata title is substantively wrong: it calls this an office/octave of B.M.V.deMercede, whereas source title71845–71848 and dispositive71950–71960 grant the octave of CorpusChristi to that order. Correction: Correct feast from B.M.V.deMercede to CorpusChristi; Mercedarian is the receiving order. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
