notes = "Entire refined LF11495–11617 and 20 literal LF of outside context fully read, using split('\\n') only. Actual Leo XII attribution is positively consistent with the source protocol and closing. CCXI has its own 21 May 1827 synopsis, Venerabilesfratres protocol LF11506, complete allocution LF11508–11617 and final prayer/benediction request. Native leaf84 left LF11495–11560 continues right LF11565–11617, joining the quoted declaration anno millesimo / octingentesimo decimo nono. The Germany and western-Indies passages are both retained. There is no separately printed signature or dated closing after the final prayer, before CCXII on next leaf. The specific LeoXII running header LF11489 belongs to the top of this same leaf and is referenced as external metadata without inserting it in the body.  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
