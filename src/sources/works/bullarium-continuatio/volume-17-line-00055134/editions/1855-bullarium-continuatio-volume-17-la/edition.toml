notes = "CCLXXIX Celeberrimae inter urbes: whole five-clause SantElpidio brief, complete Cluana/Picenum history, papal privileges, port, civic and ecclesiastical description, population and1827 norm, full city-status grant with Fermo episcopal and civil-government reservations, validation, derogation and complete datum LF55297–55301. Exact XML leaves418–419 substantive text remains in normal order. Leaf419 marginal labels LF55253–55255 [110..223,708..740] belong to own derogation; LF55258–55265 at y1538–1903 sit beside the next Spello heading/proem at y1423 onward, so those foreign date/proem labels are excluded and reserved to that next complete witness. Own body is selected in ascending literal order, without repair. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
