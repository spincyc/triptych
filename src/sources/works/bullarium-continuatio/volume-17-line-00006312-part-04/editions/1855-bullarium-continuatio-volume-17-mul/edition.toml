notes = "Entire LF7164–7724 and 20 literal LF of outside context fully read with split('\\n') only. Actual Leo XII attribution is consistent with protocol and closing. CXCIII contains the complete Latin §§1–2 introduction, Italian petition and all 11 proposed rules at LF7231–7613, Latin signature attestation LF7615–7626 and full papal §§14–16 confirmation/derogation/30 January 1827 dating. Leaves53–57 proceed in source column order: LF7219 completes mature inspectis; LF7293 continues vicarin generale; LF7373 completes elegibile; LF7441 continues ArticleIII; LF7515 completes altro impedimento; LF7582 completes reverendissima; LF7664 completes inclinati. XML LF7456 has a malformed numeral7 box [0,0,988,801]; the remaining word boxes are right-column x1005–1367/y779–808. Whole native leaf55, printed36, image SHA6663af154c1cf741fb6b4c30e3591376a1b9e3e067bb17226bfed92a98e664a0 confirms intact right-column §7 with no fusion; leaf53 image SHA172062bf6e942960ee20ba61d28c17449d91407424be724acd42ffa93d75e529 confirms its own printed LeoPPXII protocol, despite OCR VeóPPXU. Conventional petition/attestation ec./etc. forms at LF7604 and7621 remain literal; no body or signatures are removed. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
