notes = "Act XV is cleanly distinct from XIV datum LF14842–14844 and XVI title LF14980. Its body, marginal summaries and closing were read completely. Marginal date LF14893–14895 and closing LF14973 give divergent OCR readings (18 versus xxvii September); both remain literal and normalized date is null. Confirmation refers to earlier grants without printing their text as an annex; no absent substantive portion of this brief is asserted. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
