notes = "CCLXVI Locum beati Petri: entire35clause Latin Dalmatia/Istria reorganization constitution fully read, whole financial/pastoral history, all suppressions, deferred Amonia suppression, co-cathedral unions and metropolitan ranks; each chapter’s dignity/canon/vicar quota and transition; theologian, penitentiary, honorary canons, statutes, pro-vicars and Makarska auxiliary; all individual diocese/parish/territorial enumerations11–20; completed jurisdiction transfers; every seminary, census, stipend, endowment, curia expense and parish provision; sede-vacante, electoral, chancery-archive, tax, executor, subdelegation and act-transmission rules; full validation, derogation, transumpt, sanctio and datum LF52442–52445. Exact XML leaves393–398 normal L/R body continuity. LF52128 zero-coordinate box contains just ordinary §22line and does not join columns. Future statutes and canonical execution records are mandated, not omitted present annexes; every currently printed list and amount retained. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
