notes = "Entire refined LF9675–9862 and 20 literal LF of outside context fully read, using split('\\n') only. Actual Leo XII attribution is positively consistent with the source protocol and closing. CCIV includes its full collective addressee, §§1–5 and 6 April 1827 dating. Native leaf71 left LF9675–9722 continues right LF9725–9788, then leaf72 left LF9800–9862, completing tres / brevi intervallo and per prae-/sentes. No visitation decree is separately inserted; this full brief confirms those already issued and states its own commands/penalties.  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
