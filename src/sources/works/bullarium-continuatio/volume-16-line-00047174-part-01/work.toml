description = "Entire letter to Gabriel, superior of the Holy Spirit and Wisdom congregations, read from Leo PP. XII LF47186 and Dilecte fili through the full historical exhortation, apostolic blessing and actual 20 May 1825 closing LF47351–47354. All substantive words remain in order, including the carried quote across the page break. Exact omitted LF47174–47184 is the separate numeral/title/date caption before the attribution and Dilecte fili; the date fragments at LF47176–47178 are publishing furniture, not the actual date clause, which is retained. No other owned substantive note is absent. Final whole-image check of native leaves332–333 confirms the retained Gabriel letter is continuous, has no omitted substantive marginal annotation, and ends with its actual full dating. The left-column Reims brief and its note on leaf332 are alien to this letter and are excluded. Exact source image pins are sealed in images/manifest.json. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
