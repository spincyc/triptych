notes = "Entire LF6530–7161 and 20 literal LF of outside context fully read with split('\\n') only. Actual Leo XII attribution is consistent with protocol and closing. CXCII has a Latin papal framework and expressly inserted Italian transaction LF6619–7091, including all named witnesses, notarial signatures, registration and collation attestation. Papal disposition resumes LF7093, followed by full validity/derogation and 30 January 1827 dating LF7158–7161. Per-line native leaves49–53 show left then right substantive sequence: LF6565 completes dummodo; leaf50 LF6640 completes Girolamo; leaf51 LF6782 completes eminentissimo; leaf52 LF6925 completes proprio; LF6994 completes stato; leaf53 LF7073 continues signatures and LF7141 completes constitutionibus. All incorporated text belongs to this act. The quoted notarial instrument uses literal conventional ec./etc. forms, including omitted full powers/instrument formulae at LF6749,6755,6764–6765,6802,6872–6873 and closing oaths. They are retained without expansion. Its collation attestation LF7090 prints 14 January 1823, although the transaction is dated 15 October 1826; native leaf53 image SHA172062bf6e942960ee20ba61d28c17449d91407424be724acd42ffa93d75e529 confirms the source printing. No date is silently repaired. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
