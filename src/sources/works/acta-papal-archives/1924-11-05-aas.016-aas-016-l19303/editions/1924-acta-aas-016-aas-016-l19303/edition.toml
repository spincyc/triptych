title = "AD E. P. D. LTJDOVICUM PETIT, ARCHIEPISCOPUM ATHENIENSEM: DE CON- TINUATA EIUS CURIS COLLECTIONE SACRORUM CONCILIORUM IOANNIS DOMINICI MANSI. Venerabilis frater, salutem et apostolicam benedictionem. — Quam, sacerdote I. B. Martin adiutore, typis H u b e r t i Welter ad laudabile inceptum magnifice conspirantis, continuandam susceperas Ioannis Dominici Mansi sacrorum Conciliorum Collectionem, eam iam nunc, te curante, properare ad exitum, vidimus, h a u d ita pridem, perlibenter, cum duo volumina a te Nobis officiosissime oblata pervolutaremus, quorum alterum Concilii Oe- cumenici Vaticani Acta Praesynodalia, alterum Synodalia a prima Congre- gatione ad t o t a m undetricesimam contineret. D u m a u t e m pervolutaba- mus, non modo subiit cogitatio animum, quanto id m a x i m a e molis opus studio tibi et labore stetisset, sed etiam spes bona laetaque incessit, fore ut reliqua, quae edenda superessent, volumina brevi in lucem prodirent. Etenim, cum id u n u m petat Ecclesia ne ignorata damnetur, quo facilius in communem omnium, at saltem studiosorum, notitiam postremi illius Con- cilii Acta pervenerint, eo quidem clarius patebit, q u a m inscienter, q u a m temere, q u a m impudenter Ecclesiae adversarii fecerint, cum s. m. deces- soris Nostri Pii IX consilium, eiusdemque effectum consilii, criminati sunt. Quisquis profecto litterarum m o n u m e n t a a t t e n t e consideret, quae ad d i u t u r n a m Concilii apparationem a t q u e ad ipsos gravissimi celeber- rimique Episcoporum consessus labores referuntur ac pertinent, eum ne- cesse est, nisi animo sit in religionem infestissimo praeiudicatisve obcae- cetur opinionibus, huc demum evadere, ut agnoscat fateaturque, non sine divino afflatu et praesidio Vaticanam universam Synodum et p a r a t a m et indictam et h a b i t a m esse; Pontificem praeterea, tot nominibus aeterni- t a s a t q u e immortalitati commendatum, non t a m aetatis suae opportu- nitati - quod censores imbecilla acie negabant - serviisse, q u a m futuri temporis prospexisse ac praesensisse necessitates. Tibi igitur cum m a x i m a m habeamus gratiam, t u m stimulos, si modo opus est, adiicimus, ut pergas alacer utilissimumque insequaris inceptum: quod ubi perfeceris, praeter- q u a m quod tibi exegeris m o n u m e n t u m aere perennius, praeclare etiam de Ecclesia Sancta Dei promeritus eris. In quo caelestis sapientiae, bono- r u m adiutricis operariorum, adsint tibi lumina, precamur; horum a u t e m auspicem, paternaeque benevolentiae Nostrae testem, tibi, venerabilis frater, et clero populoque tuo          apostolicam benedictionem p e r a m a n t e r impertimus. D a t u m R o m a e apud S a n c t u m P e t r u m die v mensis novembris anno MDCCCCXXIV, Pontificatus Nostri tertio."
