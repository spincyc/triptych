title = "CHIROGRAPHUS AD EMUM P. D. PETRUM, TITULO S. LAURENTII IN LUCINA, S. R. E. PRESB. CARD. GASP ARRI, A SECRETIS STATUS. Emo Signor Cardinale. ÎÎ con particolare compiacenza che, all'indomani dell'Anno Santo e nel giorno saero alla Cattedra di San Pietro in Roma, Ci vediamo porta l'occasione di donarle, Emo Signor Cardinale, la bella e poderosa medaglia del Marschall, che si accompagna a queste Nostre righe ; a Lei che l'altissimo ufficio a tutti addita come il Nostro quotidiano collaboratore e l'interprete autoriz- zato del Nostro pensiero. Ci affrettiamo e Ci compiacciamo di aggiungere che Ella Ci è sempre stata e collaboratore indefesso e interprete fedele, alle difficoltà ed alle pene non poche nè lievi trovando conforto ano al gaudio, nella coscienza di servire alla causa del divino Re Gesù Cristo Signor Nostro e della Sua Chiesa. Così che possiamo bene applicare anche a Lei, dopo che a Noi stessi, le parole oggi lette di San Pietro Apostolo : in quo exsul- tabitis,      modicum         nunc        si   oportet   contristan   in   variis   tentationibus. Di t u t t o cuore benedicendola 18 del '26. afïmo e come f.llo in G. C."
