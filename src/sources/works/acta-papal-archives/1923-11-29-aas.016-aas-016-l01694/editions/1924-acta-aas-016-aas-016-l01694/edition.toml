title = "AD R. P. D. FRANCISCUM ALBERTI, EPISCOPUM DE PLATA, XXV ANNO E X - E U N T E AB EPISCOPALI EIUS CONSECRATIONE. Venerabilis frater, salutem et apostolicam benedictionem. — Dioe- cesis istius t u a e clerus populusque eo iam nunc spectat, ut, c u m quintus ac vicesimus advenerit episcopatus tui natalis, observantiam caritatemque illam, qua te sui studiosissimum complectitur, publicis declaret gratae voluntatis laetitiaequè testimoniis. Eiusmodi a u t e m fausti diei celebratio non est d u b i t a n d u m quin talis futura sit, ut hinc per communia pietatis officia animum t u u m gaudio expleat, inde virtutes a t q u e egregia pasto- ralis vitae t u a e facinora in luce totius reipublicae collocet. Q u a m q u a m p u t a - mus promerita in Ecclesiam a t q u e in civilem societatem tua, q u a late nationis istius fines proferuntur, obscura esse nemini; at certe Platenses cives, quibus iuvandis ab inito sacerdotio te t o t u m devovisti, in ea sunt fortuna ut res experiendo magis quam discendo cognoverint, cum sibi t a m diu licuerit te intueri a t q u e admirari, pro Christi animarumque causa nullis u n q u a m parcentem laboribus, sive curionem ista in urbe ageres, sive dioecesim postea vicaria potestate moderareris, sive denique Auxi- liaris Episcopus decessor! tuo navares operam. Praeterea, cum te Aposto- lica Sedes, ante biennium, delegit qui eidem Antistiti vita functo succe- deres, visus es maiorem, si quidem fieri poterat, sedulitatem industriamque gravissimo muneri obeundo afferre. Debent enim tibi cives n o v u m Semi- narium, dioecesanis clericis accuratius instituendis nuperrime excitatum, quod ut perficiatur reditibusque locupletetur, si stipem ii largiter, proxi- morum occasione sollemnium, contulerint, arbitramur eos r e m tibi t a m g r a t a m facturos ut nihil possint supra. In laetabili igitur evento, quod Nosmetipsi gratulationibus ominibusque ex animo participamus, fore prospicimus ut copiosis afficiaris solaciis; quae quidem solacia a tuis pro- fecta Pastorum Princeps Iesus Christus, ut pro certo habemus, suarum effusione gratiarum cumulabit. Q u a r u m auspicem paternaeque benevo- lentiae Nostrae testem, tibi, venerabilis frater, et clero populoque tuo universo apostolicam benedictionem peramanter impertimus. D a t u m R o m a e apud S a n c t u m P e t r u m , die x x i x mensis novembris, anno MDCCCCXXIII, Pontificatus Nostri secundo."
