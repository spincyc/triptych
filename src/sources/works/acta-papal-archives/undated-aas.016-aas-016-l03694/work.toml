title = "AD R. P. D. PAULUM GULIELMUM DE KEPPLER, EPISCOPUM                     ROTTENBUR- GENSEM, XXV ANNOS AB INITO EPISCOPATU EXPLENTEM. Venerabilis frater, salutem et apostolicam benedictionem. — Ut hanc tibi inscribamus epistulam, facit res sane laetabilis, quae est tibi prope- diem eventura feliciter; faciunt ea quibus commendaris promerita, ut q u i n t u m ac vicesimum episcopatus tui natalem silentio ne praeterea- mus. Placet enim, pulcherrima hac occasione, publice testari, h a u d mino- ris te a Nobis fieri, q u a m a dioecesanis tuis et a sacerdotibus Episcopisque e Germania universis, qui cum integritatem sanctimoniamque vitae t u a e et egregiam pastoralis muneris perfunctionem dilaudent a t q u e extollant, t u m e litterarum peritia et multiplici doctrina, quam in ponderosa Nobis- que h a u d ignota prof udisti volumina, plurima ceperunt, quae in suos usus converterent, cognitionum liberaliumque artium emolumenta. H u c accedit, quod ea in te est vis eloquentiae et copia dicendi, ut disertissimus omnium e clero isto iure meritoque habearis. Sed aliud praeterea est, u n d e animus ad te r e d a m a n d u m Noster propius inclinet: illam t u a m dici- mus paene singularem Apostolicae Sedis reverentiam cum studio coniun- ctam, a qua in comperto est omnibus n u n q u a m te, ne minimum quidem, deflexisse. Praeeuntes igitur filiis tuis, itemque in episcopatu conlegis, qui d a t a opportunitate ad amphores edendas voluntatis erga te suae signi- ficationes usuri profecto sunt, faustum tibi eventum ex animo gratulamur, optantes, u t , quos ad Dei gloriam aeternamque hominum salutem procu- r a n d a m tulisti ad hunc diem labores, futuram eorum in caelis remune- rationem antecedant omne genus solatia, quibus te in terris quoque frui copiosissimis, praeter eam q u a flores omnium vel acatholicorum opinio- nem, aequum est et consentaneum. Caelestium interea donorum' auspi- cem paternaeque benevolentiae Nostrae testem, ftibi,\" venerabilis frater, et clero populoque t u o apostolicam benedictionem peramanter imperti- mus. D a t u m Romae a p u d S a n c t u m P e t r u m , die x m mensis ianuarii, a n n o MDCCCCXXIV, Pontificatus Nostri secundo."
