title = "AD EMUM P. D. ERNESTUM TIT. S. MARIAE IN AQUIRO               S. R. E. CARDINA- LEM DUBOIS, PAEISIENSIUM ARCHIEPISCOPUM; DE INSTITUTO GREGORIA- NA CONCENTIBUS ALTIUS EXCOLENDIS PARISIIS CONDITO. Dilecte fili Noster, salutem et apostolicam benedictionem. — Insti- t u t u m novum, gregorianis concentibus altius excolendis, te, h a u d ita pridem, in ista honoris tui amplissima sede, feliciter condidisse, magno quidem cum animi solatio comperimus. N a m q u e omnino postulat sacra- r u m aedium maiestas ut omnia ibidem venerabili mysteriorum ritu digna sint: q u e m a d m o d u m igitur ceterae pulcritudinis formae, clarorum ho- minum arte ingenioque inventae, locum sanctum condecorant, ita in liturgia sacra is cantus praesertim adhibendus est, qui, u t i edixit per decretum Motu proprio l a t u m f. r. Pius X, ad Deum animos elevans, aptior sit ad pietatem populi fovendam. Huiusmodi cantus, ut iam peri- tissimo cuiquam videtur, profecto ille est qui a decessore Nostro S. Gre- gorio magno nomen traxit, quemque recens ad venustatem pristinam restituere P a t r e s Solesmenses t a m diligenter nisi sunt. Valde igitur tibi, dilecte fili Noster, de studio gratulamur, quod ipse, varias moderans deinceps dioeceses, in musicam sacram provehendam sollerter impendisti, etsi multis rebus distentus; nec minorem tibi laudem tribuimus quod in Parisiensi Instituto ipsorum Solesmensium P a t r u m magisterio egregie uteris, qui, cum sint omni numero instructi, affabre admodum eleganter-' que hoc musicae genus interpretantur. F u t u r u m confidimus u t - p l u r i m i quidem ex t o t a Gallia, maximeque sacri ordinis homines, I n s t i t u t u m istud frequentent; ita enim gregorianus cantus, qui est t a m q u a m liturgiae lin- gua, fusius per novas scholas propagatus, laetissimos afferet religionis fructus; quandoquidem eo sunt caeremoniae sacrae angustiores, quo fre- quentior fidelis populus pie canendo easdem participat. Quod restat, bonis omnibus t a m frugiferum opus vehementer commendatum volumus: atque, in caelestium donorum auspicium itemque in peculiaris benevolentiae Nostrae signum, tibi, dilecte fili Noster, singulisque praeceptoribus et alumnis Apostolicam benedictionem amantissime impertimus. D a t u m E o m a e a p u d Sanctum P e t r u m , die x mensis        aprilis anno MCMXXiv, Pontificatus Nostri tertio."
