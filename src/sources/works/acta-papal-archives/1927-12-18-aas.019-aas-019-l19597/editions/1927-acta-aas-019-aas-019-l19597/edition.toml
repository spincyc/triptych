title = "EPISTOLA AD R. P. D. ANTONIUM ANASTASIUM ROSSI, ARCHIEPISCOPUM UTINENSEM Venerabile Fratello, salute ed apostolica benedizione. — Più d'una volta in questi ultimi tempi Ella Ci rappresentava le difficoltà sempre rinascenti nell'esercizio dello zelante ed operoso ministero pastorale e del governo della sua vasta ed illustre Àrchidiocèsi di Udine; e tali difficoltà Le si facevano talmente sentire da muoverLa a proporCi le sue dimissioni dalla detta sede. Noi, dopo accurato studio della situazione, e d o p o avere lungamente riflettuto e pregato, volendo ad un tempo, e tener conto delle condizioni delle cose, e mostrare a Lei la benevolenza in cui N o i l'abbiamo, e la stima che facciamo delle sue egregie doti e delle sue benemerenze pastorali, ab- biamo deliberato di chiamarla a lavorare vicino a Noi, promuovendoLa al vacante Patriarcato di Costantinopoli; promozione che Le abbiamo già anche di viva voce comunicato e della quale faremo la preconizzazione nel- l'ormai imminente Concistoro. In auspicio delle più elette grazie del Signore, Le impartiamo ben ii cuore, Venerabile Fratello, la Benedizione Apostolica. Dal Vaticano, li 18 Dicembre 1927."
