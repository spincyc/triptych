title = "AD .EMUM P. D. ALOISIUM DIACONUM S. GEORGII IN VELABRO S. R. E. CARD» SINCERO, QUEM LEGATUM MITTIT AD CONCILIUM PLENARIUM APRUTINUM- Dilecte fili Noster, salutem et apostolicam benedictionem. — Quando- quidem, pro apostolico munere, summae Nobis curae de universa chri- stianorum familia esse debet, nulla re magis delectari solemus q u a m si in p a r t e m dominici gregis salutare quidquam a t q u e utile, bonorum opera, conferatur. I t a q u e libenter a d m o d u m certiores facti sumus id sibi propo- nere Aprutii sacrorum Antistites ut propediem Plenarium Concilium T h e a t e concelebrent. In quo praeclarum sane a r g u m e n t u m elucere videmus pastoralis illius sollertiae qua ipsi religiosis rebus suarum dioecesium providere consueverunt: cum enim hoc n a t u r a rerum contingat ut m u l t a labente aevo m u t e n t u r , Episcoporum est, ex Apostolicae videlicet Sedis auctoritate, ita nonnulla opportune temporibus accommodare ut fideles qui ad eamdem regionem pertinent, communia nempe ingenia habentes, instituta, mores, linguam, propriam h a b e a n t q u a r u m d a m praescriptionum n o r m a m cui p a r e a n t ; eo magis quod ex summo animorum consensu, vires ad rem catholicam feliciter provehendam augentur. Ad Concilii a u t e m huius plenum exitum, plurimum certe proderit Codex iuris cano- nici qui recens promulgatus est; quem quidem studiose intuentes Aprutini Episcopi, non modo abusus, si qui irrepserint, facile evellent s t a t u m q u e dioecesium suarum ita ordinabunt ut is propius ad commune Ecclesiae ius, q u a n t u m fieri potest, accedat, sed etiam maiorem disciplinae sacrae firmitatem sine dubio assequentur. T a m igitur opportunum coeptum dilaudantes, te, dilecte fili Noster, secundum canonem 281 eiusdem Codicis, libenter ehgimus qui personam N o s t r a m rite geras, Concilium A p r u t i n u m con voces eique praesideas: nec dubitamus quin ipse, a iuris scientia t a m instructus a t q u e de Ecclesiae rebus apprime sollicitus, digne a d m o d u m hoc perhonorifico munere perfuncturus sis. Interea, D e u m precati ut et sapientiae suae lumine vobis adsit et quae, collatis consiliis, sciyeritis, ea suae gratiae rore fecundet, id fore confidimus ut omnes cuiusvis ordinis viri, imprimisque qui sunt de clero, sollertiae vestrae respondeant, ad rei catholicae civilisque emolumentum. Caelestium a u t e m -conciliatrix donorum itemque paternae benevolentiae Nostrae pignus, apostolica sit benedictio, q u a m tibi, dilecte filii Noster, singulis Aprutii Episcopis iisque omnibus qui coetibus intererunt amantissime impertimus. D a t u m E o m a e apud S a n c t u m P e t r u m , die v mensis maii anno JMDOCOOxxiv, Pontificatus Nostri tertio.                    »"
