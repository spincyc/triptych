": 17489, \"currently_selected\": true, \"text\": \"\"}, {\"LF\": 17490, \"currently_selected\": true, \"text\": \"       Vers la fin de la première année de guerre, Nous adressions\"}, {\"LF\": 17491, \"currently_selected\": true, \"text\": \"-aux nations en lutte les plus vives exhortations, et de plus Nous\"}, {\"LF\": 17492, \"currently_selected\": true, \"text\": \" indiquions la voie à suivre pour arriver à une paix stable et hono-\"}, {\"LF\": 17493, \"currently_selected\": true, \"text\": \" rable pour tous. Malheureusement Notre appel ne fut pas en-\"}, {\"LF\": 17494, \"currently_selected\": true, \"text\": \" tendu; et la guerre s'est poursuivie, acharnée, pendant deux\"}, {\"LF\": 17495, \"currently_selected\": true, \"text\": \" années encore, avec toutes ses horreurs; elle devint même plus\"}], \"exclude\": {\"LF\": 17487, \"artifact_UTF8_byte_interval_0_based_half_open\": [991769, 991855], \"artifact_Unicode_interval_0_based_half_open\": [986481, 986565], \"exact_line\": \"  ACTA, TOI. I X , n. 9. — i-9-917.                                               87\", \"nonwhitespace_Unicode_interval_0_based_half_open\": [2, 84], \"retained_prefix\": \"\", \"retained_suffix\": \"\", \"shares_physical_LF_with_body\": false, \"whole_line_Unicode_interval_0_based_half_open\": [0, 84]}, \"kind\": \"journal-issue-footer\"}], \"independent_reader_page_calibration_sha256\": \"a829d8378c3205865086a810ea0028206edeef94936ddd39d56cd05102519c7b\", \"retained_quality_gaps\": [], \"reviewed_prior_pdf_sha256\": \"9eb13bc8b278dfaaa4c0c0c26add280fbd5fa8ef6a1d7846790bab8859339800\"}}"
