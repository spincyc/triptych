title = "EPISTOLAE A D R . P . D . THEOTONIUM EMMANUELEM RIBEIRO VIEIRA D E CASTRO, E P I - SCOPUM SANCTI THOMAE DE MELIAPOR, QUINTUM AC VICESIMUM EPI- SCOPATUS ANNUM ACTURUM. Venerabilis frater, salutem et apostolicam benedictionem. — Cum ad Nos nuper allatum sit, acturum te proxime fore quintum ac vicesimum ab inito episcopatu a n n u m , nolumus b a n c eventi faustitatem praeterire, quin t u a m t u o r u m q u e laetitiam participando augeamus. Te enim de Ec- clesia Dei, hoc h a u d mediocri temporis intervallo, praeclare m e r i t u m esse, non ignoramus; ac praecipue operam dilaudamus a te sollerter studiose- que in eo collocatam, ut sacras Lusitanas Missiones provèheres, quas i a m diu moderaris. Praeconia a u t e m Nostra non dubitamus quin ipsum Christi P a s t o r u m Principis praeconium sit aliquando consecuturum;] eiusmodi enim apostolatus, omnium quidem gravissimus, si quis curave- rit ut optimos prosperrimosque habeat successus, is profecto sibi Christi Iesu amorem et remunerationem comparabit, cui nihil possit esse gratius, q u a m ut infideles ad cognitionem evangelicae veritatis ad aeternamque salutem perducantur. Merito igitur bene gestam dioecesis sacrarumque Missionum gubernationem tibi, venerabilis frater, gratulamur; simulque a Deo flagitamus ut q u i n t u m ac vicesimum tibi fortunet episcopatus na- talem. Ex quo quidem benevolentiae Nostrae testimonio a t q u e ex publi- cis, quas grex t u u s editurus sine dubitatione est, grati animi significatio- nibus volumus capias cum praeteritorum solacia laborum, t u m incitamenta ad perseverandum in laboribus istis tuis, animarum conversioni ac tuitioni sane utilissimis. Ut a u t e m natalis qui properat adesse clero populoque tibi commisso h a u d p a r v a spiritualis vitae incrementa afferat, damus, u t , eo ipso die, adstantibus pontificali Sacro auctoritate Nostra Nostroque nomine benedicas, plena iis proposita admissorum venia, usitatis condicio- nibus lucranda. Caelestis interea mercedis auspicem, paternaeque caritatis Nostrae testem, tibi, venerabilis frater, et universo clero populoque tuo apostolicam benedictionem peramanter impertimus. D a t u m Romae a p u d Sanctum P e t r u m , die II mensis augusti, anno MDCCCCXXIV, Pontificatus Nostri tertio."
