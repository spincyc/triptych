title = "AD R. P. D. GÜLIELMTJM ROSAS ET ARZIETA, EPISCOPUM PAN AMENSEM: DE CONVENTU CATHOLICO E TOTA NATIONE MENSE DECEMBRI AGENDO. Venerabilis frater, salutem et apostolicam benedictionem. — Quae, Encyclicis Litteris p r i m u m datis, de condicione societatis humanae deque remediis eidem reparandae pro Apostolico officio docuimus, ea videmini habuisse a n t e oculos cum deliberatum vobis est Catholicum habere e t o t a natione Conventum. Quem quidem Conventum, eo ipso quod per sollemnia Deiparae labis nesciae, proximo mense, acturi estis, iam t a n t a e P a t r o n a e fultum praesidio, utilitates consequentur sane uberiores q u a m vosmet opinione a t q u e spe praeceperitis. Catholice quidem sentire, catholico uti vitae instituto, cum Apostolica hac Sede cohaerere firmiter, sollemne ad hunc usque diem habuerunt dilecti e republica ista filii; at q u e m a d m o d u m , venerabilis frater, animadvertis, ex ipsa universa ordinum civilium pertur- batione, quae immane bellum excepit, a t q u e ex n u n q u a m remissis, ac fortasse acrius alicubi redintegratis, sectarum in Ecclesiam Christi machi- nationibus cum integritati fidei, t u m animorum coniunctioni et fami- liarum sanctitati a t q u e stabilitati, plurimum profecto impendet discri- minis. In tuendis igitur eiusmodi bonis, quae sarta tectaque esse singu- lorum aeque interest ac civitatis, toti esse debent quotquot Conventui aderunt: quo autem pacto ea cum prospero eventu ab insidiis adversa- riorum defendere liceat, id collatis hinc inde consiliis videant ac decernant. Quoniam vero, et quidem recte, scribis, ut communes omnium vestrum labores ex optato succedant, eos caelestium effusione gratiarum iuvari oportere earundemque auspice et conciliatrice apostolica benedictione, hanc tibi, venerabilis frater, iisque universis qui in urbem honoris tui sedem, eius rei gratia', coituri sunt, amantissime in Domino impertimus. D a t u m E o m a e apud S a n c t u m P e t r u m , die i mensis novembris, anno MDCCCCXxm, Pontificatus Nostri secundo."
