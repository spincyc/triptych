title = "AD R. P. D. BARTHOLOMAEUM LAGUMINA, EPISCOPUM AGRIGENTINUM, X X ? APPETENTE EPISCOPATUS EIUS NATALI. Venerabilis frater, salutem et apostolicam benedictionem. — Cum, die decimo primo proximi mensis, natalem acturus sis episcopatus tui q u i n t u m ac vicesimum, in p a r t e m gaudii t u i communisque t u o r u m laetitiae venire volumus. Id quidem a Nobis postulant cum animi ingeniique tui laudes, t u m quae in Agrigentina!» Ecclesiam omne genus beneficia contu- listi, t u m denique ipsa qua flores optima a p u d clerum populumque existi- matio. Neque enim ignora.mus, plurima te scripta de rebus Orientalibus ante initum episcopatum, multiplicis plena doctrinae, edidisse, a t q u e h a u d minorem redolere doctrinam ea quae in gregis eruditionem hoc diuturno episcopalis muneris spatio divulgasti. H u c ingentes accedunt, item Nobis explorati, quos fecisti sumptus in t e m p l u m princeps stabiliendum idemque in pristinam vetustissimae formae dignitatem restituendum; a t q u e honori tibi vertitur, quod pari liberalitate ac munificentia urbanas suburbanasque Seminarii aedes, et episcopalem domum, refeceris a t q u e ornaveris. Super- vacaneum, ceteroqui, p u t a m u s alia omnia recensere, cur debeant filii tui iucundum eventum grati animi sui significationibus iucundius efficere: id enim ultro facturi sunt, immo etiam vehementer gestient cum noverint Nosmet, delato tibi, ut facimus, paterno gratulationis officio, sibi ipsis praeivisse. Quo autem proxima huius natalis tui sollemnia uberiores affe- r a n t fidelium animis fructus, damus, ut omnes, quotquot Missae aderunt q u a m pontificali ritu eo die perages, plenam admissorum veniam, usitatis tamen condicionibus, lucrentur. Atque tibi praeterea optantes, ut beni- gnissimus Deus incolumem te diu vegetumque servet, caelestium donorum auspicem et peculiaris caritatis erga te Nostrae testem, tibi, venerabilis frater, et sacerdotibus fidelibusque t u a e procurationi commissis, aposto- licam benedictionem peramanter impertimus. D a t u m R o m a e apud S a n c t u m P e t r u m , die x x v n mensis novembris, anno MDCCCCXXIII, Pontificatus Nostri secundo."
