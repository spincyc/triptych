title = "AD REV. D. VICTOREM ALPHONSUM HUARD,                 SACERDOTEM, MODERATOREM COMMENTARTI « L E NATURALISME CANADIEN », Dilecte fili, salutem et apostolicam benedictionem. — Agi hoc mense celebrarique a n n u m quinquagesimum ex quo edi coepta est ephemeris illa, quae inscribitur Le naturalisme canadien et, prouti nomen ipsum indicat, in rerum n a t u r a e cognitione versatur, tibi in primis est gratulan- dum, qui, postquam, quinque et viginti annos Seminarii Chicoutimiensis commodis utilitatique rector itemque doctor servieras, eandem ephemeri- dem, cum t u a m propriam fecisses, moderandam suscepisti. Iste enim com- mentarius, unus eius generis qui a p u d vos evulgetur, praeclaram facit studiosis copiam, ut non fucatam ementitamque scientiam, sed gravem, contra, severamque hauriant doctrinam, quae periculum fidei prorsus amo- veat: periculum, inquimus, quod incautis potissimum iuvenibus eruditi viri a catholicis principiis aberrantes struere ac facessere plerumque con- sueverunt. Hoc praeterea in laude t u a ponimus, quod testamento ea visti ne ephemeris a recta via in futurum abscederet, cum eam Lavaliensi studiorum Universitati post obitum t u u m , quem D e u m rogamus q u a m longissime differat, regundam contin.uandam.que commiseris. E s t igitur quare, hoc quinquagesimo inlustris pervagatissimique commentarii natali, de t a n t o opere ac labore, deque beneficiis sanae doctrinae t a m diu, t a m late per omnes Americae regiones profusis, g r a t a m voluntatem erga te N o s t r a m publice profiteamur, et t u a e in hoc studiorum campo impigritatis peritiaeque uberiores in posterum fructus tibi summopere optemus. In q u a quidem operae t u a e existimatione m o d e r a t o r e s fortasse temperatiores- que videantur esse q u a m oporteat, quando ipsi Provinciae Quebecensis gubernatores libellos stato quoque tempore a te editos adeo ad communem utilitatem referre censuerunt, ut ephemeridis sumptus ad bessern usque participent, teque provinciali Instructionis Publicae Museo, quod vocant, iam d u d u m praefecerint. Alacer igitur pergito de Ecclesia deque gravis- simis n a t u r a e studiis bene mereri; in quo ut continenter copioseque cae- lestium tibi luminum adiumenta suppetant, apostolica efficiat benedictio, q u a m tibi, dilecte fili, omnibusque laborum t u o r u m sociis, paternae bene- volentiae Nostrae testem, peramanter in Domino impertimus. D a t u m E o m a e apud Sanctum P e t r u m ,       die x n mensis iulii anno MDCCCCXXIV, Pontificatus Nostri tertio."
responsible = "Pius XI"
