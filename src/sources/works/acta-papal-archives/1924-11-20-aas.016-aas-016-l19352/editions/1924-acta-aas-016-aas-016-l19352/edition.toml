title = "AD EMUM P. D. IANUARIUM, EPISCOPUM ALBANENSEM, S. R. E. CARD. GRA- NITO P I G N A T E L L I DI BELMONTE, XXV NATALEM EPISCOPATUS SUI P R O - P E D I E M ACTURUM. Venerabilis frater Noster, salutem et apostolicam benedictionem. — Nos sane delectat optimo cuique, si quid ipsi, divinae bonitatis gratia, faustum eveniat, gratulari in laetitiaeque p a r t e m venire; maxime vero si de aliquo agatur ex purpuratis Patribus, qui quidem, cum t a m praeci- p u a m Dei Vicario in regenda Ecclesia operam navent, praecipuam quoque a Nobis, uti par est, benevolentiam merentur. I t a q u e libentes admodum certiores facti sumus natalem te his diebus celebrare episcopatus tui quin- t u m et vicesimum; eo magis quod neminem latet q u a m praeclare gesseris, hoc toto tempore, boni Pastoris partes, v i r t u t e simul et exemplo praeful- gendo. Siquidem mirari Nos consuevimus, non modo illa animi tui orna- m e n t a dignitatemque agendi, ut m u l t a quidem munera, in catholicae rei emolumentum, eximie expleres, sed etiam vitae sanctimoniam, ut divinae gloriae aeternaeque proximorum saluti peculiari quodam studio semper incumberes. Quare facere non possumus quin debitas tecum Deo grates solvamus quod tantopere sollertiam t u a m fortunarit; eumque enixe pre- camur ut multos praeterea tibi annos, meritorum similiter plenos, conce- dere benigne velit. Quo a u t e m hanc fausti eventus laetitiam aliquo cumu- lemus pontificio munere, tibi damus ut, quo die volueris, sacris sollemni r i t u operatus, adstantibus Nostro nomine benedicas, plenariam eisdem admissorum veniam proponens, usitatis Ecclesiae condicionibus lucran- dam. A t q u e in caelestium donorum auspicium itemque in peculiaris bene- volentiae signum, apostolicam, benedictionem tibi, venerabilis frater No- ster, tuisque omnibus amantissime in Domino impertimus. D a t u m Romae apud S a n c t u m P e t r u m , die xx mensis novembris anno MDCCCCXXIV, Pontificatus Nostri tertio."
