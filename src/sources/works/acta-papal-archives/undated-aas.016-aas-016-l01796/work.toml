title = "AD R. P. D. IOANNEM VESCIA, EPISCOPUM POLICASTRENSEM, QUINQUAGESI- MUM SACERDOTII SUI ANNUM CELEBRANTEM. Venerabilis frater, salutem et apostolicam benedictionem. — Cum propediem quinquagesimus exeat annus, postquam, sacerdotio initiatus, p r i m u m religiosissime perlitasti, facere equidem non possumus, quin eventi tibi tuisque periucundi simus Nosmet ipsi publica voluntatis No- strae testificatione participes. Cur enim cum fratribus in episcopatu Nostris, quaecumque iis laeta contingunt, non habeamus communia? I t a q u e , quos, t a m diuturno temporis spatio, pro Ecclesia Dei animarumque salute tulisti perstudioso animo labores, eos tibi vehementer gratulamur, praeter- eaque a Christo Iesu, cuius vicaria potestate fungimur, exposcimus, ut multiplicibus solaciis, quibus te ad altare accedentem t o t annorum decursu laetificavit, per proxima fausti diei sollemnia gratiarum gaudiique cumu- lum benignus adiiciat. Qui quidem suavitatis fructus talis tibi, venerabilis frater, rogamus exsistat, ut tibi videaris eam veluti delibare beatitatem, q u a m Ille, qui est sacerdos in aeternum, piis sacrorum administris p a r a t in caelesti patria finiendam. F u t u r a m tamen remunerationem quo, aucta meritorum t u o r u m copia, uberiorem accipias, petere ne dubites, cum imma- culatum A g n u m eo die immolabis, ut aetas tibi diu m u l t u m q u e prorogetur, q u a m in grege ad sancta opera excitando tereré, u t i antehac, perseveres. Auspicato igitur natalis sacerdotii tui quinquagesimus adveniat, qui, ut fiet h a r u m accessione L i t t e r a r u m augustior, ita etiam paternae benevo- lentiae testimonio, q u a m ipsa omina Nostra redolent, horumque effectu a t q u e eventu est tibi longe gratior evasuras.-Caelestium interea donorum auspicem et peculiaris caritatis Nostrae testem, accipe apostolicam bene- dictionem, quam tibi, venerabilis frater, et clero populoque tuo universo peramanter in Domino impertimus. D a t u m E o m a e apud S a n c t u m P e t r u m , die xi   mensis decembris, anno MDCCCCXxm, Pontificatus Nostri secundo."
