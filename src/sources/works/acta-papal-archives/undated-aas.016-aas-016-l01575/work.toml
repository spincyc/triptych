title = "AD R. P. D. FRANCISCUM ANTONIUM HENLE, EPISCOPUM RATISBONENSEM, QUINQUAGESIMUM AB INITO SACERDOTIO ANNUM COMPLETURUM. Venerabilis frater, salutem et apostolicam benedictionem. — I t a benignissimus Deus a e t a t e m tibi prorogavit, ut quinquagesimum ab inito sacerdotio a n n u m sis propediem completurus: quod quidem eventum pro certo habemus fore, ut non modo tibi - etsi in t a n t a rerum asperitate - periucundum accidat, sed etiam clerum populumque t u u m , cuius reve- rentiam studiumque tibi q u a m maxime conciliasti, in publicas laetitiae significationes exacuat. Neque enim, quod patria vestra durioribus con- nectatur fortunis, idcirco abstinebunt* tui quominus debitis te ofiicns, fausta hac occasione, prosequantur; immo etiam ex ipsis, quibus premuntur, calamitatibus habent cur g r a t u m tibi a n i m u m suum quoquo pacto profi- teantur. N a m exploratum Nobis est, ex quo Ratisbonensem Ecclesiam regundam suscepisti, nihil te reliqui fecisse ut boni pastoris partes, fla- grante Christi caritate, animo impleres: quae quidem caritas efficit, ut omnibus e grege, quotiescumque oportet, praesto adsis, eorum angustias, egestatem, inediam vehementer dolendo levando que pro viribus. Fruere igitur, venerabilis frater, per proxima, quae apparari novimus, sollemnia, pia ac memori t u o r u m voluntate; fruere praeterea gratulationibus omini- busque communis omnium Patris, qui a P a s t o r u m Principe, cuius vices gerit, ex animo efflagitat, ut Ecclesiae t u a e serveris q u a m diutissime inco- lumis et caelestibus donis solaciisque pro merito affluas. Quorum conci- liatrix, eademque paternae benevolentiae Nostrae testis, sit apostolica benedictio, quam tibi, venerabilis frater, et universo clero populoque tuo peramanter in Domino impertimus. D a t u m E o m a e apud S a n c t u m P e t r u m , die x i v mensis novembris, anno MDCCCCXxrn, Pontificatus Nostri secundo."
responsible = "Pius XI"
