title = "AD R. P. D. NATALEM BRUNI, ARCHIEPISCOPUM MUTINENSEM EUMDEMQUE ABBATEM NONANTULANUM: OFPICIOSIS LITTERIS RESPONDET E CONVENTU EPISCOPORUM AEMILIAE REGIONIS DATIS. Venerabilis frater, salutem et apostolicam benedictionem. — Quas, cum Episcopis tecum. Mutinae congregatis, nuperrime dedisti ad Nos litteras, placuit in iis officii humanitatisque vestrae amplissimam agnoscere significationem. Quod enim, veluti recensendo, memorabatis quicquid ab inito Pontificatu ad pacem suadendam remque catholicam i u v a n d a m experti sumus, id, cum vos ostenderet Nostri studiosissimos, grato equidem animo accepimus. At longe suavius Nos tetigit pastoralis illa sollicitudo, quae vos acriter urget, efficitque percommode ut actionem vestram ad actionem praeceptionemque N o s t r a m dirigatis ac moderemini: unde, cum scriptum sit « vir obediens loquetur victorias », non potest non sequi, ut in vestris cuiusque laboribus, Deo dante, multo plus insit roboris a t q u e efficacitatis. Certum igitur vobis est, nihil reliqui f acere ut, adulescentibus cognitione rerum divinarum et spiritu caritatis imbuendis, posteritatem praestetis dioecesibus vestris parem difficultati temporum catholicoque nomine dignissimam; itemque contendere, ut, quos ad sacerdotale munus instinctu Deus suo vocare videatur, eos ut «pupillam oculi» custodiatis educetisque accuratissime. Neque minus cordi vobis fore scribitis, ut regnum Christi, lata per fideles vestros sacris expeditionibus et missionalibus ope, cotidie magis amplificetur. Eiusmodi sane consilia, quae cum optatis Nostris omnino congruunt, vix a t t i n e t ulcere quantopere Nobis probentur; pergite, praeterea, in hac rerum asperitate - q u e m a d m o d u m vos facturos pollicemini - et Nobis esse solacio et a Christo Iesu [exposcere, omnia ut foveat uberiore gratiarum praesidio, quaecumque ad eius gloriam in Ecclesiaeque utilitatem posthac persequemur. Caelestium interea donorum conciliatrix et gratae voluntatis Nostrae testis sit apostolica benedictio, q u a m tibi, venerabilis frater, ceteris, qui Mutinam convenerunt, Episcopis a t q u e universo uniuscuiusque clero ac populo peramanter impertimus. D a t u m R o m a e apud S a n c t u m P e t r u m , die vi mensis novembris anno MDCCCCXXIII, Pontificatus Nostri secundo."
