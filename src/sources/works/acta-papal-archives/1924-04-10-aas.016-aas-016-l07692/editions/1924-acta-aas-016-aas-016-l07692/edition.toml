title = "AD EMUM P. D. MICHAELEM S. R. E. CARDINALEM LEGA DIACONUM S. E U - STACHI!:   DE    SOLEMNIBUS RAVENNAE HABENDIS              OB TRANSLATIONEM RELIQUIARUM SANCTI EPISCOPI ET MARTYRIS APOLLINARIS. Dilecte fili Noster, salutem et apostolicam benedictionem. — Suavi q u o d a m laetitiae sensu afficimur eo nuntio, qui Nobis affertur, Ravennae sollemnia apparari, propterea quod reliquiae sanctissimi illius martyris, Apollinaris, ex ipsius Aede extra moenia, in cathedralem ecclesiam proxime transferentur. Optimoque sane consilio Ravennates, Archiepiscopo auctore, id statuerunt: cum enim semper iidem honore summo caelestem P a t r o - n u m coluerint, quasi propinquiorem eum voluerunt, quo melius possent custodem et vindicem in quovis r e r u m discrimine invocare. Neque semel profecto nobilissima ea civitas beneficia experta est Pastoris boni, qui suo tempore animam suam dedit pro ovibus suis: quae quidem effecerunt ut peculiarem q u e m d a m fidei ardorem Ravennates, inter tantas temporum vicissitudines, invicte retinerent. I t a q u e libenter, dilecte fili Noster, t u u m probamus propositum eo proficiscendi, ut sollemnibus adsis; id pro certo habentes te non t a m romanae purpurae amplitudine quam pietatis decore caeremonias eas sacras nobilitaturum. Ac probe praecipimus cogitatione celebritatis splendorem: cum scilicet, inter concentus immènsa proce- dente p o m p a supplicantium, sacrae Martyris exuviae in ecclesiam Raven- nae principem inferentur, a t q u e alacriore cultu t u m commota civitas P a t r o n u m sanctissimum prosequetur. Quo vero augustius eventi faustitas agatur resque cedat in populi utilitatem, tibi damus u t , sollemniore die, adstantibus nomine Nostro benedicas, plenariam eisdem admissorum veniam proponens, usitatis videlicet condicionibus lucrandam. Interea, caelestium auspex donorum itemque peculiaris benevolentiae Nostrae testis Apostolica sit benedictio, q u a m tibi, dilecte fili Noster, sollerti Ravennae Archiepiscopo eiusque universo clero ac populo amantissime impertimus. D a t u m Romae apud Sanctum P e t r u m , die x mensis aprilis               anno MCMXXiv, Pontificatus Nostri tertio."
