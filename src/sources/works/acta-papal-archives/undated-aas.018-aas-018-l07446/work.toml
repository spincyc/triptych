title = "CHIROGRAPHUS AD EMUM P. D. BASILIUM EPISCOPUM VELITERNUM S. R. E. CARD. POMPILI, VICE SACRA IN U R B E ANTISTITEM, DE PRECIBUS PUBLICE INDICENDIS PRO ECCLESIA CATHOLICA IN DITIONE MEXICANA. Sabato Santo del 1926. Eminentissimo              Signor       Cardinale, È a Sua notizia la grave tribolazione ond'è visitata quella a Noi tanto diletta parte della grande famiglia cattolica che è la Chiesa Messicana. La condizione della cosa cattolica che già segnala- vamo come poco consolante, pure esprimendo la Nostra fiducia ed il nostro elogio per l'Episcopato, il Clero ed il Popolo cattolico di quel caro e generoso Paese (Allocuz. concistori 14 dicembre 1925), quella condizione si è tanto peggiorata ed aggravata da far luogo ad una vera e propria persecuzione con gravissima offesa dell'onore a Dio dovuto e con non meno grave jattura delle anime e dello stesso pubblico bene. Or desiderando Noi vivamente che non sol- tanto i cattolici dell'Urbe, ma ancora quanti sono in tutto l'Orbe si uniscano a Noi pregando per i fratelli di Fede perseguitati ed afflitti, diamo a Lei, Eminentissimo Signor Cardinale, l'incarico di farsi efficace interprete di questo Nostro desiderio presso il Clero ed il popolo di Roma e Diocesi Nostra, sicuri che si propa- gherà, come rapida la notizia così pia e cordiale la imitazione di quanto si saprà fatto dalla Chiesa Madre e centro di tutte le altre. Sarà di grande conforto ai fratelli tribolati sapere che tutta la famiglia cattolica è con loro e per loro prega. Ci sembra poi parti- colarmente opportuna a questa comune ed universale preghiera la settimana di Pasqua, tempo di universale risurrezione, vogliama dire purificazione e santificazione delle anime, grazie ai più forti richiami della sacra predicazione ed alla efficacia divina dei Sacra- menti. Coi migliori e più cordiali auguri pasquali e con la Apostolica Benedizione."
