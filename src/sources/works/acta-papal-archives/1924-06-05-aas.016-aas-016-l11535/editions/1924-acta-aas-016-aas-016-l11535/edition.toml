title = "AD REV. D. C O N S T A N T I A M GUTBERLET, DOCTOREM, PROTONOTARIUM APO- STOLICUM,     OB   LONGAEVAM      AETATEM         PROBATISSIMUM     MAGISTERIUM DIMISSURUM. Dilecte fili, salutem et apostolicam benedictionem. — Insuetum ac prorsus mirabile tibi a Deo beneficium conlatum novimus, idest non t a m ut septem et octoginta aetatis annos attingeres, quam ut, ad hanc usque gravissimam aetatem, in Seminario clericorum Fuldensi antea philosophiam scholasticam, sacrasque deinde disciplinas sapienter, annos duos et sexa- ginta, naviterque traderes. H u c praeterea accedit, quod, hoc t a m diuturno intervallo, non modo ponderosa de philosophia ad u s u m scholarum volu- mina et satis multos, ad errores horum temporum refutandos, commenta- rios in lucem protulisti, sed etiam per annos plus triginta pervulgatissi- m a m illam ephemeridem, cui Philosophisches Jahrbuch titulus, nomine et auctoritate Goerresianae Sodalitatis, edendam a d h u c curasti. A t q u e ne ignoramus quidem, quam in colenda christiana sapientia apud cives tuos doctissimosque ceterarum gentium viros m a x i m a m tibi laudem peperisti, eam decessores Nostros, honoribus tibi delatis, agnovisse. Quod a u t e m ad Nos pertinet, cum docendi munus, viribus te deficientibus, dimissurus sis, volumus publice per has Litteras constet, q u a n t a te existimatione et be- nevolentiae caritate prosequamur: neque enim minoris a p u d Nos es, q u a m a p u d decessores Nostros fuisti. F r u a r e igitur, post tot tantosque exantla- tos in Ecclesiae utilitatem labores, mentissimo per eos annos otio, quorum h a u d mediocrem tibi cupimus accessionem a n t e q u a m caelestis remunera- tionis cumulatissima tibi Deus gaudia retribuat. H o r u m interea auspicem et propensae erga te voluntatis Nostrae testem, tibi, dilecte fili, apostoli- cam benedictionem p e r a m a n t e r impertimus. D a t u m E o m a e apud Sanctum P e t r u m ,     die v mensis    iunii, anno MDCCCCXXIV, Pontificatus Nostri tertio."
