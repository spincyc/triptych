title = "AD   R. P. D. ALOISIUM MARIAM MARELLI, EPISCOPUM BERGOMENSEM: DE TERTIO EUCHARISTICO CONVENTU E TOTA DIOECESI. Venerabilis frater, salutem et apostolicam benedictionem. — Bergo- menses isti tui, qui, super q u a m quod voluntatis firmitate constantiaque excellant, sunt praeterea avitae fidei pietatisque retinentissimi, m a x i m a cum frequentia ac vehementi animorum ardore concurrere undique solent, si quando sollemnioribus honoris significationibus Augustum Sacramen- t u m prosequi ac venerari liceat. Quare non est cur miremur, post actos, semel a t q u e iterum, Eucharisticos e dioecesi Coetus celeberrimumque illum e t o t a natione, cuius memoria h a u d facile excidet, tertium n u n c dioecesanum apparari Eucharisticum Conventum, quem in oppido elu- sone propediem habituri estis. Scribis quidem, fore, ut illuc, ob loci propin- quitatem, in primis adeant filii tibi, e valle Decia carissimi, qui, perrupto Gleni aggere, t a n t a m f ecere civium, operum rerumque iacturam. U t i n a m iidem, quorum duriorem fortunam tecum summopere miseramur, ad Christum consolatorem sub Eucharisticis velis a b d i t u m sic accedant, ut ex amantissimo eius Corde solacia hauriant q u a m maxima, itemque in tolerantiam eius calamitatis inque spem melioris rerum cursus animos suos auspicato erigant. Incepto igitur vestro, ut postulas, bene precamur; optamus a u t e m cupimusque, ut Christus Iesus et vos in ea, q u a m erga Nos et Apostolicam Sedem professi estis, studiosa observantia confirmet, et fructus sanctitatis uberrimos e Conventu isto in dioecesim t o t a m ma- nare ac propagari iubeat. Quorum auspicem, paternaeque benevolentiae testem, tibi, venerabilis frater, iisque omnibus qui Clusonem confluent, apostolicam benedictionem peramanter impertimus. D a t u m E o m a e apud S a n c t u m P e t r u m , die II mensis augusti, anno MDCCCCXXIV, Pontificatus Nostri tertio."
