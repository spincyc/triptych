title = "AD R. P. D. IOANNEM ROESSLER, EPISCOPUM SANCTI HIPPOLTTI: QUINQUA- GESIMO APPETENTE NATALI SACERDOTII EIUS. Venerabilis frater, salutem et apostolicam benedictionem. — Die unde- vicesimo huius mensis duplicem a te a c t u m iri natalem accepimus, sacer- dotii quinquagesimum et episcopatus tricesimum: unde merito fit, ut clerus populusque, cum ex urbe honoris tui sede, t u m e t o t a dioecesi, utrius- que faustitatem eventi laetitiis omnibus concelebrare paret. I m m o etiam, ut ad Nos affertur, Metropolita ipse tuus - dilectus filius Noster Gustavus Fridericus S. B. E. Presb. Card. Piffl - Vindobona istuc profecturus est, ut sollemnibus praesit et communes in te pietatis gratique animi signi- ficationes B o m a n a e P u r p u r a e maiestate habendaque inter sacrum contione participet a t q u e adornet. Congruunt profecto ista omnia et animi ingenii- que tui laudibus et emenso a te sancte laborioseque huic diuturno sacer- dotalis a t q u e episcopalis vitae spatio; q u a m q u a m Nobis videtur, quic- quid populares tui fausta hac occasione egerint, id omne multo infra promerita in Ecclesiam et civilem consortionem t u a esse d e m u m evasu- r u m . Quodsi eius rei h a u d alia plurima Nobis suppeterent argumenta, satis foret id u n u m recolere, fel. rec. decessorem Nostrum Leonem X I I I , cum a duobus vix annis dioecesim gubernares, te inter Episcopos Pon-, tifìcio Solio adstantes, raro a t q u e inusitato exemplo, adscivisse. Gratus igitur benignitati Dei, qui t a m longam fructuosamque pastoralis mune- ris tibi perfunctionem concesserit, fruare iis quae grex t u u s voluntatis suae testimonia editurus est amantissime; gratulatione item fruare Nostra, quae, ut a Vicario Christi Iesu proficiscitur, caelestem portendit tibi, boni Pastoris imitatori, remunerationem; cumuletque denique eiusmodi solacia apostolica benedictio, quam, divinorum m u n e r u m auspicem pater- naeque benevolentiae Nostrae testem, tibi, venerabilis frater, et universo clero populoque tuo ex animo impertimus. D a u m Romae apud San¡3tum P e t r u m , die VIII mensis iulii, anno MDCCCCXXIV, Pontificatus Nostri tertio."
