context = "{\"closing_physical_lines\": [25744, 25774], \"closing_text\": \"    Datum R o m a e apud S. Petrum die IX Iunii Anno MDCCCCL\\nPontificatus Nostri vicesimo quarto (1).\\n                                 LFO     PP. X I I I .\\n\\n     (1) Pontifici Maximo Viro Sanctissimo Reverendissimo Eruditissimo Leoni XIII\\nUniversitas tota Glasguensis Cancellarius Rector Professores Graduati Studentes Salutem.\\n       In multo nostro gaudio — quippe mox ferias saeculares celebraturis — illud\\npotissimum gratis animis recordari libet quod amplam hanc Universitatem, copiis\\nomnibus hodie ingenii atque operum instructam, ab ipsa Sede Apostolica profe-\\nctam, et cum amantissima Pontificis Maximi commendatione institutam, a maioribus\\naccepimus.\\n       Doctissimus enim ille Pontifex, Nicolaus Quintus, anno incarnationis Domini-\\ncae millesimo quadrigentesimo quinquagesimo primo, summum suum in Scotos atque\\nartes amorem praeferens, luminibus ipse omnibus et ingenii et liberalium artium\\nillustrissimus, Studium apud nos Generale institui, et doctores magistros studentes-\\nque nostros liberlatibus omnibus quae in Studio civitatis suae Bononiensis conces-\\nsae fuerant, gaudere atque uti voluit.\\n       Quod tantum beneficium cum sicut pia filia matri carissimae acceptam refe-\\nramus, illud nos decere arbitramur, ut Sanctitatem tuam participem fore nostri gau-\\ndii speremus, meritasque Sedi Apostolicae grates pro tanto merito proferamus.\\n       Oramus igitur ut hanc nostram felicitatem auctoritate tua cumulare digneris;\\net si per tempora haec iniqua, per tot maris et viarum difficultates non poterit fieri\\ntit Beatitudo tua adsistat feriantibus, optamus saltem fore ut per alium quemdam\\nbenevolum tuum in nos animum signifiées, et Universitatem hanc nostram, ab e r u -\\ndito Nicolao erectam, a Iacobo Scotorum rege fotam, a Gulielmo Episcopo Glas-\\nguensi curatam atque defensam, a multis denique regibus noslris multis auctam be-\\nneficiis, eruditissimus ipse, litterarumque Latinarum cultor elegantissimus, pro hu-\\nmanitate tua amplificare velis, atque ad nova usque saecula commendare.\\n       Dabamus Glasguae, Idibus Maiis, MGMI.\\n                                                         R. HERBERT STORY\\n                                                  Praefectus et Vice-Cancellarius.\", \"end_line\": 25774, \"removed\": \"Running header/page-number lines carrying formfeed and Acta volume/fascicle footers are omitted via disjoint ranges; all remaining source text and notes in selected extent retained.\", \"retained_historical_note_ranges\": [], \"start_line\": 25711}"
