title = "AD R. P. MATTHAEUM CRAWLEY BOEVEY, CONSOCIATIONIS FAMILIIS SACRA- TISSIMO CORDI IESU CONSECRANDI MODERATOREM GENERALEM, XXV AN- NUM EXPLENTEM AB INITO SACERDOTIO. Dilecte fili, salutem et apostolicam benedictionem. — I u c u n d u m sane tibi mox erit sanctam illius diei renovare memoriam quo a n t e annos x x v p r i m u m Deo litavisti, simulque a n i m a r u m saluti et divinae gloriae pro- curandae te operam d a t u r u m esse pollicebare. Ac re vera q u a m sollerter, hoc toto tempore, his sacris propositis ineubueris, ex eo praesertim per- spicere licet quod pietatem augusti Cordis Iesu ubique propagare stu- duisti; ita quidem ut non modo eidem singulae familiae consecrarentur, sed etiam ut illustriore domorum loco Christus Dominus t a m q u a m E e x coleretur. Nos igitur egregiam n u n c occasionem nanciscimur benevolen- t i a m erga te N o s t r a m testandi; a t q u e , non secus ac postremi decessores Nostri, debita te laude ornantes, ultro equidem tecum hanc partimur fausti eventus laetitiam. P r e c a m u r ut q u a m diutissime te Deus servare benigne velit, eo semper calentem sacrosanctae Eucharistiae fervore quo alacrius in dies t a m salutare c o e p t u m urgere valeas : siquidem in prae- sens, si u m q u a m alias, pernecesse est ut in t a n t a rerum omnium pertur- batione ille t a n d e m dominetur in societate h u m a n a pacificus E e x , Iesus Dominus, qui solus est via, veritas et vita. Caelestium auspex munerum apostolica sit benedictio, q u a m tibi, dilecte fili, tuisque omnibus effuso animo impertimus. D a t u m E o m a e apud S a n c t u m P e t r u m , die xv mensis decembris, anno MDCCCCXXin, Pontificatus Nostri secundo."
