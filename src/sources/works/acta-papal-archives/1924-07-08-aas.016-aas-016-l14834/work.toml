title = "EPISTOLAE AD REVMUM D. IGNATIUM SEIPEL, DOCTOREM, PROTONOTARIUM APOSTOLICUM, PRAESIDEM CONSILII ADMINISTRORUM REIPUBLICAE AUSTRIACAE: QUEM GRATULATUR A VITAE DISCRIMINE EREPTUM ET NATALEM SACERDOTII VICESIMUM QUINTUM PROPEDIEM ACTURUM. Dilecte fili, salutem et apostolicam benedictionem. — Sacerdotalem t u a m integritatem ac pietatem, itemque operam rei publicae apud vos reparandae a te sapienter actuoseque d a t a m , quanti Nos faciamus, ipsemet non ignoras; quo sane in iudicio populus iste se Nobiscum consentire t u m praesertim declaravit, cum, de t u a v i t a sollicitus a t q u e anxius, supplex divinae misericordiae diu fuit, ut venerationi civium et communis patriae saluti incolumis servareris. Quod autem sensim valetudo t u a confirmatur, ut bonos id omnes laetificat, ita Nos m a x i m a afficit completque delecta- tione; u t i n a m - q u a spe tem m u r a t q u e exspectatione - ex vulnere, quod mortiferum ab initio videbatur, sic recreeris, ut ad amplissimum m u n u s q u a m p r i m u m revocare te possis. Interea tale tibi incidit eventum, u n d e et tu cum aliqua corporis allevatione capias h a u d mediocre animo sola- cium et opportunitas civibus tuis offeratur g r a t a m voluntatem erga te suam publice testificandi. Dicimus sacerdotii tui natalem quintum ac vicesimum, quem es propediem acturus: quo quidem natali die tibi cupi- mus ut queas, sine ullo valetudinis detrimento, immo etiam cum plenae sanationis fide, ea ad altare gaudia gratiarumque emolumenta repetere, quae antehac certe, vi ac virtute sua, impulere, ut t a m praeclara in Eccle- siam civitatemque beneficia conf erres. Gratulationem igitur accipe in hac rei faustitate Nostram, cum praecipuae, qua te prosequimur, caritatis testimonio coniunctam; et scito, ut cogitationes continenter Nostras recens occupavit calamitas, ita, q u a n t u m c u m q u e tibi laetitiae proximus natalis attulerit, id Nos tecum commune habituros. Precamur interea, a caelo in te copiosa promeritisque necessitatibusque tuis congruentia defluant dona, t a m q u a m futurae libamenta remunerationis: quorum auspicem do- norum, itemque peculiaris benevolentiae Nostrae testem, tibi, dilecte fili, apostolicam benedictionem p e r a m a n t e r impertimus. D a t u m Romae a p u d S a n c t u m P e t r u m , die VIII mensis iulii anno MDCCCCXXIV, Pontificatus Nostri tertio."
