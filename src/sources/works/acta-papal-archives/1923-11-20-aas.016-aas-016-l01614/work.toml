title = "AD R. P. D. CAROLUM COX, EPISCOPUM TIT. DIOCLENSEM, VICARIUM APOSTO- LICUM TRANS V A ALEN. ET ADMINISTRATOREM APOSTOLICUM 3QMBER- LIENSEM: QUINQUAGESIMUM SACERDOTII EIUS NATALEM GRATULATUR. Venerabilis frater, salutem et apostolicam benedictionem. — Q u a m animi commotionem et spiritus suavitatem expertus es cum in flore aetatis primum perlitasti, ea tibi iam seni redintegrabitur die vicesimo proximi mensis, in quem diem, ut nuper accepimus, quinquagesimus sacerdotii tui natalis auspicato incidet. Cuius quidem sanctissimi muneris spatium ut tam longum emetireris - quae res profecto paucis plerumque con- tingit, - non sine misericordi Dei consilio factum arbitramur, qui te voluerit diu multumque in-procuranda per australes Africae regiones infi- delium'salute desudare, auctumque denique episcopali dignitate, et duobus vicariatibus, alteri ipso officii iure, alteri fiduciaria opera, praefectum, ipsos missionalium labores sapienter moderari naviterque exemplo tuo provehere. Grato igitur erga Dei numen animo in praeteritum tempus respici as, in eaque sistas fidenter cogitatione, quale et quantum eos maneat in caele- stibus sedibus praemium, qui apostolatum maxime omnium laboriosum frugiferumque in catholicis missionibus obeunt. Quam quidem remunera- tionem cum tibi, venerabilis frater, optemus amplissimam, tum laetabile eventum volumus e paterno, quo te prosequimur, gratulationis officio sane laetabilius exsistat: atque ex hac ipsa voluntatis erga te Nostrae signi- ficatione illud etiam sequi confidimus, ut et Congregationis tuae sodales et utriusque vicariatus fideles, tecum ob egregia facinora tua et accepta abs te beneficia coniunctissime, ad faustum diem qua decet celebritate agendum multo acrius exardescant. O m i n a m u r praeterea, ut, quae captu- ras es ex proxima faustitate solacia iis animus tuus corroboretur et in spem erigatur uberiorum gratiarum et fructuum: quorum auspicem et pe- culiaris benevolentiae Nostrae testem, tibi, venerabilis frater, et missio- nalibus fidelibusque tibi commissis apostolicam, benedictionem peraman- ter impertimus. D a t u m R o m a e a p u d S a n c t u m P e t r u m , die   xx mensis    novembris anno MDCCCCXXIII, Pontificatus Nostri secundo."
