title = "AD VENERABILES FRATRES ERNESTUM PIOVELLA,\" ARCHIEPISCOPUM CALARITA- NUM, CLETUM CASSANI, ARCHIEPISCOPUM TURRITANUM, GEORGIUM DEL RIO, ARCHIEPISCOPUM ARBORENSEM, CETEROSQUE SARDINIAE EPISCOPOS: OFPICIOSIS LITTERIS EX COMMUNI CONVENTU DATIS RESPONDET. Venerabiles fratres, s a l u t e m et a p o s t o l i c a m b e n e d i c t i o n e m . — H a u d N o b i s i n i u e u n d a e a accidit epistula, q u a m , c u m a d c o n s u l t a n d u m d e dioece- s i u m v e s t r a r u m negotiis i n u n u m c o n v e n i s s e t i s , o b s e r v a n t i a e studiique, q u o N o s prosequeremini, t e s t e m , a d N o s c o m m u n i t e r dedistis. A t q u e a v o - b i s m e t ipsis p l a c u i t comperire, quibus r e v e r e n t i a e l a e t i t i a e q u e significa- t i o n i b u s insulae istius clerus p o p u l u s q u e Cardinalem exceperit Sacro Con- silio de Seminariis d e q u e s t u d i o r u m U n i v e r s i t a t i b u s P r a e f e c t u m , qui istuc, i u s s u N o s t r o , concessit u t l a p i d e m a u s p i c a l e m Seminarii lustraret a c iace- ret, q u o d clericis t o t i u s regionis ad altiores disciplinas ad s a n c t i t a t e m q u e v i t a e conformandis e x c i t a b i t u r . Q u a n d o q u i d e m vero beneficium e i u s m o d i - u n d e t a m praeclaras prospicitis, i t e m ac N o s , o b v e n t u r a s i n s u l a e utilita- t e s - et alia n o n n u l l a a N o b i s profecta m e m o r i a n i m o recolitis, a c c e p t a m h a b e m u s p r o b a m u s q u e s t u d i o s a m a c p i a m v o l u n t a t e m v e s t r a m , D e o gra- tias a g e n t e s , cuius b e n i g n i t a t e s u p p e t i t N o b i s , u n d e e t a c c u r a t u m a l u m n o - r u m i n s p e m Ecclesiae*succrescentium i n s t i t u t i o n i e t d i o e c e s i u m paroecia- r u m q u e n e c e s s i t a t i b u s aliquo p a c t o c o n s u l a m u s . N e c m i n u s v o b i s , v e n e r a - biles fratres, l a u d i tribuimus, q u o d decreta Con