title = "AD il. P. D. REMIGIUM GANDASEGUI Y GARROCHATEGUI, ARCHIEPISCOPUM VAL- LISOLETANUM: DE C O N V E N T U AD R E M ASCETICAM PROMOVENDAM, TERTIO P L E N O SAECULO AB OBITU V E N . LUDOVICI A P O N T E , S. I., INDICTO. Venerabilis frater, salutem et apostolicam benedictionem. — Ut ex officiosissimis litteris, quas ad Nos nuper dedisti, iucunde didicimus, occa- sionem nanctus tertii pieni saeculi ab obitu Ludovici a Ponte, e Societate Iesu, qui, vitae sanctimonia pietatisque magisterio clarissimus, mutabi- libus de v i r t u t u m disciplina deque rerum divinarum contemplatione com- mentariis, iisdemque in praecipuos Europaejsermones conversis,Vallisoletum, patriam istam suam, inlustra vit, decrevisti, venerabilis frater, a die tertio ac vicesimo ad tricesimum huius mensis istic, in sede honoris tui, de re ascetica et mystica haberi Conventum. Quem quidem Conventum cum magno populi concursu ac spirituali emolumento h a b i t u m iri, ipse ardor portendere videtur, quo saluberrimo eiusmodi consilio plausum undique est; id autem Nosmet, perinde ac te, delectat ac commovet, quod in re, quae prima specie pauciores afficere posse videretur, non modo sacri Ordinis viri - in iisque Cardinalis Archiepiscopus Toletanus, Nuntius in Hispania Noster et regni Episcopi ad u n u m omnes — sed laici quoque homines, publici civitatum oppidorum- que curatores et civilium sodalitatum socii sese aut Congressui adfuturos a u t operam incepto provehendo daturos suam ultro libenterque spopon- derunt. Hispanos autem edoceri omnes, qua via ad altissimam vitae per- fectionem contendant, eo pluris interest, quo aequius est magisque oportet, apud nationem fidei catholicae retinentissimam non oblitterari, immo po- tius renovari veterem eius sanctitatis laudem, quae in plurimis e gente vestra antehac nullo non tempore eluxit ac viguit. Quod ceteroqui scri- psisti, velle te « haec pietatis et christianae perfectionis certamina » sub Nostra « p a t e r n a custodia» institui, id, ut recte scripsisti, ita pergratum habuimus; oculisque in vos, quemadmodum postulas, intentis, iam nunc laboribus vestris bene precamur, in eamque spem erigimur fore, ut ex ineundis propediem coetibus uberrima gratiarum utilitatumque copia in p a t r i a m vestram, Nobis carissimam, defluat. Quarum interea auspicem, paternaeque caritatis Nostrae testem, tibi, venerabilis frater, clero popu- loque tuo, itemque omnibus qui istuc conventuri sunt, apostolicam bene- dictionem peramanter in Domino impertimus. D a t u m E o m a e apud S a n c t u m P e t r u m , die iv mensis octobris anno MDCCCCXXIV, Pontificatus Nostri tertio."
