title = "EPISTOLAE AD R. P. D. IGNATIUM DUBOWSKI, EPISCOPUM LUCEORIENSEM ET ZYTOMI- RLENSEM: DE SUPPLICATIONIBUS VLADIMÜtlAE, IN OPPIDO NATALI SANCTI IOSAPHAT KUNCEVITII, EPISCOPI ET MARTYRIS, HABENDIS. Venerabilis frater, salutem et apostolicam benedictionem. — Laetitiam sane m a x i m a m dies duodecimus proximi mensis allaturus vobis est, in quem diem trecentesimus incidit plenus annus a pretiosa in conspectu Domini morte Iosaphat Kuncevitii: illius, inquimus, Episcopi et Martyris, qui in regionis vestrae schismaticis ad Ecclesiam R o m a n a m reducendis t a m fortiter t a m q u e studiose, ad effusionem usque sanguinis, elaboravit. Induxisse a u t e m te in t r i d u u m supplicationes, Vladimiriae in oppido natali sanctissimi Viri habendas, ut inlustre eius m a r t y r i u m commemorares eiusdemque in fideles tuos et in cives a catholica communione disiunctos advocares patrocinium, ex officiosissimis, quas h a u d multo ante dedisti, litteris perlibenter comperimus. O p t i m u m quidem consilium et Nobis perplacet et cupimus gregi tuo ea pariat pietatis v i r t u t u m q u e incrementa, quae ipsemet, pro pastorali sollicitudine, exoptas tibique fidenter polli- ceris. Quod ut facilius atque abundantius contingat, non modo concedimus ut ter saecularis martyrii dies ritu duplici primae classis cum octava, hoc anno, per dioecesim istam, servatis de cetero rubricis, agatur; sed etiam plenam admissorum veniam iis damus fidelibus, qui quovis uno ex tribus üs supplicátionum diebus rite expiati de sacra mensa libaverint et, Vla- dimiriae, t e m p l u m ubi sollemnia habebuntur, alibi per dioecesim quod- cumque maluerint, ad m e n t e m Nostram orando, de more inviserint. A t q u e u t i n a m ab invicto unitatis propugnatore illud obsecrando instandoque impetretis, ut, quos veterrimum a p u d vos distinet a catholica Ecclesia discidium, ii m a t u r e n t ad hanc Apostolicam Sedem, veluti ad t u t u m com- munis salutis portum, confugere. Caelestium interea donorum auspicem paternaeque benevolentiae Nostrae testem, tibi, venerabilis [frater, et universo clero populoque tuo apostolicam benedictionem peramanter in Domino impertimus. D a t u m E o m a e apud Sanctum P e t r u m , die x x v mensis octobris anno MDCCCCXXirr, Pontificatus Nostri secundo."
