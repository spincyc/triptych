title = "AD EMUM P. D. LUDOVICUM NAZARIUM, TIT. SS. VITALIS, GERVASII ET PRO - TASII, S. R. E. PRESB. CARD. BÉGIN, ARCHIEPISCOPUM QUEBECENSEM: PERACTAM FELICITER DIOECESANAM SYNODUM GRATULATUR. Dilecte fili Noster, salutem et apostolicam benedictionem. — Alla- t u m ad Nos nuperrime exemplum Actorum dioecesanae Synodi, q u a m in urbe ista, honoris tui sede, cum clero tecum congregato, per mensem oeto- brem superiore anno habuisti, a t t e n t e libenterque perlegimus; in iisque Actis sic p r u d e n t i a m et christianae disciplinae studium, quibus universi e clero floretis, agnovimus, ut mirati n e q u a q u a m simus, decreta in .Synodo l a t a communi omnium, vel acatholicorum, assensu plausuque excepta esse et comprobata. Etenim id est in laude vestra ponendum, quod m u l t a constituistis ad propulsandam eorum maiorum colluviem accommodatis- sima, quae, recentiore praesertim aetate, in p a t r i a m vestram inque omnem societatem christianam invasisse nemo cordatus non doleat: ut sunt, exem- pli causa, impudentissimae choreae, inhonesta spectacula, sodalitates n e u t r a e quas vocant, immoderatusque potionum alcoholicarum usus. Quae vos t a n t a cum incidisse populo vestro pericula ac detrimenta animadver- tissetis, illuc cogitationes curasque vestras convertistis, ut collatis consiliis videretis quo pacto et calamitati eiusmodi obsistere et damna reparare liceret. E s t igitur, cur operam a vobis in utilissima Synodo perficienda col- locatam, cum tibi, dilecte fili Noster, t u m clero tuo vehementer gratule- mur. Omnes a u t e m et sacerdotes et fideles, quos gubernas, h o r t a m u r - si quidem hortatione opus est - ut quoquo pacto studeant ea ad effectum deducere quae sunt in Synodo constituta; eorundemque actio multiplex ut bene succédât, caelestium efficiant gratiarum adiumenta, quarum au- spicem, paternaeque benevolentiae Nostrae testem, tibi, dilecte fili No- ster, et clero populoque tuo apostolicam benedictionem peramanter in Domino impertimus. D a t u m R o m a e apud S a n c t u m P e t r u m , die x x v i i mensis maii, anno MDCCCCXXIV, Pontificatus Nostri tertio."
