title = "AD R. P. D. FRANCISCUM MARIAM REDWOOD, ARCHIEPISCOPUM WELLINGTO- NENSEM: QUINQUAGESIMUM AB INITO EPISCOPATU ANNUM GRATULATUR. Venerabilis frater, salutem et apostolicam benedictionem. — Quod paene nulli, per vitae tempus, quamvis longissimum, contingere solet, id tibi, singulari quodam miserentis Dei consilio, eventurum est, ut quin- quagesimum ab inito episcopatu annum, proximo mense februario, con- fìcias et compleas. xSacris autem civilibusque sollemnibus, quae stato die istic magna habebuntur celebritate catholicorum, sane gestientium cum rem prorsus mirabilem insuetamque, t u m actuose utilissimeque emensum d i u t u r n u m pastoralis regiminis spatium praecipuo tibi studio gratulari, novimus equidem, fere universos ex Australia et Nova Zelandia episco- pos adfuturos esse, quo eadem sollemnia, communis splendore dignitatis amplissimisque caritatis laetitiamque suae significationibus, et populo augustiora efficiant et tibi profecto iucundiora. Sed praeterea ille idem dies fiet tibi tuisque idcirco memorabilior, quod, auspicari lapide ponendo, novum cathedrale templum es t a n d e m inchoaturus, sacrae illi aedi prin- cipi, qua ad tempus usi estis atque hodie utimini, aliquando substituen- d u m . Multiplicem igitur eiusmodi eventi faustitatem quidni paterno gra- tulationum ominumque officio participemus, talem honestando Episco- p u m , quo inter viventes omnes per terrarum orbem Antistites nullus dignitate et munere senior exsistat? I t a q u e tibi, venerabilis frater, annos quinque et octoginta nato at vegetam tamen senectutem agenti, ex animo cupimus optamusque, ut Ille, cuius vices gerimus, venerationi te studio- que gregis servet longe diutius sospitem, eaque locupletet caelestium m u n e r u m solaciorumque ubertate, quibus Pastores praeclare de Ecclesia méritos in terris quoque augere consuevit. Atque ne quinquagesimus epi- scopatus tui natalis sine spirituali fidelium tuorum emolumento prae- t e r e a t , damus, ut stato sollemnium die, adstantibus Nostro nomine bene- dicas, proposita plena admissorum venia, usitatis condicionibus, lucranda. Divinarum interea gratiarum conciliatricem paternaeque benevolentiae Nostrae testem, accipe apostolicam benedictionem, quam tibi, venerabilis frater, et clero populoque tuo peramanter in Domino impertimus. D a t u m E o m a e apud Sanctum P e t r u m , die iii mensis ianuarii anno MDCCCCXxiv, Pontificatus Nostri secundo."
