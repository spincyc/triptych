title = "AD EMUM P. D.        CAIETANUM EPISCOPUM SABINENSEM ET MANDELENSEM, S. R. E. CARDINALEM DE LAI SACRI CONLEGH SUBDECANUM, OB QUIN- QUAGESIMUM NATALEM SACERDOTII E I U S . Venerabilis frater Noster, salutem et apostolicam benedictionem. — Memoriam illius diei gratissimam abs te proxime celebratum iri quo, a n t e annos quinquaginta, p r i m u m sacrum fecisti, libentes sane didicimus: eo magis quod eventus t a m faustus occasionem affert ea recte facta recolendi quibus omnis t u a e vitae cursus nobilitatus est. E t e n i m i a m inde a sacerdo- tii tui initio diligentem plane operam Apostolicae Sedi navare consuevisti: cumque, variis fungens muneribus, prudentia imprimis et n a v i t a t e in rebus Ecclesiae gravissimis excelleres, dignus habitus es qui a decessore Nostro p. r. Pio X in amplissimum P u r p u r a t o r u m P a t r u m Conlegium cooptareris. Nec vero in hoc praestanti dignitatis gradu bene de Ecclesia mereri desiisti; praeter q u a m enim quod ipse, ut a Secretis Sacrae Congregationis Consi- storialis, negotia Ecclesiae iampridem agis magni quidem momenti, haec alia tibi d u c u n t u r laudi: t u m animarum salutem in dioecesibus tibi concre- ditis studiose te curare, t u m veterem cathedralem ecclesiam ac Semina- rium in Sabinis instaura visse, t u m denique De passione Christi Domini et De reali praesentia Iesu Christi in Eucharistia libros confecisse sane egregios. Quapropter cum m a g n a floreres opinione, ab ipso Iesu Christi Vicario ele- ctus es qui, eius nomine a t q u e auctoritate, plenariis Siciliae Sardiniaeque Conciliis, et Eucharistico Conventui Genuae habito praesideres. Profecto, in hac sacerdotii tui faustitate, plurimi quidem t u a e virtutis aestimatores laetitiae significationibus te sunt prosecuturi. F r u a r e igitur hoc tuorum amore, qui est simul sollertiae t u a e fructus et praemium: in spe quidem immarcescibilis illius coronae qua te P a s t o r u m omnium Princeps in caelis afficiet. Nos vero qui te, venerabilis frater Noster, ob merita habemus carissimum, et grates Deo tecum de t o t beneficiis tibi allatis persolvimus et gratulantium tibi choro praeimus; illud imprimis ab eodem bonorum omnium datore precantes ut seros plane in annos, meritorum similiter plenos, benigne sospitare te velit, ad rei catholicae utilitatem. Interea, divinorum m u n e r u m p r a e n u n t i a m praecipuaeque benevolentiae Nostrae testem esse volumus apostolicam benedictionem q u a m tibi venerabilis frater Noster, tuisque omnibus amantissime in Domino impertimur. D a t u m R o m a e a p u d S a n c t u m P e t r u m , die iv mensis aprilis in festo Resurrectionis Iesu Christi anno MDCCCCXXVI Pontificatus Nostri quinto."
