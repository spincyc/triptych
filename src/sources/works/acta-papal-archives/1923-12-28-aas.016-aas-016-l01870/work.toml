title = "AD R. P. D. IOANNEM BAPTISTAM LUIS PEREZ,               EPISCOPUM OVETENSEM: DE DIOECESANA SYNODO FELICITER ABSOLUTA. Venerabilis frater, salutem et apostolicam benedictionem. — Tibi et clero tuo, quemadmodum dioecesanam Synodum sub exitum superioris mensis ineuntibus caelestis sapientiae lumina precatione sancta concilia- vimus, ita, eandem feliciter exsecutis, oblata n u n c rescribendi occasione, cum diligentiam gratulamur in opus t a n t i momenti conlatam, t u m salu- bérrimos operis ipsius eventus ominamur et cupimus. Tales quidem disce- p t a t i o n u m et consiliorum vestrorum fructus prospicere sic et praecipere ipsemet videris, ut multa te ad Nos laetabilia allaturum confidas cum primum Nos Alma in hac Urbe pro officio conveneris. Ceteroqui iam nunc, absens, illud sane laetabile affers, esse vobis, communi consensu, propositum, non modo Nobiscum cohaerere arctissime et praeceptis horta- tionibusque obsequi omnino Nostris, sed etiam Deo cotidie instare, ut coeptis Nostris benigne faveat, quaecumque in Ecclesiae utilitatem per- sequi in posterum licuerit. Quod autem ad o p t a t a et vota attinet, quae tuo et sacerdotum nomine, quotquot in Synodum coivere, significasti, nihil profecto obstat atque officit, quominus, pro prudenti rerum aesti- matione, eorundem rationem aliquando habeamus. Interea tibi, per haec natalicia Iesu Christi sollemnia, caelestium effusionem donorum precati, horum quidem auspicem paternaeque benevolentiae Nostrae testem, tibi, venerabilis frater, et universo clero populoque tuo apostolicam benedi- ctionem peramanter in Domino impertimus. D a t u m E o m a e apud Sanctum P e t r u m , die x x v i i i mensis decembris, anno MDCCCCXXIII, Pontificatus Nostri secundo."
