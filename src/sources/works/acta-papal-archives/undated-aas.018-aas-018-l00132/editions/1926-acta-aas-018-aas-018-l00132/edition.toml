title = "EPISTOLA AD R. P. D. ANTONIUM BONAVENTURAM JEGrLlé, EPISCOPUM LABACENSEM: DE CONVENTU PRO STUDE03 RERUM ORIENTALIUM LABACI HABENDO. Venerabilis frater, salutem et apostolicam benedictionem. — Libenti sane animo a dilecto filio Nostro Cardinali Ioanne Tacci, qui quidem Sacro Consilio praeest Orientalis Ecclesiae rebus provehendis, certiores facti su- mus conventum propediem in ista honoris tui sede celebratum iri, quo viri coeant orientalium studiorum peritissimi, u t i in praestante illo Velehra- densi congressu, superiore anno habito a Nobisque dilaudato, peroppor- t u n e s t a t u t u m est. Constat enim et paucos esse homines ab orientalibus rebus omni numero instructos et ipsos per regiones dissitas dispersos; i t a ut utilissimum sit eosdem saepius congredi (id est singulis saltem annis) non modo quo altius uberiusque ea omnia exponantur quae ad oecume- nicam Ecclesiae u n i t a t e m pertineant, sed etiam quo efficacius rationes cognitae deliberationesque usquequaque evulgentur. Quapropter laeta- m u r equidem quod doctores I n s t i t u t i Nostri Orientalis de Urbe, u n a eum aliis peritis viris, p r i m u m istum conventum pro orientalibus studiis participent, ut congregatis praecipua t r a d a n t orientalis theologiae capita no vosque excitent scientiae huius cultores; illud persuasum habentes, ex recta rerum cognitione aequam hominum aestimationem sinceramque bene- volentiam efflorescere, quae, Christi caritati coniuncta, religiosae reconcilia- tioni unitatique, q u a m m a x i m e est, Dei munere, profutura.Ne cesses igitur, venerabilis frater, t a m salutare coeptum urgere, u n a cum eis quos habes ope- ris socios, imprimisque cum sollerti doctore Francisco Griveé, de his studiis t a m bene merito. Nos vero, intercessoribus sanctis a p u d D e u m interpo- sitis Cyrillo et Methodio, regionum istarum apostolis, assistricem divini Spiritus sapientiam praecamur vobis vehementer; quorum caelestium dono- r u m praenuntia caritatisque Nostrae testis apostolica sit benedictio, q u a m tibi, venerabilis frater, iisque omnibus qui coetibus intererunt amantissime impertimus. D a t u m E o m a e a p u d Sanctum P e t r u m , die x x i x mensis iunii, in festo Apostolorum Principum, anno MUMXXV, Pontificatus Nostri quarto."
