title = "AD R. P. D. GTJILELMTJM TURNER, EPISCOPUM BUFFALENSEM: DE DIOECE- SANA SYNODO. Venerabilis frater, salutem et apostolicam benedictionem. — Litterae, quas h a u d ita multo ante abs te accepimus, cum testimonium continebant amplissimum illius, qua Buffalensis Ecclesia Sedem Beati Petri ac Nosmet prosequitur pietate atque observantia, t u m n u n t i u m attulere non minus i u c u n d u m dioecesanae Synodi a te in diem q u a r t u m decimum proximi mensis indictae. Alterum, ut nomine et tuo et cleri populique, cui praees, editum est, i t a grati benevolentisque erga vos cunctos animi Nostri signi- ficatione rependimus; alterum, quod diligentiam in pastorali munere obeundo t u a m liquido comprobat, tibi vehementer gratulamur, immo eo vehementius, quod maximas Synodus ista gregi tuo allatura est u t i litates. S t a t u t a enim dioecesis ad Codicem iuris canonici accommodari, non t a m o p p o r t u n u m q u a m necesse est; cetera autem, quae ad r e m catho- licam m o r u m q u e sanctitatem a p u d vos t u e n d a m pertinent, non a p t e con- stitui posse videntur nisi collatis cum clero consiliis, quippe qui populi animos propius exploret ac norit. Incepto igitur bene, ut postulas, pre- camur, hac spe freti, fore ut, auspice Sancto Deiparae Sponso, cuius ab sollemnitate octavo die Synodum initurus es, et tibi et omnibus ad disce- p t a n d u m legitime accitis copiosa caelestis sapientiae lumina affulgeant. Quorum conciliatricem, itemque caritatis Nostrae testem, tibi, venera- bilis frater, et universo clero populoque tuo apostolicam benedictionem peramanter impertimus. D a t u m R o m a e apud S a n c t u m P e t r u m , die x v mensis aprilis anno MDCCCCXXIV, Pontificatus Nostri tertio."
responsible = "Pius XI"
