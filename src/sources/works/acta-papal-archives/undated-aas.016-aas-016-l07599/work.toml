title = "EPISTOLAE AD R.    P.   HENRICUM HOLLMANN, MAGISTRUM GENERALEM CANONICORUM REGULARIUM CRUCIGERORUM, VICESIMO QUINTO ANNO EXEUNTE EX QUO MUNUS ISTUD GERIT. Dilecte fili, salutem et apostolicam benedictionem. — H a u d multo ante allatum ad Nos est, plenum a n n u m quintum ac vicesimum, post- quam delectus es qui Ordini universo praeesses, a Crucigeris istis tuis, mense februario, praeclaris gratae voluntatis testimoniis celebratum iri. Et merito quidem, cum m a g n a m beneficiorum copiam, hoc gubernationis tuae spatio, in Ordinem contuleris: quo in genere commemorare placet, te, praeterquam quod monasticam disciplinam sartam tectamque tuitus es, incrementa Ordinis acriter actuoseque ad h u n c diem fovisse, non modo disciplinarum studia provehendo salubriter, verum etiam novis coenobiis constitutis et religiosis viris in sacras Missiones, per exteras, infidelium quoque, regiones, auspicato dimissis. Quae quidem promerita in Sodali- tatem, a t q u e adeo in Ecclesiam, t u a etsi peculiaris privilegii concessione Nosmet ipsi, cum septuagesimum compleres aetatis annum, agnovimus a t q u e aestimavimus - q u e m a d m o d u m proximus decessor Noster, adven- t a n t e quinquagesimo religiosae t u a e professionis natali, h a u d dissimili praemio honestaverat, - facere tamen non possumus quin pietatis officia, ^ q u a e c u m q u e religiosi viri, faustam nancti occasionem, tibi sunt praesti- tum, et vehementer probemus et publicae gratulationis Nostrae accessione cumulemus. De t a m diuturna igitur t a m q u e utili muneris tui perfun- ctione est quare ipsemet coram Deo, gratias agendo, laeteris, ex eaque ipsa Nosmet uberiores in posterum fructus Ordini tuo, sacris missionibus et Christi fidelibus, quibus vestram navatis operam, speremus. Quae qui- dem spes Nostra ut feliciter eveniat, fidenter tibi a benignissimo Deo prorogari a e t a t e m viresque confirmari a t q u e augeri cupimus ex animo; intereaque haec tibi eadem et potiora etiam e caelo dona conciliet Apo- stolica benedictio, q u a m tibi, dilecte fili, et Ordini tuo universo peraman- ter in Domino impertimus. D a t u m E o m a e apud Sanctum P e t r u m , die x x i mensis ianuarii anno MDCCOOXXIV, Pontificatus Nostri secundo."
