title = "AD EE V. D. GEORGIUM LAURENTIUM CEA VEN, SACERDOTEM, PRAESIDEM LONDINENSIS SODALITII IN TUTELAM OEPHANOEUM, VULGO « CRUSADE OF RESCUE», CUIUS OPERAM COMMENDAT. Dilecte fili, salutem et apostolicam benedictionem. — Conditam ab annis quinque et sexaginta Londinii Societatem Crusade of Reseue nun- c u p a t a m , quae Regis Hispaniae Catholici patrocinio tegitur et Cardi- nali Archiepiscopo Westmonasteriensi praeside utitur, quanti, ob illud, ad quod spectat, propositum ob sanctissimamque caritatis suae exerci- tationem, faciamus, coniicere ex eo potes, quod universalis, q u a m secreto Dei consilio gerimus, paternitatis primam sibi vindicant potissimamque curam qui in Christi grege sunt ab omni praesidio, spe ab omni derelicti. Pueros enim catholicos utriusque sexus, parentibus orbatos, qui in fidei discrimine versentur, recte instituendos hospitio excipitis; a t q u e ex So- dalitatis lege, quae cum christiana caritate et fiducia mirifice congruit, nullum reiicitis, quocumque is ex loco ad vos mittitur, q u a n t o c u m q u e vos aere alieno gravari opprimique contingit. U n d e fit, ut pueri puellaeque in tutelam vestram ex Gallia, e Lusitania et vel e remotissimis imperii Bri- tannici regionibus veniant; praetereaque, ut interdum t o t orbis alendis, quot paterno animo admisistis, pecunia viresque non suppetant. Sodali- t a t i igitur t a m providae, t a m misericordi, n u m quis opitulari recuset? N u m quis ignorat, quo Christus Iesus amore puerulos diligat, qualemque faciat iacturam - sane omnium funestissimam - qui fidem amiserit? I t a q u e institutum istud vestrum, quemadmodum summis cumulamus laudibus, sic catholicorum omnium liberalitati vehementer commendamus. Qui au- tem vobis opem tulerint, iisdem, perinde ac tibi, dilecte fili, omnibus tuo- r u m laborum sociis, et pueris puellisque procurationi caritatique vestrae concreditis, caelestium gratiarum auspicem et singularis benevolentiae Nostrae testem, apostolicam benedictionem peramanter impertimus. D a t u m Romae apud S a n c t u m P e t r u m ,    die   v mensis    iunii,   anno MDCCCCXXIV, Pontificatus Nostri tertio."
responsible = "Pius XI"
