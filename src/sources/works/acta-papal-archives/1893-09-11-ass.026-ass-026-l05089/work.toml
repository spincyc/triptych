composed_basis = "Metadata corrected from 1893-09-11 to 1893-09-02 on 2026-10-30. The official Latin delivery's closing reads die II Septemb. An. MDCCCXCIII (https://www.vatican.va/content/leo-xiii/la/encyclicals/documents/hf_l-xiii_enc_02091893_constanti-hungarorum.html), retained in artifact.papal.leo-xiii.hf-l-xiii-enc-02091893-constanti-hungarorum.2026-10-26-vatican-la.latin-text-7317d5125af9 with SHA-256 7317d5125af95dcf15e48731de086ef860d7a4806ca8ce05f2de84e770decf4f. The official English delivery independently states 2 September 1893 (https://www.vatican.va/content/leo-xiii/en/encyclicals/documents/hf_l-xiii_enc_02091893_constanti-hungarorum.html). The retained ASS OCR at original historical.txt LF5395 instead literally reads die 1 1 S e p t e m b r i s An. 1893; that source wording is preserved unchanged as a discrepant OCR witness. This is a metadata reconciliation against the official deliveries, not a claim that the original ASS printing was image-collated. The stable work ID and historical directory path remain unchanged."
