context = "{\"basis\": \"Source heading and papal salutation/name read against body, with terminal dating/signature; source index used as finding aid.\", \"heading_physical_lines\": [23291, 23294], \"heading_text\": \"MOTU PROPRIO SSmi D. N. Leonis Papae XIII quoad partes explendas a s. Congr.\\n    Indulgentiarum.\\n\\n\"}"
notes = "{\"closing_physical_lines\": [23380, 23448], \"closing_text\": \"     Datum Romae apud S. Petrum, die X X X I Octobris anno\\nMDCCCLXXXXVII, Pontificatus Nostri Vigesimo.\\n\\n\\n                            SYLLABUS\\n\\nFacultatum quas SSmus Dominus Noster Leo PP. XIII S. Con-\\n    gregationi Indulgentiis et SS. Reliquiis praepositae confir-\\n    mat et, quatenus opus sit, de integro concedit iuxta N. i\\n    Sui Motus proprii sub die XXXIOct. a, MDCCCLXXXVII\\n    incip. Christianae reipublicae.\\n\\n        1. Facultatem interpretandi Rescripta de Indulgentiis sa-\\ncrisque Reliquiis edita, etiam propria m a n u a Summo Pontifice\\nsignata.\\n        2. Dirimendi quaestiones et dubia minoris momenti, quae\\nita facile dilui possunt, ut necesse non sit de eis in Eminentis-\\nsimorum Patrum Congregatione disceptare.\\n        3. Approbandi Summaria Indulgentiarum.\\n        4. Sanandi defectus cuiuslibet generis qui irrepserint in ere-\\nctiones Confraternitatum, piarum Unionum, etc. vel etiam in\\ne a r u m aggregationem ad Archiconfraternitates, Primarias, Pri-\\nmo-primarias, etc.\\n        5. Sanandi defectus quoscumque, quibus affici contingat ad-\\nscriptiones Christifidelium ad Tertios Ordines, ad Confraternita-\\ntes, Congregationes, Pias Uniones, etc. Itemque defectus in bene-\\ndicendis et imponendis scapularibus, in benedictionibus Rosa-\\nriorum, coronarum, etc., in erectione Stationum Viae Crucis et\\nMatris Dolorosae.\\n       6. Dispensandi super defectu distantiae requisitae ad ere-\\nctionem Confraternitatum, ita tamen ut rescripti executio remit-\\ntatur prudenti iudicio Ordinarii. Dispensandi etiam super con-\\n\\f 566                    EX S. C. INDULGENTIARUM\\n\\n ditione distantiae inter ecclesias, quae praefiniri solet in rescri-\\n ptis concessionis q u a r u m d a m Indulgentiarum.\\n      7. Transferendi Indulgentias favore Sanctimonialium, c u m\\n de uno ad aliud Monasterium, sive de una ad aliam d o m u m\\n migrant ob temporum adiuncta.\\n      8. Concedendi, quatenus opus sit, ut Indulgentiae, quibus\\n gaudebant ecclesiae Regularium, vigere pergant post ipsorum\\n expulsionem seu violentam conventuum suppressionem. Quae\\n facultas extendatur ad casus tum praeteritarum, tum futurarum\\n conventuum suppressionum ; extensive etiam ad ecclesias sive\\n Sanctimonialium, sive cuiuslibet Congregationis et Instituti.\\n      9. Concedendi ut regularium Ordinum, et etiam Congrega-\\n tionum sive Institutorum alumni utriusque s e x u s Indulgentiis\\n et gratiis, quibus gaudebant in propriis respective ecclesiis, frui\\n possint et valeant d u m vitam communem agunt in alia domo,\\nin qua legitime habent oratorium vel publicum vel privatum.\\n      10. Transferendi a die vel diebus ad diem vel dies alios In-\\ndulgentias iam concessas; exceptis Indulgentia Portiunculae\\n aliisque Indulgentiis plenariis concessis toties quoties.\\n      11. Transferendi ad aliam ecclesiam vel ad aliud oratorium\\npublicum Indulgentias concessas ecclesiae vel publico oratorio.\\n      12. Concedendi Dioecesibus intra et extra Italiam privile-\\ngium, ut Indulgentias, pro quibus requiritur sacramentalis con-\\nfessio, lucrari valeant Christifideles qui sacramentalem confes-\\nsionem peragere solent intra duas hebdomadas. Quod tamen\\nprivilegium non concedatur nisi Ordinario Dioecesis expresse\\npetenti et ob penuriam confessariorum tantum.\\n      13. Commutandi conditiones, seu pias exercitationes ad In-\\ndulgentiarum acquisitionem praescriptas, in alia pia opera omni-\\nno vel fere aequivalentia : exceptis semper Indulgentiis plenariis\\ntoties quoties, et exceptis etiam conditionibus sacramentalis con-\\nfessionis et sacrae Communionis quotiescumque requiruntur.\\n      14. Renovandi seu prorogandi pro Sanctimonialibus, v e r e\\npauperibus tantum, Indulgentias iam ipsis concessas etiamsi\\nforte distulerint renovationem vel prorogationem implorare.\", \"end_line\": 23448, \"removed\": \"Running header/page-number lines carrying formfeed and Acta volume/fascicle footers are omitted via disjoint ranges; all remaining source text and notes in selected extent retained.\", \"retained_historical_note_ranges\": [], \"start_line\": 23291} Archival OCR reconstruction and mechanical extraction; no facsimile image collation is claimed. OCR errors, historical spelling, line breaks, and unverified pagination remain source limitations."
