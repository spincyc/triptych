title = "AD EMUM P. D. PETRUM TIT. S. LAURENTII IN LUCINA, S. R. E. PRESB.    CARD. GASPARRI, A SECRETIS STATUS: POST MUTUO TRADITA INSTRUMENTA RATIHABITIONIS CONVENTIONUM INTER APOSTOLICAM SEDEM ET REGNUM ITALIAE. Signor Gardinale, Voglia far portare al nuovo ufficio        Nostro   telegrafico    il seguente testo per la immediata trasmissione. «A Sua Maestà Vittorio Emmanuel III Ee d'Italia. « Il primo telegramma che mandiamo da questa Città del « Vaticano è per dire a V. M. che lo scambio delle ratifiche « delle Convenzioni Laterane è, grazie a Dio, da pochi istanti « un fatto   compiuto - quod     prosperum felix faustum fortuna- « tumque sit - è altresì per impartire di tutto cuore una grande « e paterna apostolica benedizione allá M. V. alla Augusta Con- « sorte, a tutta la Eeale Famiglia, all'Italia, al Mondo »."
