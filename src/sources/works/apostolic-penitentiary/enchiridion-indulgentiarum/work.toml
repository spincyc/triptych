description = "The Apostolic Penitentiary's official collection of the norms and concessions governing indulgences, first issued 29 June 1968 under the discipline of Paul VI's constitution Indulgentiarum doctrina, and issued in its fourth edition by decree of 16 July 1999. The fourth edition's norms (N. 1-36) and concessions (conc. 1-33, with numbered sections) are the locus system used here; the Rosary grant is concession 17 § 1."
