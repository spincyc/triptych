context = "Gregory first insists that the preacher must hear and do God's words before speaking them. He then reads Mark 7:32-35 spiritually: Christ's fingers signify the gifts of the Holy Spirit opening the deaf heart to obedience; saliva signifies wisdom received from Christ's mouth and forms the tongue for preaching; Christ's upward look and sigh teach prayer; and right speech follows obedient action."
verified_on = "2026-08-20"
notes = "Verified word for word against the page image of Migne's printing, with the keyed web transcription used only as a discovery and comparison witness. The passage is at PL 76:893-894; bold 1270-1271 in the body is Maurist-source pagination and must not be cited as PL columns. This passage supports Gregory's reception of Mark 7 and does not by itself establish the historical intention of any later missal compiler."
