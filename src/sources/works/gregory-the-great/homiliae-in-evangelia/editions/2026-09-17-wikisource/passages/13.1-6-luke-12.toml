context = "Homily XIII §§1–6 in the electronic Latin witness, read with its heading, inscription (preached at the basilica of St. Felix the Confessor on his feast day), and printed lection Luke 12:35–40 (lines 139–142). Expounds the entire pericope: girded loins and burning lamps (§1), waiting for the Lord returning from the wedding (§2), opening to His knock and the threefold definition of vigilance (§3), the Lord passing to minister in heavenly contemplation (§4), the watches of the night as the ages of human life and God as patiens redditor (§5), and the hidden last hour kept uncertain so we stay continually prepared (§6). Original electronic edition attribution: Gregorius Magnus and Latin Wikisource contributors, including Mizardellorsa, Homiliarum in Evangelia, CC BY-SA 3.0. Source wording across lines 143–145 is unaltered, including the absent final period on line 145; no PL 76 facsimile collation is claimed."
physical_line_ranges = [[143, 145]]
text = "1. Sancti Evangelii, fratres charissimi, aperta vobis est lectio recitata. Sed ne aliquibus ipsa ejus planities alta fortasse videatur, eam sub brevitate transcurrimus, quatenus ejus expositio ita nescientibus fiat cognita, ut tamen scientibus non sit onerosa. Quia viris luxuria in lumbis sit, feminis in umbilico, testatur Dominus, qui de diabolo ad beatum Job loquitur, dicens: Virtus ejus in lumbis ejus, et fortitudo illius in umbilico ventris ejus (Job. XL, 11). A principali igitur sexu lumborum nomine luxuria designatur, cum Dominus dicit: Sint lumbi vestri praecincti. Lumbos enim praecingimus cum carnis luxuriam per continentiam coarctamus. Sed quia minus est mala non agere, nisi etiam quisque studeat et bonis operibus insudare, protinus additur: Et lucernae ardentes in manibus vestris. Lucernas quippe ardentes in manibus tenemus cum per bona opera proximis nostris lucis exempla monstramus. De quibus profecto operibus Dominus dicit: Luceat lux vestra coram hominibus, ut videant opera vestra bona, et glorificent Patrem vestrum qui in coelis est (Matth. V, 16). Duo autem sunt quae jubentur, et lumbos restringere, et lucernas tenere, ut et munditia sit castitatis in corpore, et lumen veritatis in operatione. Redemptori etenim nostro unum sine altero placere nequaquam potest, si aut is qui bona agit adhuc luxuriae inquinamenta non deserit, aut is qui castitate praeeminet necdum se per bona opera exercet. Nec castitas ergo magna est sine bono opere, nec opus bonum est aliquod sine castitate. 2. Sed et si utrumque agitur, restat ut quisquis ille est spe ad supernam patriam tendat, et nequaquam se a vitiis pro mundi hujus honestate contineat. Qui etsi quaedam bona aliquando pro honestate inchoat, in ejus tamen intentione non debet permanere, nec per bona opera praesentis mundi gloriam quaerere, sed totam spem in Redemptoris sui adventum constituat. Unde et protinus subditur: Et vos similes hominibus exspectantibus dominum suum, quando revertatur a nuptiis. Ad nuptias quippe Dominus abiit, quia resurgens a mortuis, ascendens in coelum, supernam sibi angelorum multitudinem novus homo copulavit. Qui tunc revertitur, cum nobis jam per judicium manifestatur. 3. Bene autem de servis exspectantibus subditur: Ut cum venerit et pulsaverit, confestim aperiant ei. Venit quippe Dominus cum ad judicium properat, pulsat vero, cum jam per aegritudinis molestias esse mortem vicinam designat. Cui confestim aperimus, si hunc cum amore suscipimus. Aperire enim judici pulsanti non vult, qui exire de corpore trepidat, et videre eum quem contempsisse se meminit judicem formidat. Qui autem de sua spe et operatione securus est, pulsanti confestim aperit, quia laetus judicem sustinet; et cum tempus propinquae mortis agnoverit, de gloria retributionis hilarescit. Unde et protinus subditur: Beati sunt servi illi, quos cum venerit dominus, invenerit vigilantes. Vigilat qui ad aspectum veri luminis mentis oculos apertos tenet, vigilat qui servat operando quod credit, vigilat qui a se torporis et negligentiae tenebras repellit. Hinc etenim Paulus dicit: Evigilate, justi, et nolite peccare (I Cor. XV, 34). Hinc rursus ait; Hora est jam nos de somno surgere (Rom. XIII, 11). 4. Sed veniens dominus quid servis vigilantibus exhibeat audiamus: Amen dico vobis quod praecinget se, et faciet eos discumbere, et transiens ministrabit illis. Praecinget se, id est ad retributionem praeparabit; et faciet illos discumbere, id est in aeterna quiete refoveri. Discumbere quippe nostrum in regno quiescere est. Unde rursum Dominus dicit: Venient et recumbent cum Abraham, Isaac et Jacob (Matth. VIII, 11). Transiens autem Dominus ministrat, quia lucis suae illustratione nos satiat. Transire vero dictum est, cum de judicio ad regnum redit. Vel certe Dominus nobis post judicium transit, quia ab humanitatis forma in divinitatis suae contemplationem nos elevat. Et transire ejus est in claritatis suae speculationem nos ducere, cum eum quem in humanitate in judicio cernimus, etiam in divinitate post judicium videmus. Ad judicium quippe veniens, in forma servi omnibus apparet, quia scriptum est: Videbunt in quem transfixerunt (Zach. XII, 10; Joan. XIX, 37). Sed cum reprobi in supplicium corruunt, justi ad claritatis ejus gloriam pertrahuntur, sicut scriptum est: Tollatur impius, ne videat gloriam Dei (Isai. XXVI, 10). 5. Sed quid si servi in prima vigilia negligentes existunt? Prima quippe vigilia primae aetatis custodia est. Sed neque sic desperandum est, et a bono opere cessandum. Nam longanimitatis suae patientiam insinuans Dominus, subdit: Et si venerit in secunda vigilia, et si in tertia vigilia venerit, et ita invenerit, beati sunt servi illi. Prima quippe vigilia primaevum tempus est, id est pueritia. Secunda, adolescentia vel juventus, quae auctoritate sacri eloquii unum sunt, dicente Salomone: Laetare juvenis in adolescentia tua (Eccle. XI, 9). Tertia autem, senectus accipitur. Qui ergo vigilare in prima vigilia noluit custodiat vel secundam, ut qui converti a pravitatibus suis in pueritia neglexit ad vias vitae saltem in tempore juventutis evigilet. Et qui evigilare in secunda vigilia noluit tertiae vigiliae remedia non amittat, ut qui in juventute ad vias vitae non evigilat saltem in senectute resipiscat. Pensate, fratres charissimi, quia conclusit Dei pietas duritiam nostram. Non est jam quid homo excusationis inveniat. Deus despicitur, et exspectat; contemni se videt, et revocat; injuriam de contemptu suo suscipit, et tamen quandoque revertentibus etiam praemia promittit. Sed nemo hanc ejus longanimitatem negligat, quia tanto districtiorem justitiam in judicio exiget, quanto longiorem patientiam ante judicium praerogavit. Hinc etenim Paulus dicit: Ignoras quoniam benignitas Dei ad poenitentiam te adducit? Tu autem secundum duritiam tuam et cor impoenitens thesaurizas tibi iram in die irae et revelationis justi judicii Dei (Rom. II, 4, 5). Hinc Psalmista ait: Deus judex justus, fortis, et longanimis (Psal. VII, 12). Dicturus quippe longanimem, praemisit justum, ut quem vides peccata delinquentium diu patienter ferre, scias hunc etiam quandoque districte judicare. Hinc per quemdam sapientem dicitur: Altissimus enim est patiens redditor (Eccli, V, 4). Patiens enim redditor dicitur, quia peccata hominum et patitur et reddit. Nam quos diu, ut convertantur, tolerat, non conversos durius damnat. Ad excutiendam vero mentis nostrae desidiam, etiam exteriora damna per similitudinem ad medium deducuntur, ut per haec animus ad sui custodiam suscitetur. Nam dicitur: Hoc autem scitote, quia si sciret paterfamilias qua hora fur veniret, vigilaret utique, et non sineret perfodi domum suam. Ex qua praemissa similitudine etiam exhortatio subinfertur, cum dicitur: Et vos estote parati, quia qua hora non putatis Filius hominis veniet. Nesciente enim patrefamilias fur domum perfodit, quia dum a sui custodia spiritus dormit, improvisa mors veniens carnis nostrae habitaculum irrumpit, et eum quem dominum domus invenerit dormientem necat, quia cum ventura damna spiritus minime praevidet, hunc mors ad supplicium nescientem rapit. Furi autem resisteret, si vigilaret, quia adventum judicis, qui occulte animam rapit, praecavens, ei poenitendo occurreret, ne impoenitens periret. 6. Horam vero ultimam Dominus noster idcirco voluit nobis esse incognitam, ut semper possit esse suspecta, ut dum illam praevidere non possumus, ad illam sine intermissione praeparemur. Proinde, fratres mei, in conditione mortalitatis vestrae mentis oculos figite, venienti vos judici per fletus quotidie et lamenta praeparate. Et cum certa mors maneat omnibus, nolite de temporalis vitae providentia incerta cogitare. Terrenarum rerum vos cura non aggravet. Quantislibet enim auri et argenti molibus circumdetur, quibuslibet pretiosis vestibus induatur caro, quid est aliud quam caro? Nolite ergo attendere quid habetis, sed quid estis. Vultis audire quid estis? Propheta indicat, dicens: Vere fenum est populus (Isai. XL, 7). Si enim fenum populus non est, ubi sunt illi qui ea quae hodie colimus nobiscum transacto anno beati Felicis natalitia celebraverunt? O quanta et qualia de praesentis vitae provisione cogitabant, sed, subripiente mortis articulo, repente in his quae praevidere nolebant inventi sunt, et cuncta simul temporalia quae congregata quasi stabiliter tenere videbantur amiserunt. Si ergo transacta multitudo generis humani per nativitatem viruit in carne, per mortem aruit in pulvere, videlicet fenum fuit. Quia igitur momentis suis horae fugiunt, agite, fratres charissimi, ut in boni operis mercede teneantur. Audite quid sapiens Salomon dicat: Quodcunque potest manus tua facere, instanter operare, quia nec opus, nec scientia, nec ratio, nec sapientia erunt apud inferos, quo tu properas (Eccle. IX, 10). Quia ergo et venturae mortis tempus ignoramus, et post mortem operari non possumus, superest ut ante mortem tempora indulta rapiamus. Sic enim sic mors ipsa cum venerit vincetur, si priusquam veniat semper timeatur"
