notes = "Text-free: the web witness is CC BY-SA and no wording is quoted into this record. Inspected in the web witness only. BOUND: the restricted PL 76 facsimile (DCO PDF af9ea4a1) could not be fetched on 2026-11-18 (TLS certificate-chain failure; an insecure fetch was refused), so no page image was read and a lexical or diplomatic identity with PL 76 is not asserted. Rubrics read in the same artifact on 2026-11-18: Homily I is headed Dominica secunda Adventus Domini (lines 11-12), Homily VI Dominica tertia Adventus Domini (line 63), Homily VII Dominica quarta in Adventu Domini (line 77), and Homily XX Sabbato Quatuor temporum ante Natalem Christi (line 231). English witnesses: the Oxford Catena on John (passage gregory-on-john-1-23 of edition 1874-english-oxford-ia) renders the Scitis ... auditur portion; the Oxford Catena on Luke (passage gregory-on-luke-3-4 of edition 1843-1865-english-oxford-composite-ia) renders the derelictae destitutaeque Judaeae sentence under the margin Greg. 7, 20. in Ev."
