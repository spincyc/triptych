context = "Homily VII section 2 (Ego vox clamantis in deserto; Scitis, fratres charissimi, quia unigenitus Filius Verbum Patris vocatur ...; the voice sounds first so that the word may afterwards be heard; John cries in the desert because he brings deserted and forsaken Judaea the comfort of the Redeemer; the way of the Lord is made straight to the heart when the word of truth is humbly heard), read on line 81 of the extracted EPUB text with section 1 (line 80) and section 4 (line 82) as context. Line 81 also contains section 3 (Sed adhuc qui missi sunt percontantur ...), because the source XHTML groups sections 2 and 3 into one paragraph; this passage claims only section 2, which runs from the opening of the line to the numeral 3."
