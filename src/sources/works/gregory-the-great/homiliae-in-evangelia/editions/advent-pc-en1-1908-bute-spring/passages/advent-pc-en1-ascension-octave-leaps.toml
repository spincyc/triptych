notes = "Collated with the checked PL 76 passage passage.gregory-the-great.homiliae-in-evangelia.1878-latin-migne-pl76-garnier.advent-pc-l4-29.10-saltus, which covers the same unit. Bute keeps the series of leaps whole and renders de sepulcro rediit in coelum as from the grave up to heaven; the Latin's quia exsultavit ut gigas ad currendam viam suam is given as for this end did He rejoice, as a strong man to run a race."
