context = "The Octave of the Ascension, Third Nocturn, eighth lesson, Bute, Spring, pp. 488-489 (Homily by Pope St Gregory [the Great.] (Same as before.), that is Homily XXIX on the Gospels). The lesson renders Homily XXIX §10 from Hinc ejusdem Ecclesiae voce through Trahe nos post te, curremus in odorem unguentorum tuorum: the leaps of Song 2:8 from heaven into the womb, the manger, the Cross, the grave and back to heaven. Consideravit namque tantorum operum culmina is rendered These hills are his lofty and noble achievements. The rest of the homily lies outside this lesson."
physical_line_ranges = [[1, 7]]
text = "Hence it is that Solomon hath put into the mouth of the (same) Church the words: “Behold, He cometh! leaping upon the mountains, skipping upon the hills!” These hills are his lofty and noble achievements. “Behold, He cometh! leaping upon the mountains!” When He came to redeem us, He came, if I may so say, in leaps. My dearly beloved brethren, would you know what His leaps were? From heaven he leapt into the womb of the Virgin, from the womb into the manger, from the manger on to the Cross, from the Cross into the grave, and from the grave up to heaven. Lo, how the Truth made manifest in the Flesh did leap for our sakes, that He might draw us to run after Him; for this end did He “rejoice, as a strong man to run a race,” that we might passionately say: “Draw us after Thee; we will run after the savour of Thine ointments.”"
