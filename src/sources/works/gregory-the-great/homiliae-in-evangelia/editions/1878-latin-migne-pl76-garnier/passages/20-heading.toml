notes = "The heading says the homily was delivered to the people in the basilica of St John the Baptist on the Ember Saturday before Christmas (Sabbato quatuor temporum ante Natalem Christi). APPARATUS: footnote marker 4 stands before HOMILIA (the homily's number in other manuscripts: third in Corb., sixteenth in Cod. reg. Suec., fourth in Later.); marker 5 stands before basilica (Later. reads in basilica sancti Salvatoris quae appellatur Constantiniana, and the Roman calendar gives the station at St Peter's); marker 6 stands before Sabbato, and its note says Haec non leguntur, these words are not read, in Later., Cod. reg. Suec., C. Germ. and Bigot. The page does not mark where the words of note 6 end. The italic manuscript reading in note 5 is set roman here. The printer set Inkalendario solid and a space before the colon after habes. OCR AGAINST PAGE (ia-djvu-text-13c0bbad lines 92098-92101): IIOMILIA for HOMILIA; B for the footnote marker 5; 6Sabbato with the marker run in; Cbristi for Christi."
