text = "HOMILIA XX. Habita ad populum in basilica sancti Joannis Baptistæ, Sabbato quatuor temporum ante Natalem Christi. In Corb. est tertia. In Cod. reg. Suec. decima sexta. In Later. quarta. In Later. habes: in basilica sancti Salvatoris quæ appellatur Constantiniana. In kalendario Roman. statio est ad sanctum Petrum. Hæc non leguntur in Later., Cod. reg. Suec., C. Germ. et Bigot."
