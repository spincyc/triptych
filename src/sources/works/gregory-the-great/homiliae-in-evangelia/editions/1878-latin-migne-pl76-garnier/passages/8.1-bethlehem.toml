notes = "Scriptural references printed in parentheses are omitted from the lines: (Joan. vi, 41, 52) after descendi and (Joan. i, 11) after venit. The bold 1461 embedded before ostenderet is earlier-edition pagination and is omitted. PRINTED PUNCTUATION KEPT: the page prints natus est. in nostra and apparuit. alienum, each a full stop followed by a lower-case word, read at 600 dots per inch; they are kept as printed and not normalized to commas. The italic ligature in cælo was read at 1200 dots per inch as ae, not oe. The printer set eratut without a space; it is written erat ut. OCR AGAINST PAGE (ia-djvu-text-13c0bbad lines 87382-87400): word differences, optical text first: Bethlehemnascitur for Bethlehem nascitur; cwlo for caelo; eratut for erat ut; inlerna for interna; ia for via; naturaetenim for natura etenim; vobis exempla proponitis ad majora semper ascen g m for in; anernus for aeternus; descen for descendit; it also interleaves marginal, running-head or other-column text (Joan vi 41 32; 1461; Joan i II)."
