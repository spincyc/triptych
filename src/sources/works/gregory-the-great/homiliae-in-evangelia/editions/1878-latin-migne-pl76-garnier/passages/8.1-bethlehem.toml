context = "PL 76 col. 1104 A-B (Garnier 1878 reprint), facsimile PDF page 552, right column, top. Homily VIII section 1, from Qui bene etiam in Bethlehem nascitur to alienum est ubi descendit, after which Gregory turns to Isaiah's All flesh is grass and the manger (passage 8.1-manger). It follows directly on the census sentence and its contrast with the reprobate (Psalm 68:29)."
physical_line_ranges = [[1, 8]]
text = "Qui bene etiam in Bethlehem nascitur: Bethlehem quippe domus panis interpretatur. Ipse namque est qui ait: Ego sum panis vivus, qui de cælo descendi. Locus ergo in quo Dominus nascitur, domus panis antea vocatus est, quia futurum profecto erat ut ille ibi per materiam carnis appareret, qui electorum mentis interna satietate reficeret. Qui non in parentum domo, sed in via nascitur, ut profecto ostenderet, quia per humanitatem suam quam assumpserat quasi in alieno nascebatur. Alienum videlicet non secundum potestatem dico, sed secundum naturam. Nam de potestate ejus scriptum est: In propria venit. In natura etenim sua ante tempora natus est. in nostra venit ex tempore. Qui ergo æternus permanens temporalis apparuit. alienum est ubi descendit."
