context = "PL 76 col. 1080 C-D (Garnier 1878 reprint), facsimile PDF page 540, right column. Homily I section 5 from its opening Ecce, fratres mei to diu stare non posse; the section continues with 1 John 2:15 (Praecepta apostolica in animo ponite) and the storm of the day before yesterday."
physical_line_ranges = [[1, 6]]
text = "Ecce, fratres mei, jam cernimus quod audiebamus. Novis quotidie et crebrescentibus malis mundus urgetur. Ex illa plebe innumera quanti remanseritis aspicitis; et tamen adhuc quotidie flagella urgent, repentini casus opprimunt, novæ nos et improvisæ clades affligunt. Sicut enim in juventute viget corpus, forte et incolume manet pectus, torosa cervix, plena sunt bronchia; in annis autem senilibus statura curvatur, cervix exsiccata deponitur, frequentibus suspiriis pectus urgetur, virtus deficit, loquentis verba anhelitus intercidit; nam etsi languor desit, plerumque sensibus ipsa sua salus ægritudo est: ita mundus in annis prioribus velut in juventute viguit, ad propagandam humani generis prolem robustus fuit, salute corporum viridis, opulentia rerum pinguis; at nunc ipsa sua senectute deprimitur, et quasi ad vicinam mortem molestiis crescentibus urgetur. Nolite ergo, fratres mei, diligere quem videtis diu stare non posse."
