notes = "The bold 1439 embedded after pectus is earlier-edition pagination and is omitted, as are the footnote markers 6 (before anhelitus; footnote: Turon., anhelitus intercipit) and 7 (before molestiis; footnote: C. Germ., Corb., Bigot. et duo pr. Gemet., molestiis crebrescentibus. Longip., molestiis crescentibus crebrius. Consentit Ed. Antuerp.). The mark after aspicitis is faint and was read at 600 dots per inch as a semicolon. The page prints bronchia. The spaces the printer set before semicolons and colons are closed. OCR AGAINST PAGE (ia-djvu-text-13c0bbad lines 85528-85549): word differences, optical text first: illaplebe for illa plebe; reet for remanseritis aspicitis et; Sieut for Sicut; pectusurgetur virtusdeficit for pectus urgetur virtus deficit; juventuteviguit for juventute viguit; dilibemus Optandum nobis est citius pergere atque ad rj gere for diligere; it also interleaves marginal, running-head or other-column text (1439; c; 7)."
