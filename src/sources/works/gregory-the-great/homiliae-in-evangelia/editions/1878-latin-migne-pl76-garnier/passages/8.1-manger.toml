notes = "Scriptural references printed in parentheses are omitted from the lines: (Isai. xl, 6) after fenum, whose numeral prints in small capitals that read as xi on the scan, and (Joan. xii, 24) after manet. The printer set frumentum,qui and Nisigranum without spaces; the spaces are supplied. Footnote 7 (on ne ab aeternae) reads 1 Carnut. et pauci, ne ab interna. PAGE READING: the last word prints remanerenl, its final t without a crossbar (read at 600 dots per inch); it is transcribed remanerent and the broken letter recorded here. OCR AGAINST PAGE (ia-djvu-text-13c0bbad lines 87400-87408): word differences, optical text first: feniiin Isai xi 6 for fenum; quide for qui de; Nisigranwn for Nisi granum; prasepio for praesepio; su for suae; reliceret 7 for reficeret; reternae for aeternae; pabnlo for pabulo; remanerenl Quid autem est for remanerent; it also interleaves marginal, running-head or other-column text (Joan xn 24)."
