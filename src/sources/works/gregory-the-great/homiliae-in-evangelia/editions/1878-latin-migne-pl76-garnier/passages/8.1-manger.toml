context = "PL 76 col. 1104 B (Garnier 1878 reprint), facsimile PDF page 552, right column. Homily VIII section 1, from Et quia per prophetam dicitur to jejuna remanerent, directly after the Bethlehem passage (8.1-bethlehem) and before Quid autem est quod vigilantibus pastoribus angelus apparet."
physical_line_ranges = [[1, 2]]
text = "Et quia per prophetam dicitur: Omnis caro fenum, factus homo, fenum nostrum vertit in frumentum, qui de semetipso ait: Nisi granum frumenti cadens in terram mortuum fuerit, ipsum solum manet. Unde et natus in præsepio reclinatur, ut fideles omnes videlicet sancta animalia, carnis suæ frumento reficeret, ne ab æternæ intelligentiæ pabulo jejuna remanerent."
