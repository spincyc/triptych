notes = "Gregory sets the leaps inside an Ascension homily and draws from them the following of Christ (ut nos post se currere faceret; section 11: illuc sequamur corde); he does not connect Song 2:8 with the Visitation. The print reads de cruce venit in sepulcrum. de sepulcro with a full stop where the series wants a comma; read at 1200 dots per inch, the mark has no tail and is kept as printed. Several lines of this column are faintly inked (de utero venit in praesepe, de praesepe venit in crucem; diceremus ex corde; Trahe nos ... tuorum) and were read at 600 dots per inch. Omitted: (Cant. ii, 8) after colles; (Psal. xviii, 6) after suam; (Cant. i, 3) after tuorum; footnote marker 1 before Trahe; the bold page number 1574 in the preceding sentence. The printer set the space before the question mark after agnoscere; it is closed."
