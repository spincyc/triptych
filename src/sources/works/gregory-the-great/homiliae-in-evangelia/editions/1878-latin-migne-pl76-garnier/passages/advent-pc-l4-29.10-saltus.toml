context = "PL 76 col. 1219 A-B, facsimile PDF page 610, left column. Homily XXIX (on Mark 16:14-20, the Ascension), section 10: the leaps of Song 2:8, from heaven to the womb, the manger, the cross, the tomb and back to heaven. Section 10 begins on PDF page 609 (col. 1218); the transcription runs from Hinc ejusdem Ecclesiae voce to unguentorum tuorum, before 11. Unde, fratres charissimi."
physical_line_ranges = [[1, 4]]
text = "{29.10} Hinc ejusdem Ecclesiæ voce per Salomonem dicitur: Ecce iste venit saliens in montibus, et transiliens colles. Consideravit namque tantorum operum culmina, et ait: Ecce iste venit saliens in montibus. {29.10} Veniendo quippe ad redemptionem nostram, quosdam, ut ita dixerim, saltus dedit. {29.10} Vultis, fratres charissimi, ipsos ejus saltus agnoscere? De cœlo venit in uterum, de utero venit in præsepe, de præsepe venit in crucem, de cruce venit in sepulcrum. de sepulcro rediit in cœlum. {29.10} Ecce, ut nos post se currere faceret, quosdam pro nobis saltus manifestata per carnem veritas dedit, quia exsultavit ut gigas ad currendam viam suam, ut nos ei diceremus ex corde: Trahe nos post te, curremus in odorem unguentorum tuorum."
