notes = "Section 6 opens at the foot of col. 1121; its first words were read on the image with the section number. The column ends Quia post peccata Deus. with a full stop after Deus, which breaks the sentence (Quia post peccata Deus poenitentiam suscipit, ...); read at 1200 dots per inch, it is a printed full stop and is kept as printed. The print reads quo temporis exiret; the Wikisource witness of these homilies (gregory-whole.txt) reads quo tempore exiret. The italic lemma (Matt. 25:13) is not marked. OCR (ia-djvu-text-13c0bbad) was used only to find the page."
