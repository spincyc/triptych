context = "PL 76 col. 1121 D (foot of the left column) to col. 1122 A (head of the right column), facsimile PDF page 561. Homily XII (on Matt. 25:1-13), the opening of section 6: Gregory's reading of Vigilate itaque, quia nescitis diem neque horam. The day is hidden because God, who promised pardon to the penitent, did not promise tomorrow to the sinner. Read from 6. Ubi apte to praevidere, before Ecce hunc ipsum diem."
physical_line_ranges = [[1, 3]]
text = "{12.6} Ubi apte quoque generalis ad discipulos exhortatio subinfertur, cum dicitur: Vigilate itaque, quia nescitis diem neque horam. {12.6} Quia post peccata Deus. pœnitentiam suscipit, si sciret quisque de præsenti sæculo quo temporis exiret, aliud tempus voluptatibus, atque aliud pœnitentiæ aptare potuisset. {12.6} Sed qui pœnitenti veniam spopondit, peccanti diem crastinum non promisit. Semper ergo extremum diem debemus metuere, quem nunquam possumus prævidere."
