context = "PL 76 col. 1103 D (Garnier 1878 reprint), facsimile PDF page 552, left column. The opening of Homily VIII, preached in the basilica of St Mary on Christmas Day (the heading reads Habita ad populum in basilica beatae Mariae Virginis, in die Natalis Domini; the lection is Luke 2:1-14). From Quia, largiente Domino to ascriberet in aeternitate?, after which Gregory turns to the reprobate (Quo contra de reprobis per Prophetam dicitur). The homily prints no section number 1; section 2 begins Regem vero natum in col. 1104 C."
physical_line_ranges = [[1, 3]]
text = "Quia, largiente Domino, missarum solemnia ter hodie celebraturi sumus, loqui diu de Evangelica lectione non possumus. Sed nos aliquid vel breviter dicere Redemptoris nostri nativitas ipsa compellit. Quid est quod nascituro Domino mundus describitur, nisi hoc quod aperte monstratur, quia ille veniebat in carne, qui electos suos ascriberet in æternitate?"
