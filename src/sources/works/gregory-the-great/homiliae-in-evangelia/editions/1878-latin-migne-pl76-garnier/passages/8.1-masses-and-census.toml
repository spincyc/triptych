notes = "Before Quia the page prints the bold number 1460, the pagination of an earlier edition embedded in Migne's text, which is not Gregory's and is omitted; footnote 6 (on quia ille veniebat) reads Excusi, quia ille apparebat in carne, i.e. the printed editions read apparebat. The printer set Quia,largiente Domino,missarum without spaces after the commas; the spaces are supplied. OCR AGAINST PAGE (ia-djvu-text-13c0bbad lines 87453-87479): word differences, optical text first: largienteDomino for largiente Domino; 2 Regem vero natum angelus nun ... [interleaved text of the other column, 97 words] ... ntenterhodie for ter hodie; descrihitur for describitur; it also interleaves marginal, running-head or other-column text (D tionem prionsdiscordi postponunt et quos prius; 6)."
