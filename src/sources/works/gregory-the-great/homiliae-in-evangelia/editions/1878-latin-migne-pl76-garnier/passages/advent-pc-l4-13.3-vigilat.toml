notes = "The printer set dominus,invenerit without a space; it is supplied. Scriptural references printed in parentheses are omitted: (I Cor. xv, 34) after peccare and (Rom. xiii, 11) after surgere. The three vigilat clauses recur, with autem and commas added, in Bede's commentary on Mark 13:37 (artifact.bede.in-marci-evangelium-expositio.2026-10-13-latin-wikisource-migne.latin-text-b8197766, line 405), followed there by the same two Pauline texts. OCR (ia-djvu-text-13c0bbad) was used only to find the page."
