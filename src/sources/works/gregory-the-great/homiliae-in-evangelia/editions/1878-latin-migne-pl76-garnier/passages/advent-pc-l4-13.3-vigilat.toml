context = "PL 76 col. 1124 C-D, facsimile PDF page 562, right column. Homily XIII (on Luke 12:35-40), section 3: on Beati sunt servi illi, quos cum venerit dominus invenerit vigilantes, the three kinds of watching, joined to 1 Cor. 15:34 and Rom. 13:11. Read from Unde et protinus subditur to surgere, before 4. Sed veniens dominus."
physical_line_ranges = [[1, 3]]
text = "{13.3} Unde et protinus subditur: Beati sunt servi illi, quos cum venerit dominus, invenerit vigilantes. {13.3} Vigilat qui ad aspectum veri luminis mentis oculos apertos tenet, vigilat qui servat operando quod credit, vigilat qui a se torporis et negligentiæ tenebras repellit. {13.3} Hinc etenim Paulus dicit: Evigilate, justi, et nolite peccare. Hinc rursus ait: Hora est jam nos de somno surgere."
