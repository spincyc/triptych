notes = "The bold 1436 before the section number is earlier-edition pagination and is omitted, as is the footnote marker 6 before Appropinquantem (footnote 6: 2 Carnut., appropinquante ejus termino). THE HEADING DATES THE HOMILY TO THE SECOND SUNDAY OF ADVENT: Habita ad populum in basilica sancti Petri apostoli, Dominica secunda Adventus Domini; footnote 1 records that the Lateran codex reads in Basilica sanctae Mariae ad praesepe. OCR AGAINST PAGE (ia-djvu-text-13c0bbad lines 85357-85364): word differences, optical text first: muiidum quaemalasequantur for mundum quae mala sequantur; quanta for quantae; prasveniant for praeveniant; percussionihus for percussionibus; it also interleaves marginal, running-head or other-column text (6)."
