context = "PL 76 col. 1077 C (Garnier 1878 reprint), facsimile PDF page 539, left column. The opening two sentences of section 1 of Homily I, after the heading (Habita ad populum in basilica sancti Petri apostoli, Dominica secunda Adventus Domini) and the lection Luke 21:25-32; the section continues Huic etenim lectioni sancti Evangelii."
physical_line_ranges = [[1, 2]]
text = "Dominus ac Redemptor noster, fratres charissimi, paratos nos invenire desiderans, senescentem mundum quæ mala sequantur denuntiat, ut nos ab ejus amore compescat. Appropinquantem ejus terminum quantæ percussiones præveniant innotescit, ut si Deum metuere in tranquillitate non volumus, vicinum ejus judicium vel percussionibus attriti timeamus."
