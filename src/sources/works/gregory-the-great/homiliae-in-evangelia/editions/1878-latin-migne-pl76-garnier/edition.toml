notes = "Identified from the page images of Internet Archive item patrologiaecursu76mign (PIMS - University of Toronto copy, call number ALV-0047; Scribe scan scribe21.toronto.archive.org, 2011), read on 2026-11-19. The title page (PDF p. 3) reads: TRADITIO CATHOLICA / SAECULUM VII. ANNUS 604. / SANCTI GREGORII PAPAE I, COGNOMENTO MAGNI, OPERA OMNIA. / AD MANUSCRIPTOS CODICES ROMANOS, GALLICOS, ANGLICOS EMENDATA, AUCTA, ET NOTIS ILLUSTRATA. / STUDIO ET LABORE MONACHORUM ORDINIS S. BENEDICTI, E CONGREGATIONE S. MAURI. / EDITIO MEMORATISSIMA QUAE PARISIIS PRODIIT ANNO DOMINI MDCCV, NUNC AUTEM ACCURATIOR ET AUCTIOR REVIVISCIT / ACCURANTE ET DENUO RECOGNOSCENTE J.-P. MIGNE ... / TOMUS SECUNDUS. / PARISIIS / APUD GARNIER FRATRES, EDITORES ET J.-P. MIGNE SUCCESSORES / IN VIA DICTA AVENUE-DU-MAINE, 189, OLIM CHAUSSEE-DU-MAINE 127 / 1878. This is the Garnier reprint of PL 76, not Migne's first printing of 1849; its columns are cited as PL 76 columns, but its wording has not been compared with the 1849 printing or with the Documenta Catholica Omnia scan registered as edition pl76-facsimile-web-2026-09-17, whose own printing year is unestablished. Registered on 2026-11-19 because that held scan could not be re-acquired: its host failed TLS certificate verification, and a fetch with verification disabled was not authorised. The Homiliae in Evangelia occupy cols. 1075-1312; Homily I begins at col. 1077, Homily VIII at col. 1103. The modern critical edition (R. Etaix, CCSL 141, 1999) is under copyright and was not consulted."
