notes = "The complete 764-page Internet Archive PDF of item patrologiaecursu76mign. Completeness check: the byte size, 77,085,154, and the SHA-1, 51504323edfb85a272917c7a8df91491b438e698, equal the item's own file listing for this file. The title page is PDF p. 3. Page rule measured at the homily pages read: PDF page p carries columns 2p - 1 and 2p, so columns 1077-1078 are PDF p. 539, 1079-1080 p. 540 and 1103-1104 p. 552. CONTAINER: this PDF reproduces all of Patrologia Latina 76, which by its own contents page (PDF p. 4, Elenchus operum quae in hoc tomo LXXVI continentur) prints the continuation of the Moralia from book XVII to the end (col. 9), the Homiliae in Ezechielem (col. 781), the Homiliae XL in Evangelia (col. 1075), the Oratio ad plebem de mortalitate (col. 1311) and indexes (cols. 1313, 1343). It is registered under the Homiliae in Evangelia because that is the work it was acquired to witness; the other works it prints are not claimed by this edition. ACCESS LIMITATION: the bytes are not retained for their size (77 MB); the whole optical text layer of the same item is tracked beside it, and any page a claim depends on must be re-fetched by this URL and digest."
