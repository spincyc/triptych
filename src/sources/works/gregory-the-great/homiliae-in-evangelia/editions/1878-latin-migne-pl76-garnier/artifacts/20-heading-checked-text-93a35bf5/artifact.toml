provenance = "Triptych manual transcription collated against the page images of the hashed Internet Archive scan ia-pdf-4cd0ddfd (SHA-256 4cd0ddfd...7cc4; the local copy fetched whole by lane X2 on 2026-11-19 was matched with sha256sum before use) on 2026-11-19; the tracked optical text ia-djvu-text-13c0bbad and the PDF's embedded text were used only to locate the page. No source text passed through a language model. PL 76 col. 1159 C, with footnotes 4-6 at the foot of cols. 1159-1160, PDF page 580."
