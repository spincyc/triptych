transformation = "Read the named page as images rendered at 150 dots per inch (whole page) and 400 dots per inch (crops of the heading and the footnotes) from the hashed scan with pdftoppm, and transcribe the homily's number, its heading, and the three footnotes Migne attaches to them, with one sense unit (the number, the heading, or one whole footnote) per LF-terminated UTF-8 line, each prefixed by a braced locator; preserve the printed wording, Migne's orthography (j, the ae ligature, capitals) and punctuation; close the printer's space before a colon and supply the space the printer omitted between words set solid; join a footnote that runs from the foot of one column to the next; omit italics, the footnote reference numerals in the heading, the gospel heading and pericope that follow, column letters and running heads, all of which are recorded in the passage notes."
