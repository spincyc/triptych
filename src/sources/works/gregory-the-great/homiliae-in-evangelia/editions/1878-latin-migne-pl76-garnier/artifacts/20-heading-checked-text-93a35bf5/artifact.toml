rights_basis = "This focused transcription reproduces a few sentences of Gregory the Great's sixth-century Latin as printed in Migne's Patrologia Latina 76 (Garnier reprint, Paris, 1878), which is in the United States public domain by date of publication (the parent scan's rights_basis gives the reasoning). It is transcribed from page images rendered from the hashed Internet Archive scan and contains no optical-text bytes. It also reproduces the three short apparatus footnotes Migne prints to the heading, which report the Maurist editors' manuscript readings and add no copyrightable modern authorship."
