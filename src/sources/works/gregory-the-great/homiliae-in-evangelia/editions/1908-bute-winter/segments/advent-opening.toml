context = "Complete homiletic text of the seventh, eighth and ninth lessons. Bute, Winter, pp. 216–217, First Sunday of Advent, lessons VII–IX. Beginning at the opening of Gregory’s Homily I §1, the three lessons reach Luke 21:10, the signs at Luke 21:25, and Gregory’s observations about wars, earthquakes, pestilence and the changing seasons. They end before his account of fiery battalions over Italy. The rest of §1 and §§2–6 are outside this English reading."
