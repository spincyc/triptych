context = "Christmas, seventh lesson, p. 276. From the birth at Bethlehem through the House of Bread and the birth away from home, Bute renders the same part of Homily VIII §1. The Breviary compresses the closing distinction between nature and power and its quotation of John 1:11."
physical_line_ranges = [[43, 47]]
text = "Then, the Lord is born in Bethlehem. Now the name Bethlehem signifieth “the House of Bread,” and thus it is the birth-place of Him Who hath said, “I am the Living Bread, Which came down from heaven.” (John vi. 51.) We see then that this name of Bethlehem was prophetically given to the place where Christ was born, because it was there that He was to appear in the flesh by Whom the souls of the faithful are fed unto life eternal. He was born, not in His Mother’s house, but away from home. And this is a mystery, showing that this our mortality into which He was born was not the home of Him Who is begotten of the Father before the worlds."
