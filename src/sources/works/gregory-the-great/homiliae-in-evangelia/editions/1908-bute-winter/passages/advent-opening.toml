context = "Bute, Winter, pp. 216–217, First Sunday of Advent, lessons VII–IX. Beginning at the opening of Gregory’s Homily I §1, the three lessons reach Luke 21:10, the signs at Luke 21:25, and Gregory’s observations about wars, earthquakes, pestilence and the changing seasons. They end before his account of fiery battalions over Italy. The rest of §1 and §§2–5 are outside this English reading."
physical_line_ranges = [[1, 3]]
text = "Our Lord and Saviour wisheth to find us ready at His second coming. Therefore He telleth us what will be the evils of the world as it groweth old, that He may wean our hearts from worldly affections. Here we read what great convulsions will go before the end, that, if we will not fear God in our prosperity, we may at least be scourged into fearing His judgment when it is at hand. IMMEDIATELY before the passage which hath just been read from the Gospel, are found the following words of our Lord,—“Nation shall rise against nation, and kingdom against kingdom, and great earthquakes shall be in divers places, and pestilences and famines.” Then, after a few more verses, cometh to-day's Gospel. “There shall be signs in the sun, and in the moon, and in the stars; and upon the earth distress of nations with perplexity, the sea and the waves roaring.” Now some of these things are come to pass already, and we fear the others are not far off. IN these our days we see nation rise against nation, and their distress over all the earth, more than we read in books hath ever come to pass of old time. Ye know also how often we hear of earthquakes overwhelming countless cities in other parts of the world. As for pestilences, we suffer from them ourselves, with hardly any intermission. As yet we do not see signs in the sun, and in the moon, and in the stars; but the changes of seasons and climates warn us that we may look for these also before long."
