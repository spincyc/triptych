text = "By God’s mercy we are to say three Masses to-day, so that there is not much time left for preaching; but at the same time the occasion of the Lord’s Birth-day itself obliges me to speak a few words. I will first ask why, when the Lord was to be born, the world was enrolled? Was it not to herald the appearing of Him by Whom the elect are enrolled in the book of life?"
