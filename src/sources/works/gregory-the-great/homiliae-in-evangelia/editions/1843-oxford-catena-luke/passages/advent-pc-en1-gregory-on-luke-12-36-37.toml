context = "English through Thomas Aquinas's Catena Aurea. 457-458. The English renders Homily XIII §3 from Venit quippe Dominus cum ad judicium properat through the three kinds of watching (vigilat ... repellit), compressing quia laetus judicem sustinet into the following clause; it leaves out the section's opening lemma (Luke 12:36) and its closing Pauline texts (Evigilate, justi; Hora est jam nos de somno surgere). The rest of the homily lies outside this extract."
physical_line_ranges = [[1, 5]]
text = "For He comes when He hastens to judgment, but He knocks, when already by the pain of sickness He denotes that death is at hand; to whom we immediately open if we receive Him with love. For he who trembles to depart from the body, has no wish to open to the Judge knocking, and dreads to see that Judge whom he remembers to have despised. But he who rests secure concerning his hope and works, immediately opens to Him that knocks; for when he is aware of the time of death drawing near, he grows joyful, because of the glory of his reward; and hence it is added, Blessed are the servants whom the lord when he cometh shall find watching. He watches who keeps the eyes of his mind open to behold the true light; who by his works maintains that which he beholds, who drives from himself the darkness of sloth and carelessness."
