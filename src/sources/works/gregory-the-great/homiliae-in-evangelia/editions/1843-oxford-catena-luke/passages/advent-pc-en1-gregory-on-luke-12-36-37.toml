notes = "Collated with the Latin of Homily XIII §3 in the Wikisource witness (artifact.gregory-the-great.homiliae-in-evangelia.2026-09-17-wikisource.complete-extracted-text-dc25dd69) and the checked PL 76 passage passage.gregory-the-great.homiliae-in-evangelia.1878-latin-migne-pl76-garnier.advent-pc-l4-13.3-vigilat. The Oxford Catena on Matthew 24:42 quotes the three clauses again, cited Hom. in Ev. ii, 3, in a different English (To watch is to keep the eyes open ...); that witness is held only as an electronic text (CCEL) and was not checked on a page image here."
