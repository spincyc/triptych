context = "Attributed quotation in the Oxford translation of Aquinas's Catena Aurea on Luke 12:36-37, printed pp. 457-458. The English renders Homily XIII §3 from Venit quippe Dominus cum ad judicium properat through the three kinds of watching (vigilat ... repellit), compressing quia laetus judicem sustinet into the following clause; it leaves out the section's opening lemma (Luke 12:36) and its closing Pauline texts (Evigilate, justi; Hora est jam nos de somno surgere). The rest of the homily lies outside this extract."
