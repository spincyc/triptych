context = "Gregory's answer to the question what the beloved disciple believed, read in the retrieved file with sections 3 and 4 in view and with the homily's rubric naming the occasion and the lection. Registered as the witness that Gregory follows Augustine on John 20:8 and adds a reason of his own."
physical_line_ranges = [[1, 3]]
text = "Et vidit et credidit. Quid, fratres, quid aestimandus est credidisse? Nunquid quia Dominus resurrexerat, quem quaerebat? Non utique, quia adhuc tenebrae erant ad monumentum, et subjuncta quoque verba contradicunt cum dicitur: Nondum enim sciebant Scripturas, quia oporteret eum a mortuis resurgere. Quid ergo vidit, et quid credidit? Vidit linteamina posita, et credidit quod mulier dixerat, de monumento Dominum fuisse sublatum."
