context = "Gregory's allegorical exposition of the head-cloth: separate because the Godhead is set apart from our knowledge, wrapped up because a wrapped cloth shows neither beginning nor end, in one place because God is not in division of minds, and named a sudarium because it signifies the labor of God. Read in the retrieved file. Registered because consuming publications report that Gregory expounds the arrangement at length without any argument from theft."
physical_line_ranges = [[1, 5]]
text = "Quid esse, fratres, credimus, quod sudarium capitis Domini cum linteaminibus non invenitur in monumento, nisi quia, Paulo attestante, caput Christi Deus, et divinitatis incomprehensibilia sacramenta ab infirmitatis nostrae cognitione disjuncta sunt, ejusque potentia creaturae transcendit naturam? Et notandum quod non solum separatim, sed etiam involutum inveniri dicitur in unum locum. Linteum quippe quod involvitur, ejus nec initium nec finis aspicitur. Recte ergo sudarium capitis involutum inventum est, quia celsitudo divinitatis nec coepit esse, nec desinit; nec per initium nascitur, nec termino coangustatur. Bene autem additur: In unum locum, quia in scissura mentium Deus non est. Sudarium ergo quod super caput ejus fuerat seorsum invenitur, quia ipsa Redemptoris nostri passio longe a nostra passione disjuncta est, quoniam ipse sine culpa pertulit quod nos cum culpa toleramus. Ipse sponte morti succumbere voluit, ad quam nos venimus inviti."
