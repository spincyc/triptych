notes = "A dated delivery state of a transcription of Migne, not a critical edition. The file was checked for the automated Italian spelling corruption that affects some other files on the same site and was clean. Consumers needing a critical text must use the relevant Corpus Christianorum edition, which was not consulted. Migne prints the Maurist column numbers inline as well as his own, and the two must not be confused."
