description = "Gregory's forty homilies on the Gospels, preached at Rome about 590 to 592 and issued in two books. Homily XXII, preached in the Lateran basilica on the Saturday after Easter, takes John 20:1-9 as its lection and expounds the burial cloths allegorically. A locus is homily.section or the homily number alone."
