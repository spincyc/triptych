description = "The historical and theological commentary on the Roman liturgical year begun by Prosper Guéranger and continued after his death. English editions translate the French series; the registered Time after Pentecost II volume identifies itself as a Continuation without naming its writer in the checked preface. Its interpretations are reception witnesses rather than promulgating liturgical sources."
