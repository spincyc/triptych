notes = "Dated from the title page, which prints 1901 below the London imprint (text layer lines 94-131 of artifact ia-djvu-ocr-68111bbd, re-fetched and matched to its SHA-256 on 2026-09-23; the page image, leaf n6, was read by the lane that found it). Corrected on 2026-09-23: this record formerly dated the volume 1900 by its series and gave only Dublin: James Duffy and Co., saying the printed year was not legible, but the year and the Stanbrook second-edition imprint stand in the recorded bytes. Registered because a bounded negative rests on it -- this volume carries Trinity Sunday to the Third Sunday after Pentecost and therefore not the Sixteenth."
