notes = "Second edition. Title page (PDF p. 4) identifies Time after Pentecost, volume II (volume XI in the complete English series), translator Dom Laurence Shepherd, and the 1909 imprint. Preface pp. iii–iv (PDF pp. 6–7) identifies this as the second volume of the Continuation after Guéranger's death but does not name the continuator. Metadata corrected on 2026-09-05 against the authenticated same-byte facsimile; the former Dublin: James Duffy, 1900 imprint was erroneous. The immutable ID and legacy path retain english-duffy-1900-volume-11 as a historical identifier, not a bibliographic assertion. Language pairing: the canonical source-reader catalog was searched under Guéranger, L'Année liturgique and Shepherd, and the supplied receipts were checked for the French original of this continuation. No French edition or usable French receipt was found within that bound. This stage may not retrieve; no claim is made that a French witness is publicly unavailable."
