context = "Guéranger's direct theological reception of the Tenth Sunday after Pentecost Postcommunion, printed immediately after the Communion antiphon and immediately before the Latin and English Postcommunion on page 271. Read from PDF page 292 rendered at 160 dpi and visually checked against the hashed facsimile. It attributes sacramental repair and the preservation and increase of spiritual treasure to continuing divine aid; it does not establish the prayer's lexical meaning, authorship, date, or original calendar assignment."
text = "The august Sacrament is ever repairing the losses we sustain through our many miseries; and yet this would not be of much profit to us, unless the divine benignity were to be continually bestowing on us those actual graces, which preserve and increase the treasures of the soul. We cannot get on without this special aid; let us ask for it, in the Postcommunion."
