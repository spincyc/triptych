notes = "Uncorrected optical text of the whole of Time after Pentecost volume II (series volume XI), 34,838 LF-terminated lines. Extent as measured by the retrieving lane: Complete DjVu optical-text layer of the whole of Prosper Gueranger, The Liturgical Year: Time after Pentecost vol. II (overall vol. XI), trans. Laurence Shepherd -- the Internet Archive item V11TheLiturgicalYear whose PDF is registered here as artifact.prosper-gueranger.the-liturgical-year.english-duffy-1900-volume-11.ia-pdf-95ba98e2. Text layer, not the registered PDF bytes. It carries the volume's whole table of contents and all its Sunday chapters, which is what the negative below is measured against.. This is the text layer of the same Internet Archive item whose PDF is registered on this edition as ia-pdf-95ba98e2; different bytes, and no derived_from edge is asserted. ACCESS LIMITATION. Neither this text layer nor the PDF is retained, so a reader without the network cannot open Guéranger's chapter on the Sixteenth Sunday after Pentecost, at printed pp. 356-371, from a checkout."
