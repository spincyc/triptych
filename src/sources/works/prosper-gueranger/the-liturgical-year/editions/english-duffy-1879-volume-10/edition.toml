notes = "Identified from the page images of Internet Archive item liturgicalyear10gu (PIMS copy, University of Toronto; Scribe scan scribe23.toronto.archive.org, scanned 2011-07-18), read on 2026-09-22. The title page (PDF p. 7) reads: THE LITURGICAL YEAR. / BY THE / VERY REV. DOM PROSPER GUÉRANGER, / ABBOT OF SOLESMES. / FIRST VOLUME OF THE CONTINUATION. / Translated from the French, / BY THE / REV. DOM LAURENCE SHEPHERD, / MONK OF THE ENGLISH-BENEDICTINE CONGREGATION. / THE TIME AFTER PENTECOST. / VOL. I. / DUBLIN: / JAMES DUFFY AND SONS, 15, WELLINGTON QUAY; / AND / 1a, PATERNOSTER ROW, LONDON. / 1879. The translator's dedication, as the text layer gives it, is dated St Mary's Abbey, Stanbrook, Worcester, 1879. The same volume is registered from a different scan as edition english-volume-10 (item V10TheLiturgicalYear), whose record dates it 1900 by the series rather than by a legible title page; this record does not decide whether that scan is this printing. Contents, as the text layer gives the contents pages: the season's introductory chapters, the Feast of the Most Holy Trinity and the days after it, and Corpus Christi; the volume's further extent was not read. Its French original is registered as edition french-oudin-1911-volume-10, in a later printing. WHO WROTE THE CONTINUATION. Prosper Guéranger (1805-1875, as the BnF records below date him) died before the second part of the work was written: the French volume 10 preface says he was preparing to develop it when death broke his pen. The Time after Pentecost volumes are the posthumous continuation published under his series name, and this repository credits that continuation to Dom Lucien Fromage, O.S.B., of Solesmes (1845-1916), by the maintainer's decision D7 of 2026-09-22 (guidance/liturgy/liturgical-commentators-plan-2026-09-22.md). The evidence, checked on 2026-09-22: (1) the French prefaces are signed with his initials. Read on the page images of the Internet Archive facsimiles registered in this work: 'Fr. L. F., O. S. B.', Solesmes, 10 mai 1878 (volume 10, PDF p. 12); 27 octobre 1882 (volume 11, PDF p. 11); 8 mai 1888 (volume 12, PDF p. 12); 22 novembre 1900 (volume 15, PDF p. 15). The English 1879 volume X prints the same initials, 'Br. L. F., O.S.B.', Solesmes, May 10, 1879 (PDF p. 14); the English 1883 volume XI prints its preface unsigned (PDF pp. 9-10). (2) The Bibliothèque nationale de France catalogue, queried through its SRU endpoint on 2026-09-22 (query bib.author all \"Fromage\" and bib.title all \"année liturgique\", Dublin Core, 7 records), names \"Fromage, Lucien (1845-1916)\" as Continuateur (ark:/12148/cb318196703) and Collaborateur (ark:/12148/cb32133488h) of Oudin sets of 1902-1908, both of which describe the seventh section as \"Le Temps après la Pentecôte. Continuation [par dom L. Fromage ...]\"; as Préfacier of \"Deuxième volume de la continuation. Le temps après la Pentecôte. Tome II\" (ark:/12148/cb321334875, 1920); and as Auteur du texte of the Desclée edition of 1948-1952, whose volumes 4-5 are \"Le temps après la Pentecôte / par Dom Lucien Fromage\" (ark:/12148/cb32203039r). (3) Corroborating only: the Internet Archive metadata of four Oxford copies digitised by Google, liturgicalyeart00fromgoog to liturgicalyeart03fromgoog, reads \"Continuation [by L. Fromage]\"; only their metadata was read. LIMITS. No volume read here expands the initials: the identification of L. F. with Lucien Fromage is the BnF's cataloguing, and its brackets mark the attribution as supplied rather than printed. Every title page names only Guéranger. Whether every page of every continuation volume is Fromage's alone is not established: the French volume 10 preface says Guéranger was about to develop this second part of the work when death broke his pen, and that obedience laid its continuation on the writer; its English rendering of 1879 says 'the pen that had begun this Volume' was put into his. Registered on 2026-09-22 under maintainer decision D8 (first-priority acquisitions P1-a and P1-b), as a new record beside, and without altering, the work's existing editions."
