notes = "Identified from the page images of Internet Archive item liturgicalyear01gura (University of North Carolina at Chapel Hill, Music Library copy; scanner scribe1.chapelhill, scanned 2012-07-10), read on 2026-11-18. The title page (PDF p. 9) reads: THE / LITURGICAL YEAR. / BY THE / VERY REV. DOM PROSPER GUERANGER, / ABBOT OF SOLESMES. / Translated from the French, / BY THE / REV. DOM LAURENCE SHEPHERD, / MONK OF THE ENGLISH-BENEDICTINE CONGREGATION. / ADVENT. / SECOND EDITION. / DUBLIN: / JAMES DUFFY, 15, WELLINGTON-QUAY; / AND / 22 PATERNOSTER-ROW, LONDON. / 1870. The Internet Archive metadata dates the item 1867, the year of the first English edition; the title page of THIS scan says second edition, 1870, and this record follows the page. Volume 1 of the English series, the Advent volume, by Gueranger himself (not the posthumous continuation). PDF page = printed page + 16 at the loci read (pp. 23-31, 155-157). CONTENTS READ: the volume opens with the General Preface, then ADVENT, Chapter the First, THE HISTORY OF ADVENT, printed pp. 23-30 (PDF pp. 39-46; text-layer lines 1260-1560), Chapter the Second, The Mystery of Advent, from p. 31, Chapter the Third, Practice during Advent, then the Proper of the Season day by day. On pp. 155-156, within the First Thursday of Advent, it prints the Rorate caeli with its four verses in Latin with English, headed PRAYER OF THE CHURCHES OF FRANCE DURING ADVENT (Taken from the Prophet Isaias.): Gueranger presents it as a French-church prayer, not as a Roman liturgical text. A CORRECTION TO A LOCUS IN THE HISTORY CHAPTER (reported by research lane R1, not re-derived here from Gregory of Tours): the English says the Perpetuus fast is in the second book of Gregory of Tours' History of the Franks (text-layer lines 1318-1323); research lane R1 places it at Historia Francorum X.31. The volume's further extent was not read."
