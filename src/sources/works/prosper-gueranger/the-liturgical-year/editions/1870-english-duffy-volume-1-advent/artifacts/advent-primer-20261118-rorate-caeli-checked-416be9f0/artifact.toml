rights_basis = "Public domain in the United States by publication date. The title page of this copy (PDF p. 9, read on the image on 2026-11-18) reads THE LITURGICAL YEAR. BY THE VERY REV. DOM PROSPER GUERANGER, ABBOT OF SOLESMES. Translated from the French, BY THE REV. DOM LAURENCE SHEPHERD, MONK OF THE ENGLISH-BENEDICTINE CONGREGATION. ADVENT. SECOND EDITION. DUBLIN: JAMES DUFFY, 15, WELLINGTON-QUAY; AND 22 PATERNOSTER-ROW, LONDON. 1870. A work first published abroad before 1931 is out of United States copyright: that is the line guidance/missals.md section 5 records from Cornell's public-domain chart as current on 1 January 2026, written here as derived for calendar year 2026. Restoration under 17 U.S.C. 104A cannot keep it protected: a restored term runs no longer than ninety-five years from publication, and ninety-five years from 1870 ended with 1965. No life-based term is relied on. This focused transcription reproduces only the Latin and Shepherd's English printed in that book and adds no authorship."
