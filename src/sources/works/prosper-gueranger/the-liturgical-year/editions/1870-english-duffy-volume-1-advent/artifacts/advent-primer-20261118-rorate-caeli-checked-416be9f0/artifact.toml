notes = "Printed pp. 155-156 (PDF pp. 171-172), within the First Thursday of Advent: heading, source note, and the Rorate with four verses in Latin (lines 3-11) and Shepherd's English (lines 12-20). The final English refrain prints Just one with a lower-case o (the earlier ones Just One). This is a pre-1931 human English of the full chant; it overturns, beyond R2's stated search bound, R2's negative that no such English was found. The Latin differs from the 1903 Manual of Gregorian Chant (nostrae for tuae in verse 1; quare comprehendit te dolor for quia innovavit te dolor in verse 4; verse 3 et emitte for et mitte; pointing). The following Prayer from the Ambrosian Missal on p. 156 is not transcribed. 20 LF-terminated lines."
