transformation = "Read on page images rendered from the exact whole PDF at 140 dpi, with both pages re-read at 220-260 dpi, on 2026-11-18. One sense unit per LF-terminated UTF-8 line, each prefixed by a braced printed-page locator. The book sets Latin and English in parallel columns; they are given as two blocks, Latin first, each in printed order. Wording, capitalization and pointing as printed; physical line wraps and division hyphens joined (hea-vens, Jeru-salem, compre-hendit); æ and œ expanded (coeli, nostrae, moerore); the diaeresis in Israël kept; the printer's space before : ; and ? is not reproduced. A stray mark between glory, and where in the English of verse 1 is not text. The OCR text layer was used only to find the pages."
