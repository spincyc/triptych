notes = "Four loci of Chapter the First, THE HISTORY OF ADVENT, printed pp. 24-28 (PDF pp. 40-44; PDF page = printed page + 16 on every page opened): lines 1-3, the whole Perpetuus paragraph, p. 24 to the top of p. 25, which cites the second book of Gregory of Tours' History of the Franks (Guéranger's citation; the passage is Historia Francorum X.31, see the edition notes); line 4, the Mâcon sentence, p. 25, dating the first Council of Mâcon 582; lines 5-9, the whole Greek-fast paragraph, p. 27, ending on St. Philip's Lent; lines 10-11, the p. 28 sentence carrying footnote 1 and that footnote, the translator's note on the English fast and abstinence on the Wednesdays and Fridays of Advent. These record what the book says, not the facts it reports. 11 LF-terminated lines."
