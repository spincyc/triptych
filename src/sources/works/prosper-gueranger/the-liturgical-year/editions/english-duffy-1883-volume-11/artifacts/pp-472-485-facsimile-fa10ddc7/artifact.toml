notes = "14 pages only: parent PDF pages 498-511, printed pp. 472-485, the whole chapter The Twenty-second Sunday after Pentecost (Mass) and the head of its Vespers: the note on Honorius (p. 472, note 1, Gemm. an. iv. 93) and on Rupert (note 4, De div. off. xii. 22); Collect Deus, refugium nostrum (p. 473; note 1, Berno); the note on Durandus, Rat. vi. 139 (p. 475, note 6); the comment extending the Epistle to Philippians 2:15-16, with notes citing Chrysostom, in Phil. hom. viii. 4, and Augustine, Enarr. in Ps. xciii. 5, 6 (pp. 477-478); Gradual Ecce quam bonum, Alleluia Qui timent Dominum and the Gospel Matthew 22:15-21 (p. 478); the Gospel comment, 'Tuesday in Holy Week' (p. 480, note 1), 'for it contains the first principle of all governments on earth' (p. 481); Offertory, Secret and the Communion Ego clamavi with 'The Communion-Anthem shows us with what perseverance and earnestness, the Church prays to her divine Lord. We must imitate her.' (p. 484); Postcommunion Sumpsimus and the Magnificat antiphon Reddite ergo (p. 485). Page rule: PDF page = printed page + 26. All other parent pages are omitted."
