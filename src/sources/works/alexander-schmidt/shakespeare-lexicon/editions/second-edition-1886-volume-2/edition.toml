notes = "The title page was read in the optical text registered here and gives \"SHAKESPEARE-LEXICON. A COMPLETE DICTIONARY OF ALL THE ENGLISH WORDS, PHRASES AND CONSTRUCTIONS IN THE WORKS OF THE POET. BY ALEXANDER SCHMIDT, LL. D. SECOND EDITION. VOLUME II. M-Z. 1886.\" The publisher is not legible in the optical layer and is not asserted here. The copy is a University of Toronto one, Internet Archive item shakespearelexic02schmuoft. Volume I (A-L) was not retrieved, so nothing in this run bears on the first half of the alphabet."
