context = "The whole answer, read in the retrieved page. It reports how the English versions differ at John 20:7, states that numerous Bible study sources have been checked and there is nothing about the alleged Jewish custom, that the only references seem to be internet postings and emails that appear to have originated in 2007, that table napkins as we use them were not used in Jesus' day, and that there is apparently no early rabbinic source discussing how the hands were dried after washing."
notes = "Several sentences of this page track the TruthOrFiction assessment closely, including the 2007 estimate and the hand-drying observation, which itself restates a point made in David Bivin's 2006 response. Consuming publications treat the page as a witness to transmission rather than as independent evidence."
