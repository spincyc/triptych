notes = "Bounded constituent of the six core prayers of the Anaphora of St. James (Preface, Sanctus, Post-Sanctus, Institution Narrative, Anamnesis, and Epiclesis) in Classical Syriac (syr), reading the right-hand Syriac column on bilingual Syriac/Garshuni pages (PDF 135, 136, 139, 140 L1) and full-width Syriac on monolingual pages (PDF 136 bottom, 138, 140), excluding the scan-degraded red-ink opening Dialogue line on PDF 135, the Crucifixion engraving plate at PDF 137, Garshuni columns, rubrics, and post-epiclesis diptychs."
