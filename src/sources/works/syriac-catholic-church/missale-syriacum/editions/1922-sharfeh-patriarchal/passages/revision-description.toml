context = "The editor describes correction of the James anaphora against older codices and Greek; selection, insertion and removal of anaphoras; replacement of the fraction formula; restored entrance prayers; replacement of an 1843 presanctified compilation; Arabic text beside Syriac; and additions to rubrics and celebrant prayers. The account identifies seven anaphoras by including John the Evangelist alongside James, the Twelve Apostles, Basil, Mark, Eustathius and Cyril. Its attributions and assessments of earlier material remain the editor's claims."
notes = "The verification establishes what these four Latin pages say. It does not independently collate the native liturgical texts, authenticate the manuscripts cited by the editor, or establish every claimed difference from the 1843 edition. Evidence level for resulting change claims is primary-description, not text-collated."
