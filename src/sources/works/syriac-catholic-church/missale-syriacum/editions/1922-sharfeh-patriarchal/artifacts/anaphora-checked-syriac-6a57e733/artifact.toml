transformation = "Pure consonantal Classical Syriac Unicode (U+0710..U+072C, UTF-8 NFC) with single ASCII spaces between words and single LF (\\n) line endings, one canonical liturgical unit per line.; All West Syriac vowel points, seyame (U+0308), qushshaya/rukkakha, punctuation marks, liturgical crosses, kashidas, catchwords, running heads, signature marks, and page numbers are omitted for scan-safe cross-edition diffing.; Rubrics (red or black stage directions), speaker labels (priest/deacon/people, including abbreviated ܟܗ̄), editorial 'etc.' cues (ܘܫܪ / ܗܟܢܐ), silent/intervening rubrical cues, non-text plates, blank leaves, and parallel Garshuni/Arabic columns are excluded.; Printed historical orthography, abbreviations (such as ܩܕ for ܩܕܝܫܐ, ܩܘܪܝ for ܩܘܪܝܐܠܝܣܘܢ, and abbreviated Sanctus/Anamnesis incipits), omissions, and additions are preserved verbatim without harmonizing or supplying words from memory."
notes = "Bounded constituent of the exact same six aligned core units of the Anaphora of St. James (Preface, Sanctus, Post-Sanctus, Institution Narrative, Anamnesis, and Epiclesis) in Classical Syriac (syr), enabling a direct 1843 vs 1922 Syriac Catholic visual diff; reads right-hand Syriac column on bilingual pages (PDF 246, 245) and full-width Syriac on monolingual pages (PDF 245 bottom, 244 L1, 241, 240, 239), excluding Dialogue, parallel Garshuni, red rubrics, blank page PDF 243, and Crucifixion engraving plate PDF 242."
