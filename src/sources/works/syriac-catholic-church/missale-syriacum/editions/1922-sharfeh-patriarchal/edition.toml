authority = "Ignatius Ephrem II Rahmani, Patriarch of Antioch of the Syrians, addresses the patriarchate at printed pp. 3–4 (PDF pages 8–9). His decree, dated Beirut, 8 December 1922, prescribes this edition alone as authentic throughout his patriarchate and wherever its rite is observed. This is a historical prescription, not a claim of present-day authorization."
jurisdiction = "Syriac Catholic Church"
notes = "Latin title and imprint at PDF page 6; Syriac title at PDF page 339. The catalogue's native title is Ketābā de-taksā de-qūrrābā. The book has Syriac and Arabic liturgical material and Latin front matter. The Latin editorial account at printed pp. 12–15 (PDF pages 17–20) identifies corrections, anaphora selection, restorations, Arabic presentation and rubrical additions. These are the edition's own descriptions, not an independently collated before-and-after text. The 1881 Mosul auxiliary diaconicon is not silently treated as this altar book's predecessor. Catalogue extent: 15, 282, 26 printed pages; exact PDF: 343 pages. Catalogue: https://digitale-sammlungen.ulb.uni-bonn.de/content/titleinfo/3097402. No complete prayer inventory, checked transcription or full-book textual collation is claimed."
