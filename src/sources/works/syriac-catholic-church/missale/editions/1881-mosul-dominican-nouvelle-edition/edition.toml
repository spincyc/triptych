authority = "PDF page 383 carries an Arabic approbation dated 8 September 1880 whose signature identifies the archbishop of Mosul over the Syriac Catholics; below it is the Latin imprimatur of Fr. Eug. Ludovicus-Maria Lion, Archiep. Dam. Del. Ap. Catholic affiliation is established by this leaf, not inferred solely from the Dominican printer."
jurisdiction = "Syriac Catholic Church liturgical tradition"
notes = "Syriac and Arabic title at PDF page 386; French title at page 388; approval at page 383 and preceding Arabic text at page 384. Catalogue extent 384 printed pages; exact PDF has 391 pages. Sampled body leaves interleave Syriac text and Arabic rubrics; Arabic contents occur at PDF pages 5–8. French and Latin are title/approval languages; no complete language or prayer inventory has been collated. Nouvelle édition identifies the printing but does not establish its substantive departures from any predecessor. Catalogue: https://digitale-sammlungen.ulb.uni-bonn.de/content/titleinfo/310934. No complete textual collation or present-day liturgical authorization is claimed. Role correction, 2026-10-16: Ziadé, Dictionnaire de théologie catholique 14.2 (1941), col. 3026, identifies the 1868/1881 Service de la messe line as an early diaconicon. Directly sampled body pages contain deacon/congregation parts and priest cues (PDF 382, 375 and 365–360). This is auxiliary Eucharistic service material, not an established complete celebrant-missal state or the predecessor of the 1922 Sharfeh Missale. Full title and stable legacy IDs remain unchanged."
