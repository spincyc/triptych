description = "Syriac Catholic auxiliary Mass service and prayers for the dead, represented by the Mosul 1881 edition. Ignace Ziadé, Dictionnaire de théologie catholique 14.2 (1941), col. 3026, identifies the 1868/1881 Service de la messe as an early diaconicon for deacon/server parts. The stable legacy work ID is not a claim that this is a celebrant altar missal or the predecessor of the separate 1922 Missale Syriacum."
