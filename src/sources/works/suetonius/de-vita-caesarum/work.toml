description = "Suetonius's lives of the first twelve Caesars, written about 121. The life of Nero records that a freedman dropped the napkin to start the races in the Circus Maximus, which is the one well-attested napkin signal of classical antiquity and means begin, not I am returning. A locus is Life.chapter.section."
