description = "The posthumous collection of Charles Hamilton Sorley's poems, first published by Cambridge University Press in 1916 and reissued with additions in 1919. It contains a poem titled 'Expectans Expectavi', which is the exact Latin incipit of the Offertory antiphon of the Fifteenth Sunday after Pentecost, and which turns the psalm inside out: the psalm's speaker waited for the Lord and was heard, while Sorley's laughs, sins and chatters all day and leaves the waiting to a sanctuary he never visits. A locus is a printed page."
