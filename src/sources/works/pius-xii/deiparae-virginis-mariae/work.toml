description = "The letter of 1 May 1946 by which Pius XII asked the bishops of the world whether the bodily Assumption of the Blessed Virgin Mary could be proposed and defined as a dogma of faith, and whether they and their clergy and people desired it. Circulated in reserved form, first printed in Il Monitore Ecclesiastico in 1946, and published as an encyclical in the Acta Apostolicae Sedis in 1950. Loci are the five numbered paragraphs of the Vatican English presentation."
