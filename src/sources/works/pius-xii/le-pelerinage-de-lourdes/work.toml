description = "Pius XII's encyclical of 2 July 1957, addressed in view of the 1958 centenary of the Lourdes apparitions: it recalls his 1935 legatine pilgrimage, recounts the apparitions and the 1862 episcopal approval, rehearses the papal reception chain from Pius IX through Pius XI, and turns the centenary into a warning against materialism and a call to penance, prayer, and care for the sick. Loci are the numbered paragraphs of the Vatican English presentation (n./nn.)."
