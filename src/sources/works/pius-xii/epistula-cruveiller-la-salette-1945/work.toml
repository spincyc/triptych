description = "The letter of Pius XII, dated at the Vatican 8 October 1945, to Fr Etienne Cruveiller, Superior General of the Missionaries of Our Lady of La Salette, on the approaching centenary of the apparition. It describes the 1851 act as the apparition 'dont le proces canonique, institue en son temps par l'autorite diocesaine, s'avera favorable'; keeps the event expressly in the reported register ('ou la Madone en larmes, ainsi qu'on le rapporte, venait adjurer ses enfants'); quotes the 1852 founding mandement's phrase 'une perpetuelle memoire de l'apparition misericordieuse de Marie'; and records the decision of the French National Committee of Marian Congresses, with the assent of the Assembly of Cardinals and Archbishops of France and in agreement with Bishop Alexandre Caillot of Grenoble, to hold its fifth congress in the diocese. Published in Acta Apostolicae Sedis 38 (1946), pp. 155-156. Loci are the parts of the letter."
relations = ["work.holy-see.acta-apostolicae-sedis", "work.diocese-of-grenoble.mandement-apparition-la-salette-1851"]
