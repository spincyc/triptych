description = "The sermons of the Jesuit Claude de la Colombière (1641-1682), preached largely in England during his chaplaincy to the Duchess of York and published after his death; collected with his retreat notes and Réflexions chrétiennes in nineteenth-century editions of his Œuvres. Individual sermons are conventionally identified by title and thesis; loci in this record are given as volume and page of the printed collection cited, because the sermons are not internally numbered. The transmission history of the posthumously published sermon texts is not settled by this record."
