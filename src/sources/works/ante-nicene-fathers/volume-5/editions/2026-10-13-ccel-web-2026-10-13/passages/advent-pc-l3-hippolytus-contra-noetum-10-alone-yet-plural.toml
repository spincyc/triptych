text = "God, subsisting alone, and having nothing contemporaneous with Himself, determined to create the world. And conceiving the world in mind, and willing and uttering the word, He made it; and straightway it appeared, formed as it had pleased Him. For us, then, it is sufficient simply to know that there was nothing contemporaneous with God. Beside Him there was nothing; but He, while existing alone, yet existed in plurality. For He was neither without reason, nor wisdom, nor power, nor counsel. And all things were in Him, and He was the All."
