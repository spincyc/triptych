context = "The closing sentence of section 10 (CCEL lines 22838-22846), within the reading of 23 December: He begat the Word, Light of Light, and makes Him visible that the world might see Him and be capable of being saved."
physical_line_ranges = [[9, 9]]
text = "And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begat the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved."
