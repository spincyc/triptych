text = "Whatever things, then, the Holy Scriptures declare, at these let us look; and whatsoever things they teach, these let us learn; and as the Father wills our belief to be, let us believe; and as He wills the Son to be glorified, let us glorify Him; and as He wills the Holy Spirit to be bestowed, let us receive Him. Not according to our own will, nor according to our own mind, nor yet as using violently those things which are given by God, but even as He has chosen to teach them by the Holy Scriptures, so let us discern them."
