context = "Section 13 of Treatise IX (CCEL lines 48447-48458): waiting and patience are needful, that we may fulfil that which we have begun to be. The Office of Readings of Saturday of the first week of Advent appoints On the value of patience 13, 15."
physical_line_ranges = [[1, 4]]
text = "We must endure and persevere, beloved brethren, in order that, being admitted to the hope of truth and liberty, we may attain to the truth and liberty itself; for that very fact that we are Christians is the substance of faith and hope. But that hope and faith may attain to their result, there is need of patience. For we are not following after present glory, but future, according to what Paul the apostle also warns us, and says, \"We are saved by hope; but hope that is seen is not hope: for what a man seeth, why doth he hope for? But if we hope for that which we see not, then do we by patience wait for it.\" Therefore, waiting and patience are needful, that we may fulfil that which we have begun to be, and may receive that which we believe and hope for, according to God's own showing."
