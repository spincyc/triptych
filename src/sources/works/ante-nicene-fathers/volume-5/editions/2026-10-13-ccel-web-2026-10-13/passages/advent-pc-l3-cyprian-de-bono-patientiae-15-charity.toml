text = "Charity is the bond of brotherhood, the foundation of peace, the holdfast and security of unity, which is greater than both hope and faith, which excels both good works and martyrdoms, which will abide with us always, eternal with God in the kingdom of heaven. Take from it patience; and deprived of it, it does not endure. Take from it the substance of bearing and of enduring, and it continues with no roots nor strength."
