description = "The sixth volume of the American Ante-Nicene Fathers translation anthology, containing Gregory Thaumaturgus (including the Oration and Panegyric Addressed to Origen), Dionysius the Great, Julius Africanus, Anatolius and minor writers, Methodius, and Arnobius in nineteenth-century English translation. Its container identity remains distinct from the ancient works and translated editions printed within it."
