description = "The third volume of the American Ante-Nicene Fathers translation anthology, containing the apologetic, anti-Marcionite, and ethical works of Tertullian in nineteenth-century English translation. Its container identity remains distinct from Tertullian's Latin works and from the translated editions printed within it."
