context = "The closing sentences of V.21.1, printed page 549 (PDF page 567), within the reading of Friday of the second week: the enemy fairly vanquished by a man born of a woman, and the palm received again against death."
physical_line_ranges = [[5, 7]]
text = "For indeed the enemy would not have been fairly vanquished, unless it had been a man [born] of a woman who conquered him. For it was by means of a woman that he got the advantage over man at first, setting himself up as man’s opponent. And therefore does the Lord profess Himself to be the Son of man, comprising in Himself that original man out of whom the woman was fashioned (ex quo ea quæ secundum mulierem est plasmatio facta est), in order that, as our species went down to death through a vanquished man, so we may ascend to life again through a victorious one; and as through a man death received the palm [of victory] against us, so again by a man we may receive the palm against death."
