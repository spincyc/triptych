physical_line_ranges = [[1, 2]]
text = "For it is thus that thou wilt both controvert them in a legitimate manner, and wilt be prepared to receive the proofs brought forward against them, casting away their doctrines as filth by means of the celestial faith; but following the only true and stedfast Teacher, the Word of God, our Lord Jesus Christ, who did, through His transcendent love, become what we are, that He might bring us to be even what He is Himself."
