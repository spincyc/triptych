notes = "Collated against the page: the page prints long-suffering [in His dealings with them.] with the full stop inside the bracket, where the CCEL text has it outside; the transcription follows the page. The page prints O sweet exchange ! with printer's spaces before the exclamation marks, closed here. Footnotes 1-15 of the page are omitted; footnote 13 notes that Bossuet quotes the sentence O sweet exchange ... justify many transgressors as Justin Martyr's (Sermon on the Circumcision)."
