context = "The Epistle of Mathetes to Diognetus, chapters VIII (The miserable state of men before the coming of the Word) and IX (Why the Son was sent so late), both on printed page 28 (PDF page 46). The Office of Readings of 17 to 24 December appoints Diognetus 8.5 to 9.6 on 18 December: 8.5 begins at and no man has either seen Him; the quotation opens one clause earlier, at the start of the sentence, and runs to the end of chapter IX (so concerning clothing and food), which is 9.6."
physical_line_ranges = [[1, 17]]
text = "But such declarations are simply the startling and erroneous utterances of deceivers; and no man has either seen Him, or made Him known, but He has revealed Himself. And He has manifested Himself through faith, to which alone it is given to behold God. For God, the Lord and Fashioner of all things, who made all things, and assigned them their several positions, proved Himself not merely a friend of mankind, but also long-suffering [in His dealings with them.] Yea, He was always of such a character, and still is, and will ever be, kind and good, and free from wrath, and true, and the only one who is [absolutely] good; and He formed in His mind a great and unspeakable conception, which He communicated to His Son alone. As long, then, as He held and preserved His own wise counsel in concealment, He appeared to neglect us, and to have no care over us. But after He revealed and laid open, through His beloved Son, the things which had been prepared from the beginning, He conferred every blessing all at once upon us, so that we should both share in His benefits, and see and be active [in His service]. Who of us would ever have expected these things? He was aware, then, of all things in His own mind, along with His Son, according to the relation subsisting between them. As long then as the former time endured, He permitted us to be borne along by unruly impulses, being drawn away by the desire of pleasure and various lusts. This was not that He at all delighted in our sins, but that He simply endured them; nor that He approved the time of working iniquity which then was, but that He sought to form a mind conscious of righteousness, so that being convinced in that time of our unworthiness of attaining life through our own works, it should now, through the kindness of God, be vouchsafed to us; and having made it manifest that in ourselves we were unable to enter into the kingdom of God, we might through the power of God be made able. But when our wickedness had reached its height, and it had been clearly shown that its reward, punishment and death, was impending over us; and when the time had come which God had before appointed for manifesting His own kindness and power, how the one love of God, through exceeding regard for men, did not regard us with hatred, nor thrust us away, nor remember our iniquity against us, but showed great long-suffering, and bore with us, He Himself took on Him the burden of our iniquities, He gave His own Son as a ransom for us, the holy One for transgressors, the blameless One for the wicked, the righteous One for the unrighteous, the incorruptible One for the corruptible, the immortal One for them that are mortal. For what other thing was capable of covering our sins than His righteousness? By what other one was it possible that we, the wicked and ungodly, could be justified, than by the only Son of God? O sweet exchange! O unsearchable operation! O benefits surpassing all expectation! that the wickedness of many should be hid in a single righteous One, and that the righteousness of One should justify many transgressors! Having therefore convinced us in the former time that our nature was unable to attain to life, and having now revealed the Saviour who is able to save even those things which it was [formerly] impossible to save, by both these facts He desired to lead us to trust in His kindness, to esteem Him our Nourisher, Father, Teacher, Counsellor, Healer, our Wisdom, Light, Honour, Glory, Power, and Life, so that we should not be anxious concerning clothing and food."
