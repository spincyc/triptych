context = "Book IV, chapter XX, section 4, its last two sentences, printed page 488 (PDF page 506): the Word made a man among men to join the end to the beginning, that is, man to God. The Office of Readings appoints Against Heresies 4.20.4-5 on Wednesday of the third week of Advent."
physical_line_ranges = [[1, 2]]
text = "Now this is His Word, our Lord Jesus Christ, who in the last times was made a man among men, that He might join the end to the beginning, that is, man to God. Wherefore the prophets, receiving the prophetic gift from the same Word, announced His advent according to the flesh, by which the blending and communion of God and man took place according to the good pleasure of the Father, the Word of God foretelling from the beginning that God should be seen by men, and hold converse with them upon earth, should confer with them, and should be present with His own creation, saving it, and becoming capable of being perceived by it, and freeing us from the hands of all that hate us, that is, from every spirit of wickedness; and causing us to serve Him in holiness and righteousness all our days, in order that man, having embraced the Spirit of God, might pass into the glory of the Father."
