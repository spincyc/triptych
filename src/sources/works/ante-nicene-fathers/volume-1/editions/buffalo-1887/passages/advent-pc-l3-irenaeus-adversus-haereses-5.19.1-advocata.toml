context = "Book V, chapter XIX (A comparison is instituted between the disobedient and sinning Eve and the Virgin Mary, her patroness), section 1 from its second sentence, printed page 547 (PDF page 565), where the chapter heading and section 1 stand. The Office of Readings appoints Against Heresies 5.19.1; 20.2; 21.1 on Friday of the second week of Advent."
physical_line_ranges = [[1, 4]]
text = "For just as the former was led astray by the word of an angel, so that she fled from God when she had transgressed His word; so did the latter, by an angelic communication, receive the glad tidings that she should sustain (portaret) God, being obedient to His word. And if the former did disobey God, yet the latter was persuaded to be obedient to God, in order that the Virgin Mary might become the patroness (advocata) of the virgin Eve. And thus, as the human race fell into bondage to death by means of a virgin, so is it rescued by a virgin; virginal disobedience having been balanced in the opposite scale by virginal obedience. For in the same way the sin of the first created man (protoplasti) receives amendment by the correction of the First-begotten, and the coming of the serpent is conquered by the harmlessness of the dove, those bonds being unloosed by which we had been fast bound to death."
