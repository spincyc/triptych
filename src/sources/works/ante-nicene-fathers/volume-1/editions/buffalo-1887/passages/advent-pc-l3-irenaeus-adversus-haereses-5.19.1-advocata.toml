notes = "The CCEL text agrees in wording and pointing; collated against the page. The parenthesized Latin words (portaret), (advocata) and (protoplasti) are italic on the page; italics omitted. The page's footnote 6 says the word patroness is ambiguous and that the Latin may stand for Greek antilepsis, one called in to help, or to take hold of the other end of a burden: Mary as the counterpart or balance of Eve."
