context = "The opening of III.22.4, printed page 455 (PDF page 473): Mary obedient, Eve disobedient, each the cause (of death, of salvation) to herself and to the whole human race. Not an Advent Office reading appointment; it stands beside the appointed V.19.1 (Friday of the second week) and III.20.2-3 (19 December)."
physical_line_ranges = [[1, 2]]
text = "In accordance with this design, Mary the Virgin is found obedient, saying, “Behold the handmaid of the Lord; be it unto me according to thy word.” But Eve was disobedient; for she did not obey when as yet she was a virgin. And even as she, having indeed a husband, Adam, but being nevertheless as yet a virgin (for in Paradise “they were both naked, and were not ashamed,” inasmuch as they, having been created a short time previously, had no understanding of the procreation of children: for it was necessary that they should first come to adult age, and then multiply from that time onward), having become disobedient, was made the cause of death, both to herself and to the entire human race; so also did Mary, having a man betrothed [to her], and being nevertheless a virgin, by yielding obedience, become the cause of salvation, both to herself and the whole human race."
