notes = "The CCEL text agrees in wording; it was collated against the page. Doubtful marks: the page image at 200 dpi was read as saved them, because and Wretched man that I am, who (commas), as the CCEL text has them. Footnote 10 of the page notes that the construction and sense of the opening of section 3 are disputed (the translators follow Massuet); footnote 9 that the punctuation and exact meaning of [being] the Word of God who dwelt in man are very uncertain."
