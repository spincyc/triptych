context = "Book III, chapter XX (God showed Himself, by the fall of man, as patient, benign, merciful, mighty to save), sections 2 (from its sentence For the glory of man [is] God) and 3 whole, printed page 450 (PDF page 468). The Office of Readings appoints Against Heresies 3.20.2-3 on 19 December; the AELF Office of that day runs to the sign of Emmanuel and we must be saved, which this quotation covers."
physical_line_ranges = [[1, 6]]
text = "For the glory of man [is] God, but [His] works [are the glory] of God; and the receptacle of all His wisdom and power [is] man. Just as the physician is proved by his patients, so is God also revealed through men. And therefore Paul declares, “For God hath concluded all in unbelief, that He may have mercy upon all;” not saying this in reference to spiritual Æons, but to man, who had been disobedient to God, and being cast off from immortality, then obtained mercy, receiving through the Son of God that adoption which is [accomplished] by Himself. For he who holds, without pride and boasting, the true glory (opinion) regarding created things and the Creator, who is the Almighty God of all, and who has granted existence to all; [such an one,] continuing in His love and subjection, and giving of thanks, shall also receive from Him the greater glory of promotion, looking forward to the time when he shall become like Him who died for him, for He, too, “was made in the likeness of sinful flesh,” to condemn sin, and to cast it, as now a condemned thing, away beyond the flesh, but that He might call man forth into His own likeness, assigning him as [His own] imitator to God, and imposing on him His Father’s law, in order that he may see God, and granting him power to receive the Father; [being] the Word of God who dwelt in man, and became the Son of man, that He might accustom man to receive God, and God to dwell in man, according to the good pleasure of the Father. On this account, therefore, the Lord Himself, who is Emmanuel from the Virgin, is the sign of our salvation, since it was the Lord Himself who saved them, because they could not be saved by their own instrumentality; and, therefore, when Paul sets forth human infirmity, he says: “For I know that there dwelleth in my flesh no good thing,” showing that the “good thing” of our salvation is not from us, but from God. And again: “Wretched man that I am, who shall deliver me from the body of this death?” Then he introduces the Deliverer, [saying,] “The grace of Jesus Christ our Lord.” And Isaiah declares this also, [when he says:] “Be ye strengthened, ye hands that hang down, and ye feeble knees; be ye encouraged, ye feeble-minded; be comforted, fear not: behold, our God has given judgment with retribution, and shall recompense: He will come Himself, and will save us.” Here we see, that not by ourselves, but by the help of God, we must be saved."
