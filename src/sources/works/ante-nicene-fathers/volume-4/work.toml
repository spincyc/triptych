description = "The fourth volume of the American Ante-Nicene Fathers translation anthology, containing Tertullian's ascetic and disciplinary works (including On Modesty, On Fasting, On Monogamy, To His Wife, On the Apparel of Women, On the Veiling of Virgins, and On Exhortation to Chastity) together with Minucius Felix, Commodian, and Origen. Its container identity remains distinct from the ancient works and translated editions printed within it."
