description = "The ninth volume of the American Ante-Nicene Fathers series, edited by Allan Menzies as a supplement to the original eight, containing recently recovered early Christian texts, John Keith's translation of the Clementine epistles, and John Patrick's translation of Origen's commentaries on Matthew and John. Its container identity remains distinct from the works and translated editions printed within it."
