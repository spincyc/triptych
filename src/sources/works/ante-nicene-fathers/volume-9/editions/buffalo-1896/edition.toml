notes = "Catalog-level record created 2026-07-25 from the volume identity as republished at CCEL and mirrored at New Advent, which attributes its First Clement text to Keith and its Origen commentary text to Patrick in this volume. Origen's Commentary on Matthew survives only in part in Greek and in a separate Latin series; this volume prints the surviving Greek books in translation. No exact artifact has been registered; publications consulting web transcriptions of this edition record their own access routes and limits locally."
