description = "The chanted texts of the Roman Missal, third typical edition, set to music by ICEL and published free by ICEL on its own site. It is a distinct publication and not the Missal: the notice ICEL prints on every page of it claims \"the English translation AND CHANTS of The Roman Missal\", so the melodies are ICEL's composition standing beside ICEL's translation. Its contents are the sung Order of Mass, every Preface of the Missal including those of the Eucharistic Prayers for Reconciliation and for Various Needs, Eucharistic Prayers I to IV with the proper Communicantes and Hanc igitur, the ritual chants of Holy Week including all ten Good Friday Solemn Intercessions and both forms of the Exsultet, the presidential and reading tones, and organ accompaniments to the principal chants. Registered because it is the rightsholder's own copy of a large part of the Missal's English, and nothing establishes exactness better than that."
