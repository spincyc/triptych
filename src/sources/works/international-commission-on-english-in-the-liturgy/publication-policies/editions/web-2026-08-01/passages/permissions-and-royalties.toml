context = "Read whole on 2026-08-01. Four things are established by the page's own words. (1) The acknowledgement ICEL requires for the Missal is 'The English translation of The Roman Missal (c) 2010, International Commission on English in the Liturgy Corporation. All rights reserved.', and for a partial use 'Excerpts from the English translation of The Roman Missal (c) 2010 ...'. (2) 'Liturgical texts are made available to publishers without distinction, on a non-exclusive basis. All requests for permission should be directed to the ICEL Secretariat' at a Washington address and at permission@eliturgy.org. (3) 'Any publication produced for sale which contains ICEL translations is subject to a royalty or flat fee', and the classes named include electronic media; publications not used during liturgical celebration -- textbooks, commentaries, religious education material, private prayerbooks, recordings -- 'may be assessed a royalty or flat fee'. (4) The one royalty-free class is narrow and does not reach a public corpus: reprinting 'in a publication for use at a specific Mass or celebration of an individual congregation or institution', on four conditions, that the publication is not produced by a publishing firm, is not sold, carries the copyright notice, and follows the official editions exactly."
verified_on = "2026-08-01"
notes = "A summary page. It links a fuller booklet of Publication Policies which this project has not retrieved, so nothing here is a complete statement of ICEL's terms; it is enough to establish that permission is required, that it is sought from the Secretariat, and that no existing exception covers a freely published web corpus of the orations."
