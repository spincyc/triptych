context = """
The whole clause, read on 2026-08-21 from the retained bytes, artifact page 26,
printed page 25, under the heading "Use of ICEL Materials on Global Computer
Networks". It is the last item of the appendix and the last page of the booklet.

Operational summary, deliberately not a transcription: the clause conditionally
addresses ICEL-owned material that has received conference approval, Holy See
recognition, and promulgation. It limits the route to a no-fee non-commercial
Internet site, requires the appropriate acknowledgement at the first and last
displaying frames and exact wording, excludes other publication forms and any
implication of affiliation or endorsement, and reserves modification,
termination, and enforcement. The exact wording remains only in the remote
official PDF identified and hashed by this passage.

Four facts are established per text before the clause reaches it, and they are
facts about that text and never inferences from the book it is printed in: that
it is ICEL's own, approved by the Conferences of Bishops, recognised by the Holy
See, and promulgated for use. A provisional, Green Book or Gray Book text is
outside the clause by its own terms.

Condition (2) points away from this booklet for the wording of the
acknowledgment. Take that wording from ICEL's current copyright page and from
the notice ICEL itself prints on the file the text was read out of, not from the
Part Three examples at artifact pages 19-20, which give the Commission's older
corporate title.
"""
verified_on = "2026-08-21"
notes = "The clause the summary page at icelweb.org/copyright.htm does not carry. A reader who checks that page and stops concludes no web permission exists; the sibling passage permissions-and-royalties on edition web-2026-08-01 is that reading, made when this booklet had not been retrieved, and should be read beside this one rather than instead of it."
