notes = "Migne prints the work in four books under the title Hexaemeron, preceded by Bede's letter to Acca. The printing marks no chapter and no verse anywhere: every paragraph simply opens with the Vulgate lemma it is about, which is what bounds each fragment here. No public-domain English translation exists: C. B. Kendall's, Translated Texts for Historians 48, 2008, is the first and is in copyright, so the work is held in Latin only and the site says so."
