text = """
Cumque coepissent homines multiplicari super terram et filias procreassent, videntes filii Dei filias eorum quod essent pulchrae, acceperunt sibi uxores ex omnibus quas elegerant. Homines dicit progeniem Cain, quae a divinae voluntatis intuitu aversa, humanis solummodo negotiis animum subjugaverat: filios vero Dei, eos qui de prosapia Seth generati, exemplo paternae devotionis servitium quod Deo debebant inviolata mente servabant. Qua distinctione et Dominus in Evangelio discipulos suos a caeterorum comparatione discrevit, dicens: Quem dicunt homines esse filium hominis (Matth. XVI, 13)? Et accepto eorum responso, vos vero, inquit, quem me esse dicitis? videlicet eminentiores eos hominibus volens intelligi, et in eorum numero computandos, de quibus ipse ait: Ego dixi, dii estis, et filii Excelsi omnes (Psal. LXXXI, 6). Quidam Codices pro filiis Dei habent angelos Dei, quod in eadem utique significatione accipitur. Angeli quippe Dei recte appellantur homines justi, qui juxta modum suae capacitatis angelicam in terris agere vitam curant: qualibus dicit Apostolus: Vos autem fratres non estis in carne, sed in spiritu (Rom. VIII, 9). Et iterum: Nostra autem conversatio in coelis est (Phil. III, 20). Videtur ergo quia generatio stirpis Seth, quandiu cum progenie Cain non est commixta, illibatam suae castitatis normam servaverit; at postquam in concupiscentiam lapsa nequam feminarum maledictae se soboli conjunxit, tunc et ipsa vitiato sobriae mentis decore, maledictionis ejus coeperit existere consors. Denique in lege diligenter ac sedulo praecipitur filiis Israel, ne cum alienigenis misceant connubia, ne seducat, inquiens, filia ejus filium tuum, et sequantur deos eorum (Deut. VII, 4).\
"""
