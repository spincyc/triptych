text = """
Creavitque Deus cete grandia et omnem animam viventem atque motabilem, quam produxerant aquae in species suas, et omne volatile secundum genus suum. Nullum igitur genus exceptum est, ubi cum cetis grandibus creata est omnis anima vivens eorum quae produxerant aquae in species diversas, hoc est, et reptilium, et natatilium, et volatilium; sed et eorum quae nullo aptae incessui fixa cautibus inhaerent, ut sunt plurima concharum genera. Quod autem dictum, et volatile super terram sub firmamento coeli, nihil rationi veritatis obsistit, quia nimirum, etsi immenso interjacenti spatio sub sidereo tamen coelo volant aves quae super terram volant, quomodo etiam nos homines in terra positi, sub coelo ac sole esse constituti veraciter et recte dicimur, attestante Scriptura, quae ait: Qui erant in Jerusalem habitantes Judaei, viri religiosi, ex omni natione quae sub coelo est (Act. II, 5); et: Quid habet amplius homo de universo labore suo quo laborat sub sole (Eccle. I, 3). Sane juxta aliam translationem movet nonnullos quod dictum est: Et volatilia volantia secus firmamentum coeli, id est, juxta firmamentum coeli. Sed intelligendum est, quod ideo dictum sit volare aves sub firmamento coeli, quia hoc nomine etiam aether indicetur, hoc est, superius illud aeris spatium quod a turbulento hoc et caliginoso loco in quo aves volant usque ad astra pertingit, et esse tranquillum prorsus ac luce plenum non immerito creditur. Nam et errantia sidera septem, quae in hoc aetheris spatio vaga ferri perhibentur, Scriptura in firmamento coeli esse posita dixit. Ideoque aves recte dicuntur secus firmamentum coeli volare, quia vicina sunt, ut diximus, aetheri turbulenta haec aeris spatia, quae volatus avium sustinent. Nec mirandum si aether firmamentum coeli nominetur, cum aer appellatur coelum, ut supra docuimus. Nec praetereundum quod cum creasse diceretur Deus omnem animam viventem, additum est, atque mortabilem, ad distinctionem videlicet hominis quem facturus erat ad imaginem et similitudinem suam, ita ut si ejus praecepta servaret, perpetua viveret incommutabilitate beatus. Nam animantia caetera, ita sunt prima mox conditione facta, ut vel alia aliis in alimoniam cederent vel ipsa suo senio deficientia perirent.\
"""
