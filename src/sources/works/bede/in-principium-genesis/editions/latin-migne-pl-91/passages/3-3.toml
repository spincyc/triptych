« Filii autem Javan Elisa et Tarcis, Cethim et Dodanim. De Ionibus, id est, Graecis nascuntur Elisae, qui vocantur Elides, unde et quinta lingua Graeciae Eolis appellatur, quam illi penten dialecton vocant. Tharses Josephus Cilicas arbitratur, Thar aspirationis litteram vitiose a posteris in Tar dicens fuisse corruptam; unde et metropolis eorum civitas Tarsis appelatur, Paulo apostolo gloriosa. (Nonnulli Tharsis unde aurum Salomoni deferebatur Indiae putant esse regionem.) Cethim Cethi a quibus usque hodie urbs Cyptotium nominatur. Dodanim Rhodii, melius enim legitur Rodanim, sive Rodim, ut septuaginta Interpretes transtulerunt, » et in libro Hebraeorum nominum etiam noster interpres posuit. Similitudo enim litterarum Daleth et Res hunc apud Hebraeos saepe facit errorem, ut alia legatur pro alia. Est autem Rhodus Cycladarum maxima, et in Ionio mari quondam urbs potentissima, navalique certamine gloriosa, et propter tutissimum portum mercatorum omnium receptaculum\
"""
