Et praesit piscibus maris et volatilibus coeli, et bestiis, universaeque terrae, omnique reptili quod movetur in terra; quia nimirum in hoc maxime factus est homo ad imaginem Dei, in quo irrationabilibus antecellit: capax videlicet rationis conditus, per quam et creata quaeque in mundo recte gubernare, et ejus qui cuncta creavit posset agnitione perfrui. In quo honore positus, si non intellexerit ut bene agat, eisdem ipsis animantibus insensatis, quibus praelatus est, comparabitur, sicut Psalmista testatur (Psal. XLVIII, 13).\
