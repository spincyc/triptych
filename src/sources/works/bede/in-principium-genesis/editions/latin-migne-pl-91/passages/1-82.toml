text = """
Ejecitque Adam, et collocavit ante paradisum voluptatis cherubim et flammeum gladium atque versatilem ad custodiendam viam ligni vitae. Hunc locum antiqua translatio sic habet: Et ejecit Adam, et collocavit eum contra paradisum voluptatis, et ordinavit cherubim et flammeam rompheam, etc. « Quam si sequimur, et hoc significandi gratia factum credere debemus, sed tamen factum, ut contra paradisum, quo beata vita etiam spiritaliter significabatur, habitaret peccator utique in miseria. Quod autem dicitur collocasse Deus ante paradisum voluptatis cherubim et flammeum gladium, hoc per coelestes utique potestates in paradiso visibili factum esse credendum est, ut per angelicum ministerium esset illic ignea quaedam custodia, non tantum frustra factum esse, nisi quia significat aliquid etiam de spiritali paradiso, non est utique dubitandum: » quae etiam custodia bene versatilis esse asseveratur pro eo quod quandoque veniret tempus, ut etiam removeri potuisset. Remota est namque, Enoch: peccatoribus translato; remota, Elia in curru igneo rapto; remota omnibus electis, cum, Domino baptizato, aperti sunt ei coeli; remota item singulis electis, cum baptismi fonte lavantur; remota iisdem perfectius, cum soluti a vinculis ad coelestis paradisi gloriam suo quique tempore conscendunt. Item quia cherubim scientiae multitudo, sive scientia multiplicata interpretatur, bene cherubim et flammeus gladius ad custodiendam viam ligni vitae collocatus esse perhibetur: quia nimirum per disciplinam nobis scientiae coelestis, et per laborem afflictionum temporalium reditus ad supernam patriam patet, ex qua per stultitiam praevaricationis, perque appetitum carnalium voluptatum discessimus. Et bene non simpliciter flammam, sed dicit gladium flammeum ante paradisum esse collocatum, ut feriendas in nobis illecebras concupiscentiae temporalis insinuet gladio spiritus, quod est verbum Dei, si ad lignum vitae, qui est Christus Dominus, penetrare concupiscimus. Et bene eumdem gladium versatilem esse refert, ut indicet mystice non nobis semper hunc necessarium esse gladium, sed, ut scriptum est, tempus esse belli, tempus pacis: belli, videlicet cum in hujus vitae stadio adversum aereas potestates, vel etiam nostrae mentis aut corporis vitia certamus; pacis autem, cum perfecta victoria coronamur, ac fructu ligni vitae perpetuo sine fastidio satiamur. Quaerit autem adversarius legis et prophetarum, sed ista inquiens, arbor quae in paradiso vitae fructus ferebat cui proderat? Cui respondens S. Augustinus: Cui, inquit, nisi prius illis primis hominibus qui in paradiso fuerant constituti? Deinde istis de paradiso pro merito suae iniquitatis ejectis, mansit ad memoriam significandae spiritalis arboris vitae, quae est sapientia beatorum, cibus immortalis animarum. Utrum autem illo cibo nunc vescatur aliquis, nisi forte Enoch et Elias, non temere asseverandum puto. Ligno tamen illo vitae, quod est in spiritali paradiso, nisi alerentur animae beatorum, non pro munere pietatis et fidelissimae confessionis latronis animae credentis in Christum legeremus paradisum eodem die fuisse concessum. Amen, inquit, dico tibi hodie mecum eris in paradiso (Luc. XXIII, 43). Esse autem ibi cum Christo, hoc est esse cum vitae ligno, ipse est quippe Sapientia, de qua scriptum est: Lignum vitae est omnibus amplectentibus eam (Prov. III, 18) Amen

LIBER SECUNDUS\
"""
