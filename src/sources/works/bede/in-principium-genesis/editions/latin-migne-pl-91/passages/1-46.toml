text = """
Ibique invenitur bdoellium et lapis onychinus. Bdoellium est, ut idem Plinius scribit, arbor aromatica, colore nigro, magnitudine oleae, et folia roboris, fructu caprificis, ipsius natura quae gummis. Est autem lacryma ejus lucida, subalbida, levis, pinguis, aequaliter cerea, et quae facile molliatur, gustu amara, odoris boni, sed vino perfusa odoratior, cujus et liber Numerorum meminit, Erat autem, inquiens, man quasi semen coriandri coloris bdellii (Num. XI, 7), id est, lucidi et subalbidi. Onyx autem lapis est pretiosus, inde appellatus quod habet in se permistum candorem in similitudinem unguis humani. Graeci enim unguem onychem dicunt. Hanc et Arabia gignit, sed Indica igniculos habet, albis cingentibus zonis; Arabica autem nigra est cum candentibus zonis. Antiqua Translatio pro his habet carbunculum et lapidem prasinum. Est autem carbunculus, sicut et nomine probat, lapis ignei coloris, quo noctis quoque tenebras illustrare perhibetur. Est lapis prasinus viridantis aspectus: unde et Graece a porro, quod apud eos prason dicitur, nomen accepit.\
"""
