text = """
Dixit quoque Deus: Producat terra animam viventem in genere suo, jumenta et reptilia et bestias secundum species suas. Factumque est ita. Post radiatum sideribus coelum, post impletum volatilibus aerem, qui ob viciniam, ut diximus, coeli nomen meruit, post locupletatas suis animantibus aquas, quae et ipse aeri sunt magna naturae vicinitate conjunctae: unde et de illis sumpsit animantia, de illis imbres, nives, grandines et caetera sumit hujusmodi, consequens erat etiam terram suis animantibus, hoc est, ex se genitis impleri. Nam et ipsa praecipuam habet cognationem cum aquis, ut pote quae sine earum succo et irrigatione non solum fructificare, sed nec ipsa consistere possit, Petro attestante, qui ait: Quia coeli erant prius, et terra de aqua, et per aquam consistens Dei verbo (II Petr. III, 5). Jubet ergo producere Deus terram jumenta, et reptilia, et bestias terrae; quia vero nomine bestiarum omne quidquid ore vel unguibus saevit, exceptis serpentibus, constat esse comprehensum, nomine autem reptilium terrae etiam serpentes continentur, nomine vero jumentorum ea quae in usu sunt hominum animalia designantur. Ubi ergo conditio describitur caeterorum animalium quadrupedum, verbi gratia, cervorum, caprearum, bubalorum et caprorum caeterorumque hujusmodi, nisi forte et haec ob ferocitatem indomitae mentis inter bestias esse adnumerata dixerimus, juxta antiquam sane translationem, in qua scriptum est: Ejiciat terra animam vivam secundum genus, quadrupedia, et reptilia, et bestias terrae, nihil omnino quaestionis est, quia videlicet nomine quadrupedum cuncta comprehensa, sunt quae exceptis bestiis et reptilibus, terra produxit, sive quae sub cura humana, seu quae sunt fera et agrestia.\
"""
