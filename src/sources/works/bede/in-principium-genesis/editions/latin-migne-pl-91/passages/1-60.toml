physical_line_ranges = [[86, 86]]
text = """
Sed et serpens erat callidior cunctis animantibus terrae quae fecerat Dominus Deus. Potest iste serpens non irrationabili anima sua, sed alieno jam spiritu, id est, diabolico, callidior dici cunctis animantibus: quantumlibet enim praevaricatores angeli de supernis sedibus suae perversitatis et superbiae merito dejecti sint, natura tamen excellentiores sunt omnibus animantibus terrae propter rationis eminentiam. Quid ergo mirum si suo instinctu diabolus jam implens serpentem, eique suum spiritum miscens, eo more quo vates daemoniorum impleri solent, callidissimum eum reddiderat omnium animantium terrae; sive, ut alia editio habet, sapientissimum bestiarum secundum animam vivam irrationabilemque viventium? « Si ergo quaeritur cur Deus tentari permiserit hominem, quem tentatori consensurum esse praesciebat; occurrit ratio vera, non magnae laudis futurum fuisse hominem, si propterea posset bene vivere, quia nemo male vivere suaderet, cum et in natura posse, et in potestate haberet velle non consentire suadenti, adjuvante tamen illo qui superbis resistit, humilibus autem dat gratiam. Nec arbitrandum est, quod esset hominem dejecturus tentator iste, nisi praecessisset in anima hominis quaedam elatio comprimenda, ut per humiliationem peccati quam de se falso praesumpserat, disceret verissime: quippe dictum est: Ante ruinam exaltatur cor, et ante gloriam humiliatur (Prov. XVI, 18)? Sic autem quidam moventur de hac primi hominis tentatione, quod eam fieri permiserit Deus quasi nunc non videant universum genus humanum diaboli insidiis sine cessatione vexari, cur et hoc permisit Deus? an quia probatur et exercetur virtus et est palma gloriosior non consensisse tentatum quam non potuisse tentari. Si autem quaeritur cur potissimum per serpentem diabolus tentare permissus sit, jam hoc significandi gratia factum est, non quo diabolus aliquid ad structionem nostram significare voluerit, sed cum accedere ad tentandum non posset, nisi permissus, neque per aliud posset, nisi per quod permittebatur, accedere. Quidquid igitur serpens ille significavit, ei providentiae tribuendum est sub qua et ipse diabolus suam quidem habet cupiditatem nocendi, facultatem autem non nisi quae datur vel ad subvertenda ac perdenda vasa irae, vel ad humilianda sive probanda vasa misericordiae. Non itaque serpens verborum sonos intelligebat, qui ex illo fiebant ad mulierem: neque enim conversa credenda est anima ejus in naturam rationalem, quando nec ipsi homines, quorum rationalis natura est, cum daemon in eis loquitur ea passione cui ab exorcista requiritur, nesciunt quid loquantur: quanto minus ille intelligeret verborum sonos, quos per eum et ex eo diabolus illo modo faciebat qui hominem loquentem non intelligeret, si eum a diabolica passione immunis audiret. »\
"""
