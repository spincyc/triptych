text = """
Prius autem quam irent cubitum, viri civitatis vallaverunt domum, a puero usque ad senem, omnis populus simul; vocaveruntque Lot, et dixerunt ei: Ubi sunt viri qui introierunt ad te nocte; educ illos huc, ut cognoscamus eos, etc. Hoc est quod propheta Isaias de populo Israel supra modum peccante ait: Peccatum suum sicut Sodoma praedicaverunt nec absconderunt (Isai. III, 9). Peccatum quippe suum sicut Sodomitae praedicaverunt, nec absconderunt, cum absque respectu pudoris alicujus omnes a puerili aetate usque ad ultimam senectutem masculi in masculos turpitudinem operari solebant, adeo ut ne hospitibus quidem ac peregrinis sua scelera abscondere, sed et hos, vim inferendo, suis similes facere sceleribus atque suis facinoribus implicare contenderent.\
"""
