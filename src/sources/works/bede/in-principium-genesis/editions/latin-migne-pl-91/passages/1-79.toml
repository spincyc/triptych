text = """
Fecitque Dominus Deus Adae et uxori ejus tunicas pellicias, et induit eos. Et hoc significationis gratia factum est, sed tamen factum. Nam hujusmodi indumento Dominus eos mortales jam factos fuisse insinuat; pelles quippe, quae non nisi mortuis pecudibus subtrahuntur, mortis figuram continent. Ita cum contra praeceptum non imitatione legitima, sed illicita superbia Deus esse appetit homo, usque ad belluarum mortalitatem dejectus est. Et quidem ipsi sibi fecerant perizomata de foliis fici, quibus pudenda tegerent: sed Deus facit illis tunicas pellicias, quibus omne corpus illorum induat: quia ipsi, perdita per praevaricationem gloria innocentiae, praetenderunt sibi velamen excusationis, quo suam culpam in Conditorem transfunderent: et ipse Conditor illos per sententiam justi judicii, ablato statu vitae immutabilis, in anima simul et carne mulctavit poena mortalitatis. Narrat autem Evangelica parabola quia pius pater revertenti ad se per poenitentiam filio luxurioso inter alia munera etiam stolam primam proferri, et eum indui praecepit, mystice insinuans quod electi habitum immortalitatis, quem in Adam in exordio saeculi perdiderunt, in fine saeculi sint recepturi in Christo, et quidem ampliori gratia. Nam Adam ita immortalis factus est, ut posset non mori, si praeceptum servaret: filii autem resurrectionis ita erunt immortales, ut nec mori unquam, nec metu mortis possint affici. De cujus receptione stolae dicit Apostolus: Oportet enim corruptibile hoc induere incorruptionem, et mortale hoc induere immortalitatem (I Cor. XV, 53): ubi induere sonat, ablatam utique significat nuditatem, quam Adam in se et Eva post peccatum agnitam erubescebant.\
"""
