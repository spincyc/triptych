text = """
In principio creavit Deus coelum et terram. Creationem mundi insinuans Scriptura divina, apte primo statim verbo aeternitatem atque omnipotentiam Dei creatoris ostendit. Quem enim in principio temporum mundum creasse perhibet, ipsum profecto ante tempora aeternaliter exstitisse designat. Et quem ipso conditionis initio coelum et terram creasse narrat, in tanta celeritate operationis omnipotentem esse declarat cui voluisse fecisse est. Nam humana fragilitas cum aliquid operatur; verbi gratia, cum domum aedificamus, in principio operis materiam praeparamus, et post hoc principium fodimus in altum, deinde immittimus lapides in fundamentum, deinde parietes augescentibus lapidum ordinibus apponimus, sicque paulatim ad perfectionem operis propositi proficiendo pervenimus. Deus autem cujus omnipotens manus est ad explendum opus suum, non eguit mora temporum, quia scriptum est: Omnia quaecunque voluit fecit (Psal. CXIII, 3). Unde beneplacitum est, quia in principio creavit Deus coelum et terram, ut aperte detur intelligi quod utrumque simul a Deo factum est, quamvis utrumque simul ab homine dici non possit. Denique dicit propheta: Initio terram tu fundasti, Domine (Psal. CI, 26). Hic autem Dominus, in principio coelum et terram creasse narratur; unde liquido colligitur quia factura est utriusque elementi pariter expleta, et hoc tanta velocitate divinae virtutis, ut necdum primum mundi nascentis momentum esset transcensum.

Potest autem non improbabiliter intelligi in principio fecisse Deum coelum et terram in Unigenito Filio suo, qui interrogantibus se Judaeis, quid eum credere deberent, respondit: Principium quod et loquor vobis (Joan. VIII, 25). Quia in ipso, ut ait Apostolus (Colos. I, 16), condita sunt omnia in coelis et in terra. Sed diligenter intuendum, ut ita quisque sensibus allegoricis studium impendat, quatenus apertam historiae fidem allegoriando non derelinquat.

Quod autem vel quale sit coelum, quod in principio cum terra factum est, sequentibus verbis insinuatur cum dicitur.\
"""
