text = """
Et ex illa dabo tibi filium cui benedicturus sum, eritque in nationes, et reges populorum orientur ex eo. Signanterque non ut in Graeco legimus: dixit Deus ad Abraham, Sarai uxor tua non vocabitur Sarai; in Hebraeo habetur non vocabis nomen ejus Sarai; id est, non dices ei Princeps mea es: futura quippe omnium gentium jam princeps esse, unde et Apostolus Petrus mulierum vitam instituens ait: Sic enim aliquando et sanctae mulieres, sperantes in Domino, ornabant se subjectae propriis viris, sicut Sara obediebat Abrahae dominum eum vocans; cujus estis filiae benefacientes, et non perturbationem timentes ullam (I Petr. III, 5).\
