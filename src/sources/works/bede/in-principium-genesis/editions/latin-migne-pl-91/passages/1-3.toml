physical_line_ranges = [[13, 13]]
text = """
Et dixit Deus: Fiat lux, et facta est lux. Congruit operibus Dei, ut mundi ornatum a luce incipiat: qui cum ipse sit lux vera, lucemque habitet inaccessibilem, cujus beatissima visione mox creati in coelis coelorum angeli jam perfrui coeperant, apte huic quoque saeculo ornando primam materialis gratiam lucis donavit, ut esset unde caetera quae crearet apparerent. Quod autem dixisse Deus, sive ut lux fieret, sive ut alia quaeque, perhibetur, non nostro more per sonum vocis corporeum credendus est, sed altius intelligendum dixisse Deum ut fieret creatura, quia per Verbum suum omnia, id est, per unigenitum Filium fecit: de quo manifestius evangelista Joannes: In principio, inquit, erat Verbum et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in principio apud Deum, omnia per ipsum facta sunt (Joan. I, 1). Quod ergo ait Joannes, omnia facta sunt per Verbum Dei, hoc est, quod Moyses ait, quia dixit Deus: Fiat lux; dixit: Fiat firmamentum; dixit: Fiat et caetera creatura. Hoc quod psalmus adjuncta Spiritus sancti persona dicit: Verbo Domini coeli firmati sunt et Spiritu oris ejus omnis virtus eorum (Psal. XXXII, 6). Si autem quaeritur quibus in locis, jubente Deo, facta sit lux, cum adhuc abyssus omnem terrae amplitudinem contegeret, patet profecto quia in superioribus ejusdem terrae partibus, quas et nunc diurna solis lux illustrare consuevit, tunc principalis illa lux emicuit. Nec mirandum nobis divina operatione lucem in aquis posse resplendere, cum et hominum operatione constet eas saepius illustrari, nautarum videlicet, qui in profundo maris demersi, emisso ex ore oleo, perspicuum sibi hoc ac lucidum reddunt. Si enim homo talia per oleum sui oris potest, quantum Deus per Spiritum oris sui creare posse credendus est, praesertim cum multo rariores quam modo in terris videre solemus, aquae in principio fuisse factae credendae sint, priusquam in locum essent unum, ut appareret arida, congregatae.\
"""
