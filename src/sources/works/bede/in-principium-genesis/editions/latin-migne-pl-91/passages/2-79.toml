text = """
Haec quoque dixit Deus ad Noe et ad filios ejus cum eo: Ecce ego statuam pactum meum vobiscum, et cum semine vestro post vos, et caetera usque ad id quod ait: Et nequaquam interficietur ultra omnis caro aquis diluvii; neque erit deinceps diluvium dissipans terram. Patet litterae sensus, quia non ultra timendum est mundo judicium aquae, sed ignis, crebraque repetitione redarguitur ac damnatur haeresis Origenis, qui revolutiones saeculorum infinitorum eodem ordine semper currentium, dogmatizare praesumpsit. Mystice autem non reditura in terram aqua diluvii significat quod aqua baptismi semel accepta non valet repeti; qui enim lotus est, non indiget ut lavet, ut Dominus ipse testatur (Joan. XIII, 10), quique aquis tribulationum semel abluti ad salutem pervenere perpetuam, nequaquam ultra iisdem aquis purgandi immittuntur, sed laeti in aeternum suo Redemptori cantabunt: Transivimus per ignem et aquam, et induxisti nos in refrigerium (Psal. LXV 12). Neque vero significatione lavacri salutaris debet contrarium videri quod de aquis diluvii supra dicitur: Nequaquam ultra maledicam terrae propter homines; vel quod hic dicitur: Neque erit diluvium deinceps dissipans terram, cum aqua baptismi nequaquam maledictionem vel dissipationem nostrae mentis, sive carnis, sed benedictionem potius et sospitatem soleat conferre; sed intelligendum quia priscae nostrae conversationi Dominus quodammodo maledicat in baptismo, et hanc dissipet cum abrenuntiare nos diabolo et omnibus operibus ejus ac pompis praecipiat; ac sic demum nova confessione mundati ad benedictionis aeternae gratiam mereamur attingere.\
"""
