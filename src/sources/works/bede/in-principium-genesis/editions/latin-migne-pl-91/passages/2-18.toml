text = """
Egressusque Cain a facie Domini habitavit in terra profugus ad orientalem plagam Eden. In facie Domini agnitio ejus, qua se manifestat ac dignoscitur, solet intelligi. Merito ergo populus, qui a divinae cognitionis gratia recessit, in terra habitare perhibetur. Non enim potest dicere cum electis: Nostra autem conversatio in coelis est: unde etiam Salvatorem exspectamus Dominum nostrum Jesum Christum (Philip. III, 20). Hunc locum LXX Interpretes ita transtulere: Exiit autem Cain a facie Domini Dei, et habitavit in terra Naid contra Eden. Naid autem in profugum, sive ut in libro Hebraeorum nominum invenimus, instabilem motum et fluctuationem vertitur, quod nonnulli, quibus et Josephus consentit, locum esse in quo habitaverit Caïn, autumant. Porro noster interpres non hoc nomen loci, sed rei ipsius esse significantiam intellexit; quia Caïn instabilis semper et fluctuans atque incertarum sedium esset futurus. Quod quantum praesenti Judaeorum statui conveniat, universus testis est mundus. Qui bene etiam contra Eden habitare perhibetur. Eden quippe voluptatem sive delicias significat: quia nimirum perfidus ille populus quantum aversus a cognitione veritatis terrenis se negotiis implicat, tantum contrariam deliciis coelestibus vitam gerit; et quia temporalia solummodo gaudia sitit, torrenti voluptatis divinae, quo justi potantur, siccis faucibus cordis adversarius existit.\
"""
