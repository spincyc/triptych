text = """
Excepto quod carnem cum sanguine non comedetis. Sanguine namque carnalia desideria carnalemque sensum merito designat. Effunditur autem sanguis cum abrenuntiatur carnalibus illecebris atque cogitationibus, in quibus male vivebatur, ut possint dicere tales cum Apostolo: Vivo autem, jam non ego; vivit vero in me Christus (Gal. II, 29). Et iterum: Continuo non acquievi carni et sanguini (Gal. I, 16): alioquin qui perseverantes quosque in sceleribus pristinis unitati sanctae Ecclesiae incorporari baptizando incipit, quasi animalia sibi a Domino data cum sanguine comedit, quia in societatem recipit eos quorum adhuc conscientia conversatio prisca velut suffocata tenetur. Ferunt autem quod in hoc maxima fuerit praevaricatio gigantum, quia cum sanguine carnem comederent; ideoque Dominus illis diluvio exstinctis, carne quidem vesci homines concesserit, sed ne id cum sanguine facerent prohibuerit.\
"""
