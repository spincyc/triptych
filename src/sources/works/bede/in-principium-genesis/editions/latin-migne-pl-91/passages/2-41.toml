physical_line_ranges = [[162, 165]]
text = """
Dixit ad Noe: Finis universae carnis venit coram me, repleta est terra iniquitate a facie eorum, et ego disperdam eos cum terra. Fac tibi arcam de lignis laevigatis, etc. Multiforme in fabrica arcae ac superventu diluvii continetur mysterium. Primo quidem quod, sicut Dominus ipse ostendit per inundationem diluvii repentinam, improvisa novissimi examinis hora designatur: Et sicut factum est, inquit, in diebus Noe, ita erit et in die Filii hominis. Edebant et bibebant, uxores ducebant, et dabantur ad nuptias usque in diem qua intravit Noe in arcam. Et venit diluvium et perdidit omnes (Matth. XXIV, 38). Fabricatio enim arcae quae per centum annos agebatur, universum tempus significat hujus saeculi, quo et Ecclesia sancta construitur, atque ad finem perfectum deducitur. Nulli enim dubium quin numerus centenarius perfectionem significet, vel quia decem decadibus impletur, vel quia de sinistra transit in dextram, velut illam exprimens actionem, quae in hac quidem vita quasi in laeva exerceatur, sed in vita futura velut in dextera consumetur. Sicut autem facta arca, et illatis in eam omnibus quae erant salvanda, venit diluvium, et tulit omnia quae extra eam erant; sic ubi omnes qui praeordinati sunt ad vitam aeternam Ecclesiam intraverint, veniet finis mundi, et peribunt omnes qui extra Ecclesiam fuerint inventi; et juxta hunc sensum manifeste arca Ecclesiam, Noe Dominum qui Ecclesiam in sanctis suis aedificat, diluvium finem saeculi vel judicium designat extremum. Verum excepta arcae fabrica, etiam in eo Noe, quia requies interpretatur, et requiem daturus hominibus sive consolaturus, praesagabatur homines ab operibus et laboribus manuum suarum quiescere, in terra cui maledixit Dominus, Domini Salvatoris imaginem tenet. Ipse enim consolatur nos per illustrationem Spiritus sui, qui propterea Paracletus, id est, consolator, vocatur. Ipse eripuit nos de maledicto legis, factus pro nobis maledictum. Ipse vocat ad requiem laborantes: Venite, inquiens, ad me omnes qui laboratis et onerati estis, et ego reficiam vos. Tollite jugum meum super vos, et discite a me quia mitis sum et humilis corde, et invenietis requiem animabus vestris (Matth. XI, 28). Ipse veraciter in generationibus, id est, in omni sanctorum congregatione solus per omnia vir justus atque perfectus fuit, ut pote quia peccatum non fecit, nec inventus est dolus in ore ejus. Juxta aliam vero interpretationem aeque piam et catholicam, arca Ecclesiam, diluvium aquam baptismi, qua ipsa Ecclesia in cunctis suis membris abluitur et sanctificatur significat, juxta quod Petrus apostolus exponens ait: Quando exspectabat Dei patientia in diebus Noe cum fabricaretur arca, in qua pauci, id est, octo animae salvae factae sunt per aquam, quod et vos nunc similis formae salvos facit baptisma, non carnis depositio sordium, sed conscientiae bonae interrogatio in Deum per resurrectionem Jesu Christi (I Petr. III, 20). Quod autem ait per resurrectionem Jesu Christi nos esse in baptismate salvatos, breviter exponit quid octo animarum quae salvae factae sunt per aquam numerus mystice designet. Dies etenim dominicae resurrectionis a die quidem passionis ejus tertius, sed a die primae conditionis octavus est. Undas quoque diluvii nonnulli Patrum saepe super tentationibus hujus saeculi interpretantur, quibus sancta Ecclesia quotidie pulsatur, nec tamen superatur; quin potius ipsa tentationibus exercita magis a terrenis cupiditatibus in coelestia quaerenda sustollitur. Quidquid vero extra illam est, eisdem mundi tentationibus necatur, quemadmodum dicitur quod multiplicatae ac vehementer inundantes aquae in superficie terrae arcam quidem elevaverint in sublime a terra; quidquid vero extra arcam fuit perdiderint. Cui expositioni convenit illa Domini de duabus domibus parabola, una supra petram, alia super arenam aedificata; quae cum aequaliter pluvia, ventis et fluminibus essent pulsatae, illa quae super petram fidei fundata erat, tentationibus probata; quae vero in caducis vitae hujus delectationibus velut in arenis spem posuerat, labefactata est. Quod enim in arca structor Noe, hoc in domo fidei fundamentum petra; et quod extra arcam corrupta gigantum mens atque in terram proclivis, hoc in domo perfidiae congesta exprimit arena. Designet ergo arca Ecclesiam, designet diluvium fontem baptismi quo abluitur, designet fluctus mundi tentantis quibus probatur, designet finem in quo coronatur. Porro Noe fabricator arcae vel ipsum Dominum ac Salvatorem nostrum vel unumquemque devotum ejusdem sanctae Ecclesiae rectorem typice denuntiat.

Fac tibi, inquit, arcam de lignis laevigatis. Non solum homines qui in arca salvati sunt, sed et animantia quae eam pariter intrarunt; ipsa etiam ligna de quibus facta est fideles sanctae Ecclesiae mystice denuntiant. Ligna ergo de quibus facta est laevigata esse jubentur, quia quicunque in fabrica Ecclesiae ad fidem veniendo imponitur, necesse est ut, abscissus primo a radice priscae conversationis per eruditionem vel castigationem eorum qui in Christo praecesserunt, omne quod sibi noxiae tortitudinis ac deformitatis inesse deprehenderit eruat, atque ad regulam catholicae fidei ac veritatis tota se mente et actione componat, quatenus in ordine aedificii coelestis suo loco ac tempore novus homo creandus opportune possit imponi.

Pro lignis autem laevigatis antiqua translatio ligna quadrata posuit, quod ad eamdem electorum perfectionem aeque respicit. Ubicunque enim verteris quadratum, stabit, neque ulli poterit obnoxium esse casui. Sic nimirum, sic electorum mens, quaecunque sibi tentamenta occurrerint, inviolabilem piae intentionis statum servare meminit.

Mansiunculas in arca facies. Universae in arca mansiones ad receptacula sunt diversorum animantium quae eam erant ingressura dispositae, et in Ecclesia multi sunt ordines institutionum pro diversitate eorum qui ad fidem veniunt. Neque enim una eademque debet esse vita vel conversatio conjugatorum et continentium, peccatorum et rectorum; et huic dicitur: Si vis ad vitam ingredi, serva mandata, non homicidium facies, non adulterabis, non facies furtum, non falsum testimonium dices (Matth. XIX, 17), et caetera hujusmodi. Alteri autem: Si vis perfectus esse, vade, vende omnia quae habes, et da pauperibus (Ibid., 21). Unde etiam de ipso praemio aeternae retributionis Dominus ait: In domo Patris mei mansiones multae sunt (Joan. XIV, 2). Ergo mansiunculae sunt in arca quia non unum in Ecclesia meritum omnibus, nec idem in fide profectus est, licet omnes intra unam fidem contineantur, eodemque baptismate diluantur.\
"""
