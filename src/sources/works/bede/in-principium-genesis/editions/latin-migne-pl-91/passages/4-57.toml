physical_line_ranges = [[364, 364]]
text = """
Et eduxerunt eum posueruntque extra civitatem. Ibi locutus est ad eum: Salva animam tuam, noli respicere post tergum, nec stes in omni circa regione, sed in monte salvum te fac, ne et tu simul pereas. Generaliter quidem incendium et perditio Sodomorum, de qua ereptus est Lot, poenam ultimae districtionis designat; quando, completa in fine saeculi summa electorum, omnes impii aeternum rapientur in ignem, Domino exponente, qui ait: Similiter sicut factum est in diebus Lot, edebant et bibebant, emebant et vendebant, plantabant et aedificabant, qua die autem exivit Lot a Sodomis, pluit ignem et sulphur de coelo, et omnes perdidit. Secundum haec erit qua die Filius hominis revelabitur (Luc. XVII, 28). Cui attestatur etiam apostolus Judas dicens: Sicut Sodoma et Gomorrha et finitimae civitates, simili modo et hae fornicatae sunt, abeuntes post carnem alteram; factae sunt exemplum, ignis aeterni poenam sustinentes (Jud. VII). Potest autem idem ignis Sodomiticus etiam flammas vitiorum quibus in hac vita reprobi uruntur, atque ad sempiternum praeparantur incendium, non inconvenienter insinuare, qui cum nunc in concupiscentiis terrenis carnisque illecebris ardere non cessant, tunc igne ultionis ardere nunquam desistent. Hunc quoque sensum Domino affirmante, imo etiam docente, qui ait: In illa hora qui fuerit in tecto et vasa ejus in domo, ne descendat tollere illa; et qui in agro, similiter non redeat retro; memores estote uxoris Lot (Luc. XVII, 31). Neque enim docemur ne instante articulo ultimi examinis, culmen rectae conversationis deserentes, ad ima concupiscentiae mundialis animum deflectamus; vel ne, relicto aratro agriculturae spiritalis, retro respiciamus, quando non ultra nobis operum aliqua correctio restat, sed eorum quae operati sumus reddenda ratio instat; verum potius, imminente judicio, fidelibus haec exhortatio datur, ut coeptis bonis ac salubribus insistant, ne, vitiorum quae reliquere contagia repetentes, Lot imitentur uxorem, quae ardentem sulphure Sodomam dum incauta respiceret, versa est in statuam salis. Dum ergo nos Dominus uxorem Lot imitari prohibet, ostendit profecto quod incendium civitatis, ad quod oculos reduxerat, flammas vitiorum, quas vitare et valemus et debemus, exprimit. Unde nunc exhortatio angelorum, qua eductum de Sodomis Lot admonuerant ne retro respiceret, neque in omni circa regione consisteret, sed montem salvandus peteret, et spiritaliter intelligenda, et maxima est nobis intentione sequenda; ne videlicet ardores et incentiva vitiorum quae parumper evasisse videmur incauti repetamus, neque omnimodis in vicinia peccantium, quantum possibile est, manere consentiamus, ne illorum exemplo a nostrae via rectitudinis aberremus, juxta illud Psalmistae de beato viro: Et in via peccatorum non stetit (Psal. I, 1), sed ad fastigium arduae conversationis conscendere ocius curemus.\
"""
