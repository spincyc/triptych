text = """
At ille ait: Domine Deus, unde scire possum, quod possessurus sim eam? Non est putandus Abraham postquam credidit Deo, et reputatum est illi ad justitiam, in fide defecisse, ut diceret: Domine Deus, unde scire possum quod possessurus sim eam? Non enim quasi adhuc incredulus, signum cui credat inquirit, sed obsecrat ut ei rei quam crediderat aliqua similitudo adhiberetur, qua ejus modus agnosceretur; unde significantius vetus habet translatio: Dominator Domine, secundum quid sciam quia haeres ejus ero: sicut non est Virginis Mariae diffidentia cum ait: Quomodo fiet istud, quoniam virum non cognosco (Luc. I, 34)? quod enim futurum erat certa esse, modum quomodo fieret inquirebat. Et hoc cum quaesisset audivit. Denique et hic similitudo est data de animalibus, juvenca, et capra, et ariete, et duabus volucribus, turture et columba, ut secundum haec futurum sciret quod futurum esse non ambigebat. Sequitur enim:\
"""
