text = """
Tulit itaque Sarai uxorem suam, et Loth filium fratris sui, universamque substantiam quam possederant et animas quas fecerant in Haran; et egressi sunt ut irent in terram Chanaan. Quod dixit animas quas fecerunt pro eo positum est, ut diceret filios quos genuerant. Solet enim in Scripturis homo aliquando animae solius, aliquando carnis nomine solius indicari. Animae, sicut dictum est: anima quae peccaverit, ipsa morietur (Ezech. XVIII, 20); carnis, ut in Psalmo: at te omnis caro veniet (Psal. LXIV, 3), cum neque caro sine anima ad Deum venire, neque sine carne possit anima peccare, sed propter unam partem totus homo signetur. Neque ex hac sententia quidquam habent auxilii qui sicut carnem ex carne, ita ex anima animam aestimant procreari: cum vocabulo animae, ut diximus, totus homo designetur. Animas autem fecisse, id est, animas procreasse in Haran non Abraham et Loth, sed familiae eorum et vernaculi intelligendi sunt: nam ipsos patriarchas adhuc absque liberis permansisse sequentia sacrae historiae testantur.\
"""
