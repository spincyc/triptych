text = """
Et fluvius egrediebatur de loco voluptatis ad irrigandum paradisum. Id est ligna illa pulchra atque fructuosa quae omnem terram regionis illius opacabant, quo eo factitatum fuisse credendum est, quo in hac quam nos incolimus terra Nilus plana irrigat Aegypti, unde, quod et supra posuimus, dictum est de terra Sodomorum, quae universa irrigabatur sicut paradisus Domini, et sicut Aegyptus (Gen. XIII, 10). Et provida utique dispositione Dominus ac Conditor rerum in nostro orbe voluit habere similitudinem nonnullam patriae illius ad quam possidendam in primo parente creati sumus, ut ad promerendum ejus reditum de vicino nos admoneret exemplo, maxime et flumine illo quod de paradiso constat emanare. Nilus namque qui irrigat Aegyptum, ipse est Geon, qui in sequentibus de paradiso procedere memoratur. Sicut etiam eversis eisdem Sodomorum civitatibus, quae quondam ut paradisus Domini irrigabantur, exemplum eorum qui impie acturi sunt posuit, ut vestigia perditionis malorum certissima in mundo vigilantia aeterna eorum tormenta fugeremus.\
"""
