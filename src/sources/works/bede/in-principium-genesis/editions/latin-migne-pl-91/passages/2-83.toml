text = """
Quod cum vidisset Cham pater Chanaam, verenda scilicet patris sui esse nudata, nuntiavit duobus fratribus suis foras. At vero Sem et Japheth pallium imposuerunt humeris suis; et incedentes retrorsum operuerunt verenda patris sui, faciesque eorum aversae erant, et patris virilia non viderunt. Cham qui verenda sui patris nudata conspiciens irrisit, populum Judaeorum contradicentem atque incredulum designat, qui passionem Domini et Salvatoris nostri magis habere contemptui periturus quam salvandus per eam honorari gaudebat, qui et fratribus suis quae accidissent patri foras narravit, quia per ipsum manifestatum est et quodammodo publicatum quod erat in prophetia secretum passionis dominicae sacramentum, quoad secundae generationis donum pervenimus; unde dicit Apostolus: Nos autem praedicamus Christum crucifixum, Judaeis quidem scandalum, gentibus autem stultitiam (I Cor. I, 23). Porro in duobus filiis maximo et minimo illi sunt figurati, de quibus subsequenter addidit: Ipsis autem vocatis Judaeis et gentibus Christum Dei virtutem et Dei sapientiam, quia quod stultum est Dei sapientius est hominibus, et quod infirmum est Dei fortius est hominibus. Qui unum idemque ambo sacramentum jam praeteritae atque transactae dominicae passionis quasi unum pallium a tergo portant, et nuditatem patris neque intuentur, quia in Christi necem non consentiunt, et tamen honorant velamento, tanquam scientes unde sint nati, ut essent filii misericordiae qui fuerant in prima nativitate filii irae. Medius autem filius, id est, populus Judaeorum, qui ideo medius est, quia nec primatum apostolorum tenuit, nec ultimus in gentibus credidit, vidit nuditatem patris, quia consensit in necem Christi. Bene autem dicitur de duobus illis quod faciebus aversis verecunda patris velaverint, velut quibus factum sceleratae vineae displicuerit: quae videlicet vinea, id est, gens Judaea, quantum a nobilitate paterna degeneraverit, tempore dominicae passionis mystice signatum est, cum sitienti in cruce Domino acetum pro vino obtulit; sitiebat enim ille fidem ac dilectionem gentis ejusdem, sed illa pro suavitate fidei, ac fervore dilectionis, acredine illum odii atque infidelitatis potavit.\
"""
