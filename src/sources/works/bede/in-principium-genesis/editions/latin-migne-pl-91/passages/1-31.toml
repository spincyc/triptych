text = """
Masculum et feminam creavit eos. Plenius in sequentibus, unde et quomodo protoplastos fecerit Deus exponitur. Sed nunc brevitatis causa tantum creati referuntur, ut sexti diei operatio ac septimi dedicatio cum caeteris explicetur, ac sic ex tempore liberius et hoc et alia praetermissa quae erant relatu digna dicantur. Masculum autem unum et feminam in primis creavit Deus unam, non ut animantia caetera, quae in singulis generibus non singula, sed plura creavit, ut per hoc humanum genus arctiore ad invicem copula charitatis constringeret, quod se ex uno totum parente ortum esse meminisset; cujus causa unionis Scriptura sacra cum dixit: Et creavit Deus hominem, ad imaginem Dei creavit illum, statimque subjungeret: Masculum et feminam creavit eos, noluit addere, ad imaginem Dei creavit eos, femina enim ad imaginem Dei creata est, secundum id quod et ipsa habebat mentem rationalem; sed addendum hoc de illa non putavit Scriptura, quod propter unitatem conjunctionis etiam in illa intelligendum reliquit, imo omni quod de eis ortum est genere humano intelligendum esse signavit. Omnis enim homo etiam nunc in quantum ratione utitur, imaginem in se Dei habet; unde dicit Joannes: Erat lux vera, quae illuminat omnem hominem venientem in hunc mundum (Joan. I, 9). Ipsum est enim lumen de quo Psalmista gloriatur in Domino dicens: Signatum est super nos lumen vultus tui, Domine (Psal. IV, 7). Et quidem apte hoc in loco masculus et femina creati esse commemorantur, tametsi modus ejusdem creationis necdum referatur ut videlicet habeat locum congruum sermo divinae benedictionis, de quo sequitur:\
"""
