text = """
Et clausi sunt fontes abyssi, et cataractae coeli, et prohibitae sunt pluviae de coelo, reversaeque sunt aquae de terra euntes et redeuntes, et coeperunt minui post centum quinquaginta dies. Quod dicit reversas esse aquas de terra euntes et redeuntes, aperte indicat juxta litteram quod omnes fluviorum ac rivorum decursus per occultas terrae venas ad matricem abyssum redeant, juxta illud Salomonis: Omnia flumina intrant in mare, et mare non redundat; ad locum unde exeunt flumina revertuntur, ut iterum fluant (Eccle. I, 7). Mystice autem post centum quinquaginta dies clauduntur fontes abyssi et cataractae coeli, pluviis cessantibus, aquae revertuntur, quia verba sacri oraculi, postquam nos in fide ac spe perpetuae quietis atque immortalitatis instituerint, ultra nos docere cessabunt, quia nihil majus quod promittere debeant habebunt, postquam immortali carnis et spiritus gloria perfectos ad beatam nos visionem nostri Conditoris adduxerint. Unde bene liber Psalmorum, qui centenario et quinquagenario numero continetur, in divina laude consummatur. Initium quidem beatitudinis a continentia et divinae legis meditatione sumens, dicendo: Beatus vir qui non abiit in consilio impiorum (Psal. I, 1), et caetera. Circa finem vero nova futuri saeculi gaudia commendans dicendo, et in ipso fine cuncta in Dei laude consummans: Cantate Domino canticum novum, laus ejus in ecclesia sanctorum (Psal. CXLIX, 1); ita concludendo; Omnis spiritus laudet Dominum (Psal. CL, 6). Qui centesimus et quinquagesimus psalmus merito totus in Dei laude canitur, atque completur, quia nimirum totius nostrae beatitudinis in hoc summa est, ut inhabitantes in domo ejus ipsum sine fine laudemus.\
"""
