text = """
Profectus inde Abraham in terram Australem, habitavit inter Cades et Sur, et peregrinatus est in Geraris. Quod Abraham venit in terram Australem, terrestri suo itinere coelestem mentis profectum insinuat, quo semper ad perfectiora virtutum opera, sicut et caeteri sancti solebat ascendere. Terra quippe Australis, quae luci et ardori solis vicinior est, illam saepe vitam fidelium juxta morales sensus indicat, quae, discusso torpore concupiscentiae mundialis, interna luce supernae dilectionis magis magisque quotidie solebat innovari. Et Abraham, deletis Sodomis, terram petit Australem, cum electus quisque pravorum cernens interitum devotius sese in obsequium Conditoris sui accingit, ut cui interius donatum est perditioni malorum superesse, mereatur in aeternum gaudiis interesse bonorum. Pestilente enim flagellato, astutior erit parvulus. Ubi sequentia quoque verba quibus dicitur quod Abraham habitaverit inter Cades et Sur, et peregrinatus sit in Geraris, spiritualibus electorum profectibus apte conveniunt. Cades namque Sancta, sive Commutata, Sur Fortis, Gerara interpretatur Incolatus. Profectus ergo Abraham in terram Australem, habitavit inter Cades et Sur, quia nimirum electi omnes cum agnitione veritatis intus illustrantur, cum amore flagrant divinae visionis, opera quoque sanctitatis simul exercere contendunt; commutatam inter homines, id est coelestem pro terrestri, pro humana angelicam ducere vitam curant, et fortitudine fidei invictae ei qui singulariter fortis est adhaerere non cessant, dicentes singuli, dicentes omnes: Mihi autem adhaerere Deo bonum est (Ps. LXXII, 28). Notandum namque quod Sur apud Hebraeos unum est ex decem nominibus Dei, quo omnipotentis solet virtus significari. Habitat ergo inter Cades et Sur, qui per opera virtutum ad visionem quotidie sui Conditoris anhelat; et quoniam haec esse visio in futuro solet, in praesenti autem saeculo peregrinos se esse profitentur, qui aeternam in coelis patriam sperare didicerunt, recte sequitur:\
"""
