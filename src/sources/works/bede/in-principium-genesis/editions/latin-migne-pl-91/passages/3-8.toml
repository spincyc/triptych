text = """
Ab hoc exivit proverbium: Quasi Nemrod robustus venator coram Domino. Ideo in proverbium versa, quia insolita saeculis ejus facta fuere; quod vero additur coram Domino, exaggerandi facinoris causa est, quia videlicet satis temerarium fuerit et superbum, ut coram Domino, qui de coelo prospicit super filios hominum, taliter vivere homo in terra praesumeret; ex quo nimirum proverbio patet quia multi tempore illo fuere qui talia facere metu superni respectus vitabant, quamvis alia Editio habet quia Nemrod gigans venator contra Dominum. Ex ambiguo quippe Graeco, quod est enantion, utrumque potest interpretari. Denique in psalmo ubi canimus ploremus coram Domino qui fecit nos (Psal. CIV, 6), hoc verbum est enantion Cyrium. Hoc et in libro Job, ubi scriptum est, in furorem erupisti contra Dominum. Facilis ergo patet intellectus de gigante, quia robustus fuerit venator brutorum animalium, quasi homo potens; sed quia homo impius contra voluntatem Conditoris vitam duxerit superbam.\
"""
