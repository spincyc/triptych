text = """
Nunquid Deo est quidquam difficile? Juxta condictum revertar ad te, hoc est eodem tempore, vita comite, et habebit Sara filium. Qua audita sententia, adeo dubietate omni remota, in fide confirmata est, ut merito de illa dicat Apostolus: Fide et ipsa Sara virtutem accepit ad emissionem seminis. Quod autem dicit revertar ad te, et adjunxit vita comite, humano quidem more loquitur, quasi diceret: Si vita comes fuerit. Sed altius intelligendum quod angeli semper vita comite sive in coelis conversentur, seu ad terras descendant, illa utique vita quae dicit: Sicut enim Pater habet vitam in semetipso, sic dedit et Filio vitam habere in semetipso; cujus videlicet vitae visione atque illustratione et angeli et homines sancti fiunt perpetuo beati. Comparandus sane videtur hic locus a contrario factis protoplasti; ille etenim post reatum praevaricationis non vidisse Dominum Deum, sed vocem tunc deambulantis in paradiso perhibetur audisse; hic futurae benedictionis fide, spe ac dilectione, accensus vidit stantem Dominum, quia nimirum cum hoc mansura erat, ab illo contemplatio divinae claritatis abscesserat. Ille audita voce Domini Dei abscondit se tremebundus, quia profecto se errasse erubescebat. Hic viso Domino statim laetabundus accurrit, cui se complacuisse obedientiae merito credebat. Ille ad auram post meridiem, iste in ipso fervore diei; quia hic divini amoris igne flagrabat, ille divinae protectionis et dilectionis a se lucem peccando fugaverat. Hic hospitem Dominum recipit ac reficit, ut appositis epulis carnalibus insinuet quod eum epulis spiritalibus in corde pie vivendo reficeret, juxta quod ipse Dominus de suis amatoribus promisit: Ecce sto ad ostium et pulso; si quis audierit vocem meam, et aperuerit mihi, intrabo ad illum, et coenabo cum illo, et ipse mecum (Apoc. III, 20). Ille, id est, protoplastus, qui vetitum comedit, et eas quas in praesentia Domini angelorumque ejus habere perpetuas poterat delicias amisit, foris etiam a ligno vitae visibiliter exclusus, ut patenter ostenderetur quod sapientiae fructum incorruptibilem, quo invisibiliter frui solebat, perdidit. Et quia beatus Abraham merito piae devotionis jam fructum sapientiae et vitae, quae Christus est, aliquantisper gustaverat, recte sub arbore consistens Dominum vidisse ac suscepisse narratur. Illic Eva, relicto timore divino, neglecto viri consilio, accessit temeraria ad serpentem, in quo diabolus loquebatur, a quo seducta ad comedendum vetita, virum quoque suae praevaricationis complicem fecit; propter quod et justae damnationis cum viro accepta sententia audivit inter alia: In dolore paries filios (Genes. III, 16); primumque Cain filium maledictionis et fratricidam genuit. Hic Sara subdita timori divino, simul et religiosam viri fidem atque operationem secuta, apparente Domino, exspectabat ipsa domi donec vir occurreret, et quae essent agenda disceret; sed et epulis in susceptionem Domini praeparatis, nihilominus ipsa se domi verecundata retinuit, ac virum suum cum eis praeire ad Dominum eique munera suae devotionis simul et ipsius offerre gaudebat. Quapropter ambo remunerationem sui beneficii promissa sobole perceperunt; nec qualibet sobole, sed illa utique in qua benedicerentur omnes gentes. Et merito, ibi enim reatus praevaricationis in primo Adam debita ultione plectebatur; hic tempus redemptionis per secundum Adam et praesagabatur futurum et parabatur. Sequitur:\
"""
