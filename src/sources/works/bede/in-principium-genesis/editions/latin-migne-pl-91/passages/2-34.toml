text = """
Dixitque Deus: Non permanebit Spiritus meus in homine in aeternum, quia caro est: eruntque dies illius centum viginti annorum. Hos versiculos exponens S. Hieronimus, In Hebraeo, inquit, scriptum est: Non judicabit Spiritus meus homines istos in sempiternum, quia caro sunt: hoc est, quia fragilis est in homine conditio, non eos ad aeternos servabo cruciatus; sed hic illis restituam quod merentur. Ergo non severitatem, ut in nostris Codicibus legitur; sed clementiam Dei sonat, dum peccator hic pro suo scelere visitatur: unde et iratus Deus loquitur ad quosdam: Non visitabo filias eorum cum fuerint fornicatae, et sponsas eorum cum adulteraverint (Ose. IV). Et in alio loco: Visitabo in virga iniquitates eorum, et in flagellis peccata eorum, verumtamen misericordiam meam non auferam ab eis (Psal. LXXXVIII). Porro ne videretur in eo esse crudelis, quod peccantibus locum poenitentiae non dedisset, adjecit: Eruntque dies illius centum viginti annorum (Gen. VI), hoc est, habebunt centum viginti annos ad agendam poenitentiam; quia vero poenitentiam agere contempserunt, noluit Deus tempus exspectare decretum, sed viginti annorum spatiis amputatis, induxit diluvium anno centesimo agendae poenitentiae destinato.\
"""
