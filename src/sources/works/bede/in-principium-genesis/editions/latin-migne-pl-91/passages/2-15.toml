physical_line_ranges = [[125, 126]]
text = """
Nequaquam, inquit, ita fiet, sed omnis qui occiderit Cain septuplum punietur. Non ut aestimas morieris, et mortem pro remedio accipies, sed vives plurimo tempore ad exemplum caeterorum, ne sic peccare audeant; tantumque abest ut te abs quolibet interfici velim, ut si quis te interfecerit, septuplum, id est, gravissima ultione puniatur, qui nec tuae damnationis acerbitate admonitus, a sanguine effundendo voluit manus cohibere. Non enim illum debuit homo occidere hominem cui Deus vitam peccanti donaverat, vel ad cumulum poenae ipsius, vel ad exemplum cautelae et aliorum correctionis. Solet namque nonnunquam Scriptura septenario numero plenitudinem ejus de qua loquitur rei significare, sicut in Levitico: Si ambulaveritis, inquit, ex adverso mihi, nec volueritis audire me, addam plagas vestras septuplum (Lev. XXVI, 21). Et paulo post: Et percutiam vos septies propter peccata vestra (Ibid., 24), pro eo quod est multipliciter. Et in bonam partem Psalmista: Septies in die laudem dixi tibi (Psal. CXVIII, 164), quod est aliis verbis dicere: Semper laus ejus in ore meo (Psal. XXXIII, 2). Quod vero antiqui interpretes dixerunt: Omnis qui occiderit Cain septem vindictas exsolvet, hunc habet sensum. Vives usque ad septimam generationem, et conscientiae tuae igne torqueberis: ita ut quicunque te occiderit, secundum duplicem intelligentiam, aut in septima generatione, aut magno te liberet cruciatu: non quo ipse qui occiderit Cain septem ultionibus subjiciendus sit, sed quo septem vindictas, quae in Cain toto tempore cucurrerunt, solvat in interfecto, occidens eum qui vitae fuerat derelictus ad poenam. Nam et septimus ab Adam fuit Lamech a quo occisus esse Cain perhibetur: et hic eumdem Cain per mortem septem vindictis, quas septempliciter peccans meruit, absolvit. Primum namque ejus peccatum est quod offerens Deo non recte dividebat; secundum, quod fratri invidit; tertium, quod dolose egit dicens: Egrediamur in agrum; quartum, quod interfecit; quintum, quod procaciter negavit: Nescio; sextum, quod se ipsum damnavit: Major est iniquitas mea, quam ut veniam merear; septimum, quod nec damnatus egit poenitentiam.

Posuitque Deus Cain signum, ut non eum interficeret omnis qui invenisset eum. Ipsum videlicet signum quod tremens et gemens vagusque et profugus semper viveret: eadem sua aerumna admonitus, quia non passim a quibuslibet posset occidi; quicunque autem eum occideret, vel magnis miseriis ipsum Cain liberaret, vel se ipsum hoc faciens septemplici vindictae manciparet\
"""
