text = """
Cum surrexissent ergo inde viri, direxerunt oculos contra Sodomam, et Abraham simul gradiebatur deducens eos. Cum surrexisse dicantur inde viri, ostenditur quod sedentibus eis astans ministrabat Abraham, quamvis primo stantes viderit. Direxerunt autem oculos contra Sodomam, ut sicut fidem beati Abrahae laetis promissionibus remunerarent, ita perfidiam impiae civitatis flammis ultricibus perderent, juxta illud Psalmistae, qui cum de sanctis pietatem Domini praemisisset: Oculi Domini super justos, et aures ejus ad preces eorum (Psal. XXXIII, 16), protinus severitatem ejus in reproborum ultione subjunxit: Vultus autem Domini, inquiens, super facientes mala, ut perdat de terra memoriam eorum (Ibid., 17). Quod autem cum angelis gradiebatur Abraham deducens eos, ex consuetudine devotae hospitalitatis fecisse credendus est; sed felices illi gressus, quibus homo cum angelis ingredi meruit in terra, eosque cum ad se venissent visitandum ad coelum redituros deducere; felix autem nunc eorum vita qui angelicam in terris conversationem sequuntur, videlicet sobrie, et juste, et pie, et caste, vivendo, ac divinis laudibus semper, quantum mortali possibile est, vacando. Verum beatus Abraham, quia Dominum adeo gaudenter venientem excepit, ut etiam abeuntes quasi domesticos deducere curaret, meretur altiora divinorum operum secreta cognoscere; qui et ipse districtionem supernae animadversionis venturam mundo intelligens, sicut prius se Deo devotum in hospitibus suscipiendis ostenderat, ita erga proximos sollicitum pro eis postmodum supplicando monstravit.\
"""
