text = """
Fuit autem principium regni ejus Babylon, et Arach, et Archad, et Chalanne in terra Sennaar. In sequentibus quomodo sit facta Babylon plenius intimatur; sed hic praemittitur quod ibi reticetur, quia civitas illius et turris superbissimae Nemrod auctor exstiterit. Principium autem regni ejus fuit Babylon, quia vel prima civitatum ejus condita vel metropolis regni illius pro sui magnitudine ac decore est habita. « Arach vero ipsa est quae nunc Edissa, Archad quae nunc Nisibis, civitas Mesopotamiae. Chalanne quae nunc Seleucia, a Seleuco rege, vel certe quae nunc et Esifon appellatur. » Quod autem additur in terra Sennaar, ad omnes easdem quatuor videtur pertinere civitates. Sennaar quippe tantae latitudinis esse campus perhibetur, quae et ipsam Babylonem, et alias urbes non paucas facillime caperet. Quia vero Babylon cum civitatibus quarum caput est, superbam hujus mundi gloriam, quae confusioni obnoxia est, designat; Babel enim confusio dicitur, recte conditor ejus ipsum malorum omnium caput diabolum figurate denuntiat; cui etiam Nemrod vocabulum, quod tyrannum, vel profugum, vel transgressorem, sonat, apte congruit. Tyrannus est enim quia contra conditorem rebellans arcem divinitatis ac regnum orbis obtinere contendit. Profugus est, quia de coelo lapsus, et a persistentium in suo statu angelorum societate dejectus, miser nimis exsultat. Transgressor, quia voluntati auctoris obedire contempsit, cui persona quoque venatoris non immerito aptatur; ponit namque in silva hujus mundi suarum pedicas insidiarum, atque homines sua natura et ingenio mundos quasi cervos et capreas decipiendo venatur ad mortem: contrarius nimirum illis venatoribus, qui animas hominum ob id sua doctrina capere quaerunt, ut ad vitam aeternam pertrahant: quibus Dominus loquitur: Venite, inquiens, post me, et faciam vos fieri piscatores hominum (Matth. IV, 39); quorum ob id patria Bethsaida, id est Domus venatorum dicta est, quoniam homines erant venaturi ad vitam. Est autem Nemrod filius Chus, quod interpretatur Aethiops, quia nimirum antiquus hostis semper de obscuro perfidorum populo per exsecutionem doctrinae sive operationis nequam quasi recens nascitur.

A quo et usque hodie manet proverbium, ut dicatur: Quasi Nemrod robustus venator coram Domino. Cum imitantibus diabolum his qui sunt ex parte illius dici possit verissime, quia tales cum animas hominum suo vel verbo vel exemplo venantur ad interitum, antiqui transgressoris ac deceptoris facta sequantur.\
"""
