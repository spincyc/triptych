text = """
Et ait: Ecce Adam factus est quasi unus ex nobis, sciens bonum et malum. De hoc S. Augustinus: « Quoniam, inquit, per quodlibet et quomodolibet dictum sit, Deus tamen dixit, non aliter intelligendum est, quod ait unus ex nobis, nisi propter Trinitatem numerus pluralis accipiatur, sicut dictum erat Faciamus hominem, sicut etiam Dominus de se et Patre: Veniemus ad eum, et mansionem apud eum faciemus (Joan. XIV). Replicatum est igitur in caput superbi quo exitu concupiverit quod a serpente suggestum est Eritis sicut dii. Ecce, inquit, Adam factus est sicut unus ex nobis. Verba enim sunt haec Dei, non tam ei insultantis, quam caeteros ita ne superbiant deterrentis; propter quos ista descripta sunt: Factus est, inquit, tanquam unus ex nobis, sciens bonum et malum. Quid aliud intelligendum nisi exemplum timoris incutiendi esse propositum? quia non solum non fuerit factus qualis fieri voluerit, sed nec illud quod factus fuerat conservaverit. De hoc alio loco: Nec Dei confitentis, inquit, verba sunt, sed potius exprobrantis. » Ecce Adam factus est quasi unus ex nobis, sicut Apostolus ubi dicit: Donate mihi hanc injuriam (II Cor. XII, 13), utique a contrario vult intelligi.\
"""
