physical_line_ranges = [[145, 145]]
text = """
Sed et Seth natus est filius, quem vocavit Enos. Iste coepit invocare nomen Domini. Enos interpretatur Homo vel Vir: unde recte qui tale nomen ipse habet, nomen Domini incipit invocare, tanto instantius quotidianis in precibus auxilium Conditoris implorans, quanto se fragilis naturae factum meminit. Mystice autem sicut Abel occisus a Cain passum Dominum; ita natus pro eo Seth resuscitatum eum a morte designat: unde apte apud Septuaginta Translatores nato eo dixisse fertur pater sive mater ejus: Suscitavit enim mihi Deus semen aliud pro Abel, quem occidit Cain. Quod ideo recte juxta mysticos sensus semen aliud appellatur, cum idem Dominus qui occisus est resurrexit, quia nimirum mortalis occisus est, resurrexit immortalis: mortuus est ne nos mori timeremus: surrexit ut nobis resurgendi a morte spem fidemque tribueret: quorum distantiam seminum, loquens de nostra resurrectione, Apostolus manifeste discrevit, seminatur, inquiens, in corruptione, surget in incorruptione: seminatur in ignobilitate, surget in gloria: seminatur in infirmitate, surget in virtute: seminatur corpus animale, surget corpus spiritale (I Cor. XV, 42). Et de ipso Domino, Etsi mortuus est, inquit, ex infirmitate, sed vivit ex virtute Dei (II Cor. XIII, 4). Enos vero filius Seth populum Christianum figuraliter exprimit, qui per fidem ac sacramentum dominicae passionis ac resurrectionis quotidie per totum orbem ex aqua et Spiritu sancto nascitur. Iste enim gratiam regenerationis suae primae generationi praeferens, in universis quae agit auxilium nominis Domini invocare consuevit, dicens: Pater noster, qui es in coelis, sanctificetur nomen tuum (Matth. VI, 9), etc., ejusdem dominicae orationis, sive aliarum quibus gratiae ejus, sine qua nihil valemus, supplicare solemus; unde etiam recte nos propter conscientiam nostrae fragilitatis Enos, id est, Hominis vocabulo cognominamur: propter vero spem futurae nostrae immortalitatis filii Seth, id est, Resurrectionis, existimus.\
"""
