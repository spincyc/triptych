text = """
Cunctis diebus terrae sementis et messis, frigus et aestus, aestas et hiems, nox et dies, non requiescent. Cum enim dixisset cunctis diebus, mox addidit terrae, ut intelligeres cunctis diebus quibus terra modernum habitura est statum securos homines ab impetu universalis diluvii esse debere; nec tamen defuturum tempus quando, cessante hac labentium rerum vicissitudine quae annuatim geritur, orbis universus cum animantibus sit igne periturus, Petro attestante, qui ait: Quia coeli erant prius, et terra, de aqua et per aquam consistens Dei verbo, per quae ille tunc mundus aqua inundatus periit. Coeli autem qui nunc sunt, et terra, eodem verbo repositi sunt igni reservati in diem judicii (II Pet. III, 5). Ubi notandum quia coelos quos vel aqua perditos vel igni perituros dicit, non alios quam turbulentum hunc aerem qui terrae proximus est accipere debemus, a quo volucres coeli quod in eo volitent, cognominantur. Non enim aetherei aut siderei coeli igne consumendi sunt, sicut nec aqua consumpti sunt.\
"""
