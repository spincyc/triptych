text = """
Et ait ad eum: Nequaquam ultra maledicam terrae propter homines; sensus enim et cogitatio humani cordis in malum prona sunt ab adolescentia sua. Non igitur ultra percutiam omnem animantem sicut feci. Non se ultra maledicturum terrae, neque omnem animantem percussurum Dominus pollicetur, eo quod in tantum sint homines ad peccandum proclives, ut etiamsi diluvio rursum puniantur, nihilominus, transacto illo, denuo sese vitiis ac sceleribus involvant. Ubi intuendum quia etsi sensus humani cordis ab adolescentia ad malum pronus esse perhibetur, ex qua nimirum aetate carnalium in nobis desideriorum solent incentiva generari, non tamen est consequens ut a tempore pubertatis primum incipiamus peccatis esse obnoxii, quamvis ex tunc ad majora patranda aetas lasciva incitet. Nam et illa divina est sententia quae dicit: Grave jugum super filios Adam a die exitus de ventre matris eorum (Eccli. XL, 1), ipsum videlicet jugum primae praevaricationis, propter quam omnes in iniquitatibus concepti et in delictis sumus editi, quamvis ab ineunte adolescentia sponte plura addimus eis quibus non nostra sponte, sed paterni merito reatus gravati hanc in lucem venimus; a quibus omnibus non nisi gratia Dei per Jesum Christum liberamur. Non igitur, inquit, ultra percutiam omnem animantem sicut feci; sed haec promissio pietatis quo usque pertingat subdendo manifestat cum dicit:\
"""
