text = """
Et ecce miserunt manum viri, et introduxerunt ad se Lot, clauseruntque ostium, et eos qui erant foris percusserunt caecitate, a minimo usque ad maximum, ita ut ostium invenire non possent, et caetera usque ad id quod dixit Lot ad generes suos: Surgite, egredimini de loco isto, quia delebit Dominus civitatem hanc, et visus est quasi ludens loqui. Quod ostium Lot obcluserunt angeli, ne vel ipsum, vel aliquem de domo ipsius possent ad perdendum rapere Sodomitae, patenter insinuat quia nullum de electis Dei perditura sit impietas et persecutio reproborum, dicente Domino de ovibus suis: Et ego vitam aeternam do eis, et non peribunt in aeternum, et non rapiet eas quisquam de manu mea (Joan. X, 28). Quod item Lot, facultate ab angelis data, nullum de civibus perfidis, ne de suis quidem cognatis sive amicis, tametsi multum conatus, potuit ad salutem revocare, significat quia nullius labor hominis ad numerum praedestinatorum, qui ante constitutionem mundi electi sunt a Domino, vel unam possit animam adjicere: Novit enim Dominus qui sunt ejus. Verum etsi nostram fragilitatem qui ad electorum sortem pertinent latet, non tamen ab agenda cura nostrae salutis cessandum, non ab instruendis proximis lingua est continenda, sed ad exemplum beati Lot, et nobis caste vivendum, et errantium quoque correctioni officium pietatis impendendum, constat enim quia etsi praedestinatos ad interitum salvare nequivimus, nostrae tamen benignitatis quam erga illorum salutem impendimus mercedem non perdimus.\
"""
