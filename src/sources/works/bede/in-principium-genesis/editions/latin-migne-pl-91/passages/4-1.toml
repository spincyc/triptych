text = """
His itaque transactis, factus est sermo Domini ad Abram per visionem, dicens: Noli timere, Abram, ego protector tuus sum et merces tua magna nimis. Benedictionem quam a sacerdote Melchisedech perceperat Abraham, hanc per se Dominus ipse confirmat. Dixerat quippe sacerdos: Et benedictus Deus excelsus, quo protegente hostes in manibus tuis sunt (Gen. XIV, 20). Dicit Dominus: Ego protector tuus sum. Dixerat sacerdos: Benedictus Deus excelsus. Dicit ipse Deus: Et merces tua magna nimis. Mercedem autem dicit, non tantum dilectionis, quam fratri in angustia posito exhibuerat; sed et totius dilectionis, qua ipsi Domino ex quo patriam parentesque deseruerat, integro ex corde servierat.\
"""
