text = """
Igitur Sarai uxor Abrae non genuerat liberos, sed habens ancillam Aegyptiam nomine Agar, dixit marito suo: Ecce conclusit me Dominus ne parerem, ingredere ad ancillam meam, si saltem ex illa suscipiam filios. Cumque ille acquiesceret deprecanti, tulit Agar Aegyptiam ancillam suam post annos decem, quando habitare coeperat in terra Chanaan, et dedit eam viro suo uxorem, qui ingressus est ad eam; at illa concepisse se videns, despexit dominam suam, etc. De Agar et Ismael quomodo Synagogam et Vetus Testamentum designent, sicut Sara et Isaac filius ejus Ecclesiam ac Novum Testamentum, Apostolus ad Galatas plenissime disseruit. Quod autem ad rem pertinet gestam, nullo modo est inferendum, inurendum de hac concubina crimen Abrahae, usus est ea quippe ad generandam prolem, non ad explendam libidinem; nec insultans, sed potius obediens conjugi, quae suae sterilitatis credidit esse solatium, si fecundum ancillae uterum, quod natura non poterat, voluntate fecerat, suum; et eo jure, quo dicit Apostolus: Similiter et vir non habet potestatem corporis, sed mulier (IV Cor. VII, 4), uteretur mulier ex altera ad pariendum, quod non poterat ex seipsa. Denique cum ancilla gravida superbiret dominae sterili, et hoc Sara suspicione muliebri, viro potius imputasset, etiam ibi demonstravit Abram non se amatorem, sed liberum fuisse genitorem, et in Agar Sarae conjugi pudicitiam custodisse, nec voluntatem suam, sed voluntatem illius implevisse. Ait enim: Ecce ancilla tua in manu tua est, utere ea ut libet.\
"""
