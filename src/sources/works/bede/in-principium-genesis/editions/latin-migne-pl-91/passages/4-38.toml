text = """
Cumque elevasset oculos, apparuerunt ei tres viri stantes prope eum, quos cum vidisset, cucurrit in occursum eorum de ostio tabernaculi, et adoravit in terra et dixit: Domine, si inveni gratiam in oculis tuis, ne transeas servum tuum, etc. Quod tres viri ei apparuerunt, mysterium est sanctae Trinitatis; denique cum tres vidisset, unum adoravit, et precatus est Dominum, quia etsi in personis est Trinitas, in divinitate est tamen una et coadoranda Dominantis aequalitas, sicut etiam in Isaia cum angelicae virtutes gloriam sanctae Trinitatis canerent dicentes: Sanctus, Sanctus, Sanctus, mox unitatem dominationis ac deitatis subjungunt addentes: Dominus Deus omnipotens, plena est omnis terra gloria ejus. Et bene dicitur quia visurus angelos e evaverit oculos Abraham, quia nimirum necesse est ut qui cives coeli videre, qui divinae Majestatis gloriam et arcana nosse concupiscit, omnem mentis intuitum ab infimis desideriis erigat, ac sedula intentione ad lucem veri Solis aperiat. Bene subinfertur quia cum vidisset angelos, cucurrit in occursum eorum, adorans, eosque ne se transirent rogavit, quia necesse est ut quotiescunque gustum aliquem internae dulcedinis animo concipimus, mox omnibus votis ac promptis bonorum operum gressibus satagamus, ne nos citius eadem dulcedo relinquat; sed quae ad tempus gustata est, memoria supernae suavitatis mentes nostras aliquanto diutius reficiat, atque ab hujus mundi delectationibus et curis abstractas in aeternorum contemplatione suspendat. Movet forte aliquos quomodo vel in hac lectione Abraham, vel in sequente Loth angelos videns, hospitio quidem quasi homines susceperit, et quasi mortales cibis humanis, refecerit, cum quibus tamen quasi cum Deo loquebantur, eorumque verba non aliter quam oracula coelestia susceperunt. « Sed credibile est, » ut sanctus Augustinus ait, « quod et Abraham in tribus, et Loth in duobus viris Dominum agnoscebant; cui per singularem numerum loquebantur, etiam cum eos homines esse arbitrarentur. Neque enim aliam ob causam sic eos susceperunt, ut tanquam mortalibus, et humana refectione indigentibus, ministrarent; sed erat profecto aliquid quo ita excellebant, licet tanquam homines, ut in eis esse Dominum sicut esse assolet in prophetis, hi qui hospitalitatem illis exhibebant dubitare non possent; atque ideo et ipsos aliquando pluraliter, et in eis Dominum aliquando singulariter, appellabant. Angelos autem fuisse Scriptura testatur, non solum in hoc Genesis libro, ubi haec gesta narrantur, verum etiam in Epistola ad Hebraeos, ubi cum hospitalitas laudaretur: Per hanc, inquit, etiam quidam nescientes hospitio angelos receperunt (Hebr. XIII, 2). » Verum in hac susceptione et hoc sentire congrue potest, quia divinitus sit procuratum ut angelos videntes patriarchae velut homines quidem susciperent, sed tanquam Deum venerarentur, quatenus per distinctionem talis obsequii ac devotionis praefiguraretur quandoque futurum, ut ipse Dominus in carne apparens cibis satiaretur carnalibus et hospitio reciperetur humano. In quo tamen hospitio magis evangelizandi et infirmos sanandi quam manducandi ac bibendi operam daret, sicut saepissime factum evangelica testatur historia. Denique expositores sacrarum litterarum hoc in loco intellexere completum quod ait Dominus Judaeis: Abraham pater vester exsultavit ut videret diem meum; et vidit, et gavisus est (Joan. VIII, 56). Diem quippe Domini vidit, cum tres angelos videns, unum adoravit, et allocutus est Dominum, quia in trium distinctione personarum unius cognovit essentiam majestatis.

Refecit eos epulis appositis, quia intellexit eum de suo semine nasciturum, qui cum sit Deus ante saecula, Patri consubstantialis, homo in fine saeculorum verus, veraciter inter homines conversaturus appareret; cibi autem quibus eos refecit, et ipsi spiritalibus sunt pleni sacramentis, de quibus ita memoratur:\
"""
