physical_line_ranges = [[78, 78]]
text = """
Formatis igitur Dominus Deus de humo cunctis animantibus terrae, et universis volatilibus coeli, adduxit ea ad Adam. Si quem movet quia non dixit, formatis de humo cunctis animantibus terrae et de aquis universis volatilibus coeli, sed tanquam utraque genera de terra formaverit, Formatis igitur, inquit, Dominus Deus de humo cunctis animantibus terrae et universis volatilibus coeli; videat duobus modis esse intelligendum: aut tacuisse nunc unde formaverit volatilia coeli, quia et tacitum posset occurrere, ut non de terra utrumque accipiatur Dominum formasse; sed tantummodo animantia terrae et volatilia coeli, etiam tacente Scriptura intelligamus unde formaverit; aut terram universaliter sic appellatam simul cum aquis, quemadmodum appellata est illo psalmo ubi, coelestium laudibus terminatis, ad terram facta est conversio sermonis et dictum: Laudate Dominum de terra, dracones, et omnes abyssi (Ps. CXLVIII, 7), etc. Nec postea dictum est: Laudate Dominum de aquis. Ubi enim sunt omnes abyssi quae de terra laudant Dominum, ibi etiam reptilia et volatilia pennata quae nihilominus de terra laudant Deum secundum istam universalem appellationem terrae, secundum quam etiam de toto mundo dicitur: Deus qui fecit coelum et terram, sive de arida sive de aquis quaecunque creata sunt de terra creata veraciter intelliguntur.\
"""
