text = """
Dixitque Dominus ad eum: Quare iratus es, et cur concidit facies tua? Nonne si bene egeris, recipies; sin autem male, statim in foribus peccatum tuum aderit? Quare, inquit, irasceris, et invidiae in fratrem livore cruciaris, vultum dimittis in terram? Nonne si bene egeris, si pura mente sacrificium obtuleris, recipies, respiciente Domino ad te et ad sacrificium tuum: sin autem male egeris, statim in foribus peccatum tuum aderit, et tali janitore intrans semper exiensque comitaberis, pro eo ut Dominus custodiret introitum tuum et exitum tuum, et sicut de sapientia dicitur: Qui de luce vigilaverit ad illam non laborabit. Assidentem enim illam in foribus suis inveniet (Sap. VI, 15). Et iterum: Quoniam dignos se ipsa circuit quaerens, et in viis ostendit se illis habitator, et in omni providentia occurrit illis (Ibid., 17).\
"""
