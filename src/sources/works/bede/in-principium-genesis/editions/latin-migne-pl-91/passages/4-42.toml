physical_line_ranges = [[349, 349]]
text = """
Cumque comedissent, dixerunt ad eum: Ubi est Sara uxor tua? Ille respondit: Ecce in tabernaculo est, cui dixit: Revertar ad te tempore isto, vita comite, et habebit filium Sara uxor tua. Ambo quidem domini domus, et Abraham videlicet et Sara cum summa festinantia refectionem praeparant; sed quasi in domo bene disposita Abraham cum paratis epulis audentior ad Dominum accedit; Sara timore ac verecundia muliebri sese in tabernaculo, imo post ostium tabernaculi cohibet, nec jam appropiare audet, sed de abditis quae vir suus cum Domino loquatur auscultat. Ideoque quoniam et devota Deo, et suo bene subdita erat marito, gaudium partus quod multum desiderabat audivit; nec quidem cujuslibet partus, sed illius in quo benedictionem et ipsa in futuro et omnes acciperent nationes. Bene autem postquam comederant angeli, filium suis hospitibus promittunt nasciturum, quia cum epulas bonae nostrae operationis et fidei Dominus susceperit, gratia nos suae benedictionis remunerat. Comederunt autem angeli, vel potius comedisse videbantur, ut sanctus Raphael exponebat Tobiae, ut sacramentum dominicae Incarnationis, in qua ipse magni consilii Angelus tanquam homo erat manducaturus, non solum visibiliter apparendo, sed etiam ad mensam hominum residendo ac manducando, figurarent; sed illi, sicut idem Raphael ait, cibo invisibili, id est qui ab hominibus in carne degentibus videri non potest, utebantur, videlicet gaudio contemplationis; de qua et Dominus in Evangelio: Quia angeli, inquit, eorum in coelis semper vident faciem Patris mei qui in coelis est (Matth. XVIII, 10); semper etenim vident, hoc est etiam cum ad nos aliqua ministraturi foris veniunt; credibile est autem quod esca quam manducabant, statim ut spiritale vel aetherium corpus eorum contigit, velut aqua ardenti flammae injecta, consumpta fuerit, et non sicut aqua arenti terrae infusa ad reficiendum corpus eorum profecerit, quomodo in nobis, cum manducamus, fieri solet.\
"""
