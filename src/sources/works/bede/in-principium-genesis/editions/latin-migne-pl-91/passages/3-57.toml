physical_line_ranges = [[285, 285]]
text = """
Elevatis itaque Loth oculis, vidit omnem circa regionem Jordanis, quae universa irrigabatur antequam subverteret Dominus Sodomam et Gomorrham, sicut paradisus Domini et sicut Aegyptus venientibus in Segor: elegitque sibi Loth regionem circa Jordanem, et recessit ab oriente; et caetera usque dum ait: homines autem Sodomitae pessimi erant et peccatores coram Domino nimis. Fertilitatem terrae laudat, simul et incolarum notat impietatem, ut eo majori damnatione digni esse intelligantur, quod maxima Dei munera non ad fructum pietatis, sed ad incrementum vertere luxuriae: ubi etiam tacite laudibus beati Loth additur, quia in ipsa terra inter ipsos degens indigenas, neque ubertate soli divitis, neque exemplo cohabitantium potuit ullatenus a suae putitatis integritate corrumpi. Quibus autem peccatis Sodomitae fuerint subjugati, excepto illo infando quod in sequentibus Scriptura commemorat, Ezechiel propheta sufficienter exponit, loquens ad Hierusalem: Ecce haec fuit iniquitas Sodomae sororis tuae, superbia, saturitas panis, et abundantia, et otium ipsius et filiarum ejus; et manum egeno et pauperi non porrigebant, et elevatae sunt, et fecerunt abominationes coram me (Ezech. XVI, 49). A quibus omnibus immunem fuisse beatum Loth, et textus sacrae historiae testatur, quem angelos hospitio recepisse, ac per eos a pereuntibus impiis ereptum esse declarat; et sententia beati Petri apostoli probat, qua dicitur: Et justum Loth oppressum a nefandorum injuria et conversatione eruit (II Petr. II, 7). Aspectu enim et auditu justus erat, habitans apud eos qui de die in diem animam justam iniquis operibus cruciabant. Quid enim boni meriti ei deesse poterat, qui justus apostolica voce astruitur? in quo praesentes non nisi justitiae famam audire valebant, cujus oculis et auribus mundis audita ac visa proximorum facinora non nisi cruciatus et afflictio erant? quod vero dicitur de eo quia recessit ab oriente ad Haran, significat et Mesopotamiam, unde jam dudum corporaliter Abraham ducente discesserat; sed quia de proposito mentis ejus dubitare lector poterat utrumnam adhuc amore cognationis ac patriae teneretur, an jam perfecte quomodo Abraham et ipse de terra et cognatione et de domo patris sui fuerit egressus, curavit Scriptura etiam de ipso specialiter intimare, quod ab illis locis atque incolis non solum corpore, sed et mente recesserit, atque ob fidem ac spem divinae benedictionis perpetuus ubicunque Abrahae placuisset hospes ac peregrinus manere consenserit. Nam quia Haran, civitas ad orientalem plagam a terra repromissionis sita sit, testatur Scriptura, quae in sequentibus dicit: Profectus ergo Jacob venit ad terram orientalem, cum utique de Bethel ad Haran iter fecisset.\
"""
