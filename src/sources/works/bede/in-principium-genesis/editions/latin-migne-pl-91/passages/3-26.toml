physical_line_ranges = [[248, 248]]
text = """
Descendit autem Dominus, ut videret civitatem et turrem quam aedificabant filii Adam. Pro filiis Adam vetus translatio habet filios hominum, hoc est non filii Dei, sed hi qui secundum hominem viventes mererentur audire a Domino: Ego dixi: Dii estis, et filii Excelsi omnes; vos autem sicut homines moriemini (Psal. LXXXI, 6). Non autem loco movetur Deus qui semper est ubique totus; sed descendere dicitur, cum aliquid facit in terra quod, praeter usitatum naturae cursum mirabiliter factum, praesentiam ejus quodammodo ostendit; nec videndo discit ad tempus, qui nunquam potest aliquid ignorare; sed ad tempus videre et cognoscere dicitur, quod videri et cognosci facit. Non sic ergo videbatur illa civitas quomodo eam Deus videri fecit, quando sibi quantum displiceret ostendit; quamvis possit intelligi Deus ad illam civitatem descendisse, quia descenderant angeli ejus, in quibus habitat, ut quod adjunctum est: Et dixit: Ecce unus populus et unum labium omnibus, et caetera, ac deinde additum: Venite igitur, descendamus, et confundamus ibi linguam eorum, recapitulatio sit, demonstrans quemadmodum factum sit quod dictum fuerat, descendit Dominus; si enim jam descenderat, quid sibi vult venite descendamus, quod intelligitur angelis dictum, nisi quia per angelos descenderat, qui in angelis descendentibus erat?\
"""
