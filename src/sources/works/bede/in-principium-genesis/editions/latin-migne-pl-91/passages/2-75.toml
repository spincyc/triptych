text = """
Benedixitque Deus Noe et filiis ejus et dixit ad eos: Crescite, et multiplicamini, et implete terram, et terror vester ac tremor sit super cuncta animantia terrae, et super omnes volucres coeli cum universis quae moventur super terram. Omnes pisces maris manui vestrae traditi sunt, et omne quod movetur et vivit erit vobis in cibum; quasi olera virentia tradidi vobis omnia. Patet sensus litterae quod secundae aetatis saeculi quomodo et primae et caeterarum initia benedicantur a Domino. Benedicitur enim Noe cum filiis suis, omnibus scilicet illis qui ejus et carne progeniti, et fide atque obedientia praediti, veraciter se ejus esse filios docent; quod progenies ejus terram implere jubetur, sicut et factum esse constat; quod animalibus terrae cunctis ac volueribus coeli praedicantur homines terrori esse debere; quod haec una cum piscibus illis edenda conceduntur, quomodo usque ad diluvium olera comedenda acceperunt. Ubi notandum quia terrorem eorum ac tremorem cum esse super animalia praecipit, profecto esse super homines prohibet. Contra naturam quippe superbire est ab aequali velle timeri: et tamen necesse est ut rectores a subditis timeantur, quando ab eis Deum minime timeri deprehendunt. In eo enim quod metum sibi a perverse viventibus exigunt, quasi non hominibus, sed animalibus dominantur, quia videlicet ex qua parte bestiales sunt subditi, ex ea debent etiam formidini jacere substrati. Juxta intelligentiam vero spiritalem benedicitur Noe cum filiis suis, Dominus videlicet et Salvator noster cum apostolis, quos etiam filios appellare dignatus est, dicens: Non possunt filii sponsi lugere, quandiu cum illis est sponsus (Matth. IX, 15). Hos crescere ac multiplicari Deus pater toto orbe praecepit, cum ait discipulis Dominus: Euntes in mundum universum praedicate Evangelium omni creaturae (Marc. XVI, 14), id est, omnibus gentibus. Cuncta namque Domini Salvatoris praecepta Patris utique praecepta sunt. Ipse etenim dixit: Quae ergo ego loquor, sicut dixit mihi Pater, sic loquor (Joan. XII, 50). Horum namque dominio cuncta animalia quae moventur in terra, universas volucres coeli, omnes pisces maris subjecit cum ait: Quaecunque alligaveritis super terram, erunt ligata et in coelo; et quaecunque solveritis super terram, erunt soluta et in coelo (Matth. XVIII, 18). Animalia quippe, volatilia, pisces diversorum ingeniorum ac morum personas insinuant, quae cuncta post diluvium filiis Noe dantur in cibum, quia postquam mundo Dominus donum lavacri salutaris attulit, cunctis etiam nationibus hoc ministrari voluit dicens apostolis: Euntes ergo docete omnes gentes, baptizantes eos in nomine Patris et Filii et Spiritus sancti (Matth. XXVIII, 19). Dantur enim haec filiis Noe in escam juxta hoc quod Petro ostensis in linteo mystico cunctis quadrupedibus ac reptilibus terrae dicitur: Surge, Petre, occide, et manduca (Act. X, 13); id est, exstingue gentiles ab hoc quod male vixerant, veritatem praedicando; et infer in Ecclesiae membra sacris mysteriis initiando; unde hic quoque recte subjungitur:\
"""
