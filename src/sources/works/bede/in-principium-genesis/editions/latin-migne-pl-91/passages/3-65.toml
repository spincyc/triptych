text = """
Et persecutus est eos usque Dan, et divisis sociis irruit super eos nocte, percussitque eos, et persecutus est usque Hobal, quae est ad Laevam Damasci. Cuncta sacri eloquii series mysticis est plena figuris, nec tantum dictis et factis, sed et ipsis in quibus agitur locis ac temporibus congruit illud apostolicum, quia omnia in figura contingebant illis, scripta sunt autem propter nos (I Cor. X, 11). Dan interpretatur Judicium, Hoba Condemnatio, Damascus Sanguinis poculum. Persequens ergo hostes Abraham invenit in Dan, et incautos securosque nocte percussit eos, qui usque ad id locorum saevisse gloriantes, quasi capta praeda laetabantur; quia peccatores quique et in hujus vitae divitiis atque in oppressione innocentium se extollentes usque ad discrimen divini examinis de suis gloriari permittuntur operibus; sed cum caecitate improvida, quasi in media nocte positi, dixerint pax et securitas; tunc repentinus eis superveniet interitus: unde bene dicitur percussisse, persecutosque eos esse usque Hoba, id est Condemnationem, quae non alia condemnatio quam repentini et aeterni interitus debet intelligi. Quae est, inquit, ad laevam Damasci. Damascus, ut diximus, interpretatur Sanguinis poculum; quo nomine delectatio vitiorum recte significatur. Quid enim delectatio peccati nisi sanguinis est poculum, cum quis ea quae carnis sunt et sanguinis absque ulla retractatione complere studuerit? Et est Hoba ubi percussit adversarios Abraham ad laevam Damasci, quia damnatio quae impios punitura est, in poenam eos perpetuam cum diabolo et angelis ejus, quae per laevam solet designari, retrudet. Est autem Damascus urbs nobilis Foenicis et Syriae quondam totius metropolis. Dan quoque Foenicis oppidum erat terminus Judaeae provinciae contra Septentrionem ubi hodie Paneas, quae quondam Caesarea Philippi vocabatur: unde et Jordanis sortitus est vocabulum, qui fluit de Libano. Dan quippe unus est de fontibus ejus; alter vocatur Jor, quod interpretatur Rivus. Duobus ergo fontibus qui haud procul a se distant in unum rivulum foederatis, Jordanis deinceps appellatur.\
"""
