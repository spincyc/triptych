text = """
Credidit Deo, et reputatum est illi ad justitiam. Hujus sententiae meminit Apostolus (Rom. IV, 3), propter Dei gratiam commendandam, ne circumcisio gloriaretur, gentesque incircumcisas ad fidem Christi nollet admitti: hoc enim quando factum est, ut credenti Abrahae deputaretur fides ad justitiam, nondum fuerat circumcisus. Reputatur ergo fides ad justitiam, non otiosa et nuda, sed ea quae per dilectionem operatur; reputatur et ea quae etsi necdum operandi tempus habet, perfectam tamen operandi voluntatem habet. Reputata est namque fides latronis ad justitiam, quae etsi instante mortis articulo, nullum operandi tempus habere potuit, adeo perfecta tamen ab inspectore cordis judicata est, ut ipso die in habitatione paradisi cum ipso remunerata sit. Reputata est fides Cornelii ac domus ejus ad justitiam, adeo ut etiam ante lavacrum regenerationis donum sancti Spiritus acciperet; quia nimirum mox concepta in corde, parata ad operandum per dilectionem erat. Sic et fides Abrahae quantum sufficeret reputari ad justitiam probavit, cum parata erat etiam unicum filium ad praeceptum Domini, in holocaustum offerre. Justus ergo ex fide vivit (Rom. I, 17), illa nimirum fide quae parata est per dilectionem operari, et si habet tempus, operatur.\
"""
