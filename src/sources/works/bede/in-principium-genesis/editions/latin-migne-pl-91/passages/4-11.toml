text = """
Dictumque est ad eum: Scito praenoscens, quia peregrinum futurum sit semen tuum in terra non sua, et subjicient eos servituti, et affligent quadringentis annis, etc. Hoc de populo Israel qui fuerat in Aegypto serviturus apertissime prophetatum est. Non quod in eadem servitute sub Aegyptiis affligentibus quadringentos ille populus annos fuerat peracturus, sed in ipsis quadringentis annis praenuntiatum est hoc futurum. Quadringenti sane dicuntur anni propter numeri plenitudinem, quamvis aliquanto amplius sint; sive ex hoc tempore computentur quo ista promittebantur Abrahae, sive ex quo natus est Isaac propter semen Abrahae de quo ista praedicuntur. Computantur enim ab anno septuagesimo et quinto Abrahae quando ad eum facta est prima promissio, usque ad exitum Israel ex Aegypto, quadringenti et triginta anni, quorum Apostolus ita meminit: Hoc autem dico, inquit, testamentum confirmatum a Deo: quae post quadringentos et triginta annos facta est Lex, non infirmat ad evacuandam promissionem (Gal. III, 17). Jam ergo isti quadringenti et triginta, quadringenti poterant nuncupari, qui non sunt multo amplius; quanto magis cum aliquot jam ex isto numero praeterirent, quando illa in visu demonstrata et dicta sunt Abrahae, vel quando Isaac natus est, centenario patri suo, a prima promissione post viginti quinque annos; cum jam ex istis quadringentis triginta, quadringenti et quinque remanerent, quos Dominus quadringentos voluit nominare.\
"""
