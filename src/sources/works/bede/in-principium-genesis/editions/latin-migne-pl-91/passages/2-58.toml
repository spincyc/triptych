text = """
Recordatus autem Dominus Noe, cunctorumque animantium, et omnium jumentorum quae erant cum eo in arca, adduxit spiritum super terram, et imminutae sunt aquae. Potest in nomine Spiritus ipse vivificator Dei Spiritus accipi, de quo in principio dictum est: Et Spiritus Dei ferebatur super aquas (Genes. I, 3), de quo dubium non est quia sicut tunc, congregatis aquis, in locum unum arefecit terram, ita etiam nunc, ablatis de medio aquis diluvii, denuo faciem terrae revelavit. Potest et ventus iste aereus nomine Spiritus appellari, juxta illud Psalmistae: Dixit et stetit spiritus procellae (Psal. CVI, 25), cujus flatibus crebris plerumque solent aquae minui vel de loco moveri; unde est illud Exodi: Cumque extendisset Moyses manum super mare, abstulit illud Dominus, flante vento vehementi et urente tota nocte, et vertit in siccum, divisaque est aqua (Exod. XIV, 27).\
"""
