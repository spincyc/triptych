text = """
Eduxitque eum foras, et ait illi: Suspice coelum, et numera stellas, si potes, et dixit ei: Sic erit semen tuum. Stellis enim recte comparantur justi et electi; non solum quia sicut stellae ab hominibus dinumerari nequeunt; verum etiam quia coelesti sunt felicitate sublimes, quia abjecta vitae hujus et infima desideria magna mentis sublimitate transcendunt; quia inter reprobos lucent tanquam luminaria in mundo, verbum vitae continentes. De qualibus et in fine recte dici possit: Stella autem a stella differt in claritate, sic et resurrectio mortuorum (I Cor. XV, 41). Quod autem ait: Sic erit semen tuum, non de illis solum dicit electis qui de ejus stirpe corporaliter erant nascituri, sed etiam de nobis, quibus ab Apostolo dicitur: Si autem vos Christi, ergo Abrahae semen estis (Gal. III, 29). Unde bene primum intro positus audivit: Sed qui egredietur de utero tuo ipsum habebis haeredem. Propter eos videlicet qui ex ejus semine prodeuntes, etiam promissae benedictionis ac haereditatis erant cohaeredes futuri. Postmodum vero educens foras eum, numerare stellas, si possit, imperat; Sic erit, inquiens, semen tuum propter eos nimirum qui non ex ejus utero procreandi, sed ad ejus tamen erant semen ex toto orbe colligendi; juxta quod in Evangelio credenti centurioni, qui non carnaliter, sed spiritaliter ad semen Abrahae pertinebat, ait ipse Dominus: Dico autem vobis quod multi ab Oriente et Occidente venient, et recumbent cum Abraham, et Isaac, et Jacob, in regno coelorum (Matth. VIII, 11). Eduxit enim eum foras ut in latitudine totius orbis semen se benedictionis accepturum esse disceret. Suspicere coelum jubet, et numerare stellas, ut in coelesti patria se hac haereditate locupletandum esse cognosceret.\
"""
