text = """
Porro Aran genuit Loth, mortuusque est Aran ante Thare patrem suum in terra nativitatis suae, in Ur Chaldaeorum. Quod dicit ante Thare et praesentiam potest et tempus designare; tempus videlicet, quia ante moreretur quam pater suus; praesentiam vero, quia et coram illo, id est, praesente illo, vita excederet. Denique quidam Codices habent quia mortuus est ante conspectum Thare patris sui. Quod vero dicitur in Ur Chaldaeorum, nomen videtur esse loci, in quo sepultus est; cujus hodie, sicut Josephus refert, tumultus ostenditur: ex quo videtur magnae alicujus excellentiae vel dignitatis idem Aran exstitisse. Quia vero apud Hebraeos, Ur dicitur Ignis, narrant quod igni Chaldaeorum consumptus sit: quia videlicet Deum verum cum Abraham majore suo fratre cognoscens, ignem quem illi adorabant, adorare ipse respuerit; ideoque ambobus in ignem missis a Chaldaeis, ipse flammis assumptus; Abraham vero sublimioris fidei merito sit liberatus a Domino: unde in sequentius ad eum loquitur: Ego Dominus, qui eduxi te de igne Chaldaeorum; et hujus gratia dissensionis Abraham quamvis ignem evaserit, apud Chaldaeos tamen habitare nequiverit; sed cum sua cognatione sit a parente aliam translatus in terram: quibus concordant verba Achior ducis omnium Moabitarum et Ammonitarum, qui quasi vir inclytus, quae in vicina et cognata sibi gente, imo de qua ipse ortus est, facta fuerant ignorare non potuit: ait enim loquens de populo Israel ad Holofernem principem militiae Assyriorum: Populus iste ex progenie Chaldaeorum est: hic primum habitavit in Mesopotamia, quoniam noluerunt sequi Deos patrum suorum qui erant in terra Chaldaeorum. Deserentes itaque cerimonias patrum suorum, quae in multitudine deorum erant, unum Deum coeli coluerunt, qui et praecepit eis ut exirent inde, et habitarent in Haram (Judith V, 6).\
"""
