text = """
Egressus est itaque Abram sicut praeceperat ei Dominus, et ivit cum eo Loth. Septuaginta quinque annorum erat Abram cum egrederetur de Haran. Claret ex hoc numero annorum Abrahae, quia vivente adhuc patre, ut supra expositum est, de Haran exierat. Numerus autem ille septuaginta et quinque annorum mysticus esse non est dubitandum, dum in eo et ipse promissionem divinae benedictionis accepit, et Isaac filium ejusdem benedictionis haeredem reliquit moriens: de quo ut breviter dicamus, septuaginta quia septies deni sunt, perfectionem bonae designant actionis, cum mandata decalogi per gratiam Spiritus sancti, quae septiformis a propheta describitur, implemus: quibus quinque superadjiciuntur, ut in cunctis nostri corporis sensibus eadem divina praecepta, juvante Spiritus gratia, faciamus. Septuaginta et quinque annorum erat Abram quando ad praeceptum sive ad promissa Domini exiens de Haran, terram repromissionis intravit; ut ostenderetur quia et ipse per auxilium Spiritus, anathematizatis erroribus Babyloniae conversationis, Dei praecepta servaret; et hoc in omni quod vel vivendo vel audiendo vel gustando vel tangendo gerebat, ne quid prorsus in suo corpore esset, quod non obedientiae praeceptorum coelestium dono Spiritus ipsius illustratus et adjutus impenderet, et omnibus quoque eisdem promissionis haeredibus simili ordine vitam ducendam esse signaret. Nam et hoc quod ille jussus exiit de terra et cognatione et de domo patris sui, universis promissionis ipsius filiis, in quibus et nos sumus, constat imitandum. Egredimur quippe de terra nostra, cum carnis voluptates abdicamus; de cognatione nostra, cum vitiis omnibus cum quibus nati sumus, in quantum hominibus possibile est, nos exuere studemus; de domo patris nostri, cum ipsum mundum relinquere cum principe suo diabolo vitae coelestis amore contendimus. Omnes enim propter reatum praevaricationis primae filii diaboli nascimur in mundo; sed per gratiam regenerationis quique ad semen Abrahae pertinemus, filii Dei efficimur, dicente nobis, id est, Ecclesiae suae, Patre nostro qui est in coelis: Audi, filia, et vide, et inclina aurem tuam, et obliviscere populum tuum et domum patris tui (Psal. XLIV, 11): unde bene Haran, de qua egressus est Abraham, Ira interpretatur. Chanaan, ad cujus terram invitatur, Mutatus sive Negotiator dicitur. Non ergo solus Abraham cum fratre Loth egressus est de Haran, ut veniret in terram Chanaan, sed et omnes electi qui nati sunt lavacro regenerationis, exeunt profecto de Haran veniuntque in terram Chanaan; sed et omnes electi cum iram primi reatus in vitae suae statu, abdicata consuetudine vitiorum, virtutibus operam dant, et felicissimo commercio temporalibus insistunt laboribus, ut aeterna praemia consequantur; terrenas divitias spernunt, ut possint accipere coelestes; humani gaudia regni contemnunt, ut in regno Dei partem habere mereantur. Haec est enim terra quam se Dominus sequacibus suis monstraturum esse promisit: quia non humanae ingenio sapientiae, qua sit actionum bonarum via incedendum, potest investigari, sed illius est in omnibus ducatus expetendus, cui dicit Psalmista: Tenuisti manum dexteram meam, et in voluntate tua deduxisti me, et cum gloria assumpsisti me (Psal. II, 24).\
"""
