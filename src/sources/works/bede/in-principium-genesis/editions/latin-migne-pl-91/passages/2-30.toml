text = """
Et facti sunt omnes dies Enoch trecenti sexaginta quinque anni, ambulavitque cum Deo, et non apparuit, quia tulit eum Deus. Pulcherrime autem dicitur, quia qui ambulavit in hac vita prius cum Deo, obediendo praeceptis ejus, ambulavit postmodum cum illo transeundo de hac vita in aliam, ubi in maxima carnis et spiritus quiete ac felicitate viveret: quem tamen fides Ecclesiae universalis habet ante diem judicii, id est, imminente adventu Antichristi, rediturum cum Elia ad conversionem hujus saeculi, quatenus auctoritate ac doctrina tantorum virorum erudiantur et confirmentur corda hominum ad tolerandam et superandam persecutionem ejusdem filii perditionis; et tunc eos, consummato suo martyrio, ad immortalis vitae gaudia consensuros, juxta quod in Apocalypsi Dominus Joanni: Et dabo, inquit, duobus martyribus meis, id est, testibus, et prophetabunt diebus mille ducentis sexaginta amicti saccis (Apoc. XI, 3), id est, tribus semis annis in magna continentia et agonia conversantes. Et paulo post: Et cum finierint testimonium suum, bestia quae ascendit de abysso, faciet adversum illos bellum, et vincet eos, et occidet illos (Ibid., 7).

Diximus autem praeoccupando supra, quia sicut Lamech in septima ab Adam generatione maledictus interitum designat reproborum, quem in futuro saeculo, ubi requiem sperare debuerant, inveniunt: ita Enoch in septima generatione translatus de mundo veram demonstret requiem electorum, quam post hujus vitae labores, qui sex aetatibus transeunt, sine fine percipiunt. Unde recte Lamech et uxores legitur accepisse duas contra decretum ejus qui dixit: Erunt duo in carne una, et prolem ex his genuisse mundi actibus atque illecebris deditam, ac sic patrato homicidio proprii oris maledictus esse sententia. Porro Enoch ambulasse cum Deo perhibetur. Quae laus hominis major esse poterit? nulla, cum sit comes individuus, in cunctis actibus divinae vestigia sequitur jussionis: quod si fecisset Adam, nequaquam a comitatu Conditoris ad audienda serpentis colloquia pedem avertisset, hactenus cum genere suo toto in paradiso maneret. Quod vero omnes dies Enoch trecenti sexaginta quinque anni esse dicuntur, quo dierum numero annus solis includitur, significat mystice per totum hujus saeculi tempus eos qui fideliter Domino serviunt, et ad aeternam requiem tendunt, nunquam defuturos. Nec frustra trecenti anni seorsum excipiuntur, quibus specialiter ambulasse cum Deo Enoch perhibetur. Hic etenim numerus apud Graecos per T litteram solet notari. T vero littera crucis figuram tenet; et si apicem solum qui deest in medio suscepisset, non jam figura crucis sed ipsum crucis esset signum manifesta specie depictum.

Ambulavit ergo Enoch cum Deo, qui dicitur Dedicatio, trecentis annis; quia nimirum vitam et conversationem expressit, imo ipse egit eorum qui in fide dominicae passionis gaudium perpetuae salutis exspectant, abnegantes seipsos, tollentesque crucem suam quotidie, et sequentes Dominum: quod est aliis verbis dicere, ambulantes cum Deo, et ad ingressum paradisi tendentes. Notandum autem quod cum progeniem Seth usque ad Noe, et deinde usque ad Abraham Scriptura sub tanta distinctione contexuerit, stirpem Cain usque ad Lamech et liberos ejus absque ulla aetatum mentione descripsit, quasi tacite nobis intimans illud Psalmistae: Quoniam novit Dominus viam justorum, et iter impiorum peribit (Psal. I, 6).\
"""
