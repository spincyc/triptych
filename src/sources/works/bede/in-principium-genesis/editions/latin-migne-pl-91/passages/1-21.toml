physical_line_ranges = [[33, 33]]
text = """
Dixit etiam Deus: Producant aquae reptile animae viventis, et volatile super terram sub firmamento coeli. Post ornatam quarto die coeli faciem luminaribus, ornantur consequenter quinta inferioris mundi partes, aquae videlicet et aer, his quae spiritu vitae moventur, quia et haec elementa quadam quasi cognatione et sibi ad invicem et coelo copulantur. Sibi quidem, quia natura aquarum aeris qualitati proxima est; unde exhalationibus earum pinguescere probatur, ita ut nubila contrahat, et possit volatus avium sustinere, attestante Scriptura: Quia subito aer cogetur in nubes, et ventus transiens fugabit eas (Job. XXXVII, 21). Denique per noctes etiam serenas rorat, cujus roris guttae mane in herbis inveniuntur; coelo autem hoc modo junguntur, quia adeo vicinus est ei aer iste, ut et ipse nonnunquam ejus nomen acceperit, sicut volatilia coeli cognominat Scriptura, quae volare constat in aere; et Dominus ipse turbis, quae tempus adventus sui de virtutum ostensione non cognoverant, loquitur dicens: Cum videritis nubem orientem ab occasu, statim dicitis: Nimbus venit, et ita fit; et cum Austrum flantem, dicitis quia ventus erit, et fit. Hypocritae, faciem terrae et coeli nostis probare, hoc autem tempus quomodo non probatis (Luc. XII, 54)? Ubi certum est, quia faciem coeli non aliam quam variantem hunc statum aeris appellat.\
"""
