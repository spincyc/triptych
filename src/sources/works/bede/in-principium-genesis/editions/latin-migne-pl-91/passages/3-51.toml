text = """
Facta est autem fames in terra, descenditque Abram in Aegyptum ut peregrinaretur ibi. Post accepta promissa benedictionis, post ingressam terram promissionis, post aedificatum in ea altare Domino, post invocatum nomen illius, fame tentatur Abraham, et tanta fame, cujus gratia eam quam in promissione acceperat, mox ut vidit et adiit, terram relinqueret; sed et Isaac, sed et Jacob, ac filii ejus, simili cogente necessitate, eamdem promissionis terram relinquebant, et sicut Psalmista canit, pertransierunt de gente in gentem, et de regno ad populum alterum (Psal. X, 13): quod non casu, sed superna utique provisione factum esse credendum est, ut et ipsi videlicet, et omnes ejusdem promissionis haeredes intelligerent, ita se divinae benedictionis dona suscepisse, ut in hac tamen vita labor sibi et afflictio sustinenda temporalis, sed in futuro sit requies ac beatitudo exspectanda perennis, ubi et hoc quoque daretur intelligi, quod ita terra Chanaan in possessionem sit promissa Abrahae ac semini ejus, ut haec magis haereditatem patriae coelestis significet, de qua scriptum est: Justi vero haereditate possidebunt terram, et inhabitabunt in saeculum saeculi super eam (Psal. XXXVI, 29). Quod de terra hujus saeculi quae justis et injustis est communis dictum non esse constat, dum et in saeculum saeculi et a justis possidenda narratur. Promittitur ergo terra Chanaan Abraham et semini ejus, ac post longum laborem Aegyptiae servitutis Jesu duce redditur, ut insinuetur mystice quia promissa nobis olim patria coelestis post afflictionem exsilii praesentis sit reddenda per Jesum Christum Dominum nostrum. Sed et in eadem terra Chanaan filii promissionis nunquam a laborando sive contra hostes certando cessabant, ut intelligerent, sicut praefati sumus, aliam sibi magis patriam post hanc esse quaerendam, in qua veraciter benedictione coelesti et requie fruentur aeterna: cui nimirum dispensationi divinae providentiae congruit etiam hoc quod peregrinans in Aegypto Abraham periclitatus est propter uxorem; sed periclitanti ne laederetur divina protectione subventum est, ut videlicet patesceret quia non solum generalia mundi mala, ut est fames, morbi, captivitas, justi cum reprobis in hac vita subituri, verum etiam speciales ab ipsis reprobis essent tribulationes passuri, pro quibus tantum omnibus ea quae reprobi non norunt praemia in futuro perciperent. Sequitur.\
"""
