text = """
Ecce mille argenteos dedi fratri tuo; hoc erit tibi in velamentum oculorum ad omnes qui tecum sunt, quocunque perrexeris; mementoque te deprehensam. Quando jocando loquitur, eo quod ipsa dixerit eum fratrem suum esse, deprehensamque dicit cum simulando texerit veritatem, dicendo fratrem suum esse eum qui fuit maritus, hortaturque ut hoc in posterum meminerit, ne deinceps simili simulatione idem opprobium deprehensa incurreret. Quod si in hac lectione ubi Sara, Abraham permittente, amata a regibus rapitur, sed Domino procurante intemerata viro redditur, allegoricum quid sentire delectat, significatur Ecclesia tentationibus potestatum mundanarum saepius esse pulsanda, permittente utique Domino, qui vir ejus ob donum supernae protectionis et gratiae vocari dignatus est, ut examinata adversis, manifestius quam sit fide firma, qua castitate Deo devota, quanta denique sui Conditoris custodia ab omnibus semper sit hostium insidiis tutanda, clarescat, neque unquam a suae fidei simplicitate corrumpenda. Quod autem redditurus Saram Abrahae rex donavit simul oves et boves, servos et ancillas, et pecuniam plurimam, illud significat tempus, quo regnum hujus mundi Christianae fidei erat colla submissurum, eamque religionem, quam olim expugnare nitebatur, venerationi habiturum. Quod Sara bis a regibus concupita et rapta, nec tamen polluta est, quondam quidem juvencula a Pharaone, et nunc provectior aetate ab Abimelech, significabat Ecclesiam, quamvis semper in hac vita laboribus exercendam, duas tamen majores caeteris persecutiones experturam; unam Romani imperii, quam velut in juventute sua perpessa, fortissime ac gloriosissime Domino adjuvante superavit; alteram Antichristi, quam velut in senectute, hoc est imminente termino temporalis suae vitae, passura est, atque eodem miserante Domino devictura. Nam quod Sara tantae erat pulchritudinis, ut etiam grandaeva ob gratiam formae potuisset amari, significat Ecclesiam ultimo illo tempore tanta virtutum gloria decorandam, cui hostis acer cum suis satellitibus non minimum invideat, ideoque eam cunctis insidiarum ac virium suarum artibus expugnare contendat; impleta prophetia qua de filiis ejus dicatur: Adhuc multiplicabuntur in senecta uberi, et bene patientes erunt ut annuntient (Psal. XV, 19): id est, ut fidem qua gloriantur constanter inter mala quae patiuntur praedicent. Quod uterque rex ne Saram violaret, Deo procurante, servatus est, significat ita persecutorum rabiem, Domino miserante, cohibendam, ut nemo ex his qui vere ad Ecclesiam pertinent, possit a fidei et charitatis, quae est in Christo, castitate seduci. Quod uterque plagis, ut Saram viro suo redderet compulsus est, raptumque temerarium pecunia simul data correxit, significabat persecutores saepius ab injuria fidelium adversitate ac damnis rerum temporalium esse compescendos; sed et ad reverentiam sive consortium eorumdem fidelium esse commutandos, quod et aliquoties in persecutionibus factum scimus, et in ultima illa caeteris majore credimus esse futurum; et hoc per orationes praesulum spiritalium, atque indulgentiam et miserationem Domini Salvatoris, qui sanctam Ecclesiam sponsae sibi foedere conjungere dignatus est. Utrumque enim beatus Abraham pro Abimelech orans congrue designat et ipsum Dominum Salvatorem qui est ad dexteram Dei, qui etiam interpellat pro nobis, et pastores ac rectores ejusdem Ecclesiae, qui, quoniam castitatis illius curam gerunt, pro adversariis quoque ejus ne eam foedare valeant, verum a coeptis noxiis ocius desistant, Domino supplicare non negligunt. Neque ab re debet videri per Abimelech hominem bonum et timentem Deum, bonorum persecutores posse figurari. Solitum namque est in Scripturis, et per bonos mala, et per malos aliquoties bona designari; nam et beatus papa Gregorius reges impiissimos Saulem et Jechoniam in figura Domini Salvatoris ponere non dubitavit, et e contrario per factum Uriae fidelissimum perfidiam Judaeorum dicit esse designatam.\
"""
