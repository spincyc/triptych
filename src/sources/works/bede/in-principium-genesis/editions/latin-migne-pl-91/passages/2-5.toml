text = """
Iratusque est Cain vehementer, et concidit vultus ejus. Unde noverat Cain respexisse Dominum ad Abel et ad munera ejus; a se autem ac suis muneribus vultum avertisse, nisi quia, sicut quidam interpretati sunt, inflammavit Dominus super Abel et sacrificium ejus, super Cain vero et sacrificium ejus non inflammavit, id est igne misso de coelis hostiam Abel suscepit, quod saepissime factum offerentibus sanctis viris legimus. Cain vero ipse sacrificium suum consumere igne debebat. Nam et hoc significare videtur Apostolus, cum ait: Fide plurimam hostiam Abel quam Cain obtulit Deo, per quam testimonium consecutus est esse justus, testimonium perhibente muneribus ejus Deo (Hebr. XI, 4). Testimonium ergo perhibuit muneribus Abel Deus per ignem, haec suscipiendo de coelis, quo etiam Apostoli testimonio docemur, quod hostia Abel per fidei illius devotionem acceptabilis Deo facta est, et e contrario subintelligere debemus Cain propterea reprobatum, quod non integra suo Conditori fide servierit.\
"""
