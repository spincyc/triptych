text = """
Dixit quoque Deus: Fiat firmamentum in medio aquarum, et dividat aquas ab aquis; et fecit Deus firmamentum, divisitque aquas quae erant sub firmamento, ab his quae erant super firmamentum. Et factum est ita. Vocavitque Deus firmamentum coelum, et factum est vespere et mane dies secundus. Hic nostri coeli, in quo fixa sunt sidera, creatio describitur; quod in medio constat firmatum esse aquarum. Nam suppositas ei esse aquas, et ipsi aere terrisque videmus; superpositas autem non solum hujus Scripturae auctoritate, sed prophetae verbis edocemur, qui ait: Extendens coelum sicut pellem, qui tegis in aquis superiora ejus (Psal. CIII, 2). In medio ergo aquarum firmatum esse constat sidereum coelum, neque aliquid prohibet ut etiam de aquis factum esse credatur; qui enim cristallini lapidis quanta firmitas, quae sit perspicuitas ac puritas novimus, quem de aquarum concretione certum est esse procreatum, quid obstat credi quod idem dispositor naturarum in firmamento coeli substantiam solidarit aquarum? Si quem vero movet quomodo aquae, quarum natura est fluitare semper atque ad ima delabi, super coelum consistere possint, cujus rotunda videtur esse figura, meminerit Scripturae dicentis de Deo: Qui ligat aquas in nubibus suis, ut non erumpant pariter deorsum (Job. XXVI, 8); et intelligat quia qui infra coelum ligat aquas ad tempus cum vult, ut non pariter decidant, nulla firmioris substantiae crepidine sustentatas, sed vaporibus solum nubium retentas, ipse etiam potuit aquas super rotundam coeli sphaeram, ne unquam delabantur, non vaporali tenuitate, sed soliditate suspendere glaciali. Sed etsi liquentes ibi aquas sistere voluit, nunquid majoris hoc miraculi est, quam quod ipsam terrae molem, ut Scriptura dicit, appendit in nihilo? Nam et undae sive Rubri maris, seu fluvii Jordanis, cum ad transitum Israeliticae plebis in altum erectae murorum instar figuntur, nonne evidens dant indicium quod etiam supra rotunditatem coeli volubilem, fixa possint statione manere? Sane quales ibi aquae sint, quosve ad usus reservatae, Conditor ipse noverit; esse tantum eas ibi, quia Scriptura sancta dixit, nulli dubitandum reliquit. Quid sit autem dicere Dei fiat haec vel illa creatura, jam supra dictum est. Dixit enim ut fieret, cum in coaeterno sibi Verbo, unigenito videlicet Filio, cuncta creando disposuit. Cum ergo audimus: Dixit Deus: Fiat firmamentum in medio aquarum, et dividat aquas ab aquis, intelligamus quod in Verbo Dei erat ut fieret, in quo faciendum intus, ante omne tempus, praevidit quidquid foras Deus ex tempore fecit. Cum vero audivimus: Et fecit Deus firmamentum, et divisit aquas quae erant sub firmamento ab his quae erant super firmamentum, et factum est ita, intelligamus factam coeli aquarumque creationem, ac dispositionem non excessisse praescriptos sibi in verbo Dei terminos, juxta illud Psalmistae: Praeceptum posuit, et non praeteribit (Ps. CXLVIII, 6). Quod aeque de creaturis quae sequentibus quatuor diebus factae referuntur intelligendum est. Ubi vero adjunctum audimus: Et vidit Deus quod esset bonum, intelligamus in benignitate spiritus ejus, non quasi cognitum postea quia factum est, placuisse, sed potius in ea bonitate placuisse, ut maneret, ubi placebat ut fieret. Notandum enim quod hujus verbi adjectio hoc in loco in Hebraica veritate non habetur. Et mirum quare inter omnia quae creasse Deus legitur hic solummodo, id est, in secundi diei operibus, probatio divinae visionis minime addatur, quae tamen ipsa cum caeteris quae fecit Deo bona visa esse demonstrantur, cum in sequentibus dicitur: Viditque Deus cuncta quae fecit, et erant valde bona, nisi forte, sicut quidam Patrum exponunt, intelligere nos in hoc Scriptura voluit, non esse bonum duplicem numerum, qui ab unitate dividat, et praefiguret foedera nuptiarum; unde et in arca Noe omnia animalia quaecunque bina ingrediuntur, immunda sunt, et impar numerus esse mundus ostenditur. De his sane quae hactenus exposita sunt, id est de creatione diei primi et secundi, in historia sancti Clementis ita refertur dixisse apostolum Petrum: « In principio cum fecisset Deus coelum et terram, tanquam domum unam, ipsaque ex corporibus mundi reddita est umbra his quae intrinsecus clausa erant, tenebras ex se dedit. Sed cum voluntas Dei introduxisset lucem, tenebrae illae quae ex umbra corporum factae fuerant continuo devoratae sunt; tum deinde lux in diem, tenebrae deputantur in noctem. Jam vero aqua quae erat intra mundum in medio primi illius coeli terraeque spatio, quasi gelu concreta, et cristallo solidata, distenditur, et hujusmodi firmamento velut intercluduntur media coeli ac terrae spatia, idque firmamentum coelum conditor appellavit, antiquioris illius vocabulo nuncupatum, et ita totius mundi machinam, cum una domus esset, in duas divisit regiones. Divisionis autem haec fuit causa, ut superna regio angelis habitaculum; inferior vero praeberet hominibus (Recognit. S. Clem. lib. I, cap. 27). » Haec nostro operi paucis inserere libuit, ut quantum hoc Patrum sensui concordet, lector agnoscat.\
"""
