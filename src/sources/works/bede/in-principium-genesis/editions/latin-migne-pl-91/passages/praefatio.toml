physical_line_ranges = [[1, 5]]
text = """
Migne Patrologia Latina Tomus 91

Hexaemeron (Beda), J. P. Migne

Praefatio AD ACCAM EPISCOPUM HAGUSTALDENSEM.

Dilectissimo ac reverendissimo antistiti Acca, humillimus famulorum Christi Beda salutem.

De principio libri Genesis, in quo mundi hujus creatio descripta est multi multa dixere, multa posteris ingenii sui monimenta reliquere; sed praecipue, quantum nostra pusillitas ediscere potuit, Basilius Caesariensis, quem Eustathius interpres de Graeco fecit esse Latinum; Ambrosius Mediolanensis, Augustinus Hipponensis episcopus; quorum primus libris novem, secundus, vestigia ejus sequens, libris sex, tertius libris duodecim, et rursum aliis duobus specialiter adversum Manichaeos descriptis, prolixa legentibus doctrinae salutaris fluenta manarunt, completo in eis promisso Veritatis, quo dicebat: Qui credit in me, sicut dicit Scriptura, flumina de ventre ejus fluent aquae vivae (Joan. VII, 38). E quibus Augustinus etiam, in libris Confessionum suarum, in libris quoque quos contra adversarium legis et prophetarum eximie composuit; sed et in aliis sparsim opusculis suis nonnullam ejusdem primordialis creaturae memoriam, cum expositione congrua fecit. Verum quia haec tam copiosa, tam sunt alta, ut vix nisi a locupletioribus tot volumina acquiri, tam profunda, ut vix nisi ab eruditioribus valeant perscrutari, placuit vestrae sanctitati id nobis officii injungere, ut de omnibus his, velut de amoenissimis late florentis paradisi campis, quae infirmorum viderentur necessitati sufficere decerperemus. Nec segnior in exsequendo quae jubere es dignatus exstiti; quin potius statim perspectis Patrum voluminibus, collegi ex his, ac duobus in libellis distinxi, quae rudem adhuc possent instituere lectorem, quibus eruditus ad altiorem disceret fortioremque majorum ascendere lectionem. In quo opere sensum per omnia memoratorum aliorumque aeque catholicorum Patrum, nunc ipsis eorum, nunc, breviandi causa, meis sermonibus, nunc tacitis eorum vocabulis, nunc commemoratis, prout opportunitas locorum dictabat, ponere studebam, perduxique opus usque dum ejectus Adam de paradiso voluptatis exsilium vitae temporalis intravit; aliqua etiam de sequentibus sacrae historiae, si Deus voluerit, auxilio vestrae intercessionis comitante, scripturus, dum primo librum sancti Esdrae prophetae ac sacerdotis, in quo Christi et Ecclesiae sacramenta sub figura solutae longae captivitatis, restaurati templi, reaedificatae sanctae civitatis, reductorum in Jerosolymam vasorum quae abducta, rescriptae legis Dei quae incensa fuerat, castigati ab uxoribus alienigenis populi, et uno corde atque anima in Dei servitium conversi, ut propheta simul et historicus conscripsit, parumper perscrutatus fuero, et aliqua ex his quae commemoravi sacramentis apertiora studiosis, Deo favente, reddidero. Bene vale semper, amantissime antistes, nostri memor in Domino.\
"""
