text = """
Infans octo dierum circumcidetur in vobis. Octava etenim die Dominus, id est, post sabbatum resurrexit a mortuis, in cujus passionis ac resurrectionis exemplum baptizamur a vetustate vitiorum absoluti, quasi spiritali circumcisione renovemur; exponente Apostolo ac dicente: Quicunque enim baptizamur in Christo Jesu, in morte ipsius baptizati sumus, consepulti enim sumus cum illo per baptismum in mortem: ut quomodo surrexit Christus a mortuis per gloriam Patris, ita et nos novitate vitae ambulemus (Rom. VI, 3); qui etiam numerus tempori nostrae resurrectionis potest aptissime congruere, quando immortalitate carnis quam per mortem deposuimus universaliter induti, nec peccati aliquid ultra in carne, nec corruptionis sumus aliquid passuri. Nam et nostra resurrectio octavi diei numero non incongure figuratur; quia post sex saeculi hujus aetates et septimam sabbatismi, id est, requiei animarum, quae nunc in alia vita celebratur, futura est. Octava ergo die circumcidi praecipiebantur infantes in signum foederis divini ut indicaretur mystice quia omnes electi per gratiam Dei in hoc numero essent a cunctis iniquitatibus absolvendi, a cuncta corruptione carnis emundandi, ab ipsa morte etiam quam per reatum primae praevaricationis incurrerunt liberandi.\
"""
