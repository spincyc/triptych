text = """
Percusseruntque Raphaim in Astarothcarnaim, et Zuzim cum eis, et Emim in Save, Cariathaim, Raphaim Hebraice, Graece dicuntur Gigantes: singulari autem numero Rapha Gigans vocatur. Terra vero eorum, quae vocabatur Astarothcarnaim, in supercilio erat Sodomorum. Denique usque hodie vicus trans fluenta Jordanis Carnea dictus ostenditur. Interpretatur autem Astarothcarnaim Ovilia cornuum, quia nimirum fortium erant mansiones virorum. Sava autem civitas Emiorum super regionem posita Sodomorum, quae usque hodie sic vocatur. Quod vero additur Cariathaim interpretatur Civitas eorum; et est sensus, percusserunt et Emim in Save civitate eorum, sicut et Septuaginta Interpretes transtulerunt. Emim sane sicut et Zuzim gentem fuisse fortissimam etiam ipso nomine probatur. Zuzim namque Terribiles, Emim dicuntur Horrendi.

Et Horreos in montibus Seir. Hos quidem montes cum finitimis regionibus sequenti post haec tempore filii Esau, qui vocabatur et Seir, eo quod esset pilosus, ejectis Horreis, possederunt: non tamen ipse, ut verisimile videtur, sed alter erat Seir, a quo montes Seir vocabulum acceperunt: patriarcha videlicet Horreorum, de cujus stirpe Esau accepit uxorem, dicente Scriptura in sequentibus: Esau accepit uxores de filiabus Chanaan, Ada filiam Helam Hethei, et Oolibama filiam Anae filii Esebon Evhaei (Genes. XXXVI, 2). Quae autem vel unde haec progenies fuerit paulo post aperitur cum, enumerata stirpe Esau, ita concluditur: hi duces Oolibama filiae Anae uxoris Esau isti filii Esau, et hi duces eorum ipse est Edom; statimque novus subjungitur titulus quod dicitur: Isti filii Seir Horrei habitatores terrae Lotham et Sobal et Sebeon. Et post pauca: Et hi filii Sebeon Achia et Anam. Iste est Ana qui invenit aquas calidas in solitudine cum pasceret asinos Sebeon patris sui, habuitque filium Disan, et filiam Oolibama. Cum ergo Esau uxorem habuit de genere Horreorum, Oolibama filiam Ana filii Sebeon filii Seir, constat utique quia montes Seir, in quibus Horrei percussi sunt, non ab Esau qui longe post natus, ea loca possidere coepit, sed a Seir patriarcha eorumdem Horreorum nomen accepit.\
"""
