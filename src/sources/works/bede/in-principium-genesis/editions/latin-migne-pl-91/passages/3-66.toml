text = """
At vero Melchisedech rex Salem proferens panem et vinum (erat enim sacerdos Dei altissimi) benedixit ei, et ait: Benedictus Deus Abram Deo excelso qui creavit coelum et terram, et benedictus Deus excelsus, quo protegente hostes in manibus tuis sunt, et dedit ei decimas ex omnibus. Notandum primo in hac lectione quia praemonstraverant patriarchae quod praedicant apostoli: Et si quid patitur, inquit Paulus, unum membrum, compatiuntur omnia membra: sive gloriatur unum membrum, congaudent omnia membra (I Cor. XII, 25). Patiente quippe Loth adversa, compassus est Abraham; gaudentibus illis de ereptione ac victoria sua, congratulabatur Melchisedech, ac vincentem eum, qui pro fraternis aerumnis sese periculo dederat, coelesti benedictione perfundit: nec solummodo hominem victorem, sed et largitorem victoriae Dominum digna laude magnificat, juxta illud evangelicum: Videant opera vestra bona, et glorificent Patrem vestrum, qui in coelis est (Matth. V, 16). Deinde intuendum quod post certamen et victoriam benedicitur Abraham; et hoc a rege ac sacerdote Dei altissimi: quia et nos omnes ad promissionem patriae coelestis pertinemus, post labores bonorum operum benedictionem exspectamus regni perennis, quod nobis paratum est ab origine mundi per regem et sacerdotem magnum, Mediatorem videlicet Dei et hominum Jesum Christum; de cujus regno quod habet coaequale et coaeternum cum Patre dicit in psalmo: Dixit Dominus Domino meo, Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum (Psal. CIX, 1), et caetera: de cujus sacerdotio in quo sese obtulit hostiam Patri pro nobis, subdidit in eodem psalmo dicens: Juravit Dominus, et non poenitebit eum, Tu es sacerdos in aeternum secundum ordinem Melchisedech (Ibid. 4). De cujus expositione versus et sacerdotio ac regno Domini Jesu Christi, quod in Melchisedech figuratum est, ideo nostram parvitatem hoc in loco brevissime loqui ac tractare oportet, quoniam Apostolus maximam partem epistolae ad Hebraeos de his sublimissime disputando atque explanando complevit, tantum vestigia ejus sectantes pauca de pluribus quae ille posuit hic inserere commodum duximus.

Itaque Melchisedech Dominum Salvatorem significat: primum quidem, ut Apostolus ait, qui interpretatur rex justitiae, deinde autem rex Salem, quod est rex pacis (Hebr. VII, 2): quibus verbis beatus apostolus ita figuram Melchisedech qualiter sit intelligenda demonstrat, ut et nos apertissime doceat in litteris Testamenti Veteris non solum rerum, sed et nominum significationes quaerere. Sicut ergo Melchisedech vocabulo suo et persona sua Regem justitiae Christum, ita etiam vocabulo suae civitatis Ecclesiam sanctorum, civitatem videlicet magni Regis figurate denuntiat; de qua scriptum est: Et factus est in Salem, id est in pace locus ejus (Psal. LXXV, 3). Salem autem ipsa est quae postea Hierusalem dicta a David rege, totius Judaeae provinciae metropolis facta est, eo quod ibi locum templi emerit, et impensas structurae Salomoni filio dereliquerat, quae videlicet cuncta et alia innumera quae de eadem civitate facta vel dicta leguntur, ad Ecclesiam pertinere cunctis legentibus patet. Qui etiam genere suo sacrificii sui, cujus et Abraham dum benediceret participem fecit, oblationem Novi Testamenti praemonstravit, quam Dominus noster in sacramentum sui corporis ac sanguinis et ipse primus obtulit, et Ecclesiae semper in remissionem peccatorum offerendam reliquit: in cujus participatione singulari omnes promissionis filios benedicendos esse perdocuit: adeo ut nemo absque hujus consortio vitae consors possit esse perennis: Nisi enim manducaveritis, inquit, carnem Filii hominis, et biberitis ejus sanguinem, non habebitis vitam in vobis: qui manducat meam carnem et bibit meum sanguinem, habet vitam aeternam (Joan. VI, 54). In magni ergo significatione sacramenti Melchisedech sacerdos benedixit Abrahae, proferens ei partem sacrificii, quod Domino in pane et vino obtulerat: typice nimirum insinuans quia non solum nos qui post passionem dominicam in carne venimus, sed et ipse Abraham qui acceperat repromissiones, et omne semen ejus electum per oblationem esse dominicae passionis aeterna benedictione donandum. Et quidem idem Abraham audierat a Domino: Et benedicam tibi, et magnificabo nomen tuum, erisque benedictus. Audierat: atque in te benedicentur universae cognationes terrae; sed priusquam ullus ei filius, qui ejusdem benedictionis esset cohaeres, nasceretur; priusquam aliquam Deo hostiam pro donata benedictione gratias acturus offerret, occurrit Melchisedech rex Salem proferens panem et vinum quae Deo obtulerat, et benedixit ei, ut patenter intelligeret quia promissam sibi benedictionem per Regem justitiae et auctorem summae pacis, per pontificem eximium, per sacrificium mysticum panis et vini, esset cum omni suo semine percepturus. Non ergo glorientur Judaei de sacerdotio Levitico contra Christianos, cum illi victimas carnium, nos panem et vinum Domino offeramus. Nostrum namque et tempore et dignitate sacrificium praestat: tempore videlicet, quia prius hoc obtulit Melchisedech, quam illud Abraham vel qui ex eo de stirpe Levi venere pontifices: dignitate autem, quia de hoc non de illo dictum est ad Dominum Christum a Patre: Tu es sacerdos in aeternum secundum ordinem Melchisedech (Psal. CIX, 4). Quod et ipso opere esse completum, et nunc in toto orbe manifestum, non nisi stultus et impius negat. Constat ergo majorem fuisse Melchisedech sacerdotem Abraham patriarcha. Sine ulla enim contradictione, ut Apostolus ait, quod minus est a meliore benedicitur (Hebr. VII, 7). Majus sacrificium Melchisedech hostiis quae in sequentibus obtulisse legitur Abraham: quia hoc Dominus Christus, illud Aaron: hoc Novi Testamenti sacerdotes, illud Veteris erant oblaturi. Unde et bene subditur: Et dedit ei decimas ex omnibus. Quod multum sublimiter intellexit atque exposuit Apostolus; ut decimas ei daret Abraham non solum pro se, verum etiam et pro omnibus eis qui ex se erant nascituri, in quibus fuerunt et ipsi sacerdotes qui decimas erant accepturi a populo: Per Abraham, inquit, et Levi qui decimas accepit decimatus est: adhuc enim in lumbis patris erat quando obviavit ei Melchisedech (Ibid., 9). Sicut ergo praecellebat tribus Levitica, id est sacerdotalis populus, a quo decimas accipiebat; sic et ipsis sacerdotibus ac levitis praecellebat Melchisedech, quando ab eis in patre Abraham accepit: adhuc enim in lumbis erant. Abraham quippe hoc loco populum Israel cum suo sacerdotio designat, porro Melchisedech Mediatorem Dei et hominum cum sacerdotio quod et haeredibus Novi Testamenti reliquit, singulariter exprimit: Et benedicitur, ac decimatur a Melchisedech Abraham, quia ipsi etiam qui in lege ac Levitico sacerdotio praecipui exstiterunt, non nisi a Domino Jesu Christo benedicerentur, non nisi ad eum cuncta quae habere poterant virtutum referrent, et haec ipsius fuisse gratiae confiterentur, salvi esse potuerunt: unde et Petrus, clarescente jam gratia Evangelii, quasi sacerdotio quod secundum ordinem Melchisedech promittebatur futurum, ait aemulatoribus observantiae legalis: Quid tentatis Deum imponere jugum servitutis super cervices discipulorum, quod neque patres nostri, neque nos portare potuimus? sed per gratiam Domini Jesu credimus salvari quemadmodum et illi (Act. XV, 10). Dedit ergo Abraham decimas ex omnibus Melchisedech sacerdoti, a quo benedictionem acceperat: quia nimirum quod ille melioris intellexit sacerdotii typum et imaginem quam ipse praeferebat; hoc est quod ipse legalis, ille pontificatus evangelici figuram gerebat. Ipse enim temporale sacerdotium quod per successiones pontificum servaretur ex se erat generaturus; ille neque initium sacerdotii neque finem neque praecessorem neque successorem habuisse legitur: unde convenienter imaginem praefert illius cui dictum est: Tu es sacerdos in aeternum secundum ordinem Melchisedech. Haec de Melchisedech paucis sint dicta prout nostro operi sufficere videbantur. Caeterum qui plene de illo, deque eis quae figuravit ille sacramentis scire desiderat, totam ad Hebraeos Epistolam sedulus legat.\
"""
