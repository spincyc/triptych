text = """
Et factum est vespere et mane dies sextus. Igitur perfecti sunt coeli, et terra, et omnis ornatus eorum. Senarium numerum constat esse perfectum, quia primus suis partibus impletur, sexta videlicet quod est unum, et tertia quae sunt duo, et dimidia quae sunt tria. Unum etenim et duo et tria faciunt sex, quale in monadibus numeris nusquam praeter hic invenies, sed neque in decadibus praeter vicesimum et octavum numerum. Sex ergo diebus perfecit Deus omnem ornatum coeli et terrae, ut qui omnia in mensura et numero et pondere constituit, ipso etiam numero in quo operaretur sua opera doceret esse perfecta. Complevitque Deus die septimo opus suum quod fecerat. In alia translatione dicitur quia consummavit Deus in die sexto opera sua quae fecit. Quod nihil omnino quaestionis affert, quia manifesta descriptione quae in eo sunt facta declarantur. Sed merito quaeritur quomodo nostra Editio, quae de Hebraicae veritatis fonte descendit, complevisse Deum in die septimo dicat opus suum quod fecerat, in quo nihil novum creasse commemoratur, nisi forte ipsum diem septimum tunc eum fecisse, atque in ejus factura opus suum complevisse dixerimus, quod eo facto mensuram numerumque consummaverit dierum quorum circuitu omnia dehinc saecula ad finem usque procurrerent. Nam in revolutione temporum octavus idem qui et primus computatur dies.

Complevit igitur die septimo Deus opus suum quod fecerat. Quia dierum quos fecerat summam in eo terminavit, addito ipso septimo, quem Sabbatum dici et esse voluit, eo quod eum mystica prae caeteteris benedictione et sanctificatione donaret, ut sequentia docent. Unde etiam dies judicii et consummationis saeculi, quia post septimam Sabbati ventura est, octava in Scripturis nuncupatur, videlicet quia septem soli praecesserint. Dictum enim est in titulo psalmorum: In finem in hymnis pro octava psalmus David, quod de die judicii scriptum totus sequentis psalmi textus docet, in quo iram venturi judicis timens propheta exclamat: Domine, ne in ira tua arguas me, neque in furore tuo corripias me (Psal. VI, 1), etc. Sed et dies dominicae Resurrectionis cum post tot dierum millia ventura esset, octava tamen et ipsa dicta est in titulo alterius psalmi, quia nimirum septimam sequebatur, ut septimanae sequentis prima existeret, id est, eadem ipsa in qua in principio dixit Deus Fiat lux et facta est lux. Quem quidem psalmum de Resurrectione dominica scriptum probat ipse qui in eo loquitur, dicens: Propter miseriam inopum et gemitum pauperum nunc exsurgam dicit Dominus (Psal. XI, 6). Potest autem recte accipi complevisse Deum die septimo opus suum quod fecerat, etiam in eo quod ipsum diem benedixit et sanctificavit. Neque enim nullum opus est benedictio et sanctificatio. Neque Salomon nihil operis fecisse dicendus est, cum templum quod fecerat dedicavit; imo eximium Dei opus est, cum ea quae fecit benedictione ac sanctificatione aeterna glorificavit. Denique de hoc opere quod in aeterno die Sabbati facit, dicit ipse in parabola fidelium servorum: Amen dico vobis quod praecinget se, et faciet illos discumbere, et transiens ministrabit illis (Luc. XII, 37). Qui enim praecingit se, qui discubitum praeparat, qui transit, qui ministrat, utique operatur. Sed his tamen verbis omnibus nihil aliud intimatur, quam quod sanctos suos Dominus in aeternum benedicit et sanctificat, id est, visione suae gloriae post opera illorum bona quae donavit remunerat.\
"""
