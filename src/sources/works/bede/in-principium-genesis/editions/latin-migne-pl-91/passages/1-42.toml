physical_line_ranges = [[67, 67]]
text = """
Produxitque Dominus Deus de humo omne lignum pulchrum visu, et ad vescendum suave, lignum etiam vitae in medio paradisi, lignumque scientiae boni et mali. Hoc eo die factum intelligitur, quo et reliqua ligna fructifera terra, Deo jubente, produxit. Sed hic ideo necessario repetitur, ut qualis sit locus paradisi nosse possemus, maxime quia de ligno vitae lignoque scientiae boni et mali erat specialiter referendum; in quorum uno homini signum obedientiae quam debebat, in altero sacramentum vitae aeternae, quam per ipsam obedientiam mereretur, inerat. Et quidem lignum vitae inde dictum, quia hanc virtutem, ut diximus, divinitus acceperit, ut qui ex eo manducaret, corpus ejus stabili sanitate firmaretur, neque unquam ulla infirmitate vel aetate in deterius mutaretur, aut in occasum etiam laberetur; sed hoc ita corporaliter factum est, ut sacramenti quoque esset figura spiritalis, id est, Dei et Domini nostri Jesu Christi, de quo in laude sapientiae dictum est: Lignum vitae est his qui apprehenderint eam (Prov. III, 18). Et in Apocalypsi sancti Joannis: Qui vicerit, inquit, dabo ei edere de ligno quod est in paradiso Dei mei (Apoc. II, 18). Quod est aperte dicere: Qui vicerit tentationem serpentis antiqui, a qua victus est Adam, dabo ei quod daturus eram Adae si vinceret, ut praesenti visione gloriae Christi in aeternum reficiatur, ideoque nullo possit incursu mortis attingi, quia videlicet Dominus Christus virtus et sapientia Dei Patris in paradiso est regni coelestis, quem cum caeteris sanctis etiam confitenti se in cruce latroni promittere dignatus est. Lignumque sapientiae boni et mali. De hoc ligno sanctus Augustinus: « Mihi autem, inquit, etiam atque etiam consideranti dici non potest quantum placeat illa sententia, non fuisse illam arborem cibo noxiam. Neque enim qui fecerat omnia bona valde, in paradiso instituerat aliquid mali, sed malum fuisse homini transgressionem praecepti. Oportebat autem ut homo sub Domino Deo positus aliunde prohiberetur, ut ei promerendi Dominum suum virtus esset ipsa obedientia, quam possum verissime dicere solam esse virtutem omni creaturae rationabili agenti sub Dei potestate; primumque esse et maximum vitium tumoris ad ruinam, sua potestate velle uti, cui summum vitii nomen est inobedientia. Non est ergo unde se homo Dominum habere cogitaret atque sentiret, nisi ei aliquid juberetur. Arbor itaque illa non erat mala, sed appellata est scientiae dignoscendi bonum et malum; quia si post prohibitionem ex illa homo ederet, in illa praecepti futura transgressione homo per experimentum poenae disceret quid interesset inter obedientiae bonum et inobedientiae malum. Proinde et hoc non in figura dictum, sed vere quoddam lignum accipiendum est, cui non de fructu vel pomo quod inde nasceretur, sed ex ipsa re nomen impositum est, quae, illo contra vetitum tacto, fuerat secutura. »\
"""
