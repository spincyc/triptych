physical_line_ranges = [[205, 206]]
text = """
Sanguinem enim animarum vestrarum requiram de manu cunctarum bestiarum, et de manu hominis, de manu viri et fratris ejus requiram animam hominis. Quicunque effuderit humanum sanguinem, fundetur sanguis ipsius. Sanguinem enim animarum typice dicit ipsum vitale quo vegetantur, et sustentantur, et vivunt homines in carne per animam, sicut etiam manum bestiarum typice vocat ipsum devorandi effectum, quo hominem occidunt. Quis namque sanum sapiens veraciter sanguinem hominis ad substantiam animae credat pertinere? quamvis idem legislator alibi manifestius dicere videtur: Anima enim omnis carnis in sanguine est (Levit. XVII, 14). Sic etenim dictum est hoc quomodo dictum est Petra autem erat Christus, non quod hoc erat, sed quod hinc significabatur. Non autem frustra lex voluit animam significare per sanguinem, rem scilicet invisibilem per rem visibilem, nisi quod sanguis per venas omnes ab ipso corde diffusus in nostro corpore plus caeteris humoribus principatur, ita ut ubicunque fuerit vulnus inflictum, non humor alius, sed ipse procedat. Itaque anima quae omnibus quibus constamus invisibiliter praevalet illo melius significatur quod omnibus quibus constamus visibilibus praevalet. In promptu est autem intelligere quomodo de manu hominis requirat Deus animam hominis, ultionem expetens ab eo qui peccavit; sed quaeri merito potest quomodo et a bestiis quae rationis sunt expertes requiratur, nisi forte mysterium futurae resurrectionis hic nobis intimatum intelligere valemus, quando cuncta generis humani corpora quae vel a feris comesta, vel alio quolibet consumpta modo, sive corrupta fuerant, incorrupta redduntur, cunctae animae hominum quocunque genere mortis separatae a corpore sua quaeque remittuntur in corpora, ut vel vitam pro bonis, vel mortem pro malis meritis in judicio cum eisdem corporibus consequantur aeternam. Apte autem additur:

Quicunque effuderit sanguinem humanum, fundetur sanguis illius. Quanti effuderunt sanguinem humanum, et sanguis eorum effusus non est. Et alii occiderunt hominem veneno, vel suspendio, et tamen cum homo mortuus sit, non est sanguis effusus; quomodo ergo Dominus effusurus est sanguinem eorum in tali homine, cum ille qui occidit sanguinem non effudit, nisi quia sanguis hominis, ut diximus, ipsum vitale ejus quo subsistit debet intelligi? quod qui effuderit, id est, qui aliquo genere mortis hominem occiderit, fundetur sanguis illius, quia peccando vitam perdit aeternam. Anima enim quae peccaverit, ipsa morietur (Ezech. XVIII, 20). Cui simile est hoc quod Petro dicitur: Omnes enim qui acceperint gladium gladio peribunt; ac si aperte diceretur: Omnes qui injuste occidunt hominem, et iidem occisione ipsi in anima pereunt. Apte autem subditur:\
"""
