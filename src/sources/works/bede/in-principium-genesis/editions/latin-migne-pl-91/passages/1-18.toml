text = """
Ut lucerent super terram, et praeessent diei ac nocti, et dividerent lucem ac tenebras. Haec et de luminaribus magnis et de stellis intelligi possunt ea tantum distinctione, ut quod dictum est et praeessent diei, ad solem specialiter; quod subjunctum, et nocti, ad lunam et stellas pertineat; quod vero subinfertur et dividerent lucem ac tenebras, omnibus aeque sideribus conveniat, quae ubicunque incedunt lucem secum circumferunt, ubi autem absunt tenebrosa cuncta relinquunt. Sin autem quaerit aliquis quale poterit esse lumen diurnum ante creationem siderum, non ab re quod tale fuerit, quale videmus quotidie mane, approximante scilicet solis ortu, sed necdum terris apparente, quando lucet quidem obtusis stellarum radiis dies, sed minime adhuc donec sol oriatur, refulget. Unde nulla tunc esse discretio temporum praeter diei solum et noctis poterat, meritoque factis sideribus dictum est: Et sint in signa et tempora, et dies et annos. Coeperunt namque discerni temporum vices ex quo sol die quarto mundi nascentis, a medio procedens orientis, aequinoctium vernale suo consecravit exortu, et quotidianis profectibus ad alta coeli culmina scandendo, rursumque a solstitiali vertice ad infima paulatim descendendo, ne mora ab infimis hibernisque locis aequinoctiales gyros repetendo, discretis temporibus quatuor notissimis diebusque praefinitis anni spatium complevit. Sed et luna vespere plena apparens, ea quae in celebrationem paschae servanda erant tempora primo suo praefixit ascensu. Ipsa est enim hora qua non solum antiquus ille populus Dei, sed et nos hodie primam in agendo pascha servamus, cum aequinoctii die transcenso, plena vespere luna, hoc est, quarta decima, in faciem coeli prodierit. Nam mox post haec ut Dominicus dies advenerit, aptum hoc celebrandae resurrectionis dominicae tempus instabit, completo ad litteram quoque prophetae verbo, qui dixit: Fecit lunam in tempora, sol cognovit occasum suum (Psal. CIII, 19). Stellae quoque, excepto quod supra diximus, quia vel sua specie quae sit futura qualitas aeris, vel suo cursu quota sit vigilia noctis, ostendunt; sunt in signa et tempora, quia hae in coelum venientes aestiva tempora, illae designant hiberna. Sunt et in dies, quia istae in vernis diebus solem, illae comitantur autumnalibus. Sunt et in annos, quia quae nunc verbi gratia in aequinoctio verno matutinae oriuntur, ipsae omnibus annis in eodem aequinoctio in coeli faciem veniunt; quae nunc in solstitio vespere vel mane, hae semper in illo eisdem horis oriuntur. Sed et quaedam sunt stellae quas planetas, id est, errantes vocant astrologi, quae majores annos suo circuitu faciunt, quo ad eumdem coeli locum redeunt. Nam stella quae Saturni dicitur, triginta annis, quae Jovis, duodecim annis, quae Martis, duobus annis fertur solaribus, circuitu coeli expleto, ad eadem loca siderum, in quibus fuerant ante redire. Luna quoque cum duodecies spatia sui cursus peregerit, annum facit communem, id est, dierum trecentorum quinquaginta quatuor, et ut anno solari posset ejus concordare circuitus, tertio quoque vel secundo anno tertium decimum addit mensem, quem embolismum vocant annum calculatores, et fit dierum trecentorum octoginta et quatuor.\
"""
