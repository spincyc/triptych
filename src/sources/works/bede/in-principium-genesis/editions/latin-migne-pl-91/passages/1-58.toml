text = """
Quamobrem relinquet homo patrem suum et matrem, et adhaerebit uxori suae, et erunt duo in carne una. Quae primi cum verba hominis fuisse Scriptura ipsa testatur, Dominus tamen in Evangelio Deum dixisse declaravit. Ait enim: Non legistis quia qui fecit ab initio masculum et feminam fecit eos, et dixit: Propter hoc dimittet homo patrem et matrem et adhaerebit uxori suae, et erunt duo in carne una (Matth. XIX, 4), ut hinc intelligeremus propter exstasim quae praecesserat in Adam, hoc eum divinitus tanquam prophetam dicere potuisse. Si ergo Christus adhaesit Ecclesiae, ut essent duo in carne una, quomodo reliquit Patrem, quomodo matrem? Reliquit Patrem, quia cum in forma Dei esset, non rapinam arbitratus est esse se aequalem Deo, sed semetipsum exinanivit formam servi accipiens (Phil. II, 6). Hoc est enim reliquit Patrem, quia non deseruit et recessit a Patre, sed quia non in ea forma apparuit hominibus, in qua aequalis est Patri, quomodo reliquit matrem relinquendo Synagogam Judaeorum, de qua secundum carnem natus est, et inhaerendo Ecclesiae, quam ex omnibus gentibus congregavit, ut pace Novi Testamenti essent duo in carne una: quia cum sit Deus apud Patrem per quem facti sumus, factus est per carnem particeps noster, ut illius capitis corpus esse possemus.\
"""
