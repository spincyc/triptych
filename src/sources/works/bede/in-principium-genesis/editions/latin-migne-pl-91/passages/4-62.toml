text = """
Respiciensque uxor ejus post se versa est in statuam salis. Hoc vere juxta litteram factum esse credendum est. Denique Josephus refert usque ad sua tempora eamdem salis statuam in portis ejusdem civitatis perdurasse. Et quidem uxor metu femineae fragilitatis ad clamorem pereuntium repentinum, et fragorem flammarum coelo delapsarum, retro respexit; sed eorum tamen tenet in hac infirmitate figuram, qui semel mundo renuntiantes, ac virtutum iter arduum inchoantes, repente ad ea quae reliquerant mundi desideria, instabili et velut muliebri corde recurrunt; de quibus apostolus Petrus: Melius, inquit, eis fuerat non cognoscere viam justitiae, quam post agnitionem retrorsum converti ab eo, quod illis traditum est, sancto mandato (II Petr. II, 20); sicut e contra Lot qui sua quae possederat omnia cum peccatoribus peritura reliquit, illos qui vere mundo abrenuntiant, neque eos abrenuntiasse poenitet, insinuat; quos etiam beatus Noe, qui et ipse cuncta sua cum reprobis, sicut hic ignibus, sic ille undis absumenda reliquit, manifeste designat; quod autem uxor Lot, dum se ab itinere quod Dominus ostendebat, avertisset, exstincta et in statuam salis conversa est; apte indicat quod hi qui a via veritatis repetendo vitia declinant, ipsi quidem in sua pravitate pereunt; sed exemplo perditionis suae aliis quasi condimentum sapientiae relinquunt, ut hi eorum interitum reminiscentes, cautius se et circumspectius in arrepto justitiae proposito custodiant. Denique Dominus admonens fideles ne coeptum fidei callem deserant, quasi petram eis salis, quo dulcius ejus verba sapiant, adhibet, cum dicit inter alia: Memores estote uxoris Lot (Luc. XVII, 32). Qui ergo ignem vitiorum, qui ultimum evadere judicium desiderat, oportet ut praeteritorem obliviscens, in ea quae ante sunt divinae promissionis gaudia semper intendat.\
"""
