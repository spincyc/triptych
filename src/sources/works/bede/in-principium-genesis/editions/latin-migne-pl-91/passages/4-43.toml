text = """
Erant autem ambo senes provectaeque aetatis, et desierant Sarae fieri muliebria. Ad faciendam auxesin potentiae coelestis, ambos dicit esse seniores, et insuper Saram, cum fuisset sterilis, tum etiam cruore menstruo jam destitutam, propter quod jam parere non posset, etiamsi sterilis non fuisset. Porro si femina ita sit provectioris aetatis, ut ei solita mulierum adhuc fluant, de juvene parere potest, de seniore non potest; quamvis adhuc possit ille senior, sed de adolescentula gignere, sicut Abraham post mortem Sarae de Cethura potuit, quia vividam ejus invenit aetatem; hoc ergo est quod nimirum commendat Apostolus cum ait: Qui praeter spem in spe credidit, ut fieret pater multarum gentium, secundum quod dictum est ei: Sic erit semen tuum; et non infirmatus in fide non consideravit corpus suum jam emortuum, cum fere centum esset annorum, et emortuam vulvam Sarae, in promissione etiam Dei non haesitavit (Rom. IV, 18). Ad hoc enim dicit Abrahae jam corpus fuisse emortuum, quoniam non ex omni femina, cui adhuc esset aliquod pariendi tempus extremum, generare ipse in illa aetate adhuc posset: ad aliquid enim emortuum corpus intelligere debemus, non ad omnia; nam si ad omnia, non jam senectus vivi, sed cadaver est mortui.\
"""
