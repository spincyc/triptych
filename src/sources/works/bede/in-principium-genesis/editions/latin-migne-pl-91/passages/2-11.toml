text = """
Dixitque ad eum: Quid fecisti? Vox sanguinis fratris tui clamat ad me de terra. Magnam vocem habet sanguis, non solum Abel, sed et omnium interfectorum pro Domino: vox est enim sanguinis eorum ipsa fidei constantia, ipse fervor charitatis, per quem pati pro Domino meruere. Ipse clamat ad Dominum de terra: quia etiamsi in abditis terrae sinibus sicut Abel fuerint ab impiis interempti, causa tamen ipsa mortis eorum in conspectu interni arbitri pretiosa existit et clara, juste postulans ut et hi qui in sua simplicitate sunt injuste perempti, coronentur; et illi qui eos injuste persequendo trucidavere, damnentur. Eorum ergo sanguis occisorum clamat ad Dominum, quorum et vita ante mortem clamasse probatur ad illum, qui dicere solent: Clamavi in toto corde meo, exaudi me, Domine, justificationes tuas requiram (Psal. CXVIII, 145). Ille enim ad Dominum corde clamat, qui magna postulat, qui coelestia precatur, qui aeterna sperat, qui non gloriam hujus saeculi ab illo, sed justificationum ejus custodiam requirit. Qui videlicet clamor unde in cordibus justorum nascatur docet Apostolus dicens: Misit Deus Spiritum Filii sui in corda nostra clamantem abba Pater (Gal. IV, 6); clamantem namque in cordibus nostris ad Patrem dicit Spiritum, quia nimirum ipse haec ad clamandum cum impleverit accendit. Hunc clamorem piae devotionis et animas martyrum post mortem habere manifestat Joannes cum ait: Vidi sub altare animas interfectorum propter verbum Dei et propter testimonium quod habebant, et clamabant voce magna dicentes: Usquequo, Domine sanctus et verus, non judicas, et vindicas sanguinem nostrum de his qui habitant in terra (Apoc. VI, 9)? Clamant enim haec animae sanctorum non odio inimicorum, sed amore justitiae, quam semper esurire ac sitire didicerunt, simul et desiderio recipiendae suae carnis, ut quam pro Domino in mortem dederant, in hac immortali atque incorruptibili Domino astare mereantur. Magna autem est vox clamoris eorum, magnum est desiderium justitiae. Clamante vero ad Dominum sanguine sanctorum, id est justam ultionem suae, injustae necis expetente, quid de persecutoribus eorum agatur, subsequenter ostenditur, dicente Domino ad Cain:\
"""
