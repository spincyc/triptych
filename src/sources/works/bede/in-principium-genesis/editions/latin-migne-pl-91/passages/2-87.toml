physical_line_ranges = [[216, 217]]
text = """
Dilatet Deus Japheth, et habitet in tabernaculis Sem. In tabernaculis quippe Sem habitat Japheth, quia in fide patriarcharum et prophetarum, in Scripturis propheticis, in sacramentis legalibus spiritaliter intellectis, peregrinatur Ecclesia in terris. Tabernaculis namque in bello vel itinere uti solemus, et in tabernaculis Israelitici populi nos, qui de gentibus ad Christum venimus, habitamus, quia nimirum quandiu in hujus vitae via positi coelestem patriam suspiramus, quandiu contra insidias antiqui hostis, Christo duce atque adjutore, certamus, necesse est ut semper antiquorum patrum dicta pariter et facta et opera in exemplum vitae et professionis teneamus; quatenus horum auctoritate protecti, certius ac securius ad palmam remunerationis perfecto agone tendamus. Congruit autem profectibus sanctae Ecclesiae, quibus orbem implevit totum, etiam nomen Japheth, quod Latitudo dicitur; unde alludens ad nomen ipsum, dicit Noe: Dilatet Deus Japheth, id est, latitudinem. Bene autem quod dictum fuerat de Sem repetitur et de Japheth: Sitque Chanaam servus ejus, quia nimirum utroque populo credentium Judaei perfidi, quamvis impia mente, salutis praebent obsequium, non solum in eo quod auctoritate sacrorum voluminum eos juvant, atque in fide corroborant, verum etiam in illo quod eos, quantum valent, insequuntur, quia videlicet insequendo propter justitiam, altius eos participes aeternae beatitudinis reddunt, nec non et in eo quod offensa sua duritia caecitatis majores gratias illos suo Redemptori atque illustratori reddere monent. Cui nimirum populo nomen Chanaam, quod interpretatur Commotio, aptissime convenit. Non enim potest dicere: Statuit supra petram pedes meos, et direxit gressus meos (Psal. XXXIX, 3); sed incertus et fluctuans semper in motu est. Notandum autem etiam juxta sensum litterae quod non frustra Cham peccante, non ipse, sed filius ejus Chanaam maledicitur, maxime cum non ipse primogenitus Cham, sed ultimus esset filius. Scriptum quippe est: Filii Cham, Chus, Saba, et Mesraim, et Phuth, et Chanaam. Praevidebat enim pariter in spiritu quod progenies Chanaam amplius multo quam caetera stirps filiorum Cham esset peccatura, ideoque digna futura quae vel maledictione periret, vel servitio subacta gemeret; quod Sodomorum maxime qui de genere Chanaam exiere vel scelere nefando, vel horrenda ultione, probatum est ostensum, et exterminio, sive servitio, Chananaeorum, quod, egressa de Aegypto plebe Israelitica, quae de stirpe Sem descenderat, perpessi sunt. De Chus namque Aethiopes, de Mesraim Aegyptii, de Phuth orti sunt Lybies, quod ipsa earumdem gentium apud Hebraeos usque hodie vocabula testantur, de quibus omnino nihil talis flagitii vel vindictae, quale de Sodomitis et Chananaeis Scriptura refert.

Dilatavit quoque Deus Japheth, ut habitaret in tabernaculis Sem, et esset Chanaam servus ejus, cum Graeci sive Romani, exorti utique de genere Japheth, regna Asiae, in quibus posteri Sem habitabant, possiderent, et inter alia Chananaeos quoque sibi tributarios facerent.\
"""
