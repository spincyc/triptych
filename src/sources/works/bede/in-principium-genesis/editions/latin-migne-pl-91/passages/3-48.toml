text = """
Cumque venissent in eam, pertransivit Abram terram usque ad locum Sychem, usque ad convallem illustrem. Chananaeus autem tunc erat in terra: apparuitque Dominus Abram, et dixit ei: Semini tuo dabo terram hanc: qui aedificavit ibi altare Domino. Supra legitur quia commorantem adhuc in Haran Abram Dominus allocutus est, eumque multiplici benedictione promissa, exinde abire, et in terram quam ipse monstraret, venire praecepit: quod ubi fecit, et divinis libenter obedivit praeceptis, mox majore Dei gratia dignus efficitur; ita ut non solum allocutione ejus, sicut prius, sed et visione frui mereretur. Qui cum eadem visione atque allocutione divina cognovisset hanc esse terram, quam sibi possidendam promiserat; confestim eam quasi vir Deo devotus posito altari ei attitulare, atque ad offerendas ei victimas consecrare curavit. Verum quia sacra historia mysteriis typicis est plena, notandum quod eadem Domini apparitio atque altaris erectio in loco Sychem et in convalle illustri facta esse memoratur, quae convallis illustris figurate, nisi humilitas intelligenda est? quam vocati a Domino a laboribus et oneribus saeculi hujus primam inter virtutes habere debemus, dicente ipso: Discite a me quia mitis sum et humilis corde, et invenietis requiem animabus vestris: jugum enim meum suave est, et onus meum leve est (Matth. XI, 29). Cujus oneris portationi congruit mystice locus Sychem, quia hic cum valle illustri pariter nominatur: Sychem quippe Latine in humeros transfertur, quia nimirum cum humilitate mentis bonorum nos operum oportet onera gestanda suscipere: quod cum agere sollicite curamus, mox dominicae visitationis et consolationis accipere gratiam merebimur, ut paulatim ad sublimiores virtutum gradus valeamus ascendere. Unde recte de processibus itinerum Abrahae quae bonorum operum profectus designant, adjungitur:\
"""
