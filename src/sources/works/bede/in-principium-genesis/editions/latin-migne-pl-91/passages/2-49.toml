text = """
Fecit ergo Noe omnia quae mandaverat ei Dominus, eratque sexcentorum annorum quando diluvii aquae inundaverunt super terram. Et ingressus est Noe, et filii ejus, uxor ejus, et uxores filiorum ejus cum eo in arcam, et caetera. Aetas Noe magnam eorum qui Ecclesiam ingrediuntur, et per fidem atque actionem fide condignam ad aeterna gaudia perveniunt, perfectionem designat. Sexies enim centeni fiunt sexcenti; senarius autem numerus, in quo factus sive formatus est mundus, non immerito perfectionem designat bonae actionis. Centenarius vero, qui, sicut et supra meminimus, in computo digitali de laeva transfertur in dextram, maxime convenit eis qui in novissimo examine ad dextram stantes Judicis, audituri sunt: Venite, benedicti Patris mei, percipite regnum (Matth. XXV, 34). Et ideo multiplicatus per senarium numerus centenarius illam virtutum spiritualium perfectionem designat, quae non ad hominum favorem ostentata forinsecus, sed ad gloriam est Conditoris in spe supernae retributionis impleta, meritoque praesul arcae, in qua Ecclesiae status est expressus, etiam in tempore suae aetatis devotionem designat eorum qui hanc ita ingrediuntur, ut etiam per bonae merita actionis ad salutem transire mereantur aeternam; quamvis et ita recte possit intelligi, quia cum aquae diluvii baptismatis undam designant, tunc aetas Noe perfectionem, ad quam hi qui baptizantur contendere debeant, insinuet. Cum vero tempus ultimi examinis praefigurant, tunc idem annorum ejus numerus quales cum Domino ad requiem perpetuam, quod nomen Noe sonat, intraturi sint figurate denuntiat, id est, effectu boni operis et intentione mundi cordis coelesti introitu digni.\
"""
