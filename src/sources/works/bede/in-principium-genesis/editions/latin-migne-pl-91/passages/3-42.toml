text = """
Duxerunt autem Abram et Nachor uxores. Nomen uxoris Abram Sarai, et nomen uxoris Nachor Melcha, filia Aran patris Melchae et patris Jeschae. Dicunt majores nostri Jescham hanc ipsam esse Saram uxorem Abrahae, quia videlicet iidem fratres germani Abraham et Nachor duas sorores filias Aran uxores habuerint. Quod si ita est, non potest Aran pater earumdem idem intelligi qui fuit frater junior Abrahae et Nachor, sed alter ejusdem nominis homo. Constat enim quia Abraham decem solum annis Saram conjugem suam praecessit, dicente ipso coram Domino: Putasne centenario nascetur filius, et Sara nonagenaria pariet filium (Genes. XVII, 37)? Et quomodo frater ejus junior potuit habere filiam, quae illo decem annis minor esset, se autem ipso septem aut non amplius quam octo?\
"""
