physical_line_ranges = [[198, 198]]
text = """
Locutus est autem Deus ad Noe dicens: Egredere arcam tu et uxor tua, filii tui et uxores filiorum tuorum tecum; cuncta animantia quae sunt apud te ex omni carne, tam in volatilibus, quam in bestiis, et universis reptilibus quae reptant super terram educ tecum; et ingredimini super terram. Crescite et multiplicamini, et replete eam. Egressus est ergo Noe et filii ejus, et caetera. Multifariam multis modis eadem Christi Ecclesiae mysteria saepius iterata significatione repetuntur. Egressio ergo Noe de arca in terram diluvio mundatam cum his quos secum induxerat hominibus et animantibus, illi tempori figurate convenit, cum quique fidelium fonte baptismatis abluti ad exercenda etiam in publico bona opera, Christo duce, spiritali videlicet Noe procedunt, et continuo virtutum spiritualium augmento crescunt et multiplicantur. Euntes, inquit, in mundum, docete omnes gentes, baptizantes eos in nomine Patris et Filii, et Spiritus sancti (Matth. XXVIII, 19); quod est figurate dicere: cuncta animantium genera in arcam aquis diluenda inducite, statimque adjunxit: Docentes eos servare omnia quaecunque mandavi vobis (Ibid., 20), quasi typice diceret: Et egressa post diluvium animantia de arca ingrediantur in novam terrae faciem, novis vernantem floribus, ibique multiplicentur et crescant. Quod autem vigesima septima die mensis egrediuntur arcam, qui est numerus ternarius quadratus solidus, ut praefati sumus, significat perfectionem fidei quae in baptismo consecratur, quod nulla possit ex parte titubare, sed adversus omnes diaboli insidias invicta semper ac stabilis perduret. Notandum, quasi juxta litteram quod annum solis integrum fuerunt in arca qui septima decima die mensis secundi eam ingressi sunt, et post annum vicesima septima die ejusdem mensis egressi. Si enim hodierna die, verbi gratia, per Kalendas Apriles esset luna septima decima, sequenti anno pridie Kalendarum earumdem vicesima septima esset luna ventura, decursis ex ordine diebus trecentis sexaginta quinque, quibus annus solis expletur. Anno ergo toto erant in arca, id est, quousque sol, transcurso circulo signifero, per duodecim suos menses omnes mundi plagas illustraret, ut sicut aqua orbem totum operiens diluebat, ita velut cooperans illi sol eodem temporis spatio totum circuiens orbem luce sui fulgoris irradiaret. Quomodo autem Fons vitae Dominus, sic et Sol justitiae solet figurate vocari. Fons, quia regenerat; Sol, quia nos illuminat, juxta illud Psalmographi; Quoniam apud te est fons vitae, et in lumine tuo videbimus lumen (Psal. XXXV, 10). Et anno solis integro erat Noe cum his quae salvanda erant per diluvium animantibus et hominibus in arca, quia Dominus per totum hujus saeculi tempus, perque omnes orbis plagas Ecclesiam suam et unda lavacri salutaris abluit, et gratia sui Spiritus illustrat.\
"""
