text = """
Et circumcidit eum octava die, sicut praeceperat ei Deus cum centum esset annorum. Sicut Isaac in tempore quidem veteris testamenti natus est, sed ipsa sua nativitate haeredes novi testamenti designat, ita et circumcisio qua consecratus est veteris quidem testamenti sacramentum est, sed in figuram gratiae novi testamenti praemissum, qua mundus erat in Christo ab omni peccati et mortis et mortalitatis sorde purgandus. Namque eo tempore circumcisio fideles ab originalis noxae nodo solvebat; attamen in altioris typum gratiae data est, qua regnum omne peccati et mortis dominica erat passione ac resurrectione destruendum; in cujus exemplum nos et in baptismo ab omnibus peccatis absolvimur, et in novissimo die ab omni carnis et animae corruptione ac mortalitate renovati ad vitam aeternam perveniemus; ubi, sicut Dominus ait, filii resurrectionis non nubent neque nubentur, sed sunt sicut angeli in coelo; neque enim ultra mori poterunt (Marc. XII, 25). Et quia Dominus octava die, id est post Sabbatum resurrexit a mortuis, quia nos quoque octava aetate resurrecturos esse speramus; sex quippe sunt aetates hujus mundi, septima sabbatismi animarum in alia vita, octava ipsa resurrectionis nostrae et universalis judicii; recte circumcisio octava die fieri praecepta est. Quod autem Abraham centum erat annorum cum natus esset Isaac et circumcisus filius promissionis, perfectioni ejusdem promissionis aptissime concinit. Nam quia centenarius perfectus est numerus, quod eo maxime astruitur quia de laeva transfertur in dexteram; ideoque coelestibus ac perpetuis bonis mystice competit, recte in hoc nascitur Isaac, qui sua nativitate mirabiliter senibus natus parentibus, haeredes non temporalis et infimi, sed aeterni in coelis regni designaretur, in quo nimirum sacramento et arca Noe centum annis fabricata est, et Abraham in terra repromissionis centum annos moratus, et Isaac in Geraris serens invenit ipso anno centuplum, et atrium tabernaculi centum cubitis est longum; et in parabola seminis evangelici, terra bona centuplum fructum fecit, et Dominus relinquentibus propria centuplum in hoc tempore et insuper vitam promittit aeternam: in quibus omnibus numerus centenarius aut gaudia vitae perennis, aut ea quibus ad haec pervenitur bona opera designat.\
"""
