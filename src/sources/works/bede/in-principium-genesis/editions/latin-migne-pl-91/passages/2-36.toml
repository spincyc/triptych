text = """
Postquam enim ingressi sunt filii Dei ad filias hominum, illaeque genuerunt: isti sunt potentes a saeculo viri famosi. Notandum autem quod hoc in loco pro gigantibus, in Hebraeo cadentes, id est, annasilim leguntur; facilisque atque absolutus est sensus, quia cadentes erant in terram homines in diebus illis, id est, terrenis concupiscentiis adhaerentes, amisso statu Deo devotae rectitudinis. Gigantes autem illorum lingua proprie Rafaim nominantur. Ponitur vero et gigans aliquando in bono, ut est istud de Domino: Ex ultavit ut gigans ad currendam viam (Psal. XVIII, 6); sed hoc pro potentia singulari qua caeterum genus humanum jure transcendit, dispositumque Incarnationis sacramentum mirabili virtute peregit, sicut etiam leo aliquando Dominum, aliquando diabolum designat; sed diabolum, propter superbiam et ferocitatem; Dominum, propter potentiam: quamvis in Hebraica veritate memoratus psalmi versiculus ita scriptus sit: Exsultavit ut potens ad currendam viam.\
"""
