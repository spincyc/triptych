text = """
Apparuit autem ei Dominus in convalle Mambre sedenti in ostio tabernaculi sui in ipso fervore diei, etc. Haec apparitio Domini cunctis superioribus, quibus beato Abrahae toties visus est, constat esse sacratior. Et recte post acceptum circumcisionis sacramentum, post amplificatum nomen quo futurus pater omnium gentium signabatur, secretiora Dei arcana cognoscit, quorum videlicet arcanorum quia non solum circumcisio, sed et praeputium particeps esse debuit, recte apparitio in convalle Mambre facta esse memoratur, Mambre namque, ut supra legimus, genere quidem Amorrhaeus, sed cum fratribus suis foederatus erat Abrahae; unde apte convallis Mambre nostram designat humilitatem, qui de gentibus originem carnis habentes, patrem in spiritu ac fide habemus Abraham, quibus dicit Apostolus trahens ex Abraham et carnis et virtutis originem: Annuntiamus vobis vitam aeternam, quae erat apud Patrem, et apparuit nobis; quod vidimus et audivimus annuntiamus vobis, ut et vos societatem habeatis nobiscum (I Joan. I, 2). Et quidem in hac lectione, excepto spiritali intellectu, multum aedificat legentes, quod Abraham ignotos viros aspiciens, statim cucurrit in occursum eorum quasi peregrinis hospitalitatis gratiam praebiturus; quod appropians eis humiliter adoravit in terra, quod ministerium suum eos exspectare atque accipere rogavit, quod consentientibus festinus exhibuit; neque hoc per servos et ancillas, sed per seipsum et Saram complevit. Mirum namque, si non homines, eos cum primo vidisset, credidit, cur ac lavandum pedes eis afferre voluerit aquam; quomodo requiescere sub arbore quasi in ambulando fessos; quare corpus correficiendo confortare, quasi jejunio laborantes, rogaverit. Si quis vero hanc lectionem altius discutere quaerit, totam spiritales redolere sensus inveniet. Nam quod Abrahae sedenti in ostio tabernaculi sui Dominus apparuit, multum congruit devotioni ipsius Abrahae, simul et omnium ejusdem promissionis haeredum, qui peregrinos se hujus saeculi et incolas, cives vero alterius vitae, hoc est patriae coelestis, esse testantur. Tabernaculis vero in itinere vel in bello, domo autem in patria uti solemus, in quo mysterio etiam Isaac et Jacob in tabernaculis habitasse leguntur. Manet autem in medio tabernaculi sui quicunque et peregrinum se, nec semper victurum in hoc saeculo novit, et nihilominus quantum valet saeculi negotiis atque illecebris sese implicare non erubescit. Abraham vero et ejus sequaces qui necessitate tantum, non autem et voluptate, quae mundi sunt agunt, quasi in ostio tabernaculi sui sedent, quia jam jamque exire de mundo parati, ingressum vitae sequentis laetanti semper animo atque ad futura praemia extento praestolantur. Et bene additur, in ipso fervore diei; fervor quippe diei, in quo Abraham in ostio tabernaculi sui sedebat, virtutem designat dilectionis, qua ipse in mente respectu Solis justitiae ardebat, talisque status et loci et temporis decebat eum qui Dominum erat visurus, et ejus colloquio fruiturus, in quo et advena mundi hujus figuraretur, et verae coelestis gratiae luce irradiatus, et amore divinae contemplationis inhianter accensus.\
"""
