text = """
Et benedixit diei septimo et sanctificavit illum. Illa videlicet benedictione et sanctificatione quam populo suo in lege plenius intimat dicens: Memento ut diem Sabbati sanctifices. Sex diebus operaberis, et facies omnia opera tua: septimo autem sabbati Domini Dei tui, non facies omne opus (Exod. XX, 8). Et paulo post: Sex enim diebus fecit Dominus coelum et terram, mare et omnia quae in eis sunt, et requievit in die septimo (Exod. XX, 11). Idcirco benedixit Dominus diem septimum et sanctificavit eum. Quae profecto benedictio et sanctificatio diei septimi in typum majoris benedictionis ac sanctificationis facta est. Nam sicut per crebras, imo quotidianas in lege victimas, sanguis Dominicae passionis, qui semel erat pro salute mundi effundendus, signabatur; ita etiam per requiem diei septimi, quae post opera sex dierum semper celebrari solebat, praefigurabatur magnus ille dies Sabbati, in quo Dominus semel in sepulcro erat requieturus, completis ac perfectis in die sexto omnibus operibus suis, quibus mundum, quem in die sexto perfecerat, jam perditum restaurabat. In quo etiam die quasi antiqui recolens operis, aperto sermone declaravit salvationem se jam mundi perfecisse. Cum enim accepisset acetum, dixit: Consummatum est, et inclinato capite, tradidit spiritum (Joan. XIX, 30). Sed et haec sanctificatio ac benedictio septimi diei, et requies in illa Dei post opera sua valde bona designavit quod nos singuli post opera bona quae in nobis ipse operatur et velle et perficere, ad requiem tendimus vitae coelestis, in qua aeterna ejus sanctificatione et benedictione perfruamur. Unde bene idem dies septimus vesperam habuisse non scribitur, quia nimirum perpetuam nostram in illo requiem significat.\
"""
