Et peregrinatus est in Geraris. Nam et verbo peregrinationis et nomine Gerarae, id est incolatus, decenter sanctorum vita figuratur, quae, quantum divinis mancipata praeceptis, tantum a temporalibus est alienata gaudiis; unde et Apostolus eorumdem patriarcharum vitam glorificans aiebat: Fide moratus est Abraham in terra repromissionis, tanquam in aliena, in casulis habitando cum Isaac et Jacob cohaeredibus promissionis ejusdem; exspectabat enim fundamenta habentem civitatem, cujus artifex et conditor Deus (Heb. XI, 9). Et paulo post: Juxta fidem defuncti sunt omnes isti, non acceptis repromissionibus, sed a longe eas aspicientes et salutantes, et confitentes quia peregrini et hospites sunt super terram (Ibid., 13). Qui enim haec dicunt significant se patriam inquirere; erat autem Geraris olim terminus Chananaeorum ad meridiem, et civitas metropolis Palaestinae, posita inter Cades et Sur, hoc est inter duas solitudines, quarum una Aegypto jungitur, ad quam populus transfretum Rubri maris pervenit, altera vero Cades usque ad Sarracenorum eremum extenditur. Sequitur:\
