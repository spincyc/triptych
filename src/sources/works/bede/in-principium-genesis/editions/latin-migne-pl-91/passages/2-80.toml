text = """
Arcum meum ponam in nubibus, et erit signum foederis inter me et inter terram; cumque obduxero nubibus coelum apparebit arcus meus, et recordabor foederis mei vobiscum, et cum omni anima vivente quae carne vegetat, et non erunt ultra aquae diluvii ad delendam universam carnem. Arcus in coelo usque hodie quoties videtur, signum nobis divini foederis quod non sit ultra terra diluvio perdenda in memoriam reducit; sed et futuri judicii quod per ignem est mundo futurum, si bene consideretur, signum nobis ante oculos praetendit. Neque enim frustra caeruleo simul et rubicundo colore resplendet, nisi quia caeruleo colore aquarum quae praeterierunt, rubicundo flammarum quae venturae sunt nobis testimonium perhibet. Apte autem arcus coelestis, quem Irim vocant, in signum divinae propitiationis ponitur, arcus quippe ille resplendere solet in nubibus, et radiis solis quo roscida illustratur obscuritas, grata quodammodo confessione respondere. Sol ergo justitiae Christus est, nubes ab illo illustratae sancti, quorum nomina scripta sunt in coelo, et de quibus Psalmista: Domine, in coelo misericordia tua, et veritas tua usque ad nubes (Psal. XXXV, 6). Et apparente arcu in nubibus memor fit promissionis suae Dominus, ne perdat terram diluvio, quia per intercessiones sanctorum, qui non de suo, sed de ipso lucere sciunt, propitiabitur fidelibus, cum oculos mentis ad coelestia desideranda sustollunt, ejusque gloriam in praecedentium justorum factis, sive dictis, seu etiam se sopitis, tanquam in ipsius nubibus, agnoscunt, eritque arcus in nubibus, et videbo illum, et recordabor foederis sempiterni quod factum est inter Deum et inter omnem animam viventem universae carnis quae est super terram. Humano more dicitur recordari Deus foederis sui, viso in nubibus arcu, qui propter merita sanctorum, quibus ipso illustrante gloriosi et coelestes existunt, nostrae fragilitati parcit et miseretur; non autem ipse noviter aliquid recordatur, qui nihil unquam potest oblivisci. Memor enim fuit in saeculum testamenti sui, sed nobis tunc recordari videtur foederis quod nobiscum pepigit, cum in tribulatione positis auxilium suae protectionis impendit; unde bene in psalmo ex persona quorumdam afflictorum, quibus tardum videbatur divinae subsidium pietatis, dicitur: Quare faciem tuam avertis, oblivisceris inopiae nostrae et tribulationis nostrae (Psal. XLIII, 24)?\
"""
