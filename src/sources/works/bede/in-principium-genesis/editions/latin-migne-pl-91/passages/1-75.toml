text = """
Mulieri quoque dixit: Multiplicabo aerumnas tuas et conceptus tuos. In dolore paries filios tuos. « Haec quoque in mulierem Dei verba figurate ac prophetice multo commodius intelliguntur. Verumtamen quia nondum pepererat femina, nec dolor et gemitus parientis nisi ex corpore mortis est, quae praecepti transgressione concepta est, refertur haec poena et ad proprietatem litterae: nam et in eo quod sequitur: Et sub viri potestate eris, et ipse dominabitur tui, cum et ante peccatum aliter factam fuisse non deceat credere mulierem, nisi ut vir ei dominaretur, et sub ejus ipsa potestate degeret, recte accipi potest hanc servitutem significatam, quae cujusdam conditionis est potius quam dilectionis, ut etiam ipsa talis servitus, qua homines hominibus postea servi esse coeperunt, de poena peccati reperiatur exorta. Dixit quidem Apostolus: Per charitatem servite invicem (Gal. V, 13); sed nequaquam diceret: Invicem dominamini. Possunt itaque conjuges per charitatem servire invicem; sed mulierem non permittit Apostolus dominari in virum. Haec enim viro potius sententia detulit, et maritus habere dominium meruit mulieris, non natura, sed culpa: quod tamen nisi servetur, depravabitur amplius et augebitur culpa. » Figurate autem verba haec ad Ecclesiam conjugem videlicet Christi conveniunt, cujus aerumnae post reatum primae praevaricationis multiplicantur in hac vita, ut ad vitam perpetuam castigata perveniat; multiplicantur et conceptus, cum spiritalem Deo sobolem praedicando ac recte vivendo gignere satagit; unde eidem suae soboli per egregium praedicatorem dicitur: Filioli mei, quos iterum parturio donec formetur Christus in vobis (Gal. IV, 19). Parit in dolore filios, cum sollicita metuit, ne sicut serpens seduxit Evam astutia sua, ita corrumpantur sensus eorum, et excidant a simplicitate quae est in Christo. Agit sub viri potestate, quia servit Domino in timore et exsultat ei non in securitate, sed cum tremore: cui, si nunquam peccasset, solo securae dilectionis copularetur amplexu. Et ipse dominabitur ejus, carnales ejus cohibens motus, eamque ad perceptionem vitae coelestis continuo supernae institutionis exercitio provehens, a qua si nunquam recessisset, socia cum illo semper libertate regnaret.\
"""
