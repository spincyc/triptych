physical_line_ranges = [[343, 346]]
text = """
Festinavit Abraham in tabernaculum ad Saram, dixitque ei: Accelera, tria sata similae commisce, et fac subcineritios panes. Ipse vero ad armentum cucurrit, et tulit inde vitulum tenerrimum et optimum, deditque puero, qui festinavit et coxit illum. Ubi primo notandum quia cuncta velociter aguntur velut vere in ministerium divinae susceptionis; festinat Abraham, accelerare jubet Saram, properanter famulus injunctum complet officium, ut patenter innotescat quia beatus Abraham veraciter, juxta vocem Domini, exsultavit ut videret diem ejus, et vidit et gavisus est (Joan. VIII, 56). Sed et omnes qui respectu divinae gratiae tanguntur in animo, confestim in obsequium supernae voluntatis laetis bonorum operum et cogitatuum passibus exsiliunt, seque ac suos auditores ad accelerandam observationem mandatorum coelestium sedula exhortatione provocant.

Simila ergo quam commiscuit Sara ut reficeret angelos, interna est dulcedo sermonis Dei, quam coelesti Jerusalem, sanctae videlicet Ecclesiae, pollicetur propheta, dicens de Domino: Qui posuit fines tuos pacem, et adipe frumenti satians te (Psal. CXLVII, 14). Statimque qui esset adeps frumenti, manifestius exponens, adjecit: Qui emittit eloquium suum terrae. Tria sunt autem sata ejusdem similae, quia in Scriptura sacra triplex est sensus intelligentiae, historicus videlicet, allegoricus et anagogicus; verbi gratia: Domine, dilexi decorem domus tuae (Ps. XXV, 8); juxta historiam decorem domus, quam fecit Salomon Domino, inviolabilem permanere desiderabat; laudante eum in illa populo ejus. Juxta allegoriam, decorem sanctae Ecclesiae per orbem universum fulgere desiderabat, cui dicit Apostolus: Vos enim estis templum Dei (II Cor. VI, 16). Juxta anagogen, id est, sensum ad superiora ducentem, cupiebat videre decorem patriae coelestis domus, scilicet non manufactae, sed aeternae in coelis. Hujus mensurae triformis et in evangelica parabola facit Dominus mentionem: Simile est, inquiens, regnum coelorum fermento quod acceptum mulier abscondit in farinae satis tribus, donec fermentatum est totum. Fermentum namque evangelicum mulier in farinae satis tribus abscondit ut totum fermentetur, cum sancta Ecclesia, quam hoc in loco Sara significat, sive historiam in Scripturis praedicet, sive allegoriam revelet, seu ad superna contemplanda oculum suae expositionis attollat, semper ut dictis suis virtutem sive Dominicae seu fraternae charitatis instituit. Neque ullatenus se Scripturam recte intellexisse quisquam putet, in qua institutionem charitatis invenire non potuit. Satum est autem genus mensurae apud Palaestinos, unum et dimidium modium capiens:

Quod autem Sara subcineritios facit panes, multum ad rem pertinet. Subcineritii panes dum coquuntur, ipsi quidem cum igni coquuntur, latent in abdito, sed solus qui super aggregatur cinis intuentium oculis patet, at ubi cocti fuerint, removetur cinis, ac mundi ante ora vescentium panes transferuntur, quia nimirum eloquia Domini igne sunt examinata (Ps. XVII, 31), videlicet Spiritus sancti, per quem Scriptura ipsa confecta est; sed aliquoties vilitate ac simplicitate styli ipse in se scientiam in tantum obtineat, ut quid in se fervoris spiritalis, quantum alimoniae coelestis habeat, non facile luceat; at dum, ablato velamine litterae, per ministerium praedicatoris suavitas sensus spiritalis auditorum cordibus reseratur, quasi excusso cinere, panes dulcissimi reficiendis fidelibus offeruntur.

Vitulus quoque tenerrimus et optimus quem de armento tulit Abraham, ipsum Mediatorem Dei et hominum significat, quem pro revertente a se filio juniore, id est populo gentium, juxta parabolam Evangelii, pater clementissimus mactavit. Ipse namque est vitulus de armento tenerrimus et optimus, ad occidendum coquendumque singulariter coeli civibus assumptus, quia de omni humano genere solus est specialiter electus, cujus sanguine mundus redimeretur, et per quem instaurarentur non solum quae in terra, sed etiam quae in coelis sunt in ipso, ut Apostolus ait. Qui videlicet vitulus recte tenerrimus et optimus dicitur. Quid enim tam tenerum tamque optimum, quam est ille qui humiliavit se pro nobis erigendis: Factus obediens Patri usque ad mortem, mortem autem crucis (Psal. II, 8)?\
"""
