text = """
Evigilans autem Noe ex vino, cum didicisset quae fecerat ei filius suus minor, ait: Maledictus Chanaam, servus servorum erit fratribus suis. Evigilans ex vino Noe progeniem ejus a qua irrisus est maledicit; eos vero qui se ut patrem honoravere benedictione debita remunerat; et Dominus juxta vocem psalmi (Psal. III, 6) cum dormisset in morte, ac resurgeret immortalis, percussit omnes adversantes sibi sine causa, dentesque peccatorum contrivit; super populum vero suum benedictionem perpetuae salutis profudit. Non solum autem Chanaam maledictioni, sed etiam servitio fratrum suorum subjicitur. Quid est enim aliud hodie gens ipsa, nisi quaedam scriniaria Christianorum, bajulans legem et prophetas ad testimonium assertionis Ecclesiae, ut nos honoremus per sacramentum quod nuntiat illa per litteram.\
"""
