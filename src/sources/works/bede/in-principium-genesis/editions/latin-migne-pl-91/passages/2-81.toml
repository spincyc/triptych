text = """
Coepitque Noe vir agricola exercere terram, et plantavit vineam, etc. Libet saepe repetere sermonem Domini, quem dixit Judaeis: Si crederetis Moysi, crederetis forsitan et mihi, de me enim ille scripsit (Joan. X, 46). Nam et in hac lectione Moyses historiam texens Noe ac filiorum ejus, passionem Domini devotionemque credentium in eum populorum, nec non et fidei contradicentium perfidiam figurate denuntiat; Noe quippe terram exercens vineam plantavit, quia Dominus, curam generis humani gerens, Synagogam Judaea in gente constituit; cujus videlicet vineae et Psalmista meminit dicens: Vineam ex Aegypto transtulisti (Psal. LXXIX, 9); et Dominus in Evangelio loquens ad Judaeos: Homo, inquit, plantavit vineam et sepem circumdedit ei (Luc. XX, 9), et caetera usque ad finem parabolae, ubi ait: Quid ergo faciet Dominus vineae agricolis illis? Dicunt: Malos male perdet, et vineam locabit aliis agricolis.\
"""
