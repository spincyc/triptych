text = """
Et requievit die septimo ab universo opere suo quod patrarat. Non quasi lassus ex nimio labore Deus instar humanae fragilitatis completa mundi fabrica requievit; sed requievisse ab universo opere suo dicitur, quia novam creaturam ultra instituere aliquam cessavit. Solet namque Scriptura saepe nomine requiei cessationem operis sive sermonis indicare, sicut in Apocalypsi de sanctis animalibus: Et requiem, inquit, non habebant die ac nocte dicentia: Sanctus, Sanctus, Sanctus, Dominus, Deus omnipotens (Apoc. IV, 8). Pro eo ut diceret, non cessabant haec semper decantare. Nam maxima et unica sanctis est requies in coelo, laudem summae Trinitatis, quae Deus est, indefessa voce dicere. Potest vero altius intelligi requievisse Dominum ab omnibus operibus suis, non eum scilicet opus habuisse illis operibus suis in quibus requiesceret, quippe cujus requies in seipso sine initio ac termino semper vera est, sed sola bonitatis suae causa fecisse opera, quae in ipso requiescerent: quod e contrario facilius intelligitur, cum meminerimus humanam indigentiam pro hoc maxime laboribus quotidianis insistere, ut in operibus suis requiem percipere possit, dicente ei Domino: In sudore vultus tui vesceris pane tuo (Genes. III, 19). Deus autem qui ante creationem mundi aeternaliter in seipso perfectam habebat requiem, ipse etiam creato mundo, non in operibus quae fecit, sed ab omnibus quae fecit operibus requievit, ut pote nihil habens secum necessitatis in creaturis requiescere sui, quin potius creaturis rationabilibus ipse requiem praestans, cum in seipso perfecte semper requiescat, eoque bono beatus sit, quod ipse sibi est.\
"""
