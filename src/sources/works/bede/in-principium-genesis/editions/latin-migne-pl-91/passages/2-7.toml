physical_line_ranges = [[117, 117]]
text = """
Sed sub te erit appetitus ejus, et tu dominaberis illius. Juxta idioma linguae Hebraicae indicativum modum pro imperativo posuit, qualia habes innume a: Diliges Dominum Deum tuum, diliges proximum tuum, non fornicaberis, non furtum facies, non falsum testimonium dices (Deut. VI, 5), pro eo ut diceretur: Dilige, et ne occidas, ne forniceris, ne furtum facias, ne falsum testimonium dicas. Sub te ergo, inquit, erit appetitus ejus, et tu dominaberis illius; tu quia liberi es arbitrii, moneo ut appetitum peccati impugnari compescas, et non illud tui amplius crescendo, sed tu magis illius correctius vivendo domineris. Hunc locum antiqua translatio sic habet: Nonne sic recte offeras, recte autem non dividas peccasti? quiesce, ad te enim conversio ejus, et tu dominaberis illius. Recte autem offertur Deo, cui uni tantummodo sacrificandum est. Non autem recte dividitur, cum non discernuntur recte vel loca, vel tempora oblationum, vel res ipsae quae offeruntur, vel qui offert, vel hi quibus ad vescendum distribuitur quod oblatum est, ut divisionem hic discretionem intelligamus. In quo autem horum Domino displicuerit Cain, facile non potest inveniri. Sed quoniam Joannes apostolus, cum de his fratribus loqueretur, Non sicut Cain, inquit, qui ex maligno erat, et occidit fratrem suum. Et cujus rei gratia occidit? quia opera illius maligna fuerunt, fratris autem ejus justa (Joan. III, 13); datur intelligi propterea Deum non respexisse in munus ejus, quia hoc ipse male dividebat, dans Deo aliquid suum, sibi autem seipsum, quod omnes faciunt qui non Dei, sed suam sectantes voluntatem, id est, non recto, sed perverso corde viventes; offerunt tamen Deo munus, quo putant eum redimi, ut eorum non opituletur sanandis pravis cupiditatibus, sed explendis. Quiesce, inquit, ad te enim conversio ejus, et tu dominaberis illius. Desine peccato invidiae in fratrem contabescere, quia ad te erit conversio ejusdem tui peccati, et in tuum caput iniquitas tua redundabit, et tu dominaberis illius, habens in potestate per gratiam divini adjutorii conceptam de tuo corde repellere nequitiam. Haec Deus locutus est ad Cain, eo more quo cum primis hominibus per creaturam subjectam velut eorum socius forma congrua loquebatur. Verum quia ille non intus, sed foris est admonitus, nihilominus deliberatum scelus in necando fratre etiam post verbum divinae admonitionis vel correptionis implevit; sequitur enim.\
"""
