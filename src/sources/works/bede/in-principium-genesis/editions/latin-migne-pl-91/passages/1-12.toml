text = """
Dixit autem Deus: Fiant luminaria in firmamento coeli. Decenti satis ordine mundus ex materia informi congruam procedit ad formam. Postquam enim ante omnem hujus saeculi diem coelum et terram et aquam Deus creavit, hoc est, superiorem illum et spiritalem cum suis incolis mundum, et informem totius hujus mundi materiam, juxta hoc quod scriptum est: Qui vivit in aeternum, creavit omnia simul (Eccli. XVIII, 1); primo hujus saeculi die lucem fecit, quae caeteras creaturas specie capaces redderet. Secundo firmamentum coeli, superiorem videlicet hujus mundi partem, in aquarum medio solidavit. Tertio in inferioribus mare terrasque suis discrevit finibus, aeremque suis in locis, cedente aqua, diffudit. Oportuit ergo ut eodem quo creata sunt ordine profectum caperent elementa amplioris ornatus, id est, quarto die coelum luminaribus insigniretur. Quinto aer et mare, sexto terra suis impleretur animantibus. Nam quod die tertio terra herbis est arboribusque vestita, non ad ornatum ejus, sed ad ipsam, ut ita dixerim, figurae ejus superficiem pertinet.\
"""
