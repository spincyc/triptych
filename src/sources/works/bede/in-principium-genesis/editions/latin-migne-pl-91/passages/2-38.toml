text = """
Et tactus dolore cordis intrinsecus; delebo, inquit, hominem quem creavi a facie terrae, ab homine usque ad animantia, a reptili usque ad volucres coeli; poenitet enim me fecisse eos. Humano etenim more dolere dicitur Deus, cum homines quos ipse creavit hosti potius maligno peccando, quam sibi pie vivendo adhaerere considerat, juxta illud Salomonis: Et dolor patris filius stultus (Prov. XIX, 13). Et iterum: Ira patris filius stultus, et dolor matris quae genuit eum (Prov. XVII, 25). Quod autem etiam interitum omnium animantium terrenorum volatiliumque denuntiat, magnitudinem futurae cladis effatur: nam animantibus rationis expertibus, tanquam et ipsa peccaverint, minatur exitium.\
"""
