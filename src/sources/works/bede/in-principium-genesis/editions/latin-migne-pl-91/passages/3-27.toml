text = """
Ecce, inquit, unus populus et unum labium omnibus; coeperuntque hoc facere, nec desistent a cogitationibus suis donec eas opere compleant. Multa est distantia peccandi inter eos qui ita Dei mandata contemnunt, ut aliquos inter se justi aemulatores et cultores habeant; et inter eos qui omnes unanimo consensu mandatis coelestibus contradicunt. Multa item distantia inter eos qui ita peccant, verbi gratia tempore adolescentiae, ut postmodum, succedente senecta, poenitentiam admissorum agere disponant, et inter eos qui in malis quae faciunt nullum correctionis propositum gerunt. Ut ergo monstretur hoc in loco unanimitas peccantium, dicit invisibilis arbiter: Ecce unus populus et unum labium omnibus; et propositum non poenitendi adjungit: Coeperuntque hoc facere, nec desistent a cogitationibus suis, donec eas opere compleant; quibus apte congruit principium psalmi tertii decimi, in quo dictum est: Dixit insipiens in corde suo: Non est Deus (Psal. XIII, 1), id est, Nemrod artifex operis nefandi; ac deinceps de opificibus perditae civitatis: Corrupti sunt, et abominabiles facti sunt (Ibid.). Haec autem de quibus loquimur verba internus Judex ministris virtutibus incomprehensibili nobis ordine loquitur: cujus loqui ad eos est eorum cordibus occulta sua invisibilia ostendere, ut quidquid agere debeant in ipsa contemplatione veritatis legant; quasi enim audientibus dicitur, quod videntibus inspiratur; unde cum eorum cordibus Deus contra humanam superbiam animadversionem ultionis infunderet, dicit:

Venite, descendamus, et confunaamus ibi linguam eorum. Dicitur eis qui aderant Venite, quia nimirum hoc ipsum nunquam a divina contemplatione decrescere, in divina contemplatione semper accrescere est; et nunquam corde recedere quasi quodam stabili motu est semper venire. Quibus et dicit: Descendamus et confundamus ibi linguam eorum. Ascendunt angeli in eo quod Creatorem conspiciunt, descendunt angeli in eo quod creaturam sese illicitis erigentem examine districtionis premunt. Dicere ergo est descendamus et confundamus linguas eorum, in se ipso eis hoc quod recte legatur ostendere, et per vim internae visionis eorum mentibus exhibenda judicia occultis motibus inspirare. Et bene non ait: Venite, et descendentes confundite; sed confundamus ibi linguam eorum, ostendens ita se operari per ministros suos, ut sint etiam ipsi cooperatores Dei, sicut Apostolus dicit: Dei enim sumus cooperarii.\
"""
