physical_line_ranges = [[76, 76]]
text = """
In quocunque die comederis ex eo, morte morieris. Non ait, si comederis mortalis eris, sed in quocunque die, inquit, comederis ex eo, morte morieris. Mortuus namque est homo in anima cum peccavit, quia recessit ab eo Deus, qui est vita animae, cujus merito mortem secuta est mors corporis, discedente ab illo anima, quae est vita ejus, quaeque mors eidem primo homini tunc evenit, cum praesentis vitae terminum accepit non parvo post tempore quam vetitum comedit. Potest etiam intelligi quod illam mortem in eis fecerit dies ille in quo peccaverunt, quam Apostolus gemit dicens: Condelector legi Dei secundum interiorem hominem; video autem aliam legem in membris meis repugnantem legi mentis meae, et captivantem me in lege peccati, quae est in membris meis. Infelix ego homo! quis me liberabit de corpore mortis hujus (Rom. VII, 22)? Non enim sufficit ei si diceret: Quis me liberabit de corpore mortali hoc, sed de corpore, inquit, mortis hujus. Sicut etiam illud: Corpus quidem, inquit, mortuum est propter peccatum (Rom. VIII, 10); nec ibi ait, mortale, sed mortuum, quamvis utique et mortale quia moriturum, non ita credendum est fuisse illa corpora, sed licet animalia nondum spiritalia, non tamen mortua, id est, quae necesse esset ut morerentur, quod eo die factum est quo lignum contra vetitum tetigerunt.\
"""
