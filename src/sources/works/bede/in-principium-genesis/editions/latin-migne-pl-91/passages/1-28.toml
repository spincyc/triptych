text = """
Et ait: Faciamus hominem ad imaginem et similitudinem nostram. Nunc apparet evidentius quare de creatis herbis et arboribus, piscibus et volatilibus, terrestribus quoque animantibus dictum sit, ut fierint singula juxta genus et species suas. Praevidebatur enim futura ejus creatio qui non solum suo generi similitudine congrueret et specie, sed etiam ad imaginem sui Creatoris ac similitudinem fieret: cujus nobilitati creationis etiam hoc testimonium dat, quod non sicut in caeteris creaturis dixit Deus: Fiat homo, et factus est homo; vel: Producat terra hominem, et produxit terra hominem; sed, priusquam fieret, Faciamus hominem dicitur, ut videlicet quia rationabilis creatura condebatur, quasi cum consilio videretur facta. Quasi per studium de terra plasmatur, et inspiratione Conditoris in virtute spiritus vitalis erigitur, ut scilicet non per jussionem vocis, sed per dignitatem operationis existeret, quia ad Conditoris imaginem fiebat. Cum autem dicitur faciamus hominem ad imaginem et similitudinem nostram, unitas sanctae Trinitatis aperte commendatur. Si quidem eadem individua Trinitas in praecedente rerum formatione mystice erat insinuata, quando dicebatur: et dixit Deus: Fiat, et fecit Deus; et vidit Deus quod esset bonum. Nunc autem manifestius haec ipsa insinuatur, cum dicitur: Faciamus hominem ad imaginem et similitudinem nostram, et recte, quia donec is qui doceretur non erat, in profundo fuit abdita praedicatio Deitatis; ubi vero coepit hominis exspectari creatio, revelata est fides, et evidenter dogma veritatis emicuit. In eo enim quod dicitur. Faciamus, una ostenditur trium personarum operatio; in eo vero quod sequitur, ad imaginem et similitudinem nostram, una et aequalis substantia ejusdem sanctae Trinitatis indicatur. Quomodo enim una esset imago et similitudo, si minor Patre Filius, si minor esset Filio Spiritus sanctus, si non consubstantialis ejusdem potestatis esset gloria totius Trinitatis? aut quomodo diceretur Faciamus, si trium in una deitate personarum cooperatrix virtus non esset? neque enim angelis a Deo dici poterat Faciamus hominem ad imaginem et similitudinem nostram, quia nulla prorsus ratio sinit ut Dei et angelorum unam esse eamdemque imaginem sive similitudinem credamus. In quo autem sit homo factus ad imaginem et similitudinem Dei, testatur Apostolus, cum nos solerter admonet ut hanc quam in primo parente perdidimus, per gratiam ejusdem Conditoris recuperemus in nobis. Renovamini, inquit, spiritu mentis vestrae, et induite novum hominem, qui secundum Deum creatus est, in justitia, sanctitate, et veritate (Ephes. IV, 23). Creatus est ergo Adam novus homo de terra secundum Deum, ut esset justus, sanctus et verus, subditus et humiliter adhaerens gratiae sui Conditoris, qui aeternaliter ac perfecte justus, sanctus et verus existit: qui quoniam pulcherrimam hanc novitatem in se divinae imaginis peccando corrupit, corruptamque ex se prosapiam generis humani procreavit unde venit secundus Adam, id est, Dominus ipse et conditor noster, natus ex Virgine, creatus incorruptibiliter atque incommutabiliter ad imaginem Dei, immunis omnis delicti, et plenus omnis gratiae et veritatis, ut imaginem in nobis suam ac similitudinem exemplis suis restauraret et donis. Ipse est enim novus homo veraciter secundum Deum creatus, quia nimirum ita veram de Adam carnis substantiam sumpsit, ut nihil de illo vitii sordentis traheret: cujus exempla pro captu nostro sequi, cujus adhaerere donis, cujus obtemperare mandatis, hoc est, imaginem Dei quam in veteri homine perdidimus, recuperare in novo. Non ergo secundum corpus, sed secundum intellectum mentis ad imaginem Dei creatus est homo. Quanquam et ipse in corpore habeat quamdam proprietatem quae hoc indicet, quod erecta statura est factus, ut hoc ipso admoneretur, non sibi terrena esse sectanda, velut pecorum, quorum voluptas omnis ex terra est; unde in altum cuncta prona atque prostrata sunt, juxta quod quidam poetarum pulcherrime ac verissime dixit: Pronaque cum spectent animalia caetera terram, Os homini sublime dedit, coelumque videre, Jussit et erectos ad sidera tollere vultus. (Ovid. t. I Metam.)

Congruit ergo et corpus ejus animae rationabili, non secundum lineamenta figurasque membrorum, sed potius secundum id quod in coelum erectum est, ad intuenda quae in corpore ipsius mundi superna sunt, sicuti anima rationalis in ea debet erigi, quae in spiritalibus natura maxime excellunt, ut quae sursum sunt sapiat, non quae super terram. Bene autem additur.\
"""
