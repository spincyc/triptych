text = """
Dixit itaque Dominus: Clamor Sodomorum et Gomorrhae multiplicatus est, et peccatum eorum aggravatum est nimis. Clamorem Sodomorum scelerum famam vel potius infamiam dicit, a quo nos prohibens Apostolus dicit: Omnis amaritudo, et ira, et indignatio, et clamor, et blasphemia, tollatur a vobis cum omni malitia (Ephes. IV, 31); cui nimirum clamori contrarius est clamor electorum, de quo confidenter suo Creatori supplicantes, aiunt dicentes singuli: Domine, exaudi orationem meam, et clamor meus ad te perveniat (Psal. CI, 2). Magnus quippe illorum clamor est meritum sublime et intentio fidei coelestia sola quaerens, ubi Christus est in dextera Dei sedens; qui quoniam non terrenas opes, non gloriam inanem caducamque, non moritura carnis gaudia, sed superna tantum bona, desiderant, altum profecto et quasi clamore personum est omne quod agunt. Verum multiplicato clamore peccatorum, id est enormi illorum scelere, videamus quid sequitur.\
"""
