text = """
Dixitque ei Deus: Ego sum, et pactum meum tecum. Quid est enim Domino dicere: Ego sum, nisi statum aeternitatis suae, qua semper idem est, manifeste denuntiare? De qua dicit et Psalmus: Tu autem idem ipse es (Psal. CI, 28). Huic autem loco concinit illud Evangelii ubi dixit Dominus Judaeis: Antequam fieret Abraham ego sum (Joan. VIII, 58). Apparens enim in carne docuit se ipsum esse qui in spiritu quondam apparuerat Abrahae, cum idem testimonium essentiae suae, quod perhibuerat Abrahae, repetit perhibendo Judaeis; sed Judaei, quia audierant: Antequam fieret Abraham ego sum, turbabantur; Abraham quoniam audivit: Ego sum, laetabatur, nec dubitabat quod antequam ipse fieret, Deus erat; unde et ipse quia verbum divinae aeternitatis fideliter audivit; accepit in augmentum praemii, ut pater multarum gentium et vocaretur et esset. Porro Judaei, quia audita divinitatis arcana capere non poterant, ejecti de stirpe Abrahae, et inter genimina sunt viperarum computati: Denique tulerunt lapides ut jacerent in eum; at ille abscondit se ab eis, et exivit de templo (Joan. VIII, 59), ut videlicet a lapideis cordibus eorum absconsus, et exiens ad revelandam gentibus suae majestatis agnitionem veniret. Nam et tunc egressus de templo caeco nato lumen reddidit. In figuram videlicet gratiae, qua illustraturus erat corda gentilium. Sequitur:\
"""
