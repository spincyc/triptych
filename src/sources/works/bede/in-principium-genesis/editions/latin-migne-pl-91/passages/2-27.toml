text = """
Hic est liber generationis Adam. In die qua creavit Deus hominem, ad similitudinem Dei fecit illum: masculum et feminam creavit eos, et benedixit illis. Hic est liber primae creationis hominis, quod ad similitudinem suam fecit illum Deus, ut videlicet participatione bonitatis ejus esset perpetuo bonus, immortalis et felix; quod masculum et feminam fecit eos, quod factos gratia suae benedictionis illustravit. Talis erat generatio Adam cum uxore sua in die qua creatus est: Sed, heu! proh dolor! profanavit ille similitudinem Dei, hosti magis quam Creatori credendo, contraxit primogenitus ejus poenam maledictionis graviorem invidendo et occidendo fratrem, corrupit septimus ab illo Lamech statutam masculi et feminae legem, de qua dictum erat, Erunt duo in carne una (Gen. II, 24), accipiendo duas uxores, et in una carne tres conjungendo, et crebrescentibus passim malis, in tantum a similitudine sui Conditoris ac prima benedictione genus recessit humanum, ut in decima generatione, exceptis paucis, quos arca cohibuit, totum deleri meruisset; ad quam tamen similitudinem ac benedictionem nobis redire concessit Conditor ipse, in nostrae naturae similitudine nasci ac maledici morique dignatus, quatenus per ipsum redempti et dicere de ipso mereamur: Scimus quia cum apparuerit, similes ei erimus: videbimus enim eum sicuti est (I Joan. III, 2), et audire ab ipso: Venite, benedicti Patris mei, possidete paratum vobis regnum a constitutione mundi (Matth. XXV, 34).\
"""
