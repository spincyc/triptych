context = "English through Thomas Aquinas’s Catena Aurea. Bede’s clauses on the least becoming greatest, humility, and the example of the Son of Man match the middle of book III on Mark 10:42–45. The compiler omits the opening on the gentle teacher and the following discussion of the form of a servant."
physical_line_ranges = [[1962, 1963]]
text = "In which He teaches, that he is the greater, who is the less, and that he becomes the lord, who is servant of all: vain, therefore, was it both for the one party to seek for immoderate things, and the other to be annoyed at their desiring greater things, since we are to arrive at the height of virtue not by power but by humility. Then He proposes an example, that if they lightly regarded His words, His deeds might make them ashamed, saying, “For even the Son of man came not to be ministered unto, but to minister, and to give His life a ransom for many.”"
