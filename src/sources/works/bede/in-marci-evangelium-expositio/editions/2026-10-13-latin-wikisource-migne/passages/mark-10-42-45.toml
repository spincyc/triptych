context = "Book III, Mark 10:42-45, complete two-paragraph commentary block. Read the surrounding retained paragraphs on Mark 10:32-46 and compared the full selected block with PL 92, column 236A-B. The first lemma contrasts gentile rulers with service among the disciples; the second expounds the Son of Man giving his life as a ransom for many."
