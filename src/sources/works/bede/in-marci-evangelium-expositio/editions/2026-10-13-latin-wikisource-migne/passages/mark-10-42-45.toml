notes = "Mechanically copied exact substrings from retained raw lines 312 and 313, omitting only each generated {1.10} locator prefix; no source wording was retyped, modernized or supplied. The prefix is an extraction locator, not book I. Text is one space-joined excerpt of two complete consecutive paragraphs. Directly compared all selected wording with the retained image artifact.jacques-paul-migne.patrologia-latina-volume-92.paris-1862.ia-leaf-n122-4cdb234f, SHA-256 4cdb234fe27083d0f6926cb4f7753297a60dd1b9530b1576c297cf96a2c8ae3a, column 236A-B; lexical wording agrees. The web transcription normalizes typography, line-break hyphenation and whitespace, so it is not diplomatic. Its own printing year remains unidentified, as the edition record states; the independent 1862 reissue comparison does not silently identify the digital expression with that printing. The preceding paragraph treats Mark 10:41, the two selected lemmas begin at 10:42 and 10:45, and the following paragraph begins 10:46. The printed etc. after Non ita autem in vobis remains abbreviated. This is direct commentary on Mark, not direct commentary on Matthew 22; any use beside Matthew 22 is a study-specific analogue. The page-only passage passage.bede.in-marci-evangelium-expositio.1862-migne-pl-92.mark-10-42-45 witnesses the same block and is not an additional independent commentary witness. No claim that each sentence originated with Bede, and no modern English translation, is supplied."
