description = "Bede's commentary on Luke in six books, completed about 715 and dedicated to Acca of Hexham. Book VI covers the passion and resurrection narratives, including a harmonizing note on Luke 24:12 that reconciles Luke's and John's accounts of who looked into the tomb. Edition records keep Migne's Latin, dated web deliveries of it, and modern translations apart; the modern English translation is under copyright and is not registered here."
