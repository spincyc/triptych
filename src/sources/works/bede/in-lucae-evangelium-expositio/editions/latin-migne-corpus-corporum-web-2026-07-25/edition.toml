notes = "A dated delivery state of a transcription of Migne, not a critical edition. The file was checked for the automated Italian spelling corruption that affects some other files on the same site and was clean. Consumers needing a critical text must use the relevant Corpus Christianorum edition, which was not consulted. The transcription embeds Migne's column numbers in the form (0625B), which is how columns are cited from it. No page image of Patrologia Latina 92 at these columns was reachable: the Internet Archive scan of that volume that was located contains only the Matthew and Mark commentaries."
