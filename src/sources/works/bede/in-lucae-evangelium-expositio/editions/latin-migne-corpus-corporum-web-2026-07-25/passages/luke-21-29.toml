text = "Et dixit illis similitudinem: Videte ficulneam, et omnes arbores, cum producunt jam ex se fructum, scitis quoniam prope est aestas. Ita et vos cum videritis haec fieri, scitote quoniam prope est regnum Dei. Aperte ergo docet quia sicut ex fructu arborum ventura aestas agnoscitur, ita ex ruina mundi prope esse cognoscitur regnum Dei. Quibus profecto verbis ostenditur, quia fructus mundi, ruina est. Ad hoc enim crescit, ut cadat. Ad hoc germinat, ut quaecunque germinaverit, cladibus consumat. Bene autem regnum Dei aestati comparatur, quia tunc moeroris nostri nubila transeunt, et vitae dies aeterni solis claritate fulgescunt."
