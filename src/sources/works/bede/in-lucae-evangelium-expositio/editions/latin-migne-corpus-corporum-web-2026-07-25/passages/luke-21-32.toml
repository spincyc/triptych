text = "Amen, dico vobis, quia non praeteribit generatio haec, donec omnia fiant. Multum quippe commendat Dominus, quod ita pronuntiat. Quodammodo, si dici fas est, juratio ejus est: Amen, dico vobis. Amen enim interpretatur verum, et tamen non est interpretatum, cum potuisset dici Verum dico vobis, nec Graecus hoc interpres ausus est facere, nec Latinus. Sic mansit, non est interpretatum, ut honorem haberet velamento secreti, non ut esset negatum, sed ne vilesceret nudatum. Igitur Verum dico vobis Veritas dicit, quae utique et si non diceret, mentiri omnino non posset. Tamen commendat, inculcat, dormientes quodammodo excitat, intentos facit, contemni non vult: Amen, inquiens, dico vobis, quia non praeteribit generatio haec, donec omnia fiant. Generationem autem aut omne hominum genus dicit, aut specialiter Judaeorum."
