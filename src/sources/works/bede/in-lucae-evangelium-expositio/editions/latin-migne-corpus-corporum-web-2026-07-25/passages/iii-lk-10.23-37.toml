context = "Bede's complete exposition of Luke 10:23-37 in Book III, read in the retrieved file at the embedded Migne column markers 0467C through 0470D. Registered for three findings used by the Twelfth Sunday after Pentecost proper guide: his treatment of the blessed eyes (the eyes of the little ones to whom the Son deigns to reveal himself and the Father, against the scribes who saw only the Lord's body; the prophets and kings who saw per speculum et in aenigmate); his rule that the parable teaches everyone who shows mercy to be a neighbour AND specially designates the Son of God, so that allegory must not thin out or remove the moral institutes of mutual brotherhood (ut omnem qui misericordiam faceret cuilibet proximum doceret ... neque enim ... moralia mutuae fraternitatis instituta sub allegoriae regulis extenuare et auferre conemur); and his allegorical table, taken largely verbatim from Augustine's Quaestiones Evangeliorum II.19 and Ambrose's Expositio in Lucam VII, with his own extensions (the denarii given altera die because the risen Lord opened the Scriptures; the innkeeper widened from Paul to the Spirit-taught preachers)."
verified_on = "2026-08-19"
notes = "The whole retrieved wikitext was re-fetched on 2026-08-19 and its SHA-256 matched this artifact record before reading. The work record's locus grammar admits only a single verse token, so the locus names the pericope's opening verse; the passage inspected and verified is Bede's whole exposition of Luke 10:23-37, at physical lines 1034-1068 of that file. The line placement is recorded here as prose because the artifact's bytes are registered remote rather than retained, so no replayable physical-line locator is claimed."
