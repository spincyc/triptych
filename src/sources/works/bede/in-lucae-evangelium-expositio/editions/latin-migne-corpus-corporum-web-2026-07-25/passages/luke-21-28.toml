text = "His autem fieri incipientibus, respicite et levate capita vestra, quoniam appropinquat redemptio vestra. Cum plagae, inquit, mundi crebrescunt, cum terror judicii virtutibus commotis ostenditur, levate vos capita, id est exhilarate corda. Quia dum finitur mundus, cui amici non estis, prope fit redemptio quam quaesitis. In Scriptura etenim sacra, saepe caput pro mente ponitur. Quia sicut capite reguntur membra, ita cogitationes mente disponuntur. Levare itaque capita est mentes nostras ad gaudia patriae coelestis erigere. Quod autem calcari mundus, ac despici debeat, provida Dominus comparatione manifestat. Nam sequitur:"
