text = "Coelum et terra transibunt, verba autem mea non transient. Coelum quod transibit non aethereum, sive sidereum, sed aereum, a quo et aves coeli et nubila coeli cognominantur, intelligere debemus. Petro attestante, qui dicit quod coeli erant prius, et terra de aqua, et per aquam consistens verbo Dei, per quae ille tunc mundus periit. Coeli autem qui nunc sunt et terra, eodem verbo repositi sunt igni reservati in die judicii et perditionis hominum impiorum (II Petr. III). Aperte docens quia non alii coeli sunt igne perituri, quam qui aqua perditi, hoc est, inania haec, et nubilosa ventosi aeris spatia. Neque enim aqua diluvii quae quindecim tantum cubitis montium cacumina transcendit, ultra aeris aetherisque confinia pervenisse credenda est. Quocunque autem pervenire potuit, eo nimirum juxta praefatam beati Petri sententiam et ignis judicii perveniet. Si autem coelum et terra transibunt, moveri potest quomodo dicat Ecclesiastes: Generatio praeterit, et generatio advenit, terra vero in aeternum stat (Eccle. I). Sed aperta ratione coelum et terra per eam quam nunc habent imaginem transeunt, attamen per essentiam sine fine subsistunt. Praeterit enim figura hujus mundi (I Cor. VII). Et ad Joannem angelus: Erit (inquit) coelum novum et terra nova (Apoc. XXI). Quae quidem non alia condenda sunt, sed haec ipsa renovantur. Coelum igitur et terra et transibit et erit, quia et ab ea quam nunc habet specie per ignem tergetur, et tamen in sua semper natura servabitur. Unde per Psalmistam dicitur: Mutabis ea, et mutabuntur (Psal. CI). Quam quidem ultimam commutationem suam, ipsis nobis nunc vicissitudinibus nuntiant, quibus nostris usibus indesinenter alternat. Nam terra a sua specie, hiemali ariditate deficit, vernali humore viridescit. Coelum quotidie caligine noctis obducitur, et diurna claritate renovatur. Hinc ergo, hinc fidelis quisque colligat, et interire haec, et tamen per innovationem refici, quae constat nunc assidue velut ex defectu reparari."
