context = "Bede's harmonizing note on Luke 24:12, read in the retrieved file at the embedded Migne column markers 0625A and 0625B, with the preceding remark on the disciples' slowness to believe and the following note on Emmaus in view. Registered as the earliest witness located that notices the Luke and John difference at this point and works at it, and as a material negative: Bede reconciles the seeing and says nothing of the believing or of theft."
physical_line_ranges = [[1, 3]]
text = "Lucas breviter de cursu Petri commemorat; sed hoc quomodo gestum sit plenius exsequitur Joannes, dicens etiam illum discipulum quem diligebat Jesus, cucurrisse cum Petro, se videlicet insinuans. Unde quaeritur quomodo Lucas de Petro dicat: Et procumbens vidit linteamina sola posita, cum Joannes se potius hoc fecisse significet, Petrum vero introeuntem in monumentum vidisse non solum linteamina, sed et sudarium quod fuerat super caput ejus. Sed intelligendum est Petrum primo procumbentem vidisse quod Lucas commemorat, Joannes tacet; post autem ingressum, ut diligentius interiora dignosceret, ingressum, tamen antequam Joannes intraret."
