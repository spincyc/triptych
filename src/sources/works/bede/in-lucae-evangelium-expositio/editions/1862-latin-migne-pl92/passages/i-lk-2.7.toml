context = "PL 92 col. 331 C-D (Migne 1862), facsimile PDF page 170, left column. Book I of Bede's exposition, the whole comment on the lemma Luke 2:7 (Et pannis eum involvit, et reclinavit eum in praesepio, quia non erat ei locus in diversorio), from Quid retribuam to adduceret, after which the lemma Luke 2:8-9 begins (Et pastores erant in regione eadem)."
physical_line_ranges = [[1, 10]]
text = "Quid retribuam Domino, pro omnibus quæ retribuit mihi? Quid enim major est omni laude: Parvulus natus est nobis, ut nos viri possimus esse perfecti? Qui totum mundum vario vestit ornatu, pannis vilibus involvitur, ut nos stolam primam recipere valeamus. Per quem omnia facta sunt, manus pedesque cunis astringitur, ut nostræ manus ad opus bonum exertæ, nostri sint pedes in viam pacis directi. Cui cœlum sedes est, duri præsepis angustia continetur, ut nos per cœlestis regni gaudia dilatet. Qui panis est angelorum, in præsepio reclinatur, ut nos quasi sancta animalia carnis suæ frumento reficiat. Qui ad dexteram Patris sedet, in diversorio loco eget, ut nobis in domo Patris sui multas mansiones præpararet. Quamvis hoc quod non in parentum domo, sed in diversorio et in via nascitur, per significationem intelligi altius potest. Ipse namque ait: Ego sum via, et veritas, et vita. Qui ergo per divinitatis essentiam veritas et vita permanet, per Incarnationis mysterium via factus est, qua nos ad patriam ubi veritate et vita frueremur adduceret."
