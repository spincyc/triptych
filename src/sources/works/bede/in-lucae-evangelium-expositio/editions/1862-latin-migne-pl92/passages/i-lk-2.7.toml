notes = "Scriptural references printed in parentheses are omitted from the lines: (Isai. ix) after mihi, a misprinted reference, since the verse is Psalm 115:12 (Vulgate), and (Joan. xiv) after vita. The spaces the printer set before colons, commas and question marks are closed. THE CATENA ON LUKE 2:7 (Oxford English, p. 68) gives sentences three to seven of this comment under Bede's name (He who clothes the whole world ...; He is confined in the narrow space of a rude manger ...; He Who is the bread of Angels ...; He who sits at His Father's right hand ...), and renders the eighth and tenth as He is born not in His Father's house, but in an inn and by the way side ...: Bede's sentence on the parents' house and the road is Gregory's (Hom. in Ev. 8.1, qui non in parentum domo, sed in via nascitur) taken over, and the sentence on the shepherds that follows the next lemma (Bene autem vigilantibus pastoribus angelus apparet ...) likewise reproduces Gregory's. OCR AGAINST PAGE (ia-djvu-text-2681d6ae lines 23903-23960): word differences, optical text first: quia non erat ei locus in diverstirio Quiit rrlribuam for Quid retribuam; quie relribuit for quae retribuit; Isai rx Qiiid for Quid; inajor for major; oinni for omni; Purvulus naius for Parvulus natus; ul for ut; pojsiiiius for possimus; pcrfocii for perfecti; totuiu iiiunduui for totum mundum; and 28 more."
