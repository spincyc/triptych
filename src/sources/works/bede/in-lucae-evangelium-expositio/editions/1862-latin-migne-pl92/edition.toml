notes = "Identified from the page images of Internet Archive item patrologiaecur92mign (PIMS - University of Toronto copy; Scribe scan scribe20.toronto.archive.org), read on 2026-11-19. The series title page (PDF p. 5) ends PATROLOGIAE LATINAE TOMUS XCII. / VENERABILIS BEDAE TOMUS TERTIUS. / EXCUDEBATUR ET VENIT APUD J.-P. MIGNE EDITOREM, IN VIA DICTA D'AMBOISE ... 1862; the volume title page (PDF p. 7) reads VENERABILIS BEDAE, ANGLO-SAXONIS PRESBYTERI, OPERA OMNIA, EX TRIBUS PRAECIPUIS EDITIONIBUS INTER SE COLLATIS, NEMPE COLONIENSI, DUABUSQUE IN ANGLIA, STUDIO DOCTISSIMORUM VIRORUM SMITH ET GILES ... TOMUS TERTIUS ... 1862. This is the printing that the Corpus Corporum transcription registered as edition latin-migne-corpus-corporum-web-2026-07-25 reproduces; that edition's note that the located Internet Archive scan of PL 92 held only the Matthew and Mark commentaries does not apply to this item, which prints the exposition of Luke from col. 301 (Luke 2:7 at col. 331, PDF p. 170). The two have not been compared beyond the passage registered here. The modern critical edition (D. Hurst, CCSL 120, 1960) is under copyright and was not consulted."
