rights_basis = "Public domain in the United States by publication date. The title pages of this copy, read on the page images at PDF pp. 5 and 7 of the registered facsimile, print Paris and 1862 (PATROLOGIAE LATINAE TOMUS XCII. / VENERABILIS BEDAE TOMUS TERTIUS. / EXCUDEBATUR ET VENIT APUD J.-P. MIGNE EDITOREM ... 1862). A work first published abroad before 1931 is out of United States copyright: that is the line guidance/missals.md records as current on 1 January 2026, and because it moves every January it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A cannot keep it protected: ninety-five years from 1862 ended with 1957. No life-based term is relied on. The underlying text is Bede's eighth-century Latin. The Internet Archive scan is a mechanical facsimile of that printing and adds no original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)). The whole PDF's embedded text returns no match for google; it is a Scribe scan and carries no Google front matter. No host rights label is relied upon."
