notes = "The complete 528-page Internet Archive PDF of item patrologiaecur92mign. Completeness check: the byte size, 52,984,059, and the SHA-1, 0e03fc50e7fb078ecba1f2d60883713b141e6537, equal the item's own file listing for this file. The title page is PDF p. 5. Page rule measured at the page read: PDF p. 170 carries cols. 331-332. CONTAINER: this PDF reproduces all of Patrologia Latina 92, which by its own contents page (PDF p. 8, Elenchus operum quae in hoc tomo XCII continentur) prints Bede's expositions of Matthew (col. 9), Mark, Luke (col. 301), John (col. 633) and Acts (col. 937), the De nominibus locorum (col. 1033) and an index (col. 1039). It is registered under the exposition of Luke because that is the work it was acquired to witness; the other works it prints are not claimed by this edition. The library also holds the container work work.jacques-paul-migne.patrologia-latina-volume-92, whose registered artifacts come from a different scan (Internet Archive item patrologiaecurs54unkngoog). ACCESS LIMITATION: the bytes are not retained for their size (53 MB); the whole optical text layer of the same item is tracked beside it."
