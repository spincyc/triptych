notes = "The complete Internet Archive DjVuTXT optical text layer of item patrologiaecur92mign: 75,365 LF-terminated lines, valid UTF-8, no CR bytes. Completeness check: the byte size, 3,783,644, and the SHA-1, 54d272b0f43c4edb3fd87a1b7e8e76fde4dfd2a4, equal the item's own file listing for this file. It covers the whole printed volume, including the expositions of Matthew, Mark, John and Acts that the volume also prints; only the exposition of Luke belongs to this edition. Uncorrected optical recognition: a locating and searching layer, not a text of record; the two printed columns of each page are often interleaved line by line. Wording quoted from it must be collated against the page images of artifact.bede.in-lucae-evangelium-expositio.latin-migne-pl92-1862.ia-pdf-832f5281. It is the text layer of the same item as that facsimile, recognised from the item's original page images rather than from the PDF's bytes, so no derived_from edge is asserted."
