context = "English through Thomas Aquinas’s Catena Aurea. The closing part of Bede on Luke 2:7, from the Father’s right hand and many mansions to the way home, is condensed in Aquinas. The separate quotation “I am the way” is absent."
physical_line_ranges = [[1, 2]]
text = "He who sits at His Father’s right hand, finds no room in an inn, that He might prepare for us in His Father’s house many mansions; He is born not in His Father’s house, but in an inn and by the way side, because through the mystery of the incarnation He was made the way by which to bring us to our country, (where we shall enjoy the truth and the life.)"
