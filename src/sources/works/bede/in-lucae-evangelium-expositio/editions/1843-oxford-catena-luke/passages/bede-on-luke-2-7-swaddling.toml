context = "English through Thomas Aquinas’s Catena Aurea. Bede’s direct text on Luke 2:7 includes the two clauses about common swaddling cloths and bound hands and feet. Ryder translates these through Aquinas; Bede’s opening question and later treatment of the manger are outside this extract."
physical_line_ranges = [[1, 2]]
text = "He who clothes the whole world with its varied beauty, is wrapped up in common linen, that we might be able to receive the best robe; He by Whom all things are made, is folded both hands and feet, that our hands might be raised up for every good work, and our feet directed in the way of peace."
