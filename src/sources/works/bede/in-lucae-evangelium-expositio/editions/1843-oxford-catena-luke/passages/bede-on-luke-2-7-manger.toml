context = "English through Thomas Aquinas’s Catena Aurea. Ryder translates the two clauses from the narrow manger and heavenly joys to the bread of angels and the bread of Christ’s flesh. Bede’s surrounding exposition on the swaddling cloths and inn is outside the selection."
physical_line_ranges = [[1, 2]]
text = "He is confined in the narrow space of a rude manger, whose seat is the heavens, that He may give us ample room in the joys of His heavenly kingdom. He Who is the bread of Angels is laid down in a manger, that He might feast us, as it were the sacred animals, with the bread of His flesh."
