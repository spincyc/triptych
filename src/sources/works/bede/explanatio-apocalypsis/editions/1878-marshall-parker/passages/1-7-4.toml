text = "By this definite number is signified the innumerable multitude of the whole Church, which is descended from the patriarchs either by the lineage of nature, or the imitation of faith. For, he says, “if ye be Christ’s, then are ye Abraham’s seed.” And it tends to additional completeness, that the twelve also should be multiplied by twelve, and brought to a sum of thousands, which is the cube of the number ten, by which is represented the enduring life of the Church. And for this reason, too, it is often denoted by the number twelve, because throughout the four-square world it subsists by faith in the Holy Trinity, for three times four are ten and two. Finally, also, when the Apostles were to preach the same faith to the whole world, twelve were chosen, as signifying by their number the mystery of their work."
