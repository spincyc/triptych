notes = "Title page independently read. Preface iv identifies Giles, Works of Bede, London 1844, volume XII, as the Latin base. Preface v says the biblical text as read by Bede is not translated in full, and the numbered catchwords are usually Authorised Version wording; this does not claim a complete biblical text. Commentary, preface, contents, notes and indexes are preserved in the offered 192-page scan. No collation of Giles or original manuscripts is claimed."
