context = "Printed p. 9, right column, under David Anointed by Samuel. The oil horn is raised above the young David’s bowed head. Jesse and two brothers witness the action. The subsidiary strip includes the calf, sacrificial knife and altar below Samuel and the ram and staff below David."
verified_on = "2026-11-24"
notes = "The direct image at https://images.metmuseum.org/CRDImages/md/original/DT11583.jpg shows five figures, four columns and the opening above the horn. The 2001 guide gives the diameter as 26.7 cm. The museum’s object record https://www.metmuseum.org/art/collection/search/464379 gives 26.6 cm and dates the Constantinopolitan plate to 629–630. The museum relates this silver service to banquet display."
