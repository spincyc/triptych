context = "Printed page 42, PDF page 8, headed section C, La reparación de las fuerzas perdidas. Nicolau identifies restoration of lost strength as an effect of Eucharistic nourishment, quotes the opening clause of the Postcommunion for the Tenth Sunday after Pentecost, and explains that increased habitual charity and excitation of actual charity answer the remission and languor proper to human nature. The paragraph beginning at the foot of this page continues on printed page 43 into his treatment of daily faults and venial sins; that continuation must not be attributed to page 42 alone."
