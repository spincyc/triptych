notes = "Etheridge's English translation is in the public domain and is the version most widely retranscribed online. It renders the targum's expansions in full and is the witness used for them here; the Aramaic served alongside it in digital delivery comes from a separate electronic text whose printed exemplar is not named. Catalog-level record created 2026-07-26. No exact artifact has been registered; publications consulting a digital delivery of this edition record their own access route and limits locally."
