description = "An expansive Palestinian Aramaic targum of the Pentateuch, transmitted under a mistaken ascription to Jonathan ben Uzziel and reaching its present form late. Unlike Onkelos it inserts narrative and homiletic material freely; its expansions at Genesis 15:12 and 15:17 introduce the four kingdoms and Gehinnom. Its willingness to expand makes its silences evidential in the same way as Onkelos's fidelity. A locus is BookToken.chapter.verse."
