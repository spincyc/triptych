description = "Six homilies on the opening of Genesis, preached at Constantinople and the best-known surviving work of a bishop remembered chiefly for having quarrelled with Chrysostom. They are literal where Basil and Ambrose are not, and famously so: Severian argues at length that paradise was a place on the earth and against those who allegorise it into heaven. Their numbering does not answer the days one for one - the homily titled on the fourth day expounds the fifth and sixth, and the one titled on the fifth expounds the making of man and the garden - so each fragment is bounded by what it expounds."
