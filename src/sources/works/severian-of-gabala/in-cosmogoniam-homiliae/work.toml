composed_basis = "Preached at Constantinople in the years Severian spent there under John Chrysostom's absence and after their quarrel, which the Patristic Text Archive dates 0401-0404 in its own structured metadata for every work under his name. The date is the preaching, not the archive's 2018 encoding and not Migne's 1862 printing of the Greek."
