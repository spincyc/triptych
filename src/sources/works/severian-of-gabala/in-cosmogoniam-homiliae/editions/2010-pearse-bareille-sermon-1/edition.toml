notes = "Only the first of six homilies is translated in this edition. The opening bracketed J. Bareille credit refers to the French intermediary; the footer identifies Roger Pearse as the English translator. Footnote 1 explicitly identifies the French source as Œuvres complètes de S. Jean Chrysostome, Paris, 1865. The complete offered page includes all seven numbered sections, conclusion, and 39 notes. This is not R. C. Hill’s 2010 translation and no direct Greek-to-English collation is claimed. Translator’s publication announcement: https://roger-pearse.com/weblog/2010/07/24/severian-of-gabala-sermon-1-on-genesis-online/ ."
