notes = "Read against the complete HTML source, including numbered divisions, source notes and final paragraph. Translation by Roger Pearse from Bareille’s French, not directly from Greek; source wording, including awkward phrases, is unchanged. The publisher’s notes remain in the controlling text artifact but are not attributed to Severian in this passage. Later creation verses and other biblical quotations are supporting illustrations, not a wider direct commentary extent."
