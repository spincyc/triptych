notes = "A non-critical edition: the files say so in their own words, recording that spelling, accents and punctuation were corrected and standardised to modern editorial standards by Sever Voicu over Migne's text. Annette von Stockhausen converted the transcription to CTS-compliant TEI and added the biblical references, and it is those references, read with each homily's own title, that bound the fragments here. This is the first Greek this library holds: guidance/catena.md recorded the Genesis survey's finding that Greek Wikisource carries no patristic commentary on Genesis, that First1KGreek holds none of Basil, Chrysostom or Gregory of Nyssa, and that Migne's PG on the Internet Archive is polytonic OCR and not usable text. This route answers that and the survey named it without taking it."
