provenance = "Retrieved 2026-08-01 from the Patristic Text Archive's public data repository at raw.githubusercontent.com/PatristicTextArchive/pta_data, one request per homily, each file fetched with curl and hashed before anything was read from it. No model stood anywhere in the retrieval path. The repository's own manifest was fetched first and the file paths taken from it rather than guessed, and each file's licence was read from its own header before its payload was kept, which is the order guidance/sources.md requires. A git repository is a mutable witness, so this artifact identifies the bytes at a dated state of it and not a stable republication."
