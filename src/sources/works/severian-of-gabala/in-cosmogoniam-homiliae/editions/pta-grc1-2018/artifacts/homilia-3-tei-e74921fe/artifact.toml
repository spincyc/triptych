notes = "urn:cts:pta:pta0001.pta059.pta-grc1, which the file also identifies as TLG tlg4139.tlg013 and CPG 4194.3. The TEI itself is not retained here: the header, the manuscript apparatus and the editors’ annotation are the archive’s work, and only the Greek reaches the tracked derivative. The biblical pointers are read from these bytes rather than kept in them, and what they settle is recorded on the fragment."
