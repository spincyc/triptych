rights_basis = "Severian preached in Greek about the year 400 and the text beneath these bytes is in the public domain by age. The bytes themselves are the Patristic Text Archive's TEI encoding, and each of the six files states its own licence in its own header: all six of these read <licence target=\"https://creativecommons.org/licenses/by-sa/4.0/\">Available under a Creative Commons Attribution ShareAlike 4.0 International License</licence>. That licence permits redistribution with attribution and under the same terms, and the attribution is carried on this edition record. The rights were read per file from each file's own header and not inferred from the archive: the archive's README says plainly that its files are licensed by different Creative Commons licences and that the licence is stated in each file's header, and of the sixty-nine works it holds under Severian's name some are CC BY 4.0 and some CC BY-SA 4.0. src/sources/commentary/genesis-availability-survey.yaml recorded the archive as CC BY 4.0, which is true of some of its files and not of these."
