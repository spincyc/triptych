description = "A French priest's printed defence of the secret published by Melanie Calvat in 1879, written as an open letter of 18 July 1882 to the editor of the Semaine religieuse d'Amiens, whose communique of 25 June 1882 against the secret had been reprinted in Le Monde and other papers. Its evidentiary value lies in what it concedes while defending: that opponents sought a condemnation at Rome, that the Congregation of the Index refused one, that the Holy Office took the matter up because a revelation was at issue, that a letter of Cardinal Prospero Caterini, Secretary of the Holy Office, dated 14 August 1880, expressed the Holy See's displeasure and the desire that the booklet be withdrawn from the hands of the faithful 'si la chose est possible', that the author and his party knew that letter only in a translation and never saw the Latin original, and that the charge being answered in 1882 was the non-conformity of the Lecce text with the text sent to Pius IX in 1851. The pamphlet carries no imprimatur, only the author's own submission of it to the judgment of the Apostolic See. Openly partisan; not a documentary edition. Loci are the printed page numbers of the 1882 imprint."
relations = ["work.melanie-calvat.secret-complet-de-la-salette", "work.holy-see.decretum-secret-de-la-salette-1915"]
