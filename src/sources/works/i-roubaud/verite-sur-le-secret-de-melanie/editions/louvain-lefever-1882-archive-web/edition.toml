date = "1882"
notes = "Public domain by age. Printed by the same house as the 1881 Louvain reprint of Melanie Calvat's booklet. Twelve printed pages: title page, the author's submission formula, an avant-propos, the letter of 18 July 1882 at pp. 5-10, and a prayer at pp. 11-12; a closing note states that a copy of the first edition was sent to every cardinal and to the archbishops and bishops of France. The searchable text layer of the scan is badly damaged in exactly the passages of evidentiary value; the pages carrying the Caterini letter of 14 August 1880 (pp. 8-9) and the Leo XIII passage (p. 10) were read in the scan's page images on 2026-07-25 rather than in that text layer. Exact scan bytes not retained in the repository."
