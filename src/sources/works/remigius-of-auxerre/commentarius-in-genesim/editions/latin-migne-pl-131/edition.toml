notes = "Migne divides the glosses into capita answering to the chapters of Genesis and heads each with `Vers. 5.`, the printing's own statement of the verse glossed. The caput marker for Genesis 5 and for Genesis 50 is missing from the printing, and at Genesis 43 the running head prints a bare `XLIII.` over a lemma that is Genesis 42:1, so the printed markers are checked against the lemma rather than believed. No English translation of this work exists at all."
