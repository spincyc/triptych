physical_line_ranges = [[222, 223]]
text = """
Vers. 1. Apparuit ei Dominus in convalle Mambre. Quaeri potest juxta litteram, si Abraham angelos intelligebat esse qui in figura hominum apparebant, cur eis ea quae mortalibus conveniunt obsequia praeparavit? Fortassis quia primo homines esse credebat, postea vero ex his quae ab illis dicta sunt vel facta angelos intellexit. Intelligebat eos esse angelos, cum eos ad coelum redire videbat, sicut in libro Judicum de Manue legimus, qui primo videns angelum hominem esse putavit, dicens: Tu es ille vir qui locutus es mulieri (Judic. XIII, 11)? Cumque ei humanitatis causa haedum fecisse voluisset, dicit ei angelus: Si cogis me, non comedam. Sin autem: | offer illud Domino. Cumque hoc fecisset, et flamma sacrificii ascenderet, angelus in flamma pariter ascendit. Caeterum de Sara nulli dubium quod homines esse putabat. Nam et negare ausa est quod angelus dixit ad Abraham: Cur risit Sara uxor tua? Negavit enim, et dixit: Non risi.

Mystice Abraham triplicem gessit figuram, Dei videlicet Patris in eo quod Isaac obtulit. Gestat et figuram Filii in eo quod de domo sua et cognatione exivit. Hic vero unamquamque sanctam significat animam quae Deum in hospitio suae mentis cum gaudio suscipit. Tres viros qui ei apparuerunt, quidam interpretantur Christum, et ipsum Moysen et Eliam qui etiam cum eo in monte transfigurati apparuerunt. | Tunc ergo Dominus venit quando mysterium incarnationis Abrahae ostendit, quia lex quae per Moysen data est, et prophetia quae per Eliam designatur, semper ejus praedixerunt adventum.\
"""
