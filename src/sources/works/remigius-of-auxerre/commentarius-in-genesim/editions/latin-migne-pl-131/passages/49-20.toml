text = """
Vers. 32. Appositusque est ad populum suum. Saepe hoc legitur in divina Scriptura: Appositus est ad fratres suos, appositusque est ad populum suum. Ideo | quaerendum de quo populo dicatur. Nam de patribus nulla quaestio est, quod videlicet cum Abraham et Isaac congregaretur. De populo autem dublum est, quia populus est multitudo. Illi vero adhuc tam parvi erant, ut populus dici non possint. Intelligamus ergo hoc non de solis sanctis hominibus dictum, sed etiam de angelis, ad quorum societatem sancti de mundo transeuntes apponebantur. De hoc populo Paulus dicit: Accessistis ad montem Sion et ad Hierusalem coelestem, et ad frequentiam angelorum (Hebr. XII, 22).\
"""
