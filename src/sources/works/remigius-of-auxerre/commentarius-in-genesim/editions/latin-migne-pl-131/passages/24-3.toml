text = """
Vers. 22. Postquam biberunt cameli. Quod Rebecca non solum viro dedit potum, verum etiam camelos adaquavit, significat quia Ecclesia nulli debet subtrahere verbum praedicationis, sed sapientibus et stultis in commune annuntiare. Hinc Paulus dicit: Graecis | et barbaris, sapientibus et insipientibus debitor sum (Rom. L, 14). Vel aliter. Per camelos carnem nostram debemus accipere. Cameli ergo adaquantur, quando cura corporis agitur, non tamen in desideriis, sed in necessitate, ut Rebecca sive anima gestare possit.\
"""
