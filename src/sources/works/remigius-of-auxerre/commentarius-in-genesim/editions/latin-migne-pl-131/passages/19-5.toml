text = """
Vers. 17. Salva animam tuam. Allegorice Lot fuga de Sodoma, quae juxta aliam significationem caecitas interpretatur, significat abrenuntiationem cupiditatum et illecebrarum saeculi. Praecipitur ergo Lot ut fugiat incendium Sodomae et ne retro aspiciat: quia omnis post perceptam gratiam vias vitae ingressus non debet ad ea quae dereliquit iterum redire, juxta quod Dominus dicit in Evangelio praecipiens: In illa die, qui fuerit in tecto vel in agro non redeat retro (Luc. XVII, 31). Exemplum quoque commemorans uxoris Lot quae, cum retro respiceret, in statuam salis versa remansit, significans eos qui post professam servitutis Dei relabuntur ad concupiscentias | saeculi. Unde et merito in statuam salis versa fuisse dicitur, quia suo exemplo, veluti salis condimento, mentes legentium vel audientium ne talia patiantur edocet.\
"""
