text = """
Vers. 1. Erat terra labii unius. Id est, linguae Hebraeae quae facta divisione linguarum creditur remansisse | in familia Heber: qua etiam lingua Dei Filius ad homines veniens praedicavit. Conveniens enim erat ut, in qua lingua Adam diaboli suasionem audierat, in eadem lingua Salvatoris perciperet praedicationem. Nec dicendum est novi aliquid fecisse Deum, quando linguarum facta est divisio, sed modos et formas locutionum divisisse aliis intellectibus. Unde et eadem verba in diversis sensibus apud diversas gentes inveniuntur. Nam alma apud Hebraeos secreta, apud Latinos sancta dicitur. Sidera stellae vocantur a Latinis, a Graecis ferrea. In Graecis habetur: rhabdo sidera.\
"""
