physical_line_ranges = [[354, 354]]
text = """
Vers. 3. Quod vero dicit, conglutinata est anima ejus cum ea, significat animam consuetudine mala quasi uniri cum diabolo, ut non solum peccet, verum etiam peccandi effectu et delectatione teneatur. Sed et si aliquando resipiscens contristatur per poenitentiam, diabolus proponit spes vanas ut utilem tristitiam ab ea auferat modo dicens misericordem | esse Deum, modo aliorum facta graviora commemorans, nunc dicens quasi nihil esse quod fecit, nunc prolixae vitae tempora ad agendam poenitentiam repromittit. Hoc est, quod dicit, tristem blanditiis delinivit. Sed pastores Ecclesiae quasi filii Jacob debent carnis vel animae peccatum ulcisci, et gladio spiritus, quod est verbum Dei (Ephes. VI, 17), punire, parati semper, secundum Apostolum, ulcisci omnem inobedientiam (II Cor. X, 6). Quaeri potest secundum litteram quomodo filii rem tam magnam facere potuerint, quos superius ipse Jacob parvulos appellavit dicens ad Esau: Nosti quod parvulos habeam mecum? Sed sciendum non parvo tempore ibi moratum Jacob. Nam et tabernaculum ibi fixit, et altare construxit, et partem magni agri emit centum | agnis. Per hoc ergo ostenditur diu ibi habitasse Jacob, quo tempore et filii ejus creverunt, et Dina nobilis facta est. Quod Simeon et Levi tantum commemorantur in facinore, sciendum plures eos habuisse socios, sed isti auctores caedis fuerunt, quorum soror uterina erat Dina.\
"""
