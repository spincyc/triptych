physical_line_ranges = [[57, 57]]
text = """
Vers. 4. Istae generationes coeli et terrae. Recapitulatio est creaturae Dei. Generationes coeli et terrae appellat ornatus eorum. Ornatus coeli sunt angeli et sidera: ornatus terrae homines et jumenta; arborum et florum varietates. In die. Id est in tempore. Diem hic posuit pro tempore sicut Apostolus: Ecce nunc tempus acceptabile, ecce dies salutis! Hoc in loco evanescit error philosophorum: qui dixerunt mundum Deo esse coaeternum, vel etiamsi, | a Deo et sine initio factus est, eum tamen ex materia non a Deo creatum constare dixerunt, quod tamen utrumque effluit, cum dicitur: In die fecit coelum et terram. Cum enim dicit: in die, ostendit eum non esse coaeternum Deo. Cum vero addit: fecit coelum et terram, mundum a Deo conditum manifestat. Si vero diem pro una die acceperimus positam, secundum illum sensum intelligendum est quem propheta dicit: Qui vivit in aeternum creavit omnia simul (Eccli. XVIII, 1). Juxta quem intellectum B. Gregorius dicit: « Rerum natura per substantiam simul creata est, sed per speciem simul creata non est. »\
"""
