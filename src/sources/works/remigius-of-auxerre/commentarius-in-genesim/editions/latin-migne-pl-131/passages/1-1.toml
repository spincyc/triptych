physical_line_ranges = [[33, 34]]
text = """
VERS. 1. In principio creavit Deus coelum et terram. Auctor hujus operis, sicut sancti doctores tradunt, cognoscitur fuisse Moyses qui per revelationem Dei mundi creationem cognovit, qui tamen more Scripturae de se quasi de alio loquitur. In principio hujus voluminis philosophi confutantur, qui de mundi creatione conati disputare, sicut Plato, qui tria dixit esse principia, Deum videlicet, exemplar, et materiam, et Deum non quasi auctorem ex nihilo cuncta creasse, sed quasi opifici in rebus creandis materiam adjutorium praestitisse. Aristoteles autem duo dixit | esse principia, materiam scilicet et speciem, tertium quiddam nescio quid volens dicere operatorium appellavit. Quorum erroribus obvians Moyses utpote a Deo electus veritatem dicitur demonstrasse, ostendens Deum cuncta simul ex nihilo formasse, non quidem in tempore, sed in initio temporis dicens: In principio, et subauditur: temporis, patet procul dubio tunc tempus coepisse quod antea minime erat.

Creavit enim coelum et terram. Coelum non istud visibile firmamentum accipere debemus, sed illud empyreum, id est igneum, vel intellectuale coelum | quod non ab ardore, sed a splendore igneum dicitur, quod statim repletum est angelicis spiritibus de quibus in Job dicitur: Cum me laudarent simul astra matutina et jubilarent omnes filii Dei (Job XXXVIII, 7). Et nota tria hic elementa commemorari. Nomine enim coeli aerem collige, nomine terrae ipsam terram, et ignem qui in ejus visceribus latet. Quarti vero elementi, id est aquae, in sequentibus fit commemoratio.\
"""
