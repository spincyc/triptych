text = """
Vers. 10. Audivi vocem tuam et abscondi me. Sicut amens et nimio timore perterritus. Abscondit autem se, non ut ejus scelera Dominus non videret, sed ut se indignum factum ejus aspectui ostenderet. Duplici autem verecundia arctabantur: vel quia illum obscenum motum in membris suis sentiebant quem antea nunquam experti fuerant, vel quia intelligebant ob transgressionem Dei praecepti hoc sibi contigisse. Adam, ubi es? Non quasi nescius interrogavit quem nihil latere potest, sed miseriam praevaricationis illi exprimit, cum dicit: Adam, ubi es? Id est, quam miser effectus es! Qui immortalis conditus fueras, mortis damno teneris, et innocentiae beatitudine | privaris. Vel, sicut B. Gregorius dicit, interrogatur a Domino, non ut Deus disceret quod ignorabat, sed ut ad humilitatem confessionis illum provocaret ut quod praevaricando deliquerat confitendo deleret. Sed ille peccatum suum in alium retorquere voluit, dicens:\
"""
