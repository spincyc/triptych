text = """
Vers. 3. Benedicam benedicentes te, et maledicam maledicentibus te. Duae repromissiones factae sunt ad Abraham: una terrena, qua ei terra Chanaan repromissa est, cum dictum est: Egredere de terra tua et cognatione, etc. Alia quae major est et spiritalis, qua dictum est: Benedicam tibi, ut esset videlicet pater Christi et omnium in Christo credentium. Sed et hoc notandum quia jam egressus fuerat de terra sua quando ei dictum fuerat: Egredere de terra tua. Sed ibi egressus corpore, hic vero mente et voluntate. Fortassis adhuc habebat affectum revertendi illuc quando dictum est: Egredere.--In te benedicentur | universae cognationes tuae: quia de ipso Christus erat nasciturus per quem cunctae generationes benedictionem percipere debuerant.\
"""
