text = """
Vers. 21. Immisit Dominus soporem in Adam, et tulit unam de costis ejus. Nunquid vigilante Adam | sine dolore Dominus costam ejus auferre non potuit quam eo dormiente abstulisse dicitur? Potuit utique. Sed hoc in mysterio potius fuisse credendum est, ut in principio mundi praefiguraretur sacramentum Dominicae passionis quod suo tempore, id est, in novissima saeculi aetate futurum erat. Nam dormitio Adae mortem Christi significat in cruce. Quo in cruce pendente, mysteria sanguinis et aquae de ejus latere profluxerunt, quibus sancta constat Ecclesia et unde roboratur. Unde et bene dicit: non formavit costam, sed aedificavit, quasi domum Ecclesiae praesignans quae ex vivis et electis lapidibus aedificatur. Et quod superius dixit breviter: Masculum et feminam creavit eos, nunc apertius exponit quomodo ipsam feminam creaverit:\
"""
