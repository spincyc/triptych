physical_line_ranges = [[392, 392]]
text = """
Vers. 7-20. Post multos itaque dies injecit domina oculos suos in Joseph. Mulier haec typum tenet Synagogae, | quae habebat virum, legem videlicet ipsam, qua regebatur et docebatur. Haec Christum in homine apparentem voluit lenocinando decipere: quia Synagoga volebat ejus legem carnaliter observare, Sabbatum et omnia quae illi in figura data fuerant, juxta litteram implere. Cui cum Christus nollet obtemperare, pallium ei rejecit, quia tegmen litterae legalis illi dimisit. Unde, sicut Apostolus dicit, usque hodie, dum legitur Moyses, velamen positum est super cor ejus (II Cor. III, 15). Sicque illam plebem dimisit Dominus dicens: Relinquetur vobis domus vestra deserta (Matth. XXIII, 38), et ad gentes transiit cum spiritali Scripturarum intellectu. Accusavit eum mulier, in argumentum marito pallium ostendens, quia Synagoga | Christum accusabat legis destructorem, et quia se Deum dicebat, aequalem se faciens Deo. Mittitur Joseph in carcerem: Christus descendit ad infernum. Educitur Joseph de carcere: Christus surgit a morte. Sed qui solus missus fuerat in carcerem, non solus eductus est. Nam principem, qui calicem porrigebat, eduxit et in pristinum gradum restituit. Sic et Christus resurgens suos de inferni carcere liberavit.\
"""
