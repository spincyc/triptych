text = """
Vers. 4. Respexit Dominus ad Abel et ad munera ejus. In quo respexit Dominus ad munera Abel? | Ignem videlicet coelitus mittendo quo sacrificium consumebatur. Quod Theodotionis translatio ostendit dicens: Inflammavit Dominus super Abel: super Cain autem non inflammavit. Tali enim modo probatur hostia Deo placuisse.

Sed quaeri potest quare Deus respexit ad munera Abel, ad Cain vero munera non respexit? Nunquid enim plus placet peculiaris hostia quam sacrificium Deo de fructibus? Sed sciendum quia Deus plus mentes offerentium, quam id quod offerebatur, attendit, et ideo respexit, id est, acceptum habuit et placuit illi munus ejus. Potest et aliud dici, quia avaritiam detestatus est in labore Cain. Sunt enim quidam qui plus justo desudant in laborando, non tantum | ut habeant sufficientiam, sed ut superflua quaeque et minus necessaria congregent. Hunc laborem superfluum vidit Deus in Cain, et ideo ad munus ejus non respexit. Ars vero pastoralis simplex est et innocua, quam post Abel sancti Patres habuisse leguntur.\
"""
