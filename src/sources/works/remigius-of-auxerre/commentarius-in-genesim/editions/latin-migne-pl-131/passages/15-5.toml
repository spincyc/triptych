physical_line_ranges = [[201, 201]]
text = """
Vers. 9. Sume vaccam triennem, capram trimam, et arietem trium annorum. Haec juxta litteram manifesta sunt. Mystice per haec animalia plebs Judaica designatur quae ab Abraham ducit originem. Per vaccam quidem, quia jugum legis traxit: per capram olidam et fetosam, quia peccatrix futura erat: per arietem vero qui est dux gregis significatur quia alio tempore regni imperium potentissime tenuit. Quod vero dicit vel capram, vel vaccam, vel arietem trium annorum esse debere, ostendit hanc plebem trium temporum articulis ad regni dignitatem | profecisse sub David. Prima aetas fuit sub Adam usque ad Noe, secunda a Noe usque ad Abraham, tertia ad Abraham usque ad David. Quod vero animalia divisa sunt, aves vero non sunt divisae, significat quia carnales quique subjacent divisioni. Dividuntur enim per sectarum scandala. Spiritales vero qui significantur per aves indivisibiles permanent, quia nullam fidei patiuntur corruptionem.\
"""
