physical_line_ranges = [[78, 78]]
text = """
Vers. 1. Sed et serpens erat callidior. Sive sapientior, sicut Theodotion dicit, non quidem per sui naturam, utpote qui animam rationalem non habet quae capax est sapientiae, sed quia plenus erat daemoniaco spiritu, quo scilicet veluti quodam organo ipse spiritus nequam utebatur. Ergo illa calliditas vel sapientia non erat serpentis, sed daemonis qui per serpentem | loquebatur, sicut solent loqui per energumenos vel fanaticos et vates daemoniorum: ipse vero serpens ea quae loquebatur ignorabat, sicut energumeni ea quae per illos malignus spiritus vel hostis loquitur ignorant. Proprium est maligni spiritus, ut, quemcunque invaserit, ita eum pondere suae infestationis deprimat, ut intellectum omnem et rationem ab eo auferat, et horum quae loquitur penitus expertem reddat. E contra Spiritus sanctus quoscunque sua dignatione idoneos fecerit et sui gratia repleverit, videntes, hoc est intelligentes faciat, ut non modo praesentia, verum etiam futura per Spiritum cognoscant. Unde et Apostolus dicit: Spiritus prophetarum prophetis subjectus est (I Cor. XIV, 32).-- Cur praecepit vobis Deus? et reliqua. Callidus hostis | ob hoc mulierem interrogat, ne post praevaricationem aliquam reatus sui excusationem habere posset. Fortassis enim dicere posset: Oblita enim mandatorum Dei, et ideo deliqui. Quam omnimodis excusationem amovens mandata Dei repetendo inculcat et ad memoriam reducit.\
"""
