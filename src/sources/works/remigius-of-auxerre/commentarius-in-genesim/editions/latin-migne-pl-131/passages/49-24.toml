text = """
| Vers. 25. Centum ergo et decem vitae suae a nis expletis mortuus est. Et nos studeamus, quod per Decalogi numerum vel observantiam ad aeternam beatitudinem, quam centenarius numerus designat, perveniamus. Conditus est quoque aromatibus ipse Joseph, et repositus est in loculo in Aegypto. Loculus est vas repositorium, ubi aliquod asservandum commendatur. O felix anima, quae, aromatibus virtutum condita, in hoc corpusculo degens quotidie proficiendo perenni vitae reservatur! Sine dubio si tali condimento condita in fide, spe et charitate custodita fuerit, per gratiam Christi ad divinae contemplationis speciem pervenire merebitur, cujus adeptio perfecta est laetitia; quam Psalmista oculis aspiciens ait: Adimplebis me laetitia cum vultu tuo, Domine: delectationes | in dextera tua usque in finem (Psal. XV, 11). Amen.

Explicit Commentum Bresith.\
"""
