text = """
| Vers. 9. Justus atque perfectus fuit. Si nullus sine peccato vivere potest, quomodo Noe justus et perfectus fuisse dicitur? Sancti Dei perfecti sunt secundum aliquem suum modum, non autem ita sunt perfecti sicut perficiendi sunt. Unde et recte dicitur: in generationibus suis. In praesenti enim vita pro modo suo juvante Dei gratia perfecti esse possunt. In illa enim beata vita, in qua nec velle nec posse peccati eis suberit, longe aliter perfecti erunt.\
"""
