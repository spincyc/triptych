text = """
Vers. 15. Trecentorum cubitorum. Sed hoc non mirabimur, si sciamus geometrico cubito illam esse mensuratam qui, ut Origenes dicit, sex cubitis humanis impletur. Positio autem arcae talis exstitit. Fuit enim fundamento quadrata, inaequalis tamen longitudinis et latitudinis, quae paulatim ab angulis conscendens in arctam formam sursum erigebatur, donec in cubito latitudinis et longitudinis summitas ejus perficeretur. Fuit autem decies longa quam alta, et sexies tantum longa quam lata ad similitudinem humani corporis. Nam si hominem pronum vel supinum jacentem metiamur, decies tantum longus erit a capite usque ad pedes quam altus a dorso usque | ad ventrem, et sexies tantum erit longus quam latus a dextero latere usque ad sinistrum.\
"""
