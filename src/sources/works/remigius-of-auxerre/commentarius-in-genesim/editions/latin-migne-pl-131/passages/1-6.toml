text = """
Vers. 6. Fiat firmamentum in medio aquarum. Quo scilicet firmamento aquae superiores divisae sunt ab aquis inferioribus, et illa pars superior in modum crystallini lapidis congelata est, caetera vero inferior | in mare redacta est. Et hoc quidem secunda die actum est, cujus diei opera minime bona esse dicuntur, sicut caeterorum dierum ubi dicitur: Vidit Deus, quod esset bonum, non ideo quod bonum non sit quod factum est, et pulchrum, sed propter binarium numerum, qui est transgressio unitatis et malam habet significationem. Unde et eum sancti Patres discordiae dedicaverunt. Ipse etiam bigamiam significat. In ejus etiam significatione bina animalia de immundis missa sunt in aream.\
"""
