text = """
Vers. 7. Statim in foribus peccatum aderit. Id est, patebit omnibus, et hoc quasi janitore comitaberis. Sed sub te erit, id est, sub tua potestate erit appetitus | ejus, et tu dominaberis illius. Et est sensus: Quia rationis capax es, et nosti quid sit bonum, quidve malum, debes dominari peccato, ut voluutas mala non usque ad operis nequitiam perducatur. Et hoc est, quod LXX dicunt: Peccasti? quiesce. Id est, Peccasti voluntate? quiesce a malo opere. Alia translatio habet: Si recte offeras, recte autem non dividas, dicit Dominus: peccasti. Et Cain recte obtulit, quia utique Deo qui solus est adorandus, et cui est sacrificandum. Sed non recte divisit, sua Deo dando, se autem sibi, cum Deus potius nos quam nostra desideret. Omnis enim qui aliquid offert considerare debet cui offerat, et quo offerat, et quando et quis sit ipse qui offert.\
"""
