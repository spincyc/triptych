text = """
Vers. 15. Inimicitias ponam inter te et mulierem et semen tuum. Mulierem hic Ecclesiam dicit, cui diabolus contrarius est. Semen vero mulieris bona opera sunt Ecclesiae, semen serpentis opera omnis iniquitatis. Haec est enim mulier illa, de qua Joannes | in Apocalypsi dicit, quod eam draco persequeretur, volens eam devorare, postquam etiam fluvium ex ore suo emisit (Apoc. XII, 13), quia persecutionem gentium contra Ecclesiam suscitavit. Ipsa conteret caput tuum. Id est, Ecclesia conteret caput tuum, id est, initium malae voluntatis, antequam ad opus prorumpat. Unde et in psalmo beatus dicitur qui parvulos Babylonis tenuerit, et ad petram alliserit (Psal. CXXXVI, 9). Parvuli Babylonis est initium peccati et origo malae voluntatis. Hi sunt parvuli confusionis qui, antequam proficiant, allidendi sunt ad petram, id est Christum.\
"""
