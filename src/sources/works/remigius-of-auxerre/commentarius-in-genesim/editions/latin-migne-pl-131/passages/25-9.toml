text = """
Vers. 22. Collidebantur. Septuaginta dicunt: Ludebant et calcitrabant.--Perrexitque ut consuleret Dominum. Quaeritur quo perrexerit consulere Dominum. Necdum enim tabernaculum, necdum templum Dei aedificatum erat. An forte perrexit illuc ubi | Abraham altare Domino aedificaverat, aut, ut quidam putant, adhuc Melchisedech sacerdos Dei vivebat, quamvis possit credi fuisse tunc temporis aliquem sanctum virum ad quem consulendum soliti erant pergere? Potest et illud dici, quod mente et cogitatione ad Deum perrexerit, et allegatis petitionibus in loco dormierit, ibique per visionem responsum divinum acceperit.\
"""
