physical_line_ranges = [[374, 374]]
text = """
Vers. 3. Tunicam polymitam. Id est glutinatam, vel orbiculatam, pulchra varietate distinctam. Alia translatio habet, fecit tunicam talarem, quae Graece poderis dicitur. Symmachus vero tunicatam, id est manibus artificis miro decore variatam vel manicatam, id est manicas habentem. Illo enim tempore maxime colobiis utebantur, id est vestibus sine manicis. Historia Joseph ad litteram patet, nunc mysterium investigemus. Joseph allegorice Christum significat juxta humanitatem. Jacob diligebat Joseph plus caeteris fratribus: et Deus Pater singulariter amabat Christum filium suum prae omnibus Judaeis, qui erant fratres ejus secundum carnis susceptionem. Fecit ei tunicam polymitam, id est multitudine credentium | ex omnibus circumdedit illum, dicens per prophetam: His omnibus velut ornamento vestieris (Isa. XLIX, 18) .-- Oderant enim eum fratres sui. Et Judaei videntes Christum per signa et miracula Dei Filium declarari, invidebant ei, et saepe in dolo et per insidias cum eo loquebantur. Quod vero dicit per somnium manipulum suum stare, et fratrum manipulos suum manipulum adorare, significat quia post resurrectionem ab omnibus credentibus cum fructu bonorum operum adorandus erat. Ipse est enim granum frumenti, quod per mortem seminatum germinavit per resurrectionem, et sic manipulos fidei et bonorum operum protulit per universum mundum. Quod vero aliud narrans somnium dixit se sole et luna et stellis undecim adoratum, quaeri potest | ad litteram ubi vel quando adoratus inveniatur a patre, qui per solem, et a matre, quae per lunam designabatur. Neque enim Jacob, quando in Aegyptum descendit, eum legitur adorasse. Mater vero ejus in Bethlehem defuncta fuerat. Ergo quia hoc ad litteram stare non potest, recurramus ad allegoriam. Haec enim visio manifeste prophetica fuit de Christo, quem sol, luna, stellae et omnis adorat creatura. Mystice etiam sol, id est excellentia et claritas sanctorum, illum adorat; luna, id est Ecclesia; stellae, id est singuli quique fidelium, illum venerantur sicut Deum.\
"""
