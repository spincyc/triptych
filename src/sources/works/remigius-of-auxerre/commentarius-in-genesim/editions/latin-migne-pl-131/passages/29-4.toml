text = """
Vers. 27. Imple hebdomadam hujus copulae. Hebdomadam hic septem annos dicit. Hebdomada dicitur septem dierum, et septem annorum, et septies | septem annorum. Allegorice hae duae mulieres duas significant vitas, activam et contemplativam. Lia laboriosa interpretatur: significat activam vitam. Quae bene lippis oculis, sed fecunda fuisse dicitur, quia activa vita minus videt per contemplationem, sed spiritales Deo parit filios per praedicationem et bonorum operum exempla. Rachel vero, quae ovis vel visus principium interpretatur, contemplativam designat vitam simplicem et quiete gaudentem, quae illud cernit principium, quod loquitur in Evangelio: Ego principium, qui et loquor (Joan. VIII, 25). Est pulchra, sed infecunda, quia contemplativa vita decora et Deo amabilis, nullo pulvere terreni contagii foedata, sed soli Deo vacans, eique tantum placere quaerens, nequaquam spiritales filios per | praedicationem generat. Amat Jacob Rachel, sed Liam in nocte accipit: quia unusquisque sanctus desiderat frui quiete contemplativae vitae, sed prius necesse est ut nocte hujus saeculi exerceatur labore activae vitae.\
"""
