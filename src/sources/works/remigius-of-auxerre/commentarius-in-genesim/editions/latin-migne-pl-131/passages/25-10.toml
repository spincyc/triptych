text = """
Vers. 23. Duae gentes in utero tuo sunt. Juxta litteram duas gentes Idumaeorum et Judaeorum dicit. Quod vero in sequentibus dicit: Major serviet minori, illud tempus, quando Esau major Idumaeorum servivit Jacob, id est Judaeis. David enim eos tributarios fecit, et sic servierunt sub tributo usquequo rebellaverunt, juxta quod in libro Regum legitur: Recessit | Edom, ne esset sub Juda (IV Reg. VIII, 20). Mystice hi duo gemini duos significant populos, Esau major natu Judaeos, Jacob vero minor gentilem populum. Major ergo servit minori, quia Judaicus populus dispersus per totum orbem servit gentibus, non solum corporali servitute, verum etiam quia legem et prophetas ad gentium utilitates servat. In nobis etiam ipsis haec rixa duorum populorum agitur, cum lex carnis repugnat legi mentis, cum vitia virtutibus contraveniunt. Nam per majorem vitia designantur, quia plura sunt virtutibus, et semper numero plures vel priores sunt mali quam boni. Sed per Dei | auxilium mali superantur a bonis et vitia cedunt virtutibus.\
"""
