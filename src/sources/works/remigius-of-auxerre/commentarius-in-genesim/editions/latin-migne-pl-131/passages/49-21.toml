text = """
Vers. 3. Transierunt quadraginta dies. Hic numerus poenitentiae et humilitati convenit. Unde et in Lege et in Evangelio et ab ipso Domino observatus est. | Septuaginta diebus. Ethnici, id est gentiles, novem diebus flebant mortuos suos. Unde et novendialis vocabatur nona dies, quando sepeliebatur. Nostri vero, id est Dei cultores, septem diebus exsequias mortuorum celebrant. Unde scriptum est: Luctus mortui septem dies; luctus autem fatui omne tempus vitae ejus (Eccli. XXII, 13). Septenarius requiem significat: unde et septima dies Sabbatum, id est requies, appellatur. Celebrant ergo septimam diem mortuorum optantes illos requiescere cum Domino a laboribus praesentis saeculi. Hic ergo dicit: Flevit eum Aegyptus septuaginta diebus, qui est decuplatus septenarius. Nam septies deni septuaginta sunt. Potest et hoc dici, quia sicut tertia dies mortui agitur a fidelibus, ut anima, quae triplicis naturae est, | requiescat; ita septima dies celebratur, ut anima corpori reconcilietur, quae carne illiciente peccavit. In septem enim tria sunt et quatuor. Et ternarius, ut dictum est, pertinet ad animam, quae est irascibilis, concupiscibilis, rationalis; quaternarius ad corpus, quod quatuor constat elementis.\
"""
