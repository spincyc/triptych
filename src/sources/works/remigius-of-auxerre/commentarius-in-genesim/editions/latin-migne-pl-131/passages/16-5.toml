text = """
Vers. 13. Tu Deus, qui vidisti me. Hoc est, qui | misertus es mihi. Videre enim Dei misereri est. Quod autem hic dicit: vidi posteriora videntis me concordat cum eo loco ubi Dominus ad Moysen dixit: Non enim videbit me homo et vivet. Ac deinde: Est locus apud me: stabis supra petram. Cum pertransiero, auferam manum meam, et videbis posteriora mea (Exod. XXXIII, 20 et seq.). Illam enim sapientiam, quae est Deus, invisibilem omni creaturae profecto nullus videre potest. Posteriora autem Dei mysterium est incarnationis Christi per quam videri ab hominibus potuit. Unde et bene dixit: Cum pertransiero. Nam transire hominis est.\
"""
