text = """
Vers. 21. Fecit Dominus Deus Adae et uxori ejus tunicas pelliceas. Pelles ex mortuis animalibus detrahuntur. Per tunicas ergo pelliceas ostendebatur quia mortales jam facti erant ex immortalibus, et non solum amiserunt beatum statum in quem mutari poterant, si non peccassent, verum etiam ipsam felicem vitam, qua in paradiso beate vivere poterant, perdiderunt. Ipsi quidem fecerunt sibi perizomata, ut peccatum suum Deo absconderent. Deus vero fecit illis tunicas pelliceas quibus totum corpus eorum induit, quia in corpore et in anima justo judicio damnavit. | In anima quidem propter peccatum praevaricationis, in corpore vero propter poenam peccati. Stulta vero quaestio est, si quis velit requirere qualiter vel quo operante pelles ab animalibus subductae sint. Qui enim de nihilo condidit omnia Deus, hoc quoque quomodo vel qualiter voluit fecit.\
"""
