text = """
Vers. 27. Accessit, et osculatus est eum. Osculum patris, quo Jacob osculatus est, reconciliationem significat | mundi, quam desiderabat Ecclesia loquens in Canticis canticorum, dicens: Osculetur me osculi oris tui (Cant. I, 1).-- Ecce odor filii mei sicut odor agri pleni. Odor vestimentorum est fragrantia virtutum. Bene autem agro pleno odor ille comparatur, quia sanctorum virtutibus mundus repletus est. Unde et Paulus dicebat: Christi bonus odor sumus Deo in omni loco (II Cor. II, 15). Ager enim plenus est mundus sanctorum bonis operibus refertus. Ibi redolent rosae martyrum, fragrant lilia virtutum, respirant violae continentium, ubi etiam florentes vineae apostolorum longe lateque suum odorem propinant.\
"""
