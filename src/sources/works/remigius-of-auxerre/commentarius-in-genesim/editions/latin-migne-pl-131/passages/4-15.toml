text = """
Vers. 17. Cognovit autem uxorem suam, quae concepit et peperit Enoch: et aedificavit civitatem, vocavitque nomen ejus ex nomine filii sui Enoch. Quia in timore erat et tremore, ideo fortassis civitatem aedificavit, ut ibi absconditus protegeretur. Quaeri autem potest cum quibus eam aedificaverit, si plus | vel plures non erant homines quam hi quos Scriptura commemorat. Sed sciendum multo plures jam tunc fuisse, quia diu vivendo plures filios generabant. Nec mirum, cum etiam filii Israel per quadraginta annos ita multiplicati legantur ut eorum numerari non posset exercitus. Aedificavit, inquit, civitatem, quam ex nomine filii vocavit Enoch. Enoch dedicatio interpretatur. Notandum autem quod in prima generatione de Cain nascitur Enoch, id est dedicatio; quia reproborum populus in prima generatione, hoc est in praesenti vita, se dedicat huic se adjiciens, et in hac, si fieri posset, semper manere volens. Unde et civitatem aedificavit, quia reprobi hic habent suam felicitatem et quasi fundamentum, cum Apostolus de se suisque similibus dicat: Non habemus | hic manentem civitatem, sed futuram inquirimus (Hebr. XIII, 14). De Seth vero natus est Enoch [ alias Enos vel Henos] septima generatione, quia sancti, qui ad Dei pertinent civitatem, alteri vitae, id est, futurae se dedicant quae post sex saeculi aetates septima generatione, hoc est, justorum congregatione vel resurrectione manifestabitur.

Lamech primus bigamiam perpetravit, quia duas uxores habuit, et propterea in diluvio periit.\
"""
