text = """
Vers. 14. Commutans manus Joseph duos filios patri adduxit. Ut eis benediceret. Primogenitum suum Manassen posuit ad dextram patris; juniorem vero, id est Ephraim, ad sinistram. Ille afflatus spiritu prophetico, praevidens quae ventura erant, posuit dexteram manum super caput junioris Ephraim, sinistram vero super caput Manasse, qui major natu | erat, manibus in modum crucis in transversum commutatis: quia illum videbat multiplicandum, et Jeroboam regem ex tribu Ephraim futurum. Mystice per hos duos filios Joseph duo populi signantur. Per Manassen, qui oblivio interpretatur, accipitur Judaicus populus, qui oblitus est Domini creatoris sui. Per Ephraim, qui frugifer vel fecunditas interpretatur, gentilis populus figuratur, qui credendo in Christum fidei et bonorum operum fructum Domino obtulit, et spirituali fecunditate multiplicatus est. Hic licet posterior Dei cognitionem perceperit, constitutus est tamen ante Manassen: quia quam gratiam habuerunt Judaei et sacramenta Scripturarum atque omnem dignitatem divinae legis, Judaeis reprobatis, accepit.\
"""
