text = """
Vers. 14. Numeravit expeditos vernaculos. Expeditos, id est sine uxoribus. Persecutus est eos usque Dan. Dan fons est ex quo Jordanis efficitur. Nam duo fontes sunt ad radices montis Libani, Jor et Dan, qui juncti Jordanem efficiunt. Dan autem judicium, Jor rivus interpretatur. Usque ad Phoenicem. Phoenicem Syriam dicit. Allegorice hoc bellum Abrahae contra quatuor reges bellum significat virtutum et vitiorum. Pater ergo fidei et prima via credendi Abraham pro fratre suo Lot contra quatuor reges dimicavit et vicit non in multitudine exercitus, sed in trecentis decem et octo vernaculis expeditis. Sic | unusquisque nostrum pro anima sua tanquam pro fratre suo Lot contra quatuor reges, id est, contra spiritales nequitias spiritale bellum gerat cum trecentis decem et octo vernaculis, id est cum auxilio sanctae crucis. Hic numerus in Tau littera, quae figuram Christi habet exprimitur.\
"""
