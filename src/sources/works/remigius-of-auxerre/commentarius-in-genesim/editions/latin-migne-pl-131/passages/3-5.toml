text = """
Vers. 7. Et aperti sunt oculi eorum. Quare dictum est, aperti sunt oculi? Nunquidnam Deus eos in paradisum non videntes constituerat? Non utique. Sed aperti sunt oculi eorum ad concupiscentiam et cognitionem bestialis motus quem prius in se minime cognoverunt. Est enim quoddam genus caecitatis quod Graece aorasia, id est avidentia dicitur, | qua quaedam videntur, quaedam vero non. Qua caecitate tenebantur illi duo discipuli cum Domino pergentes in Emmaus, de quibus dicitur: Oculi eorum tenebantur, ne eum agnoscerent (Luc. XXIV, 16).-- Cumque cognovissent se esse nudos. Cognoverunt se esse nudos in hoc quod bestialem motum senserunt quem antea non senserunt. Unde et ad ficum confugerunt, quia fortassis, ut beatus Augustinus dicit, hanc arborem primam post praevaricationem repererunt, et ex foliis ejus fecerunt sibi perizomata, id est succinctoria sive bracas; et apposuerunt sibi in membris genitalibus, circa lumbos videlicet in quibus sementiva vis esse dignoscitur. Congrue autem ex foliis fici fecisse sibi perizomata dicuntur, quae pruritum quemdam in se habere noscuntur. Significat | autem pruritum carnis et incentivae libidinis ardorem, de qua beatus Ambrosius dicit: « Beati, qui ligant equos suos ad vitem olivae, ad arbores laetitiae et pacis, non ad ficum, quae est humilis ad altitudinem, mollis ad laborem, sterilis ad fructum. »\
"""
