text = """
Vers. 12. Hic ferus homo erit. Id est agrestis et rusticus. Pro quo LXX dicunt: Hic erit Phara. Phara interpretatur onager, significans autem Sarracenos, qui de Ismael ducunt originem, qui per latam solitudinem incertis sedibus vagantes impugnant omnes | eremi vicinos et ab omnibus impugnantur. Allegorice hae duae mulieres, exponente Apostolo (Galat. IV, 22 et seq.), Synagogam et Ecclesiam significant. Agar quidem Synagogam quae in servitutem generat populum Judaeorum qui feri sunt et agrestes, jugum Domini leve et fidem ejus nolentes recipere, ideoque dispersi, et vagabundi sunt per totum orbem et omnibus maxime Christianis contrarii. Sara vero Ecclesiam quae primum sterilis et infecunda fuit, postea vero in libertatem fidei et gratiae plebem catholicam generavit.\
"""
