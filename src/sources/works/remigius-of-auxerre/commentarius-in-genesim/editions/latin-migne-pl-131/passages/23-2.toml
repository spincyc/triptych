text = """
Vers. 7. Surrexit et adoravit. Cum Dominus dicat in lege: Dominum Deum tuum adorabis et illi soli servies, quid est quod Abraham homines legatur adorasse? Sed aliud est, Deum adorare eo modo, | quo solus colendus et adorandus est; aliud, quo se sancti homines invicem venerantur atque suscipiunt, quamvis non dixerit: Dominum Deum tuum solum adorabis, sicut dixit: Illi soli servies. Est enim servitus quae soli Deo debetur, quae Graece latria dicitur. Unde et idololatrae dicuntur qui relicto creatore creaturae serviunt. Nam quod Apostolus dicit: Per charitatem servite invicem (Gal. V, 13), de illa servitute dictum est qua sancti homines se praeveniunt sibique obsequuntur, quae Graece dulia dicitur. Unde et servos dulos vocamus. Quod vero in Apocalypsi angelus volentem se Joannem adorare prohibuit, dicens: vide, ne feceris, fortassis aliquod divinum in angelo suspicatus fuerat Joannes et ideo sicut Deum voluerat adorare, idcirco prohibitus est.\
"""
