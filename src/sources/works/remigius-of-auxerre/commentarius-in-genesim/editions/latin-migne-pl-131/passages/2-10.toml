text = """
Vers. 18. Faciamus ei adjutorium. Id est, feminam ad procreandas herbas et arbusta, non autem ut illa filiorum procreatio talis esset qualis nunc est, scilicet ut ibi filii mortuis parentibus succederent, sed potius ut parentes videntes filios ex se natos laetarentur, et cum illis diu feliciter vivendo exspectarent | illum beatum statum et vitam angelicam, ad quam transferendi erant finito saeculo non per mortem, sed per quamdam divinae imitationem virtutis. Impleto namque omnium electorum numero, ubi nullus reprobus nasceretur, gustarent omnes de ligno vitae, et sic ab isto medio statu transferrentur in illum beatum statum ubi jam nec velint nec possint peccare.\
"""
