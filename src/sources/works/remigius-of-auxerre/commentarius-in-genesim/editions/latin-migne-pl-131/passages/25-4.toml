text = """
Vers. 8. Deficiens mortuus est. Beatus Hieronymus dicit hoc male additum scriptorum vitio. Neque enim defectus vel imminutio justo viro convenit, cum potius augeri et multiplicari debeat Psalmista dicente: Justus ut cedrus Libani multiplicabitur (Psal. XCI, | 13). Plenus dierum. Plenitudo in ortu, actu et obitu sanctorum solet inveniri. Et ideo recte Abraham plenus dierum mortuus fuisse legitur, consummatus et perfectus erat omnibus virtutibus. Econtra in reprobis omnia quadam imperfectione notantur. Unde et psalmus: Viri sanguinum et dolosi non dimidiabunt dies suos (Psal. LIV, 24).-- Congregatus est ad populum suum, id est ad multitudinem praecedentium patrum.\
"""
