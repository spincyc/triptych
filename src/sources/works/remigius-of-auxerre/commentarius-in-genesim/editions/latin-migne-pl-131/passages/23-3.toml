text = """
| Vers. 17. Confirmatusque ager est quondam Ephronis. Primum dictum est Ephron, id est confirmatus et perfectus, sed postquam pretium ex sepultura accepit, licet cogente Abraham, immutatum est nomen ejus et dictum est Ephran, id est infirmus vel imperfectus. Audiant hoc qui sepulturas mortuorum vendunt. Si enim ille qui licet invitus tamen quomodo adduci potuit ut pretium de sepultura acciperet nominis immutatione damnatus est, multo magis isti, qui non coguntur, sed ipsi quid exigunt, damnabuntur et inter perfectos non computabuntur. In quo erat spelunca duplex. Mystice spelunca duplex operationem rectam et contemplationem significat, activam videlicet et contemplativam. Sara ergo in duplici spelunca sepelitur, cum anima fidelis | cupiditatibus et desideriis saeculi mortua sub boni operis et contemplationis tegmine celatur. Unde et apostolus Paulus dicit: Mortui estis, et vita vestra abscondita est cum Christo in Deo.\
"""
