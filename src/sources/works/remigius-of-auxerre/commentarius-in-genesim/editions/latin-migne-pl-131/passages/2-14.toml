text = """
Vers. 24. Quamobrem relinquet homo patrem et matrem. Hunc locum exponens Apostolus dicit: Sacramentum hoc magnum est: ego autem dico in Christo et in Ecclesia (Eph. V, 32). Homo Christus intelligitur propter assumptam humanitatem. Qui dereliquit Patrem, quando de sinu paterno descendens | novus homo mundo visibilis apparuit, non deserendo Patrem, cum quo semper in divinitate inseparabiliter mansit. Dereliquit matrem, id est, Synagogam, de qua et carnem assumpsit. Adhaesit uxori suae, id est, conjunxit sibi Ecclesiam non habentem maculam aut rugam. Et factae sunt duo in carne una, id est, Christus qui caput, et membra ipsius, id est Ecclesia, sicut ipse Patrem orat pro primitiva sua Ecclesia, id est apostolis suis, dicens: Volo ut sint unum sicut et nos unum sumus (Joan. XVII, 21).\
"""
