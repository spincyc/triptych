physical_line_ranges = [[447, 447]]
text = """
Vers. 14. Issachar, inquit, asinus fortis. Asinum fortem vocat juxta litteram, quia laborabat in vehendis mercibus ad mare. Accubat in terminis, videlicet juxta possessionem Nephthalim. Hebraei dicunt quod assidue homines illius tribus operabantur in divinae legis meditatione, et ideo asinus fortis vocatur propter assiduum studium inquirendae sapientiae. Issachar asinus fortis. Quia dixerat possessionem Zabulon in maritimis locis futuram, redit ad mediterranea, et praedicit possessionem Issachar, quod fertilissima futura esset, et negotiationibus abundaret. Mystice Issachar populum gentilem significat, | qui quondam stultus et ignobilis praegravabatur oneribus peccatorum. Postquam vero Christum cognovit, coepit accubare in terminis, hoc est, requiescere in spe promissae felicitatis, quam exspectat in termino, hoc est, in fine saeculi. Vidit enim requiem, quod esset bona, illam videlicet, quae in alia vita omnibus sanctis repromittitur. Vidit terram, quod esset optima, eam, de qua Psalmista dicit: Credo videre bona Domini in terra viventium (Psal. XVI, 13); et ideo supposuit humerum ad portandum, quia pro adeptione patriae coelestis libenter omnia tolerat saeculi adversa. Factusque est tributis serviens, quia censum fidei et bonorum actuum Christo reddit.\
"""
