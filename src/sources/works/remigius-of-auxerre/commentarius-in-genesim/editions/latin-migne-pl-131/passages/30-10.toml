text = """
Vers. 37, 38. Tollens virgas populeas, ut in aspectu earum conciperent. Cum proposuisset Laban ut varios fetus pecorum haberet Jacob pro mercede, | ille prudentia solertis viri virgas populeas et amygdalinas et ex platanis ex parte decorticavit, et ex parte integras dimisit, posuitque eas in canalibus in quibus aqua putei fundebatur, ut venientes ad potandum oves duplici desiderio coeundi et bibendi tenerentur, et ipso calore coitus aspicerent virgas et sic varios fetus conciperent. Significat autem extremam partem patrationis, quando jam totum corpus animalis concutitur et finis imminet voluptatis. Nec incredibile hoc videri debet cuiquam, cum hodieque in Hispania de equabus hoc idem fieri dicatur. Beatus quoque Augustinus dicit, in libro Hippocratis medici scriptum haberi, quod, cum quaedam mulier Aethiopissa pulcherrimum et candidissimum puerum edidisset, et propter hoc tanquam rea adultera duceretur | ad mortem, Hippocrates medicus superveniens docuit, mulierem ad aspectum rei quam viderit, vel mente tenuerit, concipere. Unde jussit requiri in domo ejus, utrum ibi imago vel similitudo aliqua esset quam concumbens mulier habuerit. Quod et cum ita inventum fuisset, liberata est mulier a mortis periculo. Allegorice virgae significant sententias Patrum sanctorum, quas ex corpore Scripturae divinae quasi ex arbore praecidunt. Quae quia rectae sunt, virgae vocantur. Has virgas ex parte decorticamus, et ex parte corticem remanere permittimus, quando Scripturas divinas partim historialiter, partim allegorice tractamus. Ubi enim historiam sequimur, corticem dimittimus. Ubi vero historiam fugientes allegoricae insistimus, quasi cortice | subtracto candorem spiritalis intelligentiae operimus. Has ergo virgas in oculis ovium ponere, est Scripturarum exempla mentibus fidelium proponere, ut secundum quod ibi invenerint, vivant, et spiritales bonorum operum fetus pariant.\
"""
