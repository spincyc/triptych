text = """
| Vers. 1. Adam vero cognovit uxorem suam. In paradiso positus non legitur cognovisse uxorem suam, sed postquam ejectus est de paradiso. Quia enim peccaturus erat et mortales filios generaturus, ideo nullus ex ejus stirpe in paradiso natus est qui locus est vitae. Quae concepit et peperit dicens: possedi hominem per Deum. Cainiti Hebraice Possidere dicitur. Quia ergo mater dixit: Possedi hominem, vocatus est Cain possessio.\
"""
