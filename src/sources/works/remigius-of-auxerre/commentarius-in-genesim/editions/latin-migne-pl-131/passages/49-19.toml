physical_line_ranges = [[455, 455]]
text = """
Vers. 27. Benjamin lupus rapax. Hunc locum ita Hebraei edisserunt. Altare quod in templo erat Domini, in parte tribus Benjamin situm erat. Hoc ergo altare vocat lupum sanguinarium et rapacem propter hostias quae ibi mane offerebantur, et igne, qui erat semper in altari, devorabantur. Hoc est quod decit: Mane comedet praedam. Quod vero sequitur: Vespere dividet spolia, ad sacerdotes pertinet, qui ea quae per diem de sacrificiis altaris a populo consequebantur, vespere inter se dividebant. Et hoc secundum illos. Nos vero de Paulo apostolo dictum accipimus, qui fuit de tribu Benjamin, et quasi lupus rapax persecutus est Ecclesiam primo tempore. Unde et in | Psalmo dicitur: Ibi Benjamin in mentis excessu (Psal. LXVII, 28). Hic ergo mane praedam comedit, quando sanctos laniabat, et acceptis a principibus epistolis usque in exteras nationes sequebatur. Vespere autem divisit spolia, quando jam conversus doctrinam Evangelii magna discretione fidelibus distribuit. Notandum autem quod cum illis fratribus qui de liberis nati erant, id est Lia et Rachele, etiam ancillarum filii benedicti sunt: in quo ostenditur non esse personarum acceptionem apud Deum, qui omnes vult salvos fieri, nec discernit gradus nativitatis, quos una fides facit aequales.\
"""
