text = """
| Vers. 6. Sed fons ascendens e terra universam ejus superficiem irrigabat. Fons autem ille, vel per occultos meatus terrae decurrens ascendebat ad irrigandam terrae superficiem, more Nili fluminis qui alvei sui metas progrediens irrigat plana Aegypti: vel etiam irrigans universam superficiem terrae, non quo omnem terrae superficiem operiret, sed rivatim more fluminum per diversa loca dirivaretur. Vel, quod melius placet more sacrae Scripturae, singularem posuit pro plurali, vel fontem pro fontibus, sicut muscam pro muscis, ranam pro ranis. Aut etiam fontem propter universitatem omnium aquarum quae simul sunt et quasi unus fons in matrice abysso.\
"""
