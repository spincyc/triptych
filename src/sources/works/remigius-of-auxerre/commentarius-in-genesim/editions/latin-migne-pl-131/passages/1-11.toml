physical_line_ranges = [[44, 56]]
text = """
Vers. 27. Ad imaginem et similitudinem suam. Imago dicta quasi imitago. Distat inter imaginem et similitudinem. Imago est in ratione et in immortalitate: similitudo vero in morum sanctitate et justificatione. Similitudinem itaque peccando perdidit: imaginem non amisit. Nec audiendi sunt qui dicunt hominem in corpore Dei imaginem habere. Hanc enim potius cum animalibus communem habemus, quia, quomodo ea quinque sensus corporis habent, ita et nos. In anima quippe imaginem Dei habemus. Quod Deus in majori mundo, hoc anima | in corpore nostro, operatur. Unde et microcosmos Graece vocatur, id est minor mundus. Deus enim extra mundum positus non excluditur, intra mundum includitur, et praesidendo sustentat, et sustentando praesidet, et circumdando implet, et implendo circumdat. Sic et anima nec extra corpus posita excluditur a corpore, nec intra corpus includitur, sed ubique tota, ubique integra. Masculum et feminam. Non utrique uno tempore facti sunt per speciem, sed in praesentia Dei cuncta simul facta esse dicuntur. Unde est illud: Qui vivit in aeternum creavit omnia simul (Eccli. XVIII, 1). Mystice firmamentum sanctam significat Scripturam, sicut in ejus significatione in Apocalypsi dicitur: et coelum recessit sicut liber involutus (Apoc. VI, 14): aquae | multae populi sunt. Tunc ergo firmamentum in medio aquarum factum est, quando Scriptura divina populis innotuit. Aquae quidem super firmamentum significant angelicas catervas quae bene super firmamentum esse dicuntur, quia, Deum semper prae oculis habentes, non indigent legali institutione neque evangelicis praeceptis. Quae vero sub firmamento sunt aquae, homines significant qui divinis edocentur praeceptis, sine quibus ad coeleste regnum pervenire nequeunt.

Tertia die congregatae sunt aquae in locum unum, et apparuit arida. Per aridam significantur corda electorum sitientia aquam baptismatis et fontem doctrinae coelestis. Collectis ergo aquis in unum, id est reprobis separatis a justis, apparuerunt sancti, | divisi ab amaritudine infidelitatis et inconcussa fidei firmitate roborati.

Quarta die facta sunt luminaria in firmamento. Per firmamentum, sicut diximus, sacra Scriptura non inconvenienter accipitur; per luminaria vero evangelistas, doctores et praedicatores intelligimus, qui illuminati Spiritus sancti gratia alios ad lucem fidei sua praedicatione convertunt. Qualibus per Petrum [Paulum] dicitur: In medio nationis pravae et perversae, inter quos lucetis sicut luminaria in mundo verbum vitae continentes (Philip. II, 15, 16). Bene autem luminaria in firmamento posita vel constituta, ut illi semper inhaereant: quia doctores debent contemplari et cohaerere sacrosanctae Scripturae. | Quod apte praefigurabant vectes illi qui in quatuor arcae circulis positi nunquam inde abstrahebantur (Exod. XXXV). Per quatuor quippe circulos, totidem Evangeliorum volumina praefigurantur; per vectes, doctores, in quorum cordibus portatur arca, id est lex divina. Nunquam ergo vectes a circulis arcae auferebantur: quia praedicatores doctores nunquam habere debent vacuam meditationem legis Dei.

Quinta die produxerunt aquae reptile animae viventis. Per haec animalia, quae ex aquis sunt formata et vivunt in aquis, signatur ordo baptizatorum, qui, velut pisces, sine aquis baptismatis Christi vivere nequeunt. Volatile nihilominus typum retinet sanctorum, qui penna virtutum et contemplationis | ad coelestia festinare contendunt.

Per jumenta, quae sexta die creata sunt, doctores ac quilibet ecclesiastici viri exprimuntur, qui minus valentes adjumento suae praedicationis in fidei firmitate corroborant. Bestiae vero praesignant potentes vel superbos qui, more bestiarum, in quoscunque suae crudelitatis saevitiam exhibent. Per serpentes, qui hoc in loco in bonum accipiuntur, sancti designantur prudentes et astuti caventes dolos diaboli, quibus Dominus dicit: Estote prudentes sicut serpentes (Matth. X, 16).

Hac ipsa die factus est homo, id est, Christus per Virginem natus est secundus Adam, qui primi hominis peccata tolleret.

Possunt tamen haec sex dierum opera ad totidem | saeculi aetates referri. Prima itaque die fecit Deus lucem. Hac ipsa aetate creavit hominem rationabilem ad similitudinem suam. Quasi enim homo lux vocatur ad comparationem animalium irrationabilium, de quo dicitur: Erat lux vera quae illuminat omnem hominem (Joan., I, 9). Divisit lucem a tenebris in hac die: quia hac aetate filii Dei, id est, filii Seth separati sunt ab impia generatione Cain, cujus vespera fuit multiplicata iniquitas hominum ideo ut induceret Deus diluvium.

Secunda die factum est firmamentum: quia hac aetate arca in diluvio enatavit, et omni genere hominum damnato, solae octo animae in ea salvatae sunt: cujus vespera superbia fuit praesumptio, quia homines voluerunt aedificare turrim, et linguarum | confusio facta est.

Tertia die congregatae sunt aquae: quia hac aetate separatus est populus Dei per Abraham a caeteris nationibus, et illis congregatis vel conclusis in amaritudine et volumine peccatorum, isti in cultu unius Dei solidati sunt, ut herbam virentem virtutum germinarent et fructum bonorum operum proferrent: cujus vespera fuit in perditione Saulis et Jonathae in monte Gelboe quando ab Allophylis interfecti sunt.

Quarta die facta sunt luminaria: quia quarta aetate dignitas regia splenduit in David, et in Salomone et in caeteris regibus et prophetis qui maxime hac aetate floruerunt. Hujus vespera fuit in | Sedechia quem rex Babylonis multavit oculis, eversa Jerusalem et destructo templo, transtulit in Babylonem.

Quinta die ex aquis producta sunt animalia: quia hac aetate populus Judaeorum inter gentes velut in aquis captivus versabatur, et tamen a cultu Dei non recedebat. Multum etiam jam sancti quasi aves per contemplationem ad coelestia sublevabantur, sicut Jeremias, Ezechiel, Neemias, etc. Cujus vespera fuit infidelitas et maximum peccatum eorum qui Christum sibi repromissum videntes recipere noluerunt.

Sexta die homo factus est. Hac aetate natus est Christus per Virginem. Qui praelatus est bestiis terrae et piscibus maris et volatilibus coeli: quia | omnes gentes jugo fidei suae subjecit. Cujus aetatis vespera finis erit saeculi.

Septima die requievit Deus: quia septima aetas est animarum requiescentium in Christo et exspectantium generalem corporum resurrectionem.\
"""
