physical_line_ranges = [[61, 62]]
text = """
Vers. 8. Plantaverat paradisum voluptatis a principio. Id est hortum voluptatis. Graece enim paradisus hortus, Hebraice Eden vocatur. A principio, id est in initio, remotis aquis a superficie terrae et in unum collectis. Ubi autem nos habemus: Paradisum a principio, quidam codices habent: Eden ad ortum, ex quo possumus conjicere paradisum in Oriente situm. In quacunque autem orbis parte sit, scimus eum terrenum esse, et interjecto Oceano et montibus | oppositis a nostro orbe longe remotissimum. Est enim in altissimo loco situs pertingens usque ad lunarem circulum. Unde et illuc aquae diluvii minime pervenisse dicuntur. In quo posuit hominem. Ex quo, quod positus in paradisum homo dicitur, datur intelligi non ibi fuisse conditum, sed in hac nostra mortali terra, quia, divina praescientia, illum peccaturum et ob hoc ab illa sancta terra in hanc convallem miseriae propellendum.

Vers 9.-- Produxitque de humo. Subauditur paradisi. Lignum vitae et reliqua. Lignum vitae species arboris fuit ita vocata, quod naturaliter hanc virtutem | sortitum est, ut si quis ex eo fructum comederet perpetua soliditate firmaretur et beata immortalitate vestiretur, nullis deinceps infirmitatibus vel anxietatibus deprimendus, nulla senii lassitudine vel imbecillitate deterendus. Lignum autem scientiae boni et mali nullius arboris certa species credenda est, sed in posterum ventura nomen ejus inditum fuit ex qualitate scilicet obedientiae vel inobedientiae, quae obedienti scientia boni existeret: inobedientia vero, mali ac per hoc peccati nervum incurrenti scientia mali fieret. Obedientia autem sola virtus est quae hominem Deo conciliat, sicut e contra tumor, id est inobedientia, longe a Deo separat. Quid enim aliud est inobedientia quam nolle subdi Deo, sed suae velle esse potestatis?\
"""
