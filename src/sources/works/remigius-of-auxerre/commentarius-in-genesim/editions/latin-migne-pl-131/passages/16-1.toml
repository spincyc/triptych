text = """
Vers. 1. Igitur Sara uxor Abraham non genuerat liberos. Quomodo potest Abraham excusari ab adulterio, qui vivente uxore sua ancillae junctus est? Sed necdum promulgata erat lex Evangelii unius uxoris. Simul etiam audierat multiplicandum esse genus suum sicut stellas coeli, sed nesciebat per quam mulierem, quia Saram sterilem noverat. Non ergo fuit in concumbendo libidinosa voluptas, sed pia propagandae prolis charitas. Simul etiam dicendum quia hoc voluntate nimiae cogentiae uxoris fecit quae, | quia ipsa filios habere non poterat, ex alia eos suscipere cupiebat.\
"""
