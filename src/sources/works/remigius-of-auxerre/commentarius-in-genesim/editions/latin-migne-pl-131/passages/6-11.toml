text = """
Vers. 16. Fenestram in arca facies. Ad hoc fenestra in arcae summitate facta est, ut haberet aditum Noe, per quam emitteret, sicut postea fecit emittens columbam et corvum. Quam fenestram tradunt Hebraei crystallinam fuisse. Mystice autem Noe, vir justus et perfectus nomine et actu, Christum significat. Interpretatur enim requies, quia electos suos finitis laboribus saeculi hujus ad aeternam Christus perducturus est requiem. Qui vere solus et justus et perfectus est, de quo Apostolus: Ut sit ipse justus et justificans eum qui ex fide est (Rom. III, 26). Potest etiam Noe typum tenere praepositorum in Ecclesia sive etiam totius familiae Christi, membrorum videlicet | ejus qui per lignum crucis et aquam baptismatis salvantur. Arca vero sancta est Ecclesia quae de lignis levigatis, hoc est, sanctis in aeternum victuris construitur. Et sicut in arca diversa erant genera animalium, sic in Ecclesia diversa sunt hominum genera. Ostium in latere vulnus significat in latere Christi, de quo ipsa Ecclesia una cum sacramentis constat sanguinis et aquae.\
"""
