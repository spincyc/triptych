text = """
Vers. 29. Pone manum tuam sub femore meo, et jura mihi per Deum coeli, ut non accipias uxorem | de filiabus Chanaan. Ostendit se Jacob filium sancti Abrahae non carne tantum, sed moribus. Ille enim adjuravit servum suum dicens: Pone manum tuam sub femore meo, jura mihi per Deum coeli, ut non accipias uxorem de filiabus Chanaan. Hic similiter adjurat filium Joseph, ut non sepeliat eum in Aegypto. Uterque enim incarnationem Christi et praevidebat et fideliter credebat venturam. Quaeri autem potest cur sancti patriarchae tantum curam habuerint sepeliendorum corporum, cum scirent cadavera et in sarcophagis sepulta et sub nudo coelo aequaliter posse putrescere. Nam et poeta dicit: Coelo tegitur, qui non habet urnam. Sed hoc faciebant, non quo curam habebant ipsorum cadaverum, quae quoquomodo in terram reditura | erant, sed ut memoriam sui aliis relinquerent, sicque eos ad se imitandum provocarent. Nam et Dominus ad Job loquitur: Restituetur sicut lutum signaculum, et stabit sicut vestimentum plicatum (Job XXXVIII, 14). Signaculum, id est homo ad imaginem Dei factus, ut lutum per mortem restituitur, non tamen temere aut negligenter projicitur, sed sicut vestimentum plicatum tuto loco reponitur, ut rursum per resurrectionem reinduatur.\
"""
