physical_line_ranges = [[303, 303]]
text = """
| Vers. 1. Cumque senuisset Isaac, et caligaverunt oculi ejus, etc. Diximus superius Isaac typum tenere Dei omnipotentis Patris, Esau vero primogenitum figuram habere Judaici populi, de quo ipse ad Pharaonem: filius primogenitus meus Israel (Exod. IV, 22). Desiderat Isaac cibis filii sui vesci, et Deus Pater desiderabat bonis operibus illius populi pasci. Sed, illo negligente, et in exterioribus quasi in venatione occupato, Rebecca, id est mater gratia, minorem filium, id est gentilem populum, supposuit, et prioris locum ac dignitatem praeripuit. Quod autem Isaac caligans oculis Jacob filio futura praedixit, sed | cum non vidit, significat quia Deus Pater vocationem gentium per prophetas multipliciter praedixit, sed eas quodammodo non vidit; hoc est, non misertus earum, permisitque ingredi vias suas, et errare per quinque saeculi aetates. Quod vero Jacob non de venatione, sed de domesticis animalibus, id est haedis, cibos patri paravit, designat quia populus gentium non in exterioribus nec in littera legis Deo placere studuit, sed in se ipso acceptabile holocaustum per fidem et dilectionem obtulit, dicens cum Psalmista: In me sunt, Deus, vota tua, quae reddam laudationes tibi (Psal. LV, 12).-- Vestes Esau quibus Rebecca minorem filium vestivit, ornamenta sunt divinorum praeceptorum, quibus ille prior populus quondam decorabatur; sed illo per infidelitatem reprobato, | gentes in Christum credentes vestiuntur, Domino dicente: Auferetur a vobis regnum Dei, et dabitur genti facienti fructus ejus (Matth. XXI, 43). Quod vero pellibus haedorum manus et colli nuda protexit, designat quia gentes ad fidem venientes peccata operum confiteri non erubescunt. Haedus enim peccatorem designat, Domino dicente: Statuet oves a dextris, haedos autem a sinistris (Matth. XXV, 33). Quod dicit: Voluntas Dei fuit ut cito mihi occurreret, quod volebam, citam mundi conversionem designat. Pene enim modo incredibili intra brevissimum temporis spatium fides Christi per universum mundum nuntiata est.\
"""
