text = """
Vers. 11. Tulit de lapidibus. Dormitio Jacob in itinere mortem vel passionem Christi significat in cruce. Lapis quem capiti suo supposuit, Christus est secundum humanitatem. Quem Jacob unxit, ut per hoc aperte Christus demonstraretur. Christus enim Graece Latine unctus dicitur. Apostolus autem | dicit: Caput Christi Deus (I Cor. XI, 3). Lapis ergo capiti Jacob suppositus humanitatem significat assumenti Deo conjunctam. Scala quam in somnis vidit, quae via erat ad coelum, hoc est a carne usque ad animam vel spiritum, Christus est, qui quibusdam provectibus electos suos sublevando ex carnalibus facit spirituales. Angeli quos vidit ascendentes et descendentes, sancti sunt evangelistae vel caeteri praedicatores, qui quodammodo per scalam ascendunt quando divinitatem Christi annuntiant dicentes: In principio erat Verbum (Joan. I, 1). Descendunt vero, quando humilia incarnationis ejus describunt dicentes: Verbum caro factum est, et habitavit in nobis (Ibid., 14). Paulus summus angelus | erat, qui ascendebat cum diceret: Nos praedicamus Christum Dei virtutem et Dei sapientiam (I Cor. I, 24). Descendebat, cum diceret: Nihil scire me judicavi nisi Jesum Christum, et hunc crucifixum (I Cor. II, 2). Moraliter, in itinere dormire est in via hujus saeculi ab impedimento saecularium rerum vel actionum quiescere. Jacob vero dormiens angelos vidit: quia illi divina conspiciunt, qui ab appetitu rerum temporalium oculos claudunt. Hos oculos bene clausos diabolus aperuit cum dixit: In quacunque die comederitis, aperientur oculi vestri, et eritis sicut dii (Gen. III, 5).\
"""
