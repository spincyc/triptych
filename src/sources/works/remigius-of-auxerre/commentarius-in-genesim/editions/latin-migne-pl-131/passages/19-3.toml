Vers. 11. Percusserunt caecitate. Quoddam genus caecitatis est quod Graece aorasia dicitur, id est, avidentia, | qua quaedam videntur, quaedam non videntur. Sodomitae ergo alia videbant, sed ostium Lot videre non poterant. Moraliter Lot justos significat, Sodomitae invidos et detractores designant, qui quodammodo ostium quaerunt per quod ad Lot irrumpant, quando homines bona facta reprehendere volunt, sed non possunt invenire aditum reprehendendi, quia illo virtutis claustro munito corruptores mentium nihil habent quod reprehendant.\
