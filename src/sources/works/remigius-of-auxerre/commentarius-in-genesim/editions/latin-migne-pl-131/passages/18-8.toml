text = """
| Vers. 26. Non delebo propter quinquaginta. Quinquagenarius numerus dicatus est poenitentiae. Unde et quinquagesimus psalmus in poenitentia cantatus est. Quod ergo dicit: Non delebo propter quinquaginta, ostendit potuisse eos ab imminenti interitu liberari, si ad poenitentiam confugere voluissent. Quod autem paulatim descendendo ad decem pervenit, ostendit neminem posse salvari, nisi eum qui crucem Christi ferre eumque sequi studuerit, et decem legis praecepta impleverit. Denarius enim crucem Christi designat, quia decima littera qua denarius numerus exprimitur figuram habet crucis.\
"""
