text = """
Vers. 25. Erat uterque nudus, et non erubescebant. Quae causa erubescentiae esset in illis quos nullus motus inhonestus, nulla carnis titillatio agebat? Nisi enim homo peccasset, nunquam voluptatis ardore | instigaretur. Sed sicut nos oculum hac illae sine laesione aliqua vel petulantia volvimus, vel sicut digitum protendimus, ita membris genitalibus non ad delectationem, sed ad gignendam prolem uteremur. Bene ergo dicitur: Non erubescebant quod nudi essent, qui melius veste innocentiae et immortalitatis jucunditate vestiebantur.\
"""
