text = """
Vers. 18. Melchisedech proferens panem et vinum. Hunc Melchisedech tradunt esse Sem filium Noe, et computantes annos dicunt eum vixisse usque ad tempus Isaac. Salem vero civitas ipsa est Hierusalem, trionyma, Salem, Jebus, Hierusalem. Hanc enim tenuerunt Jebusaei, et vocaverunt eam Jebus: sic conjunctis nominibus dicta Hierusalem. Erat sacerdos Dei altissimi. Omnes enim primogeniti a Noe sacerdotes fuerunt usque ad Aaron qui primus legalis | sacerdos fuit. Mystice Melchisedech, qui interpretatur rex justitiae vel pacis, Christum significat per quem conciliati sumus, et qui in fine saeculi juste orbem judicaturus est. Hujus mysterium Apostolus commemorat dicens: Sine patre et sine matre, sine genealogia (Hebr. VI, 3). Melchisedech quidem patrem et matrem habuit, sed Christus quem significat sine patre fuit per humanitatem, sine matre per divinitatem. Natus est enim de patre sine matre, de matre sine patre. Protulit panem et vinum. Hinc jam praesignabatur mutatio legalis sacerdotii. In novo enim Testamento sacrificium victimarum translatum est in sacramentum corporis et sanguinis Christi. Ergo hoc verum Christi sacerdotium antiquius est sacerdotio legali. Melchisedech enim qui, ut Abraham, | gentilis erat, Levi vero princeps legalis sacerdotii adhuc erat in lumbis Abrahae, et qui postea accepit decimas a populo ipse in Abraham decimatus est, quique postea benedicebant in Abraham a Melchisedech benedicti sunt. Semper autem minor a majore benedicitur.\
"""
