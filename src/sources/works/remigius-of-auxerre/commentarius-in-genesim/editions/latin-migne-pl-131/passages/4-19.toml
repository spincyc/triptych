text = """
Vers. 24. Septuplum ultio dabitur de Cain; de Lamech vero septuagies septies. Crescente peccato crescit | et ultio. Fuerunt autem septuaginta septem animae de stirpe Lamech quas in diluvio legimus periisse. Allegorice Lamech figuram tenet mundi hujus, cujus tantum fuit peccatum praevaricante Adam ut non posset expiari nisi septuagesima septima generatione, Christo per Virginem veniente.\
"""
