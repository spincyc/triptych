text = """
Vers. 8, 9. Judas quoque dixit: Mitte puerum mecum, usque, reus ero peccati in patrem meum omni tempore. Consideremus verba Ruben, quae superius posita sunt. Ait enim: Duos filios meos interfice, si non reduxero eum tibi. Et tamen cum tam magnam rem, mortem videlicet filiorum, proposuerit, | non obtinuit quod volebat. Consideremus et verba Judae, quibus se pro puero obligavit: Si non reduxero, inquit, eum tibi, reus ero peccati omni tempore, et impetravit quod volebat. Ejus enim curae Benjamin commissus est. Videamus ergo ne plus sit reum esse peccati quam corporaliter aliquem occidi.\
"""
