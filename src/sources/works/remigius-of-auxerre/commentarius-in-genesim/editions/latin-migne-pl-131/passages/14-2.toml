text = """
Vers. 2. Inirent bellum contra Bara. Bara malitia vel creatura interpretatur. Est rex Sodomorum, id est pecudis silentis. Bersa interpretatur in angustia, est rex Gomorrhae quae interpretatur populus | timens. Sennaar [Vulg., Sennaab ] interpretatur excussio vel fetor dentium, et est proprium nomen hominis. Est rex Adamae, quae interpretatur terrena. Semeber ibi perditio interpretatur. Est rex Sebon quae interpretatur vinculum moeroris. Bale civitatula interpretatur vorago vel praecipitatio. Vocatur etiam vitula consternans. Ferunt enim Hebraei hanc tertio terrae motu corruisse. Ipsa est Senor id est parvula.\
"""
