text = """
Vers. 14. De populo suo. Id est de coetu sanctorum. Unde et legimus: Tu autem ibis ad populum tuum, quia pactum meum irritum fecit. Pactum scilicet illud quod Adae in paradiso datum est, in quo omnes peccaverunt (Rom. III, 12). Omnes enim causaliter | in Adam fuimus, et ideo originalis peccati rei sumus. Haec autem circumcisio quae in uno membro fiebat significat circumcisionem spiritalem quae in corde et in omnibus membris exhibenda est. Circumcidendum est cor a noxiis cogitationibus, circumcidendi sunt oculi ne videant vanitatem, circumcidendae sunt aures, id est, obturandae ne audiant sanguinem, et sic in omnibus sensibus celebranda est circumcisio.\
"""
