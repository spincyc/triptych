text = """
Vers. 5. Omne virgultum, antequam oriretur, et omnem herbam, antequam germinaret. Quod dicit: antequam germinaret aut oriretur, patet profecto | non eo modo, quo nunc arbusta et herbae ex semine vel ex radice proferuntur, aut humana industria proveniunt, tunc procreata esse, sed subito ad nutum et jussionem Dei erupisse cum foliis et fructu omnique perfectione. Non pluerat super terram. Hoc ad superiora refertur. Non pluerat quidem ut ex provectu scilicet pluviarum nascerentur frutices et herbae. Quomodo etenim plueret, cum omne spatium aeris plenum esset aquis tenuissimis in modum nebulae, sicut jam supra dictum est? sed ex quo aquae illae collectae sunt in unum, et apparuit arida, usque ad diluvium pluviae minime leguntur fuisse.\
"""
