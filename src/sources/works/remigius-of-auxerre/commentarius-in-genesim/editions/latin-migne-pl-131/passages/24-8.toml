text = """
Vers. 62. Habitabat in terra australi. Id est in Gerara. Mystice puteus videntis et viventis (Jerem. XXII, 24) sancta Scriptura est per quam Dei cognitionem accipimus. Ipse vivens et videns qui per prophetam loquitur: Vivo ego, dicit Dominus. Omnia nuda et aperta sunt oculis ejus (Hebr. IV, 13). Via quae ducit ad puteum viventis et videntis passio Christi quae nos ad intellectum Scripturarum perducit. Neque enim aliter ea quae in Veteri Testamento scripta erant intelligere possemus, nisi in passione | impleta claruissent. Et notandum quod dicit: deambulabat per viam non dicit: ambulabat, sed deambulabat. Deambulare namque est eundo et redeundo iter frequentare. Sic et passio Christi diverso modo et tempore frequentata est. Nunc enim a Judaeis blasphemiis et contumeliis insectabatur, nunc colaphizabatur, modo conspuebatur: sic et tali modo per viam suae passionis deambulabat. Quod Rebecca Isaac in terra Australi reperit significat quia sancta Ecclesia, relicto frigore infidelitatis, et calore fidei succensa ad Christum venit.\
"""
