physical_line_ranges = [[318, 318]]
text = """
Vers. 2. Vidit puteum in agro. Puteus iste scientiam Scripturarum figurat. Tres greges accubantes circa puteum significant simplices et mites, qui Scripturae sacrae mysteriis satiari desiderant. Lapis superpositus puteo tegmen litterae designat, quo spiritalis aqua tegebatur. Sed Jacob noster, id est: Christus lapidem amovit, quia superficiem litterae discussit, et spiritalem intellectum in Scripturis aperuit. Possumus etiam per puteum fontem baptismatis non inconvenienter intelligere. Tres greges accubantes designant eos qui per humilitatem et sanctae Trinitatis fidem aqua baptismatis purgari quaerunt.\
"""
