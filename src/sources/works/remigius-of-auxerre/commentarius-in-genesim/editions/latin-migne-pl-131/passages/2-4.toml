text = """
Vers. 7. Formavit Deus hominem. Cavenda est hic | paupertas intellectus humani ut cogitemus Deum manibus operatum fuisse hominem et labiis carneis locutum, aut tale aliquid, quod nefas est de Deo cogitari. Deus enim spiritus est, et ideo non distinguitur membris nec gravatur mole corporis, ut de illo aliquid carneum cogitemus vel intelligamus. Sed quod dicit: formavit hominem ex limo, id est volendo et jubendo extra produxit. Et inspiravit. Quod dicit: spiravit, non intelligendum est, quod hunc corpulentum aerem homini sufflaverit vel immiserit, sed inspiravit, id est, animavit eum vita rationali, quod in sequentibus spiraculum vitae appellavit. Ad comparationem enim caeterorum animalium quorum animae moriuntur, homo rationalem animam sortitus est. Unde et Graeci differentiam facientes animalium | quae tantum sine ratione vivunt zoa vocant, quia zoe vita dicitur: quae vero rationis participantur psychica, quia psyche anima. In faciem autem hominis spirasse (dicitur), quia in capite maxime omnes sensus vigent, horum uno, id est tactu, per omne corpus diffuso.\
"""
