text = """
Vers. 27. Factus est Esau vir gnarus venandi. Per Esau venatorem hoc loco designantur homines terrena quaerentes, et lucris saeculi quasi venationi insistentes. | Qui bene etiam agricola fuisse dicitur, quia homines saeculi quanto plus intima sua negligunt, tanto magis in cultura et studio rerum praesentium occupantur. Jacob vero simplex habitabat in tabernaculis. Quia unusquisque sanctus et minus in terrenis occupatus intra domum sanctae conscientiae habitat, nec per exteriora spargitur. Juxta litteram pro simplici alia translatio habet sine dolo, quod Graece aplastes, id est non fictus dicitur. Sed quomodo sine dolo erat qui fratrem suum dolo decepit? Sed hoc ad mysterium, non ad malitiam ejus referendum est, quia omnia in figura contingebant (I Cor. X, 11).\
"""
