text = """
Vers. 26, 27. Benedictus Dominus Deus. Dilatet Deus Japheth. De Sem fuerunt patriarchae et prophetae caeterique Patres Veteris Testamenti: de Japheth gentilium multitudo quae in Christum credit. Dilatatus est Japheth, quia in ipsum crevit credentium ex gentibus multitudo. Habitavit in tabernaculis Sem, quia gratiam quam habuerunt priores Patres, gentes in Christum credentes secutae sunt, et nunc cum Abraham, Isaac et Jacob requiescunt, fidem et | bona opera illorum imitando. Sitque Chanaan servus ejus Chanaan. Id est Judaei serviunt modo fidelibus ex utroque populo, quia libros divinarum Scripturarum non sibi, sed illis custodiunt, et quasi scrinarii sunt eorum.\
"""
