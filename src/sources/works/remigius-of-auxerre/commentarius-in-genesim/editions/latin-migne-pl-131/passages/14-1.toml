text = """
Vers. 1. Factum est autem in illo tempore ut Amraphel Sennaar, etc. Quatuor reges inierunt bellum contra quinque. Hi quatuor reges mystice significant adversarias potestates quae per carnem quae quatuor humoribus constat, in quinque sensus corporis dominari quaerunt. Amraphel interpretatur: dixit ut caderet, et est rex Sennaar qui, ut superius diximus, interpretatur excussio vel fetor dentium. Significat haereticos qui ex proposito peccant et cadunt contra Deum, perversa loquentes et obsceni | dogmatis fetorem emittentes. Arioch ebrius vel ebrietas interpretatur. Significat gentiles qui poculo erroris ebriati creaturam pro Creatore colunt. Cohdorlachamor interpretatur decorus vel manipulus. Ponitur in significatione hypocritarum qui, cum sint pleni malitia, vulgo decori putantur virtutibus. Est rex Elamitarum, id est saeculi vel orbis. Thadal interpretatur sciens jugum. Praesignat avaritiam cujus jugum sciunt avari libenter ferre. Est gentium rex, quia avaritia maxime gentibus dominatur.\
"""
