text = """
Vers. 23. Ejecit eum de paradiso. Actus ipse est, et est defectiva locutio irato vel perturbato conveniens, non quod in Deum ullus irae vel perturbationis motus cadat qui est summae tranquillitatis, sed more sacrae Scripturae hoc dictum est, quae de Deo loquens quae sunt hominum ipsi Deo attribuit. Sumat de ligno vitae et vivat. Sicut jam diximus, impleto numero electorum gustaturi erant omnes de ligno vitae, et ad illum statum beatum migraturi. Et, quia se indignum fecerat illo statu, recte custodia ei adhibita | est, ne posset ulterius lignum vitae contingere.\
"""
