physical_line_ranges = [[140, 140]]
text = """
Vers. 8. Emisit corvum et columbam post eum. Septuaginta dicunt quia corvus emissus, non est reversus ad arcam. Aut enim aquis interceptus est et necatus, aut cadaveri aquis supernatanti inhaesit, et propter gulam periit. Neque enim terra jam siccata erat, quia de columba dicitur quia cum non inveniret ubi requiesceret pes ejus. Allegorice diximus superius arcam Ecclesiam significare quae trecentorum cubitorum fuit longitudinis, quia sancta Ecclesia in fide Dominicae crucis et passionis salvatur. Longitudo enim trecentorum cubitorum passionem Domini significat. Nam et littera Tau quae hunc exprimit numerum, figuram habet crucis. Latitudo | quinquaginta cubitorum resurrectionis Christi gloriam designat quae quinquagesima die Pentecostes per apostolos praedicata est, cujus spe dilatatur Ecclesia. Altitudo vero triginta cubitorum significat eamdem Ecclesiam per tres mundi partes dilatandam, Africam, Asiam, Europam. Denarius enim ter ductus in trigesimum numerum consurgit. Haec Ecclesia continet pariter corvum et columbam, hoc est, bonos et malos. Sed corvus de arca emissus non revertitur, quia reprobi licet gremio Ecclesiae per fidem contineantur, tamen cupiditatibus et illecebris saeculi inhaererentes pereunt. Columba vero rediens ad arcam portat ramum olivae virentibus foliis in ore suo, quia sancti simplicitate gaudentes manus pacis in ore portant, et cum Psalmista dicunt: | Cum his qui oderunt pacem eram pacificus (Psal. CXIX, 7).\
"""
