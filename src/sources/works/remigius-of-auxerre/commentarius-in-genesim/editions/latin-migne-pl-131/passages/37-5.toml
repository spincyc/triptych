Vers. 24. Joseph a fratribus in cisternam missus est talari tunica spoliatus. Et Christus carnis tunica per mortem deposita descendit ad infernum. Tunica autem talaris moraliter significat opus bonum cum consummatione. Nam et in sacrificio Dei cauda hostiae jubebatur offerri (Levit. VII, 3). In cauda est | finis corporis. Et caudae hostia offertur, quando virtus inchoata ad perfectionem deducitur.\
"""
