text = """
Vers. 2. Pone manum tuam sub femore meo. Judaei dicunt, in sanctificatione Abraham, id est, in circumcisione jurasse. Sed melius est ut hoc ad incarnationem Christi referamus. Praevidens autem sanctus patriarcha Christum, qui perfectus esset homo et perfectus Deus, de sua progenie nasciturum, sub femore suo praecepit ut manum mitteret et juraret. Quia enim hominem et de sua carne nasciturum praevidit ideo dixit: Pone manum tuam sub femore meo. Quia vero Deum agnovit, ideo subjunxit: Jura mihi per | Deum coeli, id est, per divinitatem ejus qui de mea carne nasciturus est.\
"""
