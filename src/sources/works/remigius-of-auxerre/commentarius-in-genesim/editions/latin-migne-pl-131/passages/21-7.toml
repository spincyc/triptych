text = """
Vers. 17. Exaudivit Dominus vocem pueri. Matre flente pueri vocem dicitur exaudisse, quia pro illo et non pro se flebat, sicque vox matris quodammodo vox pueri erat. Typice Agar Synagogam designat, Ismael plebem Judaicam. Portatur Ismael ab Agar: et peccator populus Judaeorum gravi maledictionis pondere cervices matris suae Synagogae premit. Panis quem portabat significat panes propositionis, qui in | mensa sanctificati erant. Aqua quae eis defecit significat legalem purificationem, sive etiam carnalem Scribarum et Pharisaeorum doctrinam quae in pelle mortua, hoc est, in carnali observatione continebatur et observatores suos juxta litteram occidebat non habens spiritum vivificantem. Quod Agar puerum sub arbore projecit eos significat qui in Christum ex illo populo credentes umbra passionis et crucis protegebantur.\
"""
