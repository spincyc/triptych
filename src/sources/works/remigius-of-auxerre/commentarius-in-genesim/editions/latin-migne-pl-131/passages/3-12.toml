text = """
Vers. 17. Adae vero dixit: Quia audisti vocem uxoris tuae, maledicta terra in opere tuo. Terra maledicitur, | non ipse Adam, ut videlicet caeteri, propter quos ista scribenda erant, terrerentur ne similia facerent et simili poena plecterentur. Cain vero, quia primae praevaricationi parricidium adduxit, ipse maledicetur, cui dictum est: Maledictus eris super terram (Gen. IV, 11). Terra tua spinas et tribulos germinabit. Spinae vero antea erant, quia inter reliquas arbores et virgulta spinas Deus creavit, sed non ad hoc ut homini laborem inferrent, quae post peccatum ad laborem et afflictionem humano generi datae sunt: sicut etiam serpentes et noxia quaeque ante peccatum erant innoxia. Mystice spinas et tribulos terra germinat: quia caro nostra punctiones et aculeos vitiorum gignere non desistit. Et hoc attendendum quod Adae extrinsecus poena imponitur, | cum dicitur: Maledicta terra in opere tuo; mulieri intrinsecus, cum dicitur: Multiplicabo aerumnas tuas, etc., quia mulier seducta decepit virum, ideo gravior ei poena irrogatur.\
"""
