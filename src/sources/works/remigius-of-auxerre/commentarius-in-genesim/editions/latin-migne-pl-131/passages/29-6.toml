text = """
Vers. 29. Cui pater Balam servam tradiderat. Liae data fuerat ancilla superius nomine Zelpha, Racheli vero data Bala nomine. Zelpha interpretatur os loquens; Bala, inveterata. Significant hae duae ancillae eos qui vel in activa vita vel in contemplativa non recta intentione bona operantur, nec recto studio | praedicant, id est non pro Deo, sed pro favore aut commodis saeculi; de qualibus Apostolus dicit: Sunt, qui praedicant Christum non sincere (Philip. I, 1). Et post pauca: Utrum ex occasione, an pro veritate Christus annuntietur, in hoc gaudeo, sed et gaudebo (Ibid., 18). Unde recte Zelpha os loquens interpretatur, quia tales in ore habent praedicationes, non in corde, de quibus dicitur: Populus hic labiis me honorat, cor autem eorum longe est a me (Matth. XV, 8). Bala autem inveterata dicitur, quia tales, licet bonorum operum fructus quasi bonos filios afferant, tamen quia non recto studio hoc agunt, adhuc in veteris erroris conversatione perdurant.\
"""
