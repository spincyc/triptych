text = """
Vers. 28. Det tibi Deus de rore coeli. Ros leniter | cadit et prope sine sensu, ideoque subtilem designat contemplationem. Pinguedo vero terrae bona significat opera. Benedicitur ergo Jacob, hoc est gentilis populus, ut coelesti contemplatione et bonis operibus possit abundare. Abundantiam frumenti, vini et olei. In frumento et vino charitas et fervor novae conversationis; in oleo vero misericordiae opera designantur. Possunt etiam in frumento et vino mysteria corporis et sanguinis Christi accipi; in oleo misericordia Dei, qua genus humanum salvatum est juxta quod per prophetam dictum est: Computrescet jugum a facie olei (Isa. X, 27), id est, jugum peccati ex praesentia misericordiae Dei.\
"""
