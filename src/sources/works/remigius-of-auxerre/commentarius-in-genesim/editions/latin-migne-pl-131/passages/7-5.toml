text = """
Vers. 20. Quindecim cubitis altior fuit aqua super montes. Dicunt enim quidam hoc historialiter fieri non potuisse sed propter aliquam significationem vel mysterium hoc scriptum esse. Aiunt enim non potuisse fieri, ut aqua crassioris naturae ad superiorem aeris partem conscenderet maxime propter | Olympum montem, cujus tanta altitudo ut nulli venti ibi flare, nullae nubes cacumen ejus valeant operire. Sed qui hoc fatentur non attendunt quia mons ipse terra est. Terram autem scimus corpulentiorem esse aqua. Ubi ergo terra gravior ascendere potuit, cur non hoc levior aqua potuerit?\
"""
