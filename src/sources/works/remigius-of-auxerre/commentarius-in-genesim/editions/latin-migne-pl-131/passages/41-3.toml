text = """
Vers. 42. Tulit annulum de manu sua. Annulus in manu Joseph pontificatum fidei designat, qui in manu, | hoc est in potestate Christi constitutus est. Factus est enim sacerdos secundum ordinem Melchisedech. Stola byssina significat sanctam carnem ejus, quae de terra virgineae carnis exorta est, et sicut byssus diversis passionibus macerata pervenit ad candorem immortalitatis et gloriae sempiternae. Et torquem auream collo circumposuit. Torques aurea, qua collum Joseph ornabatur, sapientiam designat coelestem, quae sicut circulus nec initium habet nec finem. Potest etiam per torquem auream bona voluntas et bonorum simplicitas accipi.\
"""
