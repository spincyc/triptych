text = """
Vers. 27. Venditus est Joseph Ismaelis negotiatoribus consilio Judae patriarchae. Venditus est Christus consilio Judae Scarioth, et post a gentibus pretio fidei. In LXX habetur, aureis. Sed melius in Hebraica veritate habetur XX argenteis. Neque enim servus pretiosioris metalli pretio vendi debuit quo Dominus. Sed hoc juxta litteram. Quaerendum est quid sit quod superius dicit: Viderunt viatores Ismaelitas venire; et hic dicit, vendiderunt eum Madianitis. | Ismael fuit de Agar, Madian de Cetura. Ergo vera est opinio Hebraeorum, qui dicunt Agar et Ceturam unam fuisse feminam. Potest et hoc dici, quia superius legimus quod Abraham filiis concubinarum dederit munera, et separaverit eos a filio Isaac ad orientem: tunc hi duo, Ismael videlicet et Madian, simul habitare coeperunt et unam gentem fecerunt.\
"""
