text = """
Vers. 2. Terror vester et tremor. Non homini praeposuit Deus hominem sed animantibus. Neque enim dixit: Terror vester sit super homines, sed super animantia terrae: atque ideo, ut B. Gregorius dicit, supra modum superbire est ab aequali velle timeri. Omnes homines natura genuit aequales, sed meritorum distantia justo Dei judicio, sed occulto, alios aliis subjecit. Omnes pisces manui vestrae traditi sunt. Id est, potestati: Et omne quod movetur erit vobis in cibum. Post diluvium esus permissus est carnium. Antea enim pomis et oleribus vescebantur. Sed quia in diluvio terra virtutem suae fertilitatis amiserat, | ideo Deus consulens humanae fragilitati permisit homini vesci carnibus.\
"""
