text = """
Vers. 23. Occidi virum in vulnus meum et adolescentem | in livorem meum. Hunc locum ita Hebraei exponunt. Lamech diu vivendo caliginem oculorum incurrerat, nec videre poterat. Habebat autem quemdam adolescentem qui gressus ejus regebat. Cum ergo quadam die venatione exerceretur, illuc jacula dirigens quo adolescens indicasset, casu Cain inter fruteta latitantem, indice adolescente, percussit, qui feram esse putaverat. Sed cum cognovisset se hominem occidisse, iratus adolescenti ipsum quoque interfecit. Et hoc est, quod sequitur: Occidi virum, id est Cain, in vulnus meum, quia ego quoque pro illo vulnerabor et occidar: et adolescentem livorem meum, quia pro illo quoque damnabor.\
"""
