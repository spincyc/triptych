text = """
Vers. 6. Vidit igitur mulier quod bonum esset lignum ad vescendum. Hic aperte ostenditur mulier inexcusabilis esse. Licuit enim ei sub tali deliberatione | dolos advertere inimici. Consideravit enim pulchritudinem ligni et quia suave esset ad manducandum. Dedit viro suo. Non quidem dicitur, quod suaserit ei ut manducaret, sed in hoc quod dicitur: dedit, intelligitur quia suasit ad comedendum, quanquam non esset opus ut suaderet, quia, cum vidit eam comedisse et minime mori, ipse quoque securus comedit.\
"""
