physical_line_ranges = [[384, 385]]
text = """
Vers. 3-10. Vocavit nomen ejus Her. Rursus concepto | fetu appellavit nomen ejus Onan. et caetera usque, occidit eum Dominus, quia rem detestabilem faceret. Judas hoc loco typus est regiae stirpis, quae de Juda descendit. Duo filii Judae duo genera significant malorum hominum, nocentium videlicet, qui significantur per Her, de quo dicitur: Fuit Her nequam coram Domino, et ab eo occisus est. Unde et Her pellis vel pelliceus interpretatur. Pellis enim peccata significat: et primi parentes nostri post peccatum tunicas pelliceas leguntur habuisse. Aliud genus est malorum hominum praestare nolentium, id est benefacere, quos significat Onan. Interpretatur enim moeror eorum, subauditur, quibus beneficium praestare non vult; de quo dicitur, quia semen fundebat in terram nolens nasci filios fratri suo | mortuo. Et hos ergo qui male faciunt, et illos qui praestare nolunt, ultio divina condemnat.

Tertium quoque peperit. Tertius, qui sine uxore erat, et Sela vocatur, illud significat tempus, quando Judaei sine rege, sine sacerdote, sine sacrificio erant. Unde et Sela divisio ejus interpretatur.\
"""
