physical_line_ranges = [[213, 213]]
text = """
Vers. 5. Non vocaberis Abram, sed Abraham. Abram interpretatur pater excelsus. Abraham vero | pater multarum gentium. Tradunt Hebraei quod de nomine Dei quod quatuor litteris scribitur, unde et tetragrammaton vocatur et ineffabile dicitur, he litteram scripserit Deus et addiderit nomini Abraham. Similiter de nomine Sarai jot litteram tulerit et eamdem he addiderit. Nec mirum, si nos pro he a habemus, quia Hebraei pro he scribunt, sed per a pronuntiant. Vocatur autem Abraham pater multarum, subauditur, gentium: quia omnes gentes in ejus semine, id est, in Christo crediturae erant. Sarai vero interpretatur princeps mea. Sara absolute princeps, ut subaudias omnium animarum in Christum credentium.\
"""
