text = """
Vers. 8. Dixitque Cain ad Abel fratrem suum: | Sed hoc, quod a Deo audierat: superfluum enim est. Egrediamur foras. Neque enim adhuc domus vel templum erat ubi Deo sacrificium offerretur. Et consurrexit Cain adversus fratrem suum, et interfecit eum. Retro, ut ferunt, pastorali virga. Allegorice in scelere Cain malitia Judaeorum designatur. Cain occidit minorem fratrem suum Abel, et Judaei Christum caput minoris populi, id est gentilis, sicut ipse per Psalmistam dixerat Patri: Constitues me in caput gentium (Psal. XVII, 44).\
"""
