text = """
| Vers. 10. Et fluvius egrediebatur, qui dividitur in quatuor capita. Nomen uni Phison. Qui interpretatur oris mutatio, qui exiens de paradiso et in nostrum orbem discurrens pulchritudinem et amoenitatem suae mutat speciei. Ipse est enim Ganges. Qui circuit omnem terram Evilath. Id est, Indiae trahens aureas arenas. Evilath pars est Indiae, dicta ab Evilah filio Jectan filii Heber, a quo Hebraei dicti sunt. Habent autem haec flumina certos ortus. Phison autem in Caucaso monte oritur: Geon juxta Atlantem Mauritaniae: Tygris et Ephrates in Armenia.\
"""
