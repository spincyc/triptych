text = """
Vers. 21. Nephtalim cervus emissus. Cervus emissus vocatur propter fructus temporaneos, qui apud illos citius maturescunt; ideo cervus emissus, id est velox vel fugax, vocatur. Alia translatio dicit, Nephtalim ager irriguus. Significat autem aquas calidas quae in illa tribu sunt. Vel etiam propter lacum Genesar hoc dicit, qui apud illos est. Hebraei tradunt Tiberiadem civitatem in hac tribu esse, in qua sunt doctores legis. Et hoc est quod dicit, dans eloquia pulchritudinis. Mystice Nephtalim apostolos designat, | qui de tribu Nephtalim et Zabulon a Domino electi sunt, juxta quod praedictum fuerat per Isaiam: Primo tempore alleviata est terra Zabulon et terra Nephtalim (Isa. IX, 1); quia primo Dominus in his locis praedicavit, et tunc alleviata est terra eorum, sublato gravissimo jugo diaboli. Ergo Nephtalim cervus emissus vocatur, quia apostoli velocissime per universum mundum discurrerunt, et ipsi sunt filii excussorum missi de manu Domini, velut sagittae de manu potentis (Psal. CXXVI, 4). Ipsi dant eloquia pulchritudinis, id est verba praedicationis divinae.\
"""
