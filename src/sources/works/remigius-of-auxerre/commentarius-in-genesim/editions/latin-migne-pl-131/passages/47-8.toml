text = """
Vers. 31. Adoravit Israel Deum, conversus ad lectuli caput. Augustinus: Quod habent quidam Latini codices: Et adoravit super caput virgae ejus, vel in capite, fallit eos Graecum verbum, quod eisdem litteris scriptum est, sive suae, sive ejus, sed accentu dispares sunt, et ab eis qui ista noverunt, in codicibus | non contemnuntur: valent enim ad magnam discretionem. Ac per hoc quaeritur quid sit quod dictum est. Nam facile intelligeretur senem adorare fastigium virgae suae, quam sic ferebat, ut super eam caput inclinando adoraret Deum. Sed quod dicit ejus, aliter sese refert; quia post juramentum filii sui, ipsi filio virga sumpta iterum innisus eidem adoravit cacumen ejus vel illius. Sanctus vir et Deo deditus senectute gravatus ita lectum in quo jacebat compositum habebat, ut capite ad orientem verso mox si vellet, absque difficultate ad orandum se vertere posset.\
"""
