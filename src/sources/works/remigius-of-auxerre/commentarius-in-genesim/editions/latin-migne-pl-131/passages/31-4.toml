text = """
Vers. 35. Quod coram te assurgere nequeo. Natura docet ut filii parentibus assurgant et eos honorent. Cum ergo Rachel sederet, et patri non assurgeret, excusans se dicit: Ne irascatur dominus meus. Causas etiam quare assurgere nequiret, composite significat dicens menstrua sibi provenisse. Hoc est enim quod dicit: Juxta consuetudinem feminarum accidit mihi. Allegorice Laban diabolum vel mundum significat, qui dealbatus et pulcher est suis amatoribus. Idola Laban significant avaritiam. Dicit enim Apostolus: et avaritia, quae est idolorum servitus (Ephes. V, 5). Haec requisivit Laban ab Jacob, quando diabolus regna mundi et gloriam et honorem eorum Christo ostendit (quem Jacob significat), putans | in eo aliquod avaritiae vestigium posse reperire. Sed Jacob ignorabat idola, quia Christus nullam habuit mundi cupiditatem. Rachel furata est idola, eaque subter stramenta abscondens desuper sedit, quia Ecclesia veniens ad Christum, cupiditates saeculi, quibus antea servierat, quam essent despiciendae cognovit, easque per poenitentiam sedendo, id est se humiliando, abscondit. Sessio namque humilitatem significat. Unde Psalmista: Surgite postquam sederitis (Psal. XXVI, 2).\
"""
