text = """
Vers. 31. Noe vero, cum quingentorum annorum esset, genuit Sem, Cham et Japhet. Hoc loco intueri debemus profundum mysterium. Est enim Noe ab Adam post Seth decimo loco. Denarius enim numerus perfectionem significat electorum, quia primae est tesserae, id est IV, numerus, nec ultra potest numerando procedi nisi iterum redeatur ad unitatem. Noe ergo si addamus duos filios ejus Sem Cham, et Japheth, Cham reprobato fiunt duodecim. Duodenarius autem numerus sacratus est in duodecim patriarchis | et praecipue in duodecim apostolis. Constat vero ex partibus septenarii quae sunt tria et quatuor. Haec est justorum perfectio quae servata est in linea a Seth descendente. Consideremus imperfectionem eorum qui per Cain ab Adam descenderunt. Ab Adam igitur ad Lamech sex sunt generationes, quibus si addamus tres filios ejus et quartam filiam ejus fiunt undecim. Undenarius autem numerus peccatum significat, quia transgressio est denarii. Ecce hic sublucet imperfectio et malitia generationis Cain. Et facti sunt dies Lamech septingenti septuaginta septem anni. Hoc secundum Hebraicam veritatem. Caeterum secundum LXX maximus est error in numero, in quo invenitur Lamech post diluvium vixisse quatuordecim annos.

|\
"""
