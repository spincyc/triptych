text = """
Vers. 18. Erant igitur tres filii Noe Sem, Cham et Japheth. Sem interpretatur nomen vel nominatus, Cham callidus, Japheth latitudo. Mystice Sem et Japheth significant fideles ex utroque populo in Christum credentes. Cham vero haereticos designat, unde et bene callidus interpretatur. Haeretici enim | callidi sunt, non sapientia, sed malitia: quia simplices in Ecclesia decipere quaerunt. Mystice Noe qui requies interpretatur Christum significat qui inebriatus est calice passionis. Nudatus est, quia tunc manifestata est infirmitas mortalitatis ejus, et, ut propheta praedixerat, ibi abscondita est fortitudo ejus (Habac. III, 4).\
"""
