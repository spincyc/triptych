Vers. 24. Evigilans autem Noe ex vino, cum didicisset. Prophetico videlicet spiritu. Quae fecerat ei filius suus minor, ait: Maledictus Chanaan. Notandum | quod, non ipsum Cham, sed Chanaan filium ejus maledicit, qui motus eorum interpretatur, a quo postea dicti sunt Chananaei, quos Dominus ante faciem filiorum Israel ejecit. Quod ergo Chanaan maledicitur, prophetia erat: quia gens illa de loco suae habitationis pellenda erat.\
