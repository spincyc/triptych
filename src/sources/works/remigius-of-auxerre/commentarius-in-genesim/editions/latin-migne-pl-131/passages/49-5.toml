text = """
Vers. 8. Juda, te laudabunt fratres tui, et reliqua usque, adorabunt te filii patris tui. Sub nomine Judae haec benedictio de David accipitur, qui de eadem tribu fuit rex potentissimus. Quem laudabunt fratres sui, reliquae videlicet tribus. Manus ejus in cervicibus inimicorum ejus erat, hoc est, virtus et fortitudo ad humiliandam potentiam reliquarum gentium. Pene enim omnem Syriam et Palaestinam et circumpositas nationes reliquas humiliavit et tributarias fecit. Unde et adorabunt eum filii patris ejus, vel fratres videlicet, vel omnis Judaeorum populus, videntes Dominum esse cum illo. Mystice Judas Christum significat, qui est verus confessor, | sicut in Evangelio ad Patrem dicit: Confiteor tibi, Pater, Domine coeli et terrae (Matth. XI, 25). Hunc laudant fratres sui, omnis videlicet justorum multitudo, non communi laude, sed speciali et divina, sicut Deum et Dominum suum. Ejus manus est in cervicibus inimicorum suorum. Ut eos humiliet et suae fidei colla eorum subdat. Hunc adorabunt filii patris ejus. Id est sancti, quos ipse dedit esse filios Dei et fratres ejus.\
"""
