text = """
Vers. 15. Nequaquam ita fiet. Id est, non cito | morieris, sicut vis. Septuplum punietur. Id est plenarie et perfecte. Solet enim septenarius numerus pro perfectione poni. Unde saepe Dominus minatur: percutiam, inquiens, vos septies (Levit. XXVI, 24), id est perfecte. Secundum igitur LXX legitur: Quicunque occiderit Cain, septem vindictas exsolvet. Et est sensus: Non ita fiet ut vis, ut videlicet cita morte longae vitae cruciatum effugias, sed diu vivendo usque ad septimam generationem tandem quicunque te occiderit exsolvet, id est, finiet septem vindictas quae in te sunt: non quo ille qui eum occidisset septuplum esset puniendus, sed quia illum occidendo finiret illas septem vindictas, id est perfectas, quibus Cain diu vivendo cruciabatur. Hoc secundum LXX. Caeterum secundum Hebraicam veritatem | septuplum punietur, id est plenarie et perfecte: in quo deterret ne quis homicidium audeat iterare. Posuit Dominus signum in Cain, ut non eum interficeret omnis qui invenisset eum. Hoc videlicet, quia vagus et profugus erat super terram, vel, ut LXX, gemens et contremens. Allegorice posuit Deus signum in Judaeos, ut nemo eos occideret, ipsam videlicet legem quam portabant ad suam damnationem et nostram ereptionem. Propter hoc signum nemo eos occidit. Neque enim pagana persecutione, vel etiam sub Christiana jam tranquillitate eos prohibuit suis legibus uti et suo more vivere. Et hoc est quod per Psalmistam Filius loquitur ad Patrem: Ne occidas | eos, ne quando obliviscantur populi mei: disperge illos in virtute tua (Ps. LVIII. 12).\
"""
