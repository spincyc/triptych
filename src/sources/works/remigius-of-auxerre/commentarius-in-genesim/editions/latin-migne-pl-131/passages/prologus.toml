text = """
Commentarius in Genesim

Commentarius in Genesim (Remigius Antissiodorensis), J. P. Migne

IN DEI NOMINE INCIPIT EXPOSITIO REMIGII SUPER BRESITH, ID EST, SUPER GENESIM. |

Desiderius vocabatur episcopus quidam familiaris et amicus beati Hieronymi, ad quem scribit hanc praefationem

Praefatio Latine, prologus vel prooemium Graece dicitur, id est breviatio. Ymen Graece, Latine dicitur via

Praesagio, id est, praedivinatione vel signo futurorum.

Sortitus est nomen cum Daniele, qui et ipse vir desideriorum appellatus est; et sicut ille desiderabat | praescire futura, sic iste desiderabat notitiam habere Scripturarum.

Pentateuchum. Penta, quinque, teuchum [librum], id est, quinque libros Moysi.

Obtrectatorum, id est, invidorum.

| Suggillatione, id est reprehensione. Tunc enim omnes LXX legebant, et magna veneratione suscipiebant.

Nova pro veteribus cudere, id est, Hebraicam veritatem pro veteribus, id est LXX Interpretibus.

Ita ingenium quasi vinum probantes. Sicut enim vinum probatur nare vel gustu, sic illi probabant ingenium, cum dicebant Hieronymum in reprehensione LXX hoc facere.

Portione, id est pro vili.

| Pro paupertate mea. In alia enim praefatione dicit quod in tabernaculo Dei alii offerrent aurum, lapides onychinos, byssum, coccum et purpuram; sibi vero sufficere, si saltem pilos caprarum offerret. Hanc dicit vilem portionem humiliando se, cum tamen | ipse magna offerret in tabernaculo Dei, hoc est in Ecclesia.

Editioni antiquae, id est, translationi LXX.

Theodotio Judaeus fuit, qui transtulit divinas Scripturas, sed in multis erravit judaizans. Illius translationem Origenes immiscuit translationi LXX.

Proprium syntagma, id est compositionem.

Si, inquit, omnia colligerem quae in Evangeliis vel Epistolis inveniuntur, et quae sunt in LXX, proprium librum possem conficere. Multi ignorantes haec in Hebraica scripta non esse veritate, sectantur deliramenta apocryphorum. Apocryphon dicunt Graeci secretum. Inde apocryphi dicuntur libri qui nullam habent auctoritatem et non sunt in publico legendi. Inde apocrypharius, legatus secretorum. Deliramenta, | id est, vanitates, vel insanias et ineptias. Lira quippe sulcus dicitur aratri. Hinc delirare dicuntur boves cum exorbitant. Inde dicimus deliros homines insanos, exorbitantes a ratione et sensu.

Hiberas naenias, id est Hispanicas vanitates. Proprie naeniae sunt, quae super tumulos mortuorum scribuntur, quibus nihil vanius.

Libris authenticis, id est auctoritate plenis.

Ptolomaeus rex Aegypti. Hic unius Dei cultor exstiterat, edoctus ab Aristaeo philosopho Platonico. Dicunt ergo Judaei ideo LXX tacuisse mysterium sanctae Trinitatis, ne Ptolomaeus, qui unius Dei cultor erat, deprehenderet divinitatem Patris et Filii; et ideo non errando, sed prudenti consilio hoc fecerunt.

| Nescio quis primus auctor construxerit mendacio suo septuaginta cellulas Alexandriae. Alexandria metropolis est Aegypti. Refert autem Josephus quod Ptolomaeus rex miserit nuntios cum magnis muneribus ad sacerdotem Judaeorum, et rogaverit eum ut libros divinarum Scripturarum faceret transferri de Hebraeo in Graecum, quia ipse Graecus erat, et Hebraeam linguam ignorabat. Tunc ille misit ei LXX | viros peritissimos. Qui venientes Alexandriam in una basilica congregati, transtulerunt Scripturas de Hebraeo in Graecum, conferentes ad invicem. Sed illi qui LXX nimium venerabantur, confixerunt per singulas cellas divisos fuisse, et Spiritu sancto dictante eadem scriptitasse.

Y Πepictec, id est protector fidelis, qui protegebat Ptolomaeum sapientiae suae scuto.

Nisi forte putandus est Tullius oeconomicum, id est dispensatorium, quia oeconomos dicitur dispensator: quem librum transtulit Tullius de Graeco in Latinum, non tamen prophetavit, quia interpres, non vates fuit.

Platonis Pythagoram [Protagoram ]. Plato scripsit librum quem Pythagoram appellavit, quia ad Pythagoram | philosophum et amicum suum scripsit. Hunc transtulit similiter Tullius.

Et Demosthenis pro Ctesiphonte. Demosthenes Graecus rhetor fuit, qui scripsit librum pro Ctesiphonte, eo quod ante Ctesiphontem eum scripserit.

Historia. Historia dicitur apo tu historia, id est a videndo. Distat inter historias et annales, quia historiae sunt earum rerum quas videmus vel videre possumus, annales vero earum quas non videmus.

Inter spiritalia charismata, id est dona vel gratiam Spiritus sancti.

In Apostolo, videlicet Paulo, ubi commemorat dona Spiritus, dicens: Quosdam quidem dicit apostolos, alios prophetas, etc. In quibus charismatibus ultimum pene gradum interpretes tenuerunt; et hoc | in ejusdem Pauli apostoli Epistola reperitur, ubi dicit: Alii datur per Spiritum sermo sapientiae, etc. usque dum concludit dicens: Alii genera linguarum, alii interpretatio sermonum.

Et emendatiora sunt exemplaria Latina quam Graeca, Graeca quam Hebraea. Unaquaeque enim res, quo frequentius transfertur, eo firmius emendabitur.

INCIPIT TEXTUS BRESITH.\
"""
