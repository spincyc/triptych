text = """
Vers. 2. Filii Japheth. Commemorat modo gentes septuaginta duas quae a tribus filiis Noe disseminatae sunt post diluvium. Et primum dicit de Japheth minore, de quo nati septem filii qui tenuerunt septentrionalem regionem a Tauro et Amcino montibus Ciliciae et Assyriae. Gomer, ut Josephus dicit, ipsi sunt Galatae qui Latine Gallograeci dicuntur. Magog quos quidam putant Massagetas. Madai Medi, Javan Jones, qui et Graeci, a quibus Jonium mare et quinta | eorum lingua Jonica dicitur. Tubal Iberes quos Hispanos dicimus, Meosoch Cappadoces quorum hodieque metropolis civitas Mazaca dicitur. Thiras Thraces.\
"""
