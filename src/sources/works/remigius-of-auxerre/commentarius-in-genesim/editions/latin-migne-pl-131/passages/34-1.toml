text = """
Vers. 1. Egressa est Dina. Allegorice Dina significat | animam sua studia negligentem, et aliorum facta studiosius inquirentem. Quasi enim egreditur ad videndas mulieres, cum sua intima projicit et in exterioribus occupatur. Mox ergo ut ita egreditur a Sichem, id est a diabolo, opprimitur et incestatur. Unde bene Dina judicium istud interpretatur. Istud enim est judicium, ut, quia sponte se negligens evagatur, mox a diabolo corrumpatur.\
