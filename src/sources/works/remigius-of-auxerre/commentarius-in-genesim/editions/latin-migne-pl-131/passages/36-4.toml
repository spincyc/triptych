text = """
Vers. 24. Iste est Ana, qui invenit aquas calidas. Hic locus varie ab Hebraeis exponitur. Dicunt enim quidam quod lacum in deserto repererit, quoniam facile in illis locis invenitur. Unde et alia translatio dicit: Invenit jamim in solitudine. Jamim Hebraice maria dicuntur, id est aquarum collectio. Alii dicunt | quod onagros, id est agrestes asinos, ad asinas admitti fecerit, ut inde asini velocissimi nascerentur. Nonnulli dicunt, quod ad gregem equarum asinos ascendere fecerit, ut ex hujuscemodi concubitu muli nascerentur. Quidam simpliciter aquas calidas dicunt eum in deserto reperisse, quas thermas vocamus.\
"""
