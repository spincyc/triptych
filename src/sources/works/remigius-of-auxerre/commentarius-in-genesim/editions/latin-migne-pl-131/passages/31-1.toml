text = """
Vers. 7. Decem vicibus mutavit mercedem. Subauditur, meam. Cum enim videret Laban varios fetus augeri, mutata conditione dicebat: Volo ut varii fetus meae partis sint, pecus vero unius coloris tuae sit partis. Rursus cum videret et nigra multiplicari, mutata rursus conditione haec sibi assumebat. Tali modo decem vicibus dicit eum Jacob suam mutasse | mercedem. Typice Laban, qui interpretatur dealbatio, diabolum significat, qui licet sit suo merito tenebrosus, tamen transfigurat se in angelum lucis.\
"""
