text = """
Vers. 22. Benjamin dedit trecentos argenteos. Hoc est, fidem sanctae Trinitatis et crucis Christi praedicanda mysteria. Nam tau littera, quae figuram crucis habet, CCC designat numeros. Et Paulus apostolus se dicit: Nihil me judicavi scire inter vos nisi Christum Jesum et hunc crucifixum (I Cor. II, 2). | Dilecto quoque discipulo mandat: Noli erubescere crucem Christi neque me vinctum ejus (II Tim. II, 8). Accepit et quinque stolas optimas, hoc est sapientiam et moderationem quinque sensuum, quae omnia ampliora in Paulo quam in caeteris fuere. Caeteri fratres binas stolas acceperunt, ut videlicet Christum Deum et hominem praedicarent, Deique et proximi dilectionem tenendam praedicarent.\
"""
