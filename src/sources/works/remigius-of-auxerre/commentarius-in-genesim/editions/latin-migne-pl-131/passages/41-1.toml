text = """
Vers. 1. Post duos annos Pharao vidit somnium, etc. Septem anni ubertatis, quae per septem boves pingues, et per totidem spicas plenas atque formosas designantur, mystice significant plenitudinem septiformis gratiae Spiritus sancti, quae primis temporibus in apostolis et caeteris credentibus manifestabantur. Sterilitas autem septem annorum sequentium, | quae per septem boves macilentos et per totidem spicas tenues et uredine percussas ostensa est, tempus illud significat, quo in fine saeculi refrigescente charitate et abundante iniquitate erit fames verbi Dei, quam Dominus per prophetam praedixit: Mittam, inquiens, famem in terram, non famem panis, neque sitim aquae, sed audiendi verbi Dei (Amos VIII, 11).\
"""
