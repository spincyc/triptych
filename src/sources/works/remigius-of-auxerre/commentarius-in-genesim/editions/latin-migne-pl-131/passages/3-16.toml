physical_line_ranges = [[93, 93]]
text = """
Vers. 24. Collocavit autem ante paradisum voluptatis cherubim et flammeum gladium. Id est, per ministerium angelicum igneam custodiam constituit. Flammeus gladius tribulationes et labores significat hujus saeculi, quibus sancti in praesenti vita exercentur; sive per flammeum gladium significatur sententia justae damnationis quae homini data est. Qui tamen ita damnatus est, ut posset passione Christi redimi. Unde et recte gladius ipse versatilis dicitur qui posset aliquando removeri. Remotus est enim Henoch, et Eliae, et Domino baptizato omnibusque quotidie fidelibus, cum de hac vita ad illam supernam transeunt beatitudinem. Et non dicit: flammam et gladium, sed flammeum gladium: quia quicunque | ad paradisum redire cupiunt, necesse est ut igne Spiritus sancti omnes concupiscentias hujus vitae exurant, et gladio verbi Dei praecidant quidquid in se noxium et inutile conspexerint. Alia translatio habet: contra paradisum, quoniam vehemens contrarietas Adae contigit. Non enim parvo contraria sunt beatitudo et miseria. Siquidem qui prius beatus, factus est miser, et qui antea immortalis conditus, mortalis effectus est. Cherubim plenitudo scientiae interpretatur. Cherubim ergo et flammeus gladius ante paradisum collocatur, ut detur intelligi quia per scientiam disciplinae coelestis et per tribulationes et labores vitae praesentis ad paradisum possumus redire.\
"""
