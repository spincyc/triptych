text = """
Vers. 7. Foedere sempiterno. Quaerunt multi quomodo | dictum sit sempiternum foedus, cum nequaquam in aeternum duraverit. Sed hic sempiternum pro saeculari ponitur quod Graece eonion dicitur. Eon enim Graece tam sempiternum quam saeculare vel temporale potest accipi. Vel magis propter spiritalem significationem dicitur foedus sempiternum, quia foedus Christi et in aevum fidelium credentium qui sunt spiritales filii Abraham nullo fine terminabitur.\
"""
