physical_line_ranges = [[413, 414]]
text = """
| Vers. 2. Pone scyphum meum in ore sacci junioris. Allegorice per Benjamin, ut saepe diximus, Paulus apostolus designatur, qui junior vel minimus dicitur, quia necdum virum agebat in Christo, et in Actibus apostolorum (cap. VII) adolescens dicitur. Ipse quoque de se dicit: Ego sum minimus apostolorum, qui non sum dignus vocari apostolus quoniam persecutus sum Ecclesiam Dei (I Cor. XV, 9). Scyphus argenteus, splendor divinorum eloquiorum, quae specialiter Paulo commissa sunt. Majus enim scientiae donum caeteris habuit, juxta quod beatus Petrus testimonium perhibet dicens: Sicut frater noster Paulus secundum datam sibi scientiam scripsit nobis. Habebat scyphum argenteum, id est divinam scientiam: sed | latebat intra saccum, hoc est intra legalis litterae utilitatem. Sed venit dispensator, disrupit saccum; venit Ananias missus a Christo, dissolvit legalis litterae grossitudinem, id est caecitatem. Mox scyphus resplenduit quia Paulus continuo fiducialiter in synagogis agere coepit praedicans Christum, et occidentem legis litteram ad spiritalem transferens intellectum.

Vers 13. Reversus in oppidum. Juxta litteram non crudelitate fratres vexabat, sed peccatum venditionis quod in eo commiserant, purgabat: simul etiam ut experiretur si tales essent erga fratrem suum quales erga se exstiterant.\
"""
