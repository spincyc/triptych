physical_line_ranges = [[263, 263]]
text = """
Vers. 13. Haerentem cornibus inter vepres. Alia translatio ipsum verbum ponit Hebraicum, dicens: Haerentem in virgulto Sabee. Sabee condensum vel spissum interpretatur, per quod significat densitatem virgultorum et veprium in quibus cornibus haerebat aries. Juxta litteram magnum nobis exemplum datur magnae obedientiae sancti Abraham, qui cum unicum filium haberet audissetque a Domino: In Isaac | vocabitur tibi semen, tamen non dubitavit eum offerre Deo, credens, quod et Apostolus dicit: Quod a mortuis eum posset resuscitare (Hebr. XI, 19). Allegorice Abraham Dei Patris hoc loco gerit personam, Isaac Domini Jesu Christi. Immolatio Isaac passionem Christi designat. Bene autem dicitur: Ipse portabat ligna holocausti: quia Christus crucem suam bajulavit, juxta quod in ejus passione dicitur: Et bajulans sibi crucem exiit in locum qui vocatur Golgotha (Joan. XIX, 17). Duo viri qui comitabantur cum Abraham, populus Judaeorum. Duo autem ideo, quia ille populus post mortem Salomonis divisus est in duo regna, in decem videlicet tribus quibus Jeroboam imperavit, quae vocantur Israel, et in duas alias tribus, Juda videlicet et Benjamin, super quas | regnavit Roboam filius Salomonis, quae dicuntur Juda, cum quibus erat et tribus sacerdotalis, id est Levi. Asinus quem secum ducebant stultitiam Judaeorum designat. Asinus enim quod portabat nesciebat: et Judaei in libris propheticis Christum legebant, sed venientem non intelligebant. Unde et bene eis dicitur: Exspectate hic cum asino. Usque hodie enim et usque ad finem saeculi quasi exspectant Christum cum stultitia sua ut Apostolus dicit: Caecitas ex parte contigit in Israel, donec plenitudo gentium introeat, et sic omnis Israel salvus fiat (Rom. XI, 25). Quod dicit: Postquam adoraverimus, revertemur ad vos, significat quod impleta passione in ultima saeculi aetate revertatur Deus, et reconcilietur Judaeis credentibus. Quod autem tertio die elevatis | oculis, tres dies tria significant saeculi tempora ante legem, sub lege et sub gratia. Nam et Dei Filius die tertio ad nuptias dicitur venisse et aquam in vinum convertisse, quia tertio saeculi tempore venit ad conjungendam sibi Ecclesiam et legis litteram in spiritalem intellectum convertendam. Aries qui apparuit Abrahae humanitatem Christi designat de quo bene dicitur quod haereat cornibus inter vepres, quia Christus cruci affixus est, manus ejus in cornibus, id est, in brachiis crucis haerebant. Sive haerebat inter vepres, quia spinis coronatus est. Quod autem aries immolatus est, Isaac autem evasit, significat quia per humanitatem pati potuit, per divinitatem vero impassibilis mansit. Nam duae sunt in Christo substantiae vel naturae. Juxta litteram quia aries cornibus | haerebat inter vepres, inde Judaei in solemnitatibus tubis corneis solent canere, ut per hoc memor sit Deus eorum et repropitietur illis propter magnam Abrahae obedientiam.\
"""
