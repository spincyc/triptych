text = """
| Vers. 34. Viri pastores sumus, et patres nostri. Haec est justa servitus, ut homines pecoribus dominentur, et pecora hominibus serviant. Nam humanam servitutem aut iniquitas aut adversitas facit. Iniquitas quidem, sicut Noe maledicens filio suo dixit: Maledictus filius meus Chanaan, servus erit fratribus suis. Adversitas, sicut Joseph, qui venditus factus est servus. Detestantur Aegyptii omnes pastores ovium. Jure Aegyptus mundum istum significat, in quo abundavit iniquitas. Abominantur Aegyptii pastores ovium, quia omnis iniquus odio habet justum. In terra Gessen. Gessen dicit esse Thebaidem regionem, quae a LXX Gosen vocatur.\
"""
