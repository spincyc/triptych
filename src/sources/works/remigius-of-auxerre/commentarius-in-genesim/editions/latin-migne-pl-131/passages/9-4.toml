text = """
Vers. 13. Arcum meum ponam. Arcus duos habet colores, ex parte caeruleum et ex parte igneum; | per hoc designantur duo diluvia: unum aquae, quod jam praeteriit, aliud ignis, quod in fine saeculi venturum creditur. Unde caeruleus color extrinsecus cernitur, igneus vero intrinsecus. Mystice arcus, qui fit sole nube illustrata, significat eum a diluvio, id est, ab aeterna damnatione posse salvari qui verum solem Christum nube conspexerit, hoc est, qui ejus passionem et resurrectionem per prophetas praedictam crediderit.\
