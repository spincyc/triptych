text = """
Vers. 6. Accelera, tria sata similae. Satum genus est mensurae. Tria sata tres significant filios Noe, a quibus disseminatum omne genus humanum post diluvium. Per tria sata significabatur Ecclesia et doctrina evangelica per tres mundi partes disseminanda. Hinc et in Evangelio mulier, id est, Ecclesia dicitur accepisse fermentum evangelicae doctrinae et abscondisse illud in tribus farinae satis (Luc. XIII, 21), id est, in tribus mundi partibus, Asiae videlicet, Africae, Europae, donec fermentaretur totum, id est, donec omnis mundus crederet. Panis significat unitatem | credentium, quia panis ex multis granis conficitur. Azymi vero fuerunt, quia unitas sanctae Ecclesiae incorrupta est. Subcinericei vero, quia sancti per potentiam igne Spiritus decocti sacrificium vel escam delectabilem se ipsos Deo faciunt. Vitulus de armento Christus est secundum humanitatem ex patribus, de quo per Psalmistam dicitur: Placebit Deo super vitulum novellum (Psal. LXVIII, 32).\
"""
