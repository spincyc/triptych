text = """
Vers. 15. Translata est in domum Pharaonis. Excusari potest Sara in hoc quod in domum Pharaonis translata est invita vel coacta, non solum in hoc quia non coinquinatur corpus nisi ex consensu | mentis, sed etiam in hoc quod connivente et permittente viro factum est hoc. Quaeritur etiam quomodo apud Pharaonem tam diu intacta manere potuerit. Dicitur enim: Abraham bene usi sunt propter eam, et fuerunt ei boves, oves et familiae. Sed ad solvendam hanc quaestionem valet et hoc quod in libro Esther legitur, quia puellae quae Assuero regi adducebantur non statim introducebantur ad regem, sed anno uno custodiebantur, et sex mensibus ungebantur oleo myrtino, et sex aliis mensibus diversis unguentis (Esther II, 12). Potuit ergo fieri ut per has inducias longi temporis Sara manserit incorrupta, et interim bene usi sunt Abraham Aegyptii, donec a Deo flagellaretur et, cognitam quod uxor ejus esset, restitueret eam illibatam.\
"""
