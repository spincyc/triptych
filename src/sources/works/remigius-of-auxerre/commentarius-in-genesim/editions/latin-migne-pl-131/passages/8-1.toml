Vers. 1. Adduxit spiritum. Id est ventum, vel, ut quidam volunt, solem, sive Spiritum sanctum debemus accipere de quo in principio dicitur: Spiritus Domini ferebatur super aquas. Qui enim in principio ferebatur super aquas, ut eas in unum congregaret, ut appareret arida, ipse nunc sua et totius Trinitatis voluntate adductus est super terram, ut a pervasione aquarum eriperet eam, et eis pristinam pulchritudinem | et fertilitatem redderet.\
