text = """
Vers. 11. Anno sexcentesimo, mense secundo. Id est mense Nisan, qui a Latinis Maius dicitur. Primus enim mensis est apud illos Aprilis. Cataractae. Id est fenestrae coeli. Fenestrae autem coeli nubes dicuntur quae apertae sunt, ut inde insolitae et majores pluviae funderentur. Nam cataractae sunt proprie | ostia Nili, sed abusive pro omnibus fenestris accipiuntur. Fontes quoque magnae abyssi rupti sunt. Ut non sensim more solito fluerent, sed repentina inundatione superficiem terrae operirent.\
"""
