text = """
Vers. 21. Et in tabernaculo suo nudatus est. Id est in plebe Judaica, inter domesticos generis sui. Cham filius ejus, qui nuditatem patris fratribus nuntiavit, Judaeos designat passionem Christi longe ante in prophetis legentes qui nuntiabant futuram. Sed hoc quod diu praenuntiaverunt impletum videntes deridere potius quam credere maluerunt. Sem | vero primogenitus et Japheth minimus significant eos qui in primitiva Ecclesia fuerunt, apostolos videlicet et eos qui ex gentibus crediderunt. Medius Cham Judaeos significat qui, nec primum cum apostolis, nec postea gentibus fidem Domini recipere voluerunt. Sem vero et Japheth nuditatem patris sibi nuntiatam audire noluerunt, sed pallio operuerunt: quia fideles mysteria passionis Christi non cum Judaeis despiciunt, sed digna veneratione honorant. Et bene pallium in humeris portant: quia ipsam passionem non futuram exspectant, sed impletam credunt.\
"""
