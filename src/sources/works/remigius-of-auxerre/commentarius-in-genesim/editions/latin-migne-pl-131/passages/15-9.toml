text = """
Vers. 16. Generatione quarta revertentur huc. Moyses dicit: quinta generatione egressi sunt filii Israel de Aegypto. Hic vero dicit: generatione quarta. Sed utrumque verum est. Nam si per Levi computes, quartam inventes generationem ita: Levi, Caaz, Caaz genuit Amram, Amram genuit Aaron, Aaron genuit Eleazar, Eleazar genuit Phinees. Caaz ingressus | est Aegyptum cum patre suo Levi: Phinees vero filius Eleazari ingressus est terram repromissionis. Si vero et quomodo quinta generatione hoc factum sit velis scire, per Judam computare debebis. Judas genuit Phares, Phares genuit Esrom, Esrom genuit Aminadab, Aminadab genuit Naason, Naason genuit Salmon. Judas ingressus est cum filio suo Phares in Aegyptum. Naason vero princeps fuit tribus Judae in deserto, cujus filius intravit in terram promissionis.\
"""
