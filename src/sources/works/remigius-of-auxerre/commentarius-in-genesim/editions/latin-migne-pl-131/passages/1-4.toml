physical_line_ranges = [[37, 37]]
text = """
| Vers. 4. Et vidit Deus lucem, quod esset bona. Non quod tunc primo viderit in cujus praesentia semper hoc fuit: sed vidit, id est a nobis videri voluit lucem esse bonam. Et divisit lucem a tenebris. Tenebrae a tenendo dictae sunt, quia tenent oculos ne videant. Utrumque autem fecit Deus et lucem et tenebras, scilicet ut in luce operarentur homines, et in nocte requiescerent. Ergo et tenebrae opus Dei sunt. Unde in hymno trium puerorum in quo omnis creatura ad benedicendum Deum invitatur, etiam tenebrae cum luce ponuntur. Allegorice quod dictum est: in principio fecit Deus coelum et terram, nomine principii Filium Dei non incongrue possumus accipere, sicut ipse de se Judaeis dixit: ego principium qui et loquor | vobis (Joan. VIII, 28). Deus enim Pater principium est, sed non de principio, quia a Patre non factus nec creatus, sed genitus est: per quod principium Deus Pater coelum et terram creavit, id est coelestes et terrenos. Per coelum enim coelestes sive coelestem vitam ducentes: per terram vero terrenis negotiis inhiantes signantur. Qui utrique per principium creati sunt, quia nato Jesu Christo patuit qui essent coelestes, quique terreni. Terra vero erat inanis et vacua. Id est, corpus humanum inane a meditatione coelesti, vacuum a fructu bonae operationis. Et tenebrae erant super faciem abyssi. Quia infidelitatis tenebrae et ignorantiae abyssum humani cordis operiebant. Spiritus Dei ferebatur super aquas. Quia divina praescientia super fluida et infructuosa | corda hominum ferebatur, praevidens et disponens quorum corda digne posset inhabitare. Fiat lux. Lux vocabulo fides accipitur. Bene ergo lux prima die facta est, quia primo mandato legis fides commendatur cum dictur: Audi, Israel, Dominus Deus tuus Deus unus est.\
"""
