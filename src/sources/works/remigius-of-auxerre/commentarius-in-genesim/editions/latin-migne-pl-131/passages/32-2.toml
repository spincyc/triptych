text = """
Vers. 7. Divisit in duas turmas. Non, ut quidam putant, in tres, sed in duas turmas populum. Prima | turma duarum ancillarum Zelphae et Balae cum filiis suis. Secunda turma fuit Liae et Rachelis et eorum qui cum eis erant. Sed quaeri potest hoc loco, cum Deus promisisset Jacob auxilium suum dicens: Noli timere, ego tecum sum, et multiplicabo, cur timuerit et providerit saluti suae, et non potius se Deo commiserit custodiendum? Sed hoc monemur exemplo ne Deum tentemus, dum habemus quod pro salute nostra faciamus. Denique et Jacob, quamvis pro se sibi providerit, audiamus tamen quid orans dixerit.\
"""
