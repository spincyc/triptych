text = """
Vers. 30. Zara interpretatur Oriens, vel quia prior egredi debuit, vel quia ex illius familia multi justi et sapientes exorti sunt. Allegorice per hos duos filios Judae duo populi figurantur; per Zaram, qui primus manum eduxit, Judaicus populus designatur, qui quasi manum praebuit, quando se praeparatum ad Dei mandata implenda ostendit. Cui obstetrix coccinum ligare voluit, id est fide Dominicae passionis et crucis illum insignire. Coccinum vero, quod sanguinis habet colorem, Christi indicat passionem. Sed ille manum | cruentatam sanguine prophetarum et ipsius Domini retraxit, quia fidem passionis ejus recipere noluit. Illo tardante, junior egressus est frater, hoc est, populus gentilis credendo in Christum ad obediendum praeceptis ejus se praeparavit.\
"""
