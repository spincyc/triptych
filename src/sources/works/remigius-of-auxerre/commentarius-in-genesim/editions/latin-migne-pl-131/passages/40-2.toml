text = """
Vers. 17. Et in uno canistro, quod erat excelsius, portare me omnes cibos, qui fiunt arte pistoria. In Graeco habetur, portare me chondriton, id est panem cibarium. Sed hoc non convenit Pharaoni, ut cibario pane vesceretur. Potuit tamen fieri, ut beatus Augustinus dicit, ut canistra videretur habere deorsum panes cibarios, supra quos erant omnia, quae fiunt arte pistoria. Mystice hi duo viri duo sunt populi, qui ambo graviter peccaverunt, ut Apostolus dicit: Non est distinctio Judaei et Graeci, | Omnes peccaverunt et egent gloria Dei (Rom. X, 12). Sed apparente vero Joseph, alter, id est Judaicus, non credendo in ligno crucis damnatus est, in ligno praevaricationis.\
"""
