text = """
Vers. 10. Veneruntque ad aream, quae sita est trans Jordanem. Septuaginta dicunt, ad aream Adad, qui locus trans Jordanem est, et multis passuum millibus distat ab Abramio, id est a loco ubi Abraham sepultus est. Ergo praetergressi sunt locum ubi sepeliri debebat Jacob, et postea remenso Jordane redierunt ad locum duplicis speluncae. Unde quaeri potest quare hoc fecerint. Sed forte dicet aliquis quod timerent ne bella contra se surgerent, sicut et filii Israel | circumducti sunt quadraginta annis per desertum, donec quadragesimo anno transmisso Jordane venirent in terram promissionis. Sed causa majoris | significantiae hoc factum esse sciamus. In hoc enim loco qui area Adad dicitur, postea multitudo filiorum Israel murmurans contra Dominum igne divino consumpta est. Hoc ergo praesignabat luctus ille vehemens, quo non tantum mors Jacob, quantum ruina illius populi quae ibi futura erat, deflebatur.\
"""
