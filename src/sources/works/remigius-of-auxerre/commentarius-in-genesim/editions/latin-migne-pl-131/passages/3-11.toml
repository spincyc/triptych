text = """
Vers. 16. Et tu insidiaberis calcaneo ejus. In calcaneo finis est corporis. Calcaneo ergo diabolus insidiatur, quia maxime in fine vult homines decipere. | Mulieri quoque dixit: Multiplicabo aerumnas tuas, in dolore paries filios. Quia illa, si non peccasset, sine dolore paritura erat: idcirco post peccatum ei haec poena irrogatur, ut in dolore pariat jam filios. Et sub viri potestate eris, et ipse dominabitur tui. Etiamsi non peccasset, sub potestate viri futura erat. Sed illa subjectio minus poenalis esset, quia ex dilectione procederet quae nunc ei pro poena imponitur ut etiam nolens viro subdatur. Moraliter sub potestate viri mulier constituitur: quia spiritui caro subdenda est, ne repugnet, sed magis obtemperet.\
"""
