text = """
Vers. 11. Cresce et multiplicare. Hoc melius ad spiritalem Israel refertur, qui crescit et multiplicatur in virtutibus. Omnis enim quicunque supplantator est vitiorum, et mente Deum contemplatur, recte Jacob vel Israel appellatur. Quod ergo dicit: Ultra non vocaberis Jacob, non ad illum hominem, sed ad spiritale | semen Jacob pertinet. Ille enim postea Jacob vocatus est. Sancti vero omnes, id est verus Israel, postquam omnem corruptionem et vetustatem deposuerit, non dicetur Jacob, id est supplantator (non enim erunt vitia quae supplantet), sed potius Israel vocabitur, quoniam Deum sicut est videbit, et summa beatitudo erit ei visio creatoris. Reges de lumbis tuis. Id est qui vere reges sunt, semetipsos secundum voluntatem Dei bene regentes, qui filii sunt Israel per imitationem.\
"""
