text = """
Vers. 22. Ecce Adam quasi unus ex nobis factus est! Irridendo eorum superbiam replicat Deus verba quae suasor dixerat in caput damnationis eorum, dicens: sciens bonum et malum. Quasi diceret: non solum non potuit Adam pervenire ad id quod petiit, scilicet ut similis Deo fieret, sed etiam id quod erat amisit. Appetiit similis esse Deo, non humiliter imitando Deum, sed superbiendo et ejus dominium respuendo. Quod autem sequitur, quasi unus ex | nobis, sanctae Trinitatis mentio inculcatur. Nunc ergo ne forte mittat manum suam. Quod vero dicit: ne forte mittat manum suam, verba Dei sunt. Quod denique sequitur:\
"""
