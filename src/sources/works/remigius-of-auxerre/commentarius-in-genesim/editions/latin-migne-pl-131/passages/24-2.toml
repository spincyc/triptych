text = """
Vers. 13. Igitur ego sto prope fontem aquae. Beatus Augustinus quaerit hoc loco ad litteram utrum hoc agere debeamus ut signum a Deo petamus. Pene enim nihil videtur differre ab augurio. Sed aliud est signo aliquo in quo miraculum sit voluntatem Dei quaerere, aliud, in vocibus avium vel mutuorum animalium divinationem captare, quamvis nec illud nisi in summa necessitate praesumendum sit. Allegorice servus Abraham chorum significat sanctorum doctorum. Hic est ille servus qui in Evangelio a Domino suo missus | est ut invitatos ad paratam coenam venire faceret. Misit servus manum sub femore domini sui Abraham, quia doctores summa veneratione incarnationem Christi suscipiunt. Et non super femur, sub femore manum ponit, quia carnem Christi a carne caeterorum hominum longe distare intelligunt. Christi enim caro de Virgine sine labe peccati nata est. Rebecca quae patientia interpretatur, Ecclesia est ex gentibus quae per patientiam virtutes suas custodit. Fons ad quem servus stetit significat fluenta doctrinae evangelicae, vel etiam sacramentum baptismatis ad quod festinabat jam Rebecca, id est, Ecclesia; cum hydria, id est cum Verbi mensura. Bene autem hydriam de scapula super ulnas deposuisse dicitur. Per scapulas enim intelligitur | voluntas bona in qua primum fidem suscepit. Per ulnam vero operatio, quae fidem subsequitur. Ornamenta quibus servus Rebeccam decoravit virtutes et praecepta doctorum sunt. Inauris enim humilitatem boni auditoris significat qua in dilectione Dei et proximi proficit. Unde et duos siclos inaures habuisse dicuntur. Armillae vero obedientiam boni auditoris, vel bonam operationem significat. Quae appendebat decem siclos, quia omnis nostra operatio in decem legis praeceptis consistit.\
"""
