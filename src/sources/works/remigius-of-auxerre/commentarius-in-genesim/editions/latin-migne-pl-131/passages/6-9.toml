text = """
Vers. 14. Fac tibi arcam de lignis levigatis. Id est, fortibus et insolubilibus. Et hoc est, quod LXX dicunt: De lignis quadratis, id est, fortibus. Mansiunculas facies in arca. Mansiunculas dicit in quibus diversa animalium genera reciperentur. Septuaginta dicunt: Bicamerata et tricamerata in arca facies. Bicamerata videlicet in inferioribus, tricamerata in | superioribus. Ergo quinque mansionibus distincta fuit arca. Prima mansio, id est inferior fuit stercorata, ubi animalium stercora defluebant, ne illa quae erant in arca et maxime ne homines foetore laederentur. Secunda fuit apothecaria, ubi cibus diversus animalium reconditus erat. Tertia fuit bestiarum et immitium animalium ac serpentium. Quarta, jumentorum et mansuetorum animalium. Quinta, id est suprema, hominum et avium. Ostium vero quod in sequentibus in latere arcae fuisse describitur eo loco fuisse creditur, ubi bicamerata et tricamerata jungebantur inter apothecariam et bestiarum habitationem. Et bitumino linies. Bitumen, quod Graece asphaltum dicitur, unde lacus Asphaltites vocatur, id est gluten tenacissimum, quidquid tactum fuerit | nunquam convermescit, nec ulla vi imbrium aut flatu ventorum dissolvi potest.\
"""
