physical_line_ranges = [[132, 132]]
text = """
Vers. 19. Ex cunctis animantibus bina induces in arcam. Quaeritur de minutis animantibus, non solum quales sunt mures et stelliones, sed etiam quales sunt muscae, et scabriones, et scarabei et pulices, si in his hic numerus poterit conservari. Sed sciendum quia illa quae non coitu generantur, sed humore terrae vel ex quacunque cadaverum aut aliarum | rerum corruptione nascuntur, non necesse fuit contineri in arca. Nam et hoc intelligendum innuitur, cum dicitur: De volucribus juxta genus suum, et de jumentis in genere suo. Illa quoque quae in domibus versantur, sicut pulices, mures, muscae, non necesse fuit in his hunc numerum observari, quae intelliguntur tunc plura in domibus fuisse. Sed et illa animalia quae ex commistione diversi generis nascuntur, sicut muli et burdones et caetera talia, non est dicendum fuisse in arca. Item quaeritur de his animantibus quae in aquis et in terra communiter vivunt, utrum fuisse credantur in arca, aut si non fuerunt, quomodo vivere potuerint sicut lutri et vituli marini. Sed de his credi potest quod extra | arcam fuerint: habebant tamen loculos praeparatos extra arcam in quibus se poterant recipere, veluti in aridis. Hoc et de avibus sentiendum marinis et fluvialibus, quia vicibus in aquis erant, et item in praeparatis mansiunculis extra arcam se recipiebant.\
"""
