text = """
Vers. 2. Terra autem inanis et vacua. Id est, inutilis, infructuosa et incomposita. Omnia enim elementa commista erant et confusa, et totum hoc aeris spatium quod est a terra usque ad coelum plenum erat aquis, quae tamen non erant ejusmodi qualitatis cujus nunc sunt, sed in modum nubium tenues, | quam qualitatem adhuc illae supercoelestes aquae retinent. Spiritus Dei ferebatur super aquas. Sicut mens vel sapientia alicujus artificis superfertur operi quod facturus est, ut quomodo vult ita illud faciat: ita et Spiritus sanctus superferebatur, praeordinans et quasi disponens quid, qualiter facere vellet.\
"""
