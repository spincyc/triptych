text = """
Vers. 3. Dixitque Deus: Non permanebit Spiritus meus in homine in aeternum, quia caro est. Alia translatio habet: Non judicabit Spiritus meus homines in | aeternum, quia caro sunt. Secundum quam translationem talis est sensus: quia homines fragiles sunt et mortali carne circumdati, non eos judicabo in aeternum ut aeternaliter pereant, sed potius eis in praesenti restituam quod merentur. Ex quo intelligimus magnam esse misericordiam, cum peccatores non sinit ex sententia agere, sed flagellando ad se revocat. Unde et quibusdam peccantibus minatur: Non visitabo filias vestras, cum adulteraverint (Ose. IV, 14). Et alibi: Unusquisque post pravitatem cordis sui ambulet (Jer. XIII, 12). Hinc et Psalmista: Exacerbavit Dominum peccator, secundum multitudinem irae suae non quaeret (Psal. X, 4). E contra de his qui Deo accepti sunt dicitur: Visitabo in virga iniquitates | eorum (Psal. LXXXVIII, 33).-- Eruntque dies illius centum viginti annorum. Quidam putant hominum vitam post diluvium in centum viginti annis esse contractam. Sed non ita est sentiendum. Multos enim legimus post diluvium pluribus annis vixisse. Hoc ergo ita accipiendum est. Volens enim Deus inducere peccatoribus diluvium dedit eis spatium, centum viginti scilicet annorum ad agendam poenitentiam. Sed illis agere nolentibus et in sua malitia perdurantibus non exspectavit eos Deus usque ad datum spatium centum viginti annorum, sed centesimo anno factum est diluvium.\
"""
