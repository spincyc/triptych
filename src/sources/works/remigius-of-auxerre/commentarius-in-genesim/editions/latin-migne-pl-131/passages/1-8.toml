text = """
Vers. 14. Fiant luminaria in firmamento coeli. Luminaria solem, et lunam, et caeteras stellas accipimus. Verum sol et luna et septem planetae non sunt in firmamento positae, sed in aethere pendent: ideo in firmamento positae dicuntur. Et dividant diem ac noctem. Sol diei praeest, luna nocti. Sint in signa. Hoc, vel propter terminum Paschalem dicitur, quia luna signum est Paschalis termini qui non nisi post quatuordecimam lunam celebratur, vel quia sidera signa sunt navigantibus per mare vel iter agentibus per Libyam ubi vestigium itineris ad | motum venti dissipatur. Luna apud Hebraeos tribus nominibus nuncupatur, Lare, Lavana, Mavors. Lara vocatur a numero dierum mensis: Lavana a candiditate: Mavors a defectu, quia deficit singulis mensibus.\
"""
