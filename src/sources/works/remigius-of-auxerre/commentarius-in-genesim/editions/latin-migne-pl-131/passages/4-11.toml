Vers. 13. Dixitque Cain: Major iniquitas mea quam ut veniam merear. Peccatis peccata adjiciens desperavit, nec credidit se posse salvari vel veniam adipisci. Et | haec est blasphemia in Spiritum sanctum quae nec hic nec in futuro remittetur (Luc. XII, 10). Qui enim desperat, aut putat Deum nolle dimittere, aut non posse. Si non potest, non omnipotens, quia est aliquid quod non potest. Si autem non vult, quod etiam cogitare nefas est, invidet saluti humanae.\
