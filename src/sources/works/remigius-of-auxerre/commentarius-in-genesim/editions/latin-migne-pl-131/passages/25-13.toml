text = """
Vers. 31. Vende mihi primogenita. Primogenita dicuntur omnia quae vulvam matris aperiunt, quae specialiter primogenitis filiis debebantur. Nonnulli dicunt primogenita | vocari vestem qua induebantur primogeniti et sacerdotes fiebant. Hanc igitur dignitatem quam Esau primogenitus accipere debuit cupiditate gulae superatus minori fratri suo vendidit. Quibus modis vitio gulae tentamur? Sciendum autem quinque modis nos vitio gulae tentari: primo, cum quis ante horam dispositam vel ante necessitatem vult comedere. Secundo, cum lautiores cibos requirit. Tertio, cum accuratius communes cibos vult praeparari. Quarto, cum comedendo modum excedit. Quinto, cum despicabile est quod sumitur. Sed quia cum magno desiderio id quod vile est percipit, in ipso aestu desiderii magis ostendit. Hac specie victus Esau displicuit et reprobatus est. Hinc beatus Augustinus dicit: « Non ergo immunditiam obsonii, sed | immunditiam timeo cupiditatis. » Mystice Judaei, qui per Esau significantur, carnis suae voluptatibus dediti et terrenis operibus occupati non solum dignitatem quam id praesenti habebant dimiserunt, verum etiam illam beatitudinem quae eis repromissa erat, et omnis eorum dignitas ad gentilem populum translata est.\
"""
