text = """
Vers. 5. Descendit, ut videret. Descendere Deus dicitur quando se sensibus vel operibus commodat humanis, sicut ad Moysen dixit: Videns vidi afflictionem populi mei, et descendi liberare eos (Exod. III, 8). Et de Sodomitis dictum est: Descendam, et videbo utrum eum clamorem qui venit ad me opere compleverint (Gen. XVIII, 21). Et nota in sequentibus hic mysterium Trinitatis commendari, cum dicit: Descendamus et confundamus. Mystice turris haec mundi superbiam signat, sive etiam elationem haereticorum qui turrim pravi dogmatis contra Deum volunt aedificare. Quae merito turris Babel, id est confusionis | appellatur. Profecti sunt autem de Oriente, quia verum solem reliquerunt. Invenerunt campum Sennaar, qui interpretatur fetor vel excussio dentium, quia dogmata haereticorum non bonum Christi odorem, sed fetorem habent, et amiserunt dentes quibus cibos verbi Dei commolerent.\
"""
