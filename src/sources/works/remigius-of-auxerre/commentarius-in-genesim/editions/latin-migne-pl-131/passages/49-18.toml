text = """
Vers. 25. Benedictionibus coeli desuper. Quod dicit, benedictionibus desuper et abyssi, omnium rerum copiam per haec duo significat, fertilitatem videlicet terrae, temperiem et proventum coeli, hoc est aeris. Per benedictiones uberum et vulvae multiplicandam designat stirpem ejus maxime propter Ephraim, cujus multitudo usque in immensum aucta | est. Allegorice Joseph Christum significat. Accrescens dicitur, quia crevit in fide gentium. Ipse est enim decorus aspectu, quia speciosus forma prae filiis hominum (Psal. XLIV, 3). Filiae, quae discurrerunt per murum admirantes ejus pulchritudinem, animae sunt sanctorum, super soliditatem fidei constitutae, quae admirantur pulchritudinem Christi, et tanto eum amplius diligunt, quanto majoris fragilitatis sibi sunt consciae. Discurrunt super murum, hoc est super soliditatem fidei, vel super insuperabilem firmitatem divinarum Scripturarum, ut ibi possint videre pulchritudinem Christi. Sed exasperaverunt eum et jurgati sunt. Hoc de Judaeis dicitur, qui exasperaverunt Christum dicentes eum Samaritanum et daemoniacum. Habentes jacula invidiae, quibus | seipsos vulnerabant. Unde et Psalmista: Dentes eorum arma et sagittae, et lingua eorum gladius acutus (Psal. LVI, 5) .-- Sedit in forti arcus ejus. Id est, spes virtutis ejus mansit in Deo Patre. Et dissoluta sunt vincula brachiorum ejus. Quia vinctus adductus est ante praesidem. Vel vincula brachiorum dicit blasphemias quibus opera virtutum ejus impedire conabantur, dicentes eum in Belzebub ejicere daemonia. Et hoc per manus potentis Jacob, id est per operationem omnipotentis Dei. Deus patris tui adjutor tuus. Loquitur patriarcha ad Christum secundum hoc quod homo est. Deus, inquit, patris tui, id est ille Deus quem patres tui adoraverunt, Abraham, Isaac et Jacob. Et Omnipotens benedicet tibi. Singulari videlicet benedictione prae caeteris | sanctis. Per benedictionem coeli desuper et abyssi jacentis deorsum significatur Christo omnia fuisse subjecta, angelos videlicet in coelo et homines in terra. De hac benedictione Apostolus dicit: Et exaltavit illum Deus, et donavit illi nomen, etc. (Philip. II, 9) .-- Benedictionibus uberum dicit, id est duorum Testamentorum, quorum alterum venturum Christum, alterum venisse nuntiavit. His uberibus nutritur infantia Ecclesiae. Vel etiam benedictionibus uberum dicit beatae Mariae Virginis, quae Christum infantem habuit, cujus incorrupta in vulva progenitus est. Unde et in Evangelio exclamans quaedam mulier dixit: Beatus venter qui te portavit, et ubera quae suxisti (Luc. XI, 27).-- Benedictiones | patris tui confortatae sunt benedictionibus patrum ejus. Hoc est, illae benedictiones quibus Deus Pater Filium benedixit, confortatae sunt et praevaluerunt omnium sanctorum Patrum benedictionibus. Nullus enim justorum Christo exaequari potuit, quia ille per naturam est Dei Filius, caeteri sancti per adoptionis gratiam. Donec veniret desiderium collium aeternorum. Colles aeternos patriarchas et prophetas dicit, qui non jacent in terrenis, sed sublevantur ad coelestia. Horum desiderium fuit, quo desiderabant videre adventum Christi. Fiant istae benedictiones in capite Joseph. Id est, impleantur in Christo. Et in vertice Nazaraei. Id est Christi, qui est verus flos munditiae, in quo primum benedictiones factae sunt, et ab hoc vertice descenderunt per omnia membra | Ecclesiae usque ad oram vestimenti ejus, id est usque ad novissimum electum.\
"""
