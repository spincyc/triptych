text = """
Vers. 63. Egressus fuerat ad meditandum in agro. Quidam codices habent: ad exercitandum in agro. Alia quoque translatio dicit: ut loqueretur in agro. Inclinata jam die. Quia vir sanctus jam post nonam | horam diei ad vesperam inclinatam egressus fuerat solus ut Deo spiritales victimas immolaret, hoc est, ut orationes et hymnos persolveret. Allegorice ager mundus est, sic Domino parabolam suam exponente: Qui seminat est Filius hominis: ager autem est mundus (Matth. XIII, 38). Isaac ergo inclinata jam die ad meditandum in agro egressus est: quia Dei Filius novissima saeculi aetate venit in mundum, juxta quod per prophetam dictum fuerat: Egressus es in salutem populi tui cum Christo tuo (Habac. III, 13). Ut exerceretur, hoc est, passionis suae certamen impleret. Cumque levasset oculos vidit camelos venientes procul. Per camelum, tortuosum animal et sua struma ponderatum significatur gentilitas, pravis moribus tortuosa et idololatria praegravata, | quae quia ex ipsa reperit quos coleret, quasi strumosum animal gibbum in dorso portabat. In camelo enim sedens Rebecca ad Isaac venit, quia sancta Ecclesia adhuc gentilitatis errore confisa et quasi sustentata ad Christi gratiam vocata est.\
"""
