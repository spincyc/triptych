text = """
Vers. 20. Est civitas parva. Id est, Segor quae antea Bale dicebatur, secundum quod dixit: Est civitas parva, quae vocata est Segor, id est parvula. Mystice mons celsitudinem virtutum significat ad quem nos angelus cohortatur, dicens: In monte salvum te fac, sicut verbi gratia est contemptus omnium facultatum. Ad quam perfectionem Dominus invitat dicens: Si vis perfectus esse, vade, et vende omnia quae habes, et da pauperibus, et veni, sequere me, et habebis thesaurum in coelo (Matth. XIX, 21). Qui vero se viderit ad hunc montem non posse conscendere, melius est | ut in Segor, hoc est, in parvula remaneat, contentus laicali vita et communi conversatione, quam post arreptum virtutis montem ad humilia, id est ad saecularia redeat. Virginitas quoque celsissimus mons est ad quem doctor gentium hortatur, dicens: Bonum est homini, si sic permanserit sicut et ego (I Cor. VII, 8). Hortatur ergo angelus Lot ut ad hunc montem conscendat, fugiens incendia libidinum. Sed qui se viderit hoc non posse servare descendat ad Segor, hoc est, utatur legitimo conjugio, quia melius mediocri bono uti quam per abrupta libidinum praecipitari. Unde et Dominus apostolis dicentibus: Si sic est causa uxoris, non expedit nubere, respondit: Non omnes capiunt verbum hoc, sed quibus datum est: qui | potest capere, capiat (Matth. XIX, 10 et seq.). Et Apostolus: Propter fornicationem, inquit, unusquisque suam uxorem habeat (I Cor. VII, 2).\
"""
