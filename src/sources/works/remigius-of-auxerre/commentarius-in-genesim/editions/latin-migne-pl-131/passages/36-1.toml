text = """
Vers. 6. Abiit in alteram regionem. Hic quaeri potest cur Esau post mortem patris dicatur abiisse in Seir, et recessisse a fratre suo, cum jam, quando venit Jacob, in Seir dicatur habitasse? Sed fieri potuit ut, Jacob fugiente in Mesopotamiam, dolore et ira praereptae sibi benedictionis recesserit a parentibus, et habitaverit in Seir per viginti annos, quibus Jacob absens fuit. Postquam vero reversus est Jacob, et fratri suo reconciliatur, rursus de Seir cum fratre suo, donec pater vixit, nabitavit cum eo. Isaac | mortuo, sicut hic dicitur, tulit substantiam domus suae et recessit a fratre suo. Divites enim erant valde, et simul habitare non poterant.\
"""
