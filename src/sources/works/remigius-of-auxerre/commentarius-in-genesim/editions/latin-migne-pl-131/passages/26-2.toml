text = """
Vers. 18. Rursum fodit alios puteos quos foderant servi patris sui. Allegorice Isaac Christum significat | qui, cum venisset per Incarnationis mysterium ad torrentem nostrae mortalitatis, fodit puteos, id est, aperuit scientiam Scripturarum, quos fodiebant servi patris ejus Abraham, scilicet Moyses, David, Salomon et magni voce prophetae. Hi enim servi Abraham, id est, omnipotentis Dei cujus figuram Abraham gestabat. Sed hos puteos Palaestini invidentes terra repleverunt. Palaestini Judaeos designant alienos a Deo qui Scripturas perruperant terreno intellectu. Nam Palaestini alieni interpretantur.\
"""
