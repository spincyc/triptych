physical_line_ranges = [[80, 80]]
text = """
Vers. 5. Scit enim Deus quod, in quacunque die comederitis ex eo, eritis sicut dii. Quaerunt multi: Si Deus praevidebat hominem posse decipi, cur permisit eum tentari? Sed, ut beatus Augustinus dicit, non magnae laudis esset, si bene in paradiso viveret nullo persuadente. Ut enim Apostolus dicit, non | coronabitur, nisi qui legitime certaverit (II Timoth. II, 5). Et certe liberum habebat arbitrium, ut, si voluisset, resisteret tentatori. Quod si fecisset, digne utique remuneraretur. Artificiali et arguta quidem machinatione diabolus suae persuasionis dolos composuit dicens: Eritis sicut dii, ut, si per inobedientiae contemptum hominem subvertere nequiret, saltem in hoc quod fidem in eo corrumperet et cum ad idololatriam suaderet, victorem se gloriaretur. Si autem ad inobedientiam et contemptum Dei illum seduxisset, in utroque victor existeret.\
"""
