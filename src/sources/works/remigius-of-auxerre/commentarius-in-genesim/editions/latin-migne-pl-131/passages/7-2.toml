text = """
Vers. 7. Et ingressus est Noe et filii ejus in arcam. Attendendum est quod quando ingressus est in | arcam, seorsum ipse et filii ejus in arcam, et seorsum uxores eorum. Dicitur enim: Ingressus est in arcam ipse et filii ejus; deinde: uxor ejus et uxores filiorum ejus. Quando vero egressi sunt, viri cum uxoribus permisti leguntur. Dicit enim: Egressus est Noe et uxor ejus. Hoc est quod Salomon dicit: Tempus amplexandi, tempus longe fieri ab amplexibus (Eccli. III, 5). Ingressi sunt in arcam, nutu videlicet Dei, non homine faciente.\
"""
