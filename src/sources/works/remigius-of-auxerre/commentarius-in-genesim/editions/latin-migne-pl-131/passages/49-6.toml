text = """
Vers. 9. Ad praedam, fili mi, ascendisti. Haec quae tradita sunt tam de David ad litteram, quam et de Christo spiritaliter pertinent, quem per apostrophen patriarcha alloquitur: Ad praedam, fili mi, ascendisti. Christus ad praedam ascendit, quia contra diabolum pugnaturus venit, ut eos quos captivaverat, | eriperet. Quod autem dicit, ascendisti, confidentiam et securitatem Creatoris ostendit. Ipse requiescens accubuit ut leo, quia in spe firmissima resurrectionis mortem suscepit, quam in potestate habuit. Requievit ut catulus leonis, quia tribus diebus in sepulcro jacuit. Ferunt enim physici de catulo leonis quod natus tribus diebus dormiat, tertio tandem die magno rugitu patris excitatur. Sic et Christus tribus diebus dormivit in sepulcro, et tandem tertia die a Deo Patre excitatus est, cujus rugitum Psalmista describit dicens: Exsurge, gloria mea, exsurge, psalterium et cithara (Psal. CVII, 3). Et respondit | ipse: Exsurgam diluculo. Quis suscitavit eum? Nullus videlicet nisi Pater et ipsa divinitas qua humanitas ejus plena erat.\
"""
