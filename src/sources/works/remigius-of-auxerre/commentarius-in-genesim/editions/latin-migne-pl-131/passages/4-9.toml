Vers. 11. Nunc igitur maledictus eris super terram quae aperuit os suum. In praevaricatione Adae, sicut | jam diximus, terra maledicta est, non ipse. In peccato autem Cain ipse maledicitur, quia sciens reatum primae praevaricationis non timuit, sed insuper scelus homicidii vel fratricidii adjecit. Allegorice superius diximus Cain Judaeos significare, Abel Christum. Terra vero hoc loco Ecclesiam significat, quae fusum Christi sanguinem aperto ore, id est magnae devotionis desiderio, ad aeternam suscipit salutem\
