text = """
Vers. 13. Dic, obsecro, quod soror mea sis. Quaerunt quidam cur sanctus patriarcha mentiri voluerit ut diceret Saram sororem suam, et non potius | hoc Deo commiserit qui et ejus vitam et illius servare poterat castitatem. In quo ostenditur quia quandiu habemus quod ex ratione faciamus, non debemus Deum tentare, sed ipsi nostrae saluti providere. Quodammodo Deum tentasset, si eam uxorem suam confessus fuisset, duas Deo res committens, suam vitam et illius castitatem. Fecit ergo pro vita quod potuit: quod vero non potuit Deo commisit, certus, si vellet, etiam apud Pharaonem ejus pudicitiam conservare posset.\
"""
