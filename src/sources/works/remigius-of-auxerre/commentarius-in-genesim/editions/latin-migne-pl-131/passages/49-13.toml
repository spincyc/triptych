text = """
Vers. 20. Aser, pinguis panis ejus. Haec verba ad fertilitatem possessionis juxta litteram pertinent. Allegorice vero Aser, qui beatus vel pinguis panis interpretatur, eumdem Christum designat, cujus panis pinguis est, id est corpus ejus, quo ad aeternam vitam reficimur, sicut ipse dixit: Ego sum panis vivus, | qui de coelo descendi, et do vitam huic mundo (Joan. VI, 35). Ipse praebet delicias regibus, id est sanctis, qui motus corporis sui bene regere noverunt. His praebet delicias, id est suavitatem verbi, sive etiam se ipsum, quia Aser deliciae interpretatur.\
"""
