text = """
Vers. 31. Vocatus est locus Bersabee. Puteus Septimus, propter sex agnas quae ibi immolatae sunt. Vel puteus Juramenti, quia uterque ibi juraverat. Sabee utrumque sonat, et septem et juramentum. Hoc loco quaerendum quid sit quod superius legitur Agar stetisse ad puteum juramenti quod postea longo tempore factum est. Necdum enim ita vocabatur. Ergo per prolepsin, id est per praeoccupationem accipiendum | est: qui modus locutionis usitatissimus est in divinis Scripturis, quamvis potuerit esse illo tempore jam puteus. Quod si ita est, tunc per recapitulationem locus iste accipiendus est.\
"""
