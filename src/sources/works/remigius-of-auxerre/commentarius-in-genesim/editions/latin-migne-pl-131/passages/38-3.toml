text = """
Vers. 23. Habeat sibi, certe mendacii nos arguere non potuit. In facto Judae non justitia, sed fides apparet. | Si enim justus fuisset, castitatem servasset. Fides autem in hoc fuit, quia haedum, quem promiserat, remisit. Mystice Judas hoc loco personam gerit Christi. Thamar, quae amaritudo vel commutata interpretatur, typus est Ecclesiae, quae in amaritudine idololatriae versabatur. Sed venit ad eam Judas, requisivit cum pastore suo Odollamita, qui Hiras vocabatur. Hiras autem interpretatur fratris mei visio, Joannem Baptistam designans, quem Christus ante se praeconem praemisit. Erat Odollamita, qui interpretatur testimonium, quia Domino testimonium in aqua Jordanis perhibuit. Venit Judas ad tondendas oves. Venit Christus ad homines, ut eos velleribus et sordibus peccatorum exoneraret. Tunc Thamar vidit, id est misertus est Ecclesiae, | et mutato nomine et habitu fecit eam de Synagoga Ecclesiam, de meretrice sponsam. Quod autem non cognovit eam, hoc est quod ipse per Psalmistam dicit: Populus quem non cognovi, servivit mihi (Psal. XVII, 44). Dedit ei pro arrhabone annulum, baculum, armillam, pignus videlicet vocationis, justificationis et glorificationis, sicut Apostolus dicit: Quos vocavit, hos justificavit; et quos justificavit, illos et glorificavit (Rom. VIII, 30).\
"""
