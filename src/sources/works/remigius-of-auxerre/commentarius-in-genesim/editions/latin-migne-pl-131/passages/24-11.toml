text = """
| Vers. 67. Introduxit eam in tabernaculum Sarae matris suae. Quia Christus Ecclesiam in locum Synagogae constituit de qua carnem assumpserat. Accepit eam uxorem. Quia gratiam quam illa quondam habebat novae sponsae attribuit, despondens eam sibi non habentem maculam, neque rugam. Ut dolorem qui ex morte matris acciderat temperaret. Mors matris est infidelitas Synagogae pro qua Christus multum doluit. Unde et in passione dicebat: Tristis est anima usque ad mortem (Matth. XXVI, 38). Non enim pro passione tristabatur, sed pro Judaeorum perditione. Hunc ergo dolorem temperavit amore Rebeccae, quia damnum et expeditione unius plebis recompensavit fide et salute omnium gentium.\
"""
