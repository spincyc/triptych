text = """
Vers. 9. Ludentem. Tradunt Hebraei quod idola | fecerit quasi ludens quibus infantiam Isaac deciperet. Beatus quoque Hieronymus dicit quod quasi major per ludum primogenita sibi praesumpserit. Absolute autem possumus dicere quod eum lubricum et lascivum facere volebat, sicut ipse erat. Unde et Apostolus hunc ludum persecutionem appellat dicens: Sed, tunc sicut is qui secundum carnem natus est persequebatur eum qui secundum spiritum, ita et nunc (Gal. IV, 29).\
"""
