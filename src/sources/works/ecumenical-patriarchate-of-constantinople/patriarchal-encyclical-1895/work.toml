description = "The synodal encyclical issued by the Ecumenical Patriarch Anthimus VII and his synod in 1895 in reply to Leo XIII's Praeclara gratulationis (1894). It enumerates the innovations the Eastern Orthodox Church charges against the Roman Church; article XIII rejects the 1854 definition of the Immaculate Conception as a novel dogma unknown to the ancient Church while confessing Mary as Mother of God and ever-Virgin. Cited in Triptych publications as an act of that communion, never as Catholic authority."
