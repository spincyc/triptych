notes = "SBLGNT v1.2, CC BY 4.0 (attribution required: copyright 2010 Society of Biblical Literature and Logos Bible Software). Inspected on 2026-11-26. The lemmata were corroborated in the MACULA Nestle 1904 CSV (re-fetched whole, SHA-256 3beee6ab...67150, equal to the registered record): Luke 23:53 ἐντυλίσσω, τίθημι (and Mark 15:46 ἐνειλέω, κατατίθημι; Matt. 27:59 ἐντυλίσσω). The Greek verbs differ from those of Luke 2:7; the Clementine Vulgate renders involvit sindone, et posuit, so only involvit is shared between the two Latin verses, and the Douay has wrapped ... laid in both."
