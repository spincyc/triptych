description = "The opening tractate of the Mishnah, on the recitation of the Shema, the Amidah, and blessings, including in chapter 8 a list of disputes between the House of Shammai and the House of Hillel about the conduct of a meal. The third of those disputes, at 8:3, is the only ancient rabbinic ruling about a cloth used at table: it concerns where a damp hand-towel may be laid so that it does not transmit ritual impurity. A locus is chapter.mishnah."
