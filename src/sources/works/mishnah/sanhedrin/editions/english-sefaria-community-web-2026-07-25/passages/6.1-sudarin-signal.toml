verified_on = "2026-07-25"
notes = "The word rendered scarf is ha-sudarin, the same word Greek borrowed as soudarion and Latin as sudarium. The Hebrew of the clause reads, in transliteration, ehad omed al petah beth din veha-sudarin beyado, and hallaz meniph ba-sudarin veha-sus rats u-ma'amido. The bracketed supplement is the translator's."
