context = "The sudarin signal, read in the retrieved response for the whole mishnah, with the public-domain Torat Emet Hebrew of the same mishnah read alongside it. Registered as a positive control on the negative search reported by consuming publications: the rabbinic corpus does record a sudar used as a deliberate signal, and its sense is judicial, not domestic."
physical_line_ranges = [[1, 2]]
text = "One would stand before the entrance to the courthouse, his scarf in his hand; and another would ride on a horse before them at a distance, in order to see him. [If] one says, I have an argument for acquittal, then he waves the scarf, and the horse runs to stop him."
transcription_segments = [
