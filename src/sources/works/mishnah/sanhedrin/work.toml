description = "The Mishnah's tractate on courts and capital procedure. At 6:1 it describes the procession to a stoning and the arrangement by which an argument for acquittal could still be heard: a man stands at the court door with the sudarin in his hand and waves it, and a horseman posted within sight rides to halt the execution. This is the one attested ancient Jewish use of a sudar as a deliberate signal. A locus is chapter.mishnah."
