description = "The in-flight question-and-answer session given by Benedict XVI to accompanying journalists on 11 May 2010, at the outset of his apostolic journey to Portugal for the tenth anniversary of the beatification of Jacinta and Francisco Marto. Questions were put by Father Federico Lombardi. The third answer restates the anthropology of apparition as a supernatural impulse expressed according to the capacities of the subject, and states that beyond the vision of the suffering of the Pope, which may in the first place be referred to John Paul II, an indication is given of realities involving the future of the Church, including suffering arising from sin within the Church. Published by the Holy See among his speeches; ordinary papal teaching, not an act of the extraordinary magisterium."
