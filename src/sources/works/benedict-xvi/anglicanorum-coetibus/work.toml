description = "The apostolic constitution of 4 November 2009 providing for personal ordinariates for Anglicans entering into full communion with the Catholic Church. Article VI governs their clergy and permits the Ordinary to petition the Roman Pontiff, as a derogation from CIC c. 277 par. 1, for the admission of married men to the presbyterate case by case."
