context = "The opening paragraph identifies the original dedication to the Saviour and the later titles of the two Johns. In the second, the building signifies the community, with Christ as its foundation and cornerstone. Benedict names 1 Corinthians 3:9–11, 16–17, 1 Peter 2:4–8 and Ephesians 2:20–22. The closing paragraph joins worship in spirit and truth with care for actual places of worship."
verified_on = "2026-11-23"
notes = "The three body paragraphs were compared in the Italian and English Holy See presentations. The address supplies the pope's interpretation of the feast. His reference to Ignatius is an attribution within the address."
