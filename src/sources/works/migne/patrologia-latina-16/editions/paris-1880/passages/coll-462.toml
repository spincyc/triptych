context = "Ambrose (or the author of De sacramentis) IV, 5, 21, read visually at column 462: 'Vis scire quia verbis coelestibus consecratur? Accipe quae sunt verba. Dicit sacerdos: Fac nobis, inquit, hanc oblationem ascriptam, ratam, rationabilem, acceptabilem: quod figura est corporis et [sanguinis Domini nostri Jesu Christi]', the sentence running over to column 463. The Maurist note 74 on the same column records that the word ratam was missing from all earlier editions and from some manuscripts and is restored from several others."
verified_on = "2026-07-25"
notes = "Read at the page image, not at raw OCR. The passage bears on the wording of the Roman Canon's Quam oblationem in the late fourth century; it does not establish that the surrounding Milanese eucharistic prayer is identical with the Roman Canon."
