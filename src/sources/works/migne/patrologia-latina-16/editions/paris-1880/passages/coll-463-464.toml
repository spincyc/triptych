context = "De sacramentis IV, 5, 21-23 at column 463 ('Qui pridie quam pateretur, in sanctis manibus suis accepit panem, respexit in coelum ad te, sancte Pater omnipotens, aeterne Deus, gratias agens, benedixit, fregit, fractumque apostolis suis et discipulis suis tradidit, dicens: Accipite, et edite ex hoc omnes; hoc est enim corpus meum, quod pro multis confringetur', with the chalice narrative at IV, 5, 22) and IV, 6, 27 at column 464 ('Et sacerdos dicit: Ergo memores gloriosissimae ejus passionis, et ab inferis resurrectionis, et in coelum ascensionis, offerimus tibi hanc immaculatam hostiam, rationabilem hostiam, incruentam hostiam, hunc panem sanctum, et calicem vitae aeternae: et petimus et precamur, ut hanc oblationem suscipias in sublimi altari tuo per manus angelorum tuorum, sicut suscipere dignatus es munera pueri tui justi Abel, et sacrificium patriarchae nostri Abrahae, et quod tibi obtulit summus sacerdos Melchisedech'). Both columns were read visually."
verified_on = "2026-07-25"
notes = "The Maurist note 75 on the same leaf records that the words et discipulis suis are omitted in the Roman edition alone, and that where all editions and manuscripts read pro multis confringetur the same Roman edition corrected to pro vobis datur. The passage is a Milanese witness of the late fourth century; it establishes the antiquity of the pattern later fixed in the Roman Canon at Quam oblationem, Qui pridie, Unde et memores, Supra quae, and Supplices, not the identity of the two prayers."
