notes = "The Garnier reprint of Migne's volume 16, read on its own title page (leaf 5 of the Internet Archive scan patrologiaecur16mign): PATROLOGIAE LATINAE TOMUS XVI, S. AMBROSIUS, PARISIIS, APUD GARNIER FRATRES, EDITORES ET J.-P. MIGNE SUCCESSORES, 1880. Migne reprints the Maurist edition of De sacramentis together with the Maurist admonitio and variant notes; those notes record that the reading ratam at IV, 5, 21 was absent from all earlier printings and some manuscripts and is restored from several others. Column numbering, not the leaf numbering of the scan, is the citation grammar. The authenticity of De sacramentis as Ambrose's own preaching was long disputed and the Maurist apparatus printed here preserves that dispute; twentieth-century scholarship generally reversed the earlier doubt, and this record takes no position beyond what the inspected pages show."
