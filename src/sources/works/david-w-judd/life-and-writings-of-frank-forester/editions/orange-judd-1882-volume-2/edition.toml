notes = "The second volume, registered because volume 1 -- already on this work at edition.david-w-judd.life-and-writings-of-frank-forester.orange-judd-1882-volume-1 -- does not carry the sentence the retrieving lane needed, and because this volume's digitisation is a different and cleaner one. Volume 1 is held only in a Google scan whose front matter is inside the bytes, so it is recorded and not retained; this volume is held in Internet Archive item life-and-writings-of-frank-forester-v-2-1882, which carries no Google matter at all and is retained whole."
