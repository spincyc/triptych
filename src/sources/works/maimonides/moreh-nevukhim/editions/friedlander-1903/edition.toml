notes = "Friedlander's English translation is in the public domain and is the version most widely retranscribed online. It is made from the Judaeo-Arabic with reference to the Hebrew and its scriptural references occasionally misnumber a verse; the reference at Part II chapter 46 to Genesis 15 verse 6 is to verse 5. Keep it distinct from Pines' 1963 translation, which is under copyright and was not consulted. Catalog-level record created 2026-07-26. No exact artifact has been registered; publications consulting a digital delivery of this edition record their own access route and limits locally."
