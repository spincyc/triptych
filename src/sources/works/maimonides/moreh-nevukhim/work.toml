description = "Maimonides' Guide of the Perplexed, written in Judaeo-Arabic in the late twelfth century and translated into Hebrew in his lifetime. Part II chapters 32 to 48 treat prophecy; chapter 46 argues that when Scripture introduces an account as a vision, everything narrated within it belongs to the vision, including movement from place to place. A locus is part.chapter."
