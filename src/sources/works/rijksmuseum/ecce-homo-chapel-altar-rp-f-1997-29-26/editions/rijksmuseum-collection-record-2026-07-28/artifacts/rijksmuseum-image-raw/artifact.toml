notes = "Visually inspected in full on 2026-07-28. The photograph shows a frontal altar reached by several steps and enclosed by a low rail, with a central frontal and lace, multiple candlesticks or branching candelabra, flanking kneeling angels, a devotional figure and niche above, hanging lamps, and a stone architectural setting. The hanging lamps obscure parts of the altar, and the devotional niche, unusually numerous lights, pilgrimage-chapel setting, nineteenth-century date, and lack of a clearly visible altar crucifix make it atypical. Use only as one bounded composition exemplar; do not infer a standard 1962 high-altar arrangement, required object count, reservation arrangement, architectural norm, or universal proportions."
