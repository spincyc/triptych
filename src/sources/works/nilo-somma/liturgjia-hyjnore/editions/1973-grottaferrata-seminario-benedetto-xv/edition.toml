notes = "Original PDF pp. 1–3 directly inspected as images: the cover identifies music by Nilo Somma and the Pontifical Seminary Benedetto XV at Grottaferrata, 4 December 1973. The preface repeats the date and describes a musical experiment following approval of a first common Albanian Chrysostom translation; that translation's exact printing, approval instrument and Greek exemplar are unnamed. Its hope of future singing by seminarians and Lungro/Piana faithful is not an actual-use attestation. P. 3 shows notated music. No complete musical/source-language collation, earlier-book identity, dated local adoption, substantive recension or history edge is established."
