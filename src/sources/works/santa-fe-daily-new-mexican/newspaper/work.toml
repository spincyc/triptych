description = "A daily newspaper published at Santa Fe, New Mexico, digitised for the Library of Congress's Chronicling America under Library of Congress control number sn84020631. One 1890 issue is registered here, for an editorial that reprints Galatians 6:9 with a cash prize in place of the harvest. A locus is issue date, page and column."
