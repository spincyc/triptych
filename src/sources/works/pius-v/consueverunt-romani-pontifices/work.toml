description = "The bull of 17 September 1569 in which Pius V described the Rosary or Psalter of the Blessed Virgin Mary — one hundred and fifty angelic salutations with the Lord's Prayer at each decade and meditations on the whole life of Christ — attributed its propagation to St. Dominic, and confirmed indults and indulgences for those who pray it. The Latin original is printed in the Magnum Bullarium Romanum. The bull has no numbered-paragraph locus system; consumers record the passage cited."
