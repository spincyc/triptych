notes = "A dated delivery state of an English translation of the bull's opening and descriptive sections. The witness is partial: the concluding grant of indults and indulgences is summarized in an editorial bracket rather than translated, the translator is unnamed, and the text contains one visible corruption ('spread by the ??? Friars'). Rights of the modern translation are unresolved, so consumers quote it only in short attributed clauses within ordinary scholarly limits; the sixteenth-century Latin original is public domain."
