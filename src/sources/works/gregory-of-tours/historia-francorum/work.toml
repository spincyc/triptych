description = "Gregory of Tours' history in ten books, cited by book and chapter (e.g. X.31, the catalogue of the bishops of Tours). Registered first for X.31, where Gregory records the fasts and vigils instituted by bishop Perpetuus of Tours, including a thrice-weekly fast from the deposition of St Martin to Christmas. Book X chapter 31's authenticity was once questioned (Arndt's MGH preface, p. 19, reports Cointius and Kries) and its manuscript tradition is narrow; the editions record readings differently, and each edition's own record and passages carry what it prints."
