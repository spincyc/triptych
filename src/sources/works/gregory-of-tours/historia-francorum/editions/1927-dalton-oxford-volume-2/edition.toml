notes = "Identified from the page images of Internet Archive item historyoffranks0002greg (Albion College Library copy, scanned at station12.cebu.archive.org), read on 2026-11-18. The title page (PDF p. 7) reads: THE HISTORY OF THE FRANKS / By GREGORY OF TOURS / Translated with an Introduction by O. M. DALTON, M.A., F.B.A., F.S.A. / Keeper of the Department of British and Medieval Antiquities in the British Museum / Volume II / TEXT / OXFORD / AT THE CLARENDON PRESS / 1927. Volume II carries the translation of all ten books; volume I (IA historyoffranks0001greg, not registered) carries Dalton's introduction. Book X chapter 31 is on printed pp. 471-473 (PDF pp. 483-485). The only public-domain English of the X.31 fast list known to this lane: Brehaut's 1916 selection (IA historyoffranks00greguoft) omits it (R1 negatives 8). Aliases searched on 2026-11-18 before registration, by lane A3 of the Advent primer acquisition, over the Internet Archive advanced-search API: title:(scriptores rerum merovingicarum) 0 hits; title:(gregorii turonensis opera) 0; title:(historia francorum) AND creator:(arndt OR krusch) 0; title:(monumenta germaniae historica) AND title:(merovingicarum) 8 (monumentagerman01hann-07hann, bub_gb_GBhoAAAAMAAJ); full-text scriptorum rerum merovingicarum 14; title:(Gregorii episcopi Turonensis) 6 (sanctigeorgiiflo02greg siblings bub_gb_X80M9FfyJSEC, bub_gb_8pTMM6BnD94C, bub_gb_8JsUAAAAQAAJ, all Guadet-Taranne Google scans). The library held no Gregory of Tours record under any slug (searched src/sources/works for gregory-of-tours, gregorius turonensis, historia francorum, history of the franks)."
