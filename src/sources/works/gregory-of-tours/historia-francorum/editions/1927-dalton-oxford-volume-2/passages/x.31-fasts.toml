context = "Book X chapter 31: the list of Perpetuus's fasts, under the italic heading Fasts., printed p. 472 (PDF p. 484), with Dalton's footnotes 1-3 dating the Nativity of St John, the burial of St Martin and the Nativity of St Hilary. The list of Vigils follows on the same page."
