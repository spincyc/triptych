text = "Fasts. After Pentecost, the fourth and sixth days of the week to the Nativity of Saint John. From the first of September to the first of October, two fasts each week. From the first of October to the burial of our lord Martin, two fasts each week. From the burial of our lord Martin to the Nativity of our Lord, three fasts each week. From the Nativity of the holy Hilary to the middle of February, two fasts each week. 14th June. 11th November. 13th January."
