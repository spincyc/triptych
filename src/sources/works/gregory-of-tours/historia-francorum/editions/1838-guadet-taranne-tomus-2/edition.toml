notes = "Identified from the page image of the title page (PDF p. 7) of Internet Archive item sanctigeorgiiflo02greg (Princeton Theological Seminary Library copy), read on 2026-11-18: SANCTI GEORGII FLORENTII GREGORII, EPISCOPI TURONENSIS, HISTORIAE ECCLESIASTICAE FRANCORUM LIBRI DECEM, EX DUOBUS CODD. MSS. NUNC PRIMUM, CURA LEGLAY ET TEULET, COLLATIS ... J. GUADET ET N. R. TARANNE. TOMUS SECUNDUS. PARISIIS, APUD JULIUM RENOUARD ET SOC., VIA DICTA DE TOURNON, No 6. 1838. The item's metadata says 1836; the title page governs. Books VII-X; X.31 on printed pp. 273-275 (PDF pp. 281-283). Registered beside the critical MGH edition for its footnote on the X.31 fast list. Arndt's codex list in his MGH preface, read in the OCR layer only, identifies Guadet-Taranne's 'Regius B' with Paris lat. 9765 (C 3); which codex this volume's unqualified 'cod. Regius' at X.31 is was not established. Aliases searched on 2026-11-18 before registration, by lane A3 of the Advent primer acquisition, over the Internet Archive advanced-search API: title:(scriptores rerum merovingicarum) 0 hits; title:(gregorii turonensis opera) 0; title:(historia francorum) AND creator:(arndt OR krusch) 0; title:(monumenta germaniae historica) AND title:(merovingicarum) 8 (monumentagerman01hann-07hann, bub_gb_GBhoAAAAMAAJ); full-text scriptorum rerum merovingicarum 14; title:(Gregorii episcopi Turonensis) 6 (sanctigeorgiiflo02greg siblings bub_gb_X80M9FfyJSEC, bub_gb_8pTMM6BnD94C, bub_gb_8JsUAAAAQAAJ, all Guadet-Taranne Google scans). The library held no Gregory of Tours record under any slug (searched src/sources/works for gregory-of-tours, gregorius turonensis, historia francorum, history of the franks)."
