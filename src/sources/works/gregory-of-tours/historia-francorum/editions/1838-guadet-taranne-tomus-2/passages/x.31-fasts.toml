context = "Book X chapter 31 (section 6 of this edition's numbering): Perpetuus's institution of the fasts and the list DE JEJUNIIS, printed p. 274 (PDF p. 282), with footnote (1) attached to the line 'A (1) depositione domni Martini usque natale Domini'."
physical_line_ranges = [[1, 8]]
text = "Hic instituit jejunia, vigiliasque, qualiter per circulum anni observarentur, quod hodieque apud nos tenetur scriptum, quorum ordo hic est. DE JEJUNIIS. Post Quinquagesimam, quarta et sexta feria usque natale sancti Johannis. De calendis septembris usque calendas octobris, bina in septimana jejunia. De calendis octobris usque depositionem domni Martini, bina in septimana jejunia. A (1) depositione domni Martini usque natale Domini, terna in septimana jejunia. De natali sancti Hilarii usque medium februarium, bina in septimana jejunia. (1) Iste articulus non habetur in cod. Regio."
