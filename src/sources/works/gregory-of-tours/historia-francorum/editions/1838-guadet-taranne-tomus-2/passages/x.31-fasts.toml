notes = "Read on the page image. The footnote marker (1) stands after 'A' at the head of the Martinmas-to-Christmas line, so this edition reports that its 'cod. Regius' lacks that line. Arndt's MGH apparatus (1884, p. 445) instead reports that codex p (Paris 10848) lacks the preceding October-to-Martinmas line and gives no omission of the Martinmas line. R1's dossier read the G-T footnote correctly but did not have the MGH evidence. OCR differences: the text layer reads 'vigibasque', 'quabter', 'tenetiir', 'depositiohe', 'natab'."
