notes = "The critical edition. Identified from the page images of Internet Archive item monumentagerman01hann (PIMS - University of Toronto copy), read on 2026-11-18: the part title (PDF p. 13) reads GREGORII TVRONENSIS OPERA / EDIDERVNT / W. ARNDT ET BR. KRVSCH. / PARS I. / HISTORIA FRANCORVM. / INSUNT IV TABULAE. / HANNOVERAE / IMPENSIS BIBLIOPOLII HAHNIANI / MDCCCLXXXIIII.; the tome title (PDF p. 8) is Scriptores rerum Merovingicarum tomus I, MDCCCLXXXV. The Historia is Arndt's; pars II (Miracula and minor works, ed. Krusch, 1885) is bound in the same item and is not registered here. Book X chapter 31 is on printed pp. 444-445 (PDF pp. 468-469). Arndt's apparatus sigla used in X.31: A 1 (codex Casinensis), D 5 (Vaticanus), D 11 (Claromontanus), g (Gemblacensis), l (Leidensis), p (Parisiensis 10848, olim Suppl. lat. 1012, saec. X); see the preface pp. 19 and the codex list. Preferred over Guadet-Taranne (1838), which is registered beside it for its own footnote. Aliases searched on 2026-11-18 before registration, by lane A3 of the Advent primer acquisition, over the Internet Archive advanced-search API: title:(scriptores rerum merovingicarum) 0 hits; title:(gregorii turonensis opera) 0; title:(historia francorum) AND creator:(arndt OR krusch) 0; title:(monumenta germaniae historica) AND title:(merovingicarum) 8 (monumentagerman01hann-07hann, bub_gb_GBhoAAAAMAAJ); full-text scriptorum rerum merovingicarum 14; title:(Gregorii episcopi Turonensis) 6 (sanctigeorgiiflo02greg siblings bub_gb_X80M9FfyJSEC, bub_gb_8pTMM6BnD94C, bub_gb_8JsUAAAAQAAJ, all Guadet-Taranne Google scans). The library held no Gregory of Tours record under any slug (searched src/sources/works for gregory-of-tours, gregorius turonensis, historia francorum, history of the franks)."
