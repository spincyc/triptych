notes = "Read on the page images at 300 dpi. Mark h stands on 'De' and on 'ieiunia' of the line 'De Kalendis Octobris usque depositionem domni Martini bina in septimana ieiunia', so codex p omits the October-to-Martinmas line, not the Martinmas-to-Christmas line. Marks i-p stand on the Martinmas-to-Christmas line: A 1 reads 'A' for 'De' and 'depositio', adds 'in'; D 5 reads 'vii' for 'domni' and 'tria' for 'terna'; p adds 'sancti' and spells 'septemana'. Contrast Guadet-Taranne 1838 p. 274, whose footnote (1) says the Martinmas-to-Christmas line ('A depositione domni Martini usque natale Domini') is not in its 'cod. Regio' (passage of that edition). The two editions report different omissions in different manuscripts; neither is harmonised here. Preface lines 31-34 between the transcribed sentences (the codices with the larger part of the chapter) are omitted."
