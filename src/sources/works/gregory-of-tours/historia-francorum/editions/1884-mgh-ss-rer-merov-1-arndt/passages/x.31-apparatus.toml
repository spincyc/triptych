context = "Arndt's apparatus to the X.31 fast list (p. 445, notes h-p) and his preface on the authority of X.31 (p. 19, ll. 23-37): the chapter was suspected by Cointius and rejected as interpolated by Kries; the best codices are truncated before it; it survives in A 1, D 9, D 11 and in p (Paris 10848), whose subscription shows it was copied from a complete codex."
physical_line_ranges = [[1, 14]]
text = "Cap. 31. A 1. D. g. l. p. De — ieiunia des. p. depositio A 1. vii D 5. A A 1. sancti add. p. in add. A 1; ad add. g. tria D 5. septemana p. Ultimum (X, 31) Historiae Francorum caput cum a Cointio suspectum iudicatum esset, Kries v. cl. ut interpolatum prorsus eicere voluit. Gravi casu evenit, ut optimis codicibus finis truncatus sit, quare caput ultimum in illis desideratur, quod codices B 1 et 2 habuisse ex indice libro X. praemisso intelligitur. Sunt etiam qui illud servaverint: Primus codex Casinensis, A 1, qui quamvis minoris aetatis sit quam alii, tamen inter bonos numerandus est, secundus Beccensis (D 9), tertius Claromontanus (D 11). E quibus unus (p = Parisiensis 10848) hanc subscriptionem fert: Explicit liber decimus sancti Gregorii Turonensis episcopi de gestis Francorum, qua ex codice integro illum exscriptum esse indicatur. Itaque huius capitis auctoritas libris scriptis satis confirmata est."
