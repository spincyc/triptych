context = "Book X chapter 31: Perpetuus, sixth bishop of Tours, and his list of fasts (De ieiuniis), printed pp. 444 ll. 25-30 and 445 ll. 1-9 (PDF pp. 468-469); the De vigiliis list follows at l. 10."
physical_line_ranges = [[1, 9]]
text = "Sextus ordinatur Perpetuus, de genere et ipse, ut aiunt, senatorio et propinquus decessoris sui, dives valde et per multas civitates habens possessiones. Hic, submota basilica, quam prius Bricius episcopus aedificaverat super sanctum Martinum, aedificavit aliam ampliorem miro opere, in cuius absida beatum corpus ipsius venerabilis sancti transtulit. Hic instituit ieiunia vigiliasque, qualiter per circulum anni observarentur, quod hodieque apud nos tenetur scriptum, quorum ordo hic est. De ieiuniis. Post quinquagesimam quarta, sexta feria usque ad natale sancti Iohannis. De Kalendis Septembris usque Kalendas Octobris bina in septimana ieiunia. De Kalendis Octobris usque depositionem domni Martini bina in septimana ieiunia. De depositione domni Martini usque natale Domini terna in septimana ieiunia. De natale sancti Hilarii usque medio Februario bina in septimana ieiunia."
