notes = "Read on the page images at 300 dpi. Superscript apparatus marks (e, f, g, h on p. 444; a-w on p. 445) are omitted from the transcription; the readings that bear on the Martinmas lines are the separate passage x.31-apparatus. The list is set in italic in this edition. OCR differences: the text layer reads 'ieiunias' (the apparatus mark g read as s), 'subraota', 'sanctura Martinura', 'quorura', and garbles the italic list throughout. Guadet-Taranne (1838) prints 'A depositione', with A 1, for this edition's 'De depositione'."
