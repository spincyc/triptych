description = "The report on the historical evidence for the Guadalupe apparition tradition written in October 1883 by the historian and bibliographer Joaquín García Icazbalceta at the express and repeated command of Pelagio Antonio Labastida y Dávalos, Archbishop of Mexico, and first printed in 1896. It states the argument from silence in its classical form, adduces the Información de 1556 for the first time in print, and concludes against the historical reality of the apparition. The text is divided into numbered paragraphs, the locus system used here."
