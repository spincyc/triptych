context = "Office des lectures of 12 December 2026 in AELF zone romain: the day is the Saturday of the Second Week of Advent (jour_liturgique_nom: de la férie), with Bienheureuse Vierge Marie de Guadaloupé shown as an optional memorial (ligne3: Mémoire facultative; secondary colour white). The Office served is the Advent weekday's: first reading Isaiah 29:1-8; second reading a sermon of Isaac of Stella for the Assumption (heading Marie et l'Église), the same reading AELF serves on Saturday 16 December 2023, Saturday of the Second Week; the te_deum field is empty. The document carries no proper second reading for Our Lady of Guadalupe. The French wording is AELF's and is not reproduced here."
notes = "Bounded negative: in the lane-3 scratch documents of 12 December 2022, 2023, 2024 and 2025 (fetched 2026-11-26), AELF likewise names Guadalupe as an optional memorial and serves the Advent weekday's second reading (William of Saint-Thierry, Vatican II, Peter Chrysologus, Irenaeus respectively); in 2021 12 December is the Third Sunday of Advent. AELF follows the general calendar, where Guadalupe is an optional memorial; it is not a witness to the Office of the feast in the dioceses of the United States. No U.S. proper Office witness was found: the Universalis U.S. page for 2026-12-12 answered HTTP 404 on 2026-11-26, its site serving only a one-week window without purchase."
