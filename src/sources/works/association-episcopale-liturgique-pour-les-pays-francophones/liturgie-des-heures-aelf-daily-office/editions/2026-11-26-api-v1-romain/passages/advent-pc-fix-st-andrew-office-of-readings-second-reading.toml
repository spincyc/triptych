context = "Office des lectures of the feast of St Andrew, Apostle (informations: S. André, Apôtre; Fête; red). First reading: 1 Corinthians 1:18-31; 2:1-5. Second reading titled HOMÉLIE DE S. JEAN CHRYSOSTOME SUR L'ÉVANGILE DE JEAN, under the heading Nous avons trouvé le Messie (We have found the Messiah); it begins with Andrew, after staying with Jesus and learning much, not keeping the treasure to himself but hurrying to his brother to share it, and ends with Andrew bringing his brother to the very source of light in haste and joy. The service names no homily number or Patrologia locus. In sense its opening is Homily XIX on John, section 1, as NPNF1 vol. 14 (New York 1889) prints it in English (registered: passage advent-pc-l5-chrysostom-in-io-hom-19.1, Andrew, after having tarried with Jesus), and its close corresponds to the end of that section (drawing him to the very fount of light with so much zeal and joy), read in lane 5's scratch text layer of the same volume, p. 67, not on the image. The te_deum field is filled (the Te Deum is said). The French wording is AELF's and is not reproduced here."
notes = "Bounded: AELF zone romain serves the same Chrysostom reading (identical texte_patristique bytes) on 30 November in 2021, 2022, 2023, 2024 and 2026 (lane-3 scratch documents, fetched 2026-11-26); on 30 November 2025, the First Sunday of Advent, it serves the Sunday's Office (Cyril of Jerusalem) and not St Andrew's. The homily number rests on the correspondence of sense with NPNF1 14, not on a statement of the service; the Latin Liturgia Horarum and the U.S. Liturgy of the Hours were not consulted."
