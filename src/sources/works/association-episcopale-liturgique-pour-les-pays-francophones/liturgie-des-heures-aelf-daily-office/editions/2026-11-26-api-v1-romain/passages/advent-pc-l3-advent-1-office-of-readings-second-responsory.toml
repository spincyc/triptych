context = "Office des lectures of the First Sunday of Advent (informations: 1er Dimanche de l'Avent, semaine I du Psautier; annee B). The second reading is titled CATÉCHÈSE PRÉBAPTISMALE DE SAINT CYRILLE DE JÉRUSALEM, headed Les deux avènements du Christ, and runs from the two advents (Catechesis 15.1) through Titus 2:11-13 and the coming from heaven at the end of the world (15.3). The responsory that follows it (repons_patristique) has the shape of the old Matins responsory Aspiciens a longe: a respond, seeing from afar the power of God coming and the cloud covering the whole earth; the refrain marked R/, go out to meet him, for he comes to reign over his people; and three verses, from Psalm 48(49):2-3 (dwellers of the earth, rich and poor together), Psalm 79(80):2 (Shepherd of Israel, who sits upon the cherubim) and Psalm 23(24):7 (lift up your gates, the King of glory), before the respond is repeated. The te_deum field is filled (the Te Deum is said). The French wording is AELF's and is not reproduced here."
notes = "Compared with the Latin of Breviarium Romanum (Pustet 1888, pars hiemalis, p. 133-134) and the English of Bute (1908, Winter, p. 214) in the lane-3 checked transcriptions: the French has the same respond, refrain and three verses in the same order; the Latin and English carry a further clause, Nuntia nobis si tu es ipse (Tell us if Thou art He), that the French as served does not render as a separate member. The Latin Liturgia Horarum itself was not consulted."
