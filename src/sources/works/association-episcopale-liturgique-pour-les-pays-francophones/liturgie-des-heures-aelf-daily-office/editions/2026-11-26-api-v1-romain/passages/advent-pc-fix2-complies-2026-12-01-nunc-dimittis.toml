context = "Night Prayer (Complies) of Tuesday of the First Week of Advent, 1 December 2026, as AELF serves it, in this order: introduction (O God, come to my aid), hymn, one psalm with antiphon (Ps 142(143)), short reading (1 Peter 5:8-9a), the responsory Into your hands, Lord, I commend my spirit, the antiphon and Gospel canticle titled Cantique de Syméon (reference Lc 2, beginning at verse 29: the Nunc dimittis), concluding prayer, blessing, and a Marian antiphon (hymne_mariale) titled and given in Latin: Alma Redemptoris Mater. A witness for one Advent day that the Nunc dimittis is the Gospel canticle of Compline and that AELF appoints the Alma Redemptoris Mater as the Marian antiphon after Compline on that Advent day. The French wording is AELF's and is not reproduced here."
notes = "advent-pc-fix2. One date only. AELF follows the French book; whether the U.S. Liturgy of the Hours prints the same Marian antiphon was not checked."
