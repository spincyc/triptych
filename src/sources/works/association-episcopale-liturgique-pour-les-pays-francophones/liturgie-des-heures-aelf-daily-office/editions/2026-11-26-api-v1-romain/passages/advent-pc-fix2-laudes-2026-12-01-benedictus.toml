context = "Morning Prayer (Laudes) of Tuesday of the First Week of Advent, 1 December 2026, as AELF serves it, in this order: introduction (Lord, open my lips), invitatory antiphon and Psalm 94(95), hymn, three psalms with antiphons (Ps 23(24), the canticle of Tobit 13, Ps 32(33)), short reading (Genesis 49:10), responsory, the antiphon and Gospel canticle titled Cantique de Zacharie (reference Lc 1, beginning at verse 68: the Benedictus), intercessions, the Lord's Prayer, concluding prayer. A witness for one Advent day that the Benedictus is the Gospel canticle of Lauds; the rule that it is so every day is GILH n. 50 (passage advent-pc-fix2-gilh-50). The French wording is AELF's and is not reproduced here."
notes = "advent-pc-fix2. One date only; the general rule is not inferred from it."
