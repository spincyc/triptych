context = "Letter CCCLXVII (printed numeral OCR CCCLXVI; at LF68868), addressed to the knight Filippo Volponi of Montefano, patrician of Osimo (LF68886–68888; protocol LF68891; salutation LF68894–68895), creates him and his legitimate descendants counts, and ends with its own 19 August 1834 closing at LF68960–68963, before numeral CCCLXVIII (OCR CCCLXVIH.) at LF68966. Issuer evidence is GREGORIUS PP. XVI. at LF68891–68891; the source closing at LF68960–68963 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima nona au- gusti millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. The OCR prints this numeral as CCCLXVI; (one I lost); it is sequenced between CCCLXVI (LF68776) and CCCLXVIII (LF68966). The foot-notes of CCCLXVI and of this letter and the page number 452 (OCR 7S)) intervene between the caption and the address and lie outside the extent. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
