notes = "The pope transfers administration of the Periclitantium establishment to the pontifical treasurer, while retaining the vicegerent’s disciplinary role; dispositive grant and Non obstantibus lead to a complete piscatorial closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF311–311; the source closing at LF482–485 reads: Datum Romae apud sanctum Petrum sub annulo- piscatoris die decima quinta ianuarii millesimo octingentesimo quadragesimo, pon- tificatus Nostri anno nono..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
