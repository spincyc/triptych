notes = "Complete confirmation/renewed erection of the collegiate church and chapter, named dignities, vesture grant, derogation and dating clause survive. The detached continuation of running title11399/11402 belongs to the page, not to this act’s subscription. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF11216–11216; the source closing at LF11347–11350 reads: Datum in Arce Gandulphi sub annulo pi- scatoris die septima augusti millesimo octin- gentesimo quadragesimo , pontificatus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
