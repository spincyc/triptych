notes = "Brief XXXVIII grants daily Mass and communion in the Osimo military prison chapel; LF7468 faci- → LF7474 mus across running title LF7471; complete 5 June 1835 closing. Own provenance LF7540 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF7444–7444; the source closing at LF7491–7494 reads: Datum Romae apud sanctum Petrum sub an- nulo piscatoris die quinta iunii millesimo octin- gentesimo trigesimo quinto, ponsitinatas Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
