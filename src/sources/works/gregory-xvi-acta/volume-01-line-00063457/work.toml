description = "Letter CCCXXXVI (protocol - GREGORIUS -PP. XVI. ad futuram rei memoriam LF63467–63468) motu proprio constitutes at Naples an ecclesiastical commission of three bishops (Salerno, Castellammare, Sant'Agata dei Goti and Acerra) to judge degradations of clerics refused by ordinaries, and ends with its own 27 May 1834 closing at LF63668, before numeral CCCXXXVII at LF63671. Issuer evidence is - GREGORIUS -PP. XVI. at LF63467–63467; the source closing at LF63665–63668 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima septima mail millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. LF63553 (1 Ex Bullario Romano.) is its own provenance note, excluded with page number 416. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
