context = "Apostolic letter CXCVII approves the priests’ Pious Union of the Immaculate Heart of Mary at San Lorenzo in Lucina, inserting its Italian rule (“quae italico sermone exarata, hisce literis inserenda mandavimus prout sequitur”, LF36603–36604; rule LF36607–36703) and granting indulgences and a privileged altar; intitulation, narrative, inserted rule, approval, indulgences, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF36560–36560; the source dating clause at LF36794–36797 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima februarii anno millesimo Octingentesimo quadragesimo tertio, pontifica- tus Nostri anno decimo tertio. The inserted Italian rule is part of the letter’s own wording by explicit insertion; it is not translated or separated. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF36661 “€ cooperare”; LF36673 ““Cuore”; LF36718 “ty”; LF36771 “+”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
