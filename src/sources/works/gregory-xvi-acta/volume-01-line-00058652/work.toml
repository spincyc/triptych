description = "Epistle CCCXI to the cathedral chapter of Chur (address LF58667, protocol LF58670, salutation as printed Venerabilis frater LF58673–58674) praises its defence of the rights of the Church after the death of Bishop Karl Rudolf and ends with its own 8 March 1834 closing at LF58714, before numeral CCCXII at LF58717. Issuer evidence is GREGORIUS PP. XVI. at LF58670–58670; the source closing at LF58711–58714 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die octava martii anno mil- lesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. The genre label is garbled (Pas. Ol A, LF58653). Its provenance note 1 (Roskovány, pag. 129) is printed at LF58729 inside CCCXII's caption block and is omitted there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
