notes = "Letter CCLVII to Bishop Antonio of Belluno and Feltre rejoices in the flourishing of the seminary of the Pope’s native Belluno and returns Christmas good wishes; address LF44673–44674, intitulation, greeting, body, blessing and dating clause (printed “Dutum”) survive. Issuer evidence: GREGORIUS PP. XVI. at LF44677–44677; the source dating clause at LF44744–44747 reads: Dutum Romae apud sanctum Petrum die de- cima ianuarii millesimo octingentesimo quadra- gesimo quarto, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
