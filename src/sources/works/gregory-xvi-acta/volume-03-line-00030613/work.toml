description = "Indult CLVIII grants the beneficiaries of the Alatri cathedral a fur-lined cappa in place of the mozzetta; decree, non obstantibus and dating clause survive. Its provenance note1 is LF30746. Issuer evidence: GREGORIUS PP. XVI. at LF30622–30622; the source dating clause at LF30698–30701 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima quarta iunii millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. A stray “4” OCR’d at the end of LF30696 (“cumque. 4”) remains literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
