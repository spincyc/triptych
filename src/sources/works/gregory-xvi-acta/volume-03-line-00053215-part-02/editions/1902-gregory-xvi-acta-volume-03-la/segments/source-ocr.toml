context = "Bull CCCIV confirms the election of Joseph Gazeno (Khazen), archbishop of Damascus, as Maronite patriarch of Antioch after the death of Joseph Peter Habaisci, transfers him, mandates suffragans, clergy, people and vassals, and prints the oath of fidelity and the profession of faith he is to make (LF53666–54016) as part of its text; address LF53478–53481, intitulation GREGORIUS EPISCOPUS LF53484, body, forms and incarnation-year dating clause survive. Issuer evidence: GREGORIUS EPISCOPUS at LF53484–53484; the source dating clause at LF54018–54021 reads: Datum Romae apud s. Petrum anno incar- nationis dominicae millesimo octingentesimo quadragesimo quinto, decimo quarto kalendas febr., pontificatus Nostri anno decimo quinto. The dating clause (LF54018–54021) prints “anno incarnationis dominicae millesimo octingentesimo quadragesimo quinto, decimo quarto kalendas febr., pontificatus Nostri anno decimo quinto”: read in common reckoning (as the edition places it, among January 1845 acts) 19 January 1845 would fall in the fourteenth pontifical year; only a Florentine-style incarnation year would yield 19 January 1846, which the edition does not adopt; its calendar year and pontifical year disagree under the edition’s own placement, so the normalized date is left unknown rather than inferred (the printed day is 19 January (decimo quarto kalendas februarii)). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
