description = "Motu proprio CCCXLIX ratifies the matrimonial dispensations granted by the ecclesiastical judge of the Sicilian Monarchia in the third and fourth degree touching a nearer degree and extends his faculty under Benedict XIII’s Fideli ac prudenti to that case; intitulation, ad perpetuam formula, narrative, decree, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF66385–66385; the source dating clause at LF66455–66458 reads: Datum Romae apud s. Petrum sub annulo piscatoris die tertia martii millesimo octingen- tesimo quadragesimo sexto, pontificatus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
