notes = "Apostolic letter CXXXIX condemns the Spanish government’s anti-church measures and proposed law, calls the universal Church to prayer and grants a plenary indulgence in the form of a jubilee; publication clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF28657–28657; the source dating clause at LF28907–28910 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda februar. mille- simo octingentesimo quadragesimo secundo , pontificatus Nostri anno decimo secundo. A stray vertical mark OCR’d at the end of LF28683 (“per- |”) remains literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
