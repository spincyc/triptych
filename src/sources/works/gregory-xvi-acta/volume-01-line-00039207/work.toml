description = "Epistle CCXXVIII to King Ludwig I of Bavaria (address LF39217–39218, protocol LF39221, salutation LF39224–39225) congratulates him on the marriage of his sister Maria Anna Leopoldine with Frederick Augustus of Saxony and ends with its own 3 June 1833 closing (OCR Datum Bonne for Romae) at LF39260–39265, immediately before numeral CCXXIX at LF39268. The frame does not continue an earlier act: the preceding letter closes at LF39201–39204 (21 May 1833) before this numeral. Issuer evidence is GREGORIUS PP. XVI. at LF39221–39221; the source closing at LF39260–39265 reads: Datum Bonne apud s. Petrum sub annulo” piscatoris die tertia iunii millesimo octingen- gentesimo trigesimo tertio, pontificatus Nostri anno tertio. Its own provenance note 1 (Ex Archivio Brevium ad Principes, LF39254) and the first half of the leaf-273 running title (- ANNO, LF39257) intervene between body LF39251 and the closing LF39260 and are excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
