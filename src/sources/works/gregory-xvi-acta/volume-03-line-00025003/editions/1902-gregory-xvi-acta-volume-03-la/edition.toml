notes = "Apostolic letter CXVI regulates the Lateran canonesses of the Naples monastery of Jesus and Mary (new constitutions under the nuncio, simple vows, episcopal enclosure, school); decree, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF25011–25011; the source dating clause at LF25188–25191 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima quarta septemb. millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
