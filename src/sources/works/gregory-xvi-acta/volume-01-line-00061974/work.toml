description = "Bull CCCXXXII, addressed to the archbishop of Sassari as metropolitan of Bisarchio (LF61986–61988), protocol GREGORIUS EPISCOPUS Servus servorum Dei (LF61991–61994) and salutation, mandates the re-erection of the suppressed parish of the Conception at Oschiri as a perpetual collative parish, half of its former revenues to be paid by the bishop, and its collation to Pietro Diana; it ends with its own dating clause tertio idus maii 1834 at LF62293, before numeral CCCXXXIII at LF62296. Issuer evidence is GREGORIUS EPISCOPUS Servus servorum Dei at LF61991–61994; the source closing at LF62290–62293 reads: Datum Romae apud sanctum Petrum anno incarnationis Dominicae millesimo octingente- simo trigesimo quarto, tertio idus maii, pon- tificatus ‘Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
