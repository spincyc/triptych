description = "Brief XLII names Bishop Joseph Kukovich apostolic visitor of the Bosnian Franciscan mission, suspends regular superiors’ authority and closes with the Castel Gandolfo dating clause. Issuer evidence: GREGORIUS PP. XVI. at LF12028–12028; the source dating clause at LF12086–12089 reads: Datum in Arce Gandulphi sub annulo pi- scatoris die vigesima octava augusti millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo. The witness abbreviates conventional formulae with “etc.” (“ad quos spectat etc.”, LF12085); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-03"]
