description = "Bull CLXII (printed under a garbled EPISTOLA label; address LF36734–36737 to Antonio Maria Traversi, archbishop of Nazianzus, elected patriarch; protocol GREGORIUS EPISCOPUS / Servus servorum Dei LF36740–36741) translates him to the titular patriarchate of Constantinople with retention of his Liberian canonry and benefices; LF36762 → LF36772 across own provenance LF36765, signature LF36766 and page number 250 LF36769; across running titles LF36836 and LF36904; dated nono kalendas martii 1838 = 21 February 1838. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS EPISCOPUS at LF36740–36741; the source closing at LF36935–36937 reads: Datum Romae apud sanctum Petrum anno millesimo octingentesimo trigesimo octavo, nono kalendas martii, pontificatus Nostri anno octavo: Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
