description = "Apostolic letter CXII divides the Siam vicariate into a western (Malay peninsula) and an eastern vicariate and assigns them to Bishops Courvezy and Pallegoix; dispositive clauses and dating clause survive. The dating clause begins at LF24634 (“Datum Romae apud s. Petrum sub annulo”) and continues after the page break at LF24647–24649. Issuer evidence: GREGORIUS PP. XVI. at LF24562–24562; the source dating clause at LF24647–24649 reads: piscatoris die decima septemb. millesimo octin- gentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. The witness abbreviates conventional formulae with “etc.” (“Haec volumus etc.”, LF24632); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-03"]
