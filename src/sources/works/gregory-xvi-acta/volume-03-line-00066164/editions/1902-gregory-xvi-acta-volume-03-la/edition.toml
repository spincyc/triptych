notes = "Apostolic letter CCCXLVII permits the archbishops of Bari, in memory of Urban II’s council of 1098, to have the epistle and gospel read in Latin and Greek at pontifical functions, as at Taranto and Nardò; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF66176–66176; the source dating clause at LF66242–66245 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima februarii millesimo octin- gentesimo quadragesimo sexto, pontificatus No- stri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
