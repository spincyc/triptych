notes = "Bull CCXXII provides José Maria da Silva Torres to the metropolitan see of Goa on the queen’s presentation; address, intitulation, greeting, arenga, provision, mandate and incarnation-year dating clause (decimo kalendas iunii = 23 May) survive. Issuer evidence: GREGORIUS EPISCOPUS at LF39804–39804; the source dating clause at LF39904–39907 reads: Datum Romae apud s. Petrum anno incar- nationis dominicae millesimo octingentesimo quadragesimo tertio, decimo kalendas iunii, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
