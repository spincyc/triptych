notes = "Letter CCCLXXXVII (protocol LF72541; salutation Dilecte fili LF72544–72545) creates David, nephew and chief minister of the Begum Sombre of Sardhana, a knight of the Order of Christ with the order's privileges and the form of his investiture, and ends with its own 27 November 1834 closing at LF72623–72626, before numeral CCCLXXXVIII at LF72629. Issuer evidence is GREGORIUS PP. XVI. at LF72541–72541; the source closing at LF72623–72626 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima septima novem- bris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
