notes = "This distinct Serena bull names Conquimbo and the new Serena see repeatedly and has its own protocol, operative grant and July kalends closing. It is not joined to the neighboring San Carlos bull by formula similarity. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS EPISCOPUS at LF9789–9789; the source closing at LF10137–10140 reads: Datum Romae apud sanctum. Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo, kalendis iulii, pontifica- tus Nostri anno decimo. :. The retained OCR names “s. Caroli” in the chapter-endowment clause at LF10020 within this Serena witness; the inconsistency is preserved without harmonization. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
