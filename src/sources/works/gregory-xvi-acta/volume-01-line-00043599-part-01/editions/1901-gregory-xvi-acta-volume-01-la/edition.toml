notes = "Letter CCLIII to Valentino Labella, patrician of Terni (address LF43610–43611, protocol LF43614), creates him and his male primogeniture counts and ends with its own 9 August 1833 closing at LF43694–43697, before numeral CCLIV at LF43700. Issuer evidence is GREGORIUS PP. XVI. at LF43614–43614; the source closing at LF43694–43697 reads: Datum Romae apud sanctam Mariam Maio- rem ,sub annulo piscatoris die nona augusti millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Its own provenance note 1 (Ex Bullario Romano, LF43749) is printed at the foot of leaf 302 inside CCLIV's text and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
