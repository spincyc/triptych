description = "Apostolic letter CCLXIII names Charles Pooten apostolic administrator of the archdiocese of Antivari, the archbishop Vincenzo Battucci being suspended; address LF45440–45441, intitulation, greeting, appointment, mandate, non obstantibus clause and dating clause survive. Its provenance note1 is LF45559 at the foot of leaf 331. Issuer evidence: GREGORIUS PP. XVI. at LF45444–45444; the source dating clause at LF45499–45502 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima tertia februarii mille- simo octingentesimo quadragesimo quarto, pon- tificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
