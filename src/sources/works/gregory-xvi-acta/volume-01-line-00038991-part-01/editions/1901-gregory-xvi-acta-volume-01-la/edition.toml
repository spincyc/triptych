notes = "Letter CCXXVI, addressed to the bishop of Arezzo (LF39001–39002), commissions him to permit Gaetano Fiaschi to use the side door he opened into his public rural chapel at La Striscia near Arezzo, without ecclesiastical immunity for the adjoining property, and ends with its own 21 May 1833 closing at LF39074, before numeral CCXXVII at LF39077. Issuer evidence is GREGORIUS PP. XVI. at LF39005–39005; the source closing at LF39071–39074 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima prima maii mil- lesimo octingentesimo trigesimo: tertio, ponti- ficatus Nostri anno tertio. Its provenance note 1 (1 Ex Bullario Romano,) is printed at LF39108 in CCXXVII's foot block and is excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
