notes = "Letter CXXXI, printed under the edition label EPISTOLA in consistorial-bull form (GREGORIUS EPISCOPUS servus servorum Dei), confirms Jacob Holas’s election, transfers him from Amasea to the Armenian patriarchate of Cilicia and prescribes his oath, whose formula (LF27696–27776) is part of the letter; incarnation-style dating clause survives. LF27621 (“menta.”), though short, is right-column text. Issuer evidence: GREGORIUS EPISCOPUS at LF27507–27507; the source dating clause at LF27778–27782 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadrigesimo secundo, quinto kalendas februarii, pontificatus Nostri anno decimo se- cundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
