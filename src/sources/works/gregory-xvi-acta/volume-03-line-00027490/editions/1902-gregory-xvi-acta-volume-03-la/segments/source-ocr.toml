context = "Letter CXXXI, printed under the edition label EPISTOLA in consistorial-bull form (GREGORIUS EPISCOPUS servus servorum Dei), confirms Jacob Holas’s election, transfers him from Amasea to the Armenian patriarchate of Cilicia and prescribes his oath, whose formula (LF27696–27776) is part of the letter; incarnation-style dating clause survives. LF27621 (“menta.”), though short, is right-column text. Issuer evidence: GREGORIUS EPISCOPUS at LF27507–27507; the source dating clause at LF27778–27782 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadrigesimo secundo, quinto kalendas februarii, pontificatus Nostri anno decimo se- cundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete selected extent and at least twenty literal-LF lines of context on each side were read in this lane’s exhaustive in-order read of LF23800–32620 (claim LF23846–32521). Every nonblank LF line of the span maps 1:1 to a native XML LINE (zero token mismatches; line-geometry.json), and leaf/column/back-jump, indent, intra-line gap and short-line geometry screens were dispositioned; no general image collation is claimed. Selected bounds [[27501, 27515], [27527, 27588], [27597, 27658], [27667, 27727], [27733, 27782]]."
