context = "Apostolic letter CCCLVI detaches the regions of middle and lower Tibet from the Tibet-Hindustan vicariate and erects them into a vicariate apostolic named from Lhasa, entrusted to the Paris Foreign Missions; intitulation, ad perpetuam formula, narrative, motu proprio erection, decernentes clause, abbreviated non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF66995–66995; the source dating clause at LF67066–67069 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima septima martii millesimo octingentesimo quadragesimo sexto, pontificatus Nostri anno decimo sexto. The witness abbreviates conventional formulae with “etc.” (“Non obstantibus etc.”, LF67064); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
