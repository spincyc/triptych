notes = "Letter CCCLXX (protocol LF69273–69276) grants the dignitaries and canons of Foligno cathedral the use of the bugia, the canon book and, in solemn rites, the white mitre within the diocese, ending with its own 22 August 1834 closing at LF69411–69414, before numeral CCCLXXI at LF69417. Issuer evidence is GREGORIUS PP. XVI. at LF69273–69273; the source closing at LF69411–69414 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima secunda augusti millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. At LF69328 the OCR reads et bro, where the native WORD box (x752–864) covers the printed libro,; it is retained literally as misread OCR, no word is missing or displaced. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
