description = "Letter CCCXXX (protocol GREGORIUS PP. XVI. ad futuram rei memoriam LF61152–61153) grants the chapter of Carpi cathedral anticipated matins, confessors in choir, absences on the patron's business, quorum and master-of-ceremonies faculties, and ends with its own 16 May 1834 closing at LF61400, before the running title LF61403 and numeral CCCXXXI at LF61406. Issuer evidence is GREGORIUS PP. XVI. at LF61152–61152; the source closing at LF61397–61400 reads: Datum Romae apud sanctum Petrum sub an- nulo piscatoris die decima sexta maii millesimo octingentesimo trigesimo aaa’? pontificatus Nostri anno: quarto. The year word of the dating clause is garbled in the OCR (aaa’?) and retained literally. LF61265 (1 Ex Bullario Romano.) is its own provenance note, excluded with page number 400. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
