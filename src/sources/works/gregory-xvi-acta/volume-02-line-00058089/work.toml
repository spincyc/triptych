description = "Allocution CCLXVIII asks for the votes on the canonization of b. Pacificus of San Severino and defers the decision to prayer; LF58108 → LF58117 across the two-line running title LF58111–58114; ends LF58159 before CCLXIX LF58162. Own provenance LF58186 excluded. Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORII PP. VES at LF58111–58114; the source closing at LF58153–58159 reads: Magno Nobis est gaudio, quae suffragiis ve- stris animorum consensio declaratur, de canoni- zatione beati Pacifici a S. Severino. Antequam tamen ad rem tantae magnitudinis et gravitatis perficiendam deveniamus, summo adhuc studio ad Deum fundendae sunt preces, ut lumen suum Nobis benignus impertiat. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
