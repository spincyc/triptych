description = "Allocution CXXXIII recounts the origin of the Cilician patriarchate and the election of Jacob Holas, and confirms it; it runs from “Venerabiles fratres,” LF27946 to the closing invocation LF28045–28046. Its provenance note1 is LF28068. Issuer evidence: ACTA GREGORII PP. XVI. at LF27997–27997; the source dating clause at LF27940–27943 reads: HABITA IN CONSISTORIO SECRETO DIE VIGESIMA SEPTIMA IANUAR. MILLESIMO OCTINGENTESIMO QUADRAGESIMO SECUNDO. The allocution has no dating clause; its date is taken from the excluded edition caption. The crosses of the closing invocation are OCR’d “}¥”, “>”, “-%” (LF28045) and remain literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
