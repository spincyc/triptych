notes = "Letter CCXX, addressed to the brothers Camillo and Gaetano Pizzardi of Bologna (LF38235–38236), executes Pius VII's intention by creating them and their primogenitary descendants marquises, and ends with its own 26 April 1833 closing at LF38314, before numeral CCXXI at LF38317. Issuer evidence is GREGORIUS PP. XVI. at LF38239–38239; the source closing at LF38311–38314 reads: _ Datum Romae apud s. Petrum sub annulo piscatoris die vigesima sexta aprilis millesimo octingentesimo trigesimo tertio, pontificatus No- stri anno tertio. LF38276 is a top-edge speck before the running title LF38279. Its provenance note 1 (Ex Bullario Romano.) is printed at LF38350 in CCXXI's foot block and is excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
