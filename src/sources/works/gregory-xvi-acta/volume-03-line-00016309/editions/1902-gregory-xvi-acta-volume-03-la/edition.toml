notes = "Apostolic letter LXXV detaches the Zeeland parishes from Ghent and joins them to the Breda vicariate, naming Antonucci executor; dispositive clauses, derogations, Nulli ergo and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF16319–16319; the source dating clause at LF16462–16465 reads: Datum Romae apud s. Petrum sub annulo piscatoris die nona mart. millesimo octingen- tesimo quadragesimo primo, pontificatus No- stri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
