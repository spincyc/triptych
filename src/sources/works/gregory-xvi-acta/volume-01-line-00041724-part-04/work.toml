description = "Letter CCXLIV (protocol LF42084–42085) takes the Benedictine nuns of Our Lady of Good Hope at Cannington under immediate papal protection, suspends other jurisdiction and appoints Cardinal Thomas Weld protector and vicar, ending with its own 16 July 1833 closing at LF42212–42215, before numeral CCXLV at LF42218. Issuer evidence is GREGORIUS PP. XVI. at LF42084–42084; the source closing at LF42212–42215 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima sexta iulii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
