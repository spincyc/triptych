notes = "Apostolic letter CCCL divides the vicariate of Western Tonkin, erecting the provinces of Nghệ An and Hà Tĩnh with Bố Chính as a separate southern vicariate; intitulation, ad perpetuam formula, narrative, motu proprio division, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF66574. Issuer evidence: GREGORIUS PP. XVI. at LF66469–66469; the source dating clause at LF66536–66539 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima septima martii millesimo octingentesimo quadragesimo sexto, pontifi- catus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
