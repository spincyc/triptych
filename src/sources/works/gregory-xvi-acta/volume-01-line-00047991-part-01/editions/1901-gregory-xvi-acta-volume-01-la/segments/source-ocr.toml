context = "Letter CCLXXVII (protocol LF47999–48002) commits to the bishop of Rimini faculties for daily Mass, sacraments and benediction in the oratory of his new episcopal college, and ends with its own 12 November 1833 closing at LF48070–48073, before numeral CCLXXVIII at LF48076. Issuer evidence is GREGORIUS PP. XVI. at LF47999–47999; the source closing at LF48070–48073 reads: Datum Romaeapud s. Petrum sub annulo piscatoris die decima secunda novembris mil- lesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. LF48040 3413 is the garbled page number 313. Its own provenance note 1 (Ex Bullario Romano., LF48110) is printed at the foot of leaf 331 inside CCLXXVIII's text and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[47999, 48039], [48041, 48073]] selected from address/protocol LF47999 through the source closing LF48073. Read in full in acquired LF order within the lane read LF39127-48386 (claim LF39207-48307 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry was checked for the selected extent (column, back-jump, left/right-gap, intra-line and vertical-gap screens); no general image collation is claimed."
