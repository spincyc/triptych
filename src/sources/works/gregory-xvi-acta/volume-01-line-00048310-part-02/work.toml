description = "Letter CCLXXXI (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF48409–48410, no separate address) grants Prince Francesco Borghese and his first-born descendants the title of barons and princes of Nettuno, excepting feudal rights abolished by recent laws, and ends with its own 22 November 1833 closing at LF48550, before numeral CCLXXXII at LF48553. Issuer evidence is GREGORIUS PP. XVI. at LF48409–48409; the source closing at LF48547–48550 reads: Datum Romae apud sarictum Petrum sub annulo piscatoris die vigesima secunda novem- bris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. LF48529 (1 Ex Builario Romano.) is its own provenance note inside the excluded block LF48529–48535 with a speck and the running title of page 317. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
