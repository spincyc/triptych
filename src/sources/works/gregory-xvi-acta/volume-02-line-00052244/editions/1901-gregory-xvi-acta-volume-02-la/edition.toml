notes = "Letter CCXLI (printed EPISTOLA; address LF52253–52254) urges Bishop Nicholas Foran of Waterford and Lismore to reconcile his secular clergy with the Observant Franciscans; LF52265 → LF52271 across running title LF52268; LF52337 → LF52346 across own provenance LF52340 and running title LF52343; LF52329 begins with a literal |; complete 19 August 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF52257–52257; the source closing at LF52380–52383 reads: Datum Romae apud sanctam Mariam Maio- rem die decima nona augusti millesimo octin- gentesimo trigesimo nono, pontificatus Nostri anno nono, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
