notes = "Letter CXLV to Leopold I announces that the internuncio Raffaele Fornari, made archbishop of Nicaea, is now nuncio; address, intitulation, body and dating clause survive. Its provenance note1 is LF29488. Issuer evidence: GREGORIUS PP. XVI. at LF29430–29430; the source dating clause at LF29482–29485 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava mart. millesimo Octingentesimo quadragesimo secundo, ponti- ficatus Nostri anno decimo secundo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
