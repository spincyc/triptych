notes = "Letter CXXI (address LF27223–27225 to the Augustinians of Calcutta; protocol LF27228) urges them to obey the vicar apostolic of Bengal and to abandon the schismatic Meliapor administrator; across page number 184 LF27268, CXXII’s provenance LF27334 and running title LF27337; complete 4 January 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF27228–27228; the source closing at LF27388–27391 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quarta ianuarii millesimo octin- gentesimo trigesimo septimo, pontificatus No- stri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
