notes = "Allocution XIX: Venerabiles fratres LF3532 through the creation formula and In nomine Patris … Amen LF3775–3776, before brief XX LF3779. LF3558 → LF3570 across provenance LF3561, mark LF3564 and page number LF3567; LF3637 → LF3643 across running title LF3640; LF3716 Ia- → LF3722 nuensem across running title part ANNO LF3719. Dated by its caption LF3527–3529 (6 April 1835). Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORIL PP. XVI. at LF3640–3640; the source closing at LF3527–3529 reads: MABITA IN CONSISTORIO SECRETO DIE SEXTA APRILIS ANNI MILLESIME OCTINGENTESIMI TRIGESIML QUINTI. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
