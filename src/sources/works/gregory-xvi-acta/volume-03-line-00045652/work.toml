description = "Indult CCLXV (numeral OCR’d “CCL,”) grants the canons of the collegiate church of the Guardian Angel at Anagni the black sash and hat tassel; intitulation, narrative, grant, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF45661–45661; the source dating clause at LF45709–45712 reads: Datum Romae apud sanctum Petrum snb annulo piscatoris die vigesima septima februarii anno millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
