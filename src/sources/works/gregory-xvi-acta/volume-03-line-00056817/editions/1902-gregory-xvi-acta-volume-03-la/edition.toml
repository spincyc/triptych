notes = "Letter CCCXXVII asks Bishop Claudius Hippolytus of Chartres to persuade Petrus Dominicus, archbishop of Chalcedon and superior of the congregation of the Sacred Hearts, to withdraw his pressure on the sisters to accept changes in their constitutions; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF56835–56835; the source dating clause at LF56919–56922 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima sexta iulii millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
