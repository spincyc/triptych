title = "Exponendum Nobis curavit dilectus filius Iosephus Peroni — Confirmatio decreti cardinalis Rivarola de coenobio Conventualium Vetrallae — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1901."
