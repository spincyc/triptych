context = "Letter CCCLXXXI (protocol 5 em GREGORIUS PP. XVI. ad perpetuam rei memoriam LF71357–71360, specks retained literally) recites the history of the Conventual friary of Vetralla, inserts the Italian decree of Cardinal Giuseppe Albani, apostolic visitor, of 21 September 1815 with its subscription and registration note (LF71414–71546) and the Latin decree of Cardinal Agostino Rivarola of 15 July 1834 with his subscription (LF71607–71640), confirms the latter, and ends with its own 23 September 1834 closing at LF71699–71704, before numeral CCCLXXXII at LF71707. Issuer evidence is 5 em GREGORIUS PP. XVI. at LF71357–71357; the source closing at LF71699–71704 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima tertia septembris millesimo* octingentesimo trigesimo » quarto, pontificatus Nostri anno quarto. Multilingual extent: the Latin act retains the inserted Italian decree of Cardinal Albani (with the registration note Reg. a Roma ... C. Vagnolini preposto) and the inserted Latin decree of Cardinal Rivarola in printed order; they are quoted documents of this letter, not separate units. At LF71650 the OCR reads SNe ecclesiasticis for the printed aliisque ecclesiasticis; retained literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[71357, 71374], [71382, 71460], [71463, 71538], [71540, 71610], [71612, 71681], [71689, 71704]] selected from address/protocol LF71357 through the source closing LF71704. Read in full in acquired LF order within the lane read LF64380-74480 (claim LF64569-74417 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry was checked for the selected extent (column, back-jump, left/right-gap, intra-line and vertical-gap screens); no general image collation is claimed."
