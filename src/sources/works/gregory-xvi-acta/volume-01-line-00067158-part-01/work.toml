description = "Letter CCCLVIII (protocol LF67170–67173) raises the confraternity of the Holy Trinity and the Dead at Pescopennataro (diocese of Trivento) to an archconfraternity with faculty to aggregate, ending with its own 15 July 1834 closing at LF67252–67259, before its foot-note LF67262 and the leaf-459 header. Issuer evidence is GREGORIUS PP. XVI. at LF67170–67170; the source closing at LF67252–67259 reads: . Datum Romae apud sanctam Mariam Maio- .tem sub annulo piscatoris die decima quinta iulii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
