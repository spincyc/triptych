description = "Letter CCLXXXVII commissions Archbishop François-Nicolas-Madeleine Morlot of Tours, as metropolitan, to go in person to Bishop Charles-Jean of Vannes and warn him, in the Pope’s name, against the Jansenists he tolerates; address LF51603–51605, intitulation, greeting, body, blessing and dating clause (LF51778 and LF51784–51786, around the running title) survive. Issuer evidence: GREGORIUS PP. XVI. at LF51608–51608; the source dating clause at LF51784–51786 reads: rem die decima prima iulii anno millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
