notes = "Brief LXXXIV grants the rochet to the archpriest and eight priests of S. Giovanni Battista, Fusignano; LF14790 → LF14796 across the page number 101 LF14793 (OCR tot); complete 15 March 1836 closing. Own provenance LF14867 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI« at LF14751–14751; the source closing at LF14834–14837 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quinta martii mil- lesimo octingentesimo trigesimo sexto, pon- tificatus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
