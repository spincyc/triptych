notes = "Letter CCLXXVIII (protocol LF48086–48089) grants plenary and partial indulgences, applicable to the dead, to the members and director of the Paris Association des Jeunes Économes for poor girls, and ends with its own 15 November 1833 closing at LF48199–48202, before numeral CCLXXIX at LF48205. Issuer evidence is GREGORIUS PP. XVI. at LF48086–48086; the source closing at LF48199–48202 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quinta novembris millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
