context = "Apostolic letter CCXCI separates Melanesia and Micronesia from the western Oceania vicariate, erects them as two vicariates under one vicar apostolic for the time being and entrusts them to the Society of Mary of Lyon; intitulation, narrative, erection with bounds, decernentes clause and dating clause survive. Its numeral LF52024 (OCR “CCXEL”) was missed by the detector. Issuer evidence: GREGORIUS PP. XVI. at LF52037–52037; the source dating clause at LF52114–52124 reads: Datum Romae apud sanctam Mariam Maio- _ rem sub annulo piscatoris die decima nona iulii | millesimo octingentesimo quadragesimo quarto, pontiticatus Nostri anno decimo quarto. The witness abbreviates conventional formulae with “etc.” (“sortiri et obtinere etc.”, LF52112); these remain literal and are not expanded. Inside the dating clause, LF52117 begins with a mark “_” and LF52120 is a lone “|” WORD (x1398–1400, y2823–2837) at the column’s left edge between “… die decima nona iulii” and “millesimo …”; both remain literal. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF52117 “_”; LF52120 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
