description = "Letter CCXIV (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF37049–37052) recites Cardinal Lambruschini's apostolic visitation of the missionary college of San Pietro in Montorio and decrees its subjection to the minister general, removal of philosophy, perfect common life and observance of Clement IX's Crediti Nobis; it ends with its own 22 March 1833 closing at LF37334, before numeral CCXV at LF37337. Issuer evidence is GREGORIUS PP. XVI. at LF37049–37049; the source closing at LF37331–37334 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima secunda martii millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. LF37155 (1 Ex Iure Pontificio de P. F.) is its own provenance note; LF37297 Bl is the sheet signature (31) at the foot of native leaf 259. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
