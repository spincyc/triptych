notes = "The act extends the privileged-altar favour to every altar of San Pantaleone in Venice for Masses of its choir priests. Issuer evidence GREGORIUS PP. XVI. at LF6277; own dating clause LF6331–6334 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima nona iulii millesimo octingentesimo trigesimo primo, pontificatus Nostri anno primo.. Own provenance note LF6412 excluded as edition furniture. Refined body and full surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
