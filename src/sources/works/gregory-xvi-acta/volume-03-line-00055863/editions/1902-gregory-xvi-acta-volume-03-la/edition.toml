notes = "Indult CCCXIX grants the canons of the collegiate chapter of Monteprandone (diocese of Ripatransone) the violet collar and hat-tassel; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF55872–55872; the source dating clause at LF55941–55944 reads: Datum Romae apud s. Petrum sub annulo piscatoris die nona maii millesimo octingente- simo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
