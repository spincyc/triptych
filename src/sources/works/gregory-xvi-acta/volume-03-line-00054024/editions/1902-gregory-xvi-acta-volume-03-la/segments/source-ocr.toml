context = "Letter CCCV (labelled EPISTOLA, in consistorial form GREGORIUS EPISCOPUS servus servorum Dei) grants the pallium to Patriarch Joseph Gazeno through Archbishop Nicolas Murad and prints the pallium-assignment and oath forms in its text; address LF54034–54037, intitulation, greeting, body, forms and incarnation-year dating clause survive. Issuer evidence: GREGORIUS EPISCOPUS at LF54040–54040; the source dating clause at LF54168–54172 reads: Datum Romae apud sanctam Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo quinto, quartodecimo ka- lendas februarii, pontificatus Nostri anno deci- mo quinto. The dating clause (LF54168–54172) prints “anno incarnationis dominicae millesimo octingentesimo quadragesimo quinto, quartodecimo kalendas februarii, pontificatus Nostri anno decimo quinto”, the same date and the same year conflict as bull CCCIV; its calendar year and pontifical year disagree under the edition’s own placement, so the normalized date is left unknown rather than inferred (the printed day is 19 January (quartodecimo kalendas februarii)). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete selected extent and at least twenty literal-LF lines of context on each side were read in this lane’s exhaustive in-order read of LF41955–54470 (claim LF41985–54420). Every nonblank LF line of the span maps 1:1 to a native XML LINE (zero token mismatches; line-geometry.json), and leaf/column, indent, vertical-gap, intra-line word-gap and short-line geometry screens were dispositioned; no general image collation is claimed. Selected bounds [[54034, 54077], [54086, 54146], [54152, 54172]]."
