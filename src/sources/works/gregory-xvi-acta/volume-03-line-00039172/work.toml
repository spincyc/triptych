description = "Bull CCXX detaches Pataz and Chachapoyas from Trujillo, suppresses the see of Maynas and erects the cathedral and diocese of Chachapoyas, with dotation, capitular, metropolitan, taxation, executor and Nulli ergo clauses and incarnation-year dating clause (quarto nonas iunii = 2 June). Issuer evidence: GREGORIUS EPISCOPUS at LF39182–39182; the source dating clause at LF39585–39588 reads: Datum Romae apud s. Petrum anno incar- nationis dominicae millesimo octingentesimo quadragesimo tertio, quarto nonas iunii, pon- tificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF39186 “-ad”; LF39364 “j”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
