description = "Epistle CCLXXXIX to Archbishop Engelbert of Mechelen and his Belgian suffragans (address LF50095–50097, protocol LF50100, salutation LF50103–50104) approves their plan for a Catholic university in Belgium governed by the bishops, saving the episcopal rights over seminaries, and ends with its own 13 December 1833 closing at LF50191; its note 1 (Ex opere Theiner) is LF50194, before page number 328 and numeral CCXC at LF50197–50198. Issuer evidence is GREGORIUS PP. XVI. at LF50100–50100; the source closing at LF50188–50191 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima tertia decembris mille- simo octingentesimo trigesimo tertio, pontifi- catus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
