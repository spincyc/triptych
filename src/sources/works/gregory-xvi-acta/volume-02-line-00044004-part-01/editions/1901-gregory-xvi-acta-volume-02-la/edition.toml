notes = "Indult CCVI grants the rochet to the archpriest and canons of Serravalle (diocese of Tortona); LF44042 → LF44054 across CCV’s provenance LF44045, own provenance LF44048 and running title LF44051; complete 19 April 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF44013–44013; the source closing at LF44097–44100 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima nona aprilis mil- lesimo octingentesimo trigesimo nono, pon- tificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
