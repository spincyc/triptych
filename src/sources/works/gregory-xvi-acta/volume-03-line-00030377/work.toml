description = "Letter CLV congratulates Charles Albert on the marriage of his son Victor Emmanuel with Archduchess Adelaide; address, intitulation, body and dating clause survive. LF30424 (“sunt.”), though short, is right-column text. Issuer evidence: GREGORIUS PP. XVI. at LF30394–30394; the source dating clause at LF30463–30466 reads: Datum Romae apud s. Petruin sub annulo piscatoris die vigesima tertia aprilis millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
