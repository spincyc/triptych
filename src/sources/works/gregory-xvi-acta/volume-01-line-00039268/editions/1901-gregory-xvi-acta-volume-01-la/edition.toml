notes = "Letter CCXXIX (protocol GREGORIUS PP. XVI. ad futuram rei memoriam LF39277–39280) raises the Montebello estate near Viterbo to a marquisate for the Lavaggi grand-nephews of Count Domenico Lavaggi and ends with Non obstantibus and its own 7 June 1833 closing at LF39432–39435, before numeral CCXXX (OCR CCKXX.) at LF39438. Its body continues past the proposal frame end LF39324 through the false heading LF39327 (second half of the leaf-273 running title) into frame line-00039327. Issuer evidence is GREGORIUS PP. XVI. at LF39277–39277; the source closing at LF39432–39435 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima-iunii millesimo octin- gentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
