notes = "Brief LXVII commissions the bishop of Chur to reduce the holy days of the canton of Uri; LF12291 ordi- → LF12300 nem across own provenance LF12294 and page number 84 LF12297; complete 25 September 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF12244–12244; the source closing at LF12342–12345 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quinta septembris millesimo octingentesimo trigesimo quinto, pontificatus-Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
