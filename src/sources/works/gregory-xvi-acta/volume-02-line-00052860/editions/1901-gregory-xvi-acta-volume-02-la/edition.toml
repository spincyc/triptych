notes = "Brief CCXLVI (address to Antoine-Adolphe Dupuch, bishop of Julia Caesarea/Algiers, LF52870–52871) lets him erect the Scapular confraternity and Stations of the Cross with their indulgences until Carmelites and Observants are established; LF52904 regu- → LF52919 lares across CCXLV’s provenance LF52907, own provenance LF52910, the left half ANNO of the page-361 running title LF52913 and specks LF52916/LF52918 (native height 16–18 px between the running title and the first body line); complete 6 September 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF52874–52874; the source closing at LF52931–52934 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die sexta septembris millesimo octingentesimo trigesimo nono, pon- tificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
