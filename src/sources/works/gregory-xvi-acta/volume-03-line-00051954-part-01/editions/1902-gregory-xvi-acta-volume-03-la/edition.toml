notes = "Indult CCXC grants the parish priest and clergy of S. Maria delle Vergini at Scafati (diocese of Nola) the red almuce with ermine fringe; intitulation, narrative, grant, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF51964–51964; the source dating clause at LF52018–52021 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die decima sexta iulii mille- simo Octingentesimo quadragesimo quarto, pon- tificatus Nostri anno decimo quarto, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
