description = "Apostolic letter CCLXIV provides Charles Pooten to the titular see of Maronia under Traianopolis with the indult of non-residence and the consecration faculty; address LF45514–45515, intitulation, greeting (printed “. Dilecte fili,”), provision, non obstantibus clause and dating clause survive. Its numeral LF45505 (OCR “CCUXIV.”) was missed by the detector. Issuer evidence: GREGORIUS PP. XVI. at LF45518–45518; the source dating clause at LF45646–45649 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima tertia februarii millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
