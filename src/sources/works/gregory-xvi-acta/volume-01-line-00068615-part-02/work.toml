description = "Letter CCCLXV (protocol LF68695; address Venerabilis frater, salutem ... LF68698–68699) revokes the jurisdiction of the patriarchal vicar of Constantinople and the bishop of Zante and Cephalonia over the mainland and islands of the kingdom of Greece and appoints the bishop of Syra apostolic delegate there, ending with its own 19 August 1834 closing at LF68770–68773, before numeral CCCLXVI (OCR GCCLXVI.) at LF68776. Issuer evidence is GREGORIUS PP. XVI. at LF68695–68695; the source closing at LF68770–68773 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima nona au- gusti millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
