notes = "Letter CXXXIV to the Melkite patriarch reports the help sought from Catholic princes for the Lebanese faithful; address (foot of leaf 206), intitulation (head of leaf 207), body and dating clause survive. Issuer evidence: . GREGORIUS PP. XVI. at LF28077–28077; the source dating clause at LF28130–28133 reads: Datum Romae apud.s. Petrum sub annulo piscatoris die sexta februar. millesimo octin- gentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
