notes = "Apostolic letter CCXLVIII erects the see of Little Rock (Petricula) for Arkansas; intitulation, narrative, erection, decernentes clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF43099–43099; the source dating clause at LF43146–43149 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava novembris mil- lesimo octingentesimo quadragesimo tertio, pon- tificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
