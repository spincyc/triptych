context = "Allocution CCC, under its own dated title ALLOCUTIO HABITA IN CONSISTORIO SECRETO DIE VIGESIMA IANUARII ANNI MILLESIMI OCTINGENTESIMI TRIGESIMI QUARTI (LF51363–51368, retained as the speech's own title and only dating), addresses the cardinals (Venerabiles fratres LF51371), creates Jacopo Luigi Brignole cardinal priest and Nicola Grimaldi cardinal deacon and ends with the creation formula and In nomine Patris … Amen. at LF51467–51468, before numeral CCCI at LF51471. Issuer evidence is ACTA GREGORII PP. XVI. at LF51481–51481; the source closing at LF51366–51368 reads: HABITA IN CONSISTORIO SECRETO DIE VIGESIMA IANUARIL ANNI MILLESIMI OCTINGENTESIMI TRIG 3ESIMI QUARTI. Only the Bernasconi numeral (OCR CccG >) and synopsis LF51353–51360 are omitted before the title. The block LF51404–51413 holds CCXCIX's note 1, this allocution's note 2 (Ex Archivio Brevium ad Principes), a right-margin speck (af, x 2504) and page number 336. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
