notes = "The letter confers the Bethlehem titular episcopacy on future abbots of Saint-Maurice with explicit election/confirmation conditions, complete derogation and dating clause. The running title10311 follows the complete act. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF10155–10155; the source closing at LF10305–10308 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die tertia iul. mil- les'mo octingentesimo quadragesimo, pontifica- tus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
