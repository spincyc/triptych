description = "Letter CCCLII informs King Frederick Augustus II of Saxony of the appointment of Joseph Dittrich as vicar apostolic and bishop of Corycus and declines to detach the Saxon parishes from Litoměřice; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF66665–66665; the source dating clause at LF66740–66743 reads: Datum Romae apud s, Petrum die vigesima prima martii millesimo octingentesimo quadra- gesimo sexto, pontificatus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
