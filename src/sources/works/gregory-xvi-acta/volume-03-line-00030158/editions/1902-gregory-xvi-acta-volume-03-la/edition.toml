notes = "Letter CLII congratulates Emperor Ferdinand on the marriage of Archduchess Adelaide and Victor Emmanuel of Savoy; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF30176–30176; the source dating clause at LF30240–30243 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima aprilis millesimo octin- gentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
