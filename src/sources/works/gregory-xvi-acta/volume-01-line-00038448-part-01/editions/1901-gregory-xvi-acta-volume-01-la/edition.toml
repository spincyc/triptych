notes = "Epistle CCXXII to Paul-Thérèse-David d'Astros, archbishop of Toulouse (address LF38462–38464, protocol LF38467), acknowledges the French bishops' letter, recalls the encyclical issued on the Assumption and the submission of its addressees, deplores doctrines still spread abroad, imparts the blessing and ends with its own 8 May 1833 closing at LF38562, before numeral CCXXIII at LF38565. Issuer evidence is GREGORIUS PP. XVI. : at LF38467–38467; the source closing at LF38559–38562 reads: Datum Romae apud s. Petrum sub annulo piscatoris die octava maii anno millesimo octin- gentesimo trigesimo tertio, pontificatus Nostri anno tertio, . The block LF38517–38523 holds the volume signature, its own provenance note 1 (Ex opere … Annali delle scienze cattoliche, De Luca vol. 14, a wide foot line) and page number 250. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
