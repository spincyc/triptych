notes = "Apostolic letter CLXXI appoints Pierre Bataillon vicar apostolic of Central Oceania; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF32263–32263; the source dating clause at LF32334–32338 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima tertia augusti millesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo se- cundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
