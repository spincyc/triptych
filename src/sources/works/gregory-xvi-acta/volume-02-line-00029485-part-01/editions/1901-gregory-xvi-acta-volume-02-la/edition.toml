notes = "Brief CXXXIV separates British Guiana (Demerara) from the Trinidad vicariate into its own vicariate apostolic; a literal trailing OCR mark F remains on LF29531 (gendam. F); single column LF29497–29553 with complete 12 April 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF29497–29497; the source closing at LF29550–29553 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima secunda apriiis millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno septimo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
