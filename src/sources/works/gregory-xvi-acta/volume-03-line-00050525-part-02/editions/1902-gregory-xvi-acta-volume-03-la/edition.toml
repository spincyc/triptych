notes = "Bull CCLXXXV, at Ferdinand II’s request and effective only at the next vacancies of Messina and Catania, dismembers five towns from Catania and eight from Messina and erects the city, cathedral, chapter, seminary and see of Acireale with dotation from the abbeys of Roccamadore and La Novara, royal nomination, taxation, executor (Archbishop Celestino Cocle), decernentes, non obstantibus, transumpt, Nulli ergo and incarnation-year dating clauses (quinto kal. iul. = 27 June). Its numeral LF50757 (OCR “CCLKXXYV.”) was missed by the detector. Issuer evidence: GREGORIUS EPISCOPUS at LF50765–50765; the source dating clause at LF51417–51422 reads: Datum Romae apud s. Petrum anno incar- cationis dominicae millesimo octingentesimo | quadragesimo quarto, quinto kal. iul., pontifi- | catus Nostri anno decimo quarto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF51066 “|”; LF51419 “|”; LF51422 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
