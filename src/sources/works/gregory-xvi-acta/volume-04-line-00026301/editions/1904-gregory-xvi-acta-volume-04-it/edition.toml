notes = "Gregory XVI, of his own motion (di nostro Motu-Proprio, certa scienza e pienezza della nostra suprema ed assoluta potestà LF26403–26405), approves the resolution of the deputed congregation and orders the diversion of the Aniene through Monte Catillo at Tivoli, entrusting execution and the apportioned funding to the prefect of the Congregazione delle acque. First-person papal chirograph addressed to cardinal Agostino Rivarola, dated LF26554–26556 'Dato dal nosrro palazzo apostolico al Vati- cano questo di g giugno 1832 anno secondo del nostro pontificato.' and subscribed LF26559 'GREGORIUS PP. XVI.'. Whole act and surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
