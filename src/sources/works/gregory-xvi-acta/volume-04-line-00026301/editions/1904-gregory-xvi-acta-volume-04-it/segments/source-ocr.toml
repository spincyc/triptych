context = "Gregory XVI, of his own motion (di nostro Motu-Proprio, certa scienza e pienezza della nostra suprema ed assoluta potestà LF26403–26405), approves the resolution of the deputed congregation and orders the diversion of the Aniene through Monte Catillo at Tivoli, entrusting execution and the apportioned funding to the prefect of the Congregazione delle acque. First-person papal chirograph addressed to cardinal Agostino Rivarola, dated LF26554–26556 'Dato dal nosrro palazzo apostolico al Vati- cano questo di g giugno 1832 anno secondo del nostro pontificato.' and subscribed LF26559 'GREGORIUS PP. XVI.'. Whole act and surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Whole instrument LF26301–26559 and more than twenty LF of context on each side (LF26187–26298 before, LF26562–26637 after) read literally; selected bounds [[26308, 26326], [26335, 26396], [26402, 26462], [26468, 26532], [26538, 26559]]. Native DjVu XML LINE/WORD geometry of leaves 182–184 (artifact pages 182–184, printed pp. 166–168) was aligned line for line with the OCR (exact text match on every leaf); no page image was fetched and no image collation is claimed."
