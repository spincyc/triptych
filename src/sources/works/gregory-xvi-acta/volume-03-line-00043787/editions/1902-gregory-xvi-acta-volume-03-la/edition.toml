notes = "Letter CCLIV to Cardinal Karl Kajetan Gaysruck, archbishop of Milan, confirms the restoration of the Augustinian nuns’ monastery, heals its defects and grants faculties to renew or sanate the four irregular professions; address LF43796–43800, intitulation LF43807, greeting, body, blessing and dating clause survive. The address stands at the foot of leaf 319 left; the papal-issuer hold reason of the raw frame LF43787–43800 is resolved by the intitulation “GREGORIUS PP. XVI.” at LF43807. Issuer evidence: GREGORIUS PP. XVI. at LF43807–43807; the source dating clause at LF43928–43931 reads: Datum Romae apud s. Petrum die vigesima tertia decembris anno millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF43845 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
