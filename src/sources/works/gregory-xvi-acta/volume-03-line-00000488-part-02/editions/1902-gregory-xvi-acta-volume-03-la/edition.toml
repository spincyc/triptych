notes = "Independent letter III suppresses the San Luigi parish and transfers the cure to Santa Maria Maddalena; its extensive operative conditions, derogation and complete closing precede the Collier letter. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF592–592; the source closing at LF828–831 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima februarii millesimo octin- gentesimo quadragesimo, pontificatus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
