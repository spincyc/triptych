notes = "Epistle CCXLVII to the bishop of Chur and St Gallen (address LF42674–42676, protocol LF42679) approves his proceedings against the parish priest Alois Fuchs and the Uznach chapter, reserves judgment on Fuchs's writings, counsels postponement of a diocesan synod and the retention of the Roman or existing ritual, and ends with its own 24 July 1833 closing at LF42867–42870, before numeral CCXLVIII at LF42873. Issuer evidence is GREGORIUS PP. XVI. at LF42679–42679; the source closing at LF42867–42870 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima quarta iulii mil- lesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno +tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
