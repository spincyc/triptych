notes = "Indult CCXXIX grants the archpriest and canons of the Roccasecca collegiate chapter (diocese of Priverno) the rochet and violet mozzetta; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF40688. Issuer evidence: GREGORIUS PP. XVI. at LF40618–40618; the source dating clause at LF40682–40685 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima prima augusti millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
