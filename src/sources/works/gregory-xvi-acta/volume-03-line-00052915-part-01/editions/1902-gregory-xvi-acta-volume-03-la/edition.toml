title = "Exponendum Nobis curasti — Bartholomaeo Radziszewski vicario Podlachiensi facultas designandi altare privilegiatum in parochialibus ecclesiis — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1902."
