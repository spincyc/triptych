notes = "Apostolic letter CCC grants Bartholomew Radziszewski, vicar of the diocese of Podlachia, the faculty to designate one perpetual privileged altar in each parish church lacking one; address LF52926–52928, intitulation, greeting, grant and dating clause survive. Its provenance note1 is LF52902 at the foot of leaf 384, emitted before its heading. LF52905 (“in huiusmodi —”) is not furniture of this act: it is displaced body text of the held letter CCXCIX and lies outside this selection. Issuer evidence: GREGORIUS PP. XVI. at LF52931–52931; the source dating clause at LF52977–52980 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima nona octobris millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto, Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF52960 “*”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
