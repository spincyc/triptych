notes = "Bull CLXXIX (caption BULLA, OCR B.UIE- LA) is addressed to the bishop of Vigevano (LF28771–28772) under the protocol GREGORIUS EPISCOPUS servus servorum Dei and commissions the perpetual union of the parish churches of San Gaudenzio and Sant'Eusebio at Campolato, with reservations, derogations and the complete incarnation-year dating clause (septimo kalendas octobris = 25 September 1832). It ends at LF29074 immediately before numeral CLXXX at LF29077. Issuer evidence is GREGORIUS EPISCOPUS at LF28775–28775; the source closing at LF29071–29074 reads: Datum Romae apud sanctam Mariam Maio- rem anno incarnationis dominicae . millesimo octingentesimo trigesimo secundo, septimo kalen- das octobris, pontificatus Nostri anno secundo. LF28830 (note 1, Ex Bullario Romano) is the act's own provenance citation and lies inside the excluded foot/head block LF28830–28837. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
