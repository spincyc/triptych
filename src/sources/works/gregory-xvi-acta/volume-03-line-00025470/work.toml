description = "Letter CXVIII welcomes J. Collin de Plancy’s return from unbelief and ratifies his absolution from censures; address, intitulation, body and dating clause survive. Its provenance note1 is LF25590. Issuer evidence: GREGORIUS PP. XVI. at LF25485–25485; the source dating clause at LF25537–25540 reads: Datum Romae apud sanctam Mariam Maio- rem die decima sexta octobris millesimo octin- gentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
