description = "Letter CCXV (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF37346–37347) grants the canons of Foligno cathedral a violet hat-cord and tassel within the diocese and ends with its own 29 March 1833 closing at LF37421, before numeral CCXVI at LF37424. Issuer evidence is GREGORIUS PP. XVI. at LF37346–37346; the source closing at LF37418–37421 reads: Datum Romae apud sanctum Petrum sub vannulo piscatoris die vigesima nona martii mil- lesimo octingentesimo trigesimo tertio, pontifi- catus Nostri anno tertio. Its provenance note 1 (Ex Bullario Romano,) is printed at LF37448 in CCXVI's foot block and is excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
