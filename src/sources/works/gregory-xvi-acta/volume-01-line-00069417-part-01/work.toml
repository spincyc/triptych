description = "Epistle CCCLXXI to King Otho I of Greece (address LF69426–69428, protocol LF69431, salutation LF69434–69435) commends to him the Catholics of his kingdom and Bishop Luigi of Syra as apostolic delegate, and ends with its own 25 August 1834 closing at LF69486–69489, before numeral CCCLXXII (OCR CCCGEXXII.) at LF69492. Issuer evidence is GREGORIUS PP. XVI. at LF69431–69431; the source closing at LF69486–69489 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quinta augusti millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
