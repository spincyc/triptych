notes = "Indult XLIV grants violet collar and hat tassel to the dignitaries and canons of the Montefeltro cathedral; LF8610 → LF8613 column change; complete 27 June 1835 closing. Own provenance LF8675 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF8605–8605; the source closing at LF8669–8672 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima septima iunii millesimo octingentesimo trigesimo quinto, pon- tificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
