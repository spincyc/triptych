notes = "Letter CCIII (salutation Serenissime et potentissime imperator LF43719) thanks Tsar Nicholas I for his letter of 25 February and commends the Catholics of the empire; LF43748 → LF43761 across CCII’s provenance LF43751, own provenance LF43754–43755 (Roskovany, Monumenta Catholica) and the left half ANNO of the page-299 running title LF43758; complete 6 April 1839 closing. The running title’s right half MDCCCXXXIX. and page number 299 (LF43820–43823) follow the closing and are excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF43716–43716; the source closing at LF43815–43817 reads: Datum Romae apud ee Petrum die sexta aprilis millesimo octingentesimo trigesimo nono, pontificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
