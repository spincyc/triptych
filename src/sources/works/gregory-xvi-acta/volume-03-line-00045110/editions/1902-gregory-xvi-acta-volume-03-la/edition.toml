notes = "Apostolic letter CCLX grants Teresa Eustochio Verzeri’s Daughters of the Sacred Heart private oratories with Mass and reservation in all their houses, communion at Mass, and exemption of the houses from parochial jurisdiction under the Ordinaries; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF45120–45120; the source dating clause at LF45224–45227 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima tertia ianuarii millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
