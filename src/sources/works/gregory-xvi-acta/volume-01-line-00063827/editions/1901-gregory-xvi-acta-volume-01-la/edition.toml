notes = "Letter CCCXXXVIII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF63835–63838) reforms the Order of St Gregory the Great into three classes with fixed numbers and makes the cardinal secretary of briefs its grand chancellor, and ends with its own 30 May 1834 closing at LF64018, before numeral CCCXXXIX at LF64021. Issuer evidence is GREGORIUS PP. XVI. at LF63835–63835; the source closing at LF64015–64018 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die trigesima maii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. LF63858 (1 Ex Iure Pontificio de P. F.) is its own provenance note, excluded with the sheet signature and page number 418. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
