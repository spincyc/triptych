description = "Apostolic letter CCCXIV commissions the archbishop of Fermo to suppress the parish of S. Michele Arcangelo at Montegiorgio and attribute its goods and cure of souls to the collegiate chapter; intitulation, greeting “Venerabilis frater”, narrative, commission, decernentes and non obstantibus clauses and dating clause survive (this printing has no separate address; the addressee is identified by “tuae ipsius Firmanae dioecesis”, LF55315). Issuer evidence: GREGORIUS PP. XVI. at LF55304–55304; the source dating clause at LF55432–55435 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda aprilis anno millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
