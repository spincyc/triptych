notes = "Letter CCL to Carlo Cardani of Civitavecchia (address LF43163–43164, protocol LF43167) confirms to him, as heir of Vincenzo Calabrini, the marquisate of Rocca di Gradara granted by Leo XII and ends with its own 30 July 1833 closing at LF43243–43246; LF43249 is a speck before numeral CCLI at LF43252. Issuer evidence is GREGORIUS PP. XVI. at LF43167–43167; the source closing at LF43243–43246 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die trigesima iulti millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Its own provenance note 1 (Ex Bullario Romano, LF43284) is printed at the foot of leaf 299 inside CCLI's frame and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
