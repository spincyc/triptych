description = "Letter CLXXXVIII consoles Luigi (Célestin) de Bési, bishop of Canopus and apostolic administrator of Nanking, in the Chinese persecutions and refers the Jesuit question to Propaganda; address, intitulation, greeting, body, blessing and dating clause survive. Genre recorded from the documentary form (Venerabilis frater … sub annulo piscatoris). Issuer evidence: GREGORIUS PP. XVI. at LF34604–34604; the source dating clause at LF34669–34672 reads: Datum Romae apud s. Petrum sub annulo piscatoris die prima ianuarii millesimo octin- gentesimo quadragesimo tertio, pontificatus No- stri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
