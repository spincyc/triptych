notes = "Brief LIII (OCR Lil.) confirms the constitutions of the Perpetual Adoration nuns with the additions for the Naples monastery; first act of this claim, after b01’s LII closing LF9574–9578. LF9660 → LF9672 across own provenance LF9663, printer’s signature LF9666 and page-66 running title LF9669; LF9734 Maio- → LF9737 r2m column change; complete 21 August 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF9590–9590; the source closing at LF9734–9739 reads: Datum Romae apud sanctam Mariam Maio- r2m sub annulo piscatoris die vigesima prima au- gusti millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
