description = "Indult CCCLVI (protocol LF66979–66982) grants the participant priests of San Nicola at Andria the same insignia within the diocese, ending with its own 8 July 1834 closing at LF67074–67077, before numeral CCCLVII at LF67080. Issuer evidence is GREGORIUS PP. XVI. at LF66979–66979; the source closing at LF67074–67077 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die octava iulii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
