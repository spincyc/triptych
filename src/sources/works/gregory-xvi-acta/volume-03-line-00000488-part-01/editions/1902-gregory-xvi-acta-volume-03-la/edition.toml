notes = "Independent indult II grants violet collar and gold Marian medal to the Apuan cathedral canons; its closing precedes a new numeral and new papal protocol at LF581–592. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF497–497; the source closing at LF575–578 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die septima februarii mille- simo octingentesimo quadragesimo, pontificatus Nostri anno decimo,.  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
