notes = "Letter CCCXLV answers Francis V of Austria-Este, duke of Modena, on the death of his father Francis IV and blesses him and his family; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF66151. Issuer evidence: GREGORIUS PP. XVI. at LF66037–66037; the source dating clause at LF66075–66078 reads: Datum Romae apud s. Petrum sub annulo piscatoris die nona februarii millesimo octingen- tesimo quadragesimo sexto, pontificatus No- stri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
