context = "Letter LXXXVII to Archbishop Affre of Paris on the projected Œuvre du Catholicisme: address, intitulation, greeting, body (LF18205–18239 upper leaf 137; LF18338–18351 upper leaf 138) and dating clause LF18353–18356. The letter says the cardinal prefect of Propaganda’s epistle is annexed (“adnexa hisce literis epistola … cardinalis Fransonii … ²”, LF18227–18229); the edition prints that annexed Italian letter of 4 May 1841 as this act’s note2 in the lower half of leaves 137–138 (LF18246–18288, LF18291–18332, LF18367–18406, LF18443–18482). It is retained as the act’s own substantive note in source order. Issuer evidence: GREGORIUS PP. XVI. at LF18198–18198; the source dating clause at LF18353–18356 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quarta maii millesimo octingen- tesimo quadragesimo primo, pontificatus No- stri anno decimo primo. The Propaganda letter (Italian, by Cardinal Fransoni, unsubscribed in this printing) is non-papal annex text retained only as this act’s printed note; it is not attributed to the pope. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
