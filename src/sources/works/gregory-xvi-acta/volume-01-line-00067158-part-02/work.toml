description = "Letter in forma Brevis CCCLIX (OCR Ree CECLIX - at LF67268; protocol LF67277–67280) beatifies Sebastiano Valfré of the Turin Oratory, grants office and Mass and the first-year solemnities, and ends with its own 15 July 1834 closing at LF67641–67646; the edition then prints its liturgical annex (TAURINENSIS Beatificationis ... proper Oratio, Secreta, Postcommunio, LF67649–67680) and the Decretum of the Sacred Congregation of Rites of 25 April 1834 approving those prayers for insertion in this brief, subscribed C. M. ep. Praenest. card. Pedicinus and I. G. Fatati S. R. C. secret. with the seal notice (LF67683–67722), immediately before numeral CCCLX at LF67725. Issuer evidence is GREGORIUS PP. XVI. at LF67277–67277; the source closing at LF67641–67646 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quinta iulii millesimo octingentesimo trigesimo quarto, *pontificatus Nostri anno quarto. The printed liturgical annex and its Rites approval decree (LF67649–67722) are retained as this brief's own attached historical annex: the brief grants office and Mass cum orationibus propriis a Nobis approbatis (LF67591–67594) and the decree requires these prayers to be inserted in the brief. The decree is the congregation's recorded approval within this witness, not separate papal authorship; this follows the accepted continuation-series precedent for beatification briefs. The page number 441 (OCR 44, LF67334), signatures and page number 442 (LF67409–67415), running titles and top-edge specks are excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
