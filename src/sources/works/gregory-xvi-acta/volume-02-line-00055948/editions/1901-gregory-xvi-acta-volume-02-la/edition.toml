notes = "Allocution CCLIII deplores the passage of the Ruthenian Uniate bishops of Lithuania and White Russia to the Russian Orthodox Church and the state of Catholics in the Russian empire; LF56014 → LF56021 across own provenance LF56017 (De Luca, Annali delle scienze cattoliche) and page number 382 LF56020; LF56082 → LF56088 across running title LF56085; LF56153 → LF56162 across a speck LF56156 (native 8×3 px) and running title LF56159; several lines carry literal trailing marks |; ends at LF56214 before CCLIV LF56217. Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORIT PP. XVI. at LF56085–56085; the source closing at LF56191–56214 reads: Post haec dissimulare minime possumus, venerabiles fratres, latius patere causam doloris Nostii de rei catholicae in vastissimis Russ’aci imperii finibus conditione. Novimus enim quan- tis illico religio Nostra sanctissima iamdiu prematur angustiis. His sane levandis omnem pastoralis sollicitudinis operam impendere non praetermisimus , nullisque in posterum parce- mus curis apud potentissimum imperatorem, adhuc sperantes, ipsum pro sua aequitate ac excelso quo est animo, postulationes et vota Nostra benevole accepturum. Quem in finem communibus precibus adeamus cum fiducia ad thronum gratiae, Patrem misericordiarum et Deum totius consolationis unanimiter obsecran- tes, ut in haereditatem suam benignus respiciat, Ecclesiam sponsam, suorum filiorum iacturam . acerbissime plorantem, opportuno auxilio sole- tur, optatamque diu in tot adversis serenitatem clementissime largiatur. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
