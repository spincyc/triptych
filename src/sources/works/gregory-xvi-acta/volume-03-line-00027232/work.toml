description = "Allocution CXXIX publishes Massimo, Acton and Vannicelli (reserved in pectore) and creates Schwarzenberg and Corsi cardinals; it runs from “Venerabiles fratres,” LF27254 to the closing invocation LF27375–27376. The left column ends at LF27298; LF27365 (“nales”), though short, is right-column text (native x1196–1300). Issuer evidence: ACTA GREGORII PP. XVI. at LF27168–27168; the source dating clause at LF27248–27251 reads: HABITA IN’ CONSISTORIO SECRETO DIE VIGESIMA QUARTA IANUARII MILLESIMO OCTINGENTESIMO QUADRAGESIMO SECUNDO. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions of the earlier admitted batches. The crosses of the closing invocation are OCR’d “>”/“>{<” (LF27375–27376) and remain literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
