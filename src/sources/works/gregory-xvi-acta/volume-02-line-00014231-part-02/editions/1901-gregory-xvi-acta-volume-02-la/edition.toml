notes = "Brief LXXXI (address LF14392–14394) names Cardinal Carlo Maria Pedicini apostolic visitor of the Franciscan missionary college of S. Bartolomeo all’Isola; LF14440 → LF14446 across page-99 running title LF14443; LF14505 → LF14508 column change; complete 26 February 1836 closing. Own provenance LF14368 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF14397–14397; the source closing at LF14535–14538 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima sexta febr. millesimo octingentesimo trigesimo sexto, pon- tificatus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
