context = "Letter CCVI (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF35978–35982) raises the town of Gualdo (Gualdum seu Validum), diocese of Nocera, to the rank of city without obliging the bishop to reside there, and ends with its own 5 March 1833 closing at LF36124, before numeral CCVII at LF36127. It runs past its catalog frame through the false heading LF36005. Issuer evidence is GREGORIUS PP. XVI. at LF35978–35978; the source closing at LF36121–36124 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quinta martii millesimo octin- gentesimo trigesimo tertio, pontificatus Nostri anno tertio. LF36005 MDCCCXXXIII. (catalog heading of line-00036005) is the second half of the running title of source page 233, excluded with the speck { (LF36002) and page number 233 (LF36008). LF35981 F ? is an isolated literal glyph group between the protocol lines, retained uncorrected. The block LF36078–36085 holds its own note 1 (t Ex Bullario Romano.), the volume signature, sheet signature 30 and page number 234. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
