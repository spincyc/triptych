description = "Letter CCXVI, addressed to Cardinal Emmanuele De Gregorio, bishop of Frascati and prefect of the Congregation of the Council (LF37434–37436), appoints him apostolic visitor and administrator of the Lucarini college at Trevi with power to derogate from the founder's will, and ends with its own 29 March 1833 closing at LF37529, before numeral CCXVII at LF37532. Issuer evidence is GREGORIUS PP. XVI. at LF37439–37439; the source closing at LF37526–37529 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima nona martii millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. The block LF37448–37454 holds CCXV's note 1, this letter's note 2 (Ex eodem Bullario) and the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
