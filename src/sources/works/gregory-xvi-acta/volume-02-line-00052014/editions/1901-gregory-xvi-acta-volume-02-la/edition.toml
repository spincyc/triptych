notes = "Indult CCXXXIX grants the dignitaries of Modena cathedral violet collar, hat tassel and stockings and the canons collar and tassel, at the request of the minor archpriest Antonio Bertesi; LF52044 → LF52058 across CCXXXVIII’s provenance LF52047–52048, own provenance LF52051–52052 and running title LF52055; LF52117 → LF52123 across page number 355 LF52120; complete 14 August 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF52025–52025; the source closing at LF52127–52130 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quarta augusti millesimo octingentesimo trigesimo nono, pontificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
