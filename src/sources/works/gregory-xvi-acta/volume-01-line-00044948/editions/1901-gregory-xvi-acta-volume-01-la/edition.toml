notes = "Letter CCLIX (protocol LF44958–44961) perpetually assigns the revenues of the Bertoni lay chaplaincy to the cathedral chapter of Cesena for the fabric, under Leo XII's conditions and with reversion if the Oratorians return, ending with its own 30 August 1833 closing at LF45157–45160, before numeral CCLX at LF45163. Issuer evidence is GREGORIUS PP. XVI. at LF44958–44958; the source closing at LF45157–45160 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die trigesima augusti millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
