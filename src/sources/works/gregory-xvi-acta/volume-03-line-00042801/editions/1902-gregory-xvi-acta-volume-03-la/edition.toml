notes = "Indult CCXLIV grants the abbot and canons of the collegiate church of St Barnabas at Marino the violet collar; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF42809–42809; the source dating clause at LF42885–42888 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima septima novembris mil- lesimo octingentesimo quadragesimo tertio, pon- tificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
