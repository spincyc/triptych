notes = "Indult CLIX grants the archpriest and canons of Massa Fiscaglia a violet hat-tassel within the Cervia diocese; decree, non obstantibus and dating clause survive. LF30725 (“nentur.”), though short, is right-column text (native x1192–1340). Issuer evidence: GREGORIUS PP. XVI. at LF30713–30713; the source dating clause at LF30795–30798 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima septima iunii millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
