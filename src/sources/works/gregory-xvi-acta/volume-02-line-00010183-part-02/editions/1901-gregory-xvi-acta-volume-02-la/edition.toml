notes = "Brief LIX approves the Sisters of Charity founded by Empress Caroline Augusta and their rules approved by the Congregation of Bishops and Regulars (the rules themselves are not printed); LF10332 → LF10335 column change; complete 15 September 1835 closing. Own provenance LF10395 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF10293–10293; the source closing at LF10389–10392 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quinta septembris millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno qyinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
