description = "Indult CCCXVII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF59314–59317) allows the prior and clergy of the church of the Holy Trinity at Venosa (order of Malta) to wear the rochet and ends with its own 21 March 1834 closing at LF59405, before page number 387 and numeral CCCXVIII (LF59408–59409). Issuer evidence is GREGORIUS PP. XVI. at LF59314–59314; the source closing at LF59402–59405 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima prima martii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. The block LF59335–59341 holds CCCXVI's note 1, this indult's note 2 (Ex eodem Bullario.) and the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
