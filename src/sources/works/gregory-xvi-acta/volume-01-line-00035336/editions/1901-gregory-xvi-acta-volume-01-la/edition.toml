notes = "Letter CCI (protocol GREGORIUS PP. XVI. ad futuram rei memoriam LF35347–35350) permits the abbesses of the Poor Clares at Santiago de Compostela to receive girls in secular dress for two or three months of probation with the ordinary's leave, and ends with its own 8 February 1833 closing at LF35430, before numeral CCII at LF35433. Issuer evidence is GREGORIUS PP. XVI. at LF35347–35347; the source closing at LF35427–35430 reads: Datum Romae apud sanctum Petrum sub - annulo piscatoris die octava februarii millesimo octingentesimo trigesimo tertio, pontificatus No- stri anno tertio. Its provenance note 1 (Ex Bullario Romano) is printed at LF35459 inside CCII's first-page foot block and is excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
