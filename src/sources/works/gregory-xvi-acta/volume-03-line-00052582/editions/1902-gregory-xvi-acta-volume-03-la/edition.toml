notes = "Apostolic letter CCXCVII grants the sisters of the Daughters of Charity of Lovere (diocese of Brescia) a plenary indulgence, applicable to the dead, on twenty-four days a year; intitulation, grant, perpetuity and non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF52591–52591; the source dating clause at LF52628–52631 reads: Datum Romae apud sanctam Mariam Ma- iorem sub annulo piscatoris die vigesima octava augusti millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
