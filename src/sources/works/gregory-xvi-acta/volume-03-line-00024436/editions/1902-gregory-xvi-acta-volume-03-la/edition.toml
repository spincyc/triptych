notes = "Letter CX tells Emperor Ferdinand that the dispensation from the second-degree impediment for Victor Emmanuel of Savoy and Archduchess Adelaide has been granted; royal address, intitulation, greeting, body and dating clause survive. Its provenance note1 is LF24494. Issuer evidence: GREGORIUS PP. XVI. at LF24452–24452; the source dating clause at LF24488–24491 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die decima nona augusti mil- lesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
