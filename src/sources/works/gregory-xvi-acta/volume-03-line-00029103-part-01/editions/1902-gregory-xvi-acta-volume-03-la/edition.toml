notes = "Letter CXLII to Queen Maria II announces the golden rose carried by the ablegate Stefano Vizzardelli; address, intitulation, body and dating clause survive. Its provenance note1 is LF29203. Issuer evidence: GREGORIUS PP. XVI. at LF29117–29117; the source dating clause at LF29169–29172 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima secunda mart. mil- lesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
