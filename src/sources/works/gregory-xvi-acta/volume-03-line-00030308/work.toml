description = "Apostolic letter CLIV raises Sydney to a metropolitan see with Hobart and Adelaide as suffragans; decree and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF30318–30318; the source dating clause at LF30371–30374 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda aprilis millesimo Octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. The witness abbreviates conventional formulae with “etc.” (“de venn. fratrum etc.”, LF30345; “non obstantibus etc.”, LF30369); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
