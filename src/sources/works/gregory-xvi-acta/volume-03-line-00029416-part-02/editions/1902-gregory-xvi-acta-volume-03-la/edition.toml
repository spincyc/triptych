notes = "Letter CXLVI informs Cardinal Sterckx and the Belgian bishops of Fornari’s promotion and thanks them; address, intitulation, body and dating clause survive. Its provenance note1 is LF29622. Issuer evidence: GREGORIUS PP. XVI. at LF29513–29513; the source dating clause at LF29551–29554 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava martii millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
