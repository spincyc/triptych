notes = "Encyclical CXLVIII to the Swiss bishops condemns cantonal decrees suppressing monasteries, declares alienations of their goods null and charges the bishops to warn purchasers; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF29651–29651; the source dating clause at LF29771–29774 reads: Datum Romae apud sanctum Petrum die prima aprilis millesimo octingentesimo quadra- gesimo secundo, pontificatus Nostri anno decimo secundo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
