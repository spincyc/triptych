notes = "Encyclical letter XXIII to Archbishop James Whitfield and suffragans (address LF4131–4133) acknowledges their provincial council, exhorts and blesses; LF4159 → LF4171 across provenance LF4162–4165 and page number LF4168; complete 23 April 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF4136–4136; the source closing at LF4201–4204 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris..die vigesima -tertia aprilis millesimo octingentesimo trigesimo quinto, | pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
