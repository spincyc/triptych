description = "Apostolic letter CCCIII heals any defects and confirms the pious institutions (girls’ school, hospice, Masses, seminary places, boys’ school) founded by Count Gaspare Spontini’s donation to the commune of Maiolati (diocese of Iesi); intitulation, narrative with the donor’s numbered dispositions 1–7, confirmation, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF53224–53224; the source dating clause at LF53456–53459 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima quarta ianuarii millesi- mo octingentesimo quadragesimo quinto, pon- tificatus Nostri anno decimo quinto. The dating clause (LF53456–53459) prints “die vigesima quarta ianuarii millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto” (24 January 1845 would fall in the fourteenth pontifical year); its calendar year and pontifical year disagree under the edition’s own placement, so the normalized date is left unknown rather than inferred (the printed day is 24 January). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
