notes = "The act tells Francis I that the impediments to Ferdinand's marriage with Maria Anna of Sardinia have been removed. Issuer evidence ’ GREGORIUS PP. XVI. at LF8445; own dating clause LF8481–8483 reads: Datum Romae die septimo februarii millesimo octingentesimo trigesimo primo, pontificatus No- stri anno primo,. Own provenance note LF8505 excluded as edition furniture. Refined body and full surrounding frame read literally. Printed date 7 February 1831 is retained although the edition places the letter among September 1831 acts. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
