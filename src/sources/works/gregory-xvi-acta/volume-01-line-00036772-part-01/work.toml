description = "Letter CCXII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF36782–36783) permits Mass in the private chapel of the town hall (Ayuntamento) of Madrid on council days and three patronal feasts, with satisfaction of the precept for those attending, and ends with its own 15 March 1833 closing at LF36876, before numeral CCXIII at LF36879. Issuer evidence is GREGORIUS PP. XVI. at LF36782–36782; the source closing at LF36873–36876 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quinta martii mil- lesimo octingentesimo trigesimo tertio, ponti- ficatus Nostri anno tertio. The caption block LF36772–36781 ends with an isolated speck (>). LF36846 (1 Ex Bullario Romano,) is its own provenance note inside the excluded block LF36846–36856 (with head specks and the running-title half ANNO). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
