notes = "Brief XXXII to Archbishop Manuel José Mosquera of Bogotá (address LF6176–6178) appoints him apostolic visitor of all regulars in New Granada; LF6205 → LF6218 across provenance/signature LF6208–6212 and running title LF6215; LF6353 → LF6361 across running title LF6356 and speck LF6359; LF6431 → LF6435 across page number LF6434; complete 19 May 1835 closing. LF6493 (a displaced fragment of XXXIII) is outside this act. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. ~- at LF6181–6181; the source closing at LF6487–6490 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima nona maii mille- simo octingentesimo trigesimo quinto, ponti- ficatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
