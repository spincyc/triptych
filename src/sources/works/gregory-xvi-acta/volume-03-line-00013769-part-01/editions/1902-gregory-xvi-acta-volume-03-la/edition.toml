notes = "Encyclical LVIII to all patriarchs, primates, archbishops and bishops reports the consecration of St Paul’s high altar and asks contributions for the basilica; address, intitulation, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF13788–13788; the source dating clause at LF14035–14038 reads: Datum Romae apud sanctum Petrum die vigesima prima decembris millesimo octingen- tesimo quadragesimo, pontificatus Nostri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
