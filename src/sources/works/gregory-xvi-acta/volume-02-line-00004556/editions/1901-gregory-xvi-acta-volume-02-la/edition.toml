notes = "Brief XXVII to the bishop of Ascoli (address LF4566–4567) commutes Giuditta Ferrucci’s testament in favour of Gaetano Ferrucci; LF4593 → LF4602 across provenance LF4596 and running title LF4599; complete closing LF4657–4660. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF4570–4570; the source closing at LF4657–4660 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris, die duodecima mati millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
