description = "Epistle CCCLXXVIII (OCR EK PPSSrO Ls) to Joanna, princess of Sardhana called Begum Sombre (address LF70431–70433, protocol LF70436, salutation LF70439–70440), thanks her for her gifts, approves her endowments for a seminary, the three vicariate seminaries and Agra, announces the appointment of the Capuchin Julius Caesar as bishop of Amathus and vicar apostolic of Sardhana and the knighthood of her nephew David, and ends with its own 17 September 1834 closing at LF70618–70621, before numeral CCCLXXIX (OCR CCCLAXIX.) at LF70624. Issuer evidence is GREGORIUS PP. XVI. at LF70436–70436; the source closing at LF70618–70621 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septima septembris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. The leaf-480 running title LF70428 is emitted between the left-column caption and the right-column address and lies outside the extent. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
