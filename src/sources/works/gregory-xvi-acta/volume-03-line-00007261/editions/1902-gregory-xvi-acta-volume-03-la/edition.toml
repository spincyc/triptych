notes = "The consistorial speech grants the pallium to Nicholas Isaiah Jacob, Babylonian patriarch, and reaches its complete final comparison with BenedictXIV’s grant. The substantive note7331–7350 belongs XIV and is preserved there; only XV provenance7351 and running title7354 are omitted as this act’s publishing furniture. Refined body and full surrounding frame read literally. Issuer evidence is 48 ACTA GREGORII PP. XVI. at LF7209–7209; the source closing at LF7272–7274 reads: HABITA IN CONSISTORIO SECRETO DIE VIGESIMA SEPTIMA APRILIS MILLESIMO OCTINGENTESIMO QUADRAGESIMO.  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
