notes = "Letter LXXXIV to the Hungarian bishops on mixed marriages, permitting passive assistance under stated conditions; address, intitulation, body with Pius VI and Pius VII citations, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF17567–17567; the source dating clause at LF17857–17860 reads: Datum Romae apud s. Petrum sub annulo piscatoris die trigesima aprilis millesimo octin- gentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
