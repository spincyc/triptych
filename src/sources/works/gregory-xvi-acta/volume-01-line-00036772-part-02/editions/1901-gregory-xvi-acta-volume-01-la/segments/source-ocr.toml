context = "Letter CCXIII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF36889–36892) separates the Sicilian estates (Lentini) from the see of Malta and assigns to it instead the goods of the Benedictine monastery of Catania in Malta and Gozo, and ends with its own 21 March 1833 closing at LF37029, before numeral CCXIV at LF37032. It runs past its catalog frame through the false heading LF36938. Issuer evidence is GREGORIUS PP. XVI. at LF36889–36889; the source closing at LF37026–37029 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima prima martii millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. LF36938 MDCCCXXXII, (catalog heading of line-00036938) is the second half of the running title of source page 239, excluded with a speck (LF36935) and page number 239 (LF36941). LF37010 (t Ex Bullario Romano.) is its own provenance note. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
