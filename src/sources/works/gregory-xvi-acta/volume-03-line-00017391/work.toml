description = "Letter LXXXII urges Bishop Gutkowski of Podlachia to resign his see for the peace of his flock; greeting, body, Augustine quotation, blessing and dating clause survive. The printing begins at the greeting and prints no address line or GREGORIUS PP. XVI intitulation; nothing is omitted by this review. Issuer evidence: ACTA GREGORIT PP. XVI. at LF17539–17539; the source dating clause at LF17475–17477 reads: Datum Romae die septima aprilis millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
