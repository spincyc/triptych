description = "Consistorial allocution LXXIII creates and publishes Louis-Jacques-Maurice de Bonald and reserves another cardinal in pectore; it runs from “Venerabiles fratres” LF16134 to the closing Amen LF16208. Its provenance note1 is LF16211. Issuer evidence: ACTA GREGORII PP. XVI. at LF16145–16145; the source dating clause at LF16129–16131 reads: HABITA IN CONSISTORIO SECRETO DIE PRIMA MARTII MILLESIMO OCTINGENTESIMO QUADRAGESIMO PRIMO, The allocution has no dating clause; its date is taken from the excluded edition caption. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
