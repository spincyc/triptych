notes = "Apostolic letter CCCLXV entrusts the Madurai mission as a vicariate apostolic to a Jesuit with episcopal character under three conditions and defines its limits; intitulation, ad perpetuam formula, narrative, conditions 1–3, limits, non obstantibus clause and dating clause survive. Its provenance note1 is LF76296. Issuer evidence: GREGORIUS PP. XVI. at LF76166–76166; the source dating clause at LF76252–76255 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima nona maii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
