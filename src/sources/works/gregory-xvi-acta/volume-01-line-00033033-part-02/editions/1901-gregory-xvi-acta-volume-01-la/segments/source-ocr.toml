context = "Letter CXCI, addressed to the bishop of Assisi (LF33133–33134), commits him to unite the vacant pious legacy Dreuccioli perpetually to the parish church of Santa Maria delle Grazie at Castel del Palazzo for its rector Benvenuto Franceschini, with the decree of validity, Non obstantibus and the complete 20 December 1832 closing at LF33309, immediately before numeral CXCII at LF33312. The running title ACTA GREGORII PP. XVI. at LF33116 heads its column; its own provenance note 1 (Ex Bullario Romano, marker after Dreuccioli at LF33130) is printed at LF33113 at the foot of the preceding column, after CXC's subscription. Issuer evidence is GREGORIUS PP. XVI. at LF33137–33137; the source closing at LF33306–33309 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima decembris mil- lesimo octingentesimo trigesimo secundo, pon- tificatus Nostri anno secundo. LF33262 MDCCCXXXII. (catalog heading of line-00033262) is the second half of the source-page-215 running title, excluded with the garbled page number Oris (LF33265). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
