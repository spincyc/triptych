notes = "Motu proprio chirograph CCCLXII (Italian), addressed to Cardinal Ludovico Gazzoli, prefect of the Congregation of Waters and Roads and president of the Acqua Felice commission (LF68118–68124), approves the commission's work and authorizes the general reform of the Acqua Felice distributions on Professor Cavalieri's report, and ends with its own dating Dato dal Nostro palazzo apostolico al Quirinale questo di sei agosto mille ottocento trenta quattro (LF68455–68457) and the subscription GREGORIUS PP. XVI. (LF68460), before numeral CCCLXIII (OCR ‘- COCLXIN;) at LF68463. Issuer evidence is GREGORIUS PP. XVI. at LF68460–68460; the source closing at LF68455–68457 reads: Dato dal Nostro palazzo apostolico al Qui- rinale questo di sei agosto mille ottocento trenta quattro. The proposal frames line-00068176 (Il.) and line-00068185 (Ill.) begin at these item numerals inside this act. The page number 447 (OCR : : A47, LF68227) and 448 (OCR 448 nove, LF68296) are excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
