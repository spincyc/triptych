notes = "The motu proprio separates Yun-nan from Sutchuen and entrusts the distinct apostolic vicariate to the Paris Foreign Missions seminary, retaining complete operative conditions and closing. The substantive Assisi note11719–11759 belongs XXXVII and is retained there, not discarded; only source citation11761 and running caption11764 are this act’s omitted publishing furniture. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF11693–11693; the source closing at LF11792–11795 reads: Datum in Arce Gandulphi sub annulo pisca- toris die vigesima octava augusti millesimo octingentesimo quadragesimo, pontiticatus No- stri anno decimo.. The witness leaves conventional terminal boilerplate as “Haec volumus etc.” at LF11790; it remains literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
