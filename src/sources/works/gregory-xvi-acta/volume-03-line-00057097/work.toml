description = "Indult CCCXXX grants the first dignitary and canons of the collegiate church of Fucecchio (diocese of San Miniato) the violet collar, rochet and ermine-trimmed mozzetta; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF57106–57106; the source dating clause at LF57175–57179 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima secunda augusti millesimo octingentesimo quadragesi- mo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
