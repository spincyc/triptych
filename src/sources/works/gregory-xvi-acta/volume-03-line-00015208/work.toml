description = "Letter LXVIII to the Maronite patriarch Joseph Habaisci on relief after the Lebanon war; address (foot of leaf 115), intitulation, greeting, body and the dating clause split by the running title survive. Issuer evidence: ts GREGORIUS PP. XVI. at LF15235–15235; the source dating clause at LF15305–15307 reads: piscatoris die decima sexta februar. millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. The native intitulation and greeting lines carry isolated left-margin marks OCR’d “ts” and “re” (LF15235–15236, separated by gaps of 151 and 170 pixels from the printed words); they remain literal and form part of the printed-attribution literal “ts GREGORIUS PP. XVI.”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-03"]
