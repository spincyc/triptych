context = "Letter LXVIII to the Maronite patriarch Joseph Habaisci on relief after the Lebanon war; address (foot of leaf 115), intitulation, greeting, body and the dating clause split by the running title survive. Issuer evidence: ts GREGORIUS PP. XVI. at LF15235–15235; the source dating clause at LF15305–15307 reads: piscatoris die decima sexta februar. millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. The native intitulation and greeting lines carry isolated left-margin marks OCR’d “ts” and “re” (LF15235–15236, separated by gaps of 151 and 170 pixels from the printed words); they remain literal and form part of the printed-attribution literal “ts GREGORIUS PP. XVI.”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete selected extent and at least twenty literal-LF lines of context on each side were read in this lane’s exhaustive in-order read of LF11760–23900 (claim LF11798–23843). Every nonblank LF line of the span maps 1:1 to a native XML LINE (zero token mismatches; line-geometry.json), and leaf/column/back-jump, indent, intra-line gap and short-line geometry screens were dispositioned; no general image collation is claimed. Selected bounds [[15218, 15220], [15235, 15299], [15305, 15307]]."
