context = "Bull CCXLIII, at Queen Maria II’s request, suppresses the Lisbon patriarchal and collegiate chapters, empowers Cardinal Saraiva to designate a new patriarchal church, constitutes its chapter of dignitaries, canons, beneficiaries and chaplains with royal patronage and dotation, and closes with executor, decernentes, non obstantibus, transumpt, Nulli ergo and incarnation-year dating clauses (quinto idus novembris = 9 November). Its numeral LF42379 (OCR “@GCXLIN.”) was missed by the detector. Issuer evidence: GREGORIUS EPISCOPUS at LF42389–42389; the source dating clause at LF42795–42798 reads: Datum Romae apud s. Petrum anno incar- nationis dominicae millesimo octingentesimo quadragesimo tertio, quinto idus novembris, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
