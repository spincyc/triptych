description = "Apostolic letter CXIII empowers Bishop Pérocheau, vicar apostolic of Sichuan, to choose a coadjutor with succession for the Korean vicar apostolic and to consecrate him bishop of Bellina; address, intitulation, body and dating clause survive. Its provenance note1 is LF24776. Issuer evidence: GREGORIUS PP. XVI. : at LF24666–24666; the source dating clause at LF24770–24773 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima septima septemb. millesimo octingentesimo ‘quadragesimo primo, pontificatus Nostri anno decimo primo. The witness abbreviates conventional formulae with “etc.” (“Volumus tamen etc.”, LF24768); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
