description = "Letter CCCXXVII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF60718–60719) recalls the golden rose given to St Mark's and grants a yearly plenary indulgence for visiting the patriarchal church of Venice on the fourth Sunday of Lent; it ends with its own closing die vigesima aprilis 1834 at LF60792, before numeral CCCXXVIII at LF60795. Issuer evidence is GREGORIUS PP. XVI. at LF60718–60718; the source closing at LF60789–60792 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima aprilis millesimo octin- gentesimo trigesimo quarto, pontificatus Nostri anno quarto. LF60763 (1 Ex Bullario Romano,) is its own provenance note, excluded with the running-title half GREGORII PP. XVI. (LF60766). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
