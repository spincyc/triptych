context = "Letter CCCLXXII (protocol LF69500–69503) erects the metropolitan cathedral of Vercelli as a minor basilica, ending with its own 26 August 1834 closing at LF69597–69600 at the head of leaf 475, before numeral CCCLXXIII at LF69603. Issuer evidence is GREGORIUS PP. XVI. at LF69500–69500; the source closing at LF69597–69600 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima sexta au- gusti millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. At LF69588 the OCR reads risque contrariis Pertaiea a susie for the printed line ending quibuscumque.; the WORDs stay in place on that line and are retained literally as misread OCR; nothing is displaced. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[69500, 69522], [69524, 69590], [69595, 69600]] selected from address/protocol LF69500 through the source closing LF69600. Read in full in acquired LF order within the lane read LF64380-74480 (claim LF64569-74417 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry was checked for the selected extent (column, back-jump, left/right-gap, intra-line and vertical-gap screens); no general image collation is claimed."
