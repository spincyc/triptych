description = "Indult CCCXXIV grants the canons of the collegiate church of S. Giacomo at Corte the rochet and the black cappino lined with red silk; intitulation, ad perpetuam formula, narrative, grant, non obstantibus clause and dating clause survive. Its provenance note1 is LF56455. Issuer evidence: GREGORIUS PP. XVI. at LF56396–56396; the source dating clause at LF56449–56452 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima iunii mille- simo octingentesimo quadragesimo quinto, pon- tificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
