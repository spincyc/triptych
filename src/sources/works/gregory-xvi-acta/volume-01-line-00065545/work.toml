description = "Bull CCCXLVII (protocol GREGORIUS EPISCOPUS servus servorum Dei ad perpetuam rei memoriam LF65553–65557) fixes the limits of the dioceses of the United States (Baltimore, Boston, New York, Philadelphia, Charleston, Mobile, New Orleans, Cincinnati, Detroit, Bardstown, St Louis, Vincennes), names the archbishop of Baltimore executor, and ends with Nulli ergo and its own closing decimo quinto kalendas iulias 1834 (17 June 1834) at LF65830–65833, before numeral CCCXLVIII at LF65836. Issuer evidence is GREGORIUS EPISCOPUS at LF65553–65553; the source closing at LF65830–65833 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo trigesimo quarto, decimo quinto kalendas iulias, pontificatus Nostri anno quarto. The diocesan list LF65660–65734 is the bull's own text in source order. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
