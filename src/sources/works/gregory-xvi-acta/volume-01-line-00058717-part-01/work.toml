description = "Epistle CCCXII to the bishop of Basel (address LF58743, protocol GREGORIUS PP. XVI LF58746, salutation LF58749–58750) deplores the expulsion of the parish priest of Uffikon and the appointment of Christoph Fuchs, urges him to forbid clerics his lectures and to resist plans to join St. Gallen to Basel, and ends with its own closing die octava martii 1834 at LF58867; its note 1 (Roskovány, pag. 129) is LF58870. Issuer evidence is GREGORIUS PP. XVI at LF58746–58746; the source closing at LF58865–58867 reads: Datum Romae apud sanctum Petrum die octava martii millesimo octingentesimo trigesi- mo guarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
