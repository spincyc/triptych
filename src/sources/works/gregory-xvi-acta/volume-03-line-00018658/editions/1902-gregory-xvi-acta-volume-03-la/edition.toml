notes = "Apostolic letter XCI raises the Fribourg Sodality of the Angels to an archsodality with aggregation powers; dispositive clause, non obstantibus and dating clause survive. Its provenance note1 is LF18773. Issuer evidence: GREGORIUS PP. XVI. at LF18666–18666; the source dating clause at LF18740–18743 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima octaya maii millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
