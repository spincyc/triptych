context = "Letter CCCXXV to the archbishops and bishops of the grand duchy of Tuscany deplores the government circular forbidding foreign priests to preach in the grand duchy, sets out the Church’s right to send preachers and asks the bishops to remonstrate with Grand Duke Leopold; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF56487–56487; the source dating clause at LF56682–56685 reads: Datum Romae apud s. Petrum die vigesima octava iunii millesimo octingentesimo quadra- gesimo quinto, pontificatus Nostri anno de- cimo quinto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF56524 “|”; LF56575 “€08.....”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
