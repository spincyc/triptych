notes = "Letter CCX, addressed to Samuel Stefanowicz, provost of the Armenian metropolitan church of Lviv (LF36482–36484), confirms the imperial nomination and provides him to that archiepiscopal see vacant by the death of Caietanus Warteresiewicz, with faculty of consecration, and ends with its own 13 March 1833 closing at LF36652, before numeral CCXI at LF36655. Issuer evidence is GREGORIUS PP. XVI. at LF36487–36487; the source closing at LF36649–36652 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima tertia martii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. The block LF36526–36535 holds a foot speck, CCIX's note 1, this letter's note 2 (Ex Iure Pont. de P. F.) and the running-title half ANNO; LF36608–36611 is the second half MDCCCXXXIII, and page number 237. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
