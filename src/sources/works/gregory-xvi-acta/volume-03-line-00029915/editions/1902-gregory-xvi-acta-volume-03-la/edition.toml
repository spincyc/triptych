notes = "Apostolic letter CL heals defective provisions of Sabina benefices and exempts their holders from obtaining apostolic letters; decree, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF29927–29927; the source dating clause at LF30081–30084 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quinta aprilis millesimo octin- gentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
