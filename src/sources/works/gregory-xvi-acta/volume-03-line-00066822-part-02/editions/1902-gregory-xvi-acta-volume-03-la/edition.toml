notes = "Apostolic letter CCCLV divides the vicariate of Zhejiang and Jiangxi into two vicariates apostolic, adding four districts of Jiangsu to that of Zhejiang; intitulation, ad perpetuam formula, narrative, motu proprio division, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF66980. Issuer evidence: GREGORIUS PP. XVI. at LF66910–66910; the source dating clause at LF66974–66977 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima martii millesimo octingentesimo quadragesimo sexto, pontificatus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
