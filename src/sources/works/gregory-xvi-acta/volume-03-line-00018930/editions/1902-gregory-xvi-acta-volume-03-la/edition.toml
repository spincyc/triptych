notes = "Indult XCIV communicates to Verzeri’s institute the indulgences of the French Dames du Sacré-Cœur; transumpt clause and dating clause survive. Its provenance note1 is LF19042. Issuer evidence: GREGORIUS PP. XVI. at LF18941–18941; the source dating clause at LF18998–19001 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima prima maii millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
