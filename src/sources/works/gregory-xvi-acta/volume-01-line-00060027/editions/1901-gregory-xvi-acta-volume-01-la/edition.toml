title = "Cum ex iniuncto Nobis — Segregatio reddituum paroeciae S. Aegidii in Gambettola pro paroeciis pauperibus Caesenatensibus — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1901."
