notes = "Letter CCCXXIII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF60039–60042) orders the bishop of Cesena to separate forty-five scudi of annual revenue from the vacant parish of S. Egidio at Gambettola for poorer parishes and ends with its own 21 April 1834 closing at LF60171, before numeral CCCXXIV at LF60174. Issuer evidence is .GREGORIUS PP. XVI. at LF60039–60039; the source closing at LF60168–60171 reads: Datum. Romae apud sanctum Petrum sub annulo piscatoris die vigesima prima aprilis mil- lesimo octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. The block LF60054–60063 holds CCCXXII's note 1, a speck, this letter's note 2 (Ex eodem Bullario.) and page number 392; LF60130–60133 is CCCXXIV's note 1 with the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
