notes = "Brief CLXXXI separates Liaotung from the diocese of Peking into a vicariate apostolic with jurisdiction over the unassigned parts of Mongolia and Manchuria; LF39751 → LF39760 across own provenance LF39754 and running title LF39757; complete 14 August 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF39698–39698; the source closing at LF39773–39776 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quarta augusti millesimo octingentesimo trigesimo oc- tavo, pontificatus Nostri anno octavo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
