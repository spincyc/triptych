notes = "Letter CCCXXII (OCR CCCXXIL.) to Giuseppe Mazzinghi, Florentine patrician born in London (address LF59922–59924, protocol GREGORIUS PP, XVI. LF59927), confirms to him and his first-born descendants the title of count of the Lateran palace and ends with its own 18 April 1834 closing at LF60024, before numeral CCCXXIII at LF60027. The catalog's issuer flag reflects only the OCR comma in the protocol. Issuer evidence is GREGORIUS PP, XVI. at LF59927–59927; the source closing at LF60021–60024 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima octava aprilis millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. - Its provenance note 1 is printed at LF60054 in CCCXXIII's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
