context = "Letter CCXCVI, addressed to the bishop of Rhodiopolis, apostolic vicar and visitor of Forlì (LF50963–50966), commissions him to permit the door from Canon Zirardini's rural house into his public oratory, without immunity for the house, and ends with its own 7 January 1834 closing at LF51044, before numeral CCXCVII at LF51047. Issuer evidence is GREGORIUS PP. XVI. . at LF50969–50969; the source closing at LF51041–51044 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die septima ianuarii mille- simo octingenteismo trigesimo quarto, pontifi- catus Nostri anno tertio. The caption block and the address share one OCR paragraph; the caption is excluded line-exactly (LF50952–50962) and the address begins at LF50963. Its provenance note 1 is printed at LF51100 in CCXCVII's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[50963, 51018], [51023, 51044]] selected from address/protocol LF50963 through the source closing LF51044. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
