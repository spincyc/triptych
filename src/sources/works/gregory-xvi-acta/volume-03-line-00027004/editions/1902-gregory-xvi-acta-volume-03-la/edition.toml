notes = "Apostolic letter CXXVII raises Monte San Giovanni (diocese of Veroli) to a city; decree, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF27012–27012; the source dating clause at LF27135–27138 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima ianuarii millesimo octin- gentesimo quadragesimo secundo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
