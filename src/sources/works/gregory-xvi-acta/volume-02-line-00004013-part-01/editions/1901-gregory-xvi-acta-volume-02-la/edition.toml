notes = "Brief XXII (OCR XXII.) makes Domenico Ponzileoni a Golden Militia knight and Lateran count; the OCR emits the page-37 running title ANNO MDCCCXXXV. LF4089 and page number LF4092 at the column end, excluded; LF4086 → LF4093 continues normally; complete 10 April 1835 closing. Own provenance LF4162 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF4026–4026; the source closing at LF4116–4119 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima aprilis millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
