description = "Apostolic letter CCCLIII separates the province of Guizhou (Kouei-Kou) from the vicariate of Sichuan and erects it into a vicariate apostolic; intitulation, ad perpetuam formula, narrative, motu proprio erection, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF66845. Issuer evidence: GREGORIUS PP. XVI. at LF66755–66755; the source dating clause at LF66816–66819 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima martii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
