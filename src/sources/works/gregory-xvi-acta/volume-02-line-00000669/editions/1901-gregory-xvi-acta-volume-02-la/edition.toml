notes = "Brief IV appoints Bartholomew Altemir Franciscan minister general without a chapter; own provenance LF713 and page number LF716 excluded; LF783 is V’s provenance at the foot of artifact page 14, LF786 a gutter speck, LF789 the running title; LF780 praedi- → LF792 cti ordinis; complete 30 January 1835 closing LF811–814. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF678–678; the source closing at LF811–814 reads: Datum Romae apud s. Petrum sub annulo piscatoris die trigesima ianuarii millesimo octin- gentesimo trigesimo quinto, pontificatus No- stri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
