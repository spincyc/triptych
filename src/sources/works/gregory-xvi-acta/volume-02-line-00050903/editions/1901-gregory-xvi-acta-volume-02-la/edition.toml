notes = "Indult CCXXXI grants the dignitaries and canons of Comacchio cathedral a violet tassel on the hat; LF50961 → LF50967 across page number 347 LF50964; complete 30 July 1839 closing. The detached word Mandamus LF50900 of the preceding letter lies before this indult’s heading and is not selected. Own provenance LF51034 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF50914–50914; the source closing at LF50985–50988 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die trigesima iulii millesimo octingentesimo trigesimo nono, pon- tificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
