notes = "Allocution CCXVII, under its own dated title ALLOCUTIO HABITA IN CONSISTORIO SECRETO DIE DECIMA QUINTA APRILIS ANNO MILLESIMO OCTINGENTESIMO TRIGESIMO TERTIO (LF37548–37553, retained as the speech's own title and only dating), addresses the cardinals (Venerabiles fratres LF37556), declares Cardinal Francesco Serra Cassano and creates Lorenzo Mattei and Castruccio Castracane, and ends with the creation formula and In nomine Patris … Amen. at LF37687–37688, before numeral CCXVIII at LF37691. Issuer evidence is ACTA’ GREGORIL PP. XVI. at LF37661–37661; the source closing at LF37551–37553 reads: HABITA IN CONSISTORIO SECRETO DIE DECIMA QUINTA APRILIS ANNO MILLESIMO OCTINGENTESIMO TRIGESIMO TERTIO Only the Bernasconi numeral and synopsis (with trailing specks) LF37532–37545 are omitted before the title. LF37594 (t Ex Archivio Brevium ad Principes.) is its own provenance note; LF37661–37665 is the running title with head-margin specks. The isolated speck * at LF37669 is retained literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
