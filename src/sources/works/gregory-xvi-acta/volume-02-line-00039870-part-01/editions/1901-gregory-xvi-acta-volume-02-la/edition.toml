notes = "Brief CLXXXIII recounts Rome’s deliverance from cholera through the Virgin, the crowning of the Salus populi Romani image on the Assumption and confirms and extends the privileges of the Liberian basilica and chapter; LF39890 → LF39906 across a mark LF39893, CLXXXII’s provenance LF39896, own provenance LF39899–39900 and page number 272 LF39903; across running titles LF39969, LF40036, LF40240, signature LF40103, page numbers LF40106 (OCR a) and LF40177 (OCR ae) and sheet number LF40174; complete 15 August 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF39883–39883; the source closing at LF40273–40276 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quinta augusti millesimo octingentesimo trigesimo oc- tavo, pontificatus Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
