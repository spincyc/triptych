notes = "Apostolic letter CCLXXXIX grants the dignitaries and canons of the co-cathedral of Makarska a pectoral cross, rochet and mozzetta and the choral vicars the almuce; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF51989 at the foot of leaf 377. Issuer evidence: GREGORIUS PP. XVI. at LF51877–51877; the source dating clause at LF51948–51951 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima sexta iulii millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
