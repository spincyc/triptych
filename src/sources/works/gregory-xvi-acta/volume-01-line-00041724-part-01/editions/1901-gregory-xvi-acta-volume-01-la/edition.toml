notes = "Epistle CCXLI to Archduke Leopold, Grand Duke of Tuscany (address LF41733–41735, protocol LF41738, salutation LF41741–41742) congratulates him on his marriage to Maria Antonia of the Two Sicilies and ends with its own 4 July 1833 closing at LF41780–41783, before numeral CCXLII (OCR COXLM.) at LF41786. Issuer evidence is GREGORIUS PP. XVI. at LF41738–41738; the source closing at LF41780–41783 reads: Datum Romae apud sanctum Petrum = sub annulo piscatoris die quarta iulii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
