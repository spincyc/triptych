context = "Letter CCCLXXXIV (protocol LF71900–71903) restores the Illyrian college at Loreto with its privileges under the government of the Society of Jesus, fixes its staff, pupils and endowment from the Holy House and the town, and ends with its own 29 September 1834 closing at LF72140–72149, before numeral CCCLXXXV at LF72152. Issuer evidence is GREGORIUS PP. XVI. at LF71900–71900; the source closing at LF72147–72149 reads: rem sub annulo piscatoris die vigesima nona septembris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. The sheet signature 60 and page number 474 (LF72143–72146) intervene inside the closing between Datum Romae apud sanctam Mariam Maio- (LF72140) and rem sub annulo piscatoris (LF72147) and are excluded; the date is therefore evidenced by LF72147–72149. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[71900, 71909], [71914, 71982], [71984, 72061], [72069, 72073], [72075, 72142], [72147, 72149]] selected from address/protocol LF71900 through the source closing LF72149. Read in full in acquired LF order within the lane read LF64380-74480 (claim LF64569-74417 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry was checked for the selected extent (column, back-jump, left/right-gap, intra-line and vertical-gap screens); no general image collation is claimed."
