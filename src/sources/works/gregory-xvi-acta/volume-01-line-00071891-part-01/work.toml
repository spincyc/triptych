description = "Letter CCCLXXXIV (protocol LF71900–71903) restores the Illyrian college at Loreto with its privileges under the government of the Society of Jesus, fixes its staff, pupils and endowment from the Holy House and the town, and ends with its own 29 September 1834 closing at LF72140–72149, before numeral CCCLXXXV at LF72152. Issuer evidence is GREGORIUS PP. XVI. at LF71900–71900; the source closing at LF72147–72149 reads: rem sub annulo piscatoris die vigesima nona septembris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. The sheet signature 60 and page number 474 (LF72143–72146) intervene inside the closing between Datum Romae apud sanctam Mariam Maio- (LF72140) and rem sub annulo piscatoris (LF72147) and are excluded; the date is therefore evidenced by LF72147–72149. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
