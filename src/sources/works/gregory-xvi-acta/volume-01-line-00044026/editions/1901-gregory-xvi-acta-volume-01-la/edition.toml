notes = "Epistle CCLVII to King William I of the Netherlands (address LF44034–44035, protocol LF44038, salutation Serenissime et potentissime rex. LF44041) congratulates him on the birth of a princess to Prince Frederick and Louise of Prussia and ends with its own 22 August 1833 closing at LF44086–44089, before numeral CCLVIII at LF44092. Issuer evidence is GREGORIUS PP. XVI. at LF44038–44038; the source closing at LF44086–44089 reads: Datum Romae apud s, Petrum sub annulo piscatoris die vigesima secunda augusti mille- simo Octingentesimo trigesimo tertid, pontifi- catus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
