description = "Apostolic letter CCXXXIV grants the parish priests of Pesaro the rochet and black mozzetta with purple trimming and sash; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF41367. Issuer evidence: GREGORIUS PP. XVI. at LF41248–41248; the source dating clause at LF41314–41318 reads: Datum Romae apud sanctam Mariam Ma- iorem sub annulo piscatoris die decima quinta septembris millesimo octingentesimo quadrage- simo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
