notes = "Brief CCXVII (address LF48170–48172) appoints Francis Villardell, archbishop of Philippi and apostolic delegate at Aleppo, apostolic visitor of the whole Chaldean patriarchate; the page-328 running title LF48167 between synopsis and address and the own provenance LF48243 are excluded; complete 28 May 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF48175–48175; the source closing at LF48213–48216 reads: Datum Romae apud s, Petrum sub annulo piscatoris, die vigesima octava maii millesimo octingentesimo trigesimo nono, _pontificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
