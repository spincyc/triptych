description = "Apostolic letter CCLXVIII confirms the Franciscan minister general’s decree of 12 May 1842 separating the Belgian Recollect convents from the Lower German province and erecting the province of St Joseph of Belgium, dispensing from the required number of convents; intitulation, narrative, confirmation, non obstantibus clause and dating clause survive. Its provenance note1 is LF45997. Issuer evidence: GREGORIUS PP. XVI. at LF45919–45919; the source dating clause at LF45991–45994 reads: Datum Romae apud s. Petrum sub annulo piscatoris die octava martii millesimo octingen- tesimo quadragesimo quarto, pontificatus No- stri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
