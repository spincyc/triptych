notes = "Consistorial allocution CCX reports on the Portuguese church after the Carreira embassy and the Capaccini mission and announces the promotion of Francisco de São Luís (Lisbon), Pedro Paulo de Figueiredo (Braga) and Guilherme Henriques de Carvalho (Leiria); it runs from “Venerabiles fratres” LF37767 to “… exemploque proficiant.” LF37903, where the printed speech ends. Issuer evidence: ACTA GREGORII PP. XVI. at LF37859–37859; the source dating clause at LF37763–37764 reads: DIE TERTIA APRILIS MILLESIMO OCTINGENTESIMO QUADRAGESIMO TERTIO. The allocution has no dating clause; its date is taken from the excluded edition caption. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
