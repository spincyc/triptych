notes = "Brief CLXXXIX empowers the bishop of Recanati and Loreto to crown the image of the Madonna del Buon Cuore (Salimbeni) in the collegiate church of Castelfidardo and grants a plenary indulgence; LF41380 → LF41387 across running title LF41383 and a mark LF41386; LF41445 → LF41454 across own provenance LF41448 and running title LF41451; complete 2 October 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF41339–41339; the source closing at LF41472–41475 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die secunda octobris millesimo octingentesimo trigesimo octavo, pon- tificatus Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
