description = "Apostolic letter CCVIII erects the Tunis mission into an apostolic vicariate; intitulation, narrative, motu proprio erection, decernentes clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37593–37593; the source dating clause at LF37631–37638 reads: Datum Romae apud sanctum Petrum sub -annulo piscatoris die vigesima prima martii millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF37634 “-annulo”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
