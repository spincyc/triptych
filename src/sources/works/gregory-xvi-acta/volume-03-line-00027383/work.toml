description = "Allocution CXXX announces the division of the Sabina diocese, the new see of Mandela and the abbatial titles; it runs from “Venerabiles fratres,” LF27396 to “succedant.,” LF27487. Its provenance note1 is LF27518. Issuer evidence: ACTA GREGORII PP. XVI. at LF27448–27448; the source dating clause at LF27390–27393 reads: HABITA IN CONSISTORIO SECRETO DIE VIGESIMA QUARTA IANUARII MILLESIMO OCTINGENTESIMO QUADRAGESIMO SECUNDO. The allocution has no dating clause; its date is taken from the excluded edition caption. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
