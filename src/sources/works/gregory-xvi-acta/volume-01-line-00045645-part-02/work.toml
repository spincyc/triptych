description = "Letter CCLXV to the archbishop of Lucca (address LF45742–45743, protocol LF45746) commits him to found Clemente Strambi's daily-Mass chaplaincy at the altar of St Roch in San Lorenzo at Vaccoli, with nomination of a poor cleric and the rural-oratory option, and ends with its own 13 September 1833 closing at LF45871–45874, before numeral CCLXVI at LF45877. Issuer evidence is GREGORIUS PP. XVI. at LF45746–45746; the source closing at LF45871–45874 reads: Datum Romae apud sanctam Mariam Maio- ram sub annulo piscatoris die decima tertia septembris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
