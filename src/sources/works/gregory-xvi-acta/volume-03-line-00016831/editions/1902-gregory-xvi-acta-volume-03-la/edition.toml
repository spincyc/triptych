notes = "Apostolic letter LXXVIII praises Archbishop d’Astros and commends his Toulouse congregation of priests; intitulation, ad futuram formula, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF16843–16843; the source dating clause at LF16949–16952 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima sexta mart. millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
