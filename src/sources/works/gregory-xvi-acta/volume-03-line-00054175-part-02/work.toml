description = "Apostolic letter CCCVII, at Bishop Giuseppe Antonio Borghi’s request, separates Nepal, Bihar and Sikkim from the Agra vicariate and erects the apostolic vicariate of Patna; intitulation “GREGORIUS PP. XVI. ad futuram rei memoriam”, narrative, erection, abbreviated decernentes clause and dating clause survive. Its numeral LF54255 (OCR “CeGVET.”) was missed by the detector; its provenance note1 is LF54360 at the foot of leaf 394. Issuer evidence: GREGORIUS PP. XVI. at LF54265–54265; the source dating clause at LF54326–54329 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima februarii millesimo octin- gentesimo quadragesimo quinto , pontificatus Nostri anno decimo quinto. The witness abbreviates conventional formulae with “etc.” (“Pastoralis officii etc. munus”, LF54269; “fo- re ‘etc.”, LF54323–54324); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
