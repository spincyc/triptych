notes = "Letter XLIII to Frederick William IV condoles on his father’s death, congratulates him on his accession and asks free exercise for Catholics; royal address, intitulation, salutem, body and dating clause survive. Its provenance note1 is LF12203 (the second note1 on leaf 93, LF12206, belongs to XLIV). Issuer evidence: GREGORIUS PP. XVI. at LF12111–12111; the source dating clause at LF12159–12162 reads: Datum in Arce Gandulphi sub annulo pi- scatoris die prima septemb. millesimo octin- gentesimo quadragesimo , pontificatus Nostri anno decimo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
