notes = "Brief CXXV withdraws the Discalced Carmelite nuns of S. Teresa al Quirinale from the friars’ jurisdiction and subjects them to the cardinal vicar; a mark LF27731 after the protocol; LF27763 → LF27772 across running title LF27766 and page number 187 LF27769; complete 19 January 1837 closing (the print dates it anno septimo). Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF27728–27728; the source closing at LF27826–27829 reads: Datum ROomae apud s. Petrum sub annulo piscatoris die decima nona ianuarii millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
