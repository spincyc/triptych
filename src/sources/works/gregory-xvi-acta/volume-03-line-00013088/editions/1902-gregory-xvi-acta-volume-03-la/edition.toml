notes = "Letter L (numeral OCR’d “Li”) accredits Scipione Fabbrini as internuncio to Pedro II; address, intitulation, body and dating clause survive. Provenance note1 LF13181 belongs to L. Issuer evidence: GREGORIUS PP. XVI. at LF13100–13100; the source dating clause at LF13150–13153 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die quinta novembris millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
