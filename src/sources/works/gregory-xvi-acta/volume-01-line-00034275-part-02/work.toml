description = "Bull CXCIX (protocol GREGORIUS EPISCOPUS servus servorum Dei ad perpetuam rei memoriam LF34412–34416) declares, at the request of Emperor Francis I, the dioceses of Senj and Modruš (Corbavia) really distinct, with separate capitular vicars during vacancies, names Archbishop Peter Klobusiczky of Kalocsa executor, and closes with Nulli ergo, the sanction and its own dating clause Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio (LF34670–34673), before numeral CC at LF34676. Issuer evidence is GREGORIUS EPISCOPUS “servus servorum Dei at LF34412–34413;  The printed dating clause gives the incarnation year 1833 and pontifical year 3 but no day or month, so the normalized date is left unknown rather than inferred. LF34499 (t Ex Bullario Romano.) is its own provenance note 1; LF34641 (Dy) is a head-margin speck of native leaf 243. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
