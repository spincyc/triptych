context = "Letter CCCLXXIII to Francis IV, duke of Modena, permits secular tribunals to judge civil causes of clerics and certain criminal causes with safeguards, and the establishment of diocesan commissions to administer vacant benefices; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF77008–77008; the source dating clause at LF77135–77139 reads: Datum Romae apud s, Petrum die trigesima aprilis millesimo octingentesimo quadragesimo primo. The witness abbreviates conventional formulae with “etc.” (“non obstantibus apostolicis ac in universalibus etc.”, LF77125–77126); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
