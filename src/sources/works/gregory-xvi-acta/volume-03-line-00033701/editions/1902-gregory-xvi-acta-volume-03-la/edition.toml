notes = "Letter CLXXXI to Hermann von Vicari, bishop of Macra and capitular vicar of Freiburg, on the Sartorius catechism, clerical doctrine, visitation, mixed marriages and the 1830 ordinances; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF33723–33723; the source dating clause at LF33964–33967 reads: Datum Romae apud sanctum Petrum die vigesima quarta octobris millegimo octingente- simo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
