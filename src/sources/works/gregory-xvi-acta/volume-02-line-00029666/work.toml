description = "Bull CXXXVI (GREGORIUS EPISCOPUS LF29674) withdraws Chiapas from the metropolitan of Guatemala and makes it suffragan of Mexico, executor the bishop of Tlaxcala; LF29702 → LF29714 across CXXXV’s provenance LF29705, own provenance LF29708 and running title LF29711; LF29780 → LF29789 across signature LF29783 and page number 201 LF29786; LF29860 → LF29869 across sheet number 26 LF29863 and page number 202 LF29866; complete closing dated septimo kalendas maias 1837 = 25 April 1837. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS EPISCOPUS at LF29674–29674; the source closing at LF29930–29933 reads: Datum Romae apud sanctum Petrum anno incarnationis: dominicae millesimo octingente- simo trigesimo septimo, septimo kalendas ma- ias, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
