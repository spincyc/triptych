notes = "Review extent: Complete selected extent, its edition heading, every excluded gap and at least twenty literal-LF lines of context on each side were read in full within the continuous lane read LF6090–15100; selected bounds [[6611, 6628], [6634, 6655]]. Native XML WORD geometry was replayed for every line of that span (exact whole-source token equality with the pinned OCR) and screened for page, column and baseline order inside the selection; no general image collation is claimed."
