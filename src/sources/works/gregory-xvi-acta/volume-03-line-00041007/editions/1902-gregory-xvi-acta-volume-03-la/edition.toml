notes = "Apostolic letter CCXXXII grants the archconfraternity of the Blessed Sacrament at Fiumalbo (diocese of Modena) a red woollen mozzetta with silver emblem and tassel; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF41019–41019; the source dating clause at LF41094–41097 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die prima septem- bris millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
