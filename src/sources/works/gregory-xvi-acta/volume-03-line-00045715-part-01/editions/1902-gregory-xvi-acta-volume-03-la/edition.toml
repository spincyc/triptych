notes = "Apostolic letter CCLXVI transfers Edward Barron, vicar apostolic of Upper and Lower Guinea and Sierra Leone, from the titular see of Constantine (now in the Algerian diocese) to Eucarpia, with non-residence and consecration clauses; address LF45724–45726, intitulation, greeting, body, non obstantibus clause and dating clause survive. Its provenance note1 is LF45853. Issuer evidence: GREGORIUS PP. XVI. at LF45729–45729; the source dating clause at LF45822–45825 reads: Datum Romae apud s. Petrum sub annulo piscatoris die secunda martii millesimo octin- gentesimo quadragesimo quarto, pontificatu Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
