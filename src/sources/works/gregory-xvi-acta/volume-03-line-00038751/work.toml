description = "Letter CCXVI to Archbishop Lothar Anselm von Gebsattel of Munich approves his refusal of Catholic rites for the Protestant queen dowager and asks that the reply not be published; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF38775–38775; the source dating clause at LF38848–38851 reads: Datum Romae apud s. Petrum die trigesima aprilis anno millesimo octingentesimo quadra- gesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
