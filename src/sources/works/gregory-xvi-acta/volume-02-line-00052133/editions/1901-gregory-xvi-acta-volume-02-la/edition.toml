notes = "Indult CCXL lets the dignitaries and canons of Monterubbiano (archdiocese of Fermo) wear a violet woollen cappa magna in winter and cotta and rochet with violet sash in summer; LF52185 → LF52194 across own provenance LF52188 and page number 356 LF52191; LF52229 carries a literal trailing |; complete 16 August 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF52143–52143; the source closing at LF52238–52241 reads: Datum Romae apud sanctam Mariam Ma- iorem, sub annulo piscatoris die decima sexta augusti millesimo octingentesimo trigesimo nono, pontificatus Nostri anno nono, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
