notes = "Brief CCIV (address LF43834–43836) names Cardinal Franzoni protector of Visso, its seminary and the church of S. Maria de Macerato; continuous text in one column; complete 12 April 1839 closing. Own provenance LF43891 excluded; margin mark LF43894 and page head LF43897 precede CCV. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI at LF43839–43839; the source closing at LF43885–43888 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima secunda aprilis millesimo octingentesimo trigesimo nono, pon- tificatus Nostri anno nono, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
