description = "Letter CCXXXIX to Cardinal Alessandro Giustiniani, pro-nuncio at Lisbon (address LF41297–41302, protocol LF41305), confirms the visitation of the Portuguese Observant province by Fr Bernardino, suspends Benedict XIV's alternation of offices and grants faculties to close or suppress convents and monasteries, ending with its own 28 June 1833 closing at LF41648–41651, before numeral CCXL at LF41654. Issuer evidence is GREGORIUS PP. XVI. at LF41305–41305; the source closing at LF41648–41651 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima octava iunii mil- lesimo octingentesimo trigesimo tertio, ponti- ficatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
