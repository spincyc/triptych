notes = "Apostolic letter CXL grants the clergy of the Spinazzola collegiate church rochet and almuce with violet hood; decree, non obstantibus and dating clause (head of leaf 213 right column) survive. Issuer evidence: GREGORIUS PP. XVI. at LF28930–28930; the source dating clause at LF29002–29005 reads: Datum Romae apud s. Petrum sub annulo piscatoris die prima mart. millesimo octin- gentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
