notes = "Letter CCLXXI to Bishop Antoine Blanc of New Orleans condemns the cathedral wardens’ (marguilliers’) attacks on episcopal authority and orders them warned of ecclesiastical penalties; address LF46185–46187, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF46297 at the foot of leaf 336. Issuer evidence: GREGORIUS PP. XVI. at LF46190–46190; the source dating clause at LF46253–46256 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima sexta martii millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
