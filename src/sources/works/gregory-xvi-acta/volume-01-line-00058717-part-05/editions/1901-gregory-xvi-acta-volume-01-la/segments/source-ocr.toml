context = "Letter CCCXVI to Francesco Paolo Puzzone of Naples, knight of Jerusalem and of the Golden Militia (address LF59236–59238, protocol LF59241), creates him and his first-born descendants counts of the Lateran palace and ends with its own 18 March 1834 closing at LF59302, before numeral CCCXVII at LF59305. Issuer evidence is GREGORIUS PP. XVI. at LF59241–59241; the source closing at LF59299–59302 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima octava martii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Its provenance note 1 is printed at LF59335 in CCCXVII's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[59236, 59264], [59266, 59302]] selected from address/protocol LF59236 through the source closing LF59302. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
