context = "Letter CCXXXVII to the archbishop of Lucca (address LF40247–40248, protocol LF40251) reorders the ecclesiastical patrimony of the duchy of Lucca in six numbered articles (I–VI, LF40347–40432), regulates debts, pensions, the Viareggio foundation, the archive under Fr Tommaso Pastrini and a one-year deputation, and ends with derogations and its own 21 June 1833 closing at LF41038–41041, before numeral CCXXXVIII at LF41044. Its article numerals I (40347), IT. (40356), Il. (40369), IV. (40385), VY. (40414) and VI. (40423) are retained as source article numbers. Issuer evidence is GREGORIUS PP. XVI. at LF40251–40251; the source closing at LF41038–41041 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima prima iunii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. The foot-note block LF40286–40289 holds note 1 (Ex Bullario Romano, of CCXXXVI) and note 2 (Ex eodem Bullario, this letter's own provenance). The isolated glyph . at LF40388 between article IV. and its text is retained literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[40247, 40285], [40300, 40375], [40377, 40452], [40460, 40526], [40532, 40601], [40603, 40666], [40671, 40743], [40754, 40824], [40832, 40910], [40915, 40982], [40984, 41041]] selected from address/protocol LF40247 through the source closing LF41041. Read in full in acquired LF order within the lane read LF39127-48386 (claim LF39207-48307 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry was checked for the selected extent (column, back-jump, left/right-gap, intra-line and vertical-gap screens); no general image collation is claimed."
