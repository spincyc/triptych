notes = "Bull CCXXIV (GREGORIUS EPISCOPUS servus servorum Dei LF49778–49784) suppresses, at the next vacancy, the cardinal title of S. Eusebio granted to the Jesuits and creates the presbyteral title of SS. Andrea e Gregorio al Celio; LF49877 → LF49884 across own provenance LF49880 and page number 340 LF49883; complete closing dated quarto kalendas iulias 1839. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS EPISCOPUS at LF49778–49778; the source closing at LF49944–49947 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo trigesimo nono, quarto kalendas iulias, pontiticatus Nostri anno nono, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
