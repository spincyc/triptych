notes = "Letter CLXXXIX to Antonio Guidi of Acquaviva, Ripatransone diocese (address LF31331–31333, protocol LF31336) creates him and his legitimate male-line primogenitary descendants marquises, subject to Pius VII's constitution, and ends with its own 7 December 1832 closing at LF31386; LF31389 is page number 203 before numeral CXC at LF31392. Issuer evidence is GREGORIUS PP. XVI. at LF31336–31336; the source closing at LF31383–31386 reads: Datum Romae apud sanctam Mariam Maio- ‘rem sub annulo piscatoris die septima decem- bris millesimo octingentesimo trigesimo secun- do, pontificatus Nostri anno secundo. The page-203 running title LF31319 precedes the act's caption (numeral printed but read by OCR as Se at LF31322); its own provenance note 1 (Ex Bullario Romano) is printed at LF31458 inside CXC's frame. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
