notes = "Letter CCCLXIII (protocol LF68476–68477) erects the royal cathedral of Lucera in the kingdom of the Two Sicilies as a minor basilica, ending with its own 8 August 1834 closing at LF68609–68612, before numeral CCCLXIV at LF68615. Issuer evidence is GREGORIUS PP. XVI. at LF68476–68476; the source closing at LF68609–68612 reads: Datum’ Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die octava augusti millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. Two words of the synopsis caption (Luce-, basili-) are emitted by the OCR at LF68472–68473 after the caption's first lines; they lie wholly inside the excluded caption block LF68463–68473, before the protocol. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
