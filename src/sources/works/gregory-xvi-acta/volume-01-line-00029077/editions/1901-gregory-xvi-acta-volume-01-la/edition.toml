notes = "Letter CLXXX, addressed to Cardinal Giuseppe Morozzo, bishop of Novara (LF29088–29092), appoints him apostolic visitor and delegate of all regulars in the continental dominions of the King of Sardinia with the archbishops of Turin and Genoa as co-visitors, details his faculties, and closes with Decernentes, Non obstantibus, the authenticated-copies clause and the complete 25 September 1832 dating clause at LF29519, before numeral CLXXXI at LF29522. Issuer evidence is GREGORIUS PP. XVI. at LF29095–29095; the source closing at LF29516–29519 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quinta septembris millesimo octingentesimo trigesimo secundo, pontificatus Nostri anno secundo. LF29114 (note 1, Ex Bullario Romano) is this act's own provenance citation, inside the excluded block LF29114–29117. The body line LF29296 ends with the literal OCR glyph group Nine, a margin artefact retained uncorrected. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
