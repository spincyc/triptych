notes = "Apostolic letter CCXLVI erects the see of Chicago for Illinois; intitulation, narrative, erection, decernentes clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF42964–42964; the source dating clause at LF43007–43010 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava novembris mil- lesimo octingentesimo quadragesimo tertio, pon- tificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
