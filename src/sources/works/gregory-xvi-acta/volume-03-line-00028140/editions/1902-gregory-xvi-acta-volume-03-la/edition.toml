notes = "Motu proprio CXXXV erects the Nova Scotia vicariate into a diocese with its see at Halifax; decree, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF28151–28151; the source dating clause at LF28223–28226 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima quinta februar. millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
