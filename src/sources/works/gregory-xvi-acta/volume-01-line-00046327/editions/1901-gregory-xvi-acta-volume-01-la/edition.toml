notes = "Indult CCLXVIII to Francesco Agnino, provost of Santa Maria delle Vigne at Genoa (address LF46337–46340, protocol LF46343), grants him the violet rochet-cassock and mozzetta and the bugia within his church, and ends with its own 24 September 1833 closing at LF46422–46425, before numeral CCLXIX at LF46428. Issuer evidence is GREGORIUS PP. XVI. at LF46343–46343; the source closing at LF46422–46425 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quarta septembris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
