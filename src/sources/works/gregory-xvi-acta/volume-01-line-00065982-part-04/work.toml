description = "Letter CCCLIII (OCR CECT at LF66583), addressed to Cardinal Galleffi, bishop of Porto, protector of the butchers' sodality of Rome (LF66592–66597; protocol LF66600; salutation LF66603–66604), commits to him the faculty to let the sodality's houses in emphyteusis to the advocate Giuseppe Ceccarelli, and ends with its own 27 June 1834 closing at LF66710–66713, before numeral CCCLIV at LF66716. Issuer evidence is GREGORIUS PP. XVI. at LF66600–66600; the source closing at LF66710–66713 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima iunii millesimo Octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
