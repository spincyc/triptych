description = "Epistle CCLXXIV to the bishop of Rennes (address LF47631–47632, protocol LF47635) reviews Lamennais's letter, laments his continued positions and the Pèlerin polonais, asks that he simply profess to follow the doctrine of the encyclical, and ends with its own 5 October 1833 closing at LF47799–47806; the leaf-330 header (LF47809–47817) then carries the numerals of CCLXXV and CCLXXVI. Issuer evidence is GREGORIUS PP. XVI. at LF47635–47635; the source closing at LF47799–47806 reads: Datum Romae apud sanctam Mariam Maio- rem die quinta octobris anno millesimo octin- gentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
