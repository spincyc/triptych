context = "Letter CXCIII to the archbishop of Oristano (Arborensis, address LF33377–33378, protocol LF33381) settles the dispute between the metropolitan chapter and the hospital of Sassari over the vacancy revenues left by Archbishop Arnosio, commands that the decree of the S. Congregation for Extraordinary Ecclesiastical Affairs be inserted ipsissimis verbis (LF33452–33453), inserts it (DECRETUM LF33460 through its dating nonis septembris 1832 LF33791–33794 and the subscription of Aloysius Frezza, archbishop of Chalcedon, secretary LF33797–33798), then confirms it with Haec igitur omnia volumus …, Non obstantibus and the complete 11 January 1833 closing at LF33840, before numeral CXCIV at LF33843. Issuer evidence is GREGORIUS PP. XVI. at LF33381–33381; the source closing at LF33837–33840 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die undecima ianuarii mil- lesimo octingentesimo trigzsimo tertio, ponti- ficatus Nostri anno secundo. The inserted curial decree and its secretary's subscription are part of the papal letter by express papal mandate and are retained integrally; the instrument's issuer is the pope (first-person Nos throughout, protocol GREGORIUS PP. XVI., closing sub annulo piscatoris). LF33474 (note 1, Ex Bullario Romano) is this letter's own provenance citation inside the excluded block LF33474–33477. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[33377, 33403], [33405, 33473], [33478, 33545], [33550, 33616], [33622, 33688], [33693, 33826], [33831, 33840]] selected from address/protocol LF33377 through the source closing LF33840. Read in full in acquired LF order within the lane read LF32605-39265 (claim LF32634-39204 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
