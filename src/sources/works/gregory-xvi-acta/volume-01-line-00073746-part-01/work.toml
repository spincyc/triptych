description = "Letter CCCXC (protocol LF73755–73758) approves the Oratory of St Philip Neri and the confraternity of Jesus the Nazarene founded at Pasto (diocese of Quito) and extends to it the privileges of the Roman and Lima Oratories, ending with its own 2 December 1834 closing at LF73911–73914, before the leaf-504 running title LF73917 and numeral CCCXCI (OCR CECKCh) at LF73920. Issuer evidence is GREGORIUS PP. XVI. at LF73755–73755; the source closing at LF73911–73914 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die secunda decembris mil- lesimo octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
