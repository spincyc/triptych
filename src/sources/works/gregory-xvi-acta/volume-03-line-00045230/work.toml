description = "Consistorial allocution CCLXI confirms the election of Michael Der-Asdnazadrian, archbishop of Caesarea, as Armenian Catholic patriarch of Cilicia (Gregory Peter VIII) and transfers him; it runs from “Venerabiles fratres” LF45247 to “Amen.” LF45357. Issuer evidence: ACTA GREGORII PP. XVI. at LF45341–45341; the source dating clause at LF45237–45238 reads: DIE VIGESIMA QUINTA IANUARII AN. MILLESIMO OCTINGENTESIMO QUADRAG,. QUARTO. The allocution has no dating clause; its date is taken from the excluded edition caption. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
