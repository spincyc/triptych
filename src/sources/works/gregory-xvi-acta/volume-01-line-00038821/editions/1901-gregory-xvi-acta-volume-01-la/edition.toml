notes = "Letter CCXXV (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF38829–38832), at the request of Fortunato Feu, grants the Daughters of Charity of St Vincent de Paul domestic chapels with reservation of the Eucharist, proper Masses of their founder and the indulgences of churches, and ends with its own 14 May 1833 closing at LF38982, before numeral CCXXVI at LF38991. Issuer evidence is GREGORIUS PP. XVI. at LF38829–38829; the source closing at LF38979–38982 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quarta maii mil- lesimo octingentesimo trigesimo tertio, pontifi- catus Nostri anno tertio. LF38945 (t Ex Bullario Romano,) is its own provenance note inside the excluded block LF38945–38948. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
