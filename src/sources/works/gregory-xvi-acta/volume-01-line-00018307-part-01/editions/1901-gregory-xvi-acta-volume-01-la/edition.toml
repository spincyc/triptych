notes = "Letter CXVIII to Cardinal Archduke Rudolph of Olmütz on the rebellion in the Papal States, a plenary indulgence for the cathedral centenary and the cause of Jan Sarkander; address 18321–18324, protocol 18327, Datum 18404–18407 ending with note sign 2. LF18364 is note 1 (provenance) and LF18369 the page-134 running title. Note 2 (18365–18366, continued in the right column at 18444–18445), keyed to the dating clause at 18407, records that the original bears 1832 yet is filed in the first pontifical year; it is retained as this letter's own dating note. Issuer evidence GREGORIUS PP. XVI. at LF18327. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
