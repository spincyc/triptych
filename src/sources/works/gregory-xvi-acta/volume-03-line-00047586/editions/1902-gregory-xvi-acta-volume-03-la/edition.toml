notes = "Apostolic letter CCLXXVIII raises Ceccano (diocese of Ferentino, delegation of Frosinone) to the rank of city, honouring Cardinal Pasquale Gizzi; intitulation, narrative, erection, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF47591–47591; the source dating clause at LF47700–47703 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima septima maii millesimo Octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
