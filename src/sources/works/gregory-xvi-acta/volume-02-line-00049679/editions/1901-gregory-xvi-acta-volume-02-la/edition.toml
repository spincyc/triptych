notes = "Letter CCXXIII (printed EPISTOLA; address to Cardinal Pacca, archpriest, and the Lateran chapter LF49687–49693) sends the gold chalice used at the canonization Mass of 26 May 1839 and confirms the basilica’s privileges motu proprio; LF49737 → LF49746 across own provenance LF49740 and page-339 running title LF49743; complete 21 June 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF49696–49696; the source closing at LF49761–49763 reads: Datum Romae apud sanctum Petrum die vigesima prima iunii millesimo octingentesimo trigesimo nono, pontificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
