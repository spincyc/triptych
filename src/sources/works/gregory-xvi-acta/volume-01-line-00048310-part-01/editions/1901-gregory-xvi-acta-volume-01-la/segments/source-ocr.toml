context = "Letter CCLXXX, addressed to Giovanni Maria Potenti Possenti of Fermo (Dilecto filio LF48325–48326), protocol GREGORIUS PP. XVI. (LF48329) and salutation, creates him and his legitimate first-born descendants counts and ends with its own 22 November 1833 closing at LF48391. Its provenance note 1 (Ex Bullario Romano, marker | after infinitum at LF48316) is LF48394 at the foot of the left column, followed by the head of page 316 (LF48397) and numeral CCLXXXI (OCR Om COE, LF48400). The first frame begins with this act's own numeral; it does not continue an act begun before LF48310 (CCLXXIX closes at LF48304–48307). Issuer evidence is GREGORIUS PP. XVI. at LF48329–48329; the source closing at LF48388–48391 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda novembris mil- lesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
