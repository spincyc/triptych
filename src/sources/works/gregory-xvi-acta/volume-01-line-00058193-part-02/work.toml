description = "Bull CCCX (protocol GREGORIUS EPISCOPUS servus servorum Dei ad perpetuam rei memoriam LF58284–58288) suppresses the parish of S. Antonio abate at Corneto and unites it to S. Giovanni Battista, empowers Cardinal Velzi to reserve a pension for the cathedral chapter, and ends with Nulli ergo, the sanction and its own dating clause quinto nonas martii 1834 at LF58649, before numeral CCCXI at LF58652. Issuer evidence is GREGORIUS EPISCOPUS servus servorum Dei at LF58284–58285; the source closing at LF58646–58649 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo trigesimo quarto, quinto nonas martii, pontificatus Nostri ‘anno quarto. The block LF58313–58319 holds CCCIX's note 1, this bull's note 2 (Ex eodem Bullario,) and page number 380 with the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
