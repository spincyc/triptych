notes = "Letter CCXCII asks Emperor Ferdinand I of Austria to defend the Catholics of the Kingdom of Greece compelled to swear to its new constitution; address LF52144–52148, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF52151–52151; the source dating clause at LF52215–52218 reads: Datum Romae apud sanctam Mariam Maio- rem die vigesima quarta iulii anno millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
