notes = "The complete Chiloé/San Carlos erection bull retains defined territory, cathedral chapter, seminary, endowments, metropolitan relation, execution, transumpt, prohibition and July kalends closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS EPISCOPUS at LF9376–9376; the source closing at LF9773–9776 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadrigesimo kalendis iulii, pontificatus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
