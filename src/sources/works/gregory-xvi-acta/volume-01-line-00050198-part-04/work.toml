description = "Epistle CCXCIII to Bishop C. L. of Rennes (address LF50663–50664, protocol LF50667) rejoices at Lamennais's declaration accepting the encyclical, supposes the bishop has received him back into favour and ends with its own 28 December 1833 closing at LF50738, before numeral CCXCIV at LF50741. Issuer evidence is GREGORIUS PP. XVI. at LF50667–50667; the source closing at LF50735–50738 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima octava decembris anno millesimo octingentesimo trigesimo ter- tio, pontificatus Nostri anno tertio. Its provenance note 1 (Ex Collectaneis in bibliotheca Angelica) is printed at LF50793–50794 in CCXCIV's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
