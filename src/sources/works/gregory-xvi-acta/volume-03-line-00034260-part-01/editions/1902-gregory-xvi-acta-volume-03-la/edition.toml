notes = "Letter CLXXXIV tells Pedro II that the impediment of consanguinity to his marriage with Teresa Cristina of the Two Sicilies is dispensed; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF34387. Issuer evidence: GREGORIUS PP. XVI. at LF34274–34274; the source dating clause at LF34329–34332 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava novembris mille- simo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
