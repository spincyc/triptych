notes = "Indult CCXC (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF50209–50212) grants the provost and canons of S. Giuseppe at Parma the violet woollen cappa with fur or green silk lining and the rochet, as worn at S. Michele in Piacenza, and ends with its own 17 December 1833 closing at LF50334; its note 1 is LF50337. Issuer evidence is GREGORIUS PP. XVI. at LF50209–50209; the source closing at LF50331–50334 reads: Datum Romae apud s.°Petrum sub annulo piscatoris die decima septima decembris mille- simo octingentesimo trigesimo tertio, pontifi- catus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
