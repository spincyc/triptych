notes = "Apostolic letter CXV raises the cathedral of Rieti to a minor basilica; decree, non obstantibus and dating clause survive. Its provenance note1 is LF25039. Issuer evidence: GREGORIUS PP. XVI. at LF24915–24915; the source dating clause at LF24997–25000 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima quarta septembris mil- lesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
