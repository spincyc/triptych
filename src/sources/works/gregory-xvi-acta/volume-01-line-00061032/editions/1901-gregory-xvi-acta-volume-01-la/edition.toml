notes = "Letter CCCXXIX (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF61042–61043) motu proprio erects the diocese of Vincennes for Indiana and eastern Illinois, defining its boundary with St. Louis, and ends with its own closing apud sanctam Mariam Maiorem die sexta maii 1834 at LF61138, before numeral CCCXXX at LF61144. Issuer evidence is GREGORIUS PP. XVI. at LF61042–61042; the source closing at LF61135–61138 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris, die sexta maii mil- lesimo octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. LF61117 (1 Ex Iure Pontificio de P. F.) is its own provenance note, excluded with a speck and the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
