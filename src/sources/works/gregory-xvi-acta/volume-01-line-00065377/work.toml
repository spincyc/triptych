description = "Letter CCCXLVI (protocol LF65385–65388) erects Parma cathedral as a minor basilica and makes its primicerius and sacristan honorary canons, ending with its own 13 June 1834 closing at LF65539–65542, before numeral CCCXLVII at LF65545. Issuer evidence is GREGORIUS PP. XVI. at LF65385–65385; the source closing at LF65539–65542 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima tertia iunii mille- simo, Octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
