notes = "Brief CXX erects Ceylon into a vicariate apostolic immediately subject to the Holy See, withdrawing it from Cochin; LF27124 → LF27133 across own provenance LF27127 and page-183 running title LF27130; LF27194 → LF27203 across CXXI’s provenance LF27197 and page number 183 LF27200, the dating clause heading the right column above CXXI LF27209; complete 23 December 1836 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF27119–27119; the source closing at LF27203–27206 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima tertia decembris millesimo octingentesimo trigesimo sexto, pon- tificatus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
