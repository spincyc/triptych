notes = "Letter LII (numeral OCR’d “LU.”) answers William I’s notice of abdication; address, intitulation, greeting (OCR “saluteniynes”), body and dating clause survive. Its provenance note1 is printed at the foot of the left column, LF13247, before its own heading. Issuer evidence: GREGORIUS PP. XVI. at LF13266–13266; the source dating clause at LF13302–13305 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima secunda novemb. millesimo octingentesimo quadragesimo, ponti- ficatus Nostri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
