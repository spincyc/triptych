notes = "Brief XX revokes Urban VIII’s Piis christifidelibus indult for Irish seminaries abroad, saving the Irish College in Rome; LF3802 → LF3811 across the detached running-title part MDCCCXXXV. LF3805 (raw heading line-00003805) and page number LF3808; LF3871 de- → LF3881 bere across provenance, signature line and running title LF3874–3878; complete 10 April 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF3792–3792; the source closing at LF3908–3911 reads: Datum Romae apud sanctum Petrum sub apnulo piscatoris die decima aprilis millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
