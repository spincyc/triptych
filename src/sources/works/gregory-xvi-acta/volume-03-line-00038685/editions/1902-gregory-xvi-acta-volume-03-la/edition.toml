notes = "Letter CCXV welcomes Pedro II’s extraordinary envoy Luís Moutinho de Lima Álvares e Silva; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF38697–38697; the source dating clause at LF38736–38739 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima quarta aprilis millesimo Octingentesimo quadragesimo tertio, pontifi- catus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
