notes = "Brief LXXXIX joins the Liu-Kiu kingdom to the Korean vicariate so that Bishop Bruguière may reside there; LF15535 apo- → LF15544 stolica across thin marks LF15538 and the page-106 running title LF15541; complete 26 April 1836 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF15484–15484; the source closing at LF15552–15555 reads: Datum Romae apud s. Petram sub annulo piscatoris die vigesima sexta aprilis millesimo octingentesimo trigesimo sexto, pontificatus No- stri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
