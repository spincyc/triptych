context = "Consistorial allocution CCCXIII publishes Ludovico Altieri, Fabio Maria Asquini and Francesco Capaccini as cardinal priests and Giuseppe Zacchia as cardinal deacon, all earlier created and reserved in pectore, and reserves four further cardinals in pectore; it runs from “Venerabiles fratres,” LF55128 to “Amen.” LF55291. Issuer evidence: ACTA GREGORII PP. XVI. at LF55138–55138; the source dating clause at LF55126–55127 reads: DIE VIGESIMA PRIMA APRILIS MILLESIMO OCTINGENTESIMO QUADRAGESIMO QUINTO, The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
