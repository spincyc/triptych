description = "Letter CCXLIII (protocol LF41971–41974) commits to the bishop of Rio de Janeiro the elevation of the Boa Morte confraternity of São Salvador dos Campos dos Goytacazes into a third-order sodality of St Francis of Paola with habit and indulgences, ending with its own 12 July 1833 closing at LF42066–42069, before numeral CCXLIV at LF42072. Issuer evidence is GREGORIUS PP. XVI. at LF41971–41971; the source closing at LF42066–42069 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die duodecima iulii millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. LF41983 a8 (x2240–2341, y294) is the garbled page number at the head of leaf 291's right column. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
