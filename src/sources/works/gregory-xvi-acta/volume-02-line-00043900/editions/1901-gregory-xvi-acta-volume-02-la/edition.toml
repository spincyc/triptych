notes = "Indult CCV grants the cappa magna to the canons and lychnus and ferula to the archpriest of the collegiate church of Balerna (diocese of Como, canton Ticino); LF43963 → LF43969 across the right half GREGORII PP. XVI. of the page-300 running title LF43966; complete 16 April 1839 closing. Own provenance LF44045 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF43909–43909; the source closing at LF43998–44001 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima sexta aprilis millesimo O:tingentesimo trigesimo nono, pontificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
