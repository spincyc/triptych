notes = "Indult CCCLXX, addressed to the bishop of Ventimiglia (“gravi tuo, ven. frater, accepto testimonio”, LF76693), commissions him to sanate the canons of the collegiate church of Triora for adopting the round cappa and rochet without leave and to grant them their use in perpetuity; intitulation, ad perpetuam formula, narrative, commission, non obstantibus clause and dating clause survive. Its provenance note1 is LF76725. Issuer evidence: GREGORIUS PP. XVI. at LF76668–76668; the source dating clause at LF76719–76722 reads: Datum Romae apud s, Petrum sub annulo piscatoris die vigesima secunda maii mille- simo octingentesimo quadragesimo sexto, pon- tificatus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
