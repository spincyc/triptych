description = "Indult CCIII, addressed to the bishop of Alife and Telese (LF35682–35683), commissions him to grant the archpriest and participating priests of the church of Sant'Angelo the mozzetta worn by the canons of San Giovanni Maggiore at Naples, and ends with its own 26 February 1833 closing at LF35790, before numeral CCIV at LF35793. Issuer evidence is GREGORIUS PP. XVI. at LF35686–35686; the source closing at LF35787–35790 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima sexta februarii millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. LF35781 (1 Ex Bullario Romano,) is its own provenance note inside the excluded block LF35778–35784. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
