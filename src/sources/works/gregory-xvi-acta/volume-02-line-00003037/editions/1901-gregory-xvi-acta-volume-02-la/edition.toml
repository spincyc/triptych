notes = "Brief XVI commissions the patriarch of Venice to grant the Cavanis brothers’ house Mass and communion in perpetuity; LF3061 → LF3067 across running title LF3064; LF3127 → LF3136 across provenance LF3130 and running title LF3133; complete 25 March 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF3047–3047; the source closing at LF3139–3142 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima quinta martii millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
