notes = "Apostolic letter CLXIX detaches the islands of Central Oceania from Pompallier’s western vicariate and erects a new vicariate for the Marists; decree, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF32058–32058; the source dating clause at LF32165–32169 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima tertia augusti millesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo se- cundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
