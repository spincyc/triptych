notes = "Letter CCLXVI to Giovanni Battista Viti, patrician of Orvieto (address LF45885–45887, protocol LF45890), creates him and his primogeniture counts and ends with its own 17 September 1833 closing at LF45953–45956, before numeral CCLXVII at LF45959. Issuer evidence is GREGORIUS PP. XVI. at LF45890–45890; the source closing at LF45953–45956 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septima septembris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
