description = "Apostolic letter CXLIV declares the King of Sardinia’s right of nomination to the Tiglietto abbey, restores its title and regulates its revenues; decree, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF29275–29275; the source dating clause at LF29404–29407 reads: Datum Romae apud s. Petrum. sub annulo piscatoris die decima octava martii millesimo octingentesimo quadragesimo secundo, ponti- ficatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
