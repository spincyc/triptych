description = "Letter CCXCIX (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF51260–51263) grants the public chapel of the barons de Damas at Hautefort (diocese of Périgueux) a privileged altar, solemn Mass with exposition on two Sundays and a plenary indulgence, and ends with its own 14 January 1834 closing at LF51350, before numeral CCC at LF51353. Issuer evidence is GREGORIUS PP. XVI. at LF51260–51260; the source closing at LF51347–51350 reads: Datum* Romae apud sanctum Petrum ‘sub annulo piscatoris die decima quarta ianuarii millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno tertio. Its provenance note 1 (t Ex Bullario Romano,) is printed at LF51404 in the allocution's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
