notes = "Apostolic letter CCXXXVII grants the canons of Norcia cathedral the ermine-lined cappa magna; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF41644. Issuer evidence: GREGORIUS PP. XVI. at LF41543–41543; the source dating clause at LF41608–41612 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima octava septembris millesimo octingentesimo quadrage- simo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
