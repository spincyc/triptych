description = "Indult CCCX grants the provost of the collegiate church of S. Martino at Pietrasanta (diocese of Pisa) the palmatoria (bugia) and the first canon the title of archpriest; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF54781. Issuer evidence: GREGORIUS PP. XVI. at LF54694–54694; the source dating clause at LF54775–54778 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quarta mensis martii anni mil- lesimi octingentesimi quadragesimi quinti, pon- tificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
