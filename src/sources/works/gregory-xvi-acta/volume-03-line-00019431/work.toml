description = "Apostolic letter XCVIII approves Teresa Verzeri’s Daughters of the Sacred Heart of Bergamo and commends their constitutions; the constitutions themselves are not printed. Dispositive clause, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF19439–19439; the source dating clause at LF19624–19627 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima prima mensis iun. mil- lesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
