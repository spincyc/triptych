notes = "Indult CLXXXV grants the canons of the collegiate church of Castelnuovo (diocese of Porto) the cotta and rochet at all seasons; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF34346–34346; the source dating clause at LF34437–34440 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima nona novembris mille- simo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
