notes = "Letter LXXXIII accredits Archbishop Tommaso Pasquale of Thebes as nuncio to Charles Albert; address, intitulation, body and dating clause survive. Its provenance note1 is LF17608. Issuer evidence: GREGORIUS PP. XVI. at LF17494–17494; the source dating clause at LF17533–17536 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima nona aprilis millesimo octingentesimo quadragesimo primo, . pontifica- tus Nostri anno decimo primo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
