notes = "Consistorial allocution LXXII (Kalends of March 1841) protests the Spanish government’s decrees and the expulsion of the nunciature’s vicegerent Ramírez; it runs from “Venerabiles fratres” LF15705 to LF16113. Its own decree-date notes2–6 (LF15778–15785) and patristic/canonical notes1–9 (LF16045–16074) are retained in place. Issuer evidence: ACTA GREGORII PP. XVI. at LF15855–15855; the source dating clause at LF15700–15702 reads: HABITA IN CONSISTORIO SECRETO KALENDIS MARTII MILLESIMO OCTINGENTESIMO QUADRAGESIMO PRIMO. The allocution has no dating clause; its date is taken from the excluded edition caption. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
