notes = "Letter CCCVII (OCR CCCLVII., protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF57840–57843) empowers Justo de Santa María de Oro, apostolic vicar of San Juan de Cuyo, Mendoza and San Luis, to reduce holy days and transfer the vigil fasts, and ends with its own 25 February 1834 closing at LF58043, before numeral CCCVIII (OCR CCCVII.) at LF58046. Issuer evidence is GREGORIUS PP. XVI. at LF57840–57840; the source closing at LF58040–58043 reads: Datum ‘Romae apud sanctum Petrum sub annulo piscatoris die vigesima quinta februarii millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. LF57865 (1 Ex Bullario Romano,) is its own provenance note; LF58017–58020 are sheet number 48 and page number 378. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
