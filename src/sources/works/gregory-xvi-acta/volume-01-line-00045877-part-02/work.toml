description = "Letter CCLXVII (protocol LF45969–45972) describes the German reform party's errors, condemns and prohibits five German booklets listed with their source numerals I.–V. (LF46157–46216; by Fuchs, the Offenburg conference/Mersy, Kopp and two anonymous Zurich works) under suspension and reserved excommunication, orders publication, and ends with its own 17 September 1833 closing at LF46321–46324, before numeral CCLXVIII at LF46327. Issuer evidence is GREGORIUS PP. XVI. at LF45969–45969; the source closing at LF46321–46324 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septima septembris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. The extent is multilingual: Latin act with the five condemned booklets cited by their German titles and imprints (LF46160–46216), retained in source order. At LF46020 the first printed word of the line (x1249–1423) is misread as t ehestt 5 but stays in order before LF46023; it is retained literally, nothing is supplied. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
