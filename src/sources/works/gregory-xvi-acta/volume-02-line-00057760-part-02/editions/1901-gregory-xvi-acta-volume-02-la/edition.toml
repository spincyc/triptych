notes = "Allocution CCLXV asks the cardinals and bishops in semipublic consistory for their votes on the canonization of b. Alphonsus and, after the recorded votes, defers the decision to further prayer; LF57871 → LF57883 across CCLXIV’s provenance LF57874, own provenance LF57877 and running title LF57880; a literal © ends LF57851; ends LF57920 before CCLXVI LF57923. Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORII PP. XVI. at LF57801–57801; the source closing at LF57914–57920 reads: Summa hac animorum consensione maximo- pere gaudemus, eoque impellimus, quo iam sponte ferebamur; sed antequam quidquam de b. Alphonso constituamus, adhuc iterandas ad Deum preces censemus, ut suo Nobis lu- mine praesto sit, cum in re tanti momenti sententiam proferemus. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
