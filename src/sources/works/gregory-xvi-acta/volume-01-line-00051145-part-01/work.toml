description = "Letter CCXCVIII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF51155–51158) commissions the capitular vicar of Montepulciano to allow the faithful to satisfy the Mass precept from the glazed opening of the parish house of S. Pietro in the Valdichiana, and ends with its own 14 January 1834 closing at LF51237; its note 1 is LF51240. Issuer evidence is GREGORIUS PP. XVI. at LF51155–51155; the source closing at LF51234–51237 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima quarta januarii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
