description = "Letter CIX to Bishop Henry of Heliopolis, vicar apostolic of Gibraltar, condemns the lay churchwardens who defied his authority and appealed to the civil magistrate, declares their office wholly dependent on the bishop, forbids fees on the occasion of sacraments and praises his constancy; address, intitulation, greeting, body and dating clause survive. Its provenance note1 is LF24353. Issuer evidence: GREGORIUS PP. XVI. at LF24310–24310; the source dating clause at LF24430–24433 reads: Datum Romae apud sanctam Mariam Maio- rem die vigesima secunda augusti millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
