notes = "Letter CXXV (numeral OCR’d “JG”) congratulates Nicholas I on the marriage of the heir Alexander with Marie of Hesse-Darmstadt; address, intitulation, salutem, body and dating clause survive. Its provenance note1 is LF26951. Issuer evidence: GREGORIUS PP. XVI. at LF26903–26903; the source dating clause at LF26935–26938 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima tertia decemb. millesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
