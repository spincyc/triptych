notes = "Letter CCXI to Patriarch Francisco of Lisbon explains the indult letting him govern at once and reproves the custom of a nominee assuming the vacant see’s administration before papal institution; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37940–37940; the source dating clause at LF38025–38028 reads: Datum Romae apud s. Petrum die sexta aprilis anno millesimo octingentesimo quadra- gesimo tertio, pontificatus Nostri anno decimo tert1o. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF37988 “°”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
