context = "Allocution LXXIV laments the death on 19 October of the current year (LF13431–13434) of Clemens August, archbishop of Cologne, whom the pope had earlier praised in consistory and intended to create cardinal after his coming to Rome (LF13444–13464); LF13420 → LF13427 across provenance LF13423 (De Luca, Annali delle scienze religiose) and page number 92 LF13426; LF13489 maximo- → LF13495 pere across running title LF13492. Date left null: the edition caption LF13408–13411 prints 24 November 1835, but in 1835 the see of Cologne was held by Ferdinand August Spiegel (died August 1835) and Clemens August Droste zu Vischering, the archbishop meant here, died on 19 October 1845; the caption year is therefore unreliable and no date is normalised. The caption is retained as edition furniture, not corrected. Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORII PP. XVI. at LF13492–13492; the source closing at LF13499–13510 reads: latio; tamen si quid ex humana fragilitate adhuc illi expiandum supersit, Deo misericor- diarum Patri humillime supplicamus, vosque idem facere Nobis omnino pollicemur, ut pre- tioso Sanguine immaculati Agni humani ge- neris Redemptoris dignetur benignus eius ani- mae labes abstergere, quo tantus archiepiscopus quam citissime immarcescibilem gloriae coro- nam percipiens, sicut illustris et clarus fuit in terris, sic et in coelis, cum omnibus iis qui ad iustitiam erudiunt multos, quasi stella ful- geat in perpetuas aeternitates. ; Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
