notes = "The complete bull separates California from Sonora, establishes the see at San Diego, assigns territory, endowment, metropolitan relation and execution duties, and retains transumpt, Nulli ergo and full closing. Fifth day before the May kalends is27April. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS EPISCOPUS at LF7531–7531; the source closing at LF7813–7816 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo, quinto kalendas maias, pontificatus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
