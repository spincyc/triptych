description = "Indult CCXCV grants the three orders of the collegiate chapter of Grottaglie (diocese of Taranto) the cappa magna with violet tassel, collar and stockings, the rochet and violet mozzetta, and the surplice and mozzetta respectively; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its numeral LF52373 (OCR “CEXCV.”) was missed by the detector. Issuer evidence: GREGORIUS PP. XVI. at LF52386–52386; the source dating clause at LF52478–52481 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima augusti millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
