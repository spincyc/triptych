description = "Letter CLIII congratulates Ludwig I on the marriage of his daughter Adelgunde with Francis Ferdinand of Modena; address, intitulation, body and dating clause survive. Its provenance note1 is LF30329. Issuer evidence: GREGORIUS PP. XVI. at LF30267–30267; the source dating clause at LF30302–30305 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima octava aprilis millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
