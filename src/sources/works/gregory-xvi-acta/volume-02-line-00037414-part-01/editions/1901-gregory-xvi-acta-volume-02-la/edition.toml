notes = "Brief CLXVI (address LF37422–37423 to Paolo Marusci, archbishop of Chalcedon) transfers him to the Armenian primatial see of Constantinople with the pallium; LF37467 → LF37476 across own provenance LF37470 and running title LF37473; complete 9 April 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF37426–37426; the source closing at LF37538–37541 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die nona aprilis millesimo octingentesimo trigesimo octavo, pontificatus , Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
