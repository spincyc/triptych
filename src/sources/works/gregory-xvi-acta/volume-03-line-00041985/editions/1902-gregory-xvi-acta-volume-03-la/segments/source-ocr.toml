context = "Apostolic letter CCXL grants the abbots of the French Benedictine congregation (Solesmes) the Cassinese privilege of being held blessed by the Pope as soon as canonically elected, so that they may confer tonsure and minor orders; intitulation “GREGORIUS PP. XVI. ad perpetuam rei memoriam”, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. LF41985 is the true numeral CCXL; the preceding act CCXXXIX ends at LF41979 in lane volume-03-b03, so this lane’s first frame is not a continuation. Issuer evidence: GREGORIUS PP. XVI. at LF41995–41995; the source dating clause at LF42115–42119 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septima octobris millesimo octingentesimo quadrage- simo tertio, pontificatus Nostri anno decimo tertio. The edition’s cross-reference marker “”” after “censuimus” (LF42027) remains literal although its editorial note is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
