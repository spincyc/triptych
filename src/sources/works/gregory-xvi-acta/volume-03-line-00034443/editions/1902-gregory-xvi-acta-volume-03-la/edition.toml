notes = "Letter CLXXXVI congratulates the abbot general of the Armenian Antonians on his confirmation in office; intitulation, greeting “Dilecte fili”, body and dating clause survive (this printing prints no separate address; the addressee is named only in the excluded synopsis). Its provenance note1 is LF34538. Issuer evidence: GREGORIUS PP. XVI. at LF34452–34452; the source dating clause at LF34504–34507 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die quarta decembris mille- simo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
