context = "Indult CCCXXXIX (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF64030–64031) allows the provost and canons of the collegiate church of Cuorgnè (diocese of Ivrea as printed Augustae Taurinorum) the rochet and purple mozzetta instead of the almuce, and ends with its own closing apud sanctam Mariam Maiorem die octava augusti 1834 at LF64110, before numeral CCCXL at LF64113. The printed date is recorded as printed, although neighbouring letters are of May–June 1834. Issuer evidence is GREGORIUS PP. XVI. at LF64030–64030; the source closing at LF64107–64110 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die octava augusti millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. Its provenance note 1 is printed at LF64144 in CCCXL's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[64030, 64072], [64074, 64110]] selected from address/protocol LF64030 through the source closing LF64110. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
