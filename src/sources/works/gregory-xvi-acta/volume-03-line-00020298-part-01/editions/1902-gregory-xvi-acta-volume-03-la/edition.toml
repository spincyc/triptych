notes = "Apostolic letter CIII commutes Teodomiro Felici’s bequest and empowers the bishop of Montalto to erect a priestly canonry at Rotella; derogations and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF20308–20308; the source dating clause at LF20511–20514 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima tertia iul. millesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
