notes = "Apostolic letter LXXXVIII privileges the Monterone society’s altar for the dead; intitulation, ad perpetuam formula, dispositive clause and dating clause survive. Its text LF18413–18440 occupies leaf 138’s right upper column, above LXXXVII’s annexed note band (LF18443–18482), and ends on leaf 139. Issuer evidence: GREGORIUS PP. XVI. at LF18413–18413; the source dating clause at LF18496–18499 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quarta maii millesimo octingen- tesimo quadragesimo primo, pontificatus No- stri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
