notes = "Letter CXLVII commends the nuncio Fornari to Queen Louise of the Belgians; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF29574–29574; the source dating clause at LF29616–29619 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava mart. millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
