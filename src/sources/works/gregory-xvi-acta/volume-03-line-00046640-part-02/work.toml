description = "Apostolic letter CCLXXV names Bishop Joseph-Norbert Provencher of Juliopolis vicar apostolic of the new Hudson Bay vicariate; address LF46727–46729, intitulation, greeting, appointment, mandate, non obstantibus clause and dating clause survive. Its numeral LF46718 (OCR “CCLXXYV.”) was missed by the detector; its provenance note1 is LF46839. Issuer evidence: GREGORIUS PP. XVI. at LF46732–46732; the source dating clause at LF46785–46788 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima sexta aprilis millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
