description = "Bull CCLV dismembers the department of Veracruz from the diocese of Tlaxcala (Puebla) and erects the cathedral, chapter, seminary and see of Veracruz with dotation from the tithes, metropolitan subjection to Mexico, taxation, executor (Bishop Francisco Pablo Vázquez), decernentes, non obstantibus, transumpt, Nulli ergo and incarnation-year dating clauses (nonis ianuarii = 5 January). LF44557 prints “incar- cationis” literally. Issuer evidence: GREGORIUS EPISCOPUS at LF43949–43949; the source dating clause at LF44556–44559 reads: Datum Romae apud s. Petrum anno incar- cationis dominicae, millesimo octingentesimo quadragesimo quarto, nonis ianuarii, pontifi- catus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
