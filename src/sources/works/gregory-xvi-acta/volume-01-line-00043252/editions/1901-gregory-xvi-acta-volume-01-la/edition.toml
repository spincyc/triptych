notes = "Letter CCLI to the archbishops, bishops and ordinaries of Spain (address LF43262–43265, protocol LF43268) grants them perpetual faculty to let secularized religious priests hold benefices with care of souls by title of administration and ends with its own 6 August 1833 closing at LF43402–43405, before numeral CCLII at LF43408. Issuer evidence is GREGORIUS PP. XVI. at LF43268–43268; the source closing at LF43402–43405 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die sexta augusti millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
