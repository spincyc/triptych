description = "Allocution CLXXXV publishes Adriano Fieschi as cardinal deacon (reserved in pectore in 1834), creates Engelbert Sterckx, archbishop of Mechelen, cardinal priest and reserves another in pectore; LF40588 → LF40601 across own provenance LF40591, marks LF40594–40595 and running title LF40598; LF40665 → LF40669 across page number 277 LF40668; ends with In nomine Patris … Amen LF40694–40695. Date from the caption die decima tertia septembris 1838 (LF40554–40556). Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORII PP. XVI. - at LF40521–40521; the source closing at LF40672–40695 reads: Quid vobis videtur? Auctoritate omnipotentis Dei, sanctorum apo- stolorum Petri et Pauli et Nostra, declaramus S. R. E. diaconum cardinalem Hadrianum Fieschium. Insuper creavimus S. R. E. presbyterum Cardinalem Engelbertum Sterckx Cum dispensationibus, derogationibus et clau- sulis nec2ssariis et opportunis. Alium autem creamus et in pectore reserva- mus arbitrio Nostro quandocumque declaran- dum. In nomine Patris > et Filii > et Spiri- tus >< Sancti. Amen. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
