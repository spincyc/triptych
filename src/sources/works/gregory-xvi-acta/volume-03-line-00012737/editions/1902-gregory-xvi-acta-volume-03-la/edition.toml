notes = "Allocution XLVII, spoken in St Paul’s after the consecration of its high altar, runs from LF12756 to its closing Amen LF12928. Its own source notes1–3 (Eusebius, Philippians, Clement) at LF12896–12901 are retained in place. Issuer evidence: 88 ACTA GREGORII PP. XVI. at LF12771–12771; the source dating clause at LF12750–12753 reads: TERTIO NONAS OCTOBRIS ANNO MILLESIMO OCTINGENTESIMO QUADRAGESIMO The allocution has no dating clause; its date is taken from the excluded edition caption, as for allocution XV in the earlier admitted batch. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
