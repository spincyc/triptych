description = "Brief CCXXXII (address to the archbishop of Manila and the Dominican provincial of the Philippines LF51005–51008) empowers them, after the martyrdom of bishops Ignacio Delgado and Domingo Henares, to choose a new vicar apostolic and coadjutor for East Tonkin and names them to Miletopolis and Ruspe; LF51031 → LF51043 across CCXXXI’s provenance LF51034, own provenance LF51037 and page number 348 LF51040; LF51104 → LF51113 across the two-line running title LF51107–51110; complete 2 August 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF51011–51011; the source closing at LF51152–51155 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die secunda augusti millesimo octingentesimo trigesimo nono, pon- tificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
