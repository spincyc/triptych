notes = "Letter CXXXV (address LF29576–29577 to David Ochterlony Dyce Sombre) condoles on the death of the Begum Sombre of Sardhana, thanks him for her picture and her bequests, and disapproves the vicar apostolic’s departure; LF29625 → LF29631 across running title LF29628; complete 22 April 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF29580–29580; the source closing at LF29660–29663 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima secunda aprilis millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
