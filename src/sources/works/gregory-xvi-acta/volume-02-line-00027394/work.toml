description = "Letter CXXII (address LF27409–27413 to Paulo Antonio Dias a Conceptione, capitular vicar of Goa) sends a copy of the letter to the Calcutta Augustinians (the copy itself is not reprinted) and urges him to recall them and the Meliapor vicar from schism; across page number 185 LF27477; complete 8 January 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF27416–27416; the source closing at LF27506–27509 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die octava-ianuarii millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
