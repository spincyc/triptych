description = "Indult (numeral OCR’d “Cech”, LF52986) commissions Bishop Domenico Ferrari of Brescia to grant for seven years private oratories with daily Mass, reservation and communion in all houses of the Daughters of Charity (founded at Lovere); address LF52998–53000, intitulation, greeting, commission, non obstantibus clause and dating clause survive. Its provenance note1 is LF53120 at the foot of leaf 385. The heading numeral is illegible in the OCR and the next numeral is printed “CCCI.” (LF53086); no numeral is asserted. Issuer evidence: GREGORIUS PP. XVI. at LF53003–53003; the source dating clause at LF53080–53083 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima secunda novem- bris millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
