description = "Brief CLVII joins the Modenese part of Casumaro parish, with its church and cemetery ceded by the duke of Modena, to the archdiocese of Bologna and confirms the compensating benefice agreement (articles I–VIII, the third printed II.); across own provenance LF35920, page numbers LF35923 and LF36128, running titles LF35992 and LF36062; complete 22 December 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI at LF35898–35898; the source closing at LF36151–36154 reads: Datum Romae apud sanctum Petrum sub an- nulo piscatoris die vigesima secunda decembris millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
