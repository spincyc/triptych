notes = "The operative text elevates the Good Shepherd confraternity to an archconfraternity and grants aggregation powers. That actual grant controls the title. Complete derogation and closing survive. Citation11065note2 is own;11068note1 is the prior Abukarim letter’s provenance. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF11014–11014; the source closing at LF11111–11114 reads: Datum ab Arce Gandulphi sub annulo pi- scatoris die vigesima octava iul. millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
