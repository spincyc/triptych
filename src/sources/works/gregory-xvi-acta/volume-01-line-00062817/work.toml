description = "Epistle CCCXXXIV to President Boyer of the Republic of Haiti (address LF62828–62830, protocol LF62833, salutation LF62837–62838) commends to him the apostolic legate John England, bishop of Charleston, sent to settle the affairs of the Church there, and ends with its own 20 May 1834 closing at LF62896, before numeral CCCXXXV at LF62899. Issuer evidence is GREGORIUS PP. XVI. at LF62833–62833; the source closing at LF62893–62896 reads: Datum “Romae apud s. Petrum sub annulo piscatoris die vigesima maii millesimo octingen- tesimo trigesimo quarto, pontificatus Nostri anno quarto. LF62836 6.2 is a right-margin speck (x 2228–2298) on its own OCR line before the salutation. LF62855 (1 Ex Bullario Romano.) is its own provenance note, excluded with the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
