notes = "Letter CXCIX informs Francisco de Aguirre, acting president of Ecuador, of Pedro Antonio Torres’s promotion to Cuenca and urges protection of ecclesiastical liberty; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF36908–36908; the source dating clause at LF36975–36978 reads: Datum Romae apud s. Petrum die vigesima tertia februarii anno millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
