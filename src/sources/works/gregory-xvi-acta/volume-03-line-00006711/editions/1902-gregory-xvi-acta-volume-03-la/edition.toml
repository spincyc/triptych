notes = "Address to Francis Xavier a Sancta Anna, Amatensis bishop and Malabar apostolic vicar, is retained. Transfer to the titular archbishopric of Sardis, pastoral exhortation and complete dating clause survive; the split editorial synopsis6727–6729 and its source citation6724 are furniture. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF6738–6738; the source closing at LF6835–6838 reads: Datum Romae apud Sanctum Petrum sub an- nulo piscatoris, die decima aprilis millesimo octingentesimo qadragesimo, pontificatus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
