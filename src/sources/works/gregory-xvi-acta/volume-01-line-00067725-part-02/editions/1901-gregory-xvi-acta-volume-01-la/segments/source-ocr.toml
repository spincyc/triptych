context = "Allocution CCCLXI, delivered in secret consistory (own dated caption HABITA IN CONSISTORIO SECRETO KALENDIS AUGUSTI ... TRIGESIMO QUARTO, LF67842–67845, retained), addresses the cardinals (LF67875), deplores the Portuguese government's new tribunal, lay collations of benefices, abolition of the Lisbon patriarchate and suppression of all religious houses, again reprobates and annuls those decrees, and ends with its prayer liberavit at LF68107, before numeral CCCLXII (OCR -CCCLXII.) at LF68110. Issuer evidence is ACTA GREGORII PP. XVI. at LF68074–68074; the source closing at LF67842–67845 reads: “HABITA IN CONSISTORIO SECRETO * F KALENDIS AUGUSTI MILLE3IMO OCTINGENTESIMO- TRIGESIMO QUARTO. The allocution has no sub annulo dating clause; its date is taken from its own retained caption LF67842–67845 (OCR “HABITA ... * / F KALENDIS AUGUSTI / MILLE3IMO ..., specks retained literally). The edition numeral and genre label with a speck (LF67837–67841) and the italic synopsis (LF67848–67872) are excluded. LF67912 (’ lig ,) is a cluster of tiny speck WORDs (x277–569, y3305–3358) overlapping the baselines of LF67911 and LF67914 and is excluded as a speck. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
