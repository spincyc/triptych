description = "Bull CCXII grants the dignitaries and canons of Aversa cathedral the violet cassock and cappa magna after the Capuan model, with the full non obstantibus, Nulli ergo and incarnation-year dating clauses (sexto idus aprilis = 8 April). Issuer evidence: GREGORIUS EPISCOPUS at LF38040–38040; the source dating clause at LF38221–38224 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo tertio, sexto idus aprilis, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
