description = "Apostolic letter CXXIII separates the western province of Upper Canada from the Kingston diocese and erects it into a diocese whose see the new bishop is to fix; decree and dating clause survive. Its provenance note1 is LF26816. Issuer evidence: GREGORIUS PP. XVI. at LF26730–26730; the source dating clause at LF26797–26800 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima septima decemb. millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
