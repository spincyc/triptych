notes = "Letter CXXXVII rebukes Bishop Peter of Augsburg for ordering Catholic funeral rites for the Protestant queen dowager; address, intitulation, body, blessing and dating clause survive, with the letter’s own reference notes 2–6. Issuer evidence: GREGORIUS PP. XVI. at LF28385–28385; the source dating clause at LF28534–28537 reads: Datum Romae apud s. Petrum die decima sexta februar. millesimo octingentesimo quadra- gesimo secundo, pontificatus Nostri anno de- cimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
