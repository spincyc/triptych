description = "Apostolic letter CCCLXVII dispenses the Jesuit to be chosen vicar apostolic of Madurai from the rule and vow against accepting prelacies, while binding him to Benedict XIV’s oath Omnium sollicitudinem; intitulation “ad futuram rei memoriam”, narrative, dispensation, non obstantibus clause and dating clause survive. Its provenance note1 is LF76440. Issuer evidence: GREGORIUS PP. XVI. at LF76346–76346; the source dating clause at LF76408–76411 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima nona maii millesimo octin- gentesimo quadragesimo sexto, pontificatus No- stri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
