context = "Letter CCCXLIV (protocol GREGORIUS PP. XVI. ad futuram rei memoriam LF65037–65040) confirms the sentences of the Congregation of the Council of 22 March 1830 and 1 February 1834 for the priest Giuseppe Calleia against Giuseppe Antonio Bonavita over the Maltese benefice of San Pietro in Bingemma, imposes perpetual silence, and ends with its own 3 June 1834 closing at LF65207–65210, immediately before numeral CCCXLV at LF65213. Issuer evidence is GREGORIUS PP. XVI. at LF65037–65037; the source closing at LF65207–65210 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die tertia iunii millesimo octingenteismo trigesimo quarto, pontificatus Nostri anno quarto. Its own provenance note 1 (LF65068) with the volume/sheet signatures and page number 426 (LF65071–65080) intervene between body LF65065 and LF65083; the provenance note of the following letter CCCXLV (LF65150) and the running title LF65153 intervene between LF65147 and LF65156. All are excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
