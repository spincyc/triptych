notes = "Apostolic letter CLX confirms the title Cappella Gregoriana of the Roman College sodality and its faculty to sing with musicians in S. Ignazio and the Gesù; decree, non obstantibus and dating clause survive. The raw candidate ended at LF30820 only because the running-title fragment LF30823 was proposed as a heading. Issuer evidence: GREGORIUS PP. XVI. at LF30812–30812; the source dating clause at LF30902–30905 reads: _ Datum Romae apud s. Petrum sub annulo Piscatoris die vigesima prima iunii millesimo Octingentesimo quadragesimo secundo, ponti- ficatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
