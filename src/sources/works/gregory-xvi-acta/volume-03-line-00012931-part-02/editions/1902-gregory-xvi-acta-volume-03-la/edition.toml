notes = "Letter XLIX (numeral OCR’d “JE;”) answers Gregory Stanislas, prince of the Gambier islands, on his conversion and church building and sends medals; address, intitulation, body continuing “in ob- / secrationibus” across the page break, and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF13001–13001; the source dating clause at LF13082–13085 reads: Datum Romae apud sanctam Mariam Maio- rem die quarta novembris millesimo octingen- tesimo quadragesimo, pontificatus Nostri anno decimo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
