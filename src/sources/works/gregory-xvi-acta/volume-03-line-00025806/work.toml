description = "Letter CXX consoles Grand Duke Leopold II on the death of his eldest daughter; address, intitulation, body and dating clause survive. Its provenance note1 is LF25795, printed at the foot of leaf 190 left column. Issuer evidence: GREGORIUS PP. XVI. at LF25820–25820; the source dating clause at LF25859–25862 reads: Datum Romae apud sanctum Petrum sub an- nulo piscatoris die decima secunda novembris millesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
