notes = "Letter CCII commends nuncio Pecci to Cardinal Engelbert Sterckx of Mechelen and the Belgian bishops; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37127–37127; the source dating clause at LF37173–37176 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima prima martii millesimo octingentesimo quadragesimo tertio, pontifica- tus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
