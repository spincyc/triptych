notes = "Letter LXV tells Louis-Philippe that Archbishop De Bonald of Lyons will be created cardinal; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF14827–14827; the source dating clause at LF14894–14897 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima sexta ianuar. millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
