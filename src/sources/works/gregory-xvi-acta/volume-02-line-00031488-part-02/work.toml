description = "Brief CXLVI erects the see of Nashville for Tennessee, taken from Bardstown; its derogation clause repeats, as printed, the Mississippi/New Orleans wording of CXLIV; LF31589 → LF31601 across CXLV’s provenance LF31592, own provenance LF31595 and page number 214 LF31598; complete 28 July 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF31577–31577; the source closing at LF31639–31642 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima octayva iulii millesimo octingentesimo trigesimo sep- timo, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
