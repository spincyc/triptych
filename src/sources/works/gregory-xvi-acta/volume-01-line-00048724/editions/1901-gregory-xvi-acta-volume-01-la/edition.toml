notes = "Letter CCLXXXIV (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF48734–48737) empowers the bishop of Fiesole to impose a perpetual pension of sixty scudi on the parish of S. Giovanni Battista at Cavriglia for two priests and later poor churches, without approving the patronage, and ends with its own 3 December 1833 closing at LF48835; its note 1 is LF48838, before numeral CCLXXXV at LF48844. Issuer evidence is GREGORIUS PP. XVI. at LF48734–48734; the source closing at LF48832–48835 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die tertia decembris mille- simo octingentesimo trigesimo tertio » pontifi- catus Nostri anno ‘tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
