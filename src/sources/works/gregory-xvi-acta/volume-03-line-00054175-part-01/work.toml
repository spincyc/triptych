description = "Apostolic letter CCCVI, at Bishop Pompallier’s request, provisionally attaches the Friendly (Tonga) Islands to the western Oceania vicariate, the central vicariate’s 1842 bounds otherwise remaining; intitulation, narrative, union, decernentes clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF54185–54185; the source dating clause at LF54249–54252 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima februarii millesimo octin- gentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. The witness abbreviates conventional formulae with “etc.” (“contigerit attentari etc.”, LF54247); these remain literal and are not expanded. LF54194 prints “ficil 14 praestare”; retained literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-03"]
