notes = "Letter CCLXXIII to Archbishop Alois Josef Schrenk of Prague deplores the campaign of schismatics, Protestants and Hussites in Bohemia, urges vigilance against bad books and care of the seminary and praises its rector Rost; address LF46451–46453, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF46456–46456; the source dating clause at LF46634–46637 reads: Datum Romae apud s, Petrum die trigesima prima martii millesimo octingentesimo quadra- gesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
