notes = "Bull CXC raises the collegiate church of SS. Peter and Paul at Pitigliano to a co-cathedral united aeque principaliter with Sovana, transfers and reconstitutes the Sovana chapter, founds a parish, suppresses and unites benefices, and closes with taxation, executor, Nulli ergo and incarnation-year dating clauses (idibus ianuarii = 13 January). The intitulation is OCR’d “GREGORIUS EPISCCPUS” (LF34787), which is why the detector left the issuer unestablished; the bull’s form and its dating “pontificatus Nostri anno decimo secundo” are papal. Issuer evidence: GREGORIUS EPISCCPUS at LF34787–34787; the source dating clause at LF35733–35736 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo tertio, idibus ianuarii, pon- tificatus Nostri anno decimo secundo. LF35179 begins “sbyteratus Pitilianensis” after LF35178 “… praebendae canonicali,”; native geometry shows both lines full-width at the column margins (x1255–2271 and x1256–2275, line pitch 56 px) with the first WORD box (x1256–1465) exactly ten glyph-widths, so no glyph, word or line is absent from the acquired OCR relative to the printed line; the reading is retained literally. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF35119 “~”; LF35158 “-omnes”; LF35262 “. .”; LF35439 “-mendorum”; LF35440 “‘perpetuo”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
