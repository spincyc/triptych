notes = "Apostolic letter CCCXXI raises the confraternity of Our Lady of the Rosary at the Ponte della Maddalena in Naples to an archconfraternity with power of aggregation; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF56181, printed at the foot of leaf 407 inside the span of CCCXXII. Issuer evidence: GREGORIUS PP. XVI. at LF56063–56063; the source dating clause at LF56140–56143 reads: Datum Romae apud s. Petrum sub annulo piscatoris die tertia iunii millesimo octingen- tesimo quadragesimo quinto, pontificatus No- stri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
