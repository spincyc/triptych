description = "Apostolic letter CCLXXIV separates the Hudson Bay and James Bay territories from Quebec and erects them into an apostolic vicariate with stated bounds; intitulation, narrative, erection, decernentes clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF46651–46651; the source dating clause at LF46712–46715 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima sexta aprilis millesimo octingentesimo quadragesimo quarto, pontifi- catus Nostri anno decimo quarto. The witness abbreviates conventional formulae with “etc.” (“sortiri et obtinere etc.”, LF46710); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
