title = "Ex debito pastoralis officii — Vicariatus apostolicus ad Sinum Hudsonium et Iacobinianum ab archiepiscopatu Quebecensi separatus erigitur — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1902."
