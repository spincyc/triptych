description = "Epistle CCLV to King Ferdinand II of the Two Sicilies (address LF43893–43894, protocol LF43897, salutation LF43900–43901) commends the new ordinary nuncio Gabriele (Ferretti), archbishop of Seleucia, and ends with its own 22 August 1833 closing at LF43958–43961, before numeral CCLVI at LF43964. Issuer evidence is GREGORIUS PP. XVI. at LF43897–43897; the source closing at LF43958–43961 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima secunda augusti millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
