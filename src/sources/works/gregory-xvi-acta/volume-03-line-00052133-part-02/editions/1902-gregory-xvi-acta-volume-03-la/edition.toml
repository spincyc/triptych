title = "Ecclesiae ministerio addictos viros — Archipresbytero et canonicis collegiatae oppidi Argentae rocchetum, palliolum, cappa et fascia conceduntur — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1902."
