description = "Indult CCXCIII grants the archpriest and canons of the collegiate church of S. Niccolò at Argenta (diocese of Ravenna) rochet, mantelletta, cappa and violet hat-band; intitulation, narrative, grant, non obstantibus clause and dating clause survive. Its numeral LF52221 (OCR “CCXCIT.”) was missed by the detector. Issuer evidence: GREGORIUS PP. XVI. at LF52232–52232; the source dating clause at LF52291–52294 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die sexta augusti millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. The witness abbreviates conventional formulae with “etc.” (“ordinationibus etc.”, LF52285); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
