notes = "Letter CXCI (address LF41662–41663 to Bishop Carlo Odescalchi) accepts with sorrow his renunciation of the cardinalate and of his offices so that he may enter the Society of Jesus; LF41719 → LF41726 across own provenance LF41720 and running title LF41723; complete 30 November 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF41666–41666; the source closing at LF41751–41754 reads: Datum Romae apud sanctum Petrum die trigesima novembris millesimo octingentesimo trigesimo octavo, pontificatus Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
