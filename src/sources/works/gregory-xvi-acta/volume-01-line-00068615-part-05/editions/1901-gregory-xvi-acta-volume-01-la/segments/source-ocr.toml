context = "Epistle CCCLXVIII (OCR CCCLXVIH. / EPTISTOLA) to Jean-Pierre Boyer, president of the Republic of Haiti (address LF68979–68982, protocol LF68985, salutation LF68988–68989), announces that the spiritual care of the whole island has been committed to Bishop John England of Charleston, asks that the legal impediments to ecclesiastical jurisdiction be removed, welcomes the students to be sent to Rome, and ends with its own 21 August 1834 closing at LF69133–69136; the leaf-471 page number LF69139 (OCR 4.53) and numeral CCCLXIX at LF69142 follow. Issuer evidence is GREGORIUS PP. XVI. at LF68985–68985; the source closing at LF69133–69136 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima prima augusti millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Its foot-note LF69022, a head speck (LF69025), and the leaf-471 running title, which the OCR splits as ANNO MDC (LF69028, left) and CCXXXIV. with a speck (LF69092–69093, right), are excluded; the second half of that running title is the false heading of proposal frame line-00069092, which continues this letter. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
