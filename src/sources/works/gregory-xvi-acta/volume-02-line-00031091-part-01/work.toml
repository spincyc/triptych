description = "Brief CXLII (address LF31100–31101 to the bishop of Pavia) lets him detach an arm of Blessed Bernardino Tomitani for the people of Feltre notwithstanding a papal prohibition; LF31132 → LF31178 across the Griffith note (LF31135–31170, another act), own provenance LF31172 and running title LF31175; complete 13 June 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF31104–31104; the source closing at LF31233–31236 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima tertia iunii mil- lesimo octingentesimo trigesimo septimo, pon- tificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
