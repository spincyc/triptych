description = "Apostolic letter CXCVI raises the confraternity of the Most Holy and Afflicted Heart of Mary at Mouilleron-le-Captif (diocese of Luçon) to an archconfraternity with power of aggregation; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF36459–36459; the source dating clause at LF36544–36547 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die septima februarii mille- simo octingentesimo quadragesimo tertio, pon- tificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF36505 “‘usu”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
