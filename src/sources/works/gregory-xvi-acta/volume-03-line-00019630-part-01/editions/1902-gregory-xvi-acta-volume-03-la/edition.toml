notes = "Apostolic letter XCIX (numeral OCR’d “IC.”) confirms the transfer of the Linz cathedral to the former Jesuit church and reduces the old cathedral to a parish; derogations and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF19641–19641; the source dating clause at LF19776–19779 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima octava iun. millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
