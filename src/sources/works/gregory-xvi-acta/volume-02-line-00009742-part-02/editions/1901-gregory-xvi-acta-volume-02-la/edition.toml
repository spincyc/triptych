notes = "Brief LV (OCR LY.) imposes a perpetual 20-scudi pension on the vacant deanery prebend of S. Michele in Foro, Lucca, for the church fabric, at the Duke of Lucca’s request; LF9890 → LF9893 column change; complete 1 September 1835 closing. Own provenance LF9963 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF9884–9884; the source closing at LF9957–9960 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die prima septembris millesimo octingentesimo trigesimo quinto , pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
