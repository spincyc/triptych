notes = "Letter CCCXIX (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF59507–59510) grants the major seminary of Mechelen the power to confer doctorates and other degrees in theology and canon law as in universities and ends with its own 8 April 1834 closing at LF59707, before numeral CCCXX at LF59713. Issuer evidence is GREGORIUS PP. XVI. at LF59507–59507; the source closing at LF59704–59707 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die octava aprilis millesimo Octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. LF59619 (1 Ex Bullario Romano.) is its own provenance note, excluded with the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
