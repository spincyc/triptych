notes = "Letter CCXLVIII (protocol LF42885–42888) raises the Mercedarian confraternity in the church of Nossa Senhora do Parto at Rio de Janeiro to a third-order sodality, confirms its indults, permits statute revision and grants a privileged altar, ending with its own 24 July 1833 closing at LF43033–43036, before numeral CCXLIX at LF43039. Issuer evidence is GREGORIUS PP. XVI. at LF42885–42885; the source closing at LF43033–43036 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quarta iulii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
