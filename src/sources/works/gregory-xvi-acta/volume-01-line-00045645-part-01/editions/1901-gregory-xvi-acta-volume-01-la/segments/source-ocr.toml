context = "Epistle CCLXIV to the dignitaries, canons and chapter of Belluno cathedral (address LF45659–45661, protocol LF45664) sends gold- and silver-woven vestments for the church in which the pope was baptized and ends with its own closing dated on his birthday, 13 September 1833, at LF45725–45728, before numeral CCLXV (OCR GOLXV.) at LF45734. Issuer evidence is GREGORIUS PP. XVI. at LF45664–45664; the source closing at LF45725–45728 reads: Datum Romae apud sanctam Mariam Maio- rem die Nostrae nativitatis decima tertia se- ptembris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno terrio. The isolated mark rs at the start of address line LF45661 lies left of the centred words (x323–338 against ecclesiae at x462) and is retained literally. Its own provenance note 1 (Ex Bullario Romano., LF45763) is printed at the foot of leaf 315 inside CCLXV's frame and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
