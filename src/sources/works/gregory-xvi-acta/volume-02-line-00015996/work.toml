description = "Brief XCIII (address LF16008–16011) appoints Jean-Baptiste Pompallier, bishop of Maronea, vicar apostolic of western Oceania for the Marists; LF16033 → LF16045 across XCII’s provenance LF16036, own provenance LF16039 and page number 110 LF16042; complete 13 May 1836 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF16014–16014; the source closing at LF16091–16094 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima tertia maii mil- lesimo octingentesimo trigesimo sexto, pontifi- catus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
