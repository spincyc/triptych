notes = "Motu proprio CCLIII, a brief to Cardinal Mario Mattei, secretary for internal affairs, settles the division of the Cancelleria palace between the vice-chancellor and the prefect of the Buon Governo and orders the three copies of the plan deposited; address LF43685–43688, intitulation, greeting, body, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF43691–43691; the source dating clause at LF43781–43784 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda decembris mil- lesimo octingentesimo quadragesimo tertio, pon- tificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
