notes = "Brief CXXXI to the vicar general of Cesena suppressing a simple benefice for a school chair at Montiano; address 21009–21011, protocol 21014, Datum 21287–21290 (pontifical year garbled in OCR). The page-153 running title is split by OCR into ANNO (21123) and MDCCCXXXII, (21191, emitted after the left column, followed by page number 135 at 21194); both pieces, plus 21052–21058 (provenance, gutter mark x1365, running title) and page number 136 (21267), are excluded. Issuer evidence GREGORIUS PP. XVI. at LF21014. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
