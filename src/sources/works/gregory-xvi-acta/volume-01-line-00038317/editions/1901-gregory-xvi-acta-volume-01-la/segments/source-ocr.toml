context = "Letter CCXXI (protocol GREGORIUS PP. XVI. ad futuram rei memoriam LF38327–38330) extends to the three new governors of the royal general hospital of Zaragoza the choir-absence indult of Benedict XIV and the abstinence indult of Pius VI, and ends with its own closing at LF38441–38444, followed by page number 249 (LF38447) and numeral CCXXII at LF38448. Issuer evidence is GREGORIUS PP. XVI. at LF38327–38327; the source closing at LF38441–38444 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die trigesima aprilis millesimo octingentesimo trigesimo ce pontificatus No- stri anno tertio. In the closing the year word after trigesimo is the OCR token ce (WORD box 639–764, the width of a printed word), retained literally; the date 30 April 1833 rests on die trigesima aprilis millesimo octingentesimo trigesimo … pontificatus Nostri anno tertio (April of the third pontifical year is April 1833). The block LF38350–38364 holds CCXX's note 1, this letter's note 2 (Ex eodem Bullario), top/left-edge scanner noise of native leaf 267 (LF38356–38361) and the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[38327, 38349], [38365, 38444]] selected from address/protocol LF38327 through the source closing LF38444. Read in full in acquired LF order within the lane read LF32605-39265 (claim LF32634-39204 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
