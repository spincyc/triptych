description = "Letter CCXXIV, addressed to Athanase-René Saullay de Vaistre of Tours (LF38745–38747), creates him and his primogenitary descendants barons and ends with its own 10 May 1833 closing at LF38817, before numeral CCXXV at LF38821. Issuer evidence is GREGORIUS PP. XVI. at LF38750–38750; the source closing at LF38812–38817 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima maii millesimo octingentesimo trigesimo tertio , pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
