context = "Apostolic letter LIX (numeral OCR’d “Bs 9.”) names the bishop of Apollonia printed as “Dominico Brown”, vicar apostolic of the Welsh district, apostolic visitor of the English Observant Franciscans; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF14062–14062; the source dating clause at LF14108–14111 reads: Datum Romae apud Sanctum Petrum sub an- nulo piscatoris die vigesima quinta decembris millesimo octingentesimo quadragesimo, pon- tificatus Nostri anno decimo. The witness abbreviates conventional formulae with “etc.” (“prudentia etc.”, LF14084; “Mandamus etc.”, LF14106); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
