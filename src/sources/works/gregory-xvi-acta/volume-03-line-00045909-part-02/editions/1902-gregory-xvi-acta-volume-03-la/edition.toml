notes = "Apostolic letter CCLXIX, after the martyrdom of Bishop Laurent-Marie Imbert, grants Bishop Jean-Joseph Ferréol of Belline, vicar apostolic of Korea, the faculty to choose a coadjutor with succession from the Paris Foreign Missions priests and have him consecrated; address LF46012–46014, intitulation (printed “GREGORIUS PP. XVI” without point), greeting, grant, non obstantibus clause and dating clause survive. Its numeral LF46003 (OCR “CCLAEX.”) was missed by the detector. Issuer evidence: GREGORIUS PP. XVI at LF46017–46017; the source dating clause at LF46089–46092 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda martii mille- simo octingentesimo quadragesimo quarto, pon- tificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
