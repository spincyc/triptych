notes = "The complete act divides the four English vicariates into eight and lists their jurisdictions; all county/territorial clauses, final exhortation and closing remain selected. The editorial numeral reads XXVIII here and again for the next Torlonia letter; no numeral correction or merger is made. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF10323–10323; the source closing at LF10490–10493 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die tertia iul. mil- lesimo octingentesimo quadragesimo, pontifica- tus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
