description = "Letter CCLXII to Francesco Carleschi, patrician of Città di Castello (address LF45421–45422, protocol LF45425), creates him count with remainder to his brother Luigi and his primogeniture, and ends with its own 10 September 1833 closing at LF45494–45497, before numeral CCLXIII at LF45500. Issuer evidence is GREGORIUS PP. XVI. at LF45425–45425; the source closing at LF45494–45497 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septem- bris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
