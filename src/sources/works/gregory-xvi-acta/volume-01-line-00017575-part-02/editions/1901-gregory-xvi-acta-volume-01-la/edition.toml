notes = "Brief CXIV creating Audentius Amorelli of Sambuca and his heirs counts of the Lateran palace; protocol 17735, Datum 17788–17791. The printing gives no separate address line; the addressee is named in the excluded synopsis and the salutation Dilecte fili. No internal gap: the selected extent is one continuous run of the act. Issuer evidence GREGORIUS PP. XVI. at LF17735. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
