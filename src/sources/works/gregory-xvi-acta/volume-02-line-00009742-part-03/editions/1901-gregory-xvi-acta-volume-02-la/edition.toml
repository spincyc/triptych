notes = "Brief LVI declares Salvatore Gallani and heirs patrons of the Parma cathedral primicerial benefice with right of nomination; LF10042 cau- → LF10051 sarum across column mark LF10045 and the page-68 running title LF10048; complete 4 September 1835 closing (the line LF10075 begins with a literal OCR mark *). Own provenance LF10121 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF9984–9984; the source closing at LF10075–10078 reads: * Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die quarta septem- bris millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
