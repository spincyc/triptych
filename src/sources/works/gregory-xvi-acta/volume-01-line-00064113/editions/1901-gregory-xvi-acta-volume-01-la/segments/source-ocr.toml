context = "Letter CCCXL to John Bede Polding, bishop of Hierocaesarea (address LF64121–64122, protocol LF64125), appoints him apostolic vicar of New Holland and Van Diemen's Land and ends with its own 3 June 1834 closing at LF64201, before numeral CCCXLI at LF64204. Issuer evidence is GREGORIUS PP. XVI. at LF64125–64125; the source closing at LF64198–64201 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die tertia iunii millesimo octingentesimo trigesimo quarto , pon sieatrs Nostri anno quarto, The printed derogation clause is itself abridged in this witness (Non obstantibus apostolicis etc. derogamus caeterisque contrariis quibuscumque, LF64195–64196); it is retained literally and no other omission is indicated. The word pontificatus is garbled (pon sieatrs) in the dating clause. The block LF64144–64150 holds CCCXXXIX's note 1, this letter's note 2 (Ex eodem Bullario,) and page number 420. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[64121, 64143], [64151, 64201]] selected from address/protocol LF64121 through the source closing LF64201. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
