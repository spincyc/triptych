description = "Apostolic letter CCCLXVIII provides the Jesuit Alexis Canoz to the see of Tamassus in Cyprus in partibus infidelium, dispenses him from residence and empowers any Catholic bishop to consecrate him; address, intitulation, greeting “Dilecte fili”, body, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF76428–76428; the source dating clause at LF76560–76563 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda maii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo sexto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF76451 “i ipsarum”; LF76487 “a vane”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
