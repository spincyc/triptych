description = "Letter CXCV, addressed to Cardinal Agostino Rivarola (LF34068–34070), appoints him apostolic visitor of the missionary college of Sant'Antonio of the Conventual Franciscans in Rome, commands obedience, derogates contrary statutes and ends with its own 15 January 1833 closing at LF34131, before numeral CXCVI at LF34134. Issuer evidence is GREGORIUS PP. XVI. at LF34073–34073; the source closing at LF34124–34131 reads: Datum Romae apud sanctum Petrum sub ‘annulo piscatoris die decima quinta ianuarii millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno secundo. LF34113 is a foot speck and LF34116 (t Ex Bullario Romano,) is its own provenance note 1; with page number 221 (LF34119) they form the excluded block. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
