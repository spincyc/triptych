description = "Bull CIV (numeral OCR’d “Gly,”) suppresses the Caserta Vecchia see and erects the cathedral, chapter and see of Caserta Nuova, with executor, Nulli ergo and incarnation-style dating clause (idibus iulii = 15 July). Issuer evidence: GREGORIUS EPISCOPUS at LF20525–20525; the source dating clause at LF20903–20906 reads: Datum Romae apud s. Mariam Maiorem anno incarnationis dominicae millesimo octingente- simo quadragesimo primo idibus iulii, ponti- ficatus Nostri anno decimo primo. The witness abbreviates conventional formulae with “etc.” (“executione etc.:”, LF20872); these remain literal and are not expanded. A stray hyphen OCR’d at the start of LF20666 (“- curam”) remains literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
