description = "Indult CVII grants the prior and canons of San Lorenzo, Florence, a black hat-tassel and gold octagonal cross; derogations and dating clause survive. LF21724–21738 at the foot of leaf 161 are letter CVI’s own notes1–3 and are retained there, not omitted here. Issuer evidence: GREGORIUS PP. XVI at LF21674–21674; the source dating clause at LF21800–21803 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima septima iulii millesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
