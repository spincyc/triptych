notes = "Apostolic letter CCCLIV erects Japan, with the Ryūkyū (Lieou-Kieou) islands and adjacent islands, into a vicariate apostolic; intitulation, ad perpetuam formula, narrative, motu proprio erection, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF66830–66830; the source dating clause at LF66895–66898 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima martii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo sexto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF66835 “i im positi”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
