description = "Apostolic letter CCCXXXIV raises the Madrid confraternity of the Perpetual Adoration of the Most Holy Body of Christ to an archconfraternity with power of aggregation; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF64232–64232; the source dating clause at LF64322–64328 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die trigesima se- ptembris millesimo octingentesimo quadrage- simo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
