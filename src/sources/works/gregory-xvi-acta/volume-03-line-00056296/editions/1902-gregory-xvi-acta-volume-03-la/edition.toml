notes = "Apostolic letter CCCXXIII raises the confraternity of the Most Holy Name of Jesus at Oristano to an archconfraternity with power of aggregation; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF56304–56304; the source dating clause at LF56378–56381 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima septima iunii anno millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
