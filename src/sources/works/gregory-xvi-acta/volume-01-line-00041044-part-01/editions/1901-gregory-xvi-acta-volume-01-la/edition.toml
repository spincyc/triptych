notes = "Letter CCXXXVIII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF41060–41063) withdraws the Carmelite third-order confraternity of Salvador (Bahia) from the friars' jurisdiction, subjects it to the bishop, confirms its privileges and grants indulgences and a privileged altar, ending with its own 21 June 1833 closing at LF41280–41283, before numeral CCXXXIX (OCR GCXX xix...) at LF41286. Issuer evidence is GREGORIUS PP. XVI. at LF41060–41060; the source closing at LF41280–41283 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima prima iunii millesimo octingentesimo trigesimo tertio, pontificatus No- stri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
