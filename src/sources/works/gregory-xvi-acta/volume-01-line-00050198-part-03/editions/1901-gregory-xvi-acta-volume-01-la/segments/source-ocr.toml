context = "Letter CCXCII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF50542–50545) approves and confirms the society of the Holy Family founded at Verona by Leopoldina Naudet and ends with its own 20 December 1833 closing at LF50648, before numeral CCXCIII at LF50652. Issuer evidence is GREGORIUS PP. XVI. at LF50542–50542; the source closing at LF50645–50648 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima decembris mil- lesimo octingentesimo trigesimo tertio, ponti- ficatus Nostri anno tertio. LF50634 (1 Ex Bullario Romano.) is its own provenance note, excluded with the next running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[50542, 50565], [50567, 50633], [50638, 50648]] selected from address/protocol LF50542 through the source closing LF50648. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
