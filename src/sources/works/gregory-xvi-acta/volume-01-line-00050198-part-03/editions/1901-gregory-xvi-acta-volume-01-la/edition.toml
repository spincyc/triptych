notes = "Letter CCXCII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF50542–50545) approves and confirms the society of the Holy Family founded at Verona by Leopoldina Naudet and ends with its own 20 December 1833 closing at LF50648, before numeral CCXCIII at LF50652. Issuer evidence is GREGORIUS PP. XVI. at LF50542–50542; the source closing at LF50645–50648 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima decembris mil- lesimo octingentesimo trigesimo tertio, ponti- ficatus Nostri anno tertio. LF50634 (1 Ex Bullario Romano.) is its own provenance note, excluded with the next running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
