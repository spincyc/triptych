notes = "Letter CXXXII (consistorial form) grants the pallium to Patriarch Jacob Holas, with the forms of its assignment and of his oath; address, intitulation, body and incarnation-style dating clause survive. Issuer evidence: GREGORIUS EPISCOPUS at LF27805–27805; the source dating clause at LF27920–27924 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo secundo, quinto kalendas februarii, pontificatus Nostri anno decimo se- cundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
