context = "Epistle CCXCIV to Félicité de Lamennais (address - Dilecto filio / F. Lamenneio LF50751–50752, protocol LF50755) congratulates him on his declaration, exhorts him to persevere and commends his pupil Gerbet; it ends with its own 28 December 1833 closing at LF50838, before numeral CCXCV at LF50841. Issuer evidence is GREGORIUS PP. XVI. at LF50755–50755; the source closing at LF50836–50838 reads: Datum Romae apud s. Petrum die vigesima octava decembris millesimo octingentesimo tri- gesimo tertio, pontificatus Nostri anno tertio. The block LF50793–50800 holds CCXCIII's note 1, this epistle's note 2 (Ibidem.) and page number 332 (OCR 352). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[50751, 50792], [50801, 50838]] selected from address/protocol LF50751 through the source closing LF50838. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
