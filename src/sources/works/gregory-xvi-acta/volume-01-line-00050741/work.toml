description = "Epistle CCXCIV to Félicité de Lamennais (address - Dilecto filio / F. Lamenneio LF50751–50752, protocol LF50755) congratulates him on his declaration, exhorts him to persevere and commends his pupil Gerbet; it ends with its own 28 December 1833 closing at LF50838, before numeral CCXCV at LF50841. Issuer evidence is GREGORIUS PP. XVI. at LF50755–50755; the source closing at LF50836–50838 reads: Datum Romae apud s. Petrum die vigesima octava decembris millesimo octingentesimo tri- gesimo tertio, pontificatus Nostri anno tertio. The block LF50793–50800 holds CCXCIII's note 1, this epistle's note 2 (Ibidem.) and page number 332 (OCR 352). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
