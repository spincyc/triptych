notes = "Indult CCCLX (protocol LF67734–67735) grants the canons of Livorno cathedral the violet collar and an ermine-lined winter cappa magna, ending with its own 29 July 1834 closing at LF67828–67831, before its foot-note LF67834 and numeral CCCLXI (OCR Cecuxt*) at LF67837. Issuer evidence is GREGORIUS PP. XVI. at LF67734–67734; the source closing at LF67828–67831 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima nona iulii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
