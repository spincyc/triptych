notes = "Indult CCXXXV (numeral OCR CCXXXYV.) grants rochet and violet mozzetta to the archpriest and canons of Roccagorga (diocese of Priverno); stray marks LF51433 (native height 18 px between protocol lines) excluded; LF51475 → LF51484 across own provenance LF51478 and running title LF51481; LF51466 ends with a literal dash; complete 6 August 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF51430–51430; the source closing at LF51520–51523 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die sexta augusti millesimo octingentesimo trigesimo nono, pon- tificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
