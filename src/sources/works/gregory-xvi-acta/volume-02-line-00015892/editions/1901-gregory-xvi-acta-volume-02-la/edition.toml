notes = "Brief XCII separates the Montréal district from Québec and erects the diocese of Montréal immediately subject to the Holy See; LF15955 → LF15961 across page number LF15958; complete 13 May 1836 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF15906–15906; the source closing at LF15990–15993 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima tertia maii mille- simo octingentesimo trigesimo sexto, pontifi- catus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
