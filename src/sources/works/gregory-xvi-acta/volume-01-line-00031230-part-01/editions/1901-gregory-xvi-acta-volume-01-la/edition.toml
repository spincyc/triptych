notes = "Epistle CLXXXVIII to King Leopold of the Belgians (address LF31242–31243, protocol LF31246, salutation LF31247) acknowledges the mission of Viscount Charles Vilain XIV as envoy and the king's marriage to Louise of Orléans, and ends with its own 3 December 1832 closing at St Peter's (LF31310–31313). Issuer evidence is GREGORIUS PP. XVI. at LF31246–31246; the source closing at LF31310–31313 reads: Datum Romae apud sanctum Petrum die tertia decembris anno millesimo octingentesimo trigesimo secundo, pontificatus Nostri anno secundo. Its own provenance note 1 (Ex Archivio Brevium ad Principes) at LF31316 is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
