notes = "Indult CCCXXIX grants the canons of San Miniato cathedral the violet cappa with ermine over rochet and surplice and the beneficiaries the rochet and violet mozzetta; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF57009–57009; the source dating clause at LF57088–57091 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima secunda augusti millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
