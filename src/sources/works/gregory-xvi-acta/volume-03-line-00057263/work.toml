description = "Indult CCCXXXII grants the first dignitary and canons of the collegiate church of S. Pietro at Castelfranco (diocese of San Miniato) the rochet and ermine-trimmed mozzetta and the violet collar; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF57273–57273; the source dating clause at LF57349–57353 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima secunda augusti millesimo octingentesimo quadragesi- mo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
