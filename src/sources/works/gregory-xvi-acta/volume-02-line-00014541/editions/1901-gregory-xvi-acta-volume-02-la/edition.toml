notes = "Brief LXXXII (address LF14549–14550) makes Cardinal Agostino Rivarola apostolic commissary for rebuilding S. Maria degli Angeli after the earthquake; LF14571 → LF14583 across own provenance LF14574–14577 and page number 100 LF14580; LF14642 → LF14648 across running title LF14645; LF14616 aedi-/LF14617 ae and LF14619 gitur are OCR misreadings (native WORD boxes cover the printed ficio and Igitur positions), left literal; complete 26 February 1836 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF14553–14553; the source closing at LF14657–14660 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima sexta februarii millesimo octingentesimo trigesimo ae pontificatus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
