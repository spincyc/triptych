notes = "Apostolic letter CLXVI raises the Warsaw sodality of the Most Holy Heart of Mary to an archconfraternity with power to aggregate; decree, non obstantibus and dating clause survive. LF31833 and LF31843, though short, are right-column text. Issuer evidence: GREGORIUS PP. XVI. at LF31763–31763; the source dating clause at LF31852–31855 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die decima quinta iul. mille- simo octingentesimo quadragesimo secundo , pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
