notes = "Apostolic letter CCLII grants the dean of the Brno cathedral chapter the abbatial blessing and the faculty to consecrate chalices and sacred vessels and bless bells, with the bishop’s consent for anointings; intitulation, narrative, grant, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF43583–43583; the source dating clause at LF43674–43677 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quinta decembris millesimo octin- gentesimo quadragesimo tertio, pontificatus No- stri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF43634 “©”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
