context = "Letter CCCXVIII to Archbishop Vincentius Eduardus of Vienna and the bishops Gregorius Thomas of Linz and Antonius of St. Pölten praises their wish that the Virgin be honoured as conceived without original sin; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF55897, printed at the foot of leaf 405 inside the span of CCCXIX. Issuer evidence: GREGORIUS PP. XVI. at LF55793–55793; the source dating clause at LF55858–55860 reads: Datum Romae apud s. Petrum die septima maii millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. The letter refers to rescripts of the Congregation of Sacred Rites “heic adiectis” (LF55827–55828); this printing does not reproduce those separate curial rescripts, which are not part of the papal letter’s text. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete selected extent and at least twenty literal-LF lines of context on each side were read in this lane’s in-order read of LF54395–77200 (claim LF54423–77173). Every nonblank LF line of the span maps 1:1 to a native XML LINE (zero token mismatches; line-geometry.json), and leaf/column, indent, vertical-gap, intra-line word-gap, short-line and column-interleave geometry screens were dispositioned; no general image collation is claimed. Selected bounds [[55783, 55828], [55834, 55860]]."
