title = "Non mediocri quidem animi Nostri voluptate — Archiepiscopo Viennensi et episcopis Lincensi et Sancti Hippolyti de Immaculata Conceptione — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1902."
