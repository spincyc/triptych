notes = "Letter CCCXVIII to Archbishop Vincentius Eduardus of Vienna and the bishops Gregorius Thomas of Linz and Antonius of St. Pölten praises their wish that the Virgin be honoured as conceived without original sin; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF55897, printed at the foot of leaf 405 inside the span of CCCXIX. Issuer evidence: GREGORIUS PP. XVI. at LF55793–55793; the source dating clause at LF55858–55860 reads: Datum Romae apud s. Petrum die septima maii millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. The letter refers to rescripts of the Congregation of Sacred Rites “heic adiectis” (LF55827–55828); this printing does not reproduce those separate curial rescripts, which are not part of the papal letter’s text. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
