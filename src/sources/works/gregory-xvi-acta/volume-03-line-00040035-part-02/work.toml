description = "Apostolic letter CCXXV condemns and prohibits the pamphlet “Lettera sulla direzione degli studi” published under the name of Francesco Forti (Geneva 1843), with its summarized errors, censures, exhortation to the bishops, publication clause and dating clause. Its Latin text quotes the pamphlet’s Italian title. Issuer evidence: GREGORIUS PP. XVI. at LF40161–40161; the source dating clause at LF40352–40355 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die quinta augusti millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
