notes = "This raw frame opens with an edge mark (LF50591), the page-345 running title and the second half of allocution CCXXVIII (LF50597–50677, reviewed with that allocution); its act is letters CCXXIX (numeral OCR CORI), raising the confraternity of Our Lady of Providence at S. Carlo ai Catinari to an archconfraternity with power of aggregation for the Barnabite general; LF50734 → LF50747 across own provenance LF50737, printer’s signature LF50738, sheet number LF50741 and page number 346 LF50744; complete 16 July 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF50691–50691; the source closing at LF50792–50795 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die decima sexta iulii millesimo octingentesimo trigesimo nono, pon- tificatus Nostri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
