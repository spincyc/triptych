description = "Motu proprio CLXXXVII (protocol GREGORIUS PP. XVI. LF41001; Italian text) entrusts the Capitoline Museum to the Conservators of Rome under the high supervision of the majordomo, with the right to appoint its president-antiquary and staff, the Egyptian objects going to the Vatican; LF41019 → LF41028 across own provenance LF41022 and page number 280 LF41025; across running titles LF41098 and LF41174; dated Dato dal Nostro palazzo apostolico al Quirinale questo di 18 settembre 1838 (LF41213–41214). Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF41001–41001; the source closing at LF41213–41214 reads: Dato dal Nostro palazzo apostolico al Qui- rinale questo di 18 settembre 1838. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
