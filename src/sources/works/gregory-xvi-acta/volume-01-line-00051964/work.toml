description = "Letter CCCIII (OCR CCCII.), addressed to the archbishop, bishops and ordinaries of New Granada (LF51972–51975), protocol GREGORIUS EPISCOPUS (LF51978) and salutation, reduces holy days of obligation there, transfers the vigil fasts to Advent Fridays and Saturdays and ends with its own 31 January 1834 closing at LF52152, before numeral CCCIV at LF52155. Issuer evidence is GREGORIUS EPISCOPUS at LF51978–51978; the source closing at LF52149–52152 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die trigesima prima ianuarii millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno tertio. The genre label at LF51965 is garbled (BeUs loge) and is not relied on; the genre recorded is the neutral apostolic-letter. LF52028 (1 Ex Bullario Romano,) is its own provenance note, excluded with page number 340. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
