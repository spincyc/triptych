notes = "Letter CCCXXI to Robert St. Leger S.J. (address LF59809–59811, protocol LF59814) appoints him apostolic vicar of Calcutta immediately subject to the Holy See, excepting the territories of the vicars of Tibet and of Ava and Pegu, and ends with its own 18 April 1834 closing at LF59901; its note 1 (Ex Iure Pontificio de P. F.) is LF59904, before numeral CCCXXII at LF59910. Issuer evidence is GREGORIUS PP. XVI. at LF59814–59814; the source closing at LF59898–59901 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima octava aprilis mil- lesimo octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
