notes = "Letter CCXLII to Mariano Medrano, bishop of Buenos Aires (address LF41794–41795, protocol LF41798), reduces the holy days of obligation of his diocese, transfers vigil fasts to Advent Fridays and Saturdays and ends with its own 9 July 1833 closing at LF41952–41955, before numeral CCXLIII at LF41958. Issuer evidence is GREGORIUS PP. XVI. at LF41798–41798; the source closing at LF41952–41955 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die nona 1ulii mil- lesimo octingentesimo trigesimo. tertio, pon- tificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
