notes = "Bull LXIII confirms Holas’s election, translates him from Amasea to the Cilician patriarchate, and incorporates the fidelity-oath formula through “Sic me Deus adiuvet … evangelia »”; its incarnation-style dating clause follows at LF14739–14742. Issuer evidence: GREGORIUS EPISCOPUS at LF14483–14483; the source dating clause at LF14739–14742 reads: Datum Romae apud s. Petrum anno incar- nationis dominicae millesimo octingentesimo quadragesimo primo, quinto kalendas februa- rias, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
