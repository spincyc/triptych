context = "Letter CXLIX (OCR . CIL.; address LF31982–31986 to Pedro de Alcántara, bishop of Antiphellus and vicar apostolic of Bombay; protocol LF31989) after Stabellini’s resignation lets him choose a coadjutor with right of succession and elect him bishop of Calama; LF32005 → LF32045 across the Leo XII note continuation (LF32008–32036, another act), own provenance LF32039 and running title LF32042; dated 8 August 1837 (Datum Romae apud sanctam Mariam Maiorem die octava augusti). Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF31989–31989; the source closing at LF32100–32103 reads: Datum Romae apud sanctam Mariam Maio- rem die octava augusti millesimo octingente- simo trigesimo septimo, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete source extent and at least twenty literal-LF lines of surrounding context read within this lane’s literal read of LF27100–43620 (the held Solesmes constitutions LF32940–34925 were read literally to LF33500 and thereafter for structure: article/chapter numbering, page transitions and closing). Selected bounds [[31982, 32005], [32045, 32103]]. Whole-source TXT/XML token correspondence (294804 tokens) and native LINE/WORD geometry for the claim span were checked (back-jump, same-baseline split-line, line-start indent and inter-word gap scans, page-edge zones included). No page-image collation is claimed. Missing content: The printing breaks off the dispositive clause on the consecration of the coadjutor after “professionem catholicae fidei iuxta articulos a sede Nostra propositos etc.” and states “(Sequuntur clausulae etc.)” (LF32096–32098); the remaining faculty clauses and the non obstantibus clauses are not printed in this witness. The dating clause follows."
