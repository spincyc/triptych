notes = "Letter CCIII asks Cardinal Louis-Jacques-Maurice de Bonald of Lyon to receive nuncio Pecci on his way to Brussels; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37195–37195; the source dating clause at LF37230–37233 reads: Datum Romae apud s, Petrum sub annulo piscatoris die decima prima martii millesimo octingentesimo quadragesimo tertio, pontifica- tus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
