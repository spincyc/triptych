notes = "The act approves the Lucca duke’s Viareggio donation to the Servites with its endowment and parish provisions, retains full derogation, and closes at Castel Gandolfo. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF10804–10804; the source closing at LF10930–10932 reads: ’ Datum ab arce Gandulphi die vigesima prima iul. anni millesimi octingentesimi quadragesimi, pontificatus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
