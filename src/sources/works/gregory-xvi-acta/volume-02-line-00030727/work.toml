description = "Brief CXXXIX (in brief form ad perpetuam rei memoriam, printed under the label MOTU-PROPRIO) raises Mandela/Poggio Mirteto in the Sabina to the rank of city at the request of Cardinal Lambruschini, abbot of Farfa; LF30787 → LF30793 across running title LF30790; LF30852 → LF30861 across own provenance LF30855 and running title LF30858; complete 22 May 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF30735–30735; the source closing at LF30879–30886 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima secunda maii millesimo octingentesimo trigesimo septimo,’ pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
