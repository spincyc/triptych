notes = "Apostolic letter CCCXI confirms the visitation decrees of Cardinal Antonio Francesco Orioli and his two French disciplinary statutes for San Luigi dei Francesi with its annexed chapels and the other French pious establishments of Rome and Loreto; intitulation, ad perpetuam formula, narrative, confirmation, decernentes and non obstantibus clauses and dating clause survive. The statutes themselves are referred to as kept in the archive of the Secretariate of Briefs (LF54965–54970) and are not printed here. Issuer evidence: GREGORIUS PP. XVI. at LF54797–54797; the source dating clause at LF55035–55038 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima martii millesimo octin- gentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
