notes = "Indult CCXXVIII grants the canons of Alatri cathedral the violet collar and cassock; intitulation (“ad futuram rei memoriam”), narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF40530–40530; the source dating clause at LF40603–40606 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima prima augusti millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
