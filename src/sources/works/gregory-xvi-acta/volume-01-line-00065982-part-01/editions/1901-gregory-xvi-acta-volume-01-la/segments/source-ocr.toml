context = "Allocution CCCL, delivered in secret consistory (own dated caption HABITA IN CONSISTORIO SECRETO DIE VIGESIMA TERTIA IUNII ... TRIGESIMO QUARTO, LF65986–65988, retained), addresses the cardinals (LF66003), publishes Francesco Canali reserved in pectore in 1831, creates Luigi Battaglia, Gaetano Maria Trigona e Parisi and Paolo Polidori, reserves six others in pectore, and ends with the creation formula and In nomine Patris ... Amen at LF66116–66145, before numeral CCCLI (OCR GCCEI:) at LF66148. Issuer evidence is ACTA GREGORII PP. XVI. @ at LF66031–66031; the source closing at LF65986–65988 reads: HABITA IN CONSISTORIO SECRETO DIE VIGESIMA TERTIA IUNII MILLESIMO’ OCTINGENTESIMO TRIGESIMO QUARTO. The allocution has no sub annulo dating clause; its date is taken from its own retained caption LF65986–65988, following the accepted precedent of allocution CCXLIX. The edition numeral and genre label ALLOCUTIO (LF65982–65983) and the italic synopsis (LF65991–66000) are excluded; the wide provenance foot-note LF66106 (Ex archivio Consistorialis Congregationis, vide Acta Consistorialia ...) is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
