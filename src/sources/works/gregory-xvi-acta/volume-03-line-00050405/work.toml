description = "Apostolic letter CCLXXXIII, at Queen Maria II’s request through her envoy, reduces the holydays of obligation in the Portuguese dominions to those listed and transfers patronal feasts to the following Sunday; intitulation, narrative, decree, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF50414–50414; the source dating clause at LF50492–50495 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quarta iunii mil- lesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
