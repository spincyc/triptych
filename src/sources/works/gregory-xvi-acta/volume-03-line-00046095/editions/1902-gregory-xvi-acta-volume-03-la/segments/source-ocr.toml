context = "Indult CCLXX grants the beneficiaries of the cathedral of Segni the black sash; intitulation “GREGORIUS PP. XVI. ad futuram rei memoriam”, narrative, grant, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF46103–46103; the source dating clause at LF46168–46171 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda martii mille- simo octingentesimo quadragesimo quarto, pon- tificatus Nostri anno decimo quinto. The dating clause (LF46168–46171) prints “die vigesima secunda martii millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quinto” (22 March 1844 would fall in the fourteenth pontifical year; the edition places the act among March 1844 acts); its calendar year and pontifical year disagree under the edition’s own placement, so the normalized date is left unknown rather than inferred (the printed day is 22 March). LF46158 ends with an isolated mark “'” after “conciliis”, retained literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
