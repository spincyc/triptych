notes = "Bull CCLVIII exempts the African sees of São Tomé and Angola from the metropolitan see of Bahia and makes them suffragans of the patriarch of Lisbon at Queen Maria II’s request, names Archbishop Camillo Di Pietro executor and closes with decernentes, non obstantibus, transumpt, Nulli ergo and incarnation-year dating clauses (idibus ianuarii = 13 January). Its numeral LF44750 (OCR “CCLVIUL.”) was missed by the detector. Issuer evidence: GREGORIUS EPISCOPUS at LF44761–44761; the source dating clause at LF44944–44947 reads: Datum Romae apud s. Petrum anno incar- nationis dominicae millesimo octingentesimo quadragesimo quarto, idibus ianuarii, pontifi- catus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
