description = "Letter CCCXXXVIII to Archbishop-bishop Francesco Saverio of Malta condemns the Methodist periodical “L’Indicatore, giornale religioso” printed on the island and urges him to keep it from his flock; address, intitulation, greeting, body, blessing and dating clause (“Dutum Romae …”) survive. Issuer evidence: GREGORIUS PP. XVI. at LF65312–65312; the source dating clause at LF65411–65414 reads: Dutum Romae apud sanctum Petrum die vi- gesima sexta novemb. millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
