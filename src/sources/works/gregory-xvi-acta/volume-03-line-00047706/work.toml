description = "Bull CCLXXIX dismembers fifteen towns from Syracuse, suppresses the collegiality of S. Nicolò at Noto and erects the city, cathedral, chapter, seminary and see of Noto with royal nomination, dotation from the abbey dell’Arco, future Syracusan metropolitan subjection, taxation, executor (Archbishop Celestino Cocle), decernentes, non obstantibus, transumpt, Nulli ergo and incarnation-year dating clauses (idibus maii, OCR “mali”, = 15 May). Issuer evidence: GREGORIUS EPISCOPUS at LF47714–47714; the source dating clause at LF48328–48331 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo quarto, idibus mali, ponti- ficatus Nostri anno decimo quarto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF48027 “_extantium”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
