context = "Letter CCV, addressed to Peter of Alcantara, bishop of Antiphellus and vicar apostolic of Bombay (LF35874–35877), appoints him interim vicar apostolic of the Madras mission with its temporal rights held hitherto by the Capuchins, and ends with its own 5 March 1833 closing at LF35966, before numeral CCVI at LF35969. Issuer evidence is GREGORIUS PP. XVI. at LF35880–35880; the source closing at LF35963–35966 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quinta marti millesimo octin- gentesimo trigesimo tertio, pontificatus Nostri anno tertio. The excluded block LF35925–35931 holds CCIV's note 1, this letter's note 2 (Ex Iure Pontificio de P. F.) and the first half ANNO: of the running title of native leaf 251. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
