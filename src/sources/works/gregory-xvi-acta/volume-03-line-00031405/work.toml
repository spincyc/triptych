description = "Apostolic letter CLXIII raises Camillo Mazzetti’s Pietralata estate to a marquisate with succession; derogations and dating clause survive. LF31450–31453 at the foot of leaf 230 are held letter CLXII’s own notes1–2 continued, not furniture of this act; they are simply not selected here. Issuer evidence: GREGORIUS PP. XVI. at LF31416–31416; the source dating clause at LF31539–31542 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava iunii millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
