description = "Letter CCLI to Archbishop Samuel Eccleston of Baltimore and his suffragans acknowledges the fifth provincial council, refers its decrees to Propaganda and praises the growth of the American church; address LF43477–43479, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF43593 at the foot of leaf 317. Issuer evidence: GREGORIUS PP. XVI. at LF43482–43482; the source dating clause at LF43567–43570 reads: Datum Romae apud s. Petrum sub annulo piscatoris die secunda decembris millesimo octingentesimo quadragesimo tertio, pontifi- catus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
