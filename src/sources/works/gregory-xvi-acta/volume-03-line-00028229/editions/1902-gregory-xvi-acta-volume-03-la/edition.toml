notes = "Apostolic letter CXXXVI transfers Bishop William Fraser of Tanis to the new see of Halifax; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF28242–28242; the source dating clause at LF28364–28367 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quinta februarii millesimo octingentesimo quadragesimo secun- do, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
