notes = "Letter XC to Maria II of Portugal welcomes her extraordinary envoy; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI at LF18591–18591; the source dating clause at LF18652–18655 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima septima maii millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
