description = "Letter CCCLXXVII (OCR GCCLXXVII.), addressed to Count Pietro Ercole Pallavicini of Bologna (LF70326–70328; protocol GREGORIUS: PP. XVI. LF70331; salutation LF70334–70335), creates him and his male primogenitary descendants princes, and ends with its own 12 September 1834 closing at LF70412–70415, before numeral CCCLXXVIII at LF70418. Issuer evidence is GREGORIUS: PP. XVI. at LF70331–70331; the source closing at LF70412–70415 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima secunda septembris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
