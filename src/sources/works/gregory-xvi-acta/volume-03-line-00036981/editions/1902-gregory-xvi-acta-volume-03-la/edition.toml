notes = "Letter CC presents Archbishop Gioacchino Pecci of Damietta as nuncio to Leopold I; address LF36990–36991 (foot of leaf 270 left), intitulation LF36997 after the right-column running title, greeting, body and dating clause survive. Its provenance is note2 LF37070. Issuer evidence: GREGORIUS PP. XVI. at LF36997–36997; the source dating clause at LF37034–37037 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima prima martii millesimo octingentesimo quadragesimo tertio, pontifica- tus Nostri anno decimo tertio, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
