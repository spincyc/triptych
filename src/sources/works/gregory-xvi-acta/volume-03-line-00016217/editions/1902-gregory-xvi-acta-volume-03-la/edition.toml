notes = "Indult LXXIV grants rochet and violet mozzetta to the canons of Capodimonte (Montefiascone diocese); derogations and dating clause survive. Its provenance note1 is LF16351. Issuer evidence: GREGORIUS PP. XVI. at LF16226–16226; the source dating clause at LF16303–16306 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quinta mart. millesimo octin- gentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
