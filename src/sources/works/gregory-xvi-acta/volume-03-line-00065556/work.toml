description = "Consistorial allocution CCCXL creates and declares cardinal priests Guilherme Henriques de Carvalho, patriarch of Lisbon, Sisto Riario Sforza, archbishop of Naples, and Joseph Bernet, archbishop of Aix; it runs from “Venerabiles fratres” LF65575 to “Amen.” LF65697. Issuer evidence: ACTA GREGORII PP. XVI. at LF65656–65656; the source dating clause at LF65571–65572 reads: DIE DECIMANONA IANUARIL AN. MILLESIM OCTINGENTESIMI QUADRAGESIMI SEXTI,. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF65694 “opportunis. :”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
