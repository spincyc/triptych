notes = "Brief CLXXIV (address LF38739–38742 to Ignatius Paparian) commissions him, named archbishop of Tharon by letters of the same day, to perform Armenian pontificals and ordinations in Rome; LF38754 → LF38763 across own provenance LF38757 and page number 264 LF38760; complete 11 May 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF38745–38745; the source closing at LF38794–38797 reads: Datum Romae apud s. Petrum sub annulo piscatoris die undecima maii millesimo octin- gentesimo trigesimo octavo, pontificatus Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
