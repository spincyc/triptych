description = "Letter CCCLXXXII (OCR CGCLXXXII.), addressed to the archbishop of Lucca (LF71719–71720; protocol LF71723; salutation LF71726–71727), commits to him to allow daily Mass, satisfying the precept, in Count Carlo Orsucci's chapel at Pianone, and ends with its own 26 September 1834 closing at LF71801–71804, before numeral CCCLXXXIII at LF71807. Issuer evidence is GREGORIUS PP. XVI. at LF71723–71723; the source closing at LF71801–71804 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima sexta septembris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
