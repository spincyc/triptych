notes = "Brief XLV commissions the bishop of Modena to permit daily Mass in the oratory of the house for deaf-mute women; single left column LF8690–8740 with complete 27 June 1835 closing. Own provenance LF8810 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF8690–8690; the source closing at LF8737–8740 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima iunii millesimo Octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
