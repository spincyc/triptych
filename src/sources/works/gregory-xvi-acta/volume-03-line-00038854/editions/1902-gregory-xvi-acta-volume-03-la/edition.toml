notes = "Letter CCXVII answers Bishop Heinrich von Hofstätter of Passau on Catholic funerals for those dying outside the Church; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF38877–38877; the source dating clause at LF38957–38960 reads: Datum Romae apud s. Petrum die trigesima aprilis anno millesimo octingentesimo quadra- gesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
