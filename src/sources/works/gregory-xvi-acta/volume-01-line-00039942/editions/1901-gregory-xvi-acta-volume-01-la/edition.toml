notes = "Letter CCXXXIV to Stephanus Rouchouze (address LF39964–39966, protocol LF39969) defines the Pacific mission of the Picpus congregation (Easter Island to the Roggeveen archipelago, Sandwich Islands to the Tropic of Capricorn) and makes him its vicar apostolic over the prefects apostolic, ending with its own 14 June 1833 closing at LF40098–40101, before numeral CCXXXV at LF40104. Issuer evidence is GREGORIUS PP. XVI. at LF39969–39969; the source closing at LF40098–40101 reads: .Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quarta iunil mil- lesimo octingentesimo trigesimo tertio, ponti- fi¢atus Nostri anno tertio. The caption block LF39942–39961 includes the isolated marks = (LF39945) and or Ls (LF39961, WORDs at x1510 and x2140) between synopsis and address. Its own provenance note (Ex Iure Pont. de P. F., LF39992), page number 260 (LF39995) and the leaf-278 running title with a speck (LF40066–40069) are excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
