notes = "Letter CCLXXIX (protocol LF48214–48217) grants the canons of Novara cathedral a gold pectoral cross with the image of the Virgin and the legend Capitulum Novariense, not to be worn over choir or sacred vestments, and ends with its own 22 November 1833 closing at LF48304–48307, immediately before numeral CCLXXX at LF48310 (outside this claim). No act continues beyond the claim end. Issuer evidence is GREGORIUS PP. XVI. at LF48214–48214; the source closing at LF48304–48307 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima secunda novem- bris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Its own provenance note 1 (t Ex Bullario Romano., LF48188) is printed at the foot of leaf 332 inside CCLXXVIII's text and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
