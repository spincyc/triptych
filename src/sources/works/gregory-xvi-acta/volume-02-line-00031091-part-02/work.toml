description = "Brief CXLIII grants the church and house of SS. Salvatore in Campo to the Missionaries of the Precious Blood; LF31302 → LF31311 across own provenance LF31305 and page number 212 LF31308; LF31371 → LF31377 across running title LF31374; its closing reads die vigesima septima iulii millesimo octingentesimo quadragesimo primo, pontificatus Nostri anno undecimo (27 July 1841, consistent with its regnal year), although the edition prints it among the acts of 1837; the date is taken literally. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF31251–31251; the source closing at LF31398–31401 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris dié vigesima septima iulii millesimo octingentesimo quadragesimo primo, pontificatus Nostri anno undecimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
