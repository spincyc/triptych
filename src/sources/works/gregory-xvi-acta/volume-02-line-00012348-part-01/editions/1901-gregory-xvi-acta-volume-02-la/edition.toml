notes = "Brief LXVIII to the bishop of Luni-Sarzana-Brugnato (address LF12361–12363) authorises the Chiocca–Gessi settlement and pension; LF12423 → LF12432 across own provenance LF12426 and page-85 running title LF12429; complete 25 September 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF12366–12366; the source closing at LF12477–12481 reads: Datum Romae apud sanctam Mariam Maio- “rem sub annulo piscatoris die vigesima quinta septembris millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
