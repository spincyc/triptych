notes = "Bull CCXIII, at Louis-Philippe’s request, constitutes the royal chapter of Saint-Denis immediately subject to the Holy See with its primicerius’s jurisdiction, extends it to the Legion of Honour school, and closes with executor, decernentes, non obstantibus, transumpt, Nulli ergo and incarnation-year dating clauses (nonis aprilis = 5 April). Issuer evidence: GREGORIUS EPISCOPUS at LF38235–38235; the source dating clause at LF38558–38561 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo tertio, nonis aprilis, ponti- ficatus Nostri anno aeaino tertio. Three OCR misreadings are retained literally and disclosed: LF38405 “insignibu” (the WORD box ends 19 px before the column margin, the final glyph unrecognised), LF38493 “nomine = Sedis” (a 38-px token in a 92-px gap between two words, i.e. a short printed token misread, not a missing word), and the pontifical year “aeaino” in the dating clause LF38561. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF38511 “_ Praesentes”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
