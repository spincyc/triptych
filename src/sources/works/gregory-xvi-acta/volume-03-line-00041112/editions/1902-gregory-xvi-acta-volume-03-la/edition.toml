notes = "Letter CCXXXIII to the Catholics of the Netherlands declares the Jansenist election and consecration of Henricus Johannes van Buul as bishop of Haarlem by Johannes van Santen illegitimate and excommunicates those involved; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF41132–41132; the source dating clause at LF41227–41230 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die quarta septem- bris millesimo octingentesimo quadragesimo ter- tio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
