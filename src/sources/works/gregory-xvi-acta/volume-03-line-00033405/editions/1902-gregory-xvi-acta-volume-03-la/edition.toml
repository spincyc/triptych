notes = "Bull CLXXX executes Leo XII’s Quod iamdiu by exchanging parishes between the dioceses of Liège and Namur, with both parish catalogues, executor, decernentes, non obstantibus, transumpt and Nulli ergo clauses and incarnation-year dating clause (nonis octobris = 7 October). The edition’s genre label is OCR-illegible (“UTES”); the genre is recorded as bull from the documentary form (GREGORIUS EPISCOPUS servus servorum Dei, Nulli ergo, incarnation-year dating). Issuer evidence: GREGORIUS EPISCOPUS at LF33425–33425; the source dating clause at LF33692–33695 reads: Datum Romae apud sanctam Mariam Maio- rem anno incarnationis dominicae millesimo octingentesimo quadragesimo secundo, nonis octobris, pontificatus Nostri anno duodecimo. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF33496 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
