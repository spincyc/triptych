description = "Letter CCCLII (OCR Shae CCCLII. at LF66400), addressed to Francis Thomas Corselis, adjutor of the vicar general of Ghent (LF66411–66414; protocol LF66417; salutation LF66420–66421), appoints him apostolic visitor and delegate of all regular orders in Belgium with the faculties of their generals, and ends with its own 27 June 1834 closing at LF66577–66580, before numeral CCCLIII at LF66583. Issuer evidence is GREGORIUS PP. XVI. at LF66417–66417; the source closing at LF66577–66580 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima iunii millesimo Octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. A top-edge speck and the leaf-453 running title with page number 435 (LF66394–66397) precede the numeral and lie outside the extent. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
