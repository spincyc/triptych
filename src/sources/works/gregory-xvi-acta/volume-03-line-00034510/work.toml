description = "Letter CLXXXVII answers the president general of the English Benedictine congregation on its general chapter; intitulation, greeting “Dilecte fili”, body, blessing and dating clause survive (no separate address printed). Issuer evidence: GREGORIUS PP. XVI. at LF34521–34521; the source dating clause at LF34583–34586 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima prima decembris mille- simo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
