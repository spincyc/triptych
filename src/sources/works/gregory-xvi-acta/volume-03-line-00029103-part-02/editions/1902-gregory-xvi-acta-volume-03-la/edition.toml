notes = "Letter CXLIII accepts the queen’s request that her expected child be held at the font in the pope’s name and names the internuncio Capaccini as proxy; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF29190–29190; the source dating clause at LF29256–29260 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima secunda martii millesimo octingentesimo quadragesimo se- cundo, pontificatus Nostri anno decimo se- cundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
