context = "Letter CCIX, addressed to Camillo Prosperini of Città di Castello (LF36399–36400), creates him and his legitimate primogenitary descendants marquises and ends with its own 8 March 1833 closing at LF36470, before numeral CCX at LF36473. Issuer evidence is GREGORIUS PP. XVI. at LF36403–36403; the source closing at LF36467–36470 reads: Datum Romae apud sanctuni Petrum sub annulo piscatoris die octava martii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Its provenance note 1 (Ex Bullario Romano,) is printed at LF36529 in CCX's foot block and is excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
