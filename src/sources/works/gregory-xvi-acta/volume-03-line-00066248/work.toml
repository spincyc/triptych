description = "Apostolic letter CCCXLVIII to each bishop of the Austrian dominions denounces the conspiracy against the emperor, urges the bishop to inculcate obedience to legitimate authority and to recall seditious clergy; intitulation, greeting “Venerabilis frater”, body, blessing and dating clause survive (no separate address is printed, the letter being addressed to the bishops singly). Issuer evidence: GREGORIUS PP. XVI. at LF66258–66258; the source dating clause at LF66369–66372 reads: Datum Romae apud s. Petrum die vigesima septima februarii millesimo octingentesimo qua- dragesimo sexto, pontificatus Nostri anno de- cimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
