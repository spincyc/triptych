notes = "Allocution CCLXVI asks for the votes on the canonization of b. Francis de Hieronymo and defers the decision to prayer; LF57953 → LF57962 across a speck LF57956 (native 7×10 px) and page number 395 LF57959; ends LF57999 before CCLXVII LF58002. Own provenance LF58033 excluded. Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORII PP. XVI. at LF57801–57801; the source closing at LF57993–57999 reads: -Quod mentes ac vota vestra de honoribus Sanctorum b. Francisco tribuendis plane con- sentiant, maxima cor Nostrum afficitur gaudii iucunditate: adhuc tamen summis ad Deum precibus instandum putamus, ut praesenti suae lucis ope, tantam rem feliciter absolvere ad eius voluntatem possimus. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
