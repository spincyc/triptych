notes = "Brief LXIII to the archbishop of Spoleto (address LF11023–11024) authorises the perpetual emphyteusis of the Luco field of the Madonna della Neve benefice; LF11060 → LF11069 across own provenance LF11063 and page number 75 LF11066; LF11136 → LF11142 across page-76 running title LF11139; complete 22 September 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF11027–11027; the source closing at LF11142–11145 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima se- cunda septembris millesimo octingentesimo tri- gesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
