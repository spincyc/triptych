context = "Apostolic letter CCCLIX confirms the Turin institute of the Penitent Sisters of St Mary Magdalen founded by the Marchioness Giulia Falletti di Barolo, approves its constitutions and rules and communicates to it the indulgences of the Sisters of the Sacred Heart; intitulation, ad perpetuam formula, narrative, approval, decernentes, non obstantibus and transumpt clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF67337–67337; the source dating clause at LF67474–67477 reads: Datum Romae apud s. Petrum sub annulo piscatoris die tertia aprilis millesimo octingen- tesimo quadragesimo sexto, pontificatus Nostri anno decimo sexto. The letter approves the institute’s constitutions and rules, whose autograph exemplar is kept in the archive of the Congregation of Bishops and Regulars (LF67405–67408); this printing does not reproduce them, and they are not part of the papal letter’s text. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
