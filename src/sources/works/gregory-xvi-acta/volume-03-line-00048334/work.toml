description = "Bull CCLXXX dismembers twelve towns from Agrigento, one from Cefalù and two from Nicosia and erects the city, cathedral, chapter, seminary and see of Caltanissetta with royal nomination, dotation from the abbey of S. Spirito, metropolitan subjection to Monreale, taxation, executor (Archbishop Celestino Cocle), decernentes, non obstantibus, transumpt, Nulli ergo and incarnation-year dating clauses (octavo kalendas iunii = 25 May). The printed protocol is “GREGORIUS EPISCOPUS servus servorum Dei salutem et apostolicam benedictionem.” with no address. Issuer evidence: GREGORIUS EPISCOPUS at LF48344–48344; the source dating clause at LF49011–49014 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo quarto, octavo kalendas iunii, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
