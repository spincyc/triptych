description = "Bull CCCLXXXIX, addressed to the bishop of Cesena (LF72925–72926; protocol GREGORIUS EPISCOPUS servus servorum Dei. * LF72929–72932; salutation LF72935–72938), commits to him the restoration of the collegiate church of San Cristoforo at Longiano with an archpriest and new canonries, the suppression and application of chaplaincies and a benefice for their endowment, and the erection of a new parish at Villa Scamni, and ends with its own closing kalendis decembris 1834 (1 December 1834) at LF73740–73743, before numeral CCCXC at LF73746. Issuer evidence is GREGORIUS EPISCOPUS at LF72929–72929; the source closing at LF73740–73743 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo trigesimo quarto kalendis decembris, pon- tificatus Nostri anno quarto. The page number 479 (LF72922) between the caption and the address, signatures, running titles, page numbers and a column of right-edge specks (LF73432–73443) are excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
