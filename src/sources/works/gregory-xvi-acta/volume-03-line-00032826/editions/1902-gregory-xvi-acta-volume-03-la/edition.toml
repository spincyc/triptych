notes = "Bull CLXXVII dismembers the San Salvador territory from Guatemala and erects the diocese and cathedral of San Salvador, with dotation, capitular, metropolitan, taxation and executor clauses, Nulli ergo and incarnation-year dating clause (quarto kalendas octobris = 28 September). Issuer evidence: GREGORIUS EPISCOPUS at LF32834–32834; the source dating clause at LF33226–33230 reads: Datum Romae apud sanctam Mariam Ma- iorem anno incarnationis dominicae millesimo octingentesimo quadragesimo secundo, quarto kalendas octobris, pontificatus Nostri anno duo- decimo. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF32909 “_protenduntur”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
