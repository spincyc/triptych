description = "Consistorial allocution of 19 January 1846 (edition numeral OCR’d “CCCXLII.”, in sequence CCCXLIII) reports the visit of Nicholas I, emperor of Russia and king of Poland, to Rome and the pope’s representations for the Catholics of his empire; it runs from “Venerabiles fratres” LF65885 to “… in vias planas.” LF65932. Its provenance note1 is LF65935. Issuer evidence: ACTA GREGORII PP. XVI. at LF65938–65938; the source dating clause at LF65881–65882 reads: DIE DECIMA NONA IANUARITI AN. MILLESIMI OCTINGENTESIMI QUADRAGESIMI SEXTI,. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
