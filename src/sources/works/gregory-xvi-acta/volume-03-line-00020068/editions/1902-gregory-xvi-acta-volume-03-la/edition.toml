notes = "Apostolic letter CI commissions the bishop of Michoacán to approve and erect the Oratory of St Philip Neri in León (“Lugduni”); full dispositive text, non obstantibus and dating clause survive. Its provenance note1 is LF20178. Issuer evidence: GREGORIUS PP. XVI. at LF20079–20079; the source dating clause at LF20172–20175 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die sexta iul. millesimo octin- gentesimo quadragesimo primo, pontificatus No- stri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
