description = "Letter CCXVIII, addressed to the bishop of Modena (LF37701–37702), commissions him to permit perpetual reservation of the Eucharist, communion and satisfaction of the festal precept in the domestic chapel of the Jesuit boarding college at Modena, and ends with its own 19 April 1833 closing at LF37842, before numeral CCXIX at LF37845. Issuer evidence is GREGORIUS PP. XVI.* at LF37705–37705; the source closing at LF37839–37842 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima nona aprilis mil- lesimo octingentesimo trigesimo tertio, ponti- ficatus Nostri anno tertio. LF37741 (1 Ex Bullario Romano.) is its own provenance note inside the excluded block LF37741–37747 (with a speck and the running title). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-01"]
