notes = "Brief CCXIX (address LF48334–48336) makes Perpetuo da Solero apostolic delegate for the Orientals of Egypt and Arabia on the model of the Lebanon delegation; continuous column text; complete 28 May 1839 closing. Own provenance LF48391, printer’s signature LF48392 and sheet number LF48395 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF48339–48339; the source closing at LF48385–48388 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava maii millesimo octingentesimo trigesimo nono, pontificatus No- stri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
