notes = "Brief CXCIV (address LF42228–42229 to the bishop of Warmia) appoints four Warmian canons judges of third-instance appeals for three years; LF42265 → LF42271 across running title LF42268; complete 7 December 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF42232–42232; the source closing at LF42329–42332 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die septima decembris mille- simo octingentesimo trigesimo octavo, ponti- ficatus Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
