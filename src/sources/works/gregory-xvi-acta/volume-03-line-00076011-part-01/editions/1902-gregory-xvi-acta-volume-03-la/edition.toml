notes = "Apostolic letter CCCLXIV provides the Capuchin Guglielmo Massaia to the see of Cassia in partibus infidelium, as head of the new Galla vicariate, dispenses him from residence and empowers any Catholic bishop to consecrate him; address, intitulation, greeting “Dilecte fili”, body, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF76025–76025; the source dating clause at LF76151–76154 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima secunda maii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo sexto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF76080 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
