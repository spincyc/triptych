notes = "Letter CCCXVIII (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF59421–59424) grants a plenary indulgence for the exposition of the Eucharist on the third Sunday of each month in parish churches of Pamplona and ends with its own 21 March 1834 closing at LF59494, before numeral CCCXIX (OCR COG,) at LF59497. Issuer evidence is GREGORIUS PP. XVI. . at LF59421–59421; the source closing at LF59491–59494 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima prima martii millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. LF59479 (1 Ex Bullario Romano.) is its own provenance note, excluded with page number 388. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
