description = "Epistle CXCII to King Ferdinand II of the Two Sicilies (address LF33321–33322, protocol LF33323, salutation LF33324–33325) rejoices at his marriage to Maria Christina of Savoy celebrated on 21 November after papal dispensation, imparts the blessing and ends with its own 7 January 1833 closing at St Peter's (LF33360–33363), before numeral CXCIII at LF33366. Issuer evidence is GREGORIUS PP. XVI. at LF33323–33323; the source closing at LF33360–33363 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die septima ianuarii mille- simo octingentesimo trigesimo tertio, ponti- ficatus. Nostri anno secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
