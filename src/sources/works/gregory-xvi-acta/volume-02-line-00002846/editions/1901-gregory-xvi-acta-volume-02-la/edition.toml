notes = "Indult XIV grants the black mozzetta to the canon-parish priests of Mondovì cathedral; LF2913 → LF2916 column change; complete 20 March 1835 closing LF2928–2931. Own provenance LF2983 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF2859–2859; the source closing at LF2928–2931 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima martii millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
