notes = "Apostolic letter CCCLVIII erects the confraternity of Our Lady of Mercy at Ouro Preto (diocese of Mariana) into a third order, imposes five articles of the Mercedarian constitutions on tertiaries (I–V, LF67209–67268, quoted within the letter) and gives the bishop of Mariana and the parish priest the superiors’ faculties; intitulation, ad perpetuam formula, narrative, erection, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF67159–67159; the source dating clause at LF67322–67325 reads: Datum Romae apud s. Petruin sub annulo piscatoris die tertia aprilis millesimo octingen- tesimo quadragesimo sexto, pontificatus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
