notes = "The act confirms the Consistorial advocates' Italian decree of 10 June 1831 (quoted with its article numerals I–III, LF7541–7579) on taking possession of office. Issuer evidence _ GREGORIUS PP. XVI. at LF7498; own dating clause LF7638–7641 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima nona augusti millesimo octingentesimo trigesimo pri- mo, pontificatus Nostri anno primo.. Own provenance note LF7624 excluded as edition furniture. Refined body and full surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
