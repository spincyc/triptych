context = "Apostolic letter CCCXII grants the abbot general, former abbots general and ruling abbots of the Armenian Antonian monks of Lebanon pontifical insignia (mitre, crozier, ring, pectoral cross); intitulation, ad perpetuam formula, narrative, grant and dating clause survive. Its provenance note1 is LF54988, printed at the foot of leaf 399 inside the span of CCCXI. Issuer evidence: GREGORIUS PP. XVI. at LF55054–55054; the source dating clause at LF55102–55105 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima prima martii millesimo Octingentesimo quadragesimo quinto, pontifi- catus Nostri anno decimo quinto. The witness abbreviates conventional formulae with “etc.” (“Haec concedimus etc.”, LF55100); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
