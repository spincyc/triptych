notes = "Letter CCV informs Juan Lindo, president of El Salvador, of the new cathedral of San Salvador and commends its first bishop, Jorge de Viteri; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37308–37308; the source dating clause at LF37354–37357 reads: Datum Romae apud s. Petrum die decima prima martii millesimo octingentesimo quadra- gesimo tertio, pontificatus Nostri anno decimo tertio. 5 Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF37357 “5”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
