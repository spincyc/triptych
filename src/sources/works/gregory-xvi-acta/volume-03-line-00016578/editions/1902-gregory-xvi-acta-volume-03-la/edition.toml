notes = "Motu proprio LXXVII delimits the Custos of the Holy Land’s jurisdiction against the Aleppo and Egypt vicariates, confirms twelve Jerusalem penitentiaries and extends offices to six years; its provenance note1 is LF16562 at the foot of the preceding left column. Issuer evidence: GREGORIUS PP. XVI. at LF16592–16592; the source dating clause at LF16824–16827 reads: Datum Romae apud s. Petrum snb annulo piscatoris die vigesima tertia martii millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
