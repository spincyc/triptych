description = "Indult CCCXXXI grants the first dignitary and canons of the collegiate church of S. Lorenzo at Santa Croce (diocese of San Miniato) the rochet and ermine-trimmed mozzetta and the violet collar; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF57300. Issuer evidence: GREGORIUS PP. XVI. at LF57191–57191; the source dating clause at LF57256–57260 reads: Datum Romae apud sanctam Mariam Ma- iorem sub annulo piscatoris die decima secunda augusti millesimo octingentesimo quadragesi- simo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
