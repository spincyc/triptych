description = "Letter CCCLXXXVI (protocol LF72297–72300) declares extinct the quasi-episcopal jurisdiction of the provostship of Atina, unites its territory to the abbey nullius of Monte Cassino and transfers Cedraro from Monte Cassino to the diocese of San Marco, naming the nuncio Gabriele Ferretti executor, and ends with its own 19 November 1834 closing at LF72525–72528, before numeral CCCLXXXVII at LF72531. Issuer evidence is GREGORIUS PP. XVI. at LF72297–72297; the source closing at LF72525–72528 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima nona noyembris mille- simo octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
