context = "Encyclical letter CCLXXIII to the bishops of the Upper Rhine ecclesiastical province (protocol LF47153, address Venerabiles fratres LF47156–47157) recalls Pius VIII's 1830 letter, condemns the Offenburg clergy's reform programme and its errors on discipline, celibacy, indulgences, penance and ritual, exhorts the bishops to resist, and ends with its own 4 October 1833 closing at LF47616–47619, before numeral CCLXXIV at LF47622. Its body continues past the false heading LF47450 (second half of the leaf-327 running title). Issuer evidence is GREGORIUS PP. XVI. at LF47153–47153; the source closing at LF47616–47619 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die quarta octobris anno millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
