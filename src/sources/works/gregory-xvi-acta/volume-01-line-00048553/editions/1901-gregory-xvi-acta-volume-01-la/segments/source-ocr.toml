context = "Epistle CCLXXXII to Bishop Charles-Louis of Rennes (address LF48562–48563, protocol LF48566, salutation LF48569–48570) reports Lamennais's letter of 5 November, the pope's grief and his reply through Cardinal Pacca, urges vigilance for the doctrine of the encyclical and ends with its own 29 November 1833 closing at LF48663, before numeral CCLXXXIII (OCR CCLXXXII.) at LF48666. Issuer evidence is GREGORIUS PP. XVI. at LF48566–48566; the source closing at LF48660–48663 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima nona novembris mille- simo octingentesimo trigesimo tertio, pontifica- tus Nostri anno tertio, LF48653 is a badly garbled body line (SEFUM' ESSEC >QUACN NOSILUME CST. …) whose WORDs occupy the printed line; it is retained literally, not restored. Its provenance note 1 (Ex Collectione Card. Falzacappa, LF48690–48691) is printed in CCLXXXIII's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[48562, 48614], [48616, 48663]] selected from address/protocol LF48562 through the source closing LF48663. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
