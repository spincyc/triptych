notes = "Letter CCCV, addressed to Giovanni Battista Sartori, titular bishop of Minden (LF52616–52618), protocol LF52624, thanks him for the illustrated book on the temple at Possagno designed by his half-brother Antonio Canova and ends with its own 8 February 1834 closing at LF52699, before numeral CCCVI at LF52702. Issuer evidence is GREGORIUS PP. XVI. at LF52624–52624; the source closing at LF52696–52699 reads: Datum Romae apud sanctum Petrum sub. annulo piscatoris die octava februarii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. LF52662 (1 Ex Bullario Romano.) is its own provenance note, excluded with the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
