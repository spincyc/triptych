description = "Epistle CCCLXIV to King Ludwig I of Bavaria (address LF68625–68626, protocol LF68629, salutation LF68632–68633) asks him to commend to his son King Otho of Greece the bishop of Syra as apostolic delegate and the Catholic cause, and ends with its own closing die decima augusti 1834 at LF68681–68684, before numeral CCCLXV (OCR CCGLXY.) at LF68687. Issuer evidence is GREGORIUS PP. XVI. at LF68629–68629; the source closing at LF68681–68684 reads: Datum Romae apud sanctam Mariam Maio- rem die decima augusti anno millesimo octin- gentesimo trigesimo quarto, pontificatus Nostri anno quarto. Its own provenance note 1 (Ex Regesto Brevium Prop. Fidei vol. 4, pag. 155., LF68729) is printed at the foot of leaf 468 inside CCCLXV's text and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
