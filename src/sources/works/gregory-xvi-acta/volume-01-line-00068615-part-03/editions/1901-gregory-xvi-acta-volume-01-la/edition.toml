title = "Romanus Pontifex ad illustrium praesertim ecclesiarum decus — Rocchetum et palliolum archipresbytero templi Palmae dioecesis Utinensis — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1901."
