notes = "Indult CCCLXVI (protocol LF68786–68789) grants Archpriest Giuseppe De Franceschi of the royal parish church of Palma (Palmanova, diocese of Udine) and his successors the rochet and black mantelletta of titular protonotaries, ending with its own 29 August 1834 closing at LF68862–68865, before numeral CCCLXVII (OCR CCCLXVI;) at LF68868. Issuer evidence is GREGORIUS PP. XVI. at LF68786–68786; the source closing at LF68862–68865 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima nona augusti millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
