notes = "Brief IX lets the Guadalajara Dominican nuns have Mass for the dead in their new cemetery chapel; single right-column body LF1498–1554 on artifact page 19 with complete 17 February 1835 closing; own provenance LF1557, signature line LF1560 and marks LF1563–1566 follow outside the act. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF1498–1498; the source closing at LF1551–1554 reads: Datum Romae apud sanctum Petrum sub annulo .piscatoris die decima septima februa- rii millesimo octingentesimo trigesimo quinto, — pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
