notes = "Brief XXI (OCR XXII.) to the Infanta Isabel Maria grants a confessor of her choice, a reserved Eucharist in her private chapel and the Cruzada privileges; LF3947 → LF3950 column change; complete 10 April 1835 closing. Own provenance LF4007 and mark LF4010 follow. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF3928–3928; the source closing at LF4001–4004 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima aprilis millesimo octingen- tesimo trigesimo quinto , pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
