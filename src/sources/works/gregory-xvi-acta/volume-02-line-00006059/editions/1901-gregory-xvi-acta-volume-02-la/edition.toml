notes = "Brief XXXI erects St Stephan, Augsburg, as a Benedictine abbey under Abbot Barnabas Huber with Ottobeuren’s privileges; LF6109 → LF6113 across page number LF6112; complete 19 May 1835 closing LF6156–6165. Own provenance LF6208 and signature line LF6209 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF6068–6068; the source closing at LF6156–6165 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima nona maii mille- simo octingentesimo trigesimo quinto, pontifi- _catus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
