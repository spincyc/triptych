notes = "Letter CVI to Metropolitan Michael Lewicki praises his pastoral letter on papal primacy from the Ruthenian liturgical books and instructs him on preserving the Ruthenian rite and resisting schismatic books; address, intitulation, body, blessing and dating clause (17 July 1841) survive. Its notes are retained in source order: the edition’s note1 on the synopsis (provenance fused with a long historical note quoting Collectio Lacensis, LF21057–21146 and LF21202–21307), and the letter’s own numbered reference notes (LF21424–21447, LF21562–21595, LF21724–21738, the last printed at the foot of leaf 161 after CVII begins). Issuer evidence: GREGORIUS PP. XVI. at LF21017–21017; the source dating clause at LF21653–21656 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septima iulii millesimo .octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. The fused edition note1 contains 1902 editorial history (citing Collectio Lacensis and later events) and quoted curial texts; it is printed apparatus retained literally as the act’s note, not papal wording. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
