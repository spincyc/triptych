description = "Apostolic letter CCXIV commissions the bishop of Guayaquil to separate the cathedral parish from the deanery and erect it into a curate canonry; intitulation, narrative, commission, decernentes and non obstantibus clauses and dating clause survive (no separate address printed; the letter speaks to “venerabilis frater”). Issuer evidence: GREGORIUS PP. XVI. at LF38573–38573; the source dating clause at LF38676–38679 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima prima aprilis millesimo octingentesimo quadragesimo tertio, pontifi- catus Nostri anno decimo tertio. The edition’s reference marker “?” after “constituimus” (LF38586) remains literal in the body although its editorial cross-reference note is excluded. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF38613 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
