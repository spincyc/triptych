description = "Letter CXCIV (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF33851–33854, no separate address) restores the college-seminary of Spello after the earthquake, approves the transfer of the goods of the pious women's retreat to the seminary college of San Felice, and ends with its own complete 11 January 1833 closing at LF34055, before numeral CXCV at LF34058. Issuer evidence is GREGORIUS PP. XVI. at LF33851–33851; the source closing at LF34052–34055 reads: Datum Romae apud s. Petrum sub annulo piscatoris die undecima ianuarii millesimo octin- gentesimo trigesimo tertio, pontificatus Nostri anno secundo. LF33899 (t Ex Bullario Romano.) is its own provenance note 1 inside the excluded block LF33899–33902. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
