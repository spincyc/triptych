notes = "Epistle CCXCV to Archbishop Hyacinthe of Paris (address LF50850–50851, protocol LF50854) praises his part in Lamennais's submission and his reconciliation with the bishop of Rennes and ends with its own 28 December 1833 closing at LF50939; its note 1 (Annali delle scienze cattoliche) is LF50942. Issuer evidence is GREGORIUS PP. XVI. at LF50854–50854; the source closing at LF50936–50939 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima octava decembris millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri_ anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
