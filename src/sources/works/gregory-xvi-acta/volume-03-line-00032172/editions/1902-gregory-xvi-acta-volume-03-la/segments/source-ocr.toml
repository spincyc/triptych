context = "Apostolic letter CLXX names Guillaume Dusarre coadjutor of the Central Oceania vicar apostolic; address, intitulation, body and dating clause survive. Its provenance note1 is LF32287. The edition prints a second same-day letter to Dusarre with the same purpose but differing wording and a full non obstantibus clause as CLXXII (LF32350–32422); each printed witness is reviewed separately and no identity join is asserted. Issuer evidence: GREGORIUS PP. XVI. at LF32186–32186; the source dating clause at LF32240–32244 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima tertia augusti millesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo se- cundo, The witness abbreviates conventional formulae with “etc.” (“Non obstantibus etc.”, LF32238); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete selected extent and at least twenty literal-LF lines of context on each side were read in this lane’s exhaustive in-order read of LF23800–32620 (claim LF23846–32521). Every nonblank LF line of the span maps 1:1 to a native XML LINE (zero token mismatches; line-geometry.json), and leaf/column/back-jump, indent, intra-line gap and short-line geometry screens were dispositioned; no general image collation is claimed. Selected bounds [[32180, 32214], [32220, 32244]]."
