description = "Apostolic letter CLXX names Guillaume Dusarre coadjutor of the Central Oceania vicar apostolic; address, intitulation, body and dating clause survive. Its provenance note1 is LF32287. The edition prints a second same-day letter to Dusarre with the same purpose but differing wording and a full non obstantibus clause as CLXXII (LF32350–32422); each printed witness is reviewed separately and no identity join is asserted. Issuer evidence: GREGORIUS PP. XVI. at LF32186–32186; the source dating clause at LF32240–32244 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima tertia augusti millesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo se- cundo, The witness abbreviates conventional formulae with “etc.” (“Non obstantibus etc.”, LF32238); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
