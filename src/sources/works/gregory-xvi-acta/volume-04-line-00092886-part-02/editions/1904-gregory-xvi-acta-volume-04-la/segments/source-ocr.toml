context = "Recorded papal audience rescript printed after the cardinal vicar’s regulation in printed CLXVI: Ex audientia SSmi die 29 ianuarii 1842. Sanctissimus Dominus Noster Papa Gregorius XVI superiores regulas, seu methodum servandam in processibus criminalibus exarandis in Nostro vicariatus tribunali, ac viginti-novem articulis … distinctam … benigne adprobavit. Ccard. Vicarius. (LF93145–93156). Admitted as a formally recorded papal response attributed to its recording official, not as a papal-authored act. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed. A formally recorded papal response, attributed to its recording official or office; papal context: Gregory XVI’s approval, in the audience of 29 January 1842, of the twenty-nine-article provisional regulation of criminal procedure for the tribunal of the vicariate (printed CLXVI, issued by the cardinal vicar on 20 January 1842), formally recorded by the cardinal vicar Costantino Patrizi (printed Ccard. Vicarius)."
notes = "Review extent: Whole printed CLXVI LF92886–93156 (regulation, arts. 1–29, dating clause and subscription, then this record) and more than twenty LF of context on each side (LF92849–92885 before, LF93159–93195 after) read literally; selected bounds [[93145, 93156]]. Native DjVu XML LINE geometry of leaf 606 (artifact page 606) aligned line for line with the OCR; no page image of this leaf was fetched and no image collation is claimed."
