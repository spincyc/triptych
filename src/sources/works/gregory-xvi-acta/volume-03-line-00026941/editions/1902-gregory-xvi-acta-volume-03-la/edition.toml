notes = "Letter CXXVI condoles with Ludwig I on the death of the queen dowager; address, intitulation, body and dating clause survive. Its provenance note2 is LF26954. Issuer evidence: GREGORIUS PP. XVI. at LF26964–26964; the source dating clause at LF26998–27001 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die tertia ianuarii millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
