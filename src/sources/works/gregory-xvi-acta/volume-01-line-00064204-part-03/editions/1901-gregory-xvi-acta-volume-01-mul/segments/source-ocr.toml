context = "Letter CCCXLIII (garbled numeral CCCXENT, protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF64423–64424) recites the building of the Albano cemetery by the Carmelites of S. Maria della Stella and Cardinal Falzacappa's visitation decree, inserts that decree in Italian (articles I–XXXI LF64521–64890, Dato in Albano al palazzo nostro vescovile questo di 29 maggio 1833 LF64892–64894, subscriptions of the cardinal bishop, seal and chapter, magistrates and confraternity LF64897–64918), approves and confirms it motu proprio and ends with its own 3 June 1834 closing at LF65020–65023, before numeral CCCXLIV at LF65026. Its extent continues beyond this lane's claim (LF64566) into frames held by lane volume-01-b07 (from line-00064569), which are this act's article numerals. Issuer evidence is GREGORIUS PP. XVI. at LF64423–64423; the source closing at LF65020–65023 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die tertia iunii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. The inserted Italian episcopal decree with its subscriptions is part of the papal letter, which confirms it as leges, pacta et conditiones superius exaratas; it is retained integrally and the reader is identified as Latin with an inserted Italian decree. The issuer of the instrument is the pope (protocol, first-person Nos, closing sub annulo piscatoris). The block LF64441–64447 holds CCCXLII's note 1, this letter's note 2 (Ex eodem Bullario,) and page number 422; LF64780–64781 are specks beside article numeral XXIII. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[64423, 64440], [64448, 64517], [64519, 64600], [64602, 64679], [64681, 64759], [64761, 64779], [64782, 64843], [64845, 64920], [64922, 64994], [64996, 65023]] selected from address/protocol LF64423 through the source closing LF65023. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
