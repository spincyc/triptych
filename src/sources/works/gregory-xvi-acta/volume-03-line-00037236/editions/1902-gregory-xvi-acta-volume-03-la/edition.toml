notes = "Letter CCIV commends nuncio Pecci to Count Camille de Briey, Belgian foreign minister; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF37360. Issuer evidence: GREGORIUS PP. XVI. at LF37251–37251; the source dating clause at LF37278–37281 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris. die decima prima martii millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
