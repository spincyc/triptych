description = "Apostolic letter CCCLXIX appoints Alexis Canoz, bishop of Tamassus, vicar apostolic of Madurai with all necessary faculties; address, intitulation, greeting “Dilecte fili”, body, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. ° at LF76593–76593; the source dating clause at LF76649–76652 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima secunda maii millesimo octingentesimo quadragesimo sexto, pontificatus Nostri anno decimo sexto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF76593 “°”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
