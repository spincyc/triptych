notes = "Motu proprio CV (numeral OCR’d “CY:”) erects Texas into an apostolic vicariate under a bishop; dispositive clause, derogations and dating clause survive. Its provenance note1 is LF20991. Issuer evidence: GREGORIUS PP. XVI. at LF20919–20919; the source dating clause at LF20985–20988 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima sexta iul. millesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
