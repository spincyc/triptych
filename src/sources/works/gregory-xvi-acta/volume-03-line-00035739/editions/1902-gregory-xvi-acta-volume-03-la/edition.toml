notes = "Indult CXCI grants Teresa Eustochio Verzeri, superior general of the Daughters of the Sacred Heart, private oratories with Mass and reservation in all houses and exemption from parochial jurisdiction; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF35749–35749; the source dating clause at LF35845–35848 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima tertia ianuarii millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
