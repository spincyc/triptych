notes = "Letter CXXXI (address LF29024–29026 to Jean-Jacques Lartigue, bishop of Montreal) announces Ignace Bourget as his coadjutor and commends the Sulpician seminary; LF29064 → LF29071 across running title LF29068; complete 13 March 1837 closing (Datum Romae apud sanctum Petrum die …). Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF29029–29029; the source closing at LF29089–29092 reads: Datum Romae.apud sanctum Petrum die decima tertia martii millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno se- ptimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
