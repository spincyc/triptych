description = "Consistorial allocution CXCII creates Francesco di Paola Villadicani and Ignazio Giovanni Cadolini cardinal priests and Paolo Mangelli and Giovanni Serafini cardinal deacons; it runs from “Venerabiles fratres” LF35874 through the creation formula to “Amen.” LF35951. Issuer evidence: ACTA GREGORII PP. XVI. at LF35862–35862; the source dating clause at LF35869–35871 reads: DIE VIGESIMA SEPTIMA I[ANUARII MILLESIMO OCTINGENTESIMO QUADRAGESIMO TERTIO. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
