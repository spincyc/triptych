notes = "Apostolic letter CCL erects an apostolic vicariate beyond the Rocky Mountains and in Columbia/Oregon, taken from the Quebec and St Louis jurisdictions after the fifth council of Baltimore; intitulation, narrative, erection, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF43388–43388; the source dating clause at LF43460–43463 reads: Datum Romae apud s. Petruin sub annulo piscatoris die prima decembris millesimo octin- gentesimo quadragesimo tertio, pontificatus No- stri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
