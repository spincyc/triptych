description = "Epistle CCCXIII (OCR CGGXIT., sharing an OCR block with page number 384) to the chapter of St. Gallen (address LF58889, protocol LF58892) praises its fidelity amid the disturbances of that church and ends with its own 8 March 1834 closing at LF58933, before numeral CCCXIV at LF58936. Issuer evidence is GREGORIUS PP. XVI. at LF58892–58892; the source closing at LF58930–58933 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die octava martii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Its provenance note 1 (Roskovány, pag. 128) is printed at LF59021–59022 in CCCXIV's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
