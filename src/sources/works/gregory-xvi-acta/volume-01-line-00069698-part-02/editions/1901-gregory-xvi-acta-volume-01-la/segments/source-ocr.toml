context = "Letter CCCLXXV (OCR CCELEXY.; .\") (protocol GREGORIUS’ PP. XVI. ad perpetuam rei memoriam LF69861–69864) separates Sardhana and the principality of the Begum Sombre from the vicariate of Agra as a distinct apostolic vicariate, and ends with its own 11 September 1834 closing at LF69945–69948, before numeral CCCLXXVI at LF69951. Issuer evidence is GREGORIUS’ PP. XVI. at LF69861–69861; the source closing at LF69945–69948 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die undecima se- ptembris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Its own provenance note 1 (LF69845) and the running title LF69848 are printed above its numeral at the foot/head of leaf 476 and lie outside the extent; a top-edge speck and the leaf-477 running title (LF69919–69922) are excluded. At LF69939 the OCR reads Non Gieianribae Nostrae for the printed Non obstantibus ...; retained literally as misread OCR. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
