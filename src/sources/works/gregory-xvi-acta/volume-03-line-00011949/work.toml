description = "Brief XLI to Jean-Baptiste Nozo, superior general of the Congregation of the Mission, commissions him to choose the Mongolian vicar apostolic; named address, intitulation, body and full dating clause survive. Its provenance note1 is LF12050. Issuer evidence: GREGORIUS PP. XVI. at LF11967–11967; the source dating clause at LF12007–12010 reads: Datum in Arce Gandulphi sub annulo pi- scatoris die vigesima octava augusti millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
