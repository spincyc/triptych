notes = "Letter CXXVIII promises the Armenian primate of Constantinople a coadjutor and assures him of paternal goodwill; address, intitulation, body and dating clause survive. Its provenance note1 is LF27228. Issuer evidence: GREGORIUS PP. XVI. at LF27157–27157; the source dating clause at LF27222–27225 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima nona ianuarii millesimo Octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
