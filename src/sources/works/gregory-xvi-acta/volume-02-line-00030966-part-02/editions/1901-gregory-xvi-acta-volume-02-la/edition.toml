notes = "The brief to Raymond Griffith, Irish professed Dominican (address LF30981–30982, protocol LF30985), whom the pope had named bishop of Palaeopolis by similar letters of the same day, appoints him vicar apostolic of the Cape of Good Hope. Note order: foot of artifact page 219 left column LF30981–30995, signature LF30998, right column LF31001–31016, sheet number 27 LF31019; continued at the foot of artifact page 220 left LF31135–31149 and right LF31152–31170 after CXLI’s close and CXLII’s first column (LF31022–31133, another act, not selected). Dated die vi iunii MDCCCXXXVII (6 June 1837), LF31169–31170. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF30985–30985; the source closing at LF31169–31170 reads: Datum Romae apud S. Petrum sub annulo piscatoris die vi iunii MDCCCXxxvn, pontificatus nostri anno v. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
