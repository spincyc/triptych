notes = "Apostolic letter CCVII names the Capuchin Fidelis Sutter of Ferrara apostolic vicar of the Tunis mission without episcopal character; intitulation, greeting “Dilecte fili noster”, body, mandate, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37506–37506; the source dating clause at LF37577–37580 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima prima martii millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF37521 “_ sciant”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
