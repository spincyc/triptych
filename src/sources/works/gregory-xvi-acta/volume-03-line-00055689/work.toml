description = "Apostolic letter CCCXVII erects the diocese of Perth in Western Australia from territory withdrawn from the archbishop of Sydney, suffragan to Sydney, and subjects the districts of Essington and Sonde to its bishop as two apostolic vicariates; intitulation, ad perpetuam formula, narrative, motu proprio erection, mandate and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF55704–55704; the source dating clause at LF55765–55768 reads: Datum Romae apud s. Petrum sub annulo piscatoris die sexta maii millesimo octingen- tesimo quadragesimo quinto, pontificatus No- stri anno decimo quinto. The witness abbreviates conventional formulae with “etc.” (“Haec volumus etc.”, LF55763); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-03"]
