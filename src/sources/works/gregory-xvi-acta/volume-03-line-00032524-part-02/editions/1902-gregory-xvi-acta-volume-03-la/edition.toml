notes = "Motu proprio CLXXV erects the Dutch Curaçao mission into an apostolic vicariate; intitulation, ad perpetuam formula, narrative, dispositive clause, decernentes and non obstantibus clauses and dating clause (“die vigesima sept.”) survive. Its provenance note1 is LF32724 on the foot of leaf 239. Issuer evidence: GREGORIUS PP. XVI. at LF32636–32636; the source dating clause at LF32706–32710 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima sept. millesimo octingentesimo quadragesimo _ se- cundo, pontificatus Nostri anno decimo se- cundo, ; Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF32647 “:”; LF32708 “_”; LF32710 “;”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
