description = "Brief LXI to the bishop of Fiesole (address LF10793–10794) permits a 15-scudi pension on S. Giacomo, Pietrafitta, to pay the debt of S. Maria alla Torre; LF10831 inter- → LF10841 pretum across bottom-margin marks LF10834/10837 and page number 74 LF10840; complete 22 September 1835 closing. Its own provenance LF10753 (artifact page 82 foot) is excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF10797–10797; the source closing at LF10870–10873 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima secunda septembris millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
