notes = "Apostolic letter CCXLV erects the see of Hartford for Connecticut and Rhode Island after the fifth council of Baltimore; intitulation, narrative, erection, decernentes clause and dating clause survive. Its provenance note1 is LF43013 at the foot of leaf 313. Issuer evidence: GREGORIUS PP. XVI. at LF42905–42905; the source dating clause at LF42949–42952 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava novembris mille- simo octingentesimo quadragesimo tertio, pon- tificatus Nostri anno decimo tertio, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
