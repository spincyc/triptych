description = "Apostolic letter CLXXIX erects an apostolic vicariate for Upper and Lower Guinea and Sierra Leone; intitulation, narrative, motu proprio erection, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF33416. Issuer evidence: GREGORIUS PP. XVI. at LF33337–33337; the source dating clause at LF33399–33402 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die tertia octobris millesimo octingentesimo quadragesimo secun- do, pontificatus Nostri anno decimo secundo. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF33390 “:”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
