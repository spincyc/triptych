notes = "Apostolic letter LXI (numeral OCR’d “4”) grants indulgences to the suffrage society at S. Maria in Monterone; full indulgence clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF14222–14222; the source dating clause at LF14318–14321 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima nona ianuar. mil- lesimo octingentesimo quadragesimo primo, pontificatus Nostri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
