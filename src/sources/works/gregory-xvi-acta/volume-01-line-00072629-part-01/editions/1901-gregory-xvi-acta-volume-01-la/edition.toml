notes = "Letter CCCLXXXVIII (protocol LF72640–72641) confirms to Cardinal Carlo Odescalchi, vicar of Rome, the faculties granted by Pius IV, Pius V and Sixtus V to visit, correct and reform all churches, monasteries and pious places of the city and district, and ends with its own 28 November 1834 closing at LF72902–72905, before numeral CCCLXXXIX (OCR CECLE RIX.) at LF72908. Issuer evidence is GREGORIUS PP. XVI. at LF72640–72640; the source closing at LF72902–72905 reads: Datum Romae apud sanctum Petrum sub an- nulo piscatoris die vigesima octava novembris millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
