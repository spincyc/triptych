notes = "Bull CXVII exempts Cambrai and Arras from Paris, raises Cambrai to a metropolitan archbishopric with Arras as suffragan and names the executor; Nulli ergo, sanction and incarnation-style dating clause (kalendis octobris = 1 October 1841) survive. Issuer evidence: GREGORIUS EPISCOPUS at LF25203–25203; the source dating clause at LF25464–25467 reads: Datum Romae de speciali mandato Nostro, anno incarnationis dominicae millesimo octin- gentesimo quadragesimo primo, kalendis octo- bris, pontificatus Nostri anno decimo primo. A stray hyphen OCR’d at the start of LF25438 (“-ubique”) remains literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
