notes = "Letter CLXXVIII, addressed Venerabili fratri episcopo Derthonensi (LF28648–28649), extends the Pontecurone canons' emphyteusis with the Perversi couple to all their descendants under Pius VIII's earlier conditions and ends with its own complete 18 September 1832 closing at LF28749. The footnote block LF28666–28672 interrupting its body at the page break contains note 1 (CLXXVII's provenance), note 2 (this letter's provenance, Ex eodem Bullario) and a head-margin speck; it is excluded as furniture. LF28752–28758 after the closing are a speck, the page-185 running title/page number and a speck, preceding CLXXIX. Issuer evidence is GREGORIUS PP. XVI. at LF28652–28652; the source closing at LF28746–28749 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima octava s2ptembris millesimo octingentesimo trigesimo secundo, pontificatus Nostri anno secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
