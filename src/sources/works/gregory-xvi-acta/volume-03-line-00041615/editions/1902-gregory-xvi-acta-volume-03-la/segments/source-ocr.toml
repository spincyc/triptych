context = "Letter CCXXXVIII reproves Archbishop Denis-Auguste Affre’s mandate restricting Jesuit confessors in Paris and asks him to revoke it; address (printed “Dilecto filio Nostro … archiepiscopo Parisiensi”), intitulation, greeting “Venerabilis frater”, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF41629–41629; the source dating clause at LF41748–41751 reads: Datum Romae apud sanctam Mariam Maio- rem die decima secunda octobris millesimo octingentesimo quadragesimo tertio, pontifica- tus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF41699 “_”; LF41720 “|”; LF41741 ““rint”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
