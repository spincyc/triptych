description = "Letter CCLXXXV (protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF48857–48860) empowers the bishop of Fiesole to impose a perpetual pension of forty scudi on S. Babila at Sanbavello for the parish and provostry of S. Maria at Figline, and ends with its own 3 December 1833 closing at LF49019, before numeral CCLXXXVI at LF49022. Issuer evidence is . GREGORIUS PP. XVI. at LF48857–48857; the source closing at LF49016–49019 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die tertia decembris millesimo octingentesimo trigesimo, tertio ; pontificatus Nostri anno tertio. LF48916 (1 Ex Bullario Romano.) is its own provenance note, excluded with page number 319. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
