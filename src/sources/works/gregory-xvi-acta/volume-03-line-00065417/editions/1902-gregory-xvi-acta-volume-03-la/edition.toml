title = "Exponendum nuper curavere Nobis — Monialibus congregationis Sancti Iosephi Ravennae (vulgo Tavelle) indulta confirmantur et extenduntur — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1902."
