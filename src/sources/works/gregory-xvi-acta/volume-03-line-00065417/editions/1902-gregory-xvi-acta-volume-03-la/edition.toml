notes = "Apostolic letter CCCXXXIX confirms and extends to their boarding girls the oratory, reservation, functions and indulgences of the nuns of the congregation of St Joseph (“Tavelle”) at Ravenna and grants new indulgences; intitulation, ad perpetuam formula, narrative, grants, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF65429–65429; the source dating clause at LF65550–65553 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima nona decembris millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
