description = "Letter CCCXLI answers King Ferdinand II of the Two Sicilies on the birth of his son Gaetano and blesses the royal family; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF65653, printed at the foot of leaf 472 inside the span of CCCXL. Issuer evidence: GREGORIUS PP. XVI. at LF65713–65713; the source dating clause at LF65750–65753 reads: _Datum Romae apud s. Petrum sub annulo piscatoris die decima septima ianuarii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
