notes = "Apostolic letter LXXXV names Bishop Joseph Rosati of St Louis apostolic delegate to the Republic of Haiti; address, intitulation, body, non obstantibus and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF17879–17879; the source dating clause at LF17946–17949 reads: Datum Romae apud s. Petrum sub annulo piscatoris die trigesima aprilis millesimo octin- gentesimo gquadragesimo primo, pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
