notes = "Letter CLVI congratulates Francis IV of Modena on his son’s marriage with Adelgunde of Bavaria; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF30493–30493; the source dating clause at LF30539–30542 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima tertia aprilis millesimo octingentesimo quadragesimo secundo, pontifi- catus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
