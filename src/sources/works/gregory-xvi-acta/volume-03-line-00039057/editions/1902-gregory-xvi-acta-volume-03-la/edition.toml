notes = "Letter CCXIX answers Archbishop Manuel José Mosquera of Bogotá on the restored missions and the Jesuits’ recall, and praises New Granada’s fidelity; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF39084–39084; the source dating clause at LF39163–39165 reads: Datum Romae apud s. Petrum die tertia iunii millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
