notes = "Apostolic letter CCXXXVI grants the canons of Segni cathedral the violet collar and cassock; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF41446–41446; the source dating clause at LF41528–41532 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima septima septembris millesimo octingentesimo quadrage- simo tertio, pontificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF41516 “_”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
