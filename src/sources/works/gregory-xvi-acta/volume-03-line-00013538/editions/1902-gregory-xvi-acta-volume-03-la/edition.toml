notes = "Consistorial allocution LVI publishes Giovanni Maria Mastai-Ferretti (Imola) and Gaspare Pianetti (Viterbo) as cardinals and reserves two others in pectore; it runs from “Venerabiles fratres” LF13555 to the closing Amen LF13661. Issuer evidence: 94 ACTA GREGORII PP. XVI. at LF13595–13595; the source dating clause at LF13552–13554 reads: DIZ DECIMA QUARTA DECEMBRIS ANNO MILLESIMO OCTINGENTESIMO QUADRAGESIMO The allocution has no dating clause; its date is taken from the excluded edition caption (OCR “DIZ DECIMA QUARTA DECEMBRIS”). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
