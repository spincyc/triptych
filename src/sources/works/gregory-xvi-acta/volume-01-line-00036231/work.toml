description = "Letter CCVIII, addressed to the priest Friedrich Rese (LF36239–36240), provides him to the new see of Detroit, grants consecration by any Catholic bishop with two assistants after the oath and profession of faith, and ends with its own 8 March 1833 closing at LF36387, before numeral CCIX at LF36390. Issuer evidence is GREGORIUS PP. XVI. at LF36243–36243; the source closing at LF36384–36387 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die octava martii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. : The title therefore avoids asserting the incipit. LF36371 (1 Ex Iure Pont. de P. F.) is its own provenance note inside the excluded block LF36371–36374. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-01"]
