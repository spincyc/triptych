notes = "Brief XLVIII perpetually confirms the Portiuncula indulgence for the Frari parish church; LF8958 → LF8973 across provenance LF8961/8967, mark LF8964 and running title LF8970; complete 14 July 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. ° at LF8904–8904; the source closing at LF8988–8991 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quarta iulii miliesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
