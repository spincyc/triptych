notes = "Indult CCCLIV (protocol LF66725–66728) confirms the insignia of the Andria cathedral chapter and mansionaries and grants the canons a violet saia, stockings, collar and hat cord within the diocese, ending with its own 8 July 1834 closing at LF66847–66850, before numeral CCCLV at LF66853. Issuer evidence is GREGORIUS PP. XVI. at LF66725–66725; the source closing at LF66847–66850 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die octava iulii- mil- lesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. At LF66752 the OCR reads consilio 2 meee evecti; native WORDs keep 2 meee in place inside the line, so it is retained literally as misread OCR; no word is displaced. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
