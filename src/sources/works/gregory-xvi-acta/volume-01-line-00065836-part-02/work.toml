description = "Letter CCCXLIX (protocol GREGORIUS PP. XVI ad perpetuam rei memoriam LF65903–65906) grants the station indulgences to those who visit the chapel of the Subiaco seminary and a privileged altar there, ending with its own 18 June 1834 closing at LF65976–65979, before numeral CCCL at LF65982. Issuer evidence is GREGORIUS PP. XVI at LF65903–65903; the source closing at LF65976–65979 reads: ' Datum Romae apud sanctum Petrum sub annul@ piscatoris die decima octava iunii mil- lesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
