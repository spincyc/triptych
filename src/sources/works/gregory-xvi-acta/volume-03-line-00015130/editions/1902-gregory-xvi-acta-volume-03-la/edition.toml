notes = "Apostolic letter LXVII extends the Monterone society’s indulgences to members living outside Rome; dispositive clause, non obstantibus and dating clause survive. Its provenance note1 is LF15223. Issuer evidence: GREGORIUS PP. XVI. at LF15138–15138; the source dating clause at LF15202–15205 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima secunda februar. millesimo Ooctingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
