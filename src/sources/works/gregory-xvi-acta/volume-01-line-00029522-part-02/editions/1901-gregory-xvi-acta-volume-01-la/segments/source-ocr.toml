context = "Epistle CLXXXII to King Charles Albert of Sardinia (address LF29874–29876, protocol LF29879) approves the king's plan with the bishops for an apostolic visitation of regulars and an episcopal commission, announces the accompanying diplomata, imparts the blessing and ends with its own 27 September 1832 closing at St Peter's (LF29936–29939), before numeral CLXXXIII at LF29942. Issuer evidence is GREGORIUS PP. XVI. at LF29879–29879; the source closing at LF29936–29939 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die vigesima septima septem- bris millesimo octingentesimo trigesimo secun- do, pontificatus Nostri anno secundo. The isolated head-margin glyphs LF29917–29918 (\\) between the columns are retained literally. Its own provenance note 1 (Ex Archivio Brevium ad Principes) is printed at LF29988 inside the following circular's frame and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[29874, 29939]] selected from address/protocol LF29874 through the source closing LF29939. Read in full in acquired LF order within the lane read LF28485-33320 (claim LF28513-32631 plus surrounding context, at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry was checked for the selected extent; no general image collation is claimed."
