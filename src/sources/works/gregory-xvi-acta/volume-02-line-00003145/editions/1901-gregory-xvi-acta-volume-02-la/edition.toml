notes = "Brief XVII confirms to the college of consistorial advocates the united office of fiscal of roads and waters; LF3261 → LF3273 across provenance LF3264, top-margin mark LF3267 and running title LF3270; complete 31 March 1835 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF3154–3154; the source closing at LF3276–3279 reads: Datum Romae apud s Petrum sub annulo piscatoris die trigesima prima martii millesimo o-tingentesimo trigesimo quinto, pontificatus Nostri anno quinto, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
