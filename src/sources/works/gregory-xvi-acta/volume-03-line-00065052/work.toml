description = "Consistorial allocution CCCXXXVI mourns the death (19 October 1845) of Clemens August von Droste zu Vischering, archbishop of Cologne, and praises his constancy for the Church’s doctrine and discipline; it runs from “Venerabiles fratres” LF65068 to “… in perpetuas aeternitates.” LF65160. Issuer evidence: ACTA GREGORII PP. XVI. at LF65087–65087; the source dating clause at LF65064–65066 reads: DIE VIGESIMA QUARTA NOVEMBRIS AN. MILLESIMI OCTINGENTESIMI QUADRAG. QUINTI. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
