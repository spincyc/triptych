notes = "Independent Torlonia letter confirms the stated titles and primogenitary succession conditions, with its own grant, derogation and7July1840 closing; it is distinct from the preceding English-vicariate act despite duplicate printed numeral XXVIII. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF10506–10506; the source closing at LF10650–10653 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die septima iul. mil- lesimo octingentesimo quadragesimo, pontifica- tus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
