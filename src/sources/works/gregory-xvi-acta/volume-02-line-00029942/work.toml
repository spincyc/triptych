description = "Letter CXXXVII (address LF29952–29954 to Clément Masson, missionary in Western Tonkin) approves his election as coadjutor of the vicar apostolic and urges him to accept; LF30009 → LF30015 across running title LF30012; complete 1 May 1837 closing; own notes LF30145–30146 retained discontiguously. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF29957–29957; the source closing at LF30071–30074 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die prima mati millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
