notes = "Indult CCLXVII grants the canons of the collegiate church of S. Maria Maggiore at Valmontone the violet mozzetta and the archpriest a red-fringed one; intitulation, narrative, grant, non obstantibus clause and dating clause survive. Its numeral LF45831 (OCR “CCUXVIE”) was missed by the detector. Issuer evidence: GREGORIUS PP. XVI. at LF45845–45845; the source dating clause at LF45903–45906 reads: Datum Romae apud s. Petrum sub annulo piscatoris die secunda martii millesimo octin- gentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
