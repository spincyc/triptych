notes = "Brief CXLIV erects the see of Natchez for the state of Mississippi, taken from New Orleans, at the request of the Baltimore provincial council of April 1837; LF31440 (which ends with the literal OCR Ae) → LF31449 across own provenance LF31443 and running title LF31446; complete 28 July 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF31414–31414; the source closing at LF31482–31485 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima octava iulii millesimo octingentesimo trigesimo septi- mo, pontificatus Nostri anno septimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
