notes = "Indult CCCXXVIII grants the dignitaries and canons of the collegiate chapter of Savignano (diocese of Rimini) the violet collar with hat-tassel or hat-band; intitulation, ad perpetuam formula, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF57022. Issuer evidence: GREGORIUS PP. XVI. at LF56934–56934; the source dating clause at LF56995–56998 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quarta iulii millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF56978 “valeant. .”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
