notes = "Brief CXXXIII confirms the Oratory of St Philip Neri at Catania (erected 1799), grants confession faculties and indulgences and communicates the Roman Oratory’s privileges; across page number 197 LF29212, own provenance LF29278, page number 198 LF29281, running titles LF29348 and LF29418; the clause Volumus autem ut Sk aah cit. literarum (LF29469) remains garbled literal OCR; complete 14 April 1837 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF29200–29200; the source closing at LF29478–29481 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quarta aprilis millesimo octingentesimo trigesimo septimo, pontificatus Nostri anno septimo. \" Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
