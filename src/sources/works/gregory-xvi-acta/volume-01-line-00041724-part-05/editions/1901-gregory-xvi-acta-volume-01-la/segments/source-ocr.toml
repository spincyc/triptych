context = "Letter CCXLV to Antonius, Armenian primate-archbishop at Constantinople (address LF42232–42233, protocol LF42236), answers his doubts through the enclosed epistle of the Propaganda congregation (Accipies interea complicatam cum Nostris hisce literis epistolam memoratae congregationis 2, LF42267–42269) and ends with its own 17 July 1833 closing at LF42302–42305. The edition prints that enclosed congregation letter as this act's note 2 (editorial lead Ex Reg. Vat. epist. ... desumimus eiusdem Congr. responsiones LF42310–42312, then Illme. ac Rme. Domine ... Datum Romae, ex aed. Sac. Congregationis de Propaganda Fide, die IV. iulii MDCCCXXXIII, LF42315–42553) in the foot band of leaves 293–294; it is retained as the act's own substantive note in source order, following the precedent for annexed Propaganda letters (volume-02 and volume-03 Armenian/Paris letters). Issuer evidence is GREGORIUS PP. XVI. at LF42236–42236; the source closing at LF42302–42305 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septima iulii millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. The Propaganda Fide letter in note 2 (Latin, issued by the Sacred Congregation, unsubscribed in this printing) is non-papal annex text retained only as this act's printed note and not attributed to the pope. Its own provenance note 1 (OCR ix JIure Ponts deep. i. = Ex Iure Pont. de P. F., LF42308) is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[42232, 42248], [42250, 42305], [42310, 42345], [42386, 42553]] selected from address/protocol LF42232 through the source closing LF42305. Read in full in acquired LF order within the lane read LF39127-48386 (claim LF39207-48307 plus at least twenty literal LF lines beyond every boundary). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry was checked for the selected extent (column, back-jump, left/right-gap, intra-line and vertical-gap screens); no general image collation is claimed."
