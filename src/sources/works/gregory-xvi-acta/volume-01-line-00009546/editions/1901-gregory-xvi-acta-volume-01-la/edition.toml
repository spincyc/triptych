notes = "The act grants the S. Rufina monastery and goods to the Sacred Heart sisters' new foundation funded by the marchioness Andosilla, under Cardinal Zurla. Issuer evidence GREGORIUS PP. XVI. at LF9564; own dating clause LF9727–9730 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima tertia septembris millesimo octingentesimo trigesimo primo, pontificatus Nostri anno primo.. Own provenance note LF9687 excluded as edition furniture. Refined body and full surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
