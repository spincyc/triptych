description = "The act extends the earlier insignia grant to the remaining Melfi cathedral participants; operative conditions, derogation and complete closing are retained. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF11126–11126; the source closing at LF11195–11198 reads: Datum in Arce Gandulphi sub annulo pisca- toris die quarta augusti millesimo octingente- simo quadragesimo, pontificatus Nostri anno decimo.. The source leaves its conventional reference to the earlier PiusVII letter abbreviated as “quas hic etc.” at LF11146; no earlier letter is supplied. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
