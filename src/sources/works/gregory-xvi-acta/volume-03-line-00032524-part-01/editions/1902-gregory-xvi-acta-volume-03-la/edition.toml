notes = "Apostolic letter CLXXIV names Archbishop Francesco Villardel of Philippi, apostolic delegate on Mount Lebanon, apostolic visitor of the three Basilian Melkite congregations (St John of Shuwayr, Aleppines, Most Holy Saviour); address LF32533–32536, intitulation LF32539, greeting, body, mandate, non obstantibus and Santa Maria Maggiore dating clause survive. Issuer evidence: GREGORIUS PP. XVI at LF32539–32539; the source dating clause at LF32620–32624 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die trigesima au- gusti millesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo se- cundo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
