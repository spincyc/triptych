description = "Consistorial allocution CII publishes Silvestro Belli as cardinal and reserves two others in pectore; it runs from “Venerabiles fratres” LF20200 to the closing Amen LF20295. Its provenance note1 is LF20316. Issuer evidence: ACTA GREGORII PP. XVI. at LF20121–20121; the source dating clause at LF20188–20190 reads: HABITA IN CONSISTORIO SECRETO DIE DECIMA SECUNDA IULII MILLESIMO OCTINGENTESIMO QUADRAGESIMO PRIMO, The allocution has no dating clause; its date is taken from the excluded edition caption. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
