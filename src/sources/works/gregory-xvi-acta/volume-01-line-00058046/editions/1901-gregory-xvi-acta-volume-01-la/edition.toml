notes = "Letter CCCVIII (OCR CCCVII., protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF58055–58058) approves and confirms the confraternity of the Holy Rosary in the parish church of Azpeitia (diocese of Pamplona) with its privileges and ends with its own 28 February 1834 closing at LF58190, before numeral CCCIX at LF58193. Issuer evidence is GREGORIUS PP. XVI. at LF58055–58055; the source closing at LF58187–58190 reads: Datum Romae apud s. Petrum. sub annulo piscatoris die vigesima octava februarii mille- simo octingentesimo trigesimo quarto, pontifi- catus Nostri anno quarto. LF58093 (1 Ex Bullario Romano.) is its own provenance note, excluded with the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
