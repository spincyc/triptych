notes = "Indult CCXCVI grants the canons of the collegiate and parish church of Monteprandone (diocese of Ripatransone) the surplice over the rochet and the woollen and silk violet mozzetta by season; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF52496–52496; the source dating clause at LF52576–52579 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die vigesima augusti millesimo octingentesimo quadragesimo quarto, pontifica- tus Nostri anno decimo quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
