description = "Consistorial allocution CCXXI announces the provision of Porto, Goa and Macao and creates Patriarch Francisco Saraiva de São Luís and Bishop Antonio Maria Cadolini of Ancona cardinals; it runs from “Venerabiles fratres” LF39618 to “Amen.” LF39782. Issuer evidence: ACTA GREGORII PP. XVI. at LF39785–39788; the source dating clause at LF39613–39615 reads: DIE DECIMA QUINTA IUNII ANNO MILLESIMO OCTINGENTESIMO QUADRAGESIMO TERTIO. The allocution has no dating clause; its date is taken from the excluded edition caption. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF39692 “;”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
