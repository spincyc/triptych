title = "Apostolici ministerii Nostri esse ducimus — Pro sacrario cathedralis Sabinensis pensio super praepositura S. Stephani Montis Sancti constituitur — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1902."
