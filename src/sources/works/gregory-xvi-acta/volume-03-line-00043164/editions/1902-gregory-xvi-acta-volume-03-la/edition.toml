notes = "Bull CCXLIX, at the petition of Cardinal Lambruschini as bishop of Sabina, reserves a perpetual pension of fifty scudi on the provostship of S. Stefano at Monte Santo (diocese of Fermo) for the Sabina cathedral sacristy, with execution mandate, non obstantibus, Nulli ergo and incarnation-year dating clauses (quarto nonas decembris = 2 December). Issuer evidence: GREGORIUS EPISCOPUS at LF43175–43175; the source dating clause at LF43362–43365 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo tertio, quarto nonas de- cembris, pontificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF43203 “|”; LF43347 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
