description = "Indult CCCLV (protocol LF66863–66866) grants the dignitary and participant canons of the Annunziata collegiate church at Andria the hat cord, stockings and violet collar within the diocese, ending with its own 8 July 1834 closing at LF66953–66956, before numeral CCCLVI at LF66968. Issuer evidence is GREGORIUS PP. XVI. at LF66863–66863; the source closing at LF66953–66956 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die octava iulii mil- lesimo octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
