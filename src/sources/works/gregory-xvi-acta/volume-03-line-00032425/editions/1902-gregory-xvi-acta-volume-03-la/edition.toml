notes = "Apostolic letter CLXXIII names Bishop Raffaele Barisich apostolic visitor of the archdiocese of Antivari with governing powers; address, intitulation, body and dating clause survive. Its dating clause ends exactly at the claim end LF32521; CLXXIV begins at LF32524. Issuer evidence: GREGORIUS PP, XVI. at LF32449–32449; the source dating clause at LF32517–32521 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quinta augusti millesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo se- cundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
