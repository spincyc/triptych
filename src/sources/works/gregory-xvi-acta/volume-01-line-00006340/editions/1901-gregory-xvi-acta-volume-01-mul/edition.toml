notes = "The act confirms Ferdinand VII's statutes for the six Spanish major colleges and grants their ecclesiastical rectors an indult of absence; it quotes the Spanish title of the royal cedula (LF6397–6421). Issuer evidence GREGORIUS PP. XVI. at LF6350; own dating clause LF6501–6504 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima secunda iulii millesimo octingentesimo trigesimo primo, pontificatus Nostri anno primo.. Own provenance note LF6415 excluded as edition furniture. Refined body and full surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
