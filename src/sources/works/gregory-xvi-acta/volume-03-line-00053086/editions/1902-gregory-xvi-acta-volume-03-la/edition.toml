notes = "Apostolic letter printed “CCCI.” grants plenary and partial indulgences, applicable to the dead, to the members and benefactors of the Society of St Vincent de Paul founded in Paris and to its conferences everywhere; intitulation (printed “GREGORIUS PP. XVI. —”), grant, non obstantibus and transumpt clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. — at LF53095–53095; the source dating clause at LF53210–53212 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima ianuarii millesimo octin- gentesimo quadragesimo quinto. The dating clause prints no pontifical year. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
