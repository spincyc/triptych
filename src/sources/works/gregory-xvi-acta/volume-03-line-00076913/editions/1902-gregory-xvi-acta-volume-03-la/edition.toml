notes = "Letter CCCLXXII thanks Jules Gossin (printed “Iulio Goussin”), president general of the Society of St Vincent de Paul in Paris, for the gift of the Society’s Manuel and congratulates the Society on its growth in Europe and America; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF77019. Issuer evidence: GREGORIUS PP. XVI. at LF76936–76936; the source dating clause at LF76983–76986 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima septima maii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
