description = "Apostolic letter CLXXVI fixes the see of the western Upper Canada diocese at Toronto and describes its boundaries; intitulation, ad perpetuam formula, narrative, decree, decernentes and non obstantibus clauses and dating clause survive (this printing has no address). Issuer evidence: GREGORIUS PP. XVI. at LF32731–32731; the source dating clause at LF32820–32823 reads: Datum Romae apud s. Mariam Maiorem sub annulo Piscatoris die vigesima septembris mil- lesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF32746 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
