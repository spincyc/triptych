notes = "Brief CLXXVIII ends the Shansi vicar’s administration of Hukwang and restores Hukwang as a distinct vicariate apostolic; LF39463 → LF39472 across own provenance LF39466 and running title LF39469; complete 14 August 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF39441–39441; the source closing at LF39507–39510 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quarta augusti millesimo octingentesimo trigesimo octa- vo, pontificatus Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
