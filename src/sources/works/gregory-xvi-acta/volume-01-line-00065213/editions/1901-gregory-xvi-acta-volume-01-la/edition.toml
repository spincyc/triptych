title = "In sublimi Apostolicae Sedis fastigio — Erectio ecclesiae collegiatae in oppido Sarnani dioecesis Camerinensis — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1901."
language = "la"
date = "1901"
publication = "Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1901."
notes = "Letter CCCXLV (protocol LF65221–65222) confirms and erects the parish church of the Assumption at Sarnano (archdiocese of Camerino) as a collegiate church and names its six priests and perpetual vicar canons, ending with its own 6 June 1834 closing at LF65364–65372, before numeral CCCXLVI at LF65377. Issuer evidence is GREGORIUS PP. XVI. at LF65221–65221; the source closing at LF65370–65372 reads: annulo piscatoris die sexta iunii millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. The page number 428 (OCR 4.28, LF65367) of leaf 446 intervenes inside the closing between Datum Romae apud sanctum Petrum sub (LF65364) and annulo piscatoris (LF65370) and is excluded; the date is therefore evidenced by LF65370–65372. A right-margin speck and the leaf-445 running title (LF65227–65230) are excluded. Its own provenance note 1 (LF65150) is printed at the foot of leaf 444 inside CCCXLIV's text and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
