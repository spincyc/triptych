notes = "Letter CCCLXXXIII (OCR CCCLAXXIT.), addressed to the bishop of Meaux (LF71817–71818; protocol LF71821; salutation LF71824–71825), commits to him to allow Mass, satisfying the precept, in the chapel of Baron Gigault de Crisnoy's castle, and ends with its own 27 September 1834 closing at LF71885–71888, before numeral CCCLXXXIV at LF71891. Issuer evidence is GREGORIUS PP. XVI. at LF71821–71821; the source closing at LF71885–71888 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima se- ptima septembris millesimo octingentesimo tri- _gesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
