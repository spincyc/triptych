description = "Bull LXII sends the pallium to the newly elected Armenian Catholic patriarch Jacob Holas, with the pallium-assignment and oath formulae incorporated in the text and the incarnation-style dating clause. Quinto kalendas februarii = 28 January. Issuer evidence: GREGORIUS EPISCOPUS at LF14338–14338; the source dating clause at LF14454–14458 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo primo, quinto kalendas februarii , pontificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
