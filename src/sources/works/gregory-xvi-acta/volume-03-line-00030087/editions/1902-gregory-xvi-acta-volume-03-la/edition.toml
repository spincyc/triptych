notes = "Letter CLI condoles with Emperor Ferdinand on the death of Archduchess Hermine; address, intitulation, body and dating clause survive. The raw candidate ended at LF30116 only because the running-title fragment LF30119 was proposed as a heading. Its provenance note1 is LF30190. Issuer evidence: GREGORIUS PP. XVI. at LF30104–30104; the source dating clause at LF30152–30155 reads: Datum Romae apud s. Petrum sub annulo piscatoris die septima aprilis millesimo octin- gentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
