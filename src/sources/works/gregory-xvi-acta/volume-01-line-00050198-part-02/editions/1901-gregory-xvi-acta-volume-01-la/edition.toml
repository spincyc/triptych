notes = "Letter CCXCI, addressed to Cardinal Mario Mattei (LF50361–50363), removes the Basilian monastery of Grottaferrata from its superiors, subjects it to him as apostolic visitor with full faculties and ends with its own 17 December 1833 closing at LF50529, before numeral CCXCII at LF50532. Issuer evidence is GREGORIUS PP. XVI. at LF50366–50366; the source closing at LF50526–50529 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima septima decembris mille- simo octingentesimo trigesimo tertio, pontifica- tus Nostri anno tertio. The genre label at LF50349 is garbled (Pre Rat APOS' RIG). LF50488 (1 Ex Bullario Romano.) is its own provenance note inside the excluded block LF50488–50497 with sheet signature 42 and page number 330. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
