notes = "Letter CCCLVII (protocol GREGORIUS -PP. XVI. ad futuram rei memoriam LF67089–67092) creates the brothers Domenico and Luigi Antonvisi Rosa of Civita Castellana, their nephews and primogenitary heirs counts, and ends with its own 8 July 1834 closing at LF67152–67155, before numeral CCCLVIII at LF67158. The catalog's papal-issuer-not-established flag is resolved by the printed protocol LF67089. Issuer evidence is GREGORIUS -PP. XVI. at LF67089–67089; the source closing at LF67152–67155 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die octava iulii mil- lesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
