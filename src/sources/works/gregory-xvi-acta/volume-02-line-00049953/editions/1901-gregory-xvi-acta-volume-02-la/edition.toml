notes = "Indult CCXXV extends to solemn functions the use of the bugia granted by Pius VII to the canons of Siena cathedral, except before the archbishop, a cardinal or the nuncio; LF50021 → LF50030 across own provenance LF50024 and running title LF50027; complete 5 June 1839 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF49964–49964; the source closing at LF50046–50049 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die quinta iunii millesimo octingentesimo trigesimo nono, pontificatus No- stri anno nono. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
