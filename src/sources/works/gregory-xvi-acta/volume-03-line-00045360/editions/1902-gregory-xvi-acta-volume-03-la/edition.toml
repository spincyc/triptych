notes = "Letter CCLXII answers Emperor Pedro II of Brazil’s notice of his marriage to Teresa Cristina of the Two Sicilies with good wishes and blessing; address LF45370–45372, intitulation, greeting, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF45375–45375; the source dating clause at LF45424–45427 reads: Datum Romae apud s. Petrum die prima februarii millesimo octingentesimo quadrage- simo quarto, pontificatus Nostri anno deci- mo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
