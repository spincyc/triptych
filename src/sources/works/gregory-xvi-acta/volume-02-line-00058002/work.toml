description = "Allocution CCLXVII asks for the votes on the canonization of b. John Joseph of the Cross and defers the decision to prayer; LF58030 → LF58042 across CCLXVI’s provenance LF58033, own provenance LF58036 and page number 396 LF58039; ends LF58086 before CCLXVIII LF58089. Refined body and full surrounding frame read literally. Issuer evidence is ACTA GREGORII PP. VES at LF58111–58114; the source closing at LF58079–58086 reads: Quod de honoribus Sanctorum beato [oanni Iosepho a Cruce decernendis, una mente ac voce consentiatis, sane quam gratum Nobis accidit. Cum tamen summa sit huius rei gravitas, quam maxima possumus humilium precum conten- tione implorandum adhuc esse Spiritus Sancti lumen iudicamus, ut eo duce et auctore sancta haec actio bene ac feliciter expediatur. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
