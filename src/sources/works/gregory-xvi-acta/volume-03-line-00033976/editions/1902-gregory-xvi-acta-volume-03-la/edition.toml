notes = "Indult CLXXXII grants the archdeacon and canons of Chieti the silk and linen mitre; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF34109. Issuer evidence: GREGORIUS PP. XVI. at LF33985–33985; the source dating clause at LF34080–34083 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima quinta novembris mil- lesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF34059 “‘praemissis”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
