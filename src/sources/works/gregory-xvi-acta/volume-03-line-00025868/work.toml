description = "Letter CXXI thanks Frederick William IV for naming Herr von Buch his resident minister; royal address, intitulation, salutem, body and dating clause survive. Its provenance note1 is LF25995. Issuer evidence: GREGORIUS PP. XVI. at LF25883–25883; the source dating clause at LF25921–25924 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima secunda nov. millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
