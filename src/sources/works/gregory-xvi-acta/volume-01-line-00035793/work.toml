description = "Letter CCIV (protocol GREGORIUS PP.: XVI. ad perpetuam rei memoriam LF35802–35805) communicates to the altar of St Anthony of Padua in the Genoese church of the Santissima Annunziata the indulgences of the like altar at Ara Coeli, and ends with its own 28 February 1833 closing at LF35862, before numeral CCV at LF35865. Issuer evidence is GREGORIUS PP.: XVI. at LF35802–35802; the source closing at LF35859–35862 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava febr. millesimo octingentesimo trigesimo tertio, pontificatus , Nostri anno tertio. Its provenance note 1 (t Ex Bullario Romano.) is printed at LF35925 in CCV's foot block and is excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
