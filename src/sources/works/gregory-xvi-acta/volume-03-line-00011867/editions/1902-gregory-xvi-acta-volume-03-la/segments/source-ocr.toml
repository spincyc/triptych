context = "Motu proprio XL separates Mongolia from the Leao-tung vicariate and entrusts it to the Congregation of the Mission; intitulation, ad perpetuam formula, narrative, dispositive clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF11879–11879; the source dating clause at LF11943–11946 reads: Datum in Arce Gandulphi sub annulo pisca- toris die vigesima octaya augusti millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo. The witness abbreviates conventional formulae with “etc.” (“Haec statuimus etc.”, LF11941); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
