notes = "Bull CCLXXI (protocol GREGORIUS EPISCOPUS servus servorum Dei ad perpetuam rei memoriam LF46771–46773) reserves on the episcopal mensa of Ales (Oleastrensis), with King Charles Albert's consent, a perpetual pension of 68 gold ducats for grammar schools of the diocesan seminary, with censures for non-payment and executors, and ends with its incarnation-year dating clause pridie kalendas octobris 1833 (= 30 September) at LF47049–47052, before numeral CCLXXII at LF47055. Issuer evidence is GREGORIUS EPISCOPUS at LF46771–46771; the source closing at LF47049–47052 reads: Datum Romae apud sanctam Mariam Maio- rem anno incarnationis dominicae millesimo octingentesimo trigesimo tertio pridie kalendas octobris, pontificatus Nostri anno tertio. At LF47024 the native WORDs si dictus crise | in leave a 74 px gap after crise (x576–731): one printed word is misread, but no word or line is displaced; retained literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
