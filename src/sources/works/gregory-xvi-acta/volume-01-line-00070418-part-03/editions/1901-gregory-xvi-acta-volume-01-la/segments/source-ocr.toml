context = "Bull CCCLXXX (protocol GREGORIUS EPISCOPUS «> servus servorum Dei ad perpetuam rei memoriam LF70725–70731) separates the province of Cuyo from the diocese of Córdoba, erects the see of San Juan de Cuyo with its cathedral chapter, mensa and seminary as a suffragan of La Plata (Charcas), regulates the presentation of bishops and canons, names Bishop Justo de Santa María de Oro executor, and ends with Nulli ergo and its own closing decimo tertio kalendas octobris 1834 (19 September 1834) at LF71338–71342, before numeral CCCLXXXI at LF71345. Issuer evidence is GREGORIUS EPISCOPUS «> at LF70725–70725; the source closing at LF71338–71342 reads: Datum Romae apud sanctam Mariam Maio- rem anno incarnationis dominicae millesimo octingentesimo trigesimo «quarto, decimo tertio kalendas octobris, pontificatus Nostri anno quarto, At LF71054 the OCR reads nun bitur for the printed nuncupabitur (a 103 px gap between the WORDs of one printed word): glyphs are unrecognized but no word or line is missing or displaced; retained literally. LF70857 begins with a literal speck (. juxta), retained. Signatures, running titles, page numbers and a head speck (LF70860–70866, LF70937–70940, LF71010, LF71079, LF71155–71158, LF71235, LF71306) are excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
