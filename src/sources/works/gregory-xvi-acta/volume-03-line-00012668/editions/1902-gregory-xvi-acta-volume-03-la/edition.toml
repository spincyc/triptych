notes = "Letter XLVI of condolence to Francis IV of Modena on the death of Maria Beatrice of Savoy: address, intitulation, greeting, consolation, blessing and dating clause survive. Provenance note1 LF12764 belongs to XLVI. Issuer evidence: GREGORIUS PP. XVI. at LF12684–12684; the source dating clause at LF12731–12734 reads: Datum Romae apud s. Mariam Maiorem sub annulo piscatoris die prima octobris millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
