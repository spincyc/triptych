notes = "Constitution CLXI (printed CONSTITUTIO, in brief form ad perpetuam rei memoriam) reduces the college of participating apostolic protonotaries to its original seven, derogating from Sixtus V; LF36616 → LF36631 across own provenance LF36619/36622 (Falzacappa collection, split across the columns), running title LF36625 and a mark LF36628; LF36690 → LF36694 across the garbled page number ly LF36693; complete closing dated sexto idus februarii 1838 = 8 February 1838. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF36588–36588; the source closing at LF36718–36720 reads: Datum Romae apud sanctum Petrum sexto idus februarii millesimo o€tingentesimo trige- simo octavo, pontificatus Nostri anno octavo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
