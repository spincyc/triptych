notes = "Indult CCCLXVI grants the mansionaries of the metropolitan church of Salerno the violet woollen cappa magna with grey fur and a shorter train than the canons’; intitulation, ad perpetuam formula, narrative, grant, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF76269–76269; the source dating clause at LF76331–76334 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima nona maii mil- lesimo octingentesimo quadragesimo sexto, pon- tificatus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
