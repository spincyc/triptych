notes = "This raw frame opens inside the held letters CCXLVIII (LF54029–54809, reviewed under gregory-xvi-acta.volume-02.line-00052987); its own act is letters CCXLIX (numeral OCR OCA), withdrawing the vicariate of the northern German missions and Denmark from the bishop of Paderborn and fixing the new vicar apostolic at Hamburg; the text runs continuously down the left column of artifact page 384; complete 17 September 1839 closing. The page-384 running title LF54879 and own provenance LF54972 are excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF54825–54825; the source closing at LF54873–54876 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septima septembris millesimo octingentesimo trigesimo nono, pontificatus Nostri anno nono. _ Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
