description = "Allocution CLXVII deplores the condition of the Catholic Church in the Russian empire and announces the published exposition of the Holy See’s efforts; it runs from “Venerabiles fratres” LF31882 to “largiatur.” LF31947. Issuer evidence: ACTA GREGORII PP. XVI. at LF31937–31937; the source dating clause at LF31876–31881 reads: HABITA IN CONSISTORIO SECRETO DIE VIGESIMA SECUNDA IULIT ANNO MILLESIMO OCTINGENTESIMO QUADRAGESIMO SECUNDO. The allocution has no dating clause; its date is taken from the excluded edition caption (“DIE VIGESIMA SECUNDA IULIT”, OCR for IULII). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
