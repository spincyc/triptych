description = "Chirograph CCII (caption EPISTOLA) to Cardinal Tommaso Bernetti, Secretary of State (address LF35443–35444, protocol GREGORIO XVI. LF35447), divides the business of the Secretariat of State, defining the cardinal secretary's foreign attributions and creating a cardinal secretary for internal affairs, and ends with the clause of validity by the pope's simple subscription and Dato dal Nostro palazzo apostolico Vaticano questo dì 20 febbraio 1833, del Nostro pontificato anno III (LF35667–35669), before numeral CCIII at LF35672. Issuer evidence is GREGORIO XVI. at LF35447–35447; the source closing at LF35667–35669 reads: Dato dal Nostro palazzo apostolico Vaticano questo di 20 febbraio 1833, del Nostro ponti- ficato anno III. The block LF35459–35466 holds CCI's provenance note 1, this chirograph's own note 2 (Ex Collectione Card. Falzacappa, Bibliotheca Vallicelliana) and the page number with ACTA. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
