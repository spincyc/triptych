notes = "Brief LXIV to the bishop of Fiesole (address LF11157–11158) permits a 50-scudi pension on S. Maria a Agnano for the curate of Prato Vecchio; stray mark LF11168 between salutation and body excluded; LF11207 → LF11210 column change; complete 22 September 1835 closing. Own provenance LF11278 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF11161–11161; the source closing at LF11226–11229 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima secunda septembris millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
