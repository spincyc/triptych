description = "Apostolic letter CCXXX separates western Pennsylvania from Philadelphia and erects the diocese of Pittsburgh, suffragan of Baltimore; intitulation, narrative, motu proprio erection, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF40827. Issuer evidence: GREGORIUS PP. XVI. at LF40705–40705; the source dating clause at LF40784–40787 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima prima augusti millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
