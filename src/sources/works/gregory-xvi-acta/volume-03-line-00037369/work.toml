description = "Letter CCVI to Jean-Pierre Boyer, president of Haiti, laments the Cap-Haïtien earthquake and announces Bishop Rosati’s return with modified articles of the proposed convention; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37392–37392; the source dating clause at LF37485–37488 reads: Datum Romae apud s. Petrum die decima quinta martii anno millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF37452 “_”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
