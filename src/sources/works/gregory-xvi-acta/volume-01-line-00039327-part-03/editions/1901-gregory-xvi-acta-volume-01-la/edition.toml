notes = "Epistle CCXXXI to King Ferdinand II of the Two Sicilies (address LF39559–39561, protocol LF39564, salutation LF39567–39568) announces the recall of nuncio Luigi archbishop of Nicaea for the Madrid nunciature and ends with its own 10 June 1833 closing at LF39591–39594 in the left column of leaf 275. Its numeral CCXXXI. and genre label EPISTOLA are printed in the upper left of leaf 275 but the OCR merges them (with the mark Tos) into the wide lines LF39548–39550 together with the first three right-column body lines of the following letter CCXXXII; those mixed lines are therefore not selected and are not recorded as pure furniture. LF39597 is a speck before numeral CCXXXII at LF39600. Issuer evidence is GREGORIUS PP. XVI. _ | at LF39564–39564; the source closing at LF39591–39594 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima iunii millesimo octingen- tesimo trigesimo tertio, pontificatus Nostri anno tertio. The OCR salutation reads Carissime et venerabilis frater, (LF39567), retained literally. Its own provenance note 1 (Ex Archivio Brevium ad Principes, LF39688) is printed at the foot of leaf 275 inside CCXXXII's frame and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
