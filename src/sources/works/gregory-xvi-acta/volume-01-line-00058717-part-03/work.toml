description = "Indult CCCXIV (garbled label EN DAE SUM, synopsis Quo fit concessio; protocol GREGORIUS PP. XVI. ad perpetuam rei memoriam LF58948–58951) allows the provost of the collegiate church of Provenzano at Siena violet stockings, collar and hat-tassel and a gold medal of the Madonna of Provenzano, and ends with its own 11 March 1834 closing at LF59058. Issuer evidence is GREGORIUS PP. XVI. at LF58948–58948; the source closing at LF59055–59058 reads: Datum Romae apud sanctum Petrum sub an- nulo piscatoris die decima prima martii, mil- lesimo octingentesimo trigesimo quarto, ponti- ficatus Nostri anno quarto. ‘ The block LF59021–59028 holds CCCXIII's note 1, this indult's note 2 (Ex Bullario Romano.) and the running-title fragment ANNO. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
