description = "Consistorial allocution CCLIX creates Pasquale Gizzi (reserved in pectore in 1841), Antonio Maria Cagiano de Azevedo and Nicola Paracciani Clarelli cardinal priests and reserves another in pectore; it runs from “Venerabiles fratres” LF44969 through the creation formula to “Amen.” LF45107. Issuer evidence: ACTA GREGORIL PP. XVI. at LF45053–45053; the source dating clause at LF44957–44958 reads: DIE VIGESIMA SECUNDA IANUARII MILLESIMO OCTINGENTESIMO QUADRAG. QUARTO. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
