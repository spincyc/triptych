description = "Apostolic letter CCXCVIII divides Nova Scotia into two dioceses, Halifax (with the Bermudas) and the eastern counties with Cape Breton, with Bishop William Fraser’s consent; intitulation, narrative, division, the abbreviated decernentes clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF52645–52645; the source dating clause at LF52690–52693 reads: Datum Romae apud s. Mariam Maioreny sub annulo piscatoris die vigesima secunda septem- bris millesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. The witness abbreviates conventional formulae with “etc.” (“decernen- | tes etc,”, LF52684–52687; LF52687 begins with a mark “|”); these remain literal and are not expanded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
