notes = "Brief XLVII to the chapter of St Peter’s (address LF8848–8850) orders the Veronica and the Lance to be shown to Infante Sebastián and his wife; complete 14 July 1835 closing before running title LF8891. Own provenance LF8961 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF8853–8853; the source closing at LF8885–8888 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quarta iulii millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
