description = "Apostolic letter CCCXVI to the bishop of Liège approves the pious union of St Joseph “pro proelo catholico” against bad books and grants its members indulgences; intitulation, greeting “Venerabilis frater”, narrative, approval, indulgence grants, decernentes clause and dating clause survive (no separate address is printed; the addressee is named only in the excluded synopsis). Issuer evidence: GREGORIUS PP. XVI. at LF55545–55545; the source dating clause at LF55680–55683 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima quinta aprilis millesimo octingentesimo quadragesimo quinto, pontifi- catus Nostri anno decimo quinto., Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF55561 “—”; LF55605 “©”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
