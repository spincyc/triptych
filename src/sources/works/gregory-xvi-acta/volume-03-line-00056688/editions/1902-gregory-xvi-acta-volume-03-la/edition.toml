title = "Licet indubia propensae voluntatis Nostrae testimonia — Carolo Langlois et Antonio Dubois moderatoribus seminarii Parisiensis missionum ad exteros — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1902."
