notes = "Letter CCCXXVI praises Charles Langlois and Antoine Dubois, directors of the Paris Seminary of Foreign Missions, for its missionaries and martyrs in China and the Indies and gives the seminary chapel the body of the martyr St Phosphorus; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF56706–56706; the source dating clause at LF56808–56811 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die sexta iulii mil- lesimo octingentesimo quadragesimo quinto, pon- tificatus Nostri anno decimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
