notes = "Brief I creates Marco Scarselli and his legitimate heirs marquises; address LF333–334 precedes GREGORIUS PP. XVI. LF337; body runs native page 11 left column LF340–371 to right column LF380 (latis); provenance LF374 and signature line LF377 excluded; full Non obstantibus and 9 January 1835 closing LF403–406. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF337–337; the source closing at LF403–406 reads: Datum Romae apud s. Petrum sub annulo piscatoris die nona ianuarii millesimo octingen- tesimo trigesimo quinto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
