description = "Letter CCXXIII, addressed to the cardinal vicar general of Rome (LF38577–38579), commissions him to authorize, after Joseph Pereira Santiago's renunciation, the perpetual emphyteusis to Antonio Marini of houses in via Tor de' Specchi belonging to the abbey of Sant'Andrea de Funari, with stated conditions, and ends with its own 10 May 1833 closing at LF38727; the running-title half (LF38730) and page number 251 (LF38733) precede numeral CCXXIV at LF38736. Issuer evidence is GREGORIUS PP. XVI. at LF38582–38582; the source closing at LF38718–38727 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima maii millesimo octingentesimo -trigesimo tertio, pontificatus Nostri anno tertio. LF38663 (1 Ex Bullario Romano,) is its own provenance note inside the excluded block LF38663–38669 (with a head speck and ANNO). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
