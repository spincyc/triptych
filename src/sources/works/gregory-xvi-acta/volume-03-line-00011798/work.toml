description = "XXXIX is one brief to the superior of the Paris Foreign Missions seminary: address LF11811–11813, intitulation LF11816, greeting and commission to choose the Yun-nan vicar apostolic, and Castel Gandolfo dating clause. The raw candidate ended at LF11831 only because the split running title LF11834 was proposed as a heading. Provenance note1 LF11906 belongs to XXXIX. Issuer evidence: GREGORIUS PP. XVI. at LF11816–11816; the source dating clause at LF11861–11864 reads: Datum in Arce Gandulphi sub annulo pisca- toris die vigesima octava augusti millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
