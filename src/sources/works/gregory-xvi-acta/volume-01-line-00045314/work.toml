description = "Letter CCLXI (protocol LF45322–45325) confirms the rules and constitutions of the Irish Sisters of Charity of Dublin, praising their care in the cholera epidemic, and ends with its own 30 August 1833 closing at LF45407–45410, before numeral CCLXII at LF45413. Issuer evidence is GREGORIUS PP. XVI. at LF45322–45322; the source closing at LF45407–45410 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die trigesima augusti millesimo octingentesimo trigesimo tertio, pon- tificatus Nostri anno tertio. Its own provenance note 1 (t Ex Bullario Romano,, LF45439) is printed at the foot of leaf 313 inside CCLXII's frame and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-01"]
