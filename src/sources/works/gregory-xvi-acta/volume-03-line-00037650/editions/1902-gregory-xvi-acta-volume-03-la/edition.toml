notes = "Apostolic letter CCIX lets Ferdinando Papi, parish priest of San Lorenzo in Lucina, enrol the faithful everywhere in the Heart of Mary sodality with its indulgences; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Its provenance note1 is LF37783. Issuer evidence: GREGORIUS PP. XVI. at LF37659–37659; the source dating clause at LF37737–37740 reads: Datum Romae apud s. Petrum sub annulo piscatoris die trigesima prima martii millesimo octingentesimo quadragesimo tertio, pontifi- catus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
