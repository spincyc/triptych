notes = "Brief XIII to Bishop Johann Scitowsky of Rozsnyó (address LF2746–2748) sends the relics of St Neitus with a feast and plenary indulgence; LF2768 → LF2771 column change; complete 20 March 1835 closing LF2823–2826. The decree note LF2829–2836 belongs to XII; own provenance LF2837 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF2751–2751; the source closing at LF2823–2826 reads: Datum Romae apud sanctum Petruin sub annulo piscatoris die vigesima martii millesimo octingentesimo trigesimo quinto, pontificatus Nostri anno quinto, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
