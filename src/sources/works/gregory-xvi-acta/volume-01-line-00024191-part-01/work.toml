description = "Brief CL appointing Ioannes Poulden OSB vicar apostolic of Madras; address 24199–24200, protocol 24203, Datum 24280–24283. Internal gaps are running titles, page numbers, signatures and provenance citations only. The dating clause 24280–24283 prints millesimo octingentesimo trigesimo tertio with pontificatus anno secundo, and the act stands in the July 1832 sequence; the year conflict is not resolved, so the act date is left unknown (3 July). Issuer evidence GREGORIUS PP. XVI. at LF24203. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
