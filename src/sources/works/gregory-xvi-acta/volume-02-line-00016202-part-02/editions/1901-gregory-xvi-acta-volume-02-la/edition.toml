notes = "Letter XCVI (address LF16405–16406) rejoices at the return of 500 schismatics of Lugos reported by Bishop József Lonovics of Csanád; single right column LF16405–16458 with complete 8 June 1836 closing. Own provenance LF16461 and page-113 running title LF16464 excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF16409–16409; the source closing at LF16455–16458 reads: Datum Romae apud sanctum Petruin sub annulo piscatoris die octava iunii millesimo octingentesimo trigesimo sexto, pontificatus No- stri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
