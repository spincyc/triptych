description = "Letter LXXI (printed EPISTOLA, OCR BP Set Oi x; address LF12877–12879) thanks Emir Bashir of Mount Lebanon and sends an icon with a relic of the Cross, a gold medal and a rosary; LF12914 → LF12920 across page-88 running title LF12917; complete 10 November 1835 closing. Own provenance LF12987 (Ex Regesto Vaticano) excluded. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF12882–12882; the source closing at LF12929–12931 reads: Datum Romae apud s. Petrum die decima novembris anno millesimo octingentesimo tri- gesimo quirito, pontificatus Nostri anno quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
