notes = "Letter LXXXI to Nicholas I reports Gutkowski’s promotion arrangements and pleads for the Greek-rite Catholics; address, intitulation, salutation, body and dating clause survive. Native geometry (LF17289 y2047 → LF17292 y2136) shows no missing salutation line. Issuer evidence: GREGORIUS PP. XVI. at LF17286–17286; the source dating clause at LF17383–17385 reads: Datum Romae die septima aprilis millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
