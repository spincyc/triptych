notes = "Letter LXXXIII (printed EPISTOLA; address LF14677–14678) answers the Guatemalan clergy after Archbishop Ramón Casaus’ expulsion; LF14713 mit- → LF14722 timus across own provenance LF14716 and page-101 running title LF14719; complete 5 March 1836 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF14681–14681; the source closing at LF14736–14739 reads: Datum Romae apud s. Petrum sub annulo piscatoris die quinta martii millesimo octingen- tesimo trigesimo sexto, pontificatus Nostri anno sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
