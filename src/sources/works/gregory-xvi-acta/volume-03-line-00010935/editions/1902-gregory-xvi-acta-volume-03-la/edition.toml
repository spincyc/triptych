notes = "Actual named address and apostolic visitor/delegate commission to Theodor Abukarim are retained through the complete dating clause. Provenance note1 at11068 belongs this act, while note2 at11065 belongs the Rhedonensis act. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF10951–10951; the source closing at LF10995–11000 reads: Datum ab Arce Gandulphi sub annulo pi- scatoris die vigesima quarta iul. millesimo Octingentesimo quadragesimo, pontificatus No- stri anno decimo.. The witness abbreviates its conventional mandate as “Mandamus etc.” at LF10993; this remains literal. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
