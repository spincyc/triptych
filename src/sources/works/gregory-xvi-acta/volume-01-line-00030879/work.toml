description = "Letter CLXXXVI, addressed to Cardinal Luigi Lambruschini (LF30892–30894), replaces Cardinal Fransoni as apostolic visitor of the Reformed Franciscan convent and college of San Pietro in Montorio, commands obedience, derogates contrary statutes and ends with its own 27 November 1832 closing at LF30946; LF30949 is the next column's running title before numeral CLXXXVII at LF30952. Issuer evidence is GREGORIUS PP. XVI. at LF30897–30897; the source closing at LF30943–30946 reads: Datum Romae apud s. Petrum sub annulo piscatoris die. vigesima septima novembris mil- lesimo octigentesimo trigesimo secundo, pon- tificatus Nostri anno secundo. The literal glyphs * (LF30900, before Dilecte fili) and ; (LF30904) are retained uncorrected. Its own provenance note 1 (Ex Bullario Romano) is printed at LF31028 inside CLXXXVII's frame and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-01"]
