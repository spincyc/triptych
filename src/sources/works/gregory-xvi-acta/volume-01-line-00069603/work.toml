description = "Letter CCCLXXIII, addressed to the bishop of Alatri (LF69615–69616; protocol LF69619; salutation LF69622–69623), commits to him to allow the widow Bernardina De Caesaris a new gallery (odeum) into the parish church of the Most Holy Saviour for hearing Mass, and ends with its own 26 August 1834 closing at LF69692–69695, before numeral CCCLXXIV at LF69698. Issuer evidence is GREGORIUS PP. XVI. at LF69619–69619; the source closing at LF69692–69695 reads: ‘Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima sexta au- gusti millesimo-octingentesimo trigesimo quarto, pontificatus Nostri antio quarto. Its own provenance note 1 (LF69753) is printed at the foot of leaf 475 inside the following congregation decree and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
