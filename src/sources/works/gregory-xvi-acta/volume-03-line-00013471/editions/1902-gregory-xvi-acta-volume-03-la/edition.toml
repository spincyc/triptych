notes = "Letter LV congratulates Pedro II on being declared of age; address, intitulation, body and dating clause survive. Provenance note1 LF13589 belongs to LV. Issuer evidence: GREGORIUS PP. XVI. at LF13487–13487; the source dating clause at LF13532–13535 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima tertia novembris, mille- simo octingentesimo quadragesimo, pontificatus Nostri anno decimo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
