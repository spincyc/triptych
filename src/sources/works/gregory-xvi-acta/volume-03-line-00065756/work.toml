description = "Consistorial allocution CCCXLII confirms the election of Joseph Gazen, archbishop of Damascus, as Maronite patriarch of Antioch, absolves him from his former see and grants the pallium; it runs from “Venerabiles fratres” LF65772 to “Amen.” LF65861. Issuer evidence: ACTA GREGORII PP. XVI. at LF65656–65656; the source dating clause at LF65766–65769 reads: DIE DECIMA NONA IANUARIL AN. MILLESIMI OCTINGENTESIMI QUADRAGESIMI SEXTI. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-03"]
