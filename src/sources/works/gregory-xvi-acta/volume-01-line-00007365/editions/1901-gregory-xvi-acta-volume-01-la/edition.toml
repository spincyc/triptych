notes = "The act revokes the asserted privileges of the plebanal church del Tho and divides its congregation of parishes into two, under the bishop of Faenza. Issuer evidence GREGORIUS PP. XVI. at LF7380; own dating clause LF7475–7478 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima nona au- gusti millesimo octingentesimo trigesimo primo, pontificatus Nostri anno primo.. Own provenance note LF7481 excluded as edition furniture. Refined body and full surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
