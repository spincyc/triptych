description = "Letter CCCXXIV (protocol GREGORIUS PP. XVI. ad futuram rei memoriam LF60185–60186) declares that the indult allowing eggs, dairy and meat on forbidden days applies to all soldiers of the grand duke of Tuscany and members of the war department whatever their pay, and ends with its own 22 April 1834 closing at LF60269, before numeral CCCXXV at LF60272. Issuer evidence is GREGORIUS PP. XVI. at LF60185–60185; the source closing at LF60266–60269 reads: Datum’ Romae apud s. Petrum sub annulo piscatoris die vigesima secunda aprilis mille- simo octingentesimo trigesimo quarto, pontifi- catus Nostri anno quarto. . Its provenance note 1 (LF60130) is printed in CCCXXIII's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-01"]
