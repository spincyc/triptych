context = "Letter CCCIX to Alessandro Orfini, patrician of Foligno (address LF58202–58203, protocol LF58206), names him and his first-born descendants counts of the Lateran palace and ends with its own 28 February 1834 closing at LF58270, before numeral CCCX at LF58273. Issuer evidence is GREGORIUS PP. XVI. at LF58206–58206; the source closing at LF58267–58270 reads: Datum Romae dpud sanctum Petrum sub annulo piscatoris die vigesima octava februarii millesimo octingentesimo trigesimo quarto, pon- tificatus Nostri anno quarto. Its provenance note 1 is printed at LF58313 in CCCX's foot block and excluded there. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Complete act extent [[58202, 58242], [58244, 58270]] selected from address/protocol LF58202 through the source closing LF58270. Read in full in acquired LF order within the lane read LF48150-65030 (claim LF48310-64566, at least twenty literal lines beyond every boundary, and the continuation of letter CCCXLIII to its closing). Whole-source TXT/XML WORD token equality (353,435 tokens) was verified and per-line native WORD geometry (line boxes, column, back-jumps, printed lines split across OCR lines, vertical skips, left/right offsets and intra-line WORD gaps) was checked for the selected extent; no general image collation is claimed."
