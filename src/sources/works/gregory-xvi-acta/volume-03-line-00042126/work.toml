description = "Letter CCXLI congratulates Jean-Baptiste Etienne (printed “Etienne”) on his election as superior general of the Congregation of the Mission and the Daughters of Charity and thanks him for an image of the martyr Gabriel Perboyre; address (LF42145–42148), intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF42151–42151; the source dating clause at LF42233–42236 reads: Datum Romae apud s. Petrum die vigesima prima octobris, anno millesimo octingentesimo quadragesimo tertio, pontificatus Nostri anno decimo tertio. LF42146 prints “Etienne .”; the “.” is a one-pixel speck at x2154 well right of the centred name (native WORD geometry), retained literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
relations = ["work.gregory-xvi-acta.volume-03"]
