description = "Letter CCCLXXI to the bishop of Freiburg praises his defence of the Church’s doctrine on mixed marriages and declares that the blessing may never be given to mixed marriages contracted without dispensation and cautions, recalling the instructions of Pius VIII and his own allocutions; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF76751–76751; the source dating clause at LF76907–76910 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima tertia maii millesimo octingentesimo quadragesimo sexto, pontifica- tus Nostri anno decimo sexto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
