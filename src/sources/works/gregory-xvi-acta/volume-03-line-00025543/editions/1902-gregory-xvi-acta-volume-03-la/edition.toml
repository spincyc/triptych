notes = "Apostolic letter CXIX reforms the Order of the Golden Militia (two classes, numbers, insignia, chancellor, revocation of others’ power to confer it); decree, non obstantibus and dating clause survive. The dating clause begins at LF25792 and ends after the page break at LF25801–25803. Issuer evidence: GREGORIUS PP. XVI. at LF25551–25551; the source dating clause at LF25801–25803 reads: piscatoris die trigesima prima octob. millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. . Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
