description = "Apostolic letter CCLXXXVI provides Fr. Fidelis Sutter of Ferrara, vicar apostolic of the Tunis mission, to the titular see of Rosalia with non-residence and consecration clauses; intitulation, greeting “Dilecte fili” (this printing has no address), provision, non obstantibus clause and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF51435–51435; the source dating clause at LF51582–51585 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die quinta iulii mil- lesimo octingentesimo quadragesimo quarto, pontificatus Nostri anno decimo quarto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF51474 “|”; LF51487 “|”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
