description = "Apostolic letter CCXXXIX (labelled BULLA by the edition) beatifies the Neapolitan Alcantarine tertiary Maria Francesca of the Five Wounds, granting office, Mass and the solemnities; intitulation “GREGORIUS PP. XVI. ad perpetuam rei memoriam”, narrative of life, virtues and miracles, grant, non obstantibus, transumpt clause and sub annulo piscatoris dating clause survive. The printed genre label is preserved as genre; the documentary form is that of a brief. Issuer evidence: GREGORIUS PP. XVI. at LF41763–41763; the source dating clause at LF41975–41979 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quinta octobris anno millesimo octingentesimo qua- dragesimo tertio, pontificatus Nostri decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
