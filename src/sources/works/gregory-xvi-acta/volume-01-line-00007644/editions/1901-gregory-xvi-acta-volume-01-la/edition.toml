notes = "The act communicates to the Zaragoza hospital of Our Lady of Grace the indulgences and privileges of the Roman Charity confraternity and hospitals. Issuer evidence GREGORIUS PP. XVI. at LF7658; own dating clause LF7736–7739 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima sexta augusti millesimo octingentesimo trigesimo pri- mo, pontificatus Nostri anno primo.. Own provenance note LF7773 excluded as edition furniture. Refined body and full surrounding frame read literally. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
