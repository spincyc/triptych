context = "Letter CCXXVII, addressed to the bishop of Viterbo and Tuscania (LF39089–39090), commissions him to convert the Pocci family chaplaincy of St James the Greater in Tuscania cathedral into a pious legacy while the male line lasts, with conditions, and ends with its own 21 May 1833 closing at LF39204, before numeral CCXXVIII at LF39207 (next claim). Issuer evidence is GREGORIUS PP. XVI. at LF39093–39093; the source closing at LF39201–39204 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima prima maii millesimo octingentesimo trigesimo- tertio, pontificatu Nostri anno tertio. The block LF39105–39117 holds specks, CCXXVI's note 1, this letter's note 2 (Ex eodem Bullario.) and page number 254. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
