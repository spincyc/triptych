notes = "Consistorial allocution CCCXXXVII declares Lorenzo Simonetti and Giacomo Amadori Piccolomini, created in pectore in July 1844, cardinal priests and creates one further cardinal in pectore; it runs from “Venerabiles fratres” LF65190 to “Amen,” LF65278. Issuer evidence: ACTA GREGORII PP. XVI. at LF65087–65087; the source dating clause at LF65181–65187 reads: DIE VIGESIMA QUARTA NOVEMBRIS AN. MILLESIMI OCTINGENTESIMI QUADRAG, QUINTI. The allocution has no dating clause; its date is taken from the excluded edition caption, as for the allocutions admitted in earlier batches. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
