notes = "Brief CLXXX (address LF39596–39598 to Luigi Fontana, bishop of Sinitis, vicar apostolic of Szechwan) transfers him to the restored vicariate of Hukwang, his coadjutor succeeding in Szechwan; LF39608 → LF39620 across CLXXIX’s provenance LF39611, own provenance LF39614 and page number 270 LF39617; complete 14 August 1838 closing. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS PP. XVI. at LF39601–39601; the source closing at LF39676–39679 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima quarta augusti millesimo octingentesimo trigesimo oc- tavo, pontificatus Nostri anno octavo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
