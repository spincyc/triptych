notes = "Letter CXCV condoles with Ferdinand II on the death of his brother Antonio, count of Lecce; address, intitulation, greeting, body, blessing and dating clause survive. Its provenance note1 is LF36490. Issuer evidence: GREGORIUS PP. XVI. at LF36406–36406; the source dating clause at LF36445–36448 reads: Datum Romae apud s. Petrum sub annulo piscatoris die prima februarii millesimo octin- gentesimo quadragesimo tertio, pontificatus No- stri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
