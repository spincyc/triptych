title = "In eminenti beati Petri cathedra — Dismembratio paroeciarum ab episcopatu Emeritensi et unio cum archidioecesi Sanctae Fidei de Bogota — Rome: Ex Typographia Polyglotta S. C. de Propaganda Fide, 1901."
