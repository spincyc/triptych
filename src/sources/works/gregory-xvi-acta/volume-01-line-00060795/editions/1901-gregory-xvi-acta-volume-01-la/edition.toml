notes = "Bull CCCXXVIII (protocol GREGORIUS EPISCOPUS servus servorum Dei ad futuram rei memoriam LF60808–60812) motu proprio detaches the parishes of Pamplona, San José de Cúcuta, Limoncito and San Faustino de los Ríos from the diocese of Mérida and unites them to Santa Fe de Bogotá, names the bishop of Calydon executor and ends with Nulli ergo, the sanction and its own dating clause pridie nonas maii 1834 at LF61029, before numeral CCCXXIX at LF61032. Issuer evidence is GREGORIUS EPISCOPUS servus servorum Dei at LF60808–60809; the source closing at LF61026–61029 reads: Datum Romae apud sanctum Petrum anno incarnationis Dominicae millesimo octingente- simo trigesimo quarto, pridie nonas maii, pon- tificatus Nostri anno quarto. LF60838 (2 Ex eodem Bullario,) is its own provenance note, excluded with the running title. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
