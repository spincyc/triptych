description = "Letter CCCXV to Archbishop Aloysius Iosephus of Prague and the bishops Augustinus Bartholomaeus of Litoměřice, Carolus Borromaeus of Hradec Králové and Ernestus Constantinus of České Budějovice praises their wish that the Virgin be honoured as conceived without original sin and reports the preface “immaculata Conceptio” permitted in Rome; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF55464–55464; the source dating clause at LF55531–55534 reads: Datum Romae apud s. Petrum die vigesima tertia aprilis anno millesimo octingentesimo quadragesimo quinto, pontificatus Nostri anno decimo quinto. The letter refers to rescripts of the Congregation of Sacred Rites “heic adiectis” (LF55506–55507); this printing does not reproduce those separate curial rescripts, which are not part of the papal letter’s text. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
