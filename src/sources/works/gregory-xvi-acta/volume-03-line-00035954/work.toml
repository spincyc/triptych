description = "Bull CXCIII confirms the election of Archbishop Michael Der-Asdnazarian of Caesarea as Armenian Catholic patriarch of Cilicia and transfers him, with mandates to suffragans, clergy, people and vassals and the prescribed oath form (LF36144–36228) that the bull itself prints as part of its text, ending with the incarnation-year dating clause (octavo kalendas februarii = 25 January). Issuer evidence: GREGORIUS EPISCOPUS at LF35969–35969; the source dating clause at LF36230–36233 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo tertio, octavo kalendas fe- bruarii, pontificatus Nostri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF36155 “‘colore”; LF36183 “- pro”; LF36217 “‘mensam”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
