description = "Apostolic letter CCCVIII commissions the bishop of Bagnoregio to unite in perpetuity the simple benefice of St John the Evangelist to the capitular mensa of his cathedral; intitulation, greeting “Venerabilis frater” (this printing has no address), narrative, commission, non obstantibus clause and dating clause survive. The claim ends here; the next act, CCCIX, begins at LF54423 (lane volume-03-b05). Issuer evidence: GREGORIUS PP. XVI. at LF54343–54343; the source dating clause at LF54417–54420 reads: Datum Romae apud s. Petrum die decima prima februarii millesimo octingentesimo qua- dragesimo quinto, pontificatus Nostri anno de- cimo quinto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
