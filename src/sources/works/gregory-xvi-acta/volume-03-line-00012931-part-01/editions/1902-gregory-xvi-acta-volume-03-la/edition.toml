notes = "Letter XLVIII congratulates William I of the Netherlands on the birth of a prince; royal address, intitulation, salutem, body and dating clause survive. Its provenance note1 is LF13039. Issuer evidence: GREGORIUS PP. XVI. at LF12944–12944; the source dating clause at LF12977–12980 reads: Datum Romae apud sanctam Mariam Maio- rem die decima secunda octobris millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
