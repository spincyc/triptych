notes = "Letter LXXVI to President Boyer of Haiti commends Bishop Rosati of St Louis as papal delegate; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF16484–16484; the source dating clause at LF16572–16575 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima quarta mart. millesimo octingentesimo quadragesimo primo, pontifica- tus Nostri anno decimo primo, Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
