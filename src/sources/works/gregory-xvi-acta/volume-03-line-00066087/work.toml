description = "Apostolic letter CCCXLVI to Jan Roothaan, superior general of the Society of Jesus, extends for twenty years the faculties granted by Leo XII for communication to Jesuit missionaries; address, intitulation, greeting, body, non obstantibus clause and dating clause survive. Its provenance note2 is LF66157. Issuer evidence: GREGORIUS PP. XVI. at LF66102–66102; the source dating clause at LF66145–66148 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima februarii millesimo octin- gentesimo quadragesimo -sexto, pontificatus Nostri anno decimo sexto. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF66115 “|”; LF66128 “'literae”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
