notes = "Letter CCXCVII, addressed to the bishop of Cuenca (LF51055–51056), empowers him to dispense parish priests temporarily from residence for diocesan business and ends with its own 10 January 1834 closing at LF51142, before numeral CCXCVIII at LF51145. Issuer evidence is GREGORIUS PP. XVI. at LF51059–51059; the source closing at LF51139–51142 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima ianuarii mille- simo oOctingentesimo trigesimo quarto, ponti- ficatus Nostri anno tertio. The numeral is garbled (EC¥evik, LF51047). The block LF51100–51106 holds CCXCVI's note 1, this letter's note 2 (Ex eodem Bullario.) and page number 334. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
