notes = "Apostolic letter CCXVIII raises the Rosary confraternity at San Domenico, Oristano, to an archconfraternity with mozzetta and black cap and power of aggregation; intitulation, narrative, grant, decernentes and non obstantibus clauses and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF38975–38975; the source dating clause at LF39051–39054 reads: Datum Romae apud s. Petrum sub annulo piscatoris die secunda iunii millesimo octin- gentesimo quadragesimo tertio, pontificatus No- stri anno decimo tertio. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF39049 “:”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
