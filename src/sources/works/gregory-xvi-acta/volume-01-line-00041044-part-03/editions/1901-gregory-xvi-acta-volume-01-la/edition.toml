notes = "Epistle CCXL to the Infanta Isabel Maria of Portugal (address LF41664–41665, protocol LF41668, salutation LF41671–41672) sends a relic of the True Cross through Cardinal Giustiniani with indulgences and ends with its own 1 July 1833 closing at LF41718–41721, before numeral CCXLI at LF41724. Issuer evidence is GREGORIUS PP. XVI. at LF41668–41668; the source closing at LF41718–41721 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die prima iulii mil-. lesimo octingentesimo trigesimo tertio, ponti- ficatus Nostri anno tertio. Its own provenance note 1 (Ex Archivio Brevium ad Principes, LF41759) is printed at the foot of leaf 289 inside CCXLI's frame and is excluded. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
