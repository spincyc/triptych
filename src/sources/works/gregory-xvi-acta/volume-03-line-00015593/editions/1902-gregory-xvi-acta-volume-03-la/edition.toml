notes = "Letter LXXI to Primate William Crolly praises the Irish bishops’ unanimous acceptance of Propaganda’s ruling on the national education system; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF15609–15609; the source dating clause at LF15675–15678 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava februar. mille- simo octingentesimo quadragesimo primo, pon- tificatus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
