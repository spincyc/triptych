context = "Epistle CCCLXXXV (OCR CECE 2A er, / BPUSTORA) to the bishop of Hildesheim (protocol “GREGORIUS PP. XVI. LF72162; address Venerabilis frater, salutem ... LF72165–72166) urges him and his chapter to defend the Church's rights against the new Hanoverian constitution and the lay consistories and to press for the promised endowment under the bull Impensa, and ends with its own 8 November 1834 closing at LF72275–72278, before its foot-note LF72281 and numeral CCCLXXXVI at LF72287. Issuer evidence is “GREGORIUS PP. XVI. at LF72162–72162; the source closing at LF72275–72278 reads: Datum Romae apwd sanctum Petrum sub annulo piscatoris die octava novembris mille- simo Octingentesimo trigesimo quarto, pontifi- catus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
