notes = "Apostolic letter CCXLVII erects the see of Milwaukee for Wisconsin; intitulation, narrative, erection, decernentes clause and dating clause survive. Its provenance note1 is LF43152 at the foot of leaf 314. Issuer evidence: GREGORIUS PP. XVI. at LF43032–43032; the source dating clause at LF43076–43079 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima octava novembris mil- lesimo octingentesimo quadragesimo tertio, pon- tificatus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
