notes = "The complete bull elevates Santiago and assigns Concepción as suffragan; execution, transumpt, prohibition and full dating clause all survive. Twelfth day before June kalends is21May. Refined body and full surrounding frame read literally. Issuer evidence is GREGORIUS EPISCOPUS at LF7828–7828; the source closing at LF8050–8053 reads: Datum Romae apud sanctum Petrum anno incarnationis dominicae millesimo octingente- simo quadragesimo, duodecimo kalendas iu- nii, pontificatus Nostri anno decimo..  Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
