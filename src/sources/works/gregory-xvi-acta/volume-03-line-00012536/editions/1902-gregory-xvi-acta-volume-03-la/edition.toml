notes = "Apostolic letter XLV raises Francesco Prat’s Solfagnano estate to a marquisate, with derogations and full dating clause. LF12622–12623 at the foot of leaf 96 is held encyclical XLIV’s own Leo-the-Great reference note (marker at LF12511), not XLV furniture; it is simply not selected here. Issuer evidence: GREGORIUS PP. XVI. at LF12544–12544; the source dating clause at LF12662–12665 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die vigesima quinta septembris millesimo octingentesimo quadrage- simo, pontificatus Nostri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
