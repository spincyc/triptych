description = "Letter CCXI, addressed to John England, bishop of Charleston (LF36666–36668), appoints him legate of the Holy See to President Boyer of Haiti for the cause of religion there, and ends with its own 15 March 1833 closing at LF36766, before numeral CCXII at LF36772. Issuer evidence is GREGORIUS PP. XVI. at LF36671–36671; the source closing at LF36763–36766 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima quinta mart. mil- lesimo octingentesimo trigesimo tertio, ponti- ficatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
