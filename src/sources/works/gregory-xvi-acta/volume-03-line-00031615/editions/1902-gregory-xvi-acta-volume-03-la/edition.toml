notes = "Letter CLXV to Abbot Rupert Leiss of Scheyern rejects the condition of funeral masses for a non-Catholic queen and withholds confirmation of the constitutions until it is restricted; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF31638–31638; the source dating clause at LF31746–31749 reads: Datum Romae apud sanctam Mariam Maio- rem die nona iulii millesimo octingentesimo quadragesimo secundo, pontificatus Nostri anno decimo secundo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
