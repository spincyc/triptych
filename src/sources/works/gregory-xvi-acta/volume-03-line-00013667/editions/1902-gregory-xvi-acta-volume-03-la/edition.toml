notes = "Letter LVII praises the Fourth Provincial Council of Baltimore and refers its petitions to Propaganda; address, intitulation, body, blessing and dating clause survive. Its provenance note1 is printed at the foot of the preceding left column, LF13664. Issuer evidence: GREGORIUS PP. XVI. at LF13686–13686; the source dating clause at LF13761–13766 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima nona decembris millesimo octingentesimo quadragesimo, pontificatus No- stri anno decimo '. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
