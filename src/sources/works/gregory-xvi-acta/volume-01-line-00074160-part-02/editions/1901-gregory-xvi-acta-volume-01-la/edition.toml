notes = "Letter CCCXCII (OCR CCGXCIE; protocol LF74279–74282) erects the island of Ceylon as a distinct apostolic vicariate with its seat at Colombo, and ends with its own 3 December 1834 closing at LF74351–74354, before numeral CCCXCIII (OCR CCCKGII) at LF74357. Issuer evidence is GREGORIUS PP. XVI. at LF74279–74279; the source closing at LF74351–74354 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die tertia decembris millesimo octingentesimo trigesimo quarto, pontificatus Nostri anno quarto. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
