notes = "Letter CCCXLVIII (protocol LF65847–65850) grants forty days' indulgence to those who kiss the foot of St Benedict's statue in the Sacro Speco of Subiaco and pray, ending with Praesentibus perpetuis ... valituris and its own 18 June 1834 closing at LF65886–65891, before numeral CCCXLIX at LF65894. Issuer evidence is GREGORIUS PP. XVI. at LF65847–65847; the source closing at LF65886–65891 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima octava iunii mille- simo octingentesimo trigesimo quarto, ponti- _ficatus Nostri anno quarto. Its own provenance note 1 (LF65953) is printed at the foot of leaf 449 inside CCCXLIX's text and is excluded; page number 431 (LF65883) precedes the closing. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
