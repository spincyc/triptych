notes = "Apostolic letter LXIX designates Dominique Lefebvre successor vicar apostolic of Cochinchina and provides him to Isauropolis, with consecration faculties and non obstantibus; the dating clause continues across the leaf break (LF15504, LF15510–15512). Issuer evidence: GREGORIUS PP. XVI. at LF15324–15324; the source dating clause at LF15510–15512 reads: piscatoris die vigesima sexta februar. millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
