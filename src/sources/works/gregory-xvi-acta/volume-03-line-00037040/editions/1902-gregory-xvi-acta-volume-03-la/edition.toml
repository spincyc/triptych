notes = "Letter CCI commends nuncio Pecci to Queen Louise of the Belgians; address, intitulation, greeting, body, blessing and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF37053–37053; the source dating clause at LF37104–37107 reads: Datum Romae apud s. Petrum sub annulo piscatoris die decima prima martii millesimo octingentesimo quadragesimo tertio, pontifica- tus Nostri anno decimo tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
