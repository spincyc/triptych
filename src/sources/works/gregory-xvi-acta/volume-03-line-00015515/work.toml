description = "Apostolic letter LXX empowers the West Tonkin vicar apostolic to administer Cochinchina and choose a new vicar should both the vicar and his coadjutor die; address, intitulation, body and dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF15530–15530; the source dating clause at LF15587–15590 reads: Datum Romae apud s. Petrum sub annulo piscatoris die vigesima sexta februar. millesimo octingentesimo quadragesimo primo, pontifi- catus Nostri anno decimo primo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
