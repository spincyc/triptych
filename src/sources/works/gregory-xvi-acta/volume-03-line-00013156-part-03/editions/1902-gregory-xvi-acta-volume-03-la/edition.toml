notes = "Letter LIII congratulates William II on his accession and on the renewed accreditation of Count de Liedekerke; address, intitulation, body and dating clause survive. Its provenance note1 is LF13447. Issuer evidence: GREGORIUS PP. XVI. at LF13329–13329; the source dating clause at LF13384–13387 reads: Datum Romae apud sanctum Petrum sub annulo piscatoris die decima secunda novemb. millesimo octingentesimo quadragesimo, ponti- ficatus Nostri anno decimo. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
