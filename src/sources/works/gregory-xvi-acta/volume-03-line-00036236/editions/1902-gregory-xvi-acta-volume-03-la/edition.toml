notes = "Letter CXCIV (labelled EPISTOLA by the edition) sends the pallium to Patriarch Michael Der-Asdnazarian with the assignment formula and oath form it prints in its text; address, intitulation “GREGORIUS PP. XVI. / servus servorum Dei”, greeting, body, forms and incarnation-year dating clause survive. Issuer evidence: GREGORIUS PP. XVI. at LF36253–36253; the source dating clause at LF36386–36389 reads: Datum Romae, apud s, Petrum anno incar- nationis dominicae millesimo octingentesimo quadragesimo tertio, octavo kalendas februarii, pontificatus Nostri anno decimo secundo. Isolated OCR marks fused into body lines remain literal and are not removed or corrected: LF36301 “_Topus”. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
