description = "Letter CCLXIII (protocol GREGORIUS PP. XVI ad perpetuam rei memoriam LF45509–45510) raises the parish church of St Peter at Lucca to a priory and grants its parish priests the title of prior, ending with its own 10 September 1833 closing at LF45636–45639; LF45642 is a speck before numeral CCLXIV at LF45645. Issuer evidence is GREGORIUS PP. XVI at LF45509–45509; the source closing at LF45636–45639 reads: Datum Romae apud sanctam Mariam Maio- rem sub annulo piscatoris die decima septem- bris millesimo octingentesimo trigesimo tertio, pontificatus Nostri anno tertio. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
