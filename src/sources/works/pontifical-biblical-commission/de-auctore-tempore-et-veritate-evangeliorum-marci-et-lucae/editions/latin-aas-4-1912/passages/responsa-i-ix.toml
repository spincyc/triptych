context = "Responsa I-IX affirm Mark, disciple and interpreter of Peter, and Luke, physician and companion of Paul, as the respective authors; defend Mark 16:9-20 and the specified Lucan narratives; uphold the traditional order Mark then Luke after Matthew; exclude composition as late as Jerusalem's destruction or its begun siege; place Luke before Acts and before the end of Paul's first Roman captivity; affirm trustworthy oral and written sources and the historical credibility of both narratives."
verified_on = "2026-08-21"
notes = "Read visually in the official-gazette page images. The responsa begin on p. 463 and conclude near the top of p. 465; item II, De quaestione synoptica, then intervenes before the shared approval notice and consultors' signatures at the foot of p. 465. The passage locus does not claim item II as part of this work."
