notes = "The Rosenbaum and Silbermann edition prints a vocalized Hebrew Rashi with a facing English translation and notes. Both are in the public domain. The English expands Rashi's abbreviations and supplies bracketed clarifications; a quotation of it is a quotation of the translators as well as of Rashi. Catalog-level record created 2026-07-26. No exact artifact has been registered; publications consulting a digital delivery of this edition record their own access route and limits locally."
