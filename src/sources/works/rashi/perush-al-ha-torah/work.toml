description = "Rashi's commentary on the Pentateuch, written in the late eleventh century and the most widely printed Jewish commentary on the Torah. Rashi habitually distinguishes the plain sense of a verse from its midrashic sense and prints them in that order; a reader who takes a midrashic sense reported by Rashi as his own plain-sense judgment has misread him. A locus is BookToken.chapter.verse."
