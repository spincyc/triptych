context = "The local expositions corresponding to Psalm 16:2 and 16:8 were inspected with their surrounding Psalm exposition. Cassiodorus grounds judgment in God's sight without external testimony, treats the pupil as precious and discerning, and develops the wings as protection, mercy, and charity. These are received spiritual readings, not the Psalm's sole historical sense."
