context = "Local section 6 expounds praise and vow in Zion and Jerusalem as right worship and good works directed to God alone. Local section 21 reads the fruitful low valleys as humble people and explicitly invokes the publican who would not raise his eyes or presume on merits. The latter is an unusually direct patristic bridge from the Psalm's end to Luke 18, but it remains Cassiodorus's reception rather than evidence of formulary compilation."
