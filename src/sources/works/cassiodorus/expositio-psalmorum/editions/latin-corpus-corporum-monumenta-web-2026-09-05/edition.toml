notes = "A dated web state of a public-domain Latin transcription, not a critical edition and not a collation against Migne's printed column. THIS IS NOT A SECOND IDENTITY FOR AN EXISTING RECORD: edition.cassiodorus.expositio-psalmorum.latin-corpus-corporum-monumenta-web-2026-07-28 is the same host and the same transcription in an earlier dated state, holding the Psalm 64 page; a new dated state is a new edition here because the bytes a URL serves change, and both editions remain readable side by side. ADDRESSING RULE, established by fetching and not assumed: each psalm is reached at a rumpfid of the form \"Cassiodorus, Expositio in Psalterium, <pars>, <psalm number right-justified in five characters>\", with Psalm 39 in pars 1, Psalms 70, 85 and 97 in pars 2 and Psalm 101 in pars 3. TWO VIEWS OF EACH PSALM, AND BOTH ARE REGISTERED: the same page is served at hide_apparatus=1 and at hide_apparatus=0, and the second is the fuller view -- it adds Migne's marginal verse numerals to each lemma and his manuscript variants in square brackets -- so it is the one whose Latin is retained here. The pages carry no PL 70 column marker anywhere and state no licence, notice or condition of any kind. PAIRING: no English edition of the Expositio psalmorum was sought or retrieved in this run, and none is registered on this work; the absence is recorded rather than left silent, and the Latin is in any case the witness a question about Cassiodorus's own wording has to be settled on."
