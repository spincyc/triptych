notes = "Cassiodorus on Vulgate Psalm 85 (in Psalmum LXXXV), pars 2, in the host's APPARATUS state (hide_apparatus=0), which is the fuller of the two views this source offers: it prints Migne's marginal verse numerals over each lemma and his manuscript variants in square brackets. Extent as measured by the retrieving lane: The same complete exposition of Psalm 85 re-fetched with hide_apparatus=0, which is the fuller view the host offers: it adds Migne's marginal verse numerals to each lemma and his manuscript variants in brackets. Both states were kept because the suppressed-apparatus URL is the one the repository already registers for this edition and the apparatus state is the one the loci and the variant checks in this finding were read from. The exposition covers the Introit, Ps. 85:1, 3 and 5, at the host's sectiones 6, 8 and 10. ACCESS LIMITATION. What is not retained is monumenta.ch's own HTML delivery -- its markup, its generated Google-Translate links, its per-sectio anchors and its tooltip scripts -- and it is not retained because the page states no terms at all and `tracked` requires an affirmative basis. What a reader without the network can open instead is the whole Latin of this same page, apparatus and verse numerals included, retained at artifact.cassiodorus.expositio-psalmorum.latin-corpus-corporum-monumenta-web-2026-09-05.monumenta-ps85-apparatus-latin-text."
