notes = "A SECOND DELIVERY OF THE SAME SUPPRESSED-APPARATUS PAGE FOR PSALM 39, fetched by a different lane at a URL carrying the same parameters in a different order. It is separate bytes and a separate artifact because the page echoes its own query string, in that order, inside every link it prints; the byte size is identical to the sibling delivery and the difference is confined to those echoed hrefs. THIS WAS CHECKED AND NOT ASSUMED: the same extraction run over both deliveries yields byte-identical Latin, so this delivery witnesses no word the sibling does not. Extent as measured by the retrieving lane: Complete monumenta.ch delivery of Cassiodorus, Expositio in Psalterium, pars 1, Psalm 39, one HTML document, title element 'Cassiodorus, Expositio in Psalterium, 1,   39'; carries the psalm's whole exposition from its title to its close, including the lemmata of vv. 14 and 15 which the Offertory sings. Not a facsimile and carrying no PL 70 column marker. ACCESS LIMITATION. The host's HTML is not retained, for the reason in `rights_basis`; the Latin is open offline at artifact.cassiodorus.expositio-psalmorum.latin-corpus-corporum-monumenta-web-2026-09-05.monumenta-ps39-apparatus-latin-text."
