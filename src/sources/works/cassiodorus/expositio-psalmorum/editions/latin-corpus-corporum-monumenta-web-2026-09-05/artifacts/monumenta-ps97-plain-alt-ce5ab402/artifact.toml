notes = "A SECOND DELIVERY OF THE SAME SUPPRESSED-APPARATUS PAGE FOR PSALM 97, fetched by a different lane at a URL carrying the same parameters in a different order. It is separate bytes and a separate artifact because the page echoes its own query string, in that order, inside every link it prints; the byte size is identical to the sibling delivery and the difference is confined to those echoed hrefs. THIS WAS CHECKED AND NOT ASSUMED: the same extraction run over both deliveries yields byte-identical Latin, so this delivery witnesses no word the sibling does not. Extent as measured by the retrieving lane: Complete monumenta.ch delivery of pars 2, Psalm 97, one HTML document, title 'Cassiodorus, Expositio in Psalterium, 2,   97'; includes the lemma of v. 1, which is the whole Alleluia. Not a facsimile; no PL 70 column marker. ACCESS LIMITATION. The host's HTML is not retained, for the reason in `rights_basis`; the Latin is open offline at artifact.cassiodorus.expositio-psalmorum.latin-corpus-corporum-monumenta-web-2026-09-05.monumenta-ps97-apparatus-latin-text."
