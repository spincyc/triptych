rights_basis = "Cassiodorus wrote in the sixth century and the Latin printed inside these bytes is in the public domain everywhere; The nineteenth-century Latin printing the Corpus Corporum transcription descends from is Migne's Patrologia Latina 70, and it is out of United States copyright whichever state of Migne's series it is: the series was printed between 1844 and 1866 and a work first published abroad before 1931 is out of United States copyright. WHICH PRINTING IS NOT ESTABLISHED HERE -- these pages carry no PL 70 column marker anywhere and name no edition -- and nothing in this basis turns on it. THE HOST'S LAYER IS WHAT IS NOT SETTLED, and it was read rather than assumed: the whole page was searched case-insensitively with runs of non-alphanumeric characters collapsed for \"copyright\", \"licen\", \"rights\", \"recht\", \"urheber\", \"creative\" and \"impressum\", and every one returns zero. The page therefore states no terms of any kind, and silence is not a grant: `tracked` requires an affirmative recorded distribution basis and none exists for monumenta.ch's own HTML, its generated Google-Translate links, its per-sectio anchors and its tooltip scripts. So the exact delivery is hashed and recorded and not retained, and the Latin alone is retained as the derivative named in `notes`, under its own basis. This is the treatment already settled here for a host whose presentation is the whole of the encumbrance."
