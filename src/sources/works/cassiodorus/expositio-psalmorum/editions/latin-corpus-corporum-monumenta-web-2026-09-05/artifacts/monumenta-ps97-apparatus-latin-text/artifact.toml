notes = "Cassiodorus's whole exposition of Vulgate Psalm 97 (in Psalmum XCVII), from the psalm title through the conclusio psalmi, 17 LF-terminated lines, one per sectio, each beginning with the host's own sectio number. It carries Migne's marginal verse numerals in the form \"(Vers. 1.)\" and his manuscript variants in square brackets, because it is derived from the apparatus delivery. This is a transcription of a transcription and not a critical text: a claim about what Migne or Adriaen printed cannot be settled on it. A raw-line search here runs over one sectio at a time, which is the unit the host divides by, and a sectio can be a long paragraph."
