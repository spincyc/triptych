transformation = "Deterministic, offline, and no source text passed through a language model. Over the exact parent bytes: split the page into <tr> rows; keep only a row whose first cell carries the host's own sectio anchor, <a name=\"N\" class=\"satznummer\">, and discard the interleaved rows whose only content is the host's \"Translate this sectio\" link (class=\"tinytext\"); take that row's second <td>, drop every remaining tag, decode HTML entities, normalise to NFC, collapse runs of whitespace, and emit one LF-terminated UTF-8 line per sectio beginning with the host's own sectio number and a tab. The script refuses to write an empty file if no numbered sectio row is found. This is a normalisation and not a facsimile: Migne's printed columns, line breaks and typography are not recoverable from it, and the sectio numbering is the host's own division and not Migne's or Cassiodorus's."
