notes = "A dated web state of a public-domain Latin transcription, not a critical edition and not a collation against Migne's printed column. THIS IS NOT A SECOND IDENTITY FOR AN EXISTING RECORD: edition.cassiodorus.expositio-psalmorum.latin-corpus-corporum-monumenta-web-2026-09-05 and ...-2026-07-28 are the same host and the same transcription in earlier dated states, holding Psalms 39, 70, 85, 97 and 101 and Psalm 64 respectively; a new dated state is a new edition on this work because the bytes a URL serves change, and the states remain readable side by side. WHAT THIS STATE ADDS: Psalm 95 (pars 2) and Psalm 121 (pars 3), which no earlier state of this work holds and which the 1962 Eighteenth Sunday after Pentecost appoints as its Communion and its Gradual. ADDRESSING RULE, carried over from the 2026-09-05 record and re-confirmed by fetching: each psalm is reached at a rumpfid of the form \"Cassiodorus, Expositio in Psalterium, <pars>, <psalm number right-justified in five characters>\", Psalms 51-100 standing in pars 2 and Psalms 101-150 in pars 3. STABILITY MEASURED, NOT ASSUMED: the Psalm 101 apparatus delivery registered under the 2026-09-05 edition was re-fetched on 2026-09-22 and returned bytes whose SHA-256 and byte size matched that record exactly (ac7c0acd..., 126,124 bytes), and the tracked Latin derivative re-derived from them reproduced the registered derivative byte for byte (bed53e26...). That is evidence this host's Cassiodorus delivery did not change between the two dates; it is not a claim that the two editions are one, and the separate dated identity is kept for that reason. TWO VIEWS OF EACH PSALM: the same page is served at hide_apparatus=1 and at hide_apparatus=0. Only the second, fuller view is registered here -- it adds Migne's marginal verse numerals to each lemma and his manuscript variants in square brackets -- and the suppressed-apparatus view was not retrieved in this state. The pages carry no PL 70 column marker anywhere and state no licence, notice or condition of any kind. PAIRING: no English edition of the Expositio psalmorum was sought or retrieved in this run, and none is registered on this work."
