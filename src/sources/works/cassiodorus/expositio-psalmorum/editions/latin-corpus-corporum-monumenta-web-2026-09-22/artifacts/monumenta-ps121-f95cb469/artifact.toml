notes = "Cassiodorus on Vulgate Psalm 121 (in Psalmum CXXI), pars 3, in the host's APPARATUS state (hide_apparatus=0), the fuller of the two views this source offers: it prints Migne's marginal verse numerals over each lemma and his manuscript variants in square brackets. EXTENT, measured over the retained response before it was discarded: the complete exposition from the psalm title through the conclusio psalmi, 16 numbered sectiones, which is the unit the host divides by. The 1962 Eighteenth Sunday after Pentecost appoints Ps 121:1 twice, as its Introit verse and as its Gradual respond, and Ps 121:7 as its Gradual verse; those stand at the host's sectiones 6 and 12. ACCESS LIMITATION. What is not retained is monumenta.ch's own HTML delivery -- its markup, its generated Google-Translate links, its per-sectio anchors and its tooltip scripts -- and it is not retained because the page states no terms at all and `tracked` requires an affirmative basis. What a reader without the network can open instead is the whole Latin of this same page, apparatus and verse numerals included, retained at artifact.cassiodorus.expositio-psalmorum.latin-corpus-corporum-monumenta-web-2026-09-22.monumenta-ps121-apparatus-latin-text."
