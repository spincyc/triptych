transformation = "Deterministic, offline, and no source text passed through a language model. Over the exact parent bytes: split the page into <tr> rows; keep only a row whose first cell carries the host's own sectio anchor, <a name=\"N\" class=\"satznummer\">; take that row's second <td>, replace every remaining tag with a single space, decode HTML entities, normalise to NFC, collapse runs of whitespace, and emit one LF-terminated UTF-8 line per sectio beginning with the host's own sectio number and a tab. The script refuses to write an empty file if no numbered sectio row is found. THE TRANSFORMATION WAS VERIFIED BEFORE IT WAS USED HERE, not merely described: run over the re-fetched Psalm 101 apparatus delivery of the 2026-09-05 edition (SHA-256 ac7c0acd..., matched), it reproduced that edition's registered Latin derivative byte for byte (SHA-256 bed53e26...), so these bytes stand in the same relation to their parent as that record's do to theirs. This is a normalisation and not a facsimile: Migne's printed columns, line breaks and typography are not recoverable from it, and the sectio numbering is the host's own division and not Migne's or Cassiodorus's."
