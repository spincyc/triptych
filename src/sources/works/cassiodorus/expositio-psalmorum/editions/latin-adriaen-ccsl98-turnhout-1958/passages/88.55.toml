context = "Cassiodorus first restores the clause's word order, then explains that God's servants incurred reproach when idol-devoted gentiles treated being Christian as a crime and judged adherents of the new worship worthy of persecution. He reads their holding it 'in the bosom' as bearing the reproach secretly in the mind because they feared to speak openly, for doing so marked them out for death."
verified_on = "2026-08-21"
notes = "Read directly in Adriaen, CCSL 98, printed p. 819, lines 695-706, artifact PDF p. 178. The supplied lines 695-705 stop after 'quia palam'; line 706 completes the sentence ('timebant loqui, unde probabantur exstingui'). Corpus Corporum numbers this electronic local unit as §55; Adriaen's printed bold heading is verse 51. The passage supports Cassiodorus's Christian-persecution reception of Psalm 88:51, not the Psalm's composition date, original historical referent, or a claim about liturgical compiler intent."
