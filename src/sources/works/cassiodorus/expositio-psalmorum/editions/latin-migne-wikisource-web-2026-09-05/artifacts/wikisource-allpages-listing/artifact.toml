notes = "THE RECEIPT THAT FIXES THIS ROUTE'S EXTENT, and the reason it is retained rather than left remote: a bounded negative that a reader cannot replay is not a bounded negative. Extent as measured by the retrieving lane: Complete unpaginated allpages listing for the prefix, 34 titles and no continuation token, which is the whole of what Latin Wikisource holds under Expositio in Psalterium: the work page, a disambiguating title, an introduction, one page numbered I, and Psalms 1 through 30. None of Psalms 39, 70, 85, 97 or 101 is present, which is the bound this receipt fixes. Read off these exact bytes: 34 titles, no \"continue\" key, the highest psalm number 30. The listing states the extent of Latin Wikisource's transcription on 2026-09-05 and nothing about any other route or any other date."
