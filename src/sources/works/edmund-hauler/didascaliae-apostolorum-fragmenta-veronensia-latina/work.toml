description = "Hauler's edition of the Latin fragments of the Verona palimpsest LV(53), printing the Latin Didascalia together with the surviving Latin of the church order conventionally called the Apostolic Tradition or Traditio apostolica. The anaphora at the editor's chapters LXIX-LXX is the oldest surviving Latin text of that prayer and is the witness on which comparisons with the postconciliar second Eucharistic Prayer rest. Authorship, date, place, and redactional history of the underlying church order are disputed and this record takes no position on them."
