context = "Read visually at the page image. The page continues and completes the anaphora: '... calcet et iustos inluminet et terminum figat et resurrectionem manifestet, accipiens panem gratias tibi agens dixit: Accipite, manducate: hoc est corpus meum, quod pro vobis confringetur. Similiter et calicem dicens: Hic est sanguis meus, qui pro vobis effunditur; quando hoc facitis, meam commemorationem facitis. Memores igitur mortis et resurrectionis eius offerimus tibi panem et calicem gratias tibi agentes, quia nos dignos habuisti adstare coram te et tibi ministrare. Et petimus, ut mittas spiritum tuum sanctum in oblationem sanctae ecclesiae; in unum congregans des omnibus, qui percipiunt, sanctis in repletionem spiritus sancti ad confirmationem fidei in veritate, ut te laudemus et glorificemus per puerum tuum Iesum Christum, per quem tibi gloria et honor, patri et filio cum sancto spiritu, in sancta ecclesia tua et nunc et in saecula saeculorum. Amen.'"
verified_on = "2026-07-25"
notes = "The anaphora as printed has no Sanctus and no intercessions. That absence is a fact about this witness and about the reconstruction of the church order, not about any later rite. This passage witnesses the Latin text; it does not settle the authorship, date, or provenance of the underlying work."
