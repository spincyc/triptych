context = "Read visually at the page image. The page carries the eucharistic dialogue in the form 'Dominus vobiscum' / 'Et cum spiritu tuo'; 'Susum corda' / 'Habemus ad dominum'; 'Gratias agamus domino' / 'Dignum et iustum est'; and then the opening of the anaphora: 'Gratias tibi referimus, Deus, per dilectum puerum tuum Iesum Christum, quem in ultimis temporibus misisti nobis salvatorem et redemptorem et angelum voluntatis tuae; qui est verbum tuum inseparabilem, per quem omnia fecisti et bene placitum tibi fuit; misisti de caelo in matricem virginis, quique in utero habitus incarnatus est et filius tibi ostensus est ex spiritu sancto et virgine natus; qui voluntatem tuam conplens et populum sanctum tibi adquirens extendit manus, cum pateretur, ut a passione liberaret eos, qui in te crediderunt; qui cumque traderetur voluntariae passioni, ut mortem soluat et vincula diaboli dirumpat et infernum ...'"
verified_on = "2026-07-25"
notes = "The apparatus on the same page records that the manuscript reads 'extendis' where the text prints 'extendit', with the correction attributed to Hammond and Rahmani and the German of Achelis cited. This passage witnesses the Latin of the church order conventionally called the Apostolic Tradition; it does not settle that work's authorship, date, or provenance, all of which remain disputed."
