notes = "Cited here by printed page. Hauler prints the palimpsest text with expanded abbreviations in parentheses, editorial supplements in square brackets, marginal folio and quire references, and a critical apparatus at the foot of each page recording the manuscript readings he corrected. The apparatus at p. 106 records that the manuscript reads extendis where the text prints extendit, and it cites Achelis, Hammond, and Rahmani for that correction."
