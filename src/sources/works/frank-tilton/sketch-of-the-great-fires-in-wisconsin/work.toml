title = "Sketch of the Great Fires in Wisconsin at Peshtigo, the Sugar Bush, Menekaune, Williamsonville, and Generally on the Shores of Green Bay"
responsible = "Frank Tilton"
work_type = "contemporary-compilation"
languages = ["en"]
description = "A compilation of accounts, casualty lists, and relief subscriptions for the Wisconsin firestorms of the night of 8 October 1871, published at Green Bay by Robinson & Kustermann in 1871 with proceeds going to the sufferers. Chapter XIV covers the east shore of Green Bay and names Robinsonville among 'the largest settlements destroyed in this track of fire'; it records no exception there. A folded map of the burnt district accompanies the volume. The nearest contemporary record against which the Champion preservation tradition can be tested."
