publication = "A modern reset reproduction of the Green Bay 1871 imprint, digitized and uploaded to the Internet Archive in 2022, identifier sketch-of-the-great-fires-in-wisconsin (100 pages; OCR text and page images), retrieved 2026-07-25"
date = "2022"
notes = "Not a facsimile. The item reproduces the 1871 title page typographically and includes the 1871 map of the burnt district as a plate, but the body is modern typesetting, so readings cannot be assigned to the 1871 compositor. Public domain in text (1871 imprint). One textual crux recorded: at chapter XIV this copy prints 'On the night of October 3d' for the east-shore firestorm, contradicting its own preface and map, which give 8 October 1871; the reading was verified on the page image and the error cannot be located to a compositor. The 1871 Green Bay imprint was not reached. Exact scan bytes not retained."
