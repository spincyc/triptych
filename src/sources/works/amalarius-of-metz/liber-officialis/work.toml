description = "Amalarius of Metz's allegorical exposition of the offices and the Mass in four books, printed by Migne under the title De ecclesiasticis officiis. Book III, chapter XL treats the Advent of the Lord: the five-week reckoning of the old lectionaries and the four weeks of the Missal 'qui vocatur Gregorialis', and the omission of the Gloria in excelsis in Advent that Amalarius says he had seen. Its composition date is not established in this registration and is not recorded."
