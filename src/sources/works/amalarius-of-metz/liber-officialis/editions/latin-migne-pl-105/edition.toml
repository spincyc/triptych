notes = "The constituent as Migne prints it; the running head of the pages read is 'DE ECCLESIASTICIS OFFICIIS LIBRI IV. — LIB. III.' (cols. 1157-1158). Registered on 2026-11-18 by acquisition lane A3 because the volume's complete text layer is filed under another constituent, artifact.amalarius-of-metz.liber-de-ordine-antiphonarii.latin-migne-pl-105.ia-djvu-ocr-f6438466, and a derivative must stay inside its own edition: this edition therefore holds its own page images of the leaves read. The printing year of the scanned copy is not established here and is not asserted, as the sibling edition latin-migne-pl-105 of the Liber de ordine antiphonarii likewise records. Aliases searched before creating this work: 'Liber officialis', 'De ecclesiasticis officiis', 'amalarius' across src/sources/works; only the Liber de ordine antiphonarii was held."
