context = "Liber officialis III.40: Amalarius reports having seen, in former time, the Gloria in excelsis Deo omitted on the days of Advent and in some places the dalmatics, and gives the reason (to signify the time of the Old Testament). PL 105 col. 1159, left column of leaf n585. The chapter goes on to say that the hymn, intermitted for a time, is taken up more eagerly when it returns on the night of the Nativity."
