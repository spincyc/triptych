context = "The contents page of Migne's volume CV is headed TRADITIO CATHOLICA. SAECULUM IX. ANNI 821-836. ELENCHUS AUCTORUM ET OPERUM QUI IN HOC TOMO CV CONTINENTUR. Its last entry, at the foot of the right column, is AMALARIUS PRESBYTER METENSIS ET CHOREPISCOPUS, with five works: Forma institutionis canonicorum et sanctimonialium canonice viventium, De ecclesiasticis officiis libri quatuor, De ordine antiphonarii, Eclogae de officio missae and Epistolae. So Migne files Amalarius, priest and chorbishop of Metz, among the ninth-century writers of the years 821-836. Read on the page image at full and half resolution."
notes = "advent-pc-fix2. The column numbers beside the entries are not asserted here: in this face the final 3 and 5 are hard to tell apart. The heading's period, 821-836, is Migne's grouping for the volume, not a date of Amalarius's life."
