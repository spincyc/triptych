notes = "Registered on the pattern this library already uses for a constituent of a Migne volume: the edition is the constituent as Migne prints it, and the artifacts are the Internet Archive's derivatives of the whole volume, which is the narrowest exact witness that was actually retrieved. The printing year of the scanned copy is not established and is not asserted: the Patrologia Latina volumes were reissued repeatedly and this copy's front matter, read in the retained text layer, gives the imprint line but no legible year. The Liber de ordine antiphonarii stands at columns 1243-1316; chapter LXXIII, read for this run, is at columns 1309-1310."
