description = "Amalarius of Metz's account of the arrangement of the antiphoner, written after his consultation of the Roman books. Chapter LXXIII sets out the September reading and chant course: this run reads it for the assignment of the historiae, where Amalarius gives Job the first three weeks of the month and Tobias the fourth. The composition date is not established in this registration and is therefore not recorded."
