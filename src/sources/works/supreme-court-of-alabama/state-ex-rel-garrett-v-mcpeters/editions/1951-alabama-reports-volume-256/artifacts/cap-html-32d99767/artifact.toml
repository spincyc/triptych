notes = "Extent as the retrieving lane measured it: Complete case, State ex rel. Garrett v. McPeters, 256 Ala. 555-559: the per curiam judgment, Brown J.'s dissent in full, and the opinion on rehearing, with star page markers through the passage at *556. READ THE DISSENT AND THE JUDGMENT APART. The per curiam majority ousted the sheriff; Brown J., dissenting, casts the convicted sheriff as the victim. An entry presenting that figure as the court's own holding misdescribes the case, and the retrieving lane says so expressly."
