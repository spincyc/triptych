description = "A modern-English revision of the American Standard Version of 1901, made and dedicated to the public domain by eBible.org under the editorship of Michael Paul Johnson. eBible.org states the textual basis on its own FAQ: the revision follows the ASV translators' decisions except where the Elizabethan English is unclear or a major variant exists, and there it consults the Biblia Hebraica Stuttgartensia in the Old Testament and the Byzantine Majority Text, referencing both the Robinson-Pierpont and Hodges-Farstad editions, in the New. The deuterocanonical books are translated from the Greek. It is not a Vulgate translation and does not witness the Latin the 1962 Missal prints; it is registered here because it is the only modern-English text of the whole Catholic canon this library can lawfully redistribute. Edition records must keep the published variants apart, because their wording and their book sets differ: the classic ecumenical WEB, which prints \"Yahweh\" for the Tetragrammaton and puts the deuterocanon in a section of its own between the Testaments; the World English Bible Update (WEBU), identical except that it prints \"LORD\"; the British Edition (WEBBE); the Protestant subsets of 66 books; and the Catholic Edition (WEBC), a subset of the Update carrying the traditional Catholic book set in the Catholic order. A locus is BookToken.chapter.verse, optionally with a closing verse or chapter.verse after a hyphen. Chapter and verse numbers are the Hebrew and Greek ones, never the Vulgate numbers the 1962 Missal cites: psalm numbers follow the Masoretic series, so Ps 54 here is Ps 53 in the Missal, and this translation leaves a psalm's inscription unnumbered where the Vulgate counts it as verse 1. The book tokens, the names they answer to, and the naming traps are registered in the book index of each edition."
