notes = "The only modern-English witness of the whole Catholic canon this library holds, and the only one it may lawfully redistribute. eBible.org describes this edition as a subset of the World English Bible Update carrying the traditional Catholic book set and book order; it therefore prints \"LORD\" for the Tetragrammaton where the classic World English Bible prints \"Yahweh\". It carries exactly the 73 books fixed at Trent, in the Douay-Rheims order, and its chapter counts agree with the Douay-Rheims registered in this library everywhere but Esther. Three things about it must not be lost in reuse. First, it is not a Vulgate translation. Its Old Testament follows the Biblia Hebraica Stuttgartensia, its New Testament the Byzantine Majority Text, and its deuterocanon the Greek, so it can never be used to check a Latin proper, a chant incipit, or a reading of the 1962 Missal; those belong to the Clementine and Douay-Rheims editions registered here. Second, its psalter is Masoretic and not any Latin recension, its psalm numbers are the Hebrew ones, and it prints a psalm's inscription as an unnumbered heading, so its verse numbers run one or two lower through the body of most psalms than the numbers a title-numbering calendar prints. Third, four books are not addressable by Vulgate numbers even though they are the same books. Esther is translated whole from the Greek and its five additions are merged into the Hebrew chapter numbering as extensions of 1:1 and of 3:13, 4:17, 8:12 and 10:3, so this Esther has ten chapters and the Vulgate's Esther 11-16 do not exist here at all: the 1962 Missal's Esther 13:9-11 and 14:12-13 find no chapter and refuse. Daniel is printed with its Greek portions in the Vulgate's fourteen chapters, the Prayer of Azarias and the Canticle of the Three Children inside chapter 3 and Susanna and Bel as chapters 13 and 14, but it divides the additions as the Greek does and not as the Vulgate does, 97 verses in chapter 3 against 100 and 64 in chapter 13 against 65, by no uniform offset. Ecclesiasticus follows the Greek division throughout, 1359 verses against the Douay-Rheims's 1591, which is why a postconciliar citation of Sirach addresses this edition correctly and a 1962 citation of Ecclesiasticus does not. And Baruch, which has the same 213 verses as the Douay-Rheims, ends chapter 3 at verse 37 where the Vulgate ends it at 38, so the Vulgate's \"Afterwards he was seen upon earth, and conversed with men\" stands here as 3:37. Tobit and Judith likewise follow the Greek division, 244 and 339 verses against the Vulgate's 298 and 345. Nothing was renumbered to conceal any of this; the loci that would otherwise resolve to the wrong words are withheld in the verse-alias table registered under this edition, and the rest are recorded book by book in its book index. NUMBERING WARNING, and it is the most consequential thing on this record. Outside the psalter, tools/index-bible resolves a citation against this edition using the chapter and verse numbers the calendar printed, with no conversion, because it holds no book-by-book concordance between the Vulgate's numbering and the Greek and Hebrew numbering this edition follows. The two do not always agree, and where they do not a 1962 Missal citation resolves here to a neighbouring verse instead of refusing. The chapters where they were measured to disagree, comparing every verse of this edition against the Douay-Rheims Challoner verse of the same number on 2026-07-31, are: 1 Thessalonians 4, 2 Thessalonians 2, Acts 7 and 14, Amos 6, Baruch 3, Daniel 3 and 14, Ecclesiasticus 3, 15, 24, 27, 28, 35 and 36, John 6, Mark 9, Matthew 17, Numbers 20, Osee 14, and Wisdom 6 and 11. That measurement is a machine comparison of wording and is a lead, not a verified verse-for-verse table; only the Daniel and Ecclesiasticus divergences named above were checked by reading, and only those are withheld in the verse-alias table. The same divergence affects every edition in this library that numbers from the Greek and the Hebrew, the King James Version included, and it is a property of the indexing machinery rather than of this text. Until a per-calendar mechanism exists, a consumer resolving a Vulgate-numbered citation in one of those chapters must check the verse against the Clementine Vulgate or the Douay-Rheims registered here before relying on it."
