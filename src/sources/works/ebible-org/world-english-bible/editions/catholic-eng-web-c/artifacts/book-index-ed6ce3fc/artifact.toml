notes = "73 books: 46 Old Testament and 27 New Testament, the Catholic canon fixed at Trent, in the Douay-Rheims order. Every book's chapter count agrees with the Douay-Rheims registered in this library, Daniel's fourteen and Esther's ten excepted — Esther is the Greek book merged into the Hebrew chapter numbering and has ten chapters where the Vulgate has sixteen. The note column records every book whose verse division differs from the Douay-Rheims."
