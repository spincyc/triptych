provenance = "Compiled by Triptych on 2026-07-31 from the eBible.org eng-web-c release. Each USFM file was matched to its row by book code and its chapter and verse counts read from the extracted text. The token, ordinal, file name and Douay-Rheims title are those of the Douay-Rheims Challoner book index, because this edition carries the same 73 books of the Catholic canon in the same order, so a citation resolves to the same token in either; the edition title and the counts are this release's own. Two codes were mapped by judgment and not mechanically: ESG is this edition's Esther and DAG is its Daniel, and each row records what that costs a Vulgate-numbered citation."
