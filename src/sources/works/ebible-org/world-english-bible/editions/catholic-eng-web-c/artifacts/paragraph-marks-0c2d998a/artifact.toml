transformation = "Read the same eBible.org eng-web-c USFM package the verse text was derived from, re-fetched on 2026-08-01 and hashed to the recorded sha256 d4901f9f788d1ea1b15bf1477f44f3518b3d7e8a064d5a0e67c2297613f1a08e before anything was read from it. Walk each book file keeping \\c for the chapter and \\v for the verse, and record the verse that follows every paragraph-level marker. Emit one row per such verse; a marker standing at verse 1 is not emitted, because a chapter always opens a paragraph. The marker column keeps the marker itself. \\b is never a break: USFM defines it as additional white space between things already divided, and the marker that follows it is what opens; this release carries 1069 of them and they sit almost entirely between poetic stanzas. \\nb is the opposite of a break and is likewise not emitted. The kind column is poetry where the marker is one of \\q \\qm \\qc \\qr, because those are lines of verse and not paragraphs, and prose where it is one of \\p \\m \\pi \\pc \\pr \\pm \\pmo \\pmc \\pmr \\cls \\li \\mi \\ph. No book of this release is classified verse-per-paragraph: the test applied to every witness is whether a book's prose markers stand at more than half its verses, and the highest book here is Ruth at 0.412. The printed column is empty throughout, because this edition's source prints no paragraph mark of its own — it has only the transcriber's markers. Leaving the column out would have made the King James table's printed column look like a property of the format rather than a fact about that edition. Book identity is taken from the usfm column the verse-text artifacts of this edition already carry, which is a declared mapping and not an inferred one. 24 marks stood at a verse number this edition's tracked verse text does not carry — the source joins those verses under a combined \\v marker — and were dropped rather than attached to a neighbouring verse; the count is stated here because a silently relocated paragraph break is exactly the kind of plausible wrong answer this library refuses."
