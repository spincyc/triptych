rights_basis = "eBible.org dedicates the World English Bible to the public domain: \"The World English Bible is in the Public Domain. That means that it is not copyrighted.\" The only stated condition is a trademark one and not a copyright one: \"World English Bible\" is a trademark of eBible.org, and a changed text may not be called the World English Bible. That condition is not engaged here, because this table carries no text to change: it is a list of verse numbers at which a paragraph opens, derived from the same release the verse text was derived from, and it is registered under the same notice as the text it describes. eBible.org asserts no separate claim over the paragraph structure of any of its releases; its notices cover each work undifferentiated."
