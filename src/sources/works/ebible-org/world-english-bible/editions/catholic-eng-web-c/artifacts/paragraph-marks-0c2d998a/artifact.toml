notes = "15737 rows across 73 books: 7327 prose paragraph openings and 8410 poetry line openings. Only the prose rows are paragraph evidence. This edition sets far more poetry than the King James does, which is why its poetry rows outnumber its prose ones. Its paragraphing is not independent of the other English witnesses: the World English Bible is a revision of the American Standard Version of 1901, which descends from the Revised Version, so its divisions carry that lineage — eBible.org states the ASV basis and documents no separate paragraphing decision. Whether the descent is unmodified is not documented either way. This table describes where paragraphs open; it does not describe the text, and the verse files it accompanies are unchanged by it."
