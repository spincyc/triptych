notes = "Exodus (Ex): 40 chapters and 1213 verses, one LF-terminated line per verse after a header line. Chapter and verse numbers are this edition's own, which are the Hebrew and Greek ones, not the Vulgate numbers the 1962 Missal cites; the book index records where the two differ."
