provenance = "Created by Triptych on 2026-07-31 and rewritten the same day when the deuterocanonical numbering was compiled verse by verse. Rows are derived, not written: `python3 scripts/_deuterocanon.py <edition>` expands the tracked deuterocanon numbering concordance against this edition's own verse text, and tools/tests/test_deuterocanon.py fails if the tracked rows and the derivation disagree. The concordance is validated when it loads, against the verses it was compiled from: no chapter ceiling appears anywhere in it, and every row records the opening words of each run and is refused if the witness no longer prints them. This edition prints a third arrangement of these books and not a departure from either other: the Greek divisions, addressed as the Greek Daniel and Esther address them. Its Daniel 13 is Susanna and ends at 64 where the Vulgate's ends at 65, and its Daniel 14 is Bel and runs one verse ahead of the Vulgate's from beginning to end, so Vulgate 14:27 is here 14:28 and Vulgate 14:42 is not here at all. That shift had no row until now and a citation of Daniel 14:27 returned the wrong verse in silence. Inside Daniel 3 the Canticle stands at the Greek's numbers: Vulgate 3:53 is here 3:54, 3:54 is here 3:56, 3:58 is here 3:60, 3:77 is here 3:78, and the two realign at 3:79. The earlier blanket withholding of Vulgate 3:52-78 is replaced by the correspondences themselves, which were read against the Revised Version and the King James; only Vulgate 3:52, which is two Greek verses, and 3:67 and 3:69 still refuse. Those two refuse because this edition prints one couplet of cold where the Greek prints two, its 3:71 reading 'cold and heat', and nothing in the tracked text settles which of the Greek's 45 and 49 that is. Vulgate 3:98-100 is this edition's 4:1-3 and its chapter 4 runs three verses behind. In Esther this edition sets Mardochai's prayer and Esther's at their narrative place, so Vulgate 13:8-18 is here 4:18-28 and Vulgate 14:1-19 is here 4:29-47, and the colophon of Vulgate 11:1 closes the book at 10:14. Those rows are tracked and cannot fire yet: index-bible resolves the book before the chapter, so a citation of Esther 13 reaches token Esth, finds no chapter 13, and refuses first; see guidance/versification.md section 7.9. The remaining additions are withheld because this edition compresses each into a single verse of its host chapter, the whole of addition A inside its 1:1, addition B inside 3:13, addition D inside 5:1 and 5:2, addition E inside 8:13, so no number here addresses a verse of them. Ecclesiasticus is withheld whole but for 36:18, the introit Da pacem Domine sustinentibus te, which is this edition's 36:16: the Vulgate and the Greek divide that book differently in all fifty-one chapters, only 412 of the Douay's 1591 verses stand at the same number in this edition's 1359, and the difference is mostly the Latin subdividing a Greek bicolon. Two divergences outside these three books are recorded in the book index rather than here because no alias can reach them: Romans 16:25-27, which the Byzantine text this edition follows puts at 14:24-26; and Baruch 3, which runs one verse behind the Vulgate from 3:35 to the end of the chapter and is left unaliased deliberately, because the only reading either calendar makes of it is the Easter Vigil's Baruch 3:9-15, 32-4:4, whose range covers the same words under either numbering."
