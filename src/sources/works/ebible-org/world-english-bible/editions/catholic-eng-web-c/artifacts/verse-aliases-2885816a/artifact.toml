provenance = "Created by Triptych on 2026-07-31 from the extracted text of this edition, read against the Douay-Rheims verse of the same number. Rows are of two kinds. A renumbered row records a verse this edition carries under a different number, and there is one: the Vulgate's Ecclesiasticus 36:18, which both tracked calendars cite for the introit Da pacem Domine, is this edition's 36:16, and its own 36:18 is a proverb about food. That one was resolved rather than withheld because the verse was identified by reading it, not inferred from an offset. A not-in-this-edition row records a locus a citation may name that this edition cannot answer at those numbers, and resolves to nothing: the edition prints real text there and a lookup would otherwise return it. Twenty-seven such rows cover Daniel 3:52-78. That is the span of the Canticle of the Three Children where this edition's Greek numbering and the Vulgate's do not correspond, established verse by verse: the Vulgate's 3:53 is here 3:54, its 3:54 is here 3:56, its 3:57 is here 3:58, its 3:77 is not here 3:77, and the two realign at 3:79 and stay aligned to the end of the chapter. A few verses inside that span do fall at the same number in both, and they are withheld with the rest, because keeping them would assert a verse-for-verse correspondence for their neighbours that has not been established against a Greek witness this library does not hold. No row of a third kind is needed, because this edition merges no verse away: where its source prints a bridged range such as Ecclesiasticus 19:18-19, the range carries only an editorial note saying the verses are omitted by the best authorities, so those numbers are absent from the text rather than merged into a neighbour, and a citation of them refuses for want of the verse. Four further divergences are recorded in the book index rather than here because no alias can reach them. Daniel 3:98-100 and Romans 16:25-27 fall past the end of the chapters this edition prints — the Greek numbers the first as Daniel 4:1-3, and the Byzantine text this edition follows puts the Roman doxology at 14:24-26 — and a locus past a chapter's last verse is refused before any alias is consulted. Esther has ten chapters where the Vulgate has sixteen, so the Vulgate's Esther 11-16 find no chapter. And Baruch 3 runs one verse behind the Vulgate from 3:35 to the end of the chapter, which is 3:37 here and 3:38 there; that shift is left unaliased deliberately, because the only reading either calendar makes of it is the Easter Vigil's Baruch 3:9-15, 32-4:4, whose range covers the same words under either numbering, and rows for the single verses would break it."
