context = "Paraphrase. n. 5: placing the mountains, streams, sheep and shepherds in the crib recalls that, as the prophets foretold, all creation rejoices at the Messiah's coming, and the angels and the star call us too to go to the cave and adore. On the shepherds' words to one another (Luke 2:15, let us go over to Bethlehem), the Pope observes that, unlike the many who are busy about many things, the shepherds are the first to see what matters most, the gift of salvation: it is the lowly and the poor who welcome the Incarnation, and they answer the God who comes to meet them in the Child by going out to meet him with love, gratitude and awe. n. 6, first paragraph: among the figures commonly added, beggars and those whose only wealth is of the heart have every right to come close to the Child; no one may turn them away from a crib so poor that the poor are at home in it; the poor have a privileged place in this mystery and are often the first to recognize that God is among us. Restricted: paraphrase only."
notes = "Read on the hashed 2026-11-26 English delivery. The rest of n. 6 (Herod's palace, the revolution of tenderness, the everyday figures) is outside this locus."
