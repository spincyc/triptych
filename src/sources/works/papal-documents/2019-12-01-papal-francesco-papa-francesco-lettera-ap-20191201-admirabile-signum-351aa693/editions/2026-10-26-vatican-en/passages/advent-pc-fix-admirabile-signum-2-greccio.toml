context = "Paraphrase. The Pope places the first crib at Greccio, a small Italian town near Rieti. Francis probably stopped there on his way back from Rome, where Pope Honorius III had confirmed his Rule on 29 November 1223; he had been to the Holy Land, and Greccio's caves recalled the country round Bethlehem; the Pope adds that Francis may also have been moved by the nativity mosaics of St Mary Major in Rome, near the place where by ancient tradition boards of the manger are kept. Following the Franciscan Sources, the letter recounts that some fifteen days before Christmas Francis asked a local man named John to make ready, because he wished to see with his own eyes how the newborn Child had lain in want in a manger, on hay, between an ox and an ass. On 25 December friars and country people came with flowers and torches; Francis found a manger with hay, an ox and a donkey; all present felt a new joy; a priest celebrated Mass over the manger, which the Pope reads as showing the bond between the Incarnation and the Eucharist. There were no statues: those present enacted and lived the scene, and the Pope says this is how the tradition began. From Thomas of Celano, Francis's first biographer, he reports that one of those present saw the Child Jesus himself lying in the manger, and that everyone went home joyful from that Christmas of 1223. Notes [1]-[3] cite Celano, First Life 84-86 (Franciscan Sources 469-470). Restricted: paraphrase only."
notes = "The first two paragraphs of n. 2 (the crib's roots in Luke 2:7, presepe from praesepium, hay as the first bed of the bread from heaven, with Augustine, Sermon 189.4) are outside this locus. The letter's account of Greccio is the Pope's retelling of Celano, not a primary witness to 1223; a writer who needs Celano's own words needs a registered witness of the First Life."
