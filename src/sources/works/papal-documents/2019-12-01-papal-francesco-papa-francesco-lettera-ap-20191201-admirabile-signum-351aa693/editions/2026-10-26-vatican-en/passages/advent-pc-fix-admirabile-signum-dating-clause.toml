context = "After the last numbered section (n. 10) the letter is signed FRANCISCUS, and the dating clause states that it was given at Greccio, in the Shrine of the Nativity, on 1 December 2019, in the seventh year of his pontificate. The page title and description give the same date. The clause does not name the liturgical day; by computation 1 December 2019 was the First Sunday of Advent (Christmas 2019 fell on a Wednesday, so the four Sundays before it were 1, 8, 15 and 22 December). Restricted: paraphrase only; the English wording is not reproduced."
notes = "Read on the hashed 2026-11-26 English delivery. The Advent identification is a computation from the calendar, not a statement of the letter; the Latin, Italian and other language deliveries were not read."
