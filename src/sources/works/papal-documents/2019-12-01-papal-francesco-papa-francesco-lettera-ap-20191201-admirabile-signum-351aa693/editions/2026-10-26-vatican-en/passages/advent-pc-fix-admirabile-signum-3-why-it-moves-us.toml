context = "Paraphrase. By so plain a sign, the Pope says, Francis preached the Gospel powerfully, and Greccio remains a place of silence and refuge. He then asks why the crib stirs such wonder and moves us so much, and answers first that it shows the tenderness of God's love: the maker of the universe stooped to our smallness; in Jesus the Father gives us a brother who looks for us when we are lost and a faithful friend, a Son who forgives and frees us from sin. Setting up a crib at home helps us live again what happened at Bethlehem; the Gospels stay the source, but the scene helps us picture it and draws us into the history of salvation as if we were there. Since Greccio it has invited us to feel and touch the poverty the Son of God took on, and so to follow him on the road of humility, poverty and self-denial from the manger to the Cross, meeting and serving him in the neediest by works of mercy (Matthew 25:31-46). Restricted: paraphrase only."
