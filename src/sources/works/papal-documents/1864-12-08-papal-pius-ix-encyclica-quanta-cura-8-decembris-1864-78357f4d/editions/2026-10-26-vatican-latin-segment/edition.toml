notes = "Historical publication witness: Pii IX Acta, pars prima, volume III (Romae,1864), pp.687–700. Full facsimile http://www.documentacatholicaomnia.eu/01p/1846-1878,_SS_Pius_IX,_Pontificis_Maximi_acta_Pars_I_Vol_03,_LT.pdf, SHA-256 7ce7f56c91dfeea894474e2bb30be573eab1aab355cced00db5a3d4906f3123d, 21256700 bytes. Quanta printed 687–700 equals PDF 697–710; Syllabus printed 701–717 equals PDF 711–727. Matching Google Books record https://books.google.com/books?id=LENDAAAAcAAJ dates volume III to 1864. ASS 3 (1867) 160–167 explicitly abbreviates Quanta’s terminal Jubilee section; it cannot establish complete terminal wording. The full Acta witness supplies it. Raw delivery and normalized bytes are owned once by the composite container. This edition owns the constituent identity and segment only."
