description = "Related curial regulation under Pius X, dated 1908-09-29. Complete separately addressable historical regulation within the 1908 curial-reform package; not an independently signed papal apostolic constitution. Canonical ownership identifies this regulation separately from the constitutional main act. Complete Latin Ordo Servandus in sacris Congregationibus, Tribunalibus, Officiis Romanae Curiae - Normae peculiares including its original Latin annex where present; exact title/body ranges retained in original order. Modern linked contents, separate parallel Italian expression and modern bibliographic footer are excluded. This is a regulation component of the1908reformmaterials, not a claim of an independently signed papal constitution."
