context = "The 1874 Philadelphia title leaf prints the substantive recipient address, not repeated on body p.3: exact raw OCR LF14–15. This replacement includes those address lines and their adjacent blank lines LF16–17 before the unchanged complete former body selection LF38–856. It retains source notes, 21 November 1873 dating clause and PIUS PP. IX subscription. Native title/body proof pages were checked against the exact address bounds. The prior selector omitted this address and is superseded; prior source payloads remain unchanged. The offered OCR still fails to recognize the ornamental issuer heading and initial A, and garbles the gothic salutation; no English wording or OCR words are corrected. Anonymous historical human translation, examined by the Bishop of Philadelphia and published with his approbation."
