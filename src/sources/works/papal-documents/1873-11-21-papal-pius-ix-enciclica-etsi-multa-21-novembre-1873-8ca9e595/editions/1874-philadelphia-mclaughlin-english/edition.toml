notes = "Anonymous historical English translation, examined by the Bishop of Philadelphia and published with his approbation according to the title page. Printed pp.3–23 contain the complete papal body, source notes, 21 November 1873 dating clause and PIUS PP. IX subscription. All 21 native act pages and the title leaf were inspected; the full OCR was read. The ornamental PIUS PP. IX heading above the salutation and the initial ornamental A are not recognized by the offered OCR; the gothic salutation is garbled. These are disclosed OCR defects, not supplied from memory; all are retained in the native facsimile. No word-for-word collation or corrected text is claimed."
