notes = "{\"closing_physical_lines\": [26376, 26407], \"closing_text\": \"         D a t u m R o m a e a p u d S a n c t u m P e t r u m die 25 Maii, An. 1899,\\nPontificatus Nostri v i c e s i m o s e c u n d o .\\n\\n                                      LEO P P . XIII.\\n\\n\\n\\n            Ad Sacratissimum Cor Iesu formula consecrationis recitanda.\\n\\n       I e s u dulcissime, R e d e m p t o r h u m a n i g e n e r i s , respice n o s\\nad altare t u u m h u m i l l i m e provolutus. Tui s u m u s , tui e s s e v o -\\nl u m u s ; q u o a u t e m Tibi coniuncti f i r m i u s e s s e p o s s i m u s , e n\\nhodie Sacratissimo Cordi tuo se q u i s q u e n o s t r u m s p o n t e dedi-\\ncat. — Te q u i d e m multi n o v e r e n u m q u a m : T e , spretis m a n -\\ndatis tuis, multi repudiarunt. Miserere u t r o r u m q u e , benignis-\\ns i m e Iesu : atque ad s a n c t u m Cor t u u m rape u n i v e r s o s . R e x\\nesto, Domine, n e c fidelium tantum qui nullo t e m p o r e disces-\\ns e r e a Te, s e d etiam p r o d i g o r u m filiorum qui Te reliquerunt:\\nfac h o s , ut d o m u m p a t e r n a m cito repetant, ne m i s e r i a et f a m e\\npereant. R e x esto e o r u m , q u o s aut o p i n i o n u m error d e c e p t o s\\nhabet, aut discordia separatos, e o s q u e ad portum veritatis at-\\n\\f652                          LITTERAE ENCYCLICAE\\n\\nque ad unitatem fidei revoca, ut brevi fìat unum ovile et unus\\npastor. Rex esto denique eorum omnium, qui in vetere gen-\\ntium superstitione versantur, eosque e tenebris vindicare ne re-\\nnuas in Dei lumen et regnum. Largire, Domine, Ecclesiae tuae\\nsecuram cum incolumitate libertatem; largire cunctis gentibus\\ntranquillitatem ordinis: perfice, ut ab utroque terrae vertice\\nuna resonet vox: Sit laus divino Cordi, per quod nobis parta\\nsalus: ipsi gloria et honor in saecula: amen.\\n\", \"end_line\": 26407, \"removed\": \"Running header/page-number lines carrying formfeed and Acta volume/fascicle footers are omitted via disjoint ranges; all remaining source text and notes in selected extent retained.\", \"retained_historical_note_ranges\": [], \"start_line\": 26153} Archival OCR reconstruction and mechanical extraction; no facsimile image collation is claimed. OCR errors, historical spelling, line breaks, and unverified pagination remain source limitations."
