notes = "Normalized transcription, not a facsimile or critical edition. Historical Latin wording is public domain in the United States; portal markup and translations have separate rights. Historical witness: Acta Sanctae Sedis 41 (1908), pp. 425–440, complete main constitution through the cardinal subscriptions before Lex propria; reprinted in Acta Apostolicae Sedis 1 (1909), pp. 7–19.. Uncollated normalized web transcription; source wording and numbering retained apart from the explicitly recorded corrections and apparatus exclusions. Normalized Vatican web transcription of the complete Latin constitution main act, not a facsimile or diplomatic/critical edition. It preserves the web spelling and punctuation. The printed act closes with Cardinal Di Pietro and Cardinal Merry del Val subscriptions; no terminal PIUS PP. X signature is invented. The separate printed VISA, seal-location and chancery registration lines are absent in this web transcription. The attached regulations have separate source identities and are not part of this selected main-act expression. Complete Latin main constitutional text of Sapienti consilio, from the papal masthead through the incipit, all constitutional sections, terminal enactment/date clauses and cardinal subscriptions. The website linked contents and separately owned Lex propria/Ordo regulations and Italian expression are excluded. The web transcription does not reproduce the printing's separate chancery registration lines; this is a stated transcription limitation, not a cut to the constitution's normative text. This artifact retains the complete reviewed Latin constituent of a mixed-language web delivery; the appended translation is excluded."
