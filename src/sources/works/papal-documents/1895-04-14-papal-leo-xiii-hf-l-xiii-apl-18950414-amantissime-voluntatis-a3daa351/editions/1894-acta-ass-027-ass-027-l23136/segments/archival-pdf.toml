context = "{\"closing_physical_lines\": [23583, 23602], \"closing_text\": \"    Datum R o m a e apud S a n c t u m Petrum, die x i v aprilis an-\\nno MDCCCLXXXXV, Pontificatus Nostri decimo octavo.\\n\\n                                 LEO     PP. XIII.\\n\\n\\n\\n          AD SANCTISSIMAM V I R G I N E M\\n                PRO ANGLIS FRATRIBUS PRECATIO\\n       O beata Virgo MARIA, Mater Dei, Regina nostra et Mater dulcissima, benigna\\noculos tuos converte ad Angliam, quae Dos tua vocatur, converte ad nos, qui magna\\nin te fiducia confidimus. Per te datus est Christus Salvator mundi, in quo spes nostra\\nconsisteret ; ab ipso autem tu data es nobis, per quam spes eadem augeretur. Eia\\nigitur, ora pro nobis, quos tibi apud Crucem Domini excepisti filios, o perdolens Ma-\\nter: intercede pro fratribus dissidentibus, ut nobiscum in unico vero Ovili adiungantur\\nsummo Pastori, Vicario in terris Filii tui. Pro nobis omnibus deprecare, o Mater\\npiissima, ut per fidem, bonis operibus foecundam, mereamur tecum omnes contemplar-i\\nDeum in caelesti patria et collaudare per saecula. Amen.\\n\\n     (1) Ioann. XVII, I i , 17, 20, 21, 23.\", \"end_line\": 23602, \"removed\": \"Running header/page-number lines carrying formfeed and Acta volume/fascicle footers are omitted via disjoint ranges; all remaining source text and notes in selected extent retained.\", \"retained_historical_note_ranges\": [], \"start_line\": 23136}"
