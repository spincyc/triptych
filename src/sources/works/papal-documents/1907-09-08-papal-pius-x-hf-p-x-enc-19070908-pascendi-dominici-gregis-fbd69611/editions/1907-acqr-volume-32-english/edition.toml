notes = "Translator unrecorded. The printing, rather than the act signature alone, establishes publication before 1931. The complete English printed extent is retained, including all three parts, the seven remedial sections, closing and papal signature. The historical printing itself repeats a line and breaks the second paragraph’s grammatical continuation on page 705; this source defect is retained, as confirmed on the native page image. Severe inherited OCR damage elsewhere, including the passages near printed pages 726 and 728, is also retained. No complete print-image collation or corrected edition is claimed."
