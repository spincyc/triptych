context = "Historical English translation in The American Catholic Quarterly Review 32 (1907), pp. 705–730. Translator unrecorded. The historical English printing has a substantive duplicated/substituted line and broken continuation on printed page 705. Native image inspection confirms a printing defect, rather than an extraction failure; no missing words are supplied. The entire damaged printed extent, all three parts, seven remedial sections, closing and signature are retained. Severe inherited OCR errors also remain, especially near printed pages 726 and 728. This is not a complete-act reading, corrected text or full image-collated edition. Positive work identity rests on Pius X, translated opening, 8 September 1907 dating and signature."
