notes = "Complete translated papal protocol, body, blessing, closing dated 24 September 1912 and papal subscription. Native title/imprint PDF7, copyright/publication PDF8 and all act PDF153–158 were inspected. Only running heads and folios are excluded. Historical anthology headings, bracketed explanatory glosses and notes 6 and 7 remain part of the historical translation presentation and are not presented as newly identified papal originals. Notes are selected separately from the body at their original page breaks. OCR misrecognizes the note-6 body marker as an asterisk and note-7 marker/label; those literal bytes remain uncorrected, while the native pages establish the printed numbering. No independent review of translation accuracy is claimed."
