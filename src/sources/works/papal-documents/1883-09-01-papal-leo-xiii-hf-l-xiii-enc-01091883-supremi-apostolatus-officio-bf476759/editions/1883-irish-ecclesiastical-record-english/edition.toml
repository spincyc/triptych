notes = "Complete historical English translation in The Irish Ecclesiastical Record, third series 4 (1883), pp. 667–672, in Roman Notes and Documents. Translator unrecorded; the historical editor expressly says the encyclical is printed in English. The native title/imprint and all six act pages were inspected. The full protocol, body, dated closing, papal subscription and final historical editorial note are retained. OCR closing 18S8 and signature XIH remain literal although the native page clearly prints 1883 and XIII. Other inherited OCR errors and broken words remain; this is not a word-for-word image collation or a corrected translation."
