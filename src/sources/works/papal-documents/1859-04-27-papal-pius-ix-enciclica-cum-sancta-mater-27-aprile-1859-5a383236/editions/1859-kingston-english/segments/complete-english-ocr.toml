context = "Horan dates his pastoral 9 June 1859. The complete English Cum Sancta Mater is printed on pp.1–2, from its address and salutation through the dated 27 April 1859 closing; subsequent Horan commentary and prescriptions are separate. Translator unnamed. Native PDF pages 1–3 inspected, and the entire act OCR read. The source has no separate papal subscription. OCR retains word breaks and misreads the year as 185). Native inspection establishes the complete printed extent, not word-for-word collation or correction of the OCR. Publication year 1859 is corroborated by CIHM 51176 and Horan's dated pastoral. Its catalogue gives [Kingston, Ont? : s.n.]: the printing place is inferred, and the printed imprint and publisher are unknown. Catalogue evidence: https://archive.org/metadata/cihm_51176, SHA-256 55ceda09fd5938f26b04eedce44cd9d216c2f6d1e1b3118c342ebf2e99e6697e."
