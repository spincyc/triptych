context = "Norm II.1: 'The time of Lent preserves its penitential character. The days of penitence to be observed under obligation throughout the Church are all Fridays and Ash Wednesday, that is to say the first days of \"Grande Quaresima\" (Great Lent), according to the diversity of the rites. Their substantial observance binds gravely.' Norm II.2: 'abstinence is to be observed on every Friday which does not fall on a day of obligation, while abstinence and fast is to be observed on Ash Wednesday or, according to the various practices of the rites, on the first day of \"Grande Quaresima\" (Great Lent) and on Good Friday.' Extracted verbatim from the exact fetched response."
verified_on = "2026-11-18"
notes = "The English delivery numbers this norm II.1-2; the Latin numbers it II §§1-3. English is a working aid; the Latin governs. Neither delivery contains the string 'Advent' (case-insensitive, whole extracted text): the constitution names no Advent day."
