description = "The English Catholic Bible translated from the Latin Vulgate by the English College in exile: the New Testament published at Rheims in 1582 and the Old Testament at Douay in 1609 and 1610, revised by Bishop Richard Challoner between 1749 and 1752. It is the English counterpart of the Clementine Vulgate the 1962 Missal prints. Edition records must keep the original Douay and Rheims text, Challoner's revision, the 1899 and 1914 American printings, and later electronic transcriptions apart, because their wording and in places their versification differ. A locus is BookToken.chapter.verse, optionally with a closing verse or chapter.verse after a hyphen, as in Ps.53.6-7, 1Cor.10.6-13, or Dan.3.49-51. The 73 book tokens, the modern names and 1962 Missal abbreviations they answer to, and the naming traps are registered in the book index of each electronic edition. Chapter and verse numbers are always the Vulgate ones the Missal cites, never modern Hebrew ones: Psalm numbers follow the Septuagint and Vulgate series, so Ps 53 here is Ps 54 in a modern Bible, and Douay 1 and 2 Kings are modern 1 and 2 Samuel. The psalm-numbering and verse-alias tables registered with the text carry the exhaustive conversions."
