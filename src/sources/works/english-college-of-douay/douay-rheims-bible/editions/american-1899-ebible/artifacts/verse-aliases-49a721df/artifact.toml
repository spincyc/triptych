provenance = "Derived by Triptych on 2026-07-31 by `python3 scripts/_psalter.py douay-rheims-american-1899`, from the tracked psalm concordance and this edition's own verse text, the declarations having been established by reading this release against the Challoner text the concordance was compiled from. It replaces a single withheld row at Psalm 115:10. That withholding was recorded because the reader clamped a range to a chapter's last printed verse before consulting the alias table, so a resolution would have answered Psalm 115:10-19 with one verse and read as ten; the clamp has since been removed from `Bible.span`, and with it the reason. This release restarts Psalms 115 and 147, which the Vulgate prints as verses 10-19 and 12-20 of psalms that keep the numbering they had before the Hebrew split, so all nineteen of those verses are now resolved verse for verse rather than one of them refused and the other eighteen left to fail on the chapter bound. Psalms 28 and 150, where this release prints one verse more than the concordance, are not departures at all: the Vulgate numbering has a 28:11 and a 150:6 that the concordance cannot record, because its rows must be equal-length runs against the Hebrew, and both are recorded instead in the Challoner edition's own alias table."
