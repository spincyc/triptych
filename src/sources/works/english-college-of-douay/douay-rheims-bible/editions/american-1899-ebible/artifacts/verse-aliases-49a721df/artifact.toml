notes = "Nineteen rows, all of them renumberings of Psalms 115 and 147, derived and not typed: `tools/tests/test_psalter.py` and `index-bible check` both fail if this file and the derivation disagree. The check that derives which psalms must be declared reads the numbering from the concordance and the Challoner alias table together, so nothing here rests on a typed extent."
