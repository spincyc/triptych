transformation = "Parse the USFM of eBible.org's engDRA release into one verse per line. Read \\c for the chapter and \\v for the verse, join a verse's continuation lines with single spaces, and take the text between one \\v and the next. Drop the content of \\f footnotes and \\x cross references entirely, and drop the whole of every heading-class marker with its text — \\s section headings, \\ms major-section headings, \\r parallel references, \\d psalm inscriptions, \\cl chapter labels and the \\id, \\h, \\toc and \\mt identification block — because a heading standing between two verses is not part of either and would otherwise be joined to the verse before it. Unwrap character markup such as \\add, \\nd and \\wj, keeping the words it encloses, and discard every remaining marker, which is paragraph and poetry structure rather than text. A marker leaves a space behind only where it separated two words, so that a note hung on the word before a comma does not print a space before the comma. Collapse runs of whitespace to one space and strip the ends. Emit \"book<TAB>chapter<TAB>verse<TAB>text<TAB>usfm\" with a header line, LF terminated. Book tokens, ordinals and file names are those of the Challoner edition registered under the same work, because the two carry the same 73 books in the same order and must be addressed alike; the mapping is by USFM book code and not by file order, and every book's chapter count was checked to agree with the Challoner text before the mapping was accepted. It agrees throughout, Daniel's fourteen chapters and Esther's sixteen included."
