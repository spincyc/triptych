notes = "3 John (3John): 1 chapters and 14 verses, one LF-terminated line per verse after a header line. Chapter and verse numbers are the Vulgate ones the 1962 Missal cites, and the psalm inscription is numbered as verse 1. This is a textual control on the Challoner edition registered under the same work, not a reading text: it carries uncorrected scanning errors, and where the two differ in wording the collation table registered under the Challoner edition records which reading belongs to the American edition."
