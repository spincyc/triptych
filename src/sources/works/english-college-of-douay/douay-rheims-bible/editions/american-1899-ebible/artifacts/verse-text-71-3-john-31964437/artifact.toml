rights_basis = "eBible.org publishes engDRA with the copyright statement “Public Domain” and the words “This Public Domain Bible text is brought to you courtesy of eBible.org.” The underlying translation is out of copyright by age: the Rheims New Testament is of 1582, the Douay Old Testament of 1609-1610, Challoner's revision of 1749-1752, and the American edition this release reproduces of 1899. This derivative contains only the scripture text with a mechanical reference column, and none of the release's footnotes, chapter arguments, section headings, or front matter."
