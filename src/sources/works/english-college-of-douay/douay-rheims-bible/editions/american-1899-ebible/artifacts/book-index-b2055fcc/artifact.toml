notes = "73 books: 46 Old Testament and 27 New Testament, the Catholic canon fixed at Trent, in the Vulgate order, with 1334 chapters and 35811 verses. Tokens are shared with the Challoner edition so a citation resolves to the same book in either. Two divergences from the Challoner text are recorded in the note column and must not be lost in reuse: this edition restarts the numbering of Psalms 115 and 147, which the Vulgate prints as verses 10-19 and 12-20, and it restores seven verse divisions the Challoner e-text runs together, in Genesis 5, 2 Kings 13, Psalms 28 and 150, Amos 9, John 11 and 2 Corinthians 1."
