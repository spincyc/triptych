provenance = "Compiled by Triptych on 2026-07-31 from the eBible.org engDRA release. Each USFM file was matched to its row by book code and its chapter and verse counts read from the extracted text. The token, ordinal, file name, Douay title, modern name, Missal abbreviation and alternate names are those of the Challoner book index registered under the same work, because the two editions carry the same 73 books of the Catholic canon in the same order and must be addressed by the same tokens; the edition title and the counts are this release's own. Every chapter count agrees with the Challoner text. Seven verse counts do not, and each is recorded in the note column."
