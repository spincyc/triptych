notes = "eBible.org distributes this text as \"The Holy Bible in English, Douay-Rheims American Edition of 1899\" and marks it public domain. It is registered as a textual control for the Challoner electronic edition, not as a reading text: it carries many uncorrected scanning errors (\"sides\" for \"sicles\", \"eaves\" for \"caves\", \"beget\" for \"begot\", \"Axed\" for \"fixed\"). Where it agrees with drbo.org against the vendored Challoner text, the agreement identifies a reading of the 1899 American edition; those 1859 places are collated in the divergence table registered under the Challoner edition. Its 73 books, its book order and every one of its 1334 chapter counts agree with the Challoner text, Daniel's fourteen chapters and Esther's sixteen included, and its psalm inscriptions are numbered as verse 1 in the Vulgate manner. Its verse division does not agree everywhere, and the difference was measured verse by verse on 2026-07-31 when the USFM release was registered here as tracked text. Two psalms are renumbered, and only two. The Vulgate prints Psalm 115 as verses 10 to 19 and Psalm 147 as verses 12 to 20, keeping the numbering each psalm had before the Hebrew split; this edition restarts both at verse 1, so its Psalm 115 runs 1-10 and its Psalm 147 runs 1-9. Psalms 9 and 113 are not renumbered, contrary to what this record said before that check: this edition keeps them joined at 39 and 26 verses exactly as the Challoner text does. And it restores seven verse divisions, not five, that the vendored Challoner e-text runs together: Genesis 5:32, 2 Kings 13:39, Psalm 28:11, Psalm 150:6, Amos 9:15, John 11:57, and 2 Corinthians 1:24, so it has 35811 verses against the Challoner text's 35804. The verse tables, book index and verse-alias table registered under this edition record each of those."
