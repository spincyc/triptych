notes = "eBible.org distributes this text as \"The Holy Bible in English, Douay-Rheims American Edition of 1899\" and marks it public domain. It is registered as a textual control for the Challoner electronic edition, not as a reading text: it carries many uncorrected scanning errors (\"sides\" for \"sicles\", \"eaves\" for \"caves\", \"beget\" for \"begot\", \"Axed\" for \"fixed\"), and it silently renumbers Psalm 9, Psalm 113, Psalm 115, and Psalm 147 and restores five verse divisions that no Douay-Rheims printing has. Where it agrees with drbo.org against the vendored Challoner text, the agreement identifies a reading of the 1899 American edition; those 1859 places are collated in the divergence table registered under the Challoner edition."
