notes = "The first of the two volumes of the original Douay Old Testament, containing Genesis through Job together with the chapter arguments, marginal notes, and the annotations printed after each chapter or group of chapters. It is a separate physical and editorial unit from the second tome of 1610, which is registered under its own edition record, and its wording differs from Challoner's revision. No complete text of this volume is retained in the repository."
