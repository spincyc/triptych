text = "And David was afraid of the Lord that day, saying: How shall the ark of the Lord come to me? And he would not have the ark of the Lord brought in to himself into the city of David: but he caused it to be carried into the house of Obededom the Gethite. And the ark of the Lord abode in the house of Obededom the Gethite three months: and the Lord blessed Obededom, and all his household. And it was told king David, that the Lord had blessed Obededom, and all that he had, because of the ark of God. So David went, and brought away the ark of God out of the house of Obededom into the city of David with joy. And there were with David seven choirs, and calves for victims. And when they that carried the ark of the Lord had gone six paces, he sacrificed an ox and a ram: And David danced with all his might before the Lord: and David was girded with a linen ephod. And David and all the house of Israel brought the ark of the covenant of the Lord with joyful shouting, and with sound of trumpet. And when the ark of the Lord was come into the city of David, Michol the daughter of Saul, looking out through a window, saw king David leaping and dancing before the Lord: and she despised him in her heart."
