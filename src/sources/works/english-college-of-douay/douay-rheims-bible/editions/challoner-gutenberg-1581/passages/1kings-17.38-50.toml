text = "And Saul clothed David with his garments, and put a helmet of brass upon his head, and armed him with a coat of mail. And David having girded his sword upon his armour, began to try if he could walk in armour: for he was not accustomed to it. And David said to Saul: I cannot go thus, for I am not used to it. And he laid them off, And he took his staff, which he had always in his hands: and chose him five smooth stones out of the brook, and put them into the shepherd’s scrip, which he had with him, and he took a sling in his hand, and went forth against the Philistine. And the Philistine came on, and drew nigh against David, and his armourbearer went before him. And when the Philistine looked, and beheld David, he despised him. For he was a young man, ruddy, and of a comely countenance. And the Philistine said to David: Am I a dog, that thou comest to me with a staff? And the Philistine cursed David by his gods. And he said to David: Come to me, and I will give thy flesh to the birds of the air, and to the beasts of the earth. And David said to the Philistine: Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the Lord of hosts, the God of the armies of Israel, which thou hast defied. This day, and the Lord will deliver thee into my hand, and I will slay thee, and take away thy head from thee: and I will give the carcasses of the army of the Philistines this day to the birds of the air, and to the beasts of the earth: that all the earth may know that there is a God in Israel. And all this assembly shall know that the Lord saveth not with sword and spear: for it is his battle, and he will deliver you into our hands. And when the Philistine arose, and was coming, and drew nigh to meet David, David made haste, and ran to the fight to meet the Philistine. And he put his hand into his scrip, and took a stone, and cast it with the sling, and fetching it about, struck the Philistine in the forehead: and the stone was fixed in his forehead, and he fell on his face upon the earth. And David prevailed over the Philistine, with a sling and a stone, and he struck, and slew the Philistine. And as David had no sword in his hand,"
