text = "Juda, thee shall thy brethren praise: thy hand shall be on the necks of thy enemies; the sons of thy father shall bow down to thee. Juda is a lion’s whelp: to the prey, my son, thou art gone up: resting thou hast couched as a lion, and as a lioness, who shall rouse him? The sceptre shall not be taken away from Juda, nor a ruler from his thigh, till he come that is to be sent, and he shall be the expectation of nations."
