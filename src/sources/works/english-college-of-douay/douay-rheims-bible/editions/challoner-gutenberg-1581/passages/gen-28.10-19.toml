text = "But Jacob being departed from Bersabee, went on to Haran. And when he was come to a certain place, and would rest in it after sunset, he took of the stones that lay there, and putting under his head, slept in the same place. And he saw in his sleep a ladder standing upon the earth, and the top thereof touching heaven: the angels also of God ascending and descending by it. And the Lord leaning upon the ladder saying to him: I am the Lord God of Abraham thy father, and the God of Isaac: The land, wherein thou sleepest, I will give to thee and to thy seed. And thy seed shall be as the dust of the earth: thou shalt spread abroad to the west, and to the east, and to the north, and to the south: and IN THEE and thy seed, all the tribes of the earth SHALL BE BLESSED. And I will be thy keeper whithersoever thou goest, and will bring thee back into this land: neither will I leave thee, till I shall have accomplished all that I have said. And when Jacob awaked out of sleep, he said: Indeed the Lord is in this place, and I knew it not. And trembling, he said: How terrible is this place? this is no other but the house of God, and the gate of heaven. And Jacob arising in the morning, took the stone which he had laid under his head, and set it up for a title, pouring oil upon the top of it. And he called the name of the city Bethel, which before was called Luza."
