text = "And Moses called all the ancients of the children of Israel, and said to them: Go take a lamb by your families, and sacrifice the Phase. And dip a bunch of hyssop in the blood that is at the door, and sprinkle the transom of the door therewith, and both the door cheeks: let none of you go out of the door of his house till morning. For the Lord will pass through striking the Egyptians: and when he shall see the blood on the transom, and on both the posts, he will pass over the door of the house, and not suffer the destroyer to come into your houses and to hurt you. Thou shalt keep this thing as a law for thee and thy children for ever. And when you have entered into the land which the Lord will give you, as he hath promised, you shall observe these ceremonies. And when your children shall say to you: What is the meaning of this service? You shall say to them: It is the victim of the passage of the Lord, when he passed over the houses of the children of Israel in Egypt, striking the Egyptians, and saving our houses. And the people bowing themselves, adored."
