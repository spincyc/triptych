context = "Proverbs 12:11 as the Clementine gives it, in two clauses. Project Gutenberg eBook 1581 sets the second clause as a paragraph wrongly numbered \"12:12\", duplicating the number of the following verse; the extraction restores it to verse 11. drbo.org prints both clauses as verse 11 and the Clementine Latin at drbo.org gives \"Qui operatur terram suam satiabitur panibus; qui autem sectatur otium stultissimus est. Qui suavis est in vini demorationibus, in suis munitionibus relinquit contumeliam.\" as verse 11."
