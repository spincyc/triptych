text = "And they marched from mount Hor, by the way that leadeth to the Red Sea, to compass the land of Edom. And the people began to be weary of their journey and labour: And speaking against God and Moses, they said: Why didst thou bring us out of Egypt, to die in the wilderness? There is no bread, nor have we any waters: our soul now loatheth this very light food. Wherefore the Lord sent among the people fiery serpents, which bit them and killed many of them. Upon which they came to Moses, and said; We have sinned, because we have spoken against the Lord and thee: pray that he may take away these serpents from us. And Moses prayed for the people. And the Lord said to him: Make a brazen serpent, and set it up for a sign: whosoever being struck shall look on it, shall live. Moses therefore made a brazen serpent, and set it up for a sign: which when they that were bitten looked upon, they were healed."
