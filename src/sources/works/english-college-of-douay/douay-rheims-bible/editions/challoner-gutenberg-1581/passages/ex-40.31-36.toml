text = "He set up also the court round about the tabernacle and the altar, drawing the hanging in the entry thereof. After all things were perfected, The cloud covered the tabernacle of the testimony, and the glory of the Lord filled it. Neither could Moses go into the tabernacle of the covenant, the cloud covering all things, and the majesty of the Lord shining, for the cloud had covered all. If at any time the cloud removed from the tabernacle, the children of Israel went forward by their troops: If it hung over, they remained in the same place. For the cloud of the Lord hung over the tabernacle by day, and a fire by night, in the sight of all the children of Israel throughout all their mansions."
