text = "And it came to pass when the king sat in his house, and the Lord had given him rest on every side from all his enemies, He said to Nathan the prophet: Dost thou see that I dwell in a house of cedar, and the ark of God is lodged within skins? And Nathan said to the king: Go, do all that is in thy heart: because the Lord is with thee. But it came to pass that night, that the word of the Lord came to Nathan, saying: Go, and say to my servant David: Thus saith the Lord: Shalt thou build me a house to dwell in? Whereas I have not dwelt in a house from the day that I brought the children of Israel out of the land of Egypt even to this day: but have walked in a tabernacle, and in a tent. In all the places that I have gone through with all the children of Israel, did ever I speak a word to any one of the tribes of Israel, whom I commanded to feed my people Israel, saying: Why have you not built me a house of cedar? And now thus shalt thou speak to my servant David: Thus saith the Lord of hosts: I took thee out of the pastures from following the sheep to be ruler over my people Israel: And I have been with thee wheresoever thou hast walked, and have slain all thy enemies from before thy face: and I have made thee a great man, like unto the name of the great ones that are on the earth. And I will appoint a place for my people Israel, and I will plant them, and they shall dwell therein, and shall be disturbed no more: neither shall the children of iniquity afflict them any more as they did before, From the day that I appointed judges over my people Israel: and I will give thee rest from all thy enemies. And the Lord foretelleth to thee, that the Lord will make thee a house. And when thy days shall be fulfilled, and thou shalt sleep with thy fathers, I will raise up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom. He shall build a house to my name, and I will establish the throne of his kingdom for ever. I will be to him a father, and he shall be to me a son: and if he commit any iniquity, I will correct him with the rod of men, and with the stripes of the children of men. But my mercy I will not take away from him, as I took it from Saul, whom I removed from before my face. And thy house shall be faithful, and thy kingdom for ever before thy face, and thy throne shall be firm for ever."
