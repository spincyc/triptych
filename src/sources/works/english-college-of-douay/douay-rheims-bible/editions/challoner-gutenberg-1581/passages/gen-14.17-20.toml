text = "And the king of Sodom went out to meet him, after he returned from the slaughter of Chodorlahomor, and of the kings that were with him in the vale of Save, which is the king’s vale. But Melchisedech, the king of Salem, bringing forth bread and wine, for he was the priest of the most high God, Blessed him, and said: Blessed be Abram by the most high God, who created heaven and earth. And blessed be the most high God, by whose protection, the enemies are in thy hands. And he gave him the tithes of all."
