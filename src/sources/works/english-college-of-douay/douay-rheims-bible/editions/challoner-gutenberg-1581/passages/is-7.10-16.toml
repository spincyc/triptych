text = "And the Lord spoke again to Achaz, saying: Ask thee a sign of the Lord thy God, either unto the depth of hell, or unto the height above. And Achaz said: I will not ask, and I will not tempt the Lord. And he said: Hear ye therefore, O house of David: Is it a small thing for you to be grievous to men, that you are grievous to my God also? Therefore the Lord himself shall give you a sign. Behold a virgin shall conceive, and bear a son and his name shall be called Emmanuel. He shall eat butter and honey, that he may know to refuse the evil, and to choose the good. For before the child know to refuse the evil and to choose the good, the land which thou abhorrest shall be forsaken of the face of her two kings."
