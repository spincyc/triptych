text = "And when they were come in, he saw Eliab, and said: Is the Lord’s anointed before him? And the Lord said to Samuel: Look not on his countenance, nor on the height of his stature: because I have rejected him, nor do I judge according to the look of man: for man seeth those things that appear, but the Lord beholdeth the heart. And Isai called Abinadab, and brought him before Samuel. And he said: Neither hath the Lord chosen this, And Isai brought Samma, and he said of him: Neither hath the Lord chosen this. Isai therefore brought his seven sons before Samuel: and Samuel said to Isai: The Lord hath not chosen any one of these. And Samuel said to Isai: Are here all thy sons? He answered: There remaineth yet a young one, who keepeth the sheep. And Samuel said to Isai: Send, and fetch him: for we will not sit down till he come hither. He sent therefore and brought him. Now he was ruddy and beautiful to behold, and of a comely face. And the Lord said: Arise, and anoint him, for this is he. Then Samuel took the horn of oil, and anointed him in the midst of his brethren: and the Spirit of the Lord came upon David from that day forward: and Samuel rose up, and went to Ramatha."
