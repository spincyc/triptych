text = "And after that forty days were passed, Noe opening the window of the ark, which he had made, sent forth a raven: Which went forth and did not return, till the waters were dried up upon the earth. He sent forth also a dove after him, to see if the waters had now ceased upon the face of the earth. But she not finding where her foot might rest, returned to him into the ark: for the waters were upon the whole earth: and he put forth his hand, and caught her, and brought her into the ark. And having waited yet seven other days, he again sent forth the dove out of the ark. And she came to him in the evening carrying a bough of an olive tree, with green leaves, in her mouth. Noe therefore understood that the waters were ceased upon the earth. And he stayed yet other seven days: and he sent forth the dove, which returned not any more unto him."
