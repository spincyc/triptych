context = "\"Non nobis, Domine\" at Vulgate Ps 113:9, the point where the Clementine continues the numbering of Psalm 113 while the printed Douay-Rheims restarts at 1. The Clementine Latin at drbo.org numbers the verse 9 and runs the psalm to 26, and drbo.org's English text does the same; the 1914 John Murphy printing restarts at 1. In modern numbering this is Ps 115:1. Verses 1-26 were read."
