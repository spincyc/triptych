text = "Now when these things were done, the word of the Lord came to Abram by a vision, saying: Fear not, Abram, I am thy protector, and thy reward exceeding great. And Abram said: Lord God, what wilt thou give me? I shall go without children: and the son of the steward of my house is this Damascus Eliezer. And Abram added: But to me thou hast not given seed: and lo my servant born in my house, shall be my heir. And immediately the word of the Lord came to him, saying: He shall not be thy heir: but he that shall come out of thy bowels, him shalt thou have for thy heir. And he brought him forth abroad, and said to him: Look up to heaven and number the stars if thou canst. And he said to him: So shall thy seed be. Abram believed God, and it was reputed to him unto justice."
