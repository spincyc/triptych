context = "The first verse of the second half of Vulgate Psalm 9, which the Clementine numbers continuously as 9:22 and modern versions number as Ps 10:1. The printed Douay-Rheims, including the 1914 John Murphy edition and Project Gutenberg eBook 1581, sets this half under the running head \"Psalm 10 according to the Hebrews\" and renumbers it 1-18; the edition's own note on verse 21 states that the Hebrews make \"ver. 22 the beginning of Psalm 10\". drbo.org displays the same half as Psalm 10 verses 1-18 within its Psalm 9 page. This extraction stores the continuous Clementine numbering."
