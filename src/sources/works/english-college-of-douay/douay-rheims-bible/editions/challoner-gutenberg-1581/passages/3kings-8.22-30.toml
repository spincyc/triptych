text = "And Solomon stood before the altar of the Lord, in the sight of the assembly of Israel, and spread forth his hands towards heaven, And said: Lord God of Israel, there is no God like thee, in heaven above, or on the earth beneath: who keepest covenant and mercy with thy servants, that have walked before thee with all their heart: Who hast kept with thy servant David, my father, what thou hast promised him: with thy mouth thou didst speak, and with thy hands thou hast performed, as this day proveth. Now, therefore, O Lord God of Israel, keep with thy servant David, my father, what thou hast spoken to him, saying: There shall not be taken away of thee a man in my sight, to sit on the throne of Israel: yet so that thy children take heed to their way, that they walk before me as thou hast walked in my sight. And now, Lord God of Israel, let thy words be established, which thou hast spoken to thy servant David, my father. Is it then to be thought that God should indeed dwell upon earth? for if heaven, and the heavens of heavens, cannot contain thee, how much less this house which I have built? But have regard to the prayer of thy servant, and to his supplications, O Lord, my God: hear the hymn and the prayer, which thy servant prayeth before thee this day: That thy eyes may be open upon this house, night and day: upon the house of which thou hast said: My name shall be there: that thou mayst hearken to the prayer which thy servant prayeth, in this place to thee: That thou mayst hearken to the supplication of thy servant, and of thy people Israel, whatsoever they shall pray for in this place, and hear them in the place of thy dwelling in heaven; and when thou hearest, shew them mercy."
