notes = "Bishop Challoner's revision of the Douay and Rheims text, made between 1749 and 1752, in the electronic form Project Gutenberg distributes as eBook 1581. Project Gutenberg states that the e-text \"comes from multiple editions of Challoner's revised Douay-Rheims Version\" and does not name one printing, so the exemplar is not exactly identifiable. Its structure was checked against the 1914 John Murphy Company printing registered as a separate edition and agrees throughout: same 73 books, same 1334 chapters, same book order and titles, same chapter arguments and Latin psalm incipits, same Challoner notes, and the same psalm versification, including the restarted numbering at Psalm 9 and Psalm 113 and the merged verses. Its wording, however, is not that of the 1899 and 1914 American edition that most printed Douay-Rheims Bibles and drbo.org reproduce. In 1859 verses it preserves an older Challoner reading against the settled reading of the American edition; every one of those verses is listed with both readings in the american-edition-divergences table registered in this edition, and a consumer that must match a reader's printed Bible must consult it. Project Gutenberg's eBook 8300 is an earlier, less complete state of the same e-text with at least one error this state corrects, and Project Gutenberg directs readers here instead. The eBook also prints, in appendices, apocryphal books and a small body of original-spelling 1582 Rheims and 1610 Douay material; those constituents are registered as segments under their own editions and are not part of this Challoner text."
