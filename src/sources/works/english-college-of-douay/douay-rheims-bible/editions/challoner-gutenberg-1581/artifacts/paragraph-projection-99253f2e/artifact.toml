rights_basis = "This table carries no scripture text: it is a list of verse numbers at which a paragraph opens or is refused, derived from two public-domain witnesses that record paragraph structure of their own — eBible.org's eng-kjv and its public-domain World English Bible — and expressed in the Douay-Rheims numbering this repository cites in. The Douay and Rheims translation was published in 1582, 1609 and 1610 and Challoner revised it in 1749-1752, all long in the public domain. eBible.org asserts no separate claim over paragraph structure in any of its releases; its notices cover each work undifferentiated, and the World English Bible's single condition is triggered by changing the text, which this table does not do because it contains none. No authority was found holding that paragraph division in a public-domain text is itself copyrightable, and the general law runs the other way: under Feist v. Rural Telephone (499 U.S. 340, 1991) a compilation of public-domain material is protectable only where selection or arrangement shows minimal creativity, and an arrangement derived by a stated rule from witnesses is the paradigm of the mechanical case. The rows are a derivation this project performed and publishes as project-created content under CC BY 4.0, regenerable by anyone holding the two witness tables and this edition's own verse-alias table."
