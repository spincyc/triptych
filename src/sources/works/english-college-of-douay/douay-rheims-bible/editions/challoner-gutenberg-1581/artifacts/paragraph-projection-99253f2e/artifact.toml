notes = "8661 rows across 1332 non-psalm chapters: 2239 concurring, at which a break is set, and 6422 disputed, at which none is. So the witnesses concur at 2239 of the 8661 positions where either of them breaks — 25.9 per cent. That figure is the measured disagreement between two modern English typesettings of the same books, and it is the reason the rule requires concurrence instead of taking a majority or a first witness: paragraph division in these editions is an editorial act, the editors disagree about it three times in four, and a break asserted on one witness alone would read as this edition's own. Beyond these positions, 21752 verses are broken by neither witness, 1679 are carried by neither, and 2380 stand in the excluded Psalms. Two witnesses were considered and refused. eBible.org's eng-rv is not used: its transcription of the Revised Version records 386 prose paragraph openings across 80 books — one of them mid-chapter in the whole protocanon — so it does not carry the Revised Version's paragraphing at all, and under a rule requiring every carrying witness to concur it would have vetoed almost every break rather than testifying about any. That is a fact about the file, not about the Revised Version, which was the first major English Bible set in true paragraphs. eBible.org's engDRA and latVUC are not used because they have nothing to say: their paragraph-opening sets are identical to each other and consist of one marker per non-psalm chapter. Two better witnesses exist and are NOT used here, both requiring entry to the source library under guidance/sources.md, which is a human-review gate and not a derivation. First, eBible.org's engkjvcpb is F. H. A. Scrivener's Cambridge Paragraph Bible of 1873, public domain, and the only English witness whose editor documented his method — he states it in The Authorized Edition of the English Bible (1611) (Cambridge, 1884, pp. 128-129), aiming between breaks 'too far apart for the reader's convenience' and 'a virtual return to the discarded verse divisions', and reports a remarkable resemblance between his paragraphs and the 1871 Church Lectionary lesson boundaries. It carries 1987 mid-chapter prose openings in the protocanon. Adding it would make the rule a real two-of-three rather than a unanimity of two. Second, and older than any of them, the Masoretic petuchah and setumah section divisions: verse-aligned, attested from the Dead Sea Scrolls, codified by Maimonides from the Aleppo Codex, and machine-readable under open terms in two independent encodings that agree — tanach.us UXLC ('All biblical Hebrew text, in any format, may be viewed or copied without restriction') and OpenScriptures morphhb (CC BY 4.0). They number 3162 across the 39 books of the Hebrew canon, a mean of 7.3 verses to a section, which is paragraph-scale in the narrative and prophetic books; they are far too coarse in the wisdom books and absent from the Psalms, and they do not reach the deuterocanon or the New Testament at all. They would be the oldest and best-attested witness available and should be the next thing acquired."
