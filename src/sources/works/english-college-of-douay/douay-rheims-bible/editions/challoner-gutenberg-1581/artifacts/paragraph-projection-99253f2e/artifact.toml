transformation = "The Douay-Rheims carries no paragraph structure and none is reachable for it. The Project Gutenberg text this edition is transcribed from sets one verse per paragraph and prints no paragraph mark at all — zero pilcrows in 5,880,580 bytes — and eBible.org's Douay-Rheims American 1899 USFM, which would have been the closest possible witness, carries exactly one \\p per non-psalm chapter and not one paragraph opening beyond it. That is a faithful encoding of a text with nothing to give: the printed nineteenth-century Douay-Rheims is set verse-per-line, with no sectioning but the italic chapter argument. So the breaks here are projected, and the projection is a rule over witnesses rather than a set of verses anyone chose. The rule: walk every verse this edition prints, in this edition's own numbering; for each witness that records paragraph marks, ask that witness's own carrier table where it holds that verse; and where at least one witness opens a prose paragraph there, write a row. The row's rule column is concurring where every witness able to carry the verse opens a paragraph at it and at least two do, and disputed where exactly one does. Only concurring rows set a break. Disputed rows set nothing and exist to be counted, because a refusal that is merely absent from a table cannot be counted and the count is the measure of how far the witnesses are from agreeing. Poetry markers are not votes, and neither are the markers of a book classified verse-per-paragraph in a witness's own marks table. Verse 1 of a chapter is never a row, because a chapter always opens a paragraph. The Psalms are excluded entirely: the witnesses number the psalms as the Hebrew numbers them and leave the inscriptions unnumbered, so carrying a mark into this edition's psalm numbering needs the range-splitting conversion rather than the verse-level carrier, and a paragraph break landing one verse off in a psalm is precisely the plausible wrong answer this library refuses."
