provenance = "Compiled by Triptych on 2026-07-31 from the exact verse-text artifacts of the editions named below, by reading the verses. The table is a concordance between three arrangements of Esther, Ecclesiasticus and Daniel. The vulgate arrangement is witnessed by this edition and controlled against the tracked Clementine Vulgate and the Catholic Public Domain Version. The greek arrangement is witnessed by the tracked Revised Version of 1895 with Apocrypha and controlled against the tracked King James with Apocrypha. The world-english-catholic arrangement is witnessed by the tracked World English Bible, Catholic Edition, which is the only edition here that prints it. Every row's opening words were read out of the witness rather than typed, and scripts/_deuterocanon.py re-reads them at load and refuses the table if a row no longer describes the tracked text or no longer tiles a chapter's printed extent exactly once. No chapter ceiling is recorded anywhere in the file; every one is derived from the text, which is the defect the psalm concordance's hand-typed ceilings carried until 2026-07-31."
