notes = "Triptych-compiled table of loci that carry a verse number in the Clementine Vulgate and in most modern versions but none in the Douay-Rheims, with the Douay-Rheims verse that holds their text. The list is the complete set of such places found by comparing all 35804 extracted verses with eBible.org's public-domain engDRA edition, which restores the standard Vulgate versification. Every entry was then confirmed on the Douay-Rheims side against drbo.org, which likewise has no such verse; Genesis 5:32, 2 Kings 13:39, Amos 9:15, Psalm 28:11, and John 11:57 were further confirmed in the 1914 John Murphy printing, whose OCR could not resolve the other two. The Clementine side rests on engDRA and on the ordinary Vulgate versification, not on a collation with a Clementine text: drbo.org's parallel Latin is aligned to its Douay-Rheims and merges the same verses, so it cannot witness the Clementine division. Treat the list as complete against engDRA, not as a proof that no further divergence exists."
