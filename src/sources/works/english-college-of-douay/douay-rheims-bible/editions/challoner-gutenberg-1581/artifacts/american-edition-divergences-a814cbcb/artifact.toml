rights_basis = "Both columns are public-domain Douay-Rheims text. The vendored reading is taken from the Project Gutenberg artifact of this edition; the American-edition reading is taken from eBible.org's engDRA, which eBible.org publishes as public domain, and was required to agree with drbo.org before a row was kept. The Challoner translation is out of copyright by age; the collation itself is Triptych editorial work placed under the repository licence."
rights_jurisdiction = "United States"
provenance = "Produced by Triptych on 2026-07-25 by comparing every one of the 35804 extracted verses with the corresponding verse at drbo.org and with eBible.org engDRA, after normalizing curly quotation marks, dashes, and the ae ligature and collapsing whitespace. 24106 verses were identical to drbo.org and a further 9744 differed only in punctuation or capitalization. Of the 1954 that differed in wording, the 1859 where drbo.org and engDRA agree against the vendored text are recorded here; the 95 where the two American-edition witnesses disagree with each other were dropped because no stable reading could be established."
