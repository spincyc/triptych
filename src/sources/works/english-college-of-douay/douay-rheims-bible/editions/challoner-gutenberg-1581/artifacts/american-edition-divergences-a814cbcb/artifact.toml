notes = "One row per divergent verse: canonical locus, the reading in this edition's verse files, and the reading of the 1899 American edition. The divergences are overwhelmingly small - word order, \"exceeding\" against \"exceedingly\", presence of the definite article, \"unto\" against \"into\", proper-name spelling - and the vendored readings are consistently the older Challoner ones. Ten were checked against the 1914 John Murphy printing, which agreed with the American-edition column in every case that its OCR could resolve. A guide that must match a reader's printed Douay-Rheims should check its loci against this table before quoting. A locus absent from the table is one where the two traditions agree."
