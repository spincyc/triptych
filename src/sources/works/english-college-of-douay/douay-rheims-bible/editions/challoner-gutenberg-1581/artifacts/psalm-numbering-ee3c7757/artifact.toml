notes = "Triptych-compiled concordance between the Vulgate/Septuagint psalm numbering used throughout this edition and in the 1962 Missal, the Hebrew/Masoretic numbering used by the Nova Vulgata and by the New American Bible, and the English convention of the King James, Revised Standard, and most other modern English versions, which leaves the psalm inscription unnumbered. Rows are verse ranges, so the four places where one system joins or divides what the other keeps whole are exact. english_offset is the number of leading Vulgate verses occupied by the inscription; english_offset_uniform is \"no\" for the sixteen psalms where the two systems also divide the body differently, so that the offset holds only from the head of the psalm. The chapter correspondences and the four split points were checked against the Clementine Latin and against the printed 1914 John Murphy edition; the offsets were computed from the extracted verse counts against a King James Version consulted online and not retained, and every psalm inscription was read. Correction of 2026-07-31. Hebrew 13 was flagged uniform and is not. Computing the offsets from verse counts could not catch it: the Douay's Psalm 12 and the English Psalm 13 both print six verses, and the divergences cancel. The Douay's verse 1 carries the inscription together with the first line of the poem, so it takes no verse of its own and english_offset is rightly 0; but the Douay then divides \"How long shall I take counsels in my soul\" from \"How long shall my enemy be exalted over Me?\" into verses 2 and 3 where the King James and the Revised Version hold both in verse 2, and it keeps in its verse 6 what they divide between 5 and 6. Vulgate 12:4 is English 13:3. The row now reads english_offset_uniform \"no\" and the psalm is refused rather than shifted. The correction was made against the tracked Clementine, Douay-Rheims, King James and Revised Version 1895 chapter files, not against the counts."
