notes = "Triptych-compiled concordance between the Vulgate/Septuagint psalm numbering used throughout this edition and in the 1962 Missal, the Hebrew/Masoretic numbering used by the Nova Vulgata and by the New American Bible, and the English convention of the King James, Revised Standard, and most other modern English versions, which leaves the psalm inscription unnumbered. Rows are verse ranges, so the four places where one system joins or divides what the other keeps whole are exact. english_offset is the number of leading Vulgate verses occupied by the inscription; english_offset_uniform is \"no\" for the fifteen psalms where the two systems also divide the body differently, so that the offset holds only from the head of the psalm. The chapter correspondences and the four split points were checked against the Clementine Latin and against the printed 1914 John Murphy edition; the offsets were computed from the extracted verse counts against a King James Version consulted online and not retained, and every psalm inscription was read."
