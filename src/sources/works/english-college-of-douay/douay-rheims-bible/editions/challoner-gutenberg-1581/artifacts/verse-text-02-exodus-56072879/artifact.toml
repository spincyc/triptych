transformation = "Extract one verse per line from the exact Project Gutenberg bytes. Take the body between the Project Gutenberg START and END markers and stop at the \"APPENDICES\" line, so the 73 canonical books alone are read. Open a chapter at each line matching \"<Book> Chapter <n>\". Within a chapter treat every blank-line-delimited paragraph whose first line matches \"<chapter>:<verse>. \" as that verse and join its wrapped lines with single spaces; discard every other paragraph (Challoner's notes, chapter arguments, Latin incipits, book prologues, and the unnumbered \"Alleluia\" headings). Collapse runs of whitespace to one space and strip the ends. Emit \"book<TAB>chapter<TAB>verse<TAB>text\" with a header line, LF terminated, in canonical order. Three numbering corrections restore the continuous Clementine Vulgate numbering the 1962 Missal cites, each checked against the Clementine Latin and against drbo.org: Psalm 9 verses printed with the \"9a:\" prefix under the running head \"Psalm 10 according to the Hebrews\" become Psalm 9 verses 22 to 39, as the printed edition's own note on verse 21 states; the second series of Psalm 113, which the printed edition restarts at 1, becomes verses 9 to 26; and the first of two consecutive paragraphs numbered \"12:12\" in Proverbs 12 is appended to verse 11, which the Clementine gives as a two-clause verse. Nothing else is renumbered: the Douay-Rheims's own versification, including Psalm 115 numbered 10 to 19, Psalm 147 numbered 12 to 20, and the verses it merges with their neighbours, is preserved."
