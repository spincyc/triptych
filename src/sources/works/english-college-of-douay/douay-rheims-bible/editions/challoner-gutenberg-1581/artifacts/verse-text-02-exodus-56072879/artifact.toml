notes = "The Book of Exodus: 40 chapters and 1211 verses, one LF-terminated physical line per verse after a header line, so verse n of chapter c is found by its Ex<TAB>chapter<TAB>verse prefix and physical line numbers are stable. Chapter and verse numbers are the Douay-Rheims's own, which follow the Clementine Vulgate; see psalm-numbering.tsv and verse-aliases.tsv in this edition before converting a modern citation."
