notes = "One page image, leaf n1165 (scanner leaf 1172) = New Testament page 66, Luke 1:46 (left column) to 1:75 (foot of the right column), 2587x3987 pixels, colour JPEG. In this copy the binding hides up to three line-final letters of the right column in the gutter; the punctuation that ends each verse is visible. A reader's pencil marks stand against verses 46 and 55 in the left column. One leaf only."
