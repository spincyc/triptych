rights_basis = "This edition record dates the printing to 1914 from the holding library's catalogue (Internet Archive item holybibletransla00balt, Baltimore: John Murphy Co., 1914); the printing carries the approbation of James Cardinal Gibbons, Archbishop of Baltimore, who died in 1921, so on either ground it was published in the United States before 1931, and a work published there before 1931 is out of United States copyright with no term running; that line is the one guidance/missals.md section 5 records as current on 1 January 2026, written here as derived for calendar year 2026 and not as a standing rule. The English is Richard Challoner's eighteenth-century revision of the Douay-Rheims New Testament. A faithful photographic reproduction of a public-domain printing adds no original authorship of its own (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191, S.D.N.Y. 1999). The leaf carries no digitizer's stamp. The bytes are not retained, on the duplication ground guidance/sources.md gives for remote: the image is one leaf of the complete scan this edition already locates at artifact.english-college-of-douay.douay-rheims-bible.murphy-1914.internet-archive-page-images, and its optical text layer is held at artifact.english-college-of-douay.douay-rheims-bible.murphy-1914.internet-archive-ocr-text."
