provenance = "Internet Archive page rendition of one leaf of item holybibletransla00balt (Harold B. Lee Library, Brigham Young University copy), fetched over HTTPS with curl (following the 302 redirect to the item's BookReader image server) on 2026-11-27 by the first English-source lane of the postconciliar Advent research (advent-pc-en1) into its own empty directory and hashed with sha256sum; a second fetch into another empty directory the same day returned identical bytes. The leaf index was taken from the item's page-number file (holybibletransla00balt_page_numbers.json), which maps it to printed page 66; the image shows that page number. No source text passed through a language model at any point between the server and this hash."
