notes = "Uncorrected machine OCR with frequent character errors; it was used only to read printed verse numbers, running heads, and note wording, never as a witness to spelling or punctuation. It shows Psalm 9 printed as verses 1-21 followed by a series numbered 1-18 under the head \"Psalm 10 according to the Hebrews\", Psalm 113 restarting at 1 after verse 8, Psalm 115 numbered 10-19, Psalm 147 numbered 12-20, and no verse number at Genesis 5:32, 2 Kings 13:39, or Amos 9:15."
