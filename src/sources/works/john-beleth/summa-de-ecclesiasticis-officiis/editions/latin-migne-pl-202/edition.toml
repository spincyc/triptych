notes = "Registered on the pattern this library already uses for a constituent of a Migne volume: the edition is the constituent as Migne prints it, and the artifacts are the Internet Archive's derivatives of the whole volume, which is the narrowest exact witness that was actually retrieved. The printing year of the scanned copy is not established and is not asserted: the Patrologia Latina volumes were reissued repeatedly and this copy's front matter, read in the retained text layer, gives the imprint line but no legible year. Migne's title for the work is Rationale divinorum officiorum; the work record carries the modern title and both forms as aliases so that a later search on either name reaches this record rather than minting a second one."
