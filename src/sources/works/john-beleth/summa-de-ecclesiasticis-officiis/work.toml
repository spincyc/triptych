description = "John Beleth's twelfth-century summa on the ecclesiastical offices. Migne prints it under the title Rationale divinorum officiorum, which is also Durandus's title and is the alias this library resolves before minting an identity: the two works are distinct and must not be merged. Chapters LXI-LXII on the night-office cursus, read for this run at columns 67-68, pin the September historiae to the Kalends of the month by the nearest Sunday. The composition date is not established in this registration."
