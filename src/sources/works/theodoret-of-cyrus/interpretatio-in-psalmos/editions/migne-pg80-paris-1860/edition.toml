notes = "Migne's 1860 volume reprints the first volume of Johann Ludwig Schulze's Halle recension, begun in 1769, which enlarged the Greek from manuscripts, used earlier editions, and revised the Latin version; Migne states that he again reviewed the edition. The commentary is printed in Greek with that facing Latin expression. Column numbers are the stable loci; the scan's optical character recognition is only a navigation aid."
