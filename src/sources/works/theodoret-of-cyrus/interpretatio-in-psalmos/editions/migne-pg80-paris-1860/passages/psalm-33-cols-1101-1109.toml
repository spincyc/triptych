context = "Read for the Twelfth Sunday after Pentecost Gradual (Ps 33:2-3 Vulg). On the title Theodoret retells the Nob episode, identifies Abimelech with Abiathar as a man of two names, and reports but rejects the setting before Achis at Geth as not fitting the psalm's words. On v. 2: fleeing or pursuing, in good fortune or ill, I hymn my Master; on v. 3 with v. 4 he makes the sharers of his meekness sharers of his singing."
notes = "The exact registered facsimile was re-acquired on 2026-08-19 and hash-matched before reading; the argument and vv. 2-8 were read on PDF pages 585-587, and the following psalm's header at column 1109 fixes the end boundary. Antiochene reception; no evidence for the chant's selection."
