context = "The complete exposition was read for the Twelfth Sunday after Pentecost Introit (Ps 69:2-4 Vulg). Theodoret sets the psalm historically - David fleeing Absalom, stung more by the memory of his sin than by his enemies - and notes that the title's in rememorationem stands in some copies but not in the Hebrew or the other translators. On v. 2 the speaker asks swift help because many and various calamities engulf him; on v. 3 the enemies are to be cheated of their hope. Migne's apparatus at v. 2 records that the Domine ad adjuvandum clause is absent from LXX codd. Vat. and Alex. but stands in the Hebrew, Apollinaris and Augustine, and a manuscript addition printed in the notes applies the psalm to the martyrs."
notes = "The exact registered facsimile was re-acquired from the recorded Wikimedia URL on 2026-08-19 and its SHA-256 matched this artifact record before reading; the columns were read on PDF pages 746-747. Antiochene reception; no evidence for the chant's selection."
