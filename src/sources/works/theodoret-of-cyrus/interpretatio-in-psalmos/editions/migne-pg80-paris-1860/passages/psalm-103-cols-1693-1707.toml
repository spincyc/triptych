context = "Read for the Twelfth Sunday after Pentecost Communion (Ps 103:13-15 Vulg). Theodoret reads the psalm as a hymn of the one Creator's common benefits. On the appointed verses his reading is purely providential: God supplies rain so that the earth brings forth every kind of fruit - bread to strengthen and nourish human nature, wine to gladden and make life sweeter, oil to nourish within and brighten without - quoting Symmachus's clearer rendering. No sacramental turn on these verses."
notes = "The exact registered facsimile was re-acquired on 2026-08-19 and hash-matched before reading; the header and vv. 1-17 were read on PDF pages 897-901 and the following psalm's header at columns 1707-1708 fixes the end boundary. Antiochene reception, the tradition's literal pole against Cassiodorus's sacramental reading."
