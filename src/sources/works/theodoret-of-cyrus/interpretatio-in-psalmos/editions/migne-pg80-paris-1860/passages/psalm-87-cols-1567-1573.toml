context = "Read for the Twelfth Sunday after Pentecost Alleluia (Ps 87:2 Vulg). Theodoret's hypothesis: the prophecy foretells the Jews' calamities and the Babylonian servitude and at the same time teaches the pains of all human nature after sin - no Passion reading. The title is handled philologically (Symmachus per chorum; Aiman a choirmaster, citing 1 Par 6). On the appointed verse: knowing the Lord as the God of my salvation, I beg night and day that my supplication be received."
notes = "The exact registered facsimile was re-acquired on 2026-08-19 and hash-matched before reading; the header and vv. 1-4 were read on PDF pages 832-834. The end boundary near column 1573 is approximate: the next psalm's header page carried column numerals the optical text did not preserve legibly. Antiochene reception."
