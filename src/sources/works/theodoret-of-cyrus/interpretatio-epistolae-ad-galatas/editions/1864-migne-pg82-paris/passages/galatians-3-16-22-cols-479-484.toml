context = "The Greek exposition and facing Latin were read from Galatians 3:16 through 3:22. On verses 16-18 Theodoret identifies Christ as the promised Seed in the proper and unique sense because through him the nations receive Abraham's blessing; other Israelites are Abraham's natural seed but not the Seed who bears that blessing. The later Law cannot add to, subtract from, dissolve, or nullify God's prior promise. On verse 19 he says the Law was added for transgressions and for the care of the people from whom the Seed would spring according to the flesh; angels ministered and Moses served in its giving. On verses 19-20 he explicitly calls Moses the mediator between the people and God, then stresses that the one God both promised to Abraham and gave the Law. On verse 21 he denies that the Law opposes the promise or can itself supply the vivification and righteousness under discussion, while distinguishing necessary moral commands from added ceremonial observances. On verse 22 he glosses Scripture's enclosing all under sin as its conviction of those before the Mosaic Law by natural law and those under it by the Mosaic Law, so that the promised remedy and salvation may be given through faith."
notes = "This passage supports a bounded account of Theodoret's promise, Seed, Law, conviction, and mediator readings. It does not support identifying the mediator here as Christ: Theodoret names Moses. Nor should it support an unqualified claim that every command of the Law is non-vivifying or abrogated; his verse-21 explanation distinguishes necessary commands, which he calls vivifying, from additional ceremonial observances fitted to an immature people. Verification is of the Migne-Schulze witness, not a modern critical Greek text or the independent accuracy of Hervetus's translation."
