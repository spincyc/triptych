context = "Printed p. 134 opens section 17, 'The Value of the Eucharistic Sacrifice, as also the Reason and the Manner of its Efficacy.' Gihr moves from the Mass as sacrifice of praise and thanksgiving, procuring honor and glory to God, to the Mass as sacrifice of propitiation and petition, obtaining graces and blessings for humanity. Note 2 then quotes the complete Secret for the Tenth Sunday after Pentecost: 'Tibi, Domine, sacrificia dicata reddantur: quae sic ad honorem nominis tui deferenda tribuisti, ut eadem remedia fieri nostra praestares (Secreta Dom. X. post Pent.).' The note is direct theological reception of the prayer; Gihr's surrounding fourfold account must not be presented as four categories expressly stated by the Secret."
