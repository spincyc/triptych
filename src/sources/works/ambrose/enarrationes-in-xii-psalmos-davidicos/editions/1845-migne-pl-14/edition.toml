notes = "Migne's reprint of the Maurist text, not a modern critical edition; the critical edition is Michael Petschenig's CSEL 64, which was not consulted. Migne reissued Patrologia Latina 14 in 1882 with column numbers that diverge from the 1845 printing, and the Documenta Catholica Omnia file registered here does not state which printing it reproduces, so every column citation taken through it carries that bound. Language pairing: this is the work's original Latin; no English translation was retrieved in the sweep that produced this record, and the modern English of Ide M. Ni Riain is under copyright and was not sought."
