notes = "Complete work in 138 page images covering PL 14 cols. 921A-1180D, which is the extent the host's own catalogue page states. Two Migne columns to a PDF page, so col = 2p + 961 and the enarratio on Psalm 39 opens at col. 1109 on PDF page 74. No text layer: pdftotext returns nothing and all reading was done from the images. Not retained: the host's PDF, because Documenta Catholica Omnia reserves rights in its electronic edition and the file is 54.6 MB, larger than the whole of this library's retained payload by a wide margin. A reader without the network cannot open it from a checkout; the wording a claim depends on must be quoted into the claim's own passage record."
