title = "Enarrationes in XII Psalmos Davidicos"
responsible = "Ambrose of Milan"
work_type = "patristic-psalm-exposition-collection"
composed = "c. 387-397"
composed_basis = "The surviving expositions were preached and written in Ambrose's Milanese episcopate, which ran from 374 to his death in 397, and the enarratio on Psalm 43 was left unfinished at his death; the collection is conventionally placed in his last decade. The date is the preaching and writing, not Migne's nineteenth-century printing."
alternate_titles = ["Explanatio psalmorum XII", "Enarrationes in duodecim psalmos Davidicos", "Explanatio super psalmos XII"]
languages = ["la"]
locus_pattern = '(?:1|3[5-9]|40|43|45|47|48|61)\.(?:[1-9]|[1-4][0-9])(?:-(?:[1-9]|[1-4][0-9]))?'
description = "Ambrose's surviving expositions of twelve psalms: 1, 35-40, 43, 45, 47, 48 and 61. The collection is not a commentary on the whole Psalter, and an absence from it is an absence from those twelve psalms only. Of the four psalms appointed in the Fifteenth Sunday after Pentecost only Vulgate Psalm 39, the Offertory's, is expounded here; Psalms 85, 91 and 94 are not in the collection at all. A locus is Vulgate psalm number followed by the numbered section."
