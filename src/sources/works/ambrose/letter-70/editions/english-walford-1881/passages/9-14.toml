context = "Sections 9-14, printed pp. 414-416, were read with the opening of the Micah exposition at section 2. In section 9 Ambrose says Bethlehem is the house of bread because it received the Bread that came down from heaven; sections 13-14 extend the image to the faithful soul and explicitly parse Beth as house and lehem as bread. The publication uses only the bounded Bethlehem/Bread conjunction, not Ambrose's other etymological claims as modern philology."
