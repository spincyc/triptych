notes = "ACCESS LIMITATION: the whole 31,738,034-byte scan is not retained, for its measured size; it has no text layer, and the remote DjVu optical text ia-djvu-ocr-expositioevange00schegoog (whose bytes are identical to this item's _djvu.txt, SHA-256 b7b25e52...45c8, rechecked 2026-11-18) locates pages. GOOGLE FRONT MATTER: artifact PDF page 1 is Google's usage-guidelines page (DjVu optical lines 1-46), Google's and not the book's. PDF page 2 is the binding; PDF page 3 the Andover-Harvard Theological Library bookplate (bequest of Robert Swain Morison), the owning library's and not the book's; PDF page 8 is the series title page: CORPVS SCRIPTORVM ECCLESIASTICORVM LATINORVM EDITVM CONSILIO ET IMPENSIS ACADEMIAE LITTERARVM CAESAREAE VINDOBONENSIS / VOL. XXXII / S. AMBROSII OPERA / PARS IIII / EXPOSITIO EVANGELII SECVNDVM LVCAN / EX RECENSIONE CAROLI SCHENKL, with a Harvard library stamp. PAGE RULE, measured at printed pages 47, 52, 55, 56 and 87: printed page n of the text is PDF page n + 53. Each text page's running head gives the book and sections it carries and the Maurist (Migne PL 15) columns in parentheses, e.g. printed page 55: Expositio euangelii Lucae II 24-27 (1289 E-1290 E). Section numbers stand in the left margin on the line where the section begins; printed line numbers by fives and the Maurist column letters stand in the right margin; scriptural references and the critical apparatus stand at the foot."
