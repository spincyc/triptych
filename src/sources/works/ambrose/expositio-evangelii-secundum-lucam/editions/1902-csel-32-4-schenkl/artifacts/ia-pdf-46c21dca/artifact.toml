rights_basis = "The volume was published at Prague, Vienna and Leipzig in 1902 (title page, artifact PDF page 8, read on the image: PRAGAE F. TEMPSKY / VINDOBONAE F. TEMPSKY / LIPSIAE G. FREYTAG / MDCCCCII), and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A could not reach it: ninety-five years from 1902 ran out in 1997. The scan is Google's digitization of a Harvard (Andover-Harvard Theological Library) copy; a faithful mechanical reproduction adds no original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191, S.D.N.Y. 1999). Google's usage-guidelines page is artifact PDF page 1, and is Google's prose, not the book's; it is kept in the exact bytes and disposed of under src/sources/inventories/google-usage-guidelines-rights-v1.toml, never quoted, cited or counted as Schenkl's or Ambrose's text and not licensed under Triptych's licence. No Digitized by Google page-foot stamp was seen on the pages read (PDF pages 8, 100, 105, 108, 109), and the volume's DjVu optical text returns no match for Digitized. No search for a non-Google scan of the same printing was made in this lane; storage is decided on size, and a non-Google scan, if one is found, is to be preferred under that rule when equally complete and legible."
