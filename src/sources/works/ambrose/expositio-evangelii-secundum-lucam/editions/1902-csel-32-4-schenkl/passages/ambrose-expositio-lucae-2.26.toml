notes = "CSEL AGAINST MIGNE (the R3 dossier's wording): no word differs within the dossier's quoted extent. Differences are orthographic and of punctuation only: dei uerbum for Dei Verbum with no comma before et opera; dominum, sit for Dominum: sit; Christi, secundum for Christi; secundum; Christus; omnis for Christus. Omnis (the dossier stops at Christus). The section continues omnis enim anima accipit dei uerbum, si tamen inmaculata et inmunis a uitiis intemerato castimoniam pudore custodiat, which the dossier does not quote. PAGE: the marks after Mariam, dominum and Christi are broken sorts that show on the scan almost as full stops even at 600 dots per inch; they are transcribed as commas, as the run of the sentence and the optical text both have them, and that judgement is recorded here. Apparatus for these lines: 10 dm X; 11 dno PG; 14 uitiis est X, uitiis sit G, uitiis sit et T; 15 custodiatque eum X. CATENA: the Catena Aurea's Ambrose on Luke 1:46-47 (passage ambrose-on-luke-1-46-47 of the 1843 Oxford Catena on Luke) keeps only the spiritus clause, si secundum carnem and omnis enim anima accipit (rendered receives) of this section, dropping quaecumque enim crediderit anima et concipit et generat dei uerbum and sit in singulis Mariae anima, ut magnificet dominum, and prefixes the close of section 27 (p. 56)."
