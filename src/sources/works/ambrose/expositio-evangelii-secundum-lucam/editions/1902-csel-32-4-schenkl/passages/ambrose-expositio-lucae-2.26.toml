context = "CSEL 32/4 printed page 55, lines 5-15 (PDF page 108). The whole of section 26 of book II, on Elizabeth's beata quae credidisti (Luke 1:45) and the soul of Mary in each believer: it opens with the letter-spaced lemma et beata quae credidisti, on the line where Schenkl's marginal 26 stands, and ends at custodiat, before section 27 quaecumque igitur talis esse potuerit anima. The page's running head reads Expositio euangelii Lucae II 24-27 (1289 E-1290 E)."
physical_line_ranges = [[1, 8]]
text = "et beata quae credidisti. uides non dubitasse Mariam, sed credidisse et ideo fructum fidei consecutam. beata inquit quae credidisti. sed et uos beati, qui audistis et credidistis; quaecumque enim crediderit anima et concipit et generat dei uerbum et opera eius agnoscit. sit in singulis Mariae anima, ut magnificet dominum, sit in singulis spiritus Mariae, ut exsultet in deo, si secundum carnem una mater est Christi, secundum fidem tamen omnium fructus est Christus; omnis enim anima accipit dei uerbum, si tamen inmaculata et inmunis a uitiis intemerato castimoniam pudore custodiat."
