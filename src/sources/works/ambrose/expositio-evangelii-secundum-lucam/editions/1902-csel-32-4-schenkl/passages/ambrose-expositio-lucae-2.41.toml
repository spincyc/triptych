notes = "APPARATUS at the foot of page 64 for these lines, as printed: the words ut tu mortis ... praesepio stand in the margin of P; mortis laqueis absolutus PaCLX, sis mortis laqueis absolutus A, mortis laqueis absolutus sis chi, mortis laqueis absoluaris B; praesepio P (in quo mox ut tu in ras.) L; stellis V (in mg. celis), caelis alpha chi; eodem LX; deuersurio P, diuersorio B (di ex de) cet.; caelestibus sedibus PL, cf. Ephes. 2, 6; illa] illius E gamma T; me illi] ille P, illius alpha C; uagientes X; meae F; sum om. PL; nisi] si A. So the Maurist-Migne wording of this sentence (in praesepio for in praesaepibus, a finite verb with absolutus, illius for illi) is attested in Schenkl's apparatus but is not his text. PAGE READING: a small mark after illa on page 64 line 7 is a speck, not a letter or apostrophe; the apparatus lemma illa] confirms the word. Letter-spaced scriptural words (qui cum diues esset, propter uos pauper factus est, ut illius inopia uos ditaremini) are transcribed without the spacing. OCR AGAINST PAGE (ia-djvu-ocr-expositioevange00schegoog lines 5480-5517): word differences, optical text first: illa' for illa; infirraitas for infirmitas; lesu for Iesu; it also interleaves marginal, running-head or other-column text (2 loh 1 3 3 loh 1 9 5 loh 1 10 sq 6 loh 1 14 7 loh 1 30 10 l; E; 5; F ...)."
