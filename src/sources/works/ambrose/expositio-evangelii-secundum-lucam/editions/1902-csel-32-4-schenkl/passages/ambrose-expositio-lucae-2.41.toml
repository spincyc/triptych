context = "CSEL 32/4 printed pages 63 (last line) and 64, lines 1-12 (PDF pages 116-117), Maurist column letters D (page 63) and E and F (page 64) in the margin; the running head of page 63 reads Expositio euangelii Lucae II 39-41 (1294 D-1295 D). The second half of section 41 of book II, on Luke 2:7, from ille igitur paruulus (the last line of page 63) to the end of the section, non prodesset nasci, nisi redimi profuisset; section 42 (Sed nemo) follows. Section 41 opens on page 63 line 16 with nec quemquam mouere debet, on why John passed over Christ's infancy and Luke describes it."
physical_line_ranges = [[1, 11]]
text = "ille igitur paruulus, ille infantulus fuit, ut tu uir possis esse perfectus: ille inuolutus in pannis ut tu mortis laqueis absolutus: ille in praesaepibus, ut tu in altaribus: ille in terris, ut tu in stellis: ille alium locum in eo deuersorio non habebat, ut tu plures haberes in caelestibus mansiones. qui cum diues inquit esset, propter uos pauper factus est, ut illius inopia uos ditaremini. meum ergo paupertas illa patrimonium est et infirmitas domini mea uirtus est. maluit sibi egere, ut omnibus abundaret. me illi infantiae uagientis abluunt fletus, mea lacrimae illae delicta lauerunt. plus igitur, domine Iesu, iniuriis tuis debeo quod redemtus sum quam operibus quod creatus sum. non prodesset nasci, nisi redimi profuisset."
