notes = "The quoted extent ends at a comma, mid-sentence, after the Isaiah citation. The Catena on Luke 2:7 (Oxford English, p. 68) renders propter te infirmitas, in se potentia as On thy account then am I weak, in thee am I strong: Schenkl's text reads in se (in himself), so the Catena's in thee follows a different reading or rendering; the apparatus records no variant at in se. APPARATUS at the foot of page 64 for these lines: carnis est (om. est ante gloria) chi; gloriae (e exp. m2) P; inopia (a ex o) P; opulentiam (m eras.) P; noli* alpha, non (in mg. m3 noli) A; uagitum X; boues X; dno A; agnoscentes F et (-is corr. m1) PG, cognoscentis L; mugitum L. Letter-spaced scriptural words are transcribed without the spacing. OCR AGAINST PAGE (ia-djvu-ocr-expositioevange00schegoog lines 5518-5556): word differences, optical text first: infantiS for infantis; eDim for enim; it also interleaves marginal, running-head or other-column text (15; 1296; 2 Ps 17 6 4 loh 14 2 5 II Cor 8 9 2 ut tu mortis praesepio i)."
