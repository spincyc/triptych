text = "Sed nemo intra usum corporis formam omnem diuinitatis includat. alia natura carnis, alia diuinitatis est gloria. propter te infirmitas, in se potentia; propter te inopia, in se opulentia. noli hoc aestimare quod cernis, sed quod redimeris agnosce. quia in pannis est uides, quia in caelis est non uides. infantis audis uagitus, non audis bouis dominum agnoscentis mugitus; agnouit enim bos possessorem suum et asinus praesaepe domini sui,"
