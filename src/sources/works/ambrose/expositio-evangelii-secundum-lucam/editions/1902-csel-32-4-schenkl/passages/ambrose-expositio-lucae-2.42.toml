context = "CSEL 32/4 printed page 64 lines 13-18 and page 65 lines 1-2 (PDF pages 117-118), the margin of page 64 marks Maurist column 1296 at line 16 (noli hoc aestimare), and the running head of page 65 reads Expositio euangelii Lucae II 42-43 (1295 E-1296 C). The opening of section 42 of book II, from Sed nemo to praesaepe domini sui, (Isaiah 1:3); the sentence continues immo praesaepium dixerim, sicut scripsit qui transtulit, a digression on the word, and the section ends with the ass fed at the holy mangers."
