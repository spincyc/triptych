notes = "CSEL AGAINST MIGNE (the R3 dossier's Wikisource/PL 15 wording): no word differs within the dossier's quoted extent. Differences are orthographic and of punctuation only: uoto for voto; lower-case deo and spiritus; no comma before in montana perrexit (Migne festina pro gaudio, in montana); no comma before nisi (Migne Deo plena, nisi). Apparatus at the foot of the page for these lines: 9 exemplo (v. l. exemplum C), sterelisque P, 16 sps sci X (abbreviation only); none touches the quoted sentences' sense. OCR AGAINST PAGE: the optical text reads these lines correctly except for layout noise."
