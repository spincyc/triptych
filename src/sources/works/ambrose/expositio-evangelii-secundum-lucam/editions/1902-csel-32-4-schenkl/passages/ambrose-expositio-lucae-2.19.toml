context = "CSEL 32/4 printed page 52, lines 6-16 (PDF page 105), Maurist column 1288 D-E in the margin. The whole of section 19 of book II, on Mary's journey into the hill country (Luke 1:39-40): it opens after the letter-spaced lemma Exsurgens autem Maria ... salutauit Elisabet and ends at gratia, before section 20 discite et uos, sanctae mulieres. Schenkl's marginal 19 stands on the line where morale est begins and his 20 on the line where discite begins, so nescit tarda molimina sancti spiritus gratia closes section 19."
physical_line_ranges = [[1, 5]]
text = "morale est omnibus, ut qui fidem exigunt fidem adstruant. et ideo angelus cum abscondita nuntiaret, ut fides adstrueretur exemplo, senioris feminae sterilisque conceptum uirgini Mariae nuntiauit, ut possibile deo omne quod ei placuerit adsereret. ubi audiuit hoc Maria, non quasi incredula de oraculo nec quasi incerta de nuntio nec quasi dubitans de exemplo, sed quasi laeta pro uoto, religiosa pro officio, festina pro gaudio in montana perrexit. quo enim iam deo plena nisi ad superiora cum festinatione contenderet? nescit tarda molimina sancti spiritus gratia."
