notes = "Schenkl's critical edition, the standard nineteenth-century text of the Expositio and the one modern citations of it by page normally mean. It is a different textual authority from Migne's Patrologia Latina 15, and its pages and Migne's columns must not be interchanged. Only an Internet Archive optical text of the volume is registered here; no page image and no printed copy was consulted. Language pairing: this is the work's original Latin; no English translation of the Expositio was retrieved in the sweep that produced this record, and the modern English of Ide M. Ni Riain is under copyright and was not sought."
