notes = "A dated delivery state of a transcription of Migne, not a critical edition. It is the same delivery route as edition.ambrose.expositio-evangelii-secundum-lucam.latin-migne-corpus-corporum-web-2026-07-25, which holds book X from the earlier consultation; this edition holds books I-IX from the consultation of 2026-09-05, so the two together carry the whole work and each remains a dated state of its own day. Each page's own header identifies it as the Corpus Corporum transcription of Migne 1845. Consumers needing a critical text must use Corpus Christianorum, which was not consulted. Migne's 1845 and 1887 printings of Patrologia Latina 15 carry different column numbers for the same text and must be distinguished when columns are cited. Language pairing: this is the work's original Latin; no English translation of the Expositio was retrieved in the sweep that produced this record, and the modern English of Ide M. Ni Riain is under copyright and was not sought."
