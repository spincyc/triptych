notes = "Complete raw wikitext of book VII of the ten, the whole book in one response. Wikitext, not a facsimile: Migne's column numbers are embedded as page markers and the file carries wiki template and link syntax, so a raw-line literal search matches markup as well as Latin. Retention note: the sibling record for book X, artifact.ambrose.expositio-evangelii-secundum-lucam.latin-migne-corpus-corporum-web-2026-07-25.wikisource-liber-x-2868e872, keeps the same kind of bytes remote. That record is left as it stands; these are retained because their rights basis is affirmative, the files are small, and this work carries the formulary's decisive Latin patristic witness on the appointed Gospel, which a reader with no network must be able to reopen."
