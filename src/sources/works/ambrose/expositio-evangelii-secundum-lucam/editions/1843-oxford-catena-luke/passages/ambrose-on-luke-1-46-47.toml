text = "But let every one have the spirit of Mary, so that he may rejoice in the Lord. If according to the flesh there is one mother of Christ, yet, according to faith, Christ is the fruit of all. For every soul receives the word of God if only he be unspotted and free from sin, and preserves it with unsullied purity."
