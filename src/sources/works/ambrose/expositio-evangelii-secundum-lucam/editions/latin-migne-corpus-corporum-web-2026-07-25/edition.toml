notes = "A dated delivery state of a transcription of Migne, not a critical edition. The file was checked for the automated Italian spelling corruption that affects some other files on the same site and was clean. Consumers needing a critical text must use the relevant Corpus Christianorum edition, which was not consulted. Migne's 1845 and 1887 printings of Patrologia Latina 15 carry different column numbers for the same text and must be distinguished when columns are cited."
