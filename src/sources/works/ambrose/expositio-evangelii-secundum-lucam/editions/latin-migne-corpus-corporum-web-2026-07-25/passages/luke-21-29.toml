text = "Diverso quidem modo, in unum tamen concurrere videtur Evangelistarum sententia; Matthaeus enim de sola dixit ficulnea, cum ramus ejus tener fuerit (Matth. XXIV, 32): hic de arboribus omnibus. Verum sive cum fructus in omnibus virescit arboribus, et ficulnea fecunda jam floret, ut omnis lingua confiteatur Deo, confitente etiam populo Judaeorum; sperare Domini debemus adventum, quo tamquam temporibus aestivis resurrectionis fructus metentur: sive cum levem fragilemque jactantiam homo iniquitatis tamquam folia Synagogae ramus, induerit, conjicere debemus appropinquare judicium: nam remunerare fidem Dominus, et delinquendi finem afferre festinat. Duplicem igitur habet figuram haec ficulnea, vel cum dura mitescunt, vel cum peccata luxuriant. Nam per fidem credentium quae arebant ante, florebunt: et per gratiam delictorum peccatores gloriabuntur: ibi fructus est fidei, hic perfidiae lascivia. Fructum mihi ficulneae agricolae Evangelici (Luc. XIII, 9) cultura promittit, desperare non debemus, si foliis ficulneae peccatores se tamquam fraudis veste texerunt, ut conscientiam velarent: ergo folia suspecta sine fructu. Tales vestes paradisi exsules habent (Gen. III, 7)."
