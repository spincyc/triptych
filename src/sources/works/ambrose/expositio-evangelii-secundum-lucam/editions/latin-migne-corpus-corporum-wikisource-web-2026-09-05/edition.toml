notes = "A dated delivery state distinct from the 2026-07-25 state already registered on this work, which holds book X alone. Books VII, VIII and IX are registered here: book VII carries the comment on Luke 14 at sections 195-196, and VIII and IX are the negative boundary. Migne's 1845 and 1887 printings of the Patrologia carry different column numbers for the same text and must be distinguished when columns are cited. No English edition of the Expositio is registered on this work; none was retrieved in this run, and the pairing gap is recorded rather than left to look like completeness."
