description = "Ambrose's exposition of Luke in ten books, from about 389. Book X covers the passion and resurrection. The book has no lemma on Luke 24:12 and never mentions the burial cloths at the empty tomb; it does treat the theft allegation, on the different ground of the Jews' own testimony, and it asserts at section 179 that Peter could not have doubted. A locus is book.section or the book number alone."
