notes = "The work occupies six wiki pages, one to a book, and the current revision of each at retrieval was 267618, 225563, 225564, 225567, 225572 and 225570 for books I to VI in order. The pages carry the Corpus Corporum encoding note recording that the file was encoded in TEI XML for the University of Zurich's Corpus Corporum project from Migne's Patrologia Latina tomus 14; that is the encoder's statement about the file and is not part of Migne, and the transformation removes it."
