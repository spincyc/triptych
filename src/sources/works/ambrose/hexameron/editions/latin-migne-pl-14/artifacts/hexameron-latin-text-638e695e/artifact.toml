provenance = "Derived on 2026-08-01 from the hashed export above by the tracked script named in transformation. No model stood anywhere in the path: the bytes were fetched with curl, hashed, and transformed locally. The file holds 223 lines, one per printed paragraph, each prefixed by a braced locator giving the book and the chapter of Migne's own division. Book I stands at lines 1-50, II at 51-71, III at 72-116, IV at 117-138, V at 139-198 and VI at 199-223."
