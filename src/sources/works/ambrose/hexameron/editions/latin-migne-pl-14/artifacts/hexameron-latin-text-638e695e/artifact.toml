transformation = "python3 scripts/migne_transcribe.py <export> --unit page --out ambrosius-hexameron.txt, run over the exact bytes of the parent artifact. The script removes every wiki template whole except the closed table of prose-bearing ones it unwraps to a named parameter, and removes the Patrologia Latina navigation line, the Corpus Corporum encoding note, categories, footnote bodies, comments, tags and wiki headings; unwraps links; folds typographic punctuation to ASCII; strips Migne's inline column markers; normalises to NFC; collapses runs of whitespace; and writes one LF-terminated UTF-8 line per source paragraph, prefixed by a braced book-and-chapter locator taken from the printing's own CAPUT divisions."
