notes = "Migne's reprint of the Maurist text, complete in six books, each divided into capita with the Maurists' own argument standing at the head of each. Those arguments are topical rather than verse-keyed, unlike the arguments Migne prints over the books of De Genesi ad litteram, so each book's scriptural extent is declared here from the day it expounds and from the lemmata it quotes, both carried in the transcription. No public-domain English translation of this work exists: J. J. Savage's, Fathers of the Church 42, 1961, is the first complete one and is in copyright, so the work is held in Latin only and the site says so."
