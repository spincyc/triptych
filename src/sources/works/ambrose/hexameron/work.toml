schema = 1
record_type = "work"
id = "work.ambrose.hexameron"
title = "Hexameron"
responsible = "Ambrose of Milan"
work_type = "biblical-commentary"
composed = "c. 386-390"
composed_basis = "Preached at Milan as nine Lenten homilies and published by Ambrose as six books. The homilies are conventionally placed in Holy Week of 386 or 387 and the published redaction within a few years of it; no source this project holds fixes the year, so the range is recorded rather than a point. The date is the preaching and the publishing, not Migne's 1845 printing."
alternate_titles = [
  "Hexaemeron",
  "Exameron",
  "Hexameron libri sex",
  "Six Days of Creation",
]
languages = ["lat"]
locus_pattern = '[1-6]'
description = "Ambrose's exposition of the six days, preached in Lent and published in six books, one to a day. It follows Basil's Hexaemeron closely enough that Bede's preface names the two together, and departs from it constantly in the natural history and in the moral application Ambrose draws from every creature. It reaches the sixth day and the making of man and stops: nothing in it expounds Genesis 2 or 3 beyond the closing chapter on how God is said to have rested."
