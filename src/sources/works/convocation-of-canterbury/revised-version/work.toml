description = "The revision of the Authorized Version resolved on by the Convocation of Canterbury in February 1870 and carried out by two companies of British revisers, corresponding with an American committee. The New Testament appeared in 1881, the Old Testament in 1885, and the Apocrypha, revised by three further companies, in 1895. It is a revision of the King James translation and not a new one, so it keeps that translation's eighty-book Protestant canon and its book order, and it is registered here beside the King James Version rather than folded into it because its wording, its underlying Greek text, and its treatment of verses absent from the older manuscripts all differ. The New Testament revisers worked from an eclectic Greek text closer to Westcott and Hort than to the Textus Receptus, and they omitted verses the Vulgate and the Authorized Version carry, printing the verse number with a note that the words are omitted by the best authorities. This is the only witness in this library of the 1895 Apocrypha, and the only English text here that prints the Greek additions to Esther under the Vulgate's own chapter numbers. A locus is BookToken.chapter.verse, optionally with a closing verse or chapter.verse after a hyphen. Chapter and verse numbers are the Hebrew and Greek ones, never the Vulgate numbers the 1962 Missal cites, except in the Rest of Esther, which keeps the Vulgate's 10:4 through 16:24. Psalm numbers follow the Masoretic series and a psalm's inscription is printed unnumbered. The book tokens, the names they answer to, and the naming traps are registered in the book index of each edition. Registered under the Convocation that ordered the revision rather than under the Church of England, whose namespace this library reserves for the Authorized Version and its own work records; the two works are related and the relation is declared here."
