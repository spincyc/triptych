notes = "All rows are derived from the tracked deuterocanon numbering concordance and cover Esther, Ecclesiasticus and Daniel. An empty resolves_to means a citation naming that locus cannot be answered from this edition, whatever it prints at those numbers; a filled one names the locus that carries the cited words. No verse of this edition is merged away, and the verses the revisers omitted carry no text at all and refuse for want of the verse; they are listed in the book index."
