provenance = "Created by Triptych on 2026-07-31 and rewritten the same day when the deuterocanonical numbering was compiled verse by verse. Rows are derived, not written: `python3 scripts/_deuterocanon.py <edition>` expands the tracked deuterocanon numbering concordance against this edition's own verse text, and tools/tests/test_deuterocanon.py fails if the tracked rows and the derivation disagree. The concordance is validated when it loads, against the verses it was compiled from: no chapter ceiling appears anywhere in it, and every row records the opening words of each run and is refused if the witness no longer prints them. This edition is the witness for the greek arrangement, so its rows are the concordance's vulgate-to-greek side unchanged. Vulgate Daniel 3:24-90 is the separate book SgThree, and the correspondence is not an offset: Vulgate 3:52 carries both blessings SgThree numbers 29 and 30 and so refuses, and from Vulgate 3:53 to 3:78 the two traditions order the Benedicite differently and realign at 3:79. Vulgate 3:67, 3:68 and 3:69 refuse because this edition does not print SgThree 45, 46 and 49, which the King James does. Vulgate 3:91-97 is this edition's own 3:24-30, 3:98-100 is its 4:1-3, and its chapter 4 runs three verses behind. Daniel 13:1-64 is Susanna, 13:65 is Bel 1, and Bel runs one verse ahead of Vulgate Daniel 14 throughout, so Vulgate 14:42 has no counterpart. Esther 10:4-16:24 is the separate book EsthGr under the Vulgate's own numbers, except in chapter 15, where Vulgate 15:1-3 is absent, 15:13-14 is the single EsthGr 15:10 and 15:15 is EsthGr 15:11-12. The earlier statement in this record that a Vulgate citation of Esther 13 or 14 already reached EsthGr correctly was wrong and is withdrawn: index-bible resolves the book before the chapter, so such a citation reaches token Esth, finds no chapter 13, and refuses before any alias is consulted. The rows are tracked and will fire when that is corrected; see guidance/versification.md section 7.9. Ecclesiasticus is withheld whole but for 36:18, the introit Da pacem Domine sustinentibus te, which is this edition's 36:16; its own 36:18 is the proverb of the belly, which is what a citation of it returned until now. The Vulgate and the Greek divide that book differently in all fifty-one chapters and no verse-level correspondence has been established."
