provenance = "Created by Triptych on 2026-07-31. This edition merges no verses, so every row is of the other kind: a locus a citation may name that this edition cannot answer at those numbers, recorded because the edition prints real text there and a lookup would otherwise return it. Only the overlap needs a row. Vulgate Daniel 3:24-90 is the Greek addition, which this edition prints as a separate book; its own Daniel 3 runs to verse 30, so 3:24-30 are recorded here and 3:31-90 refuse for want of the verses. The correspondence with the separate book is deliberately not asserted: it is not a uniform offset, so a resolution would have to be checked verse by verse against a Greek witness this library does not hold, and a refusal is the only answer that cannot be mistaken for the text. No row is needed for a verse the revisers omitted — Matthew 17:21, Mark 9:44, John 5:4 and the rest — because those numbers carry no text in this edition at all and refuse for want of the verse; they are listed in the book index. No row is needed for the Greek additions to Esther either: this edition prints them as a separate book under the Vulgate's own chapter numbers 10:4-16:24, so a Vulgate citation of Esther 13 or 14 reaches them correctly under token EsthGr."
