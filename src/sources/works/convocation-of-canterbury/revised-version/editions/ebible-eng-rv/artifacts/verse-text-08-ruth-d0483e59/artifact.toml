notes = "Ruth (Ruth): 4 chapters and 85 verses, one LF-terminated line per verse after a header line. Chapter and verse numbers are this edition's own, which are the Hebrew and Greek ones except in the Rest of Esther, where they are the Vulgate's; they are not the Vulgate numbers the 1962 Missal cites. The book index records where they differ and which verses the revisers omitted."
