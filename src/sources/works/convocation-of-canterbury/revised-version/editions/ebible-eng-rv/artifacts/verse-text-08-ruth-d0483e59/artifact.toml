transformation = "Parse the USFM of eBible.org's eng-rv release into one verse per line. Read \\c for the chapter and \\v for the verse, join a verse's continuation lines with single spaces, and take the text between one \\v and the next. Drop the content of \\f footnotes and \\x cross references entirely — the revisers' marginal notes and alternative renderings are editorial matter and not scripture — and drop the whole of every heading-class marker with its text: \\s section headings, \\ms major-section headings, \\d psalm inscriptions, and the \\id, \\h, \\toc and \\mt identification block, because a heading standing between two verses is not part of either and would otherwise be joined to the verse before it. Unwrap character markup such as \\add, \\nd and \\wj, keeping the words it encloses, and discard every remaining marker, which is paragraph and poetry structure rather than text. A marker leaves a space behind only where it separated two words, so that an italicised supplied word standing before a comma does not print a space before the comma. Collapse runs of whitespace to one space and strip the ends. Emit \"book<TAB>chapter<TAB>verse<TAB>text<TAB>usfm\" with a header line, LF terminated. A verse the revisers omitted, which this release prints as a verse number carrying nothing but a note that it is omitted by the best authorities, becomes no line at all rather than an empty one: those numbers are absent from this text and a citation of them refuses. Book tokens, ordinals and file names are those registered for the eBible.org eng-kjv edition of the King James Version, because this is a revision of that translation carrying the same eighty books in the same order; the mapping is by USFM book code and not by file order, and every book's chapter count was checked against that edition before the mapping was accepted."
