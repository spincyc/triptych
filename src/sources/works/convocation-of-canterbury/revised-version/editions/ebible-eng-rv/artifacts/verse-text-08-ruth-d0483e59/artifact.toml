rights_basis = "eBible.org publishes this release with the copyright statement “Public Domain” and the words “This work is in the Public Domain. You may copy and use it freely.” The Revised Version New Testament was published in 1881, the Old Testament in 1885 and the Apocrypha in 1895, so it is out of copyright in the United States and everywhere its term runs from publication or from the death of revisers who all died long before 1955. One limit must not be lost in later reuse, and it is the same limit the King James Version carries in this library: inside the United Kingdom the Crown holds a perpetual right in the Authorized Version and its revisions by letters patent, and printing or importing printed copies there is reserved to the Queen's Printer and the university presses. Every manifest under this edition records rights_jurisdiction United States and names that exception rather than claiming the text is free everywhere. This derivative contains only the scripture text with a mechanical reference column, and none of the revisers' marginal notes, alternative renderings, section headings, or front matter."
rights_jurisdiction = "United States"
