notes = "eBible.org distributes this text as \"Revised Version with Apocrypha (1895)\" and marks it public domain. It is the complete Revised Version: the 1881 New Testament, the 1885 Old Testament, and the 1895 Apocrypha, which is the part this library has no other witness of. Its canon is the King James one, eighty books in the Authorized Version order, and its tokens are deliberately the tokens registered for the eBible.org eng-kjv edition so that one citation resolves to the same book in either. Four things about it must not be lost in reuse. First, its rights are jurisdictional. The text is public domain in the United States and everywhere outside the United Kingdom, but inside the United Kingdom the Crown holds a perpetual right in the Authorized Version and its revisions by letters patent, and printing or importing printed copies there is reserved to the Queen's Printer and the university presses; every manifest under this edition records rights_jurisdiction United States and names that exception rather than claiming the text is free everywhere. Second, the revisers omitted verses the Vulgate and the Authorized Version carry, printing the verse number with a marginal note that the words are omitted by the best authorities: Matthew 17:21, 18:11 and 23:14, Mark 7:16, 9:44, 9:46, 11:26 and 15:28, Luke 17:36 and 23:17, John 5:4, Acts 8:37, 15:34, 24:7 and 28:29, Romans 16:24, and twenty-three loci of Ecclesiasticus. Those numbers carry no text in the tracked verse tables, so a citation of them refuses for want of the verse rather than resolving to a neighbour, and a range that crosses one refuses with it. Third, its canon is not the Catholic one. The Apocrypha adds 1 Esdras, 2 Esdras and the Prayer of Manasses, which Trent did not receive, and it prints the Greek additions to Esther and Daniel as four separate books rather than inside the books the Vulgate integrates them into; Tobit, Judith and Ecclesiasticus follow the Greek division rather than the Vulgate's. Its 2 Esdras restores the long passage at 7:36-105 that the King James Apocrypha lacks, 944 verses against 874, so it is the better witness of that book. The one place its numbering favours a Vulgate citation is the Rest of Esther, which keeps the Vulgate's own 10:4 through 16:24: the 1962 Missal's Esther 13:9-11 and 14:12-13 resolve here under token EsthGr, where the King James Version resolves them too and the World English Bible Catholic Edition cannot. Fourth, its psalter is Masoretic and not any Latin recension, its psalm numbers are the Hebrew ones, and it prints a psalm's inscription unnumbered, so its verse numbers run one or two lower through the body of most psalms than the numbers a title-numbering calendar prints, and it must never be used to check a chant incipit or a Latin proper. NUMBERING WARNING, and it is the most consequential thing on this record. Outside the psalter, tools/index-bible resolves a citation against this edition using the chapter and verse numbers the calendar printed, with no conversion, because it holds no book-by-book concordance between the Vulgate's numbering and the Greek and Hebrew numbering this edition follows. The two do not always agree, and where they do not a 1962 Missal citation resolves here to a neighbouring verse instead of refusing. The chapters where they were measured to disagree, comparing every verse of this edition against the Douay-Rheims Challoner verse of the same number on 2026-07-31, are: 1 Thessalonians 4, 2 Thessalonians 2, Acts 7 and 14, Amos 6, Baruch 3, Ecclesiasticus 3, 15, 27, 28, 35 and 36, Isaias 45, John 6, Josue 5, Mark 9, Matthew 17, Micheas 5, Numbers 20, Osee 14, and Wisdom 6 and 11. That measurement is a machine comparison of wording and is a lead, not a verified verse-for-verse table; only the Daniel and Ecclesiasticus divergences named above were checked by reading, and only those are withheld in the verse-alias table. The same divergence affects every edition in this library that numbers from the Greek and the Hebrew, the King James Version included, and it is a property of the indexing machinery rather than of this text. Until a per-calendar mechanism exists, a consumer resolving a Vulgate-numbered citation in one of those chapters must check the verse against the Clementine Vulgate or the Douay-Rheims registered here before relying on it."
