context = "The printed superscription of Psalm 70 names David, the sons of Jonadab, and the former captives. Its verse-1 note explains the Septuagint addition through the Rechabites and those first carried into captivity, ending that statement with Challoner's initial (Ch.). A following chronology explicitly attributed to Usher gives the first captivity under Joakim as A.M. 3398, the second under Jechonias as A.M. 3405, and the last, when Jerusalem was destroyed and Sedecias was taken, as A.M. 3416. The same note later says that this captivity material is absent from the Hebrew and from several copies of the Septuagint and calls the title of no great authority, with Calmet (C.) and Berthier (Bert.) among the printed attributions. It separately preserves interpretations in the voice of the captives, of David persecuted by his son, and, more sublimely, of Jesus Christ."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF page 776, visible printed p. 740. The A.M. figures belong to an Usher-attributed chronological paragraph in the commentary on Psalm 70:1; they are not printed in Psalm 88, do not prove the Babylonian proposal preserved in the Psalm 88 note, and are not attributed personally to Haydock. This record makes no B.C. conversion and does not use the qualified Greek title as a textual control for the Hebrew superscription."
