context = "The argument tentatively places the psalm in the time of the Machabees. The verse-1 note allows an Asaph living during captivity and, conditionally on authorship by ancient Asaph or David, a prophecy of ruin under Nabuchodonosor or Epiphanes. It also discusses the application in 1 Machabees 7:17 to Alcimus's victims. The same note describes Jerusalem's condition under both Nabuchodonosor and Epiphanes. This page does not settle a unique historical occasion or a single Babylonian destruction date for Psalm 78."
