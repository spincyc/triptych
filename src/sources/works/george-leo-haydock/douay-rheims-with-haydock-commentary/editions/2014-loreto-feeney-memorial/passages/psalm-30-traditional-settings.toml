context = "The superscription prints Psalm 30 as Davidic. In the note to verse 1, Haydock's compiler voice (H.) transmits several traditional settings: flight from court, with Calmet (C.) cited to 1 Kings 19 and 27; imminent danger in the desert of Maon, with 1 Kings 23:25, Kimchi, and Du Pin cited; Absalom's conspiracy, attributed to Theodoret and Menochius (M.); an episode associated with Eusebius; and the captives, associated with Chrysostom. The page supplies no numerical date for the Psalm."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF page 742, visible printed p. 706. This record preserves the initials and named authorities instead of attributing every alternative to Haydock personally. The Maon chronology must be supplied, if used, from the separate 1 Kings 23 passage rather than invented from this Psalm note."
