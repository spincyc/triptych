context = "The superscription prints 'A prayer of Moses, the man of God.' The accompanying note calls this the Jewish legislator's characteristic title, cites Berthier (Bert.) and Du Hamel (D.), then preserves real attributional diversity: Menochius (M.) proposes David composing in Moses' name; Jerome is cited for Moses' authorship extending to the following untitled Psalms through Calmet (C.); Tirinus (T.) and Augustine are brought into the discussion; Calmet also allows a descendant of Moses during the captivity or a Davidic prediction. The page itself assigns no numerical wilderness date."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF page 795, visible printed p. 759. The record positively preserves the Mosaic superscription while distinguishing it from the commentary's competing authorship proposals. It cannot by itself verify a date such as 1491-1451 B.C.; a publication using that range needs a separate chronology witness."
