context = "After Absalom's conspiracy, 2 Kings 15 continues under an A.M. 2981 marker on artifact p. 431. The opening of 2 Kings 16 prints 'A. M. 2981, A. C. 1023' on p. 432; 2 Kings 17 remains in A.M. 2981 on p. 433; and the opening battle of 2 Kings 18 again prints 'A. M. 2981, A. C. 1023' on p. 434."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF pages 431-434, visible printed pp. 401-404. The OCR derivative misreads A.C. 1023 as 1093 at 2 Kings 16; the page image clearly prints 1023. These pages support a received 1024-1023 B.C. horizon for the conspiracy and defeat when combined with the A.M. 2980/A.C. 1024 marker in 2 Kings 15, but they do not erase the earlier A.M. 2979/A.C. 1025 marker at the chapter's opening."
