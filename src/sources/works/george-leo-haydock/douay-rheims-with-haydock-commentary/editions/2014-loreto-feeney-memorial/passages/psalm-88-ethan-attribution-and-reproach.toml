context = "The superscription prints Psalm 88 'for Ethan, the Ezrahite.' The note to verse 1 preserves competing historical attributions instead of resolving them: a proposal marked to Calmet (C.) places its composition with a captive at Babylon lamenting the destruction of Juda's kingdom under Sedecias; a proposal ending with Worthington's initial (W.), with an intervention marked H. after 'person,' allows David to have written in the person of Ethan or Idithun. The note then says that most of the Fathers explain the Psalm of Christ's kingdom. Verse 51 asks the Lord to remember the reproach of his servants, borne in the Psalmist's bosom, 'of many nations.' The verse note marked H. explains the nations as continually insulting the servants and blaspheming God's name; Calmet (C.) associates the burden in the bosom with poignant grief and discusses alternative textual renderings involving many peoples."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF page 793, visible printed p. 757, for the superscription and verse-1 note, and artifact page 795, visible printed p. 759, for verse 51 and its note. The record does not decide among direct Ethan authorship, Davidic composition in another's person, or the Babylonian-captive setting; it records the alternatives and their printed initials. It supplies no numerical date, does not identify the reproaching nations with one specific historical enemy, and does not treat an individual commentator's proposal as the Psalm's inspired superscription."
