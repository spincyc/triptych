context = "The argument identifies the people's lament in Babylonian captivity. The printed title names David and Jeremias; the verse-1 note gives Challoner's explanation as the time of Jeremias and the captivity of Babylon, but reports that the title differs among witnesses, is absent in Hebrew, and may be later. It preserves the captives' expression at Babylon (Bossuet) or at their return (Calmet), together with a possible earlier prophetic composition. The verse-7 note identifies the Idumeans' incitement of the Babylonians to destroy Jerusalem. The represented captivity and recalled destruction are distinct from the uncertain occasion of writing."
verified_on = "2026-10-05"
notes = "The complete registered PDF was retrieved again and matched its recorded SHA-256. Artifact page 830, printed p. 794, was inspected as an image. The note gives no absolute year for the psalm. The Babylonian setting follows Jerusalem's destruction, but the source does not select a single deportation or prove that the poem was written before the return. No new source bytes are retained."
