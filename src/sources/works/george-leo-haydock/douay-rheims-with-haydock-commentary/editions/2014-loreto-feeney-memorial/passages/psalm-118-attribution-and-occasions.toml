context = "The verse-1 note continued on printed p. 781 reports that David is supposed to have written the psalm to instruct Solomon in his youth (Berthier), while others place it in David's own youth under Saul's persecution (Muis, Bossuet and others). A further proposal associates it with the consolation of the captives (Calmet), with Origen and Bede referred to those times. The note says that the psalm is generally attributed to David and also applies to all who wish to live piously. These are alternative proposed occasions; their coexistence does not establish one historical setting or a composition year."
