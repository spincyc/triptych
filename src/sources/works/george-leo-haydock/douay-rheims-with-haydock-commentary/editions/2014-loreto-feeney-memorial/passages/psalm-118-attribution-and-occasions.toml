notes = "The complete registered 1,942-page PDF was retrieved again and its SHA-256 matched the existing artifact. The commentary was read in the image of artifact page 817, printed p. 781. The page supports received attribution independently of the anonymous biblical heading. No new claim of authorship certainty, absolute date, or common occasion is made, and no PDF bytes are added to the repository."
