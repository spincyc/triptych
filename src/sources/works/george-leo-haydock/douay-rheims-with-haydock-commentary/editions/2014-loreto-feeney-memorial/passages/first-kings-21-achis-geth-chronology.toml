context = "The opening of 1 Kings 20 is marked 'A. M. 2944, A. C. 1060' on artifact p. 396; the close of that chapter immediately before 1 Kings 21 remains marked A.M. 2944 on p. 398; and the next chapter begins in A.M. 2944 on p. 399. Between those bounding year marks, 1 Kings 21:10-15 narrates David's flight to Achis, king of Geth, his fear, and his feigned madness."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF pages 396, 398, and 399, visible printed pp. 366, 368, and 369. The A.C. 1060 line stands at 1 Kings 20, not beside the Achis verse itself; the passage therefore records the edition's continuous chronological frame rather than pretending the verse carries an independent date. The commentary on 21:10 is compiled under the edition's ordinary initials and names Salien, Haydock (H.), Sanchez, Menochius (M.), and Calmet (C.); none of them is treated as the author of the uninitialled year markers."
