notes = "The title page identifies the William Peter Feeney 2014 Memorial Edition. The preceding imprint leaf prints ISBN 978-1-62292-058-7, '2014 Printing by: Loreto Publications,' and says this edition derives from a copy of the original 1859 Haydock supplied to Catholic Treasures by the Slaves of the Immaculate Heart of Mary. A following leaf identifies that source as the Dunigan and Brothers 1859 unabridged edition. This record describes the exact modern printing digitized as Internet Archive item haydock-douay-rheims-catholic-bible; it does not re-identify that scan as an 1859 artifact."
