notes = "The exact printing behind the Internet Archive digitization used here could not be dated from its text layer, and the date field records only the conventional nineteenth-century date under which Haydock's commentary circulates; a consumer needing an exact printing must identify one for itself. Haydock died in 1849 and the commentary is out of copyright by age. Keep this record distinct from the several modern reprints and from the online transcriptions that abridge the notes."
