description = "The Sanctuary of Fatima's one-volume critical selection (Fatima: Santuario de Fatima, 2013; ISBN 978-972-8213-91-6; scientific sponsorship of the Centro de Estudos de Historia Religiosa, Universidade Catolica Portuguesa) of documents from the fifteen-volume Documentacao Critica de Fatima series covering 1917-1930: parish-priest and Formigao interrogations, contemporary press including O Seculo and Ilustracao Portuguesa, the 1922 provisao, the 1930 commission report, and the 1930 pastoral letter, each with critical apparatus. Container identity distinct from the constituent documents it prints. Loci are the volume's document numbers, with printed page numbers where quoted."
