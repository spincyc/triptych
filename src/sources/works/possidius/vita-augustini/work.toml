description = "The contemporary Life of Augustine of Hippo written by his friend and fellow bishop Possidius of Calama within the decade after Augustine's death (after the Vandal withdrawal from Hippo in 431), with an appended Indiculus of Augustine's writings. It is the principal external witness to Augustine's clerical life, episcopate, daily practice, last illness, and death."
