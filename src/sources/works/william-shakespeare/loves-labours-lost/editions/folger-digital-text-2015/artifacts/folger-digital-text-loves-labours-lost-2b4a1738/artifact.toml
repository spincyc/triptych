rights_basis = "The 1609 sequence is public domain everywhere. These bytes are a modern edited text of it and their terms are not established. The file names its own editors in its first lines -- \"Edited by Barbara A. Mowat and Paul Werstine with Michael Poston and Rebecca Niles\", \"Folger Shakespeare Library\", \"Created on Jul 31, 2015\" -- so what is distributed here is an editorial text of 2015 and not a reprint of 1609. The whole file was then searched case-insensitively with runs of non-alphanumeric characters collapsed for \"copyright\", \"licen\", \"rights\", \"terms of use\", \"permission\" and \"creative commons\": every one returns zero except a single \"rights\" inside Sonnet 17. The file therefore grants nothing, and silence is not a grant: `tracked` requires an affirmative recorded distribution basis and none exists for a named modern editorial text. The identity, the digest and this finding are kept; the bytes are not."
