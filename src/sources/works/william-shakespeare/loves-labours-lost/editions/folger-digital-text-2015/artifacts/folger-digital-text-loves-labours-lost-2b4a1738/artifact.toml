notes = "The Folger digital text of Love's Labour's Lost as published for download; no editorial notes travel in this format. Extent as measured by the retrieving lane: complete Folger Shakespeare Library plain-text edition of Love's Labor's Lost, character list through the end of Act 5, as published for download; no editorial notes are carried in this format ACCESS LIMITATION. What is not retained is a named modern editorial text of 2015, and it is not retained because the file states no terms and a modern edition is not covered by the 1609 or 1598 printing's public domain. What a reader without the network can open instead is the same passage in the Project Gutenberg body text retained at artifact.william-shakespeare.complete-works.gutenberg-ebook-100.gutenberg-pg100-body-lf, whose wording at the quoted lines the retrieving lane reports as carrying the same hyphenated phrase."
