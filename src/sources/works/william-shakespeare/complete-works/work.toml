work_type = "dramatic-and-poetic-collection"
languages = ["en"]
composed = "c. 1589-1613"
composed_basis = "A collection, not a composition: the plays and poems it gathers were written across Shakespeare's working life, conventionally c. 1589 to c. 1613, and no single year is true of the whole. Individual works are dated on their own records where this collection holds them separately."
description = "The plays, sonnets and poems in one file. Registered here because a whole-text search over it is what established that \"world-without-end\" stands exactly twice in Shakespeare, at Sonnet 57 and at Love's Labour's Lost V.ii."
