notes = "The title page was read in the optical text registered here and gives \"SHAKESPEARE'S SONNETS, Edited with Notes and Introduction BY THOMAS TYLER, M.A. ... LONDON: DAVID NUTT, 270-71 STRAND. 1890\", with \"[All rights reserved.]\" printed below the Shelley epigraph -- a formula of the period rather than a live claim. Registered because the retrieving lane searched Tyler's notes for a gloss on the \"world-without-end hour\" of Sonnet 57 and found none, which is a bounded negative about this edition's apparatus."
