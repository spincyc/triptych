notes = "Complete Entire Play HTML response, all five acts with Folger scene line and FTLN anchors; checked 5.2.865–866 = FTLN 2762–2763, plus the surrounding proposal and year-long trial. Measured response: 995762 bytes; 7931 physical lines. The separately receipted complete text (artifact.william-shakespeare.loves-labors-lost.folger-web-2026-09-05.complete-text-2b4a1738) identifies FDT 0.9.2, created 2015-07-31, and editors Barbara A. Mowat and Paul Werstine, with Michael Poston and Rebecca Niles. This response supplies the full play rather than a single-scene view; scene-line anchors 5.2.865–866 correspond to FTLN 2762–2763. Access limitation: the exact modern edition HTML is not retained because no redistribution grant covering these bytes was supplied. An offline reader has the identity and locator records; neither the HTML nor the separately registered protected text download is available as an offline substitute."
