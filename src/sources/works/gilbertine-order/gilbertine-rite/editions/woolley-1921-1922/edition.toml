notes = "Complementary volumes of one critical edition, not successive recensions. Volume I contains the Ordinal and Office of Saint Gilbert; volume II prints Eucharistic texts from Lincoln Cathedral MS 115 and Cambridge St John’s College MS 239. English introduction and apparatus accompany the Latin. Medieval witness dates remain separate from publication. The second title page reads 1922 despite the provider’s 1921 metadata."
