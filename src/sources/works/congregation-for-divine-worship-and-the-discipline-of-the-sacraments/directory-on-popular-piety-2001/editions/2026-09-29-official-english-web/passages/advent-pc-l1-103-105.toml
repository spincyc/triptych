context = "Nn. 103-105: n. 103 the Christmas novena began as a way of bringing the liturgy's riches to those who could not easily grasp it; now it is desirable that Vespers from 17 to 23 December be celebrated more solemnly with the 'major antiphons', inviting the faithful, possibly with expanded homily, incense and intercessions, as an ideal 'Christmas novena' in conformity with the liturgy; n. 104 the crib, in churches since antiquity and promoted in homes from the thirteenth century under the influence of Francis at Greccio; n. 105 popular piety can preserve Advent's values against the commercialisation of Christmas: sobriety, joyous simplicity, concern for the poor, the value of life from conception, and conversion while awaiting the Lord's return."
