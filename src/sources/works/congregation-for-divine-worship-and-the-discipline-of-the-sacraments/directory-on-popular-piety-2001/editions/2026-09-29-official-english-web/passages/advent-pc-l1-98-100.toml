context = "Nn. 98-100: n. 98 the Advent wreath, four candles on green fronds, common in Germanic countries and North America, lit progressively Sunday by Sunday until Christmas, recalling the stages of salvation history before Christ and the prophetic light gradually illuminating the night before the rising of the Sun of justice (Mal 3:20; Lk 1:78); n. 99 Advent processions, announcing the Saviour's imminent birth (the 'day star' in some Italian processions) or re-enacting Joseph and Mary's search for lodging (the Hispanic and Latin American posadas); n. 100, headed 'The Winter Interstice' in the English (TOC 'The Winter Quartertense'), on the northern-hemisphere winter season and solstice: where popular piety marks the changing season, such celebrations are to be kept as times of prayer and of reflection on human work."
