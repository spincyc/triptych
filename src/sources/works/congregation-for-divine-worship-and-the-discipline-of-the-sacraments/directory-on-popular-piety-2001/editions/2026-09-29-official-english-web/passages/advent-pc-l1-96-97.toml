context = "Nn. 96-97, 'In Advent': Advent as a time of waiting (memory of the first, humble coming; supplication for the final, glorious coming), of conversion (the prophets and John the Baptist, Mt 3:2) and of joyful hope (Rom 8:24-25; 1 Jn 3:2). Popular piety is especially sensitive to Advent as the memory of the preparation for the Messiah, to Israel's long expectation sustained by the prophets, to the Incarnation in the humble Virgin, and to Mary's difficulties in pregnancy and the lack of room at the inn (Lk 2:7); many Advent devotions have conserved values of the season."
