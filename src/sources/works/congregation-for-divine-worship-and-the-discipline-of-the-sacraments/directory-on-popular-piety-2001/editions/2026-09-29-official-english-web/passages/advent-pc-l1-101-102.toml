context = "Nn. 101-102, 'The Blessed Virgin Mary and Advent': the liturgy celebrates Mary in an exemplary way in Advent (citing Marialis cultus), recalling the Old Testament women who prefigured her and exalting her faith and humility; popular piety's Marian devotions (novenas of the Immaculate Conception and of Christmas) are welcome, but Advent, 'particularly apt for the cult of the Mother of God', cannot be presented as a 'Marian month'; Eastern Churches' Marian Advent (Coptic Theotokia, Syrian 'Subbara', Byzantine feasts). N. 102: the Immaculate Conception harmonises with Advent; its novena should highlight the prophetic texts from Genesis 3:15 to Gabriel's greeting; Our Lady of Guadalupe (12 December) centres American popular piety before Christmas."
