notes = "A dated official English delivery state carrying the complete instruction, nn. 1-133, with its dates (28 March 2001, published 7 May 2001) and the signatures of Cardinal Jorge A. Medina Estevez and Archbishop Francesco Pio Tamburrino. The Latin published in Acta Apostolicae Sedis 93 (2001) 685-726 is the authoritative text and is not registered here. Later instruments modified the translation regime: Francis's motu proprio Magnum principium (3 September 2017) amended canon 838, and this record makes no claim about the instruction's present force."
