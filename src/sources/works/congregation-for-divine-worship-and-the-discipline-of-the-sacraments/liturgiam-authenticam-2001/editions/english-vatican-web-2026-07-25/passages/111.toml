context = "The instruction's own chapter on the publication of liturgical books, read at nn. 110-118 on 2026-08-01. Two numbers settle the question this repository kept relitigating. n. 111: 'As regards the liturgical books of the Roman Rite promulgated in an editio typica either before or after the Second Vatican Council by decree of the Congregations competent at the time, the Apostolic See, through the Administratio Patrimonii or, in its name and by its mandate, through the Libreria Editrice Vaticana, possesses and reserves to itself the right of ownership commonly known as \"copyright\". The granting of permission for a reprinting pertains to the Congregation for Divine Worship and the Discipline of the Sacraments.' n. 117: 'The rights of publication and the copyright for all translations of liturgical books, or at least the rights in civil law necessary for exercising complete liberty in publishing or correcting texts, is to remain with the Conferences of Bishops or their national liturgical Commissions.' n. 118 provides for a licensing agreement where the copyright in a translation is common to several Conferences, which is the case of the English. n. 110 lists the books in view and names the Missale Romanum first. The consequence for a translator is stated by the two together: the Latin is claimed, and the English is claimed, and they are claimed by different parties."
verified_on = "2026-08-01"
notes = "The same exact bytes as the complete-text passage on this edition, refetched on 2026-08-01 and found byte-identical to the 2026-07-25 acquisition, so the two passages cannot come apart. An English delivery state and not the promulgated Latin. An ecclesiastical instruction is also not a civil-law adjudication: it states what the Holy See and the Conferences claim and directs how they are to act, and a court in any given jurisdiction would still decide what subsists and in whom it vests."
