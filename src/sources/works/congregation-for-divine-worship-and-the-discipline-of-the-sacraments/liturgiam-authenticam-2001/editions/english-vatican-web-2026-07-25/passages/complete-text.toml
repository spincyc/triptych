context = "The complete English delivery was read. Numbers material to translation method were checked at their own loci: n. 20 (translation is not creative innovation but integral and most exact rendering, without paraphrase or gloss); n. 25 (easily understandable language preserving dignity, beauty and doctrinal precision); n. 27 (the voice of the Church at prayer, free of overly servile adherence to prevailing modes of expression, tending to a sacred vernacular style); n. 51 (varied Latin vocabulary should yield varied vernacular vocabulary); n. 53 (Latin terms of rich meaning, naming munus, famulus, consubstantialis, propitius); n. 56 (expressions of the ancient Church's heritage to be translated as literally as possible, naming Et cum spiritu tuo and mea culpa, mea culpa, mea maxima culpa); n. 57 (the Roman Rite's concise manner of expression to be maintained); n. 64 and n. 74 (stability of memorized and sung texts; where larger conformity changes are necessary they should be made at one time with catechesis)."
verified_on = "2026-07-25"
notes = "An English delivery state, not the promulgated Latin. The record establishes what the instruction directs, not whether any particular translation satisfied it."
