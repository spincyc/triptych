context = "The complete letter was read. It records the July 2005 consultation of the conferences (Prot. N. 467/05/L of 9 July 2005); states at n. 1 that a text corresponding to pro multis has been the formula of the Roman Rite in Latin since the first centuries and that over the last thirty years some approved vernacular texts adopted the interpretative translation for all, per tutti or the like; affirms at n. 2 the validity of Masses celebrated with a duly approved formula equivalent to for all, citing the 1974 declaration of the Congregation for the Doctrine of the Faith (AAS 66 [1974] 661), and that it is a dogma of faith that Christ died on the cross for all; gives at n. 3 six reasons for a more precise rendering, among them that the synoptic Gospels refer specifically to the many, that the Latin Roman Rite has always said pro multis and never pro omnibus in the consecration of the chalice, that the Eastern anaphoras contain the equivalent formula, that for all is rather an explanation belonging to catechesis, that for many remains open to including every human person while reflecting that salvation is not accomplished mechanically, and that under Liturgiam authenticam one should strive to remain more faithful to the Latin typical editions; and directs at n. 4 that conferences then using for all or its equivalent undertake the necessary catechesis of the faithful over the next one or two years so as to prepare them for the introduction of a precise vernacular rendering of pro multis in the next translation of the Roman Missal."
verified_on = "2026-07-25"
notes = "Read at the artifact pages. The letter's Italian is the original by its own preamble. This passage records what the letter directs and reasons; it is not a judgement about any particular vernacular text."
