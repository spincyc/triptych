notes = "The official publication of the letter in the Congregation's own commentarii. The Latin preamble printed above the letter records that the Supreme Authority mandated the dispatch of the circular letters after consideration by this dicastery and by the Congregation for the Doctrine of the Faith, and that the Italian version is to be held as the original from which the other translations were made. The dated protocol number is 467/05/L and the date given at the head of the letter is Roma, 17 ottobre 2006."
