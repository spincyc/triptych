description = "The circular letter of 17 October 2006, Prot. N. 467/05/L, sent by the Congregation for Divine Worship and the Discipline of the Sacraments to the presidents of the episcopal conferences after consultation with the Congregation for the Doctrine of the Faith and on the directives of Benedict XVI, requiring that future vernacular translations of the Roman Missal render pro multis in the consecration of the chalice literally, and asking conferences then using for all or its equivalents to prepare the faithful by catechesis. The letter is in four numbered paragraphs; a Latin editorial preamble states that the Italian is to be held as the original."
