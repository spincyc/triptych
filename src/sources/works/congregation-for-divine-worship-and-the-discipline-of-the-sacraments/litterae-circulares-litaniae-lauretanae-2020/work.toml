description = "The circular letter of 20 June 2020, signed by Cardinal Robert Sarah and Archbishop Arthur Roche, communicating Pope Francis's decision that the invocations Mater misericordiae, Mater spei, and Solacium migrantium be inserted into the Litany of Loreto after Mater Ecclesiae, Mater divinae gratiae, and Refugium peccatorum respectively. The letter is unnumbered and is cited as a whole."
