description = "Isidore of Seville's early seventh-century encyclopedia in twenty books. Book V, De legibus et temporibus, transmits the late Roman legal vocabulary (divine and human law; ius, lex, mos; ius naturale, civile, gentium; the qualities of law) that Gratian's opening distinctions and the scholastic treatises on law received."
