languages = ["la"]
locus_pattern = '[1-9][0-9]{0,2}'
composed = "saec. V"
composed_basis = "The head-note of Migne's printing over its volume title page and Elenchus (Patrologia Latina 57, leaves n6 and n7) reads 'SAECULUM V. ANNUS 466.', Migne's year for Maximus. No closer dating of the collection or of its single pieces is established here. The collection is Bruno Bruni's editorial arrangement, and its own admonitions record pieces whose ascription to Maximus is disputed, as for Homilia CVIII."
description = "The hundred and eighteen homilies that Bruno Bruni's edition of Maximus of Turin, made at the command of Pius VI, distributes into four classes -- hiemales de tempore, aestivae de tempore, de sanctis and de diversis -- as Migne's Patrologia Latina 57 reprints them; its Elenchus lists them from col. 221. A locus is Bruni's homily number. Homilia CVIII, on Matthew 9:1 'Ascendit Jesus in naviculam', is the text Patrologia Latina 52 prints as Peter Chrysologus's Sermo 50, and its admonition records the conflicting ascriptions."
