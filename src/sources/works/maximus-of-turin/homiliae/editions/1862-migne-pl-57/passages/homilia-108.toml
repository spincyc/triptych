context = "Homilia CVIII, 'Super illa Evangelii Matth. cap. IX: Ascendit Jesus in naviculam, et transfretavit', with Bruni's admonition on its ascription and a short argument: the text Patrologia Latina 52 prints as Peter Chrysologus's Sermo 50, De paralytico curato, on Matthew 9:1-8."
