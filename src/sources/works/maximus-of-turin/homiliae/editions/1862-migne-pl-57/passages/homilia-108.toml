notes = "LOCUS, read on page images: PL 57:501-506, heading and admonition at the foot of cols. 501-502 (leaf n254), text to col. 506, where Homilia CIX follows. The line range includes notes on Homilia CVII printed at the foot of those columns. The wording of this OCR layer is not collated as a whole; what these records quote was read on leaves n254 and n255. The admonition, quoted in full on leaf n254's artifact record, reports that part of the homily is read in the Roman Breviary on the Eighteenth Sunday after Pentecost under Peter Chrysologus's name; that Sebastiano Pauli's Venice edition of 1750 ascribed it to him, as Combefis had long before; that Vatican codex 6451 names John Chrysostom as its author, Monte Cassino codex 102 Severian, and Vatican 4222 and Laurentianus 36 Plut. XVII, 'non infimae notae', Maximus. Bruni declines to impugn the commonly received ascription, reports the older one, says style could confirm it, allows that his opinion may be wrong, and prints the homily among Maximus's Homiliae de diversis, not in the volume's appendix of doubtful works (cols. 849-956). Neither the Breviary lesson nor any of the manuscripts is held or checked here; these are the admonition's statements. Where this edition and Patrologia Latina 52 differ in wording, and on the 'non respicit' reading they share, see passage.peter-chrysologus.sermones.1894-garnier-migne-pl-52.sermo-50."
