notes = "One page image, leaf n254: cols. 501-502, 1889 by 3059 pixels. Read on this image, across the foot of both columns after Homilia CVII: 'HOMILIA CVIII. Super illa Evangelii Matth. cap. IX: Ascendit Jesus in naviculam, et transfretavit. ADMONITIO. In Breviario Romano pars hujus homiliae legitur in dominica 18 post Pentecosten sub nomine S. Petri Chrysologi, quam eidem clarissimus vir Sebastianus Pauli Cler. Reg. a Matre Dei in sua ejusdem S. Ravennatensis archiepiscopi editione Venet. an. 1750 ascripsit, quemadmodum multo ante Combefisius tom. VII, pag. 397, aliique. Haec esse tanti momenti mihi videntur, ut communiter receptam non audeam impugnare sententiam; licere tamen mihi arbitror veterum referre scriptorum opinionem. In bibliotheca enim Vaticana codicem invenimus num. 6451, qui, pag. 19, S. Joannem Osaureum, sive Chrysostomum homiliae auctorem appellat; in archivo Casinensi codex 102, pag. 253, eam S. Severiano episcopo tribuit. At duos alios codices non infimae notae in S. Maximum Taurinensem convenire attestamur, nempe Vaticanum 4222 pag. 341, et Laurentianum 36 Plut. XVII pag. 251, expresse enim post Evangelii locum habent: Homilia S. Maximi episcopi. Hujusmodi testimonia a styli similitudine confirmari possunt. Verum etsi forte nostra nos fallat opinio, rem tamen gratam aequis lectoribus nos fecisse existimamus, cum huic homiliae variantes plurimas ex codice Vaticano 6451 collectas subjiciamus.' The printing divides 'Osaureum' as 'Osavreum'. The homily's text begins in col. 502 'Christum in humanis actibus divina gessisse my-'. One leaf only."
