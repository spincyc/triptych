provenance = "Internet Archive optical character recognition text layer of the whole volume, fetched whole with curl over HTTPS on 2026-09-23 into a scratch repository outside this checkout, hashed there, and moved here unaltered. The item's metadata API declares 3,567,003 bytes, sha1 419ab108cbbcbf1c75bed0f70a46e1f6845fc03c and md5 97f1d825fc176804f4a56bf75dc165e9, and the fetched file matches all three. An item patrologiaecursu0057mign, on the pattern of the Patrologia Latina 52 item, does not exist. The Internet Archive advanced searches 'title:(patrologiae) AND volume:57' and 'identifier:patrologiaecursu0057*' returned this item beside patrologiaecursu0057mign_x6o0, patrologiaecursu0057adal and four other items whose metadata names volume 57. This one was taken; its title pages, read afterwards, confirm Patrologia Latina 57, and its layer reaches the Homilia CVIII admonition. The other items were not examined beyond their metadata. No transformation of any kind was applied, and no model stood anywhere between the server and the hash."
