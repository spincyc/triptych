notes = "Extent as retrieved and measured: complete uncorrected OCR of Migne, Patrologia Latina vol. 57 (Maximus of Turin, in Bruno Bruni's edition; Paris: Migne, 1862), whole volume, 70,917 LF-terminated lines, opening with the Internet Archive's digitization line (University of Toronto, 2011) and ending with the printing's closing 'FINIS TOMI QUINQUAGESIMI SEPTIMI', damaged in the recognition. The volume's own Elenchus stands at lines 263-318 and is read on leaf n7; the containment inventory enters the works it lists. Homilia CVIII, with its admonition, stands at lines 32106-32376. Uncorrected optical recognition: a locating and searching layer, not a text of record; the series title page's year, printed 1862, is read here as '1863', and a reading quoted from this layer is collated against a page image first."
