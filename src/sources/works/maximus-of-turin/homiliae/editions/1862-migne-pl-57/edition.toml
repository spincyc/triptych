title = "S. Maximi episcopi Taurinensis Homiliae, in Migne's Patrologia Latina volume 57 (Paris, 1862)"
language = "la"
publication = "Excudebatur et venit apud J.-P. Migne editorem, in via dicta d'Amboise, olim prope portam Lutetiae Parisiorum vulgo d'Enfer nominatam, seu Petit-Montrouge, nunc vero intra moenia Parisina, 1862. Patrologiae Latinae tomus LVII: Sanctus Maximus Taurinensis. Sancti Maximi, episcopi Taurinensis, opera omnia, jussu Pii Sexti P. M. edita. The copy scanned is the University of Toronto's (PIMS), Internet Archive item patrologiaecur57mign."
date = "1862"
editors = ["Jacques-Paul Migne", "Bruno Bruni"]
notes = "Migne's reprint of Bruno Bruni's edition of Maximus of Turin; Bruni is named by the Elenchus's 'Brunonis Bruni Praefatio in Editionem Operum S. Maximi' (leaf n7). Both title pages were read on page images registered here (leaves n4 and n6) and print the year 1862. The Internet Archive item metadata gives the date 1800, which is Migne's birth year and not the printing. Homilia CVIII stands at PL 57:501-506: its heading, Bruni's admonition and argument across the foot of cols. 501-502 (leaf n254), its text from col. 502 to col. 506, where Homilia CIX follows. Registered because that admonition is the evidence this library holds on the ascription of the text Patrologia Latina 52 prints as Peter Chrysologus's Sermo 50. Registered on the pattern this library uses for a constituent of a Migne volume: the edition is the constituent as the volume prints it, and the volume's text layer is entered as a container in src/sources/inventories/source-containment-v1.toml."
