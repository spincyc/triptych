description = "The act signed at the abbey of Hauterive on 18 July 1988 by which the undersigned clerics founded the Priestly Fraternity of Saint Peter as a clerical society of apostolic life in conformity with canons 731-746, taking into consideration the exemption foreseen in the protocol of 5 May 1988 and the motu proprio Ecclesia Dei adflicta, providing that the constitutions would be inspired by the approved statutes of the Priestly Society of Saint Pius X with a reserved right of change, and requesting Holy See approval. Twelve signatures including one deacon; a thirteenth name appears in brackets as a founder unable to be present, and a published note records that one signatory left before the erection of 18 October 1988."
