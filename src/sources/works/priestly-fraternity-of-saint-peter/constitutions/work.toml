description = "The fundamental code of the Priestly Fraternity of Saint Peter, approved ad experimentum for three years on 18 October 1988, amended by the general chapter of 2000, definitively approved by the Pontifical Commission Ecclesia Dei on 29 June 2003 (Prot. N. 108/2003), and amended by the general chapters of 2012 and 2018 with the approval of the Apostolic See (Prot. N. 153/2009). The complete text has never been published; only Part I, articles 1-15, is public."
