title = "Declaration of intention by the founders of the Priestly Fraternity of Saint Peter (2 July 1988)"
responsible = "Josef Bisig and fourteen co-signatories"
work_type = "private-declaration"
languages = ["de", "en"]
locus_pattern = 'complete-text'
description = "The declaration signed at Paris, Munich and Vienna on 2 July 1988 by fifteen men described as members until then of the Society of Saint Pius X, expressing regret at the illicit episcopal consecrations of 30 June 1988, claiming to have remained in the Catholic Church as the pars sanior of that Society, invoking the protocol of 5 May 1988, and petitioning canonical erection as a society able to form priests and to celebrate divine worship according to the guidelines of immemorial tradition. Seven signatories bear a clerical style and one is identified as a deacon; the status of the remaining eight is not stated in the document."
