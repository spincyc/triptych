context = "Third-declension feminine consonant nouns with nominative x and genitive -icis take singular ablative -ice in the explicitly printed radix/radicis/radice paradigm."
notes = "§§53-55 identify third-declension nouns and consonant stems and explain c+s to x. §56 specifies masculine and feminine mute-stem nominatives. §57 prints radix, F., stem radic-, nominative radix, genitive radicis, dative radici, accusative radicem, ablative radice, with singular ending -e; the complete singular/plural table is retained. §57a on the next page explicitly adds cornix, -icis (F.), as declined in like manner. When combined with the separately checked dictionary’s named genetrix/genitrix, -icis, f., this supports the explicitly enumerated Genetrice/Genitrice feminine ablative singular pair. This is a manual inference for one named pair, not a claim that these exact ablatives are printed in the grammar and not permission to generate other cases, words, stems or spellings."
