notes = "Note 9: A final m of is is changed to n before d: as, eundem for eumdem, etc. The same page locates eundem in the masculine accusative singular cell of idem, and eiusdem in the genitive singular cells. This establishes the exact example’s identity and parse, not a blanket m/n fold or equivalence with eiusdem. Consumer route admission requires separate independent review."
