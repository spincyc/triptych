notes = "Actual section181 says v between vowels is often lost in tenses formed on the perfect stem; section181a gives contraction examples and preserves its restrictions, including no contraction in first-person perfect indicative and very rare third-person use. It does not print foecundasti or fecundasti. Applying the grammar to those two actually printed prayer forms is an explicitly local, independently reviewed inference, not a source transcription or a rule permitting generation of other forms."
