notes = "§117b places present participles in -ns, stem -nt-, under egens. §118 prints egentium as genitive plural in every gender. §121b gives common -ium and notes occasional poetic -um for participles. The requested exact pair preserves -entium; it does not substitute the poetic -entum ending or alter gender, case, number, tense or voice."
