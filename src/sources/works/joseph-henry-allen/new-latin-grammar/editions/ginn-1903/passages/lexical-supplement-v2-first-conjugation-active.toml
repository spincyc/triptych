notes = "The present subjunctive third singular row is amet, beside indicative amat he/she/it loves. The present active infinitive is amare. Thus the explicitly first-conjugation fecundo/foecundo lemma yields matching fecundet/foecundet and fecundare/foecundare forms, by the unchanged -et and -are endings. No other finite or infinitive surface pair is proposed."
