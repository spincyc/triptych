notes = "Study English from a finite adaptation of the complete Hilary prayer printed in PL9 (1844), column 208. The earlier St Gatian Tours manuscript was not inspected, and the printed extract has no conclusion cue. The adaptation changes the divine title, the bishop’s steadfastness description and the profession verb. The complete prayer and cue were compared with a secondary reproduction labelled 2002; the full conclusion is independently attested in an 1862 missal. Correspondence with the complete authenticated 2008 Missal remains unestablished. This is not approved liturgical English."
text = "Grant, we beseech you, almighty God, that we may both fittingly understand and truly profess the divinity of your Son, which blessed Hilary the bishop steadfastly affirmed. Through our Lord Jesus Christ, your Son, who lives and reigns with you in the unity of the Holy Spirit, God, for all ages of ages."
