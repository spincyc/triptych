notes = "Study English from a finite adaptation of the complete Damasus prayer attributed to the Paris Missal of 1738 in Gerard O’Connor’s 2004 scholarly transcription. No original 1738 page or ending cue was checked. The adaptation changes sheep to the faithful, life and teaching to teaching and martyrdom, and following the saint’s footsteps to perseverance in God’s commandments. The complete prayer and cue were compared with a secondary reproduction labelled 2002; the full conclusion is independently attested in an 1862 missal. Correspondence with the complete authenticated 2008 Missal remains unestablished. This is not approved liturgical English."
text = "Guide your faithful, Lord, along the way of eternal salvation, which blessed Apollinaris the bishop showed by his teaching and martyrdom; and, through his intercession, make us so persevere in your commandments that we may be worthy to be crowned with him. Through our Lord Jesus Christ, your Son, who lives and reigns with you in the unity of the Holy Spirit, God, for all ages of ages."
