transformation = "Create new study English from the whole old prayer with these exact changes: Replace prosequere with tuere, changing the request to attend/accompany the Church in loving favor to guard her. Replace resuscitata with renovata, changing raised/revived to renewed by the paschal mysteries. Replace the actually printed old Per Dominum nostrum cue with the modern Per Christum cue, using the whole independently old Per Christum Dominum nostrum. R. Amen. formula from PustetAP776. Mechanically normalize historical u/v, stress accents, ligatures and punctuation. No additional clause or changed word order is supplied. Tuere is guard; pio favore is loving favor; renovata is renewed, not old resuscitata. The Church remains the singular subject of reaching resurrection radiance. Perpetuo remains always, and the complete independently old short conclusion and distinct response are rendered."
