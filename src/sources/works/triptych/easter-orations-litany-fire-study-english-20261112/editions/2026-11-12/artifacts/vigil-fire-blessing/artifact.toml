transformation = "Create new study English from the whole old prayer with these exact changes: Omit angularem scilicet lapidem after Filium tuum, removing the explicit cornerstone apposition. Omit productum e silice, nostris profuturum usibus before novum hunc ignem, removing the physical flint-origin and practical-use descriptions. Omit eumdem in the old full short conclusion; the complete exact Per Christum Dominum nostrum and response are separately attested in PustetAP776. Normalize coelestibus to caelestibus, capitalization, ligatures, accents and punctuation; the cross is an action marker, not an English word. Claritas is consistently radiance. The same fire, faithful recipients, heavenly desires, paschal feasts, pure minds and ultimate feasts all remain. The omitted cornerstone/flint/use qualifiers are not reintroduced. The two linked ut/ita petitions are retained without replacing the feasts with a generic destination."
