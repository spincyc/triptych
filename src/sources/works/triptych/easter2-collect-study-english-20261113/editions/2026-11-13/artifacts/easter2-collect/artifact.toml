transformation = "Create new study English from the whole old prayer with these exact changes: Normalize the old spelling intelligentia to the modern comparison intellegentia. All substantive petition words and their order are unchanged. Normalize ligatures, stress accents, case, punctuation and print line wrapping; the old source already prints festi, recursu and lavacro, so no grammatical repairs of those words are imported from the modern text. The old printed Per. cue is retained as such in the historical body. The receiving Per Dominum cue is assembled as the full Father-addressed conclusion actually printed in secondary2002IGMR54, separately and completely witnessed with distinct R.Amen in Pustet1862AP88. No expansion is falsely attributed to Mabillon. Recursu is the recurrence of the feast, not merely time within Easter. Sacratae tibi modifies the people consecrated to God. Digna intellegentia is worthy insight. The three passive clauses preserve their distinct washing, Spirit and blood instruments and redeemed/born-anew/cleansed senses. Full Father-addressed conclusion and separate response are rendered; neither is expanded from the old Per. without the independent formula source."
