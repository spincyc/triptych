text = "O God, who willed that blessed Paulinus the bishop should be renowned for his love of poverty and pastoral care, graciously grant that we may imitate the examples of charity of him whose merits we celebrate. Through our Lord Jesus Christ your Son, who lives and reigns with you in the unity of the Holy Spirit, God, for ever and ever."
