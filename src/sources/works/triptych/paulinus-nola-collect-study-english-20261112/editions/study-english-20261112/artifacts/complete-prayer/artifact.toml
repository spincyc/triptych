notes = "Study English based on the complete prayer attributed to a 1765 book in Giacomo Baroffio’s 2022 scholarly catalogue. The original 1765 page and its ending cue have not been checked. The catalogue reads exemplis; the explicit correction to exempla is supported by grammar and the complete prayer printed in the official 1960 record. The adaptation changes the named bishop to Paulinus and compassion for poor people to love of poverty. The full conclusion is independently attested in an 1862 missal. Compared with a secondary witness of the 2002 Roman Missal; correspondence with the complete controlling 2008 edition has not been established. Not an approved liturgical translation."
