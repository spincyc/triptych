# Exact checked English cell of the controlling TSV row, for prose Source Reader display.
text = "It is truly right and just, fitting and for salvation, always and everywhere to give you thanks, Lord, holy Father, almighty and eternal God, and, on the solemnity of blessed Joseph, to magnify you with the praises that are due, to bless you and proclaim you. He was a righteous man whom you gave as spouse to the Virgin Mother of God and whom you placed in charge of your household as a faithful and prudent servant, so that, in a father's role, he might guard your Only-begotten Son, conceived through the overshadowing of the Holy Spirit, Jesus Christ our Lord. Through him angels praise your majesty, dominions worship and powers tremble. The heavens and the powers of heaven and the blessed seraphim celebrate together in shared exultation. With them we ask that you command our voices also to be admitted, saying in humble confession:"
