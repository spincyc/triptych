text = "PRÆFATIO DE SANCTA CRUCE\nSequens præfatio dicitur: a) tamquam propria in Missis de Tempore a dominica I Passionis usque ad feriam V in Cena Domini; in Missis tam festivis quam votivis de sancta Cruce, de Passione Domini et instrumentis Passionis Domini, de pretiosissimo Sanguine D. N. Iesu Christi, de Ss.mo Redemptore; b) tamquam de Tempore in omnibus Missis a dominica I Passionis usque ad feriam IV Hebdomadæ sanctæ, quæ præfatione propria carent."
