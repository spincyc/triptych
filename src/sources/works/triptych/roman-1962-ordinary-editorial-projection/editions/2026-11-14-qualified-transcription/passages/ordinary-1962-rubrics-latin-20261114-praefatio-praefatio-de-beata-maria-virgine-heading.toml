text = "PRÆFATIO DE BEATA MARIA VIRGINE\nSequens præfatio dicitur in Missis festivis et votivis beatæ Mariæ Virginis, præterquam in festo Purificationis beatæ Mariæ Virginis.\nDicitur autem vel Et te in Annuntiatióne, vel Visitatióne, vel Assumptióne, vel Nativitáte, vel Præsentatióne, secundum denominationem festi. — In Missis vero de Conceptione immaculata dicitur: Et te in Conceptióne immaculáta. — In Missis de septem Doloribus dicitur: Et te in Transfixióne. — In Commemoratione de Monte Carmelo dicitur: Et te in commemoratióne. — In omnibus aliis festis beatæ Mariæ Virginis dicitur: Et te in festivitáte. — In Missa sanctæ Mariæ in sabbato et in Missis votivis, in quibus speciale mysterium non sit exprimendum, dicitur: Et te in veneratióne."
