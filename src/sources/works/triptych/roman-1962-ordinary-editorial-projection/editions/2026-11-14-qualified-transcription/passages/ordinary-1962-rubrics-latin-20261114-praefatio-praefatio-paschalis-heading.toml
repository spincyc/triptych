text = "PRÆFATIO PASCHALIS\nSequens præfatio dicitur: a) tamquam propria in Missis de Tempore a Missa Vigiliæ paschalis usque ad vigiliam Ascensionis Domini; b) tamquam de Tempore in ceteris Missis quæ celebrantur eodem tempore, et præfatione propria carent.\nIn Missa Vigiliæ paschalis dicitur: in hac potíssimum nocte; a die autem Paschæ usque ad sabbatum in albis inclusive: in hac potíssimum die; alias: in hoc potíssimum."
