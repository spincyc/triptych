rights_basis = "Admitted under src/sources/inventories/holy-see-twenty-year-term-rights-v1.toml, [how_to_admit].carrier_artifact. First publication of these words: Missale Romanum ex decreto Sacrosancti Concilii Tridentini restitutum, Summorum Pontificum cura recognitum, editio typica (Vatican City: Typis Polyglottis Vaticanis, 1962), issued by the Sacred Congregation of Rites (decree of 23 June 1962, passage.catholic-church.missale-romanum.vatican-typica-1962.decretum-sacrae-rituum-congregationis-1962); first_publication_year 1962; first_publication_imprint Typis Polyglottis Vaticanis; first_publication_body Sacred Congregation of Rites; us_formality published-abroad-without-us-notice (the book carries no notice: guidance/missals.md and the record's [scope].typical_items, which names the Twin Books residual risk). The 1960 code (AAS 52 (1960)) states the corresponding rules of the Prefaces in other words; no printing of these exact words earlier than 1962 was shown, and any such Holy See printing of 1960-1962 would fall inside the same limits. Rows whose words are partly older are admitted whole, the weakest basis of any part governing the row; their pre-1931 spans are named in each row's notes. Published on a qualified basis (publication policy priority 6; confidence medium-low): a Holy See text first published in Vatican City in 1931-1975 that lapsed into the U.S. public domain for want of a formality, and whose twenty-year Vatican term under Italian Law 633/1941 arts. 11 and 29, as applied by Vatican Law XII of 1960, had on this project's reading expired before the 1 January 1996 U.S. restoration date (17 U.S.C. 104A). Not adjudicated; U.S. copyright only; implies no ecclesiastical approval or permission."
