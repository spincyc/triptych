rights_basis = "Triptych created the bounded selection, row division, normalization decisions and collation record and offers those editorial contributions under CC BY 4.0. Every Latin word but one clause is public domain in the United States as preexisting material under 17 U.S.C. 103(b), witnessed by the 1922 Tours Mame (registered public-domain scan, printed pp. 334-335), the 1862 Ratisbon Pustet (printed p. 251) and, for the continuation, the tracked 1861 Cummiskey facing Latin (canon-missae-la seq 8). The one clause none of them carries, 'sed et beati Ioseph, eiusdem Virginis Sponsi' (here 'beati Joseph, ejusdem Virginis Sponsi, et' after the witnesses' own 'sed et'), inserted into the Canon by the decree of 13 November 1962, is published as a short phrase under 37 CFR 202.1(a), on the maintainer's decision of 2026-10-19 recorded once at src/sources/inventories/missale-romanum-1962-facsimile-rights-v1.toml [the_joseph_clause]; that basis reaches that clause only. Triptych claims no exclusive right in any of the underlying words. No page image, layout, marginal number or other 1962-only matter is reproduced."
