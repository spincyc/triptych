transformation = "Select the proper Communicantes of Pentecost up to the 1962 printing's dagger (n. 1097), the continuation that printing sets after the dagger at p. 305 for every proper Communicantes and that closes its common form n. 1090, and the proper Hanc igitur of Easter and Pentecost (n. 1099); divide the continuation and the Hanc igitur into the spoken body, the inline rubric 'Jungit manus.' and the conclusion, one row each; take every word from the 1922 Mame, read with the 1862 Pustet at p. 251 and, for the continuation, with the 1861 Cummiskey; insert the 1962 printing's clause naming Saint Joseph after the witnesses' own 'sed et', and supply no other word from the later book; write the calendar's declared orthography (j retained, ae and oe digraphs for the printed ligatures, no stress accents); take the 1962 printing's pointing, capitalization and two received spellings where the witnesses print the other ('Genetricis' for 'Genitricis', 'eundem' for 'eumdem'); omit the 1962 dagger, the Mame's red, headings, marginal numbers and layout; correct the Mame's misprint 'pretectionis' to the 'protectionis' the Pustet, Cummiskey and 1962 print. Under the 2026-09-03 words rule in guidance/propers-for-agents.md none of these transformations changes a word the 1962 printing says, and the only word-level departure from the public-domain witnesses is the clause."
