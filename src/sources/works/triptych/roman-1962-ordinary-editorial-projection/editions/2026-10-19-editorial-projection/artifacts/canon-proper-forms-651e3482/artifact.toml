notes = "One header line and seven data rows; columns seq, element_key, part, target_locus, witness_locus, latin, notes. Element keys are those of the 1962 Ordinary inventory (src/sources/inventories/roman-1962-ordo-missae-v1.toml), which joins them. The Pustet's chanted-Preface printing of the Pentecost Communicantes at p. 229 reads 'genitricis ejusdem Dei' against 'genitricis Dei' at its spoken printing at p. 251; settled on the leaf images, the p. 229 reading is a word variant against both the Mame and the 1962 and is not used. The facsimile passages that record the readings are passage.catholic-church.missale-romanum.vatican-typica-1962.canon-communicantes, passage.catholic-church.missale-romanum.1922-tours-mame-editio-quarta-iuxta-typicam.pentecost-preface-and-canon-proper-forms and passage.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.pentecost-communicantes-and-hanc-igitur."
