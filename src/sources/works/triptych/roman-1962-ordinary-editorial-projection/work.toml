description = "A project-created editorial source projection of bounded Latin texts of the Ordinary of the Mass that the 1962 frame needs and that no single public-domain printing carries in the 1962 wording: the proper forms of the Canon and the continuation the 1962 Canon prints for every Communicantes. It is neither an edition of a historical missal nor an edition of the Missale Romanum. Each artifact records its transformation rule over separate public-domain and 1962 page-image witnesses. Kept apart from the Proper projection (work.triptych.roman-1962-latin-proper-editorial-projection) because the Ordinary inventory, not the calendar, consumes it."
