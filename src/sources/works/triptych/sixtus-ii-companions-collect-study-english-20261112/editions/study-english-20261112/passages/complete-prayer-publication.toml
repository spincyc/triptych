text = "We ask, almighty God, that through the power of the Holy Spirit you make us teachable in faith and steadfast in professing it, for you granted blessed Sixtus and his companions to lay down their lives for your word and the testimony of Jesus. Through our Lord Jesus Christ your Son, who lives and reigns with you in the unity of the Holy Spirit, God, for ever and ever."
