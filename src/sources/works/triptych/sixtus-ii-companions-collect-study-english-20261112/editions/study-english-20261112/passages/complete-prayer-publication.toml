notes = "Study English based on a complete Paris prayer attributed to 1738 in Gerard O’Connor’s 2004 scholarly transcription, adapted to include Sixtus’s companions. The original 1738 page and ending cue have not been checked. Dumas’s source list dates the Paris missal to 1736, while O’Connor identifies 1738; this discrepancy remains unresolved, so Dumas supplies only a Paris-source reference. The full conclusion is independently attested in an 1862 missal and selected by the cue and rule in a secondary witness of the 2002 Roman Missal. Correspondence with the complete controlling 2008 edition has not been established. Not an approved liturgical translation."
