notes = "Adapted project study English from the complete Pentecost prayer in the Ambrosian Missal (Milan, 1712), printed pp. 202–203 / whole-source pages 240–241, checked in fresh images. The receiving comparison is the secondary digital reproduction labelled 2002, page 266; fidelity to the printed 2002 book and complete authentic 2008 correspondence remain unestablished. The source prayer and receiving comparison both address the Father. The comparison omits the conventional apposition Domini nostri Iesu Christi after Filii tui and the first et of the old et…et coordination; the Son, Holy Spirit, sacrifice, mystery, truth and request remain the same. Source long-s and æ/Æ are normalized, lines joined, and i/j and u/v correspondences declared locally; & is retained in the historical body and compared as et. The actual source cue Per eundem Dominum nostrum &c. in vnitate eiusdem Spiritus Sancti is preserved without expansion. The project ending uses the separately complete old formula Per Christum Dominum nostrum from Pustet 1862, printed p. 180, under the Father-directed short-conclusion rule in primary 1970 IGMR 32 and secondary 2002 IGMR 77. No same-Son or same-Spirit wording is silently imported. Independent review accepts this finite whole-prayer adaptation and English fidelity for source preparation; exact source registration, conclusion binding and runtime presentation remain integration gates. This is project study English, with no claim to approved modern English or unchanged historical human English. The full old body and actual source cue remain separately recoverable. The prior no-exemplar record is preserved as dated history. The study draft was sealed before any consultation of the separate official 2014 English exemplar. Historical source: passage.archdiocese-of-milan.missale-ambrosianum.milan-de-sirturis-1712.pentecost-day-offerings-old-latin-20261112. Ending: passage.catholic-church.missale-romanum.pustet-ratisbon-1862.pentecost-two-study-short-conclusion-20261112. Actual rule: passage.catholic-church.missale-romanum.vatican-typica-tertia-2002.pentecost-day-offerings-study-20261112-igmr77."
