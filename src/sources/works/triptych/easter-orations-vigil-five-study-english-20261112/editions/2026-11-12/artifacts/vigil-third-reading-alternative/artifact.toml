transformation = "Create new study English from the whole old prayer with these exact changes: Change et liberata plebs ab Aegyptiaca servitute to et plebs a servitute liberata: move liberata, omit Aegyptiaca, and use a instead of ab before the new following consonant. These are disclosed body changes, not an exact old-target match. The1922 old text already has ut et, exsisteret and merito fidei; the earlier1894 wording is not silently combined with it. Replace old abbreviated Per Dominum... in unitate ejusdem. with the separately witnessed complete Per Christum Dominum nostrum. and marked R.Amen. Normalize stress accents, ligatures, case and pointing. Reserasti is revealed/unlocked; forma is image; sacramenta praeferret is foreshadow the mysteries, with Christian people retained. Merito fidei is explicitly rendered through the merit of faith; participatione is by sharing, without changing the Spirit or rebirth petition."
