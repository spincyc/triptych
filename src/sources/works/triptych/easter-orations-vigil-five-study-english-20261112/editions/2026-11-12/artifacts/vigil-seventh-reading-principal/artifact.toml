notes = "Project-created study English from a complete independently old prayer, with the individually documented changes and a separately witnessed full conclusion. The modern comparison is a secondary digital 2002 witness; agreement with printed 2002 and the exact 2008 text remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation. Corrected 2026-11-14 (gap campaign, integrate lane): the English renders mirabile (wondrous), which the 2008 target restores per Notitiae 44 (2008) printed p. 370 (artifact page 52), Missal p. 359 n. 30; DECISIONS 6b."
