transformation = "Create new study English from the whole old prayer with these exact changes: Transpose fidelium Pater summe to Pater summe fidelium. Move in toto orbe terrarum from immediately after qui to immediately before multiplicas, and transpose orbe terrarum to terrarum orbe. Replace introire with intrare: a real lexical substitution of closely synonymous verbs, not orthography. Normalize jurasti/iurasti, accents, case and pointing. Replace the old abbreviated Per Dominum. cue with the separately witnessed complete short conclusion Per Christum Dominum nostrum. and marked R.Amen. No automatic cue expansion is claimed. Pater summe is most high Father; diffusa adoptionis gratia is rendered through the outpouring of the grace of adoption; populis remains plural peoples. New English follows the declared modern ordering with no unannounced new petition."
