transformation = "Create new study English from the whole old prayer with these exact changes: Replace Ecclesia tua magna jam ex parte with Ecclesia tam magna ex parte iam: remove tua, add tam before magna, and move iam after ex parte. This is a real possessive/intensifier and word-order variant. The1862 text already has in honorem and ex parte; no further insertion is inferred from the older Gelasian reading. Normalize jam/iam, accents and pointing. Replace old abbreviated Per Dominum. with the separately witnessed full Per Christum Dominum nostrum. and marked R.Amen. Tam magna ex parte is rendered in such great measure; priores sancti are the saints of old; the requested increase and adoption are distinct coordinated clauses, both retained."
