transformation = "Create new study English from the whole old prayer with these exact changes: Replace nostris saeculis with nostris temporibus: a real temporal-word substitution. Replace persecutione Aegyptiaca with persecutione Pharaonis: the old Egyptian persecution is specifically attributed to Pharaoh, already named in the immediately preceding whole Exodus reading; not orthography. Normalize cujus/cuius, accents, ligatures and pointing. Unlike the older Gelasian donor, this1862 petition already lacks a further et before in Abrahae. Replace the old abbreviated Per Dominum. cue with the separately witnessed full Per Christum Dominum nostrum. and marked R.Amen. The right-hand power, water of regeneration, salvation of the nations and both Abraham/Israel outcomes are all rendered. The fullness of the whole world remains the object of the request; English enter among/share in explains the two coordinated Latin in phrases without adding a further petition."
