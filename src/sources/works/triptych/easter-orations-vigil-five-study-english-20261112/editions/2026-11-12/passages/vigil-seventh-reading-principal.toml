text = "God, unchanging power and eternal light, look graciously upon the mystery of the whole Church, and carry out the work of human salvation in greater peace through the effect of your unending design. May the whole world experience and see the fallen raised up, the old made new, and all things restored to wholeness through Christ himself, from whom they took their beginning. Who lives and reigns for ever and ever. R. Amen."
