text = "God, in the light of the New Testament you have revealed the wonders accomplished in earliest times, so that the Red Sea might be an image of the sacred font, and the people freed from slavery might foreshadow the Christian people's mysteries. Grant that all nations, having obtained Israel's privilege through the merit of faith, may be reborn by sharing in your Spirit. Through Christ our Lord. R. Amen."
