text = "O God, who increased your Church through the apostolic cares and zeal for truth of blessed Turibius, bishop, grant that the people consecrated to you may ever receive fresh growth in faith and holiness. Through our Lord Jesus Christ, your Son, who lives and reigns with you in the unity of the Holy Spirit, God, for all ages of ages."
