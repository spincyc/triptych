description = "Study English from a qualified adaptation of the complete Gregory X Office prayer printed in Sydney in 1868. The complete prayer was compared with a secondary reproduction labelled 2002; official 2008 evidence supplies only the correction apostolico to apostolicis. The Office witness is not the modern Mass source, and correspondence with the complete authenticated 2008 Missal remains unestablished. This is not approved liturgical English."
