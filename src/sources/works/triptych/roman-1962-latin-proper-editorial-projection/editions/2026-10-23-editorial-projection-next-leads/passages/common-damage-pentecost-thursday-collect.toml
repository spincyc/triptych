notes = "UTF-8 body SHA256 including final LF 37d148a157556f9beb8c74b89a33a30a41cd00a976d225418325c24e7821f5da. Target conclusion: Per Dominum nostrum Jesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate ejusdem. Historical conclusion: Per Dominum. in unitate ejusdem Spiritus sancti Deus. Pustet prints sancti with lower-case s and a comma after sapere; the target prints Sancti and a semicolon. The complete petition agrees word for word. Pustet abbreviates the through-the-Lord conclusion but explicitly prints its ejusdem ending; the target writes its actual conclusion through in unitate ejusdem. The independently retained PustetPDF390 Praesta formula supplies that contiguous longer prefix; no following Spiritus sancti Deus is supplied to the target. Opening Deus was read in both page images, including the complete ornamental D; Aeus is recognizer damage."
