notes = "UTF-8 body SHA256 including final LF 0b0a86707a0624f61eb38e46f49c8a44d403df74bc09695a1cb210b08acbd1cf. Target conclusion: Per eundem Dominum nostrum Jesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate Spiritus Sancti. Historical conclusion: Per eumdem Dominum nostrum. in unitate ejusdem Spiritus sancti Deus etc. Pustet capitalizes Dominicae and omits the target comma after ut. Its whole petition agrees word for word, including noctem. Its actual conclusion is Per eumdem Dominum nostrum. in unitate ejusdem Spiritus sancti Deus etc.; the target actually prints the longer through-the-Son conclusion ending in unitate Spiritus Sancti, without ejusdem. This is a real conclusion difference, not OCR damage and not silently normalized. The complete independent Mame1922 prayer at PDF382/printed268 agrees in every petition word and simply prints Per eumdem Dominum. PustetPDF88 independently prints the full no-ejusdem standard conclusion, and its Rubricae generales17/PDF44 explicitly directs Per eumdem Dominum nostrum for mention of the Son. Those public-domain formula controls establish preexisting conclusion words while the actual1962 page controls the target form and length; etc. is never expanded and no target word after Spiritus Sancti is supplied."
