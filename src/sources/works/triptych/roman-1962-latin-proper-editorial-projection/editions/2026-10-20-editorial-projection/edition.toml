notes = "Bounded recovery of three Christ the King orations, two own orations of Saint Theodore, and four own All Saints propers. Independent historical wording in Schott/Bihlmeyer 1929 and Mame 1922 is collated against the exact 1962 control, whose punctuation and printed conclusion lengths govern each projection. The historical words have their separately recorded United States public-domain bases; this edition contributes only selection, layout, orthographic normalization and target-relation decisions. No whole-Missal completeness or target-edition rights clearance follows. Four own Immaculate Conception feast bodies were added with the Secret limited to the dated 8 December solemnitate selection at conservative collated-exact grade; the target parenthetical commemoratione alternative is not represented or graded exact-target. Historical cues and target conclusion length remain separately recorded. Further bounded recovery adds the nine principal Christmas orations across the source-authored night, dawn and day forms, each independently witnessed in Mame 1922 and projected at its actual 1962 conclusion length. The Day Collect printed response is retained separately from its historical source cue; Anastasia, English, Ordinary and Preface bodies remain outside that recovery. Twenty-six addressed Advent and Lent Ember Saturday oration occurrences are independently collated against a source-faithful Mame 1922 derivative: twelve existing Collect/Secret/Postcommunion seats, twelve intervening Oratio appointments and both Lent Super-populum Oratio appointments. Each target form explicitly reprints the prayers; source cues and differing target conclusion lengths remain separate. This bounded addition leaves full-form and Ordinary-frame completeness unasserted. Eleven dated primary reading bodies are now independently collated against public-domain Mame 1922. Their literal bodies preserve printed liturgical introductions, adaptations, internal cuts, cento order and terminal clauses. Broad Bible appointments remain separate apparatus; no whole-verse substitution, unprinted part letter or English translation is supplied. The accompanying canonical source packet also retains the separately proved Common I Lesson identity, word-identical to Gregory; that Common calendar node and its Latin/English body accounting are not changed in this dated recovery. This date-specific edition also includes twenty-four independently witnessed prayer occurrences and two complete Veni Alleluia chants for both Pentecost and September Ember Saturday forms, with each actual source order and conclusion length retained; no specialized Ordinary frame or whole-form completeness is inferred. Also includes eight own chant bodies from the public-domain Mame 1922 witness: five Nativity BVM chants and the ordinary Alleluia of Laurence, Matthew and Martin; separately records exact target relation and bounded citation/cue identities. Also includes sixteen direct Latin body owners for the three All Souls forms, resolving eighteen appointed occurrences through the two retained first-form Sequence references. Twelve unique Mame 1922 source bodies retain their actual shorter conclusions; target projection records the declared spelling, pointing, markers and printed conclusion lengths. Other readings and English owners are unchanged; no whole-form completeness or inherited recension exactness follows."
