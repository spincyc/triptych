notes = "Bounded recovery of three Christ the King orations, two own orations of Saint Theodore, and four own All Saints propers. Independent historical wording in Schott/Bihlmeyer 1929 and Mame 1922 is collated against the exact 1962 control, whose punctuation and printed conclusion lengths govern each projection. The historical words have their separately recorded United States public-domain bases; this edition contributes only selection, layout, orthographic normalization and target-relation decisions. No whole-Missal completeness or target-edition rights clearance follows. Four own Immaculate Conception feast bodies were added with the Secret limited to the dated 8 December solemnitate selection at conservative collated-exact grade; the target parenthetical commemoratione alternative is not represented or graded exact-target. Historical cues and target conclusion length remain separately recorded. Further bounded recovery adds the nine principal Christmas orations across the source-authored night, dawn and day forms, each independently witnessed in Mame 1922 and projected at its actual 1962 conclusion length. The Day Collect printed response is retained separately from its historical source cue; Anastasia, English, Ordinary and Preface bodies remain outside that recovery."
