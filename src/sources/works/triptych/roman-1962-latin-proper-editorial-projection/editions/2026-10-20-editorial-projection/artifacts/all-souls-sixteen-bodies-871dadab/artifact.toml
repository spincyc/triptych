notes = "Sixteen direct Latin body owners resolve eighteen appointed occurrences because second and third Sequence each retain the printed reference to the first Sequence. The target independently prints the whole Tract and Offertory at every form. The source second/third referral routes and proper-orations override are explicitly preserved in metadata. This package changes no English witness or exact absence, no other reading or Bible companion boundary, and makes no whole-form or inherited pre-1955 exactness claim. Physical wrapping and final newlines are project formatting, separate from the frozen source-proof proposal hashes."
