notes = "Exact UTF-8 calendar body SHA-256 including its final LF: 416fe94212bfa59cdb3a933da0ebcb77f1bcf9fd66dabc9d1d772453bb512ced. The target and independent 1862 page both read quaesumus; the former calendar quiesumus was transcription damage. The complete petition agrees word for word. Pustet prints commas after loco, tuos and meritis, none after ut or montem, and a full stop after valeamus. The target prints its own pointing. Pustet actually stops at Qui tecum vivit.; the target stops at Qui tecum vivit et regnat in unitate. The longer target prefix is independently printed contiguously in the separately held Pustet PDF 390, printed p. 304, Praesta oration conclusion; no words beyond the target stop are supplied."
