notes = "The whole Feltoe p44 prayer supplies the Church/foundation/gates-of-hell construction and in tua veritate persistens, in the same connected petition. Target drops Omnipotens sempiterne, changes apostolica to apostolicae petrae, adds quaesumus and the generic named-saint intercession with optional martyr wording and Summo Pontifice or plural equivalents. The complete old ending nulla recipiat consortia perfidorum is replaced by continua securitate muniatur. The old protection prayer is thematic and formulaic support for continual apostolic protection, not an exact attestation of this replacement. The complete Mame Urban prayer demonstrates old named martyr/pontiff intercession; it does not print these generic placeholders, Summo or their location in this collect. Target retains literal Per Dominum. Both Common prayers print veritate, while Urban prints virtute. Singular/plural slots and optional parentheses belong to their exact separate bodies. Publication is limited to the code-pinned exact owner/body/controller/surface tuple under method english-completion-20261029-finite-latin-v1. This source record grants no authority or wider scope. Each changed body, recipient form, English or controller requires its own review; no scope extends by analogy."
