notes = "The full Feltoe prayer begins Munera tibi Domine laetantes offerimus and concerns apostolic intercession; target turns the offered gifts into a relative clause, adds suscipe benignus et praesta and a generic saint-intercession insertion, and omits the old Petri et Pauli/nataliciis/profutura predicate. The whole Wilson wartime prayer supplies the complete paired predicate et fidei integritate laetetur et temporum tranquillitate semper exultet. Target replaces populus tuus with Ecclesia tua, inserts the saint-intercession clause, and spells exsultet. Wilson invocation/petition for subduing enemies is omitted; Feltoe opening and Wilson ending are combined across two complete old prayers. Neither witness prints this exact resulting whole. The target conclusion is exactly Per Dominum nostrum Iesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate. It is not expanded beyond the source. Publication is limited to the code-pinned exact owner/body/controller/surface tuple under method english-completion-20261029-finite-latin-v1. This source record grants no authority or wider scope. Each changed body, recipient form, English or controller requires its own review; no scope extends by analogy."
