notes = "Whole canonical body SHA256 including hard wraps and final LF 0188d53c71815633e8cf11e8d8a245f74e98481cafb978ebe38348733b0b3ccc. Historical whole-petition passage passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-advent-3-alleluia; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-advent-3-alleluia. Alleluja/Alleluia j/i; target commas around Domine explicitly retained. Whole printed Alleluia, including double opening and terminal Alleluia; not clamped to Psalm79 Gradual above. Normal Sunday appointment only; target itself excludes this unit when the Sunday Mass is used on Advent ferias. Historical ending \"nos. Alleluja.\"; actual target ending \"nos. Alleluia.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral expansion. Six expansions use the matching complete old formula plus rubric; two shortenings delete terminal nostrum only. No saint N. substitution or new Doctor/Pope clause."
