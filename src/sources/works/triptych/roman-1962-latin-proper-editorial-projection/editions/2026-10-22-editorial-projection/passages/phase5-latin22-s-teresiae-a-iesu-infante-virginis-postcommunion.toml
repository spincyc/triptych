notes = "Whole canonical body SHA256 including hard wraps and final LF bd156cf03db2181218acba1a033684509dd2867ea60aeedcd169291c1f9e7e15. Historical whole-petition passage passage.anselm-schott.das-vollstandige-romische-messbuch.herder-second-revised-1929.phase5-latin22-s-teresiae-a-iesu-infante-virginis-postcommunion; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-s-teresiae-a-iesu-infante-virginis-postcommunion.  Named October3 Postcommunion only; actual saint name and caritatis are typeset in both whole prayers. Historical ending \"Per Dominum nostrum.\"; actual target ending \"Per Dominum nostrum.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral expansion. Six expansions use the matching complete old formula plus rubric; two shortenings delete terminal nostrum only. No saint N. substitution or new Doctor/Pope clause."
