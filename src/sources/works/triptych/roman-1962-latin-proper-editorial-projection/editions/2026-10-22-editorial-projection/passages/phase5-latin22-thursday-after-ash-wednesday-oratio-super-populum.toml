notes = "Whole canonical body SHA256 including hard wraps and final LF 96fa3323adf06aa40efee765bada25fdee952b141f7964a0b946be17d042d74b. Historical whole-petition passage passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-thursday-after-ash-wednesday-oratio-super-populum; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-thursday-after-ash-wednesday-oratio-super-populum. Only standard conclusion length changes: historical Per Dominum. to actual target Per Dominum nostrum.; nostrum is witnessed in one complete old standard formula, not borrowed from another petition. Target colon after tuo and comma after ut are pointing, not a petition variant. Whole printed conclusion ends Deus. No Amen or per omnia supplied. Its ejusdem belongs to this exemplar's explicit Spiritus sanctus petition. Every Father-directed target here stops BEFORE ejusdem, so no ejusdem word is inserted, deleted from a target, or carried into these petitions. Same-address standard conclusion prefix from passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-father-through-son; governing historical instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17 and passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. No historical proper is claimed to print its expanded target ending. Historical ending \"Per Dominum.\"; actual target ending \"Per Dominum nostrum.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral e