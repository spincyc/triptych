notes = "Whole canonical body SHA256 including hard wraps and final LF 6607863842ea49d0be968e7d46bdfb007173bdd1d545e7547a61e99504cc1670. Historical whole-petition passage passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-lent-1-ember-wednesday-oratio-super-populum; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-lent-1-ember-wednesday-oratio-super-populum. Only same-class standard conclusion adds nostrum, witnessed contiguously in the old formula. Target commas around quaesumus Domine, semicolon after sunt and comma after et are pointing; petition/address unchanged. Whole printed conclusion ends Deus. No Amen or per omnia supplied. Its ejusdem belongs to this exemplar's explicit Spiritus sanctus petition. Every Father-directed target here stops BEFORE ejusdem, so no ejusdem word is inserted, deleted from a target, or carried into these petitions. Same-address standard conclusion prefix from passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-father-through-son; governing historical instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17 and passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. No historical proper is claimed to print its expanded target ending. Historical ending \"Per Dominum.\"; actual target ending \"Per Dominum nostrum.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral expansion. Six expansions use the matching complete old formula plus rubric; two shortenings delete terminal nostrum only. No saint N. substitution or new Doctor/Pope clause."
