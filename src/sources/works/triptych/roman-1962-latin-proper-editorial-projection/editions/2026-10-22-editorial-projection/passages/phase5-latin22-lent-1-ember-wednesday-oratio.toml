notes = "Whole canonical body SHA256 including hard wraps and final LF 49ca63839813f8f0be869fe588411b9e7801d2b869b5cd3ff41b4232003f817c. Historical whole-petition passage passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-lent-1-ember-wednesday-oratio; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-lent-1-ember-wednesday-oratio. Role is the local unformed Oratio, raw occurrence1, the second physical oration after first Gradual462; NOT opening Collect Preces nostras460 and NOT Oratio super populum Mentes nostras471. Only the same-class standard conclusion expands; actual stop in unitate is preserved. Commas around quaesumus Domine follow target pointing; formula Jesum/Iesum is j/i. No further conclusion suffix added. Whole printed conclusion ends Deus. No Amen or per omnia supplied. Its ejusdem belongs to this exemplar's explicit Spiritus sanctus petition. Every Father-directed target here stops BEFORE ejusdem, so no ejusdem word is inserted, deleted from a target, or carried into these petitions. Same-address standard conclusion prefix from passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-father-through-son; governing historical instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17 and passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. No historical proper is claimed to print its expanded target ending. Historical ending \"Per Dominum nostrum.\"; actual target ending \"Per Dominum nostrum Iesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral expansion. Six expansions use the matching complete old formula plus rubric; two shortenings delete terminal nostrum only. No saint N. substitution or new Doctor/Pope clause."
