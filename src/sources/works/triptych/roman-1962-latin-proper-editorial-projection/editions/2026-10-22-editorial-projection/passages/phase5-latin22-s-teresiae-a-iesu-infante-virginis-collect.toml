notes = "Whole canonical body SHA256 including hard wraps and final LF af5711fcc13cd77c33978d3406ffa1cb0295a737023cbb6ca95c31531e62c66f. Historical whole-petition passage passage.anselm-schott.das-vollstandige-romische-messbuch.herder-second-revised-1929.phase5-latin22-s-teresiae-a-iesu-infante-virginis-collect; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-s-teresiae-a-iesu-infante-virginis-collect. The Son-directed Qui vivis family stays Son-directed; no Per Dominum to Qui vivis addressee substitution. Actual target prints only through in unitate.; it does NOT print Spiritus Sancti, Deus, per omnia or Amen. Formula exemplar comma after Patre is absent in target: pointing only. Whole petition word identity is retained; accents, ligatures and physical wraps normalized. Fresh actual unit number is3758, not the prior research receipt's3761.3761 is the right-column Alleluia. Prior files remain unchanged. Whole as-printed formula is itself explicitly abbreviated by etc.; no expansion of etc. is claimed or used. All nine words actually printed by the Therese target precede Spiritus and stand contiguously here. No Spiritus Sancti, Deus, per omnia or Amen is added to the target. Same-address standard conclusion prefix from passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-son-addressed; governing historical instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17 and passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. No historical proper is claimed to print its expanded target ending. Historical ending \"Qui vivis.\"; actual target ending \"Qui vivis et regnas cum Deo Patre in unitate.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral expansion. Six expansions use the matching complete old formula plus rubric; two shortenings delete terminal nostrum only. No saint N. substitution or new Doctor/Pope clause."
