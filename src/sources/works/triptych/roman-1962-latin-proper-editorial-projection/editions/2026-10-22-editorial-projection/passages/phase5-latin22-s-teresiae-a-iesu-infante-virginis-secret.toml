notes = "Whole canonical body SHA256 including hard wraps and final LF 44ae620a19de8395079129c2c441a1d94df62b63057d618cf37682b000ee32f1. Historical whole-petition passage passage.anselm-schott.das-vollstandige-romische-messbuch.herder-second-revised-1929.phase5-latin22-s-teresiae-a-iesu-infante-virginis-secret; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-s-teresiae-a-iesu-infante-virginis-secret. cujus/cuius and ejus/eius declared j/i orthography. Historical Schott PDF1482/[268] and target1962 PDF756/p675/unit3766 both print solemniter (one l); retained without spelling normalization. Target commas after ut and exhibetur are explicitly projected. Named October3 Secret only; actual saint name is printed, no N. fill or saint substitution. Historical ending \"Per Dominum nostrum.\"; actual target ending \"Per Dominum nostrum.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral expansion. Six expansions use the matching complete old formula plus rubric; two shortenings delete terminal nostrum only. No saint N. substitution or new Doctor/Pope clause."
