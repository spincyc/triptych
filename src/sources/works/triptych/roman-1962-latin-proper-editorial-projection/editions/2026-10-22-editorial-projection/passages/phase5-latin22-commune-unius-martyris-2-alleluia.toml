notes = "Whole canonical body SHA256 including hard wraps and final LF 5b8d34963dd1739949a0933d110cbefd33977b552741d89a66b3c5ec97cc70b2. Historical whole-petition passage passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-commune-unius-martyris-2-alleluia; target control passage.catholic-church.missale-romanum.vatican-typica-1962.phase5-latin22-commune-unius-martyris-2-alleluia. Alleluja/Alleluia j/i; historical Sacerdos / target sacerdos capitalization. Whole double-opening, verse and terminal Alleluia. Outside-Paschal Common II only; actual target replaces it with the printed Tract after Septuagesima. No N. fill, no oration, no SupremePontiff transfer. Historical ending \"Dominus. Alleluja.\"; actual target ending \"Dominus. Alleluia.\". Join physical wraps; remove stress; expand ligatures; project only target pointing/capitals and declared consonantal j (Jesum, Joannem, jugi/jugiter, ejus, cujus, majestati). Keep received Alleluia. Declare actual received spellings sepulchro/sepulcro, coel-/cael- and poenitentiae/paenitentiae where applicable. Every petition and address is independently complete. Actual conclusion length follows the target under guidance/propers-for-agents.md, not a generic oral expansion. Six expansions use the matching complete old formula plus rubric; two shortenings delete terminal nostrum only. No saint N. substitution or new Doctor/Pope clause."
