notes = "Canonical body SHA256 8f4b5f230c0989a7744dd21ce1861b675a9eab13dbe4789628e2363721feedf6. Complete historical petition passage.catholic-church.missale-romanum.1922-tours-mame-editio-quarta-iuxta-typicam.annual-oratio-early-20261023-lent-3-monday; separate target control passage.catholic-church.missale-romanum.vatican-typica-1962.annual-oratio-early-20261023-lent-3-monday. Historical and target complete prayers were checked on page images at 200 dpi and 400 dpi. The target expands the same Father-through-Son conclusion through in unitate; the Mame prayer prints only Per Dominum nostrum. The complete old Pustet formula supplies the contiguous conclusion prefix, with Jesum/Iesum spelling and the comma after Christum projected to the target. The target stops before Spiritus sancti Deus or ejusdem, per omnia or Amen. Same-address old formula control passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-father-through-son; historical formula instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17, passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. The old Praesta exemplar contains ejusdem only after the contiguous prefix used here; no target is changed to add or remove that word."
