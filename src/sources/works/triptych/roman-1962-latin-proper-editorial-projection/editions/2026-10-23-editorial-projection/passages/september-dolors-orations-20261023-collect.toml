notes = "Complete body SHA256 5e705b56b91a3f1be8277f9729315172ab42f29b059612d29f02057c7c35c7c1. Petition witness passage.catholic-church.missale-romanum.pustet-ratisbon-1862.september-dolors-orations-20261023-september-collect; explicit source referrals passage.catholic-church.missale-romanum.pustet-ratisbon-1862.september-dolors-orations-20261023-september-referral, passage.catholic-church.missale-romanum.1922-tours-mame-editio-quarta-iuxta-typicam.september-dolors-orations-20261023-september-referral; full conclusion control passage.catholic-church.missale-romanum.pustet-ratisbon-1862.september-dolors-orations-20261023-advent-collect-formula-control; target control passage.catholic-church.missale-romanum.vatican-typica-1962.september-dolors-orations-20261023-collect. Complete petition agrees word for word after case, stress-accent, ligature and layout normalization. Historical Qui vivis et regnas is shorter than the actual target ending. The complete independently printed Pustet first-Advent conclusion supplies exactly the contiguous Qui vivis et regnas cum Deo Patre in unitate prefix, stopping where the target stops. Pustet prints virginis and matris in lower case and no comma after ut; Mame independently prints the same September petition on its fixed 15 September feast. The distinct Friday middle clause is not used."
