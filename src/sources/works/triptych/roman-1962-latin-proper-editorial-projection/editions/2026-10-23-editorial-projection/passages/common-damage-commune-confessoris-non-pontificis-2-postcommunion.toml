notes = "UTF-8 body SHA256 including final LF 9aa7c72b25c7355ec40a80774dcb9c1bcb9dd963b1e2eb644f4c61c399d5a318. Target conclusion: Per Dominum nostrum Jesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate. Historical conclusion: Per Dominum. Pustet prints coelestia against target caelestia, omits the comma after ut, and abbreviates Per Dominum. The target ends at in unitate. Pustet Rubricae generales paragraph17 (PDF44) directs the father-addressed conclusion; its PDF390 Praesta formula independently prints Per Dominum nostrum Jesum Christum Filium tuum: Qui tecum vivit et regnat in unitate as one contiguous prefix. No following ejusdem Spiritus sancti Deus is supplied."
