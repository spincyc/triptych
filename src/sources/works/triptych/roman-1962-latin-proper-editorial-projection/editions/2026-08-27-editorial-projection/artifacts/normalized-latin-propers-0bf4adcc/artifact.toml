transformation = "Select only the ten registered Lasance Latin prayers; join printed line wraps; expand printed ae/oe ligatures to ae/oe; omit headings, English, rubrics, stress accents, and layout; retain the project's j orthography; and apply only the controlling 1962 printing's non-substantive spelling, capitalization, punctuation, and standard conclusion expansion. Specifically: Cyril uses Genetricem/Genetrici and Per eundem rather than Lasance Genitricem/Genitrici and Per eumdem, with the Secret and Postcommunion conclusions expanded; Peter Canisius adopts the 1962 pointing while the projection retains ejus; Ephrem expands Per Dominum; John Eudes adopts the 1962 pointing and expanded Per eundem conclusion while the projection retains cujus; Sylvester adopts the 1962 pointing and capitalization and expands the Secret conclusion; Damasus omits Lasance's comma after Pontificem. No lexical petition, proper name, or other substantive wording is supplied from the later witness. Preserve the already hash-bound target line wrapping so the artifact ranges reproduce the calendar bodies byte for byte."
