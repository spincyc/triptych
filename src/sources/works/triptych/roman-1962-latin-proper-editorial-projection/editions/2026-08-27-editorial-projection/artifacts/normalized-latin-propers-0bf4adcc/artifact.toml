rights_basis = "Triptych created the bounded selection, transcription layout, normalization decisions, and collation record and offers those editorial contributions under CC BY 4.0. The ten underlying Latin prayers remain public domain in the United States: each was already printed in the public-domain Lasance New Roman Missal before the 1962 typical edition, whose affirmative basis is failure to renew registrations A 110108 and A 192159 as established at registration-number level in src/sources/inventories/lasance-new-roman-missal-rights-v1.toml. Triptych claims no exclusive right in those underlying words. The target-edition comparison selects only mechanical spelling, capitalization, punctuation, and unabbreviated standard conclusions within the preexisting formulas; no page image, layout, English translation, rubric, biography, appendix matter, or 1962-only formula is reproduced."
rights_jurisdiction = "United States"
provenance = "Created by Triptych on 2026-08-27 from ten registered Lasance page-image passages and ten exact remote 1962 facsimile passages. The recovered pre-quarantine calendar snapshot supplied the previously hash-bound target transcription; every resulting prayer hash was checked against its retained Roman-1962 provenance row. This artifact is a project editorial projection over those witnesses, not a Lasance-owned normalized edition."
