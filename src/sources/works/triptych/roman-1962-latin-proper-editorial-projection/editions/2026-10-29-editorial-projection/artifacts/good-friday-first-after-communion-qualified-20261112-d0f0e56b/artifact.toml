notes = "Whole-expression differences: Opening order Domine, quaesumus becomes quaesumus, Domine. Target adds the entire relative clause qui passionem et mortem Filii tui devota mente recoluit after Domine. The consecutive five blessing petitions are preserved, including indulgentia veniat, whose old reading is supported by the whole p37 printing and its apparatus. The old literal Per. becomes Per eundem Christum Dominum nostrum. R. Amen.; target Oremus and Oratio prima are adjacent framing, not included in this compared body. The modern Good Friday after-Communion placement is distinct from the old Ad Populum context. Strongest contrary: The newly inserted full relative clause gives a specific commemorative rationale and ties the old blessing to the Good Friday assembly. Even where its vocabulary is conventional, this substantive clause and the resulting whole-prayer arrangement cannot be classed as mere spelling, inflection or punctuation. No exact premodern witness for that entire target clause in this whole has been established. The antiquity of the five petitions and the conventional conclusion do not alone settle originality of the modern whole."
