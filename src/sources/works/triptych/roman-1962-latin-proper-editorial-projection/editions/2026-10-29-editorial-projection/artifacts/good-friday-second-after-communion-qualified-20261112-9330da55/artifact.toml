notes = "Whole-expression differences: Omnipotens sempiterne Deus becomes Omnipotens et misericors Deus. After Christi tui beata passione target adds et morte. Present reparas becomes perfect reparasti. Plural opera misericordiae tuae becomes singular operam misericordiae tuae. ut in huius celebritate mysterii becomes ut, huius mysterii participatione,. Pointing changes after reparasti to colon and tuae to semicolon; target commas mark the participatione phrase. The old literal Per. becomes Per eundem Christum Dominum nostrum. R. Amen.; target Oremus and Oratio secunda are adjacent framing, not included in this compared body. The modern Good Friday after-Communion placement differs from old Feria iv Hebdom. sexta. Strongest contrary: The accumulated changes recast the divine address, explicitly add death, shift the restoration from present to completed action, change plural works to one work, and replace celebration with participation in the mystery. These coordinated theological and rhetorical choices must be considered together. Conventional vocabulary and a recognizable old prayer skeleton do not prove that the whole modern arrangement is unprotected. No exact premodern whole target witness has been established."
