notes = "Publication is limited to the exact code-pinned finite authority; this carrier grants no permission to another body, owner or language. Preserved whole-expression reason: The complete already-Marian old prayer retains the acceptance of gifts, supporting merits and saving-result request in the same grammatical and expressive sequence. Replacing the local Holy House/worthy-offering description with the separately old rejoicing-Church description, reordering the Marian title and identifying Mary as Queen are considered together. The theological shift and cumulative arrangement are material contrary evidence, but this exact final whole makes a conventional application of the received prayer without a new petition, narrative or literary development. This is a qualified, moderate whole-expression judgment; old ingredients alone are not its basis. Strongest contrary: Replacing a particular holy house with the rejoicing universal Church changes the ecclesial perspective. Associating that offering with Mary specifically as Queen and repositioning the Marian title could be deliberate theological redaction. The resulting whole may satisfy the low originality threshold even if the older prayer and short expressions are independently unprotected; availability of an older framework is not itself clearance of that later redaction."
