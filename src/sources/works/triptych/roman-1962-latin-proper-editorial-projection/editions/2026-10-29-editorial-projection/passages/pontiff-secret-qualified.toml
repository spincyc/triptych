notes = "CanonicalLatinSHA513de5a7dff9120d02f2fcc6cbc4c5a9d19a69ffd18e9075c5325885a98e43ab. Modernchanges: Add conventional sacrificial adjunct Oblatis muneribus and supplication quaesumus before the same continuous prayer. Expand conventional printed conclusion per. to Per Dominum nostrum. Inlumina/illumina spelling, stress accents, case, pointing and layout differ. Strongestcontrary: Even a short sacrificial adjunct deliberately adapts the purpose of an older prayer, and cumulative redaction may clear low originality threshold. No direct judgment or holder permission establishes this precise later form; Lasance translation nonrenewal does not clear underlying Latin. Move the vocative Domine from after Ecclesiam tuam in the older prayer to before Ecclesiam tuam in the target; this routinewordorder change is explicit and not literal whole-sequence identity."
