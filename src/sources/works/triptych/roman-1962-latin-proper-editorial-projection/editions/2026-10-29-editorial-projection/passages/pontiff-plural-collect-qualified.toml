notes = "Canonical Latin SHA256 77215320cce36c1a3823c3643d63bac8f3f98579ded3eb454c1fead0f6abf440. Whole older foundation: Gregem tuum Pastor bone placatus intende et per beatos apostolos perpetua protectione custodi quos totius ecclesiae praestitisti Filii tui vicarios esse pastores per. Complete differences: Apply the older edition's own correction Pater to Pastor at printed p. 42 line 8, expressly directed by its errata at PDF p. 24. This is an internal correction of the older base, not a later adaptation. Replace the vocative epithet bone with aeterne: good Shepherd becomes eternal Shepherd. Replace the old object beatos apostolos with beatos N. et N. (Martyres tuos atque) Summos Pontifices. The two N. placeholders, their joining et, the optional Martyr title and the Supreme Pontiff title are all directly printed by the 1962 target; no name or title is inferred. Retain the older prayer's plural grammar: beatos, quos and pastores. Unlike the independently assessed singular form, this plural target requires no singular/plural adjustment of those words. Remove Filii tui vicarios from the older relative clause. The later version says whom you appointed as shepherds of the whole Church, without the older vicars of your Son clause. Retain the target's actual conventional conclusion Per Dominum. The older edition prints the shorter cue per.; no longer conclusion or response is supplied. Project the target's capitals, commas, colon, semicolon, periods, parentheses, and N. placeholders; remove stress accents and expand ae ligatures; join line wraps and decorative initials. These do not turn the older and later whole words into literal identity. Strongest contrary argument: Replacing apostles with named Supreme Pontiffs, adding the optional martyr designation, changing good to eternal and omitting vicars of your Son is theological redaction. The cumulative adaptation might satisfy the low originality threshold even though the connected older arrangement is retained. The prior singular Common/Damasus judgment does not authorize this plural target, and no holder permission or court judgment for this exact form is asserted. Qualified United States editorial assessment proposed under publication policy section 1 priority 6; moderate confidence. The continuous 1896 whole foundation is public domain, but this later plural form is not literally that whole prayer. Its theological-redaction originality objection remains. This is not holder permission or an unqualified public-domain claim. Root must adopt the exact finite authority before publication."
