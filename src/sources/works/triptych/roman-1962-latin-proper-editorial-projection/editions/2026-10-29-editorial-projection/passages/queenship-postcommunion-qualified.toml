notes = "After Celebratis insert solemniis, stating explicitly the implicit solemn rites; retain source target one-l spelling solemniis. Replace apostolorum tuorum beata passione with sanctae Mariae Reginae nostrae festivitate (memoria). This changes the Apostles and their blessed passion to Mary our Queen and her feast or commemoration; retain the parenthetical alternative. Replace ipsorum by eius, move fiant after intercessione, and replace in quorum nataliciis by in cuius honore. These are actual pronoun, order, and honor-language changes. Replace historical per. by actual target Per Dominum., whose independent older literal support is the Mame complete prayer. Do not expand either cue or infer a liturgical ending. Add target punctuation, remove stress accents, expand ligatures and join line wraps. Retain printed eius and cuius exactly; no consonantal-j normalization in this finite body. Whole-body publication judgment is qualified and moderate, limited to the exact code-pinned finite authority."
