notes = "Complete projected body SHA256 3974253887789b2974cdbfb12dc7ef34e9d28ce270511247c740ce8042031d34. Publication rests on the complete Pustet1862 chant, which prints ima exactly. Mame prints imma, a contrary spelling not silently corrected or used as sole authority. Against Pustet, target adds the comma after Ave, capitalizes Virgo and spells Alleluia with i. Pustet Jesse agrees with calendar Jesse, target Iesse is the declared consonantal-j projection. Printed Scripture citation labels are metadata, not chant words."
