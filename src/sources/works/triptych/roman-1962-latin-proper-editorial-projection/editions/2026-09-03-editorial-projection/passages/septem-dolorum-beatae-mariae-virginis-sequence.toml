locus = "septem-dolorum-beatae-mariae-virginis, Sequence; editorial-projection artifact physical lines 43-62; antecedent 1862 Pustet: printed pp. 420-421, text-layer lines 59897-59977 and 59989-59995, under the heading Sequentia in Missis Votivis omittenda. at lines 59894-59896. FILED UNDER ANOTHER DAY: the 1862 prints this Sequence once only, inside its March sanctoral formulary Festum VII. Dolorum B. M. Virg. (running head at line 59852) which its own date-line assigns to the Friday after Passion Sunday. Its September observance carries no formulary at all - at Festa Septembris (Dom. III. - 15. 16.), lines 74314-74320, it prints In Festo VII. Dolorum ... Missa dicatur ut in alio Festo ... sub mense Martii fol. 419. That is the 1862 sending the reader to the very lines transcribed here. The 1862 also files the September day on the THIRD SUNDAY of September, which is Pius VII's 1814 placement; Pius X moved it to 15 September in 1913. The day moved and the words did not. Read from the text layer alone; this book's page images are not available to this lane.; target printed pp. 657-658, no. 3624; artifact PDF pp. 738-739 - in fact the whole Sequence is on PDF p. 738, left column lines 8-40 and right column lines 1-27, under the heading Sequentia with the rubric (in Missis votivis omittenda) on its own line beneath. The printed folio 657 stands in the head of PDF p. 738 and 658 on p. 739; pdf page = printed page + 81, read off the 400 dpi page image. Twenty strophes; the last line reads Paradisi gloria. Amen. Alleluia. contiguously, not on separate lines."
