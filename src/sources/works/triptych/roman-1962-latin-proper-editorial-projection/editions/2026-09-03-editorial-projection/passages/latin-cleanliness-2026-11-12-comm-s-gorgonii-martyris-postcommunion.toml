notes = "The exact selected UTF-8 bytes, including terminal LF, have SHA-256 8294aa96abf2c6d1b207cea9ae97a96667b8f5b97fe70d1102acf566fa1baaa4. Supersedes the owner join to passage.triptych.roman-1962-latin-proper-editorial-projection.editorial-projection-2026-09-03.comm-s-gorgonii-martyris-postcommunion; that old passage and payload remain immutable. Both page images print quae as the ae ligature in vegetet: quae in Martyre, not quas. The entire petition was read against both witnesses. The 1862 ends pascatur. and proceeds directly to De Spiritu sancto. Postcomm.; it prints no conclusion at this place, contrary to the old provenance claim of a short conclusion cue. The 1962 prints pascatur: Qui tecum vivit et regnat in unitate.; the existing target punctuation and conclusion remain unchanged."
