notes = "Scope is closed at the 17 orations listed in the passages of this edition bearing the mame-seventeen prefix. The separate Pustet 1862 and 1962 passages remain the historical and target witnesses; this project-created artifact owns only the editorial projection. The 1862's ornamental drop capitals are destroyed by that scan's recogniser, so the opening word of many antecedent readings is reconstructed from the visible tail and from the 1570 or 1604 at the same place; every such reconstruction is named in its own ledger row and is never absorbed silently into a reading."
