transformation = "Select only the proper orations of commune-dedicationis-ecclesiae, commune-festorum-bmv, commune-virginum-4, missa-de-s-maria-in-sabbato-2, missa-de-s-maria-in-sabbato-3, missa-de-s-maria-in-sabbato-4 as the 1862 Pustet prints them; join printed line wraps; remove stress accents; expand printed ae/oe ligatures to ae/oe; normalise the target's consonantal i to the calendar's declared j orthography; omit headings, rubrics, marginal numbers, layout, and the 1862's own pre-1955 Secunda Oratio, Alia Secreta, Alia Postcommunio and Tertia ad libitum; and apply the controlling 1962 printing's punctuation and its conclusion at the length that printing sets it. No lexical petition, proper name or clause is supplied from the later witness."
