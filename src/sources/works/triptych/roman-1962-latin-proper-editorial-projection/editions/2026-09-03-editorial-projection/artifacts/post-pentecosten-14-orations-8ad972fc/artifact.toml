transformation = "Select only the three proper orations of Dominica XIV post Pentecosten as the 1862 Pustet prints them; join printed line wraps; remove stress accents; expand printed ae/oe ligatures to ae/oe; retain the project's j orthography; omit headings, rubrics, marginal numbers, layout, and the 1862's own pre-1955 Secunda Oratio, Alia Secreta and Tertia ad libitum pointers; and apply only the controlling 1962 printing's punctuation and standard conclusion. Specifically: add the comma after Domine in the Collect and the Secret, which the 1862 does not set; replace the 1862's comma after mortalitas with the target's semicolon; and carry the target's longer Per Dominum nostrum conclusion on the Postcommunion against the 1862's Per Dominum. No lexical petition, proper name or clause is supplied from the later witness; the words themselves stand in the 1862 unchanged."
