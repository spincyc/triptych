rights_basis = "Triptych created the bounded selection, transcription layout, normalization decisions, and collation record and offers those editorial contributions under CC BY 4.0. The underlying Latin prayers are public domain in the United States because each stands word for word in two separately registered public-domain printings: the Pustet printing published at Ratisbon in 1862 and the Mame printing published at Tours in 1922. Triptych claims no exclusive right in those underlying words. The target-edition comparison selects only mechanical punctuation, project orthography, and the conclusion as printed, within the preexisting formulas; no page image, layout, rubric, marginal number, or other 1962-only matter is reproduced."
