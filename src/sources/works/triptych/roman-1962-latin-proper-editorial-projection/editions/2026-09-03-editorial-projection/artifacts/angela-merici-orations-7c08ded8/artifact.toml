notes = "Scope is closed at the 2 bodies listed in the passages of this edition that name this artifact. The separate 1862, 1922 and 1962 passages remain the historical and target witnesses; this project-created artifact owns only the editorial projection. Every antecedent reading named in the ledger was made on a page image of its book, not on a text layer; the 1862 text-layer line numbers in those rows are an address in the tracked text artifact, not the source of the reading. The 1862 leaves were read on the registered facsimile PDF artifact.catholic-church.missale-romanum.pustet-ratisbon-1862.ia-facsimile-pdf-363d6fc3, which each such ledger row names beside the text artifact. The Collect of the same day is projected in ki054-page-reading-orations-7d558094, whose scope was closed before these two were read."
