transformation = "Select only the Secret and the Postcommunion of s-angelae-mericiae-virginis that the 1962 typical edition prints at printed p. 542, nos. 2698 and 2699; read each on the 1962 page image; join printed line wraps; remove stress accents; expand printed ae/oe ligatures to ae/oe; normalise the target's consonantal i to the calendar's declared j orthography, which neither body needs; omit headings, rubrics, marginal numbers, the marginal P letters and layout; and apply the controlling 1962 printing's punctuation and its conclusion at the length that printing sets it. No word is supplied from either public-domain witness."
