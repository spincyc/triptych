provenance = "Created by Triptych on 2026-10-01 for the follow-up to the KI-054 page-reading lane, whose reading of the 1962 facsimile found that the typical edition appoints St Angela Merici her own Secret and Postcommunion at printed p. 542, nos. 2698 and 2699, each marked P, under the directive Missa Dilexisti, de Communi Virginum III loco [32], cum orationibus ut infra, while the calendar held only her Collect. Each was read at 200 and again at 400 dpi from the exact registered CMAA facsimile and corroborated word for word on the page images of two registered public-domain printings: the 1862 Pustet facsimile, whose appendix of Masses pro aliquibus locis keeps her on 31 May at printed pp. [144]-[145], and the 1922 Tours Mame, which keeps her on 31 May at printed pp. 604-605. This artifact is a project editorial projection over those witnesses, not an edition of any Missal."
