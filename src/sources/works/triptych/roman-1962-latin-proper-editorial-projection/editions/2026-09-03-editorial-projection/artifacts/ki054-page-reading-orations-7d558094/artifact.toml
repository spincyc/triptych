transformation = "Select only the proper orations and chants of comm-beatae-mariae-virginis-a-mercede, comm-s-agnetis-virginis-martyris-secundo, comm-s-gorgonii-martyris, comm-s-hermetis-martyris, comm-s-pauli-apostoli, comm-s-petri-apostoli, comm-septem-dolorum-beatae-mariae-virginis, comm-ss-felicis-simplicii-faustini-beatricis, comm-ss-hippolyti-cassiani-martyrum, comm-ss-naboris-felicis-martyrum, comm-ss-proti-hyacinthi-martyrum, comm-ss-symphorosae-septem-eius-filiorum, comm-ss-xysti-ii-papae-felicissimi, praesentatione-beatae-mariae-virginis, s-angelae-mericiae-virginis, s-elisabeth-reginae-viduae, s-gregorii-i-papae-confessoris-ecclesiae, s-gregorii-vii-papae-confessoris, s-gulielmi-abbatis, s-henrici-imperatoris-confessoris, s-hilarii-episcopi-confessoris-ecclesiae-doctoris, s-ioannae-franciscae-fremiot-chantal-viduae, s-margaritae-reginae-viduae, s-mariae-magdalenae-pazzis-virginis, s-norberti-episcopi-confessoris, s-philippi-benitii-confessoris, s-rosae-limanae-virginis, septem-dolorum-beatae-mariae-virginis that the 1962 typical edition prints and that stood blocked on recogniser damage; read each on the 1962 page image; join printed line wraps, and in the two Sequences join each strophe's three printed lines into one line, one strophe per line, with a closing Amen the page sets apart kept on its own line; remove stress accents; expand printed ae/oe ligatures to ae/oe; normalise the target's consonantal i to the calendar's declared j orthography; omit headings, rubrics, marginal numbers, the marginal P and C letters, layout, and the Tract's printed scripture citation; and apply the controlling 1962 printing's punctuation and its conclusion at the length that printing sets it. No lexical petition, proper name or clause is supplied from the later witness except the saint's name the Missal's own rubric directs into a Common's blank, recorded per oration."
