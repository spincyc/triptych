notes = "UTF-8 body SHA256 including final LF 97ad4723bc068a2356abf4bd4c55d7567a6690ee1266d2cef3537ca433298a0a. Target conclusion: Per Dominum nostrum Jesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate. Historical conclusion: Per Dominum. Every complete petition word agrees. Pustet omits the target comma after ut and inserts a comma after Vincentii. Both independently read pages print Adesto, Domine,; the 1962 has no XI between supplicationibus and nostris. The historical saint-day prayer actually stops at Per Dominum.; its cue is not expanded as if printed. The independently read complete Praesta prayer at PustetPDF390/printed304 witnesses every word in the target longer conclusion contiguously through in unitate. The target actual stop at in unitate is retained, without importing the formula subsequent ejusdem Spiritus sancti Deus. Calendar Jesum represents the target printed Iesum under the established consonantal-i convention."
