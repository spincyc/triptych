notes = "UTF-8 body SHA256 including final LF 930d2a1efd6953449a0b2ca03ad38af696e56035d64bc75b88b1e89e62a06f65. Target conclusion: Per Dominum. Historical conclusion: Per Dominum. The complete public-domain counterpart is at the Common of several Martyrs in Paschal time, Pro pluribus Martyribus Pontificibus Secret, not this saint-day entry. Every petition word agrees. Pustet omits the target commas after Adesto and ut. The 1962 full prayer visibly prints Adesto, Domine, and meritis, with no JLJL between supplicationibus and nostris. Calendar j orthography represents printed iustitiae and adiuvemur. Both witnesses actually stop at Per Dominum."
