notes = "Exact full UTF8 body including final LF SHA256 8ac5c63a4f70f545c337ffb3ccf2a36223df16945211944a2ec31db59c72c0f0. Mame PDF 871/printed 757 supplies every one of the 37 petition words and its actual Per Dominum... in unitate ejusdem. cue. The actual 1962 PDF 799/printed 718/no.4097 stops at Per Dominum ... in unitate eiusdem Spiritus Sancti. Mame own IX17 on PDF 54/printed xlii explicitly prints In unitate ejusdem Spiritus Sancti, etc.; the separately registered Pustet PDF 390/printed 304 Praesta formula prints that suffix contiguously in a Father-through-Son conclusion. Only the two already printed target suffix words Spiritus Sancti are supported by these separate controls; neither omitted middle nor any later tail is added. The project retains its consonantal-j convention, punctuation, wraps and final LF. Pustet is formula support, never the source of this Josaphat petition."
