text = "In diebus illis: Ecce ego Ioannes vidi alterum Angelum ascendentem ab ortu solis, habentem signum Dei vivi: et clamavit voce magna quatuor Angelis, quibus datum est nocere terrae et mari, dicens: Nolite nocere terrae et mari, neque arboribus, quoadusque signemus servos Dei nostri in frontibus eorum. Et audivi numerum signatorum, centum quadraginta quatuor milia signati, ex omni tribu filiorum Israel. Ex tribu Iuda duodecim milia signati. Ex tribu Ruben duodecim milia signati. Ex tribu Gad duodecim milia signati. Ex tribu Aser duodecim milia signati. Ex tribu Nephtali duodecim milia signati. Ex tribu Manasse duodecim milia signati. Ex tribu Simeon duodecim milia signati. Ex tribu Levi duodecim milia signati. Ex tribu Issachar duodecim milia signati. Ex tribu Zabulon duodecim milia signati. Ex tribu Ioseph duodecim milia signati. Ex tribu Beniamin duodecim milia signati. Post haec vidi turbam magnam, quam dinumerare nemo poterat, ex omnibus gentibus, et tribubus, et populis, et linguis: stantes ante thronum, et in conspectu Agni, amicti stolis albis, et palmae in manibus eorum: et clamabant voce magna, dicentes: Salus Deo nostro, qui sedet super thronum, et Agno. Et omnes Angeli stabant in circuitu throni, et seniorum, et quatuor animalium: et ceciderunt in conspectu throni in facies suas, et adoraverunt Deum, dicentes: Amen. Benedictio, et claritas, et sapientia, et gratiarum actio, honor, et virtus, et fortitudo Deo nostro in saecula saeculorum. Amen."
