context = "A material negative. The chapter of exercitations on John 20 in volume 3 was read in the hashed optical character recognition of that volume: its sequence of verse lemmata runs Ver. 1, Ver. 5, Ver. 12, Ver. 17, Ver. 23, Ver. 24, Ver. 25, Ver. 26, Ver. 29, and it contains no lemma on verse 7. The note on Ver. 5 cites Bava Bathra on the depth of burial recesses, which shows that Lightfoot was hunting rabbinic parallels in this very passage. Registered without transcribed text because the finding is an absence; the reading was of an optical character recognition text, and a recognition miss cannot be excluded."
notes = "The two occurrences of the word napkin in the whole four-volume work stand in this volume's note on John 11:44 and read, in part, The dead man came forth, though bound hand and foot with his graveclothes, and blinded with the napkin. No rabbinic custom of a table napkin appears anywhere in the four volumes."
