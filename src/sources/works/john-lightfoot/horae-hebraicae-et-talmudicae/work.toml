description = "Lightfoot's seventeenth-century exercitations, which expound the Gospels, Acts, Romans and 1 Corinthians out of rabbinic literature verse by verse. Registered here chiefly for a material negative: across all four volumes of Gandell's Oxford edition the word napkin occurs twice, both in the note on John 11:44 and both about the Lazarus miracle rather than any custom, and the chapter on John 20 comments on verses 1, 5, 12, 17, 23, 24, 25, 26 and 29 without any note on verse 7."
