notes = "Uncorrected optical text of the whole volume. The retrieving lane read it at \"THE SEVENTEENTH SUNDAY AFTER TRINITY\", where Blunt prints the English collect over its Latin original tagged \"Greg. Orationes Quotidianae\", and at \"THE SIXTEENTH SUNDAY AFTER TRINITY\", where his table sets Eph. iii. 13-21 and Luke vii. 11-17 beside the Salisbury Use. 39327 LF-terminated lines. Extent as measured by the retrieving lane: Complete Internet Archive optical-text layer of John Henry Blunt, The Annotated Book of Common Prayer (London, 1866 printing as scanned by the Graduate Theological Union), whose Sunday-by-Sunday apparatus prints the English collect, the Latin original, and a table comparing the Salisbury Use, the modern Roman and the Eastern epistles and gospels. Optical layer only; no page image opened. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE: it is uncorrected recognition, and a raw-line negative over it cannot exclude a differently recognised spelling."
