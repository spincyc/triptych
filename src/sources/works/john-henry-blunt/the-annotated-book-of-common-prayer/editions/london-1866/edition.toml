notes = "What the bytes establish and what they do not. The scanned copy prints \"THE ANNOTATED BOOK OF COMMON PRAYER\" over \"LONDON: GILBERT AND RIVINGTON, PRINTERS, ST. JOHN'S SQUARE\", which names the printer; the publisher is not legible in the optical layer and is not asserted here. The copy is the Henry Pierce Library, San Francisco, deposit scanned by the Graduate Theological Union (Internet Archive item gtu_32400003882739), and it carries the publishers' May 1866 note about issuing the work in two Parts."
