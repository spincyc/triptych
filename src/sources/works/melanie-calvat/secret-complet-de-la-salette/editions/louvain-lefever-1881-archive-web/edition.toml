notes = "Public domain by age (1881 imprint). The scan is a user-contributed copy of an identified imprint; its searchable text layer is poor and should be used for navigation only, but the scan does carry page images and these are the authoritative reading. Correction recorded 2026-07-25: an earlier state of this note reported a discrepancy between the reproduced imprimatur formula 'Nihil obstat: imprimatur. Datum Lycii ex Curia Ep. die 15 Nov. 1879. Vicarius Generalis, Carmelus Arch. Cosma' (p. 22) and Bishop Zola's letter of 24 May 1880 in the same volume, whose text layer reads 'le 18 novembre 1879' (p. 31). Page-image collation of both pages on 2026-07-25 shows that the letter reads 'le 15 novembre 1879'; the two witnesses agree and the discrepancy was an artifact of the text layer. Consumers who recorded the discrepancy should review. Two items remain unresolved: an ambiguous two-digit number at p. 9 ('pendant plus de 33/35 ans'), and the title page's description of Zola as spiritual director 'depuis 1867' against his own 'de 1868 jusqu'en 1873' at p. 31. No image or copy of the 1879 Lecce imprint that this volume reprints has been reached. Exact scan bytes not retained in the repository."
