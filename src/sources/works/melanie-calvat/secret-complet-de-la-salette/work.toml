description = "The expanded first-person text attributed by Melanie Calvat to the apparition of 19 September 1846, subscribed by her at Castellammare on 21 November 1878, printed at Lecce in 1879 under a diocesan Nihil obstat: imprimatur, and reprinted at Louvain in 1881 with a preface, two of her recent letters, and a letter of Salvatore Luigi Zola, Bishop of Lecce and formerly her spiritual director. A further reprint (Societe Saint-Augustin, Paris-Rome-Bruges, 1922) was proscribed and condemned by the Holy Office on 9 May 1923 with an order to withdraw copies from the faithful; the Holy Office had already, on 21 December 1915, commanded all the faithful not to discuss or treat of the so-called Secret de la Salette. This record exists so that the document's identity, printing permission, and custody chronology can be cited accurately. Its content is not summarized here and is not the object of any approval. Loci are the parts of the 1881 volume and its printed page numbers."
relations = ["work.holy-see.decretum-secret-de-la-salette-1915", "work.holy-see.decretum-damnatur-opusculum-la-salette-1923"]
