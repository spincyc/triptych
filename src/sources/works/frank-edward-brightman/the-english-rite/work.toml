id = "work.frank-edward-brightman.the-english-rite"
title = "The English Rite: being a synopsis of the sources and revisions of the Book of Common Prayer"
responsible = "Frank Edward Brightman"
work_type = "liturgical-synopsis"
alternate_titles = ["The English Rite"]
languages = ["en"]
composed = "1915"
composed_basis = "Brightman dates his own preface \"Feb. 10, 1915\" in volume I, and both volumes print 1915 on the title page; the synopsis is his own compilation of that year. The sources it prints in parallel -- the Sarum books, 1549, 1552, 1661 -- are far older and are dated on their own records."
description = "Brightman's two-volume synopsis, printing the Latin and English sources of the Book of Common Prayer in parallel columns headed Sources, 1549, 1552 and 1661. Volume II carries the Communion service and the collects, epistles and gospels through the year; volume I the Calendar, the daily offices and the Litany."
