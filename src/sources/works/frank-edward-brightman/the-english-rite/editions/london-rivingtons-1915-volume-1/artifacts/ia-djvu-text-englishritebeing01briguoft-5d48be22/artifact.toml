notes = "Uncorrected optical text of the whole of volume I, from Internet Archive item englishritebeing01briguoft, a Victoria College, Toronto copy. The retrieving lane searched it for this Sunday's collect and found nothing, volume I holding the Calendar, the daily offices and the Litany; that bounded negative is what this file lets a reader replay. 75455 LF-terminated lines. Extent as measured by the retrieving lane: Complete optical-text layer of vol. I of the same work, retrieved and searched for this collect and this Sunday and carrying neither -- vol. I holds the Calendar, the daily offices and the Litany. A bounded negative, recorded so that the volume division is on the record. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE: it is uncorrected recognition, and a raw-line negative over it cannot exclude a differently recognised spelling."
