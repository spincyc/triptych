notes = "Title and imprint inspected on PDF page 5 of Internet Archive b29353233, the Wellcome Library copy. English is the editorial language, not a claim that all constituent texts are translated. Six bounded Greek priestly prayer units are independently checked against the scan; the other contents have not been transcribed or completely verified. Source notes: printed p. 2 (unnumbered, PDF 108), p. 308 (PDF 414); typography note p. ci (PDF 103); corrigenda pp. cii–civ (PDF 104–106). The p. 2 attribution of Paris graec. 2509 to the fourteenth century is corrected to the fifteenth century by the p. cii corrigendum. Modern Basil and Chrysostom sections here are distinct from the earlier Barberini/Grottaferrata section."
