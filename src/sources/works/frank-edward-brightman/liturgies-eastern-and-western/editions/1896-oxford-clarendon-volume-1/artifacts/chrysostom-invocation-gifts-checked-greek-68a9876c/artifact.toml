transformation = "From the exact parent PDF SHA-256 254f7d21b44436bdbac565b6f932d9e38d6ef8a062d9a8d944957e1a5d607ef0, manually transcribe only the priestly Greek text at Brightman 1896, Chrysostom; printed pp. 386–387; printed lines 386.24–27; 387.5,11,17; PDF pages 492,493 (one-based). Render source pages with Poppler pdftoppm -r 150 -png; independent reviewer used enlarged 360 dpi page/crop details where needed. Remove page furniture, line numbers, line wraps and line-end word division; exclude rubrics, speaker/mode cues, diaconal and congregational speech, apparatus superscripts and footnotes. Join retained speech blocks with one space, retaining printed punctuation and initials. Ordinary Greek spelling, accents, breathings, iota subscripts and capital/lowercase distinctions remain as printed; do not modernize words. Encode elision by U+2019. Encode the source’s scriptural uncial spans with uppercase Greek base letters and lunate capital sigma U+03F9, preserving every NFD combining accent, breathing and iota-subscript mark before NFC composition. This records the editorial uncial distinction explained on printed p. ci; it is not a claim that case is a wording variant. Preserve the source’s absence of terminal punctuation. Write exactly one NFC UTF-8 line followed by one LF. No OCR wording or modern secondary transcription controls this text. Speech-block metadata, using zero-based half-open Unicode codepoint ranges in the NFC body excluding final LF: [{\"source_printed_lines\":\"386.24–27\",\"codepoint_range\":[0,185],\"incipit\":\"Ἔτι προσφέρομέν σοι τὴν\"},{\"source_printed_lines\":\"387.5\",\"codepoint_range\":[186,246],\"incipit\":\"Καὶ ποίησον τὸν μὲν\"},{\"source_printed_lines\":\"387.11\",\"codepoint_range\":[247,300],\"incipit\":\"Τὸ δὲ ἐν τῷ\"},{\"source_printed_lines\":\"387.17\",\"codepoint_range\":[301,334],\"incipit\":\"Μεταβαλὼν τῷ Πνεύματί σου\"}]. Single separating spaces between blocks are derivative layout, not added punctuation."
notes = "Complete priestly invocation over the gifts, from Ἔτι προσφέρομέν through Μεταβαλὼν τῷ Πνεύματί σου τῷ Ἁγίῳ. Four priestly speech blocks retain printed initial capitals; intervening rubrics, diaconal commands, Amen responses and the following prayer for the effects of communion are excluded. Speech-block metadata, using zero-based half-open Unicode codepoint ranges in the NFC body excluding final LF: [{\"source_printed_lines\":\"386.24–27\",\"codepoint_range\":[0,185],\"incipit\":\"Ἔτι προσφέρομέν σοι τὴν\"},{\"source_printed_lines\":\"387.5\",\"codepoint_range\":[186,246],\"incipit\":\"Καὶ ποίησον τὸν μὲν\"},{\"source_printed_lines\":\"387.11\",\"codepoint_range\":[247,300],\"incipit\":\"Τὸ δὲ ἐν τῷ\"},{\"source_printed_lines\":\"387.17\",\"codepoint_range\":[301,334],\"incipit\":\"Μεταβαλὼν τῷ Πνεύματί σου\"}]. Single separating spaces between blocks are derivative layout, not added punctuation. Source scan is retained in full, so the exact source page and source typography remain available. Printed pp. cii–civ corrigenda were inspected; no listed correction alters these selected prayer words."
