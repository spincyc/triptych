context = "The note printed here describes Μεταβαλὼν τῷ Πνεύματί σου τῷ Ἁγίῳ as wording copied (μεταγραφὲν) from Chrysostom’s liturgy into Basil’s. It argues that the wording has no syntactic place in Basil and calls it an addition by an unnamed person, citing Nicodemus’s Pedalion note on canon 19 of Laodicea. This records the printed note’s assertion only: no receiving edition or manuscript, copyist or date is identified, and the cited Pedalion itself was not inspected. The note is outside the Basil main prayer; the clause appears in the Chrysostom main prayer at printed p. 387."
