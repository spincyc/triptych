context = "Complete priestly invocation over the gifts from Ἐλέησον ἡμᾶς through αἷμα τίμιον Χριστοῦ. Five priestly speech blocks remain in source order; intervening rubrics and people's Amen responses are excluded, as is the subsequent prayer for communicants beginning ἵνα γένηται. Greek James as printed in Brightman 1896 from Paris Bibliothèque nationale MS graec. 2509, ff. 194–210, according to printed p. 2. Its manuscript date is source-stated fifteenth century after the printed p. cii correction; the manuscript itself was not inspected. This is not the separately printed Syriac James text. Shared wording is a textual observation; this selection does not establish Catholic reception, a historical borrowing act, direction of dependence, a reconstructed common ancestor, or the entire anaphora."
notes = "The artifact-page range retains the whole controlling pages; verification concerns only the printed line locus and declared priestly prayer scope. The paired normalized-text passage has the same identifier without -facsimile. On 2026-10-16 two AI readers checked these bounded original page images and the final serialized text, including accents, case, punctuation, source typography and boundaries. The independent review reported no remaining glyph or word discrepancy. It confirmed 5 recoverable priestly speech block(s). This is an explicitly normalized comparison transcription, not a facsimile or a complete liturgical service. Speech-block metadata, using zero-based half-open Unicode codepoint ranges in the NFC body excluding final LF: [{\"source_printed_lines\":\"53.19–22\",\"codepoint_range\":[0,199],\"incipit\":\"Ἐλέησον ἡμᾶς ὁ Θεὸς\"},{\"source_printed_lines\":\"53.24–31\",\"codepoint_range\":[200,642],\"incipit\":\"τὸ κύριον καὶ ζωοποιόν,\"},{\"source_printed_lines\":\"54.2–3\",\"codepoint_range\":[643,739],\"incipit\":\"αὐτὸ τὸ Πνεῦμά σου\"},{\"source_printed_lines\":\"54.5–6\",\"codepoint_range\":[740,857],\"incipit\":\"ἵνα ἐπιφοιτῆσαν τῇ ἁγίᾳ\"},{\"source_printed_lines\":\"54.10\",\"codepoint_range\":[858,899],\"incipit\":\"καὶ τὸ ποτήριον τοῦτο\"}]. Single separating spaces between blocks are derivative layout, not added punctuation."
