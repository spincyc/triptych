context = "Brightman identifies Greek James pp. 31–68 as from Paris, Bibliothèque nationale, MS graec. 2509, ff. 194–210. Printed p. 2 initially says xivth century; the p. cii corrigendum changes p. 2 line 8 to xvth. The qualified source date is therefore fifteenth century, mediated through Brightman, not a directly inspected or independently dated manuscript. The Messina kontakion substitution on p. 36 lies outside our pp. 52–54 prayer selections."
