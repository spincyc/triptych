context = "Complete priestly anamnesis and its concluding offering formula; excludes the intervening mode-of-delivery rubric and following choir response. Printed p. 386 lines 14–17 and 19. Modern Greek Chrysostom text as printed in Brightman 1896, attributed on printed p. 308 to the Venice 1869 Euchologion with Athens 1890 reader material. Not the separate Barberini manuscript section. Shared wording is a textual observation; this selection does not establish Catholic reception, a historical borrowing act, direction of dependence, a reconstructed common ancestor, or the entire anaphora."
