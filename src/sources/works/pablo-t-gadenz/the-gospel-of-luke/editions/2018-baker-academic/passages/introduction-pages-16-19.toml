context = "Gadenz presents qualified traditional Lukan authorship and the continuing debate over Luke's identity; reports that most modern scholars date Luke to the 70s or 80s while explaining a minority pre-70 case; and judges the place of composition uncertain among proposals including Antioch, Corinth, Ephesus, Caesarea, and Rome. Page 19 note 20 reports the Anti-Marcionite Prologue's Achaia and Jerome's Achaia-Boeotia testimony."
verified_on = "2026-08-21"
notes = "Printed pp. 16-19, artifact PDF pp. 12-15. The passage supports neither uncontested authorship nor a settled Achaian place. Gadenz's chief modern date range is the 70s or 80s, not specifically AD 80-90; his early-date case is presented as a minority argument. His Achaia-Boeotia note is secondary reporting, for which the separately checked Jerome passage is the direct control."
