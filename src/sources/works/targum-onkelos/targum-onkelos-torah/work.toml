description = "The standard Jewish Aramaic translation of the Pentateuch, produced in late antiquity and printed beside the Hebrew in most rabbinic Bibles. It renders closely and reserves its few expansions for anthropomorphism and for a handful of theologically sensitive verses. Its closeness makes its silences evidential: where Onkelos inserts nothing, the Hebrew gave him nothing to insert. A locus is BookToken.chapter.verse."
