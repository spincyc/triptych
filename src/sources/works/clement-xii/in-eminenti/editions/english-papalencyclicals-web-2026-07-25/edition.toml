notes = "An unattributed English translation of the complete constitution on a private aggregation site; no translator, source edition, or Latin text is named on the page, and the page's own date line reads only 'in the year 1738 of Our Lord' without day or month. The page carries injected third-party advertising text ('Read more: slot gacor') unrelated to the document, a witness-quality defect recorded here because it shows the delivery is not editorially controlled. The Latin original in the Bullarium remains the authoritative text; it was not collated for this record."
