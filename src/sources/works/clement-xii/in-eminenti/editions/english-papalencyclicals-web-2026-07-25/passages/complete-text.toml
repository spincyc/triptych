context = "The complete translation was read: the description of societies 'called in the popular tongue Liberi Muratori or Francs Massons' joining 'men of any Religion or sect' under 'a strict and unbreakable bond' with 'an oath upon the Holy Bible' to 'an inviolable silence'; the grounds ('For if they were not doing evil they would not have so great a hatred of the light', the harm 'not only to the peace of the temporal state but also to the well-being of souls', and 'other just and reasonable motives known to Us'); the condemnation and prohibition clause; the comprehensive membership and assistance prohibition 'under pain of excommunication ... incurred by the very deed without any declaration being required', absolution reserved to the Roman Pontiff except at the hour of death; and the direction that ordinaries and inquisitors proceed against transgressors 'as being most suspect of heresy'. The translation contains no allegation of devil-worship or of a specific secret doctrine; that bounded observation about this delivery is recorded with its limits in the consuming publication's research records."
