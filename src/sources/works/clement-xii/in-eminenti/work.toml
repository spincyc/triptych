alternate_titles = ["In eminenti", "Constitution condemning the society of Liberi Muratori or Freemasons"]
languages = ["la"]
locus_pattern = 'complete-text'
description = "Clement XII's constitution of 28 April 1738, the first papal condemnation of the Masonic lodges: it condemns and prohibits the societies of Liberi Muratori or Francs Massons, forbids the faithful every form of membership or assistance under pain of an ipso facto excommunication whose absolution (outside danger of death) is reserved to the Roman Pontiff, and directs ordinaries and inquisitors to proceed against transgressors as suspect of heresy. Gasparri's fontes to canon 2335 of the 1917 Code cite it as litt. ap. In eminenti, 28 apr. 1738."
relations = ["work.benedict-xiv.providas-romanorum", "work.catholic-church.codex-iuris-canonici-1917"]
