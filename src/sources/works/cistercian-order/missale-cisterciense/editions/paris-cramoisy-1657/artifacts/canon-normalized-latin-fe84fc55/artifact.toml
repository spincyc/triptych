provenance = "Direct page-image transcription and independent source collation of the exact bounded Canon and prefatory proper forms. No OCR, Roman text from memory or later missal supplied wording. Separate source-block and collation audits identify every physical locus and correction."
transformation = "NFC UTF-8; long s becomes s; unambiguous printed abbreviation signs expand as listed in the source-block audit; physical wraps and line-end division hyphens disappear. Source u/v, i/j, æ/œ, accents, case including display initials, punctuation, &c., alternatives, every included rubric and spoken cue remain. Pattée crosses are represented by ✠ and the response cue by ℟.; word-separating spaces are regularized. Each stored line is one consecutive source block or paragraph, with source page/column/baseline and ink classes retained separately. No heading, quotation wrapper, modern translation, or explanatory material is inserted into literal text. Proper forms retain their discontiguous prefatory locations and are not relocated into the main Canon."
notes = "Preserves printed Nativity móriam and Ascension vnítam, the unexpanded &c. referrals, source rubric order and other edition-specific spellings. A printed referral remains a referral; no omitted continuation is supplied from the familiar Canon."
