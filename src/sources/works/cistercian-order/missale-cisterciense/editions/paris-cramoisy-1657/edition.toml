notes = "Exact title page and selected introductory and prayer pages were visually inspected. Only selected complete page files are retained, not a full-book payload or complete collation. The three paired text selections are Confiteor, Suscipe Trinitas and the Orate invitation/response. FIDES edition 3755, publication 3978; Krzeszów Benedictine abbey copy. Title file 0005; mandate files 0007–0008, signed Claude Vaussin at Paris on 3 July 1655; Monitum file 0009. The mandate date differs from the 1657 imprint. The Monitum describes further conformity to the Roman missal while retaining differences in graduals. Printed pp. 169, 172–174 are files 0231, 0234–0236. The provider’s 813-byte indirect DjVu directory references 740 separately delivered page files. A recovered acquisition receipt dated 17 October 2026 identifies those offered native pages as locally acquired; the present canonical library retains selected pages and does not claim a complete physical volume. A later bounded Canon registration retains all forty native pages used for its full preface-form census, main Canon and Pater cutoff context, while its viewing facsimile contains eighteen selected complete page images. Its complete declared constituent includes the five Communicantes and two Hanc igitur proper forms on pp. 176, 177, 181, 183 and 184 with governing rubrics, then the Canon title/Crucifixion and all main Canon text on pp. 203–213 through final Amen and adjacent Iungit manus, before Orémus. All other preface text and the subsequent Pater are excluded. Its fifty-two source-order units preserve source accents, rubric positions, apparent printing errors and unexpanded referrals. The earlier twenty-five-unit offertory binding and all earlier selections remain unchanged. Whole-book and complete-Ordinary text coverage remain partial."
