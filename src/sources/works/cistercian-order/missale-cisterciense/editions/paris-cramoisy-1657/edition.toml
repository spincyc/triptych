notes = "Exact title page and selected introductory and prayer pages were visually inspected. Only selected complete page files are retained, not a full-book payload or complete collation. The three paired text selections are Confiteor, Suscipe Trinitas and the Orate invitation/response. FIDES edition 3755, publication 3978; Krzeszów Benedictine abbey copy. Title file 0005; mandate files 0007–0008, signed Claude Vaussin at Paris on 3 July 1655; Monitum file 0009. The mandate date differs from the 1657 imprint. The Monitum describes further conformity to the Roman missal while retaining differences in graduals. Printed pp. 169, 172–174 are files 0231, 0234–0236. The provider’s 740-page indirect DjVu object has not been acquired in full."
