notes = "Separate source-library record for the observed Google/Lyon setting, volume a8329mzqJMUC. The full original title/imprint page PP7 directly confirms Paris, Sebastien and Gabriel Cramoisy, M. DC. LVII, and Primo Editum. The inspected prayer page at Google locator PA215 bears printed folio 293 and differs in pagination and typesetting from the FIDES 3755 setting at printed 215. The bibliographic relationship between those bodies remains unresolved; this record does not identify an exact FIDES setting or establish a new historical recension. Only two complete original page renditions are retained; no whole-book, physical-completeness, descent, normative-use or textual-transfer claim follows."
