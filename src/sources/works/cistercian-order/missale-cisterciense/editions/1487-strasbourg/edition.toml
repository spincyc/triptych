notes = "BSB München, 2 Inc.c.a. 1921, bsb00044164; USUARIUM 423. The colophon states 1487, pridie nonas Septembris, read as 4 September. The opening mandate of Johannes abbot of Cîteaux is dated 3 October 1486 and orders corrected liturgical books under general-chapter authority. The mandate date and publication date are distinct; no universal effective date or local reception is inferred. Printer and place follow the BSB catalogue. Complete 428-page provider PDF acquired and hashed; its 1,233,256,651-byte size warrants remote storage, with critical page images retained. PDF page 1 is a provider cover; PDF page N+1 corresponds to BSB canvas N. The PDF has no usable historical-book text layer."
