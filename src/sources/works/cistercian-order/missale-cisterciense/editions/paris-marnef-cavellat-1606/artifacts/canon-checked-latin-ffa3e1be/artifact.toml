transformation = "Direct source reading of original BSB 1606 scans: long s becomes s; split display initials merge in sentence case; source line wraps and line-end word divisions join inside semantic blocks. Printed nasal suspension bars, the standard -us brevigraph, -q;/-que suspension and Dñi contraction are expanded without adding absent accents. The marked vir- contraction in the Nativity insertion is expanded as unaccented virginis; no acute is inferred from the separately printed main Communicantes form. Printed u/v, j, æ/œ, actual accents, case within sentences, punctuation, parentheses, ampersands, N. placeholders and abbreviated rubric/variant endings remain. Red crosses are serialized as ✠, including crosses inside words; printed asterisks remain *. Rubrics are separate units. Communicantes opening and continuation remain separate around the five proper insertions, preserving column/source order. The source’s duplicated & & in Supplices and Easter diem sacratíssimam are retained. No familiar Roman wording or missing ending is supplied. The 35 UTF-8 NFC semantic units retain source order. The main Communicantes continuation preserves three source paragraphs, separated by a blank LF line; its selected physical-line range includes those two blank lines. Other units occupy one physical line. The complete artifact ends with LF; each unit selection hash excludes its terminating LF. Running heads after the opening title, page numbers, catchwords, ornament, type colour, line/column geometry and chant notes are recorded as facsimile/paratext rather than text; all sung words within the Canon, including its final Amen, remain. This is a normalized reading transcription, not a glyph-diplomatic or musical edition."
notes = "Complete strict Canon constituent only, including all six seasonal insertion blocks with their rubrics and the final sung words. Existing accepted offertory and all prior checked passages remain unchanged. No complete Ordinary, whole missal, text parentage or historical introduction-date claim."
