notes = "Complete invitation and printed response dialogue; the 1657 final priestly Amen remains a separate recoverable block. Standalone red instructions and the 1606 response cue are recorded as context. The retained 1657 parenthetical (vel meis), with vel printed red, is an alternative in the printed response, not an instruction to utter both alternatives together. This is the identified printing’s original Latin; no later Roman book supplies missing words or resolves a variant. No introduction date, direct copying act or complete historical parent relationship is inferred."
