transformation = "Direct reading normalization of retained BSB canvas 235, printed p.181 right column: long s becomes s; display initials merge in sentence case; line-end word divisions and printed line wraps are joined within each semantic block; printed nasal suspension bars are expanded (including chorum, dicens, meum and sacrifícium); printed u/v, æ/œ, accents, abbreviations, punctuation and ampersands are retained. The stylized red crossed-R response cue followed by m. is represented as ℟m., without expanding the abbreviation. No absent Amen, prayer ending or familiar Roman wording is supplied. Six NFC UTF-8 physical lines, each a complete semantic block, end in LF. The Orate invitation and Dominus response retain their distinct source paragraph boundary. The spoken wording of those two blocks is byte-identical to the corresponding spans of existing checked orate-response-checked-latin-2bab0892; this broader source-derived selection restores the printed response cue omitted by that narrower spoken-only comparison. The separately bound Suscipe Trinitas reuses its existing checked passage unchanged. Rubrics are separate lines/units; their red ink, and red initials in the prayers, are recorded in the extent census rather than encoded as colour. This is a normalized reading transcription, not a glyph-diplomatic facsimile."
notes = "Complete additional source blocks for the bounded offertory constituent within Præparationes ante Missam. Suscipe Trinitas is not duplicated. The new invitation/response selection differs in scope from the unchanged narrower checked comparison by preserving its red response cue and two source paragraph blocks. No complete Ordinary or whole-book collation is asserted."
