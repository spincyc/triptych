transformation = "Direct original-image normalized reading transcription, not a glyph-diplomatic or musical edition. Long s becomes s; detached display initials join the word in sentence case; source wraps and line-end word divisions join within semantic blocks. Clear nasal suspensions, standard -us and -que brevigraphs expand without adding unprinted accents. Printed u/v, j, æ/œ, e-cauda ę, actual accents (including glóriósa, pręséntibus, déxterę and eleíson), punctuation, ampersands and abbreviated prayer endings remain. Distinct source prayer, rubric, response, incipit and paragraph blocks are separate source-order units; inline source boundaries are mapped in the census. The printed red crosses serialize as ✠ and the actual crossed-R cues as ℟. with their source period; no response cue is added where none is printed. Eight repeated raised hook/zigzag-over-dot signs in the p.200 appendix serialize as U+2E4E ⹎ (PUNCTUS ELEVATUS MARK), a disclosed normalized codepoint mapping from the observed source form, without claiming exact typeface identity, prosody or historical function. Repeated Agnus forms and short Psalmus/Lætatus sum/Gloria/Kyrie/Pater incipits remain as actually printed, without supplied continuations. All selected sung words remain; musical notes/staves, repeated running heads, foliation, signatures, catchwords including INCIPIT, ornament, ink colour, imposed line/column geometry and detached ink specks are excluded. The appendix remains in physical printing order after the p.199 main Order closure, although its rubric directs recitation after Pater noster Canonis. Every unit occupies one UTF-8 NFC physical payload line, ending with LF in the artifact; each unit text hash excludes that LF. No OCR, other-edition wording, familiar Roman wording or unprinted ending is supplied."
notes = "Complete bounded printed post-Canon tail and appended Suffragium of the Paris 1606 Cistercian missal. It begins with Orémus/Præcéptis on printed p. 197 left, immediately after and excluding the accepted strict Canon’s final Per omnia/Amen. The main Ordinary tail closes on printed p. 199 right with the departure rubric Sicque signans se, & inclinans recedat. The appended Suffragium pro pace Ecclesiastica & temporali on printed p. 200 is included through its final Amen before INCIPIT SANCTORALE on p. 201. The appendix is printed after the main closure but its own rubric assigns recitation after the Canon’s Pater noster; units retain physical source order rather than silently relocating it. This is a bounded composite functional selection, not an assertion of an uninterrupted printed chapter or complete Ordinary. All in-scope prayers, abbreviated incipits, rubrics, response cues, crosses and sung words are included under the disclosed normalization. The prior 7-unit offertory and 35-unit Canon remain unchanged. Whole-Missal and complete-Ordinary text coverage remain partial; no wording or ancestry is inherited."
