context = "Complete bounded printed post-Canon tail and appended Suffragium of the Paris 1606 Cistercian missal. It begins with Orémus/Præcéptis on printed p. 197 left, immediately after and excluding the accepted strict Canon’s final Per omnia/Amen. The main Ordinary tail closes on printed p. 199 right with the departure rubric Sicque signans se, & inclinans recedat. The appended Suffragium pro pace Ecclesiastica & temporali on printed p. 200 is included through its final Amen before INCIPIT SANCTORALE on p. 201. The appendix is printed after the main closure but its own rubric assigns recitation after the Canon’s Pater noster; units retain physical source order rather than silently relocating it. This is a bounded composite functional selection, not an assertion of an uninterrupted printed chapter or complete Ordinary. All in-scope prayers, abbreviated incipits, rubrics, response cues, crosses and sung words are included under the disclosed normalization. The prior 7-unit offertory and 35-unit Canon remain unchanged. Whole-Missal and complete-Ordinary text coverage remain partial; no wording or ancestry is inherited."
notes = "Complete selected scope, not all matter under the continuing Canon Missæ running head. Independent complete literal/extent review is pinned in the native binding’s separate receipt."
