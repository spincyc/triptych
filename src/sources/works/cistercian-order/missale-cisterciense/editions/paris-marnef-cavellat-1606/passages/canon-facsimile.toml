context = "Complete strict Eucharistic Canon constituent of the Paris 1606 Cistercian missal: from the printed CANON MISSÆ. heading and Te igitur on printed p. 190, BSB canvas 244/full-provider-PDF 245, through Per ómnia sǽcula sæculórum. Amen. on printed p. 197 left, canvas 251/PDF 252, immediately before Orémus/Præcéptis/Pater noster. All five printed seasonal Communicantes insertions and the Pascha/Pentecost Hanc igitur insertion, their rubrics, continuation signs, name cues and 26 crosses are included in source order. The fourth page in this sequence is BSB-labelled 193 but actually misprinted 192. The later Ordinary under the same Canon Missæ running head is explicitly outside this strict Canon. Whole-book and complete-Ordinary coverage remain partial; this constituent is independent of the unchanged accepted offertory and inherits no wording from another edition."
