notes = "Exact title page and selected introductory and prayer pages were visually inspected. Selected complete page files and a bounded lossless facsimile are retained; the full-book payload is not committed and complete-book collation is not claimed. The three paired text selections are Confiteor, Suscipe Trinitas and the Orate invitation/response. BSB Munich copy 2 Liturg. 205 a, bsb10496382. Title canvas 1; Annotanda canvases 27–28; printed pp. 180–181 at canvases 234–235. The title credits an unnamed monk of the order, doctor of theology. The Annotanda describes Roman conformity following the general chapters of 1601 and 1605; it does not independently date every selected wording change. The complete 415-page provider PDF has now been acquired and hashed; it is remote-only in the canonical library because 672254859 bytes exceeds 100 MiB. Eight exact scan pages, printed sequence 190–197 (source sequence 193 is actually misprinted 192), are retained losslessly for the independently collated strict Canon constituent from CANON MISSÆ/Te igitur through the concluding Per omnia/Amen before Orémus/Præcéptis. All printed seasonal insertions and rubrics are included. Complete Ordinary and whole-book collation remain partial; previous checked selections and the accepted offertory remain unchanged."
