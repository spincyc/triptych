notes = "Exact title page and selected introductory and prayer pages were visually inspected. Only selected complete page files are retained, not a full-book payload or complete collation. The three paired text selections are Confiteor, Suscipe Trinitas and the Orate invitation/response. BSB Munich copy 2 Liturg. 205 a, bsb10496382. Title canvas 1; Annotanda canvases 27–28; printed pp. 180–181 at canvases 234–235. The title credits an unnamed monk of the order, doctor of theology. The Annotanda describes Roman conformity following the general chapters of 1601 and 1605; it does not independently date every selected wording change."
