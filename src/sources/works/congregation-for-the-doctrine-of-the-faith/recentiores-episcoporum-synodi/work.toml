description = "The letter addressed by the Congregation for the Doctrine of the Faith to the bishops of the world on 17 May 1979, recalling what the Church holds about what happens between the death of a Christian and the general resurrection. Its seven numbered points affirm the resurrection of the whole person, the survival and subsistence after death of a spiritual element endowed with consciousness and will for which the Church uses the word 'soul', the standing of the Church's funeral rites and suffrages as loci theologici, and the distinct and deferred character of the Lord's glorious manifestation relative to the situation of people immediately after death. It was approved by John Paul II, who ordered its publication; its register is that of recalling received teaching rather than of defining, and it names no author and censures no proposition. A locus is one of the seven numbered points."
