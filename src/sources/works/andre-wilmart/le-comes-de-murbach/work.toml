description = "Wilmart's edition of the Comes of Murbach. Item CXXVIII is 'Ebd. xv post pentecost.' with Galatians 5:16 and Luke 17:11, so the Murbach list pairs the Galatians pericope of the Roman Fourteenth Sunday with the ten lepers and numbers the Mass a Fifteenth. Wilmart's note 2 at printed page 61 keys Alcuin's five post-Laurentii sections to Wuerzburg item numbers rather than to headings read in the manuscript, which is a reconstruction and is recorded as one."
