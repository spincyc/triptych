notes = "Registered on the pattern this library uses for a constituent of a larger volume: the edition is the article as the Revue Benedictine prints it, and the artifacts are the Internet Archive's derivatives of the whole journal volume, which is the narrowest exact witness that was retrieved. The edition stands at printed pages 25-69 of the volume; items CXXVIII and CXXVIIII read for this run are at printed page 49, and Wilmart's note 2 on Alcuin's distribution at page 61. The article is in French and the texts it edits are in Latin; the edition language records the article's own language."
