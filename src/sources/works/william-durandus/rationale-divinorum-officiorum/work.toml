description = "Durandus of Mende's encyclopaedic commentary on the liturgy, in eight books. Book VI runs through the temporal year: chapter 128 is the Fourteenth Sunday after Pentecost and chapter 129 the Fifteenth. Durandus gives the Fourteenth the ten lepers and puts Matthew 6 and 'Primum quaerite' on the Fifteenth, with 'in quibusdam ecclesiis' attached to the Epistle, Gospel, Alleluia and Communion of the Fourteenth but not to its Introit or Offertory. John Beleth's Summa is printed under the same title Rationale divinorum officiorum and is a different work with its own record here; the alias is resolved so that a later search on the shared title does not merge them. The composition date is not established in this registration and is therefore not recorded."
