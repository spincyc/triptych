context = "Rationale VI.2, the article before marginal numeral 12: the preparation for Advent begins in the fifth week before Christmas in some respects, so that old graduals and lectionaries carry the title 'Quinta dominica ante natiuitatem Domini' with five Sunday offices, epistles and gospels; in the fourth week it begins for the morning office and the variety of offices, so the new antiphoners are titled 'fourth Sunday'. Folio 258 recto (leaf n20). The next article gives a fourfold reason for this twofold titling."
physical_line_ranges = [[1, 4]]
text = "In quinta igitur hebdomada ante natiuitatem Dñi inchoatur præparatio aduentus, quoad quædã. Vnde & in antiquis gradualibus & lectionariis titulus est talis. Quinta dominica ante natiuitatem Dñi: nam ab illa dominica vsque ad natiuitatem Dñi sunt quinque officia dominicalia, & quinque epistolę, & quinque euangelia. In quarta verò dominica ante natiuitatem Domini inchoatur præparatio aduentus, quoad officiũ matutinale, & quoad multiplicem officiorũ varietatẽ & innouationem: quia ergo quatuor sunt officia dominicalia, ab illa dñica vsque ad natiuitatem: & ideò in antiphonarijs nouis intitulatur quarta dominica."
