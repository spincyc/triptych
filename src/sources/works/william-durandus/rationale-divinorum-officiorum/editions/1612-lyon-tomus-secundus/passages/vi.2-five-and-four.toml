notes = "Read on the page image of leaf n20. Abbreviations kept: 'Dñi', 'dñica', 'quædã', 'officiũ', 'officiorũ'. The mark over the final e of 'varietatẽ' is small and reads on the image as either a tilde or an acute; it is given as the suspension tilde. The printing has 'antiphonarijs' (OCR 'anciphonariis'). The article number is not asserted: the OCR places numeral 10 on fol. 257v, and numeral 12 follows on this page. CORRECTION TO R1's DOSSIER: the 'ordinatione Gregorij' it cites from this chapter (OCR line 753, fol. 257v) concerns Gregory's placing of the last Advent antiphons from the Gospel ('Completi sunt dies'), not the four-week arrangement; it was not registered."
