context = "Rationale VI.2: the question why the Alleluia is not silent in Advent, a season of fasting in which weddings are not celebrated, and its solution: this fast is partly of exultation and partly of mourning. Folio 256 verso (leaf n17). The text goes on to explain the exultation by the first coming and the mourning by the second."
physical_line_ranges = [[1, 5]]
text = "Sed quare Allelu-ja, non tacetur hoc tempore, cùm sit canticum lætitiæ, nam in aduentu est ieiunium, nec tunc nuptiæ celebrãtur? Prætereà, aut est ieiuniũ mœroris, aut exultationis. Si mœroris, omnia cãtica exultationis debent taceri. Si exultationis, omnia debent dici: ergo & Gloria in excelsis Deo. Solutio. hoc ieiuniũ est partim exultationis, & partim mœroris."
