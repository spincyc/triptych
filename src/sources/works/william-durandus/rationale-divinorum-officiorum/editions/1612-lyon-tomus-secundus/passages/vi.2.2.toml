context = "Rationale VI.2 'De Tempore Aduentus', article 2 (marginal numeral 2): Durandus reports that blessed Peter first instituted three full weeks before Christmas and a fourth never completed, and explains the four weeks by the fourfold coming of the Son of God. The Peter attribution is Durandus's report of a legend and is to be presented as such. Folio 255 verso (leaf n15)."
physical_line_ranges = [[1, 2]]
text = "Prænotandũ igitur est quòd B.Petrus primò instituit tres septimanas integras ante natale venerari, in cõmemorationẽ aduẽtus Christi: & quartã, quæ tñ nũquã perficitur, ꝗa vigilia natalis non est de aduẽtu: vt infra dicetur. Agitur ergo aduentus Dñi per quatuor septimanas ad magnificãdũ, ꝙ est quadruplex aduẽtus filij Dei: sed vltima nunquã finitur, ꝗa sanctorũ gloria, quæ dabitur in vltimo aduentu, s. ad iudiciũ, nunquã terminabitur."
