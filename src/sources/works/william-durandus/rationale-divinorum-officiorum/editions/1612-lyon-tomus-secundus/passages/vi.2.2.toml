notes = "Read on the page image of leaf n15, enlarged. Long s given as s; abbreviations kept, not expanded (see transformation): 'tñ' tamen, 'ꝗa' quia, 'ꝙ' quod, 'Dñi' Domini, 's.' scilicet. 'ante na-|tale' is divided at the line end without a printed hyphen and is joined. The article continues 'Primus aduẽtus est in carnem'. LOCATOR CORRECTION: R1's dossier gives this chapter as 'pp. 155-158'; the volume is numbered by folio and the OCR misreads the folio numeral 2 as 1 ('158' for 258): the chapter runs from fol. 255v to at least fol. 258r."
