transformation = "Read the named folio page on the parent page image (local crops of the unmodified fetched bytes, enlarged) and transcribe the quoted extent with one sense unit per LF-terminated UTF-8 line, each prefixed by a braced locator naming the folio page. Long s is transcribed as s; every other letterform is kept as printed: u/v and i/j as printed, ae/oe ligatures and e-caudata (ę), grave accents, the ampersand. Abbreviations are NOT expanded: a suspension stroke over a letter is given by the corresponding Unicode tilde letter (ã ẽ õ ũ ñ), q with a stroke through the descender (quia) by U+A757 ꝗ, the quod sign by U+A759 ꝙ, and the scilicet sign (long s with period) by 's.'. Line-end division is joined, and inter-word spacing after punctuation is normalized to one space where the compressed setting omits it."
