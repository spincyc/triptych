title = "Rationale divinorum officiorum, with John Beleth's Rationale appended (1568)"
language = "la"
publication = "An early printed composite volume: Durandus's Rationale divinorum officiorum with, as its own title page says, 'aliud Divinorum officiorum Rationale ab Ioanne Beletho Theologo Parisiensi' appended, each with its own index. Internet Archive item gri_33125009312923, from the Getty Research Institute."
date = "1568"
notes = "Retrieved and read for one purpose only: to collate Durandus VI.128 against a second early printed edition. That collation is optical text against optical text, not against a page image, and no leaf of this volume was fetched. The composite character is read off the registered bytes, whose title page names Durandus of Mende and then the appended Beleth. The year 1568 is as the retrieving research lane of run efff3a6f73c1f451 recorded it; this registration did not read a printed year off these bytes. The one imprint fragment legible in the text layer is 'Lugduni, e Typographia', which places the printing at Lyon. Beware the scan's front matter: it carries a pasted bookseller's clipping describing Leiden editions of 1572 and 1574, which belongs to a previous owner and not to this book. Because the same bytes also print Beleth's Summa, a later run that needs Beleth from this volume takes a cross-work segment over this artifact rather than registering a duplicate copy of it."
