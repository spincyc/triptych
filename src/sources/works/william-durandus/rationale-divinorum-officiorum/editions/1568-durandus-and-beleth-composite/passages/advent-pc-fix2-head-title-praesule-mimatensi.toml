context = "The head-title reads, in capitals: RATIONALE, SEU ENCHIRIDION DIVINORUM OFFICIORUM, GULIELMO DURANDO, PRAESULE MIMATENSI, AUTHORE (printed with V for U), that is, by William Durandus, bishop (praesul) of Mende (Mimatensis, the Latin adjective of Mende). Read on crops of the page image. The page gives no date for the author; for the thirteenth century see the Gueranger passage advent-pc-fix2-history-durandus-thirteenth-century."
notes = "advent-pc-fix2. The interpretation of Mimatensis as of Mende is a gloss, not printed here."
