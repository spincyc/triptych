description = "Westcott's commentary on the Fourth Gospel, printing the Greek text with a facing English column and notes. Published posthumously in two volumes in 1908 by his son Arthur Westcott, who added editorial footnotes recording his father's later marginal notes and a private letter. The notes on John 20:5-10 stand at volume 2, pages 339 to 341. A locus is the Gospel chapter."
