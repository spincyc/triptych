notes = "The posthumous two-volume Greek-text commentary, distinct from Westcott's earlier Speaker's Commentary treatment of the same Gospel. Arthur Westcott's editorial footnotes, signed A. W., record his father's later marginal notes and a private letter to H. O. Barratt about Henry Latham's interpretation; those footnotes are the son's editorial matter and must not be attributed to Bishop Westcott's own printed notes."
