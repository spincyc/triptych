notes = "The lemma of the first note is the Greek phrase for apart wrapped up into one place, followed by the Vulgate's separatim involutum in unum locum; the Greek lemma is omitted from this transcription because the record carries no Greek type. The square brackets in the first transcribed line are Westcott's own. The second and third lines belong to the note on believed, whose opening clause The exact interpretation of the word believed is difficult stands earlier on the same page and is not transcribed."
