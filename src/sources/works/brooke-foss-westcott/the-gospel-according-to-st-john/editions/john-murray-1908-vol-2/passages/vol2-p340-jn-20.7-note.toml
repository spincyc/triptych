context = "Westcott's notes on the phrase apart wrapped up into one place and on he saw and believed, read on printed page 340 rendered from the hashed facsimile, with the Greek text of John 20:6-10 printed above the notes on the same page."
physical_line_ranges = [[1, 3]]
text = "There were no traces of haste. The deserted tomb bore the marks of perfect calm. [The grave-cloths lay as the body had withdrawn from them.] It was clear, therefore, that the body had not been stolen by enemies; it was scarcely less clear that it had not been taken away by friends. It is not likely that it means simply believed that the body had been removed as Mary Magdalene reported. Such a conclusion was rather a matter of natural and immediate inference from what he saw. The use of the word absolutely rather points to the calm patient acceptance of a mystery as yet in part inexplicable with full confidence in the divine love. The threefold sign of the stone removed, the empty sepulchre, the grave-cloths undisturbed, indicated something still to be more fully shown, and the apostle waited in trustful expectation for the interpretation."
