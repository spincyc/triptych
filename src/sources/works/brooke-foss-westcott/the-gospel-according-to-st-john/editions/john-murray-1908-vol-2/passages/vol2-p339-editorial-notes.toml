physical_line_ranges = [[1, 4]]
text = "The simple sight here is distinguished from the intent regard of St. Peter when he entered the sepulchre; and in this connexion it is significant that St. John does not see the napkin, the small cloth, lying apart. The abrupt change of tense marks a break in the progress of the thought. The entrance is courageously made: then follows the experience. The word expresses the earnest intent gaze of the apostle as his eye passes from point to point. Bishop Westcott in a marginal note invites attention to Mr. Latham's interpretation of this passage (see Mr. Latham's The Risen Master). In a private letter to the Rev. H. O. Barratt, who had consulted him on this interpretation, he writes, The explanation which you give of John xx. 8 (passed through the heavy wrappings as He later passed through doors) is, I think, substantially correct. ... I did not agree with his (sc. Mr. Latham's) interpretation of the participle ... Perhaps the separate treatment of the face cloth suggests the action of the living Lord. In a further marginal note Bishop Westcott says: The undisturbed grave-cloths show that the Lord had risen through and out of them. The face cloth carefully rolled up, the action of the living Lord."
