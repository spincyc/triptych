description = "Oration 29 of Gregory of Nazianzus, the third of Gregory's theological orations, on the Son. Sections 19-20 set the Son's lowly human acts against His divine ones (in the 1894 English, He was wrapped in swaddling clothes—but He took off the swathing bands of the grave by His rising again). A locus is the section."
