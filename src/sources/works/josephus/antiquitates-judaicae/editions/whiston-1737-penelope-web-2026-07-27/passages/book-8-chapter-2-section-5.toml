context = "Whiston VIII.2.5 presents Josephus's claim that God gave Solomon skill against demons and Josephus's first-person report of seeing Eleazar perform before Vespasian and a military audience. The described means include a ring and root at the nostrils, mention of Solomon and recitation of attributed incantations, and a command that the departing demon overturn a water-filled cup or basin. The passage supports Josephus's literary testimony and framing, not the mechanism, Solomonic authorship, or continuity into Christian ritual."
