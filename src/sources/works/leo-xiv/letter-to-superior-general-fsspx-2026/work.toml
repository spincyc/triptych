description = "Leo XIV's letter of 29 June 2026 to Father Davide Pagliarani, published in the Holy See Press Office bulletin of 30 June 2026 on the eve of the episcopal consecrations at Econe. The pope acknowledges the devotion to liturgical life, priestly formation, apostolic zeal and desire for fidelity to Tradition found in communities linked to the Fraternity, asks the addressee to turn back, warns that the schismatic act would deprive the faithful of the licit and in some cases valid reception of the sacraments, states that the Church remains open to dialogue, and asks him by the authority received from Christ to desist. The French text is the original."
