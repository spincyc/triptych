text = "METHOD FOR MAKING THE GENERAL EXAMEN It contains in it five Points. First Point. The first Point is to give thanks to God our Lord for the benefits received. Second Point. The second, to ask grace to know our sins and cast them out. Third Point. The third, to ask account of our soul from the hour that we rose up to the present Examen, hour by hour, or period by period: and first as to thoughts, and then as to words, and then as to acts, in the same order as was mentioned in the Particular Examen. Fourth Point. The fourth, to ask pardon of God our Lord for the faults. Fifth Point. The fifth, to purpose amendment with His grace. Our Father."
