transformation = "Hand transcription made from the page images, rendered locally with pdftoppm from the Internet Archive PDF named in the provenance; the parent OCR was used only to locate the pages and was diffed word by word against this file afterwards, every difference being resolved on the image. No source text passed through a language model. Typographic quotation marks are rendered as straight ASCII quotes; thin spaces before ? ! ; : are removed; line-end hyphenation is joined (a compound printed with a hyphen keeps it); footnote reference numerals are omitted; italics are not marked; small capitals are rendered in mixed case, with full capitals kept where printed larger. One sense unit per line, each prefixed by a bracketed locator that is a finding label, not printed text. Selected lines only: the Method for Making the General Examen, printed pp. 30-31, complete. The parent's lines 1911-1950 carry this text with the OCR noise 'in r it' and a stray 'I', and with a Google digitisation label between the pages; neither is printed text."
