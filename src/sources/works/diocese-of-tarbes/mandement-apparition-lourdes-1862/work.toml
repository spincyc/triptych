alternate_titles = ["Mandement of 18 January 1862 on the Lourdes apparition"]
languages = ["fr"]
description = "The mandement of the Bishop of Tarbes, dated 18 January 1862, feast of the Chair of Saint Peter at Rome, closing the diocesan inquiry opened by the commission ordinance of 28 July 1858: it judges that the Immaculate Mary, Mother of God, really appeared to Bernadette Soubirous on 11 February 1858 and following days, eighteen times, in the Grotto of Massabielle; declares the faithful justified in believing the apparition certain; submits the judgment to the Roman Pontiff; authorizes the diocesan cult of Notre-Dame de la Grotte de Lourdes with devotional publications reserved to written episcopal approval; and announces the intention to build a sanctuary. The competent positive diocesan judgment on the Lourdes apparitions, retained in its historical formula under the 2024 DDF norms. Loci are free-form descriptions of the act's parts (preamble, discussion, considerations, arts. 1-4, date and signature)."
