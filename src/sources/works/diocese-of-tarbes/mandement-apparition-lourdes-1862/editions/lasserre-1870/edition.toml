notes = "Nearly contemporary printed reproduction of the diocesan act inside an apologetic narrative volume. The 1862 diocesan imprint and the Tarbes archive original were not consulted by the consuming publication; this reproduction, collated against page images of the 1870 imprint and against the Sanctuary of Lourdes' own French and English transcriptions of article 1 (readings agree), is the accessible witness of record. The underlying 1862 act is public domain."
