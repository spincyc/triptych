context = "The dated entry for dimanche 22 novembre 2026 names the XXVIᵉ et Dernier Dimanche après la Pentecôte (5ᵉ de nov.), Temps per annum, IIᵉ classe, green vestments, marks Gloria, Credo and the Oratio pro Papa as said, gives the Preface of the Holy Trinity, and lists no memorial. Its Mass line reads: Messe propre (Dicit Dominus) du dernier Dimanche après la Pentecôte: Gloria. Or. pro Papa. Credo. Préf. de la T. Sᵗᵉ Trinité. At Matins it gives lessons I and II of the fifth Sunday of November and the homily of the last Sunday after Pentecost."
notes = "Inspected as a dated institutional witness of usage under the 1962 books, not as a controlling Missal and not as the Ordo of any named territory. The numbering of the Sunday as the fifth of November belongs to the Office's reckoning of the Scripture lessons; the Oratio pro Papa is an institute observance the books do not appoint on this date. No page quotation is retained."
