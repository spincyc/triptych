context = "The dated entry for dimanche 1 novembre 2026 names the Fête de tous les Saints, « Toussaint », Ire classe, Temps per annum, white vestments, marks Gloria and Credo as said and the Oratio pro Papa as not said, gives the Preface of the Holy Trinity, and a Lauds memorial of the Twenty-third Sunday after Pentecost. Its Mass line reads: proper Mass Gaudeamus, Gloria, memorial of the Twenty-third Sunday, Credo, Trinity Preface, and the last Gospel of the Twenty-third Sunday. Second Vespers are of the feast with the Sunday commemorated; Requiem Masses are forbidden."
notes = "Inspected as a dated institutional witness of usage under the 1962 books, not as a controlling Missal and not as the Ordo of any named territory. Its last-Gospel line differs from the plain text of RGMR 509 in the 1962 typical edition, which takes the beginning of St John in every Mass except on Palm Sunday without the blessing and procession of palms. No page quotation is retained."
