notes = "Dated response with the September 2026 section inspected, registered because the earlier state edition.icrsp-france.ordo.web-2026-09-17 carries a passage for 20 September only and its registered bytes are no longer served. The institution's own local additions are not silently generalized to the universal Roman calendar: the solemnity of St Thérèse of the Child Jesus and the Holy Face as secondary patroness of the Institute, and the Oratio pro Papa, belong to this institutional calendar."
