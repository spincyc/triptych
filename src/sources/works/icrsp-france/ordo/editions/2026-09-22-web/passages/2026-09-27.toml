context = "The dated entry for dimanche 27 septembre 2026 identifies the XVIII Sunday after Pentecost, styled 4e de septembre, second class, green, with Gloria, Credo, an Oratio pro Papa and the Trinity preface, and names the Mass by its Introit incipit, Da pacem."
notes = "Inspected as independent dated occurrence corroboration, not as a controlling 1962 missal and not as a source for any local calendar. No page quotation is retained. The entry's Oratio pro Papa and its solemnity of St Thérèse of the Child Jesus and the Holy Face, secondary patroness of the Institute, with commemoration and last Gospel of the Sunday, belong to this institutional calendar and are not generalized to the universal proper, which on a second-class Sunday admits no added oration."
