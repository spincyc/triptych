context = "The dated entry for dimanche 8 novembre 2026 names the XXIVᵉ Dimanche après la Pentecôte (3ᵉ de nov., 5ᵉ après l'Épiph.), Temps per annum, IIᵉ classe, green vestments, marks Gloria, Credo and the Oratio pro Papa as said, gives the Preface of the Holy Trinity, and lists no memorial. Its Mass line reads: Messe propre (Dicit Dominus): Gloria. Or. pro Papa. Credo. Préf. de la T. Sᵗᵉ Trinité. Its note reads that the second week of November is always omitted; at Matins it gives lessons I and II of the third Sunday of November and the homily of the Fifth Sunday after the Epiphany."
notes = "Inspected as a dated institutional witness of usage under the 1962 books, not as a controlling Missal and not as the Ordo of any named territory. The numbering of the Sunday as the third of November and the note on the omitted week belong to the Office's reckoning of the Scripture lessons; the Oratio pro Papa is an institute observance the books do not appoint on this date. No page quotation is retained."
