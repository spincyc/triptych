notes = "Dated response to the month view requested for 1 November 2026, registered for its entry for Sunday 8 November 2026, the resumed Fifth Sunday after the Epiphany kept as the Twenty-fourth Sunday after Pentecost. The institution's own additions, such as the Oratio pro Papa it marks, and its Office reckoning of the Sundays of November belong to this institutional calendar and are not generalized to the universal Roman calendar."
