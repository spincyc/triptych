notes = "Dated response to the view requested for 15 November 2026, registered for its entry for Sunday 15 November 2026, the resumed Sixth Sunday after the Epiphany kept as the Twenty-fifth Sunday after Pentecost. The institution's own additions, such as the Oratio pro Papa it marks, and its Office reckoning of the Sundays of November belong to this institutional calendar and are not generalized to the universal Roman calendar."
