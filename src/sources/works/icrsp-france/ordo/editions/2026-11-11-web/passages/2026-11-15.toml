context = "The dated entry for dimanche 15 novembre 2026 names the XXVᵉ Dimanche après la Pentecôte (4ᵉ de nov., 6ᵉ après l'Épiph.), Temps per annum, IIᵉ classe, green vestments, marks Gloria, Credo and the Oratio pro Papa as said, gives the Preface of the Holy Trinity, and lists no memorial. Its Mass line reads: Messe propre (Dicit Dominus): Gloria. Or. pro Papa. Credo. Préf. de la T. Sᵗᵉ Trinité. At Matins it gives lessons I and II of the fourth Sunday of November and the homily of the Sixth Sunday after the Epiphany. The entry for samedi 14 novembre gives First Vespers of the Twenty-fifth Sunday after Pentecost."
notes = "Inspected as a dated institutional witness of usage under the 1962 books, not as a controlling Missal and not as the Ordo of any named territory. The numbering of the Sunday as the fourth of November belongs to the Office's reckoning of the Scripture lessons; the Oratio pro Papa is an institute observance the books do not appoint on this date. No page quotation is retained."
