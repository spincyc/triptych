context = "The page for dimanche 1 novembre 2026, Fête de tous les Saints, « Toussaint », repeats the ordo's summary line: proper Mass Gaudeamus, Gloria, memorial of the Twenty-third Sunday after Pentecost, Credo, Preface of the Holy Trinity, last Gospel of the Twenty-third Sunday. The commemoration's orations are printed under the heading Mémoire de 23e Dim. après la Pentecôte. At the Preface the page prints the rubric In Galliis, in aliquibus diœcesibus : præfatio de Sanctis, with its French rendering (in France, in certain dioceses, the Preface of the Saints), above a Latin-French text of that Preface, which begins Qui glorificaris in concilio Sanctorum after the common opening."
notes = "Inspected as a dated institutional witness of usage, not as a controlling Missal. The Preface of the Saints is a French particular text named by the page for some dioceses; this record does not establish its approval, its territory or its use outside France. No page quotation beyond the rubric's incipit words is retained."
