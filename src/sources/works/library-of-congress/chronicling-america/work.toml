description = "The Library of Congress's digitised American newspaper collection and the search service over it, built with the National Endowment for the Humanities. Two kinds of object are registered from it here and they are not the same kind of evidence: the search service's own JSON responses, which are the Library's compiled result sets, and the uncorrected optical text of one page of one issue, which is a witness to what that page printed."
