notes = "The 1024 by 737 pixel photograph was visually inspected. It shows a fixed, high-backed episcopal seat elevated by three steps beneath a canopy, with attendant seats beside it. The witness strongly matches the Caeremoniale's broad throne morphology but does not make its particular marble, arms, heraldry, curtains, or attendant chairs universal."
