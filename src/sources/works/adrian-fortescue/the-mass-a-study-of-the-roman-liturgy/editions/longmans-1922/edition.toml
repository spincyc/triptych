notes = "The Longmans reprint digitised by Google and redistributed by the Internet Archive as item TheMassAStudyOf, whose bibliographic record gives the date as 1922. The first edition appeared in 1912; the reprint's pagination is the one used for every locus registered here and was checked directly against the scan. Fortescue died in 1923, so this printing carries no revision by a later hand. His own footnotes preserve the disagreements among Probst, Baumstark, Drews, Duchesne, Bona, Gihr, and others, and those disagreements are part of what this edition witnesses."
