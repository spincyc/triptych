context = "Printed p. 232 on the origin of the Kyrie: the middle of the fourth century as the date of its first certain appearance; Chrysostom quotes it; Etheria heard it at Jerusalem and translates it, 'et diacono dicente singulorum nomina semper pisinni plurimi stant respondentes semper: kyrie eleyson, quod dicimus nos: miserere Domine'; 'This is exactly the Antiochene litany with the answer to each clause. From Antioch the use of such litanies spread throughout the East. They and their answer: Kyrie eleison occur constantly in all Eastern liturgies, most often of all in the Antiochene-Byzantine family.' A footnote records that the Kyrie occurs twelve times in the liturgy of St James and three in St Mark, that its normal place is the answer to a litany, and that it is translated in every non-Greek rite except the Coptic."
