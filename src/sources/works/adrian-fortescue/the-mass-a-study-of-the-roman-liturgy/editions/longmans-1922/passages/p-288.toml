context = "Printed p. 288 on the introduction of the Creed into the Roman Mass: Berno of Reichenau reports what he saw in 1014, when Henry II noticed that no creed was sung at his coronation on 14 February 1014 and Benedict VIII eventually ordered it sung after the Gospel at Rome. Fortescue records that most authors accept the story and date the Creed at Rome from 1014, and names in the footnote those who do not (Probst, Mabillon, Thalhofer, Martene), together with the observation that the Creed's restriction to Sundays and feasts is 'still a sign that it is not an essential element'."
