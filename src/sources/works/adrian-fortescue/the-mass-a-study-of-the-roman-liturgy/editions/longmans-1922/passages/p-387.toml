context = "Printed p. 387 on the Agnus Dei: it 'was added to fill up the time of the fraction'; the Liber Pontificalis says Sergius I (687-701) ordered it sung by clergy and people at the breaking of the Lord's body; it was at first sung once, twice in the eleventh century, and John Beleth in the twelfth describes the present threefold form with Dona nobis pacem, while Innocent III notes churches, the Lateran among them, that kept miserere nobis three times."
verified_on = "2026-07-26"
notes = "Read visually in the page image. The Liber Pontificalis notice is quoted here at second hand from Duchesne's edition as Fortescue cites it; the Liber Pontificalis itself was not consulted for this publication."
