context = "Printed p. 305 on the offertory prayers: they are medieval, appear at Rome only in the fourteenth century, seem to fill the void left by the disappearance of the old offering by the faithful, and 'The Offertory prayers adopted by the revisors of 1570 are those in the XIVth Roman Ordo. All are taken or adapted from various, mostly non-Roman sources.' Suscipe sancte Pater 'occurs first (with slight variations) in the prayerbook of Charles the Bald (875-877)', and hanc immaculatam hostiam is called 'an anticipation of the consecration, a dramatic misplacement'. The mixed chalice is traced to Justin, Irenaeus and the epitaph of Abercius."
verified_on = "2026-07-26"
notes = "Read visually in the page image. The preceding page, printed p. 304, carries Micrologus's statement that the Roman order had no prayer between the offering and the Secret; that sentence was read in the optical text only and is not relied on here."
