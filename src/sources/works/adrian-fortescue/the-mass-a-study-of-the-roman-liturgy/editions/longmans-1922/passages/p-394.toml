context = "Printed p. 394 on the last Gospel: throughout the middle ages it belonged to the priest's thanksgiving and 'was in no wise an element of the Mass'; the Sarum Missal has it said on the way back to the sacristy; Burchard's ceremonial of 1502 allows it at the altar; and 'Pius V in his reformed missal (1570) for the first time admits it as part of the Mass'. Fortescue adds that it is not sung by the deacon, has no solemnities at High Mass, and is said by a bishop on his way from the altar."
verified_on = "2026-07-26"
notes = "Read visually in the page image. The preceding page, printed p. 393, carries the parallel remark that the Placeat, blessing and last gospel 'are all late'."
