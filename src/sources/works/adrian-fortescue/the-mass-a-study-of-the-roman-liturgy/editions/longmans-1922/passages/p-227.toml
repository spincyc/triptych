context = "Printed p. 227 on the prayers at the foot of the altar: 'That all this is rather preparation than part of the Mass itself is shown by its recital at the foot of the altar, before the celebrant goes up to it', followed by the medieval variants (Salisbury, Dominican, Carthusian, Carmelite, Lyons) and the Apologiae of the ninth and tenth centuries, which Fortescue calls 'certainly Gallican (Northern) in origin' on the following page. A footnote records that Aufer a nobis and Oramus te were said in the medieval rite of the papal chapel, where the words sancta sanctorum and quorum reliquiae hic sunt had a particular local aptness."
