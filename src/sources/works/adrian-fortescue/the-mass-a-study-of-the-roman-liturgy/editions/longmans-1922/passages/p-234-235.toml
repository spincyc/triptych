context = "Printed pp. 234-235 on the Roman Kyrie. Gregory the Great's letter to John of Syracuse is quoted: 'We neither say nor have said Kyrie eleison as it is said by the Greeks ... But in the daily Masses we leave out some things which are generally said; we only say Kyrie eleison and Christe eleison, that we should dwell rather longer on these words of prayer.' Fortescue notes that the letter mentions 'what is the unique speciality of the Roman rite, the formula: Christe eleison', that in all Eastern liturgies they say only Kyrie eleison, and that John the Deacon's ascription of the Kyrie's introduction to Gregory is contradicted by the Council of Vaison, which shows it older. Page 235 continues that at Antioch the Kyrie answers the five petitions of the deacon's Synapte and that in all Eastern liturgies it occurs in this way; that in the Gelasian Sacramentary's Ordination Mass the rubric is 'Et post modicum intervallum mox incipiant omnes Kyrie eleison cum litania'; that down to the ninth century there was at Rome, on days that had no Gloria, a litany at this place; and that 'on two days in the year, the eves of Easter and Whitsunday, our Mass still begins with a litany, in which the Kyrie fits naturally. The ordination Mass still has the litany, as in the Gelasian book.'"
verified_on = "2026-07-26"
notes = "Read visually in the page images. Artifact pages 254-255 carry printed pp. 234-235. Fortescue's reconstruction is an identified early twentieth-century scholarly account and is cited as such; the ascription to Gregory of the Kyrie's introduction is one he expressly rejects."
