notes = "The title page of the original Internet Archive scan ceremoniesofroma00fort, PDF page 3, prints MCMXVIII and Burns & Oates Ltd. The imprimatur is dated 6 September 1917; that date does not control this imprint. Wikimedia Commons calls its corresponding DjVu First Edition and records publication in 1918, while the Wikisource index labels it 1917. This exact edition follows the scanned title and is separate from the existing 1917 edition and its modern typeset artifact. Printed page 10 is PDF page 44 and contains prose vestment descriptions, not vestment line art."
