notes = "WorldCat OCLC 1086400098 identifies the London issue as the twelfth revised edition published by Burne, Oates Ltd. in 1962. Google Books volume bopPQ6BdqUwC identifies the Newman Press issue as edition 12, 1962, 423 pages, and exposes contents headings including Symbols used in the Plans and Choir and Sanctuary together with indexed terms for the altar, sacred vessels, linens, sanctuary furnishings, vestments, pontifical insignia, and service objects. This makes the edition an appropriate contemporary secondary lead for 1962 nomenclature, placement, ceremonial relationships, and materially different arrangements. It is not an official liturgical book, and no object definition or variant should be attributed to it until the relevant page has been inspected."
