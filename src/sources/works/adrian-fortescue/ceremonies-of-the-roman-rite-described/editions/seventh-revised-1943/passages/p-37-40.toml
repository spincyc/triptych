context = "The seventh edition identifies the sacristy vesting table, says the priest washes his hands at the place prepared for that purpose, and directs him to bow his head toward the cross or principal image before following the server into the church. It separately reports as practice in many churches that the server rings a bell at the sacristy door to warn the people that Mass is about to begin. This supports a local/usual departure signal, not a universal rubric, one bell mechanism, one placement, or one operator in every church."
verified_on = "2026-07-28"
notes = "Read visually in the exact acquired facsimile after OCR location. Printed p. 40 controls the cross-or-image and local-bell statements. The 1962 Missal separately controls its own rubrics."
