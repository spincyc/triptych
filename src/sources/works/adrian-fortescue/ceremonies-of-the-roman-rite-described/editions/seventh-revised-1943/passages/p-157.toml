context = "In the general rules for pontifical servers, Fortescue gives the plural vimpae for the scarves of the mitre-bearer and crozier-bearer. If those chaplains wear copes, the scarf is under the cope. They hold the mitre or crozier through the scarf. The crozier-bearer transfers the staff directly to and from the bishop; the mitre-bearer transfers the mitre through the assisting deacon. The page also records distinct carrying orientations for each insignium."
verified_on = "2026-07-28"
notes = "Read visually in the exact acquired facsimile after OCR location. This passage establishes that one textile type serves two distinct bearer roles and that the object should be taught both as a paired provision and in separate mitre- and crozier-bearing contexts. It does not establish exact textile dimensions or ornament."
