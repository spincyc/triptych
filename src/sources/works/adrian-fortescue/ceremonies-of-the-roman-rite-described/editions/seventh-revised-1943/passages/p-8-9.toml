context = "Fortescue places the credence and sedilia on the Epistle side in his teaching model. He describes the credence as the station for Mass vessels, books, and sometimes vestments when not in use; describes one three-place bench form for the celebrant and sacred ministers; and separately allows servers' seats on either side of the sanctuary or before the choir stalls. This controls recognition, liturgical relationship, and the distinction from server seating, not universal furniture construction, exact location, cloth drop, color, material, ornament, or architectural geometry."
verified_on = "2026-07-28"
notes = "Read visually in the exact acquired facsimile after OCR location. Printed p. 8 contains the credence and sedilia passage; printed p. 9 contains the separate server-seating passage. The seventh revised edition predates the 1962 Missal and is used as a checked ceremonial witness rather than as the governing typical edition."
