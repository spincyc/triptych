context = "Fortescue identifies the vimpa as the thin white silk scarf used by the two chaplains or servers who hold the mitre and crozier at pontifical functions. He compares it to a broad stole, says it is worn around the neck and tied in front, and says that the bearers hold the insignia through it. His footnote distinguishes the governing Ceremonial's express provision for the mitre-bearer's veil from the customary use of a similar veil by the crozier-bearer."
verified_on = "2026-07-28"
notes = "Read visually in the exact acquired facsimile after OCR location. This contemporary ceremonial witness controls the English headword, paired bearer relationship, broad morphology, and handling use, but not exact dimensions, ornament, fastening construction beyond being tied in front, or a claim that the crozier-bearer's vimpa is itself expressly prescribed by the Caeremoniale Episcoporum."
