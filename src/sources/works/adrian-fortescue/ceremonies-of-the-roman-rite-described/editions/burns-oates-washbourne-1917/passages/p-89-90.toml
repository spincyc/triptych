context = "Fortescue’s torch-bearer section has the servers enter without torches, go to the sacristy around the Preface, take lighted torches there, and return at the Sanctus for the Elevation. The torches normally leave after the chalice elevation, but remain through Communion on identified occasions. A footnote expressly says that acolytes serving as torch-bearers use torches, not their candlesticks."
