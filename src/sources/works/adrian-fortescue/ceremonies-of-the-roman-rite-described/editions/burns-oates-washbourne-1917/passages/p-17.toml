context = "Fortescue distinguishes three portable families. Acolytes’ candles are in tall footed candlesticks that can stand on the credence. Torches used by torch-bearers have no foot and cannot stand alone. The processional cross is fixed to a long staff and likewise cannot stand alone. These statements control functional distinction and support requirements, not material, dimensions, or ornament."
