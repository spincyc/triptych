context = "Fortescue says the Roman custom does not carry a processional cross before the entrance when a priest sings High Mass and that the Roman ceremonial books therefore usually do not mention it. He adds that no rule forbids it and many churches customarily use it. When used, the cross-bearer carries it between the acolytes, places it in a convenient sanctuary stand on the Epistle side, and retrieves it for the recession. This supports optional/local status and the need for a stand; it does not make the cross Missal-required or universal."
verified_on = "2026-07-28"
notes = "Read visually in the Internet Archive page-image renditions. Fortescue’s statement is a contemporary ceremonial account; the 1962 Missal is separately controlling for what its rubrics themselves name."
