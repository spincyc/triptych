description = "An English ceremonial manual first published by Adrian Fortescue in 1917 and repeatedly revised by J. B. O'Connell. It describes the ministers, appointments, vesture, and ceremonial execution of the Roman Rite. Printed page numbers are the conventional locus system; edition-specific claims must identify the exact revision consulted."
