description = "Calvin's systematic theological treatise, first published in 1536 and reaching its definitive four-book form in the Latin edition of 1559 and the French of 1560. Book 4 chapter 6 argues against the primacy of the Roman see and gives Calvin's exposition of Matthew 16:18-19 and John 21:15-17. Loci use book.chapter.section."
