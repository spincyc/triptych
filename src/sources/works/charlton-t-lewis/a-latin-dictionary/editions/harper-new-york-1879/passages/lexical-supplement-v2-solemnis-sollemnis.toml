notes = "The sollemnis head lists solemnis among less-correct variants and gives e, adj. Its own adverb section expressly gives sollemniter with sollenn- and solemn- alternatives. This proves the requested solemniter/sollemniter pair directly as an adverb spelling pair, rather than deriving it only from the adjective. No comparative or superlative adverb is printed; source says none. Other spellings and the distinct -itus adverb are outside this supplement."
