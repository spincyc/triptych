notes = "The verb fecundo is transitive and prints long-a infinitive -are. The p.764 row expressly includes foecundo and directs to fec-. Immediately after the fecundo verb on p.733, fecundus calls foecund- and faecund- sometimes erroneous. This is recorded rather than treated as editorial approval of every spelling. Exact fecundet/foecundet and fecundare/foecundare forms require the separately cited first-conjugation paradigm; no general oe/e fold."
