notes = "Maerens is printed with moer- and entis; maereo likewise has moer-, with a derived maerens/moer- participial adjective. The separate moerens entry gives maerens and entis, referring to maereo fin. The dictionary also notes poetic genitive plural maerentum; this supplement does not equate -um and -ium, and admits no such ending change."
