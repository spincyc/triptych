context = "Genetrix has the less frequent variant genitrix, genitive ending -icis and feminine gender; genitrix is explicitly referred back to genetrix."
notes = "Printed p.807 head: genetrix (less freq. genitrix; with scholarly references), icis, f., connected to genitor; the whole entry identifies a mother or one who produces and extends through its final poetic mother-in-law sense before Geneva. Printed p.808 head genitrix, icis, v. genetrix. These are the same lexical entry, with a stated frequency difference and the index preference retained. The ablatives Genetrice and Genitrice are not claimed to appear verbatim in these two entries; the separately registered third-declension paradigm supports the finite grammatical instantiation. No personal name is replaced."
