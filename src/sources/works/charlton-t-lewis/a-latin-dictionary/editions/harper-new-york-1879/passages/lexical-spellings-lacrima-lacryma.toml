notes = "The head entry says archaic lacruma, not lacryma, lachryma; the separate lacruma and lacryma line refers to lacrima. This connects the historical spelling to the same lexeme while preserving the lexicon’s disagreement about preferred classical orthography. It does not establish that every editor approves lacryma."
