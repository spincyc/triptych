notes = "Printed p.1289 paenitentia, ae, f.; paeniteo is marked less correctly poen-. Printed p.1391 poenitentia, v. paenitentia; poeniteo, v. paeniteo; poenitens is a participle from poeniteo. The noun evidence is not a blanket rule for other words containing poen-, and the source’s prescriptive distinction remains part of the evidence."
