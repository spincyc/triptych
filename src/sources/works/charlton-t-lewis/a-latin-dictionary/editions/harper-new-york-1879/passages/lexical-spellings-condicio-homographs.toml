notes = "On p.407 condicio is marked in many manuscripts and editions incorrectly conditio, and derived from condico. On p.408 entry 1 conditio refers to condicio; entry 2 is from condo, a making/creating or thing made (ecclesiastical Latin); entry 3 is from condio, preserving/seasoning/flavoring. Identical genitive endings alone cannot select among these words. Consumer admission is held separately."
