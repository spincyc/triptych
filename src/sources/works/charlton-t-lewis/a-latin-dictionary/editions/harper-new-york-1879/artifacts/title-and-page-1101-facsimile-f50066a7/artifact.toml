notes = "3 pages only: parent PDF pages 5 (title page), 6 (its verso, copyright 1879, 1878 and 1877 by Harper & Brothers) and 1119 (printed p. 1101). Page 1101 carries, in its third column, the entry majestas from its head: I. 'Lit., of the gods; also the condition of men in high station, as kings, consuls, senators, knights, etc., and, in republican states, esp. freq. of the people'; 1. of the gods; 2. of men, then 'The sovereign power, sovereignty of the Roman people', crimen majestatis, the Lex Julia majestatis, and 'As a title of honor of the Roman emperors, majesty', citing Phaedrus 2, 5, 23 and a letter of Symmachus 'et saep.'; II. transferred, honor, dignity, excellence. All other parent pages are omitted."
