notes = "The title page of the Library of Congress copy read is undated and torn at its imprint; its verso prints the copyright notices of 1879, 1878 and 1877 by Harper & Brothers and the 1850 entry of Andrews's translation. The Internet Archive record of that copy (harperslatindict02lewi) dates it 1899, which is taken as the date of the impression, not of the edition. An Oxford University Press impression of 1984 of the same text (Internet Archive latindictionaryf00andr, 384,090,767 bytes, SHA-256 8b62b445..., fetched whole on 2026-10-16) was read first and not registered: its imprint page reserves all rights, so this public-domain American issue was taken instead. Its page 1101 carries the entry majestas in the same setting."
