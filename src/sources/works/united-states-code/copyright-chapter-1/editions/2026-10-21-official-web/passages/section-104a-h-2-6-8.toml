context = "Section 104A(h)(2) makes the date of restoration of a restored copyright January 1, 1996, if the source country of the restored work is a nation adhering to the Berne Convention or a WTO member country on that date, and otherwise the date of adherence or proclamation. Section 104A(h)(6) defines a restored work as an original work of authorship that (A) is protected under subsection (a); (B) is not in the public domain in its source country through expiration of term of protection; (C) is in the United States public domain due to (i) noncompliance with formalities imposed at any time by United States copyright law, including failure of renewal, lack of proper notice, or failure to comply with any manufacturing requirements, (ii) lack of subject matter protection for sound recordings fixed before February 15, 1972, or (iii) lack of national eligibility; (D) has at least one author or rightholder who was, when the work was created, a national or domiciliary of an eligible country, and, if published, was first published in an eligible country and not published in the United States during the 30-day period following that publication; and (E) is a sound recording where the source country is eligible solely through the WIPO Performances and Phonograms Treaty. Section 104A(h)(8) makes the source country a nation other than the United States: for an unpublished work, the eligible country of which the author or rightholder, or the majority of foreign authors or rightholders, are nationals or domiciliaries, or else the nation other than the United States with the most significant contacts; for a published work, the eligible country of first publication or, for same-day publication in two or more eligible countries, the one with the most significant contacts."
verified_on = "2026-11-14"
notes = "Read on 2026-11-14 in the exact tracked bytes (SHA-256 recomputed first): subsection (h) opens at physical line 522, (h)(2) occupies lines 529-531, (h)(6) lines 543-551 and (h)(8) lines 555-562. No physical_line_ranges are declared because the controlling artifact is recorded indexable = false, and the validator admits line ranges only on an indexable artifact. Historical note 31 on that page records that section 104A was added in 1993 and amended in its entirety by the Uruguay Round Agreements Act in 1994 (Pub. L. No. 103-465), with later amendments; note 36 records that (h)(6)(E) took effect on May 20, 2002. This is the 2026-10-21 delivery of the current statute, not a point-in-time text for 1996; subsections (a), (h)(1) and (h)(3), which these definitions depend on, are not bound by this passage."
