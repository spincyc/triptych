description = "The diocesan missal of the church of Mainz, a medieval German use of the Mass printed before the Tridentine reform. It is NOT the Missale Romanum and is registered under the archdiocese whose archbishop's mandate it prints. Registered as an independently dated public-domain witness to older wording of prayers the Roman Order of Mass received."
