context = "Bartlett identifies inscriptions on the small steatite icon of Christ and the saints in New York as naming Christ in several ways. Among them are Jesus Emmanuel and Jesus Christ Pantepoptes. He distinguishes IC XC, the ordinary abbreviated name of Jesus Christ, from the epithets."
