text = "Every sort of satisfaction included under three heads. The pastor will teach that every species of satisfaction is included under these three heads, prayer, fasting, and alms-deeds, which correspond with these three sorts of goods, those of the soul, of the body, and what are called external goods, all of which are the gifts of God. Than these three sorts of satisfaction, nothing can be more effectual in eradicating sin from the soul. Whatever is in the world is the lust of the flesh, the \"lust of the eyes, or pride of life,\" and fasting, alms-deeds, and prayer are, it is obvious, most judiciously employed as antidotes to neutralize the operation of these three causes of spiritual disease; to the first is opposed fasting; to the second, alms-deeds; to the third, prayer. If, moreover, we consider those whom our sins injure, we shall easily perceive why all satisfaction is referred principally to God, to our neighbour, and to ourselves; God we appease by prayer, our neighbour we satisfy by alms, and ourselves we chastise by fasting."
