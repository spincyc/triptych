text = "This triple remedy was, therefore, appointed by God to aid man in the attainment of salvation. When we offend God by sin, wrong our neighbour, or injure ourselves, we appease the wrath of God by prayer: by alms-deeds we redeem our offences against man; and by fasting we appease God, and efface from our own souls the stains of sin."
