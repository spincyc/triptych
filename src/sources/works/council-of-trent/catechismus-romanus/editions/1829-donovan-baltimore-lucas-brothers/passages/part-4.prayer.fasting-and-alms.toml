text = "To prayer let us unite fasting and alms-deeds. Fasting is most intimately connected with prayer: When cloyed with meat and drink, the mind is so pressed down as not to be able to raise itself to the contemplation of God, or comprehend the utility of prayer. Alms-deeds have also an intimate connexion with prayer."
