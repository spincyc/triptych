notes = "Read on 2026-11-18 on the page images of Internet Archive item thecatechismofth00donouoft (Regis College copy, University of Toronto). Title page PDF p. 7: 'Translated into English by the Rev. J. Donovan, Professor, &c. Royal College, Maynooth. Baltimore: Published by Lucas Brothers, No. 170 Market Street.' Verso PDF p. 8: 'Printed by James Young, Baltimore'; no copyright notice. The translator's preface (PDF p. 17, printed p. 11) is dated 'Maynooth College. June 10th, 1829.' The Baltimore printing is undated; the date recorded is that of the translation, as the Waterworth Trent edition is dated by its translation. PDF page = printed page + 6."
