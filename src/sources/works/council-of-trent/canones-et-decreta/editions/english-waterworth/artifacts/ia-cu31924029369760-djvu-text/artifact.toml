notes = "Not retained in the repository: the bytes are uncorrected whole-volume OCR of a poor scan, with frequent recognition damage in the running text (for example 'cecumenical' for 'oecumenical' and 'Devih' for 'Devil'), and the exact page images for individual loci are separately registrable. It is a finding aid and a working witness for locating and reading a decree; a publication quoting the translation records the session, chapter, or canon and should read the wording in context. The same item supplies the separately registered leaf-image artifact for session XXIV."
