context = "Printed p. 156 was read at the page image. Waterworth's English of chapter IV, On the Canon of the Mass, closes: 'the Catholic Church instituted, many years ago, the sacred canon, so pure from every error, that nothing is contained therein which does not in the highest degree savour of a certain holiness and piety, and raise up unto God the minds of those that offer. For it is composed out of the very words of the Lord, the traditions of the Apostles, and the pious institutions also of holy pontiffs.' Chapter V, On the solemn ceremonies of the Sacrifice of the Mass, follows complete: 'therefore has holy Mother Church instituted certain rites, to wit, that certain things be pronounced in the mass in a low and others in a louder tone.'"
verified_on = "2026-07-26"
notes = "Read visually at the page image. The chapter's opening sentence stands at the foot of printed p. 155. Waterworth is the standard nineteenth-century English version, not an official translation."
