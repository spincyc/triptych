context = "Printed p. 159 was read at the page image. It carries canons III to IX in Waterworth's English, including canon VI, 'If anyone saith that the canon of the mass contains errors, and is therefore to be abrogated; let him be anathema', and canon IX, 'If anyone saith that the rite of the Roman Church, according to which a part of the canon and the words of consecration are pronounced in a low tone, is to be condemned; or that the mass ought to be celebrated in the vulgar tongue only; or that water ought not to be mixed with the wine that is to be offered in the chalice, for that it is contrary to the institution of Christ; let him be anathema.'"
verified_on = "2026-07-26"
notes = "Read visually at the page image. The locus names the two canons actually used; canons III to V and VII to VIII stand on the same page and are recorded in this context."
