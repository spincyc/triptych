context = "Printed p. 95 was read at the page image. Waterworth's chapter III, On the parts, and on the fruit of this Sacrament: 'the acts of the penitent himself, to wit, contrition, confession, and satisfaction, are, as it were, the matter of this sacrament', which 'are for this reason called the parts of penance'; the thing signified and effect 'is reconciliation with God, which sometimes, in persons who are pious and who receive this sacrament with devotion, is wont to be followed by peace and serenity of conscience, with exceeding consolation of spirit.'"
