context = "Waterworth's English of Session XXIV, reform decree on matrimony, chapter X: the ancient prohibitions of solemn nuptials from Advent to Epiphany and from Ash Wednesday to the octave of Easter. Printed p. 204, scan page n477."
physical_line_ranges = [[1, 3]]
text = "CHAPTER X. The solemnities of marriage are prohibited at certain times. The holy Synod enjoins that the ancient prohibitions of solemn nuptials be carefully observed by all, from the Advent of our Lord Jesus Christ until the day of the Epiphany, and from Ash-Wednesday until the octave of Easter inclusively; but at other times It allows marriages to be solemnly celebrated; and the bishops shall take care that they be conducted with becoming modesty and propriety: for marriage is a holy thing, and is to be treated in a holy manner."
