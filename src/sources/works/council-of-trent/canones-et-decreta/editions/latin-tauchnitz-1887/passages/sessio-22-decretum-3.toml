context = "Printed p. 118 was read at the page image. It carries session XXII chapter III, De missa in honorem sanctorum, complete: 'Et quamvis in honorem et memoriam sanctorum nonnullas interdum missas ecclesia celebrare consueverit, non tamen illis sacrificium offerri docet, sed Deo soli, qui illos coronavit; unde nec sacerdos dicere solet: Offero tibi sacrificium, Petre, vel Paule, sed Deo de illorum victoriis gratias agens, eorum patrocinia implorat, ut ipsi pro nobis intercedere dignentur in coelis, quorum memoriam facimus in terris.' Chapter II on the propitiatory character of the sacrifice stands complete above it and the opening of chapter IV, De canone missae, below."
verified_on = "2026-07-26"
notes = "Read visually at the page image. The closing clause is all but identical to the closing clause of the offertory prayer Suscipe, sancta Trinitas in the Missale Romanum, which reads intercedere dignentur in caelis, quorum memoriam agimus in terris; the council's verb is facimus and the Tauchnitz stereotype prints coelis for caelis. The work record's locus grammar admits canon and decree numbers only, so the doctrinal chapter is recorded as decretum-3."
