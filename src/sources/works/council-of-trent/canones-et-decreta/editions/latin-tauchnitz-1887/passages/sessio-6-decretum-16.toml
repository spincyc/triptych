context = "Printed p. 34 was read at the page image. In chapter XVI, eternal life is presented both 'tanquam gratia filiis Dei per Christum Iesum misericorditer promissa' and 'tanquam merces ex ipsius Dei promissione bonis ipsorum operibus et meritis fideliter reddenda.' Christ as head and vine continually infuses the just with a virtue that 'bona eorum opera semper antecedit et comitatur et subsequitur'; without it the works cannot be pleasing or meritorious, and their merits are God's gifts."
verified_on = "2026-08-21"
notes = "Read visually at the registered page image and collated against the exact whole-volume OCR. The chapter's heading and opening were separately inspected on registered leaf 40 (printed p. 33), and its short conclusion on registered leaf 42 (printed p. 35); this passage fingerprint controls only leaf 41, which carries the grace-and-merit claims used by the publication. The work record's locus grammar admits canon and decree numbers, so the doctrinal chapter is recorded in the decree slot."
