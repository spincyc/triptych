context = "Printed p. 119 was read at the page image. It carries the close of chapter IV, De canone missae: '... digne reverenterque offerretur ac perciperetur, sacrum canonem multis ante saeculis instituit, ita ab omni errore purum, ut nihil in eo contineatur, quod non maxime sanctitatem ac pietatem quandam redoleat, mentesque offerentium in Deum erigat. Is enim constat cum ex ipsis Domini verbis, tum ex Apostolorum traditionibus, ac sanctorum quoque Pontificum piis institutionibus.' Chapter V, De missae caeremoniis et ritibus, follows complete on the same page and records that the Church 'ritus quosdam, ut scilicet quaedam submissa voce, alia vero elatiore in missa pronunciarentur, instituit', together with mystic blessings, lights, incense and vestments."
verified_on = "2026-07-26"
notes = "Read visually at the page image. The work record's locus grammar admits canon and decree numbers only, so the doctrinal chapter number is carried in the decree slot; chapters VI and the opening of VII stand on the same page and are recorded in this context rather than as separate loci. The Tauchnitz stereotype reprints the Roman edition of 1834 and prints that edition's page numbers in the margin; the page cited is the Tauchnitz page."
