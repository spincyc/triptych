context = "Printed p. 120 was read at the page image. It carries the end of session XXII chapter VII, chapter VIII headed Missa vulgari lingua non celebretur. Eius mysteria populo explicentur (Etsi missa magnam contineat populi fidelis eruditionem, non tamen expedire visum est Patribus, ut vulgari passim lingua celebraretur ... mandat sancta synodus pastoribus ... ut frequenter inter missarum celebrationem ... aliquid exponant ... diebus praesertim dominicis et festis), chapter IX as prolegomenon to the canons, and canons I and II on the sacrifice of the Mass."
verified_on = "2026-07-25"
notes = "Read visually at the page image. The work record's locus grammar admits canon and decree numbers only, so the doctrinal chapters printed on the same page are recorded in this context rather than as separate loci. The Tauchnitz stereotype reprints the Roman edition of 1834 and prints that edition's page numbers in the margin; the printed page cited is the Tauchnitz page."
