notes = "Read visually at the registered page image and collated against the exact whole-volume OCR. The chapter quotes only the virtue-increase petition, alters the Collect's address to Da nobis, Domine, and does not reproduce the complete Collect. The work record's locus grammar admits canon and decree numbers, so the doctrinal chapter is recorded in the decree slot."
