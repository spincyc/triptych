context = "Printed p. 30 was read at the page image. Session VI chapter X teaches growth in received justification through Christ's grace and concludes: 'Hoc vero iustitiae incrementum petit sancta ecclesia, quum orat: Da nobis, Domine, fidei, spei et caritatis augmentum.' Footnote 9 identifies the prayer as Dominica XIII post Pentecosten."
