context = "Printed p. 77 was read at the page image. Session XIV chapter VI teaches that priests exercise the function of remitting sins 'per virtutem Spiritus sancti in ordinatione collatam tanquam Christi ministros.' Priestly absolution, although a dispensation of another's benefit, is not merely announcing the Gospel or declaring sins forgiven, 'sed ad instar actus iudicialis, quo ab ipso velut a iudice sententia pronunciatur.'"
verified_on = "2026-08-21"
notes = "Read visually at the registered page image and collated against the exact whole-volume OCR. The heading and opening, including the restriction of the ministry of the keys to bishops and priests, were separately inspected on registered leaf 83 (printed p. 76). This passage fingerprint controls only leaf 84, which carries the ministerial and judicial claims used by the publication. The chapter says tanquam Christi ministros; it does not itself use the later scholastic adjective instrumentalis. The work record's locus grammar admits canon and decree numbers, so the doctrinal chapter is recorded in the decree slot."
