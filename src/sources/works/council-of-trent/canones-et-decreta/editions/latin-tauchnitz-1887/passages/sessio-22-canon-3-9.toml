context = "Printed p. 121 was read at the page image. It carries canons III to IX on the sacrifice of the Mass, including canon III on the propitiatory character of the sacrifice and its offering for the living and the dead, canon VI (Si quis dixerit, canonem missae errores continere, ideoque abrogandum esse: anathema sit), canon VII on ceremonies, vestments and external signs, and canon IX condemning the propositions that the Roman rite of a low-voiced canon is to be condemned, that Mass ought to be celebrated in the vernacular only, and that water is not to be mixed with the wine in the chalice; the opening of the Decretum de observandis et evitandis in celebratione missae follows on the same page."
verified_on = "2026-07-25"
notes = "Read visually at the page image. The work record's locus grammar admits canon and decree numbers only, so the doctrinal chapters printed on the same page are recorded in this context rather than as separate loci. The Tauchnitz stereotype reprints the Roman edition of 1834 and prints that edition's page numbers in the margin; the printed page cited is the Tauchnitz page."
