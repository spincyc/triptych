notes = "Read visually at the registered page image and collated against the exact whole-volume OCR. The canon's final words, on attaining eternal life and increase of glory if the justified person dies in grace, were separately checked on registered leaf 46 (printed p. 39). This passage fingerprint controls only leaf 45, which carries the grace-and-merit claim used by the publication."
