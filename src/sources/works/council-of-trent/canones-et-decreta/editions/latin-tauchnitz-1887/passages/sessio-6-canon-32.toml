context = "Printed p. 38 was read at the page image. Canon XXXII rejects denying that the justified person's good works are both gifts of God and the person's true merits, or that the justified person truly merits increase of grace and eternal life through good works done 'per Dei gratiam et Iesu Christi meritum, cuius vivum membrum est.'"
