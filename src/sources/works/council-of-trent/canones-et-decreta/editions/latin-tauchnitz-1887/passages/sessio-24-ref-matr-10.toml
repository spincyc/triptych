context = "Session XXIV, Decretum de reformatione matrimonii, chapter X 'Nuptiarum solennitates certis temporibus prohibentur': the ancient prohibitions of solemn nuptials are to be kept from Advent to Epiphany and from Ash Wednesday to the octave of Easter inclusive. Printed p. 153, scan page n160. Not the doctrinal canons on matrimony, nor chapter X of the session's general Decretum de reformatione."
physical_line_ranges = [[1, 3]]
text = "C. X. Nuptiarum solennitates certis temporibus prohibentur. Ab Adventu Domini nostri Iesu Christi usque in diem Epiphaniae, et a feria quarta Cinerum usque in octavam Paschatis inclusive, antiquas solennium nuptiarum prohibitiones diligenter ab omnibus observari sancta synodus praecipit; in aliis vero temporibus nuptias solenniter celebrari permittit, quas episcopi, ut ea qua decet modestia et honestate fiant, curabunt. Sancta enim res est matrimonium et sancte tractandum."
