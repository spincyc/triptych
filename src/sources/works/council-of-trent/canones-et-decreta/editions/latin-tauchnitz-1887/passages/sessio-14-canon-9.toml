context = "Printed p. 84 was read at the page image. Canon IX anathematizes the assertion that the priest's sacramental absolution is not a judicial act but only a ministry of pronouncing and declaring sins forgiven to one who confesses, conditioned only on belief in absolution or even on the priest's acting in jest; it also rejects denying the need for the penitent's confession before priestly absolution."
verified_on = "2026-08-21"
notes = "Read visually at the registered page image and collated against the exact whole-volume OCR. The canon begins with 'Si quis dixerit, absolutionem sacramentalem' across the printed page break on registered leaf 90 (p. 83) and leaf 91 (p. 84); the opening fragment was separately inspected on leaf 90. This passage fingerprint controls only leaf 91, which carries the complete judicial-act proposition and conclusion."
