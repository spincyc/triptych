notes = "Not retained in the repository: uncorrected whole-volume OCR of a nineteenth-century Latin printing, with heavy recognition damage including broken ligatures, hyphenated line breaks, dropped letters ('offensam' printed as 'ofTensam'), and marginal numerals mixed into the text. It is a finding aid and a working Latin witness; a publication quoting the Latin records the session, chapter, or canon and should read the wording in context. The same item supplies the separately registered leaf-image artifact for session XXIV."
