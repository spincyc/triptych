notes = "The exact offered scan has 92 two-up spread images. PDF p. 2 has the Greek/Albanian title and ROMA 1967, opposite a Chrysostom frontispiece. P. 3 has a general Greek Holy See approval/permission formula, without a dated approving instrument or protocol in that leaf. P. 24 shows the Chrysostom liturgy opening; pp. 31 and 33 show Sunday/feast alternatives and priest/deacon rubrics, not an annual calendar. P. 91 visibly carries printed pp. 180–181. P. 92 gives completion of printing on 15 December 1967 at the Tipografia Italo-Orientale S. Nilo of the Exarchic Monastery of S. Maria, Grottaferrata. These title and colophon facts identify this setting. They do not establish that every retrospective 1968 printing reference is this same edition, authenticate a particular Lungro receiving copy, identify the Greek exemplar, settle 6 August/13 October 1968 decree roles or establish adoption outside Lungro. Selected image inspection and whole-file acquisition do not establish physical completeness or complete literal collation. The date field records completion of printing, not adoption, approval, circulation or observed use."
