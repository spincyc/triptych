description = "The English pastoral letter of the Sixth Provincial Council of Baltimore, addressed by the Archbishop and Bishops of the United States to the clergy and faithful of their charge and given at Baltimore in the council on the fifth Sunday after Easter (17 May) 1846. Among other counsels it announces to the faithful the bishops' unanimous determination to place themselves and all in their charge under the special patronage of the holy Mother of God, whose immaculate conception the Church venerates; the council's Latin acts record the same election as its first decree. It is the bishops' own English and not a translation of those acts. Cited by edition and printed page."
