context = "The bishops' own English announcement to the faithful of the choice recorded in Latin as Decree I of the Sixth Provincial Council (passage.provincial-councils-of-baltimore.concilia-provincialia-baltimori-1829-1849.baltimore-murphy-1851.advent-pc-l5-1846-petition-and-election, line 3: Patres, ardentibus votis, plausu consensuque unanimi, B. Mariam Virginem sine labe Conceptam in Patronam Americæ Fœderatæ Statuum elegerunt). It is a parallel English witness to the same act and not a translation of the decree: it has unanimously adopted where the decree has plausu consensuque unanimi, but nothing for ardentibus votis or plausu, and it speaks of placing ourselves, and all entrusted to our charge throughout the United States, under the special patronage of the holy Mother of God, whose immaculate conception is venerated, not of electing the Virgin conceived without stain as Patroness of the United States. The bold sidenote of p. 169 is this edition's printing; its origin is not established."
physical_line_ranges = [[1, 6]]
text = "We take this occasion, brethren, to communicate to you the determination, unanimously adopted by us, to place ourselves, and all entrusted to our charge throughout the United States, under the special patronage of the holy Mother of God, whose immaculate conception is venerated by the piety of the faithful throughout the Catholic church. By the aid of her prayers, we entertain the confident hope that we will be strengthened to perform the arduous duties of our ministry, and that you will be enabled to practise the sublime virtues, of which her life presents a most perfect example. The Holy Ghost, by her own lips, has foretold that all generations shall call her blessed; and we can not doubt that a blessing is attached to those who take care to fulfil this prediction. To her, then, we commend you, in the confidence that, through the one Mediator of God and men, the man Christ Jesus, who gave himself a redemption for all, she will obtain for us grace and salvation. The Mother of God, Patroness of the American Church. Given at Baltimore, in the sixth Provincial Council, on the fifth Sunday after Easter, in the year of our Lord MDCCCXLVI."
