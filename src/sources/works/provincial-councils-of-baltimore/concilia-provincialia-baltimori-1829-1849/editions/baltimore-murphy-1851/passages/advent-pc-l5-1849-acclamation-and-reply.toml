text = "Archid. Beatissimæ Virgini Mariæ, sine labe originali conceptæ, harum Provinciarum Patronæ, honor æternus. Chorus. Honor æternus: fecit ei magna qui potens est, ideoque beatam dicant eam omnes generationes. Perlectis litteris Encyclicis Summi Pontificis Pii IX, quibus significavit se vehementer optare ut Episcopi totius Catholici orbis per litteras ipsi referrent quâ devotione clerus populusque fidelis erga Immaculatæ Virginis Conceptionem sint animati; Patribus omnibus visum est respondere clerum populumque fidelem, in Fœderatis Americæ Statibus, magnâ flagrare erga eamdem devotione. Censuerunt pariter Patres Summo Pontifici significandum, gratum sibi fore ut veluti Catholicæ Ecclesiæ doctrinam definiat, si id sapientissimo suo judicio opportunum existimet, Beatissimæ Virginis Mariæ Conceptum Immaculatum omninò fuisse, atque ab omni prorsùs Originalis culpæ labe immunem."
