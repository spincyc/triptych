physical_line_ranges = [[1, 3]]
text = "Die Maii 15, habita est quarta Congregatio privata, eâdem horâ et loco quibus prima. Censuerunt Patres supplicandum S. Sedi, ut in omnibus Fœderatæ Americæ Provinciis, in Officio et Missâ Conceptionis B. Mariæ, liceat in Orationibus et Præfatione addere verba Immaculatæ, Immaculatâ, et in Litaniis ejusdem B. Mariæ, ℣. Regina sine labe Concepta, ora pro nobis. I. Patres, ardentibus votis, plausu consensuque unanimi, B. Mariam Virginem sine labe Conceptam in Patronam Americæ Fœderatæ Statuum elegerunt; nullâ tamen inductâ obligatione audiendi missam et à servilibus operibus abstinendi in ipso festo Conceptionis B. Mariæ: atque ideò Summo Pontifici humiliter supplicandum ut solemnitas, nisi festum in Dominicam inciderit, transferatur in Dominicam proximè sequentem, in quâ missæ, tam privatæ quàm solemnes, de festo illo translato celebrentur, vespertinumque officium de eodem recitetur."
