notes = "Fransoni's covering letter of 15 September 1846 and the rescript Ex audientia Sanctissimi of 13 September 1846 (printed pp. 246-248, PDF 248-250) were read on the images and are not transcribed here: Pius IX granted in perpetuum that the clergy of all the dioceses may add Immaculatae in the orations and say Conceptione Immaculata in the Preface, and that the faithful may add Regina sine labe originali concepta to the Litany. The optical text layer reads the rescript date as 18; the image at 500 dpi reads 13, consistent with the covering letter of the 15th."
