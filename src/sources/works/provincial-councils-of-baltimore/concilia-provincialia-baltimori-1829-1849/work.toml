description = "The acts, decrees, pastoral letters and Roman documents of the seven Provincial Councils of Baltimore, 1829-1849, including the Sixth Council's election of the Blessed Virgin Mary conceived without sin as patroness of the United States (1846), the Propaganda decree confirming it (1847), and the Seventh Council's reply to Pius IX on a definition of the Immaculate Conception (1849). Cited by council, session or congregation, decree and printed page."
