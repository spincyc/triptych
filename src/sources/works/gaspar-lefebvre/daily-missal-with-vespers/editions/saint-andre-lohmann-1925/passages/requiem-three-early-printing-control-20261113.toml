notes = "The title itself is undated; approval dates alone do not date publication, and an early front-leaf accession stamp cannot by itself exclude every later inserted or replaced leaf. Nearby other source settings elsewhere include lettered pagination. For these prayers the visible continuous ordinary folios, common setting and shared physical page with the already registered Third-Mass Postcommunion support the bounded early-setting inference. The exact Google/CCWatershed PDF/layout/OCR/wrappers remain unresolved and are neither copied into this proposal nor cleared by the textual assessment."
