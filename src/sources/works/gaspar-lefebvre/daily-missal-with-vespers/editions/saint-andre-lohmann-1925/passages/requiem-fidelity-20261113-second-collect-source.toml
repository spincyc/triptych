notes = "Normalized complete source Latin for comparison: Deus, indulgentiarum Domine : da animabus famulorum, famularumque tuarum, refrigerii sedem, quietis beatitudinem, et luminis claritatem. Per Dominum. All petition Latin words agree after accent/ligature/case/pointing/line-wrap normalization. Source actual cue Per Dominum.; target actual cue Per Dominum nostrum Jesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate. English actual cue Through our Lord. All are preserved at their own printed extents; no literal entire-ending equality is asserted when those extents differ, and no performed full conclusion is supplied. Historical English fidelity qualification: The historical translator renders quietis beatitudinem freely as rest and happiness and luminis claritatem as the glory of Thy light. The added possessive makes the divine source explicit; no anniversary or new class of departed is introduced. This is a historical rendering for independent fidelity review, not a word-for-word gloss. Date control passage.gaspar-lefebvre.daily-missal-with-vespers.saint-andre-lohmann-1925.requiem-three-early-printing-control-20261113. No Lasance source body is corrected or overwritten."
