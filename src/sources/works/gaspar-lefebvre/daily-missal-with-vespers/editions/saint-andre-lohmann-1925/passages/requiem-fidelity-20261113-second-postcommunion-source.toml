notes = "Normalized complete source Latin for comparison: Praesta, quaesumus, Domine : ut animae famulorum, famularumque tuarum, his purgatae sacrificiis, indulgentiam pariter et requiem capiant sempiternam. Per Dominum. All petition Latin words agree after accent/ligature/case/pointing/line-wrap normalization. Source actual cue Per Dominum.; target actual cue Per Dominum. English actual cue Through our Lord. All are preserved at their own printed extents; no literal entire-ending equality is asserted when those extents differ, and no performed full conclusion is supplied. Historical English fidelity qualification: The historical English renders plural his sacrificiis as this sacrifice and does not separately lexicalize pariter; the coordinated pardon and everlasting rest are both preserved. The singular is contextual Mass English, not a transcription correction; independent fidelity review must assess it. Date control passage.gaspar-lefebvre.daily-missal-with-vespers.saint-andre-lohmann-1925.requiem-three-early-printing-control-20261113. No Lasance source body is corrected or overwritten."
