context = "Own Third-Mass Collect begins at the bottom ofAP1778/1738 in English-left/Latin-right and continues at the top ofAP1779/1739 with Latin-left/English-right, ending before the Secret. The following Collects override the daily-Requiem referral. Complete actual source Latin/English read at200/400dpi; printed 1738-1739."
notes = "Normalized complete source Latin for comparison: Deus veniae largitor, et humanae salutis amator: quaesumus clementiam tuam ; ut animas famulorum, famularumque tuarum, quae ex hoc saeculo transierunt, beata Maria semper Virgine intercedente cum omnibus Sanctis tuis, ad perpetuae beatitudinis consortium pervenire concedas. Per Dominum. All petition Latin words agree after accent/ligature/case/pointing/line-wrap normalization. Source actual cue Per Dominum.; target actual cue Per Dominum nostrum. English actual cue Through our Lord. All are preserved at their own printed extents; no literal entire-ending equality is asserted when those extents differ, and no performed full conclusion is supplied. Historical English fidelity qualification: The historical English names Thy servants and handmaids who have passed out of this life rather than explicitly repeating souls of; the full intended departed group remains, with Mary and all saints interceding and the petition for everlasting bliss. It does not restrict them to brethren. This free historical rendering is retained verbatim for independent review. Date control passage.gaspar-lefebvre.daily-missal-with-vespers.saint-andre-lohmann-1925.requiem-three-early-printing-control-20261113. No Lasance source body is corrected or overwritten."
