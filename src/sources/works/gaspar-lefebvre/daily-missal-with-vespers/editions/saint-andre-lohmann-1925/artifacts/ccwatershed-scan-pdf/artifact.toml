notes = "2,007 PDF pages carrying a Google Books text layer of usable quality; the Sundays after Pentecost begin near PDF page 1115. No English oration text is vendored from it. Two reasons: the exact bytes have an unresolved rights status, so a verbatim extract could not be tracked, and the Mass formularies are set in two columns whose language sides alternate from element to element, so a mechanical extraction cannot be trusted to separate the English from the Latin without a page-image check of every formulary. Existing repository research quotes short passages from it after visual collation of individual pages; that remains the safe use."
