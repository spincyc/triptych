notes = "This 1925 edition is already in use elsewhere in the repository as a historical English prayer and oration witness. It is a pre-1955 book: its Holy Week, octaves, vigils, and second and third orations are those of the Divino afflatu discipline, not of 1962. Its running commentary and rubrical explanations are the editor's, not liturgical text."
