description = "Dom Gaspar Lefebvre's liturgical hand missal, the ancestor of the later Saint Andrew Daily Missal, giving the Ordinary, the temporal and sanctoral Masses, and Vespers of Sundays and feasts in facing Latin and English with liturgical commentary. In the Mass formularies the Latin and English are set in two columns whose sides alternate, so a column is not reliably one language. Later Saint Andrew editions of 1940, 1945, 1949, 1953, and 1962 are separate expressions whose United States copyright status was not established here and which are not registered."
