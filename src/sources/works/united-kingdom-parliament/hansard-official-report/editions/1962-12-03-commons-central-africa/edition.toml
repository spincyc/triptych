notes = "THE TITLE IS AS HANSARD PRINTS IT, 'Central Africal', and the misprint is preserved rather than silently corrected. The debate is served with all 141 contribution items including the printed time-markers, and Humphry Berkeley's whole speech is present. It carries no printed column numbers. THE REQUEST CARRIED house=Lords AND THE API IGNORED IT, returning the Commons debate for this ExtId; the source_url is recorded exactly as it was requested, because that is the string that produced these bytes, and this note is what stops a later reader concluding from the URL that the debate is a Lords one."
