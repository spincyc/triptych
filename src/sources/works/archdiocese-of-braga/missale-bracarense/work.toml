description = "The altar book of the Rite of Braga -- the Latin use of the archdiocese of Braga, primatial see of the Spains, one of the diocesan uses left standing by the exempting clause of Quo primum. It is a Missal in the ordinary sense, carrying its own kalendar, general rubrics, Ordo Missae and Canon, temporal and sanctoral cycles, Commons, votive and Requiem Masses, blessings and Mass tones. IT IS NOT THE MISSALE ROMANUM AND MUST NOT BE FILED WITH IT. work.catholic-church.missale-romanum is the Roman Rite's book; this is a different rite's, and the only edge this repository draws between them is that the same Congregation of Rites signed both promulgations -- an authority in common, not a descent. The distinction is the reason src/sources/inventories/latin-missal-acts-v1.toml draws no edge from the Roman line into the Braga line, and it is why this work is registered under the archdiocese rather than under the Catholic Church at large."
