date = "1924"
authority = "Pius XI, bull Inter multiplices gravesque curas of 8 December 1924, printed at the head of the book and subscribed A. Card. VICO, Ep. Portuen. et S. Rufinae and Maurus Rigal, Canc. Ap. Tabularii Praefectus; executed the next day by the Sacred Congregation of Rites, decree of 9 December 1924, operative clause Vaticana hujus Missalis editio pro typica habenda est, with later printings omnino conformandae erunt, ita ut in iis nihil immutare fas sit, subscribed A. Card. VICO, S. R. C. Praefectus and Alexander Verde, S. R. C. Secretarius"
