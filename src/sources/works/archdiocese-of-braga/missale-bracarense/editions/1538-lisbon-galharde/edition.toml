notes = "BNP RES-1633-A, purl.pt/14877. Colophon at printed fol. 184v, PDF 364, names printer Germanus Galhart and corrector Fernandus Olegarius and dates publication 17 Kalendas Augusti (16 July) 1538. The preceding recto explicitly prints folio clxxxiiii, resolving the 183v locator in later scholarship. The complete 368-page delivered file represents an incomplete physical copy: missing initial leaves and other losses are catalogued by BNP. This record does not reconstruct them or claim complete text collation."
