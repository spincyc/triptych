rights_basis = "The underlying Dickinson edition was printed between 1861 and 1883 and is in the United States public domain by publication date. These exact bytes are another matter. THE TEST WAS RUN OVER THESE BYTES AND NOT ASSUMED. The question for an Internet Archive optical text layer is whether Google's own prose is inside the file, and this repository already answers it the same way twice, in opposite directions: artifact.catholic-church.missale-romanum.pustet-ratisbon-1862.missale-romanum-1862-text-f34bc7cf is tracked because its file carries the four-word page-foot stamp and no Google-authored prose, and artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr stands remote and unresolved because its first sixty-five lines are Google's front-matter block entire. The same probes were run here, case-insensitively over the whole file with runs of non-alphanumeric characters collapsed, because this class of scan doubles its spaces: \"usage guidelines\" 1; \"about google book search\" 1; \"this is a digital copy\" 1; \"do not assume\" 2. The block is present, entire, at the head of the file. Google's front-matter statement and usage guidelines are Google's own prose and no distribution grant for them was established, so the file is recorded and not retained. This follows the disposition already settled for artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr, which stands remote and unresolved for exactly this finding."
