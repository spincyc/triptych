notes = "Uncorrected optical text of the whole volume, 51,799 LF-terminated lines. Extent as measured by the retrieving lane: Complete DjVu optical-text layer of the Internet Archive scan of F. H. Dickinson, ed., Missale ad usum insignis et praeclarae ecclesiae Sarum (Burntisland, 1861-83) -- the whole printed volume including the Temporale columns cited below and Dickinson's manuscript-variant footnotes. Optical layer only; no page image was opened, and the readings below are the layer's.. ACCESS LIMITATION. What is not retained is a 1.17 MB text layer whose first pages are Google's own front matter; it is not retained because no distribution grant for that Google-authored prose was established, and this repository holds no other witness to the Sarum missal, so a reader without the network cannot open the Sarum Temporale from a checkout at all. The readings the retrieving lane took from it are recorded in that lane's findings with their column references."
