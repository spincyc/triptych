notes = "Dickinson's nineteenth-century edition of the Sarum missal, printed in parts between 1861 and 1883 and dated here by the first part. It prints the Temporale in columns with manuscript-variant footnotes. The registered artifact is the Internet Archive optical text layer of a Google scan; the printed columns were not collated against a page image. No English edition of the Sarum missal is registered here and none was sought in this run: the Latin is the witness a question about this use's wording has to be settled on, and the absence of a translation is recorded rather than left to look like completeness."
