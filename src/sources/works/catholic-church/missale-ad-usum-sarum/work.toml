composed_basis = "The use of Salisbury took shape from the thirteenth century and was printed until the mid-sixteenth; the work has no single composition date and the range is recorded as such rather than collapsed to the date of the nineteenth-century edition that transmits it."
description = "The mass book of the use of Salisbury, the dominant English use before 1549. Its Temporale numbers the Sundays after Trinity rather than after Pentecost, and its formularies do not stand in one-to-one correspondence with the Roman ones. A locus is the formulary heading with the printed column."
