description = "The first codification of Latin-church canon law, digested by order of Pius X and promulgated by Benedict XV by the apostolic constitution Providentissima Mater Ecclesia of 27 May 1917, in force from 19 May 1918 until it was replaced by the 1983 Code. Canon 2335 attached an ipso facto excommunication simply reserved to the Apostolic See to those enrolling in the Masonic sect or other associations of the same kind machinating against the Church or legitimate civil authorities."
