context = "Canon 1268 §§1–4 limits habitual reservation to one altar in a church, directs reservation to the church's preeminent and noblest place and therefore ordinarily the high altar, states the cathedral, collegiate, and conventual choral-function exception favoring another chapel or altar, and requires the reservation altar to be ornamented above the others. It controls reservation topology and relative status, not altar, tabernacle, ornament, or architectural morphology."
verified_on = "2026-07-28"
notes = "Latin wording visually checked at printed page 365. Superseded law; the 1917 Code ceased to bind when the 1983 Code took effect on 27 November 1983."
