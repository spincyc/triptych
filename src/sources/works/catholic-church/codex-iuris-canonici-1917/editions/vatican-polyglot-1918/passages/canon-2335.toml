context = "Canon 2335 as printed at page 635 of the 1918 Vatican Polyglot printing, read visually from the retained page image: 'Nomen dantes sectae massonicae aliisve eiusdem generis associationibus quae contra Ecclesiam vel legitimas civiles potestates machinantur, contrahunt ipso facto excommunicationem Sedi Apostolicae simpliciter reservatam.' The page also carries canons 2333-2334 and Gasparri's fontes footnote 4 to canon 2335, citing Clement XII, litt. ap. In eminenti, 28 apr. 1738, sec. 4; Benedictus XIV, const. Providas, 18 mart. 1751; Pius VII, const. Ecclesiam, 13 sept. 1821, sec. 11; Leo XII, const. Quo graviora, 13 mart. 1825, sec. 11; and Pius IX, ep. encycl. Qui pluribus."
