text = "§ 4. Diebus dominicis vel festis de praecepto lex abstinentiae, vel abstinentiae et ieiunii, vel ieiunii tantum cessat, excepto festo tempore Quadragesimae nec pervigilia anticipantur; item cessat Sabbato Sancto post meridiem."
