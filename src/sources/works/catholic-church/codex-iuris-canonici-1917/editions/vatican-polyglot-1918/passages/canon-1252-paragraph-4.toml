context = "Canon 1252 §4: the law of abstinence and fast ceases on Sundays and holy days of obligation (outside Lent), vigils are not anticipated, and the law ceases at noon on Holy Saturday. Printed p. 359, scan page n412. Relevant where the Christmas vigil falls on a Sunday."
