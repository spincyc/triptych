context = "Title IV, chapter 2, nn. 1-13 gives the rite for distributing Communion outside Mass and its adaptations within, immediately before, or immediately after Mass. Number 3 prints Ecce Agnus Dei and the threefold Domine, non sum dignus; number 12 directs that within Mass the minister first make the Confiteor and the priest say Misereatur vestri before distributing Communion; number 13 directs that immediately before or after a private Mass the outside-Mass manner be followed, with stated omissions."
