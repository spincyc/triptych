notes = "The passage was read in the displayed electronic resetting. Its significance for 1962 is historical and comparative: the 1962 Missal's nn. 502-503 modify how this inherited Ritual procedure applies. This passage does not itself witness the 1952 typical edition or the 1962 Missal."
