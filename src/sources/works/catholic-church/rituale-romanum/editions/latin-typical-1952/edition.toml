notes = "Catalog identity for the sixth typical edition after the 1614 princeps. The 2008 Sodi-Toniolo introduction reports the Sacred Congregation of Rites decree Cum denuo, signed by its pro-prefect on 25 January 1952, and a twelve-title architecture ending with title XII. Sodi's 2017 course notes locate title XII at pp. 847-886 and marginal item numbers 2115-2174 in the protected 2008 LEV anastatic edition. These are exact modern scholarly finding aids, not direct inspection of the complete 1952 book. No public lawful facsimile, exact internal chapter boundary, formula, wording, operational sequence, or present authorization is registered."
