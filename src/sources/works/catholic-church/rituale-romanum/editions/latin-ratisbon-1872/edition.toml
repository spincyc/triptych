notes = "The title page identifies this as the first Regensburg edition approved by the Sacred Congregation of Rites. The following diocesan approval, dated 5 May 1872, states the edition's claimed concordance with the exemplar approved under Benedict XIV in 1752 and with the latest Propaganda Fide printing, and records submission of its sheets to the Congregation's secretariat. Those statements identify this printing's represented editorial and approval state; they are not independent collation proof and do not make the edition a 1752 printing, an 1884 typical state, or evidence of universal reception."
