notes = "The editio princeps is identified from the Biblioteca Universitaria Alessandrina copy, Rome, shelfmark Y c 49, digitized at Google Books (TBNNeaiGbc0C) and independently described by USUARIUM record 1195. Bašić's exact 2014 article PDF supplies a separate secondary collation of the title transcription and terminal starting-page sequence: De exorcizandis at 198, Formulae at 220, Index at 225, and Errata at 227. These controls bound the exorcism unit to printed pp. 198-219 and show one section rather than the later title-and-chapter architecture, but they do not replace the unacquired Alessandrina page images or support internal wording, formula, typography, or procedure claims. The 2004 Sodi-Flores Arcas anastatic edition is a modern protected publication and is not a repository artifact."
