notes = "The editio princeps is identified from the Biblioteca Universitaria Alessandrina copy, Rome, shelfmark Y c 49, digitized at Google Books (TBNNeaiGbc0C) and independently described by USUARIUM record 1195. Exact remote page-image artifacts now control every printed page of the De exorcizandis unit, pp. 198-219. Bašić's exact 2014 article PDF independently collates the terminal starting-page sequence: De exorcizandis at 198, Formulae at 220, Index at 225, and Errata at 227. Together the direct opening and terminal pages and that independent boundary show one continuous section rather than the later title-and-chapter architecture. The 2004 Sodi-Flores Arcas anastatic edition is a modern protected publication and is not a repository artifact."
