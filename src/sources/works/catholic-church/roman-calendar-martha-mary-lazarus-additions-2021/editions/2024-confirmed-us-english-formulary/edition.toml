notes = "The date identifies the confirmation expressly printed in the PDF footer, not its publication or effective date. The complete one-page witness prints five Missal units for the 29 July memorial. It identifies ICEL English from The Roman Missal, copyright 2010, and Liturgical Texts for Saints Martha, Mary, and Lazarus, copyright 2023; both notices belong to the file and no per-slot copyright-year allocation is inferred. USCCB approval on 14 June 2024 is reported by passage.united-states-conference-of-catholic-bishops.divine-worship-newsletter-2024-10.2024-october-official-pdf.martha-approval-and-confirmation-report through a publisher-labelled unofficial English translation of the confirmation decree. No effective or promulgation date is established by these inspected witnesses. U.S. source identity does not establish approval for another territory. No whole-2008 identity, Common choice, body publication permission, or universal English activation is supplied."
