context = "Section V De tempore Adventus, nn. 39-42 (p. 16), complete: the season's twofold character (preparation for the solemnity of the Nativity recalling the first coming, and the directing of minds to the second coming at the end of time), hence a time of devout and joyful expectation; its limits (from I Vespers of the Sunday falling on or nearest 30 November to before I Vespers of the Nativity); the four Sundays' names; and the weekdays 17-24 December ordered more directly to preparing for the Nativity."
physical_line_ranges = [[4, 8]]
text = "V. De tempore Adventus 39. Tempus Adventus duplicem habet indolem: est enim tempus praeparationis ad sollemnia Nativitatis, in quibus primus Dei Filii adventus ad homines recolitur, ac simul tempus quo per hanc recordationem mentes diriguntur ad exspectationem secundi Christi adventus in fine temporum. His duabus rationibus, tempus Adventus se praebet ut tempus devotae ac iucundae exspectationis. 40. Tempus Adventus incipit a I Vesperis dominicae quae incidit in diem 30 novembris vel est huic vicinior, et explicit ante I Vesperas Nativitatis Domini. 41. Dominicae huius temporis nuncupantur dominicae I, II, III, IV Adventus. 42. Feriae a die 17 ad diem 24 decembris inclusive modo magis directo ad praeparationem Nativitatis Domini ordinantur."
