context = "Norms 56 f, 59-60 and the Tabula dierum liturgicorum as first printed (pp. 20-22). 56 f: days of Lent and the Easter octave, and 17-31 December, are to be kept free of particular celebrations except obligatory memorials, feasts in the table at n. 8 a-d, and solemnities that cannot be moved. Table I.2 ranks the Sundays of Advent, Lent and Easter with Christmas, Epiphany, Ascension and Pentecost, Ash Wednesday, Holy Week Monday-Thursday and the Easter octave; I.3 the solemnities of the general calendar, and in 1969 also All Souls (which yields to a Sunday); II.9 the Advent weekdays 17-24 December with the Christmas octave and Lenten weekdays; III.12 optional memorials, which may be kept even on n. 9 days in the special manner described in the Institutiones de Missa et de Officio; III.13 Advent weekdays to 16 December. 60 b: a solemnity impeded in accidental occurrence is transferred to the nearest day free of the days at nn. 1-8."
artifact_page_ranges = [[20, 22]]
verified_on = "2026-11-26"
notes = "Read on rendered page images at 100 dpi. In 2002 All Souls is no longer in row I.3, row III.12 refers to the Institutiones generales Missalis Romani et de Liturgia Horarum, and n. 60 adds a proviso referring to n. 5."
