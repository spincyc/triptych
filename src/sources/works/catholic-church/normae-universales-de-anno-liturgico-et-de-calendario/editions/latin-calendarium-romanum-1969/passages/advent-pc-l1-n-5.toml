context = "Norm 5 as first printed (p. 12): Sundays of Advent, Lent and Easter take precedence over all feasts of the Lord and all solemnities, and solemnities falling on those Sundays are anticipated on the Saturday."
physical_line_ranges = [[1, 1]]
text = "5. Propter suum peculiare momentum, dominica suam cedit celebrationem solummodo sollemnitatibus, necnon festis Domini; Dominicae vero Adventus, Quadragesimae et Paschae super omnia festa Domini et super omnes sollemnitates praecedentiam habent. Sollemnitates autem in his dominicis occurrentes, sabbato anticipantur."
