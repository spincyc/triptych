context = "Section VII De Rogationibus et Quattuor anni Temporibus, nn. 45-47 (p. 17), complete: at Rogations and Ember Days the Church prays for human needs, especially the fruits of the earth and human labour, and gives public thanks; conferences of bishops are to order their time and manner, and the competent authority sets their length and repetition; the Mass for each day is chosen from the votive Masses."
physical_line_ranges = [[9, 13]]
text = "VII. De Rogationibus et Quattuor anni Temporibus 45. In Rogationibus et Quattuor anni Temporibus, Ecclesia solet pro variis hominum necessitatibus, imprimis vero pro fructibus terrae et hominum laboribus, Dominum exorare, eique publice gratias referre. 46. Ut Rogationes et Quattuor anni Tempora diversis locorum et fidelium necessitatibus aptari possint, quoad tempus et rationem illa celebrandi a Conferentiis Episcopalibus ordinentur oportet. De eorum proinde amplitudine celebrationis, per unum vel plures dies protrahendae, de eorum iteratione per anni decursum, normae statuantur a competenti auctoritate, attentis necessitatibus localibus. 47. Missa pro singulis diebus harum celebrationum, inter votivas eligatur, quae sit magis accommodata supplicationum proposito."
