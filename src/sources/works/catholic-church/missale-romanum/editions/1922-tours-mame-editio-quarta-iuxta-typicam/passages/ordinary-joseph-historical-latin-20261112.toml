text = "VERE dignum et justum est, æquum et salutare, nos tibi semper et ubique gratias agere: Domine sancte, Pater omnipotens, æterne Deus: Et te in Festivitate (Veneratione) beati Joseph debitis magnificare præconiis, benedicere et prædicare. Qui et vir justus, a te Deiparæ Virgini Sponsus est datus: et fidelis servus ac prudens, super Familiam tuam est constitutus: ut Unigenitum tuum, Sancti Spiritus obumbratione conceptum, paterna vice custodiret, Jesum Christum Dominum nostrum. Per quem majestatem tuam laudant Angeli, adorant Dominationes, tremunt Potestates. Cæli cælorumque Virtutes, ac beata Seraphim, socia exsultatione concelebrant. Cum quibus et nostras voces ut admitti jubeas deprecamur, supplici confessione dicentes:"
