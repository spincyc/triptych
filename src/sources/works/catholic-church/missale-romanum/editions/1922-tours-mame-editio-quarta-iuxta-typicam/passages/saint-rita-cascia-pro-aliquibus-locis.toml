context = "The Missae pro aliquibus locis appendix prints a complete Mass for Saint Rita of Cascia, Widow, dated 22 May. Printed appendix p. [79] gives the heading and opening proper, p. [80] carries the Collect and readings, and p. [81] carries the Secret and Postcommunion. This positive appendix finding coexists with her bounded absence from the universal sanctoral. It is a public-domain historical antecedent witness only and does not establish identity with the corresponding orations of the 2002 third typical edition."
