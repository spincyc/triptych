notes = "Mame 1922 printed 276, original PDF 390, right column, complete offering of the host before the following action rubric; source and target actual 200 and 400 dpi page images checked 2026-11-12. passage.catholic-church.missale-romanum.1922-tours-mame-editio-quarta-iuxta-typicam.ordinary-eight-exact-latin-20261112-suscipe-sancte-pater. The source rubric assigns the prayer to the priest; no P. marker is printed or supplied. ANTECEDENT WORDING, COLLATED WORD-EXACT. Complete Mame 1922 Latin, printed 276, original PDF 390, right column, complete offering of the host before the following action rubric; checked word by word against the complete 1962 target at n. 1030, printed 220/PDF 301 on actual 200 and 400 dpi page images. The selected Cummiskey Latin omits et before offensionibus; Mame prints it. Mame negligentiis and target neglegentiis are received spelling variants. Differences otherwise are the declared ligature, accent, j/i, capitalization, punctuation and cross/cue transformations only. This selects a separate historical witness; the Cummiskey artifact and its prior finding remain immutable. Current English is retained with its own existing qualification."
text = "Suscipe, sancte Pater, omnipotens aeterne Deus, hanc immaculatam hostiam, quam ego indignus famulus tuus offero tibi Deo meo vivo, et vero, pro innumerabilibus peccatis, et offensionibus, et negligentiis meis, et pro omnibus circumstantibus, sed et pro omnibus fidelibus christianis vivis atque defunctis: ut mihi et illis proficiat ad salutem in vitam aeternam. Amen."
