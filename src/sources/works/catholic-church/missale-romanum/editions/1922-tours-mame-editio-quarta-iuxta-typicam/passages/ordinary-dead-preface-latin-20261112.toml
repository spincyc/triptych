text = "VERE dignum et justum est, æquum et salutare, nos tibi semper et ubique gratias agere: Domine sancte, Pater omnipotens, æterne Deus: per Christum Dominum nostrum. In quo nobis spes beatæ resurrectionis effulsit, ut quos contristat certa moriendi conditio, eosdem consoletur futuræ immortalitatis promissio. Tuis enim fidelibus, Domine, vita mutatur, non tollitur, et, dissoluta terrestris hujus incolatus domo, æterna in cælis habitatio comparatur. Et ideo cum Angelis et Archangelis, cum Thronis et Dominationibus, cumque omni militia cælestis exercitus, hymnum gloriæ tuæ canimus, sine fine dicentes:"
