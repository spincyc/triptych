text = "In illo tempore: Videns Jesus turbas, ascendit in montem, et cum sedisset, accesserunt ad eum discipuli ejus, et aperiens os suum, docebat eos, dicens: Beati pauperes spiritu: quoniam ipsorum est regnum caelorum. Beati mites: quoniam ipsi possidebunt terram. Beati qui lugent: quoniam ipsi consolabuntur. Beati qui esuriunt et sitiunt justitiam: quoniam ipsi saturabuntur. Beati misericordes: quoniam ipsi misericordiam consequentur. Beati mundo corde: quoniam ipsi Deum videbunt. Beati pacifici: quoniam filii Dei vocabuntur. Beati qui persecutionem patiuntur propter justitiam: quoniam ipsorum est regnum caelorum. Beati estis cum maledixerint vobis, et persecuti vos fuerint, et dixerint omne malum adversum vos, mentientes, propter me: gaudete et exsultate, quoniam merces vestra copiosa est in caelis."
