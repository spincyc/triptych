notes = "Mame 1922 printed 272, original PDF 386, left column, priest confession before Ministri respondent; source and target actual 200 and 400 dpi page images checked 2026-11-12. passage.catholic-church.missale-romanum.1922-tours-mame-editio-quarta-iuxta-typicam.ordinary-eight-exact-latin-20261112-confiteor-sacerdotis. The source rubric assigns the prayer to the priest; no P. marker is printed or supplied. The source actor context begins with Sacerdos on PDF 385, continues through Sacerdos repetit Antiphonam, and leads to the confession on PDF 386 before the explicitly distinct ministers response. ANTECEDENT WORDING, COLLATED WORD-EXACT. Complete Mame 1922 Latin, printed 272, original PDF 386, left column, priest confession before Ministri respondent; checked word by word against the complete 1962 target at n. 1017, printed 216/PDF 297 on actual 200 and 400 dpi page images. The selected Cummiskey Latin abbreviates the priest confession with &c.; Mame prints the whole confession. Differences otherwise are the declared ligature, accent, j/i, capitalization, punctuation and cross/cue transformations only. This selects a separate historical witness; the Cummiskey artifact and its prior finding remain immutable. Current English is retained with its own existing qualification."
text = "Confiteor Deo omnipotenti, beatae Mariae semper Virgini, beato Michaeli Archangelo, beato Joanni Baptistae, sanctis Apostolis Petro et Paulo, omnibus Sanctis, et vobis, fratres: quia peccavi nimis cogitatione, verbo et opere: mea culpa, mea culpa, mea maxima culpa. Ideo precor beatam Mariam semper Virginem, beatum Michaelem Archangelum, beatum Joannem Baptistam, sanctos Apostolos Petrum et Paulum, omnes Sanctos, et vos, fratres, orare pro me ad Dominum Deum nostrum."
