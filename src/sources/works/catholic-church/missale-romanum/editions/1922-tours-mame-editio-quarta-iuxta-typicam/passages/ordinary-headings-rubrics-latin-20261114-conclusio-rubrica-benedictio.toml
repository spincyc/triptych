notes = "Class B: the Missal's own rubric at this place; the 1861 English beside it is the lay book's paraphrase, not a translation of it. Words agree under the declared capitalization, j/i, ligature, accent and pointing transformations only. First rubric span only, cut at the colon before Benedicat vos omnipotens Deus. The second span ('Et versus ad populum, semel tantum benedicens, etiam in Missis solemnibus, prosequitur:', 1962 printed p. 326) is NOT carried: Mame's printing of its first word reads 'emel' on the page image at 200 and 400 dpi, the 1862 Pustet leaf for printed p. 267 is missing from the registered scan (PDF p. 353 is a 14 x 23 pt stub), and no word is supplied from memory. The blessing formula is held on the following element."
