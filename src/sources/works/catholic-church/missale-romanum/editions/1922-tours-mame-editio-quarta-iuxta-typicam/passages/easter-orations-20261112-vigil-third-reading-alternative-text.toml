notes = "Old full scalarSHA256 a601e55a3d62378a4bc74e8eebcabac59606f86d20251e3e9ae01aa7e449fd0c. Controlling complete page passage.catholic-church.missale-romanum.1922-tours-mame-editio-quarta-iuxta-typicam.easter-orations-20261112-vigil-third-reading-alternative-page. One complete1922 Pentecost-vigil prayer contains the full RedSea/font and freed-people/Christian-mysteries comparison plus the whole faith-and-Spirit petition. Its old Pentecost placement differs from the modern EasterVigil alternative. Removing only the adjective Egyptian leaves the separately named RedSea context and all theological clauses intact; moving liberata does not add a clause. Each exact change requires finite review of the whole received expression."
