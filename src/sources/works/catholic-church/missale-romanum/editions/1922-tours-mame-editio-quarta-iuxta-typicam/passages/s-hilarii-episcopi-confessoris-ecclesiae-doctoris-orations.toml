context = "The Secret of s-hilarii-episcopi-confessoris-ecclesiae-doctoris as the 1922 Tours Mame prints it, cited as the public-domain antecedent showing that the 1962 typical edition's wording is preexisting material under 17 U.S.C. 103(b). The 1862 Pustet does not carry these words: its own Hilary Secret (printed p. 380) reads Sancti tui Hilarii nobis, without Pontificis tui atque Doctoris, and its Common for a Confessor-Doctor reads Confessoris where the 1962 reads Pontificis."
