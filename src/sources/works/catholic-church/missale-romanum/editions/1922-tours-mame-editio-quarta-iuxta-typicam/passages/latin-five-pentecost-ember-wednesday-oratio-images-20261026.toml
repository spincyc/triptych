notes = "Full original source page, uncropped, with every original image stream and source mark preserved. Independently read at 200 and 400 dpi. Stress accents, ae ligatures, decorative capitalization and printed line wraps normalized as declared. 1962 Iesum/eiusdem versus calendar Jesum/ejusdem are declared consonantal-i normalization. Mame prints Per Dominum... in unitate ejusdem.1962 gives the longer prefix through ejusdem. SourcePDF368 prints the intervening Per Dominum nostrum Jesum Christum Filium tuum: Qui tecum vivit et regnat in unitate; sourcePDF54 and this prayer's own ejusdem cue specify the Holy-Spirit conclusion. Carry only target's actual printed length; no Spiritus Sancti Deus or per omnia is appended. Apply target's comma after Christum; no petition word changes. Complete petition has no substantive word difference. Historical actual short conclusion remains in the separate historical artifact. This row supplies only the normal additional Oratio; no first Collect, Oratio super populum, adjacent Lesson or chant is imported."
