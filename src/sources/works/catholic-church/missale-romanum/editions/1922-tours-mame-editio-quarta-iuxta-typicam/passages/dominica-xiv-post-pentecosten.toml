context = "The complete Fourteenth Sunday after Pentecost formulary begins in the right column of printed p. 444, continues across p. 445, and ends in the upper half of p. 446. All ten appointed elements appear in the same order and at the same scriptural references as in the 1962 typical edition. The Communion already has the liturgical recasting Primum quaerite regnum Dei, et omnia adjicientur vobis, dicit Dominus: it promotes Primum, omits et justitiam ejus, and adds dicit Dominus."
verified_on = "2026-09-03"
notes = "The whole 1,162-page PDF was fetched again on 2026-09-03 and matched the registered 51,720,493-byte SHA-256 before PDF artifact pp. 558-560 were rendered and read. Page-image collation found the received bodies of all ten elements already present in this public-domain edition. The 1922 Gospel retains caelestis after Pater vester, which the 1962 edition omits; an omission reproduces no later-added wording. Mame uses its period's i/j orthography and abbreviates the Collect, Secret, and Postcommunion conclusions as Per Dominum.; the 1962 edition retains that form for the Collect and Secret and prints Per Dominum nostrum. for the Postcommunion. Those apparatus, orthographic, punctuation, rank, and optional-seasonal-oration differences are recorded rather than blended into the 1962 transcription."
