notes = "Mame 1922 printed 278, original PDF 392, left column, complete Ne perdas Psalm verse, before In quorum manibus; source and target actual 200 and 400 dpi page images checked 2026-11-12. passage.catholic-church.missale-romanum.1922-tours-mame-editio-quarta-iuxta-typicam.ordinary-eight-exact-latin-20261112-ne-perdas-cum-impiis. The source rubric assigns the prayer to the priest; no P. marker is printed or supplied. The source actor is expressly Sacerdos at the Lavabo introduction on PDF 391; PDF 392 continues that same Psalm across the page break. ANTECEDENT WORDING, COLLATED WORD-EXACT. Complete Mame 1922 Latin, printed 278, original PDF 392, left column, complete Ne perdas Psalm verse, before In quorum manibus; checked word by word against the complete 1962 target at n. 1039, printed 221/PDF 302 on actual 200 and 400 dpi page images. The selected Cummiskey Latin omits Deus; Mame prints it. The verse ends with the source colon and is not expanded to the whole Psalm. Differences otherwise are the declared ligature, accent, j/i, capitalization, punctuation and cross/cue transformations only. This selects a separate historical witness; the Cummiskey artifact and its prior finding remain immutable. Current English is retained with its own existing qualification."
