notes = "Read on page images rendered from the exact identified Internet Archive scan of the 1922 Mame, whose artifact record states a public-domain rights status on a book first published at Tours in 1922. That artifact is registered as remote and the repository holds no payload; it was fetched once against its registered hash for this collation. Internet Archive viewer leaf n maps to artifact page n+1 at every checked locus. Correction 2026-10-12: the former Secret locator printed 726/PDF 840 was erroneous (that page is St Jerome); the Secret is printed in full under St Luke on printed 739/PDF 853. Collect remains 738/PDF 852 and Postcommunion 739/PDF 853. Original verification was dated 2026-09-03; present correction follows fresh normal/enlarged image collation against 1962 nos. 3883, 3889, 3891. The uses query before this correction returned no bound publications."
