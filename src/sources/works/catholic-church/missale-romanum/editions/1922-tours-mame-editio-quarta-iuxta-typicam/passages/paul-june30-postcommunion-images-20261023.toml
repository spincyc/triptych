notes = "Every complete primary June30 Perceptis petition word agrees in target, Pustet and Mame. This is not the February22 Sanctificati prayer. Pustet has a comma after sacramentis rather than target colon, colon after deprecamur rather than target semicolon, and lacks target comma after ut. Mame agrees in target petition pointing. Pustet actually ends Per Dominum.; Mame prints Per followed by its visibly contracted Dnum/Dñum form, not an editorially expanded Dominum. The1962 Paul paragraph has no conclusion or cue and ends medelam.; the separately headed Pro S.Petro Postcommunio2936 owns the following ending. No Peter ending or old cue is copied into this body. MamePC is on printed642 beneath the July1 running header but above the June30 ProS.Petro/Octave closures and FestaJulii divider; the continuous preceding June30 pages establish ownership."
