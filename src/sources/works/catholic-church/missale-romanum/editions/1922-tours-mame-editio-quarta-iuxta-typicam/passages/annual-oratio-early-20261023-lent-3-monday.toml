notes = "Historical and target complete prayers were checked on page images at 200 dpi and 400 dpi. The target expands the same Father-through-Son conclusion through in unitate; the Mame prayer prints only Per Dominum nostrum. The complete old Pustet formula supplies the contiguous conclusion prefix, with Jesum/Iesum spelling and the comma after Christum projected to the target. The target stops before Spiritus sancti Deus or ejusdem, per omnia or Amen. Same-address old formula control passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-father-through-son; historical formula instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17, passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. The old Praesta exemplar contains ejusdem only after the contiguous prefix used here; no target is changed to add or remove that word."
