title = "Missale Romanum, Tours: Alfred Mame, 1922, editio quarta iuxta typicam Vaticanam"
language = "la"
publication = "Missale Romanum ex decreto sacrosancti Concilii Tridentini restitutum, S. Pii V Pontificis Maximi jussu editum, aliorum Pontificum cura recognitum, a Pio X reformatum et Benedicti XV auctoritate vulgatum. Editio quarta juxta typicam Vaticanam. Turonibus: Sumptibus et typis Alfred Mame et Filiorum, 1922. Internet Archive item missaleromanum0000unse."
date = "1922"
authority = "Licensed commercial printing conformed to the Vatican typical edition, not a typical edition and not a new promulgating station. The approval leaf states that the Missal was examined against the Vatican edition and the decrees of 24 October 1920 and 26 October 1921, and Albertus Negre, Archbishop of Tours, approved it at Tours on 17 May 1922."
jurisdiction = "Roman Rite"
notes = "This record names the exact Mame printing whose title and approval leaves were read, not the abstract Vatican typical edition of 1920. It must remain separate from edition.catholic-church.missale-romanum.vatican-typica-1920, whose remote artifact is a later composite printing, and from edition.catholic-church.missale-romanum.unidentified-pre-1955-witness-ia-1947, a different Benziger conformed printing. Internet Archive viewer leaf n12 is PDF artifact page 13 and carries the title and 1922 Tours imprint; PDF artifact page 15 carries the local approval and conformity declaration. The full scan was fetched and hashed before any locus was used. The historical Bede and Rita records below are antecedent witnesses only: no comparison with the restricted 2002 third typical edition was made, and no historical prayer text was imported into the postconciliar calendar."
