notes = "Mame prints conditione and Per Dominum.; the target prints condicione and Per Dominum nostrum. The sixteen petition words agree under that received spelling; the historical two-word conclusion cue and target three-word conclusion remain distinct. Both images read clementia; the legacy dementia is a transcription error, not a declared spelling normalization. The source is a Tours 1922 conformed printing, not an authenticated Vatican 1920 impression. Only the September Ember Wednesday Collect petition is corrected. The preceding Kyrie, Oremus, Flectamus genua and Levate context is outside this body; no actor, frame or new appointment is inferred. Secret, Postcommunion and the separately owned Oratio 1616 are not newly verified here."
