rights_basis = "Twelve bounded historical Latin bodies read directly in the already registered public-domain Tours Mame 1922 printing. The parent artifact records the existing United States publication-date and mechanical-reproduction basis. This derivative retains source words, accents, ligatures, pointing, chant marks and abbreviated conclusions. It makes no new rights determination or target-edition clearance."
provenance = "Actual 200 and 400 dpi page-image readings on 2026-10-20 of the exact held Mame PDF SHA256 9873693a2937c6a573ed050351b30c545b7464b87b06390785e504fb0aac7005. Mame November 2 artifact p. 864 / printed p. 750 refers to the three All Souls Masses at artifact pp. 1002-1006 / printed pp. 124*-128*. The opening 124* numeral is suppressed and established by the referral and following 125*. First form: Collect p. 1002; Tract and Sequence pp. 1003-1004; Offertory and Secret p. 1004; Postcommunion p. 1005. Second form proper orations p. 1005 override its Anniversary referral, whose Tract and Offertory were independently checked at pp. 1010-1011 / printed pp. 132*-133*. Third form proper orations pp. 1005-1006 override its daily Requiem referral, whose Tract and Offertory were independently checked at pp. 1012-1013 / printed pp. 134*-135*."
