transformation = "Select the twelve unique source bodies in source order: first Collect, Tract, Sequence, Offertory, Secret, Postcommunion; second Collect, Secret, Postcommunion; third Collect, Secret, Postcommunion. Join line wraps and divided words, restore ornamental initials, normalize spacing, represent incipit small capitals as uppercase, and rewrap project physical lines. Preserve Sequence verse and stanza order, source accents and ligatures, sepulchra, consonantal j, pointing, two Tract verse glyphs as ℣., Offertory asterisk and verse glyph as ℣., its full written-out Quam olim repeat, closing Sequence Amen, and every original short prayer conclusion. No referred chant is editorially repeated in this source artifact; no new word, actor or Ordinary body is supplied."
notes = "The exact source referral routes are metadata, not body words. Second form takes non-oration bodies from the Anniversary; third takes them from the daily Mass, with proper orations expressly substituted in both forms and a separate Dies irae reference for the third. The complete first-form Sequence supplies the lawful historical body; the clipped edge of the Anniversary Sequence is not silently reconstructed. Mame proper third-form prayers already have the general faithful-departed petitions. Different 1920 composite-source variant notes do not describe Mame. Excludes ritual directions, headings, Scripture readings, Introit, Gradual, Communion and Preface."
