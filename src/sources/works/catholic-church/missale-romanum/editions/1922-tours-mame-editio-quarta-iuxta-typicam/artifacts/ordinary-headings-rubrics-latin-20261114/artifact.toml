transformation = "Transcribe each selected heading or rubric exactly as Mame prints it: source letters, j, the ae/oe ligatures, stress accents, capitals and pointing retained; physical line wraps and line-end division hyphens joined; the typesetter's space before a colon closed up; small-capital incipits and decorative initials written in normal capitals. A row is a contiguous printed span cut only at a division the page prints (a period, a colon before spoken text, a heading line). No word is supplied, repaired or expanded."
notes = "One header and one row per printed span; element_key is <section>-<element> of src/sources/inventories/roman-1962-ordo-missae-v1.toml, which joins each row as the Latin of an 1861 element whose own book prints no Latin there. Classes recorded in the inventory: a direct counterpart (the 1861 English renders this Latin) or the Missal's rubric at that place (the 1861 English is the lay book's own paraphrase). Each row is word-exact with the 1962 typical edition under the declared transformations; per-row passages record the comparison."
