rights_basis = "Only Latin already printed in the 1922 Tours Mame missal is transcribed: the Missal's own headings and rubrics of the Ordo Missae and Canon at the places the 1962 Ordinary frame names. The registered whole source records its United States publication-date basis (published 1922). Faithful transcription adds no exclusive right in these words and is excluded from Triptych CC BY 4.0. No word of the 1962 typical edition is taken from that book: every row is word-exact in this 1922 printing."
rights_jurisdiction = "United States"
provenance = "Complete registered Mame PDF rehashed to 9873693a2937c6a573ed050351b30c545b7464b87b06390785e504fb0aac7005 on 2026-11-14 before reading. Every row was read on page images rendered at 200 dpi from original PDF pp. 385-392, 454-458, 463-466 and 469, with doubtful letters re-read at 400 dpi (PDF pp. 388, 465, 469), and compared word for word with the 1962 typical edition on its own page images (registered CMAA facsimile 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a, PDF pp. 297-303, 380-391, 398-407) at 200 dpi, the small-print rubrics again at 400 dpi. Research lead: gap-campaign ord-ordinary lane, 2026-11-14; its transcriptions were leads only and were re-read here. No OCR text is authority."
