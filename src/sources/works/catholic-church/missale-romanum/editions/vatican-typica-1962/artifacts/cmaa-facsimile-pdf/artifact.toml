rights_basis = "The facsimile is publicly downloadable, but the audit located no artifact-level statement establishing redistribution rights for this exact scanned and OCR-bearing PDF. The age and status of the underlying liturgical book do not by themselves establish rights in this digitization, so Triptych records the exact remote bytes and retains no payload. Reopened 2026-08-01 on a report that this scan carries a CC BY-NC-ND 3.0 licence; the report is half right and the half that is wrong matters. The licence is real but it is uploader-applied metadata on an Internet Archive re-upload, not a grant by CMAA or by the rights holder, and it does not travel with the bytes: the same file is on Internet Archive TWICE under contradictory terms. Item `missale_romanum-1962` (uploaded 2017-01-17 by m.kusnjacic@gmail.com) tags CC BY-NC-ND 3.0; item `missale62` (uploaded 2025-06-24 by pperrettis06@gmail.com) carries no licence tag at all. Both hold sha1 255d3aef352b74f77f230601115af8e57328a4e8 at 82,815,941 bytes, which is the byte length CMAA itself still serves at the recorded source_url, so all three are one file. Neither uploader is CMAA. CMAA publishes no notice of its own: the PDF sits in an open directory index and both /copyright/ and /terms/ answer 404. A tag two strangers set differently on identical bytes is not evidence of anything, and it is not adopted here in either direction."
source_url = "https://media.churchmusicassociation.org/pdf/missale62.pdf"
provenance = "Church Music Association of America-hosted 1,088-page facsimile of the 1962 Vatican editio typica. PDF metadata identifies the title as 'Missale Romanum 1962' and ABBYY FineReader as the 2007 image and OCR producer; that producer date describes the digitization, not the edition."
