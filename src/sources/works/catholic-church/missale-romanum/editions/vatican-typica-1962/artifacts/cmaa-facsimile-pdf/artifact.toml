notes = "Exact remote facsimile record only; no PDF payload is installed. Existing 1962-Missal research uses the page images as its controlling textual witness, but that research role does not collapse this artifact into the separate Benziger edition or create a publication binding. Why the status stays `unresolved` rather than moving either way. It does not become `licensed`, because adopting the CC tag would mean accepting a stranger's assertion as a grant, and the contradicting upload of the same bytes shows what that assertion is worth. It does not become `public-domain`, because the 1962 typical edition's own status is a separate question this record has never answered and does not answer now: the scan's rights and the book's rights are two things, and a digitization can be free while the book is not, or the reverse. `unresolved` also keeps the guard that matters, since TRACKABLE_RIGHTS excludes it and nothing may install the payload. What the reopening settles is narrower and worth stating: even reading the CC tag at face value, NC and ND govern copying, distribution and adaptation, and this repository does none of the three to the scan. It stores a hash, retains no bytes, publishes no page image, and the English it collates comes from the 1861 Cummiskey rather than from these images. The unanswered question is therefore not the scan's licence at all but the underlying edition's status, which is where TASK-114 should continue."
