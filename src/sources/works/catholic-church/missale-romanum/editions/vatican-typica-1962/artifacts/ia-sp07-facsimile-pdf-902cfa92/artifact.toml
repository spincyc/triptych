notes = "Extent as the retrieving lane measured it: Complete Missale Romanum 1962 editio typica, 1,088 PDF pages, with a text layer; read as text in the front matter De anno et eius partibus and at the Dominica XIV formulary. Whole volume. This is a second digitisation of the same edition the leaf's own text control uses and is NOT offered as an independent collation witness. The lane states expressly that this is a second digitisation of the same edition the document's own text control already uses and is NOT offered as an independent collation witness; a claim that cites both as two witnesses would be counting one book twice."
