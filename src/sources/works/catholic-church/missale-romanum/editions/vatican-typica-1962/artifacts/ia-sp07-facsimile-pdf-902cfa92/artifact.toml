rights_basis = "Rights are settled for this edition, and settled as unresolved, at src/sources/inventories/missale-romanum-1962-facsimile-rights-v1.toml. Read it before restating anything here. Its holding is that the underlying 1962 typical edition is probably restored under 17 U.S.C. 104A to the end of 2057, that no uploader's licence tag on a scan of it is a grant by anyone entitled to make one, and that publication of preexisting material rests on 17 U.S.C. 103(b) together with the tracked public-domain 1920, 1862, 1604 and 1570 typical editions rather than on this edition's age or on any scan of it. This is a second digitisation of the same book as the artifact already registered here from the Church Music Association of America, and it inherits the same answer. A reader with no network opens the tracked public-domain witnesses named in that record; what is not reopenable offline is the 1962 book's own new matter, and that limitation is the record's, not this artifact's, to lift. Its 51.17 MB size is a second and independent reason."
