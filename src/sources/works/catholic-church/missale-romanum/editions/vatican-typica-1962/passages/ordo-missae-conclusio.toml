context = "The conclusion was read at the page images: Ite missa est with Benedicamus Domino where a liturgical procession follows and Requiescant in pace in Requiem Masses (1132-1136), Placeat tibi sancta Trinitas (1137), the blessing Benedicat vos omnipotens Deus (1138), and Initium sancti Evangelii secundum Ioannem with John 1, 1-14 and the response Deo gratias (1139). The rubric before the Placeat records that where Benedicamus Domino or Requiescant in pace has been said no blessing is given, and that after the Placeat and the kissing of the altar the celebrant reads the Gospel of Saint John if it is to be said."
verified_on = "2026-07-26"
notes = "Read visually. Marginal number 1139 is the last of the Ordo Missae; the next numbered item, 1140, is the introit of Easter Sunday on the following opening, so the Ordo as printed ends with the last Gospel and contains no prayers after Mass."
