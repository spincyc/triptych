notes = "Read on page images rendered from the exact identified CMAA facsimile, not through its embedded text layer, which drops ornamental initials and misreads marginal numbers. An independent machine reading of the Benziger 1962 conformed printing was taken alongside; where the two parted the page image settled it, and the page image agreed with the facsimile's own layer in every recorded case. Publication rights come from a separately registered public-domain witness and from 17 U.S.C. 103(b); see src/sources/inventories/missale-romanum-1962-facsimile-rights-v1.toml. The Secret and Postcommunion loci were added on 2026-10-01, read on the page image at 200 and 400 dpi; the page prints all three orations under the directive Missa Dilexisti, de Communi Virginum III loco [32], cum orationibus ut infra."
