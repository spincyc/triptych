context = "The proper rubric permits two festive Masses of the Seven Sorrows where the specified devotions in honor of the Sorrowful Mother are held that day. It does not designate a class of votive Mass, expressly address an occurring first- or second-class feast, or appoint the displaced feria's Mass in place of a higher-ranked Office winner. RGMR 270 gives the ordinary concordance with the Office; RGMR 301-306 distinguishes festive Masses from votive Masses and states the ordinary limits on festive Masses of a commemoration. The proper permission exceeds the ordinary fourth-class limitation in the normal third-class Passion-Friday setting. The repository's existing feria-versus-Seven-Sorrows choice is therefore confined to that established ferial-winner setting. Its application when a higher-ranked feast wins has not been established here; this evidence boundary is not a claim that the special festive permission is universally forbidden in every such collision. The certain Office Mass remains distinct from any additional conditional permission."
verified_on = "2026-11-12"
notes = "Independent source review rehashed the exact registered PDF, rendered artifact pages 19, 21 and 580, and read the governing passages directly in the resulting page images. Metadata only: no Latin rubric or image payload is reproduced. Local devotions, the use of either permitted celebration, a particular calendar, and a competent dated Ordo are not inferred."
