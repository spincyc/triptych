locus = "Litany of the Saints, first part at printed pp. 198-199, no. 991; artifact PDF pp. 279-280. The part ends where the rubric at no. 18 says it does, usque ad invocationem Propitius esto: its last invocation is Omnes Sancti et Sanctae Dei, intercedite pro nobis, and printed p. 200 begins DE BENEDICTIONE AQUAE BAPTISMALIS. (Both earlier lanes gave the range as printed pp. 198-205; that is wrong - 200 onward is the blessing of the font.); Litany of the Saints, second part at printed pp. 210-211, no. 1000; artifact PDF pp. 291-292. The rubric that introduces it, DE ALTERA PARTE LITANIARUM no. 27, stands on printed p. 209 (PDF p. 290), but no invocation does; the part itself begins at no. 1000 on printed p. 210 and ends with Christe, exaudi nos on printed p. 211, immediately before the heading TEMPUS PASCHATIS. The Kyrie that follows belongs to the Mass, not to the litany (rubric 1 on printed p. 211)."
