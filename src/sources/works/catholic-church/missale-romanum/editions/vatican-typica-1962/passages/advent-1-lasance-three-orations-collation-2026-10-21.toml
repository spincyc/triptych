notes = "Frozen proof sha256 f500b33a8c0ec2a5847349041ade7897c2938f6e843db40f1e095004fdb11755. Collect: marginal2, PDF82; petition token identity confirmed, source/target conclusion lengths differ. Identical Latin petition words after accents/ligatures/case normalization. Lasance has no commas after Excita/quaesumus/Domine, and a full stop before Qui vivis.; target adds those commas and a colon before the printed fuller conclusion. Lasance English and its paired Latin both print only the abbreviated ending Who livest./Qui vivis. No ending expansion supplied. Secret: marginal8, PDF83; petition token identity confirmed, source/target conclusion lengths differ. Identical Latin petition words. Lasance omits commas around Domine; target prints them. Lasance paired Latin ends Per Dominum.; target prints the fuller conclusion. Exact English remains Through our Lord. Postcommunion: marginal10, PDF83; petition token identity confirmed, source/target conclusion lengths differ. Identical Latin petition words after case/accents/ligatures. Lasance omits commas around Domine; target has them. Lasance Latin ends Per Dominum.; target prints Per Dominum nostrum. English remains exactly Through our Lord. Physical bilingual columns reverse here: English L, paired Latin R."
