context = "The Kyrie (1024) and Gloria in excelsis (1025) were read at the page images. The Kyrie is printed as nine invocations in three groups with alternation between priest and ministers; the Gloria is given first as notated chant incipits for Masses I, IV, IX, XI, XII and XV under rubrics naming the classes of feast, and then in full text. The accompanying rubric prescribes the inclinations at Adoramus te, Gratias agimus tibi, Iesu Christe and Suscipe deprecationem, and the sign of the cross at Cum Sancto Spiritu."
