context = "The bishop's prayers when celebrating in pontificals give separate headings and prayers for putting on the tunicle and the dalmatic, followed by separate headings for the gloves and chasuble. Together with General Rubrics n. 134, this confirms that the pontifical tunicle and dalmatic are distinct vesting actions and objects in the bishop's layered Mass vesture. The prayers do not establish garment morphology."
