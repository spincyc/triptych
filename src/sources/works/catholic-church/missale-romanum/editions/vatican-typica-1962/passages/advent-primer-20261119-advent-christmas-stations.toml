notes = "Stations (place facts): Advent I, the Vigil and the Mass in the day at S. Maria Maggiore; the Mass at night at S. Maria Maggiore ad Praesepe; the Mass at dawn at S. Anastasia. Against the public-domain 1862 Pustet witness (passages advent-primer-20261119-advent-christmas-stations and advent-primer-20261119-christmas-stations of edition pustet-ratisbon-1862): 1962 spells maiorem with i where 1862 has Majorem, abbreviates S. where 1862 writes sanctam for the night and dawn Masses, prints primam, secundam and tertiam in the three Christmas Mass titles in lower case where 1862 capitalizes them, and heads the Vigil In vigilia where 1862 has In Vigilia. The Vigil is headed Die 24 decembris and ranked I classis. Read on page images at 150 and 250 dpi on 2026-11-19."
