locus = "Collect at printed p. 722, no. 4131; artifact PDF p. 803, foot of the left column (lines 37-40) running into the head of the right column (lines 1-4 plus one further printed line the text layer omits entirely). Under the heading Oratio, beneath the day heading at left column lines 29-35: Die 21 novembris / In Praesentatione beatae Mariae Virginis / III classis, and the rubric Missa Salve, de Communi festorum B. Mariae Virg. [41], praeter orationem sequentem; et non dicitur Credo - SINGULAR, so the 1962 too makes only this oration proper to the day. Printed folio 722 and the marginal number 4131 both read off the page image; pdf page = printed page + 81.; Secret at printed p. 722, no. 4132; artifact PDF p. 803, right column lines 6-12, under the heading Secreta at line 5 (which carries a marginal capital C - see notes)."
