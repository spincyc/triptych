context = "Complete target Collect independently checked on 200/400 dpi images on 2026-10-21. Mame prints conditione and Per Dominum.; the target prints condicione and Per Dominum nostrum. The sixteen petition words agree under that received spelling; the historical two-word conclusion cue and target three-word conclusion remain distinct. Both images read clementia; the legacy dementia is a transcription error, not a declared spelling normalization."
notes = "Diplomatic joined target: Misericórdiæ tuæ remédiis, quǽsumus, Dómine, fragílitas nostra subsístat: ut, quæ sua condicióne attéritur, tua cleméntia reparétur. Per Dóminum nostrum. The projection expands the actual target ae ligatures and strips stress marks; it does not claim expanded ae as diplomatic print. Corrected projection SHA256 with LF 7124589a58d990e82bde57e5490109b76db17d82ab7d9af302f13b94d51f8793. This record supersedes the old broad target claim only for Collect 1613 and supplies no publication rights. Only the September Ember Wednesday Collect petition is corrected. The preceding Kyrie, Oremus, Flectamus genua and Levate context is outside this body; no actor, frame or new appointment is inferred. Secret, Postcommunion and the separately owned Oratio 1616 are not newly verified here."
