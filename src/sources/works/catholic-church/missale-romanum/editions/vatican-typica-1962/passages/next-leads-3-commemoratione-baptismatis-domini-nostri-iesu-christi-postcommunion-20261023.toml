notes = "Complete target independently read on2026-10-23 at200 and400dpi. No target page image is redistributed. The complete Pustet1862 counterpart is the Postcommunion of In Octava Epiphaniae, whose prayer finishes on originalPDF123/printed37 before the DominicaII heading; this is not relabeled as the1962 feast name. Both complete images clearly print praeveni, with an ae ligature. Pustet prints Coelesti where1962 prints Caelesti; this actual coe/cae spelling variant is explicitly preserved in the historical transcription and target projection respectively. Pustet omits the target comma after quaesumus. Every remaining complete petition word agrees under the established calendar consonantal-j convention (cujus/cuius); no grammatical repair is inferred. Both witnesses actually print only Per Dominum."
