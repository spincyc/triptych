context = "Read at the artifact's embedded text layer. Urban VIII, following Pius V and Clement VIII, ordered the Missal examined again and corrected: the rubrics which had gradually degenerated from ancient use and rite were restored to their former state (rubricae, quae sensim ab usu rituque veteri degeneraverant, in pristinum restitutae) and those less suited to readers' understanding were more clearly explained; the whole was collated with the Vulgate. Dated Rome at St Mary Major, 2 September 1634, in the twelfth year of his pontificate."
