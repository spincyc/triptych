notes = "Read directly on 300 dpi and 400 dpi page images rendered from the SHA-256-verified remote CMAA 1962 facsimile PDF (82,815,941 bytes; storage = remote, rights_status = unresolved); no PDF or PNG bytes are retained. Opening block on printed p. 1 (PDF p. 82): PROPRIUM DE TEMPORE / TEMPUS ADVENTUS / DOMINICA PRIMA ADVENTUS (spelled out PRIMA, not Roman numeral I) / I classis / Statio ad S. Mariam maiorem; running head on printed p. 2 (PDF p. 83): 2 / Dominica prima Adventus. Corroborated word-for-word against two tracked pre-1931 public-domain Missals — Tournai Desclee 1889 (artifact ia-djvu-ocr-715f57fd, lines 10746-10995) and Pustet Ratisbon 1862 (artifact missale-romanum-1862-text-f34bc7cf, printed pp. 1-3, lines 13185-13470, noting its Introit OCR dropout of three words after the ornamental initial and Communion reference misprint Ps. 81.) — and Clementine Vulgate (edition ebible-latvuc), with zero lexical variants across units 1, 4, 5, 6, 7, and 9 after declared orthography, accentuation, ligature, and pointing normalization. Confirmed 1962 image details: unit 1 (Introit, Ant. ad Introitum, Ps. 24, 1-3 and Ps. ibid., 4) prints Old Latin exspéctant (matching 1889; 1862 expectant), Gallican demónstra mihi, omits psalm superscription and v. 1 Domine, sets accented sǽcula sæculórum (accented ǽ on sǽcula and unaccented æ on sæculórum, uniformly matching Collect unit 2 and Secret unit 8), and carries the Introit repetition and per-totum-annum rubrics; unit 4 (Gradual, Graduale, Ps. 24, 3 et 4) prints exspéctant, comma before final vocative Dómine., and Old Latin notas fac mihi: (contrasting with Introit demónstra mihi:); unit 5 (Alleluia, no separate heading, Ps. 84, 8 inside V/. line) prints Allelúia (matching 1889; 1862 Alleluja) beneath the Advent ferial Alleluia-omission rubric between units 4 and 5; unit 6 (Gospel, Sequéntia sancti Evangélii secúndum Lucam., Luc. 21, 25-33) prints consonantal i (Iesus, iam, maiestáte vs. 1862/1889 j), ae ligatures (cælórum, Cælum, æstas, præ, quæ, hæc, præteríbit vs. 1862/1889 coelorum/Coelum), exspectatióne (matching 1889; 1862 expectatione), and pointing sónitus maris, et flúctuum:, præ timóre et exspectatióne,, movebúntur. Et tunc, potestáte magna, et maiestáte., scitis quóniam, scitóte quóniam; unit 7 (Offertory, Ant. ad Offertorium, Ps. 24, 1-3) is identical word-for-word, accent-for-accent, and punctuation-for-punctuation to the Introit antiphon; unit 9 (Communion, Ant. ad Communionem, Ps. 84, 13) omits Vulgate Etenim and sets benignitátem: with a colon before et terra nostra. Printed rubrics verified at 400 dpi: Gloria omission in de Tempore Masses through Vigil of the Nativity inclusive (p. 1R), expanded 1960 Credo rubric replacing 1862/1889 short rubric (p. 2R), Trinity Preface Sunday / Common Preface ferial rubric (p. 2R), and opening of general ferial resumption rubric Per totum annum continuing onto p. 3 (p. 2R foot). Publication rights for preexisting Latin propers rest on separately registered public-domain witnesses and 17 U.S.C. 103(b), never on this remote scan; see src/sources/inventories/missale-romanum-1962-facsimile-rights-v1.toml."
