notes = "Collated on 2026-10-19 word by word, by a scripted diff of the page's own text layer checked against the image, with the 1861 Cummiskey facing Latin (praefationes-la seq 3 up to its asterisk, joined to seq 21) and with the 1922 Mame, printed p. 334: the words agree. The differences are transformations under the 2026-09-03 rule in guidance/propers-for-agents.md: consonantal i and j, the ae and oe ligatures and coelos/caelos, exultat/exsultat, capitals, pointing, stress accents, the square brackets the 1861 sets round the conditional words where this book uses round ones, and the 1861's cue 'Sanctus, &c.' where this book prints the Sanctus whole. The conditional words are said within the vigil and octave of Pentecost and omitted outside them; the 1922 Mame states the same omission for votive Masses of the Holy Spirit. Publication rests on 17 U.S.C. 103(b) and the public-domain 1861 witness, not on this facsimile."
