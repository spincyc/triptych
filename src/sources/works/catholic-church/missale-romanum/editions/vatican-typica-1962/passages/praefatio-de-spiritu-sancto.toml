context = "The Holy Spirit Preface was read at the page image, at 200 dpi: its rubric of use, the rubric omitting two conditional words outside the vigil and octave of Pentecost, the dialogue, the whole Preface printed continuously from its opening through its conclusion before the Sanctus, the Sanctus, and the footer directing the proper Communicantes and Hanc igitur of the Canon, said from the vigil of Pentecost to the following Saturday inclusive in every Mass."
