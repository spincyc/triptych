context = "The Greater Litanies belong to 25 April, transferring to the following Tuesday only if that date is Easter Sunday or Monday. They have no Office; their Mass commemoration is privileged and is not de Tempore. On a second-class Sunday the required privileged commemoration displaces the ordinary commemoration of a second-class feast. The distinct Rogation votive Mass depends on a procession or prescribed supplications and is governed by the second-class votive rules; no such local action is inferred by the dated Mass-of-Office model. Lesser Litanies do not acquire the Greater Litanies' privileged commemoration. These rules distinguish the liturgical day, its commemorations, and a separate contextual Mass. They do not establish a particular church's procession, local calendar or dated Ordo."
