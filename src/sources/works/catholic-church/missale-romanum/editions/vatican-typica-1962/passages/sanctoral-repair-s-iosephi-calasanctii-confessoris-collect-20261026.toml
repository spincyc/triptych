notes = "Independently read on 26 October 2026 at 200 and 400 dpi, including all petition words, pointing, spelling and actual conclusion stop. No target page image is redistributed. The target and independent Pustet pages both print providere; the proposed provenire substitution is rejected. The calendar body remains byte-identical. Target intellegentiae and historical intelligentiae are received spellings of one word, retained separately. Pustet prints a comma after intelligentiae, no comma after juventutem, a comma rather than the target semicolon after quaesumus, no comma after nos, a comma after exemplo, none after intercessione, and a comma after facere. Pustet actually stops at Per Dominum.; the target stops at Per Dominum nostrum. That contiguous longer prefix is independently printed in the separately held Pustet PDF 390, printed p. 304. The prior 1862-owned evidence had incorrectly named Tours Mame 1922 PDF 815 and its raw lines; this new chain identifies the actual Pustet pages and changes no old artifact or passage."
