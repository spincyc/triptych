context = "VII.6 directs the celebrant to the Epistle side, where the minister pours water while the celebrant washes the tips of the thumbs and index fingers and says the Lavabo psalm; VII.7 says that the celebrant dries his hands. VII.10 names the acolytes ministering the water cruet with the small basin and hand towel after the celebrant has been incensed at Solemn Mass. These loci establish the paired articles and washing/drying relationships. They do not prescribe material, ornament, dimensions, basin silhouette, towel fold, liquid-disposal method, or the Low-Mass division of articles between two servers."
