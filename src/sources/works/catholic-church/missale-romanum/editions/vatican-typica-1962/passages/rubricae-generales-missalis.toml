context = "The general rubrics governing the fixed texts of the Mass were read at the page images. Among the numbers checked: n. 424, which prescribes the psalm with its antiphon and the confession with the absolution before the altar steps in every Mass sung or read, and which omits them together with the following versicles and the prayers Aufer a nobis and Oramus te in the Masses that follow the blessing of candles, of ashes, of palms, the Easter Vigil, the Rogation procession and certain consecrations; n. 425, which omits the psalm Iudica me in Masses of the season from Passion Sunday to Maundy Thursday and in Requiem Masses; nn. 427-429 on the introit antiphon and the omission of Gloria Patri at the same seasons; n. 430, Kyrie eleison said nine times; nn. 431-432 on when Gloria in excelsis is said and omitted; nn. 471-474 on the Gospel dialogue and the homily; nn. 475-476 on the days on which the Creed is and is not said; nn. 480-481 on the secret, said secretly, in the same number as the collects, its last conclusion said secretly as far as Per omnia saecula saeculorum, which is said aloud; n. 500, Post praefationem et Sanctus dicitur Canon Missae secreto; n. 501 on proper forms of Communicantes, Hanc igitur and Qui pridie; nn. 502-503 on the Communion of the faithful within Mass, with the confession and absolution omitted but Ecce Agnus Dei and the threefold Domine non sum dignus said; nn. 507-508 on Ite missa est, Benedicamus Domino, Requiescant in pace and the blessing; and nn. 509-510 on the last Gospel and the six cases in which it is wholly omitted."
verified_on = "2026-07-26"
notes = "Read visually. Marginal numbering is the citation grammar of this code; the printed roman pagination is secondary. Numbers 511-514 on the tones of voice are recorded separately on this edition."
