notes = "Independently read on 26 October 2026 at 200 and 400 dpi, including all petition words, pointing, spelling and actual conclusion stop. No target page image is redistributed. The target and independent 1862 page both read quaesumus; the former calendar quiesumus was transcription damage. The complete petition agrees word for word. Pustet prints commas after loco, tuos and meritis, none after ut or montem, and a full stop after valeamus. The target prints its own pointing. Pustet actually stops at Qui tecum vivit.; the target stops at Qui tecum vivit et regnat in unitate. The longer target prefix is independently printed contiguously in the separately held Pustet PDF 390, printed p. 304, Praesta oration conclusion; no words beyond the target stop are supplied."
