context = "Actual 200 and 400 dpi page-image verification of four own dated 8 December feast appointments and bounded wording, independently collated against Mame 1922. Secret solemnitate feast selection only, dated 8 December; the target parenthetical commemoratione alternative is not represented or graded as exact-target."
notes = "Source Collect eumdem versus target eundem and source ejus/ejusdem versus target eius/eiusdem are declared orthography. Mame has a comma after praevisa; target has none. Source Secret ends Per Dominum nostrum. while target ends Per Dominum.; source Postcommunion ends Per Dominum. while target ends Per Dominum nostrum. Historical cues remain unchanged in the separate derivative. The full source-study Secret reading is solemnitate (commemoratione); only solemnitate is projected. Communion Gloriosa dicta sunt de te, Maria: quia fecit tibi magna qui potens est. prints no Bible citation. No P/R, speaker label, Oremus or Amen is part of these four blocks. Tract 1877 is only for votive use after Septuagesima; the Paschal and feria directions are outside all four bodies. This record supplies no whole-edition publication permission."
