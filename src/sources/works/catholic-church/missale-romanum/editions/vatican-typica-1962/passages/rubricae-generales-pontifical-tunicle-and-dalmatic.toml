context = "Number 134 directs a bishop, and others enjoying the use of pontificals, when celebrating solemnly to wear the chasuble over the dalmatic and tunicle. It also appoints that layering at certain Low Masses celebrated by a bishop, while permitting the tunicle and dalmatic beneath the chasuble to be omitted for a reasonable cause. Number 137 separately assigns the dalmatic and tunicle to the deacon and subdeacon respectively when they minister to a priest. The juxtaposition controls the necessary dictionary boundary: the pontifical tunicle and dalmatic are episcopal layers beneath the chasuble and are not merely the deacon's and subdeacon's outer garments, even though the same Latin names are used. The page does not prescribe a cut, ornament, material, dimensions, or visible distinction."
verified_on = "2026-07-28"
notes = "Read visually at the exact facsimile page. This is the governing 1962-horizon provision for presence, layering, conditional omission, and the distinction between episcopal and sacred-minister use."
