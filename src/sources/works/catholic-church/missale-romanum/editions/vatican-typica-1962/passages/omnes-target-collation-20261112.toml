notes = "Body SHA-256 0749a65a571d4fb4811cb545d191f4cdc9f57225f573195edb049a3843b0884a. Old dicent is future indicative; target dicunt is present indicative. This is a substantive tense change, never described as mere spelling. Target adds guillemets, places a colon after Domini instead of the old comma, capitalizes Hosanna and adjusts pointing/spacing. Exclude the Ant. and Antiphona 5 labels, Psalm 147, doxology, repeated antiphon, repetition directions, music, neighboring chants, and the whole rite. English occurrence 5 and Latin direct-body occurrence 4 are separately mapped: the preceding Scripture-owned procession antiphon is counted by the English identity but excluded from the Latin direct-body ordinal."
