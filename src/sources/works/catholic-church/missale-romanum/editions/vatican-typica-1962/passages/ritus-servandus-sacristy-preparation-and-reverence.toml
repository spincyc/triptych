context = "Section I.1 directs the priest, after preparing the Missal, to wash his hands while saying the appointed prayer. It prescribes the action but no lavatory morphology, plumbing, basin, furniture, or fixed location. Section II.1 directs the vested celebrant to bow his head to the cross or image in the sacristy before proceeding to the altar. The Missal does not narrow this alternative to a crucifix. The return reverence used by this dictionary is separately controlled by the checked contemporary ceremonial and specialist witnesses."
