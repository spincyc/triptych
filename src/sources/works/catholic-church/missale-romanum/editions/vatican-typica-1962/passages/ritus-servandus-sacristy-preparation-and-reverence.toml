context = "Section I.1 directs the priest, after preparing the Missal, to wash his hands while saying the appointed prayer. It prescribes the action but no lavatory morphology, plumbing, basin, furniture, or fixed location. Section II.1 directs the vested celebrant to make a reverence to the cross or image in the sacristy before proceeding to the altar. The Missal does not narrow this alternative to a crucifix. The return reverence used by this dictionary is separately controlled by the checked contemporary ceremonial and specialist witnesses."
verified_on = "2026-11-05"
notes = "Rechecked visually on 2026-11-05 after reacquiring the complete registered facsimile and confirming its SHA-256. Both I.1 and II.1 occur on artifact PDF p. 56, whose printed folio is not visible; the former LII/LIV and PDF 56/58 mapping was erroneous. The context now says reverence rather than head bow because II.1 does not itself specify the bodily form. The handwashing, cross-or-image alternative, and separate source for the return reverence remain unchanged."
