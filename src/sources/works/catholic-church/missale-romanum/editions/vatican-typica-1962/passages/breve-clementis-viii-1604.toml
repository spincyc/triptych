context = "Read visually at the rendered page image of artifact p. 4 for the narrative sentence and at the artifact text layer for the remainder. Clement VIII records that Pius V had the Roman Missal restored and printed and that, 'although he most severely provided under many penalties that nothing should be added to it or in any way taken away, nevertheless with the passage of time' (Qui etsi multis propositis poenis severissime caverit, ne quid illi vel adderetur, vel ulla ratione demeretur; tamen, progressu temporis) corruptions had entered printed Missals; he therefore had the Missal restored to its ancient and most corrected form, printed at the Vatican Press, and revoked the printing privileges previously granted. Dated Rome at St Mark's, 7 July 1604."
