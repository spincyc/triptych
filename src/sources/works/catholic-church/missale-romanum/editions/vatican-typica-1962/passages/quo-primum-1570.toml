context = "The complete bull was read visually at the rendered page images. It narrates the commission to restore the Missal ad pristinam sanctorum Patrum normam ac ritum, imposes the book on the churches named, and expressly exempts churches whose rite was approved from its first institution by the Apostolic See or whose custom of celebrating had been continuously observed for more than two hundred years (a quibus ... nequaquam auferimus), permitting such churches to adopt the new Missal with the consent of the bishop or prelate and the chapter. It grants perpetual leave to use the Missal freely and lawfully absque ullo conscientiae scrupulo, aut aliquarum poenarum, sententiarum et censurarum incursu; decrees nihil unquam addendum, detrahendum, aut immutandum esse under pain of the pope's indignation, addressing patriarchs, administrators and all ecclesiastical dignitaries including cardinals in virtue of holy obedience, and separately threatening printers; and states that priests may not be compelled by anyone to change this Missal, nor may these letters at any time be revoked or modified. The bull legislates nothing about the language of the Mass."
