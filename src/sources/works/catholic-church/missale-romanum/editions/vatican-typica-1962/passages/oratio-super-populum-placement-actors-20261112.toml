context = "In Masses of Lenten and Passiontide ferias, except the Sacred Triduum, the appointed prayer over the people follows the last Postcommunion and retains its own conclusion, even when three Postcommunions preceded it. The priest says Oremus, then Humiliate capita vestra Deo, before the appointed prayer and before the final Dominus vobiscum. Ritus XI.3 expressly qualifies the second utterance at Solemn Mass: after the celebrant says Oremus, the deacon turns to the people and says Humiliate; the celebrant then says the prayer. The general rite in XI.2 assigns both cues to the celebrant. This is an actor distinction, not a response exchange."
notes = "Whole original page images were read directly, with XI.2 also read at 400 dpi. The actor condition is deacon at Solemn Mass, otherwise celebrant under the general rite. There is no additional Dominus vobiscum immediately before these two cues. The final greeting, dismissal and remaining conclusion follow after the prayer; the presence of this prayer does not appoint Benedicamus by itself. RGMR 507-508 retain their own dismissal and blessing conditions. The rule applies to a celebrated ferial Mass, not merely to a commemoration of a feria in another Mass. No target rubric body or facsimile is reproduced here; the short cue text comes independently from registered historical text-only witnesses."
