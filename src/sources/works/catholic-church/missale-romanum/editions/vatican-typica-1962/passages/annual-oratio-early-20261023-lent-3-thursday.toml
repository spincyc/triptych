notes = "Historical and target complete prayers were checked on page images at 200 dpi and 400 dpi. The target prints Subiectum and the Mame Subjectum; the projection follows declared consonantal j. The Mame conclusion abbreviates Dominum as Dm. with an abbreviation mark, retained as Dm. in the normalized source text; the target prints Dominum in full. The separately checked old Father-through-Son formula controls this ordinary abbreviation expansion. Same-address old formula control passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-father-through-son; historical formula instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17, passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. The old Praesta exemplar contains ejusdem only after the contiguous prefix used here; no target is changed to add or remove that word. Exact scan and raster bytes remain private and are not retained in the source library."
