context = "Number 526 requires the altar to be covered by three clean blessed cloths, with the upper cloth long enough to reach the ground at both sides. Number 527 requires a sufficiently large cross with a crucifix in the middle of the altar, the candlesticks required by the quality of the Mass with lighted candles on either side, and a cushion or bookstand beneath the Missal at the Epistle side; it also places three altar cards on the altar only for the time of Mass. These rubrics establish articles and relationships, not altar, cross, candlestick, support, frame, architectural, or decorative morphology; they do not establish one universal candle count."
