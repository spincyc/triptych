notes = "Missale Romanum 1962 prescribes this hymn by title and stage boundary rather than reprinting its full stanzas; the official companion Vatican chant books (Graduale Romanum 1908, Antiphonale Romanum 1912) establish every word of the six stanzas and Amen. identically to the held Latin body."
