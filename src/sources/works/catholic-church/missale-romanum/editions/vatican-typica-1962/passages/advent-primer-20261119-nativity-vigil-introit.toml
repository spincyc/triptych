notes = "1962 citations: Exodi 16, 6 et 7 for the antiphon and Ps. 23, 1 for the verse, then the Gloria Patri cue; the Gradual on the same page is also cited Exodi 16, 6 et 7. Against the public-domain 1862 witness (passage advent-primer-20261119-nativity-vigil-introit of edition pustet-ratisbon-1862): no lexical difference after normalization of j/i (1962 eius, 1862 ejus); 1862 prints only Exod. 16. and Ps. 23.; the 1962 psalm verse has a colon after eius where 1862 has a semicolon. The 1962 heading is Ant. ad Introitum where 1862 has Introitus. Read on page images at 150 and 250 dpi on 2026-11-19. The exact scan bytes remain remote and are not retained."
