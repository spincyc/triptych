context = "Each of the three feasts explicitly appoints a commemoration of the Nativity octave and prints its Collect, Secret and Postcommunion separately from the feast's own prayers. All nine commemoration petitions agree word for word with the three prayers of the shared octave formulary; those petitions also agree with the Christmas Day Mass. The extents of the printed conclusion cues differ, and the Christmas Day Collect prints a full conclusion and response. The calendar's existing fifth-day-within-octave owner resolves to the shared octave formulary's single main-form prayer bodies through its declared Christmas Day referral. Only these three prayer owners are appointed for the implied octave commemoration; this is neither an appointment of the fifth day's whole Mass on December 26-28 nor a change of liturgical identity. Existing rules determine whether the octave is commemorated, and existing source-owned conclusion execution determines the conclusion of each counted oration."
