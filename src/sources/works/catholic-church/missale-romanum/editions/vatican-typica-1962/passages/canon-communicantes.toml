context = "The Communicantes was read at the page images. The ordinary form at n. 1090 reads 'Communicantes, et memoriam venerantes, in primis gloriosae semper Virginis Mariae, Genetricis Dei et Domini nostri Iesu Christi: sed et beati Ioseph, eiusdem Virginis Sponsi, et beatorum Apostolorum ac Martyrum tuorum, Petri et Pauli ...' with the apostolic and martyrial list through Cosmae et Damiani. The proper forms for Christmas and its octave, Epiphany, the Mass of the Easter Vigil to Low Sunday, the Ascension, and the Vigil of Pentecost to the following Saturday are printed at nn. 1093-1097 and converge on a shared continuation at printed p. 305 which also carries the clause on Saint Joseph."
verified_on = "2026-07-26"
notes = "Read visually. This printing therefore already embodies the insertion of Saint Joseph's name decreed on 13 November 1962 with effect from 8 December 1962, although the volume's own promulgating decree is dated 23 June 1962. A copy of the same typical edition impressed before that date would not carry the clause."
