notes = "Body SHA-256 6a400cc997227b26e04d2b3a9c84f26b14735475688cbf9a3d6798ce2954a8bd. The old collect begins Omnipotens sempiterne Deus; target begins Deus. Target replaces in apostolica soliditate with in apostolicae petrae soliditate. Target adds quaesumus and intercedente beato Urbano Martyre tuo atque Summo Pontifice. The old Urban prayer establishes the named martyr/pontiff and intercession relationship, not Summo or this exact placement. The p.44 old collect has in tua veritate persistens; Urban has in tua virtute persistens. The separate p.39 whole preface corroborates virtute but has consistens. Do not substitute Common veritate. Target replaces nulla recipiat consortia perfidorum with continua securitate muniatur. The complete p.45 protection prayer supplies an older patronage/protection relation, not those exact words. Retain the actual target Per Dominum. cue unexpanded. Source per. cues are retained in source apparatus and not expanded into a full conclusion. Join target linewraps and decorative initial, expand ligatures, remove stress accents; preserve the source-owned target words and punctuation."
