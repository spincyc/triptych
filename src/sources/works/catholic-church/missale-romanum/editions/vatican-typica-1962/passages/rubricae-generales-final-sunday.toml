context = "RG 18 enumerates the unused Epiphany formularies for years with twenty-five through twenty-eight Sundays after Pentecost. Its final, separately worded command always reserves the last place for the formulary numbered XXIV in the book. The source-grounded interpretation applies that terminal command also to a twenty-three-Sunday nominal run: XXIV occupies its last slot and XXIII has no separate nominal Sunday. The prior repository hold treated the final command as confined to the surplus cases. Independent review on 12 November 2026 found that contextual reading weaker than the unqualified terminal command; the temporal note and XXIV-and-last heading corroborate the distinction between printed ordinal and final position. RG 14 supplies no obligatory anticipation or later resumption of an impeded Sunday. This is interpretation, not an expressly enumerated twenty-three-case enactment, authentic interpretation, future dated Ordo or particular-calendar finding. No pre-1955 rule is established."
verified_on = "2026-11-12"
notes = "RG 14/18 read directly in a 200 dpi image of the exact registered facsimile; independently rendered and read in source-interpretation review with printed pp. 417 and 422. Metadata only; no Latin rubric transcription. The contemporaneous November 2011 St John's Bulletin, printed p. 4, corroborates XXII followed by Last Sunday and Advent, but neither explicitly identifies XXIV nor supplies universal legislative authority."
