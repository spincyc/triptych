context = "Read visually at the rendered page image. The decree declaring this Vatican edition typical states that, a new body of rubrics having been approved by John XXIII in the motu proprio Rubricarum instructum and promulgated by the Congregation the following day, it could scarcely fail to happen that the same Congregation should prepare a new edition of the Roman Missal fully accommodated to that code of rubrics. The decree gives the motu proprio's date as 23 July 1960; the Congregation's own general decree promulgating the code, printed later in the same book and dated 26 July 1960, gives 25 July, which alone is consistent with this decree's postero die. The discrepancy is internal to the edition and is not resolved here."
