context = "Section II.2 distinguishes the reverence made on reaching the altar when the tabernacle of the Blessed Sacrament is present and then directs the celebrant to ascend to the middle of the altar. Section IV.5 directs that relics or images of saints on the altar, if present, are incensed after the cross. These loci establish conditional presence and ceremonial relationships only; they prescribe no tabernacle, reliquary, image, altar-step, or architectural morphology and no universal arrangement."
