notes = "All146 body words agree under declared orthography, including source Genitrix versus target Genetrix. Seven chants print no Scripture reference. The Nativity BVM Introit prints Sedulius over the Salve antiphon and Ps. 44, 2 only before Eructavit; Gloria Patri remains a literal abbreviated cue. The Alleluia bodies each print two opening acclamations and one closing acclamation. Martin no. 4079 is expressly a paschal votive alternative adding Hic est sacerdos and is not part of no. 4078. No actor, doxology expansion, antiphon repetition or Bible wording is inferred; this control record conveys no target publication permission."
