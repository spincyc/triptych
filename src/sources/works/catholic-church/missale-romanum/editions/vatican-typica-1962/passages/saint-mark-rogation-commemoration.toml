context = "The proper heading identifies the second-class feast of St Mark separately from the Greater Litanies. Its own Collect, Secret and Postcommunion are followed by distinct Rogation prayers. Those commemoration prayers have the same prayer bodies as the Rogation Mass's three orations; their printed conclusion cues differ in extent. The calendar's stable litania-maior key owns St Mark's formulary, not a combined liturgical identity. The independent Greater Litanies commemoration therefore points to the existing rogation-mass prayer owners, with commemoration conclusions governed separately. The processional direction does not transfer St Mark's feast whenever the Litanies transfer."
