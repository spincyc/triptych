context = "Read at the artifact's embedded text layer. Section V, 3 gives the rubric for an altar ad orientem, versus populum, at which the celebrant does not turn his shoulders to the altar for Dominus vobiscum, Orate fratres, Ite missa est or the blessing. Section VI, 4 has the subdeacon sing the Epistle at solemn Mass, quam celebrans sedens auscultat, the celebrant then reading the gradual and the rest quietly. Section VII gives the offertory ceremonial and directs that the celebrant say Orate, fratres voce aliquantulum elata and continue et secreto prosequens: ut meum ac vestrum sacrificium."
