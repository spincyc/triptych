notes = "All three petitions agree word for word with the historical witness after declared orthography. The1962 target prints Qui tecum vivit et regnat in unitate. for all three; the older source prints shorter conclusion cues. Target-specific punctuation is retained only in the project editorial projection. The following Et non fit commemoratio dominicae is a rubric and is excluded from every prayer body. This metadata-only verification does not authorize republication of the 1962 facsimile or whole edition."
