notes = "The complete two-page feast formulary and the separately appointed Preface page were visually read in images rendered from the exact hash-verified CMAA facsimile; its optical text layer did not control this reading. The October appointment is Introit (Apoc. 5:12; 1:6; Ps. 71:1), Collect (no. 3939, printed p. 697), Epistle (Col. 1:12-20), Gradual (Ps. 71:8,11), Alleluia (Dan. 7:14), Gospel (John 18:33-37), Offertory (Ps. 2:8), Secret (no. 3947, printed p. 698), proper Preface, Communion (Ps. 28:10 and 11, no. 3948) and Postcommunion (no. 3949, printed p. 698). The previous calendar entry omitted the Communion's second cited verse and treated the conditional Tract as unconditional. The printed Tract (Ps. 88:27-28,30, no. 3943) applies only to votive Masses after Septuagesima, replacing the Alleluia and verse; the Paschal double Alleluia (Dan. 7:14 and Apoc. 19:16, no. 3944) replaces the Gradual in Paschal use. Neither variant belongs to the October feast's appointed list. The page expressly excludes Sunday commemoration after each of the three orations. The proper Preface direction at p. 698 resolves to the Preface of Christ the King at p. 291, whose own rubric specifies festive and votive use. The calendar schema does not record Prefaces, so that appointment remains in its notes and this source-local record. The three composed oration bodies have not been retained or collated against an independently publishable wording witness by this appointment-only verification; their typed witness gaps must not be read as a claim that the target pages lack the prayers or that redistribution is forbidden. No source wording is transcribed here."
