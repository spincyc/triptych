notes = "WHAT THIS IS: uncorrected optical character recognition of a whole 1570 Missal, 84,442 LF-terminated lines, valid UTF-8, no CR bytes, landed as a plain source artifact and nothing more. It is deliberately NOT structured as liturgical records. The prior lt-hist corpus cut the same text into eight markdown 'sections' whose only structural claim was a line range over the downloaded file -- `source_lines: 20001-30324` on its Proprium de Tempore -- so a comparison of two such sections compares the scanner's disagreements rather than the liturgy's, and nothing of that shape is reproduced here. Addressability by identity, this collect of this Mass, belongs to passage records with real loci over these exact bytes, which the schema already supports and which requires reading the pages rather than slicing the file. Until such a passage exists this artifact is a finding aid.\n\nOCR QUALITY, AND IT IS THE WORST OF THE THREE VERSIONS FOLDED IN ON THIS DATE. Measured here by scripts/_ocr_quality.py at a Latin function-word share of 0.0788 over 221,218 tokens, English 0.0211, classified `degraded-latin` -- below the roughly ten per cent at which that tool says running Latin prose sits. The cause is the type: this is a 1570 book set in a blackletter-adjacent face with heavy abbreviation and long s, and the item's own metadata records `ocr_detected_script = Fraktur` at confidence 0.8562 and a Fraktur-trained model. The damage is systematic rather than random. Consonant clusters collapse (`Miffale` for Missale, `celebzande` for celebrandae), Tironian and scribal abbreviations survive as their own codepoints, and whole ornamental initials are emitted as line noise. Individual sentences are nonetheless recoverable: the Ritus servandus reads `cipit Canonem, fecrete oicens To igitur ⁊c.` at line 3083 and `Qui pridie quam pateretur` at line 4173, both plainly the right words badly seen. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE, AND DO NOT REST A NEGATIVE SEARCH ON IT. At this level of damage a raw-line search establishes neither presence nor absence of a string; it is admitted as indexable so that later passages can pin physical line ranges over it, not so that a search over it can be reported as a finding.\n\nWHAT THE TEXT LAYER CONTAINS AND WHERE, READ RATHER THAN ASSUMED. Quo primum begins at line 84 with its ornamental Q dropped, `Ao primum tempoꝛe ad Zt poftolatue`; the calendar runs from about line 1276 and the computistical matter on the dominical letter from about line 1458; the Ritus servandus runs from about line 2612; the temporal Masses are under way by Holy Thursday at line 28080; and THE CANON IS PRESENT ENTIRE, opening at about line 41209 as `JEi / tiſſime — / — chꝛiſtus / filiumtuum` -- the wreckage of the full-page ornamental T of TE IGITUR, clementissime Pater, per Iesum Christum Filium tuum -- under the running head `canon Miſſe.` at line 41243 and `Canon mile,` at line 41328, with `Hococ eft enim coz: / pue meum` for Hoc est enim Corpus meum at lines 41386 to 41387 and the Nobis quoque list of saints at line 41591.\n\nTHE DROPPED INITIALS ARE A SEARCH HAZARD AND ARE NAMED SO THAT NOBODY REPEATS THE MISTAKE MADE WHILE WRITING THIS RECORD. Every large ornamental initial in the book is emitted as line noise or not at all, so the two most quotable openings in a Missal, `Te igitur` and `Quo primum`, are both absent from this text layer as strings while both texts are present in full. A search for either returns only the rubrical references to them in the Ritus servandus. That is the concrete form of the general warning above: an absence here is evidence about the text layer and not about the book.\n\nIDENTITY. The colophon at the end of the file carries a Venice imprint, `VENETIIS / apud Ioannem Variscum, et Heredes / Bartholomaei Faletti, et Socios`, with the year M.D.LXX and a preceding register of gatherings; see the edition record, which refuses the description `editio princeps` on that ground. The item was uploaded on 2021-03-01 by a private uploader crediting `Biblioteca di Alessandria`, in collection booksbylanguage_latin, at 1200 ppi, with no publisher, rights, or creator field beyond an uploader-written description quoting the title. Its identifier and title assert 1570 and the colophon agrees with them."
