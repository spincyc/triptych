rights_basis = "Public domain in the United States because the book was first published outside the United States before the pre-1931 line, and on that ground alone. THE LINE, AND THE YEAR IT WAS DERIVED FOR. Any work first published abroad before 1931 is out of United States copyright; that is the line guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026, correcting the commissioning brief's 'before 1930'. THE LINE MOVES EVERY JANUARY, which guidance/missals.md:249 states in terms, so it is written here as derived for calendar year 2026 and not as a standing rule: on 1 January 2027 it becomes before 1932, and a later reader must re-derive it rather than quote this sentence. Publication in 1570 clears the line by three hundred and sixty-one years, so no movement of it can ever reach this book and the annual staleness is recorded for the form of the reasoning rather than for any doubt about this row. THE SCAN AND ITS TEXT LAYER ADD NOTHING FOR ANYONE TO OWN. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it: this text layer was produced autonomously by tesseract 5.0.0-alpha-20201231-7-gc75f run with `-l lat+Fraktur`, per the Internet Archive item's own `ocr` and `ocr_parameters` fields, and there is no author to hold a right in it. NOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, that the download succeeded, or that the host marks it public domain. guidance/sources.md:395-400 holds that availability and successful download are insufficient for `tracked`, and the item's Public Domain Mark 1.0 was the whole of the prior lt-hist corpus's ground for this book -- the ground refused at src/sources/inventories/lt-hist-rights-audit-v1.toml, and the same kind of ground that corpus used to import the 2011 Roman Missal. The mark is recorded as a fact about the item and is not a link in this basis, which would be unchanged if the item carried no mark or a contradictory one."
