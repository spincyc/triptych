rights_basis = "The printing reproduced here was published before 1931 and is in the public domain in the United States: the repository's own rights reading, recorded at guidance/missals.md section 5 against Cornell's public-domain chart current at 1 January 2026, is that a work first published abroad before 1931 is in the public domain with no term running. A faithful photographic reproduction of one page of a 1570 printing adds no original authorship of its own. The bytes are retained at 0.70 MB because they are the evidence itself: the book is blackletter, the only optical text layer this library holds for the 1570 Venice issue is of a different digitisation and reads that face badly, and a reader with no network who wants to check a word of this Missal against a page has nothing else here to open."
