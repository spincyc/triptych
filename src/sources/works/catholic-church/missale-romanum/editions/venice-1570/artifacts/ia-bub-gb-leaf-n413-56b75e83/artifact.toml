notes = "Extent as the retrieving lane measured it: One page image, leaf n413 of the same scan, opening of Dominica XIV post Pentecosten in the 1570 editio princeps. One leaf only. THE RETRIEVING LANE LABELLED THIS ITEM 'Rome 1570 (editio princeps)' AND THAT IS WRONG. The item's own text layer, held unreceipted beside these leaves in the retrieving lane's scratch, prints VENETIIS on the title page and closes, after the register of gatherings, with the colophon 'VENETIIS apud Ioannem Variscum et heredes Bartholomaei Faletti et Socios anno Domini M.D.LXX.' -- the same colophon this edition record already transcribes for its other digitisation. So these bytes are a second scan of the Venice issue, they are filed under that edition rather than under a new one, and the Rome editio princeps that guidance/missals.md section 6 still lists as an outstanding acquisition is NOT held. A record that had taken the lane's label at face value would have asserted a printing history it had not read and would have closed that acquisition item falsely. This artifact is a different digitisation from artifact.catholic-church.missale-romanum.venice-1570.missale-romanum-1570-text-563f4dd2: that one is the Internet Archive item messale-tridentino-di-san-pio-v-1570 and this one is item bub_gb_adC-aRGza70C."
