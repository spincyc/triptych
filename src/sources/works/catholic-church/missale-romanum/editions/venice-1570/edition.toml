notes = "The Tridentine typical edition of 1570 -- the recension that Quo primum promulgated and that every later Missal down to 1962 is a revision of. THE SCANNED COPY CARRIES A VENICE IMPRINT AND MUST NOT BE CITED AS THE ROME EDITIO PRINCEPS. Its colophon, standing after the register of gatherings at the end of the volume, reads VENETIIS, apud Ioannem Variscum et Heredes Bartholomaei Faletti, et Socios, M.D.LXX; the Rome first printing of the same year names the same consortium in the other order and at Rome. The prior lt-hist corpus, the Internet Archive item's uploader-supplied title, and the audit brief this fold-in was written from all treat the file simply as the 1570 typical edition without distinguishing the issue, and a record that repeated them would assert a printing history it had not read. The text is the 1570 text; which of the consortium's 1570 issues these bytes are is what the colophon settles, and the copy has not been collated against a Rome issue here. The book is a complete Missal and the scanned copy carries the parts a complete Missal carries: Quo primum at the head, the calendar with its computistical tables, the general rubrics, the Ritus servandus in celebratione Missarum, the temporal and sanctoral Masses, and the Ordo Missae with the Canon entire down to the words of consecration. The artifact record cites the line at which each was read. It is the altar book itself and not a hand missal: any English lay missal registered in this library -- the 1806 P. Keating, the Cummiskey and Husenbeth books -- is a devotional companion whose English is its compiler's, and none of them is a witness to this edition's text."
