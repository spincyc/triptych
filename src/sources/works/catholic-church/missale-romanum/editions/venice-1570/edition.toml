publication = "Missale Romanum, ex decreto sacrosancti Concilii Tridentini restitutum, Pii V Pont. Max. iussu editum, cum privilegio. The scanned copy's colophon reads VENETIIS, apud Ioannem Variscum et Heredes Bartholomaei Faletti, et Socios, anno Domini M.D.LXX. Internet Archive item messale-tridentino-di-san-pio-v-1570."
