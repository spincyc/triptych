context = "Twenty-Ninth Sunday in Ordinary Time, artifact page 89, printed p. 81, above the Thirtieth Sunday. The citation margin gives the Entrance Antiphon as Cf. Ps 16: 6, 8; the Communion Antiphon as Cf. Ps 32: 18-19; and a second antiphon under Or: as Mk 10: 45 without Cf. The compiler's red sub-lines give Graduale Romanum psalm assignments: for the Entrance antiphon Psalm 16[17] (GR, p. 354); for the first Communion antiphon Psalm 32[33]: 13-15, 20-22 (GR, Praenotanda, no. 1); for the second Psalm 33[34] (GR, Praenotanda, p. 12) or Revelation 4: 11; 5: 9, 10, 12. No liturgical text is transcribed into this record."
