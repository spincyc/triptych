File LY-Composers-Guide.pdf, 28 pp. Listed on Missal/Music/Composing/index.shtml as "The Liturgical Year - A Guide for Composers". The Department for Christian Life and Worship's guide to the texts of the Liturgical Year for composers, approved November 2011. It prints texts the other files here do not: Ash Wednesday, the Palm Sunday SIMPLE ENTRANCE ANTIPHON that Lords-Entrance.pdf omits, the Washing of Feet antiphons, the Adoration of the Cross including the Improperia entire and Crucem tuam, the Lucernarium, both Exsultet forms, the Litany, the Blessing of Water, the Sprinkling, and the Presentation of the Lord. Its paragraph 123 states that at the transfer of the Blessed Sacrament "The Missal does not provide any texts at this point but notes that the hymn Pange, lingua or another eucharistic chant is sung" -- which bears on whether two slots in this repository's Holy Week ledger are text slots at all. Carries its own approval line and "Text (c) Bishops' Conference of England & Wales" beside "Excerpts from the English translation and chants of The Roman Missal (c) 2010, International Commission on English in the Liturgy Corporation. All rights reserved."
