context = """
The complete General Index, artifact pp. 2-5, printed pp. 5*-8*. It lists, with
body page numbers: front-matter documents; the Proper of Time by season and
grouped headings; the Order of Mass with its Prefaces, Eucharistic Prayers I-IV,
blessings and notated Eucharistic Prayers; the Order of Mass with a single
minister; the Appendix to the Order of Mass (two Reconciliation prayers and four
forms for various needs); the Proper of Saints by month only; the Commons;
Ritual Masses; Masses and Prayers for Various Needs and Occasions; Votive
Masses; Masses for the Dead; Appendices I-VI with Preparation for and
Thanksgiving after Mass; and two further indexes.

Two entries carry the index's own [USA] marker: various-needs category 48/1,
thanksgiving for the gift of human life, body p. 1165; and Appendix VI, sample
invocations for the Penitential Act, body p. 1316; both at printed p. 8*. Three
further [USA] markers stand on front-matter documents at printed p. 5*.

Heading levels differ. A temporal heading may group a Sunday with its week, a
run of weekdays, or a whole season; a Common, ritual, needs, votive or dead
heading may hold several numbered or lettered forms, a prayer set, or a
Collect only. Headings at different levels must not be summed as Mass
formularies or text slots.
"""
