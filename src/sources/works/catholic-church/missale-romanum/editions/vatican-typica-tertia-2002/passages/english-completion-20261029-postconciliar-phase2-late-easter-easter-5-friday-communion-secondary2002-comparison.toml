notes = "The inspected secondary 2002 reproduction omits the second final alleluja of the complete 1815 antiphon. No body word is added or substituted. The historical acute preposition á, other stress accents, j/i in alleluja / allelúia, and lack of a source comma after nos versus the modern comma are orthographic or pointing differences. The study English renders the retained historical words with one final alleluia under the disclosed abridged route. No historical English is attributed to this Latin-only source. The following Dicite in nationibus versicle/response is separately labelled and excluded. The comparison is bounded to the exact secondary digitally typeset 2002 reproduction; fidelity to printed 2002 and agreement with the 2008 reimpressio remain unresolved. New Triptych study English, not historical human English, not approved liturgical English, and not for recitation. No ICEL English source was used."
