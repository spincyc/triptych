context = "Read in the rendered text of the artifact and enumerated by heading. Fifty prefaces stand in this section, between the common opening of the Eucharistic Prayer and the Eucharistic Prayers themselves: two of Advent, three of the Nativity, one of the Epiphany, four of Lent, two of the Passion, five paschal, two of the Ascension, eight for Sundays in Ordinary Time, two of the Most Holy Eucharist, two of the Blessed Virgin Mary, two of the Apostles, two of the Saints, two of Martyrs, one of holy Pastors, one of Virgins and Religious, six Common and five of the Dead. Prefaces printed with their own formularies elsewhere in the book are additional to this count."
