notes = "Transpose fidelium Pater summe to Pater summe fidelium. Move in toto orbe terrarum from immediately after qui to immediately before multiplicas, and transpose orbe terrarum to terrarum orbe. Replace introire with intrare: a real lexical substitution of closely synonymous verbs, not orthography. Normalize jurasti/iurasti, accents, case and pointing. Replace the old abbreviated Per Dominum. cue with the separately witnessed complete short conclusion Per Christum Dominum nostrum. and marked R.Amen. No automatic cue expansion is claimed. Project-created study English from a complete independently old prayer, with the individually documented changes and a separately witnessed full conclusion. The modern comparison is a secondary digital 2002 witness; agreement with printed 2002 and the exact 2008 text remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation."
