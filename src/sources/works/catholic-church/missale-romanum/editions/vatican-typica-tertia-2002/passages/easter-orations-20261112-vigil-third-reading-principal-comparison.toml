notes = "Replace nostris saeculis with nostris temporibus: a real temporal-word substitution. Replace persecutione Aegyptiaca with persecutione Pharaonis: the old Egyptian persecution is specifically attributed to Pharaoh, already named in the immediately preceding whole Exodus reading; not orthography. Normalize cujus/cuius, accents, ligatures and pointing. Unlike the older Gelasian donor, this1862 petition already lacks a further et before in Abrahae. Replace the old abbreviated Per Dominum. cue with the separately witnessed full Per Christum Dominum nostrum. and marked R.Amen. Project-created study English from a complete independently old prayer, with the individually documented changes and a separately witnessed full conclusion. The modern comparison is a secondary digital 2002 witness; agreement with printed 2002 and the exact 2008 text remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation."
