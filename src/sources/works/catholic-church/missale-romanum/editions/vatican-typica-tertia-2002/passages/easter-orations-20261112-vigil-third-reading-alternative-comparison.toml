notes = "Change et liberata plebs ab Aegyptiaca servitute to et plebs a servitute liberata: move liberata, omit Aegyptiaca, and use a instead of ab before the new following consonant. These are disclosed body changes, not an exact old-target match. The1922 old text already has ut et, exsisteret and merito fidei; the earlier1894 wording is not silently combined with it. Replace old abbreviated Per Dominum... in unitate ejusdem. with the separately witnessed complete Per Christum Dominum nostrum. and marked R.Amen. Normalize stress accents, ligatures, case and pointing. Project-created study English from a complete independently old prayer, with the individually documented changes and a separately witnessed full conclusion. The modern comparison is a secondary digital 2002 witness; agreement with printed 2002 and the exact 2008 text remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation."
