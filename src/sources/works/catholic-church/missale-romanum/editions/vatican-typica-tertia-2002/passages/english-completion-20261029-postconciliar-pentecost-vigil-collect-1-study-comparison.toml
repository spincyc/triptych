notes = "All petition lexical words preexist. There are three linked grammatical inflection changes: ancient dispersio divisione ... congregetur becomes bounded-secondary dispersione divisiones ... congregentur. Wilson p.123 note 2 independently prints the ancient V reading divisiones, and note 4 prints congregentur V; his main text follows the other cited witnesses. The new English follows the bounded-secondary grammar. Pointing, capitalization and accents also differ. The main ancient cue is literally Per.; the generic short cue Per Dominum. is separately printed in this edition at p.106, parent artifact p.199, and is not expanded here. Independently printed short-cue source: passage.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.english-completion-20261029-postconciliar-ordinary-four-short-conclusion-cues-source. The comparison is bounded to the inspected secondary digitally typeset 2002 reproduction; printed-2002 fidelity and correspondence to 2008 remain unresolved. The English is new project study English from the independently witnessed ancient expression with only the explicitly described changes, never approved liturgical English or a text for recitation. The separate approved-English or historical-antecedent unavailable record is retained exactly in the dated review receipt; its witness-specific restriction remains applicable. No ICEL wording was consulted for the drafts."
