notes = "Both candidate transfers were refused. The Vigil changes videamus to videre mereamur, moves Redemptorem and omits Filium tuum before Qui tecum. The Night changes cognovimus to agnovimus and reorders the clauses; both sources retain a Qui tecum conclusion cue at different lengths. These are substantive body variants. The indexed historical candidates are leads rather than a new page-image collation of their source editions. This verifies only the secondary 2002 artifact reading; printed-2002 fidelity and 2008 correspondence remain unestablished. No English or protected Latin body is retained."
