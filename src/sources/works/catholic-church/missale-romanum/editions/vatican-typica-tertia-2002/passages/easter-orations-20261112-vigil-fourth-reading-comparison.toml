notes = "Replace Ecclesia tua magna jam ex parte with Ecclesia tam magna ex parte iam: remove tua, add tam before magna, and move iam after ex parte. This is a real possessive/intensifier and word-order variant. The1862 text already has in honorem and ex parte; no further insertion is inferred from the older Gelasian reading. Normalize jam/iam, accents and pointing. Replace old abbreviated Per Dominum. with the separately witnessed full Per Christum Dominum nostrum. and marked R.Amen. Project-created study English from a complete independently old prayer, with the individually documented changes and a separately witnessed full conclusion. The modern comparison is a secondary digital 2002 witness; agreement with printed 2002 and the exact 2008 text remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation."
