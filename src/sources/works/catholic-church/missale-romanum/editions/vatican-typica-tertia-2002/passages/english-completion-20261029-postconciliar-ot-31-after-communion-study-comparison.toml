notes = "The bounded-secondary reading has refecti caelestibus where the ancient reading has divinis vegetati; these are two substituted words and their local order. Domine and quaesumus exchange order; pointing, capitalization and accents also differ. Every other petition word agrees. The ancient cue is literally Per.; Per Christum. is independently printed in this edition at p.106, parent artifact p.199, and is not expanded here. The new English follows refreshed/heavenly and does not transfer the older human English rendering divine. The historical-antecedent refusal remains correct for that different witness. Independently printed short-cue source: passage.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.english-completion-20261029-postconciliar-ordinary-four-short-conclusion-cues-source. The comparison is bounded to the inspected secondary digitally typeset 2002 reproduction; printed-2002 fidelity and correspondence to 2008 remain unresolved. The English is new project study English from the independently witnessed ancient expression with only the explicitly described changes, never approved liturgical English or a text for recitation. The separate approved-English or historical-antecedent unavailable record is retained exactly in the dated review receipt; its witness-specific restriction remains applicable. No ICEL wording was consulted for the drafts."
