context = "The six numbered rubrics headed Tempus per annum, standing before the Sunday and weekday Masses of Ordinary Time. Rubric 1 gives the season\u2019s boundaries and its thirty-four or thirty-three weeks; rubric 2 gives the Missal\u2019s own rule for counting the Sundays and weeks, including the omission of the first week that would have been taken after Pentecost when the weeks are thirty-three; rubric 3 states that thirty-four Masses are provided, that on Sundays the Mass answering to the Sunday number is used unless a solemnity or feast of the Lord takes the Sunday\u2019s place, and that on weekdays any of the thirty-four Masses may be said; rubrics 4-6 govern the Gloria and Creed, the preface, and the two communion antiphons."
