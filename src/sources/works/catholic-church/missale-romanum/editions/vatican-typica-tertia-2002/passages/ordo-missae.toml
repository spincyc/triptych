context = "The complete Order of Mass was read in the exact artifact: the Introductory Rites (nn. 1-9, with the three forms of the Penitential Act, the Kyrie and the Gloria), the Liturgy of the Word (nn. 10-20, including both Creeds at nn. 18-19 and the rubric introducing the Universal Prayer at n. 20), the Preparation of the Gifts (nn. 21-30), the common opening of the Eucharistic Prayer with the dialogue and Sanctus (nn. 31-32) and the prefaces that follow, the Roman Canon (nn. 83-98), Eucharistic Prayer II (nn. 99-106), Eucharistic Prayer III (nn. 107-115), Eucharistic Prayer IV (nn. 116-123), the Communion Rite (nn. 124-139) and the Concluding Rites (nn. 140-146), together with the solemn blessings and prayers over the people that follow."
artifact_page_ranges = [[303, 383]]
verified_on = "2026-07-25"
notes = "The controlling artifact is a secondary digitally typeset reproduction of the 2002 third typical edition, not the printed altar book and not the 2008 emended reprint. Its typesetting carries visible defects (occasional lost word spacing, a stray character for the cross sign, and at least one displaced fragment in the appendix), so wording claims are made only where the reading is unambiguous. Points at which the 2008 reprint differs are controlled separately by the Notitiae 44 (2008) variation list, not by this passage. Page range corrected 2026-10-01 from the [[290, 348]] first recorded, which began inside the Proper of Time (Dominica XXVI per annum ends on artifact p. 290; Christ the King ends on p. 303) and stopped inside the Roman Canon (nn. 83-98, pp. 347-354). The correction was checked against the artifact re-acquired 2026-10-01 from the registered source_url with bytes identical to the registered SHA-256: the heading ORDO MISSAE and n. 1 follow the Christ the King postcommunion on artifact p. 303; n. 146 and the heading BENEDICTIONES IN FINE MISSAE ET ORATIONES SUPER POPULUM fall on p. 370; the heading ORATIONES SUPER POPULUM is on p. 379; and the last prayer over the people (n. 28) ends on p. 383, where the headings of the Cantus ad precem eucharisticam and the Ordo Missae cuius unus tantum minister participat begin. The range therefore covers what the locus and context name, nn. 1-146 with the solemn blessings and prayers over the people; the registered sub-passages for nn. 1-146 run pp. 303-370 within it."
