notes = "The controlling artifact is a secondary digitally typeset reproduction of the 2002 third typical edition, not the printed altar book and not the 2008 emended reprint. Its typesetting carries visible defects (occasional lost word spacing, a stray character for the cross sign, and at least one displaced fragment in the appendix), so wording claims are made only where the reading is unambiguous. Points at which the 2008 reprint differs are controlled separately by the Notitiae 44 (2008) variation list, not by this passage."
