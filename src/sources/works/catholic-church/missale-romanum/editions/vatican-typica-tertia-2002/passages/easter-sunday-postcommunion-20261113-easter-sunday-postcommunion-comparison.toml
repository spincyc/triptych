notes = "Replace prosequere with tuere, changing the request to attend/accompany the Church in loving favor to guard her. Replace resuscitata with renovata, changing raised/revived to renewed by the paschal mysteries. Replace the actually printed old Per Dominum nostrum cue with the modern Per Christum cue, using the whole independently old Per Christum Dominum nostrum. R. Amen. formula from PustetAP776. Mechanically normalize historical u/v, stress accents, ligatures and punctuation. No additional clause or changed word order is supplied. Project-created adapted study English from a complete 1712 Ambrosian Easter Day prayer, with two substantive verb replacements and a separately witnessed full conclusion and marked response. The comparison is a secondary digital 2002 Roman prayer; agreement with printed 2002 and exact 2008 wording remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation."
