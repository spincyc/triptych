context = "Under TEMPUS NATIVITATIS, Die 25 decembris, IN NATIVITATE DOMINI, Sollemnitas, the heading Ad Missam in Vigilia is followed by a one-sentence rubric (incipit Hæc Missa adhibetur vespere diei 24 decembris) directing that this Mass is used on the evening of 24 December, either before or after First Vespers of the Nativity. The Vigil Mass's entrance antiphon (Cf. Ex 16, 6-7) follows; the same page closes the 24 December formulary (communion antiphon Lc 1, 68)."
