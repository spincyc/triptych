notes = "Normalize the old spelling intelligentia to the modern comparison intellegentia. All substantive petition words and their order are unchanged. Normalize ligatures, stress accents, case, punctuation and print line wrapping; the old source already prints festi, recursu and lavacro, so no grammatical repairs of those words are imported from the modern text. The old printed Per. cue is retained as such in the historical body. The receiving Per Dominum cue is assembled as the full Father-addressed conclusion actually printed in secondary2002IGMR54, separately and completely witnessed with distinct R.Amen in Pustet1862AP88. No expansion is falsely attributed to Mabillon. Project-created study English from the complete Gallican post-nomina prayer printed in 1729, with one spelling normalization and a separately witnessed full 1862 conclusion and marked response. The comparison is a secondary digital 2002 Roman Collect; agreement with printed 2002 and the exact 2008 text remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation."
