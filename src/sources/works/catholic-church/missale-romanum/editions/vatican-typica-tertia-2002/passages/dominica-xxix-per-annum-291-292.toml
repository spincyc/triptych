context = "The complete Week XXIX Latin formulary, from its heading Dominica XXIX per annum and the Entrance antiphon's rubric at the foot of artifact page 291, after the Post communionem of Week XXVIII, to the end of artifact page 292, before the heading Dominica XXX per annum. Element order read: Ant. ad introitum with the locator Cf. Ps 16, 6.8 (Ego clamavi, quoniam exaudisti me, Deus); Collecta Omnipotens sempiterne Deus, fac nos tibi semper, with the long conclusion Per Dominum; Super oblata Tribue nos, Domine, quaesumus, donis tuis, with Per Christum; Ant. ad communionem with the locator Cf. Ps 32, 18-19 (Ecce oculi Domini super timentes eum); a second antiphon under Vel: with the locator Mc 10, 45 and no Cf. (Filius hominis venit); Post communionem Fac nos, quaesumus, Domine, caelestium rerum, with Per Christum. No Offertory antiphon, proper Preface or other unit is printed."
