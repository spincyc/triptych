notes = "Read in the rendered text of this digitally typeset secondary reproduction. Restricted: describe only. Marialis cultus 4 cites this preface twice (AAS 66 p. 118), and the 1969 Commentarius (Calendarium Romanum p. 61) calls the two prefaces new and the markers of Advent's two parts."
