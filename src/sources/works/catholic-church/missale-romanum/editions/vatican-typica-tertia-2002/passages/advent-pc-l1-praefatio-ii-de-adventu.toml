context = "Praefatio II de Adventu, 'De duplici exspectatione Christi' (n. 34): said in Masses of the season from 17 to 24 December and in other Masses of those days that lack a proper preface. Its embolism: all the prophets foretold Christ, the Virgin Mother awaited him with love beyond telling, John sang of his coming and pointed him out when he came; he grants us to anticipate the mystery of his Nativity with joy, so that he may find us watchful in prayer and exultant in his praise."
