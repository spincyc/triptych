context = "Read in the rendered text of the artifact. The Roman Canon from Te igitur to the doxology, with one sign of the cross prescribed at et benedicas hac dona; the proper forms of Communicantes for Christmas, Epiphany, Easter, the Ascension and Pentecost and the paschal Hanc igitur; the second and third groups of saints in Communicantes and Nobis quoque and the concluding Per Christum Dominum nostrum. Amen of Communicantes, Hanc igitur, Supplices and Memento etiam printed within parentheses, which the rubric at n. 32 permits to be omitted; the institution narrative reading hoc est enim Corpus meum, quod pro vobis tradetur and hic est enim calix Sanguinis mei novi et aeterni testamenti, qui pro vobis et pro multis effundetur in remissionem peccatorum, followed by Hoc facite in meam commemorationem; and the acclamation Mysterium fidei with three responses."
