context = "Read in the rendered text of the artifact. The marginal numbers establish this exact sequence inside the Roman Canon: Te igitur n. 84; Memento, Domine n. 85; Communicantes n. 86; Hanc igitur n. 87; Quam oblationem n. 88; Qui pridie nn. 89-90; the acclamation Mysterium fidei n. 91; Unde et memores n. 92; Supra quae n. 93; Supplices n. 94; Memento etiam n. 95; Nobis quoque n. 96; Per quem n. 97; and the doxology Per ipsum n. 98. The same pages prescribe one sign of the cross at et benedicas hac dona; print the proper forms of Communicantes for Christmas, Epiphany, Easter, the Ascension and Pentecost and the paschal Hanc igitur; print the second and third groups of saints in Communicantes and Nobis quoque and the concluding Per Christum Dominum nostrum. Amen of Communicantes, Hanc igitur, Supplices and Memento etiam within parentheses, which the rubric at n. 32 permits to be omitted; and carry the institution narrative readings hoc est enim Corpus meum, quod pro vobis tradetur and hic est enim calix Sanguinis mei novi et aeterni testamenti, qui pro vobis et pro multis effundetur in remissionem peccatorum, followed by Hoc facite in meam commemorationem, then the acclamation with three responses."
artifact_page_ranges = [[347, 354]]
verified_on = "2026-08-27"
notes = "The controlling artifact is a secondary digitally typeset reproduction of the 2002 third typical edition, not the printed altar book and not the 2008 emended reprint. Its typesetting carries occasional defects, so wording claims are made only where the reading is unambiguous. The marginal numbering was re-read on 2026-08-27 from a newly streamed response whose SHA-256 exactly matched artifact_sha256; the PDF was not retained by that check."
