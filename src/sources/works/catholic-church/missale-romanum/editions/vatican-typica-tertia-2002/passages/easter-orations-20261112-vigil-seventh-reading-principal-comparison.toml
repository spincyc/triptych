notes = "Omit tuae mirabile after Ecclesiae. The old your/wondrous modifiers are not translated as though retained. Insert Christum after per ipsum, while removing the old concluding explicit identification Dominum nostrum Jesum Christum Filium tuum and abbreviated Qui tecum vivit. The named referent is already supplied in the same complete old prayer; it is relocated and shortened, not independently newly composed theology. The1862 text already has et lumen and tranquillius. Those words do not require synthesis from Gelasian apparatus variants. Use the separately witnessed complete Qui vivit et regnat in saecula saeculorum. conclusion and marked R.Amen, with their old sources declared separately. Normalize dejecta/deiecta, accents, ligatures and pointing. Project-created study English from a complete independently old prayer, with the individually documented changes and a separately witnessed full conclusion. The modern comparison is a secondary digital 2002 witness; agreement with printed 2002 and the exact 2008 text remains unestablished. This is neither historical human English nor approved liturgical English, and is not for recitation."
