notes = "Corrected on 2026-09-25. The record formerly gave artifact pages 302-303 and printed pp. 487-488, verified 2026-07-28. In these bytes pages 302-303 carry the end of the Solemnity of Christ the King and the heading Ordo Missae, and the artifact's own Index generalis places Tempus per annum at printed p. 450, the Most Holy Trinity at p. 485 and the Body and Blood of Christ at p. 489, so printed pp. 487-488 fall within the Trinity formulary and cannot hold an Ordinary Time Sunday. The artifact is a digitally typeset secondary reproduction without folio numbers, so no printed page is asserted: the index places the formulary after printed p. 450 and before p. 485 without fixing it. Re-read on 2026-09-25 in the text layer and in rendered page images of pages 289-290 and 302-303 of a byte-identical, hash-matched copy of the artifact; the bytes are not retained. The same formulary is also recorded, from an independent reading on 2026-09-24, as passage.catholic-church.missale-romanum.vatican-typica-tertia-2002.dominica-xxvi-per-annum-289-290; since this correction the two records agree on artifact pages 289-290 and neither asserts a printed page. Both are kept because each is bound by a different consumer. Revised again on 2026-09-25 after independent review, from a further hash-matched copy read in its text layer with word positions: the heading, formerly placed in the lower half of page 289, stands about halfway down it, at y 378-397 of an 842-point page whose text runs from y 107 to 745; and the context no longer transcribes the Collect's petition. No protected formulary text is centrally transcribed beyond the incipit and the one word the reception claim turns on. This passage does not establish the 2008 reprint typography or any vernacular altar-book rendering."
