context = "The complete Week XXVI Latin formulary. The heading stands about halfway down artifact page 289, after the Post communionem of Week XXV, and the formulary ends on artifact page 290 immediately before the heading Dominica XXVII per annum. Its Collect, Deus, qui omnipotentiam tuam, reads gratiam in its petition and supplies the bounded postconciliar liturgical reception of the mercy-and-omnipotence axiom with the gratiam form."
