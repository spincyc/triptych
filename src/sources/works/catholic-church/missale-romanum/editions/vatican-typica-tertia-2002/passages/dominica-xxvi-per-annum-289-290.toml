notes = "Read on 2026-09-24 from the exact hash-matched artifact, fetched whole over verified TLS from its recorded location into ignored scratch space by the research stage of PC-S52-A; the bytes are not retained. Read in the text layer. No protected formulary text is centrally transcribed. The artifact is a digitally typeset secondary reproduction without folio numbers, so no printed page is asserted. The earlier record passage.catholic-church.missale-romanum.vatican-typica-tertia-2002.dominica-xxvi-per-annum gives artifact pages 302-303 and printed pp. 487-488 for this formulary; in these bytes pages 302-303 carry the end of Christ the King and the Ordo Missae heading. That record belongs to its consumer and is left unchanged; this record locates the formulary as read. It does not establish the 2008 reprint or any vernacular altar-book text."
