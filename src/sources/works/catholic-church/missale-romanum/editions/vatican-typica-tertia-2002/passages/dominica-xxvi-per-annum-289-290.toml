context = "The complete Week XXVI Latin formulary. The heading stands about halfway down artifact page 289, after the Post communionem of Week XXV, and the formulary ends on artifact page 290 immediately before the heading Dominica XXVII per annum. Element order read: Ant. ad introitum with the locator Dan 3, 31.29.30.43.42 and no Cf.; Collecta with the long conclusion Per Dominum; Super oblata with Per Christum; Ant. ad communionem with the locator Cf. Ps 118, 49-50; a second antiphon under Vel: with the locator 1 Io 3, 16; Post communionem ending Qui vivit et regnat in saecula saeculorum. No Offertory antiphon, proper Preface or other unit is printed."
artifact_page_ranges = [[289, 290]]
notes = "Read on 2026-09-24 from the exact hash-matched artifact, fetched whole over verified TLS from its recorded location into ignored scratch space by the research stage of PC-S52-A; the bytes are not retained. Read in the text layer. No protected formulary text is centrally transcribed. The artifact is a digitally typeset secondary reproduction without folio numbers, so no printed page is asserted. When this record was made, the earlier record passage.catholic-church.missale-romanum.vatican-typica-tertia-2002.dominica-xxvi-per-annum gave artifact pages 302-303 and printed pp. 487-488 for this formulary; in these bytes pages 302-303 carry the end of Christ the King and the Ordo Missae heading. That record belonged to its consumer and was left unchanged then; this record located the formulary as read. It does not establish the 2008 reprint or any vernacular altar-book text. Corrected on 2026-09-25: the earlier record now gives artifact pages 289-290 and asserts no printed page, so the two records agree; both are kept because each is bound by a different consumer. The same day, after independent review, the heading's position here was corrected from the lower half of page 289 to about halfway down it, measured in the text layer of a further hash-matched copy at y 378-397 of an 842-point page whose text runs from y 107 to 745; the element order above was re-read on that copy and nothing else differs."
