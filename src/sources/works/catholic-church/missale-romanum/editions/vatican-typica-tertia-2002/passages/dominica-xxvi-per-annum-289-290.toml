context = "The complete Week XXVI Latin formulary. The heading stands in the lower half of artifact page 289, after the Post communionem of Week XXV, and the formulary ends on artifact page 290 immediately before the heading Dominica XXVII per annum. Element order read: Ant. ad introitum with the locator Dan 3, 31.29.30.43.42 and no Cf.; Collecta with the long conclusion Per Dominum; Super oblata with Per Christum; Ant. ad communionem with the locator Cf. Ps 118, 49-50; a second antiphon under Vel: with the locator 1 Io 3, 16; Post communionem ending Qui vivit et regnat in saecula saeculorum. No Offertory antiphon, proper Preface or other unit is printed."
