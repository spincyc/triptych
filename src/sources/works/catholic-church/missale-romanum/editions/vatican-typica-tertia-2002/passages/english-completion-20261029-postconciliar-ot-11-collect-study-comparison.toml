notes = "The bounded-secondary reading adds the single adverb semper before auxilium, moves invocationibus nostris before adesto propitius, and moves gratiae tuae before praesta auxilium. The exequendis/exsequendis difference is received spelling; pointing, capitalization and accents also differ. All other petition words and the literal short conclusion agree. The new English renders the added adverb as always. The existing approved ICEL English absence remains true for that witness and the stated surfaces; this independently authored study translation does not lift that restriction or reuse its wording. The comparison is bounded to the inspected secondary digitally typeset 2002 reproduction; printed-2002 fidelity and correspondence to 2008 remain unresolved. The English is new project study English from the independently witnessed ancient expression with only the explicitly described changes, never approved liturgical English or a text for recitation. The separate approved-English or historical-antecedent unavailable record is retained exactly in the dated review receipt; its witness-specific restriction remains applicable. No ICEL wording was consulted for the drafts."
