notes = "Uncorrected OCR used only as a locating aid for four comparisons: the resumption rubric printed after the Twenty-third Sunday after Pentecost, which this witness carries in wording matching the 1962 Missal apart from its internal page cross-reference (445 for 422) and the grade Semiduplex; the note fixing the Ember Days by the third Sunday of Advent, the first Sunday of Lent, Pentecost Sunday, and the feast of the Exaltation of the Holy Cross; Additiones et Variationes, De occurrentia et de translatione festorum, n. 6, on resuming an impeded Sunday's Mass within the following week; and the same Additiones et Variationes on the pre-1960 ceiling of orations, which must not exceed seven and must keep an odd number. It controls no published wording and no page-image collation was performed."
