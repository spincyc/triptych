notes = "THE ITEM'S TITLE SAYS 1920 AND THE BOOK IS NOT THE 1920 BOOK. The retrieving lane read it as a 2004 reimpressio (Bonn, Aedibus Palmarum) of the twenty-eighth edition conformed to the 1920 typical edition, carrying the 1920 approbation decree. It is registered as its own edition for that reason and must not be merged with edition.catholic-church.missale-romanum.vatican-typica-1920, which is the typical edition itself, nor with the sibling Benziger editio IV iuxta typicam. The rubric wording is authentic to the edition it reprints; the pagination is the reprint's, and the book's own internal page cross-references print as unresolved '000', which is a reliable tell that a reader is holding the reimpressio."
