notes = "Bonn capitalizes Sancti and prints a comma after quaesumus.; The source prayer crosses a page turn: Secreta and Per Domi- on printed 394, followed by num . . . in unitate ejusdem Spiritus. at the top of printed 395.; The inherited 1962 body prints Per Dominum nostrum ... in unitate ejusdem.; Bonn has no nostrum in its literal cue and explicitly prints Spiritus. Independent primary source review by genitrice_extra accepted these exact three transcriptions on 2026-10-26 (SOURCE-REVIEW SHA-256 f94be8d23b3bb2fed9c80ccb0643693b720dd857fddb8ee2e3df1e4618a87f7d); adopted by the root coordinator for this Bonn witness state only."
