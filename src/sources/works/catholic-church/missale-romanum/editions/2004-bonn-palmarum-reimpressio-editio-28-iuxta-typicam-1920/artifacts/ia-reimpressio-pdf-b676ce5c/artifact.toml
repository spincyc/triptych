rights_basis = "MAINTAINER DECISION, 2026-10-19: the files circulating as the 1920 typical edition, which are these bytes, are public domain for their 1920 content and may be retrieved and used as the witness of the pre-1955 recension. The decision does not reach text first published in 1931 or later. This printing is a conformed 28th edition of about 1954 and carries such additions, for example the Immaculate Heart (1944) and St Pius X (1954) in the local supplement. Under guidance/missals.md section 5 those remain Holy See texts restored in the United States, so the artifact as a whole keeps `unresolved` and its payload is not installed; the expected-target inventory separates post-1922 additions so the split stays visible. The earlier assessment follows. Rights in these exact bytes are not established and are not assumed. The book is a 2004 printing by Aedibus Palmarum at Bonn; a 2004 typesetting is a twentieth- and twenty-first-century publisher's work whatever the age of the liturgical text inside it, no statement of terms for this file was located by the retrieving lane or by this registration, and 17 U.S.C. 103(b) protects nothing in the preexisting 1920 material but says nothing about the new setting. `unresolved` also keeps the guard that matters, since TRACKABLE_RIGHTS excludes it and nothing may install the payload. What a reader with no network opens instead for the 1920 rubrics is the tracked 1889 Desclee text layer registered in this same family, which is pre-1931 and publishable, and the tracked 1862 Pustet and 1570 Venice texts this library already holds; what is genuinely not reopenable offline is this reimpressio's own pagination, which no claim should rest on. Its 16.79 MB size is a second and independent reason."
