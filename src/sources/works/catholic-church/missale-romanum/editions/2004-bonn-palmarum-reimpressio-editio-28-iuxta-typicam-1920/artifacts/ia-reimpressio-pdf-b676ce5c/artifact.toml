notes = "Extent as the retrieving lane measured it: NOT the 1920 book: a 2004 reimpressio (Bonn, Aedibus Palmarum) of the 28th edition conformed to the 1920 Vatican typical edition, carrying the 25 July 1920 decree of approbation. Complete volume with text layer; rubric wording authentic, pagination the reprint's, and its internal page cross-references print as unresolved '000'. These same bytes circulate widely under the label '1920 typical edition'. On 2026-10-19 the following were all identified with this artifact: musicasacra.com pdf/romanmissal_classical.pdf (downloaded; SHA-256 matched), cdn.restorethe54.com missaleromanum-1920.pdf (same length; ETag matches this file's MD5), Isidore item 3453 (downloaded; SHA-256 matched), and about ten Internet Archive items (same size and IA-reported SHA-1). None is a separate witness, and none authenticates the 1920 Vatican impression."
