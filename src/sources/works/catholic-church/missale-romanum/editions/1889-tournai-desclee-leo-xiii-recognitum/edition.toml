notes = "A licensed publisher's edition conformed to the Roman books, NOT a typical edition; it must not be merged with any Vatican typical edition record in this family. The imprint is read off the registered bytes: 'Societatis S. Joannis Evangelistae in hac civitate Tornaci', the approbation dated 'Tornaci, die XIX. Aprilis, anno MDCCCLXXXIX'. guidance/missals.md section 6 lists the 1884 instrument, reached through the 1889 Desclee printing, as the cheapest gap-closure in that file and says the task is a reading rather than an acquisition; this record is the acquisition half of it, and the reading is not done here. What this run used the book for was one point only, the general rubrics as a Leonine-era witness."
