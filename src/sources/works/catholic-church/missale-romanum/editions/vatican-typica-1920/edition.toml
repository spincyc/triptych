notes = "The typical edition of Benedict XV: the Missal reset to follow Pius X's reform of the Psalter and Breviary. Its own approbation decree, printed at the head of the scanned copy and transcribed in the text layer at lines 7 to 64, states exactly what it changed and what it did not -- the edition is drawn from the typical edition of 1900 (`ex altera typica anni 1900 deprompta`) and innovates only what followed from the recent liturgical prescriptions and from the additions and variations introduced into the typical Breviary approved by decree of 25 March 1914 under the bull Divino afflatu and the motu proprio Abhinc duos annos, together with an appendix of Masses proper to particular places. THIS RECORD NAMES THE TYPICAL EDITION, NOT THE PRINTING SCANNED. The one artifact held is a scan whose text layer carries no title page, imprint, or copyright leaf; a licensed publisher's edition conformed to this typical edition would reprint the same approbation decree, so the decree alone does not establish that these bytes are the Vatican Polyglot printing rather than an editio iuxta typicam. The sibling edition.catholic-church.missale-romanum.unidentified-pre-1955-witness-ia-1947 is exactly such a conformed publisher's edition, a Benziger Brothers editio IV iuxta typicam Vaticanam, and the two must not be merged: that one is a New York printing of about 1942, this one is the typical edition it was conformed to. If a later reading identifies the printing of these bytes as a publisher's, the artifact moves to a new edition record for that printing and this record keeps the typical edition. THIS IS THE LAST TYPICAL EDITION BEFORE THE 1955 SIMPLIFICATION AND THE 1960 CODE. Its rubrics are the pre-1955 ones -- the double, semidouble, and simple grades run throughout the scanned text layer, `semiduplex` alone appearing 169 times -- and its Holy Week is the pre-1955 one, the Ritus servandus directing the deacon through the prophecies of Holy Saturday from the first prophecy to the blessing. The appendix of Masses `PRO ALIQUIBUS LOCIS` that the approbation decree announces is in fact present in the scan, so the copy is a printing of the announced contents and not an abridgement of them. It is a witness to the state of the Roman Missal that the 1962 edition revised, not to the 1962 edition."
