publication = "Missale Romanum ex decreto sacrosancti Concilii Tridentini restitutum, S. Pii V Pontificis Maximi iussu editum, aliorum Pontificum cura recognitum, a Pio X reformatum et Benedicti XV auctoritate vulgatum. Approved as the typical edition by decree of the Sacred Congregation of Rites of 25 July 1920. Internet Archive item MissaleRomanumBenedettoXV."
