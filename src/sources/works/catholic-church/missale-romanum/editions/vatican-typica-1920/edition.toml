notes = "The typical edition of Benedict XV: the Missal reset to follow Pius X's reform of the Psalter and Breviary. Its own approbation decree, printed at the head of the scanned copy and transcribed in the text layer at lines 7 to 64, states exactly what it changed and what it did not -- the edition is drawn from the typical edition of 1900 (`ex altera typica anni 1900 deprompta`) and innovates only what followed from the recent liturgical prescriptions and from the additions and variations introduced into the typical Breviary approved by decree of 25 March 1914 under the bull Divino afflatu and the motu proprio Abhinc duos annos, together with an appendix of Masses proper to particular places. THIS RECORD NAMES THE TYPICAL EDITION, NOT THE PRINTING SCANNED, AND ON 2026-08-02 THE PRINTING WAS DATED. The one artifact held is a scan whose text layer carries no title page, imprint, or copyright leaf; a licensed publisher's edition conformed to this typical edition would reprint the same approbation decree, so the decree alone never established that these bytes are the Vatican Polyglot printing rather than an editio iuxta typicam. As first written this record left it there, an open gap. It is no longer open, and the answer is later than anyone had drawn: THE SCANNED COPY IS A PRINTING OF 1970 OR LATER. Its appendix carries a whole Mass of St Pius X, canonized 1954, at appendix pages [223]-[224] in the unbroken running sequence, whose rubric grants the Fraternitas sacerdotalis S. Pii X -- erected 1 November 1970 -- a rank of duplex I classis with a privileged octave of the third order. Its body is separately a printing of 1951 to 1954: the Assumption is the Mass Signum magnum of 1950 and still has its common octave, and the Queenship of the Blessed Virgin Mary of 1954, St Joseph the Worker of 1955 and St Pius X in the sanctoral are all absent. The loci and the searches are on the artifact record. THE TEXT IS STILL THIS EDITION'S AND THE RIGHTS ARE NOT. Nine feasts instituted between 1925 and 1955 stand in the scan as full formularies with their ranks, so the scan is a witness to the 1920 typical edition PLUS thirty-five years of accretion, and the artifact accordingly stands `remote` and `unresolved` holding no bytes rather than `tracked` and `public-domain` on the pre-1931 line, which does not reach a page composed in 1944. The 1920 typical edition itself is untouched by any of that: published 1920, out of United States copyright, and under 17 U.S.C. 103(b) no later printing's copyright enlarges anything in it. The sibling edition.catholic-church.missale-romanum.unidentified-pre-1955-witness-ia-1947 is a conformed publisher's edition, a Benziger Brothers editio IV iuxta typicam Vaticanam, and the two must not be merged: that one is a New York printing of about 1942, this one is the typical edition it was conformed to. If a later lane acquires a printing that can be shown to be a 1920 impression, it lands under this record and supersedes the artifact held here. THIS IS THE LAST TYPICAL EDITION BEFORE THE 1955 SIMPLIFICATION AND THE 1960 CODE. Its rubrics are the pre-1955 ones -- the double, semidouble, and simple grades run throughout the scanned text layer, `semiduplex` alone appearing 169 times -- and its Holy Week is the pre-1955 one, the Ritus servandus directing the deacon through the prophecies of Holy Saturday from the first prophecy to the blessing. The appendix of Masses `PRO ALIQUIBUS LOCIS` that the approbation decree announces is in fact present in the scan, so the copy is a printing of the announced contents and not an abridgement of them -- but it is an ENLARGEMENT of them, and that is where its date was finally read. It is a witness to the state of the Roman Missal that the 1962 edition revised, not to the 1962 edition."
