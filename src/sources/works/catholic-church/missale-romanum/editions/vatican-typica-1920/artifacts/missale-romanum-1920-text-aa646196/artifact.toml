rights_basis = "Public domain in the United States because the book was first published outside the United States before the pre-1931 line, and on that ground alone. THE LINE, AND THE YEAR IT WAS DERIVED FOR. Any work first published abroad before 1931 is out of United States copyright; that is the line guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026, correcting the commissioning brief's 'before 1930'. THE LINE MOVES EVERY JANUARY, which guidance/missals.md:249 states in terms, so it is written here as derived for calendar year 2026 and not as a standing rule: on 1 January 2027 it becomes before 1932, and a later reader must re-derive it rather than quote this sentence. THIS IS THE ROW WHERE THE LINE ACTUALLY MATTERS, so the margin is written out: 1920 clears 1931 by eleven years, the line would have to move past 1921 to reach this book, and on its present rate of one year each January that is not before 2032. RESTORATION DOES NOT REACH IT EITHER, and this is stated because it is the mechanism that would otherwise be the objection to a foreign publication of this date. Restoration of a foreign work under 17 U.S.C. 104A grants the remainder of the term the work would have had in the United States, which for a pre-1978 publication is ninety-five years from publication; ninety-five years from 1920 expired at the close of 2015, so there is nothing left to restore and nothing that a Berne accession by the publishing state -- the Holy See's is 12 September 1935, per guidance/missals.md -- could have restored on 1 January 1996. THE SCAN AND ITS TEXT LAYER ADD NOTHING FOR ANYONE TO OWN. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it: this text layer was produced autonomously by the Internet Archive's ABBYY pipeline, converted by abbyy-to-hocr 1.1.37 per the item's own `ocr_converted` field, and there is no author to hold a right in it. NOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, or that the download succeeded. guidance/sources.md:395-400 holds that both are insufficient for `tracked`. There is here not even a host mark to refuse: the item carries no licence, rights, publisher, creator, or date field at all, which the prior lt-hist corpus recorded and then treated as no obstacle, writing '1920 publication treated as public domain in the United States' as a bare assertion with nothing behind it. That assertion happens to reach the same conclusion as this record and is not the ground of it; src/sources/inventories/lt-hist-rights-audit-v1.toml explains at length why a correct conclusion held for no reason is not a basis this repository may inherit."
