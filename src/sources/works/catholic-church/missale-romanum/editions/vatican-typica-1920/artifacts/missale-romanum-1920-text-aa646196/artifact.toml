notes = "WHAT THIS IS: uncorrected optical character recognition of a whole Missal, 123,278 LF-terminated lines, valid UTF-8, no CR bytes. It is registered as a source artifact and nothing more, and it is deliberately NOT structured as liturgical records; the prior lt-hist corpus cut the same text into twelve markdown 'sections' bounded by line ranges over the downloaded file, and reproducing that shape here would reproduce a defect with better provenance attached.\n\nWHY ROUTE (a) WAS NOT TAKEN, AND IT IS NOT AVAILABLE HERE. The pattern this repository uses when a tracked text carries matter its basis does not cover is two stated replayable deletions -- `sed -e '140854,141805d' -e '142275,142800d' SOURCE > OUT` on the Lasance artifact, discrete inserts on audited printed-page boundaries, no interpretive program and no reconstruction. That pattern does not fit this book, and the reason is structural rather than laborious. The post-1920 matter is in at least five different parts of the book at once: eight day-entries interleaved through the kalendarium table at 5372, 6195, 6378, 7284, 7388, 7420, 7856 and 8133; a Praefatio indexed at 43750, 43801 and 46562; occurrence and transfer rubrics at 11241 and 48595-48607; nine sanctoral or temporal formularies at 66667, 72586, 74820, 86104, 86897, 87420, 87798, 92091 and 94367; and the appendix Mass at 120199-120390. AND SOME OF IT IS NOT ADDITIVE AT ALL, WHICH IS WHAT KILLS THE ROUTE RATHER THAN MERELY BURDENING IT. Two of the nine are REPLACEMENTS. The Mass Signum magnum of 1950 displaced the older Assumption formulary, so deleting it leaves 15 August with no Mass at all rather than with the one the 1920 typical edition printed. The Immaculate Heart took 22 August from Ss. Timothy, Hippolytus and Symphorian, who survive in this book only as the commemoration attached to it at kalendarium 7421, and its own rubric at 87803-87804 then suppresses what would otherwise be said of the Assumption octave on that day -- so deleting the 1944 entry leaves 22 August holding a commemoration with no feast to hang on. A deletion cannot restore a displaced text; it can only remove the thing that displaced it and leave the hole. AND THE LIST COULD NOT BE PROVED COMPLETE. There is no copy of the 1920 typical edition in this repository to diff against; the tracked 1570 and 1604 witness the ancient stratum but not what Divino afflatu changed in 1920. A hand-picked deletion list with no control, presented as exhaustive, is the undisclosed editorial hand that src/sources/inventories/lt-hist-rights-audit-v1.toml `[[corrections]]` `the-google-scans-carry-a-stamp-and-not-the-boilerplate` refused in its own words, with the added defect that nobody could check it.\n\nWHAT MAY STILL BE QUOTED, STATED POSITIVELY BECAUSE A RIGHTS RECORD LANDED ON 2026-08-01 DEPENDS ON IT. Everything this repository has so far read out of these bytes is preexisting material of the 1920 typical edition or older, and 17 U.S.C. 103(b) leaves it exactly where it was. Named, with the loci: the Canon Missae at 49251; the Corpus Christi propers at 56316-56590, cited from src/sources/calendars/roman-1962/propers.yaml; the All Souls formularies at 95538-96280, cited from the same file; the Ordo Missae, the Ritus servandus and De defectibus; the Commune Sanctorum orations; and the temporal outside Holy Week. None of it is within a hundred lines of any post-1920 formulary listed above, and all of it is separately witnessed by the tracked venice-1570 and vatican-typica-1604 texts. What must NOT be quoted from these bytes on any basis this repository holds: the nine post-1920 formularies and the Praefatio de D. N. J. C. Rege, at the loci given in `rights_basis`.\n\nOCR QUALITY. Measured by scripts/_ocr_quality.py at a Latin function-word share of 0.2166 over 375,148 tokens, English 0.0345, classified `prose-latin`, and the item's own page_number_confidence is 91 at 600 ppi. The pages are prose and the ordinary damage is still there: word-internal hyphenation at the narrow column measure is preserved as printed, so a search for a word broken across two lines fails; `dccrcta` for decreta at line 87 and `Prxfatio` for Praefatio at line 18849 are typical. ONE SYSTEMATIC LOSS WORTH KNOWING BEFORE SEARCHING. The Missal's internal page cross-references are gone: `ut infra in Canone 000` appears at lines 42536, 42730, 43601 and elsewhere, the printed folio number having been rendered as three zeroes throughout, so this text layer cannot be used to establish the book's own pagination or to follow a proper Communicantes to its page.\n\nTHE DROPPED INITIALS ARE A SEARCH HAZARD, AND ONE OF THEM HID THE DATE OF THE BOOK. Every large ornamental initial is emitted either as line noise or not at all, so `Te igitur` and `Quo primum` are both absent as strings while both texts are present in full. That much was already written on this record on 2026-08-01, as a warning, with those two examples. The next day the same defect was walked into while dating the printing: the Assumption Introit `Signum magnum` of 1950 is stored as `ignum magnum` at line 86903, so a literal search for it returns only the Apocalypse pericope at 68260 and a pro aliquibus locis Mass at 122030, and anyone reading that result as an absence dates the body seven years too early. Do not rest a negative search on this text layer: the raw-line modes establish absence of a string, not absence of a text.\n\nWHAT THE TEXT LAYER CONTAINS AND WHERE. The approbation decree of 25 July 1920 stands at lines 7 to 64; the bull Quo primum follows, headed `PIUS EPISCOPUS / SERVUS SERVORUM DEI` at lines 70 to 74 and opening at line 77 with its ornamental Q dropped, `uo primum tempore ad`; the general rubrics and the Ritus servandus run from about line 9167; the Canon is present entire, headed `CANON` at line 49251 and opening at line 49260, again with the ornamental capital dropped, as `E IGITUR, / clementissi- / me Pater`; and the appendix of Masses `PRO ALIQUIBUS LOCIS` announced by the decree begins at line 113886. The file ends at line 123276 inside the Commune Sanctorum pro aliquibus locis, which is where the book ends and not where the scan was cut short.\n\nIDENTITY. The item was uploaded on 2017-09-19 by a private uploader with an uploader-supplied title, `Missale Romanum (ed. Benedictus PP. XV, 1920)`, and no publisher, creator, date, or rights field. The scan's text layer opens on a running head and carries no title page, imprint, colophon, or copyright leaf anywhere. On 2026-08-01 that was recorded as an open gap -- the printing unestablished, the edition record naming the typical edition rather than the impression. On 2026-08-02 the gap closed in the direction nobody had drawn: the printing is not unknown so much as demonstrably late, 1970 or later on the appendix rubric and 1951-1954 in the body, and the edition record now says so. The date 1920 is the typical edition's own, established from the decree in the bytes, and was never a claim about the year this copy was struck."
