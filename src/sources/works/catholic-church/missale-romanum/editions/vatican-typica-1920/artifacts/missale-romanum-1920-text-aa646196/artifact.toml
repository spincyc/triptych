rights_basis = "UNRESOLVED, AND THE REASON IS THAT THESE BYTES ARE NOT A 1920 PRINTING. This record stood `tracked` and `public-domain` from 2026-08-01 to 2026-08-02 on the ground of first publication before the pre-1931 United States line, `on that ground alone`. That ground was withdrawn on 2026-08-02 by the lane that owned this file, because the scanned book carries matter that was composed decades after 1931 and the pre-1931 line does not reach a page first published in 1944, or 1950, or 1955. WHAT WAS MEASURED, all of it re-verified in the hashed bytes on 2026-08-02 and every locus a physical line of the file named by `sha256` below. Nine post-1920 feasts stand in the book as full formularies with their ranks, not as marginal notes: S. Petri Canisii, canonized and declared Doctor 1925 (kalendarium 6195, formulary 72586); D. N. Jesu Christi Regis, instituted by Quas primas of 11 December 1925 (kalendarium 8133, formulary 94367 under `Dominica ultima Octobris`, `Duplex I classis`, with its own Praefatio indexed at 43750, 43801, 43888, 46553 and 46562 and its transfer and occurrence rubrics at 48595-48607); S. Joannis Mariae Vianney, canonized 1925 and universal 1928 (kalendarium 7284, formulary 86104); S. Joannis Eudes, canonized 1925 (kalendarium 7388, formulary 87420); S. Teresiae a Jesu Infante, canonized 1925 and extended to the universal calendar 1927 (kalendarium 7856, formulary 92091, `Die 3 Octobris ... Duplex`); S. Roberti Bellarmino, canonized 1930, Doctor 1931, feast 1932 (kalendarium 6378, formulary 74820); S. Joannis Bosco, canonized 1934 (kalendarium 5372, formulary 66667, `Die 31 Januarii ... Duplex`); Immaculati Cordis B. M. V., instituted 1944, at the 1944 grade in both places (kalendarium 7420 `duplex II classis`, formulary 87798 `In Festo / Immaculati Cordis B. M. V. / Duplex II classis`); and the Assumption printed with the Mass Signum magnum of 1950, whose Introit stands at 86903 as `ignum magnum apparuit in coelo` -- the dropped ornamental S is the initial this scan loses everywhere, and it is why a search for the string returns the wrong answer. THE DECISIVE ONE IS IN THE APPENDIX AND IT IS NOT A 1944-1954 BOOK. At appendix pages [223]-[224], running heads at lines 120199 and 120295, the Missae pro aliquibus locis carry a whole formulary `Eodem die 3 Septembris / S. Pii X. / Papae et Conf.` (heading 120221) for a pope canonized on 29 May 1954 and given a universal feast in 1955. Its rubric, at lines 120225-120228, reads: `Hoc Festum in Ecclesia universali ritu duplici celebratur, sed pro Fraternitate sacerdotali S. Pii X ritu duplici I classis cum Octava privilegiata III ordinis.` The Fraternitas sacerdotalis Sancti Pii X was erected on 1 November 1970. A rubric granting that body a proper rank and a privileged octave cannot have been composed before it existed, so the book these bytes were scanned from is a printing of 1970 or later, and in no case earlier than 1954. The appendix pagination runs through it unbroken -- [221] at 120048, [223] at 120199, [224] at 120298, [225] at 120394 -- so these are set pages in the sequence and not a slip laid in. WHAT BOUNDS THE BODY, AND WHY THE TWO BOUNDS DISAGREE. The body is a printing of 1951 to 1954: Signum magnum of 1950 is in it, the Assumption still has its common octave (kalendarium 7346, abolished 1955), and the Queenship of the Blessed Virgin Mary of 1954, St Joseph the Worker of 1955, and St Pius X in the sanctoral proper for 3 September are all absent (`Opific` 0 hits, `Reginae` returning only the old pro aliquibus locis indults at 117131 and 117423, `Pii X` occurring at four lines and all four in the appendix). So the body is pre-1955 matter and the appendix is post-1970 matter, bound in one book. Whether the whole was reset for a modern reprint or leaves were substituted cannot be told from a text layer, and it does not matter to this record: the post-1954 matter is in the bytes either way. WHAT THE PRE-1931 GROUND STILL CARRIES, WHICH IS MOST OF THE BOOK AND NOT THIS ARTIFACT. The typical edition of Benedict XV was published in 1920 and is out of United States copyright; nothing here disturbs that, and see the edition record. Under 17 U.S.C. 103(b) the copyright in a later compilation `extends only to the material contributed by the author of such work` and `does not imply any exclusive right in the preexisting material`, so a 1970s printing of the 1920 Missal enlarges nothing in the Canon, the Ordo Missae, the Ritus servandus, the temporal, the Commons or the sanctoral as the typical edition had them. THAT PROPOSITION IS ABOUT THE TEXT AND NOT ABOUT THE FILE, AND CONFLATING THE TWO IS THE ERROR BEING CORRECTED. 103(b) states what a later copyright does not reach; it is not a permission to redistribute what that copyright does reach, and these 2,918,085 bytes contain both. `tracked` in this repository means the exact artifact is lawful to distribute from the repository (guidance/sources.md:375-386), and the exact artifact includes formularies first published in 1925, 1944, 1950 and 1955 abroad, which is squarely inside the URAA restoration analysed at src/sources/inventories/missale-romanum-1962-facsimile-rights-v1.toml `[the_underlying_edition.uraa_conditions]`, and leaves of a post-1970 foreign printing besides, which need no formality to be protected at all. So the file may not sit in Git and the question of who holds what in the added matter is open. `unresolved` means here what it means on the 1962 facsimile: not that nobody looked, but that somebody looked and found matter with no basis. NOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, that the download succeeded, or that the item carries no rights field. guidance/sources.md:395-400 holds the first two insufficient, and the third was never a basis in either direction."
