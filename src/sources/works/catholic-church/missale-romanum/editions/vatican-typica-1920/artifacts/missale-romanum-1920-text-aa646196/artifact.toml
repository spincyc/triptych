notes = "WHAT THIS IS: uncorrected optical character recognition of a whole Missal, 123,278 LF-terminated lines, valid UTF-8, no CR bytes, landed as a plain source artifact and nothing more. It is deliberately NOT structured as liturgical records; the prior lt-hist corpus cut the same text into twelve markdown 'sections' bounded by line ranges over the downloaded file, and reproducing that shape here would reproduce a defect with better provenance attached. Addressability by identity belongs to passage records with real loci over these exact bytes. Until such a passage exists this artifact is a finding aid.\n\nOCR QUALITY, AND IT IS THE BEST OF THE THREE VERSIONS FOLDED IN ON THIS DATE. Measured here by scripts/_ocr_quality.py at a Latin function-word share of 0.2166 over 375,148 tokens, English 0.0345, classified `prose-latin` -- comfortably above the roughly ten per cent at which that tool says running Latin prose sits, and the item's own page_number_confidence is 91 at 600 ppi. The pages are prose and the ordinary damage is still there: word-internal hyphenation at the narrow column measure is preserved as printed, so a search for a word broken across two lines fails; `dccrcta` for decreta at line 87 and `Prxfatio` for Praefatio at line 18849 are typical. ONE SYSTEMATIC LOSS WORTH KNOWING BEFORE SEARCHING. The Missal's internal page cross-references are gone: `ut infra in Canone 000` appears at lines 42536, 42730, 43601 and elsewhere, the printed folio number having been rendered as three zeroes throughout, so this text layer cannot be used to establish the book's own pagination or to follow a proper Communicantes to its page. Quote from this artifact only through a checked passage, and do not rest a negative search on it: the raw-line modes establish absence of a string, not absence of a text.\n\nWHAT THE TEXT LAYER CONTAINS AND WHERE. The approbation decree of 25 July 1920 stands at lines 7 to 64; the bull Quo primum follows, headed `PIUS EPISCOPUS / SERVUS SERVORUM DEI` at lines 70 to 74 and opening at line 77 with its ornamental Q dropped, `uo primum tempore ad`; the general rubrics and the Ritus servandus run from about line 9167; the Canon is present entire, headed `CANON` at line 49251 and opening at line 49260, again with the ornamental capital dropped, as `E IGITUR, / clementissi- / me Pater`; and the appendix of Masses `PRO ALIQUIBUS LOCIS` announced by the decree begins at line 113886. The file ends at line 123276 inside the Commune Sanctorum pro aliquibus locis, which is where the book ends and not where the scan was cut short.\n\nTHE DROPPED INITIALS ARE A SEARCH HAZARD AND ARE NAMED SO THAT NOBODY REPEATS THE MISTAKE MADE WHILE WRITING THIS RECORD. Every large ornamental initial in the book is emitted either as line noise or not at all, so `Te igitur` and `Quo primum` -- the two most quotable openings in a Missal -- are both absent from this text layer as strings while both texts are present in full. A case-insensitive search for either returns only the rubrical references to them. That is the concrete form of the general warning above: an absence here is evidence about the text layer and not about the book.\n\nIDENTITY, AND ITS GAP. The item was uploaded on 2017-09-19 by a private uploader with an uploader-supplied title, `Missale Romanum (ed. Benedictus PP. XV, 1920)`, and no publisher, creator, date, or rights field. The scan's text layer opens on a running head and carries no title page, imprint, colophon, or copyright leaf anywhere, so the printing is not identified: whether these bytes are the Vatican Polyglot printing of the typical edition or a licensed publisher's edition conformed to it cannot be told from them, and the reprinted approbation decree does not distinguish the two because a conformed edition reprints it as well. See the edition record. The date 1920 is the typical edition's own, established from the decree in the bytes, and is not a claim about the year this copy was struck."
