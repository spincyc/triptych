notes = "The official 2008 Notitiae notice identifies this as an emended reprint of the third typical edition, not a new typical edition. It records textual, typographic, color, and layout corrections; generally unchanged principal pagination; omission of the Eucharistic Prayers for Masses with Children; new dismissal formulas; and a concluding Supplementum. No exact complete 2008 altar-book artifact is registered or claimed here."
