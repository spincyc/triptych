notes = "Exact 2500 by 4097 pixel page image of Internet Archive leaf n426 = Printed p. 341, carrying the Secret and the Postcommunion of the same Sunday. THIS IS THE LEAF THAT WAS ASKED FOR. The Postcommunion entry of src/sources/inventories/roman-1962-proper-latin-provenance-v1.toml recorded that the 1862 TEXT LAYER has no `et` before `renova`, at a line boundary in a scan that demonstrably loses material at line boundaries, and stood at provenance_confidence = \"medium\" with the conjunction unproven on the 1862 alone, expressly because that lane could not open a page image. This image is that page. The formulary's verified-propers record reports the page as reading \"Purifica, quaesumus Domine, mentes nostras benignus, et renova coelestibus sacramentis\", with the conjunction standing at the end of the printed line immediately before the turn to `renova` -- exactly where the text layer loses it. This is visual evidence, not OCR: it is not searchable and no negative may be read off it by machine. Whole-document acquisition of this item is registered on this edition as ia-original-page-images-tar-fd220b49 and ia-facsimile-pdf-363d6fc3; this exact BookReader service JPEG is not byte-identical to either, and the Internet Archive does not document the exact generation chain, so no derived_from edge is asserted. Extent as measured by the retrieving lane: One page image, leaf n426 = printed p. 341, carrying the Secret and the Postcommunion with the disputed 'et' before renova; digest identical to verified.md's."
