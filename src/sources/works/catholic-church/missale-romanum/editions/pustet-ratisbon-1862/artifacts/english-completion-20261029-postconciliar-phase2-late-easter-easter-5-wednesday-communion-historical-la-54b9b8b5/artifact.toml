notes = "The one lexical variation is historical Christus against Dominus in the inspected secondary 2002 reproduction; the study English renders the latter common divine title as Lord. Every other body word agrees. The historical Greater Alleluia verse is a complete source-local unit: the leading two Alleluias and V. are chant framing, and the following Exivi a Patre / John 16:28 verse is separate. The historical comma after Christus, full stop before final Alleluja and final capital differ from the modern pointing and case; stress accents and final Alleluja / allelúia spelling differ. These are fully disclosed differences, not an exact historical English transfer. The comparison is bounded to the exact secondary digitally typeset 2002 reproduction; fidelity to printed 2002 and agreement with the 2008 reimpressio remain unresolved. New Triptych study English, not historical human English, not approved liturgical English, and not for recitation. No ICEL English source was used."
