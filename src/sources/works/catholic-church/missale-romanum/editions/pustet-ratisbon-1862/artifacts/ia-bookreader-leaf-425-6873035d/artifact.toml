notes = "Exact 2500 by 4097 pixel page image of Internet Archive leaf n425 = Printed p. 340, carrying the Collect, the tail of the Introit, the Gradual, the Alleluia, the Epistle and most of the Gospel of the Sixteenth Sunday after Pentecost under the running head \"Dominica XVI. post Pentecosten.\" This is visual evidence, not OCR: it is not searchable and no negative may be read off it by machine. Whole-document acquisition of this item is registered on this edition as ia-original-page-images-tar-fd220b49 and ia-facsimile-pdf-363d6fc3; this exact BookReader service JPEG is not byte-identical to either, and the Internet Archive does not document the exact generation chain, so no derived_from edge is asserted. Extent as measured by the retrieving lane: One page image, leaf n425 = printed p. 340 of the Pustet Ratisbon 1862 Missale Romanum, 2500 px wide as requested; digest identical to the one propers/verified.md records for this leaf."
