rights_basis = "The underlying Pustet printing was published at Ratisbon in 1862 and is in the United States public domain by publication date; its maximum possible United States term expired before URAA restoration, ninety-five years from 1862 having run out at the close of 1957, so nothing remained to restore on 1 January 1996. This exact JPEG is a faithful machine page rendition of that public-domain scan and adds no human authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)). The item is a Google digitisation of the New York Public Library copy, and this edition's own text artifact artifact.catholic-church.missale-romanum.pustet-ratisbon-1862.missale-romanum-1862-text-f34bc7cf already settles what that means for these bytes on evidence rather than on a label: Google's front-matter statement and usage guidelines are absent from the item and the only Google matter present is the four-word page-foot stamp, which carries no notice and reserves nothing. The decision relies on the publication date and the mechanical character of the reproduction, not on an Internet Archive or Google rights label."
