notes = "WHAT THIS IS: uncorrected optical character recognition of a whole 1862 Missal, 108,905 LF-terminated lines, valid UTF-8, no CR bytes, landed as a plain source artifact and nothing more. It is deliberately NOT structured as liturgical records, for the reason src/sources/inventories/lt-hist-rights-audit-v1.toml gives about the prior corpus's eight 'sections' over this same file: their only structural claim was a line range over the download, so a comparison of two of them compares the scanner's disagreements rather than the liturgy's. Addressability by identity, this collect of this Mass, belongs to passage records with real loci over these exact bytes. Until such a passage exists this artifact is a finding aid.\n\nREAD THE EDITION RECORD BEFORE CITING THIS TEXT. It is a commercial Ratisbon printing conformed to the Roman text, not a typical edition, and its appendix and its calendar of Masses granted for particular places are the publisher's compilation rather than the Roman book's contents.\n\nTHE GOOGLE QUESTION, DECIDED ON THE BYTES. This is a Google digitisation -- its fifth line OCRs as 'Digitized by Googl' and the stamp stands whole at line 79 -- which is why the fold-in of this book was held back from the three that went first. Two routes were offered: land a derivative with the Google matter removed by one stated replayable transformation, or register the scan remote and unresolved and hold no bytes. NEITHER WAS TAKEN, and the reason is a fact about this file.\n\n  WHAT IS NOT HERE. Google's front-matter statement -- 'This is a digital copy of a book that was preserved for generations on library shelves', the 'Usage guidelines', 'About Google Book Search' -- is ABSENT. Searched case-insensitively over the whole 2,503,914 bytes: 'usage guidelines' 0, 'about this book' 0, 'books.google' 0, 'do not assume' 0, 'watermark' 0, 'non-commercial' 0, 'attribution' 0, 'creative commons' 0, 'all rights' 0, 'public domain' 0, and 'copyright' 0. Not one word of Google-authored prose is in this file, and no notice, licence, reservation or condition of any kind appears in it.\n\n  WHAT IS HERE. The page-foot stamp alone: 546 lines contain the string 'google', and a wider sweep that also catches the mangled forms finds about 904 lines in 238 distinct spellings -- 'Digitized by Google' 470 times, then a bare 'Digitized by' 119 times where the word was cut off, 'Digitized by Googl', 'Digitized by GooqIc', 'Digitized by Goegle', 'kJ by Google', and two hundred more. Four words at the foot of a page. It states who ran the scanner, grants nothing and reserves nothing.\n\n  WHY NOT ROUTE (a), THE DERIVATIVE. Because no single stated transformation removes the stamp, and the file is the proof. A strict pattern on 'Digitized by Google' leaves more than four hundred mangled forms behind, which would misrepresent the derivative as clean. A pattern loose enough to catch 'jitized by Google' and 'd by Google' also matches running Latin: the Ritus servandus and De defectibus are full of 'digiti', 'digitis' and 'digitorum' -- at lines 8751, 8968, 8972, 8975, 9085, 9285 and 9664, among others -- and deleting those lines would cut rubrics about the celebrant's fingers out of a Missal. The honest choices were a stated rule with a known large residue or an unstated hand-picked list, and the second is exactly what the offered route forbids.\n\n  WHY NOT ROUTE (b), REMOTE AND UNRESOLVED. Because 'unresolved' would record a doubt these bytes disprove. The doubt was that a public-domain text had Google's own matter added to it; the search above shows it has not, beyond a four-word stamp with no claim in it.\n\n  AND THE DISTINCTION IS CHECKABLE, NOT CONVENIENT. This repository already holds the contrasting case. `artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr`, Internet Archive item romanmissaltran00englgoog, stands remote and unresolved for precisely this reason and earns it: its lines 1 to 65 are Google's front-matter block entire, 'Usage guidelines' at line 16 and 'About Google Book Search' at line 60 [verified 2026-08-01 on a fetched copy]. That item has the block and no page stamp; this one has the stamp and no block. Same test, opposite findings.\n\n  THE STAMP IS RETAINED, deliberately. It carries no notice and no claim, so removing it buys nothing; it is the only page-boundary evidence in this text layer; and the Lasance fold-in already set the precedent by retaining the 'http://ccwatershed.org' stamp at the foot of every page of its scan. A reader must not mistake it for a rights notice, and must expect it interleaved through any quotation that spans a page break.\n\nOCR QUALITY, AND IT IS THE BEST OF THE FIVE LATIN AND ENGLISH SCANS FOLDED IN FROM THIS CORPUS. Measured here by scripts/_ocr_quality.py at a Latin function-word share of 0.1792 over 357,261 tokens, English 0.033, classified `prose-latin` -- comfortably above the roughly ten per cent at which that tool says running Latin prose sits, and more than twice the 1570's and the 1604's. The reason is the type: this is a clean nineteenth-century roman face on machine paper, not sixteenth-century abbreviated printing. Whole paragraphs of the bulls, the rubrics and the Canon read straight through. The damage that remains is characteristic and not random: the printed accents on the Latin OCR as digits and punctuation ('mis6ric6rdiam', 'D6minum', 'devoti6ne'), so a search for an accented word will fail where the same word unaccented succeeds; running heads fuse to body text; and the tables, the calendar and the errata list -- which are set in small type and columns -- are wreckage. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE. A negative raw-line search over the accented text establishes nothing, for the reason just given.\n\nIDENTITY. The item was uploaded on 2014-12-01 by the Wikimedia Books Uploader bot from a Google scan of the New York Public Library's copy, in collection americana, 922 page images, creator 'Catholic Church', publisher 'Ratisbonae, sumtibus chartis et typis Friderici Pustet', LCCN 33036844, OCLC 7426908, page_number_confidence 84, and the item's PDF derivative is flagged `pdf_degraded = invalid-page-size`. The title page and the colophon were both read here and agree with the catalogue. One date in the back matter did NOT resolve and is recorded as unresolved rather than guessed: a conformity note above the colophon OCRs as 'Concordant cum Originalibus. RAtUbon» 31. HatL 1866.', where the year could be 1862 or 1866 and the month is illegible; nothing in this record depends on it, and it is written down so the next reader does not have to find it again."
