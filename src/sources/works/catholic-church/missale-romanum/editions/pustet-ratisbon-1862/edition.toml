id = "edition.catholic-church.missale-romanum.pustet-ratisbon-1862"
work_id = "work.catholic-church.missale-romanum"
title = "Missale Romanum, the Pustet printing of Ratisbon, 1862: a commercial hand-format printing conformed to the Roman text, NOT a typical edition"
language = "la"
publication = "The title page reads MISSALE ROMANUM EX DECRETO SACROSANCTI CONCILII TRIDENTINI RESTITUTUM, S. PII V. PONTIFICIS MAXIMI JUSSU EDITUM, CLEMENTIS VIII. ET URBANI VIII. AUCTORITATE RECOGNITUM, then ACCURATISSIMA EDITIO CUM ADDITAMENTIS NOVISSIMIS, CUM APPROBATIONE SACRORUM RITUUM CONGREGATIONIS, and beneath that RATISBONAE, MDCCCLXII, SUMTIBUS CHARTIS ET TYPIS FRIDERICI PUSTET. The colophon after the appendix reads Ratisbonae: Ex Officina Fr. Pustet, S. Sedis Apostolicae Typographi. Internet Archive item bub_gb_E7sPAAAAIAAJ, a Google digitisation of the New York Public Library's copy; LCCN 33036844, OCLC 7426908."
date = "1862"
authority = "NO PROMULGATING AUTHORITY OF ITS OWN. The authority this book carries is an approbation, not a promulgation, and the difference is the whole of why this record exists. Ignatius von Senestrey, Bishop of Ratisbon, subscribed letters at Ratisbon on 1 September 1861, printed in the book at lines 712 to 745 of the text layer, which recite that by the decrees of Clement VIII, Urban VIII and others no printer may publish the Roman Missal unless the conformity of the new edition with the Roman archetypes is plainly established and the licence to print it has been sought and obtained from the Ordinary of the place; that two priests were deputed at Frederick Pustet's petition to examine this hand-format edition; that they reported it conformed to the authentic Roman exemplars and that the additions and corrections prescribed by the Sacred Congregation of Rites on 26 September 1860 and by Pius IX on 27 September 1860 and 12 March 1861 had been inserted or noted; and that the bishop therefore approves it and grants licence to publish. That is a licence to print a book, granted by a local ordinary to a commercial firm. It is not an act of the Holy See imposing a text."
jurisdiction = "Roman Rite"
notes = "THIS IS A PRINTING AND NOT A TYPICAL EDITION, AND NOTHING MAY BE INFERRED FROM ITS DATE ABOUT THE HISTORY OF THE RITE. The audit that authorised this fold-in required the point be recorded in terms and named the specific harm: src/sources/inventories/missal-acquisition-audit-v1.toml records that a generator once chained books by date and thereby asserted that a rite descends through a publisher, and 'the 1862 Pustet printing' is one of the two books it was caught on. The schema has no `is_typical_edition` field to carry the denial, so it is carried here, in prose, at the top of the record where a reader meets it before the date.\n\nTHE BOOK SAYS SO ITSELF, TWICE, IN ITS OWN WORDS. Its title page claims only to be an ACCURATISSIMA EDITIO CUM ADDITAMENTIS NOVISSIMIS printed at Pustet's expense and types. Its approbation, quoted under `authority`, is a bishop's licence granted because a printer proved conformity with the Roman archetypes -- the argument of a copy, not of an original. And its publisher's note to the reader, headed Typographus Ratisbonensis Lectori at line 101601, states what was copied: 'Hic finem habet Romana, anno 1856 typis Josephi Salviucci et Francisci filii perfecta editio, quam nostris Ratisbonensibus typis minori hac ac manuali forma reproducendam curavimus' -- here ends the Roman edition completed in 1856 by the press of Giuseppe Salviucci and son, which we have had reproduced in our Ratisbon types in this smaller and hand-sized format. So the text descends from a Rome 1856 printing, itself a printing of the Clement VIII and Urban VIII recension, and this book is a reduced-format reproduction of it. The line of descent is Pius V 1570, Clement VIII 1604, Urban VIII 1634; Salviucci 1856 and Pustet 1862 stand outside it.\n\nWHAT PUSTET ADDED IS ALSO THE PUBLISHER'S AND NOT THE RITE'S. The same note explains the appendix: because many wanted at hand the Masses granted to particular provinces or dioceses which the Roman edition does not contain, the firm gathered the commoner of them out of diocesan and religious Propria printed with their own ordinaries' authority and collected them under the name of an Appendix. Those Masses, and the Calendarium festorum pro aliquibus locis concessorum that follows the colophon, are a publisher's compilation of indults. The front matter likewise carries a stack of Sacred Congregation of Rites decrees of 1861 and 1862 obtained for particular petitioners -- the Japanese Martyrs' Mass at Propaganda Fide's request on 10 July 1862, Blessed John Leonardi for his congregation and the diocese of Lucca on 5 June 1862, a monitum on St Angela Merici of 11 July 1861 -- each of which grants a Mass to somebody, and none of which promulgates a Missal. The publisher's own errata list, headed Emendanda juxta S. Rit. Congregationis decretum de die 25. Sept. 1860, admits that not every sheet was corrected before the decrees were published, so this printing is not even internally uniform.\n\nWHAT THE COPY CARRIES. Quo primum from line 152, the Sacred Congregation decrees and the Ratisbon approbation in the front matter, the Rubricae generales Missalis from line 8001, the Ritus servandus in celebratione Missarum from line 8674, De defectibus in its numbered divisions from line 11015, the temporal and sanctoral Masses, and the Canon entire under the running head CANON MISSAE at line 41068, with Qui pridie quam pateretur at line 41219. The Latin carries printed accents throughout, which the 1570 and 1604 scans in this library do not.\n\nIT IS THE ALTAR BOOK AND NOT A HAND MISSAL, notwithstanding its 'hand-sized format', which means a small altar Missal and not a lay book: it is entirely in Latin, it prints the rubrics for the celebrant, and it has no lay devotions. The English lay missals registered in this library are a different genre and are not witnesses to this or any other Latin edition's text.\n\nFolded in from the sibling ~/git/lt-hist corpus on 2026-08-01 under src/sources/inventories/lt-hist-rights-audit-v1.toml. The corpus dated it 1862-01-01 with `date_precision` year and called its authority 'Catholic Church; Frederick Pustet, Ratisbon', which is a publisher standing where an authority belongs; it divided the text into eight markdown sections whose only structural claim was a line range over the downloaded file, and nothing of that shape is reproduced here."
