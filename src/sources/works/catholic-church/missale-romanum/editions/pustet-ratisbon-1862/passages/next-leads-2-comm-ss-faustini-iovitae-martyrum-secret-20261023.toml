notes = "The complete public-domain counterpart is at the Common of several Martyrs in Paschal time, Pro pluribus Martyribus Pontificibus Secret, not this saint-day entry. Every petition word agrees. Pustet omits the target commas after Adesto and ut. The 1962 full prayer visibly prints Adesto, Domine, and meritis, with no JLJL between supplicationibus and nostris. Calendar j orthography represents printed iustitiae and adiuvemur. Both witnesses actually stop at Per Dominum."
