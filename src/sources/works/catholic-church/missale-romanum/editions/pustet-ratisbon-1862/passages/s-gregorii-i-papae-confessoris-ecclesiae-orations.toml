context = "The proper orations of s-gregorii-i-papae-confessoris-ecclesiae as the 1862 Pustet prints them, cited as the public-domain antecedent showing that the 1962 typical edition's wording at this formulary is preexisting material under 17 U.S.C. 103(b)."
notes = "Loci are over this artifact's retained text layer; no page image of the 1862 was read, its per-leaf image artifacts being remote and not covering this run. That layer destroys ornamental drop capitals and loses occasional syllables at column breaks; where a word of this formulary is affected the ledger row for that oration names it and cites the 1570 or 1604 at the same place. This record makes the wording addressable by identity over these exact bytes, which the artifact's own record requires before it may be cited as anything but a finding aid. The 1862 is a pre-1955 recension and prints its own second and third orations beside these; those are not part of this passage. The Postcommunion locus was added on 2026-10-01. On 2026-10-01 the leaf itself was read for the Postcommunion, on the page image of the registered 1862 facsimile PDF (sha256 363d6fc3) at PDF p. 500, printed p. 414, text-layer lines 59308-59314; those text-layer lines are only the reading's address in this artifact."
