notes = "Every complete petition word agrees. Pustet omits the target comma after ut and inserts a comma after Vincentii. Both independently read pages print Adesto, Domine,; the 1962 has no XI between supplicationibus and nostris. The historical saint-day prayer actually stops at Per Dominum.; its cue is not expanded as if printed. The independently read complete Praesta prayer at PustetPDF390/printed304 witnesses every word in the target longer conclusion contiguously through in unitate. The target actual stop at in unitate is retained, without importing the formula subsequent ejusdem Spiritus sancti Deus. Calendar Jesum represents the target printed Iesum under the established consonantal-i convention."
