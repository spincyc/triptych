notes = "Both page images print ut intercessione beati Gregorii (stress accents omitted here). Neither prints II, and intercessione is one word. The entire petition was read against both witnesses. The 1862 prints Per Dominum. after the petition; the old provenance claim that it prints no conclusion is incorrect. The 1962 prints the retained conclusion through in unitate. The historical decorative initial and small-cap tail read Annue; they are not the recognizer string 4 Nnue. The historical text has no comma after quaesumus; the target punctuation is retained. Read at explicit 2400- and 4800-pixel long-side scales because the whole registered PDF has invalid tiny page boxes; no 200/400-dpi claim is made for those renders. Scope is this complete petition and its actually printed ending, not neighboring orations."
