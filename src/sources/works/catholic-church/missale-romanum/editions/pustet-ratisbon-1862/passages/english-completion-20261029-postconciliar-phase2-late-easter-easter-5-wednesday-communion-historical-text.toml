notes = "Page witness passage.catholic-church.missale-romanum.pustet-ratisbon-1862.english-completion-20261029-postconciliar-phase2-late-easter-easter-5-wednesday-communion-historical-page. The one lexical variation is historical Christus against Dominus in the inspected secondary 2002 reproduction; the study English renders the latter common divine title as Lord. Every other body word agrees. The historical Greater Alleluia verse is a complete source-local unit: the leading two Alleluias and V. are chant framing, and the following Exivi a Patre / John 16:28 verse is separate. The historical comma after Christus, full stop before final Alleluja and final capital differ from the modern pointing and case; stress accents and final Alleluja / allelúia spelling differ. These are fully disclosed differences, not an exact historical English transfer."
