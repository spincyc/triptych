context = "Direct page-image witness to all three complete historical prayers including their Per Dominum conclusions. This printing already carries the Postcommunion Refecti with the saint named Bonifacio; no Common blank or missing petition is supplied by inference."
notes = "Read from the exact complete-PDF page at scale-to 2500 and 5000 pixels. The Collect has Bonifacii, ejus and adjuvemur; the Secret has coelestibus; the Postcommunion has cujus and Bonifacio. The 1962 target has Bonifatii/Bonifatio, eius/adiuvemur/cuius and caelestibus. These are recorded spelling transformations, with target punctuation and unaccented project j orthography; the complete petitions and two-word conclusions agree. This supersedes the current ledger's former wrong page-444 Collect and page-425 Secret antecedent loci only; it does not rewrite their historical source records."
