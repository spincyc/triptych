locus = "Collect at PRIMARY: 1862 printed p. 317, text-layer lines 47806-47814, under the rubric at line 47804, in the mass headed 'IN FESTIVITATE / CORPORIS CHRISTI' at lines 47779-47781. SECOND PRINTING IN THE SAME WITNESS: text-layer lines 84836-84845, in the votive Mass of the Blessed Sacrament in the 1862's appendix, between the bracketed folios [46] (line 84793) and [48] (line 85028); its rubric stands at line 84834.; Secret at PRIMARY: 1862 printed p. 319, text-layer lines 48029-48034, under the rubric at line 48028. SECOND PRINTING IN THE SAME WITNESS: text-layer lines 84962-84966, votive Mass of the Blessed Sacrament in the appendix, rubric at line 84960, between bracketed folios [46] (line 84793) and [48] (line 85028).; Postcommunion at PRIMARY: 1862 printed p. 319, text-layer lines 48055-48061, under the rubric at line 48053. SECOND PRINTING IN THE SAME WITNESS: text-layer lines 84985-84991, votive Mass of the Blessed Sacrament in the appendix, rubric at line 84983, between bracketed folios [46] (line 84793) and [48] (line 85028)."
