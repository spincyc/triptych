notes = "The complete rendered page and both column portions were read. The independent 1862 printing is public domain by publication date. Transcription joins printer hyphenation and omits stress accents, retaining every petition word and the actual abbreviated ending; no modern target source was used as the transcription witness. Source text: Domine Deus virtutum, qui collapsa reparas, et reparata conservas: auge populos in tui nominis sanctificatione renovandos; ut omnes, qui sacro baptismate diluuntur, tua semper inspiratione dirigantur. Per Dominum. The official target relation is separately witnessed in passage.holy-see.variationes-et-additiones-missalis-romani-2008.latin-notitiae-503-504.english-completion-20261029-postconciliar-phase2-pentecost-domine-deus-virtutum. No full ending is reconstructed from Per Dominum."
