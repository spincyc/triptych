notes = "Pustet prints coelestia against target caelestia, omits the comma after ut, and abbreviates Per Dominum. The target ends at in unitate. Pustet Rubricae generales paragraph17 (PDF44) directs the father-addressed conclusion; its PDF390 Praesta formula independently prints Per Dominum nostrum Jesum Christum Filium tuum: Qui tecum vivit et regnat in unitate as one contiguous prefix. No following ejusdem Spiritus sancti Deus is supplied."
