notes = "Pustet omits the target comma after quaesumus, has a comma after verum, prints ejus against target eius, and prints eumdem against target eundem, a received spelling normalization. Its conclusion is Per eumdem Dominum.; Pustet paragraph17 (PDF44) explicitly directs Per eumdem Dominum nostrum etc. for mention of the Son in the opening, and PDF390 supplies the following contiguous conclusion prefix. Target stops at in unitate; no additional formula words are supplied."
