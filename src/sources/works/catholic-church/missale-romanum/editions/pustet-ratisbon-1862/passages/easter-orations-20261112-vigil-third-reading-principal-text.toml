notes = "Old full scalarSHA256 dde4e6616f4b11ee3524a91f6d9c2bdbba2465195cb62998e5a1c4902664dbf8. Controlling complete page passage.catholic-church.missale-romanum.pustet-ratisbon-1862.easter-orations-20261112-vigil-third-reading-principal-page. The entire1862 prayer already combines the RedSea deliverance, baptismal salvation of the nations, Abraham and Israel in precisely this sequence. The two substitutions express the same time relation and the same narrated oppressor, whose name is independently visible in the old reading on this very page. This is not an assembly from Bible fragments. The whole variant and its full ending must be assessed as a finite expression."
