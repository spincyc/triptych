notes = "The complete historical prayer spans PustetPDF116-117/printed30-31, In Circumcisione Domini et Octava Nativitatis. Actual1962 clearly prints unitate. Pustet actually prints Genitrice and coelestis while1962 prints Genetrice and caelestis; these genuine source spelling differences are retained separately, not called OCR damage or silently changed in the historical transcription. Pustet omits the target comma after et. It actually concludes only Per eumdem Dominum., while the target prints the longer Per eundem Dominum nostrum Iesum Christum, Filium tuum: Qui tecum vivit et regnat in unitate. The eumdem/eundem difference and calendar consonantal-j representation Jesum are explicit. The actual historical cue supplies Per eumdem Dominum; independently read PustetPDF390/printed304 Praesta supplies the contiguous longer through-the-Son formula prefix. No words after the target actual stop in unitate are imported, and the historical abbreviated cue is never expanded as if printed. All remaining complete petition words agree; no name or modern body is inferred."
