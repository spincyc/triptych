notes = "The complete June30 primary petition, not February22 Paul and not the following Peter commemoration, is read in all three witnesses. Both older witnesses actually print natalitia;1962 prints natalicia. The exact accepted same-word pair is neuter accusative plural, the direct object of colimus in both full contexts. No commemorationem is substituted. Printed1962 cuius/eius are represented by established calendar cujus/ejus. Pustet omits the target comma after ut; Mame prints a colon after quaesumus where target has a semicolon. Pustet actually ends Per Dominum.; Mame actually ends only Per.; the1962 Paul paragraph has no conclusion or cue and ends sentiamus. It is followed by Et fit commemoratio S.Petri Ap.sub unica conclusione and a distinct Peter Oratio2924. Neither historical cue nor Peter ending is supplied to Paul."
