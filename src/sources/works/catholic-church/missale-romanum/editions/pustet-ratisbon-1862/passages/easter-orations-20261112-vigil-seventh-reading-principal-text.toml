notes = "Old full scalarSHA256 8be0e050cfdf6f11a132b0fd25513b6e8183161236265cf8b3cfc4b585e9d036. Controlling complete page passage.catholic-church.missale-romanum.pustet-ratisbon-1862.easter-orations-20261112-vigil-seventh-reading-principal-page. The complete1862 prayer already contains every salvation/restoration clause and explicitly names the Lord Jesus Christ as the referent of per ipsum and a quo. The modern form omits two modifiers and relocates the Christ identification within the petition while using a complete short conclusion. Its old Noah-reading appointment is different from the modern seventh-readingEzekiel placement. No generic shortening or formula substitution authority is inferred."
