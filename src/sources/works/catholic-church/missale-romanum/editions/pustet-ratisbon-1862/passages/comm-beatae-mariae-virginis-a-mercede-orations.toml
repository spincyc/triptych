locus = "Collect at 1862 Pustet: printed p. 548, text-layer lines 75201-75212, under the heading Oratio. at line 75199, inside the formulary headed at lines 75188-75198 (In Festo B. Mariae Virginis [de Mercede], with the directive Missa. Salve sancta Parens ... praeter Orationes sequentes). The folio marks at lines 75123 (548) and 75249 (549) bound it. This agrees with the locus the calendar entry already records for this day - leaf n633 of Internet Archive item bub_gb_E7sPAAAAIAAJ, printed page 548 - and is the same text reached here through the tracked text-layer artifact rather than through that item. Read from the text layer alone; this book's page images are not available to this lane. Like the 1962 and like the Mame, the 1862 prints ONE proper oration for this day and no proper Secret or Postcommunion: line 75214 onwards leaves the formulary and line 75218 opens Die xxv."
