locus = "Litany of the Saints, first part at 1922 Tours Mame, printed pp. 264-266 (running head Sabbato Sancto), artifact PDF pp. 378-380, READ ON THE PAGE IMAGES at 400 dpi. The Mame prints the litany undivided; its first 45 printed lines carry exactly the 48 invocations of the 1962's first part, and the invocation that follows them on printed p. 266 is Propitius esto - the very point at which the 1962 divides. Corroborated in the tracked 1862 text layer, printed pp. 208-210 (folio markers 208 at line 36441, 209 at 36552, 210 at 36698), litany running lines 36464-36746, where Genitrix stands at 36504, 18 Sancte lines at 36506-36557 and 12 Omnes lines at 36509-36574.; Litany of the Saints, second part at 1922 Tours Mame, printed pp. 266-267 (running head Sabbato Sancto), artifact PDF pp. 380-381, READ ON THE PAGE IMAGES at 400 dpi. Its Propitius esto follows Omnes Sancti et Sanctae Dei with no break at all, and its litany ends with the same three Agnus Dei, the same Christe audi nos / Christe exaudi nos, and the same rubric handing over to the Mass's Kyrie. Corroborated in the tracked 1862 text layer, printed pp. 208-210, lines 36585-36746 (libera lines 36601-36625, domnum 36650, nosmetipsos 36674, Agnus 36714, closing Kyrie 36746)."
physical_line_ranges = [[36464, 36746]]
