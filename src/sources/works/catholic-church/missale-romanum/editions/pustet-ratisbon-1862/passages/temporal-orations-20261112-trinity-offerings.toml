notes = "The complete old Trinity Secret is freshly image-read in Pustet1862 AP400/printed314. The earlier no-ancestor statement is disproved for the prayer family; it never proved that no older source existed. The receiving body omits sancti before nominis. It replaces hujus oblationis hostiam with haec munera nostrae servitutis, and consequently changes per eam to per ea. This is a substantive nominal-object change and associated grammatical agreement, not spelling normalization. The old collocation munera nostrae servitutis is independently printed within a complete older offering prayer in Veronense1896 AP90/printed66; that whole supporting prayer is retained separately. This establishes the collocation’s age but does not independently establish the modern composite as a whole. The source prints only Per Dominum.; the secondary receiving body prints Per Christum. The complete independent old short Per Christum Dominum nostrum. and source-local IGMR77 are separate ending evidence; no source cue is silently expanded. Preparation-agent image read inherited from the hash-bound frozen packet; this staging does not adjudicate rights or fidelity."
