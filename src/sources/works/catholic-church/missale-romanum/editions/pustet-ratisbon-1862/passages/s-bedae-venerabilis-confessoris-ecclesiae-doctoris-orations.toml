locus = "Collect at Mame 1922 (the antecedent here is the Mame, not the 1862): printed p. 602, artifact PDF p. 716, left column lines 2-9, read from the text layer through a bbox-restricted column extraction. The 1862 does not keep this feast: its 27 May, opened at text-layer lines 63646-63676 (approx. printed p. 451), is S. Mariae Magdalenae de Pazzis with a commemoration of John I, Bede's feast having been extended to the universal calendar only in 1899."
