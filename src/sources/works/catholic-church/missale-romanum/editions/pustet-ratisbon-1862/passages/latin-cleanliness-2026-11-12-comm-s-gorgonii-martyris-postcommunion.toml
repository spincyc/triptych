notes = "Both page images print quae as the ae ligature in vegetet: quae in Martyre, not quas. The entire petition was read against both witnesses. The 1862 ends pascatur. and proceeds directly to De Spiritu sancto. Postcomm.; it prints no conclusion at this place, contrary to the old provenance claim of a short conclusion cue. The 1962 prints pascatur: Qui tecum vivit et regnat in unitate.; the existing target punctuation and conclusion remain unchanged. Read at explicit 2400- and 4800-pixel long-side scales because the whole registered PDF has invalid tiny page boxes; no 200/400-dpi claim is made for those renders. Scope is this complete petition and its actually printed ending, not neighboring orations."
