locus = "Collect at 1862 Pustet: printed p. 580, text-layer lines 78920-78931, under the heading Oratio. at line 78918, inside the formulary headed In Festo Praesentationis B. Mariae Virg. at lines 78906-78907. The folio marks at lines 78888 (580) and 79012 (581) bound it. This is the same locus the calendar entry already records for this day (leaf n665 = printed page 580), reached here through the tracked text-layer artifact. Read from the text layer alone; this book's page images are not available to this lane. THE 1862 WRITES THE CONCLUSION OUT IN FULL where the 1962 abbreviates it with an ellipsis - Per Dominum nostrum Jesum Christum Filium tuum: Qui tecum vivit et regnat in unitate ejusdem Spiritus sancti Deus. - so the 1862, not the Mame, is what covers the words Spiritus Sancti at the end of the 1962 text.; Secret at 1862 Pustet: printed p. 580, text-layer lines 78985 and 78987-78992, under the heading Secreta. at line 78984. Line 78986 is empty in the layer and line 78987 opens with a stray I, which is the recogniser breaking up the ornamental initial; the initial itself reads FTlUa, for Tua,. The 1862 prints this Secret AT THE PRESENTATION ITSELF, in full, rather than by directive - which is what the calendar entry for this day already records. Read from the text layer alone. Its haec reads nsec, the characteristic damage this book does to the ae ligature after h; the word is confirmed at the same place by the Mame page image and by the 1962's own second printing."
