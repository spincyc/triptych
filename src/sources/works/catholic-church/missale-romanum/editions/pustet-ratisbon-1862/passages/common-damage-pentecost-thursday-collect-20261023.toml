notes = "Pustet prints sancti with lower-case s and a comma after sapere; the target prints Sancti and a semicolon. The complete petition agrees word for word. Pustet abbreviates the through-the-Lord conclusion but explicitly prints its ejusdem ending; the target writes its actual conclusion through in unitate ejusdem. The independently retained PustetPDF390 Praesta formula supplies that contiguous longer prefix; no following Spiritus sancti Deus is supplied to the target. Opening Deus was read in both page images, including the complete ornamental D; Aeus is recognizer damage."
