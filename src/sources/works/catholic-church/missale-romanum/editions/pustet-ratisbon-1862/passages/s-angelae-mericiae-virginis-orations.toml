notes = "Loci are over this artifact's retained text layer, which destroys ornamental drop capitals and turns printed accents into digits; the reading was not taken from it. On 2026-10-01 the leaves themselves were read for all three orations, on the page images of the registered 1862 facsimile PDF (sha256 363d6fc3) at PDF pp. 814-815, Internet Archive leaves n813-n814, printed pp. [144]-[145], at 100, 200 and 400 dpi; those text-layer lines are only the reading's address in this artifact. The 1862 prints this Mass in its appendix of Masses pro aliquibus locis, under Festa Maji, and lists it in its own calendar index (text-layer line 107087, S. Angelae Merici Virg. dupl. [144]) and alphabetical index (line 107562). CORRECTED 2026-10-01: until then this record pointed at text-layer lines 63715-63726, the main sanctoral's 31 May, which is St Petronilla's Mass by pointer (Missa Vultum tuum, de Communi Virg. non Mart.), and stated that the 1862 does not keep this feast and that Merici appears nowhere in its index; all three statements were wrong. The 1862 is a pre-1955 recension, and its directive's bracketed number [30] is that book's own and is not comparable with the 1962's [32]."
