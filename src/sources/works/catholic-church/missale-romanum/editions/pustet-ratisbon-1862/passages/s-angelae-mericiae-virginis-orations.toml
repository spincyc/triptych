locus = "Collect at Mame 1922 (the antecedent here is the Mame, not the 1862): printed p. 605, artifact PDF p. 719, left column lines 2-12, text layer through a bbox-restricted column extraction. The 1862 does not keep this feast: its 31 May, opened at text-layer lines 63715-63726, is a Virgin's Mass from the Common (Vultum tuum) for St Petronilla, and Merici appears nowhere in the 1862's own index."
