title = "Missale Romanum ex decreto sacrosancti Concilii Tridentini restitutum, Pii V Pont. Max. iussu editum et Clementis VIII auctoritate recognitum: the typical edition of 1604"
language = "la"
publication = "The title page reads MISSALE ROMANVM EX DECRETO SACROSANCTI Concilij Tridentini restitutum, PII QVINTI PONTIFICIS MAXIMI iussu editum, Et Clementis VIII. auctoritate recognitum, and beneath it ROMAE, Ex Typographia Vaticana. M D C I I I I. The colophon at the end of the volume, standing after the register of gatherings, repeats the same imprint word for word. Internet Archive item bub_gb_aaPpAuHRY9IC, a Google digitisation of the copy of the National Central Library of Rome."
date = "1604"
authority = "Clement VIII, by the bull Cum sanctissimum Eucharistiae sacramentum, which the book prints immediately after Quo primum under the heading CLEMENS PAPA VIII, Ad perpetuam rei memoriam. The bull recites what the revision was for and how it was made: that printers' and others' licence had let errors into copies of the Missal since 1570, that the Vulgate readings of the Epistles and Gospels had been displaced, and that Clement therefore charged cardinals learned in Scripture and in the antiquity of the Church to restore the book by collation of old manuscripts, adding that they judged it better to follow and supply Pius V's beginning than to bring in anything new."
jurisdiction = "Roman Rite"
notes = "THE SECOND TYPICAL EDITION OF THE TRIDENTINE MISSAL, and unlike the 1570 registered beside it this scanned copy IS the typical edition's own printing. The 1570 in this library is a Venice issue whose colophon names Giovanni Varisco and the heirs of Bartolomeo Faletti; this book's title page and colophon both read ROMAE, Ex Typographia Vaticana, M D C I I I I, so it is the Vatican Press printing that Clement VIII's bull orders in terms -- the same bull decrees that the book may be printed in the Papal City at that press and at no other, and elsewhere only from a copy of it, under penalty. That decree is a printing privilege of 1604 and has no operation now; it is recorded because it is the sentence that identifies this imprint as the archetype rather than as one printing among many.\n\nWHAT THE SCANNED COPY CARRIES, READ RATHER THAN ASSUMED. Quo primum stands first, ending with its own dating clause at lines 151-152 of the text layer -- anno Incarnationis Dominicae millesimo quingentesimo septuagesimo, pridie idus Iulii, Pontificatus nostri anno quinto, that is 14 July 1570 -- and Cum sanctissimum follows it from line 168. THE 1604 BULL'S OWN DATING CLAUSE IS NOT LEGIBLE IN THIS TEXT LAYER: the page carrying it breaks into optical noise, and neither the year 1604 nor a month and day can be read anywhere in the bull. Its received date of 7 July 1604 is therefore NOT taken from these bytes, and any citation of the day must go to a printed copy or to the Bullarium. What the bytes do carry, and what the year rests on, is the imprint M D C I I I I in two places. Beyond the bulls the copy holds the calendar and its computistical tables, the Rubricae generales Missalis from line 5571, the De defectibus matter, the Ritus servandus, the temporal and sanctoral Masses, and the Canon entire: TE igitur, clementissime Pater at line 32904, the first running head Canon Missae at line 32955 (OCR 'Canon Midx.'), Qui pridie quam pateretur with the words of consecration at about line 32995, and the Nobis quoque peccatoribus at line 33075.\n\nIT IS THE ALTAR BOOK AND NOT A HAND MISSAL. Any English lay missal registered in this library -- the 1806 P. Keating, the Cummiskey books, the Husenbeth -- is a devotional companion whose English is its compiler's, and none of them is a witness to this edition's text.\n\nFolded in from the sibling ~/git/lt-hist corpus on 2026-08-01 under src/sources/inventories/lt-hist-rights-audit-v1.toml, which is where the rights verdict, the corpus's refused ground, and the count of bytes not moved out of it are recorded. The corpus divided the same text into three markdown sections whose only structural claim was a line range over the downloaded file; nothing of that shape is reproduced here."
