rights_basis = "Public domain in the United States because the book was first published outside the United States before the pre-1931 line, and on that ground alone. THE LINE, AND THE YEAR IT WAS DERIVED FOR. Any work first published abroad before 1931 is out of United States copyright; that is the line guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026. THE LINE MOVES EVERY JANUARY, which guidance/missals.md:249 states in terms, so it is written here as derived for calendar year 2026 and not as a standing rule: on 1 January 2027 it becomes before 1932, and a later reader must re-derive it rather than quote this sentence. Publication at Rome in 1604 clears the line by three hundred and twenty-seven years, so no movement of it can reach this book. THE SCAN AND ITS TEXT LAYER ADD NOTHING FOR ANYONE TO OWN. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it: the Internet Archive item's own metadata names the recogniser as ABBYY FineReader 9.0 with abbyy-to-hocr 1.1.11 and the page images as Google's -- scanner google, sponsor Google, google-id aaPpAuHRY9IC, source books.google.com -- and whichever of the two parties ran the recogniser, it was a program and not a person, so there is no author to hold a right in the text layer. AND THE GOOGLE MATTER WAS LOOKED FOR IN THESE BYTES RATHER THAN ASSUMED FROM THE FIRST LINE; SEE `notes`, WHICH RECORDS THE SEARCHES, WHAT THEY RETURNED, AND WHY NEITHER OF THE TWO ROUTES OFFERED FOR IT WAS TAKEN. In summary: Google's front-matter statement and its usage guidelines are NOT in this file, the only Google matter present is the four-word page-foot stamp Digitized by Google, that stamp carries no notice and reserves nothing, and it is retained rather than stripped for the reason the Lasance fold-in retained its scan host's watermark. NOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, that the download succeeded, or that any host marks the scan public domain. guidance/sources.md:395-400 holds that availability and successful download are insufficient for `tracked`, and the item's Public Domain Mark 1.0 was the whole of the prior lt-hist corpus's ground for this book -- the ground refused at src/sources/inventories/lt-hist-rights-audit-v1.toml. The mark is recorded as a fact about the item and is not a link in this basis, which would be unchanged if the item carried no mark or a contradictory one."
