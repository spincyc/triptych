notes = "WHAT THIS IS: uncorrected optical character recognition of a whole 1604 Missal, 63,204 LF-terminated lines, valid UTF-8, no CR bytes, landed as a plain source artifact and nothing more. It is deliberately NOT structured as liturgical records. The prior lt-hist corpus cut the same text into three markdown 'sections' whose only structural claim was a line range over the downloaded file, so a comparison of two such sections compares the scanner's disagreements rather than the liturgy's, and nothing of that shape is reproduced here. Addressability by identity, this collect of this Mass, belongs to passage records with real loci over these exact bytes, which the schema already supports and which requires reading the pages rather than slicing the file. Until such a passage exists this artifact is a finding aid.\n\nTHE GOOGLE QUESTION, DECIDED ON THE BYTES. This is a Google digitisation and the file's ninth line reads 'Digitized by Google', which is why the fold-in of this book was held back from the three that went first. Two routes were offered for it: land a derivative with the Google matter removed by one stated replayable transformation, or register the scan remote and unresolved and hold no bytes. NEITHER WAS TAKEN, and the reason is a fact about this file rather than a preference.\n\n  WHAT IS NOT HERE. Google's front-matter statement -- 'This is a digital copy of a book that was preserved for generations on library shelves', the 'Usage guidelines', 'About Google Book Search' -- is ABSENT. Searched case-insensitively over the whole 2,025,007 bytes: 'usage guidelines' 0, 'about this book' 0, 'books.google' 0, 'do not assume' 0, 'watermark' 0, 'non-commercial' 0, 'attribution' 0, 'creative commons' 0, 'all rights' 0, 'public domain' 0, and 'copyright' 0. Not one word of Google-authored prose is in this file, and no notice, licence, reservation or condition of any kind appears in it.\n\n  WHAT IS HERE. The page-foot stamp alone, burnt into each page image and read back by the recogniser: 372 lines contain the string 'google', and a wider sweep that also catches the mangled forms finds about 670 lines in 315 distinct spellings -- 'Digitized by Google' 243 times, then 'Digitized by Googl', 'Digitized by Googlc', 'Digilized by Google', 'L/iyiiized by Google', 'd by Google', bare 'Google', and three hundred more. Four words at the foot of a page. It states who ran the scanner. It is not a copyright notice, it grants nothing, it reserves nothing, and it is not the material the two routes were designed to deal with.\n\n  WHY NOT ROUTE (a), THE DERIVATIVE. Because no single stated transformation removes the stamp, and the file is the proof. A strict pattern on 'Digitized by Google' leaves more than four hundred of the mangled forms behind, which would misrepresent the derivative as clean. A pattern loose enough to catch 'L/iyiiized by Google' and 'd by Google' also matches running Latin: the Ritus servandus is full of 'digiti', 'digitis' and 'digitorum' -- at lines 6557, 6669, 6942 and 7201, among others -- and deleting those lines would cut rubrics about the celebrant's fingers out of a Missal. So the honest choices were a stated rule with a known large residue or an unstated hand-picked list, and the second is exactly what the offered route forbids.\n\n  WHY NOT ROUTE (b), REMOTE AND UNRESOLVED. Because 'unresolved' would record a doubt these bytes disprove. The doubt was that a public-domain text had Google's own matter added to it; the search above shows it has not, beyond a four-word stamp with no claim in it.\n\n  AND THE DISTINCTION IS CHECKABLE, NOT CONVENIENT. This repository already holds the contrasting case and it is one grep away. `artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr`, Internet Archive item romanmissaltran00englgoog, stands remote and unresolved for precisely this reason, and it earns that status: its lines 1 to 65 are Google's front-matter block entire, 'Usage guidelines' at line 16 and 'About Google Book Search' at line 60 [verified 2026-08-01, on a fetched copy]. That item has the block and no page stamp; this one has the stamp and no block. Two Google digitisations, opposite findings, from the same test.\n\n  THE STAMP IS RETAINED, and that is a decision rather than an oversight. It carries no notice and no claim, so removing it buys nothing; it is the only page-boundary evidence in this text layer, so removing it would destroy the one handle a later passage record has on the printed page; and the Lasance fold-in already set the precedent, retaining the 'http://ccwatershed.org' stamp at the foot of every page of its scan on the same reasoning. A reader must not mistake the stamp for a rights notice, and must expect it interleaved through any quotation that spans a page break.\n\nOCR QUALITY. Measured here by scripts/_ocr_quality.py at a Latin function-word share of 0.0763 over 242,975 tokens, English 0.0236, classified `degraded-latin` -- below the roughly ten per cent at which that tool says running Latin prose sits. The cause is the type and the ink: this is a folio set in a small roman face with heavy abbreviation, long s, and red printing throughout, and the red does not survive the scan evenly. The damage is systematic. Consonant clusters collapse ('Miffale' for Missale, 'fanfta' for sancta), the bulls are set in italic and fare worst of all, and whole ornamental initials are emitted as line noise -- the T of TE IGITUR survives only as a stray 'E igitur' at the head of the Canon. Individual sentences are nonetheless plainly recoverable: 'QVi pridic quam patere-/tur' at about line 32995 and 'NObis quoque peccatori-' at line 33075 are the right words badly seen. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE, AND DO NOT REST A NEGATIVE SEARCH ON IT. At this level of damage a raw-line search establishes neither presence nor absence of a string; it is admitted as indexable so that later passages can pin physical line ranges over it, not so that a search over it can be reported as a finding.\n\nIDENTITY. The item was uploaded on 2014-11-17 by the Wikimedia Books Uploader bot from a Google scan of the National Central Library of Rome's copy, in collection europeanlibraries, 702 page images, creator 'Chiesa cattolica', publisher 'Romae : Ex typographia Vaticana', associated-names 'Stamperia Vaticana', OCLC 954931886, page_number_confidence 12. That last figure is low and is recorded rather than relied on: this record pins no printed page. The catalogue's collation, [52], 589, [3] p. in folio with the gathering signatures, agrees with the register of gatherings the book prints at the end above its colophon."
