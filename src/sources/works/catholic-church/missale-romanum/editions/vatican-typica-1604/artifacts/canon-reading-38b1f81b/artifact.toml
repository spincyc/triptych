transformation = "Render the 17-unit reading into 83 sequential UTF-8 LF lines. The display title, each red heading, each red rubric and each spoken or read block occupy their own lines in source order. Letter-form normalization uses the conventions of the roman-1570-canon-missae reading so that dated Roman Canon states can be compared word for word: long s becomes s; ae/oe ligatures and e-caudata become ae/oe; u/v are regularized (u vowel, v consonant) and j becomes i (final ij as ii); the ampersand becomes et; enclitic q. becomes que; nasal bars and other printed contractions are expanded (Dne Domine, Dni Domini, final -um/-em/-am, cum, -tum); acute and grave accents are omitted; display initials and spaced capitals are merged in sentence case; line-end word divisions are joined and one space follows punctuation. Unlike the roman-1570-canon-missae reading, whose capitalization does not consistently follow its print, spelling, capitalization and punctuation are otherwise kept as printed, so case differences against that reading are not evidence of change (for example eumdem, coenatum, saecula, Thadaei/Thaddaei, Matthia/Mathia). Printed crosses are rendered as U+2720 at their source positions; printed N. is kept; the printed response sign is R. Running heads, page numbers, signatures, catchwords, ornaments and chant notes are excluded. This is a normalized reading transcription, not a glyph-diplomatic facsimile. The native extent record classifies every physical line as heading, red-heading, red-rubric or reading without duplicating the literal wording."
