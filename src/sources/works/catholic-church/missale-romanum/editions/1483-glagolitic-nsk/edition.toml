notes = "Historical Glagolitic Roman celebrant-book expression, NSK RI-4-62a. All 432 offered canvases are acquired and retained in six lossless PDF parts with exact source URL/hash receipts and independent JPEG extraction checks. The holding library describes an incomplete copy with 211 of 220 leaves and misbinding. Colophon date follows the library’s transcription, not an independently checked Glagolitic reading. Complete delivery does not establish full-book text transcription, exhaustive collation or a genealogy to the 1631 edition."
