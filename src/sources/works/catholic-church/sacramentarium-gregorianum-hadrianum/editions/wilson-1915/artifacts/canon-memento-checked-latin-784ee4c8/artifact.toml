transformation = "Input SHA-256 6ca97fd74dee383bec70078151eaa0dc918a2b310389577d30690f4e503fdb53. Decode UTF-8 and split only on LF; take physical lines 2284-2289 inclusive. Join with one space, cut the prefix before Memento domine and the suffix beginning with the space before Communicantes. Replace the single famula- rumque with famularumque; remove the single caret following deuotio because it represents apparatus superscript 6. Restore the single printed point after tuarum: replace tuarum et with tuarum. et, confirmed in the independently rendered page crop. Write the resulting 301-character prayer plus one LF. No other spelling, capitalization, punctuation or wording changes. Visually checked against facsimile SHA-256 96fd93c73f8c9df47b6911981155b8b02cf2f2183ca6e87baad15128682d8681, printed p. 2/PDF p. 60."
notes = "Complete Memento for the living, 46 words, one text line; excludes surrounding Te igitur and Communicantes and the page apparatus. Preserve circum adstantium, incolomitatis, tibi reddunt, uota and uiuo. The main text lacks the clause reported by apparatus note 6 in manuscript O; that omission is not an assertion about when the clause was introduced. Wilson identifies R (Vatican Reginae 337) as his main-text basis in the introduction printed p. xliv/PDF p. 54. The 1915 date belongs to this printed critical edition; no 811/812 date for Cambrai C is assigned to R."
