rights_basis = "The identified Wilson 1915 printing is public domain in the United States by expiration of its publication term, as recorded for the parent facsimile and OCR artifacts. This bounded faithful transcription of its Latin main text adds no new authorship. It does not reproduce a modern critical edition or translation and is excluded from Triptych's CC BY 4.0 license."
provenance = "Canonical source-reader edition query for Gregorian Sacramentary / Hadrianum / Wilson identified the existing edition and its retained full facsimile and extracted-text derivative before registration. No new retrieval or replacement edition was made. Exact bytes were produced deterministically from the registered pdftotext artifact, then compared to a rendering of the retained facsimile printed p. 2, PDF p. 60. The prayer is Wilson's R-based main text, not the apparatus reading and not a newly inspected manuscript. On 2026-10-16 an independent second reviewer checked all 46 words against a separately rendered page crop, including incolomitatis, circum adstantium, tibi reddunt and uiuo. Both reviewers confirmed the small printed baseline point after tuarum, which the OCR had lost; it is restored in this payload. The corrected payload was then rehashed."
