transformation = "Direct reading from rendered PNG images of Wilson 1915 PDF pp. 60-62 (printed pp. 2-4). UTF-8 NFC, LF line endings. Two-letter display cap TE normalized to Te; italics (illo) flattened to plain text. Line wraps and line-end hyphens joined within each prayer paragraph; Wilson's paragraph break inside Communicantes (after uenerantes.) preserved as two lines. Native Latin orthography preserved verbatim (u/v, inlibata, Inprimis, incolomitatis, genetricis, thomę, taddei, xysti, celum, posteaquam, inmaculatam, patriarche, diuine, agne, cecilia, pręstas, e-caudata ę = U+0119). Printed baseline points serialized as standard '.' without leading space. Superscript apparatus numbers, marginal folio tags, inline folio slashes (/), apparatus footnotes, running heads, page numbers, signatures and non-printed pencil marks excluded. Main text omits Memento defunctorum (in apparatus note 14 only)."
notes = "Complete strict Eucharistic Canon in H. A. Wilson's 1915 critical edition main text (base MS R = Vatican Reg. lat. 337, collated with C = Cambrai 164 and O = Vat. Ott. 313): printed pp. 2-4, PDF pp. 60-62, from Te igitur immediately after Sanctus through per omnia saecula saeculorum . amen. immediately before Oremus / Pater noster. Note that Wilson's main text of R omits Memento defunctorum (recorded only in apparatus note 14 for O and a 12th-century marginal addition in R); apparatus footnotes are excluded."
