notes = "One page image of leaf n231 of item gregoriansacrame00cath, which is Wilson 1915 printed p. 174 (running head 'DOM. XVII. POST PENTECOSTEN.'). One page only, not the volume: a negative read off it is an absence from this page and from nothing wider. This is the page that carries, together and in liturgical order under the heading DOMINICA .XVI. POST PENTECOSTEN., all three composed orations of the 1962 Fifteenth Sunday after Pentecost, and the Secret here reads 'contra diabolicos tueantur semper incursus' where the 1962 book reads 'contra diabolicos semper tueantur incursus'. The volume's optical text is registered separately as artifact.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915.ia-djvu-ocr-gregoriansacrame00cath."
