notes = "Ancient prayer only: Deus qui salutis aeternae beatae Mariae virginitate fecunda humano generi praemia prestitisti tribue quaesumus ut ipsam pro nobis intercedere sentiamus per quam meruimus auctorem vitae suscipere dominum nostrum iesum christum qui tecum vivit. The source includes the explicit Lord Jesus Christ reference followed by its literal qui tecum vivit. cue. The transcription expands printed e-caudata to ae and declares canonical u/v spelling; every word is preserved, while apparatus numerals and folio markers are excluded. The imprint spelling prestitisti is retained, rather than silently rewritten praestitisti. The ancient_reading field records the ordered word sequence with one terminal period; the source image remains the authority for printed pointing. Apparatus note 1 separately attests the Son phrase in witness O; it is not spliced into the main reading."
