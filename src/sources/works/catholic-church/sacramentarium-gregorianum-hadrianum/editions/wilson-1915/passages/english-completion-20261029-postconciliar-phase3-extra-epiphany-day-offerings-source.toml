notes = "Ancient prayer only: Ecclesiae tuae quaesumus domine dona propitius intuere. quibus non iam. aurum. thus. et myrra profertur. sed quod eisdem muneribus declaratur immolatur et sumitur. per dominum. The actual printed conclusion cue is per dominum. It is not silently expanded. The printed Ecclesie/tue forms use e caudata; the source has close-set domine dona and a small editorial mark within intuere. These are not missing or added prayer words. The source apparatus after quod is a note marker. Independent cold source/body review receipt SHA256 cff977a5cd64495ec1f09cb39fd04c553a300b33b3ce7f9b8d46782e06b19ef7; original immutable candidate packet SHA256 817143a1baa1ebf49a420636fd96652ea78cb4f1f0bfb5d46e37c4bc60791482."
