notes = "Ancient prayer only: Redemptionis nostrae munere uegetati quaesumus domine. ut hoc perpetuae salutis auxilium. fides semper uera perficiat. per dominum. The original printed conclusion cue is retained as recorded, without expansion. The bounded secondary2002 reading substitutes auxilio for auxilium and proficiat for perficiat; all other petition words agree after v/u and ae-ligature spelling, accents/capitalization/pointing. The generic conclusion is Per Christum rather than ancient per dominum. Both substantive replacements must remain explicit; the English renders the bounded secondary reading rather than the ancient inflections."
