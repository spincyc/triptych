context = "The Super oblata of the station Mass Feria III ad sanctum Paulum in Easter week, printed p. 61 under the running head Feria III in albis: Suscipe domine fidelium preces cum oblationibus hostiarum . ut per haec pie deuotionis officia . ad celestem gloriam transeamus . per. The body agrees word for word with the Prayer over the Offerings of the Twenty-eighth Sunday in Ordinary Time in the 2002 Missale Romanum (artifact p. 291), allowing for orthography (pie, celestem). This page belongs to the part of the edition that precedes the Praefatiuncula Hucusque (printed p. 145). The same prayer stands again as the Super oblata of Dominica IIII post octabas Paschae (printed p. 167), in the part that follows the Praefatiuncula, recorded in its own passage; and, with an intercession inserted, as the Super oblata of Saint Theodore on 9 November (printed p. 108), an adapted form recorded here as a lead only. A literal search of the whole text layer for 'fidelium preces' found these three places and the edition's index of incipits only."
artifact_page_ranges = [[119, 119]]
notes = "Read on 2026-10-08 in a rendered page image of artifact page 119 of the tracked hash-identified PDF (printed p. 61); the text layer served only to locate it. The prayer text quoted is ancient and in the public domain, and Wilson's 1915 edition adds no authorship to it."
