context = "An Alia among the orations headed Orationes vespertinales seu matutinales, printed p. 135: Tua nos domine quaesumus gratia semper et preueniat et sequatur . ac bonis operibus iugiter prestet esse intentos . per. Wilson's apparatus, note 1, reports that manuscript O reads quaesumus domine. The body agrees with the Collect of the Twenty-eighth Sunday in Ordinary Time in the 2002 Missale Romanum (artifact p. 291) word for word, the Missal having the word order of O. In this part of the edition, the book that precedes the Praefatiuncula Hucusque (printed p. 145), the prayer stands in a collection of morning and evening orations, not in a Mass; it stands again, in the part that follows the Praefatiuncula, as the collect of Dominica XVII post Pentecosten (printed p. 174), recorded in its own passage."
artifact_page_ranges = [[193, 193]]
notes = "Read on 2026-10-08 in a rendered page image of artifact page 193 of the tracked hash-identified PDF (printed p. 135); the text layer served only to locate it. A literal, case-insensitive search of the whole text layer for 'tua nos' (25 lines), every hit read, located this prayer at printed pp. 135 (where the text layer is disordered) and 174 only, apart from the edition's index of incipits. The prayer text quoted is ancient and in the public domain, and Wilson's 1915 edition adds no authorship to it."
