notes = "Direct reading from rendered PNG images of Wilson 1915 PDF pp. 60-62 (printed pp. 2-4). UTF-8 NFC, LF line endings. Two-letter display cap TE normalized to Te; italics (illo) flattened to plain text. Line wraps and line-end hyphens joined within each prayer paragraph; Wilson's paragraph break inside Communicantes (after uenerantes.) preserved as two lines. Native Latin orthography preserved verbatim (u/v, inlibata, Inprimis, incolomitatis, genetricis, thomę, taddei, xysti, celum, posteaquam, inmaculatam, patriarche, diuine, agne, cecilia, pręstas, e-caudata ę = U+0119). Printed baseline points serialized as standard '.' without leading space. Superscript apparatus numbers, marginal folio tags, inline folio slashes (/), apparatus footnotes, running heads, page numbers, signatures and non-printed pencil marks excluded. Main text omits Memento defunctorum (in apparatus note 14 only)."
