context = "The Hadrianum's Advent: 'Mense Decembrio orationes de aduentu Domini' with Dominica prima (collect 'Excita domine quaesumus potentiam tuam et ueni . ut ab iminentibus'), Dominica secunda (p. 113), Dominica .III. ad sanctum Petrum (p. 114), the Ember days, and after the Ember Saturday 'Die dominica uacat' (p. 116) with its collect 'Excita domine potentiam tuam et ueni . et magna nobis', followed by the 'Aliae orationes de aduentu'. Four Sundays, the last without its own station."
