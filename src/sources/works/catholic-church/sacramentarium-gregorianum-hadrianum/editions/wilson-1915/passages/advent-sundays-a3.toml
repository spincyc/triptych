notes = "Read on the page images. The headings on pp. 113, 114 and 116 were cropped at 220 dpi. Apparatus note 2 on p. 116 records that C and O omit 'Die' and that C numbers the title cxcii. The 'uacat' Sunday's collect is the second collect of the Gelasian LXXX (Wilson 1894 p. 214), which reads 'gloriae tuae' where this has 'gratię tuę'. The text layer runs the first collect's words together ('Excitadominequaesumuspotentiamtuamet') as the printing does, and reads 'DOM^INICA UACAT.\"\"'."
