text = "MENSE DECEMBRIO ORATIONES DE ADUENTU DOMINI. DOMINICA PRIMA. Excita domine quaesumus potentiam tuam et ueni . ut ab iminentibus peccatorum nostrorum periculis . te mereamur protegente eripi . te liberante saluari . qui uiuis et regnas cum deo patre in unitate spiritus sancti deus per omnia sęcula sęculorum. DOMINICA SECUNDA. DOMINICA .III. AD SANCTUM PETRUM. DIE DOMINICA UACAT. Excita domine potentiam tuam et ueni . et magna nobis uirtute succurre . ut per auxilium gratię tuę . quod nostra peccata prępediunt . indulgentia tuę propitiationis acceleret . qui uiuis et regnas cum deo patre. Die om. CO : Huic titulo adscribit C numeros cxcii. ALIAE ORATIONES DE ADUENTU."
