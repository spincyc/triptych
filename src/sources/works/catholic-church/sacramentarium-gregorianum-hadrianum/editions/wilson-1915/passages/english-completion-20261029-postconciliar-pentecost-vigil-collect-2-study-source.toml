notes = "Ancient prayer only: Praesta quaesumus omnipotens deus. ut claritatis tuae super nos splendor effulgeat. et lux tuae lucis corda eorum qui per gratiam tuam renati sunt. sancti spiritus inlustratione confirmet. per dominum nostrum iesum christum in unitate eiusdem. The printed conclusion is retained exactly at its source length. Every petition word agrees after received inlustratione/illustratione spelling and the two local word-order changes per gratiam tuam renati sunt to per tuam gratiam sunt renati. Pointing, capitalization and accents differ. The older conclusion prints per dominum nostrum iesum christum in unitate eiusdem.; the bounded-secondary short cue Per Dominum. takes only its directly witnessed first two words. No full conclusion is supplied or silently harmonized. Printed e-caudata is transcribed ae; apparatus markers 3 and 4 are excluded from the prayer words."
