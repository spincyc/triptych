context = "The Hadrianum carries the three orations of the 1962 Eleventh Sunday after Pentecost as its mass for the TWELFTH Sunday after Pentecost: the collect with habundantiam pietatis (Wilson's apparatus recording that Ottobonianus 313 already reads abundantia, the 1962 ablative) and adicias (the 1962 contracted spelling); the super oblata Respice domine with fragilitati (the apparatus recording fragilitatis in O, the 1962 genitive); and the ad complendum Sentiamus domine quaesumus as in 1962. The Gregorian series runs one Sunday ahead of the 1962 numbering through this stretch: its Dominica X is Pateant aures (1962 Pentecost IX) and its Dominica XI is Deus qui omnipotentiam tuam (1962 Pentecost X). The Ottobonianus margin cues copied in Wilson's footnotes attach the 1962 Pentecost-XI chant set - Ant. Deus in loco sancto suo, Resp. In deo sperauit cor, Off. Exaltabo te domine, Com. Honora dominum - at the foot of Wilson p. 171, one opening before this mass, while the footnote against Dominica XII itself cues Respice domine in testamentum and Panem de caelo, the 1962 Pentecost-XIII chants. The exact remote artifact bytes were re-fetched and their SHA-256 matched this record before reading."
notes = "Read in the OCR text at physical lines 14085-14110 of the exact hashed artifact, with the chant-cue footnotes of the preceding page at lines 14040-14053. The OCR does not preserve which printed footnote mark attaches to which mass heading, so the cue placement is recorded at page precision, not at heading precision. Uncorrected optical character recognition; it locates and identifies the prayers and apparatus and does not control wording letter for letter."
