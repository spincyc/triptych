description = "The earliest surviving collection of Roman Mass formularies, a libellus collection copied at Verona in the earlier seventh century and preserving material of the fifth and sixth. It is not an ordered sacramentary and has no Advent or Lent; its formularies run by month from April. Long called Leonine on an attribution to Leo the Great that is not now maintained, and catalogued under both names."
