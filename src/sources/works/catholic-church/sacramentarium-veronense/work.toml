description = "Ancient Latin collection of Mass formularies preserved in the fragmentary Verona, Biblioteca Capitolare, Cod. LXXXV (80), conventionally called the Leonine or Veronese Sacramentary. Feltoe 1896, introduction pp. vii–viii, reports the first three gatherings missing, an opening in the middle of the sixth Mass for April, and no Canon Actionis in the surviving text. He explicitly says Veronense identifies its present locality, not its origin (p. vii n. 1). The copying date and provenance must be attributed to their individual sources rather than inferred from this conventional title; Feltoe reports an early-seventh-century palaeographical opinion, not an explicit manuscript date."
