notes = "Ancient prayer only: Munera quaesumus. Dne tuae plebis propitiatus adsume ut quae fidei pietate profitentur sacramentis caelestibus adprehendant per. The original printed conclusion cue is retained as recorded, without expansion. Entire petition words agree. Ancient Dne is explicit Domine abbreviation; adsume/assume and adprehendant/apprehendant are received assimilated spellings of the same words. Ancient adpre-hendant linebreak is mechanical. Pointing/case/accents differ. Ancient literal conclusion cue per. is not silently expanded; bounded secondary2002 prints Per Christum. No distinct modern petition expression."
