notes = "Corrected continuous whole prayer, with linewraps joined: Gregem tuum Pastor bone placatus intende et per beatos apostolos perpetua protectione custodi quos totius ecclesiae praestitisti Filii tui vicarios esse pastores per. The printed base reads Pater; only the same-edition erratum directs Pastor. This is a critical printed witness, not an uncorrected manuscript reproduction. It already uses plural beatos apostolos, quos and pastores. The target replaces rather than merely pluralizes its objects, and drops Filii tui vicarios. Every later difference remains separately recorded; no literal whole-word identity is claimed."
