context = "Veronese Ascension collect Exaudi nos misericors Ds et da mentibus nostris quo Redemptor noster conscendit attolli ut secundo Mediatoris adventu manifesto munere capiamus quod nunc audemus sperare promissum. Its clause ut secundo Mediatoris adventu manifesto munere capiamus quod nunc audemus sperare promissum is word-identical with the clause of the Ascension preface IIII Item alia on p. 21 (passage.catholic-church.sacramentarium-veronense.feltoe-1896.advent-pc-l2-ascension-prefaces-advent-preface-1-study); the opening differs (preface: teque suppliciter exorare ut mentibus nostris tua inspiratione concedas). This collect, not the preface, is the Latin that William Bright's 1887 English on p. 60 translates."
