notes = "Critical printed edition, not a diplomatic reproduction. Feltoe explains in his preface p. vi (PDF 10 of artifact internet-archive-pdf-3b991b13) that he follows manuscript spellings selectively, usually notes adopted alternatives, introduces selected manuscript abbreviations chiefly for brevity, and supplies punctuation according to sense. He explicitly disclaims exact reproduction of the manuscript text. On printed p. 1 (PDF 25), square brackets enclose restorations of letters lost through a hole in the parchment; editorial signs and apparatus must be preserved as printed and not silently promoted to manuscript readings. The 1896 publication date belongs to this edition, not to the copied ancient witness."
