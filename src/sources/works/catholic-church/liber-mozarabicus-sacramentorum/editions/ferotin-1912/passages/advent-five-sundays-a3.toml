context = "The opening of Ferotin's Liber sacramentorum: 'Missae de Adventu Domini', I 'De primo dominico', with his note that the printed Mozarabic missal and breviary count six Sundays of Advent but the ancient manuscripts never more than five; and V 'Missa in dominico quinto de Adventu Domini' (col. 22), whose number 'quinto' is lacking in the codex."
physical_line_ranges = [[1, 10]]
text = "LIBER SACRAMENTORVM MISSAE DE ADVENTV DOMINI I DE PRIMO DOMINICO. Le missel imprimé compte six dimanches de l'Avent, et il en est de même dans le bréviaire (Voy. Patrol. lat., t. LXXXV, col. 109-139, et t. LXXXVI, col. 47-107). Mais il importe de remarquer que les anciens textes manuscrits ne mentionnent jamais plus de cinq dimanches. V MISSA IN DOMINICO QVINTO DE ADVENTV DOMINI. quinto deest in Cod Je retrouve cette messe dans un manuscrit de Tolède (n° 35.1, ancien 30.1), aujourd'hui à la bibliothèque Nationale de Madrid, où il porte la cote Hh. 69."
