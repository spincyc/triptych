context = "The complete promulgated code with its accompanying Variationes, from the heading RUBRICAE BREVIARII ET MISSALIS ROMANI on printed p. 597 through the end of the Variationes in Martyrologio Romano on p. 729; the range continues through p. 740 over other acts (see notes)."
