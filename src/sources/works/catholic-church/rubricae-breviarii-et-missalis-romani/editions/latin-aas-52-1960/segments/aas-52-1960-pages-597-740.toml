notes = "Artifact PDF pages 597-740 correspond to printed Acta pp. 597-740. Pars prima (nn. 1-137) and the calendar chapter of the Variationes were read in full; pars tertia was read at the chapters bearing on the calendar and the arrangement of orations. Printed p. 599 was additionally read as a 400 dpi page image. The remaining Breviary-specific material was not read line by line. Corrected on 2026-11-18 (verification lane V1): the 400 dpi 'page image' of p. 599 named above was a rendering of the controlling artifact's OCR re-typesetting, not of the printed page (see that artifact's notes). The boundaries and the p. 599 reading were re-collated on the microfilm page facsimile artifact.holy-see.acta-apostolicae-sedis.volume-52-1960.ia-microfilm-issue-pdf-51e41032 at 300 dpi: the heading RUBRICAE BREVIARII ET MISSALIS ROMANI, PARS PRIMA, RUBRICAE GENERALES opens printed p. 597 (PDF p. 9); n. 18 d on p. 599 (PDF p. 11, also read in a 600 dpi crop) prints 'et XVII, quae inscribitur VI' as stated elsewhere; the code ends at n. 530 on p. 685 (PDF p. 99); the Variationes in Martyrologio Romano end at n. 61 on p. 729 (PDF p. 143) and are followed by the Declaratio (pp. 730-731) and the Ordinationes (pp. 732-734); p. 740 (PDF p. 154) is the last page of the issue's Index (pp. 735-740). On p. 598 (PDF p. 10) the print numbers n. 14 as '14.' and reads 'nn. 104-105' in nn. 15 and 16; the '11.' and 'nn. 101-105' of the OCR rendering are recognition errors. The context's 'end of the Variationes in Martyrologio Romano on p. 740' is therefore inexact: pp. 597-740 run from the code's heading to the end of the issue's index and include the Declaratio, the Ordinationes and the Index, which are not part of the code or its Variationes. The page range is left unchanged here, pending a decision whether to narrow it to pp. 597-729. Bound noted on 2026-11-18 (maintainer's decision): on the microfilm the Variationes in Martyrologio Romano end on printed p. 729; pp. 730-740 print a Declaratio, other Ordinationes and the issue's index, which this segment's range includes but which are not part of this work. The id and line bounds are kept; narrowing the segment to pp. 597-729 is an open follow-up. Every library quotation drawn from this segment lies within the rubrics."
