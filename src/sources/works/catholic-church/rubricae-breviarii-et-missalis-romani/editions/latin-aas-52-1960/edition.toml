notes = "The promulgating Acta witness. Pars prima, Rubricae generales, runs nn. 1-137 on printed pp. 597-621; pars secunda, Rubricae generales Breviarii Romani, nn. 138-268 on pp. 622-643; pars tertia, Rubricae generales Missalis Romani, nn. 269-530, ends on printed p. 685; the promulgated Calendarium Breviarii et Missalis Romani begins on p. 686 and is followed by the tables of occurrence and concurrence and their Notanda, ending on p. 705; the Variationes in Breviario et Missali Romano and in Martyrologio Romano follow on pp. 706-740. At n. 18 d this witness prints the arithmetically impossible ordinal 'XVII' where the 1962 Missale Romanum prints 'XXVII'; the volume's Corrigenda notice does not reach the page."
