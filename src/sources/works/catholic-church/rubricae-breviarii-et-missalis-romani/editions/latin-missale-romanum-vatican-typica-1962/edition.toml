notes = "The code as reprinted at the front of the 1962 Vatican typical edition of the Missal, carrying only pars prima and pars tertia as n. 5 of Rubricarum instructum requires. Its readings differ from the Acta witness at n. 18 d, where it prints 'et XXVII, quae inscribitur VI'. The Missal's own opening decree of 23 June 1962 dates Rubricarum instructum to 23 July 1960 rather than 25 July. This edition record carries no segment: the container is the Church Music Association of America facsimile of the 1962 typical edition, whose registered artifact records no page count, so no machine-checkable page range can be pinned to it without altering that artifact's identity record; the publication binding names the pages actually read."
