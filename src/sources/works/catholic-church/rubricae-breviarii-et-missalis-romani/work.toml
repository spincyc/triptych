description = "The 1960 code of rubrics for the Roman Breviary and Missal, approved by John XXIII on 25 July 1960 and promulgated by the Sacred Congregation of Rites on 26 July 1960. It is arranged in three parts: Rubricae generales (nn. 1-137), Rubricae generales Breviarii Romani (nn. 138-268), and Rubricae generales Missalis Romani (nn. 269-530). Part one governs the liturgical day, its four classes, Sundays, ferias, vigils, feasts and calendars, octaves, seasons, the Litanies, the table of precedence, occurrence, concurrence, commemorations, and colours."
