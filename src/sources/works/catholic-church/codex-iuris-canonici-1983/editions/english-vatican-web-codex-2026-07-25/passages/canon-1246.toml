context = "Can. 1246 (English): §1 'Sunday, on which by apostolic tradition the paschal mystery is celebrated, must be observed in the universal Church as the primordial holy day of obligation. The following days must also be observed: the Nativity of our Lord Jesus Christ, the Epiphany, the Ascension, the Body and Blood of Christ, Holy Mary the Mother of God, her Immaculate Conception, her Assumption, Saint Joseph, Saint Peter and Saint Paul the Apostles, and All Saints.' §2 'With the prior approval of the Apostolic See, however, the conference of bishops can suppress some of the holy days of obligation or transfer them to a Sunday.' Extracted verbatim from the exact fetched response, re-fetched on 2026-11-18 with an identical SHA-256."
verified_on = "2026-11-18"
notes = "English is an unofficial working aid; the Latin governs. The Immaculate Conception is among the universal holy days of §1; whether it is a day of precept in a given territory depends on that conference's use of §2, which this record does not settle."
