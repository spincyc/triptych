context = "Can. 1252 (English): 'The law of abstinence binds those who have completed their fourteenth year. The law of fasting binds those who have attained their majority, until the beginning of their sixtieth year. Pastors of souls and parents are to ensure that even those who by reason of their age are not bound by the law of fasting and abstinence, are taught the true meaning of penance.' Extracted verbatim from the exact fetched response, re-fetched on 2026-11-18 with an identical SHA-256."
