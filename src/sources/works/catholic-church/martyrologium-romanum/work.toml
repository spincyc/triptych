description = "The Roman Martyrology, the liturgical book read at Prime (in choir, after the Office of the day's Prime) that announces for each day the saints and martyrs commemorated on the following day, and on 25 December the proclamation of the birth of Christ. Issued by Gregory XIII (1584), revised under Urban VIII and Clement X, and corrected and augmented by Benedict XIV (1749); editions and translations are distinct. A locus is a calendar day by its Kalends date and printed page."
