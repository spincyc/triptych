title = "The Roman Martyrology, translated from the Latin, revised edition, Baltimore 1916"
language = "en"
publication = "Baltimore: John Murphy Company, 1916. Title page read on the page image at PDF p. 7 of Internet Archive item romanmartyrology00cathuoft on 2026-11-27: \"The Roman Martyrology PUBLISHED BY ORDER OF GREGORY XIII. REVISED BY THE AUTHORITY OF URBAN VIII, AND CLEMENT X. Afterwards, in the year 1749, Augmented and Corrected by BENEDICT XIV. LAST EDITION, ACCORDING TO THE COPY PRINTED AT ROME IN 1914. TRANSLATED FROM THE LATIN WITH AN INTRODUCTION BY THE MOST REV. ARCHBISHOP OF BALTIMORE. Revised Edition, with the Imprimatur of His Eminence Cardinal Gibbons. JOHN MURPHY COMPANY, PUBLISHERS, Printers to the Holy See and to the Cardinal Archbishop of Baltimore. BALTIMORE. 1916.\" The verso (PDF p. 9) carries \"Imprimatur: J. CARD. GIBBONS, ARCHIEP. BALT.\" and \"COPYRIGHT, 1897, BY JOHN MURPHY & Co.\" Internet Archive item romanmartyrology00cathuoft (PIMS, University of Toronto copy)."
date = "1916"
notes = "An English translation of the Martyrology following, by its title page, the Roman printing of 1914, that is the text after the revision under Pius X, so its differences from the 1902 Leonine Latin (edition.catholic-church.martyrologium-romanum.rome-propaganda-fide-1902) can belong to either the 1914 Latin or the translation. The title page names the translator only as the Most Rev. Archbishop of Baltimore; no translator is recorded because the person is not named. The copy carries a library stamp dated 27 November 1942 (PDF p. 8). PDF page = printed page + 20 in December."
