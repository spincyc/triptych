text = "The Sixth Day of December. At Myra, the metropolis of Lycia, the birthday of St. Nicholas, bishop and confessor, of whom it is related, among other miracles, that, while at a great distance from the emperor Constantine, he appeared to him in a vision and moved him to mercy so as to deter him from putting to death some persons who had implored his assistance."
