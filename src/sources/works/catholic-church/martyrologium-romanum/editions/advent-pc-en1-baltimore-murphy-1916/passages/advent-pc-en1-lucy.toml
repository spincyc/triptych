notes = "Against the 1902 Latin (artifact.catholic-church.martyrologium-romanum.rome-propaganda-fide-1902.advent-pc-l5-advent-elogia-checked-text-4edef9c2, line 12): Paschasio Consulari becomes the ex-consul Paschasius; ut a populo castitati ejus illuderetur becomes that her chastity might be insulted, without a populo; nil laesa superans (she, unharmed, overcoming pitch, resin and boiling oil) is recast with the persecutors as subject, pouring them over her without injuring her; and gladio in gutture percussa, martyrium consummavit (struck in the throat with the sword, she consummated her martyrdom) becomes they finally plunged a sword into her throat, and thus completed her martyrdom."
