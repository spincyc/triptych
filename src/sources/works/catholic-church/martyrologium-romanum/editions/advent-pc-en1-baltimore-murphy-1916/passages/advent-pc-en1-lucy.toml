text = "The Thirteenth Day of December. At Syracuse, in Sicily, the birthday of St. Lucy, virgin and martyr, in the persecution of Diocletian. By the order of the ex-consul Paschasius, she was delivered to profligates, that her chastity might be insulted; but when they attempted to lead her away, they could not succeed, either with ropes or with many yoke of oxen. Then pouring hot pitch, rosin, and boiling oil over her body without injuring her, they finally plunged a sword into her throat, and thus completed her martyrdom."
