text = "Pridie Kalendas Decembris. Apud Patras Achajae natalis sancti Andreae Apostoli, qui in Thracia et Scythia Christi Evangelium praedicavit. Is ab Aegea Proconsule comprehensus, primo in carcere clausus est, deinde gravissime caesus, ad ultimum in cruce suspensus, in ea populum docens biduo supervixit: et rogato Domino ne eum sineret de cruce deponi, circumdatus magno splendore de coelo, abscedente postmodum lumine, emisit spiritum."
