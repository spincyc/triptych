context = "Day heading and first elogium of 24 November, printed p. 177 (PDF 247); the 14 December day heading, printed p. 187 (PDF 257), and that day's ninth elogium, printed p. 188 (PDF 258). The 24 November entry names John of the Cross, Confessor, and refers to his natalis on 14 December. The 14 December elogium places his death at Ubeda in Spain and calls him St Teresa's companion in the reform of the Carmelites (in Carmelitarum reformatione sanctae Theresiae socii), with his feast kept on 24 November."
physical_line_ranges = [[8, 9], [12, 13]]
text = "Octavo Kalendas Decembris. Sancti Joannis a Cruce Confessoris, cujus natalis memoria decimonono Kalendas Januarii recensetur. Decimonono Kalendas Januarii. Ubedae in Hispania sancti Joannis a Cruce Confessoris, in Carmelitarum reformatione sanctae Theresiae socii, cujus festum agitur octavo Kalendas Decembris."
