context = "Day heading of 14 September with its third and fourth elogia, printed p. 137 (PDF 207), and day heading of 16 September with its first elogium, printed p. 138 (PDF 208). On 14 September the Martyrology records the passion in Africa of Cyprian, Bishop of Carthage (Episcopi Carthaginensis), beheaded under Valerian and Gallienus after exile, six miles from Carthage by the sea, with his fellow martyrs Crescentianus, Victor, Rosula and Generalis, and says the memory of Cornelius and Cyprian is kept as a feast on 16 September. The 16 September entry names Cornelius and Cyprian as Pontiffs and Martyrs whose natalis falls on 14 September."
physical_line_ranges = [[3, 7]]
text = "Decimooctavo Kalendas Octobris. In Africa passio sancti Cypriani Episcopi Carthaginensis, sanctitate et doctrina clarissimi: qui sub Valeriano et Gallieno Principibus post durum exilium detruncatione capitis martyrium consummavit sexto milliario a Carthagine juxta mare. Eorumdem vero sanctorum Cornelii et Cypriani memoria sextodecimo Kalendas Octobris festive celebratur. Passi sunt etiam ibidem sancti Martyres Crescentianus, Victor, Rosula, et Generalis. Sextodecimo Kalendas Octobris. Sanctorum Cornelii et Cypriani Pontificum et Martyrum, quorum natalis decimooctavo Kalendas Octobris recolitur."
