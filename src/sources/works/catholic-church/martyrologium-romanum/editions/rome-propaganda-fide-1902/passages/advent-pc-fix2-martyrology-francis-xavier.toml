context = "Day heading and first elogium of 3 December, printed p. 182 (PDF 252). Francis Xavier, of the Society of Jesus, is called Apostle of the Indies (Indiarum Apostoli), renowned for the conversion of the nations, for gifts and for miracles; he died on the island of Sancian off China (in Sanciano Sinarum insula) on 2 December (quarto Nonas Decembris), and his feast is kept on 3 December by order of Alexander VII. The elogium does not name Japan."
