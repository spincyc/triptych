context = "The day heading and the whole Christmas proclamation from Anno a creatione mundi to the rubric Quod sequitur ... et surgunt omnes, read on printed p. 193 (PDF p. 263); the lunar-letter table above it and the elogia of the day's saints that follow (from Eodem die natalis sanctae Anastasiae) are not transcribed."
notes = "Rubrics (the parenthesis Hic dicitur alta voce, et omnes genua flectunt, the line Hic autem altius, et in tono passionis:, and Quod sequitur ... surgunt omnes.) are printed in red and transcribed as plain text. Numbers as printed: 5199 from creation, 2957 from the flood, 2015 from Abraham, 1510 from Moses and the Exodus, 1032 from David's anointing, the 65th week of Daniel, the 194th Olympiad, 752 from the founding of Rome, 42nd year of Octavian. Bute 1908 prints 2959 from the flood. OCR differs from the page only in recognition noise."
