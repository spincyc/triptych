transformation = "Read on page images rendered from the exact registered whole PDF with pdftoppm at 100, 150, 300, 500 and 800 dpi on 2026-11-19 (printed p. 193 = PDF p. 263). One sense unit (a clause of the dating formula ending at its printed colon, a rubric, or a sentence) per LF-terminated UTF-8 line, each prefixed by a braced printed-page locator. Joined: line wraps and division hyphens. Removed: the printed acute stress accents. Expanded: the ligatures (Æ to Ae, æ to ae, œ to oe). Kept as printed: spelling (coelum, Judae, nonagesimonono), capitalization and pointing, including the comma before the closing parenthesis of the kneeling rubric. Rubrics printed in red are transcribed as plain text. The printer's space before a colon is not reproduced. The Internet Archive text layer was used only to find the page."
