context = "n. 237: on Sundays, solemnities and feasts, Ash Wednesday, Holy Week and the Easter octave, occurring memorials are not commemorated. n. 238: on the weekdays from 17 to 24 December, in the Christmas octave and on the weekdays of Lent no obligatory memorial may be celebrated, not even in particular calendars (memorials in Lent count as optional that year). n. 239: whoever wishes to celebrate the Office of a saint whose memorial falls in these seasons may, in the Office of Readings, after the patristic reading and responsory of the season, add the saint's proper hagiographical reading with its responsory and end with the saint's prayer; and at Lauds and Vespers, after the concluding prayer, add the saint's antiphon (proper or from the Common) and prayer. So on 17-24 December a saint's memorial can be kept within the Office only as such a commemoration."
