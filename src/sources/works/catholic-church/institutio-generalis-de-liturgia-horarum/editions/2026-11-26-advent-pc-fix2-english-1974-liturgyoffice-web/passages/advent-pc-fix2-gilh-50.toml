context = "n. 37: Lauds as morning prayer and Vespers as evening prayer are the two hinges on which the daily Office turns and are the chief Hours (quoting Sacrosanctum Concilium). n. 50: at Lauds and Vespers a Gospel canticle is solemnly said with its antiphon: at Lauds the Benedictus, the Canticle of Zechariah; at Vespers the Magnificat; the antiphons vary with the day, season or feast. Lauds is part of the daily Office (n. 37), so the Benedictus is said at Morning Prayer every day. This translation calls Morning Prayer Lauds; at n. 38 its rendering of a saying of St Basil uses the word Matins for the morning hour, which is not the old night Office."
