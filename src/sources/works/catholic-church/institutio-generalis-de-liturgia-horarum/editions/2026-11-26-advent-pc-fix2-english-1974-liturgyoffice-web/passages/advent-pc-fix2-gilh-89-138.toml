context = "n. 89: at Compline, after the psalmody, come a short reading, the responsory Into your hands, and then the Gospel canticle with its antiphon, the high point of the Hour. n. 138: the Gospel canticles, named as the Benedictus, the Magnificat and the Nunc dimittis, are to be given the solemnity of a Gospel. With n. 50 (Benedictus at Lauds, Magnificat at Vespers), the Gospel canticle of Compline is the Nunc dimittis; n. 89 itself does not name it. The AELF Compline record advent-pc-fix2-complies-2026-12-01-nunc-dimittis names it (Cantique de Syméon, Lc 2:29)."
