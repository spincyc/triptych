context = "nn. 55-56: the Office of Readings offers fuller meditation on Scripture and the best spiritual writers, and is true prayer (psalms, hymn, prayer). n. 57 applies to the Office of Readings the words of Sacrosanctum Concilium art. 89 c, which the Council said of the Hour called Matins: it keeps the character of night praise when celebrated in choir but is adapted for recitation at any hour, with fewer psalms and longer readings. n. 58: those bound by particular law to keep its nocturnal character may say it at night or early before Lauds. n. 59: otherwise it may be said at any hour, even the evening before, after Vespers. Read with SC 89 c (passage advent-pc-fix2-sc-89 of the Latin AAS edition), this documents that the Office of Readings is the reformed form of Matins."
