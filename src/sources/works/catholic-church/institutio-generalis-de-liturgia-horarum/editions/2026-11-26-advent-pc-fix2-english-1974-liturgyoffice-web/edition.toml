notes = "Registered by the advent-pc-fix2 lane. Dated web state: the date is the acquisition date. The PDF's colophon (artifact p. 42) reads: General Introduction on the Liturgy of the Hours English translation © 1974, the Hierarchies of Australia, England and Wales, Ireland. All Rights Reserved. [Text emended following the new Code of Canon Law (#29 & 30)]. This is the translation of the British and Irish Divine Office, not the ICEL translation printed in the U.S. Liturgy of the Hours; it is used here only as a locator and paraphrase witness to the numbered instruction. The Latin typical text was not found in a public delivery on 2026-11-26 (web searches for the Latin title with Officium lectionis, Completorium, Nunc dimittis and canticum evangelicum returned no Latin text)."
