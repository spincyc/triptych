notes = "The official USCCB landing page inspected 2026-07-23 states that this online edition includes the emendations promulgated 22 October 2021 under Prot. n. 394/21 and the separately confirmed emendation of no. 54 under Prot. n. 228/20. It also records the 26 March 2010 confirmation of the Roman Missal, Third Edition, the 24 July 2010 confirmation of United States adaptations, and the applicable ICEL and USCCB rights. This is not the obsolete 2003 United States English web state, the Latin typical text, or an exact publisher-specific 2011 altar-book artifact."
