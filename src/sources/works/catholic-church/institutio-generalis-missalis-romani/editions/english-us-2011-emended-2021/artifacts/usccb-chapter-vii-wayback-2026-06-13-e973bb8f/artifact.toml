notes = "Chapter VII, 'The Choice of the Mass and Its Parts'. Read at nos. 357-367 for the PC-S55-A branch audit: no. 363 on orations, no. 364 on Prefaces, no. 365 a-d on the choice of Eucharistic Prayer (I especially suited to Sundays unless III is preferred for pastoral reasons; III preferred on Sundays and festive days; IV with its invariable Preface usable when a Mass has no Preface of its own and on Sundays in Ordinary Time). Matches none of the other registered chapter VII states by hash. This is a third party's copy of the official page as it stood on the capture date, not a delivery of 16 October 2026. The protected English is described in the leaf's records, not retained."
