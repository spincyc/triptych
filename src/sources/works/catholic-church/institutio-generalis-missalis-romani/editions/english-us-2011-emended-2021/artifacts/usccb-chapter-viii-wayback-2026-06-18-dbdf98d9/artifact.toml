notes = "Chapter VIII, 'Masses and Prayers for Various Needs and Occasions and Masses for the Dead'. Read at nos. 368-378 for the PC-S55-A branch audit: no. 372 (Ritual Masses prohibited on the days it lists, which do not include Sundays in Ordinary Time), no. 373 with its United States paragraphs (days of prayer designated by the Diocesan Bishop; 22 January and its two Masses), which identify the United States text, and no. 374 (in graver need or for pastoral advantage, at the direction or with the permission of the Diocesan Bishop, an appropriate Mass on any day except those listed, which do not include Sundays in Ordinary Time). No mission day is designated. Matches no other registered state by hash. This is a third party's copy of the official page as it stood on the capture date, not a delivery of 16 October 2026. The protected English is described in the leaf's records, not retained."
