context = "Article 355 on optional memorials, in three lettered cases: on the privileged weekdays of Advent from 17 December, within the Octave of the Nativity and in Lent the Mass is of the occurring liturgical day while the collect may be taken from a memorial inscribed that day in the general calendar; on other weekdays of Advent, Christmas Time and Easter Time a wider choice is open; and on weekdays in Ordinary Time the Mass of the weekday, of an occurring optional memorial, of a saint in the Martyrology, or a Mass for various needs or a votive Mass may be chosen. The article closes with the warning against needlessly omitting the assigned weekday readings, the moderation of Masses for the dead, and the preference, other things being equal, for a particular memorial over one inscribed in the general calendar."
