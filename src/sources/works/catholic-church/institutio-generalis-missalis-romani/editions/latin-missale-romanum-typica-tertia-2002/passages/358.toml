context = "Article 358: the ferial Lectionary supplies readings for each day of every week through the whole course of the year, and these are ordinarily taken on the days to which they are assigned unless a solemnity, feast, or a memorial with proper New Testament readings occurs; where the continuous reading is interrupted within a week the priest may combine omitted parts with others or determine which texts are to be preferred, having the whole week’s arrangement in view."
