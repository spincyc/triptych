notes = "The 1969 typical edition of the book that first printed the revised General Roman Calendar and the Universal Norms. Per its p. 4, printed pp. 5-49 are the official documents (the Congregation's decree, Paul VI's Mysterii Paschalis, the Normae in two chapters with the Table of Liturgical Days, and the Calendarium), and pp. 53-177 are the Consilium's Commentarius, expressly non-official. Registered by research lane advent-pc-l1 on 2026-11-26 for the postconciliar Advent handbook; only the pages named by its passages were read on page images."
