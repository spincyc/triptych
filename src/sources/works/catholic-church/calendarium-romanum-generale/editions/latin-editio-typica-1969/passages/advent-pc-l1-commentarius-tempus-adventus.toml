context = "Commentarius in annum liturgicum instauratum, '2. Tempus Adventus', p. 61 (non-official, by the Consilium). Ratio: Advent is proper to the West; instituted to prepare for Christmas, it soon took an eschatological sense, recalling the two comings. In the reform it keeps its four weeks but is no longer held to be only penitential; it is a time of joyful expectation, and the Gloria is omitted on its Sundays not for the Lenten reason but so that the angels' hymn may sound anew on Christmas night. Disciplina: the near-daily reading of Isaiah unifies the season, but it falls into two parts marked by the two new prefaces: to 16 December the eschatological aspect, from 17 to 24 December proper formularies at Mass and Office for each day; the Fourth Sunday appears from its Mass readings as a Sunday of the Old Testament Fathers and the Blessed Virgin Mary."
artifact_page_ranges = [[61, 61]]
verified_on = "2026-11-26"
notes = "Read on the rendered page image at 150 dpi. Text-free record: the Commentarius is the Consilium's, which is not an admitted body of the twenty-year-term record, so its Latin is held as restricted pending coordinator review. The preceding p. 60 (read only in the text layer, a lead) introduces the Proper of Time and cites SC 102."
