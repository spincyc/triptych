context = "The 1969 General Roman Calendar for December, p. 32: memorials of Francis Xavier (3), Ambrose (7), Lucy (13) and John of the Cross (14); the Immaculate Conception (8) a solemnity; optional memorials (italic, no rank) of John Damascene (4), Nicholas (6), Damasus I (11), Jane Frances de Chantal (12), Peter Canisius (21) and John of Kanty (23); 9, 10 and 15-20 December carry no celebration. Christmas a solemnity; Stephen, John and the Innocents feasts; Holy Family on the Sunday within the octave."
