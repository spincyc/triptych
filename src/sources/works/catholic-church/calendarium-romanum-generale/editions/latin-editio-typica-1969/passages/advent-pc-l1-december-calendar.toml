notes = "Read on the rendered page image at 100 dpi. Compared with the 2002 Missal's calendar (passage.catholic-church.calendarium-romanum-generale.latin-missale-romanum-typica-tertia-2002.complete-calendar): 2002 lacks Jane Frances de Chantal on 12 December (she is on 12 August there) and the Notitiae 2008 Variationes add Juan Diego (9 December) and Our Lady of Guadalupe (12 December); Our Lady of Loreto (10 December) was inscribed in 2019."
