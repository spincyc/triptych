context = "The Sacred Congregation of Rites' decree Prot. N. R 21/969, p. 5: by special mandate of Paul VI it promulgates the year's ordering and the General Roman Calendar approved by Mysterii Paschalis of 14 February 1969, effective 1 January 1970; until the new Breviary and Missal appear, solemnities are kept as first-class feasts, feasts as second-class and memorials as third-class feasts, and memorials falling on Advent ferias from 17 to 24 December, within the Christmas octave and on Lenten ferias are kept only optionally, as a commemoration at the end of Lauds with antiphon, versicle and prayer (clauses a and d)."
