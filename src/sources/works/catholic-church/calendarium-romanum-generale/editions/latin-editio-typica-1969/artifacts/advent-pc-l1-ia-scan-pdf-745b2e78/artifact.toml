rights_basis = "Admitted under src/sources/inventories/holy-see-twenty-year-term-rights-v1.toml, [how_to_admit].carrier_artifact. This record identifies a mechanical page scan of the printed book; the bytes are not retained. First publication of these words: Calendarium Romanum ex decreto Sacrosancti Oecumenici Concilii Vaticani II instauratum auctoritate Pauli PP. VI promulgatum, editio typica (Typis Polyglottis Vaticanis, 1969) (first_publication_imprint Typis Polyglottis Vaticanis; first_publication_body Roman Pontiff, who approved the Normae universales de anno liturgico et de calendario by the apostolic letter Mysterii Paschalis of 14 February 1969, with the Sacred Congregation of Rites, which promulgated them by decree Prot. N. R 21/969 printed on p. 5; first_publication_year 1969). us_formality published-abroad-without-us-notice: no copyright notice stands on the title page (PDF p. 3), its verso (p. 4), p. 2 or the colophon leaves, and the scan's text layer carries none; the record's L3 residual risk applies (Twin Books Corp. v. Walt Disney Co., 83 F.3d 1162 (9th Cir. 1996), may treat a foreign-language work published abroad without notice as unpublished in the United States). This admission covers only the official documents of the book (printed pp. 5-49: decree, Mysterii Paschalis, Normae, Calendarium); the Commentarius on pp. 53-177, which p. 4 itself calls non-official and which was prepared by the Consilium, is not admitted here because the Consilium is not among the record's [admission].bodies. Published on a qualified basis (publication policy priority 6; confidence medium-low): a Holy See text first published in Vatican City in 1931-1975 that lapsed into the U.S. public domain for want of a formality, and whose twenty-year Vatican term under Italian Law 633/1941 arts. 11 and 29, as applied by Vatican Law XII of 1960, had on this project's reading expired before the 1 January 1996 U.S. restoration date (17 U.S.C. 104A). Not adjudicated; U.S. copyright only; implies no ecclesiastical approval or permission."
