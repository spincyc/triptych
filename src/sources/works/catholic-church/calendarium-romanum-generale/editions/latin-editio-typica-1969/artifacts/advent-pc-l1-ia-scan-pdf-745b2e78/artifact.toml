provenance = "Fetched whole over HTTPS from the source_url with curl on 2026-11-26 by research lane advent-pc-l1 and hashed with sha256sum; its SHA-1 (aa4234565115a30a8c058a90919312248e2707c9) and byte size equal the Internet Archive metadata file listing for item calendarium-romanum-1969 (collection opensource, a private upload). The same file is listed in item CalendariumRomanum1969; items calendariumroman0000vari and bwb_C0-ABZ-994 are lending-only and were not used. Sought because the vatican.va Acta Apostolicae Sedis PDFs for 1964, 1969, 1971 and 1974 are optical re-typesettings without page images, and the Internet Archive's sim_acta-apostolicae-sedis items for those years are index-only. No source text passed through a language model between the server and the hash."
