notes = "A 180-page PDF of 400 ppi page images with an Adobe Paper Capture text layer. PDF page n is printed page n in the range read (title PDF p. 3; pp. 5, 12, 13, 16, 17, 20-22, 32 and 61 were read as rendered images at 100-150 dpi). The index on p. 177 places the decree at p. 5, Mysterii Paschalis at p. 7, the Normae at pp. 11 and 17, the Calendarium at p. 23, the Commentarius on the Proper of Time at p. 54, the historical commentary at p. 84 and the Variationes at p. 112. The scanned copy is privately annotated: on p. 12 a handwritten 'SSmi Corporis Christi' stands under n. 7 c and the word 'provinciae religiosae' on p. 21 is underlined; these marks are not part of the printing. The text layer is a discovery aid only."
