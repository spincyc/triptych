notes = "Title page, artifact page 7, gives 1915 and Vol. II Printed Text. The series leaf at artifact page 5 says issued to members for the year 1906; the Internet Archive catalogue date 1891 does not identify this printing. Contents at artifact page 9 distinguish Vol. I Facsimile from this printed-text volume. Latin liturgical text, Old Irish matter, English introduction and editorial notes, nine plates of the metal cover and Stowe St. John, English translation of the Irish treatise at printed pp. 40–42, and index are retained. The English apparatus is not an English translation of the Latin Mass."
