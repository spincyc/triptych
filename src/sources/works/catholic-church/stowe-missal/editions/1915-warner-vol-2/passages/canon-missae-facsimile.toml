context = "Complete strict Eucharistic Canon of RIA MS D. II. 3 as mediated by G. F. Warner's 1915 printed text (Vol. II, printed pp. 10-16, PDF pp. 96-102): from the Canon heading Canón dominicus papę gilasi and Té igitur on printed p. 10 (fo. 24) through per omnia saecula saeculorum : on printed p. 16 (fo. 34), immediately before the Old Irish fraction rubric and Pater nóster on printed p. 17. Includes the seven seasonal Infra actionem Communicantes insertions (pp. 11-12), Moelcaich's bracketed anamnesis addition in Simili modo (p. 13), and the Stowe Diptychs of the Dead (ff. 32-33, pp. 15-16) continuing Memento etiam (fo. 29v, p. 14). Excludes the two misbound leaves ff. 30-31v (Litany of Irish Saints and Oratio Ambrosi on pp. 14-15, which Warner notes belong after fo. 12 before the Mass) and excludes all apparatus footnotes, running heads, and marginal folio markers."
notes = "Independently verified complete bounded constituent extent against tracked facsimile by independent-collator-v3-alex-west on 2026-11-25. Whole-book completeness is not claimed."
