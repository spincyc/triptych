notes = "Direct reading from rendered PNG images of Warner 1915 Vol. II PDF pp. 96-102 (printed pp. 10-16). UTF-8 NFC, LF line endings. Follows existing checked Stowe passage conventions: roman/italic typography flattened; æ ligatures expanded to ae; e-caudata ę (U+0119) preserved in papę and pręstas; printed acute and grave accents (á, é, í, ó, ú, ì), macron N̄ (U+004E+U+0304), spacing tilde (uenia~), editorial brackets ([ist], [li], [s]) and Moelcaich revision angle brackets (< ... >) preserved; printed crosses retained as '+'. Compound end-punctuation marks (:~, ∴, ·~, ..~, curved colon) uniformly normalized to ':'; raised single dot (·) to '.'; double dot (··) to '..'. Diptych columns on ff. 32-33 read column-by-column in printed order, joining column-wrapped split names flagged in Warner p. 15 n. 7 (melchisedech, machabeorum, infantum, barthalomae, sacerdotum). Native Hiberno-Latin orthography preserved verbatim (clementisime, suplices, aceptu, aeclesia, unare, ortodoxís, intigritate, redetu, incolimitate, pecatorum, prespeterís, arcisire, anriae, pilippi, thathei, ancleti, domiani, Quessumus, idulorum, dignareque, patiretur, diciens, agiens, rimisionem, abrache, obtilit, maistatis, replemur, praespiter, misserationvm, alaxandro, cicilia, anastassia, corum, estimatis). Superscript apparatus numbers, marginal folio tags, footnotes, running heads and misbound ff. 30-31v excluded."
