notes = "Historical Latin: Crucifixus surrexit á mortuis, et redemit nos alleluja, alleluja. The inspected secondary 2002 reproduction omits the second final alleluja of the complete 1815 antiphon. No body word is added or substituted. The historical acute preposition á, other stress accents, j/i in alleluja / allelúia, and lack of a source comma after nos versus the modern comma are orthographic or pointing differences. The study English renders the retained historical words with one final alleluia under the disclosed abridged route. No historical English is attributed to this Latin-only source. The following Dicite in nationibus versicle/response is separately labelled and excluded. Physical PDF page 114 and printed page 114; no IA leaf mapping asserted. Title identity at AP103, date1815."
