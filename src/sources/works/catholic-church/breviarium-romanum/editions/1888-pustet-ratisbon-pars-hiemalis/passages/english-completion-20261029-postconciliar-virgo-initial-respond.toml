notes = "Direct image transcription of the complete selected initial respond sentence: Hæc est Virgo sápiens, quam Dóminus vigilántem invénit, quæ accéptis lampádibus, sumpsit secum óleum: * Et veniénte Dómino, introívit cum eo ad núptias. The source-local OLM 1981 n. 735,2 counterpart at printed 337 / artifact 391 purely omits quæ accéptis lampádibus, sumpsit secum óleum and the connective Et within that sentence. Every remaining word agrees after stress accents, ae-ligature expansion, Virgo capitalization and punctuation. The original project study English translates only that finite old word sequence; no adapted historical English or approved modern English is used. Correspondence to the exact authenticated 2008 body remains unestablished. OLM referrals n. 681 / artifact 370 and n. 692 / artifact 372 were independently checked on the source images."
