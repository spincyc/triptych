context = "The first responsory of Matins of the First Sunday of Advent, after the first lesson (Isaiah 1), with its three verses (Psalm 48:3, Psalm 79:2, Psalm 23:7 in the Vulgate), the Gloria Patri, and the rubric for repeating the respond. The Office of Readings of the postconciliar First Sunday of Advent sets a responsory of this shape after Cyril's Catechesis 15 (the AELF passage advent-pc-l3-advent-1-office-of-readings-second-responsory records the French)."
physical_line_ranges = [[1, 6]]
text = "℟. Aspiciens a longe, ecce video Dei potentiam venientem, et nebulam totam terram tegentem. * Ite obviam ei, et dicite: * Nuntia nobis si tu es ipse, * Qui regnaturus es in populo Israël. ℣. Quique terrigenae, et filii hominum, simul in unum dives et pauper. Ite obviam ei, et dicite. ℣. Qui regis Israël, intende, qui deducis velut ovem Joseph. Nuntia nobis, si tu es ipse. ℣. Tollite portas principes vestras, et elevamini portae aeternales, et introibit Rex gloriae. Qui regnaturus es in populo Israël. ℣. Gloria Patri, et Filio, et Spiritui sancto. Deinde repetitur ℟. Aspiciens a longe, usque ad ℣. Quique terrigenae."
