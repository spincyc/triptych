context = "Read on the page image at 300 dpi. n. 1: Hymnus Te Deum dicitur in omnibus Festis per annum, tam iii quam ix Lectionum, et per eorum Octavas (except Holy Innocents unless on a Sunday), and on all Sundays from Easter to Advent exclusive and from Christmas to Septuagesima exclusive, and on all ferias of Paschaltide from Low Sunday to the Ascension except Rogation Monday. n. 2: Non dicitur autem in Dominicis Adventus, et a Septuagesima usque ad Dominicam Palmarum inclusive, neque in Feriis extra tempus Paschale. n. 3: Cum dicitur, omittitur semper nonum, vel tertium Responsorium, et statim dicitur post ultimam Lectionem. n. 4: when it is not said, the ninth or third responsory takes its place and Lauds begins at once; likewise when the Te Deum is said, Lauds begins at once after it, except on Christmas night, when the prayer is said and Mass follows. So the Te Deum closes Matins on feasts (in place of the last responsory) and is left out on the Sundays and ferias of Advent; a feast falling in Advent keeps it."
notes = "advent-pc-fix2. Read in lane 3's scratch copy of the facsimile, whose SHA-256 equals this artifact; PDF p. 48 = printed p. xxxviii. Public domain. The descriptor 'left out in Advent' is exact only for Advent Sundays and ferias: n. 1 keeps the Te Deum on every feast of the year."
