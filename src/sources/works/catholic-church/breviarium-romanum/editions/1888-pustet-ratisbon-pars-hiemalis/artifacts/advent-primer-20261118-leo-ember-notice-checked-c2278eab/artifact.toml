rights_basis = "Public domain in the United States by publication date. The title page of this copy, read on the page image at PDF p. 11 of the registered facsimile on 2026-11-18, reads BREVIARIUM ROMANUM ... EDITIO PRIMA POST TYPICAM ... PARS HIEMALIS ... RATISBONAE, NEO EBORACI & CINCINNATI. SUMPTIBUS ET TYPIS FRIDERICI PUSTET ... MDCCCLXXXVIII. A work published before 1931 is out of United States copyright: that is the line guidance/missals.md section 5 records from Cornell's public-domain chart as current on 1 January 2026, and because it moves every January it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A cannot keep it protected: a restored term runs no longer than ninety-five years from publication, and ninety-five years from 1888 ended with 1983. This focused transcription reproduces only Latin printed in that book and adds no authorship; no modern edition, apparatus or translation is reproduced."
