notes = "Dominica III. Adventus, second nocturn: the heading of Leo's sermon (printed p. 153 left column, above Lectio iv) and the whole of Lectio vi (p. 153 right column foot to p. 154 left column), which ends with the notice of the Wednesday and Friday fast and the Saturday vigil at St Peter's. Lessons iv-v are not transcribed. UNDER THE 1960 RUBRICS THE SUNDAY SECOND NOCTURN IS NOT READ (R2, from AAS 52 nn. 162a, 220): this is a witness to Leo's text and to the pre-1960 Office, not to what the 1962 Office reads. WHICH BREVIARY THIS IS. This is the pre-1911 Breviary: the 1888 Pustet editio prima post typicam of the Clementine-Urban-Leonine book, before Pius X's Divino afflatu (1911) rearranged the Psalter and before the 1960 Codex Rubricarum. It is not a 1962 witness. What research lane R2 (scratch dossier of 2026-11-18) established, and this record does not re-establish: (1) the Advent Isaiah course in an OCR outline of a 1942 post-Divino-afflatu Breviary (IA breviarium-romanum-1942-pars-hiemalis, text layer only, rights not established) assigns the same chapters to the same days as this book, a comparison made on OCR at chapter level only; (2) under the 1960 Codex Rubricarum (AAS 52) Sunday Matins has one nocturn of three lessons, the first two from the Scripture lessons i-iii printed here and the third from the opening of the homily (nn. 162a, 220), ferial Matins reads three lessons of occurring Scripture as the Breviary prints them (nn. 171a, 222b), impeded Scripture lessons are omitted (n. 213), and the Ember days read homilies (n. 222a). No printed 1961/62 Breviary was read (the 1961 Benziger copies on the Internet Archive are lending-restricted), so the identity of any wording here with the 1962 Breviary is not established by this record. 7 LF-terminated lines."
