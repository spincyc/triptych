notes = "The final antiphon of Our Lady at Compline (Ad Completorium), printed pp. 130-131 (PDF pp. 184-185): the rubric introducing the seasonal antiphons, the bounds rubric, the six lines of Alma Redemptoris Mater, the Advent versicle and response, the collect Gratiam tuam, the Christmastide change (versicle Post partum and collect Deus, qui salutis aeternae) and the rubric that closes its season at the Purification before Ave Regina caelorum. NOTE THE BOOK'S PUNCTUATION: no comma after aeternae in Deus, qui salutis aeternae beatae Mariae (the 1915 Little Office prints one), and a comma after Domine in Gratiam tuam, quaesumus Domine, read at 300 dpi. WHICH BREVIARY THIS IS. This is the pre-1911 Breviary: the 1888 Pustet editio prima post typicam of the Clementine-Urban-Leonine book, before Pius X's Divino afflatu (1911) rearranged the Psalter and before the 1960 Codex Rubricarum. It is not a 1962 witness. What research lane R2 (scratch dossier of 2026-11-18) established, and this record does not re-establish: (1) the Advent Isaiah course in an OCR outline of a 1942 post-Divino-afflatu Breviary (IA breviarium-romanum-1942-pars-hiemalis, text layer only, rights not established) assigns the same chapters to the same days as this book, a comparison made on OCR at chapter level only; (2) under the 1960 Codex Rubricarum (AAS 52) Sunday Matins has one nocturn of three lessons, the first two from the Scripture lessons i-iii printed here and the third from the opening of the homily (nn. 162a, 220), ferial Matins reads three lessons of occurring Scripture as the Breviary prints them (nn. 171a, 222b), impeded Scripture lessons are omitted (n. 213), and the Ember days read homilies (n. 222a). No printed 1961/62 Breviary was read (the 1961 Benziger copies on the Internet Archive are lending-restricted), so the identity of any wording here with the 1962 Breviary is not established by this record. 16 LF-terminated lines."
