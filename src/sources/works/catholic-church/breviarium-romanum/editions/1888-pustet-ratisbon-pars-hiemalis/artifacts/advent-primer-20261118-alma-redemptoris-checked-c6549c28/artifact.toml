transformation = "Read on page images rendered from the exact registered whole PDF (SHA-256 verified) with pdftoppm at 150 dpi, with doubtful points re-read at 300 dpi, on 2026-11-18. One sense unit per LF-terminated UTF-8 line, each prefixed by a braced locator giving the printed page (PDF page = printed page + 54 throughout pp. 130-173, checked on the running folios of every page opened). Joined: physical line wraps and division hyphens. Removed: the printed acute stress accents. Expanded: the ligatures ae and oe (Æ to Ae, æ to ae, œ to oe). Kept as printed: spelling (coeli, ejus, foecunda, Coena), capitalization, pointing, the diaeresis in Israël and Ephraïm, asterisks, and the versicle and response signs, rendered U+2123 and U+211F. Rubrics printed in red are transcribed as plain text where they are transcribed at all. The printer's space before a colon or semicolon is not significant and is not reproduced. The Internet Archive text layer was used only to find the pages. The six hexameter lines of the antiphon are one printed verse line per line (the book sets them as six hanging-indented lines)."
