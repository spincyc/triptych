notes = "The complete Internet Archive DjVuTXT optical text layer of item p1breviariumroma00cathuoft: 115,263 LF-terminated lines, valid UTF-8, no CR bytes. Completeness check: byte size and SHA-1 equal the item's own file listing. Uncorrected optical recognition: a locating and searching layer, not a text of record; wording quoted from it must be collated against the page images of the same item's PDF, and a raw-line negative over it is evidence about the recognition, not about the printed page. It is the text layer of the same item as the PDF, recognised from the item's original page images rather than from the PDF's bytes, so no derived_from edge is asserted. The Advent Proprium de Tempore runs from about line 27850 (Creator alme siderum at line 27870) to about line 32600 (Isaiah 66 heading at line 32501) (Sabbato ante Dominicam I. Adventus to the end of the week IV ferias). WHICH BREVIARY THIS IS. This is the pre-1911 Breviary: the 1888 Pustet editio prima post typicam of the Clementine-Urban-Leonine book, before Pius X's Divino afflatu (1911) rearranged the Psalter and before the 1960 Codex Rubricarum. It is not a 1962 witness. What research lane R2 (scratch dossier of 2026-11-18) established, and this record does not re-establish: (1) the Advent Isaiah course in an OCR outline of a 1942 post-Divino-afflatu Breviary (IA breviarium-romanum-1942-pars-hiemalis, text layer only, rights not established) assigns the same chapters to the same days as this book, a comparison made on OCR at chapter level only; (2) under the 1960 Codex Rubricarum (AAS 52) Sunday Matins has one nocturn of three lessons, the first two from the Scripture lessons i-iii printed here and the third from the opening of the homily (nn. 162a, 220), ferial Matins reads three lessons of occurring Scripture as the Breviary prints them (nn. 171a, 222b), impeded Scripture lessons are omitted (n. 213), and the Ember days read homilies (n. 222a). No printed 1961/62 Breviary was read (the 1961 Benziger copies on the Internet Archive are lending-restricted), so the identity of any wording here with the 1962 Breviary is not established by this record."
