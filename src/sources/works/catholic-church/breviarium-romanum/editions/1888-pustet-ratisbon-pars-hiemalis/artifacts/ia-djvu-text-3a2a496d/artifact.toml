rights_basis = "Public domain in the United States by publication date. The title page of this copy, read on the page image at PDF p. 11 of the registered facsimile on 2026-11-18, reads BREVIARIUM ROMANUM ... EDITIO PRIMA POST TYPICAM ... PARS HIEMALIS ... RATISBONAE, NEO EBORACI & CINCINNATI. SUMPTIBUS ET TYPIS FRIDERICI PUSTET ... MDCCCLXXXVIII. A work published before 1931 is out of United States copyright: that is the line guidance/missals.md section 5 records from Cornell's public-domain chart as current on 1 January 2026, and because it moves every January it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A cannot keep it protected: a restored term runs no longer than ninety-five years from publication, and ninety-five years from 1888 ended with 1983. The bytes are the Internet Archive's optical character recognition of its own page images; machine recognition of a public-domain printing adds no human authorship, and a faithful mechanical reproduction is not original (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)). THE GOOGLE QUESTION WAS DECIDED ON THESE BYTES: case-insensitive probes over the whole file returned 'google' 0, 'usage guidelines' 0 and 'digitized by' 0, and the same probes over the whole PDF's embedded text returned 0. The item is a University of Toronto scan (scanner field uoft1), not a Google digitisation. No host rights label is relied upon."
