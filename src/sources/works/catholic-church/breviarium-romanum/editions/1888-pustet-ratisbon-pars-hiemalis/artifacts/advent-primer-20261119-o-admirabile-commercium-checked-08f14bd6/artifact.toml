transformation = "Read on page images rendered from the exact registered whole PDF (SHA-256 verified) with pdftoppm at 90-150 dpi, with doubtful points re-read at 250-300 dpi, on 2026-11-19. One sense unit (a sentence, a rubric, a heading, or a printed hymn verse line) per LF-terminated UTF-8 line, each prefixed by a braced locator giving the printed page (PDF page = printed page + 54 throughout pp. 133-233, checked on the running folio of every page opened; p. 177, the illustrated opening of In Nativitate Domini at PDF p. 231, prints no folio and is numbered by the rule and by the book's own cross-reference 177 on p. 178). Joined: physical line wraps and division hyphens, and a sentence that runs across a column break. Removed: the printed acute stress accents. Expanded: the ligatures (Æ to Ae, æ to ae, œ to oe). Kept as printed: spelling (coeli, ejus, foetu, eamdem), capitalization, pointing, the diaeresis in Israël, asterisks, page cross-references, and the versicle and response signs, rendered U+2123 and U+211F. Rubrics printed in red are transcribed as plain text. Hymn stanza breaks and indentation are not marked. The printer's space before a colon or semicolon is not significant and is not reproduced. The Internet Archive text layer was used only to find the pages."
