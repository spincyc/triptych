notes = "The heading of the first Matins lesson from Isaiah for every Advent Sunday and feria that this book gives an Isaiah lesson, printed pp. 133-173 (PDF pp. 187-227). No Isaiah heading is printed for the Wednesday, Friday and Saturday of week III (Ember days; their Matins lessons are homilies) or for any Saturday of week IV; those days are therefore absent, not omitted. Advent III Sunday's Isaiah begins at chapter 26 and its Monday at 28; week III Thursday at 33. CORRECTION TO THE R2 DOSSIER: the Saturdays of weeks I and II carry a printed day heading Sabbato. (pp. 142 and 150), so their Isaiah 7 and 25 assignments are printed, not inferred by order. Only lesson i's chapter is recorded; lessons ii and iii (which sometimes move to another chapter, e.g. Advent IV Sunday) are not. WHICH BREVIARY THIS IS. This is the pre-1911 Breviary: the 1888 Pustet editio prima post typicam of the Clementine-Urban-Leonine book, before Pius X's Divino afflatu (1911) rearranged the Psalter and before the 1960 Codex Rubricarum. It is not a 1962 witness. What research lane R2 (scratch dossier of 2026-11-18) established, and this record does not re-establish: (1) the Advent Isaiah course in an OCR outline of a 1942 post-Divino-afflatu Breviary (IA breviarium-romanum-1942-pars-hiemalis, text layer only, rights not established) assigns the same chapters to the same days as this book, a comparison made on OCR at chapter level only; (2) under the 1960 Codex Rubricarum (AAS 52) Sunday Matins has one nocturn of three lessons, the first two from the Scripture lessons i-iii printed here and the third from the opening of the homily (nn. 162a, 220), ferial Matins reads three lessons of occurring Scripture as the Breviary prints them (nn. 171a, 222b), impeded Scripture lessons are omitted (n. 213), and the Ember days read homilies (n. 222a). No printed 1961/62 Breviary was read (the 1961 Benziger copies on the Internet Archive are lending-restricted), so the identity of any wording here with the 1962 Breviary is not established by this record. 24 LF-terminated lines."
