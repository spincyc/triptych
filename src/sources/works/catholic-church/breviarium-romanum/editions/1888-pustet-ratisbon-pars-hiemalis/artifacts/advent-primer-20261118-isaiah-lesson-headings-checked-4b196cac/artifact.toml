transformation = "Read on page images rendered from the exact registered whole PDF (SHA-256 verified) with pdftoppm at 150 dpi, with doubtful points re-read at 300 dpi, on 2026-11-18. One sense unit per LF-terminated UTF-8 line, each prefixed by a braced locator giving the printed page (PDF page = printed page + 54 throughout pp. 130-173, checked on the running folios of every page opened). Joined: physical line wraps and division hyphens. Removed: the printed acute stress accents. Expanded: the ligatures ae and oe (Æ to Ae, æ to ae, œ to oe). Kept as printed: spelling (coeli, ejus, foecunda, Coena), capitalization, pointing, the diaeresis in Israël and Ephraïm, asterisks, and the versicle and response signs, rendered U+2123 and U+211F. Rubrics printed in red are transcribed as plain text where they are transcribed at all. The printer's space before a colon or semicolon is not significant and is not reproduced. The Internet Archive text layer was used only to find the pages. ONE LINE PER LITURGICAL DAY. The braced locator gives the printed page and, after a vertical bar, the page's running head as the PDF text layer gives it, corrected for recognition noise; that running head is a locator, was seen on the image for pp. 133, 138, 139, 149, 152 and 173 only, and is not otherwise image-checked. Everything after the brace was read on a 150-dpi crop of the page image around the heading: the day heading as printed (Feria Secunda. ... Sabbato.; on Sundays In I. Nocturno.), the lesson heading, the chapter with any section letter (Cap. 1. d.), and the opening words of lesson i to the first point the transcriber chose to stop at, which may be mid-sentence (a line ending in a comma or colon is an incipit, not the whole sentence). The decorated initial letter of each lesson is read as the first letter of its first word."
