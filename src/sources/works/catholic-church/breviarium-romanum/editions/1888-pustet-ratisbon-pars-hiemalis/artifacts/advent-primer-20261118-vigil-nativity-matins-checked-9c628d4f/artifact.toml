transformation = "Read on page images rendered from the exact registered whole PDF (SHA-256 verified) with pdftoppm at 300 dpi (PDF pp. 228-229 whole), every transcribed line re-read on 600-dpi crops and the damaged red rubric at 1200 dpi, on 2026-11-18. One sense unit per LF-terminated UTF-8 line, each prefixed by a braced locator giving the printed page and, after a vertical bar, the page's running head, both read on the image (PDF page = printed page + 54 on both pages, as in the edition's isaiah-lesson-headings transcription). Joined: physical line wraps and division hyphens, and the two columns read in printed order (left column, then right). Removed: the printed acute stress accents. Expanded: the ligatures ae and oe (Matthaeum, Vigiliae). Kept as printed: spelling (exsultemus, Jesu), capitalization, pointing, abbreviations (Invit., Lect., Domin., Homil., Offic., Comment., Matth.), the asterisk, page references (165., 12., 2.) and the versicle and response signs, rendered U+2123 and U+211F as single or doubled signs as printed; the abbreviation tilde over the first m of Com̃em. (for Commemoratione) is kept as U+0303 COMBINING TILDE. Rubrics printed in red are transcribed as plain text. Not text: a small mark between Domin. and 12. in the Sunday rubric (the text layer reads it as a comma; on the 1200-dpi image it is a speck below the line, smaller than the commas of the same line) and similar specks under et and de two lines above it; the damaged n of non in the same rubric is read as n. The decorated initial letter of each lesson is read as the first letter of its first word. Each lesson is given to the end of its first sentence or, for lesson i, to the end of the Gospel pericope and the homily's first sentence; the hymn by its first line only, ending in a comma. The Internet Archive text layer was used only to find the pages (its lines 32558-32760); its readings litero, Gap., Gomment., |uare and no;i are recognition errors, and the page governs."
