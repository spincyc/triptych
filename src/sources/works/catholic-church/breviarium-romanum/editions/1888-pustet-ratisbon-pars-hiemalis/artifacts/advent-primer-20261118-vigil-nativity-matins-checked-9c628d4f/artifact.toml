notes = "Matins of the Vigil of the Nativity in the Proprium de Tempore, printed pp. 174-175 (PDF pp. 228-229), under the running head In Vigilia Nativitatis Domini. on both pages. The heading prints no calendar date: the office is the Vigil of the Nativity, 24 December, by its title, and it follows the week IV ferias (whose Feria Sexta lesson iii, Benedictus antiphon Ecce completa sunt and Magnificat antiphon O Emmanuel end at the top of p. 174's left column; they are not transcribed). Line 1: the red rubric for a Vigil falling on Sunday (I and II Nocturns of the Fourth Sunday of Advent, p. 165; in the III Nocturn the Vigil's three lessons of the homily with their responsories, the Sunday homily not read; Lauds of the Vigil with commemoration of the Sunday). Lines 2-8: the Vigil's own Matins, in printed order: heading, invitatory Hodie scietis and Ps. Venite; the hymn Verbum supernum prodiens (first line only); the rubric Ant. et Ps. de Feria occurr. and the versicle; then ONE NOCTURN OF THREE LESSONS: lesson i, the Gospel Matthew 1 (Cap. 1. c.), Cum esset desponsata mater Jesu Maria Joseph, with the homily of St Jerome, Lib. I. Comment. in c. 1. Matth., Quare non de simplici virgine; lessons ii (Antequam convenirent) and iii (Joseph autem vir ejus) continue the same homily under no new source heading; and the rubric Deinceps Offic. fit Duplex. The responsories after the lessons (Sanctificamini hodie; Constantes estote; Sanctificamini, filii Israel, with Gloria Patri after the third) and the hymn's remaining stanzas are not transcribed. WHICH BREVIARY THIS IS. This is the pre-1911 Breviary: the 1888 Pustet editio prima post typicam, before Divino afflatu (1911) and the 1960 Codex Rubricarum. It is not a 1962 witness, and the identity of this Matins with the 1962 Breviary's is not established by this record. 8 LF-terminated lines."
