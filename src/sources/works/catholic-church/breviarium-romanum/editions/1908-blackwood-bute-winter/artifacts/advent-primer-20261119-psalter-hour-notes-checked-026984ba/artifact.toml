notes = "Bute's Psalter: the heading of each of Mattins, Lauds, Prime, None, Vespers and Compline and its first footnote, which gives the proper hour of that Office. 24 LF-terminated lines. The headings of Terce and Sext also carry notes of their proper hours (located in the optical text only); they are not transcribed."
