notes = "The complete Internet Archive DjVuTXT optical text layer of item romanbreviaryref01cathuoft (volume I, Winter): 119,094 LF-terminated lines, valid UTF-8, no CR bytes. Completeness check: byte size and SHA-1 equal the item's own file listing. Uncorrected optical recognition: a locating and searching layer, not a text of record. It misreads drop capitals and several lesson headings; for example the Advent II third-nocturn heading reads '(\\oth Homily o?i the Gospels.)' and the Ember Saturday heading '(10th on the Gospels.)', which the page images (printed pp. 229 and 254, PDF pages 313 and 338, read on 400 dpi crops on 2026-11-18) read '(10th Homily on the Gospels.)' and '(20th on the Gospels.)' respectively, as recorded in this edition's advent-primer passages. Wording quoted from it must be collated against the page images of artifact.catholic-church.breviarium-romanum.blackwood-bute-winter-1908.english-completion-20261029-postconciliar-bute1908-pdf (PDF page = printed page + 84 in the Proper of the Season). It is the text layer of the same item as that PDF, recognised from the item's original page images rather than from the PDF's bytes, so no derived_from edge is asserted."
