text = "First Responsory. I look from afar, and, behold, I see the Power of God coming, and a cloud covering all the land. Go ye out to meet Him, and say: Tell us if Thou art He, That shalt reign over God’s people Israël. Verse. Both low and high, rich and poor together. Answer. Go ye out to meet Him, and say. Verse. Give ear, O Shepherd of Israël, Thou That leadest Joseph like a flock. Answer. Tell us if Thou art He. Verse. Lift up your gates, O ye princes; and be ye lift up, ye everlasting doors, and the King of glory shall come in. Answer. That shalt reign over God’s people Israël. Verse. Glory be to the Father, and to the Son, and to the Holy Ghost. Answer. I look from afar, and, behold, I see the Power of God coming, and a cloud covering all the land. Go ye out to meet Him, and say: Tell us if Thou art He, That shalt reign over God’s people Israël."
