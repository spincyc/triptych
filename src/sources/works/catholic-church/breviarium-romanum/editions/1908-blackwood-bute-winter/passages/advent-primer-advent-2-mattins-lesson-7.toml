text = "Seventh Lesson. The Lesson is taken from the Holy Gospel according to Matthew (xi. 2.) AT that time: When John had heard in the prison the works of Christ, he sent two of his disciples, and said unto Him: Art Thou He That should come, or do we look for another? And so on. Homily by Pope St Gregory [the Great,] (10th Homily on the Gospels.) The sight of so many signs and so many mighty works should have been a source of wonder, and not a stumbling-block. And yet the unfaithful found these very works a rock of offence, when they afterwards saw Him Who had worked so many miracles dying on the Cross. Hence Paul saith: “We preach Christ crucified, unto the Jews a stumbling-block and unto the Gentiles foolishness.” (1 Cor. i. 23.) It is indeed folly in the eyes of men to say that the Author of life died for men: and thus men put as a stumbling-block to hinder them from coming to JESUS, the very thing that doth oblige them the most unto Him. For the more humbling God hath undergone for man’s sake, the more worthy is He that man should worship Him."
