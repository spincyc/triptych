text = "Fourth Lesson. The Lesson is taken from the Sermons of Pope St Leo [the Great,] (8th on the December Fast, and almsgiving.) OUR Saviour Himselt instructed His disciples concerning the times and seasons of the coming of the Kingdom of God and the end of the world, and He hath given the same teaching to the Church by the mouth of His Apostles. In connection with this subject then, Our Lord biddeth us beware lest we let our hearts grow heavy through excess of meat and drink, and worldly thoughts. Dearly beloved brethren, we know how that this warning applieth particularly to us. We know that that day is coming, and though for a season we know not the very hour, yet this we know, that it is near."
