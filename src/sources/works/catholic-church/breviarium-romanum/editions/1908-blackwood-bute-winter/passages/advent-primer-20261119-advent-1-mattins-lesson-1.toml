notes = "Bute renders Isaiah 1:1-3 in the Authorised Version's proper names (Isaiah, Amoz, Uzziah, Jotham, Ahaz, Hezekiah) with Israël, and Me/My capitalized for God. Footnote 2 (on the kings, citing Lowth on the date) is not transcribed. The Matins hymn on the same page is Newman's Supernal Word, proceeding from (footnote 1: Hymn of the Ambrosian school, very much altered; translation by the late Card. Newman), not transcribed here. OCR differs from the page only in recognition noise."
