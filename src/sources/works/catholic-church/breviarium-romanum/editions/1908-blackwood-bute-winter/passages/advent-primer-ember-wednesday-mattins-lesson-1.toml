text = "First Lesson. The Lesson is taken from the Holy Gospel according to Luke (i. 26.) AT that time: The Angel Gabriel was sent from God, unto a city of Galilee, named Nazareth, to a virgin espoused to a man whose name was Joseph, of the house of David: and the virgin’s name was Mary. And so on. Homily by St Ambrose, Bishop [of Milan,] (Bk. ii. on Luke.) The mysteries of God are unsearchable, and it is especially declared by a Prophet, that a man can hardly know His counsels. (Wisd. ix. 13.) Nevertheless, some things have been revealed to us, and we may gather from some of the words and works of the Lord our Saviour, that there was a special purpose of God, in the fact that she who was chosen to be the mother of the Lord was espoused to a man. Why did not the power of the Highest overshadow her before she was so espoused? Perhaps it was lest any might blasphemously say that she had conceived in adultery the Holy One."
