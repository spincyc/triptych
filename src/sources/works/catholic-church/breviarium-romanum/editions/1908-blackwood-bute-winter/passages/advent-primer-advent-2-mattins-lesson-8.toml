text = "Eighth Lesson. “AND blessed is he, whosoever shall not be offended in Me.” Now what is this, but a plain mention of that time, when He afterwards humbled Himself, becoming obedient unto death, even the death of the Cross? It is as if He said: “I indeed do wonderful works, but the day will come when I shall not refuse to suffer shame and evil treatment. Take heed then, ye who now worship Me for the works’ sake, that when I come to die ye despise Me not for My death’s sake.”"
