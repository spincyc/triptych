text = "Fourth Lesson. The Lesson is taken from the Sermons of Pope St Leo [the Great,] (Second on the December Fast, and Almsgiving.) DEARLY beloved brethren, with the care which becometh us as the shepherd of your souls, we urge upon you the rigid observance of this December Fast. The month of December hath come round again, and with it this devout custom of the Church. The fruits of the year, which is drawing to a close, are now all gathered in, and we most meetly offer our abstinence to God as a sacrifice of thanksgiving. And what can be more useful than fasting, that exercise by which we draw nigh to God, make a stand against the devil, and overcome the softer enticements of sin?"
