text = "Prayer. STIR up, O Lord, we pray Thee, Thy power, and come among us, and with great might succour us, that whereas through our sins and wickedness we are sore let and hindered, Thy bountiful grace and mercy may speedily help and deliver us; Who livest and reignest with God the Father, in the unity of the Holy Ghost, one God, world without end. Amen."
