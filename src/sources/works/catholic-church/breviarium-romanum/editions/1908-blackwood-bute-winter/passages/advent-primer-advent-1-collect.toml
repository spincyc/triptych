text = "Prayer. STIR up, O Lord, we pray Thee, Thy strength, and come among us, that whereas through our sins and wickedness we do justly apprehend Thy wrathful judgments hanging over us, Thy bountiful grace and mercy may speedily help and deliver us; Who livest and reignest with God the Father, in the unity of the Holy Ghost, one God, world without end. Amen. The same Prayer is used throughout the day and week, except at Prime and Compline."
