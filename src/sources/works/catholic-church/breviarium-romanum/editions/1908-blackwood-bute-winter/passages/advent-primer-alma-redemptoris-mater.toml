text = "I. From the Vespers of the Saturday before Advent Sunday till those of Candlemas, both inclusive. Antiphon. Maiden! Mother of Him Who redeemed us, thou that abidest Heaven’s open gate, and the Star of the Sea, come, succour the fallen! Fallen indeed we are, but fain would rise by thy succour. Thou that beyond nature’s course hast borne in time the Eternal; Thou that a Virgin before, and after that childbirth remainest, From the Archangel’s lips the quickening message receiving, Mother of JESUS and us, turn thine eyes of mercy on sinners. Verse. The Angel of the Lord announced unto Mary, Answer. And she conceived of the Holy Ghost. Let us pray. WE beseech Thee, O Lord, pour Thy grace into our hearts; that, as we have known the Incarnation of Thy Son JESUS Christ by the message of an Angel, so by His Passion and Cross we may be brought unto the glory of His Resurrection. Through the same Christ our Lord. Answer. Amen. From the First Vespers of Christmas inclusive, the Verse and Answer and Prayer are as follows: Verse. After thy delivery thou still remainest a Virgin undefiled. Answer. Mother of God, pray for us. Let us pray. O GOD, Who, by the fruitful virginity of the Blessed Mary, hast given unto mankind the rewards of everlasting life; grant, we beseech Thee, that we may continually feel the might of her intercession; through whom we have worthily received the Author of our life, our Lord JESUS Christ Thy Son. Answer. Amen. Of these four Antiphons, “Maiden Mother” is ascribed to Hermann the Cripple, a monk of Reichenau, who died A.D. 1052."
