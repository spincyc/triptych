text = "Seventh Lesson. The Lesson is taken from the Holy Gospel according to Luke (iii. 1.) IN the fifteenth year of the reign of Tiberius Cæsar, Pontius Pilate being governor of Judæa. And so on. Homily by Pope St Gregory [the Great,] (20th on the Gospels.) “John said unto the multitude, that came forth to be baptised of him: O generation of vipers, who hath warned you to flee from the wrath to come?” “The wrath to come” in one sense signifieth the great vengeance of the Latter Day: the sinner that repenteth not of his sin now, will have no mean whereby to flee from punishment then. Let us remark that addressing evil children copying the example of evil parents, the Baptist calleth them a generation of vipers: in that they were envious at the righteous, and persecuted them; that they repaid evil for evil; that they hunted out ways of harming their neighbours,—in all these things following the pattern of carnal parents, the prophet likeneth them to a venomous brood hatched from a venomous stock."
