notes = "The footnote is Bute's statement that this is 'Another hymn of the Ambrosian school, altered almost beyond recognition; one verse omitted; translation by the late Card. Newman.' This edition prints no Latin. The Latin of the Roman Breviary of this period is Creator alme siderum, the 1632 revision of the older Conditor alme siderum; that identification is not made on this page, and the attribution to the Ambrosian school is Bute's own."
