context = "The complete English Vespers hymn of Advent as printed, line by line, with Bute's footnote on its origin and translator and the following Verse and Answer (Drop down, ye heavens), read on printed page 213 (PDF page 297, with 300 dpi crops of the hymn and footnote)."
physical_line_ranges = [[1, 28]]
text = "Hymn. CREATOR of the starry pole, Saviour of all who live, And light of every faithful soul, JESU, these prayers receive. Who sooner than our foe malign Should triumph, from above Didst come, to be the medicine Of a sick world, in love; And the deep wounds to cleanse and cure Of a whole race, didst go, Pure Victim, from a Virgin pure, The bitter Cross unto. Who hast a Name, and hast a Power, The height and depth to sway, And Angels bow, and devils cower, In transport or dismay; Thou too shalt be our Judge at length; Lord, in Thy grace bestow Thy weapons of celestial strength, And snatch us from the foe. Honour and glory, power and praise, To Father, and to Son, And Holy Ghost, be paid always, The Eternal Three in One. Amen. Another hymn of the Ambrosian school, altered almost beyond recognition; one verse omitted; translation by the late Card. Newman. Verse. Drop down, ye heavens, from above, and let the skies pour down the Righteous One. Answer. Let the earth open, and let her bring forth the Saviour."
