text = "The Seven Days preceding Christmas Eve are marked by the Church with two observances; 1st, The series of Antiphons called the Great O’s, and 2nd, by a special series of Antiphons at Lauds. The rules which apply to them are different. 1. The Great O’s. The Great O’s are a series of Antiphons at the Song of the Blessed Virgin, one for every evening from Dec. 17 to 23 inclusive. They supplant any other Antiphon of the Office of the Season, (as, for instance, if the 17th Dec. should be the Third Sunday of Advent, the Antiphon, “Blessed art thou” is displaced for “O Wisdom.”) The Great O’s however can be supplanted by Feasts, (as, for instance, “O Wisdom” and “O Adonai” by the Feast of the Expectation, and “O Day-Spring,” by the Feast of St Thomas,) and then they are treated as the Antiphon for the Week-day, forming part of the Commemoration. They are always said entire both before and after the Canticle, like the Antiphon on Double Feasts. Dec. 17. O WISDOM, That comest out of the mouth of the Most High, That reachest from one end to another, and dost mightily and sweetly order all things: come, to teach us the way of prudence! Dec. 18. O ADONAI, and Ruler of the house of Israël, Who didst appear unto Moses in the burning bush, and gavest him the law in Sinai: come, to redeem us with an outstretched arm! Dec. 19. O ROOT of Jesse, Which standest for an ensign of the people, at Whom the kings shall shut their mouths, unto Whom the Gentiles shall seek: come, to deliver us, make no tarrying! Dec. 20. O KEY of David, and Sceptre of the house of Israël; That openest, and no man shutteth; and shuttest and no man openeth: come, to bring out the prisoners from the prison, and them that sit in darkness, and in the shadow of death! Dec. 21. O DAY-SPRING, Brightness of the everlasting Light, Sun of Righteousness, come, to give light to them that sit in darkness, and in the shadow of death! Dec. 22. O KING of the Gentiles, yea, and Desire thereof, O Corner-stone that makest of twain one: come, to save man, whom Thou hast made of the dust of the earth! Dec. 23. O EMMANUEL, our King and our Law-giver, Longing of the Gentiles, yea, and Salvation thereof: come to save us, O Lord our God! I.e., Lord. This is the Hebrew word which the Jews substitute for any endeavour to pronounce the Name."
