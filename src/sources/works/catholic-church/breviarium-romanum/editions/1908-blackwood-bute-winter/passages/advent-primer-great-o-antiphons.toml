notes = "The line-end 'Corner-stone' (Dec. 22) is kept hyphenated as a printed compound; 'Law - giver' (Dec. 23) is printed mid-line with spaced hyphen and is closed to 'Law-giver'. Scripture footnote numerals inside the antiphons (Ecclus. xxiv. 5; Wisd. viii. 1; Isa. xi. 10; Isa. lii. 15; Apoc. iii. 7; Isa. xlii. 7; Luke i. 78, 79; Wisd. vii. 26; Mal. iv. 2; Hag. ii. 8; Eph. ii. 14, 20; Gen. xlix. 10) are omitted. OCR AGAINST PAGE: the text layer's 'suprplanted', 'Israel' and 'Dec. 1 7 to 2 3' read 'supplanted', 'Israël' and 'Dec. 17 to 23'."
