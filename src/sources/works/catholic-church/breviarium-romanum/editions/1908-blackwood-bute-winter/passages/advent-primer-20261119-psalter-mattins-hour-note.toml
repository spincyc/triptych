context = "The heading over the first Office of the Psalter (printed p. 1, PDF p. 85, a page that prints no number) and its footnote 1, which fills the foot of the page; footnote 2 below it, on the inaudible Lord's Prayer and Creed, is not transcribed."
notes = "Bute heads Mattins as Morning Prayer, but its footnote gives midnight as the proper hour and allows it to be said from the time the sun begins to decline; the Prime note (passage advent-primer-20261119-psalter-prime-hour-note) puts Mattins and Lauds at the middle and close of night. The 5 of 2 or 5 A.M. was read at 600 dots per inch against the 3 of the Lauds note; the optical text also reads 5."
