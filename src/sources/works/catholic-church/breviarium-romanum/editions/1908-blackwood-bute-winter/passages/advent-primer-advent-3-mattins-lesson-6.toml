text = "Sixth Lesson. LET us defend the widow and serve the orphan; let us comfort the afflicted and reconcile the estranged; let us take in the wanderer and succour the oppressed; let us clothe the naked and cherish the sick. And may every one of us that shall offer to the God of all goodness this Advent sacrifice of fasting and alms be by Him fitted to receive an eternal reward in His heavenly kingdom! We fast on Wednesday and Friday; and there is likewise a Vigil on Saturday at the Church of St Peter, that by his good prayers we may the more effectually obtain what we ask for, through our Lord JESUS Christ, Who with the Father and the Holy Ghost, liveth and reigneth, one God, world without end. Amen."
