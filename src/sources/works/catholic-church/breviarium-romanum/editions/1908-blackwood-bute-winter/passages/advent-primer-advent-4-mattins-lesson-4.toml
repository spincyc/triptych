text = "Fourth Lesson. The Lesson is taken from the Sermons of Pope St Leo [the Great,] (1st on the December Fast, and almsgiving.) DEARLY beloved brethren, if we study attentively the history of the creation of our race, we shall find that man was made in the image of God, that his ways also might be an imitation of the ways of his Maker. This is the natural, real, and highest dignity to which we are capable of attaining, that the goodness of the Divine nature should have a reflection in us, as in a glass. As a mean of reaching this dignity, we are daily offered the grace of our Saviour, for as in the first Adam all men are fallen, so in the Second Adam can all men be raised up again (1 Cor. xv. 22)."
