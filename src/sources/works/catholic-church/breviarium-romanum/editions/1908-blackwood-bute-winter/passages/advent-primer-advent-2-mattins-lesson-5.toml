text = "The Lesson is taken from the Commentary on the Prophecies of Isaiah made by St Jerome, Priest [at Bethlehem,] (Book iv. c. xi.) Fifth Lesson. WE, however, understand that the rod out of the root of Jesse signifieth the holy Virgin Mary. She was a clean stem that had as yet put forth no shoot; as we have read above: “Behold, the Virgin shall conceive and bear a son.” (Isa. vii. 14.) And the flower we believe to mean the Lord our Redeemer, Who hath elsewhere compared Himself to a flower; “I am a flower of the plain, and a lily of the valleys.” (Cant. ii. 1.)"
