physical_line_ranges = [[1, 7]]
text = "Fifth Lesson. FASTING hath ever been the bread of strength. From abstinence proceed pure thoughts, reasonable desires, and healthy counsels. By voluntary mortifications the flesh dieth to lust, and the soul is renewed in might. But since fasting is not the only mean whereby we get health for our souls, let us add to our fasting works of mercy. Let us spend in good deeds what we take from indulgence. Let our fast become the banquet of the poor."
