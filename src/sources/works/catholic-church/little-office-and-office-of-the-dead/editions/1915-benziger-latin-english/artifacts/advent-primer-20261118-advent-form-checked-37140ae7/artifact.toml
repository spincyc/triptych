notes = "The Advent form of the Little Office as this 1915 book states and prints it: rubrics 1, 7, 8 and 14 (printed pp. 11-13, PDF 17-19); the first Vespers antiphon In Adventu with its English (pp. 28-29, PDF 34-35); and at Compline the final antiphon Alma Redemptoris Mater, Latin and English, with its Advent versicle and collect and the Christmastide change of versicle (pp. 82-85, PDF 88-91). The Latin and English rubrics for the Christmastide change DISAGREE in this book: the Latin reads A Vigilia Nativitatis usque ad totam diem Purificationis, the English From the First Vespers of Christmas until the Second Vespers of the Purification; both are transcribed and neither is preferred. The English Alma is a metrical rendering: Caswall's 1849 text (Lyra Catholica p. 38) with a different last line and different pointing and capitals; the book names no translator. Other Advent changes (Vespers chapter Is 11, Magnificat antiphon, collect Deus qui de beatae, Compline chapter Is 7, Matins lessons from Luke 1) are not transcribed here. The book calls itself conformable to the recent Pontifical Decrees; it is a 1915 witness, not a 1962 one. 46 LF-terminated lines."
