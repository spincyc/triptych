transformation = "Read on page images rendered at 150 dpi from the exact registered whole PDF; PDF page = printed page + 6 throughout pp. 11-85, checked on every running folio opened. One sense unit, verse line or heading per LF-terminated UTF-8 line, each prefixed by a braced printed-page locator. Latin: printed acute stress accents removed and the ligatures ae and oe expanded (æ to ae, œ to oe); otherwise spelling, capitalization and pointing as printed. English: as printed, apostrophe U+2019. The book's italic V. and R. are transcribed V. and R.; italic and roman are not distinguished; the asterisk is kept; the printer's space before : ; ! and ? is not reproduced; physical line wraps and division hyphens are joined. Units are grouped Latin then English, so the line order is not the page order. The OCR text layer was used only to find the pages."
