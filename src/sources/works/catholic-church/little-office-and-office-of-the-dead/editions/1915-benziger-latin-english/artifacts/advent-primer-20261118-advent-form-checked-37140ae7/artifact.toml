rights_basis = "The identified book was published at New York by Benziger Brothers in 1915; the approval leaf (PDF p. 10, read on the image on 2026-11-18) prints Nihil obstat Remigius Lafort, Imprimatur John Cardinal Farley, New York, June 10, 1915, and COPYRIGHT, 1915, BY BENZIGER BROTHERS. A United States work first published in 1915 has no remaining United States copyright term in 2026: a work published before 1931 is out of copyright on the line guidance/missals.md section 5 records, written here as derived for calendar year 2026. This focused transcription reproduces only the printed Latin and unnamed historical English of that book and adds no authorship; no modern text is reproduced."
