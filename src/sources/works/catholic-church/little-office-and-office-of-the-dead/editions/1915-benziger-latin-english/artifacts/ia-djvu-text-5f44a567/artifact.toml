notes = "The complete Internet Archive DjVuTXT optical text layer of item littleofficeofbl00newy: 16,669 LF-terminated lines, valid UTF-8, no CR bytes. Completeness check: byte size and SHA-1 equal the item's own file listing. Uncorrected optical recognition: a locating and searching layer, not a text of record; wording quoted from it must be collated against the page images of the same item's PDF, and a raw-line negative over it is evidence about the recognition, not about the printed page. It is the text layer of the same item as the PDF, recognised from the item's original page images rather than from the PDF's bytes, so no derived_from edge is asserted. Advent material: rubrics at about lines 310-420 (printed pp. 11-13); the In Adventu variants recur through the Hours from about line 915; the Compline final antiphon Alma Redemptoris from about line 3045 (printed pp. 82-85). The book sets Latin on even and English on odd pages, so a unit's Latin and English are on facing pages."
