notes = "Reading transcription with ae ligatures expanded and line-wrap hyphenation joined: Famulórum tuórum, quaesumus, Dómine, delíctis ignósce; ut qui tibi placére de áctibus nostris non valémus, Genitrícis Fílii tui Dómini nostri intercessióne salvémur. Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia saecula saeculórum. The separate R. Amen. is excluded. Genitricis is the historical spelling; modern official comparison prints Genetricis. Exact 2008 full-body correspondence is not asserted."
