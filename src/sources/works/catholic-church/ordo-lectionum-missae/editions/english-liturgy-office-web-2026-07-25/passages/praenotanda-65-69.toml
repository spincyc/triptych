context = "Articles 65 to 69 were read. Article 65 states that the Order of Readings for Sundays and the solemnities of the Lord extends over three years and for weekdays over two, each running independently of the other. Article 66 gives three readings on Sundays and solemnities of the Lord, Old Testament, apostle and gospel, notes that the three-year cycle means the same texts are read only every fourth year, and names harmony and semicontinuous reading as the governing principles. Article 67 explains that in Ordinary Time the apostolic and gospel readings are semicontinuous while the Old Testament reading is harmonised with the gospel. Article 68 declines to impose an organic harmony of themes on Sundays. Article 69 gives two readings on weekdays, an annual gospel cycle in Ordinary Time and a two-year first-reading cycle, Year I in odd and Year II in even years."
