context = "Articles 74 to 77 were read. Article 74 reserves certain books to certain seasons, retaining the reading of Acts in Eastertide and of John in the later weeks of Lent and in Eastertide, and Isaiah in Advent. Article 75 states the criterion of length and the provision of longer and shorter forms. Article 76 states that in readings for Sundays and solemnities texts presenting real difficulties are avoided for pastoral reasons, while disallowing difficulty arising from inadequate religious education or inadequate biblical formation of pastors as a ground for omission. Article 77 states that the omission of verses has at times been the practice in many liturgical traditions including the Roman, that such omissions may not be made lightly for fear of distorting the meaning or the intent and style of Scripture, and that it was nevertheless decided on pastoral grounds to continue the practice while keeping the essential meaning intact."
