notes = "Partial source registration of the identified Latin additions article: the opening insertion-authority footnote and twelve explicitly inspected dated reading courses only. This is a supplement expression of the Ordo lectionum Missae, not the whole 1981 second typical edition, the complete 2015 article, a 2008 altar Missal, or an approved English Lectionary. The opening footnote directs insertion into the 1981 editio typica altera. Course numbers remain local to this 2015 expression. No calendar reading choice is activated and no prayer or reading body is supplied."
