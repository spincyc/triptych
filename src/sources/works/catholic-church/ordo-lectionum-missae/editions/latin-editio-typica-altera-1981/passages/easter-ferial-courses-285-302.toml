context = "Source appointments/classification only, OLM nn.285-302, AP207-212 / printed153-158. All eighteen complete acclamations were inspected on whole page images and compared with complete containing registered Clementine verses, and registered Greek John/Luke where held, not classified from a citation label or comparison cue alone. Exactly fifteen existing scripture owners are classified as adapted/composed, with no new raw proper. Nn.293/298 remain continuous John14:16 Bible-excerpt routes and n.296 remains the whole John16:28 Bible route; this does not establish approved English or new independently witnessed exact liturgical Latin. N.285 AP207/p153: John 14:26; adapted/composed; body unavailable, held-unpublished; Whole verse comparison: selects the Spirit clause, omits the intervening sending clause and subject, removes a connective, and uses a different relative/verb form; Greek whole verse independently controls the tense difference. This is not merely the continuous tail of the Clementine verse. No whole-unit independent witness or publication basis established. N.286 AP207/p153: Luke 24:46, 26; adapted/composed; body unavailable, held-unpublished; Whole two-verse comparison: composes selected suffering/resurrection and entry-into-glory clauses in the printed nonascending order, removes the third-day clause and framing language. Neither complete verse is this whole liturgical unit; no independent whole-unit witness/publication basis established. N.287 AP207/p153: John 15:4a, 5b; adapted/composed; body unavailable, held-unpublished; Whole verses 4 and 5: selected vine clauses omit intervening material and insert a liturgical speaker attribution; preserve the appointment's parts only as metadata, not a translated cut. N.288 AP208/p154: John 10:27; adapted/composed; body unavailable, held-unpublished; Whole verse includes no equivalent of the inserted liturgical speaker attribution. N.289 AP208/p154: John 15:15b; adapted/composed; body unavailable, held-un