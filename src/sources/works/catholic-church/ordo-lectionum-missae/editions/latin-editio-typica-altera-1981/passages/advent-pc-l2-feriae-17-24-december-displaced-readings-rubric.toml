context = "The italic rubric under the heading Feriae Adventus a die 17 ad diem 24 decembris, printed p. 110, before n. 193. Its sense, paraphrased and not quoted: the following readings are used on the days to which they are assigned; readings omitted because a Sunday occurs may be resumed or anticipated on another day, especially in place of readings that happen to be assigned to that year's Sunday. The same page prints n. 193 with the responsorial psalm cited as Ps 71 (Vulgate numbering)."
