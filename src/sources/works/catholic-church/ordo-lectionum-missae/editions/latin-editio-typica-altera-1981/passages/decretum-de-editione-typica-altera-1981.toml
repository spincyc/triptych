context = "The decree of the Sacred Congregation for the Sacraments and Divine Worship, protocol CD 240/81, dated 21 January 1981, promulgating the second typical edition and declaring it typical. It records that the first typical edition was printed in 1969 and promulgated on 25 May of that year, and lists five ways in which the second edition differs from the first, of which the first is that the text of the Praenotanda has been enlarged, and the second that the Nova Vulgata has been used in citing the biblical texts."
artifact_page_ranges = [[8, 9]]
verified_on = "2026-07-25"
notes = "Read in 190 dpi renderings of both page images. The statement that the Praenotanda were enlarged is the reason this reference does not assert that any particular Praenotanda number or footnote stood in the 1969 edition; the 1969 edition was not examined."
