context = "Proprium de tempore, Dominica vigesima quinta, no. 133, Year A, on printed p. 72. Lectio I: Is 55, 6-9, under the titulus taken from v. 8 on God's thoughts not being ours. Ps. resp.: Ps 144, 2-3. 8-9. 17-18, response from v. 18a. Lectio II: Phil 1, 20c-24. 27a, under the titulus 'Mihi vivere Christus est'. Alleluia: Cf. Act 16, 14b, a first-person-plural petition that the Lord open our heart to attend to the words of his Son. Evang.: Mt 20, 1-16a, under the titulus taken from v. 15, the householder's question whether the eye is evil because he is good, with a liturgical incipit addressing the parable to the disciples. One form of each unit; no alternative or shorter reading is printed. Nos. 134 and 135 begin lower on the same page and were not collated."
