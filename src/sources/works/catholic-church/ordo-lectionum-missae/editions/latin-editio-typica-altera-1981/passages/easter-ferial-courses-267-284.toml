context = "Source appointments only, OLM nn.267-284, AP201-206 / printed147-152. All54 First Reading/Responsorial Psalm/principal Gospel owners retain their bounds and source-local part carriers. OLM 1981 n.279, AP205 / printed151, checked 2026-10-22: principal John 10:1-10 remains eligible in A/B/C with true, false or unknown actual preceding-Sunday use. Optional John 10:11-18 is permitted only in A with explicit trusted true for actual preceding-Sunday use of John 10:1-10. Date, URL and choice do not attest use; no default or mandatory replacement is authored. passage.catholic-church.ordo-lectionum-missae.latin-editio-typica-altera-1981.easter-ferial-courses-267-284. Acclamations: fifteen demonstrated adapted units corrected, n.272 uncited composed unit recovered, and nn.271/273 biblical Matthew4:4b quotation routes preserved. The latter units contain no demonstrable liturgical addition; Clementine word-order/tense variants versus the Greek future are not treated as proof of composition. Exact independent Latin wording identity for those two remains unresolved. Each source unit was read in full, not classified from its citation or Cf. cue. N.267 AP201/p147: Colossians 3:1; adapted; Opening connective and accompanying preposition are omitted relative to the entire Clementine verse; not a literal whole-verse body. N.268 AP201/p147: John 3:15; adapted; The first clause derives from 3:14, not the sole cited 3:15; the resulting two-clause unit is abridged and combined. N.269 AP201/p147: John 3:16; adapted; Abridges the complete verse, omitting its opening connective and the negative/intermediate salvation clause; the full unit is not the cited whole verse. N.270 AP202/p148: John 20:29; adapted; Adds a liturgical divine-speech attribution between the biblical clauses, replacing rather than reproducing the verse's narrative attribution. N.271 AP202/p148: Matthew 4:4b; scripture-excerpt; The complete quotation following the biblical narrative introduction is retained, with no added attribution or assembled clauses. Clementine differs in word order and tense; RP2018 Matthew 4:4 has the future verb and the entire corresponding quotation. Retain the biblical part citation, not an exact Latin or approved-English body claim. Exact independent Latin wording identity remains unresolved; this is not evidence of a composed addition. N.272 AP202/p148: uncited; missing-composed; An uncited two-clause Easter unit is printed; no biblical whole-unit identification or independent publishable whole witness is established. N.273 AP203/p149: Matthew 4:4b; scripture-excerpt; Same complete biblical quotation and textual-variant boundary as n.271, independently viewed on AP203. No liturgical addition or assembly is demonstrated; exact independent Latin wording identity remains unresolved. N.274 AP203/p149: John 6:35ab; adapted; Selects the bread and coming/hunger clauses and inserts a liturgical divine-speech attribution; not an exact biblical unit. N.275 AP203/p149: John 6:40; adapted; The printed comparison cue accompanies selective rewriting of the verse's belief/resurrection clauses and added divine-speech attribution; not the complete cited verse. N.276 AP204/p150: John 6:51; adapted; Selects material spanning Clementine 6:51-52, omits the latter verse's final flesh clause, and inserts divine-speech attribution. This acclamation is not independent terminal-body evidence for the Gospel's endpoint. N.277 AP204/p150: John 6:56; adapted; The complete indwelling saying corresponds to Clementine 6:57, but the source adds divine-speech attribution; the citation alone cannot carry the whole liturgical body. N.278 AP204/p150: John 6:63c, 68c; adapted; Combines two separated sayings and changes the first from reported speech into direct address. Comparison citation only; no exact combined Bible body. N.279 AP205/p151: John 10:14; adapted; Adds divine-speech attribution inside the biblical shepherd/knowledge saying. N.280 AP205/p151: John 10:27; adapted; Adds divine-speech attribution inside the biblical sheep/voice saying. N.281 AP205/p151: John 8:12; adapted; Selects light/following clauses, omits the darkness clause and replaces the narrative frame with divine-speech attribution. N.282 AP206/p152: Revelation 1:5ab; adapted; The comparison citation becomes a direct address to Christ; the saving/washing clause changes grammatical person. Not the complete verse and not an exact biblical unit. N.283 AP206/p152: John 14:6; adapted; Replaces the narrative frame with inserted divine-speech attribution between the biblical way/life and access clauses. N.284 AP206/p152: John 8:31b-32; adapted; Combines selected clauses, omits the final liberation clause, and adds divine-speech attribution; not the exact two-verse unit."
