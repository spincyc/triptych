notes = "No protected source body, incipit, rubric or title is reproduced. All16 unavailable Latin units have exact held image evidence, but no established independent lawful whole-unit witness/publication basis; this is neither a blanket copyright claim nor a claim to new ownership over biblical material. Their sixteen English terminal owners separately lack exact whole-unit English exemplars, with no English artifact invented. Latin ledger unchanged. Seven exact John6 modern/Greek-address maps retain all Vulgate carriers. These keys reach nine raw Gospel owners: nn.271,272,273,274,275,277,278 and SundayB nn.110/AP117/p63,122/AP122/p68. Primary Greek RP2018 John SHA256 1e4f430576b7e14daeda93e8c53c551358048cb5587f06e6807ab164b95728ee and Clementine John SHA256 1542486b92076807c978539845d189be3a28cd8f288eaad0f90a3da4ec1e8016 establish address correspondence, not textual identity or a literal liturgical body. N.276 John6:44-51 retains its Vulgate44-52 carrier and modern-numbering refusal pending an independent complete Lectionary terminal-body witness. The chapterwide hebrew unrecorded stance remains; three Psalm addressing refusals, CPDV Psalm92:1 issue and WEB/RV Acts8:37 absence remain. No derived addressing key, resolver change, whole-Missal alternative, or publication permission is supplied."
