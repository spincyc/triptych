context = "Proprium de tempore, Dominica vigesima sexta, no. 136, Year A, on printed p. 74. Lectio I: Ez 18, 25-28, under the titulus from v. 27 on the wicked man who turns from his wickedness and gives his soul life, with the incipit Haec dicit Dominus prefixed to v. 25. Ps. resp.: Ps 24, 4bc-5. 6-7. 8-9, response from v. 6a. Lectio II: Phil 2, 1-11 (longior) vel 1-5 (brevior), under the titulus 'Sentite in vobis quod et in Christo Iesu', with the incipit Fratres: Si qua consolatio in Christo, without ergo. Alleluia: Io 10, 27, the saying on the sheep hearing the voice with dicit Dominus inserted, no Cf. Evang.: Mt 21, 28-32, under the titulus 'Paenitentia motus abiit. Publicani et meretrices praecedunt vos in regnum Dei', with a liturgical incipit naming the chief priests and elders of the people as those addressed. Only the second reading has an alternative form. No. 137 (Year B) begins lower on the same page and was not collated."
