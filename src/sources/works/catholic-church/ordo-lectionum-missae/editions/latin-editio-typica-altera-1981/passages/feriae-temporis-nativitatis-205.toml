context = "Marginal n. 205 of the Christmas Time weekday block, the weekday headed by the civil date 2 January, on printed page 118. It is registered on its own because of the rubric printed beneath its four Lectionary slots, which is one of the two rubrics by which the Order of Readings disposes of the Christmas Time weekdays where the Epiphany has been transferred. In substance, and without reproducing its wording: in regions where the Epiphany is celebrated on the Sunday falling between 2 and 8 January, the readings proposed for the days 7 to 12 January are taken after the Epiphany, and the date-headed days that would otherwise have followed n. 205 are omitted. The rubric is therefore the book's own answer to a question the Universal Norms leave to the competent authority, and it is an answer about the Order of Readings alone: it says nothing about how the Missal heads or appoints these days, and no witness of the Missal's Proper of Time is held here. The companion rubric stands at n. 212 and is registered separately."
artifact_page_ranges = [[172, 172]]
verified_on = "2026-08-20"
notes = "Read on 2026-08-20 in a rendering of the artifact's page image at 200 dpi, never in its optical text layer. Artifact page 172 is printed page 118 and carries nn. 205, 206 and 207; the whole page was read. Printed pagination runs 54 behind the artifact pages throughout this part of the book. The controlling artifact is storage = \"restricted\" and rights_status = \"restricted\", and its own rights basis states that public availability from a third-party archive establishes no permission to redistribute either the underlying official text or the scan. This record therefore reproduces none of the book's readings, pericope titles, psalm responses, acclamation texts, rubrics or headings, and carries no text and no transcription_segments; the rubric is described in English and its Latin stays in the restricted artifact. No schema state requires a quotation, and for this artifact the schema forbids one: the artifact is indexable = false, so the validator refuses text, transcription_segments and physical_line_ranges on any passage it controls, and artifact_page_ranges is the only locator this passage can carry."
