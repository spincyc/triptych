context = "Printed page XXXV (artifact page 35) was read in a rendered page image at 200 dpi. Under the heading De omissione aliquorum versiculorum: 'Traditio multarum liturgiarum, ipsa liturgia Romana minime exclusa, aliquando consuevit in lectionibus Scripturae quosdam versiculos omittere. Ultro fatendum est huiusmodi omissiones non leviter fieri posse, ne sensus textus aut mens et quasi stilus Scripturae mutilentur. Attamen, cauto ut sensus revera in sua essentia integer maneat, visum est, ex ratione pastorali, etiam in praesenti Ordinis praedictam traditionem servare.' The article continues with the two reasons given for the decision."
