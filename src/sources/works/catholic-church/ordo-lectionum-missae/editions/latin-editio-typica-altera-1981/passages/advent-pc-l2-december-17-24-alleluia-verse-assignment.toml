context = "Each dated weekday, nn. 193-200, prints its own Alleluia verse, and n. 201 lists the same seven verses, numbered 1-7, for the weekdays 17-24 December. The verses are the great O antiphons without the vocative O. By date the Lectionary assigns: 17 Sapientia; 18 Dux domus Israel; 19 Radix Iesse; 20 Clavis David; 21 Emmanuel; 22 Rex gentium; 23 Rex gentium again; 24 December (morning Mass) Oriens. The Mass order therefore departs from the Magnificat order (Oriens 21, Rex gentium 22, Emmanuel 23). Oriens stands before the Benedictus Gospel, Lk 1:67-79, whose heading cites Visitavit nos Oriens ex alto; Emmanuel stands before the Visitation, Lk 1:39-45. The same pages cite the responsorial psalms in Vulgate numbering: 18 Dec Ps 71; 19 Dec Ps 70; 20 Dec Ps 23; 21 Dec Ps 32; 23 Dec Ps 24; 24 Dec Ps 88. The 18 December Gospel is Mt 1, 18-24."
verified_on = "2026-11-26"
notes = "advent-pc lane 2. The whole restricted PDF was re-fetched with curl from its registered source_url (SHA-256 equal). Artifact pages 164-167 (printed 110-113) were rendered at 200 dpi and read on the image. Restricted and not indexable: no quotation is carried beyond the antiphons' one-word Latin incipits, which serve as identifiers."
