context = "The decree of the Sacred Congregation for Divine Worship, protocol 106/69, dated 25 May 1969, Pentecost Sunday, promulgating the Ordo lectionum Missae with effect from 30 November 1969, the First Sunday of Advent, and directing that in the coming liturgical year series B of the Sunday readings and series II of the first reading on weekdays of Ordinary Time be used. It is reprinted in the front matter of the 1981 second typical edition."
artifact_page_ranges = [[7, 7]]
verified_on = "2026-07-25"
notes = "Read in a 190 dpi rendering of the page image. The stated starting point independently confirms the cycle arithmetic of Praenotanda 66 footnote 102 and 69.4 at the reform's origin: the liturgical year beginning 30 November 1969 ends in civil 1970, and 1970 modulo 3 is 2, giving B, while 1970 is even, giving weekday cycle II."
