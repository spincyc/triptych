context = "Praenotanda n. 104 with its footnotes 115 and 116, on printed p. XLIV. Subdivision 1 governs Week I and the Monday Baptism case, subdivision 2 the consecutive Sunday numbering and the suspension of the readings of the week in which Ash Wednesday occurs, and subdivision 3 the resumption after Pentecost, including the omission of the first week that would have been taken after Pentecost when there are thirty-three Sundays. Footnote 115 works the thirty-four-week case with six weeks before Lent and notes that Trinity Sunday takes the place of an Ordinary Time Sunday; footnote 116 works the thirty-three-week case with five weeks before Lent, omitting the sixth week and beginning from the seventh."
