context = "Praenotanda nos. 105-107, De lectionibus pro dominicis, printed pp. XLIV-XLV. No. 105: from the Third Sunday the three synoptic Gospels are read semi-continuously. No. 106: the Old Testament readings were chosen in relation to the Gospel pericopes, and the relation between the readings of one Mass is shown by the careful choice of the tituli set over the individual readings. No. 107: the Epistles of Paul and James are read semi-continuously, and Tabella II shows their distribution over the Sundays of the three years; its footnote 117 points to printed p. LII."
