context = "The Christmas Time weekday block of the Proper of Time, marginal nn. 202-218. What is established here is the block's own arrangement, not any of its words. Every series in it is keyed by civil date, and the season's weekdays fall into five runs. Three days are headed both by their civil date, 29, 30 and 31 December, and by their place within the octave of the Nativity, nn. 202-204. Four more are headed by civil date alone, 2 to 5 January, nn. 205-208. Two are headed by civil date, 6 and 7 January, nn. 209-210, each carrying its own rubric restricting it to regions in which the Epiphany is kept on the Sunday falling on 7 or 8 January. An acclamation formulary for the season before the Epiphany stands at n. 211. Six further series are headed both by the civil dates 7 to 12 January and as the weekdays after the Epiphany, nn. 212-217, opening under two rubrics registered separately at the passage for n. 212. A second acclamation formulary, for the weekdays after the Epiphany, closes the block at n. 218. The acclamation formularies therefore divide the season at the Epiphany in the same way the day series do."
artifact_page_ranges = [[169, 177]]
verified_on = "2026-08-20"
notes = "Read on 2026-08-20 in renderings of the artifact's page images at 200 dpi, never in its optical text layer. Artifact pages opened and read for this record: 169 (a divider carrying only the season's name), 170 (blank), 171 (nn. 202-204, the three days within the octave), 172 (nn. 205-207, printed page 118), 173 (nn. 208-210, printed page 119, where the two Epiphany-restricted days stand), 174 (n. 211, printed page 120), 175 (nn. 212-214, printed page 121) and 177 (n. 218, printed page 123). Artifact page 176, which carries nn. 215-217, was not opened for this record; that those three numbers complete the six-day run from 7 to 12 January follows from the numbers read on either side of it and was not read directly. Printed pagination runs 54 behind the artifact pages throughout this part of the book. The controlling artifact is storage = \"restricted\" and rights_status = \"restricted\", and its own rights basis states that public availability from a third-party archive establishes no permission to redistribute either the underlying official text or the scan. This record therefore reproduces none of the book's readings, pericope titles, psalm responses, acclamation texts, rubrics or headings, and carries no text and no transcription_segments. No schema state requires a quotation, and for this artifact the schema forbids one: the artifact is indexable = false, so the validator refuses text, transcription_segments and physical_line_ranges on any passage it controls, and artifact_page_ranges is the only locator this passage can carry."
