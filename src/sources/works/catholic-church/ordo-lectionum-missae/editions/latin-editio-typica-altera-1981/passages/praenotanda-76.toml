context = "Printed page XXXV (artifact page 35) was read in a rendered page image at 200 dpi. Under the heading De textibus difficilioribus: 'Ex ratione pastorali vitantur in lectionibus, diebus dominicis et sollemnitatibus, textus b[i]blici qui revera difficiliores sunt, sive obiective eo quod altiora problemata litteraria, critica aut exegetica movent, sive etiam, quadamtenus saltem, eo quod a fidelibus difficilius intellegi possunt. Attamen divitias spiritales quorundam textuum non licuit fidelibus abscondi, eo quod ab eis difficilius capiantur, quando haec difficultas oritur sive ex insufficienti institutione christiana, qua nullus fidelis carere debet, sive ex insufficienti institutione biblica, qua omnis pastor animarum pollere debet.' The scanned page prints 'bilici' where 'biblici' is required by sense; the defect is recorded and not silently corrected."
