context = "The Lenten weekday block of the Proper of Time, marginal nn. 219-256. What is established here is the block's own arrangement, not any of its words. It opens with four days keyed to Ash Wednesday rather than to a week: Ash Wednesday itself at n. 219, and the Thursday, Friday and Saturday after it at nn. 220, 221 and 222. n. 219 carries five Lectionary slots where the weekdays around it carry four, the second reading being proper to that day, and a rubric on the liturgy of the word where the blessing and imposition of ashes is held outside Mass. An acclamation formulary appointed for the Lenten weekdays follows at n. 223, headed as a verse before the Gospel rather than as an Alleluia, which is the season's own difference. The remaining weekdays, nn. 224-256, are headed by the week of Lent and by the weekday within that week, and the block closes at n. 256 with the Saturday of the fifth week; the weekdays of Holy Week are numbered separately and are registered at nn. 257-259."
artifact_page_ranges = [[179, 193]]
verified_on = "2026-08-20"
notes = "Read on 2026-08-20 in renderings of the artifact's page images at 200 dpi, never in its optical text layer. Artifact pages opened and read for this record: 179 (a divider carrying only the season's name), 180 (blank), 181 (nn. 219-221, the Ash Wednesday run), 182 (nn. 222-223, printed page 128, where the four keyed days end and the acclamation formulary stands) and 193 (nn. 253-256, printed page 139, the fifth week's Wednesday to Saturday). Artifact pages 183 to 192 were not opened for this record; that nn. 224-252 fill the five weeks between the two ends is not asserted here beyond what the numbers read on either side establish. Printed pagination runs 54 behind the artifact pages throughout this part of the book. The controlling artifact is storage = \"restricted\" and rights_status = \"restricted\", and its own rights basis states that public availability from a third-party archive establishes no permission to redistribute either the underlying official text or the scan. This record therefore reproduces none of the book's readings, pericope titles, psalm responses, acclamation texts, rubrics or headings, and carries no text and no transcription_segments. No schema state requires a quotation, and for this artifact the schema forbids one: the artifact is indexable = false, so the validator refuses text, transcription_segments and physical_line_ranges on any passage it controls, and artifact_page_ranges is the only locator this passage can carry."
