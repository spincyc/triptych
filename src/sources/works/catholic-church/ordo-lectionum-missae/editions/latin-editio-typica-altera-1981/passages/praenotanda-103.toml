context = "Praenotanda n. 103, at the foot of printed p. XLIII, opening the section De tempore per annum. It restates the season\u2019s boundaries, states that the Order of Readings supplies readings for thirty-four Sundays and their following weeks, that the weeks of Ordinary Time are sometimes only thirty-three, and names the displacements: some Sundays belong to another season (the Sunday of the Baptism of the Lord and Pentecost) or are impeded by an occurring solemnity, for example the Most Holy Trinity and Christ the King."
