notes = "Read on 2026-10-16 in a page image rendered at 200 dpi from the exact hash-matched scan, fetched whole over verified TLS by the research stage of PC-S55-A; the bytes are not retained. The optical text layer was not relied on. This witnesses the Latin 1981 order, not the exact U.S. printed English volume. The liturgical Latin quoted is short identifying matter of a restricted book."
