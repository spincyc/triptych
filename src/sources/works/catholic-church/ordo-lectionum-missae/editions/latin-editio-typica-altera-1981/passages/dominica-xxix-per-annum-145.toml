context = "Dominica vigesima nona, Year A, no. 145, printed p. 79, with no. 146 (Year B) below it on the same page. First reading Is 45, 1. 4-6, titulus Apprehendi dexteram Cyri ut subiciam ante faciem eius gentes, incipit Haec dicit Dominus de uncto meo Cyro; responsorial psalm Ps 95, 1 et 3. 4-5. 7-8. 9-10a et c, response (7b) Afferte Domino gloriam et potentiam; second reading 1 Th 1, 1-5b, titulus Memores fidei vestrae et caritatis et spei, incipit Paulus et Silvanus et Timotheus; Alleluia Phil 2, 15d. 16a, Lucetis sicut luminaria in mundo, verbum vitae continentes; Gospel Mt 22, 15-21, titulus Reddite quae sunt Caesaris Caesari, et quae sunt Dei Deo, incipit In illo tempore: Abeuntes pharisaei consilium inierunt ut caperent Iesum in sermone. One form of each reading. At no. 146 the Alleluia verse is Mc 10, 45 with the clause ut ministraret. Psalm numbering here is Vulgate."
