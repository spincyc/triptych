verified_on = "2026-08-20"
notes = "Read on 2026-08-20 in renderings of the artifact's page images at 200 dpi, never in its optical text layer. Artifact pages opened and read for this record: 155 (a divider carrying only the season's name), 156 (blank), 157 (nn. 175-177, printed page 103, the first week), 159 (nn. 181-183, printed page 105, the second week), 161 (nn. 187-189, printed page 107, the third week), 162 (nn. 190-191, printed page 108, where the third week ends at its Friday), 163 (n. 192, printed page 109), 164 (nn. 193-195, printed page 110, where the civil-date band opens) and 167 (n. 201, printed page 113). Artifact pages 158, 160, 165 and 166 were not opened for this record and the continuity of the numbering across them is not asserted here. Printed pagination runs 54 behind the artifact pages throughout this part of the book. The controlling artifact is storage = \"restricted\" and rights_status = \"restricted\", and its own rights basis states that public availability from a third-party archive establishes no permission to redistribute either the underlying official text or the scan. This record therefore reproduces none of the book's readings, pericope titles, psalm responses, acclamation texts, rubrics or headings, and carries no text and no transcription_segments. No schema state requires a quotation, and for this artifact the schema forbids one: the artifact is indexable = false, so the validator refuses text, transcription_segments and physical_line_ranges on any passage it controls, and artifact_page_ranges is the only locator this passage can carry."
