context = "The Advent weekday block of the Proper of Time, marginal nn. 175-201. What is established here is the block's own arrangement, not any of its words. Its first three series of weekdays are headed by the week of Advent and by the weekday within that week: the first week opens at n. 175 with its Monday, the second at n. 181, and the third at n. 187. The third series prints five weekdays and no Saturday, closing at n. 191 with its Friday. An acclamation formulary appointed for those weekdays follows at n. 192, headed for the weekdays of Advent as far as 16 December. Eight further weekdays are then headed by their civil date, nn. 193-200, under a section heading naming the band 17 to 24 December and carrying a rubric on days displaced by an occurring Sunday; n. 193 is 17 December, n. 194 is 18 December and n. 195 is 19 December. A second acclamation formulary, headed for the weekdays of Advent from 17 to 24 December, closes the block at n. 201. The 16 December boundary and the change of key grammar at 17 December are therefore the book's own, printed in its headings, and not an inference from the Universal Norms."
