notes = "Read on 2026-08-20 in a rendering of the artifact's page image at 200 dpi, never in its optical text layer. Artifact page 175 is printed page 121 and carries the two rubrics and nn. 212, 213 and 214; the whole page was read. Printed pagination runs 54 behind the artifact pages throughout this part of the book. The controlling artifact is storage = \"restricted\" and rights_status = \"restricted\", and its own rights basis states that public availability from a third-party archive establishes no permission to redistribute either the underlying official text or the scan. This record therefore reproduces none of the book's readings, pericope titles, psalm responses, acclamation texts, rubrics or headings, and carries no text and no transcription_segments; the two rubrics are described in English and their Latin stays in the restricted artifact. No schema state requires a quotation, and for this artifact the schema forbids one: the artifact is indexable = false, so the validator refuses text, transcription_segments and physical_line_ranges on any passage it controls, and artifact_page_ranges is the only locator this passage can carry."
