context = "Marginal n. 212 of the Christmas Time weekday block, on printed page 121, the first of the six series headed both by a civil date, 7 January, and as the weekday after the Epiphany. It is registered on its own because of the two rubrics printed above it at the head of that run, which together are the companion to the rubric at n. 205 and the second half of the Order of Readings' disposition of these weekdays where the Epiphany has been transferred. In substance, and without reproducing their wording: the first directs that the readings assigned to the days 7 to 12 January serve the days following the solemnity of the Epiphany even where that solemnity has been placed on a Sunday, as far as the Saturday following; the second directs that from the Monday after the Sunday on which the Baptism of the Lord is celebrated, that is the Sunday occurring after 6 January, the readings of Ordinary Time begin, whatever remains of the 7 to 12 January run being omitted. The run these rubrics head therefore hangs from the Epiphany rather than from the calendar, and its length is not fixed. This establishes the arrangement of the Order of Readings and nothing about the Missal's Proper of Time, which is held in no witness here."
