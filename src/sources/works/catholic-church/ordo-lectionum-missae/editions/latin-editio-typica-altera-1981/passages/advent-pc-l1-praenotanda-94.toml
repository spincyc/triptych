context = "Praenotanda n. 94, b) weekdays of Advent, printed p. XL: two series, one from the beginning to 16 December, the other 17-24 December. In the first part Isaiah is read in the order of the book, including major texts also read on Sundays, with gospels chosen to match the first reading; from Thursday of the second week the gospels concern John the Baptist, with the first reading continuing Isaiah or chosen to match the gospel. In the last week before Christmas Matthew 1 and Luke 1 present the events immediately preparing the Nativity, with first readings from various Old Testament books, among them important messianic prophecies."
