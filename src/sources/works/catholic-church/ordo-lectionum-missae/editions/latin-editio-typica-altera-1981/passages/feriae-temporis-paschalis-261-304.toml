context = "The Eastertide weekday block of the Proper of Time, marginal nn. 261-304. What is established here is the block's own arrangement, not any of its words. It opens under a section heading naming the octave of Easter, whose days are headed by the weekday within the week: n. 261 the Monday, n. 262 the Tuesday, n. 263 the Wednesday. The numbered weekdays of the season occupy nn. 261-302. Two acclamation formularies then close the block and divide the season at the Ascension: n. 303 is appointed for the weekdays of Eastertide as far as the Ascension, and n. 304 for the weekdays after the Ascension. That the block carries two such formularies where Advent and Christmas Time each carry two and Lent carries one is the book's own division of the season and is the fact this record registers."
artifact_page_ranges = [[197, 215]]
verified_on = "2026-08-20"
notes = "Read on 2026-08-20 in renderings of the artifact's page images at 200 dpi, never in its optical text layer. Artifact pages opened and read for this record: 197 (a divider carrying only the season's name), 198 (blank), 199 (nn. 261-263, the first three days of the octave), 213 (n. 303, printed page 159) and 215 (n. 304, printed page 161). Artifact pages 200 to 212 and 214 were not opened for this record. That nn. 264-302 fill the pages between the octave's opening and n. 303 is inferred from the two numbers read on either side and was not read directly; in particular artifact page 212, which should carry the last numbered weekday, was not opened. Printed pagination runs 54 behind the artifact pages throughout this part of the book. The controlling artifact is storage = \"restricted\" and rights_status = \"restricted\", and its own rights basis states that public availability from a third-party archive establishes no permission to redistribute either the underlying official text or the scan. This record therefore reproduces none of the book's readings, pericope titles, psalm responses, acclamation texts, rubrics or headings, and carries no text and no transcription_segments. No schema state requires a quotation, and for this artifact the schema forbids one: the artifact is indexable = false, so the validator refuses text, transcription_segments and physical_line_ranges on any passage it controls, and artifact_page_ranges is the only locator this passage can carry."
