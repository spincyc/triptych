notes = "Both complete pages were read at 200 dpi from the whole 600-page scan after its exact registered SHA-256 and byte size were verified. The optical text layer supplied no reading. This confirms source-local role and citation facts; it does not independently certify complete 2008 target correspondence, a U.S. English Lectionary rendering, or a public-domain wording. Headed roles and individually classified reading/response alternatives are different scopes."
