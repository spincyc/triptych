context = "The source independently distinguishes the Saturday-evening Vigil and the Mass during the Day. No. 62 has one First Reading role with four choices, Responsorial Psalm with response choices, Second Reading, Alleluia, and Gospel. No. 63 has First Reading, Responsorial Psalm with response choices, Second Reading, Sequence referral, Alleluia referral to no. 62, and Gospel. Printed p. 42 gives optional Second Reading and Gospel alternatives for years B and C; the preceding appointments are not restricted to year A. The following Monday/Tuesday reuse rubric was read as boundary context."
