context = "The Ordinary Time weekday block of the Proper of Time, marginal nn. 305-509, the longest single run in the book. What is established here is the block's own arrangement, not any of its words. Its series are headed by the week of Ordinary Time and by the weekday within that week, and each numbered day is set in two parallel columns headed as the first and the second year, so that the first reading and the responsorial psalm differ between the two while the acclamation and the Gospel are printed once across both. This two-column setting is the printed form of the two-year ferial course, and it is confined to this block: no other weekday run in the book is set this way. The block opens at n. 305 with the Monday of the first week and closes its numbered weekdays at n. 508 with the Saturday of the thirty-fourth week; n. 305 carries beneath it a rubric on the years in which the Baptism of the Lord falls on the Monday of the first week of Ordinary Time. A single acclamation formulary for these weekdays follows at n. 509, and it carries within itself a short supplementary set for the last week and a pointer to a formulary printed earlier in the book; the numbered weekday sequence of the Proper of Time ends there."
artifact_page_ranges = [[217, 323]]
verified_on = "2026-08-20"
notes = "Read on 2026-08-20 in renderings of the artifact's page images at 200 dpi, never in its optical text layer. Artifact pages opened and read for this record: 217 (a divider carrying only the season's name), 219 (nn. 305-306, the first week's Monday and Tuesday, with the two-column setting and the rubric under n. 305), 320 (nn. 507-508, printed page 266, the thirty-fourth week's Friday and Saturday), 321 (n. 509, printed page 267), 322 (printed page 268, the formulary continuing) and 323 (printed page 269, where it ends). Artifact pages 218 and 220 to 319 were not opened for this record; that nn. 307-506 fill them is inferred from the numbers read at the two ends and was not read directly, and no claim is made here about how many weeks or days stand on any unopened page. Printed pagination runs 54 behind the artifact pages throughout this part of the book. The controlling artifact is storage = \"restricted\" and rights_status = \"restricted\", and its own rights basis states that public availability from a third-party archive establishes no permission to redistribute either the underlying official text or the scan. This record therefore reproduces none of the book's readings, pericope titles, psalm responses, acclamation texts, rubrics or headings, and carries no text and no transcription_segments. No schema state requires a quotation, and for this artifact the schema forbids one: the artifact is indexable = false, so the validator refuses text, transcription_segments and physical_line_ranges on any passage it controls, and artifact_page_ranges is the only locator this passage can carry."
