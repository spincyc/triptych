title = "The Gelasian Sacramentary: Liber sacramentorum Romanae ecclesiae, edited with introduction, critical notes and appendix by H. A. Wilson"
language = "la"
publication = "Oxford: at the Clarendon Press, 1894. Edited by Henry Austin Wilson from Vatican, Reg. lat. 316, with the readings of the eighth-century Gelasians in the margins and apparatus."
date = "1894"
notes = "Wilson expands the manuscript's contractions, so his text compares directly with a modern missal's orthography. The printed page carries marginal sigla (R. S., Gerb., Pam., Men., Bml.) between the words of the prayers; an optical text layer interleaves those sigla with the Latin and they must be recognised as intrusions rather than readings."
