context = "The five Advent missae of the Vatican Gelasian (V.), Book II LXXX 'Orationes de Adventum Domini' and LXXXI-LXXXIV 'Item alia Missa', with the first collect 'Excita, Domine, potentiam tuam' and Wilson's note 1 that the five correspond to the five Sundays before Christmas in R. (Rheinau) and S. (St Gall), with Men. (Menard) reckoning backward from Christmas."
physical_line_ranges = [[1, 11]]
text = "LXXX. ORATIONES DE ADVENTUM DOMINI. Excita, Domine, potentiam tuam, et veni, et quod ecclesiae tuae usque in finem saeculi promisisti clementer operare. Per. This Missa and the four which follow it apparently correspond to the five Missae provided by R. and S. for the five Sundays before Christmas Day. Men. likewise has five Missae for these weeks, reckoning backward from Christmas. S. has also a series of three Missae and R. has two Missae for the weekdays of Advent, while R. S. and Men. have each a series of ‘Aliae Orationes de Adventu,’ with which, probably, the prayers contained in the latter part of lxxxiv were intended to correspond, though they have not in V. any separate title, and appear (most likely by accident) as if they were additional Postcommunions for the last of the five Advent Missae. de adventum Domini, so V. LXXXI. ITEM ALIA MISSA. LXXXII. ITEM ALIA MISSA. LXXXIII. ITEM ALIA MISSA. LXXXIV. ITEM ALIA MISSA."
