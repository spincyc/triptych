notes = "Ancient prayer only: Omnipotens sempiterne Deus, qui paschale sacramentum quinquaginta dierum voluisti mysterio contineri, praesta ut gentium facta dispersio divisione linguarum ad unam confessionem tui nominis caelesti munere congregetur. Per. The printed conclusion is retained exactly at its source length. All petition lexical words preexist. There are three linked grammatical inflection changes: ancient dispersio divisione ... congregetur becomes bounded-secondary dispersione divisiones ... congregentur. Wilson p.123 note 2 independently prints the ancient V reading divisiones, and note 4 prints congregentur V; his main text follows the other cited witnesses. The new English follows the bounded-secondary grammar. Pointing, capitalization and accents also differ. The main ancient cue is literally Per.; the generic short cue Per Dominum. is separately printed in this edition at p.106, parent artifact p.199, and is not expanded here."
