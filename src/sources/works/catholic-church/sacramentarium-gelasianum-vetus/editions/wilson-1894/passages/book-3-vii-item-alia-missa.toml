context = "The seventh of the sixteen unassigned Sunday masses of Book III (which opens at Wilson p. 224). It carries, as one mass-set, the three orations of the 1962 Eleventh Sunday after Pentecost: the collect Omnipotens sempiterne Deus, qui abundantia pietatis tuae (Wilson prints adiicias; his apparatus records the manuscript's habundantiam and Pamelius' oratione); a second collect, Omnipotens sempiterne Deus, a quo sola sancta desideria; the secret Respice, Domine, quaesumus, nostram propitius servitutem with no et before the second sit and with the apparatus note that the genitive fragilitatis is the reading of the manuscript and the Frankish witnesses against the Leonine and Pamelian dative fragilitati; and the postcommunion Sentiamus, Domine, quaesumus in the older Domine-first word order, with the notes that the manuscript reads perceptionem and that the Leonine inserts de. Wilson's footnote 1 assigns this missa in the Rheinau and St-Gall Gelasians and Gerbert to the thirteenth Sunday after Pentecost and points to the twelfth Sunday in Pamelius. The exact remote artifact bytes were re-fetched and their SHA-256 matched this record before reading."
notes = "Read in the OCR text at physical lines 29179-29213 of the exact hashed artifact (heading through Wilson's footnotes), with the marginal concordances immediately above. Uncorrected optical character recognition: it locates and identifies the prayers and their apparatus and does not control wording letter for letter."
