notes = "Old source: Deus, qui peccati veteris haereditariam mortem, in qua posteritatis genus omne successerat, Christi tui Domini nostri passione solvisti, dona ut conformes eidem facti, sicut imaginem terreni naturae necessitate portavimus, ita imaginem caelestis gratiae sanctificatione portemus, Christi Domini nostri. Qui tecum vivit Source footnote numerals are apparatus, not wording. Study relation: The secondary2002 petition inserts Filii immediately after Christi before tui; substitutes da for dona; inserts hominis after terreni. These are explicit small grammatical/relationship clarifications of the same old petition, not silently declared orthography. The secondary2002 omits the ancient closing Christi Domini nostri. Qui tecum vivit, and supplies the common short conclusion Per Christum Dominum nostrum. with a separately marked R. Amen. The complete short formula and marked response are independently image-witnessed in old Lasance at artifact217/printed217. haereditariam/hereditariam is spelling; stress accents, capitalization and pointing differ. Ancient footnote markers8–10 are apparatus, not wording. No modern fullbody is retained in this proposal. The complete finite relationship, including all three small clarifications and common conclusion change, requires independent source and rights review before admission; no exact whole-word target fidelity or authenticated2008 reading is claimed."
