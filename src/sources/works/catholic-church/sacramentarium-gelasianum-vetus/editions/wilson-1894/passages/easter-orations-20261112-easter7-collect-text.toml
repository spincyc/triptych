notes = "Old full scalarSHA256 5e0fe8abf00b9e99158fb77a963beac3a2e28ba9d6a8991e129ec029e50f44eb. Controlling complete page passage.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.easter-orations-20261112-easter7-collect-page. The entire old Ascension prayer already joins supplications, belief that the Savior shares the divine majesty, his abiding with us to the consummation of the age, and his own promise, in this sequence. The modern changes reorder the invocation, add a conventional graciousness qualifier and explicit pronouns, replace confidence with belief and a synonymous promise construction, and remove the seated predicate. The whole finite revised expression requires review; retaining common themes alone is not a sufficient basis. Old Ascension and modern Easter7 appointments are distinct."
