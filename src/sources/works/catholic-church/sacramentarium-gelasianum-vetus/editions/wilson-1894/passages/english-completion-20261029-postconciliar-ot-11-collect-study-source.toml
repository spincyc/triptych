notes = "Ancient prayer only: Deus, in te sperantium fortitudo, adesto propitius invocationibus nostris; et quia sine te nihil potest mortalis infirmitas, praesta auxilium gratiae tuae, ut in exequendis mandatis tuis et voluntate tibi et actione placeamus. Per Dominum. The printed conclusion is retained exactly at its source length. The bounded-secondary reading adds the single adverb semper before auxilium, moves invocationibus nostris before adesto propitius, and moves gratiae tuae before praesta auxilium. The exequendis/exsequendis difference is received spelling; pointing, capitalization and accents also differ. All other petition words and the literal short conclusion agree. The new English renders the added adverb as always. The existing approved ICEL English absence remains true for that witness and the stated surfaces; this independently authored study translation does not lift that restriction or reuse its wording."
