notes = "Checked source reading, line breaks joined and contractions expanded with no modern body substitution: Concede, quaesumus, Domine, semper nos per haec mysteria paschalia gratulari, ut continua nostrae reparationis operatio perpetua nobis fiat causa laetitiae. Per Dominum nostrum. The historical main text prints nominative perpetua; the secondary 2002 text prints genitive perpetuae before laetitiae. Wilson footnote 7 also records perpetuae in named comparison witnesses, without turning those into inspected complete witnesses. The single-inflection variant remains explicitly disclosed. Historical Per Dominum nostrum. and secondary Per Christum. are different cues. This is a bounded source review of original project study English. It is not approved English, not for recitation, and establishes neither printed-2002 fidelity nor authenticated-2008 correspondence. The original seventy-entry history and all other entries remain unchanged. Source binding pins the previously registered exact whole PDF at original artifactpage187, printedpage94. Its remote/unresolved file disposition is unchanged; the independently public-domain historical printed prayer supplies the source-expression basis. No new PDF derivative, public download, offline pack, or whole-file distribution permission is asserted."
