notes = "Ancient prayer only: Suscipe, quaesumus, Domine, et plebis tuae et tuorum hostias renatorum, ut et confessione tui nominis et baptismate renovati sempiternam beatitudinem consequantur. Per Dominum. The original printed conclusion cue is retained as recorded, without expansion. The bounded secondary2002 reading substitutes oblationes for hostias and places that noun after renatorum instead of before; omits the first et before plebis and the et after ut; brackets et tuorum renatorum as an optional source-owned phrase. All remaining petition words agree after pointing/capitalization/accents. Generic conclusion cue Per Christum. replaces ancient Per Dominum. The draft preserves the source optional phrase as parentheses."
