notes = "Ancient prayer only: Augeatur in nobis, Domine, quaesumus, tuae virtutis operatio; ut, divinis vegetati sacramentis, ad eorum promissa capienda tuo munere praeparemur. Per. The printed conclusion is retained exactly at its source length. The bounded-secondary reading has refecti caelestibus where the ancient reading has divinis vegetati; these are two substituted words and their local order. Domine and quaesumus exchange order; pointing, capitalization and accents also differ. Every other petition word agrees. The ancient cue is literally Per.; Per Christum. is independently printed in this edition at p.106, parent artifact p.199, and is not expanded here. The new English follows refreshed/heavenly and does not transfer the older human English rendering divine. The historical-antecedent refusal remains correct for that different witness."
