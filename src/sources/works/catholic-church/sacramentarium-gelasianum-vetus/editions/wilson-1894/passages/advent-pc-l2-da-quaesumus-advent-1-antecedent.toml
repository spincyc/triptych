context = "Vatican Gelasian postcommunion Da, quaesumus, omnipotens Deus, cunctae familiae tuae hanc voluntatem: the reworked antecedent of the postconciliar Advent I collect (meeting Christ with just works; placed at his right hand). Note 1(e) gives its places in R. S. Gerb. Men. and Miss. Gall."
physical_line_ranges = [[3, 6], [9, 11]]
text = "Postcommun. Da, quaesumus, omnipotens Deus, cunctae familiae tuae hanc voluntatem in Christo Filio tuo, Domino nostro venienti in operibus iustis aptos occurrere: et eius dexterae sociati regnum mereantur possidere caeleste. Per. The prayers of this Missa appear in the following positions in the other Sacramentaries referred to:—(a) The first Collect is in R. S. Gerb. Men. the second Collect for the Wednesday of the Advent Embertide. (e) The Postcommunion is in R. S. Gerb. as that of a Missa ‘in quot. dieb.’ In Men. it appears as the super Populum for the third Sunday before Christmas: and in Miss. Gall. it is a Benedictio populi in the first Advent Missa. Men. omits in. veniente Gerb. ut R. Gerb. Men. Miss. Gall.; V. S. as text."
