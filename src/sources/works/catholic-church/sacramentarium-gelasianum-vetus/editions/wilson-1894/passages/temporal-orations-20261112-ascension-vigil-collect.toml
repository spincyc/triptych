notes = "Complete old prayer freshly image-read Wilson1894 AP200/printed107, Orationes et preces in Ascensa Domini; number572 is the later Mohlberg numbering, not Wilson’s printed number. Modern text changes direct address to Christ into address to the Father: Deus, qui…ascendisti becomes Deus, cuius Filius…ascendit. tua/tu/tecum becomes eius/ille/cum eo. This is explicit semantic recipient change requiring whole-expression review, never an orthographic variant. The old clauses ad declaranda tua miracula maiestatis and post resurrectionem a mortuis are omitted; tuae pietatis auxilium is replaced by quaesumus. adstantibus becomes astantibus. The ascent, Apostles present, promise, life with us on earth, and our life with him in heaven all preexist in this one complete old prayer. Old literal Per. is retained in source apparatus and is not expanded. Secondary AP255 expressly prints Qui tecum.; secondary IGMR54 AP18 supplies its modern source-local long conclusion role. Independent Pustet1862 AP88 long formula supplies the complete contiguous Qui suffix, with initial capital only. The existing independently reviewed Triptych Who-formula English is reused unchanged; this new recipient still requires separate mapping review. Preparation-agent image read inherited from the hash-bound frozen packet; this staging does not adjudicate rights or fidelity. Wilson AP201/printed108 apparatus n3 gives nobis cum semper sis in Gerb.; n4 calls the main Per. reading wrong and records Qui cum. in R., S2, Gerb. and Pam. These are separate historical variants: the frozen main text Per. is preserved, no variant is silently substituted or expanded. Staging agent freshly image-read AP201."
artifact_page_ranges = [[200, 201]]
context = "Entire older petition and its actual printed cue; no postconciliar appointment asserted."
