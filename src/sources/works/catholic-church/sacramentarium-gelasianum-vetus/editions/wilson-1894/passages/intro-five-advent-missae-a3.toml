context = "Wilson's introduction, under the running head 'Sunday missae of R. and S.': V.'s second book holds the Advent missae, and R. and S. have five missae for the Sundays before Christmas answering to them."
physical_line_ranges = [[1, 3]]
text = "The second book contains the Advent missae. But in R. and S. we find a full arrangement of missae appropriated to particular Sundays. There are two for Sundays after Christmas, six for Sundays after Epiphany, the series from Septuagesima to Easter, four for the Sundays ‘post Octavas Paschae,’ one for the Sunday after the Ascension, and a series of twenty-seven for the Sundays after Pentecost, beginning with that for the octave: there are also, as we have seen, five missae for the Sundays before Christmas, answering to the five Advent missae of V."
