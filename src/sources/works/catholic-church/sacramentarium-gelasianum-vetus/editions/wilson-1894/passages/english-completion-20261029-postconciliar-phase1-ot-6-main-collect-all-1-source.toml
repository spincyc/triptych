notes = "Ancient prayer only: Deus qui te rectis ac sinceris manere pectoribus asseris, da nobis tua gratia tales existere in quibus habitare digneris. Per Dominum. The original printed conclusion cue is retained as recorded, without expansion. The bounded secondary2002 reading adds the preposition in before rectis and substitutes et for ac; exsistere/existere is a spelling variant, with pointing/capitalization/accents different. The ancient footnote4 is an apparatus marker after te, not prayer wording. The printed Per Dominum cue agrees."
