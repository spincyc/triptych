notes = "Old source: Reminiscere miserationum tuarum, Domine, et famulos tuos aeterna protectione sanctifica, pro quibus Christus Filius tuus per suum cruorem nobis instituit paschale mysterium. Per Dominum nostrum. Source footnote numerals are apparatus, not wording. Study relation: The secondary2002 petition omits exactly nobis between cruorem and instituit. Every other petition word agrees after stress accents, punctuation and capitalization. The old generic conclusion Per Dominum nostrum. is replaced by Qui vivit et regnat in saecula saeculorum. with a separate R. Amen. The complete third-person conclusion is independently image-witnessed in the same1894 source at artifact145/printed52; this is a common formula, not a newly composed petition. The response remains a marked separate response in study English. Ancient source footnote16 is apparatus after quibus, and17 follows Per; neither is wording. Apparatus16 records other witnesses with Iesus, while Wilson maintext and inspected secondary both Christus without Iesus."
