notes = "The entire old Ascension prayer already joins supplications, belief that the Savior shares the divine majesty, his abiding with us to the consummation of the age, and his own promise, in this sequence. The modern changes reorder the invocation, add a conventional graciousness qualifier and explicit pronouns, replace confidence with belief and a synonymous promise construction, and remove the seated predicate. The whole finite revised expression requires review; retaining common themes alone is not a sufficient basis. Old Ascension and modern Easter7 appointments are distinct."
