notes = "One page only: parent PDF page 198. Printed p. 105, Book I section LXI, Quinta Dominica post clausum Paschae, whose first prayer is the Collect Omnipotens sempiterne Deus, fac nos tibi semper et devotam gerere voluntatem, et maiestati tuae sincero corde servire, with Wilson's marginal concordances (R. S.; Gerb. 122; Pam. 402; Men. 95; III. ix infra) and apparatus (note 2: nobis Pam.; note 1: the Collects and Postcommunion of this Mass are assigned in R. S. Gerb. Pam. Men. to the Sunday after the Ascension). All other parent pages are omitted."
