notes = "One page only: parent PDF page 322. Printed p. 229, Book III section IX, Item alia Missa, whose second prayer is the same Collect in Wilson's text. His apparatus there (note 2) records that the Vatican manuscript (V.) reads maiestatem tuam at this place, while R. S. Gerb. and V. at I. lxi read maiestati tuae as his text; note 1 records that R. S. Gerb. assign the Mass, except its Secret, to the fifteenth Sunday after Pentecost. All other parent pages are omitted."
