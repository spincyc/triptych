notes = "Two pages only: parent PDF pages 276 and 277, printed pp. 183-184. Page 183 carries the close of the preceding Mass of St Paul and Book II section xxxiii, Orationes ad Vesperum, to its fifth prayer, Omnipotens sempiterne Deus, qui nos omnium apostolorum merita sub una tribuisti celebritate venerari, with Leon. 341 in the margin; page 184 carries the last prayers of II.xxxiii, Wilson's notes on the series, and II.xxxiv, Item de vigilia omnium apostolorum, whose note continues on p. 185, which is not included. All other parent pages are omitted."
