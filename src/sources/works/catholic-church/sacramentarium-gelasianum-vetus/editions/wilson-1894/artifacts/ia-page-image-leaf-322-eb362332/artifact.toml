notes = "One page image, 3407 by 5522 pixels, of leaf n322, which is Wilson 1894 printed p. 230, header '[III. xi.'. One page only, not the volume: a negative read off it is an absence from this page and from nothing wider. It carries Book III section XI, where the same three orations stand under the heading 'Item alia Missa' with no Sunday number and with a second Collect beside the first, and where Wilson's apparatus records that Rheinau, S. Gallen, Gerbert and Menard number the Mass to the seventeenth Sunday after Pentecost and Pamelius to the sixteenth. The volume's optical text is registered separately as artifact.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.ia-djvu-ocr-libersacramentorum."
