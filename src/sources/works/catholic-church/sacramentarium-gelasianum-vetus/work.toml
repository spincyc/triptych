description = "The oldest surviving ordered Roman sacramentary, in three books, copied in Gaul about the middle of the eighth century from a Roman book of the seventh. Its attribution to Gelasius I is traditional and not maintained. It is the principal witness for a large part of the Roman oration repertory that the twentieth-century reform drew on."
