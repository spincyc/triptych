notes = "Read on the page images; each heading line is a separate sense unit, and the offices under them are not transcribed. Running heads on rectos pp. 5-23 read 'A FESTO S. MARTINI AD DOMINICAM I ADVENTUS' (seen in the text layer, p. 3 on the image in abbreviated form); pp. 29-41 'A DOMINICA I ADVENTUS AD NATIVITATEM' (image pp. 29, 35, 41). The fourth Sunday is printed 'IIII'. The apparatus at p. 24 records that codex M has 'In Sabbato primo de Adventu' for the heading at l. 10. R1's dossier cited 'pars III / 1904'; this is Monumenta veteris liturgiae Ambrosianae III = Manuale pars altera (1904); pars prima (Monumenta II, IA manualeambrosian02cath) is dated 1905 on its own verso and is not registered."
