rights_basis = "Eleventh-century liturgical headings as printed at Milan in 1904; Public domain in the United States by publication date. The verso of the title leaf of this copy, read on the page image at PDF p. 8, prints Mediolani - ex Typographeo Humberti Allegretti - 1904, and the title page (PDF p. 7) is the one the edition record reads as M DCCCC IV; the reservation 'Quae a lege sunt iura reservantur' on that leaf has no effect on United States term. A work first published abroad before 1931 is out of United States copyright: that is the line guidance/missals.md section 5 records from Cornell's public-domain chart as current on 1 January 2026, and because it moves every January it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A cannot keep it protected: a restored term runs no longer than ninety-five years from publication, and ninety-five years from 1904 ended with 1999. No life-based term is relied on."
