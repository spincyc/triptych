notes = "Exact 1100 by 1800 pixel, 200 dpi page image. The site's own book index gives the page as John 20:1-20:29. John 20:1-13 was read on it complete, including the running head (Imperium Salvatoris mundi, 20, 1-21, 25), the section heading (1. Mariae Magdalene apparet, 20, 1-18), the cross-reference superscript letters, and the editorial marginal summary that names Peter and John."
