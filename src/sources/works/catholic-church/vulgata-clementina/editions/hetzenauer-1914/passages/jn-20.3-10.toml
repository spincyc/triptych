text = "Exiit ergo Petrus, et ille alius discipulus, et venerunt ad monumentum. Currebant autem duo simul, et ille alius discipulus praecucurrit citius Petro, et venit primus ad monumentum. Et cum se inclinasset, vidit posita linteamina, non tamen introivit. Venit ergo Simon Petrus sequens eum, et introivit in monumentum, et vidit linteamina posita, et sudarium, quod fuerat super caput eius, non cum linteaminibus positum, sed separatim involutum in unum locum. Tunc ergo introivit et ille discipulus, qui venerat primus ad monumentum: et vidit, et credidit: nondum enim sciebant Scripturam, quia oportebat eum a mortuis resurgere. Abierunt ergo iterum discipuli ad semetipsos."
