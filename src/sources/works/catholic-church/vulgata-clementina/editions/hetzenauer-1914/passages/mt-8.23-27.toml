text = "Et ascendente eo in naviculam, secuti sunt eum discipuli eius: et ecce motus magnus factus est in mari ita ut navicula operiretur fluctibus, ipse vero dormiebat. Et accesserunt ad eum Discipuli eius, et suscitaverunt eum, dicentes: Domine, salva nos, perimus. Et dicit eis Iesus: Quid timidi estis, modicæ fidei? Tunc surgens, imperavit ventis, et mari, et facta est tranquillitas magna. Porro homines mirati sunt, dicentes: Qualis est hic, quia venti et mare obediunt ei?"
