context = "The end of Jonah on numbered scan page 0875 (printed page 875) was visually inspected, including the surrounding verses 4:1-5, the section heading '2. Ionas irascens, 4, 1-11', the marginal summaries, and the bottom apparatus. Verse 4:6 reads 'Et praeparavit Dominus Deus hederam, et ascendit super caput Ionae ... et laetatus est Ionas super hedera, laetitia magna'; 'hederam'/'hedera' recurs in 4:7, 4:9, and 4:10. The 1914 editor's marginal summary glosses the episode 'et propter ricinum arefactum irascens'. The controlling artifact is a page image, so no machine-checkable transcription is recorded; the verification event covers the readings named here as seen on the image."
verified_on = "2026-07-24"
notes = "Created for the Claude edition of history/biblical-translations/02-vulgate, which cites the Clementine reading 'hederam' at Jonah 4:6 in connection with Augustine's report of the Oea incident (Augustine, Letter 71.5) and Jerome's defense (Letter 112.22)."
