notes = "A dated mutable web state of a transcribed Latin text that the site presents alongside its own photographs of a Hetzenauer 1914 copy. It is not the photographed printing and must be kept distinct from the hetzenauer-1914 edition registered for that printing, whose own record already directs consumers to keep the two apart. The transcription prints chapter and verse in braces, uses the ligature ae as the character it prints, and applies its own paragraphing; the site maintains a published errata list for its Latin. It serves as a convenient Latin witness for a locus and is not a critical edition; a consumer needing an exact reading should corroborate against a photographed printing."
