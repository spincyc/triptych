transformation = "Parse the USFM of eBible.org's latVUC release into one verse per line. Read \\c for the chapter and \\v for the verse, join a verse's continuation lines with single spaces, and take the text between one \\v and the next. Drop the content of \\f footnotes and \\x cross references entirely, since the Clementine Text Project's patristic apparatus (AUG., HIER., CASS.) is editorial matter and not scripture; unwrap character markup such as \\add, \\nd and \\w, keeping the words it encloses; and discard every remaining marker, which is paragraph and poetry structure rather than text. Remove the square brackets the transcription uses to delimit a psalm's body from its inscription: they are structural, they balance across the edition, and they mark no textual doubt, as 1 John 5:7 carries none. Collapse runs of whitespace to one space and strip the ends. Emit \"book<TAB>chapter<TAB>verse<TAB>text\" with a header line, LF terminated. Book tokens are the Douay-Rheims tokens registered in that edition's book index, so the two editions address the same book by the same name; the mapping is by USFM book code, not by file order, because eBible.org orders the deuterocanonical books differently from the Douay-Rheims, and every book's chapter count was checked to agree with the Douay-Rheims before the mapping was accepted."
indexable = true
