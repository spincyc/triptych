notes = "Song of Songs (Cant): 8 chapters and 116 verses, one LF-terminated line per verse after a header line. Chapter and verse numbers are the Clementine Vulgate's, which the 1962 Missal cites; they agree with the Douay-Rheims registered under work.english-college-of-douay.douay-rheims-bible."
