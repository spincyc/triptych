notes = "Twenty-eight rows over six psalms, with one further psalm declared in scripts/_psalter.py and deliberately carrying no row, derived and not typed: `tools/tests/test_psalter.py` and `index-bible check` both fail if this file and the derivation disagree. This table was a two-column header with no rows until 2026-07-31, and the two columns it carried were the two a row would have had to fill, so an edition that recorded no departures and one that could not record any read exactly alike."
