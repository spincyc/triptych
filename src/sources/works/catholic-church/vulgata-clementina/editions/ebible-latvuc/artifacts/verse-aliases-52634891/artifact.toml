provenance = "Derived by Triptych on 2026-07-31 by `python3 scripts/_psalter.py clementine-vulgate`, from the tracked psalm concordance and this edition's own verse text; the declarations it expands were established by reading this Latin against the Challoner Douay-Rheims the concordance was compiled from, and the retrieved eBible latVUC USFM (sha256 d8c02326…, matching the record under this edition) was read whole to confirm that the numbering is the upstream transcription's and not this library's extraction. It replaces an empty table whose record claimed this edition merges no verses; it merges four psalms' last verses and restarts two psalms entirely. Psalms 115 and 147 are the real departure from the Vulgate numbering: the Vulgate keeps the numbering those psalms had before the Hebrew split and prints them as verses 10-19 and 12-20, and this edition restarts both at 1, so before these rows existed a citation of Psalm 115:10 returned in atriis domus Domini — the last verse of the psalm under the first verse's number. The four merged rows at Psalms 15, 42, 125 and 135 record a last verse the concordance's witness divides and this edition does not, and the refusal at Psalm 42:5 records a verse whose text is divided between this edition's 4 and 5 with no printed verse carrying it whole. Where this edition prints one verse more than the numbering — Psalm 19, whose Domine salvum fac regem it numbers 10 — no row is written and the projection records a split instead: the cited number still opens the text cited, and refusing there would take away text this edition carries at the number the citing books print. Psalms 28 and 150 are not departures at all. The Vulgate numbering has a 28:11 and a 150:6 that the concordance cannot record, because its rows must be equal-length runs against the Hebrew; both are recorded instead in the Challoner edition's own alias table, and this edition prints them."
