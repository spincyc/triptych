notes = "The Clementine Latin text in the electronic form eBible.org distributes as latVUC, registered as the first complete verse-keyed Latin text in this library: the two Clementine editions already registered here carry only spot-checked loci and page photographs, so no Latin passage could be resolved from them. It is a transcription and not a critical edition, and it must be kept apart from the hetzenauer-1914 printing and from the SacredBible web state, whose own records already direct consumers to keep them apart. Its versification is the Clementine one the 1962 Missal cites: every book's chapter count was checked against the Challoner Douay-Rheims registered in this library and agrees throughout, including the 73 books, Daniel's 14 chapters with the third running to verse 100, Esther's 16, and the psalter's 150 with the title numbered as verse 1 and the restarted numbering at Psalms 115 and 147. Its psalter is Gallican, which is what the 1962 books print: Psalm 22 opens \"Dominus regit me\", where the Nova Vulgata reads \"Dominus pascit me\". That is not the same thing as matching the sung propers. The Mass chants are older than the Gallican psalter and frequently disagree with it -- the sixth Sunday after Pentecost sings \"protector salutarium Christi sui\" where this text reads \"protector salvationum\" -- so this edition resolves lections and validates versification, and must not be relied on to match a chant incipit. The transcription carries a patristic footnote apparatus attributing readings to Augustine, Jerome and Cassiodorus; it is editorial matter, is not scripture, and is excluded from the verse text registered here."
