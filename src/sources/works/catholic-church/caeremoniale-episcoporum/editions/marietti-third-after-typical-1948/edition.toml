notes = "The title page identifies the received Clement VIII, Innocent X, and Benedict XIII text as revised under Benedict XIV and Leo XIII and calls this printing the third edition after the typical edition. The following leaf records conformity with the approved exemplar and an imprimatur at Turin on 11 February 1948. This witness predates the restored Holy Week and the 1960 code of rubrics. It is therefore a principal 1962-horizon ceremonial witness only where a later competent book or decree had not replaced or modified its provisions."
