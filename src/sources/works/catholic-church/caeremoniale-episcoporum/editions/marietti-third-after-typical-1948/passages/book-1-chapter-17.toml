context = "Paragraphs 1–4 distinguish the precious, gold-cloth, and simple mitres by material and ornament and assign their principal uses. The precious mitre is associated with more solemn feasts and normally alternates with the lighter gold-cloth mitre during solemn Vespers and Mass; the gold-cloth mitre is assigned to specified penitential seasons and functions, with stated exceptions; the simple mitre is assigned to Good Friday and Offices and Masses of the Dead. Paragraphs 5–9 delimit a bishop's use of the pastoral staff by place or permission; distinguish long processions, in which a minister bears it immediately before him with both hands and raised from the ground, from short processions, in which the bishop may carry it in his left hand; enumerate uses at pontifical Vespers and Mass; and exclude Offices and Masses for the Dead."
artifact_page_ranges = [[63, 65]]
notes = "Printed pp. 51–53 were inspected at the rendered page images; OCR was used only for navigation and transcription checking. The passage identifies hanging vittae and some mitre materials and ornament, but does not prescribe a single universal profile, height, construction method, iconographic program, or dimensions. Its Holy Week provision predates the restored Holy Week and must be reconciled with the operative 1955–1962 books before a detailed Good Friday composition is presented. The pastoral-staff provisions establish ceremonial use and handling relationships, not material, dimensions, ornament, exact profile, or a crosier stand; their ordinary provisions remain subject to any competent post-1948 amendment applicable at the 1962 horizon."
