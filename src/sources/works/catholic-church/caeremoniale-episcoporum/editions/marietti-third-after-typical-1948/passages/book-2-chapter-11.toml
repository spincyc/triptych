context = "Chapter 11 governs a Pontifical Mass for the Dead. Paragraphs 1-2 require black vestments but expressly direct that the bishop not use sandals, gloves, or pastoral staff, and that the prayers for the sandals and gloves be omitted. The passage therefore establishes a negative branch: pontifical footwear is not black footwear and is not used merely because a bishop celebrates. It does not establish a general rule for every non-Mass episcopal function or every privileged prelate."
