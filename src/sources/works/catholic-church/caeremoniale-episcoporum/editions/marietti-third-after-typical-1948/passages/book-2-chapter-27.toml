notes = "Read visually at printed p. 189 (artifact PDF p. 200). This locus remains subject to the restored Holy Week books identified by the dictionary's edition audit; it is recorded here as the wording present in the 1948 ceremonial witness, not as an independent claim that the unrevised chapter controlled in 1962."
