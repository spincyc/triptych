context = "Chapter 27 gives the older ceremonial's Holy Saturday sequence. Paragraph 12 directs the bishop to receive white sandals and retain them while being vested in violet pontifical vestments. This is a narrow day-specific color and continuity rule in this witness. It prevents a simplistic claim that pontifical sandals always match the outer Mass vestments, but it does not establish the ordinary color rule, a universal white form, or any material morphology."
