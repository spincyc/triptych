context = "Chapter 10 describes the office of the subdeacon assisting a bishop who celebrates solemnly. Paragraph 2 distinguishes caligae from sandalia and directs that the pair be taken from the credence, carried on a basin or veil beneath a second silk covering, and raised in both hands. With one of the bishop's attendants assisting, the subdeacon kneels beneath the cappa and vests the right leg and foot first and then the left. The passage controls the two-object distinction, preparation, carrier, covering, order, and combined wearing formation. It does not prescribe fabric, color, ornament, dimensions, fastening, stocking height, or shoe construction."
