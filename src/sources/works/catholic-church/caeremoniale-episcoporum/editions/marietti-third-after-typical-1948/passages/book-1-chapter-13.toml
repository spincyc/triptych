context = "Paragraphs 1-2 locate the episcopal seat according to sanctuary and choir arrangement. Paragraph 3 prescribes three covered steps, a high and elevated seat made as a cathedra and immovable throne, a silk covering matching the other appointments, and a conditional canopy; it assigns this seat to the bishop's solemn Vespers and Mass. Paragraph 4 gives the episcopal seat to a cardinal present and places the celebrating bishop at the faldstool on the Epistle side."
artifact_page_ranges = [[54, 55]]
notes = "The registered locus is the whole chapter because the work's canonical locus grammar stops at chapter level; this record's inspected page range and context are limited to paragraphs 1-4. Both pages were visually inspected against the exact held artifact. In this ceremonial locus, cathedra and immovable throne describe the same episcopal seat rather than two independently specified furnishings. Material remains open among wood, marble, or another material, and the canopy is permitted conditionally rather than required universally."
