context = "Section 5 directs the pastoral-staff minister to hold the uncovered staff with the end of his cotta covering his right hand. Section 6 directs the mitre minister to wear from his neck an oblong silk veil or cloth, used to support the mitre so that he does not touch it with bare hands, unless he is vested in a cope. The governing text calls the mitre textile velum or mappa sericea oblonga; it does not use the later conventional headword vimpa in this locus."
verified_on = "2026-07-28"
notes = "Read visually in the exact acquired facsimile after OCR location. The distinction matters: the official Ceremonial expressly supplies the neck-hung oblong silk cloth to the mitre minister, while the checked Fortescue ceremonial records the broader customary use of similar vimpae by both the mitre and crozier bearers. Do not describe the latter custom as verbatim from this governing locus."
