context = "Numbers 10-19 give the bishop's vesting sequence for Solemn Pontifical Mass. After the initial vesting and Terce, n. 18 directs that the cope be removed and that the bishop be vested first in the tunicle and then in the same manner in the dalmatic; the deacon and subdeacon tighten cords placed on each side over the shoulders. Number 19 then directs that the chasuble be put on after the gloves. The passage therefore controls the identity of the pontifical tunicle and pontifical dalmatic as two distinct, successively layered episcopal vestments beneath the chasuble, and supports shoulder cords on the form described by this ceremonial. It does not establish a universal cut, dimensions, ornament, textile, sleeve relation, or reliable isolated visual distinction from the ministers' garments."
