verified_on = "2026-07-28"
notes = "Read at the rendered page images, printed pp. 115-116 (artifact PDF pp. 126-127). This pre-1962 witness remains subject to the later 1962 Missal's rubrics; Rubricae generales n. 134 confirms the layered pontifical use at the edition horizon and permits omission for a reasonable cause."
