context = "Paragraph 10 places the celebrant's faldstool near the lowest altar step on the Epistle side, prescribes its orientation, covering to the ground in silk matching the vestments, and a cushion beneath the covering. Paragraph 11 permits a low platform when altar steps would otherwise leave it too low, while stating that the proper bishop ordinarily stands and sits at his own episcopal seat rather than the faldstool."
