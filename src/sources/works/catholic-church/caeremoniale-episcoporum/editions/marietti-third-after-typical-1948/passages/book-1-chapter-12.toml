notes = "The registered locus is the whole chapter because the work's canonical locus grammar stops at chapter level; this record's inspected page range and context are limited to paragraphs 10-11. Both pages were visually inspected against the exact held artifact. The passage governs use, position, covering, and relative elevation; it does not prescribe a folding mechanism, back, frame material, ornament, or one universal silhouette."
