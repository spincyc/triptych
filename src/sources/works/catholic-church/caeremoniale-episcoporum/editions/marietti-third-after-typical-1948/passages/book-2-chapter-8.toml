notes = "The chapter opening at printed p. 112 and the footwear directions at printed p. 114 (artifact PDF p. 125) were checked at the rendered page images. The range is a 1962-horizon source map subject to later modifications; object-entry claims outside the verified footwear paragraph require narrower page-image checks."
