context = "The chapter gives the ceremonial sequence for Solemn Pontifical Mass celebrated by a bishop and cross-references the ministers, vesting, altar preparation, books, vessels, insignia, and handoffs described elsewhere. In paragraph 7, the Epistle subdeacon brings the sandalia and caligae from the credence on a basin, with his hands veiled and the footwear covered by another veil. With two episcopal attendants he removes the ordinary shoes and vests the right foot first and then the left, while six or eight kneeling acolytes raise and spread the hem of the cappa. This controls liturgical occasion, preparation, ministers, order, and the replacement of ordinary footwear. It does not control the objects' material morphology or establish that every bishop-shaped shoe or stocking is pontifical footwear."
