title = "Christ's Linen Napkin (John 20:7): Is it significant that the napkin that had been around Jesus' head when he was buried was found in the empty tomb folded?"
responsible = "David Bivin, answering a reader, for JerusalemPerspective.com"
work_type = "web-article"
languages = ["en"]
description = "The earliest dated appearance located of the modern claim that a folded napkin was a Jewish master-and-servant signal meaning I am coming back. The page prints a reader's question quoting the claim in its now-standard wording and David Bivin's reply, which observes that no version of the claim cites a biblical or rabbinic source and conjectures that the whole story was invented out of the archaic King James word napkin. Registered as dated evidence of the claim's circulation and of its earliest recorded refutation."
