context = "Bivin's reply, read in full in the retrieved capture. It observes that none of the perpetuators of the claim offers any evidence and that none cites a biblical or rabbinic source; sets out the lexical facts about soudarion as a Latin loanword and its three other New Testament occurrences; asks whether napkins were used at all in first-century Israel and notes that no early rabbinic source discusses how the hands were dried after washing; and concludes with four conditions the claim would require, including that the Greek word mean having been folded rather than having been wrapped up, together with the conjecture that the story was triggered by the archaic King James translation napkin."
notes = "Bivin is a specialist in the Jewish background of the Gospels, which makes this the earliest expert refutation located. His lexical claims were not taken on trust: the consuming publication checks soudarion and entylisso independently against a registered lexicon."
