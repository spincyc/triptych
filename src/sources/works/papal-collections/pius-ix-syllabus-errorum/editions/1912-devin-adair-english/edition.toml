notes = "English translation authorized by Cardinal McCabe according to the 1912 collection preface; the individual translator is not named. All 80 propositions and their historical source citations are retained. Source OCR misreads proposition 32 as 82, and retains broken words, folios and running heads; no silent correction is made. Dispatch was 8 December 1864; compilation date remains unknown. Full-word image collation is outstanding. Identified printing: New York: The Devin-Adair Company, 1912, printed pp.185–209."
