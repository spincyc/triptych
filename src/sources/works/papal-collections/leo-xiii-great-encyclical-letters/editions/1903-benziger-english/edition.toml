notes = "The title identifies translations from approved sources and a preface by John J. Wynne, S.J.; it does not name individual translators. The preface credits The Tablet, The American Catholic Quarterly Review, The Catholic World, The Messenger, The Catholic Mind, The Pope and the People, and Benziger pamphlets for translations not specially made for the volume. Wikisource supplies later transcriptions of this identified printing and flags remaining cleanup/proofreading; no whole-volume image collation is claimed. The title/copyright leaves of the whole Internet Archive facsimile were visually inspected. Print page numbers and the dating/type claims of the historical translation remain distinct from the modern catalog."
