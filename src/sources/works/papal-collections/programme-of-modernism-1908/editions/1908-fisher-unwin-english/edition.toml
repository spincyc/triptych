notes = "Native title leaf is acquired PDF page 9 and explicitly identifies London, Leipsic and 1908. It credits A. Leslie Lilley only for the introduction; the translators of the reply and appended encyclical are not identified by name. Whole OCR owns all historical book wording, Latin notes and factual library copy furniture; the surrounding reply is not attributed to the pope. The appendix occupies native PDF pages 203–318, printed pp. 175–290. Anonymous historical English translation appended to The Programme of Modernism (T. Fisher Unwin, 1908), printed pp. 175–290. A. Leslie Lilley is credited for the introduction only, not as translator. The entire appendix was read in the acquired OCR: proem, all three parts, seven remedial sections, historical footnotes, final blessing, 8 September 1907 dating and PIUS X., POPE signature. Bracketed headings are historical editorial additions, as the printed p. 176 note explicitly states; the translator’s conscientia note and Latin source citations remain. Native p. 177 confirms the full continuous passage lost in the damaged ACQR printing. Ordinary source defects are retained, including printed p. 255 experinece, p. 272 liën (OCR lien), and the p. 206 citation 1223 [sic]. Only exact running headlines are removed; whitespace is reflowed, hard-line word fragments and the historical gathering mark M remain. No whole-body image collation, translation collation, spelling correction or critical edition is claimed."
