notes = "Anonymous historical English translation appended to The Programme of Modernism (T. Fisher Unwin, 1908), printed pp. 175–290. A. Leslie Lilley is credited for the introduction only, not as translator. The entire appendix was read in the acquired OCR: proem, all three parts, seven remedial sections, historical footnotes, final blessing, 8 September 1907 dating and PIUS X., POPE signature. Bracketed headings are historical editorial additions, as the printed p. 176 note explicitly states; the translator’s conscientia note and Latin source citations remain. Native p. 177 confirms the full continuous passage lost in the damaged ACQR printing. Ordinary source defects are retained, including printed p. 255 experinece, p. 272 liën (OCR lien), and the p. 206 citation 1223 [sic]. Only exact running headlines are removed; whitespace is reflowed, hard-line word fragments and the historical gathering mark M remain. No whole-body image collation, translation collation, spelling correction or critical edition is claimed."
