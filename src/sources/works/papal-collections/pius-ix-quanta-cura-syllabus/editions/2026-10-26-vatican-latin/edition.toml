notes = "Full facsimile http://www.documentacatholicaomnia.eu/01p/1846-1878,_SS_Pius_IX,_Pontificis_Maximi_acta_Pars_I_Vol_03,_LT.pdf, SHA-256 7ce7f56c91dfeea894474e2bb30be573eab1aab355cced00db5a3d4906f3123d, 21256700 bytes. Quanta printed 687–700 equals PDF 697–710; Syllabus printed 701–717 equals PDF 711–727. Matching Google Books record https://books.google.com/books?id=LENDAAAAcAAJ dates volume III to 1864. ASS 3 (1867) 160–167 explicitly abbreviates Quanta’s terminal Jubilee section; it cannot establish complete terminal wording. The full Acta witness supplies it. Normalized transcription, not a corrected text or diplomatic edition; source spellings and erroneous references are retained. Offline historical witness: artifact.papal-collections.pii-ix-acta-pars-prima-volume-3.1864-rome.historical-pages-687-717-29394b6ec926, SHA-256 29394b6ec926106eb754b04c0ec443a8a9db9ef350fbf84b366ba06a7dd5826d, retained under the full-volume owner; derivative pages 1–14 witness Quanta and 15–31 the Syllabus."
