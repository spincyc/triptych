rights_basis = "Original Latin wording of Quanta cura and the Syllabus errorum identified in Pii IX Pontificis Maximi Acta, pars prima, volume III (Romae, 1864), pp. 687–700 and 701–717. The corresponding complete pre-1931 facsimile was inspected for work identity, full opening/ending bounds, Quanta terminal clauses, note apparatus, and all ten Syllabus sections. United States expired-term assessment under 17 U.S.C. 304/305, with 104A limited to remaining term and 103(b) preserving the status of preexisting wording. This basis excludes modern Vatican HTML, Denzinger bibliography, Google marks, scan wrappers, and creative modern additions; it does not assert complete verbal collation. See src/sources/inventories/papal-documents-rights-v1.toml."
