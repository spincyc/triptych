description = "Nine English encyclical chapters collected in the 1927 Herder printing. The translator expressly omits the diocesan-association regulations and the appended prayer to St. Thomas; those two chapters are registered as abridged witnesses. The seven other chapter extents have been read in full for structural boundaries, with inherited OCR errors retained."
