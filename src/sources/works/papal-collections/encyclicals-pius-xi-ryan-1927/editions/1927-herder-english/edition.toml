notes = "Native title/copyright/preface pages (artifact pages 5, 6 and 9) were individually inspected from the whole 304-page facsimile. The title names James H. Ryan; copyright and approbations are dated 1927. The preface credits Joseph Christopher as the starting translation of Rerum Ecclesiae, but Ryan expressly takes responsibility for substantial changes. It also states that diocesan-association regulations and the prayer appended to Studiorum ducem were omitted. Full chapter raw OCR extents were read; no complete image/word or translation-accuracy collation is claimed."
