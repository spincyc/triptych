context = "The paragraph on the Fathers' reading of the angel's salutation full of grace (Lk 1:28) and Elizabeth's greeting (Lk 1:42), printed pp. 81-82 (PDF 91-92)."
physical_line_ranges = [[3, 3]]
text = "But when the same Fathers and the writers of the Church revolved in their hearts and minds that the Most Blessed Virgin, in the name and by the order of God himself, was proclaimed full of grace by the Angel Gabriel, when announcing Her most sublime dignity of the Mother of God, they taught that, by this singular and solemn salutation, never heard on any other occasion, is shown that the Mother of God is the seal of all Divine graces, and adorned with all the gifts of the Holy Ghost—yea, the infinite storehouse and inexhaustible abyss of the same gifts; so that, never obnoxious to an evil word, and alone with her Son partaker of perpetual benediction, She deserved to hear from Elizabeth, inspired by the Holy Ghost, “Blessed art thou amongst women, and blessed is the Fruit of thy womb.”"
