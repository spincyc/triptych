physical_line_ranges = [[1, 2]]
text = "Wherefore, repeating the words in which, at the beginning of the world, the Almighty, announcing the remedies of His mercy, prepared for regenerating mankind, crushed the audacity of the lying serpent, and wonderfully raised up the hope of our race, saying—“I will place enmity between thee and the Woman, thy seed and hers,” they taught that in this Divine oracle was clearly and openly pointed out the merciful Redeemer of the human race—the only-begotten Son of God, Christ Jesus, and that his Most Blessed Mother, the Virgin Mary, was designated, and at the same time that the enmity of both against the serpent was signally expressed. Wherefore, as Christ, the Mediator of God and men, having assumed human nature, blotting out the handwriting of the decree which stood against us, fastened it triumphantly to the Cross, so the Most Holy Virgin, bound by a most close and indissoluble chain to Him, exercising with Him and through Him eternal enmity against the malignant serpent, and triumphing most thoroughly over the same, has crushed his head with Her Immaculate foot."
