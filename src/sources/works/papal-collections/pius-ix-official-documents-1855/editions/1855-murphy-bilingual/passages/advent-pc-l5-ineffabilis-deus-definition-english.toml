text = "to the honor of the Holy and undivided Trinity, to the glory and adornment of the Virgin Mother of God, to the exaltation of the Catholic Faith and the increase of the Catholic religion, by the authority of Jesus Christ Our Lord, of the Blessed Apostles, Peter and Paul, We declare, pronounce, and define that the doctrine which holds that the Blessed Virgin Mary, at the first instant of her conception, by a singular privilege and grace of the Omnipotent God, in virtue of the merits of Jesus Christ, the Saviour of mankind, was preserved immaculate from all stain of original sin, has been revealed by God, and therefore should firmly and constantly be believed by all the faithful."
