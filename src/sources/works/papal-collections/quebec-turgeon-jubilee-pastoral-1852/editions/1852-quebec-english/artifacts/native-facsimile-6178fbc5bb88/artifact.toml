notes = "Turgeon dates his pastoral 23 April 1852. The complete English Exultavit cor nostrum is its appendix at printed pp.7–10 (PDF pages 8–11), including the otherwise often omitted opening Our heart rejoiced, dated 21 November 1851 closing and PIUS IX. Pope subscription. Translator unnamed. All four native act pages inspected at full size; the entire four-page OCR read against its boundaries. Raw offered OCR has displaced phrase fragments on printed p.9 and repeated adjacent-page strips; this separate mechanical re-OCR uses only primary-page regions and makes no word corrections. Publication year 1852 is corroborated by CIHM 52209 and Turgeon's dated pastoral. Printing place and publisher are unknown: the catalogue gives [S.l. : s.n.] and tentatively suggests Quebec. The wrapper locates the issuer in Quebec. Catalogue evidence: https://archive.org/metadata/cihm_52209, SHA-256 31eaf9b916b483127b8fd11932786dfe6544dd82252ff24d4859226351492ee1."
