description = "The post-synodal apostolic exhortation of 2 February 2020 following the Special Assembly of the Synod of Bishops for the Pan-Amazon Region. It presents the synod's Final Document without citing it, and treats the shortage of priests without mentioning celibacy, married ordinands, or ordination."
