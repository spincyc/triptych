description = "The apostolic letter given motu proprio of 17 January 2019 decommissioning the Pontifical Commission Ecclesia Dei, assigning its tasks entirely to the Congregation for the Doctrine of the Faith within which a special section is to be established, and returning its financial report to that congregation's ordinary accounting. Its stated grounds are that the conditions which led to the Commission's institution have changed, that the institutes and religious communities customarily celebrating in the extraordinary form have found proper stability of number and life, and that the questions addressed are of a predominantly doctrinal order. Its second footnote cites the Rescriptum ex Audientia Sanctissimi of 18 October 1988, AAS 82 (1990) 533-534, n. 6, as the title under which the Commission exercised the authority of the Holy See over the societies and associations it erected, until otherwise provided."
