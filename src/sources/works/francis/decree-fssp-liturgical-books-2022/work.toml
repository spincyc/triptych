title = "Decree of Pope Francis on the 1962 liturgical books for the Priestly Fraternity of Saint Peter (11 February 2022)"
responsible = "Pope Francis"
work_type = "papal-decree"
languages = ["la"]
locus_pattern = 'complete-text'
description = "The decree of 11 February 2022 by which Francis granted to each and every member (omnibus et singulis sodalibus) of the Fraternity of Saint Peter, founded 18 July 1988 and declared of pontifical right by the Holy See, the faculty to celebrate the sacrifice of the Mass, the sacraments and other sacred rites and to fulfil the Divine Office according to the typical editions of the Missal, Ritual, Pontifical and Breviary in force in 1962, in the Fraternity's own churches and oratories and elsewhere only with the consent of the local Ordinary, private Masses excepted; and in which, the foregoing being duly observed, the Holy Father also advises (suadet) that careful thought be given, as far as can be done, to the provisions of Traditionis custodes. No publication of the decree by the Holy See has been located: it is not in Acta Apostolicae Sedis, on vatican.va, or in the Holy See Press Office bulletin. The Latin text calls the beneficiary an institute of consecrated life and names it Fraternitas Sancti Petri rather than Fraternitas Sacerdotalis Sancti Petri."
relations = ["work.francis.traditionis-custodes", "work.holy-see.pced-decree-liturgical-books-fssp-1988"]
