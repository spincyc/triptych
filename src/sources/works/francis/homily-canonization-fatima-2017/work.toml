description = "Pope Francis's homily at the Mass with the rite of canonization of Francisco and Jacinta Marto, celebrated in the square in front of the Shrine of Our Lady of Fatima on 13 May 2017, the centenary of the first apparition. The homily quotes Sister Lucia's Memoirs (III, 6). The Latin formula of canonization pronounced in the rite belongs to the celebration booklet, not to this homily text."
