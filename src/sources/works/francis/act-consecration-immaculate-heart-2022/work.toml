description = "The Act of Consecration to the Immaculate Heart of Mary pronounced by Pope Francis during the Celebration of Penance in Saint Peter's Basilica on 25 March 2022, solemnly entrusting and consecrating to the Immaculate Heart the Church and all humanity, especially Russia and Ukraine; announced at the Angelus of 20 March 2022 and accompanied by the Letter to the Bishops of 21 March 2022 asking the bishops of the whole world to join the act."
