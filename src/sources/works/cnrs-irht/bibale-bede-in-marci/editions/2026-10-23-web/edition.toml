notes = "The indexed notice reports its last modification by Elisa Lonati on 4 March 2023 at 11:00. Its date field assigns 0725-0730 to Bede’s In Marci evangelium expositio, independently of the author’s lifespan. It lists M. L. W. Laistner and H. H. King, A Hand-List of Bede Manuscripts (Ithaca, 1943), pp. 50-55, and Beda Venerabilis, Opera exegetica 3, In Lucae evangelium expositio. In Marci evangelium expositio, ed. D. Hurst (Turnhout, second edition 2001), CCSL 120. Those publications were not consulted. The FAMA indexed representation at https://fama.irht.cnrs.fr/oeuvre/326170 reports the same work, range and bibliography; the two portal notices are not treated as independent dating research."
