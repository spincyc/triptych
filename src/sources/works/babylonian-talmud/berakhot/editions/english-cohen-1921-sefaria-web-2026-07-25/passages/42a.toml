context = "The Talmud's treatment of when a meal is legally over, read in the retrieved response for the whole folio. Registered as the decisive negative for the modern folded-napkin claim: the exact question the alleged custom would answer is answered here, in a household with servants, by the removal of the table."
physical_line_ranges = [[1, 3]]
text = "Rab Pappa went on a visit to the house of Rab Huna b. Rab Nathan. After they had finished their meal, they set before them several things to eat. Rab Pappa took of them and ate. They said to him, Does not the master hold that if one has finished [his meal], he must not eat anything further? He replied, This has only been said when the table has been cleared. Raba and R. Zera went on a visit to the house of the Exilarch. After the tray had been taken away from before them, there was sent to them from the Exilarch's house a gift [of fruit]. Raba ate it, but R. Zera did not."
