context = "The Talmud's discussion of Mishnah Berakhot 8:3, read in the retrieved response for the whole folio. Registered as the evidence that the ancient rabbinic law of the table napkin is a ritual-purity question about where a damp hand-towel may be laid, with no servant, no folding, and no signal."
physical_line_ranges = [[1, 2]]
text = "Our Rabbis have taught: Bet Shammai say: One wipes his hands with a napkin which he lays upon the table; for if thou sayest that [he lays it] upon the bolster, there is a fear lest the moisture on the napkin may contract defilement on account of the bolster and this in turn may render the hands ritually unclean. But Bet Hillel say: [He lays it] upon the bolster; for if thou sayest that [he lays it] upon the table, there is a fear lest the moisture on the napkin may contract defilement on account of the table and in its turn defile the food."
