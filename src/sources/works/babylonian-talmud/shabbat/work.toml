description = "A tractate of the Babylonian Talmud, redacted in late antiquity. Folio 156a carries the discussion of whether the constellations govern Israel, including Rav's derivation of 'Israel has no constellation' from the words 'and He brought him outside' at Genesis 15:5. Loci use standard Vilna folio-and-side numbering; early printings and citations by later authors sometimes give a neighbouring folio number."
