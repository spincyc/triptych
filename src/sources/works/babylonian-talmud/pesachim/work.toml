description = "A tractate of the Babylonian Talmud, redacted in late antiquity. Folio 6b transmits the principle that there is no earlier and later in the Torah, together with Rav Pappa's limitation of it to two separate matters. Loci use standard Vilna folio-and-side numbering; early printings and citations by later authors sometimes give a neighbouring folio number."
