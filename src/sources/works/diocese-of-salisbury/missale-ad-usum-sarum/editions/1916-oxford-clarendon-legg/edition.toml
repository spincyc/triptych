notes = "Legg's critical edition from three early manuscripts. Dominica quarta decima post festum sanctae Trinitatis stands at printed page 186 and the Fifteenth at 187. Legg prints no source apparatus for the collects, so this edition cannot be cited for the derivation of the Book of Common Prayer collect from the Sarum Latin; that identification is by direct comparison of the two texts and belongs to the claim, not to this record."
