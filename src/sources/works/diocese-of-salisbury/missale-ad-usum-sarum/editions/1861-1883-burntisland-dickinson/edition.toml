notes = "Dickinson's edition, begun in 1855 and published in fascicles between 1861 and 1883 as the registered text layer's own front matter states. The date field records the first year of issue; the edition is not a single-year printing and the range is in this note rather than crammed into the field. guidance/missals.md section 7 warns that Internet Archive copies of this edition differ in extent -- one item has 830 images, another 353, a third is labelled Part I Temporale only -- so which fascicles a copy holds must be checked. THIS COPY IS THE WHOLE: the retrieving lane measured 828 page images and read the Fifteenth Sunday after Trinity at printed columns 503-506, which is well inside the Temporale but past the point where a Part I only copy would stop."
