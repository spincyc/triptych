description = "The Mass book of the use of Salisbury, the dominant English medieval use and the immediate Latin background of the Book of Common Prayer collects. Its Sundays after Trinity run one ahead of the Roman Sundays after Pentecost, so the Roman Fourteenth after Pentecost is the Sarum Dominica quinta decima post festum sanctae Trinitatis. Registered here in two modern critical editions; the medieval work itself is not dated in this registration."
