context = "The opening of Chapter V and the account of Christmas 1886: her sensitiveness and the small miracle needed, worked on Christmas Day 1886 (p. 71 ll. 1-11); the Infant Jesus, scarce an hour old, made her strong by becoming weak and little, and her tears dried up (p. 71 ll. 12-19); the shoes in the chimney-corner after Midnight Mass, her father's remark on the stairs, Céline's whispered warning, and Jesus having changed her heart (p. 71 ll. 20-29, p. 72 ll. 1-11); she runs down to the dining-room, empties the shoes happily, her father laughs, and she has regained the strength of mind lost at four and a half (p. 72 ll. 12-19). Line map: artifact line 1 = p. 71 ll. 1-11; line 2 = p. 71 ll. 12-19; line 3 = p. 71 ll. 20-29 and p. 72 ll. 1-11; line 4 = p. 72 ll. 12-19 (printed lines counted from the first text line below the chapter title on p. 71 and below the running head on p. 72)."
notes = "Supersedes nothing: the OCR-controlled passage chapter-v-christmas-1886 stands; this record gives the same opening in an image-checked transcription so that its words may be quoted exactly. Collated word by word on the page images of the hashed facsimile ia-pdf-01793fc6 (SHA-256 01793fc61c16ce1ffefc5643edd26a4f02140db1c8d90be2300bd3db446640a1). Normalizations (opening capitals, closed spaces before ; : ? and after opening quotation marks, joined line-end hyphens except long-desired and dining-room, no italics or footnote markers) are declared on the artifact. Footnote 1 of p. 71, keyed to to run as a giant, cites a psalm (Cf. ... xviii. 5.; partly illegible in this scan). The printing is an edited English rendering in Taylor's compilation; it is not the French autograph, and its title page names no translator."
