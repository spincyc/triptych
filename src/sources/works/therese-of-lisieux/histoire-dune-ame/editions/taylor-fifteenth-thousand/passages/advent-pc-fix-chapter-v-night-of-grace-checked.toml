context = "The two paragraphs that close the Christmas 1886 episode: on this night of grace the third and most beautiful period of her life began, and in an instant Our Lord did the work she had not managed in years; she could say with the Apostle, Master, we have laboured all night and have taken nothing (footnote: Luke v. 5); more merciful to her than to the disciples, he took the net himself and made her a fisher of men; love and self-forgetfulness took possession of her. Line map: artifact line 5 = p. 72 ll. 20-26; line 6 = p. 72 ll. 27-31."
notes = "Collated word by word on the page image of the hashed facsimile ia-pdf-01793fc6, physical PDF p. 100. The quoted words of Luke 5:5 are printed in italics and the footnote reads Luke v. 5.; italics and footnote are not in the text. Normalizations are declared on the artifact."
physical_line_ranges = [[5, 6]]
text = "On this night of grace, the third period of my life began—the most beautiful of all, the one most filled with heavenly favours. In an instant Our Lord, satisfied with my good will, accomplished the work I had not been able to do during all these years. Like the Apostle I could say: “Master, we have laboured all night, and have taken nothing.” More merciful to me even than to His beloved Disciples, Our Lord Himself took the net, cast it, and drew it out full of fishes. He made me a fisher of men. Love and a spirit of self-forgetfulness took possession of me, and from that time I was perfectly happy."
