notes = "A catalog-level identification of the conventional received Latin text. The document is a papal act of declaration and submission, not a definition, and the qualifying clause in quantum status et condicio compatitur animae separatae must be preserved in any quotation. No exact artifact of a printed Denzinger edition is retained or hashed. The 1334 act is public domain; particular printed editions of Denzinger retain their own editorial rights."
