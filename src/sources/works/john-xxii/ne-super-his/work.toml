description = "John XXII's bull of 3 December 1334, issued the day before his death, declaring his intention concerning the question whether the purified souls separated from their bodies see the divine essence face to face before the resumption of their bodies. It confesses that they do see God and the divine essence face to face clearly, according to the common law, so far as the state and condition of a separated soul allows, and submits everything he has said or written to the determination of the Church and of his successors."
