notes = "Dated by the page's own footer, This page was last updated on November 22, 2026; the page also prints Electronic version Copyright © 2014–2026. Retrieved 2026-11-26. Its own statement of extent, under Summary and Note: Just over 600 different non-biblical readings are included, not only one for each day of the liturgical seasons, but also for many individual saints, as well as several optional Common Readings for various categories of saints and for the Office for the Dead. The page also states that Easter Sunday is the only day that has no non-biblical reading. Nothing on the page attests that it is complete beyond that statement."
