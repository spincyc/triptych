notes = "Measured extent: 99,805 bytes; the table holds 605 HTML table rows. The Advent rows (U.S. volume I) run from 1st Sunday of Advent (Cyril of Jerusalem, Catechetical instruction 15, 1-3, 1.142) through 3rd Week of Advent, Friday (Augustine, On Psalm 38, 13-14, 1.302) and then Dec. 17 to Dec. 25: Christmas (Leo the Great, Sermon on the birth of Christ 1, 1-3, 1.404); the sanctoral rows give Dec. 8: Immaculate Conception (Anselm of Canterbury, Discourse 52, 1.1228). The table has no row for the Fourth Sunday of Advent (the only 4th Sunday rows are of Lent, Easter and Ordinary Time), and no row for Saturday of the third week. The Dec. 12 row is Jane Frances de Chantal, not Our Lady of Guadalupe. The bytes are not retained in Git."
