description = "A private scholar's tabular index, in liturgical order, of the non-biblical (second) readings of the Office of Readings in the four-volume Liturgy of the Hours as published for the United States, giving for each day the author, the work and locus as the book's heading gives it, and the U.S. volume and page. A finding aid, not the book: it prints no reading text and is not an official witness. A locus is a table row named by its season, feast or date column."
