text = "Joachim then took to wife that revered and praiseworthy woman, Anna. But just as the earlier Anna, who was barren, bore Samuel by prayer and by promise, so also this Anna by supplication and promise from God bare the Mother of God in order that she might not even in this be behind the matrons of fame. Accordingly it was grace (for this is the interpretation of Anna) that bore the lady: (for she became truly the Lady of all created things in becoming the Mother of the Creator)."
