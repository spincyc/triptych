description = "The fifth volume of the second series of the Nicene and Post-Nicene Fathers translation anthology, containing the dogmatic and ascetic treatises of Gregory of Nyssa in English, including On the Soul and the Resurrection, On the Making of Man, the Great Catechism, and Against Eunomius, with the volume editors' prolegomena. Its container identity remains distinct from Gregory's own works printed within it."
