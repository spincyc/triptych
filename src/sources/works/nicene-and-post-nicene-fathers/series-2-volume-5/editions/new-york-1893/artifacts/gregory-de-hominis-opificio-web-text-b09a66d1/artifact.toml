transformation = "python3 scripts/wikisource_transcribe.py <export> --label Chapter --no-sections --drop '—+' --drop 'On the Making of Man\\.' --drop 'Note on the Treatise .*' --out gregory-de-hominis-opificio.txt, run over the exact bytes of the parent artifact. The script drops the Wikisource page header, every <ref> footnote body, every wiki heading and the three dropped patterns, which are the printing's rule, its running head and the editors' note title; unwraps templates, links and italics; decodes HTML entities; folds typographic quotation marks, apostrophes and non-breaking spaces to their ASCII equivalents; normalises to NFC; collapses runs of whitespace; and writes one LF-terminated UTF-8 line per source paragraph, prefixed by a braced locator naming the Wikisource page. --no-sections because this printing numbers no subdivision inside a chapter, unlike Basil's homilies."
encoding = "utf-8"
indexable = true
notes = "A transcription of a web witness of the 1893 printing, not a collation against the printed page, so no passage taken from it rises above inspected. One bound is worth recording because it was nearly missed: Wikisource's own contents page for this treatise lists thirty chapter pages and stops, while a thirty-first page exists and carries the printing's chapter XXX. A retrieval driven by that contents list would have produced a file that stopped one chapter early and would have looked exactly like a complete one. The page list was therefore probed past the end of the contents until a page genuinely did not exist, and the export holds all thirty-one chapter pages."
