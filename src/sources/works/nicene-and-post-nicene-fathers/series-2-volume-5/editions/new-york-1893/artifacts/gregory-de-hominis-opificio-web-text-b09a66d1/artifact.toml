rights_basis = "The complete text of Gregory of Nyssa's De hominis opificio in Henry Austin Wilson's Nicene and Post-Nicene Fathers English translation, published New York 1893 and in the United States public domain by date of publication. Wilson died in 1927 and Schaff in 1893, so the translation is also out of copyright in jurisdictions applying a life-plus-seventy term. No host's markup, formatting, pagination, footnotes or annotation is reproduced."
rights_jurisdiction = "United States"
provenance = "Derived on 2026-07-31 from the hashed Wikisource export above by the tracked script named in transformation. No model stood anywhere in the path. This is the work the Genesis pilot could not land: asked for it verbatim, a model-mediated route returned a paraphrase of chapter 1 under Gregory's name, and nothing was written rather than write words that might not be the translator's. Fetching the bytes directly settles it. Line 1 is the volume editors' note on the treatise, which is Schaff's and not Gregory's; lines 2 to 281 are Gregory's, the dedicatory letter to Peter and the printing's table of chapter headings at lines 2 to 35 and chapters I to XXX at lines 36 to 281."
