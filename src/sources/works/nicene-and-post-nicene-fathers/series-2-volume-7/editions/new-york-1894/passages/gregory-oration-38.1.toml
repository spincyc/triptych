text = "Christ is born, glorify ye Him. Christ from heaven, go ye out to meet Him. Christ on earth; be ye exalted. Sing unto the Lord all the whole earth; and that I may join both in one word, Let the heavens rejoice, and let the earth be glad, for Him Who is of heaven and then of earth. Christ in the flesh, rejoice with trembling and with joy; with trembling because of your sins, with joy because of your hope. Christ of a Virgin; O ye Matrons live as Virgins, that ye may be Mothers of Christ. Who doth not worship Him That is from the beginning? Who doth not glorify Him That is the Last?"
