physical_line_ranges = [[1, 8]]
text = "O new commingling; O strange conjunction; the Self-Existent comes into being, the Uncreate is created, That which cannot be contained is contained, by the intervention of an intellectual soul, mediating between the Deity and the corporeity of the flesh. And He Who gives riches becomes poor, for He assumes the poverty of my flesh, that I may assume the richness of His Godhead. He that is full empties Himself, for He empties Himself of His glory for a short while, that I may have a share in His Fulness. What is the riches of His Goodness? What is this mystery that is around me? I had a share in the image; I did not keep it; He partakes of my flesh that He may both save the image and make the flesh immortal. He communicates a second Communion far more marvellous than the first, inasmuch as then He imparted the better Nature, whereas now Himself partakes of the worse. This is more godlike than the former action, this is loftier in the eyes of all men of understanding."
