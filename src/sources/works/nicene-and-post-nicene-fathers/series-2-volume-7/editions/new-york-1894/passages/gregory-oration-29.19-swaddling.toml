text = "He was born—but He had been begotten: He was born of a woman—but she was a Virgin. The first is human the second Divine. In His Human nature He had no Father, but also in His Divine Nature no Mother. Both these belong to Godhead. He dwelt in the womb—but He was recognized by the Prophet, himself still in the womb, leaping before the Word, for Whose sake He came into being. He was wrapped in swaddling clothes—but He took off the swathing bands of the grave by His rising again. He was laid in a manger—but He was glorified by Angels, and proclaimed by a star, and worshipped by the Magi."
