context = "Section XVII, printed page 351 (PDF page 425), read whole; the quotation runs from its opening to sing hymns, omitting its close (Let this Festival be common to the powers in heaven and to the powers upon earth, and the Heavenly Hosts keeping festival). The page's running head, Introduction to the Oration on the Holy Lights, anticipates the item that begins in the right column; the text quoted is Oration XXXVIII."
physical_line_ranges = [[1, 5]]
text = "Now then I pray you accept His Conception, and leap before Him; if not like John from the womb, yet like David, because of the resting of the Ark. Revere the enrolment on account of which thou wast written in heaven, and adore the Birth by which thou wast loosed from the chains of thy birth, and honour little Bethlehem, which hath led thee back to Paradise; and worship the manger through which thou, being without sense, wast fed by the Word. Know as Isaiah bids thee, thine Owner, like the ox, and like the ass thy Master’s crib; if thou be one of those who are pure and lawful food, and who chew the cud of the word and are fit for sacrifice. Or if thou art one of those who are as yet unclean and uneatable and unfit for sacrifice, and of the gentile portion, run with the Star, and bear thy Gifts with the Magi, gold and frankincense and myrrh, as to a King, and to God, and to One Who is dead for thee. With Shepherds glorify Him; with Angels join in chorus; with Archangels sing hymns."
