notes = "Isaiah's ox and ass (Isa. i. 3) are printed Know as Isaiah bids thee, thine Owner, like the ox, and like the ass thy Master's crib, not 'thy Master's crib, like the ass'. The footnote letters of this section appear displaced one place on the printed page: the note Luke ii. 1-5 (the enrolment) is keyed to birth, the note I. e., original sin (Ps. li. 5) to crib, and Isa. i. 3 to myrrh. The CCEL web text of the volume agrees in wording and punctuation."
