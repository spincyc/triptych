context = "From section IX of the Second Oration on Easter, printed page 426 (PDF page 500): He who gives riches becomes poor, that I may assume the riches of His Godhead; a Second Communion far more marvellous than the first. The Office of Readings of Tuesday of the first week of Advent appoints Oration 45.9, 22, 26, 28."
physical_line_ranges = [[1, 6]]
text = "And He who gives riches becomes poor; for He assumes the poverty of my flesh, that I may assume the riches of His Godhead. He that is full empties Himself; for He empties Himself of His Glory for a short while, that I may have a share in His Fulness. What is the riches of His Goodness? What is this mystery that is around me? I had a share in the Image and I did not keep it; He partakes of my flesh that He may both save the Image and make the flesh immortal. He communicates a Second Communion, far more marvellous than the first, inasmuch as then He imparted the better nature, but now He Himself assumes the worse."
