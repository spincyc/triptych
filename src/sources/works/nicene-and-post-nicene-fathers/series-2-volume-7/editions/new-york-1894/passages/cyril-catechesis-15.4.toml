text = "The things then which are seen shall pass away, and there shall come the things which are looked for, things fairer than the present; but as to the time let no one be curious. For it is not for you, He says, to know times or seasons, which the Father hath put in His own power. And venture not thou to declare when these things shall be, nor on the other hand supinely slumber. For he saith, Watch, for in such an hour as ye expect not the Son of Man cometh."
