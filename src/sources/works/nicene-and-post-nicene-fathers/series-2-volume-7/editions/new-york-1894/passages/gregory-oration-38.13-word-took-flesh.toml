physical_line_ranges = [[1, 2]]
text = "As these required a greater aid, so also they obtained a greater. And that was that the Word of God Himself—Who is before all worlds, the Invisible, the Incomprehensible, the Bodiless, Beginning of Beginning, the Light of Light, the Source of Life and Immortality, the Image of the Archetypal Beauty, the immovable Seal, the unchangeable Image, the Father’s Definition and Word, came to His own Image, and took on Him flesh for the sake of our flesh, and mingled Himself with an intelligent soul for my soul’s sake, purifying like by like; and in all points except sin was made man."
