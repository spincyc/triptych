physical_line_ranges = [[1, 7]]
text = "He was baptized as Man—but He remitted sins as God—not because He needed purificatory rites Himself, but that He might sanctify the element of water. He was tempted as Man, but He conquered as God; yea, He bids us be of good cheer, for He has overcome the world. He hungered—but He fed thousands; yea, He is the Bread that giveth life, and That is of heaven. He thirsted—but He cried, If any man thirst, let him come unto Me and drink. Yea, He promised that fountains should flow from them that believe. He was wearied, but He is the Rest of them that are weary and heavy laden. He was heavy with sleep, but He walked lightly over the sea."
