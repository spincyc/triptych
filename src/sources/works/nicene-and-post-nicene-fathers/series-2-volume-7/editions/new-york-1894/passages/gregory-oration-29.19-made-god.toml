physical_line_ranges = [[1, 7]]
text = "For He Whom you now treat with contempt was once above you. He Who is now Man was once the Uncompounded. What He was He continued to be; what He was not He took to Himself. In the beginning He was, uncaused; for what is the Cause of God? But afterwards for a cause He was born. And that cause was that you might be saved, who insult Him and despise His Godhead, because of this, that He took upon Him your denser nature, having converse with Flesh by means of Mind. While His inferior Nature, the Humanity, became God, because it was united to God, and became One Person because the Higher Nature prevailed . . . in order that I too might be made God so far as He is made Man."
