context = "The opening of Cyril's fifteenth Catechetical Lecture (On the clause, And shall come in glory to judge the quick and the dead; of whose kingdom there shall be no end; reading Daniel vii. 9-14), section 1 read whole on printed page 104 (PDF page 178); the quotation stops at but look also for His second."
physical_line_ranges = [[1, 7]]
text = "We preach not one advent only of Christ, but a second also, far more glorious than the former. For the former gave a view of His patience; but the latter brings with it the crown of a divine kingdom. For all things, for the most part, are twofold in our Lord Jesus Christ: a twofold generation; one, of God, before the ages; and one, of a Virgin, at the close of the ages: His descents twofold; one, the unobserved, like rain on a fleece; and a second His open coming, which is to be. In His former advent, He was wrapped in swaddling clothes in the manger; in His second, He covereth Himself with light as with a garment. In His first coming, He endured the Cross, despising shame; in His second, He comes attended by a host of Angels, receiving glory. We rest not then upon His first advent only, but look also for His second."
