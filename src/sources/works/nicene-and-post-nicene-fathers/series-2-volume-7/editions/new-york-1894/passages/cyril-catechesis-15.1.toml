notes = "The CCEL text (lines 16165-16177) agrees in wording, spelling and punctuation. The page sets the scriptural phrases (like rain on a fleece; covereth Himself with light as with a garment; He endured the Cross, despising shame) in italic, which is omitted; Gifford's footnote 4 notes that the contrast of the two Advents is partly borrowed from Justin Martyr, with Tertullian and Hippolytus."
