text = "Terrible in good truth is the judgment, and terrible the things announced. The kingdom of heaven is set before us, and everlasting fire is prepared. How then, some one will say, are we to escape the fire? And how to enter into the kingdom? I was an hungred, He says, and ye gave Me meat. Learn hence the way; there is here no need of allegory, but to fulfil what is said. I was an hungred, and ye gave Me meat; I was thirsty, and ye gave Me drink; I was a stranger, and ye took Me in; naked, and ye clothed Me; I was sick, and ye visited Me; I was in prison, and ye came unto Me. These things if thou do, thou shalt reign together with Him; but if thou do them not, thou shalt be condemned. At once then begin to do these works, and abide in the faith; lest, like the foolish virgins, tarrying to buy oil, thou be shut out. Be not confident because thou merely possessest the lamp, but constantly keep it burning."
