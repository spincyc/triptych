notes = "Catalog-level record created 2026-07-25 from the volume identity as republished at CCEL and mirrored at New Advent. Pilkington translated the Confessions; Cunningham the selected letters. The 1886 American printing is public domain. No exact artifact has been registered; publications consulting web transcriptions of this edition record their own access routes and limits locally. Imprint corrected on 2026-11-18: the title page (PDF p. 7 of the registered facsimile ia-facsimile-pdf-5aefe9a7, read on the image) reads Buffalo: The Christian Literature Company, 1886, where this record had New York. The edition id keeps 'new-york-1886' as a stable identifier; the place in it is not the imprint. Exact artifacts (the remote facsimile and checked transcriptions) are now registered beside this record."
