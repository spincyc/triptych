context = "Book VIII, chapter XII, section 29 of the Confessions: the reading of Romans xiii. 13-14 in the garden at Milan. Section 29 was read whole on printed pages 127-128 (PDF pages 141-142), from I was saying these things through the gloom of doubt vanished away, with section 30 following; the quotation begins at So quickly I returned."
physical_line_ranges = [[1, 3]]
text = "So quickly I returned to the place where Alypius was sitting; for there had I put down the volume of the apostles, when I rose thence. I grasped, opened, and in silence read that paragraph on which my eyes first fell,—“Not in rioting and drunkenness, not in chambering and wantonness, not in strife and envying; but put ye on the Lord Jesus Christ, and make not provision for the flesh, to fulfil the lusts thereof.” No further would I read, nor did I need; for instantly, as the sentence ended,—by a light, as it were, of security infused into my heart,—all the gloom of doubt vanished away."
