notes = "ACCESS LIMITATION: the whole 81,953,856-byte scan is not retained, for its measured size; no text layer of this item is tracked, and every passage verified on these pages carries its checked transcription as a tracked artifact. The copy is the University of Toronto's (Robarts). IMPRINT: the title page (PDF page 7, read on the image) reads: A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church. Edited by Philip Schaff, D.D., LL.D. ... Volume I. The Confessions and Letters of St. Augustin, with a Sketch of his Life and Work. Buffalo: The Christian Literature Company. 1886. The verso (PDF page 8, read on the image) reads Copyright, 1886, by The Christian Literature Company, and Electrotyped and printed by Rand Avery Company, Boston. The enclosing edition record gives the place as New York; this copy's title page says Buffalo. It is registered here as the 1886 printing that record names, and the place is left for the edition record's owner to settle. Printed page n is PDF page n+14 (printed 127 is PDF 141; printed 465 is PDF 479). The pages carry page images with a text layer from optical recognition; that layer was used only to find pages."
