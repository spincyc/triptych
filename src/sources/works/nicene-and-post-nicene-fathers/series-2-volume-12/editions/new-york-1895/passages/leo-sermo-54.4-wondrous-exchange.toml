context = "Leo's fifty-fourth sermon, headed Sermon LIV. On the Passion, III on the preceding page (PDF page 235, located in the text layer), the close of section IV (headed Christ voluntarily bartered His glory for our weakness), left column of printed page 166 (PDF page 236). This is a sermon on the Passion, not on the Nativity."
physical_line_ranges = [[1, 2]]
text = "In our Nature, therefore, the Lord trembled with our fear, that He might fully clothe our weakness and our frailty with the completeness of His own strength. For He had come into this world a rich and merciful Merchant from the skies, and by a wondrous exchange had entered into a bargain of salvation with us, receiving ours and giving His, honour for insults, salvation for pain, life for death: and He Whom more than 12,000 of the angel-hosts might have served for the annihilation of His persecutors, preferred to entertain our fears, rather than employ His own power."
