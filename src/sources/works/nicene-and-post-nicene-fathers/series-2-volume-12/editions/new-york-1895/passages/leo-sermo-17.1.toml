physical_line_ranges = [[1, 2]]
text = "Among these is also the solemn fast of the tenth month, which is now to be kept by us according to yearly custom, because it is altogether just and godly to give thanks to the Divine bounty for the crops which the earth has produced for the use of men under the guiding hand of supreme Providence. And to show that we do this with ready mind, we must exercise not only the self-restraint of fasting, but also diligence in almsgiving, that from the ground of our heart also may spring the germ of righteousness and the fruit of love, and that we may deserve God’s mercy by showing mercy to His poor."
