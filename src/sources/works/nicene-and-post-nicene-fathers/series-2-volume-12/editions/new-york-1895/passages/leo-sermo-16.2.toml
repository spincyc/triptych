context = "Leo's sixteenth sermon (On the Fast of the Tenth Month), section II (headed Almsgiving and fasting are the most essential aids to prayer), read whole on printed page 124 (PDF page 182); the quoted sentences are its first three."
physical_line_ranges = [[1, 3]]
text = "And while all seasons are opportune for this duty, beloved, yet this present season is specially suitable and appropriate, at which our holy fathers, being Divinely inspired, sanctioned the Fast of the tenth month, that when all the ingathering of the crops was complete, we might dedicate to God our reasonable service of abstinence, and each might remember so to use his abundance as to be more abstinent in himself and more open-handed towards the poor. For forgiveness of sins is most efficaciously prayed for with almsgiving and fasting, and supplications that are winged by such aids mount swiftly to God’s ears: since as it is written, “the merciful man doeth good to his own soul,” and nothing is so much a man’s own as that which he spends on his neighbour."
