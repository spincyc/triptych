physical_line_ranges = [[1, 1]]
text = "And hence we warn you, beloved, in fatherly affection, to make this winter fast fruitful to yourselves by bounteous alms, rejoicing that by you the Lord feeds and clothes His poor, to whom assuredly He could have given the possessions which He has bestowed on you, had He not in His unspeakable mercy wished to justify them for their patient labour, and you for your works of love."
