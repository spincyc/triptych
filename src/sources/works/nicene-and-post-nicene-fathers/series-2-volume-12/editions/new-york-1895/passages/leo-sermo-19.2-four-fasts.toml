context = "Leo's nineteenth sermon, the opening of section II (headed The teaching of the four yearly fasts is that spiritual self-restraint is as necessary as corporeal), read on printed page 127 (PDF page 185); the quotation stops at what to preach and what to do, before the citation of Psalm 19."
physical_line_ranges = [[1, 2]]
text = "This profitable observance, dearly beloved, is especially laid down for the fasts of the Church, which, in accordance with the Holy Spirit’s teaching, are so distributed over the whole year that the law of abstinence may be kept before us at all times. Accordingly we keep the spring fast in Lent, the summer fast at Whitsuntide, the autumn fast in the seventh month, and the winter fast in this which is the tenth month, knowing that there is nothing unconnected with the Divine commands, and that all the elements serve the Word of God to our instruction, so that from the very hinges on which the world turns, as if by four gospels we learn unceasingly what to preach and what to do."
