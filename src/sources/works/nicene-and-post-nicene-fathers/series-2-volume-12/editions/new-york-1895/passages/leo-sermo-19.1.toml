text = "When the Saviour would instruct His disciples about the Advent of God’s Kingdom and the end of the world’s times, and teach His whole Church, in the person of the Apostles, He said, “Take heed lest haply your hearts be overcharged with surfeiting and drunkenness, and care of this life.” And assuredly, dearly beloved, we acknowledge that this precept applies more especially to us, to whom undoubtedly the day denounced is near, even though hidden. For the advent of which it behoves every man to prepare himself, lest it find him given over to gluttony, or entangled in cares of this life."
