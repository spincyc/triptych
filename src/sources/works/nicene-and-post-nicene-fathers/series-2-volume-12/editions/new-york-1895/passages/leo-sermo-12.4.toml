context = "Leo's twelfth sermon, the first On the Fast of the Tenth Month, section IV (headed Prayer, fasting and almsgiving are the three comprehensive duties of a Christian), read whole on printed page 123 (PDF page 181), from its heading to Amen and the heading of Sermon XVI that follows."
physical_line_ranges = [[1, 8]]
text = "But there are three things which most belong to religious actions, namely prayer, fasting, and almsgiving, in the exercising of which while every time is accepted, yet that ought to be more zealously observed, which we have received as hallowed by tradition from the Apostles: even as this tenth month brings round again to us the opportunity when according to the ancient practice we may give more diligent heed to those three things of which I have spoken. For by prayer we seek to propitiate God, by fasting we extinguish the lusts of the flesh, by alms we redeem our sins: and at the same time God’s image is throughout renewed in us, if we are always ready to praise Him, unfailingly intent on our purification and unceasingly active in cherishing our neighbour. This threefold round of duty, dearly beloved, brings all other virtues into action: it attains to God’s image and likeness and unites us inseparably with the Holy Spirit. Because in prayer faith remains stedfast, in fastings life remains innocent, in almsgiving the mind remains kind. On Wednesday and Friday therefore let us fast: and on Saturday let us keep vigil with the most blessed Apostle Peter, who will deign to aid our supplications and fast and alms with his own prayers through our Lord Jesus Christ, who with the Father and the Holy Ghost lives and reigns for ever and ever. Amen."
