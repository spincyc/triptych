notes = "Sermon XII is the first of Leo's December (tenth-month) Ember sermons. The page prints Apostles with a capital where the CCEL text (lines 12972-12992) has apostles; it otherwise agrees in wording, spelling and punctuation. Feltoe's footnote in the CCEL text calling this the Advent Embertide is the translator's gloss and was not read here on the page."
