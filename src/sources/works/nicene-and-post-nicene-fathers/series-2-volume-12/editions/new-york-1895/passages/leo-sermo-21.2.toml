notes = "Feltoe's footnote 3 at the other notes that the words Without detriment ... the other are repeated in almost the same words in Letter XXVIII (the Tome), chap. 3. The section continues: For unless He were true God, He would not bring us a remedy; unless He were true Man, He would not give us an example. The CCEL web text adds a comma after debt (the paying off of the debt, belonging to our condition); the page, read at 400 dots per inch, has none. It otherwise agrees."
