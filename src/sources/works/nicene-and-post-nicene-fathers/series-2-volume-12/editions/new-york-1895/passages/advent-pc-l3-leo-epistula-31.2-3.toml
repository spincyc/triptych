text = "And the fulfilment of the mystery of our atonement, which was ordained from all eternity, was not assisted by any figures because the Holy Spirit had not yet come upon the Virgin, and the power of the Most High had not over-shadowed her: so that “Wisdom building herself a house” within her undefiled body, “the Word became flesh;” and the form of God and the form of a slave coming together into one person, the Creator of times was born in time; and He Himself through whom all things were made, was brought forth in the midst of all things. For if the New Man had not been made in the likeness of sinful flesh, and taken on Him our old nature, and being consubstantial with the Father, had deigned to be consubstantial with His mother also, and being alone free from sin, had united our nature to Him the whole human race would be held in bondage beneath the Devil’s yoke, and we should not be able to make use of the Conqueror’s victory, if it had been won outside our nature. But from Christ’s marvellous sharing of the two natures, the mystery of regeneration shone upon us that through the self-same spirit, through whom Christ was conceived and born, we too, who were born through the desire of the flesh, might be born again from a spiritual source: and consequently, the Evangelist speaks of believers as those “who were born not of bloods, nor of the will of the flesh, nor of the will of man, but of God.” And of this unutterable grace no one is a partaker, nor can be reckoned among the adopted sons of God, who excludes from his faith that which is the chief means of our salvation."
