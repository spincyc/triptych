context = "Letter XXXI, to Pulcheria Augusta, the end of chapter II (Man's salvation required the union of the two natures in Christ) and the opening of chapter III (From the union of the two natures flows the grace of baptism), printed page 45 (PDF page 83); the last word, salvation, heads the right-hand column. The Office of Readings appoints Letter 31.2-3 on 17 December, the first day of the O antiphons."
