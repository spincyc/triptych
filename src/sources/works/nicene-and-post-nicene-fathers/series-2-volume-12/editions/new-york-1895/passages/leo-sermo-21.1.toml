context = "Leo's twenty-first sermon, headed Sermon XXI. On the Feast of the Nativity, I., section I (headed All share in the joy of Christmas), right column of printed page 128 (PDF page 186); the quotation runs from the opening to which he had conquered."
physical_line_ranges = [[1, 8]]
text = "Our Saviour, dearly-beloved, was born to-day: let us be glad. For there is no proper place for sadness, when we keep the birthday of the Life, which destroys the fear of mortality and brings to us the joy of promised eternity. No one is kept from sharing in this happiness. There is for all one common measure of joy, because as our Lord the destroyer of sin and death finds none free from charge, so is He come to free us all. Let the saint exult in that he draws near to victory. Let the sinner be glad in that he is invited to pardon. Let the gentile take courage in that he is called to life. For the Son of God in the fulness of time which the inscrutable depth of the Divine counsel has determined, has taken on him the nature of man, thereby to reconcile it to its Author: in order that the inventor of death, the devil, might be conquered through that (nature) which he had conquered."
