text = "Andrew, after having tarried with Jesus and learned what He did, kept not the treasure to himself, but hastens and runs quickly to his brother, to impart to him of the good things which he had received. For this word, “we have found,” is the expression of a soul which travails for His presence, and looks for His coming from above, and is made overjoyed when the looked-for thing has happened, and hastens to impart to others the good tidings."
