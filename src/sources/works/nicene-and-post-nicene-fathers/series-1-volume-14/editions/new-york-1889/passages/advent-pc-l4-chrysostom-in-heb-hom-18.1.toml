notes = "Homily XVIII's lemma is Heb. 10:8-13; the verses Heb. 10:5-7 (a body hast Thou prepared Me) are the lemma of the close of Homily XVII on printed page 448, where Chrysostom's comment turns at once to the one sacrifice against the many and does not expound the prepared body. In the left column of page 451 the sentence Then said I, Lo! I come. Of whom was this spoken? of none other than the Christ was read, but the binding gutter of this copy has cropped the first letters of its lines (other appears as her), so it is not transcribed. The print sets the quotation marks around To do Thy will and By which Will we are sanctified; they are kept as straight marks."
