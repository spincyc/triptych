context = "Chrysostom on Lo, I come to do Thy will (Heb. 10:9): God's will is not the sacrifices but their abolition, and to do Thy will is the Son's giving up of Himself, by which will we are sanctified. Read on printed page 451, right column, rendered from the hashed facsimile, from Therefore sacrifices are not God's will through the end of section 1 (Therefore to offer sacrifice is not the will of God), before [2.] And why dost thou wonder."
physical_line_ranges = [[1, 3]]
text = "{18.1} Therefore sacrifices are not God's will, but the abolition of sacrifices. Wherefore they sacrifice contrary to His will. {18.1} What is \"To do Thy will\"? To give up Myself, He means: This is the will of God. \"By which Will we are sanctified.\" {18.1} Or he even means something still further, that the sacrifices do not make men clean, but the Will of God. Therefore to offer sacrifice is not the will of God."
