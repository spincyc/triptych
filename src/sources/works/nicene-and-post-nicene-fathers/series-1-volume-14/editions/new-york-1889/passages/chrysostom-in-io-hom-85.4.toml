context = "Chrysostom's argument that the disposition of the burial cloths tells against theft of the body, read on printed pages 320 and 321 rendered from the hashed facsimile. The reading included the preceding paragraph on the placing of the tomb, footnote 11 on page 320 which quotes John 20:3-7, and the opening of section 5 on page 321, so that the passage boundary is explicit."
physical_line_ranges = [[1, 8]]
text = "When then she came and said these things, they hearing them, draw near with great eagerness to the sepulcher, and see the linen clothes lying, which was a sign of the Resurrection. For neither, if any persons had removed the body, would they before doing so have stripped it; nor if any had stolen it, would they have taken the trouble to remove the napkin, and roll it up, and lay it in a place by itself; but how? they would have taken the body as it was. On this account John tells us by anticipation that it was buried with much myrrh, which glues linen to the body not less firmly than lead; in order that when thou hearest that the napkins lay apart, thou mayest not endure those who say that He was stolen. For a thief would not have been so foolish as to spend so much trouble on a superfluous matter. For why should he undo the clothes? and how could he have escaped detection if he had done so? since he would probably have spent much time in so doing, and be found out by delaying and loitering. But why do the clothes lie apart, while the napkin was wrapped together by itself? That thou mayest learn that it was not the action of men in confusion or haste, the placing some in one place, some in another, and the wrapping them together. From this they believed in the Resurrection. On this account Christ afterwards appeared to them, when they were convinced by what they had seen. Observe too here again the absence of boastfulness in the Evangelist, how he witnesses to the exactness of Peter's search. For he himself having gotten before Peter, and having seen the linen clothes, inquired not farther, but withdrew; but that fervent one passing farther in, looked at everything carefully, and saw somewhat more, and then the other too was summoned to the sight. For he entering after Peter, saw the grave-clothes lying, and separate. Now to separate, and to place one thing by itself, and another, after rolling it up, by itself, was the act of some one doing things carefully, and not in a chance way, as if disturbed."
