description = "The fourteenth volume of the first series of the Nicene and Post-Nicene Fathers translation anthology, containing the English of Chrysostom's eighty-eight homilies on the Gospel of John, revised by Frederic Gardiner from the Oxford Library of Fathers version of Charles Marriott, together with the homilies on Hebrews. Its container identity remains distinct from Chrysostom's own works and from the translated editions printed within it. Homily LXXXV takes John 19:16-18 as its printed lemma and runs through John 20:10; Homily LXXXVI takes John 20:10-11."
