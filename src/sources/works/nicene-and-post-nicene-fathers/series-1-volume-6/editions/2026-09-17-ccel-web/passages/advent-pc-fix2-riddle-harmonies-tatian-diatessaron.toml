context = "In his survey of Gospel harmonies, Riddle names Tatian's Diatessaron (dated between A.D. 153 and 170) as the earliest attempt at a Harmony of the four Gospels, and notes that a commentary on it by Ephraem the Syrian, surviving in Armenian, allowed Zahn to reconstruct much of its text. Supports the descriptor that the Diatessaron is a harmony of the four Gospels, and connects it to Ephrem's commentary read in the Office of Readings."
physical_line_ranges = [[7070, 7076]]
text = "The earliest attempt at constructing a Harmony was that of Tatian [494] (died A.D. 172). The date of its appearance was between A.D. 153 and 170; and its title, Diatessaron, furnishes abundant evidence of the early acceptance of our four canonical Gospels. Our knowledge of this work was, until recently, very slight. But the discovery of an Armenian translation of a commentary upon it, by Ephraem the Syrian, has enabled Zahn to reconstruct a large part of the text."
