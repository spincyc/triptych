text = "It will come at midnight, Watch ye. Thus did the Gospel close; \"Watch, for ye know neither the day nor the hour.\" But if we are all to sleep, how shall we watch? Watch with the heart, watch with faith, watch with hope, watch with charity, watch with good works; and then, when thou shalt sleep in thy body, the time will come that thou shalt rise. And when thou shalt have risen, make ready the lamps. Then shall they go out no more, then shall they be renewed with the inner oil of conscience; then shall that Bridegroom fold thee in His spiritual embrace, then shall He bring thee into His House where thou shall never sleep, where thy lamp can never be extinguished. But at present we are in labour, and our lamps flicker amid the winds and temptations of this life; but only let our flame burn strongly, that the wind of temptation may increase the fire, rather than put it out."
