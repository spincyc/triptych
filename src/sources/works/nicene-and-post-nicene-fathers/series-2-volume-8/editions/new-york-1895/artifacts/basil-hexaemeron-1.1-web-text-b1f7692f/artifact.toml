rights_basis = "This transcription reproduces section 1 of the first Hexaemeron homily in Blomfield Jackson's Nicene and Post-Nicene Fathers English translation, which is in the United States public domain by date of publication. Jackson died in 1905 and Schaff in 1893, so the translation is also out of copyright in jurisdictions applying a life-plus-seventy term. No host's markup, formatting, pagination or annotation is reproduced."
