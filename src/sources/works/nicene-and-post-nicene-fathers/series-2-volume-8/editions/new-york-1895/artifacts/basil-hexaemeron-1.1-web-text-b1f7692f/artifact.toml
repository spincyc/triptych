notes = "This is a web transcription, not a collation against the printed page: no facsimile of the 1895 printing was hashed or read for it, so the artifact records what two independent web witnesses of the printing agree on. Both witnesses read 'and that was all was given up to chance' in section 2, where the sense wants 'and that all was given up to chance'; the doubled auxiliary is preserved rather than silently corrected, and resolving it needs the printed page."
