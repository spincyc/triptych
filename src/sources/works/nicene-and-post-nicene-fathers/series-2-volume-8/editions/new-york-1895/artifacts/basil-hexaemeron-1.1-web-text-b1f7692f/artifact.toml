provenance = "Retrieved 2026-07-31 from two independent transcriptions of this printing and collated against each other: English Wikisource, and the Christian Classics Ethereal Library at https://www.ccel.org/ccel/schaff/npnf208.viii.ii.html. The two agreed character for character across both sections, including the doubled auxiliary recorded in the notes below, so the wording here rests on two witnesses rather than one. The running text of the named section was taken from each witness, compared, and written one sense unit per LF-terminated UTF-8 line prefixed by a braced homily-and-section locator, preserving the translation's wording, archaic second person, spelling and punctuation, and omitting footnote markers, section numbering, headings and host navigation. No transformation field is recorded because no parent artifact was hashed: neither web witness was retained as exact bytes, so there is no reproducible transformation input, only two corroborating readings."
