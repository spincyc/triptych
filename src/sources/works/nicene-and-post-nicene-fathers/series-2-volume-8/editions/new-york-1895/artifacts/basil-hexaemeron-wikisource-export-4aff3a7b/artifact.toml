rights_basis = "The Nicene and Post-Nicene Fathers English translation printed in this volume is in the United States public domain by date of publication, and its translators and editors died before 1930, so it is also out of copyright in jurisdictions applying a life-plus-seventy term. The bytes here are the wiki source of an English Wikisource transcription of that printing, retrieved whole in one Special:Export request. English Wikisource contributions are licensed CC BY-SA 4.0, which is a condition on the contributors' markup rather than on the printed translation beneath it; the exact bytes are therefore recorded and hashed but not retained here, and only the printed translation reaches the tracked derivative, stripped of every template, link, footnote and heading the contributors added."
