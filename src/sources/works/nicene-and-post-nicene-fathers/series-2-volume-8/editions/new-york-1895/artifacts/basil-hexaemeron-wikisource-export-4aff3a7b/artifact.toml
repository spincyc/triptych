provenance = "Retrieved 2026-07-31 in one request, by POSTing the complete page list to English Wikisource's Special:Export with curonly=1, so the whole of Basil's Hexaemeron, all nine homilies arrived as a single document rather than a page at a time. No model stood anywhere in the retrieval path: the bytes were fetched with curl, hashed, and read locally. The document holds 9 pages, which is every page of the work that Wikisource carries. The current revision of each page at retrieval was 12722435, 12722436, 12722438, 12722443, 12722445, 12722447, 12722449, 12722452 and 12722454 for Homilies I to IX in order. Wikisource is a mutable witness, so this artifact identifies a dated state of it and not a stable republication; re-running the same request later may return different bytes and would be a different artifact."
