notes = "This is a web transcription, not a collation against the printed page: no facsimile of the 1895 printing was hashed or read, so the artifact records what two independent web witnesses of the printing agree on. Three divergences were found and are resolved here as stated. In section 2 both witnesses read 'and that was all was given up to chance' where the sense wants 'and that all was given up to chance'; because both carry it the doubled auxiliary belongs to the transcription lineage and is preserved rather than silently corrected. In section 5 Wikisource closes the quotation of Colossians 1:16 after 'powers' while the Christian Classics Ethereal Library runs it on to 'archangels'; Wikisource's placement is followed because it matches the end of the scriptural quotation. In section 6 the Christian Classics Ethereal Library response stopped one sentence earlier than Wikisource, and in section 8 the Wikisource response stopped several sentences earlier than the Christian Classics Ethereal Library; in each case the shorter reading is a prefix of the longer, which indicates a truncated response rather than a textual variant, so the longer reading is taken. All three should be settled against the printed page before this text is promoted beyond inspected."
