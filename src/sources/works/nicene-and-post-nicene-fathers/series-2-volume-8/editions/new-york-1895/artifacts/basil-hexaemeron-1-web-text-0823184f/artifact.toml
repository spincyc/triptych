rights_basis = "The complete first Hexaemeron homily in Blomfield Jackson's Nicene and Post-Nicene Fathers English translation, which is in the United States public domain by date of publication. Jackson died in 1905 and Schaff in 1893, so the translation is also out of copyright in jurisdictions applying a life-plus-seventy term. No host's markup, formatting, pagination or annotation is reproduced, and neither the Wikisource page furniture nor the Christian Classics Ethereal Library edition apparatus enters these bytes."
