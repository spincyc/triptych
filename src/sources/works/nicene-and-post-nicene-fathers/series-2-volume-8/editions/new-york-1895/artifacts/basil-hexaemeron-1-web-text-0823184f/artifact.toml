provenance = "Retrieved 2026-07-31 from two independent transcriptions of this printing and collated against each other section by section: English Wikisource, and the Christian Classics Ethereal Library at https://www.ccel.org/ccel/schaff/npnf208.viii.ii.html. Both witnesses report the homily as having eleven numbered sections and both were pulled across four requests each until all eleven were in hand. The running text of each section was written as one LF-terminated UTF-8 line per source paragraph, prefixed by a braced homily-and-section locator, preserving the translation's wording, archaic second person, spelling and punctuation, and omitting footnote markers, section numbering, headings and host navigation. Typographic apostrophes were normalised to the ASCII apostrophe so that one convention holds across the file. No transformation field is recorded because no parent artifact was hashed: neither witness was retained as exact bytes, so there is no reproducible transformation input, only two corroborating readings."
