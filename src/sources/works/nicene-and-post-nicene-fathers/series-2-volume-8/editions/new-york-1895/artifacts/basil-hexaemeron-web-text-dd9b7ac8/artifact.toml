derived_from = "artifact.nicene-and-post-nicene-fathers.series-2-volume-8.new-york-1895.basil-hexaemeron-wikisource-export-4aff3a7b"
transformation = "python3 scripts/wikisource_transcribe.py <export> --label Homily --roman --out basil-hexaemeron.txt, run over the exact bytes of the parent artifact. The script drops the Wikisource page header, every <ref> footnote body, every wiki heading, and the printing's running head and scriptural lemma; unwraps templates, links and italics; decodes HTML entities; folds typographic quotation marks, apostrophes and non-breaking spaces to their ASCII equivalents; normalises to NFC; collapses runs of whitespace; and writes one LF-terminated UTF-8 line per source paragraph, prefixed by a braced homily-and-section locator taken from the printing's own numbering."
