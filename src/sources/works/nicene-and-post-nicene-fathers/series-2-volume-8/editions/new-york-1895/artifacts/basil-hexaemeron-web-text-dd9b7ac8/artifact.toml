indexable = true
notes = "This is a transcription of a web witness of the 1895 printing, not a collation against the printed page, so no passage taken from it rises above inspected. It supersedes the earlier basil-hexaemeron-1-web-text-0823184f, which held Homily I alone and was assembled by hand from two model-mediated readings. Collating that file against these bytes found two defects in it that the route it used could not have shown: an entire paragraph of section 5 was missing, beginning “The first movement is called beginning”, and two further paragraphs had been run together into one. The earlier file also read “according heaven the privilege of seniority” where this witness reads “according to heaven”; that one is a genuine divergence between readings rather than a defect in either, and it stands open against the printed page along with the three divergences the earlier record listed."
