rights_basis = "The complete text of all nine homilies of Basil's Hexaemeron in Blomfield Jackson's Nicene and Post-Nicene Fathers English translation, published New York 1895 and in the United States public domain by date of publication. Jackson died in 1905 and Schaff in 1893, so the translation is also out of copyright in jurisdictions applying a life-plus-seventy term. No host's markup, formatting, pagination, footnotes or annotation is reproduced."
rights_jurisdiction = "United States"
provenance = "Derived on 2026-07-31 from the hashed Wikisource export above by the tracked script named in transformation. The retrieval fetched whole byte streams with curl, hashed them, and read them locally; no model stood in the path at any point, which matters here because the same corpus has already been shown to come back paraphrased when a model was asked for it verbatim. The file holds 162 lines: Homily I at lines 1-16, II at 17-37, III at 38-54, IV at 55-68, V at 69-85, VI at 86-110, VII at 111-126, VIII at 127-146 and IX at 147-162."
