notes = "Acquired for the Genesis catena pilot as one of ten commentaries on Genesis 1 to 3. States stop at inspected: the wording rests on two independent web transcriptions of the 1895 printing that agree character for character, but no facsimile of that printing was hashed or collated, so this is not verified in the source library's sense. Basil's extent is Genesis 1:1 to 1:26 and no further, and the ninth homily breaks off before the creation of man; a catena must not extend him past that boundary."
