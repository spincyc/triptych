context = "The proem of the first Hexaemeron homily, delivered at Caesarea in Lent 378. Basil has not yet reached the lemma; he is establishing the authority of Moses as the writer of the creation account before expounding it, and section 2 on the same page moves to Genesis 1:1 itself. Both sections were read together so that the boundary between proem and exposition is explicit."
physical_line_ranges = [[1, 5]]
text = "It is right that any one beginning to narrate the formation of the world should begin with the good order which reigns in visible things. I am about to speak of the creation of heaven and earth, which was not spontaneous, as some have imagined, but drew its origin from God. What ear is worthy to hear such a tale? How earnestly the soul should prepare itself to receive such high lessons! How pure it should be from carnal affections, how unclouded by worldly disquietudes, how active and ardent in its researches, how eager to find in its surroundings an idea of God which may be worthy of Him! But before weighing the justice of these remarks, before examining all the sense contained in these few words, let us see who addresses them to us. Because, if the weakness of our intelligence does not allow us to penetrate the depth of the thoughts of the writer, yet we shall be involuntarily drawn to give faith to his words by the force of his authority. Now it is Moses who has composed this history; Moses, who, when still at the breast, is described as exceeding fair; Moses, whom the daughter of Pharaoh adopted; who received from her a royal education, and who had for his teachers the wise men of Egypt; Moses, who disdained the pomp of royalty, and, to share the humble condition of his compatriots, preferred to be persecuted with the people of God rather than to enjoy the fleeting delights of sin; Moses, who received from nature such a love of justice that, even before the leadership of the people of God was committed to him, he was impelled, by a natural horror of evil, to pursue malefactors even to the point of punishing them by death; Moses, who, banished by those whose benefactor he had been, hastened to escape from the tumults of Egypt and took refuge in Ethiopia, living there far from former pursuits, and passing forty years in the contemplation of nature; Moses, finally, who, at the age of eighty, saw God, as far as it is possible for man to see Him; or rather as it had not previously been granted to man to see Him, according to the testimony of God Himself, \"If there be a prophet among you, I the Lord will make myself known unto him in a vision, and will speak unto him in a dream. My servant Moses is not so, who is faithful in all mine house, with him will I speak mouth to mouth, even apparently and not in dark speeches.\" It is this man, whom God judged worthy to behold Him, face to face, like the angels, who imparts to us what he has learnt from God. Let us listen then to these words of truth written without the help of the \"enticing words of man's wisdom\" by the dictation of the Holy Spirit; words destined to produce not the applause of those who hear them, but the salvation of those who are instructed by them."
