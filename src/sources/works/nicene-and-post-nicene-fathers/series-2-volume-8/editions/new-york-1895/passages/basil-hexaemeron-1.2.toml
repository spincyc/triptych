context = "Basil's exposition of the lemma In principio fecit Deus caelum et terram, against the Greek natural philosophers and the atomists. This is the first fragment in the set that comments on Genesis 1:1 directly, and the preceding section 1 was read with it so that the start of the exposition is explicit."
physical_line_ranges = [[1, 8]]
text = "\"In the beginning God created the heaven and the earth.\" I stop struck with admiration at this thought. What shall I first say? Where shall I begin my story? Shall I show forth the vanity of the Gentiles? Shall I exalt the truth of our faith? The philosophers of Greece have made much ado to explain nature, and not one of their systems has remained firm and unshaken, each being overturned by its successor. It is vain to refute them; they are sufficient in themselves to destroy one another. Those who were too ignorant to rise to a knowledge of a God, could not allow that an intelligent cause presided at the birth of the Universe; a primary error that involved them in sad consequences. Some had recourse to material principles and attributed the origin of the Universe to the elements of the world. Others imagined that atoms, and indivisible bodies, molecules and ducts, form, by their union, the nature of the visible world. Atoms reuniting or separating, produce births and deaths and the most durable bodies only owe their consistency to the strength of their mutual adhesion: a true spider's web woven by these writers who give to heaven, to earth, and to sea so weak an origin and so little consistency! It is because they knew not how to say \"In the beginning God created the heaven and the earth.\" Deceived by their inherent atheism it appeared to them that nothing governed or ruled the universe, and that was all was given up to chance. To guard us against this error the writer on the creation, from the very first words, enlightens our understanding with the name of God; \"In the beginning God created.\" What a glorious order! He first establishes a beginning, so that it might not be supposed that the world never had a beginning. Then he adds \"Created\" to show that which was made was a very small part of the power of the Creator. In the same way that the potter, after having made with equal pains a great number of vessels, has not exhausted either his art or his talent; thus the Maker of the Universe, whose creative power, far from being bounded by one world, could extend to the infinite, needed only the impulse of His will to bring the immensities of the visible world into being. If then the world has a beginning, and if it has been created, enquire who gave it this beginning, and who was the Creator: or rather, in the fear that human reasonings may make you wander from the truth, Moses has anticipated enquiry by engraving in our hearts, as a seal and a safeguard, the awful name of God: \"In the beginning God created\"—It is He, beneficent Nature, Goodness without measure, a worthy object of love for all beings endowed with reason, the beauty the most to be desired, the origin of all that exists, the source of life, intellectual light, impenetrable wisdom, it is He who \"in the beginning created heaven and earth.\""
