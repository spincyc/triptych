notes = "Registered by Advent postconciliar research lane 4 on 2026-11-26 from the University of Toronto copy digitized by the Internet Archive as selectlibraryofn10auguuoft. The title page (PDF page 7, read on the image) reads: A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, edited by Philip Schaff, Volume X, Saint Chrysostom: Homilies on the Gospel of Saint Matthew, New York, The Christian Literature Company, 1888; its verso (PDF page 8) reads Copyright, 1888, by The Christian Literature Company. The translation is Sir George Prevost's Oxford version, revised with notes by M. B. Riddle (PDF page 13). Set in two columns with a running head giving the homily number, the volume title and the page. Page numbers cited are the printed page numbers. No print edition of this volume was registered before; the CCEL electronic witness edition.nicene-and-post-nicene-fathers.series-1-volume-10.ccel-web-2026-09-17 is a separate expression and is not equated with this printing."
