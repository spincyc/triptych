notes = "ACCESS LIMITATION: the whole 69,103,486-byte scan is not retained, for its measured size; no text layer of this item is tracked, and every passage verified on these pages carries its checked transcription as a tracked artifact. PDF page 2 is the Toronto bookplate (estate of A. S. P. Woodhouse). Around Homilies LXXVII-LXXIX printed page n is PDF page n+28 (printed 465 is PDF 493; printed 470 and 471 are PDF 498 and 499; printed 474, 475 and 476 are PDF 502, 503 and 504). The pages carry a text layer from optical recognition; it was used only to find pages. The printed heading HOMILY LXXIX, Matt. XXV. 31-41, stands on printed page 474 (PDF 502), which corrects the CCEL electronic witness of this volume, where the close of Homily LXXVIII runs into the body of Homily LXXIX without the heading or the homily's opening."
