context = "Chrysostom on the ten virgins: the lamps are virginity, the oil is almsgiving; those who sell the oil are the poor, who are found here and not then; the poor are the hope of salvation and the oil must be gathered now. Read on printed page 470 (right column, from But by lamps here) and printed page 471 (left column, through but this), rendered from the hashed facsimile; section 2 begins at Seest thou what great profit."
physical_line_ranges = [[1, 4]]
text = "{78.1} But by lamps here, He meaneth the gift itself of virginity, the purity of holiness; and by oil, humanity, almsgiving, succor to them that are in need. {78.1} \"But go to them that sell, and buy.\" And who are they that sell? The poor. And where are these? Here, and then should they have sought them, not at that time. {78.2} Seest thou what great profit arises to us from the poor? shouldest thou take them away, thou wouldest take away the great hope of our salvation. {78.2} Wherefore here must we get together the oil, that it may be useful to us there, when the time calls us. For that is not the time of collecting it, but this."
