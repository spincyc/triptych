context = "Chrysostom's reason for the Lord's silence about the day and the hour: that the disciples may watch and be always ready, and that each man's own end is uncertain for the same purpose. Read on printed page 465, left column, rendered from the hashed facsimile, from the lemma But know this, that if the good man of the house (Matt. 24:43-44) through the section number 3 to life also uncertain."
physical_line_ranges = [[1, 3]]
text = "{77.2} For this intent He tells them not, in order that they may watch, that they may be always ready; therefore He saith, When ye look not for it, then He will come, desiring that they should be anxiously waiting, and continually in virtuous action. {77.2} But His meaning is like this: if the common sort of men knew when they were to die, they would surely strive earnestly at that hour. {77.3} In order therefore that they may strive, not at that hour only, therefore He tells them not either the common hour, or the hour of each, desiring them to be ever looking for this, that they may be always striving. Wherefore He made the end of each man's life also uncertain."
