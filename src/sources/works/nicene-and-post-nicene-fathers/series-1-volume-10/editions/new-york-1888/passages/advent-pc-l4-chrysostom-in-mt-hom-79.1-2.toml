context = "Chrysostom on the sheep and the goats: the ease of what was asked, the dignity of the receiver (God receiving by the poor), why the least are called brethren (lowly, poor, outcast; every believer, by baptism and the mysteries), and how small the things repaid with the kingdom are. Read on printed page 475 (right column, from And neither in hunger through divine mysteries) and printed page 476 (foot of the left column and head of the right, And in return ... into the prison), rendered from the hashed facsimile. The homily's heading, HOMILY LXXIX, Matt. XXV. 31-41, was read on printed page 474."
physical_line_ranges = [[1, 5]]
text = "{79.1} And neither in hunger is the thing commanded grievous. For no costly table did He seek, but what is needful only, and His necessary food, and He sought in a suppliant's garb, so that all things were enough to bring punishment on them; the easiness of the request, for it was bread; the pitiable character of Him that requesteth, for He was poor; the sympathy of nature, for He was a man; the desirableness of the promise, for He promised a kingdom; the fearfulness of the punishment, for He threatened hell. {79.1} The dignity of the one receiving, for it was God, who was receiving by the poor; the surpassing nature of the honor, that He vouchsafed to condescend so far; His just claim for what they bestowed, for of His own was He receiving. {79.1} What sayest Thou? they are Thy brethren; and how dost Thou call them least. Why, for this reason they are brethren, because they are lowly, because they are poor, because they are outcast. {79.1} For such doth He most invite to brotherhood, the unknown, the contemptible, not meaning by these the monks only, and them that have occupied the mountains, but every believer; though he be a secular person, yet if he be hungry, and famishing, and naked, and a stranger, His will is he should have the benefit of all this care. For baptism renders a man a brother, and the partaking of the divine mysteries. {79.2} And in return for what do they receive such things? For the covering of a roof, for a garment, for bread, for cold water, for visiting, for going into the prison."
