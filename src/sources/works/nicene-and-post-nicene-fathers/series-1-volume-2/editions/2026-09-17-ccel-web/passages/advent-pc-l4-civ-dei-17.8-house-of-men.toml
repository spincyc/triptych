text = "For however long the interval of time might be before Jesus Christ came, beyond doubt it was after the death of king David, to whom He was so promised, that He behoved to come, who should build an house of God, not of wood and stone, but of men, such as we rejoice He does build. For to this house, that is, to believers, the apostle saith, \"The temple of God is holy, which temple ye are.\""
