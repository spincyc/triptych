context = "Book XXI, chapter 27 (against those who think alms without amendment of life will save): why the Judge will impute alms to those on his right hand."
physical_line_ranges = [[41025, 41038]]
text = "The reason, therefore, of our predicting that He will impute to those on His right hand the alms-deeds they have done, and charge those on His left with omitting the same, is that He may thus show the efficacy of charity for the deletion of past sins, not for impunity in their perpetual commission. And such persons, indeed, as decline to abandon their evil habits of life for a better course cannot be said to do charitable deeds. For this is the purport of the saying, \"Inasmuch as ye did it not to one of the least of these, ye did it not to me.\" He shows them that they do not perform charitable actions even when they think they are doing so. For if they gave bread to a hungering Christian because he is a Christian, assuredly they would not deny to themselves the bread of righteousness, that is, Christ Himself; for God considers not the person to whom the gift is made, but the spirit in which it is made."
