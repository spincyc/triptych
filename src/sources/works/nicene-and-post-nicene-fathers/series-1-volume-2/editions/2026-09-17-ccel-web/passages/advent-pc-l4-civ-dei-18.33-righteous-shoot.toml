physical_line_ranges = [[32718, 32730]]
text = "Also in another place he says, \"This is my God, and there shall none other be accounted of in comparison of Him; who hath found out all the way of prudence, and hath given it to Jacob His servant, and to Israel His beloved: afterwards He was seen on the earth, and conversed with men.\" Some attribute this testimony not to Jeremiah, but to his secretary, who was called Baruch; but it is more commonly ascribed to Jeremiah. Again the same prophet says concerning Him, \"Behold the days come, saith the Lord, that I will raise up unto David a righteous shoot, and a King shall reign and shall be wise, and shall do judgment and justice in the earth. In those days Judah shall be saved, and Israel shall dwell confidently: and this is the name which they shall call Him, Our righteous Lord.\""
