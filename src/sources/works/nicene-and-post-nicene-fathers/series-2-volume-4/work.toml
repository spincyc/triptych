description = "The fourth volume of the second series of the Nicene and Post-Nicene Fathers translation anthology, containing select works and letters of Athanasius of Alexandria in English, edited with prolegomena by Archibald Robertson, among them his own translation of the treatise On the Incarnation of the Word. Its container identity remains distinct from the works and translated editions printed within it."
