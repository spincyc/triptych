notes = "Registered 2026-11-19 from the title page of the hashed facsimile (PDF page 5, read on the image), which reads Volume IV. St. Athanasius: Select Works and Letters. New York: The Christian Literature Company. Oxford and London: Parker & Company. 1892, and its verso (PDF page 6), which reads Copyright, 1892, by The Christian Literature Company. Archibald Robertson is the volume's special editor (half-title, PDF page 11). Only his translation of On the Incarnation of the Word is named as a translator here: the introduction to that treatise (text layer, PDF page 131) says the translation is the one printed in 1885 by the present translator, and the volume's other works carry translators of their own that this record does not enumerate. The treatise runs from printed page 36 (PDF page 132); in it printed page n is PDF page n+96 (printed 40 is PDF 136; printed 65 is PDF 161)."
