physical_line_ranges = [[1, 3]]
text = "And if they be human, let him scoff; but if they are not human, but of God, let him recognise it, and not laugh at what is no matter for scoffing; but rather let him marvel that by so ordinary a means things divine have been manifested to us, and that by death immortality has reached to all, and that by the Word becoming man, the universal Providence has been known, and its Giver and Artificer the very Word of God. For He was made man that we might be made God; and He manifested Himself by a body that we might receive the idea of the unseen Father; and He endured the insolence of men that we might inherit immortality. For while He Himself was in no way injured, being impassible and incorruptible and very Word and God, men who were suffering, and for whose sakes He endured all this, He maintained and preserved in His own impassibility."
