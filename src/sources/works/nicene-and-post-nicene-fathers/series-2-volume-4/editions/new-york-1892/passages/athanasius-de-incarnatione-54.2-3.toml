notes = "Robertson's footnote 5 to made God gives the Greek θεοποιηθῶμεν and compares Irenaeus IV. xxxviii. 4 (non ab initio dii facti sumus ...), with cf. ib. praef. 4 fin. and V. ix. 2, judging Athanasius here closer to Irenaeus than to Origen. The famous sentence For He was made man that we might be made God is 54.3 in this numbering."
