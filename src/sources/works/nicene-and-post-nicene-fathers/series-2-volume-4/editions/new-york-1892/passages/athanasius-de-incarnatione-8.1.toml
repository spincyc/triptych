text = "For this purpose, then, the incorporeal and incorruptible and immaterial Word of God comes to our realm, howbeit he was not far from us before. For no part of Creation is left void of Him: He has filled all things everywhere, remaining present with His own Father. But He comes in condescension to shew loving-kindness upon us, and to visit us."
