context = "Section 8, subsections 2-3, of On the Incarnation of the Word, printed page 40 (PDF page 136), from He took pity at the head of the right column to in it dwelling. The sentence opens at the foot of the left column with subsection 2 (And seeing the race of rational creatures in the way to perish ... and seeing, lastly, how all men were under penalty of death: He), and subsection 3 begins at For He did not simply will."
physical_line_ranges = [[1, 5]]
text = "He took pity on our race, and had mercy on our infirmity, and condescended to our corruption, and, unable to bear that death should have the mastery—lest the creature should perish, and His Father’s handiwork in men be spent for nought—He takes unto Himself a body, and that of no different sort from ours. For He did not simply will to become embodied, or will merely to appear. For if He willed merely to appear, He was able to effect His divine appearance by some other and higher means as well. But He takes a body of our kind, and not merely so, but from a spotless and stainless virgin, knowing not a man, a body clean and in very truth pure from intercourse of men. For being Himself mighty, and Artificer of everything, He prepares the body in the Virgin as a temple unto Himself, and makes it His very own as an instrument, in it manifested, and in it dwelling."
