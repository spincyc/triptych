notes = "The CCEL text of the same volume (edition english-npnf8-ccel-web-2026-09-05, passage 37.13, lines 11319-11329) agrees in wording, spelling and punctuation; the page prints typographic quotation marks and apostrophes where CCEL has straight ones, and superscript footnote numbers 1 and 2 (Matt. vi. 6; 1 Thess. v. 17) where CCEL has bracketed markers [981]-[982]; the markers are omitted here. A spot under the comma after body on the page is not a printed mark. TRANSLATOR: the volume's Advertisement (printed pages ix-x) assigns the Psalms after the thirtieth in the first Oxford volume, and part of the second volume, to the Rev. J. E. Tweed, and only a few Psalms at the end of the second volume to T. Scratton. It does not say where the first volume ends, but Psalm 37 falls to Tweed whether it closed the first volume or opened the second; this is a derivation from the Advertisement, not a credit printed beside the Psalm. The wording printed here is Coxe's condensation of that translation. The 1956 Eerdmans reprint (Internet Archive selectlibraryofn08auguuoft) was not used."
