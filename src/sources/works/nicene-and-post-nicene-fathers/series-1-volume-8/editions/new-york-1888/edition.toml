notes = "Identified from the page images of Internet Archive item expositionsonboo0000augu, read on 2026-11-18. The series title page (PDF page 7) reads A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church. Edited by Philip Schaff ... Volume VIII. Saint Augustin: Expositions on the Book of Psalms. Translated, with Notes and Indices. New York: The Christian Literature Company. 1888. Its verso (PDF page 8) reads Copyright, 1888, by the Christian Literature Company. The volume title page (PDF page 9) reads Expositions on the Book of Psalms. By Saint Augustin, Bishop of Hippo. Edited, with brief annotations, and condensed from the six volumes of the Oxford translation, by A. Cleveland Coxe, D.D. The English is therefore an abridgment, by Coxe, of the Library of the Fathers translation (Oxford, 1847-1857), not a new translation. TRANSLATORS, as the volume's Advertisement (printed pages ix-x, PDF pages 15-16, read on the images) reports them: Psalms 1-30 by 'a friend who conceals his name' (unnamed, so not listed); the remainder of the first Oxford volume and part of the second by the Rev. J. E. Tweed of Christ Church; the third Oxford volume (to Psalm 75) with a few Psalms at the end of the second and the beginning of the fourth by T. Scratton of Christ Church; the fifth by the Rev. H. M. Wilkins of Merton College; the sixth completed by the Rev. H. Walford of St. Edmund Hall after Marriott's death. The Advertisement does not give the volume boundaries, so a Psalm's individual translator is derived from them only where the passage record says so. Internet Archive item selectlibraryofn08auguuoft is the 1956 Eerdmans photolithoprinted reprint (title page PDF page 5), not this printing; selectlibraryofn08scha is second-series volume VIII (Basil, 1895) and selectlibraryofn0008unse a Hendrickson reprint. None of them is registered here. The CCEL digital text of the same volume is registered separately under Augustine's work as edition.augustine.enarrationes-in-psalmos.english-npnf8-ccel-web-2026-09-05."
