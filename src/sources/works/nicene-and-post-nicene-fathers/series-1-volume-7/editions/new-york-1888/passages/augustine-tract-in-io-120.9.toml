context = "Augustine's refusal of the reading that the beloved disciple believed in the Resurrection, read on printed page 436 rendered from the hashed facsimile. Sections 7 and 8 of the same tractate, including Augustine's declining to expound the cloths, and the heading of Tractate CXXI lower on the same page, were read with it so that the passage boundary is explicit."
physical_line_ranges = [[1, 4]]
text = "Then went in also that other disciple who had come first to the sepulchre. He came first, and entered last. This also of a certainty is not without a meaning, but I am without the leisure needful for its explanation. And he saw, and believed. Here some, by not giving due attention, suppose that John believed that Jesus had risen again; but there is no indication of this from the words that follow. For what does he mean by immediately adding, For as yet they knew not the scripture, that He must rise again from the dead? He could not then have believed that He had risen again, when he did not know that it behoved Him to rise again. What then did he see? what was it that he believed? What but this, that he saw the sepulchre empty, and believed what the woman had said, that He had been taken away from the tomb?"
