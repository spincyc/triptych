text = "Would it not have seemed to you that a herald would have cried, “Go away, make room.” Instead of the herald’s cry “Go away,” John says “Come.” The herald makes men stand back from the judge; to the Judge John calls. Yes, indeed, John calls men to the lowly One, that they may not experience what He will be as the exalted Judge."
