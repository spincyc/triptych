text = "You have very often heard, holy brethren, and you know well, that John the Baptist, in proportion as he was greater than those born of women, and was more humble in his acknowledgment of the Lord, obtained the grace of being the friend of the Bridegroom; zealous for the Bridegroom, not for himself; not seeking his own honor, but that of his Judge, whom as a herald he preceded. Therefore, to the prophets who went before, it was granted to predict concerning Christ; but to this man, to point Him out with the finger. For as Christ was unknown by those who did not believe the prophets before He came, He remained unknown to them even when present. For He had come humbly and concealed from the first; the more concealed in proportion as He was more humble: but the people, despising in their pride the humility of God, crucified their Saviour, and made Him their condemner."
