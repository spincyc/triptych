context = "Printed pp. 390–392 (PDF pages 412–414) were visually inspected through the chapter-21 boundary. Philostratus narrates Apollonius identifying a demon as the cause of a youth's conduct, addressing it, demanding departure and a visible sign, and the youth's subsequent changed behavior. This verifies Conybeare's dated translation of a literary-biographical episode, not the event, diagnosis, causation, efficacy, historicity of the sign, standard practice, payment, an operational sequence, dependence on or influence upon Christian texts, or continuity with Christian ritual."
verified_on = "2026-07-27"
notes = "No commands or procedural formula are transcribed. The work was written well after the narrated setting, and source criticism of Philostratus's account remains a separate research question."
