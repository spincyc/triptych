context = "The complete chapter was read in the hashed Bywater TEI and its rendered Bekker-page context. Aristotle asks whether continence means abiding by any belief and choice or specifically by true reason and right choice; he then distinguishes continence from strong-headed refusal to yield to reason and recognizes that abandoning a resolution can be right."
