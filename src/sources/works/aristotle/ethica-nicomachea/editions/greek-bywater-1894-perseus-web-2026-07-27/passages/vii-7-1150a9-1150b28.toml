context = "The complete chapter was read in the hashed Bywater TEI and its rendered Bekker-page context. It distinguishes the person overcome by pleasure from the person overcome by pain, contrasts endurance with continence, and bounds softness by ordinary rather than extraordinary resistance while expressly identifying nature and illness as distinct cases."
verified_on = "2026-07-27"
notes = "No transcription is registered because the controlling artifact is remote. The inspected Greek terms are malakos and malakia for softness, karterikos and karterein for endurance, antechein for resisting, and kratein for mastering. They are not themselves an identification with Aquinas's later Latin taxonomy."
