description = "Aristotle's treatise on persuasion in three books, addressed by book, chapter, and the section numbering of modern editions, and cross-referenced by Bekker page. Book 1 chapter 10, on wrongdoing, contains the distinction between corrective punishment (kolasis) and retributive vengeance (timoria) that later lexical arguments about the New Testament word kolasis appeal to."
