notes = "Uncorrected optical text of the whole volume in Zimmern's translation. Running heads and page numbers survive and fix aphorism 87 at printed p. 88, where the English reads \"St. Luke xviii. 14, Improved. - He that humbleth himself wishes to be exalted.\" -- the Authorized Version's clause with one verb changed. 16685 LF-terminated lines. Extent as measured by the retrieving lane: complete Internet Archive OCR text of the 1910 T. N. Foulis edition of Human, All-Too-Human Part I in Helen Zimmern's translation, title page through the end of the volume; running heads and page numbers survive in the OCR and were used to fix the page of aphorism 87 QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE: it is uncorrected recognition, and a raw-line negative over it cannot exclude a differently recognised spelling."
