notes = "The title page was read in the optical text registered here and gives \"HUMAN, ALL TOO HUMAN: A BOOK FOR FREE SPIRITS. PART I. TRANSLATED BY HELEN ZIMMERN, WITH INTRODUCTION BY J. M. KENNEDY. T. N. FOULIS, 13 & 15 FREDERICK STREET, EDINBURGH AND LONDON, 1910\", with \"All rights reserved\" beneath -- a formula of the period rather than a live claim. THIS EDITION IS THE ENGLISH HALF OF THE PAIR: the German of the same volume is registered on this work at edition.friedrich-nietzsche.menschliches-allzumenschliches.gutenberg-ebook-7207, and neither stands in for the other -- the retrieving lane's finding turns on a single modal verb, which is exactly the kind of thing a translation can move."
