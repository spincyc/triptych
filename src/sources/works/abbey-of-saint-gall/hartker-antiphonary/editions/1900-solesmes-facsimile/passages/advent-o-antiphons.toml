context = "On manuscript p. 40 (PDF p. 94), the first six titles are Sapientia, Adonay, Radix Iesse, Clavis David, Oriens and Rex gentium. Page 41 (PDF p. 95) begins with Emmanuel, then Virgo virginum, Gabriel, Rex pacifice, Mundi domina and Hierusalem. The eighth speaks to the Virgin and then addresses the daughters of Jerusalem. Neither page assigns individual dates to the chants."
notes = "Reacquired the registered complete 1900 facsimile, checked its SHA-256, then read both physical pages, including their pagination, successive initials and the eighth antiphon's question and answer. The Saint Gall Benedictine use and late tenth-century dating are also catalogued by Cantus (source 123717, chant 456197). No image or continuous text from either the complete modern delivery or the Cantus transcription is reproduced here."
