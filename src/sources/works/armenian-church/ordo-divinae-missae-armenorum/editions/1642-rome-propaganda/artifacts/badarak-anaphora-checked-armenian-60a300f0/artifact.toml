transformation = "Unicode NFC Classical Armenian (Grabar, language tag hy per repository convention) read directly from 260–450 DPI PNG renders of the Armenian column of the tracked 1642 facsimile PDF.; Standard Armenian scribal/typographic պատիւ (overline/titlo) abbreviations are expanded to full Classical Armenian words strictly matching 1642's own unabbreviated orthography (using աւ in աւրհնէ/աւրհնեաց/աւրհնեալ/աւրհնեմք where unabbreviated forms use աւ, and օ where printed as օ such as զօրութիւն, հօտի): ա̄ծ → աստուած, ա̄ծային → աստուածային, Ա̄ծոյ → Աստուծոյ, ա̄ծապէս → աստուածապէս, Յա̄ծածնէն → Յաստուածածնէն, տ̄ր/Տ̄ր → տէր/Տէր, տ̄ն/տ̄նէ → տեառն/տեառնէ, ս̄բ/Ս̄բ → սուրբ/Սուրբ, Յ̄սի → Յիսուսի, ք̄սի → քրիստոսի, ա̄հէ/ա̄հնեաց/ա̄հեմք → աւրհնէ/աւրհնեաց/աւրհնեմք, ամ̄/ամենա̄ → ամենայն, վ̄սն/Վ̄սն → վասն/Վասն, զօրութի̄ → զօրութիւն, տուչութբ̄ → տուչութեամբ, հրամանատրութե̄ → հրամանատրութեան, միութե̄մբ → միութեամբ, ասլվ̄ → ասելով, զա̄ղս → զաղօթս, շնորհե̄ց → շնորհեաց, յառ̄ջ → յառաջ, Դպ̄րքն → Դպիրքն.; Printed crosses are preserved at exact source position as ✠ (ձե✠զ on printed p. 70).; Authentic 1642 orthography, epenthetic ը spellings (բանիւըդ, բանըդ, տընտեսութեամբ, բընակիլ, ըզ, ըսփոփեցեր, մըխեսցէ, ըսպասաւորս, խընդրեմք, ՎԱՍԸՆ), uppercase Institution display text, and compositor typos verified at 360–450 DPI are preserved verbatim: զերկինըս (for զերկիրս) and պարսնն (p. 71), ճշմատապէս (for ճշմարտապէս, p. 72), ճանպրհորդեաց (p. 73), ՆՈՐՈՑ (for ՆՈՐՈՅ, p. 75), Տեառըդ (p. 78), and աւրհնեաբ (for աւրհնեալ, p. 79).; Words broken across column lines are joined; facing Latin column, catchwords, signatures (K, K 2), decorative asterisks, and page numbers are excluded.; Independent V1 collation at 450 DPI additionally confirmed abbreviation վխ̄ճան → վախճան (p. 73), uppercase Ա̄ծ → Աստուած (p. 77), page-break dittography of և at pp. 73–74 (collapsed to single և), authentic spellings մէզ (p. 71) and երկրպագեսցուք. (p. 79), and line-break compositor typo գոահանամք (p. 77)."
notes = "Core Classical Armenian (Grabar) Anaphora of the Armenian Divine Liturgy (Badarak) from the priest's opening Trinitarian blessing rubric and greeting (Քահանայն աւրհնէ զժողովուրդն... Շնորհք սէր և սրբարար աստուածային զօրութիւն...) at printed p. 70 (PDF p. 82) through the Sanctus, Post-Sanctus, Institution Narrative (including Հայր երկնաւոր), Anamnesis and Oblation, and the complete Epiclesis concluding with Որպէս զի եղիցի... և ի թողութիւն մեղաց։ Դպիրքն. Ամէն։ at printed p. 80 (PDF p. 88), immediately before the post-epiclesis general intercessions (Սովաւ շնորհեա՛ զսէր...). Preserves the exact provider PDF page ordering where printed pp. 77–80 (PDF pp. 85–88) precede printed pp. 73–76 (PDF pp. 89–92), while ordering transcribed units in true liturgical/printed sequence (pp. 70–80). Excludes the parallel Latin column on the same pages, all pre-Anaphora and post-Epiclesis sections, and page furniture."
