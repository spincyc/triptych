context = "Core Classical Armenian (Grabar) Anaphora of the Armenian Divine Liturgy (Badarak) from the priest's opening Trinitarian blessing rubric and greeting (Քահանայն աւրհնէ զժողովուրդն... Շնորհք սէր և սրբարար աստուածային զօրութիւն...) at printed p. 70 (PDF p. 82) through the Sanctus, Post-Sanctus, Institution Narrative (including Հայր երկնաւոր), Anamnesis and Oblation, and the complete Epiclesis concluding with Որպէս զի եղիցի... և ի թողութիւն մեղաց։ Դպիրքն. Ամէն։ at printed p. 80 (PDF p. 88), immediately before the post-epiclesis general intercessions (Սովաւ շնորհեա՛ զսէր...). Preserves the exact provider PDF page ordering where printed pp. 77–80 (PDF pp. 85–88) precede printed pp. 73–76 (PDF pp. 89–92), while ordering transcribed units in true liturgical/printed sequence (pp. 70–80). Excludes the parallel Latin column on the same pages, all pre-Anaphora and post-Epiclesis sections, and page furniture."
notes = "Independently verified complete bounded constituent extent against tracked facsimile by independent-collator-v1-byz-arm on 2026-11-25. Whole-book completeness is not claimed."
