notes = "96 of 96 pages in the provider roster. Latin Codex: artifact pages 1–40 (title PP 1, final printed p. 37 on RA 1-PP 1 at artifact page 39, following blank RA 1-PP 2). Armenian Lyturgia: pages 41–66 (RA 1-PP 3–RA 1-PP 28). Ministerium: pages 67–96 (RA 1-PA 1–RA 1-PA 30). No missing or failed roster IDs. These are three complementary bound works, not 96 pages of the Latin title alone. Physical-volume completeness is unverified. Title and stated boundary images were inspected; acquisition and structural integrity do not imply full textual reading. No OCR or transcription is included. Original .jpg filenames may contain PNG bytes, identified explicitly in sequence.json. Google digitizer attribution is retained on the image feet; no additional Google front-matter page is inserted or counted as part of the historical work. The package is a deterministic project assembly of exact acquired image bytes, not a provider-supplied ZIP. Each image remains byte-identical to acquisition; ZIP_STORED is used and every member has a SHA-256 in sequence.json. All 332 retained source images passed declared byte-size and SHA-256 verification. Independent Poppler extraction recovered 251 JPEG streams byte-identically and 81 PNG images with decoded pixels identical to their exact originals across the three PDF derivatives; artifact page counts matched 148,96 and 88."
