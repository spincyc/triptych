notes = "Exact offered witness: Fundamental Scientific Library, Yerevan, Armenia, A/711; British Library EAP180/1/1/12. The Latin title and MDCLXXVII imprint are directly visible at frame 2. The initial liturgy ends at printed p. 19; an unnumbered blank follows, then correction matter at pp. 21–30, with Latin headings at 21 (Officii Divini) and 25 (Hymnorum). The separate 18-frame photographic sequence includes cover, blank areas and source-copy damage. Distinct page setting from the existing 20-page Armenian Lyturgia in the 96-page Google bound-volume artifact: different pp. 8 and 10 and component endings. Both titles read 1677; no canonical date correction or word-level equivalence is inferred. This is a bounded setting/copy identification, not a qualified Armenian textual collation, physical-volume completeness certificate, liturgical approval or historical ancestry claim."
