notes = "Unicode NFC Classical Armenian (Grabar, language tag hy per repository convention) read directly from 240–450 DPI PNG renders of the tracked 1823 facsimile PDF.; Standard Armenian scribal/typographic պատիւ (overline/titlo) abbreviations are expanded to full Classical Armenian words strictly matching 1823's own unabbreviated orthography (using օ in օրհնեալ/օրհնեմք/զօրութիւն): ա̄ծ/ա̄ծային/ա̄ծապէս/ա̄ծութեդ/Ա̄յ/յա̄ծածին/զա̄ծդ → աստուած/աստուածային/աստուածապէս/աստուածութեանդ/Աստուծոյ/յաստուածածին/զաստուածդ, տ̄ր/տ̄ն/տ̄նդ → տէր/տեառն/տեառնդ, ս̄բ/Ս̄Բ monogram → սուրբ/Սուրբ, յ̄սի ք̄սի → յիսուսի քրիստոսի, զօրութի̄/քաւութի̄/թողութի̄/խաղաղութի̄/յանդատապարտութի̄ → զօրութիւն/քաւութիւն/թողութիւն/խաղաղութիւն/յանդատապարտութիւն, բնութբ̄/սրբասացութբ̄/տուչութբ̄/միաւորութբ̄ → բնութեամբ/սրբասացութեամբ/տուչութեամբ/միաւորութեամբ, տընտեսութե̄/փրկութե̄ → տընտեսութեան/փրկութեան, յազգակցութէ̄ → յազգակցութենէ, Սրկգ̄ն → Սարկաւագն, Ժղվրդ̄ն → Ժողովուրդն.; Unabbreviated liturgical incipit truncations (without պատիւ overline, such as երկիրպագես։ on p. 52, ՚Ի վեր ընծայեցուցէք։, Եւ գոհացարուք։, Սուրբ սուրբ սուրբ տէր զօրութեանց, լի են երկինք և երկիր։, Յամենայնի օրհնեալ ես։) are preserved strictly as printed without supplying unprinted words.; Printed crosses are preserved at exact source positions as ✠ (10 occurrences across pp. 46, 50, and 52: 1 in opening rubric, 2 in Օրհ✠նեաց, 1 in Խաղաղութիւն ✠ ամենեցուն, and 7 in Epiclesis օրհ✠նեալ clauses). Preposed classical apostrophe ՚ի is preserved as printed.; Words broken across line breaks are joined; page numbers, signature marks, woodcut ornament, the p. [48] Crucifixion engraving (classified as non-text), and italic/upright/bold font distinctions are excluded from the plain-text stream.; Independent V1 collation at 450 DPI unified lowercase հ readings in Venetian Mekhitarist bolorgir (հօր, հոգւոյն, հայր, հոգւովդ — visually distinct from uppercase Հ as in Համբերելով on p. 80) and restored printed shesh accent in գոհացարո՛ւք։ (p. 46)."
