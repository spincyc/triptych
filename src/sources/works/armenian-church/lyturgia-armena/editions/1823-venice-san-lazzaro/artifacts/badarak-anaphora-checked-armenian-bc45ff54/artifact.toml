transformation = "Unicode NFC Classical Armenian (Grabar, language tag hy per repository convention) read directly from 240–450 DPI PNG renders of the tracked 1823 facsimile PDF.; Standard Armenian scribal/typographic պատիւ (overline/titlo) abbreviations are expanded to full Classical Armenian words strictly matching 1823's own unabbreviated orthography (using օ in օրհնեալ/օրհնեմք/զօրութիւն): ա̄ծ/ա̄ծային/ա̄ծապէս/ա̄ծութեդ/Ա̄յ/յա̄ծածին/զա̄ծդ → աստուած/աստուածային/աստուածապէս/աստուածութեանդ/Աստուծոյ/յաստուածածին/զաստուածդ, տ̄ր/տ̄ն/տ̄նդ → տէր/տեառն/տեառնդ, ս̄բ/Ս̄Բ monogram → սուրբ/Սուրբ, յ̄սի ք̄սի → յիսուսի քրիստոսի, զօրութի̄/քաւութի̄/թողութի̄/խաղաղութի̄/յանդատապարտութի̄ → զօրութիւն/քաւութիւն/թողութիւն/խաղաղութիւն/յանդատապարտութիւն, բնութբ̄/սրբասացութբ̄/տուչութբ̄/միաւորութբ̄ → բնութեամբ/սրբասացութեամբ/տուչութեամբ/միաւորութեամբ, տընտեսութե̄/փրկութե̄ → տընտեսութեան/փրկութեան, յազգակցութէ̄ → յազգակցութենէ, Սրկգ̄ն → Սարկաւագն, Ժղվրդ̄ն → Ժողովուրդն.; Unabbreviated liturgical incipit truncations (without պատիւ overline, such as երկիրպագես։ on p. 52, ՚Ի վեր ընծայեցուցէք։, Եւ գոհացարուք։, Սուրբ սուրբ սուրբ տէր զօրութեանց, լի են երկինք և երկիր։, Յամենայնի օրհնեալ ես։) are preserved strictly as printed without supplying unprinted words.; Printed crosses are preserved at exact source positions as ✠ (10 occurrences across pp. 46, 50, and 52: 1 in opening rubric, 2 in Օրհ✠նեաց, 1 in Խաղաղութիւն ✠ ամենեցուն, and 7 in Epiclesis օրհ✠նեալ clauses). Preposed classical apostrophe ՚ի is preserved as printed.; Words broken across line breaks are joined; page numbers, signature marks, woodcut ornament, the p. [48] Crucifixion engraving (classified as non-text), and italic/upright/bold font distinctions are excluded from the plain-text stream.; Independent V1 collation at 450 DPI unified lowercase հ readings in Venetian Mekhitarist bolorgir (հօր, հոգւոյն, հայր, հոգւովդ — visually distinct from uppercase Հ as in Համբերելով on p. 80) and restored printed shesh accent in գոհացարո՛ւք։ (p. 46)."
notes = "Core Classical Armenian (Grabar) Anaphora of the Armenian Divine Liturgy (Badarak) from the priest's opening Trinitarian blessing rubric and greeting (Քահանայն դարձցի և խաչակնքեսցէ ✠ ՚ի վերայ ժողովրդեանն, և ասասցէ։ Շնորհք, սէր, և աստուածային սրբարար զօրութիւն...) at printed p. 46 (PDF p. 50) through the Preface, Sanctus incipit (p. 47 / PDF p. 51; excluding the intervening full-page Crucifixion engraving at unnumbered p. [48] / PDF p. 52 as non-text), Post-Sanctus and Institution Narrative (pp. [49]–50 / PDF pp. 53–54), Anamnesis and Oblation (pp. 51–52 / PDF pp. 55–56), and the complete Epiclesis (triple past-tense արարեր blessings, combined փոխարկելով blessing, rubric, and concluding ekphonesis Որպէս զի եղիցի սա... ՚ի թողութիւն մեղաց։) at printed p. 53 (PDF p. 57), immediately before the post-epiclesis general intercessions (Սովաւ շնորհեա՛ զսէր...). Uses the exact same 6 canonical native_path slugs as armenian-1642-badarak-anaphora for 1-to-1 collation."
