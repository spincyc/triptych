description = "A large subscription county history of the northern Wisconsin counties published at Chicago in 1881, with narrative county sections and extensive biographical sketches. Used by the consuming publication only as a bounded negative-search corpus for the absence of any mention of Adele Brise or the Robinsonville chapel; the single occurrence of 'Robinsonville' in the volume is in a Fort Howard biographical sketch and refers to a school under the care of the Winnebago Presbytery."
