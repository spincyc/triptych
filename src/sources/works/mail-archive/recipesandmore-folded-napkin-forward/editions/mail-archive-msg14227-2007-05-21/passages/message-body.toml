context = "The archived message, read in full in the retrieved page. It carries the claim in the standard wording: the folded napkin had to do with the Master and Servant, every Jewish boy knew this tradition, the wadded napkin meant I'm done, and the folded napkin meant I'm coming back. Registered as the earliest independently archived instance located and therefore as a dated lower bound on the claim's circulation."
notes = "The scriptural text the message quotes at John 20:7 reads that the cloth was folded up and lying to the side, which is a modern version's wording and not that of the King James or Douay-Rheims translations from which the word napkin comes."
