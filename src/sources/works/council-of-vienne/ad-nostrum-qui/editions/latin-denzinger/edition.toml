notes = "A catalog-level identification of the conventional received Latin text of the errors and censure. Denzinger prints the listed propositions as condemned errors, not as teaching; consumers must not quote a listed proposition as a doctrinal statement. No exact artifact of a printed Denzinger edition is retained or hashed. The 1312 conciliar act is public domain; particular printed editions of Denzinger retain their own editorial rights."
