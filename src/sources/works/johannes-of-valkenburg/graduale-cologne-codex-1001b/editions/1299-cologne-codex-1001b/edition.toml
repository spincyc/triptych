notes = "The holding library's complete catalog describes 321 leaves and transcribes the dated colophon: 'Ego frater Johannes de Valkenburg scripsi et notavi et illuminavi istud graduale et complevi anno Domini millesimo ducentesimo LXXXX nono.' Registration searched the local source library for 'Valkenburg', 'Graduale des Johannes von Valkenburg', and 'John of Valkenburg' and found no existing record or translation. The receipts supplied Latin folios and German catalog metadata but no English translation; this registration stage does not retrieve new sources, so no English edition is registered or claimed."
