notes = "Complete optical text of the volume, prefatory matter through indices, covering every tractate the volume prints: Psalms 1, 2, 9, 13, 14, 51-69, the title of 91, and 118-150. The tractate on the title of Psalm 91 is complete within it. Measured absence, bounded to this volume: it prints no tractate on Psalm 39 and none on Psalm 85, so two of the four psalms appointed in this formulary cannot be answered from it. Uncorrected optical character recognition. Not retained: the Internet Archive's own optical-character-recognition derivative, because no grant covering that derivative was established. A reader without the network cannot open this file from a checkout; the underlying printing is public domain and may be re-derived from the same Internet Archive item, and the wording a claim depends on must be quoted into the claim's own passage record."
