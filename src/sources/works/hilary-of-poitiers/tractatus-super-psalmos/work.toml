title = "Tractatus super Psalmos"
responsible = "Hilary of Poitiers"
work_type = "patristic-psalm-exposition-collection"
composed = "c. 364-367"
composed_basis = "Written after Hilary's return from exile in the East and dependent on Origen's psalm exegesis, which places the collection in the last years before his death in 367. The date is the writing, not Zingerle's 1891 edition."
alternate_titles = ["Tractatus in Psalmos", "Homilies on the Psalms", "Commentarii in Psalmos"]
languages = ["la"]
locus_pattern = '(?:1|2|9|1[34]|5[1-9]|6[0-9]|9[01]|11[89]|1[2-4][0-9]|150)\.(?:[1-9]|[1-9][0-9])(?:-(?:[1-9]|[1-9][0-9]))?'
description = "Hilary's expositions of the Psalms, surviving incomplete. The manuscript tradition preserves tractates on Psalms 1, 2, 9, 13, 14, 51-69, the title of Psalm 91, and 118-150; it carries none on Psalms 39 or 85, so those appointed psalms cannot be answered from the collection at all. The tractate on Psalm 91 treats the psalm's title only, arguing that the sabbath it names is not the seventh day of Genesis. A locus is Vulgate psalm number followed by the numbered section."
