notes = "Identified from the page images of Internet Archive item sacrorumconcilio0003phil (scanned at cebu), read on 2026-11-18: the title page (PDF p. 9) reads ... TOMUS TERTIUS. Ab anno CCCXLVII. ad annum CCCCIX. / FLORENTIAE / MDCCLIX / EXPENSIS ANTONII ZATTA VENETI, with the footer naming Welter's reprint (Paris, 1901); the facing leaf (PDF p. 8) reads REPRODUCTION EN FAC-SIMILE TIREE A 250 EXEMPLAIRES ... C. REINECKE, A BERLIN, POUR H. WELTER ... PARIS ET A LEIPZIG ... 1901. Volume III carries, among the councils of 347-409, the Council of Saragossa (Concilium Caesaraugustanum, aera 418 = A.D. 380) at coll. 633-636, PDF pp. 335-336."
