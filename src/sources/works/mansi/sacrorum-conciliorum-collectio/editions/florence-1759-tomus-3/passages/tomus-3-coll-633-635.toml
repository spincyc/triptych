notes = "Read on the page images. The italic letters a-e and k-l before the heading lines and the canon are Mansi's footnote and source markers and are omitted; footnotes 1 and 2 at the foot of col. 633-634 (Harduinus on the Isidorian collection and the Paris Jesuit codex) are not transcribed. The Mansi locus pattern allows one column range; the extent runs from the heading at col. 633 to the close of canon IV at col. 635. The text layer reads 'nullt' for 'nulli' and splits the columns. Hefele II p. 293 summarises this canon (passage of that edition)."
