context = "Council of Saragossa (Caesaraugustanum, aera 418 = A.D. 380), against the Priscillianists: the heading and titulus IV (col. 633) and canon IV (coll. 634-635), forbidding absence from church on the twenty-one days from 17 December (a 16. Kalendas Januarii) to Epiphany. The marginal variants key to 'Viginti & uno' and to 'his decretis'."
physical_line_ranges = [[1, 8]]
text = "CONCILIUM CÆSARAUGUSTANUM DUODECIM EPISCOPORUM, SUB DAMASO, contra Priscillianistas celebratum: æra CDXVIII. IV. Ut tribus hebdomadis, quæ sunt ante Epiphaniam ab ecclesia nemo recedat. IV. Item legit: Viginti & uno die, quo a 16. Kalendas Januarii usque in diem Epiphaniæ, quæ est 8. Idus Januarii, continuis diebus, nulli liceat de ecclesia se absentare, nec latere in domibus, nec secedere ad villam, nec montes petere, nec nudis pedibus incedere, sed concurrere ad ecclesiam. Quod qui non observaverit, his decretis anathema sit in perpetuum. Ab universis episcopis dictum est: Anathema sit. vicesimo & primo. de suspectis al. susceptis."
