notes = "The introductory note at printed p. 160 identifies Dods and Reith as the translators. The translated apology itself runs from printed p. 163 through the conclusion on p. 186; the preceding introduction and the appended imperial epistles are not part of the constituent segments. Coxe's American introductory and bracketed editorial matter remains distinct from Justin's text. The edition's discussion of the conventional First and Second Apologies records a disputed literary relation without resolving it."
