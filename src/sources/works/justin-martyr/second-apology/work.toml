description = "The shorter apology transmitted under Justin's name, addressed to the Roman senate, conventionally divided into fifteen chapters. Its relation to the First Apology is disputed among editors, some treating it as an appendix to that work rather than an independent piece, and the chapter order differs between the principal manuscript and some modern editions."
