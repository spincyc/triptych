description = "Bellarmine's verse-by-verse exposition of the Psalms. The 1866 English expression is materially abridged by its translator, who says that he omitted philological discussion, variant readings, and Bellarmine's individual Psalm prefaces; claims drawn from that expression must not be represented as controlling the complete Latin work."
