context = "Bellarmine receives the opening address as grateful recollection before fresh petition: amid many dangers, God's people have found in him not occasional shelter but a secure refuge from generation to generation. He develops that refuge as continual dwelling in God through faith, hope, charity, recollection, and desire."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF pages 287-288, corresponding to printed pages 277-278; the exact local PDF hash-matched the registered remote artifact before image inspection. O'Sullivan replaced Bellarmine's individual Psalm prefaces with Douay headings, and this printed heading omits the Vulgate superscription 'A prayer of Moses, the man of God'; this passage therefore verifies Bellarmine's received commentary on verse 1, not any claim about his treatment of Mosaic attribution in the suppressed preface. The 1866 English translation is expressly abridged: O'Sullivan also says that he omitted Bellarmine's philological and versional discussions. No transcription is recorded."
