context = "Bellarmine reads the psalm of one under grievous affliction as agreeing to Christ in his Passion, and concretizes the Alleluia verse's day and night into Good Friday and Gethsemane: he did so on the day of his passion, when he cried on the cross, My God, my God, why hast thou forsaken me? and on the night before, when he thrice cried out in the garden. Later Christian reception of the Alleluia's verse."
