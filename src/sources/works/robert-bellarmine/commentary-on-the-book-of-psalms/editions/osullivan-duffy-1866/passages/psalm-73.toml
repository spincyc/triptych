context = "Bellarmine places the lament principally under Antiochus Epiphanes and the Maccabean persecution, while explaining that the opening question does not assert a fixed divine rejection. The closing petitions call cruel persecutors beasts, invoke the covenant and the oppressed people, make the people's cause God's own because the reproach falls upon him, and ask that the enemies' continuing pride not pass unpunished."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF pages 232-233 and 235-236, corresponding to printed pages 222-223 and 225-226; the exact local PDF hash-matched the registered remote artifact before image inspection. The 1866 English translation is expressly abridged: O'Sullivan says that he omitted Bellarmine's philological and versional discussions and replaced Bellarmine's individual Psalm prefaces with Douay headings. No transcription is recorded."
