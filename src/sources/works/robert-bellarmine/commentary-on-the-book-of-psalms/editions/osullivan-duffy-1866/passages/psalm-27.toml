notes = "Read directly in artifact PDF pages 78-79, corresponding to printed pages 68-69; the exact local PDF hash-matched the registered remote artifact before image inspection. The 1866 English translation is expressly abridged: O'Sullivan says that he omitted Bellarmine's philological and versional discussions and replaced Bellarmine's individual Psalm prefaces with Douay headings. No transcription is recorded."
