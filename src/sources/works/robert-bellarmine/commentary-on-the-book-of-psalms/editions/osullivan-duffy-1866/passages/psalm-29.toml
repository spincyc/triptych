context = "Bellarmine first reads David's exaltation and healing in his deliverance and kingship, then reads the same speech prophetically in Christ and in the elect: abasement gives way to resurrection, immortality, and the heavenly kingdom. His explanation of the cry and healing joins literal deliverance from danger to Christ's rising and the saints' final salvation."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF pages 83-84, corresponding to printed pages 73-74; the exact local PDF hash-matched the registered remote artifact before image inspection. The printing omits the Vulgate superscription numbered as verse 1 and numbers 'I will extol thee' and 'O Lord my God, I have cried' as verses 1-2, one lower than their Vulgate loci. The 1866 English translation is expressly abridged: O'Sullivan says that he omitted Bellarmine's philological and versional discussions and replaced Bellarmine's individual Psalm prefaces with Douay headings. No transcription is recorded."
