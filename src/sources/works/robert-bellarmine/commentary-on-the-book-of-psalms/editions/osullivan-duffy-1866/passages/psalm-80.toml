context = "Bellarmine treats the opening summons as cheerful praise flowing from love and desire, directed to God the helper and God of Jacob. He receives the psalm, timbrel, psaltery, harp, and trumpet as the appointed instruments of solemn thanksgiving, commanded in Israel so that God's benefits, especially deliverance from Egypt, remain in memory."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF pages 256-257, corresponding to printed pages 246-247; the exact local PDF hash-matched the registered remote artifact before image inspection. The printing omits the Vulgate superscription numbered as verse 1 and numbers 'Rejoice to God our helper' and 'Take a psalm' as verses 1-2, one lower than their Vulgate loci. The 1866 English translation is expressly abridged: O'Sullivan says that he omitted Bellarmine's philological and versional discussions and replaced Bellarmine's individual Psalm prefaces with Douay headings. No transcription is recorded."
