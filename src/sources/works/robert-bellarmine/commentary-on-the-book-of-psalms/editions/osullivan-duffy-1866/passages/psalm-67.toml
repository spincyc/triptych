context = "Bellarmine reads the Psalm through Christ's resurrection, ascension, and the establishment of the Church. At the clauses used by the proper he emphasizes God's special care for orphans, widows, the oppressed, and the poor in spirit; the Holy Ghost's work of bringing persons of one mind into one house and freeing those bound in sin; and God's final wonder in raising the saints and giving his people immortality, power, and strength."
verified_on = "2026-08-21"
notes = "Read directly in artifact PDF pages 205-207 and 211, corresponding to printed pages 195-197 and 201; the exact local PDF hash-matched the registered remote artifact before image inspection. The printing omits the Vulgate superscription numbered as verse 1 and therefore numbers the relevant text one lower throughout: 'Let God arise' as 1, the father of orphans as 5, one-minded dwelling as 6, and 'God is wonderful in his saints' as 35. The 1866 English translation is expressly abridged: O'Sullivan says that he omitted Bellarmine's philological and versional discussions and replaced Bellarmine's individual Psalm prefaces with Douay headings. No transcription is recorded."
