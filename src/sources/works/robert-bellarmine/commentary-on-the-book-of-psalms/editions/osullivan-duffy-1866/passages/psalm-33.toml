context = "Bellarmine notes the alphabetical structure (done, possibly, that it may be easier committed to memory, and be often chanted by the faithful) and glosses the Gradual's always: not every moment, but in the proper time and place, to the end of his life - nay, more, as those Psalms will be sung to the end of time, David will thus, through others, bless the Lord at all times. Later Christian reception of the Gradual's verses, not evidence for the chant's authorship or assignment."
