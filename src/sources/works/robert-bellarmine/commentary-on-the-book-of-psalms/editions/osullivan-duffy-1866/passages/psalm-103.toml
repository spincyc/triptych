context = "Bellarmine reads the Communion's verses literally and providentially - bread taken for the food of man in general, wine may cheer the heart of man intelligible enough - and draws three morals: God the source of all supports and enjoyments of corporal life; the fond Father who gave even the luxuries; and the duty of frugal meals and moderate drink. The tradition's literal pole beside Augustine's christological and Cassiodorus's sacramental readings."
