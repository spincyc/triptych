context = "Psalm 84, explanation 13 in John O’Sullivan’s English, checked with both neighboring explanations and the Duffy 1866 facsimile, PDF pp. 269. The final explanation reads justice walking before Christ as the light that guides human steps. The transcription follows the retained digital derivative."
physical_line_ranges = [[3017, 3017]]
text = "13 The prophet concludes by showing that Christ would be so replete with justice and sanctity, that the rays of his justice would go before him, and by their light shed the way to complete progress in this gloomy valley of our mortality. “Justice shall walk before him.” Christ, the sun and true light of the world, will send the rays of his justice and wisdom before him, as it is in Psalm 88, “Mercy and truth shall go before thy face;” and in Isaias 58, “And thy justice shall go before thy face;” and thus “shall set his steps in the way,” shall enter on his pilgrimage to bring many pilgrims back to their country."
