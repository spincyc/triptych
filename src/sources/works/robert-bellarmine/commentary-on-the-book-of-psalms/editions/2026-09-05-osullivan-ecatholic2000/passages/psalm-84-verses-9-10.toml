context = "Psalm 84, explanations 8–9 in John O’Sullivan’s English, checked with both neighboring explanations and the Duffy 1866 facsimile, PDF pp. 267–268. The prophet listens for the proclamation of peace before announcing that salvation is near. The transcription follows the retained digital derivative."
physical_line_ranges = [[3007, 3009]]
text = "8 To convince us of the truth of what he now means to express, the prophet here reminds us that he speaks not from himself, but what has been revealed to him, and that he is only announcing what he has heard from the Lord. “I will hear what the Lord God will speak in me;” that is, I will tell whatever I shall hear; and, therefore, having laid my petition before him, I will hear his answer to make it known to others. “What he will speak in me;” to give us to understand that when God speaks to the prophet, he does it interiorly, and spiritually. For the Holy Ghost, who abides in the prophets, speaks to them through their heart, and then, through their tongues, to the ears of mankind. The expression, “I will hear,” besides attention, signifies a desire to hear as it were, to say, I will most willingly and attentively hear; for God usually says nothing but what is good and useful; “for he will speak peace unto his people.” The reason I have for hearing him with pleasure and with attention is, because I know he will speak peace to his people. The summary, then, of God’s message to his people is the announcement and promise of peace through the coming of the Messias, for which the prophet asked when he said, “Show us, O Lord, thy mercy, and grant us thy salvation.” God, then, will grant a Savior, and through him, will announce and establish a most perfect peace; hence he is styled “the Prince of Peace;” and, as the Apostle says, “making peace through the blood of his cross, both as to the things that are on earth and the things that are in heaven.” Now peace comprehends all God’s favors; and we shall never be in perfect possession of it until we shall have arrived at the heavenly Jerusalem, which is interpreted the vision of peace. Peace is opposed to war, in which we shall be mixed up, until “death is swallowed up in victory, and this mortal shall have put on immortality.” Then there will be an end to that war with our vices and concupiscences, with the princes of darkness, with all our difficulties and necessities. For, while we live here below, “the life of man is a warfare upon earth,” however we may desire, as far as in ourselves lies, to be at peace with all men. “And unto his saints, and unto them that are converted to the heart. He now explains the expression, “to his people;” God promised peace to his people, but not to the whole of them; for they are composed of good and bad, and the bad can have no peace. For, “much peace have they that love thy law;” while, “the wicked have no peace, saith the Lord;” and, when he says, “unto them that are converted to the heart,” he tells us who the saints are to whom peace is promised. For sanctity, and consequently peace, then begins when man turns from exterior to interior matters; and, therefore, Isaias says, “Return ye transgressors to the heart;” and of the prodigal son is said, “and returning to himself, he said.” Man begins to return to himself, or to return, if you will, to his heart, when he begins to reflect within himself on the vanity of all things here below, and how trifling and how short lived is the pleasure to be derived from sin; and on the contrary, how noble virtue is, and of what value are the goods of eternity. In a little while man begins to advance by degrees, when he comes to consider and judge of externals, not by the aid of his own sense, or the discourses of the children of the world; but, “returning to his heart,” he consults sound reason on everything, consults the faith that has been divinely inspired, consults the truth itself, which is God. Finally, that man is truly converted to the heart, and begins to taste that peace “that surpasses all understanding,” who raises a tabernacle in his heart to God, and, on the wings of contemplation, rises from the image, the soul of man, to the reality, God himself; and there, beholding the infinite beauty of his Creator, is so inflamed and carried away by his love as to despise the whole world beside, and unite himself to God exclusively in the bonds of love, totally indifferent to, and forgetful of, the whole world. No pressure from abroad can disturb one so disposed. 9 On the coming of the Messias peace will be preached, but the establishment will be delayed for some time. However, salvation, which means the power of healing and of performing other miracles, will be always at hand, and available to those who believe in him, and have a pious and reverential fear of him. Hence, great glory will accrue to God, for all who see his wonderful works will praise and magnify him; many proofs of which can be read in the Gospels; and it is to it the prophet alludes when he says, “Surely his salvation is near to them that fear him;” that is to say, the salvation of God, or Christ himself, the Savior, will be at hand to save, through his power, all that fear him; all that worship him with a holy fear; “that glory may dwell in our land;” those numerous miracles will be performed with a view to make God’s glory known, and to dwell in that land of promise to which the Savior will be sent specially. And if the salvation of the body be near to them that fear him, and God’s glory be thereby greatly augmented, with much more reason will the salvation of the soul be near to those that fear him. “For to those who will receive him, he will give power to become sons of God,” 1 John; and thence his glory will be made manifest, “as the only begotten of the Father, full of grace and truth.”"
