context = "Psalm 24, explanations 4–5 in John O’Sullivan’s English, checked with both neighboring explanations and the Duffy 1866 facsimile, PDF p. 69. The two paragraphs under explanation 4 retain both the opening petition and the instruction in the paths. Explanation 5 continues the request for guidance. The transcription follows the retained digital derivative."
physical_line_ranges = [[849, 853]]
text = "4 This verse may be interpreted in two ways; first, to signify that those who sin without cause, meaning those who sin through malice, and not through infirmity or ignorance, “would he confounded.” Such persons think neither of doing penance, nor of abandoning sin, and if they hope for anything from God, their hope is presumption. Another more literal meaning may be offered, viz., that both the visible and invisible enemies of the just would be confounded, for their persecutions of the just will be all in vain, because they will not accomplish the end they propose to themselves, the ruin of the just, and the bringing them to hell; whereas, on the contrary, such persecution becomes only an occasion to the just of exercising their virtue, and a source of everlasting merit. The prophet then throws back the confusion on his enemies, saying, Lord, do not allow me to be confounded, as I will, if my enemies laugh at me, and exult in my ruin; but, on the contrary, let them be confounded, when they see they have been persecuting me, and provoking me to impatience, without effecting their object, and in vain. “Show, O Lord, thy ways to me, and teach me thy paths.” By “thy ways,” we understand his law, which is really the way to God. “If thou wilt enter into life, keep the commandments;” and the prophet having asked the Lord’s help against temptations, explains what help he specially wishes for, and says, “Show, O Lord, thy ways to me,” make me tread in the way of your commandments—”and teach me thy paths;” that is, show me that most narrow road of thy most just law, for thus will I escape the mocking of all my enemies, and instead of being confounded, all they who, by their temptations, sought to harass me, will be confounded. He asks to be taught the paths of the Lord, not speculatively, but practically; that is to say, he asks for such grace as may move his will to observe the commandments cheerfully. 5 A repetition of the foregoing, and a reason assigned for it. “Direct me in thy truth.” If left to myself, I will at once turn aside to the right or to the left, deserting the path of your commandments, on account of the prosperity or the adversity of this world: do you, therefore, take me by the hand, and direct me by the help of thy grace in the right path, “in thy truth;” namely, in thy law, which is the truest of all paths. “For all thy commands are truth,” Psalm 118.—”For thou art God my Savior;” of thee I ask this help, because you alone, being God, can save my soul; for there is no other physician that understands the diseases of the soul; and, therefore, there is no one able to cure them but God alone, much less is there one able to restore them to perfect health; and I specially ask this favor, which I hope, too, to obtain, because “On thee have I waited all the day long;” that is, with perseverance and patience I have waited for thy medicine, and look for relief from nobody else. It is a source of great merit with God never to give up the hope of his help in temptations, or to look to human consolation."
