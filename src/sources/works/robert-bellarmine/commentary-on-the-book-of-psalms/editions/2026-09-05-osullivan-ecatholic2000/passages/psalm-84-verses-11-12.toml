context = "Psalm 84, O’Sullivan English, explanations 10–11. These two paragraphs move from the embrace of mercy and justice to truth springing from the earth. Read with the neighboring explanations and located against the 1866 Duffy facsimile, physical PDF pages 268–269. Wording and spelling follow the exact tracked historical-text derivative."
physical_line_ranges = [[3011, 3013]]
text = "10 He now reveals another mystery that will be accomplished on the coming of the Messias; that is, the union of mercy and justice, which seem so opposed to each other; the one prompting to punish, the other to forgive; for Christ’s passion and suffering was meant to deliver the human race in mercy, while it made the fullest satisfaction to the divine justice. “Mercy and truth have met each other.” They met in the time of the Messias, whereas at other times they seemed to move in contrary directions. “Justice and peace have kissed;” the justice that inflicts punishment, previously called truth and peace, which then was called mercy, will be joined in the bonds of the strictest friendship; and, as it were, kissed each other. 11 He now touches on the mystery of the Incarnation, making use of the past for the future tense, as is usual with the prophets. “Truth is sprung out of the earth.” Christ, who is the truth, will be born of the Virgin Mary, “and justice hath looked down from heaven.” Then also justice from heaven will be made manifest, because, on the birth of Christ, true justice began to come down from heaven, and man began to be justified by faith in Christ; as also, because by the coming of Christ, “The wrath of God is revealed from heaven against all impiety and injustice,” for the extent of God’s anger and hatred of sin would never have been thoroughly known, had not God decreed that it should be expiated by the death of his only Son; and, even, we should never have known the extent of God’s anger to the sinner on the day of judgment, had we not seen the amount and the extent of Christ’s sufferings in atoning for the sins of others, “For if in the green wood they do these things, what shall be done in the dry?” says our Lord, Luke 23."
