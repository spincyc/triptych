context = "Psalm 79, O’Sullivan English, explanations 1–3. The superscription is verse 1 in the canonical Psalter. Bellarmine begins with the shepherd and Joseph, proceeds to the tribes and ends with the plea for conversion. Read with the neighboring explanations and located against the 1866 Duffy facsimile, physical PDF pages 253–254. Wording and spelling follow the exact tracked historical-text derivative."
physical_line_ranges = [[2837, 2841]]
text = "1 The prophet commences this Psalm with a prayer to God, that he may hear him, and cast a favorable eye on his people. “Give ear, O thou that rulest Israel; O God, who art the ruler and the guide of the people of Israel, hear the prayer I pour forth for your own people. He then repeats the first part of the prayer, leaving the second to be understood; “thou that leadest Joseph like a sheep;” O God, who leadest the descendants of Joseph as a shepherd would his flock, hear the prayer which I pour forth for your people, who are called Israel and Joseph. The reason for his mentioning Israel and Joseph is, that the name Israel comprehended all the tribes, and the name Joseph does the same. We can easily understand why Israel includes all the tribes, for they were all descended from Israel; and the reason why Joseph also comprehends all the tribes is, because he fed the whole of them, and ruled over them in Egypt, and his two sons, Ephraim and Manasses, became the heads of two distinct tribes, the only instance of the like. Each of the sons of Israel became the head of a separate tribe, with the exception of Joseph, who got the privilege of founding two tribes; and, upon the death of Solomon, when his kingdom was divided into the kingdom of Israel and the kingdom of Juda, the first who reigned as king over the ten tribes of Israel was Jeroboam, of the tribe of Ephraim, the son of Joseph. “Thou that sittest upon the Cherubim shine forth.” Having asked God to hear the prayers of his people favorably, he now begs that he may turn his eyes on them, and regard them with a look of complacency. God is said to look on one when he is pleased with him, and to turn away his eyes, or to cover them with a cloud, when he is displeased. “Thou that sittest upon the Cherubim;” O God, who sittest in heaven, above the Angels of the first rank, called Cherubim, and as a type thereof you have in your sanctuary, the mercy seat resting on the images of the Cherubim for your throne, and where the Ark is, as it were, the footstool of your feet, attend to us. 2 Show thy face and look with pity on us, the people of Israel. Why the three tribes just named should stand for the whole people of Israel, the reason seems to be that which we have assigned in the preceding verse, for Ephraim and Manasses, to whom he unites Benjamin here, because he was uterine brother to Joseph; and when the tribes were marshalled in array of battle, Ephraim, Manasses, and Benjamin always went together. The prophet had also, possibly, in view the fact of these three tribes being in possession of the principal parts of the land of promise. Ephraim held Samaria, the capital of the kingdom of Israel; Benjamin had Jerusalem, the capital of the kingdom of Juda; and Manasses had the country beyond the Jordan. The reason for his placing Benjamin between the brothers, seems to be for distinction sake, he having been their uncle. “Stir up thy might and come to save us.” He tells now, more plainly, why he asked God to direct his ears and his eyes towards them, that he may save them. “Stir up thy might,” your power which looks as if it were buried, when you so allowed us to be harassed by our unjust persecutors; “come,” therefore, with your most powerful help “to save us.” 3 The reason why God often does not look upon us is, because we turn away from him, and turn to creatures; but as we cannot turn to him without his aid, the prophet asks for both for God’s people. “Convert us, O God,” inspire us with your love, that we may turn away from the things of this world, and turn back to you: “and show us thy face; turn your face to us, at the same time, that thus united to you by the bonds of holy charity, “we will be saved” from all the enemies that assail us, for when you turn your face away, we languish and perish; when you look upon us, we revive and recover."
