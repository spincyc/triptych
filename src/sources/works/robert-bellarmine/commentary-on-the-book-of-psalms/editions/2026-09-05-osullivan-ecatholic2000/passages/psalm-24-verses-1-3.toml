context = "Psalm 24, O’Sullivan English, explanations 1–3. The first two paragraphs join the lifting and trust of the first verse to the enemies and those who wait. Read with the neighboring explanations and located against the 1866 Duffy facsimile, physical PDF pages 68–69. Wording and spelling follow the exact tracked historical-text derivative."
physical_line_ranges = [[845, 847]]
text = "1 Having found no rest in creatures, but on the contrary, “briers and thorns” everywhere; disgusted with my former mode of life, and having torn my soul from the affections that tied it down to the earth, “I lifted it up” to thee. Through constant reflection, and love inspired by you, to you I began to cling, hoping for help from you in my temptations; and since “I put my trust in you, let me not be ashamed;” that is, I will not go from you in confusion, without having obtained the help I need, and thus be made “to blush” before my enemies. 2–3 An explanation of the words, “To blush before my enemies,” in the preceding verse, for he should blush if his “enemies were to laugh at him” for having vainly trusted in God. By “my enemies,” may be understood, both the wicked in this world, and the evil spirits, whose rejoicing and scoffing would produce intolerable confusion, were we seriously to reflect on it. He then gives a reason for his hope “of not being confounded,” because “none of them that wait on thee shall be confounded;” that means, because we have learned by long experience, from the examples of our ancestors, and from your own promises, that those who put their trust in you, and patiently expect your help, were never disappointed in their “waiting on you.” To “wait on the Lord” is a very common expression in the Scriptures, and means to expect him in the certain hope of assistance."
