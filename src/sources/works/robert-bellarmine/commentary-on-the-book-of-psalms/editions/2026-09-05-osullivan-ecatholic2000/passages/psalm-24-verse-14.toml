context = "Psalm 24, explanation 14 in John O’Sullivan’s English, checked with both neighboring explanations and the Duffy 1866 facsimile, PDF pp. 71. The firm support of those who fear the Lord is explained through the covenant. The transcription follows the retained digital derivative."
physical_line_ranges = [[871, 871]]
text = "14 The reason why those who fear God shall always “Dwell in good things,” is, because they do not depend on perishable and transitory things, but God himself is “their firmament;” that is, their hope is based on the friendship and help of God. Firmament means foundation, on which they rest, that foundation being God himself; and their reason for depending on him is, because “his covenant” makes it “manifest to them.” They who fear God know right well, and often call to mind, the treaty he entered into with man, to be their God, and to be a most loving parent to them, on the condition of their observing his laws; and they can, therefore, understand how, by reason of this compact, they can depend upon God, as upon a most solid foundation."
