context = "Psalm 24, explanations 8–10 in John O’Sullivan’s English, checked with both neighboring explanations and the Duffy 1866 facsimile, PDF pp. 70. The three paragraphs expound instruction for sinners, teaching the meek, and mercy and truth toward those who seek the covenant. The transcription follows the retained digital derivative."
physical_line_ranges = [[859, 863]]
text = "8 He assures himself of the certainty of obtaining the object of his hope, by reason of God’s goodness and justice; and thus, that he is wont to correct delinquents freely, because thereby he exercises his mercy towards man, and his justice towards sin; and the meaning is, “The Lord is sweet and righteous;” and, therefore, loves man, and hates sin; and, therefore, “gives a law;” that is, declares and points it out “to sinners in the way,” to persuade them to abandon the old path, and, from being bad and wicked, to become good and just. 9 A qualification of the expression in the last verse, “He will give a law to sinners;” which he says here does not apply to all sinners, but only to the mild and the meek, who do not resist God’s teachings, but rather covet instruction. “We will guide the mild in judgment;” that means, he will lead the humble and the mild through the straight path of his law, (for law and judgment appear to be synonymous, as we explained in Psalm 18,) which he then explains in other words, “He will teach the meek his ways,” that is, to the meek he will give the grace of knowing and loving, and thus fulfilling his law. Observe that the proud are not altogether excluded from the grace of God, but have their place assigned them. The proud, to be sure, are incapable of perfection, of which this Psalm principally treats, until, from the influence of fear, they do penance, and then, having shaken off the fear, become mild and humble. The grace of God, then, first softens and subdues the proud and the obstinate, and when thus humbled and contrite, “It guides them in judgment,” and “teaches them his ways.” 10 Having stated that not only were the meek guided by God, but that all God’s dealings with such souls were acts of mercy and justice, justice meaning the honor and truth that oblige men to perform their promises. “The ways of the Lord,” mean here his works, they being, in some respect, the “way” in which he comes to us; unless we prefer to understand the expression as meaning the Lord’s rules or customs, and, as it were, the law he uses. Thus, the “Ways of the Lord;” the law he gives us, by means of which, as by a straight road, we ascend direct to God, is sometimes intended by the expression; at other times, it signifies the law he uses himself, when, through his works, he descends to us. And as David had previously spoken at great length on the former, he now speaks of the latter, that is, of the law he made for himself, and which he observes towards us; and he, therefore, lays down, “All the ways of the Lord are mercy and truth;” that is, his law, his custom, his mode of dealing with us, are all in mercy and truth; so that whatever he promises in his mercy, he invariably carries out in his truth. Who doth God so deal with? “With those that seek after his covenant and his testimonies.” He gives the name of testament, or “covenant,” to that bargain he made with man, when he gave him the law, that they should be his people, and he should be their God; which bargain is called a testament in the Scripture, because it contains a promise of inheritance, and require to be confirmed by the death of the testator, as it really was by the death of Christ, as a sign of which Moses sprinkled the whole people with blood, saying, “This is the blood of the covenant which the Lord hath made with you,” Exod. 24, and Heb. 9. He calls the law that God gave us “His testimonies,” because, as we have already stated, through the law God testifies his will to us. With those, then, who seek for the compact entered into by God with man to observe it, and, in like manner, seek for the law of God to carry it out, that is, with men of good will, fearing and loving God, he deals with such in the law of mercy and truth."
