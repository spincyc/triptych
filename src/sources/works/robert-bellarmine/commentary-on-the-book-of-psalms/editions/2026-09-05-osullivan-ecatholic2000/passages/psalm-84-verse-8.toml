text = "7 Having asked that the divine wrath may be mitigated; and having asked for that reconciliation and regeneration that always accompanies remission of sin, he now asks for the coming of the Savior, through whom we were brought clearly to see and to behold God’s kindness and mercy to us, of which the Apostle says, “The grace of God hath appeared to all men;” and again, “the goodness and kindness of our Savior God appeared.” For who can for a moment doubt of the care that God has for mankind, and the extent of his warmest love, when he sent his only begotten Son to redeem us by his precious blood from the captivity of the devil? “Show us, O Lord, thy mercy;” make us plainly see and feel by experience, that mercy through which you determined in your mind, from eternity, to bless thy land; “and grant us thy salvation.” Send us your Son for a Savior, for then you will clearly show unto all the extent of your mercy, goodness, and grace. St. Augustine, taking a moral view of this passage, says that God shows us his mercy when he persuades us, and makes us see and understand that we are nothing, and can do nothing, of ourselves; but that it is through his mercy we exist at all, or can do anything we go through; we thus are neither proud nor puffed up, but are humble in our own eyes; and it is to such people the Savior gives his grace."
