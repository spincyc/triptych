context = "Psalm 84, O’Sullivan English, explanations 7. The lemma requests that salvation be shown. The paragraph identifies the awaited Savior. Read with the neighboring explanations and located against the 1866 Duffy facsimile, physical PDF pages 267–268. Wording and spelling follow the exact tracked historical-text derivative."
