context = "Psalm 84, O’Sullivan English, exposition numbered 12, corresponding to Vulgate verse 13 by its lemma For the Lord will give goodness. Read the entire English paragraph including its flanking lemmata, and compared it directly with the reacquired 1866 print p.259, PDF 269 left column. This is the checked eCatholic derivative. Its “showing that truth could spring” differs from the print’s “shewing that truth would spring.” The present spelling and reading belong to this digital witness only."
physical_line_ranges = [[3015, 3015]]
text = "12 He still treats of the mystery of the Incarnation, showing that truth could spring out of the earth; not in the manner of the seed that we sow and cultivate, but in the manner of the natural flowers that grow spontaneously, with no other culture than the beams of the sun, and the rains of heaven. “For the Lord will give goodness,” he will send his Holy Spirit from heaven, who will overshadow a virgin, and thus our land, which was never ploughed nor sown, and was altogether an untouched virgin, will yield her fruit. Hence, he says, in the canticle of canticles, “I am the flower of the field, and the lily of the valleys.”"
