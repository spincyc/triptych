context = "Psalm 79, O’Sullivan English, explanations 14–18. The five paragraphs run from the prayer to visit the vineyard through the people’s promised perseverance. Read with the neighboring explanations and located against the 1866 Duffy facsimile, physical PDF pages 255–256. Wording and spelling follow the exact tracked historical-text derivative."
physical_line_ranges = [[2861, 2869]]
text = "14 He now, by way of a prayer, foretells the coming of Christ, who made up the breaches in the hedge, and gave the vineyard to be managed by other hands, as we read in Mt. 21, “He will bring those evil men to an evil end, and will let out his vineyard to other husbandmen;” which he at once explains more clearly in the following verses, where he says, “The kingdom of God shall be taken from you, and shall be given to a nation, bringing forth the fruits thereof.” For the Church of the Old Testament, which was at one time God’s vineyard, was never thoroughly destroyed, but it was reformed. The Apostles, the first fruits of the Church, belonged to Israel, and so did the many thousands who were converted by the preaching of Peter; and St, Paul, Rom. 11, clearly proves the gentiles to be “the branches ingrafted into the good olive tree;” that is, the Church originally formed of the Jews. He therefore says, “God of hosts,” who hast many thousands of Angels, nay, even all created things, serving thee, and art, therefore, all powerful, “turn again,” in your mercy, to your vineyard, your people, for whom you have so long entertained a just and deserved hatred; “look down from heaven and see;” when you shall have retired far from your vineyard, deign, at least, to look down from your throne in heaven, “and see” how disfigured your vineyard has been by the wild boar; “and visit this vineyard;” come and make a personal inspection of this vineyard. When he did so, Zacharias said, “He hath visited and wrought the redemption of his people;” and Christ himself, when he wept over Jerusalem, and foretold its destruction, attributed it to, “because thou hast not known the time of thy visitation.” 15 He now foretells the coming of the Messias more clearly. “And perfect the same which thy right hand hath planted.” Finish the work you began. Reform the Church of the Old Testament, now nearly defunct, and give a better one in its stead; as it was you that originally founded it, and planted it as a vineyard, not to perish, but to yield fruit; “and upon the Son of man;” look down also upon the Son of man, who is thy Son also, the Messiah, “whom thou hast confirmed for thyself,” as the principal husbandman in charge of your vineyard, as the head and guide of your Church. All agree that this passage refers literally to Christ, because, after the Babylonian captivity, the Jewish people never recovered their former position, and, therefore, the vineyard was never made perfect, as regards them; and it was only under Christ, as its Savior and its Lord, that it could have been said to have been made perfect. 16 He now explains the effects likely to follow from the coming of the Messias, namely, that the vineyard of the Lord, though burned down and rooted up, shall flourish and grow up again; for one rebuke from him will stop the devastation of the vineyard; just as when he rebuked the storm there was an immediate calm; and, when he commanded death and disease, they immediately disappeared, and were succeeded by life and health. 17 Certain of the coming of the Messias, he prays all manner of blessings on him. “Let thy hand be upon the man of thy right hand;” may your hand be extended to protect at all times, and in all places, the man of your right hand, the man who was formed by your right hand alone, without any cooperation on the part of man; for that Christ was so formed is certain, as we read in Luke 1, “The Holy Ghost shall come upon thee, and the power of the Most High shall overshadow thee;” and the same Christ was placed over the Church, not by the choice of man, but by the decree of God. “But I am appointed king by him over Sion his holy mountain.” 18 While Christ is our ruler, “we depart not from thee;” because Christ’s kingdom will last forever, and the gates of hell will not prevail against his Church. “Thou shalt quicken us” with the life of grace here on earth, and of glory hereafter in heaven; “and we will call upon thy name;” offering our tribute of invocation, praise, and thanks forever."
