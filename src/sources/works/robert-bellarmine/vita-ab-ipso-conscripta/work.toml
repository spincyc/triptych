description = "Bellarmine's third-person memoir, written in June 1613 at the request of fellow Jesuits; retrospective and edifying in genre, first published among the acta of the beatification process (1675 per the 1907 Catholic Encyclopedia). Its transmission includes a 1762 printing with variant readings recorded by the 1887 Bonn edition."
