notes = "Catalog-level record created 2026-07-25. Four-tome Venice printing whose title page claims to be 'ultima, ab ipso Auctore aucta et recognita'; its first tome retains the dedication to Sixtus V. The tome-level contents lists (general controversies of tomes I-IV) were read in the public Internet Archive scan bub_gb_CYhfGhPyoSwC; no exact artifact is registered here, and the authorial-revision claim of the title page has not been verified against the Ingolstadt printings."
