publication = "Title leaf transcribed from the page image at Internet Archive item hymnsancientmode0000unse_s2j4, leaf n4: \"HYMNS ANCIENT AND MODERN FOR USE IN THE SERVICES OF THE CHURCH WITH ACCOMPANYING TUNES COMPILED AND ARRANGED UNDER THE MUSICAL EDITORSHIP OF WILLIAM HENRY MONK, MUS. DOC., PROFESSOR OF VOCAL MUSIC IN KING'S COLLEGE, LONDON. THE SUPPLEMENTAL TUNES REVISED BY CHARLES STEGGALL, MUS. DOC. CANTAB. Complete Edition. 'Young men and maidens, old men and children, praise the Name of the LORD.' LONDON: PRINTED FOR THE PROPRIETORS BY WILLIAM CLOWES AND SONS, LIMITED, STAMFORD STREET AND CHARING CROSS. PUBLISHING OFFICE, 13, CHARING CROSS, S.W.\" Copy scanned from the Graduate Theological Union library; OpenLibrary OL20297812M."
date = "1890"
notes = "THE DATE IS THE CATALOGUE'S AND NOT THE BOOK'S. The title leaf carries NO date; it was read at leaf n4 on 2026-08-20 and the imprint ends at the publishing office address. `date = \"1890\"` is the Internet Archive item's and the holding library's, and it is recorded as such. Two internal bounds agree with it without depending on it: Charles Steggall is named on the title leaf as having revised the supplemental tunes, which is the state of the Complete Edition of the late 1880s; and A Historical Companion to Hymns Ancient and Modern (Parker and Co., 1889, Internet Archive item ahistoricalcomp00moorgoog) describes a collection with the same hymn at the same number, 398. NOTHING IN THE RIGHTS DETERMINATION TURNS ON THE EXACT YEAR: what is out of United States copyright is the TEXT, first published in the 1850s, and the printing only evidences it.\n\nTHE BOOK ASSERTS A COPYRIGHT AND THE ASSERTION WAS READ, NOT INFERRED. Printed page iv, leaf n6, heads the index with: \"Any questions concerning the copyright of these HYMNS should be addressed to the CHAIRMAN OF THE COMMITTEE OF HYMNS A. & M., care of WM. CLOWES & SONS, Limited, 13, Charing Cross, London, S.W. The TUNES marked thus * are copyright of the Compilers, as well as many of the Harmonies of other Tunes.\" That is a live proprietors' claim of the period and it is long spent; see the artifact rights basis. Hymn 398 carries no asterisk on the tune `Dies Irae` at that index line -- it is marked `1.*Dies Irae. 2. Plain-song.` -- but the tunes are not what this library takes from the book.\n\nWHAT IT REACHES, AND HOW IT SETS IT. Hymn 398, `Day of Wrath! O day of mourning`, printed pp. 307-309 under the running head `Burial of the Dead.` and the scriptural motto `\"He cometh to judge the earth.\"` The first stanza is set under the vocal score, the next six are printed as plain text in two columns beneath it, and the last three are set under two further scores on pp. 308-309. Leaf = printed page + 15 across those three leaves. This edition prints no author or translator attributions of any kind; the attribution to Irons is established from the 1889 Historical Companion and is recorded in the transcription artifact."
