rights_basis = "THE TEXT THIS LIBRARY TAKES. Irons's English of the Dies irae was published in the 1850s -- the 1889 Historical Companion dates it 1853 -- and its author died in 1883. Any work published before 1931 is out of United States copyright on the line guidance/missals.md records from Cornell's chart, WRITTEN HERE AS DERIVED FOR CALENDAR YEAR 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A reaches only works still protected in the source country on 1 January 1996; United Kingdom protection for an author who died in 1883 ended in 1953, so nothing was restored. THE PRINTING. Catalogued 1890 and undated on its own title leaf; whatever the exact year within the Complete Edition's life, it is a nineteenth-century London imprint and clears the same line. THE PROPRIETORS' NOTICE IN THE BOOK IS SPENT: printed p. iv directs copyright questions to the Committee of Hymns A. & M., which is a live claim of its own day over a compilation now more than a century past publication, and it is quoted in the edition record rather than ignored. THE SCAN ADDS NOTHING: a faithful mechanical reproduction of a public-domain work originates no copyright (Bridgeman), and the item's own metadata names the recogniser as tesseract 5.2.0, a program and not a person. NOT RELIED ON: that the item is on the Internet Archive, that the download succeeded, or that any host marks it."
