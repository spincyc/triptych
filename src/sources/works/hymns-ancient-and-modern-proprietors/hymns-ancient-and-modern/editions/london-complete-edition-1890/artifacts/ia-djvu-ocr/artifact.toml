notes = "A LEAD, NOT A SOURCE, and a poor one: this is a music edition, so most of hymn 398 reaches the text layer as syllables broken across the vocal score -- `Day of Wrath! O day of mourn-ing!`, `pro-phets' warn-ing!`, `ash-es burn - ing!` -- and nothing in the transcription artifact was read out of it. It served to establish that this printing carries the hymn at all, and to find the leaf: the item's scandata page map gives printed 306 at leaf 322, from which the hymn was found and the true offset, leaf = printed page + 15, was read off the images.\n\nNO GOOGLE MATTER IS AT ISSUE HERE. This is an Internet Archive Scribe scan, not a Google digitisation: `scanner` reads station58.cebu.archive.org, the item carries no page-foot stamp, and the head of the file is the book's own board and title matter.\n\nA RETRIEVAL CAUTION FOR ANY LATER READER. The item sits in the `internetarchivebooks` collection with `collection_set = printdisabled` and carries acs6/lcp external identifiers, which are the marks of a lending item. The full text derivative and the per-leaf page images were nonetheless served without credentials on 2026-08-20; if a later fetch is refused, that is an access fact about the host and says nothing about the rights position argued above."
