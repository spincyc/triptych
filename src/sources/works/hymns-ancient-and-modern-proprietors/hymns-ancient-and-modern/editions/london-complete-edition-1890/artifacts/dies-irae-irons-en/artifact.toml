notes = "One header line and 58 data lines: hymn 398 entire, in 10 stanzas, and nothing else from the book. Columns: hymn, hymn_number, printed_page, ia_leaf, stanza, line, set_to_music, english.\n\nATTRIBUTION, READ ON A PAGE IMAGE AND NOT FROM RECALL. This printing names no authors anywhere. The attribution is from A Historical Companion to Hymns Ancient and Modern (Parker and Co., 1889), Internet Archive item ahistoricalcomp00moorgoog, printed p. 314 = leaf n342, read at 1400 px on 2026-08-20, which sets under a running head `Irons. Jenner. Keble.`: \"IRONS, the Rev. W. J. 1812-1883. Of the English Church. Rector of S. Mary, Woolnoth, London. No. 398. Day of Wrath! O day of mourning. 1853. Dies irae dies illa. Thos. of Celano.\" The same volume, printed p. 146, prints the Latin it is set against, and that Latin is a SARUM recension -- its first strophe reads `Dies irae, dies illa, Crucis expandens vexilla, Solvet saeclum in favilla`, with a footnote that the Roman and Sarum Breviaries read `Teste David cum Sibylla` -- so the compilers' Latin is not the Missal's. That page was read in the item's text layer only and is recorded here as a lead, not as a reading.\n\nSTROPHE CORRESPONDENCE AGAINST THE LATIN THIS REPOSITORY CARRIES, counted on 2026-08-20 against the All Souls first Mass sequence in src/sources/calendars/roman-1962/propers.yaml. The Latin has 19 strophes and a closing Amen. This English sets them two to a stanza for the first seven stanzas (14 strophes), then `Inter oves` and `Confutatis` as stanza 8, `Oro supplex` as stanza 9, and the `Lacrimosa`/`Pie Jesu` ending as stanza 10, which also prints the Amen. All 19 are present, one for one, and the Amen is present -- which is a difference from the Caswall version, where it is not. NO CLAIM IS MADE HERE ABOUT FIDELITY OF WORDING.\n\nWHAT IS UNSETTLED AND MUST NOT BE PRESENTED AS SETTLED. This is HYMNS ANCIENT AND MODERN'S text of Irons, not necessarily Irons's own. The compilers of that book are widely said to have altered the texts they took, and this lane established NO instance of alteration here and made no comparison against a printing of Irons's own: no printing of `Day of wrath! O day of mourning` outside a hymnal was located. What the searches did establish is recorded in the lane report. A collation against Irons's own publication would settle it and has not been run.\n\nWHY THIS EDITION AND NOT A WORDS-ONLY ONE. Because no words-only printing of this text was located on the Internet Archive by this lane's searches; the two Hymns Ancient and Modern items examined that carry the hymn both set it under music, and the first stanza and the last three had to be read from under the staves. The syllable-splitting that follows from that is the weakest point of this transcription and is why `set_to_music` is a column rather than a note: 22 of the 58 lines carry it. Anyone re-reading this text should re-read those first."
