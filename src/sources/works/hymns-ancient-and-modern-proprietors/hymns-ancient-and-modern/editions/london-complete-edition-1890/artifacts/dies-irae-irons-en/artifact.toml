transformation = "Project transcription from page images at https://archive.org/download/hymnsancientmode0000unse_s2j4/page/n<leaf>_w1400.jpg, leaves n322, n323 and n324 (printed pp. 307, 308, 309), read on 2026-08-20. One physical line per printed verse line. Where a line is set under the vocal score its syllables are printed apart -- `mourn-ing`, `pro-phets'`, `de - pend - - - eth` -- and the syllables are closed up, which is the one transformation applied and is marked per line by the `set_to_music` column: `yes` means the line was read from under the staves and its hyphens are the composer's, `no` means it was read from the plain two-column text on p. 307 and needed nothing. NOT CARRIED: the dynamic and expression marks the book prints in the margin and inside the lines (ff, mf, p, cr, dim., and a parenthetical `(p)` standing between `Fount of pity,` and `then befriend us!` on p. 307); the small capitals in which the book sets the divine names GOD, LORD and JESU, which are transcribed as ordinary initial capitals; and the indentation of the score. Spelling, elision and capitalisation are otherwise as printed -- `fulfill'd`, `Heav'n`, `favour'd`, `Doom'd` -- with the apostrophe as U+2019."
