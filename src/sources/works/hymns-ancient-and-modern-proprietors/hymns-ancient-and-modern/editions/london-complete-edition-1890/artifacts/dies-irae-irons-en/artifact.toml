rights_basis = "The text is W. J. Irons's English of the Dies irae, published in the 1850s by an author who died in 1883, printed here in a nineteenth-century London imprint; it is in the public domain in the United States on the pre-1931 line as derived for calendar year 2026, and no 17 U.S.C. 104A restoration is available. The sibling ia-djvu-ocr record argues the case in full and quotes the proprietors' spent copyright notice. This file contains only the printing's own English wording, transcribed by this project from its page images; a faithful transcription of a public-domain text originates no new copyright, and no music, no Internet Archive markup and no page-image material is reproduced."
