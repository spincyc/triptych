notes = "The scan places two facing printed pages on each landscape PDF page. Artifact pages 224-225 contain printed pp. 348-351, and artifact page 226 contains printed pp. 352-353. The edition identity was also checked against the official Quaracchi catalogue, which lists Spicilegium Bonaventurianum 5 as the 1981 third edition, volume 2, Books III-IV, pp. 64*-632. Acquisition aliases included Sententiae in IV libris distinctae; Libri IV Sententiarum; Peter Lombard; Grottaferrata 1981; Spicilegium Bonaventurianum 5."
