context = "At IV d.17 c.4 n.3, Lombard says one should seek a priest able to bind and loose. If no priest is available, the penitent may confess to a neighbor, who has no power of absolution; the penitent is nevertheless said to become worthy of pardon through desire for the priest. Lombard then invokes the ten lepers, cleansed while going to show themselves to the priests, and states that God regards the heart when necessity prevents arrival. Number 4 continues the ecclesial and priestly reading while distinguishing private from public disclosure."
verified_on = "2026-08-21"
notes = "Read directly at printed pp. 351-352. Number 3 begins on p. 351 and continues through the opening of p. 352; number 4 follows on p. 352. Luke 17:14 is cited in the edition's footnote to the leper sentence. This passage supports a carefully bounded synthesis: priestly confession is to be sought, the non-priest does not absolve, and necessity does not frustrate pardon where desire for the priest remains. It does not state that desire alone completes the sacrament, that lay confession supplies sacramental absolution, or that the lepers' historical cleansing was itself sacramental penance. The quoted material is from De vera et falsa poenitentia transmitted under Augustine's name, not authenticated Augustine."
