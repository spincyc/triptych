context = "At IV d.17 c.3 nn.4-6, Lombard transmits penitential teaching that directs the penitent to present his life to God through a priest, to anticipate divine judgment by confession, and to obey Christ's command that those being cleansed show themselves personally to priests. The passage treats confession as an ecclesial act of humiliation and reconciliation and concludes that priests can profit and spare those who confess. This establishes Lombard's positive reception of priestly confession; its quoted authority is the medieval De vera et falsa poenitentia transmitted under Augustine's name, not an authenticated work of Augustine."
verified_on = "2026-08-21"
notes = "Read directly at printed pp. 349-350. Number 4 begins on p. 349 and continues on p. 350; number 5 begins on p. 349; number 6 is on p. 350. The passage supports Lombard's priest-directed penitential synthesis. It does not by itself supply the necessity exception, prove Augustinian authorship of the embedded quotation, define the sacrament's complete later scholastic theology, or state current canon law. Read IV d.17 c.4 n.3 for the explicit distinction between priestly ministry and impossibility."
