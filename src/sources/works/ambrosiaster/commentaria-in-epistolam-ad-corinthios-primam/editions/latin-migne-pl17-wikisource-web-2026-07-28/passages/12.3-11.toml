context = "The complete comments on 1 Corinthians 12:3-11 were inspected in the dated Latin transcription, including the inherited PL 17 column markers 150-152. Ambrosiaster denies that ecclesial gifts are owed to human merit, joins the Spirit, Lord, and God in one divine operation, reads each manifestation as given for usefulness, and concludes that distribution serves the Church's edification. This is patristic reception, not a critical-text judgment or a claim that every listed gift belongs to every Christian."
