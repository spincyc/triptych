context = "Printed page 256 (PDF page 300) was read at the page image. Confessiones X.29.40 begins by placing Augustine's whole hope in God's mercy, continues 'da quod iubes et iube quod uis,' identifies continence as God's gift with an explicit citation of Wisdom 8:21, describes continence as gathering the divided self into unity, and repeats the prayer at the paragraph's close."
verified_on = "2026-08-21"
notes = "The exact Knöll text is lower-case and reads 'da quod iubes et iube quod uis.' The familiar form 'Da quod iubes, et iube quod vis' capitalizes the opening, inserts a comma, and normalizes consonantal u to v; it must not be represented as a diplomatic quotation from this edition. The passage directly supports Augustine's appeal for God to grant the continence he commands and its setting within mercy, divine gift, and the gathering of desire into unity. It does not by itself establish dependence by a later liturgical formulary, direct exegesis of another appointed passage, or the full content of later doctrinal formulations."
