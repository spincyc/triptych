notes = "A Latin witness beside this work's 1896 CSEL 33 printing, kept separate because it is a web delivery of a different, modern edition. The page read credits its text in its own words: \"Submitted by James J. O'Donnell (Univ. of Pennsylvania) from his new edition\", linking to The Confessions of Augustine: An Electronic Edition at stoa.org/hippo. The page names neither the title nor the date of a printed edition, so none is recorded here; the editor is recorded from that credit line only. The site prints the book.chapter.paragraph numbers (8.1.1 to 8.12.30) as separate paragraphs, which agree with this work's locus grammar."
