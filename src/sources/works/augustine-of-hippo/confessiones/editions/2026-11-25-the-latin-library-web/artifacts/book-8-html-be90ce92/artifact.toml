notes = "The Latin Library page titled \"Augustine: Confessions VIII\", headed AUGUSTINI CONFESSIONUM LIBER OCTAVUS. Extent as measured on the exact bytes: the complete Book VIII, every paragraph from 8.1.1 (deus meus, recorder in gratiarum actione tibi) to 8.12.30 (et multo carius atque castius quam de nepotibus carnis meae requirebat), followed by the site's credit line and navigation. It is one of the thirteen pages into which the site divides the work; the other books were not acquired. The page states no limitation of its own. Not collated with a printing: the public-domain printing in this library to collate against is the CSEL 33 facsimile, artifact.augustine-of-hippo.confessiones.1896-knoll-csel-33.ia-facsimile-pdf-aabe4272. ACCESS LIMITATION. These exact bytes are not retained because the page carries no licence and credits a modern editor's text."
