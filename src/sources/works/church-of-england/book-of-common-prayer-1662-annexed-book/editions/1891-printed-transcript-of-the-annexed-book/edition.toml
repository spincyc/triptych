notes = "A transcript of the manuscript, not a facsimile of it and not one of the ordinary printed Prayer Books. Its preface, in the registered text layer, records that the transcript was made in 1891 by special permission of the House of Lords, every case of ambiguity being determined there. The end of Trinity XIV and the collect of Trinity XV stand at printed page 191, the Trinity XV epistle and gospel marginals at 192."
