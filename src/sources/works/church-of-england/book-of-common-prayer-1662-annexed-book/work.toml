title = "The Book of Common Prayer annexed to the Act of Uniformity of 1662"
responsible = "Church of England, in the Convocations of Canterbury and York"
work_type = "liturgical-book"
alternate_titles = ["The Book of Common Prayer", "BCP 1662", "The Annexed Book", "The Book of Common Prayer from the Original Manuscript attached to the Act of Uniformity of 1662"]
languages = ["en"]
composed = "1661-1662"
composed_basis = "The book was revised in 1661 and annexed to the Act of Uniformity of 1662, which is what the transcript's own title states: 'from the Original Manuscript attached to the Act of Uniformity of 1662'. The date is that revision and annexation, not the 1891 printing of the transcript."
description = "The 1662 Book of Common Prayer in the form of the manuscript annexed to the Act of Uniformity. Its Sundays after Trinity run one ahead of the Roman Sundays after Pentecost, so the Roman Fourteenth after Pentecost is Trinity XV, whose collect is Cranmer's rendering of the Sarum Latin. No edition consulted in this run prints a source apparatus for the collects, so that derivation is an identification by comparison and not a statement any of these books makes."
