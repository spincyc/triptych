publication = "Oxford and London: James Parker and Co., 1877"
date = "1877"
notes = "A comparative printing, not a prayer book: its title page, read in the optical text registered here, gives \"THE [First Prayer-Book] OF EDWARD VI. COMPARED WITH THE SUCCESSIVE REVISIONS OF The Book of Common Prayer: ALSO A CONCORDANCE TO THE RUBRICKS IN THE SEVERAL EDITIONS. Oxford and London: JAMES PARKER AND CO. 1877.\" No editor is named on the page and none is asserted here. It is registered as an edition of the Book of Common Prayer because that is what it prints, in parallel states. The retrieving lane searched it for this Sunday's collect in both modern and sixteenth-century spelling and for the Sunday heading, and found neither."
