notes = "A straight nineteenth-century printing of the 1662 book, catalogued by the retrieving lane from Internet Archive item commonprayeradmi00chur. The edition is registered because it was opened and rejected on inspection, and the rejection is a fact about this digitisation rather than about the book: the optical layer is largely unreadable, returning no hit for \"prevent and follow\", for any Sunday after Trinity heading, or for the running heads. Nothing about the 1662 text may be read off it."
