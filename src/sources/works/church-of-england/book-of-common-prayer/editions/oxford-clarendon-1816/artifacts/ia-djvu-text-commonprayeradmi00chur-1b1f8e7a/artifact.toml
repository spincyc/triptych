notes = "Uncorrected optical text of the whole item, and a bad one: the recognition is largely unreadable, the front matter coming through as strings such as \"lii^ H. C. SHIP DUKE or YORK 25TH DECEMBER 1817\". It is retained so that the retrieving lane's negative can be replayed rather than taken on trust, and for no other use. 49706 LF-terminated lines. Extent as measured by the retrieving lane: Complete optical-text layer of The Book of Common Prayer (Oxford: Clarendon, 1816). Retrieved as a candidate straight English Prayer Book text and rejected on inspection: the layer is largely unreadable, returning no hit for 'prevent and follow', for any Sunday after Trinity heading, or for the running heads. A bounded negative about this digitisation, not about the book. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE: it is uncorrected recognition, and a raw-line negative over it cannot exclude a differently recognised spelling."
