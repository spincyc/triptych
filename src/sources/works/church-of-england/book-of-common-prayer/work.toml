composed_basis = "First set forth in 1549 under Edward VI. Its later states -- 1552, 1559, 1604 and 1662 -- are revisions of that book and are dated on their own edition records, which is where a question about wording has to be settled; the work is dated by the act that made it."
description = "The prayer book of the Church of England. Its Sunday collects, epistles and gospels inherit the Sarum arrangement, which is why it stands in this collection at all: its Seventeenth Sunday after Trinity carries the collect of the Roman Sixteenth Sunday after Pentecost."
