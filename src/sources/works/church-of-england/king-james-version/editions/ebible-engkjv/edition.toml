notes = "The King James Version in the electronic form eBible.org distributes as eng-kjv, registered here as the library's second complete English bible and its first witness of the Hebrew canon and of a Protestant Apocrypha. It is a transcription of the standardized text of 1769 — Blayney's Oxford text, which ordinary printings descend from — and not of the 1611 sheets, and it is not a critical edition. It is registered to be read alongside the Douay-Rheims and the Clementine Vulgate, never in place of them where a 1962 or postconciliar citation is being resolved, for the reasons below. Rights. Public domain in the United States, and everywhere else with one real exception: in the United Kingdom the translation is held under the Crown's perpetual letters patent, which have no expiry, and printing it there or importing printed copies into it is reserved to the Crown's patentees — Cambridge University Press, Oxford University Press and Collins. eBible.org states the same exception on its own copyright page. Every artifact under this edition therefore records rights_status public-domain with rights_jurisdiction United States, and its rights_basis names the United Kingdom exception rather than claiming the text is free everywhere. Canon. 80 books: 39 of the Hebrew Old Testament, 14 of the Apocrypha printed as a section of their own, and 27 of the New Testament. The Apocrypha here is NOT the Catholic deuterocanon and the two must not be conflated. Three of its books are outside the canon fixed at Trent altogether — 1 Esdras and 2 Esdras, which the Vulgate prints in an appendix after the New Testament as 3 and 4 Esdras, and the Prayer of Manasses, printed in the same appendix. Four more are Catholic canonical matter printed as separate books rather than inside the book that holds them: the Greek additions to Esther stand apart as The Rest of the Chapters of the Book of Esther, and the three Greek additions to Daniel stand apart as The Song of the Three Holy Children, The History of Susanna, and Bel and the Dragon. The seven Catholic deuterocanonical books are all present — Tobit, Judith, Wisdom, Ecclesiasticus, Baruch with the Epistle of Jeremias as its sixth chapter, and 1 and 2 Maccabees. Divergences recorded rather than harmonized. The additions keep their own books and their own tokens here; nothing is renumbered into Esther or Daniel to make a Vulgate citation resolve. The Rest of Esther carries the Vulgate's own numbers, 10:4 through 16:24, so a citation of Esther 13-16 addresses that book and not the ten-chapter Esther this edition prints. The three Daniel additions do not: a Vulgate citation of Daniel 3:24-90 means the Prayer of Azarias and the Canticle of the Three Children, and the correspondence with this edition's separate book of 68 verses is not a uniform offset — Vulgate Daniel 3:52 is its verse 29 but Vulgate 3:89 is its verse 67, not 66 — so no correspondence is asserted and Daniel 3:24-30, the part that overlaps this edition's own Aramaic chapter, is withheld in the verse-aliases table rather than resolved to the words it happens to print there. Susanna and Bel and the Dragon are Vulgate Daniel 13 and 14 and simply have no chapter here; those citations refuse for want of the chapters. Note also that Vulgate Daniel 3:98-100 is this edition's Daniel 4:1-3 and the whole of its Daniel 4 therefore runs three verses behind the Vulgate's; no calendar tracked here cites Daniel 4, and no resolution is asserted for it. Text division. Tobit, Judith and Ecclesiasticus follow the Greek, whose chapter and verse division differs from the Vulgate the Douay-Rheims translates, sometimes by several verses: 244 verses of Tobit here against 298, 339 of Judith against 345, 1393 of Ecclesiasticus against 1591. A Vulgate-numbered citation of those three books resolves here and may land on different words. Treat this edition as an additional English witness for them, not as a control on the Latin. Baruch has the same 213 verses as the Douay-Rheims but not the same division: its chapter 3 has 37 verses against 38, because this edition joins at 3:34 what the Vulgate divides, and its chapter 6 has 73 against 72. A citation of Baruch 3:38 therefore falls past the end of the chapter here and refuses. Beyond the counts, the two traditions distribute clauses across a verse boundary differently in many places without changing the numbering — Psalm 73:22-24 is a plain instance — so a single-verse citation resolved here may carry a clause more or less than the same verse in the Latin. Numbering. The psalms are numbered as the Hebrew numbers them, so this edition's Psalm 51 is the Miserere that the 1962 books call Psalm 50, and the edition is declared hebrew. Its psalm inscriptions are printed but left unnumbered, which the Douay-Rheims and the Clementine Vulgate do not do: they count the inscription as verse 1. That shifts every numbered verse of most psalms, so this edition's Psalm 51:1 is the Hebrew numbering's 51:3, and addressing it with a title-numbering calendar's verse numbers would return real text a verse or two past the words cited. The edition therefore declares its psalm titles unnumbered as well as its numbering hebrew, and the index applies the offset the Douay-Rheims psalm concordance already records in its English columns. Where that concordance records no verse-for-verse correspondence — the sixteen psalms whose bodies the two conventions divide differently, among them 2, 4, 29, 100 and 150 — a citation is refused rather than shifted by the offset at the head of the psalm. Registering this edition found the sixteenth. Hebrew Psalm 13 carries the whole of Vulgate 12:2-3 in its second verse, so from its third verse to the end it stands one ahead of the number a Vulgate or Hebrew numbered citation of that psalm means: this edition's 13:4 is Vulgate 12:5. That finding was reported against the concordance rather than worked around here, because the concordance is the record every edition derives from and a local patch would have left the same defect live everywhere else. It was corrected on 2026-07-31: the psalm is now marked non-uniform there, the whole psalm refuses at the concordance, and the four rows this edition had been carrying were retired as redundant. Psalter. Not a recension of the Latin psalter at all. The King James psalter was Englished from the Hebrew, with the Great Bible and the Bishops' Bible before the translators, so the text it witnesses is the Masoretic one and the edition is declared masoretic. Calling it iuxta-hebraeos would assert Jerome's third Latin psalter, which it is not, and gallican would assert the Septuagint-derived psalter the 1962 books print, which it is emphatically not: its wording matches neither, and it must never be used to check a chant incipit or a Latin proper. What this edition is excluded from carrying. The transcription attaches Strong's numbers to most words of the Old and New Testaments and carries the translators' marginal notes as footnotes and the 1611 preface as front matter. All of that is editorial or apparatus, none of it is scripture, and none of it is registered in the verse text here."
