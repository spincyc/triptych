rights_basis = "The King James Version was published in 1611 and this is its standardized text of 1769. It is in the public domain in the United States and everywhere else except the United Kingdom. The one exception is real: the translation is held there under the Crown's perpetual letters patent, which have no expiry, and printing it in the United Kingdom or importing printed copies into it is reserved to the Crown's patentees — Cambridge University Press, Oxford University Press and Collins. The decree has no effect outside the United Kingdom. eBible.org distributes this text as eng-kjv, marks it public domain, and states the same United Kingdom exception in its own notice. This table carries no scripture text at all: it is a list of verse numbers at which a paragraph opens, and it is registered under the same notice as the text it describes because it is derived from that text's own source file and describes nothing else. eBible.org asserts no separate claim over the paragraph structure of any of its releases; its notices cover the work undifferentiated."
