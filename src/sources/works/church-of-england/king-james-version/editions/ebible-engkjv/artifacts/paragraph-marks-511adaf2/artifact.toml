transformation = "Read the same eBible.org eng-kjv USFM package the verse text was derived from, re-fetched on 2026-08-01 and hashed to the recorded sha256 1ba522157152c537013c1be86c5eb96c17a9c7a0f8e02e23262d61eea5bef054 before anything was read from it. Walk each book file keeping \\c for the chapter and \\v for the verse, and record the verse that follows every paragraph-level marker. Emit one row per such verse; a marker standing at verse 1 is not emitted, because a chapter always opens a paragraph and a row saying so would restate the chapter number. The marker column keeps the marker itself. \\b is never a break: USFM defines it as additional white space between things already divided, and the marker that follows it is what opens. \\nb is the opposite of a break and is likewise not emitted. The kind column takes one of three values. poetry, where the marker is one of \\q \\qm \\qc \\qr: those are lines of verse, not paragraphs, and folding them in would give one paragraph per poetic line. verse-per-paragraph, where the marker is a prose one but the book's markers stand at more than half its verses: such a book is not recording paragraphs, it is verse-per-paragraph encoding wearing paragraph markers, and testimony that breaks at every verse vetoes nothing. Thirteen books of this transcription are so classified, all of them in the Apocrypha, and the threshold is nowhere near anything — those thirteen run from 0.943 to 0.985 markers per verse and the highest of the remaining sixty-seven is 0.286. prose, everywhere else. The printed column carries the word pilcrow where the standardized text itself prints a paragraph mark at that verse. Book identity is not taken from file order: every one of the 80 books was mapped to its USFM file by re-deriving that file's verse text under the transformation recorded on the verse-text artifacts and requiring it to equal the tracked verse text at every verse of the book. All 80 reproduced exactly and the resulting mapping is a bijection; a book that had not reproduced exactly would have been refused rather than mapped by resemblance. No mark was dropped for want of a verse to attach to."
