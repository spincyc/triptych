notes = "11440 rows across 80 books: 3596 prose paragraph openings, 2311 poetry line openings, and 5533 in the thirteen verse-per-paragraph books. Only the prose rows are usable as paragraph evidence. Two distinct witnesses are recorded here and must not be conflated. The 2970 printed pilcrows are the edition's own: the standardized text prints them, the first at Genesis 1:6 and the last at Acts 20:36, and after that the printers stopped — the twenty-two books following carry none, and none stands in the Apocrypha. 2902 stand at the head of their verse and 68 inside it. F. H. A. Scrivener, who edited the 1873 Cambridge Paragraph Bible and knew them better than anyone, judged them 'unequally and capriciously distributed' and confirmed that they cease after Acts xx. 36 in both 1611 issues and in the Bible of 1613 (The Authorized Edition of the English Bible (1611), Cambridge 1884, pp. 128-129). The remaining prose markers are NOT those pilcrows and must never be described as them: they continue to the end of Revelation, Romans alone carrying 24 of them where the printed text has none, and eBible.org documents no origin for them. They are a modern editorial paragraphing of unstated provenance, and this library uses them only as one witness among others under a rule requiring concurrence, never as the edition's own printing."
