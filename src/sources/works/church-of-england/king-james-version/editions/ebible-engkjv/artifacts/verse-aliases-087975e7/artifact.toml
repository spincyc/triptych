provenance = "Created by Triptych on 2026-07-31 and rewritten the same day when the deuterocanonical numbering was compiled verse by verse. Rows are derived, not written: `python3 scripts/_deuterocanon.py <edition>` expands the tracked deuterocanon numbering concordance against this edition's own verse text, and tools/tests/test_deuterocanon.py fails if the tracked rows and the derivation disagree. The concordance is validated when it loads, against the verses it was compiled from: no chapter ceiling appears anywhere in it, and every row records the opening words of each run and is refused if the witness no longer prints them. Four hand-written Psalm 13 rows were removed on 2026-07-31. They withheld Psalm 13:3-6 because the psalm concordance marked Hebrew Psalm 13 as uniformly offset from the English convention when it is not; that concordance has since been corrected to record the psalm as non-uniform, so the whole psalm now refuses at the concordance and the edition-level withholding said nothing the shared table did not. Resolution was measured before and after and is unchanged at 907 of 950 and 747 of 778. Everything else covers Esther, Ecclesiasticus and Daniel. Vulgate Daniel 3:24-90 is the Prayer of Azarias and the Canticle, which this edition prints as the separate book SgThree; the correspondence is now asserted because it was read rather than inferred, and it is not an offset: Vulgate 3:52 carries both blessings SgThree numbers 29 and 30, and from Vulgate 3:53 to 3:78 the two traditions order the Benedicite differently and realign at 3:79. Vulgate 3:52 therefore refuses, because one verse cannot select two without cutting them. Vulgate Daniel 3:91-97 is this edition's own 3:24-30, its 3:98-100 is its 4:1-3, and its chapter 4 runs three verses behind. Daniel 13:1-64 is Susanna and 13:65 is Bel 1, so Bel runs one verse ahead of Vulgate Daniel 14 throughout and Vulgate 14:42 has no Bel verse at all. Esther 10:4-16:24 is the separate book EsthGr under the Vulgate's own numbers, except in chapter 15: Vulgate 15:1-3 is absent, 15:4-12 is EsthGr 15:1-9, 15:13-14 is the single EsthGr 15:10, and 15:15 is EsthGr 15:11-12 and so refuses. Ecclesiasticus is withheld whole but for one verse. The Vulgate and the Greek divide that book differently in all fifty-one chapters, only 412 of 1591 Douay verses stand at the same number, and the difference is mostly the Latin subdividing a Greek bicolon; an alignment computed between two independent translations would be a guess with a table's authority. The exception was read: Vulgate 36:18 is the introit Da pacem Domine sustinentibus te and is this edition's 36:16, while its own 36:18 is the proverb of the belly, which is what a citation of it returned until now. Two rows are refusals peculiar to this edition. Its SgThree 55 repeats the mountains of its 53, where the Revised Version and the Latin both have the seas and rivers, so its 55 and 56 are one line out of step; Vulgate Daniel 3:77 and 3:78 are withheld here and resolve correctly in the Revised Version. That departure is declared in scripts/_deuterocanon.py with both openings and is checked against both tracked texts, so it cannot outlive the defect."
