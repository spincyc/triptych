notes = "Eleven rows, all withholdings: an empty resolves_to means a citation naming this locus cannot be answered from this edition, whatever it prints at those numbers. Seven are the Daniel canon divergence and four are Psalm 13, where the tracked psalm concordance's English offset is wrong. No verse of this edition is merged away, so no row of the other kind is needed."
