provenance = "Created by Triptych on 2026-07-31. This edition merges no verses, so every row is of the other kind: a locus a citation may name that this edition cannot answer at those numbers, recorded because the edition prints real text there and a lookup would otherwise return it. Only the overlap needs a row. Vulgate Daniel 3:24-90 is the Greek addition; this edition's Daniel 3 runs to verse 30, so 3:24-30 are recorded here and 3:31-90 refuse for want of the verses. The correspondence with the separate book is deliberately not asserted: it is not a uniform offset — Vulgate Daniel 3:52 is verse 29 of that book and Vulgate 3:89 is verse 67, not 66 — so a resolution would have to be checked verse by verse, and a refusal is the only answer that cannot be mistaken for the text. Psalm 13:3-6 is withheld for a different reason. The psalm concordance tracked under the Douay-Rheims marks Hebrew Psalm 13 as uniformly offset from the English convention, and it is not: this edition's 13:2 carries the whole of Vulgate 12:2-3, so from its third verse to the end the psalm stands one verse ahead of what a Vulgate or Hebrew numbered citation of the same number means. The concordance is the record that would have to be corrected; until it is, those four loci refuse here rather than answering with the following verse."
