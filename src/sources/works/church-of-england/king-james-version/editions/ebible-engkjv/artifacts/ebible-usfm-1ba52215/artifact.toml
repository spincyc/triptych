rights_basis = "The King James Version was published in 1611 and this is its standardized text of 1769. It is in the public domain in the United States and everywhere else except the United Kingdom. The one exception is real: the translation is held there under the Crown's perpetual letters patent, which have no expiry, and printing it in the United Kingdom or importing printed copies into it is reserved to the Crown's patentees — Cambridge University Press, Oxford University Press and Collins. The decree has no effect outside the United Kingdom. eBible.org distributes this text as eng-kjv, marks it public domain, and states the same United Kingdom exception in its own notice. This derivative carries only the scripture text with a mechanical reference column: none of the translators' marginal notes, none of the Strong's number annotations the electronic edition adds, and none of the 1611 preface or added headings."
rights_jurisdiction = "United States"
source_url = "https://eBible.org/Scriptures/eng-kjv_usfm.zip"
provenance = "eBible.org's USFM distribution package for eng-kjv, downloaded and hashed on 2026-07-31. Its own copyright page dates the source files 16 May 2026 and describes the contents as the King James or Authorized Version using the standardized text of 1769, with Apocrypha. Not retained: the verse text extracted from it is registered as tracked artifacts under this edition, and the marginal-note apparatus, Strong's number annotations and 1611 preface it also carries are not used."
