notes = "81 USFM files: one front-matter file carrying the 1611 preface and 80 book files, 39 of the Old Testament, 14 of the Apocrypha and 27 of the New Testament. The Old Testament and New Testament files carry Strong's number attributes on most words; the Apocrypha files come from a separate transcription and carry none."
