transformation = "Parse the USFM of eBible.org's eng-kjv release into one verse per line. Read \\c for the chapter and \\v for the verse, and take the text between one \\v and the next, continuation lines included. Drop the content of \\f footnotes entirely: they are the translators' marginal alternatives and Hebrew glosses, which are apparatus and not the text appointed to be read. Drop every USFM attribute list, which in the Old Testament is the Strong's number the electronic edition attaches to each word and is not part of the King James text. Unwrap character markup, keeping the words it encloses: \\w and \\+w for words, \\add for the words the translators supplied and printed in italic, which belong to the verse, and \\nd, \\wj and \\tl. A closing marker is removed without leaving a space, because the text writes \\nd LORD\\nd* immediately before an apostrophe. Discard every remaining marker: they are paragraph, poetry and heading structure rather than text. Drop the pilcrows the standardized text prints to open a paragraph — 2970 of them, every one at the head of a verse — for the same reason the \\p markers they duplicate are dropped. The \\d psalm inscriptions are not emitted: this edition prints them but gives them no verse number, so there is no verse for them to be, and that absence is the numbering fact recorded in the edition record. Collapse runs of whitespace to one space and strip the ends. Emit \"book<TAB>chapter<TAB>verse<TAB>text\" with a header line, LF terminated. Book tokens are the Douay-Rheims tokens registered in that edition's book index wherever the two carry the same book, so a citation addresses the same book in either edition; the seven books this edition prints that the Douay-Rheims has no separate book for take new tokens. The mapping is by USFM book code, not by file order. The front matter file, which carries the 1611 preface The Translators to the Reader, is not scripture and is not read."
