description = "The English translation resolved on at the Hampton Court Conference in 1604, made by six companies of divines of the Church of England from the Hebrew, Aramaic and Greek with the earlier English versions before them, published in 1611 and appointed to be read in churches. Its canon is the Church of England's: the Hebrew Old Testament, the Apocrypha in a section of its own between the Testaments, and the New Testament. That section is not the Catholic deuterocanon and edition records must not be read as though it were — it adds 1 Esdras, 2 Esdras and the Prayer of Manasses, which the Council of Trent did not receive, and it prints the Greek additions to Esther and Daniel as separate books rather than inside the books the Vulgate integrates them into. Edition records distinguish the 1611 text, the standardized text of 1769 that ordinary printings descend from, later revisions such as the Revised Version, and delivery artifacts."
