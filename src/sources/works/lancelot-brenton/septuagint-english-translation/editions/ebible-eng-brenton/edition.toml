notes = "eBible.org distributes this text as \"Brenton Septuagint Translation\" and marks it public domain, stating that it was published in 1851 and is now in the public domain. It carries the English translation alone; the facing Greek of the printed book is not in the release and is not registered here. Fifty-three books carry verse text, 29004 verses in 1116 chapters, and there is no New Testament. This edition is registered as a source-library text and is deliberately NOT registered as an indexable bible in tools/index-bible. The reason is its versification. Nine tenths of the Old Testament citations the tracked calendars make are numbered from the Vulgate, and the Septuagint does not number the same way: its Jeremias is about an eighth shorter than the Vulgate's and prints the oracles against the nations as chapters 25-31 where the Vulgate prints them as 46-51, so every Vulgate citation of Jeremias past chapter 25 would resolve here to entirely different matter; its Joel has four chapters where the Vulgate has three and its Malachias three where the Vulgate has four; its Isaias 8-9 and Micheas 4-5 divide as the Nova Vulgata divides them and not as the Vulgate does; its Proverbs prints no chapter 30 and begins three chapters at a verse other than 1; and it restarts Psalms 115 and 147 at verse 1. Those are not divergences an edition-level verse-alias table can carry, because the reader resolves a chapter's bounds before it consults that table and because the divergences are whole-book reorderings rather than verse shifts. Indexing it would therefore have produced a large body of citations resolving silently to the wrong words, which is the one failure the indexing machinery exists to prevent. The text is registered, hashed, searchable and complete, and it is available for collation against the Vulgate and the Douay-Rheims by locus; it is not available as an answer to a Missal or Lectionary citation. Two further limits belong on any reuse: its canon is not the canon of Trent, adding 1 Esdras, the Prayer of Manasses, 3 and 4 Maccabees and Psalm 151 and splitting the Epistle of Jeremias, Susanna and Bel out of Baruch and Daniel; and its Ezra file is the Septuagint's second book of Esdras entire, Ezra and Nehemias run together in 23 chapters, so the thirteen chapters of Nehemias stand twice in this deposit, once under token 1Esd as chapters 11-23 and once under token 2Esd as chapters 1-13, and a consumer must not count them twice."
