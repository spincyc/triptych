rights_basis = "eBible.org publishes this release with the copyright statement “Published in 1851, and now in the Public Domain.” Sir Lancelot Charles Lee Brenton died in 1862 and the translation was published in 1851, so it is out of copyright in the United States and everywhere its term runs from publication or from the translator's death. This derivative contains only the scripture text with a mechanical reference column, and none of the release's footnotes, headings, front matter, or the facing Greek of the printed book."
