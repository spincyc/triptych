provenance = "Created by Triptych on 2026-07-31. This edition merges no verse away, so the one row it carries is a withholding. It restarts Psalms 115 and 147 at verse 1 where the Vulgate prints them as verses 10-19 and 12-20; Psalm 147:12-20 falls past the end of the verses printed here and is refused before any alias is consulted, while Psalm 115:10 is inside the chapter's bounds and would otherwise answer with the wrong verse. The far larger divergences of this edition are not recorded here because no alias can reach them: they are whole books and whole chapters the Septuagint divides or orders differently from the Vulgate, above all Jeremias, and they are recorded book by book in the book index instead."
