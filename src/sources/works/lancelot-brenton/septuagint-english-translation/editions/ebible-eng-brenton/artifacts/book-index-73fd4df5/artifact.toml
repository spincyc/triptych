notes = "53 books and no New Testament: this is the Septuagint alone. It is not the Catholic canon. It adds 1 Esdras, the Prayer of Manasses, 3 Maccabees, 4 Maccabees and Psalm 151, none of which Trent received, and it prints the Epistle of Jeremias, Susanna and Bel as separate books rather than inside Baruch and Daniel. Its chapter division follows the Septuagint and departs from the Vulgate's in Jeremias, whose oracles against the nations stand as chapters 25-31 where the Vulgate prints them as 46-51, and in Joel, Malachias, Isaias, Micheas and Proverbs. The note column records each one."
