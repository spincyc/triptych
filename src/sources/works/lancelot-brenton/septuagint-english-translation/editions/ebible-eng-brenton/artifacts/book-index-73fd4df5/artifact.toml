provenance = "Compiled by Triptych on 2026-07-31 from the eBible.org eng-Brenton release. Each USFM file was matched to its row by book code and its chapter and verse counts read from the extracted text. The token, Douay title, Missal abbreviation and alternate names are those of the Douay-Rheims Challoner book index wherever this edition carries the same book, so a citation resolves to the same token in either; the ordinal, file name, edition title and counts are this edition's own, and the ordinals follow the Septuagint order rather than the Vulgate's. Six books take tokens the Douay-Rheims has no separate book for: EpJer, Sus and Bel, which the Vulgate prints inside Baruch and Daniel, and 1Esdras, PrMan, 3Mach and 4Mach, which are not in the Catholic canon. Every book whose chapter division differs from the Vulgate's is recorded in the note column."
