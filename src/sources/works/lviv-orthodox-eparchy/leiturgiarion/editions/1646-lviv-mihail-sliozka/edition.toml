notes = "Google Books jr1nAAAAcAAJ identifies the digital volume as Leiturgiarion, typ. M. Sljozka, 1646, original from the National Library of the Czech Republic, digitized 2 May 2016. No physical shelfmark was established. Only exact flat page images PA1, PP3, PP4 and PP7 are retained: PA1 is a printed service heading, not the publication title or colophon; the other three are blank preliminary leaves. The edition attribution remains catalogue-based for this digital copy: its original printed title/date leaves were not inspected. A distinct Chernihiv museum copy АЛ-674 independently supplied a 1646-08-23 colophon in the Hungarian research, but is not this Czech copy and its modern object photographs are not retained. Neither complete-book acquisition, physical completeness, transcription, collation, nor Hungarian reception is asserted. A whole-PDF request in the 2026-10-20 research pass returned HTTP 429; no ongoing delivery availability is assumed."
