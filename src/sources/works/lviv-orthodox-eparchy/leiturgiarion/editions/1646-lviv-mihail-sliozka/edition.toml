notes = "The Czech digital copy is now identified by the holding library: Slovanská knihovna A 003340, SLK000577538, barcode 3186213823. MARC856 links NKP:3186213823 and the retrieved Google barcode route resolves jr1nAAAAcAAJ. The catalogue supplies [Služebnik] / [Leiturgiarion], [Lvov], [typ. M. Sljozka], [1646], describes 305 surviving folios, and explicitly reports missing front/title and terminal leaves, with a count eleven versus ten enumerated that remains unresolved. It reports only the lower half of folio 304 surviving and a 1962 rebinding. Original title/imprint/colophon leaves were not inspected and the attribution remains catalogue-based for this Czech copy. Existing exact PA1, PP3, PP4 and PP7 images remain unchanged. New bounded PA303/PT1/PT2 scans show dismissal text and a blank; PA303 has a pencil 302, so Google page IDs do not establish native foliation. No whole-volume acquisition, complete contents, transcription, collation, or Hungarian reception is claimed. The offered whole PDF again returned HTTP429. The distinct Chernihiv museum copy АЛ-674 supplied the independently inspected 1646-08-23 colophon in earlier research; that modern museum photograph remains separate and is not newly acquired or attributed to the Czech copy. Two additional bounded images PA146-IA1 and PA147-IA1 show old printed liturgy text; their physical loci are not mapped and they do not identify the catalogue-reported f146v annotation."
