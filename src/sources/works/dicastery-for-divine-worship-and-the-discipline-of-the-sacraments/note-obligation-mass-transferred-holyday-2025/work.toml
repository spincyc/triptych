description = "Note Prot. 51/25, Vatican City, 23 January 2025, signed by Arthur Card. Roche, Prefect, and Archbishop Vittorio Francesco Viola, Secretary, after consultation of the Dicastery for Legislative Texts: in an occasional transfer of a holy day of obligation the obligation to attend Mass is not transferred to the day ad quem."
