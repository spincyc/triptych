context = "The whole Note, nn. 1-7. Occurrentia festorum is governed by the Universal Norms (nn. 59-60, the Table of Liturgical Days and the transfer of an impeded solemnity). The question: when a holy day is transferred, is the obligation binding on the day ad quem? CIC cc. 1246-1248 do not provide for occasional transfer; c. 1246 §2 concerns permanent suppressions or transfers by conferences. The matter is liturgical, and the curial body's past interventions attest a well-established practice that the obligation does not transfer. N. 7: since that practice is not contrary to the Code, it is to be held liturgical law (cf. c. 2) that in an occasional transfer of a holy day of obligation the obligation to attend Mass is not transferred to the day ad quem."
