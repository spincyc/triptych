rights_basis = "Rights in this issue are not established and are not assumed. It was published in the United States in 1958, which is late enough that the term depends on facts about notice and renewal that neither the retrieving research lane nor this registration checked. What the lane did record is narrower and is recorded as what it is: that the Navalog is a United States Naval Base publication digitised by the Library of Congress in the National Digital Newspaper Program and that the Library asserts no rights restriction in its own record, WHILE SAYING IN THE SAME BREATH that 'the date is late enough that a rights check should be repeated before publication'. That warning is the reason this record does not resolve the question in either direction. `unresolved` keeps the guard that matters, since TRACKABLE_RIGHTS excludes it and nothing may install the payload. A reader with no network cannot presently reopen this page here, and closing that needs a rights check on this title rather than an assertion from this stage. The index is the Library's optical reading of this page and can carry no better right than the page it reads."
