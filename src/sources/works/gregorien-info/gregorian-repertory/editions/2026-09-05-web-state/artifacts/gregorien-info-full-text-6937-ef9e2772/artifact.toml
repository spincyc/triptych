notes = "One complete chant page: Communio 'Panis quem ego dedero caro', chant identifier 6089, reached through the full-text index. Its Antiphonale Missarum Sextuplex calendar gives nr. 44 and nr. 186 and NOT nr. 187: in the six early antiphonaries this is the Fourteenth Sunday's Communion, not the Fifteenth's. The page is the database's record, not a manuscript and not Hesbert's printed page. Not retained: the site's own compilation and markup, for which no licence statement was found in the retrieved bytes. A reader without the network cannot open this page from a checkout; the Antiphonale Missarum Sextuplex numbers and sigla a claim depends on must be quoted into the claim's own record, and they remain the database's report of Hesbert rather than Hesbert's pages."
