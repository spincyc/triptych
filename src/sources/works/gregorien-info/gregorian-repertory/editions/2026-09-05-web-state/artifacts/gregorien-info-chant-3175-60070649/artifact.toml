notes = "One complete chant page: Offertorium 'Exspectans exspectavi Dominum'. Its Antiphonale Missarum Sextuplex calendar gives 'Feria III Hebdomada IV Quadragesima - B C K S' at nr. 62 and 'Dominica XV post Pentecosten - B K' at nr. 187. The page is the database's record, not a manuscript and not Hesbert's printed page. Not retained: the site's own compilation and markup, for which no licence statement was found in the retrieved bytes. A reader without the network cannot open this page from a checkout; the Antiphonale Missarum Sextuplex numbers and sigla a claim depends on must be quoted into the claim's own record, and they remain the database's report of Hesbert rather than Hesbert's pages."
