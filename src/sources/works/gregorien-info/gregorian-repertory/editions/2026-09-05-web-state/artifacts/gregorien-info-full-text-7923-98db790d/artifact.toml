notes = "One complete chant page: Versus alleluiaticus 'Quoniam Deus magnus Dominus...terram'. Its Antiphonale Missarum Sextuplex calendar gives eight assignments at Hesbert nn. 83, 84, 85, 88a, 90, 176, 180b and 199a, three of them the general 'De circulo anni' pool, and none at any Sunday after Pentecost later than the Eighth. The page is the database's record, not a manuscript and not Hesbert's printed page. Not retained: the site's own compilation and markup, for which no licence statement was found in the retrieved bytes. A reader without the network cannot open this page from a checkout; the Antiphonale Missarum Sextuplex numbers and sigla a claim depends on must be quoted into the claim's own record, and they remain the database's report of Hesbert rather than Hesbert's pages."
