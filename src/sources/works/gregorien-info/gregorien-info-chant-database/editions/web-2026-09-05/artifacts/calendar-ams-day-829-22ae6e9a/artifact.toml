notes = "Rendered gregorien.info page carrying the Sextuplex \"De circulo anni\" alleluia list, the list in which Cantate Domino canticum novum stands and which is why that alleluia carries no post-Pentecost Sunday number. Extent as measured by the retrieving lane: The complete AMS 'De circulo anni' alleluia list as the database renders it -- the list in which Cantate Domino canticum novum is placed, and which is why it carries no post-Pentecost Sunday number.. ACCESS LIMITATION. These exact bytes are not retained because the delivery states no distribution basis for the site's own database view; a reader without the network cannot open this page from a checkout, and this repository holds no other copy of the database's readings. What it says about a manuscript is the database's reading and remains an unverified lead until collated against the manuscript or against Hesbert's printed Antiphonale Missarum Sextuplex."
