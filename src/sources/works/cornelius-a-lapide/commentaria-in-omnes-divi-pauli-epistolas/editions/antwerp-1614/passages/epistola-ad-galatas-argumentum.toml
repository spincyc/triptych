context = "A Lapide reports that the Syriac and Greek end-subscriptions, Jerome, Athanasius's Synopsis, Theodoret's Pauline preface, and others assign Galatians to Rome. He immediately reports that Chrysostom and Baronius deny Rome and place it before Romans, at Ephesus or another Greek city; he then concludes that neither the epistle nor other evidence permits a certain determination of its time or place and calls it, in that respect, the most uncertain of Paul's letters."
verified_on = "2026-08-21"
notes = "Read directly on printed p. 457, artifact PDF p. 514. This passage supports a faithful report of the Roman subscription-and-patristic tradition together with a Lapide's preserved countertradition and explicit uncertainty. It does not support 'a Lapide teaches Rome,' a unanimous patristic claim, or independent verification here of each earlier author he names."
