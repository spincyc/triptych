context = "Within the general proemium's numbered ordering of Paul's letters, the sixth entry dates Galatians to AD 58. The chronological series concludes by identifying Baronius as its source. This passage therefore controls the statement 'AD 58 in the Baronius-based chronology reproduced by a Lapide,' not an unqualified modern date or a claim that a Lapide independently derived the year."
