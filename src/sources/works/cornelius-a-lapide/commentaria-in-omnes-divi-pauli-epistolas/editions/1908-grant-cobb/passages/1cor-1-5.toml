text = "That in everything ye are enriched by Him (by Christ), in all utterance (of the preaching of the Gospel), and in all knowledge, that is, in spiritual understanding of Him. In other words, I give thanks to God, because by me and Apollos He put before you, richly, the preaching and doctrine of the Gospel and a perception and understanding of it."
