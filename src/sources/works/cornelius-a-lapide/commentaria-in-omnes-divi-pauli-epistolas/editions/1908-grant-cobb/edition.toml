notes = "Both title pages were checked. Volume 7 editor’s preface, dated 1895, explicitly describes shortening the original and correcting some factual mistakes; this is an abridged historical English translation and editorial expression, not the complete Latin commentary. The acquired volumes cover only I–II Corinthians and Galatians, not all Pauline epistles. The author is Cornelius a Lapide; Cobb is translator and editor."
