notes = "Retained because these notes are the decisive Catholic witness on the hour: a Lapide infers night at verse 5 from the command itself, and eight columns later explains the deep sleep of verse 12 by a full day's labour, without reconciling the two. The transcription is from a text layer and its reliability is bounded by that; the chapter number in his citation of Augustine is not legible with confidence and is not reproduced."
