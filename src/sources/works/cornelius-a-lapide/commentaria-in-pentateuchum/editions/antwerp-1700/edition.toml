notes = "The exact printing behind the Internet Archive digitization used here. Its title page names Cornelius a Lapide as author and gives the year 1700; the imprint could not be read from the text layer, so the place and printer are left unclaimed rather than guessed. The text is in the old orthography, with long s and with ae and oe ligatures. Keep this printing distinct from the nineteenth-century Vives edition and from the partial English translations of a Lapide, none of which was consulted."
