description = "The Flemish Jesuit Cornelius a Lapide's Latin commentary on the five books of Moses, first published in 1616 and reprinted throughout the seventeenth and eighteenth centuries. It is a compilation as much as a commentary: a Lapide collects Fathers, scholastics, rabbis, and contemporary Catholic exegetes on each lemma, frequently at second hand through Pererius, and his reports of those authorities are evidence about him rather than about them. A locus is BookToken.chapter.verse."
