text = "And Jesus going up, &c. This was the last journey of Christ to Jerusalem. From S. John xi. 54., &c., it is clear that after raising Lazarus He had departed to the city of Ephraim, to escape the hatred of the Pharisees, and now from that city on the approach of that Passover, when He was put to death by the Jews, He went up to Jerusalem according to the law. And truly He went up that He might accept, and, as it were, eagerly seize the cross and death appointed for Him in Jerusalem, and prepared by the decree of the Father for the redemption of the world."
