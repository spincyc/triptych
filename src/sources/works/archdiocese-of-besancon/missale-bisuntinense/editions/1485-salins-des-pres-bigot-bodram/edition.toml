notes = "The historical year and place are read from the original final red colophon at Mémoire Vive viewer image 606. The printer notice at image 267 names the three printers and declares the express mandate of Caroli de Novocastro and conformity to the Besançon customary. These are printed claims, not a separately located and dated promulgation instrument. The conventional title and INC.98 shelfmark are supplied by the municipal library catalogue; no conventional printed title leaf appears among the inspected first three images. Calendar, preparation, Ordo, Canon and colophons were inspected at selected pages; all 606 image descriptions were enumerated, but the whole facsimile was not acquired or collated. The library reports that its copy lacks the final blank leaf. Handwritten additions and an inserted crucifixion image do not silently become printed content. Viewer images 2–3 show a separate mounted indulgence sheet and its annotated reverse, dated 1483 by the holding catalogue; image 1 is a manuscript preliminary, and image 400 is an added engraving. These four images are physical-copy context only and are not attributed to the 1485 printed contents. Their exact-delivery restrictions supply their record disposition; no public-domain assertion is made about their separately unidentified contents."
