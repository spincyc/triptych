description = "A Kentucky seed-warranty appeal in which a farmer bought a sack labelled pure alfalfa that in fact held sweet clover. The opinion re-literalises Galatians 6:7, the verse the 1962 Missal appoints at the Fifteenth Sunday after Pentecost, and then declares it falsified by the facts: the buyer was confronted, so far as he intended, with a crop other than the one he sowed. A locus is a printed page of 238 Ky."
