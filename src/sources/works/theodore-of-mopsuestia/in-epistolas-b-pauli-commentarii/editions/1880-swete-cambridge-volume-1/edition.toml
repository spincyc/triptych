notes = "Swete prints the ancient anonymous Latin translation with Greek fragments and an extensive introduction. The Latin witnesses had circulated under Ambrose or Hilary; Swete argues from their contents and agreements with extant Greek fragments that the work is Theodore's. No surviving Greek fragment printed here independently preserves the exact Galatians 3:19 identification of the mediator as Moses."
