context = "On Galatians 3:19-20, the ancient Latin version of Theodore's commentary says that the Law was added because of transgressions, was ministered by angels, and names Moses as the referent of 'in the hand of a mediator.' It explains Moses's mediation between God and the people and insists that the same one God gave the Law and manifested the more excellent realities belonging to Christ."
verified_on = "2026-08-21"
notes = "Read directly at printed pp. 47-49, artifact PDF pp. 146-148; the decisive sentence appears on printed p. 48: 'quod dixit: in manu mediatoris, Moysi dicit.' This supports the narrow claim that Theodore's transmitted commentary identifies the mediator here as Moses. Because no Greek fragment at this exact point survives in Swete, cite it as the ancient Latin version's witness to Theodore's sense, not as an exact reconstruction of Theodore's Greek wording or a denial of Christ's mediation in other senses."
