context = "The Latin title expressly identifies the Maronite rite and prints Rome, Typographia Medicea, 1594. The native title leaf has a Latin imprint dated 1592. The Latin colophon repeats 1594, names Clement VIII, Cardinal protector Gabriele Paleotti and Maronite Patriarch Sergio Rizio, and carries an approbation naming Thomas de Terracina, O.P. The two printed dates coexist in this exact witness; they do not prove two separately collated book states."
