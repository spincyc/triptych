notes = "The exact witness carries 1594 on its Latin title and colophon (PDF pages 5 and 296), while the native title's Latin imprint reads 1592 (PDF page 9). The edition's 1594 date identifies this completed printed witness; it does not erase the earlier date in the same book or assert two independently collated states. The historical title Chaldaicum does not identify the modern Chaldean Catholic rite: the title explicitly names the Maronites. Internet Archive item bub_gb_5Eqy8WGF9aQC is a Google-origin scan from the National Central Library of Rome, with 300 PDF pages. Its Serbian language metadata is not adopted. The witness is not silently identified with the 1608 Du Perron reissue. Latin occurs in the title, dedication and colophon; no complete language distribution, prayer inventory, text transcription or manuscript ancestry is established by this acquisition."
