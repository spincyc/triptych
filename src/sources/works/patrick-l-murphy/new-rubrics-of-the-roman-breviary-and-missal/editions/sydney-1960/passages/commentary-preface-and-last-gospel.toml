context = "The commentary's Preface section (p. 192) restates RGMR 482-483: a proper preface is said if the Mass has one, otherwise the preface of the season, otherwise the common preface, and a commemoration never brings its proper preface; it adds that in practice the Ordo will indicate the preface for each day. It does not treat a feast without a proper preface said on a Sunday. The Last Gospel section (p. 193) restates RGMR 509. Read on a rendered page image of PDF p. 104 and in its text layer."
notes = "Practical commentary of 1960, secondary to the code it explains. No quotation beyond the clause on the Ordo is recorded."
