id = "work.patrick-l-murphy.new-rubrics-of-the-roman-breviary-and-missal"
title = "The New Rubrics of the Roman Breviary and Missal: Translation and Commentary"
responsible = "Patrick L. Murphy"
work_type = "liturgical-commentary"
languages = ["en"]
description = "An English translation, edited by Patrick Laurence Murphy of St Patrick's College, Manly (later auxiliary bishop in Sydney and first bishop of Broken Bay), of the 1960 code of rubrics with John XXIII's apostolic letter and the decree of the Sacred Congregation of Rites, followed by a practical commentary. The preface records that Father C. B. O'Donoghue translated part. The translation is a secondary witness to the Latin code, which controls."
relations = ["work.catholic-church.rubricae-breviarii-et-missalis-romani"]
composed = "1960"
composed_basis = "The preface refers to the motu proprio of 25 July 1960 and its publication in the Acta Apostolicae Sedis of 15 August 1960; the title page is dated 1960 and the imprimatur Sydney, 6 December 1960."
