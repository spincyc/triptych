notes = "Directly inspected at PL 26 col. 18, artifact PDF p. 14. The adjacent Vallarsi note reports contrary ancient testimony and the Syriac version's Egypt/Alexandria claim; this passage therefore supports faithful reporting of Jerome's attribution while preserving the edition's visible disagreement. It does not establish a precise city, year, manuscript stemma, or modern critical consensus."
