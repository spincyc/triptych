context = "In his prologue's ordered account of the four canonical evangelists, Jerome identifies Luke as a physician, a Syrian of Antioch, and a disciple of Paul, and says that Luke composed his volume in the regions of Achaia and Boeotia. This controls attribution of that Achaia-Boeotia provenance as Jerome's ancient testimony, not as an independently demonstrated modern historical conclusion."
