text = """
(Cap. XI.—Vers. 28.) Et mortuus est Aran ante patrem suum in terra, qua natus est in regione Chaldaeorum. Pro eo, quod legimus, in regione Chaldaeorum, in Hebraeo habetur, in UR CHESDIM (כשדים באור), id est in igne Chaldaeorum. Tradunt autem Hebraei ex hac occasione, istiusmodi fabulam: Quod Abraham in ignem missus sit, quia ignem adorare noluerit, quem Chaldaei colunt, et Dei auxilio liberatus, de idololatriae igne profugerit: quod in sequentibus scribitur, egressum esse Tharam cum sobole sua de regione Chaldaeorum: pro quo in Hebraeo habetur, de incendio Chaldaeorum. Et hoc esse quod nunc dicitur: Mortuus est Aran ante conspectum Thare patris sui in terra nativitatis suae, in igne Chaldaeorum: quod videlicet ignem nolens adorare, igne consumptus sit. Loquitur autem postea Dominus ad Abraham: Ego sum qui eduxi te de igne Chaldaeorum.\
"""
