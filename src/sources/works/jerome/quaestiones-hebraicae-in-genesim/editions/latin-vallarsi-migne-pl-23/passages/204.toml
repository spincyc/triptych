text = """
(Vers. 5.) Et nunc ecce duo filii tui, qui nati sunt tibi in terra Aegypti, antequam venirem ad te in Aegypto, mei sunt, Ephraim, et Manasse, quasi Ruben, et quasi Simeon erunt mihi. Quos autem generaveris post haec, tui erunt. In nomine fratrum suorum vocabuntur. Si quis ambigebat, quod septuaginta animae introissent Aegyptum, filiorum Israel, et quod Joseph eo tempore, quo ingressus est Jacob, non novem, sed duos tantum filios habuerit, praesenti capitulo confirmatur. Siquidem ipse Jacob loquitur, duos eum filios habuisse, non novem. Quod autem dicit, Ephraim et Manasse, sicut Ruben et Simeon erunt mihi, illud significat, sicut Ruben et Simeon duae tribus erunt, et ex suis vocabulis appellabuntur; sic Ephraim et Manasse duae tribus erunt, duosque populos procreabunt, et sic haereditabunt repromissionis terram, sicut et filii mei. Reliqui autem, ait, filii, quos post mortem meam genueris, ostendens necdum illo tempore procreatos, tui erunt.\
"""
