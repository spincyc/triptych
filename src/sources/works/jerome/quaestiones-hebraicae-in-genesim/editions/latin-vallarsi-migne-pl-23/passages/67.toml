text = """
(Vers. 5.) Et condiderunt gigantes in Astaroth Carnaim, et gentes fortes simul cum eis: et Ominaeos in Save civitate, antequam Sodomam pervenirent. Quatuor reges profecti de Babylone, interfecerunt gigantes, hoc est RAPHAIM (רפאים), robustos quosque [Al. quoque] Arabiae, et Zozim, in Hom, et Emim in civitate Save, quae usque hodie sic vocatur. ZUZIM (זוזים) autem et EMIM (אימים), terribiles et horrendi interpretantur: pro quo Septuaginta, sensum magis quam verbum ex verbo transferentes, gentes fortissimas posuerunt. Porro BAEM, pro quo dixerunt, ἅμα αὐτοῖς, hoc est cum eis, putaverunt scribi per HE (ה), ducti elementi similitudine, cum per HETH scriptum sit. BAEM (בהם) enim cum per tres litteras scribitur: si mediam HE habet, interpretatur, in eis: si autem HETH, ut in praesenti, locum significat, id est, IN HOM (בחם).\
"""
