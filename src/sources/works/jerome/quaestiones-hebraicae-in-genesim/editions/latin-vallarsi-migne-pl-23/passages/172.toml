text = """
(Vers. 22.) Et fuerunt filii Lothan, Chorri et Aemam: et soror Lothan Thamna. Haec est Thamna, de qua supra dictum est. Et Thamna erat concubina Eliphaz filii primogeniti Esau, et ex ipsa natus est Amalech. Idcirco autem Chorraeorum recordatus est, quia primogenitus filiorum Esau ex filiabus eorum acceperat concubinam. Quod autem dicitur, Theman et Cenez et Amalech, et reliqua: sciamus postea regionibus Idumaeorum ex his vocabula imposita.\
"""
