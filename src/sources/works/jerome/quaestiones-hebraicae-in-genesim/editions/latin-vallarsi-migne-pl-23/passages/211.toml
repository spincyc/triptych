text = """
(Vers. 9.) Adorabunt te filii patris tui. Catulus leonis Juda, ex germine, fili mi, ascendisti, procumbens ut leo, et quasi catulus leonis. Quis suscitabit eum? Licet de Christo grande mysterium sit, tamen juxta litteram prophetatur [Al. interpretatur], quod reges ex Juda per David stirpem generentur, et quod adorent eum omnes tribus. Non enim ait, filii matris tuae, sed filii patris tui. Et quod sequitur, ex germine, fili mi, in Hebraeo habet, de captivitate, fili mi, ascendisti; ut ostenderet eum captivos populos esse ducturum: et juxta intelligentiam sacratiorem, ascendisse in altum, et captivam duxisse captivitatem (Psal. LXVII). Sive quod melius puto, captivitas passionem, ascensus resurrectionem signat.\
"""
