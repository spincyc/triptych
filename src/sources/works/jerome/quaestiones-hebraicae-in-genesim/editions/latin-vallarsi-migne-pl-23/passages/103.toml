text = """
(Vers. 13.) Et elevavit Abraham oculos suos: et ecce aries post tergum ejus tenebatur in virgulto Sabech cornibus suis. Ridiculam rem in hoc loco Emisenus Eusebius est locutus: Sabech, inquiens, dicitur hircus, qui rectis cornibus et ad carpendas arboris frondes sublimis attollitur. Rursum Aquila συχνεῶνα interpretatus est, quem nos veprem possumus dicere, vel spinetum: et ut verbi vim interpretemur, condensa et inter se implexa virgulta. Unde et Symmachus in eamdem ductus opinionem, Et apparuit, ait, aries post hoc retentus in rete cornibus suis. Verum quibusdam, in hoc dumtaxat loco, melius videntur interpretati esse Septuaginta et Theodotio, qui ipsum nomen SABECH (סבך) posuerunt, dicentes: In virgulto sabech cornibus suis. Etenim σύχνεων, sive rete, quod Aquila posuit et Symmachus, per SIN (ש) litteram scribitur: hic vero (ס) SAMECH littera posita est: ex quo manifestum est non interpretationem stirpium condensarum, et in modum retis inter se virgulta contexta verbum Sabech, sed nomen sonare virgulti, quod ita Hebraice dicitur. Ego vero diligenter inquirens, συχνεῶνα per SAMECH (ס) litteram scribi crebro reperi.\
"""
