text = """
(Cap. XXII.—Vers. 2.) Et dixit ei Deus: Tolle filium tuum unigenitum, quem diligis, Isaac, et vade in terram excelsam, et offer illum ibi in holocaustum super unum de montibus quem ego dicam tibi. Difficile est idioma linguae Hebraeae in Latinum sermonem vertere. Ubi nunc dicitur, vade in terram excelsam, in Hebraeo habet, MORIA (מריה), quod Aquila transtulit τὴν καταφανῆ, hoc est, lucidam: Symmachus, τῆς ὀπτασίας, hoc est, visionis. Aiunt ergo Hebraei hunc montem esse in quo postea templum conditum est in area Ornae Jebusaei, sicut et in Paralipomenis scriptum est: Et coeperunt aedificare templum in mense secundo, in secunda die mensis, in monte Moria (II Paralip. III, 1). Qui idcirco illuminans interpretatur et lucens, quia ibi est DABIR (דביר), hoc est, oraculum Dei: et Lex et Spiritus sanctus, qui docet homines veritatem, et inspirat prophetias.\
"""
