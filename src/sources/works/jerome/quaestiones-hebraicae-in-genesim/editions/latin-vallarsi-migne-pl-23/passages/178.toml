text = """
(Cap. XXXVIII.—Vers. 5.) Et adjecit, et peperit filium, et vocavit nomen ejus Selom; haec autem erat in Chazbi, quando peperit eum. Verbum Hebraeum hic pro loci vocabulo positum est, quod Aquila pro re transtulit, dicens: Et vocavit nomen ejus Selom. Et factum est ut mentiretur in partu postquam genuit Selom. Postquam enim genuit Selom, stetit partus ejus. Chazbi ergo non nomen loci, sed mendacium dicitur. Unde et in alio loco scriptum est: Mentietur opus olivae, id est, fructum oliva non faciet (Abac. III, 17).\
"""
