(Vers. 17 et 18.) Et audivit Deus Liam, et concepit, et peperit Jacob filium quintum, et dixit Lia: Dedit Deus mercedem meam mihi, quia dedi ancillam meam viro meo: et vocavit nomen ejus Issachar. Etymologiam hujus nominis Septuaginta Interpretes ediderunt, est merces. Non utique, ut plerique addito pronomine male legunt, aestimandum est ita scriptum esse, quod est merces, sed totum nomen interpretatur, est merces. Is quippe dicitur est, יש, et SACHAR (שכר), merces. Hoc autem ideo, quia mandragoris filii Ruben introitum, qui Racheli debebatur, ad se viri emerat. Sequitur:\
