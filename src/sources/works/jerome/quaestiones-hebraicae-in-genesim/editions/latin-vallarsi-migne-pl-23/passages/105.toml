physical_line_ranges = [[108, 108]]
text = """
(Vers. 20.) Et nuntiaverunt Abraham, dicentes: Ecce peperit Melcha et ipsa filios Nachor fratri tuo: Us primogenitum ejus, et Buz fratrem ejus, et Camuel patrem Syrorum, et Cased. Primogenitus Nachor fratris Abraham de Melcha uxore ejus filia Aran, natus est Us: de cujus stirpe Job descendit, sicut scriptum est in exordio voluminis ejus: Vir fuit in terra Us, nomine Job. Male igitur quidam aestimant, Job de genere esse Esau: siquidem illud quod in fine libri ipsius habetur, Eo quod de Syro sermone translatus est, et quartus sit ab Esau, et reliqua, quae ibi continentur, in Hebraeis voluminibus non habentur. Secundus natus est de Melcha Buz, quem Septuaginta Bauz transferre voluerunt. Et ex hujus genere est Balaam ille divinus (Num. XXIV, 3 et seq.; Jos. XIII, 22), ut Hebraei tradunt, qui in libro Job dicitur Eliu: primum vir sanctus, et prophetes Dei, postea per inobedientiam et desiderium munerum, dum Israel maledicere cupit, divini vocabulo nuncupatur: diciturque in eodem libro: Et iratus Eliu filius Barachiel Buzites (Job XXXII, 2), de hujus videlicet Buzi radice descendens. Camuel vero pater est Damasci. Ipsa enim vocatur Aran, quae hic pro Syria scripta est: et ipso nomine legitur in Isaia. Chased quoque quartus est, a quo Chasdim, id est, Chaldaei postea vocati sunt.\
"""
