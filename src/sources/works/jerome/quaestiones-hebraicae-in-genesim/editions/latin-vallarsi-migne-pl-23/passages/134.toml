text = """
(Cap. XXIX.—Vers. 27.) Comple ergo hebdomadam istius: et dabo etiam hanc tibi. Postquam Liam Jacob fraude deceptus pro Rachel uxorem acceperat, dicitur ei a socero Laban ut septem dies post nuptias sororis prioris expleat, et sic accipiat Rachel, pro qua iterum septem annis aliis serviturus sit. Non igitur, ut quidam male aestimant, post septem annos alios Rachel accepit uxorem, sed post septem dies nuptiarum uxoris primae. Nam sequitur: Et ingressus est ad Rachel, et dilexit Rachel magis quam Liam, et servivit ei septem annis aliis (Gen. XXIX, 30).\
"""
