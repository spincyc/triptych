text = """
(Vers. 41 et 42.) Et concipiebant pecora contra virgas Jacob, virgas quas posuerat coram pecoribus [Al. pecore] in canalibus ad concipiendum in eis, et in serotinis ovibus non ponebat; et fiebant serotina Laban, et temporanea Jacob. Hoc in Septuaginta Interpretibus non habetur, sed pro serotinis et temporaneis, aliud nescio quid, quod a sensum non pertinet, transtulerunt. Quod autem dicit Scriptura, hoc est: Jacob prudens et callidus justitiam et aequitatem etiam in nova arte servabat. Si enim omnes agnos et haedos varios pecora procreassent, erat aliqua suspicio doli, et aperte huic rei Laban invidus contraisset. Ergo ita omnia temperavit, ut et ipse fructum sui laboris acciperet, et Laban non penitus spoliaretur. Si quando oves et caprae primo tempore ascendebantur, quia melior vernus est fetus, ante ipsas ponebat virgas, ut varia soboles nasceretur. Quaecumque autem oves et caprae sero quaerebant marem, ante earum oculos non ponebat, ut unius coloris pecora nascerentur. Et quidquid primum nascebatur, suum erat, quia discolor et varium erat: quidquid postea, Laban: unius enim tam in nigro, quam in albo, coloris pecus oriebatur. In eo autem loco ubi scriptum est, ut conciperent in virgis: in Hebraeo habet JEAMENA (יחמנה). Vim verbi Hebraici nisi circumitu exprimere non possum. JEAMENA enim proprie dicitur extremus in coitu calor, quo corpus omne concutitur, et patranti voluptati vicinus est finis.\
"""
