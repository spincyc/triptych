text = """
(Cap. XLVII.—Vers. 31.) Et dixit ei, jura mihi. Et juravit ei: et adoravit Israel contra summitatem virgae ejus. Et in hoc loco quidam frustra simulant adorasse Jacob summitatem sceptri Joseph, quod videlicet honorans filium, potestatem ejus adoraverit, cum in Hebraeo multo aliter legatur: Et adoravit, inquit, Israel ad caput lectuli: quod scilicet, postquam ei juraverat filius securus de petitione, quam rogaverat, adoraverit Deum contra caput lectuli sui. Sanctus quippe, et Deo deditus vir, oppressus senectute, sic habebat lectulum positum, ut ipse jacentis habitus absque ulla difficultate ad orationem esset paratus.\
"""
