text = """
(Vers. 18.) Et factum est cum dimitteret eam anima, siquidem moriebatur: vocavit nomen ejus, Filius doloris mei: pater vero ejus vocavit nomen ejus Benjamin. In Hebraeo similitudo nominis resonat; filius enim doloris mei, quod nomen moriens mater imposuit, dicitur BENONI (בן אוני). Filius vero dextrae, hoc est, virtutis, quod Jacob mutavit, appellatur BENJAMIM. Unde errant qui putant BENJAMIM (בנימין) filium dierum interpretari. Cum enim dextera appelletur JAMIN (ימין), et finiatur in n litteram: dies quidem appellantur et ipsi JAMIM (ימים), sed in m litteram terminantur.\
"""
