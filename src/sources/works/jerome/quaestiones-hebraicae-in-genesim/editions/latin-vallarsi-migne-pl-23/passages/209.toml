text = """
(Vers. 7.) Maledictus furor eorum, quia procax; et ira eorum, quia dura: dividam eos in Jacob, et dispergam eos in Israel. Levi enim haereditatem propriam non accepit, sed in omnibus sceptris, paucas urbes ad habitandum habuit. De Simeon vero in libro Jesu scriptum est (Josue XIX), quod et ipse proprium funiculum non fuerit consecutus, sed de tribu Juda quiddam acceperit. In Paralipomenon (I, 4) autem libris manifestius scribitur, quod, cum multiplicatus fuisset, et non haberet possessionis locum, exierit in desertum. Quidam prophetice interfectos homines, Apostolos, et subnervatum taurum a Pharisaeis, Christum interpretantur.\
"""
