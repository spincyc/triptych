physical_line_ranges = [[203, 203]]
text = """
(Cap. XLVI.—Vers. 26 et seqq.) Omnes ergo animae, quae ingressae sunt cum Jacob Aegyptum, et quae exierunt de femoribus ejus, absque mulieribus filiorum Jacob, animae sexaginta sex; filii autem Joseph, qui nati sunt ei in Aegypto, animae novem. Omnes ergo animae, quae ingressae sunt cum Jacob in Aegyptum, septuaginta quinque. Quod excepto Joseph et filiis ejus sexaginta sex animae, quae egressae sunt de femoribus Jacob, introierunt Aegyptum, nulla dubitatio est. Ita enim, et paulatim per singulos supputatus numerus approbat, et in Hebraeis voluminibus invenitur. Hoc autem quod in Septuaginta legimus: Filii autem Joseph, qui nati sunt ei in Aegypto animae novem: sciamus in Hebraeo pro novem, esse duas. Ephraim quippe et Manasse, antequam Jacob intraret Aegyptum, et famis tempus ingrueret, nati sunt de Aseneth Putipharis filia in Aegypto. Sed et illud, quod supra legimus: Facti sunt autem filii Manasse, quos [Al. quem] genuit ei concubina Syra, Machir, et Machir genuit Galaad; filii autem Ephraim fratris Manasse, Suthalaam, et Thaam: filii vero Suthalaam Edem, additum est: si quidem id quod postea legimus, quasi per anticipationem factum esse describitur. Neque enim illo tempore, quo ingressus est Jacob Aegyptum, ejus aetatis erant Ephraim et Manasse, ut filios generare potuerint. Ex quo manifestum est, omnes animas, quae ingressae sunt Aegyptum de femoribus Jacob, fuisse septuaginta, dum sexaginta sex postea ingressae sunt, et repererunt [Al. pepererunt] in Aegypto tres animas, Joseph scilicet, cum duobus filiis ejus, septuagesimus autem ipse fuerit Jacob. Hanc rem, ne cui videamur adversum Scripturae auctoritatem loqui, etiam Septuaginta Interpretes in Deuteronomio (X, 22) transtulerunt, quod in septuaginta animabus ingressus sit Jacob [Al. Israel] in Aegyptum. Si quis igitur nostrae sententiae refragatur, Scripturam inter se contrariam faciet. Ipsi enim Septuaginta Interpretes, qui hic septuaginta quinque animas per πρόληψιν, cum Joseph, et posteris suis Aegyptum ingressas esse dixerunt, in Deuteronomio septuaginta tantum intrasse [Al. introisse memorant] memorarunt. Quod si e contrario nobis illud opponitur, quomodo in Actibus Apostolorum (VII), in concione Stephani dicatur ad populum, septuaginta quinque animas ingressas esse Aegyptum; facilis excusatio est. Non enim debuit sanctus Lucas, qui ipsius historiae scriptor est, in gentes Actuum Apostolorum volumen emittens, contrarium aliquid scribere adversus eam Scripturam, quae jam fuerat gentibus divulgata. Et utique majoris opinionis illo dumtaxat tempore Septuaginta Interpretum habebatur auctoritas, quam Lucae, qui ignotus, et vilis, et non magnae fidei in nationibus [Al. gentibus] ducebatur. Hoc autem generaliter observandum, quod ubicumque sancti Apostoli, aut Apostolici viri loquuntur ad populos, his plerumque testimoniis abutuntur, quae jam fuerant in gentibus divulgata: licet plerique tradant Lucam Evangelistam, ut proselytum Hebraeas litteras ignorasse.\
"""
