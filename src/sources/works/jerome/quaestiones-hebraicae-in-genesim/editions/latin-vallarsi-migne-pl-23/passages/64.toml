(Vers. 13.) Et viri Sodomorum mali et peccatores in conspectu Dei vehementer. Superflue hic in Septuaginta Interpretibus additum est, in conspectu Dei, siquidem Sodomorum coloni apud homines [Al. omnes], mali et peccatores erant. Ille autem dicitur in conspectu Dei peccator, qui potest apud homines justus videri, quomodo de Zacharia et Elizabeth in praeconio ponitur, quod fuerint justi ambo in conspectu Dei (Luc. I, 6). Et in Psalterio dicitur: Non justificabitur in conspectu tuo omnis vivens (Ps. CXLII, 2).\
"""
