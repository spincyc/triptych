text = """
(Vers. 19 et 20.) Et concepit adhuc Lia, et peperit filium sextum Jacob, et dixit Lia, Dotavit me Deus dote bona: In hoc tempore habitabit mecum vir meus, quia peperi ei sex filios: et vocavit nomen ejus Zabulon. Ubi nos posuimus, habitabit mecum, et Septuaginta interpretati sunt, diliget me: in Hebraeo habet JEZBULENI (יזבלני). Et est sensus, quia sex filios genui Jacob, propterea jam secura sum: habitabit enim mecum vir meus. Unde et filius meus vocatur habitaculum. Male igitur et violenter in libro Nominum, Zabulon, fluxus noctis interpretatur.\
"""
