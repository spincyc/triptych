text = """
(Vers. 18.) Et venit Jacob Salem civitatem Sichem in terram Chanaan, cum venisset de Mesopotamia Syriae. Error oboritur, quomodo Salem, Sichem civitas appelletur, cum Jerusalem in qua regnavit Melchisedech, Salem ante sit dicta. Aut igitur utraque urbs unius nominis est: quod etiam de pluribus Judaeae locis possumus invenire: ut idem urbis et loci nomen in alia atque alia tribu sit; aut certe istam Salem, quae nunc pro Sichem nominatur, dicimus hic interpretari consummatam, atque perfectam: et illam quae postea Jerusalem dicta est, pacificam nostro sermone transferri. Utrumque enim, accentu paululum declinato, hoc vocabulum sonat. Tradunt Hebraei, quod claudicantis femur Jacob ibi convaluerit, et sanatum sit: propterea eamdem civitatem curati atque perfecti vocabulum consecutam.\
"""
