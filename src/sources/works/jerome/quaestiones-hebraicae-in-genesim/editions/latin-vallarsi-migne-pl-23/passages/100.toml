text = """
(Vers. 30.) Et dixit: Septem oves has accipies a me, ut sint in testimonium mihi, quia ego fodi puteum istum. Ideo cognominavit nomen loci illius puteus juramenti, quia ibi juraverunt ambo. Ubi hic legitur, puteus juramenti, in Hebraeo habetur BER-SABEE (באר שבע). Duplex autem est causa cur ita appellatus sit: sive quia septem agnas Abimelech de manu Abrahae acceperit: septem enim dicuntur SABEE: sive quod ibi juraverint: quia et juramentum SABEE similiter appellatur. Quod si ante hanc causam supra nomen hoc legimus, sciamus per prolepsim dictum esse: sicut et Bethel et Galgala, quae utique usque ad tempus quo ita appellatae sunt, aliter vocabantur. Notandum autem et ex prioribus, et ex praesenti loco, quod Isaac non sit natus ad quercum Mambre, sive in Aulone Mambre, ut in Hebraeo habetur: sed in Geraris, ubi et Bersabee usque hodie oppidum est. Quae provincia ante non grande tempus, ex divisione praesidum Palaestinae, Salutaris est dicta. Hujus rei Scriptura testis est, quae ait: Et habitavit Abraham in terra Philistinorum (Gen. XXI, 34).\
"""
