(Cap. VI.—Vers. 2.) Videntes autem filii Dei filias hominum, quia bonae sunt. Verbum Hebraicum ELOIM (אלהים), communis est numeri: et Deus quippe et dii similiter appellantur: propter quod Aquila plurali numero, filios deorum ausus est dicere: Deos intelligens, Sanctos, sive Angelos. Deus enim stetit in synagoga deorum: in medio autem deos discernit. [Al. dijudicat] (Psal. LXXXI, 1). Unde et Symmachus istiusmodi sensum sequens, ait: Videntes filii potentium filias hominum, et reliqua.\
