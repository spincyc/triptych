text = """
(Vers. 11.) Alligans ad vitem pullum suum, et funiculo pullum asinae. In Hebraeo ita habet, Alligans ad vitem pullum suum, et in Sorec, filimi, asinam suam: quod videlicet pullum asinae, cui supersedit Jesus, hoc est, gentilem populum, vineae Apostolorum, qui ex Judaeis sunt, copulaverit. Et ad Sorec, id est, electam vitem, alligaverit asinam, cui supersedit, Ecclesiam ex nationibus congregatam. Quod autem dicit, fili mi, apostrophen ad ipsum Judam facit, quod Christus haec sit universa facturus. Sed et hoc sciendum, quod ubi nos legimus: Alligans ad vitem pullum suum, pro pullo in Hebraeo possit legi, urbem suam, juxta eumdem sensum aliis verbis Ecclesia demonstrata, de qua alibi scriptum est: Non potest civitas abscondi supra montem posita (Matth. V, 15). Et Fluminis impetus laetificat civitatem Dei (Psal. XLV, 5).\
"""
