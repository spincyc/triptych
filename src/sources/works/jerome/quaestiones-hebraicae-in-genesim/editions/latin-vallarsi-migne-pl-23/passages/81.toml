(Vers. 12.) Hic erit rusticus homo. Manus ejus super omnes, et manus omnium super eum, et contra faciem omnium fratrum suorum habitabit. Pro rustico in Hebraeo scriptum habet PHARA (פרא), quod interpretatur onager. Significat autem semen ejus habitaturum in eremo, id est, Sarracenos vagos, incertisque sedibus, qui universas gentes, quibus desertum ex latere jungitur incursant, et impugnantur ab omnibus.\
