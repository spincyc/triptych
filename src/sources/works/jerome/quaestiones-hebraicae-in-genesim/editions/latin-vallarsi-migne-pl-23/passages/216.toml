text = """
(Vers. 21.) Nephthalim virgultum resolutum, dans in generatione pulchritudinem. In Hebraeo ita scriptum est: Nephthalim ager irriguus, dans eloquia pulchritudinis, significans, quod aquae calidae in ipsa nascantur tribu: sive quod super lacum Genesareth, fluento Jordanis irrigua sit. Hebraei autem volunt, propter Tiberiadem, quae Legis videbatur habere notitiam, agrum irriguum, et eloquia pulchritudinis prophetari. Porro ubi nos agrum irriguum, et Septuaginta στέλεχος ἀνειμένον, id est virgultum resolutum posuerunt, in Hebraeo legitur AJALA SLUAA (אילה שלחה), quod potest et cervus emissus transferri, propter temporaneas fruges, velocitatem terrae uberioris ostendens. Sed melius, si ad doctrinam Salvatoris cuncta referamus quod ibi vel maxime docuerit, ut in Evangelio quoque scriptum est.\
"""
