text = """
(Vers. 24.) Ipse est Ana, qui invenit Jamin in deserto, cum pasceret asinos Zebeon patris sui. Multa et varia apud Hebraeos de hoc capitulo disputantur: apud Graecos quippe et nostros super hoc silentium est. Alii putant AJAMIM (הימם) maria appellata. Iisdem enim litteris scribuntur maria, quibus et nunc hic sermo descriptus est. Et volunt illum, dum pascit asinos patris sui in deserto, aquarum congregationes reperisse, quae juxta idioma linguae Hebraicae maria nuncupentur: quod scilicet stagnum repererit, cujus rei inventio in eremo difficilis est. Nonnulli putant, aquas calidas juxta Punicae linguae viciniam, quae Hebraeae contermina est, hoc vocabulo signari. Sunt qui arbitrentur onagros ab hoc admissos esse ad asinas: et ipsum istius modi reperisse concubitum, ut velocissimi ex his asini nascerentur qui vocantur JAMIM (ימים). Plerique putant, quod equarum greges ab asinis in deserto ipse fecerit primus ascendi, ut mulorum inde nova contra naturam animalia nascerentur. Aquila hunc locum ita transtulit: Ipse est Ana, qui invenit σὺν τοὺς ἐμίμ. Et Symmachus similiter τοὺς ἐμὶμ, quae interpretatio pluralem numerum significat. Septuaginta vero, et Theodotion aequaliter transtulerunt dicentes: τὸν ἰαμὶμ, quod indicat numerum singularem.\
"""
