text = """
(Vers. 22 et seqq.). Filius auctus Joseph, filius auctus super fontem filiae, gradu composito incedentes super murum. Et exacerbaverunt eum, et contenderunt, et irascebantur adversus eum, habentes sagittas. Sedit in forti arcus ejus, et dirupta sunt vincula manuum ejus, a manibus fortis Jacob, inde pascetur lapis Israel a Deo patris tui: et reliqua. Quia Septuaginta Interpretes in plerisque dissentiunt, pro interpretatione eorum, ut in Hebraeo habetur, expressimus. Et est sensus capituli: O Joseph, qui ideo sic vocaris, quia adauxit te mihi Deus, sive quia inter fratres tuos major futurus es (fortissima siquidem fuit tribus Ephraim, ut in Regnorum et Paralipomenon libris legimus); O, inquam, fili mi Joseph, qui tam pulcher es, ut te tota de muris, et turribus, ac fenestris puellarum Aegypti turba prospectet, inviderunt tibi, et te ad iracundiam provocaverunt fratres tui, habentes livoris sagittas, et zeli jaculis vulnerati. Verum tu arcum tuum et arma pugnandi posuisti in Deo, qui fortis est propugnator: et vincula tua, quibus te fratres ligaverunt, ab ipso soluta sunt, et dirupta, ut ex tuo semine tribus nascatur Ephraim, fortis, et stabilis, et instar lapidis durioris invicta, imperans quoque decem tribubus Israel.\
"""
