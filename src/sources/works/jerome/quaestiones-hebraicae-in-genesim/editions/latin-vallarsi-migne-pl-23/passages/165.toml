physical_line_ranges = [[169, 169]]
text = """
(Vers. 16.) Et factum est dum appropinquaret Chabratha in terra Chanaan, ut veniret Ephratha, peperit Rachel. Verbum Hebraicum (כברת) CHABRATHA, in consequentibus, ubi Jacob loquitur ad Joseph: Ego autem cum venirem de Mesopotamia Syriae, mortua est mater tua Rachel in terra Chanaan, in via Hippodromi, ut venirem Ephrata (Gen. XLVIII): nescio quid volentes, Hippodromum Septuaginta Interpretes transtulerunt: et statim ibi, ubi in Hebraeo dicitur: Et sepelierunt eam in via Ephrata, haec est Bethleem (Gen. XXXV, 19), rursum Septuaginta pro Ephrata posuerunt Hippodromum: cum utique si CHABRATHA Hippodromus est, Ephrata Hippodromus esse non possit. Aquila autem hoc ita transtulit: Et factum est καθ᾽ ὁδον τῆς γῆς, id est, in itinere terrae, introiens in Ephrata. Sed melius est si transferatur, in electo terrae tempore cum introiret Ephratha. Porro vernum tempus significat, cum in florem cuncta rumpuntur, et anni tempus electum est: vel cum transeuntes per viam carpunt, et eligunt e vicinis agris quodcumque ad manus venerit, diversis floribus invitati. Ephrata vero et Bethleem unius urbis vocabulum est, sub interpretatione consimili. Siquidem in frugiferam et in domum panis vertitur: propter eum panem, qui de coelo descendisse se dicit (Joan. VI).\
"""
