text = """
(Vers. 34.) Et concepit adhuc, et peperit filium, et dixit: Nunc mecum erit vir meus, quia peperi ei tres filios: ideo vocavit nomen ejus Levi. Ubi nos legimus, Apud me erit vir meus, Aquila interpretatus est, applicabitur mihi vir meus, quod Hebraice dicitur (ילוה), ILLAVE, et a doctoribus Hebraeorum aliter transfertur, ut dicant, prosequetur me vir meus, id est, non ambigo de amore in me viri mei: erit mihi in hac vita comes, et ejus dilectio me ad mortem usque deducet, et prosequetur: tres enim filios ei genui.\
"""
