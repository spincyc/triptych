text = """
(Cap. XXIII—Vers. 2.) Et mortua est Sara in civitate Arboc, quae est in valle: haec est Chebron, in terra Chanaan. Hoc quod hic positum est, quae est in valle, in authenticis codicibus non habetur. Nomen quoque civitatis Arboc paulatim a scribentibus legentibusque corruptum est. Neque enim putandum, Septuaginta Interpretes nomen civitatis Hebraeae, barbare atque corrupte, et aliter quam in suo dicitur, transtulisse. Arboc enim nihil omnino significat. Sed dicitur ARBEE (ארבע), hoc est, quatuor, quia ibi Abraham, et Isaac, et Jacob conditus est: et ipse princeps humani generis Adam, ut in Jesu libro apertius demonstrabitur.\
"""
