text = """
(Vers. 46.) Et dixit Jacob fratribus suis, Colligamus lapides. Et congregatis lapidibus fecerunt acervum, et comederunt super eum. Et vocavit illum Laban acervum testimonii, et Jacob vocavit illum acervum testis. Acervus Hebraea lingua (גל) GAL dicitur: AAD (עד) vero testimonium. Rursum lingua Syra acervus IGAR appellatur: testimonium SEDUTHA (שהדותא). Jacob igitur acervum testimonii, hoc est, GALAAD lingua appellavit Hebraea: Laban vero idipsum, id est, acervum testimonii, IGAR SEDUTHA, gentis suae sermone vocavit. Erat enim Syrus, et antiquam linguam parentum, provinciae, in qua habitabat, sermone mutaverat.\
"""
