text = """
(Vers. 7 et 8.) Et concepit adhuc, et peperit Bala ancilla Rachel filium secundum Jacob: et dixit Rachel: Habitare fecit me Deus habitatione cum sorore mea, et invalui: et vocavit nomen ejus Nephthalim. Causam nominis Nephthalim, alia hic multo exponitur, quam in libro Hebraeorum Nominum scripta est. Unde et Aquila ait, συνανέστρεψέν με ὁ Θεὸς, καὶ συνανεστράφην, pro quo in Hebraeo scriptum est, NEPHTHULE ELOIM, NEPHTHALETHI. Unde a conversione, sive a comparatione, quia utrumque sonat, conversionem, sive comparationem, Nephthalim nomen filio imposuit. Quod autem sequitur.\
"""
