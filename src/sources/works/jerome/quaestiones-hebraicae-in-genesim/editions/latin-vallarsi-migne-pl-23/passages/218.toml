text = """
(Vers. 27.) Benjamin lupus rapax, mane comedet adhuc, et ad vesperam dabit escam.

Quam de Paulo apostolo manifestissima prophetia sit, omnibus patet, quod in adolescentia persecutus Ecclesiam, in senectute praedicator Evangelii fuerit, tamen in Hebraeo sic legitur: Benjamin lupus rapax, sive capiens, in matutino comedet praedam, et ad vesperam dividet spolia. Quod ita Hebraei edisserunt: Altare, in quo immolabantur hostiae, et victimarum sanguis ad basem illius fundebatur, in parte tribus Benjamin fuit. Hoc, inquiunt, ergo significat, quod sacerdotes mane immolant hostias, et ad vesperam dividunt ea, quae sibi a populo ex Lege collata sunt, lupum sanguinarium, lupum voracem super altaris interpretatione ponentes, et spoliorum divisionem super sacerdotibus, qui servientes altari, vivunt de altari.\
"""
