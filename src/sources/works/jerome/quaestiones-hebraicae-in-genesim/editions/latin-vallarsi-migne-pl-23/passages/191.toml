text = """
(Vers. 45.) Et vocavit Pharao nomen Joseph Saphaneth Phanee, et dedit ei Aseneth filiam Phutiphar sacerdotis Heliopoleos in uxorem. Licet Hebraice hoc nomen, absconditorum repertorem sonet, tamen quia ab Aegyptio ponitur, ipsius linguae debet habere rationem. Interpretatur ergo sermone Aegyptio SAPHANETH PHANEE (צפנת פענח), sive ut Septuaginta transferre voluerunt, Psomthom-Phanech, Salvator mundi, eo quod orbem terrae ab imminente famis excidio liberavit. Notandum autem, quod Domini quondam et emptoris sui filiam uxorem acceperit, qui ad id locorum pontifex Heliopoleos erat. Neque enim fas absque eunuchis idoli illius esse antistites, ut vera illa Hebraeorum super eo quod ante jam diximus, suspicio comprobetur.\
"""
