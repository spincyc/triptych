text = """
(Cap. XXXIII.—Vers. 1 et 2.) Et divisit pueros super Liam et super Rachel, et super duas ancillas, et posuit ancillas et filios earum primos: Liam vero et pueros ejus novissimos, et Rachel et Joseph novissimos, et ipse transivit ante eos. Non, ut plerique aestimant, tres turmas fecit, sed duas. Denique ubi nos habemus, divisit, Aquila posuit, ἡμίσευσεν, id est, dimidiavit: ut unum cuneum faceret ancillarum cum parvulis suis, et alium Liae, et Rachel, quae liberae erant, cum filiis earum: primasque ire faceret ancillas, secundas liberas: ipse autem ante utrumque gregem, fratrem adoraturus occurreret.\
"""
