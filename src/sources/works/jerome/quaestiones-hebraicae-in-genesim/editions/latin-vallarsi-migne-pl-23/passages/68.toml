text = """
(Vers. 7.) Et revertentes venerunt ad fontem judicii, haec est Cades. Per anticipationem dicitur, quod postea sic vocatum est. Significat autem locum apud Petram, qui fons judicii nominatur: quia ibi Deus populum judicavit. Et percusserunt omnem regionem Amalecitarum et Amorrhaeorum sedentem in Asasonthamar. Hoc oppidum est, quod nunc vocatur Engaddi, balsami et palmarum fertile. Porro Asasonthamar, in lingua nostra resonat, urbs Palmarum. Thamar quippe palma dicitur. Sciendum autem pro eo, quod post paululum sequitur: Et direxerunt contra eos aciem ad bellum in valle Salinarum, in Hebraeo haberi, in valle SEDDIM (שדים): quod Aquila interpretatur τῶν περιπεδίνων, Theodotio, τῶν ἀλσῶν, amoena nemora significantes.\
"""
