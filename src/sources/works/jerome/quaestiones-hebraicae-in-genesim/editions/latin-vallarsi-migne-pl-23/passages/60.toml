physical_line_ranges = [[63, 63]]
text = """
(Cap. XII.—Vers. 4.) Erant autem Abram septuaginta quinque annorum, quando egressus est ex Charra. Indissolubilis nascitur quaestio: si enim Thara pater Abrahae, cum adhuc esset in regione Chaldaea, septuaginta annorum, genuit Abram, et postea in Charra ducentesimo quinto aetatis suae anno mortuus est: quomodo nunc post mortem Thare, Abram exiens de Charra, septuaginta quinque annorum fuisse memoratur: cum a nativitate Abrae usque ad mortem patris ejus, centum triginta quinque fuisse anni doceantur. Vera est igitur illa Hebraeorum traditio, quam supra diximus, quod egressus sit Thara cum filiis suis de igne Chaldaeorum: et quod Abram Babylonio vallatus incendio, quia illud adorare nolebat, Dei sit auxilio liberatus; et ex illo tempore ei dies vitae, et tempus reputetur aetatis, ex quo confessus est Dominum, spernens idola Chaldaeorum. Potest autem fieri, ut quia Scriptura reliquit incertum, ante paucos annos Thara de Chaldaea profectus, venerit in Charran, quam mortem obierit. Vel certe statim post persecutionem in Charran venerit, et ibi diutius sit moratus. Si quis ergo huic expositioni contrarius est, quaeret aliam solutionem: et tunc recte ea, quae a nobis dicta sunt, improbabit.\
"""
