text = """
Qui in principiis librorum debebam secuturi operis argumenta proponere, cogor prius respondere maledictis, Terentii quippiam sustinens, qui comoediarum prologos in defensionem sui scenis dabat. Urgebat enim eum Luscius Lanuinus, nostro Luscio similis, et quasi publici aerarii poetam furem criminabatur. Hoc idem passus est ab aemulis et Mantuanus vates, ut cum quosdam versus Homeri transtulisset ad verbum, compilator veterum diceretur. Quibus ille respondit, magnarum esse virium, clavam Herculi extorquere de manu. Sed et Tullius, qui in arce eloquentiae Romanae stetit, rex oratorum, et Latinae linguae illustrator, repetundarum accusatur a Graecis. Non mirum ergo si contra me parvum homunculum immundae sues grunniant, et pedibus margaritas conculcent, cum adversus doctissimos viros, et qui gloria invidiam superare debuerant, livor exarserit. Verum hoc illis merito accidit, quorum in theatris, curia, concione, pro rostris eloquentia pertonabat. Semper enim in propatulo fortitudo aemulos habet, feriuntque summos Fulmina montes (Hor. Carm. II, ode X, 10). Me vero procul ab urbibus, foro, litibus, turbis remotum, sic quoque (ut Quintilianus ait) latentem invenit invidia. Unde lectorem obsecro, … si quis tamen haec quoque, si quis Captus amore leget,… ut in libris Hebraicarum Quaestionum, quos in omnem Scripturam sanctam disposui scribere, non quaerat eloquentiam, non oratorum leporem; sed magis inimicis pro nobis ipse respondeat, Novo operi veniam concedendam. Ut enim nos humiles atque pauperculi, nec habemus divitias, nec oblatas dignamur accipere: ita et illi noverint, non posse se notitiam Scripturarum, id est, divitias Christi, cum mundi pariter habere divitiis. Studii ergo nostri erit, vel eorum, qui de libris Hebraicis varia suspicantur, errores refellere: vel ea quae in Latinis et Graecis codicibus scatere videntur, auctoritati suae reddere; etymologias quoque rerum, nominum atque regionum, quae in nostro sermone non resonant, vernaculae linguae explanare ratione. Et quo facilius emendatio cognoscatur, ipsa primum, ut apud nos sunt, testimonia proponemus, et ex collatione eorum quae sequuntur, quod in illis, aut minus, aut plus, aut aliter sit, indicabimus. Neque vero Septuaginta Interpretum, ut invidi latrant, errores arguimus: nec nostrum laborem, illorum reprehensionem putamus: cum illi Ptolemaeo regi Alexandriae mystica quaeque in Scripturis sanctis prodere noluerint, et maxime ea quae Christi adventum pollicebantur: ne viderentur Judaei et alterum Deum colere: quos ille Platonis sectator magni idcirco faciebat, quia unum Deum colere dicerentur. Sed et Evangelistae, et Dominus quoque noster atque Salvator, necnon et Paulus Apostolus, multa quasi de veteri Testamento proferunt, quae in nostris codicibus non habentur. Super quibus in suis locis plenius disseremus. Ex quo perspicuum est, illa magis vera esse exemplaria, quae cum novi Testamenti auctoritate concordant. Accedit ad hoc, quod Josephus, qui Septuaginta Interpretum ponit [Al. proponit] historiam, quinque tantum ab eis libros Moysi translatos refert: quos nos quoque confitemur, plus quam caeteros cum Hebraicis consonare. Sed et hi qui postea interpretes exstiterunt, Aquilam loquor, et Symmachum, et Theodotionem, longe aliter habent, quam nos legimus. Ad extremum (quod etiam obtrectatores nostros placare potest) peregrinae merces tantum volentibus navigent [Al. navigant]: balsamum, piper, et poma palmarum rustici non emant [Al. emunt]. De Adamantio [Al. Origene] autem sileo, cujus nomen, si parva licet componere magnis, meo nomine invidiosius est, quod cum in homiliis suis, quas ad vulgum loquitur, communem editionem sequatur: in tomis, id est, in disputatione majori, Hebraica veritate superatus, et suorum circumdatus agminibus, interdum linguae peregrinae quaerit auxilia. Hoc unum dico, quod vellem cum invidia nominis ejus habere etiam scientiam Scripturarum, flocci pendens imagines umbrasque larvarum, quarum natura [Al. naturae] esse dicitur, terrere parvulos, et in angulis garrire tenebrosis. (Cap. I.—Vers. 1.) In principio fecit Deus coelum et terram. Plerique existimant, sicut in Altercatione quoque Jasonis et Papisci scriptum est, et Tertullianus in libro contra Praxeam disputat: necnon Hilarius in expositione cujusdam Psalmi affirmat, in Hebraeo haberi: In filio fecit Deus coelum et terram: quod falsum esse, ipsius rei veritas comprobat. Nam et Septuaginta Interpretes, et Symmachus, et Theodotion, in principio, transtulerunt. Et in Hebraeo scriptum est, BRESITH (בראשית); quod Aquila interpretatur, in capitulo: et non BABEN (בבן), quod appellatur [Al. interpretatur], in filio. Magis itaque secundum sensum quam secundum verbi translationem de Christo accipi potest: qui tam in ipsa fronte Geneseos, quae caput librorum omnium est, quam etiam in principio Joannis Evangelistae, coeli et terrae conditor approbatur. Unde et in Psalterio (Psal. XXXIX, 9) de seipso ait: In capitulo [Al. capite] libri scriptum est de me, id est, in principio Geneseos. Et in Evangelio: Omnia per ipsum facta sunt, et sine ipso factum est nihil (Joan. I, 3). Sed et hoc sciendum, quod apud Hebraeos liber hic BRESITH vocatur: hanc habentes consuetudinem, ut voluminibus ex principiis eorum nomina imponant.\
"""
