text = """
(Vers. 17.) Et cecidit Abraam super faciem suam, et risit: et dixit in corde suo, Si centenario nascetur filius, et Sara nonagenaria pariet? Et post paululum: Et vocabis nomen ejus Isaac. Diversa opinio, sed una est etymologia, quare appellatus sit Isaac. Interpretatur enim Isaac, risus. Alii dicunt, quod Sara riserit, ideo eum risum vocatum esse, quod falsum est. Alii vero quod riserit Abraham, quod et nos probamus. Postquam enim ad risum Abrahae, vocatus est filius ejus Isaac, tunc legimus risisse et Saram. Sciendum tamen quod quatuor in veteri Testamento absque ullo velamine, nominibus suis antequam nascerentur, vocati sunt: Ismael, Isaac, Salomon, et Josias. Lege Scripturas.\
"""
