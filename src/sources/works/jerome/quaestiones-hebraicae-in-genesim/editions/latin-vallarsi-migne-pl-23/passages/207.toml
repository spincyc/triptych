text = """
(Cap. XLIX.—Vers. 3.) Ruben primogenitus meus, tu fortitudo mea et principium filiorum meorum, durus ad ferendum et durus procacitate, et injuria, sicut aqua non ebullias. Ascendisti enim super lectulum patris tui. Tunc violasti stratum, cum ascendisti. In Hebraeo scriptum est: Ruben primogenitus meus, tu fortitudo mea, et capitulum in liberis meis. Major ad portandum, et major robore. Effusus es sicut aqua, ne adjicias. Ascendisti enim cubile patris tui, et contaminasti stratum in ascensu. Est autem sensus hic: Tu es primogenitus meus, major in liberis, et debebas juxta ordinem nativitatis tuae, haereditatem, quae primogenitis jure debebatur, et sacerdotium accipere et regnum: hoc quippe in portando onere et praevalido robore demonstratur. Verum quia peccasti, et quasi aqua, quae vasculo non tenetur, voluptatis impetu effusus es, idcirco praecipio tibi, ut ultra non pecces, sisque in fratrum numero, poenam peccati luens, quod primogeniti ordinem perdidisti.\
"""
