physical_line_ranges = [[23, 23]]
text = """
(Vers. 6.) Et dixit Dominus ad Cain: Quare concidit vultus tuus? Nonne si recte offeras, non recte autem dividas, peccasti? Quiesce, ad te conversio ejus, et tu dominaberis ejus. Necessitate compellimur in singulis diutius immorari. Siquidem et nunc multo alius in Hebraeo, quam in Septuaginta translatoribus, sensus est. Ait enim Dominus ad Cain: Quare irasceris, et quare concidit vultus tuus? Nonne si bene egeris, dimittetur tibi, et si non bene egeris, ante fores peccatum tuum sedebit? et ad te societas ejus: sed tu magis dominare ejus. Quod autem dicit, hoc est: Quare irasceris, et invidiae in fratrem livore cruciatus, vultum dimittis in terram? Nonne si bene feceris dimittetur tibi omne delictum tuum: sive ut Theodotion ait, acceptabile erit: id est, munus tuum suscipiam, ut suscepi fratris tui? Quod si male egeris: illico peccatum ante vestibulum tuum sedebit, et tali janitore comitaberis. Verum quia liberi arbitrii es: moneo ut non tibi peccatum, sed tu peccato domineris. Quod autem in Septuaginta interpretibus fecit errorem, illud est: quia peccatum, id est, ATTATH (הטאת) in Hebraeo generis masculini est, in Graeco feminini. Et qui interpretati sunt, masculino illud (ut erat in Hebraeo) genere transtulerunt.\
"""
