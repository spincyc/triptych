text = """
(Vers. 21.) Et dedit illis cibaria in via. Verbum SEDA (צדה), quod hic omnes ore consono, ἐπισιτισμὸν, id est, cibaria, vel sitarcia interpretati sunt, in Psalterio quoque habetur. Ubi enim nostri legunt, Viduam ejus benedicens benedicam (Psal. CXXXI, 15), (licet in plerisque codicibus pro vidua, hoc est pro χήρᾳ, nonnulli legant θήραν), in Hebraeo habet SEDA (צידה), id est, Cibaria ejus benedicens benedicam. Porro θήραν venationem magis potest sonare, quam fruges; tametsi moris sit Aegyptiorum θήραν etiam far vocare, quod nunc corrupte atheran nuncupant.\
"""
