physical_line_ranges = [[45, 45]]
text = """
(Cap. X.—Vers. 2.) Filii Japheth, Gomer, et Magog et Madai, et Javan, et Thubal, et Mosoch, et Thiras. Japhet filio Noe, nati sunt septem filii, qui possederunt terram in Asia ab Amano et Tauro, Syriae Coeles et Ciliciae montibus, usque ad fluvium Tanain. In Europa vero usque ad Gadira, nomina locis et gentibus relinquentes: e quibus postea immutata sunt plurima, caetera permanent ut fuerunt. Sunt autem Gomer, Galatae: Magog, Scythae: Madai, Medi: Javan, Iones, qui et Graeci: unde et mare Ionium. Thubal Iberi, qui et Hispani, a quibus Celtiberi, licet quidam Italos suspieentur. Mosoch, Cappadoces: unde et urbs usque hodie apud eos Mazeca dicitur: (porro Septuaginta interpretes, Caphthorim Cappadoces arbitrantur:) Thiras, Thraces, quorum non satis immutatum vocabulum est. Scio quemdam Gog et Magog, tam de praesenti loco, quam de Ezechiel, ad Gotthorum nuper in terra nostra bacchantium historiam retulisse, quod utrum verum sit, praelii ipsius fine monstratur. Et certe Gotthos omnes retro eruditi, magis Getas, quam Gog et Magog appellare consueverunt. Hae itaque septem gentes, quas de Japheth venire stirpe memoravi, aquilonis partem inhabitant.\
"""
