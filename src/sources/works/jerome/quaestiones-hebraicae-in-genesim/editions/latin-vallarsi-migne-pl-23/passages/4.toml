text = """
(Vers. 8.) Et plantavit Dominus Deus paradisum in Eden, contra orientem. Pro paradiso, in Hebraeo hortum habet: id est, GAN (גן). Porro EDEN (עדן), deliciae interpretantur. Pro quo Symmachus transtulit, paradisum florentem. Necnon quod sequitur, contra orientem, in Hebraeo MECEDEM (מקדם) scribitur, quod Aquila posuit ἀπὸ ἀρχῆς: et nos, ab exordio, possumus dicere. Symmachus vero, ἐκ πρώτης, et Theodotion, ἐν πρώτοις, quod et ipsum non orientem, sed principium significat. Ex quo manifestissime comprobatur, quod priusquam coelum et terram Deus faceret, paradisum ante condiderat, sicut et legitur in Hebraeo: Plantaverat autem Dominus Deus paradisum in Eden, a principio.\
"""
