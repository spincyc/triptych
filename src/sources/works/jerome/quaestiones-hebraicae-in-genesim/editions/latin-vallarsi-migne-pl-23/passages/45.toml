text = """
(Vers. 6.) Filii Cham, Chus, et Mesraim, et Phuth, et Chanaan. Chus usque hodie ab Hebraeis Aethiopia nuncupatur: Mesraim, Aegyptus: Phuth, Libyes. A quo et Mauritaniae fluvius usque in praesens Phuth dicitur, omnisque circa eum regio Phutensis. Multi scriptores tam Graeci quam Latini, hujus rei testes sunt. Quare autem in una tantum climatis parte, antiquum Libyae nomen resederit, et reliqua terra vocata sit Africa, disserere non hujus loci nec temporis est. Porro Chanaan obtinuit terram, quam Judaei deinceps possederunt, ejectis Chananaeis.\
"""
