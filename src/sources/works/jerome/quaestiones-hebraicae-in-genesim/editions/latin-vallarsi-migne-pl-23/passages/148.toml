physical_line_ranges = [[152, 152]]
text = """
(Cap. XXXI.—Vers. 7 et 8.) Et pater vester mentitus est mihi, et mutavit mercedem meam decem vicibus, et non dedit ei Deus ut noceret mihi. Si dixerat, hoc varium pecus erit merces tua: nascebatur [Al. nasceretur] omne pecus varium. Et si dixerat, unius coloris erit merces tua: nascebatur omne pecus unius coloris. Pro eo quod nos posuimus, mutavit mercedem meam decem vicibus, Septuaginta Interpretes posuerunt, decem agnis, nescio qua opinione ducti, cum verbum Hebraicum, MONI (מני) numerum magis quam agnos sonet. Denique et ex consequentibus hic magis sensus probatur, quod per singulos fetus semper Laban conditionem mutaverit. Si videbat varium nasci pecus, post fetum dicebat, volo ut in futurum mihi varia nascantur. Rursum cum vidisset unius coloris nasci pecora (Jacob quippe hoc audito, virgas in canalibus non ponebat), dicebat, ut futuros fetus unius coloris sibi pecora procrearent. Et quid plura? usque ad vices decem semper a Laban pecoris sui, sive Jacob, mutata conditio est. Et quodcumque sibi proposuerat ut nasceretur, in colorem contrarium vertebatur. Ne cui autem in sex annis decem pariendi vices incredibiles videantur, lege Virgilium (Georg. II), in quo dicitur: bis gravidae pecudes. Natura autem Italicarum ovium et Mesopotamiae una esse traditur.\
"""
