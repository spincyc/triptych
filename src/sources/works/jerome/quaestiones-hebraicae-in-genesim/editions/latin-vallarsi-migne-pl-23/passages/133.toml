text = """
(Cap. XXVIII.—Vers. 19.) Et vocavit Jacob nomen loci illius Bethel, et Ulammaus erat nomen civitatis prius. Ab eo quod supra dixerat: Quam terribilis est locus iste: non est hic nisi domus Dei, et haec porta coeli: nunc loco nomen imponit, et vocat illum BETHEL (בית אל), id est, domum Dei: qui locus vocabatur ante LUZA (לוז) quod interpretatur nux, sive amygdalon. Unde ridicule quidam verbum Hebraicum ULAM (אולם), nomen esse urbis putant: cum ULAM interpretetur prius. Ordo itaque est lectionis: Et vocavit nomen loci illius Bethel, et prius Luza vocabulum erat civitatis. Antiquae omnes scripturae verbo, ulam, sive ELAM plenae sunt, quod nihil aliud signat, nisi ante, aut prius, vel vestibulum, sive superliminare, vel postes.\
"""
