text = """
(Ver. 4.) Et respexit Deus super Abel, et super munera ejus: super Cain autem et super sacrificia ejus non respexit, et contristatus est Cain valde. Unde scire poterat Cain, quod fratris munera suscepisset Deus, et sua repudiasset: nisi illa interpretatio vera est, quam Theodotion posuit. Et inflammavit Dominus super Abel, et super sacrificium ejus: super Cain vero, et super sacrificium ejus non inflammavit. Ignem autem ad sacrificium devorandum solitum venire de coelo: et in dedicatione templi sub Salomone legimus, et quando Elias in monte Carmelo construxit altare (II Par. VII, 1; III Reg. XVIII, 38).\
"""
