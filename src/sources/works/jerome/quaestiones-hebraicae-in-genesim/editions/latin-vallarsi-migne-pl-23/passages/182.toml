(Vers. 29.) Et ecce egressus est frater ejus, et dixit, ut quid divisa est propter te maceria? Et vocavit nomen ejus Phares. Pro maceria, divisionem Aquila et Symmachus transtulerunt, quod Hebraice dicitur, PHARES (פרץ). Ab eo igitur, quod diviserit membranulam secundarum [Al. secundinarum], divisionis nomen accepit. Unde et Pharisaei, qui se quasi justos a populo separaverant, divisi appellabantur.\
