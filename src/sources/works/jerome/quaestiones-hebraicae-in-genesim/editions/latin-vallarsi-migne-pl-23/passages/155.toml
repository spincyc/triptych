text = """
(Vers. 27 et 28.) Et dixit ei: Quod nomen tibi? Qui ait, Jacob. Dixit autem ei: Jam non vocabitur Jacob nomen tuum, sed vocabitur nomen tuum Israel: quia invaluisti cum Deo, et cum hominibus valebis. Josephus in primo Antiquitatum libro, Israel ideo appellatum putat, quod adversum Angelum steterit: quod ego diligenter excutiens, in Hebraeo penitus invenire non potui. Et quid me necesse est opiniones quaerere singulorum, cum etymologiam nominis exponat ipse qui posuit? Non vocabitur, inquit, nomen tuum Jacob, sed Israel erit nomen tuum. Quare? Interpretatur Aquila ὅτι ἤρξας μετὰ Θεοῦ, Symmachus ὅτι ἤρξω πρὸς Θεὸν: Septuaginta et Theodotio, ὅτι ἐνίσχυσας μετὰ Θεοῦ. SARITH (שרית) enim, quod ab Israel vocabulo derivatur, principem sonat. Sensus itaque est: Non vocabitur nomen tuum supplantator, hoc est, Jacob: sed vocabitur nomen tuum princeps cum Deo, hoc est, Israel. Quomodo enim princeps ego sum: sic et tu, qui mecum luctari potuisti, princeps vocaberis. Si autem mecum qui Deus sum, sive Angelus (quoniam plerique varie interpretantur), pugnare potuisti: quanto magis cum hominibus, hoc est cum Esau, quem formidare non debes! Illud autem, quod in libro Nominum interpretatur Israel, vir videns Deum, sive mens videns Deum, omnium pene sermone detritum, non tam vere, quam violenter mihi interpretatum videtur. Hic enim Israel (ישראל), per has litteras scribitur, IOD, SIN, RES, ALEPH, LAMED, quod interpretatur princeps Dei, sive, directus Dei, hoc est, εὐθύτατος Θεοῦ. Vir vero videns Deum his litteris scribitur, ALEPH, IOD, SIN, ut vir ex tribus litteris scribatur, et dicatur IS (איש): videns autem ex tribus, RES, ALEPH, HE, et dicatur RAA (ראה). Porro EL, (אל) ex duabus ALEPH et LAMED: et interpretatur Deus, sive fortis. Quamvis igitur grandis auctoritatis sint, et eloquentiae ipsorum umbra nos opprimat, qui Israel virum, sive mentem videntem Deum transtulerunt: nos magis Scripturae, et Angeli, vel Dei, qui ipsum Israel vocavit, auctoritate ducimur, quam cujuslibet eloquentiae saecularis. Illud quoque quod postea sequitur:\
"""
