text = """
(Vers. 12 et 13.) Et peperit Zelpha ancilla Liae filium secundum Jacob: et dixit Lia, Beata ego, quia beatificant me mulieres: et vocavit nomen ejus Aser, divitiae. Male additae sunt divitiae, id est, πλοῦτος [Al. πλουτῶν], cum etymologia nominis Aser Scripturae auctoritate pandatur dicentis: Beata sum ego, et beatificant me mulieres. Et ab eo quod beata dicatur ab hominibus [Al. omnibus], filium suum beatum vocaverit; ASER (אשר) ergo non divitiae, sed beatus dicitur, dumtaxat in praesenti loco. Nam in aliis secundum ambiguitatem verbi possunt et divitiae sic vocari.\
"""
