text = """
(Vers. 8.) Et audierunt vocem Domini Dei ambulantis in paradiso ad vesperam. In plerisque codicibus Latinorum, pro eo quod hic posuimus ad vesperam, post meridiem habet: quia τὸ δειλινὸν Graecum sermonem ad verbum transferre non possumus: pro quo in Hebraeo scriptum est, LARUE AIOM (היום לרוח), quod Aquila interpretatus est ἐν τῷ ἀνέμω τῆς ἡμέρας, id est, in vento diei. Symmachus vero διὰ πνεύματος ἡμέρας, id est, per spiritum diei. Porro Theodotion manifestius ἐν τῷ πνεύματι πρὸς κατάψυξιν τῆς ἡμέρας, ut meridiano calore transacto, refrigerium aurae spirantis ostenderet.\
"""
