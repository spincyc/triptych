text = """
(Vers. 21.) Et profectus est Israel: et extendit tabernaculum suum trans turrim Ader. Hunc locum Hebraei esse volunt, ubi postea templum aedificatum est: et turrim Ader, turrim gregis significare, hoc est, congregationis et coetus: quod et Michaeas Propheta testatur, dicens: Et tu turris gregis nebulosa, filia Sion (Mich. IV, 8), et caetera: illoque tempore Jacob trans locum, ubi postea templum aedificatum est, habuisse tentoria. Sed si sequamur ordinem viae, pastorum juxta Bethleem locus est, ubi vel Angelorum rex in ortu Domini cecinit: vel Jacob pecora sua pavit, loco nomen imponens: vel quod verius est, quodam vaticinio futurum jam tunc mysterium monstrabatur,\
"""
