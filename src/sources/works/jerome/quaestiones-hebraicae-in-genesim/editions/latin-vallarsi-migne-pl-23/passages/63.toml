text = """
(Cap. XIII.—Vers. 4.) Et ascendit Abram ex Aegypto ipse et uxor ejus, et omnia quae illius erant: et Lot cum eo in desertum. Erat autem Abram dives valde in pecore, et argento, et auro: et abiit unde venit in desertum usque Bethel. Pulchre de Aegypto liberatus ascendisse dicitur. Sed occurrit huic sensui illud, quod sequitur: quomodo potuerit exiens de Aegypto fuisse dives valde? Quod solvitur illa Hebraica veritate, in qua scribitur: Abram gravis vehementer, hoc est, βαρύς σφόδρα: Aegypti enim pondere gravabatur. Et licet videantur esse divitiae pecoris, auri, et argenti, tamen si Aegyptiae sunt, viro sancto graves sunt. Denique, non ut in Septuaginta legimus, Abiit unde venerat in desertum usque Bethel: sed sicut in Hebraeo scriptum est: Abiit itinere suo per Austrum usque Bethel. Idcirco profectus de Aegypto est, ut non desertum ingrederetur, quod cum Aegypto reliquerat: sed ut per Austrum, qui Aquiloni contrarius est, veniret ad domum Dei, ubi fuerat tabernaculum ejus in medio Bethel et Ai [Al. Gai].\
"""
