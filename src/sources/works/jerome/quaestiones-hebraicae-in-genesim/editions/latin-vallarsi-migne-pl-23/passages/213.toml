text = """
(Vers. 14 et 15.) Issachar bonum desideravit, requiescens inter medios cleros, et videns requiem, quia bona est, et terram, quia pinguis: supposuit humerum suum ad laborandum, et factus est vir agricola. In Hebraeo ita scriptum est: Issachar asinus osseus, recumbens inter terminos, et videns requiem, quia bona est, et terram, quia pulchra est: inclinavit humerum suum ad portandum, et factus est in tributum serviens. Quia supra de Zabulon dixerat, quod maris magni esset littora possessurus, Sidonem quoque et reliquas Phoenicis urbes contingeret; nunc ad mediterraneam provinciam redit, et Issachar, quia juxta Nephthalim, pulcherrimam in Galilaea regionem possessurus est, benedictione sua habitatorem facit. Asinum autem osseum vocat, et humerum ad portandum deditum, quia in labore terrae, et vehendis ad mare oneribus, quae in suis finibus nascebantur, plurimum laboraret, regibus quoque tributa comportans. Aiunt Hebraei, per metaphoram significari, quod Scripturas sanctas die ac nocte meditans, studium suum dederit ad laborandum, et ideo ei omnes tribus serviant, quasi magistro dona portantes.\
"""
