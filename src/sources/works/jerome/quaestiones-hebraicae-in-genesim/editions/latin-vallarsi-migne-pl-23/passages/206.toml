physical_line_ranges = [[210, 210]]
text = """
(Vers. 22.) Et ego dedi [Al. do] tibi Sicimam praecipuam super fratres tuos, quam accepi de manibus Amorrhaeorum in gladio meo et sagitta. Sicima juxta Graecam et Latinam consuetudinem declinata est. Alioquin Hebraice SICHEM dicitur, ut Joannes quoque Evangelista testatur (IV, 5): licet vitiose, ut Sichar legatur, error inolevit: et est nunc Neapolis urbs Samaritanorum. Quia igitur SICHEM (שכם) lingua Hebraea transfertur in humerum, pulchre allusit ad nomen, dicens: Et ego dabo tibi humerum unum. Pro praecipuo enim, id est, ἐξαιρέτῳ, unum scribitur in Hebraeo. Quod autem dicit se eam in arcu, et gladio possedisse: arcum hic, et gladium, justitiam vocat, per quam meruit peregrinus, et advena, interfecto Sichem, et Emor, de periculo liberari. Timuit enim, ut supra legimus, ne vicina oppida, atque castella ob eversionem foederatae urbis adversum se consurgerent (Gen. XXXIV): et Dominus non dedit eis ut nocerent illi. Vel certe sic intelligendum: Dabo tibi Sicimam, quam emi in fortitudine mea, hoc est in pecunia, quam multo labore multoque sudore acquisivi. Quod autem ait, super fratres tuos, ostendit absque sorte dedisse eam tribui Joseph. Siquidem eodem loco sepultus est Joseph, et mausoleum ejus ibi hodieque cernitur.\
"""
