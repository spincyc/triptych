text = """
(Vers. 36.) Madianaei autem vendiderunt Joseph in Egypto Phutiphar eunucho, Pharaonis archimagiro. In plerisque locis archimagiros, id est, coquorum principes, pro magistris exercitus Scriptura commemorat: μαγειρεύειν quippe Graece interpretatur occidere. Venditus est igitur Joseph principi exercitus et bellatorum, non Petephre, ut in Latino scriptum est, sed Phutiphar eunucho. Ubi quaeritur, quomodo postea uxorem habere dicatur. Tradunt Hebraei emptum ab hoc Joseph ob nimiam pulchritudinem in turpe ministerium, et a Domino virilibus ejus arefactis, postea electum esse juxta morem Hierophantarum in pontificatum Heliopoleos; et hujus filiam esse Aseneth, quam postea Joseph uxorem acceperit.\
"""
