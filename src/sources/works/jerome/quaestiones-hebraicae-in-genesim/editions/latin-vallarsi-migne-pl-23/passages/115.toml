physical_line_ranges = [[118, 118]]
text = """
(Cap. XXV.—Vers. 1.) Et adjecit Abraham, et accepit uxorem, et nomen ejus Cetura: et peperit ei Zamram, et Jecsan, et Madan, et Madian, et Jesboc, et Sue. Et Jecsan genuit Saba et Dadan. Et filii Dadan fuerunt Asurim, et Latusim, et Laomim. Et filii Madian, Jephar, et Apher, et Enoch, et Abida, et Aledea. Omnes hi filii Ceturae. Et dedit Abraham universa quae habuit Isaac. Filiis autem concubinarum, quas habuit, dedit munera, et dimisit eos ab Isaac filio suo, cum adhuc viveret in Oriente, ad terram orientalem. Cetura Hebraeo sermone copulata interpretatur, aut juncta (Al. vincta). Quam ob causam suspicantur Hebraei, mutato nomine, eamdem esse Agar, quae, Sara mortua, de concubina transierit in uxorem. Et videtur decrepiti jam Abrahae excusari aetas, ne senex post mortem uxoris suae vetulae, novis arguatur nuptiis lascivisse. Nos quod incertum est relinquentes, hoc dicimus, quod de Cetura nati filii Abraham, juxta historicos Hebraeorum occupaverint Τρωγλοδύτην et Arabiam, quae nunc vocatur Εὐδαίμων, usque ad maris Rubri terminos. Dicitur autem unus ex posteris Abrahae, qui appellabatur Apher, duxisse adversus Libyam exercitum, et ibi, victis hostibus, consedisse: ejusque posteros ex nomine atavi Aphricam nuncupasse. Hujus rei testis est Alexander, qui dicitur Polyhistor, et Cleodemus cognomento Malchus, Graeco sermone barbaram historiam retexentes. Quod autem ait, Et filii Dadau fuerunt Asurim, et Latusim, et Laomim: Asurim in negotiatores transferri putant: Latusim, aeris ferrique metalla cudentes: Laomim vero φύλαρχοι, id est, principes multarum tribuum atque populorum. Alii ab hoc Asurim vocatos, Syros esse contendunt, et a plerisque filiis Abrahae ex Cetura occupatas Indiae regiones.\
"""
