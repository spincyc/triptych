text = """
(Vers. 17.) Et abiit inde Isaac, et venit in vallem Gerarum, et habitavit ibi. Pro valle, torrentem habet in Hebraeo. Neque enim Isaac postquam magnificatus est, habitare poterat in valle. Habitavit autem in torrente, de quo scriptum est: De torrente in via bibet (Psalm. CIX, 7). De quo etiam Elias tempore famis bibit. Sed quia Elias non erat perfectus, ut Christus: ideo ei torrens ille aruit (III Reg. XVII, 7). Dominus vero noster, etiam in torrente traditus est: dedicans regenerationem nostram et Baptismi sacramentum.\
"""
