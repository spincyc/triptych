(Cap. XL.—Vers. 1.) Post verba haec, peccavit princeps vinariorum regis Aegypti. Ubi nos posuimus, principem vinariorum, in Hebraeo scriptum habet MASEC (משק), illud verbum quod in nomine servi Abraham dudum legimus, quem nos possumus more vulgi vocare pincernam. Nec vile putetur officium, cum apud reges barbaros usque hodie maximae dignitatis sit, regi poculum porrexisse: Poetae quoque de Catamitho et Jove scriptitent, quod amasium suum huic officio manciparit.\
