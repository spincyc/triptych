text = """
(Cap. XV.—Vers. 2, 3.) Domine Deus, quid dabis mihi? Et ego vado sine liberis: et filius Masec vernaculae meae, hic Damascus Eliezer. Et dixit Abram: Ecce mihi non dedisti semen: et filius vernaculae meae haeres meus erit. Ubi nos habemus, et filius Masec vernaculae meae: in Hebraeo scriptum est, UBEN MESECH BETHI: quod Aquila transtulit, ὁ υἱὸς τοῦ ποτίζοντος οἰκίαν μου: id est, filius potum dantis domui meae. Theodotio vero, καὶ υἱὸς τοῦ ἐπὶ τῆς οἰκίας μοῦ: id est, et filius ejus, qui super domum meam est. Quod autem dicit, hoc est: Ego sine liberis morior, et filius procuratoris mei, vel villici, qui universa dispensat et distribuit cibaria familiae meae, vocaturque Damascus Eliezer, hic meus haeres erit. Porro Eliezer interpretatur, Deus meus adjutor. Ab hoc aiunt Damascum et conditam, et nuncupatam.\
"""
