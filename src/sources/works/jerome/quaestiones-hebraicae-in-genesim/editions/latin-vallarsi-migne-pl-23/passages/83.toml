text = """
(Vers. 15.) Et dixit Deus ad Abraam: Sarai uxorem tuam non vocabis eam Sarai, sed Sara erit nomen ejus. Errant qui putant primum Saram per unum R scriptam fuisse, et postea ei alterum R additum. Et quia R apud Graecos centenarius numerus est, multas super nomine ejus ineptias suspicantur: cum utique utcumque volunt ei vocabulum commulatum, non Graecam, sed Hebraeam debeat habere rationem, cum ipsum nomen Hebraicum sit. Nemo autem in altera lingua quempiam vocans, etymologiam vocabuli sumit ex altera. SARAI (שרי) igitur primum vocata est per SIN, RES, IOD: sublato igitur IOD, id est, I elemento, addita est HE littera, quae per A legitur: et vocata est SARA (שרה). Causa autem ita nominis immutati, haec est, quod antea dicebatur, princeps mea, unius tantum domus materfamiliae. Postea vero dicitur absolute, princeps, id est, ἄρχουσα. Sequitur enim: Dabo tibi ex ea filium, et benedicam ei, et erit in gentes: et reges populorum erunt ex eo. Signanterque, non ut in Graeco legimus: Dixit Deus ad Abraam. Sarai uxor tua non vocabitur nomen ejus Sarai: in Hebraeo habetur: non vocabis nomen ejus Sarai, id est, non dices ei, princeps mea es: omnium quippe gentium futura jam princeps est. Quidam pessime suspicantur, ante eam lepram fuisse vocitatam, et postea principem: cum lepra SARATH (צרעת) dicatur, quae in nostra quidem lingua videtur aliquam habere similitudinem; in Hebraeo autem penitus est diversa. Scribitur enim per SADE, et RES, et AIN, et THAU: quod multum a superioribus tribus litteris, id est, SIN, RES, et HE, quibus SARA scribitur, discrepare manifestum est.\
"""
