(Cap. XXXII.—Vers. 1 et 2.) Et occurrerunt ei Angeli Dei, et dixit Jacob ut vidit eos: Castra Dei haec sunt, et vocavit nomen loci ejus Castra. Ubi hic castra posita sunt, in Hebraeo habet MANAIM (מחנים); ut sciamus, si quando non interpretatum in alio loco ponitur, quem locum significet. Et pulchre, ad fratrem iturus inimicum, Angelorum se comitantium excipitur choris.\
