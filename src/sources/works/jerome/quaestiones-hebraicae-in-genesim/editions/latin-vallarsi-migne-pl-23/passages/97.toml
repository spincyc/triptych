text = """
(Vers. 14.) Et sumpsit panes et utrem aquae, et dedit Agar, ponens super humerum ejus, et parvulum, et dimisit eam. Quando Isaac natus est, tredecim annorum erat Ismael. Et post ablactationem ejus, iste cum matre expellitur domo. Inter Hebraeos autem varia opinio est, asserentibus aliis, quinto anno ablactationis tempus statutum, aliis duodecimum annum vendicantibus. Nos igitur ut breviorem eligamus aetatem, post decem et octo annos Ismael supputavimus ejectum esse cum matre, et non convenire jam adolescenti matris sedisse cervicibus. Verum est igitur illud Hebraeorum linguae idioma, quod omnis filius ad comparationem parentum, infans vocetur et parvulus. Nec miremur barbaram linguam habere proprietates suas: cum hodieque Romae omnes filii vocentur infantes. Posuit ergo Abraham panes et utrem super humerum Agar: et hoc facto dedit puerum matri, hoc est, in manus ejus tradidit, commendavit, et ita emisit e domo. Quod autem sequitur:\
"""
