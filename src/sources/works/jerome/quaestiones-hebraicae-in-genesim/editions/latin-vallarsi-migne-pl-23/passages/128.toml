text = """
(Vers. 32 et 33.) Et venerunt servi Isaac, et nuntiaverunt ei de puteo, quem foderunt: et dixerunt ei, invenimus aquam: et vocavit nomen ejus saturitas. Nescio quomodo in Septuaginta Interpretibus habeatur: Et venerunt pueri Isaac, et nuntiaverunt ei de puteo, quem foderunt: et dixerunt ei, non invenimus aquam: et vocavit nomen ejus juramentum. Quae enim etymologia est, propterea vocari juramentum, quod aquam non invenerunt? E contrario in Hebraeo, cui interpretationi Aquila consentit et Symmachus, hoc significat, quia invenerint aquam, et propterea appellatus sit puteus ipse saturitas: et vocata civitas BERSABEE, hoc est, puteus saturitatis (Gen. XXI): licet enim [Al. nos] supra ex verbo juramenti, sive ex septenario ovium numero, quod SABEE (שבע) dicitur, asseruerimus BERSABEE appellatam: tamen nunc ex eo quod aqua inventa est, Isaac ad nomen civitatis, quae ita vocabatur alludens, declinavit paululum litteram, et pro stridulo Hebraeorum SIN, a quo SABEE incipitur, Graecum sigma, id est Hebraeum SAMECH posuit: alioquin et juxta allegoriae legem, post tantos puteos in fine virtutum, nequaquam congruit, ut Isaac aquam minime repererit.\
"""
