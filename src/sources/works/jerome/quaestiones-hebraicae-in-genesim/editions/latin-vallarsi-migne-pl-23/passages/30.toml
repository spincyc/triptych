physical_line_ranges = [[32, 32]]
text = """
(Vers. 25.) Et vixit Mathusala annis centum sexaginta septem, et genuit Lamech. Et vixit Mathusala, postquam genuit Lamech, annos octingentos duos, et genuit filios et filias. Et fuerunt omnes dies Mathusalae, quos vixit, anni nongenti sexagintanovem, et mortuus est. Famosa quaestio, et disputatione omnium Ecclesiarum ventilata, quod juxta diligentem supputationem, quatuordecim annos post diluvium Mathusala vixisse referatur. Etenim cum esset Mathusala annorum centum sexaginta septem, genuit Lamech. Rursum Lamech, cum esset annorum centum octoginta octo, genuit Noe. Et fiunt simul usque ad diem nativitatis Noe, anni vitae Mathusalae, trecenti quinquaginta quinque. Sexcentesimo autem anno vitae Noe, diluvium factum est. Ac per hoc, habita supputatione per partes, nongentesimo quinquagesimo quinto anno Mathusalae, diluvium fuisse convincitur. Cum autem supra nongentis sexaginta novem annis vixisse sit dictus, nulli dubium est quatuordecim eum annos vixisse post diluvium. Et quomodo verum est, quod octo tantum animae in arca salvae factae sunt? Restat ergo, ut quomodo in plerisque, ita et in hoc sit error in numero. Siquidem et in Hebraeis et Samaritanorum libris, ita scriptum reperi: Et vixit Mathusala centum octoginta septem annis, et genuit Lamech. Et vixit Mathusala, postquam genuit Lamech, septingentos octoginta duos annos et genuit filios et filias. Et fuerunt omnes dies Mathusalae, anni nongenti sexagintanovem, et mortuus est. Et vixit Lamech centum octoginta duobus annis, et genuit Noe. A die ergo nativitatis Mathusalae, usque ad diem ortus Noe, sunt anni trecenti sexaginta novem: his adde sexcentos annos Noe: quia in sexcentesimo vitae ejus anno factum est diluvium: atque ita fit, ut nongentesimo sexagesimo nono vitae suae Mathusala mortuus sit, eo anno, quo coepit esse diluvium.\
"""
