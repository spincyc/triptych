text = """
(Vers. 5 et 6.) Simeon et Levi fratres consummaverunt iniquitatem adinventionis suae: in consilium eorum non veniat anima mea: et in congregatione eorum non aemuletur jecur meum, quia in furore suo interfecerunt homines, et in desiderio suo subnervaverunt taurum. Necessitate compellimur juxta propositum operis longius ea repetere, quae ab Hebraica veritate discordant. Legitur enim ibi: Simeon et Levi fratres, vasa iniquitatis arma eorum. In arcanum eorum, ne intret anima mea, et in conventu eorum ne desoletur gloria mea, quia in furore suo interfecerunt virum, et in libidine sua suffoderunt murum (Gen. XXXIV). Significat autem non sui consilii fuisse, quod Sichem et Emor foederatos viros interfecerint, contraque jus pacis et amicitiarum sanguinem fuderint innocentem, et quasi quodam furore, sic crudelitate rapti, muros hospitae urbis everterint. Unde sequitur et dicit:\
"""
