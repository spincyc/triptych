physical_line_ranges = [[75, 75]]
text = """
(Vers. 18.) Et Melchisedech rex Salem protulit panem et vinum, et ipse Sacerdos Dei excelsi, et benedixit ei. Quia semel opusculum nostrum, vel Quaestionum Hebraicarum, vel Traditionum congregatio est, propterea quid Hebraei de hoc sentiant, inferamus. Aiunt hunc esse Sem filium Noe: et supputantes annos vitae ipsius, ostendunt eum ad Isaac usque vixisse, omnesque primogenitos Noe donec sacerdotio fungeretur Aaron, fuisse pontifices. Porro Salem, rex Jerusalem dicitur, quae prius Salem appellabatur. Melchisedech autem beatus Apostolus ad Hebraeos (VII, 3), sine patre et matre commemorans, ad Christum refert, et per Christum ad gentium Ecclesiam. Omnis enim capitis gloria refertur ad membra, eo quod praeputium habens, Abrahae benedixerit circumciso, et in Abraham Levi, et per Levi Aaron: de quo postea sacerdotium. Ex quo colligi vult, sacerdotium Ecclesiae habentis praeputium, benedixisse circumciso sacerdotio Synagogae. Quod autem ait: Tu es sacerdos in aeternum, secundum ordinem Melchisedech (Ps. CIX, 4): mysterium nostrum in verbo ordinis significatur: nequaquam per Aaron irrationalibus victimis immolandis, sed oblato pane et vino: id est, corpore et sanguine Domini Jesu.\
"""
