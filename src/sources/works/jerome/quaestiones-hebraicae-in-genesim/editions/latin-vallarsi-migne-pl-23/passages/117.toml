text = """
(Vers. 13.) Et haec nomina filiorum Ismael in nominibus suis et in generationibus suis. Primogenitus Ismaelis Nabajoth, et Cedar, et reliqui, usque ad eum locum ubi ait: Et habitaverunt ab Evila usque Sur, quae est contra faciem Aegypti venientibus in Assyrios, in conspectu omnium fratrum suorum cecidit. Duodecim filii nascuntur Ismaeli, e quibus primogenitus fuit Nabajoth, a quo omnis regio ab Euphrate usque ad mare Rubrum Nabathena usque hodie dicitur, quae pars Arabiae est. Nam et familiae eorum, oppidaque et pagi, ac munita castella, et tribus eorum hac appellatione celebrantur: ab uno ex his, Cedar in deserto, et Duma alia regio, et Theman ad austrum, et Cedema ad orientalem plagam dicitur. Quod autem in extremo hujus capituli, juxta Septuaginta legimus, contra faciem omnium fratrum suorum habitavit (Gen. XIII, 18): verius est illud quod nos posuimus, coram omnibus fratribus suis occubuit, id est, in manibus omnium filiorum suorum mortuus est, superstitibus liberis, et nullo prius morte praerepto. Fratres autem pro filiis appellari, Jacob quoque ad Laban demonstrat, dicens: Quod est peccatum meum, quia persecutus es post me: et quia scrutatus es omnia vasa mea? Quid invenisti de universis vasis domus tuae? Ponatur coram fratribus meis et fratribus tuis: et dijudicent inter nos (Ibid. 35). Nec enim possumus credere, ut Scriptura commemoret, quod Jacob, exceptis liberis, secum fratres aliquos habuerit.\
"""
