text = """
(Vers. 50 et seqq.) Et Joseph nati sunt duo filii antequam venirent anni famis, quos peperit ei Aseneth filia Phutipharis sacerdotis Heliopoleos. Vocavit autem Joseph nomen primogeniti Manasse: quia oblivisci me fecit Deus omnium laborum meorum, et omnis domus patris mei. Nomen autem secundi vocavit Ephraim, quia crescere me fecit Deus in terra humilitatis meae. Observa propter quaestionem, quae post paululum de Joseph filiis proponenda est, quod ante famis tempus, quo Jacob intravit in Aegyptum, duos tantum Joseph filios habuerit, Manasse et Ephraim. Manasse vocans ab eo, quod sit oblitus laborum suorum: ita enim Hebraice vocatur oblivio. Ephraim, eo quod auxerit eum Deus. Et ex hoc enim vocabulo in linguam nostram transfertur augmentum.\
"""
