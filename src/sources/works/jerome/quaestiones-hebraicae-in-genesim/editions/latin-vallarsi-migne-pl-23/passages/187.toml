text = """
(Cap. XLI.—Vers. 2.) Et ecce de fluvio ascendebant septem boves, speciosae ad videndum, electae carnibus, et pascebantur in achi. Bis in Genesi scriptum est ACHI (Ἄχα), et neque Graecus sermo est, nec Latinus. Sed et Hebraeus ipse corruptus est: dicitur enim in AHU (אחו), hoc est, in palude. Sed quia VAU littera apud Hebraeos, et IOD similes sunt, et tantum magnitudine differunt: pro AHU, ACHI Septuaginta Interpretes transtulerunt, et secundum consuetudinem suam ad exprimendam duplicem aspirationem, HETH Hebraeae litterae, Chi (χ) Graecam litteram copulaverunt.\
"""
