text = """
(Cap. XVII.—Vers. 3 et seqq.) Et locutus est ei Dominus, dicens: Ecce testamentum meum tecum: et eris pater multitudinis gentium, et non vocabitur ultra nomen tuum Abram, sed erit nomen tuum Abraam, quia patrem multarum gentium posui te. Notandum quod ubicumque in Graeco, Testamentum legimus, ibi in Hebraeo sermone sit foedus, sive pactum, id est, BERITH (ברית). Dicunt autem Hebraei, quod ex nomine suo, Deus, quod apud illos Tetragrammum est, HE litteram, Abraae et Sarae addiderit: dicebatur enim primum ABRAM (אברם), quod interpretatur, pater excelsus: et postea vocatus est ABRAAM (אברהם), quod transfertur pater multarum: nam quod sequitur gentium, non habetur in nomine, sed subauditur. Nec mirandum, quare cum apud Graecos et nos Α littera videatur addita: nos HE litteram Hebraeam additam dixerimus; idioma enim linguae illius est, per HE (ה) quidem scribere, sed per A (א) legere: sicut e contrario A litteram saepe per HE pronuntiant.\
"""
