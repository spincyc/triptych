text = """
(Cap. XLIII.—Vers. 11.) Et deferte viro munera, aliquid resinae, et mellis, thymiama et stacten, et terebinthum, et nuces. Sive, ut Aquila et Symmachus transtulerunt, amygdala. Idcirco hoc capitulum posuimus, ut sciamus ubi in nostris codicibus habetur thymiama, in Hebraeo esse NECOTHA (נכאת), quod Aquila storacem transtulit. Ex quo domus nechota, quae in Isaia (XXXIX, 21) legitur, manifestissime cella thymiamatis, sive storacis intelligitur, quod in illa aromata diversa sint condita.\
"""
