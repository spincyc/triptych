physical_line_ranges = [[114, 114]]
text = """
(Vers. 43.) Ecce ego sto super fontem aquae, et filiae hominum civitatis egredientur ad hauriendam aquam: et erit virgo, cui ego dixero, da mihi bibere paululum aquae de hydria tua, etc. In Hebraeo scriptum est: Ecce ego stans juxta fontem aquae, et erit adolescentula, quae egredietur ad hauriendum: et dixero ei, da mihi bibere paululum aquae de hydria tua, et caetera. Pro adolescentula quoque, quae Graeco sermone νεανὶς dicitur, ibi legimus ALMA (עלמה), quod quidem et in Isaia habetur. Nam in eo loco ubi in nostris codicibus scriptum est: Ecce virgo concipiet, et pariet (Isa. VII, 14), Aquila transtulit: Ecce adolescentula concipiet, et pariet. In Hebraeo legitur: Ecce alma concipiet, et pariet. Notandum ergo, quod verbum alma, numquam nisi de virgine scribitur, et habet etymologiam, ἀπόκρυφος, id est, abscondita. Scriptum siquidem est in Job: Sapientia unde invenietur? Et quis locus intellectus? et abscondetur ab oculis omnis viventis (Job. XXVIII, 21). Ubi nunc diximus, abscondetur, in Hebraeo propter declinationem verbi aliter figuratum, NAALMA (נעלמה) dicitur. Huic quid simile, licet masculino genere declinetur, et in Regnorum libris scriptum est, ex persona Elisaei loquentis ad Giezi: Et Dominus abscondit a me (IV Reg. IV, 27). Ergo ALMA, quod interpretatur abscondita, idest, virgo, nimia diligentia custodita, majoris mihi videtur laudis esse, quam virgo. Virgo quippe juxta Apostolum potest esse corpore, et non spiritu. Abscondita vero, quae virgo est, ἐπίτασιν (incrementum) virginitatis habet, ut et virgo sit, et abscondita. Et quae abscondita est, juxta idioma linguae Hebraeae, consequenter et virgo est; quae autem virgo, non statim sequitur, ut abscondita sit. Hoc idem verbum et in Exodo de Maria sorore Moysi virgine legimus (Exod. II, 8). Ostendant igitur Judaei in Scripturis alicubi positum ALMA, ubi adolescentulam tantum, et non virginem sonet: et concedimus eis, illud quod in Isaia apud nos dicitur: Ecce virgo concipiet, et pariet, non absconditam virginem, sed adolescentulam significare jam nuptam.\
"""
