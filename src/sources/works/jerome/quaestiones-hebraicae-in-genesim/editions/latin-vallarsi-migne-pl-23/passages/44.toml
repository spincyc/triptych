text = """
(Vers. 4.) Filii Javan, Elisa, et Tharsis, Cethim et Dodanim. Ab his divisae sunt insulae nationum in terris suis. Vir secundum linguam suam et cognationem suam, et gentem suam. De Ionibus, id est, Graecis nascuntur Elisaei, qui vocantur Aeolides: unde et quinta lingua Graeciae Aeolis appellatur, quam illi vocant πέμπτην διάλεκτον. THARSIS Josephus Cilicas arbitratur, θ aspirationis litteram vitiose a posteris in τ dicens fuisse corruptam: unde et metropolis eorum civitas Tarsus appellatur, Paulo apostolo gloriosa. Cethim, sunt Citii, a quibus usque hodie quoque urbs Cypri Citium nominatur. Dodanim, Rhodii: ita enim Septuaginta Interpretes transtulerunt. Legamus Varronis de Antiquitatibus libros, et Sisinnii Capitonis, et Graecum Phlegonta, caeterosque eruditissimos viros: et videbimus omnes pene insulas, et totius orbis littora, terrasque mari vicinas, Graecis accolis occupatas: qui, ut supra diximus, ab Amano et Tauro montibus, omnia maritima loca usque ad oceanum possedere Britannicum.\
"""
