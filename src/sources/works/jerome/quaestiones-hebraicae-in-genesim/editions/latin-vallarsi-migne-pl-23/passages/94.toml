text = """
(Vers. 36 et seqq.) Et conceperunt duae filiae Lot de patre suo, et genuit primogenita filium, et vocavit nomen ejus Moab. Iste est pater Moabitarum usque in hanc diem. Et minor, et ipsa peperit filium, et vocavit nomen ejus Ammon id est, filius populi mei. Ipse est pater filiorum Ammon. Moab interpretatur, ex patre: et totum nomen etymologiam habet. Ammon vero, cujus quasi causa nominis redditur, filius generis mei, sive ut melius est in Hebraeo (עמי), filius populi mei, sic derivatur, ut ex parte sensus nominis, ex parte ipse sit sermo: AMMI enim, a quo dicti sunt Ammonitae, vocatur populus meus.\
"""
