text = """
(Cap. XLVIII.—Vers. 1.) Et nuntiatum est Joseph, Ecce pater tuus aegrotat: et tulit duos filios secum, Manassen et Ephraim. Et ex hoc illud quod supra diximus, demonstratur, quia Joseph ad id locorum duos tantum filios habuerit, Ephraim et Manassen. Si enim post multos annos, moriente Jacob patre suo, duos tantummodo filios duxit ad benedictionem, utique illo tempore, cum filii ejus generare non quiverant, parvuli atque lactentes, in ingressu patris et fratrum, nepotes ex eis habere non potuit.\
"""
