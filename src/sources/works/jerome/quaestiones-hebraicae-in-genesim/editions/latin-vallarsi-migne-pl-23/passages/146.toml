text = """
(Vers. 32 et 33.) Transibo in universo pecore tuo hodie: separa inde omne pecus varium et discolor: et omne pecus unius coloris in agnis et varium et discolor in capris, erit merces mea: et respondebit mihi justitia mea in die crastino, cum venerit merces mea coram te: omne in quo non fuerit varium et discolor in capris, et in agnis, furtum erit apud me, et caetera. Multum apud Septuaginta Interpretes confusus est sensus, et usque in praesentem diem nullum potui invenire nostrorum, qui ad liquidum quid in hoc loco diceretur, exponeret. Vis, inquit, Jacob, me servire tibi etiam alios septem annos, fac quod postulo. Separa omnes discolores et varias, tam oves quam capras, et trade in manus filiorum tuorum. Rursumque ex utroque grege, alba et nigra pecora, id est, unius coloris, da mihi. Si quid igitur ex albis et nigris, quae unius coloris sunt, varium natum fuerit, meum erit: si quid vero unius coloris, tuum. Rem non difficilem postulo. Tecum facit natura pecorum, ut alba ex albis, et nigra nascantur ex nigris: mecum erit justitia mea, dum Deus humilitatem meam respicit et laborem. Optionem Laban datam libenter arripuit, et ita ut Jacob postulabat faciens, trium dierum iter inter Jacob et filios suos separavit, ne quis ex vicinitate pecoris nasceretur dolus. Itaque Jacob novam stropham commentus est, et contra naturam albi et nigri pecoris, naturali arte pugnavit. Tres enim virgas, populeas et amygdalinas et maligranati, quamquam Septuaginta styracinas et nucinas et plataninas habeant, ex parte decorticans, varium virgarum fecit colorem, ut ubicumque in virga corticem reliquisset, antiquus permaneret color: ubi vero tulisset corticem, color candidus panderetur. Observabat ergo Jacob et tempore, quo ascendebantur pecora, et post calorem diei ad potandum avida pergebant, discolores virgas ponebat in canalibus, et admissis arietibus et hircis, in ipsa potandi aviditate, oves et capras faciebat ascendi, ut ex duplici desiderio, dum avide bibunt, et ascenduntur a maribus, tales fetus conciperent, quales umbras arietum et hircorum desuper ascendentium in aquarum speculo contemplabantur. Ex virgis enim in canalibus positis, varius erat etiam imaginum color. Nec mirum hanc in conceptu feminarum esse naturam, ut quales perspexerint, sive mente conceperint in extremo voluptatis aestu, quae concipiunt, talem sobolem procreent: cum hoc ipsum etiam in equarum gregibus apud Hispanos dicatur fieri: et Quintilianus in ea controversia, in qua accusabatur matrona quae Aethiopem pepererit, pro defensione illius argumentetur, hanc conceptuum esse naturam, quam supra diximus. Postquam autem nati fuerant haedi, et agni varii et discolores ex albis et unius coloris gregibus, separabat illos Jacob, et procul esse faciebat a pristino grege. Si qui autem nascebantur unius coloris, id est, albi, sive nigri, tradebat in manus filiorum Laban: et ponebat virgas quas decorticaverat, in canalibus quibus effundebantur aquae, et veniebant ad potandum contra pecora, ut conciperent eo tempore, cum venirent ad potandum.\
"""
