text = """
(Vers. 19.) Gad latrunculus latrocinabitur eum, et ipse latrocinabitur plantam. Juxta Hebraeum interpretati sumus. Sed ubi nos latrunculum posuimus, ibi scriptum est GEDUD (גדוד), ut ad GAD nomen alluderet, qui significantius εὔζωνος, id est, accinctus, sive expeditus exprimi potest. Totum autem illud est, quod Ruben, et dimidiam tribum Manasse, ad filios, quos trans Jordanem in possessionem dimiserat, post quatuordecim annos revertens, praelium adversum eos gentium vicinarum grande repererit, et victis hostibus, fortiter dimicarit. Lege librum Jesu Nave (Josue XIII), et Paralipomenon I, V). Non ignoro plura in benedictionibus patriarcharum esse mysteria, sed ad praesens opusculum non pertinet.\
"""
