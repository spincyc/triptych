(Cap. XXVI.—Vers. 12.) Seminavit autem Isaac in terra illa, et invenit in anno illo centuplum hordei. Licet in aliena terra seminaverit Isaac, tamen non puto, quod tanta ei fertilitas hordei fuerit. Unde melius puto illud esse, quod habetur in Hebraeo, et Aquila quoque transtulit: Et invenit in anno illo centuplum aestimatum, id est, ἑκατὸν εἰκασμένον. Licet enim eisdem litteris et aestimatio scribatur et hordeum, tamen aestimationes, SAARIM (שערים) leguntur, hordea vero SORIM. Tacens autem Scriptura genus frugum, quod centuplicaverit, videtur mihi cunctarum in illo virtutum ostendisse multiplicationem. Denique sequitur:\
