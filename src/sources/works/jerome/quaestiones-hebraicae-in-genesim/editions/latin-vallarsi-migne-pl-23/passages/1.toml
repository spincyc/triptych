text = """
(Vers. 2.) Et Spiritus Dei ferebatur super aquas. Pro eo quod in nostris codicibus scriptum est, ferebatur, in Hebraeo habet MEREFETH (מרחפת), quod nos appellare possumus, incubabat, sive confovebat, in similitudinem volucris, ova calore animantis. Ex quo intelligimus, non de spiritu mundi dici, ut nonnulli arbitrantur, sed de Spiritu Sancto, qui et ipse vivificator omnium a principio dicitur. Si autem vivificator, consequenter et conditor. Quod si conditor, et Deus. Emitte enim, ait, Spiritum tuum, et creabuntur (Psal. CIII, 30).\
"""
