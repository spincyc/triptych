text = """
(Cap. XIV.—Vers. 3.) Et rex Bale, haec est Segor. Omnes hi consenserunt apud vallem Salsam, hoc est, mare Salis. Bale lingua Hebraea, κατάποσις, id est, devoratio dicitur. Tradunt igitur Hebraei, hanc eamdem in alio Scripturarum loco Salisa nominari: dicique rursum, μόσχον τριετίζουσαν, id est, vitulam conternantem, quod scilicet tertio motu terrae absorpta sit (I Samuel IX, 4; Isai., XV, 5). Et ex eo tempore, quo Sodoma et Gomorrha, Adama et Seboim divino igne subversae sunt, illa parvula nuncupetur. Siquidem Segor transfertur in parvam, quae lingua Syra Zoara dicitur. Vallis autem Salinarum, sicut in hoc eodem libro scribitur, in qua fuerunt ante putei bituminis, post Dei iram, et sulphuris pluviam, in mare Mortuum versa est: quod a Graecis λίμνη Ἀσφαλτῖτις, id est, stagnum bituminis appellatur.\
"""
