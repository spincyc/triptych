text = """
(Vers. 43.) Et clamavit ante eum praeco, et constituit eum super omnem terram Aegypti. Pro quo Aquila transtulit: Et clamavit in conspectu ejus adgeniculationem. Symmachus ipsum Hebraicum sermonem interpretans ait: Et clamavit ante eum ABRECH (אברך). Unde mihi videtur non tam praeco, sive adgeniculatio, quae in salutando vel adorando Joseph accipi potest, intelligenda: quam illud quod Hebraei tradunt, dicentes patrem tenerum, et hoc sermone transferri; AB (אב) quippe dicitur pater, RECH (רך) delicatus sive tenerrimus; significante Scriptura, quod juxta prudentiam quidem pater omnium fuerit: sed juxta aetatem tenerrimus adolescens et puer.\
"""
