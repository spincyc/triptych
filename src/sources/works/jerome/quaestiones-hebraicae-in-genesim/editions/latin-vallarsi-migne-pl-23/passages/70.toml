text = """
(Vers. 13.) Et qui fugerat, nuntiavit Abram transitori. Ipse vero sedebat ad quercum Mambre Amorrhaei fratris Eschol, et fratris Aunam, qui erant conjurati Abrahae. Pro eo, quod nos posuimus, transitori, in Hebraeo scriptum est IBRI (עברי), hoc enim transitor exprimitur. Quod autem ait: apud quercum Mambre Amorrhaei, melius in Hebraeo legimus, apud quercum Mambre Amorrhaei fratris Escol: et fratris, non Aunam, ut Septuaginta transtulerunt, sed Aner: ut ostenderet Mambre et Escol, et Aner Amorrhaeos atque germanos, socios fuisse Abrahae.\
"""
