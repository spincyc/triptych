text = """
(Vers. 16 et seqq.) Dan judicabit populum suum, sicut unum de sceptris Israel. Fiat Dan coluber in via, regulus in semita, mordens ungulas equi, ut cadat [Al. et cadet] ascensor ejus retrorsum: salvatorem tuum exspectabo, Domine. Samson judex in Israel, de tribu Dan fuit. Hoc ergo dicit: Nunc videns in spiritu comam nutrire Samson Nazaraeum tuum, caesisque hostibus triumphare; quod in similitudinem colubri regulique obsidentis vias, nullum per terram Israel transire permittat: sed [Al. sicut] etiam si quis temerarius virtute sua, quasi equi velocitate confisus, eam voluerit praedonis more populari, effugere non valebit. Totum autem per metaphoram serpentis et equitis loquitur. Videns ergo tam fortem Nazaraeum tuum, quod et ipse propter meretricem mortuus est, et moriens nostros occidit inimicos, putavi, O Deus, ipsum esse Christum Filium tuum; verum quia mortuus est, et non resurrexit, et rursum captivus ductus est Israel, alius mihi Salvator mundi, et mei generis praestolandus est, Ut veniat cui repositum est et ipse erit exspectatio gentium.\
"""
