text = """
(Vers. 8.) Et mortuus est Abraham in senectute bona, senex et plenus, et collectus est ad populum suum. Male in Septuaginta Interpretibus additum est, et deficiens Abraham mortuus est: quia non convenit Abrahae deficere, et imminui. Illud quoque quod nos posuimus, in senectute bona senex et plenus: in Graecis codicibus ponitur, plenus dierum. Quod cum sensum videatur exponere, eo quod luce et diei operibus plenus occubuerit: tamen magis ad anagogen facit, si simpliciter ponatur plenus.\
"""
