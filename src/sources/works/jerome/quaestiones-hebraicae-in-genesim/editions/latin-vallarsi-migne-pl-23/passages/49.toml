text = """
(Vers. 10.) Et fuit, inquit, caput regni ipsius Babel et Arach, et Achad, et Chalanne in terra Sennaar. Nemrod, filius Chus, arripuit insuetam primus in populo tyrannidem, regnavitque in Babylone, quae ab eo, quod ibi confusae sunt linguae turrim aedificantium, BABEL (בבל) appellata est. Babel enim interpretatur confusio. Regnavit autem et in Arach, hoc est, in Edissa, et in Achad, quae nunc dicitur Nisibis: et in Chalanne, quae postea verso nomine a Seleuco rege est dicta Seleucia, vel certe quae nunc Κτησιφὼν appellatur.\
"""
