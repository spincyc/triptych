description = "Jerome's three-book commentary on the Epistle to the Galatians, the fullest Latin patristic treatment of the appointed Epistle of the Fifteenth Sunday after Pentecost. Book three carries Gal. 5:25-6:18. A locus is the prologue or a book, optionally with the chapter and verse of Galatians commented on."
