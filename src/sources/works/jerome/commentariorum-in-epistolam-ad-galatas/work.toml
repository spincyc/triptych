composed_basis = "Written at Bethlehem shortly after Jerome settled there, and dedicated to Paula and Eustochium; his own prefaces and the sequence of the Pauline commentaries place it in 386-387. The date is the writing, not Migne's 1845 printing."
alternate_titles = ["In epistulam ad Galatas", "Commentary on Galatians", "Commentariorum in epistulam Pauli apostoli ad Galatas libri III"]
