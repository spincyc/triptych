notes = "Migne's reprint of the Verona editors' text with his own prefatory and column apparatus; it is not a modern critical edition, and the critical edition is Giacomo Raspanti, CCSL 77A, which was not consulted. The commentary on the appointed Epistle stands at cols. 423-432. The container volume is registered separately as edition.jacques-paul-migne.patrologia-latina-volume-26.paris-1845. Language pairing: this is the work's original Latin; Andrew Cain's Fathers of the Church translation of 2010 is under copyright and was not sought, and no public-domain English of the work was located in the sweep that produced this record."
