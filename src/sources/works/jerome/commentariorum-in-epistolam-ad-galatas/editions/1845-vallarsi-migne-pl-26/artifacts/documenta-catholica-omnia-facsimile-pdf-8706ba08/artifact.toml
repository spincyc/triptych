notes = "Complete work in 66 page images covering PL 26, cols. 307-438D, which is the extent the host's own catalogue page states. Two Migne columns to a PDF page, so cols. 423-432 fall on PDF pages 59-63. No text layer: pdftotext returns nothing and all reading was done from the images. Not retained: the host's PDF, because Documenta Catholica Omnia reserves rights in its electronic edition and the file is 27.4 MB, several times larger than any payload this library retains. A reader without the network cannot open it from a checkout; the wording a claim depends on must be quoted into the claim's own passage record."
