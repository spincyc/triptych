notes = "The constituent title page (leaf n4 of the Internet Archive item, retained here) names S. Eusebii Hieronymi Opera omnia, tomi quintus et sextus, in the Martianay recension revised by Vallarsi and Maffei, 'editio Parisiorum novissima', 'accurante ... J. P. Migne', 'venit apud editorem, in via dicta d'Amboise, pres la barriere d'Enfer, ou Petit-Montrouge', 1845. The volume's Elenchus (leaf n5) places the Commentaria in Ezechielem at col. 15 and the Commentaria in Danielem at col. 491. Column numbers are those of this 1845 printing. The Internet Archive catalogues the item under an unrelated series title; the page images control."
