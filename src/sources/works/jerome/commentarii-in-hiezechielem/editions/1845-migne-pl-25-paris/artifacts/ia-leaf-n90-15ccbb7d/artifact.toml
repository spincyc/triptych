notes = "One complete page image of printed columns 181-182, Commentariorum in Ezechielem liber VI, the end of the comment on Ezekiel 18:25 and the comments on 18:26-32, then chapter XIX. Column 181 carries the comments on vv. 26, 27-28, 29, 30, 31 and 32 read by the research stage of PC-S52-A. Retained because the volume's scan is too large to hold and its optical text is badly damaged at these columns; a reader without the network can read the columns here."
