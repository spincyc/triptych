description = "The official report of debates in the House of Commons and the House of Lords. Two debates are registered here because each argues a verse of the appointed Epistle of the Fifteenth Sunday after Pentecost on the floor of a House: the 1942 Commons debate on family allowances, in which the Epistle's own internal tension between Galatians 6:2 and 6:5 is put on both sides, and the 1949 Lords debate in which Lord Vansittart quotes Galatians 6:7 and answers it. A locus is House, volume and column."
