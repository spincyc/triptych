notes = "Retained because the seventh prefatory question on Genesis 15 is the earliest identified statement of the difficulty that the star-promise of Genesis 15:5 precedes the chapter's own sunset, and because it is the load-bearing witness for a publication's central historical finding. Abbreviations and Hebrew numerals are left exactly as the transcriptions give them; the citation of the Talmud in question 7 as Shabbat 157 corresponds to the passage cited by modern foliation as Shabbat 156a."
