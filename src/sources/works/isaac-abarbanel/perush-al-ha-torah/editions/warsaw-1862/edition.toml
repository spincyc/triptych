notes = "The nineteenth-century Warsaw printing, which is the exemplar behind the widely circulated digital transcriptions of Abarbanel on the Torah. It is in the public domain. Its abbreviations are heavy and its Hebrew numerals are unexpanded; transcriptions of it differ chiefly in how they expand or fail to expand those. No page images of this printing were consulted for the records registered here."
