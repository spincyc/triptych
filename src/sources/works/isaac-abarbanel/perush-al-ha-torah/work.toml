description = "Don Isaac Abarbanel's commentary on the Pentateuch, composed after his expulsion from Spain in 1492 and first printed in the sixteenth century. Its distinctive method is to preface each unit with a numbered list of difficulties and then to expound the verses so that the difficulties are resolved; the question lists are therefore a primary record of what a fifteenth-century reader found hard in a passage. A locus is BookToken.chapter or BookToken.chapter.verse; prefatory questions are cited by chapter with the question number stated in prose."
