description = "The Congregation for the Doctrine of the Faith's documentary publication of 26 June 2000 on the message of Fatima: Archbishop Tarcisio Bertone's introduction, the first and second parts of the secret from Sister Lucia's Third Memoir (31 August 1941) with Fourth Memoir annotations, the third part written at Tuy on 3 January 1944 in facsimile and translation, John Paul II's letter of 19 April 2000, the record of the 27 April 2000 conversation with Sister Lucia, Cardinal Angelo Sodano's announcement of 13 May 2000, and Cardinal Joseph Ratzinger's theological commentary. Loci are the dossier's named constituent documents."
