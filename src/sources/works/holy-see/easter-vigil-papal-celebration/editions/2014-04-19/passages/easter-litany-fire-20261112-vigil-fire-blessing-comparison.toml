notes = "Omit angularem scilicet lapidem after Filium tuum, removing the explicit cornerstone apposition. Omit productum e silice, nostris profuturum usibus before novum hunc ignem, removing the physical flint-origin and practical-use descriptions. Omit eumdem in the old full short conclusion; the complete exact Per Christum Dominum nostrum and response are separately attested in PustetAP776. Normalize coelestibus to caelestibus, capitalization, ligatures, accents and punctuation; the cross is an action marker, not an English word. Project-created adapted study English from a complete independently old prayer, with the individually reviewed omissions and separately witnessed full conclusion and response. The modern comparison is the official Vatican booklet for the specific Easter Vigil of 19 April 2014; it does not authenticate the exact 2008 Missal. This is neither historical human English nor approved liturgical English, and is not for recitation."
