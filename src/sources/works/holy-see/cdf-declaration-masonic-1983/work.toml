title = "Declaratio de associationibus massonicis (Quaesitum est, 26 November 1983)"
responsible = "Sacred Congregation for the Doctrine of the Faith"
work_type = "dicasterial-declaration"
alternate_titles = ["Declaration on Masonic Associations", "Quaesitum est"]
languages = ["la"]
locus_pattern = 'complete-text'
description = "The CDF declaration of 26 November 1983 (AAS 76 [1984] 300), signed by Cardinal Ratzinger and approved and ordered published by John Paul II: occasioned by the new Code's omission of express mention of Masonic associations, it attributes the omission to an editorial criterion, declares the Church's negative judgment unchanged because Masonic principles 'have always been considered irreconcilable with the doctrine of the Church', states that membership remains forbidden and that the faithful who enrol 'are in a state of grave sin and may not receive Holy Communion', and denies local ecclesiastical authorities competence to derogate."
