context = "The complete Latin declaration was read: the incipit 'Quaesitum est an mutata sit Ecclesiae sententia circa associationes massonicas, propterea quod in novo Codice Iuris Canonici de ipsis non fit mentio expressa sicut in vetere Codice'; the editorial-criterion answer; the operative sentence 'Perstat igitur immutata sententia negativa Ecclesiae circa associationes massonicas, quia earum principia semper inconciliabilia habita sunt cum Ecclesiae doctrina ideoque eisdem adscriptio ab Ecclesia prohibita remanet. Christifideles qui associationibus massonicis nomen dant in peccato gravi versantur et ad Sacram Communionem accedere non possunt.'; the denial of local derogating competence with the reference to the declaration of 17 February 1981 (AAS 73 [1981], 240-241); the papal approval and publication order; the date 26 November 1983; the signatures of Cardinal Ratzinger and Archbishop Hamer; and the AAS 76 (1984), 300 reference."
