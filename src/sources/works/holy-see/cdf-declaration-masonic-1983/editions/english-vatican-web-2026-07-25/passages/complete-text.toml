context = "The complete English declaration was read: the question whether there has been 'any change in the Church's decision in regard to Masonic associations since the new Code of Canon Law does not mention them expressly, unlike the previous Code'; the editorial-criterion answer ('contained in wider categories'); the operative sentences 'the Church's negative judgment in regard to Masonic association remains unchanged since their principles have always been considered irreconcilable with the doctrine of the Church and therefore membership in them remains forbidden. The faithful who enrol in Masonic associations are in a state of grave sin and may not receive Holy Communion.'; the denial that local ecclesiastical authorities may 'give a judgment on the nature of Masonic associations which would imply a derogation', in line with the declaration of 17 February 1981; John Paul II's approval and publication order; the date; and the signatures of Cardinal Ratzinger and Archbishop Hamer."
