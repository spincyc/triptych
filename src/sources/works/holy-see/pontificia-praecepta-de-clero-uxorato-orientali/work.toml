description = "The act of the Congregation for the Eastern Churches, dated 14 June 2014 and approved by Pope Francis in an audience of 23 December 2013, conferring on Eastern Hierarchs and Ordinaries outside the traditional Eastern territories the faculty to permit the pastoral service of married Eastern clergy and to ordain married candidates, while reserving the faculty to the dicastery where Eastern faithful have no proper structure. Its introductory note surveys the restrictions imposed from 1890 onward and states that all the Eastern Catholic Churches except the Syro-Malabar and Syro-Malankara may admit married men to the diaconate and presbyterate."
