notes = "The Holy See archive file is a typeset text transcription without page images. It prints the condemned pamphlet's title-year as '1845'; since the apparition fell on Saturday 19 September 1846 and the pamphlet's own title-word is 'samedi', the reading 1846 is required and the transcription's reading is recorded rather than silently replaced. The volume's index confirms the locus at 'Salette, 287' and 'Salettensis apparitio, 288'. Exact file bytes not retained in the repository."
