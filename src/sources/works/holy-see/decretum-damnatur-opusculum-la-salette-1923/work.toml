description = "The decree of the Supreme Sacred Congregation of the Holy Office, Feria IV, 9 May 1923, dated at Rome 10 May 1923 and subscribed by the notary Aloisius Castellano, by which the Cardinals charged with guarding faith and morals proscribed and condemned the pamphlet 'L'apparition de la tres Sainte Vierge sur la sainte montagne de la Salette le samedi 19 septembre 1846. Simple reimpression du texte integral publie par Melanie, etc.' (Societe Saint-Augustin, Paris-Rome-Bruges, 1922), ordering those whom it concerns to see that copies of the condemned pamphlet are withdrawn from the hands of the faithful; Pius XI approved the resolution on the same day. Published in Acta Apostolicae Sedis 15 (1923), pp. 287-288. The act condemns a named imprint; it does not mention the apparition, the 1851 judgment, the shrine, or the devotion. Loci are the parts of the act."
relations = ["work.holy-see.acta-apostolicae-sedis", "work.melanie-calvat.secret-complet-de-la-salette", "work.holy-see.decretum-secret-de-la-salette-1915"]
