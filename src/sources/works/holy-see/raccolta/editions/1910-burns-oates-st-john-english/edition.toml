notes = "Identified from the page images of Internet Archive item theraccoltaorcol00unknuoft (University of Toronto, John M. Kelly Library copy, donated by the Redemptorists of the Toronto Province; scanner uoft3), read on 2026-11-18. The title page prints no year beyond 'The 1910 Edition'; the date is that statement. The imprimatur of 10 May 1909 is printed immediately above the Appendix heading, so whether it approves the whole book or the appendix is not settled by the page. English translation of the indulgence collection, numbered in its own series (e.g. no. 74 Novena for Christmas, no. 182 The Angelus and Regina Coeli); prayers in Latin are printed beside their English in two columns. Its indulgences are historical grants as summarised in 1910, NOT current indulgence law. The work record's languages field lists Italian only; this English edition prints English and Latin. An earlier St John English edition (IA raccoltaorcolle00stjgoog, dated 1880 by IA, a Google digitisation) was not registered: this 1910 edition carries both the Angelus text and the Christmas-novena entry."
