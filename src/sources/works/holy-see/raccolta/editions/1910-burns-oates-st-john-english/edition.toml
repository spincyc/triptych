publication = "London: Burns & Oates, 28 Orchard Street; New York, Chicago, Cincinnati: Benziger Bros. Title page directly read at PDF p. 7 of Internet Archive item theraccoltaorcol00unknuoft: THE RACCOLTA / OR COLLECTION OF INDULGENCED / PRAYERS & GOOD WORKS / By AMBROSE ST JOHN / Of the Oratory of St Philip Neri, Birmingham / The 1910 Edition / BURNS & OATES 28 Orchard Street London W | BENZIGER BROS New York, Chicago Cincinnati. Approbation at PDF p. 436, above the Appendix: Nihil obstat Henricus S. Bowden, Censor Deputatus; Imprimatur Edmundus Surmont, Vicarius Generalis; Westmonasterii, die 10 Maii, 1909."
