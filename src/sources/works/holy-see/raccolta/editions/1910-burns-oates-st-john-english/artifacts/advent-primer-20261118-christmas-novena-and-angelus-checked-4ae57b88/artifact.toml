rights_basis = "Public domain in the United States by publication date. The title page of this copy (PDF p. 7, read on the image on 2026-11-18) reads THE RACCOLTA OR COLLECTION OF INDULGENCED PRAYERS & GOOD WORKS By AMBROSE ST JOHN Of the Oratory of St Philip Neri, Birmingham The 1910 Edition BURNS & OATES 28 Orchard Street London W | BENZIGER BROS New York, Chicago Cincinnati; the only approbation found (PDF p. 436, above the Appendix) is Nihil obstat Henricus S. Bowden, Imprimatur Edmundus Surmont, Westmonasterii, die 10 Maii, 1909. Published 1909-1910 in London and New York, before 1931: out of United States copyright on the line guidance/missals.md section 5 records, written here as derived for calendar year 2026. Restoration under 17 U.S.C. 104A cannot keep it protected: a restored term runs no longer than ninety-five years from publication, which ended by 2005. No life-based term is relied on (Ambrose St John died in 1875; the 1910 revision's editors are not named on the pages read). This focused transcription reproduces only the printed English and Latin of that book and adds no authorship."
