transformation = "Read on page images rendered from the exact whole PDF at 150 dpi, with the Angelus columns re-read at 250 dpi, on 2026-11-18. One sense unit per LF-terminated UTF-8 line, each prefixed by a braced printed-page locator. Wording, spelling, capitalization and pointing as printed, with these declared renderings: words set in capitals and small capitals (DOMINI, LORD, HOLY GHOST, CHRIST, the drop-capital openings GRATIAM and POUR) are given in full capitals; the ligatures æ and œ are expanded (Mariae, Coeli, quaesumus); the versicle and response signs are U+2123 and U+211F; physical line wraps and division hyphens are joined; tight word spacing in the setting (verbumtuum, Etconcepitde) is read as the two or three words it sets; footnote reference numerals are omitted and the footnote is given on its own line prefixed footnote. Italic and roman are not distinguished. Latin and English columns of the Angelus are given as two blocks, Latin first. The OCR text layer was used only to find the pages."
