notes = "No. 74 Novena for Christmas (printed p. 61, PDF p. 81) and no. 182 The Angelus and Regina Coeli (printed pp. 151-152, PDF pp. 171-172): grants, the N.B. rubric, the footnoted sources, and the Angelus in Latin and English. The Regina coeli text that follows on p. 152 is not transcribed. Historical indulgence law as summarised in 1910, not current law. OCR-VS-PAGE: the text layer reads Leo XIII, April 5, 1884 in footnote 182; the page reads April 3, 1884. The collect conclusion is Per eundem (not eumdem) in this book. The English collect here differs from the 1915 Little Office's (that we, to whom ... may by his Passion and Cross be brought to the glory of his resurrection vs. ... may by His passion and cross be brought to the glory of His Resurrection, and in pointing); keep them separate. 37 LF-terminated lines."
