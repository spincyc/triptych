description = "The decree of 18 October 1988, Prot. N. 234/88, by which the Pontifical Commission Ecclesia Dei, in virtue of the special faculties granted it by the Supreme Pontiff, erected the Priestly Fraternity of Saint Peter as a clerical society of apostolic life of pontifical right; stated its object as the sanctification of priests through the pastoral ministry and the observance of the liturgical and disciplinary traditions recalled in Ecclesia Dei; invoked the rights of canon 611; conceded the use of the 1962 liturgical books to members and to guests and ministers in the Fraternity's churches; required communion with the bishop and diocesan presbyterate under cann. 679-683 and observance of canon 535 on parish registers; approved the constitutions for three years and named Father Josef Bisig superior general for three years; and subjected the Fraternity to the authority of the Apostolic See through the Commission donec aliter provideatur. Ratified in the papal audience of the same day. Never printed in Acta Apostolicae Sedis; the Latin is printed in Archiv fuer katholisches Kirchenrecht 157 (1988) 467-468."
