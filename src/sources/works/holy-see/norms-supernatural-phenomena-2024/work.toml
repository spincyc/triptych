description = "The Dicastery for the Doctrine of the Faith's norms given 17 May 2024, deliberated in the Ordinary Session of 17 April 2024, approved by Pope Francis on 4 May 2024, effective 19 May 2024 (Pentecost), replacing the norms of 25 February 1978. They restructure conclusions into six determinations (Nihil obstat; Prae oculis habeatur; Curatur; Sub mandato; Prohibetur et obstruatur; Declaratio de non supernaturalitate) and state that as a rule no authority will declare the phenomena of supernatural origin. Loci are the presentation, the numbered paragraphs (n./nn.), and the articles (art.)."
