notes = "Artifact PDF page 596 corresponds to printed Acta p. 596. The constituent was read in the artifact's optical text layer and its boundaries checked against the neighbouring headings. Re-collated on 2026-11-18 (verification lane V1): the controlling artifact is an OCR re-typesetting, not a page facsimile (see its notes), so p. 596 was read again on the microfilm page facsimile artifact.holy-see.acta-apostolicae-sedis.volume-52-1960.ia-microfilm-issue-pdf-51e41032, PDF p. 8, at 300 dpi. The whole decree stands on that page, from its heading to the subscriptions of Caietanus Card. Cicognani and Henricus Dante, dated 'Ex aedibus S. Rituum Congregationis, die 26 iulii anni 1960'; the binding clause reads 'et promulgat et promulgatum esse declarat, in novas Breviarii et Missalis romani editiones inserendum, et ab omnibus ad quos spectat, inde a die 1 ianuarii proximi anni 1961, servandum.' The boundaries and that wording agree."
