context = "The complete Ordo Missae subsection of the 2008 variation list, together with the immediately following Appendix ad Ordinem Missae subsection, was inspected. It records exactly six changes in the Order of Mass: at Missal p. 513, in n. 19, 'Credo in unum Deum' becomes 'Credo in Deum'; at p. 530, a rubric reading 'alias:' becomes 'post Octavam:' and a preface reads 'gloriosius praedicare' for 'gloriosus praedicare'; at p. 581, in n. 103, 'iterum tibi gratias agens' becomes 'iterum gratias agens'; at p. 605, in n. 144, three alternative dismissal formulas are added after 'Ite, missa est', namely 'Ite, ad Evangelium Domini annuntiandum', 'Ite in pace, glorificando vita vestra Dominum', and 'Ite in pace'; and at p. 616, the solemn-blessing rubric 'dicit invitatorium: Inclinate vos ad benedictionem vel aliis verbis expressum' becomes 'dicit invitationem: Inclinate vos ad benedictionem.' The Appendix subsection records five further changes at pp. 674-691 affecting the Eucharistic Prayers printed there. The Supplementum on printed p. 384 prints the three added dismissals under the heading 'Ad n. 144 Ordinis Missae (p. 605)' and, for the Pentecost vigil, the alternative 'Ite in pace, alleluia, alleluia.'"
artifact_page_ranges = [[53, 54], [66, 67]]
verified_on = "2026-07-25"
notes = "Artifact PDF pages 53-54 correspond to printed journal pp. 371-372 and carry the Ordo Missae and Appendix ad Ordinem Missae subsections; pages 66-67 correspond to printed pp. 384-385 and carry the Supplementum text of the added dismissals. The list is the published record of variations directly bearing on translation work; it is not a complete collation of the 2002 and 2008 altar books, and the notice printed at journal p. 367 states that further corrections of accent, punctuation, colour, and typography were made without being listed."
