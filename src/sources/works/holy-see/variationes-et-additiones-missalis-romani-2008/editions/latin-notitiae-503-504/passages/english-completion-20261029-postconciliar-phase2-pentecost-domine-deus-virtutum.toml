notes = "The complete petition is word-identical to independently image-checked Pustet 1862 printed p. 296 after case, stress accents, punctuation and printer-wrap transformations only. The old cue is Per Dominum.; the actual official 2008 cue is Per Christum Dominum nostrum., followed by the separate R. Amen. The proposed fresh study English renders the actual target short cue without expanding it and puts R. Amen. on its own line. The preceding Oremus invitation belongs to the source ritual introduction and is not silently included in the prayer body. No modern Latin body or received English is retained here."
