notes = "All five rendered pages were read against the exact registered official PDF bytes. Structural facts only: two separately seated Collect pointers; four ordered Old Testament readings and corresponding psalms/canticle; six after-reading prayer options, including three alternatives after Ezekiel; delayed Gloria; Romans 8:22-27 continuation; optional Vespers and dismissal provisions. No full modern Latin body, approved English, whole Missal authentication, complete extended Vigil, normal Ordinary frame or selected Vespers/dismissal branch is supplied. The excerpt permits silence in place of a responsorial psalm; this unimplemented alternative is retained as a modeling limit. Scripture numbering facts belong to this source; Psalms are Vulgate numbered, Exodus prints 19:3-8 without a, and Joel prints 3:1-5."
