description = "The decree of the Supreme Sacred Congregation of the Holy Office, dated at Rome 21 December 1915 and subscribed by the notary Aloisius Castellano, recording that some persons, even from the ecclesiastical body, continued to publish books, pamphlets, and periodical articles discussing the so-called Secret de la Salette, its various forms, and its application to present or future times, without and even against the permission of the ordinaries; commanding all the faithful of whatever region not to discuss or treat of the said subject under any pretext or in any form; attaching penalties (for priests, deprivation of dignity and suspension by the local ordinary from confessions and from celebrating Mass; for lay persons, exclusion from the Sacraments until repentance; for both, the sanctions of Leo XIII's Officiorum ac munerum and of Urban VIII's decree of 13 March 1625 on circulating alleged revelations); and expressly preserving devotion to the Blessed Virgin under the title of Reconciliatrix commonly called de la Salette. Published in Acta Apostolicae Sedis 7 (1915), p. 594. Loci are the parts of the act."
relations = ["work.holy-see.acta-apostolicae-sedis", "work.melanie-calvat.secret-complet-de-la-salette"]
