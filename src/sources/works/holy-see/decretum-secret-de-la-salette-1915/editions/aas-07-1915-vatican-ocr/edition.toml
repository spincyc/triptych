notes = "The Holy See archive file is a typeset text transcription of the volume and carries no page images, so image collation is not possible by that route. Two evident defects affect this act: the second correlative of tum...tum is printed 'cum', and the saving clause is printed 'Beconciliatricis' for Reconciliatricis. The volume's own analytical index confirms the locus at 'Dec. 21 Decretum circa vulgo dictum «Secret de la Salette». 594'. Exact file bytes not retained in the repository."
