context = "The complete decree was read: the protocol number 99/2009; the finding that notwithstanding the admonitions addressed to the Superior General of the Society, Bishop Alfonso de Galarreta incurred ipso facto the penalties of can. 1387 and can. 1364 s. 1 CIC 2021 for an act of a schismatic nature consisting in the episcopal consecration of four presbyters without pontifical mandate and against the will of the Supreme Pontiff; the declaration for all juridical effects that he and Pascal Schreiber, Michael Goldade, Michel Poinsinet de Sivry and Marc Hanappier incurred the excommunication latae sententiae reserved to the Apostolic See; the declaration that Bishop Bernard Fellay, having taken part directly in the liturgical celebration as co-consecrator and so publicly adhered to the schismatic act, incurred the excommunication latae sententiae of can. 1364 s. 1; the admonition to clerics and lay faithful not to adhere to the schism; the dating 'Dal Palazzo del Dicastero, 2 luglio 2026'; and the three signatures."
