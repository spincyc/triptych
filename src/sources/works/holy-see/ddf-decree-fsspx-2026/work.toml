description = "The decree of 2 July 2026, protocol N. 99/2009, declaring that Bishop Alfonso de Galarreta, having performed an act of a schismatic nature by the episcopal consecration of four presbyters without pontifical mandate and against the will of the Supreme Pontiff, incurred ipso facto the penalties of canons 1387 and 1364 s. 1 of the Code as revised in 2021; declaring for all juridical effects that he and Pascal Schreiber, Michael Goldade, Michel Poinsinet de Sivry and Marc Hanappier incurred the excommunication latae sententiae reserved to the Apostolic See; declaring that Bishop Bernard Fellay, as co-consecrator publicly adhering to the schismatic act, incurred the excommunication of canon 1364 s. 1; and admonishing clerics and lay faithful not to adhere to the schism. Signed by Cardinal Victor M. Fernandez, Prefect, Archbishop John J. Kennedy, Secretary for the Disciplinary Section, and Monsignor Armando Matteo, Secretary for the Doctrinal Section."
