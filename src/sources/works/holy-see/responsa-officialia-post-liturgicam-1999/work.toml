description = "The official responses of 3 July 1999, protocol 1411/99, signed by Cardinal Jorge Medina Estevez and Archbishop Francesco Pio Tamburrino, answering three questions about the use of the Missal of Paul VI by priests of communities enjoying the faculty of the 1962 Missal: that such a priest may and in some circumstances must celebrate with the post-conciliar Missal when he celebrates in a community that uses it; that superiors of such communities, of whatever dignity, may not forbid it; and that concelebration in the current Roman rite may not be forbidden and is praiseworthy, especially at the chrism Mass. Printed in Notitiae 35 (1999) 307-309."
