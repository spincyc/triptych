description = "Two 1916 acts applying the Holy Office decree of 21 December 1915 to a named publication. First, the declaration of the Supreme Sacred Congregation of the Holy Office, Feria IV, 12 April 1916, dated 13 April 1916, that the work 'La Lecon de l'Hopital Notre-Dame d'Ypres - Exegese du Secret de la Salette' by 'Dr Henry Mariave', volume I (Paris, 1915) and volume II, Appendices (Montpellier, 1915), is condemned and proscribed under the general rules of Officiorum ac munerum. Second, the decree of the Sacred Congregation of the Index of 5 June 1916, dated 6 June 1916 and approved by Benedict XV, listing the same work among works condemned and to be entered in the Index of Prohibited Books. Published in Acta Apostolicae Sedis 8 (1916), p. 175 and pp. 178-179. The author's forename is printed 'Henry' in the first act and 'Henri' in the second."
relations = ["work.holy-see.acta-apostolicae-sedis", "work.holy-see.decretum-secret-de-la-salette-1915", "work.holy-see.index-of-prohibited-books-notification-1966"]
