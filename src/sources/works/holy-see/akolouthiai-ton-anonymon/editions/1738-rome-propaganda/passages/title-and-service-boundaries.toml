context = "The Greek title reads Ἀκολουθίαι τῶν ἀνωνύμων and names offices together with the liturgies of John Chrysostom, Basil and the Presanctified gifts and Sunday Apostle and Gospel readings. It prints April 1738. The diataxis of the Divine Liturgy begins PP7. The Presanctified liturgy ends PP97–PP98, followed by a new pagination at PP99 headed Ἀρχὴ σὺν Θεῷ ἁγίῳ τῶν ἀνωνύμων ἀκολουθιῶν. The second series ends with printed ρʹ (100) and τέλος at PP198; PP199–PP200 are blank leaves."
verified_on = "2026-10-17"
notes = "Direct inspection of the retained original-language page images at the named loci. Short Greek quotations use Unicode characters and expand typographic ligatures; lineation and rubric color are described separately. No complete transcription, complete collation or physical-volume completeness is claimed. The title leaf does not itself name Rome or Propaganda Fide. That attribution is supplied by the matching BnF catalogue record https://catalogue.bnf.fr/ark:/12148/cb39303242b, whose bracketed imprint is [Roma, Tipografia di propaganda fide]. Its extent [2]-128-100 pages differs from the 202-image offered witness and must not be taken as verified physical extent here. No direct relationship to the 1754 book is established."
