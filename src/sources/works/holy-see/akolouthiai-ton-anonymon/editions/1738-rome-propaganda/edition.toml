notes = "The original Greek title PP5 names the Akolouthiai, the Transfiguration office, the liturgies of John Chrysostom and Basil, the Presanctified liturgy, and Sunday Apostle and Gospel readings; its date is April 1738. Rome and Propaganda Fide are catalogue attributions, not a Latin imprint transcribed from this title image. The bound witness is acquired as offered; its relationship to the 1754 Euchologion is not established."
