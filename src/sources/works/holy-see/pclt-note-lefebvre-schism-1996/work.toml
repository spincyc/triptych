title = "Explanatory note on the excommunication for schism incurred by adherents of the movement of Bishop Marcel Lefebvre (24 August 1996)"
responsible = "Pontifical Council for Legislative Texts"
work_type = "dicasterial-note"
languages = ["it"]
locus_pattern = 'complete-text'
description = "The note sent by the Pontifical Council for Legislative Texts to the Congregation for Bishops on 24 August 1996, in response to a request transmitted from the Bishop of Sion, and afterwards published by the Council (Communicationes 29 [1997] 239-243). The covering letter states that no authentic interpretation of Ecclesia Dei, of the Congregation for Bishops' decree of 1 July 1988, or of canons 1364 s. 1 and 1382 appeared to be required, and offers considerations and suggestions instead. The note holds that the whole Lefebvrian movement is to be regarded as schismatic until hierarchical communion is restored, that the validity of the bishops' excommunications cannot reasonably be doubted, that a state of necessity must be objectively verified and never justifies consecrating bishops against the will of the Roman Pontiff, and that formal adherence to the schism requires an internal and an external element, with lay situations to be judged case by case. The Dicastery for the Doctrine of the Faith made the note its own on 2 July 2026."
