context = "The complete document was read: the covering letter identifying the request of Bishop Norbert Brunner of Sion transmitted on 26 July 1996 and denying that an authentic interpretation was required; and the note's ten numbered paragraphs, including n. 1 on the schism declared in immediate relation to the ordinations of 30 June 1988 as the consummation of a progressive global schismatic situation, n. 3 that the whole movement is to be held schismatic until hierarchical communion is restored, n. 4 on the validity of the excommunications and on the state of necessity, n. 5 on the internal and external elements of formal adherence, n. 6 on deacons and priests of the movement, n. 7 on other faithful and case-by-case judgment, and n. 8 on distinguishing the sin of schism from the delict."
