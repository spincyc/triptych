context = "The complete article was read. Checked loci include: the statement that the Church's negative judgment was 'inspired by many reasons, both practical and doctrinal' and that from the earliest documents and 'in particular' Humanum genus the Magisterium denounced in Freemasonry 'philosophical ideas and moral conceptions opposed to Catholic doctrine', for Leo XIII essentially 'a rationalistic naturalism'; the quotation of Leo XIII's letter Custodi (8 December 1892), 'Let us remember that Christianity and Freemasonry are essentially irreconcilable, so that enrolment in one means separation from the other'; the 1970-1980 correspondence with episcopal conferences occasioned by dialogue with lodges declaring themselves not hostile; the decision to prescind 'from consideration of the practical attitude of the various lodges' and take a position 'on the level of the irreconcilability of the principles'; the analysis of the lodges' 'progressive system of symbols of an extremely binding nature', the 'rigid rule of secrecy', the relativizing force on the act of faith even without an explicit obligation to profess relativism, and the impossibility of living one's relation with God 'in a twofold mode'; the explanation that membership 'objectively constitutes a grave sin'; and the closing account of the reservation to the Apostolic See, noting that 'despite the diversity which may exist among Masonic obediences ... the Apostolic See discerns some common principles in them which require the same evaluation by all ecclesiastical authorities.'"
verified_on = "2026-07-25"
notes = "Quoted wording extracted verbatim from the exact fetched response. The Italian original in L'Osservatore Romano of 23 February 1985 was not consulted."
