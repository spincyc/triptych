description = "The unsigned explanatory article published in L'Osservatore Romano (23 February 1985; English edition 11 March 1985) presenting the significance of the 1983 Declaration on Masonic Associations: the doctrinal rather than merely practical basis of the negative judgment, the 1970-1980 correspondence with episcopal conferences, the decision to prescind from the practical attitudes of particular lodges, the analysis of the lodges' binding symbolic system, secrecy, and relativizing force on the act of faith, the explanation that membership 'objectively constitutes a grave sin', and the reservation of judgments on the nature of Masonic associations to the Apostolic See. An explanation of a declaration, not itself a declaration."
