description = "The CDF declaration of 6 August 2000 (AAS 92 [2000] 742-765), signed by Cardinal Ratzinger as Prefect and Archbishop Bertone as Secretary, ratified and confirmed by John Paul II at the audience of 16 June 2000 and ordered published: against relativistic theories that would justify religious pluralism de iure, it reasserts the fullness and definitiveness of the revelation of Jesus Christ (nn. 5-8), the unicity of the Incarnate Word and of his salvific mystery (nn. 9-15), and the unicity and salvific universality of the Church (nn. 16-22), in twenty-three numbered paragraphs."
