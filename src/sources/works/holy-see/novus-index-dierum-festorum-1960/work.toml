id = "work.holy-see.novus-index-dierum-festorum-1960"
title = "Decretum: Novus index statuitur dierum festorum, quibus inest obligatio litandi Sacrum pro populo"
responsible = "Sacred Congregation of the Council"
work_type = "general-decree"
languages = ["la"]
description = "The decree of the Sacred Congregation of the Council of 3 December 1960, issued by mandate of John XXIII after the 1960 code of rubrics had altered the treatment of feast days, fixing a taxative list of the days on which the obligation of applying the Mass pro populo under cann. 339 §1 and 466 §1 of the 1917 Code binds in the universal Church from 1 January 1961. It lists first- and second-class Sundays and ten first-class feasts of the universal calendar as festa de praecepto, and separately enumerates the first- and second-class feasts that are not de praecepto. It defines that term for the pro populo obligation only and is not a list of the days on which the faithful are bound to hear Mass."
relations = ["work.holy-see.acta-apostolicae-sedis", "work.catholic-church.rubricae-breviarii-et-missalis-romani", "work.catholic-church.codex-iuris-canonici-1917"]
