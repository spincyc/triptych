description = "The letter addressed to the bishops on 17 May 1979 by the Sacred Congregation for the Doctrine of the Faith, approved by John Paul II and signed by Cardinal Franjo Seper and Archbishop Jerome Hamer, recalling what the Church holds about what happens between the death of the Christian and the general resurrection. It sets out seven numbered points, of which the fifth states that the glorious manifestation of the Lord is believed to be distinct from and deferred with respect to the situation of people immediately after death, and the seventh distinguishes the purification of the elect from the punishment of the damned. It then warns teachers against arbitrary imaginative representations of the state after death while forbidding the over-attenuation of the scriptural images. It is an authoritative but non-definitive act of the Roman Curia, not a conciliar or papal definition."
