description = "The letter of Cardinal Dario Castrillon Hoyos of 29 June 2000, read to the Fraternity's general chapter at Wigratzbad by Monsignor Camille Perl, refusing to approve the February 2000 compromise as a special law on the ground that a priest enjoying the privilege of the 1962 Missal does not lose the right to use the Missal of 1970 and that no superior below the Supreme Pontiff may prevent him from following the general law; limiting the office of superior general to two consecutive six-year terms; appointing Father Arnaud Devillers superior general for six years; and requiring new rectors for both seminaries. Not published by the Holy See."
