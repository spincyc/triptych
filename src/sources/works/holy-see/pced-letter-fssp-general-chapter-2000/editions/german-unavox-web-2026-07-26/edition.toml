notes = "The page's headnote states that the letter was published on the German site of the Society of Saint Pius X on 10 July 2000 and translated from German by a French traditionalist bulletin on 12 July. Its title-line gives 26 June and its text 29 June; the recourse lodged on 13 July 2000 cites 29 June. The same page and German text are cited in Prawo Kanoniczne 69/1 (2026) 179 n. 23."
