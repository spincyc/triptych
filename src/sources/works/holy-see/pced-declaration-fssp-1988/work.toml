description = "The letter of 22 July 1988 by which Cardinal Augustin Mayer, president, and Camille Perl, secretary, acknowledged the foundation of the Priestly Fraternity of Saint Peter at Hauterive on 18 July 1988 by twelve former priests of the Society of Saint Pius X, declared the Commission's readiness to erect it as a society of apostolic life under canons 731-746, promised the status of pontifical right after review and recognition of statutes ad experimentum, and recognized as valid the founders' election of a superior. Never printed in Acta Apostolicae Sedis; the German original is published in English translation by the beneficiary."
