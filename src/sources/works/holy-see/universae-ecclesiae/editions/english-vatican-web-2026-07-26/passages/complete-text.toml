context = "The complete English instruction was read. Its operative numbers include n. 24, requiring that the liturgical books of the forma extraordinaria be used as they are and that celebrants know and correctly follow their rubrics; n. 25, that new saints and certain of the new prefaces can and ought to be inserted into the 1962 Missal according to provisions to be indicated subsequently; n. 26, giving three arrangements for the readings, namely Latin alone, Latin followed by the vernacular, or, in low Masses, the vernacular alone; n. 28, that Summorum Pontificum, by virtue of its character as special law, derogates within its own area from provisions connected with the sacred rites promulgated from 1962 onwards and incompatible with the rubrics of the 1962 books; and nn. 29-35 on Confirmation, orders, the Breviary, the Triduum, religious rites, and the 1962 Pontifical, Ritual and Ceremonial."
verified_on = "2026-07-26"
notes = "The complete official English delivery was read publication-locally; the restricted bytes are not retained. The instruction's operative provisions were superseded in substance by Traditionis custodes and its subsequent acts."
