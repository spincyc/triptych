id = "work.holy-see.cdf-norms-apparitions-1978"
title = "Norms regarding the manner of proceeding in the discernment of presumed apparitions or revelations"
responsible = "Sacred Congregation for the Doctrine of the Faith"
work_type = "curial-norms"
languages = ["la", "en"]
description = "Procedural norms deliberated in plenary session, approved by Paul VI on 24 February 1978 and dated 25 February 1978, signed by Cardinal Seper as Prefect and Jerome Hamer, O.P., as Secretary. They set a three-step path (judgment by positive and negative criteria; permission of cult under the formula pro nunc nihil obstare; a later judgment of authenticity and supernatural character), the positive and negative criteria, and the competences of the local Ordinary, the episcopal conference, and the Apostolic See. Entirely replaced by the DDF Norms of 17 May 2024, effective 19 May 2024 (art. 27 of the latter). This record makes no claim about when or in what form the 1978 text was first made publicly available."
relations = ["work.holy-see.norms-supernatural-phenomena-2024"]
