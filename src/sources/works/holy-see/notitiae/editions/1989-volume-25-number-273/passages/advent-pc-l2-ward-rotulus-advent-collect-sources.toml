context = "Ward's article tabulates the Rotulus of Ravenna prayers that the 1970 Missal reused. Located in this artifact's text layer: no. 2 Deus, qui splendorem gloriae tuae (source of the 19 December collect), no. 24 Omnipotens sempiterne Deus, nativitatem Christi Filii tui secundum carnem propinquare cernentes (23 December), no. 25 Deus, qui conspicis populum tuum incarnationem dominicam fideliter exspectare (Advent III), no. 30 Deus, aeterna maiestas, cuius ineffabile Verbum, Angelo deferente (20 December), no. 31 Deus, humanae conditor et Redemptor naturae (17 December). The first located occurrences fall on artifact pp. 44, 46, 46, 47 and 47; the article cites each again in later tables through p. 73."
notes = "advent-pc lane 2. Read in the hash-matched restricted PDF's text layer only. Ward's Latin is a modern scholarly presentation of a fifth- or sixth-century roll and is a restricted 1989 publication: study evidence for relation and kind of change, not a public-domain witness of any wording. Public-domain Rotulus editions (Ceriani 1883; Cabrol-Leclercq, Monumenta Ecclesiae Liturgica I) were not acquired."
