context = "Francis, Desiderio desideravi, dated 29 June 2022, Latin paragraph 60, prints the complete In spiritu humilitatis prayer and explicitly attributes it in note 20 to Missale Romanum (2008), p. 515. This is an official complete-unit quotation with explicit edition attribution, not an inference from publication date or silence in a corrections list."
notes = "Fresh direct page-image comparison confirms the same entire sequence of prayer words as Pustet 1862 printed p. 218 / artifact p. 304, including hodie and no Amen. Differences are accents, case, punctuation and line wrapping. This establishes whole prayer-word agreement, not photographic or typographic identity, surrounding rubrics, speaker marks, a complete 2008 Missal or a complete Ordinary. The carrier is an official quotation of p. 515, not an image of that Missal page. No prayer body is transcribed into this record. The separate Lava me quotation on the same page is outside this admission."
