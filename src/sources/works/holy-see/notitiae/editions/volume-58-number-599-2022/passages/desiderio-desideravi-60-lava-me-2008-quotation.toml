context = "Francis, Desiderio desideravi, Latin paragraph 60, prints the complete washing-of-hands prayer and explicitly attributes it in note 21 to Missale Romanum (2008), p.515. This is an official complete-unit quotation with explicit edition attribution, not an inference from its publication date."
notes = "Fresh page-image comparison confirms all twelve words in their exact order agree with the complete medieval antiphon at Wrocław R503 folio 49r. The only textual display differences are u/v, capitalization, punctuation and wrapping. The selected transcription preserves the old lower-case domine and supplies no punctuation. This establishes whole prayer-word agreement only: not photographic identity, surrounding Missal rubrics, chant, liturgical approval, a whole 2008 exemplar or approved English. The official carrier is a quotation, not an image of the Missal page. No modern prayer body or page payload is transcribed into this record."
