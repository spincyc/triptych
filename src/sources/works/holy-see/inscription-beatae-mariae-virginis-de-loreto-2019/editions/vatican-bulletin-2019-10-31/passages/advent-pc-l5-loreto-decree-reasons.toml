context = "The English decree (signed Robert Card. Sarah, Prefect, and Arthur Roche, Archbishop Secretary) gives its reasons, to be paraphrased with this locus and not quoted: the Holy House has been venerated since the Middle Ages; the shrine recalls the mystery of the Incarnation (Gal 4:4; the angel's message and the Virgin's answer); it shows the virtues of the Holy Family no less than Nazareth; saints and blesseds answered their vocations there, the sick sought consolation there, the Litany of Loreto spread from there throughout the world, and all who travel by air have found in her their heavenly patron. It places the optional memorial in the General Roman Calendar on 10 December, the day the feast falls in Loreto, so that it may help families, young people and religious to imitate the Virgin. The Latin annex's Office note states that a chronicle of 1465 says the Holy House was found on the night of 9-10 December 1294 and that Benedict XV proclaimed Our Lady of Loreto patroness of aviators."
notes = "Metadata-only source record. The bytes fetched on 2026-11-26 differ from the 2026-11-12 artifact official-html-9c6e1926 (19,994 bytes); the decree's wording was read in this fetch only. Post-1975 Holy See text: paraphrase with locus; no quotation is authorised by this record."
