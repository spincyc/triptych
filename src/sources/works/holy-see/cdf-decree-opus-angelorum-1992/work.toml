composed = "1992-06-06"
composed_basis = "The decree is dated 6 June 1992 and printed in Acta Apostolicae Sedis 84 (1992) 805-806; the date is the signature."
description = "The Congregation's decree on the doctrine and practices of the association Opus Angelorum. It restates the decisions of 1983 (devotion to the holy angels according to the teaching of the Church and the Fathers; no use of angelic names drawn from the private revelations attributed to Gabriele Bitterlich) and adds five norms: those theories may not be taught or used; consecrations to the angels are prohibited; administration of sacraments at a distance and insertion of such texts into the liturgy are prohibited; exorcisms follow only the Church's norms; a delegate of the Holy See oversees the application. A locus is the norm, I-V."
