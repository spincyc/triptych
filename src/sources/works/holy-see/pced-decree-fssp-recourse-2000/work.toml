description = "The decree of 12 October 2000 answering the administrative recourse lodged on 13 July 2000 against five decisions of letter N. 748/2000: rejecting the recourse on the limitation of terms (citing a recommendation of the Congregation for Religious on canon 624), on the withdrawal for that occasion of the chapter's electoral right (citing canon 631 s. 1 and canon 593), and on the choice of person (citing canon 148); and accepting it on the seminaries, as moot, and on the requested interpretation of an expression. Not published by the Holy See and, as of 2026-07-26, corroborated by no witness other than the archive that publishes it."
