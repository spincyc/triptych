description = "The Urbis et Orbis decree of the Sacred Congregation of Rites, 13 November 1907 (Cardinal Cretoni, Prefect), by which Pius X extended the feast of the Apparition of the Blessed Virgin Mary Immaculate ('vulgo de Lourdes'), previously granted by Leo XIII to petitioning churches and religious families with the proper Office and Mass approved 11 July 1890, to the universal Church as a double major on 11 February, from 1908, the fiftieth year from the apparitions; with the appended addition to the sixth lesson of the proper Office approved 27 November 1907. Published in Acta Sanctae Sedis 40 (1907). Loci are the ASS volume's printed page numbers."
relations = ["work.holy-see.acta-sanctae-sedis"]
