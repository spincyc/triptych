description = "The rescript from the papal audience of 20 February 2023 granted to Cardinal Arthur Roche, confirming that dispensations for the use of a parish church or erection of a personal parish for 1962-Missal celebration and permissions for priests ordained after Traditionis custodes are reserved in a special way to the Apostolic See, obliging bishops who granted such dispensations to inform the Dicastery, and confirming the 2021 Responsa."
