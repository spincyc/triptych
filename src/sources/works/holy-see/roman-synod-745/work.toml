composed_basis = "The acta date the synod under Pope Zachary to 25 October 745; the edition read is Monumenta Germaniae Historica, Concilia II.1 (1906), pp. 37-44."
description = "The Roman synod under Pope Zachary that condemned the Frankish preachers Aldebert and Clement. In its third session it read Aldebert's prayer invoking angels by name and ruled that only three angelic names, Michael, Gabriel, and Raphael, are known to the Church. A locus is the session (actio)."
