notes = "The Holy See archive file is a typeset text transcription without page images. The authenticated copy is dated 11 December 1878 and subscribed Placido Ralli, Secretary, and Giovanni Ponzi, Substitute. A companion rescript for the diocese of Maurienne, dated 7 July 1877 and published in Acta Sanctae Sedis 13 (1880), p. 426, permits confraternities, altars, and oratories under the name of Our Lady of La Salette subject to the condition expressed in this decree; that volume's cross-reference to 'Vol. XI, p. 509' is one page-range short of the decree's actual opening at p. 512. Exact file bytes not retained in the repository."
