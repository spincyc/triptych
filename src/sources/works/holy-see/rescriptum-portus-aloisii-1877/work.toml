description = "The rescript of the Sacred Congregation of Rites of 12 May 1877, on five dubia proposed by the Bishop of Port Louis (Mauritius): whether images of the Blessed Virgin under the titles of Lourdes, La Salette, and the Immaculate Conception emitting rays of light from the hands may be exposed for public veneration (Ad I, affirmative, with the cautions of Trent session 25 and Urban VIII's constitution Sacrosancta Synodus of 15 May 1642); whether the apparitions or revelations that gave rise to those cults have been approved by the Apostolic See (Ad II: 'Eiusmodi apparitiones seu revelationes neque approbatas neque reprobatas vel damnatas ab Apostolica Sede fuisse, sed tantum permissas tamquam pie credendas fide solum humana, iuxta traditionem, quam ferunt, idoneis etiam testimoniis ac monumentis confirmatam'); whether a sodality of Our Lady of La Salette may be admitted (Ad III, affirmative); whether a feast under that title with Mass and a rite of the first class with an octave may be celebrated (Ad IV, negative, save by special and express apostolic faculty); and whether special litanies of the apparition of Our Lady of La Salette may be recited (Ad V, negative). Published in Acta Sanctae Sedis 11 (1878), pp. 512-514, in an authenticated copy dated 11 December 1878. The most explicit Roman statement located of the Apostolic See's own position toward these apparitions. Loci are the numbered dubia and answers."
relations = ["work.holy-see.acta-sanctae-sedis", "work.diocese-of-grenoble.mandement-apparition-la-salette-1851", "work.diocese-of-tarbes.mandement-apparition-lourdes-1862"]
