description = "The decree of 10 September 1988 by which the Pontifical Commission Ecclesia Dei, in virtue of the faculty granted it by John Paul II, conceded to the Fraternity of Saint Peter the faculty of celebrating Mass, the rites of the sacraments and other sacred rites and of fulfilling the Divine Office according to the typical editions of the liturgical books in force in 1962, namely the Missal, Ritual, Pontifical and Roman Breviary, in its own churches and oratories and elsewhere only with the consent of the local Ordinary, private Masses excepted. Signed by Augustin cardinal Mayer and Camille Perl. Never printed in Acta Apostolicae Sedis."
