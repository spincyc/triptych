description = "Complete 465-page official PDF acquired via HTTP/1.1 after an HTTP/2 transfer stopped prematurely at 8 MiB. The completed file is 14,731,344 bytes. Title/edition/copyright leaves and printed 564–567 (PDF 55–58) inspected as images. Document 375 is a Latin letter from Slipyj to Tisserant, Lviv, 12 April 1942, A.E.S. 3664/42, copy. The 27 April running header on p. 567 belongs to the next document 376 and is not the date of Slipyj’s reception testimony."
