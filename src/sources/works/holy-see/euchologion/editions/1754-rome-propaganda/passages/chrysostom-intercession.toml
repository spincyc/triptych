context = "After the priest’s Ἐξαιρέτως τῆς παναγίας Marian commemoration on p. 53, the next printed item is the red rubric Ὁ διάκονος μνημονεύει τὰ δίπτυχα τῶν κεκοιμημένων, followed by the priest’s prayer beginning Τοῦ ἁγίου Ἰωάννου τοῦ προφήτου προδρόμου. No choir hymn is printed between these adjacent items at this locus. On p. 54 the priest’s Ἐν πρώτοις μνήσθητι Κύριε τοῦ Ἀρχιεπισκόπου ἡμῶν precedes the deacon’s patriarch/metropolitan/bishop formula; its footnote restricts this to communion with old Rome and refers back to the beginning."
verified_on = "2026-10-17"
notes = "Direct inspection of the retained original-language page images at the named loci. Short Greek quotations use Unicode characters and expand typographic ligatures; lineation and rubric color are described separately. No complete transcription, complete collation or physical-volume completeness is claimed. The short Roman-communion footnote is checked as a condition on the hierarch formula, not a full new papal-name insertion into every prayer. The absence statement applies only to the bounded position between the adjacent named items, not to every page of the volume or to performance practice."
