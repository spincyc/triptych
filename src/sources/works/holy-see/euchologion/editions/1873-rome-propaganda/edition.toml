notes = "Title PP7 prints Rome, the Polyglott Press of the Congregation de Propaganda Fide and 1873; a handwritten 1871 is not the imprint date. The Greek prefatory instructions are PP9–PP10. The title, instructions and Chrysostom intercession at printed pp. 65–67 were visually inspected. Exact native image acquisition is complete for the offered roster; complete transcription, collation and physical-volume completeness are not asserted."
