notes = "Unicode NFC polytonic Greek (grc) read directly from 240–400 DPI PNG renders of the tracked 1873 facsimile PDF.; 19th-century Polyglott Press Greek typography uses modern non-ligatured sorts; exact printed spelling, accents, breathings, iota subscripts, punctuation (including raised dot ·, ellipses ..., and em-dash —), and genuine printed abbreviations (Στίχ.) are preserved.; Authentic printed compositor errors verified at 400 DPI are preserved verbatim rather than silently emended: ἀνέστησυς (for ἀνέστησας, p. 62 / PDF p. 69), ποῦ ἁγίου Ἰωάννου (for τοῦ, p. 66 / PDF p. 73), προκεκοιμένων (for προκεκοιμημένων, p. 66 / PDF p. 73), and unaccented δοξαζειν (p. 67 / PDF p. 74).; Printed unaccented all-caps Institution words (ΛΑΒΕΤΕ..., ΠΙΕΤΕ...) are preserved in uppercase without added diacritics.; Words hyphenated across line breaks are joined; printed page numbers, signature marks (9 on p. 65), and rubric/black ink color distinctions are excluded from the plain-text stream, with headings, rubrics, speaker utterances, and the p. 67 footnote placed on sequential logical physical lines."
