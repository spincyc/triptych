context = "After the priest’s Ἐξαιρέτως τῆς παναγίας Marian commemoration on p. 65, a red Χορός label introduces the printed hymn: Ἄξιόν ἐστιν ὡς ἀληθῶς, μακαρίζειν σε τὴν Θεοτόκον, τὴν ἀειμακάριστον καὶ παναμώμητον, καὶ μητέρα τοῦ Θεοῦ ἡμῶν. It continues on p. 66 with Τὴν τιμιωτέραν τῶν Χερουβίμ before the deacon’s rubric Ὁ Διάκονος μνημονεύει τὰ δίπτυχα τῶν κεκοιμημένων and the priest’s prayer beginning τοῦ ἁγίου Ἰωάννου τοῦ προφήτου προδρόμου. Page 67 preserves the Ἐν πρώτοις μνήσθητι Κύριε bishop commemoration and the footnote requiring communion with old Rome and referring to the beginning."
verified_on = "2026-10-17"
notes = "Direct inspection of the retained original-language page images at the named loci. Short Greek quotations use Unicode characters and expand typographic ligatures; lineation and rubric color are described separately. No complete transcription, complete collation or physical-volume completeness is claimed. Χορός explicitly assigns the printed hymn to the choir. The comparison with 1754 establishes added printed wording and assignment at this locus; it does not show that the hymn was first sung in 1873, that 1754 forbade it, or that 1873 directly copied the acquired 1754 exemplar."
