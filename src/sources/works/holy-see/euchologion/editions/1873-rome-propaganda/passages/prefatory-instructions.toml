context = "The continuous Greek preliminary text begins Ἰστέον and is not printed as a numbered list. It requires commemoration of the bishop of Rome first, then the celebrant’s own bishop and patriarch if Catholic, excluding schismatic or heretical hierarchs. It distinguishes reverence at the Great Entrance from worship of unconsecrated gifts as Christ’s Body and Blood. It treats anointing of the seriously sick, the required oil and balsam for chrism and fresh consecration, and the treatment of contaminated food and drink without imposing the superseded purity law. The first instruction contains the directly checked clause τοῦ τῆς Ῥώμης Ἀρχιερέως πρώτως δεῖ μνημονεύειν."
verified_on = "2026-10-17"
notes = "Direct inspection of the retained original-language page images at the named loci. Short Greek quotations use Unicode characters and expand typographic ligatures; lineation and rubric color are described separately. No complete transcription, complete collation or physical-volume completeness is claimed. These page-local topics are retained without imposing paragraph numbers absent from the printing. The act-counted four monita combine unction and chrism as the two parts of the third; the fourth concerns food impurity. That numbering comes from Ex quo primum §§ 8 and 44, not printed numerals on these leaves."
