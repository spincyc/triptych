context = "The complete note was read: the heading 'Note for the audience with the Holy Father, 13 November 2023'; the occasion (Bishop Cortes's concern at 'the continuous rise in the number of the faithful enrolled in Freemasonry' in Dumaguete, and the observation that membership in the Philippines involves 'not only those who are formally enrolled in Masonic Lodges but, more generally, a large number of sympathizers'); the decision to respond by involving the Catholic Bishops' Conference of the Philippines in a coordinated strategy with two approaches; point (a): 'On the doctrinal level, it should be remembered that active membership in Freemasonry by a member of the faithful is forbidden because of the irreconcilability between Catholic doctrine and Freemasonry (cf. Congregation for the Doctrine of the Faith, \"Declaration on Masonic Associations\" [1983], and the guidelines published by the Catholic Bishops' Conference of the Philippines in 2003). Therefore, those who are formally and knowingly enrolled in Masonic Lodges and have embraced Masonic principles fall under the provisions in the above-mentioned Declaration. These measures also apply to any clerics enrolled in Freemasonry.'; point (b) on accessible catechesis in all parishes; the invitation to consider a public pronouncement; and the subscription 'Ex Audientia die 13.11.2023, Franciscus; Victor Manuel Card. Fernandez, Prefect'."
