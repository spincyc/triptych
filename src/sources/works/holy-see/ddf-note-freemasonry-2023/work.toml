title = "Note for the audience with the Holy Father: the request of Bishop Julito Cortes regarding membership in Freemasonry (13 November 2023)"
responsible = "Dicastery for the Doctrine of the Faith"
work_type = "dicasterial-response"
alternate_titles = ["The Request of His Excellency, the Most Rev. Julito Cortes, Bishop of Dumaguete (Philippines) Regarding the Best Pastoral Approach to Membership in Freemasonry by the Catholic Faithful"]
languages = ["it", "en"]
locus_pattern = 'complete-text'
description = "The DDF note of 13 November 2023 responding to Bishop Julito Cortes of Dumaguete: on the doctrinal level, active membership in Freemasonry by a member of the faithful is forbidden because of the irreconcilability between Catholic doctrine and Freemasonry, citing the 1983 CDF Declaration and the 2003 guidelines of the Catholic Bishops' Conference of the Philippines, with those 'formally and knowingly enrolled in Masonic Lodges' who 'have embraced Masonic principles' falling under the Declaration's provisions, applied also to clerics; on the pastoral level, popular catechesis in all parishes and consideration of a public pronouncement. Signed 'Ex Audientia die 13.11.2023, Franciscus' and by Cardinal Victor Manuel Fernandez, Prefect."
relations = ["work.holy-see.cdf-declaration-masonic-1983"]
