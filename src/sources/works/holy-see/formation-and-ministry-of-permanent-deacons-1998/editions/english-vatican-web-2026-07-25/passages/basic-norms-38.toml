context = "Widowers: those who have received the order of deacon may not enter into marriage, the same principle applying to deacons who have been widowed. Note 44 records that a circular letter of the Congregation for Divine Worship and the Discipline of the Sacraments, Prot. n. 26397 of 6 June 1997, envisages that one only of three stated conditions suffices for dispensation from the impediment of CIC c. 1087."
