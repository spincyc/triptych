context = "The complete declaration was read: the occasion (the 19 July 1974 private letter to some episcopal conferences on the interpretation of canon 2335, since made public and given 'erroneous and tendentious interpretations'); the clarification 'without prejudice to the eventual norms of the new Code'; point 1 ('the present canonical discipline remains in full force and has not been modified in any way'); point 2 ('consequently, neither the excommunication nor the other penalties envisaged have been abrogated'); and point 3 (the 1974 letter was 'merely as a reminder of the general principles of interpretation of penal laws' for individual cases, not a permission for episcopal conferences 'to issue public pronouncements by way of a judgment of a general character on the nature of Masonic associations, which would imply a derogation from the aforesaid norms'). Signed Franjo Cardinal Seper, Prefect, and Fr. Jerome Hamer, O.P., Secretary, 17 February 1981."
verified_on = "2026-07-25"
notes = "Quoted wording extracted verbatim from the exact fetched response; the AAS printing was not consulted."
