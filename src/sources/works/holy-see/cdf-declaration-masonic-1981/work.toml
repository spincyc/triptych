id = "work.holy-see.cdf-declaration-masonic-1981"
title = "Declaration concerning the canonical discipline forbidding Catholics to enrol in Masonic associations (17 February 1981)"
responsible = "Sacred Congregation for the Doctrine of the Faith"
work_type = "dicasterial-declaration"
alternate_titles = ["Declaration Concerning Status of Catholics Becoming Freemasons"]
languages = ["la"]
locus_pattern = 'complete-text'
description = "The CDF declaration of 17 February 1981 (AAS 73 [1981] 240-241), signed by Cardinal Seper, occasioned by the publication and misreading of the Congregation's private letter of 19 July 1974 on the interpretation of canon 2335 of the 1917 Code: it confirms that the canonical discipline remains in full force, that neither the excommunication nor the other penalties were abrogated, and that the 1974 letter did not authorize episcopal conferences to issue general judgments on the nature of Masonic associations derogating from those norms."
relations = ["work.catholic-church.codex-iuris-canonici-1917", "work.holy-see.cdf-declaration-masonic-1983"]
