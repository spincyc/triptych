context = "The complete note was read: the opening recital that from the times of Saint Paul VI to the most recent conversations held at the Dicastery the many attempts to bring the adherents of the movement begun by Archbishop Lefebvre to full communion proved vain, and that the recent consecrations configured the delict of schism, with the citation of Ecclesia Dei n. 3; the four operative statements introduced by 'A tale riguardo, d'ora in poi' concerning sacred ministers (can. 1364 s. 1), lay faithful formally adhering under the conditions of the 1996 note of the Pontifical Council for Legislative Texts 'ancora vigente, che questo Dicastero fa propria', the illicit administration of the sacraments with penance and marriage declared invalid, and the provision for apostolic nuncios to supply procedures to ordinaries; the exhortation to remain in communion citing Lumen gentium 22 and can. 751 and to abstain from the Society's celebrations and activities; the dating and the three signatures."
