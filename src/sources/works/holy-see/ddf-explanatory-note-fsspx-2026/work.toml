description = "The explanatory note of 2 July 2026, protocol N. 99/2009, published with the penal decree of the same date. It records that attempts at reconciliation from the time of Paul VI to the most recent conversations have proved vain, that the recent consecrations constituted the delict of schism, and declares that from now on the sacred ministers of the Society of Saint Pius X are in schism and subject to the excommunication of canon 1364 s. 1; that lay faithful who formally adhere under the conditions of the 1996 note of the Pontifical Council for Legislative Texts, which the Dicastery makes its own, are schismatic and excommunicated; that the Society's sacred ministers administer the sacraments illicitly and that penance administered by them and marriage assisted by them are invalid; that apostolic nuncios will provide procedures for ordinaries receiving those who return; and that the faithful are exhorted to remain in communion and to abstain from the Society's celebrations and activities."
