context = "Chapter I, Normae generales, articles 1-6. Article 2 requires that the Proper of Time be kept entire and take precedence over particular celebrations, forbids any perpetual particular celebration on a Sunday, and keeps the days of Lent, the Octave of Easter and 17-31 December free of particular celebrations except those it names. Article 4 requires theological, historical and pastoral study by a commission, approval by the competent authority, and confirmation by the Congregation, and states that an approved calendar binds all who are held to it and cannot be changed without the assent of the Apostolic See."
