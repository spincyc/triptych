context = "Chapter II, on particular celebrations and the particular calendar, articles 7-27. Articles 8-12 enumerate what is proper to a region or nation, a diocese, a place, a church and a religious family; articles 13-16 define how national, diocesan and religious calendars are assembled from the general calendar; article 23 governs the joining of proper and universal celebrations; and article 24 states that a proper celebration is inscribed as an obligatory or optional memorial unless particular historical or pastoral reasons stand against it."
