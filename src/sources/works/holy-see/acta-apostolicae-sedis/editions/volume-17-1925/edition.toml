notes = "Registered 2026-10-19 for the Claude 1962 F01 (Christ the King) research stage. Fascicle n. 15, dated 28 December 1925, opens at printed p. 593 with Pius XI's encyclical Quas primas of 11 December 1925 and carries the Sacred Congregation of Rites' Urbis et Orbis decree of 12 December 1925 approving the Office with the Mass and the Martyrology elogium for the feast of D. N. Iesu Christi Regis (pp. 655-668; the Mass, headed AD MISSAM, at pp. 666-668, ending with the decree signed by A. Card. Vico, Prefect, and Alexander Verde, Secretary). The one registered artifact is a page-image scan of fascicle n. 15 only; it does not represent the rest of the volume. The Holy See's own volume PDF at https://www.vatican.va/archive/aas/documents/AAS-17-1925-ocr.pdf (3,443,092 bytes, SHA-256 c101831ef1fc721d22a890da35ab53b28eb669d553de951a1adcca6f74ef329e, fetched 2026-10-19) is not registered: its pages carry no scanned image, only an OCR reconstruction set in substitute fonts, and at pp. 666-667 it misreads the page as 'auferatur' and 'corrumpatur' (the page image reads auferetur, corrumpetur), 'disgregata' (disgregatae), 'Fini' (Filii) and 'Paufi Apóstofi' (Pauli Apóstoli), so it cannot supply a reading; the Vatican portal's Legal Notes also restrict its redistribution, as the other vatican.va AAS artifacts in this edition family record."
