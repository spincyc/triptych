notes = "Extent: fascicle n. 15 only, opening with its cover (PDF p. 1: 'Annus XVII - Vol. XVII, 28 Decembris 1925, Num. 15') and its index (PDF p. 2); printed p. 593, the fascicle's first page of Acta, with the opening of Quas primas, is PDF p. 5 (located on the text layer, not read). Artifact PDF page = printed page minus 588 over the stretch read here: PDF p. 78 = printed p. 666 (the AD MISSAM heading, Introit, Oratio and Epistle to inhabitare), PDF p. 79 = printed p. 667 (Epistle end through Secreta), PDF p. 80 = printed p. 668 (Praefatio, Communio, Postcommunio, the Martyrology elogium, and the Urbis et Orbis decree dated 12 December 1925); PDF p. 81 opens printed p. 669, Diarium Romanae Curiae. The mapping was read off the printed folios of those four pages only and is not asserted elsewhere. Wording was read on images rendered from these bytes at 200 and 400 dpi; the OCR text layer was used only to find the pages and is a finding aid, not a reading."
