rights_basis = "The underlying fascicle is Acta Apostolicae Sedis 17, n. 15, dated 28 December 1925 and printed at the Vatican Polyglot Press: a work first published outside the United States before 1931, which is in the United States public domain on the line this repository records and dates at guidance/missals.md section 5 (Cornell's chart, current as of 1 January 2026: first published abroad 'Before 1931 | None | In the public domain'). That line goes stale every January and is not restated here as a standing rule. The bytes are a faithful mechanical microfilm reproduction made by the Internet Archive, in which no new copyright subsists (the Bridgeman reasoning recorded at src/sources/inventories/lasance-new-roman-missal-rights-v1.toml and src/sources/inventories/missale-romanum-1962-facsimile-rights-v1.toml). Nothing rests on the item's availability, on the Internet Archive's metadata, or on any rights representation by the host; the item carries no rights field. The payload is not retained: storage is remote, so this record licenses no redistribution of the scan itself, only the identification of the exact bytes read."
