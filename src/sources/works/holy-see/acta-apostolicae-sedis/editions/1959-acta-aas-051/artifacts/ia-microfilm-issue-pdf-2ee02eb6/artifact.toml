notes = "The complete Internet Archive PDF of item sim_acta-apostolicae-sedis_december-10-17-1959_51_16-17, 105 pages: a 400 ppi bitonal microfilm scan (Serials in Microfilm) of Acta Apostolicae Sedis 51 (1959), numbers 16-17 of 10-17 December 1959 only, not of the whole volume; printed pp. 829-933 of the volume as the item's page_numbers.json reads them (printed p. 918 = leaf 89 = PDF p. 90). It is the page facsimile against which this edition's checked transcriptions were read. CONTRAST, MEASURED ON 2026-11-18: the registered vatican.va PDF of the volume (artifact.acta-papal-archives.aas.051.vatican-pdf-bd1d2910, re-fetched whole and matching its registered SHA-256) carries no raster image on its text pages (pdfimages lists none) and draws every page in embedded CenturySchoolbook TrueType fonts; its visible pages are ABBYY's re-typesetting of its own optical recognition and reproduce recognition errors as print (e.g. AAS 52 p. 598 shows 'd) I-IV Quadragesimae' for b), '11.' for n. 14, and 'nn. 101-105' where the printing reads 'nn. 104-105'). Reading that PDF is reading the OCR, not the 1960 page."
