rights_basis = "Admitted under src/sources/inventories/holy-see-twenty-year-term-rights-v1.toml, [how_to_admit].carrier_artifact. This record identifies a mechanical microfilm facsimile of the printed issue; the bytes are not retained. First publication of these words: Acta Apostolicae Sedis 51 (1959), numbers 16-17 of 10-17 December 1959, the Holy See's official gazette printed in Vatican City (first_publication_imprint Acta Apostolicae Sedis; first_publication_body Sacred Congregation of the Council; first_publication_year 1959): the decree Facultas anticipandi obligationem abstinentiae et ieiunii pervigilii Nativitatis D. N. Iesu Christi of 3 December 1959. us_formality published-abroad-without-us-notice: the AAS printings examined by that record carry no copyright notice, and none is visible on the printed pages read here; the record's L3 residual risk applies (Twin Books Corp. v. Walt Disney Co., 83 F.3d 1162 (9th Cir. 1996), may treat a foreign-language work published abroad without notice as unpublished in the United States). Published on a qualified basis (publication policy priority 6; confidence medium-low): a Holy See text first published in Vatican City in 1931-1975 that lapsed into the U.S. public domain for want of a formality, and whose twenty-year Vatican term under Italian Law 633/1941 arts. 11 and 29, as applied by Vatican Law XII of 1960, had on this project's reading expired before the 1 January 1996 U.S. restoration date (17 U.S.C. 104A). Not adjudicated; U.S. copyright only; implies no ecclesiastical approval or permission."
