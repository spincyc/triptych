context = "Sacred Congregation of the Council, decree Facultas anticipandi obligationem abstinentiae et ieiunii pervigilii Nativitatis D. N. Iesu Christi, 3 December 1959, the whole act: John XXIII grants all the faithful the faculty (gratiam ... anticipandi) to anticipate the obligation of abstinence and fast of the Vigil of the Nativity from 24 to 23 December. Printed p. 918; microfilm PDF p. 90."
