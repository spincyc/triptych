text = "SACRA CONGREGATIO CONCILII DECRETUM FACULTAS ANTICIPANDI OBLIGATIONEM ABSTINENTIAE ET IEIUNII PERVIGILII NATIVITATIS D. N. IESU CHRISTI. Plurimorum Episcoporum ex multis Nationibus votis obsecundans, Ssm̃us Dominus Noster Ioannes Pp. XXIII, praesenti Sacrae Congregationis Concilii Decreto, gratiam deinceps anticipandi obligationem abstinentiae et ieiunii a die vigesima quarta, pervigilio Nativitatis Domini Nostri Iesu Christi, ad diem vigesimam tertiam mensis Decembris omnibus orbis catholici fidelibus concedere dignatus est. Datum Roma, die 3 Decembris 1959. P. Card. Ciriaci, Praefectus L. ✠ S. P. Palazzini, a Secretis"
