notes = "Catalog-level record created 2026-07-25. The complete 1931 official-gazette volume, containing among other acts Pius XI's apostolic letter Providentissimus Deus of 17 September 1931 declaring Robert Bellarmine a Doctor of the Universal Church (pp. 433-438); that act is distinct from Leo XIII's 1893 encyclical of the same incipit. No exact artifact is registered; consumers using the vatican.va OCR scan record their access route and date locally."
