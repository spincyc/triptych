rights_basis = "The Vatican portal Legal Notes, as this library recorded them on 2026-07-25 at https://www.vatican.va/content/vatican/en/legal-notes.html and as the sibling artifact for volume 52 states, limit portal content to personal and non-profit viewing and prohibit collection, reproduction, dissemination or transfer without prior written authorization from the Dicastery for Communication. No repository redistribution permission was established, so the exact bytes are identified and not retained. This is a statement about this exact PDF and about the Holy See's terms for its own portal, not about the age of the acts printed inside it. What a reader with no network can open instead is nothing, for this volume, and that is the limitation rather than a size or convenience judgment: the acts read from it are reachable only at the recorded URL or in another witness this library does not yet hold."
