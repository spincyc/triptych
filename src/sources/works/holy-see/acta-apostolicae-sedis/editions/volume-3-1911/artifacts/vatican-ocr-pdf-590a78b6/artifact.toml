notes = "Extent as the retrieving lane measured it: Complete Acta Apostolicae Sedis vol. 3 (1911), 736 pages, with an OCR text layer; read as text at pp. 633-651, which carry Divino afflatu and the Rubricae annexed to it. Whole volume. This volume was already cited in this repository by digest, in src/sources/inventories/pre-1955-rubrics-sources-v1.toml, without ever being registered as an artifact. The inventory's recorded digest and byte size agree exactly with this receipt, so the identity this record mints is the same object that inventory has been citing. The scan carries an optical text layer; readings taken from it are a discovery aid unless collated against a rendered page image, and this run read it as text."
