context = "Paul VI, apostolic constitution Missale Romanum of 3 April 1969, AAS 61 pp. 217-222: citing SC 51, it sets the whole body of Sunday readings in a three-year order and puts an Old Testament (in Eastertide, Acts) reading before the Epistle and Gospel on feasts, completed by weekday readings (p. 220); besides the Eucharistic Prayer, Order of Mass and Order of Readings, the Proper of Time and other parts were revised, and a distinct prayer was added for each weekday of the principal seasons, Advent, Christmas, Lent and Easter (p. 221); what the constitution prescribes takes effect from 30 November 1969, the First Sunday of Advent (p. 222)."
