context = "Paul VI, apostolic constitution Laudis canticum (1 November 1970), n. 2: since the Liturgy of the Hours sanctifies the day, the order of prayer was revised so that the Hours fit the natural hours of the day in present-day conditions. Therefore Prime was abolished; Lauds and Vespers, as the hinges of the whole Office, were given the greatest weight, having the character of true morning and evening prayer; the Office of Readings (Officium lectionis) keeps its night character for those who celebrate vigils but is suited to any hour of the day; and the Middle Hour is arranged so that those who choose only one of Terce, Sext and None fit it to the time they pray it, omitting nothing of the psalter distributed over the weeks. It does not itself use the word Matutinum; the identification of the Office of Readings with the former Matins rests on Sacrosanctum Concilium art. 89 c and GILH n. 57."
