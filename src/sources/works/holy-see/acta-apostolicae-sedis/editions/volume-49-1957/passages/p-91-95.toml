context = "The Sacred Congregation of Rites' Ordinationes et declarationes circa Ordinem hebdomadae sanctae instauratum incorporate the declaration of 15 March 1956, preserve the force of the decree and instruction of 16 November 1955 except where innovated here, and give twenty-two numbered provisions for Palm Sunday and the Sacred Triduum. The act is dated 1 February 1957 and subscribed by Cardinal Cicognani and Archbishop Carinci."
