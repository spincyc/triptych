notes = "Extent as the retrieving lane measured it: Complete Acta Apostolicae Sedis vol. 47 (1955), 912 pages, with an OCR text layer; the decree Cum nostra hac aetate read end to end at pp. 218-224. Whole volume. This volume was already cited in this repository by digest, in src/sources/inventories/pre-1955-rubrics-sources-v1.toml, without ever being registered as an artifact; that inventory also records that the Internet Archive item AAS-47-1955 is byte-identical. The inventory's digest and byte size agree exactly with this receipt. The scan carries an optical text layer; readings taken from it are a discovery aid unless collated against a rendered page image, and this run read it as text."
