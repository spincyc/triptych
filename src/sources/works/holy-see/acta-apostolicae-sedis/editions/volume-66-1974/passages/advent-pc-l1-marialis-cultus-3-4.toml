context = "Paul VI, Marialis cultus (2 February 1974) nn. 3-4, AAS 66 pp. 117-118: besides the 8 December solemnity (which celebrates together the Immaculate Conception, the radical preparation for the Saviour's coming and the Church's beginning without spot or wrinkle, citing the 1970 Missal's preface), the Advent liturgy often recalls Mary, especially on the weekdays 17-24 December and singularly on the Sunday before Christmas, whose readings echo the prophecies of the Virgin Mother and the Messiah (citing the 1969 Ordo lectionum). The faithful, considering the ineffable love with which the Virgin Mother awaited her Son (citing Advent Preface II), are led to take her as a model, 'in prayer watchful and in praise exultant' (the same preface); the Advent liturgy, joining messianic expectation and expectation of Christ's glorious return with the memory of the Mother, offers a balance that can serve as a norm against separating Marian devotion from Christ, and makes Advent, as liturgists have said, a time particularly suited to devotion to the Mother of the Lord, an orientation the Pope confirms."
