context = "Rubricae generales Missalis Romani (pars tertia), L) De conclusione Missae, n. 507, the whole number: Mass ends with Ite, missa est; Benedicamus Domino only on Holy Thursday evening and before a procession; Requiescant in pace in Masses for the dead. No exception is made for Advent or for Masses without the Gloria. Printed pp. 680-681; microfilm PDF pp. 94-95."
physical_line_ranges = [[1, 5]]
text = "507. In fine Missae dicitur Ite, missa est, cui respondetur Deo gratias. Attamen: a) in Missa vespertina in Cena Domini quam sequitur solemnis repositio Ssm̃i Sacramenti, et in aliis Missis quas sequitur aliqua processio, dicitur Benedicamus Domino, cui respondetur Deo gratias; b) infra octavam Paschatis, in Missis de Tempore, ad Ite, missa est et ad sequens Deo gratias duplex additur Alleluia; c) in Missis defunctorum dicitur Requiescant in pace, cui respondetur Amen."
