notes = "Reviewed in workflows/reviews/modern-nonseasonal-orations-20261112/paulinus-independent-review-v1.json SHA256 e2ed315493e1b717eec7009fddd5e58ece37bea79075e8e104773c5d749015ee. Official1960carrier includes whole prayer with exempla; Baroffio2022 prints exemplis. Explicit correction remains disclosed; no original1765cue inferred. Re-collated on 2026-11-18 (verification lane V1): the controlling artifact is an OCR re-typesetting, not a page facsimile (see its notes), so printed p. 716 was read again on the microfilm page facsimile artifact.holy-see.acta-apostolicae-sedis.volume-52-1960.ia-microfilm-issue-pdf-51e41032, PDF p. 130, at 300 dpi. Variationes n. 47, S. Gregorii Barbadici, Oratio, reads there in full: 'Deus, qui beatum Gregorium Confessorem tuum atque Pontificem pastorali sollicitudine, et pauperum miseratione clarescere voluisti: concede propitius; ut, cuius merita celebramus, caritatis imitemur exempla. Per Dominum.' (the print accents the vowels). The exempla reading and the Per Dominum cue agree; the state stays verified on that re-collation."
