context = "Rubricae generales (Rubricae Breviarii et Missalis Romani, pars prima), caput IV De feriis, nn. 24-25, both numbers whole and printed contiguously: Advent ferias of 17-23 December and the Advent Ember days are of the second class; the other Advent ferias up to 16 December are of the third class and yield to third-class feasts; impeded, both are commemorated. Printed p. 600; microfilm PDF p. 12."
physical_line_ranges = [[1, 8]]
text = "24. Feriae II classis sunt: a) feriae Adventus a die 17 ad diem 23 decembris; b) feriae Quatuor Temporum Adventus, Quadragesimae et mensis septembris. Hae feriae praeferuntur festis particularibus II classis; si vero impediuntur, commemorari debent. 25. Feriae III classis sunt: a) feriae Quadragesimae et Passionis, a feria V post cineres usque ad sabbatum ante dominicam II Passionis inclusive, superius non nominatae, quae praeferuntur festis III classis; b) feriae Adventus usque ad diem 16 decembris inclusive, superius non nominatae, quae cedunt festis III classis. Hae feriae, si impediuntur, commemorari debent."
