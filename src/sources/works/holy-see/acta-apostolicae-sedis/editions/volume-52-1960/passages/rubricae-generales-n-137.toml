context = "Rubricae generales (Rubricae Breviarii et Missalis Romani, pars prima), caput XIX De usu et qualitate paramentorum, n. 137, the whole number and the last of pars prima: deacon and subdeacon wear dalmatic and tunicle when ministering, and folded chasubles and the broad stole are no longer used. Printed p. 621; microfilm PDF p. 33."
physical_line_ranges = [[1, 6]]
text = "137. Dalmatica et tunicella utuntur diaconus, respective subdiaconus, quando sacerdoti ministrant: a) in Missa; b) in benedictionibus ad altare; c) in processionibus. Attamen cum sacerdos celebrans stat sine pluviali, etiam ministri stant sine dalmatica et tunicella. Planetae plicatae et stola latior amplius non adhibentur."
