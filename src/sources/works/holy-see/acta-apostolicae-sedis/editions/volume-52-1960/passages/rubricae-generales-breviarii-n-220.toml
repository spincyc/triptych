context = "Rubricae generales Breviarii Romani (pars secunda), the chapter on the lessons, III De lectionibus Officii unius Nocturni, n. 220, the whole number: on Sundays the first two lessons are of the occurring Scripture and the third is of the homily on the day's Gospel. Printed pp. 634-635; microfilm PDF pp. 46-47."
physical_line_ranges = [[1, 4]]
text = "220. In Officio dominicali, ordo trium lectionum hic est: a) Lectio prima et secunda dicuntur de Scriptura occurrenti, ut in Proprio. Prima autem lectio Sacrae Scripturae ea est, quae in Breviario nunc ut prima notatur; altera vero efficitur ex secunda et tertia in unam coniunctis, omisso responsorio intermedio. b) Lectio tertia dicitur de homilia in Evangelium diei; et sumitur ea quae nunc in Breviario ponitur tamquam prima tertii Nocturni."
