context = "Rubricae generales Breviarii Romani (pars secunda), III De lectionibus Officii unius Nocturni, n. 221, opening and letter a): in the Officium ordinarium the first and second lessons are of Scripture, ordinarily of the occurring Scripture unless proper or specially assigned lessons are had; the first is the one the Breviary marks first and the second joins the second and third, the intermediate responsory omitted. n. 169 (printed p. 627, microfilm PDF p. 39) assigns the Officium ordinarium to III-class feasts and to the Saturday Office of St Mary and sends their first and second lessons to n. 221 a. Printed p. 635; microfilm PDF p. 47."
physical_line_ranges = [[1, 3]]
text = "221. In Officio ordinario, ordo trium lectionum hic est: a) Lectio prima et secunda dicuntur de Scriptura; et quidem ordinarie de Scriptura occurrenti, nisi propriae vel specialiter assignatae habeantur. Prima autem lectio Sacrae Scripturae ea est, quae in Breviario ut prima notatur; altera vero efficitur ex secunda et tertia in unam coniunctis, omisso responsorio intermedio."
