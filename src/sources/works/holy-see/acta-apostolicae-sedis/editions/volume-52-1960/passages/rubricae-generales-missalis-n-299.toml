notes = "Read on the microfilm page image of printed p. 648 (PDF p. 60) at 150 dpi, whole page and a crop of the number; the foot of p. 647 (PDF p. 59) was read for the chapter heading, Caput IV De Missa in dominicis et feriis, under which n. 298 begins. The number is one printed paragraph wholly on p. 648, between the close of n. 298 and n. 300; line-end hyphenation 'Quadrage-simae' joined. A stray film speck between 'e' and 'qua' is not a character. Nothing omitted. The vatican.va OCR layer agrees in wording. n. 299 itself says nothing of feasts: whether the feria is kept at all is governed by the rubrics on occurrence."
