context = "Rubricae generales Missalis Romani, caput IV De Missa in dominicis et feriis, n. 299, the whole number: the ferias of Lent and Passiontide and the Ember days of Advent and September have their own Mass; on the other ferias the Mass is that of the preceding Sunday, whose orations also serve when the feria is commemorated, unless the rubrics provide otherwise. So on Advent weekdays other than the Ember days, when the feria is kept, the Mass is the preceding Sunday's. Printed p. 648; microfilm PDF p. 60."
physical_line_ranges = [[1, 1]]
text = "299. Item propriam Missam habent omnes feriae temporis Quadragesimae et Passionis necnon Quatuor Temporum Adventus et septembris. In reliquis feriis dicitur Missa dominicae praecedentis, e qua pariter sumuntur orationes, quoties feria est commemoranda, nisi a rubricis aliter provisum sit."
