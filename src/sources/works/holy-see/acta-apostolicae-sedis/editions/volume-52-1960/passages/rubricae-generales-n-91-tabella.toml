context = "Rubricae generales (Rubricae Breviarii et Missalis Romani, pars prima), caput XI De praecedentia dierum liturgicorum, n. 91 and its Tabella dierum liturgicorum secundum ordinem praecedentiae disposita, selected lines: the Immaculate Conception at line 4, the Vigil of the Nativity at line 5 and the Sundays of Advent at line 6 among first-class days; the Advent ferias of 17-23 December and the Advent Ember days at line 18 of the second class; the other Advent ferias at line 25 of the third class. Printed pp. 610-612; microfilm PDF pp. 22-24."
physical_line_ranges = [[1, 10]]
text = "91. Praecedentia dierum liturgicorum, sublatis quibuslibet aliis titulis vel normis, unice regitur ex sequenti TABELLA DIERUM LITURGICORUM SECUNDUM ORDINEM PRAECEDENTIAE DISPOSITA Dies liturgici I classis 4. Festa Immaculatae Conceptionis et Assumptionis B. Mariae Virg. 5. Vigilia et dies octavus Nativitatis Domini. 6. Dominicae Adventus, Quadragesimae et Passionis, et dominica in albis. Dies liturgici II classis 18. Feriae II classis, nempe: Adventus a die 17 ad diem 23 decembris inclusive, et feriae Quatuor Temporum Adventus, Quadragesimae et mensis septembris. Dies liturgici III classis 25. Feriae Adventus usque ad diem 16 decembris inclusive, exceptis feriis Quatuor Temporum."
