context = "Rubricae generales (Rubricae Breviarii et Missalis Romani, pars prima), caput XVI De commemorationibus, n. 109, the whole number: the commemoration of a Sunday and of the ferias of Advent are privileged commemorations. Printed p. 615; microfilm PDF p. 27."
physical_line_ranges = [[1, 8]]
text = "109. Commemorationes privilegiatae sunt commemorationes: a) de dominica; b) de die liturgico I classis; c) de diebus infra octavam Nativitatis Domini; d) de feriis Quatuor Temporum mensis septembris; e) de feriis Adventus, Quadragesimae et Passionis; f) de Litaniis maioribus, in Missa. Omnes aliae commemorationes sunt commemorationes ordinariae."
