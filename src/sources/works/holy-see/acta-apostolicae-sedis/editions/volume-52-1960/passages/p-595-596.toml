context = "Printed p. 595 carries the close of the motu proprio Rubricarum instructum with its dating clause, 'Datum Romae, apud S. Petrum, die 25 mensis Iulii, anno 1960, Pontificatus Nostri secundo', over the subscription IOANNES PP. XXIII. Printed p. 596 carries the Sacred Congregation of Rites' general decree promulgating the new code, which describes the motu proprio as given 'die 25 iulii huius anni', orders the code inserted in new editions of the Breviary and Missal and observed from 1 January 1961, and is dated 'Ex aedibus S. Rituum Congregationis, die 26 iulii anni 1960'."
verified_on = "2026-07-26"
notes = "Read in the rendered text of the volume's optical layer at the identified pages; the artifact is restricted and no bytes are retained. These two dates are the control against which the 1962 Missal's own promulgating decree, which gives 23 July 1960, was found discrepant."
