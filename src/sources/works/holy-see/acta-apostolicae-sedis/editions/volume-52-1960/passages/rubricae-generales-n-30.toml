context = "Rubricae generales (Rubricae Breviarii et Missalis Romani, pars prima), caput V De vigiliis, n. 30, the whole number: the Vigil of the Nativity is of the first class and, occurring with the Fourth Sunday of Advent, takes its place with no commemoration of the Sunday. Printed p. 601; microfilm PDF p. 13."
