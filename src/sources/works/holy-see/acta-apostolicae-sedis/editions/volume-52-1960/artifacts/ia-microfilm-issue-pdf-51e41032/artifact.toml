notes = "The complete Internet Archive PDF of item sim_acta-apostolicae-sedis_1960-08-15_52_10, 159 pages: a 400 ppi bitonal microfilm scan (Serials in Microfilm) of Acta Apostolicae Sedis 52 (1960), number 10 of 15 August 1960 only, not of the whole volume; printed pp. 589-745 of the volume (PDF p. 9 = printed p. 597; the item's page_numbers.json maps printed pages to leaves, PDF page = leaf + 1). It is the page facsimile against which this edition's checked transcriptions were read. CONTRAST, MEASURED ON 2026-11-18: the registered vatican.va PDF of the volume (artifact.holy-see.acta-apostolicae-sedis.volume-52-1960.vatican-ocr-pdf-c734079d, re-fetched whole and matching its registered SHA-256) carries no raster image on its text pages (pdfimages lists none) and draws every page in embedded CenturySchoolbook TrueType fonts; its visible pages are ABBYY's re-typesetting of its own optical recognition and reproduce recognition errors as print (e.g. AAS 52 p. 598 shows 'd) I-IV Quadragesimae' for b), '11.' for n. 14, and 'nn. 101-105' where the printing reads 'nn. 104-105'). Reading that PDF is reading the OCR, not the 1960 page."
