notes = "The scan carries an optical text layer whose readings are a discovery aid only; the cited pages were read in rendered page images at 400 dpi. Printed p. 599 was read that way: the fourth resumption case of n. 18 is printed there as 'et XVII, quae inscribitur VI', an arithmetically impossible ordinal that the 1962 Missale Romanum prints as 'XXVII'. The volume's own Corrigenda notice records only a correction to p. 179 and does not reach p. 599. Exact bytes are identified but not retained. Corrected on 2026-11-18 (verification lane V1): this file is not a page facsimile. It is ABBYY FineReader 9.0's re-typesetting of its own optical recognition: pdfimages lists no raster page image on printed pp. 589-745 (the only image there is a 12-byte ornament on p. 596, and the whole file holds 71 small images), pdffonts lists embedded TrueType fonts (CenturySchoolbook among them), and a 300 dpi rendering of p. 598 shows recognition errors drawn as print ('11.' for n. 14, 'nn. 101-105' for the printed 'nn. 104-105', 'd)' and 'o)' for b)). The statement above that the cited pages were read in rendered page images at 400 dpi therefore describes a rendering of the OCR, not an image of the 1960 page, and is no evidence of the printed wording. The page facsimile of number 10 (printed pp. 593-740) is artifact.holy-see.acta-apostolicae-sedis.volume-52-1960.ia-microfilm-issue-pdf-51e41032. Wording verified on this file was re-collated against that microfilm on 2026-11-18, as stated in each dependent record. The p. 599 reading of n. 18 d, 'et XVII, quae inscribitur VI', is confirmed as print on microfilm PDF p. 11. No registered facsimile covers pages outside pp. 593-740, including pp. 985-986."
