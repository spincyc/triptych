notes = "The scan carries an optical text layer whose readings are a discovery aid only; the cited pages were read in rendered page images at 400 dpi. Printed p. 599 was read that way: the fourth resumption case of n. 18 is printed there as 'et XVII, quae inscribitur VI', an arithmetically impossible ordinal that the 1962 Missale Romanum prints as 'XXVII'. The volume's own Corrigenda notice records only a correction to p. 179 and does not reach p. 599. Exact bytes are identified but not retained."
