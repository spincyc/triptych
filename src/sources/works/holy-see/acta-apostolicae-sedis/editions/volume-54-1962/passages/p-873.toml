context = "Printed p. 873, Acta Congregationum, Sacra Congregatio Rituum, decree III, headed 'De S. Ioseph nomine Canoni Missae inserendo' and beginning 'Novis hisce temporibus Summi Pontifices non unam nacti sunt occasionem ut ritibus sollemnioribus cultum S. Ioseph ... augerent.' It records that John XXIII announced the decision through his Secretary of State to the Council fathers gathered in the Vatican basilica on 13 November 1962 and ordered it put into practice from 8 December 1962, and it decrees 'ut infra Actionem post verba: Communicantes ... Domini nostri Iesu Christi, haec addantur: sed et beati Ioseph eiusdem Virginis Sponsi, et deinde prosequatur: et beatorum Apostolorum ac Martyrum tuorum ...', extending the prescription to the days on which a proper Communicantes is prescribed. Dated 13 November 1962 and signed by Cardinal Larraona with Henricus Dante as secretary."
verified_on = "2026-07-26"
notes = "Read in the rendered text of the volume's optical layer at the identified page; the artifact is restricted and no bytes are retained. The exact wording of the inserted clause was independently collated against the 1962 typical edition of the Missal, which prints it."
