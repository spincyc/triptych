notes = "The complete Internet Archive PDF of item sim_acta-apostolicae-sedis_september-19-22-1958_50_12-13, 121 pages: a 400 ppi bitonal microfilm scan (Serials in Microfilm) of Acta Apostolicae Sedis 50 (1958), numbers 12-13 of 19-22 September 1958 only, not of the whole volume; printed pp. 549-669 of the volume as the item's page_numbers.json reads them (printed p. 630 = PDF p. 82; printed p. 654 = PDF p. 106). It is the page facsimile against which this edition's checked transcriptions were read. CONTRAST, MEASURED ON 2026-11-18: the registered vatican.va PDF of the volume (artifact.acta-papal-archives.aas.050.vatican-pdf-8f8a72d7, re-fetched whole and matching its registered SHA-256) carries no raster image on its text pages (pdfimages lists none) and draws every page in embedded CenturySchoolbook TrueType fonts; its visible pages are ABBYY's re-typesetting of its own optical recognition and reproduce recognition errors as print (e.g. AAS 52 p. 598 shows 'd) I-IV Quadragesimae' for b), '11.' for n. 14, and 'nn. 101-105' where the printing reads 'nn. 104-105'). Reading that PDF is reading the OCR, not the 1960 page."
