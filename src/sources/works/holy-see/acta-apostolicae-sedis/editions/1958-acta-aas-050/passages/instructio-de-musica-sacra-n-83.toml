context = "Sacred Congregation of Rites, Instructio de musica sacra et sacra liturgia ad mentem Litterarum encyclicarum Pii Papae XII 'Musicae sacrae disciplina' et 'Mediator Dei', heading on printed p. 630; section F), n. 83, the whole number: the exceptions to n. 81, among them the organ or harmonium alone on the Third Sunday of Advent and the Fourth of Lent, and organ or harmonium alone in Mass and Vespers only to sustain the singing; local Ordinaries may determine further. Printed p. 654; microfilm PDF p. 106."
physical_line_ranges = [[4, 8]]
text = "83. Pro diebus tamen temporibusque ut supra prohibitis, sequentes statuuntur exceptiones: a) Organi et aliorum instrumentorum sonus permittitur diebus festis de praecepto et feriatis (exceptis dominicis) necnon festis patroni principalis loci, tituli vel anniversarii dedicationis ecclesiae propriae et tituli aut fundatoris familiae religiosae; vel si solemnitas aliqua extraordinaria occurrat; b) Organi tantum aut harmonii sonus permittitur in dominicis tertia Adventus et quarta Quadragesimae; necnon feria quinta infra Hebdomadam sanctam in Missa chrismatis, et ab initio Missae solemnis vespertinae in « Cena Domini » usque ad finem hymni Gloria in excelsis Deo; c) Item organi tantum aut harmonii sonus permittitur in Missa et in Vesperis, solummodo ad cantum sustentandum. Ordinarii locorum has prohibitiones vel permissiones, secundum probatas locorum aut regionum consuetudines, pressius determinare possunt."
