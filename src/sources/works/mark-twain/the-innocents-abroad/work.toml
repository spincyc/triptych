description = "Mark Twain's narrative of the 1867 Quaker City excursion to Europe and the Holy Land. Chapter LI reaches the gate of Nain and sets down Luke 7:12-16 entire - the appointed Gospel of the Fifteenth Sunday after Pentecost - and then, in the next paragraph, has the pilgrims breaking souvenirs off the mosque wall while standing on the praying carpets. A locus is a chapter."
