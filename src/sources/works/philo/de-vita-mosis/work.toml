description = "Philo of Alexandria's two-book life of Moses. Book 2, sections 25-44 in the modern numbering, contains Philo's account of the translation of the Law into Greek at Alexandria, including the island of Pharos, the translators' verbal agreement described in prophetic terms, and an annual commemorative festival. Loci use book and section numbers."
