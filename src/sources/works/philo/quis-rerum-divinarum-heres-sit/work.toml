description = "Philo's allegorical treatise on Genesis 15, running from the opening address 'Fear not, Abram' to the covenant between the pieces. It is the longest sustained ancient treatment of that chapter and it reads every element of the scene as an event of the soul: the bringing-out as the mind's exit from the body and the senses, the setting sun as the setting of the human intellect, the trance as prophetic possession. Loci are given here by the chapter numbers of Yonge's translation; the modern section numbering differs and consumers must state which they use."
