context = "The opening of chapter I of the Proslogium in Deane's translation (Exhortation of the mind to the contemplation of God), printed page 3 (PDF page 45). The Office of Readings of Friday of the first week of Advent appoints Proslogion 1; the AELF Office of 4 December 2026 begins its reading at this point."
physical_line_ranges = [[1, 6]]
text = "Up now, slight man! flee, for a little while, thy occupations; hide thyself, for a time, from thy disturbing thoughts. Cast aside, now, thy burdensome cares, and put away thy toilsome business. Yield room for some little time to God; and rest for a little time in him. Enter the inner chamber of thy mind; shut out all thoughts save that of God, and such as can aid thee in seeking him; close thy door and seek him. Speak now, my whole heart! speak now to God, saying, I seek thy face; thy face, Lord, will I seek (Psalms xxvii. 8). And come thou now, O Lord my God, teach my heart where and how it may seek thee, where and how it may find thee."
