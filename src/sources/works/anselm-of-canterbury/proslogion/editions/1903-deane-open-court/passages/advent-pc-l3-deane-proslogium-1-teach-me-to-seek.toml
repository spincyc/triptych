text = "Be it mine to look up to thy light, even from afar, even from the depths. Teach me to seek thee, and reveal thyself to me, when I seek thee, for I cannot seek thee, except thou teach me, nor find thee, except thou reveal thyself. Let me seek thee in longing, let me long for thee in seeking; let me find thee in love, and love thee in finding."
