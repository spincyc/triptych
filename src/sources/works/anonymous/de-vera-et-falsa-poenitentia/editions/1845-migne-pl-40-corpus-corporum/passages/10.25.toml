context = "Number 25 begins with penitence, sorrow, and personal confession through a priest. It reads Christ's command to the ten lepers in Luke 17:14 as requiring bodily present, personal disclosure rather than confession by messenger or writing; then it joins priestly binding and loosing to Lazarus and Matthew 18. When a priest is unavailable, the treatise distinguishes confession to a neighbor from priestly absolution, grounds hope in desire for the priest, and reads the lepers' cleansing while they were still going as evidence that God regards the heart when necessity prevents arrival."
verified_on = "2026-08-21"
notes = "Verified word for word against the page images of Migne's printing at PL 40:1122-1123. Attribution is limited to the anonymous treatise transmitted under Augustine's name: this passage must not be cited as Augustine's own teaching. It witnesses a medieval sacramental exegesis of Luke 17 and does not by itself establish Luke's historical sense, the treatise's exact composition date or place, the validity of lay absolution, or the complete current discipline of sacramental confession."
