description = "ELMSS 1570 assigns the older palimpsest writing to folios 13, 14, 18, 19, 20, 21, 22, 23, 24, 25, 96 of Karlsruhe Cod. Aug. perg. 253. ELMSS 1570 / CLA VIII 1103 is a distinct Gallican sacramentary fragment set, not the Mone Masses. Its exact Mass components and textual relation to the other undertexts remain uncollated."
