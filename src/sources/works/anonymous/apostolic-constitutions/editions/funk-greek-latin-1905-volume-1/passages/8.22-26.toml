context = "Printed pp. 528–529 were inspected directly as page images. VIII.22 provides an ordination prayer for the reader. VIII.23–26 distinguish confessors, virgins, widows, and exorcists as categories not ordained qua category. VIII.26 relates the exorcist to a healing charism and permits ordination, if needed, as bishop, presbyter, or deacon. Funk's apparatus and note preserve textual and comparative qualifications. This controls the compiler's bounded prescription, not apostolic authorship, actual practice, formula, frequency, office continuity, direct descent, universal discipline, or a bishop-permission rule within VIII.26."
notes = "Funk 1905 is an historical critical edition. Metzger, Sources Chrétiennes 336, is the superseding modern critical edition but was not acquired. No claim of exhaustive apparatus review or manuscript adjudication is made."
