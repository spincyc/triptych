context = "Printed p. 14 (PDF p. 85) was inspected for XV.7's invitation of candidates by named grades, including exorcist; printed p. 17 (PDF p. 88) was inspected for XV.17–19 between the lector conclusion and XV.20 acolyte opening. The exorcist unit is separately titled, associates the office with a book containing exorcisms, distinguishes baptized persons from catechumens, and contains a preface and blessing. This verifies the critical edition's bounded ordinal architecture only. It does not establish one uncomplicated tenth-century local book, any manuscript reading, actual performance, ordinary duties, frequency, efficacy, continuity into later pontificals, identity with modern major exorcism, current ministry or law, or operational use."
