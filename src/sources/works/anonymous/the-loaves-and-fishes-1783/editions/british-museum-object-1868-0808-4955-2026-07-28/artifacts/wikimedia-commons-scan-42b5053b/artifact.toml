notes = "Visually inspected in full on 2026-07-28. The title is printed beneath the scene. Ministers seize or bargain over numerous loaves and fishes spread across a political table; a loaf is labeled Secretary of State, speakers invoke shares and friends, and dogs carry off Pay Office money bags. The changed register is political patronage and appetite, not depiction of Christ's miracle. The print depends on the established Gospel 'loaves and fishes' image, but it does not identify one Synoptic narration; for PC-S42-A it should be described as an afterlife of the feeding tradition appointed in Matthew 14:13-21, not as proof of exclusive dependence on Matthew."
