notes = "The museum identifies the object as an etching published by E. Achery on 24 March 1783. Its catalogue description records ministers grasping the pictured loaves and fishes as offices and rewards; its curator's note locates the satire in the ministerial interregnum between Shelburne's resignation and the Portland coalition."
