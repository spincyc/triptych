title = "The Loaves and Fishes"
responsible = "Anonymous printmaker; published by E. Achery"
work_type = "satirical-print"
languages = ["en"]
description = "An English political etching published on 24 March 1783. George III presides while past and prospective ministers seize loaves and fishes labeled or understood as government offices and rewards. The Gospel feeding image is converted from provision for a multitude into a satire on political patronage, private appetite, and competition for office."
