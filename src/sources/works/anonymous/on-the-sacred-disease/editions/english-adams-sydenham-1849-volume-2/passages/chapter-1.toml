context = "Printed pp. 843–845 (PDF pages 387–389) were visually inspected. In Adams's translation the treatise rejects a uniquely divine cause for the disease, attributes the designation to ignorance and wonder, and criticizes purifications and incantations as claims used by practitioners unable to assist. This is an ancient medical polemic in one dated translation, not a Christian source, a neutral report of common practice, a modern clinical account, or evidence that medicine simply displaced exorcism."
