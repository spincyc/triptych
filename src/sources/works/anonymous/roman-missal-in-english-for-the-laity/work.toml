description = "The anonymous nineteenth-century English hand-missal translation of the Roman Missal made for lay use, printed with the Latin of the Ordinary and Canon in facing columns and with the Proper of Time, Proper of Saints and Commons in English with the Latin incipit of each oration. It is a separate work from work.catholic-church.missale-romanum and not an edition of it: the Missal is the Latin altar book promulgated by the Holy See, and this is an English expression of it by an unnamed translator, with its own transmission, its own printings and its own rights position, exactly as work.english-college-of-douay.douay-rheims-bible is kept apart from work.catholic-church.vulgata-clementina. It is not an approved liturgical translation and was never an altar book; the approbation its printings carry is an ordinary's judgement on the book, not a grant of liturgical authority to its English. Its calendar and rubrics are those in force before the reforms of 1955 and 1960, so its Holy Week, its seasonal second and third orations and its sanctoral are not those of the 1962 Missal; where a 1962 formulary is the same prayer, this book witnesses one nineteenth-century English rendering of it and nothing more."
