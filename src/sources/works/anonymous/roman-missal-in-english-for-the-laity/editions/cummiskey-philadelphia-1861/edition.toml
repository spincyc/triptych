notes = "The witness this project already quotes for English renderings of 1962 formularies; see web/claude/liturgy/roman-rite/1962/ordinary/00-ordinary-of-the-mass.md and .../reference/assembling-the-mass.md, which read it as page images in the Internet Archive scan romanmissaltran00churgoog. It prints the Ordinary and Canon in facing Latin and English columns at printed pp. xv-xlvi, and the Proper of Time, Proper of Saints and Commons in English, each oration opening on the Latin incipit the Missal prints. It is a pre-1955 book: its Holy Week is the unreformed one, it prints the seasonal second and third orations that the 1960 code abolished, its sanctoral lacks every feast instituted after 1861, and the Sundays of the Time after Pentecost are numbered as this file's calendar numbers them. Where a 1962 formulary is textually the same prayer, this edition witnesses one nineteenth-century English rendering of it; where the Latin differs, the English cannot be transferred and must not be."
