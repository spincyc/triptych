notes = "Optical character recognition of a small-format nineteenth-century hand missal set in two columns for the Ordinary and in a single measure elsewhere. It is a finding aid and a transcription lead, not a transcription: running heads and printed page numbers are interleaved with the text, the Latin incipits are the worst-damaged part of the file because they are set in italic (Excita, quaes. is read Exrcita, ques.), and ordinary English words are corrupted often enough that no wording read from it alone is established. Page images were not rendered or inspected in this acquisition, so nothing derived from this artifact has been collated against the printing; the printed page and leaf of each oration were not recorded and remain to be established from the item's page-number map."
