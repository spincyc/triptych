rights_basis = "The book was published at Philadelphia in 1861 and is in the United States public domain by publication date: every United States work published before 1930 has entered the public domain, and no renewal question arises for an 1861 imprint. The translator is unnamed and the printing carries no surviving proprietor. The Internet Archive text layer is a mechanical optical-character-recognition derivative of a scan of that public-domain printing and carries no separate creative claim; the Internet Archive item records its copyright status as NOT_IN_COPYRIGHT. The scan was contributed by Google from a Harvard University copy, and Google asserts no copyright in it while asking that its watermark and attribution be preserved; the retained bytes carry Google's own front-matter statement unaltered."
