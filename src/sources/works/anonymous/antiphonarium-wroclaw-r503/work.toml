description = "The particular medieval antiphonary now held by Wrocław University Library as R 503. Its holding catalog dates the manuscript 1375–1400; the image manifest says circa 1375. This work identity names that historical compilation, not every antiphonary or a Roman Missal. The source contains a complete Lava me antiphon at folio 49r."
