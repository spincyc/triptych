date = "1375–1400"
notes = "The holding catalog identifies this manuscript by shelfmark R 503; its IIIF manifest labels the date c.1375 and supplies 267 canvases, predominantly complete openings. A possible origin at St Elizabeth in Wrocław is not established by this record. Folio 49r is the right leaf of canvas 53, not artifact page 49. The acquired folio directly establishes Lauds, first antiphon. Cantus discovery record 561607 assigns the occasion Quinquagesima; that occasion has not been independently established from an acquired surrounding rubric. Its present Missal use is a separate appointment."
