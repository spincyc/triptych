provenance = "Whole native opening image, 17422 by 13232 pixels, fetched directly from the holding institution IIIF endpoint. Complete opening shows folios 48v–49r; right leaf is marked 49 at top and xlix at bottom. Fresh direct reading of the opening and a detailed server crop confirms the complete Lava me antiphon, first at Lauds on folio 49r. Search leads included the full prayer phrase, Cantus a01676 and PL-WRu R503; the Cantus record at https://cantusdatabase.org/chant/561607/ led to the holding catalog but supplies no transcription payload here."
notes = "Bounded manuscript acquisition: one complete native opening from the 267-canvas manuscript, with complete manifest separately held. The holding catalog offers IIP external image delivery and no whole-book downloadLink. No image payload is proposed for Git or publication. The entire antiphon words end before Euouae; those cadence vowels belong to chant notation and are not additional prayer words."
