context = "Preface p. vii (PDF page 9) and printed pp. 828–835 (PDF pages 844–851) were visually inspected. Swete's larger upper text supplies the Vatican form and his smaller lower text prints the materially different Sinaitic form in full. Both present angelic direction, prayer, marriage, healing, and expulsion within one providential narrative. This verifies the two Greek forms as printed in this edition, not a normal formulary, clinical diagnosis, efficacy, ordinary practice, Christian rite, modern critical adjudication, or operational instruction."
