notes = "Swete prints the Vatican text as the larger upper text and the materially different Sinaitic Tobit in full beneath it in smaller type, with verses aligned as nearly as possible. His description of the Sinaitic form as having a secondary character is an editorial judgment of this dated edition, not adopted by Triptych. This controls the two printed Greek forms and their boundaries, not a modern critical apparatus, manuscript images, or adjudication among recensions."
