notes = "The Jagiellonian Digital Library identifies the Latin manuscript as a pontifical and dates it to the eleventh or twelfth century. Manuscripta records parchment, 152 folios plus six preliminary folios, decoration, musical notation, and dimensions of 23 by 16 cm. These catalog facts and the manuscript images establish book identity and visible placement, not production place, local performance, frequency, normativity, textual descent, or relationship to the edited Pontificale Romano-Germanicum."
