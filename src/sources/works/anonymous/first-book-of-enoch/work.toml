description = "The ancient Jewish apocalypse attributed to Enoch, known complete in Ethiopic, from which R. H. Charles translated it. It tells of the Watchers who sinned with the daughters of men and, in chapter 20, names the holy angels who watch. A locus is chapter and verse in Charles's division."
