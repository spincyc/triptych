notes = "The exact Stanford/Parker IIIF manifest identifies a pontifical and dates its two principal stages circa 1400 and circa 1410. Its catalog description calls the book a specifically English pontifical and says London is the probable place of production on stylistic grounds. The proposed patronage by Guy de Mohun and subsequent ownership or additions associated with Richard Clifford and Philip Morgan are catalog inferences from heraldry and codicology, not independently established facts. The same description places the manuscript at St Paul's Cathedral by 1489 from added texts on fols. 1v–2."
