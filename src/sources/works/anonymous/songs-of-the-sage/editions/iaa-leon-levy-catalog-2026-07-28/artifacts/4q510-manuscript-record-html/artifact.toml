notes = "Inspected remotely. The record identifies 4Q510 as copy a of Songs of the Maskil, a Hebrew square-script parchment manuscript from Qumran Cave 4 assigned to the Herodian period, and cites Baillet, DJD 7 (1982), pp. 215–219. Plate 280's cataloged fragment images enumerate fragments 2–13, so this record does not image-control the publication's cited textual fragment 1."
