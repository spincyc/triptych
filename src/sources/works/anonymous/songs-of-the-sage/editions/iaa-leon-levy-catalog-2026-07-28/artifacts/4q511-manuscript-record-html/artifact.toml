notes = "Inspected remotely. The record identifies 4Q511 as copy b of Songs of the Maskil, a Hebrew square-script parchment manuscript from Qumran Cave 4 assigned to the Herodian period, lists twelve scientific-number/plate groups, and cites Baillet, DJD 7 (1982), pp. 219–262. Image-search fragment labels recur plate by plate and are not treated as a concordance to DJD textual fragment 10."
