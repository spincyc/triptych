notes = "Manuscript identity, Gellone provenance, approximate date, and folio mapping were checked against the exact BnF Gallica manifest and catalog on 2026-07-27. The manifest maps canvases f398-f408 to fols. 194v-199v. The BnF catalog says its section and item numbering follows Dumas's 1981 edition and identifies no. 2406 at fol. 197r, no. 2412 at fol. 198r, and section 355 at fol. 199v. Those are catalog-derived coordinates only: the Dumas–Deshusses critical edition (CCSL 159–159A, 1981) remains inaccessible and was not inspected or collated, and no unsupported intervening numbering is inferred."
