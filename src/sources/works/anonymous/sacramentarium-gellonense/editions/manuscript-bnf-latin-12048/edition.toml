notes = "Manuscript identity, Gellone provenance, approximate date, and the folio location were checked against the BnF Gallica record and USUARIUM record 3247 on 2026-07-27. USUARIUM maps its digital page 398 to fol. 194v and identifies the item beginning there as Impositio manuum in energumenum. The Dumas–Deshusses critical edition (CCSL 159–159A, 1981) is a bibliographic cross-reference only and was not inspected or collated."
