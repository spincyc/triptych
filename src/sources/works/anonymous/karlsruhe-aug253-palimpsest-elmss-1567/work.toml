description = "ELMSS 1567 assigns the older palimpsest writing to folios 10, 17 of Karlsruhe Cod. Aug. perg. 253. ELMSS names a Gelasian sacramentary fragment; Suski classifies it as Gallican. No recension or textual identity with the Old Gelasian Sacramentary is asserted."
