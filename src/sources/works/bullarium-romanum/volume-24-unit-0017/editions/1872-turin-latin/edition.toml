notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent numbered CLXI has its own synopsis, Clement XII protocol and preamble, followed by the fully printed substantive declaration at 12305–12353 authorizing Capuchin superiors to establish and direct the Franciscan Third Order and communicating its privileges. Sections 2–4 abbreviate only the conventional validity, non-obstants/derogation and exemplars/transumpts clauses, respectively at 12356, 12380 and 12385. Their historical continuation references at 12374, 12424 and 12426 are preserved without expansion; the latter two have numbered markers at 12380 and 12385 and sit after the next CLXII heading. The current act's preposition note 12318 and cingulo/uti corrections 12370 and 12372 are also retained. Foreign notes 12312–12316 belong to CLX and are excluded from this extent. Original/editorial dating 12387–12390 and cardinal signature 12391 provide a complete ending before CLXII starts 12394. No substantive current-act body is replaced by a cross-reference, and the literal formula abbreviations are disclosed rather than expanded."
