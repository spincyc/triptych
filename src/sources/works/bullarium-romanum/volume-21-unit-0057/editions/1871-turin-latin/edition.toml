notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent LXV act issued under the literal Clement XI protocol at 31460-31461. Complete proem, occasion-specific indulgence grant, perpetuity provision, and transumpt clause are printed. Historical title note 31500-31503 belongs to the marker at 31458 and is retained in full; Clement X and Benedict XIII in that note are cited antecedents, not this act's issuer. Full dating 31519-31521 and repeated date 31523 are retained without reconstructing a normalized date; date is null despite the printed dating evidence. Preserve the literal isolated marginal fragment Kxririlitlm. at31526 at the original frozen ending; its wording is not interpreted or corrected. The full act dating ends31523, and the marginal fragment is retained as source paratext. No substantive body omission or literal formula abbreviation is present. Prior accepted u0056 ends at 31444; next independent LXVI begins 31529. Its title note 31566-31572 and lexical notes 31632, 31711, 31772, 31774-31775, and 31777 all have local referents in that next act and are not imported here. Admission is of the complete bounded printed witness, with no prior accepted overlap and no source expansion."
