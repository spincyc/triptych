description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent act XV begins with heading 15598, synopsis 15600–15601, protocol 15603–15604 and opening 15606. Embedded 1689 chapter decrees at 15640–15769 remain within the 1690 papal confirmation and are not separate papal issuances. Retains the corrections at 15723 and 15830, original dating 15869–15871, editorial dating 15873, and detached transumpt marginal tail 15879–15880 before next XVI at 15883. Excludes only 15610: that correction belongs to the marked possessive at 15580 in preceding XIV and is preserved in u0013. Its placement below XV opening does not change its textual referent. Substantive-extent re-audit: The prior chapter decrees are printed at 15640–15769 and the present papal confirmation is printed at 15804–15811; no substantive section is editorially substituted."
