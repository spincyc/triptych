notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent LXVI act issued under the literal Clement XI protocol at 31538-31539. The Mission Congregation decrees introduced 31587-31595, numbered I-VI, remain incorporated matter: all their substantive provisions at 31597-31757 are retained. Outer papal confirmation resumes 31759 and is printed at 31782-31809, followed by the distinct extension of the earlier excommunication at 31810-31827 and all final clauses. Clement X in that recital and in the historical title note is an earlier issuer, not the current outer pope. Retain all six historical notes in full: title apparatus 31566-31572, correction 31632, explanation 31711, additions/variants 31772, 31774-31775, and 31777, each with its own title or local textual marker. Any differing chronological statements within the historical apparatus and body remain literal and unharmonized. Full outer dating 31879-31882 and repeated date 31884 are printed despite empty date_raw; date remains null. Trim frozen end 31890 to 31884 to exclude trailing running-year/pope-name furniture. No current substantive body is omitted or replaced by a cross-reference; no formula abbreviation is expanded. Next independent LXVII starts 31893 and its historical title note 31945-31951 belongs to its own Clement VIII constitution reference. Admission is of the complete bounded printed witness, with no overlap against prior accepted acts, fragments, or constituents."
