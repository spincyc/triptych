description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent act IX has synopsis 34589–34592 and protocol 34594–34595, following the prior act dating 34581–34584. Retains historical note 34608–34610, complete sections 1–3, original dating 34759–34761 and editorial dating 34763, plus detached derogation marginal tail 34766–34767 before X at 34770. The indulgence note at 34782–34783 belongs to X and is outside this act. Substantive-extent re-audit: The present communication of the named congregation spiritual privileges is itself printed at 34686–34715 with its qualification and remaining clauses; incorporation of those privileges by reference is the grant operative language, not an editorial replacement of it."
