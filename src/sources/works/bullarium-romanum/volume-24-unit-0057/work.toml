description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent numbered CCIV, with its own synopsis, Clement XII protocol, incipit, continuous preamble and sections 1–58, canonization of Ioannes Franciscus Regis, penal conclusion, original/editorial dating 35424–35429, papal and cardinal subscriptions 35431–35553, and concluding seal/curial registration 35562–35574. Historical notes are contextually matched to their markers and retained at 33936, 33993–33994, 33996, 34063, 34128, 34350, 34352, 34768–34769, 34894–34895, and 35437–35438; the seal note expressly refers to the preceding printed model rather than supplying a new independent act. Prior act registration ends 33851; next CCV begins 35577. Recited predecessor Clement XI and his decrees do not replace the current issuing protocol. No adjacent independent act body enters the selected range. The source date and OCR defects remain uncorrected. Source-extent re-audit: the source body is printed through its own final sanction, dating and complete subscriptions; no substantive body is substituted by an editorial cross-reference. The historical note at 35437–35438 refers only to the conventional seal model on printed page 245 a (literal raw words: '1  Ileic  sequitiir  lorniri  sigilli  ut  siipra  pa- \\ngina 245  a  (n.  t.). '). That model reference is retained as printed and is not expanded. No etc.-style body formula abbreviation was located in this act."
