notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent DLXII 79799, synopsis 79802–79806 and Urbanus self-protocol 79808–79809 follow preceding dating 79792–79796. The rites decree is expressly introduced as quoted tenor 79824–79827, runs from 79829 through its dating 79853–79854, and returns to the papal confirmation at §2 79856. Ordered §§2–5 reach the act's own dating 79966–79970; next DLXIII begins 79973. No detached historical note is omitted and the incorporated curial decree is not treated as another independent papal act. Date remains null despite printed dating."
