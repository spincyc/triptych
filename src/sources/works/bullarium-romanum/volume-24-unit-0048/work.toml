description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent CXCIV Clement XII confirmation. Clement XI at 30081 is a predecessor in the recital, not the issuer. The Congregation decree explicitly introduced 30122-30124 is printed at 30126-30143, including its operative decision, dating, signatures, and seal; papal confirmation resumes 30145. Retain historical notes 30093 (exposito/expositio at 30080) and 30211 (the clause at 30197). Full outer dating 30220-30222 and repeated date 30224 are retained. Earlier-letter incipit abbreviation eie. at 30085 is literal citation shorthand, not a replacement of this act's body. The inserted secretary's episcopal designation is literally elliptical at 30143 (piscopus...), and is neither supplied nor authenticated. The operative decree and current papal confirmation are printed. Next act begins 30227; subsequent notes 30267, 30269, and 30387 belong to that next act. No prior accepted overlap. Missing date_raw is not a hold reason; date remains null. Admission is of the complete bounded printed witness with those source abbreviations disclosed."
