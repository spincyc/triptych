description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent numbered CCVI, with its own synopsis, literal Clemens Episcopns protocol, incipit, and continuous sections 1–30 concerning canonization of Iuliana Falconeria. The surrounding source running heading 37180 reads CLEMENS XII, and papal subscription is 38431–38433; predecessor popes are recited historical actors, not the current issuer. The complete original/editorial dating 38424–38429, papal/cardinal subscriptions 38431–38562, and concluding seal/curial registration 38587–38598 are retained. Historical notes at 37393, 37487, 37594, 37596, 37755, 37757, 38442 and 38444 are contextually matched to wording/markers in this act, including the final seal-model reference. Previous curial subscriptions end 37170; next CCVII begins 38601. No adjacent act body is included; source inconsistencies, references, and OCR defects are preserved without correction or authentication. Source-extent re-audit: no substantive body is replaced by an editorial cross-reference; the act prints its own final sanction, dating and subscriptions. Historical note 38444 (literal raw line: '2  Eadem  forma  sigilli  ut  sup.  p.  245  (a.i.). ') cross-references only the conventional seal form, which is retained without expansion. The apparent abbreviation candidate at 38187 reads 'slifidelium  devolio  erga  sanclos  et  eie. ' and continues 'clos  Dei,  qui  prò  nobis  in  tanlis  ne- ' at 38188; this is connected sentence text with a damaged word broken across two raw lines, not an instruction to omit or borrow substantive act text. Both raw lines are retained unchanged; no restoration is supplied."
