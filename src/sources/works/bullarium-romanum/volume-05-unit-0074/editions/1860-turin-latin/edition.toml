notes = "Fragment witness; the source omits part of the act. The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. XII at 48764, its synopsis and actual Alexander protocol at 48781–48782 identify one independent act before XIII at 48901. The source explicitly truncates substantive clause 1 at 48841–48843: the commission narrative ends after identifying the archbishop/governor with tori etc. at 48843. The missing remainder is not supplied; the surviving proem and clauses 2–4, closing and dating through 48898 form a source-bounded fragment. References to earlier Sixtus IV and papal provisions in clause 2 are integral references, not serial acts. The historical election-day note at 48792 belongs to XI's marker at 48749 and was already admitted with prior unit-0073; it is excluded both as foreign apparatus and to prevent overlap. Conventional closing abbreviations remain literal. Frozen date_raw remains empty."
