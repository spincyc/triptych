notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Single outer Clement XII confirmation with protocol 72906-72907, full incorporated visitation decrees expressly introduced 73018-73025, and papal resumption/confirmation 73642-73650. Internal De ecclesia through De statu temporali headings are decree sections, not independent act boundaries. Preserves decree dating and signatures 73629-73633 and the audience record/signature 73635-73640, then the complete outer dating clause 73670-73673 and printed date 73675. Historical note 72957 is included. The raw introduction mentions anno mdccxxxix at 73009 and the incorporated decree date reads mdccxxxvi at 73629; neither is silently corrected. Trims only trailing running year/name furniture at 73678 and 73681 from the frozen end 73681. Next independent heading begins 73684. No unresolved apparatus membership. Source-extent re-audit: the incorporated decree closes with the literal conventional formula abbreviation at 73627, \"Et  ita,  salvo,  etc.\"; this is retained as printed and not expanded. The decree substantive provisions precede it and its date/signatures follow at 73629-73633; the complete outer confirmation resumes at 73642. No substantive body is replaced by a cross-reference."
