description = "Fragment witness; the source omits part of the act. The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent CXXI has literal papal protocol91653–91659 and clean surviving exhortation91661–91770, followed by a partial opening of its jubilee provision91772–91789. The substantive indulgence grant and operative conditions after the procession condition are absent:91789–91792 replaces them with an editorial cross-reference to Alexander VIII. Preserve only this surviving fragment, own historical title note91675–91678, corrections91734 and91782–91784, and original/editorial dating91794–91799. No expansion supplied; fragment is not counted as a complete jubilee act. PreviousCXX dating91641–91645 and nextCXXII91802 establish independent bounds."
