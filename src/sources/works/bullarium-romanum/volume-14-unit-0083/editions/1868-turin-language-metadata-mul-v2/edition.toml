notes = "Latin and Italian. The Latin papal confirmation inserts a substantial Italian petition followed by the congregation’s Latin response and subscriptions. The act then resumes substantial Latin confirmation, legal-effect, enforcement and derogation provisions. The Italian petition forms part of the incorporated decree record and is more than an incidental phrase or bibliographic quotation. Existing discontiguous ranges and every source word remain unchanged. This record corrects the language metadata of the same identified historical printing. The source text and original edition record remain preserved."
