notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. XCVII heading and synopsis 104931–104938, addressees 104940–104942 and explicit protocol 104944 establish the outer papal confirmation; include its preceding marginal Exordium at 104928, after XCVI’s date 104925. §1 introduces Cardinal Ludovisi’s patent at 105003–105008, containing the expressly quoted Italian papal chirograph 105022–105167. Its signature/date at 105165–105167 and the cardinal patent’s dating/subscriptions 105253–105262 are embedded instruments. The outer papal voice resumes at §2, 105264, and ends after §3 with its own dating clause 105301/105313–105314 and printed date 105315. The conflicting day numerals in those final source lines are preserved without inference, and date remains null. Retain source note 104974 and historical notes 105188–105197. XCVIII starts 105318 with protocol 105328. The whole nested text and column order are coherent."
