notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. One complete outer Clement XII confirmation, not an incipit-only survivor. The frozen end 70881 was caused by an isolated I at 70883: the introduction ending sacris reli- at 70878 continues quiis praepositornm decretum tenoris at 70884 and qui sequitur, videlicet at 70886. This is running-line continuation, not a new numbered act or protocol. Extend this act through 71071 to include the full incorporated petition/decree at 70888-70947, its decree date/signatures/seal at 70933-70947, the outer petition/confirmation at 70949-70997, declaration at 70999-71019, all closing clauses through 71066, and outer dating 71068-71070 plus printed date 71071. Historical notes 70990 and 71045 correspond to marked ipsis at 70969 and erigendarum at 71007 and are retained. The literal conventional petition-ending formula at 70931, clemenlià. Quam Deus, eie., is retained without correction or expansion; it does not replace substantive provisions. Source section-number typography is retained without inventing missing divisions. Earlier independent act ends 70854; next starts 71074. Candidate u0107 is continuation-only and receives a separate non-act disposition dependent on this extended u0106. No overlap with prior accepted extents; no unresolved body omission or apparatus membership. Empty discovery date_raw is not treated as evidence that a dating clause is absent; structured date remains null."
