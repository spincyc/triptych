notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent act VII has synopsis 12129–12132, protocol 12134–12135 and incipit 12137, following accepted VI dating at 12124 and before VIII at 12551. All six sections of the present confirmation are printed, including its operative confirmation at 12420–12434, execution mandate and concluding clauses. The master-general letter at 12210–12389, with its own 1687 dating and signatures 12384–12389, is expressly embedded antecedent text and remains within the complete outer papal act. Preserves historical notes/corrections 12165–12169, 12276, 12322–12327 and 12376, including the edition warning of a possible textual lacuna inside the embedded letter. Original outer dating 12543–12547 and editorial dating 12548 remain literal. No overlap with any prior accepted range."
