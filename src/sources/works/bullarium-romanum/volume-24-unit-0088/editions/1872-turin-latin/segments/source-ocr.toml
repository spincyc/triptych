context = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent outer act of Clement XII. The Cassinese decrees at 61651 onward, their internal headings and additions, the seven abbots' subscriptions at 62280-62294, and the chapter approval dated 4 May with signatures at 62317-62336 are incorporated matter: the outer papal petition and confirmation resume at 62338 and 62351, with final dating and repeated date at 62415-62420. The next act starts at 62426. Trimmed the frozen ending from 62423 to 62420, excluding only blank lines and the isolated running-year fragment 1738. All 21 historical notes retained: 61623-61624; 61680; 61741, 61743, 61745, 61747; 61865, 61867, 61869; 62000, 62002; 62123, 62125, 62127; 62179, 62181, 62183, 62185, 62187; 62244; 62307. Their explicit markers and subjects refer to this act, its incorporated decrees, and the synopsis. No shared-line or displaced-note blocker found in the reviewed OCR. No source corrections or normalized date supplied. A supplementary raw-line note search through 62683 found no post-boundary historical note requiring addition; the next act has no footnotes. Source-extent re-audit: the incorporated decrees quote portions of earlier monastic rules and close those quotations with literal etc. at 61692 and 61739; those predecessor-rule quotations are explicitly abbreviated and are not claimed as complete transcriptions of the earlier rules. Literal etc. at 61888 continues an open-ended enumeration of offices and administrations. The complete new decrees, their additions, subscriptions, and current papal confirmation remain printed; no independent current act's substantive body is replaced by a cross-reference. Admission is of this complete bounded printed witness, retaining every abbreviation literally without expansion."
