notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. CCCXXXII heading 81837/synopsis 81840–81856 follow prior cardinal oath signatures 81817–81834; actual self-protocol 81858–81859. Congregational decree by cardinals for bishops and regulars is expressly introduced decrelum tenoris qui sequitur 81909–81911, quoted 81913–81950 with signatures/closing quote 81951–81952. Papal narrative resumes §2 81953–81957 and confirms the praeinsertum decree 81973–81992, proving incorporation. Ordered §§1–4 reach own complete dating 82022–82025 before CCCXXXIII 82028. Own historical notes 81863, 81926 and 81976 attach locally; no body reversal found."
