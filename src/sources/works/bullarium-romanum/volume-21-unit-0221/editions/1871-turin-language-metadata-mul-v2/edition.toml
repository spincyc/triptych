notes = "Latin papal act containing the substantial Italian edict of the Turin senate as an integral quotation. The Latin protocol and narrative introduce the edict; its Italian notification, enforcement provisions, dating and imprint are reproduced before the Latin papal voice resumes to reject it. The insertion records the instrument being condemned, rather than an editorial translation or papal endorsement. The source synopsis, historical notes and marginal summaries are Latin. The complete existing source selection is retained unchanged. This record corrects the language metadata of the same identified historical printing. The source text and original edition record remain preserved."
