notes = "Fragment witness; the source omits part of the act. The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Substantive fragment of independent Innocent XIII briefVIII. The named notary appointment survives through108153 recipimus, etc; retain title note108137–40 and original/editorial dates108155–59. What is absent: the substantive continuation of the appointment privileges and all following provisions, replaced by the cross-reference in own note108185–87 to the whole Clement X constitution. That note is recovered after nextIX108162 and retained disjointly, excluding IX text. No missing wording supplied; not a complete act and no authenticity claim."
