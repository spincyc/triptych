description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. CXI heading/synopsis 109653–109658 and explicit protocol 109660–109661 introduce the outer Gregory confirmation. All six numbered paragraphs were read: §1 cites earlier papal letters, and omission note 109702–109704 explains their abbreviated presence; §2 introduces the French royal patent 109725 onward, ending with its date and subscriptions 109804–109810/109830–109831; §3 introduces the French agreement 109841 onward, ending with date/signatures 110082–110092. These instruments are expressly embedded, not independent top-level papal acts. Gregory’s confirmation resumes §4 at 110095 and continues §§5–6 to the own dating clause 110157–110159 and printed date 110161. Retain source note 109700 and historical notes 109702–109704, 109760–109761 and 109877–109878. CXII begins 110164 with a new protocol 110172. Quoted OCR wording remains uncorrected; paragraph and column sequence are coherent, with no merged body-column line."
