notes = "Multilingual Latin and Italian papal confirmation. The Latin papal act deliberately inserts a Latin Bologna senate decree and extensive Italian constitutions of the scientific Institute. Those Italian constitutions themselves incorporate a Latin senate decree and Latin academy laws, then resume in Italian before a Latin attestation. The papal confirmation, privileges, closing clauses and dating return to Latin. Latin historical/reading notes and marginal summaries remain separate editorial apparatus; neither the act nor its integral instruments are split or translated. This record corrects the language metadata of the same identified historical printing. The source text and original edition record remain preserved."
