description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent numbered CCXVII has its own synopsis, Clement XII protocol, and continuous sections 1–4 confirming resolutions for exposed infants of S. Spiritus in Saxia. The inserted resolutions I–IV are the subject of the same papal confirmation, not separately issued acts. Historical correction notes 41893–41894, 41952 and 42005 have contextual markers in this act and are all retained. The final non-obstants continue across the running heading at 42008 into 42010–42013; complete original dating is 42015–42018 and editorial dating 42020. The original extent through 42025 is preserved, including its displaced tail rubric OhOanlium after the running year, instead of assuming that marginal source text is dispensable. Previous CCXVI ends 41861; next CCXVIII begins 42028. No neighboring independent act body is included, and source wording/dating remain uncorrected. Source-extent re-audit: no substantive body is replaced by editorial cross-reference and no etc.-style formula abbreviation was located. The issuing act itself refers to its earlier appointment instrument at 41914–41919, then prints the present resolutions I–IV at 41949–41973 and its operative approval and confirmation at 41974–41989. This natural documentary reference is not a printed-editor substitution for the current act's body; it is retained without expansion."
