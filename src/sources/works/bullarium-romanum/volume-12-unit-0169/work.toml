description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. LX heading, synopsis 93599–93600 and explicit papal protocol 93602–93606 precede the preamble and §§1–8, whose order and column continuations are coherent. The dating clause 93945–93948, printed date 93950 and signatures/registration 93952–93956 close the act. Retain the internal historical notes 93701 and 93753. Also retain 93964–93965 as a separate range: it explicitly comments on tenoribus praesentium and attaches to the marker after praesentibus at 93929 in this act, although it occurs after the next LXI heading 93959 and the first lines of that next synopsis. Exclude all of LXI’s heading, body and protocol from this unit."
