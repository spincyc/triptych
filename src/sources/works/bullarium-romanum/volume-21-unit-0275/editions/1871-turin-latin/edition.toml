notes = "Fragment witness; the source omits part of the act. The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Substantive fragment of independent Innocent XIII briefXLIII concerning the Rio doctorate grant. The operative grant116697–710 survives; retain own title note116681–84, original/editorial dates116715–20, and all own omission notes116686–90/116745, excluding priorXLII note116679. What is absent: substantive exposition in§1 after116658 and§2 after116666, explicitly replaced by the earlier exposition/cross-references116686–89;§3 favor formula116672 and conventional closing clauses116712–13 are additionally abbreviated. No omitted wording expanded; surviving grant is a fragment, not a complete act and no authenticity claim."
