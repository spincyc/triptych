notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent outer confirmation with Clement XII protocol at 70097-70098. The Milanese vicar-general protocol at 70204-70207, Italian petition and Capitolazioni at 70222 onward, agreement subscriptions at 70608-70623, Congregation mandate/signatures at 70624-70652, subdelegation and vicar's confirmation at 70654-70689, and chapter extract with subscription and seal at 70734-70767 are expressly incorporated matter, not separate top-level papal acts. The papal account resumes at section 5 (70691), petition at section 6 (70772), and papal confirmation at section 7 (70778). Complete outer ending at dating 70851-70853 and repeated date 70854; previous act ends 70086 and next starts 70857. All four historical notes are retained at 70118, 70120, 70242, and 70709 and correspond to local marked wording. No act-boundary or note-membership blocker found in the reviewed OCR. OCR repetitions and damaged source wording are retained without correction. Extended context through 71050 establishes that the later notes 70990 and 71045 concern the marked wording at 70969 and 71007 in the next act, not this act. Source-extent re-audit: literal abbreviations are retained in incorporated instruments: ecc. at 70251 ends the petition's request formula; ecc. at 70607 shortens the attestation E per fede; etc at 70670 abbreviates omnique alio meliori modo; and both etc. occurrences at 70681 abbreviate decernentes and In quorum. These conventional petition, validity, and attestation formulas are not expanded. The twelve substantive agreement clauses, approvals, signatures, and present papal confirmation are printed; no current substantive body is replaced by a cross-reference. Admission is of the complete independently bounded printed witness with these expressly disclosed formula abbreviations."
