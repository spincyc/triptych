context = "On printed page 357, right-column bottom, the pope's subscription is followed by the italic announcement of cardinal subscriptions, immediately followed by the short date and the bottom margin. No cardinal names are printed in that interval. The facing continuation page 358 begins independent CXXIII with its synopsis and papal protocol; it contains no carried-over subscription list. The complete visible junction establishes omission in this Naples 1883 printing, rather than OCR loss."
notes = "Image review is limited to the subscription junction and neighboring page context. It does not collate the entire act, establish authenticity, or recover the absent list. No names were transcribed or supplied. Retained page derivatives: artifact.bullarium-romanum.volume-08.1883-naples-latin.subscription-junction-page-371-8e16def20a90; artifact.bullarium-romanum.volume-08.1883-naples-latin.subscription-junction-page-372-88e247bc79d8."
