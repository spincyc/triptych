description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Clement XII is the outer issuer named at raw LF 47993–47994; Benedict XIII’s earlier briefs and Alexander VII’s cited brief are predecessor testimony. The supplication introduced at 48065 and its sixteen CAPm'LA from 48112 through the G. De Benoit subscription at 48400–48401 remain incorporated in the outer confirmation, whose voice resumes at §2 (48403) and §3 (48426). Historical editorial notes at 48072, 48074–48075, 48077, 48133, 48135, 48137, 48139, 48218 and 48280 address local marked wording and remain included. The outer dating is at 48551–48554. Two further historical notes are displaced below the next act’s opening: note 1 at 48591–48592 supplies wording for the marker after seu at 48543; note 2 at 48594 comments on the date word aprilis marked at 48552. These exact note lines are added as a second range, preserving their blank separator, while the intervening CCXXXIII heading/protocol/body at 48557–48589 and footer at 48595 are excluded. The proposed date-word correction is not adopted and date remains null. Context was read continuously through 48730 to resolve membership. No unresolved boundary or note membership was found; no OCR correction or image collation is asserted. Source-extent re-audit of the whole bounded witness and targeted raw searches found no literal formula abbreviation and no replacement of this independent act’s substantive body by an editorial summary or cross-reference. Earlier acts mentioned, quoted, or incorporated by the outer act retain that source-given status; they are not separately admitted as independent complete witnesses. No abbreviation or referenced wording has been expanded."
