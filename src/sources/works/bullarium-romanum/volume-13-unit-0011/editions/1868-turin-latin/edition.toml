notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent XV 16721 and synopsis 16723–16724 lead to addressee 16726–16728, papal self-protocol 16730 and salutation 16732–16733. Visitation mandate sections 1–4 run coherently to full/short dating 16878–16882 before XVI 16885. Own source note 16747 and correction note 16854 are retained. Dating ends with note marker 1 at 16880; its historical note 16914–16918, displaced after the following act heading, explicitly records same-form letters to another visitor and is included as a disjoint range. Neighbor XVI note 2 at 16920–16924 is excluded."
