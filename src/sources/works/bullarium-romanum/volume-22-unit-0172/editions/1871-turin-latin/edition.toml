notes = "Fragment witness; the source omits part of the act. The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent CCXII synopsis and self-issuing Benedict XIII protocol; substantive jubilee grants in sections1–3 are printed80987–81194. Section4 starts an episcopal mandate81196–81205 but breaks after the episcopal recipients and eorumque vicariis etc at81205. Its displaced historical note81237–81238 explicitly says Reliqua usque ad finem, ut tom.xx,p.10b etseq. The missing remainder of that mandate has not been established to be wholly conventional closing formula and is not supplied. This is an attributed fragment, with printed terminal date81207–81211 retained; no complete substantive-body claim. Exclude previous-unit sanction reference81002 linked to80964–80965; own title note81004–81009 and corrections81117/81119/81177 retained. Add only own displaced omission note81237–81238 beyond next CCXIII81220, excluding the next title note81240–81241. Date remains null without normalizing the printed clause."
