description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. LXXVI 29898 follows preceding full/short dating 29891–29895. Synopsis 29900–29902 and Urban protocol 29904–29905 introduce the independent act; its section 1 explicitly cites Gregory XV and the edition supplies an abbreviated cross-reference at 29916–29922, then current operative section 2 resumes 29924. Sections 2–4 run in order to dating 29979–29983; next LXXVII begins 29990. Excluded 29937 (aurei correction belongs to previous act's 29879 auri marker); retained this act's title note 2 at 29939 and its inserted-reference note 3 at 29941–29942. No claim that the source's abbreviated Gregory quotation is a complete separate instrument."
