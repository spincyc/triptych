notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent CCXX heading LF45143, synopsis LF45145–45153 and LF45161–45164, and outer protocol LF45166–45167 identify Clement XII as issuer. The entire printed concessive body §§1–5, including its operative grants, has been read through the dating clause LF45369–45372 and printed date recap LF45374; no further subscription is printed before CCXXI at LF45382 in the inspected context. The historical note LF45155–45156 belongs to the preceding act: its suggested reading concerns the word and marker validilalcm * at LF45107, before that act’s dating and subscriptions LF45128–45140. Disjoint ranges therefore exclude LF45155–45160, comprising that prior-act note, blanks and running heading, and preserve both parts of this act’s synopsis. The historical notes at LF45273 and LF45328 belong to this act’s marked words and are retained. The displaced marginal rubric at LF45377–45379 belongs to this act’s §5 Non obslanlibus clause at LF45356 and is retained after the dating recap; the selected witness therefore continues through LF45379. References to earlier papal grants and prior confirmation of the institution define the present grant’s subject and scope; the present act’s substantive body is printed rather than replaced by a cross-reference. No literal etc formula abbreviation was found in the selected act. Raw OCR, historical wording and dating are uncorrected; date remains null. Full selected extent and twenty LF each side were read, plus LF44990–45122 to establish the displaced note’s membership; no authentication or image collation is claimed."
