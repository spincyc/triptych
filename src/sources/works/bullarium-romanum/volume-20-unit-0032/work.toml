description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent act XI has synopsis 34837–34839, its title-linked historical note split across 34841–34842 and 34898–34900, protocol 34847–34848 and opening at 34850. All three sections and both pieces of its historical note are preserved, with original dating 34964–34969 and editorial dating 34970. Trims the candidate tail at 34973: that detached proem marginal label belongs to following XII at 34976 with incipit 34985, while XI already carries its opening label at 34850. The excluded label is flagged for the next act in the evidence receipt. Substantive-extent re-audit: The present confirmation, renewal and mandate are printed at 34933–34954. Its historical recital of Urban VIII and related acts is retained as part of the complete outer act, with its three sections."
