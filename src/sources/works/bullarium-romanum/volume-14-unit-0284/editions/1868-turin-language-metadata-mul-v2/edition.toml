notes = "Latin and Italian. The substantial Latin papal confirmation expressly identifies the capitula inserted at its end. After the papal dating, the printing supplies that integral annex: a mainly Italian Camera record and navigation regulations, with a short Latin official protocol. The Italian annex is the text confirmed by the Latin act and remains attached in the unchanged frozen selection; it is not treated as an editorial note or removed to preserve a Latin-only label. This record corrects the language metadata of the same identified historical printing. The source text and original edition record remain preserved."
