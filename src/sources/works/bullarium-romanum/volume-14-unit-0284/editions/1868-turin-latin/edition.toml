notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent DCXXXV 95808, split synopsis 95811–95813/95819–95820 and self-protocol 95822–95823 follow preceding dating 95802–95805. The papal confirming act runs in order to dating 95972–95976. It explicitly incorporates the capitula in calce at 95855–95857, and introduces their tenor 95978–95979; the dated curial preface 95982 and Ludovicus protocol 96013–96015 lead to the ordered ten Italian clauses ending with curial dating 96168–96169, before next DCXXXVI 96172. Own notes 95871, 95928–95930 and 96154 are retained. The curial instrument is demonstrably the incorporated attachment, not a new independent papal act; no body reversal found."
