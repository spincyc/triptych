notes = "Latin papal confirmation with eight substantial Italian reform chapters deliberately inserted as its operative subject. The papal protocol, proem, account of earlier approval, confirmation, closing clauses and dating are Latin; the reform chapters are Italian. Latin marginal summaries and reading notes interrupt or share some OCR lines in the Italian section and remain editorial apparatus. The act retains both substantive source languages within its existing identity and ranges, without translation or separation of the chapters. This record corrects the language metadata of the same identified historical printing. The source text and original edition record remain preserved."
