notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent act XIV has synopsis 35760–35764, named addressee 35766–35768, papal protocol 35770 and salutation 35772–35774. Retains its synopsis-linked historical note 35784–35786, all sixteen clauses of the embedded concordia, the correction at 36003 referring to 35983, the papal mandate through section 4, and original dating 36090–36093 plus editorial dating 36095. Excludes only correction 35782, which refers to marked verb 35733 in preceding XIII and is preserved in u0034. The literal OCR protocol numeral is preserved without normalizing it. Next XV starts 36098. Substantive-extent re-audit: All sixteen clauses of the concordia are printed, followed by the present delegated confirmation mandate at 36054–36062 and its concluding clause. No substantive body is replaced by an editorial cross-reference."
