description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent numbered CCXVIII, with its own synopsis, literal Clemens episcopus protocol and incipit Religiosa christianorum principum. Its preamble and continuous sections 1–18 govern the enlargement and application of revenues for the western Lisbon patriarchal church. Clement XI and Innocent XIII are explicitly predecessors in the recital of earlier provision, not issuers of this act; internal Roman section/resolution numbers do not create act boundaries. All 33 marked historical note blocks are contextually matched and retained: 42115–42116, 42171, 42223, 42272, 42370, 42420, 42470, 42617, 42715, 42763, 42765, 42767, 42868, 42916, 42917–42918, 43017, 43019, 43068–43069, 43180, 43229, 43279, 43281, 43330, 43495, 43603, 43699–43701, 43703, 43767, 43931, 43933–43934, 43989, 44038, and 44208. This includes the multi-line omitted-words note 43699–43701 and the final note 44208, which annotates the preceding non-obstants despite falling alongside section 17. Penal conclusion 44225–44240, complete original/editorial dating 44242–44247, and golden-bull seal line 44248 are retained. Previous act dating ends 42020 with displaced tail rubric through 42025; next CCXIX begins 44251. The original/editorial date discrepancy is preserved without normalization; no adjacent act body is included. Source-extent re-audit: the conventional formula reference at 43526 is literally 'cum  clausulà  Quorum  lenores ,  eie,  in ', within the non-derogation clause in section 9; its abbreviation is retained as part of this independently bounded printed witness, without expansion. Additional literal abbreviation tokens occur in the historical grammatical note at 43069 ('i.eui[ie  decima,  quarta,  media,  eie.  (li.  T.). ') and in the OCR-interleaved marginal synopsis at 43173 (',.   .  ,.  ,.  luum,  eie,  la- '); neither replaces substantive current-act text. Historical note 42272 '1  Non  legunlur  in  Bullurio  Ir.  t.). ' annotates the earlier predecessor instrument cited at 42262–42278. The current act's own incorporation language at 42315–42321 and 44158–44166 remains printed, as do its substantive revenue provisions and final sanction/dating/seal; no Reliqua-ut-in-praecedenti-style substitution or other substantive body omission was found. The formula and external-instrument references are disclosed, not expanded."
