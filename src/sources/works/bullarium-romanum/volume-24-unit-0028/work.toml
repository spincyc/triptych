description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. The issuer is Clement XII, as printed in the outer protocol at raw LF19225–19226. The preceding act ends with its own dating and signature at LF19207–19212. CLXXV at LF19215 begins this act; its historical synopsis at LF19218–19223, Latin opening and §§1–4, and the Italian REf.OLE E COSTITUZIONI introduced expressly by §4 at LF19321–19328 form one outer act. The prelude and all three parts of those institutional rules continue within that incorporation; quotations or historical mentions of Clement XI, Benedict XIII and other authorities do not change the issuer. The internal chapter headings, including the repeated CAPO SETTIMO at LF25134, do not establish new papal acts. Finis at LF25886 and LAUS DEO at LF25888 close the incorporated rules, after which the outer Latin act resumes with §5 at LF25890 and continues through §8, its dating clause at LF25974–25977, printed date recap at LF25979, and F. card. Ouverius signature at LF25981. All historical biblical and textual notes within this continuous extent are retained, including the R. t. note at LF25919–25922 explaining the edition’s omitted index. This note expressly refers to the preceding incorporated rules. The retained text includes the source’s mixed Latin and Italian and all OCR wording without correction; date remains null, with no critical dating, authentication or image collation asserted. LF25982–25983 are blank and LF25984 is the next page’s running heading before CLXXVI at LF25987, so the selected act ends after its signature at LF25981. No unresolved boundary or historical-note membership blocker was found in the complete bounded OCR reading. Source-extent re-audit: admission covers the complete independently bounded printed witness as printed. Literal prayer-formula abbreviations remain unexpanded: the OCR reads etc at LF20728, LF20754, LF21716 and LF21722, ctc at LF20843, eie at LF20953, LF21067, LF21112 and LF25306, and de. after the Gloria Patri formula at LF22826. These occur in prescriptions naming prayers inside the incorporated institutional rules; they do not substitute for an independent papal act’s substantive body. The ecc. or ecc list continuations at LF20857, LF21199, LF22756, LF23189 and LF25059 are likewise preserved literally. The historical editorial note at LF25919–25922 expressly says it omits an index of the incorporated rules’ chapter titles as a repetition of titles already printed in their places: this is an omitted repetitive index, not an omitted substantive body. The earlier brief cited at LF19268–19273 is a contextual antecedent; the present confirmation, its incorporated rules, and its conclusion are printed here. No independent act’s substantive body was found summarized or replaced by a cross-reference in the full reading and targeted raw search. No missing wording, formula or index is supplied or reconstructed."
