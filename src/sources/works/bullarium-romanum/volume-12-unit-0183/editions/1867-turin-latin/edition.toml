notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. LXXIV heading and synopsis 98113–98125 precede explicit protocol 98127–98128. The preamble and §§1–7 run coherently through confirmation, communication of privileges, preservation and derogation to the own dating clause 98316–98318 and printed date 98320. Historical note 98161–98163 attaches to this act’s synopsis and is retained. Trim the original terminal margin: 98326–98340 describe confessors and Pius IV, so belong to following LXXV, whose heading and protocol are 98343 and 98350. No merged or reversed body columns were found."
