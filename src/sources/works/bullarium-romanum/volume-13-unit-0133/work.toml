description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. CXLIX 49407, synopsis 49410–49412 and actual outer Urbanus protocol 49414–49415 establish this act; catalog Gregorius at 49473 is only a quotation in internal decree II. Inserted reform decrees I–IX are expressly introduced at 49457–49459, signed 49540–49545, and confirmed by resumed sections 2–4 at 49546–49595. Dating 49597–49601 closes before CL 49604. Note 49611 explicitly corrects dicti...et illorum corresponding to 49574 and belongs to this act after the next title; retained separately, excluding next act note 49613. Notes 49445, 49501 and 49558 also retained."
