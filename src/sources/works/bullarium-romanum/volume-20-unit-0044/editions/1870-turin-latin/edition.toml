notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent act XXIII has synopsis 57226–57230 and episcopal protocol 57232–57236 with incipit 57238. The full long act has been read through all fourteen sections; its recitals of earlier Pius II, Sixtus IV, Clement VII, Pius IV and Pius V acts remain embedded antecedents under the present protocol. Retains all historical notes/corrections at 57268–57274, 57333, 57443, 57709, 57818, 57886–57887 and 57938, original dating 58034–58037, editorial dating 58039 and trailing OCR tokens through 58044. Next independent XXIV begins 58047. No length-based exception or unreviewed middle extent is used. Substantive-extent re-audit: The current confirmation, renewal, prohibitions, revocations, exception and extension are printed across sections 6–10, followed by sections 11–14. The earlier constitutions are historical recitals inside this complete outer act rather than separately missing independent acts."
