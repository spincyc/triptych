notes = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent LXXII Clement XI confirmation. The entire Congregation decree is explicitly introduced 34774–34775 and printed 34777–34838, with operative arrangements, date references 34787–34789 and cardinal signature/seal 34838; outer confirmation resumes 34839 and confirms it 34857–34863. The decree date formula literally reads Romae, ete. at 34837–34838; this conventional dating abbreviation remains unexpanded. Complete outer clauses and dating 34915–34919 retained. The historical title note 34759–34763 belongs to the marked synopsis 34751 and is included. References to Innocent XII and Benedict XIII in that note are historical apparatus, not current issuers. Previous act ends 34738 with its displaced marginal rubric 34741 outside this act; next LXXIII starts 34922. No substantive current body is replaced by a reference; no source correction or manufactured date."
