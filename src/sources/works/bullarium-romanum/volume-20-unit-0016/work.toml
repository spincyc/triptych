description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Independent act XVII erecting Pekim has its own synopsis at 16311–16315, episcopal protocol at 16317–16321 and incipit 16323. Its distinct named subject and complete enactment establish separate identity from preceding Nankim act ending 16306. Retains all historical notes/corrections at 16336–16343, 16397–16400, 16505–16509, 16575, 16631–16637 and 16694–16696, all ten sections, and original dating 16734–16737 plus editorial dating 16739. Next XVIII begins at 16742. Substantive-extent re-audit: The present erection, grant of jurisdiction, endowment and patronage provisions are printed across ten sections; the dispositive erection is explicit at 16442–16453 and 16555–16556."
