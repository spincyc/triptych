description = "The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. XII at 17124, its synopsis/summary through 17177 and the actual Bonifacius Papa Vili protocol at 17179–17180 establish one canonization act. The continuous proem and narrative of Ludovicus are integral to the act, not a separate biography. The numbered narrative and miracles run through 17898; the source author's statement there that further miracles are not enumerated is part of the act's own narration, not an editorial indication that this witness has lost substantive text. The canonization, feast and indulgence provisions at 17933–17992 lead to dating at 17994–17996, before XIII at 17999. No historical or source notes belonging to this act were found in the full range and context. The frozen empty date_raw remains empty despite the surviving printed dating clause; no authentication or correction is inferred."
