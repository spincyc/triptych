notes = "Fragment witness; the source omits part of the act. The exact selected raw OCR extent and surrounding boundary context were inspected. Printed attribution is preserved; this is not modern authentication, critical dating or image-collated text. Fragment of independent XXXIX with Gregorius episcopus protocol12587–12588. Current §1 narrates Boniface VIII in indirect report12595–12611 and ends with a literal abbreviation; historical note12639–12640 explicitly omits the remainder by cross-reference. This is missing substantive wording of Gregory’s own historical narrative, without a quoted predecessor protocol/tenor; preserve the surviving text as a fragment and do not reconstruct the omitted words. Current dispositions and Datum12665–12670 remain identifiable before XL12680. Keep displaced note12704, explicitly keyed to the variant at12659, with the existing discontiguous ranges."
