context = "Read visually in Friedberg I, column 1188, and checked against the exact MDZ c.88 transcription response. Section 1 directs the penitent seeking grace to 'querat sacerdotem scientem ligare et soluere.' Section 2 treats inability to reach a priest: 'si deest sacerdos, confiteatur proximo'; it immediately denies the neighbor the power of loosing and grounds the penitent's worthiness for pardon in 'desiderio sacerdotis.' It then invokes the lepers who were cleansed while going to show themselves to the priests: 'Mundati enim sunt leprosi, dum ibant ostendere ora sacerdotibus ante, quam ad eos peruenirent. Unde patet, Deum ad cor respicere, dum ex necessitate prohibentur ad sacerdotes peruenire.'"
verified_on = "2026-08-21"
notes = "The exact MDZ chapter response for dc_chapter_3_3490 was also acquired on 2026-08-21 (SHA-256 e5c509164dc4e64a6551feeec2309dee351b01adc702ba46c6f3ba0132562c6f, 8,997 bytes); its LF physical lines 65-86 contain sections 1-2. This passage supports personal confession to a priest and a necessity case in which confession to a neighbor manifests desire for the unavailable priest. It does not give the neighbor sacramental power to absolve; the text expressly says he lacks 'potestatem soluendi.' Friedberg's preceding dictum introduces c.88 as an authority of Augustine from a book De penitentia; this record establishes Friedberg's received attribution and wording, not modern critical authorship of that work."
