context = "Read visually in Friedberg I, columns 1165-1166, and checked against the exact MDZ c.34 transcription response. The dictum begins '[Gratian.] Conuersio autem dicitur quasi cordis undique uersio.' In section 1 it states: 'Dominus ostenderet, quod non sacerdotali iudicio, sed largitate diuinae gratiae peccator emundatur'; it then distinguishes the acts without suppressing either: 'Leprosus semetipsum sacerdoti representat, dum peccatum suum sacerdoti penitens confitetur. Sacrificium offert ex lege, dum satisfactionem ecclesiae iudicio sibi inpositam factis exequitur. Sed ante, quam ad sacerdotes perueniat, emundatur, dum per contritionem cordis ante confessionem oris peccati uenia indulgetur.' Section 2 continues the resurrection image: one raised by the Lord lives while confessing and has the raiser present and indwelling."
verified_on = "2026-08-21"
notes = "The exact MDZ chapter response for dc_chapter_3_3436 was also acquired on 2026-08-21 (SHA-256 e4b376bf6ec4f1103d9db6a89d1bb0960900b04f42c2d0eb1bdfdee8f4edff86, 7,477 bytes); its LF physical lines 24-80 carry the dictum, with the controlling contrast and its confession/satisfaction development at lines 38-54. This passage establishes the argument made at this stage of Gratian's dialectical treatment: cleansing and pardon are attributed to divine grace through inward contrition before oral confession, while personal confession to the priest and satisfaction imposed by ecclesial judgment remain real subsequent acts. It does not by itself establish the final disposition of the whole quaestio; the later dictum post c.87 expressly reinterprets earlier contrition-only authorities."
