description = "The mid-twelfth-century canonical collection whose first-part distinctions open with the taxonomy of law received from Isidore. Loci here address the first part by distinction: d-N-pr for the dictum Gratiani opening a distinction, d-N-c-M for a chapter with any adjoining dicta. The Munich (MDZ) online transcription of Friedberg's 1879 Leipzig edition serves as the accessible public-domain-based witness."
