notes = "Migne numbers the questions continuously and prints his own scriptural reference — `(Gen. II, 7)` — inside those answers that quote a verse. That reference is the only thing this library reads as a question's extent, and a hundred and sixty-five of the two hundred and eighty questions carry none at all. Those are held as passages and appear under no chapter, because supplying a verse for a question that names none is exactly the reference that resolves successfully and wrongly. No public-domain English translation exists."
