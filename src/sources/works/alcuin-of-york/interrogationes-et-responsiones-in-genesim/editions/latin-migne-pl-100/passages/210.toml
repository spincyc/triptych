text = """
Inter. 210. Cur [enim] nominavit Scriptura filios Nachor fratris Abrahae (Ibid., vers. 20)?-- Resp. Quia de illis, vel de illorum stirpe aliquid celebre postea gestum esse legitur. Itaque Hus [ Ms., Chus] unus erat, de cujus stirpe Job descendit. 326 Sic enim scriptum est in exordio voluminis ejus: Vir fuit in terra Hus [Ms., Chus] nomine Job. Male igitur aestimabant [ Ms., aestimant] quidam, Job de genere Esau natum, in cujus genere est Balam [ Ms., de gente Esau. Secundus natu est de Melcha Buzi, ex cujus genere est Balam, etc.] ille divinus, ut Hebraei tradunt, qui in libro Job dicitur Heliu: primum vir sanctus [et] propheta Dei, postea per inobedientiam et desiderium munerum excaecatus, dum Israel maledicere coepit, divini vocabulo nuncupatus. [Diciturque in eodem libro: Et iratus Heliu filius Barachiel Buzites. De hujus videlicet Buzi radice descendens Cham vel pater ejus Damasci. Ipsa enim vocatur Aran, quae hic pro Syria scripta est et ipso nomine legitur in Isaia. Caseth quoque quartus est, a quo Casiadei, id est Chaldaei, postea vocati sunt. Bathuel, de quo Rebecca et Laban pater Liae et Rachel.]\
"""
