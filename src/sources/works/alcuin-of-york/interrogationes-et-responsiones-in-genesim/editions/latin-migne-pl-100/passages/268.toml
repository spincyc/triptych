Inter. 268. Quomodo dicitur: Filii ejus et filiae descenderunt cum Jacob in Aegyptum (Gen. XLVI, 7), cum Jacob plures non habuerit filias, quam Dinam tantummodo?-- Resp. Aut [etiam] neptes filiarum nomine intelligere debemus; aut pluralis numerus pro singulari positus est, sicut ibi: Misit in eis muscam caninam.\
