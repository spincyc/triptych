text = """
Inter. 28. Quid in coeli terraeque nomine significatur, quando dicitur: In principio fecit Deus coelum et terram (Gen. I, 1)?-- Resp. Informis illa materia, quam de nihilo fecit Deus, appellata est primo coelum et terra: non quia jam hoc erat, sed quia jam hoc esse poterat. Nam secundo die coelum istud sidereum factum esse legitur, et tertio die terram apparuisse et vestiri floribus coepisse. Sive, in coeli et terrae nomine spirituales et terrenae creaturae intelligi possunt.\
"""
