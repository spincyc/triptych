text = """
Inter. 173. Quae littera adjecta est nomini Abraham et Sarrai; vel quae mutationis nominum illis causa fuit?-- Resp. Dixit Dominus ad Abraham: Ecce testamentum meum tecum, et eris pater multitudinis gentium, et non vocabitur nomen tuum Abram; sed erit nomen tuum Abraham, quia patrem [multarum] gentium posui te (Gen. XVII, 4 et 15). Dicunt autem Hebraei quod Deus ex nomine suo, quod apud illos tetragramum [ Ms., tetragrammaton] est, [ Ms., e] litteram Abrahae et Sarrae addiderit. Dicebatur enim primum Abram, quod interpretatur pater excelsus; et postea 321 vocatus est Abraham, pater multarum. Nam gentium non habetur in nomine, sed subauditur. Nec mirandum quare, cum apud Graecos et quosdam alios a littera videatur addita, nos [ Ms., e] litteram Hebraeam additam dixerimus; idioma enim linguae [illius] est per [ Ms., e] quidem scribere, sed per a legere; sicut e contra a litteram saepe per e pronuntiant. Et dixit Deus ad Abraham: Sarri [ms., Sarrai] uxor tua, non vocabis eam Sarri, sed Sarra erit nomen ejus (Gen. XVII, 15). Errant [ Ms., Et sunt], qui putant primum Sarra per unum r scriptum fuisse, et postea ei alterum r additum, quia r apud Graecos centenarius numerus est. Sarri [ Ms., Sarrai] ergo primum vocata est per [ Ms., per sin, res, joth] sublato jod, id est, iota elemento, additum est e, quod per a legitur, et vocata est Sarra. Causa autem nominis mutati haec est quod antea dicebatur princeps [mea ], unius tantummodo domus materfamilias; postea vero dicitur absolute princeps.\
"""
