text = """
Inter. 205. Si Abraham indubitanter et firmo animo cogitabat mactare puerum Domino in holocaustum, quid est quod dixit pueris suis: Vos exspectate hic: ego et puer, cum adoraverimus, revertemur ad vos (Gen. XXII, 5)?-- Resp. [Igitur et dubitanti animo mactare puerum cogitabat, et indubitanti animo in Deum resuscitari credebat eum.] Idcirco utrumque laudis [ Ms., laudabilis] est et in constantia offerendi, et in fide resuscitandi. Sciebat certissime Deum fallere non posse: et licet puer occideretur, promissionem tamen Dei salvam permanere. Unde et Paulus apostolus per Spiritum sanctum didicerat, quid animi habuisset Abraham intra se, dum fidem ejus laudat [ Ms., laudavit] dicens: Fide Abraham non haesitavit, cum unicum offerret, in quo acceperat promissionem [ Ms., repromissiones], [cogitans] quia a mortuis eum resuscitare potens est Deus (Rom. IV, 20).\
"""
