text = """
Inter. 182. Quare Abraham in tribus viris illis, si Deum intellexit vel angelos, et iterum Lot in duobus, eos humano cibo vesci putabat?-- Resp. Fortasse prius eos homines esse arbitrati sunt, in quibus Deum loqui intellexerunt; quibusdam divinae majestatis existentibus et apparentibus signis, postea fuisse angelos cognoverunt, cum eis videntibus in coelum issent. Sed intuendum est hic quantum bonum sit hospitalitas. Hospitalem domum ingressi sunt angeli, clausas hostium [ Ms., hospitibus] domos ingressus est ignis.\
"""
