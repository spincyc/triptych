text = """
318 Inter. 155. Quantae promissiones Domini fuerunt ad Abraham?-- Resp. Duae. Una scilicet quod terram Chanaan possessurus sit in semine suo: quod significatur cum dictum est: Vade in terram, quam demonstravero [Ms., monstravero] tibi, et faciam te in gentem magnam (Gen. XII, 2). Alia vero longe praestantior, quod pater est non unius gentis Israeliticae solum, sed et omnium gentium, quae fidei ejus vestigia sequuntur, quod his verbis promittitur: Et benedicentur in te omnes gentes [terrae; illi scilicet in semine Abraham benedicentur] qui Abrahae fidem imitantur.\
"""
