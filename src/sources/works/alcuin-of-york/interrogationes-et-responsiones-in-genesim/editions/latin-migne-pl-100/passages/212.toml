text = """
Inter. 212. [Quaeritur] quid significat quod Abraham puero suo dicit: Pone manum tuam super femur meum, et jura per Dominum Deum coeli (Gen. XXIV, 2, 3)?-- Resp. Tradunt Hebraei quod in sanctificatione ejus, hoc est circumcisione, juraverit. Sed melius intelligendum est jurasse in semine Abrahae, hoc est Christo. Quia ipse Dominus Deus coeli in ea carne tum venturus erat, quae de illo femore propagata est.\
"""
