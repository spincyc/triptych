text = """
Inter. 218. Cur Abraham post promissum sibi et natum Isaac, in quo ei multiplicatio prolis, et benedictio gentium promissa est a Deo, aliam voluit ducere uxorem (Gen. XXV, 1)?-- Resp. Non propter incontinentiam, cum jam esset grandaevus; sed sicut Agar et Ismael significant carnales Veteris Testamenti; sic Cethura et filii ejus significant haereticos, qui se ad Novum Testamentum pertinere existimant. Sed utraeque concubinae dicuntur; sic enim dicitur: Filiis [autem] concubinarum largitus est munera (vers. 6). Sola Sarra uxor semper vocatur.\
"""
