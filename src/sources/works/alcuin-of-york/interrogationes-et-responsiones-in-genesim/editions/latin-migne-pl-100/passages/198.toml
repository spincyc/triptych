text = """
Inter. 198. Si tredecim [ Al., quatuordecim] annorum erat Ismael quando natus est Isaac, adjunctisque aetati [ Ms., hac aetate] ablactationis annis, quomodo convenit tantae aetatis adolescentem matris sedisse in cervicibus, dum dicitur: Sumpsit Abraham panes et utrem aquae et dedit Agar, ponens super humerum ejus et parvulum, et dimisit eam (Gen. XXI, 14)?-- Resp. Omnis [igitur] filius secundum idioma linguae Hebraeorum, ad comparationem parentum, infans vocatur et parvulus. Et est sensus: Posuit Abraham panes et utrem super humerum Agar, et hoc facto dedit puerum matri, hoc est, in manu ejus eum tradidit, commendavit, et ita emisit e domo. Quod in sequentibus declaratur, dum dicitur: Surge, tolle puerum, et tene manum ejus (Ibid. v. 18); non ut eum de terra [velut] jacentem tolleret, sed quasi comitem manu teneret. Quod autem manu parentis tenetur, sollicitus monstratur affectus.\
"""
