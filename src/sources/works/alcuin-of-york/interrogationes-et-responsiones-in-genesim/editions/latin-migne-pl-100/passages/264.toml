Inter. 264. Quid est quod Pharao dixit: Putabam me stare super flumen (Gen. XLI, 1)?-- Resp. Id [ Ms., Idem] est quod in alio loco legitur: Ecce ego super fontem aquae sto (Gen. XXIV, 13). Hoc genere locutionis et in psalmo dicitur: Qui fundavit terram super aquam [Ms., aquas ]. [Non coguntur homines putare sicut navem natare terram super aquas]. Secundum hanc [enim] locutionem [recte] intelligitur, quod altior sit terra quam aqua. Altius quippe ab aquis sustollitur, ubi habitant terrena animalia.\
