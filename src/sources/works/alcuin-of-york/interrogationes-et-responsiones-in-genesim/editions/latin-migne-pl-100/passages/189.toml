text = """
Inter. 189. Quo consilio filiae Lot concubitum patris petierunt (vers. 31, 33); vel ab incestu purgari possunt, dum hoc scientes fecerunt; ille vero [quasi] nesciens?-- Resp. Videtur [namque] filias Lot quaedam didicisse de saeculi [ Ms. mundi] consummatione, quae immineret per ignem: sed tanquam puellae non intelligebant perfecte, quae didicerant. [Nescierunt] quod Sodomiticis igne vastatis multum adhuc spatium integrum resideret in mundo suspicatae sunt, tale aliquid factum, quale in temporibus Noe audierant, et ob reparandam mortalium posteritatem solas se esse cum parente servatas. Recuperandi igitur humani generis desiderium sumunt, atque instaurandi saeculi ex sese dandum opinantur exordium. Et quanquam grave eis crimen [videatur] furari concubitum patris, gravior tamen eis impietas videbatur, si humanae, ut putabant, posteritatis spem servata castitate delessent. Propter hoc ergo consilium ineunt, minore, ut arbitror, culpa [spe tamen] argumentoque majore, patris moestitiam vel rigorem vino molliunt et resolvunt: singulis ingressae noctibus, singulae suscipiunt ab ignorante conceptum; ultra non repetunt, nec requirunt. Ubi hinc libidinis culpa, ibi incesti crimen arguitur; quomodo dabitur in vitio, quod non iteratur in facto?\
"""
