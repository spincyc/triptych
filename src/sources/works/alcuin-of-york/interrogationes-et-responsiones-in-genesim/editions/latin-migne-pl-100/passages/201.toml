text = """
Inter. 201. Quid illud: Tentavit Deus Abraham (Gen. XXII, 1)? Et Jacobus apostolus dicit: Deus neminem tentat (Jac. I, 13). Quomodo utrumque intelligendum est?-- Resp. Duobus [enim] modis tentatio in Scripturis solet intelligi. Una est quae per Deum fit probationis causa, ut justificetur homo et coronetur; de qua et dicitur: Tentat vos Dominus Deus vester, ut sciat si diligatis eum (Deut. XIII, 3), hoc est, ut scire vos faciat. Alia est, de qua Jacobus dicit: Deus neminem tentat (Jacob. I, 13); qua peccato implicamur. De illa Apostolus dicit: Ne forte tentaverit vos is qui tentat (I Thess. III, 5). Igitur Abraham a Deo tentatus est, ut probaretur, justificaretur, coronaretur, et ut ejus obedientia tali probata examine posteris innotesceret.\
"""
