text = """
Inter. 184. Quaeritur quare Lot cum jussus esset ad montem fugere, Segor praetulerit, ut ibi salvaretur; et rursum de Segor ad montem migrasset (Gen. XIX, 20)?-- Resp. Tradunt Hebraei quod Segor frequenter terrae motu subruta, Bale primum, et postea Salissa appellata sit, timueritque Lot dicens: Si cum caeterae adhuc urbes starent, ista saepe subversa est, quanto magis nunc in communi ruina non poterit liberari? Et hanc occasionem infidelitatis, etiam in filias coitus principium dedisse certum est. Qui enim caeteras 323 viderat subrui civitates, et hanc [stare, seque auxilio Dei erutum ( In edit., mendose, et hanc fuisse, quae Dei auxilio eruta est)]; utique de eo quod sibi concessum audierat, ambigere non debuit.\
"""
