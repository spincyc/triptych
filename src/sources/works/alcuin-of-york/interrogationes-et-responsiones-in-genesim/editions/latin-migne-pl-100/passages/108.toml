text = """
Inter. 108. Quid habet mysterii mensura arcae?-- Resp. Habet [enim] mysterium perfectum corporis Christi. Sexies enim trecenti habent intra se quinquaginta, et decies triginta. Sic enim humanum corpus, si jacentem metiaris hominem, sexies habet longitudo latitudinem, et decies altitudinem. Nam longitudo jacentis hominis a vertice usque ad vestigia metienda est, et a latere usque in latus, et altitudo a dorso in ventrem. Quae figura apte Christo convenire noscitur, propter longanimitatem omnia sufferentis fidei et amplitudinem charitatis, et sublimitatem spei aeternae.\
"""
