text = """
Inter. 181. Quaeri solet utrum quod de Sodomis dixit Deus, non se perdere locum, si invenirentur illic centum vel decem justi (vers. 26, 32), speciali quadam sententia de illa civitate, an de omnibus intelligendum sit generaliter, parcere Deum loco, in quocunque vel decem justi fuerint?-- Resp. Non est [quidem] necesse, ut hoc de omni loco accipere compellamur. Verumtamen de Sodomis potuit sic dici, quia sciebat Deus, ibi non esse vel decem, et ideo sic respondebatur Abrahae, ut significaretur nec tot ibi posse inveniri, ad exaggerationem iniquitatis illorum.\
"""
