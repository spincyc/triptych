Inter. 14. Quare Deus in principio [humano generi] legem non dedit quam postea per Moysen tradidit?-- Resp. Quia in hominibus primis diu lex bonae naturae servabatur; at ubi naturalis lex evanuit, oblata consuetudine peccandi, data est lex litterae per Moysen, ut bona quae sciebantur auctoritatem haberent, et quae latere coeperant, manifestarentur; et ut terror disciplinae corrigeret delinquentes, et fidem reformaret in Deum.\
