physical_line_ranges = [[241, 241]]
text = """
Inter. 237. Quomodo decem vicibus dicit Jacob socero suo, mutasse eum mercedem suam (Gen. XXXI, 41)?-- Resp. Hic est sensus, quod per singulos fetus semper Laban conditionem mutaverit. Si videbat varium nasci pecus [post fetum] dicebat: Nolo [ F., volo] in futurum varia mihi nascantur. Rursum cum vidisset unius coloris nasci pecora [Jacob quoque, hoc audito, virgas in canalibus non ponebat] dicebat: futuros fetus unius coloris pecora mihi procreabunt. Et quid plura? usque ad decem vices semper [a Laban pecoris sui] Jacob mutata conditio est: et quodcunque sibi proposuerat Laban, ut nasceretur, in contrarium colorem vertebatur. Ne cui autem in sex annis decem pariendi vices incredibiles videantur, lege Virgilium, in quo dicitur: Bis gravidae pecudes . . . . . Natura autem Italicarum ovium et Mesopotamiae una esse perhibetur.\
"""
