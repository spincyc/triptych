text = """
Inter. 224. Quid est quod dicitur de eodem Ismaele: Coram omnibus fratribus suis obiit (vers. 17)? vel qui sunt fratrum nomine dicti [ Ms., censiti]?-- Resp. Id est, in manibus omnium liberorum [ Ms., filiorum] suorum mortuus est, superstitibus omnibus liberis, et nullo prius morte praerepto. Fratres autem pro filiis appellari, ad Jacob Laban demonstrat dicens: Ponatur coram [fratribus meis et] fratribus tuis, ut judicent inter nos (Gen. XXXI, 37). Nec enim legimus alios fratres Jacob ibi habere, exceptis liberis suis.\
"""
