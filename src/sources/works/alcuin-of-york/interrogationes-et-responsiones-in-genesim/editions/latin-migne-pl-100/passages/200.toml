text = """
Inter. 200. Quomodo ad puteum juramenti agrum plantaverat Abraham (Ibid., v. 29 seq.), si in terra illa, quemadmodum Stephanus ait in Actis (VII, 5): Non acceperat haereditatem nec spatium pedis?-- Resp. Ea est intelligenda haereditas quam Deus fuerat munere suo gratuito daturus, non ista quae pretio empta est. Intelligitur autem spatium circa puteum ad illud emptionis pactum pertinere, in quo fuerant agnae septem datae, quando Abimelech et Abraham sibi [etiam] juraverunt.\
"""
