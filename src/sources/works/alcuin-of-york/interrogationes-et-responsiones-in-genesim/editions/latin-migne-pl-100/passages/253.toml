text = """
Inter. 253. Erant [autem] filii Jacob duodecim (Gen. XXXV, 22); et computatis omnibus, Benjaminque, et addidit: Hi filii Jacob, qui nati sunt ei in Mesopotamia Syriae (vers. 26); dum constat Benjamin natum esse in Chananaea, quomodo tunc duodecim nasci dicuntur in Mesopotamia?-- Resp. Nulla est [ergo] facilior solutio hujus quaestionis, quam ut per synecdochen accipiatur. Ubi enim major pars est aut fortior [ Ms., potior], solet ejusdem nomine etiam illud comprehendi quod ad ipsum nomen [non] pertinet.\
"""
