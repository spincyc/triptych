text = """
Inter. 169. Quare dictum est in Genesi de filiis Abraham: Quarta progenie revertentur huc (Gen. XV, 16)? Et in Exodo legitur: Quinta generatione ascenderunt filii Israel de terra Aegypti (Exod. XIII, 18, juxta LXX)?-- Resp. Egressi sunt filii Israel quarta generatione de terra Aegypti. Replica generationem Levi. Levi genuit Gath; Gath genuit Amram [ Ed., Abram]; Amram genuit Aaron [ Edit., Aran]; Aaron [genuit] Eleazar; Eleazar [genuit] Phinees. Gath cum patre suo Levi ingressus est Aegyptum; [rursum Eleazar cum patre suo Aaron regressus est ab Aegypto]. A Gath usque ad Eleazar computantur quatuor generationes. Quod autem secundum Exodum quinta generatione egressi sunt filii Israel de terra Aegypti, tribus Judae ordo [ibi] numeratur [ Ed., numeretur]. Judas genuit Phares; Phares [genuit] Esron; Esron genuit Aram; Aram [genuit] Aminadab; Aminadab [genuit] Naasson; Naasson [genuit] Salmon. Phares cum patre suo [Juda] ingressus est Aegyptum; Naasson princeps Juda in deserto describitur, cujus filius Salmon terram promissionis introiit. Computa a Phares usque ad Naasson, et invenies generationes quinque.\
"""
