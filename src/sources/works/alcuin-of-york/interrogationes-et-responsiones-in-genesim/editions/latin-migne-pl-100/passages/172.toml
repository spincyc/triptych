text = """
Inter. 172. Quomodo manus omnium contra Ismaelem, et manus ejus contra omnes (Gen. XVI, 7, 12)?-- Resp. Invenit [enim] angelus Domini Agar super fontem aquae in deserto ad fontem in via Assur, quae per eremum ducit ad Aegyptum, [ire festinabat]: Et vocavit nomen ejus Ismael, quia exaudivit Dominus humilitatem [ejus] (Ismael interpretatur exauditio Domini [ Ms., Dei]): Hic erit ferus homo, manus ejus super omnes, et manus omnium super eum, et contra faciem omnium fratrum suorum habitabit. Significat autem semen ejus habitaturum in eremo, id est, Sarracenos vagos, incertisque sedibus, qui universas gentes, quibus desertum ex latere jungitur, incursant et impugnant, [et impugnantur ab omnibus].\
"""
