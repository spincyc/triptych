physical_line_ranges = [[280, 280]]
text = """
Inter. 276. Quid sibi vult, a tanto viro et tali patriarcha tam sollicita corporis commendatio, ut non in terra Aegypti sepeliatur, sed in terra Chanaan juxta patres suos (vers. 30)?-- Resp. In his [figurae] sacramenta tibi quaerenda sunt, et [majoris] admirationis gaudium invenies. Cadaveribus quippe mortuorum peccata significari in lege non est dubium. Hinc illa sententia ducta [ Ms., dicta] est: Qui baptizatur a mortuo, et iterum tangit illum, quid proficit lavatio ejus? sic et qui jejunat super peccata sua et iterum ambulans haec eadem facit, etc. (Eccle. XXXIV, 30, 31). Sepultura ergo mortuorum remissionem significat peccatorum. Eo pertinet quod dictum est: Beati quorum remissae sunt iniquitates et quorum tecta sunt peccata (Psal. XXXI, 1). Ubi ergo sepelienda erant haec significantia cadavera patriarcharum, nisi in ea terra ubi ille crucifixus est cujus sanguine facta est remissio peccatorum.\
"""
