text = """
Inter. 244. Quid [sibi vult] quod Jacob ait [fratri suo]: Sic vidi faciem tuam, quasi viderem faciem Dei (Gen. XXXIII, 10). Utrum paventis et perturbati animi verba usque in hanc adulationem proruperunt?-- Resp. Haec verba fraterna sunt et benigno animo dicta, quoniam post benignam susceptionem metus ipse transierat. Et fortassis Dei nomine angelorum aliquem vel sanctorum [ Ms., vel aliquem sanctum] hoc loco intelligere debemus, secundum Apostolum, qui dixit: Etsi sunt qui dicuntur dii, sive in coelo, sive in terra, quemadmodum sunt dii multi et domini multi (I Cor. VIII, 5).\
"""
