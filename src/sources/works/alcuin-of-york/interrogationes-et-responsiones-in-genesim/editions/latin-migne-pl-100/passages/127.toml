Inter. 127. Cur quadragenario numero pluvia mundabat, et iterum post quadraginta dies dicitur Noe fenestram [arcae] aperuisse (vers. 6)?-- Resp. Quadragenarius [vero] numerus tribulationem poenitentiae ostendit. Quod vero post quadraginta dies fenestram [arcae] aperuit Noe, significat jejunio coelum reserari. Ideo Moyses et Elias, [etiam] et ipse Salvator quadragenario numero jejunia consecrarunt, tanquam tribus temporibus necessaria, ante legem, sub lege, sub gratia.\
