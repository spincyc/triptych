text = """
Inter. 213. Quomodo servus Abrahae in petitione signi augurationis vitio culpandus non est (vers. 14)?-- Resp. Aliud est [enim] mirum aliquid petere, quod ipso miraculo significatur [ Ms., quod pro ipso miraculo signum sit]; aliud [est etiam] humanos errores superstitiosa vanitate in auspiciis, augurationibus [et] divinationibus observare. Quaedam enim pacta [ Ms., facta] sunt diabolicae familiaritatis, et non sine grandi peccato fiunt, quando fiunt. Illud igitur superius petitionis genus comprobatio [ Ms., computatio fidei] seu conjunctio fidei est ad Deum; hoc posterius infidelitatis conjunctio ad diabolum.\
"""
