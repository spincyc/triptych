text = """
Inter. 257. Qualiter historia de Juda et tribus filiis ejus et uxore ejus Thamar (Gen. XXXVIII) intra tam paucos annos compleri potuit? [Cum ergo anno XIV aetatis suae venditus fuisse credatur; XIII annos peregerat in Aegypto ignotus Pharaoni; ad hos enim tredecim annos accesserunt VII anni ubertatis, et facti sunt anni XX: his adduntur duo; quia secundo anno famis Jacob introivit in Aegyptum cum filiis suis, et inveniuntur XXII anni, quibus abfuit Joseph a patre et a fratribus suis. Quo medio tempore quomodo fieri potuerunt]?-- Resp. Solet [enim] Scriptura sancta per recapitulationem multa proferre. Aliquot ergo annis ante venditum Joseph haec fieri coepisse intelligi datur. Etiam mox, ut adolesceret Judas, incidit [ Ms., coepit incidisse] in amorem ejus, quam duxit uxorem, nondum vendito Joseph in Aegyptum.\
"""
