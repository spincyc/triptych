text = """
Inter. 51. Quid est, quod dixit [ Ms., dicitur]: Et posuit Deus hominem in paradiso voluptatis, ut operaretur et custodiret illum (Gen. II, 15)? [Nunquid homini laborare in paradiso opus fuit]; aut a quo custodire illum [ Edit., illud; al. custodiri ille] debuit?-- Resp. Non enim [homini erat] laboris afflictio in paradiso, sed voluntatis exhilaratio; cum ea quae Deus creaverat humani operis adjutorio laetius feraciusque [ Ms., veracius] provenirent. Et custodiret illum, ut custodiret eumdem paradisum sibi ipsi, et [ Ms., ne] si aliquid amitteret, ut inde mereretur expelli.\
"""
