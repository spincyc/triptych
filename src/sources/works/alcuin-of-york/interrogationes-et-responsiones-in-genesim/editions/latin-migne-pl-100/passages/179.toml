physical_line_ranges = [[183, 183]]
text = """
322 Inter. 179. Quid est clamor Sodomorum; vel quid est, quod Dominus dixit: Descendam et videbo, utrum clamorem qui venit ad me, opere compleverint (Gen. XVIII, 20, 21) ?-- Resp. Peccatum cum voce est culpa in actione; peccatum vero cum clamore est culpa cum libertate et jactantia. Quod autem dixit: Descendam et videbo, et [caetera] hujusmodi, omnipotens Dominus et omnia sciens; cur ante probationem quasi dubitat, nisi ut gravitatis nobis exemplum proponat, ne mala hominum ante praesumamus credere quam probare? Et ecce ut per angelos ad cognoscenda mala descendit, mox facinorosos percutit. Atque ille patiens, ille mitis, [ille], de quo scriptum est: Tu autem [Domine] cum tranquillitate judicas (Sap. XII, 18). Ille de quo rursum scriptum est: Dominus patiens est, cum [in] tanto crimine involutos inveniens, quasi patientiam praetermisit, et diem extremi judicii exspectare ad vindictam noluit, sed eos igne judicii ante diem judicii praevenit. Ecce malum, et quasi cum difficultate credidit cum audivit; et tamen sine tarditate percussit, cum verum cognoscendo reperit: ut nobis videlicet daret exemplum, quia majora crimina et tarde credenda sunt cum audiuntur, et citius punienda, cum veraciter agnoscuntur.\
"""
