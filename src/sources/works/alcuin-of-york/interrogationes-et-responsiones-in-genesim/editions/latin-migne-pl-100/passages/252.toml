text = """
Inter. 252. Quomodo Scriptura dicit, post mortem Isaac patris sui, Esau abscessisse de terra Chanaan, et habitasse in monte Seir (Gen. XXXVI, 8); cum veniente de Mesopotamia Jacob legatur (Gen. XXXII, 3) eum misisse nuntios ad fratrem suum in terra Seir, regionis Edom, cum ibi habitaret tunc temporis [ Ms., eumque ibi habitasse tunc temporis]?-- Resp. In promptu est cogitare quod scilicet Esau, posteaquam in Mesopotamiam frater ejus abscessit, noluit habitare cum parentibus suis, [sive] ex illa commutatione [ Ms., commotione] qua dolebat se benedictione fraudatum; sive causa uxorum suarum, quas odiosas videbat esse parentibus, et coeperat habitare in monte Seir. Deinde post reditum Jacob fratris sui, facta inter eos concordia, reversus est et ipse ad parentes; et cum mortuum patrem simul sepelissent, quia eos plurimum ditatos terra illa, sicut scriptum est, minime capiebat, abscessit rursus in Seir, et ibi propagavit gentem Idumaeorum.\
"""
