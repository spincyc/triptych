physical_line_ranges = [[194, 194]]
text = """
Inter. 190. Si Lot [quasi] incestus [ Al., incertus] in hoc facto culpandus est, an non?-- Resp. Culpandus est quidem in hoc facto Lot, quantum ebrietatis [ Ms., ebrietas] ignorantia meretur. Nam et hanc lex aeterna condemnat, quae cibum et potum non nisi ad salutem corporis sumere mandat. Et hinc diligentius intendendum est, quantum sit ebrietatis malum; et valde timendum est illis, quibus hoc malum in usu est. Nam in crimine ebrietas decipit, quem Sodoma non decepit. Uritur ille flamma mulierum, quem flamma sulphurea non ussit. Erat ergo Lot arte, non voluntate deceptus; ideo medius quidam [ Ms., quidem] inter peccatores et justos: quippe qui ex Abrahae cognatione [ Ms., stirpe] descenderat, in Sodomis tamen habitaverit. Nam et hoc quod evadit e Sodomis, sicut Scriptura indicat, magis ad honorem Abrahae, quam ad meritum pertinet Lot.\
"""
