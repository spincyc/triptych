Inter. 185. Cur igitur angeli, quasi hospites coacti, domum Lot introisse dicuntur?-- Resp. Ut tentata esset charitas Lot, probata et remunerata: et ut ostenderetur quantum esset hospitalitatis bonum. Hospitalem vero domum angeli ingressi sunt ad liberandum hospitem suum: clausas autem hospitibus domos ignis ingressus [est] ad perdendos peccatores in eis. Idcirco hospites non sunt evitandi, sed ultro invitandi.\
