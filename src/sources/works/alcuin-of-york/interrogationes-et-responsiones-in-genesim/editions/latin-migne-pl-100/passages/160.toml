text = """
Inter. 160. Dixit [ergo] Deus ad Abraham: Leva oculos tuos et vide a loco in quo tu nunc es, et ad Aquilonem et ad Austrum, ad Orientem et ad Mare [Vulgata, Occidentem], quia omnem terram, quam tu vides, tibi dabo, et semini tuo (Gen. XIII, 14). Si enim terra tantum promittebatur [ei], quam tunc in uno loco stans videre potuit per quatuor climata mundi; angusta videtur esse terra promissionis?-- Resp. Non hoc [loco] solum terrae [ei] promissum est, quod videre potuit. Non enim dictum est, tantum terrae tibi dabo quantum vides; sed: Tibi dabo terram, quam vides, cum et ulterior undique dabatur. Et idcirco subjunxit: Surge et perambula terram in latitudine et longitudine [ejus ] (vers. 17), ut perambulando perveniret ad ea, quae oculis uno loco stans videre non potuisset. Significabatur autem ea terra, quam carnale semen ejus accepturum erat; [nam illud spiritale totius mundi latitudinem possessurum erit.]\
"""
