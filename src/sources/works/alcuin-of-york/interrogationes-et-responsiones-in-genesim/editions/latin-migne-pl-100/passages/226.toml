text = """
Inter. 226. An secundum historiam vel etiam allegoriam intelligendum est quod Dominus respondit Rebeccae: Duae gentes sunt in utero tuo et duo populi ex ventre tuo dividentur, populusque populum superabit, et major serviet minori (vers. 23)?-- Resp. Secundum utrumque modum: spiritualiter vero sic solet intelligi quod dictum est, [ut] in Esau figuratus sit major populus Dei, hoc est, Israeliticus secundum carnem; per Jacob autem figuratus est ipse Jacob in populo Christiano, secundum spiritualem progeniem propagato [ Ms., quam propagavit]. Sed etiam historica proprietate invenitur hoc responsum esse completum, ubi populus Israel, hoc est, Jacob minor filius superavit Idumaeos, quos [ Ms., hoc est, gentem quam . . . ] propagavit Esau, eosque fecit tributarios per David, quod diu fecit scilicet usque [ Ms., quandiu fuerunt usque . . . ] ad regem sub quo Idumaei rebellaverunt, et jugum Israeliticum a cervice sua deposuerunt.\
"""
