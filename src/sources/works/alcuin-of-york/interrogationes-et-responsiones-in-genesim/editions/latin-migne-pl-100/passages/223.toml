text = """
Inter. 223. Quid est quod dicitur de Ismaele (vers. 16), quod duodecim generasset principes, vel duces [qui regionibus vel tribubus nomina dederunt ( omissa in ms. )]?-- Resp. Significat quod singuli filiorum Ismaelis [regionibus vel tribubus nomina dederunt], e quibus primogenitus ejus fuit Nabaioth [ Ms., Nabaoth; al., Nabeoth], a quo omnis regio ab Euphrate ad mare Rubrum Nabathena usque hodie dicitur, quae pars est Arabiae. Nam et familiae eorum oppidaque et pagi ac munita castella, et tribus horum appellatione celebrantur. Ab uno ex his Cedaar in deserto, Eoduma alia regio, et Hemanea [ Ms., Themana] ad austrum et Cedema ad Orientem dicitur.\
"""
