text = """
334 Inter. 278. Quid est quod Jacob dicit: Duo filii tui Effrem et Manasses, sicut Ruben et Simeon erunt mihi (Gen. XLVIII, 5)?-- Resp. Significat: [sicut] Ruben et Simeon duae tribus erunt, et suis vocabulis vocabuntur; sic Effrem et Manasses duae tribus erunt; duos quoque populos procreabunt, et [sic] haereditabunt promissionis terram, sicut et filii mei. Reliquos autem filios, quos post mortem meam genueris, tui erunt: [et] in nomine patrum suorum vocabuntur in haereditate sua; [qui] non accipient separatim terram, nec funiculos habebunt proprios, ut reliquae tribus: In tribu Effrem [ Ms. Effraim] et Manasse quasi appendices populi commiscebuntur.\
"""
