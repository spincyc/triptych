text = """
Interrogationes et responsiones in Genesin (Alcuinus), J. P. Migne1

305 PRAEFATIO ALCUINI.

Dilectissimo in Christo fratri Singuulfo presbytero Alcuinus salutem.

Quia individuus et fidelis mihi, charissime frater, socius tanto tempore [ Al., tantopere] fuisti, et quia te sacrae lectionis studiosissimum esse novi, paucas interrogationes de libro Geneseos, quas, ut recordor, per vices a me exquisisti, pariter congregatas tuo nomini dicavi, ut haberes unde tuam posses memoriam recreare, quae saepe perdit quod servare debet, nisi in thesauro litterarum reconditum teneat, maxime nobis, qui saeculi occupationibus distrahimur, et diversis itinerum molestiis fatigamur. Et quod [ Ms., quia] pondera librorum nobiscum portari nequeunt, ideo aliquoties brevitati studendum est, ut sit levi pondere pretiosa sapientiae margarita, et habeat fessus ex itinere viator quo se recreet, licet ex pondere portantis manus non gravetur. Sunt in eodem libro difficillimae quaestiones plurimae, quas ad praesens tangere non libuit, vel etiam non licuit; vel quod de illis me non interrogasti. Hae etiam maxime historicae sunt et simplici responsione contentae: illae vero majoris inquisitionis, longiorisque tractatus indigent [ Cod. ms., et longiorem habere indigent tractatum]. His tantum, dilectissime frater, esto contentus: et siquid in eis perperam dixerim, tu frater [ Ms., fraterno stylo] nos corrigere studeas; siquid vero bene, non mihi, sed largitori gratias age; qui et te proficere, et me tibi sufficere ex donis suis faciat, sine quo nihil possumus, in quo omnia possibilia sunt credenti; qui creditam suae nobis pecuniae largitionem, in laudem nos et gloriam sui nominis multiplicare faciat.

Interrogatio 1. Quomodo convenit quod in Genesi legitur: Requievit Deus die septimo ab omnibus operibus suis (Gen. II, 2), et in Evangelio. Pater meus usque modo operatur et ego operor (Joan. V, 17)?-- Responsio. Requievit a novarum conditione et creatione creaturarum, non a conditarum gubernatione. Et ideo Deus [tunc] creator in sex dierum creatione putandus est, nunc vero gubernator in totius mundi creaturis [ Ms., naturis].

Inter. 2. Quot creaturas rationales [ Ms., rationabiles] condidit Deus?-- Resp. Duas. Angelos et homines: et coelum angelis, et terram hominibus habitationem.

Inter. 3. Quare angelicum peccatum silentio in Genesi absconditum est et hominis patefactum?-- Resp. Quia angelicum vulnus Deus non praedestinavit curare, hominis vero sanare praedestinavit.\
"""
