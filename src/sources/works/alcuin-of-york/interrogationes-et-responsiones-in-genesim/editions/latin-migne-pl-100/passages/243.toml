text = """
Inter. 243. Quae est causa immutati nominis Jacob, ut Israel vocaretur (Gen. XXXII, 28)?-- Resp. Varia hujus nominis interpretatio aestimatur; sed beatus Hieronymus taliter de ejus interpretatione dixit: sensus itaque hic est: non vocabitur nomen tuum supplantator, hoc est, Jacob; sed vocabitur princeps cum Deo, hoc est, Israel. Quomodo enim ego princeps sum, sic [et] tu, qui mecum luctari potuisti, princeps vocaberis. Si autem cum Deo sive angelo (quoniam plerique varie interpretantur) pugnare potuisti, quanto magis cum hominibus, hoc est, [cum] Esau, [quem] formidare non debes.\
"""
