text = """
Inter. 234. Quomodo pro aspectu virgarum variarum varii pecorum fetus nascebantur (vers. 38)?-- Resp. Observabat Jacob tempora quibus pecora ascendebantur, et post calorem diei ad potandum avida pergebant: discolores virgas hic ponebat in canalibus, et admissis arietibus et hircis in ipsa potandi aviditate oves et capras faciebat ascendi, ut ex duplici desiderio, dum avide bibunt et ascenduntur a maribus, tales fetus conciperent, quales umbras arietum et hircorum desuper ascendentium in aquarum speculo contemplabantur. Ex virgis enim in canalibus positis varius [etiam] erat imaginum color. Nec mirum hanc in conceptu feminarum esse naturam, ut quales perspexerint, sive mente conceperint. in extremo voluptatis aestu, quo concipiunt, talem sobolem procreent, cum hoc ipsum etiam in equarum gregibus apud Hispanos dicatur fieri. Et Quintilianus in ea controversia: in qua accusabatur matrona quaedam, quae Aethiopem pepererat [ Ms., quod . . . pepererit], pro defensione illius argumentetur, in hoc conceptu [ Ms., hanc conceptus] esse naturam, quam supra 329 diximus. Et multa dicuntur similia [ Ms., similiter] fieri in animalium fetibus. [Sed] et mulieri accidisse traditur, ut scriptum reperitur in libris antiquissimi et peritissimi medici Hippocratis, quae suspicione adulterii fuerat punienda, cum pulcherrimum puerum peperisset, utriusque parentis generi [ Ms., utrique parenti generique] dissimilem, nisi memoratus medicus solvisset quaestionem, illis admonitis, quaererent, si forte aliqua talis pictura esset in cubiculo; qua inventa, mulier a suspicione liberata est.\
"""
