text = """
Inter. 235. Quare Jacob primi temporis sua esse voluit, et serotina Laban? vel [ Ms., et] cur hac arte non sua magis omnia esse fecit?-- Resp. Jacob prudens et callidus justitiam et aequitatem in nova arte servabat. Si enim omnes agnos et haedos varios pecora procreassent, erat aliqua suspicio [doli], et aperte huic rei Laban invidus contraiisset. Ergo ita omnia temperavit, ut ipse fructum sui laboris acciperet, et Laban non penitus spoliaretur. Si quando oves et caprae primo tempore ascendebantur, quia vernus est fetus, ante ipsas ponebat virgas, ut varia soboles nasceretur. Quaecunque oves et caprae sero quaerebant mares, ante harum oculos non ponebat, ut unius coloris pecora nascerentur: et quicquid primum nascebatur, suum erat, quia [discolor et] varium erat: quicquid postea, Laban: unius enim, tam nigri quam albi coloris, pecus oriebatur.\
"""
