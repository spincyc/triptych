text = """
Inter. 219.--Quae est [ista] Cethura, aut unde genus duxit [ Ms., ducens]?-- Resp. [Cethura interpretatur copulata, aut vincta; quam ob causam] suspicantur Hebraei 327 eamdem esse Agar quae, Sarra mortua, ex concubina transierit in uxorem [ Al., facta sit uxor]. Et sic videtur [depositi jam] Abrahae aetas excusari, ne senex post mortem uxoris vetulae novis nuptiis arguatur lascivisse. [Fertur] quoque quia filii Abrahae, qui ei de Cethura nati sunt, [occupaverunt terram quae Arabia vocatur, usque ad maris Rubri] littora. Dicitur autem unus ex posteris Abrahae, qui appellatur Asser [ Ms., appellabatur Assur], duxisse adversus Lubian [ Ms., Laban] exercitum, et ibi devictis hostibus consedisse, ejusque posteros ex nomine Atavi Africam nuncupasse. Alios quoque filios Abrahae ex Cethura occupasse Judeae regiones [ Ms., Indiam regionem] aestimatur.\
"""
