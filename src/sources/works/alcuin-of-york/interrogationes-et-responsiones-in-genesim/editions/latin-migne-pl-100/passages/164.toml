text = """
Inter. 164. Quis est iste Melchisedech rex Salem, quem Apostolus dicit sine patre et sine matre esse (Gen. XIV, 18; Hebr. VII, 3) ?-- Resp. Ideo dixit Apostolus eum absque patre et absque matre, quia genealogiam ejus sancta Scriptura non narrat. Aiunt enim Hebraei, hunc Melchisedech mutato nomine Sem esse filium Noe, et supputantes annos vitae ipsius ostendunt, eum usque ad Isaac tempora vixisse; omnesque primogenitos pontifices fuisse, [et] hostias Deo immolasse usque ad tempora Aaron et legis caeremonias; et haec esse primogenita, quae vendidit Esau fratri suo Jacob. Qui etiam Melchisedech jure de triumphis abnepotis [ Ms., nepotis] sui decimas accepisset [ Edit., accepit]. Porro Salem eam ipsam esse volunt, quae postea Jerusalem dicta est. Haec etiam primo Jebus, ut referunt, postea Salem, deinde Jerusalem dicta est. Iste autem Melchisedech figuraliter Christum significat secundum apostolum, quia Christus sine matre in coelis, et sine patre in terris, offerens Deo pro nobis in terris sui corporis panem et sui sanguinis vinum; ad quem dicitur: Tu es sacerdos in aeternum secundum ordinem Melchisedech (Hebr. V, 6; Psal. CIX, 4).\
"""
