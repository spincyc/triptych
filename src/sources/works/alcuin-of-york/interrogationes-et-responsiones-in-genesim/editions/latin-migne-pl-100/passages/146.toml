text = """
Inter. 146. Cui dicit [ Ms., dixit] Deus: Descendamus et confundamus linguas eorum (Gen. XI, 7)?-- Resp. Descendere Dei est humanos actus inspicere, vel eorum sensibus propinquare. Quod vero plurali numero dixit: descendamus, et iterum [singulari] Confudit Deus labium universae terrae, distinctione personarum sanctam Trinitatem, et operationis unitatem in majestate divina voluit ostendere. Sicut in exordio humanae creationis dictum est: Faciamus hominem ad imaginem et similitudinem nostram. Et iterum: Fecit Deus hominem ad similitudinem suam (Gen. I, 26, 27). Ut Trinitas in personis, et unitas in potentia esse credatur.\
"""
