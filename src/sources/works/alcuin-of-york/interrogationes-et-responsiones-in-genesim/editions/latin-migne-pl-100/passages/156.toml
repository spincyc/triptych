text = """
Inter. 156. Quomodo Sarra, cum a Pharaone rapta fuisset, consequens est, ut violata non fuerit (vers. 15)?-- Resp. Quia, juxta librum Esther, quaecunque mulierum placuisset regi apud veteres, sex mensibus ungebatur oleo myrteo, et sex mensibus in pigmentis variis erat et curationibus feminarum, et tunc demum ingrediebatur ad regem (Esther. II, 12). Atque ita potest [ Al., poterat] fieri, ut Sarra, postquam placuerat regi, dum per annum ad regem ei praeparatur introitus, Abrahae Pharao multa donaverit, et Pharao postea percussus sit a Domino, illa adhuc intacta ab ejus concubitu permanente.\
"""
