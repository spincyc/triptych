physical_line_ranges = [[171, 171]]
text = """
Inter. 167. Quid igitur in illo mystico signo de posteritate generis sui Abrahae intelligendum erat? vel cur trium annorum animalia illi erant sumenda? vel cur animalia dividit et volucres non dividit (vers. 9)?-- Resp. Trium [enim] annorum animalia tres temporum articulos designant, quibus populus ad summum honoris culmen adolevit. A temporibus vero patriarchae Abrahae per repromissiones usque ad tempora Moysis conjunctus est Deo. A temporibus autem Moysis legislatoris, a Deo legis acceptione, et miraculorum ostensione, triumphisque et terrae repromissionis ingressione glorificatus; a temporibus vero David regio honore, et templi civitatisque Jerusalem instructione elevatus est. Porro aries regiam et sacerdotalem dignitatem; vacca sub legis littera servientem; capra etiam eamdem gentem peccatricem esse designat. Aves vero spirituales et Dei electos praefigurabant. Divisiones itaque [ Ms., namque] animalium, schismata inter carnales semper esse ostendunt; in eo [vero] quod aves non divisit, pax et unitas spiritualium intelligitur. Quod circa vesperam pavor irruit super Abraham, terrorem significat in die judicii, qui separabit spiritales a carnalibus, alios statuens ad dextram, alios ad sinistram (Matth. XXV). Aves vero quae super cadavera volitant, daemonia [ Ms., daemoniacae potestates] sunt, quae carnalibus insidere quaerunt: quas devotus doctor sedula admonitione abigere debet.\
"""
