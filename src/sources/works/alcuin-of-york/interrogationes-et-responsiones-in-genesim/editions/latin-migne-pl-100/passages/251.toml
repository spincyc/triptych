text = """
Inter. 251. Quid est quod de Isaac dicitur: Et consumptus aetate mortuus est, et appositus populo suo (Gen. XXXV, 29)? Quomodo consumptus, vel cui populo appositus? 331 -- Resp. Consumptus aetate, id est, perfectus aetate. Verum angelorum populo vel sanctarum animarum apponuntur, qui hanc vitam Deo placentes finiunt. Tunc dicuntur apponi, quando nulla jam remanet sollicitudo tentationum, et periculum peccatorum. Quod intuens Scriptura ait: Ante mortem ne laudes hominem quemquam (Eccli. XI, 30).\
"""
