physical_line_ranges = [[119, 119]]
text = """
Inter. 115. Quid de piscibus vel alitibus [ Ms., volatilia], quae in aquis vel super aquas vivere possunt, intelligi debet; si in arca essent, an non; vel de sectibilibus minutissimis, quales [sunt] sciniphes et muscae et caetera talia?-- Resp. Hanc [vero] quaestionem sanctus Augustinus, libro XV (Cap. 27, num. 4) De Civitate Dei, ita solvit: « Quaeri solet de minutissimis bestiolis, non solum quales sunt mures et stelliones, verum etiam quales locustae, scarabaei, muscae denique et pulices, utrum non ampliori numero in arca illa fuerint, quam qui est definitus cum hoc imperaret Deus. Prius admonendi sunt quos haec movent, sic accipiendum quod dictum est: Quae reptant [Ms., repunt] super terram (Gen. VI, 20); ut necesse non fuerit conservari in arca, quae possunt in aquis vivere, non 314 solum mersa, sicut pisces, verum etiam supernatantia sicut multae alites. Deinde cum dicitur, Masculus et femina [erunt], profecto intelligitur ad reparandum [sexum]. Quis non videat quantum [ad genus ( Edit., quantum genus dici per hoc potest. Nec) dicitur pertinere ( Apud S. Aug. l. cit.: ad reparandum genus dici, ac per hoc); ac per hoc nec] illa necesse fuerat ibi esse, quae possunt sine concubitu de quibusque rebus vel rerum corruptionibus nasci; vel si fuerunt sicut in domibus consueverunt esse, sine ullo numero definito esse potuisse. Aut si mysterium sacratissimum quod agebatur, et tantae rei figura etiam veritate facti aliter non posset impleri, nisi ut omnia ibi certo illo numero essent, quae vivere in aquis, illius natura prohibente, non possent, non fuit ista cura illius hominis vel illorum hominum, sed divina. Non enim ea Noe capiens intromittebat, sed venientia et intrantia permittebat. Ad hoc enim valet quod dictum est, intrabunt ad te, scilicet non in hominis actu, sed Dei [ Ms., divino] nutu. »\
"""
