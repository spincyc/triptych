text = """
Inter. 178. Quaeritur, cum tres viri essent, qui Abrahae apparuerunt, quomodo singulariter Dominum appellat dicens: Domine, si inveni gratiam ante te (vers. 3)?-- Resp. Igitur in angelis Dominum sentiens, Domino potius, quam angelis loqui elegit. Et quidem aliquando imaginibus, et ante corporeos oculos, ad tempus ex aere assumptis per angelos loquitur Deus, sicut nunc Abraham non solum tres viros videre potuit, sed etiam terreno habitaculo recipere et eorum usibus etiam cibos adhibere. Nisi enim angeli, cum quaedam nobis in terra nuntiant, ad tempus ex aere corpus assumerent, exterioribus profecto nostris obtutibus non apparerent. Nec cibos cum Abraham sumerent, nisi propter nos solidum aliquid ex coelesti elemento gestarent. Nec mirum quod illi ipsi qui suscepti sunt, modo angeli, modo Dominus [ Edit., Domini] vocantur; quia angelorum vocabulo exprimuntur, qui exterius ministrabant, et appellatione Domini ostenditur, qui eis interius praeerat: ut per hoc praesidentis imperium, et per illud claresceret officium ministrantium.\
"""
