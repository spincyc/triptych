text = """
Inter. 275. Quaeritur quomodo in terra Aegypti pascua pecoribus inveniri potuerunt, cum ea terra pluviis non irrigatur; et fratres Joseph ideo terram Chanaan reliquisse [se] dicunt, quod herbas gregibus suis non invenissent (Gen. XLVII, 4)?-- Resp. Perhibetur ab eis qui loca sciunt, in multis Aegypti paludibus potuisse pascua non deesse, etiam cum fames esset frumentorum, quae solent Nili fluminis inundatione provenire. Magis enim dicuntur paludes illae feraces [ Ms., feracius] pascua gignere, quando aqua Nili minus excrescit.\
