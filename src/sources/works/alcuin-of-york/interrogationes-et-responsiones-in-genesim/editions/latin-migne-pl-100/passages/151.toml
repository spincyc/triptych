text = """
Inter. 151. Si Deus requievit ab omnibus operibus suis in die septimo, unde subito tanta apparuit diversitas linguarum?-- Resp. Non in hac divisione linguarum novum quid condere Creatorem aestimatur, sed dicendi modos et formas in diversis loquelarum [ Ms., linguarum] generibus divisit. Unde easdem syllabas et ejusdem potestatis litteras, [licet] aliter conjunctas, in diversis gentium linguis inveniemus; saepe etiam [et] eadem nomina vel verba aliud quid significantia in alia lingua, atque aliud in alia. Ubi dicimus in Psalmo: In virga ferrea (Psal. II, 9), in Graeco habetur, ἐν ῥάβδῳ σιδηρᾷ. Igitur in Latino sidera non ferrea significat sicut in Graeco, sed astra.\
"""
