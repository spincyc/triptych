text = """
Inter. 208. Vocavit [autem] angelus Domini Abraham secundo de coelo dicens: Quia fecisti rem hanc et non pepercisti filio tuo unigenito propter me (Ibid., v. 16). Nunquid Abraham propter angelum non pepercit filio suo, et non propter Deum?-- Resp. [Aut enim] angeli nomine Dominus Christus significatus est, qui sine dubio Deus est, et manifeste a propheta dictus est, magni consilii angelus. Aut [quia] Deus [erat] in angelo; et [ Edit., aut] ex persona Dei angelus loquebatur, sicut in prophetis etiam fieri solet. Nam in consequentibus hoc magis videtur apparere, ubi legitur: [ Et] vocavit angelus Domini Abraham iterum de coelo, dicens: Per memetipsum juravi, dicit Dominus.\
"""
