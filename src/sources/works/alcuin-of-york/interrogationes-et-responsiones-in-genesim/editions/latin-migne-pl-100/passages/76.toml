Inter. 76. Quid est semen mulieris, vel [semen] serpentis (vers. 7)?-- Resp. Semen mulieris est totum genus humanum; semen serpentis, originalis peccati primordium: quae duo semina ex praecepto divino continuum inter se odium gerere debent, ut non faciamus quae diabolus vult, quia ille nunquam vult nobis profutura.\
