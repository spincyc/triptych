text = """
Inter. 105. Qualem ergo arcae speciem vel formam debemus intelligere (vers. 15)?-- Resp. Ut videtur habuit quatuor angulos ex imo assurgentes, et iisdem paulatim usque ad summum in angustum attractis in spatium unius cubiti fuit collecta [ Ms., ut videtur quatuor angulis eam ex imo adsurgentem . . . fuisse collectam]. Sic [enim] refertur quod in fundamentis trecenti cubiti in longitudine et in latitudine quinquaginta sint; et in altitudine triginta, sed collecta in cacumen angustum, ita ut cubitus sit longitudinis et latitudinis. Et vere nulla potuit tam conveniens et congrua arcae species dari, quam ut summo velut [e] tecto quodam angusto culmen [ Ms., culmine] diffunderet imbrium ruinas, et ima in aquis quadrata stabilitate consistens nec impulsu ventorum, nec impetu fluctuum, nec inquietudine animalium, quae intrinsecus erant, aut inclinari posset, aut mergi.\
"""
