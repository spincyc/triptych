text = """
Inter. 273. Filii Jacob interrogati quid operis haberent, responderunt: Pastores ovium sumus, sicut et patres nostri (Gen. XLVII, 3). Quare patriarchas primos, pastores ovium, et non [reges] gentium fuisse legimus?-- Resp. Quia sine ulla dubitatione justa servitus, et justa est dominatio, cum pecora homini serviunt, et homo pecoribus dominatur. Sic enim dictum est homini cum crearetur: Faciamus hominem ad imaginem et similitudinem nostram, et habeat potestatem piscium maris et volatilium coeli, et omnium quae sunt super terram (Gen. I). Ubi insinuatur rationem debere dominari irrationali vitae. Servum autem hominem homini vel iniquitas fecit, vel adversitas. Iniquitas quidem, sicut dictum est: Maledictus Chanaan, erit servus fratribus suis (Gen. IX, 25). Adversitas vero, sicut accidit ipsi Joseph, ut venditus a fratribus servus alienigenae fieret. Itaque primos servos, quibus hoc nomen in Latina lingua inductum est, bella fecerunt; cum [ Ms., qui] enim homo ab homine superatus, jure belli possit occidi, quia servatus est, servus est appellatus. Inde et mancipia, quia [sunt] manu capta.\
"""
