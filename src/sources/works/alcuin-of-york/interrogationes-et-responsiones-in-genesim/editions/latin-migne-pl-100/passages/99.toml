text = """
Inter. 99. Quid est, quod Deus dicit: Poenitet me fecisse hominem. Et iterum: Tactus dolore cordis [sui] intrinsecus (vers. 6). Nunquid in Deum poenitentia aut dolor cordis cadere potest?-- Resp. Non Deum de facto suo poenitet, nec [ Ms., aut] dolet Deus sicut homo, cui est de omnibus rebus tam fixa sententia, quam certa praescientia: sed utitur Scriptura sancta usitatis nobis verbis intelligibilibus, ut coaptet se nostrae parvitati, quatenus ex cognitis incognita cognoscamus.\
"""
