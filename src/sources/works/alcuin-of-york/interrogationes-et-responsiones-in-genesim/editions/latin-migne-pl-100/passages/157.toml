text = """
Inter. 157. Utrum convenerit Abrahae tam sancto viro, ut celaret Sarram esse uxorem suam, et non magis poneret in Deo spem suam, ne occideretur a rege (Gen. XII, 13) ?-- Resp. Ostenditur [enim] in isto ejus facto quod homo non debet tentare Dominum Deum suum, quando habet quid faciat ex rationabili consilio. Fecit enim quod potuit pro vita sua; quod autem non potuit, illi commisit in quem speravit, cui etiam pudicitiam conjugis commendavit. Nec enim fides [ac spes] fefellit. Namque Pharao a Deo territus multisque propter eum [ Ms., eam] malis afflictus, ubi ejus uxorem [divinitus] esse didicit, illaesam cum honore reddidit viro suo.\
"""
