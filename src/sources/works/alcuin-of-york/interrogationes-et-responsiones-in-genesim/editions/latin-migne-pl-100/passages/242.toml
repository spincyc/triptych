physical_line_ranges = [[246, 246]]
text = """
Inter. 242. Quomodo ergo Jacob ab eo postulat benedici, cui luctando praevaluit (vers. 26)?-- Resp. Magna [haec] est de Christo prophetia. Duplex enim 330 [hic] Jacob intelligitur, id est, carnalis et spiritualis. Praevaluit enim Jacob Christo, vel potius praevalere visus est super eos Israelitas, a quibus crucifixus est Christus; et ab eo benedicitur [Israeliticus] in eis qui crediderunt in Christum; ex quibus erat qui dicebat: Et ego Israelita ex genere Abrahae, ex tribu Benjamin (Rom. XI, 1). Unus ergo atque idem Jacob et claudus et benedictus: claudus in latitudine femoris, tanquam in multitudine generis, de quo dictum est: et claudicaverunt a semitis suis (Psal. XVII, 26). Benedictus autem in eis, de quibus dictum est: Reliquiae per electionem gratiae salvae factae sunt (Rom. XII, 5).\
"""
