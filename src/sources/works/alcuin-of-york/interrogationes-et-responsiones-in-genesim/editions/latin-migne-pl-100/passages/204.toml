text = """
Inter. 204. Et cur non statim licuit ei occidere filium, sed triduana itineris mora, eum immolaturus, secum ducere jussus est?-- Resp. Quatenus longitudine temporis, tentationis quoque augeretur incrementum. Nam per triduum iter protenditur, et per totum triduum crescentibus curis paterna viscera cruciantur: ut omni hoc spatio tam prolixo intueretur filium pater, cibum cum eo sumeret, ut [tot] noctibus puer penderet in amplexibus patris, inhaereret pectori, cubitaret in gremio; quatenus per singula momenta in paterno affectu dolor occidendi filii accumularetur.\
"""
