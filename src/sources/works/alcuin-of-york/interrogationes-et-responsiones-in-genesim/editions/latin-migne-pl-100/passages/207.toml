text = """
Inter. 207. Quare appellavit Abraham nomen loci illius: Dominus vidit (Ibid. v. 14); cum nusquam sit quod Dominus non videat?-- Resp. Vidit pro apparuit dixit: hoc est, videri fecit, sicut ibi: Et nunc cognovi quia times Deum, id est, feci ut cognoscaris [ Ms., cognoscatur; al., cognoscar], eo genere locutionis, dum per efficientem significatur id quod efficitur: sicut pigrum frigus dicimus, eo quod [pigros] faciat. Illud autem quod dixit: Unde usque hodie dicitur Dominus in montem videbit. Exinde apud Hebraeos proverbium venit [ Ms., exiit] ut si quando in angustia constituti sunt, [et] Domini quoque optant auxilio sublevari, dicunt: In monte Dominus videbit, hoc est, sicut Abrahae, miserebitur et nostri. Unde et in signum dati arietis solent etiam nunc cornu clangere.\
"""
