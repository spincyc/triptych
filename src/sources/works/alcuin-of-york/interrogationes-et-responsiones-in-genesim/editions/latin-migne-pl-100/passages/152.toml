text = """
Inter. 152. Quid est quod legitur de Aran fratre Abraham: Mortuus est Aran ante Thare patrem suum in Ur Chaldaeorum (Gen. XI, 28)?-- Resp. Ur [vero] ignis dicitur, et Chaldaei ignem colunt pro Deo; Thare vero, ut Hebraei tradunt, cum filiis suis in ignem missus est a Chaldaeis, quia ignem adorare nolebat, in quo igne Aran consumptus est. Et hoc est quod nunc dicitur: Mortuus est ante conspectum Thare patris sui, sicut Hieronymus in Libro Hebraicarum Quaestionum refert (Patr. tom. XXIII, col. 957), ita dicens: « Vera est [igitur] Hebraeorum illa traditio, quod egressus est Thare cum filiis suis de igne Chaldaeorum, et quod Abraham Babylonio vallatus incendio, quia illud adorare nolebat, Dei sit auxilio liberatus. Et ex illo tempore ei dies vitae et tempus reputatur aetatis, ex quo confessus est Deum spernens idola Chaldaeorum. » Et ita solvitur obscurissima quaestio de Abraham. Legitur enim Thare cum septuaginta [ Ms. LXXV] esset annorum, genuisse Abraham, et vixisse, postquam genuit Abraham, centum triginta quinque annos, et fuisse omnes [dies] Thare ducenti quinque anni. Item legimus in Genesi: Erat autem Abraham septuaginta quinque annorum, cum egressus esset ex Charra (Gen. XII, 4); videlicet mortuo patre ejus Thare. Igitur ab anno nativitatis Abraham, usque ad annum, quo egressus est ex Charra, anni sunt centum triginta quinque: sed ei non computantur anni qui transacti sunt antequam exiret de igne Chaldaeorum Dei liberatus protectione. Haec Hieronymus.\
"""
