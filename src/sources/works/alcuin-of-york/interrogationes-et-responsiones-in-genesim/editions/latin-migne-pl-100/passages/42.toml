text = """
Inter. 42. Quid est quod legitur [ Ms., dixit]: Requievit Deus die septimo ab omnibus operibus suis (Gen. II, 2) ?-- Resp. Si [enim] dividas septenarium numerum in unum et sex, erunt duo primi numeri perfecti: unitas vero in seipsa natura et potestate perfecta est; senarius vero numerus primus opere et actu perfectus est, et partibus suis impletur: nam unum, duo, tria faciunt sex. Significatur ergo [ Ms., vero] [in] requie diei septimi, quod Deus ante creationem mundi in seipso natura et potestate perfectus est, et aeternaliter in seipso habet requiem; creaturae vero actu ab ipso creationis accepto habent per ipsum in suis naturis perfectionem quamdam, et [ Ms. omittit et] requiem in operatione 308 obedientiae, et maxime rationabiles creaturae in [ Ms. om. in] eo bono beatae sunt, ut in conditore suo requiescant.\
"""
