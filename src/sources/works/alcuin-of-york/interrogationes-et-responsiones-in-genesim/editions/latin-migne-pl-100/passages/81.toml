text = """
Inter. 81. Quomodo Dominus Deus dixit de homine post peccatum: Ecce Adam factus est quasi unus ex nobis (vers. 22)?-- Resp. Propter sanctam Trinitatem plurali numero dixit ex nobis; sicut et in creatione ejus: Faciamus hominem ad imaginem (Gen. I, 26). Hic utitur voce deterrentis, ad incutiendum aliis, ne peccarent, timorem; vel sensu exprobrantis, quia non solum non fuerat factus qualis fieri voluerit, sed nec illud quod factus fuerat, conservaverit.\
"""
