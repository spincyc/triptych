text = """
Inter. 145. Quomodo Nemroth gigas venator robustus contra Dominum dicitur (Gen. X, 8, 9)?-- Resp. Id est, hominum terrenorum suppressor et exstinctor. Erigebat ergo cum suis populis turrem contra Dominum, in qua est impia significata superbia. [Quoniam dominatio imperantis in lingua est, ibi est dominata superbia] ut non intelligeretur jubens homini, qui noluit intelligere ut obediret Deo jubenti. Sic illa conjuratio dissoluta est, cum quisque ab eo quem non intelligebat, abscederet; nec se, nisi ei cum quo loqui poterat, aggregaret. Itaque per linguas divisae sunt gentes dispersaeque per terras.\
"""
