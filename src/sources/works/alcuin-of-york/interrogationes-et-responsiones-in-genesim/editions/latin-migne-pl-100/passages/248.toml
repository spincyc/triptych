text = """
Inter. 248. Quare secundo dicitur ad Jacob (vers. 10): Non vocaberis Jacob, sed Israel erit nomen tuum: et appellavit eum Israel?--Resp. Dudum nequaquam ei ab angelo nomen imponitur, sed quod imponendum sit ei a Deo praedicitur. Quod igitur [ibi] futurum promittitur, hinc dicitur expletum. Nimirum nomen hoc ad illam recte intelligitur pertinere promissionem, ubi sic videbitur Deus, quomodo non est ante a patribus suis visus.\
"""
