physical_line_ranges = [[172, 172]]
text = """
Inter. 168. Quid est quod dictum est ad Abraham: Scito praenoscens, quod peregrinum futurum sit semen tuum in terra non sua, et subjicient eos servituti [et] affligent quadringentis annis (vers. 13). Unde isti quadringenti anni computati sunt servitutis.-- Resp. Non sic accipiendum est, tanquam in illa durissima servitute quadringentos annos Dei populus fuerit, sed quia scriptum est: In Isaac vocabitur tibi semen (Gen. XXI, 12). Ex anno nativitatis Isaac usque ad annum egressionis ex Aegypto computantur anni quadringenti quinque. Cum ergo de quadringentis triginta detraxeris viginti quinque, qui sunt a promissione usque ad natum Isaac, non mirum est si quadringentos et quinque annos summa solida quadringentos voluit appellare Scriptura, quae solet tempora ita nuncupare, ut quod de summa perfectionis numeri paululum excrescit, aut infra est, non computetur. Non itaque, quod ait, in servitutem redigent eos et nocebunt illis, ad quadringentos annos referendum est, tanquam per tot annos 320 eos habuerint in servitute: sed referendi sunt quadringenti anni ad id quod dictum est: Peregrinum erit semen tuum in terra non propria; quia sive in terra Chanaan, sive in Aegypto peregrinum erat illud semen, antequam haereditate sumerent terram ex promissione Dei, quod factum est postquam ex Aegypto liberati sunt, ut hyperbaton hic intelligatur, et ordo sit verborum: Sciendo scies, quia peregrinum erit semen tuum in terra non propria quadringentis annis. Illud autem interpositum intelligatur: Et in servitutem redigent eos, et nocebunt illis, ita ut ad quadringentos annos ista interpositio non pertineat. In extrema enim parte [annorum] summae hujus, hoc est [ Ms., hoc interest], post mortem Joseph, factum est ut in Aegypto populus Dei duram perageret servitutem.\
"""
