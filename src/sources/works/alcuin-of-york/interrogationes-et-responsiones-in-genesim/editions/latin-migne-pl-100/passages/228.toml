text = """
Inter. 228. Si viri justi voluntas bona est, quid est quod Isaac non Esau, quem voluit, sed Jacob, quem noluit, benedixit?-- Resp. Justi hominis, quantum ad conscientiam pertinet, voluntas bona est; quantum autem ad praescientiam [ Ms., praesentiam] immunis est ab adversis. Deus enim solus est qui de futuris judicat. Ac per hoc Isaac justus, quantum ad praesentem statum [ Ms., humanitatem] pertinet, dignum esse majorem filium benedictione putabat [magis]. Sed Deus, occultorum cognitor, minorem mereri benedictionem ostendit, [ut in benedictione non hominis ostenderit esse beneficium, sed Dei ( Edit., ut benedictionem non hominis, sed Dei ostenderet)]. Ideo dictum est in Numeris ad Moysen et Aaron sacerdotem: Ponite nomen meum super filios Israel, ego Dominus benedicam eos (Num. VI, 27). Sacerdotis est benedicere, Dei est effectum tribuere benedictionis. Unde intellexit Isaac per spiritum prophetiae, a Deo benedictionem super minorem filium praedestinatam, dicens: Benedixi ei, et erit benedictus (Gen. XXVII, 33).\
"""
