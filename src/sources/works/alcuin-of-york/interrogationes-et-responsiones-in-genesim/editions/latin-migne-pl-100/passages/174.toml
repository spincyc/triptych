text = """
Inter. 174. Quare Abraham circumcisionem accepit (vers. 24) ?-- Resp. Idcirco Abrahae commendata [ Ms., data] est circumcisio, ut sub lege esset, sicut [et] Adam, ne de ligno manducaret, ut comprobaretur, si compleret hoc, an non? Credens enim filium se habiturum, per cujus generationem omnibus gentibus benedictio futura esset, et in cujus nepotibus castitatis et sobrietatis unicum mansisset exemplar: unde in ea parte corporis signum fidei accepit, unde [et] filius fidei [ Edit., Dei], non carnis nasciturus erat; nec truncata corporis parte deformior, sed fidei in Deum signo gloriosior. Igitur pro Deo aliquid perdere lucrum est, non damnum. Ita Abraham fidei suae signum accipiens non deformatus est, sed melioratus. Si enim Adam pactum Dei custodisset, Abraham hoc pactum non accepisset. Sed quia ille in hoc membro culpam inobedientiae primo agnovit, decuit ut iste in hoc membro signum obedientiae secundo [ Al., secundus] acciperet; ut ostenderetur obedientes quandoque generasse filios ad vitam, dum olim praevaricatores generarunt ad mortem.\
"""
