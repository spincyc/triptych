text = """
Inter. 280. Quae est pars una quam Jacob dedit Joseph filio suo [extra fratres suos], quam tulisse se de manu Amorrhaeorum dicit in gladio et arcu suo (vers. 22) ?-- Resp. Significavit urbem, quae Hebraice Sichem dicitur, et secundum Graecam et Latinam declinationem Sichima appellatur; et corrupte a plurimis Sichar nominatur: quae et [ Al., ut] nunc Neapolis urbs Samaritanorum dicitur. Sichem [in] Hebraea lingua transfertur in humerum [ Al., numerum], unde Septuaginta [praecipue] interpretati sunt. Quod autem dicit se eam [ Ms., jam] in arcu et gladio possedisse, arcum hic et gladium justitiam vocat, per quam meruit, peregrinus et advena, interfecto Sichem et Emor, de periculo liberari. Timuit [enim], quod supra legimus, ne vicina oppida atque castella ob eversionem foederatae urbis adversum se consurgerent, et Dominus non dedit eis ut nocerent illi. [Vel certe sic intelligendum: dabo tibi Sichimam, quam in fortitudine mea, hoc est, in pecunia, quam multo labore et sudore quaesivi. Quod autem ait: super fratres tuos, ostendit, absque sorte eam dedisse tribui Joseph, et mausoleum ejus ibi hodieque cernitur.]

DE BENEDICTIONIBUS PATRIARCHARUM. Inter. 231. Quid intelligendum est de benedictionibus quibus Jacob patriarcha benedixit filios suos: an historice vel allegorice intelligendae sunt, dum dixit: Congregamini filii Jacob [audite, Israel, patrem vestrum], ut annuntiem vobis quae ventura sunt in novissimis diebus (Gen. XLIX, 1); et videtur ex his verbis magis allegoriam sonare quam historiam?-- Resp. Utrumque [vero] et historiam et allegoriam. Historiam, de divisione terrae promissionis, quae [divisiones] dividendae erant nepotibus illorum. Item allegoriam, de Christo et Ecclesia in novissimis quid futurum [ Ms., futuram] temporibus. Sed prius historiae fundamenta ponenda sunt, ut aptius allegoriae culmen priori structurae superponatur.

Ruben primogenitus meus, tu fortitudo mea, principium doloris mei, prior in donis [major imperio], effusus es sicut aqua, non crescas: [quia] ascendisti cubile patris tui, et maculasti stratum ejus (vers. 3, 4). Est autem hic sensus: tu es primogenitus meus, major in libris, et debebas, juxta ordinem nativitatis tuae, haereditatem, quae primogenitis jure debebatur, habere, nempe sacerdotium accipere et regnum [hoc quippe in portando onere [ Al., honore] et praevalido robore demonstratur]. Verum quia peccasti, et quasi aqua, [quae] vasculo non tenetur, voluptatis [ Ms., voluntatis] effusus es impetu, idcirco praecipio tibi ut ultro non pecces, sisque in fratrum numero poenas peccati lugens [ Al., luens], quod primogeniti ordinem perdidisti: principium autem doloris est omnis primogenitus, quia pro eo primum commoventur viscera parentum.

Simeon et Levi fratres, vasa iniquitatis bellantia, in consilium eorum ne veniat anima mea et in coetu illorum non sit gloria mea; quia in furore suo occiderunt [virum] et in voluntate sua suffoderunt murum. Maledictus furor eorum, quia pertinax, et indignatio illorum, quia dura. Dividam eos in Jacob, et dispergam illos in Israel (vers. 5-7). Significat autem non sui fuisse consilii, quod Sichem et Emor 335 foederatos viros interficerent [ Al., interfecerunt], et [quia] contra fas, in pacis et amicitiarum tempore sanguinem fuderunt innocentum, et quasi quodam furore sic crudelitate repleti [ Al., raptati] muros hospitae urbis everterunt [ Ms., everterent] (Gen. XXXIV). Unde dicit: Maledictus furor eorum, quia pertinax et reliqua. Et dispergam eos in Israel. Levi enim haereditatem propriam non accepit, sed in omnibus sceptris paucas urbes ad habitandum [ Edit., inhabitandas] habuit. De Simeone vero in libro Jesu (XIX, 1, 2) scriptum est, quod et ipse proprium funiculum non acceperit, sed de tribu Juda quiddam habuerit.

Juda te laudabunt fratres tui, manus tuae in cervicibus inimicorum tuorum: adorabunt te filii patris tui. Catulus leonis Juda, ad praedam, fili mi, ascendisti (Gen. XLIX, 8, 9). Sive, ut in Hebraeo scriptum est: de captivitate, fili mi, ascendisti: requiescens accubuisti ut leo, et quasi leaena quis suscitabit eum? Quia Juda confessio sive laus interpretatur, recte scribitur: Juda confitebuntur tibi fratres tui, vel laudabunt te. Et licet de Christo grande sit mysterium, tamen secundum litteram significat quod per stirpem David generantur reges, et quod adorarent eum omnes tribus. Non enim ait, filii matris tuae, sed, filii patris tui. Et quod sequitur: Ad praedam, fili mi, ascendisti, ostendit eum captivos populos ducturum esse, et juxta intelligentiam sacratiorem, Christum ascendisse in altum, et captivam duxisse captivitatem (Ephes. IV, 58); sive, quod melius puto, captivitas passionem ascensus resurrectionem significat. Alligans ad vineam pullum suum et ad vitem asinam suam (Gen. XLIX, 11). Quod videlicet pullum asinae, cui supersedit Jesus, hoc est, gentilium populum, vineae apostolorum, qui ex Judaeis sunt, copulaverit, et ad vitem, sive, ut in Hebraeo habetur [ad Soreth], id est, electam vitem alligaverit asinam, cui supersedit, Ecclesia ex nationibus congregata. Quod autem dicit: Fili mi; conversio est ἀποστροφὴ ad ipsum Judam [ Al., conversionem ad Christum de ipso Juda facit], quod Christus haec omnia sit facturus. Quod autem ait: Non auferetur sceptrum de Juda et dux de femore ejus donec veniat ille, qui mittendus est; et ipse erit exspectatio gentium. Significat, quod non deficerent principes de tribu Juda, usque ad tempus, quo natus est Christus, qui missus a Patre exspectatio est gentium.

[ Zabulon in littore maris habitabit, et in statione navium, pertingens usque ad Sidonem.] Isachar asinus fortis, accubans inter terminos, vidit requiem, quod esset bona, et terram quod optima, et supposuit humerum suum ad portandum, factusque est tributis serviens (vers. 13). [Quia] supra de Zabulon dixerat; [quod] maris magni littora esset possessurus; Sidonem quoque et reliquas [Phoenices] urbes [contingeret], nunc ad mediterraneam provinciam redit; et Isachar, quae [ Al., qui] juxta Nephtalim est pulcherrimam [in Galilaea] regionem possessurus est, benedictione sua habitatorem fecit. Asinum autem osseum vel fortem vocat, et humerum [dicit supposuisse] ad portandum, quia in labore terrae et vehendis ad mare [oneribus], quae in finibus suis nascebantur, plurimum laboraret, regibus quoque tributa comportans. Aiunt Hebraei, per metaphoram significari, quod Scripturas sanctas die ac nocte meditans studium suum dederit ad laborandum, et idcirco ei omnes serviunt, quasi magistro dona portantes.

Dan judicabit populum suum, sicut alia tribus in Israel. Fiat Dan coluber in via, cerastes in semita, mordens ungulas equi, ut cadat ascensor ejus retro (Gen. XLIX, 16-18). Salutare tuum exspectabo, Domine. Samson judex in Israel de tribu Dan fuit. Hoc ergo nunc dicit videns in spiritu, comam nutrire Samson Nazaraeum, et de caesis hostibus triumphare: quod in similitudinem colubri regulique obsidentis vias, nullum per terram Israel transire permittat; sed etiam si quis temerarius virtute sua, quasi velocitate equi confisus, eam voluerit praedonis more populari, non illum effugere valebit. Totum autem per metaphoram serpentis et equitis loquitur [ Edit., quod loquitur, ad formam serpentis et equi pertinet]. Videns ergo [ Ms., autem] tam fortem Nazaraeum tuum, quod ipse propter [ Edit., per] meretricem mortuus est, et moriens nostros occidit inimicos, putavi, o Deus! ipsum esse Christum Filium tuum; verum quia mortuus est, et non resurrexit, et rursum ductus captus est Israel, alius mihi Salvator [ Ed., verum, qui mortuus est et resurrexit, ille igitur mihi salvator, etc.] mundi et mei generis praestolandus est, ut veniat, cui repositum est, et ipse erit exspectatio gentium.

336 Gad accinctus praeliabitur ante eum, et ipse accingetur retrorsum, (vers. 19) significat, quod ante Ruben, et dimidiam tribum Manasse, et filios, quos trans Jordanem [ Ms., filios suos trans Jordanem] in possessionem dimiserat, post quatuordecim annos revertens, praelium adversum eos gentium vicinarum grande reperit et victis hostibus fortiter dimicavit. Lege librum Jesu Nave (XIII, 7) et Paralipomenon (I, V, 1, 11).

Nephtalim cervus emissus, dans eloquia pulchritudinis sive Nephtalim ager irriguus (Gen. XLIX, 21). Utrumque enim significat Hebraeum verbum Aiala Selvha [ Edit., Silvam]. Significat autem quod aquae calidae in ipsa nascuntur tribu, sive quod super lacum Genesar fluenta [ Al., fluento] Jordanis esset irriguus. Hebraei autem volunt propter Tiberiadem, quae legis videbatur habere notitiam, agrum irriguum hic intelligi eloquia pulchritudinis prophetarum [ Ms., irriguum et eloquia pulchritudinis prophetari]. Cervus autem emissus temporaneas fruges et velocitatem terrae uberioris ostendit. Sed melius, si ad doctrinam Salvatoris cuncta referamus, quod ibi vel maxime docuerit Salvator, ut in Evangelio quoque scriptum est (Matth. IV, 15).

Filius meus accrescens Joseph, filius meus accrescens et decorus aspectu. Filiae decurrerunt super murum, sed exasperaverunt eum, et jurgati sunt, invidiaeque [Ita Ms.; Al. invideruntque illi] habentes jacula. Sedit in forti arcus ejus, et dissoluta sunt vincula brachiorum et manuum ejus per manus potentis Jacob. Inde pastor egressus est, lapis Israel (Gen. XLIX, 22-24). O fili Joseph, qui tam pulcher es, ut te tota de muris et turribus, ac fenestris puellarum Aegypti turba prospectaret [ Ms., prospectet]; inviderunt tibi [et te ad iracundiam provocaverunt] fratres tui, habentes livoris sagittas et zeli jaculis vulnerati: verum [tu] arcum tuum et arma pugnandi posuisti in Deo, qui fortis est propugnator; et vincula tua, quibus te fratres ligaverunt, ab ipso soluta sunt et disrupta. Ut ex tuo semine tribus nascatur Effraim fortis, stabilis, et instar lapidis durioris invicta, imperans [quoque] decem tribubus Israel.

Benjamin lupus rapax, mane comedit praedam et vespere dividet spolia (vers. 27). Quam de Paulo apostolo manifestissima sit prophetia omnibus patet. In adolescentia enim persecutus est Ecclesiam (Act. VIII, 3); in senectute praedicator Evangelii factus est (Gal. I, 13). Hebraei autem ita dixerunt [ Ms., disserunt]: altare in quo immolabantur hostiae, et victimarum sanguis in basim illius fundebatur, in parte tribus Benjamin fuit [ Al., fuisse]: Hoc inquiunt, ergo significat quod sacerdotes immolant mane hostias, ad vesperam dividunt ea, quae sibi a populo ex lege collecta sunt, lupum sanguinarium, lupum voracem super altaris interpretatione ponentes, et spoliarum divisionem super sacerdotibus, qui servientes altari vivunt de altari [Hucusque ex Hieronymo]. Haec hactenus [ Ms., autem] historice.

Spiritualiter autem [in] Ruben prioris populi Judaeorum ostendit personam, cui a Domino per prophetam dicitur: Israel primogenitus meus (Gen. XLIX, 3). Etenim juxta quod primogenitis debebatur, ipsius erat accipere sacerdotium et regnum. Additur: Tu virtus mea. Utique quod huic populo fundamentum fidei ex ipsa virtute Dei [ Ms., quia ex ipso populo fundamentum fidei; ex ipso virtus Dei], qui est Christus, advenit. Quomodo autem ipse sit principium dolorum, nisi dum Patri Deo semper irrogat injurias, convertens ad eum dorsum [et] non faciem? Iste prior in donis, quia ipsi primum credita sunt eloquia Dei, et legislatio, et testamentum [sive promissio]. Iste major imperio, utique pro magnitudine virium, quia copiosius caeteris in hoc saeculo regnavit [ Ed., Deum negavit, mendose ]. Effusus est autem sicut aqua, peccando in Christo, quae vasculo non tenetur; voluntatis [ Al., voluptatis] effusus est impetu: et idcirco addidit ultra non crescas. [Quia peccavit, et Christum negavit], quapropter ipse postquam in universum orbem dispersus est, valde imminutus est. Sed quare talia meruit, ita subjecit: quia ascendisti cubile patris tui, et maculasti stratum ejus; quando [ Edit., quoniam] corpus Dominicum, in quo plenitudo Divinitatis requiescebat, raptum in cruce suspendit, et ferro commaculavit.

Simeon et Levi fratres vasa iniquitatis bellantia (vers. 5). Per Simeonem et Levi scribae, et Pharisaei, et sacerdotes Judaici populi intelliguntur. De Simeone enim scribae erant Judaeorum; de tribu vero Levi principes sacerdotum, 337 qui consilium fecerunt, ut Jesum dolo tenerent et occiderent. De quo concilio dicit: In concilium eorum ne veniat anima mea. Horrebat enim tot scelera quae in novissimis temporibus facturi erant Judaei; quia in furore suo occiderunt virum, id est Christum, de quo dicitur: Ecce vir oriens nomen ejus (Zach. VI, 12). Et alibi: Femina circumdabit virum (Jer. XXXI, 22). Suffoderunt murum, id est, spiritualem illum fortissimum murum, qui custodit Israelem, lancea confoderunt. Maledictus furor eorum, quia pertinax. Utique quando furore accensi in ira obtulerunt Christum Pontio Pilato dicentes: Crucifige, crucifige eum (Joan. XIX, 6). Et indignatio eorum, [quia] dura. Dum Barabbam latronem peterent, et principem vitae crucifigendum postularent (Matth. XXVII, 21). Dividam eos in Jacob, et disperdam [Ms., dispergam] [ illos] in Israel, quia nonnulli ex illis crediderunt, quidam autem in infidelitate permanserunt. Dicuntur enim divisi [hi, qui ab eis] separantur, et veniunt ad fidem; dispersi autem [ Al. ergo] sunt, quorum patria et templum subversum est, et per orbem terrae gens incredula [ Ms., incredulum genus] spargitur.

Juda te laudabunt fratres tui (Gen., XLIX, 8). Per hunc Judam verus confessor exprimitur Christus, qui ex ejus tribu secundum carnem est genitus. Ipsum laudant fratres sui, apostoli scilicet et omnes cohaeredes ejus, qui per adoptionem Filii Dei Patris et Christi fratres effecti sunt per gratiam, quorum ipse est Dominus per naturam. Manus tuae in cervicibus inimicorum tuorum. Iisdem enim manibus et eodem crucis trophaeo et suos textit, et inimicas adversariasque potestates devicit [ Ms., curvavit]. Juxta quod et Pater promittit ei dicens: Sede ad dexteram meam, donec ponam inimicos tuos scabellum pedum tuorum. Adorabunt te filii patris tui, quoniam multi ex filiis Jacob adorantes [eum] per electionem gratiae salvi facti sunt. Catulus leonis Juda (vers. 9), quoniam nascendo parvulus factus est, sicut scriptum est: Parvulus natus est nobis. Ad praedam fili mi ascendisti, id est, ascendens in crucem, captivos populos redemisti [et] quos adversarius [ Ms., contrarius] ille invaserat [tu moriens eripuisti. Denique rediens ab inferis ascendisti] in altum, captivam duxisti captivitatem. Requiescens accubuisti ut leo. Manifestissime Christus accubuit in passione, quando inclinato capite tradidit spiritum, sive quando in sepulcro [securus] velut quodam corporis somno quievit. Sed quare ut leo et [ velut] catulus leonis? In somno suo leo fuit, quoniam non necessitate, sed potestate hoc ipsum implevit, sicut ipse dicit: Nemo tollet a me animam meam, sed ego ponam eam. Quod vero addidit: Et ut catulus leonis; inde enim mortuus est, unde [et] natus. Bene [ergo] Christus ut leo requievit, qui non solum mortis acerbitatem non timuit, sed etiam in ipsa morte mortis imperium vicit. Quod autem dicit: Quis suscitabit eum? Quid est aliud nisi quod ipse dicit [ Ms., quia nullus, nisi ipse, juxta quod ipse ait]: Solvite templum hoc, et in triduo suscitabo illud. Non deficiet dux de Juda [et reliqua] (vers. 10). Hoc manifestissime ad Judam refertur. Diu enim fuit ex semine illius intemerata apud Judaeos successio regni, donec Christus nasceretur: et hoc supra diximus. Alligans ad vineam pullum suum (vers. 11). Pullus suus, populus est ex gentibus, cui adhuc nunquam fuerat onus legis impositum. Hunc alligaverunt apostoli, qui ex Judaeis sunt, ad vineam de qua dicitur: Vinea Domini Sabaoth [Al., copulavit ad vineam, ad apostolos scilicet, qui ex Judaeis sunt. Nam vinea Domini Sabaoth domus Israel est]: Et ad vitem, quae dicit: Ego sum vitis vera. Ad hanc ergo vitem alligat asinam suam, hoc est synagogam gravidam [ Ms., tardigradam scilicet] et gravi legis pondere depressam. Lavit in vino stolam suam. [Sive] carnem suam in sanguine passionis; sive sanctam Ecclesiam illo vino, quod pro multis effunditur in remissionem peccatorum. Et in sanguine uvae pallium suum. Pallium, gentes sunt, quas corpori suo junxit, sicut scriptum est: Vivo ego, dicit Dominus, nisi hos omnes induam sicut vestimentum. Pulchriores oculi ejus vino (vers. 12). Oculi Christi apostoli sunt et Evangelistae, qui lumen scientiae Ecclesiae praestant quorum praecepta [ Al., scripta] austeritatem vini priscae legis superant, quia longe leviora sunt. Et dentes lacte candidiores. Dentes praeceptores sunt sancti, qui praecidunt ab erroribus homines, et eos quasi comedendo in Christi corpus transmittunt. Candidiores autem effecti sunt doctores ecclesiae lacte veteris legis.

Zabulon in littore maris, et in statione navium habitat [Ms., habitabit ] (vers. 13). Zabulon interpretatur habitaculum pulchritudinis [ Al., fortitudinis], et Ecclesiam significat, quae in littore 338 maris habitat, [et] in statione navium, ut credentibus refugium [sit], et periclitantibus demonstret fidei portum. Haec contra omnes turbines saeculi inconcussa firmitate solida exspectat naufragium Judaeorum, et haereticorum procellas, qui circumferuntur omni vento doctrinae, quorum etsi tunditur fluctibus, non tamen frangitur. Pertendit autem usque ad Sidonem, hoc est, usque ad gentes; legitur etiam in Evangelio, inde assumptos esse aliquos apostolos; in ipsis locis Dominum saepe docuisse, sicut scriptum est: Terra Zabulon, et terra Nephtalim, populus qui sedebat in tenebris, vidit lucem magnam. (Matth. IV, 16; Isai. IX, 1, 2). Sidon interpretatur venator vel venatrix. Venatores vero qui sunt, nisi apostoli? qui, ut supra diximus, ex illis locis assumpti sunt; de quibus dicitur: Mittam venatores multos, et venabuntur vos in omni monte [Al., loco ] (Jer. XVI, 16).

Isachar asinus fortis (Gen. XLIX, 14, 15). Isachar quod interpretatur merces, refertur ad populum gentium, quem Dominus pretio sanguinis sui mercatus est. Hic Isachar asinus fortis scribitur, quia prius populus gentilis, quasi brutum et luxuriosum animal [egerat] nullaque ratione subsistens; nunc vero fortis Redemptoris dominio collum submittens ad jugum disciplinae Evangelicae pervenit [ Al., sed postmodum jugum. . . libenter portavit]. Hic accubans inter terminos vidit requiem, quod esset bona; et terram, quod optima. Inter terminos [autem] accubare, est praestolato mundi fine requiescere, nihilque eorum, quae versantur in medio, quaerere, sed ultima desiderare. Et fortis asinus requiem et terram optimam videt, cum simplex gentilitas [idcirco] se ad robur boni operis erigit [quia] ad aeternae vitae praemium tendit. Unde etiam apponit humerum suum ad portandum, quia dum ad promissam requiem pervenire desiderat, cuncta mandatorum onera libenter portat. Unde factus est tributis serviens, hoc est, regi Christo suo fidei dona et operum bonorum offerens munera.

Dan judicabit populum suum, sicut aliae tribus Israel. Fiat Dan coluber in via, cerastes in semita, [et reliqua] (vers. 16). Dicunt quidam Antichristum per haec verba praedici de tribu Dan futurum, pro eo, quod hoc loco Dan et coluber asseritur et mordens. Unde inter tribus Israel primus Dan ad Aquilonem castra metatus est, illum significans, qui se in lateribus Aquilonis sedere dicit, et de quo figuraliter propheta dicit: A Dan auditus est fremitus equorum ejus (Jer. VIII, 16): qui non solum coluber, sed etiam cerastes, sive cornutus vocatur. Ceras enim Graece cornu dicitur esse [ Al., Κέρατα . . . . . cornua dicuntur]. Unde serpens ille cornutus esse perhibetur, per quem digne Antichristus asseritur, qui contra vitam fidelium cum morsu pestiferae praedicationis armabitur etiam cornibus potestatis [ Edit., et etiam cornibus contra potestates]. Quis autem nescit semitam angustiorem esse, quam viam? Fit ergo coluber in via, quia in praesentis vitae latitudine eos ambulare provocat, quibus quasi parcendo blanditur. Sed mordet, cum eos quibus libertatem tribuit, erroris sui veneno consumit. Fit iterum cerastes in semita, quia quos fideles reperit, et sese inter angusta itinera praecepti coelestis constringere videt, non solum nequitia callidae persuasionis impetit, verum etiam terrore potestatis perimit [ Al., premit], [et] in persecutionis angore, post beneficia ficta [ Ms., fictae] dulcedinis, exercet cornua potestatis. [In quo loco] equus [iste] hunc mundum insinuat, qui [ Ms., quod] per elationem suam in cursu labentium temporum spumat. Et quia Antichristus extrema mundi apprehendet [ Ms., apprehendere nititur], cerastes ille equi ungulas mordere perhibetur. Equi enim ungulas mordere est extrema saeculi [feriendo] contingere. Ut cadat ascensor ejus retro. Ascensor hujus equi est, quisquis iniquitatibus mundi [hujus] extollitur, unde et retro cadere dicitur.

Haec commentatiuncula inter Opera S. Aug. Edit. Bened. S. Mauri tom. III, Append. pag. 28, ita finitur.

Ut cadat ascensor ejus retro. Plebs infidelis Judaea, erroris suis laqueis capta pro Christo Antichristum exspectat. Bene Jacob eodem loco repente in electorum vocem conversus est dicens: Salutare tuum exspectabo, Domine (vers. 18). Id est, non sicut infideles Antichristum, sed eum, qui in redemptionem nostram venturus est, verum credo fideliter Christum. Amen.

339 DICTA BEATI ALBINI LEVITAE Super illud Geneseos: Faciamus hominem ad imaginem et similitudinem nostram (Gen. I, 26).

1 DICTA BEATI ALBINI LEVITAE

Tanta [ Edit., tota] dignitas humanae conditionis esse cognoscitur, ut non solo jubentis sermone, sicut alia sex dierum opera, sed consilio sanctae Trinitatis et opere majestatis divinae creatus est [ Al., sit] homo; ut ex primae conditionis honore intelligeret, quantum deberet suo Conditori, dum tantum in conditione mox dignitatis privilegium praestitit ei Conditor, ut tanto ardentius amaret Conditorem, quanto mirabilius se ab eo esse conditum intelligeret. Nec ob hoc solum quod consilio sanctae Trinitatis sic excellenter a Conditore conditus est, sed etiam quod ad imaginem et similitudinem suam ipse Creator omnium eum creavit, quod nulli alii ex creaturis donavit. Quae imago diligentius ex interioris hominis nobilitate est consideranda. Primo quidem, ut sicuti Deus unus semper ubique totus est, omnia vivificans, movens et gubernans, sicut apostolus confirmat, quod in eo vivimus, et movemur, et sumus (Act. XVII, 28): sic et anima in suo corpore ubique tota viget, vivificans illud, movens et gubernans. Nec enim in majoribus corporis sui membris major est, et in minoribus minor; sed in minimis tota et in maximis tota. Et haec est imago unitatis Dei omnipotentis, quam anima habet in se. Quae quoque quamdam sanctae Trinitatis habet imaginem. Primo in eo quia, sicut Deus est, vivit et sapit; ita anima secundum suum modum est, vivit et sapit. Est quoque et alia Trinitas in ea, qua ad imaginem sui Conditoris, perfectae quidem et summae Trinitatis, quae [est] in Patre, et Filio, et Spiritu sancto [ Al., quae ex Patre, et Filio, et Spiritu sancto], condita est. Et licet unius sit illa naturae, tres [tamen] in se dignitates habet, id est, intellectum, voluntatem et memoriam. Quod idem, licet aliis verbis, in Evangelio designatur, cum dicitur: Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex tota mente tua (Matth. XXII, 37); id est, et ex toto intellectu, et ex tota voluntate, et ex tota memoria. Jam [ Ms., Nam] sicut ex Patre generatur Filius, ex Patre Filioque procedit Spiritus sanctus; ita ex intellectu generatur voluntas, ex his item ambobus procedit memoria, sicut facile [a sapiente quolibet] intelligi potest. Nec enim anima perfecta potest esse sine his tribus, nec horum trium unum aliquod, quantum ad suam pertinet beatitudinem, sine aliis duobus integrum constat. Et sicut Deus Pater, Deus Filius, Deus Spiritus sanctus est, non tamen tres dii sunt, sed unus Deus tres habens personas; ita et anima intellectus, anima voluntas, anima memoria; non tamen animae tres in uno corpore, sed una anima tres habens dignitates; 340 atque in his tribus ejus imaginem mirabiliter gerit in sua natura noster interior homo: ex quibus quasi excellentioribus animae dignitatibus jubemur diligere Conditorem, ut quantum intelligatur, diligatur [ Al., intelligitur. . . . . diligitur]; et quantum diligatur, semper in memoria habeatur. Nec solus sufficit de eo intellectus, nisi fiat in amore ejus voluntas: imo nec haec duo sufficiunt, nisi memoria addatur, qua semper in mente intelligentis et diligentis maneat Deus; ut sicut nullum potest esse momentum, quo homo [non] utatur, vel fruatur Dei bonitate et misericordia; ita nullum debeat esse momentum, quo praesentem eum non habeat in memoria. Et haec de imagine habeto.

Hoc vero nunc de similitudine aliqua intellige, quae in moribus [ Al., minoribus] cernenda est: ut sicut Deus Creator, qui hominem ad similitudinem suam creavit, est charitas, est bonus et justus, patiens atque mitis, mundus, misericors, et caetera virtutum sanctarum insignia quae de eo leguntur: ita homo creatus est ut charitatem haberet, ut bonus esset et justus, patiens atque mitis, mundus et misericors foret. Quas virtutes quanto plus quisque in seipso habet, tanto propius est Deo, et majorem sui Conditoris gerit similitudinem. Si vero, quod absit, aliquis per devia vitiorum et divortia criminum ab hac nobilissima sui Conditoris similitudine degener aberret, tunc fiet de eo quod scriptum est: Et homo, cum in honore esset non intellexit, comparatus est jumentis insipientibus et similis factus est illis (Psal. XLVIII, 13). Qui major honor potuit homini esse, quam ut ad similitudinem sui Factoris conderetur, et eisdem virtutum vestimentis ornaretur, quibus Conditor, de quo legitur: Dominus regnavit, decore indutus (Psal. XCII, 1), id est, omnium virtutum splendore et totius bonitatis decore ornatus? Vel quod majus homini potest esse dedecus, aut infelicior miseria, quam ut hac similitudinis gloria sui Conditoris amissa, ad informem et ad irrationabilem brutorum jumentorum dilaberetur similitudinem? Eapropter quisque diligentius attendat primae conditionis suae excellentiam, et venerandam sanctae Trinitatis in seipso imaginem agnoscat, honoremque similitudinis divinae, ad quem creatus est, nobilitate morum, exercitio virtutum, dignitate meritorum habere contendat: ut quando appareat qualis sit, tunc similis ei appareat qui se mirabiliter ad similitudinem suam in primo Adam condidit, mirabiliusque in [secundo Edit., mendose, saeculo] reformavit.

DE DECEM VERBIS LEGIS SEU BREVIS EXPOSITIO DECALOGI.

1 DE DECEM VERBIS LEGIS SEU BREVIS EXPOSITIO DECALOGI.

Dat igitur Dominus Moysi legem innocentiae nostrae et cognitionis suae, eamdemque in decem verba constituit, et saxeis tabulis digito suo scripsit. Et haec quidem praecepta ita sunt distributa, ut tria pertineant ad dilectionem divinae Trinitatis; septem vero ad amorem fraternum, quibus societas humana non laeditur. Primum Decalogi mandatum ad Deum Patrem pertinet, dum dicit: Dominus Deus tuus Deus unus est (Exod. XX, Deut. V). Utique ut haec audiens unum Deum Patrem colas, et in multos Deos fornicationem tuam non effundas. Secundum praeceptum pertinet ad Filium, dum dicit: Non assumes nomen Domini tui in vanum, id est, ne aestimes creaturam esse filium Dei, quoniam omnis 341 creatura vanitati subjecta est; sed credas eum aequalem esse Patri, Deum deorum, Verbum apud Deum, per quem omnia facta sunt. Tertium mandatum de sabbato ad Spiritum sanctum pertinet, cujus donum requies nobis sempiterna promittitur. Nam quia Spiritus sanctus dicitur, propterea et septimum diem sanctificavit Deus: in aliis enim diebus, operum non est nominata sanctificatio, nisi in sabbato, ubi dicitur: Requievit Deus. Proinde igitur hoc mandatum pertinet ad Spiritum sanctum, tam propter nomen sanctificationis, quam etiam propter aeternam requiem, ad donum sancti Spiritus pertinentem. Dicitur enim ibi: Memento, ut diem sabbati sanctifices. Sex diebus operaberis, et facies omnia opera tua. Septimus autem dies sabbatum est Domini Dei tui, non facies omne opus in eo (Exod. XX, 10). In sex dierum opere sex millium annorum operatio continetur: in septimi vero requie, beati illius regni tempus ostenditur, quod carnaliter Judaei celebrantes exspectant. Et hoc ne nos ad fidem mendacii fallentes aptemus, clamat per prophetam Deus: Neomenias et sabbata vestra odivit anima mea (Isai. I, 13). Quomodo ergo sanctificata sunt vel erunt sabbata illa quae odivit Deus? Ergo sabbatum est sanctificatum, ubi post bona vitae hujus opera requies nobis aeterna promittitur. Ideoque quidquid agimus, si propter futuri saeculi requiem agimus, veraciter sabbatum observamus.

Post haec tria praecepta septenarius succedit numerus mandatorum, ad dilectionem proximi pertinens, et incipit ab honore parentum, dum dicitur: Honora patrem tuum et matrem tuam (Exod. XX, 12); quod in ordine quartum est. A parentibus enim suis homo aperit oculos, et haec vita ab eorum dilectione sumit exordium. Inde hoc mandatum primum est, sicut et Dominus in Evangelio dicit: Honora patrem tuum et matrem tuam, quod est mandatum primum. (Matth. XV, 4; Ephes. VI, 2). Sed quomodo primum, nisi sicut praedictum est in septenario numero, quia pertinet ad dilectionem proximi, primum est in altera tabula. Nam idcirco duae tabulae legis datae sunt. Jubetur ergo in hoc praecepto filiis honorare parentes, neque contumeliosos aut protervos illis existere, sed officio pietatis et humanitatis debitam reverentiam praestare. Nam qui parentibus honorem differt, quibus parcere poterit, qui suos odit? Quintum: Non maechaberis (Exod. XX, 14), id est ne quisquam praeter matrimonii foedus aliis feminabus misceatur ad explendam libidinem. Nam specialiter adulterium facit, qui praeter suam ad alteram accedit. Sextum: Non occides. Etenim non solum opere perpetrans homicidium facit, sed etiam qui incurrit in eum esurientem vel nudum, qui mori possit, nisi indumentum, cibumque porrigendo subveniat, et ideo homicidii reus habebitur. Septimum, non furtum facies (vers. 15), quod est vitium rapacitatis. Octavum: falsum testimonium non dices (vers. 16), quod est crimen mendacii, et falsitatis. Nonum: Non concupisces uxorem proximi tui (vers. 17). In hoc praecepto vetat intentionem adulterinae cogitationis. Nam aliud est facere aliquid tale praeter uxorem, aliud non appetere alienam uxorem; ideo duo praecepta sunt: Non moechaberis, et non concupisces uxorem proximi tui. Decimum: Non concupisces rem proximi tui. In quo praecepto damnat ambitionem saeculi, et refrenat concupiscentiam rerum. Itaque horum primum prohibet superstitionem, secundum errorem, tertium saeculi amorem, quartum impietatem, quintum allidit fornicationem, sextum crudelitatem, septimum rapacitatem, octavum perimit falsitatem, nonum adulterii cogitationem, decimum cupiditatem. Et notandum quia sicut decem plagis percutiuntur Aegyptii, sic decem praecepta conscribuntur tabulae, quibus regitur populus Dei, et daemones occiduntur.\
