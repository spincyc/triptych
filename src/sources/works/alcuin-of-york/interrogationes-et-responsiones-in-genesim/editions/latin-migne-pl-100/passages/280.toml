  { line = 305, text = """
Tanta [ Edit., tota] dignitas humanae conditionis esse cognoscitur, ut non solo jubentis sermone, sicut alia sex dierum opera, sed consilio sanctae Trinitatis et opere majestatis divinae creatus est [ Al., sit] homo; ut ex primae conditionis honore intelligeret, quantum deberet suo Conditori, dum tantum in conditione mox dignitatis privilegium praestitit ei Conditor, ut tanto ardentius amaret Conditorem, quanto mirabilius se ab eo esse conditum intelligeret. Nec ob hoc solum quod consilio sanctae Trinitatis sic excellenter a Conditore conditus est, sed etiam quod ad imaginem et similitudinem suam ipse Creator omnium eum creavit, quod nulli alii ex creaturis donavit. Quae imago diligentius ex interioris hominis nobilitate est consideranda. Primo quidem, ut sicuti Deus unus semper ubique totus est, omnia vivificans, movens et gubernans, sicut apostolus confirmat, quod in eo vivimus, et movemur, et sumus (Act. XVII, 28): sic et anima in suo corpore ubique tota viget, vivificans illud, movens et gubernans. Nec enim in majoribus corporis sui membris major est, et in minoribus minor; sed in minimis tota et in maximis tota. Et haec est imago unitatis Dei omnipotentis, quam anima habet in se. Quae quoque quamdam sanctae Trinitatis habet imaginem. Primo in eo quia, sicut Deus est, vivit et sapit; ita anima secundum suum modum est, vivit et sapit. Est quoque et alia Trinitas in ea, qua ad imaginem sui Conditoris, perfectae quidem et summae Trinitatis, quae [est] in Patre, et Filio, et Spiritu sancto [ Al., quae ex Patre, et Filio, et Spiritu sancto], condita est. Et licet unius sit illa naturae, tres [tamen] in se dignitates habet, id est, intellectum, voluntatem et memoriam. Quod idem, licet aliis verbis, in Evangelio designatur, cum dicitur: Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex tota mente tua (Matth. XXII, 37); id est, et ex toto intellectu, et ex tota voluntate, et ex tota memoria. Jam [ Ms., Nam] sicut ex Patre generatur Filius, ex Patre Filioque procedit Spiritus sanctus; ita ex intellectu generatur voluntas, ex his item ambobus procedit memoria, sicut facile [a sapiente quolibet] intelligi potest. Nec enim anima perfecta potest esse sine his tribus, nec horum trium unum aliquod, quantum ad suam pertinet beatitudinem, sine aliis duobus integrum constat. Et sicut Deus Pater, Deus Filius, Deus Spiritus sanctus est, non tamen tres dii sunt, sed unus Deus tres habens personas; ita et anima intellectus, anima voluntas, anima memoria; non tamen animae tres in uno corpore, sed una anima tres habens dignitates; 340 atque in his tribus ejus imaginem mirabiliter gerit in sua natura noster interior homo: ex quibus quasi excellentioribus animae dignitatibus jubemur diligere Conditorem, ut quantum intelligatur, diligatur [ Al., intelligitur. . . . . diligitur]; et quantum diligatur, semper in memoria habeatur. Nec solus sufficit de eo intellectus, nisi fiat in amore ejus voluntas: imo nec haec duo sufficiunt, nisi memoria addatur, qua semper in mente intelligentis et diligentis maneat Deus; ut sicut nullum potest esse momentum, quo homo [non] utatur, vel fruatur Dei bonitate et misericordia; ita nullum debeat esse momentum, quo praesentem eum non habeat in memoria. Et haec de imagine habeto.\
""" },
  { line = 306, text = """
Hoc vero nunc de similitudine aliqua intellige, quae in moribus [ Al., minoribus] cernenda est: ut sicut Deus Creator, qui hominem ad similitudinem suam creavit, est charitas, est bonus et justus, patiens atque mitis, mundus, misericors, et caetera virtutum sanctarum insignia quae de eo leguntur: ita homo creatus est ut charitatem haberet, ut bonus esset et justus, patiens atque mitis, mundus et misericors foret. Quas virtutes quanto plus quisque in seipso habet, tanto propius est Deo, et majorem sui Conditoris gerit similitudinem. Si vero, quod absit, aliquis per devia vitiorum et divortia criminum ab hac nobilissima sui Conditoris similitudine degener aberret, tunc fiet de eo quod scriptum est: Et homo, cum in honore esset non intellexit, comparatus est jumentis insipientibus et similis factus est illis (Psal. XLVIII, 13). Qui major honor potuit homini esse, quam ut ad similitudinem sui Factoris conderetur, et eisdem virtutum vestimentis ornaretur, quibus Conditor, de quo legitur: Dominus regnavit, decore indutus (Psal. XCII, 1), id est, omnium virtutum splendore et totius bonitatis decore ornatus? Vel quod majus homini potest esse dedecus, aut infelicior miseria, quam ut hac similitudinis gloria sui Conditoris amissa, ad informem et ad irrationabilem brutorum jumentorum dilaberetur similitudinem? Eapropter quisque diligentius attendat primae conditionis suae excellentiam, et venerandam sanctae Trinitatis in seipso imaginem agnoscat, honoremque similitudinis divinae, ad quem creatus est, nobilitate morum, exercitio virtutum, dignitate meritorum habere contendat: ut quando appareat qualis sit, tunc similis ei appareat qui se mirabiliter ad similitudinem suam in primo Adam condidit, mirabiliusque in [secundo Edit., mendose, saeculo] reformavit.\
""" },
