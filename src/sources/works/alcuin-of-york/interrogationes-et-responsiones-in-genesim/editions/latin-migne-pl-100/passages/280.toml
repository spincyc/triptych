1 DE DECEM VERBIS LEGIS SEU BREVIS EXPOSITIO DECALOGI.\
""" },
  { line = 309, text = """
Dat igitur Dominus Moysi legem innocentiae nostrae et cognitionis suae, eamdemque in decem verba constituit, et saxeis tabulis digito suo scripsit. Et haec quidem praecepta ita sunt distributa, ut tria pertineant ad dilectionem divinae Trinitatis; septem vero ad amorem fraternum, quibus societas humana non laeditur. Primum Decalogi mandatum ad Deum Patrem pertinet, dum dicit: Dominus Deus tuus Deus unus est (Exod. XX, Deut. V). Utique ut haec audiens unum Deum Patrem colas, et in multos Deos fornicationem tuam non effundas. Secundum praeceptum pertinet ad Filium, dum dicit: Non assumes nomen Domini tui in vanum, id est, ne aestimes creaturam esse filium Dei, quoniam omnis 341 creatura vanitati subjecta est; sed credas eum aequalem esse Patri, Deum deorum, Verbum apud Deum, per quem omnia facta sunt. Tertium mandatum de sabbato ad Spiritum sanctum pertinet, cujus donum requies nobis sempiterna promittitur. Nam quia Spiritus sanctus dicitur, propterea et septimum diem sanctificavit Deus: in aliis enim diebus, operum non est nominata sanctificatio, nisi in sabbato, ubi dicitur: Requievit Deus. Proinde igitur hoc mandatum pertinet ad Spiritum sanctum, tam propter nomen sanctificationis, quam etiam propter aeternam requiem, ad donum sancti Spiritus pertinentem. Dicitur enim ibi: Memento, ut diem sabbati sanctifices. Sex diebus operaberis, et facies omnia opera tua. Septimus autem dies sabbatum est Domini Dei tui, non facies omne opus in eo (Exod. XX, 10). In sex dierum opere sex millium annorum operatio continetur: in septimi vero requie, beati illius regni tempus ostenditur, quod carnaliter Judaei celebrantes exspectant. Et hoc ne nos ad fidem mendacii fallentes aptemus, clamat per prophetam Deus: Neomenias et sabbata vestra odivit anima mea (Isai. I, 13). Quomodo ergo sanctificata sunt vel erunt sabbata illa quae odivit Deus? Ergo sabbatum est sanctificatum, ubi post bona vitae hujus opera requies nobis aeterna promittitur. Ideoque quidquid agimus, si propter futuri saeculi requiem agimus, veraciter sabbatum observamus.\
""" },
  { line = 310, text = """
Post haec tria praecepta septenarius succedit numerus mandatorum, ad dilectionem proximi pertinens, et incipit ab honore parentum, dum dicitur: Honora patrem tuum et matrem tuam (Exod. XX, 12); quod in ordine quartum est. A parentibus enim suis homo aperit oculos, et haec vita ab eorum dilectione sumit exordium. Inde hoc mandatum primum est, sicut et Dominus in Evangelio dicit: Honora patrem tuum et matrem tuam, quod est mandatum primum. (Matth. XV, 4; Ephes. VI, 2). Sed quomodo primum, nisi sicut praedictum est in septenario numero, quia pertinet ad dilectionem proximi, primum est in altera tabula. Nam idcirco duae tabulae legis datae sunt. Jubetur ergo in hoc praecepto filiis honorare parentes, neque contumeliosos aut protervos illis existere, sed officio pietatis et humanitatis debitam reverentiam praestare. Nam qui parentibus honorem differt, quibus parcere poterit, qui suos odit? Quintum: Non maechaberis (Exod. XX, 14), id est ne quisquam praeter matrimonii foedus aliis feminabus misceatur ad explendam libidinem. Nam specialiter adulterium facit, qui praeter suam ad alteram accedit. Sextum: Non occides. Etenim non solum opere perpetrans homicidium facit, sed etiam qui incurrit in eum esurientem vel nudum, qui mori possit, nisi indumentum, cibumque porrigendo subveniat, et ideo homicidii reus habebitur. Septimum, non furtum facies (vers. 15), quod est vitium rapacitatis. Octavum: falsum testimonium non dices (vers. 16), quod est crimen mendacii, et falsitatis. Nonum: Non concupisces uxorem proximi tui (vers. 17). In hoc praecepto vetat intentionem adulterinae cogitationis. Nam aliud est facere aliquid tale praeter uxorem, aliud non appetere alienam uxorem; ideo duo praecepta sunt: Non moechaberis, et non concupisces uxorem proximi tui. Decimum: Non concupisces rem proximi tui. In quo praecepto damnat ambitionem saeculi, et refrenat concupiscentiam rerum. Itaque horum primum prohibet superstitionem, secundum errorem, tertium saeculi amorem, quartum impietatem, quintum allidit fornicationem, sextum crudelitatem, septimum rapacitatem, octavum perimit falsitatem, nonum adulterii cogitationem, decimum cupiditatem. Et notandum quia sicut decem plagis percutiuntur Aegyptii, sic decem praecepta conscribuntur tabulae, quibus regitur populus Dei, et daemones occiduntur.\
""" },
