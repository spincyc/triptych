Zabulon in littore maris, et in statione navium habitat [Ms., habitabit ] (vers. 13). Zabulon interpretatur habitaculum pulchritudinis [ Al., fortitudinis], et Ecclesiam significat, quae in littore 338 maris habitat, [et] in statione navium, ut credentibus refugium [sit], et periclitantibus demonstret fidei portum. Haec contra omnes turbines saeculi inconcussa firmitate solida exspectat naufragium Judaeorum, et haereticorum procellas, qui circumferuntur omni vento doctrinae, quorum etsi tunditur fluctibus, non tamen frangitur. Pertendit autem usque ad Sidonem, hoc est, usque ad gentes; legitur etiam in Evangelio, inde assumptos esse aliquos apostolos; in ipsis locis Dominum saepe docuisse, sicut scriptum est: Terra Zabulon, et terra Nephtalim, populus qui sedebat in tenebris, vidit lucem magnam. (Matth. IV, 16; Isai. IX, 1, 2). Sidon interpretatur venator vel venatrix. Venatores vero qui sunt, nisi apostoli? qui, ut supra diximus, ex illis locis assumpti sunt; de quibus dicitur: Mittam venatores multos, et venabuntur vos in omni monte [Al., loco ] (Jer. XVI, 16).\
