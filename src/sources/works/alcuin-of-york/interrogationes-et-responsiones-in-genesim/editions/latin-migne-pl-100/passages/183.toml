text = """
Inter. 183. Si judicium Dei justum est, quare infantes in Sodomis [simul] cum parentibus cremati sunt?-- Resp. Ut nimis impium facinus Sodomitarum possit adverti, peccatum eorum pervenit usque ad necem filiorum, ne de origine illorum aliquod signum remaneret. Nonne provisum est illis, ne diu viventes exempla sequerentur patrum; et levius in futuro crucientur, vel omnino non, aliena causa occisi. Parentes [enim] tam pro se quam pro his rei sunt. Ergo mors filiorum crimen est parentum, et ideo futuri sunt accusatores parentum. Est qualecunque beneficium reum non esse, qui gloriosus non est: prodest enim pauperem non esse, qui rex esse non potest.\
"""
