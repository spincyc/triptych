text = """
Inter. 124. Quid de animalibus sentiri debet quorum natura nec semper in aridis, nec semper in humidis vivere potest, sicut sunt lutri [et] vituli marini, et multa avium genera, quae in aquis victum requirunt, sed in aridis dormiunt [nutriunt] et requiescunt?-- Resp. Potuit [enim] virtus divina utramvis eorum naturam, donec diluvium transiret, temperare, ut aut in humido tantum, aut in arido tantum vivere possent: nisi forte extra arcam in aliqua ejus parte loca illis praeparata essent, unde et in aquis vivere et in aridis requiescere potuissent.\
"""
