text = """
Inter. 272. Dum hic [in Genesi] legimus septuaginta esse animas domus Jacob, quomodo in Actibus apostolorum (VII, 14) dicitur, in animabus septuaginta quinque descendisse Jacob in Aegyptum?-- Resp. Non poterat Lucas [aliquid] contrarium scribere adversus eam Scripturam, quae jam fuerat gentibus divulgata: et utique majoris opinionis, illo duntaxat tempore, septuaginta Interpretum habebatur auctoritas, quam Lucas, qui ignotus et vilis, et non magnae fidei in nationibus ducebatur [ Al., erat]. Hoc, autem generaliter observandum est quod ubicunque sancti apostoli vel apostolici viri loquuntur ad populos, his plerumque testimoniis abutuntur, quae jam fuerant in gentibus divulgata; licet plerique tradunt, Lucam [evangelistam], ut proselytum, Hebraeas litteras ignorasse.\
"""
