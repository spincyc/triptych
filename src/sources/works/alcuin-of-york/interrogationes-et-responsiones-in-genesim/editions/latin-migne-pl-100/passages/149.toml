text = """
317 Inter. 149. An unum opus est turris et civitas [ Ms., civitatis], vel duo?-- Resp. [Veluti] aestimatur a pluribus [arcem ( Ita restituitur lectio ex mss.) esse civitatis Babyloniae turrem illam]. Et ideo civitas illa Babylon dicitur, id est, confusio, quia confusum est [ibi] labium universae terrae, et in linguas varias loquela hominum divisa. Hujus [enim] civitatis, id est, Babylonis admirabilem constructionem gentium commendat historia; cujus nimia disponebatur altitudo, sive unius turris [ejus] quam praecipuam moliebantur inter alias erigere in coelum, sive omnium turrium, quae per numerum singularem ita significatae sunt, ut dicitur miles, et intelliguntur millia militum [ Querc., cum multos milites intelligimus].\
"""
