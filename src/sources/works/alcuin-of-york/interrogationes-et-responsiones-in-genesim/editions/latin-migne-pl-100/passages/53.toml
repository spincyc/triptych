text = """
Inter. 53. Quid significat in eo quod dixit: Morte morieris (vers. 17)?-- Resp. Duplicem hominis mortem designat, id est, animae et corporis. Animae mors est, dum propter peccatum quodlibet animam Deus deserit. Corporis mors est, dum propter necessitatem quamlibet corpus deseritur ab anima. Et hanc duplam hominis mortem Christus sua simpla [morte] destruxit. Nam sola carne mortuus est ad tempus, anima vero nunquam, quia nunquam peccavit.\
"""
