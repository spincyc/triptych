provenance = "Freshly acquired Boston College physical copy, independently identified October 1907 issue. Entire 26-page selected extent locally OCRed. The retained native PDF replays every raster and crop, every OCR TXT/TSV and final selection exactly with pinned tool hashes. Crops exclude running heads and page numbers; no typed corrections, inferred missing words or AI translation enter the output."
notes = "Extract package.zip to a clean directory to obtain replay.py and recipe.json. Reading selection uses only recorded raw OCR byte lines, concatenation, page order and whitespace normalization. The single drop-cap OCR uses a whitelist of all uppercase Latin letters, not a supplied expected letter. The native p.705 printing defect is deliberately retained. Ordinary OCR punctuation and spelling errors remain; no complete word-by-word image collation is claimed."
