notes = "The article Letter of Pope Pius IX surrounds the complete translated body of Ubi primum (2 February 1849) with its own polemical introduction and commentary. Only the papal quotation is selected as the act, beginning at the printed PIUS P.P. IX heading on p.5 column 3 and continuing through p.6 columns 1–2 to the 2 February 1849 Gaeta dating clause. Translator unrecorded. The journal prints no separate final papal subscription and no source-reference footnotes to the patristic quotations; none is supplied. Both full native act pages inspected, and the whole papal quotation read. No endorsement or word-for-word collation is asserted; historical translation choices, OCR spelling and broken words remain."
