notes = "The native issue masthead and translator credit identify Mgr. James H. Ryan, translating for the N.C.W.C. News Service. The translation notice says the act was issued May 8, 1928; the printed closing says May 9. This disagreement is preserved, while the separate act record retains May 8. The complete 20-page issue was acquired. A bounded literal XML-word derivative of its papal act excludes neighboring-page gutter text and printed running furniture by explicit coordinates; inherited OCR errors remain."
