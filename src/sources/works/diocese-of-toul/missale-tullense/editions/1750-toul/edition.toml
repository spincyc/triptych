notes = "Lyon SJ L 013/7, Numelyo BML:BML_00GOO0100137001102132474, linked from USUARIUM 7097 / Amiet 1592. Original title view 11 independently reads MDCCL; the separately dated episcopal letter occupies views 13–17 and is signed at Toul on 17 September 1750. The mandate names the diocese's churches and their deans and rectors, monasteries, colleges, orders, sodalities and communities, followed by priests bound by law or custom to celebrate or recite the Toul Office. This summary preserves the qualified-priest clause without deciding its full reach or inferring universal territorial application. The letter reports changes to collects, added prefaces, readings and other propers, but no edition-to-edition collation has tested these assertions. All 920 offered web-image responses are acquired unchanged in two contiguous packages; this is complete offered-web enumeration, not a physical-codex completeness certification or acquisition of all native-resolution masters. Only named selected loci were visually inspected. Provider OCR is an unverified finding aid, not a checked transcription. No complete book text, textual parent, distinct recension comparison or observed implementation date is established."
