context = "Full five-page letter read visually. The opening addresses the city and diocese's clergy. The operative paragraph names the diocese's churches and their deans and rectors, monasteries, colleges, orders, sodalities and communities, followed by priests bound by law or custom to celebrate or recite the Toul Office. This summary preserves the qualified-priest clause without deciding its full reach. The bishop reports changes in collects, prefaces, lessons and other propers; those self-reported changes are not an independent collation. Signature Scipio Hieronymus; countersignature Thiebaut."
