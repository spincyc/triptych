notes = "Catalog-level record created 2026-07-25. Correspondence volume containing Bellarmine's letter to Paolo Antonio Foscarini of 12 April 1615 (no. 1110, pp. 171-172), printed from the contemporary copy in the Biblioteca della R. Accademia dei Lincei, Cod. Volpicelliano A, fols. 159r-160r. Read in the public Internet Archive scan le-opere-di-galileo-galilei-edizione-nazionale-volume-12 (a Gallica/BnF digitization); the individual volume's imprint year was not verified from the scan and the series range is recorded instead. No exact artifact is registered here."
