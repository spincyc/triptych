notes = "Catalog-level record created 2026-07-25. Documents volume printing the Vatican trial dossier (Processo di Galileo) with diplomatic notes: the qualifiers' propositions and censure (pp. 320-321), the minutes of 25-26 February 1616 (pp. 321-322), the Holy Office session of 3 March 1616 (p. 278), the Index decree of 5 March 1616 (pp. 322-323), Bellarmine's certificate of 26 May 1616 (autograph, p. 348; Galileo's copy, p. 342), and the 1633 records (pp. 342-348, 404-405). Read in the public Internet Archive scan agh6462.0019.001.umich.edu, whose title page imprint reads Firenze 1907. No exact artifact is registered here."
