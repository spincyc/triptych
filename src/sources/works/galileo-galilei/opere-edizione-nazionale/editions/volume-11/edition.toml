notes = "Catalog-level record created 2026-07-25. Correspondence volume containing Bellarmine's letter to the Roman College mathematicians of 19 April 1611 (no. 515), their reply of 24 April 1611 (no. 520), and Bellarmine to Galileo of 23 June 1612 (no. 709). Read in the public Internet Archive scan le-opere-di-galileo-galilei-edizione-nazionale-volume-11 (a Gallica/BnF digitization); the individual volume's imprint year was not verified from the scan and the series range is recorded instead. No exact artifact is registered here."
