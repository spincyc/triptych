description = "The twenty-volume national edition of Galileo's works and correspondence (Florence: Barbera, 1890-1909), edited by Antonio Favaro, printing the Vatican trial dossier and the correspondence with diplomatic notes. The controlling witness for the Bellarmine-Galileo documents used in this repository: the 1611 letters, the 12 April 1615 letter to Foscarini, the February-March 1616 Holy Office and Index documents, and the 26 May 1616 certificate in its two dossier witnesses."
