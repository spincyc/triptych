description = "A Greek narrative letter, conventionally divided into sections 1-322, presenting itself as a courtier's account of the translation of the Jewish Law into Greek under Ptolemy II Philadelphus. Universally judged pseudonymous, the work of an Egyptian Jew; its date is disputed within roughly the second century BCE. It is the earliest extant continuous account of the Septuagint's origin, not a documentary record of the event."
