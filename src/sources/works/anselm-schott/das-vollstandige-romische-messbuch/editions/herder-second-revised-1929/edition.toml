notes = "Title identifies second revised edition; the title-page1929 is handwritten, while the printer line independently prints1929. Approvals are dated6January and29March1927. Host URL and PDF metadata call the delivery1927; those are not the printing date. German Liturgical Institute catalog67078 (https://dli.institute/dlibib/dlibibkatwp.php?layout=dbk&ausgabe=1&nummer=67078&Bestand=c&NurSchweiz=0) independently records the second revised Herder1929 edition with XII,64*,1144,281pages. The held core ends1144/PDF1214 and second pagination ends[281]/PDF1495. Integral front contents PDF11/XII names Vianney[265], Therese[266], Sacred Heart[269], and index[275]; continuous section boundaries support attribution of those appendix blocks to this1929 printing by corroborated bibliographic inference, not a separately dated appendix imprint. Modern watermark and reported four missing scan pages are outside the historical textual witness. The exact original and additional seven-block allowed extents are owned by christ-the-king-early-witnesses-rights-v1.toml, not a whole-delivery licence."
