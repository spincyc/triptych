text = "Vere dignum et justum est, æquum et salutare, nos tibi semper et ubique gratias agere: Domine sancte, Pater omnipotens, æterne Deus: qui Unigenitum tuum in cruce pendentem lancea militis transfigi voluisti, ut apertum Cor, divinæ largitatis sacrarium, torrentes nobis funderet miserationis et gratiæ, et quod amore nostri flagrare nunquam destitit, piis esset requies et pænitentibus pateret salutis refugium. Et ideo cum Angelis et Archangelis, cum Thronis et Dominationibus cumque omni militia cælestis exercitus hymnum gloriæ tuæ canimus, sine fine dicentes:"
