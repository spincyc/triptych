text = "Vere dignum et justum est, æquum et salutare, nos tibi semper, et ubique gratias agere: Domine sancte, Pater omnipotens, æterne Deus: Qui unigenitum Filium tuum Dominum nostrum Jesum Christum, Sacerdotem æternum et universorum Regem, oleo exsultationis unxisti: ut seipsum in ara crucis, hostiam immaculatam et pacificam offerens, redemptionis humanæ sacramenta perageret: et suo subjectis imperio omnibus creaturis, æternum et universale regnum, immensæ tuæ traderet Majestati: regnum veritatis et vitæ; regnum sanctitatis et gratiæ; regnum justitiæ, amoris et pacis. Et ideo cum Angelis et Archangelis, cum Thronis et Dominationibus cumque omni militia cælestis exercitus hymnum gloriæ tuæ canimus, sine fine dicentes:"
