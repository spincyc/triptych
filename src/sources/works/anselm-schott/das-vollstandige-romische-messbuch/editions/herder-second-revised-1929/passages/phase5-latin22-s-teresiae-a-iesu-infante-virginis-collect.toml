notes = "The Son-directed Qui vivis family stays Son-directed; no Per Dominum to Qui vivis addressee substitution. Actual target prints only through in unitate.; it does NOT print Spiritus Sancti, Deus, per omnia or Amen. Formula exemplar comma after Patre is absent in target: pointing only. Whole petition word identity is retained; accents, ligatures and physical wraps normalized. Fresh actual unit number is3758, not the prior research receipt's3761.3761 is the right-column Alleluia. Prior files remain unchanged. Whole as-printed formula is itself explicitly abbreviated by etc.; no expansion of etc. is claimed or used. All nine words actually printed by the Therese target precede Spiritus and stand contiguously here. No Spiritus Sancti, Deus, per omnia or Amen is added to the target. Same-address standard conclusion prefix from passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-son-addressed; governing historical instructions passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-rubricae-generales-17 and passage.catholic-church.missale-romanum.pustet-ratisbon-1862.phase5-latin22-ritus-celebrandi-v-1. No historical proper is claimed to print its expanded target ending. Historical ending \"Qui vivis.\"; actual target ending \"Qui vivis et regnas cum Deo Patre in unitate.\". Latin-only normalization; no mixed German page payload. Only the seven Latin prayers expressly enumerated in src/sources/inventories/christ-the-king-early-witnesses-rights-v1.toml. The actual printed Herder1929 identity, core/appendix continuity and DLI67078 catalog corroboration support the bounded1929 attribution; appendix attribution remains a corroborated inference, not a separately dated colophon. The maximum95-year US published-work term expired at end2024 under17USC304(b),305, even if renewed. No Lasance/English nonrenewal dependence; no whole-delivery permission."
