notes = "The complete1929 Secret is independently old and is held as a previously checked Latin body; it is freshly rechecked against AP1177 here. offerimus becomes offerentes; the first-person offering statement becomes a participial clause. praesta, quaesumus becomes suppliciter deprecamur, a conventional petition frame. The three-word phrase suppliciter deprecamur is the modern replacement requiring explicit whole-expression assessment, not an unchanged reading. The relative clause quem sacrificiis praesentibus immolamus is omitted; Jesus Christus and Dominus noster are omitted from the identifying apposition. Filius tuus is retained and moved after ipse. No reconciliation, unity, peace, or all-nations petition is added. Source Qui tecum vivit is only its literal old cue. The receiving secondary page prints the complete short Qui vivit et regnat in saecula saeculorum. This exact complete formula is independently old in Wilson1894 AP145/printed52; its new English is separately offered for review. No old long ending is transplanted. Preparation-agent image read inherited from the hash-bound frozen packet; this staging does not adjudicate rights or fidelity."
