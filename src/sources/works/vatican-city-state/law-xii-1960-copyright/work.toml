title = "Legge sul diritto di autore (Vatican City State Law N. XII of 12 January 1960)"
alternate_titles = ["Legge sul diritto di autore", "Legge n. XII del 12 gennaio 1960 sul diritto di autore", "Law No. XII of January 12, 1960, on Copyright"]
responsible = "John XXIII, as sovereign of Vatican City State"
