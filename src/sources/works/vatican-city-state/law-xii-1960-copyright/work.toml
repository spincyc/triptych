composed_basis = "The law's own heading date and dating clause, read on the scanned text page: 12 gennaio 1960, given at the Apostolic Palace in the second year of the pontificate."
description = "Four-article Vatican City State copyright law enacted motu proprio by John XXIII. It has the copyright legislation of the Italian State observed in Vatican City within stated limits, applies copyright protection to the texts of laws and official acts published by the Holy See and the State, abrogates a provision of the 1929 law on the sources of law, and enters into force on publication. The Italian legislation it receives is not named in its text. WIPO Lex (VA002) lists it as repealed by Law N. CXXXII of 19 March 2011."
