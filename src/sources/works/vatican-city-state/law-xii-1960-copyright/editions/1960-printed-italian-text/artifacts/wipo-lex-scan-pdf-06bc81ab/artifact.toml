notes = "Two-page image scan with a machine text layer (PDF producer Adobe Acrobat 9.0 Paper Capture with ClearScan; document title Legge n. XII del 12 gennaio 1960 sul diritto di autore). Artifact page 1 is the law's title page bearing printed page number 53; artifact page 2 carries the heading N. XII, the date, John XXIII's enacting formula, arts. 1-4, the order for deposit and publication, the dating clause and the signature. The text layer is unreliable OCR and was not used as evidence; loci were read from page images. EXTENT: the whole PDF as served, and the law's text runs without break from heading to signature. The acquired bytes are held outside the tracked tree; this manifest preserves exact identity and checked page loci without publishing the PDF."
