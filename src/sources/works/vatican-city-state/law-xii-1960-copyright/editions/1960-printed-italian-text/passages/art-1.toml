context = "Article 1 provides that, for copyright in works of the intellect, the legislation of the Italian State, including the regulations in force when this law enters into force, is observed in Vatican City, provided that it is not contrary to the precepts of divine law, the general principles of canon law, or the norms of the Treaty and Concordat concluded between the Holy See and the Italian State on 11 February 1929, and provided that it proves applicable there in relation to the factual situation existing in Vatican City."
