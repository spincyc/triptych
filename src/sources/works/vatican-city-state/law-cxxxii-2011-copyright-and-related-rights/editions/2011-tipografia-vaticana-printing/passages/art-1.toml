context = "Article 1, paragraph 1, provides that, for copyright in works of the intellect and related rights, and except as this law otherwise provides, the legislation in force in Italy, including the regulations issued there, is observed in Vatican City State, provided that it is not contrary to the precepts of divine law, the general principles of canon law, the Lateran Pacts of 11 February 1929 with their later modifications, or international agreements to which the Holy See is or will be party, and provided that it proves applicable in relation to the state of fact and of law existing in the State. Paragraph 2 provides that future modifications of Italian copyright and related-rights legislation are deemed received into the legal order of the State, subject to the limits of paragraph 1."
