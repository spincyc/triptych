context = "Article 5, paragraph 1, assigns to the Holy See and to Vatican City State the copyright in works created or published under their name or made on their account. Paragraph 2 provides that, for this law, the Holy See means, besides the Roman Pontiff, the Dicasteries and Organisms of the Roman Curia and the Institutions connected with it. Paragraph 3 entrusts the exercise and protection of copyright in their respective matters to each such subject that has administrative autonomy under the general norms or its own statute. Paragraph 4 sets the term of the exclusive rights of economic use belonging to those subjects at seventy years from the year of the work's first publication, whatever its form, or from the year of the author's death where the author is indicated in the work."
