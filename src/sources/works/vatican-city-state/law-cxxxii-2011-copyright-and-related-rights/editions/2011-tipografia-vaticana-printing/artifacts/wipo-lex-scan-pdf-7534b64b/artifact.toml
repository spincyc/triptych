notes = "Six-page image scan with a machine text layer (PDF producer Adobe Acrobat 9.0 Paper Capture with ClearScan; document title Legge n. CXXXII del 19 marzo 2011 sulla protezione del diritto di autore sulle opere dell'ingegno e dei diritti connessi; embedded creation date 30 March 2011). Artifact page 1 is the title page; page 2 (printed 2) carries the heading, date, enacting body, preamble and art. 1; page 3 (printed 3) arts. 2-4 and art. 5 paragraph 1; page 4 (printed 4) art. 5 paragraphs 2-4 and arts. 6-8; page 5 (printed 5) the submission and publication clauses, dating clause and signatures; page 6 only the imprint Tipografia Vaticana. The text layer is legible for page 2 and garbled for pages 3-4 and was not used as evidence; loci were read from page images. EXTENT: the whole PDF as served; the printed sequence 2-5 is continuous and the text runs without break from heading to signatures. The acquired bytes are held outside the tracked tree; this manifest preserves exact identity and checked page loci without publishing the PDF."
