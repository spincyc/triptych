description = "Eight-article Vatican City State law on copyright and related rights, enacted by the Pontifical Commission for Vatican City State and signed by its President, Giovanni Card. Lajolo; its preamble cites the need to adapt the copyright law of 12 January 1960, N. XII. It has the copyright legislation in force in Italy observed within stated limits and receives its future amendments (art. 1), applies copyright protection to laws and official acts of the Holy See and the State (art. 2), protects the writings, image and voice of the Roman Pontiff (art. 3), governs reproductions of cultural goods (art. 4), assigns copyright in works created or published under their name or on their account to the Holy See and the State with a seventy-year term (art. 5), reserves moral rights to those subjects (art. 6), establishes a commission for intellectual property (art. 7), and repeals all earlier copyright provisions (art. 8). WIPO Lex (VA003) gives entry into force as 26 March 2011 and lists the law as repealed by Law N. CXCVII (VA014), which was not inspected for this record."
