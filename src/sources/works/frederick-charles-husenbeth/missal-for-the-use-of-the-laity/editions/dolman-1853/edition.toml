notes = "The title page reads `NEWLY ARRANGED AND IN GREAT MEASURE TRANSLATED BY THE VERY REV. F. C. HUSENBETH. NEW EDITION IMPROVED. WITH THE APPROBATION OF ALL THE Rt. Rev. the Vicars Apostolic of England.` The approbation leaf is dated 21 September 1848 and the editor's preface London, January 1847; the imprint of this printing is 1853. The Sunday numbering after Pentecost agrees with the 1962 Missale Romanum, but the running head at the top of a page names the Sunday whose formulary begins lower on that page, so the running head above the tail of the preceding Mass is one Sunday ahead of the text beneath it. Read the sectional heading, not the running head."
