description = "An English lay hand missal edited and in great measure newly translated by Provost F. C. Husenbeth for the English Catholic vicariates, printing the Masses of the Roman Missal with the proper Masses of the English saints in place. Its English of the orations is independent of the anonymous translation used in the Philadelphia Cummiskey missals, so the two are separate English witnesses to the same Latin formularies. It heads the Collect `Prayer` throughout. Like every pre-1955 hand missal its Holy Week, octaves, vigils, and seasonal second and third orations reflect the discipline in force before the 1955 and 1960 reforms."
relations = ["work.catholic-church.missale-romanum"]
