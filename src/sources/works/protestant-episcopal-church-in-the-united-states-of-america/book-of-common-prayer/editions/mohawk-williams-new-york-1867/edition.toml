notes = "WHAT THESE BYTES ACTUALLY ARE, which is not what the retrieval was looking for. The retrieving lane fetched Bayerische Staatsbibliothek item 10589646 as \"a candidate straight English Prayer Book text\" and set it aside as too short and inadequate. Read here, the library's own catalogue block inside the file gives: \"Williams, Eleazar. The Book of Common Prayer, according to the use of Protestant Episcopal Church in the United States of America Translated into the Mohawk or Iroquois Language, by the request of the Domestic Committee of the Board of Missions of the Protestant Episcop. Church by the rev. Eleazar Williams. New York 1867\", shelfmark Liturg. 60 fd, urn:nbn:de:bvb:12-bsb10589646-0. The body is Mohawk under English section headings -- \"ORHONKENE IONTERENNAIENTAKWA\" beneath \"THE ORDER FOR DAILY MORNING PRAYER\". That, and not a bad digitisation, is why a search for an English collect returned nothing; the shortness is real as well, the whole optical layer being 96 KB. PAIRING: the English original of this book is not registered here. It was not sought in this run and this stage does not retrieve. The absence is recorded rather than left silent."
