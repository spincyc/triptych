title = "Salutaris ille"
responsible = "Pope Leo XIII"
work_type = "apostolic-letter"
alternate_titles = ["Salutaris ille spiritus precum", "Litterae in forma Brevis of 24 December 1883 on the Rosary and the Litany of Loreto"]
languages = ["la"]
description = "The apostolic letter in the form of a brief, given at St. Peter's under the ring of the Fisherman on 24 December 1883, by which Leo XIII commended daily recitation of the Rosary in the principal church of each diocese and on feast days in parish churches, and decreed that the acclamation Regina sacratissimi Rosarii ora pro nobis be added to the Litany of Loreto after Regina sine labe originali concepta. The letter is unnumbered and is cited by its printed pages in Acta Sanctae Sedis."
relations = ["work.leo-xiii.supremi-apostolatus-officio"]
