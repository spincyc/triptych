context = "The complete English delivery was read. Checked loci include: n. 1-2 (the two kingdoms after Augustine's two cities); n. 5 (the chain of prior condemnations from Clement XII through Pius IX, with the editorial notes' dates); n. 9 (the candidate's 'special oath' of silence and the promise of strict obedience); n. 10 (the sect's ultimate purpose described as overthrow of the religious and political order and a new state of things 'drawn from mere naturalism'); n. 11 (the express restriction: the judgment concerns 'the sect of the Freemasons taken generically ... but not of the individual members of them', who may be 'neither themselves partners in their criminal acts nor aware of the ultimate object'); n. 12 ('the fundamental doctrine of the naturalists ... that human nature and human reason ought in all things to be mistress and guide'); n. 16 (admission of members 'whatever may be their form of religion' teaching 'the great error of this age-that a regard for religion should be held as an indifferent matter, and that all religions are alike'); n. 17 (the contested doctrine of God: members professing God's existence 'do not all maintain this truth with the full assent of the mind', the question a 'source and cause of discords', obstinate atheists admitted as easily as theists); n. 31 (the pastoral program: 'tear away the mask from Freemasonry' and the rule that no one may join it); and the closing date, 'the twentieth day of April, 1884'. Quoted wording was extracted verbatim from the exact fetched response."
