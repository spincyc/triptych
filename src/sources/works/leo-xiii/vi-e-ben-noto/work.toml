description = "The encyclical of 20 September 1887 to the bishops of Italy, published in Italian, on the Rosary and public life. It belongs to Leo XIII's Rosary series but is absent from the Vatican's English index of his encyclicals, and it records that he had raised the feast of the Rosary to the rank of a double of the second class for the whole Church."
