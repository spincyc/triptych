notes = "Single-page Latin Enchiridion with revised (DS) numbers beside the older (DB) numbers. It carries, among much else, Lateran IV Firmiter at DS 801, the Second Council of Lyons on the lot of the dead at DS 856-859, Benedictus Deus at DS 1000-1002, the Florentine Laetentur caeli at DS 1304-1306, Trent session VI canon 30 at DS 1580, and the Tridentine decree on purgatory at DS 1820. Some non-ASCII characters in the French section headings are mis-encoded in the delivered bytes. Restricted bytes not retained."
