description = "Denzinger's standard numbered compilation of creeds, conciliar definitions, and magisterial documents, repeatedly re-edited since 1854. Loci are marginal numbers: the older numbering (through the 30th edition, cited as DB) and the revised Schoenmetzer/Huenermann numbering (from the 32nd edition, cited as DS or DH) differ, and edition records identify which system a witness uses. The compilation is a finding aid to its underlying documents, not a substitute witness for them."
