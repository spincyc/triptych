physical_line_ranges = [[241, 243]]
text = """
VERS. 5-14.--Si Abraham indubitanter firmo animo cogitabat mactare puerum Domino in holocaustum, | quid est quod dixit pueris suis: Vos exspectate hic. Ego et puer, cum adoraverimus, revertemur ad vos? Igitur et indubitanti animo mactare eum credebat, ideo utrumque utrumque laudis est et in constantia offerendi, et in confidere [ Petr., in foedere] suscitandi. Sciebat certissime Deum fallere non posse, et licet puer occideretur, promissionem tamen Dei salvam permanere. Unde et Paulus apostolus per Spiritum sanctum didicerat quid animi habuisset Abraham intra se, dum fidem ejus laudat, dixit: Fide Abraham non haesitavit, cum unicum offerret, in quo acceperat repromissiones quia a mortuis eum resuscitare potest Deus (Rom. IV, 20).

Unde aries iste qui pro Isaac immolatus est, venit? Solet quaeri an de terra subito ibi creatus esset, | vel aliunde ab angelo allatus? Aries iste non putativus, sed verus esse credendus est. Ideo magis a doctoribus aestimatur aliunde eum angelum attulisse quam ibi de terra post sex dierum opera Dominum procreasse

Quare appellavit Abraham nomen loci illius, Dominus videt? Nusquam est quod Dominus non videat. Vidit pro apparuit dixit, hoc est, videri fecit, sicut ibi: Et nunc cognovi, quia times Deum, id est feci ut cognoscatur: eo genere locutionis dum per efficientem significatur id quod efficitur, sicut pigrum frigus dicimus, eo quod pigros facit. Illud autem quod dixit: Unde usque hodie dicitur: Dominus in monte videbit, exinde apud Hebraeos exiit in proverbium, | ut, si quando in angustia constituti sunt, Domini optant auxilio sublevari, dicunt: In monte Dominus videbit, hoc est, sicut Abrahae miserebitur et nostri. Unde et signum dati arietis solent [ Petr., solet] etiamnum cornu clangere.\
"""
