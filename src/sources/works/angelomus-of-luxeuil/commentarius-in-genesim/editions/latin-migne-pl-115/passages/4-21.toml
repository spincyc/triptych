text = """
VERS. 28-30.-- Vixit autem Lamech centum octoginta duobus annis, et genuit filium, vocavitque nomen ejus Noe dicens: Iste consolabitur nos, et reliqua. Vel sicut aliqui transtulerunt: Iste requiescere nos faciet ab omnibus operibus nostris. Unde Noe consolatio vel requies interpretatur. Consolatio, quia homines consolati sunt in diebus ejus, dum a peccato exstincti sunt in diluvio. Requies vero pro eo quod sub illo omnia retro opera quieverint per | diluvium, sive quia requiem in arca praestitit animantibus.\
"""
