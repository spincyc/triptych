text = """
VERS. 1-14.-- Dixitque Dominus ad Abram: Ecce testamentum meum tecum, et eris pater multitudinis gentium, et non vocabitur nomen tuum Abram, sed erit nomen tuum Abraham, quia patrem multarum gentium posui te. Dicunt autem Hebraei quod ex nomine suo Deus, quod apud illos tetragrammum est, id est: Jot, et he, vau, e litteram Abrae et Sarae addiderat. Dicebatur enim primum Abram, quod interpretatur pater excelsus, et postea vocatus est Abraham, pater multarum; nam quod gentium non habetur, | in nomine subauditur. Nec mirandum quare, cum apud Graecos et quosdam a littera videatur addita, nos e litteram Hebraeam additam dixerimus. Idioma enim linguae est per e quidem scribere, sed per a legere; sicut e contra per a scribere et per e legere.\
"""
