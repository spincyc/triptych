VERS. 24.-- Quamobrem relinquet homo patrem suum, et matrem suam, et adhaerebit uxori suae, et reliqua. Hic primum Adam prophetavit de Christo et Ecclesia. Quod exemplum [ Z. om. exemplum] exponens Paulus apostolus ait: Mysterium hoc magnum est; ego autem dico in Christo et Ecclesia (Ephes. V, 22). Quod si quis spiritaliter nosse desiderat, Augustini | et Isidori dicta strenue legat. Bene ait, in carne una, hoc est in una voluntate et consensu, seu quia ex duobus una caro procreatur in prole.\
