text = """
VERS. 1-4.-- Egressa est Dina ut videret mulieres regionis illius, et reliqua usque tristemque blanditiis delinivit. Dina quippe ut mulieres videat extraneae regionis egreditur, quando unaquaeque mens, sua studia negligens, actiones alienas curans, extra habitum atque extra ordinem positum evagatur. Quam Sichem princeps terrae opprimit, quia videlicet inventam | in curis exterioribus diabolus corrumpit. Et agglutinata est anima ejus cum ea, quia unitam sibi per iniquitatem respicit, et quia cum mens a culpa resipiscit, atque admissum flere conatur, corruptor autem spes ac securitates vacuas ante oculos vocat, quatenus utilitatem tristitiae subtrahat, recte illic adjungitur, tristemque blanditiis delinivit. Modo enim aliorum facta graviora, modo nihil esse quod perpetratum est, modo misericordem Deum loquitur; modo adhuc tempus subsequens ad poenitentiam pollicetur, ut dum per haec decepta mens ducitur, ab intentione poenitentiae suspendatur: quatenus tunc bona nulla percipiat, quam nunc mala nulla constristant: et tunc plenius obruatur suppliciis, quae nunc gaudent | etiam in delictis.\
"""
