text = """
VERS. 3.-- Benedixitque diei septimo, et sanctificavit illum. Cur de die sabbato dicitur: Benedixit Deus diei septimo, et sanctificavit illum, dum de aliis diebus hoc non legitur eum dixisse? Ideo ut ostenderet sanctorum requiem post sex hujus saeculi aetatum labores in aeterno sabbato, et benedicta requie quieturos, sicut dicturus erit: Venite, benedicti Patris mei, et reliqua (Matth. XXV, 34). Ideo et illa dies sine vespera legitur, quia ultima requies sanctorum | sempiterna erit. Et congrue quippe dicitur, sanctificavit et benedixit, quia sancti ex benedictione Domini aeternam percipiunt requiem.

Sed, his praelibatis, notandum est quod operatio divina quatuor modis distinguitur. Primo, quod in verbi [ Z., verbo] Dei dispensatione omnia aeterna sunt. Secundo, quod in materia informi, qui vivit in aeternum, creavit omnia simul. Tertio, quod per opera dierum sex varias distinxit creaturas. Quarto, quod ex primordialibus seminibus non incognitae naturae oriuntur, sed notae saepius, ne pereant, reformantur. Hactenus historiam succincte tetigimus, licet pauca intermixta sint quae ad spiritalem pertinere videantur sensum. Sed spiritalem intelligentiam praetermittimus causa brevitatis; quam si quis | cognoscere desiderat, librum Isidori legat caeterorumque doctorum campos percurrat, quia nimirum historia divinae legis non est sine mystica significatione conscripta, teste Paulo apostolo, qui ait: Lex enim figuram habet futurorum bonorum (Col. II, 17), non ipsam imaginem rerum. Et alibi: Haec omnia in figura contingebant illis (I Cor. X, 11). Quod etiam exponens exemplum hujus historiae, ubi dictum est: Propter hoc relinquet homo patrem, et matrem, et caetera, manifestavit inibi sacramentum esse, cum dicit: Sacramentum hoc magnum; ego autem dico in Christo et in Ecclesia (Ephes. V, 32). Sed historiam Veteris Testamenti atque prophetarum ita accipere debemus ut neque mysticam significationem in omnibus requiramus, neque etiam historialem, sed | partim mysticum sensum, partim etiam superficiem historiae. Ubicunque enim historialis intelligentia ponitur, tantummodo propterea fit ut in ea contineatur spiritalis intellectus, sicut in vasis musicorum agitur. Ponuntur enim ibi ligna, ponuntur et chordae, ut his contineantur et suaviter sonare possint. Sic et historia ponitur, ut in connectendo spiritalem intelligentiam contineat. Sequitur:\
"""
