text = """
VERS. 15-19.-- Vocavit autem angelus Domini Abraham secundo de coelo dicens: Quia fecisti rem hanc, et non pepercisti filio tuo unigenito propter me. Nunquid Abraham propter angelum non pepercit suo filio, et non propter Deum? Aut enim angeli nomine, quo Christus significatus est, qui sine dubio Deus est, et manifeste a propheta dictus est magni consili angelus. Aut quia Deus in angelo, et ex persona Dei angelus loquebatur, sicut in prophetis etiam solet. Nam in consequentibus hoc magis videtur | apparere, ubi legitur: Et vocavit angelus Domini Abraham iterum de coelo: per memetipsum juravi, dicit Dominus. Quid est quod secundo ad Abraham eadem et non aliae promissiones fuerunt factae? Significat duplum semen Abrahae futurum esse, unum carnale, aliud spiritale. Ideo dixit ei Dominus: Sic erit semen tuum sicut stellae coeli, et velut arena maris. In stellis coeli spiritales, in arena carnales volens [ Z., volunt] intelligi. Nam quod ait superius: Per memetipsum juravi, ait Dominus, more humano loquitur. Homines enim per majores sui jurant. Deus autem neminem sui majorem habet, et idcirco per semetipsum jurat. Sed jurare Dei est promissiones suas stabiliter firmare. Deinde quod intulit, possidebit semen tuum portas inimicorum suorum, | spiritaliter intelligitur. Ait enim, possidebit semen tuum, id est Christus, vel fideles quique in Ecclesia, quorum tu pater eris per fidem; portas inimicorum, id est infernalia loca, quae destructa fuerunt moriente Domino. Seu portas possidebit, id est peccata, per quae itur ad mortem. Ille enim veraciter possidet portas inimicorum, qui non subjicitur ullis suggestionibus immundorum spirituum. At vero si quis hanc tentationem spiritaliter pleniter ediscere [ Z., addiscere] voluerit, jam saepe praefati viri libellum legere curet. Sequitur:\
"""
