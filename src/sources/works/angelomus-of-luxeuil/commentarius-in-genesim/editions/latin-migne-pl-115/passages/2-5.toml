text = """
VERS. 5.-- Et omne virgultum agri, antequam oriretur in terra, omnemque herbam regionis, priusquam germinaret. Quomodo herba et virentia agri | antequam exorirentur, condita sunt? Et si non erant exorta, quomodo erant facta [Petr., sexta], nisi quod causaliter et originaliter tunc condita sunt quando dictum est: Producat terra herbam virentem? Tunc eam constat producendi accepisse virtutem, et in ea virtute tanquam in radicibus, ut ita dixerim, temporum facta erant, quae tempora erant orienda. Et bene ait, omne virgultum agri, et reliqua, ut celeritatem operis Dei insinuaret; id est antequam aliqui fructus ex terra crescendo orirentur aut germinarent, repente omnes campi et colles herbis erant et arboribus cooperti. Non enim pluerat Dominus super terram, et homo non erat qui operaretur terram. Cur de homine, qui jam sexta die factus fuerat, hoc recapitulatur, nisi quando fecit Deus | omne virgultum agri, nondum pluerat et nondum homo factus erat?\
"""
