physical_line_ranges = [[79, 79]]
text = """
VERS. 13.-- Et dixit Dominus ad mulierem: Quare hoc fecisti? Quae respondens ait: Serpens decepit me. Similiter et mulier culpam oblique ad Creatorem retorquere voluit, eo quod illic intrare serpentem permisisset. Ecce! Qui ore diaboli fallentis | audierant: Eritis sicut dii, peccatum excusant; et quando Deo similes esse in divinitate nequiverunt, ad erroris sui cumulum, Deum sibi similem facere in culpa conati sunt. Sic ergo, ut jam superius descripsimus, dum defendere peccatum suum moliuntur, vir per mulierem, mulier per serpentem, auferunt, quod humilitatis confessione delere poterant. Unde nunc usque in usu peccantium agitur, ut culpa cum arguitur, defendatur, et unde finiri debuit, reatus inde cumuletur [ Z., peccatum trahitur, ut culpa, dum agitur, defendatur, et unde finiri debuit, reatus inde cumuletur]. Hic notandum est quod omne peccatum quatuor modis perpetratur in corde, quatuor etiam modis consummatur in opere. In corde namque suggestione, delectatione, consensu, | et defensionis audacia perpetratur, sicut hic demonstratur. Fit enim suggestio per adversarium, delectatio per carnem, consensus per spiritum, defensionis audacia per elationem. Culpa enim, quae terrere mentem debuit, extollit, et dejiciendo elevat, sed gravius elevando supplantat. Unde et illam primi hominis rectitudinem diabolus his quatuor ictibus fregit. Nam serpens suasit, Eva delectata est, Adam consensit, qui etiam requisitus confiteri culpam per audaciam noluit. Hoc verum in humano genere quotidie agitur, quod actum in primo parente non ignoratur. Serpens suadet, quia occultus hostis mala cordibus hominum latenter suggerit. Eva delectata est, quia carnalis sensus ad | verba serpentis mox delectationi substernit. Adam vero assensum praebuit, quia dum caro in delectationem rapitur, etiam a sua rectitudine spiritus infirmatus inclinatur. Et requisitus Adam confiteri culpam noluit, quia videlicet spiritus quo peccando a veritate disjungitur, eo in ruinae suae audacia nequius obduratur. Iisdem etiam quatuor modis peccatum consummatur in opere: prius enim latens culpa agitur; postmodum vero etiam ante oculos hominum sine confusione reatus aperitur: dehinc et in consuetudinem ducitur; ad extremum quoque vel falsae spei seductionibus vel obstinatione miserae desperationis enutritur. Hos itaque peccati modos, qui vel in corde latenter fiunt, vel patenter in opere perpetrantur, hic nobis historia primi hominis manifestat | [ Z., manifestatur].\
"""
