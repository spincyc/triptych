VERS. 11-12.-- Nomen uni Phison, ipse est Ganges fluvius Indiae, qui circuit omnem terram Evilat, ubi nascitur aurum, et aurum terrae illius optimum est, ibique invenitur bdellium et lapis onychinus. Bdellium nonnulli dicunt lignum esse pretiosissimum, alii vero lapidem pretiosum. Unde nonnulli pro bdellio et onychino carbunculum et lapidem prasinum transtulerunt. Interpretatur autem Phison inflatio juxta historiam, quia vento tumente inflatur: | seu os pupillae, quod melius est.\
"""
