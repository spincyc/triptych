physical_line_ranges = [[81, 81]]
text = """
VERS. 15.-- Inimicitias ponam inter te et mulierem, et semen tuum et semen illius. Semen diaboli perversa est suggestio, semen mulieris est totum genus humanum. Quae duo semina ex praecepto divino continuum inter se gerere odium debent, ut non faciamus quae diabolus vult, quia ille nunquam vult nobis profutura. Licet nonnulli velint intelligi mulierem mentem, semen mulieris fructum boni operis. Potest etiam et de beata Maria virgine, ex qua natus est Dominus, non incongrue accipi. Lege Augustinum et Isidorum. Ipsa conteret caput tuum, | et tu insidiaberis calcaneo ejus. Caput itaque serpentis est cogitatio illicitae suggestionis, quam nos omni intentione atque manu sollicitae considerationis a cordis auditu funditus exstirpare, et ad petram, qui est Christus, allidere debemus. Calcaneum vero mulieris extremum est vitae nostrae tempus, quo diabolus nos acrius impugnare satagit, qui cum ab initio deprehenditur [ Z., reprehenditur], percutere calcaneum molitur. Quia etsi suggestione primae intentionis non percutit, decipere in fine intendit. Cui, si viriliter resistimus, victoriam perseverantiae cum salute nostra accipiemus. Notandum est quia in hoc quod ait: Maledictus eris inter omnia animantia et bestias terrae, ad diabolum refertur, qui maledictus dicitur, quia poenitentiam | agere non potest. Inter omnia animantia, id est quae suam servaverunt naturam. Et bestias terrae, hoc est inter homines, sive universalem Ecclesiam.\
"""
