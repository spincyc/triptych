physical_line_ranges = [[173, 173]]
text = """
VERS. 14-17.-- Dixit ergo Deus ad Abram: Leva oculos tuos, et vide a loco in quo tu nunc es, ad aquilonem, et ad austrum, ad orientem, et ad mare, quia omnem terram quam tu vides, tibi dabo et semini tuo. Si enim terra tantum promittebatur ei, quam tunc in uno loco stans videre potuit per quatuor climata mundi, angusta videtur esse terra repromissionis. | Non hoc solum terrae promissum est quam videre potuit. Non enim dictum est: Tantum terrae tibi dabo quantum vides; sed, Tibi dabo terram quam vides, eum et ulterior undique dabatur. Et idcirco subjunxit: Surge et perambula terram in latitudine et longitudine, ut perambulando perveniret ad ea quae oculis uno loco stans videre non posset. Significabatur autem ea terra, quam carnale semen ejus accepturum erat. Nam illud spiritale totius mundi latitudinem possessurum erat. Dum dixit, ad orientem et ad mare, quid dictum est? Solet enim Scriptura sancta, dum de plagis terrae repromissionis loquitur, mare pro occidente ponere, ab eo quod Palaestina regio mare occidentis plagae habeat. Verumtamen, ut quibusdam placet, spiritaliter Christus | cum Ecclesia dicitur levare oculos a mundo ad quatuor partes terrae, per quas quatuor Evangelia figurantur, cuique omnis terra datur, ut alibi: Postula a me, et dabo tibi gentes, et caetera (Psal. II, 8). Usque in sempiternum, id est in longitudine temporis.\
"""
