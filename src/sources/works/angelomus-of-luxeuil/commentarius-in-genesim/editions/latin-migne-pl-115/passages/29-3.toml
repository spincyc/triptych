VERS. 3-6.-- Morisque erat ut cunctis ovibus congregatis devolverent lapidem. Quia cum plenitudo temporis advenit, ut per Unigenitum genus humanum salvaretur, ipse revelare dignatus est, et tunc duritia legis manifestata est. Scriptum namque est: Tunc aperuit eis sensum, ut intelligerent Scripturas (Luc. XXIV, 45) .-- Et refectis gregibus, hoc est credentibus | fidelibus. Rursum super os putei ponerent. Quia gentibus credentibus Judaei in sua infidelitate permanserunt, et neque Christum, neque profunditatem Scripturarum intelligunt.\
