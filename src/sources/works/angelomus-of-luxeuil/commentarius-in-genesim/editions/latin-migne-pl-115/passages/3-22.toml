text = """
VERS. 24.-- Et ejecit Adam. Haud dubium quin Dominus. Et habitare fecit ante paradisum voluptatis cherubim, et flammeum gladium atque versatilem ad custodiendam viam ligni vitae. Non quod ipsum Adam, | quem ejecerat, Deus habitare fecerit contra paradisum voluptatis, sed quod illo ejecto ante fores paradisi cherubim et flammeum gladium posuerit ad custodiendum paradisum, ne quis possit intrare. Bene cherubim, vel flammeum gladium atque versatilem, ad custodiendum posuit, id est per angelicum ministerium igneam quamdam custodiam [ Z., ignea quaedam custodia], quae tamen congrue versatilis esse dicitur pro eo quod quandoque veniret tempus ut etiam removeri potuisset, videlicet per adventum illius qui suae incarnationis mysterio iter nobis paradisi aperuit. Caeterum ante adventum ipsius omnes mortui ad inferni claustra descendebant: quoniam [ Z., omnes quanquam mundae probataeque vitae fuerint, ad inferni cl. desc. Dubium vero non est quoniam, | etc]. homo, qui per se cecidit, ad paradisum redire, nisi per Dominum, non potuit. Verumtamen, sicut nonnullis videtur, potest intelligi quia Adam ante paradisum posuit, ante paradisum collocavit, scilicet propter spem poenitentiae, ut aspiciens semper beatitudinis locum fortassis poeniteret, et per veram emendationem rediret ad beatam vitam, quam spiritaliter paradisum nominavit. Sed, heu! proh dolor! noluit, sed in sua miseria peccator remansit. Porro in hoc quod superius dicitur accepisse tunicam pelliceam, et modo sistitur ante paradisum, ubi positum est cherubim, et framea ignea, allegorice hoc significatur | [ Z., significat], quod a carnalibus sensibus abstractae voluptates, qui carnaliter viventes sunt; quia sicut pelles abstrahuntur a corpore, ita pravae voluptates a mente, et divinam legem consequuntur; et dum convertuntur ad Deum per flammeam frameam, id est per tribulationes temporales, peccata sua cognoscendo et gemendo, et per cherubim, id est per plenitudinem scientiae, quod est charitas, perveniant ad arborem vitae Christum, et vivant in aeternum. Cherubim namque plenitudo scientiae interpretatur: framea versatilis, posita ad custodiendam viam ligni vitae, temporales poenae intelliguntur. Nemo enim potest pervenire ad arborem vitae, nisi per has duas res, tolerantiam videlicet molestiarum, et plenitudinem scientiae, id est per | charitatem Dei et proximi. Plenitudo legis, inquit Apostolus, est charitas (Rom. XIII, 10).\
"""
