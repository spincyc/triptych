physical_line_ranges = [[197, 199]]
text = """
VERS. 1, 2.-- Cumque elevasset oculos Abraham, sedens in convalle Mambre, vidit tres viros. Quibus tribus, sicut uni, locutus est. Unde quaeritur, cum tres essent, quomodo singulariter Dominum appellat dicens: Domine, si inveni gratiam ante te, ne transeas servum tuum? An intelligebat unum ex eis Dominum, et alios angelos, an potius Dominum in angelis sentiens? Igitur intelligendum est quia in angelis Dominum sentiens, Domino potius quam angelis | loqui elegit. Aliquando imaginibus et ante corporeos oculos ad tempus ex aere assumptis per angelos loquitur Deus, sicut nunc Abraham, qui non solum tres viros videre potuit, sed etiam habitaculo terreno suscipere, eorum usibus etiam cibos adhibere. Nisi enim angeli, cum quaedam nobis in terra nuntiant, ad tempus in aere corpus assumerent, exterioribus profecto nostris obtutibus non apparerent, nec cibos cum Abraham sumerent, nisi propter nos solidum aliquid ex coelesti elemento gestarent. Nec mirum quod illic ipsi qui suscepti sunt, modo angeli, modo Dominus [ Z., dominationes] vocantur, quia angelorum vocabulo exprimuntur qui exterius ministrabant; et appellatione Domini | ostenditur, qui eis interius praeerat, ut per hoc praesidentis imperium et per illud claresceret officium ministrantium.

Spiritaliter per hos tres viros volunt intelligi quidam Dominum nostrum, et Moysen, et Eliam. Quidam Patrem, et Filium, et Spiritum sanctum, sicut in sequentibus legitur: Cum deduceret eos Abraham, unus remansit cum eo, et duo missi sunt Sodomam. Unde per unum qui remansit [ Z. addit cum eo], volunt intelligi Patrem; per duos qui missi sunt, Filium, Spiritum sanctum, qui frequenter leguntur missi a Patre.

Fervor quoque diei et cursus Abrahae desiderium sanctorum significat qui desiderabant adventum Christi, sicut Simeon, et multi alii, de quibus Dominus | apostolis ait: Multi prophetae et reges voluerunt videre quae videtis, et reliqua (Luc. X, 24). Moraliter, quid per hunc nobis cursum Abrahae innuitur, nisi quia videlicet ut vir ac dominus domus, spiritalis noster scilicet intellectus debet in cogitatione Trinitatis claustra carnis excedere, et quasi habitationis infimae januam exire? Cura autem carnis, ut femina, foras non appareat, et videri jactanter erubescat; ut quasi post tergum viri sub discretione spiritus solis necessariis intenta, nequaquam sciat procaciter detegi, sed verecunde moderari. Cui tamen saepe cum dicitur ut de se minime praesumat, et totam se in divinae spei fiduciam transferat, despicit, et cessante studio adesse sibi vitae subsidia posse diffidit. Unde et haec eadem Saraa promissiones Dei audiens | ridet, sed ridens corripitur, correpta autem protinus fecundatur, et quae juventute vigens fecundari non potuit, annis fracta senilibus utero marcente [ Z., marcescente] concepit. Quia cum cura carnis sui confidentiam habere desiderat, contra spem ex divina promissione accipit quod habituram se ex humana ratione dubitavit. Unde bene Isaac, id est risus, dicitur qui generatur, quia dum supernam spei fiduciam concipit, quid mens nostra aliud quam gaudium parit?\
"""
