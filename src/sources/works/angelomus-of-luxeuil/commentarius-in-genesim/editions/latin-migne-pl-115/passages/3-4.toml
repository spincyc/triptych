text = """
VERS. 6.-- Vidit igitur mulier quod bonum esset lignum ad vescendum, et reliqua. Cur mulier consideravit lignum post serpentis persuasionem? Ut exploraret si quid in eo mortiferum esset, et dum nihil in eo tale aspectu reperit, confidentius gustavit. Tulit de fructu illius, et comedit deditque viro suo. Ideo vir consensit feminae, ut nonnulli dicunt, quia forte illam mortuam non vidit ex cibo. Et potuit fieri ut putaverint alicujus significationis causa dixisse Creatorem: Si manducaveritis ex eo, morte | moriemini, et ideo comederunt.\
"""
