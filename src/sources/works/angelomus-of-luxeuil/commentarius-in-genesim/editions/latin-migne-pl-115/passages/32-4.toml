text = """
VERS. 23-29.-- Transductisque omnibus quae ad se pertinebant, remansit solus. Et ecce vir luctabatur cum eo usque mane, et reliqua usquequo ait, nequaquam, inquit, Jacob appellabitur nomen tuum, sed Israel. Quomodo ergo Jacob ab eo postulabat [Petr., postulat] benedici, cui luctando praevaluit? Magna haec est de Christo prophetia. Duplex enim hic Jacob intelligitur, id est carnalis et spiritalis. Praevaluit enim Jacob Christo, vel potius praevalere visus est. Per eos | enim Israeliticos, a quibus crucifixus Christus, et ab eo benedicitur in eis Israeliticis, qui crediderunt in Christum, ex quibus erat qui dicebat: Nam et ego Israelita sum ex genere Abraham, de tribu Benjamin (Rom. XI, 1). Unus ergo atque idem Jacob et claudus et benedictus; claudus in latitudine femoris tanquam in multitudine [Z., magnitudine] generis, de quibus dictum est: Claudicaverunt a semitis suis (Psal. XVII, 46). Benedictus autem in eis de quibus dictum est: Reliquiae per electionem gratiae salvae factae sunt (Rom. XI, 5).

Quae est causa immutati nominis Jacob, ut Israel vocaretur? Varia hujus nominis interpretatio aestimatur. Sed beatus Hieronymus taliter de ejus interpretatione dixit: Sensus itaque hic est: non vocabitur | nomen tuum supplantator, hoc est Jacob, sed vocabitur princeps cum Deo, hoc est Israel. Quomodo enim ego princeps sum, sic tu, qui mecum luctari potuisti, princeps vocaberis. Si autem mecum, Deo, sive angelo, quoniam plerique varie interpretantur, pugnare potuisti, quanto magis cum hominibus, hoc est cum Esau pugnare formidare non debes. Illud autem quod in libro Nominum interpretantur Israel vir videns Deum, sive mens videns Deum, omnium pene sermone detritum, non tam vere quam violenter mihi interpretatum videtur.

Moraliter vero designat angelus Deum et Jacob, qui cum angelo contendit uniuscujusque perfecti viri et in contemplatione positi animam exprimit. Is | enim qui certat in luctamine, aliquando superiorem se, aliquando vero eum cum quo contendit inferiorem invenit. Quia videlicet anima quae contemplari Deum nititur, velut in quodam certamine posita, modo quasi exsuperat, quia intelligendo et sentiendo de incircumscripto nomine aliquid degustat; modo vero succumbit, quia et de gustando iterum deficit. Quasi ergo vincitur angelus, quando intellectu intimo apprehenditur Deus Sed notandum quod isdem victus angelus nervum femoris Jacob tenuit, eumque marcessere statim fecit atque ab eo Jacob tempore uno claudicavit pede. Quia scilicet omnipotens Deus, cum jam per desiderium et intellectu cognoscitur, omnem in nobis voluptatem carnis arefacit, et qui prius quasi duobus pedibus innitentes et Deum videbamur | quaerere, et saeculum tenere, post agnitionem suavitatis Dei unus in nobis pes sanus remanet atque alius claudicat. Quia necesse est ut debilitato amore saeculi solus in nobis amor convalescat Dei. Si enim tenemus angelum, uno claudicamus pede; quia dum crescit in nobis fortitudo amoris intimi, infirmatur procul dubio fortitudo carnis. Omnis quippe qui uno pede claudicat, soli illi pedi innititur quem sanum habet, quia hic cui desiderium terrenum jam arefactum fuerit, in solo pede amoris Dei tota virtute se sustinet. Et in ipso stat, quia pedem amoris saeculi, quem ponere in terra consueverat, jam a terra suspensum portat. Et nos ergo, si ad parentes proprios, id est ad spiritales patres, redimus, teneamus in via angelum, ut suavitate intima | apprehendamus Deum. Contemplativae etenim vitae amabilis valde dulcedo est, quae super semetipsum animum rapit, coelestia aperit, terrena autem debere esse contemptui ostendit, spiritalia mentis oculis patefacit, corporalia abscondit. Unde bene Ecclesia in Canticis canticorum dicit: Ego dormio, et cor meum vigilat (Cant. V, 2). Vigilanti etenim corde dormit, qui per hoc quod interius contemplando proficit, ab inquieto foris opere quiescit. Sequitur:\
"""
