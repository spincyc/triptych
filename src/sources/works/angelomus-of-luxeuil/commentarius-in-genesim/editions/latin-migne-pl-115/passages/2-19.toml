text = """
VERS. 20.-- Appellavitque Adam nominibus suis cuncta animantia, et reliqua. Hic enim juxta litteram ostenditur quanta [ Z., in quanta] dignitate homo pecoribus et animalibus irrationabilibus antecellit, qui intellectu suo cuncta distinguere et nominatim discernere potuit, et secundum qualitates, mores et iras bestiarum nomina imposuit; cui hanc dignitatem Dominus ideo conferre voluit, ut intelligeret seipsum et quanto melior esset animantibus, tanto suum auctorem potius diligeret [ Z., addit: quo se meliorem aliis viventibus intelligeret]. Adam vero | non inveniebatur adjutor similis ejus, id est, quia inter omnia animantia nullum rationale inveniebatur nisi ille solus. Adam interpretatur homo, sive terrenus, sive terra rubra, ex terra enim facta est caro, et humus hominis faciendi materies fuit. Nam spiritaliter quod terra rubra dicitur, significat Christum ex ejus semine carnem suscepturum, qui ab Apostolo secundus Adam dicitur, cujus caro proprio sanguine in passione erat rubricanda [ Z., rubicunda], juxta quod Isaias interrogat dicens: Quare ergo rubrum est indumentum tuum? et reliqua. (Isa. LXIII, 2.)\
"""
