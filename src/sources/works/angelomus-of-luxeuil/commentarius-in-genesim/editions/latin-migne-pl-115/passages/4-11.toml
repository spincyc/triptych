text = """
VERS. 17.-- Cognovit autem Cain uxorem suam, et peperit Henoch. Aliqui dicunt in hoc quod dicit, cognovit uxorem suam, significare quod [ Z., ut significaret quod] vindicta desineret, si uxorem non accepisset. Et aedificavit civitatem, vocavitque nomen ejus ex nomine filii sui Henoch. Henoch dedicatio interpretatur. In ipsius enim nomine civitatem postea aedificavit Cain. Hic primus civitatem construxisse describitur, ut aperte monstraretur quia ipse in terra fundamentum posuit, qui a soliditate aeternae | patriae alienus fuit. Peregrinus quippe a summis, fundamentum in imis posuit, qui stationem cordis in terrena delectatione collocavit. Unde in stirpe ejus Henoch, qui dedicatio interpretatur, primus nascitur; in electorum vero progenie Henoch septimus fuisse memoratur. Quia videlicet reprobi in hac vita, quae ante est, semetipsos aedificando dedicant. Electi vero aedificationis suae dedicationem in fine [ Pert., finem] temporis, id est in septimo exspectant. Hinc est quod Paulo attestante Abraham in casulis habitavit, quia habentem fundamenta civitatem, quam super nos [ Z., supernus] artifex construit, exspectabat.\
"""
