text = """
VERS. 6.-- Post quadraginta dies aperuit Noe fenestram, et emisit corvum, qui egrediebatur et non revertebatur. In Hebraeo scriptum est exiens et revertens, donec siccarentur aquae de terra. Sed ideo, ut nostra translatio innuit, non est reversus, quia aut ab aquis est absorptus et interemptus, aut aliquo cadavere supernatante est illectus, et desuper sedere est delectatus, quod columba naturaliter refugit, de qua dicitur: quae cum non invenisset ubi requiesceret | pes ejus, reversa est ad eum in arcam. Verumtamen requirendum est cur quadragenario numero pluvia inundabat, et iterum post quadraginta dies dicitur Noe fenestram arcae aperuisse? Quadragenarius enim iste spiritaliter tribulationem poenitentiae ostendit. Quod vero post quadraginta dies fenestram aperuit, significat jejunio coelum reserari. Ideo Moyses et Elias, etiam et ipse Salvator, jejunia consecravit, tanquam tribus temporibus necessaria ante legem, sub lege, sub gratia. Sequitur:\
"""
