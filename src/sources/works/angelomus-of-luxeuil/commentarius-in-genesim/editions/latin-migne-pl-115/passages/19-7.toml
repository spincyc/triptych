physical_line_ranges = [[214, 217]]
text = """
VERS. 30.-- Ascenditque Lot de Segor, et mansit in monte, duae quoque filiae cum eo. Timuerat manere in Segor, usquequo ait, conceperunt ergo duae filiae Lot de patre suo. Quo enim consilio filiae Lot, dum [ Z., om. dum] concubitum patris petierunt, vel ab incestu purgari possunt, dum hoc scientes fecerunt, ille vero quasi nesciens? Videtur [ Z., dicunt] namque filias Lot didicisse quaedam de consummatione mundi, quae immineret per ignem, sed tanquam [ Z., nec tamen] puellae intelligere perfecte quae didicerant, nescierunt quod Sodomitis igne vastatis multum adhuc spatium integrum resideret in mundo. Suspicatae sunt tale aliquid factum quale in temporibus audierant | Noe, et ob reparandam mortalium posteritatem solas se esse cum parente servatas. Recuperandi igitur, humani generis desiderium sumunt, atque restaurandi saeculi ex sese dandum opinantur exordium; et quamvis grande eis crimen videretur furari concubitum patris, gravior tamen eis videbatur impietas, si humanae, ut putabant, posteritatis spem servata castitate delerent. Propter hoc ergo consilium ineunt, minori, ut arbitror, culpa, [ Z., addit argumentoque majore] patris moestitiam vel rigorem vino molliunt, et resolvunt, singulis ingressae noctibus, singulae suscipiunt ab ignorante conceptum; ultra non repetunt [ Z., nec ultra rep.] nec requirunt. Ubi hic libidinis culpa? Ubi incesti crimen arguitur? | Quomodo dabitur vitio, quod non iteratur in facto? si Lot quasi incestus in hoc facto culpandus est, an non culpandus est quidem in hoc facto Lot, quantum ebrietatis ignorantia meretur? Nam et hanc lex aeterna condemnat, quae cibum et potum non nisi ad salutem corporis sumere mandat. Et hic diligentius intendendum est quantum sit ebrietatis malum, et valde timendum illis quibus hoc malum in usu est non in crimine. Ebrietas decipit, quem Sodoma non decepit. Uritur ille flammis mulierum, quem sulphurea flamma non ussit. Erat ergo Lot arte, non voluntate deceptus. Ideo medius quidem inter peccatores et justos, quippe qui ex Abrahae quidem cognatione descenderat, in Sodomis tamen habitaverat. Nam et hoc, quod evadit ex Sodomis, sicut Scriptura | indicat, magis ad honorem Abrahae quam ad meritum pertinet Lot.

Fugit itaque Lot a Sodoma, etc. Lot itaque figuram habuisse legis, hujus uxorem illum populum ponimus, qui de Aegypto profectus, et de mari Rubro ac persecutione Pharaonis, tanquam de Sodomiticis ignibus, liberatus, rursum carnes et ollas Aegypti, et cepas cucumerosque desiderans retro respexit, et cecidit in deserto, factusque est etiam concupiscentiae memoria in eremo. Ibi ergo lex primum illum populum tanquam Lot retro respicientem perdidit, ac reliquit uxorem. Inde veniens Lot habitat in Segor, de qua dicit: Civitas haec parva, et salvabo animam meam in ipsa. Ergo quantum ad legem pertinet, civitas pusilla et non pusilla dicitur. | Civitas enim a conversatione multorum est dicta pro eo quod plurimorum in unum contineat vitas. Hi ergo qui secundum litteram legis vivunt, parvam habent conversationem. Nihil enim grande est sabbata et neomenias, circumcisionem carnis et ciborum distinctiones observare carnaliter, spiritaliter vero intelligentibus non est pusilla, sed magna.

Ascendit ergo Lot post haec in montem, et habitabat in spelunca, ipse et duae filiae ejus. Et lex ascendisse putanda est, quod ei per Hierusalem templum constructum accessit ornatus, cum facta est quidem domus Dei domus orationis; mali autem habitatores fecerunt eam speluncam latronum. Duas filias Lot evidenter propheta describit dicens Oollam et Oolibam duas sorores esse, et esse quidem Oolam | Judam, et Oolibam esse Samariam (Ezech. IV, 4). Istae sapientes patrem, et somnum ei inducentes [ Z., patrique som. induc.], id est, tegentes et obruentes ejus spiritalem sensum, solam ex eo carnis intelligentiam trahunt, et inde concipiunt, inde generant filios tales quos nec sentit nec agnoscit pater. Talis quoque posteritas non intret in Ecclesiam Dei. Ammonitae, inquit, et Moabitae non introibunt in Ecclesiam Domini usque in tertiam et quartam progeniem et usque in saeculum (Lev. XXIII, 3), designans quod carnalis generatio legis non intret in Ecclesiam Christi [ Z., Dei], nec per tertiam generationem per Trinitatem, nec per quartam per Evangelium, nec in saeculum.

| Moraliter vero Lot significat rationabilem sensum, et virilem animum eorum qui arcem contemplationis arripere conantur: uxor autem, quae retro respicit, carnem concupiscentiis deditam; duae filiae ejus, duo principalia vitia, superbiam videlicet et vanam gloriam. Observandum est autem forte cum quis effugerit flammam mundi, et incendia carnis evaserit, etiam cum parvam Segor, id est actualem vitam, quae est civilis, supergressus fuerit, et ad altitudinem scientiae et contemplationis velut ad montem ascenderit, ne insidientur ei duae filiae, superbia scilicet et vana gloria; quae idcirco filiae dicuntur quia non extrinsecus, sed de nobis oriuntur, et in spelunca pectoris insidiantur, ut de nobis dormientibus, neque sentientibus, generare possint filios, sensus | utique et actus reprobos. Sunt enim nonnulli qui arcem contemplationis arripiunt; sed dum has secum duas filias ducunt, quodammodo inebriantur ab eis; quia ita mente alienantur a Deo, ut quoscunque filios genuerint, id est, quaecunque opera exercuerint, non per ea in Ecclesiam Domini intrant, sicut Moabitae et Ammonitae videlicet neque per tertiam, neque per quartam generationem; quia non eis proderit notitia Trinitatis neque intelligentia evangelicae praedicationis. Sequitur:\
"""
