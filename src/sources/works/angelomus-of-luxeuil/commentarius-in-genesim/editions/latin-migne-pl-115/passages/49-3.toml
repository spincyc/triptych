text = """
VERS. 5-7.-- | Simeon et Levi fratres, vasa iniquitatis bellantia: in consilium eorum non veniat anima mea, et in coetu illorum non sit gloria mea; quia in furore suo occiderunt virum, et in voluntate sua suffoderunt murum. Maledictus furor eorum, quia pertinax; et indignatio illorum, quia dura. Dividam eos in Jacob, et dispergam illos in Israel. Significat autem non sui fuisse consilii quod Sichem et Hemor, foederatos viros, interfecerint contra jus pacis, et amicitiarum tempore sanguinem fuderunt innocentem, et quasi quodam furore, sic crudelitate raptati murum hospitae urbis everterent. Unde dicit: Maledictus furor eorum, quia pertinax, et reliqua. Et: Dispergam eos in Israel. Levi enim haereditatem propriam non accepit, sed in omnibus | sceptris paucas urbes ad inhabitandum [Cod., ad inhabitandas] habuit. De Simeone vero in libro Jesu scriptum est quod et ipse proprium funiculum non acceperit, sed de tribu Juda quiddam acceperit. In Paralipomenon autem manifestius scribitur quod, cum multiplicatus fuisset et non haberet possessionis locum, exierit in desertum.\
"""
