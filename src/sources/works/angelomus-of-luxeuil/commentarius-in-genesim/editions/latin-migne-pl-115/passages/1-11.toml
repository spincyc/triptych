text = """
VERS. 20-23.-- Dixit igitur Deus: Producant aquae reptile animae viventis, et volatile, usque, benedixit eis Deus dicens: Crescite, et caetera. Hic ostenditur | quia reptilia et volatilia unius naturae sunt atque originis, sed nomine aquae etiam aer iste intelligitur, qui et a sapientibus aquis deputatur [ Z., qui a sapientibus aqua disputatur], eo quod exhalatione aquarum evaporando pinguescit, et volatus avium suscipit. Nisi enim quamdam crassitudinem haberet, volatus illorum non sustineret. Unde aestivo tempore, quando serenum est, terram irrorat et guttae apparent. Et nisi aqua aliquod solidamentum haberet, corpora hominum natantia et volucrum non ferret; et ideo quidquid undosum est et confluidum [ Z., fluidum] piscibus; quidquid vero crassum est et exhalat, avibus deputatur. Quod enim aer pinguis et ventosus, et flatum praebeat, philosophi in monte Olympo probaverunt: quia, inquiunt, quod in | ejus cacumine nec ventus sentiatur, nec nubes colligantur, quoniam excessit altitudine sua totum istum aerem humidum in quo aves volitant, et ideo nec aves ibi volitare asseverantur, solebant per singulos annos causa sacrificiorum cacumen ejus ascendere, et aliquas notas in pulvere scribere, quas alio anno integras inveniebant; quod fieri non posset si ventos aut pluvias locus ille pateretur: et spongias humectatas naribus applicabant, unde crassiorem et consuetum spiritum ducerent, quia tenuitas illius aeris non eos inspirabat. Qui etiam nullam se avem in eo loco aliquando vidisse asserunt. Nam quod ait: Benedixit eis dicens: Crescite, et reliqua, hic primum ideo benedictionem intulit, quia animantia | creata sunt, sive quia futurum erat ut per aquam baptismi homines benedictionem consequerentur.\
"""
