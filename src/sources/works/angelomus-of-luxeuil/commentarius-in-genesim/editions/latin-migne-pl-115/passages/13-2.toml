physical_line_ranges = [[171, 171]]
text = """
VERS. 5-12.-- Sed et Lot, qui erat cum Abram, fuerunt greges ovium, et armenta, et tabernacula; nec poterat | eos capere terra, et caetera, usquequo ait, divisi sunt alterutrum a fratre suo. Lot, qui interpretatur declinans, significat Judaeos qui non credendo declinaverunt a Deo. Abram, prout saepe descripsimus, Dominum significat. Greges Lot et armenta, plebes et diversa conventicula Judaeorum infidelium interpretantur. Unde et bene dicitur: Et facta est rixa inter pastores gregum Abram et Lot. Per pastores Abram significantur apostoli Christi. Per pastores Lot Sadducaei intelliguntur et Pharisaei, qui multum inter se altercati sunt. Sed in hoc quod ait: Chananaeus autem et Pherezaeus habitabant in terra illa, super immundis spiritibus interpretantur, qui potestatem habebant in Judaeis. Seu etiam Lot significat haereticos, quos cum Christiano populo terra, id est | Ecclesia, non capit. Sed pastores Christi et haereticorum seductores, qui pastores se dicunt esse, suis ovibus rixas et contentiones semper excitant in Ecclesia, et ideo dividuntur ab invicem. Recede a me, inquit Abram, obsecro, ad Lot. Si ad sinistram ieris, ego dexteram tenebo; si dexteram elegeris, ego ad sistram pergam. Proprium itaque concedit in hoc Dominus, tanquam Abram arbitrium [ Z., om. arbitrium] fratri suo, Judaico videlicet populo, ex quo carnem assumere dignatus est. Denique per dexteram fides vel vita futura, de qua Ecclesia ait: Laeva ejus sub capite meo, et dextera illius amplexabitur me (Cant. II, 6). Per sinistram vita praesens, quam elegerunt Judaei. Unde et dicitur: Elevatis autem Lot oculis vidit omnem circa Jordanis regionem, et reliqua. | Aliter. Bene ait: si tu ad sinistram ieris, ego dexteram tenebo, etc.; quia in die judicii multi ex Judaeis credituri erunt in Deum, et multi ex credentibus recessuri. Et hoc est quod ait, ego ad sinistram pergam. Tunc enim Christus tanquam Abram in credentibus, qui videbantur esse ejus membra, ad sinistram declinabit. Si autem ad haereticos referre volueris, tunc adimplebitur hoc quod Scriptura dicit, recede a me, obsecro, quando dicturus est eis: Discedite a me, maledicti, in ignem aeternum (Matth. XXV, 41). Unde consequenter subjungitur, si ad sinistram ieris, ego dexteram tenebo, etc. Per dexteram prosperitatem mundialem, quam haeretici eligunt, interpretantur; per sinistram infidelitatem vel infernum. Quod vero Abram dexteram plagam elegit, fidem, | vel regnum sanctorum; quod autem sinistram, confractionem voluntatis, qua in membris suis condescendit his qui in amorem praesentis vitae, quae significatur, ut supra diximus, per sinistram, commemorantur. Unde et Jordanis, ut quidam volunt, in hoc loco doctrinam haereticorum ostendit, a quo irrigabantur universa, quia sic videtur suis, ut bene doctrina ipsorum irrigetur. Quapropter rite [ Z., recte] subinfertur, venientibus in Segor. Segor parvula interpretatur, quia illi qui ab haereticis decipiuntur, in magnis videntur esse, sed in exiguitate ac miseria detinentur et ad nihilum tendunt.\
"""
