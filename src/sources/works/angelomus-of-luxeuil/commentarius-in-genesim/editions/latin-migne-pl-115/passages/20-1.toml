text = """
VERS. 1.-- Profectus inde Abraham in terram australem habitavit inter Cades et Sur, et peregrinatus est in Geraris. Cades solitudo est ubi fons judicii est, | et Cades Barne in deserto, quae conjungitur civitati Petrae in Arabia, ubi occubuit Maria, et Moyses rupe percussa aquam sitienti populo dedit. Monstratur ibidem usque ad praesens, ut beatus Hieronymus ait, sepulcrum Mariae sororis Aaron. Sed et principes Amalech et Codor Lahomor ibi caesi sunt, et interpretatur sancta vel sanctificans, et dicta est fons judicii per anticipationem, sicut supra descripsimus, quia postea sic vocatus est locus ille ubi Moyses judicavit populum Domini. Sur vero solitudo similiter est. Geraris vero, sive Gerara, ut alibi reperi, ex cujus nomine Gerantia vocatur regio trans Daroma (erat enim olim terminus Chananaeorum ad australem plagam), est civitas metropolis Palaestinae, et | fuit Scriptura hic testante inter Cades et Sur, hoc est inter duas solitudines, quarum una Aegypto jungitur, ad quam populus trans fretum Rubri maris pervenit; altera vero Cades usque ad Saracenorum eremum extenditur, ibique peregrinatus est Abraham.\
"""
