physical_line_ranges = [[123, 125]]
text = """
VERS. 19.-- Ex omnibus animantibus mundis tolle septena et septena in arca, de immundis vero duo et duo, masculum et feminam. Sed et de volatilibus coeli septena et septena, masculum et feminam, ut salvetur semen super terram. Quid sibi vult, duo et duo, septena et septena? An quatuor ex immundis, et quatuordecim ex mundis animalibus intelligere debemus introducta fuisse? Minime. Non duo et duo propter | quatuor, sed propter masculum et feminam. Nam de immundis tantummodo duo, et de mundis solummodo septem. Ideo immunda pari numero posuit, munda vero impari, ut haberet unde hostias Deo de mundis immolaret. Et bene pluriora fuerunt munda quam immunda propter futurum usum humano generi, qui ex mundis debebatur hominibus, ut pluriora essent quae prodessent quam quae nocerent. De quibusque animantibus dictum est, in quibus erat spiritus vitae. Non solum de hominibus, sed etiam de caeteris omnibus qui vitali aura vescuntur. Notandum est quod movere solet quosdam utrum tanta capacitate arca describitur, ut esse animalia tanta et tot cum mansiunculis convenientium sibi et escis | eorum ferre potuerit? Tradunt enim Hebraei quod Moyses, ut de illo Scriptura dicit, omni sapientia Aegyptiorum eruditus fuit, et secundum artem geometricam, in qua praecipue Aegyptii callent, cubitorum numero in hoc loco posuerit. Asserunt enim cubitum geometricum tantum valere quantum nostra cubita sex valent. Lege Origenem super hac re contra Apellem disputantem. Denique quod refert Scriptura, ingressa fuisse animalia omnia arcam, non Noe colligente, sed jubente Domino actum est, et ejus nutu coacta sponte praefinito numero veniebant ad arcam.

Sed quaerunt aliqui quid de piscibus vel alitibus [ Z., altilibus], quae in aquis vel super aquas vivere possunt, intelligendum sit? vel si ciniphes minutissimi | et muscae, mures et stelliones, et caetera talia in arcam introducta fuissent? et utrum amplior eorum numerus fuerit quam qui est definitus, et ubi fuissent [ Z., si ibi fuissent]? Sed admonendi sunt, quos haec movent, sic accipiendum quia dictum est, qui et repunt super terram, et necesse non fuerit conservari in arca quae possunt [ Z., solent] in aquis vivere, non solum mersa, sicut pisces, verum etiam supernatantia, sicut multae alites. Deinde cum dicitur, masculus et femina erunt, profecto intelligitur ad reparandum dici. Ac per hoc nec illa necesse fuerat ibi esse quae possunt, sine concubitu, de quibusque rebus vel rerum corruptionibus nasci. Vel si fuerunt, sicut in domibus consueverunt esse, sine ullo numero definito esse potuisse. Aut si mysterium sacratissimum | quod agebatur, et tantae rei figura etiam veritate faciliter [ Uterq. cod., faccialiter] non posset impleri, nisi ut omnia ibi certo illo numero essent quae vivere in aquis, illius natura prohibente, non possunt; non fuit illius hominis cura ista, vel illorum hominum, sed divina. Non enim ea Noe capiens intromittebat, sed venientia et intrantia permittebat. Ea porro quae sic habent sexum ut non habeant fetum, sicut muli et mulae, mirum si fuerunt [ Z., fuerint] ibi, ac non potius parentes eorum ibi fuisse suffecerit, equinum videlicet atque asininum genus, et si qua alias sunt, quae commixtione diversi generis genus aliquod gignunt. Sed et hoc ad mysterium pertinebat. Habet enim et hoc genus masculum et feminam. Quid enim de pace, et unde se invicem | non debellarent divisi generis animantia, sentiendum est? Sicut enim Dei nutu adducebantur in arcam, ita et Dei nutu conservabantur in arca. Seu enim secundum genera sua mansiunculis dividebantur, aut sejuncti [ Z., si junctim] manerent, Dei tamen potentia gubernabantur. Lege librum beati Augustini quintum decimum de Civitate Dei de arca disertum.

Solent etiam nonnulli quaestionem facere quomodo leones et aquilae, et caetera hujusmodi quae carnibus vivere consueverunt, in arca pasci potuerint? Forte, ut doctores opinantur, et alia animalia praeter numerum definitum propter aliorum escam in arcam fuerunt intromissa, vel aliqua cibaria praeter carnes | a viro sapienti, vel Deo demonstrante, quae talium quoque animantium escis convenirent, quod magis credibile est. Nam scimus multa animalia, quibus caro cibus est, etiam pomis vesci [ Z., et poma vesci]. Quid [ Z., Quid vero] de potu animalium sentiendum, de quo nihil dicit Scriptura? Sunt quidam qui putant unius diei escam in arca vel potum in multos prodesse dies illatum animantibus, vel forsitan ad totum annum quod verius esse potest. Sed dimittamus incertas conjecturas, et concedamus divinae potentiae de creaturis suis facere quod voluerit [ Petr., voluit].\
"""
