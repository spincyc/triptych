text = """
VERS. 1-3.-- Ascendit ergo Abram de Aegypto, ipse et uxor ejus, et omnia quae habebat, et Lot cum eo ad australem plagam. Erat autem dives valde in possessione argenti et auri; reversusque per iter quo venerat a meridie in Bethel. Pulchre de Aegypto liberatus | ascendisse dicitur ad australem plagam, id est ad meridiem; non enim legitur declinasse aliquando ad occidentem. Sed occurrit huic sensui illud quod sequitur, quomodo potuerit exiens de Aegypto fuisse dives valde? Quod solvitur illa Hebraica veritate, in qua scribitur: Abram gravis vehementer. Aegypti enim pondere gravabatur. Et licet videantur esse divitiae pecoris, auri et argenti, tamen si Aegyptiae sint, viro sancto, cujus typum tenuit, graves sunt. Denique non, ut in LXX legitur, abiit unde venerat, in desertum usque Bethel, sed sicut in Hebraeo scriptum est, abiit itinere suo per austrum usque Bethel. Idcirco enim de Aegypto profectus est, ut non desertum ingrederetur, quod cum Aegypto reliquerat, sed per austrum, qui aquiloni contrarius est, veniret ad domum | Dei, ubi fuerat tabernaculum ejus inter Bethel et Hai. Igitur Abram in hoc quod ascendit de Aegypto, Dominum ac Redemptorem nostrum significat, qui, ut superius diximus, descendit in Aegyptum, videlicet in hunc mundum, expleto mysterio nostrae redemptionis, ascendit ad Patrem. Unde bene dicitur de Abram quod reversus sit per iter quo venerat in Bethel a meridie; quia ipse unigenitus Filius in suis praedicatoribus in fine saeculi reversurus est ad Judaicam plebem juxta illud: Cum plenitudo temporis subintraverit, tunc omnis Israel salvus fiet (Rom. XI, 25).\
"""
