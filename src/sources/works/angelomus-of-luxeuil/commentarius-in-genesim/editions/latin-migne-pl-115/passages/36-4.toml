text = """
VERS. 24.-- Iste est Ana, qui invenit aquas calidas in solitudine, cum pasceret asinos Sebeon patris sui. Judaei asserunt quod iste Ana nepos Esau equarum greges in deserto ab asinis fecerit primus ascendi, ut mulorum inde nova contra naturam animalia nascerentur. Onagros quoque ad hoc admissos esse ad asinas, et ipsum istiusmodi reperisse | concubitum, ut velocissimi ex his asini nascerentur. Industria quippe humana diversum animal in coitu coegit, sicque adulterina commistione genus aliud reperit, sicut et Jacob contra naturam colorum similitudines procuravit.\
"""
