text = """
VERS. 5-8.-- Videns autem Deus quod multa malitia hominum esset in terra, et caetera usquequo ait: Poenituit eum quod hominem fecisset in terra, et reliqua. Quaeritur quid est quod de Deo dicitur poenituisse eum hominem fecisse. Et iterum, tactus dolore cordis intrinsecus? Nunquid in Deum poenitentia aut dolor cordis cadere potest? Sed sciendum est quia Deus non de facto suo poenitet aut dolet, sicut dolet homo, cui est de omnibus rebus omnino tam fixa sententia quam certa praesentia [ F. praescientia]. | Sed utitur Scriptura sacra usitatis nobis verbis intelligentibus, ut coaptet se nostrae parvitati, quatenus ex cognitis incognita cognoscamus.\
"""
