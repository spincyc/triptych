text = """
VERS. 21.-- Nephthalim cervus emissus, dans eloquia | pulchritudinis. Sive Nephthalim ager irriguus; utrumque enim significat Hebraeum verbum nalasylva. Significat autem quod aquae calidae in ipsa nascuntur tribu. Sive quod super lacum Genesareth fluenta Jordanis irrigua sint. Hebraei autem volunt propter Tiberiadem, quae legis videbatur habere notitiam, agrum irrignum et eloquia pulchritudinis prophetari. Cervus autem emissus propter temporaneas fruges, et velocitatem terrae uberioris ostendit. Sed melius, si ad doctrinam Salvatoris cuncta referamus; quod ibi vel maxime docuerit Salvator, ut in Evangelio quoque scriptum est.\
"""
