text = """
VERS. 3-7.-- Compulit illos oppido ut diverterent ad eum. et reliqua usque: vallaverunt domum a puero usque ad senem. Hinc considerandum est quanta sit virtus hospitalitatis. Ideo angeli quasi hospites coacti domum Lot introisse dicuntur, ut tentata esset charitas Lot, probata et remunerata, ut ostenderetur quantum esset hospitalitatis bonum. Hospitalem vero domum angeli ingressi sunt ad liberandum hospitem suum. Clausas etiam domus hospitibus ignis ingressus est ad perdendos peccatores in eis. Idcirco hospites non sunt evitandi, sed ultro invitandi. Bene enim senes cum pueris cucurrerunt ad scelus, quia | scriptum proverbium est: Adolescens juxta vias suas, etiam cum senuerit, non recedet ab eis (Prov. XXII, 6).\
"""
