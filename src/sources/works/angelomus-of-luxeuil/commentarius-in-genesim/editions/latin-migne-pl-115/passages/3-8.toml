VERS. 10.-- Qui ait: Vocem tuam audivi in paradiso, et timui, eo quod nudus essem, et abscondi me. Miserrimo genere respondit, quasi ideo possit displicere nudus, sicut eum fecerat. Ante peccatum | enim nuditatem suam non advertebat, quia ejus intentio in supernis erat. Nam quod se a Dei praesentia abscondi posse putabat, ei de insipientia poena peccati accidit, eum latere velle quem latere nihil potest.\
"""
