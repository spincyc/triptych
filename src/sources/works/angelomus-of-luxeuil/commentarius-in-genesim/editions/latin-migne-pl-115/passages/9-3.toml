text = """
VERS. 18-19.-- Erant igitur filii Noe Sem, Cham et Japheth, et reliqua usque, ab his disseminatum est omne hominum genus super universam terram. Ab his enim et nepotibus eorum divisus est orbis. Sem, ut aestimatur, Asiam. Dicamus interpretationes singulorum historialiter. Sem dicitur nominatus, quod nomen praesagio posteritatis accepit. Ex ipso enim patriarchae et apostoli, et populus Dei, ex ejus quoque stirpe et Christus, cujus ab ortu solis usque ad occasum magnum nomen ejus in gentibus. Cham Africam calidam, et ipse ex praesagio futuri cognominatur. | Posteritas enim ejus eam terrae partem possidet [ Z., obsidet], quae vicino sole calentior est. Unde et Aegyptus usque hodie Aegyptiorum lingua Cam dicitur. Et Japheth Europam sortitus est. Japheth, latitudo. Ex eo enim populus gentium nascitur, et quia lata est ex gentibus multitudo credentium, ab eadem latitudine Japheth dictus est. De Japheth nati sunt quindecim, de Cham triginta, de Sem viginti septem; simul septuaginta duo fiunt: de quibus ortae sunt gentes septuaginta duae, inter quas misit Dominus totidem discipulos ad praedicandum.\
"""
