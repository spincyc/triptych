text = """
VERS. 27.-- | Dixitque Abraham: Quia semel coepi, loquar ad Dominum meum, cum sim pulvis et cinis, et reliqua usquequo ait: non delebo propter decem. Quare Abraham se pulverem dixit esse et cinerem, dum tantas promissiones accepit a Deo? Sublimitatem promissionum humilitatis temperavit subjectione. Aperte enim intelligitur in quo loco se posuerat, qui pulverem se esse ac cinerem etiam dum cum Deo loqueretur, aestimabat. Si igitur se ita despicit, qui usque ad honorem divinae collocutionis ascendit, sollicita intentione pensandum est qua poena illi feriendi sint, qui ad summam non proficiunt, et tamen de minimis extolluntur.

Quaeri solet utrum quod de Sodomis dixit Deus, non se perdere locum, si invenirentur illic vel decem | justi, speciali quadam sententia de illa civitate, an de omnibus intelligendum sit generaliter parcere Deum loco in quocunque vel decem justi fuerint? Non est necesse ut hoc de omni loco accipere compellamur. Verumtamen de Sodomis potuit sic dici; quia sciebat Deus ibi non esse vel decem, et ideo sic respondebatur Abrahae, ut significaretur, nec tot ibi posse inveniri, ad exagerationem iniquitatis illorum [ Z., inveniri ad excusationem iniq. ill.]. Sed sciendum est quia, quantum ad allegoriam pertinet, per quinquaginta significantur poenitentes, per quinque quadraginta hi qui per quatuor Evangelia gradiuntur, et per quinque sensus corporis abstinent se a malo et faciunt bonum. Per viginti vero, qui utriusque Testamenti | scientiam atque observantiam habent. Per triginta quoque illi designantur qui in fide consistunt sanctae Trinitatis vel in spe futurae beatitudinis. In denario autem numero, qui sub mysterio sanctae crucis se humiliter subdunt, et in dilectione Dei et proximi, quae in Decalogo continetur, perfecti reperiuntur. Sequitur:\
"""
