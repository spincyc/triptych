text = """
VERS. 11-19 passim. --Inde sequitur qualiter Jacob in itinere dormiens, lapidem capiti suo supposuit, et obdormivit, et vidit scalam a terra coelo inhaerentem, innixum scalae Dominum, ascendentes quoque et descendentes angelos conspexit. In itinere quippe dormire est in hoc praesentis vitae transitu a rerum temporalium amore quiescere, et ab appetitu visibilium mentis oculos claudere. Angelos vero ascendentes et descendentes cernere est cives coelestis patriae contemplari, vel quanto amore conditori suo super semetipsos inhaereant, vel quanta compassione charitatis nostris infirmitatibus condescendant. Et notandum valde est quod ille dormiens angelos videt et in lapide caput ponit. Quia nimirum ipse ab exterioribus operibus cessans, interna | penetrat, qui intenta mente, quod principale est hominis, imitationem sui Redemptoris observat. Caput quippe in lapide ponere est mente Christo inhaerere.

Quid est quod Jacob dixit: Terribilis est locus iste. Non est hic aliud, nisi domus Dei et porta coeli? Haec verba ad prophetiam pertinent, quod futurum erat in terra repromissionis Deum verum timere, et colere, tabernaculumque ei fieri, eumque, qui est super omnia benedictus Deus, pedibus suis ambulare in ea. Portam coeli autem sic intelligere debemus tanquam inde fiat aditus credentibus ad capessendum regnum coelorum.

Cur Jacob oleum fudit super lapidem quem erexit in titulum? Non idololatriae fecit simile. Non enim | vel tunc vel postea frequentavit lapidem adorando aut ei sacrificando; sed signum fuit in prophetia evidentissima constitutum quae pertinet ad unctionem. Unde Christi nomen a chrismate est. Prodamus manifestius per singula.

Viditque Dominum Jacob innixum scalae, dicentem sibi: Ego sum Deus Abraham patris tui, et Deus Isaac. Terram in qua dormis tibi dabo. Subauditur, in spe, et semini tuo, in re. Id est Christo, juxta illud: Postula a me et dabo tibi gentes (Psal. II, 8). Vel semen illius, apostoli designantur. Eritque germen tuum, id est fideles, sicut pulvis terrae, prae multitudine [Z., magnitudine] subauditur, dilataberis ad occidentem, et orientem, et septentrionem, et meridiem. | Quod impletum videmus quia in quatuor partibus mundi Ecclesia Christi est dilatata. Et benedicentur in te, id est in Christo, quem tu praefiguras; et in semine tuo, hoc est in apostolis, cunctae tribus terrae, id est omnes nationes terrae.

Et ero custos tuus, quocunque perrexeris. Quia Deus Pater custodivit eum, vel corpus ipsius, quod est Ecclesia. Et reducam te in terram hanc; juxta quod Paulus ait: Caecitas ex parte contigit in Israel. Cum autem plenitudo temporis introierit, tunc omnis Israel salvus fiet (Rom. XI, 25).

Cumque evigilasset Jacob de somno, ait: Vere Dominus est in loco isto. Prophetando dixit, sicut jam manifeste demonstravimus. Quia futurum erat ut Dominus in eadem terra visibiliter appareret. Et ego | nesciebam. Hoc ex persona Judaici populi dixit, qui nescierunt Christum pro salute mundi in terris advenisse. Sequitur:

Appellavitque nomen urbis Bethel. Quae interpretatur domus Dei. Significat Ecclesiam, quae domus Dei est. Quae prius Luza vocabatur, quae interpretatur amygdalum. Significat Judaeam. Sicut amygdalus enim ante omnes arbores folia emittit, ita et Judaea ante omnes gentes notitiam Dei et legis habuit, et quasi fide floruit; et sicut quidem poma amygdali tria continent in se, hoc est corium, testam et nucleum; ita sacra Scriptura, quam Judaea plebs percepit, trinam continet in se intelligentiam, id est physicam, ethicam, et logicam, hoc | est historialem, allegoricam, et moralem significationem.\
"""
