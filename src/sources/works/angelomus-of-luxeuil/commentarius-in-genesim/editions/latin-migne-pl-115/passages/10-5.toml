text = """
VERS. 7.-- Filii Chus: Saba, et Evila, et Sabatha, et Regma, et Sabathaca. Saba, a quo Sabaei, de quibus Virgilius: | . . . Solis est thurea virga Sabaeis. Evila, Getuli in parte remotioris Africae, eremo cohaerentes. Sabatha, Sabathem, qui nunc Astabari nuncupantur. Regma vero et Sabathaca paulatim antiqua vocabula perdiderunt, et quae nunc pro veteribus habeant, ignoratur.

Filii Saba, et Dadan [Z., filius Saba, Dadan. Vulg., Filii Regma: Saba et Dadan ]. Hic Saba per sin litteram scribitur, supra vero per samech, a quo diximus appellatos Sabaeos. Interpretatur ergo Saba Arabia. Nam in septuagesimo primo psalmo, ubi nos habemus: Reges Arabum et Saba munero offerent, in Hebraeo scriptum est: Reges Saba, primum nomen per sin, ut Hieronymus ait, secundum | per samech. Dadan quippe gens est Aethiopiae in occidentali plaga.\
"""
