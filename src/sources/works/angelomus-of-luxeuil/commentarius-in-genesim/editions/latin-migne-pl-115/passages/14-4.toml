text = """
VERS. 14.-- Quod cum audisset Abram, captum videlicet Lot fratrem suum, numeravit expeditos vernaculos trecentos decem et octo. Expeditos dixit juvenes, ad bellum promptos, et qui non fuerunt uxorati, de quibus in sequentibus dixit, exceptis his, quae comederunt juvenes. Et persecutus est usque Dan. Dan Phoenicis oppidum est, quod nunc Paneas dicitur, ubi unus de fontibus Jordanis oritur, qui dicitur | Dan, alter vero Jor. Ex his duobus fontibus, qui haud procul a se distant, in unum rivulum foederatis, Jordanis appellatur, sicut ex duobus fontibus unus fluvius, ita ex nominibus una appellatio creatur [ Z., procreatur].\
"""
