text = """
VERS. 21.-- Consumptaque est omnis caro quae movebatur super terram, et in quibus spiraculum vitae est in terra, mortua sunt. Si enim ita est, quid dicendum de animalibus quorum natura nec semper in aridis, nec semper in humidis vivere potest, sicut sunt lutri et vituli marini; et multa avium genera in aquis victum requirunt, sed in arduis dormiunt, nutriuntur et requiescunt? Dicendum est quia potuit virtus divina utramque eorum naturam, donec diluvium transiret, temperare; ut aut in humido tantum, aut in arido vivere possent. Nisi forte extra arcam in aliqua ejus parte loca illis praeparata essent unde et in aquis vivere et in aridis requiescere | potuissent.\
"""
