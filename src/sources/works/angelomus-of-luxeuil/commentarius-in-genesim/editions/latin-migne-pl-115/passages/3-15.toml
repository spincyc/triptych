text = """
VERS. 17.-- Adae vero dixit: Quia audisti vocem mulieris, et comedisti de ligno, et reliqua. Non enim opera, ut plerique putant, hic ruris colendi, sed peccata significat. Sed libet inquirere quare Creator in delicto Adae terrae maledixit, et non aquis? Ideo videlicet quia de terrae fructu contra interdictum manducavit homo, non de aquis bibit, et quia praedestinavit | Deus in aquis abluere peccatum quod de fructu terrae contraxit homo. Et terrestria animalia plus maledictionis habent quam aquatilia, quia plus de maledicta terra vivunt quam aquatilia. Et ideo Christus post resurrectionem de pisce manducare voluit, non de aliquo animali terrestri. Ecce! Per peccatum hominis terra maledicitur, ut spinas pareret et venenosas herbas, ad poenam videlicet vel ad exercitationem mortalium, et ut ante oculos haberet homo originale peccatum, et vel sic admonitus aliquando averteretur a peccatis, sicut longe superius dictum est. Dicit enim, maledicta terra, et reliqua. Cum certo novimus quod maledictum Scriptura sacra prohibet, quid est quod nunc peccanti homini | terrae maledictione hoc, quod homo divina voce facere prohibetur, infertur? Sed sciendum est quod Scriptura duobus modis maledictum commemorat: aliud videlicet quod approbat, aliud quod damnat. Aliter enim maledictum profertur judicio justitiae, aliter livore vindictae. Maledictum quippe judicio justitiae peccanti homini probatum est, cum audivit: Maledicta terra in opere tuo. Maledictum judicio justitiae profertur, cum ad Abraham dicitur: Maledicam maledicentibus tibi. Rursum quia maledictum non judicio justitiae, sed livore vindictae promitur, voce Pauli praedicantis admonemur, qui ait: Benedicite et nolite maledicere (Rom. XII, 4). Et rursum: Neque maledici regnum Dei possidebunt (I Cor. VI, 10). Deus ergo maledicere dicitur, et tamen maledicere | homo prohibetur, quia quod homo agit malitia vindictae, Deus non facit nisi [ Z., ait, malitia vindictae est; Deus autem non facit nisi, etc.], examine et virtute justitiae. Cum vero sancti viri maledictionis sententiam proferunt, non hanc ex voto ultionis, sed ex justitiae examine erumpunt. Intus enim subtile Dei judicium aspiciunt, et mala foras exsurgentia, quia maledicto debeant feriri, cognoscunt, et eo in maledicto non peccant, quo ab interno judicio non discordant. Allegorice quoque spinae in significatione peccatorum ponuntur. Ait enim:\
