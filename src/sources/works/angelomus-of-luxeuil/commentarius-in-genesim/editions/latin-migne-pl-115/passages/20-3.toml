text = """
VERS. 12-15.-- Respondit Abraham: Alias autem vere soror mea est, filia patris mei, et non filia matris meae. Pater enim, ut nonnulli volunt, pro fratre ponitur, Thara itaque genuit Abraham, et Aran, cujus | filia exstitit, Scriptura teste, Saraa. Et ideo dixit, sororem suam esse, sive quia de semine su patris procreando per filium nata est Saraa, et consuetudo est etiam Scripturarum consobrinos fratres appellari, similiter et sorores. Propterea non immerito ait: Alias soror mea est. Et quia fuerunt Abraham et Aran de uno patre, et non de una matre, idcirco subjunxit, filia patris mei, et non filia matris meae.\
"""
