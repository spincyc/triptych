text = """
VERS. 20.-- Et vocavit Adam nomen uxoris suae Eva, eo quod mater esset cunctorum viventium. Eva interpretatur vita, sive calamitas, sive vae. Vita, quia origo fuit nascendi, et ideo mater cunctorum dicitur. Calamitas et vae, quia per praevaricationem causa exstitit moriendi; a cadendo enim calamitas nomen sumpsit. Alii autem dicunt: Ob hoc Eva vita et calamitas est appellata, quia saepe mulier viro | causa salutis est, saepe calamitatis, et mortis, quod est vae. Spiritaliter in hoc quod vita interpretatur, significat Ecclesiam, quae mater vivorum, id est recte factorum vocatur, quibus contraria sunt peccata, quae nomine mortuorum significantur.\
"""
