VERS. 9-24.-- Aliud quoque Joseph vidit somnium, quod narrans fratribus suis, ait: Vidi somnium, quasi solem, et lunam, et stellas undecim adorare me. Quomodo impletur somnium Joseph, quod dicit se vidisse | solem, et lunam, et undecim stellas adorasse se; dum constat eo regante in Aegypto matrem ejus Rachel multo ante esse defunctam; imo nec patrem eum legimus adorasse? Ergo in Christo facile [ uterque cod., facilis] est somnii perfectionem intelligere, cui donatum est nomen quod est super omne nomen, ut in nomine Jesu omne genu flectatur, et reliqua (Philipp. II, 10).\
