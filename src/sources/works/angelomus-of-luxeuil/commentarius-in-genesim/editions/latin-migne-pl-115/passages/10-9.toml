text = """
VERS. 15-18.-- Chanaan genuit Sidonem primogenitum suum, et Hethaeum, et Gebusaeum, et Amorrhaeum, et Gergesaeum, et Hevaeum, et Aracaeum, Asinaeum, et Aradium, et Samariten, et Amathaeum. De Chanaan primus natus est Sidon [ Z., Sidona], a quo urbs Phoeniciae Sidon vocatur. Dein Aracaeus, qui Arcas condidit, oppidum contra Tripolim in radicibus Libani. Aradii sunt qui Aradum insulam possederunt, angusto freto a Phoenicis littore separatam. Samariten, emissa nobilis Syriae Coeles civitas. Amath tam a Syris quam ab Hebraeis, ita ut apud veteres dicta fuerat, appellatur. Hanc Macedones Epiphaniam | vocant. Nonnulli Antiochiam ita appellatam putant.\
"""
