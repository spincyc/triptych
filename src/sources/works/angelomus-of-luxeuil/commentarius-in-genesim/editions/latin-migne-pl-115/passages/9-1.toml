text = """
VERS. 3-4.-- Quasi olera virentia tradidi vobis omnia, excepto quod carnem cum sanguine non comedatis. Sanguinem enim animarum vestrarum requiram de manu cunctarum bestiarum et de manu hominis, et reliqua. Quanti enim effuderunt sanguinem, et sanguis eorum effusus non est, et alii occiderunt | hominem veneno, vel suspendio, et eorum sanguis non est effusus! Quomodo ergo Dominus effusurus est sanguinem eorum, cum illius [ Petr. illi, vel ille] qui occidit, sanguinem effuderit? Et in resurrectione ridiculum est, et in hac vita, et ideo sanguis hominis vitale [ Z., vitalis], quo vegetatur, et sustentatur, et vivit, debet intelligi; quod qui effuderit sive per scandalum, sive perversitate doctrinae, in die judicii effudetur ab eo, qui [ Petr., quod] sibi videbatur habere vitale. Caeterum, historialiter, post diluvium primum esus carnium homini conceditur, videlicet propter infecunditatem terrae, ut aestimatur, et hominis fragilitatem.\
"""
