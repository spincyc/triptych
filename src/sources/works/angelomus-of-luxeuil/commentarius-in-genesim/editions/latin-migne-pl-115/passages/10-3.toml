text = """
VERS. 4, 5.-- Filii Jaban Elisa, et Tharsis, Cethim, et Dodanim. Ab his divisae sunt insulae nationum in terris suis, vir secundum linguam suam, et cognitionem, et gentem suam. De Ionibus, id est Graecis, nascuntur Helisei, qui vocantur Aeolides, unde et quinta lingua Graeciae Aeolis appellatur. Denique Tharsis Josephus Cilicias arbitratur. Unde et metropolis civitas eorum Tharsis appellatur Paulo apostolo gloriosa. Cethim Cithii [ Z., Scitii,] a quibus hodieque urbs Cypri nominatur. Dodanim, Rhodii. | Denique, sicut in Antiquitatum libris invenitur, omnes pene insulas et totius orbis littora, terrasque mari vicinas, a Graecis accolis occupatas usque Oceanum possedere Britannicum, videlicet a Tauro et Amano montibus, ut supra diximus.\
"""
