text = """
VERS. 22, 23, etc.-- Et aedificavit Dominus Deus costam quam tulerat de Adam in mulierem, et reliqua, usque quo ait: et vocabitur virago, quoniam de viro sumpta est. Quomodo hic feminam aedificatam dicit, qui superius ab omni opere suo requievit? Non enim hic creavit in materia, sed expressit in forma. Dixitque Adam: Hoc nunc os ex ossibus meis, et reliqua. Vocavit ergo uxorem suam vir tanquam potior inferiorem, et dixit: Hoc os ex ossibus meis, etc. Os de ossibus meis fortassis propter fortitudinem, et caro de carne propter temperantiam. Hae namque duae virtutes ad inferiorem animae partem, quam prudentia rationalis regit, docentur pertinere allegorice. | Haec vocabitur virago. In quibusdam codicibus invenitur, haec vocabitur mulier. Non enim videtur in Graeco et in Latino resonare cur mulier appelletur, quia ex viro sumpta sit; sed etymologia in Hebraeo sermone servatur [ Z., servetur]: vir quippe vocatur Is et mulier Issa. Recte igitur ab Is appellata est mulier Issa. Et hoc est quod hic ait, haec vocabitur virago, quoniam de viro sumpta est.\
"""
