text = """
VERS. 3.-- Dixitque Deus: Fiat lux, et reliqua. Quid est enim quod ait, dixit Deus? Nunquid sonando transeuntibus sonis locutus est? Minime. Ipse enim incorporeus est, et si loquitur, nunquid lingua Hebraea, Graeca, aut Latina loquitur? Non. Sed quod ait, dixit Deus, non ipse sonus accipitur locutionum [ Z., locutionis], sed illud quod intelligitur in sono. Apud Deum purus intellectus est sine strepitu et diversitate | linguarum. Dicere itaque Dei facere est, sicut scriptum est: Ipse dixit, et facta sunt, et caetera (Psal. CXLVIII, 5). Verbum vero Dei unigenitus Filius est, Joanne attestante, qui ait: In principio erat Verbum, et reliqua. Porro quod ait, dixit, id est, in Verbo suo aeternaliter manente fecit. Caeterum quod ait, fiat lux, ob celeritatem divinae potentiae dicitur. Si enim quarta die describuntur luminaria facta, quae lucem administrant, quid est quod dixit, Fiat lux? An forsitan jam erat aliqua lux creata supra firmamentum, quo lumine sol illuminaretur? Sed nomine lucis angelica dignitas figuratur, quae profecto per superius coelum significatur, nunc lux dicitur. Prius itaque condita est, sed postea convertendo | ad contuendam gloriam sui creatoris lux effecta. Et ideo dictum est: Fiat lux, et facta est lux. Ac si manifeste diceretur: Convertatur ad contemplandum incessabiliter me. Decebat autem ut ipsa angelica dignitas, quae [Z., quia] sua dignitate cunctis creaturis excellebat, inhaerendo summae luci lux vocaretur, licet mutabilis esset condita. Si enim immutabilis esset condita, nullatenus alii merito superbiae ab illa aeterna visione corruerent. Sed quae [Z., quia] mutabilis exstitit natura, caeteris ruentibus, gratia divinae largitionis fecit immutabilem. Sed notandum quod quidam doctorum juxta fidem historiae simpliciter hoc intelligi volunt. Aiunt enim quod in superioribus ejusdem terrae partibus, quas et nunc diurna solis lux illustrare consuevit, principalis | haec lux emicuit, cujus visione beatissimi angeli frui coeperant. Nec [ Z., non est] mirandum, divina operatione lucem in aquis posse resplendere, cum et hominum operatione constat eas saepius illustrari, nautarum videlicet (Z., videlicet more], qui in profundo maris demersi, emisso ex ore oleo, perspicuum sibi hoc ac lucidum reddunt. Si enim homo talia per oleum sui oris potest, quantam Deus per Spiritum oris sui lucem creare posse credendus est? Lege Hexaemeron Bedae, moderni doctoris, si ita volueris. Nos quidem beati Augustini, prout prius inseruimus, dicta sequi decrevimus.\
"""
