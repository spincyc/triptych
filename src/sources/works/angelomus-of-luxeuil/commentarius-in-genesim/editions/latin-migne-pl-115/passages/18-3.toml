physical_line_ranges = [[201, 201]]
text = """
VERS. 20-26.-- Dixitque Dominus: Clamor Sodomorum et Gomorrhae multiplicatus est, et peccatum eorum aggravatum est nimis. Descendam, et videbo utrum clamorem qui venit ad me, opere compleverint. Quis est clamor Sodomorum? vel quid est quod Dominus dixit, descendam, et videbo utrum clamorem qui venit ad me, opere compleverint? Peccatum cum voce est culpa in actione; peccatum vero etiam cum clamore et culpa cum libertate et jactantia. Quod autem dixit, descendam et videbo, et caetera ejusmodi, omnipotens itaque Dominus, et omnia sciens, cur ante probationem quasi dubitat, nisi ut gravitatis nobis exemplum proponat, ne mala hominum ante | praesumamus credere quam probare? Et ecce per angelos ad cognoscenda mala descendit, et mox facinorosos percutit, atque ille patiens, ille mitis, ille de quo scriptum est: Tu autem, Domine, cum tranquillitate judicas (Sap. XII, 1), ille de quo rursum scriptum est: Dominus patiens est, cum tanto crimine involutos inveniens, quasi patientiam praetermisit, et diem extremi judicii exspectare ad vindictam noluit, sed eos igne judicii ante diem judicii praevenit! Ecce malum et quasi cum difficultate credidit, cum audit; et tunc sine tarditate percussit, cum verum cognoscendo reperit! Ut nobis videlicet daret exemplum, quia majora crimina et tarde credenda sunt cum audiuntur, et citius punienda cum veraciter agnoscuntur.\
"""
