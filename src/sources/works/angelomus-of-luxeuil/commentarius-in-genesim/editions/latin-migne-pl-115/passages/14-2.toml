| VERS. 7.-- Et reversi venerunt ad fontem Mesfat, ipsa est Cades. Fons Mesfat fons est judicii, hoc est Cades; per anticipationem dicitur quod postea sic vocatum est. Significat autem locum apud petram, qui fons judicii nominatur, quia ibi Deus populum judicaverit. Et percusserunt omnem regionem Amalecitarum, et Amorrhaeum sedentem in Assasonthamar. Hoc est oppidum quod nunc vocatur Engaddi, balsami et palmarum fertile, sicut in libris Locorum reperi. Assason autem thamar interpretatur urbs palmarum. Thamar quippe palma dicitur. Sequitur:\
