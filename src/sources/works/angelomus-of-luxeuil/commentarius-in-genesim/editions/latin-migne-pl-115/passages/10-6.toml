text = """
VERS. 8.-- Porro Chus genuit Nemrod. Iste coepit esse potens in terra, et erat robustus venator coram Domino, et reliqua. Nemrod iste arripuit insuetam prius in populos [ Z., populis,] tyrannidem, regnavitque in Babylon [ Z., Babylone,] quia ab eo ibi confusae sunt linguae turrem aedificantium, et Babel appellata est, quae interpretatur confusio. Regnavit autem et in Arach, hoc est in Edissa, et in Archad, quae nunc dicitur Nibisis [ Z., Nobilis. Leg. Nisibis], et in Chalanne, quae postea a Seleuco rege dicta est Seleucia. Qui congrue robustus venator coram Domino dicitur, seu, sicut in quibusdam codicibus invenitur, quod melius nobis videtur, robustus venator | contra Dominum, id est hominum terrenorum suppressor et exstinctor. Erigebat ergo [ Z., iste igitur erig.] cum suis populis turrem contra Dominum, in qua est impia significata superbia; quoniam dominatio imperantis in lingua est, et ibi est damnata superbia, ut non intelligeretur jubens homini, quae noluit intelligere, ut obediret Deo jubenti. Sic illa conjuratio dissoluta est, cum quisque ab eo quem intelligebat, abscederet, nec se nisi ei cum quo loqui poterat aggregaret, et per linguas divisae sunt gentes dispersaeque per terras. Sequitur:\
"""
