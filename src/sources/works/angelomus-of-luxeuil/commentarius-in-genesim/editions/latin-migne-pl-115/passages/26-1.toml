text = """
VERS. 12-16.-- Sevit autem Isaac in terra illa, et invenit in ipso anno centuplum. Licet in aliena terra seminaverit, non puto quod tanta ei fertilitas frugum fuerit. Unde melius puto illud esse quod habetur in Hebraeo, et Aquila quoque transtulit: Et invenit in anno illo centuplum aestimatum. Tacens enim Scriptura genus frugum quod centuplicaverat, videtur mihi cunctarum in illo virtutum ostendisse multiplicationem. Denique sequitur: Et benedixit ei Dominus, et magnificatus est vir, et ambulabat videns, et magnificatus est, donec magnus | fieret vehementer. Fertilitas autem et multiplicatio hordei, ignoro, si quem possit facere gloriosum. Verum in quibusdam codicibus invenitur: Seminavit post haec hordeum, et invenit centuplum. Quod hordeum seminat, et non frumentum, et tamen benedicitur in eo, et magnus efficitur, apparet quod nondum erat magnus; sed posteaquam seminavit, et collegit centuplum, tunc factus est magnus valde. Hordeum quippe jumentorum maxime cibus est et servorum. Nam Isaac significat sermonem Dei. Qui sermo in lege hordeum seminat, in Evangeliis triticum. Ille enim cibus perfectioribus et spiritalibus, hic imperitioribus et animalibus paratus est; quia scriptum est: Homines et jumenta salvos facias, Domine (Psal. XXXV, 7). Et tamen in ipso hordeo invenit | centesimum fructum. Invenis enim in lege martyres, quorum est centesimus fructus. Seminavit hordeum, legem videlicet exponendo, et manifestavit, quod lex spiritalis est. Tunc seminavit triticum, evangelicam videlicet praedicationem. Inde est quod prius quinque millia hominum de quinque panibus, deinde quod quatuor millia de septem panibus saturavit.\
"""
