text = """
| VERS. 1, 2.-- Hae sunt generationes filiorum Noe, Sem, Cham et Japheth. Filii Japheth Gomer, et Magog, et Madai, Jaban, et Tubal, et caetera. Jam incipit describere, qualiter a filiis et nepotibus Noe gentes exortae fuerunt. Sed sciendum est quia non hodie ita reperiuntur sicut in exordio ab eis progenitae singulae fuerunt et nomina acceperunt. Quoniam, ut beatus Augustinus ait, aut ab hostibus interemptae penitus fuerunt, aut a propriis sedibus ad alia loca transierunt et antiqua quoque vocabula perdiderunt. Verumtamen ne indiscusse praeterisse videremur, multa ex eis, sicut in doctoribus reperimus, et nobis tradita etiam fuerunt, qualiter ab hominibus vocabula sumpserunt, inserere conati sumus. | Japheth, filii Noe, prout superius innuimus, nati sunt septem filii, qui possederunt terram in Asia ab Amano, et Tauro, Syriae-Coeles, et Ciliciae montibus usque ad fluvium Tanain, sicut in libris Locorum beati Hieronymi comperi. In Europa vero usque ad Gadira nomina locis et gentibus relinquentes, e quibus postea immutata sunt plurima, et caetera permanent ut fuerunt. Sunt autem Gomer Galatae, Magog Scythae, Madai Medi, Jaban Iones, qui et Graeci, unde et Mare Ionicum; Tubal Iberi, qui et Hispani, qui et Celtiberi, licet quidam Italos suspicentur, Mosoch Cappadoces. Porro Septuaginta interpretes Capturim Cappadocas arbritantur, Iras Thraces. Nonnulli quidem Gog et Magog ad Gothorum gentem transtulerunt, quia Gothos omnes retro | eruditi magis Getas quam Gog appellare consueverunt.\
"""
