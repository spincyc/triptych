VERS. 1, 2.-- Venerunt duo angeli Sodomam vespere, sedente Lot in foribus civitatis, et caetera. Quare Abraham in tribus viris, si Deum intellexit, vel angelos, et iterum Lot in duobus eos humano cibo vesci putabat? Fortasse prius esse homines arbitrati sunt; in quibus Deum loqui intellexerunt, quibusdam divinae majestatis existentibus et apparentibus | signis, postea fuisse angelos cognoverunt, cum eis videntibus in coelum issent.\
