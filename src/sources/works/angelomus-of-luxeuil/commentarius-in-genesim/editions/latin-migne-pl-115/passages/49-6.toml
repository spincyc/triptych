text = """
VERS. 14, 15.-- Isachar, asinus fortis, accubans inter terminos. Vidit requiem quod esset bona, et terram quod optima, et supposuit humerum suum ad portandum, factusque est tributis serviens. Quia de | Zabulon dixerat quod maris Magni littora esset possessurus, Sidonem quoque et reliquas Phoenicis urbes contingeret, nunc ad mediterraneam provinciam redit, et Isachar, qui juxta Nephthalim pulcherrimam in Galilaea regionem possessurus est, benedictione sua habitatorem facit. Asinum autem osseum vel fortem vocat, et humerum ad portandum; quia in labore terrae et vehendis ad mare, quae in finibus suis nascebantur, plurimum laboraret, regibus quoque tributa comportans. Aiunt Hebraei per metaphoram significari, quod Scripturas sanctas die ac nocte meditans, studium suum dederit ad laborandum, et idcirco ei omnes serviunt, quasi magistro dona portantes.\
"""
