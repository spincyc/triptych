physical_line_ranges = [[362, 363]]
text = """
VERS. 8-21.-- Habitavitque Esau in monte Seir; ipse est Edom, et haec nomina filiorum ejus: Eliphaz filius Ada, uxoris Esau, et reliqua usquequo ait, hi duces eorum, ipse est Edom, et isti filii Seir Horraei habitatores terrae: Lotha, et Sobal, et Sebeon, et Ana. Eliphaz, filius Esau, ipse est qui in libro beati Job legitur. Edom vero, et Seir, et Esau unius nomen est hominis: trinomius enim fuit, et ex propriis causis varie nuncupatus. Dicitur enim Esau, id est rufus, ob coctionem scilicet rufae lentis ita appellatus, cujus edulio primogenita perdidit. Edom autem ob ruborem corporis dictus est, quod Latine sanguineus | dicitur. Seir vero, quod fuerit hispidus et pilosus: quando enim natus est, totus sicut pellis pilosus erat et non habebat lenitatem. Quod autem sequitur:

Et Horraei habitantes, seu, sicut in quibusdam codicibus invenitur, Corraei, et reliqua. Postquam numeravit filios Esau, altius repetit, et exponit quanti Esau in Edom terra principes fuerint ex genere Horraeorum, qui in lingua nostra interpretantur liberi. Legamus diligenter Deuterononium, ubi manifestius scribitur quomodo venerint filii Esau, et interfecerunt Corraeos, ac terram eorum in haereditatem possederunt [Z., eor. haereditate possed.].\
"""
