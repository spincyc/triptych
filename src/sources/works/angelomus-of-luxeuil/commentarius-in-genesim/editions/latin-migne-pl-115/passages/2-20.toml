text = """
VERS. 21.-- Immisit ergo Dominus soporem in Adam, et reliqua. Quid est quod dicitur: Immisit soporem, ut mulierem formaret? Nunquid non poterat Deus vigilanti costam educere feminamque formare? | An forte ne doleret latus, quando costa detracta est, propter hoc oportebat ut ille dormiret? Quis est qui sic dormiat, ut ossa non evigilanti evellantur? An quia Deus evellebat, propterea homo non sentiebat? Poterat ergo vigilanti sine dolore evellere, qui poterat dormienti. Sed causa mysterii actum est. Ideo mulier non de terra plasmata est sicut vir, sed de latere viri dormientis, quia futurum erat ut Christus propter Ecclesiam in cruce dormiret, ex cujus latere fons salutis nostrae emanaret et formaretur Ecclesia. Et replevit carnem pro ea. Quid hoc est, nisi quia Christus posuit carnem suam in passione pro Ecclesia? Unde enim Adam infirmatus est, inde mulier fortis effecta [ Z., effecta est]; quia | per hoc quod Christus infirmari dignatus est in passione, inde Ecclesia corroborata est.\
"""
