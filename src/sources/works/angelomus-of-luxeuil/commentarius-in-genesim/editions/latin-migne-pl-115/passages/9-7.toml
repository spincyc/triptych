text = """
VERS. 27.-- Dilatet Deus Japheth, et habitet in tabernaculis Sem, sitque Chanaan servus ejus. Cur hoc intulit? De Sem Hebraei, de Japheth gentium populus nascitur. Quia igitur lata est multitudo credentium, | a latitudine, quod Japheth interpretatur, nomen accepit. Quod autem ait, habitet in tabernaculis Sem, de nobis prophetatur, qui in eruditione scientiae Scripturarum ejecto Israele versamur. Sed tunc completum est historialiter quando Romani Judaeam ceperunt.\
"""
