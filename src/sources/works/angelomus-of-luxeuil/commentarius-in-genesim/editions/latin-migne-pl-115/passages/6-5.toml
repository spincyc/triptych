text = """
| VERS. 13.-- Dixitque Dominus ad Noe: Finis universae carnis venit coram me. Universae enim carnis significatur omnium mortalium, praeter illos qui in arca salvandi erant. Illi igitur quasi seminarium secundae originis servati sunt. Sequitur: Et disperdam eos cum terra. Quomodo cum terra, cum terra postea remansit? Tradunt enim doctores terrae vigorem et fecunditatem longe inferiorem esse post diluvium quam ante, et idcirco hominibus carnem edere licentiam esse datam, et ante etiam diluvium fructibus terrae solummodo victitasse.\
"""
