text = """
VERS. 18-22.-- Porro Henoch genuit Irat, et reliqua usque: et Mathusalem genuit Lamech, qui accepit | uxores duas, nomen uni Ada, et nomen alteri Sella. Lamech quippe interpretatur percutiens. Ipse percussit et interfecit Cain. Et ipse primus adulterium commisit, eo quod se in duabus uxoribus divisit. Hic notandum est quod in progenie Seth nulla ibi progenita femina nominatim exprimitur, nisi tantum in progenie Cain commemoratur; per quod significatur terrenam civitatem, qua [ Z., quae] Cain cepit [ Petr., concepit], usque sui in finem carnales habituram generationes, quae marium ac feminarum conjunctione proveniunt [ Z., quae per maritorum ac feminarum conjunctiones perveniunt]. Unde ad testimonium Sella umbra ejus interpretatur.\
"""
