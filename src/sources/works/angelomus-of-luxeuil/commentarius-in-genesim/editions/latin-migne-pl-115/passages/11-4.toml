text = """
VERS. 9.-- Et idcirco vocatum nomen ejus Babel, quia ibi confusum est labium universae terrae, et reliqua. Si Deus requievit ab omnibus operibus suis die septimo, unde subito tanta apparuit diversitas linguarum? Sed sciendum est quia non in hac divisione inguarum novum aliquid condidit Creator, sed dicendi modos et formas in diversis loquelarum generibus | divisit. Unde easdem syllabas et ejusdem potestatis litteras aliter conjunctas, a diversis invenimus gentium linguis; saepe etiam et eadem nomina, vel verba aliud aliquid significantia in alia lingua, atque aliud in alia. Ubi dicimus in psalmo: In virga ferrea (Psal. II, 9), in Graeco habetur: en rabdo sidera [ ἐν ῥάβδῳ σιδηρᾶ]. Igitur in Latino sidera non ferrea significat sicut in Graeco, sed astra. Sed notandum est quia illa lingua in sola familia Heber remansit, ex quo Hebraei dicti sunt, in ea parte hominum quae Dei portio permansit, in qua et Christus nasciturus erat. Oportebat enim ut in ea lingua salus mundo primo praedicaretur, per quam primum mors intravit in mundum. Ostendit quoque titulus in cruce Salvatoris scriptus, hanc esse omnium linguarum primam.\
"""
