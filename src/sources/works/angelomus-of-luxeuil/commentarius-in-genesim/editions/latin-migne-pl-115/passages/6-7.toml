text = """
VERS. 15.-- Trecentorum cubitorum erit longitudo arcae; quinquaginta cubitorum latitudo et triginta cubitorum altitudo illius. Qualem ergo arcae speciem vel formam debemus intelligere? Ut videtur, quatuor angulis eam ex imo assurgentem, et eisdem paulatim usque ad sinum in angustum attractis, in spatium unius cubiti fuisse collectam. Sic enim dicitur, quia in fundamentis trecenti cubiti, in longitudine quinquaginta sint, et in altitudine triginta, sed collecta in cacumen | angustum, ita ut cubitum sit longitudinis et latitudinis. Et vere nulla potuit tam conveniens et congrua arcae species dari, quam ut summo velut e tecto quodam angusto culmen defenderet imbrium ruinas, et ima in aquis quadrata stabilitate consistens nec impulsu ventorum, nec impetu fluctuum, nec inquietudine animalium quae intrinsecus erant, aut inclinari possit aut mergi.\
"""
