VERS. 11.-- De terra illa egressus est Assur, et aedificavit Niniven, et Roboot civitatem, sicut in quibusdam codicibus invenitur. De hac terra Assyriorum pullulavit imperium, qui ex nomine Nini, Belis filii, | Ninum condiderunt, urbem magnam, quam Hebraei appellant Niniven. Quod autem ait, aedificavit Niniven et Roboot civitatem, non putemus duas esse urbes; sed quia Roboot plateae interpretantur, ita legendum est, et aedificavit Niniven et plateas civitatis.\
