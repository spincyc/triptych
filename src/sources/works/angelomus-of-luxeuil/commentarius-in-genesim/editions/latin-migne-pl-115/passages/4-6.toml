text = """
| VERS. 9. 10.-- Dixitque ei Dominus: Ubi est Abel frater tuus? et reliqua. Non tanquam ignarus, sed tanquam judex, reum quem puniat, interrogat. Cui Cain ad cumulum damnationis suae fallaciter ac superbe respondit dicens: Nescio. Nunquid custos fratris mei sum? Dixitque Dominus: Quid est, quod fecisti? Ecce vox sanguinis fratris tui clamat ad me de terra. Quaeritur quomodo sanguis Abel clamat ad Deum? Clamat namque ad Deum, quia homicidii illius reatus in conspectu justi judicis apparebit.\
"""
