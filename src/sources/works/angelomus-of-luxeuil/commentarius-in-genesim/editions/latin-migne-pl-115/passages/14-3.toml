text = """
VERS. 8, 13.-- Et egressi sunt rex Sodomorum, et rex Gomorrhae, rexque Adamae, etc., usquequo ait: Quatuor reges adversus quinque. Vallis autem silvestris | habebat puteos bituminis multos. Itaque rex Sodomorum, et Gomorrhae terga verterunt, cecideruntque ibi, et qui remanserunt, fugerunt ad montes, tuleruntque omnem substantiam eorum, nec non et Lot, et substantiam ejus, et reliqua. Notandum est quod Balae, quae et Segor, tradunt Hebraei, quia sicut in alio loco ostenditur Scripturae hanc eamdem esse Salisa, et interpretantur vitulam consternantem, quod scilicet tertio motu terrae absorpta sit, et ex eo tempore quo Sodoma et Gomorrha, Adama, et Seboim divino igni subversae sunt, illa parvula nuncupatur; si quidem Segor transfertur in parvulam. Vallis autem Salinarum, quae et vallis silvestris dicitur, sicut in hoc eodem libro scribitur, in qua fuerunt antea putei bituminis, post Dei iram et sulphuris pluviam | in mare Mortuum versa est, quod a Graecis stagnum bituminis appellatur. Idipsum est asphaltum. Mortuum autem appellatur mare, quod nihil recipit generum viventium, neque assuetas aquis aves, tauri camelique fluitent. Denique si Jordanis auctus imbribus pisces illuc influens rapuerit, statim moriuntur et pinguibus aquis subnatant. Lucernam accensam fertur supernatare sine ulla conversione, exstincto demergi lumine, et vas demersum arte, quod bibat, difficile haerere in profundo, omniaque viventia, demersa licet et vehementer illisa, statim resilire. Denique Vespasianum praecepisse natandi ignaros revinctis manibus in profundum dejici, eosque omnes illico supernatasse. Aqua ipsa sterilis et amara, caeterisque aquis obscurior, et quasi adustae [ Z., | adustam] praeferens similitudinem. Vagari super aquas bituminis glebas certum est atro liquore, quas scaphis appropinquantes colligunt, haerere bitumen, et nequaquam ferro praecidi fertur. Sanguine tantum mulierum menstruo vel urina cedere, utilis ad compagem navium, vel corporibus hominum medendis. Servat adhuc regio speciem poenae. Nascuntur enim poma pulcherrima, quae et edendi cupiditatem exspectantibus generent; si carpas, fatiscunt ac resolvuntur in cinerem, fumumque excitant quasi assidue ardeant. Sane in diebus aestatis immodicus [ Z., non modicus] per spatia campi exaestuat vapor, unde et coalescente vitio nimiae siccitatis, atque humi arido [ Z., humo arida] corruptior aer miserandas incolis conficit aegritudines. Denique | quinque isti reges, allegorice, a quatuor regibus devicti qui venerunt de Babylone, significant quinque sensus corporis, videlicet visum, auditum, gustum, odoratum et tactum. Quatuor reges quatuor vitia principalia intelliguntur, id est cupiditas, gaudium, timor et tristitia. Per haec quatuor vitia expugnavit diabolus non solum Sodomitas, per quos significabantur gentiles, sed etiam et Lot, qui interpretatur declinans, per quem significantur Judaei, qui declinaverunt a rectitudine fidei. Per vallem silvestrem praesentem mundum interpretantur [ Z., praesens mundus interpretatur]; per puteos homines in profunditate vitiorum demersos; per bitumen conglutinationem peccatorum, qua sunt uniti in iniquitate.

| Potest et aliter intelligi: quatuor reges qui quinque superaverunt, possunt nimirum contraria vitia virtutibus significare: haeresim scilicet, gentilitatem, hypocrisin, avaritiam, quae est idolorum servitus. Quae reges nuncupantur, quia in multo jus regni [ Z., regis] exercent. Quinque autem reges qui superantur ab his, quinque sensus possunt intelligi, ut diximus; quia et ipsi reges, quia ex his homo noster exterior regitur, terga vertuntur, donec Abram, pater excelsus, victis quatuor regibus supradictis, spolia revocet, et Lot propinquum suum, declinantem utique a malo, ex eorum potestate eripiat.

Quod autem recedere quinque reges a quatuor dicuntur, significat quod illos maxime persequitur | contraria potestas, quos ante in servitutem retinuit. Quod autem in trecentis decem et octo Pater ille excelsus, cui in Oratione Dominica dicimus. Pater noster, significat quod per electos, qui in persecutione virtutum constituti sunt, fundati fide Trinitatis, et habentes plenitudinem Decalogi octava die quae sabbato sequitur, cum Christo resurgentes.\
"""
