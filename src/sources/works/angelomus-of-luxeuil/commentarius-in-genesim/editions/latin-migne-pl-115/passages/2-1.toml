text = """
VERS. 1.-- Igitur perfecti sunt coeli et terra, et omnis ornatus eorum. Bene pluraliter coeli ponuntur, quia, secundum auctoritatem Scripturarum, tres esse comprobantur: primum videlicet aereum, a quo aves coeli nominantur; secundum aethereum, vel sidereum, ubi luminaria continentur; tertium spiritale, quod proprium est angelorum, de quo Paulus apostolus ait: Scio hominem raptum usque ad tertium coelum (II Cor. XII, 2). Unde post pauca subdidit, raptum in paradisum. Quod enim praemisit, tertium coelum, hoc iterum iteravit, cum ait, in Paradisum. | Sed sciendum est quia ornatus coeli spiritalis sunt angeli, archangeli, throni, etc.; ornatus vero aetherei coeli, sol, et luna, et stellae: ornatus autem aerei coeli nubes, venti, pluviae, volatilia diversi generis. Terrae namque ornatus est mare [Petr., ornatus in aere], juga montium, subducta vallium, tensa [ Z., densa] camporum, vicissitudines temporum, species fructuum, decursus aquarum, et caetera. Sequitur:\
"""
