text = """
VERS. 2-4.-- Dixitque Abram: Domine Deus, quid dabis mihi? ego vadam absque liberis, et filius procuratoris domus meae iste Damascus Eliezer, et reliqua. Non quasi dubius, an fieret, de promissione Dei, cum ait: Domine Deus, quid dabis mihi? sed quomodo futurum [ Z., venturum] esset, exquirens. Sed requirendum est quis fuerit iste Eliezer Damascus, de quo dixit Abram, haeres meus erit? Ille utique fuit filius procuratoris Abrahae, qui postea, ut aiunt Hebraei, Damascum condidit, et nomen civitatis dedit regnumque in ea obtinuit. Attamen notandum, ubi nos habemus, filius procuratoris, nonnulli transtulerunt: filius Masech vernaculi mei. | Aquila vero, filius potum dantis domui meae. Theodotion, filius ejus qui super domum meam est, id est villici, qui universa dispensat, et distribuit cibaria familiae; vocaturque Damascus Eliezer. Porro Eliezer Deus meus adjutor interpretatur, qui, ut diximus, Damascum condidit. Sequitur:\
"""
