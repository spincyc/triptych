text = """
VERS. 8-10.-- Juda, te laudabunt fratres tui; manus tuae in cervicibus inimicorum tuorum; adorabunt te filii patris tui. Catulus leonis Juda: ad praedam, fili mi, ascendisti [sive, ut in Hebraeo scriptum est: de captivitate, fili mi, ascendisti): requiescens accubuisti ut leo, et quasi leaena: quis suscitabit eum? Quia Juda confessio sive laus interpretatur, recte scribitur: Juda, confitebuntur tibi fratres, vel laudabunt | te. Et licet de Christo grande mysterium sit, sed tamen secundum litteram significat quod per David stirpem generentur reges, et quod adorarent eum omnes tribus. Non enim ait, Filii matris tuae; sed, filii patris tui. Et quod sequitur, ad praedam, fili mi, ascendisti, ostendit eum captivos populos esse ducturum, et juxta intelligentiam sacratiorem, ascendisti in altum, captivam duxisse captivitatem, sive, quod melius puto, captivitas passionem, ascensus resurrectionem significat.\
"""
