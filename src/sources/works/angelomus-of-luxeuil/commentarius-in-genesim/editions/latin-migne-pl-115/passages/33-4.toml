text = """
VERS. 18.-- Transivitque in Salem, urbem Sicimorum, quae est in terra Chanaan, et reliqua. Error oboritur: quomodo Salem civitas appellatur, cum Hierusalem, in qua regnavit Melchisedech, Salem ante sit dicta? Aut igitur unius nominis urbs utraque est, quod etiam de pluribus Judaeae locis possumus invenire, ut idem urbis et loci nomen in alia atque alia tribu, ita ut aut certe istam Salem, quae nunc pro Sichima nominatur, dicimus hic interpretari consummatam, atque perfectam; et illam quae | postea Hierusalem dicta est pacifica nostro sermone transferre. Utrumque enim accentu [Petr., acceptu] paululum declinato hoc vocabulum sonat. Tradunt Hebraei quod claudicantis femur Jacob ibi convaluerit et sanatum sit, propterea eamdem civitatem curati atque perfecti vocabulum consecutam.\
"""
