text = """
VERS. 26.-- Faciamus hominem ad imaginem et similitudinem nostram. Quid est quod ait: Faciamus hominem ad imaginem nostram? nisi quia jam rationabilis | creatura condebatur, ut quodammodo cum consilio facere videretur, et ut nobilitas ejus ostenderetur. Ideo ait, Faciamus. Sed quare superius dictum est, dixitque Deus: Fiat; et hic ait, Faciamus hominem ad imaginem, et reliqua, pluraliter? Ut ostenderet, quia trinus est Deus in personis, et unus in deitatis natura [ Z., in deitate natura]. Inde est quod in consequentibus dicitur: Et creavit Deus hominem ad imaginem suam, et reliqua. Homo quippe ad imaginem Dei dicitur, secundum quod animam habet invisibilem et immortalem in sua natura. Sed si imago Dei est ipsa ratio animae, similitudo vero ipsius est aeterna vita, quam daturus est omnibus electis, quando erit illud quod Joannes ait: Similes ei erimus, et reliqua (Joan. III, 2), non | aequales facti Divinitati, sed sociati aeternitati. Aliter: si imago Dei est in interiori homine, similitudo in moribus: sed imaginem Dei omnes habent, similitudinem vero pauci. Illi enim specialiter similitudinem illius tenent, qui sunt imitatores ejus et illud adimplent quod ait: Sancti estote, quia ego sanctus sum, et reliqua (Lev. XI, 44). Nam subditur, et praesit piscibus maris, et caetera. Igitur si cuncta animantia et volatilia ad hoc creata sunt ut homini subjecta essent, quid est quod multa noxia patitur a bestiis? Ecce vult abigere aves nonnullas, et non valet superare bestias [cod. Z. om. bestias], et non potest, et etiam saepe pro fragilitate humana ab ipsis interimitur. Et licet omnibus dominari non queat, tamen nullatenus dominatur a bestiis [ Z., | nullatenus dominatur bestiis]. Sed quisquis ista proponit, attendit qualis factus est homo post peccatum; et non considerat qualis exstitit antequam peccaret. Conditus namque ad imaginem Dei, si persisteret in suo ordine, omnia ei subdita manerent. Verumtamen quia praevaricator factus est mandatorum Dei, quaedam ei ad utilitatem concessa sunt, quaedam vero in flagellum conversa, juxta quod ipse per prophetam ait: Ego Dominus faciens pacem, et creans malum (Isa. XLV, 7). Creare videtur Deus malum, quando homo a creaturis, quae sibi subjectae esse debuerant, flagella patitur. Igitur si homo teneret ordinem suum, servarent et bestiae obedientiam suam, juxta quod in beato Daniele ostenditur, cui leones subjecti etiam tempore famis fuerunt.\
"""
