text = """
VERS. 16.-- Mulieri quoque dixit: Multiplicabo aerumnas tuas, et caetera usque: et sub viri potestate eris, et reliqua. Quid est quod ait, sub viri potestate eris? Nunquid ante peccatum sub ejus potestate non erat? Fuit utique; sed ea servitute quae per dilectionem operatur et foras mittit timorem. Postea vero timore conditionalis servitutis, qui [ Z., quae] per disciplinam operatur. Spiritaliter mulier significat mentem, et ideo quod ait, in dolore paries filios, hoc designat quia voluptas carnalis, cum aliquam consuetudinem malam vult vincere, patitur in | exordio dolores, atque ita per meliorem consuetudinem parit bonum opus quasi filios. Quod vero adjecit, et sub viri potestate eris, et reliqua, hoc significat quod illa voluptas carnalis, quae cum dolore reluctaverat ut faceret consuetudinem bonam, jam ipsis erudita doloribus cautior fit, et ne corruat obtemperat rationi, et libenter paret [ Z., servit], quasi viro jubenti.\
"""
