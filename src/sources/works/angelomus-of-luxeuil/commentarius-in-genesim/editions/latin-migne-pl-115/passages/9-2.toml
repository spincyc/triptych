text = """
VERS. 13.-- Arcum meum ponam in nubibus, et | reliqua. Datur itaque signum securitatis, quia praescivit Creator formidabiles hominum animos, ne iterum diluvio se deleri crederent, dum saepius inundationes pluviarum cernerent. Et bene idem signum securitatis in coelo positum est, scilicet ut ab omnibus inspici potuisset, et ut pro quacunque tribulatione oculos cordis ad eum attollamus, qui habitat in coelis. Sed quaeritur cur diversi coloris datur hominibus? Propter securitatem et timorem. Unde et in arcu color aquae et ignis simul ostenditur, quia ex parte est caeruleus, et ex parte rubicundus, ut utriusque judicii testis sint [ Z., sit], unius videlicet facti, et alterius faciendi, id est quia mundus judicii igne cremabitur. Nam aqua diluvii non delebitur. Hic enim nonnullos movet an pluviae ante diluvium fuerint? | Sed videntur [ Z., videtur] non fuisse, quia arcus non efficitur nisi ex radiis solis et humida nube. Poterat enim fieri ut ex roris et fontium, sicut Aegyptus, irrigatione terra fecundaretur.\
"""
