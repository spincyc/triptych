physical_line_ranges = [[288, 289]]
text = """
VERS. 26-29.-- Ad quem locum cum venisset Abimelech, et Ochoza amici illius, et Ficol, dux militum, locutus est eis Isaac, et reliqua. Sciendum est autem quod Abimelech iste, quem diximus significare superius philosophos, et studiosos quosque qui per eruditionem philosophiae multa etiam ex veritate comprehenderunt, non semper habuit pacem cum Isaac, sed aliquando dissidet, aliquando pacem requirit. Neque enim philosophi semper cum verbo Dei consentiunt, nec semper contrarii sunt. Multi enim philosophi unum Deum esse, qui cuncta creaverit, | scribunt. Nonnulli etiam hoc addiderunt quod cuncta per Verbum suum fecerit, et Verbum Dei sit quod cuncta moderetur. In hoc cum lege et Evangelio consentiunt. Dissident vero a nobis cum dicunt Deo coaeternam materiam esse, cum negant Deum curare mortalia, sed providentiam illius supra lunaris globi spatium cohiberi, cum nascentes stellarum cursibus pendunt. Dissident, cum perpetuum dicunt hunc mundum et nullo fine claudendum. Sunt et alia in quibus dissident et concordant. Et ideo Abimelech secundum hanc figuram aliquando in pace esse cum Isaac, aliquando dissidere describitur. Sed non otiose scribitur quod duo alii cum Abimelech venerint, id est Ochoza, gener ejus, et Ficol, dux militum. Interpretatur autem Ochoza tenens, | et Ficol os omnium. Ipse autem Abimelech pater meus rex. Qui tres, sicut longe superius ostendimus, imaginem totius philosophiae tenent, quae apud eos in tres partes dividitur, logicam, physicam, ethicam, id est rationalem, naturalem et moralem. Rationalis est, quae Deum Patrem omnium confitetur, ut est Abimelech. Naturalis est illa quae fixa est, et tenet omnia velut naturae illius viribus nitens, quam profitetur Ochoza, qui dicitur tenens. Moralis est, quae in ore est omnium, et ad omnes pertinet, et pro communium similitudine praeceptorum in omnium ore versatur, quam designat iste Ficol, qui os omnium interpretatur. Hi ergo omnes in hujuscemodi institutionibus instituti veniunt ad legem, et dicunt: Vidimus tecum esse Dominum, et | idcirco diximus: Sit juramentum inter nos, et reliqua usque, sed cum pace dimisimus auctum benedictione Domini.

Possunt quidem isti tres, qui pacem requirunt a verbo Dei, et pervenire cupiunt pacto et societati ejus, figuram tenere trium Magorum, qui ex Orientis partibus veniunt, eruditi paternis libris, et institutione majorum, et dicunt: quia videntes vidimus natum regem, et vidimus, quia Deus est cum illo, et venimus adorare eum. Istiusmodi accedens ad legem Dei necessario dicit: Juravi, et statui custodire judicia justitiae tuae (Psal. CXVIII, 106). Sed dum petunt ut non facias nobis quidquam mali, et reliqua, remissionem peccatorum per haec [Z., hoc.] | deposcere videntur, et ne recipiant mala, benedictionem postulant, non retributionem.\
"""
