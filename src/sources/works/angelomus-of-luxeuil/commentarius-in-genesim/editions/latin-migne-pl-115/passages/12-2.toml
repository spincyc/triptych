physical_line_ranges = [[166, 166]]
text = """
VERS. 4.-- Septuaginta quinque annorum erat Abram cum egrederetur de Charran. Hic indissolubilis nascitur quaestio: si enim Thara, pater Abram, cum esset in regione Chaldaea, septuaginta annorum | genuit Abram, et postea in Charan (Petr. semper, Charram) ducentesimo quinto aetatis suae anno mortuus est, quomodo nunc post mortem Tharae Abram exiens de Chara septuaginta quinque annorum fuisse memoratur, cum a nativitate Abram usque ad mortem patris ejus centum triginta quinque annorum fuisse doceantur (Z., doceatur)? Nisi quia vera est illa traditio Hebraeorum, quam supra diximus, quod egressus sit Thara cum filiis suis de igne Chaldaeorum, et quod Abram Babylonio vallatus incendio, quia illud adorare nolebat, Dei sit auxilio liberatus. Unde et Dominus postea ait Ego Dominus, qui eduxi te de Ur Chaldaeorum, et ex illo tempore ei dies vitae et tempus reputatur aetatis, ex quo confessus | est Dominum, spernens idola Chaldaeorum. Potest autem fieri ut, quia Scriptura reliquit incertum, ante paucos annos Thara de Chaldaea profectus, venerit in Charran, quam morte obiret, vel certe statim post persecutionem Charran veniret, et ibi diutius sit moratus. Si quis ergo huic solutioni contrarius est, quaerat aliam solutionem, et tunc recte ea quae a nobis dicta sunt, improbabit.\
"""
