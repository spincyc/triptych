text = """
VERS. 31.-- Vidit Deus cuncta fecit, et erant valde bona. Cum enim superius multa creata sunt, et dictum est per singula, Et vidit Deus quod esset bonum, cur in fine dicitur, et erant valde bona, nisi quia in suis speciebus divisa bona sunt; juncta autem | simul non solum bona, sed etiam in sua generalitate valde bona sunt? Verbi gratia, laudas oculum in corpore per se, etc.; alia membra specialiter; conjuncta autem, ut sit unum corpus, non solum bona dicis, sed etiam valde bona; et in tantum generalitas laudatur in corpore, ut etiamsi aliquod membrum inde praecidatur, non solum est inutile, sed etiam foedat corpus. Seu ideo homine condito bene singulariter non dicitur, vidit Deus quod esset bonum, sicut de caeteris creaturis, sed post cuncta creata dictum est, et erant valde bono, quia propter hominem creata sunt. Nam antea quasi singula erant bona; homine autem, propter quem condita sunt, creato, jam dicitur, valde bona, quia omnia in decorem hominis creata sunt, homo vero in gloriam | et laudem conditoris sui factus est.\
"""
