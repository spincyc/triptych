text = """
VERS. 16.-- Egressusque Cain a facie Domini, habitavit in terra profugus ad orientalem plagam Eden. Septuaginta transtulerunt, habitavit in terra Naid, Quod Septuaginta Naid transtulerunt, in Hebraeo non dicitur. Non est igitur terra Naid, ut vulgus nostrorum | putat, sed expletur sententia Dei, quod huc atque illuc vagus et profugus oberravit. Unde Naid interpretatur instabilis, et fluctuans, ac sedes incertae, vel commotio.\
"""
