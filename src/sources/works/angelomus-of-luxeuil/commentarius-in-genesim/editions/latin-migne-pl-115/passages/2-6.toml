text = """
VERS. 6.-- Sed fons ascendebat e terra irrigans universam superficiem terrae. Hic merito quaeritur si fons irrigabat extensa camporum superficiemque universam terrarum, cacumina montium non irrigabat [ Z., irrigabantur]: et si juga ac cacumina montium infundebat, ergo non fons, sed diluvium erat. Sed quod ait, fons ascendebat de terra, et reliqua, juxta litteram tale est ac si dixisset: Nondum pluerat, sed fontes per universam terram, sive in planitie camporum, sive [ Z., sive in] verticibus montium, suis quibusque locis erumpentes, regiones proprias irrigabant. Sed fontem more Scripturarum singulari numero pro plurali posuit propter unitatem | naturae, eo quod omnes unam originem habent.\
"""
