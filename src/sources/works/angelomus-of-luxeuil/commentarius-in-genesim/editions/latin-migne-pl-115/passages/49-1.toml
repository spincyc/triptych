text = """
VERS. 2, 3.-- Congregamini et audite, filii Jacob, audite Israel patrem vestrum. Ruben primogenitus meus, tu fortitudo mea, et reliqua, usquequo ait, benedixitque | singulis benedictionibus propriis. Quid intelligendum est de benedictionibus quibus Jacob patriarcha benedixit filios suos? An historice vel allegorice intelligendae sint, dum dixit: Congregamini, filii Jacob, ut annuntiem vobis quae ventura sunt in novissimis diebus? Et videtur ex his verbis magis allegoriam sonare quam historiam. Utrumque et historiam et allegoriam. Historiam in divisione terrae repromissionis, quae divisiones dividendae erant nepotibus illorum. Igitur allegoriam de Christo et Ecclesia in novissimis temporibus futuram. Sed prius historiae fundamenta ponenda sunt, ut aptius allegoriae culmen priori structurae superponatur.\
"""
