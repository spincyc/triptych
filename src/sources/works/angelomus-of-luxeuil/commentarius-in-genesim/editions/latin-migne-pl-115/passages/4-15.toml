physical_line_ranges = [[107, 107]]
text = """
VERS. 25.-- Cognovit autem Adam uxorem suam, quae concepit filium, vocavitque nomen ejus Seth. Seth interpretatur resurrectio, seu positio. Resurrectio, eo quod post fratris interfectionem natus sit, quasi resurrectionem fratris ex mortuis suscitaret. Positio vero, quia posuit eum Deus pro Abel. Unde et dicitur: Suscitavit mihi Deus semen aliud pro Abel, quem occidit Cain. Vel sicut Aquila transtulit: Posuit mihi Deus semen alterum pro Abel. Spiritaliter, | ut quidam volunt, per Adam et uxorem ejus Christus et Synagoga significatur. Unde natus est filius, id est populus gentium in fide. Qui recte Seth nominatur, id est positus in veritate. Quod autem dicit: Semen aliud pro Abel, significat bonos Novi Testamenti pro patriarchis, et prophetis, et martyribus, qui occisi sunt a mala parte populi Judaeorum. Moraliter vero per Adam et uxorem suam sanctus quisque et caro demonstratur; per filium sensus perfectus; per semen aliud pro Abel boni sensus pro bonis intelliguntur.\
"""
