text = """
VERS. 1.-- Dixit autem Dominus ad Abram: Egredere de terra tua, et de cognatione tua, et de domo patris tui, et reliqua. Quaeritur cur eum praecepit de terra sua egredi, cum ipse de terra nativitatis, id est de terra Chaldaeorum, egressus fuerat cum patre? Nisi, ut quibusdam videtur, haec egressio non ad egressionem corporis pertinet, sed ad egressum mentis, ne illuc voluntatem mentis haberet redeundi unde corporaliter | jam exierat. Moraliter ad exemplum illius nobis exeundum est de terra nostra, id est de facultatibus hujus mundi, vel de terreno homine, et de cognatione nostra, de conversatione (Z., nostra, id est, de conv.) et moribus, vitiisque prioribus, quae nobis a nativitate velut consanguinitate conjuncta sunt. Et de domo patris nostri, videlicet de omni memoria mundi hujus, quae domus diaboli dicitur, ut in psalmo: Obliviscere populum tuum et domum patris tui (Psal. XLIV, 14), veluti gentilitati renuntiantes possimus dilatari in terra quam monstrat nobis idem in populo Dei, et in congregatione fidelium, et in terra coelestis repromissionis, cum advenerit tempus introduci. Sed notandum est quia duae repromissiones ad Abraham factae sunt; una, quod | terram Chanaam possessurus esset in semine suo, quod significatur ubi dictum est: Vade in terram quam monstravero tibi, etc. Alia vero, longe praestantior, quod pater esset non unius gentis Israeliticae, sed omnium gentium quae fidei ejus vestigia sequuntur, quod his verbis promittitur: Et benedicentur in te omnes gentes. Illi scilicet in semine Abraham benedicentur, qui Abrahae fidem imitantur. Sed juxta historiam ostenditur quod multi in exemplis sanctorum benedictionem consequuntur. Caeterum quod ait: faciamque te in gentem magnam, virtutes ostendit. Magna gens est numerus virtutum. Verumtamen quod dicitur: Egredere de terra tua, etc., in cujusdam dictis ita reperi: Egredere de terra tua, id est de lege naturae, de cognatione vero, | de lege litterae; de domo quippe patris, hoc est de lege Novi Testamenti; in terram quam monstravero tibi, id est in coelum, de qua Isaias ait: Oculi tui cernent terram de longe (Isa. XXXIII, 17).

Animadvertendum est quod instabilitas Abrae instabilitatem gentis illius significat (Z., significabat). Gens enim ipsius major futura erat de instabilitate sua quam quando habitavit in terra sua. Ita et Ecclesia de itinere suo, videlicet de carnali habitatione et resurrectione, ut aliquibus videtur, majora praemia habebit.\
"""
