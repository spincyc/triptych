VERS. 47.-- Quem vocavit Laban: Tumulus testis, et Jacob. Acervum testimonii, uterque juxta proprietatem | linguae suae. Acervus lingua Hebraea gal dicitur, aad vero testimonium. Rursum lingua Syra acervus igar appellatur, testimonii, sedutha. Jacob igitur acervum testimonii, hoc est Galaad lingua Hebraea appellavit; Laban vero idipsum, hoc est acervum testimonii, igar sedutha gentis suae sermone vocavit. Erat enim Syrus, et antiquam linguam parentum provinciae in qua habitabat, sermone non mutaverat.\
