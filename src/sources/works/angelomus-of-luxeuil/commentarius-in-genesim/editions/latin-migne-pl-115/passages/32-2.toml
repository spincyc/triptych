text = """
VERS. 11.-- Dixitque Jacob ad Dominum: Erue me de manu fratris mei Esau, quia valde eum timeo. Quaeri solet quomodo fidem habuerit Jacob, quandoquidem tantum timuit Esau fratrem suum? Satis enim in verbis ejusdem Jacob, quae sequuntur, et humana infirmitas et fides pietatis apparet; ut et Deus liberaret eum, et quae promisit impleret. Admonendi tamen fuimus hoc exemplo ut, quamvis credamus in Deum, faciamus tamen quae facienda sunt | ab hominibus in praesidium salutis, ne praetermittentes ea, Deum tentare videamur.\
"""
