text = """
VERS. 16 seq.--Saraae autem dixit Abimelech: Ecce mille argenteos dedi fratri tuo; hoc erit tibi in velamen oculorum ad omnes qui tecum sunt, et reliqua. Bene ait: Hoc erit tibi in velamen oculorum, id est, in verecundia vel in confusione vultus, ad omnes qui tecum sunt. Confusio namque esse poterat tantae | mulieris a viro suo fuisse sublatam. Et quocunque perrexeris, memento te deprehensam, subaudi, a me, et subtractam a fratre tuo. Ecce historialiter. Caeterum, spiritaliter, Abimelech, qui interpretatur pater meus rex, significat sapientes istius mundi, vel regnum terrenum, qui per humanam sapientiam, in quantum eis attributum fuit, cognoverunt Deum Patrem esse ac regem totius creaturae. Saraa significat Ecclesiam. Abraham quippe, unigenitum Filium Patris, qui frater fieri dignatus est per gratiam. Millenarius autem numerus, perfectionem [ Z., persecutionem] fidei sapientium. Argentum vero, scientiam Scripturarum, per quam cognoverunt quod Saraa uxor esset Abrahae, id est Ecclesia Domino copulata per fidem. Ait enim: Ecce mille argenteos dedi fratri | tuo, qui Filius Dei est per naturam, cujus tu soror es per gratiam. Congrue dixit, fratri tuo, quia sapientes perfectionem suae fidei velut mille argenteos Domino dederunt, per cognitionem sacrarum videlicet Scripturarum. In velamento, inquit, oculorum tuorum, id est in protectionem per sanctos videlicet doctores. Qui ex me, ac si dixisset aperte, ad fidem transierunt ad te. Ipsi namque sunt usque hodie in protectionem sanctae Dei Ecclesiae, maxime qui ex humana sapientia ac sublimitate prodierunt. Mementoque te esse deprehensam. Deprehensam se meminit, quia prius Ecclesia persecuta est, sed intacta permansit. De Abimelech quoque rege Philistinorum moraliter possumus intelligere quod Saraam voluerit | accipere uxorem. Et quomodo Abraham illam sororem suam esse dixerit, vel quod compescuerit Deus Abimelech propter illam. Puto ergo quod Saraa, quae interpretatur princeps, significet virtutem animi. Haec vero virtus conjuncta est viro sapienti. Denique Dominus dicit: Quaecunque dixerit tibi, audi vocem illius in omnibus in quibus consilium dederit tibi. Non vult ergo Abraham virtutem uxorem suam dici; donec [ Z., dum enim] enim virtus cum aliis participari non potest, ne uxor appellari valet. Cum vero ad perfectum venerimus, ut simus idonei et alios docere, non jam virtutem et uxorem intra gremium concludamus, sed ut sororem etiam aliis volentibus copulemus. Unde scriptum est: Dic sapientiam sororem tuam esse (Prov. VII, 4). Secundum hoc igitur | Abraham Saraam sororem suam esse dicebat. Voluit ergo et Pharao aliquando habere Saraam non in corde mundo. Sed virtus nisi cum cordis munditia non potest convenire. Longe autem (aliter) agit Abimelech iste quam Pharao. Unde videtur mihi Abimelech iste formam teneat studiosorum et sapientium mundi, qui philosophiae operam dantes, licet non integram et perfectam regulam pietatis attigerint, senserunt tamen Deum et regem omnium. Isti ergo, quantum ad moralem philosophiam spectat, etiam purificati cordis operam dedisse comprobantur; sed hanc non permisit Deus illos contingere. Haec enim gratia non per Abraham, sed per Christum tradi gentibus parabatur. Sanat autem Deus Abimelech, et uxorem illius, et ancillas, quas putamus | naturalem philosophiam diversa et varia sectationum commenta. Interea Abraham impertiri cupit donum [ Z., domum] cum gentibus divinae virtutis. Sed nondum est tempus a priori populo transire ad gentes gratiam Dei. Secundum hanc ergo allegoriam Pharao, qui interpretatur exterminator, Saraam, id est virtutem, accipere non potuit. Manet ergo apud Abraham virtus, manet in circumcisione, donec tempus veniat ut in Christo Jesu perfecta virtus ad Ecclesiam gentium transiret. Tunc domus Abimelech et ancilla illius pariunt Ecclesiae filios. Hoc enim tempus, quo sterilis parit, et orante Abraham, hoc est populo, per patriarchas, et prophetas prophetantes. Unde et illic dicitur: Redde viro suo uxorem, quia propheta est, et orabit pro te, et vives. Postea intulit, | orante autem Abraham sanavit Deus Abimelech, et reliqua.\
"""
