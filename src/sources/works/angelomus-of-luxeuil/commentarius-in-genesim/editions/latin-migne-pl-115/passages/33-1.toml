text = """
VERS. 1-9.-- Divisitque Jacob filios Liae et Rachel, ambarumque famularum, et posuit utramque ancillam et liberos earum in principio; Liam vero et filios ejus in secundo loco; Rachel autem et Joseph novissimos. | Et ipse progrediens adoravit pronus in terram, et reliqua. Non, ut plerique aestimant, tres turmas fecit, sed duas. Denique ubi nos habemus, divisit, Aquila posuit, dimidiavit; ut unum cuneum faceret ancillarum cum parvulis suis; et alium Liae et Rachel, quae liberae erant cum filiis earum; primasque ire faceret ancillas, secundas liberas, ipse autem ante utrumque gregem, fratrem adoraturus occurreret.\
"""
