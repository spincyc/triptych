text = """
VERS. 2.-- Joseph, cum sedecim esset annorum, pascebat gregem cum fratribus suis, adhuc puer, et erat cum filiis Balae et Zelfae uxorum patris sui. Accusavitque fratres suos apud patrem crimine pessimo. Quaerunt enim quale sit hoc crimen? Nonnulli volunt intelligi idololatriam [ f. idololatricam] superstitionem, quasi idolum adorassent. Alii vero super crimine Sodomorum et Gomorrhaeorum interpretantur. Verumtamen movere potest quid est quod hic ancillae | uxores appellantur, cum superius concubinae dicantur, nisi quia more Scripturarum forte omnis concubina uxor, non autem uxor concubina. Nam Saraa, et Rebecca, et Lia, et Rachel concubinae dici non possunt: Agar vero, et Cethura, et Bala, et Zelfa, et uxores et concubinae dicuntur.\
"""
