physical_line_ranges = [[27, 28]]
text = """
VERS. 11-13.-- Germinet terra herbam virentem, et reliqua, usque cujus semen sit in semetipso. Cur ait, in semetipso, cum multae arbores non proferant fructum, ut in ipso habeant semen? Sed sciendum est quia si non habent in fructu, habent in radice, ex qua germinentur.

Et vidit Deus quod esset bonum, et caetera. Si ergo herbae, et fructus terrae, et ligna pomifera bona sunt, et dictum est: Vidit Deus cuncta quae fecerat; et erant valde bona; et ad extremum subjungitur: Requievit Deus ab omnibus operibus; quid de herbis venenosis, et lignis nocivis dicendum est? Et quid est quod ad Adam ait de spinis et tribulis: Terra tua | spinas et tribulos germinabit tibi? nisi ut intelligat qui proponit, quia non absolute dictum est: Terra spinas et tribulos germinabit, sed ait, tibi; ac si diceret: Incipiat tibi germinare ad exercitium laboris, quae prius germinavit pabulum ad usus jumentorum et bestiarum. Nisi enim peccasset, nequaquam noxia illa terra germinaret. Unde apparet quia post peccatum illius coepit terra spinas gignere. Nam de herbis arboribusque venenosis et nocuis sciendum quia valde bona condita sunt; quia si non praebent escam, administrant medicinam; et si nobis noxia videntur, feris et avibus innoxiae sunt, quia eis praebent pabulum, licet nobis non praebeant alimentum. Et ideo, sicut dictum est, omnis creatura valde bona condita est, sed post peccatum primi parentis actum | est ut aliquae infructuosae arbores et steriles apparerent, et herbae venenosae, ut ex ipsis homo peccatum suum quodammodo consideraret, et commoneretur aliquando averti a peccatis, et ad Dei praecepta converti, et expavesceret amittere culturam Dei, et sterilis apparere in agro Ecclesiae, si non esset arbor fructuosa. Seu propterea arbores infructuosae, et herbae nocivae creatae; ut nulla indignis aperiantur mysteria [ Z., ministeria], neque ostendatur in qua figura futurorum ista dicta sunt.\
"""
