physical_line_ranges = [[352, 358]]
text = """
VERS. 1-29.-- Dixit Jacob: Abjicite deos alienos, qui in medio vestri sunt. Et dederunt ei postea omnes deos alienos quos habebant, et inaures quae erant | in auribus eorum. Deinde etiam sequitur quemadmodum apparuit iterum Deus Jacob, et benedixit ei, et ipse postmodum egressus inde venit verno tempore ad terram quae ducit Ephratam, et reliqua usque hae sunt autem generationes Esau.

Quomodo [Z., Quid est, quod Jac.] Jacob dixit domui suae: Projicite deos alienos qui in medio sunt vestri? Et iterum: Dederunt ergo ei omnes deos alienos quos habebant, inaures quae in auribus eorum erant? Quae si ornamenta erant, ad idololatriam non pertinebant. Intelligendum est has inaures phylacteria fuisse deorum alienorum. Nam Rebeccam a servo Abrahae inaures accepisse Scriptura testatur, quod non fieret si eis inaures habere ornamenti gratia non liceret. Ergo illae inaures quae cum idolis datae sunt, | ut dictum est, idolorum phylacteria fuerant.

Quare secundo dicitur ad Jacob: Non vocaberis Jacob, sed Israel erit nomen tuum, et appellavit eum Israel?

Dudum nequaquam ei ab angelo nomen imponitur; sed quod imponendum a Deo sit, praedicatur. Quod igitur futurum promittitur, hic dicitur expletum. Nimirum ergo nomen hoc ad illam recte intelligitur pertinere promissionem, ubi sic videbitur Deus, quomodo non est antea a patribus visus.

Quae est Ephrata, ubi Jacob Rachel uxorem suam condidisse dicitur, quaerendum videtur. Ephrata vero et Bethlehem unius urbis vocabulum est sub interpretatione consimili; siquidem in frugiferam domum et domum panis vertitur, propter eum panem qui de | coelo descendisse dicitur.

Sed movet ubi est turris gregis, juxta quam dicitur Jacob habitasse? Juxta Bethlehem, ubi vel angelorum grex Domini in ortu cecinit; vel Jacob pecora sua pavit, loco nomen imponens; vel, quod verius est, quod vaticinatio [F., vaticinio] futurorum jam tunc mysterium monstrabatur.

Quid est quod de Isaac dicitur: Et consumptus aetate mortuus est, et appositus populo suo? Quomodo comsumptus, vel a quo populo appositus? Consumptus aetate, id est perfectus aetate. Verum angelorum populo, vel sanctarum animarum apponuntur, qui hanc vitam placentes Deo finiunt. Tunc dicuntur apponi, quando nulla jam remanet sollicitudo tentationum et periculum peccatorum. Quod intuens ait | Scriptura: Ante mortem ne laudes hominem quemquam (Eccli. XI, 30).\
"""
