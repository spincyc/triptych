physical_line_ranges = [[162, 162]]
text = """
VERS. 14-28.-- Sale quoque genuit Heber, et reliqua, usquequo ait: mortuusque est Aran ante Thare patrem suum in terra nativitatis suae in Ur Chaldaeorum. Heber interpretatur transitor, quod significabat Ecclesiam futuram, quae transiit ab infidelitate ad fidem, a vitiis ad virtutes. Sed requirendum est quid est quod de Aran legitur fratre Abraham; mortuusque est Aran ante Thare patrem suum in Ur Chaldaeorum; Ur enim ignis dicitur. | Unde et in Hebraeo legitur: in Ur Chesdi (F. casdim. Z., cesi.), id est: in igne Chaldaeorum. Et Chaldaei ignem colunt pro Deo. Thare vero, ut Chaldaei tradunt (Z., Thare quoque ut Hebraei trad.), cum filiis suis missus est a Chaldaeis in ignem, quia ignem adorare nolebat, in quo igne Aran consumptus est. Et hoc est quod ait mortuum eum esse ante conspectum Thare patris sui, quod in sequentibus plenius dicemus.\
"""
