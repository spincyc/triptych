text = """
VERS. 19.-- Pulvis es, et in pulverem reverteris. Quod alia translatio manifestius ponit: Terra es, et | in terram ibis. Primus homo ita conditus fuit ut, manente illo, decederent tempora, ne cum temporibus ipse transiret. Stabat enim momentis decurrentibus, quia nequaquam ad vitae terminum per incrementa tendebat. At ubi vitium contigit, mox offenso Creatore coepit ire cum tempore, et ideo audivit: Terra es, et in terram ibis; statu videlicet inmortalitatis amisso, cursus [ Z., mox eum cursus, etc.] eum mortalitatis absorbuit, et dum in juventute ad senium, a senio traheretur ad mortem, transeundo didicit stando quid fuit. Cujus nos, quia de propagine nascimur, radicis amaritudinem quasi in virgulto retinemus; quia dum infantia ad pueritiam, pueritia ad adolescentiam, adolescentia ad juventutem, juventus | ad senectutem, senectus transit ad mortem, sic suis augmentis ad detrimenta impellitur. Et comedes herbas terrae, et reliqua. Hic ostenditur quia hominibus ante diluvium non carnes, sed herbae fructusque arborum datae sunt ad edendum. Hinc est quod quidam sapiens versibus alludens ait: Felix nimium prior aetas contenta fidelibus arvis, nec inerti perdita luxu, facilique sera solebat jejunia solvere glande. Hic quoque notandum est quia septem sunt peccata Adae, et ideo totidem, sicut aliqui describunt, subsecutae sunt maledictiones. Primum peccatum superbia, quia dilexit esse in sua potestate plus quam Dei. Secundum, sacrilegium, quia Deo non credidit. Tertium, homicidium, quia semetipsum peccando occidit. Quartum, quod fornicationem | spiritaliter [ Z., spiritalem] habuit, quia integritatem mentis corrupit, Quintum, furtum, quia cibum prohibitum attigit. Sextum, avaritia, quia plus quam debuit appetivit. Septimum, gula, quia vetitum fructum comedit. Quanquam septem sint vitia, et ideo septem poenae subsecutae sunt. Prima, maledictio terrae ejus. Secunda, ejectio de paradiso. Tertia, adventus in terram vilem. Quarta, mors filii. Quinta, labor. Sexta, mors corporis. Septima, descensio ejus in [ Z., ad] infernum. Et quia septies peccavit, septem vindictas recepit. Sed hic placet inquirere quare angelicum [ Z., angeli] peccatum silentio in hoc libro absconditum est, et hominis patefactum [ Z., esset, hominis vero pate], et cur summi angeli scelus insanabile fuit, et hominis | sanabile? Nisi quia angelicum vulnus Deus non praedestinavit curare, hominis vero sanare praedestinavit. Et quia angelus sui sceleris inventor fuit, homo vero alterius fraude seductus. Item quanto sublimior [ Petr. om. est hic et infra ] est angelus in gloria, tanto major in ruina. Homo vero quanto fragilior est in natura, tanto facilior ad veniam.\
"""
