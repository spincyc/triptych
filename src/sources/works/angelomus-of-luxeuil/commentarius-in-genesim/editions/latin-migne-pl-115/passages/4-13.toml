text = """
VERS. 23.-- Et ait Lamech uxoribus suis: Occidi | virum in vulnus meum, et adolescentulum in livore meo, et reliqua. Tradunt enim Hebraei quod Lamech occiderit Cain, et hoc confitetur uxoribus. Fuit, inquiunt, Lamech vir sagittarius et gnarus venandi; sed longo senio laesus caligabant oculi ejus, et clare videre non poterat. Habebat quidem praeductorem adolescentulum, qui ei ducatum praebebat. Quadam namque die pergens in silvam, ut feras venatu caperet, praeibat [ Z., praeibat ei] puer, viam praebens. Cumque saltum peragrarent, aspexit adolescens Cain a longe, et discernere non valens, putavit bestiam [ Z., eum putavit esse bestiam], et ait ad Lamech: Video, inquit, bestiam. Dixitque Lamech: Da mihi arcum, et dirige manus illuc, et sagittam, ut jaciam. Quibus directis jecit et percussit jaculo Cain. Et sentiens quod percussisset corpus, coepit palpare | quid esset quod telo peremerat. Quo palpato intellexit quod Cain occidisset. Tunc furore permotus vertit arcum, et eo percussit puerum. Et hoc est quod ait uxoribus suis: Occidi virum, id est Cain, in vulnus meum, et adolescentulum in livore meo.\
"""
