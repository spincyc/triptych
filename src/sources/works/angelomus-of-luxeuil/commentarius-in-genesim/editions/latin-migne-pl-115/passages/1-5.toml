text = """
VERS. 5.-- Factumque est vespere et mane dies unus. Quaerendum est cur dicatur, vespere et mane, cum adhuc non erat sol in firmamento, cujus occasu vespere et ortu mane efficerentur? An forte tantum spatium prima, et secunda, et tertia dies habuit, quantum est ab ortu solis usque ad occasum, et iterum aquilonem gyrando revertitur ad orientem, ut suo fulgore tenebras mundi propellat, et quod spatium illi qui in antris et in ergastulis, licet luce careant, sentire per usum possunt; quod fortassis ita intelligi valeret, nisi adderetur vespere et mane. | Unde restat ut in [Cod. Z. om. in] vespera intelligatur perfectio praecedentis operis, et mane inchoatio subsequentis. Loquitur enim more nostro Scriptura, ut distinctio operum Dei intelligatur. Porro quod ait, vespere et mane dies unus, potest referii ad angelicam creaturam. Quando enim intuitum avertebat a Deo, et convertebatur ad contuendam creaturam, quodammodo vespere erat; cum vero ad Creatorem convertebatur, ut in ipso clarius intelligeret creaturam, mane erat. Verumtamen si permansisset in consideratione creaturae, non solum vespere, sed etiam nox esset. Dies unus bene additur propter unitatem angelicae dignitatis, quae ita uni Deo contemplando inhaeret, ut nunquam intuitum amoveat a contemplatione.\
"""
