text = """
VERS. 6, 7.-- Ait enim Dominus ad Cain: Quare iratus es? et reliqua. Hoc est, quare irasceris, et invidiae in fratrem livore iratum vultum dimittis in terram? Nonne si bene egeris, recipies, id est si pura mente obtuleris sacrificium, recipies, respiciente Deo ad te et ad sacrificium tuum? vel sicut in quibusdam codicibus invenitur: Nonne si bene feceris, dimittetur tibi omne delictum? sive ut Theodotion ait: acceptum erit? hoc est: munus tuum suscipiam, sicut suscepi fratris tui. Quod si male egeris, statim in foribus peccatum tuum aderit. Vel, sicut quidam codices habent; illico peccatum ante vestibulum | num sedebit. Scilicet intrantem et exeuntem te semper peccatum tuum comitabitur, et desinet Dominus custodire introitum [ Z., intr. tuum] et exitum tuum. Sed sub te erit appetitus tuus, subauditur, si volueris; Et tu dominaberis illius. Ac si apertius dixisset: Quia .iberi arbitrii es, non habet peccatum super te dominium, sed tu [ Pert., non habes peccatum super dominium, sed tu, etc.] super illud, et in tua potestate est sive compescere, sive concupiscere illud. Verumtamen moneo te ut non tibi [ Z., tui] peccatum, sed tu peccato domineris. Nam Septuaginta ita transtulerunt: Nonne si recte offeras, non recte autem dividas, peccasti? Quiesce [ Z., quiescet a te conversio ejus ], ad te conversio ejus, et caetera. Sed multo aliter [ Z., altius] in Hebraeo est quam in his translationibus | sensus. Itaque necessitate compellimur in singulis diutius immorari. Recte autem offertur sacrificium, cum offertur Deo vero, cui uni tantummodo sacrificandum est. Non autem recte dividitur, dum non recte discernitur vel loca, vel tempora, vel res ipsa quae offertur, vel qui offert, et cui offertur. Recte offerunt Judaei Deum Patrem credendo; sed non recte dividunt Filium negando. Recte Vetus Testamentum offerunt recipiendo; sed non recte dividunt Novum respuendo. Sic quoque qui rapacitate, vel de qualibet re fraudulenter acquisita, opus eleemosynarum facit, rectum opus facit, sed mala discretione. Datur propterea intelligi, Deum non respexisse in [ Z., ad] munus Cain, quia hoc ipse male | dividebat. Recte namque offerebat Deo, cui soli offerendum est, bonum opus exhibendo; sed non recte dividebat, non bona voluntate faciendo, dans Deo aliquid suum, sibi autem seipsum, quod omnes qui non Dei, sed suam sectantes voluntatem faciunt, id est non recto corde, sed perverso viventes. Vel quia fortassis Cain meliora sibi reservabat, et deteriora Deo tribuebat, et humana inventione excogitata, ut putatur, et ideo non recte dividebat, Abel vero optima Deo et naturalia offerebat, et ideo sacrificium ipsius susceptum est. Unde in Evangelio singulariter justus inscribitur, quia videlicet tria maxima justitiae praeconia in eo esse leguntur: virginitas, sacerdotium, et martyrium, in quibus Christum praefiguravit. Nos etiam recte offerimus, cum | bono studio bonum opus agimus, sed recte non dividimus, si habere discretionem in bono opere postponamus. Quia nisi discretio fuerit, quod putatur causa virtutis, reatus est criminis [ Z., fit reat. crim.]. Ait enim: Quiesce, peccasti. Sed ad te erit conversio ejus, subauditur, peccati, si poenitentiam agere volueris [ Z., nolueris], et tibi tribuere quod gessisti. Ex hoc quod ait, ad te erit conversio ejus, potest intelligi ad ipsum hominem conversionem esse debere peccati, ut nulli alii quam sibi sciat tribuere quod peccat. Hoc est enim salubris poenitentiae medicina et veniae petitio. Tunc enim dominabitur quisque peccato, si id sibi non differendo praeposuerit, sed poenitendo subjecerit.\
"""
