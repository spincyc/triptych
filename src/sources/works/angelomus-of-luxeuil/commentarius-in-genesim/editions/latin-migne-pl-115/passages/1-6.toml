text = """
| VERS. 6.-- Dixit quoque Deus: Fiat firmamentum, et caetera. Firmamenti nomine coelum conspicuum appellatur, jam distinctum ab illa informi materia, de quo in sequentibus dicitur: Vocavitque Deus firmamentum coelum. Sed quaerendum est quale sit firmamentum, quod dividat aquas superiores ab inferioribus? Nam nonnulli dicunt firmamentum esse coelum aereum, a quo aves coeli nominantur, quod dividat aquas nubium ab aquis fluminum. Alii vero intelligi volunt coelum sidereum, sive aethereum, eo quod dividat aquas superiores ab inferioribus. Neque enim incredibile est invisibiles aquas consistere super firmamentum, sed si sunt non fluidae, quia non fluitant, sicut istae visibiles. Unde aliqui glaciali | soliditate persistere aestimant, non vaporali tenuitate, sicut ex stella Saturni, quae frigidissima est, autumant. Quia, inquiunt, ex his aquis frigidam esse, eo quod juxta summum coelum per triginta annos cursum suum peragat, licet hoc negare velint, qui de ponderibus disputant. Nec propriis distinctae locis locatae tanquam flumina, et non locorum sedibus, sed dignitate naturae superare coelum dicunt; quia cum sit coelum corpus pulcherrimum, omnis invisibilis creatura, ut beatus Augustinus ait, excedit etiam pulchritudinem coeli. Ideoque, ut idem doctor eximius putat, aquae super coelos sunt. Ait enim: Quo modo autem et qualeslibet aquae ibi sint, esse ibi eas minime dubitemus; quia major est, inquit, Scripturae hujus auctoritas, quam omnis humani | ingenii capacitas. Quae aquae universam terrae superficiem in tantam tegebant altitudinem, sicut alii doctores aiunt, ut usque ad illos locos pertingerent ubi nunc usque super firmamentum coeli ex parte residentes, nomen Dei creatoris cum coelis coelorum laudare, non desinunt. Denique si aliquis hoc negare voluerit, iste, si hominem crearet, ut Deus, epitimam non poneret in capite, sed in stomacho. Attamen de hac re non est nostrum temere definire, quia remota est a nostris visibus. Quidam autem aquas supernas accipiunt populos angelorum, de quibus scriptum est: Et aquae, quae super coelos sunt; laudent nomen Domini (Psal. CXLVIII, 4). Inferiores vero aquas homines terrae [ Z., terra] degentes, de quibus dicitur: Aquas quas vidisti, populi sunt et | gentes, quas utique coelum sidereum ab invicem segregat.\
"""
