text = """
VERS. 1-4.-- Erat autem terra labii unius, et sermonum eorumdem, et reliqua, usque et dixerunt: Venite, faciamus nobis civitatem, et turrem, cujus culmen pertingat ad coelum, etc. Ideo turrem sua superbia | construere voluerunt, ut celebrarent nomen suum antequam dividerentur, sicut Scriptura testatur, seu ut explorarent quid esset super coelum, sive, ut quibusdam videtur, ut haberent ubi fugerent, quia putabant iterum cataclysmo mundum deleri sicuti prius. Sed quaeritur utrum credibile sit tantae stultitiae esse homines, ut in coelum altitudinem aedificii cujuslibet exigere se posse putarent? Quia solet superbiam stultitia sequi, et humilitatem sapientia, ideo turris hic superbiae loco posita est, et quia sua stultitia atque superbia alta penetrare studuerunt, ideo confusi sunt. Fecit ergo superbia diversitates linguarum; humilitas Christi congregavit diversitates linguarum, ut quos turris dissociaverat, Ecclesia colligeret; de | qua dissolutione superius praelibavimus, ubi de Nembrot mentionem fecimus, qui [ Z., quia] ipse quidem auctor hujus turris exstitit, et primo omnium hominibus dominari et regnum dilatare studuit. Solet enim multos movere, an unum opus fuerit turris, et civitatis, vel duo? A multis enim aestimatur arcem esse et civitatis Babyloniae turrem illam. Hujus enim civitatis mirabilem constructionem gentium commendat historia, cujus nimia disponebatur altitudo, quae in campestribus per situm quadratum ab angulo usque ad angulum muri sedecim millia tenuisse passuum, simul per circuitum sexaginta quatuor [ Z., sexaginta tres], ut Herodotus historiographus dicit. Aliqui vero turrem unam volunt intelligi, quam praecipuam [ Z., praecipue] inter alias erigere moliebantur, | quae in altitudine quatuor millia dicitur tenuisse passuum, quod capitolium, ut idem doctor dicit, de lato in angustias coarctatur, ut pondus imminens facilius a latioribus sustentaretur, in qua describunt templa marmorea, aureas statuas, plateas lapideas auroque fulgentes, et multa alia, quae pene videntur incredibilia. Unde ait Scriptura:\
"""
