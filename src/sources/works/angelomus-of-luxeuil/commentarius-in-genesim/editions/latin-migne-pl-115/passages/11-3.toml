text = """
VERS. 7.-- Venite igitur et descendamus, et confundamus | ibi linguam eorum. Descendere Dei est humanos actus inspicere, vel eorum sensibus propinquare [ Z., appropinquare]. Sive descendere dicitur tam ad auxilium quam ad vindictam, quando curam humano generi praestat per obsequia angelorum. Angelis enim qui aderant, ut beatus Gregorius dicit, Dominus ait: Venite, descendamus, et reliqua. Qui ascendunt in eo quod Creatorem conspiciunt, descendunt in eo quod creaturam sese illicitis erigentem examine districtionis premunt. Dicere ergo est: Descendamus et confundamus linguam eorum, in seipso eis hoc quod recte agatur, ostendere, et per vim internae visionis eorum mentibus exhibenda judicia occultis motibus inspirare. Quod vero plurali numero dixit, descendamus, et iterum singulari, | confudit Dominus labium universae terrae, distinctione personarum sanctam Trinitatem, et operationis unitatem in majestate divina voluit ostendere, sicut in exordio humanae creationis dictum est: Faciamus ominem ad imaginem et similitudinem nostram; ut trinitas in personis, et unitas in potentia divinitatis esse credatur.\
"""
