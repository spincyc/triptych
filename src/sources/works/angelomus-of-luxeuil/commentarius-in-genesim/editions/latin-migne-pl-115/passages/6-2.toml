text = """
VERS. 3.-- Dixitque Deus: Non permanebit Spiritus meus in homine in aeternum, quia caro est, et reliqua. In Hebraeo scriptum est: Non judicabit Spiritus meus homines istos in sempiternum quoniam caro sunt. Spiritus enim iram in hoc loco significat, et caro fragilitatem humanae naturae, quasi dixisset: Quia fragilis est in hominibus conditio, non eos ad aeternos servabo cruciatus [ Z., aeternum servabo cruciatum], sed hic illis restituam quod merentur. Ergo ira non severitatem, ut frequenter in nostris libris legitur, significat; sed clementiam Dei sonat, dum | peccator hic pro suo scelere visitatur. Unde et iratus Deus loquitur ad quosdam: Non visitabo filias eorum, cum fuerint fornicatae, et sponsas eorum, cum adulteraverint (Ose. II, 14). Et in alio loco: Visitabo in virga iniquitates eorum, et in flagellis peccata eorum; misericordiam autem meam non auferam ab eis (Psal. LXXXVIII, 33). Porro ne videretur in eo esse crudelis, quod peccantibus locum poenitentiae non dedisset, adjecit, eruntque dies illius centum viginti annorum, hoc est habebunt centum viginti annos ad agendam poenitentiam. Sed quia genus humanum illius temporis agere poenitentiam contempsit, noluit Deus tempus exspectare decretum, sed viginti annorum spatiis amputatis, anno centesimo induxit diluvium. Potest etiam spiritus anima intelligi, et | ideo quod ait: Non permanebit spiritus meus in homine in aeternum, tale est quasi dixisset: Non permanebit anima in carne in aeternum, quia homo non spiritalis, sed carnalis est. Sequitur:\
"""
