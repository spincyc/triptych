text = """
VERS. 26.-- Sed et Seth natus est filius et vocavit nomen ejus Enos [ Z., quem vocavit Enos ]. Quomodo Adam homo interpretatur, ita et Enos juxta Hebraeae linguae veritatem homo vel vir dicitur. Et congrue | hoc vocabulum habuit. De eo enim scriptum est: Iste coepit invocare nomen Domini; vel, sicut quidam transtulerunt: Tunc initium fuit invocandi nomen Domini. Licet plerique Hebraeorum arbitrentur quod tunc primum in nomine Domini et in similitudine ejus fabricata sint idola. Aliqui [ Z., alii] vero volunt quod ideo dictum sit eo quod unum de decem nominibus Domini, quo apud Hebraeos vocatur, primum Enos reperisset, quod est HEL. Allegorice [ Z., Verumtamen allegorice] successores populi Christiani significantur, qui nomen Domini invocant quod est Deus.\
"""
