text = """
VERS. 12.-- Dixitque Adam: Mulier quam dedisti sociam, dedit mihi de ligno, et comedi. Heu, ubi peccatum finem habere debuit, ibi augmentum coepit! | Non enim culpam ad se retulit, sed quodam modo ad mulierem, quam Dominus dederat, et reatum suum oblique in Auctorem redegit [ Z., rediit], qui ei talem sociam dederat, unde occasio peccati esset. Unde nunc quoque humani generis rami ex hac adhuc radice amaritudinem trahunt, et cum de vitio suo quisque arguitur, sub defensionum umbra, quasi sub quaedam se arborum folia abscondit. In qua videlicet occultatione non se Domino, sed Dominum abscondit sibi.\
"""
