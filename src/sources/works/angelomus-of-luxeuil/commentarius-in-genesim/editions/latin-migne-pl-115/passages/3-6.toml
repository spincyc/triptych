physical_line_ranges = [[73, 74]]
text = """
VERS. 8.-- Et cum audissent vocem Domini Dei deambulantis in paradiso ad auram, et reliqua. Quid est enim quod post peccatum hominis in paradiso Dominus non stare, sed ambulasse [ Z., ambulare] dicitur, nisi quod irruente culpa se a corde hominis recessisse ostendebat? Etiam per hoc instabilem ejectionem eorum de paradiso ad mortalitatem demonstrabat. Tropice vero deambulat Deus illis, et non stat, qui stabiles in ejus praeceptis non perseverant. Unde consequenter adjunctum est ad auram post meridiem. Solet enim sacra Scriptura per statum temporis merita causarum distinguere. Bene enim ad auram post meridiem, quia ardor charitatis abundante iniquitate in eis refriguerat, et lux ferventior | veritatis abscesserat, appropinquantibus videlicet tenebris errorum, et peccatricem animam jam culpae suae frigore constringebant, et sub peccati umbra, quasi sub frigore aurae torpebat; sicut de eodem peccante homine scriptum est quia secutus est umbram. Ecce hic ostenditur quod Adam meridie transgressionis mortem huic mundo intulit. Unde Dominus hora sexta pro mundi vita crucifixus est, hoc est, recessuro a centro mundi sole, quando et latroni ait: Hodie mecum eris in paradiso (Luc XXIII, 43). Rationis igitur, imo divinae pietatis ordo poscebat, ut eodem temporis articulo quo tunc Adae peccanti obcluserat, nunc latroni Dominus poenitenti januam paradisi reseraret, et qua | hora primus Adam peccando huic mundo mortem invexerat, eadem hora secundus Adam mortem moriendo destrueret.

Sed quaeritur quare Dominus hominis peccatum per seipsum expiare voluit, et non per angelum? Ideo, quia non sufficiebat unius angeli meritum ad redemptionem totius humani generis. Nec tantum sceleris incurrisset diabolus in nece angeli, quantum incurrit in nece Creatoris. Abscondit se Adam, et uxor ejus in medio ligni paradisi. Juxta litteram, prae nimio pudore vel timore hoc fecerunt. Sed quid est quod post meridiem, nisi quia post lucem paradisi ac felicitatis in hujus saeculi caliginosa miseria se absconderunt? [ Z., paradisiacae felicitatis hujus saec. se absc.] Spiritaliter vero in medio ligni paradisi se | abscondit, qui aversus a praeceptis Creatoris in erroris sui atque arbitrii voluptatibus vivit.\
"""
