physical_line_ranges = [[132, 132]]
text = """
VERS. 11-- At illa venit ad eum ad vesperam portans ramum olivae, et reliqua. Quare ramum olivae portat, nisi quia typum Spiritus sancti adumbrabat? Quae columba Spiritus sancti, expulso alite teterrimo, ad Noe post diluvium, quasi ad Christum post baptismum | devolat, et ramos refectionis ac luminis pacem orbi annuntiat. Sed antequam descriptio hujus arcae ad calcem perveniat, notandum est: si Deus omnia fecerat bona, etiam et valde bona, quid est quod munda et immunda nominantur in ea animalia? Nunquid immundum bonum potest esse? Sed sciendum est quia etiam quod immundum dicitur, in sua natura bonum est. Ad comparationem igitur alterius naturae melioris, quasi immundum putatur. Denique bos est melior leone, videlicet quia magis ejus natura convenit hominis necessitati subvenire, propter quem omnia creata sunt animalia, de quo etiam subditur: Et ut terror vester, et tremor sit super cuncta animantia terrae. Ideo homo terrore caeteris animantibus praepositus est, ut esset in solatium vindictae transactae, | et ne pauci homines a pluribus opprimerentur bestiis, et ut scirent se irrationabilibus dominari debere, non rationabilibus. Unde et primi parentes nostri pastores pecorum, non reges hominum esse leguntur. Caeterum spiritaliter in hoc quod Noe dicit: Fac tibi arcam, consilium Patris ad Filium potest intelligi de acceptione carnis. De lignis laevigatis, id est de Judaeis lege fabricatis. Noe cum filiis suis in superiori loco Christus est cum apostolis suis; aves in secundo, sancti designantur; pecora in tertio, innocentes figurantur; bestiae in quarto, mundiales innuuntur. Quintus vero locus cum stercoribus infernus exprimitur. Aliter: per haec quinque loca quinque ascensiones Ecclesiae ostenduntur, id | est catechumen, baptizati, conjugati, poenitentes, sancti. Quod autem post septem dies pluvia descendit, pluvia voluntaria post veterem legem potest intelligi, de qua dicitur: Pluviam voluntariam segregabis, Deus, et reliqua (Psal. LXVII, 10). Quod autem dicit, rupti sunt omnes fontes, evangelistas; abyssi magnae profunditas Veteris Testamenti; cataractas coeli apostolos intellige. Sed in hoc quod dicit: Inclusit illum Dominus a foris [ Z., eum Dom. deforis. ], ostendit Christum Ecclesiam suam custodire a persequentibus. Quod igitur intulit omnem carnem consumptam, haereticos praecavet, existimantes aliquos diluvium evasisse, sicut de Mathusala putatum est. Qnodque dicit, euntes et redeuntes, significat in persecutores vindictas et haereses in haereticos revertentes. | Corvus dimissus et non reversus figuram peccatoris vel diaboli tenet, ad regnum Christi non revertentis. Columba vero, quae est reversa, Adam, sicut nonnulli volunt intelligi, significat ad paradisum revertentem per Christum, si lector accipere voluerit; vel potius unumquemque justum ad Ecclesiam, cujus pes, id est sensus, in hoc mundo non requiescit. Ramus olivae in ore columbae confessionem significat Trinitatis in ore uniuscujusque sancti. Cum virentibus foliis, id est operibus perfectis.\
"""
