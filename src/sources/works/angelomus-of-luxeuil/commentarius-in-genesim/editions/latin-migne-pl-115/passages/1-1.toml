physical_line_ranges = [[14, 16]]
text = """
VERS. 1.-- In principio creavit Deus coelum et | terram. Primum notandum quod mox Scriptura primo verbo aeternitatem atque potentiam Dei creatoris ostendit. Quem enim in principio temporum mundum creasse perhibet, ipsum profecto ante tempora aeternaliter exstitisse, designat; et quem in ipso conditionis initio coelum et terram creasse narrat, tanta celeritate operationis omnipotentem declarat, cui voluisse fecisse est. Et in hoc aperte datur intelligi quia utrumque simul ab eo factum est, quamvis utrumque ab homine dici non possit. In principio. Quod duobus modis accipi potest: in principio scilicet primum [ Z., primo] omnium, hoc est, in initio creaturarum, quod LXX Interpretes, et Symmachus, et Theodotion similiter transtulerunt. Et in Hebraeo scriptum est: Bresith, quod Aquila interpretatur, | in capitulo. Sive quod ait, in principio, intelligendum est, in Filio, qui de semetipso ait: Principium qui et loquor vobis (Joan. VIII, 5). Et de quo Joannes dicit: In principio erat Verbum, et reliqua (Joan. I, 1). Unde et in psalmo de ipso Psalmista ait: In capite libri scriptum est de me (Psal. XXXIX, 8). Et ideo in principio, id est in Filio, imo per Filium fecit Deus omnem spiritalem corporalemque creaturam, quae coeli et terrae nomine appellata est. Sed magis hoc qui ita dicunt, secundum sensum quam secundum verbi translationem de Christo accipi volunt. Sed forte quaerit aliquis quare fecit Deus coelum et terram? Cui respondendum est: Voluntas enim Dei causa est coeli et terrae; et ideo major est voluntas | Dei quam coelum et terra; et qui hoc quaerit, majus aliquid quaerit quam est voluntas Dei, et nihil majus invenire potest. Compescat se ergo humana temeritas, et id quod non est non quaerat, ne id quod est non inveniat. Et si voluntatem Dei nosse desiderat, fiat amicus Dei. Quia si alicujus voluntatem hominis nosse vellet, cui amicus non esset, omnes ejus impudentiam [ Z., imprudentiam] aut stultitiam deriderent. Attamen arbitrari possumus mundum istum hominis causa esse fabricatum, qui domus illius quodammodo factus est; qui, cum diversis constet substantiis, unus est [ Z. om. est] tamen multis membris aptatus, ut ex his invicem mutuis operibus, quae necessaria homini futura erant gignerentur. Denique quod ait: Creavit Deus coelum et terram, | nonnulli simpliciter intelligentes, quibus sacra Scriptura nidus est, et non habentes pennas quibus queant alta petere, dum audiunt Deum, putant eum esse corporeum, et aliqua mole mirae magnitudinis summaque potentia praeditum. Isti enim non sunt per omnia contemnendi, sed potius implorandum est [ Z., om. est] pro eis, ut Dominus mittat angelum suum qui eos in nidum recollocet, et plumescant, atque alas spiritalis intelligentiae accipiant, ut Deum incorporeum et invisibilem intelligant, ne tanquam pulli implumes a viantibus conculcentur.

Alii vero, altioris intelligentiae sapientia [ Z., intelligentia sapientiae] praediti, quibus divina Scriptura non jam quodammodo nidus, sed fructus est atque cibus, qui per ramos hujus arboris gratulando volitant, | attendentes ipsum Deum incorporeum, invisibilem, et intelligunt qualiter in Filio, hoc est, in Verbo suo non transeunter sonando, sed aeternaliter manendo, creavit coelum et terram. Itaque [ Z., jamque] quod sequitur: coelum et terram, diversi diversa sentiunt. Nonnulli nomine coeli volunt intelligi coelum istud conspicuum; et terrae nomine terram hanc visibilem, ex qua gignuntur universa. Alii quippe illud intelligi volunt coelum thronum Dei, quod solius [ Z., solum] praesentiae divinae ab omni volubilitate hujus mundi manet secretum, de quo in sequentibus plenius suo loco dicturi sumus. Alii autem in coelo intelligunt spiritales creaturas, id est angelicam dignitatem; quia prima die ipsam spiritalem condidit, | de qua legitur in libro beati Job: Cum me laudarent simul astra matutina, et jubilarent omnes filii Dei (Job. XXXVIII, 7); in terra vero informem materiam. Alii quippe vocabulo coeli ac terrae ipsam informem materiam, ex qua creatum est coelum et terra. Nec immerito, quia futurum erat ut ex ipsa formarentur. Nam coelum postea scribitur factum. Taliter dictum est quemadmodum si, semen arboris considerantes, dicamus ibi esse radices, et robur, et ramos, et fructus, et folia, non quia jam sunt, sed quia inde futura sunt. Ipsa enim confusa [Petr., inconfusa] materia quasi semen coeli ac terrae erat. Nam illi qui coeli nomine hoc visibile coelum, et terrae vocabulo hanc conspicuam intelligi volunt, si eis opponatur | quid [ Z., quod] Deus fecerit secunda et tertia die, omnino non habent quid respondere queant. Qui vero, ut dictum est, coeli nomine spiritales intelligunt dignitates, ac terrae vocabulo informem materiam, ex qua cuncta formata sunt, hi quoque recto sentiunt, et sensus eorum credendus est, ita tamen si idonei sunt ad discernendum [ Z., discendum] quid praecedat aeternitate, quid tempore, quid electione, quid origine. Nam duo quae in primo et in ultimo ponuntur loco, difficillima sunt ad intelligendum. Arduum namque est et difficillime comprehendi potest qualiter Deus sua aeternitate cuncta praecedit [Petr., procedit]. Duo vero quae medio ponuntur, id est qualiter tempore flos fructum, et electione fructus florem praecedat, facile valet comprehendi. Caeterum | quomodo origine, ut sonus cantum praecedit, obscurum ad capiendum est. Sed notandum est quia omnis cantus sonus, non omnis sonus cantus. Sonus enim formatus fit cantus, et non solum cantus, sed etiam suavis ac dulcis, ideoque sola origine sonus praecedit cantum. Sic quippe informis materia non aeternitate praecedit formatas creaturas, sicut Deus ipsam. Non tempore, quia tempora non fuerunt nisi post formatas creaturas. Nec electione cum penderet extremior, quia potiores sunt formatae creaturae quam informis substantia; sed sola sua origine praecedit formatas creaturas. Deus enim ex nihilo condidit informem materiam, et ex ipsa cuncta creavit, juxta quod scriptum est in libro Sapientiae: Non enim erat manus tua, Domine, invalida, qua creasti | mundum ex informi materia (Sap. XI, 18). Unde philosophi, prout jam dictum est, non valentes penetrare quemadmodum divina Sapientia mundum creavit ex nihilo, aestimabant coaeternum esse mundum. Ista propterea dicunt, quia attendunt fabrum, et non Deum. Aiunt enim: Lignum adjuvat fabrum, et argentum argentarium, et aurum aurificem. His enim quamvis indigeant, tamen creare nequeunt. Dominus autem nihil horum indiguit, sed ex informi materia condidit omnia, non extra se tanquam faber (non enim faber facit lignum, sed de ligno aliquid facit). Omnipotens autem nulla re adjuvandus erat, quam ipse non fecerat, ut quod volebat efficeret, alioquin Deus non esset.

Sed quaeritur cur ita dictum est: In principio | fecit Deus coelum et terram, et non dictum est: In principio dixit Deus: Fiat coelum et terra, sicut de luce narratur: Dixit Deus: Fiat lux, et reliqua? Nisi quia prius universaliter nomine coeli et terrae comprehendendum erat, et commendandum quod fecit, et deinde per partes exsequendum, sicuti actum legitur. Sequitur:\
"""
