physical_line_ranges = [[41, 41]]
text = """
VERS. 2.-- Complevitque Deus die septimo opus suum quod fecerat, et requievit die septimo, et caetera. Ideo juxta historiam senario numero mundi creationem perfecit, quia ille numerus perfectus juxta arithmeticae disciplinae legitur rationem, ut ostenderet Deus omnia perfecta et valde bona eum | condidisse. Caeterum altius requiritur quid est quod hic dicitur, requievit, cum ipse in Evangelio ait: Pater meus usque modo operatur, et ego operor? (Joan. V, 17.) Sed de requie Dei trimoda [Petr., tribus modis] expositio a doctoribus ponitur. Primum quod hic ait, requievit, id est a condendis novarum creaturarum generibus cessavit, quia deinceps nihil novi creavit per originem. Sed tamen usque modo operatur regendo et ministrando creaturam suam, quam ex informi materia condiderat. Aliter: quod ait, requievit, ideo dictum est quia futurum erat ut ipse, per quem facta sunt omnia, pro nostra redemptione ipso septimo die quiesceret [ Z., requiesceret] in sepulcro. Seu translato genere locutionis potest referri ad membra capitis. Dicitur namque, | Deus requievit, pro eo quod est, requiescere fecit, quia nimirum in ipso electi perfectam obtinent requiem post hanc vitam aerumnosam, quae per sex dies figuratur velut in septimo die in requie coelesti, quae interim alia in vita suscipit animas electorum, donec tandem adveniat octava dies futurae resurrectionis. Bene namque dictum est, requievit Deus post valde bona opera, ut ostenderet quia aliter electi non valent pertingere ad septimam diem, ad requiem scilicet beatam, nisi post opera valde bona. Movet denique ad quaerendum qua ex causa sex diebus operari voluit omnia opera sua, et septimo quiescere, nisi quia iste numerus magnum retinet mysterium. Si enim dividatur in duo, id est in unum et sex, in uno signatur unitas divinitatis, seu | unio [ Z., unitas] charitatis; in sex vero perfectio bonorum operum, et in septimo aeterna requies animarum. Voluit namque Deus idcirco opera sua sex diebus agere, et septimo requiescere, ostendens quod illi qui modo unitatem charitatis perfectionemque bonorum operum exhibent, pervenient ad requiem coelestem, ut contemplentur unitatem divinae majestatis, licet dicatur et altius. Senarius vero numerus primus opere et actu perfectus est, quia in sex diebus creavit Deus coelum, et terram, et partibus suis impletur. Nam unus, duo, tres, fiunt sex. Significatur enim in requie diei septimi, quod Deus ante creationem mundi in seipso natura et potestate perfectus est, et aeternaliter in seipso habet requiem; | creaturae vero actu ab ipso creationis accepto habent per ipsum in suis naturis perfectionem quamdam, quia unaquaeque creatura creata est perfecta a Creatore, et requiem in operatione obedientiae, et maxime rationabiles creaturae eo bono beatae sunt ut in conditore suo requiescant. Sequitur:\
"""
