physical_line_ranges = [[59, 59]]
text = """
VERS. 17.-- In quacunque die comederitis ex eo, morte moriemini. Quaeritur de qua morte dicatur, utrum de morte corporis, an de morte animae, an de morte gehennae? Sed sciendum est quia de utraque morte sentiendum est, animae videlicet et corporis. Animae mors est, dum propter peccatum quodlibet | Deus deseritur [ Z., eum Deus deserit], qui est vita ejus. Mors corporis est, dum propter necessitatem quamlibet corpus deseritur ab anima. Quia sicut Deus est vita animae, ita anima est vita corporis, quam mortem corporis peccando promeruerunt, quoniam immortales forent si non peccassent; et licet non statim fuissent mortui, sed post longum tempus, tamen quia jam spes immortalitatis amissa erat, futura mors praesens dicta est, quoniam haec coepit in spe haberi. Unde Symmachus transtulit, mortales eritis. Et hanc duplam hominis mortem Christus sua simpla morte destruxit. Nam sola carne mortuus est ad tempus, anima vero nunquam, quoniam nunquam peccavit. Possumus etiam mortem gehennae intelligere, qua nunc cruciatur anima privata societate | sanctorum, quae post judicium recepto corpore pariter poenam sustinebit. Unde nonnulli, auctoritate Scripturarum fulciti, quatuor mortes ostendunt: prima mors est, inquiunt, animae, quae deserit suum creatorem. Cum enim deserit, peccat. Hinc Dominus in Evangelio ait: Dimitte mortuos sepelire mortuos suos (Matth. VIII, 22). Haec namque sententia duas mortes, animae videlicet et corporis ostendit. Tertia est solius animae, quam, dum ex hoc corpore [ Z., quae, dum a corp.] exierit, patitur, quam sustinebat dives in inferno, qui guttam aquae petiit. Quarta, cum anima in futuro receperit corpus suum, et in ignem mittetur, quando Dominus dicturus est: Ite in ignem aeternum (Matth. XXV, 41). Quando quippe peccavit | Adam, est mortuus in anima. Haec prima praecessit desertio Dei, tres postea secutae sunt mortes.\
"""
