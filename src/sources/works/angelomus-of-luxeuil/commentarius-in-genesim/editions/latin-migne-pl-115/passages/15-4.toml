physical_line_ranges = [[185, 186]]
text = """
VERS. 8, 9.-- At ille ait: Domine Deus, unde scire possum quod possessurus sim eam? Respondens Dominus: Sume, inquit, mihi vaccam triennem, et capram trimam [Cod., trinam ], et arietem annorum trium: turturem quoque et columbam. Qui tollens universa haec, divisit ea per medium, et reliqua. Quid igitur in illo mystico signo de posteritate generis sui Abrahae intelligendum erat, vel cur trium annorum animalia illi erant sumenda? vel cur animalia dividit, et volucres non dividit? Trium enim annorum animalia tres temporum articulos designant, | quibus populus ad summum honoris culmen adolevit. A temporibus vero patriarchae Abrahae per repromissiones usque ad tempora Moysi conjunctus est Deo; a tempore autem Moysi legislatoris, a Deo legis acceptione, et miraculorum ostensione, triumphis et terrae repromissionis ingressione glorificatus; a temporibus vero David regio honore et templi civitatisque Hierusalem instructione elevatus est. Aries autem regiam et sacerdotalem dignitatem; vacca sub legis littera servientem; capra etiam eumdem populum peccatorem esse designat. Aves vero spiritales et Deo electos praefigurabant. Divisiones namque animalium schismata inter carnales semper esse ostendunt. Ideo vero quod aves non divisit, pax et unitas spiritalium intelligitur. Quod | circa vesperam pavor irruit super Abram, terrorem in die judicii, qui separabit ad invicem spiritales et carnales, alios statuens in dexteram, alios in sinistram. Aves vero, quae super cadavera volitant, daemoniacae sunt potestates, quae carnalibus insidere quaerunt, quas devotus doctor sedula admonitione abigere debet.

Intelligitur et aliter iste modus figurae. Per vaccam enim significata est plebs posita sub jugo; per capram criminatrix multitudo gentium; per arietem duces populi gentium. Trium enim annorum animalia tria tempora significant, quia in tertium tempus [ Z., tertio tempore] ista divisio facta est, segregatio videlicet fidelium ab infidelibus. Per turturem enim et columbam spiritales et haeredes ex | utroque populo regni futuri [ Z., regni Dei futuri] praefigurati sunt. Volucres autem descendentes super cadavera immundi sunt spiritus, qui mentibus carnalium semper insidere quaerunt, quos devotus doctor sedula admonitione abigere debet, ut supra ostendimus. Unde et sequitur:\
"""
