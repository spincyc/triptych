text = """
VERS. 9.-- Produxitque Deus de humo omne lignum pulchrum visu, et ad vescendum suave. Quid est | ergo quod hic dicitur produxisse lignum pulchrum de humo, etc., cum supra legitur, Germinet terra herbam virentem, et lignum pomiferum faciens, et reliqua? Sed sciendum est non propterea edictum [ Z., dicitur] lignum pulchrum productum, ut novum aliquid condiderit, sed ex his generibus quae jam terra tertia die produxerat, exorta sunt postmodum, et ex illa virtute quam antea terra acceperat, producta sunt. Et hic etiam recapitulatio est, sicuti et de homine superius. Sequitur: Lignum etiam vitae in medio paradisi. Quidam tantum allegorice intelligi volunt lignum vitae divinam sapientiam, de qua Salomon ait: Lignum vitae est his qui apprehenderint eam; et qui tenuerit eam, beatus (Prov. III, 18). Sed credendum est quia sicut petra percussa a Moyse | praebuit aquas, quanquam significaret Christum, historialiter vera petra fuit: ita et lignum vitae, quamvis eumdem significat [ Z., significet] Christum, tamen erat corporaliter evidentissime lignum; quod propterea lignum vitae nuncupatur, quia si inde sumerent primi parentes, nec morbo, nec aliqua senectute deficerent, et si in obedientia permanerent, nec morerentur, sed propter obedientiam corpus eorum in spiritale converteretur, sicut sanctorum in resurrectione erit, et a terreno ad coelestem transirent immortales paradisum. Denique in caeteris erat alimentum, in isto autem sacramentum, lignumque scientiae boni et mali. Deus enim omnia bona fecit, nec aliquid mali in paradiso instituere potuit. Sed quare dicitur, lignum scientiae boni et | mali, nisi propterea appellatur lignum scientiae boni et mali, non quod illud lignum in sua natura rationabile exstitit, ut haberet scientiam boni vel mali, sed quia homo in eo experiri et scire potuerit [ Z. potuit], quid interesset inter bonum obedientiae, et malum inobedientiae? Et ideo in paradiso lignum vitae, et lignum scientiae boni et mali creatum est, ut per illud potuisset immortalis esse, per hoc vero mortalis: ligno vitae quasi medicina, ut incorruptibilis esset, utebatur; ligno autem scientiae boni et mali quasi veneno, ut moreretur.\
"""
