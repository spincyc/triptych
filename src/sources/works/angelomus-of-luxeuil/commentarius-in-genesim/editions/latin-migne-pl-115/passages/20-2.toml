text = """
VERS. 2-11.-- Dixitque de Saraa uxore sua: Soror mea est. Misit ergo Abimelech, rex Gerarae, et tulit eam, et reliqua usquequo ait: quid fecisti nobis? quid peccavimus in te, quia induxisti super me et super regnum meum peccatum grande? Cur Abraham sororem suam secundo esse dixit? Quia ex priori Pharaonis correptione certus de Dei defensione, quod violari non potuit, incertus de sua vita, an illorum evaderet manus. Et miranda est Saraae pulchritudinis | forma, quae in tanta aetate tantum amari poterat, ut vir suus propter ejus pulchritudinem se periclitari metuebat.

Cur dicit Deus ad Abimelech: Peperci tibi, ut non peccares in me? ut adverteretur in Deum peccari quando talia committuntur quae putant homines leviter habenda tanquam in carne peccata. Cur non mox Abimelech mortuus est, dum dixit ei Deus: Ecce tu morieris? Utique Deus praedixit quod sine dubio futurum fuisset, si in hac admonitione a peccato abstinendo non caveretur.\
"""
