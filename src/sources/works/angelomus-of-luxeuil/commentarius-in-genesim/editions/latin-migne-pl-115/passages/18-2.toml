text = """
VERS. 10.-- Revertens veniam ad te tempore isto, et caetera. Id est, revertar ad te in tempore vitae. Quasi dixerit, humano more loquens: Si vixero, si fuerit vita comitata. Tradunt namque medici nonnulli quod cujus corpus viri secundum hoc cum | jam deficit, ut cum femina provectioris aetatis, quamvis adhuc menstrua patiatur, generare non possit, de juvencula potest. Et rursus mulier quae tam provectae aetatis est, quamvis adhuc menstrua fluant, et de seniore parere non possit, de juvene potest. Unde movet etiam quosdam quomodo cum esset Abraham prope mediae aetatis, secundum quam homines tunc vivebant, et postea filios de Cethura fecerit, dicatur ab Apostolo (Rom. IV, 19), corpore emortuo, et pro miraculo, quia genuit, praedicetur? Sed secundum hoc emortuum dixit, quod jam de provectioris aetatis muliere generare non posset. Si enim, quod ait Apostolus, corpus emortuum verbo quis promat, quia dixit emortuum, jam ergo nec | animam habuisse, sed cadaver fuisse intelligi debet.\
"""
