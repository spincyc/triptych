text = """
VERS. 20.-- His itaque gestis nuntiatum est Abraham quod Melcha quoque genuisset filios Nachor, fratri suo, et reliqua. Cur enim nominavit filios Nachor, fratris Abrahae? Quia de illis vel de eorum | stirpe aliquid celebre postea gestum esse legitur. Igitur Chus, de cujus Job stirpe descendit, scriptum est in exordio voluminis ejus: Vir fuit in terra Chus, Job nomine. Male igitur quidam aestimant Job de gente Esau. Secundus natus de Melcha Buzi, ex cujus genere est Balaam ille, divinus, ut Hebraei tradunt, qui in libro Job dicitur Eliu; primum vir sanctus et prophetes Dei, postea per inobedientiam et desiderium munerum caecatus, dum Israel maledicere cupit, divino vocabulo nuncupatus, diciturque in eodem libro: Et iratus Heliu, filius Barachiel, Buzites, de hujus videlicet Buzi radice descendens. Camuel quoque pater est Damasci, ipsa enim vocatur Aran [ Z., Aron], quae hic pro Syria scripta | et ipso nomine legitur in Isaia. Carhet quoque quartus est, a quo Casadei, id est Chaldaei vocati sunt. Batuel, de quo Rebecca, et Laban, pater Liae et Rachel.\
"""
