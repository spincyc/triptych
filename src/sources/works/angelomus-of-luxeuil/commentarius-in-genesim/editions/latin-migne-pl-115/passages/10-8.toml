text = """
VERS. 13, 14.-- At vero Mesraim genuit Ludim, et Anamim [ Z., Ananim], et Laabim, Neptuim, et Petrosim, et Cesloim, de quibus egressi sunt Philistiim, et Capturim. Exceptis Laabim, a quibus Libyes postea nominati sunt, qui prius Futei vocabantur, et Cesloim, qui deinceps Philistiim appellati sunt, quos non corrupte Palaestinos dicimus, caeterae gentes sex ignotae sunt, quia bello Aethiopico subversae usque ad oblivionem praetentorum [ Z., praeteritorum] nominum. | Possederunt autem terram a Gaza usque ad extremos fines Aegypti.\
"""
