text = """
VERS. 1.-- Tentavit Deus Abraham, et dixit ad eum, et reliqua, usquequo dicitur, appellavitque nomen loci illius: Dominus videt.

Quaeri solet quomodo verum sit quod Abraham Deus tentare dicitur; cum Jacobus dicat: Deus neminem tentat? (Jac. I, 13.) Nisi quia locutione Scripturarum solet dici tentare pro eo quod est probat. Tentatio vero illa de qua Jacobus dicit, non intelligitur nisi qua quisque peccato implicatur. Unde Apostolus dicit: Ne forte tentaverit vos is qui tentat | (I Thess. III, 5). Nam et alibi scriptum est: Tentat vos Dominus, ut sciat si diligatis eum (Lev. XIII, 3). Etiam hoc genere loquendi, ut sciat, dictum est, ac si diceretur, ut scire vos faciat; quoniam vires dilectionis suae hominem latent, nisi experimento etiam eidem innotescant. Igitur Abraham tentatus est ut probaretur, justificaretur, coronaretur; ut et ejus obedientia tali probata examine posteris innotesceret.\
"""
