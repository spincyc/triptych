text = """
VERS. 10.-- Congregationesque aquarum appellavit maria. Notandum quod omnes congregationes aquarum, sive dulces sint sive salsae, juxta idioma linguae Hebraicae maria nuncupantur. Sed in Hexaemeron jam dicti doctoris Bedae ita legimus: Fieri, inquit, potuit, ut terra ipsa longe lateque jussu Creatoris subsidens, alias partes praeberet concavas, quibus fluentes aquae reciperentur, ut appareret arida. Potest etiam non absurde intelligi ac credi rariores primarias fuisse aquas, quae velut nebula terras tegerent, congregatione autem esse spissatas, quae datis sibi locis capi possent, apparente arida in reliquis. Et bene ait, in locum unum, quia jugi unda | atque continua Oceano ac mari junguntur Magno. Sequitur:\
"""
