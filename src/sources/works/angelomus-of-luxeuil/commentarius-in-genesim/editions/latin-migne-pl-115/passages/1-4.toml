text = """
VERS. 4.-- Et vidit Deus lucem quod esset bona, et reliqua. Cur dicitur, vidit Deus, quasi novum aliquid accidisset, cum nequaquam crearet nisi aeternaliter | videret? Sed vidit Deus pro eo quod est, videre [ Z., videri] fecit. Saepe enim per efficientem id quod efficitur designatur. Dicitur laeta domus, et laeta epistola, et effundens hydriam [ Z., hydria] in canalibus, et caetera talia: quod genus locutionis a grammaticis metonymia vocatur. Vidit ergo Deus, id est, videre [ Z., videri] fecit, ipsi angelicae creaturae, quam bona a Deo condita est. Seu in hoc quod ait, vidit, in praedestinatione nobis videre [ Z., videri] fecit quam bona a Deo creata esset. Tali modo verbis praeteriti temporis rem futuram indicavit, quali modo apostolis ait: Omnia quaecunque audivi a Patre meo, nota feci vobis (Joan. XV, 15); quod futurum erat ut faceret. Caeterum dum dicit, divisitque lucem a tenebris, ostendit quia distinctio facta est inter lucem | et tenebras, non tenebrae factae; quemadmodum clamando vocem, silentium autem non clamando dicimus, quia cessatio vocis silentium est. Distinguimus tamen sensu quodam inter ea, et illud vocamus vocem, istud silentium. Quemadmodum ergo recte dicimus facere silentium, sic recte Deus dicitur facere tenebras; quia lucem, quibus vult, temporibus et locis vel dat, vel detrahit. Quia, ut Clemens ait: Unam [ Z., imam], inquit, mundi partem illustrans aliam reliquit obscuram. Lucem videlicet in superiore orbis parte diffundendo, in qua humana erat conversatio futura, inferiora vero ejus priscis in tenebris remanendo. Si cui hoc accipere placuerit, nos, ut coepimus, B. Augustini [Suppl. ex | Z., dicta] sequi, et expositionem magistri nisi sumus.

Et divisit Deus lucem ac tenebras [ Z., a tenebris ], et reliqua. Id est, coelestes angelorum cives ab inmundis spiritibus, quando Lucifer avertendo a Creatore, et convertendo ad se, aestimans sibi sufficere, superbia tumidus, sine auxilio sui conditoris, ejectus est cum suis sequacibus a coelestibus, et caeteri in sua stabilitate permanserunt, hos nuncupans diem, illos noctem, juxta quod sequitur, appellavitque lucem diem, et tenebras noctem. Quia ruina ruentium aeterna facta est stabilitas permanentium, licet quidam dicant quod divisio lucis a tenebris distinctio sit formatae rei ab informi; appelatio autem diei et noctis, inquiunt, insinuatio distributionis est, | qua significetur nihil Deum inordinatum relinquere. Sed quod ait, vocavit, dicitur, vocari fecit. Quia sic distinxit omnia et ordinavit, ut discerni possent et nomen accipere. Sequitur:\
"""
