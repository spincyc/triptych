physical_line_ranges = [[226, 228]]
text = """
VERS. 14-20.-- | Surrexit itaque Abraham mane, et tollens panem et utrem aquae, imposuit in scapula ejus, et reliqua. Si tredecim annorum erat Ismael quando natus est Isaac, adjunctisque aetate ablactationis annis, quomodo convenit tantae aetatis adolescentem matris sedisse cervicibus dum dicitur: Sumpsit Abraham panes et utrem aquae, et dedit Agar ponens super humerum ejus, et parvulum, et dimisit eam? Omnis igitur filius secundum idioma linguae Hebraeorum ad comparationem parentum infans vocatur et parvulus. Et est sensus: posuit ergo Abraham panes et utrem super humerum Agar, et hoc facto dedit puerum matri, hoc est, in manum ejus eum tradidit, commendavit, et ita emisit e domo; quod in sequentibus declaratur, dum dicitur: | Surge, tolle puerum, et tene manum ejus, non ut eum de terra velut jacentem tolleret, sed quasi comitem manu teneret. Quod autem manu parentis tenetur, sollicitus monstratur affectus.

Quid est quod dicitur matrem flevisse, et Deum vocem pueri exaudisse? Quia mater non suam mortem, sed filii deplorabat, pepercitque Deus puero suo, pro quo fuerat fletus matris.

Quomodo ad [ Z., quom. autem ad, etc.] puteum Juramenti agrum plantaverat Abraham, si in terra illa, quemadmodum Stephanus dicit, non acceperat haereditatem nec spatium pedis? Ea est intelligenda haereditas quam Deus munere suo fuerat daturus gratuito, non in ista quae pretio empta est. Intelligitur | autem spatium circa puteum ad illud emptionis pactum pertinere in quo fuerant agnae septem datae, quando Abimelech et Abraham sibi etiam juraverunt.\
"""
