text = """
VERS. 10-16.-- Dixitque Jacob: Sic enim vidi faciem tuam, quasi viderem vultum Dei, et reliqua usque praecedat Dominus meus ante servum suum, et ego sequar paulatim vestigia ejus. Quid sibi vult quod Jacob ait fratri suo: Vidi faciem tuam quasi viderem faciem Dei? Utrum paventis et perturbati animi verba usque in hanc adulationem proruperunt? Haec | verba fraterna sunt et benigno animo dicta. Quoniam post benignam susceptionem metus ipse transierat. Et fortassis Dei nomen, et angelorum, vel aliquem sanctum hoc loco intelligere debemus, secundum Apostolum, qui dixit: Etsi sunt qui dicuntur dii sive in coelo, sive in terra, quemadmodum sunt dii multi et domini multi (I Cor. VIII, 5).

Quomodo promisit Jacob fratri suo ut sequeretur vestigia ejus, cum alio itinere tenderet? Forte ad horam sequebatur, vel primo veraci animo promiserat, sed aliud postea cogitando delegit.\
"""
