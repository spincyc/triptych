physical_line_ranges = [[359, 361]]
text = """
VERS. 7, 8.--Quomodo Scriptura dicit post mortem Isaac patris sui Esau abscessisse de terra Chanaam, et habitasse in monte Seir, cum veniente de Mesopotamia Jacob, legitur misisse eum nuntios ad fratrem suum in terra Seir regionis, Idumaeumque ibi habitasse tum temporis? In promptu est cogitare quod scilicet Esau posteaquam in Mesopotamiam frater ejus abscessit, noluit habitare cum parentibus suis, sive ex illa commotione qua dolebat, benedictione se fraudatum, sive causa uxorum suarum, | quas odiosas videbat esse parentibus, et coeperat habitare in monte Seir. Deinde post reditum Jacob fratris sui, facta inter eos concordia, reversus est et ipse ad parentes, et cum mortuum patrem simul sepelissent quia eos plurimum ditatos terra illa, sicut scriptum est, minime capiebat, abscessit rursus in Seir, et ibi propagavit gentem Idumaeorum.

Erant autem filii Jacob duodecim, et computatis omnibus, Benjamin, quod et addidit, hi filii Jacob qui nati sunt ei in Mesopotamia Syria [Z., Syriae]. Dum constat Benjamin natum esse in Chananaea, quomodo tunc duodecim nasci dicuntur in Mesopotamia?

Nulla enim est facilior solutio hujus quaestionis, quam ut per synecdochen accipiatur. Ubi enim | major pars est, aut fortior, solet ejus nomine etiam illud comprehendi quod ad ipsum nomen non pertinet.\
"""
