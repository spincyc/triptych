physical_line_ranges = [[36, 37]]
text = """
VERS. 28.-- Benedixitque illis dicens: Crescite, et multiplicamini, et replete terram, et subjicite eam. Hanc sententiam nonnulli historialiter sentiunt, quidam vero spiritaliter; sed melius, qui utroque modo. Sed sciendum, quoniam non est incredibile, secundum benedictionem Dei posse crescere et multiplicari eos per coitum, si obtemperantes fuissent praeceptis divinis, ita vero ut membra genitalia moverentur natura, non aliqua instigante concupiscentia libidinis, ut tot videlicet procrearentur ex eis | electi, quot eligendi sunt ex omnibus gentious ad instaurandum numerum angelorum, et nequaquam sibi succederent moriendo; sed completo numero electorum a corporali paradiso sine morte ad coelestem transirent. Sed quibusdam hoc impossibile videtur, ut membra potuissent moveri absque libidine, cum membra, inquiunt, concupiscentia moventur. Sed attendant quia non solum in hominibus, sed etiam in bestiis irrationabilibus aliqua membra moventur, et caetera immobilia permanent, quae eis, si dicerentur, non crederent nisi cernerent. Saepe namque cutis animalis, muscis stimulata, movetur sola, ut muscas excutiat, caetera membra immobilia perseverant. Sic etiam et auris una movetur, et caetera quiescunt; et multa alia quae incredibilia forent | nisi viderentur. Si itaque ista possunt fieri in membris irrationabilium, quanto magis ex benedictione Domini membra natura, non concupiscentia ad procreandum moveri quiverant? Et sicuti in cultu ruris agitur ad segetes procreandas, ita Adam sine concupiscentia in illa muliere valuit prolem procreare.

Salva historiali narratione, potest referri ad fecunditatem animae, crescite, id est, multiplicamini augmentando virtutes, et replete terram, sub carnis virtutibus fecunditate, et subjicite spiritui, et dominamini bestiis, hoc est, motibus, quos similes bestiis, per temperantiam [ Z., habetis per intemperantiam]; qui si erumpunt in perniciosas delectationes, | similes sunt bestiis; si autem reguntur, omnino mansuescunt. Hinc Paulus ait: Qui autem sunt Christi, carnem suam crucifixerunt (Gal. V, 24). Sed quaeritur in quam utilitatem dominationem accepit homo in pisces, et volatilia, et caetera, vel ad quos usus? Non enim comederet si non peccasset, sed ad escam solum arborum sunt fructus in prima conditione concessi. Nisi forte dicendum est quia peccaturum praesciebat eum Deus, et mortalem peccando futurum. Ideoque solatia primordialiter instituit, quibus suam fragilitatem possit tueri, seu alimentum ex his vel caetera necessaria.\
"""
