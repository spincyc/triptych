physical_line_ranges = [[48, 48]]
text = """
VERS. 8.-- Plantaverat autem Dominus Deus paradisum voluptatis, etc. Paradisus hortus, sive voluptas, vel deliciae interpretatur. Sciendum est quia quatuor modis in divinis libris paradisus legitur. Est enim paradisus, de quo in hoc loco Moyses loquitur, qui tamen, in quo loco, quave provincia vel regione situs fuerit, soli Deo cognitum est, praesertim cum toto [ Z., in toto] orbe terrarum nusquam reperiri potest. Sed tamen, ut nonnulli autumant, in Oriente est positus; quia, inquiunt, opportunum erat ut locus prae caeteris amoenissimus in excellentiori parte | mundi plantaretur. Unde nonnulli transtulerunt: In Eden contra Orientem. Dicitur et paradisus mundus propter ornatum suum, ut in Ezechiele, ubi Dominus de regno Assyriorum locutus est: Cedri non fuerunt altiores illo in paradiso Dei (Ezech. XXXI, 8). Legitur etiam et paradisus spiritalis, in quem Paulus se raptum commemorat dicens: Scio raptum hominem in paradisum (II Cor. XII, 2), id est in coelestem amoenitatem. Juxta anagogen vero paradisus Ecclesia est. Unde Salomon in Cantico canticorum ait: Hortus conclusus soror mea, hortus conclusus, fons signatus, emissiones tuae paradisus (Cant. IV, 12). Ait enim: Plantaverat autem Dominus Deus paradisum voluptatis a principio. Nam quod ait, a principio, | nonnulli intelligi volunt ab initio terrae, id est ab Oriente. Sed quod dicit, a principio, id est ab exordio, sive ab initio coeli et terrae, sicuti Symmachus et Theodotion transtulerunt, intelligitur. Et ideo non Orientem, sed exordium, et initium significat. Unde intelligitur quod antequam coelum et terram faceret Deus, paradisum condiderat. Lege librum Locorum beati Hieronymi. Legitur enim in Hebraeo: Plantaverat autem Dominus Deus paradisum in Eden a principio. Eden deliciae interpretatur. Bene dicit in Eden, id est, in loco deliciarum. Unde et quod hic dicitur voluptatis, Symmachus paradisum florentem transtulit.\
"""
