text = """
VERS. 10-12.-- Et abigebat eas Abram. Quod hoc moraliter intelligi volunt. Saepe corda justorum subortae cogitationes polluunt, et terrenarum rerum delectationibus tangunt; sed dum citius manu sanctae discretionis abiguntur, quasi aves repelluntur, ne cordis faciem caligo tentationis operiat, quae hanc jam ex illicita delectatione tangebat. Nam saepe in ipso orationis nostrae sacrificio importunae cogitationes | se ingerunt, quae hoc rapere vel maculare valeant, quod in nobis Deo flentes immolamus. Unde et Abram, cum ad occasum solis sacrificium offerret, insistentes aves pertulit, quas studiose, ne oblatum sacrificium raperent, abegit. Sic nos, dum in ara cordis holocausta Deo offerimus, ab immundis haec volucribus custodimus, ne maligni spiritus et perversae cogitationes rapiant quod mens nostra offerre Domino utiliter poterat.\
"""
