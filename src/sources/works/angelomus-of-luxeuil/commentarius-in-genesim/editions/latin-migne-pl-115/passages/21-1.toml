text = """
VERS. 8.-- Fecitque Abraham grande convivium in die ablactationis filii sui. Quare in die ablactationis Isaac, et non in die nativitatis vel circumcisionis fecit convivium grande? Ut adverteretur quod nisi ad aliquam spiritalem significationem referatur, nulla solutio quaestionis est. Fecit itaque pater excelsus convivium cum a lacte depellitur Isaac, et fit laetitia magna, quia summo doctori de his fit gaudium, qui jam lacte non indigent, sed cibo spiritali, qui possibilitate sumendi exercitatos habent sensus, et discretionem boni et mali; de quibus dicit Isaias: | In Toramine aspidis, et in caverna reguli mittet manum suam, qui ablactatus est lacte (Isa. XI, 9). Super his autem convivium non potest agi laetitiae, de quibus dicit Apostolus: Lac vobis votum dedi, non escam (I Cor. III, 2).

Sed requirendum videtur juxta historiam, post quot annos pueri ablactari soleant. Inter Hebraeos autem varia opinio est, asserentibus aliis quanto anno, aliis duodecimo ablactationis tempus impleri, quod apud nos non ita teneri videtur, sed aut tertio, quartove, aliquando autem quinto anno ablactatur. Sequitur:\
"""
