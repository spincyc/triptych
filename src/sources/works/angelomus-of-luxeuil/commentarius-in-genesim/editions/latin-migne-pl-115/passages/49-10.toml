text = """
VERS. 22-26.-- Filius meus Joseph accrescens, filius meus accrescens et decorus aspectu. Filiae discurrerunt super murum; sed exasperaverunt eum, et | jurgati sunt, invidentesque illi habentes jacula. Sedit in forti arcus ejus, et desolata [dissoluta] sunt vincula brachiorum et manuum ejus per manus potentis Jacob. Inde pastor egressus est, lapis Israel. O fili Joseph, qui tam pulcher es, ut te tota die de muris et turribus ac fenestris puellarum Aegypti turba prospectant. Inviderunt tibi, et ad iracundiam provocaverunt fratres tui, habentes livoris sagittas et zeli jaculis vulnerati. Verum arcum tuum et arma pugnandi posuisti in Deo, qui fortis est propugnator, et vincula tua quibus te fratres ligaverunt absoluta sunt et disrupta, ut ex tuo semine tribus nascatur Ephraim fortis, et stabilis, et instar lapidis durioris invicta, imperans quoque decem tribubus Israel.\
"""
