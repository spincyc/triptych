text = """
VERS. 25-34.-- Viderunt viatores Ismaelitas venire de Galaad, et camelos eorum portantes aromata, et resinam, et stacten in Aegyptum, et reliqua usque et praetereuntibus Madianitis negotiatoribus vendiderunt viginti [Z., triginta] argenteis. Quaeritur quare Ismaelitas Scriptura, quibus a fratribus venditus est Joseph, etiam Madianitas vocet cum Ismael sit de | Agar filius Abrahae, Madianitae vero de Cethura? Quia Scriptura dixerat de Abraham quod munera dederit filiis concubinarum suarum, Agar scilicet et Cethura, et dimisit eos ab Isaac filio suo, in terra Orientis unam gentem fecisse intelligendi sunt. Spiritaliter vero aromata quae in camelis portantur, duas leges significant: per resinam autem legem librorum, per stacten quippe legem prophetarum. Per camelos namque doctores designantur. Quod autem Joseph non est liberatus per consilium Judae, significat Christum non liberatum ex parte carnis per seram poenitentiam Judae Scarioth.\
"""
