text = """
VERS. 20.-- Quindecim cubitis altior fuit aqua super montes quos operuerat. Quaeritur, si aqua transcendit quindecim cubitis, altitudo [ Z., cubitis, cujus altitudo] hunc aerem turbulentum, ut fertur, transcendit, ubi dicitur nec nubes videri, nec ventus [ Z., dicuntur nubes videri, nec ventus, etc.] sentiri, sicut de Olympo opinantur? Sed sciendum est, si terra spatium illius tranquilli aetheris invadere potuit, cur et non aqua crescendo illum montem et aerem etiam transcendere potuit? Sunt tamen quidam qui putant nec terrae inaequalitatem [ Z., aequalitatem] | talem esse, nec montium altitudinem tantam ante diluvium esse sicut nunc est.\
"""
