text = """
VERS. 24.-- Factus est Esau vir gnarus venandi et homo agricola; Jacob autem vir simplex habitavit in tabernaculis. Vel sicut in alia translatione dicitur, habitabat domi. Quid per venationem Esau nisi eorum vita figuratur qui in exterioribus voluptatibus fusi carnem sequuntur? Qui etiam agricola esse describitur, quia amatores hujus saeculi tanto magis exteriora incolunt quanto interiora sua inculta derelinquunt. Jacob vero simplex in tabernaculis vel in domo habitare perhibetur. Quia nimirum omnes qui in curis exterioribus spargi refugiunt, simplices in cognitione atque in conscientiae suae habitatione consistunt. In tabernaculis enim aut in domo habitare | est se intra mentis secreta restringere, et nequaquam exterius per desideria dissipare; ne, dum ad multa foras inhiant, a seipsis alienati cogitationibus recedant.\
"""
