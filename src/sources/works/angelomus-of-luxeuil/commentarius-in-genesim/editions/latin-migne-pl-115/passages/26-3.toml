VERS. 23-25.--Porro quibusdam interpositis sequitur historia, quod ascendit ab illo loco in Bersabee, ubi apparuit ei Dominus in ipsa nocte, et reliqua usquequo ait: Ad quem locum cum venissent Abimelech, et Ochoza, amici illius, et Ficol, dux militum, etc. Et ait: Ego sum Deus Abraham patris tui. Ac si diceret: Dum patris tui Deus sum, misericors ero tui sicut et illorum. Caeterum Isaac spiritaliter, Dominus scilicet noster, extendit tabernaculum, id est Ecclesiam. Praecepitque servis suis, id est apostolis, ut foderent puteum, id est doctrinam apostolicam; | propriis manibus, videlicet propriis scriptionibus. Sed quid diversi putei Isaac, quos foderunt pueri ejus, significent, jam saepe praefati viri liber indicat, si quis nosse gestierit. Sequitur:\
