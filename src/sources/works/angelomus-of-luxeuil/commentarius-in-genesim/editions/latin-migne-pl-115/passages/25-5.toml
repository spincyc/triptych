physical_line_ranges = [[281, 284]]
text = """
VERS. 31-33.--Denique sequitur qualiter Esau primogenita sua propter lentis edulium Jacob vendidit. Quae sunt primogenita quae Esau vendidit Jacob fratri suo? Tradunt Hebraei omnes primogenitos fungi officio sacerdotum, antequam Aaron in sacerdotium eligeretur, et habuisse vestimentum sacerdotale, quibus induti victimas offerebant, et haec esse vestimenta Esau quibus Rebecca induit Jacob filium suum, quorum odore pater delectatus benedictionis initium astruit. Et haec sunt primogenita quae propter vitium gulae perdidit. Sed sciendum est quia quinque | nos modis gulae vitium tentat. Aliquando namque indigentiae tempora praevenit, aliquando vero tempus non praevenit, sed cibos lautiores quaerit. Aliquando quaelibet sumenda sint, praeparari accuratius expetit. Aliquando autem et qualitati ciborum et tempori congruit, sed in ipsa quantitate sumendi mensuram refectionis excedit. Nonnunquam vero et abjectius est quod desiderat, et tamen ipso aestu immensi desiderii deterius peccat. Quae vitiorum tempora melius ostendimus, si haec exemplis evidentioribus approbemus. Mortis quippe sententiam patris ore Jonathan meruit, quia in gustu mellis constitutum edendi tempus antecessit. Et ex Aegypto populus eductus in eremo occubuit, quia despecto | manna cibos carnium petiit, quos lautiores putavit. Et prima filiorum Heli culpa suborta est quod ex eorum voto sacerdotis puer non antiquo more coctas vellet de sacrificio carnes accipere, sed crudas quaereret, quas accuratius exhiberet. Et cum ad Hierusalem dicitur: Haec fuit iniquitas Sodomae, sororis tuae, superbia, saturitas panis et abundantia aquae (Ezech. XVI, 49), aperte ostenditur quod idcirco salutem perdidit quia cum superbiae vitio mensuram moderatae refectionis excessit. Hinc primogenitorum gloriam Esau amisit, quia magno aestu desiderabilem cibum, id est lenticulam concupivit, quam, dum venditis etiam primogenitis praetulit, quo in illa appetitu anhelaret, indicavit. Neque enim cibus, sed appetitus in vitio est. Unde et lautiores cibos plerumque | sine culpa sumimus, et abjectiores non sine reatu conscientiae degustamus. Hic quippe, quem diximus, primatum per lenticulam perdidit, et Elias in eremo virtutem corporis carnes edendo servavit. Unde et antiquus hostis, quia non cibum, sed cibi concupiscentiam esse causam damnationis intelligit, et primum sibi hominem non carne, sed pomo subdidit, et secundum non carne, sed pane tentavit: hinc est quod plerumque Adam culpa committitur, etiam cum abjecta et vilia sumuntur. Neque enim Adam solus, ut a vetito se pomo suspenderet, praeceptum prohibitionis accepit.

Hic interposita [Petr., Hic item posita] est historia. | Si viri justi voluntas bona est, quid est quod Isaac non Esau, quem voluit sed Jacob, quem noluit, benedixit?

Justi hominis, quantum ad conscientiam pertinet, voluntas bona est; quantum autem ad praescientiam, immunis est ab adversis: Deus enim solus est qui de futuris judicat. Ac per hoc Isaac justus, quantum ad praesentem humanitatem dignum est, majorem filium a se benedicendum magis putabat. Sed Deus, qui occultorum cognitor est, minorem benedictionem mereri ostendit, ut in benedictione non hominis ostenderet esse benedictionem, sed Dei. Ideo dictum est in Numeris ad Moysen et Aaron sacerdotes: Ponite nomen meum super filios Israel: ego Dominus benedicam eos (Num. VI, 27). | Sacerdotis est benedicere; Dei est effectum tribuere benedictionis. Unde intellexit Isaac per spiritum prophetiae, a Deo benedictionem super minorem filium praedestinatam.

Dixit: Benedixi ei, et erit benedictus. Spiritaliter vero isaac Judaicum populum designavit, qui caligans oculis et prophetans in praesenti filium non vidit, cui tamen multa in posterum praevidit. Quia nimirum Judaicus populus, prophetiae spiritu ple nus, et caecus, eum de quo multa in futuro praedixit, in praesenti positum non agnovit. Qui etiam ad damnationis suae cumulum eum quem natum despiciunt, nasciturum longe ante praesciverunt, sed etiam ubi nasceretur. Nam ab Herode requisiti locum | nativitatis ejus exprimunt, videlicet Bethlehem, ut ipsa eorum scientia et illis fieret ad testimonium damnationis, et nobis ad adjutorium credulitatis.\
"""
