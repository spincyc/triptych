text = """
VERS. 29, 30.-- Dixitque Deus: Ecce dedi vobis omnem herbam, et universa ligna, etc., usque, ut sint vobis in escam, et cunctis animantibus terrae. Cur | enim herbae, et fructus lignorum dicuntur dati in escam cunctis animantibus terrae, et volatilibus, cum multae sint [Petr., sunt] bestiae, et volatilia, quae carnes comedunt, et non aluntur frugibus terrae, sicut sunt leones et caetera, nisi aut specialiter illa posita sunt quae his pascuntur escis; aut etiamsi carnes comedunt, ex his aluntur, quia corpora eorum comedunt quae his herbis aut frugibus pascuntur, sicuti serpentes, qui morantur in arenosis locis, sed mortes animantium sunt eis in escam.\
"""
