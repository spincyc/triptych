physical_line_ranges = [[112, 112]]
text = """
VERS. 21-27.-- Porro Henoch genuit Mathusalam, et ambulavit cum Deo (subauditur in conversatione) et non apparuit, quia tulit eum Deus. Henoch [ Z., Porro Henoch] dedicatio interpretatur, sicut superius ostendimus. Sed quaerendum est quare tantopere servatus est a morte? nisi ut ostenderetur quid omnes homines potuisssent si non peccassent. Attamen moriturus erit, ut debitum solvat humanae naturae, et quod | Christus noluit, nullus posset, id est non mori. Henoch genuit Mathusalam, et facti sunt omnes dies Mathusalae nongenti sexaginta novem anni, et mortuus est. Hic oritur quaestio famosa, et disputatione multorum ecclesiasticorum ventilata, quod juxta diligentem supputationem quatuordecim annos post diluvium Mathusala vixisse referatur. Etenim cum esset Mathusala annorum centum sexaginta septem, genuit Lamech. Rursum Lamech, cum esset annorum centum octuaginta octo, genuit Noe, et fiunt simul usque ad diem nativitatis Noe anni vitae Mathusalae trecenti quinquaginta quinque. Sexcentesimo anno autem vitae Noe diluvium factum est, ac per hoc habita supputatione per partes, nongentesimo quinquagesimo quinto anno Mathusalae diluvium fuisse convincatur. | Cum autem supra nongentis sexaginta novem annis vixisse dictus sit, nulli dubium est quatuordecim annis vixisse post diluvium, sicut in Septuaginta invenitur. Et quomodo verum est quod octo tantum animae in arca salvae factae sunt? Restat ergo ut, quomodo in plerisque, ita et in hoc sit error in numero. Siquidem in Hebraeis et in Samaritanis libris, ut beatus Hieronymus scribit, ita scriptum est: Et vixit Mathusala centum octuaginta septem annis, et genuit Lamech; et vixit Mathusala, postquam genuit Lamech, septingentos octuaginta duos annos, et genuit filios et filias; et fuerunt omnes dies Mathusalae, ut noster interpres transtulit, anni nongenti sexaginta novem, et mortuus est. Et vixit Lamech centum octuaginta duos annos et genuit Noe. A die ergo nativitatis | Mathusalae usque ad diem ortus Noe sunt anni trecenti sexaginta novem. His adde sexcentos Noe, quia in sexcentesimo anno vitae ejus diluvium factum est: atque ita fit ut nongentesimo sexagesimo nono anno vitae suae Mathusala mortuus est, et anno quo coepit esse diluvium. Unde Mathusala interpretatur, mortuus est. Quomodo enim eum cum patre translatum fuisse, et diluvium praeterisse putaverunt [ Z., putabant]? Ob hoc signanter transfertur mortuus est ut ostenderetur non vixisse eum post diluvium, sed in eodem cataclysmo, ut in quodam volumine reperi, fuisse defunctum. Soli enim, Scriptura testante (I Petr. III, 20), octo homines diluvium in arca evaserunt. Sed qui quatuordecim | annis eum vixisse referunt post diluvium, magis ad spiritalem intelligentiam tendunt, videlicet super Christo interpretantur; quoniam ipse est solus cujus vita nullam sentit aetatem. In majoribus quoque [ F. leg. quippe] suis diluvium Noe sensisse [ Z., non sensisse] videtur.\
"""
