text = """
VERS. 15.-- Tulit ergo Dominus Deus hominem, et posuit eum in paradiso voluptatis. Hic enim ostenditur | quia extra paradisum conditus est. Quidam enim dixerunt quod in Hebron [Petr., quod Hebron] conditus sit, ubi et sepultus jacet, et subito illuc positus. Hoc historia divinae legis non narrat. Ut operaretur et custodiret illum. Quid operaretur, cum nondum erat laboris defectio? vel quid custodiret, cum nullus erat aggressor vel praedo? An propter bestias dicit? Minime. Quia bestiae nocivae non fuerunt, nisi post peccatum. Sed quod ait, ut operaretur et custodiret illum, non pertinet ad servilem laborem, sed ad exercitium jucunditatis, et honestam animi voluptatem, sicut potentes, cum nullis indigent, propter jucunditatem tamen laboribus se exercent. Seu etiam propterea dictum est, ut operaretur, | et custodiret illum, id est, operaretur praecepta justitiae, et perseveraret in mandato, et custodiret semetipsum, ne perderet paradisum. Dicunt et aliter: Tulit ergo Deus hominem, et posuit eum in paradiso, ut operaretur et custodiret illum, id est ut ipsum hominem Deus operaretur, et custodiret illum; operaretur, ut justus esset; et custodiret, ut tutus esset; sicut terra operari dicitur ab hominibus non creando, sed exercendo, ut fructum ferat, quem sensum nonnulli reprehendere voluerunt, quia, inquiunt, si eum custodiret, non peccaret. Sequitur:\
"""
