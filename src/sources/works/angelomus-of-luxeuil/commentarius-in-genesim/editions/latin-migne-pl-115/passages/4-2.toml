physical_line_ranges = [[92, 92]]
text = """
VERS. 2.-- Rursumque peperit fratrem ejus Abel. Abel luctus interpretatur. Quo nomine significabatur occidendus. Idem [ Z., Item] et vanitas, sicut aliqui volunt, quia cito solutus est atque subtractus. Hic notandum est quia duae dicuntur civitates, diaboli | videlicet atque Dei, quae ab initio mundi, sicuti hic ostenditur, construi coeperunt, sicut et duae generationes, carnalis scilicet et spiritalis. Unde regula Scripturarum est [ Z., regulae Scripturarum dicunt] duas generationes malorum et bonorum [ F., esse] nosse, sicut multa exempla constant. Natus igitur Cain prior ex illis duobus generis humani parentibus pertinens ad diaboli civitatem, et ad carnalem generationem, de qua per Salomonem dicitur: Generatio quae patri suo maledicit, et matri suae non benedicit, et generatio quae sibi munda videtur, et non est lota a sordibus suis, etc. (Prov. XXX, 11); et in Evangelio: Generatio viperarum (Matth. III, 7). Et: Requirentur omnia a generatione ista. Et multa alia. Posterior Abel pertinens ad civitatem Dei et ad spiritalem | generationem. Unde Apostolus: Non prius, quod spiritale est, sed quod animale, deinde quod spiritale (I Cor. XV, 46). Quapropter unusquisque, quoniam ex damnata massa exoritur, primo sit necesse est ex Adam malus atque carnalis. Quod si in Christum renascendo profecerit, postea erit bonus et spiritalis. Sic in universo genere humano primum duae istae coeperunt nascendo et moriendo percurrere civitates. Prior qui est natus, cives hujus saeculi designat, unde et civitatem primus construxisse legitur. Posterior autem isto peregrinus in saeculo, et pertinens ad civitatem Dei, de qua Psalmista: Generatio | rectorum benedicetur (Psal. CXI, 12). Et: Haec est generatio quaerentium Dominum (Psal. XXIII, 46); et his similia. Gratia praedestinatus, gratia electus, gratia peregrinus deorsum, gratia cives sursum.\
"""
