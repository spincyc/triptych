text = """
VERS. 8.-- Et dixit Cain ad Abel fratrem suum: | Egrediamur foras. In dolo namque ei locutus est et non est dominatus peccato suo. Cumque essent in agro, consurrexit adversus eum, et interfecit eum. Ecce! Qui primum hominem mortem docuit, ipse et istum secundum occisionem. Denique si obtemperasset Deo quando audivit, peccasti, quiesce, vel sicut in nostra translatione legitur: Si bene egeris, recipies; sin autem, in foribus peccatum tuum aderit, et tu dominaberis illius, adjutus a Domino non peccaret. In foribus peccatum adest, cum in cogitationibus pulsat. Appetitus subter est, eique homo dominatur, si cordis nequitia inspecta citius premitur, et priusquam ad duritiam crescat, reluctanti menti subigatur. Quod quia Cain facere contempsit, fratricidium commisit.\
"""
