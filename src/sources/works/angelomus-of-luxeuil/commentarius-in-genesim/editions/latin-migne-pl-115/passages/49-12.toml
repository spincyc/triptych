text = """
VERS. 23.-- Vocavit autem Joseph fratres suos, dixitque eis: Post mortem meam visitabit vos Deus, | et ascendere vos faciet de terra ista ad terram quam juravit Abraham, Isaac et Jacob. Asportate vobiscum ossa mea de loco isto. Quid est quod tantus vir ossa sua ab Aegypto asportari praecepit? Non enim otiose mandasse credendus est. Qui prophetare potuit, non improvide ista praecepit. Cum enim esset in Dei creatoris devotione propensior, sciens ab ipso percepisse quod Aegyptum in tanta majestate gubernaret, noluit ut sibi honor, sed debitus Creatori deferretur: et ideo errorem post mortem suam expetiit auferri, perpendens, ab Aegyptiis causa vanitatis illicitum honorem impendi sibi post mortem, certus vanitatem vulgi mortuos magis ut deos venerari quam vivos. Et ideo ut esset alienus a vana superstitione Aegyptio rum, ne aliquando ad Dei injuriam ista fierent, praecepit | ossa sua asportari ab Aegypto; quod quidem et apostolos invenimus secutos, Paulum scilicet et Barnabam. Nam cum sacrificari sibi vidissent, scientes exosum esse Deo, sciderunt vestimenta sua dicentes: Quid facitis? Nam et nos homines sumus vobis similes (Act. XIV, 14). Et sic compescuerunt turbas. Verum si cui spiritaliter interpretari placuerit, videlicet ut Joseph significet Dominum ac Redemptorem nostrum. Aegyptus, qui interpretatur tenebrae, Judaeam propter obscuritatem suae perfidiae; ossa ejus, virtutes fidei, quam Judaea retinere indigna, suis exigentibus tenebris ignorantiae, fuit; et fratres Joseph, sanctos apostolos, quorum figuram multis in locis obtinent; terram ipsorum, Ecclesiam ex gentibus, ubi fidem Salvatoris praedicarunt; | nos contradicere nolumus; sed suo judicio sine contentione delinquere decrevimus.

| Liber enim jam finem exposcit; clausula terminum petit. Unde in calce lectorem humiliter precamur ut si hoc opusculum lectione dignum duxerit, et utile si quid invenerit, auctorem quidem scriptionis Domino commendare non abnuerit, quia ejus est donum quod aliquid utilitatis ediderim. Nam si aliqua digna reprehensione repererit, nostrae stultitiae ac infirmitati deputet, quoniam non grata nec praesumptuosa, sed imperata potius describere conati sumus; et si de artificiosa compositione causatus fuerit, sciat quia prudentes viri non compta sed utilia in Scripturis requirunt, et eis non verba artificiosa, sed dicta proficua placent; quia sciunt quod non res pro verbis, sed verba pro rebus describendis sunt instituta.

(no apparatus)\
"""
