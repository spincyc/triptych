VERS. 18.-- Terra spinas et tribulos germinabit tibi. Quod est aperte dicere: Conscientia tua punctiones tibi et aculeos vitiorum procreare non desistet. Verumtamen per sententiam quae in virum infertur, | ratio nostra arguitur, quae, peccati concupiscentia seducta, a paradiso beatitudinis remota habet maledictiones terrenae operationis pro concupiscentia peccati: habet et dolores temporalium curarum quasi spinas et tribulos. Sic tamen dimittitur a paradiso beatitudinis ut operetur terram, id est ut in corpore isto laboret et collocet sibi meritum redeundi ad vitam beatam, quae paradisi nomine significatur, possitque manum porrigere ad arborem vitae et vivere in aeternum. Manus autem porrectio bene significat crucem, vel cruciatum poenitentiae, per quem [ Z., quam] vita aeterna recuperatur. Ait enim:\
