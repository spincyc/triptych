text = """
VERS. 24.-- Septuplum, ultio dabitur de Cain; de Lamech vero septuagies septies. Sed nos simpliciter virum et adolescentulum ipsum Cain intelligimus; virum propter aetatem et fortitudinem naturae; adolescentulum propter stultitiam et lasciviam instabilitatis. Verumtamen Lamech spiritaliter Christum interpretatur, qui occidit Cain, id est diabolum. Quo occiso suis uxoribus, hoc est duabus Ecclesiis, annuntiat, quibus imperat, ut suum sermonem auscultent. | Unde quodam modo dicit occidisse se virum, quem propter fortitudinem diabolum nuncupat. In vulnus suum, scilicet morte sua; et adolescentulum ipsum ait propter lasciviam et aeternitatem. In livore suo, hoc est non [ Z., om. non] sine dolore. Sed requirendum est quid est quod legitur dixisse Lamech cum occideret Cain: Septuplum de Cain ulciscetur, de Lamech autem septuagies septies? Quia homicidii peccatum septima generatione diluvio vindicatum esse legitur, ideo dictum est. Seu, ut Judaei tradunt, septuaginta septem animae ex Lamech progenitae repertae sunt in diluvio et deletae sunt. Et in hoc numero de Lamech factam esse vindictam dicunt quod genus ipsius usque ad cataclysmum perseveraverit. Adulterii vero scelus, quod Lamech primus omnium | in duabus commisit uxoribus, non nisi sanguine Christi expiandum esse, qui septuagesima et septima generatione venit in mundum, secundum Evangelium Lucae, qui tulit peccatum mundi, qui lavit amictum suum in sanguine uvae, et torcular calcavit solus.\
"""
