text = """
VERS. 9-13.-- Cum vidisset Saraa filium Aegyptiae Agar ludentem cum Isaac, dicit ad Abraham: Ejice ancillam hanc, et filium ejus, et reliqua usque: quia | in Isaac vocabitur tibi semen. Sed et filium ancillae faciam in gentem magnam. Quod duobus modis intelligi potest, hoc est: sive quod populus Judaeorum copiosus esset in saeculo regnaturus, sive quia coelestis regni gloriam consecuturi essent qui ex eis credidissent in Christum. Sed libet notare in quo ludo arguit Saraa Ismael, filium Agar. Dupliciter itaque hoc ab Hebraeis exprimitur. Sive quod idolothytum fecit juxta illud quod alibi scriptum est: Sedit populus comedere et bibere, et surrexerunt ludere (Exod. XXXII, 6). Sive quod adversum Isaac quasi majoris aetatis loco sibi et ludo primogenita vindicaret. Quod quidem Saraa audiens non tulit. Et hoc ex ipsius approbatur sermone dicentis: Ejice ancillam hanc cum filio suo, etc.\
"""
