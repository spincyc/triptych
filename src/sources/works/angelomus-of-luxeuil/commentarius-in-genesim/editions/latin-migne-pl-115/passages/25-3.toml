physical_line_ranges = [[273, 279]]
text = """
VERS. 8-23.--Hinc sequitur qualiter Abraham deficiens mortuus est. Quomodo convenit Abrahae, tam sancto viro, et deficiens mortuus est? In Hebraeo non habetur, deficiens, sed a LXX Interpretibus additum | est. Quid est quod plenus dierum dicitur? Id est, lucis et diei operibus plenus occubuit.

Quid est quod dicit Scriptura de filiis Ismael: Habitaverunt ab Evila usque Sur, quae est contra faciem Aegypti? Evila est regio quam circuit Phison de paradiso fluens, dicta de quodam Evila, nepote Noe, et est solitudo contra faciem Aegypti. Sur quoque est solitudo inter Cades et Barad, extendens desertum usque ad mare Rubrum et Aegypti confinia.

Quid est quod dicitur de Ismaele quod duodecim generasset principes? Vel duces regionibus, vel tribubus nomina dederunt. Significat quod singuli filiorum Ismaelis e quibus primogenitus ejus fuit Nabejoth, a quo omnis regio ab Euphrate usque ad mare Rubrum Nabathena usque hodie dicitur, quae | pars Arabiae est. Nam et familiae eorum, oppidaque, et pagi, ac munita castella, et tribus horum appellatione celebrantur. Ab uno ex his Cedar in deserto Eoduma, alia regio, et Hemana ad austrum, et Cedema ad orientalem plagam dicitur.

Quid est quod dicitur de Ismaele, coram omnibus fratribus suis obiit, vel qui sunt fratris nomine censiti? id est, in manibus omnium filiorum suorum mortuus est, superstitibus omnium liberis, et nullo prius morte praerepto. Fratres autem pro filiis appellari, Jacob quoque ad Laban demonstrat dicens: Ponatur coram fratribus nostris, ut judicent inter nos. Nec enim legimus alios fratres Jacob ibi habere, exceptis liberis suis.

Quaeritur quo ierit Rebecca interrogare Dominum, | cum parvuli in utero ejus collidebantur? Forte ad locum ubi aram constituerat Abraham, orare venit, vel etiam erant aliqui tales etiam illo tempore homines Dei, in quibus posset Deus interrogari.

An secundum historiam vel etiam allegoriam intelligendum est, quod Dominus respondit Rebeccae: Duae gentes in utero tuo sunt, et duo populi ex ventre tuo dividentur, populusque populum superabit, et major serviet minori? Secundum utrumque modum. Spiritaliter vero sic solet intelligi quod dictum est, ut Esau figuratus sit major populus Dei, hoc est Israeliticus secundum carnem. Per Jacob autem figuratur Christus in populo Christiano secundum spiritalem progeniem propagatus. Sed etiam historica proprietate hoc responsum invenitur esse completum, | ubi populus Israel, hoc est Jacob minor filius, superavit Idumaeos, id est gentem quam propagavit Esau, eosque fecerunt tributarios per David. Sed postea Idumaei rebellaverunt, et jugum Israeliticum a cervice sua deposuerunt.

Sed requirendum est, quid est quod superius dicitur, Deprecatusque est Isaac Dominum pro uxore sua, eo quod esset sterilis, et reliqua? Ea quae sancti viri orando efficiunt, ita praedestinata sunt ut precibus obtineantur. Nam ipsa quoque perennis regni praedestinatio ita est ab omnipotente Deo disposita, ut ad hoc electi ex labore orationis perveniant [Petr. om. orationis], quatenus postulando mereantur accipere quod eis omnipotens Deus ante saecula disposuit | donare. Quod vero ita sit, concite valet probari. Certe etenim novimus quia ad Abraham Dominus dixit: In Isaac vocabitur tibi semen. Cui etiam dixerat: Patrem multarum gentium constitui te. Cui rursum promisit dicens: Benedicam tibi, et multiplicabo semen tuum sicut stellas coeli, et velut arenam quae est in littore maris. Ex qua re aperte constat quia omnipotens Deus semen Abrahae multiplicare per Isaac praedestinaverat. Et tamen scriptum est: Deprecatus est Isaac Dominum pro uxore sua, eo quod esset sterilis. Qui exaudivit eum, et dedit conceptum Rebeccae. Si ergo multiplicatio generis Abrahae per Isaac praedestinata fuit, cur conjugem sterilem accepit? Sed nimirum constat quia praedestinatio precibus impletur, quando is in quo Deus multiplicari semen | Abrahae praedestinaverat, oratione obtinuit ut filios habere potuisset.\
"""
