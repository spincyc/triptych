text = """
VERS. 2.-- Videntes filii Dei filias hominum quod essent pulchrae, et reliqua. Filios Dei filios Seth, et filios hominum progeniem Cain dicit. Sed postquam filii Seth, concupiscentia victi, ex filiabus Cain semine indignissimo connubia junxerunt, ex tali conjunctione homines immensi corpore, viribus superbi, moribus inconditi, quos Scriptura Gigantes vocat, procreati sunt. Displicuit Deo, et abbreviavit illis tempus vitae. Gigantes enim vocant Graeci juxta sermonis etymologiam fabulose quasi terrigenas, id est terra genitos, eo quod immensa mole, et similes sibi terra genuerit; ge enim terra dicitur. Falso | opinantur, qui putant praevaricatores angelos cum filiabus hominum ante diluvium concubuisse, et exinde natos gigantes, id est nimirum grandes et fortes viros de quibus terra completa est.\
"""
