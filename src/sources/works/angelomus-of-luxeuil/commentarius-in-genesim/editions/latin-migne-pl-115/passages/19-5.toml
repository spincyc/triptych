physical_line_ranges = [[209, 212]]
text = """
VERS. 19-25.-- Dixitque Lot ad eos: Nec possum in monte salvari, ne forte apprehendat me malum et moriar. Est civitas haec, ad quam possum fugere parva, et salvabor in ea, et reliqua usquequo, pluit Dominus | super Sodomam et Gomorrham sulphur et ignem de coelo a Domino, et subvertit omnem regionem. Quaeritur quare Lot, cum jussus esset ad montem fugere, Segor praetulerit, ut ibi salvaretur, et rursum de Segor ad montem migrasse? Tradunt Hebraei quod Segor, frequenter terraemotu subruta, Bale primum et postea Sallisa appellata sit, timuitque Lot dicens: Si cum caeterae adhuc urbes starent, ista saepe subversa est, quanto magis nunc in communi ruina non poterit liberari! Et hanc occasionem infidelitatis etiam in filias coitus dedisse principium. Qui enim caeteras viderat subrui civitates, et hanc stare, seque Dei auxilio abreptum [ Z., subreptum], utique de eo quod sibi concessum audierat, ambigere non debuit. Si judicium Dei justum est, quare infantes in Sodomis | simul cum parentibus cremati sunt? Ut nimis impium facinus Sodomitarum possit adverti. Peccatum enim eorum advenit usque ad necem filiorum, ne de origine illorum signum aliquod remaneret. Nonne provisum est illis, ne diu viventes exempla sequerentur patrum, et levius in futuro cruciarentur, vel omnino non, in aliena causa occisi? Parentes enim tam pro se quam pro eis rei sunt. Ergo mors filiorum crimen est parentum, et ideo futuri sunt accusatores parentum. Est qualecunque beneficium, reum non esse, qui gloriosus non est. Prodest pauperem non esse, qui rex esse non potest.

Moraliter ardentem Sodomam fugere est illicita carnis incendia declinare. Altitudo vero montium est munditia continentium. Vel certe quasi in monte | sunt, qui etiam carnali copulae inhaerent, sed tamen extra suscipiendae prolis admistionem debitam nulla carnis voluptate solvuntur. In monte quippe stare est fructum propaginis in carne non quaerere; in monte stare est carnaliter non adhaerere. Sed quia multi sunt qui scelera quidem carnis deserunt, nec tamen in conjugio positi usus solummodo debiti jura conservent, exiit quidem Lot Sodoma, sed tamen mox ad montana non pervenit, quia jam damnabilis vita relinquitur, sed adhuc celsitudo conjugalis continentiae subtiliter non tenetur. Est vero in medio Segor civitas, quae fugientem salvet et infirmum; quia videlicet cum sibi per incontinentiam miscentur conjuges, et lapsus scelerum fugiunt, et tamen venia salvantur. Quasi parvam quippe civitatem inveniunt, | in qua ab ignibus defendantur; quia conjugalis haec vita non quidem in virtutibus mira est, sed tamen a suppliciis secura. Unde idem Lot ad angelum dicit: Est civitas haec juxta ad quam possum fugere, parva, et salvabor in ea. Nunquid non modica est, et vivet in ea anima mea? Juxta igitur dicitur, et tamen ad salutem tuta perhibetur; quia conjugalis vita nec a mundo longe divisa est, nec tamen a gaudio salutis aliena. Sed tunc in actione hac vitam suam conjuges quasi in parva civitate custodiunt, quando pro se assiduis deprecationibus intercedunt. Unde et recte per angelum ad eumdem Lot dicitur: Ecce etiam in hoc suscepi preces tuas, ut non subvertam urbem pro qua locutus es. Quia videlicet | cum Deo deprecatio funditur, nequaquam tais conjugii vita damnatur. De qua precatione quoque Paulus admonet, dicens: Nolite fraudare invicem, nisi forte ex consensu ad tempus, ut vacetis orationi (I Cor. VII, 5). Quid in sulphure nisi fetor carnis, et quid per ignem nisi ardor desiderii carnalis exprimitur? Cum ergo habitantium Sodomis vel Gomorrhae carnis scelera punire Dominus decrevisset, in ipsa qualitate ultionis notavit maculam criminis. Sulphur quippe fetorem habet, et ignis ardorem. Qui itaque perversa desideria et carnis fetore arserant [ Z., fetori adhaeserant], dignum fuit ut simul sulphure perirent, quatenus ex justa poena discerent ex injusto desiderio quod fecissent.

Quare diebus Noe peccatum mundi aqua ulciscitur, | hoc vero Sodomitarum igne punitur? Quia illud naturale libidinis cum feminis fuit peccatum, quasi leviori elemento damnatur; hoc vero contra naturam cum viris libidinis peccatum acrioris elementi vindicatur incendio, et illic terra [ Z., illic vero ter.] aquis abluta revirescit, hic flammis cremata, aeterna sterilitate arescit.

Quaeritur, de coelo quare vindicta esset super habitatores impios civitatum illarum? Quia clamor peccantium in coelum ascendisse dicitur, idcirco de coelo puniendi erant. Cur sulphureo igne puniebantur? Ut putidissimus libidinis ardor putidissimo flammarum ardore puniretur.\
"""
