text = """
VERS. 16.-- Coenacula et tristega facies in ea. Quod alia translatio, videlicet bicamerata in inferioribus, tricamerata in superioribus dicit; ita ut quinque habitationum distinctiones in ea esse advertamus: inferiora ejus loca stercoribus et spurcitiis esse deputata, ne animalia, et praecipue homines, fimi fetore | vexarentur. Huic autem superior et contigua camera conservandis pabulis animalium deputaretur. In hos ergo usus inferiores partes, quae bicameratae dicuntur, tradunt fuisse distinctas. Superiores vero partes, quae tricameratae dicuntur, ad habitaculum primo bestiis vel animalibus immitioribus vel serpentibus deputatas esse. Ab his vero congrua in superioribus loca mitioribus animantibus stabula fuisse. Supra omnia vero in excelso hominibus sedem locatam, ut pote sicut honore et sapientia antecellit, ita et loco cunctis praecellere animalibus; et sic quinque mansiones in ea esse intelliguntur. Prima stercorina, secunda apothecaria, tertia feris animantibus, quarta mansuetis, quinta hominibus. Fenestram in arca facies, et in cubito consummabis summitatem ejus. Fenestra | ideo in consummitate [ Z., summitate] arcae fieri jubetur, ut haberet unde emittere potuisset aves ad explorandam terrae siccitatem. Ostium autem arcae pones ex latere deorsum. Tradunt enim etiam ostium quod ex latere factum dicitur, eo loco fuisse, ut inferiora, quae dixit bicamerata, infra se haberet, et quae dixit tricamerata superiora a loco ostii appellata sunt. Et inde ingressa animalia per sua quaeque loca secundum quae supra diximus, congrua discretione divisa sunt.

Sed forte quaerit aliquis si habet aliquod sacramentum mensura istius arcae? Habet igitur mysterium perfectum corporis Christi. Sexies enim trecenti habent infra se quinquaginta et decies triginta. Sic quippe humanum corpus, si jacentem metieris hominem, | sexies habet longitudo latitudinem, et decies altitudinem. Nam longitudo jacentis hominis a vertice usque ad vestigia metienda est, et latitudo a latere usque in latus, et altitudo a dorso ad ventrem. Quae figura apte Christo convenit propter longanimitatem omnia sufferentis fidei, et amplitudinem charitatis, et sublimitatem spei aeternae. Sequitur:\
"""
