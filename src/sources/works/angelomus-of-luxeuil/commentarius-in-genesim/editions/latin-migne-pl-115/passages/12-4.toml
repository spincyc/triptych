text = """
VERS. 7-9.-- Semini tuo dabo terram hanc. Juxta illud Psalmographi [ Z. Psalmigraphl]: Postula a me, et dabo tibi gentes, et reliqua (Psal. II, 8), ubi aedificavit altare, unitatem scilicet fidei in Ecclesia. Tetendit igitur tabernaculum suum, ab occidente habens Bethel, et ab oriente Hai. Bethel interpretatur domus Dei. Significat Judaeos, qui aliquando fuerant domus Dei per cognitionem, et quasi in oriente, dum sub lege fuerant, hoc est usque ad adventum Christi, | sed [ Z., et] propter incredulitatem suam deciderunt ad occidentem non credendo in Christum. Hai interpretatur chaos, id est vorago intransmeabilis. Significat gentes quae in voragine et profunditate peccatorum detinebantur usque ad adventum Christi, quae relicto errore crediderunt in Christum [ Z., in Deum], qui est verus Oriens.\
"""
