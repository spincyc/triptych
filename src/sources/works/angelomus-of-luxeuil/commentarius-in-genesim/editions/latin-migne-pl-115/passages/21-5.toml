physical_line_ranges = [[230, 236]]
text = """
VERS. 22-34.-- Eodem tempore dixit Abimelech, et Fichol princeps exercitus ejus, ad Abraham: Dominus | tecum est in universis quae agis. Jura ergo per Dominum, ne noceas mihi, et posteris meis, et reliqua, usquequo legitur: tentavit Deus Abraham. Per Abimelech regnum vel sapientes hujus mundi, per Fichol philosophi istius saeculi [intelliguntur]. Unde bene Abimelech pater meus rex, Fichol autem interpretatur os omnium, propter rationalem intelligentiam, quae logica dicitur, quae Deum Patrem omnium confitetur, ut est Abimelech; et propter moralem, quae ethica nominatur, quae in ore est omnium et ad omnes pertinet, et pro communium similitudine praeceptorum in omnium ore versatur, quam designavit iste Fichol. Hi enim veniunt ad Abraham, quia regnum, vel sapientes, seu philosophi istius saeculi per humanam intelligentiam venerunt ad | Christum, intelligentes in signis et miraculis Deum esse cum illo in universis quae ageret. Unde est illud: Deus erat in Christo, mundum reconcilians sibi (II Cor. V, 19). Ait quidem: Jura ergo per Deum ne noceas, eo quod tandiu permansi in ignorantia atque in infidelitate; et posteris meis, permansuris in humana sapientia; stirpique meae, meditanti hanc intelligentiam. Sed juxta misericordiam quam feci tibi, id est corpori tuo, quod est Ecclesia, facies mihi, et terrae in qua versatus es advena; ut est illud: Vulpes foveas habent, et volucres coeli nidos, filius autem hominis non habet ubi caput suum reclinet (Luc. IX, 58).

Dixitque Abraham: Ego jurabo; juxta illud: Qui crediderit et baptizatus fuerit, salvus erit (Matth. XVI, | 16).-- Et increpavit Abimelech propter puteum aquae, quem vi abstulerant servi illius; quia multos ex credentibus coegerunt ad idola declinare.

Responditque Abimelech: Nescivi quis fecerit hanc rem. Sed et tu non indicasti mihi. Subaudi, neque per legem, neque per prophetas.

Tulit itaque Abraham oves, videlicet simplices, et boves, scilicet doctores, et dedit Abimelech, id est sequentibus hujus mundi. Percusseruntque ambo foedus

Et statuit Abraham septem agnas gregis seorsum, et reliqua. Per septem agnas significantur apostoli, septiformis Spiritus sancti gratia repleti. Sed ideo agnae dicuntur quia membra Christi pariunt, quos | Abimelech, id est regnum, vel sapientia hujus mundi suscepit, testimonium perhibentes quia profunditas sanctarum Scripturarum, sive gratia baptismatis, quae significatur per puteum, ad Abraham, id est ad Dominum Jesum Christum, pertinent specialiter.

Idcirco vocatus est locus ille Bersabee, quia ibi uterque juravit. Duplex autem [est] causa cur ita appellatus sit, sive quia septem agnas Abimelech de manu Abrahae acceperit: septem enim dicuntur Sabee; sive quod ibi juraverint, quia et juramentum Sabee similiter appellatur. Quod si ante hanc causam supra nomen legimus, sciamus per anticipationem dictum esse, sicut et Bethel et Galgala, quae utique usque ad tempus quo [ Z., quod] ita appellatae | sint, aliter vocabantur. Notandum autem, et ex prioribus et ex praesenti loco, quod Isaac non sit natus ad quercum Mambre, sed in Geraris, ubi et Bersabee usque hodie oppidum est. Quae provincia ante non grande tempus ex divisione praesidum Palaestinae [ Petr., Palaestina] Salutaris est dicta. Hujus rei Scriptura testis est, quae ait: Et habitavit Abraham in terra Philistinorum.

Abraham vero plantavit nemus in Bersabee, et reliqua. Nemus arbores sunt umbrosae et infructuosae. Habent enim lata et amoena folia, et significat eos quos elegit Dominus ex gentibus, qui erant liberalibus artibus instructi, et quasi per hoc videbantur magni et dilatati, et tamen sine fructu spiritalis intelligentiae; quos Abraham, scilicet Dominus ac Redemptor | noster in Bersabee plantavit, id est sacrae Scripturae inseruit, per quorum eloquentiae fecunditatem [ Z., facunditatem] eam in superficie verborum adornavit.\
"""
