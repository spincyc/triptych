text = """
VERS. 16.-- Praecepitque ei dicens: Ex omni ligno paradisi comede, etc. Quaeritur quomodo loquebatur Adae Deus? Aut per coelestem substantiam, quomodo | nunc loquitur angelis; aut per corporalem speciem, id est ex aere coelesti sumpta imagine, sicut olim patriarchis; aut inspirando in mente, quomodo prophetis, sicut scriptum est: Dixit mihi, qui loquebatur in me? Sed sciendum est quia prius, antequam peccaret, loquebatur ei per coelestem substantiam, sicut angelis; postquam vero peccavit, per subjectam creaturam, id est per angelum.\
"""
