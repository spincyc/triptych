text = """
VERS. 15.-- Et dixit Deus ad Abraham: Sarai uxor tua, non vocabis eam Sarai, sed Sara erit nomen ejus. Erant qui putant primum Saram, per unum r scriptum fuisse, et postea ei alterum r additum, quia r apud Graecos centenarius numerus est. Sari igitur primum vocatum est per sin, res, jod; sublato jod, id est i elemento, addita est e, quae per a legitur, et vocata est Sara. Causa autem nominis mutati haec est, quod antea dicebatur, princeps mea, | unius tantummodo domus materfamiliae; postea vero dicitur absolute princeps. Sed notandum est quia de vocabulo istius nominis Sarae diversi diverse legunt. Nonnulli Sari prius vocatam, et postmodum Saram dicunt, eo quod per sin, res, et jod, sicut supra descripsimus, beato Hieronymo propalante, apud Hebraeos describatur, quasi sine uno r, quia non dicit duo res, sed unum; et ideo legendum putant Sari, atque post mutationem Saram. Unde existimant, si ita fuerit, antiquam [ Z. om. antiquam] permansisse consuetudinem in Ecclesia, ut Sarra vitio scriptorum unum r additum diceretur, quod et in authenticis libris semper ita scriptum reperies. Hinc est etiam quod sedulus poeta in carmine Paschali | ait: Saucia jam vetulae marcebant viscera Sarrae. At vero nonnulli Sarai, sicut in vetustissimis invenies tomis, non tantum Sari pronuntiare contendunt, et addita littera e, quae per a legitur, postmodum Saraam nominatam autumant; quia inquiunt, sicut Abrahae una littera, ita Sarae est altera addita, prout supra ostenditur. Unde siquidem ferunt quod Pater Albinus in Bibliotheca quam Carolo principi correxit, quod nos etiam oculis diligenter inibi inspeximus, emendare curavit, videlicet sine uno r Saraam, et duo a; et in nostris quibusdam voluminibus ita legitur, quod et nos similiter legendum putamus. | Verumtamen prudentis lectoris arbitrio derelinquimus quid horum magis placuerit, quoniam potius alieno sensui cedere quam contentionibus volumus deservire. Dixitque ad Abraham: Et tu ergo custodies pactum, et reliqua usquequo ait: Circumcidetur ex vobis omne masculinnm, et circumcidetur infans octo dierum. Quare Abraham circumcisionem accepit? idcirco Abrahae circumcisio commendata est, ut sub lege esset, sicut et Adam, ne de ligno manducaret, ut probaretur si compleret hoc an non. Credens enim filium se habiturum, per cujus generationem omnibus gentibus benedictio futura esset, et in cujus nepotibus castitatis et sobrietatis unum mansisset exemplar, unde et in ea parte corporis signum fidei accepit, unde filius fidei, non carnis, nasciturus | erat, nec truncata corporis parte deformior, sed fidei in Deum signo gloriosior. Igitur pro Deo aliquid perdere lucrum est, non damnum. Ita Abraham fidei suae signum accipiens, non deformatus est, sed melioratus. Si enim Adam pactum Dei custodisset, non Abraham hoc pactum accepisset. Sed quia ille in hoc membro culpam inobedientiae primo agnovit, decuit ut iste in hoc membro signum obedientiae seeundo accepisset, ut ostenderetur obedientes quandoque generasse filios ad vitam, dum olim praevaricatores generarunt ad mortem. Unde etiam sciendum est quia religio et ritus circumcisionis, quae a beato patriarcha sumpsit exordium, multiformis erat et typos gerebat rerum futurarum. Nam erat signaculum fidei Abrahae et semini ejus, et indicium castigandi | eos qui ad hoc semen et hanc fidem pertinerent ab omni inquinamento carnis et spiritus, et prophetia nascituri de hoc semine Salvatoris, qui nos et in praesenti per baptismum ab omni mortiferae actionis pollutione mundar e t, et in futuro per resurrectionem ab universa mortis ipsius corruptione in perpetuum liberaret, et praecipue donum remissionis, quod solveret a peccato praevaricationis Adae, per hanc id temporis ministrari eidem gratiae legisque latori complacuit. Qui enim nunc dicit: Nisi quis renatus fuerit ex aqua et Spiritu sancto, non potest introire in regnum Dei (Joan. III, 3), ipse tunc dicebat: Masculus cujus praeputii caro circumcisa non fuerit, peribit anima illa de populo suo, quia pactum meum irritum fecit. Non pactum utique circumcisionis, quod non infans, qui | discernere necdum valuit, sed majores, qui id servare noverant, poterant, debuerant, irritum fecerunt, verum pactum, quod cum primo homine Deus iniit, omnis qui vel unius diei vitam gessit in terra, praevaricasse convincitur atque ideo remedio salutis aliquo opus habere non ignoratur.\
"""
