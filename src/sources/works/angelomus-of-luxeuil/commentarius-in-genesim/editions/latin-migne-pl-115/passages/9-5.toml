text = """
VERS. 24.-- Evigilans autem Noe ex vino, cum didicisset quae fecerat ei filius suus minor ait: Maledictus Chanaan. Chanaan ipse est filius Cham, ut Scriptura refert. Porro Cham, inquit, ipse est pater Chanaan. Servus servorum erit fratribus suis. Hic a multis requiritur cur Cham in filiis maledictionem accepit? Videlicet, quia peccantibus et non poenitentibus futura imminet poena. Saepe quidem reproborum nequitiae hic quidem inultae proficiunt, sed in posterum feriuntur. Nequaquam enim divina severitas inulta remanere peccata permittit, sed ira judicii a nostra hic correptione inchoat, ut in reproborum | damnatione conquiescat. Sed juxta historiam prophetarum quoque est, quia terram [ Z., a terra] Chanaan, ejectis Chananaeis et debellatis, accepturos fuisse filios Israel, qui venirent de semine Sem, sicut historia sacra postmodum actum narrat. Unde et dicitur:\
"""
