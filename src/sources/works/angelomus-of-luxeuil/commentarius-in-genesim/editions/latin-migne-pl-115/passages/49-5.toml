text = """
VERS. 11-13.-- Alligans ad vineam pullum suum, et ad vitem asinam suam. Quod videlicet pullum asinae, cui supersedit Jesus, hoc est, gentium populum vineae apostolorum, qui ab Judaeis sunt, copulaverit. | Et ad vitem, sive, ut in Hebraeo habetur, ad Sorech, id est, electam vitem, alligaverit asinam cui supersedit, Ecclesiam ex nationibus congregatam. Quod autem dicit, fili mi, couversionem ad ipsum Judam facit, quod Christus haec sit universa facturus. Quod autem dicitur: Non auferetur sceptrum de Juda, et dux de femoribus ejus, donec veniat ille qui mittendus est, et ipse erit exspectatio gentium; significat quod non deficerent principes de tribu Juda usque ad tempus quo natus est Christus, qui missus a Patre exspectatio est gentium.\
"""
