text = """
VERS. 16-19.--Deinde sequitur qualiter Abrahae repromittitur filius, de quo ei dicitur: Eritque in nationes, et reges populorum orientur ex eo. Cecidit Abraham in faciem, et risit dicens in corde suo: Putasne, centenario nascetur filius, et caetera, usquequo ait, et vocabis nomen ejus Isaac. Quaeritur quomodo dictum sit ad Abraham de filio ejus: Et nationes et reges gentium ex illo erunt? quia non provenit secundum regna | terrena, sed secundum Ecclesiam debet accipi. An propter Esau etiam dicit, quia de eo ad litteram contigit adimpletum? Sed sciendum est quia non dubitandi animo dixit: Putasne, centenario nascetur filius, et reliqua. Non enim haec verba dubitantis diffidentiam ostendunt, sed admirantis gaudium. Ideo pro gaudio ridentis Abrahae filius dicebatur Isaac. Nam risus iste in bono accipi debet, ut in Evangelio: Beati qui lugent nunc quoniam ipsi ridebunt (Matth. V, 5). Isaac enim interpretatur risus. Non enim pro risu Saraae dictus est Isaac, sicut aliqui existimant, sed pro risu Abrahae, quod et nos probamus. Postquam autem risit Abraham, et vocatus est Isaac, postea et risisse legimus Saraam. Inde est etiam quod in consequentibus-Saraam ridentem redarguit | Dominus, cum et Abraham riserit, et eum non redarguerit, quia illius videlicet risus admirationis et laetitiae fuit, Saraae autem dubitationis et diffidentiae, quod ab illo dijudicari potuit, qui corda hominum novit. Unde haec eadem Saraa ridens corripitur, correpta protinus fecundatur, et contra spem ex divina promissione accepit quod habituram se ex humana ratione dubitavit. Caeterum hic notandum est quia in Veteri Testamento quatuor propriis nominibus nominati sunt antequam nascerentur; Ismael videlicet et Isaac, Salomon et Josias, certis quibusdam ex causis. Quoties enim hominibus a Deo vel imponitur nomen, vel mutatur, singularis meriti indicium datur, magnos esse futuros, sicut Abraham, quia pater multarum gentium erat futurus, Abraham | est vocatus. Sic Jacob, quia Deum vidit, Israel appellari meruit. Sic Josias rex ob eximiae virtutis culmen nominatus est a Deo multo antequam natus est. Sic de caeteris sentiendum intellige. Sequitur:\
"""
