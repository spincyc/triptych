text = """
| VERS. 27.--Notandum [ Z., Notandumque quod], quia quod homo ad imaginem Dei conditus sit, et bestiis praeesse, in ipsa creatione sui et creaturarum ostensum est. Homo namque creatus est erectus ut coelestia consideraret; bestiae vero pronae, ut ostenderent obedientiam suam. Creavit igitur Dei Filius [ Z., Deus Filius] hominem ad imaginem suam, et creavit ad imaginem Patris, quia ipse est imago Dei Patris, ad cujus imaginem etiam conditus est homo. Secundum enim, prout jam dictum est, interiorem hominem [ Z., in interiore homine], quia rationalis est, et animam habet in sua natura, et immortalis factus est. Unde Apostolus ait: Vir non debet velare caput [ Z., caput suum ], quia imago Dei est: mulier autem velet | caput suum, quia imago est viri (I Cor. XI, 7). In quantum enim homo ad coelestia tendit et divina contemplatur, non debet velare caput, id est, obstaculum peccati menti opponere. Si autem omiserit divina meditari, et converterit ad terrena superflue, non jam vir, sed femina dicitur, et ideo velet caput ut mulier, id est ponat obstaculum justitiae, ne dum licita cogitare coeperit, ad illicita prorumpat, et totum se ad exteriora diffundat, unde Deum offendat.

Masculum et feminam creavit eos. Cur dicitur feminam creatam esse, cum postmodum narratur formata, nisi quia per originem in viro creavit eam, quia [ Z., quae] ex viro formanda erat? Masculum autem unum et feminam imprimis creavit Deus unam, | non ut animalia et caetera plura, ut humanum genus ardore ad invicem charitatis constringeret, quod se ex uno parente ortum [ Z., ortum esse] meminisset. Unde mulierem ex viri latere formavit, ut mutua illorum conjunctione terram esse implendam doceret.\
"""
