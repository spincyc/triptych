VERS. 4.-- Istae generationes coeli et terrae, quando creatae sunt in die quo fecit Dominus Deus coelum et terram. Sequitur hic recapitulatio sex dierum operum Dei propter illos qui mundum coaeternum dixerunt, et sine initio eum semper fuisse affirmant, ut ore conticescant atque penitus confundantur. | Sed requirendum est quid est quod hic ait, in die quo fecit coelum et terram, cum superius sex diebus omnia opera sua distincte patrasse legitur, nisi quod rerum omnium origo simul creata est in substantia, quae varias restabat producenda formarum in species, juxta quod scriptum est: Qui vivit in aeternum, creavit omnia simul (Eccli. XVIII, 1). Potest et altius intelligi. Diem namque quo tempore primordialis creaturae posuit, sicut et Apostolus [ Z., sicut dicit Ap.]: Ecce nunc dies salutis (II Cor. VI, 2), diem totum tempus intelligi voluit quo sancti in hac vita pro aeterna salute laborant. Sequitur:\
"""
