text = """
VERS. 25.-- Erant autem uterque nudi [ Z., nudus], Adam scilicet et uxor ejus, et non erubescebant. Non quod eis sua nuditas esset incognita, sed turpis nuditas nondum erat, quia nondum libido membra illa movebat ad concupiscendum. Si enim non peccarent, non erubescerent, quod in parvulis fieri videmus, qui antequam tempus libidinis et motus fragilitatis adveniat, non erubescunt ex nuditate. Et idcirco erant nudi, ut dictum est, sed non erubescebant, quia non videbant aliam legem in membris suis repugnantem legi mentis suae, et captivos eos ducentem in lege peccati (Rom. VII, 23). Nihil enim putabant | velandum, quia nihil sentiebant refrenandum. Sed post peccatum erubescebant, quia propter inobedientiam caro quodammodo verecundiae testimonium perhibebat, et peccando promeruerunt ut eis rebellis esset.\
"""
