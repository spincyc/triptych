VERS. 10.-- Et fluvius egrediebatur de loco voluptatis ad irrigandum paradisum, qui inde dividitur in quatuor capita. Sciendum est quia nec per hoc paradisus | disus declaratur evidenter ubi sit, quasi per flumina inveniri possit locus ipsius. Qui sicuti nonnulli dicunt, et beatus Augustinus autumat, licet ab uno fonte Scriptura teste procedant, tamen subtus terra profluunt, et post longos tractus suis locis erumpunt et celantur interim amnes.\
