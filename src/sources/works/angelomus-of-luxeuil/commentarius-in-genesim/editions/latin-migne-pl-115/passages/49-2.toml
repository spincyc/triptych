text = """
VERS. 3, 4.-- Ruben primogenitus meus, tu fortitudo mea, principium doloris mei, prior in donis, | major imperio, effusus es sicut aqua, non crescas: ascendisti cubile patris tui, et maculasti stratum ejus. Est autem sensus hic: tu es primogenitus, major in liberis, et debebas ordine nativitatis tuae haereditatem, quae primogenitis jure debebatur, sacerdotium accipere et regnum: hoc quippe importat honorem, et praevalidum robur quod monstrat. Dicamus per singula manifestius; patet litterae sensus. Quia beatus Jacob primum filium Ruben ex Lia uxore sua susceperit, qui se digne tanto patre tractaret, ad eum primogenita regnumque pertineret. Unde dicit eum sibi primogenitum, quasi cui deberentur dona primogeniti. Sed et fortitudinem suam eum nominat, eo quod robur imperii ad cum debuerit declinare. | Haec autem non ideo indicative protulit quod ita futura esse praeviderit vel voluerit, sed ut per haec dicta ad poenitentiam cohortaretur, cum recoleret a quanta dignitate peccando decidisset. Unde et dicit, principium doloris, et reliqua. Principium namque doloris illius fuit qui, ruptis castimoniae habenis, infrenis ruit in constuprandam conjugem patris, quae res non mediocri dolore eum stimulasse credenda est. Verum quia peccasti, et quasi vasculo aqua quae quolibet non tenetur, voluntatis effusus es impetu, idcirco praecipio tibi ut ultra non pecces, sisque in fratrum numero poenas peccati lugens, quod primogeniti ordinem perdidisti. Principium autem doloris est omnis primogenitus; quia pro eo commoventur primum viscera parentum.\
"""
