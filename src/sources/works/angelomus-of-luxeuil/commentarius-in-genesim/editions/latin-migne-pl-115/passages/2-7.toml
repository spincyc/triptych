text = """
VERS. 7.-- Formavit igitur Deus hominem de Iimo terrae, et inspiravit in faciem ejus spiraculum vitae, et reliqua. Quid est enim quod hominem de limo terrae formavit, et non de angelica creatura, nisi quia ideo voluit de limo terrae creare, ut semper humilitatem teneret, et non superbiret, pulverem se cineremque juxta exemplum Abrahae conspiceret, et ageret gratias conditori suo eo quod de tam fragili materia conditum ad tantam gratiam crexit, ut, si subditus ei foret, regna cum angelis obtineret coelorum? Et inspiravit in faciem ejus, etc. Inspiratio Dei in faciem hominis conditio est animae rationalis. Sed in hoc quod ait, inspiravit in faciem | ejus spiraculum vitae, quaestio oritur: utrum Deus animam insufflando fecit, an eam quam fecerat, corpori dando potius insufflavit? Sed utrumque unum est, et nihil habet quaestionis; quoniam sive insufflando fecit animam sive creando, vel dando corpori insufflavit, tamen credendum est, quia spiraculum divinum non est in animam viventem conversum, sed operatum est animam viventem: et non habet anima participationem cum Divinitate, nec de aliquo flatu suo, nec de seipso condidit, ut cogamur dicere naturam Dei esse mutabilem, sicut anima, quae modo proficit, modo sapit, modo dissipit. Nam de seipso si animam fecisset Deus, nunquam vitiosa, aut mutabilis, vel misera potuisset esse. Etiam sciendum quia non est de elementis visibilibus facta, quia si | esset, haberet aliquam communionem cum eis, videlicet ex terra soliditatem, ex aqua humorem, ex aere flatum, ex igne calorem. Sed quoniam his omnibus caret, apparet eam inde non esse, quae cum illis nil habere probatur; sed ex nihilo, sicut superius diximus, aut insufflando creavit, aut creando corpori insufflavit. Et factus est homo in animam viventem. Non enim spiritalem hominem debemus intelligere, qui factus est in animam viventem, sed adhuc animalem. Tunc enim spiritalis effectus est, quando in paradiso positus praecepta perfectionis accepit. Itaque postquam peccavit, et emissus est de paradiso, in eo remansit ut esset animalis. Et ideo omnes qui de illo nascimur, prius animales efficimur, donec renati per fontem baptismatis assequamur | spiritalem Adam, id est Christum, per quem simus spiritales, juxta quod Paulus apostolus ait: Non prius quod spiritale est, sed quod animale; deinde quod spiritale (I Cor. XV, 46).\
"""
