Simeon et Levi fratres, vasa iniquitatis bellantia. Per Simeonem et Levi scribae et Pharisaei, et sacerdotes Judaici populi intelliguntur. De Simeone enim Scribae Judaeorum erant. Et de tribu vero Levi principes sacerdotum, qui consilium fecerunt, ut Jesum dolo tenerent et occiderent. De quo consilio dicit: In consilium eorum non veniat anima mea. Horrebat | enim tanta scelera jam videre, quae novissimis temporibus facturi erant Judaei; quia in furore suo occiderunt virum, id est Christum, de quo dicitur: Ecce vir, Oriens nomen ejus (Zach. VI, 12). Et alibi: Femina circumdabit virum (Jer. XXXI, 22).-- Suffoderunt murum, id est illum spiritalem fortissimum murum qui custodit Israel, lancea confoderunt. Maledictus furor eorum, quia pertinax; utique quando, furore accensi et ira, obtulerunt Christum Pontio Pilato, dicentes: Crucifige, crucifige (Luc. XXIII, 21). -- Et indignatio eorum, quia dura; dum Barabbam latronem peterent, et principem vitae crucifigendum postularent. Dividam eos in Jacob, et dispergam illos in Israel, quia nonnulli ex ipsis crediderunt, quidam in infidelitate permanserunt. Dicuntur enim divisi | hi qui ab eis separantur et veniunt ad fidem. Dispersi autem, quorum patria temploque subverso, per orbem terrae incredulum genus spargitur.\
""" },
  { line = 410, text = """
Juda, te laudabunt fratres tui. Per hunc Judam verus confessor exprimitur Christus, qui ex ejus tribu secundum carnem est genitus. Ipsum laudabunt fratres sui, apostoli scilicet et omnes cohaeredes ejus, qui per adoptionem filii Deo Patri effecti sunt, et Christi fratres effecti per gratiam, quorum ipse est Dominus per naturam. Manus tuae in cervicibus inimicorum tuorum. Iisdem enim manibus, id est crucis tropaeo, et suos texit et inimicos, et adversarias potestates curvavit, juxta quod et Pater promisit ei dicens: Sede ad dexteram meam, donec ponam inimicos tuos scabellum pedum tuorum (Psal. CIX, 1, 2). | -- Adorabunt te filii patris tui; quoniam multi ex filiis Jacob adorent eum, per electionem gratiae salvi facti. Catulus leonis Juda, quando nascendo parvulus factus est nobis. Ad praedam, fili mi, ascendisti, id est ascendens in crucem, captivos populos redemisti, et quos ille contrarius invaserat, tu moriens eripuisti. Denique rediens ab inferis ascendisti in altum, captivam duxisti captivitatem. Requiescens accubuisti ut leo. Manifestissime in passione Christus recubuit, quando inclinato capite tradidit spiritum: sive quando in sepulcro securus, velut quodam corporis somno quievit. Sed quare ut leo et velut catulus leonis? In somno enim suo leo fuit, quia non necessitate, sed potestate hoc ipsum implevit, sicut | ipse dicit: Nemo tollit animam meam, sed ego pono eam (Joan. X, 18). Quod vero addidit, et ut catulus leonis. Inde enim mortuus est unde et natus. Bene Christus ut leo requievit, qui non solum mortis acerbitatem non timuit, sed etiam in ipsa morte mortis imperium vicit. Quod autem dicit, Quis suscitabit eum? quia nullus nisi ipse dicit: Solvite templum hoc, et in triduo suscitabo illud.--Non deficiat dux de Juda, et reliqua. Hic manifestissime ad Judam refertur. Diu enim fuit ex semine illius intemerata apud Judaeos successio regni, donec Christus nasceretur. Et hoc supra diximus. Alligans ad vineam pullum suum. Pullus suus populus est ex gentibus, cui adhuc nunquam fuerat legis onus impositum. Hunc copulavit ad vineam apostolorum, qui ex Judaeis sunt. | Nam vinea Domini Sabaoth domus Israel est (Isa. V, 7). -- Et ad vitem asinam suam. Ipse dixit: Ego sum vitis vera (Joan. XV, 1). Ad hanc ergo vitem alligat asinam suam, Synagogam tardigradam scilicet, et gravi legis pondere depressam. Lavabit in vino stolam suam, sive carnem suam, in sanguine passionis; sive sanctam Ecclesiam, illo vino quod pro multis effundetur in remissionem peccatorum.--Et in sanguine uvae pallium suum. Pallium gentes sunt, quas corpori suo junxit, sicut scribitur: Vivo ego, dixit Dominus, nisi hos omnes induam sicut vestimentum. Pulchriores oculi ejus vino. Oculi Christi apostoli sunt et evangelistae, qui lumen scientiae Ecclesiae praestant: quorum praecepta austeritatem vini priscae legis superant, quia longe clariora sunt quam Veteris | Testamenti mandata. Et dentes lacte candidiores. Dentes praeceptores sunt sancti, qui praecidunt ab erroribus homines, et eos quasi comedendo in Christi corpus transmutant [Cod., transmittunt]. Nomine autem lactis doctrina legis significatur, quae carnalem populum tanquam parvulos poculo lactis alebat. Cujus quidem candidiores effecti sunt praedicatores Ecclesiae, quia fortem et validum verbi cibum mandunt atque distribuunt; de quibus dicit Apostolus in Epistola ad Hebraeos: Perfectorum autem est solidus cibus (Hebr. V, 1, 4). Et bene candidiores lacte dentes ejus dicit. Omnes enim qui perfecti sunt, et qui Scripturarum cibos explanantes, subtilem et minutum intellectum, qui spiritalis dicitur, Ecclesiae corpori subministrant, candidi esse debent et puri, | atque ab omni macula liberi.\
""" },
  { line = 411, text = """
Isachar asinus fortis. Isachar, qui interpretatur merces, ad populum gentium, quem Dominus sanguinis sui pretio mercatus [est, refertur]. Hic Isachar asinus fortis scribitur, quia prius gentilis populus, quasi brutum animal et luxuriosum erat, nullaque ratione subsistens; nunc vero fortis est, Redemptoris dominio colla subjiciens, et jugum disciplinae evangelicae perferens. Hic accubans inter terminos vidit requiem, quod esset bona, et terra, quod optima. Inter terminos namque accubare est praestolato mundi fine requiescere, nihilque de his quae nunc versantur in medio, quaerere, sed ultima desiderare. Et fortis asinus requiem videt, et terram | optimam, cum simplex gentilitas idcirco ad robur boni operis se erigit, quia ad aeternae vitae patriam tendit. Unde etiam et ponit humerum suum ad portandum, quia dum ad promissam requiem pervenire desiderat, cuncta mandatorum onera libenter portat. Unde et factus est tributis serviens, hoc est, Regi et Christo suo fidei dona, operumque bonorum munera offerens.\
""" },
  { line = 412, text = """
Zabulon in littore maris habitabit, et in statione navium. Zabulon, qui interpretatur habitaculum fortitudinis, Ecclesiam significat, fortissimam ad omnem tolerantiam passionis. Haec in littore maris habitat, et in statione navium; ut credentibus sit refugium et periclitantibus demonstret fidei portum. Haec contra omnes turbines saeculi immobili et inconcussa | firmitate solidata exspectat naufragium Judaeorum, et haereticorum procellas, qui circumferuntur omni vento: quorum etsi tunditur fluctibus, frangit tamen ipsius fluctus, non frangitur, nec ullius haereseos tempestatibus cedit, nec ulli vento schismatum commota succumbit. Pertendit autem usque ad Sidonem, hoc est usque ad gentes pervenit. Legitur etiam in Evangelio inde assumptos aliquos apostolorum, et in ipsis locis Dominum saepe docuisse, sicut scriptum est: Terra Zabulon, et terra Nephthalim, via maris trans Jordanem Galilaeae gentium. Populus, qui sedebat in tenebris, vidit lucem magnam (Isa. IX, 1, 2).\
""" },
  { line = 413, text = """
Dan judicabit populum suum, sicut et alia tribus Israel. Fiat Dan coluber in via, et cerastes in semita, | etc. Alii dicunt Antichristum per haec verba praedici de ista tribu futurum; alii de Juda, a quo traditus est Christus, haec scripta pronuntiant, et equitem atque equum Dominum cum carne suscepta designare volunt. Retrorsum autem cadere, ut in terram reverteretur unde sumptus est. Sed quoniam die tertia resurrexit, ideoque ait: Salutare tuum exspectabo, Domine. Sicut et per David dicit: Non derelinques animam meam in inferno (Psal. XV, 10) Haec quidam ita exponunt. Alii vero hanc prophetiam ad Antichristum transferunt. De tribu enim Dan venire Antichristum ferunt pro eo quod hoc loco Dan et coluber asseritur et mordens. Unde et non immerito, dum Israeliticus populus terram in castrorum partitione susciperet, primus Dan ad | aquilonem castra metatus est, illum scilicet significans qui in corde suo dixerat: Sedebo in monte testamenti, in lateribus Aquilonis, ascendam super altitudinem nubium, similis ero Altissimo (Isa. XIV, 13) De quo et per Prophetam dicitur: A Dan auditus fremitus equorum ejus (Jer. VIII, 16). Qui non solum coluber, sed etiam cerastes vocatur. Cerastae enim Graece cornua dicuntur, serpensque hic cornutus esse perhibetur. Per quem digne adventus Antichristi asseritur, qui contra vitam fidelium cum morsu pestiferae praedicationis armabitur etiam cornibus potestatis. Quis autem nesciat semitam angustiorem esse quam viam? Fit ergo Dan coluber in via, quia in praesentis vitae latitudinem eos ambulare | provocat, quibus quasi parcendo blanditur. Sed in via mordet, quia eos quibus libertatem tribuit, erroris sui veneno consumit. Fit iterum cerastes in semita, quia quos fideles reperit et sese ad coepta angusta itinera constringentes, non solum nequitia callidae persuasionis impetit, sed etiam terrore potestatis premit, et in persecutionis angore post beneficia fictae dulcedinis exercet cornua potestatis. Quo in loco equus hunc mundum insinuat, qui per elationem suam in cursu labentium temporum spumat. Et quia Antichristus extrema mundi apprehendere nititur, cerastes iste ungulas mordere perhibetur. Ungulam quippe mordere est extrema saeculi feriendo contingere. Ut cadat ascensor ejus retro. Ascensor equi est quisquis extollitur in dignitatibus | mundi. Qui retro cadere dicitur, et non in faciem, sicut Saulus cecidisse memoratur. In faciem enim cadere, est in hac vita suas unumquemque culpas agnoscere easque poenitendo deflere. Retro vero, quod non videtur, cadere est ex hac vita repente decidere, et ad quae supplicia ducatur, ignorare. Et quia Judaea, erroris sui laqueis capta, pro Christo Antichristum exspectat, bene Jacob eodem loco repente in electorum voce conversus est dicens: Salutare tuum exspectabo, Domine. Id est, non sicut infidelis Antichristum, sed eum qui redemptione nostra venturus est, verum credo fideliter Christum.\
""" },
  { line = 414, text = """
Gad accinctus praeliabitur ante eum. Iste Gad accinctus personam Domini exprimit, qui in primo adventu humilitatis suae ante adventum Antichristi | praeliaturus occurrit, accinctus gladio verbi sui circa femur potentissime, quo inimicos divisit, id est filium a patre, filiam a matre, nurum a socru, juxta quod legitur in Evangelio: Non veni pacem mittere in terram, sed gladium (Matth. X, 34). Quod autem ait, et ipse accingetur retrorsum, claritas Domini nostri in secundo regno ejus ostenditur. Quia cum venerit Antichristus, occurret retrorsum, id est post ejus vestigia Christus celeri adventu progrediens, ut interficiat eum gladio oris sui. Unde et bene idem Gad latrunculus interpretatur, eo quod posterior, id est secus pedes, quasi latrunculus rapido atque improviso adventu exsiliat contra apertam Antichristi oppugnationem. Hinc est quod Evangelista proclamat dicens: Quia dies Domini sicut fur in nocte, ita veniet (I | Thess. V, 2). Christus ergo et ante, et retro praeliari contra Antichristum scribitur. Ante eum namque in occulto adventu humilitatis, post eum manifestus in gloria majestatis. Demonstrat aperte Moyses prophetiam patriarchae hujus specialiter pertinere ad Christum. Sic enim ait: Benedictus, inquit, in latitudine Gad; quasi leo requievit, coepitque brachium et verticem, et vidit principatum suum. Agnoscant itaque, quis requieverit sicut leo, nisi Christus in sepulcro suo: quis confregerit verticem brachiaque potentum, nisi Redemptor noster, qui humiliavit virtutem et superbiam excelsorum. Quis vidit principatum suum, nisi ille cui datus est principatus, et honor, et regnum?\
""" },
  { line = 415, text = """
| Aser pinguis panis ejus, et praebet delicias regibus. Aser, cujus nomen significat divitias, idem Christus est, cujus est altitudo divitiarum sapientiae et scientiae. Qui propter nos pauper factus est, cum dives esset. Cujus panis pinguis factus est, caro scilicet ejus, quae est esca sanctorum, quam si quis manducaverit, non morietur in aeternum (Joan. IV, 52). Ita etiam praebet delicias sapientiae regibus, id est qui sensus proprios bene regunt, qui dominantur vitiorum suorum, qui castigant corpora sua et in servitutem subjiciunt.\
""" },
  { line = 416, text = """
Nephthalim, quod interpretatur dilatatio, apostolos et praedicatores sanctos significat, quorum doctrina in latitudine totius mundi effusa est. Ex hac enim tribu fuerunt apostoli, qui sunt principes | Ecclesiarum et duces, principes Zabulon, et principes Nephthalim (Psal. LXVII, 28), qui sine dubio ad personam referuntur apostolorum. Ipsi sunt, filii excussorum (Psal. CXXVI, 4), id est filii prophetarum, qui in manu potentis Dei positi, tanquam sagittae excussae pervenerunt usque ad fines terrae. Unde et bene hinc Nephthalim cervus emissus scribitur, quia nimirum apostoli sive praedicatores veloci saltu exsilientes in morem cervorum transcendunt implicamenta saeculi hujus, sicque excelsa ac sublimia meditantes, dant eloquia pulchritudinis, id est, praedicant cunctis gentibus doctrinam Domini Salvatoris.\
""" },
  { line = 417, text = """
Filius accrescens Joseph. Haec prophetia post patratam ascensionem paternae vocis imaginem praetulit, | qua redeuntem in coelum post victoriam Christum Pater alloquitur dicens: Joseph filius accrescens, utique in gentibus, quia cum ob incredulitatem Synagogae populum reliquisset, innumeram sibi plebem Ecclesiae ex omnibus gentibus ampliavit. Quod et David cecinit dicens: Reminiscentur, et convertentur ad Dominum universi fines terrae (Psal. XXI, 28). Filius accrescens, et decorus aspectu: omnes enim superat illius pulchritudo, juxta quod et de ipso in Psalmis canitur: Speciosus forma prae filiis hominum (Psal. XLIV, 3). Filiae decurrerunt super murum. Id est gentes vel Ecclesiae, quae crediderunt in Christum, hae super soliditatem fidei quasi super murum, pulchritudinis Christi accensae, discurrunt, ut verum sponsum per contemplationem | aspiciant, et osculo charitatis illi copulentur atque adhaereant. Sed objurgati sunt eum, quando falsis testimoniis calumniantes sanctum Domini opprimere Synagogae populi tentaverunt. Invideruntque illi habentes jacula. Neque enim quisquam in Joseph conjecit sagittas, vel aliquod vulneris telum, sed hoc specialiter evenit in Christo. Sedit in forti arcus ejus. Christus enim arcum suum et arma pugnandi posuit in Deo, qui fortis est propugnator; cujus virtute conciditur omnis nequitia perfidorum. Et dissoluta sunt vincula brachiorum ejus, quibus fratres eum vinctum ad Pilatum duxerunt, vel quibus eum suspensum ligno crucifixerunt. Recisa sunt enim ver manus potentis Jacob, hoc est, per manus omnipotentis | Dei Jacob, ex cujus ore ipse Dominus, bonus pastor, egressus est lapis et firmitas credentium in Israel. Deus patris tui erit adjutor tuus. Quis adjuvit Filium nisi Deus Pater, qui dixit: Jacob puer meus, suscipiet eum anima mea? Et omnipotens benedicet tibi benedictionibus coeli desuper, benedictionibus abyssi jacentis deorsum. Universa enim subjecit ei, coelestia per benedictionem coeli, et terrena per benedictionem abyssi jacentis deorsum, ut omnibus angelis et hominibus dominaretur. Benedictionibus uberum, id est sive duorum Testamentorum, quorum altero nuntiatus est, altero demonstratus. Sive benedictionibus uberum Mariae, quae vere benedicta erat; quia eadem sancta virgo de se Domino potum lactis immulsit. Unde illa mulier in | Evangelio ait: Benedictus venter qui te portavit, et ubera quae suxisti (Luc. XI, 27).-- Benedictionibus uberum et vulvae. Etiam benedicitur vulva ejusdem matris, illa utique virginalis, quae nobis Christum Dominum edidit, de qua Pater per Jeremiam prophetam dicit: Priusquam te formarem in utero, novi te, et antequam exires de vulva, sanctificavi te (Jer. I, 5). Benedictiones patris tuis confortatae sunt benedictionibus patrum tuorum. Benedictiones, inquit, Patris tui coelestis, quae datae sunt tibi a summo coeli et abyssi, confortatae sunt, id est praevaluerunt, benedictionibus patrum tuorum. Ultra omne enim sanctorum meritum patriarcharum sive prophetarum convaluit benedictio omnipotentis Patris in Filio, ita ut ei nullus sanctorum aequetur. Donec veniret desiderium | collium aeternorum. Colles isti sancti sunt qui, Christi adventum prophetantes, magno cum desiderio incarnationem ejus exspectaverunt; de quibus Dominus dicit: Quia multi justi et prophetae cupierunt videre quae videtis (Matth. XIII, 17). Hi ergo sancti dicti sunt colles propter excellentiam sanctitatis. Qui etiam aeterni vocantur, quia vitam consequuntur aeternam, nec intereunt cum mundo, sed esse creduntur aeterni. Fiant in capite Joseph, omnes scilicet benedictiones istae super Christo ponuntur, quas incarnatus accepit, et super verticem Nazaraei, de quo scriptum est: Quoniam Nazaraeus vocabitur (Matth. II, 23), id est sanctus Dei inter fratres suos, quia ipse caput omnium eminens universorum sanctorum, quos etiam et fratres vocat in Psalmis.\
""" },
  { line = 418, text = """
| Benjamin lupus rapax, mane comedet praedam et vespere dividet spolia. Quibus dictis apostolus Paulus designatur, de Benjamin stirpe progenitus, qui mane rapuit praedam, id est in primordiis fideles, quos potuit, devastavit. Vespere autem spolia dividit: quia, fidelis postmodum factus, sacra eloquia audientibus descriptione mirifica dispensavit. Legimus quemdam ex doctoribus, ad urbem Hierusalem ea quae de Benjamin scripta sunt, referentem. Benjamin, inquit, filius doloris interpretatur. Hic sorte haereditatis eum locum accepit, in quo terrena est Hierusalem, quae nunc propter incredulitatem abjecta est atque repulsa. Haec enim in filiis suis sub persona Benjamin designatur. Nam sicut Benjamin | ultimam consequitur benedictionem, ita et idem populus ultimus est salvandus, posteaquam plenitudo gentium introierit. Dixit enim: Benjamin lupus rapax, lupus scilicet, quia ipse populus effudit sanguinem prophetarum atque justorum. Rapax autem propter aviditatem dicitur. Ex multa enim fame verbi Dei et inedia venit rapax, quia et ipse violenter diripuit regnum Dei. Hic autem mane comedit praedam. Mane illud tempus creditur quo legem accepit. Tunc mundo prima quidem illuminatio scientiae data est. Comedit autem mane, quia legem, quam mane accepit, comedit adhuc, et meditatur; licet sequens legem justitiae in legem fidei non pervenit. Ad vesperam autem dividet spolia. Vespere est illud tempus novissimum quo convertetur. Tunc | ergo dividet escam, tunc intelliget dividendam esse litteram ab spiritu, et tunc cognoscet quia littera occidit, spiritus autem vivificat. Quia ergo jam per gratiam Domini illummatus incipit in lege spiritalia a corporalibus dividere et separare, ideo dicitur, ad vesperam dividet escam, quod tota die in lege meditans ante non fecit.\
""" },
  { line = 419, text = """
Quaeritur autem de Jacob cur omnes quos de liberis et ancillis genuit, aequales honore filios et haeredes constituerit? Nisi ut ostenderet quod Christus Dominus omnibus gentibus, qui per fidem corpori ejus conciliantur, cunctis pari honore et gloria habitis coelestia praemia largiatur. Non est enim discretio: Judaeus an Graecus, barbarus an Scytha, servus an liber sit; quia per omnia et in omnibus Christus | est (Col. III, 11). Propterea enim figuram servi Salvator noster et Dominus induit, et pro libero et pro servo servivit, ut omnibus credentibus in se aequale donum bonorum coelestium largiatur. Nec praefertur apud illum qui secundum carnem nobilior sit. Quicunque enim fidem promeretur, nullis maculis carnalis nativitatis offuscatur. Nam hoc ita futurum etiam per prophetam significatur, dicente Domino: Erit in diebus novissimis, effundam de spiritu meo super omnem carnem (Joel. II, 28). Sequitur.\
""" },
]
