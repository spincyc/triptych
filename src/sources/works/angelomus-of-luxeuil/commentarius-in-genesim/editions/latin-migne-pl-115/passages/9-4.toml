text = """
VERS. 20-23.-- Coepitque Noe vir agricola exercere terram, et plantavit vineam, bibensque vinum inebriatus est, et nudatus in tabernaculo suo. Et reliqua. Quare tantus vir inebriatus esse legitur? Forte, ut | beatus Hieronymus, coelestis Bibliothecae interpres, dicit, quia inebriari vino nesciebat. Nec enim ante diluvium leguntur homines vino usi fuisse [ Petr., legitur vino homines uti]. Ideo specialiter de Noe dicitur: Plantavit autem vineam. Ut aliquibus videtur, nudatio femorum post ebrietatem secuta est, quia saepius satietatem libido sequitur. Sed quod filii Noe incedentes retrorsum operuerunt verenda patris, faciesque eorum aversae erant, et reliqua, moraliter intelligi valet. Aversari dicimus quod reprobamus. Quid est ergo quod filii verenda patris superjecti dorsis pallio aversi venientes operiunt, nisi quod bonis subditis sic praeceptorum suorum mala displicent, ut tamen haec aliis occultent? Operimentum | aversi deferunt, quia dijudicantes factum, et venerantes magisterium nolunt videre quod tegunt. Sequitur:\
"""
