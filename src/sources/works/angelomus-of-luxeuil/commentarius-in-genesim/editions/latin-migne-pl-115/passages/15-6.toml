physical_line_ranges = [[188, 188]]
text = """
VERS. 13-17.-- Dixitque Dominus ad eum: Scito praenoscens quod peregrinum futurum sit semen tuum in terra non sua, et subjicient eos servituti et affligent quadringentis annis, et reliqua. Non sic accipiendum est tanquam in illa durissima servitute quadringentis annis Dei populus fuerit; sed quia | scriptum est: In Isaac vocabitur tibi semen, ex anno nativitatis Isaac usque ad annum egressionis ex Aegypto computantur anni quadringenti quinque. Cum ergo de quadringentis triginta detraxeris viginti quinque, qui sunt a promissione usque ad natum [ Z., nativitatem] Isaac, non mirum est si quadragintos et quinque annos summa solida [ Z., solidate] quadringentos voluit appellare Scriptura, quae solet tempora ita nuncupare, ut quod de summa perfectionis numeri paululum excrescit, aut infra est, non computetur. Non itaque quod ait, in servitutem redigent eos, et nocebunt illis, ad quadringentos annos referendum est, tanquam per tot annos eos habuerint in servitutem; sed referendi sunt quadringenti anni ad id quod dictum est, peregrinum | erit semen tuum in terra non propria. Quia sive in terra Chanaan, sive in Aegypto peregrinum erat illud semen, antequam haereditatem sumerent in terra, ex promissione Dei, quod factum est posteaquam ex Aegypto liberati sunt, ut hyperbaton hic intelligatur, ut ordo verborum sit: Sciendo scies quia peregrinum erit semen tuum in terra non propria quadringentis annis; illud autem interpositum intelligatur, et in servitutem redigent eos, et nocebunt illis, ita ut in quadringentos annos ista interpositio non pertineat. In extrema enim parte summae hujus, hoc est post mortem Joseph, factum est ut in Aegypto populus Dei duram perageret servitutem. Sed quare dictum est de filiis Abram: Quarta progenie revertentur huc? et in Exodo legitur: | Quinta generatione ascenderunt filii Israel de terra Aegypti? Replica genealogiam Levi. Levi genuit Cath, Cath genuit Amram, Amram genuit Aaron, Aaron genuit Eleazar, Eleazar genuit Phinees. Cath cum patre suo Levi ingressus est Aegyptum. Rursum Eleazar cum patre suo Aaron egressus est ab Aegypto. A Cath usque ad Eleazar computantur quatuor. Quod autem secundum Exodum quinta generatione egressi sunt filii Israel de terra, tribus tibi Judae ordo numeretur. Juda genuit Phares, Phares genuit Esrom, Esrom genuit Aran, Aran genuit Aminadab, Aminadab genuit Naason, Naason genuit Salmon. Phares cum patre suo Juda ingressus est Aegyptum. Naason princeps Juda in deserto describitur, | cujus filius Salmon terram repromissionis introivit. Computa a Phares usque ad Naason, et invenies generationes quinque.\
"""
