physical_line_ranges = [[88, 88]]
text = """
VERS. 22.-- Ecce Adam factus est quasi unus ex nobis, sciens bonum et malum. Ait enim, quasi unus ex nobis. Sic loquitur quasi esset Deus, quod pertinet ad irrisionem insultantis, vel deterrentis ad exemplum timoris, ne quis [ Z., om. quis] peccaret, | quia non solum ita factus est ut fieri voluit, sed nec illud quod factus fuerat, conservavit. Bene dixit, quasi unus ex nobis, pluraliter propter Trinitatem, et illud: faciamus hominem, et reliqua. Sciens bonum et malum, videlicet per experimentum, quod Deus novit per sapientiam. Videte ne forte sumat de ligno vitae, et vivat in aeternum. Ideo noluit sua pietate ut iterum sumeret de ligno vitae, quia si inde comederet, immortalis cum suo peccato tanquam diabolus, ut aliqui volunt, permaneret, et non rediret per poenitentiam. Unde putant quod nunquam de ligno vitae comedisset, quia si edisset, inquiunt, non peccaret. Aliter. Voluit Deus ut sumeret, et per poenitentiam recuperaret; et est ambigua locutio. Loquimur enim sic cum dicimus: Ideo moneo te ne | iterum facias quod fecisti, volentes enim ut faciat. Et iterum: Ideo moneo te ne sis bonus, volentes utique ut sit. Ideo moneo te ne desperes quod bonus possis esse. Tali enim modo ait Apostolus: Ne forte det illis Deus poenitentiam ad cognoscendam veritatem (II Tim. II, 25), cum hoc utique cupiebat.\
"""
