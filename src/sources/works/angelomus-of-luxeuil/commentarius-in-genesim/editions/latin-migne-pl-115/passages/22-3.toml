text = """
VERS. 4.-- Itinere dierum trium, etc. Notandum quod de Geraris usque ad montem Moria, id est aedem [ Petr., sedem] templi, iter dierum trium sit, et consequenter illuc die tertio pervenisse dicatur. Male igitur quidam Abraham putant illo tempore ad quercum habitasse Mambre, cum inde usque ad montem Moria vix unius diei iter plenum sit. Quaeritur etiam cur in tentatione Abrahae dixit Deus: Tolle filium tuum, quem diligis, Isaac? nisi ut charitatis admonitione, et nominis recordatione, tentationis pondus accumularetur, et paternus affectus torqueretur ex memoria professionis, dum ante Deus dixit | ad eum: In Isaac vocabitur tibi semen. Quasi si ille occideretur, tota spes promissionis frustraretur. Et cur non statim licuit ei occidere filium, sed triduana itineris mora eum immolaturus secum duci jussus est? Quatenus longitudine temporis tentationis quoque augeretur incrementum. Nam per triduum iter protenditur, et per totum triduum crescentibus curis paterna viscera cruciantur, ut omni hoc spatio tam prolixo intueretur filium pater, cibum cum eo sumeret, tot noctibus puer penderet in amplexibus patris, inhaereret pectori, cubitaret in gremio, quatenus per singula momenta in paterno affectu dolor occidendi filii accumularetur.\
"""
