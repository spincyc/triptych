text = """
VERS. 3-5.-- Factum est autem post multos dies ut offerret Cain de fructibus terrae munera Domino, et reliqua usque: non respexit Dominus ad Cain, et ad munera ejus, iratusque est Cain vehementer, et concidit vultus ejus. Unde scire potuit Cain quod fratris munera suscepisset, et sua repudiasset, nisi quia vera est illa Theodotionis interpretatio, qua dicit: Inflammavit Dominus super Abel et super sacrificium ejus: super Cain vero et sacrificium ejus non inflammavit? Unde creditur quia ignis missus est de coelo, qui illud sacrificium suscepit, ut saepissime viris sanctis | offerentibus factum legitur, sicut in dedicatione templi sub Salomone legimus, et quando Elias in monte Carmelo construxit altare.\
"""
