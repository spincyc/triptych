text = """
VERS. 16-18.-- Dan judicabit populum suum sicut | et alia tribus Israel. Fiat Dan coluber in via, et cerastes in semita, mordens ungulas equi, ut cadat ascensor ejus retro. Salutare tuum exspectabo, Domine. Samson judex Israel, de tribu Dan fuit. Hoc ergo dicit nunc videns in spiritu comam nutrire Samsonem: Nazaraeum tuum caesis hostibus triumphare, quod in similitudinem colubri regulique obsidentis vias, nullum per terram Israel transire permittat: sed etiam, si quis temerarius virtute sua, quasi velocitate equi confisus eam voluerit praedonis more populari, non effugere valebit. Totum autem per metaphoram serpentis et equitis loquitur. Videns ergo tam fortem Nazaraeum tuum, quod ipse propter meretricem mortuus est, et moriens nostros occidit inimicos, putavi, o Deus, ipsum esse Christum | Filium tuum. Verum quia mortuus est, et non resurrexit, et rursum captivus ductus est Israel, alius mihi salvator mundi, et mei generis praestolandus est, ut veniat cui repositum est. Ipse erit exspectatio gentium.\
"""
