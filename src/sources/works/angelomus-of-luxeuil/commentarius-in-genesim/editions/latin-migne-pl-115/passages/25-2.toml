text = """
VERS. 6,7.-- Filiis autem concubinarum largitus est munera. Sola Saraa semper uxor vocatur. Quae est ista Cethura, aut unde genus duxit? Cethura interpretatur copulata, aut vita, quam ob causam suspicantur Hebraei eamdem esse Agar, quae, Saraa mortua, de concubina transiret in uxorem, Et videtur depositi jam Abrahae excusari aetas, ne | senex post mortem uxoris vetulae novis arguatur nuptiis lascivisse. Fertur quoque quia filii Abrahae, qui ei de Cethura nati sunt, occupaverunt Arabiam usque ad maris Rubri littora. Dicitur autem unus ex posteris Abrahae, qui appellabatur Asser, duxisse adversus Libyam exercitum, et ibi victis hostibus consedisse, ejusque posteros ex nomine atavi Africam nuncupasse. Alios quoque filios Abrahae ex Cethura occupasse Indiae regiones aestimatur [Z., aestimant].\
"""
