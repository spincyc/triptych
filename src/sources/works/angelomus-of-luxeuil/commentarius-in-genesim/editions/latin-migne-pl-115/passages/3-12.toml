text = """
VERS. 14.-- Qui dixit ad serpentem: Quia fecisti hoc, maledictus eris inter omnia animantia et bestias terrae. Super pectus tuum et ventrem gradieris. Ventrem septuaginta addiderunt Interpretes. Caeterum in Hebraeo pectus tantum habetur. Ecce! Serpens non est interrogatus; quia forte non hoc sua natura, vel voluntate fecerat, sed diabolus de illo et per illum fuerat operatus. Ideoque consequenter neque ipse est interrogatus, quia nec confiteri peccatum est diabolo, nec habet omnino unde se excuset. Sed statim excepit poenam maledictionis, et non eam quae ultimo judicio reservatur, quae praeparata est sibi et angelis ejus; sed poena ejus hoc in loco dicitur, ut in potestate | habeat eos qui Dei praecepta contemnunt. Et inde [ Z., in die judicii] major poena est illi, quia de tali infelicitate laetatur. Ait enim: Super pectus tuum et ventrem gradieris. Nomine pectoris significatur superbia mentis, nomine vero ventris significantur desideria carnis. His enim duabus rebus serpit diabolus in eos quos vult decipere, id est aut terrena cupiditate et luxuria, aut superbia et insana doctrina. Dum enim quis luxuriam jam perpetrat actione, huic serpens repit ex ventre. Alius vero dum perpetranda versat in mente, huic serpens repit ex pectore. Sed quia per cogitationem ad opera explenda pervenitur, recte serpens prius pectore, et postmodum repere ventre describitur. Et terram comedes. Id est ad te pertinebunt quos terrena cupiditate | deceperis. Omnibus diebus vitae tuae. Hoc est, omni tempore quo agis hanc potestatem ante ultimam judicii diem.\
"""
