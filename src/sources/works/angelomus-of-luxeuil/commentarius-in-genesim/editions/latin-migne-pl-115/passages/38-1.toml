physical_line_ranges = [[371, 374]]
text = """
VERS. 1-30.-- Eodem tempore descendens Judas, a fratribus suis divertit ad virum Odollamitem, nomine Hiram, et caetera usque postea egressus est frater ejus, in cujus manu erat coccinum, quem appellavit Zaram. Qualiter historia de Juda, et tribus filiis ejus, et uxore Thamar intra tam paucos annos compleri potuit? cum ergo ipse Joseph anno septimo decimo aetatis suae venditus fuisse credatur, tredecim | annos peregerat in Aegypto ignotus Pharaoni. Ad hos enim tredecim annos accesserunt septem anni ubertatis, et facti sunt anni viginti; his adduntur duo, quia secundo anno famis intravit Jacob in Aegyptum cum filiis suis, et inveniuntur viginti duo anni quibus abfuit Joseph a patre et a fratribus suis; quo medio tempore quomodo fieri potuerunt?

Solet enim Scriptura sancta pro capitulatione multa praeferre. Aliquot annos ante venditum Joseph haec fieri coepisse intelligi datur. Etiam mox, ut adolesceret Judas, coeperit incidisse in amorem ejus quam duxit uxorem, nondum vendito Joseph in Aegyptum. Cur dixit de Thamar, depositis vestimentis viduitatis suae? Quatenus intelligeres ex temporibus patriarcharum certa et sua fuisse vestimenta | viduarum, non utique talia qualia conjugatarum.

Quare dixit Judas: Justior est Thamar quam ego? Thamar vero in bivio sive in compito sedens, ubi diligentius debet viator aspicere quod iter gradiendi capiat, non ut vagans turpitudinis libidinem impleret, sed ut liberos a socero acciperet, justior est causa quam socer. Ille libidinis, illa liberorum. Et ideo in comparatione ejus minus male fecerat.

Si enim Phares inde sortitus est nomen divisionis, quia diviserat membranam secundarum, unde Zara sic nomen accepit? Zara interpretatur Oriens. Sive igitur quia primus apparuit, sive quia plurimi ex eo nati sunt justi, sicuti in Paralipomenon legimus.\
"""
