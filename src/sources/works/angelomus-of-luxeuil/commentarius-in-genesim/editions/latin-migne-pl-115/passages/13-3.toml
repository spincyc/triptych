VERS. 13.-- Homines autem Sodomitae pessimi erant, et peccatores coram Domino nimis. Superflue | additum est, coram Domino, sicut in LXX etiam invenitur; siquidem Sodomorum coloni apud homines mali et peccatores erant. Ille autem dicitur in conspectu Dei peccator, qui potest apud homines justus videri, quomodo de Zacharia et Elisabeth in praeconio ponitur, quod fuerint justi ambo in conspectu Dei, et in psalmo dicitur: Non justificabitur in conspectu tuo omnis vivens (Psal. CXLII, 2).\
