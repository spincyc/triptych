text = """
VERS. 4, 5.-- Dixit autem serpens ad mulierem: Nequaquam morte moriemini. Scit enim Deus quod in quacunque die comederitis ex eo, aperientur oculi vestri, et eritis sicut dii, scientes bonum et malum. Ac si dixisset: Non est ita ut dicitis. Invidit itaque vobis Deus suam gloriam, et dignitatem, propterea vobis ista praecepit. Scit enim quia, si comederitis, similes ei eritis, scientes bonum et malum. Melius consilium dabo: Comedite, et aperientur oculi vestri, et reliqua. Magna promittit, ut facilius decipiat. Ait enim: et aperientur oculi vestri. Ad hoc persuasit ut | sub Deo esse nollent, sicut ipse esse contempsit. Libet inquirere quare diabolus tam infestus exstitit hominum saluti? Videlicet propter odium in Creatorem, et invidiam in hominem, et desperationem suae salutis. Sequitur:\
"""
