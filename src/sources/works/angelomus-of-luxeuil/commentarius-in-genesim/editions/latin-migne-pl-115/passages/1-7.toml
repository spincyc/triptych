text = """
VERS. 9.-- Dixit quoque Deus: Congregentur aquae, quae sub coelo sunt in locum unum, et appareat arida, et reliqua. Si enim totus mundus erat aquis plenus, ubi congregatae sunt, nisi quod ait: Congregentur in locum unum? ac si diceret: Distinguat, atque producat jam ex se species suas illa informis materia, et appareat species aquarum, et species terrae. Ipsa enim congregatio in unum ipsa est aquarum formatio, quas videmus et tangimus. Et quod ait, appareat arida, quid aliud dici intelligendum est, nisi materies accipiat visibilem formam, quam nunc habet terra ista? Quae bene, inquam, terra arida vocatur, quia, sicut ignis proprie calorem, et aqua humorem, | ita quoque terra ariditatem habet.\
"""
