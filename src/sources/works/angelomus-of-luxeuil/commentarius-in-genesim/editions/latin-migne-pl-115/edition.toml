notes = "Migne divides the commentary into capita answering to the chapters of Genesis and heads each block with `VERS. 11-13.`, the compiler's own statement of what the block expounds. Those statements bound the fragments here, checked against the lemma each block quotes: the caput marker for Genesis 5, for Genesis 30 and for Genesis 50 is missing from the printing, so the caput alone would have filed Adam's genealogy under Cain's chapter and Joseph's death under Jacob's blessing. No English translation of this work exists at all."
