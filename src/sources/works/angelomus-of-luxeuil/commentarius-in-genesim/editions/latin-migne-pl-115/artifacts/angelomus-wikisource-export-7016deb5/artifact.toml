rights_basis = "Angelomus of Luxeuil's Latin is of the ninth century and Migne's printing is of 1852, so the text beneath these bytes is in the public domain everywhere. The bytes themselves are the wiki source of a Latin Wikisource transcription, and Latin Wikisource contributions are licensed CC BY-SA 4.0 — a condition on the contributors' markup rather than on Migne's text under it. The exact bytes are therefore hashed and recorded but not retained here, and only the printed Latin reaches the tracked derivative, stripped of every template, link, heading and column marker the contributors and the encoder added."
