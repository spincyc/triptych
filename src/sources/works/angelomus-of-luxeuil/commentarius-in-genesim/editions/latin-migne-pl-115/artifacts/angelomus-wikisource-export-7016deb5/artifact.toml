provenance = "Retrieved 2026-08-01 in one request, by POSTing the page list (Commentarius in Genesin (Angelomus Luxovensis)) to Latin Wikisource's Special:Export with curonly=1, so the whole work arrived as a single document. No model stood anywhere in the retrieval path: the bytes were fetched with curl, hashed, and read locally, which is the rule this corpus exists under because the same corpus has already been shown to come back paraphrased when a model was asked for it verbatim. Latin Wikisource states its contributor licence through its own API (action=query&meta=siteinfo&siprop=rightsinfo) as Creative Commons Attribution-Share Alike 4.0; that response was fetched and hashed (sha256 5131b8f6c7bcc6717ff869623ec0ed1824ad0e79fe24697a6ed75f33787c560a, 162 bytes) before any payload was kept, which is the order guidance/sources.md requires. Wikisource is a mutable witness, so this artifact identifies a dated state of it and not a stable republication."
