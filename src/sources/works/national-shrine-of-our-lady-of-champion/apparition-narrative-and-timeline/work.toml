description = "The current published presentation of the Champion events by the shrine that holds the site: the narrative of the seer, the three encounters, the full received message, the mission, the fire of 8 October 1871, and the 2010 declaration; a dated historical timeline; and the pages for the annual solemnity of 9 October. The narrative page states its own method, that Adele Brise never learned to read or write and that the account 'was developed based on a compilation of oral history from Adele and sources close to her, historical documents, and second and third-hand accounts found in the archives of the Shrine.' A custodial statement, never an independent historical witness. The fire section attributes to Fr Peter Pernin a paragraph which the consuming publication collated against both 1874 printings and found not to be his text."
