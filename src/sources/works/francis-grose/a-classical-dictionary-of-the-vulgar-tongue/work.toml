composed_basis = "Grose first published the Classical Dictionary of the Vulgar Tongue in 1785. The text registered here is the 1811 revision, which is an edition of that work and is dated on its own record; Grose died in 1791 and the 1811 revision is another hand's."
description = "Grose's dictionary of eighteenth-century English cant and slang, opened in this run as one of four period slang and phrase dictionaries searched for the gastric sense of \"the inner man\". It does not carry it."
