notes = "Registered on the pattern this library already uses for a constituent of a Migne volume: the edition is the constituent as Migne prints it, and the artifacts are the Internet Archive's derivatives of the whole volume, which is the narrowest exact witness that was actually retrieved. The printing year of the scanned copy is not established and is not asserted: the Patrologia Latina volumes were reissued repeatedly and this copy's front matter, read in the retained text layer, gives the imprint line but no legible year. The Micrologus stands at columns 973-1022 of the volume."
