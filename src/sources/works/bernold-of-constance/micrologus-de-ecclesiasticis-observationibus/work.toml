description = "The Micrologus, an eleventh-century Roman liturgical handbook printed by Migne among the works of Bernold of Constance, at columns 973-1022. Chapters XXVIII-XXIX on the Ember fasts and the vacant Sundays are what this run reads. The attribution to Bernold is the traditional one and is recorded as an attribution rather than as an established fact; nothing in the registered bytes settles it, and the composition date is likewise not established here."
