context = "The complete chapter Sunday before the Feast of All Saints: Feast of the Kingship of Our Lord Jesus Christ was freshly read at printed pp. 200-204 in source PDF220-224, with title/translator/publication identity checked at PDF9-10. Image checking confirms the study’s claims about the Introit, psalm verse, Collect, Epistle, Gradual, Alleluia, Gospel, Offertory, Preface, Communion and Postcommunion. The Secret is quoted but not separately commented on. The one explicit cross-element connection is the double chant of Gradual and Alleluia (p.203); the source does not itself make the study’s other whole-Mass groupings."
notes = "The 2026-10-23 event is fresh page-image inspection and bounded claim verification, not a recreation of the historical review. The p.203 paragraph about medieval papal deposition is part of the read context but is not adopted as the study’s thesis. No Italian-original collation, independently collated transcription or Catena admission is claimed. The chapter is Mass-keyed liturgical commentary; it must not be given the whole of John18 as an invented natural Scripture extent."
