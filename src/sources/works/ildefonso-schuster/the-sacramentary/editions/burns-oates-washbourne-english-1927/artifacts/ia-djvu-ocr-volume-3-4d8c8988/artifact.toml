rights_basis = "The English volume was published at London in 1927 and its United States copyright term, at most ninety-five years from publication under 17 U.S.C. 304, expired at the end of 2022; Schuster died in 1954 and the named translator, Arthur Levelis-Marke, earlier still, so no life-based term reaches it in the United States either. THE TEST WAS RUN OVER THESE BYTES AND NOT ASSUMED. The question for an Internet Archive optical text layer is whether Google's own prose is inside the file, and this repository already answers it the same way twice, in opposite directions: artifact.catholic-church.missale-romanum.pustet-ratisbon-1862.missale-romanum-1862-text-f34bc7cf is tracked because its file carries the four-word page-foot stamp and no Google-authored prose, and artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr stands remote and unresolved because its first sixty-five lines are Google's front-matter block entire. The same probes were run here, case-insensitively over the whole file with runs of non-alphanumeric characters collapsed, because this class of scan doubles its spaces: \"usage guidelines\" 0; \"about google book search\" 0; \"this is a digital copy\" 0; \"digitized by google\" 0; \"google book search\" 0. Not one word of Google-authored prose is in this file and no notice, licence, reservation or condition of any kind appears in it. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it, so there is no author to hold a right in the text layer. NOT RELIED ON: that the item is available, that the download succeeded, or that any host marks the scan public domain."
