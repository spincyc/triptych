notes = "Uncorrected optical text of the whole of volume III, 27628 LF-terminated lines, valid UTF-8, no CR bytes. Extent as measured by the retrieving lane: Complete DjVu optical-text layer of the whole of Schuster, The Sacramentary (Liber Sacramentorum), English vol. III ('The Eternal Nuptials of the Lamb: the sacred Liturgy from Trinity Sunday to Advent'), from Internet Archive item LiberSacramentorum -- the same item whose vol. 3 PDF is registered here as artifact.ildefonso-schuster.the-sacramentary.burns-oates-washbourne-english-1927.ia-scan-volume-3-410f6d11. This is the text layer and NOT the registered PDF bytes; the source record for that PDF states it carries no usable text layer, so this layer is an independent optical reading of the same scan.. This is the text layer of the same Internet Archive item whose PDF is registered on this edition as ia-scan-volume-3-410f6d11; the two are different bytes and this one is NOT derived from the registered PDF, so no derived_from edge is asserted. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE: it is uncorrected recognition and a raw-line negative over it establishes nothing about the printed page."
