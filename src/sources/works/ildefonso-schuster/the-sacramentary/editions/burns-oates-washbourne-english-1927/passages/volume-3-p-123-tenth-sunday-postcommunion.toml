context = "Schuster's direct commentary on the Postcommunion of the Tenth Sunday after Pentecost. The paragraph compares material food's repair of exhausted bodily forces with spiritual nourishment's restoration of the soul, then interprets the prayer as asking for continuing divine help both to attain eternal life and to preserve the Eucharist's effects. The text was read visually on printed page 123 (PDF page 139) of the exact hashed facsimile; Internet Archive OCR was used only to locate the page."
