context = "Schuster's continuous commentary on the Mass of the Thirteenth Sunday after Pentecost. On printed page 132 he reads the Introit's plea not to be forsaken together with the promised final victory and the patriarchal promise, while acknowledging the worshipper's experience that God can seem to have forgotten the Church. On page 133 he notes Galatians 3:16--22 and the 430 years between the promise to Abraham and the Mosaic law, then returns in the Gradual commentary to promises made to the patriarchs. On page 134 he reads Psalm 89's refuge from generation to generation as God's constancy against human inconstancy, and Psalm 30's Offertory as entrusting the worshipper's times to God's hands and loving providence. These statements provide a checked precedent for placing the Introit, Epistle, Alleluia, and Offertory in one temporal and covenantal movement; they do not establish the historical compiler's intent. The record does not adopt Schuster's separate period claims on pages 133--134 about Israel, Jews, or supersession, which are outside that narrow precedent."
verified_on = "2026-08-21"
notes = "Printed pages 132--134 are PDF pages 148--150. All three leaves were read visually in the exact facsimile whose SHA-256 is recorded above; the artifact has no usable text layer. The passage boundary begins with the heading 'Thirteenth Sunday after Pentecost' on page 132 and extends through the Offertory commentary on page 134. The page continues into the Secret commentary, which is outside the claims controlled here."
