description = "Collection of proper saints offices for the Church and Diocese of Toledo, conforming to the Roman Breviary. The work composition date is not established here. The independently checked 1626 printing witnesses three Cross antiphons in the third nocturn of the 16 July Triumph of the Holy Cross office; this does not identify it as a Good Friday transfer rite."
