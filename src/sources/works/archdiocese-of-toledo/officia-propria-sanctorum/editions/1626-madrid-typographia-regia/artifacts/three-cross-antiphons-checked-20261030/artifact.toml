provenance = "The full first, second and third Cross antiphons of the third nocturn were read on printed55-56, complete PDF71-72, at both 200 and 400 dpi. The first full occurrence of Adoramus and Per lignum on printed55 and the clearest full repetition of Salvator on printed56 control the transcription. The entire second source body retains its final Alleluia. No raw OCR reading supplies a word."
