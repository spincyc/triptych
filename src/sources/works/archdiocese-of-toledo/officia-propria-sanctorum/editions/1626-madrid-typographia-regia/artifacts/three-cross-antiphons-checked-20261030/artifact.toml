transformation = "Transcribe each complete antiphon once, excluding the Antiphona markers, Psalm texts, running titles and repeated antiphons after the Psalms. Join source line wraps, regularize typographic long-s to s, expand no lexical abbreviation in the selected complete right-column Salvator repetition, and retain ampersands and the old serui/Saluator/salua spellings. Preserve source pointing and its explicit final Alleluia on Per lignum. Blank lines separate the three full antiphons in their historical office order. No 1962 target pointing, word order or omitted suffix is silently substituted."
