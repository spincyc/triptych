notes = "The full PDF title page (artifact page 1) visibly prints M.DC.XXVI. The license (artifact page 2) visibly dates 7 July 1626; the raw optical extraction misreads that license as 1616 and is not the date authority. The title names earlier approvals and the archbishops Gaspar de Quiroga and Bernardo de Sandoval y Rojas. This is a Roman-Breviary proper-office collection, not the Mozarabic Missal. Printed pages 55-56 are exact complete PDF artifact pages 71-72."
