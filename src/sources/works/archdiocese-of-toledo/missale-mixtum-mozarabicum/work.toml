description = "The altar book of the Hispano-Mozarabic rite -- the old Spanish rite, the Visigothic and Isidorian use of the peninsula, suppressed for the Roman use in the eleventh century and kept alive at Toledo, where Cardinal Ximenez de Cisneros endowed the chapel of Corpus Christi in the cathedral for its celebration and had the Missale mixtum printed in 1500. IT IS NOT THE MISSALE ROMANUM AND MUST NOT BE FILED WITH IT: its Mass has its own shape, with the Illatio for the Preface, the Post pridie for what the Roman book puts after the institution narrative, the fraction of the Host into nine particles, and the Creed said after the consecration. It is registered under the archdiocese of Toledo because Toledo is the church whose ordinary has held and legislated for the rite continuously -- Cisneros for the 1500 printing, Lorenzana for the 1770s recension that Migne reprints -- on the same pattern as work.archdiocese-of-braga.missale-bracarense. NEITHER EDITION REGISTERED HERE IS A TYPICAL EDITION AND NEITHER IS AN ACT. Both are scholarly reprintings of the Cisneros book: Alexander Lesley's of 1755, printed at Rome with his own preface, notes and appendix, and Migne's of 1862, which reprints Lesley in the Patrologia Latina. The rite's own modern book, the Missale Hispano-Mozarabicum promulgated at Toledo in 1991 and 1994, is in copyright, was not acquired, and has no record here."
