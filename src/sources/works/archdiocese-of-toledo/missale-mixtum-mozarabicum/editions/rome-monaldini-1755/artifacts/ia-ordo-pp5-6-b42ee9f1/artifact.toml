notes = "Both IA items are digitizations of this one edition; the NYPL title page (page 1) was visually checked: MISSALE MIXTUM ... AB ALEXANDRO LESLEO ... PARS PRIMA. ROMAE MDCCLV. Sumptibus Venantii Monaldini ... TYPIS JOANNIS GENEROSI SALOMONI. The constituent runs from Deinde dicat Presb. in silentio (p. 5, left column, Lesley line 36) to the Amen after Per omnia secula seculorum (p. 6, right column, line 81). Lesley's printed marginal line numbers are excluded apparatus. The NYPL copy is partial elsewhere in the volume; no complete-book claim is made from it."
