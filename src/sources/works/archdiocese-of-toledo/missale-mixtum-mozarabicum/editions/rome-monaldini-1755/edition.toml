publication = "MISSALE MIXTUM SECUNDUM REGULAM BEATI ISIDORI DICTUM MOZARABES, PRAEFATIONE, NOTIS, ET APPENDICE AB ALEXANDRO LESLEO S. J. SACERDOTE ORNATUM. PARS PRIMA. ROMAE MDCCLV. Sumptibus Venantii Monaldini Bibliopolae in Via Cursus. TYPIS JOANNIS GENEROSI SALOMONI. SUPERIORUM PERMISSU. Dedicated by the bookseller Monaldini to Benedict XIV."
date = "1755"
editors = ["Alexander Lesley"]
authority = "None. `Superiorum permissu` on the title page is the ordinary Roman printing licence and nothing more; the book is a bookseller's undertaking dedicated to the reigning pope, not a promulgation. Monaldini’s dedication explains why it was made: the Cisneros book had become so rare that it could not be had except for a great sum, and liturgical scholarship needed it in print again."
jurisdiction = "Hispano-Mozarabic rite; printed at Rome"
notes = "Two digitizations of this edition are separately registered. The NYPL Internet Archive copy missalemixtumse00leslgoog has 408 images and breaks off within the sanctoral at IN JEJUNIO KALENDARUM NOVEMBRIUM; it is not a complete-book witness. The Florence/Google copy bub_gb_hAJaQabODUYC supplies 761 PDF pages, and its entire offered PDF is retained. Its title is PDF page 8; the complete Benedictio panis is printed p. 471 / PDF page 591, followed by the reprinted 1500 colophon on PDF page 592. Later explanatory notes and appendices continue after that colophon; the colophon is the end of the reproduced liturgical body, not the final page of the 761-page file. Complete offered-file acquisition does not independently establish physical completeness or full text collation. On 2026-10-19 the exact original JPEG2000 image 590 was retained because it resolves quinque more clearly than the bilevel PDF. All nineteen semantic transcription lines and nine units of the complete blessing were independently reviewed and bound as a native constituent. Every other book division is excluded from that binding. The 1755 dedication and preface establish republication of the Toledo/Cisneros missal; the native blessing remains an independent snapshot without inferred Git parentage. An earlier OCR audit flagged a preface citation reading Venetiis 1759, likely a digit error against adjacent bibliographic matter; that isolated reading remains unverified against its page and does not replace the explicit 1755 title date."
