context = "Section 15 identifies the Toledo 1500 Missal. Section 16 reports three copies seen, one paper and two parchment, and says quibus duobus usus sum of the two parchment copies from the Corsini and Silvio Valenti Gonzaga libraries. Sections 17–19 describe the old volume and explicitly include the bread blessing among its terminal matter. Both original page images were directly read."
notes = "This is the editor's explicit account of using copies of the 1500 edition, including its description of the complete Benedictio panis context. It does not identify the particular Castilla-La Mancha copy retained as this project's 1500 witness as Lesley's donor, and it does not by itself certify a whole-book collation or substantive ritual revision. The complete nine-unit blessing has its own independent collation receipts in both editions."
