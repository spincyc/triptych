context = "Complete Ordo core from the rubric Deinde dicat Presb. in silentio (p. 5, line 36) through the Amen after the Liberati embolism (p. 6, line 81); every rubric, response, cross, the marginal note (read on the Florence page), the Roman form below the columns and the fraction figure are present. Unrelated matter on the same pages, Lesley's line numbers and the title page are outside the constituent."
notes = "Independent page-image reading transcription, not OCR; OCR and Migne PL 85 used only as leads. Expand printed contractions and suspensions; long-s to s; consonantal u/v and i/j standardized; et replaces ampersand or Tironian et; ae and oe ligatures expanded as ae and oe; the printed accents of 1755 and 1804 omitted. Case and clause punctuation regularized: all three Ordo readings use the 1500 pointing and capitalization for corresponding wording, with nomina sacra capitalized; printed commas, semicolons and line layout are not recorded. The word-dividing colons of the consecration words and of the Roman form printed below them are recorded exactly as each edition prints them (present in 1500 and 1755, absent in 1804). Preserve every lexical item, edition spelling (for example celum/caelum, presbiter/presbyter, simbolum/symbolum, cenavit/coenavit, annunciabitis/annuntiabitis, temptationem/tentationem), response, rubric and printed cross at its printed position, including crosses inside words. No conjectural restoration: the 1500 sancti✠cas, meremur and ad dextera are kept as printed. The fraction figure's nine labels are serialized in the order that 1804 numbers 1-9 (column top to bottom, left arm, right arm, then the two right-hand labels); 1500 and 1755 print no numbers. Where the figure interrupts a unit, the figure is serialized after that unit. Running heads, folio, page, column and editorial line numbers, signatures, catchwords and manuscript annotations are excluded."
