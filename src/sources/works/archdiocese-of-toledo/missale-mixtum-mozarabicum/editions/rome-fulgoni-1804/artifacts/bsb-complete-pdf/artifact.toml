notes = "The complete PDF was acquired in full on 2026-10-19: HTTP 200, 744082515 bytes, SHA-256 c5eb4c0dc348d13aab77b35b4232c0c74c2a162a475bfbdca33c4362841784f9. It contains 855 PDF pages: one modern BSB delivery cover followed by the 854 offered book-scan images. PDF image census confirms one scan image per page on pages 2–855; the cover and first book images were visually checked, and canvas 22 / printed p. XVI was directly verified at PDF page 23. Retaining this approximately 710 MiB payload in ordinary Git would substantially increase every checkout for a bounded nine-unit comparison; it remains remote for this measured artifact-specific size reason. Complete bytes were acquired and hashed locally, but are not retained in the repository. Offline checkout readers can open the exact retained title, complete blessing, reprinted colophon and editorial-method images, plus the complete checked blessing text; the other pages require the remote PDF. Generated URLs can expire; regenerate through the institutional whole-book form. Acquisition and page census do not establish physical completeness or complete-volume textual collation."
