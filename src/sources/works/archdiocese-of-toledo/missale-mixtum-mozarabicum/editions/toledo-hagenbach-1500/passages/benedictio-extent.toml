notes = "Independent page-collated reading transcription, not OCR. Expand printed contractions; long-s to s; consonantal u/v and i/j standardized; et replaces ampersand or Tironian et; ae ligatures expanded as ae. Preserve the 1500 e spellings celum, anime, seculum and presbiter, versus 1804 caelum, animae, saeculum and presbyter. Case and punctuation regularized; 1804 printed acute accents are omitted, and æ is expanded as ae. Preserve every lexical item, response and rubric, all three crosses including San✠cti, and Amens. The 1500 terram uses final-m abbreviation. The original orthographic differences are visible, not classified as liturgical revision."
