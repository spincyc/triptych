notes = "Folios v r - vi v of Dominica prima adventus. PDF page 1 = position 31 (f. v r): only the right column from Deinde dicat presbiter in silentio is in the constituent. Pages 2-3 = positions 32-33 are wholly inside it. Page 4 = position 34 (f. vi v): only the left column through the Amen after Per omnia secula seculorum is inside. On position 32 the marginal Forma ista note, the fraction figure and the Roman consecration form below the columns appear to be printed on separate pasted slips (visual impression only, not established). Position 33 carries a manuscript interlinear et between patre and filio in the creed, excluded as a copy-specific annotation. Identity: the separately retained original colophon (position 965) and its publication-date passage."
