physical_line_ranges = [[1, 6]]
text = "There is now in these parts a very large number of persons who have only one reason for not becoming Christian, and that is that there is no one to make them Christians. It often comes into my mind to go round all the Universities of Europe, and especially that of Paris, crying out every where like a madman, and saying to all the learned men there whose learning is so much greater than their charity, ‘Ah! what a multitude of souls is through your fault shut out of heaven and falling into hell!’ Would to God that these men who labour so much in gaining knowledge would give as much thought to the account they must one day give to God of the use they have made of their learning and of the talents entrusted to them! I am sure that many of them would be moved by such considerations, would exercise themselves in fitting meditations on Divine truths, as to hear what God might say to them, and then, renouncing their ambitions and desires, and all the things of the world, they would form themselves wholly according to God’s desire and choice for them. They would exclaim from the bottom of their hearts: ‘Lord, here am I; send me whithersoever it shall please Thee, even to India!’ In Latin in the original: Heu, quam ingens animorum numerus vestro vitio exclusus cœlo deturbatur ad inferos!"
