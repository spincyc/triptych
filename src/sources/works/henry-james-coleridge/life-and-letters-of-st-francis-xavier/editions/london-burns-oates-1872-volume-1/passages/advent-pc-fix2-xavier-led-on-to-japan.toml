context = "Coleridge, looking ahead from the tidings that drew Xavier toward Macazar: When we look at the remainder of his Apostolate in the East, we can see how his voyage to Malacca and his designs on Macazar led him on in the end to Japan and to the coast of China (the sentence runs over from p. 287 to p. 288). Read on the page images rendered at 200 dpi. Supports the descriptor that Xavier went to Japan. The volume's own narrative of Japan is not reached here; its contents list, for the chapter Four more Months in Malacca, the entries Anger the Japanese and Prospects in Japan (contents read in the OCR layer only)."
