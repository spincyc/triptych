transformation = "Read printed pages 71-72 (PDF pages 99-100) as images and set Chapter V of the autobiography, from its first paragraph through the paragraph ending perfectly happy, one printed paragraph per LF-terminated UTF-8 line, each prefixed by a braced locator giving chapter, printed page and printed text lines (lines counted from the first text line below the chapter title on p. 71 and below the running head on p. 72). Preserved: the printed wording, spelling (spoilt, favours, laboured), capitalization, accents (Thérèse, Céline), punctuation, typographic double quotation marks and apostrophes, and the unspaced em dashes. Normalized: the chapter's opening words, printed with a two-line red initial I and WAS in capitals, are set I was; the printer's spaces before semicolons, colons and the question mark and after opening quotation marks are closed; ligatures (fi, fl) are set as separate letters; line-end hyphens are joined (unbear-able, in-dulging) except at long-desired (p. 71 ll. 10-11) and dining-room (p. 72 ll. 12-13), where the hyphen is kept as the compound's own. Omitted: the chapter number and title (CHAPTER V; VOCATION OF THÉRÈSE), the running head of p. 72, folios, footnote markers and footnotes, and italics (to run as a giant; Master, we have laboured all night, and have taken nothing)."
