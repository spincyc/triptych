rights_basis = "This focused transcription reproduces six paragraphs of the English autobiography of Thérèse of Lisieux as printed in T. N. Taylor's compilation, London, Burns & Oates, fifteenth thousand, with imprimatur and preface dated 1912; a work published in 1912 is in the United States public domain by expired publication term as of 2026 (the parent facsimile's rights_basis gives the evidence; the Internet Archive records the item as NOT_IN_COPYRIGHT). Other jurisdictions are not assessed. The transcription was read from page images rendered from the hashed facsimile and contains no Internet Archive markup or OCR bytes; it adds no original authorship beyond the declared mechanical normalization. The historical wording is excluded from the project licence."
