provenance = "Sources-fix lane of the postconciliar Advent research (advent-pc-fix), 2026-11-26. The complete facsimile PDF https://archive.org/download/saintthaeraeseof00thaeuoft/saintthaeraeseof00thaeuoft.pdf was fetched whole over HTTPS with curl (HTTP 200, 28976400 bytes) and hashed before any page was opened; its SHA-256 (01793fc61c16ce1ffefc5643edd26a4f02140db1c8d90be2300bd3db446640a1) equals the registered facsimile ia-pdf-01793fc6 and its SHA-1 (d45f03d1399109b2e3f33fa93774a73716f8fa8f) equals the Internet Archive item inventory. Physical PDF pages 99 and 100 (printed pages 71 and 72) were rendered with pdftoppm at 300 and 600 dots per inch, cropped into bands of four to six printed lines, and every word, mark of punctuation and line end was read on the images; the footnote of page 71 was also read on the page's native 500-ppi JBIG2 text mask extracted with pdfimages. The text was typed from the images, not from the OCR. Afterwards, as a cross-check only, a word-level comparison with lines 3329-3400 of the tracked OCR ia-djvu-text-ec4a347d found no difference that was not an OCR misreading, a stripped accent, a line-end hyphen or the OCR's page furniture (running head, folio, footnote). No source text passed through a language model."
