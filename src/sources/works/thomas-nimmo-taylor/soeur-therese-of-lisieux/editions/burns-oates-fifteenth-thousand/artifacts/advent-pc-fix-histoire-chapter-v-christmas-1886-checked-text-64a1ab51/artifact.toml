notes = "Six lines, six printed paragraphs. Page 71 is the chapter's first page (title, no running head; 29 text lines); page 72 carries the running head Sœur Thérèse of Lisieux and 31 text lines down to perfectly happy, followed by One Sunday, which is not transcribed. Footnotes, not in the text: p. 71 n. 1, keyed to giant, is faintly printed and only partly legible in this scan (Cf. P[sal]... xviii. 5., with the middle letters of the book name and part of the numeral not legible on the rendered images or the native mask; the OCR reads it Cj '. I'bal:;. xviii. 5.); p. 72 n. 1, keyed to nothing, reads Luke v. 5. The two kept line-end hyphens are an editorial judgement: neither long-desired nor dining-room occurs mid-line elsewhere in the volume's OCR, so the volume gives no direct evidence of its spelling; both follow the ordinary hyphenated form of the period. The OCR artifact's reading prove-.- (p. 71 l. 25) is proves on the image."
