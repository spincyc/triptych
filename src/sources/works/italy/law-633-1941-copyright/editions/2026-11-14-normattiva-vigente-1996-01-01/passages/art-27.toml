context = "Article 27, in the version delivered for 1 January 1996, sets the term of the economic-use rights in anonymous or pseudonymous works, outside the case in the second paragraph of art. 8, at fifty years from first publication, whatever its form; if before that term expires the author is revealed, by the author or by the persons named in art. 23 or authorised by the author, in the forms set by the following article, the art. 25 term applies instead."
