context = "Article 26, in the version delivered for 1 January 1996, determines the term of each co-author's economic-use rights in the works of art. 10 and in dramatic-musical, choreographic and pantomime works on the life of the last surviving co-author; in collective works each contributor's term runs on that contributor's own life, and the term of the economic-use rights in the collective work as a whole is fifty years from first publication, whatever its form, subject to art. 30 for reviews, newspapers and other periodical works."
verified_on = "2026-11-14"
notes = "Read on 2026-11-14 in the exact hashed page (SHA-256 recomputed first) after stripping markup locally with a standard-library script; the date selector vigente al 01/01/1996 and the in-force line (Testo in vigore dal: 18-12-1942 and al: 24-2-1996) were confirmed in the same bytes. The r2-rights research lane had read the same page the same day. This is the portal's consolidated text, not a collation against the Gazzetta Ufficiale. The page gives this version's interval as 18 December 1942 to 24 February 1996, so it was superseded shortly after the edition's date; the amending act is not named in the delivered page text."
