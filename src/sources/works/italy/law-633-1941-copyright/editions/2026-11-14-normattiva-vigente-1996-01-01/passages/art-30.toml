context = "Article 30, in the version delivered for 1 January 1996, provides that where parts or volumes of one work are published separately at different times, a term fixed in years runs for each part or volume from the year of its publication, fractions of a year benefiting the author; for a periodical collective work such as a review or newspaper, the term is likewise counted from the end of each year from the publication of the individual issues or numbers."
