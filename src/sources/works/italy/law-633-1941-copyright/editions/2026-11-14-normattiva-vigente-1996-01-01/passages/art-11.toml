context = "Article 11, in the version delivered for 1 January 1996, gives the State Administrations, the Partito Nazionale Fascista, the Provinces and the Communes the copyright in works created and published under their name and at their account and expense. Its second paragraph gives the same right to private non-profit bodies, unless otherwise agreed with the authors of the published works, and to Academies and other public cultural bodies over the collection of their acts and over their publications."
