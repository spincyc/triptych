notes = "Read on 2026-11-14 in the exact hashed page (SHA-256 recomputed first) after stripping markup locally with a standard-library script; the date selector vigente al 01/01/1996 and the in-force line (Testo in vigore dal: 18-12-1942 with no end date) were confirmed in the same bytes. The r2-rights research lane had read the same page the same day. This is the portal's consolidated text, not a collation against the Gazzetta Ufficiale. The consolidated text delivered for that date still names the Partito Nazionale Fascista; that is the portal's text and is not corrected here."
