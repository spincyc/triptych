context = "Article 29, in the version delivered for 1 January 1996, sets at twenty years from first publication, whatever its form, the term of the exclusive rights of economic use that belong under art. 11 to the State Administrations, the Party, the Provinces, the Communes, Academies, public cultural bodies and private non-profit bodies; for communications and memoirs published by Academies and other public cultural bodies the term is two years, after which the author regains full free disposal of the writings."
