context = "Printed pp. 238–239 (PDF pages 246–247) were visually inspected from the section-16 marker through the section-17 boundary. A character in Lucian's satirical dialogue narrates claims about a Syrian from Palestine and alleged relief of demoniacal possession; the skeptical interlocutor answers with a joke about the narrator's extraordinary eyesight. This verifies a literary representation in Fowler's dated translation, not the event, practitioner, diagnosis, efficacy, payment pattern, standard rite, historical Jesus, Christian identity, or continuity with Christian ritual."
