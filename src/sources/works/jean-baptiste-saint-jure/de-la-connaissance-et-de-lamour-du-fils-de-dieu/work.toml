description = "The large seventeenth-century French treatise of the Jesuit Jean-Baptiste Saint-Jure (1588-1657) on the knowledge and love of Christ, reprinted repeatedly in France into the nineteenth century. Book 3, chapter 8 treats the conformity of the human will to the divine will and closes with a particular exercise toward divine providence. Loci are given as book, chapter, and section; chapter and section divisions follow the printed edition cited, and no first-edition collation is asserted by this record."
