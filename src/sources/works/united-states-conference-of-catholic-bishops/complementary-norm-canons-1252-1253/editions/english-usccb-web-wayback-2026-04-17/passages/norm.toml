context = "Complementary Norm: 'Norms II and IV of Paenitemini (February 17, 1966) are almost identical to the canons cited. The November 18, 1966 norms of the National Conference of Catholic Bishops on penitential observance for the Liturgical Year continue in force since they are law and are not contrary to the Code (canon 6).' Approved: Administrative Committee, September 1983; promulgated: Memorandum to All Bishops, October 21, 1983."
notes = "This is what keeps the 1966 statement, including its Advent paragraphs and its release of vigils and Ember Days, in force under the 1983 Code. Short legal cell quoted from the restricted capture; current as of 2026-11-18."
