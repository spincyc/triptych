context = "Complete article on confirmation of recent General Roman Calendar additions, including Saints Martha, Mary, and Lazarus, and its boxed unofficial English translation of decree Prot. n. 431/24. The publisher report identifies confirmation on 30 September 2024. Its explicitly unofficial translation reports USCCB approval on 14 June 2024 and the request letter of 21 August 2024, with United States territorial scope."
notes = "A publisher report and its labelled unofficial translation establish the bounded reported approval/confirmation chronology, not an official-language act transcription or promulgation/effective date. The page names several additions; no assertion that it is solely a Martha decree is made. Printed page 40 contains a different rite and promulgation date, which do not apply to the Martha formulary. No prayer body or publication permission is supplied."
