context = "The complete introduction was read. Its broad account spans preexilic and postexilic psalms but excludes composition as late as the Maccabean period, approximately 165 B.C. It expressly declines secure individual dating. Earlier collections were eventually combined, but that statement does not supply a date for final assembly. Liturgical genres and references to Zion do not establish where a particular poem was written."
