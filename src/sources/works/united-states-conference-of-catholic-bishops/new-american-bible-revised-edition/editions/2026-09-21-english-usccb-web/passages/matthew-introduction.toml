context = "The complete introduction was read. It presents a probabilistic modern majority account: an anonymous evangelist using Mark and other traditions, writing after A.D. 70 and probably at least a decade later. Antioch in Roman Syria is offered as plausible, not certain; the inferred community includes Jewish and Gentile Christians. Its narrative overview distinguishes the journey toward Jerusalem from the controversies after arrival. These judgments concern the Greek Gospel, not a dated Aramaic predecessor."
