context = "The complete introduction was inspected for prophetic and composition chronology. It places Amos's delivery of his oracles in the Northern Kingdom during Jeroboam II's reign, dated 786-746 BC; describes the book as an anthology compiled either by Amos or by some disciples; and identifies 9:11-15 as a later appendix without assigning that appendix a date."
