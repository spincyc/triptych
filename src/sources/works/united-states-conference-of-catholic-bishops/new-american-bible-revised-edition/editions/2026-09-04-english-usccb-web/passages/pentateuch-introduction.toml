context = "The complete introduction was inspected for its bounded account of Pentateuchal composition. It reports the pre-seventeenth-century Jewish and Christian consensus of Mosaic authorship, then summarizes the modern source account: oral tradition in the Judges period (approximately 1220-1020 BC), a Yahwist writing in the late eleventh and tenth centuries, an Elohist account in the following century, combination after 722/721 BC, and Priestly recasting during the exile conventionally dated 587-539 BC or thereafter. It also preserves a more skeptical proposal that makes the Pentateuch a fourth- or third-century BC retrojection and stresses that many details remain unknowable."
verified_on = "2026-09-04"
notes = "Protected NABRE introductory prose is summarized rather than reproduced. The source presents a composite, disputed history rather than a single composition year; its reported stages and alternative must remain distinct."
