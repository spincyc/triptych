context = "The note was inspected with Nehemiah 12 and its neighboring notes. It dates Nehemiah's governorship to 445-433 BC, places Ezra at approximately 400 BC, reports Josephus's doubtful testimony placing Jaddua's death around 323 BC, and says that if the high-priest list through Johanan came from the author rather than a later scribe, it is important evidence for dating the author's work to the first decades of the fourth century BC."
verified_on = "2026-09-04"
notes = "Protected NABRE translation and note prose is summarized rather than reproduced. The first-decades-of-the-fourth-century conclusion is expressly conditional on authorship of the list; the Josephus datum is expressly qualified as doubtful."
