context = "The complete introduction was inspected for composition and narrated-history orientation. It says Judith may have been written around 100 BC and characterizes the work as historical fiction that telescopes five centuries of historical and geographical material: Nineveh's destruction in 612 BC, Nebuchadnezzar's reign in 605/604-562, the second Temple around 515, the Persian reign of Artaxerxes III in 358-338, and apparent allusions to Antiochus IV."
verified_on = "2026-09-04"
notes = "Protected NABRE introductory prose is summarized rather than reproduced. The approximately 100 BC value dates the work's composition; the other dates describe the deliberately compressed narrative background and must not be presented as the date of Judith's narrated action."
