context = "The complete introduction was inspected for prophetic and composition chronology. It identifies Micah as an eighth-century contemporary of Isaiah whose superscription places his activity under Jotham, Ahaz, and Hezekiah. It says the amount traceable to that prophet is uncertain: tradition assigns all the words to Micah, some modern scholars assign as few as three chapters, and material in chapter 7 and elsewhere reflects the sixth-century Babylonian exile or later through a complex editorial process."
verified_on = "2026-09-04"
notes = "Protected NABRE introductory prose is summarized rather than reproduced. The eighth-century horizon applies to Micah's activity; the source explicitly resists assigning the entire present book to a single period."
