context = "Wisdom 16:16-29 and the note on 16:20 were inspected in the complete chapter. The unit contrasts punishment of the oppressors with God's nourishment of Israel during the Exodus. The note connects the angelic-food expression with the Septuagint form of Psalm 78:24, the heavenly-bread passages of Exodus and the Psalms, the bread discourse of John 6:32-51, and later Christian devotion."
verified_on = "2026-08-21"
notes = "Protected NABRE translation and note prose is summarized rather than reproduced. This record supports the Exodus-manna setting and the note's Christian typological line into John 6 and later devotion. It does not by itself establish the full Catholic doctrine of the Eucharist or prove the historical origin of a later liturgical antiphon."
