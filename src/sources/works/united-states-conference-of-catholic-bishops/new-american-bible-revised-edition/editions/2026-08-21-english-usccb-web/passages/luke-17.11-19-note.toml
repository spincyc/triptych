notes = "Protected NABRE translation and note prose is summarized rather than reproduced. This record supports the bounded journey geography, Lukan-only status, Samaritan identity, thanksgiving, and faith-salvation relation. It supplies no event year, season, or named village and does not support a precise itinerary beyond the Gospel's own wording."
