context = "Luke 17:11-19 and its notes were inspected in the complete chapter. The narrative belongs to Jesus' journey toward Jerusalem and locates him through or between Samaria and Galilee without naming the village. The chapter note identifies the episode as unique to Luke and treats the Samaritan's return as a non-Jewish example of thanksgiving whose faith in Jesus is joined to salvation."
