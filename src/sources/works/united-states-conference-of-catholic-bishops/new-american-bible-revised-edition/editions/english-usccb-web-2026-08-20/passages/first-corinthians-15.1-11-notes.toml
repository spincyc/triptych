context = "The general chapter note and the notes on 15:1-11, 15:3-7, and 15:9-11 were inspected for the bounded identification of received tradition. The notes distinguish Paul's recalled common tradition from his own formulation and identify the language of 15:3-7 as drawn from older credal formulas centered on Jesus' death, burial, resurrection, appearances, and fulfillment of scripture; 15:9-11 is treated as Paul's parenthetical self-defense concerning grace, qualification, and labor."
verified_on = "2026-08-20"
notes = "Protected NABRE translation and note prose is summarized rather than reproduced. The record supports the limited judgment that Paul transmits older received formulaic material; it does not independently date that formula or reconstruct a larger pre-Pauline document. The separately registered 2026-07-28 First Corinthians introduction controls the letter's approximately AD 56 setting at Ephesus."
