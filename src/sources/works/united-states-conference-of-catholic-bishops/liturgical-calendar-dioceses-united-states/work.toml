description = "The annual calendar published by the Secretariat of Divine Worship for the dioceses of the United States of America, resolving the General Roman Calendar and the Proper Calendar for the Dioceses of the United States of America for one liturgical year. Each civil year is a distinct edition. It is a competent territorial witness to a year's resolution, not the promulgating source of the recurring proper calendar."
