context = "The September entries of the appended Spanish list headed Titulos liturgicos, Propio de los Santos, on artifact page 58, printed p. 56. The list gives the approved Spanish title of Saint Vincent de Paul, priest, against 27 September, and of Saints Andrew Kim Tae-gon, Paul Chong Ha-sang and Companions against 20 September. It is a list of titles by calendar date, not a dated entry for 2026; the English day-by-day entries nowhere name either memorial in 2026. The whole text layer was searched for Vincent, Vicente and de Paul: apart from Saint Vincent, deacon (22 and 23 January) and Saint Vincent Ferrer (5 April), this page is the only place Saint Vincent de Paul is named."
artifact_page_ranges = [[58, 58]]
notes = "Read on 2026-09-24 from the exact hash-matched artifact, fetched whole over verified TLS from its recorded location into ignored scratch space by the research stage of PC-S52-A; the bytes are not retained. Read in the extracted text layer. The earlier record titulos-liturgicos-septiembre gives artifact page 57 and printed p. 55 for the same September list; in these bytes page 57 carries June through the beginning of August and the September list stands on page 58. That record belongs to its consumer and is left unchanged; this record locates the list as read."
