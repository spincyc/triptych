context = "The numbered Miscellaneous Notes. Note 2 refers calendar makers to Chapter II of the Universal Norms for diocesan and provincial calendars; note 3 quotes Universal Norms n. 15 on the Saturday memorial of the Blessed Virgin Mary; note 4 records the 1992 Honolulu decree limiting Hawaii to two holy days of obligation; note 5 explains that Independence Day and Thanksgiving Day appear because they are inscribed in the Proper Calendar for the Dioceses of the United States of America; note 6 names the five ecclesiastical provinces that keep the Thursday Ascension and states that all others have transferred it to the following Sunday, records the 1998 notification on the Immaculate Heart, and applies the complementary norm to canon 1246 paragraph 2 to the Assumption falling on a Saturday."
