notes = "Read on 2026-09-19 in the extracted text layer of the exact hash-matched PDF, fetched whole over verified TLS from the publisher. No calendar text is transcribed beyond the citation data stated here. The whole text layer was searched for the martyrs' names; this page is the only place they occur. Corrected on 2026-09-25: the record formerly gave printed p. 55 and artifact page 57, which carry June through 5 August of the same list; the September entries stand on artifact page 58, whose printed folio is 56. Re-read that day in the text layer of a copy fetched whole over verified TLS from the recorded location and matched to the registered SHA-256; the bytes are not retained. The list's heading Titulos liturgicos stands on artifact page 54 (printed p. 52) and Propio de los Santos on artifact page 55 (printed p. 53). The same September page is also recorded as passage.united-states-conference-of-catholic-bishops.liturgical-calendar-dioceses-united-states.2026.titulos-liturgicos-septiembre-artifact-page-58; since this correction the two records agree on the page, and both are kept because each is bound by a different consumer."
