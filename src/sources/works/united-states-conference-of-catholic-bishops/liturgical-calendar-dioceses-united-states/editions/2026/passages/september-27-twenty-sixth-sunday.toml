context = "The daily entries of printed p. 39, from 24 September to 3 October 2026. The entry for 27 September gives Sunday, Twenty-Sixth Sunday in Ordinary Time, green; Ez 18:25-28 / Phil 2:1-11 or 2:1-5 / Mt 21:28-32; Lectionary (136); Psalter Week II. No second celebration and no bracketed optional memorial stands on the date. 26 September is a weekday (no. 454) with the optional memorials of Saints Cosmas and Damian and of the BVM; 28 September resumes the weekday course at no. 455; 29 September is the Feast of Saints Michael, Gabriel and Raphael (no. 647)."
