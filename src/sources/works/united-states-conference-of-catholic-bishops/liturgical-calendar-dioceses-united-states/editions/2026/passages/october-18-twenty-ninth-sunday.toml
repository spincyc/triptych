context = "The daily entries of printed p. 41 (artifact p. 43), from 15 to 25 October 2026. The entry for 18 October gives Sunday, Twenty-Ninth Sunday in Ordinary Time, green; Is 45:1, 4-6 / 1 Thes 1:1-5b / Mt 22:15-21; Lectionary (145); Psalter Week I. No second celebration and no bracketed optional memorial stands on the date. 17 October is the Memorial of Saint Ignatius of Antioch (no. 472); 19 October the United States Memorial of Saints John de Brebeuf and Isaac Jogues and Companions (no. 473); 20 to 24 October weekdays (nos. 474-478) with the bracketed optional memorials of Saint Paul of the Cross (USA), Saint John Paul II, Saint John of Capistrano, Saint Anthony Mary Claret and the BVM; 25 October the Thirtieth Sunday."
