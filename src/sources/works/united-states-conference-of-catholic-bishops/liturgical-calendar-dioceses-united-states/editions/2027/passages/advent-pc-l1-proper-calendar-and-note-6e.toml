context = "Miscellaneous note 6 e (artifact p. 9): 12 December 2027 is the Third Sunday of Advent, so the Feast of Our Lady of Guadalupe is omitted that year; she may be honoured in the homily, universal prayer and hymns, and a votive Mass may be celebrated on a nearby weekday (GIRM 376). Proper Calendar for the Dioceses of the United States (p. 11): 8 December, the Immaculate Conception, Solemnity, '(Patronal Feastday of the United States of America)'; 12 December, Our Lady of Guadalupe, Feast."
