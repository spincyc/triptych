context = "Miscellaneous note 6 a (artifact p. 8): because 8 December 2024 is the Second Sunday of Advent, the Immaculate Conception is transferred to Monday 9 December and the optional memorial of Juan Diego is omitted that year. The day entry for Monday 9 December 2024 (p. 12) gives the solemnity with '(Patronal Feastday of the United States of America)' and the readings Gn 3:9-15, 20 / Eph 1:3-6, 11-12 / Lk 1:26-38 (689), but carries no holy-day-of-obligation marking, which the same calendars print on the 8 December entry in other years."
