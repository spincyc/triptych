context = "The decree: besides Sunday, the U.S. Latin Rite holy days are 1 January (Mary, Mother of God), Thursday of the sixth week of Easter (Ascension), 15 August (Assumption), 1 November (All Saints), 8 December (the Immaculate Conception) and 25 December (the Nativity); the precept is abrogated when 1 January, 15 August or 1 November falls on a Saturday or Monday, a rule that does not reach 8 December. Confirmed by the Congregation for Bishops (Prot. N. 296/84, 4 July 1992); declared effective 1 January 1993 by the NCCB President on 17 November 1992. A subsequent action lets ecclesiastical provinces transfer the Ascension to the Seventh Sunday of Easter."
