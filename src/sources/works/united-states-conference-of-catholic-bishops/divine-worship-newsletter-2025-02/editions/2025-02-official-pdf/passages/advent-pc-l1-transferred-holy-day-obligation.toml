context = "Article 'Holy See Clarifies Mass Obligation on Transferred Holy Days' (printed pp. 5-6): reports the Dicastery for Divine Worship's Note of 23 January 2025 (Prot. n. 51/25), issued after consulting the Dicastery for Legislative Texts, that the obligation to attend Mass is not transferred with an occasionally transferred holy day (its no. 7); only the Immaculate Conception and Saint Joseph are so transferred, and in the United States Saint Joseph is not a holy day, so the Note concerns only the Immaculate Conception; since the 1969 calendar revision it has fallen on a Sunday eight times (1974, 1985, 1991, 1996, 2002, 2013, 2019, 2024), and the Committee's newsletter and/or calendar noted each time that the celebration transfers but the obligation does not; the 1992 U.S. complementary norm makes 8 December a holy day whatever the weekday but did not address transfers."
artifact_page_ranges = [[1, 2]]
verified_on = "2026-11-26"
notes = "Read in the extracted text layer of the exact acquired PDF. Restricted. Caution: under the 1969 Norm 5 (Calendarium Romanum p. 12) a solemnity on an Advent Sunday was anticipated on the Saturday, so the article's phrase that the celebration 'transfers' in every listed year is not checked for the early years."
