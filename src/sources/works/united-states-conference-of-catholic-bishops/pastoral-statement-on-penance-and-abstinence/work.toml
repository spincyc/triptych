description = "Statement issued by the National Conference of Catholic Bishops on 18 November 1966 under Paenitemini norm VI, ending the general obligation of Friday abstinence outside Lent in the United States and the obligation of vigils and Ember Days, and calling for Advent to be kept by the liturgy. Effective the first Sunday of Advent, 27 November 1966. A locus is a numbered paragraph."
