context = "Paragraph 7: the bishops 'call upon Catholics to make the Advent season, beginning with 1966, a time of meditation on the lessons taught by the liturgy and of increased participation in the liturgical rites by which the Advent mysteries are exemplified and their sanctifying effect is accomplished.'"
notes = "Paragraphs 5-6 explain that the season had lost its role of penitential preparation and that its point is better fostered through the liturgy than by the former disciplines. No Advent fast or abstinence is imposed. Short legal cell quoted from the restricted capture; current as of 2026-11-18."
