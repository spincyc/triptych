context = "The release (dated 20 August 2010) reports that the text was approved by the Holy See with a 23 June 2010 letter of the Prefect of the Congregation for Divine Worship, that U.S. adaptations were approved on 24 July, and that Cardinal Francis George, USCCB President, issued a decree of proclamation stating that the third edition 'enters into use in the dioceses of the United States of America as of the First Sunday of Advent, November 27, 2011' and that from that date no other edition may be used; the date was chosen to give publishers and parishes time to prepare."
