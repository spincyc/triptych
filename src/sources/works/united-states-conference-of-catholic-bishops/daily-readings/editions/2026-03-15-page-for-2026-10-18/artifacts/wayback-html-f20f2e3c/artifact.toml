notes = "Read the heading (Twenty-ninth Sunday in Ordinary Time), Lectionary: 145, the five locators (Isaiah 45:1, 4-6; Psalm 96:1, 3, 4-5, 7-8, 9-10 with response locator 7b; 1 Thessalonians 1:1-5b; Philippians 2:15d, 16a; Matthew 22:15-21), the four psalm strophes (the third ends with the whole of v. 8, the offering and the entry into the courts; the fourth gives v. 9 and the first and last clauses of v. 10, not the middle one) and the copyright notice. Wording described in the leaf's records, not transcribed. A third party's copy of the page as it stood seven months before the date."
