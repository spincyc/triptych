context = "The Gospel, Matthew 21:28-32, read for the order of the sons and the answer of verse 31. The father goes first to the son who refuses and afterward changes his mind and goes, and then to the other son, who assents and does not go; asked which did the father's will, the hearers answer by naming the first son. This is the order and answer of the Nova Vulgata, the Clementine and NA28, not the reversed order of Westcott-Hort or the answer naming the younger or last son that Hilary and Jerome report. The Gospel opens with an incipit naming the chief priests and elders of the people as those addressed. The page's notice identifies its text as the Lectionary for Mass for Use in the Dioceses of the United States, second typical edition."
notes = "Read on 2026-09-24. Described, not transcribed: no proclaimed text is reproduced. The printed Lectionary volume was not inspected."
