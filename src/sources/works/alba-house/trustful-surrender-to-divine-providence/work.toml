description = "The composite English devotional volume first published in 1961 by Alba House as The Secret of Peace and Happiness, reissued by St. Raphael Editions in 1978 and 1980 and from 1983 in cooperation with TAN Books under the title Trustful Surrender to Divine Providence. Its Part I is an extract from Saint-Jure's De la connaissance et de l'amour du Fils de Dieu, book 3, chapter 8; its Part II, printed under the name of Claude de la Colombière, comprises a compilation from Colombière's sermons and a further chapter whose content corresponds to Saint-Jure's exercise toward divine providence in the same chapter. The compiler is unnamed in the printed book. Loci are given as part, chapter, and numbered head as printed in the English edition."
relations = ["work.jean-baptiste-saint-jure.de-la-connaissance-et-de-lamour-du-fils-de-dieu", "work.claude-de-la-colombiere.sermons"]
