context = "The act sets the course of studies of the Roman seminary at Sant'Apollinare. Issuer evidence: the volume title PII IX PONTIFICIS MAXIMI ACTA (LF33-37) as pontificate-section heading. Dating LF20031-20035 reads: Datum Romae apud Sanctam Mariam Majorem sub Annulo Piscatoris die Ill Octobris Anno wpcccuut Pontifieatus Nostri Anno Octavo. Date note: Own dating clause die III Octobris (OCR Ill), Pontificatus Nostri Anno Octavo; the OCR year (wpcccuut) is garbled and 1853 follows from pontifical year eight. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
