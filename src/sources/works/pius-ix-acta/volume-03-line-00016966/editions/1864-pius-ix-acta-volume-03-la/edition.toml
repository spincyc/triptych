notes = "The act preaches at the canonization of the 26 Japanese martyrs and Michael de Sanctis. Issuer evidence: the volume title PII IX. — PONTIFICIS MAXIMI ACTA (LF131-135) as pontificate-section heading. Dating LF16969-16974 reads: HABITA IN SOLEMNI CANONIZATIONE SANCTORVM VIGINTI SEX MARTYRVM IN JAPONIA, ET MICHAELIS DE SANCTIS INTER MISSARVM SOLEMNIA IN BASILICA VATICANA, DIE VII] IVNII PENTECOSTES SOLEMNITATI SACRO ANNO MDCCCLXII. Date note: Edition dated caption (die VIII Iunii Pentecostes ... MDCCCLXII; OCR VII]), retained. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
