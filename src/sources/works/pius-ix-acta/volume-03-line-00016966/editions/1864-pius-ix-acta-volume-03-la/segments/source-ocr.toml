context = "The act preaches at the canonization of the 26 Japanese martyrs and Michael de Sanctis. Issuer evidence: the volume title PII IX. — PONTIFICIS MAXIMI ACTA (LF131-135) as pontificate-section heading. Dating LF16969-16974 reads: HABITA IN SOLEMNI CANONIZATIONE SANCTORVM VIGINTI SEX MARTYRVM IN JAPONIA, ET MICHAELIS DE SANCTIS INTER MISSARVM SOLEMNIA IN BASILICA VATICANA, DIE VII] IVNII PENTECOSTES SOLEMNITATI SACRO ANNO MDCCCLXII. Date note: Edition dated caption (die VIII Iunii Pentecostes ... MDCCCLXII; OCR VII]), retained. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Boundary windows were read literally at both ends (edition heading or the preceding unit's close, the act's address/protocol, its dating clause, subscriptions and the following unit's heading, roughly ten to thirty nonblank lines each side). The interior was screened mechanically for capitalised headings, protocols, dating clauses, language changes, printed page-number continuity and native WORD page/baseline order, and flagged lines were read. Selected bounds [[16969, 17002], [17004, 17045], [17047, 17081], [17086, 17125], [17127, 17163], [17165, 17181]]. No full-text image collation is claimed."
