notes = "The act reports on Spain, rejects a libel and the charge of indifferentism, and laments the Swiss civil war. Issuer evidence: the volume title PII IX PONTIFICIS MAXIMI ACTA (LF33-37) as pontificate-section heading. Dating LF2533-2534 reads: BMABITÀ IN CONSISTORIO SECRETO DIE XVII DECEMBRIS ANN] MDCCCXLVII. Date note: Edition dated caption Habita in consistorio ..., retained in the selection; it is the only printed dating of the speech. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
