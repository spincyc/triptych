context = "The act raises Rennes to a metropolitan see. Issuer evidence: PIUS EPISCOPUS SERVUS SERVORVM DEI at LF1345-1348. Dating LF1923-1926 reads: Datum Romae apud Sanctum Petrum Anno In- earnationis Dominicae Millesimo Octingentesimo Quinquagesimo Octavo, tertio Nonas Januarii, Pon- tificatus Nostri tertio decimo. Date note: Bull dated by the year of the Incarnation; between 1 January and 24 March that year and the common year can differ, so the common-style year is fixed by the printed pontifical year (Pius IX crowned 21 June 1846). III Nonas Ianuarii of Incarnation-year 1858 in pontifical year thirteen is 3 January 1859. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Boundary windows were read literally at both ends (edition heading or the preceding unit's close, the act's address/protocol, its dating clause, subscriptions and the following unit's heading, roughly ten to thirty nonblank lines each side). The interior was screened mechanically for capitalised headings, protocols, dating clauses, language changes, printed page-number continuity and native WORD page/baseline order, and flagged lines were read. Selected bounds [[1345, 1385], [1387, 1422], [1424, 1465], [1467, 1500], [1502, 1541], [1543, 1577], [1579, 1622], [1624, 1660], [1662, 1705], [1707, 1742], [1744, 1784], [1786, 1820], [1822, 1864], [1866, 1901], [1903, 1926]]. No full-text image collation is claimed."
