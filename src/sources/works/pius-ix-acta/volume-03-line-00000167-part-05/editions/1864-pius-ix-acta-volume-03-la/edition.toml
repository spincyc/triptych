notes = "The act raises Rennes to a metropolitan see. Issuer evidence: PIUS EPISCOPUS SERVUS SERVORVM DEI at LF1345-1348. Dating LF1923-1926 reads: Datum Romae apud Sanctum Petrum Anno In- earnationis Dominicae Millesimo Octingentesimo Quinquagesimo Octavo, tertio Nonas Januarii, Pon- tificatus Nostri tertio decimo. Date note: Bull dated by the year of the Incarnation; between 1 January and 24 March that year and the common year can differ, so the common-style year is fixed by the printed pontifical year (Pius IX crowned 21 June 1846). III Nonas Ianuarii of Incarnation-year 1858 in pontifical year thirteen is 3 January 1859. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
