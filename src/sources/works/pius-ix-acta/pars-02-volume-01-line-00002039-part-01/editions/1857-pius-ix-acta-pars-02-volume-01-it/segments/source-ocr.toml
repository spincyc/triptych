notes = "Review extent: Whole act LF2039–2571 (whole act read literally) with more than twenty LF of context on each side (LF2009–2038 before, LF2572–2601 after); selected bounds [[2039, 2046], [2051, 2082], [2086, 2119], [2123, 2157], [2162, 2198], [2202, 2238], [2242, 2281], [2286, 2324], [2329, 2363], [2368, 2402], [2406, 2443], [2448, 2483], [2488, 2524], [2528, 2560], [2566, 2571]]. Native DjVu XML LINE/WORD geometry of leaves 56–70 (printed pp. 52–66) aligned line for line with the OCR (exact text match on every leaf). One native page image was fetched for this act: leaf 70 (https://ia800507.us.archive.org/BookReader/BookReaderImages.php?zip=%2F13%2Fitems%2Fattidelsommopont0001vari%2Fattidelsommopont0001vari_jp2.zip&file=attidelsommopont0001vari_jp2%2Fattidelsommopont0001vari_0070.jp2&id=attidelsommopont0001vari&scale=1&rotate=0, sha256 b870cba1b2afdf966ee5a07d7c5311e111c9a24f58b65b171abc46f99bb94940). The printed page (crop x 250-1572, y 50-800) shows only: 66 / moto-proprrio, ampiamente e generalmente, ed in / ogni più valida forma e maniera deroghiamo. / Dato dal nostro palazzo apostolico al Quirinale / il 12 giugno 1847, anno primo del nostro Ponti- / ficato. / PIVS PP. IX. / [rule] / NOTIFICAZIONE. The extra OCR words come from show-through of the reverse page (mirror-image text visible in the image), not printed matter; no stamp, note or other printed text is on these lines."
