notes = "The act annuls the acts of the rebels at Bologna, Ravenna and Perugia. Issuer evidence: the volume title PII IX. — PONTIFICIS MAXIMI ACTA (LF131-135) as pontificate-section heading. Dating LF3330-3330 reads: HABITA IN CONSISTORIO SECRETO DIR 20 SvVNII MOCCCLIX. Date note: Edition dated caption Habita in consistorio ..., retained in the selection; it is the only printed dating of the speech. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
