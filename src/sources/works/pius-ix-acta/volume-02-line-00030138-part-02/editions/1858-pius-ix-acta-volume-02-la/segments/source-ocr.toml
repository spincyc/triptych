context = "The act reorganises the parishes of Senigallia. Issuer evidence: PIVS EPISCOPYS SERVTS SBBVORVM DEI at LF30618-30621. Dating LF31391-31395 reads: Datum Romae apud Sanctum Petrum Anno In¬ carnationis Dominicae, Millesimo Octingentesimo Quinquagesimo Primo, Octavo Idus Martii. Pontificatus Nostri Anno Sexto- Date note: Bull dated by the year of the Incarnation; between 1 January and 24 March that year and the common year can differ, so the common-style year is fixed by the printed pontifical year (Pius IX crowned 21 June 1846). Octavo Idus Martii of Incarnation-year 1851 in pontifical year six is 8 March 1852; the edition's note LF30609-30610 says it was first printed in 1857. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Boundary windows were read literally at both ends (edition heading or the preceding unit's close, the act's address/protocol, its dating clause, subscriptions and the following unit's heading, roughly ten to thirty nonblank lines each side). The interior was screened mechanically for capitalised headings, protocols, dating clauses, language changes, printed page-number continuity and native WORD page/baseline order, and flagged lines were read. Selected bounds [[30618, 30643], [30649, 30683], [30689, 30723], [30729, 30763], [30769, 30804], [30810, 30844], [30853, 30887], [30897, 30931], [30937, 30971], [30977, 31010], [31019, 31053], [31059, 31093], [31099, 31133], [31140, 31174], [31180, 31214], [31219, 31253], [31259, 31293], [31299, 31333], [31339, 31374], [31380, 31397]]. No full-text image collation is claimed."
