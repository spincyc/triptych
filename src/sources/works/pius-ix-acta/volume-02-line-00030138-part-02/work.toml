description = "The act reorganises the parishes of Senigallia. Issuer evidence: PIVS EPISCOPYS SERVTS SBBVORVM DEI at LF30618-30621. Dating LF31391-31395 reads: Datum Romae apud Sanctum Petrum Anno In¬ carnationis Dominicae, Millesimo Octingentesimo Quinquagesimo Primo, Octavo Idus Martii. Pontificatus Nostri Anno Sexto- Date note: Bull dated by the year of the Incarnation; between 1 January and 24 March that year and the common year can differ, so the common-style year is fixed by the printed pontifical year (Pius IX crowned 21 June 1846). Octavo Idus Martii of Incarnation-year 1851 in pontifical year six is 8 March 1852; the edition's note LF30609-30610 says it was first printed in 1857. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
