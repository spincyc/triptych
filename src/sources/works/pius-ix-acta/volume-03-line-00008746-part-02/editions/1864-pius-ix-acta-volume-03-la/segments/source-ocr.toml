context = "The act provides João Crisóstomo de Amorim Pessoa to Goa. Issuer evidence: PIUS EPISCOPUS SERVUS SERVORVM DEI at LF9161-9164. Dating LF9408-9411 reads: Datum Romae apud Sanctum Petrum anno In- carnationis Dominicae millesimo octingentesimo sexa- gesimo primo, undecimo kalendas Aprilis, Pontificatus Nostri anno decimoquinto. Date note: Bull dated by the year of the Incarnation; between 1 January and 24 March that year and the common year can differ, so the common-style year is fixed by the printed pontifical year (Pius IX crowned 21 June 1846). XI Kal. Aprilis of Incarnation-year 1861 in pontifical year fifteen is 22 March 1861 (whole native leaf 251 confirms the OCR); the brief sent with it (part-03) is dated 22 March 1861. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Boundary windows were read literally at both ends (edition heading or the preceding unit's close, the act's address/protocol, its dating clause, subscriptions and the following unit's heading, roughly ten to thirty nonblank lines each side). The interior was screened mechanically for capitalised headings, protocols, dating clauses, language changes, printed page-number continuity and native WORD page/baseline order, and flagged lines were read. Selected bounds [[9161, 9195], [9197, 9235], [9237, 9273], [9275, 9318], [9320, 9354], [9356, 9398], [9400, 9420]]. No full-text image collation is claimed."
