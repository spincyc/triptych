notes = "The act provides João Crisóstomo de Amorim Pessoa to Goa. Issuer evidence: PIUS EPISCOPUS SERVUS SERVORVM DEI at LF9161-9164. Dating LF9408-9411 reads: Datum Romae apud Sanctum Petrum anno In- carnationis Dominicae millesimo octingentesimo sexa- gesimo primo, undecimo kalendas Aprilis, Pontificatus Nostri anno decimoquinto. Date note: Bull dated by the year of the Incarnation; between 1 January and 24 March that year and the common year can differ, so the common-style year is fixed by the printed pontifical year (Pius IX crowned 21 June 1846). XI Kal. Aprilis of Incarnation-year 1861 in pontifical year fifteen is 22 March 1861 (whole native leaf 251 confirms the OCR); the brief sent with it (part-03) is dated 22 March 1861. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
