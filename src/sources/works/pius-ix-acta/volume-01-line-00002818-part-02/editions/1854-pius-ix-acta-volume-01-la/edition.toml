notes = "The act refuses war against Austria and repudiates seditious use of his name. Issuer evidence: the volume title PII IX PONTIFICIS MAXIMI ACTA (LF33-37) as pontificate-section heading. Dating LF3345-3346 reads: HABITA IN CONSISTORIO SECRETO DIE XXIX APRILIS ANNI MDCCCXLVIII. Date note: Edition dated caption Habita in consistorio ..., retained in the selection; it is the only printed dating of the speech. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
