notes = "The act announces the restored Latin patriarchate and appoints Valerga patriarch of Jerusalem. Issuer evidence: the volume title PII IX PONTIFICIS MAXIMI ACTA (LF33-37) as pontificate-section heading. Dating LF2339-2340 reads: HABITA IN COXSSISTORIO SECRETO DIE iV OCTOBRIS ANNI NDCCCXL VIL. Date note: Edition dated caption Habita in consistorio ..., retained in the selection; it is the only printed dating of the speech. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
