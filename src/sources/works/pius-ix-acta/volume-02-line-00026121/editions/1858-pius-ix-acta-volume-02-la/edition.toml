notes = "The act protests the violation of the Spanish concordat and laments Switzerland. Issuer evidence: the volume title PII IX PONTIFICIS MAXIMI ACTA (LF154-158) as pontificate-section heading. Dating LF26123-26124 reads: HABITA IN CONSISTORIO SECRETO DIB XXTI. 1TLH MDCCCLY. Date note: Edition dated caption Habita in consistorio ..., retained in the selection; it is the only printed dating of the speech. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
