context = "Motu proprio di Portici ai suoi amatissimi sudditi sul Consiglio di Stato, la Consulta per la finanza, i consigli provinciali e comunali e l’amnistia, 12 settembre 1849: a papal act of Pius IX in the first person plural with papal subscription LF11761–11761 “PIVS PP. IX.” and dating clause LF11757–11759. Complete printed witness LF11579–11761; 7 furniture/noise lines omitted. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
notes = "Review extent: Whole act LF11579–11761 (whole act read literally) with more than twenty LF of context on each side (LF11549–11578 before, LF11762–11791 after); selected bounds [[11579, 11609], [11613, 11650], [11655, 11690], [11701, 11734], [11741, 11761]]. Native DjVu XML LINE/WORD geometry of leaves 290–294 (printed pp. 286–290) aligned line for line with the OCR (exact text match on every leaf). One native page image was fetched for this act: leaf 292 (https://ia800507.us.archive.org/BookReader/BookReaderImages.php?zip=%2F13%2Fitems%2Fattidelsommopont0001vari%2Fattidelsommopont0001vari_jp2.zip&file=attidelsommopont0001vari_jp2%2Fattidelsommopont0001vari_0292.jp2&id=attidelsommopont0001vari&scale=1&rotate=0, sha256 9227584833612b19da50ad8e29c1f08c8d304b869e12acc8c276c1adcedcbd62). The printed page (crop x 250-1550, y 1400-2300) ends the text block with “dalla legge.”; nothing is printed below it. Mirror-image show-through from the reverse page covers the lower half of the page; LF11693 and LF11696 and the stray words inside LF11677–11690 (e.g. “sa di wee” for printed “sù di quelle”, “Riroo”, “S104 Y”, “eT aL”) are OCR readings of that show-through or misreadings, not printed text."
