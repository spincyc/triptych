notes = "The act extends the French concordat to Savoy and Nice. Issuer evidence: PIVS PAPA IX. at LF8601. Dating LF8740-8742 reads: missis peramanter impertimus. Datum Romae apud S. Petrum die 81 Decembris anno 1860. Pontifi- catus Nostri Anno Decimoquinto Date note: Own dating clause; the OCR day reads 81, a misprint/misread of 31 (the only reading compatible with Decembris); index p.216 dates it 31 decembr. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
