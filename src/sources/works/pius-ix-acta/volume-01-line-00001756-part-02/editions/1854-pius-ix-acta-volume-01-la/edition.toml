notes = "The act transmits the encyclical on the regulars to the local ordinaries and asks for harmony of secular and regular clergy. Issuer evidence: PIVS PAPA IX. at LF2048. Dating LF2093-2095 reads: Datum Romae apud S. Mariam din die XVII Junii Ànno TUUM Pontificatus Nostri Anno Primo. Date note: Own dating clause die XVII Iunii, Pontificatus Nostri Anno Primo; the OCR year (TUUM) is garbled and the year 1847 follows from pontifical year one. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
