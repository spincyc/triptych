notes = "The act denounces the Piedmontese invasion and the principle of non-intervention. Issuer evidence: the volume title PII IX. — PONTIFICIS MAXIMI ACTA (LF131-135) as pontificate-section heading. Dating LF7190-7190 reads: HABITA fN ‘CONCISTORO SECRETO DIE XXVI SEPPTENBRIS MBCECLI. Date note: Edition dated caption Habita in consistorio ..., retained in the selection; it is the only printed dating of the speech. OCR prints XXVI; Whole native page image (see validation native_page_images) read where the OCR numeral is garbled; the OCR literal is unchanged. (leaf 192: DIE XXVIII SEPTEMBRIS MDCCCLX). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
