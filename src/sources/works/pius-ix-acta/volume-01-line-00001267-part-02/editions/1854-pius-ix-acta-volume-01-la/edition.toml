notes = "The act publishes Bofondi, reserved in pectore, and creates three further cardinals. Issuer evidence: the volume title PII IX PONTIFICIS MAXIMI ACTA (LF33-37) as pontificate-section heading. Dating LF1479-1480 reads: WAEITA 1* CON-ISToR;IO sECRETO Dire XI ivl ANS EDCCCXLV LL. Date note: Edition dated caption Habita in consistorio ..., retained in the selection; it is the only printed dating of the speech. The OCR caption is garbled (Dire XI ivl); Whole native page image (see validation native_page_images) read where the OCR numeral is garbled; the OCR literal is unchanged. (leaf 44: DIE XI IVNII ANNI MDCCCXLVII). Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
