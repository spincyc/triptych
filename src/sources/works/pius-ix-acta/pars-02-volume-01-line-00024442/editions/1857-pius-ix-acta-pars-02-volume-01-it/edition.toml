notes = "Motu proprio sulla Commissione degli Ospedali di Roma, 25 agosto 1850: a papal act of Pius IX in the first person plural with papal subscription LF24916–24916 “PIVS PP. IX.” and dating clause LF24911–24913. Complete printed witness LF24441–24916; 12 furniture/noise lines omitted. The candidate frame begins at MOTO-PROPRIO LF24442; the act’s printed intitulation PIVS PAPA IX. LF24441 is the last line of the preceding frame (LF24376–24441) and is selected here, so the reader begins with it. Exact source extent and surrounding boundaries were inspected as uncorrected OCR; no complete print-image collation or historical authentication is claimed."
