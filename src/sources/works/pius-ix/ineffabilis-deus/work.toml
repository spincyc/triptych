description = "The apostolic constitution of 8 December 1854 by which Pius IX solemnly defined the Immaculate Conception of the Blessed Virgin Mary. The Latin original was published in Pii IX Pontificis Maximi Acta, part I, vol. 1; the definition sentence is Denzinger-Schoenmetzer 2803 (older numbering 1641). The constitution has no official numbered-paragraph locus system; editions record the section or sentence cited."
