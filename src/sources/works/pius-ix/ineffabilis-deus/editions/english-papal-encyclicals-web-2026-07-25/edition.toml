notes = "A dated delivery state of the widely circulated English translation (also mirrored at EWTN and the New Advent library). The page names no translator and states no translation-specific rights; the translation's origin remains unidentified and its rights status unresolved, so consumers quote it only within ordinary scholarly limits with attribution. The Vatican web English page for the constitution was checked the same day and contained only a title shell without body text; the underlying Latin original of 1854 is public domain."
