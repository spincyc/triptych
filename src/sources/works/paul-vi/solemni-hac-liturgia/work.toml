description = "The profession of faith Paul VI pronounced on 30 June 1968 at the close of the Year of Faith, in thirty numbered paragraphs. It is a solemn papal profession rather than a definition of new doctrine; the Catechism cites it by the abbreviation CPG. Paragraph 12 states that those who have refused the love and piety of God to the end go to the fire that is not extinguished."
