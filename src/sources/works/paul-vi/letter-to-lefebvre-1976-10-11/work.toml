description = "Paul VI's letter of 11 October 1976 to Marcel Lefebvre, Archbishop-Bishop formerly of Tulle, following the audience of 11 September 1976 at Castel Gandolfo and Lefebvre's reply of 16 September. It sets out the Roman terms in three sections: an analysis of the addressee's position and of the notion of Tradition; a refusal of his requests concerning the Tridentine Mass and his seminaries; and the required declaration of adherence to the Second Vatican Council and its documents understood in their obvious sense, to the post-conciliar decisions including the reformed Ordo Missae, and to the canon law then in force, together with the demand that he commit the direction of his works and seminaries to the Holy See. It records that the pope cannot revoke the juridical suppression of the Priestly Society of Saint Pius X, refers to the judgment of the Commission of Cardinals of 6 May 1975 and to Lefebvre's declaration of 21 November 1974, and states that the suspension a divinis will remain unless the declaration is made."
