context = "The complete letter was read, including: the audience of 11 September 1976 at Castel Gandolfo and the month of waiting; the quotation of Lefebvre's letter of 16 September 1976; the reproach of distrust toward the Apostolic See, quoted as 'Romam ad neo-modernismum et neo-protestantismum proclivem'; the statement that ordinations were conferred 'sine litteris dimissoriis et contra apertum vetitum Nostrum'; the repeated references to the suspension a divinis already incurred; the six requirements of the declaration of adherence in section III A; and section III B, with the refusal to revoke the 'iuridicam suppressionem Fraternitatis sacerdotalis Sancti Pii X', the reference to 'Nostra Commissio Cardinalium die VI mensis Maii MCMLXXV' judging that no priestly formation congruent with the Church's needs could be built on the foundation of the declaration of 21 November 1974, the demand that the direction of the works and above all the seminaries be committed to the Holy See, and the mention of canons 985, 7 and 2374 of the Code then in force."
verified_on = "2026-07-25"
notes = "Read in the exact fetched response; no comparison with a printed witness is claimed."
