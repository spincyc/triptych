description = "Paul VI's personal letter of 15 August 1976, written from Castel Gandolfo, asking Archbishop Lefebvre to weigh before God and the Church the untenable irregularity of his position, which arrogates the right to declare that the papal apostolic ministry departs from the rule of faith and to judge unacceptable the teaching of an ecumenical council celebrated in perfect observance of ecclesiastical norms, and appealing to him to have the humility and courage to break the illogical chain making him a stranger and hostile to the Church."
