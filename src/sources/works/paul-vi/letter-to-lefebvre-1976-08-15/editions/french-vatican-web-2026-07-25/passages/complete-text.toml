context = "The complete letter was read: the Assumption-day greeting; the request to consider before the Lord and the Church, in the silence and responsibility of his episcopal conscience, 'l'insoutenable irregularite de votre position presente'; the charge that the position arrogates the right to declare the papal apostolic ministry to depart from the rule of faith and to judge unacceptable the teaching of an ecumenical council celebrated in perfect observance of ecclesiastical norms; the warning that persisting would gravely harm him and those following him in disobedience to canonical law; the appeal 'Ayez l'humilite, Frere, et le courage de rompre la chaine illogique qui vous rend etranger et hostile a l'Eglise'; and the subscription 'Castelgandolfo, 15 aout 1976. PAULUS PP. VI'."
