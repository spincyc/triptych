notes = "THIS EDITION CLOSES A PAIRING GAP. Until it was added this work was held in this library in English only, in the Henderson 1910 translation, and a question about Benedict's own wording could not be settled on the witness this library held. The page's own banner dates the Rule to 540 and names no modern editor for the Latin, so this is a web witness of the received text and not a critical edition; consumers needing a critical text must use the Corpus Christianorum or Sources Chretiennes edition, neither of which was consulted. Chapter headings are the page's own and are kept in the derived text because they carry the Rule's chapter titles."
