description = "Edmundo O'Gorman's monograph on the origin of the image and cult of Our Lady of Guadalupe at Tepeyac, published by the Instituto de Investigaciones Históricas of the Universidad Nacional Autónoma de México in the Serie Historia Novohispana (no. 36). It reconstructs the origin of the cult in 1555-1556, analyses the Información de 1556 and its procedural character in detail, argues that the Nican mopohua is Antonio Valeriano's literary composition rather than a record of events, and supplies in its seventh appendix a documented chronology of the discovery, suppression and nineteenth-century publication of the Información de 1556. It is a strongly anti-apparitionist work and is used as such. Loci are its parts, chapters and numbered appendices."
