id = "work.basil-of-caesarea.homiliae-in-hexaemeron"
title = "Homiliae in Hexaemeron"
responsible = "Basil of Caesarea"
work_type = "patristic-homily-series"
composed = "378"
composed_basis = "Delivered at Caesarea in Lent 378, two years before Basil's death. The date is the preaching, not the fifth-century Latin of Eustathius that carries them, not Migne's 1847 printing of that, and not the 1895 English translation in the Nicene and Post-Nicene Fathers."
alternate_titles = ["Hexaemeron", "The Hexaemeron", "Nine Homilies on the Hexaemeron"]
languages = ["grc"]
locus_pattern = '(?:[1-9])(?:\.(?:[1-9]|1[0-9]))?'
description = "Basil's nine Lenten homilies on the six days of creation, delivered at Caesarea in 378. A locus is the homily and, where needed, its numbered section. The series expounds Genesis 1:1 to 1:26 and stops there: the ninth homily breaks off before the creation of man, and the work has no extent past that verse. The record exists so that a fragment translated inside a Nicene and Post-Nicene Fathers volume can name Basil as its author rather than the volume's editors."
