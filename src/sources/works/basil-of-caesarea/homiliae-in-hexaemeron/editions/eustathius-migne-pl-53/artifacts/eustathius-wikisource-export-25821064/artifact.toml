notes = "The page carries the Corpus Corporum encoding note, which records that the file was encoded in TEI XML for the University of Zurich's Corpus Corporum project by Ph. Roelli in 2013 from Migne's Patrologia Latina tomus 53. That is the encoder's statement about the file and is not part of Migne; the transformation below removes it."
