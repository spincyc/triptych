rights_basis = "Eustathius's Latin version is of the fifth century and Migne's printing is of 1847, so the text beneath these bytes is in the public domain everywhere. The bytes themselves are the wiki source of a Latin Wikisource transcription, and Latin Wikisource contributions are licensed CC BY-SA 4.0 — a condition on the contributors' markup rather than on Migne's text under it. The exact bytes are therefore hashed and recorded but not retained here, and only the printed Latin reaches the tracked derivative, stripped of every template, link, heading and column marker the contributors and the encoder added."
rights_jurisdiction = "United States"
source_url = "https://la.wikisource.org/wiki/Special:Export"
provenance = "Retrieved 2026-08-01 in one request, by POSTing the page list to Latin Wikisource's Special:Export with curonly=1, so the whole work arrived as a single document. The work occupies one wiki page and that page is the whole of it: nine books and the dedicatory letter, current revision 225334 at retrieval. No model stood anywhere in the retrieval path — the bytes were fetched with curl, hashed, and read locally, which is the rule this corpus exists under because the same corpus has already been shown to come back paraphrased when a model was asked for it verbatim. Latin Wikisource states its contributor licence through its own API as Creative Commons Attribution-Share Alike 4.0, read and hashed before any payload was kept. Wikisource is a mutable witness, so this artifact identifies a dated state of it and not a stable republication."
