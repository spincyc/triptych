rights_basis = "The Latin of Eustathius's fifth-century version as printed by Migne in 1847, in the public domain by age of both the translation and the printing. No host's markup, navigation, headings, categories or column apparatus is reproduced, and the Corpus Corporum encoding note has been removed, so nothing of the contributors' or the encoder's own work survives in these bytes."
