notes = "Keyed text, not OCR. guidance/catena.md recorded that \"the unencumbered Latin is OCR wreckage and the clean Latin is encumbered\", measuring Migne PL 34's Internet Archive text layer at roughly one corrupted word in eight. That holds of the scan and not of this corpus: Latin Wikisource carries the University of Zurich's Corpus Corporum TEI encodings of Migne, keyed rather than scanned, under a stated CC BY-SA 4.0 markup licence over a public-domain printing. This is a transcription of a web witness of the 1847 printing and not a collation against the printed column, so no passage taken from it rises above inspected."
