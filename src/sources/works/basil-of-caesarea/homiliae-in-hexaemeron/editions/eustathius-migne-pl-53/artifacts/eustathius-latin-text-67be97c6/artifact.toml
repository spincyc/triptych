derived_from = "artifact.basil-of-caesarea.homiliae-in-hexaemeron.eustathius-migne-pl-53.eustathius-wikisource-export-25821064"
transformation = "python3 scripts/migne_transcribe.py <export> --unit division --out eustathius-hexaemeron.txt, run over the exact bytes of the parent artifact. The script removes every wiki template whole by counting braces, the Patrologia Latina navigation line, the Corpus Corporum encoding note, categories, footnote bodies, comments, tags and wiki headings; unwraps links; folds typographic punctuation to ASCII; strips Migne's inline column markers; normalises to NFC; collapses runs of whitespace; and writes one LF-terminated UTF-8 line per source paragraph, prefixed by a braced book-and-chapter locator taken from the printing's own divisions."
