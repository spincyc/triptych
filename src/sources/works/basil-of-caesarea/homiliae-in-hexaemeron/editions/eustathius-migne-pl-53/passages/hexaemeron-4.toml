context = "The whole of the IV book of Eustathius's Latin version, answering Basil's IV homily, as Migne prints it in Patrologia Latina 53. Its printed title is \"De congregatione aquarum, et apparitione aridae disputatio\", which is the third day's first work. The printing subdivides no book, so the book stands here as the paragraphs the printing gives it and no finer division is claimed."
