notes = "The ancient Latin version of Basil's nine Hexaemeron homilies, made by Eustathius at the request of the deaconess Syncletica about 440, and the form in which the work reached the Latin West: Bede's own preface names Basil \"quem Eustathius interpres de Graeco fecit esse Latinum\" among the three fathers he follows. It is a separate EDITION of Basil's work and not a separate work, and not a second text on one edition. Nine books answering the nine homilies, preceded by Eustathius's dedicatory letter, which is part of the version and not of Basil. The printing is Migne's of 1847; the translation is of the fifth century and its translator died in antiquity, so nothing here is in copyright anywhere."
