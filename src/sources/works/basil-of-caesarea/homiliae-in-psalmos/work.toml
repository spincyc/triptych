description = "Basil's homilies on the Psalms. The homily on Psalm 33 expounds both halves of the Offertory of the Roman Fourteenth Sunday after Pentecost consecutively: at verse 8 the single angel of the Lord is worth a whole encamped army and 'in circuitu' is a city wall fortifying in front, guarding the rear and leaving neither flank unwatched; at verse 9 'taste and see' rests on the soul's senses being named homonymously with the body's."
