description = "The ninety-nine questions and two appendices printed after Aquinas's unfinished Tertia Pars to complete the Summa theologiae. It is a compilation, not an authorial work: the Leonine preface to the Supplement states that it was transcribed about the middle of the fourteenth century from some codex of Aquinas's commentary on the fourth book of the Sentences, and treats it as a second witness to that commentary's text rather than as a separate composition. The preface names its maker only as the Compilator, and identifies the transcribed portion as beginning at book IV, distinction 14, question 1, article 3, quaestiuncula 2. A widespread later attribution to Aquinas's socius Reginald of Piperno (died about 1290) appears in reference works and on the New Advent presentation, and cannot be reconciled with the Leonine dating without evidence this record does not have. It is registered as its own work so that its wording is never silently attributed to the Summa's author. The doctrine is Aquinas's own, from his earliest large systematic work; the arrangement, the article titles, and the text as printed are the compiler's. Questions 69-99 cover the state of souls after death, the resurrection, and the last judgment; the appendices cover limbo and purgatory. A locus is question.article.division, or appendix-N.question.article.division for the two appendices; the reserved locus 'preface' names the Leonine editors' Praefatio in Supplementum, which is editorial matter printed with this work rather than part of it."
