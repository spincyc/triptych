notes = "The inspected title specifies questions LXXXVII–XCIX and appendices, the English Dominican translators and 1922. The Internet Archive series catalog date is not used to date this volume. The Supplement is attributed to its compiler, distinct from Aquinas’s unfinished Tertia Pars, while the printed volume’s title is preserved. This is the whole offered terminal Supplement volume, not a claim to contain questions 1–86."
