publication = "New Advent web presentation of the Supplement within its Summa theologica text, in the translation of the Fathers of the English Dominican Province (the site states the second and revised edition of 1920); question pages for Supplement qq. 69, 87, 88 and for Appendix I q. 2 and Appendix II q. 1, retrieved 2026-07-25"
date = "2026-07-25"
notes = "A dated delivery state of a public-domain-era translation on a copyrighted host. The site's own editor's note prefixed to the Supplement attributes the compilation to Reginald of Piperno and to the commentary on the fourth book of the Sentences; the Leonine preface registered under this work instead dates the transcription to the middle of the fourteenth century and names no compiler, and the two attributions are not reconciled here. The translation renders the Latin 'iudicium singulare' of q. 88 a. 1 ad 1 with the later technical term 'the particular judgment'; wording-critical claims are governed by the Leonine Latin."
