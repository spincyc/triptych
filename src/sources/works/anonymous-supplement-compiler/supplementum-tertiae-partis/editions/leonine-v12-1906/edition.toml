notes = "The Leonine critical text of the Supplement, printed with its own pagination after Tertia Pars qq. 60-90 in Leonine volume 12 and preceded by the editors' Praefatio in Supplementum. The preface states the editorial judgment that governs every use of this text: the Supplement was transcribed in the middle of the fourteenth century from a codex of the commentary on the fourth book of the Sentences, so it is a second witness to that commentary rather than an independent work. The Leonine editors accordingly established the Supplement and the commentary against each other. Marginal apparatus, article-title rubrics, and parallel-place citations are the editors'."
