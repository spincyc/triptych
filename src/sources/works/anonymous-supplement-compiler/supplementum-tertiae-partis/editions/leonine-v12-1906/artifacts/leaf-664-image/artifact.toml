notes = "Printed p. 205 of the Supplement, running head 'QUAESTIO LXXXVIII, ARTICULUS II, III'. It carries the end of q. 88 a. 1 corpus with its three replies, including the reply that distinguishes the twofold judgment owed to each man and calls the first 'unum singulare, quod de eo fiet post mortem'; the marginal apparatus cites 2 Cor 5:10. Articles 2 and 3 follow with their own parallel-place rubrics, and article 2's corpus concludes that what is said in Matthew 25 is probably to be understood as accomplished mentally and not vocally. The parallel-place rubric for article 1, which names Tertia Pars q. 59 a. 5 among its parallels, stands on the preceding page and is not shown here. Exact bytes are not retained in the repository."
