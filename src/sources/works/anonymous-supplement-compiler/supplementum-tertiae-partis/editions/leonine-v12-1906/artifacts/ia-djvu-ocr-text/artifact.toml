notes = "Uncorrected optical character recognition of the whole of Leonine volume 12, covering Tertia Pars qq. 60-90 with Cajetan's commentary and the Supplementum with its Leonine preface, indexes, and marginal apparatus. Reading errors are frequent, the two-column layout and marginal notes are interleaved out of order, and roman numerals and digits are unreliable; it is a finding aid, and every wording-critical claim in a consuming publication must be checked against a page image or a printed copy. Registered under the Supplement because the passages this repository located with it are Supplement passages. Exact bytes are not retained."
