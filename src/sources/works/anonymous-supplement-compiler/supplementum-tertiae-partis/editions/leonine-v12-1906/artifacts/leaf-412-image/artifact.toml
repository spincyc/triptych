notes = "The first page of the Leonine Praefatio in Supplementum Tertiae Partis, unnumbered and signed 'SUMMAE THEOL. D. THOMAE T. IX.' at the foot. It carries the sentence dating the compilation to the middle of the fourteenth century and describing the Supplement as a second witness to the commentary on the Sentences, and the identification of the transcribed portion as beginning at book IV, distinction 14, question 1, article 3, quaestiuncula 2. Exact bytes are not retained in the repository."
