languages = ["pt"]
description = "The pastoral letter of the Bishop of Leiria, dated 13 October 1930, closing the diocesan inquiry opened by the provisao of 3 May 1922: after reviewing the events and hearing the diocesan consultors it declares the visions of the children at the Cova da Iria, parish of Fatima, on the 13ths of May through October 1917 worthy of belief (dignas de credito) and officially permits the cult of Our Lady of Fatima. The competent positive diocesan judgment on the Fatima apparitions, retained in its historical formula under the 2024 DDF norms. Loci are free-form descriptions of the letter's parts (its original imprint carries no numbered divisions usable here)."
relations = ["work.santuario-de-fatima.dcf-selecao-1917-1930"]
