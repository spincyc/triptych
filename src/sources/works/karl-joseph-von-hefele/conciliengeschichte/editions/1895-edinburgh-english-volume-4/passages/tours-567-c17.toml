context = "Hefele's summary of canon 17 of the second Council of Tours (567) on the monks' fasts, with daily fasting in December until Christmas. Printed p. 391 (PDF p. 407), under the running head 'Synods between the years 560 and 575'."
physical_line_ranges = [[1, 6]]
text = "17. In regard to the fasts of monks the old ordinance shall continue. From Easter to Pentecost (Quinquagesima = Πεντεκοστή), with the exception of the Rogation Days, a prandium (breakfast or luncheon, before the cœna, about midday) shall be prepared daily for the monks. After Pentecost they shall fast for a week, and thenceforward, until the 1st of August, they shall fast three times a week, Monday, Wednesday, and Friday, except the sick. In August there shall be prandium daily, because there are daily Missæ Sanctorum (not de feria). In September, October, and November, again, the fasts must be three times a week, as before; but in December, until Christmas, daily. From Christmas to Epiphany there shall be daily prandium, because every day is a festival."
