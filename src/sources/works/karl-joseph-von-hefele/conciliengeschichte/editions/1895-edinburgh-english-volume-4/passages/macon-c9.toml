notes = "Read on the page images. Hefele dates the synod 581; Maassen's edition carries it under A. 583 (passage of that edition), the date discrepancy R1 flagged. Hefele's 'of each week' glosses 'sabbati' as the week; his summary does not record codex B's 'festivitate' for 'feria'. The text layer splits 'kept on Monday' across lines and reads 'Martin s'."
