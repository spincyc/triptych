context = "Hefele's introduction to the first Synod of Macon, which he dates 581, and his summary of its canon 9: the Monday-Wednesday-Friday fast from St Martin's day to Christmas, the Sacrifice in the Lenten manner, and the reading of the canons. Printed pp. 403-404 (PDF pp. 419-420)."
physical_line_ranges = [[1, 6]]
text = "We have spoken of the supposed Synod of Grado, of A.D. 579, in the history of the controversy on the three chapters (sec. 280), and therefore we now pass on to the first Synod of Macon (Matisconensis I.), which was summoned by the Frankish King Guntrum in the year 581. It was attended by twenty-one bishops from several ecclesiastical provinces, and the most distinguished were the four archbishops, Priscus of Lyons, Evantius of Vienne, Artemius of Sens, and Remedius of Bourges. The Synod occupied itself, according to the Præfatio of the minutes, partly with public affairs, partly with the care of the poor, and drew up nineteen canons:— 9. From S. Martin's Day until Christmas, a fast must be kept on Monday, Wednesday, and Friday of each week (sabbati, cf. Du Cange, s.v.). The Sacrifice must be offered after the manner of the Lenten season. The canons, too, shall be read at this time, so that no one may plead ignorance in defence of a fault."
