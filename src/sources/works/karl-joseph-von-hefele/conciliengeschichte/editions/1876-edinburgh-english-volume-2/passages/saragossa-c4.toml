notes = "Read on the page images. The sentence from Sulpicius Severus quoted between the first and second transcribed lines is omitted. Footnote markers 3, 4, 5, 6 and 1, 2 are omitted from the text lines. Hefele's '17th December' is Mansi's 'a 16. Kalendas Januarii' (passage of Mansi tomus III, coll. 634-635); his summary drops the canon's 'twenty-one days' and its list of forbidden withdrawals. The text layer reads the canon correctly."
