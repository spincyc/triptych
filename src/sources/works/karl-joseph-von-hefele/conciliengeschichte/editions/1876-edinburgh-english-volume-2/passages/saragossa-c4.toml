context = "Hefele's account of the Synod of Saragossa against the Priscillianists, its dating (Spanish era 418 = A.D. 380; Mansi argues 379) and his summary of canon 4 (daily attendance at church from 17 December to Epiphany). Printed pp. 292-293 (PDF pp. 310-311), with footnotes 6 (p. 292) and 1 (p. 293)."
physical_line_ranges = [[1, 7]]
text = "Lastly, in the same year we have to record two more Synods; one at Milan under S. Ambrose, which, however, did not treat of any general affairs, but was only for the vindication of a young Christian girl at Verona; and the somewhat more important Synod at Saragossa in Spain. Sulpicius Severus does not give the exact chronological date; but from his whole historical account this Synod must be placed somewhere about the year 380. Now, as there are to be found in the old collections of the canons eight canons of a Synod at Saragossa of October 4th, 418, of the Spanish era (380 according to our reckoning), and as these eight canons are plainly directed against the Priscillianists, it may well be supposed that they belong to the same Synod of which Sulpicius speaks. Mansi tries to show that it took place as early as 379. (4) From the 17th December to the Feast of the Epiphany every one must attend the church daily, and may not go with bare feet. Mansi, t. iii. pp. 633 sqq.; Hard. t. i. pp. 805 sq. Mansi, l.c. pp. 635 sqq."
