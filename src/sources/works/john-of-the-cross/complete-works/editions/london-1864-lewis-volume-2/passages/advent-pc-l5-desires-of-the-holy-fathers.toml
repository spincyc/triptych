text = "When the ancient Saints were waiting, Hope came down to their relief, And made lighter by its presence The sore pressure of their grief. ‘Hasten, then, Thy work, and finish; Send Him, Lord, Whom Thou wilt send,’ Was the cry of one. Another’s, ‘O that He the heavens would rend!’ ‘That I might behold His coming, And my wail be turned to mirth; Let the clouds rain down the Just One, So long desired on the earth;’"
