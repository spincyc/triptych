text = "Now at last the destined ages Their appointed course had run, When rejoicing from His chamber Issued forth the Bridegroom Son. So the feast of their espousals With solemnity was kept; But Almighty God, an Infant, In the manger moaned and wept. So the bride at her betrothal Did the bridal gifts arrange; But the Mother looked in wonder At the marvellous exchange. Man gave forth a song of gladness, God Himself a plaintive moan; Both possessing that which never Had been hitherto their own."
