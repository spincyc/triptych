description = "Nahmanides' commentary on the Pentateuch, completed in the Land of Israel in the thirteenth century. It regularly quotes Rashi and Ibn Ezra by name in order to correct them, and it carries a stratum of kabbalistic remarks flagged by formulas such as 'the enlightened will understand'. A locus is BookToken.chapter.verse."
