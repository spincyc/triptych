context = "Printed p. 29 (PDF p. 37): the Christmas aspiration headed ASPIRATION., followed by its note tying it to the feast of St. Andrew."
notes = "The book prints the prayer anonymously under 'Aspiration' and gives the fifteen-times-a-day practice as a pious belief ('It is piously believed'), not as an indulgence or a promise. Its common name, the Saint Andrew Christmas Novena, is not printed here."
physical_line_ranges = [[8, 10]]
text = "ASPIRATION. Hail and blessed be the hour and moment in which the Son of God was born of the most pure Virgin Mary at midnight in Bethlehem in the piercing cold. In that hour vouchsafe, O my God! to hear my prayer and grant my desires, through the merits of Our Saviour Jesus Christ, and of His blessed Mother. Amen. It is piously believed that whoever recites the above prayer fifteen times a day, from the feast of St. Andrew (Nov. 30) until Christmas, will obtain what is asked."
