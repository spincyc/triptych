notes = "Complete optical text of volume 1 (books I-VI, John 1-8), title page through the end of the volume; book IV chapter 2, headed 'That the Holy Body of Christ is Life-giving', is complete within it from printed p. 409. Volume 2 (books VII-XII) was not retrieved and is not needed for John 6, so any negative read off this file is bounded to John 1-8. Uncorrected optical character recognition. Not retained: the Internet Archive's own optical-character-recognition derivative, because no grant covering that derivative was established. A reader without the network cannot open this file from a checkout; the underlying printing is public domain and may be re-derived from the same Internet Archive item, and the wording a claim depends on must be quoted into the claim's own passage record. Language pairing: Cyril's Greek was not retrieved in the sweep that produced this record, so this English cannot settle a question about his wording."
