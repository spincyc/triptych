context = "The continuous exposition from John 6:51 through 6:58 was read with the chapter heading and surrounding printed page markers. Cyril identifies the bread with Christ or his flesh, grounds the flesh's life-giving power in its union with the Word, joins eating and drinking to participation and mutual indwelling, and connects the gift with resurrection. Verification is of the identified English witness and attribution, not a Greek collation."
verified_on = "2026-07-27"
notes = "Chapter 2, on John 6:51-58, spans printed pp. 408-425. The publication paraphrases this passage. The frequently circulated sentence about the manger containing not hay but Christ's life-giving Body does not occur in this controlled passage and is not attributed to Cyril."
