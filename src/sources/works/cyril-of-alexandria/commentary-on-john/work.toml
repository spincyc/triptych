description = "Cyril's commentary on the Fourth Gospel in twelve books. The Greek is incomplete: books seven and eight, covering roughly John 10 to 12, survive only in catena fragments, while book twelve covers John 18 to 21 and includes a continuous exposition of the empty-tomb narrative. A locus is the book number. Edition records keep the Greek, the Library of Fathers English, and dated web deliveries apart."
