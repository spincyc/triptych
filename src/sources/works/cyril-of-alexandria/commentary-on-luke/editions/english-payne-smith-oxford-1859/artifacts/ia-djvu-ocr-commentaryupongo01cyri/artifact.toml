notes = "Complete optical text of volume 1 (Sermons I-LXXX, Luke 1-12), preface through the end of the volume; Sermon XXXVI on Luke 7:11ff. is complete within it at printed pp. 132-135. Volume 2 (Sermons LXXXI-CLVI) was not retrieved and is not needed for this pericope, so any negative read off this file is bounded to Luke 1-12. Uncorrected optical character recognition. Not retained: the Internet Archive's own optical-character-recognition derivative, because no grant covering that derivative was established. A reader without the network cannot open this file from a checkout; the underlying printing is public domain and may be re-derived from the same Internet Archive item, and the wording a claim depends on must be quoted into the claim's own passage record. Language pairing: Payne Smith translates a Syriac version; neither that Syriac nor the surviving Greek catena fragments were retrieved in the sweep that produced this record, so this English cannot settle a question about Cyril's own wording."
