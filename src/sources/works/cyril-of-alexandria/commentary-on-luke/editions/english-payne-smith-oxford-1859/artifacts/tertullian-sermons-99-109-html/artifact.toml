notes = "Exact dated Tertullian Project delivery of sermons 99-109. Extent as measured by the retrieving lane: complete tertullian.org file for Cyril of Alexandria, Commentary on Luke, Sermons 99-109 (Luke 13:22-16:13), carrying Payne Smith's printed page numbers |461 to |516 inline; Sermons 101 and 102, the two that treat the appointed Gospel, are entire within it. The sibling delivery of sermons 110-123 registered on this same edition in July 2026 stands `remote` and `restricted` on the ground that the host's transcription was \"not assumed redistributable\"; the express public-domain dedication quoted in `rights_basis` was read off these bytes and off the site's own index page rather than assumed, which is why this artifact is retained and that one was not. The disagreement is between an assumption and a reading, and it is left visible rather than resolved by editing the older record. The host modernises the English of the 1859 printing and interleaves Payne Smith's printed page numbers as |461 to |516, so this is a checked English witness and not a facsimile."
