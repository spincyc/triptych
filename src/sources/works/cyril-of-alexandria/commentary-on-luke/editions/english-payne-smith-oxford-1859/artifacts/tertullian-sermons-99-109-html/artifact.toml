rights_basis = "The host states the basis on the page itself. The Tertullian Project's index of these files prints, over the whole collection, \"These English translations are all out of copyright, but were not included in the 38 volume collection of Ante-Nicene, Nicene and Post-Nicene Fathers. Please take copies and place online elsewhere. In some cases I have felt it necessary to add an introduction to the online text. These are all placed in the public domain also -- copy freely.\", and the foot of this very file prints \"This text was transcribed by Roger Pearse, 2008. All material on this page is in the public domain - copy freely.\" Payne Smith's 1859 translation is separately in the United States public domain by publication date. The host's transcription, its editor's own added matter and its markup are therefore covered by an express public-domain dedication in the source's own words, quoted here rather than inferred, and the file is retained."
