notes = "Complete delivery, which its own page title bounds as 'Sermons 27-38 (Luke 6:20-7:28) pp. 102-148' although the filename says 26. Sermon XXXVI, on Luke 7:11-17, is present and complete at printed pp. 132-135. Sermons 28, 30, 31 and 32 carry no heading in this delivery and were not looked for elsewhere, so the delivery is complete as to text and incomplete as to headings. The host states that its online text modernizes the public-domain translation: it is a checked English witness, not a facsimile of the 1859 printing. Not retained: the host's transcription and markup, for which no redistribution permission was established. A reader without the network cannot open this page from a checkout; the same sermon is reachable through the Internet Archive scan of the printed volume, and the wording a claim depends on must be quoted into the claim's own passage record."
