notes = "The publication uses this locus only to bound multi-collection transmission and the older historiographic correction of the Carthaginian attribution. It does not adopt every reconstruction or establish a stemma, exact modern numbering, Gennadian authorship, ritual practice, frequency, efficacy, or direct descent."
