notes = "Identified from the page image of the title page (PDF p. 9) of Internet Archive item conciliaaevimero01maas (Getty Research Institute copy, ex libris H. van Riel), read on 2026-11-18: CONCILIA / AEVI MEROVINGICI / RECENSVIT / FRIDERICVS MAASSEN / HANNOVERAE / IMPENSIS BIBLIOPOLII HAHNIANI / MDCCCLXXXXIII. The series title (PDF p. 7) reads Legum sectio III, Concilia, tomus I. Printed p. 126 = PDF p. 148 (Concilium Turonense A. 567); printed p. 157 = PDF p. 179 (Concilium Matisconense A. 583). Not held by the library's monumenta-germaniae-historica records, which do not exist; the author directory friedrich-maassen already holds his Geschichte der Quellen (Graz 1870). Councils printed here that this lane cites: Tours 567 (pp. 121 ff.) and Macon 581/583 (pp. 155 ff.)."
