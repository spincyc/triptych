notes = "Read on the page images at 150 and 300 dpi. Maassen dates the council 583 (running head); Hefele, History of the Councils IV p. 403, dates it 581 (passage of that edition). Codex B reads 'festivitate' for 'feria' and numbers the canon XI. Note 10 ties the canon to Perpetuus's order in Gregory, Historia Francorum X.31, quoting the Martinmas-to-Christmas line as Arndt prints it (MGH p. 445). Note 10 and 11 are set in italic except the quoted Gregory line, which is roman. Footnote markers 10 and 11 in the canon are omitted. Apparatus line 16 (canones, legendus, spatiale, sanctiamus) is not transcribed."
