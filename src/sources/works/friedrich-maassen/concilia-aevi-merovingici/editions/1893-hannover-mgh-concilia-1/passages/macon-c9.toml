text = "CONCILIUM MATISCONENSE A. 583. IX. Ut a feria sancti Martini usque natale Domini secunda, quarta et sexta sabbati ieiunetur et sacrificia quadragensimali debeant ordine caelebrari. In quibus diebus cannones legendos esse speciali definitione sancimus, ut nullus se fateatur per ignorantiam deliquisse. 14 IX] XI B feria] festivitate B usque ad natalem α 15 ieiunentur et sacrificium quadragesimale debito quemadmodum ordine celebrentur Crab. quadragesimali B debebunt B Idem ordo iam a Perpetuo episcopo Turonensi institutus erat his verbis: De depositione domni Martini usque natale Domini terna in septimana ieiunia. Greg. Turon. H. Fr. X, 31 (SS. Rer. Merov. I, 445). Cf. Duchesne, Origines du culte chrétien p. 275."
