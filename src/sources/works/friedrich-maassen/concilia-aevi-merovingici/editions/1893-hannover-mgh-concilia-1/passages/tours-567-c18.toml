context = "Second Council of Tours (567), canon XVIII in Maassen's numbering (XVII in the older editions, Hefele's c. 17): the monks' fasts through the year, ending 'de Decembre usque natale Domini omni die ieiunent'. Printed p. 126, ll. 20-26 (PDF p. 148), with the apparatus to ll. 25-26; the canon continues to p. 127."
physical_line_ranges = [[1, 5]]
text = "XVIII. (XVII.) De ieiuniis vero antiqua a monachis instituta conserventur, ut de pascha usque quinquagessima excepto rogationes omne die fratribus prandium praeparetur; post quinquagessima tota ebdomada ex asse ieiunent. Postea usque kalendas Agusti ter septimana ieiunent: secunda, quarta et sexta die excepto his, qui aliqua infirmitate constricti sunt. Augusto, quia cotidie missae sanctorum sunt, prandium habeant; Septembro toto et Octobro et Novembro, sicut prius dictum est, ter in septimana, de Decembre usque natale Domini omni die ieiunent. 25 septembrio B, in Septembri edd. et octobro scripsimus, Octobri Sur. Sirm., om. α novembrio B, Novembri edd. 26 decembrio B, Decembri edd. natalem Crab. Sur. utroque loco"
