notes = "Read on the page image. Spellings (quinquagessima, ebdomada, Agusti, Septembro, Octobro, Decembre) are the edition's, following the manuscripts. Footnote marker 4 (at 'statuerunt', l. 28) lies outside the extent. In the apparatus, 'et octobro scripsimus ... om. α' means 'et Octobro' is Maassen's restoration and his manuscript family α omits October. The text layer reads 'Decembre' correctly but garbles the apparatus ('ag us', 'Xo-vrmbri')."
