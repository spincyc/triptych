description = "Maassen's critical edition of the acts and canons of the Gallic councils of the Merovingian period (511-695), cited by page and line. A container witness: each council printed in it is a work of its own. Registered first for the second Council of Tours (567), canon XVIII (XVII), on the monks' fasts, and the first Council of Macon, canon IX, on the Monday-Wednesday-Friday fast from St Martin's day to Christmas."
