notes = "Holding: Biblioteca Foral de Bizkaia, INC-35, digital item 20.500.11938/69046, b1116962x. Complete offered PDF has 658 pages, including a modern copy-description card at page 1. That card explicitly reports missing two leaves of the first gathering, the whole gathering signed Z, leaf C-6 and one leaf of third-numeration gathering D. Physical completeness is therefore not claimed. Direct image inspection: card 1, arms 3, local-use instruction 14, incipit 19, Mass preparation 329, colophon 656. Calendar pages 5–12 were located only through the raw text layer and are not independently collated."
