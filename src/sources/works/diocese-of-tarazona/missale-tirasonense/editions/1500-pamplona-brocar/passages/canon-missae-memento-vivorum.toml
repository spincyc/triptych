notes = "Direct reading from 220-dpi rendered PNG images of Tarazona 1500 PDF pp. 350-354. UTF-8 NFC, LF line endings. Standard 1500 Gothic Latin abbreviations expanded silently to reading forms (nasal macrons, -q3 -> -que, -3/-z -> -m/-us in cenatuz/enĩ3/peccatoru3/cuz/aliquaz/societatez/Panez/tuuz, -b9/-9 -> -bus/-us, Tironian ⁊ -> et, ꝝ -> -rum, p̃/ꝓ -> per/pro, oꝑs -> omnipotens, q̃sumus -> quesumus, dñs/dñi/dñm/dñe -> dominus/domini/dominum/domine, nr̃o/nr̃m -> nostro/nostrum, xꝑi/xꝑm -> christi/christum, oẽs -> omnes, Oȓo. -> Oratio., sctĩ/sãcta/sacrosc̃tm -> sancti/sancta/sacrosanctum, bñ -> bene, p̃stas -> prestas, ĩpo -> ipso, p̃ri -> patri, ℟ -> R.). Woodcut display initial + second capital (TE, ME, CO, HA, QU, UN, SU, NO, PE) normalized to sentence case. Long s normalized to s; diagonal line-end hyphens (/) joined. Medieval Latin orthography preserved verbatim (e for ae/oe: Hec, que, celum, eterni, preclare, venie; u/v as printed (Gothic word-initial v / medial u); circunstantium; ij in Cornelij, Laurentij, filij, refrigerij; Grisogoni, Mathia, Symonis, Thadei, Sixti, misterium, propicio). Headings and action rubrics occupy their own lines; printed crosses serialized as ✠ (26 crosses total, preserving word-internal positions)."
