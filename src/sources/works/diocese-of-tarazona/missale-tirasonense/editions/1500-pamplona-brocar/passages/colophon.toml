context = "The colophon identifies the Tarazona use, mandate of Bishop Guillermus Raymundus de Moncada with the dean/chapter, and correction by Johannes Petrus Navarro assisted by Antonius de Anyo and Matheus Castante. It names Pamplona, printer Arnaldus Guillermus de Broquario, and completion on xiij February of the year 1500. This establishes publication identity and a local commissioning claim, not a separate normative promulgation or textual parent. The library’s metadata independently reports 13 February 1500."
