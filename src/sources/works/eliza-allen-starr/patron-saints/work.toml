description = "A volume of saints' lives written for Catholic youth in the United States by the Chicago writer and lecturer Eliza Allen Starr (1824-1901), copyright entered in 1871 and dedicated 'to the faithful youth of the Catholic Church in America' from St Joseph's Cottage, Chicago, on the Feast of All Saints 1869. The chapter on St Lioba, patron of teachers, contains at pp. 297-301 an account of Adele Brise of Robinsonville, Wisconsin, told to the author through an interpreter during a fundraising visit and framed as an illustration of the American teaching vocation. This is the earliest published narrative of the Champion events located by the consuming publication. Devotional, not documentary."
