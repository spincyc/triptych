notes = "The image of the title page says 1869; Internet Archive catalog date 1868 is not controlling. This is the entire offered first volume, not the eight-volume collection. The preface states that the sermons were written and preached between 1825 and 1843; their composition precedes Newman’s reception into the Catholic Church. The editor is not named on the inspected title, so no editor attribution is inferred."
