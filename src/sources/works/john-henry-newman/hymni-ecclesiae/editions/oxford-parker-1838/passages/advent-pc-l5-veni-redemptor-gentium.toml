text = "Veni Redemptor gentium, Ostende partum Virginis, Miretur omne sæculum, Talis decet partus Deum. Non ex virili semine Sed mystico spiramine Verbum Dei factum est caro, Fructusque ventris floruit. Alvus tumescit Virginis, Claustra pudoris permanent, Vexilla virtutum micant, Versatur in templo Deus. Procedens è thalamo suo, Pudoris aula regia, Geminæ gigas substantiæ Alacris ut currat viam. Egressus ejus à Patre, Regressus ejus ad Patrem, Excursus usque ad inferos, Recursus ad sedem Dei. Æqualis æterno Patri, Carnis stropheo accingere, Infirma nostri corporis Virtute firmans perpetim. Præsepe jam fulget tuum, Lumenque nox spirat novum, Quod nulla nox interpolet, Fideque jugi luceat. Deo Patri sit gloria, Ejusque soli Filio, Cum Spiritu Paraclito, Et nunc, et imperpetuum."
