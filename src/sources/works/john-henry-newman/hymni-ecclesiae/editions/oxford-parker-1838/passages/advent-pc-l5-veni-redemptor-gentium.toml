notes = "Sarum form with a Sarum doxology (Deo Patri sit gloria ...). The Ambrosian attribution is supported by the held NPNF2-10 introduction (New York 1896), which says the hymn was quoted by Pope Celestine in 430 in a sermon against the Nestorians; this record does not itself attest authorship. The modern Liturgy of the Hours uses this hymn in late Advent; that appointment is lane 3's to state."
