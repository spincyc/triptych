composed_basis = "The retrieving research lane of run efff3a6f73c1f451 records that Berno writes in the first half of the eleventh century, four centuries after the arrangements he is explaining, and that he offers a rationale rather than reporting a decision. The range records that and no more; no closer date was established from the registered bytes."
description = "Berno of Reichenau's treatise on the Mass. Chapter VI, read for this run at columns 1065-1072, asks why the compiler of the chant offices provided twenty-three Sundays between the octave of Pentecost and Advent while the arranger of the lections provided a different number -- the mechanism that produces a chant strand and a reading strand running on different schedules."
