publication = "Paris: J.-P. Migne, Patrologiae Cursus Completus, Series Latina, tomus 142. Internet Archive item patrologiaecursu0142mign. The scanned copy's imprint line reads APUD GARNIER FRATRES, EDITORES ET J.-P. MIGNE SUCCESSORES."
editors = ["Jacques-Paul Migne"]
notes = "Registered on the pattern this library already uses for a constituent of a Migne volume: the edition is the constituent as Migne prints it, and the artifacts are the Internet Archive's derivatives of the whole volume, which is the narrowest exact witness that was actually retrieved. The printing year of the scanned copy is not established and is not asserted: the Patrologia Latina volumes were reissued repeatedly and this copy's front matter, read in the retained text layer, gives the imprint line but no legible year. The imprint naming Garnier Freres as Migne's successors places the scanned copy in one of the later reissues rather than in Migne's own printing, which is worth recording because it is the one thing the front matter does settle. NO PAGE IMAGE OF THIS VOLUME WAS RETRIEVED: every Berno reading this run took is optical text only and none of it has been collated against a page."
