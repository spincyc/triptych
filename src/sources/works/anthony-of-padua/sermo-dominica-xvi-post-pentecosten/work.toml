description = "Anthony of Padua's sermon for his own Sixteenth Sunday after Pentecost, a constituent of his Sermons for Sundays and Festivals. Its Gospel is Luke 7:11-16, the raising of the widow's son at Nain, which is the Gospel the 1962 Missal appoints on the FIFTEENTH Sunday after Pentecost: Anthony's Sunday ordinals do not map onto the 1962 ones, and a citation made by matching the ordinal would name the wrong sermon."
