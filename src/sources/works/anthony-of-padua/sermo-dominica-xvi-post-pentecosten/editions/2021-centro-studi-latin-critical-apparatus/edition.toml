notes = "A complete fourteen-page delivery of the Sixteenth-Sunday sermon, with themata, numbered sections and a modern source apparatus. The Centro Studi page identifies the 2021 study files as an update to the Latin text and apparatus of the 1979 critical edition; this record does not claim an independent collation to manuscripts or to the 1979 print volumes. Language pairing: this is the work's original Latin; the Conference of Franciscan Provinces' English of Paul Spilsbury is under copyright and was not sought."
