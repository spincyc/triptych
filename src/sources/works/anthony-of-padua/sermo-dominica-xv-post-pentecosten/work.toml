description = "Anthony of Padua's sermon for his own Fifteenth Sunday after Pentecost, a constituent of his Sermons for Sundays and Festivals. Its Gospel is Matthew 6:24, not the raising at Nain: it is registered here as the control that establishes, rather than assumes, that Anthony's Sunday ordinal XV is not the 1962 Missal's Fifteenth Sunday after Pentecost."
