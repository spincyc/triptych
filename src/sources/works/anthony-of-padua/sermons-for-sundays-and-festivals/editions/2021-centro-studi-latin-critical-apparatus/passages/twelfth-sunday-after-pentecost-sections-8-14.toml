context = "Sections 8-14 sustain an exposition of Mark 7:32-35 through the heart and bodily senses, obedience and contemplation, confession and satisfaction, and the incarnate Word as healing hand. Christ's five fingers are applied to conception, nativity, preaching, miracles, and passion; saliva becomes the savor of wisdom; the sigh becomes compunction; and right speech coordinates confession with deed. Section 14 explicitly draws together the Gospel, 2 Corinthians 3:6, and the Introit's covenant petition."
