context = "Sections 15-18 expound the healed Samaritan's return, prostration, and thanksgiving. Anthony calls him Samaritanus, id est custos: he safeguards received good by attributing it to God rather than himself. Falling on his face expresses shame and humble self-knowledge; thanksgiving renders praise to the giver of every good. Anthony joins unus, Samaritanus, and alienigena to unity, humility's keeping, and evangelical poverty, then answers them with surge, vade, and fides tua te salvum fecit and closes by relating the return to the fruits of the Spirit in Galatians 5:22-23."
verified_on = "2026-08-21"
notes = "Read across all four numbered sections in the exact Centro Studi Latin PDF, including their source notes. The passage is a coherent medieval exegesis of return, humility, thanksgiving, faith, and spiritual fruit; it does not on its own establish the historical intention of a later liturgical formulary. Paraphrase the modern delivery and apparatus unless a separately lawful checked transcription is supplied."
