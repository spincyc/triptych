context = "Section 13 reads Christ's command in three ordered terms: ite signifies contrition of heart, ostendite confession of the mouth, and sacerdotibus satisfaction in works. Anthony develops the prodigal son's rising and going, the penitent's shame and ordered self-accusation, confession to priests entrusted with binding and loosing, and cleansing in contrition together with a firm purpose of confessing."
verified_on = "2026-08-21"
notes = "Read in the exact Centro Studi Latin PDF through the complete section and its source apparatus. The modern note to Anthony's sentence about cleansing in contrition says that the precise formulation does not occur in its cited Peter Lombard locus and supplies related Cassiodoran and Augustinian material; do not present the sentence as an exact Lombard quotation. The section witnesses Anthony's penitential exegesis and does not by itself replace a complete doctrinal account of the sacrament. Paraphrase the modern delivery and apparatus unless a separately lawful checked transcription is supplied."
