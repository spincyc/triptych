context = "Section 10 opens Anthony's second division with Luke 17:12-14. Allegorically, the ten lepers signify humanity's sin against the Decalogue and Christ cleanses infidelity and iniquity by the blood of redemption and the water of Baptism. Morally, the lepers signify sinners marked by five kinds and five bodily or domestic locations of leprosy, which the following sections expound as forms and manifestations of vice."
