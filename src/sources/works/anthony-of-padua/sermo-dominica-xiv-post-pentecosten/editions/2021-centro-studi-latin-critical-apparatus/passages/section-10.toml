notes = "Read in the exact Centro Studi Latin PDF with its local apparatus and the beginning of the following development. This is a verified witness to Anthony's medieval reception of Luke 17 and Leviticus 13-14, not evidence of a later missal compiler's historical intent. Paraphrase the modern delivery and apparatus unless a separately lawful checked transcription is supplied."
