description = "Gregory Palamas's nine treatises in three sets of three, composed between about 1338 and 1341 in defence of the hesychast monks of Athos against Barlaam of Calabria. The third Triad develops the distinction between the imparticipable superessential essence of God and the uncreated deifying energies in which creatures really participate, and denies that God is seen in his superessential essence either now or in the age to come. A locus is Triad.treatise.section, as III.i.29 or III.ii.8-10."
