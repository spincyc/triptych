notes = "A copyrighted twentieth-century English selection and translation, not the complete Triads: the volume prints seven thematic sections (A-G) drawn from the nine treatises, with Meyendorff's introduction and notes. It is registered because it is the only English witness this repository has reached for Palamas's own words; it is not public domain, and consumers may quote only short clauses with attribution and must not incorporate bulk text. Section and treatise numbers printed in this edition (for example III.i.29, III.ii.5) are the loci to cite. No exact artifact is registered: the copy read was an optical-character transcription of a scanned printing, which is a discovery and reading aid and not a collated witness, and consumers record that ceiling locally. The underlying fourteenth-century Greek is public domain and is a separate, unregistered edition; nothing here identifies it."
