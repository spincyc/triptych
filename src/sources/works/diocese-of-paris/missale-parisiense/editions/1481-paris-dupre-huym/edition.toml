notes = "The original colophon names Paris use, the printers, and the exact date. Publication attests this witness and does not date the first composition of its constituent prayers. The surviving copy includes additional sacramental and pastoral material after the missal. The complete offered 506-page PDF is acquired; physical-copy completeness and a complete textual collation are not established. No English translation was acquired; this registration concerns the original Latin witness."
