notes = "Direct reading from 200-dpi rendered PNG images (and tight column zooms) of Paris 1481 PDF pp. 180-182. UTF-8 NFC, LF line endings. Standard 15th-century Gothic Latin abbreviations expanded silently to reading forms (nasal macrons, -q3 -> -que, -b3 -> -bus, -9 -> -us, Tironian ⁊ -> et, ꝝ -> -rum, dñs/dñi/dñm -> dominus/domini/dominum, nr̃m/nr̃os -> nostrum/nostros, oĩbus/oĩpotẽtem -> omnibus/omnipotentem, sãctas/sctĩ -> sanctas/sancti, eĩ -> enim, ĩpm -> ipsum, p̃claram/p̃stas -> preclaram/prestas, q̃d -> quod, s3 -> sed, p̃/ꝓ -> pro, grã -> gratia, cõcedas -> concedas, ɔspectu -> conspectu). Long s normalized to s; illuminated display initials merged with word bodies (restoring faded red/pink initials visible as coloured washes); line wraps and line-end hyphens joined. Medieval Latin orthography preserved verbatim (e for ae/oe: hec, que, celum, eterni, preclare, uenie; u/v as printed (Gothic word-initial v / medial u): viuo, vero, vultu, venie, eleuatis, serui; circumastantium, Imprimis, Symonis, Mathei, Thadei, Sixti, Crisogoni, propicio, imaculatam, tereritis, Et quequot, loco refrigerii, Ignacio). Action rubrics occupy separate lines within the Canon unit they govern; red/blue crosses serialized as ✠ (25 crosses total). Chant pitches excluded."
