description = "WIPO's own table of the states party to the Berne Convention for the Protection of Literary and Artistic Works, with the date of each accession and the date it entered into force. Registered because a claim that a foreign work is protected in the United States rests on the source country being a treaty party, and that fact should be read from the depositary's table rather than recalled."
