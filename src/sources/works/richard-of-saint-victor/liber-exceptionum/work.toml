description = "Richard of Saint Victor's instructional and exegetical compilation. Its second part circulated independently as Allegoriae in Vetus et Novum Testamentum and was printed under Hugh of Saint Victor's name. Jean Châtillon's critical edition restored the work to Richard; the IRHT Bibale record expressly calls the Hugh attribution false. The Luke 17 ten-lepers chapter is pars II, liber XIV, caput 4 in Châtillon's structure, but appears as liber IV, caput 25 in the older Hugh-attributed printing. Those locators are crosswalks, not competing authorships."
