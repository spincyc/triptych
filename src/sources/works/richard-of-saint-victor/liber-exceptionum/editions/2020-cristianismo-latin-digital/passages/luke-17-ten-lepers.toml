context = "Richard reads the ten lepers as those polluted by sins against the Decalogue. Their approach to Jesus is faith; standing afar is humility; their cry is heartfelt penance; going to show themselves to the priests is vocal confession, through which the leprosy of past iniquity is healed. The nine who do not return figure those who keep the Decalogue after remission yet neglect thanksgiving; the one who returns figures the unity of the universal Church, which continually gives thanks for grace."
verified_on = "2026-08-21"
notes = "Read directly on one-based artifact PDF page 150, visible printed p. 138. The entire chapter was also read in the 1854 Migne facsimile at PL 175:823 and agrees in wording; Migne prints it under Hugh. The Herzog August Bibliothek manuscript catalog supplies the critical crosswalk to Châtillon p. 503 and attributes the witness to Richard. Because Châtillon's edition itself was not acquired, this passage verifies the older printed wording and the modern attribution/locus independently; it must not be cited as a collation of Châtillon's exact text, and it must not be attributed to Hugh."
