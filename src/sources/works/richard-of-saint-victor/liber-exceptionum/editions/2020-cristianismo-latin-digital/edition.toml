notes = "The displayed title attributes the text to 'Hugo a S. Victore'; that is retained as edition history, not accepted as work authorship. The official IRHT Bibale record identifies books I-IX and XI-XIV of the second part, transmitted under Allegoriae in Vetus et Novum Testamentum, as falsely attributed to Hugh. The ten-lepers chapter was checked against Migne, PL 175 (Paris, 1854), col. 823, in the complete Internet Archive facsimile of volume 175 (item patrologiaecurs135migngoog), but this digital edition was not collated work-wide against either Migne or Châtillon."
