notes = "Cataloged for the controlling modern attribution and locus crosswalk. No complete publicly reachable copy of this edition was acquired. The Herzog August Bibliothek's manuscript catalog identifies a thirteenth-century Richard witness and maps its ten-lepers opening to this edition at pars II, liber XIV, cap. 4, p. 503 line 4: https://diglib.hab.de/?catalog=Carmassi&db=mss&id=hbs-ds-in-45&lang=en&list=ms&mode=print (consulted 2026-08-21). Consequently this record verifies the critical locus and attribution, not Châtillon's exact wording."
