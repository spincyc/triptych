context = "Printed pp. 105-106 (PDF pp. 133-134) were read at the page images: 'Confess yourself humbly and devoutly once every week, and always, if possible, before you communicate, although your conscience should not reproach you with the guilt of mortal sin, for by confession you not only receive absolution from the venial sins you confess, but likewise strength to avoid them, light to discern them well, and grace to repair all the damage you may have sustained by them. You will also practise the virtues of humility, obedience, sincerity, charity; nay, in a word, in this one act of confession you shall exercise more virtues than in any other whatsoever.'"
verified_on = "2026-11-18"
notes = "The OCR reads 'kimibJy' for 'humbly' and 'Day' for 'nay'. Weekly confession is de Sales's counsel to Philothea, not a law of the Church. The maintainer accepted the edition as public domain in the United States on 2026-11-18."
