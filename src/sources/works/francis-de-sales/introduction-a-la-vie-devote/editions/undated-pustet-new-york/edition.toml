notes = "Read on 2026-11-18 on the page images of Internet Archive item introductiontodefran (University of North Carolina at Chapel Hill copy). Title page PDF p. 7; its verso (PDF p. 8) prints only 'Printed in U. S. A.': no date, translator, imprimatur or copyright notice was found on the leaves read. The library catalogues date the Pustet printings '[190-?]' (this item) and '[192-?]' (Toronto, item introductiontode00franuoft); neither is relied on. A Roman Catholic publisher's English, unlike the Anglican-edited Rivingtons 1876 translation registered beside it. Part II chapter XIX, Of Holy Confession, is on printed pp. 105-107 (PDF pp. 133-135). Translator not identified."
