description = "Francis de Sales's twelve-book treatise on the love of God, first published at Lyon in 1616 and addressed to the fictive reader Theotimus. Books 8 and 9 carry the Salesian account of conformity to the signified will of God and of submission to the will of good pleasure, including the distinction between resignation and holy indifference. Loci are given as book and chapter; sections and paragraph divisions vary by edition and translation."
