description = "Rupert of Deutz's twelve books on the divine offices. Book XII chapter 14 is the chapter on the Fourteenth Sunday after Pentecost, read for this run at columns 321-324: Rupert gives that Sunday the ten lepers of Luke 17 and puts Matthew 6 and 'Primum quaerite' on his Fifteenth. The composition date is not established in this registration and is therefore not recorded."
