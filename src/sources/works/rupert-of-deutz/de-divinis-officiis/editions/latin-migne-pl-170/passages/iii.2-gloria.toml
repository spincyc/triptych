context = "De divinis officiis III.2, the section 'Cur in adventu non utuntur consuetis vestibus sacris diaconus et subdiaconus', its last sentence: in Advent the Gloria in excelsis is not said and Ite missa est is omitted. 'Eamdem ob causam' refers to the preceding sentences, explaining why deacon and subdeacon do not then use their customary sacred vestments. PL 170 col. 58, right column, on leaf n34, immediately above CAPUT III."
physical_line_ranges = [[1, 1]]
text = "Eamdem ob causam, Gloria in excelsis Deo tunc non dicitur, et Ite missa est intermittitur, quia videlicet illud tempus signat, ut dictum est, quo adhuc exspectabatur gaudium pacis, et illud quod nunc usque solliciti præstolamur, consummationem nostræ salutis."
