notes = "BSB 2 Liturg. 197, bsb10496380. The original title at BSB canvas 7 explicitly dates the chapter to 1622 and publication to 1627. Internet Archive item missale-carthusiense incorrectly labels this scan 1620; that metadata is not used as a printing date. The 527-page IA PDF contains a BSB wrapper and 526 canvases. Whole-file acquisition is complete, but inspection is bounded to the title and printed pp. 203–205. These pages do not constitute a complete Ordinary or complete missal collation."
