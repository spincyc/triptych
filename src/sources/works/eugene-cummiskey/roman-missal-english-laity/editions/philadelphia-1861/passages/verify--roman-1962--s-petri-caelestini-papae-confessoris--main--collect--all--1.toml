notes = "The witness keeps the day on 21 May, not the 1962's 19 May: heading XXI. St. PETER CELESTINE, p. c., under the running head 21st and 25th May, p. 586 = leaf n594; its Kalendar (p. 770 = leaf n778) gives 19 May to St Dunstan and 21 May to Peter Celestine. Directive `All as in Mass X*. p. 482, except`; cue `Deus, qui beatum.` answers the 1962 incipit. Alignment status in the normalized evidence artifact: candidate."
