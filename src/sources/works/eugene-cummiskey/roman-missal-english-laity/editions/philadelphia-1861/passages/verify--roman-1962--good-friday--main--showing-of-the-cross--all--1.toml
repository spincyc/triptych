notes = "The 1862 prints `Ecce lignum Crucis, in quo salus mundi pependit. Chorus R. Venite adoremus.` with the same threefold repetition the 1962 keeps; the 1861 prints the Latin response `Venite adoremus` beside its own English, so the identity is visible inside the witness as well. The 1955 order moved the unveiling to three stations, which changes the ceremony and not these words. Alignment status in the normalized evidence artifact: candidate."
