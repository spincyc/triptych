notes = "Read at leaf n648 = printed p. 640, running head `11th AND 13th AUGUST`, under its own heading `XIII. Commem. of SS. HYPPOLITE, &c. mm.` Cue `Da, quaesumus.`, answering the 1962's `Da, quaesumus omnipotens Deus: ut beatorum Martyrum tuorum Hippolyti, et Cassiani veneranda solemnitas, et devotionem nobis augeat, et salutem`. The witness spells `Hyppolite and Cassian`. The last two lines of the oration are heavily inked at the right margin of this leaf; `a help to salvation` and the closing `Thro'.` were read on the image and are legible, but the integrator may wish to re-open the leaf at 400 dpi before publishing. This 1962 entry currently holds BOTH a real Collect and a Placeholder proper; this row answers the Collect. Alignment status in the normalized evidence artifact: candidate."
