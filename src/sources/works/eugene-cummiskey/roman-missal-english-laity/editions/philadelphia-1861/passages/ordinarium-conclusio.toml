context = "Printed pp. xliii-xlvi: the ablution prayers Quod ore sumpsimus and Corpus tuum Domine, the Communion antiphon and postcommunion rubric, Ite missa est, Placeat tibi sancta Trinitas, the blessing, and the last Gospel, John i. 1-14, ending 'R. Deo gratias. / R. Thanks be to God.' followed by a rule that closes the Ordinary."
verified_on = "2026-07-26"
notes = "Read visually in the page renditions for leaves n53-n56. The Ordinary ends mid-page: a thick-and-thin double rule runs across the full measure below Deo gratias on p. xlvi, and the rest of that page is blank. Corrected on 2026-07-31: this record said what follows the rule is a devotional appendix \"headed as versicles and a prayer for the sovereign\". It is not, and nothing follows the rule on p. xlvi at all. The next leaf, n57, is printed p. xlvii and is headed BEFORE, AND AT THE BENEDICTION, carrying O salutaris hostia and Tantum ergo in the same facing columns - Benediction of the Blessed Sacrament, not a prayer for the sovereign. That leaf was rendered and read to settle the point. Two consequences worth recording: the boundary of the Ordinary is the rule and not the end of a page, and the book's roman pagination does not stop at xlvi as this edition's own notes imply, but continues at least to xlvii."
