context = "Collect, Secret, and Postcommunion of Missa dominicae I post Pentecosten in the anonymous English of the 1861 Cummiskey Roman Missal, printed under the heading `I. SUNDAY AFTER PENTECOST` at printed pages 392-394. The three lines carry the transcription's `post-pentecosten-01` key in liturgical order."
physical_line_ranges = [[113, 115]]
notes = "The 1861 missal prints no separate Mass for the First Sunday after Pentecost. These three orations are printed inside its Trinity Sunday formulary as the commemoration of the Sunday, labelled `COLLECT. (Deus, in te,) of the I. Sund. after Pentecost`, `SECRET of the I. Sunday after Pentecost`, and `P. COMM. Tantis of the I. Sund. after Pentecost`, on printed pp. 392-394. The 1962 Missale Romanum prints them as a separate `MISSA DOMINICAE PRIMAE post Pentecosten` at marginal nos. 1422, 1428, and 1430, to be said on the ferias of that week, and directs `Et non fit commemoratio dominicae` in the Trinity Mass. The wording of the three orations agrees; the rubrical setting does not. Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The correspondence was checked oration by oration against the Latin of the 1962 Vatican typical edition in the CMAA facsimile (artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) using that file's embedded text layer, which is a locating and comparison aid and not a page-image collation."
