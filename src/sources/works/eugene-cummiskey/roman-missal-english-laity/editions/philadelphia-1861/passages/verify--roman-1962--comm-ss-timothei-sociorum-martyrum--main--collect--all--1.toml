notes = "Read at leaf n655 = printed p. 647, running head `22d AUGUST`, under `XXII. OCTAVE of the ASSUMPTION.` / `All as on the Feast, p. 642, with the following Commem. of SS. TIMOTHY, &c. mm.` -- the same shape the 1962 has, a commemoration on the Octave day, and the witness prints the commemoration's own three orations rather than sending them to a Common. Cue `Auxilium.`, answering the 1962's `Auxilium tuum nobis, Domine, quaesumus, placatus impende: et intercedentibus beatis Martyribus tuis Timotheo, Hippolyto, et Symphoriano, dexteram super nos tuae propitiationis extende`. The witness spells `Tymothy, Hyppolite and Symphorian`; the line break in `us un / der` is joined. Alignment status in the normalized evidence artifact: candidate."
