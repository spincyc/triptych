notes = "Read at leaf n625 = printed p. 617, running head `14th AND 15th JULY`, at the head of the page under `Commem. of SS. Nabor and Felix, mm.` -- the commemoration carried over from the 12 July Mass of St John Gaulbert, which begins on the preceding page (leaf n624 = p. 616, running head `12th JULY`) and prints no oration of the commemoration there. Cue `Praesta.` The rendering is FREE and the integrator should weigh it: the 1962 Latin is `Praesta, quaesumus Domine: ut sicut nos sanctorum Martyrum tuorum Naboris et Felicis natalitia celebranda non deserunt; ita jugiter suffragiis comitentur`, and the witness renders `natalitia celebranda non deserunt` as `we make a yearly commemoration` and `jugiter suffragiis comitentur` as `always be partakers of their intercession`, and says `these thy holy martyrs` where the Latin names Nabor and Felix. The saints are named in the heading immediately above, so nothing is supplied here that the witness does not print; but this is a paraphrase, not a close rendering, and no name has been written into it. Alignment status in the normalized evidence artifact: candidate."
