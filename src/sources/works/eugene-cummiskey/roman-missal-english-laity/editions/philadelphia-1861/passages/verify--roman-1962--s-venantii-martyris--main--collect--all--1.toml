notes = "Read at XVIII. St. VENANTIUS, m., which opens at the foot of p. 584 = leaf n592; the Collect breaks after `O God, who hast con` and completes at the head of p. 585 = leaf n593, and both leaves were read. Directive `All as in Mass III. p. 466, except`; cue `Deus, qui.` answers the 1962 incipit. The English renders ejus merita as `his virtues`; recorded as printed. Alignment status in the normalized evidence artifact: candidate."
