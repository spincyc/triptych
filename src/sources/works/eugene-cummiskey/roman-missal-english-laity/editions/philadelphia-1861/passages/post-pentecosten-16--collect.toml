notes = "Wording collated character by character against the 1861 page image on 2026-07-25, and the formulary correspondence checked against the Latin `Tua nos, quaesumus, Domine, gratia semper et praeveniat et sequatur` at marginal number 1593 of the 1962 Vatican typical edition (printed p. 397; artifact PDF p. 478). CORRECTION OF 2026-09-05: this sentence previously read \"marginal number 1575\", which was wrong. No. 1575 in that facsimile is the Gradual of the Fourteenth Sunday, `Bonum est confidere in Domino`, printed p. 396 and read at artifact PDF p. 477. The error was confined to this note: the passage\u2019s own locus, text, page, leaf and formulary correspondence were and are right, and nothing in the wording changed. The right number was established on the controlling edition\u2019s own page images by the facsimile collation recorded at src/claude/liturgy/roman-rite/1962/propers/temporal/56-sixteenth-after-pentecost/propers/verified.md, and agrees with the calendar index in the CMAA facsimile, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a. The 1861 English is a free devotional rendering, not a word-for-word translation, and is quoted as an identified historical English witness only."
