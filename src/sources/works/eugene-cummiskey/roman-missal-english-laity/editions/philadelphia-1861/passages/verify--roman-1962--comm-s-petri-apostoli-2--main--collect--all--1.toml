notes = "Two pointers reach this text. Leaf n617, printed p. 609, heads 30 June `XXX. COMMEMORATION of St. PAUL.` and rubricates `All as on January 25, p. 543`; leaf n552, printed p. 544, then prints for 25 January `Of St. PETER, Deus, qui beato, as on the Feast of his Chair at Rome, the 18th of January, p. 538.` The oration itself stands on leaf n546, printed p. 538, with the Latin cue `Deus, qui beato.` The 1962 index reprints the same three orations under 01-25 and 06-30, and this file already records them at comm-s-petri-apostoli; the English is therefore recorded twice, as at the three commemorations named in the 1962 open_collation_items. Alignment status in the normalized evidence artifact: candidate."
