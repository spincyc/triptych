notes = "The pre-1955 ELEVENTH prophecy (Deuteronomy 31, with the tract Attende coelum) is the 1962's FOURTH. The 1862 at p. 198 prints `Deus, celsitudo humilium, et fortitudo rectorum ... quod denuntiatum est in ultionem, transeat in salutem. Per Dominum etc.`, the 1962 index word for word. The 1861 prints the English under the cue `Deus celsitudo.` after the same prophecy and tract. Filed under the 1962's numbering. Alignment status in the normalized evidence artifact: candidate."
