notes = "Read on leaf n706, printed p. 698, running head `24th AND 25th NOVEMBER.`. Day heading verified: `XXIV. St. JOHN of the CROSS. c.` above `All as in Mass XIII. p. 488, except`; the whole oration stands at the head of this page. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui sanctum Joannem Confessorem tuum`. Date agrees: 24 November in both books; Kalendar p. 776 (leaf n784) `24 S. John of the Cross, c. d. Com. of S. Chrysogonus, m. 698`. RECENSION NOTE: the 1962 keeps him as a Doctor of the Church and sends the Mass to commune-doctorum-pontificis; this 1861 witness, printing before the 1926 doctorate, keeps him as a Confessor and sends the Mass to its Mass XIII (a Confessor not a Bishop). The Collect wording is unaffected -- neither text names him a Doctor -- but the surrounding formulary in this witness is NOT the 1962's. Alignment status in the normalized evidence artifact: rejected-target-identity."
