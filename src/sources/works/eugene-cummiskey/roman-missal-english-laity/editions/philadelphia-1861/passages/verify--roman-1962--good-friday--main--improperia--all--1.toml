notes = "This is the slot the sixth pass refused for want of Latin to prove the alignment against, and the 1862 supplies it: pp. 174-175 print every versicle of the Improperia in the order the 1962 index carries them, `Popule meus` through `Ego te exaltavi magna virtute`, with the Greek-and-Latin Trisagion between the first three. The 1861 gives Latin for the first two versicles and the Trisagion only, and English for the whole; read against the 1862 the English answers the 1962 Latin versicle for versicle. Transcribed from leaves n300 (p. 292), n301 (p. 293) and n302 (p. 294). The book's choral rubrics (`Two of I. Choir`, `The whole Choir`) are dropped and the refrain is written out once as `My people, &c.` exactly as the book abbreviates it. Alignment status in the normalized evidence artifact: rejected-target-identity."
