context = "Collect, Secret, and Postcommunion of Dominica secunda post Epiphaniam in the anonymous English of the 1861 Cummiskey Roman Missal, printed under the heading `II. SUNDAY AFTER EPIPHANY` at printed pages 95-97. The three lines carry the transcription's `epiph-02` key in liturgical order."
physical_line_ranges = [[38, 40]]
notes = "The 1861 missal prints no separate Mass for the Second Sunday after Epiphany. These three orations are printed inside its Mass of the Most Holy Name of Jesus as the commemoration of the Sunday, labelled `COLLECT of the Sunday`, `SECRET of the Sunday`, and `P. COMM. of the Sunday`, on printed pp. 94-97. The wording agrees with the 1962 formulary; the rubrical setting does not. Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The correspondence was checked oration by oration against the Latin of the 1962 Vatican typical edition in the CMAA facsimile (artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) using that file's embedded text layer, which is a locating and comparison aid and not a page-image collation."
