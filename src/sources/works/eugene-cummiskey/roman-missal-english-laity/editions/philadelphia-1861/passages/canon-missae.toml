context = "Printed pp. xxxiii-xlii, THE CANON OF THE MASS in facing Latin and English: Te igitur (xxxiii), the commemoration of the living and Communicantes (xxxiv), Hanc igitur and Quam oblationem (xxxv), Qui pridie and the two consecration forms (xxxvi), Unde et memores and Supra quae (xxxvii), Supplices, the commemoration of the dead and Nobis quoque (xxxviii), Per quem, Per ipsum and the Pater noster (xxxix), Libera nos and the fraction (xl), the Agnus Dei and the three prayers before Communion (xli), and Domine non sum dignus with the Communion of priest and people (xlii)."
verified_on = "2026-07-26"
notes = "Read visually in the page renditions for leaves n43-n52. Decisive for collation: the 1861 Communicantes on p. xxxiv passes directly from 'Domini nostri Jesu Christi' to 'sed et beatorum Apostolorum ac Martyrum tuorum' and contains no mention of Saint Joseph, whose name was inserted only by the decree of 13 November 1962. The 1861 Pater noster prints quotidianum where the 1962 chant text prints cotidianum."
