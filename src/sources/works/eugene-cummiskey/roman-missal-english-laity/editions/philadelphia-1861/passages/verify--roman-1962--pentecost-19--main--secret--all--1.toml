notes = "Leaf n455, printed p. 447, `SECRET.` after the Offertory `Ps. cxxxvii.` of the same formulary. The book sets no Latin cue before this Secret; its identity with the 1962's `Haec munera, quaesumus, Domine, quae oculis tuae majestatis offerimus` rests on its place in the formulary and on the English rendering that prayer (`the offerings we bring before thy divine Majesty may avail to our salvation`). Read 2026-10-01 at 200 and 400 dpi in the exact registered scan PDF, re-downloaded that day and hashed to its registered SHA-256. The wording agrees with the checked derivative pentecost-19-checked-english and with temporal-orations-en."
