notes = "DATE DIVERGENCE, NOT TEXT DIVERGENCE. The witness keeps Henry on 21 JULY, not 15 July: read at leaf n631 = printed p. 623, running head `21st AND 22d JULY`, under `XXI. St. HENRY, Emperor.` / `All as in Mass XIII. Os justi, p. 488, except`. Its 15 July (leaf n625 = p. 617) is `XV. St. SWITHIN, bp. of Winchester, c.`, an English proper. The Collect cued `Deus, qui.` answers the 1962's `Deus, qui hodierna die beatum Henricum Confessorem tuum e terreni culmine imperii ad regnum aeternum transtulisti` word for word, `hodierna die` included -- which in the witness points at 21 July and in the 1962 at 15 July. The 1962's Common pointer (Confessor non Pontifex, Missa I: Os justi) is the same one the witness prints. Alignment status in the normalized evidence artifact: candidate."
