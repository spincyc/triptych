notes = "The pre-1955 FOURTH prophecy (Exodus 14, with the tract Cantemus Domino) is the 1962's SECOND, and its oration went with it. The 1862 at p. 193 prints `Deus, cujus antiqua miracula etiam nostris saeculis coruscare sentimus ... totius mundi transeat plenitudo. Per Dominum.`, the 1962 index word for word. The 1861 prints the English under the cue `Deus cujus.` after the same prophecy and the same tract. THE POSITION MOVED AND THE TEXT DID NOT: this row is filed under the 1962's numbering, not the 1861's. Alignment status in the normalized evidence artifact: candidate."
