notes = "Leaf n592, printed p. 584, heads 14 May `XIV. St. BONIFACE, m.` and rubricates `All as in Mass V. p. 470, except COLLECT. Da, quaesumus.` -- so the day prints its own Collect only, and its Secret is Mass V's. Mass V is `Protexisti`, of a Martyr in Paschal time; leaf n480, printed p. 472, prints under it `SECRET. Of a Martyr not a Bishop.` with no name in it, word for word the 1962's `Muneribus nostris, quaesumus Domine`. Boniface is a martyr and not a bishop, and 14 May falls in Paschal time, so that is the form the pointer reaches. Alignment status in the normalized evidence artifact: candidate."
