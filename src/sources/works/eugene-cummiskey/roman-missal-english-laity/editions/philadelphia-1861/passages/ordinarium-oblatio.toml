notes = "Read visually in the page renditions for leaves n30-n37. Corrected on 2026-07-31: this record declared pages 31-37, that is printed pp. xx-xxvi, while its context claimed the Orate fratres and Suscipiat, which stand at the head of p. xxvii on artifact page 38. Page 38 accordingly belonged to no passage record at all. The range now runs to 38 and the context names what stands on that page; the whole of it was read at 640 dpi in per-column halves before the range was extended. The 1861 book prints devotional matter the 1962 Ordo Missae does not contain at these places, and its Latin Creed reads expecto where the 1962 edition prints exspecto."
