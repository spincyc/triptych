notes = "Read on leaf n530, printed p. 522, running head `29th NOVEMBER.`. This is the FIRST page of the witness's Proper of Saints, which opens at 29 November with the Vigil of St Andrew; the commemoration is printed inside it as `COLLECT. Deus, qui.-Of St. SATURNINUS.`, the day's own Collect standing above it on the preceding leaf. The Latin cue `Deus, qui` answers the 1962 incipit `Deus, qui nos beati Saturnini Martyris tui`. Kalendar p. 776 (leaf n784) confirms the join: `29 Vigil of S. Andrew, Com. of S. Saturninus, m. Simple 521`. Date agrees: 29 November in both books. A small ink mark stands before `Thro'` in the closing line (`by his merits. 'Thro'.`); it is scanner or press dirt and is not reproduced. Alignment status in the normalized evidence artifact: candidate."
