context = "Collect, Secret, and Postcommunion of Dominica quinta post Epiphaniam in the anonymous English of the 1861 Cummiskey Roman Missal, printed under the heading `V. SUNDAY AFTER EPIPHANY` at printed pages 101-102. The three lines carry the transcription's `epiph-05` key in liturgical order."
