notes = "When this Sunday is omitted between the Epiphany and Septuagesima and resumed after Pentecost, the 1962 Missale Romanum reprints this same formulary after Dominica XXIII with the chants appointed for the resumed use; the Collect, Secret, and Postcommunion are unchanged, so this key remains the right address for the resumed Mass. The 1861 missal states the same rule at printed page 104: `If there be not VI. Sundays between the Epiphany and Septuagesima, what remains are omitted, and taken in between the XXIII. and the last Sunday after Pentecost.` Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The correspondence was checked oration by oration against the Latin of the 1962 Vatican typical edition in the CMAA facsimile (artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) using that file's embedded text layer, which is a locating and comparison aid and not a page-image collation."
