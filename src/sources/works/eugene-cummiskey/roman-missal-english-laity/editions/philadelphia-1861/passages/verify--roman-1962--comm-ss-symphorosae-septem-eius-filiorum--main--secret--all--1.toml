notes = "Leaf n627, printed p. 619, keeps 18 July as `XVIII. St. CAMILLUS de LELLIS, c.` and rubricates `Commem. of St. SYMPHOROSA, &c. by the Collect, &c. of Mass VIII. p. 477.` Mass VIII is `Sapientiam`, of Many Martyrs; its Secret, on leaf n487, printed p. 479, carries no name at all and answers the 1962's `Munera tibi, Domine, nostrae devotionis offerimus` word for word. Its Collect and Postcommunion do carry `N. and N.` and are ledgered untranslated. Alignment status in the normalized evidence artifact: candidate."
