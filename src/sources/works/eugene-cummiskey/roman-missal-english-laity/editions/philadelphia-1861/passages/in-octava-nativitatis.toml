context = "Collect, Secret, and Postcommunion of In octava Nativitatis Domini in the anonymous English of the 1861 Cummiskey Roman Missal, printed under the heading `THE CIRCUMCISION` at printed pages 88-89. The three lines carry the transcription's `in-octava-nativitatis` key in liturgical order."
