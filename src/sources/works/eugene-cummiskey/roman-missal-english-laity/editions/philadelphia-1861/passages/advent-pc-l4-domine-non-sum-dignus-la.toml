notes = "Inspected in the tracked TSV on 2026-11-26; the covering verified passage is passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.canon-missae. The Missal's words end anima mea where Matt. 8:8 in the Clementine Vulgate ends puer meus. In this 1861 Missal the prayer is the priest's before his own Communion; there is no Ecce Agnus Dei and no Communion of the people on this opening (row note)."
