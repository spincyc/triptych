notes = "Read on leaves n684 (printed p. 676, running head `15th AND 17th OCTOBER.`) and n685 (printed p. 677, running head `18th OCTOBER.`), where the oration runs over the page break; filed at the page where it begins. Day heading verified: `XVII. St. HEDWIGES, w.` above `All as in Mass XXI. p. 502, except`. The Latin cue the witness prints before the English is `Deus qui`, which answers the 1962 incipit `Deus, qui beatam Hedwigem`. DATE DIVERGENCE, not a text divergence: this witness keeps Hedwiges on 17 OCTOBER, where the 1962 keeps her on 16 October; its Kalendar for November/October confirms the book's own placement. The 1962 mass carries `takes_from` commune-non-virginum-2 and the witness likewise sends the day to its own Common (Mass XXI, p. 502) `except` this Collect, so both books agree that the Collect is the day's own. Alignment status in the normalized evidence artifact: candidate."
