notes = "The witness keeps the feast on 3 June, not the 1962's 29 May: heading III. St. MARY MAGDALEN of PAZZI, v., under the running head 2d, 3d, and 6th, June, p. 588 = leaf n596; its Kalendar (p. 771 = leaf n779) says the same and leaves 29 May empty. Directive `All as in Mass XIX. p. 498, except`; cue `Deus, virginitatis.` answers the 1962 incipit. Alignment status in the normalized evidence artifact: candidate."
