notes = "Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The initial correspondence check used the embedded text layer of the 1962 Vatican typical edition and did not establish page-image collation. On 2026-09-17 all three English orations were visually collated against artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-scan-pdf, whose freshly acquired SHA-256 matched 85034c90d5cbfe891f4359fb2faff907d217dbd11a30458b55e4c48eae028898. The Collect begins on printed p. 431 and finishes on p. 432, PDF pages 440-441, Internet Archive leaves n439-n440. The Secret and Postcommunion are on printed p. 433, PDF page 442, leaf n441. The TSV's ia_leaf column is zero-based and its existing locators 439 and 441 are correct; they are not PDF page numbers. The wording, historical spelling and abbreviated conclusions agree with the transcription; neither payload nor payload hash changed. Correspondence with the three 1962 orations was also checked visually at printed pp. 399-400, PDF pages 480-481, in artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, whose freshly acquired SHA-256 matched 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a. The registered scans remain remote under their existing rights records; this verification does not authorize redistribution of either scan or make the historical English an official 1962 translation."
