notes = "Read at X. St. MARGARET, Queen of Scots, under the running head 10th and 11th June, p. 590 = leaf n598. Directive `All as in Mass XXI. p. 502. except`. CUE MISMATCH IN FORM: the page prints the cue `Deus, qui beatum.` (masculine) where the 1962 Latin reads `Deus, qui beatam Margaritam`; the reading was confirmed at doubled magnification and the cue is the book's own slip or its Latin's, since the English that follows names Margaret, `blessed Margaret Queen of the Scots`, and answers the day's Latin clause for clause. Recorded as what the page prints; the integrator decides what the mismatch means. Alignment status in the normalized evidence artifact: candidate."
