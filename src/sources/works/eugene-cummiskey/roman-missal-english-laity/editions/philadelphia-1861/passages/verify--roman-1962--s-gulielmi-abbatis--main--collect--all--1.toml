notes = "The oration straddles two leaves and both were opened: it begins at leaf n610 = printed p. 602, under `XXV. St. WILLIAM, of York. ab. c.` / `All as in Mass XV. * p. 491, except` / `COLLECT. Deus, qui.--O God, who in thy`, running head `25th JUNE`, and finishes at leaf n611 = printed p. 603, running head `26th JUNE`, at `...and tread in his steps. Thro'.` DIVERGENCE OF ATTRIBUTION, NOT OF TEXT: this English recension identifies the 25 June Abbot as William of York, and the body of the prayer names him `the blessed Abbot William`; the 1962's day is S. Gulielmi Abbatis (William of Vercelli). The words answer the 1962's Latin clause for clause -- `in Sanctis tuis exemplum, et praesidium collocasti` / `hast afforded both an example and help to our weakness`, `ad terendam salutis viam` / `to walk in the road of salvation`, `ut ejusdem excipiamus suffragia, et vestigia` / `that we may feel the benefit of his suffrages, and tread in his steps`. Alignment status in the normalized evidence artifact: candidate."
