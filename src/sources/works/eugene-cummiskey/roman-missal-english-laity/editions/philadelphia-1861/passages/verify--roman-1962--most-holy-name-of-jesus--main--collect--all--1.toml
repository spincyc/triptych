notes = "The 1861 keeps this feast on the Second Sunday after Epiphany, not on the Sunday between 2 and 5 January as the 1962 does. Leaf n104, printed p. 94, heads it `II. SUNDAY after EPIPHANY. The FEAST of the HOLY NAME JESUS.` over the Introit `In nomine Jesu`, and its Kalendar at leaf n774, printed p. 766, prints `Second Sunday after Epiphany- Feast of the most Holy Name of Jesus, d. of II. class 94`. The formulary is the same one, and the Latin cue set before this English is `Deus qui`, which answers the 1962's `Deus, qui Unigenitum`. The day placement is a recension difference and not a difference of text. Alignment status in the normalized evidence artifact: candidate. Locator erratum, independently image-checked 2026-11-12 at actual 200 and 400 dpi: the complete Collect is on artifact PDF p. 106, printed p. 95, Internet Archive leaf n105. The former PDF p. 104 / leaf n103 locator instead reaches printed p. 93 and does not contain this Collect. The source English, source IDs, rights, source appointment, target relation and immutable publication payload are unchanged. The publication TSV row 57 retains its earlier leaf/PDF locator metadata as historical bytes; the corrected locator is owned by this entry and its verification passage."
