notes = "The 1861 keeps this feast on the Second Sunday after Epiphany, not on the Sunday between 2 and 5 January as the 1962 does. Leaf n104, printed p. 94, heads it `II. SUNDAY after EPIPHANY. The FEAST of the HOLY NAME JESUS.` over the Introit `In nomine Jesu`, and its Kalendar at leaf n774, printed p. 766, prints `Second Sunday after Epiphany- Feast of the most Holy Name of Jesus, d. of II. class 94`. The formulary is the same one, and the Latin cue set before this English is `Deus qui`, which answers the 1962's `Deus, qui Unigenitum`. The day placement is a recension difference and not a difference of text. Alignment status in the normalized evidence artifact: candidate."
