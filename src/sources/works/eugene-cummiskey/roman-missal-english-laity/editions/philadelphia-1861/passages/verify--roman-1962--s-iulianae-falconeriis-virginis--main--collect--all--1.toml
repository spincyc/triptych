notes = "Read at leaf n605 = printed p. 597, under `XIX. St. JULIANA de FALCONERIS, v.` with the running head `19th AND 20th JUNE`. The day is printed by reference -- `All as in Mass XIX. p. 498, except` -- and sets this Collect as its own, cued `Deus qui.`, answering the 1962's `Deus, qui beatam Julianam Virginem tuam, extremo morbo laborantem`. The witness prints NO conclusion cue after `country.` where the 1962 prints `Per eumdem Dominum`; the transcription reproduces the page and does not supply one. The day's own text is followed on the same page by a `Commem. of SS. Gervasius and Protasius`, which is not this row. Alignment status in the normalized evidence artifact: candidate."
