notes = "The 1862 prints this as the FIRST of three prayers over the new fire; the 1955 order kept this one and dropped `Domine Deus, Pater omnipotens` and `Domine sancte, Pater omnipotens` (both of which the 1861 also prints, in English, on the same page). Its text at p. 179 is the 1962 index's word for word, the only difference being that the page sets the blessing cross inside the word, `sancti + fica`, where the index writes `sanctifica`. The 1861 renders that as `bless + this new fire`. The witness's `during this paschal solemnity. we may be so inflamed` reproduces a full stop the type sets there for a comma; it is left as printed. Alignment status in the normalized evidence artifact: candidate."
