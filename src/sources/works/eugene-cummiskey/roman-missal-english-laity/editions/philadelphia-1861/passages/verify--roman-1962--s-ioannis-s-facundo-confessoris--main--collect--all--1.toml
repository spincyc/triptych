notes = "Read at leaf n600 = printed p. 592, under the day heading `XII. St. JOHN A FACUNDO, c.` with the running head `12th JUNE`. The day is printed by reference -- `All as in Mass XIII. p. 488, except` -- and then sets this Collect as its own, cued `Deus auctor`, which answers the 1962's `Deus auctor pacis, et amator caritatis`. The same page continues with a separate `COLLECT, (Sanctorum) of SS. BASILIDES, &c. mm.`, which is the commemoration and is not this row. Alignment status in the normalized evidence artifact: candidate."
