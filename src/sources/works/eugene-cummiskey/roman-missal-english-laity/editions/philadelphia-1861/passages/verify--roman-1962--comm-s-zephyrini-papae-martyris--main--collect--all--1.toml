notes = "Read at leaf n659 = printed p. 651, running head `26th AND 27th AUGUST`, under `XXVI. St. ZEPHYRINE, p. m.` / `All as in Mass II. p. 464, except`. RANK DIVERGENCE, NOT TEXT DIVERGENCE: the witness keeps 26 August as Zephyrinus's own feast, where the 1962 keeps him only as a commemoration on the day of St Joseph Calasanctius. Cue `Praesta.`, answering the 1962's `Praesta, quaesumus, omnipotens Deus: ut beati Zephyrini Martyris tui atque Pontificis, cujus gaudemus meritis, instruamur exemplis`. The witness spells `Zephyrine` and abbreviates bishop to `bp.`, and prints no comma after `bp.` This 1962 entry currently holds BOTH a real Collect and a Placeholder proper; this row answers the Collect. Alignment status in the normalized evidence artifact: candidate."
