notes = "Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The correspondence was checked oration by oration against the Latin of the 1962 Vatican typical edition in the CMAA facsimile (artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) using that file's embedded text layer, which is a locating and comparison aid and not a page-image collation."
