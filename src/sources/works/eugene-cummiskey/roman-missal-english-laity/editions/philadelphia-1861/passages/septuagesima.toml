context = "Collect, Secret, and Postcommunion of Dominica in Septuagesima in the anonymous English of the 1861 Cummiskey Roman Missal. The Collect begins under the heading `SEPTUAGESIMA SUNDAY` on leaf n114's visible printed page 101; the Secret and Postcommunion begin on printed pages 106 and 107. The three lines carry the transcription's `septuagesima` key in liturgical order."
