notes = "Read at leaf n656 = printed p. 648, running head `23d AND 24th AUGUST`, under `XXIII. St. PHILIP BENITIUS, c.` / `Al. as in Mass XIV. p. 489, except`. Cue `Deus, qui.`, answering the 1962's `Deus, qui per beatum Philippum Confessorem tuum, eximium nobis humilitatis exemplum tribuisti: da famulis tuis, prospera mundi ex ejus imitatione despicere, et coelestia semper inquirere`. The Common the witness names (its Mass XIV, p. 489) is the second Confessor-not-a-Bishop Mass, which is the same one the 1962 names (Missa II: Justus ut palma). TWO READING CAUTIONS on this leaf: the right-hand margin of the block is inked, so the terminal letters of `blessed`, `humility`, `despise` and `hearts` are damaged and were read from their remaining strokes and the sense of the line; and the oration ends `Thro'` with NO closing full stop, which is reproduced. The witness reads `has left us` where a modern editor would set `hast left us`; the page is reproduced. Alignment status in the normalized evidence artifact: candidate."
