notes = "Read on leaf n707, printed p. 699, running head `26th AND 27th NOVEMBER.`. Day heading verified: `XXVI. St. FELIX VALOIS, c.` above `All as in Mass XIV. p. 489, except`; the whole oration stands on this page, and the Proper of Saints ends four inches below it, `VOTIVE MASSES.` beginning on the same page. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui beatum Felicem Confessorem tuum`. DATE DIVERGENCE, not a text divergence: this witness keeps Felix of Valois on 26 NOVEMBER, where the 1962 keeps him on 20 November. Checked both ways on the page: leaf n703 (printed p. 695, running head `19th AND 20th NOVEMBER.`) gives 20 November to `XX. St. EDMUND, King and m.`, and the Kalendar at p. 776 (leaf n784) reads `20 S. Edmund, king and m. d. 695` and `26 S. Felix of Valois, c. d. 699`. The book is consistent with itself; it is not the 1962's calendar. Alignment status in the normalized evidence artifact: candidate."
