notes = "The longest of the fourteen and the one that took five leaves to read: n331 (p. 323), n332 (p. 324), n333 (p. 325), n334 (p. 326), n335 (p. 327). The 1862 at p. 201 prints the opening prayer `Omnipotens sempiterne Deus, adesto magnae pietatis tuae mysteriis, adesto sacramentis ...` under the heading Benedictio Fontis, word for word as the 1962 index carries it, and continues into the preface `Vere dignum et justum est ...` The 1861's English runs from that prayer through the preface, the exorcism, the blessing of the creature of water, the sinking of the paschal candle and the three oil-and-chrism formulas, in the 1962 index's order and with no clause of the index unanswered. The book's ceremonial rubrics are given in square brackets so they can be stripped; they are the book's own italic directions and not part of the prayer. TWO PRINTER'S ERRORS ARE REPRODUCED, NOT MENDED: `the word by fire` for `et saeculum per ignem` (the type reads `word`, the sense is `world`), and the run-on `Thro'--who is to come`. Alignment status in the normalized evidence artifact: candidate."
