notes = "The 1861 prints one Mass for both Chairs of St Peter. Leaf n546, printed p. 538, heads it `XVIII. St. PETER's CHAIR at ROME, &c.` and rubricates `By omitting the COMM. of St. Prisca +, this Mass serves also for his Chair at Antioch on the 22d February.`, so the 22 February commemoration of St Paul is the `Of St. PAUL` oration printed here. Latin cue `Deus, qui multitudinem.` The Kalendar at leaf n775, printed p. 767, sends 22 February to the same p. 538. Alignment status in the normalized evidence artifact: candidate."
