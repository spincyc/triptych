notes = "Read on leaf n705, printed p. 697, running head `23d NOVEMBER.`. The witness prints this commemoration inside its 23 November entry for St Clement (heading `XXIII. St. CLEMENT, p. m.` on the preceding page, leaf n704, printed p. 696), setting the oration as `Of St. FELICITAS. Praesta.` immediately after `COLLECT, Deus, qui nos, as in p. 464.`, and giving her a Secret and a P. Comm. under the same rubric further down the page. The Latin cue `Praesta` answers the 1962 incipit `Praesta, quaesumus, omnipotens Deus: ut beatae Felicitatis`. The Kalendar at p. 776 (leaf n784) confirms the join: `23 S. Clement, p. and m. d. Com. of S. Felicitas, m. 696`. Date agrees: 23 November in both books. Note the 1962 mass carries `takes_from` commune-non-virginum-1 while the witness sends the DAY to St Clement's own Mass; that difference is about the Mass this commemoration sits inside, not about this oration. Alignment status in the normalized evidence artifact: candidate."
