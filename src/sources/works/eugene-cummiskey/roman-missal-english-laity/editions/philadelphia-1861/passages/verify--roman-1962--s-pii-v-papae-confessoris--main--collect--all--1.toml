notes = "The witness keeps St Pius V on 11 May, not the 1962's 5 May: its heading is XI. St. PIUS, Pope Conf., under the running head 11th and 12th May at p. 583 = leaf n591, and its own Kalendar (p. 770 = leaf n778) says the same. Directive `All as in Mass X.* p. 482, except`; cue `Deus, qui.` answers the 1962 incipit. The clause `make us by thy grace, so diligently in all that concerneth thy service` is what the page prints, re-read at doubled magnification; the elliptical syntax is the book's own. Alignment status in the normalized evidence artifact: candidate."
