notes = "Printed inside XXV. St. ALDHELM, bp. of Salisbury, c. (25 May), p. 586 = leaf n594, under the cue line `Of St. URBAN. Da quaesumus.` The witness commemorates Urban within St Aldhelm's Mass where the 1962 sets the commemoration beside St Gregory VII on the same date; the date and the prayer are the same and the English names Urban, `thy martyr and bishop`, answering the 1962 Latin `beati Urbani Martyris tui, atque Pontificis`. The page prints no comma after `bishop`. Alignment status in the normalized evidence artifact: rejected-target-identity."
