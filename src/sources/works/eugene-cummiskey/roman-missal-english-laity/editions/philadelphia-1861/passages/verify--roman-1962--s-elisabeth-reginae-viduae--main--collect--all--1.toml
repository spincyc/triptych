notes = "Read at leaf n623 = printed p. 615, under `VIII. St. ELIZABETH, w.` / `All as in Mass XXI. p. 502, except`, running head `8th AND 10th JULY`. Cue `Clementissime.`, answering the 1962's `Clementissime Deus, qui beatam Elisabeth Reginam ... bellici furoris sedandi praerogativa decorasti`. The witness's heading styles her `w.` (widow) without the royal title the 1962 prints (Reginae, Viduae); the body of the prayer names her `blessed Elizabeth` in both. Alignment status in the normalized evidence artifact: candidate."
