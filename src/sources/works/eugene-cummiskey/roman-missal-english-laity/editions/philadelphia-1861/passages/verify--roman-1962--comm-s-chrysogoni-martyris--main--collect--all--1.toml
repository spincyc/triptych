notes = "Read on leaf n706, printed p. 698, running head `24th AND 25th NOVEMBER.`. The witness prints this commemoration under the 24 November heading `XXIV. St. JOHN of the CROSS. c.`, as `Of St. CHRYSOGONUS. Adesto.` immediately after that day's own Collect, with a Secret and a P. Comm. `Of the same` below it. The Latin cue `Adesto` answers the 1962 incipit `Adesto, Domine, supplicationibus nostris`. Kalendar p. 776 (leaf n784) confirms the join. Date agrees: 24 November in both books. PUNCTUATION AS PRINTED, FLAGGED: the page reads `Give ear, O God. to our prayers` -- a full stop, not a comma, after `God`. The mark was examined at 4x magnification on the page image and it has no comma tail, unlike `ear,` two words earlier on the same line. It is reproduced here unmended. This is exactly the class the file's `corrections` block already handles (`a full stop falling inside a clause was removed`); the integrator, not this lane, should decide whether to apply that standing rule. Alignment status in the normalized evidence artifact: candidate."
