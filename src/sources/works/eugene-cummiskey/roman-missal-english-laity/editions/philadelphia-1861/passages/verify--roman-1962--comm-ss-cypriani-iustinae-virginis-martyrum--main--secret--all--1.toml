notes = "Leaf n672, printed p. 664, heads 26 September `XXVI. SS. CYPRIAN and JUSTINA, mm.`, rubricates `All as in Mass IX. p. 479, except` a proper Collect, and then names `SECRET, (We bring) and P. Comm.(Praesta.) p. 479` -- addressing the two orations by their opening words on that page. `We bring` is Mass VIII's Secret, on leaf n487, printed p. 479, which carries no name and answers the 1962's `Munera tibi, Domine, nostrae devotionis offerimus` word for word. `Praesta` on the same page carries `N. and N.` and is ledgered untranslated. Alignment status in the normalized evidence artifact: candidate."
