notes = "Read on leaf n698, printed p. 690, running head `8th ND 9th NOVEMBER.`. The witness prints this commemoration inside its 9 November entry, whose heading is `IX. DEDICATION of our SAVIOUR'S CHURCH.` above `All as in the Anniversary Mass, p. 504.`; the oration is set immediately under it as `COLLECT. (Deus, qui.) of St. Theodore.` and is followed by `SECRET. Of the same.` for the same saint. The Latin cue `Deus, qui` answers the 1962 incipit `Deus, qui nos beati Theodori Martyris tui`. The Kalendar at p. 776 (leaf n784) confirms the join: `9 Dedication of the Church of our Saviour, d. Com. of S. Theodore 690`. Date agrees: 9 November in both books. The witness prints only the Common's Mass for the Dedication itself -- see the `untranslated` row for `dedicatione-archibasilicae-mi-salvatoris` below. Alignment status in the normalized evidence artifact: candidate."
