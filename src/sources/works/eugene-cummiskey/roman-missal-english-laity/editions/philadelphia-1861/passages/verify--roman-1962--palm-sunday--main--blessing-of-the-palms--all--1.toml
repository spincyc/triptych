notes = "The 1861 prints the English under the Latin cue `Benedic.`, the fifth of the pre-1955 blessing prayers; the 1862 prints that prayer at p. 134 word for word as the 1962 index carries it, with two differences that are stated and not mended. (1) The 1962 reads `hos palmarum (seu olivarum aut aliarum arborum) ramos` where the 1862 reads `hos palmarum seu olivarum ramos`: the 1955 order widened the parenthesis to other trees, and the 1861's `these branches of the palm-tree, or olive-tree` renders the narrower pre-1955 wording exactly and has no counterpart to `aut aliarum arborum`. (2) The 1862 concludes `Per Dominum`, the 1962 `Per Christum Dominum nostrum`; the 1861 prints the cue `Thro'.` and settles neither. Alignment status in the normalized evidence artifact: rejected-target-identity."
