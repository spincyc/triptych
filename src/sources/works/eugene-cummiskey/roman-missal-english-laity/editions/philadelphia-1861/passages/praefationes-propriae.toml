context = "Printed pp. xxix-xxxii, the proper Prefaces in facing Latin and English, following the common Preface on p. xxviii which the sibling praefatio-communis record covers. Ten in the book's own order: of the Most Holy Trinity, beginning on xxviii and running over onto xxix; of the Nativity; of the Epiphany; of Lent; of the Holy Cross; the Paschal Preface; of the Ascension; of the Holy Ghost; of the Blessed Virgin Mary; and of the Apostles. Each is printed as the clause inserted at the asterisk of the common Preface, not as a whole Preface, and none of them reprints the Sanctus, which is cued Holy, &c. and Sanctus, &c."
verified_on = "2026-07-31"
notes = "Created on 2026-07-31. These four artifact pages belonged to no passage record: praefatio-communis covered only page 39 and canon-missae began at page 44, so the proper Prefaces sat in a gap between them. Read visually in the page renditions for leaves n39-n42, rendered at 640 dpi in per-column halves with doubtful characters re-read at 1600 dpi. The transcribed English is registered as the praefationes-en artifact, which covers this record and praefatio-communis together because the two are one continuous setting under one running head."
