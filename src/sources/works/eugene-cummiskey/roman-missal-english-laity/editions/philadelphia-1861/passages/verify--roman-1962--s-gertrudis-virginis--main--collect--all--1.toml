notes = "Read on leaf n702, printed p. 694, running head `15th, 16th, AND 17th NOVEMBER.`. Day heading verified: `XV. St. GERTRUDE, v.` above `All as in Mass XIX. p. 498, except`; the whole oration stands on this page. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui in corde beatae Gertrudis Virginis`. DATE DIVERGENCE, not a text divergence: this witness keeps Gertrude on 15 NOVEMBER, where the 1962 keeps her on 16 November. Its own Kalendar agrees with itself -- p. 776, leaf n784, `15 S. Gertrude, v. d. 694` and `16 S. Edmund, c. bp. d. 694` -- so this is the book's calendar and not a misreading of the heading. Alignment status in the normalized evidence artifact: candidate."
