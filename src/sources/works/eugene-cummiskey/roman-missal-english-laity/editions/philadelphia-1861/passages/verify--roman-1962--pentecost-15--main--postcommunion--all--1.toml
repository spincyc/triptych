notes = "Printed p. 429 under `P. COMM. Mentes.`, before the heading `XVI. SUNDAY after PENTECOST.`; `sensuali-ty` closed up. The cue answers the 1962 `Mentes nostras et corpora possideat`. The printed Latin cue Mentes. and the English petition answer the target Mentes nostras. Read again from the exact registered PDF at 200 and 400 dpi on 2026-10-01; its SHA-256 was independently checked. This is the pre-1955 lay hand-missal English witness, not a modern approved liturgical translation."
