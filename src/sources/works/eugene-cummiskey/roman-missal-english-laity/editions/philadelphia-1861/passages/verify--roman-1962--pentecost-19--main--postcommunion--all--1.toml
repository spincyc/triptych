notes = "Begins on leaf n455, printed p. 447, `P. COMM. Tua nos.`, and ends on leaf n456, printed p. 448, above the heading of the Twentieth Sunday; both leaves were opened. The Latin cue `Tua nos` answers the 1962's `Tua nos, Domine, medicinalis operatio`. The word `obedient` at the end of the first line of p. 448 is printed with damaged type. Read 2026-10-01 at 200 and 400 dpi in the exact registered scan PDF, re-downloaded that day and hashed to its registered SHA-256. The wording agrees with the checked derivative pentecost-19-checked-english and with temporal-orations-en."
