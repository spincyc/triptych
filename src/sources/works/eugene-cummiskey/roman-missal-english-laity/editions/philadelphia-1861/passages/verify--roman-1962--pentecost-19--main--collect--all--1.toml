notes = "Leaf n454, printed p. 446, under the heading XIX. SUNDAY AFTER PENTECOST, `COLLECT. Omnipotens.` immediately after the Introit that opens the formulary on p. 445. The Latin cue `Omnipotens` answers the 1962's `Omnipotens et misericors Deus`, and the English renders that prayer clause for clause. Read 2026-10-01 at 200 and 400 dpi in the exact registered scan PDF, re-downloaded that day and hashed to its registered SHA-256. The wording agrees with the checked derivative pentecost-19-checked-english and with temporal-orations-en."
