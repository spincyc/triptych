notes = "Leaf n704, printed p. 696, heads 21 November `XXI. PRESENTATION of the B. V. MARY.` and rubricates `All as in the Votive Mass, p. 507, except COLLECT. Deus, qui.` -- so the day prints its own Collect only, which this file already records, and its Secret is the Votive Mass of the B. V. Mary's, in the section `VOTIVE MASSES OF THE B. V. MARY`. The Secret is set with no Latin cue and names `blessed Mary, ever a Virgin` in full, so nothing has to be written in; it answers `Tua, Domine, propitiatione`. Alignment status in the normalized evidence artifact: candidate."
