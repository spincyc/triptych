notes = "Read at leaf n660 = printed p. 652, running head `28th AUGUST`, inside `XXVIII. St. AUGUSTIN, bp. c. D.` at the explicitly labelled `COLL. (Of St. Hermes.) Deus, qui.` -- the same shape the 1962 has, a commemoration of Hermes on Augustine's day, and the witness prints its own three orations (Collect, Secret, P. Comm., each labelled `Of St. Hermes`) rather than sending them to a Common. Answers the 1962's `Deus, qui beatum Hermetem Martyrem tuum virtute constantiae in passione roborasti: ex ejus nobis imitatione tribue, pro amore tuo prospera mundi despicere, et nulla ejus adversa formidare`. This 1962 entry currently holds BOTH a real Collect and a Placeholder proper; this row answers the Collect. Alignment status in the normalized evidence artifact: candidate."
