context = "Printed pp. xv-xix, the head of THE ORDINARY OF THE MASS in facing Latin and English columns: the antiphon and Psalm xlii, the servers' Confiteor in full and the priest's abbreviated by '&c.', Misereatur, Indulgentiam, the versicles Deus tu conversus and Ostende nobis, Aufer a nobis, Oramus te, the rubric on the blessing of incense at solemn Mass, Kyrie eleison, and Gloria in excelsis. The English of the first response is 'To God who giveth joy to my youth' at its first occurrence on p. xv and 'To God who rejoiceth my youth' at its repetition on p. xvi."
verified_on = "2026-07-26"
notes = "All five pages were read visually in the Internet Archive page renditions for leaves n25-n29 of the same item, which correspond to these artifact pages. The book is a pre-1955 witness: its Latin here differs from the 1962 typical edition in orthography (Judica, coelum, seculorum, Adjutorium) and its surrounding rubrics reflect the discipline then in force."
