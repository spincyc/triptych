notes = "Printed p. 429 (running head `XVI. SUNDAY AFTER PENTECOST.`) under `SECRET.—` with no Latin cue, after the Offertory `Ps. xxxix.`; the page prints no conclusion. The book prints one Secret here, as the 1962 formulary has one. Its position before the Communion within Sunday XV and the clauses for the mysteries preserving us against the devil answer Tua nos, Domine, sacramenta custodiant ... contra diabolicos ... incursus. The lack of an English conclusion is a property of this historical witness, not an instruction to shorten the 1962 Latin. Read again from the exact registered PDF at 200 and 400 dpi on 2026-10-01; its SHA-256 was independently checked. This is the pre-1955 lay hand-missal English witness, not a modern approved liturgical translation."
