notes = "Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The correspondence was checked oration by oration against the Latin of the 1962 Vatican typical edition in the CMAA facsimile (artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) using that file's embedded text layer, which is a locating and comparison aid and not a page-image collation. RAISED TO `verified` ON 2026-09-05. All three orations are now collated character for character against the 1861 page images, including the abbreviated conclusion `Thro\u2019.` and its curly apostrophe: the Collect on leaf n437 = printed p. 429, registered on this edition as artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-bookreader-leaf-437-62750f41, and the Secret and the Postcommunion on leaf n439 = printed p. 431, registered as artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-bookreader-leaf-439-8899e8da. The collation is recorded at src/claude/liturgy/roman-rite/1962/propers/temporal/56-sixteenth-after-pentecost/propers/verified.md; leaf n439 was re-fetched once and returned byte-identical bytes. Before this the Collect alone stood `verified`, on its own passage record, and the Secret and the Postcommunion stood `inspected` from the transcription only. Both leaf images are registered `remote` for the rights reason their own records give, so this upgrade rests on a collation performed against images that are identified and hashed here but not retained here."
