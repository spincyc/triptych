context = "Collect, Secret, and Postcommunion of Dominica ultima post Pentecosten in the anonymous English of the 1861 Cummiskey Roman Missal, printed under the heading `XXIV. SUNDAY AFTER PENTECOST` at printed pages 457-459. The three lines carry the transcription's `post-pentecosten-ultima` key in liturgical order."
physical_line_ranges = [[182, 184]]
notes = "The 1861 missal heads this formulary `XXIV. SUNDAY after PENTECOST` and prints after it the rubric that there can be neither fewer than 23 nor more than 28 Sundays after Pentecost. The 1962 Missale Romanum heads the same formulary `DOMINICA XXIV ET ULTIMA POST PENTECOSTEN`; when more than 24 Sundays occur, the resumed Epiphany Sunday Masses are inserted before it, so an arithmetical ordinal in a given year does not identify this formulary. Address it by this key, not by counting. Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The correspondence was checked oration by oration against the Latin of the 1962 Vatican typical edition in the CMAA facsimile (artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) using that file's embedded text layer, which is a locating and comparison aid and not a page-image collation."
