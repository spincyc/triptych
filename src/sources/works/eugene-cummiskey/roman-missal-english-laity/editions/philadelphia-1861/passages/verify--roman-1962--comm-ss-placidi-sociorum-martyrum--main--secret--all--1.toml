notes = "Leaf n679, printed p. 671, heads 5 October `V. SS. PLACIDUS and COMPANIONS, mm.` and rubricates `All as in Mass IX. p. 479, except the Collect, Secret. and P. Comm. which are taken from Mass VIII. pp. 478, 479.` Mass VIII's Secret, on leaf n487, printed p. 479, carries no name and answers `Munera tibi, Domine, nostrae devotionis offerimus` word for word. Its Collect and Postcommunion carry `N. and N.` and the Postcommunion is ledgered untranslated. Alignment status in the normalized evidence artifact: candidate."
