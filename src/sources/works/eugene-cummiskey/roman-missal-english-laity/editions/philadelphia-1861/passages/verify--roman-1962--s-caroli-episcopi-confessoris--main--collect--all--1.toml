notes = "Read on leaves n697 (printed p. 689, running head `3d AND 4th NOVEMBER.`) and n698 (printed p. 690, running head `8th ND 9th NOVEMBER.`, the `AND` broken in the scan), the oration running over the page break; filed at the page where it begins. Day heading verified: `IV. St. CHARLES BORROMEUS, bp. c.` above `All as in Mass X. * p. 482, except`. The Latin cue printed before the English is `Ecclesiam`, which answers the 1962 incipit `Ecclesiam tuam, Domine`. Date agrees: 4 November in both books, and the Kalendar at p. 776 (leaf n784) gives `4 S. Charles Borromeo, c. bp. oct. of SS. Vitalis and com. Agricola, mm. 690`. PUNCTUATION AS PRINTED: the page ends the oration `in the love of thy holy name. Thro'` with NO full stop after `Thro'`; that is reproduced and is not an omission. This witness does not always print `Thro'.` -- the file's `corrections` block already records three such loci in the Temporale. Alignment status in the normalized evidence artifact: candidate."
