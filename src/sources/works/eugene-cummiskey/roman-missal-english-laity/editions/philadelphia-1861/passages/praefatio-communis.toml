context = "Printed p. xxviii, headed 'The PREFACE on Festivals and other Days that have none proper, and in Masses for the Dead': Vere dignum et justum est through supplici confessione dicentes, then Sanctus, in facing Latin and English. The English begins 'It is truly meet and just, right and available to salvation, that we should always, and in all places, give thanks to thee, O holy Lord, Father Almighty, eternal God' and renders the Sanctus 'Holy, holy, holy, Lord God of Sabaoth. Heaven and earth are full of thy glory. Hosanna in the highest. Blessed is he that cometh in the name of the Lord, Hosanna in the highest.'"
