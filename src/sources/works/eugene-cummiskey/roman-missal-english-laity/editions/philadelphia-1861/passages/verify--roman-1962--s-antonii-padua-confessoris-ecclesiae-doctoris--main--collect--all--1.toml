notes = "Read at leaf n601 = printed p. 593, under `XIII. St. ANTHONY of PADUA, c.` with the running head `13th AND 14th JUNE`. Cue `Ecclesiam.`, answering the 1962's `Ecclesiam tuam, Deus, beati Antonii Confessoris tui solemnitas votiva laetificet`. DIVERGENCE OF STYLE, NOT OF TEXT: the witness styles him `c.` and sends the day to its Mass XIII (Confessor not a Bishop, p. 488), where the 1962 styles him Confessor et Ecclesiae Doctor and sends the day to the Commune Doctorum -- Anthony was declared a Doctor of the Church in 1946, long after this printing. The Collect the two books set is the same one. Alignment status in the normalized evidence artifact: candidate."
