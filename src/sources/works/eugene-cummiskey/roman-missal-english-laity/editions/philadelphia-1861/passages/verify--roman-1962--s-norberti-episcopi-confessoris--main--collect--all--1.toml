notes = "Read at VI. St. NORBERT, bp. c., under the running head 2d, 3d, and 6th, June, p. 588 = leaf n596. Directive `All as in Mass X.* p. 482, except`; cue `Deus, qui.` answers the 1962 incipit. Two readings settled at doubled magnification: the page prints no stop after `practised` before `Thro'.`, and that omission is reproduced (this file already records the book omitting stops before its conclusion elsewhere); the colon after `church` inks only its upper point on the scan and is written as the colon the syntax and the sentence's own grant-clause require. Alignment status in the normalized evidence artifact: candidate."
