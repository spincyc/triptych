notes = "Read at the day's own heading, XXI. PRESENTATION of the B. V. MARY, under the running head 21st, 22d, and 23d November, p. 696 = leaf n704. The witness's directive is `All as in the Votive Mass, p. 507, except` followed by this Collect; the printed cue `Deus, qui.` answers the 1962 incipit. The English closes `presented before thy divine Majesty in the temple of God` where the 1962 Latin reads `in templo gloriae tuae praesentari mereamur`; the rendering is free but the cue and the day are the book's own join, and the text is recorded as printed. Alignment status in the normalized evidence artifact: candidate."
