context = "Collect, Secret, and Postcommunion of Dominica post Ascensionem in the anonymous English of the 1861 Cummiskey Roman Missal, printed under the heading `SUNDAY WITHIN THE OCTAVE (of the Ascension)` at printed pages 369-370. The three lines carry the transcription's `dom-post-ascensionem` key in liturgical order."
physical_line_ranges = [[101, 103]]
notes = "The 1861 missal heads this formulary `SUNDAY WITHIN THE OCTAVE`, that is, within the octave of the Ascension, which the 1962 books no longer keep. The 1962 heading is `DOMINICA POST ASCENSIONEM`. The three orations are the same. Filed under the 1962 Missale Romanum formulary key, not under the 1861 heading. The correspondence was checked oration by oration against the Latin of the 1962 Vatican typical edition in the CMAA facsimile (artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, SHA-256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a) using that file's embedded text layer, which is a locating and comparison aid and not a page-image collation."
