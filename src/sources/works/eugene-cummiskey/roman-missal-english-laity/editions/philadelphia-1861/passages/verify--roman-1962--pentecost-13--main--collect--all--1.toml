notes = "Printed p. 423 under `COLLECT. Omnipotens.` after the Introit `Respice, Domine, in testamentum tuum` of the formulary headed `XIII. SUNDAY after PENTECOST.`; `eter-nal` and `promis-est` closed up. The printed Latin cue Omnipotens. and the English petition answer the target Omnipotens sempiterne Deus, da nobis. Read again from the exact registered PDF at 200 and 400 dpi on 2026-10-01; its SHA-256 was independently checked. This is the pre-1955 lay hand-missal English witness, not a modern approved liturgical translation."
