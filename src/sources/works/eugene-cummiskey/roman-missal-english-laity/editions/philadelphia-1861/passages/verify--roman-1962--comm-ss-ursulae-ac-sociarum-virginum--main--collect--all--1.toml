notes = "Read on leaves n686 (printed p. 678, running head `19th AND 21st OCTOBER.`) and n687 (printed p. 679, running head `22d OCTOBER.`), the oration running over the page break; filed at the page where it begins. Day heading verified: `XXI. SS. URSULA and her Companions, mm.` above `All as in Mass XVIII. p. 497, except`. The Latin cue printed before the English is `Da nobis`, which answers the 1962 incipit `Da nobis, quaesumus Domine Deus noster`. Date agrees: 21 October in both books. The witness keeps Ursula as a day of her own where the 1962 keeps her as a commemoration; the oration is the same slot in both. Alignment status in the normalized evidence artifact: candidate."
