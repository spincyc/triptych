notes = "Read on leaf n706, printed p. 698, running head `24th AND 25th NOVEMBER.`. Day heading verified: `XXV. St. CATHARINE, v. m.` above `All as in Mass XVI. p. 493, except`; the oration is the last thing on the page and the page ends there. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui dedisti legem Moysi in summitate montis Sinai`. Date agrees: 25 November in both books; Kalendar p. 776 (leaf n784) `25 S. Catharine, v. m. d. 698`. TERMINAL PUNCTUATION FLAGGED: the word `Christ` sits at the right margin and its last letters are blotted with ink in this scan, so whether a full stop follows it could not be read even at 4x. A full stop is written here because the line ends and `Who liveth.` begins the next line, which is the same layout this witness uses at Hedwiges (`by embracing thy cross. Who livest.`, p. 677); that is an inference from the book's habit and NOT a reading, and the integrator may prefer to drop it. Nothing else on this oration is uncertain. The witness prints no conclusion beyond `Who liveth.`, answering the 1962's `Qui vivis`. Alignment status in the normalized evidence artifact: candidate."
