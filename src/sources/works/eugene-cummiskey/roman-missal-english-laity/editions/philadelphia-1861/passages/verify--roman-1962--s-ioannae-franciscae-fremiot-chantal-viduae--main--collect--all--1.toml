notes = "The oration straddles two leaves and both were opened: it begins at leaf n654 = printed p. 646, running head `18th AND 21st AUGUST`, under `XXI. St. JANE FRANCES, w.` / `All as in Mass XXI. p. 502, except` / `COLLECT. Omnipotens.--O Almighty and mer`, and finishes at leaf n655 = printed p. 647, running head `22d AUGUST`, at `...with the help of thy heavenly grace. Thro'.` Cue `Omnipotens.`, answering the 1962's `Omnipotens et misericors Deus, qui beatam Joannam Franciscam tuo amore succensam, admirabili spiritus fortitudine per omnes vitae semitas in via perfectionis donasti, quique per illam illustrare Ecclesiam ...`. The witness names her `Jane Frances`. Alignment status in the normalized evidence artifact: candidate."
