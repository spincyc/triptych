notes = "Begins as the last lines of printed p. 424 (running head `XIII. SUNDAY AFTER PENTECOST.`) under `SECRET.—` with no Latin cue, after the Offertory printed `Ps. xxxv.`, and ends at the head of p. 425; both leaves were opened. `par-don` closed up. Its position after the Offertory within Sunday XIII and the clauses for appeasement, pardon and granting requests answer Propitiare, Domine, populo tuo ... indulgentiam nobis tribuas, et postulata concedas. Read again from the exact registered PDF at 200 and 400 dpi on 2026-10-01; its SHA-256 was independently checked. This is the pre-1955 lay hand-missal English witness, not a modern approved liturgical translation."
