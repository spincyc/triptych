notes = "Read at leaf n638 = printed p. 630, running head `29th JULY`, under `XXIX. St. MARTHA, v.` whose rubric reads `All as in Mass XIX. p. 498, except the Gospel, Luke x. as on August 15, with a Comm. of SS. FELIX, &c. mm. as follows :`, and then prints this Collect. So the witness reaches these four martyrs exactly as the 1962 does, as a commemoration inside the 29 July Mass, and prints their own oration rather than sending it to a Common. Cue `Praesta.`, answering `Praesta, quaesumus Domine: ut, sicut populus christianus Martyrum tuorum Felicis, Simplicii, Faustini, et Beatricis temporali solemnitate congaudet, ita perfruatur aeterna`. The witness spells the names `Felix, Simplicius, Faustin, and Beatrix` and abbreviates martyrs to `mm.` in the body of the prayer; both are reproduced as printed. Alignment status in the normalized evidence artifact: candidate."
