notes = "Printed p. 428 (running head `XV. SUNDAY AFTER PENTECOST.`) under `COLLECT. Ecclesiam.` after the Introit `Inclina, Domine`, which begins under the heading `XV. SUNDAY after PENTECOST.` on p. 427. The printed Latin cue Ecclesiam. and the English petition answer the target Ecclesiam tuam, Domine. Read again from the exact registered PDF at 200 and 400 dpi on 2026-10-01; its SHA-256 was independently checked. This is the pre-1955 lay hand-missal English witness, not a modern approved liturgical translation."
