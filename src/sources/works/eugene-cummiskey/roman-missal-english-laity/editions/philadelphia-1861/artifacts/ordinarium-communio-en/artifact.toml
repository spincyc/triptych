notes = "One header line and 25 data lines; one physical line per printed block, with no embedded newlines. Columns: seq, element_key, part, kind, speaker, printed_page, ia_leaf, latin_incipit, english, notes. `kind` is one of heading, rubric, prayer, form, dialogue. Coverage: the Communion rite, from the Oremus and Praeceptis salutaribus that introduce the Pater noster through the priest's Communion under both kinds and the rubric taking the first ablution, printed pp. xxxix-xlii, that is Internet Archive leaves n49-n52 and artifact pages 50-53 of the parent facsimile. Two boundaries are deliberate and neither is where the book's running head suggests. The section begins AFTER the versicle Per omnia saecula saeculorum that stands in the first two lines of p. xxxix, which closes the Canon and belongs to the canon-missae-en artifact. It ends BEFORE Quod ore sumpsimus, which begins at the foot of p. xlii and is transcribed whole in the sibling ordinarium-conclusio-en artifact rather than split across the two. The book's running head THE CANON OF THE MASS runs over all four of these pages; it is a printer's device and not the boundary of the Canon, which ended with the doxology on the preceding page. Three findings from these pages that a later reader should have. THIS PRINTING HAS NO COMMUNION OF THE PEOPLE: there is no Ecce Agnus Dei, no people's Confiteor and no absolution anywhere in the rite, and the book passes straight from the priest's Sanguis Domini nostri to the rubric taking the first ablution. Anyone assembling a Communion rite from this witness must not read that silence as an omission of the transcription. The Agnus Dei's third petition reads `give us peace`, not `grant us peace`. And the same Latin versicle Per omnia saecula saeculorum is Englished two ways eleven lines apart - `For ever and ever` at the head of p. xxxix, which belongs to the Canon artifact, and `World without end` on p. xl, which is here. The commixture prayer Haec commixtio is printed in English only, embedded in its rubric across the full measure with no Latin at all, and is carried as a rubric row for that reason. Element keys are unique within this file only: `gloria-patri`, `rubrica-conversus-ad-populum` and `rubrica-inclinatus-ante-altare` each recur in a sibling section, because the book really does say those things twice, and a consumer joining several sections must key on the section as well. This printing is a pre-1955 lay hand missal, not an approved liturgical translation and never an altar book; nothing here may be used for recitation, and its rubrics are the discipline in force before the 1955 and 1960 reforms."
