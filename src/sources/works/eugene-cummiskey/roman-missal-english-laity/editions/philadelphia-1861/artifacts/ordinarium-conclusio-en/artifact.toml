notes = "One header line and 23 data lines; one physical line per printed block, with no embedded newlines. Columns: seq, element_key, part, kind, speaker, printed_page, ia_leaf, latin_incipit, english, notes. `kind` is one of heading, rubric, prayer, form, dialogue. Coverage: the close of the Ordinary: the ablution prayers Quod ore sumpsimus and Corpus tuum Domine, the Communion antiphon and postcommunion rubrics, the second postcommunion, Ite missa est with Requiescant in pace, Placeat tibi sancta Trinitas, the blessing, and the last Gospel John i. 1-14 ending Deo gratias, printed pp. xlii-xlvi, that is Internet Archive leaves n52-n56 and artifact pages 53-57 of the parent facsimile. The first row runs back onto p. xlii, which the sibling communio section also covers: Quod ore sumpsimus begins at the foot of xlii and finishes on xliii, and it is transcribed whole here rather than split. The section ends mid-page at the rule the printer sets on p. xlvi; what stands below that rule is the book's own devotional appendix and is not part of the Ordinary. Element keys are unique within this file only: `gloria-patri`, `rubrica-conversus-ad-populum` and `rubrica-inclinatus-ante-altare` each recur in a sibling section, because the book really does say those things twice, and a consumer joining several sections must key on the section as well. This printing is a pre-1955 lay hand missal, not an approved liturgical translation and never an altar book; nothing here may be used for recitation, and its rubrics are the discipline in force before the 1955 and 1960 reforms."
