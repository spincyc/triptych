notes = "One header line and 30 data lines; one physical line per printed block, with no embedded newlines, so a raw-line literal search over the `english` column returns exactly one line per element. Columns: seq, element_key, part, kind, speaker, printed_page, ia_leaf, latin_incipit, english, notes. `kind` is one of heading, rubric, prayer, form, dialogue. Coverage: the Canon of the Mass in the strict sense, Te igitur through the doxology Per ipsum and its concluding versicle, printed pp. xxxiii-xxxix, that is Internet Archive leaves n43-n49 and artifact pages 44-50 of the parent facsimile. The book's own running head THE CANON OF THE MASS continues to p. xlii, over the Pater noster, the fraction, the Agnus Dei and the priest's Communion; that material is deliberately excluded here because the running head is a printer's device and not the boundary of the Canon. The proper forms of Communicantes and Hanc igitur, which this printing sets elsewhere among the prefaces, are not included. This printing is a pre-1955 lay hand missal, not an approved liturgical translation and never an altar book; nothing here may be used for recitation. It renders the Roman Canon as the 1570-1962 books print it. It is NOT a translation of the postconciliar Prex eucharistica I, which differs from it at the points recorded in the source review of 2026-07-31, and must never be served as one."
