transformation = "Project transcription read visually from rendered page images of the parent facsimile, not from any optical-character-recognition layer. Artifact pages 44-50 were rendered with pdftoppm at 800 dpi in half-page slices and read; four doubtful words were re-rendered at 1600 dpi. The Canon was divided into its printed blocks, one row per block, and the block's English column transcribed as set. Nineteenth-century spelling, capitalisation, punctuation and the printing's abbreviated conclusions are reproduced as printed and were not modernised, expanded, or corrected against the Latin. Where the scan has lost ink at the right edge of the English column or a sort has failed, the damaged word is given whole and the damage is named in the row's `notes`; every such reading was controlled against the facing Latin column of the same opening. Nothing was supplied that the page does not print. Latin incipits are given in the normalised spelling of the Latin column's opening words and are apparatus, not transcription."
