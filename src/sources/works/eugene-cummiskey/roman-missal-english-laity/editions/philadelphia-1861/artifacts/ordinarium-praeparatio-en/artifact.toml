transformation = "Project transcription read visually from rendered page images of the parent facsimile, not from any optical-character-recognition layer. Artifact pages 26-30 were rendered with pdftoppm at 640 dpi and cropped into per-column upper and lower halves, with a whole-page view at 400 dpi for layout; doubtful characters were re-rendered at 1600 dpi. The section was divided into its printed blocks, one row per block, and the block's English column transcribed as set. Nineteenth-century spelling, capitalisation, punctuation and the printing's abbreviations are reproduced as printed and were not modernised, expanded, or corrected against the Latin. One typographic convention is normalised and is the only one: the compositor's French spacing before a colon, semicolon, question mark or exclamation mark is closed up, that being a setting convention of the printing rather than any part of its wording. Where the scan has lost ink at the right edge of the English column or a sort has failed, the damaged word is given whole and the damage is named in the row's `notes`; every such reading was controlled against the facing Latin column of the same opening. Nothing was supplied that the page does not print. Latin incipits are given in the Latin column's own spelling, ligatures included, and are apparatus, not transcription."
