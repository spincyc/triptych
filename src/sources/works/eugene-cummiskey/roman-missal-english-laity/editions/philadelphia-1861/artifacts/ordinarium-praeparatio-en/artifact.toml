notes = "One header line and 32 data lines; one physical line per printed block, with no embedded newlines. Columns: seq, element_key, part, kind, speaker, printed_page, ia_leaf, latin_incipit, english, notes. `kind` is one of heading, rubric, prayer, form, dialogue. Coverage: the head of THE ORDINARY OF THE MASS, from the section head and the priest at the foot of the altar through the Gloria in excelsis and the Dominus vobiscum that follows it, printed pp. xv-xix, that is Internet Archive leaves n25-n29 and artifact pages 26-30 of the parent facsimile. The last two rows stand at the foot of p. xix and precede the collect, which opens the next section. Element keys are unique within this file only: `gloria-patri`, `rubrica-conversus-ad-populum` and `rubrica-inclinatus-ante-altare` each recur in a sibling section, because the book really does say those things twice, and a consumer joining several sections must key on the section as well. This printing is a pre-1955 lay hand missal, not an approved liturgical translation and never an altar book; nothing here may be used for recitation, and its rubrics are the discipline in force before the 1955 and 1960 reforms."
