notes = "One header and four historical-English rows, one per Roman-1962 target of pentecost-19: Introit, Collect, Secret and Postcommunion, in that order on physical lines 2-5. Columns follow roman-1962-recovered-en without its alignment_status column: each row's target identity is argued on its own overlay entry in src/sources/inventories/roman-1962-proper-translations-v1.toml, which binds it through a single-line publish passage beside a page-image verify passage. Registered 2026-10-01 so that the overlay's four rights-withheld rows for this Mass could become positive entries: pentecost-19-checked-english carries the same English but names its column `text`, which the overlay's publication binding cannot read, and its Introit is the antiphon only. That artifact and its four passages are unchanged."
