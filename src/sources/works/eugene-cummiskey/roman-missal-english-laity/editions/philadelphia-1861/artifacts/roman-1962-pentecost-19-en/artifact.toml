transformation = "Page-image transcription of the English column of the Nineteenth Sunday after Pentecost at printed pp. 445-448 (artifact pages 454-457, IA leaves n453-n456), read 2026-10-01 at 200 and 400 dpi in the exact registered scan PDF, whose bytes were re-downloaded that day and hashed to its registered SHA-256. The Collect, Secret and Postcommunion wording agrees word for word with the separately registered checked derivative pentecost-19-checked-english (2026-09-28) and with lines 167-169 of temporal-orations-en; the Introit's psalm verse and Glory cue, which that derivative omits, were read on the page and agree with the item's registered OCR layer (ia-djvu-ocr), the only other reading. Only historical English bodies were retained: headings, Latin, page furniture and Google matter were omitted; line-break hyphenation (dis-tress, mer-ciful) was closed up and line breaks normalized to single spaces. Three normalizations are made and only these: the Introit's two-line drop capital `I AM` is set `I am`; the versicle glyph before `Glory` is set `V.`; and the book's abbreviated conclusion is set `Thro'.` with a straight apostrophe, the form this repository's 1962 translation overlay uses. The Postcommunion's `obedient` is printed with damaged type at the line end of p. 448 and is read as the word the 2026-09-28 check and the OCR context give. The Introit row is the complete printed Introit -- antiphon, the Psalm 77 verse and the Glory cue -- because the 1962 target body carries the verse and Gloria Patri; it is not the antiphon-only body of pentecost-19-checked-english."
