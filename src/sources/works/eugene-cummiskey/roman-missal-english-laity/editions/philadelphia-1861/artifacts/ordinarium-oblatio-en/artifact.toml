notes = "One header line and 59 data lines; one physical line per printed block, with no embedded newlines. Columns: seq, element_key, part, kind, speaker, printed_page, ia_leaf, latin_incipit, english, notes. `kind` is one of heading, rubric, prayer, form, dialogue. Coverage: the Ordinary from the collect through the Preface dialogue: the rubrics for the collect and the lesson, Munda cor meum, the Gospel dialogue and Per evangelica dicta, the Creed, the whole Offertory from Suscipe sancte Pater through Suscipe sancta Trinitas with the incensation prayers and the eight verses of Lavabo, the Orate fratres and Suscipiat, the rubric on the secrets, the versicle Per omnia saecula saeculorum, and the Preface dialogue ending `It is meet and just`, printed pp. xx-xxvii, that is Internet Archive leaves n30-n37 and artifact pages 31-38 of the parent facsimile. Artifact page 38, printed p. xxvii, belonged to no passage record in this repository until this transcription; the record that claimed the Orate fratres declared pp. xx-xxvi and stopped one page short of it. The book prints devotional and seasonal matter here that the 1962 Ordo Missae does not: the second collect A cunctis and the second secret, which are pre-1955 discipline, and Dominus sit in corde meo before the Gospel. Each is flagged in its row's `notes`. Element keys are unique within this file only: `gloria-patri`, `rubrica-conversus-ad-populum` and `rubrica-inclinatus-ante-altare` each recur in a sibling section, because the book really does say those things twice, and a consumer joining several sections must key on the section as well. This printing is a pre-1955 lay hand missal, not an approved liturgical translation and never an altar book; nothing here may be used for recitation, and its rubrics are the discipline in force before the 1955 and 1960 reforms."
