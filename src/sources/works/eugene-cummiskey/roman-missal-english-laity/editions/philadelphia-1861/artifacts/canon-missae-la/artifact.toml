notes = "One header line and 21 data lines; one physical line per printed block, with no embedded newlines. Columns: seq, element_key, part, printed_page, ia_leaf, latin, notes. `seq` and `element_key` are those of the sibling artifact canon-missae-en, which owns this section's order, kind, speaker and English; they are not renumbered, so the gaps in `seq` are the blocks that print no facing Latin and a reader can diff the join. Coverage: THE CANON OF THE MASS, from Te igitur through the Per omnia saecula saeculorum that closes it, printed pp. xxxiii-xxxix, that is Internet Archive leaves n43-n49. The 9 blocks of this section that carry no row are its three headings and six rubrics, set across the full measure in English. This Canon prints no cross glyph anywhere, and its Communicantes has no clause naming Saint Joseph; both facts are recorded on the rows concerned. Element keys are unique within this file only, as they are in the sibling, so a consumer joining several sections must key on the section as well. This printing is a pre-1955 lay hand missal, not an altar book; its Latin is its own and is not collated against either the 1920 or 1962 typical edition, and nothing here may be used for recitation."
