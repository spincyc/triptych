notes = "One header line and 28 data lines; one physical line per printed block, with no embedded newlines. Columns: seq, element_key, part, printed_page, ia_leaf, latin, notes. `seq` and `element_key` are those of the sibling artifact ordinarium-oblatio-en, which owns this section's order, kind, speaker and English; they are not renumbered, so the gaps in `seq` are the blocks that print no facing Latin and a reader can diff the join. Coverage: the Lessons and the Offertory, from the rubric after the Collect through the Preface dialogue, printed pp. xx-xxvii, that is Internet Archive leaves n30-n37. The 31 blocks of this section that carry no row are its rubrics and headings and four prayers - a-cunctis, munda-cor-meum, dominus-sit-in-corde-meo, per-evangelica-dicta, accendat-in-nobis and secreta-ii - which the book sets across the full measure in English with no facing Latin. Leaf n30, printed page xx, carries no facing Latin at all and was opened and read to establish that. Element keys are unique within this file only, as they are in the sibling, so a consumer joining several sections must key on the section as well. This printing is a pre-1955 lay hand missal, not an altar book; its Latin is its own and is not collated against the 1962 typical edition, and nothing here may be used for recitation."
