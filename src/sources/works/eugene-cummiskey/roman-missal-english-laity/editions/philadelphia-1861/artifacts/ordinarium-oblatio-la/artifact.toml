transformation = "Project transcription read visually from page images of the same Internet Archive item the parent facsimile artifact registers, not from any optical-character-recognition layer. The images fetched were that item's own page derivatives, https://archive.org/download/romanmissaltran00churgoog/page/n<leaf>_w1400.jpg, each 2092x3500 pixels, which is the largest derivative the item serves; the Latin column was cropped from each leaf and read at full size, and every doubtful character was re-read from a further crop magnified to between 200 and 250 per cent. The section was divided into the printed blocks of its sibling -en artifact, one row per block, joined to it by element_key, and the block's LATIN column transcribed as set; a row exists only where the page prints facing Latin, and the blocks the book sets across the full measure in English alone carry no row here. Nineteenth-century spelling, capitalisation, punctuation, ligatures (ae, oe) and the printing's abbreviations (&c., Per eumdem, &c.) are reproduced as printed and were not modernised, expanded, or corrected against the 1962 typical edition or any other book; the printing's own misprints stand and are named in the row's notes. One typographic convention is normalised and is the only one: the compositor's French spacing before a colon, semicolon, question mark or exclamation mark is closed up, that being a setting convention of the printing rather than any part of its wording. Cross glyphs are not reproduced; where the Latin column prints one, the row's notes say so. Speaker and versicle marks (P., R., Ant.) are transcribed as the Latin column prints them. Small capitals are rendered as capitals, as the sibling -en artifact renders its own. In the Kyrie blocks, which the book sets across the full measure with an italic English gloss on the same line as the Greek, the acclamations are carried with their speaker marks and the English gloss is omitted, that gloss being the -en artifact's material. Where the scan's inking fills or breaks a letter, the word is given whole and the damage is named in the row's notes; no reading was ever repaired from another edition, from a facsimile of the 1962 book, or from the received text, and the facing English was used only to confirm which block is which and never to settle a Latin reading."
