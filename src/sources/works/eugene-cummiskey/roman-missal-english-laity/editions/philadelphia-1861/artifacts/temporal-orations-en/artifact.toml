notes = "One header line and 183 data lines; one physical line per oration, so a raw-line literal search over `<formulary>\\t<oration>` returns exactly one line. Columns: formulary, oration, latin_incipit, printed_page, ia_leaf, english. `formulary` is the addressing key defined by the work's locus_pattern and names the 1962 Missale Romanum formulary, not the 1861 heading; `oration` is collect, secret, or postcommunion. Coverage: the Sundays and principal feasts of the temporal cycle only - Advent 1-4; the Vigil of Christmas and the three Christmas Masses; the Sunday within the octave; the octave day of Christmas (printed as The Circumcision); the Epiphany and Sundays 1-6 after it; Septuagesima, Sexagesima, Quinquagesima; Ash Wednesday; Lent 1-4; Passion Sunday; Easter Sunday; Low Sunday; Sundays 2-5 after Easter; the Ascension; the Sunday after the Ascension; Pentecost; Trinity Sunday; Corpus Christi; and Sundays 1-23 and the last Sunday after Pentecost. Ferias, Ember days, Rogation days, vigils, octave days other than those listed, Palm Sunday, the rest of Holy Week, and the whole sanctoral cycle are deliberately excluded. Only the oration of the day is transcribed: the 1861 printing's seasonal second and third collects, secrets, and postcommunions, and its commemorations of other Masses, are not part of the 1962 formulary and are omitted. printed_page is the page number carried by the 1861 printing at the place where the oration begins; ia_leaf is the zero-based Internet Archive leaf index of the same place. Both were computed from the item's own hOCR page index and page-number map and were confirmed against page images at leaves n86, n136, n400, n437, and n457; an oration that runs over a page break is filed at the page where it begins."
