transformation = "Project transcription. For each temporal formulary listed below, the oration blocks were located in the parent OCR, the OCR's element label and Latin incipit were separated from the English, line-break hyphenation was closed up, and scanning errors were corrected. Corrections were made from the OCR context and, where the OCR left a genuine textual gap or an unreadable word, from the item's own page images (leaves n86, n88, n106, n107, n114, n121, n136, n400, n436, n437, n456, n457 were read at 1300-1400 px width). Wording, nineteenth-century spelling, capitalisation, and the printing's abbreviated conclusions (Thro'., Who livest., &c.) are reproduced as printed and were not modernised, expanded, or corrected against the Latin. Latin incipits are given in the normalised classical spelling of the printed abbreviation; where the missal prints no incipit for an oration the field is empty."
