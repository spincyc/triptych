transformation = "Human page-image transcription on 2026-08-26 from the registered Cummiskey 1861 facsimile at printed pp. 500, 505, 507-510 (IA leaves n508, n513 and n515-n518; one-based PDF artifact pages 509, 514 and 516-519). Only the exact printed historical English body was copied: headings, Latin, scripture outside the target, Google matter, line-break hyphenation and page furniture were omitted; words split only by a printed line break were joined. Spelling, capitalization, punctuation, verse markers and printed Alleluias were retained. The Sat-BVM-II Communion is transcribed from its printed body at p. 509/n517/PDF p. 518; p. 510 merely points back to that wording and is not treated as the body locus. Repeated exact bodies remain separate rows because each binds a distinct 1962 target identity. The Dedication row preserves a verified historical candidate without asserting exact target identity. The remote OCR was used only as a locator and does not control a byte."
