notes = "Turn-divided derivative of artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ordinarium-communio-la (sha256 8a58f98ad38a0733f8b6b7645ef0f7ccc2a95995d28478d87aa351a7d87fe67d), made on 2026-10-19 so that a consumer can address each printed turn of a dialogue block as its own row. The parent remains the transcription of record, one physical line per printed block, and every consumer that reads its rows as blocks stays on it; this artifact exists because changed bytes take a new artifact identity (guidance/sources.md), not because the parent was corrected. One header line and 16 data lines, with no embedded newlines; the columns, coverage, transcription conventions and printed-page and leaf cells are the parent's, and the parent's notes describe them. Of the parent's blocks, exactly 1 are held here as child rows numbered seq*100+n from the seq of the block they divide (seq 6 into 2 rows); every other line is the parent's line byte for byte and in the parent's order. REJOIN: for each divided block, the child rows' Latin cells joined by single spaces equal the parent block's Latin cell byte for byte; the first child's other cells equal the parent's except that its notes cell appends one sentence recording the division, and later children carry the parent's cells with notes, and where the file has them speaker and latin_incipit, left empty. This was verified by script on 2026-10-19 for every divided block of this file against the parent's exact bytes. Its sibling column is artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ordinarium-communio-en-turn-divided, which divides the same printed blocks at the same seqs, so seq and element_key join the two exactly as they join the two parents. DIVISION RECORD (2026-10-19): each divided block's text column was cut, between single-space-separated tokens counted from 0, before every interior printed P. or R. mark and, where named, before a printed paragraph break that carries no mark; nothing was added, removed or re-spelled, and the child rows joined by single spaces are the block's text byte for byte. The first child keeps the block's note and later children leave it empty, the per-turn speaker being the Ordinary inventories' reviewed turn partition. Every cut was checked on the page images of the registered facsimile (ia-scan-pdf, sha256 85034c90...) at 300 dpi. Cuts: seq 6 (11 tokens) into 601-602 at token indices [6]."
