rights_basis = "The 1861 Philadelphia printing was published long before 1930 and is in the public domain in the United States. This file contains only that printing's own Latin wording, transcribed by this project from its page images; a faithful transcription of a public-domain text originates no new copyright, and no Google or Internet Archive front matter, markup, annotation, or page-image material is reproduced. The rights basis is a United States one: a reader elsewhere must establish the position in their own jurisdiction. This artifact is a turn-divided derivative of artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ordinarium-communio-la: it divides some of the parent's blocks into child rows, one per printed turn, and adds, removes and alters no wording, so the parent's rights status, basis and jurisdiction apply to it unchanged."
