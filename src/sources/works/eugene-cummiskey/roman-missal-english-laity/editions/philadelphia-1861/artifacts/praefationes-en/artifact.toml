notes = "One header line and 26 data lines; one physical line per printed block, with no embedded newlines. Columns: seq, element_key, part, kind, speaker, printed_page, ia_leaf, latin_incipit, english, notes. `kind` is one of heading, rubric, prayer, form, dialogue. Coverage: the Prefaces: the common Preface with the Sanctus, and then ten proper Prefaces - of the Most Holy Trinity, of the Nativity, of the Epiphany, of Lent, of the Holy Cross, the Paschal Preface, of the Ascension, of the Holy Ghost, of the Blessed Virgin Mary, and of the Apostles - printed pp. xxviii-xxxii, that is Internet Archive leaves n38-n42 and artifact pages 39-43 of the parent facsimile. Artifact pages 40-43, printed pp. xxix-xxxii, belonged to no passage record in this repository until this transcription; only the common Preface on p. xxviii was covered. Two things a consumer must know before assembling a Preface from these rows. The Sanctus is printed ONCE, after the common Preface, and is never reprinted: each proper Preface is cued `Holy, &c.` in English and `Sanctus, &c.` in Latin. And the book marks with an asterisk the place in the common Preface where a proper Preface's own clause is inserted, so a proper Preface as printed here is the inserted clause and not a whole Preface; the rubric explaining the asterisk is transcribed as its own row. Element keys are unique within this file only: `gloria-patri`, `rubrica-conversus-ad-populum` and `rubrica-inclinatus-ante-altare` each recur in a sibling section, because the book really does say those things twice, and a consumer joining several sections must key on the section as well. This printing is a pre-1955 lay hand missal, not an approved liturgical translation and never an altar book; nothing here may be used for recitation, and its rubrics are the discipline in force before the 1955 and 1960 reforms."
