publication = "Philadelphia: Published by Eugene Cummiskey, South Sixth Street, 1861. Title matter: \"THE ROMAN MISSAL, TRANSLATED INTO THE ENGLISH LANGUAGE FOR THE USE OF THE LAITY ... PUBLISHED WITH THE APPROBATION OF THE RIGHT REV. THE BISHOP OF PHILADELPHIA. FIRST REVISED EDITION.\""
date = "1861"
notes = "The translator is not named. The book prints the Proper of the Season from the First Sunday of Advent through the last Sunday after Pentecost, then the Common of Saints and the Proper of Saints. It is a pre-1955 witness: its Holy Week (Maundy Thursday, the Mass of the Presanctified, and the Holy Saturday morning office) and its Advent, Lent, and Sunday second and third collects, secrets, and postcommunions reflect the discipline in force before the 1955 Ordo Hebdomadae Sanctae instauratus and the 1960 Rubricae generales. Its Sunday orations for Advent, Christmas, Epiphany, Septuagesima, Lent, Eastertide, and the Sundays after Pentecost are the same formularies later printed in the 1962 Missale Romanum; see the artifact notes for the boundary and numbering differences that were checked."
