notes = "An earlier Philadelphia printing of the same anonymous translation as the sibling philadelphia-1861 edition. It is carried here as a second witness rather than as a text of record: its Common of Saints and Proper of Saints stand at the same printed page numbers as the 1861's, so a reading can be checked in two independently scanned printings without acquiring anything further. Where the two printings differ, the 1861 is the edition this project quotes and the difference is recorded in the consuming inventory rather than harmonised. This is a LAY HAND MISSAL and not an official typical edition: it cannot stand as a witness to the text of any typical edition, and a reading taken from it attests what this translation printed, not what Rome promulgated. The corpus this artifact was re-derived from recorded no such caveat for it."
