notes = "36,683 LF-delimited physical lines. Uncorrected OCR of a small-type duodecimo. It controls no wording. Its only use here is as a second reading of the same translation, against which a reading taken from the 1861 scan can be corroborated before a page image is opened: the two are independent scans of independent printings, so their optical damage differs in kind and a word both render alike is established, while a word they render differently is a signal to open the page. The Common of Saints begins at line 24757, at the same printed p. 459 as the 1861's. Its aliases were resolved before retrieval and are the same as the 1861's, the work record's alternate_titles, plus the Internet Archive identifier. Not yet entered in src/sources/inventories/source-family-migration-v1.toml: it belongs in family.eugene-cummiskey.roman-missal-english-laity beside the 1861 printing, one work and one translation with two editions under it, and source-family-migration check names this artifact and its edition as canonical IDs lacking family membership until it is. The entry was not made in this change because another lane holds uncommitted edits to that ledger, and adopting another lane's working file is a fault whatever the bytes turn out to be. The next ledger refresh must review this presence rather than infer it."
