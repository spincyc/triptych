rights_basis = "Public domain in the United States because the book was published in the United States before the pre-1931 line, and on that ground alone. THE LINE, AND THE YEAR IT WAS DERIVED FOR. Any work published before 1931 is out of United States copyright; that is the line guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026. THE LINE MOVES EVERY JANUARY, which guidance/missals.md:249 states in terms, so it is written here as derived for calendar year 2026 and not as a standing rule: on 1 January 2027 it becomes before 1932, and a later reader must re-derive it rather than quote this sentence. Publication at Philadelphia in 1843 clears the line by eighty-eight years. THIS IS A DOMESTIC PUBLICATION AND ITS TERM CAN ALSO BE FOLLOWED TO ITS END, which the foreign books folded in beside it cannot offer. The book prints its own copyright notice on the verso of the title leaf, at lines 72 to 77 of the text layer, where it OCRs as 'Entkheti according to the Act of Congress, in the yea; / 1843, by / EUGENE CUMMISKET^ / in the Cierk's O0icc of the District Court for the Eastern / District of Veonsvlvania.' -- that is, Entered according to the Act of Congress, in the year 1843, by Eugene Cummiskey, in the Clerk's Office of the District Court for the Eastern District of Pennsylvania. The mangling is the scanner's and the sense is not in doubt; the year 1843 and the name are legible as printed. Under the Copyright Act of 1831 that secured an initial term of twenty-eight years, expiring in 1871, with one renewal of fourteen years available to the author or his heirs, so the longest term this registration could ever have run expired in 1885 -- a hundred and forty-one years ago, and before either of the twentieth-century extensions could reach it. Restoration under 17 U.S.C. 104A is unavailable to a United States work by its own terms. So the age line and the book's own registration agree, and neither depends on the other. THE SCAN AND ITS TEXT LAYER ADD NOTHING FOR ANYONE TO OWN. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it: the Internet Archive item's own metadata names the recogniser as ABBYY FineReader 11.0 with abbyy-to-hocr 1.1.7, an autonomous program and not a person, so there is no author to hold a right in the text layer. AND THE GOOGLE MATTER WAS LOOKED FOR IN THESE BYTES RATHER THAN ASSUMED FROM THE FIRST LINE; SEE `notes`. In summary: this file's first line does read 'Digitized by Google', and that is the whole of the Google matter in it -- the page-foot stamp, four words, carrying no notice and reserving nothing. Google's front-matter statement and usage guidelines, which ARE in the sibling artifact registered under this same edition, are not in this file. NOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, that the download succeeded, or that any host marks the scan public domain. guidance/sources.md:395-400 holds that availability and successful download are insufficient for `tracked`, and the item's Public Domain Mark 1.0 was the whole of the prior lt-hist corpus's ground for this book -- the ground refused at src/sources/inventories/lt-hist-rights-audit-v1.toml."
