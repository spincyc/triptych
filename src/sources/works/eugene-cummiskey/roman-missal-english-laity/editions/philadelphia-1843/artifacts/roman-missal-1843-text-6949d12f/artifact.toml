notes = "A SECOND, INDEPENDENT SCAN OF THE SAME PRINTING, AND THE FIRST OF THEM THAT CAN BE SEARCHED. This edition already carried `artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr`, Internet Archive item romanmissaltran00englgoog, 1,060,143 bytes, which is registered `remote` and holds no bytes here. This is Internet Archive item TheRomanMissal1843, 1,721,622 bytes over 46,030 LF-terminated lines, valid UTF-8, no CR bytes. THE TWO ARE DIFFERENT SCANS OF ONE PRINTING AND NOT DUPLICATES: both were read here on 2026-08-01 and both carry the same title leaf, 'PUBLISHED BY EUGENE CUMMISKEY, 130 SOUTH SIXTH STREET. 1843.', and the same copyright notice entering the book to Cummiskey in 1843 in the Eastern District of Pennsylvania. Their optical damage differs in kind, which is what makes a second scan worth holding: a word both render alike is established, a word they render differently is a signal to open a page image.\n\nTHE LAY-MISSAL CAVEAT, WHICH lt-hist NEVER RECORDED AND WHICH MUST TRAVEL WITH THIS TEXT. This is a devotional hand missal for the pew and NOT a witness to any typical edition of the Roman Missal. The fact is on the book's own title page -- 'TRANSLATED INTO THE ENGLISH LANGUAGE FOR THE USE OF THE LAITY' -- and the prior corpus's metadata for it says only 'Public Domain Mark 1.0. OCR quality is imperfect', so a fold-in that trusted that metadata would have carried a lay book in as an official English edition. Its English is its compiler's and carries no authority whatever; the Latin Missal it follows says nothing in English, and no English translation of the Missal existed by authority in 1843. Its own preface, headed at line 83, states the purpose in terms: to instruct members of the Church in the nature of the Mass, and to be intelligible to 'members of other communions'. It is evidence of what an American Catholic read in 1843 and not evidence of what the altar book said. Anyone binding it as a witness to the Tridentine text would be making an accuracy error that the rights verdict does nothing to prevent. THE SAME CAVEAT BELONGS ON `edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843` AND IS NOT THERE: that record was written before the audit and this lane may create records under works/ but not rewrite existing ones, so the caveat is carried here and is recorded as an outstanding correction in src/sources/inventories/lt-hist-rights-audit-v1.toml.\n\nTHE GOOGLE QUESTION, DECIDED ON THE BYTES, AND THIS EDITION IS WHERE THE TEST PAYS FOR ITSELF. The first line of this file reads 'Digitized by Google', which is why the fold-in of this scan was held back. Two routes were offered: land a derivative with the Google matter removed by one stated replayable transformation, or register it remote and unresolved and hold no bytes. NEITHER WAS TAKEN.\n\n  WHAT IS NOT HERE. Google's front-matter statement and usage guidelines are ABSENT. Searched case-insensitively over the whole 1,721,622 bytes: 'usage guidelines' 0, 'about this book' 0, 'books.google' 0, 'do not assume' 0, 'watermark' 0, 'non-commercial' 0, 'attribution' 0, 'creative commons' 0, 'all rights' 0, and 'public domain' 0. The word 'copyright' occurs 0 times -- the book's own 1843 notice is set as 'Entered according to the Act of Congress' and does not use it.\n\n  WHAT IS HERE. The page-foot stamp alone, in 177 distinct spellings over about 892 lines, and MOST OF THEM DO NOT CONTAIN THE WORD GOOGLE: the commonest form is 'Digitized byCjOO^IC' at 179 occurrences, then 'Digitized by Google' at 156, 'Digitized by CjOO^lC' at 97, 'Digitized by CjOO^Ic' at 57, 'Digilized byCjOO^IC' at 35, and a long tail down to 'D .Google', 'n Google' and ',y Google'. A plain search for 'google' finds only 350 of them.\n\n  WHY NOT ROUTE (a), THE DERIVATIVE. Because no single stated transformation removes the stamp, and that census is the proof: a strict pattern misses the majority, and a pattern loose enough to catch 'CjOO^IC' and 'D .Google' matches ordinary English -- 'golden', 'gold, frankincense' in the Epiphany Masses at lines 911, 1354, 11448, 11452 and 11498 among many others -- so it would delete the Magi's gifts from a Missal. The honest choices were a stated rule with a known large residue or an unstated hand-picked list of hundreds, and the second is precisely what the offered route forbids.\n\n  WHY NOT ROUTE (b), REMOTE AND UNRESOLVED. Because 'unresolved' would record a doubt these bytes disprove, and it would leave this edition with no searchable text at all.\n\n  AND THE CONTRAST SITS IN THE SAME EDITION DIRECTORY, WHICH IS AS CHECKABLE AS A RIGHTS DISTINCTION EVER GETS. The sibling artifact romanmissaltran00englgoog was fetched here on the same day and read: its lines 1 to 65 are Google's front-matter block entire -- 'This is a digital copy of a book that was preserved for generations on library shelves' at line 4, 'Usage guidelines' at line 16, 'About Google Book Search' at line 60 -- and it carries NO page-foot stamp at all, 11 lines containing 'google' in the whole file [verified 2026-08-01]. That artifact is remote and unresolved and should be: it holds Google-authored prose. This one holds a four-word stamp. Two Google digitisations of one printing, opposite findings, from one grep. Note also that route (a) IS available for the sibling in the form it was designed for -- its Google matter is a single contiguous head block that one stated deletion would remove -- and that this lane did not take it, because rewriting an existing artifact record is outside what it owns. That is recorded as an open item in the audit.\n\n  THE STAMP IS RETAINED, deliberately: it carries no notice and no claim, it is the only page-boundary evidence in this text layer, and the Lasance fold-in already set the precedent by retaining its scan host's page-foot watermark. A reader must not mistake it for a rights notice, and must expect it interleaved through any quotation that spans a page break.\n\nWHAT THE COPY CARRIES. Bishop England's historical explanation of the vestments and ceremonies runs through the prefatory matter, which is paginated in roman numerals and includes the Ordinary and THE CANON OF THE MASS from line 8025, under running heads on printed pages xxxviii to xliv down to line 8858 -- so this book prints the Canon twice, once inside the explanation and once in its place. Then the calendar and tables, the temporal Masses, the Vespers from line 21238, and THE PROPER OF SAINTS from line 35077, whose English saints -- George at 37741, Augustine of Canterbury at 38640, Alban at 39243 -- show it drawing on English as well as American use. It ends 'FINIS' at line 46007.\n\nOCR QUALITY. Measured here by scripts/_ocr_quality.py at an English function-word share of 0.3279 over 265,410 tokens, Latin 0.0343, classified `prose-english`. That is the highest English share of anything folded in from this corpus and near the 0.39-0.41 a keyed English text reaches; the shortfall is accounted for by the Latin that the book prints alongside the English in the Ordinary and the Canon. The damage that remains is ordinary: broken words at line ends, 'cdtavy' for 'altar' and similar, and the running heads fused to body text. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE, and prefer to check a reading against the 1861 printing registered in this library, which the edition record already names as the text this project quotes where the two differ.\n\nIDENTITY. Internet Archive item TheRomanMissal1843, uploaded 2017-06-16 by a private uploader, collections catholictexts, folkscanomy_religion and folkscanomy, 841 page images at 600 ppi, page_number_confidence 92.26, creator 'Catholic Church; England, John, 1786-1842', publisher 'Philadelphia : E. Cummiskey', OCLC 926168709, OpenLibrary OL18249139M. NOTE A DISCREPANCY IN THAT METADATA, RECORDED BECAUSE IT WOULD OTHERWISE MISLEAD: the item's `scanner` field says 'Internet Archive HTML5 Uploader 1.6.3', which describes how a private person uploaded the file and NOT who made the page images. The images are plainly a Google digitisation -- the stamp is at the foot of every page -- so this item is a re-upload of Google-scanned pages, re-recognised with ABBYY FineReader 11.0, and not an Internet Archive Scribe scan. A record that read the `scanner` field alone would state the provenance backwards."
