description = "A nineteenth-century English lay hand missal giving the Masses of the Roman Missal for the use of the laity, with the orations printed in English only and the chant propers in facing Latin and English columns. The translation is anonymous; the title matter records publication with the approbation of the Bishop of Philadelphia. It is a devotional companion to the Latin altar book, not an official liturgical translation, and its rubrics, commemorations, and Holy Week material are those in force before the 1955 and 1960 reforms."
