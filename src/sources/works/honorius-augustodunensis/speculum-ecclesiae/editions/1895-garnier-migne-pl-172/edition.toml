notes = "The Speculum Ecclesiae as the 1895 Garnier reissue of PL 172 prints it, registered on the pattern this library uses for a constituent of a Migne volume: the edition is the constituent as the volume prints it, and its bytes are the whole-volume text layer registered under Gemma animae (artifact.honorius-augustodunensis.gemma-animae.1895-garnier-migne-pl-172.ia-djvu-ocr-2ebfcb5f), reached through this edition's segment. The imprint and year are those that edition records from the title-page image of leaf n4. The volume's Elenchus (layer lines 430-515) lists Speculum Ecclesiae at column 801 under Operum pars tertia; in the layer the work stands at physical lines 63969-86480, from the heading 'SPECULUM ... ECCLESIAE' at column 807 to the closing rubric 'Finis ecclesiastici divi speculi Honorii' (lines 86438-86480) before the Elucidarium's heading at column 1109. The editor's notice at the head of the text, damaged in the layer (lines 63987-63995), describes the parchment manuscript from which it is printed, of the twelfth century and defective at the end (the layer reads 'seculi xir' and 'mutilus in flne'); the printing's completeness against other witnesses was not examined. Uncorrected optical recognition: a reading quoted from it is collated against a page image before it is relied on."
