description = "Honorius Augustodunensis's book of model sermons for the feasts and Sundays of the year and for general occasions, ending with a sermon for the dedication of a church. Its sermons are headed by occasion rather than numbered; a locus is given by the occasion's heading and by column or physical line in the printing that carries it."
