transformation = "Read the named printed columns as page images rendered from the hashed facsimile with pdftoppm at 300 dpi (PDF pp. 51-52; the embedded scans are bilevel at about 145 ppi), doubtful words re-read on 600-dpi crops; transcribe the prose of chapter III.1 with one sentence per LF-terminated UTF-8 line, prefixed by a braced book-and-chapter locator; preserve Migne's wording, capitalization, and punctuation while rejoining line-end hyphenation (celebra-mus, Se-cundo, Anti-phonario, lauda-mus, Adven-tum, in-nocentiae, red-debantur, cogno-scatur); expand the ligature ae (as in this edition's IV.65-68 transcription: praenuntiatum, vitae, hebdomadae, saeculi); do not reproduce the printer's space before a colon or semicolon; omit chapter headings, typeface changes (horis, solemnitatibus, Adventum, Gloria in excelsis and Te Deum laudamus are italic), running heads, column letters and numbers, and editorial footnotes. The f of adfuturum has a broken crossbar in the scan and is read as f."
