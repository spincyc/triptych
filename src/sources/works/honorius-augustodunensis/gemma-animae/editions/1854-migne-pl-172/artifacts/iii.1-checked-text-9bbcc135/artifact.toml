notes = "Gemma animae III.1, the opening chapter of Book III, headed LIBER TERTIUS. DE SOLEMNITATIBUS TOTIUS ANNI. Cap. I. - De Adventu Domini. It begins at the foot of PL 172 col. 641 (PDF p. 51, left column, below the end of Book II), continues at the foot of col. 642 (section D, same page) and ends at the top of col. 643 (PDF p. 52) before the sub-heading De Responsorio Aspiciens; the chapter continues with that sub-heading and De laudibus to Cap. II at col. 643. Transcribed: the eight sentences on Advent from Adventum itaque to cognoscatur (141 words): the three causes of the feast; five weeks in the Lectionary and Evangeliary for the five ages of the world, four in the Antiphonary and Gradual for law, prophets, psalms and the books of the gentiles; Gloria in excelsis and Te Deum not sung, dalmatic and tunicle (subtile) not worn; all intermitted to be taken up more festively at the Nativity. Not transcribed: the chapter's first sentence, a transition from the Hours of Book II to the solemnities (Haec utcunque de horis diximus ...), and the sub-headed sections after cognoscatur. The 1895 Garnier reissue scanned as Internet Archive item patrologiaecursu0172mign lacks cols. 639-642 altogether (its leaf n320 is cols. 637-638 and n321 cols. 643-644; the item's scandata marks no leaf deleted there), which is why that edition's text layer passes from Book II straight to col. 643; this 1854 facsimile is the only page image of the chapter's opening this library holds. A medieval reception witness to an earlier arrangement, not evidence for the 1962 rubrics."
