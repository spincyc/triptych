context = "The chapter headed 'Dominica undecima post Pentecosten, Deus in loco, sub lege' reads the Queen of Sheba as a figure of the Church, coordinates the collect and 1 Corinthians 15 with her humility, reads Luke 18's Pharisee and publican through Solomon and the queen, and connects the Offertory and Communion with her praise and gifts."
verified_on = "2026-08-20"
notes = "Verified against PL 172:714-715. This is a medieval witness to an earlier Sunday arrangement: its numbered Eleventh Sunday has Deus in loco and 1 Corinthians 15 but Luke 18, not Mark 7. It is reception evidence, not proof of the architecture or compiler intent of the 1962 Mass."
