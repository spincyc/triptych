context = "The chapter headed 'Cap. I. - De Adventu Domini', the first of Book III (De solemnitatibus totius anni), gives three causes for keeping the Advent of the Lord (the time in which the ancient saints foretold him, his coming to each at the end of life, his coming as judge); five weeks in the Lectionary and Evangeliary for the five ages of the world, four weeks in the Antiphonary and Gradual for the law, the prophets, the psalms and the books of the gentiles; Gloria in excelsis and Te Deum not sung and dalmatic and tunicle not worn, all intermitted so as to be taken up more festively at the Nativity."
verified_on = "2026-11-18"
notes = "Verified against PL 172:641-643 on PDF pages 51 (cols. 641-642) and 52 (col. 643) of the 1854 facsimile. The chapter's first sentence, a transition from the Hours, is not transcribed. The Internet Archive scan of the 1895 Garnier reissue lacks cols. 639-642, so this chapter's opening cannot be read in that edition. A medieval reception witness, not evidence for the 1962 rubrics or their Sunday count."
