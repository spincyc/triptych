context = "The 'sub gratia' chapter paired with the preceding medieval Twelfth Sunday associates Deus in adjutorium, 2 Corinthians 3, and Mark 7 with a polemical account of the post-Constantinian Church: the deaf and mute man signifies heretics whom Catholics bring to hearing and confession, and the Communion gives thanks for converts."
