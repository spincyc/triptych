notes = "The Garnier reissue of the volume, a different printing from the 1854 one this work's edition 1854-migne-pl-172 records; the two are separate editions and neither record describes the other's bytes. Registered on the pattern this library uses for a constituent of a Migne volume: the edition is the constituent as the volume prints it, and the artifact is the whole volume's text layer. The imprint and year were read on the page image of leaf n4, registered here, and agree with the text layer's front matter. The volume's Elenchus lists Gemma animae at column 541 (the layer reads '544'); the work runs to column 738, where the Sacramentarium follows on the same page, and stands at physical lines 42628-58295 of the text layer, from the heading 'HONORII AUGUSTODUNENSIS / OPERUM PARS TERTIA / LITURGICA / GEMMA ANEMAE' to 'melant.', the last word of Honorius's closing address. Book IV, the temporal Sundays in 'sub lege' and 'sub gratia' pairs, includes IV.84-86, the Eighteenth and Nineteenth Sundays, at lines 56955-57068."
