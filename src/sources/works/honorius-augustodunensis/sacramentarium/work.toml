description = "Honorius Augustodunensis's short exposition of the causes and mystical meaning of the Church's rites, printed by Migne in Patrologia Latina volume 172 under the running head SACRAMENTARIUM. Its chapter on the Advent of the Lord reads the four weeks, and the intermission of the Gloria in excelsis and of the dalmatic, as the time of the Old Testament under patriarchs, judges, kings and prophets. Its composition date is not established in this registration and is not recorded."
