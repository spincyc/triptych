notes = "The constituent as the 1895 Garnier reissue of PL 172 prints it, under the running head SACRAMENTARIUM (cols. 797-798 read). The imprint and year were read on 2026-11-18 on a fresh fetch of the title leaf n4, whose bytes hashed identically to the registered artifact.honorius-augustodunensis.gemma-animae.1895-garnier-migne-pl-172.ia-leaf-n4-1f98e4c8: 'PARISIIS / APUD GARNIER FRATRES, EDITORES ET J.-P. MIGNE SUCCESSORES, / IN VIA DICTA : AVENUE DU MAINE, 208 / 1895'. That leaf is not registered a second time here. Registered on 2026-11-18 by acquisition lane A3 because the volume's complete text layer is filed under another constituent, artifact.honorius-augustodunensis.gemma-animae.1895-garnier-migne-pl-172.ia-djvu-ocr-2ebfcb5f, and a derivative must stay inside its own edition. Aliases searched before creating this work: 'Sacramentarium', 'Sacramentarium seu de causis', 'honorius' across src/sources/works; only Gemma animae, Elucidarium and Speculum ecclesiae were held."
