notes = "The inspected title names both Patmores as translators, the second edition and 1884. The prefatory note assigns printed pp. 1–98 to Marianne Caroline and the rest to Coventry. The offered volume prints On the Love of God in eleven chapters, followed by Fragments from a Fragment and Three Rosaries of Our Lady. This record does not claim that the eleven-chapter English presentation contains every section of other editions; the appended texts and their attributions require separate inspection."
