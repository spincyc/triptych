context = "From the Fourth Sermon on the Virgin Mother (Bernard's fourth homily super Missus est), the appeal for Mary's answer, read on printed page 124 (PDF page 146) whole. Collated against PL 183 column 83 (homily IV, section 8, Exspectat angelus responsum)."
physical_line_ranges = [[1, 4]]
text = "Behold the Angel now awaits thy answer: “it is time that he should return to the Lord Who sent him.” We also, O Lady, await from thy lips the sentence of mercy and compassion, we who are so miserably groaning under the sentence of condemnation. For lo! the price of our salvation is now offered to thee: if thou wilt only consent, we shall at once be set at liberty. We have been created by the eternal Word of God, and behold we die: by thy momentary word we must be renewed and restored to life."
