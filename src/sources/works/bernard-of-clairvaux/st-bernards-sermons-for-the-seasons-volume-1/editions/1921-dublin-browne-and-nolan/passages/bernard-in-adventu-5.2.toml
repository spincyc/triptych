text = "Keep the word of God in the same way in which the food of thy body can be best preserved; for it is a living bread and the food of thy soul. Material bread, whilst it is kept in the cupboard may be stolen by thieves, or nibbled by mice, or may become stale and unfit for use. But once it has been assimilated, we have nothing further to fear from such possibilities. It is thus we should keep the word of God, for “blessed are they who keep it” so. Receive this spiritual bread, therefore, into the stomach of your minds, and having been there properly digested, let it be transmitted thence to the affections and the will. Do not forget (like David) to eat thy bread, lest thy heart (like his) should wither, but nourish thyself therewith that thy soul may be filled “as with marrow and fatness.”"
