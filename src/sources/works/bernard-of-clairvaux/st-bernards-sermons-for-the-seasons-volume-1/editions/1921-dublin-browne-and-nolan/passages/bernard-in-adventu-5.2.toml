notes = "The quoted extent is the latter part of section 2; its opening (the middle advent proved from John xiv. 23 and the question where the words are to be kept) stands earlier on printed page 41 and is not transcribed here. Bernard's Ne obliviscaris comedere panem tuum is rendered 'Do not forget (like David) to eat thy bread'; the parenthetical gloss is the translator's."
