notes = "TRANSLATION, NOT THE LATIN: where Bernard writes in primo ... in hoc medio ... in ultimo, this English numbers the comings first, second and third, and calls the middle coming 'this second' advent; its own title calls it 'the second and secret Advent'. 'Second advent' in this translation is therefore the hidden middle coming, not the Parousia. OCR AGAINST PAGE: the text layer's 'Consolatior' reads on the page as 'Consolation'."
