context = "The opening section of the Fifth Sermon for Advent, 'On the second and secret Advent, and how we are to keep the Words of Christ', on the hidden middle coming between the coming in the flesh and the coming in glory; read on printed pages 40-41 (PDF pages 62-63) from the sermon's title and its text John xiv. 23 to the end of the paragraph, with the opening of the next paragraph read so that the boundary is explicit. Collated against PL 183 columns 50-51 (sermo V, section 1)."
