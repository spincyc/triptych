text = "In my last sermon I told you, my brethren, that they who have covered their wings with silver must “sleep among the midst of lots.” I explained these lots to mean the two advents of Christ, but said nothing concerning the place of sleeping between them. This intermediate place is in fact another advent wherein such as have knowledge thereof enjoy a most pleasant repose. For whereas the other two are known to all, this is secret. In the first “He (Christ) was seen on earth and conversed with men,” when, as He Himself bears witness, “they both saw and hated” Him. In the last “all flesh shall see the Salvation of God,” and “they shall look on Him Whom they pierced.” But in that which intervenes He is hidden, visible only to the elect who see Him in themselves, and so their souls are saved. Therefore, in the first He came in the flesh and in weakness, in the second He comes in spirit and in virtue, and in the third He shall come in glory and majesty. For it is through virtue that glory is reached, as the Psalmist sings, “The Lord of virtues, He is the King of glory.” And similarly, the same Prophet says in another place, “In the sanctuary I have come before Thee, to see Thy virtue and Thy glory.” Thus, this intermediate advent is the way, so to speak, by which we must travel from the first to the last. In the first Christ was our Redemption, in the third He shall appear as our Life, whilst in this second He is our Repose and our Consolation, so that we may “sleep among the midst of lots.”"
