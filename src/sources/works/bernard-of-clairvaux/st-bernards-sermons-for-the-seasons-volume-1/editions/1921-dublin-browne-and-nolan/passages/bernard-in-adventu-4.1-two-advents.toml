context = "The opening of the Fourth Sermon for Advent, 'On true and false Virtue and that our Virtues must be modelled on the Virtues of Christ', on keeping both advents in mind, read on printed page 32 (PDF page 54) whole, with its translator's footnote, and the head of printed page 33 (PDF page 55). Collated against PL 183 column 47 (sermo IV, section 1)."
physical_line_ranges = [[1, 5]]
text = "It is fitting, my brethren, that we should celebrate this season of advent with all possible devotion, rejoicing in so great a consolation, marvelling at so great a condescension, inflamed with love by so great a manifestation of charity. But let us not think of that advent only whereby the Son of man has “come to seek and to save that which was lost,” but also of that other by which He will come again and will take us to Himself. Would to God you kept these two advents constantly in your thoughts, revolving them in assiduous meditation, pondering in your hearts how much we have received by the first, how much we are promised at the second! Would to God you were able thus to “sleep among the midst of lots”! For these two comings of the Lord are the two arms of the Bridegroom, between which the Bride was sleeping when she said, “His Left Hand is under my head, and His Right shall embrace me”; because, as we read elsewhere, “Length of days is in (His) Right Hand, and in (His) Left Hand riches and glory.”"
