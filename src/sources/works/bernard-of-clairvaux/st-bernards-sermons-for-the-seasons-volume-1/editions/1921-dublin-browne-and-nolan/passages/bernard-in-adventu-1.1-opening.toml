text = "To-day, my brethren, we celebrate the beginning of the season of advent. The name of this, as of all our other solemnities, is familiar enough and well known to the entire world. But perhaps the meaning of the name is not so generally understood. For the unhappy children of Adam, taken up as they are with the pursuit of things transitory and perishable, pay but little attention to what is salutary and true."
