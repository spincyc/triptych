notes = "The first word is set in a capital and small capitals (TO-DAY) and is transcribed in ordinary case. The page's 'oi the name' is a broken f, read as 'of'. Bernard's sentence that the name of the feast is well known but its ratio is not is rendered 'the meaning of the name is not so generally understood'."
