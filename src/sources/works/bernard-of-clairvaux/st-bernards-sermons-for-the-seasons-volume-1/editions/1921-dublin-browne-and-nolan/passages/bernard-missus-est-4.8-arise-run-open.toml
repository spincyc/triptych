text = "Make haste, therefore, to answer the Angel, or rather to answer the Lord through the Angel. Say the word and receive the Word. Utter thy human word and conceive the Divine Word. Pronounce the transitory word and embrace the Word everlasting. Why dost thou hesitate? Wherefore dost thou fear? Believe, consent, and receive into thy womb the Word of the Father. Let thy humility take courage, let thy modesty be confident. It is in nowise expedient now that thy virginal simplicity should be forgetful of prudence. O Virgin most prudent, in this matter alone thou mayest put aside all fear of presumption, because although modesty pleases by its silence, yet more necessary for us now is the charity of speech. O happy Virgin, open thy heart to faith, open thy lips to consent, open thy bosom to thy Creator. Behold the Desired of all nations is standing outside and knocking at thy door. Oh, if He should pass on whilst thou delayest to open, and thou shouldst have to begin once more to seek with sorrow “Him Whom thy soul loveth”! Arise, therefore, and make haste to open to Him. Arise by faith, make haste by devotion, open by consent."
