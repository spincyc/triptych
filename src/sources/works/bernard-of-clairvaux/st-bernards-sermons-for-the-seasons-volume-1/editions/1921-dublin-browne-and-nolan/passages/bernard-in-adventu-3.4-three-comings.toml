notes = "The page italicizes to, into and against in the first sentence of section 4; the italics are not recorded. 'The second advent' here renders Bernard's de secundo, qui spiritualis et occultus est, the coming into men, not the Parousia. The Latin's de secundo follows primus et tertius noti sunt: the English 'His coming to men and His coming against men are too well known to need elucidation' is a paraphrase."
