physical_line_ranges = [[1, 6]]
text = "But how couldst thou have known this, if not because He not only came to thee, but even came into thee? There are three distinct comings of the Lord of which I know, His coming to men, His coming into men, and His coming against men. He comes to all men indifferently, but comes not into all or against all. His coming to men and His coming against men are too well known to need elucidation. But concerning the second advent, which is spiritual and invisible, listen to what He says Himself, “If any man love Me, he will keep My word, and My Father will love him, and We will come to him and will make Our abode with him.” Blessed is the man with whom Thou, Lord Jesus, makest Thy abode!"
