text = "My brethren, if you thus keep the word of God, there can be no doubt that it, in turn, shall keep you. For the Son will come to you with the Father, the great Prophet will come to you to rebuild the Jerusalem of your souls and to make all things new. This is the work which the second advent shall accomplish, “that as we have borne the image of the earthly” so may we “bear the image of the heavenly (man).”"
