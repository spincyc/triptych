notes = "Identified from the page images of Internet Archive item stbernardssermon0001prie_y4z3 (scan station53.cebu.archive.org; the copy carries the stamp of Alma College), read on 2026-11-18. The title page (artifact PDF page 9) reads: ST. BERNARD'S SERMONS FOR THE SEASONS & PRINCIPAL FESTIVALS OF THE YEAR / TRANSLATED FROM THE ORIGINAL LATIN / BY / A PRIEST OF MOUNT MELLERAY / VOL. I. / BROWNE AND NOLAN, LIMITED / DUBLIN BELFAST CORK WATERFORD. The facing approbations (PDF page 10): Nihil obstat, Fr. Stanislaus Hickey, O.C.R., Censor, 28 March 1921; Imprimatur, Fr. Augustinus Marre, Abbot General O.C.R., 2 April 1921; Nihil obstat, Gulielmus Canonicus Byrne, S.T.L.; Imprimi potest, Bernardus, Bishop of Waterford and Lismore, Waterford, 14 April 1921. DATE: the year 1921 is inferred from those approbations and from the translator's preface dated 16 January 1921; it is not printed on the title page, and the Internet Archive catalogue date 1921 is not relied on. No year later than 1921 occurs anywhere in the volume's text layer. TRANSLATOR: the title page names only A Priest of Mount Melleray; no name is supplied here. TRANSLATION BASE: the translator's preface (printed pp. vii-viii, read in the text layer only) says the three volumes translate the Saint's Sermons 'de Tempore' and 'de Sanctis', and quotes Mabillon's preface to his third tome; which printed Latin text was translated is not stated there and was not established here. CAUTIONS FOR CONSUMERS: the translation is free in places; in Advent Sermon V the translator numbers the comings first, second (the secret, intermediate advent) and third, where the Latin says medius and ultimus, so 'second advent' in this English is not the Parousia. Its sermon and section numbering follows the Latin series but the English carries no section numbers; a passage locus supplies the section by collation with Migne's Patrologia Latina 183 (edition.jacques-paul-migne.patrologia-latina-volume-183.1854-paris). Registered 2026-11-18 for the Advent primer research as a new container record beside, and without altering, Bernard's existing work records."
