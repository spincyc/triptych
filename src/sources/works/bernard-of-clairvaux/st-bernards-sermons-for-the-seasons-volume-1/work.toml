composed_basis = "The English volume as a compilation and translation: the translator's preface is dated Feast of the Holy Name of Jesus, January 16th, 1921, and the approbations 28 March to 14 April 1921 (artifact PDF page 10, read on the image). The twelfth-century sermons it translates are dated on their own work records, not on this one."
description = "The first volume of an English translation, by an anonymous priest of Mount Melleray Abbey, of Bernard of Clairvaux's sermons for the liturgical year. It is a translation-anthology container: its container identity is distinct from the works of Bernard it prints in English. Its contents (artifact PDF pages 19-22, read in the PDF's text layer and checked against the page images for the Advent and Virgin Mother entries) are: Sermons for Advent I-VII (Bernard's Sermones in adventu Domini; printed pp. 1-51); On the Glories of the Virgin Mother, with the Author's Preface and four sermons (Bernard's Homiliae super Missus est, work.bernard-of-clairvaux.homiliae-super-missus-est; from p. 53); Sermons on Psalm XC, with the Author's Preface and seventeen sermons (Bernard's Sermones in psalmum Qui habitat, work.bernard-of-clairvaux.sermones-in-psalmum-qui-habitat); six Sermons for Christmas Eve (from p. 309); five Sermons for Christmas Day; one for the Feast of the Holy Innocents; two for the Feast of the Circumcision; one for the Octave of the Circumcision (p. 435); and St. Bernard's Hymn to the Name of Jesus (p. 447). The translator's preface says the volume is the first of three of Sermons for the Seasons and the Principal Festivals; the other two volumes are not registered. A locus is printed page; a passage names the constituent work and its sermon and section in its own locus."
