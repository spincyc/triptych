description = "Bernard's five sermons for the feast of All Saints, as Mabillon's edition prints them among the Sermones de sanctis. Sermo I is headed De lectione evangelica, Videns Jesus turbas (Matth. v, 1-12) and comments on the beatitudes. Of the others only these places have been read for the record: sermo II nn. 1 and 4 (the saints' intercession; their souls' rest before the resurrection) and sermo V nn. 2, 3 and 5 (the hidden holiness of those still fighting, the fear of God, and why the saints are venerated); sermones III and IV have not been read. A locus is sermon and section."
