notes = "Mabillon's third edition as reprinted in PL 183 (see edition.jacques-paul-migne.patrologia-latina-volume-183.1854-paris); the numbered footnotes are the editors'. Pairing search on 2026-10-27 was bounded to the library's record files and the containment inventory under Bernard, Bernardus, Clairvaux, Clarae-Vallensis, PL 183, Patrologia Latina 183, omnium Sanctorum and All Saints: no prior record of these sermons was found. PAIRING: the work is held in its original Latin only. The same library searches, and tools/source-reader list --find under Bernard, Bernardus, omnium Sanctorum, All Saints and Patrologia Latina 183, found no English edition of these sermons; the research stage that read them sought none, and the registration stage does not retrieve, so no English translation was sought on the network and none is registered. No critical edition (Leclercq-Rochais) was reached or collated."
