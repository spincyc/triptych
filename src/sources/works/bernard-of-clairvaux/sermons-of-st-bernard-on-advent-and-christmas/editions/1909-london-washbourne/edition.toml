notes = "Identified from the page images of Internet Archive item sermonsofstberna00bernuoft (University of Toronto copy, Kelly Library; the title page carries the stamp of Holy Redeemer Library, Windsor), read on 2026-11-18. The title page (artifact PDF page 3) reads: SERMONS OF ST. BERNARD ON ADVENT & CHRISTMAS / INCLUDING THE FAMOUS TREATISE ON THE INCARNATION CALLED \"MISSUS EST\" / Compiled and translated at St. Mary's Convent, York, from the Edition (1508), in black-letter, of St. Bernard's Sermons and Letters / [CHIEFLY FOR CONVENTS] / WITH INTRODUCTION BY THE RIGHT REV. J. C. HEDLEY, O.S.B., BISHOP OF NEWPORT / R. & T. WASHBOURNE, LTD. ... 1909 / [All rights reserved]. TRANSLATION BASE: by its own title page the translation was made from a black-letter edition of 1508 of Bernard's sermons and letters, not from Mabillon or Migne; that 1508 edition was not identified or collated here, so a difference from Migne's text may be the base's and not the translator's. HEDLEY'S STATEMENT OF OMISSIONS AND LIBERTIES (introduction, printed pp. v-vii, PDF pages 7-9, read on the images; checked transcription in this edition): 'These sermons are fully and conscientiously translated. A few omissions have been made—chiefly, it would seem, through sheer inability to present in an acceptable modern version all the devout and fanciful dealings of the holy Doctor with the text of the Scripture.' and 'In one or two places considerable liberty has been taken with the text of the sermons.' He names one instance: the sermon on the Circumcision (p. 135) has been combined with passages of the fifteenth sermon on the Canticle, and he notes that the comparison of the Holy Name to lightning (tanquam fulgur egrediens) and the closing contrast of the healing of one cripple with the illumination of multitudes of blind are left out. Consumers quoting this translation must therefore treat it as a free version whose silences are not evidence of the Latin. The translator is unnamed on the title page and in the introduction. The 1909 [All rights reserved] notice is the publisher's reservation of a term that has since expired; see the artifacts' rights_basis. Registered 2026-11-18 for the Advent primer research as a new container record beside, and without altering, Bernard's existing work records."
