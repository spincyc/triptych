text = "Answer, then, quickly to the angel—yes, through the angel give your consent to your God. Answer the word, receive the Word. Utter yours, conceive the Divine. Speak the word that is transitory, and embrace the Word that is everlasting. Why do you delay? Why are you fearful? Believe—confess—receive. Let humility put on courage, and timidity confidence. It is certainly by no means fitting that virginal simplicity should forget prudence. Yet in this one case only the prudent virgin need not fear presumption, because, though modesty shone forth in her silence, it is now more necessary that her devotion and obedience should be revealed by her speech. Open, O Blessed Virgin, your heart to faith, your lips to compliance, your bosom to your Creator. Behold, the desired of all nations stands at the gate and knocks. Oh, suppose He were to pass by while you delay! How would you begin again with sorrow to seek Him whom your soul loveth! Arise—run—open! Arise by faith, run by devotion, open by acceptance."
