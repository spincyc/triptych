text = "Other references might be quoted equally suitable to the Virgin Mother and to the Son of God—Gideon’s fleece, for instance, cut from the flesh without wounding it, and placed on the dry ground, where the dry fleeces are in turn moistened by the dew. This similitude represents the flesh assumed from the flesh of Mary without injury to her virginity. Upon it Heaven dropped down dew, filling it with the plenitude of the Divinity, and from that fullness we have all received—we who, but for it, were as parched and arid soil. The Psalmist seems to refer very beautifully to this fact in Gideon’s history. In Ps. lxxi. we read: “He shall descend like rain upon the fleece, and as showers falling gently upon the earth.” Gently at first, and without noise of human operation, He fell softly into the Virgin’s womb; afterwards, when the Apostles announced Him, it was with the noise of words and the display of miracles."
