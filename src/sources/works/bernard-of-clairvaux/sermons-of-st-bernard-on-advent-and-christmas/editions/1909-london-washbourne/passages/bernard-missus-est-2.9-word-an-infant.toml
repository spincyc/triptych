context = "From the second homily on the Missus est, Bernard's answer to Jeremiah's a woman shall encompass a man, from There is seen length abbreviated on printed page 39 (PDF page 51) to death restores life on printed page 40 (PDF page 52). Collated against PL 183 column 65 (homily II, section 9: Porro ibi agnoscitur longitudo brevis ... lux non lucens, verbum infans, aqua sitiens, panis esuriens), read on the page image (PDF page 39 of artifact.jacques-paul-migne.patrologia-latina-volume-183.1854-paris.internet-archive-pdf-7a1e1e7a (SHA-256 7a1e1e7ab631b45d67fa8eb9c1185486cdf032b9d23639af58a3776273b55fd1))."
physical_line_ranges = [[1, 4]]
text = "There is seen length abbreviated, width straightened, height lowered, depth filled up. There we behold light withholding its rays, the Word an infant, the Living Water athirst, Him Who is the Bread of Heaven suffering hunger. Attend and see how Omnipotence is ruled, Wisdom instructed, Power sustained; the God Who rejoices the angels is become a Babe at the breast; He Who consoles the afflicted lies weeping in a manger. Attend and see how joy is made sorrowful, strength becomes weakness, life death; but—what is equally wonderful—that sorrow gives joy, that weakness imparts strength, that death restores life."
