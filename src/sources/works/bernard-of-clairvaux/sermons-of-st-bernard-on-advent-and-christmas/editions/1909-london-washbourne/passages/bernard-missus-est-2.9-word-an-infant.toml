notes = "The page sets There (the first word) and that in that sorrow gives joy in italic (omitted). The Latin's four short phrases lux non lucens, verbum infans, aqua sitiens, panis esuriens are rendered light withholding its rays, the Word an infant, the Living Water athirst, Him Who is the Bread of Heaven suffering hunger."
