context = "From the first sermon for the Vigil of the Nativity, the paragraph after the refrain Jesus Christ, the Son of God, is born in Bethlehem of Juda, from Behold what condescension on printed page 78 (PDF page 90) to call thee blessed on printed page 79 (PDF page 91). Collated against PL 183 columns 88-89 (sermo I, section 4: Et vide dignationem. Non in Jerusalem, civitate regia; sed in Bethlehem ... O Bethlehem parva ... praesepii gloriam), read on the page images (PDF pages 50-51 of artifact.jacques-paul-migne.patrologia-latina-volume-183.1854-paris.internet-archive-pdf-7a1e1e7a (SHA-256 7a1e1e7ab631b45d67fa8eb9c1185486cdf032b9d23639af58a3776273b55fd1))."
physical_line_ranges = [[1, 7]]
text = "Behold what condescension! It is not in the royal city of Jerusalem, but in Bethlehem, which is the least of the thousands of Juda. O Bethlehem! O little Bethlehem! once little, now magnified by the Lord! He has magnified thee Who, though great, became little in thee. Rejoice, O Bethlehem, and make holiday in thy streets with songs of Alleluia! What city on hearing of thy good fortune will not envy thee that most precious stable and the glory of its manger? In all the wide world thy name is now celebrated, and all generations call thee blessed."
