context = "The opening of the first sermon for the Vigil of the Nativity, headed I. On the Joy His Birth Should Inspire, printed page 75 (PDF page 87), after a headpiece set in smaller type (The voice of gladness hath resounded in our land ... but thou beyond others, O man!), which renders the opening of section 1 in the Latin. Collated against PL 183 column 87 (In vigilia Nativitatis Domini, sermo I, De pronuntiatione Martyrologii, section 1: Jesus Christus, Filius Dei, nascitur in Bethlehem Judae ... O breve verbum de Verbo abbreviato), read on the page image (PDF page 50 of artifact.jacques-paul-migne.patrologia-latina-volume-183.1854-paris.internet-archive-pdf-7a1e1e7a (SHA-256 7a1e1e7ab631b45d67fa8eb9c1185486cdf032b9d23639af58a3776273b55fd1))."
physical_line_ranges = [[1, 9]]
text = "Jesus Christ, the Son of God, is born in Bethlehem of Juda. What heart so stony as not to be softened at these words? What soul is not melted at this voice of her Beloved? What announcement could be sweeter? what intelligence more enrapturing? Was its like ever heard before? or when did the world ever receive such tidings? Jesus Christ, the Son of God, is born in Bethlehem of Juda. O short word, telling of the Eternal Word abbreviated for us! O word full of heavenly delights! The heart is oppressed by its mellifluous sweetness, and longs to pour forth its redundant riches, but words refuse their service. So overpowering is the music of this short speech that it loses melody if one iota is changed."
