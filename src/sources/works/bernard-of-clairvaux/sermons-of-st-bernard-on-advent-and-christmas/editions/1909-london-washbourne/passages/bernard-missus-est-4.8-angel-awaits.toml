context = "From the fourth homily on the Missus est, the appeal for Mary's answer, read on printed page 68 (PDF page 80) whole. Collated against PL 183 column 83 (homily IV, section 8, Exspectat angelus responsum ... ut ad vitam revocemur)."
physical_line_ranges = [[1, 5]]
text = "The angel awaits your reply, for it is time that he should return to God, Who sent him. We, too, are waiting, O Lady, for a word of mercy—we, who are groaning under the sentence of condemnation. See, the price of our salvation is offered to you; if you consent, we shall at once be delivered. By the Eternal Word of God we were all created, and behold we die. By your short answer we shall be refreshed and recalled to life."
