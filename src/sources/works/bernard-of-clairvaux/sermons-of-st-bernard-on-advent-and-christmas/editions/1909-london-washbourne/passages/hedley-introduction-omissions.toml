notes = "The introduction goes on (printed pp. vi-vii) to say that some passages were found too 'quaint' to be reproduced; that 'in one or two places considerable liberty has been taken with the text'; that the Circumcision sermon (p. 135) has been combined with the Fifteenth Sermon on the Canticles; and that the translation misses the tanquam fulgur egrediens of that passage and leaves out its closing contrast. Those are summarized here, not transcribed. A consumer quoting this volume as Bernard should check the Latin for each sentence."
