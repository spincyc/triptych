context = "From the first sermon for the Vigil of the Nativity, on why Christ chose poverty, printed page 80 (PDF page 92), from There was an endless supply to He loves to be clothed. Collated against PL 183 column 89 (sermo I, section 5: paupertas non inveniebatur in eis ... Adorna thalamum tuum, Sion; sed humilitate, sed paupertate. In his enim pannis complacet sibi, et Maria testimonium perhibet), read on the page image (PDF page 51 of artifact.jacques-paul-migne.patrologia-latina-volume-183.1854-paris.internet-archive-pdf-7a1e1e7a (SHA-256 7a1e1e7ab631b45d67fa8eb9c1185486cdf032b9d23639af58a3776273b55fd1))."
physical_line_ranges = [[1, 6]]
text = "There was an endless supply of these treasures in heaven, but poverty could not be found there. Earth abounded and superabounded in this kind of merchandise, and men knew not it’s value. The Son of God was desirous of it. He came down from heaven to make it His own, and so render it precious to us by His choice. Adorn thy bridal-chamber, O Sion, O devout soul, but with humility, but with poverty. These are the swathing-bands that please our Infant Jesus; these are the rich robes in which Mary tells us He loves to be clothed."
