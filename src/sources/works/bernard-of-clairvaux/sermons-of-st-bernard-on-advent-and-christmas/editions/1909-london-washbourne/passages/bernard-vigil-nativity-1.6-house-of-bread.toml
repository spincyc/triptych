context = "From the first sermon for the Vigil of the Nativity, the paragraph on the name Bethlehem of Juda, printed page 80 (PDF page 92), from Remember, too to fitted to receive our Lord. Collated against PL 183 column 89 (sermo I, section 6: Considera denique quod in Bethlehem Judae nascitur ... Bethlehem quippe domum panis, Juda sonat confessionem), read on the page image (PDF page 51 of artifact.jacques-paul-migne.patrologia-latina-volume-183.1854-paris.internet-archive-pdf-7a1e1e7a (SHA-256 7a1e1e7ab631b45d67fa8eb9c1185486cdf032b9d23639af58a3776273b55fd1))."
physical_line_ranges = [[1, 3]]
text = "Remember, too, that it is in Bethlehem of Juda that Jesus is born; and be very careful lest you fail to be found there, lest He fail to be received by you. Bethlehem is the house of bread; Juda signifies confession or praise. If, then, you replenish your soul with the food of the Divine Word, the Body of our Lord Jesus Christ, and devoutly receive the Bread which came down from heaven, and which giveth life to the world; if the vessel of your body is made strong and able to hold the new wine by being refreshed and strengthened with His new and glorified flesh; if, moreover, you live by faith, and have no need to weep because you have forgotten to eat your bread, then, indeed, you are become a Bethlehem fitted to receive our Lord."
