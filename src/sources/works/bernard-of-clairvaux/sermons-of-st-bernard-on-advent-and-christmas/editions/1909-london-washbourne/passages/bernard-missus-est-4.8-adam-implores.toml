text = "Adam, with all his race—Adam, a weeping exile from Paradise, implores it of you. Abraham entreats you, David beseeches you. This is the object of the burning desires of the holy fathers, of your fathers, who are still dwelling in the region of the shades of death. Behold the entire human race prostrate at your feet in expectation. And rightly, for on your word depend the consolation of the wretched, the redemption of the captive, the freedom of the condemned, the salvation of your entire race, of all the children of Adam. Hasten, then, O Lady, to give your answer; hasten to speak the word so longed for by all on earth, in limbo, and in heaven. Yea, the King and Lord of all things, Who has greatly desired your beauty, desires as eagerly your word of consent, by which He has purposed to save the world."
