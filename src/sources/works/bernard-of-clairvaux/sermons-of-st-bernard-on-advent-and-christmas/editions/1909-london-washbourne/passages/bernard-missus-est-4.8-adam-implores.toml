notes = "The page sets your in of your fathers in italic (omitted). The translation renders totus mundus tuis genibus provolutus exspectat as Behold the entire human race prostrate at your feet in expectation, and quod terra, quod inferi, quod exspectant et superi as so longed for by all on earth, in limbo, and in heaven. PL 183 footnote 8 on this column points to similar words in the appendix of Augustine's sermons (Appendix, sermon 120, n. 7)."
