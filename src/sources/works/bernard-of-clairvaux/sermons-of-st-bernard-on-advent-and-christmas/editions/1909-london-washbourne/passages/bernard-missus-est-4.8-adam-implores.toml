context = "From the fourth homily on the Missus est, the sentences that follow By your short answer we shall be refreshed and recalled to life (passage bernard-missus-est-4.8-angel-awaits), from the foot of printed page 68 (PDF page 80) to save the world on printed page 69 (PDF page 81). Collated against PL 183 column 83 (homily IV, section 8: Hoc supplicat a te, o pia Virgo, flebilis Adam cum misera sobole sua exsul de paradiso ... Ipse quoque omnium Rex et Dominus ... salvare mundum), read on the page image (PDF page 48 of artifact.jacques-paul-migne.patrologia-latina-volume-183.1854-paris.internet-archive-pdf-7a1e1e7a (SHA-256 7a1e1e7ab631b45d67fa8eb9c1185486cdf032b9d23639af58a3776273b55fd1))."
