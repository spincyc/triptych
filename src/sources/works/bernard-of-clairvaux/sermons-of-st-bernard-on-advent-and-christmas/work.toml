description = "An English translation-anthology of nineteen of Bernard of Clairvaux's sermons for Advent and Christmastide, made by a member of the community of St Mary's Convent, York, with an introduction by Bishop J. C. Hedley. Its container identity is distinct from the works of Bernard it prints in English. Hedley's introduction (printed p. v, read on the image) lists the contents: of the seven sermons De Adventu Domini in Mabillon's edition, the first two; the four homilies on Missus est (Bernard's Homiliae super Missus est, work.bernard-of-clairvaux.homiliae-super-missus-est); of the six for the Vigil of Christmas, the first, fourth and sixth; all five for Christmas Day; two on the Circumcision; and three on the Epiphany. The printed contents (PDF pages 5-6) place Advent I-II from p. 1, Missus est I-IV from p. 33 (IV at p. 60), the Vigil from p. 75, the Nativity from p. 101, the Circumcision at p. 135, the Holy Name at p. 141 and the Epiphany from p. 151. A locus is printed page; a passage names the constituent work and its homily or sermon and section in its own locus."
