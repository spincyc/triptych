description = "The letter collection of Bernard of Clairvaux (1090/91-1153), transmitted in the Benedictine edition of Jean Mabillon (Paris, 1690) and its descendants. Letter numbering differs between editions: the letter to the canons of Lyons on the Conception of the Blessed Virgin Mary, commonly cited as Ep. 174, is numbered XLV in the Eales English selection."
