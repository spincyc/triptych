notes = "The title explicitly calls this Chrysostom Liturgy an extract from the great Liturgiarion for convenient use, with Sunday, Marian, petition and departed services. The 49-image public PDF includes the title, a front engraving, printed pages 1–46 and an inserted Crucifixion engraving at image 25. It is not a complete Sluzhebnik. All images were surveyed as contact sheets; title, preparation pages and the final printed page were inspected individually."
