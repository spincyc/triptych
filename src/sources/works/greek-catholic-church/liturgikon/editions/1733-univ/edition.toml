notes = "The title wording comes from NBUV's catalog record https://irbis-nbuv.gov.ua/dlib/item/0003876 . The offered 646-image scan lacks its printed title and earlier front leaves: image 1 starts within a calendar index. The original colophon at image 640 identifies Univ and the year 1733, with Athanasius Sheptytsky named. Images 641–646 contain a separately headed order for the read Divine Liturgy on three unnumbered leaves. Complete offered digital bytes were acquired; the original volume was not collated for completeness."
