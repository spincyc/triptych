context = "Immediately after the colophon, image 641 begins a separately headed order for the read Divine Liturgy, Чинъ служенїя Божественной Лїтургїи чтомой (heading reported with abbreviations expanded and accent marks omitted). It begins after ordinary proskomedia and directs Gospel and service-book placement, bows, opening prayers and antiphons. Image 642 covers Trisagion, Epistle and Gospel, prayers and the Cherubic hymn; 643 directs the diskos and chalice, Creed and pre-anaphoral dialogue; 644 gives institution-narrative handling and the epiclesis; 645 covers memorials, the Lord's Prayer, fraction and priest's communion; 646 continues communion, ablutions, thanksgiving and dismissal, ending with an ornament. All six images were inspected. This verifies the existence and extent of the distinct ordered rubric, not the first appearance of every individual practice."
