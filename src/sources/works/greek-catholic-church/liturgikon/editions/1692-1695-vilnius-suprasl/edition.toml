notes = "The acquired copy bears the handwritten shelfmark Кир. 5232 on part 1, image 2; it is not silently equated with separately cataloged copy Кир.1269п. The first PDF part, image 5, carries the Vilnius 1692 title; the second part, image 344, carries the Suprasl 1695 colophon. NBUV catalogs the combined book as 660 pages. The two complete offered PDF parts contain 316 and 349 images, including covers and blank leaves. This is not a claim that the original book has been collated throughout. Inspection of the final printed folio and following blank leaves supplies a bounded terminal comparison with the separately appended read-Liturgy order in Univ 1733."
