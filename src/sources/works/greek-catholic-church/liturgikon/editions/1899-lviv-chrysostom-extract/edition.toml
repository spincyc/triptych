notes = "The original title identifies a Chrysostom Liturgy extracted from the great Liturgiarion, with services for various intentions, the departed and a Jubilee order. Image 2 prints metropolitan approval dated 1897 and signed by Sylvester Cardinal Sembratovych. Images 1–78 contain the title, approval and printed pages 1–76. The downloaded 104-image bundle then appends another 26 images numbered 645–670, repeating intentions and Jubilee material without an identifying title. Those trailing pages are not attributed to the 1899 edition. This booklet is not a complete great Liturgiarion."
