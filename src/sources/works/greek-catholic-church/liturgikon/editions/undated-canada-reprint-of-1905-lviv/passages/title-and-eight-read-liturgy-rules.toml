context = "Direct page images identify the later Canadian reprint and the eight numbered read-Liturgy rules. At printed 320 rule 3 excludes incense, rule 4 omits the Gospel entrance, rule 5 omits the high-place ceremony, rule 6 faces the Gospel toward the people, rule 7 omits the Great Entrance, and rule 8 keeps the closing blessing/dismissal at the altar. Rule 1 arranges covered vessels carried to the altar; the word sacristy is not stated there. The 1941 circular describes the sacristy practice. These are witness readings in the reprint, not an independent verification of every 1905 printing."
