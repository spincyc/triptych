notes = "Direct reading from 220-dpi rendered PNG images (and column zooms) of Asmara 1914/15 PDF pp. 40, 44-45. UTF-8 NFC, LTR Ethiopic script (U+1200-U+137F), LF line endings. Preserves native Ge'ez fidel vowel orders, labiovelars (ኰ, ቍ, ኵ, ቍዓ, etc.), and Ethiopic numerals (፪, ፫, ፭, ፮). Standardizes Ethiopic punctuation as printed: wordspace '፡' (U+1361), full stop '።' (U+1362), comma '፣' (U+1363), preface/question stop '፧' (U+1367). Retains printed speaker cues (ይ፡ ካ። = priest, ይ፡ ሕ። = people, ይ፡ ዲ። = deacon, ካ፡ ን። = assistant priest), inline red gesture cues such as (አማሪ) ('pointing') and bracketed [ወእምድኅረ፡ ንስቲት], quotation marks around the consecration words (”...”), and printed crosses as '✠'. Line wraps within speakers/rubrics joined cleanly; each speaker turn or rubric block occupies one physical line. Excludes page numerals (፳፱, ፴), ornament and colour."
