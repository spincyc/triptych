transformation = "Direct reading from 220-dpi rendered PNG images (and column zooms) of Asmara 1914/15 PDF pp. 40, 44-45. UTF-8 NFC, LTR Ethiopic script (U+1200-U+137F), LF line endings. Preserves native Ge'ez fidel vowel orders, labiovelars (ኰ, ቍ, ኵ, ቍዓ, etc.), and Ethiopic numerals (፪, ፫, ፭, ፮). Standardizes Ethiopic punctuation as printed: wordspace '፡' (U+1361), full stop '።' (U+1362), comma '፣' (U+1363), preface/question stop '፧' (U+1367). Retains printed speaker cues (ይ፡ ካ። = priest, ይ፡ ሕ። = people, ይ፡ ዲ። = deacon, ካ፡ ን። = assistant priest), inline red gesture cues such as (አማሪ) ('pointing') and bracketed [ወእምድኅረ፡ ንስቲት], quotation marks around the consecration words (”...”), and printed crosses as '✠'. Line wraps within speakers/rubrics joined cleanly; each speaker turn or rubric block occupies one physical line. Excludes page numerals (፳፱, ፴), ornament and colour."
notes = "Bounded Ge'ez Anaphora of the Holy Apostles core constituent of the Asmara Catholic missal (imprint year ፲፱፻፯ = 1914/15; Roman approbation 25 Feb 1913; Asmara imprimatur 12 Apr 1913; ULB Bonn Goussen 1665, PDF pp. 40, 44-45): title and opening Eucharistic dialogue plus opening Preface (ነአኵተከ) on PDF p. 40; Christological preface continuation, Sanctus, Post-Sanctus, Institution Narrative (bread and cup), Anamnesis, Epiclesis (preserving the distinctive Asmara 1914/15 formula በተመጥዎተ፡ ዝንቱ፡ ኅብስት፡ ወጽዋዕ...), unity prayer and concluding doxology/peace on PDF pp. 44-45 (printed pp. ፳፱-፴ / 29-30), terminating at the decorative bar immediately before the Prayer of Fraction (ጸሎተ፡ ፈትቶ) and Our Father on PDF p. 46. Excludes the intervening Alexandrian intercessions and Prayer of Blessing (PDF p. 40 col. 2 lower half through p. 41), blank verso p. 42, and full-page Crucifixion illustration p. 43."
