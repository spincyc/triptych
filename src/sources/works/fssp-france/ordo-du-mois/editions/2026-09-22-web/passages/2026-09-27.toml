context = "The September 2026 section identifies Sunday 27 September as the eighteenth Sunday after Pentecost, second class, with green vestments, adding an optional solemnity of St Thérèse of the Child Jesus."
notes = "Inspected as independent dated occurrence corroboration, not as a controlling 1962 missal and not as a source for any local calendar. No page quotation is retained. ONE DEFECT IN THE WITNESS IS RECORDED RATHER THAN SMOOTHED: the page prints two consecutive paragraphs headed Dimanche 27 septembre, the second reading de la férie (4ème classe, Vert). A fourth-class feria cannot occur on a Sunday under the 1962 Rubricae generales, the following paragraph is correctly headed Lundi 28 septembre, and the second row is therefore an error in this witness. It does not disturb the Sunday's identification, which the first row carries."
