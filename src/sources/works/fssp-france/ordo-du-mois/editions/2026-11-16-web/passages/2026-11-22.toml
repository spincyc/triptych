context = "The November 2026 section lists Dimanche 22 novembre: 24e et dernier dimanche avant la Pentecôte (2ème classe, Vert), between the Presentation of Our Lady on Saturday 21 November (2ème classe, Blanc) and saint Clément on Monday 23 November (3ème classe, Rouge). 'avant' is the page's slip for 'après': the entry names the twenty-fourth and last Sunday. The page gives one line per day and names no commemoration, Preface or last Gospel; its silence on them is not a statement about them."
notes = "Inspected as a dated institutional witness of usage under the 1962 books, not as a controlling Missal. Its rank for 21 November differs from the universal Calendarium (III classis) and is not relied on. No page quotation beyond the entry heading is retained."
