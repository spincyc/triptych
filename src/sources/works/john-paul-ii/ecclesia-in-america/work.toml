description = "The post-synodal apostolic exhortation of 22 January 1999 for the Special Assembly for America of the Synod of Bishops, given at Mexico City. Its paragraph 11 is the fullest magisterial statement on Our Lady of Guadalupe: it narrates the appearance to Juan Diego at Tepeyac in 1531, records that the Virgin of Guadalupe is venerated as Queen of all America and invoked as Patroness of all America and Star of the first and new evangelization, and welcomes the Synod Fathers' proposal that the feast be celebrated throughout the continent on 12 December. The text is numbered in 76 sections, the locus system used here."
