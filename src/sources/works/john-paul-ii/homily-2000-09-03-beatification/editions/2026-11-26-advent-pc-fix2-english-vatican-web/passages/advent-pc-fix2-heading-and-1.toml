context = "The page is headed Beatification of Pius IX, John XXIII, Tommaso Reggio, Guillaume-Joseph Chaminade, Columba Marmion and dated Sunday, 3 September 2000. In section 1 the Pope says that, in the context of the Jubilee Year, he has declared blessed two Popes, Pius IX and John XXIII, with three others. Section 2 is devoted to Pius IX (Giovanni Maria Mastai Ferretti), recalling the First Vatican Council and the definition of the Immaculate Conception. Supports the descriptor that Pius IX was beatified on 3 September 2000. Restricted: paraphrase only."
