description = "The letter of John Paul II dated at the Vatican 6 May 1996, associating the Pope with the 150th anniversary of the apparition of La Salette: it reads the event through the crucifix borne on the figure's breast, presents the tears as help toward grasping the gravity of sin and the wounded fidelity of the Redeemer, states the message's content as penance, perseverance in prayer, and fidelity to Sunday practice with the charge that it pass to all her people, and encourages the Missionaries of La Salette, the Sisters of La Salette, and related institutes. A companion Latin letter of 9 July 1996 appointed Cardinal Henri Schwery, Bishop emeritus of Sion, extraordinary legate to the solemn commemoration of 19 September 1996, and describes the event with the verb perhibetur: the hundred and fiftieth year 'ex quo tempore Nostra Domina Saletensis apparuisse ab Ecclesia Matre perhibetur'. Neither letter was found in the Acta Apostolicae Sedis volume for 1996. Loci are the parts of the letter."
