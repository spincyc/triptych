description = "The third of three catecheses given at the Wednesday general audiences of 21 and 28 July and 4 August 1999 on heaven, hell, and purgatory, in four numbered paragraphs. A general audience address is an act of the ordinary papal magisterium in its least solemn form; it teaches authoritatively but defines nothing, and this one expressly restates the Catechism rather than adding to it."
