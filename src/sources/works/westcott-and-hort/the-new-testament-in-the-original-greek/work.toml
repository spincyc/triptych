description = "The critical Greek New Testament of Westcott and Hort, published in 1881, with the companion Introduction and Appendix of 1882. The Appendix's Notes on Select Readings sets out the editors' reasoning on individual variants, including the series of what they called Western non-interpolations in Luke 24, of which Luke 24:12 is the fifth. Their exclusion of that verse is a minority position today."
