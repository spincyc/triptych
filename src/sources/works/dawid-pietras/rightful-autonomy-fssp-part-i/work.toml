description = "A peer-reviewed canon-law article published in Prawo Kanoniczne 69/1 (2026) 165-186 (DOI 10.21697/pk.2026.69.1.07), studying the Priestly Fraternity of Saint Peter under the principle of the just autonomy of an institute's life in canon 586 as applied to societies of apostolic life by canon 732. It quotes in the original language the founders' declaration of 2 July 1988, the act of foundation of 18 July 1988, the Commission's declaration of 22 July 1988, the decrees of 10 September and 18 October 1988, the rescript approving the constitutions of 29 June 2003, and the letter of 29 June 2000, and it supplies printed loci for several acts. The author is a priest of the Fraternity and an official of the ecclesiastical court of Gorzow Wielkopolski; a second part on the period of Summorum Pontificum and Traditionis custodes is announced in the article."
