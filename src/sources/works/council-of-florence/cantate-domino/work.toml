languages = ["la"]
composed = "1442-02-04"
composed_basis = "The bull of union with the Copts was promulgated at the council's session of 4 February 1442; the date is the promulgation."
description = "The Council of Florence's decree of union with the Copts, the Decree for the Jacobites. Its profession of faith teaches that God, when he willed, created all creatures spiritual and corporeal, good because made by the highest good and mutable because made from nothing, and that no nature is evil (DS 1333); it condemns the Manichaean two first principles, one of things visible and one of things invisible (DS 1336). A locus is a Denzinger number."
