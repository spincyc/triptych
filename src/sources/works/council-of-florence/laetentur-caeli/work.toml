description = "The bull of union with the Greek Church promulgated at the Council of Florence on 6 July 1439, defining the procession of the Holy Spirit from the Father and the Son, the legitimacy of the Filioque addition, the validity of both leavened and unleavened bread, the lot of the departed (purgatory; the purified received at once into heaven and seeing clearly God himself three and one as he is, yet according to the diversity of merits one more perfectly than another; the immediate descent of those dying in mortal or original sin), and the primacy of the Roman Pontiff. It was subscribed at Florence and afterwards repudiated at Constantinople; its doctrinal force in the Catholic Church does not depend on its reception in the East."
