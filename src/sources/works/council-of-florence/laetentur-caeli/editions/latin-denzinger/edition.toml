notes = "A catalog-level identification of the conventional received Latin text of the doctrinal sections. The bull was promulgated in parallel Latin and Greek; only the Latin as received in Denzinger is identified here, and no claim is made about the Greek wording. No exact artifact of a printed Denzinger edition is retained or hashed. The 1439 conciliar act is public domain; particular printed editions of Denzinger retain their own editorial rights."
