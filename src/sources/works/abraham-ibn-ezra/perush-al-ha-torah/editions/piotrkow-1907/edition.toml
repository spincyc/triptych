notes = "A public-domain early twentieth-century printing of the Hebrew. Its coverage of a given chapter is not always complete: on Genesis 15 the text consulted for the records registered here carries comments through verse 16 and no further, so a consumer needing Ibn Ezra on Genesis 15:17 must use another witness. Strickman and Silver's English translation (Menorah, 1988-2004) is a separate expression under copyright and licensed CC BY-NC; it is not this edition. Catalog-level record created 2026-07-26. No exact artifact has been registered; publications consulting a digital delivery of this edition record their own access route and limits locally."
