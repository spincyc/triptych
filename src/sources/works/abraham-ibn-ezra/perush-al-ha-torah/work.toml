description = "Ibn Ezra's commentary on the Pentateuch, written in the twelfth century in a terse, grammatically driven style that keeps close to the plain sense and frequently draws chronological inferences from the form of a verb. Two recensions of his Genesis commentary circulate, a shorter and a longer; printings differ in which they carry and in how far they run. A locus is BookToken.chapter.verse."
