notes = "Printed pages 116-117 are artifact PDF pages 154-155. Both pages were rendered and visually inspected. Page 116 shows eight catalog censers with distinct body and lid forms; models 4145 and 4144 list total heights of 10.5 and 15 inches and bowl diameters of 4.5 and 7 inches. The pictures consistently distinguish bowl-support chains from the central lid-lifting chain. These are dated commercial exemplars, not ritual norms."
