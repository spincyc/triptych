notes = "Library of Congress control number 10019919. The catalog illustrates and names albs, amices, altar linens and covers, antependia, chasubles, copes, dalmatics, tunicles, burses, veils, episcopal gloves, hose and sandals, rochets, cassocks, cappa magna, canopies, and related goods. It supports dated morphology, relative proportion, material, construction, and substantive commercial variants. It cannot establish that a catalog form was universally prescribed, ordinarily present, or still current in 1962."
