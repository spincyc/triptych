context = "Johannes, Archbishop of Bremen, states that rural clergy lack suitable missals and use worn old books with confused order. He authorizes a new impression according to the Bremen church, with many new feasts and patronal histories inserted, and exhorts priests to purchase suitable books. The printed date ij kalend Septembris 1511 is 31 August 1511; this is the commission date, not the printing date."
