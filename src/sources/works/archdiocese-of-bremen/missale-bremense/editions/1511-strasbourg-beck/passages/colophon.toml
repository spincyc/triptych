context = "The colophon identifies Heinrich Nortman as reviser, Caspar de Mellerstat as bookseller financing the printing, and Renatus Beck as Argentinus printer. Its date is 12 September 1511. Strasbourg follows the printer adjective Argentinus and agrees with the institutional catalogue; there is no separate place dateline."
