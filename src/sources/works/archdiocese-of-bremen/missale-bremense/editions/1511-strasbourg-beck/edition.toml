title = "Missale secundum ritum ecclesie Bremensis"
language = "la"
publication = "Strasbourg: Renatus Beck, at the expense of Caspar de Mellerstat, 12 September 1511; corrected by Heinrich Nortman."
date = "1511-09-12"
authority = "Archbishop Johannes of Bremen willed and assented to the new printing in a commission dated 31 August 1511, printed on the title verso. He describes a shortage of missals and worn books with disordered arrangement, and the insertion of many new feasts and patronal histories; he urges diocesan priests lacking suitable books to obtain copies."
jurisdiction = "Historical Catholic Archdiocese of Bremen"
notes = "SuUB Bremen, VD16 M 5563, urn:nbn:de:gbv:46:1-16346. Whole institutional PDF has 561 pages. PDF 5 is the title; PDF 6 carries the commission dated ij kalend Septembris 1511, interpreted by inclusive Roman reckoning as 31 August; PDF 557 carries the colophon dated 12 September. Nortman and Mellerstat are the printed name forms. The title, commission and colophon were inspected; commission and colophon independently checked. The printing adds local material according to its own front matter; the exact changed prayers or count of added feasts is not yet collated."
