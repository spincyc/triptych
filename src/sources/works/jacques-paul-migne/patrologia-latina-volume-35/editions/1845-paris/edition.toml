notes = "A container volume. Its Patrologia title page (artifact PDF page 6 of the registered scan, read on the image) reads PATROLOGIAE TOMUS XXXV. S. AURELII AUGUSTINI TOMUS TERTIUS (PARS ALTERA.) and gives Paris and 1845; the inner title page of the Augustine constituent (artifact PDF page 8) retains an 1841 date beneath the Montrouge imprint, with 'Pars altera' added by hand under TOMUS TERTIUS. The Internet Archive item metadata gives 1844; this record follows the Patrologia title page. The volume reprints the Maurist text, as the inner title page states (post Lovaniensium theologorum recensionem, castigata denuo ad manuscriptos codices, opera et studio monachorum ordinis sancti Benedicti e congregatione S. Mauri). No critical edition is registered against this volume, and nothing here is collated against one."
