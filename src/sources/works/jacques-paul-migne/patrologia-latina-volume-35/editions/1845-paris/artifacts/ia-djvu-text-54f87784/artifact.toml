rights_basis = "The volume was published at Paris in 1845 (the Patrologia title page, PDF p. 6 of the registered scan), and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. Restoration under 17 U.S.C. 104A could not reach it: ninety-five years from 1845 ran out in 1940. The bytes are the Internet Archive's optical character recognition of a Google Books digitization; machine recognition of a public-domain printing adds no human authorship, and a faithful mechanical reproduction is not original (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)). GOOGLE FRONT MATTER IS PRESENT: lines 1-41 are Google's own usage-guidelines page, retained unaltered under src/sources/inventories/google-usage-guidelines-rights-v1.toml; it is Google's prose, not the book's, and no quotation, search or negative may treat it as the volume's text. NOT RELIED ON: that the item is available, that the download succeeded, or that any host marks the scan public domain."
