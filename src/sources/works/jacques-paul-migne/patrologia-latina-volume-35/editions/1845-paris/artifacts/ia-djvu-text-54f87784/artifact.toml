notes = "Uncorrected optical text of the whole volume, 88,550 LF-terminated lines, valid UTF-8, no CR bytes. Google's usage-guidelines page stands at lines 1-41 (see rights_basis); the Harvard College Library bookplate follows, and the Patrologia title page is at about line 79. The appendix's Admonitio de subsequenti expositione in Apocalypsim stands at about lines 81359-81406 and the Expositio in Apocalypsim opens at about line 81408, its last running head at line 84408; the optical order across Migne's two print columns and the interleaved notes is unreliable. QUOTE FROM THIS ARTIFACT ONLY AFTER CHECKING THE PAGE IMAGE: the sister artifact columns-2415-2418-and-2425-2428-facsimile-772856db retains the four pages the All Saints research read. A raw-line negative over this file is evidence about the recognition, not about the printed page."
