notes = "Four pages only: parent PDF page 557 (columns 2415-2416), the editors' Admonitio de subsequenti expositione in Apocalypsim; parent PDF page 558 (columns 2417-2418), the opening of the anonymous Expositio in Apocalypsim; and parent PDF pages 562-563 (columns 2425-2428), Homily VI, whose comment on Apocalypse 7 stands in columns 2426-2427 with its recapitulation in column 2428. Pages 557, 562 and 563 carry the loci the research stage read as evidence; page 558 was read only to identify the work's opening column. The intervening pages (559-561, columns 2418-2424, Homilies I-V) were not read. All other parent pages are omitted; the parent stays remote for its measured size."
