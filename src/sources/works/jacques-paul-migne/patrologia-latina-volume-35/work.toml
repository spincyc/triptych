description = "Volume 35 of Migne's Latin series, the second part of the third tome of Augustine's works, continuing the column numbering of volume 34 from column 1321. Its own Elenchus operum (artifact PDF page 9 of the registered scan, read on the image) lists in the second part: Quaestionum Evangeliorum libri II (col. 1321); Quaestionum septemdecim in Evangelium secundum Matthaeum liber unus (col. 1365); In Joannis Evangelium tractatus CXXIV (col. 1379); In Epistolam Joannis ad Parthos tractatus X (col. 1977); Expositio quarumdam propositionum ex Epistola ad Romanos (col. 2063); Epistolae ad Romanos inchoata expositio (col. 2087); Expositio ad Galatas (col. 2105); and in the appendix De mirabilibus sacrae Scripturae libri III (col. 2149), De benedictionibus patriarchae Jacob (col. 2199), Quaestiones Veteris et Novi Testamenti (col. 2213) and an exposition of the Apocalypse (col. 2417). A locus is the printed column number."
