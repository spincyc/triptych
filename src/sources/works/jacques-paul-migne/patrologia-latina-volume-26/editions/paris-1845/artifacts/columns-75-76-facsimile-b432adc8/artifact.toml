notes = "One page only: parent PDF page 45 (columns 75-76), running head S. EUSEBII HIERONYMI. It carries Jerome, Commentariorum in Evangelium Matthaei liber II, from the end of the comment on Matthew 11:20-24 through the comments on 11:25, 11:26, 11:27 (with the sentence on Eunomius), 11:28-29 ('Gravia onera esse peccati ... ad Evangelii invitat gratiam') and 11:30, to chapter XII verses 1-4, with Vallarsi's note a. All other parent pages are omitted; the parent stays remote for its measured size."
