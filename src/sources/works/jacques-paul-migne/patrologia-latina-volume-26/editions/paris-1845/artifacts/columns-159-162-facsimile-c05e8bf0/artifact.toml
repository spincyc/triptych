notes = "Two pages only: parent PDF pages 87 (columns 159-160) and 88 (columns 161-162). They carry Jerome, Commentariorum in Evangelium Matthaei liber III, from the end of the comment on Matthew 21:45-46 through the whole comment on Matthew 22:1-14 (the king and the wedding of Christ and the Church, the servants, the farm and the merchandise, the armies as avenging angels or the Romans under Vespasian and Titus, the gentiles in exitibus viarum, the wedding garment as the Lord's precepts and the works of the new man, and v. 14) to the comment on 22:15-21, with the editor's notes, several of which print parallel sentences of Origen's commentary. All other parent pages are omitted; the parent stays remote for its measured size."
