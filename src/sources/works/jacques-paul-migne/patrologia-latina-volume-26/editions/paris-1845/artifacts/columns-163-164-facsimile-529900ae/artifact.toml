notes = "One page only: parent PDF page 89 (columns 163-164). Column 163 carries Jerome, Commentariorum in Evangelium Matthaei liber III, on Matthew 22:16 (end), 22:18 (the hypocrite, qui aliud est et aliud simulat), 22:19 (the denarius bearing Caesar's image), 22:20 (the question asked by dispensation, not ignorance), 22:21 (Caesar is Tiberius; to Caesar the coin, to God tithes, first-fruits, oblations and victims, as Christ paid tribute for himself and Peter and rendered to God by doing the Father's will) and 22:22-23, with the editor's notes, some printing sentences of Origen's commentary. The comment on 22:15-16 opens on parent page 88, already retained in the columns-159-162 facsimile of this edition. All other parent pages are omitted; the parent stays remote for its measured size."
