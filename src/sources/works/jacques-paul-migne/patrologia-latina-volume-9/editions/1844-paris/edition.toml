notes = "The title page (artifact PDF page 7 of the registered scan, read on the image) reads: SANCTI HILARII PICTAVIENSIS EPISCOPI OPERA OMNIA, JUXTA EDITIONEM MONACHORUM ORDINIS SANCTI BENEDICTI E CONGREGATIONE S. MAURI ET OMNES ALIAS INTER SE COLLATAS, REPRODUCTA, EMENDATA, SINGULARITER AUCTA. TOMUS I. PARISIIS ... 1844. The Internet Archive item metadata gives the date 1800, which is Migne's birth year from the author heading and not the printing; this record follows the title page. The Maurist editor is not named on the title page and is not named here; Maffei is named because the volume prints his preface (Elenchus, col. I-XII). The text of the Commentarius in Matthaeum carries the Maurist footnotes, which record manuscript readings against the older printed editions (Badius, Erasmus, Lipsius), and the Maurist section headings in italics, which are editorial and not Hilary's. NO ENGLISH EDITION is registered against this volume or against Hilary's Commentary on Matthew; none was sought in this pass. The modern critical edition named by the review that prompted this registration, J. Doignon's Sources Chretiennes 254, was not reached and is not registered; nothing here is collated against it."
