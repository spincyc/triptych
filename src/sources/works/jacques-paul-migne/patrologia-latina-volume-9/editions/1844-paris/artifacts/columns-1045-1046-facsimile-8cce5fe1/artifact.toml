notes = "One page only: parent PDF page 537 (columns 1045-1046). Column 1045 carries Hilary, Commentarius in Matthaeum, caput XXIII section 2 (end), on Matthew 22:21: the answer that frees minds devoted to God from human cares and obligations, the condition of rendering only what of Caesar's we hold, and the duty to render to God body, soul and will, from whom we hold their origin and increase; then sections 3-4 on the Sadducees. Caput XXIII's heading and section 1, with the opening of section 2, stand on parent page 536, already retained in the columns-1043-1044 facsimile of this edition. All other parent pages are omitted; the parent stays remote for its measured size."
