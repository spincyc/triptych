notes = "One page only: parent PDF page 536 (columns 1043-1044). It carries Hilary, Commentarius in Matthaeum, caput XXII sections 3 (end) to 7 on the wedding feast of Matthew 22:1-14: Israel invited by the law, the apostles sent, the fatted bulls and fatlings, those held by the ambition of the world and the greed of trade, the heavenly armies that burn the murderers with eternal fire, the call of the gentiles to the outlets of the roads by the gift of grace, the wedding garment as the glory of the Holy Spirit kept unstained, and 'non est paucitas in invitatis, sed raritas in electis'; then the heading of caput XXIII. Column 1042, where section 3 begins, is on parent page 535, already retained in the columns-1039-1042 facsimile of this edition. All other parent pages are omitted; the parent stays remote for its measured size."
