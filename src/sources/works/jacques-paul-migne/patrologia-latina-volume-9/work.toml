composed_basis = "A nineteenth-century editorial compilation: the volume as a compilation was made for its 1844 Paris printing, whose title page reads 1844 beneath the imprint of Vrayet. The fourth-century works it reprints were written far earlier and are dated on their own work records, not on this one."
description = "The ninth volume of Migne's Latin series and the first of Hilary of Poitiers's works, reprinting the edition of the Benedictines of the Congregation of St Maur collated with the other editions, as its title page states. Its own Elenchus operum (artifact PDF page 8) lists: Maffei's preface, the epistola nuncupatoria, the Maurist general preface, the lives of Hilary (from his writings, by Jerome, by Fortunatus), Peter Damian's sermon De translatione S. Hilarii, selected testimonies, a notitia litteraria, the syllabus of manuscripts and editions, the Admonitio to the psalm commentary, Hilary's Tractatus super psalmos (col. 231), the Commentarius in psalmos XV, XXI, XLI (col. 890), and the Commentarius in Evangelium Matthaei (col. 917). A locus is the printed column number."
