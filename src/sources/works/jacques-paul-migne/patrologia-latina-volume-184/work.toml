composed_basis = "The volume as a compilation was made for Migne's Paris series, but the registered scan is a Garnier reprint dated 1879 on both its title pages (artifact PDF pages 5 and 7, read on the images); the date of the first Migne printing was not read on any page of this scan and is not inferred from the reprint. The twelfth-century works it reprints are not dated by this record."
description = "The 184th volume of Migne's Latin series and the third volume of St Bernard of Clairvaux's Opera omnia in Mabillon's arrangement (VOLUMEN TERTIUM, S. BERNARDI OPERUM TOMUM V COMPLECTENS, as its second title page states): Bernard's Operum tomus V, the aliena et supposititia, works formerly printed among Bernard's but judged by the editors to be another's or spurious. Its own Elenchus (artifact PDF page 8, read in the PDF text layer; not every column number checked on the image) lists, among others: the Sermo panegyricus ad B. Virginem Deiparam; Gilbert of Hoyland's Sermones in Cantica (col. 9), Tractatus ascetici (251) and Epistolae (289); Guigonis, prioris V majoris Carthusiae, Epistola seu Tractatus ad Fratres de Monte Dei (307); William of Saint-Thierry's De contemplando Deo (365) and De natura et dignitate amoris (379); Gaufridus's Declamationes (435); Scala claustralium, sive de modo orandi (475); the Meditationes piissimae (485); De interiori domo (507); Aelred of Rievaulx, Sermo in adventu Domini; Nicholas of Clairvaux's sermons; and further tracts, sermons and meditations. The Scala claustralium begins at the head of column 475 (PDF page 242, read on the image) under the title SCALA CLAUSTRALIUM SIVE TRACTATUS DE MODO ORANDI, with an editorial headnote saying that the tract stands among Augustine's works (tome VI) under the title Scala Paradisi with the Louvain theologians' censure that it is carried among Bernard's works too but seems not to be his, and that a Cologne Charterhouse manuscript ascribes it to Guigo, whom the editors identify, with a question mark, as the fifth prior of the Grande Chartreuse; the text opens EPISTOLA DOMINI GUIGONIS CARTHUSIENSIS Ad fratrem Gervasium. A locus is the printed column number or the artifact PDF page."
