context = "Scala claustralium (Epistola Guigonis ad fratrem Gervasium), caput primum, Descriptio quatuor graduum exercitationum spiritualium, section 1 entire: lectio, meditatio, oratio, contemplatio and their definitions. Read on PL 184 column 475 (PDF page 242, left column, from the letter's greeting) and column 476 (right column, to the heading of caput II)."
physical_line_ranges = [[1, 9]]
text = "Cum die quadam, corporali manuum labore occupatus, de spiritualis hominis exercitio cogitare cœpissem, quatuor spirituales gradus animo cogitanti se subito obtulerunt: scilicet, lectio, meditatio, oratio, et contemplatio. Hæc est Scala Claustralium, qua de terra in cœlum sublevantur; gradibus quidem distincta paucis, immensæ tamen et incredibilis magnitudinis. Cujus extrema pars terræ innixa est; superior vero nubes penetrat, et secreta cœlorum rimatur Hi gradus sicut nominibus et numero, ita ordine et munere sunt distincti. Quorum proprietates et officia quidem singula quid circa nos efficiant, quomodo inter se invicem differant et præemineant, si quis diligenter inspiciat, quidquid laboris aut studii impenderit in eis, breve reputabit et facile, præ utilitatis et dulcedinis magnitudine. Est autem lectio, sedula Scripturarum cum animi intentione inspectio. Meditatio, est studiosa mentis actio, occultæ veritatis notitiam ductu propriæ rationis investigans. Oratio, est devota cordis intentio in Deum pro malis amovendis, et bonis adipiscendis. Contemplatio, est mentis in Deum suspensæ elevatio, æternæ dulcedinis gaudia degustans."
