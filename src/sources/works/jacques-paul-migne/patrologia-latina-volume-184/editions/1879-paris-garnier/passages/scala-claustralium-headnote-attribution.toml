notes = "This is the editors' text, not the treatise. It reports the Louvain theologians' censure that the work, printed among Augustine's works as Scala Paradisi and also among Bernard's, seems to be neither's, and the Cologne Charterhouse manuscript's ascription to Guigo, with the editors' own query whether he is the fifth prior of the Grande Chartreuse. The rest of the headnote (an opusculum of similar argument in Chifflet's Manuale Solitariorum under the name of another Guigo, and the inscription following the Cologne codex) is not transcribed. 'quan-quam' is divided across a line end and read quanquam. Its presence in a volume of Bernard's works is no evidence of Bernard's authorship."
