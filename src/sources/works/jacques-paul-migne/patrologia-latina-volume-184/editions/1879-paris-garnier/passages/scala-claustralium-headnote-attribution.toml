context = "The Migne editors' italic headnote to the Scala claustralium sive tractatus de modo orandi, on its transmission and attribution, read across PL 184 columns 475-476 (PDF page 242), between the end of the preceding work and the heading EPISTOLA DOMINI GUIGONIS CARTHUSIENSIS, Ad fratrem Gervasium, de vita contemplativa."
physical_line_ranges = [[1, 2]]
text = "Hic Tractatus inter opera S. Augustini (modo in tomo VI) reperitur sub hoc titulo, « Scala Paradisi, » cum hac Doctorum Lovaniensium Censura: « Hoc opusculum fertur etiam inter opera D. Bernardi, quanquam nec illius videatur esse. » In codice vero manuscripto Cartusiæ Coloniensis Guigoni (Cartusiæ majoris Priori quinto?) tribuitur."
