text = "Assignatis ergo quatuor graduum descriptionibus, restat ut eorum officia videamus. Beatæ igitur vitæ dulcedinem lectio inquirit, meditatio invenit, oratio postulat, contemplatio degustat. Unde ipse Dominus dicit: Quærite, et invenietis, pulsate, et aperietur vobis. Quærite legendo, et invenietis meditando: pulsate orando, et aperietur vobis contemplando. Lectio quasi solidum cibum ori apponit: meditatio masticat et frangit: oratio saporem acquirit: contemplatio est ipsa dulcedo quæ jucundat et reficit. Lectio, in cortice; meditatio, in adipe; oratio, in desiderii postulatione; contemplatio, in adeptæ dulcedinis delectatione."
