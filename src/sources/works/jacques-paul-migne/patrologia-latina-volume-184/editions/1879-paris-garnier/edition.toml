notes = "Identified from the page images of Internet Archive item patrologiaecursu184mign (Scribe scan scribe4.toronto.archive.org, digitized 2011 with funding from the University of Toronto, copy of the Pontifical Institute of Mediaeval Studies), read on 2026-11-18. The series title page (artifact PDF page 5) reads: PATROLOGIAE CURSUS COMPLETUS ... SERIES LATINA ... ACCURANTE J.-P. MIGNE ... PATROLOGIAE LATINAE TOMUS CLXXXIV / S. BERNARDUS, CLARAE-VALLENSIS ABBAS / PARISIIS, APUD GARNIER FRATRES, EDITORES ET J.-P. MIGNE SUCCESSORES ... 1879. The second title page (PDF page 7) reads S. BERNARDI, CLARAE-VALLENSIS ABBATIS PRIMI, OPERA OMNIA ... ACCURANTE ET DENUO RECOGNOSCENTE J.-P. MIGNE ... VOLUMEN TERTIUM, S. BERNARDI OPERUM TOMUM V COMPLECTENS ... 1879. The verso of the series title (PDF page 6) carries the printer's line of Paul Dupont at Clichy. CHOICE OF SCAN: the Advent primer's acquisition brief named Internet Archive item patrologiaecurs00unkngoog, a Google digitisation of a Harvard copy whose text layer opens with Google's usage-guidelines page and whose title pages read the same Garnier imprint of 1879 (its djvu text layer, SHA-1 5404fe2f9b567949b75c014a03fa87c9c9484be0, and PDF, SHA-1 41d1ca8d19c0b8073a9386aa270f05eff830d8b7, were fetched whole and hashed on 2026-11-18 and not registered). Under condition 5 of src/sources/inventories/google-usage-guidelines-rights-v1.toml a non-Google scan of the same printing is preferred when it is equally complete and legible; this Toronto scan of the same 1879 printing has 680 PDF pages, as the Google file does, a fuller text layer (4,500,891 against 3,941,777 bytes) and a legible image at the pages read, so it is registered instead. A third item, patrologiaecursu0184mign, is a scan of the earlier Migne printing dated 1854 on its title page (read in its text layer only) and is a different printing, not registered. Column-to-page rule, measured at PDF page 242, which carries columns 475-476: PDF page p carries columns 2p-9 and 2p-8 in the body of the volume. No modern critical edition was reached or collated. Registered 2026-11-18 for the Advent primer research."
