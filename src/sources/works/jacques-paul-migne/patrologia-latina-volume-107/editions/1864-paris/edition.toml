notes = "The title page (artifact PDF page 7 of the registered scan, read on the image) reads: B. RABANI MAURI FULDENSIS ABBATIS ET MOGUNTINI ARCHIEPISCOPI OPERA OMNIA JUXTA EDITIONEM GEORGII COLVENERII ANNO 1617 COLONIAE AGRIPPINAE DATAM ... ACCURANTE J.-P. MIGNE ... TOMUS PRIMUS ... 1864. The Internet Archive item metadata gives the date 1800, which is Migne's birth year and not the printing. In the Commentariorum in Matthaeum the text carries marginal source sigla in parentheses -- (Hieron.), (Aug.), (Joan. Chrysost.), (Beda.), (Rabanus.) -- which mark the compiled sources as this printing presents them; they are the edition's, and where a sentence's actual source has been checked elsewhere the checking record says so. NO ENGLISH EDITION is registered; none was sought in this pass."
