notes = "Five pages only: parent PDF pages 402 (columns 795-796), 403 (797-798), 415 (821-822), 462 (915-916) and 463 (917-918), with the edition's running heads (Comment. in Matthaeum, lib. II on pages 403 and 415, lib. IV on page 463) and the source labels printed in parentheses in the text column, such as (Hieron.), (Aug.) and (MAURUS.); the margins carry only the column-section letters A-D. Pages 402-403 carry part of Rabanus Maurus's commentary on the beatitudes of Mt 5, among them Mt 5:8 in column 796; page 415 carries the matching of the petitions of the Lord's Prayer to the beatitudes (from Augustine, De sermone Domini II.11.38); page 462 runs from Mt 11:21 to the comment on Mt 11:28 at the foot of column 916, which continues on page 463. All other parent pages are omitted; the parent stays remote for its measured size."
