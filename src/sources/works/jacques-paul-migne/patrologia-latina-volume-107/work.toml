composed_basis = "A nineteenth-century editorial compilation: the volume was made for its Paris printing, whose title page reads 1864 beneath the imprint of J.-P. Migne. The ninth-century works it reprints are dated on their own work records; its head-note reads TRADITIO CATHOLICA. SAECULUM IX, ANNUS 856."
description = "The hundred and seventh volume of Migne's Latin series and the first of the works of Rabanus Maurus, reprinting Colvener's Cologne edition of 1617. Its own Elenchus auctorum et operum (artifact PDF page 8) lists the prolegomena (Mabillon's Elogium, the Vitae by Rudolf and Trithemius, testimonies, Fabricius's notitia, the catalogue of Colvener's six tomes) and, from col. 133, De laudibus sanctae crucis (133), De clericorum institutione (293), Liber de oblatione puerorum (419), Commentariorum in Genesim libri quatuor with the letters of Freculph (439), Liber de computo (669) and Commentariorum in Matthaeum libri octo ad Haistulphum (727). A locus is the printed column number."
