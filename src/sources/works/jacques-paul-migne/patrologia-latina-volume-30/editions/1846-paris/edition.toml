notes = "A container volume, dated 1846 on its own title page. Migne prints the Liber Comitis here as spurious matter and not as Jerome's: the attribution in the running head is the transmission's, not the volume's judgment, and the volume's own preface says so. The volume's column numbers repeat, so the Internet Archive item's page map is ambiguous and any leaf must be located by probing rather than computed. Language pairing: a Patrologia Latina volume is a container printing of Latin works, and the pairing obligation falls on each constituent work's own record rather than on the volume. No English of any constituent was retrieved through this volume."
