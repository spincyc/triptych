notes = "One page image, 2250 by 3791 pixels, of leaf n264, which is PL 30 cols. 521-522, running head 'LIBER COMITIS'. One opening only, not the volume: a negative read off it is an absence from these two columns and from nothing wider. It carries the Liber Comitis entry that pairs this Sunday's Epistle and Gospel and cuts both at the verses the 1962 book cuts them at, while heading the day 'Dominica mensis vi'."
