notes = "Two independent digitisations of this same 1846 printing are registered on this edition and they are different bytes: Internet Archive item patrologiaecursu0030jpmi, whose text layer carries no Google matter and is retained, and item patrologiae_cursus_completus_lat_vol_030, a Google digitisation whose text layer carries Google's own reproduction statement and is not. Neither text layer is a facsimile: the optical order across Migne's two print columns is unreliable, and every Roman numeral the retrieving lane reported was read on the page images registered here rather than in a text layer. No English edition of this volume exists or is registered here: Migne's series was never translated as a series, and each constituent work would have to be paired separately. The absence is recorded rather than left silent."
