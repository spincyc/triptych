notes = "One complete scanned page image of Migne, Patrologia Latina volume 30, Internet Archive leaf n265. THE DELIVERED WIDTH IS NOT THE REQUESTED WIDTH: the URL asks for w1800 and the server returned 2285 by 3771 pixels; the record states what the bytes are, not what was asked for. The seven leaves n261 to n267 registered on this edition together cover printed cols. 515-528, the stretch of the Liber Comitis carrying the Sunday series, and every Roman numeral the retrieving lane reported was read on these images because the optical text mangles them. This is visual evidence, not text: it is not searchable and no negative may be read off it by machine."
