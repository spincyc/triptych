rights_basis = "Migne's Patrologia Latina volume 30 was published at Paris in 1846, the volume's own title page reading PATROLOGIA TOMUS XXX / S. HIERONYMI TOMUS UNDECIMUS / PARISIIS ... 1846, and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. 1846 clears it by eighty-five years. Restoration under 17 U.S.C. 104A could not reach it either: ninety-five years from 1846 ran out in 1941, so nothing remained to restore on 1 January 1996. These exact bytes are another matter. The same probes were run over this file: \"digitized by google\" 109, \"books google com\" 1, and its first seven lines are Google's own reproduction statement -- \"This is a reproduction of a library book that was digitized by Google as part of an ongoing effort to preserve the information in books and make it universally accessible.\" That is Google-authored prose and no distribution grant for it was established, so the file is recorded and not retained, following the disposition already settled at artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr."
