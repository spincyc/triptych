rights_basis = "Migne's Patrologia Latina volume 30 was published at Paris in 1846, the volume's own title page reading PATROLOGIA TOMUS XXX / S. HIERONYMI TOMUS UNDECIMUS / PARISIIS ... 1846, and a work first published abroad before 1931 is out of United States copyright; that line is the one guidance/missals.md records from Cornell's public-domain chart as current on 1 January 2026 and it moves every January, so it is written here as derived for calendar year 2026 and not as a standing rule. 1846 clears it by eighty-five years. Restoration under 17 U.S.C. 104A could not reach it either: ninety-five years from 1846 ran out in 1941, so nothing remained to restore on 1 January 1996. THE GOOGLE QUESTION WAS DECIDED ON THESE BYTES. Probes run case-insensitively over the whole file with runs of non-alphanumeric characters collapsed, because this class of scan doubles its spaces: \"usage guidelines\" 0; \"about google book search\" 0; \"this is a digital copy\" 0; \"digitized by google\" 0; \"google book search\" 0. Not one word of Google-authored prose is in this file, and neither is any notice, licence, reservation or condition. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it. NOT RELIED ON: that the item is available, that the download succeeded, or that any host marks the scan public domain."
