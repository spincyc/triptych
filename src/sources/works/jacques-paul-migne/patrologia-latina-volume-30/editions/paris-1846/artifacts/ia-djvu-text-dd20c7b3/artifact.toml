notes = "Uncorrected optical text of the whole volume, 208552 LF-terminated lines, valid UTF-8, no CR bytes. Extent as measured by the retrieving lane: Complete uncorrected optical text of all of Migne, Patrologia Latina vol. 30 (Paris, 1846), the spuria of Jerome, 1,100+ printed pages; the Liber Comitis occupies roughly lines 38929-42700 of it. Its line order is unreliable across the two print columns, which is why the column numbers below were fixed from the coordinate file and the page images instead.. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE, AND NEVER FOR A NUMERAL. The retrieving lane records that the line order is unreliable across the two print columns and that the recogniser mangles the Roman numerals of the Sunday headings outright, which is why the seven page images registered beside this file exist. A raw-line negative over these bytes establishes nothing about the printed page."
