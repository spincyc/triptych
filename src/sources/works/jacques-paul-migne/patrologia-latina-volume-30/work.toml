description = "Volume 30 of Migne's Patrologia Latina, the eleventh Migne volume of Jerome, printing the Opera supposititia: works transmitted under Jerome's name that its own editorial preface holds not to be his. The Liber Comitis, the early Roman epistle-and-gospel list that Migne prints among these spuria, stands at cols. 487-532. A container volume: its constituent works keep their own identities and are not reassigned to Migne or to Jerome."
