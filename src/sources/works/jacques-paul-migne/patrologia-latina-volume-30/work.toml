composed_basis = "A nineteenth-century editorial compilation: the volume as a compilation was made in 1846, which is also the date of its only printing registered here. The ancient and medieval texts it reprints were each written far earlier and are dated on their own work records, not on this one."
description = "The thirtieth volume of Migne's Latin series, printed at Paris in 1846 as the eleventh volume of Jerome, holding works transmitted under Jerome's name including the Liber Comitis, the Roman lectionary list whose Sunday series runs at cols. 487-532. A locus is the printed column number."
