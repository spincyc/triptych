notes = "Extent as the retrieving lane measured it: Complete uncorrected OCR text layer of the Internet Archive scan of Migne, Patrologia Latina vol. 78 (750 page images), 132,030 lines; the running head 'PATROL. LXXVIII.' is printed on the page and confirms the volume. It carries the whole volume, i.e. Menard's Liber Sacramentorum (cols. 25-240), his Notae (263-582), Rocca's Scholia (583), the Benedictionale (601-637), the Liber Antiphonarius (641-723), the Liber Responsalis (723-849), and the Ordines Romani. Uncorrected optical recognition: it is a locating and searching layer, not a text of record, and wording quoted from this volume was collated against page images rather than taken from here. This is the file against which the lane's whole-volume negative searches were run, so a bounded negative taken from this volume is replayable here and only here."
