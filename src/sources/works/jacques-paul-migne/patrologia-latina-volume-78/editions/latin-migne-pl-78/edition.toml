editors = ["Jacques-Paul Migne", "Hugo Menard"]
notes = "The printing year of the scanned copy is not established and is therefore not asserted here. The Patrologia Latina volumes were reissued several times and the date field is left empty rather than filled from the series' conventional year: the scan's front matter, read in the retained optical text layer, carries the series title page and the imprint line PARISIIS but no legible year, and no other witness to this copy's imprint was retrieved. What is established is the volume: the running head PATROL. LXXVIII is printed on the page. Menard's text is the Maurist text reprinted, not a fresh collation of his manuscripts, so this edition establishes what Menard printed and not what his manuscripts read."
