description = "Volume 78 of Migne's Patrologia Latina, the volume of the Roman liturgical books ascribed to Gregory the Great. It is registered as a container volume rather than under any one of its constituents because this run read several of them from the same bytes: Hugo Menard's edition of the Liber Sacramentorum at columns 25-240, Menard's Notae at 263-582, Angelo Rocca's Scholia at 583, the Benedictionale at 601-637, the Liber Antiphonarius at 641-723, the Liber Responsalis at 723-849, and the Ordines Romani, of which Ordo XIII was read at columns 1113-1114. A constituent that later acquires its own work record takes a segment over these artifacts rather than a duplicate copy of them."
