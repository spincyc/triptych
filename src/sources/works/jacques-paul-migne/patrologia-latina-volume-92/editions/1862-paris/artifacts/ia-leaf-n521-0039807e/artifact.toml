notes = "One complete page image, 3810 x 6120 px, carrying Migne PL 92 columns 1025-1026 under the running head of Bede's Liber retractationis in Actus apostolorum: the end of the note on Acts 16:3, the notes on Acts 16:14 (Lydia purpuraria) and 16:16, and the opening of chapter 17. Retained because the volume's registered OCR is remote and interleaves the two columns, so this leaf is the only witness to the quoted Latin that an offline checkout holds."
