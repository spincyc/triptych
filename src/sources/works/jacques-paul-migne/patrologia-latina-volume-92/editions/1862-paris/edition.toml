notes = "A container volume. The scanned copy registered here carries the year 1862 on its own title page, which is the reissue and not Migne's first printing of the volume; column numbers cited from it should be checked against whichever printing a consumer holds. This record supplies the exposition of Luke that edition.bede.in-lucae-evangelium-expositio.latin-migne-corpus-corporum-web-2026-07-25 records as having no reachable page image: the Internet Archive scan located when that edition was made contained only the Matthew and Mark commentaries, and this is a different item. Language pairing: a Patrologia Latina volume is a container printing of Latin works, and the pairing obligation falls on each constituent work's own record rather than on the volume. No English of any constituent was retrieved through this volume."
