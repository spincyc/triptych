description = "Volume 70 of Migne's Patrologia Latina, the first Migne volume of Cassiodorus, printing the Expositio in Psalterium continuously together with the Institutiones and shorter works. A container volume: its constituent works keep their own identities and are not reassigned to Migne. The expositions of Vulgate Psalms 39, 85, 91 and 94, all four of the psalms appointed in the Fifteenth Sunday after Pentecost, stand within it."
