notes = "A container volume. The scanned copy registered here carries the year 1865 on its own title page, which is a reissue and not Migne's first printing of the volume; column numbers cited from it should be checked against whichever printing a consumer holds. Cassiodorus's Expositio Psalmorum is registered separately as work.cassiodorus.expositio-psalmorum, whose Corpus Christianorum and Corpus Corporum editions this volume does not replace. Language pairing: a Patrologia Latina volume is a container printing of Latin works, and the pairing obligation falls on each constituent work's own record rather than on the volume. No English of any constituent was retrieved through this volume."
