notes = "Complete optical text of the whole volume, Google front matter through the end, carrying Cassiodorus's Expositio in Psalterium continuously with the expositions of Vulgate Psalms 39, 85, 91 and 94 all complete within it. Cassiodorus's psalter is the one this formulary's chant sings: at Psalm 39 his lemma reads 'Exspectans exspectavi Dominum, et respexit me: et exaudivit deprecationem meam', which is the Offertory antiphon word for word where the Clementine reads 'intendit mihi'. Uncorrected optical character recognition. Not retained: the Internet Archive's own optical-character-recognition derivative, because no grant covering that derivative was established. A reader without the network cannot open this file from a checkout; the underlying printing is public domain and may be re-derived from the same Internet Archive item, and the wording a claim depends on must be quoted into the claim's own passage record."
