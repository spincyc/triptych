context = "Leo the Great, Sermo XIII [al. XII], De jejunio decimi mensis II, the first half of the sermon (which is undivided): the December fast as a thank-offering for the harvest, and fasting as the food of virtue. Read on PL 54 column 172 (PDF page 92, right column) from the sermon's heading and synopsis through the column's foot."
physical_line_ranges = [[1, 5]]
text = "Quod temporis ratio et devotionis nostræ admonet consuetudo, pastorali vobis, dilectissimi, sollicitudine prædicamus, decimi mensis celebrandum esse jejunium, quo pro consummata perceptione omnium fructuum, dignissime largitori eorum Deo continentiæ libamen offertur. Quid enim potest efficacius esse jejunio, cujus observantia appropinquamus Deo, et resistentes diabolo, vitia blanda superamus? Semper enim virtuti cibus jejunium fuit. De abstinentia prodeunt castæ cogitationes, rationabiles voluntates, salubriora consilia. Et per voluntarias afflictiones caro concupiscentiis moritur, virtutibus spiritus innovatur."
