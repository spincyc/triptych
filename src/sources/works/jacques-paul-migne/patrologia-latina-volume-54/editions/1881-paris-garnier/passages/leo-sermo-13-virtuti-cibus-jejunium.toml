notes = "Ballerini note (o) says enim in Semper enim virtuti cibus jejunium fuit was added from their own codices; note (n) records the variants diligentissime and dignissimo for dignissime; note (m) vestræ for nostræ. The Latin names only the tenth month; it says nothing of Advent. Bute's breviary reads this sermon at Advent III Matins (verification in that edition's own passages)."
