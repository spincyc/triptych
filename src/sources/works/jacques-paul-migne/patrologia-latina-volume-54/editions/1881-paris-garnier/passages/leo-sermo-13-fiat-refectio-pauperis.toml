notes = "The bold marginal 44 inside vestiatur nudus is omitted. Leo's Ember notice here (Wednesday and Friday fast, Saturday vigil at St Peter's) parallels the close of Sermo XII.4; this one names beatum Petrum apostolum where XII.4 has beatissimum apostolum Petrum. Ballerini notes (q) in solo jejunio and (r) recipere record single-codex variants."
