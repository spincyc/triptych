context = "Leo the Great, Sermo XIII [al. XII], De jejunio decimi mensis II, the second half of the sermon to its end: almsgiving to supply the fast, the works of mercy, and the Ember notice. Read on PL 54 column 172 (PDF page 92, right column, lower half) and column 173 (PDF page 93, left column, to Amen and the heading of Sermo XIV)."
physical_line_ranges = [[1, 7]]
text = "Sed quia non solo jejunio animarum nostrarum salus acquiritur, jejunium nostrum misericordiis pauperum suppleamus. Impendamus virtuti, quod subtrahimus voluptati. Fiat refectio pauperis, abstinentia jejunantis. Studeamus viduarum defensioni, pupillorum utilitati, lugentium consolationi, dissidentium paci. Suscipiatur peregrinus, adjuvetur oppressus, vestiatur nudus, foveatur ægrotus; ut quicumque nostrum de justis laboribus auctori bonorum omnium Deo sacrificium hujus pietatis obtulerit, ab eodem regni cœlestis præmium percipere mereatur. Quarta igitur et sexta feria jejunemus; sabbato autem apud beatum Petrum apostolum pariter vigilemus, cujus suffragantibus meritis, quæ poscimus, impetrare possimus, per Dominum nostrum Jesum Christum, qui cum Patre et sancto Spiritu vivit et regnat in sæcula sæculorum. Amen."
