context = "Leo the Great, Sermo XIX [al. XVIII], De jejunio decimi mensis VIII, the opening of chapter I: Christ's warning against surfeiting, applied to the hidden but near day. Read on PL 54 column 185 (PDF page 99, left column, from the sermon's heading and synopsis) and column 186 (right column, through chapter I and the opening of chapter II)."
physical_line_ranges = [[1, 3]]
text = "Cum de adventu regni Dei, et de fine temporum mundi discipulos suos Salvator instrueret, totamque Ecclesiam suam in apostolis erudiret: Cavete, inquit, ne forte graventur corda vestra in crapula, et ebrietate, et cogitationibus sæcularibus. Quod utique præceptum, dilectissimi, ad nos specialius pertinere cognoscimus, quibus denuntiatus dies, etiam si occultus, non dubitatur esse vicinus. Ad cujus adventum omnem hominem convenit præparari: ne quem aut ventri deditum aut curis sæcularibus inveniat implicatum."
