notes = "The page prints Cnm (broken u) for Cum. Between vestra and in the scan shows a mark like a semicolon with no space, examined at 300 dots per inch; it is not in the Vulgate (Luke xxi. 34) and is transcribed as a word space, so this reading is uncertain at that one point. Ballerini note (h) says they preferred the older lectionaries' et de fine temporum mundi to the other reading et de mundi fine ac temporum; note (i) ne quemquam for ne quem; note (j) potus satietate for satietate. The Latin says denuntiatus dies, etiam si occultus, non dubitatur esse vicinus: the day of the Lord's coming, not the liturgical Advent."
