notes = "Ballerini note (n): the Verona codex, the Homiliary of Paul the Deacon and the first edition read incessabili tuba for incessabiliter. Feltoe's NPNF footnote glossing the December fast as Advent Embertide is the translator's; the Latin names only the tenth month."
