context = "Leo the Great, Sermo XIX, the opening of chapter II: the fasts of the four seasons distributed through the year like the four Gospels. Read on PL 54 column 186 (PDF page 99, right column) whole."
physical_line_ranges = [[1, 2]]
text = "Hujus observantiæ utilitas, dilectissimi, in ecclesiasticis præcipue est constituta jejuniis, quæ ex doctrina sancti Spiritus ita per totius anni circulum distributa sunt, ut lex abstinentiæ omnibus sit ascripta temporibus. Siquidem jejunium vernum in Quadragesima, æstivum in Pentecoste, autumnale in mense septimo, hiemale autem in hoc qui est decimus celebramus, intelligentes divinis nihil vacuum esse præceptis, et verbo Dei ad eruditionem nostram omnia elementa servire; dum per ipsius mundi cardines, quasi per quatuor Evangelia, incessabiliter discimus quod et prædicemus et agamus."
