context = "Leo the Great, Sermo XII [al. XI], De jejunio decimi mensis I, chapter IV entire: prayer, fasting and almsgiving, and the Wednesday and Friday fast with the Saturday vigil at St Peter's. Read on PL 54 column 171 (PDF page 92, left column, from Cap. IV) and column 172 (right column, to Amen and the heading of Sermo XIII)."
physical_line_ranges = [[1, 6]]
text = "Tria vero sunt quæ maxime ad religiosas pertinent actiones, oratio scilicet, jejunium, et eleemosyna, quibus exercendis omne quidem tempus acceptum, sed illud est studiosius observandum, quod apostolicis accepimus traditionibus consecratum; sicut etiam decimus hic mensis morem refert veteris instituti, ut tria illa de quibus locutus sum diligentius exsequamur. Oratione enim propitiatio Dei quæritur, jejunio concupiscentia carnis exstinguitur, eleemosynis peccata redimuntur; simulque per omnia Dei in nobis imago renovatur, si et in laudem ejus semper parati, et ad purificationem nostram sine cessatione solliciti, et ad sustentationem proximi indesinenter simus intenti. Hæc triplex observantia, dilectissimi, omnium virtutum comprehendit effectus. Hæc ad imaginem et similitudinem Dei pervenit, et a Spiritu sancto inseparabiles facit. Quia in orationibus permanet fides recta; in jejuniis innocens vita, in eleemosynis mens benigna. Quarta igitur et sexta feria jejunemus; sabbato autem apud beatissimum apostolum Petrum vigilias celebremus; qui et orationes, et jejunia, et eleemosynas nostras precibus suis dignabitur adjuvare."
