notes = "Ballerini numbering; this is NPNF2-12 Sermon XII.4. The page prints sciiicet (broken l), eteleemosyna and si mulque run together or split by the compositor; read scilicet, et eleemosyna, simulque. The bold marginal 43 and the reference (Dan. iv, 24) are omitted. The editors' notes (i)-(l) record variants: promptum for acceptum (Homiliary of Paul the Deacon), sumus intenti (Quesnel), in jejunio (others) for in jejuniis, and a Vatican addition after adjuvare."
