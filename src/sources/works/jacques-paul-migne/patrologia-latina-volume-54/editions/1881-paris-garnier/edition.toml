notes = "Identified from the page images of Internet Archive item patrologiaecursu0054mign (scan station24.cebu.archive.org), read on 2026-11-18. The series title page (artifact PDF page 7) reads: PATROLOGIAE CURSUS COMPLETUS ... SERIES LATINA PRIOR ... ACCURANTE J.-P. MIGNE ... PATROLOGIAE LATINAE TOMUS LIV / S. LEO MAGNUS ROMANUS PONTIFEX / PARISIIS / APUD GARNIER FRATRES, EDITORES, ET J.-P. MIGNE, SUCCESSORES ... 1881; PDF page 5 is a decorated wrapper title with the same imprint and the same year. The second title page (PDF page 9) reads: TRADITIO CATHOLICA. SAECULUM V. ANNUS 461. SANCTI LEONIS MAGNI ROMANI PONTIFICIS OPERA OMNIA, POST PASCHASII QUESNELLI RECENSIONEM AD COMPLURES ET PRAESTANTISSIMOS MSS. CODICES AB ILLO NON CONSULTOS EXACTA, EMENDATA, ET INEDITIS AUCTA: PRAEFATIONIBUS, ADMONITIONIBUS ET ANNOTATIONIBUS ILLUSTRATA CURANTIBUS PETRO ET HIERONYMO FRATRIBUS BALLERINIIS, PRESBYTERIS VERONENSIBUS. ACCEDUNT PETRI THOMAE CACCIARI EXERCITATIONES IN UNIVERSA OPERA S. LEONIS MAGNI. ACCURANTE ET DENUO RECOGNOSCENTE J.-P. MIGNE ... TOMUS PRIMUS ... 1881. The Internet Archive item metadata gives the date 1844; this record follows the title pages. This is a Garnier reprint, not the first Migne printing; Migne's Paris volumes were reissued, and only this 1881 printing, as the scan shows it, is identified here. Column-to-page rule, measured on PDF pages 90-92 and 99: PDF page p carries columns 2p-13 and 2p-12 in the body of the volume (for example PDF page 91 carries columns 169-170). The sermons are numbered in the Ballerini order, with the older numbering bracketed (for example SERMO XIII [Al. XII]); English translations of Leo's sermons in Nicene and Post-Nicene Fathers, Second Series, volume 12 follow the Ballerini numbers. No modern critical edition (Chavasse, CCSL 138-138A) was reached or collated. Registered 2026-11-18 for the Advent primer research."
