composed_basis = "The volume as a compilation was made for Migne's Paris series, but the registered scan is a Garnier reprint dated 1881 on both its title pages (artifact PDF pages 7 and 9, read on the images), and the date of the first Migne printing of this volume was not read on any page, so it is recorded unknown rather than taken from bibliography or inferred from the reprint. The fifth-century works it reprints are not dated by this record."
description = "The 54th volume of Migne's Latin series and the first volume of the works of Pope Leo the Great, reprinting the edition of the Ballerini brothers (post Paschasii Quesnelli recensionem ... curantibus Petro et Hieronymo fratribus Balleriniis, as its second title page states). Its own Elenchus (artifact PDF page 10, read on the image) lists: the Ballerini general preface (col. 13); Quesnel's preface (col. 31) and dedication (col. 47); the Life of Leo by Anastasius Bibliothecarius (col. 49); Schoenemann's bibliographical notice (col. 59); Operum genuinorum pars prima, the Sermones in praecipuis anni festivitatibus ad Romanos habiti with a dissertation on their manuscripts (col. 117); Appendix, Sermones S. Leoni attributi (col. 477); Observationes in sermones (col. 521); Operum genuinorum pars altera, the Epistolae (col. 551); Appendix prima, on lost letters and documents (col. 1217) and letters to Leo (col. 1233); Appendix II, Fragmenta S. Leoni attributa (col. 1255); Quesnel's various readings and notes on the letters with the Ballerini annotations (col. 1263); and concordances of the new order of the sermons (col. 1505) and letters (col. 1507) with the old. Within the sermons, the nine sermons De jejunio decimi mensis (Ballerini XII-XX) stand near the head of the series; sermons XII and XIII were read on PDF pages 90-93 (sermon XII chapter IV in columns 171-172 and sermon XIII in columns 172-173, on the images) and sermon XIX on PDF pages 99-100 (its opening in columns 185-186, on the images). A locus is the printed column number or the artifact PDF page."
