context = "The head-title reads: ANNO DOMINI MCLV-MCLXIX / ISAAC ABBAS DE STELLA / CISTERCIENSIS / ALCHERUS ET PETRUS DE ROYA / CLARAEVALLENSES MONACHI / NOTITIA. So Migne heads Isaac's works as those of Isaac, abbot of Stella, Cistercian, under the years 1155-1169. Read on a crop of the page image. Supports the descriptor that Isaac of Stella was a Cistercian abbot. A later leaf (n848, not registered) heads his sermons ISAAC DE STELLA SERMONES and, per the item's text search, titles him ABBATIS DE STELLA ORDINIS CISTERCIENSIS."
