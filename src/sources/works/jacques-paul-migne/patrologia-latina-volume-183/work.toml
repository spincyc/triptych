description = "The 183rd volume of Migne's Latin series and the second volume of St Bernard of Clairvaux's Opera omnia, reprinting Mabillon's third edition (tertiis curis D. Joannis Mabillon), editio nova, as its second title page states; it comprises Bernard's Operum tomus III and IV. Its own Elenchus (artifact PDF page 10, read on the image) lists: Operum tomus III, Sermones de tempore (col. 35), de sanctis (col. 359), de diversis (col. 537); Sententiae (col. 747); Aliae sententiae (col. 751); Parabolae (col. 757); Confessionis privatae formula (col. 773); Officium de S. Victore (col. 775); Operum tomus IV, Sermones in Cantica (col. 785). Within the Sermones de tempore the optical text's running heads place the sermons De adventu Domini at their head (col. 35) and the seventeen sermons In psalmum XC Qui habitat, in Quadragesima habiti, later in the same series. Within the Sermones de sanctis the sermons In festo S. Michaelis begin at about col. 447 (optical text) and end at the head of col. 453, where the five sermons In festo omnium Sanctorum begin (artifact PDF page 233, read on the image); those run to the head of col. 481 (PDF page 247, read on the image), where the sermons In transitu S. Malachiae begin. A locus is the printed column number or the artifact PDF page."
