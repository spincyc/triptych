notes = "ACCESS LIMITATION: the whole 83,831,139-byte scan is not retained, for its measured size; a reader without the network can open the retained excerpt artifact.jacques-paul-migne.patrologia-latina-volume-183.1854-paris.columns-453-481-facsimile-de0326c9, which holds the fifteen pages carrying Bernard's five sermons In festo omnium Sanctorum, and the tracked whole-volume optical text ia-djvu-text-44995734. PDF page 7 is the series title page, page 9 the Opera omnia title page and page 10 the Elenchus. Column-to-page rule, measured on pages 233-247: PDF page p carries columns 2p-13 and 2p-12 in the body of the volume. The pages carry 360 ppi page images with a text layer from optical recognition; no reading was taken from that layer where the image was legible."
