notes = "Fifteen pages only: parent PDF pages 233 (columns 453-454) through 247 (481-482). They carry Bernard's five sermons In festo omnium Sanctorum entire, from the heading of sermo I (De lectione evangelica, Videns Jesus turbas, Matth. v, 1-12) on page 233 to the close of sermo V at the head of column 481 on page 247, with the editors' notes. Page 233 also carries the close of the preceding sermon In festo S. Michaelis, and page 247 the opening of the sermons In transitu S. Malachiae. All other parent pages are omitted; the parent stays remote for its measured size."
