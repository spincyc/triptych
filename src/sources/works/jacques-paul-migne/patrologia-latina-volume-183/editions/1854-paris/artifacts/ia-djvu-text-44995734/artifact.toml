notes = "Uncorrected optical text of the whole volume, 123,797 LF-terminated lines, valid UTF-8. Bernard's five sermons In festo omnium Sanctorum stand at physical lines 40430-42980 (the headings of sermo I at line 40454, II at 41316, III at 41863, read by the recognizer as SERMO IL., IV at 42096 and V at 42473; the sermons In transitu S. Malachiae begin at line 42983), with the editors' footnotes interleaved; the optical order across Migne's two print columns and the notes is unreliable, and column numbers are often misread (456 as 496, 459 as 450, 479 as 419). QUOTE FROM THIS ARTIFACT ONLY AFTER CHECKING THE PAGE IMAGE: the sister artifact columns-453-481-facsimile-de0326c9 retains the fifteen pages of the All Saints sermons."
