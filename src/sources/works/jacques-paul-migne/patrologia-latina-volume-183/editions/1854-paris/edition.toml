notes = "The series title page (artifact PDF page 7 of the registered scan, read on the image) reads: PATROLOGIAE CURSUS COMPLETUS ... SERIES LATINA PRIOR ... ACCURANTE J.-P. MIGNE ... PATROLOGIAE LATINAE TOMUS CLXXXIII. S. BERNARDUS, ABBAS CLARAE-VALLENSIS. PARISIIS ... 1854. The second title page (PDF page 9) reads: SAECULUM XII. S. BERNARDI ABBATIS PRIMI CLARAE-VALLENSIS OPERA OMNIA ... POST HORSTIUM DENUO RECOGNITA ... TERTIIS CURIS D. JOANNIS MABILLON PRESBYTERI ET MONACHI BENEDICTINI E CONGREGATIONE S. MAURI. EDITIO NOVA ... ACCURANTE J.-P. MIGNE ... VOLUMEN SECUNDUM, S. BERNARDI OPERUM TOMUM III ET IV COMPLECTENS. PARISIIS ... 1854. The Internet Archive item metadata gives the date 1844; this record follows the two title pages. Mabillon is named because the title page names his third edition as the text reprinted; the numbered footnotes in the sermons (for example notes 69-71 in the All Saints sermons) are the editors' observations, not Bernard's. Migne's Paris volumes were reissued in later printings; only this 1854 printing, as the scan shows it, is identified here. No English edition is registered against this volume, and none was sought in this registration; no modern critical edition (the Leclercq-Rochais Sancti Bernardi Opera) was reached or collated."
