context = "Bernard of Clairvaux, Sermones in adventu Domini, sermo V (De medio adventu, et triplici innovatione), section 1 entire: the hidden middle coming between the coming in the flesh and the coming in glory. Read on PL 183 column 50 (PDF page 31, right column, from the sermon's heading) and column 51 (PDF page 32, left column, to the head of section 2)."
physical_line_ranges = [[1, 11]]
text = "Diximus nuper his qui deargentaverunt pennas suas, dormiendum inter medios cleros, duos significantes adventus: sed ubi sit dormiendum non diximus. Tertius enim quidam adventus est medius inter illos; in quo delectabiliter dormiunt qui eum norunt. Illi enim duo manifesti sunt, sed non iste. In priori quidem in terris visus, et cum hominibus conversatus est; quando, sicut ipse testatur, et viderunt, et oderunt. In posteriore vero videbit omnis caro salutare Dei nostri; et videbunt in quem transfixerunt. Medius occultus est, in quo soli eum in seipsis vident electi, et salvæ fiunt animæ eorum. In primo ergo venit in carne et infirmitate; in hoc medio, in spiritu et virtute; in ultimo, in gloria et majestate. Per virtutem enim pervenitur ad gloriam: quia Dominus virtutum ipse est Rex gloriæ. Et item alibi ait idem propheta: Ut viderem virtutem tuam, et gloriam tuam. Adventus siquidem iste medius, via quædam est, per quam a primo venitur ad ultimum. In primo Christus fuit redemptio nostra: in ultimo apparebit vita nostra: in isto ut dormiamus inter medios cleros, requies est et consolatio nostra."
