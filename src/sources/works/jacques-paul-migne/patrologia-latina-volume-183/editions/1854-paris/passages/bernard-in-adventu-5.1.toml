notes = "The page prints the bold marginal number 729 inside the sentence Per virtutem enim pervenitur ad gloriam; it is the earlier edition's page number and is omitted. OCR AGAINST PAGE: the optical text's 'via quidam' and 'salve. fiunt anim:' read on the page as 'via quædam' and 'salvæ fiunt animæ'. Bernard's sequence is primus, medius, ultimus; the Mount Melleray English numbers the comings first, second, third (see its passage bernard-in-adventu-5.1)."
