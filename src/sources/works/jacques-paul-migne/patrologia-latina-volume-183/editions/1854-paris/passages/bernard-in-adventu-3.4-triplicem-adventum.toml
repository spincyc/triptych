context = "Bernard of Clairvaux, Sermones in adventu Domini, sermo III, the last sentence of section 3 and the opening of section 4: the coming ad homines, in homines, contra homines. Read on PL 183 column 45 (PDF page 29, left column) whole."
physical_line_ranges = [[1, 5]]
text = "Hæc autem unde nosti, nisi quia non solum ad te, sed etiam in te venit? Triplicem enim ejus adventum novimus; ad homines, in homines, contra homines. Ad omnes quidem indifferenter, non autem ita in omnes, aut contra omnes. Sed quia primus et tertius noti sunt, utpote manifesti; de secundo, qui spiritualis et occultus est, ipsum audi dicentem: Si quis diligit me, sermonem meum servabit, et Pater meus diliget eum, et ad eum veniemus, et mansionem apud eum faciemus. Beatus, apud quem mansionem facies, Domine Jesu."
