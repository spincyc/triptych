context = "Bernard of Clairvaux, Homiliae super Missus est (De laudibus Virginis Matris), homily IV, section 8: the angel and the world await Mary's answer. Read on PL 183 column 83 (PDF page 48, left column) whole, from the end of section 7 through section 8 to the column's foot."
physical_line_ranges = [[1, 4]]
text = "Exspectat angelus responsum: tempus est enim ut revertatur ad Deum qui misit illum. Exspectamus et nos, o Domina, verbum miserationis, quos miserabiliter premit sententia damnationis. Et ecce offertur tibi pretium salutis nostræ: statim liberabimur si consentis. In sempiterno Dei Verbo facti sumus omnes, et ecce morimur: in tuo brevi responso sumus reficiendi, ut ad vitam revocemur."
