context = "Bernard of Clairvaux, Sermones in adventu Domini, sermo IV (De duplici adventu, et studio verarum virtutum; alias, De duplici adventu, et pennis deargentatis), the opening of section 1. Read on PL 183 column 47 (PDF page 30, left column) from the sermon's heading to the head of section 2."
physical_line_ranges = [[1, 5]]
text = "Dignum est, fratres, ut tota cum devotione Domini celebretis Adventum, delectati tanta consolatione, stupefacti tanta dignatione, inflammati tanta dilectione. Nec vero solum cogitetis adventum, quo venit quærere et salvum facere quod perierat, sed et illum nihilominus, quo veniet et assumet nos ad seipsum. Utinam circa hos duos adventus jugi meditatione versemini, ruminantes in cordibus vestris, quantum in priore præstiterit, quantum promiserit in secundo! Utinam certe dormiatis inter medios cleros! Hæc sunt enim duo brachia sponsi, inter quæ sponsa dormiens aiebat: Læva ejus sub capite meo, et dextera ejus amplexabitur me."
