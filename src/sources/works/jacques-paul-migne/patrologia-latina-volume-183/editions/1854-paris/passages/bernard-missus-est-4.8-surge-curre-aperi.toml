physical_line_ranges = [[1, 12]]
text = "Responde itaque citius angelo, imo per angelum Domino. Responde verbum, et suscipe Verbum: profer tuum, et concipe divinum: emitte transitorium, et amplectere sempiternum. Quid tardas? quid trepidas? Crede, confitere, et suscipe. Sumat humilitas audaciam, verecundia fiduciam. Nullatenus convenit nunc ut virginalis simplicitas obliviscatur prudentiam. In hac sola re ne timeas, prudens Virgo, præsumptionem: quia, etsi grata in silentio verecundia, magis tamen nunc in verbo pietas necessaria. Aperi, Virgo beata, cor fidei, labia confessioni, viscera Creatori. Ecce desideratus cunctis gentibus foris pulsat ad ostium. O si te morante pertransierit, et rursus incipias dolens quærere quem diligit anima tua! Surge, curre, aperi. Surge per fidem, curre per devotionem, aperi per confessionem."
