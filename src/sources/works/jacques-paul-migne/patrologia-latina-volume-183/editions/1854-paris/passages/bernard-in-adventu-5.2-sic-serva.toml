text = "Sic serva sermonem Dei, quomodo melius servare potes cibum corporis tui. Nam et ille panis vivus est, et cibus mentis. Panis terrenus dum in arca est, potest a fure tolli, potest a mure corrodi, potest vetustate corrumpi. Ubi vero comederis illum, quid horum timeas? Hoc modo custodi verbum Dei: beati enim qui custodiunt illud. Ergo trajiciatur in viscera quædam animæ tuæ; transeat in affectiones tuas, et in mores tuos. Comede bonum, et delectabitur in crassitudine anima tua. Ne obliviscaris comedere panem tuum, ne exarescat cor tuum, sed adipe et pinguedine repleatur anima tua."
