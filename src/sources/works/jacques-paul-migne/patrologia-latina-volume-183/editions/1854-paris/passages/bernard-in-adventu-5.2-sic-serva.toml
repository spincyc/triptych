context = "Bernard of Clairvaux, Sermones in adventu Domini, sermo V, section 2, from Sic serva sermonem Dei to the end of the section: the word of God kept as the body keeps its food. Read on PL 183 column 51 (PDF page 32, left column) with the whole of sections 2 and 3 on that column."
