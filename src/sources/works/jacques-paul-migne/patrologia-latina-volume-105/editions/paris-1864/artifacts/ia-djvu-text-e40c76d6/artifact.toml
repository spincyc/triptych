notes = "Uncorrected optical text of the whole volume, 110894 LF-terminated lines, valid UTF-8. Extent as measured by the retrieving lane: Complete Internet Archive optical-text layer of the whole of J.-P. Migne, Patrologiae cursus completus, Series Latina, vol. 105, which carries the Amalarian corpus. Retrieved as the one attempt this lane made on the medieval liturgical expositors and searched whole for 'mensis septimi', 'septimo mense', 'quatuor tempora', 'post Pentecosten' and 'de ordine antiphonarii'; the volume's Amalarian matter proves to be the Regula canonicorum and the four books De ecclesiasticis officiis, whose treatment of the Ember fasts is general and names no Sunday of the post-Pentecost series. A bounded negative: nothing in this lane rests on these bytes. QUOTE FROM THIS ARTIFACT ONLY THROUGH A CHECKED PASSAGE. It is uncorrected recognition of a two-column nineteenth-century printing, its line order is unreliable across the columns, and a raw-line negative over it cannot exclude a differently recognised spelling -- which bounds the searched negative the retrieving lane recorded on it."
