notes = "One digitisation is registered on this edition: Internet Archive item patrologiaecur105mign, whose text layer opens \"Digitized by the Internet Archive in 2011 with funding from University of Toronto\" and carries no Google matter, so it is retained. The text layer is not a facsimile: the optical order across Migne's two print columns is unreliable, as this repository already records of PL 30, and no page image of this volume was retrieved. NO ENGLISH EDITION exists or is registered here: Migne's series was never translated as a series, and each constituent work -- Amalarius's De ecclesiasticis officiis among them -- would have to be paired separately. The absence is recorded rather than left silent."
