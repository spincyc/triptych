composed = "1864"
composed_basis = "A nineteenth-century editorial compilation: the volume as a compilation was made in 1864, which is also the date of its only printing registered here, and its title page reads \"1864\" beneath the imprint of J.-P. Migne. The ninth-century works it reprints were each written far earlier -- its own head-note reads \"TRADITIO CATHOLICA. SAECULUM IX. ANNI 821-836\" -- and are dated on their own work records, not on this one."
description = "The hundred and fifth volume of Migne's Latin series, printed at Paris in 1864, whose \"Elenchus auctorum et operum qui in hoc tomo CV continentur\" carries the Amalarian corpus -- the Regula canonicorum and the four books De ecclesiasticis officiis -- beside Agobard of Lyons. A locus is the printed column number."
