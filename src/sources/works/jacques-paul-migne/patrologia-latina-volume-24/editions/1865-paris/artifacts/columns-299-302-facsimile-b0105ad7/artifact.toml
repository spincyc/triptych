notes = "Two pages only: parent PDF pages 154 (columns 299-300) and 155 (columns 301-302). They carry Jerome, Commentariorum in Isaiam liber VIII, on Isaiah 25:1-5 (end), the Vulgate and Septuagint lemmata of 25:6-8 with Jerome's comment (the feast on Mount Sion for all nations, death swallowed up as the Apostle says, tears wiped away when Christ's kingdom comes), and his comment on 25:9-12 (the people freed from death who say Ecce Deus noster iste; Moab interpreted de patre), with Vallarsi's and Martianay's notes. All other parent pages are omitted; the parent stays remote for its measured size."
