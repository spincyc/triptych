notes = "Two pages only: parent PDF pages 232 (columns 455-456) and 233 (columns 457-458). They carry Jerome, Commentariorum in Isaiam, the end of book XII, which closes on column 458 before the heading LIBER DECIMUS TERTIUS: the comment on Isaiah 44:24-28 (Cyrus called pastor meus, the Septuagint's ut sapiat, the edict of Cyrus in Esdras), the Vulgate lemma of 45:1-7, and Jerome's comment on 45:1-7 (many Latins and Greeks wrongly reading Christo meo Domino, Kyrio for Kyro; Cyrus called christus as anointed king; Xenophon's Cyropaedia; Josephus on Cyrus reading Isaiah; Cyrus in typum et imaginem of Christ; the folly of referring non cognovisti me to Christ; Ego Dominus et non est alter, the Father in the Son; light and darkness as peace and war; a tropological reading of the ecclesiastical man and against Marcion), then the opening of the next book. The running head over columns 457-458 prints LIB. XIII, although book XIII's own heading follows the text of 45:1-7 on column 458; the record cites the comment as book XII by that heading. All other parent pages are omitted; the parent stays remote for its measured size."
