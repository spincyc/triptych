context = "Jerome, Commentarii in Isaiam, book IV, on Isa. 11:2, citing the Gospel according to the Hebrews. PL 24 col. 148 D, facsimile PDF page 78, right column. Jerome quotes the Gospel read by the Nazaraeans, of which he has just made mention: at the Lord's baptism the whole fount of the Holy Spirit descends and rests on him and says, My Son, in all the prophets I was waiting for thee, that thou mightest come and I might rest in thee."
