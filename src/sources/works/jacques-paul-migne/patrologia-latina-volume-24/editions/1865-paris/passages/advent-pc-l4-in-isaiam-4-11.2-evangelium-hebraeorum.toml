text = "{IV, Is 11:2} Porro in Evangelio, cujus supra fecimus mentionem, hæc scripta reperimus: Factum est autem cum ascendisset Dominus de aqua, descendit fons omnis Spiritus sancti, et requievit super eum, et dixit illi: Fili mi, in omnibus prophetis exspectabam te, ut venires, et requiescerem in te. Tu es enim requies mea, tu es filius meus primogenitus, qui regnas in sempiternum."
