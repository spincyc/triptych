notes = "The words from Factum est autem to in sempiternum are Jerome's quotation of a non-canonical gospel, printed in italics; they are not Jerome's own words and the quotation is to be attributed as Jerome gives it. Omitted: the footnote marker after Spiritu sancto and the reference (Joan. i, 32, 33) in the preceding sentence, both outside the transcription. The scan of this page is coarse and some letters are broken or filled (for example the c of consurget prints like an e, the f of fruticem like an I); readings were settled at 300 dots per inch against the sense and the letter forms elsewhere on the page. Book IV: running heads LIB. IV on the facing pages; book V begins with the burden of Babylon (Isa. 13). OCR was used only to find the page."
