notes = "Omitted: (Isa. vii, 14) after filium; (Cant. ii, 1) after convallium. Ecce Virgo concipiet et pariet filium and Ego flos campi et lilium convallium print in italics. The scan of this page is coarse and some letters are broken or filled (for example the c of consurget prints like an e, the f of fruticem like an I); readings were settled at 300 dots per inch against the sense and the letter forms elsewhere on the page. Book IV: running heads LIB. IV on the facing pages; book V begins with the burden of Babylon (Isa. 13). OCR was used only to find the page."
