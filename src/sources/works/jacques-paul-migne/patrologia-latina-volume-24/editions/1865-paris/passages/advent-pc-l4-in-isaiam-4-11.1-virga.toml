context = "Jerome, Commentarii in Isaiam, book IV, on Isa. 11:1. PL 24 col. 147, lower half of the left column, facsimile PDF page 78. After the lemma of Isa. 11:1-2 and the statement that the whole prophecy to the burden of Babylon is of Christ, Jerome gives the Jewish reading of the rod and the flower (both the Lord: power of the reigning, beauty) and his own: the rod is the holy Virgin Mary, the flower is the Lord and Saviour."
physical_line_ranges = [[1, 3]]
text = "{IV, Is 11:1} Virgam et florem de radice Jesse, ipsum Dominum Judæi interpretantur: quod scilicet in virga regnantis potentia, in flore pulchritudo monstretur. {IV, Is 11:1} Nos autem virgam de radice Jesse sanctam Mariam Virginem intelligamus, quæ nullum habuit sibi fruticem cohærentem; de qua et supra legimus: Ecce Virgo concipiet et pariet filium. {IV, Is 11:1} Et florem Dominum Salvatorem, qui dicit in Cantico canticorum: Ego flos campi et lilium convallium."
