notes = "A container volume. The constituent title page, read in the page image at artifact PDF page 7, names Vallarsi and Maffei's revision of Martianay's Maurist recension, 'editio Parisiorum novissima, juxta secundam ab ipsis Veronensibus iteratis curis recensitam typis repetita', tomus quartus, 'excudebatur et venit apud J.-P. Migne', 1865; the series title at PDF page 5 gives Patrologiae Latinae tomus XXIV. The Internet Archive catalogue names Garnier fratres as publisher, which the title page does not. Column numbers are those of this 1865 printing and differ from the 1845 printing of the same volume."
