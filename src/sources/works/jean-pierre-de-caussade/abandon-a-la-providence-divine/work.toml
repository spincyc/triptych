description = "The treatise on abandonment to divine providence first published in 1861 by Henri Ramière, S.J., from a manuscript preserved at Montmirail and traditionally attributed to Jean-Pierre de Caussade, S.J. (1675-1751). The attribution is doubted by current scholarship: Ramière supplied the published title, reordered the material, and later added letters of uncertain authorship, and modern editors have questioned whether Caussade wrote the treatise at all. This record identifies the work without settling its authorship; editions must distinguish the Ramière recension from later editions based on the manuscript. Loci are given as book and chapter of the Ramière recension."
