notes = "Extent as the retrieving lane measured it: Complete file for McLean v. Arkansas Board of Education as CAP holds it, 529 F. Supp. 1249-1268, whole memorandum opinion with all footnotes, star markers *1250 through *1268 present plus a repeated *1251 and *1255 at the end of the file. TWO CAUTIONS FROM THE RETRIEVING LANE. The reporter or the transcription gives a publisher as 'Zonderman Publishing House' where the publisher of the title is Zondervan, so that name must not be reproduced without checking. And the file repeats star markers *1251 and *1255 at its end. The textbook the court quotes is in copyright and only the court's own brief quotation of it is usable."
