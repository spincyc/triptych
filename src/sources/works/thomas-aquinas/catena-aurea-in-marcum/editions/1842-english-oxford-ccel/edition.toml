notes = "The acquired XML historical Preface, paragraph ii-p4, credits JOHN DOBBEE DALGAIRNS, followed by J. H. N.; the manifest uses John Dalgairns without silently correcting the transcribed middle name. CCEL XML metadata incorrectly credits William Whiston in both deliveries; that catalog field is not adopted. The original Matthew translation appeared in 1841; 1842 here identifies the digital delivery's stated printing basis. This is a digital transcription with inherited defects, not a facsimile-collated diplomatic edition."
