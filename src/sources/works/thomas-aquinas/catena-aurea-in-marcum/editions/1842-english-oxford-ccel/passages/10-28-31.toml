text = "28. Then Peter began to say unto him, “Lo, we have left all, and have followed thee.” 29. And Jesus answered and said, “Verily I say unto you, There is no man that hath left house, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for My sake, and the Gospel’s, 30. But he shall receive an hundredfold now in this time, houses, and brethren, and sisters, and mothers, and children, and lands, with persecutions; and in the world to come eternal life. 31. But many that are first shall be last; and the last first.” Gloss.: Because the youth, on hearing the advice of our Saviour concerning the casting away of his goods, had gone away sorrowful, the disciples of Christ, who had already fulfilled the foregoing precept, began to question Him concerning their reward, thinking that they had done a great thing, since the young man, who had fulfilled the commandments of the law, had not been able to hear it without sadness. Wherefore Peter questions the Lord for himself and the others, in these words, “Then Peter began to say unto Him, Lo, we have left all, and have followed thee.” Theophylact: Although Peter had left but few things, still he calls these his all; for even a few things keep us by the bond of affection, so that he shall be beatified who leaves a few things. Bede: And because it is not sufficient to have left all, he adds that which makes up perfection, “and have followed thee.” As if he said, We have done what Thou hast commanded. What reward therefore wilt Thou give us? Theophylact: But while Peter asks only concerning the disciples, our Lord makes a general answer; wherefore it goes on: “Jesus answered and said, Verily I say unto you, There is no one that hath left house, or brethren, or sisters, or father, or mother, or children, or lands.” But in saying this, He does not mean that we should leave our fathers, without helping them, or that we should separate ourselves from our wives; but He instructs us to prefer the glory of God to the things of this world. Chrys., Hom. in Matt., 64: But it seems to me that by these words He intended covertly to proclaim that there were to be persecutions, as it would come to pass that many fathers would allure their sons to impiety, and many wives their husbands. Chrys., Cat. in Marc. Oxon.: Again He delays not to say, “for my name’s sake and the Gospel’s ” and Mark says, or “for the kingdom of God,” as Luke says; the name of Christ is the power of the Gospel, and of His kingdom; for the Gospel is received in the name of Jesus Christ, and the kingdom is made known, and comes by His name. Bede: Some, however, taking occasion from this saying, in which it is announced that he shall receive an hundredfold now in this time, teach that Jewish fable of a thousand years after the resurrection of the just, when all that we have left for the Lord’s sake is to be restored with manifold usury, besides which we are to receive the crown of everlasting life. These persons do no perceive, that although the promise in other respects be honourable, yet in the hundred wives, which the other Evangelists mention, its foulness is made manifest: particularly when the Lord testifies that there shall be not marriage in the resurrection, and asserts that those things which are put away from us for His sake are to be received again in this life with persecutions, which, as they affirm, will not take place in their thousand years. [ed. note: Certain early Fathers, as, for instance, St. Austin and Irenaeus, held the doctrine of the Millennium; Bede however mentions the Chilliasts (though their name is omitted in the Catena) and thus shews that he means the Corinthians, to whom that name was applied, on account of their shocking doctrine, that after the resurrection the Christians were to reign on earth for a thousand years in sensual pleasures, see Aug, de. Her. 8] Pseudo-Chrys.: This hundredfold reward therefore must be in participation, not in possession, for the Lord fulfilled this to them not carnally, but spiritually. Theophylact: For a wife is busied in a house about her husband’s food and raiment. See also how this is the case with the Apostles; for many women busied themselves about their food and their clothing, and ministered unto them. In like manner the Apostles had many fathers and mothers, that is, persons who loved them; as Peter, for instance, leaving one house, had afterwards the houses of all the disciples. And what is more wonderful, they are to be persecuted and oppressed, for it is “with persecutions” that the Saints are to possess all things, for which reason there follows, “But many that are first shall be last, and the last first.” For the Pharisees who were first became the last; but those who left all and followed Christ were last in this world through tribulation and persecutions, but shall be first by the hope which is in God. Bede: This which is here said, “shall receive an hundredfold,” may be understood in a higher sense. [see note, p. 78] For the number a hundred which is reckoned by changing from the left to the right hand, although it has the same appearance in the bending of the fingers as the ten had on the left, nevertheless is increased to a much greater quantity. This means, that all who have despised temporal things for the sake of the kingdom of heaven through undoubting faith, taste the joy of the same kingdom in this life which is full of persecutions, and in the expectation of the heavenly country, which is signified by the right hand, have a share in the happiness of all the elect. But because all do not accomplish a virtuous course of life with the same ardour as they began it, it is presently added, “But many that are first shall be last, and the last first”; for we daily see many persons who, remaining in a lay habit, are eminent for their meritorious life; but others, who from their youth have been ardent in a spiritual profession, at last wither away in the sloth of ease, and with a lazy folly finish in the flesh, what they had begun in the Spirit."
