  { line = 867, text = "Bede: Who dwelt in the tombs, because they delighted in dead works, that is, in sins; who were ever raging night and day, because whether in prosperity or in adversity, they were never free from the service of malignant spirits: again, by the foulness of their works, they lay as it were in the tombs, in their lofty pride, they wandered over the mountains, by words of most hardened infidelity, they as it were cut themselves with stones." },
  { line = 868, text = "But he said, “My name is Legion,” because the Gentile people were enslaved to divers idolatrous forms of worship. Again, that the unclean spirits going out from man enter into swine, which they cast headlong into the sea, implies that now that the people of the Gentiles are freed from the empire of demons, they who have not chosen to believe in Christ, work sacrilegious rites in hidden places." },
  { line = 869, text = "Theophylact: Or by this it is signified that devils enter into those men who live like swine, rolling themselves in the slough of pleasure; they drive them headlong into the sea down the precipice of perdition, into the sea of an evil life where they are choked." },
  { line = 870, text = "Pseudo-Jerome: Or they are choked in hell without any touch of mercy by the rushing on of an early death; which evils many persons thus avoid, for by the scourging of the fool, the wise is made more prudent." },
  { line = 871, text = "Bede: But that the Lord did not admit him, though he wished to be with Him, signifies, that every one after the remission of his sins should remember that he must work to obtain a good conscience, and serve the Gospel for the salvation of others, that at last he may rest in Christ." },
  { line = 872, text = "Greg., Mor., 37: For when we have perceived ever so little of the Divine knowledge, we are at once unwilling to return to human affairs, and seek for the quiet of contemplation; but the Lord commands that the mind should first toil hard at its work, and afterwards should refresh itself with contemplation." },
  { line = 873, text = "Pseudo-Jerome: But the man who is healed preached in Decapolis, where the Jews, who hang on the letter of the Decalogue, are being turned away from the Roman rule." },
]
