  { line = 1647, text = "For the devil was not able to inflict death upon him, because the true Life was come." },
  { line = 1648, text = "Bede: But him, whom the unholy spirit made like unto death, the holy Saviour saved by the touch of His hold hand; wherefore it goes on, “But Jesus took him by the hand, and lifted him up, and he arose.”" },
  { line = 1649, text = "Thus as the Lord had shewn Himself to be very God by the power of healing, so He shewed that He had the very nature of our flesh, by the manner of His human touch. The Manichaean [ed. note: “Their fundamental maxim of the intrinsic evil of matter and the degraded state of mind, which their speculations on the birth after the flesh brought with it involved the denial of the Incarnation of our Lord and, as a consequence, of the reality of His whole life.” (Note a, upon St. Augustine’s Confessions, Oxf. Tr. p. 325)] indeed madly denies that He was truly clothed in flesh; He Himself, however, by raising, cleansing, enlightening so many afflicted persons by His touch, condemned his heresy before its birth." },
  { line = 1650, text = "It goes on: “And when He was come into the house, His disciples asked Him privately, Why could not we cast him out?”" },
  { line = 1651, text = "Chrys.: They feared that perchance they had lost the grace conferred upon them; for they had already received power over unclean spirits." },
  { line = 1652, text = "It goes on: “And He said unto them, This kind can come forth by nothing but by prayer and fasting.”" },
  { line = 1653, text = "Theophylact: That is, the whole class of lunatics, or simply, of all persons possessed with devils. Both the man to be cured, and he who cures him, should fast; for a real prayer is offered up, when fasting is joined with prayer, when he who prays is sober and not heavy with food." },
  { line = 1654, text = "Bede: Again, in a mystical sense, on high the Lord unfolds the mysteries of the kingdom to His disciples, but below He rebukes the multitude for their sins of unfaithfulness, and expels devils from those who are vexed by them. Those who are still carnal and foolish, He strengthens, teaches, punishes, whilst He more freely instructs the perfect concerning the things of eternity." },
  { line = 1655, text = "Theophylact: Again, this devil is deaf and dumb; deaf, because he does not choose to hear the words of God; dumb, because he is unable to teach others their duty." },
  { line = 1656, text = "Pseudo-Jerome: Again, a sinner foameth forth folly, gnasheth with anger, pineth away in sloth. But the evil spirit tears him, when coming to salvation, and in like manner those whom he would drag into his maw he tears asunder by terrors and losses, as he did Job." },
  { line = 1657, text = "Bede: For oftentimes when we try to turn to God after sin, our old enemy attacks us with new and greater snares, which he does, either to instill into us a hatred of virtue, or to avenge the injury of his expulsion." },
  { line = 1658, text = "Greg., Mor. x., 30: But he who is freed from the power of the evil spirit is thought to be dead; for whosoever has already subdued earthly desires, puts to death within himself his carnal mode of life, and appears to the world as a dead man, and many look upon him as dead; for they who know not how to live after the Spirit, think that he who does not follow after carnal pleasures is altogether dead." },
  { line = 1659, text = "Pseudo-Jerome: Further, in his being vexed from his infancy, the Gentile people is signified, from the very birth of whom the vain worship of idols arose, so that they in their folly sacrificed their children to devils. And for this reason it is said that “it cast him into the fire and into the water;” for some of the Gentiles worshipped fire, others water." },
  { line = 1660, text = "Bede: Or by this demoniac are signified those who are bound by the guilt of original sin, and coming into the world as criminals, are to be saved by grace; and by fire is meant the heat of anger, by water, the pleasures of the flesh, which melt the soul by their sweetness." },
  { line = 1661, text = "But He did not rebuke the boy, who suffered violence, but the devil, who inflicted it, because he who desires to amend a sinner, ought, whilst he exterminates his vice by rebuking and cursing it, to love and cherish the man." },
  { line = 1662, text = "Pseudo-Jerome: Again, the Lord applies to the evil spirit what he had inflicted on the man, calling him a “deaf and dumb spirit,” because he never will hear and speak what the penitent sinner can speak and hear. But the devil, quitting a man, never returns, if the man keep his heart with the keys of humility and charity, and hold possession of the gate of freedom [ed. note: of “fastness”.]. The man who was healed became as one dead, for it is said to those who are healed, “Ye are dead, and your life is hid with Christ in God.”" },
  { line = 1663, text = "Theophylact: Again, when Jesus, that is, the word of the Gospel, takes hold of the hand, that is, of our powers of action, then shall we be freed from the devil. And observe that God first helps us, then it is required of us that we do good; for which reason it is said that Jesus “raised him;” in which is shewn the aid of God, and that “he arose,” in which is declared the zeal of man." },
  { line = 1664, text = "Bede: Further, our Lord, while teaching the Apostles how the worst devil is to be expelled, gives all of us rules for our life; that is, He would have us know that all the more grievous attacks of evil spirits or of men are to be overcome by fastings and prayers; and again, that the anger of the Lord, when it is kindled for vengeance on our crimes, can be appeased by this remedy alone." },
  { line = 1665, text = "But fasting in general is not only abstinence from food, but also from all carnal delights, yea, from all vicious passions. In like manner, prayer taken generally consists not only in the words by which we call upon the Divine mercy, but also in all those things which we do with the devotedness of faith in obedience to our Maker, as the Apostle testifies, when he says, “Pray without ceasing.” [Thes 5:17]" },
  { line = 1666, text = "Pseudo-Jerome: Or else, the folly which is connected with the softness of the flesh, is healed by fasting; anger and laziness are healed by prayer. Each would has its own medicine, which must be applied to it; that which is used for the heel will not cure the eye; by fasting, the passions of the body, by prayer, the plagues of the soul, are healed." },
]
