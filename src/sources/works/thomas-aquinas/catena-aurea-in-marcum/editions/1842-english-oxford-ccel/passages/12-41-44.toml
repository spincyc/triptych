text = "41. And Jesus sat over against the treasury, and beheld how the people cast money into the treasury: and many that were rich cast in much. 42. And there came a certain poor widow, and she threw in two mites, which make a farthing. 43. And He called unto Him His disciples, and saith unto them, “Verily I say unto you, that this poor widow hath cast more in, than all they which have cast into the treasury: 44. For all they did cast in of their abundance; but she of her want did cast in all that she had, even all her living.” Bede: The Lord, who had warned them to avoid the desire of high place and vain glory, now distinguishes by a sure test those who brought in gifts. Wherefore it is said, “And Jesus sat over against the treasury, and beheld how the people cast money into the treasury.” In the Greek language, “phylassein”, means to keep, and “gaza” is a Persian word for treasure; wherefore the word “gazophylacium” which is here used means a place where riches are kept, which name also was applied to the chest in which the offerings of the people were collected, for the necessary uses of the temple, and to the porch in which they were kept. You have a notice of the porch in the Gospel, “These words spake Jesus in the treasury as He taught in the temple:” [John 8:20] and of the chest in the book of Kings, “But Jehoiada the priest took a chest.” [2 Kings 12:9] Theophylact: Now there was a praiseworthy custom amongst the Jews, that those who were able and willing should put something into the treasury, for the maintenance of the priests, the poor, and the widows. Wherefore there is added, “And many that were rich cast in much.” But whilst many people were so engaged, a poor widow came up, and shewed her love by offering money according to her ability. Wherefore it is said, “And there came a certain poor widow, and she threw in two mites, which make a farthing.” Bede: Reckoners use the words “quadrans” for the fourth part of any thing, be it place, money, or time. Perhaps then in this place is meant the fourth part of a shekel, this is, five pence. It goes on: “And He called unto Him His disciples, and saith unto them, Verily I say unto you, That this poor widow hath cast more in, than all they which have cast into the treasury:” for God does not weigh the property but the conscience of those who offer; nor did He consider the smallness of the sum in her offering, but what was the store from which it came. Wherefore He adds, “For all they did cast in of their abundance, but she of her want did cast in all that she had, even all her living.” Pseudo-Jerome: But in a mystical sense, they are rich, who bring forth from the treasure of their heart things new and old, which are the obscure and hidden things of Divine wisdom in both testaments; but who is the poor woman, if it be not I and those like me, who cast in what I can, and have the will to explain to you, where I have, not the power. For God does not consider how much ye bear, but what is the store from which it comes; but each at all events can bring his farthing, that is, a ready will, which is called a farthing, because it is accompanied by three things, that is, thought, word and deed. And in that it is said that “she cast in all her living,” it is implied that all that the body wants is that by which it lives. Wherefore it is said, “All the labour of man is for his mouth.” [Eccl 6:7] Theophylact: Or else; that widow is the soul of man, which leaving Satan to which it had been joined, casts into the temple two mites, that is, the flesh and the mind, the flesh by abstinence, the mind by humility, that so it may be able to hear that it has cast away all its living, and has consecrated it, leaving nothing for the world of all that it possessed. Bede: Again, in an allegorical way, the rich men, who cast gifts into the treasury, point out the Jews puffed up with the righteousness of the law; the poor widow is the simplicity of the Church: poor indeed, because she has cast away the spirit of pride and of the desires of worldly things; and a widow, because Jesus her husband has suffered death for her. She casts two mites into the treasury, because she brings the love of God and of her neighbour, or the gifts of faith and prayer; which are looked upon as mites in their own insignificance, but measured by the merit of a devout intention are superior to all the proud works of the Jews. The Jew sends of his abundance into the treasury, because he presumes on his own righteousness; but the Church sends her whole living into God’s treasury, because she understands that even her very living is not of her own desert, but of Divine grace."
