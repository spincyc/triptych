text = "16. Now as He walked by the sea of Galilee, He saw Simon, and Andrew his brother, casting a net into the sea; for they were fishers. 17. And Jesus said unto them, “Come ye after Me, and I will make you to become fishers of men.” 18. And straightway they forsook their nets, and followed Him. 19. And when He had gone a little farther thence, He saw James, the son of Zebedee, and John, his brother, who also were in the ship mending their nets. 20. And straightway He called them: and they left their father Zebedee in the ship with the hired servants, and went after Him. Gloss.: The Evangelist, having mentioned the preaching of Christ to the multitude, goes on to the calling of the disciples, whom He made ministers of His preaching, whence it follows, “And passing along the sea of Galilee, &c.” Theophylact: As the Evangelist John relates, Peter and Andrew were disciples of the Forerunner, but seeing that John had borne witness to Jesus, they joined themselves to him; afterwards, grieving that John had been cast into prison, they returned to their trade. Wherefore there follows, “casting nets into the sea, for they were fishers.” Look then upon them, living on their own labours, not on the fruits of iniquity; for such men were worthy to become the first disciples of Christ; whence it is subjoined, “And Jesus said unto them, Come ye after Me.” Now He calls them for the second time; for this is the second calling in respect of that, of which we read in John. But it is shewn to what they were called, when it is added, “I will make you become fishers of men.” Remig.: For by the net of holy preaching they drew fish, that is, men, from the depths of the sea, that is, of infidelity, to the light of faith. Wonderful indeed is this fishing! for fishes when they are caught, soon after die; when men are caught by the word of preaching, they rather are made alive. Bede, in Marc., 1, 6: Now fishers and unlettered men are sent to preach, that the faith of believers might be thought to lie in the power of God, not in eloquence or in learning. It goes on to say, “and immediately they left their nets, and followed Him.” Theophylact: For we must not allow any time to lapse, but at once follow the Lord. After these again, He catches James and John, because they also, though poor, supported the old age of their father. Wherefore there follows, “And when He had gone a little farther thence, He saw James, the son of Zebedee, &c.” But they left their father, because he would have hindered them in following Christ. Do thou, also, when thou art hindered by thy parents, leave them, and come to God. It is shewn by this that Zebedee was not a believer; but the mother of the Apostles believed, for she followed Christ, when Zebedee was dead. Bede: It may be asked, how he could call two fishers from each of the boats, (first, Peter and Andrew, then having gone a little further, the two others, sons of Zebedee,) when Luke says that James and John were called to help Peter and Andrew, and that it was to Peter only that Christ said, “Fear not, from this time thou shalt catch men;” [Luke 5:!0] he also says, that “at the same time, when they had brought their ships to land, they followed Him.” We must therefore understand that the transaction which Luke intimates happened first, and afterwards that they, as their custom was, had returned to their fishing. So that what Mark here relates happened afterwards; for in this case they followed the Lord, without drawing their boats ashore, (which they would have done had they meant to return,) and followed Him, as one calling them, and ordering them to follow. Pseudo-Jerome: Further, we are mystically carried away to heaven, like Elias, by this chariot, drawn by these fishers, as by four horses. On these four corner-stones the first Church is built; in these, as in the four Hebrew letters, we acknowledge the tetragrammation, the name of the Lord, we who are commanded, after their example, to “hear” the voice of the Lord, and “to forget” the “people” of wickedness, and “the house of our fathers’ ” [Ps 45:10] conversation, which is folly before God, and the spider’s net, in the meshes of which we, like gnats, were all but fallen, and were confined by things vain as the air, which hangs on nothing; loathing also the ship of our former walk. For Adam, our forefather according to the flesh, is clothed with the skins of dead beasts; but now, having put off the old man, with his deeds, following the new man we are clothed with those skins of Solomon, with which the bride rejoices that she has been made beautiful [Song of Songs, 1:4]. Again, Simon, means obedient; Andrew, manly; James, supplanter [ed. note: Cf. vol i, 139, 140, 364]; John, grace; by which four names, we are knit together into God’s host [ed. note: Al. ‘in imaginem’] ; by obedience, that we may listen; by manliness, that we do battle; by overthrowing, that we may persevere; by grace, that we may be preserved. Which four virtues are called cardinal; for by prudence, we obey; by justice, we bear ourselves manfully; by temperance, we tread the serpent underfoot; by fortitude, we earn the grace of God. Theophylact: We must know also, that action is first called, then contemplation; for Peter is the type of the active life, for he was more ardent than the others, just as the active life is the more bustling; but John is the type of the contemplative life, for he speaks more fully of divine things."
