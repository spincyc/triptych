notes = "Exact CCEL English digital witness of the Oxford Catena inspected on 2026-11-26; no facsimile collation and no collation with the Latin. Not verified. Attribute as the Catena gives it. MISATTRIBUTION: only the first sentence (the earth as the place of the flesh) is Gregory's (Hom. 9.1); the rest is Bede's own exposition of Mark 13:34-37 (Bede, In Marci evangelium, artifact line 404-405 of latin-text-b8197766: Janitori quoque praecepit ut vigilaret ... Universi januas cordium nostrorum ... servare jubemur). Cite it as the Catena's text, not as Gregory."
