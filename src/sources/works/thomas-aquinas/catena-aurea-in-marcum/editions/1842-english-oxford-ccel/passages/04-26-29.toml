text = "26. And He said, “So is the kingdom of god, as if a man should cast seed into the ground; 27. And should sleep, and rise night and day, and the seed should spring and grow up, he knoweth not how. 28. For the earth bringeth forth fruit of herself; first the blade, then the ear, after that the full corn in the ear. 29. But when the fruit is brought forth, immediately he putteth in the sickle, because the harvest is come.” Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: A parable occurred, a little above, about the three seeds which perished in various ways, and the one which was saved; in which last He also shews three differences, according to the proportion of faith and practice. Here, however, He puts forth a parable concerning those only who are saved. Wherefore it is said, “And He said, So is the kingdom of God, as if a man should cast seed into the ground, &c.” Pseudo-Jerome: The kingdom of God is the Church, which is ruled by God, and herself rules over men, and treads down the powers which are contrary to her, and all wickedness. Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: Or else He calls by the name of kingdom of God, faith in Him, and in the economy of His Incarnation; which kingdom indeed is as if a man should throw seed. For He Himself being God and the Son of God, having without change been made man, has cast seed upon the earth, that is, He has enlightened the whole world by the word of divine knowledge. Pseudo-Jerome: For the seed is the word of life, the ground is the human heart, and the sleep of the man means the death of the Saviour. The seed springs up night and day, because after the sleep of Christ, the number of Christians, through calamity and prosperity, continued to flourish more and more in faith, and to wax greater in deed. Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: Or Christ Himself is the man who rises, for He sat waiting with patience, that they who received seed should bear fruit. He rises, that is, by the word of His love, He makes us grow to the bringing forth fruit, by the armour of righteousness on the right hand, [2 Cor 6:7] by which is meant the day, and on the left, by which is meant the night of persecution; for by these the seed springs up, and does not wither. Theophylact: Or else Christ sleeps, that is, ascends into heaven, where, though He seem to sleep, yet He rises by night, when through temptations He raises us up to the knowledge of Himself; and in the day time, when on account of our prayers, He sets in order our salvation. Pseudo-Jerome: But when He says, “He knoweth not how,” He is speaking in a figure; that is, He does not make known to us, who amongst us will produce fruit unto the end. Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: Or else He says, “He knoweth not,” that He may shew the free-will of those who receive the word, for He commits a work to our will, and does not work the whole Himself alone, lest the good should seem involuntary. For the earth brings forth fruits of its own accord, that is, she is brought to bear fruit without being compelled by a necessity contrary to her will. “First the blade.” Pseudo-Jerome: That is, fear. For “the fear of God is the beginning of wisdom. Then the full corn in the ear;” [Ps 111:10] that is, charity, for charity is the fulfilling of the Law. [see Rom 13:8] Pseudo-Chrys., Vict. Cat. e Cat. in Marc.: Or, first it produces the blade, in the law of nature, by degrees growing up to advancement; afterwards it brings forth the ears, which are to be collected into a bundle, and to be offered on an altar to the Lord, that is, in the law of Moses; afterwards the full-fruit, in the Gospel. Or because we must not only put forth leaves by obedience, but also learn prudence, and, like the stalk of corn, remain upright without minding the winds which blow us about. We must also take heed to our soul by a diligent recollection, that, like the ears, we may bear fruit, that is, shew forth the perfect operation of virtue. Theophylact: for we put forth the blade when we shew a principle of good; then the ear, when we can resist temptations; then comes the fruit, when a man works something perfect. It goes on: “and when it has brought forth the fruit, immediately he sendeth the sickle, because the harvest is come.” Pseudo-Jerome: The sickle is death or the judgment, which cuts down all things; the harvest is the end of the world. Gregory, in Ezech, 2, Hom. 3: Or else, Man casts seed into the ground, when he places a good intention in his heart; and he sleeps, when he already rests in the hope which attends on a good work. But he rises night and day, because he advances amidst prosperity and adversity, though he knows it not, for he is as yet unable to measure his increase, and yet virtue, once conceived, goes on increasing. When therefore we conceive good desires, we put seed into the ground; when we begin to work rightly, we are the blade. When we increase to the perfection of good works, we arrive at the ear; when we are firmly fixed in the perfection of the same working, we already put forth the full corn in the ear."
