text = "9. “But take heed to yourselves: for they shall deliver you up to councils; and in the synagogues ye shall be beaten: and ye shall be brought before rulers and kings for My sake, for a testimony against them. 10. And the Gospel must first be published among all nations. 11. But when they shall lead you, and deliver you up, take no thought beforehand what ye shall speak, neither do ye premeditate: but whatsoever shall be given you in that hour, that speak ye: for it is not ye that speak, but the Holy Ghost. 12. Now the brother shall betray the brother to death, and the father the son; and children shall rise up against their parents, and shall cause them to be put to death. 13. And ye shall be hated of all men for My name’s sake: but he that shall endure unto the end, the same shall be saved. Bede: The Lords shews how Jerusalem and the province of Judaea merited the infliction of such calamities, in the following words: “But take heed to yourselves: for they shall deliver you up to councils; and in the synagogues ye shall be beaten.” For the greatest cause of destruction to the Jewish people was, that after slaying the Saviour, they also tormented the heralds of His name and faith with wicked cruelty. Theophylact: Fitly also did He premise a recital of those things which concerned the Apostles, that in their own tribulations they might find some consolation in the community of troubles and sufferings. There follows: “And ye shall be brought before rulers and kings for My sake, for a testimony against them.” He says “kings and rulers,” as, for instance, Agrippa, Nero and Herod. Again, His saying, “for My sake,” gave them no small consolation, in that they were about to suffer for His sake. “For a testimony against them,” means, as a judgment beforehand against them, that they might be inexcusable, in that though the Apostles were labouring for the truth, they would not join themselves to it. Then, that they might not think that their preaching should be impeded by troubles and dangers, He adds: “And the Gospel must first be published among all nations.” Augustine, de Con. Evan., ii, 77: Matthew adds, “And then shall the end come.” [Matt 24:14] Bede: Ecclesiastical historians testify that this was fulfilled, for they relate that all the Apostles long before the destruction of the province of Judaea were dispersed to preach the Gospel over the whole world, except James the son of Zebedee and James the brother of our Lord, who had before shed their blood in Judaea for the word of the Lord. Since then the Lord knew that the hearts of the disciples would be saddened by the fall and destruction of their nation, He relieves them by this consolation, to let them know that even after the casting away of the Jews, companions in their joy and heavenly kingdom should not be wanting, nay that many more were to be collected out of all mankind than perished in Judaea. Gloss.: Another anxiety might also arise in the breasts of the disciples. Lest therefore after hearing that they were to be brought before kings and rulers, they should fear that their want of science and eloquence should render them unable to answer, our Lord consoles them by saying, “But when they shall lead you and deliver you up, take no thought beforehand what ye shall speak, but whatsoever shall be given you in that hour, that speak ye.” Bede: For when we are led before judges for Christ’s sake, all our duty is to offer up our will for Christ. As for the rest, Christ Himself who dwells in us speaks for us, and the grace of the Holy Ghost shall be given us, when we answer. Wherefore it goes on: “For it is not ye that shall speak, but the Holy Ghost.” Theophylact: He also foretells to them a worse evil, that they should suffer persecution from their relations. Wherefore there follows: “Now the brother shall betray the brother to death, and the father the son; and children shall rise up against their parents, and shall cause them to be put to death; and ye shall be hated of all men for My name’s sake.” Bede: This has often been seen in time of persecution, nor can there be any firm affection amongst men who differ in faith. Theophylact: And this He says, that on hearing it, they might prepare themselves to bear persecutions and ills with greater patience. Then He brings them consolation, saying, “And ye shall be hated of all men for My name’s sake;” for the being hated for Christ’s sake is a sufficient reason for suffering persecutions patiently, for it is not the punishment, but the cause, that makes the martyr. Again, that which follows is no small comfort amidst persecution: “But he that shall endure unto the end, the same shall be saved.”"
