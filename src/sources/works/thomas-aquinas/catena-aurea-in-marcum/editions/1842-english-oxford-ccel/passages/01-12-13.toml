text = "12. And immediately the spirit driveth Him into the wilderness. 13. And He was there in the wilderness forty days, tempted of Satan; and was with the wild beasts; and the angels ministered unto Him. Chrys., Hom. in Matt., xiii: Because all that Christ did and suffered was for our teaching, He began after His baptism to dwell in the wilderness, and fought against the devil, that every baptized person might patiently sustain greater temptations after His baptism, nor be troubled, as if this which happened to Him was contrary to His expectation, but might bear up against all things, and come off conqueror. For although God allows that we should be tempted for many other reasons, yet for this cause also He allows it, that we may know, that man when tempted is placed in a station of greater honour. For the Devil approaches not save where he has beheld one set in a place of greater honour; and therefore it is said, “And immediately the Spirit drove Him into the wilderness.” And the reason why He does not simply say that He went into the wilderness, but was driven, is that thou mayest understand that it was done according to the word of Divine Providence. By which also He shews that no man should thrust himself into temptation, but that those who from some other state are as it were driven into temptation, remain conquerors. Bede, in Marc., 1, 5: And that no one might doubt, by what spirit he said that Christ was driven into the wilderness, Luke has on purpose premised, that “Jesus being full of the Spirit returned from Jordan, “ and then has added, “and was led by the Spirit into the wilderness;” lest the evil spirit should be thought to have any power over Him, who, being full of the Holy Spirit, departed whither He was willing to go, and did what He was willing to do. Chrys., in Matt., Hom., xiii: But the Spirit drove Him into the wilderness, because He designed to provoke the devil to tempt Him, and thus gave Him an opportunity not only by hunger, but also by the place. For then most of all does the devil thrust himself in, when he sees men remaining solitary. Bede: But He retires into the desert that He may teach us that, leaving the allurements of the world, and the company of the wicked, we should in all things obey the Divine commands. He is left alone and tempted by the devil, that He might teach us, “that all that will live godly in Christ Jesus shall suffer persecution;” [2 Tim 3:12] whence it follows, “And He was in the wilderness forty days and forty nights, and was tempted of Satan.” But He was tempted forty days and forty nights that He might shew us that as long as we live here and serve God, whether prosperity smile upon us, which is meant by the day, or adversity smite us, which agrees with the figure of night, at all times our adversary is at hand, who ceases not to trouble our way by temptations. For “the forty days and forty nights” imply the whole time of this world, for the globe in which we are serving God is divided into four quarters. Again, there are Ten Commandments, by observing which we fight against our enemy, but four times ten are forty. There follows, “and He was with the wild beasts.” Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: But He says this to shew of what nature was the wilderness, for it was impassable by man and full of wild beasts. It goes on; “and angels ministered unto Him.” For after temptation, and a victory against the devil, He worked the salvation of man. And thus the Apostle says, “Angels are sent to minister for them who shall be heirs of salvation.” [Heb 1:14] We must also observe, that to those who conquer in temptation angels stand near and minister. Bede: Consider also that Christ dwells among the wild beasts as man, but, as God, uses the ministry of Angels. Thus, when in the solitude of a holy life we bear with unpolluted mind the bestial manners of men, we merit to have the ministry of Angels, by whom, when freed from the body, we shall be transferred to everlasting happiness. Pseudo-Jerome: Or then the beasts dwell with us in peace, as in the ark clean animals with the unclean, when the flesh lusts not against the spirit. After this, ministering Angels are sent to us, that they may give answers and comforts to hearts that watch."
