  { line = 673, text = "Wherefore it goes on, “Lest at any times they should be, &c.”" },
  { line = 674, text = "Augustine, Quaest, 14, in Matt.: Or else they deserved this, their not understanding, and yet this in itself was done in mercy to them, that they might know their sins, and, being converted, merit pardon." },
  { line = 675, text = "Bede: To those then who are without, all things are done in parables, that is, both the actions and the words of the Saviour, because neither in those miracles which He was working, nor in those mysteries which He preached, were they able to acknowledge Him as God. Therefore they are not able to attain to the remission of their sins." },
  { line = 676, text = "Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: But His speaking to them only in parables, and yet not leaving off speaking to them entirely, shews that to those who are placed near to what is good, though they may have no good in themselves, still good is shewn disguised." },
  { line = 677, text = "But when a man approaches it with reverence and a right heart, he wins for himself an abundant revelation of mysteries; when on the contrary his thoughts are not sound, he will be neither made worthy of those things which are easy to many men, nor even of hearing them." },
  { line = 678, text = "There follows, “And He said unto them, Know ye not this parable, how then shall ye know all parables?”" },
  { line = 679, text = "Pseudo-Jerome: For it was necessary that they to whom He spoke in parables should ask for what they did not understand, and learn by the Apostle whom they despised, the mystery of the kingdom which they themselves had not." },
  { line = 680, text = "Gloss.: And for this reason, the Lord in saying these things, shews that they ought to understand both this first, and all following miracles." },
  { line = 681, text = "Wherefore explaining it, He goes on, “The sower soweth the word.”" },
  { line = 682, text = "Chrys., in Matt., Hom. 44: And indeed the prophet has compared the teaching of the people to the planting of a vine; [Isa 5] in this place however it is compared to sowing, to shew that obedience is now shorter and more easy, and will sooner yield fruit." },
  { line = 683, text = "Bede: But in this exposition of the Lord there is embraced the whole range of those who might hear the words of truth, but are unable to attain to salvation. For there are some to whom no faith, no intellect, nay no opportunity of trying its usefulness, can give a perception of the word which they hear; of whom He says, “And these are by the wayside.” For unclean spirits take away at once the word committed to their hearts, as birds carry away the seed of the trodden way. There are some who both experience its usefulness and feel a desire for it, but some of them the calamities of this world frighten, and others its prosperity allures, so that they do not attain to that which they approve. Of the first of whom He says, “And these are they who fell on stony ground;” of the latter, “And these are they which are sown among thorns.” But riches are called thorns, because they tear the soul with the piercing of its own thoughts, and after bringing it to sin, they, as one may say, make it bleed by inflicting a wound." },
  { line = 684, text = "Again He says, “And the toil of this world, and the deceitfulness of riches;” for the man who is deceived by an empty desire of riches must soon be afflicted by the toils of continual cares." },
  { line = 685, text = "He adds, “And the lusts of other things;” because, whosoever despises the commandments of God, and wanders away lustfully seeking other things, is unable to attain to the joy of beatitude. And concupiscences of this sort choke the word, because they do not allow a good desire to enter into the heart, and, as it were, stifle the entrance of vital breath." },
  { line = 686, text = "There are, however, excepted from these different classes of men, the Gentiles who do not even have grace to hear the words of life." },
  { line = 687, text = "Theophylact: Further, of those who receive the seed as they ought there are three degrees." },
  { line = 688, text = "Wherefore it goes on, “And these are they who are sown on good ground.”" },
  { line = 689, text = "Those who bear fruit an hundred-fold are those who lead a perfect and an obedient life, as virgins and hermits. Those who bear fruit sixty-fold are those who are in the mean as continent persons [ed. note: The word translated continentes . . . means ascetics, who mix in the affairs of the world; whereas hermits lived quite out of them, and gave themselves up to contemplation; caenobites came between the two, living together in convents, and combined both the practical and contemplative life, see Greg. Naz. Or. 43, 62] and those who are living in convents." },
  { line = 690, text = "Those who bear thirty-fold are those who though weak indeed, bear fruit according to their own virtue, as laymen and married persons." },
  { line = 691, text = "Bede: Or he bears thirty-fold, who instills into the minds of the elect faith in the Holy Trinity; sixty-fold, who teaches the perfection of good works; a hundred-fold, who shews the rewards of the heavenly kingdom." },
  { line = 692, text = "For in counting a hundred, we pass on to the right hand [ed. note: “He alludes to the mode of counting among the ancients. All numbers were signified by fingers of the left hand, either straight or variously bent, up to a hundred; and then they changed to the right. Consult Caelius Rhodiginus, Lectionum Antiq. lib. 23, cap. 11, 12.” Benedictine note on Greg. Hom. in Ezec. lib. 2, Hom., 5]; therefore that number is fitly made to signify everlasting happiness." },
  { line = 693, text = "But the good ground is the conscience of the elect, which does the contrary to all the former three, which both receives with willingness the seed of the word committed to it, and keeps it when received up to the season of fruit." },
  { line = 694, text = "Pseudo-Jerome: Or else the fruits of the earth are contained in thirty, sixty, or a hundred-fold, that is, in the Law, the Prophets, and the Gospel." },
]
