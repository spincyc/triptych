text = "22. And He cometh to Bethsaida; and they bring a blind man unto Him, and besought Him to touch him. 23. And He took the blind man by the hand, and led him out of the town; and when He had spit on his eyes, and put His hands upon him, He asked him if he saw ought. 24. And he looked up and said, “I see men as trees, walking.” 25. After that He put His hands again upon his eyes, and made him look up: and he was restored, and saw every man clearly. 26. And He sent him away to his house, saying, “Neither go into the town, nor tell it to any in the town.” Gloss.: After the feeding of the multitude, the Evangelist proceeds to the giving sight to the blind, saying, “And they came to Bethsaida, and they bring a blind man to Him, and besought Him to touch him.” Bede, in Marc., 2, 34: Knowing that the touch of the Lord could give sight to a blind man as well as cleanse a leper. It goes on, “And He took the blind man by the hand, and led him out of the town.” Theophylact: For Bethsaida appears to have been infected with much infidelity, wherefore the Lord reproaches it, “Woe to thee, Bethsaida, for if the mighty works which were done in you had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.” [Matt. 11, 21] He then takes out of the town the blind man, who had been brought to Him, for the faith of those who brought him was not true faith. It goes on, “And when He had spit in his eyes, and put His hands upon him, He asked him if he saw ought.” Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: He spat indeed, and put His hand upon the blind man, because He wished to shew that wonderful are the effects of the Divine word added to action; for the hand is the symbol of working, but the spittle, of the word proceeding out of the mouth. Again He asked him whether he could see any thing, which He had not done in the case of any whom He had healed, thus shewing that by the weak faith of those who brought him, and of the blind man himself, his eyes could not altogether be opened. Wherefore there follows: “And He looked up, and said, I see men as trees walking;” because he was still under the influence of unfaithfulness, he said that he saw men obscurely. Bede: Seeing indeed the shapes of bodies amongst the shadows, but unable to distinguish the outlines of the limbs, from the continued darkness of his sight; just as trees standing thick together are wont to appear to men who see them from afar, or by the dim light of the night, so that it cannot easily be known whether they be trees or men. Theophylact: But the reason why he did not see at once perfectly, but in part, was, that he had not perfect faith; for healing is bestowed in proportion to faith. Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: From the commencement, however, of the return of his senses, He leads him to apprehend things by faith, and thus makes him see perfectly; wherefore it goes on, “After that, He put His hands again upon his eyes, and he began to see,” and afterwards he adds, “And he was restored, and saw all things clearly,” that is, being perfectly healed in his senses and his intellect. It goes on, “And He sent him away to his house, saying, Go into thy home, and if thou enter into the town, tell it not to any one.” Theophylact: These precepts He gave him, because they were unfaithful, as has been said, lest perchance he should receive hurt in his soul from them, and they by their unbelief should run into a more grievous crime. Bede: Or else, He leaves an example to His disciples that they should not seek for popular favour by the miracles which they did. Pseudo-Jerome: Mystically, however, Bethsaida is interpreted, ‘the house of the valley’, that is, the world, which is the vale of tears. Again, they bring to the Lord a blind man, that is, one who neither sees what he has been, what he is, nor what he is to be. They ask Him to touch him, for what is being touched, but feeling compunction? Bede: For the Lord touches us, when He enlightens our minds with the breath of His Spirit, and He stirs us up that we may recognise our own infirmity, and be diligent in good actions. He takes the hand of the blind man, that He may strengthen him to the practice of good woks. Pseudo-Jerome: And He brings him out of the town, that is, out of the neighborhood of the wicked; and He puts spittle into his eyes, that he may see the will of God, by the breath of the Holy Ghost; and putting His hands upon him, He asked him if he could see, because by the works of the Lord His majesty is seen. Bede: Or else, putting spittle into the eyes of the blind man, He lays His hands upon him that he may see, because He has wiped away the blindness of the human race both by invisible gifts, and by the Sacrament of His assumed humanity; for the spittle, proceeding from the Head, points out the grace of the Holy Ghost. But though by one word He could cure the man wholly and all at once, still He cures him by degrees, that He may shew the greatness of the blindness of man, which can hardly, and only as it were step by step, be restored to light; and He exhibits to us His grace, by which He furthers each step towards perfection. Again, whoever is weighed down by a blindness of such long continuance, that he is unable to distinguish between good and evil, sees as it were men like trees walking, because he sees the deeds of the multitude without the light of discretion. Pseudo-Jerome: Or else, he sees men as trees, because he thinks all men higher than himself. But He put His hands again upon his eyes, that he might see all things clearly, that is, understand invisible things by visible, and with the eye of a pure mind contemplate, what the eye hath not seen, the glorious state of his own soul after the rust of sin. He sent him to his home, that is, to his heart; that he might see in himself things which he had not seen before; for a man despairing of salvation does not think that he can do at all what, when enlightened, he can easily accomplish. Theophylact: Or else, after He has healed him, He sends him to his home; for the home of every one of us is heaven, and the mansions which are there. Pseudo-Jerome: And He says to him, “If thou enter into the town, tell it not to any one,” that is, relate continually to thy neighbours thy blindness, but never tell them of thy virtue."
