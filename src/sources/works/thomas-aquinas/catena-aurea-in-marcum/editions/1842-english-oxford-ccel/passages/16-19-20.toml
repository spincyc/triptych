text = "19. So then after the Lord had spoken unto them, He was received up into heaven, and sat on the right hand of God. 20. And they went forth, and preached every where, the Lord working with them, and confirming the word with signs following. Amen. Pseudo-Jerome: The Lord Jesus, who had descended from heaven to give liberty to our weak nature, Himself also ascended above the heavens; wherefore it is said, “So then after the Lord had spoken unto them, He was received up into heaven.” Augustine: By which words He seems to shew clearly enough that the foregoing discourse was the last that He spake to them upon earth, though it does not appear to bind us down altogether to this opinion. For He does not say, After He had thus spoken unto them, wherefore it admits of being understood not as if that was the last discourse, but that the words which are here used, “After the Lord had spoken unto them, He was received into heaven,” might belong to all His other discourses. But since the arguments which we have used above make us rather suppose that this was the last time, therefore we ought to believe that after these words, together with those which are recorded in the Acts of the Apostles, our Lord ascended into heaven. Greg.: We have seen in the Old Testament that Elias was taken up into heaven. But the ethereal heaven is one thing, the aerial is another. The aerial heaven is nearer the earth, Elias then was raised into the aerial heaven, that he might be carried off suddenly into some secret region of the earth, there to live in great calmness of body and spirit, until he returns at the end of the world, to pay the debt of death. We may also observe that Elias mounted up in a chariot, that by this they might understand that a mere man requires help from without. But our Redeemer, as we read, was not carried up by a chariot, not by angels, because He who had made all things was borne over all by His own power. We must also consider what Mark subjoins, “And sat at the right hand of God,” since Stephen says, “I see the heavens opened, and the Son of Man standing at the right hand of God.” Now sitting is the attitude of a judge, standing of one fighting or helping. Therefore Stephen, when toiling in the contest, saw Him standing, whom he had for his helper; but Mark describes Him as sitting after His assumption into heaven, because after the glory of His assumption, He will in the end be seen as a judge. Augustine, de Symbolic, 7: Let us not therefore understand this sitting as though He were placed there in human limbs, as if the Father sat on the left, the Son on the right, but by the right hand itself we understand the power which He as man received from God, that He should come to judge, who first had come to be judged. For by sitting we express habitation, as we say of a person, he sat himself down in that country for many years; in this way then believe that Christ dwells at the right hand of God the Father. For He is blessed and dwells in blessedness, which is called the right hand of the Father; for all is right hand there, since there is no misery. It goes on: “And they went forth and preached every where, the Lord working with them, and confirming the word with signs and wonders.” Bede: Observe that in proportion as Mark began his history later, so he makes it reach in writing to more distant times, for he began from the commencement of the preaching of the Gospel by John, and he reaches in his narrative those times in which the Apostles sowed the same word of the Gospel throughout the world. Greg.: But what should we consider in these words, if it be not that obedience follows the precept and signs follow the obedience? For the Lord had commanded them, “Go into all the world preaching the Gospel,” and, Ye shall be witnesses even unto the ends of the earth. Augustine, Epist., CXCIX [199], 12: But how was this preaching fulfilled by the Apostles, [Acts 1:8] since there are many nations in which it has just begun, and others in which it has not yet begun to be fulfilled? Truly then this precept was not so laid upon the Apostles by our Lord, as though they alone to whom He then spoke were to fulfil so great a charge; in the same way as He says, “Behold, I am with you always, even unto the end of the world,” apparently to them alone; but who does not understand that the promise is made to the Catholic Church, which though some are dying, others are born, shall be here unto the end of the world? Theophylact: But we must also know from this that words are confirmed by deeds as then, in the Apostles, works confirmed their words, for signs followed. Grant then, O Christ, that the good words which we speak may be confirmed by works and deeds, so that at the last, Thou working with us in word and in deed, we may be perfect, for Thine as is fitting is the glory both of word and deed. Amen."
