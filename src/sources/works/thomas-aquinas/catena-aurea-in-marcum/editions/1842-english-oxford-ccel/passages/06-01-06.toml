text = "1. And He went out from thence, and came into His own country; and His disciples follow Him. 2. And when the sabbath day was come, He began to teach in the synagogue: and many hearing Him were astonished, saying, “From whence hath this man these things? and what wisdom is this which is given unto him, that even such mighty works are wrought by his hands? 3. Is not this the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon? and are not his sisters here with us?” And they were offended at Him. 4. But Jesus said unto them, “A prophet is not without honour but in his own country, and among his own kind, and in his own house.” 5. And He could there do no mighty work, save that He laid His hands upon a few sick folk, and healed them. 6. And He marvelled because of their unbelief. Theophylact: After the miracles which have been related, the Lord returns into His own country, not that He was ignorant that they would despise Him, but that they might have no reason to say, If Thou hadst come, we had believed Thee. Wherefore it is said, “And He went out from thence, and came into His own country.” Bede, in Marc., 2, 23: He means by His country, Nazareth, in which He was brought up. But how great the blindness of the Nazarenes! they despise Him, Who by His words and deeds they might know to be the Christ, solely on account of His kindred. It goes on: “And when the sabbath day was come, He began to teach in the synagogue; and many hearing Him were astonished, saying, From whence hath this man these things? and what wisdom is this which is given unto him, that even such mighty works are wrought by his hands?” By wisdom is meant His doctrine, by powers, the cures and miracles which He did. It goes on: Is not this the carpenter, the son of Mary?” Augustine, de Con. Evan., ii, 42: Matthew indeed says that He was called the son of a carpenter; nor are we to wonder, since both might have been said, for they believed Him to be a carpenter, because He was the son of a carpenter. Pseudo-Jerome: Jesus is called the son of a workman, of that one, however, whose work was the morning and the sun, that is, the first and second Church, as a figure of which the woman and the damsel are healed. Bede: For although human things are not to be compared with divine, still the type is complete, because the Father of Christ works by fire and spirit. It goes on: “The brother of James, and Joses, of Jude, and of Simon. And are not his sisters here with us?” They bear witness that His brothers and sisters were with Him, who nevertheless are not to be taken for the sons of Joseph or of Mary, as heretics say, but rather, as is usual in Scripture, we must understand them to be His relations, as Abraham and Lot are called brothers, though Lot was brother’s son to Abraham. “And they were offended at Him.” The stumbling and the error of the Jews is our salvation, and the condemnation of heretics. For so much did they despise the Lord Jesus Christ, as to call Him a carpenter, and son of a carpenter. It goes on: “And Jesus said unto them, A prophet is not without honour, but in his own country.” Even Moses bears witness that the Lord is called a Prophet in the Scripture, for predicting His future Incarnation to the sons of Israel, he says, “A Prophet shall the Lord raise up unto you of your brethren.” [Acts 7:37] But not only He Himself, Who is Lord of prophets, but also Elias, Jeremiah, and the remaining lesser prophets, were worse received in their own country than in strange cities, for it is almost natural for men to envy their fellow-townsmen; for they do not consider the present works of the man, but they remember the weakness of Him infancy. Pseudo-Jerome: Oftentimes also the origin of a man brings him contempt, as it is written, “Who is the son of Jesse?” [1 Sam 25:10] for the Lord “hath respect unto the lowly; as to the proud, He beholdeth them afar off.” Theophylact: Or again, if the prophet has noble relations, his countrymen hate them, and on that account do not honour the prophet. There follows, “And He could there do no mighty work, &c.” What, however, is here expressed by He could not, we must take to mean, He did not choose, because it was not that He was weak, but that they were faithless; He does not therefore work any miracles there, for He spared them, lest they should be worthy of greater blame, if they believed not, even with miracles before their eyes. Or else, for the working of miracles, not only the power of the Worker is necessary, but the faith of the recipient, which was wanting in this case: therefore Jesus did not choose to work any signs there. There follows: “And He marvelled at their unbelief.” Bede: Not as if He Who knows all things before they are done, wonders at what He did not expect or look forward to, but knowing the hidden things of the heart, and wishing to intimate to men that it was wonderful, He openly shews that He wonders. And indeed the blindness of the Jews is wonderful, for they neither believed what their prophets said of Christ, nor would in their own persons believe on Christ, Who was born amongst them. Mystically again; Christ is despised in His own house and country, that is, amongst the people of the Jews, and therefore He worked few miracles there, lest they should become altogether inexcusable. But He performs greater miracles every day amongst the Gentiles, not so much in the healing of their bodies, as in the salvation of their souls."
