text = "35. And when the day was now far spent, His disciples came unto Him, and said, “This is a desert place, and now the time is far passed: 36. Send them away, that they may go into the country round about, and into the villages, and buy themselves bread: for they have nothing to eat.” 37. He answered and said unto them, “Give ye them to eat.” And they said unto Him, “Shall we go and buy two hundred pennyworth of bread, and give them to eat?” 38. He saith unto them, “How many loaves have ye? go and see.” And when they knew, they say, “Five, and two fishes.” 39. And He commanded them to make all sit down by companies upon the green grass. 40. And they sat down in ranks, by hundreds, and by fifties. 41. And when He had taken the five loaves and the two fishes, He looked up to heaven, and blessed, and brake the loaves, and gave them to His disciples to set before them; and the two fishes divided He among them all. 42. And they did all eat, and were filled. 43. And they took up twelve baskets full of the fragments, and of the fishes. 44. And they that did eat of the loaves were about five thousand men. Theophylact: The Lord, placing before them, first, what is most profitable, that is, the food of the word of God, afterwards also gave the multitude food for their bodies; in beginning to relate which, the Evangelist say, “And when the day was now far spent, His disciples came unto Him, and said, This is a desert place. Bede: The time being far spent, points out that it was evening. Wherefore Luke says, “But the day had begun to decline.” Theophylact: See now, how those who are disciples of Christ grow in love to man, for they pity the multitudes, and come to Christ to intercede for them. But the Lord tried them, to see whether they would know that His power was great enough to feed them. Wherefore it goes on: “He answered and said unto them, Give ye them to eat.” Bede: By these words He calls on His Apostles, to break bread for the people, that they might be able to testify that they had no bread, and thus the greatness of the miracle might become more known. Theophylact: But the disciples thought that He did not know what was necessary for the feeding of so large a multitude, for their answer shews that they were troubled. For it goes on, “And they said unto Him, Let us go and buy two hundred pennyworth of bread, and give them to eat.” Augustine, de Con. Evan., 2, 46: This in the Gospel of John is the answer to Philip, but Mark gives it as the answer of the disciples, wishing it to be understood that Philip made this answer as a mouthpiece of the others; although he might put the plural number for the singular, as is usual. It goes on: “And He saith unto them, How many loaves have ye? go and see.” The other Evangelists pass over this being done by the Lord. It goes on: “And when they knew, they say, “Five, and two fishes.” This, which was suggested by Andrew, as we learn from John, the other Evangelists, using the plural for the singular, have put into the mouth of the disciples. It goes on, “And He commanded them to make all sit down by companies upon the green grass, and they sat down in ranks by hundreds and by fifties.” But we need not be perplexed, though Luke says that they were ordered to sit down by fifties, and Mark by hundreds and fifties, for one has mentioned a part, the other the whole. Mark, who mentions the hundreds, fills up what the other has left out. Theophylact: We are given to understand that they lay down in parties, separate from one another, for what is translated by companies, is repeated twice over in the Greek, as though it were by companies and companies. It goes on, “And when He had taken the five loaves and the two fishes, He looked up to heaven, and blessed, and broke the loaves, and gave them to His disciples to set before them: and the two fishes divided He among them all.” Chrys., Vict. Ant. e Cat. in Marc., see Hom. in Matt., 49: Now it was with fitness that He looked up to heaven, for the Jews, when receiving manna in the desert, presumed to say of God, “Can he give bread?” [Ps 78:20] To prevent this, therefore, before He performed the miracle, He referred to His Father when He was about to do. Theophylact: He also looks up to heaven, that He may teach us to seek our food from God, and not from the devil, as they do who unjustly feed on other men’s labours. By this also He intimated to the crowd, that He could not be opposed to God, since He called upon God. And He gives the bread to His disciples to set before the multitude, that by handling the bread, they might see that it was an undoubted miracle. It goes on: “And they did all eat, and were filled: and they took up twelve baskets full of the fragments.” Twelve baskets of fragments remained over and above, that each of the Apostles, carrying a basket on his shoulder, might recognise the unspeakable wonder of the miracle. For it was a proof of overflowing power not only to feed so many men, but also to leave such a superabundance of fragments. Even though Moses gave manna, yet what was given to each was measured by his necessity, and what was over and above was overrun with worms. Elias also fed the woman, but gave her just what was enough for her; but Jesus, being the Lord, makes His gifts with superabundant profusion. Bede: Again, in a mystical sense, the Saviour refreshes the hungry crowds at the day’s decline, because, either now that the end of the world approaches, or now that the Son of justice has set in death for us, we are saved from wasting away in spiritual hunger. He calls the Apostles to Him at the breaking of bread, intimating that daily by them our hungry souls are fed, that is, by their letters and examples. By the five loaves are figured the Five Books of Moses, by the two fishes, the Psalms and Prophets. Theophylact: Or the two fishes are the discourses of fishermen, that is, their Epistles and Gospel. Bede: [ed. note: The same application to the five senses is found in Origen in Matt. 14, 17, and St. Ambrose in Luc., 6, 80. The latter, probably, was the source from which Bede borrowed it, as in both it forms a portion of a comparison between this miracle and that of the four thousand being fed with seven loaves, in which the latter are said to be a type of the Christian, who has given up external things. Origen, Hom. 3 in Leviticus lays it down as a principle, that the number five is almost always taken for the five sense in Scripture.] There are five senses in the outward man which shews that by the five thousand men are meant those who, living in the world, know how to make a good use of external things. Greg., Mor. 16, 55: The different ranks in which those who ate lie down, mark out the divers churches which make up the one Catholic. [ed. note: The number fifty is connected with rest from sin, or remission, with an allusion to the Jubilee and to Pentecost by Origen in Matt. Tom. xi. 3, and by St. Ambrose Ap. David 8. On number a hundred, as the recognized symbol of perfection, see Benedictine Note] But the Jubilee rest is contained in the mystery of the number fifty, and fifty must be doubled before it reaches up to a hundred. As then the first step is to rest from doing evil, that afterwards the soul may rest more fully from evil thoughts, some lie down in parties of fifty, others of a hundred. Bede: Again, those men lie down on grass and are fed by the food of the Lord, who have trodden under foot their concupiscences by continence, and apply themselves diligently to hear and fulfil the words of God. [ed. note: see Aurea Catena in Matthew, p. 537] The Saviour, however, does not create a new sort of food; for when He came in the flesh He preached no other things than were predicted, but shewed how pregnant with mysteries of grace were the writings of the Law and the Prophets. He looks up to heaven, that He may teach us that there we must look for grace. He breaks and distributes to the disciples that they may place the bread before the multitudes, because He has opened the mysteries of prophecy to holy doctors, who are to preach them to the whole world. What is left by the crowd is taken up by the disciples, because the more sacred mysteries, which cannot be received by the foolish, are not to be passed by with negligence, but to be inquired into by the perfect. For by the twelve baskets, the Apostles and the following Doctors are typified, externally indeed despised by men, but inwardly full of healthful food. For all know that carrying baskets is a part of the work of slaves. Pseudo-Jerome: Or, in the gathering of the twelve baskets full of fragments, is signified the time, when they shall sit on thrones, judging all who are left of Abraham, Isaac, and Jacob, the twelve tribes of Israel, when the remnant of Israel shall be saved."
