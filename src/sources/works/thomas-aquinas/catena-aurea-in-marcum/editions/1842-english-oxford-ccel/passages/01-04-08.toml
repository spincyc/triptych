text = "4. John did baptize in the wilderness, and preach the baptism of repentance for the remission of sins. 5. And there went out unto him all the land of Judaea, and they of Jerusalem, and were all baptized of him in the river of Jordan, confessing their sins. 6. And John was clothed with camel’s hair, and with a girdle of a skin about his loins; and he did eat locusts and wild honey; 7. And preached, saying, “There cometh one mightier than I after me, the latchet of whose shoes I am not worthy to stoop down and unloose. 8. I indeed have baptized you with water: but he shall baptize you with the Holy Ghost.” Pseudo-Jerome: According to the above-mentioned prophecy of Isaiah, the way of the Lord is prepared by John, through faith, baptism, and penitence; the paths are made straight by the rough marks of the hair-cloth garment, the girdle of skin, the feeding on locusts and wild honey, and the most lowly voice; whence it is said, “John was in the wilderness.” For John and Jesus seek what is lost in the wilderness; where the devil conquered, there he is conquered; where man fell, there he rises up. But the name, John, means the grace of God, and the narrative begins with grace. For it goes on to say, “baptizing.” For by baptism grace is given, seeing that by baptism sins are freely remitted. But what is brought to perfection by the bridegroom is introduced by the friend of the bridegroom. Thus catechumens, (which word means persons instructed,) begin by the ministry of the priest, receive the chrism from the bishop [ed. note: “Chrismantur.” Chrism in the Roman Church, was applied twice; at Baptism, and more solemnly to the forehead by the Bishop at Confirmation. In the Eastern Church, it was only given once, at Confirmation, and by the Bishop only. In the French Church, it was given once, usually at Baptism, by the Priest, but if for any reason omitted, by the Bishop at Confirmation, see Bingham, Antiq. b., xii, e. 2, 2]. And to shew this, it is subjoined, “And preaching the baptism of repentance, &c.” Bede: It is evident that John not only preached, but also gave to some the baptism of repentance; but he could not give baptism for the remission of sins [ed. note: vol 1, p. 97, note A]. For the remission of sins is only given to us by the baptism of Christ. It is therefore only said, “Preaching the baptism of repentance for the remission of sins;” for he “preached” a baptism which could remit sins, since he could not give it. Wherefore as he was the forerunner of the Incarnate Word of the Father, by the word of his preaching, so by his baptism, which could not remit sins, he preceded that baptism, of penitence, by which sins are remitted. Theophylact: The baptism of John had not remission of sins, but only brought men to penitence. He preached therefore the baptism of repentance, that is, he preached that to which the baptism of penitence led, namely, remission of sins, that they who in penitence received Christ, might receive Him to the remission of their sins. Pseudo-Jerome: Now by John as by the bridegroom’s friend, the bride is brought to Christ, as by a servant Rebecca was brought to Isaac [Gen 24:61]; wherefore there follows, “And there went out to him all, &c. For “confession and beauty are in his presence,” [Ps 96:6] that is, the presence of the bridegroom. And the bride leaping down from her camel signifies the Church, who humbles herself on seeing her husband Isaac, that is, Christ. But the interpretation of Jordan, where sins are washed away, in ‘an alien descent.’ For we heretofore aliens to God by pride, are by the sign of Baptism made lowly, and thus exalted on high [ed. note: see St. Cyril of Jerus., Cat. xx, 4-7]. Bede: An example of confessing their sins and of promising to lead a new life, is held out to those who desire to be baptized, by those words which follow, “confessing their sins.” Chrys.” Because indeed John preached repentance, he wore the marks of repentance in his garment and in his food. Wherefore there follow, “And John was clothed in camel’s hair.” Bede: It says, clothed in a garment of hair, not in woollen clothes; the former is the mark of an austere garb, the latter of effeminate luxury. But the girdle of skins, with which he was girt, like Elias, is a mark of mortification. And this meat, “locusts and wild honey,” is suited to a dweller in the wilderness, so that his object in eating was not the deliciousness of meats, but the satisfying of the necessity of human flesh. Pseudo-Jerome: The dress of John, his food, and employment, signifies the austere life of preachers, and that future nations are to be joined to the grace of God, which is John, both in their minds and in externals. For by camel’s hair, is meant the rich among the nations; and by the girdle of skin, the poor, dead to the world; and by the wandering locusts, the wise men of this world; who, leaving the dry stalks to the Jews, draw off with their legs the mystic grain, and in the warmth of their faith leap up towards heaven; and the faithful, being inspired by the wild honey, are full-fed from the untilled wood. Theophylact: Or else; The garment of “camel’s hair” was significative of grief, for John pointed out, that he who repented should mourn. For sackcloth signifies grief; but the girdle of skins shews the dead state of the Jewish people. The food also of John not only denotes abstinence, but also shews forth the intellectual food, which the people then were eating, without understanding any thing lofty, but continually raising themselves on high, and again sinking to the earth. For such is the nature of locusts, leaping on high and again falling. In the same way the people ate honey, which had come from bees, that is, from the prophets; it was not however domestic, but wild, for the Jews had the Scriptures, which are as honey, but did not rightly understand them. Gregory, Moral., xxxi, 25: Or, by the kind itself of his food he pointed out the Lord, of whom he was the forerunner; for in that our Lord took to Himself the sweetness of the barren Gentiles, he ate wild honey. In that He in His own person partly converted the Jews, He received locusts for His food, which suddenly leaping up, at once fall to the ground. For the Jews leaped up when they promised to fulfil the precepts of the Lord; but they fell to the ground when, by their evil works, they affirmed that they had not heard them. They made therefore a leap upwards in words, and fell down by their actions. Bede: The dress and food of John may also express of what kind was his inward walk. For he used a dress more austere than was usual, because he did not encourage the life of sinners by flattery, but chid them by the vigour of his rough rebuke; he had a girdle of skin round his loins, for he was one, “who crucified his flesh with the affections and lusts.” [Gal 5:24] He used to eat locusts and wild honey, because his preaching had some sweetness for the multitude, whilst the people debated whether he was the Christ himself or not; but this soon came to an end, when his hearers understood that he was not the Christ, but the forerunner and prophet of Christ. For in honey there is sweetness, in locusts swiftness of flight. Whence there follows, “And he preached, saying, there cometh one mightier than I after me.” Gloss.: He said this to do away with the opinion of the crowd, who thought that he was the Christ; but he announces that Christ is “mightier than he,” he was to remit sins, which he himself could not do. Pseudo-Jerome: Who again is mightier than the grace, by which sins are washed away, which John signifies? He who seven times and seventy times seven remits sins [Matt 18:22]. Grace indeed comes first, but remits sins once only by baptism, but mercy reaches to the wretched from Adam up to Christ through seventy-seven generations, and up to one hundred and forty-four thousand. Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: But lest he should be thought to say this by way of comparing himself to Christ, he subjoins, “Of whom I am not worthy, &c.” It is not however the same thing to loose the shoe-latchet, which Mark here says, and to carry his shoes, which Matthew says. And indeed the Evangelists following the order of the narrative, and not able to err in any thing, say that John spoke each of these sayings in a different sense. But commentators on this passage have expounded each in a different way. For he means by the latchet, the tie of the shoe. He says this therefore to extol the excellence of the power of Christ, and the greatness of His divinity; as if he said, Not even in the station of his servant am I worthy to be reckoned. For it is a great thing to contemplate, as it were stooping down, those things which belong to the body of Christ, and to see from below the image of things above, and to untie each of those mysteries, about the Incarnation of Christ, which cannot be unravelled. Pseudo-Jerome: The shoe is in the extremity of the body; for in the end the Incarnate Saviour is coming for justice, whence it is said by the prophet, “Over Edom will I cast out my shoe.” [Ps 60:9] Gregory: Shoes also are made from the skins of dead animals. The Lord, therefore, coming incarnate, appeared as it were with shoes on His feet, for He assumed in His divinity the dead skins of our corruption. Or else; it was a custom among the ancients, that if a man refused to take as his wife the woman whom he ought to take, he who offered himself as her husband by right of kindred took off that man’s shoe. Rightly then does he proclaim himself unworthy to loose his shoe-latchet, as if he said openly, I cannot make bare the feet of the Redeemer, for I usurp not the name of the Bridegroom, a thing which is above my deserts. Theophylact: Some persons also understand it thus; all who came to John, and were baptized, through penitence were loosed from the bands of their sins by believing in Christ. John then in this way loosed the shoe-latchet of all the others, that is, the bands of sin. But Christ’s shoe-latchet he was not able to unloose, because he found no sin in Him. Bede: Thus then John proclaims the Lord not yet as God, or the Son of God, but only as a man mightier than himself. For his ignorant hearers were not yet capable of receiving the hidden things of so great a Sacrament, that the eternal Son of God, having taken upon Him the nature of man, had been lately born into the world of a virgin; but gradually by the acknowledgment of His glorified lowliness, they were to be introduced to the belief of His Divine Eternity. To these words, however, he subjoins, as if covertly declaring that he was the true God, “I baptize you with water, but he shall baptize you with the Holy Ghost.” For who can doubt that none other but God can give the grace of the Holy Ghost. Jerome: For what is the difference between water and the Holy Ghost, who was borne over the face of the waters? Water is the ministry of man; but the Spirit is ministered by God. Bede: Now we are baptized by the Lord in the Holy Ghost, not only when in the day of our baptism, we are washed in the fount of life, to the remission of our sins, but also daily by the grace of the same Spirit we are inflamed, to do those things which please God."
