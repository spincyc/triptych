text = "6. And the Pharisees went forth, and straightway took counsel with the Herodians against Him, how they might destroy Him. 7. But Jesus withdrew Himself with His disciples to the sea: and a great multitude from Galilee followed Him, and from Judaea, 8. And from Jerusalem, and from Idumaea, and from beyond Jordan; and they about Tyre and Sidon, a great multitude, when they had heard what great things He did, came unto Him. 9. And He spake to His disciples, that a small ship should wait on Him, because of the multitude, lest they should throng Him. 10. For He had healed many; insomuch that they pressed upon Him for to touch Him, as many as had plagues. 11. And unclean spirits, when they saw Him, fell down before Him, and cried, saying, “Thou art the Son of God.” 12. And He straitly charged them that they should not make Him known. Bede, in Marc., 1, 15: The Pharisees, thinking it a crime that at the word of the Lord the hand which was diseased was restored to a sound state, agreed to make a pretext of the words spoken by our Saviour. Wherefore it is said, “And the Pharisees went forth, and straightway took counsel with the Herodians against Him, how they might destroy Him.” As if every one amongst them did not greater things on the sabbath day, carrying food, reaching forth a cup, and whatever else is necessary for meals. Neither could He, Who said and it was done, be convicted of toiling on the sabbath day. Theophylact: But the soldiers of Herod the king are called Herodians, because a certain new heresy had sprung up, which asserted that Herod was the Christ. For the prophecy of Jacob intimated that when the princes of Judah failed then Christ should come; because therefore in the time of Herod none of the Jewish princes remained, and he, an alien, was the sole ruler, some thought that he was the Christ, and set on foot this heresy. These, therefore, were with the Pharisees trying to kill Christ. Bede: Or else he calls Herodians the servants of Herod the Tetrarch, who on account of the hatred which their lord had for John, pursued with treachery and hate the Saviour also, Whom John preached. It goes on, “But Jesus withdrew Himself with His disciples to the sea;” He fled from their treachery, because the hour of His passion had not yet come, and no place away from Jerusalem was proper for His Passion. By which also He gave an example to His disciples, when they suffer persecution in one city, to flee to another. Theophylact: At the same time again, He goes away, that by quitting the ungrateful He might do good to more, “for many followed Him, and He healed them.” For there follows, “And a great multitude from Galilee, &c.” Syrians and Sidonians, being foreigners, receive benefit from Christ; but His kindred the Jews persecute Him: thus there is no profit in relationship, if there be not a similarity in goodness. Bede: For the strangers followed Him, because they saw the works of His powers, and in order to hear the words of His teaching. But the Jews, induced solely by their opinion of His powers, in a vast multitude come to hear Him, and to beg for His aiding health. Wherefore there follows, “And He spake to His disciples, that they should wait, &c.” Theophylact: Consider then how He hid His glory, for He begs for a little ship, lest the crowd should hurt Him, so that entering into it, He might remain unharmed. It follows, “As many as had scourges, &c.” But he means by scourges, diseases, for God scourges us, as a father does His children. Bede: Both therefore fell down before the Lord, those who had the plagues of bodily diseases, and those who were vexed by unclean spirits. The sick did this simply with the intention of obtaining health, but the demoniacs, or rather the devils within them, because under the mastery of a fear of God they were compelled not only to fall down before Him but also to praise His majesty. Wherefore it goes on, “And they cried out, saying, Thou art the Son of God.” And here we must wonder at the blindness of the Arians, who, after the glory of His resurrection, deny the Son of God, Whom the devils confess to be the Son of God, though still clothed with human flesh. There follows, “And He straitly charged them, that they should not make Him known.” For God said to the sinner, “Why does thou preach my laws?” [Ps 50:16] A sinner is forbidden to preach the Lord, lest any one listening to his preaching should follow him in his error, for the devil is an evil master, who always mingles false things with true, that the semblance of truth may cover the witness of fraud. But not only devils, but persons healed by Christ, and even Apostles, are ordered to be silent concerning Him before the Passion, lest by the preaching of the majesty of His Divinity, the economy of His Passion should be retarded. But allegorically, in the Lord’s coming out of the synagogue, and then retiring to the sea, He prefigured the salvation of the Gentiles, to whom He deigned to come through their faith, having quitted the Jews on account of their perfidy. For the nations, driven about in divers by-paths of error, are fitly compared to the unstable sea. [ed. note: see Cyprian, Ep. 63, also Augustine, City of God, Book 20, 16] Again, a great crowd from various provinces followed Him, because He has received with kindness many nations, who came to Him through the preaching of the Apostles. But the ship waiting upon the Lord in the sea is the Church, collected from amongst the nations; and He goes into it lest the crowd should throng Him, because flying from the troubled minds of carnal persons, He delights to come to those who despise the glory of this world, and to dwell within them. Further, there is a difference between thronging the Lord, and touching Him; for they throng Him, when by carnal thoughts and deeds they trouble peace, in which truth dwells; but he touches Him, who by faith and love has received Him into his heart; wherefore those who touched Him are said to have been saved. Theophylact: Morally again, the Herodians, that is, persons who love the lusts of the flesh, wish to slay Christ. For the meaning of Herod is, ‘of skin’ [ed. note: pelliceus, see Hier. de Nom. Hebr.]. But those who quit their country, that is, a carnal mode of living, follow Christ, and their plagues are healed, that is, the sins which wound their conscience. But Jesus in us is our reason, which commands that our vessel, that is, our body, should serve Him, lest the troubles of worldly affairs should press upon our reason."
