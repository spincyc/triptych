text = "17. For Herod himself had sent forth and laid hold upon John, and bound him in prison for Herodias’ sake, his brother Philip’s wife: for he had married her. 18. For John had said unto Herod, “It is not lawful for thee to have thy brother’s wife.” 19. Therefore Herodias had a quarrel against him, and would have killed him; but she could not; 20. For Herod feared John, knowing that he was a just man and an holy, and observed him; and when he heard him, he did many things, and heard him gladly. 21. And when a convenient day was come, that Herod on his birthday made a supper to his lords, high captains, and chief estates of Galilee; 22. And when the daughter of the said Herodias came in, and danced, and pleased Herod and them that sat with him, the king said unto the damsel, “Ask of me whatsoever thou wilt, and I will give it thee.” 23. And he sware unto her, “Whatsoever thou shalt ask of me, I will give it thee, unto the half of my kingdom.” 24. And she went forth, and said unto her mother, “What shall I ask?” And she said, “The head of John the Baptist.” 25. And she came in straightway with haste unto the king, and asked, saying, “I will that thou give me by and by in a charger the head of John the Baptist.” 26. And the king was exceeding sorry; yet for his oath’s sake, and for their sakes which sat with him, he would not reject her. 27. And immediately the king sent an executioner, and commanded his head to be brought: and he went and beheaded him in the prison, 28. And brought his head in a charger, and gave it to the damsel: and the damsel gave it to her mother. 29. And when the disciples heard of it, they came and took up his corpse, and laid it in a tomb. Theophylact: The Evangelist Mark, taking occasion from what went before, here relates the death of the Forerunner, saying, “For Herod himself had sent forth and laid hold upon John, and bound him in prison for Herodias’ sake, his brother Philip’s wife: for he had married her.” Bede: Ancient history relates, that Philip, the son of Herod the great, under whom the Lord fled into Egypt, the brother of this Herod, under whom Christ suffered, married Herodias, the daughter of king Aretas; but afterwards, that his father-in-law, after certain disagreements had arisen with his son-in-law, had taken his daughter away, and, to the grief of her former husband, had given her in marriage to his enemy; therefore John the Baptist rebukes Herod and Herodias for contracting an unlawful union, and because it was not allowed for a man to marry his brother’s wife during his lifetime. Theophylact: The law also commanded a brother to marry his brother’s wife, if he died without children; but in this case there was a daughter, which made the marriage criminal. There follows: “Therefore Herodias had a quarrel against him, and would have killed him; but she could not.” Bede: For Herodias was afraid, lest Herod should repent at some time, or be reconciled to his brother Philip, and so the unlawful marriage be divorced. It goes on: “For Herod feared John, knowing that he was a just man, and a holy.” Gloss.: He feared him, I say, because he revered him, for he knew him to be just in his dealings with men, and holy towards God, and he took care that Herodias should not slay him. “And when he heard him, he did many things,” for he thought that he spake by the Spirit of God, “and heard him gladly,” because he considered that what he said was profitable. Theophylact: But see how great is the fury of lust, for though Herod had such an awe and fear of John, he forgets it all, that he may minister to his fornication. Remig.: For his lustful will drove him to lay hands on a man whom he knew to be just and holy. And by this, we may see how a less fault became the cause to him of a greater; as it is said, “He which is filthy, let him be filthy still.” [Rev 22:11] It goes on: “And when a convenient day was come, that Herod on his birthday made a supper to his lords, high captains, and chief estates of Galilee.” Bede: The only men whom we read of, as celebrating their birthdays with festive joys are Herod and Pharaoh, but each, with an evil presage, stained his birthday with blood; Herod, however, with so much the greater wickedness, as he slew the holy and guiltless teacher of truth, and that by the wish, and at the instance of a female dancer. For there follows: “And when the daughter of the said Herodias came in, and danced, and pleased Herod and them that sat with him, the king said unto the damsel, Ask of me whatsoever thou wilt, and I will give it thee.” Theophylact: For during the banquet, Satan danced in the person of the damsel, and the wicked oath is completed. For it goes on: “And he sware unto her, Whatsoever thou shalt ask of me, I will give it thee, unto the half of my kingdom.” Bede: His oath does not excuse his murder, for perchance his reason for swearing was, that he might find an opportunity for slaying, and if she had demanded the death of his father and mother, he surely would not have granted it. It goes on: “And she went forth, and said unto her mother, What shall I ask? And she said, The head of John the Baptist.” Worthy is blood to be asked as the reward of such a deed as dancing. It goes on: “And she came in straightway with haste, &c.” Theophylact: The malignant woman begs that the head of John be given to her immediately, that is, at once, in that very hour, for she feared lest Herod should repent. There follows: “And the king was exceeding sorry.” Bede: It is usual with Scripture, that the historian should relate events as they were then believed by all, thus Joseph is called the father of Jesus by Mary herself. So now also Herod is said to be “exceeding sorry,” for so the guests thought, since the hypocrite bore sadness on his face, when he had joy in his heart; and he excuses the wickedness by his oath, that he might be impious under pretence of piety. Wherefore there follows: “For his oath’s sake, and for their sakes who sat with him, he would not reject her.” Theophylact: Herod not being his own master, but full of lust, fulfilled his oath, and slew the just man; it would have been better however to break his oath, than to commit so great a sin. Bede: In that again which is added, “And for their sakes who sat with him,” he wishes to make all partakers in his guilt, that a bloody feast might be set before luxurious and impure guests. Wherefore it goes on: “But sending an executioner, he commanded his head to be brought in a charger.” Theophylact: ‘Spiculator’ is the name for the public servant commissioned to put men to death. Bede: Now Herod was not ashamed to bring before his guests the head of a murdered man; but we do not read of such an act of madness in Pharaoh. From both examples, however, it is proved to be more useful, often to call to mind the coming day of our death, by fear and by living chastely, than to celebrate the day of our birth with luxury. For man is born in the world to toil, but the elect pass by death out of the world to repose. It goes on: “And he beheaded him in prison, &c.” Greg., Mor., 3, 7: I cannot, without the greatest wonder, reflect that he, who was filled even in his mother’s womb with the spirit of prophecy, and who was the greatest that had arisen amongst those born of women, is sent into prison by wicked men, is beheaded for the dancing of a girl, and though a man of so great austerity, meets death through such a foul instrument. Are we to suppose that there was something evil in his life, to be wiped away by so ignominious a death? When, however, could he commit a sin even in his eating, whose food was only locusts, and wild honey? How could he offend in his conversation, who never quitted the wilderness? How is it that Almighty God so despises in this life those whom He has so sublimely chosen before all ages, if it be not for the reason, which is plain to the piety of the faithful, that He thus sinks them into the lowest place, because He sees how He is rewarding them in the highest, and outwardly He throws them down amongst things despised, because inwardly He draws them up even to incomprehensible things. Let each then infer from this what they shall suffer, whom He rejects, if He so grieves those whom He loves. There follows: “And when his disciples heard of it, they came and took up his corpse, and laid it in a tomb.” Bede: Josephus relates, that John was brought bound into the castle of Macheron, and there slain; and ecclesiastical history says [Theodoret, Hist., Eccles., 3, 3] that he was buried in Sebaste, a city of Palestine, once called Samaria. But the beheading of John the Baptist signifies the lessening of that fame, by which he was thought to be Christ by the people, as the raising of our Saviour on the cross typifies the advance of the faith, in that He Himself, who was first looked upon as a prophet by the multitude, was recognized as the Son of God by all the faithful; wherefore John, who was destined to decrease, was born when the daylight begins to wax short; but the Lord at that season of the year in which the day begins to lengthen. Theophylact: In a mystical way, however, Herod, whose name means, ‘of skin,’ is the people of the Jews, and the wife to whom he was wedded means vain glory, whose daughter even now encircles the Jews with her dance, namely, a false understanding of the Scriptures; they indeed beheaded John, that is, the word of prophecy, and hold to him without Christ, his head. Pseudo-Jerome: Or else, the head of the law, which is Christ, is cut off from His own body, that is, the Jewish people, and is given to a Gentile damsel, that is, the Roman Church, and the damsel gives it to her adulterous mother, that is, to the synagogue, who in the end will believe. The body of John is buried, his head is put in a dish; thus the human Letter is covered over, the Spirit is honoured, and received on the altar."
