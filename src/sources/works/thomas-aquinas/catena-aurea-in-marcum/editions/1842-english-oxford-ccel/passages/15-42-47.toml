text = "42. And now when the even was come, because it was the preparation, that is, the day before the sabbath, 43. Joseph of Arimathaea, an honorable counsellor, which also waited for the kingdom of God, came, and went in boldly unto Pilate, and craved the body of Jesus. 44. And Pilate marvelled if he were already dead: and calling unto him the centurion, he asked him whether he had been any while dead. 45. And when he knew it of the centurion, he gave the body to Joseph. 46. And he brought fine linen, and took Him down, and wrapped Him in the linen, and laid Him in a sepulchre which was hewn out of a rock, and rolled a stone unto the door of the sepulchre. 47. And Mary Magdalene and Mary the mother of Joses beheld where He was laid. Gloss: After the Passion and Death of Christ, the Evangelist relates His burial, saying, “And now when the even was come, because it was the preparation, that is, the day before the sabbath, Joseph of Arimathaea.” Bede: What is called “parasceue” in Greek, is in Latin “praeparatio”; by which name those Jews, who lived amongst Greeks, used to call the sixth day of the week, because on that day they used to prepare what was necessary for the rest of the sabbath day. Because then man was made on the sixth day, but on the seventh the Creator rested from all His work, fitly was our Saviour crucified on the sixth day, and thus fulfilled the mystery of man’s restoration. But on the sabbath, resting in the tomb, He was waiting for the event of the Resurrection, which was to come on the eighth day. So we must also in this age of time be crucified to the world; but in the seventh day, that is, when a man has paid the debt to death, our bodies indeed must rest in the grave, but our souls after good works in hidden peace with God; till in the eighth period, even our bodies themselves, glorified in the resurrection, receive incorruption together with our souls. But the man who buried the body of the Lord must needs by his righteous merits have been worthy, and by the nobility of worldly power able to perform this service. Therefore it is said, “An honourable counsellor, which also waited for the kingdom of God.” He is called in Latin, “decurio”, because he is of the order of the “curia”, and served the office of a provincial magistracy; this officer was also called “curialis”, from his care of civic duties. Arimathaea is the same as Ramathain, the city of Elkanah and Samuel. Pseudo-Jerome: It it interpreted, “taking down,” of which was Joseph, who came to take down the body of Christ from the cross. There follows: “Came and went in boldly unto Pilate, and craved the body of Jesus.” Theophylact: He was bold with a praiseworthy boldness; for he did not consider within himself, I shall fall from my rich estate, and I shall be expelled by the Jews, if I beg for the body of Him, who was condemned as a blasphemer. It goes on: “And Pilate marvelled if he were already dead.” For he thought that He should continue long alive upon the cross, as also the thieves used to live long, upon the instrument of their execution. It goes on: “And calling unto him the centurion, he asked him if he had been any while dead;” that is, before the time when other executed persons usually died. There follows: “And when he knew it of the centurion, (that is, that He was dead,) he gave the body to Joseph.” Bede: But it was not an obscure person, nor a man of mean rank, who could come to the governor and obtain the body. There follows: “And he brought fine linen, and took Him down, and wrapped Him in the linen.” Theophylact: Burying the precious body preciously; for being a disciple of our Lord, he knew how greatly the Lord’s body ought to be honoured. Bede: By this however, according to a spiritual meaning, we may understand that the body of the Lord should not be wrapped in gold or gems, or silk, but in a clean linen cloth. Hence it became a custom in the Church that the sacrifice of the altar should not be celebrated in silk, or in a dyed cloth, but in linen produced from the earth, just as the body of the Lord was wrapped in clean linen; as, we read in the Pontifical acts, it was ordered by the blessed Sylvester [ed. note: St. Sylvester was Pope from 314 to 335. On his decree respecting the Corporal used in the celebration of the Holy Eucharist, see Bona de Rebns Lit., i.e. 25. 11]. Though it has also another meaning, that he who receives Jesus in a pure mind wraps Him in a clean linen. There follows: “And laid Him in a sepulchre which was hewn out of a rock, and rolled a stone unto the door of the sepulchre.” It is said that the sepulchre of the Lord is a round cell, hewn out of the rock which was around it, so high, that a man standing upright could scarcely touch the roof with his outstretched hand; and it has an entrance to the east, to which the great stone was rolled, and placed upon it. In the northern part of it is the tomb itself, that is, the place where our Lord’s body lay, made of the same rock, seven feet in length, raised three palms higher than the floor. It is not open from above, but on the south side, the whole of which is open, and through which the body was brought in. The colour of the sepulchre and of the recess is said to be a mixed white and red. Pseudo-Jerome: By the burial of Christ we rise again, by His going down into hell we mount up into heaven; here is found the honey in the mouth of the dead lion. Theophylact: Let us too imitate Joseph, taking to ourselves the body of Christ by Unity, and let us place it in a sepulchre, hewn out of the rock, that is, in a soul recollected, never forgetful of God; for this is a soul hewn out of the rock, that is, out of Christ, for He is our rock, who holds together our strength. We ought also to wrap Him in linen, that is, to receive Him in a pure body; for the linen is the body which is the clothing of the soul. We must, however, not throw open, but wrap Him up; for He is secret, closed and hidden. There follows: “And Mary Magdalene and Mary the mother of Joses beheld where he was laid.” Bede: We read in Luke, that His acquaintances and the women who had followed Him stood afar off. When these then who were known to Jesus returned home after the burial of His body, the women alone, who were bound to Him with a closer love, after following the funeral, took care to see how He was laid, that they might be able at a fitting season to offer Him the sacrifice of their devotion. But on the day of the “parasceue”, that is, of the preparation, the holy women, that is, humble souls, do the same, when they burn with love for the Saviour, and diligently follow the steps of His Passion in this life, where their future rest is to be prepared; and they weigh with a pious minuteness the order in which His Passion was accomplished, if perchance they be able to imitate it. Pseudo-Jerome: These things also fit the Jewish people, which finally is believing, which is ennobled by faith to become the child of Abraham. It lays aside its despair, it waits for the kingdom of God, it goes in to the Christians, that is may be baptized; which is implied by the name of Pilate, which is interpreted. ‘One who works with a hammer,’ that is, he who subdues the iron nations, that he may rule them with a rod of iron. It seeks for the Sacrifice, that is, the Viaticum, which is given to penitents at their last end, and wraps it up in a heart clean and dead to sin; it makes it firm in the safeguard of faith, and shuts it up with the covering of hope, through works of charity; (for the end of the commandment is charity; [1 Tim 1:5]) whilst the elect, who are the stars of the sea, are looking on from afar, for, if it be possible, the very elect shall be offended."
