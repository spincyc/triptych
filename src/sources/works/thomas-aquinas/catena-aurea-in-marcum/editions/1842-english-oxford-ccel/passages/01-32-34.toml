text = "32. And at even, when the sun did set, they brought unto Him all that were diseased, and them that were possessed with devils. 33. And all the city was gathered together at the door. 34. And He healed many that were sick of divers diseases, and cast out many devils; and suffered not the devils to speak, because they knew Him. Theophylact: Because the multitude thought that it was not lawful to heal on the sabbath day, they waited for the evening, to bring those who were to be healed to Jesus. Wherefore it is said, “And at even, when the sun had set.” There follows, “and He healed many that were vexed with divers diseases.” Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: Now in that he says “many”, all are to be understood according to the Scripture mode of expression. Theophylact: Or he says, “many”, because there were some faithless persons, who could not at all be cured on account of their unfaithfulness. Therefore He healed many of those who were brought, that is, all who had faith. It goes on, “and cast out many devils.” Pseudo-Augustine, Quaest. e Vet. et Nov. Test. 16: For the devils knew that He was the Christ, who had been promised by the Law: for they saw in Him all the signs which had been foretold by the Prophets; but they were ignorant of His divinity, as also were “their princes, for if they had known it, they would not have crucified the Lord of glory.” [1 Cor 2:8] Bede: For, Him whom the devil had known as a man, wearied by His forty days’ fast, without being able by tempting Him to prove whether He was the Son of God, he now by the power of His miracles understood or rather suspected to be the Son of God. The reason therefore why he persuaded the Jews to crucify Him, was not because he did not think that He was the Son of God, but because he did not foresee that he himself was to be condemned by Christ’s death. Theophylact: Furthermore, the reason that He forbade the devils to speak, was to teach us not to believe them, even if they say true. For if once they find persons to believe them, they mingle truth with falsehood. Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: And Luke does not contradict this, when he says, that “devils came out of many, crying out and saying, Thou art Christ the Son of God:” [Luke 4:41] for he subjoins, “And He rebuking them, suffered them not to speak;” for Mark, who passes over many things for the sake of brevity, speaks about what happened subsequently to the abovementioned words. Bede: Again, in a mystical sense, the setting of the sun signifies the passion of Him, who said, “As long as I am in the world, I am the light of the world.” [John 9:5] And when the sun was going down, more demoniacs and sick persons were healed than before: because He who living in the flesh for a time taught a few Jews, has transmitted the gifts of faith and health to all the Gentiles throughout the world. Pseudo-Jerome: But the door of the kingdom, morally, is repentance and faith, which works health for various diseases; for divers are the vices with which the city of this world is sick."
