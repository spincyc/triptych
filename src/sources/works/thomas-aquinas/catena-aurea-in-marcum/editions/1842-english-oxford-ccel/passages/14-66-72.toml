text = "66. And as Peter was beneath in the palace, there cometh one of the maids of the High Priest: 67. And when she saw Peter warming himself, she looked upon him, and said, “And thou also wast with Jesus of Nazareth.” 68. But he denied, saying, “I know not, neither understand I what thou sayest.” And he went out into the porch; and the cock crew. 69. And a maid saw him again, and began to say to them that stood by, “This is one of them.” 70. And he denied it again. And a little after, they that stood by said again to Peter, “Surely thou art one of them: for thou art a Galilaean, and thy speech agreeth thereto.” 71. But he began to curse and to swear, saying, “I know not this man of whom ye speak.” 72. And the second time the cock crew. And Peter called to mind the word that Jesus said unto him, “Before the cock crew twice, thou shalt deny me thrice.” And when he thought thereon, he wept. Augustine: Concerning the temptation of Peter, which happened during the injuries mentioned, all the Evangelists do not speak in the same order. For Luke first relates the temptation of Peter, then these injuries of the Lord; but John begins to speak of the temptation of Peter, and then puts in some things concerning our Lord’s ill-treatment, and adds, that He was sent from there to Caiaphas the High Priest, and then he goes back to unfold the temptation of Peter, which he had begun. Matthew and Mark, on the other hand, first notice the injuries done to Christ, then the temptation of Peter. Concerning which it is said, “And as Peter was beneath in the palace, there cometh one of the maids of the High Priest.” Bede: But what can be meant by his being first recognized by a woman, when men were more able to know him, if it be not that that sex might be seen to sin in the death of our Lord, and that sex be redeemed by His Passion? It goes on: “But he denied, saying, I know not, neither understand I what thou sayest.” Pseudo-Jerome: Peter when he had not the Spirit yielded and lost courage at the voice of a girl, though with the Spirit he was not afraid before princes and kings. Theophylact: The Lord allowed this to happen to him by His providence, that is, lest he should be too much elated, and at the same time, that he might prove himself merciful to sinners, as knowing from himself the result of human weakness. There follows: “And he went out into the porch; and the cock crew.” Bede: The other Evangelists do not mention this crowing of the cock; they do not however deny the fact, as also some pass over many other things in silence, which others relate. There follows: “And a maid saw him again, and began to say to them that stood by, This is one of them.” Augustine [ed. note: for a harmony of this portion of the Gospel, v. Williams on the Passion, p.101]: This maid is not the same, but another, as Matthew says. Indeed, we must also understand, that in this second denial he was addressed by two persons, that is, by the maid whom Matthew and Mark mention, and by another person, of whom Luke takes notice. It goes on: “And he denied it again.” Peter had now returned, for John says that he denied Him again standing at the fire; wherefore the maid said what has been mentioned above, not to him, that is, Peter, but to those who, when he went out, had remained, in such a way however that he heard it; wherefore coming back and standing again at the fire, he contradicted them, and denied their words. For it is evident, if we compare the accounts of all the Evangelists on this matter, that Peter did not the second time deny Him before the porch, but within the palace at the fire, whilst Matthew and Mark who mention his having gone out are silent, for the sake of brevity, as to his return. Bede: By this denial of Peter we learn, that not only he denied Christ, who says that He is not the Christ, but he also, who although he is a Christian, denies himself to be such. For the Lord did not say to Peter, Thou shalt deny thyself to be my disciple, but, “Thou shalt deny me;” he therefore denied Christ, when he said that he was not His disciple. There follows: “And a little after, they that stood by said again to Peter, Surely thou art one of them, for thou art a Galilaean, and thy speech agreeth thereto.” Not that the Galilaeans spoke a different tongue from the inhabitants of Jerusalem, for they were both Hebrews, but that each province and region has its own peculiarities, and cannot avoid a vernacular pronunciation. Theophylact: Therefore Peter was seized with fear, and forgetting the word of the Lord, which said, “Whosoever shall confess Me before men, him will I confess before My Father,” [Matt 30:32] he denied our Lord. Wherefore there follows: “But he began to curse and to swear, saying, I know not this man of whom ye speak.” Bede: How hurtful it is to speak with the wicked. He denies before infidels that he knows the Man, whom amongst the disciples, he had confessed to be God. But the Scripture is wont to point out a Sacrament of the causes of things, by the state of the time; thus Peter, who denied at midnight, repented at cock crew. Wherefore it is added: “And the second time the cock crew. And Peter called to mind the word which Jesus said unto him, Before the cock crew twice, thou shalt deny me thrice.” Theophylact: For tears brought Peter by penitence to Christ. Confounded then be the Novatians, who say that he who sins after receiving baptism is not received to the remission of his sin. For behold Peter, who had also received the Body and Blood of the Lord, is received by penitence; for the failings of saints are written, that if we fall by want of caution, we also may be able to run back through their example, and hope to be relieved by penitence. Pseudo-Jerome: But in a mystical sense, the first maid means the wavering, the second, the assent, the third man is the act. This is the threefold denial which the remembrance of the word of the Lord washes away through tears. The cock then crows for us when some preacher stirs up our hearts by repentance to compunction. We then begin to weep, when we are set on fire within by the spark of knowledge, and we go forth, when we cast out what we were within."
