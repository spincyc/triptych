text = "1. And He entered again into the synagogue; and there was a man there which had a withered hand. 2. And they watched Him, whether He would heal him on the sabbath day; that they might accuse Him. 3. And He saith unto the man which had the withered hand, “Stand forth.” 4. And He saith unto them, “Is it lawful to do good on the sabbath days, or to do evil? to save life, or to kill?” But they held their peace. 5. And when He had looked round about on them with anger, being grieved for the hardness of their hearts, He saith unto the man, “Stretch forth thine hand.” And he stretched it out: and his hand was restored whole as the other. Theophylact: After confounding the Jews, who had blamed His disciples, for pulling the ears of corn on the sabbath day, by the example of David, the Lord now further bringing them to the truth, works a miracle on the sabbath; shewing that, if it is a pious deed to work miracles on the sabbath for the health of men, it is not wrong to do on the sabbath thing necessary for the body. He says therefore, “And He entered again into the synagogue; and there was a man there which had a withered hand. And they watched Him, whether He would heal him on the sabbath-day; that they might accuse Him.” Bede, in Marc., 1, 14: For, since He had defended the breaking of the sabbath, which they objected to His disciples, by an approved example, now they wish, by watching Him, to calumniate Himself, that they might accuse Him of a transgression, if He cured on the sabbath, of cruelty or of folly, if He refused. It goes on: “And He saith unto the man which had the withered hand, Stand in the midst.” Pseudo-Chrys., Vict. Ant. e Cat. in Marc., see Chrys, Hom. in Matt., 40: He placed him in the midst, that they might be frightened at the sight, and on seeing Him compassionate him, and lay aside their malice. Bede: And anticipating the calumny of the Jews, which they had prepared for Him, He accused them of violating the precepts of the law, by a wrong interpretation. Wherefore there follows: “And He saith unto them, Is it lawful to do good on the sabbath-day, or to do evil?” And this He asks, because they thought that on the sabbath they were to rest even from good works, whilst the law commands to abstain from bad, saying, “Ye shall do no servile work therein;” [Lev 23:7] that is, sin: for “Whosoever committeth sin is the servant of sin.” [John 8:34] What He first says, “to do good on the sabbath-day or to do evil,” is the same as what He afterwards adds, “to save a life or to lose it;” that is, to cure a man or not. Not that God, Who is in the highest degree good, can be the author of perdition to us, but that His not saving is in the language of Scripture to destroy. but if it be asked, wherefore the Lord, being about to cure the body, asked about the saving of the soul, let him understand either that in the common way of Scripture the soul is put for the man; as it is said, “All the souls that came out of the loins of Jacob;” [Ex 1:5] or because He did those miracles for the saving of a soul, or because the healing itself of the hand signified the saving of the soul. Augustine, de Con. Evan., ii, 35: But some one may wonder how Matthew could have said, that they themselves asked the Lord, if it was lawful to heal on the sabbath-day; when Mark rather relates that they were asked by our Lord, “Is it lawful to do good on the sabbath-day, or to do evil?” Therefore we must understand that they first asked the Lord, if it was lawful to heal on the sabbath-day, then that understanding their thoughts, and that they were seeking an opportunity to accuse Him, He placed in the middle him whom He was about to cure, and put those questions, which Mark and Luke relate. We must then suppose, that when they were silent, He propounded the parable of the sheep, and concluded, that it was lawful to do good on the sabbath-day. It goes on: “But they were silent.” Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: For they knew that He would certainly cure him. It goes on: “And looking round about upon them with anger.” His looking round upon them in anger, and being saddened at the blindness of their hearts, is fitting for His humanity, which He deigned to take upon Himself for us. He connects the working of the miracle with a word, which proves that the man is cured by His voice alone. It follow therefore, “And he stretched it out, and his hand was restored.” Answering by all these things for His disciples, and at the same time shewing that His life is above the law. Bede: But mystically, the man with a withered hand shews the human race, dried up as to its fruitfulness in good works, but now cured by the mercy of the Lord; the hand of man, which in our first parent had been dried up when he plucked the fruit of the forbidden tree, through the grace of the Redeemer, Who stretched His guiltless hands on the tree of the cross, has been restored to health by the juices of good works. Well too was it in the synagogue that the hand was withered; for where the gift of knowledge is greater, there also the danger of inexcusable guilt is greater. Pseudo-Jerome: Or else it means the avaricious, who, being able to give had rather receive, and love robbery rather than making gifts. And they are commanded to stretch forth their hands, that is, “let him that stole steal no more, but rather let him labour, working with his hand the thing which is good, that he may have to give to him that needeth.” [Eph 4:28] Theophylact: Or, he had his right hand withered, who does not the works which belong to the right side; for from the time that our hand is employed in forbidden deeds, from that time it is withered to the working of good. But it will be restored whenever it stands firm in virtue; wherefore Christ saith, “Arise,” that is, from sin, “and stand in the midst;” that thus it may stretch itself forth neither too little nor too much."
