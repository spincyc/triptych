text = "30. And they departed thence, and passed through Galilee; and He would not that any man should know it. 31. For He taught He disciples, and said unto them, “The Son of man is delivered into the hands of men, and they shall kill Him; and after that He is killed, He shall rise the third day.” 32. But they understood not that saying, and were afraid to ask Him. 33. And He came to Capernaum: and being in the house He asked them, “What was it that ye disputed among yourselves by the way?” 34. But they held their peace: for by the way they had disputed among themselves, who should be the greatest. 35. And He sat down, and called the twelve, and saith unto them, “If any man desire to be first, the same shall be last of all, and servant of all.” 36. And He took a child, and set him in the midst of them: and when He had taken him in His arms, He said unto them, 37. “Whosoever shall receive one of such children in My name, receiveth Me: and whosoever shall receive Me, receiveth not Me, but Him that sent Me.” Theophylact: It is after miracles that the Lord inserts a discourse concerning His Passion, lest it should be thought that He suffered because He could not help it. Wherefore it is said, “And they departed thence, and passed through Galilee; and He would not that any man should know it. For He taught His disciples, and said unto them, The Son of man is delivered into the hands of men, and they shall kill Him.” Bede, in Marc., 1, 39: He always mingles together sorrowful and joyful things, that sorrow should not by its suddenness frighten the Apostles, but be borne by them with prepared minds. Theophylact: After, however, saying what was sorrowful, He adds what ought to rejoice them; wherefore it goes on: “And after that He is killed, He shall rise the third day;” in order that we may learn that joys come on after struggles. There follows: “But they understood not that saying, and were afraid to ask Him.” Bede: This ignorance of the disciples proceeds not so much from slowness of intellect, as from love for the Saviour, for they were as yet carnal, and ignorant of the mystery of the cross, they could not therefore believe that He whom they had recognized as the true God, was about to die; being accustomed then to hear Him often talk in figures, and shrinking from the events of His death, they would have it that something was conveyed figuratively in those things, which He spoke openly concerning His betrayal and passion. It goes on: “And they came to Capernaum.” Pseudo-Jerome: Capernaum means the city of consolation, and agrees with the former sentence, which He had spoken: “And after that He is killed, He shall arise the third day.” There follows: “And being in the house He asked them, What was it that ye disputed among yourselves by the way? But they held their peace.” Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: Matthew however says that the disciples came to Jesus, saying, “Who is the greatest in the kingdom of heaven?” [Matt 18:1] The reason is, that He did not begin the narrative from its commencement, but omitted our Saviour’s knowledge of the thoughts and words of His disciples; unless we understand Him to mean, that even what they thought and said, when away from Christ, was said unto Him, since it was as well known to Him as if it had been said to Him. It goes on: “For by the way they had disputed among themselves, who should be the greatest.” But Luke says [ed. note: Luke 9:46, Vulgate] that “the thought entered into the disciples which of them should be the greatest;” for the Lord laid open their thought and intention from their private discourse according to the Gospel narrative. Pseudo-Jerome: It was fit also that they should dispute concerning the chief place by the way; the dispute is like the place where it is held; for lofty station is only entered upon to be quitted: as long as a man keeps it, it is slippery, and it is uncertain at what stage, that is, on what day, it will end. Bede: The reason why the dispute concerning the chief place arose amongst the disciples seems to have been, that Peter, James and John, were led apart from the rest into the mountain, and that something secret was there entrusted to them, also that the keys of the kingdom of heaven were promised to Peter, according to Matthew. Seeing however the thoughts of the disciples, the Lord takes care to heal the desire of glory by humility; for He first, by simply commanding humility, admonishes them that a high station was not to be aimed at. Wherefore it goes on: “And He sat down, and called the twelve and saith unto them, If any man desire to be first, the same shall be last of all, and servant of all.” Jerome: Where it is to be observed, that the disciples disputed by the way concerning the chief place, but Christ Himself sat down to teach humility; for princes toil while the humble repose. Pseudo-Chrys., Vict. Ant. e Cat. in Marc.: The disciples indeed wished to receive honour at the hands of the Lord; they also had a desire to be made great by Christ, for the great a man is, the more worthy of honour he becomes, for which reason He did not throw an obstacle in the way of that desire, but brought in humility. Theophylact: For His wish is not that we should usurp for ourselves chief places, but that we should attain to lofty heights by lowliness. He next admonishes them by the example of a child’s innocence. Wherefore there follows, “And He took a child, and set him in the midst of them.” Chrys., Vict. Ant. e Cat. in Marc. see Chrys., Hom. in Matt., 58: By the very sight, persuading them to humility and simplicity; for this little one was pure from envy and vain glory, and from a desire of superiority. But He does not only say, If ye become such, ye shall receive a great reward, but also, if ye will honour others, who are such for My sake. Wherefore there follows: “And when He had taken him in His arms, He said unto them, Whosoever shall receive one of such children in My name, receiveth Me.” Bede: By which, He either simply shews that those who would become greater must receive the poor of Christ in honour of Him, or He would persuade them to be in malice children, to keep simplicity without arrogance, charity without envy, devotedness without anger. Again, by taking the child into His arms, He implies that the lowly are worthy of his embrace and love. He adds also, “In My name,” that they might, with the fixed purpose of reason, follow for His name’s sake that mould of virtue to which the child keeps, with nature for his guide. And because He taught that He Himself was received in children, lest it should be thought that there was nothing in Him but what was seen, He added, “And whosoever shall receive Me, receiveth not Me, but Him that sent Me.;” thus wishing that we should believe Him to be of the same nature and of equal greatness with His Father. Theophylact: See, how great is humility, for it wins for itself the indwelling of the Father, and of the Son, and also of the Holy Ghost."
