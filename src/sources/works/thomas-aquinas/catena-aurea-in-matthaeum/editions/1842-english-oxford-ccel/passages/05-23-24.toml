text = "23. “Therefore if thou bring thy gift to the altar, and there rememberest that thy brother hath ought against thee; 24. Leave there thy gift before the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift.” Aug., Serm. in Mont., i, 10: If it be not lawful to be angry with a brother, or to say to him Racha, or Thou fool, much less is it lawful to keep in the memory any thing which might convert anger into hate. Jerome: It is not, If thou hast ought against thy brother; but “If thy brother has ought against thee,” that the necessity of reconciliation may be more imperative. Aug.: And he has somewhat against us when we have wronged him; and we have somewhat against him when he has wronged us, in which case there were no need to go to be reconciled to him, seeing we had only to forgive him, as we desire the Lord to forgive us. Pseudo-Chrys.: But if it is he that hath done you the wrong, and yet you be the first to seek reconciliation, you shall have a great reward. Chrys.: If love alone is not enough to induce us to be reconciled to our neighbour, the desire that our work should not remain imperfect, and especially in the holy place, should induce us. Greg., Hom. 1 in Ezech. viii. 9: Lo He is not willing to accept sacrifice at the hands of those who are at variance. Hence then consider how great an evil is strife, which throws away what should be the means of remission of sin. Pseudo-Chrys.: See the mercy of God, that He thinks rather of man’s benefit than of His own honour; He loves concord in the faithful more than offering at His altar; for so long as there are dissensions among the faithful, their gift is not looked upon, their prayer is not heard. For no one can be a true friend at the same time to two who are enemies to each other. In like manner, we do not keep our fealty to God, if we do not love His friends and hate His enemies. But such as was the offence, such should also be the reconciliation. If you have offended in thought, be reconciled in thought; if in words, be reconciled in words; if in deeds, in deeds by reconciled. For so it is in every sin, in whatsoever kind it was committed, in that kind is the penance done. Hilary: He bids us when peace with our fellow-men is restored, then to return to peace with God, passing from the love of men to the love of God; “Then go and offer thy gift.” Aug.: If this direction be taken literally, it might lead some to suppose that this ought indeed to be so done if our brother is present, for that no long time can be meant when we are bid to leave our offering there before the altar. For if he be absent, or possibly beyond sea, it is absurd to suppose that the offering must be left before the altar, to be offered after we have gone over land and sea to seek him. Wherefore we must embrace an inward, spiritual sense of the whole, if we would understand it without involving any absurdity. The gift which we offer to God, whether learning, or speech, or whatever it be, cannot be accepted of God unless it be supported by faith. If then we have in aught harmed a brother, we must go and be reconciled with him, not with the bodily feet, but in thoughts of the heart, when in humble contrition you may cast yourself at your brother’s feet in sight of Him whose offering you are about to offer. For thus in the same manner as though He were present, you may with unfeigned heart seek His forgiveness; and returning thence, that is, bringing back again your thoughts to what you had first begun to do, may make your offering."
