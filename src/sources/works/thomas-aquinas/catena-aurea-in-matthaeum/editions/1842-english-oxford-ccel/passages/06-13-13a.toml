text = "13. “And lead us not into temptation.” Pseudo-Chrys.: As He had above put many high things into men’s mouths, teaching them to call God their Father, to pray that His kingdom might come; so now He adds a lesson of humility, when He says, “and lead us not into temptation.” Aug., Serm. in Mont., ii, 9: Some copies read, “Carry us not,” [margin note: inferas] an equivalent word, both being a translation of one Greek word, εἰσενέγκῃς. Many in interpreting say, ‘Suffer us not to be led into temptation,’ as being what is implied in the word, “lead.” For God does not of Himself lead a man, but suffer him to be led from whom He has withdrawn His aid. Cyprian, Tr. vii, 17: Herein it is shewn that the adversary can nothing avail against us, unless God first permit him; so that all our fear and devotion ought to be addressed to God. Aug.: But it is one thing to be led into temptation, another to be tempted; for without temptation none can be approved, either to himself or to another; but every man is fully known to God before all trial. Therefore we do not here pray that we may not be tempted, but that we may not be led into temptation. As if one who was to be burnt alive should pray not that he should not be touched by fire, but that he should not be burnt. For we are then led into temptation when such temptations befall us as we are not able to resist. Aug., Epist., 130, 11: When then we say, “Lead us not into temptation,” what we ask is, that we may not, deserted by His aid, either consent through the subtle snares, or yield to the forcible might, or any temptation. Cyprian: And in so praying we are cautioned of our own infirmity and weakness, lest any presumptuously exalt himself; that while a humble and submissive confession comes first, and all is referred to God, whatever we suppliantly apply for may by His gracious favour be supplied. Aug., De Don. Pers., 5: When the Saints pray, “Lead us not into temptation,” what else do they pray for than that they may persevere in their sanctity. This once granted - and that it is God’s gift this, that of Him we ask it, shews - none of the Saints but holds to the end his abiding holiness; for none ceases to hold on his Christian profession, till he be first overtaken of temptation. Therefore we seek not to be led into temptation that this may not happen to us; and if it does not happen, it is God that does not permit it to happen; for there is nothing done, but what He either does, or suffers to be done. He is therefore able to turn our wills from evil to good, to raise the fallen and to direct him into the way that is pleasing to Himself, to whom not in vain we plead, “Lead us not into temptation.” For whoso is not led into temptation of his own evil will, is free of all temptation; for, “each man is tempted of his own lust.” [James 1:14] God would have us pray to Him that we may not be led into temptation, though He could have granted it without our prayer, that we might be kept in mind who it is from whom we receive all benefits. Let the Church therefore observe her daily prayers; she prays that the unbelieving may believe, therefore it is God that turns men to the faith; she prays that the believers may persevere; God gives them perseverance even unto the end."
