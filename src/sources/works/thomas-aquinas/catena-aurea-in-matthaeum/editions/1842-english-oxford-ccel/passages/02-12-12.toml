text = "12. And being warned of God in a dream that they should not return to Herod, they departed into their own country another way. Aug.: The wicked Herod, now made cruel by fear, will needs do a deed of horror. But how could he ensnare him who had come to cut off all fraud? His fraud is escaped as it follows, “And being warned.” Jerome: They had offered gifts to the Lord, and receive a warning corresponding to it. This warning (in the Greek ‘having received a response’) is given not by an Angel, but by the Lord Himself, to shew the high privilege granted to the merit of Joseph. Gloss. ord.: This warning is given by the Lord Himself; it is none other that now teaches these Magi the way they should return, but He who said, “I am the way.” [John 14:6] Not that the Infant actually speaks to them, that His divinity may not be revealed before the time, and His human nature may be thought real. But he says, “having received an answer,” for as Moses prayed silently, so they with pious spirit had asked what the Divine will bade. “By another way,” for they were not to be mixed up with the unbelieving Jews. Chrys., Hom. 8: See the faith of the Magi; they were not offended, nor said within themselves, What need now of flight? or of secret return, if this Boy be really some great one? Such is true faith; it asks not the reason of any command, but obeys. Pseudo-Chrys.: Had the Magi sought Christ as an earthly King, they would have remained with Him when they had found Him; but they only worship, and go their way. After their return, they continued in the worship of God more steadfast than before, and taught many by their preaching. And when afterwards Thomas reached their country, they joined themselves to him, and were baptized, and did according to his preaching. [ed. note: S. Thomas is said to have preached to the Parthians, Persians, or Indians. Euseb. Hist. iii. 1. Clem. Recogn. ix. 29. Greg. Naz. Or. 25. p. 438. The Margi are mentioned, Pseudo-Hippol. de Duod. Apost. (ed. Fabr. Append. p. 30) Combefis conjecturing Mardi.] Greg., Hom. in Ev. i. 10. 7: We may learn much from this return of the Magi another way. Our country is Paradise, to which, after we have come to the knowledge of Christ we are forbidden to return the way we came. We have left this country by pride, disobedience, following things of sight, tasting, forbidden food; and we must return to it by repentance, obedience, by contemning things of sight, and overcoming carnal appetite. Pseudo-Chrys.: It was impossible that they, who left Herod to go to Christ, should return to Herod. They who have by sin left Christ and passed to the devil, often return to Christ; for the innocent, who knows not what is evil, is easily deceived, but having once tasted the evil he has taken up, and remembering the good he has left, he returns in penitence to God. He who has forsaken the devil and come to Christ, hardly returns to the devil; for rejoicing in the good he has found, and remembering the evil he has escaped, with difficulty returns to that evil."
