text = "25. “Woe unto you, Scribes and Pharisees, hypocrites! for ye make clean the outside of the cup and of the platter, but within they are full of extortion and excess. 26. Thou blind Pharisee, cleanse first that which is within the cup and platter, that the outside of them may be clean also.” Jerome: In different words, but to the same purport as before, He reproves the hypocrisy and dissimulation of the Pharisees, that they shewed one face to men abroad, but wore another at home. He means not here, that their scrupulousness respecting the cup and the platter was of any importance, but that they affected it to pass off their sanctity upon men; which is clear from His adding, “but inwardly ye are full of ravening and uncleanness.” Pseudo-Chrys.: Or, He means that the Jews whenever they were to enter the temple or to offer sacrifice, or on any festivals, used to wash themselves, their clothes, and their vessels, but none cleansed himself from his sins; but God neither commends bodily cleanliness, nor condemns the contrary. But suppose foulness of person or of vessels were offensive to God, which must become foul by being used, how much more does He not abhor foulness of conscience, which we may, if we will, keep ever pure? Hilary: He therefore is reproving those who, pursuing an ostentation of useless scrupulosity, neglected the discharge of useful morality. For it is the inside of the cup that is used; if that be foul, what profit is it to cleanse the outside? And therefore what is needed is purity of the inner conscience, that those things which are of the body may be clean without. Pseudo-Chrys.: This He speaks not of the cup and platter of sense, but of that of the understanding, which may be pure before God, though it have never touched water; but if it have sinned, then though the water of the whole ocean and of all rivers have washed it, it is foul and guilty before God. Chrys.: Note, that speaking of tithes He said, “These things ought ye to have done, and not to leave the other undone:” for tithes are a kind of alms, and what wrong is it to give alms? Yet said He it not to enforce a legal superstition. But here, discoursing of things clean and unclean, He does not add this, but distinguishes and shews that external purity of necessity follows internal; “the outside of the cup and platter” signifying the body, the inside the soul. Origen: This discourse instructs us that we should hasten to become righteous, not to seem so. For whoso seeks to be thought so, cleanses the outside, and has care of the things that are seen, but neglects the heart and conscience. But he who seeks to cleanse that which is within, that is, the thoughts, makes by that means the things without clean also. All professors of false doctrine are cups cleansed on the outside, because of that show of religion which they affect, but within they are full of extortion and guile, hurrying men into error. The cup is a vessel for liquids, the platter for meat. Every discourse then of which we spiritually drink, and all speech by which we are fed, are vessels for meat and drink. They who study to set forth well wrought discourse rather than such as is full of healthful meaning, are cups cleansed without; but within full of the defilement of vanity. Also the letter of the Law and the Prophets is a cup of spiritual drink, and a platter of necessary food. The Scribes and Pharisees seek to make plain the outward sense; Christ’s disciples labour to exhibit the spiritual sense."
