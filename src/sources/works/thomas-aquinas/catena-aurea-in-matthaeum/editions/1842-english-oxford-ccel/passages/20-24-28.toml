text = "24. And when the ten heard it, they were moved with indignation against the two brethren. 25. But Jesus called them unto him, and said, “Ye know that the princes of the Gentiles exercise dominion over them, and they that are great exercise authority upon them. 26. But it shall not be so among you: but whosoever will be great among you, let him be your minister; 27. And whosoever will be chief among you, let him be your servant: 28. Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.” Chrys.: So long as the judgment of Christ upon this request was in suspense, the other disciples were not indignant; but when they heard Him rebuke them, they were sorrowful; whence it is said, “And when the ten heard it, they had indignation against the two brethren.” Jerome: They do not lay it upon the forwardness of the mother who spoke the request, but upon her sons, who, not knowing their measure, burned with so immoderate desires. Chrys.: For when the Lord rebuked them, then they perceived that this request was from the disciples. For though they were grieved in their hearts when they saw them so especially honoured in the transfiguration, they yet dared not so express themselves, out of respect to their teacher. Pseudo-Chrys.: But as the two had asked carnally, so now the ten are grieved carnally. For as to seek to be above all is blameworthy, so to have another above us is mortifying to our vanity. Jerome: But the meek and lowly Master neither charges the two with ambition, nor rebukes the ten for their spleen and jealousy; but, “Jesus called them unto him.” Chrys.: By thus calling them to Him, and speaking to them face to face, he sooths them in their discomposure; for the two had been speaking with the Lord apart by themselves. But not now as before does He it by bringing forward a child, but He proves it to them by reasoning from contraries; “Ye know that the princes of the Gentiles exercise dominion over them.” Origen: That is, not content merely to rule over their subjects, they are severe and oppressive. But among you who are Mine these things shall not be so; for as all carnal things are done by compulsion, but spiritual things by free-will, so those rulers who are spiritual ought to rest their power in the love of their subjects, not in their fears. Chrys.: He shews here that it is of the Gentiles to desire preeminence; and by this comparison of the Gentiles He calms their troubled souls. Pseudo-Chrys.: Indeed, to desire a good work is good, for it is within our will, and ours is the reward; but to desire a primacy of honour is vanity. For when we attain this we are judged of God, because we know not whether in our precedence of honour we deserve the reward of righteousness. For not even an Apostle will have praise with God, because he is an Apostle, but if he has well fulfilled the duties of his Apostleship; nor was an Apostle placed in honour as an Apostle, for any previous merit of his; but was judged meet for that ministry, on account of the disposition of his mind. For high place courts him who flies from it, and shuns him who courts it. A better life then, and not a more worthy degree, should be our object. The Lord therefore, willing to check the ambition of the two sons of Zebedee, and the indignation of the others, points out this distinction between the chief men of the world, and those of the Church, shewing that the primacy in Christ is neither to be sought by him who has it not, nor envied by him who has it. For men become masters in this world that they may exercise domination over their inferiors, and reduce them to slavery, and rob them, and employ them even to death for their own profit and glory. But men become governors in the Church, that they may serve those who are under them, and minister to them whatever they have received of Christ, that they may postpone their own convenience, and mind that of others, and not refuse even to die for the sake of those beneath them. To seek therefore a command in the Church is neither righteous, nor profitable. No prudent man will voluntarily subject himself to slavery, nor to stand in such peril wherein he will have to render account for the whole Church; unless it be one perchance who fears not God’s judgment, who abuses His ecclesiastical primacy to a secular end, so that He converts it into a secular primacy. Jerome: Lastly, He sets before them His own example, that so should they little weigh His words, His deeds might shame them, whence He adds, “As also the Son of Man cometh not to be ministered unto, but to minister.” Origen: For though the Angels and Martha ministered to Him, yet did He not come to be ministered unto, but to minister; [marg. note: Matt 4:11; John 12:2] yea, His ministry extended so far, that He fulfilled even what follows, “And to give his life a ransom for many,” they, that is, who believed on Him; and gave it, i. e. to death. But since He was alone free among the dead, and mightier than the power of death, He has set free from death all who were willing to follow Him. The heads of the Church ought therefore to imitate Christ in being affable, adapting Himself to women, laying His hands on children, and washing His disciples’ feet, that they also should do the same to their brethren. But we are such, that we seem to go beyond the pride even of the great ones of this world; as to the command of Christ, either not understanding it, or setting it at nought. Like princes we seek hosts to go before us, we make ourselves awful and difficult of access, especially to the poor, neither approaching them, nor suffering them to approach us. Chrys.: How much soever you humble yourself, you cannot descend so far as did your Lord."
