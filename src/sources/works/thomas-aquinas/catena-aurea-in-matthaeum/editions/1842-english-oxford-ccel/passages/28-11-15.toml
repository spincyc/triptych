text = "11. Now when they were going, behold, some of the watch came into the city, and shewed unto the Chief Priests all the things that were done. 12. And when they were assembled with the elders, and had taken counsel, they gave large money unto the soldiers, 13. Saying, “Say ye, His disciples came by night, and stole him away while we slept. 14. And if this come to the governor’s ears, we will persuade him, and secure you.” 15. So they took the money, and did as they were taught: and this saying is commonly reported among the Jews until this day. Chrys., Hom. xc: Of the signs which were shewn around Christ, some were common to the whole world, as the darkness; some peculiar to the watch, as the wonderful apparition of Angels, and the earthquake, which were wrought for the soldiers’ sake, that they might be stunned with amazement, and bear testimony to the truth. For when truth is proclaimed by its adversaries, it adds to its brightness. which befel now; “Some of the watch came into the city, and shewed unto the Chief Priests all the things that were done.” Raban.: Simple minds, and unlearned country-folk, often make manifest without guile the truth of a matter, as the thing is; but on the other hand, a crafty wickedness studies how to recommend falsehood by glosing words. Jerome: Thus the Chief Priests, who ought to have been by this turned to penitence, and to seek Jesus risen, persevere in their wickedness, and convert the money which was given for the use of the Temple to the purchase of a lie, as before they had given thirty pieces of silver to the traitor Judas. Chrysol.: Not content to have put the Master to death, they plot how they may destroy the disciples, and make the Master’s power matter of charge against His disciples. The soldiers indeed lost Him, the Jews missed Him, but the disciples carried Him away, not by theft, but by faith; by virtue, and not by fraud; by holiness, and not by wickedness; alive, and not dead. Chrys.: How should the disciples carry Him away by stealth, men poor, and of no station, and who scarcely dared to shew themselves? They fled when afterwards they saw Christ alive, how, when He was dead, would they not have feared so great a multitude of soldiers? How were they to remove the door of the sepulchre? One might have done it unperceived by the guard. But a large stone was rolled to the mouth requiring many hands. And was not the seal thereon? And why did they not attempt it the first night, when there was none at the sepulchre? For it was on the Sabbath that they begged the body of Jesus. Moreover, what mean these napkins which Peter sees laid here? Had the disciples stolen the Body, they would never have stripped it, both because it might so receive hurt, and cause unnecessary delay to themselves, and so expose them to be taken by the watch; especially since the Body and clothes were covered with myrrh, a glutinous spice, which would cause them to adhere. The allegation of the theft then is improbable. So that their endeavours to conceal the Resurrection do but make it more manifest. For when they say, “His disciples stole the body,” they confess that it is not in the sepulchre. And as they thus confess that they had not the Body, and as the watch, the sealing, and the fears of the disciples, make the theft improbable, there is seen evidence of the Resurrection not to be gainsaid. Remig.: But if the guards slept, how saw they the theft? And if they saw it not, how could they witness thereto? So that what they desire to shew, they cannot shew. Gloss., non occ.: That the fear of the Governor might not restrain them from this lie, they promise them impunity. Chrys.: See how all are corrupted; Pilate persuaded; the people stirred up; the soldiers bribed; as it follows, “And they took the money, and did as they were instructed.” If money prevailed with a disciple. so far as to make him become the betrayer of his Master, what wonder that the soldiers are overcome by it. Hilary: The concealment of the Resurrection, and the false allegation of theft, is purchased by money; because by the honour of this world, which consists in money and desire, Christ’s glory is denied. Raban.: But as the guilt of His blood, which they imprecated upon themselves and their children, presses them down with a heavy weight of sin, so the purchase of the lie, by which they deny the truth of the Resurrection, charges this guilt upon them for ever; as it follows, “And this saying is commonly reported among the Jews until this day.” Chrysol.: “Among the Jews,” not among the Christians; what in Judaea the Jew concealed by his gold, is by faith blazed abroad throughout the world. Jerome: All who abuse to other purposes the money of the Temple, and the contributions for the use of the Church, purchasing with them their own pleasure, are like the Scribes and Priests who bought this lie, and the blood of the Saviour."
