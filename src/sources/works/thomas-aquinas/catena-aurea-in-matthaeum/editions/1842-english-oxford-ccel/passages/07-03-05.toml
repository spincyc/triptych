text = "3. “And why beholdest thou the mote that is in thy brother’s eye, but considerest not the beam that is in thine own eye? 4. Or how wilt thou say to thy brother, Let me pull out the mote out of thine eye; and, behold, a beam is in thine own eye? 5. Thou hypocrite, first cast out the beam out of thine own eye; and then shalt thou see clearly to cast out the mote out of thy brother’s eye.” Aug., Serm. in Mont., ii, 18: The Lord having admonished us concerning hasty and unjust judgment; and because that they are most given to rash judgment, who judge concerning things uncertain; and they most readily find fault, who love rather to speak evil and to condemn than to cure and to correct; a fault that spring either from pride or jealousy - therefore He subjoins, “Why seest thou the mote in thy brother’s eye, and seest not the beam in thy own eye?” Jerome: He speaks of such as though themselves guilty of mortal sin, do not forgive a trivial fault in their brother. Aug.: As if he perhaps have sinned in anger, and you correct him with settled hate. For as great as is the difference between a beam and a mote, so great is the difference between anger and hatred. For hatred is anger become inveterate. It may be if you are angry with a man that you would have him amend, not so if you hate him. Chrys.: Many do this, if they see a Monk having a superfluous garment, or a plentiful meal, they break out into bitter accusation, though themselves daily seize and devour, and suffer from excess of drinking. Pseudo-Chrys.: Otherwise; This is spoken to the doctors. For every sin is either a great or a small sin according to the character of the sinner. If he is a laic, it is small and a mote in comparison of the sin of a priest, which is the beam. Hilary: Otherwise; The sin against the Holy Spirit is to take from God power which has influences, and from Christ substance which is of eternity, through whom as God came to man, so shall man likewise come to God. As much greater then as is the beam than the mote, so much greater is the sin against the Holy Spirit than all other sins. As when unbelievers object to others carnal sins, and secrete in themselves the burden of that sin, to wit, that they trust not the promises of God, their minds being blinded as their eye might be by a beam. Pseudo-Chrys.: That is, with what face can you charge your brother with sin, when yourself are living in the same or a yet greater sin? Aug., Serm. in Mont., ii, 19: When then we are brought under the necessity of finding fault with any, let us first consider whether the sin be such as we have never had; secondly that we are yet men, and may fall into it; then, whether it be one that we have had, and are now without, and then let our common frailty come into our mind, that pity and not hate may go before correction. Should we find ourselves in the same fault, let us not reprove, but groan with the offender, and invite him to struggle with us. Seldom indeed and in cases of great necessity is reproof to be employed; and then only that the Lord may be served and not ourselves. Pseudo-Chrys.: Otherwise; “How sayest thou to thy brother;” that is, with what purpose? From charity, that you may save your neighbour? Surely not, for you would first save yourself. You desire therefore not to heal others, but by good doctrine to cover bad life, and to gain praise of learning from men, not the reward of edifying from God, and you are a hypocrite; as it follows, “Thou hypocrite, cast first the beam out of thine own eye.” Aug., Serm. in Mont., ii, 19: For to reprove sin is the duty of the good, which when the bad do, they act a part, dissembling their own character, and assuming one that does not belong to them. Chrys.: And it is to be noted, that whenever He intends to denounce any great sin, He begins with an epithet of reproach, as below, “Thou wicked servant, I forgave thee all that debt;” [Matt 18:32] and so here, “Thou hypocrite, cast out first.” For each one knows better the things of himself than the things of others, and sees more the things that be great, then the things that be lesser, and loves himself more than his neighbour. Therefore He bids him who is chargeable with many sins, not to be a harsh judge of another’s faults, especially if they be small. Herein not forbidding to arraign and correct; but forbidding to make light of our own sins, and magnify those of others. For it behoves you first diligently to examine how great may be your own sins, and then try those of your neighbour; whence it follows, “and then shalt thou see clearly to cast the mote out of thy brother’s eye.” Aug.: For having removed from our own eye the beam of envy, of malice, or hypocrisy, we shall see clearly to cast the beam out of our brother’s eye."
