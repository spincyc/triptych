text = "1. Then came to Jesus Scribes and Pharisees, which were of Jerusalem, saying, 2. “Why do thy disciples transgress the tradition of the elders? for they wash not their hands when they eat bread.” 3. But he answered and said unto them, “Why do ye also transgress the commandment of God by your tradition? 4. For God commanded, saying, Honour thy father and mother: and, He that curseth father or mother, let him die the death. 5. But ye say, Whosoever shall say to his father or his mother, It is a gift, by whatsoever thou mightest be profited by me; 6. And honour not his father or his mother, he shall be free. Thus have ye made the commandment of God of none effect by your tradition.” Raban.: The men of Gennezareth and the less learned believe; but they who seem to be wise come to dispute with Him; according to that, “Thou hast hid these things from the wise and prudent, and hast revealed them unto babes.” Whence it is said, “Then, came to him from Jerusalem Scribes and Pharisee.” Aug., de Cons. Ev., ii, 49: The Evangelist thus constructs the order of his narrative, “Then came unto him,” that, as appeared in the passage over the lake, the order of the events that followed that might be shewn. Chrys.: For this reason also the Evangelist marks the time that He may shew their iniquity overcome by nothing; for they came to Him at a time when He had wrought many miracles, when He had healed the sick by the touch of His hem. That the Scribes and Pharisees are here said to have come from Jerusalem, it should be known that they were dispersed through all the tribes, but those that dwelt in the Metropolis were worse than the others, their higher dignity inspiring them with a greater degree of pride. Remig.: They were faulty for two reasons; because they had come from Jerusalem, from the holy city; and because they were elders of the people, and doctors of the Law, and had not come to learn but to reprove the Lord; for it is added, “Saying, Why do thy disciples transgress the tradition of the elders?” Jerome: wonderful infatuation of the Pharisees and Scribes! They accuse the Son of God that He does not keep the traditions and commandments of men. Chrys.: Observe, how they are taken in their own question. They say not, ‘Why do they transgress the Law of Moses?’ but, “the tradition of the elders;” whence it is manifest that the Priests had introduced many new things, although Moses had said, “Ye shall not add ought to the word which I set before you this day, neither shall ye take ought away from it;” [Deut 4:2] and when they ought to have been set free from observances, then they bound themselves by many more; fearing lest any should take away their rule and power, they sought to increase the awe in which they were held, by setting themselves forth as legislators. Remig.: Of what kind these traditions were, Mark shews when he says, “The Pharisees and all the Jews, except they wash their hands oft, eat not.” [Mark 7:3] Here then also they find fault with the disciples, saying, “For they wash not their hands when they eat bread.” Bede, in Marc., 7, 1: Taking carnally those words of the Prophets, in which it is said, “Wash, and be ye clean,” [Isa 1:16] they observed it only in washing the body; hence they had laid it down that we ought not to eat with unwashen hands. Jerome: But the hands that are to he washed are the acts not of the body, but of the mind; that the word of God may be done in them. Chrys.: But the disciples now did not eat, with washen hands, because they already despised all things superfluous, and attended only to such as were necessary; thus they accepted neither washing nor not washing as a rule, but did either as it happened. For how should they who even neglected the food that was necessary for them, have any care about this rite? Remig.: Or the Pharisees found fault with the Lord’s disciples, not concerning that washing which we do from ordinary habit, and of necessity, but of that superfluous washing which was invented by the tradition of the elders. Chrys.: Christ made no excuse for them, but immediately brought a counter charge, shewing that he that sins in great things ought not to take offence at the slight sins of others. “He answered and said unto them, Why do ye also transgress the commandment of God because of your tradition?” He says not that they do well to transgress that He may not give room for calumny; nor on the other hand does He condemn what the Apostles had done, that He may not sanction their traditions; nor again does He bring any charge directly against them of old, that they might not put Him from them as a calumniator; but He points His reproof against those who had come to Him; thus at the same time touching the elders who had laid down such a tradition; saying, Jerome: Since ye because of the tradition of men neglect the commandment of God, why do ye take upon you to reprove my disciples, for bestowing little regard upon the precepts of the elders, that they may observe the commands of God? “For God hath said, Honour thy father and thy mother.” Honour in the Scriptures is shewn not so much in salutations and courtesies as in alms and gifts. “Honour,” says the Apostle, “the widows who are widows indeed;” [1 Tim 5:3] here ‘honour’ signifies a gift. The Lord then having thought for the infirmity, the age, or the poverty of parents, commanded that sons should honour their parents in providing them with necessaries of life. Chrys.: He desired to shew the great honour that ought to be paid to parents, and therefore attached both a reward and a penalty. But in this occasion the Lord passes over the reward promised to such as did honour their parents, namely, that they should live long upon the earth, and brings forward the terrible part only, namely, the punishment, that He might strike these dumb and attract others; “And he that, curseth father and mother, let him die the death;” thus He shews that they deserved even death. For if he who dishonours his parent even in word is worthy of death, much more ye who dishonour him in deed; and ye not only dishonour your parents, but teach others to do so likewise. Ye then who do not deserve even to live, how accuse ye my disciples? But how they transgress the commandment of God is clear when He adds, “But ye say, Whoso shall say to his father or his mother, It is a gift, whatsoever thou mightest be profited by me.” Jerome: For the Scribes and Pharisees desiring to overturn this foregoing most provident law of God, that they might bring in their impiety under the mask of piety, taught bad sons, that should any desire to devote to God, who is the true parent, those things which ought to be offered to parents, the offering to the Lord should be preferred to the offering them to parents. Gloss, ap. Anselm: In this interpretation the sense will be, What I offer to God will profit both you and myself; and therefore you ought not to take of my goods for your own needs, but to suffer that I offer them to God. Jerome: And thus the parents refusing what they saw thus dedicated to God, that they might not incur the guilt of sacrilege, perished of want, and so it came to pass that what the children offered for the needs of the temple and the service of God, went to the gain of the Priests. Gloss, ap. Anselm: Or the sense may be, “Whosoever,” that is, of you young men, “shall say,” that is, shall either be able to say, or shall say, “to his father or mother,” O father, the gift that is of me devoted to God, shall it profit thee? as it were an exclamation of surprise; you ought not to take it that you may not incur the guilt of sacrilege. Or, we may read it with this ellipsis, “Whosoever shall say to his father, &c.” he shall do the commandment of God, or shall fulfil the Law, or shall be worthy of life eternal. Jerome: Or it may briefly have the following sense; Ye compel children to say to their parents, What gift soever I was purposing to offer to God, you take and consume upon your living, and so it profits you; as much as to say. Do not so. Gloss., ap. Anselm: And thus through these arguments of your avarice, this youth shall “Honour not his father or his mother.” As if He had said; Ye have led sons into most evil deeds; so that it will come to pass that afterwards they shall not even honour their father and mother. And thus ye have made the commandment of God concerning the support of parents by their children vain through your traditions, obeying the dictates of avarice. Aug., cont. Adv. Leg. et Proph., ii, 1: Christ here clearly shews both that that law which the heretic blasphemes is God’s law, and that the Jews had their traditions foreign to the prophetical and canonical books; such as the Apostle calls “profane and vain fables.” Aug., cont. Faust., xvi, 24: The Lord here teaches us many things; That it was not He that turned the Jews from their God; that not only did He not infringe the commandments, but convicts them of infringing them; and that He had ordained no more than those by the hand of Moses. Aug., Quaest. Ev., i, 16: Otherwise; “The gift whatsoever thou offerest on my account, shall profit thee;” that is to say, Whatsoever gift thou offerest on my account, shall henceforth remain with thee; the son signifying by these words that there is no longer need that parents should offer for him, as he is of age to offer for himself. And those who were of age to be able to say thus to their parents, the Pharisees denied that they were guilty, if they did not shew honour to their parents."
