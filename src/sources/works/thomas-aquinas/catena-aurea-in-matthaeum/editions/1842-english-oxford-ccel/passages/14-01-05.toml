text = "l. At that time Herod the tetrarch heard of the fame of Jesus. 2. And said unto his servants, This is John the Baptist; he is risen from the dead; and therefore mighty works do shew forth themselves in him. 3. For Herod had laid hold on John, and bound him, and put him in prison for Herodias’ sake, his brother Philip’s wife. 4. For John said unto him, “It is not lawful for thee to have her.” 5. And when he would have put him to death, he feared the multitude, because they counted him as a prophet. Gloss., non occ.: The Evangelist had above shewn the Pharisees speaking falsely against Christ’s miracles, and just now His fellow-citizens wondering, yet despising Him; he now relates what opinion Herod had formed concerning Christ on hearing of His miracles, and says, “At that time Herod the tetrarch heard the fame of Jesus.” Chrys.: It is not without reason that the Evangelist here specifies the time, but that you may understand the pride and carelessness of the tyrant; inasmuch as he had not at the first made himself acquainted with the things concerning Christ, but now only after long time. Thus they, who in authority are fenced about with much pomp, learn these things slowly, because they do not much regard them. Aug., De Cons. Ev., ii, 43: Matthew says, “At that time,” not, On that day, or, In that same hour; for Mark relates the same circumstances, but not in the same order. He places this after the mission of the disciples to preach, though not implying that it necessarily follows there; any more than Luke, who follows the same order as Mark. Chrys.: Observe how great a thing is virtue; Herod fears John even after he is dead, and philosophizes concerning the resurrection; as it followers; “And he saith to his servants, This is John the baptist, he is risen from the dead, and therefore mighty works are wrought in him.” Raban.: From this place we may learn how great the jealousy of the Jews was; that John could have risen from the dead, Herod, an alien-born, here declares, without any witness that he had risen: concerning Christ, whom the Prophets had foretold, the Jews preferred to believe, that He had not risen, but had been carried away by stealth. This intimates that the Gentile heart is more disposed to belief than that of the Jews. Jerome: One of the Ecclesiastical interpreters asks what caused Herod to think that John was risen from the dead; as though we had to account for the errors of an alien, or as though the heresy of metempsychosis was at all supported by this place — a heresy which teaches that souls pass through various bodies after a long period of years — for the Lord was thirty years old when John was beheaded. Raban.: All men have well thought concerning the power of the resurrection, that the saints shall have greater power after they have risen from the dead, than they had while they were yet weighed down with the infirmity of the flesh; wherefore Herod says, “Therefore mighty works are wrought in him.” Aug.: Luke’s words are, “John have I beheaded: who is he of whom I hear such things? [Luke 9:9] As Luke has thus represented Herod as in doubt, we must understand rather that he was afterwards convinced of that which was commonly said — or we must take what he here says to his servants as expressing a doubt — for they admit of either of these acceptations. Remig.: Perhaps some one may ask how it can be here said, “At that time Herod heard,” seeing that we have long before read that Herod was dead, and that on that the Lord returned out of Egypt. This question is answered, if we remember that there were two Herods. On the death of the first Herod, his son Archelaus succeeded him, and after ten years was sent into exile to Vienne in Gaul. Then Caesar Augustus gave command that the kingdom should be divided into tetrarchies, and gave three parts to the sons of Herod. This Herod then who beheaded John is the son of that greater Herod under whom the Lord was born; and this is confirmed by the Evangelist adding “the tetrarch.” Gloss. ord.: Having mentioned this supposition of John’s resurrection, because he had never yet spoken of his death, he now returns, and narrates how it came to pass. Chrys.: And this relation is not set before us as a principal matter, because the Evangelist’s only object was to tell us concerning Christ, and nothing beyond, unless so far as it furthered this object. He says then, “For Herod had seized John, and bound him.” Aug., De Cons. Ev., ii, 44: Luke does not give this in the same order, but where he is speaking of the Lord’s baptism, so that he took beforehand an event which happened long afterwards. For after that saying of John’s concerning the Lord, that His fan is in His hand, he straightway adds this, which, as we may gather from John’s Gospel, did not follow immediately. For he relates that after Jesus was baptized, He went into Galilee, and thence returned into Judaea, and baptized there near to the Jordan before John was cast into prison. But neither Matthew nor Mark have placed John’s imprisonment in that order in which it appears from their own writings that it took place; for they also say that when John was delivered up, the Lord went into Galilee, and after many things there done, then by occasion of the fame of Christ reaching Herod they relate what took place in the imprisonment and beheading of John. The cause for which he had been cast into prison he shews when he says, “On account of Herodias his brother’s wife. For John had said unto him, It is not lawful for thee to have her.” Jerome: The old history tells us that Philip the son of Herod the greater, the brother of this Herod, had taken to wife Herodias daughter of Aretas, king of the Arabs; and that he, the father-in-law, having afterwards cause of quarrel with his son-in-law, took away his daughter, and to grieve her husband gave her in marriage to his enemy Herod. John the Baptist therefore, who came in the spirit and power of Elias, with the same authority that he had exerted over Ahab and Jezebel, rebuked Herod and Herodias, because that they had entered into unlawful wedlock; it being unlawful while the own brother yet lives to take his wife. He preferred to endanger himself with the King, than to be forgetful of the commandments of God in commending himself to him. Chrys.: Yet he speaks not to the woman but to the husband, as he was the chief person. Gloss. ord.: And perhaps he observed the Jewish Law, according to which John forbade him this adultery. “And desiring to kill him, he feared the people.” Jerome: He feared a disturbance among the people for John’s sake, for he knew that multitudes had been baptized by him in Jordan; but he was overcome by love of his wife, which had already made him neglect the commands of God. Gloss. ord.: The fear of God amends us, the fear of man torments us, but alters not our will; it rather renders us more impatient to sin as it has held us back for a time from our indulgence."
