text = "24. “No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other. Ye cannot serve God and mammon.” Pseudo-Chrys.: The Lord had said above, that he that has a spiritual mind is able to keep his body free from sin; and that he who has not, is not able. Of this He here gives the reason, saying, “No man can serve two masters.” Gloss., non occ.: Otherwise; it had been declared above, that good things become evil, when done with a worldly purpose. It might therefore have been said by some one, I will do good works from worldly and heavenly motives at once. Against this the Lord says, “No man can serve two masters.” Chrys., Hom xxi: Or otherwise; in what had gone before He had restrained the tyranny of avarice by many and weighty motives, but He now adds yet more. Riches do not only harm us in that they arm robbers against us, and that they cloud our understanding, but they moreover turn us away from God’s service. This He proves from familiar notions, saying, “No man can serve two masters;” two, He means, whose orders are contrary; for concord makes one of many. This is proved by what follows, “for either he will hate the one.” He mentions two, that we may see that change for the better is easy. For if one were to give himself up in despair as having been made a slave to riches, namely, by loving them, he may hence learn, that it is possible for him to change into a better service, namely, by not submitting to such slavery, but by despising it. Gloss., non occ.: Or; He seems to allude to two different kinds of servants; one kind who serve freely for love, another who serve servilely from fear. If then one serve two masters of contrary character from love, it must be that he hate the one; if from fear, while he trembles before the one, he must despise the other. But as the world or God predominate in a man’s heart, he must be drawn contrary ways; for God draws him who serves Him to things above; the earth draws to things beneath; therefore He concludes, “Ye cannot serve God and mammon.” Jerome: “Mammon,” - riches are so termed in Syriac. Let the covetous man who is called by the Christian name, hear this, that he cannot serve both Christ and riches. Yet He said not, he who has riches, but, he who is the servant of riches. For he who is the slave of money, guards his money as a slave; but he who has thrown off the yoke of his slavery, despenses them as a master. Gloss. ord.: By “mammon” is meant the Devil, who is the lord of money, not that he can bestow them unless where God wills, but because by means of them he deceives men. Aug., Serm. in Mont., ii, 14: Whoso serves “mammon,” (that is, riches,) verily serves him, who, being for desert of his perversity set over these things of earth, is called by the Lord, “The prince of this world.” Or otherwise; who the two masters are He shews when He says, “Ye cannot serve God and mammon,” that is to say, God and the Devil. “Either” then man “will hate the one, and love the other,” namely, God; “or, he will endure the one and despise the other.” For he who is mammon’s servant endures a hard master; for ensnared by his own lust he has been made subject to the Devil, and loves him not. As one whose passions have connected him with another man’s handmaid, suffers a hard slavery, yet loves not him whose handmaid he loves. But He said, “will despise,” and not “will hate,” the other, for none can with a right conscience hate God. But he despises, that is, fears Him not, as being certain of His goodness."
