physical_line_ranges = [[2158, 2158]]
text = "Aug.: By declaring himself unworthy, he shewed himself worthy, not indeed into whose house, but into whose heart, Christ the Word of God should enter. Nor could he have said this with so much faith and humility, had he not borne in his heart Him whom he feared to have in his house. And indeed it would have been no great blessedness that Jesus should enter within his walls, if He had not already entered into his heart."
