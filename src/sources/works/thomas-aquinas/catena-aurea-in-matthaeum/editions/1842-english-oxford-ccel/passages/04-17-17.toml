text = "17. From that time Jesus began to preach, and to say, “Repent: for the kingdom of Heaven is at hand.” Pseudo-Chrys.: Christ’s Gospel should be preached by him who can control his appetites, who contemns the goods of this life, and desires not empty honours. “From this time began Jesus to preach,” that is, after having been tempted, He had overcome hunger in the desert, despised covetousness on the mountain, rejected ambitious desires in the temple. Or from the time that John was delivered up; for had He begun to preach while John was yet preaching, He would have made John be lightly accounted of, and John’s preaching would have been though superfluous by the side of Christ’s teaching; as when the sun rises at the same time with the morning star, the star’s brightness is hid. Chrys.: For another cause also He did not preach till John was in prison, that the multitude might not be split into two parties; or as John did no miracle, all men would have been drawn to Christ by His miracles. Rabanus: In this He further teaches that none should despise the words of a person inferior to Him; as also the Apostle, “If any thing be revealed to him that sits, let the first hold his peace.” [1 Cor 14:30] Pseudo-Chrys.: He did wisely in making now the beginning of His preaching, that He should not trample upon John’s teaching, but that He might the rather confirm it and demonstrate him to have been a true witness. Jerome: Shewing also thereby that He was Son of that same God whose prophet John was; and therefore He says, “Repent ye.” Pseudo-Chrys.: He does not straightway preach righteousness which all knew, but repentance, which all needed. Who then dared to say, ‘I desire to be good, but am not able?” For repentance corrects the will; and if ye will not repent through fear of evil, at least ye may for the pleasure of good things; hence He says, “the kingdom of heaven is at hand;” that is, the blessings of the heavenly kingdom. As if He has said, Prepare yourselves by repentance, for the time of eternal reward is at hand. Remig.: And note, He does not say the kingdom of the Canaanite, or the Jebusite, is at hand; the “the kingdom of heaven.” The law promised worldly goods, but the Lord heavenly kingdoms. Chrys.: Also observe how that in this His first address He says nothing of Himself openly; and that very suitably to the case, for they had yet no right opinion concerning Him. In this commencement moreover He speaks nothing severe, nothing burdensome, as John had concerning the axe laid to the root of the condemned tree, and the lie; but he puts first things merciful, preaching the glad tidings of the kingdom of heaven. Jerome: Mystically interpreted, Christ begins to preach as soon as John was delivered to prison, because when the Law ceased, the Gospel commenced."
