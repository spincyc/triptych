text = "22. Then was brought unto him one possessed with a devil, blind and dumb: and he healed him, insomuch that the blind and dumb both spake and saw. 23. And all the people were amazed, and said, Is not this the Son of David? 24. But when the Pharisees heard it, they said, “This fellow doth not cast out devils, but by Beelzebub the prince of the devils.” Gloss., non occ.: The Lord had refuted the Pharisees above, when they brought false charges against the miracles of Christ, as if He had broken the sabbath in doing them. But inasmuch as with a yet greater wickedness they perversely attributed the miracles of Christ done by divine power to an unclean spirit, therefore the Evangelist places first the miracle from which they had taken occasion to blaspheme, saying, “Then was brought to him one that had a daemon, blind and dumb.” Remig.: The word “Then” refers to that above, where having healed the man who had the withered hand, He went out of the synagogue. Or it may be taken of a more extended time; Then, namely, when these things were being done or said. Chrys.: We may wonder at the wickedness of the daemon; he had obstructed both inlets by which he could believe, namely, hearing and sight. But Christ opened both, whence it follows, “And he healed him, insomuch that the blind and dumb both spake and saw.” Jerome: Three miracles were wrought in one and the same person at the same time; the blind sees, the dumb speaks, the possessed is delivered from the daemon. This was at that time done in the flesh, but is now daily being fulfilled in the conversion of them that believe; the daemon is cast out when they first behold the light of the faith, and then their mouths which had before been stopped are opened to utter the praises of God. Hilary: Not without reason, after having mentioned that all the multitude was healed together, does he bring in the cure of this man separately who was demoniac, blind and dumb. For after the man of the withered hand had been brought before Him, and been healed in the Synagogue, it behoved that the salvation of the Gentiles should be represented in the person of some other afflicted man; he who had been the habitation of a daemon, and blind and dumb, should be made meet to receive God, should contain God in Christ, and by confession of God should give praise to the works of Christ. Aug., Quaest. Ev., i, 4: For he that believes not, is truly demoniac, b1ind, and dumb; and he that has not understanding of the faith, nor confesses, nor gives praise to God, is subject to the devil. Aug., De Cons. Ev., ii, 37: This narrative is given by Luke, not in this place, but after many other things intervening, and speaks of him as dumb only, and not blind. But he is not to be thought to be speaking of another man, because he is silent respecting this one particular; for in what follows he agrees exactly with Matthew. Hilary: All the multitude were astonished at this which was done, but the jealousy of the Pharisees grew thereupon, “And all the multitude were astonished and said, Is not this the Son of David?” Gloss., ap. Raban.: Because of His mercy and His goodness to them they proclaim Him the Son of David. Raban. e Beda in Luc.: The multitude who seemed less learned, always wondered at the works of the Lord; they, on the other hand, either denied these things, or what they could not deny laboured to pervert by an ill interpretation, as though they were wrought not by a Deity, but by an unclean spirit, namely, Beelzebub, who was the God of Acharon: “The Pharisees when they heard it said, This man does not cast out daemons but by Beelzebub, the prince of the demons.” Remig.: Beelzebub is the same as Beel or Baal, or Beelphegor. Beel was father of Ninus king of Assyria; Baal was so called because he was worshipped on high; he was called Beelphegor from the mountain Phegor; Zebub was the servant of Abimelech the son of Gedeon, who, having slain his seventy brothers, built a temple to Baal, and set him up as Priest therein, to drive away the flies which were collected there by the abundant blood of the victims; for Zebub means, a fly. Beelzebub therefore is interpreted, The man of flies; wherefore from this most unclean worship they called him the Prince of the daemons. Having therefore nothing more mean to cast upon the Lord, they said that He cast out daemons by Beelzebub. And it should be known that this word is not to be read with d or t at the end, as some corrupt copies have, but with, b."
