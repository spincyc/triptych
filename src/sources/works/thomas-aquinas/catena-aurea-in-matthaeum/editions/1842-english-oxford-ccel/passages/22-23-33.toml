  { line = 5447, text = "For they who in comparison of other men are most perfect before God, have God entirely in them, wherefore He is not said to be their God in common, but of each in particular. As when we say, That farm is theirs, we shew that each of them does not own the whole of it; but when we say, That farm is his, we mean that he is owner of the whole of it. When then it is said, “The God of the Hebrews,” this shews their imperfection, that each of them has some small portion in God. But it is said, “The God of Abraham, the God of Isaac, and the God of Jacob,” because each one of these possessed God entirely. And it is to the no small honour of the Patriarchs that they lived to God." },
  { line = 5448, text = "Aug., cont. Faust., xvi. 24: Seasonably may we confute the Manichaeans by this same passage by which the Sadducees were then confuted, for they too, though in another manner, deny the resurrection." },
  { line = 5449, text = "Aug., in Joan. Tr., xi, 8: God is therefore called in particular “The God of Abraham, the God of Isaac, and the God of Jacob,” because in these three are expressed all the modes of begetting the sons of God. For God begets most times of a good preacher a good son, and of a bad preacher a bad son. This is signified in Abraham, who of a free woman had a believing son, and of a bondslave an unbelieving son. Sometimes indeed of a good preacher He begets both good and bad sons, which is signified in Isaac, who of the same free woman begot one good and the other bad. And sometimes He begets good sons both of good and bad preachers; which is signified in Jacob, who begot good sons both of free women and of bondmaids." },
  { line = 5450, text = "Pseudo-Chrys.: And see how the assault of the Jews against Christ becomes more faint. Their first challenge was in a threatening tone, “By what authority doest thou these things,” to oppose which firmness of spirit was needed. Their second was with guile, to meet which was needed wisdom. This last was with ignorant presumption which is easier to cope with than the others. For he that thinks he knows somewhat, when he knows nothing, is an easy conquest for one who has understanding. Thus the attacks of an enemy are vehement at first, but if one endure them with a courageous spirit, he will find them more feeble." },
  { line = 5451, text = "“And when the multitudes heard this, they were astonished at his doctrine.”" },
  { line = 5452, text = "Remig.: Not the Sadducees but the multitudes were astonished. This is daily done in the Church; when by Divine inspiration the adversaries of the Church are overcome, the multitude of the faithful rejoice." },
]
