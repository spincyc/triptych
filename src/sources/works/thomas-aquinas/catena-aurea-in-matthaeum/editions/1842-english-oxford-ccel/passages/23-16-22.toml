text = "16. “Woe unto you, ye blind guides, which say, ‘Whosoever shall swear by the temple, it is nothing; but whosoever shall swear by the gold of the temple, he is a debtor!’ 17. Ye fools and blind: for whether is greater, the gold, or the temple that sanctifieth the gold? 18. And, Whosoever shall swear by the altar, it is nothing; but whosoever sweareth by the gift that is upon it, he is guilty. 19. Ye fools and blind: for whether is greater, the gift, or the altar that sanctifieth the gift? 20. Whoso therefore shall swear by the altar, sweareth by it, and by all things thereon. 21. And whoso shall swear by the temple, sweareth by it, and by him that dwelleth therein. 22. And he that shall swear by heaven, sweareth by the throne of God, and by him that sitteth thereon.” Jerome: As by making broad phylacteries and fringes they sought after the reputation of sanctity, and made this again a means of gain, so now He charges them with being teachers of wickedness by their fraudulent pretence of tradition. For when in any dispute or quarrel, or ambiguous cause, one swore by the temple, and was afterwards convicted of falsehood, he was not held guilty. This is what is meant by that, “Whosoever shall swear by the temple, it is nothing,” that is, be owes nothing, But if he had sworn by the gold, or by the money which was offered to the Priests in the temple, he was immediately compelled to pay down that by which be had sworn. Pseudo-Chrys.: The temple pertains to God’s glory, and to man’s spiritual salvation, but the gold of the temple though it pertains to the glory of God, yet does it more so to the delight of man, and the profit of the Priests. The Jews then pronounced the gold which delighted them, and the gifts which fed them, to be more holy than the temple, that they might make men more disposed to offer gifts, than to pour out prayers in the temple. Whence the Lord suitably reproves them in these words. Yet have some Christians at present an equally foolish notion. See, they say, in any suit if one swear by God, it seems nought; but if one swear by the Gospel, he seems to have done some great thing. To whom we shall say in like manner, “Ye fools and blind!” the Scriptures were written because of God, God is not because of the Scriptures. Greater therefore is God, than what is hallowed by Him. Jerome: Again, if one swore by the altar, none held him guilty of perjury; but if be swore by the gift or the victims or the other things which are offered to God upon the altar, this they exacted most rigorously. And all this they did not out of fear of God, but out of covetousness. Thus the Lord charges them with both folly and fraud, inasmuch as the altar is much greater than the victims which are sanctified by the altar. Gloss., non occ.: And lest their infatuation should go so far, that they should affirm that the gold was more holy than the temple, and the gift than the altar, He argues on another ground, that in the oath which is sworn by the temple and the altar is contained the oath by the gold or by the gift. Origen: In like manner the custom which the Jews had of swearing by the Heaven He reprobates. For they did not, as they supposed, avoid the danger of taking an oath by God, because, “Whoso sweareth by heaven, sweareth by the throne of God, and by him that sitteth thereon.” Gloss., ord.: For whoso swears by the creature that is subject, swears by the Divinity that rules over the creation. Origen: Now an oath is in confirmation of somewhat that has been spoken. The oath here then may signify testimony of Scripture which we produce in confirmation of that word which we speak. So that Divine Scripture is the temple of God, the gold is the meaning which it contains. As the gold which is outside the Temple is not sanctified, so all thoughts which are without divine Scripture, however admirable they may seem, are not hallowed. We ought not therefore to bring any speculations of our own for the confirmation of doctrine, unless such as we can shew are hallowed by being contained in divine Scripture. The altar is the human heart, which is the chief thing in man. The offerings and gifts that are bid upon the altar, are every thing which are done in the heart, as to pray, to sing, to do alms, to fast. Every offering of a man then is sanctified by his heart, by which the offering is made. There cannot therefore be a more honourable offering than the heart of man, out of which the offering proceeds. If then one’s conscience does not smite him, he has confidence towards God, not by reason of his gifts, but so to speak because be has rightly ordered the altar of his heart. Thirdly, we may say that over the temple, that is over every Scripture, and over the altar, that is over every heart, there is a certain meaning which is called the Heaven, the throne of God Himself, in which we shall be able to see the things that are revealed face to face, when that which is perfect is come. Hilary: For since Christ is come, reliance upon the Law is vain; for not Christ by the Law, but the Law by Christ, is sanctified, in whom it rests as on a seat or throne; so are they fools and blind, who, overlooking the sanctifier, pay honour to the things sanctified. Aug., Quaest. Ev., i, 34: The temple and altar we may also understand of Christ Himself; the gold and the gifts, of the praise and sacrifice of prayer which we offer in Him and through Him. For not He by them, but they by Him, are sanctified."
