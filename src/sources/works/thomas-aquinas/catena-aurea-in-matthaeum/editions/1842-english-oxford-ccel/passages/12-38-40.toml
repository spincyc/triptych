text = "38. Then certain of the Scribes and of the Pharisees answered, saying, “Master, we would see a sign from thee.” 39. But he answered and said unto them, “An evil and adulterous generation seeketh after a sign; and there shall no sign be given to it, but the sign of the prophet Jonas: 40. For as Jonas was three days and three nights in the whale’s belly: so shall the Son of man be three days and three nights in the heart of the earth.” Chrys., Hom., xliii: Because the Lord had so oft repressed the shameless tongue of the Pharisees by His sayings, they now turn to His works, whereat the Evangelist wondering, says, “Then certain of the Scribes and Pharisees answered, saying, Master, we would see a sign of thee;” and that at a time when they should have been moved, when they should have wondered, and been dumb with astonishment; yet even at such time they desist not from their malice. For they say, “We would see a sign of thee,” that they may take Him as in a snare. Jerome: They require a sign of Him, as though what they had seen were not signs; and in another Evangelist what they required is more fully expressed, “We would see of thee a sign from heaven.” Either they would have fire from heaven as Elias did; or after the example of Samuel they would that in summer-time, contrary to the nature of the climate, thunder should be heard, lightnings gleam, and rain descend; as though they could not have spoken falsely even against such miracles, and said that they befel by reason of divers hidden motions in the air. For if thou cavillest against what thou not only beholdest with thine eyes, but feelest with thine hand, and reapest the benefit of, what wilt thou do in those things which come down from heaven? You might make answer, that in Egypt the magi also had given many signs from heaven. Chrys.: But their words are full of hypocrisy and irony. But now they were railing against Him, saying that He had a deamon; now they fawn upon Him, calling Him, Master. Wherefore the Lord rebukes them severely; “He answered and said unto them, An evil and adulterous generation seeketh after a sign.” When they railed on Him, He had answered them mildly; now they approached Him with smooth and deceitful words, He rebukes them sharply; shewing that He was above either affection, and was neither moved to anger by evil speaking, nor was to be gained by flattery. What He says is this; What wonder that ye do thus to Me who am unknown to you, when you have done the same to the Father, of whom ye have had such large knowledge, in that, despising Him ye went after daemons? He calls them an evil generation, because they have ever been ungrateful to their benefactors, and were made worse when they received benefits, which is the extreme of wickedness. Jerome: Excellently is that said, “and adulterous,” seeing she has put away her husband, and, according to Ezekiel, has joined herself to many lovers. Chrys.: Which also proves Him to be equal to the Father, if not to believe in Him makes them adulterous. Raban.: Then He begins to answer them, giving them a sign not from heaven, which they were unworthy to see, but giving it them from the deep beneath. But to His own disciples He gave a sign from heaven, to whom He shewed the glory of His blessed eternity both in a figure on the mount, and after in verity when He was taken up into heaven. Wherefore it follows, “And there shall no sign be given it, but the sign of the Prophet Jonas.” Chrys.: For the signs He wrought were not in order to move them, for He knew that they were hard as stone, but for the profit of others. Or because they had not received it when He had given them a sign such as they now desired. And a sign was given them, when by their own punishment they learned His power. This He alludes to when He says, “No sign shall be given it.” As much as to say; I have shewn yon many mercies; yet none of these has brought you to honour My power, which you will then know when you shall behold your city thrown down upon the ground in punishment. In the mean time He brings in a saying concerning the Resurrection which they should after understand by those things that they should suffer; saying, “Except the sign of the Prophet Jonas.” For verily His Cross would not have been believed, unless it had had signs to testify to it. But if that were not believed, truly the Resurrection would not have been believed. For this reason also He calls this a sign, and brings forward a figure thereof, that the verity itself may be believed. It follows, “As Jonas was three days and three nights in the belly of the whale.” Raban.: He shews that the Jews were as criminal as the Ninevites, and that unless they repented they would be destroyed. But like as punishment was denounced against the Ninevites, and at the same time a remedy was set before them, so neither should the Jews despair of pardon, if at least after Christ’s resurrection they should do penitence. For Jonah, that is The Dove, or The mourner, is a sign of Him on whom the Holy Spirit descended in the form of a Dove, and “who bare our sorrows.” [Isa 53:4] The fish which swallowed Jonas in the sea, shews forth the death which Christ suffered in the world. Three days and nights was the one in the whale’s belly, the other in the tomb; the one was cast up on dry land, the other arose in glory. Aug., De Cons., Ev., iii, 24: Some, not knowing the Scripture manner of speaking, would interpret as one night those thee hours of darkness when the sun was darkened from the sixth to the ninth hour; and as a day in like manner these other three hours in which it was again restored to the world, from the ninth hour till sunset. Then follows the night preceding the sabbath, which if we reckon with its own day we shall have thus two days and two nights. Then after the sabbath follows the night of the sabbath prime, that is of the dawning of the Lord’s day on which the Lord arose. Thus we shall only get two nights and two days, with this one night to be added if we might understand the whole of it, and it could not be shewn that that dawn was indeed the latter part of the night. So that not even by taking in those six hours, three of darkness, and three of restored light, can we establish the computation of three days and three nights. It remains therefore that we find the explanation in that usual manner of Scripture of putting a part for the whole. Jerome: Not that He remained three whole days and three nights in hell, but that this be understood to imply a part of the preparation day, and of the Lord’s day, and the whole sabbath day. Aug., De Trin., iv. 6: For that the three days were not three full and entire days, Scripture witnesses; the first day is reckoned because the latter end of it comes in; and the third day is likewise reckoned, because the first part of it is included; while the day between, that is the second day, appears in all its twenty-four hours, twelve of the night and twelve of the day. For the succeeding night up to the dawn when the Lord’s resurrection was made known, belongs to the third day. For as the first days of creation were, because of man’s coming fall, computed from morning to night; so these days are because of man’s restoration computed from night to morning. Chrys.: He said not openly that He should rise again, because they would have derided him, but hints it distantly that even they might believe that He foreknew it. He said not in the earth, but in the heart of the earth, therein declaring His tomb, and that none might suspect that there was only the semblance of death. Therefore also He spake of three days, that it should be believed that He was dead. But the sign itself proves the truth of it; for Jonas was in the whale’s belly not in figure but in deed; and surely the sign did not happen in very deed, if the thing signified happened only in figure. Wherefore it is manifest that they are children of the Devil who follow Marcion asserting that the passion of Christ was only a phantasy. And that He should suffer for them also, though they would not profit by it, is shewn by that which He speaks, that to this generation should be given the sign of Jonas the Prophet."
