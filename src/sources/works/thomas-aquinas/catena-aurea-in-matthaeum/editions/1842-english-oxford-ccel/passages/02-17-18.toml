text = "17. Then was fulfilled that which was spoken by Jeremy the prophet, saying, 18. In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children, and would not be comforted, because they are not. Chrys., Hom. ix: The Evangelist by this history of so bloody a massacre, having filled the reader with horror, now again sooths his feelings, shewing that these things were not done because God could not hinder, or knew not of them; but as the Prophet had foretold. Jerome, In Hierem, 31, 15: This passage of Jeremiah has been quoted by Matthew neither according to the Hebrew nor the LXX version. This shews that the Evangelists and Apostles did not follow any one’s translation, but according to the Hebrew manner expressed in their own words what they had read in Hebrew. By Ramah we need not suppose that the town of that name near Gibeah is meant; but take it as signifying ‘high.’ A voice was heard ‘aloft,’ that is, spread far and wide. Pseudo-Chrys.: Or, it was heard on high, because uttered for the death of the innocent, according to that, “The voice of the poor entereth into the heavens.” The ‘weeping’ means the cries of the children; ‘lamentation,’ refers to the mothers. In the infants themselves their death ends their cries, in the mothers it is continually renewed by the remembrance of their loss. Jerome: Rachel’s son was Benjamin, in which tribe Bethlehem is not situated. How then does Rachel weep for the children of Judah as if they were her own? We answer briefly. She was buried near Bethlehem in Ephrata, and was regarded as the mother, because her body was there entertained. Or, as the two tribes of Judah and Benjamin were contiguous, and Herod’s command extended to the coasts of Bethlehem as well as to the town itself, we may suppose that many were slain in Benjamin. Pseudo-Aug., Hil. Quaest. N. and N. Test. 9. 62: Or, The sons of Benjamin, who were akin to Rachel, were formerly cut off by the other tribes, and so extinct both then and ever after. Then therefore Rachel began to mourn her sons, when she saw those of her sister cut off in such a cause, that they should be heirs of eternal life; for he who has experienced any misfortune, is made more sensible of his losses by the good fortune of a neighbour. Remig.: The sacred Evangelist adds, to shew the greatness of the mourning, that even the dead Rachel was roused to mourn her sons; and “would not be comforted because they were not.” Jerome: This may be understood in two ways; either she thought them dead for all eternity, so that no consolation could comfort her; or, she desired not to receive any comfort for those who she knew had gone into life eternal. Hilary: It could not be that they “were not” who seemed now dead, but by glorious martyrdom they were advanced to eternal life; and consolation is for those who have suffered loss, not for those who have reaped a gain. Rachel affords a type of the Church long barren now at length fruitful. She is heard weeping for her children, not because she mourned them dead, but because they were slaughtered by those whom she would have retained as her first-born sons. Rabanus: Or, The Church weeps the removal of the saints from this earth, but wishes not to be comforted as though they should return again to the struggles of life, for they are not to be recalled into life. Gloss. ord.: She “will not be comforted” in this present life, for that they are not, but transfers all her hope and comfort to the life to come. Rabanus: Rachel is well set for a type of the Church, as the word signifies ‘a sheep’ or ‘seeing;’ [margin note: see Ch. 1, note i, p. 19] her whole thought being to fix her eye in contemplation of God; and she is the hundredth sheep that the shepherd layeth on his shoulder."
