notes = "Exact CCEL English digital witness inspected on 2026-11-18; no facsimile collation (no page image of the 1842 Oxford printing is registered for this edition, and none was added: the edition record describes a digital transcription, not a facsimile-collated edition, and a facsimile of the printing would be a different exact witness to be registered on its own evidence), and no collation with Gregory's Latin. Not verified. The CCEL text splits one sentence across two labels: Gregory's The Lord’s meaning then is, runs on into Jerome's Was it for this ye went out ..., so the comment as given here ends mid-sentence by the Catena's own construction, not by truncation. The R3 dossier's Bute OCR (lines 33103-33117) was not consulted."
