  { line = 4874, text = "Remig.: Or, the Lord Jesus Christ Himself is the master of the household, and also the steward, like as He is the door, and also the keeper of the door. For He Himself will come to judgment, to render to each man according to that he has done. He therefore calls His labourers, and renders to them their wages, so that when they shall be gathered together in the judgment, each man shall receive according to his works." },
  { line = 4875, text = "Origen, Heb 11, 40: But the first labourers having the witness through faith have not received the promise of God, the lord of the household providing some better thing for us, that they without us should not be made perfect. And because we have obtained mercy, we hope to receive the reward first, we, that is, who are Christ’s, and after us they that wrought before us; wherefore it is said, “Call the labourers, and give them their hire, beginning from the last unto the first.”" },
  { line = 4876, text = "Pseudo-Chrys.: For we always give more willingly, where we give without return, seeing it is for our own honour that we give. Therefore God in giving reward to all the saints shews himself just; in giving to us, merciful; as the Apostle speaks, “That the Gentiles might glorify God for His mercy;” [Rom 16:9] and thence it is said, “Beginning from the last even unto the first.”" },
  { line = 4877, text = "Or surely that God may shew His inestimable mercy, He first rewards the last and more unworthy, and afterwards the first; for of His great mercy He regarded not order of merit." },
  { line = 4878, text = "Aug., de Spir. et Lit. 24: Or; The lesser are therefore taken as first, because the lesser are to be made rich." },
  { line = 4879, text = "Greg.: They get alike a denarius who have wrought since the eleventh hour, (for they sought it with their whole soul,) and who have wrought since the first. They, that is, who were called from the beginning of the world have alike received the reward of eternal happiness, with those who come to the Lord in the end of the world." },
  { line = 4880, text = "Pseudo-Chrys.: And this not with injustice. For he who was born in the first period of the world, lived no longer than the determined time of his life, and what harm was it to him, though the world continued after his leaving it? And they that shall be born towards its close will not live less than the days that are numbered to them. And how does it cut their labour shorter, that the world is speedily ended, when they have accomplished their thread of life before?" },
  { line = 4881, text = "Moreover it is not of man to be born sooner or later, but of the power of God. Therefore he that is born first cannot claim to himself a higher place, nor ought he to be held in contempt that was born later. “And when they had received it, they murmured against the goodman of the house, saying.” But if this we have said be true, that both first and last have lived their own time, and neither more nor less; and that each man’s death is his consummation, what means this that they say, “We have borne the burden and heat of the day?” Because to know that the end of the world is at hand is of great force to make us do righteousness. Wherefore Christ in His love to us said, “The kingdom of heaven shall draw nigh.” [Matt 4:2]" },
  { line = 4882, text = "Whereas it was a weakening of them to know that the duration of the world was to be yet long. So that though they did not indeed live through the whole of time, they seem in a manner to have borne its weight. Or, by the burden of the day is meant the burdensome precepts of the Law; and the heat may be that consuming temptation to error which evil spirits contrived for them, stirring them to imitate the Gentiles; from all which things the Gentiles were exempt, believing on Christ, and by compendiousness of grace being saved completely. Greg.: Or; To bear the burden and heat of the day, is to be weaned through a life of long duration with the heats of the flesh. But it may be asked, How can they be said to murmur, when they are called to the kingdom of heaven? For none who murmurs shall receive the kingdom, and none who receives that can murmur." },
  { line = 4883, text = "Chrys.: But we ought not to pursue through every particular the circumstances of a parable; but enter into its general scope, and seek nothing further. This then is not introduced in order to represent some as moved with envy, but to exhibit the honour that shall be given us as so great as that it might stir the jealousy of others." },
  { line = 4884, text = "Greg.: Or because the old fathers down to the Lord’s coming, notwithstanding their righteous lives, were not brought to the kingdom, this murmur is theirs. But we who have come at the eleventh hour, do not murmur after our labours, forasmuch as having come into this world after the coming of the Mediator, we are brought to the kingdom as soon as ever we depart out of the body." },
  { line = 4885, text = "Jerome: Or, all that were called of old envy the Gentiles, and are pained at the grace of the Gospel." },
  { line = 4886, text = "Hilary: And this murmur of the labourers corresponds with the frowardness of this nation, which even in the time of Moses were stiff-necked." },
  { line = 4887, text = "Remig.: By this one to whom his answer is given, may be understood all the believing Jews, whom he calls friends because of their faith." },
  { line = 4888, text = "Pseudo-Chrys.: Their complaint was not that they were defrauded of their rightful recompense, but that the others had received more than they deserved. For the envious have as much pain at others’ success as at their own loss." },
  { line = 4889, text = "From which it is clear, that envy flows from vain glory. A man is grieved to be second, because he wishes to be first. He removes this feeling of envy by saying, “Didst thou not agree with me for a denarius?”" },
  { line = 4890, text = "Jerome: A denarius bears the figure of the king. You have therefore received the reward which I promised you, that is, my image and likeness; what desirest thou more? And yet, it is not that thou shouldest have more, but that another should have less that thou seekest. “Take that is thine, and go thy way.”" },
  { line = 4891, text = "Remig.: That is, take thy reward, and enter into glory. “I will give to this last,” that is, to the gentile people, according to their deserts, as to thee." },
  { line = 4892, text = "Origen: Perhaps it is to Adam He says, “Friend, I do thee no wrong; didst thou not agree with me for a denarius? Take that thine is, and go thy way.” Salvation is thine, that is, the denarius. “I will give unto this last also as unto thee.” A person might not improbably suppose, that this last was the Apostle Paul, who wrought but one hour, and was made equal with all who had been before him." },
  { line = 4893, text = "Aug., de Sanc. Virg., 26: Because that life eternal shall be equal to all the saints, a denarius is given to all; but forasmuch as in that life eternal the light of merits shall shine diversely, there are with the Father many mansions; so that under this same denarius bestowed unequally one shall not live longer than another, but in the many mansions one shall shine with more splendour than another." },
  { line = 4894, text = "Greg.: And because the attainment of this kingdom is of the goodness of His will, it is added, “It is not lawful for me to do what I will with mine own?” For it is a foolish complaint of man to murmur against the goodness of God. For complaint is not when a man gives not what he is not bound to give, but if he gives not what he is bound to give; whence it is added, “Is thine eye evil because I am good?”" },
  { line = 4895, text = "Remig.: By the eye is understood his purpose. The Jews had an evil eye, that is, an evil purpose, seeing they were grieved at the salvation of the Gentiles. Whereto this parable pointed, He shews by adding, “So the first shall be last, and the last first;” and so the Jews of the head are become the tail, and we of the tail are become the head." },
  { line = 4896, text = "Pseudo-Chrys.: Or; He says the first shall be last, and the last first, not that the last are to be exalted before the first, but that they should be put on an equality, so that the difference of time should make no difference in their station. That He says, “For many are called, but few chosen,” is not to be taken of the elder saints, but of the Gentiles; for of the Gentiles who were called being many, but few were chosen." },
  { line = 4897, text = "Greg.: There be very many come to the faith, yet but few arrive at the heavenly kingdom; many follow God in words, but shun Him in their lives. Whereof spring two things to be thought upon. The first, that none should presume ought concerning himself; for though he be called to the faith, he knows not whether he shall be chosen to the kingdom." },
  { line = 4898, text = "Secondly, that none should despair of his neighbour, even though he see him lying in vices; because he knows not the riches of the Divine mercy." },
  { line = 4899, text = "Or otherwise. The morning is our childhood; the third hour may be understood as our youth, the sun as it were mounting to his height is the advance of the heat of age; the sixth hour is manhood, when the sun is steady in his meridian height, representing as it were the maturity of strength; by the ninth is understood old age, in which the sun descends from his vertical height, as our age falls away from the fervour of youth; the eleventh hour is that age which is called decrepit, and doting." },
  { line = 4900, text = "Chrys.: That He called not all of them at once, but some in the morning, some at the third hour, and so forth, proceeded from the difference of their minds [ed. note: γνώμη]. He then called them when they would obey; as He also called the thief when he would obey. Whereas they say, “Because no man hath hired us,” we ought not to force a sense out of every particular in a parable. Further, it is the labourers and not the Lord who speak thus; for that He, as far as it pertains to Him, calls all men from their earliest years, is shewn in this, “He went out early in the morning to hire labourers.”" },
  { line = 4901, text = "Greg.: They then who have neglected till extreme old age to live unto God, have stood idle to the eleventh hour, yet even these the master of the household calls, and oftentimes gives them their reward before other, inasmuch as they depart out of the body into the kingdom before those that seemed to be called in their childhood." },
  { line = 4902, text = "Origen: But this, “Why stand ye here all the day idle?” is not said to such as having “begun, in the spirit,” [Gal 3:3] have been “made perfect by the flesh,” as inviting them to return again, and to live in the Spirit. This we speak not to dissuade prodigal sons, who have consumed their substance of evangelic doctrine in riotous living, from returning to their father’s house; but because they are not like those who sinned in their youth, before they had learnt the things of the faith." },
  { line = 4903, text = "Chrys.: When He says, The first shall be last, and the last first,” He alludes secretly to such as were at the first eminent, and afterwards set at nought virtue; and to others who have been reclaimed from wickedness, and have surpassed many. So that this parable was made to quicken the zeal of those who are converted in extreme old age, that they should not suppose that they shall have less than others." },
]
