text = "14. “Ye are the light of the world. A city that is set on a hill cannot be hid.” Gloss: As the doctors by their good conversation are the salt with which the people is salted; so by their word of doctrine they are the light by which the ignorant are enlightened. Pseudo-Chrys.: But to live well must go before to teach well; hence after He had called the Apostles “the salt,” He goes on to call them “the light of the world.” Or, for that salt preserves a thing in its present state that it should not change for the worse, but that light brings it into a better state by enlightening it; therefore the Apostles were first called salt with respect to the Jews and that Christian body which had the knowledge of God, and which they keep in that knowledge; and now light with respect to the Gentiles whom they bring to the light of that knowledge. Aug.: By the world here we must not understand heaven and earth, but the men who are in the world; or those who love the world for whose enlightenment the Apostles were sent. Hilary: It is the nature of a light to emit its rays whithersoever it is carried about, and when brought into a house to dispel the darkness of that house. Thus the world, placed beyond the pale of the knowledge of God, was held in the darkness of ignorance, till the light of knowledge was brought to it by the Apostles, and thenceforward the knowledge of God shone bright, and from their small bodies, whithersoever they went about, light is ministered to the darkness. Remig.: For as the sun sends forth his beams, so the Lord, the Sun of righteousness, sent forth his Apostles to dispel the night of the human race. Chrys.: Mark how great His promise to them, men who were scarce known in their own country that the fame of them should reach to the ends of the earth. The persecutions which He had foretold, were not able to dim their light, yea they made it but more conspicuous. Jerome: He instructs them what should be the boldness of their preaching, that as Apostles they should not be hidden through fear, like lamps under a corn-measure, but should stand forth with all confidence, and what they have heard in the secret chambers, that declare upon the house tops. Chrys.: Thus shewing them that they ought to be careful of their own walk and conversation, seeing they were set in the eyes of all, like a city on a hill, or a lamp on a stand. Pseudo-Chrys.: This city is the Church of which it is said, “Glorious things are spoken of thee, thou city of God.” [Ps 87:3] Its citizens are all the faithful, of whom the Apostle speaks, “Ye are fellow-citizens of the saints.” [Eph 2:19] It is built upon Christ the hill, of whom Daniel thus, “A stone hewed without hands” [Dan 2:34] became a great mountain. Aug.: Or, the mountain is the great righteousness, which is signified by the mountain from which the Lord is now teaching. Pseudo-Chrys.: “A city set on a hill cannot be hidden” though it would; the mountain which bears makes it to be seen of all men; so the Apostles and Priests who are founded on Christ cannot be hidden even though they would, because Christ makes them manifest. Hilary: Or, the city signifies the flesh which He had taken on Him; because that in Him by this assumption of human nature, there was as it were a collection of the human race, and we by partaking in His flesh become inhabitants of that city. He cannot therefore be hid, because being set in the height of God’s power, He is offered to be contemplated of all men in admiration of his works. Pseudo-Chrys.: How Christ manifests His saints, suffering them not to be hid, He shews by another comparison, adding, “Neither do men light a lamp to put it under a corn-measure,” but on a stand. Chrys.: Or, in the illustration of the city, He signified His own power, by the lamp He exhorts the Apostles to preach with boldness; as though He said, ‘I indeed have lighted the lamp, but that it continue to burn will be your care, not for your own sakes only, but both for others who shall receive its light and for God’s glory.’ Pseudo-Chrys.: The lamp is the Divine word, of which it is said, “Thy word is a lamp unto my feet.” [Ps 119:105] They who light this lamp are the Father, the Son, and the Holy Spirit. Aug.: With what meaning do we suppose the words, “to put it under a corn-measure,” were said? To express concealment simply, or that the “corn-measure” has a special signification? The putting the lamp under the corn-measure means the preferring bodily ease and enjoyment to the duty of preaching the Gospel, and hiding the light of good teaching under temporal gratification. The corn-measure aptly denotes the things of the body, whether because our reward shall be measured out to us, [2 Cor 5:10] as each one shall receive the things done in the body; or because worldly goods which pertain to the body come and go within a certain measure of time, which is signified by the corn-measure, whereas things eternal and spiritual are contained within no such limit. He places his lamp upon a stand, who subdues his body to the ministry of the word, setting the preaching of the truth highest, and subjecting the body beneath it. For the body itself serves to make doctrine shine more clear, while the voice and other motions of the body in good works serve to recommend it to them that learn. Pseudo-Chrys.: Or, men of the world may be figured in the “corn-measure” as these are empty above, but full beneath, so worldly men are foolish in spiritual things, but wise in earthly things, and therefore like a corn-measure they keep the word of God hid, whenever for any worldly cause he had not dared to proclaim the word openly, and the truth of the faith. The stand for the lamp is the Church which bears the word of life, and all ecclesiastical persons. [margin note: Phil 2:15] Hilary: Or, the Lord likened the Synagogue to a corn-measure, which only receiving within itself such fruit as was raised; contained a certain measure of limited obedience. Ambrose. non occ.: And therefore let none shut up his faith within the measure of the Law, but have recourse to the Church in which the grace of the sevenfold Spirit shines forth. Bede, in Loc. quoad sens.: Or, Christ Himself has lighted this lamp, when He filled the earthen vessel of human nature with the fire of His Divinity, which He would not either hide from them that believe, nor put under a bushel that is shut up under the measure of the Law, or confine within the limits of any one oration. The lampstand is the Church, on which He set the lamp, when He affixed to our foreheads the faith of His incarnation. Hilary: Or, the lamp, i.e. Christ Himself, is set on its stand when He was suspended on the Cross in His passion, to give light for ever to those that dwell in the Church; “to give light,” He says, “to all that are in the house.” Aug.: For it is not absurd if any one will understand “the house” to be the Church. Or, “the house” may be the world itself, according to what He said above, “Ye are the light of the world.” Hilary: He instructs the Apostles to shine with such a light, that in the admiration of their work God may be praised, “Let your light so shine before men, that they may see your good works.” Pseudo-Chrys.: That is, teaching with so pure a light, that men may not only hear your words, but see your works, that those whom as lamps ye have enlightened by the word, as salt ye may season by your example. For by those teachers who do as well as teach, God is magnified; for the discipline of the master is seen in the behavior of the family. And therefore it follows, “and they shall glorify your Father which is in heaven.” Aug., Serm. in Mont., i, 7: Had He only said, “That they may see your good works,” He would have seemed to have set up as an end to be sought the praised of men, which the hypocrites desire; but by adding, “and glorify your Father,” he teaches that we should not seek as an end to please men with our good works, but referring all to the glory of God, therefore seek to please men, that in that God may be glorified. Hilary: He means not that we should seek glory of men, but that though we conceal it, our work may shine forth in honour of God to those among whom we live."
