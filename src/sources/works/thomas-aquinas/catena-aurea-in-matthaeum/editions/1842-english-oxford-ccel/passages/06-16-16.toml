text = "16. “Moreover when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast. Verily I say unto you, They have their reward.” Pseudo-Chrys.: Forasmuch as that prayer which is offered in a humble spirit and contrite heart, shews a mind already strong and disciplined; whereas he who is sunk in self-indulgence cannot have a humble spirit and contrite heart; it is plain that without fasting prayer must be faint and feeble; therefore, when any would pray for any need in which they might be, they joined fasting with prayer, because it is an aid thereof. Accordingly the Lord, after His doctrine respecting prayer, adds doctrine concerning fasting, saying, “When ye fast, be not ye as the hypocrites, of sad countenance.” The Lord knew that vanity may spring from every good thing, and therefore bids us root out the bramble of vain-gloriousness which springs in the good soil, that it choke not the fruit of fasting. For though it cannot be that fasting should not be discovered in any one, yet is it better that fasting should shew you, than that you should shew your fasting. But it is impossible that any in fasting should be gay, therefore He said not, Be not sad, but “Be not made sad;” for they who discover themselves by any false displays of their affliction, they are not sad, but make themselves; but he who is naturally sad in consequence of continued fasting, does not make himself sad, but is so. Jerome: The word, “exterminare,” so often used in the ecclesiastical Scriptures though a blunder of the translators, has a quite different meaning from that in which it is commonly understood. It is properly said of exiles who are sent beyond the boundry of their country. Instead of this word, it would seem better to use the word, “demoliri,” ‘to destroy,’ in translating the Greek ἀφανίζειν. The hypocrite destroys his face, in order that he may feign sorrow, and with a heart full of joy wears sorrow in his countenance. Greg., Mor., viii, 44: For by the pale countenance, the trembling limbs, and the bursting sighs, and by all so great toil and trouble, nothing is in the mind but the esteem of men. Leo, Serm. in Epiph., iv, 5: But that fasting is not pure, that comes not of reasons of continence, but of the arts of deceit. Pseudo-Chrys.: If then he who fasts, and makes himself of sad countenance, is a hypocrite, how much more wicked is he who does not fast, yet assumes a fictitious paleness of face as a token of fasting. Aug., Serm. in Mont., ii, 12: On this paragraph it is to be specially noted, that not only in outward splendor and pomp, but even in the dress of sorrow and mourning, is there room for display, and that the more dangerous, inasmuch as it deceives under the name of God’s services. For he who by inordinate pains taken with her person, or his apparel, or by the glitter of his other equipage, is distinguished, is easily proved by these very circumstances to be a follower of the pomps of this world, and no man is deceived by any semblance of a feigned sanctity in him. But when any one in the profession of Christianity draws men’s eyes upon him by unwonted beggary and slovenliness in dress, if this be voluntary and not compulsory, then by his other conduct may be seen whether he does this to be seen of men, or from contempt of the refinements of dress. Remig.: The reward of the hypocrites’ fast is shewn, when it is added, “That they may seem to men to fast; verily I say unto you, They have their reward;” that is, that reward for which they looked."
