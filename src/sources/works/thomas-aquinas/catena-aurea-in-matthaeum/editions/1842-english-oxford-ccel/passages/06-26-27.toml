text = "26. “Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they? 27. Which of you by taking thought can add one cubit unto his stature?” Pseudo-Chrys.: Having confirmed our hope by this arguing from the greater to the less, He next confirms it by an argument from less to greater, “Behold the fowls of the air, they sow not, neither do they reap.” Aug., De Op. Monach., 23: Some argue that they ought not to labour, because the fowls of the air neither sow nor reap. Why then do they not attend to that which follows, “neither gather into barns? Why do they seek to have their hands idle, and their storehouses full? Why indeed do they grind corn, and dress it? For this do not the birds. Or even if they find men whom they can persuade to supply them day by day with victuals ready prepared, at least they draw water from the spring, and set on table for themselves, which the birds do not. But if neither are they driven to fill themselves vessels with water, then have they gone one new step of righteousness beyond those who were at that time at Jerusalem, [margin note: see Acts 11:29] who of corn sent to them of free gift, made, or caused to be made, loaves, which the birds do not. But not to lay up any thing for the morrow cannot be observed by those, who for many days together withdrawn from the sight of men, and suffering none to approach to them, shut themselves up, to live in much fervency of prayer. What? will you say that the more holy men become, the more unlike the birds of the air in this respect they become? What He says respecting the birds of the air, He says to this end, that none of His servants should think that God has no thought of their wants, when they see Him so provide even for these inferior creatures. Neither is it not God that feeds those that earn their bread by their own labour; neither because God hath said, “Call upon me in the day of trouble, and I will deliver thee,” [Ps 50:15] ought the Apostle therefore not to have fled, but to have remained still to have been seized, that God might save him as He did the Three Children out of the midst of the fire. Should any object in this sort to the saints in their flight from persecution, they would answer that they ought not to tempt God, and that God, if He pleased, would so do to deliver them as He had done Daniel from the lions, Peter from prison, then when they could no longer help themselves; but that in having made flight possible to them, should they be saved by flight, it was by God that they were saved. In like manner, such of God’s servants as have strength to earn their food by the labour of their hands, would easily answer any who should object to them this out of the Gospel concerning the birds of the air, that they neither sow nor reap; and would say, If we by sickness or any other hindrance are not able to work, He will feed us as He feeds the birds, that work not. But when we can work, we ought not to tempt God, seeing that even this our ability is His gift; and that we live here we live of His goodness that has made us able to live; He feeds us by whom the birds of the air are fed; as He says, “Your heavenly Father feedeth them. Are not ye of much greater value?” Aug., Serm. in Mont., ii, 15: Ye are of more value, because a rational animal, such as man is, is higher in the scale of nature than an irrational, such as are the birds of the air. Aug., City of God, xi, 16: Indeed a higher price is often given for a horse than a slave, for a jewel than for a waiting maid, but this not from reasonable valuation, but from the need of the person requiring, or rather from his pleasure desiring it. Pseudo-Chrys.: For God created all animals for man, but man for himself; therefore by how much the more precious is the creation of man, so much the greater is God’s care for him. If then the birds without toiling find food, shall man not find, to whom God has given both knowledge of labour and hope of fruitfulness? Jerome: There be some who, seeking to go beyond the limits of their fathers, and to soar into the air, sink into the deep and are drowned. These will have the birds of the air to mean the Angels, and the other powers in the ministry of God, who without any care of their own are fed by God’s providence. But if this be indeed as they would have it, how follows it, said to men, “Are not ye of more worth than they?” It must be taken then in the plain sense; If birds that today are, and tomorrow are not, be nourished by God’s providence, without thought or toil of their own, how much more men to whom eternity is promised! Hilary: It may be said, that under the name of birds, He exhorts us by the example of the unclean spirits, to whom, without any trouble of their own in seeking and collecting it, provision of life is given by the power of the Eternal Wisdom. And to lead us to refer this to the unclean spirits, He suitably adds, “Are not ye of much more value than they?” Thus shewing the great interval between piety and wickedness. Gloss., non occ.: He teaches us not only by the instance of the birds, but adds a further proof, that to our being and life our own care is not enough, but Divine Providence therein works; saying, “Which of you by taking thought can add one cubit to his stature?” Pseudo-Chrys.: For it is God who day by day works the growth of your body, yourself not feeling it. If then the Providence of God works thus daily in your very body, how shall that same Providence withhold from working in necessaries of life? And if by taking thought you cannot add the smallest part to your body, how shall you by taking thought be altogether saved? Aug., Serm. in Mont., ii, 15: Or it may be connected with what follows it; as though He should say, It was not by our care that our body was brought to its present stature; so that we may know that if we desired to add one cubit to it, we should not be able. Leave then the care of clothing that body to Him who made it to grow to its present stature. Hilary: Otherwise; As by the example of the spirits He had fixed our faith in the supply of food for our lives, so now by a decision of common understanding He cuts off all anxiety about supply of clothing. Seeing that He it is who shall raise in one perfect man every various kind of body that ever drew breath, and is alone able to add one or two or three cubits to each man’s stature; surely in being anxious concerning clothing, that is, concerning the appearance of our bodies, we offer affront to Him who will add so much to each man’s stature as shall bring all to an equality. Aug., City of God, book xxii, ch. 15: But if Christ rose again with the same stature with which He died, it is impious to say that when the time of the resurrection of all shall come, there shall be added to His body a bigness that it had not at His own resurrection, (for He appeared to His disciples with that body in which He had been known among them,) such that He shall be equalled to the tallest among men. If again we say that all men’s bodies, whether tall or short, shall be alike brought to the size and stature of the Lord’s body, then much will perish from many bodies, though He has declared that “not a hair shall fall.” It remains therefore that each be raised in his own stature - that stature which he had in youth, if he died in old age; if in childhood that stature to which he would have attained had he lived. For the Apostle says not, ‘To the measure of the stature,’ but, “To the measure of the full age of Christ.” [Eph 4:13] For the bodies of the dead shall rise in youth and maturity to which we know that Christ attained. [ed. note: Hence the Roman Catholics teach that “men shall rise at a perfect age, which is thirty three;” vid. Bp. Doyle’s Christian Doctrine.]"
