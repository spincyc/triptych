text = "13. “But woe unto you, Scribes and Pharisees, hypocrites! for ye shut up the kingdom of heaven against men: for ye neither go in yourselves, neither suffer ye them that are entering to go in.” Origen: Christ is truly the Son of that God Who gave the Law; after the example of the blessings pronounced in the Law, did Himself pronounce the blessings of them that are saved; and also after the cursings of the Law, He now sets forth a woe against sinners; “Woe unto you, Scribes and Pharisees, hypocrites.” They who allow that it is compatible with goodness to utter these denunciations against sinners, should understand that the purpose of God is the same in the cursings of the Law. Both the cursing there and the woe here fall upon the sinner not from Him who denounces, but from themselves who commit the sins which are denounced, and worthily bring upon themselves the inflictions of God’s discipline, appointed for the turning of men to good. So a father rebuking a son utters words of cursing, but does not desire that be should become deserving of those curses, but rather that he should turn himself from them. He adds the cause of this woe, “Ye shut up the kingdom of heaven against men; for ye neither go in yourselves, nor suffer them that are entering to go in.” These two commandments are by nature inseparable; because not to suffer others to enter in, is of itself enough to keep the hinderer out. Pseudo-Chrys.: By “the kingdom of heaven” is meant the Scriptures, because in them the kingdom of heaven is lodged; the understanding of these is the door. Or “the kingdom of heaven” is the blessedness of heaven, and the door thereof Christ, by Whom men enter in. The door-keepers are the Priests, to whom is committed the word of teaching or interpreting Scripture, by which the door of truth is opened to men. The opening of this door is right interpretation. And observe that He said not, “Woe unto you,” for ye open, but, “for ye shut up;” the Scriptures then are not shut up, though they are obscure. Origen: The Pharisees and the Scribes then would neither enter in, nor hear Him who said, “By me if any man enter in he shall be saved;” [John 10:9] nor would they suffer those to enter in, who were able to have believed through the things which had been spoken before by the Law and the Prophets concerning Christ, but shut up the door with every kind of device to deter men from entering. Also they detracted from His teaching, denied all prophecy concerning Him, and blasphemed every miracle as deceitful, or wrought by the Devil. All who in their evil conversation set an example of sinning to the people, and who commit injustice, offending the weak, seem to shut up the kingdom of heaven before men. And this sin is found among the people, and chiefly among the doctors, when they teach men what the Gospel righteousness requires of them, but do not what they teach. But those who both teach and live well open to men the kingdom of heaven, and both enter in themselves, and invite others to enter in. Many also will not suffer those who are willing to enter into the kingdom of heaven, when they without reason excommunicate out of jealousy others who are better than themselves; thus they refuse them entrance, but these of sober spirit, overcoming by their patience this tyranny, although forbidden, yet enter in and inherit the kingdom. Also they who with much rashness have set themselves to the profession of teaching before they have learned, and following Jewish fables, detract from those who search out the higher things of Scripture; these do, as far as in them lies, shut out men from the kingdom of heaven."
