text = "3. When Herod the king had heard these things, he was troubled, and all Jerusalem with him. 4. And when he had gathered all the Chief Priests and Scribes of the people together, he demanded of them where Christ should be born. 5. And they said unto him, “In Bethlehem of Judaea: for thus it is written by the prophet, 6. ‘And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel.’ ” Aug.: As the Magi seek a Redeemer, so Herod fears a successor. Gloss. ord.: “The King,” he is called, though in comparison with him whom they are seeking he is an alien and a foreigner. Pseudo-Chrys.: Herod “was troubled” when he heard that a King was born of Jewish lineage, lest, himself being an Idumaean, the kingdom should return again to native princes, and himself be expelled, and his seed after him. Great station is ever obnoxious to great fears; as the boughs of trees planted in high ground move when never so little wind blows, so high men are troubled with little rumours; while the lowly, like trees in the valley, remain at peace. Aug., Serm. 200, 2: If His birth as an infant makes proud kings tremble, what will His tribunal as a Judge do? Let princes fear Him sitting at the right hand of His Father, whom this impious king feared while He hanged yet on His mother’s breast. Leo: Thou art troubled, Herod, without cause. Thy nature cannot contain Christ, nor is the Lord of the world content with the narrow bounds of thy dominion. He, whom thou wouldest not should reign in Judaea, reigns every where. Gloss. ord.: Perhaps he was troubled not on his own account, but for fear of the displeasure of the Romans. They would not allow the title of King or of God to any without their permission. Greg., Hom. in Evan., 1, 10: At the birth of a King of Heaven, a king of earth is troubled; surely, earthly greatness is confounded, when heavenly greatness shews itself. Leo, Serm. 36, 2: Herod represents the Devil; who as he then instigated him, so now he unweariedly imitates him. For he is grieved by the calling of the Gentiles, and by the daily ruin of his power. Pseudo-Chrys.: Both have their own causes of jealousy, both fear a successor in their kingdom; Herod an earthly successor, the Devil a spiritual. Even Jerusalem is troubled, which should have rejoiced at that news, when a Jewish King was said to be risen up. But they were troubled, for the wicked cannot rejoice at the coming of the good. Or perhaps it was in fear that Herod should wreak his wrath against a Jewish King on his race. Gloss. ord.: “Jerusalem was troubled with him,” as willing to favour him whom it feared; the vulgar always pay undue honour to one who tyrannizes over it. Observe the diligence of his enquiry. If he should find him, he would do to him as he shewed afterwards his disposition; if he should not, he would at least be excused to the Romans. Remig.: They are called Scribes, not from the employment of writing, but from the interpretation of the Scriptures, for they were doctors of the law. Observe, he does not enquire where Christ is born, but where He should be born; the subtle purpose of this was to see if they would shew pleasure at the birth of their King. He calls Him Christ, because he knew that the King of the Jews was anointed. Pseudo-Chrys.: Why does Herod make this enquiry, seeing he believed not the Scriptures? Or if he did believe, how could he hope to be able to kill Him whom the Scriptures declared should be King? The Devil instigated Herod; who believed that Scripture lies not. Such is the faith of devils, who are not permitted to have perfect belief, even of that which they do believe. That they do believe, it is the force of truth constrains them; that they do not believe, it is that they are blinded by the enemy. If they had perfect faith, they would live as about to depart from this world soon, not as to possess it for ever. Leo, Serm. 31, 2: The Magi, judging as men, sought in the royal city for Him, whom they had been told was born a King. But He who took the form of a servant, and came not to judge but to be judged, chose Bethlehem for His birth, Jerusalem for His death. Theodotus, Serm. 1, ap. Conc. Eph.: Had He chosen the mighty city of Rome, it might have been thought that this change of the world had been wrought by the might of her citizens; had He been the son of the emperor, his power might have aided Him. But what was His choice? All that was mean, all that was in low esteem, that in this transformation of the world, divinity might at once be recognized. Therefore He chose a poor woman for His mother, a poor country for His native country; He has no money, and this stable is His cradle. Gregory, Hom. in Evan., 8, 1: Rightly is He born in Bethlehem, which signifies the house of bread, who said, “I am the living bread, who came down from heaven.” Pseudo-Chrys.: When they should have kept secret the mystery of the King appointed of God, especially before a foreign king, straightway they became not preachers of the word of God, but revealers of His mystery. And they not only display the mystery, but cite the passage of the prophet, viz. Micah. Gloss. ord.: He quotes this prophecy as they quote who give the sense and not the words. Jerome, Epist. 57: The Jews are here blamed for ignorance; for whereas the prophecy says, “Thou Bethlehem Ephrata;” they said, ‘Bethlehem in the land of Judah.’ Pseudo-Chrys.: By cutting short the prophecy, they became the cause of the murder of the Innocents. For the prophecy proceeds, “From thee shall go forth a King who shall feed My people Israel, and His day shall be from everlasting.” Had they cited the whole prophecy, Herod would not have raged so madly, considering that it could not be an earthly King whose days were spoken of as “from everlasting.” Jerome, in Mich. v. 2: The following is the sense of the prophecy. Thou, Bethlehem, of the land of Judah, or Ephrata, (which is added to distinguish it from another Bethlehem in Galilee,) though thou art a small village among the thousand cities of Judah, yet out of thee shall be born Christ, who shall be the Ruler of Israel, who according to the flesh is of the seed of David, but was born of Me before the worlds; and therefore it is written, “His goings forth are of old. In the beginning was the Word.” Gloss: This latter half of the prophecy the Jews dropped; and other parts they altered, either through ignorance, (as was said above,) or for perspicuity, that Herod who was a foreigner might better understand the prophecy; thus for “Ephrata,” they said, “land of Judah;” and for “little among the thousands of Judah,” which expresses its smallness contrasted with the multitude of the people, they said, “not the least among the princes,” willing to shew the high dignity that would come from the birth of the Prince. As if they had said, “Thou art great among cities from which princes have come.” Remig.: Or the sense is; though little among cities that have dominion, yet art thou not the least, for “out of thee shall come the Ruler, who shall rule My people Israel;” this Ruler is Christ, who rules and guides His faithful people. Chrys.: Observe the exactness of the prophecy; it is not He shall be in Bethlehem, but shall come out of Bethlehem; shewing that He should be only born there. What reason is there for applying this to Zorobabel, as some do? For his goings forth were not from everlasting; nor did he go forth from Bethlehem, but was born in Babylonia. The expression, “art not the least,” is a further proof, for none but Christ could make the town where He was born illustrious. And after that birth, there came men from the utmost ends of the earth to see the stable and manger. He calls Him not ‘the Son of God,’ but “the Ruler who shall govern My people Israel;” for thus He ought to condescend at the first, that they should not be scandalized, but should preach such things as more pertained to salvation, that they might be gained. “Who shall rule My people Israel,” is said mystically, for those of the Jews who believed; for if Christ ruled not all the Jews, theirs is the blame. Meanwhile he is silent respecting the Gentiles, that the Jews might not be scandalized. Mark this wonderful ordinance; Jews and Magi mutually instruct each other; the Jews learn of the Magi that a star had proclaimed Christ in the east, the Magi from the Jews that the Prophets had spoken of Him of old. Thus confirmed by a twofold testimony, they would look with more ardent faith for One whom the brightness of the star and the voice of the Prophets equally proclaimed. Aug., Serm. 374. 2, 373. 4: The star that guided the Magi to the spot where was the Infant God with His Virgin Mother, might have conducted them straight to the town; but it vanished, and shewed not itself again to them till the Jews themselves had told them “the place where Christ should be born;” Bethlehem of Judaea. Like in this to those who built the ark for Noah, providing others with a refuge, themselves perished in the flood; or like to the stones by the road that shew the miles, but themselves are not able to move. The enquirers heard and departed; the teachers spake and remained still. Even now the Jews shew us something similar; for some Pagans, when clear passages of Scripture are shewn them, which prophesy of Christ, suspecting them to be forged by the Christians, have recourse to Jewish copies. Thus they leave the Jews to read unprofitably, and go on themselves to believe faithfully."
