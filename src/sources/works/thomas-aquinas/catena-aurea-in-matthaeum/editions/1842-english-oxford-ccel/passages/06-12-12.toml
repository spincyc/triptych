text = "12. “And forgive us our debts, as we forgive our debtors.” Cyprian, Tr. vii, 15: After supply of food, next pardon of sin is asked for, that he who is fed of God may live in God, and not only the present and passing life be provided for, but the eternal also; whereunto we may come, if we receive the pardon of our sins, to which the Lord gives the name of debts, as he speaks further on, “I forgave thee all that debt, because thou desiredst me.” [Matt 18:32] How well is it for our need, how provident and saving a thing, to be reminded that we are sinners compelled to make petition for our offences, so that in claiming God’s indulgence, the mind is recalled to a recollection of its guilt. That no man may plume himself with the pretence of innocence, and perish more wretchedly through self-exaltation, he is instructed that he commits sin every day by being commanded to pray for his sins. Aug., De Don. Pers., 5: With this weapon the Pelagian heretics received their deathblow, who dare to say that a righteous man is free altogether from sin in this life, and that of such is at this present time composed a Church, “having neither spot nor wrinkle.” Chrys.: That this prayer is meant for the faithful, both the laws of the Church teach, and the beginning of the prayer which instructs us to call God Father. In thus bidding the faithful pray for forgiveness of sin, He shews that even after baptism sin can be remitted (against the Novatians.) Cyprian: He then who taught us to pray for our sins, has promised us that His fatherly mercy and pardon shall ensue. But He has added a rule besides, binding us under the fixed condition and responsibility, that we are to ask for our sins to be forgiven in such sort as we forgive them that are in debt to us. Greg., Mor., x, 15: That good which in our penitence we ask of God, we should first turn and bestow on our neighbour. Aug., Serm. in Mont., ii, 8: This is not said of debts of money only, but of all things in which any sins against us, and among these also of money, because that he sins against you, who does not return money due to you, when he has whence he can return it. Unless you forgive this sin you cannot say, “Forgive us our debts, as we forgive our debtors.” Pseudo-Chrys.: With what hope then does he pray, who cherishes hatred against another by whom he has been wronged? As he prays with a falsehood on his lips, when he says, I forgive, and does not forgive, so he asks indulgence of God, but no indulgence is granted him. There are many who, being unwilling to forgive those that trespass against them, will not use this prayer. How foolish! First, because he who does not pray in the manner Christ taught, is not Christ’s disciple; and secondly, because the Father does not readily hear any prayer which the Son has not dictated; for the Father knows the intention and the words of the Son, nor will He entertain such petitions as human presumption has suggested, but only those which Christ’s wisdom has set forth. Aug., Enchir., 73: Forasmuch as this so great goodness, namely, to forgive debts, and to love our enemies, cannot be possessed by so great a number as we suppose to be heard in the use of this prayer; without doubt the terms of this stipulation are fulfilled; though one have not attained to such proficiency as to love his enemy; yet if when he is requested by one, who has trespassed against him, that he would forgive him, he do forgive him from his heart; for he himself desires to be forgiven then at least when he asks forgiveness. And if one have been moved by a sense of his sin to ask forgiveness of him against whom he has sinned, he is no more to be thought on as an enemy, that there should be any thing hard in loving him, as there was when he was in active enmity."
