  { line = 16, text = "[ed. note: This passage is from a work commonly ascribed to Hilary the Deacon. The Fathers bear out its doctrine; e.g. “Since the flesh is not holy in itself, therefore it was sanctified even in Christ, the Word which dwelt in it, through the Holy Ghost, sanctifying His own Temple, and changing it into the energy of His own Nature. For therefore is Christ’s Body understood to be both holy and hallowing, as being made a Temple of the Word united to it bodily, as Paul says.” Cyril Alex. lib. v. in Joann. p. 992." },
  { line = 17, text = "In like manner, Gregory of Nazianzus speaks of “The Father of the True and really Anointed (Christ), whom He has anointed with the oil of gladness above His fellows, anointing the manhood with the Godhead, so as to make both one.” Orat. 5. fin]" },
  { line = 18, text = "Because the impious craft of the Jews denied that Jesus was born of the seed of David, he adds, “The son of David, the son of Abraham.”" },
  { line = 19, text = "Chrys.: But why would it not have been enough to name one of them, David alone, or Abraham alone? Because the promise had been made to both of Christ to be born of their seed. To Abraham, “And in thy seed shall all the nations of the earth be blessed.” [Gen 22:18] To David, “Of the fruit of thy body will I set upon thy seat.” [Ps 132:11]" },
  { line = 20, text = "He therefore calls Christ the Son of both, to shew that in Him was fulfilled the promise to both. Also because Christ was to have three dignities; King, Prophet, Priest; but Abraham was prophet and priest; priest, as God says to him in Genesis, “Take an heifer;” [Gen 15:9] Prophet, as the Lord said to Abimelech concerning him, “He is a prophet, and shall pray for thee.” [Gen 20:7] David was king and prophet, but not priest." },
  { line = 21, text = "Thus He is expressly called the son of both, that the threefold dignity of His forefathers might be recognized by hereditary right in Christ." },
  { line = 22, text = "Ambrose, in Luc. iii: He therefore names specially two authors of His birth - one who received the promise concerning the kindreds of the people, the other who obtained the oracle concerning the generation of Christ; and though he is later in order of succession is yet first named, inasmuch as it is greater to have received the promise concerning Christ than concerning the Church, which is through Christ; for greater is He who saves than that which is saved." },
  { line = 23, text = "Jerome: The order of the names is inverted, but of necessity; for had he written Abraham first, and David afterwards, he would have to repeat Abraham again to preserve the series of the genealogy." },
  { line = 24, text = "Pseudo-Chrys.: Another reason is that royal dignity is above natural, though Abraham was first in time, yet David is honour." },
  { line = 25, text = "Gloss.: But since from this title it appears that the whole book is concerning Jesus Christ, it is necessary first to know what we must think concerning Him; for so shall be better explained what this book relates of Him." },
  { line = 26, text = "Aug., de Haer, et 10: Cerinthus then and Ebion made Jesus Christ only man; Paul of Samosata, following them, asserted Christ not to have had an existence from eternity, but to have begun to be from His birth of the Virgin Mary; he also thought Him nothing more than man. This heresy was afterwards confirmed by Photinus." },
  { line = 27, text = "Pseudo-Athan., Vigil. Tapsens. (Athan. Ed. Ben., vol ii, p. 646): The Apostle John, seeing long before by the Holy Spirit this man’s madness, rouses him from his deep sleep of error by the preaching of his voice, saying, “In the beginning was the Word.” [John 1:1]" },
  { line = 28, text = "He therefore, who in the beginning was with God, could not in this last time take the beginning of His being from man. He says further, (let Photinus hear his words,) “Father, glorify Me with that glory which I had with Thee before the world was.” [John 17:5]" },
  { line = 29, text = "Aug., de Haeres. 19: The error of Nestorius was, that he taught that a man only was born of the Blessed Virgin Mary, whom the Word of God received not into Unity of person and inseparable fellowship; a doctrine which Catholic ears could not endure." },
  { line = 30, text = "Cyril of Alexandria, Ep. i. ad Monachos Egypti.: Saith the Apostle of the Only-begotten, “Who being in the form of God, thought it no robbery to be equal with God.” [Phil 2:6]" },
  { line = 31, text = "Who then is this who is in the form of God? or how emptied He Himself, and humbled Himself to the likeness of man? If the abovementioned heretics dividing Christ into two parts, i.e. the Man and the Word, affirm that it was the Man that was emptied of glory, they must first shew what form and equality with the Father are understood to be, and did exist, which might suffer any manner of emptying." },
  { line = 32, text = "But there is no creature, in its own proper nature, equal with the Father; how then can any creature be said to be emptied? or from what eminence to descend to become man? Or how can he be understood to have taken upon Him, as though He had not at first, the form of a servant?" },
  { line = 33, text = "But, they say, the Word being equal with the Father dwelt in Man born of a woman, and this is the emptying. I hear the Son truly saying to the Holy Apostles, “If any man love Me, he will keep My saying, and My Father will love him, and We will come unto him, and make Our abode with him.” [John 14:23]" },
  { line = 34, text = "Hear how He saith that He and the Father will dwell in them that love Him. Do you then suppose that we shall grant that He is there emptied of His glory, and has taken upon Him the form of a servant, when He makes His abode in the hearts of them that love Him? Or the Holy Spirit, does He fulfil an assumption of human flesh when He dwells in our hearts?" },
  { line = 35, text = "Isidore, Epist. lib. iv. 166: But not to mention all arguments, let us bring forward that one to which all arguments point, that, for one who was God to assume a lowly guise both has an obvious use, and is an adaptation and in nothing contradicts the course of nature. But for one who is man to speak things divine and supernatural is the highest presumption; for though a king may humble himself a common soldier may not take on him the state of an emperor. So, if He were God made man, all lowly things have place; but if mere man, high things have none." },
  { line = 36, text = "Aug., de Haeres. 41: Sabellius they say was a disciple of Noctus, who taught that the same Christ was one and the same Father and Holy Spirit." },
  { line = 37, text = "Pseudo-Athan., Vigil. Tapsens. (ibid. p. 644): The audaciousness of this most insane error I will curb by the authority of the heavenly testimonies, and demonstrate the distinct personality of the proper substance of the Son. I shall not produce things which are liable to be explained away as agreeable to the assumption of human nature; but shall offer such passages as all will allow to be decisive in proof of His divine nature." },
  { line = 38, text = "In Genesis we find God saying, “Let Us make man in Our own Image.” By this plural number shewing, that there was some other person to whom He spoke. Had He been one, He would have been said to have made Him in His own Image, but there is another; and He is said to have made man in the Image of that other." },
  { line = 39, text = "Gloss.: Other denied the reality of Christ’s human nature. Valentinus said that Christ sent from the Father, carried about a spiritual or celestial body, and took nothing of the Virgin, but passed through her as through a channel, taking nothing of her flesh. But we do not therefore believe Him to have been born of the Virgin, because by no other means He could have truly lived in the flesh, and appeared among men; but because it is so written in the Scripture, which if we believe not we cannot either be Christians, or be saved." },
  { line = 40, text = "But even a body taken of spiritual, or ethereal, or clayey substance, had He willed to change into the true and very quality of human flesh, who will deny His power to do this? The Manichaeans said that the Lord Jesus Christ was a phantasm, and could not be born of the womb of a woman. But if the body of Christ was a phantasm, He was a deceiver, and if a deceiver, then He was not the truth. But Christ is the Truth; therefore His Body was not a phantasm." },
  { line = 41, text = "Gloss.: And as the opening both of this Gospel, and of that according to Luke, manifestly proves Christ’s birth of a woman, and hence His real humanity, they reject the beginning of both these Gospels." },
  { line = 42, text = "Aug., cont. Faust, ii, 1: Faustus affirms, that “the Gospel both begins, and begins to be so called, from the preaching of Christ, in which He no where affirms Himself to have been born of men. [ed. note: The Ebionites, as well as the Manichees, rejected the beginning of St. Matthew, vid. Epiphan. II arr. xxx. 23. And the Marcionites the beginning of St. Luke. Epiph. Haer. xlii, 11. But what exact portion they rejected is doubtful.]" },
  { line = 43, text = "Nay, so far is this genealogy from being part of the Gospel, that the writer does not venture so to entitle it; beginning, ‘The book of the generation,’ not ‘The book of the Gospel.’ Mark again, who cared not to write of the generation, but only of the preaching of the Son of God, which is properly The Gospel, begins thus accordingly, 'The Gospel of Jesus Christ the Son of God.' Thus then, all that we read in Matthew before the words, 'Jesus began to preach the Gospel of the kingdom,' [Matt 4:17] is a part of the genealogy, not of the Gospel. I therefore betook myself to Mark and John, with whose prefaces I had good reason to be satisfied, as they introduce neither David, nor Mary, nor Joseph.”" },
  { line = 44, text = "To which Augustine replies, What will he say then to the Apostle’s words, “Remember the resurrection of Jesus Christ of the seed of David according to my Gospel.” [2 Tim 2:8] But the Gospel of the Apostle Paul was likewise that of the other Apostles, and of all the faithful, as he says, “Whether I, or they, thus have we preached the Gospel.”" },
  { line = 45, text = "Aug., de Haer., 49: The Arians will not have the Father, Son, and Holy Spirit, to be of one and the same substance, nature, and existence; but that the Son is a creature of the Father, and Holy Spirit a creature of a creature, i.e. created by the Son; further, they think that Christ took the flesh without a soul." },
  { line = 46, text = "But John declares the Son to be not only God, but even of the same substance as the Father; [margin note: ref Id. de Trin. i. 6] for when he had said, “The Word was God,” he added, “all things were made by Him;” whence it is clear that He was not made by Whom all things were made; and if not made, then not created; and therefore of one substance with the Father, for all that is not of one substance with the Father is creature." },
  { line = 47, text = "I know not what benefit the person of the Mediator has conferred upon us, if He redeemed not our better part, but took upon Him our flesh only, which without the soul cannot have consciousness of the benefit. But if Christ came to save that which had perished, the whole man had perished, and therefore needs a Saviour; Christ then in coming saves the whole man, taking on Him both soul and body." },
  { line = 48, text = "How too do they answer innumerable objections from the Gospel Scriptures, in which the Lord speaks so many things manifestly contrary to them? as is that, “My soul is sorrowful even unto death,” [Matt 26:38] and, “I have power to lay down My life;” [John 10:18] and many more things of the like kind." },
  { line = 49, text = "Should they say that He spoke thus in parables, we have at hand proofs from the Evangelists themselves, who in relating His actions, bear witness as to the reality of His body, so of His soul, by mention of passions which cannot be without a soul; as when they say, “Jesus wondered, was angry,” and others of like kind." },
  { line = 50, text = "The Apollinarians also as the Arians affirmed that Christ had taken the human flesh without the soul [margin note: Id. de Haeres. 55]. But overthrown on this point by the weight of Scripture proof, they then said that part which is the rational soul of man was wanting to the soul of Christ, and that its place was filled by the Word itself." },
  { line = 51, text = "But if it be so, then we must believe that the Word of God took on Him the nature of some brute with a human shape and appearance. But even concerning the nature of Christ’s body, there are some who have so far swerved from the right faith, as to say, that the flesh and the Word were of one and the same substance, most perversely insisting on that expression, The Word was made flesh; which they interpret that some portion of the Word was changed into flesh, not that He took to Him flesh of the flesh of the Virgin." },
  { line = 52, text = "[ed. note: Some of the Apollinarians thus hold. vid. Nyssen. vol. ii, p. 694. A.Theodor. Eranist. p. 174. ed. Schulz. The same doctrine was afterwards ascribed to the Eutychians, vid. Vigil. Taps. in Eutych. iv. Theod. Haer. iv. 13]" },
  { line = 53, text = "Cyril, Ep. ad Joan. Antioch. tom. 6, Ep. 107: We account those persons mad who have suspected that so much as the shadow of change could take place in the nature of the Divine Word; it abides what it ever was, neither is nor can be changed." },
  { line = 54, text = "Leo, Epist. 59, ad Const.: We do not speak of Christ as man in such a sort as to allow that any thing was wanting to Him, which it is certain pertains to human nature, whether soul, or rational mind, or flesh, and flesh such as was taken of the Woman, not gained by a change or conversion of the Word into flesh." },
  { line = 55, text = "These three several errors, that thrice false heresy of the Apollinarists has brought forward. Eutyches also chose out this third dogma of Apollinaris, which denying the verity of the human body and soul, maintained that our Lord Jesus Christ was wholly and entirely of one nature, as though the Divine Word had changed itself into flesh and soul, and as though the conception, birth, growth, and such like, had been undergone by that Divine Essence, which was incapable of any such changes with the very and true flesh; for such as is the nature of the Only-begotten, such is the nature of the Father, and such is the nature of the Holy Ghost, both impassible and eternal." },
  { line = 56, text = "But if to avoid being driven to the conclusion that the Godhead could feel suffering and death, he departs from the corruption of Apollinaris, and should still dare to affirm the nature of the incarnate Word, that is of the Word and the flesh, to be the same, he clearly falls into the insane notions of Manichaeus and Marcion, and believes that the Lord Jesus Christ did all His actions with a false appearance, that His body was not a human body, but a phantasm, which imposed on the eyes of the beholders." },
  { line = 57, text = "But what Eutyches ventured [margin note: Id. Ep. 35 ad Julian] to pronounce as an episcopal decision, that in Christ before His incarnation were two natures, but after His incarnation only one, it behoved that he should have been urgently pressed to give the reason of this his belief." },
  { line = 58, text = "I suppose that in using such language he supposed the soul which the Saviour took, to have had its abode in heaven before it was born of the Virgin Mary [ed. note, e: This opinion, which involves Nestorianism, the opposite error to Eutychianism or Monophysitism, is imputed to Eutyches by Flavian, ap. Leon. Ep. xxii. 3. Ephraem, Antioch, ap Phot. p. 805. Leont. de Sectis 7 init]." },
  { line = 59, text = "This Catholic hearts and ears endure not, for that the Lord when He came down from heaven shewed nothing of the condition of human nature, nor did He take on Him any soul that had existed before, nor any flesh that was not taken of the flesh of His mother. Thus what was justly condemned in Origen [ed. note, f: Vid. Origen in Joan. t. i. n. 37. t. xx. n. 17. Patriarch. ii. 6. n. 4. ix. Cels. i. 32, 33], must needs be rebuked in Eutyches, to wit, that our souls before they were placed in our bodies had actions not only wonderful but various." },
  { line = 60, text = "Remig: These heresies therefore the Apostles overthrow in the opening of their Gospels, as Matthew in relating how He derived His descent from the kings of the Jews proves Him to have been truly man and to have had true flesh." },
  { line = 61, text = "Likewise Luke, when he describes the priestly stock and person; Mark when he says, “The beginning of the Gospel of Jesus Christ the Son of God;” and John when he says, “In the beginning was the Word;” both shew Him to have been before all ages God, with God the Father." },
]
