text = "22. And while they abode in Galilee, Jesus said unto them, “The Son of man shall be betrayed into the hands of men. 23. And they shall kill him, and the third day he shall be raised again.” And they were exceeding sorry. Remig.: The Lord often foretold to His disciples the mysteries of His passion, in order that when they come to pass, they might be the lighter to them from having been known beforehand. Origen: This seems to be so like a warning He had given above, that a man might easily say that the Lord now repeated what He had said before; yet is it not so; He had not before said that He must be betrayed, but we hear now not only that He must be betrayed, but that He must be “betrayed into the hands of men.” The Son of Man indeed was “delivered up” by God the Father according to the Apostle, [Rom 8:32] but different powers gave him up into the hands of men. Jerome: Thus does He ever mix the joyful and the grievous; if it grieves them that He is to be put to death, they ought to be gladdened when they hear, “And shall rise again, the third day.” Chrys.: For this is no long time that He speaks of continuing in death, when He says that He shall rise again on the third day. Origen: By this announcement of the Lord the disciples were made very sorrowful, not attending to that He said, “And shall rise again the third day,” nor considering what He must be to whom the space of three days was enough to destroy death. Jerome: That they were thus made exceeding sorrowful, came not of their lack of faith; but out of their love of their Master they could not endure to hear of any hurt or indignity for Him."
