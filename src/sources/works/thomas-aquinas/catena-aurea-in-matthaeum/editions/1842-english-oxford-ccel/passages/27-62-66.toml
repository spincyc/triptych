text = "62. Now the next day, that followed the day of the preparation, the Chief Priests and Pharisees came together unto Pilate, 63. Saying, “Sir, we remember that that deceiver said, while he was yet alive, After three days I will rise again. 64. Command therefore that the sepulchre be made sure until the third day, lest his disciples come by night, and steal him away, and say unto the people, He is risen from the dead: so the last error shall be worse than the first. 65 Pilate said unto them, “Ye have a watch: go your way, make it as sure as ye can.” 66 So they went and made the sepulchre sure, sealing the stone, and setting a watch. Jerome: It was not enough for the Chief Priests to have crucified the Lord the Saviour, if they did not guard the sepulchre, and do their utmost to lay hands on Him as He rose from the dead. Raban.: By the Parasceve is meant ‘preparation;’ and they gave this name to the sixth day of the week, on which they made ready the things needed for the Sabbath, as was commanded respecting the manna, “On the sixth day they gathered twice as much.” [Ex 16:22] Because on the sixth day man was made, and on the seventh God rested; therefore on the sixth day Jesus died for man, and rested the Sabbath day in the tomb. The Chief Priests although in putting the Lord to death they had committed a heinous crime, yet were they not satisfied unless even after His death they carried on the venom of their malice once begun, traducing His character, and calling one, whom they knew to be guileless, “a deceiver.” [John 11:49] But as Caiaphas prophesied without knowing it, that “it is expedient that one man should die for the people,” so now, Christ was a deceiver [marg. note: seductor], not from truth into error, but leading men from error to truth, from vices to virtue, from death to life. Remig.: They say that He had declared, “After three days I will rise again,” in consequence of that He said above, “As Jonas was three days and three nights in the whale’s belly,” &c. [Matt 12:40] But let us see in what way He can be said to have risen again after three days. Some would have the three hours of darkness understood as one night, and the light succeeding the darkness as a day, but these do not know the force of figurative language. The sixth day of the week on which He suffered comprehended the foregoing night; then follows the night of the Sabbath with its own day, and the night of the Lord’s day includes also its own day; and hence it is true that He rose again after three days. Aug., Aug. in Serm., non occ.: He rose again after three days, to signify the consent of the whole Trinity in the passion of the Son; the three days’ space is read figuratively, because the Trinity which in the beginning made man, the same in the end restores man by the passion of Christ. Raban.: “Command therefore that the sepulchre be made sure until the third day.” For Christ’s disciples were spiritually thieves; stealing from the unthankful Jews the writings of the New and Old Testament, they bestowed them to be used by the Church; and while they slept, that is, while the Jews were sunk in the lethargy of unbelief, they carried off the promised Saviour, and gave Him to be believed on by the Gentiles. Hilary: Their fear lest the body should be stolen, the setting a watch on the tomb, and sealing it, are marks of folly and unbelief, that they should have sought to seal up the tomb of One at whose bidding they had seen a dead man raised from the tomb. Raban.: When they say, “And the last error will be worse than the first,” they utter a truth unwittingly, for their contempt of penitence was worse for the Jews than was their error of ignorance. Chrys., Hom. lxxxix: Observe how against their will they concert to demonstrate the truth, for by their precautions irrefragable demonstration of the resurrection was attained. The sepulchre was watched, and so no fraud could have been practised; and if there was no collusion, it is certain that the Lord rose again. Raban.: Pilate’s answer to their request is as much as to say, Be it enough for you that ye have conspired the death of an innocent man, henceforth let your error remain with you. Chrys.: Pilate will not suffer that the soldiers alone should seal. But as though he had learnt the truth concerning Christ, he was no longer willing to be partner in their acts, and says, Seal it as ye will yourselves, that ye may not be able to accuse others. For had the soldiers alone sealed, they might have said that the soldiers had suffered the disciples to steal the body, and so given the disciples a handle to forge a tale concerning the resurrection; but this could they not say now, when they themselves had sealed the sepulchre."
