  { line = 6093, text = "Aug.: Or, “At midnight,” that is, when none knew or looked for it." },
  { line = 6094, text = "Jerome: Suddenly thus, as on a stormy night, and when all think themselves secure, at the hour when sleep is the deepest, the coming of Christ shall be proclaimed by the shout of Angels, and the trumpets of the Powers that go before Him. This is meant when it says, “Lo, the bridegroom cometh, go ye out to meet him.”" },
  { line = 6095, text = "Hilary: At the trumpet signal they go forth to meet the bridegroom alone, for then shall the two be one, that is, the flesh and God, when the lowliness of the flesh shall be transformed into spiritual glory." },
  { line = 6096, text = "Aug.: Or, that the virgins go forth to meet the bridegroom alone, I think is to be understood that the virgins themselves constitute her who is called the bride - as we speak of the Christians flocking to the Church as children running to their mother, and yet this same mother consists only of the children who are gathered together. For now the Church is betrothed, and is to be led forth as a virgin to the marriage, which takes place then when all her mortal part having past away, she maybe held in an eternal union." },
  { line = 6097, text = "Origen: Or, “At midnight,” that is, at the time of their most abandoned carelessness, “there was a great cry,” of the Angels, I suppose, desiring to arouse all men, those ministering spirits crying within in the senses of all that sleep, “Behold, the bridegroom cometh, go ye out to meet him.” All heard this summons, and arose, but all were not able to trim their lamps fitly. The lamps of the senses are trimmed by evangelical and right use of them; and they that use their senses amiss have their lamps untrimmed." },
  { line = 6098, text = "Greg.: Or, “All the virgins arose,” that is, both elect and reprobate are roused from the sleep of death; they “trimmed their lamps,” that is, they reckon up to themselves their works for which they look to receive eternal blessedness." },
  { line = 6099, text = "Aug.: They “trimmed their lamps,” that is, prepared to give an account of their deeds." },
  { line = 6100, text = "Hilary: Or, the trimming their lamps is the return of their souls into their bodies, and their light is the consciousness of good works that shines forth, which is contained in the vessels of the body." },
  { line = 6101, text = "Greg.: The lamps of the foolish virgins go out, because the works which appeared outwardly to men to be bright, are dimmed within at the coming of the Judge. That they then beg oil of the wise virgins, what is it but that at the coming of the Judge, when they find themselves empty within, they seek for witness from without? As though deceived by their own self-confidence, they say to their neighbours, “Whereas ye see us rejected as living without works, do ye witness to our works that ye have seen." },
  { line = 6102, text = "Aug.: From habit, the mind seeks that which uses to give it pleasure. And these now seek from men, who see not the heart, witness to God, who sees the heart. But their lamps go out, because those, whose good works rest upon the testimony of others, when that is withdrawn, sink into nothing." },
  { line = 6103, text = "Jerome: Or, These virgins who complain that their lamps are gone out, shew that they are partially alight, yet have they not an unfailing light, nor enduring works. Whoso then has a virgin soul, and is a lover of chastity, ought not to rest content with such virtues as quickly fade, and are withered away when the heat comes upon them, but should follow after perfect virtues, that he may have an enduring light." },
  { line = 6104, text = "Chrys.: Or otherwise ; These virgins were foolish, not only because they departed hence, lacking store of mercy, but because they deemed to receive it from those of whom they importunately begged it. For though nothing could be more merciful than those wise virgins, who for this very mercifulness were approved, yet would they not grant the prayer of the foolish virgins. But the wise answered, saying, “Not so, lest there be not enough for us and you;” hence we learn that none of us shall be able in that day to stand forth as patron [marg. note: προστηναὶ] of those who are betrayed by their own works, not because he will not, but because he cannot." },
  { line = 6105, text = "Jerome: For these wise virgins do not answer thus out of covetousness, but out of fear. Wherefore, each man shall receive the recompense of his own works, and the virtues of one cannot atone for the vices of another in the day of judgment. The wise admonish them not to go to meet the bridegroom without oil, “Go ye rather to them that sell, and buy for yourselves.”" },
  { line = 6106, text = "Hilary: They that sell are the poor, who, needing the alms of the faithful, made them that recompense which they desire, selling in return for the relief afforded to their wants, a consciousness of good works. This is the abundant fuel of an undying light which may be bought and stored up for the fruits of mercy." },
  { line = 6107, text = "Chrys.: You see then how great merchants the poor are to us; but the poor are not there, but here, and therefore we must store up oil here, that we may have it to use there when occasion shall require." },
  { line = 6108, text = "Jerome: And this oil is sold, and at a high cost, nor is it to be got without much toil; so that we understand it not of alms only, but of all virtues and counsels of the teachers." },
  { line = 6109, text = "Origen: Otherwise; Notwithstanding they were foolish, they yet understood that they must have light to go and meet the bridegroom, that all the lights of their senses might be burning. This also they discerned, that because they had little of the spiritual oil, their lamps would burn dim as darkness drew on. But the wise send the foolish to those that sell, seeing that they had not stored up so much oil, that is, word of doctrine, as would suffice both for themselves to live by, and to teach others, “Go ye rather to them that sell,” i.e. to the doctors, “and buy,” i.e. take of them; the price is perseverance, the love of learning, industry, and toil of all who are willing to learn." },
  { line = 6110, text = "Aug.: Or we may suppose it not meant as advice what they should do, but as an indirect allusion to their fault. For flatterers sell oil, who by praising things false, and things unknown, lead souls astray, recommending to them, as foolish, empty joys, and receiving in return some temporal benefit." },
  { line = 6111, text = "“Go ye rather to them that sell, and buy for yourselves,” i.e. Let us now see what they can profit you who have used to sell you their praise. “Lest there be not enough for us and you,” because no man is profited in God’s sight by the testimony of others, because God sees the heart, and each man is scarce able to give testimony concerning his own conscience." },
  { line = 6112, text = "Jerome: But because the season for buying was now past, and the day of judgment was coming on, so that there was no room for penitence, they must not now lay up new works, but give an account of the old." },
  { line = 6113, text = "Hilary: “The marriage” is the putting on of immortality, and the joining together corruption and incorruption in a new union." },
  { line = 6114, text = "Chrys.; That, “While they went to buy,” shews that even, if we should become merciful after death, it will avail us nothing to escape punishment, as it was no profit to the rich man, that he became merciful and careful about those who belonged to him." },
  { line = 6115, text = "Origen: Or, He says, “While they went to buy,” because there are men to be found who have neglected to learn any thing useful, till when, in the very end of their life, when they set themselves to learn, they are overtaken by death." },
  { line = 6116, text = "Aug.: Or otherwise; “While they went to buy,” that is, while they turned themselves to things without, and sought to find pleasure in things they had been accustomed to, because they knew not inward joys, came He that judges; and they “that were ready,” i.e. they whose conscience bore witness to them before God, “went in with him to the wedding,” i.e. to where the pure soul is united prolific to the pure and perfect word of God." },
  { line = 6117, text = "Jerome: After the day of judgment, there is no more opportunity for good works, or for righteousness, and therefore it follows, “And the door was shut.”" },
  { line = 6118, text = "Aug.: When they have been taken in who have been changed into angelic being, all entrance into the kingdom of heaven is closed; after the judgment, there is no more place for prayers or merit. [marg. note: 1 Cor 15:51]" },
  { line = 6119, text = "Hilary: Yet though the season of repentance is now past, the foolish virgins come and beg that entrance may be granted to them." },
  { line = 6120, text = "Jerome: Their worthy confession calling Him, “Lord, Lord,” is a mark of faith. But what avails it to confess with the mouth Him whom you deny with your works?" },
  { line = 6121, text = "Gloss, ap. Anselm: Grief at their exclusion extorts from them a repetition of this title of, “Lord;” they call not Him Father, whose mercy they despised in their lifetime." },
  { line = 6122, text = "Aug.: It is not said that they bought any oil, and therefore we must suppose that all their delight in the praise of men being gone, they return in distress and affliction to implore God. But His severity, after judgment, is as great as His mercy was unspeakable before. “But He answered and said, Verily I say unto you, I know you not;” by that rule, namely, that the art of God, that is, His wisdom, does not admit that those should enter into His joy who have sought to do in any thing according to His commandments, not as before God, but that they may please men." },
  { line = 6123, text = "Jerome: For “the Lord knoweth them that are his,” [2 Tim 2:19] and he that knoweth not shall not be known, and though they be virgins in purity of body, or in confession of the true faith, yet forasmuch as they have no oil, they are unknown by the bridegroom. When He adds, “Watch therefore, because ye know not the day nor the hour,” He means that all that has been said points to this, namely, that seeing we know not the day of judgment, we should be careful in providing the light of good works." },
  { line = 6124, text = "Aug.: For indeed we know the day and the hour neither of that future time when the Bridegroom will come, nor of our own falling asleep each of us; if then we be prepared for this latter, we shall also be prepared when that voice shall sound, which shall arouse us all." },
  { line = 6125, text = "Aug., Ep. 199, 45: There have not been wanting those who would refer these ten virgins to that coming of Christ, which takes place now in the Church; but this is not to be hastily held out, lest any thing should occur contradictory of it." },
]
