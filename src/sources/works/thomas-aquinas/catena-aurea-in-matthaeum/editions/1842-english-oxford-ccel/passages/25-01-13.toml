  { line = 6064, text = "Chrys., Hom. lxxviii, In the foregoing parable the Lord set forth the punishment of the man who beat, and was drunk, and wasted his Lord’s goods; in this He declares his punishment who profits not, and does not prepare for himself abundantly the things of which he has need; for the foolish virgins had oil, but not enough." },
  { line = 6065, text = "Hilary: “Then,” because all this discourse is concerning the great day of the Lord, concerning which He had been speaking before." },
  { line = 6066, text = "Greg., Hom. in Ev., xii, 1: By “the kingdom of heaven” is meant the present Church, as in that, “The Son of Man shall send forth his angels, and they shall gather out of his kingdom all things that offend.” [Matt 13:41]" },
  { line = 6067, text = "Jerome: This parable of the ten foolish and the ten wise virgins, some interpret literally of virgins, of whom there are according to the Apostle [marg. note: 1 Cor 7] some who are virgins both in body and in thought, others who have preserved indeed their bodies virgin, but have not the other deeds of virgins, or have only been preserved by the guardianship of parents, but have wedded in their hearts. But from what has gone before, I think the meaning to be different, and that the parable has reference not to virgins only, but to the whole human race." },
  { line = 6068, text = "Greg.: For in each of the five senses of the body there is a double instrument, and the number five doubled makes ten. And because the company of the faithful is gathered out of both sexes, the Holy Church is described as being like to ten virgins, where as bad are mixed with good, and reprobate with elect, it is like a mixture of wise and foolish virgins." },
  { line = 6069, text = "Chrys.: And He employs the character virgins in this parable to shew, that though virginity be a great thing, yet if it be not accompanied by works of mercy, it shall be cast out with the adulterers." },
  { line = 6070, text = "Origen: Or, The understandings of all who have received the word of God are virgins. For such is the word of God, that of its purity it imparts to all, who by its teaching have departed from the worship of idols, and have through Christ drawn near to the worship of God; “Which took their lamps, and went forth to meet the bridegroom and the bride.” [ed. note: ‘Et sponsae’ Vulg. and so a few Greek MSS.]" },
