text = "23. And Jesus went about all Galilee, teaching in their synagogues, and preaching the Gospel of the kingdom, and healing all manner of sickness and all manner of disease among the people. 24. And His fame went throughout all Syria: and they brought unto Him all sick people that were taken with divers diseases and torments, and those which were possessed with devils, and those which were lunatic, and those that had the palsy; and He healed them. 25. And there followed Him great multitudes of people from Galilee, and from Decapolis, and from Jerusalem, and from Judaea, and from beyond Jordan. Pseudo-Chrys.: Kings, when about to go to war with their enemies, first gather an army, and so go out to battle; thus the Lord when about to war against the Devil, first collected Apostles, and then began to preach the Gospel. Remig.: An example of life for doctors; that they should not be inactive, they are instructed in these words, “And Jesus went about.” Pseudo-Chrys.: Because they being weak could not come to their physician, He as a zealous Physician went about to visit those who had any grievous sickness. The Lord went round the several regions, and after His example the pastors of each region ought to go round to study the several dispositions of their people, that for the remedy of each disease some medicine may be found in the Church. Remig.: That they should not be acceptors of persons the preachers are instructed in what follows, “the whole of Galilee.” That they should not go about empty, by the word, “teaching.” That they should seek to benefit not few but many, in what follows, “in their synagogues.” Chrys.: [ed. note: A passage is here inserted in Nicolai’s edition which is not in the original. It is of no doctrinal importance.] By which too He shewed the Jews that He came not as an enemy of God, or a seducer of souls, but as consenting with his Father. Remig.: That they should not preach error nor fable, but sound doctrine, is inculcated in the words, “preaching the Gospel of the kingdom.” ‘Teaching’ and ‘preaching’ differ; teaching refers to things present, preaching to things to come; He taught present commandments and preached future promises. Pseudo-Chrys.: Or, He taught natural righteousness, those things which natural reason teaches, as chastity, humility, and the like, which all men of themselves see to be goods. Such things are necessary to be taught not so much for the sake of making them known as for stirring the heart. For beneath the prevalence of carnal delights the knowledge of natural righteousness sleeps forgotten. When then a teacher begins to denounce carnal sins, his teaching does not bring up a new knowledge, but recalls to memory one that had been forgotten. But He preached the Gospel, in telling of good things which the ancients had manifestly not heard of, as the happiness of heaven, the resurrection of the dead, and the like. Or, He taught by interpreting the prophecies concerning Himself; He preached by declaring the benefits that were to come from Himself. Remig.: That the teacher should study to commend his teaching by his own virtuous conduct is conveyed in those words, “healing every sort of disease and malady among the people;” maladies of the body, diseases of the soul. Pseudo-Chrys.: Or, by disease we may understand any passion of the mind, as avarice, lust, and such like, by malady unbelief, that is, weakness of faith. Or, the diseases are the more grievous pains of the body, the maladies the slighter. As He cured the bodily pains by virtue of His divine power, so He cured the spiritual by the word of His mercy. He first teaches, and then performs the cures, for two reasons. First, that what is needed most may come first; for it is the word of holy instruction, and not miracles, that edify the soul. Secondly, because teaching is commended by miracles, not the converse. Chrys.: We must consider that when some great change is being wrought, as the introduction of a new polity, God is wont to work miracles, giving pledges of His power to those who are to receive His laws. Thus when He would make man, He first created a world, and then at length gave man in paradise a law. When He would dispense a law to the holy Noah, he shewed truly great wonders; and again when He was about to ordain the Law for the Jews, He first shewed great prodigies, and then at length gave them the commandments. So now when about to introduce a sublime discipline of life, He first provided a sanction to His instructions by mighty signs, because the eternal kingdom He preached was not seen, by the things which did appear, He made sure that which as yet did not appear. Gloss. ap. Anselm: Because preachers should have good testimony from those who are without, lest if their life is open to censure, their preaching be contemned, he adds, “And the fame of him went abroad through all Syria.” Rabanus: Syria here is all the region from Euphrates to the Great sea, from Cappodocia to Egypt, in which is the country of Palestine, inhabited by Jews. Chrys.: Observe the reserve of the Evangelist; he does not give an account of any one of the various cases of healing, but passes in one brief phrase an abundance of miracles, “they brought to him all their sick.” Remig.: By these he would have us understand various but slighter diseases; but when he says, “seized with divers sicknesses and torments,” he would have those understood, of whom it is subjoined, “and who had daemons.” Gloss: ‘Sickness’ means a lasting ailment; ‘torment’ is an acute pain, as pleurisy, and such like; they “who had daemons” are they who were tormented by the daemons. Remig.: ‘Lunatics’ are so called from the moon; for as it waxes in its monthly seasons they are tormented. Jerome: Not really smitten by the moon, but who were believed to be so through the subtlety of the daemons, who by observing the seasons of the moon, sought to bring an evil report against the creature, that is might redound to the blasphemy of the Creator. Aug., City of God, book 21, ch. 6: Daemons are enticed to take up their abode in many creatures, (created not by themselves but God,) by delights adapted to their various natures; not that they are animals, drawn by meats; but spirits attracted by signs which agree with each one’s taste. Rabanus: Paralytics are those whose bodies have their nerves slackened or resolved from a Greek word, signifying this. Pseudo-Chrys.: In some places it is, “He cured many;” but here, “He cured them,” meaning, ‘all;’ as a new physician first entering a town cures all who come to him to beget a good opinion concerning himself. Chrys.: He requires no direct profession of faith from them, both because He had not yet given them any proofs of His miraculous power, and because in bringing their sick from far they had shewn no small faith. Rabanus: The crowds that followed Him consisted of four sorts of men. Some followed for the heavenly teaching as disciples, some for the curing of their diseases, some from the reports concerning Him alone, and curiosity to find whether they were true; others from envy, wishing to catch Him in some matter that they might accuse Him. Mystically, Syria is interpreted ‘lofty,’ Galilee, ‘turning:’ or ‘a wheel;’ that is, the Devil and the world; the Devil is both proud and always turned round to the bottom; the world in which the fame of Christ went abroad through preaching: the daemoniacs are the idolaters; the lunatics, the unstable; the paralytics, the slow and careless. Gloss. ap. Anselm: The crowds that follow the Lord, are they of the Church, which is spiritually designated by Galilee, passing to virtuousness; Decapolis is he who keeps the Ten Commandments; Jerusalem and Judaea, he who is enlightened by the vision of peace and confession; and beyond Jordan, he who having passed the waters of Baptism enters the land of promise. Remig.: Or, they follow the Lord “from Galilee,” that is, from the unstable world; from Decapolis, (the country of ten towns,) signifying those who break the Ten Commandments; “and from Jerusalem,” because before it was preserved unhurt in peace; “and from Jordan,” that is, from the confession of the Devil; “and from beyond Jordan,” they who were first planted in paganism, but passing the water of Baptism came to Christ."
