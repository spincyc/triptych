text = "23. “Woe unto you, Scribes and Pharisees, hypocrites! for ye pay tithe of mint and anise and cummin, and have omitted the weightier matters of the law, judgment, mercy, and faith: these ought ye to have done, and not to leave the other undone. 24. Ye blind guides, which strain at a gnat, and swallow a camel.” Chrys.: The Lord had said above that they bound heavy burdens upon others, which they themselves would not touch; He now again shews how they aimed at being correct in little things, but neglected weighty matters. Jerome: The Lord had commanded, that for the maintenance of the Priests and Levites, whose portion was the Lord, tithes of every thing should be offered in the temple. Accordingly, the Pharisees (to dismiss mystical expositions) concerned themselves about this alone, that these trifling things should be paid in, but lightly esteemed other things which were weighty. He charges them then with covetousness in exacting carefully the tithes of worthless herbs, while they neglected justice in their transactions of business, mercy to the poor, and faith toward God, which are weighty things. Pseudo-Chrys.: Or, because these covetous Priests, when any one did not bring his tithes of the smallest thing, made it a matter of grave reprehension; but when one injured his neighbour or sinned against God, they were at no pains to reprove him, careful only of their own profit, neglecting the glory of God, and the salvation of men. For to observe righteousness, to do mercy, and to have faith, these things God commanded for His own glory; but the payment of tithes He established for the support of the Priests, so that the Priests should minister to the people in spiritual things, and the people supply the Priests with carnal things. Thus is it at this time, when all are careful of their own honour, none of God’s honour; they jealously protect their own rights, but will not bestow any pains in the service of the Church. If the people pay not their tithes duly, they murmur; but if they see the people in sin, they utter not a word against them. But because some of the Scribes and Pharisees, to whom He is now speaking, were of the people, it is not unsuitable to make a different interpretation; and ‘to tithe’ may be used as well of him who pays, as of him who receives, tithes. The Scribes then and Pharisees offered tithes of the very best things for the purpose of displaying their righteousness; but in their judgments they were unjust, without mercy for their brethren, without faith for the truth. Origen: But because it was possible that some, hearing the Lord speak thus, might thereupon neglect paying tithes of small things, He prudently adds, “These things ought ye to have done,” (i.e. justice, mercy, and faith,) “and not to leave the others undone,” i.e. the tithing of mint, anise, and cummin. Remig.: In these words the Lord shews that all the commandments of the Law, greatest and least, are to be fulfilled. They also are refuted who give alms of the fruits of the earth, supposing that thus they cannot sin, whereas their alms profit them nothing unless they are careful to keep themselves from sin. Hilary: And because it was much less guilt to omit the tithing of herbs than a duty of benevolence, the Lord derides them, “Ye blind guides, which strain out a gnat, and swallow a camel.” Jerome: The camel I suppose to mean the weighty precepts, judgment, mercy, and faith; the gnat, the tithing of mint, anise, and cummin, and other valueless herbs. The greater of God’s commands we “swallow” and overlook, but shew our carelessness by a religious scrupulousness in little things which bring profit with them. Origen: Or, “straining out a gnat,” that is, putting from them small sins; “swallowing a camel,” that is, committing great sins, which He calls camels, from the size and distorted shape of that animal. Morally, The Scribes are those who think nothing else contained in Scripture than the bare letter exhibits; the Pharisees are all those who esteem themselves righteous, and separate themselves from others, saying, ‘Come not nigh me, for I am clean.’ “Mint, anise, and cummin,” are the seasoning, not the substantial part of food ; as in our life and conversation there are some things necessary to justification, as judgment, mercy, and faith; and others which are like the seasoning of our actions, giving them a flavour and sweetness, as abstinence from laughter, fasting, bending the knee, and such like. How shall they not be judged blind who see not that it is of little avail to be a careful dispenser in the least things, if things of chief moment are neglected? These His present discourse overthrows; not forbidding to observe the little things, but bidding to keep more carefully the chief things. Greg., Mor. 1, 15: Or otherwise; The gnat stings while it hums; the camel bows its back to receive its load. The Jews then “strained off the gnat,” when they prayed to have the seditious robber released to them; and they swallowed the camel, when they sought with shouts the death of Him who had voluntarily taken on Him the burden of our mortality."
