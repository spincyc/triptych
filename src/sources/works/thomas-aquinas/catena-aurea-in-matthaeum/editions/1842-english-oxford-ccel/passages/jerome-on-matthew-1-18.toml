notes = "Exact CCEL English digital witness inspected on 2026-11-18; no facsimile collation (no page image of the 1842 Oxford printing is registered for this edition), and no collation with Jerome's Latin. Not verified. Identification: the Catena labels the comment only \"Jerome\". The Roman Breviary reads Jerome's homily on Matthew 1:18-21 at Matins of the Vigil of the Nativity, headed \"Homilia sancti Hieronymi Presbyteri. Lib. I. Comment. in c. 1. Matth.\" with the incipit \"Quare non de simplici virgine, sed de desponsata concipitur?\" (`passage.catholic-church.breviarium-romanum.pustet-ratisbon-pars-hiemalis-1888.advent-primer-20261118-vigil-nativity-matins`, verified on page images of the 1888 Pustet printing, p. 174), which this comment renders; the comment is that commentary's, not the Contra Helvidium the Catena cites separately in the same block."
