text = "33. Another parable spake he unto them; “The kingdom of heaven is like unto leaven, which a woman took, and hid in three measures of meal, till the whole was leavened.” Chrys.: The same thing the Lord sets forth in this parable of the leaven; as much as to say to His disciples, As leaven changes into its own kind much wheat-flour, so shall ye change the whole world. Note here the wisdom of the Saviour; He first brings instances from nature, proving that as the one is possible so is the other. And He says not simply ‘put,’ but “hid;” as much as to say, So ye, when ye shall be cast down by your enemies, then ye shall overcome them. And so leaven is kneaded in, without being destroyed, but gradually changes all things into its own nature; so shall it come to pass with your preaching. Fear ye not then because I said that many tribulations shall come upon you, for so shall ye shine forth, and shall overcome them all. He says, “three measures,” to signify a great abundance; that definite number standing for an indefinite quantity. Jerome: The ‘saturn’ is a kind of measure in use in Palestine containing one modius and a half. Aug. Quaest. Ev., i, 12: Or, The leaven signifies love, because it causes activity and fermentation; by the woman He means wisdom. By the three measures He intends either those three things in man, with the whole heart, with the whole soul, with the whole mind; or the three degrees of fruitfulness, the hundred-fold, the sixty-fold, the thirty-fold; or those three kinds of men, Noe, Daniel, and Job. Raban.: He says, “Until the whole was leavened,” because that love implanted in our mind ought to grow until it changes the whole soul into its own perfection; which is begun here, but is completed hereafter. Jerome: Or otherwise; The woman who takes the leaven and hides it, seems to me to be the Apostolic preaching, or the Church gathered out of divers nations. She takes the leaven, that is, the understanding of the Scriptures, and hides it in three measures of meal, that the three, spirit, soul, and body, may be brought into one, and may not differ among themselves. Or otherwise; We read in Plato [margin note: R. P., iv. 439. λογιστικὸν, ἐπιθυμητικὸν, θυμοειδὲς] that there are three parts in the soul, reason, anger, and desire; so we also if we have received the evangelic leaven of Holy Scripture, may possess in our reason prudence, in our anger hatred against vice, in our desire love of the virtues, and this will all come to pass by the Evangelic teaching which our mother Church has held out to us. I will further mention an interpretation of some; that the woman is the Church, who has mingled the faith of man in three measures of meal, namely, belief in the Father, the Son, and the Holy Spirit; which when it has fermented into one lump, brings us not to a threefold God, but to the knowledge of one Divinity. This is a pious interpretation; but parables and doubtful solutions of dark things, can never bestow authority on dogmas. Hilary: Or otherwise; The Lord compares Himself to leaven; for leaven is produced from meal, and communicates the power that it has received to a heap of its own kind. The woman, that is the Synagogue, taking this leaven hides it, that is by the sentence of death; but it working in the three measures of meal, that is equally in the Law, the Prophets, and the Gospels, makes all one; so that what the Law ordains, that the Prophets announce, that is fulfilled in the developments of the Gospels. But many, as I remember, have thought that the three measures refer to the calling of the three nations, out of Shem, Ham, and Japhet. But 1 hardly think that the reason of the thing will allow this interpretation; for though these three nations have indeed been called, yet in them Christ is shewn and not hidden, and in so great a multitude of unbelievers the whole cannot be said to be leavened."
