text = "12. Now when Jesus had heard that John was cast into prison, He departed into Galilee; 13. And leaving Nazareth, He came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim: 14. That is might be fulfilled which was spoken by Esaeas the prophet, saying, 15. “The land of Zabulon, and the land of Naphthalim, by the way of the sea, beyond Jordan, Galilee of the Gentiles; 16. The people which sat in darkness saw great light; and to them which sat in the region and shadow of death light is sprung up. Rabanus: Matthew having related the forty days’ fast, the temptation of Christ, and the ministry of Angels, proceeds, “Jesus having heard that John was cast into prison.” Pseudo-Chrys.: By God without doubt, for none can effect any thing against a holy man, unless God deliver him up. “He withdrew into Galilee,” that is, out of Judaea; both that He might reserve His passion to the fit time, and that He might set us an example of flying from danger. Chrys.: It is not blameworthy not to throw one’s self into peril, but when one has fallen into it, not to endure manfully. He departed from Judaea both to soften Jewish animosity, and to fulfil a prophecy, seeking moreover to fish for those masters of the world who dwelt in Galilee. Note also how when He would depart to the Gentiles, He received good cause from the Jews; His forerunner was thrown into prison, which compelled Jesus to pass into Galilee of the Gentiles. Gloss. ap. Anselm: He came as Luke writes to Nazareth, where He had been brought up, and there entering into the synagogue, He read and spoke many things, for which they sought to throw Him down from the rock, and thence He went to Capernaum; for which Matthew has only, “And leaving the town of Nazareth, He came and dwelt at Capernaum.” Gloss. ord.: Nazareth is a village in Galilee near Mount Tabor; Capernaum a town in Galilee of the Gentiles near the Lake of Gennesaret; and this is the meaning of the word, “on the sea coast.” He adds further “in the borders of Zabulon and Naphtali,” where was the first captivity of the Jews by the Assyrians. Thus where the Law was first forgotten, there the Gospel was first preached; and from a place as it were between the two it was spread both to Jews and Gentiles. Remig.: He left one, viz. Nazareth, that He might enlighten more by His preaching and miracles. Thus leaving an example to all preachers that they should preach at a time and in places where they may do good, to as many as possible. In the prophecy, the words are these - “At that first time the land of Zabulon and the land of Naphtali was lightened, and at the last time was increased the way of the sea beyond Jordan, Galilee of the Gentiles.” [Isa 9:1] Jerome, Hieron. in Esai. c. 9. 1: They are said at the first time to be lightened from the burden of sin, because in the country of these two tribes, the Saviour first preached the Gospel; “at the last time” their faith “was increased,” most of the Jews remaining in error. By the sea here is meant the Lake of Gennesaret, a lake formed by the waters of the Jordan, on its shores are the towns of Capernaum, Tiberias, Bethsaida, and Corozaim, in which district principally Christ preached. Or, according to the interpretation of those Hebrews who believe in Christ, the two tribes Zabulon and Naphtali were taken captive by the Assyrians, and Galilee was left desert; and the prophet therefore says that it was lightened, because it had before suffered the sins of the people; but afterwards the remaining tribes who dwelt beyond Jordan and in Samaria were led into captivity; and Scripture here means that the region which had been the first to suffer captivity, now was the first to see the light of Christ’s preaching. The Nazarenes again interpret that this was the first part of the country that, on the coming of Christ, was freed from the errors of the Pharisees, and after by the Gospel of the Apostle Paul, the preaching was increased or multiplied throughout all the countries of the Gentiles. Gloss. ap. Anselm: But Matthew here so quotes the passage as to make them all nominative cases referring to one verb. The land of Zabulon, and the land of Naphtali, which is the way of the sea, and which is beyond Jordan, viz. the people of Galilee of the Gentiles, the people which walked in darkness. Gloss. ord.: Note that there are two Galilees; one of the Jews, the other of the Gentiles. This division of Galilee had existed from Solomon’s time, who gave twenty cities in Galilee to Hyram, King of Tyre; this part was afterwards called Galilee of the Gentiles; the remained, of the Jews. Jerome, Hieron.: Or we must read, “beyond Jordan, of Galilee of the Gentiles;” so, I mean, that the people who either sat, or walked in darkness, have seen light, and that not a faint light, as the light of the Prophets, but a great light, as of Him who in the Gospel speaks thus, “I am the light of the world.” Between death and the shadow of death I suppose this difference; death is said of such as have gone down to the grave with the works of death; the shadow of such as live in sin, and have not yet departed from this world; these may, if they will, yet turn to repentance. Pseudo-Chrys.: Otherwise, the Gentiles who worshipped idols, and daemons, were they who sat in the region of the shadow of death; the Jews, who did the works of the Law, were in darkness, because the righteousness of God was not yet manifested to them. Chrys.: But that you may learn that he speaks not of natural day and night, he calls the light, “a great light,” which is in other places called “the true light;” and he adds, “the shadow of death,” to explain what he means by darkness. The words “arose,” and “shined,” shew, that they found it not of their own seeking, but God Himself appeared to them, they did not first run to the light; for men were in the greatest miseries before Christ’s coming; they did not walk but safe in darkness; which was a sign that they hoped for deliverance; for as not knowing what way they should go, shut in by darkness they sat down, having now no power to stand. By darkness he means here, error and ungodliness. Rabanus, ap. Anselm: In allegory, John and the rest of the Prophets were the voice going before the Word. When prophecy ceased and was fettered, then came the Word, fulfilling what the Prophet had spoken of it, “He departed into Galilee,” i.e. from figure to verity. Or, into the Church, which is a passing from vice to virtue. Nazareth is interpreted ‘a flower,’ Capernaum, ‘the beautiful village;’ He left therefore the flower of figure, (in which was mystically intended the fruit of the Gospel,) and came into the Church, which was beautiful with Christ’s virtues. It is “by the sea-coast,” because placed near the waves of this world, it is daily beaten by the storms of persecution. It is situated between Zabulon and Naphtali, i.e. common to Jews and Gentiles. Zabulon is interpreted, ‘the abode of strength;’ because the Apostles, who were chosen from Judaea, were strong. Nephtali, ‘extension,’ because the Church of the Gentiles was extended through the world. Aug., de Cons. Evan., ii, 17: John relates in his Gospel the calling of Peter, Andrew, and Nathanael, and the miracle of Cana, before Jesus’ departure into Galilee; all these things the other Evangelists have omitted, carrying on the thread of their narrative with Jesus’ return into Galilee. We must understand then that some days intervened, during which the things took place concerning the calling of the disciples which John relates. Remig.: But this should be considered with more care, viz. that John says that the Lord went into Galilee, before John the Baptist was thrown into prison. According to John’s Gospel after the water turned into wine, and his going down to Capernaum, and after his going up to Jerusalem, he returned to Judaea and baptized, and John was not yet cast into prison. But here it is after John’s imprisonment that He retires into Galilee, and with this Mark agrees. But we need not suppose any contradiction here. John speaks of the Lord’s first coming into Galilee, which was before the imprisonment of John. He speaks in another place of His second coming into Galilee [John 4:3], and the other Evangelists mention only this second coming into Galilee which was after John’s imprisonment. Euseb., H. E. iii. 24: It is related that John preached the Gospel almost up to the close of his life without setting forth any thing in writing, and at length came to write for this reason. The three first written Gospels having come to his knowledge, he confirmed the truth of their history by his own testimony; but there was yet some things wanting, especially an account of what the Lord had done at the first beginning of His preaching. And it is true that the other three Gospels seem to contain only those things which were done in that year in which John the Baptist was put into prison, or executed. For Matthew, after the temptation, proceeds immediately, “Hearing that John was delivered up;” and Mark in like manner. Luke again, even before relating one of Christ’s actions, tells that “Herod had shut up John in prison.” The Apostle John then was requested to put into writing what the preceding Evangelists had left out before the imprisonment of John; hence he says in his Gospel, “this beginning of miracles did Jesus.”"
