text = "l. And Jesus went out, and departed from the temple: and his disciples came to him for to shew him the buildings of the temple. 2. And Jesus said unto them, “See ye not all these things? verily I say unto you, There shall not be left here one stone upon another, that shall not be thrown down.” Origen: Christ, when He had foretold all that should come upon Jerusalem, “went forth out of the temple,” He, who while He was in it, had upheld the temple that it should not fall. And so each man, being the temple of God by reason of the Spirit of God dwelling in him, is himself the cause of his being deserted, that Christ should depart from him. It is worthy of note how they “shew Him the buildings of the temple,” as though He had never seen them. We reply, that when Christ had foretold the destruction that should come upon the temple, His disciples were amazed at the thought that so magnificent buildings should be utterly ruined, and therefore they shew them to Him to move Him to pity, that He would not do what He had threatened. And because the constitution of human nature is wonderful, being made the temple of God, the disciples and the rest of the saints confessing the wonderful working of God in respect of the forming of men, intercede before the face of Christ, that He would not forsake the human race for their sins. Raban.: The historical sense is clear, that in the forty-second year after the Lord’s passion, the city and temple were overthrown under the Roman Emperors Vespasian and Titus. Remig.: So it was ordained of God, that as soon as the light of grace was revealed, the temple with its ceremonies should be taken out of the way, lest any weakling in the faith, beholding all the things instituted of the Lord and hallowed by the Prophets yet abiding, might be gradually drawn away from the purity of the faith to a carnal Judaism. Chrys., Hom lxxv: How means He Hom. this, “that one stone shalt not be left upon another?” Either as conveying the notion of its utter overthrow; or with respect to the place in which it stood, for its parts were broken up to its very foundations. But I would add, that, after the fate it underwent, the most captious might be satisfied that its very fragments have perished. Jerome: Figuratively; When the Lord departed from the temple, all the buildings of the Law and the structure of the Commandments were so overthrown, that none of them could be fulfilled by the Jews, but, the Head being taken away, all the parts were at war among themselves. Origen: Every man also, who, by taking into him the word of God, is become a temple, if after sinning be yet retains in part the traces of faith and religion, his temple is in part destroyed, and in part standing. But he who after sin has no regard for himself is gradually alienated, until he has altogether forsaken the living God, and so one stone is not left upon another of God’s commandments, which be has not thrown down."
