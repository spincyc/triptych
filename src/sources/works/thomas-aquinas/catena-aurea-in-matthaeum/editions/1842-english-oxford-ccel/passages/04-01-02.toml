text = "1. Then was Jesus led up of the Spirit into the wilderness to be tempted of the Devil. 2. And when He had fasted forty days and forty nights, He was afterward an hungred. Pseudo-Chrys.: The Lord being baptized by John with water, is led by the Spirit into the wilderness to be baptized by the fire of temptation. ‘Then,’ i.e. when the voice of the Father had been given from heaven. Chrys., Hom. 13: Whoever thou art then that after thy baptism sufferest grievous trials, be not troubled thereat; for this thou receivedst arms, to fight, not to sit idle. God does not hold all trial from us; first, that we may feel that we are become stronger; secondly, that we may not be puffed up by the greatness of the gifts we have received; thirdly, that the Devil may have experience that we have entirely renounced him; fourthly, that by it we may be made stronger; fifthly, that we may receive a sign of the treasure entrusted to us; for the Devil would not come upon us to tempt us, did he not see us advanced to greater honours. Hilary: The Devil’s snares are chiefly spread for the sanctified, because a victory over the saints is more desired than over others. Greg., Hom. in Ev., 16, 1: Some doubt what Spirit it was that led Jesus into the desert, for that it is said after, “The Devil took him into the holy city.” But true and without question agreeable to the context is the received opinion, that it was the Holy Spirit; that His own Spirit should lead Him thither where the evil spirit should find Him and try Him. Aug., de Trin., 4, 13: Why did He offer Himself to temptation? That He might be our mediator in vanquishing temptation not by aid only, but by example. Pseudo-Chrys.: He was led by the Holy Spirit, not as an inferior at the bidding of a greater. For we say, “led,” not only of him who is constrained by a stronger than he, but also of him who is induced by reasonable persuasion; as Andrew “found his brother Simon, and brought him to Jesus.” Jerome: “Led,” not against His will, or as a prisoner, but as by a desire for the conflict. Pseudo-Chrys.: The Devil comes against men to tempt them, but since He could not come against Christ, therefore Christ came against the Devil. Greg.: We should know that there are three modes of temptation; suggestion, delight, and consent; and we when we are tempted commonly fall into delight or consent, because being born of the sin of the flesh, we bear with us whence we afford strength for the contest; but God who incarnate in the Virgin’s womb came into the world without sin, carried within Him nothing of a contrary nature. He could then be tempted by suggestion; but the delight of sin never gnawed His soul, and therefore all that temptation of the Devil was without not within Him. Chrys.: The Devil is wont to be most urgent with temptation, when he sees us solitary; thus it was in the beginning he tempted the woman when he found her without the man, and now too the occasion is offered to the Devil, by the Saviour’s being led into the desert. Gloss. ap. Anselm: This desert is that between Jerusalem and Jericho, where the robbers used to resort. It is called Hammaim, i.e. ‘of blood,’ from the bloodshed which these robbers caused there; hence the man was said (in the parable) to have fallen among robbers as he went down from Jerusalem to Jericho, being a figure of Adam, who was overcome by daemons. It was therefore fit that the place where Christ overcame the Devil, should be the same in which the Devil in the parable overcomes man. Pseudo-Chrys.: Not Christ only is led into the desert by the Spirit, but also all the sons of God who have the Holy Spirit. For they are not content to sit idle, but the Holy Spirit stirs them to take up some great work, i.e. to go out into the desert where they shall meet with the Devil; for there is no righteousness wherewith the Devil is pleased. For all good is without the flesh and the world, because it is not according to the will of the flesh and the world. To such a desert then all the sons of God go out that they may be tempted. For example, if you are unmarried, the Holy Spirit has by that led you into the desert, that is, beyond the limits of the flesh and the world, that you may be tempted by lust. But he who is married is unmoved by such temptation. Let us learn that the sons of God are not tempted but when they have gone forth into the desert, but the children of the Devil whose life is in the flesh and the world are then overcome and obey; the good man, having a wife is content; the bad, though he have a wife is not therewith content, and so in all other things. The children of the Devil go not out to the Devil that they may be tempted. For what need that he should seek the strife who desires not victory? But the sons of God having more confidence and desirous of victory, go forth against him beyond the boundaries of the flesh. For this cause then Christ also went out to the Devil, that He might be tempted of him. Chrys.: But that you may learn how great a good is fasting, and what a mighty shield against the Devil, and that after baptism you ought to give attention to fasting and not to lusts, therefore Christ fasted, not Himself needing it, but teaching us by His example. Pseudo-Chrys.: And to fix the measure of our quadragesimal fast, be fasted forty days and forty nights. Chrys.: But He exceeded not the measure of Moses and Elias, lest it should bring into doubt the reality of His assumption of the flesh. Greg., Hom. in Ev., 16, 5: The Creator of all things took no food whatever during forty days. We also, at the season of Lent as much as in us lies afflict our flesh by abstinence. The number forty is preserved, because the virtue of the decalogue is fulfilled in the books of the holy Gospel; and ten taken four times amounts to forty. Or, because in this mortal body we consist of four elements by the delights of which we go against the Lord’s precepts received by the decalogue. And as we transgress the decalogue through the lusts of this flesh, it is fitting that we afflict the flesh forty-fold. Or, as by the Law we offer the tenth of our goods, so we strive to offer the tenth of our time. And from the first Sunday of Lent to the rejoicing of the paschal festival is a space of six weeks, or forty-two days, subtracting from which the six Sundays which are not kept there remain thirty-six. Now as the year consists of three hundred and sixty-five, by the affliction of these thirty-six we give the tenth of our year to God. Aug., Lib. 83. Quest. q. 81: Otherwise; The sum of all wisdom is to be acquainted with the Creator and the creature. The Creator is the Trinity, Father, Son, and Holy Ghost; the creature is partly invisible, - as the soul to which we assign a threefold nature, (as in the command to love God with the whole heart, mind, and soul,) - partly visible as the body, which we divide into four elements; the hot, the cold, the liquid, the solid. The number ten then, which stands for the whole law of life, taken four times, that is, multiplied by that number which we assign for the body, because by the body the law is obeyed or disobeyed, makes the number forty. All the aliquot parts in this number, viz. 1, 2, 4, 5, 8, 10, 20, taken together make up the number 50. Hence the time of our sorrow and affliction is fixed at forty days; the state of blessed joy which shall be hereafter is figured in the quinquagesimal festival, i.e. the fifty days from Easter to Pentecost. Aug., Serm. 210, 2: Not however because Christ fasted immediately after having received baptism, are we to suppose that He established a rule to be observed, that we should fast immediately after His baptism. But when the conflict with the tempter is sore, then we ought to fast, that the body may fulfil its warfare by chastisement, and the soul obtain victory by humiliation. Pseudo-Chrys.: The Lord knew the thoughts of the Devil, that he sought to tempt Him; he had heard that Christ had been born into this world with the preaching of Angels, the witness of shepherds, the inquiry of the Magi, and the testimony of John. Thus the Lord proceeded against him, not as God, but as man, or rather both as God and man. For in forty days of fasting not to have been “an hungred” was not as man; to be ever “an hungred” was not as God. He was “an hungred” then that the God might not be certainly manifested, and so the hopes of the Devil in tempting Him be extinguished, and His own victory hindered. Hilary: He was “an hungred,” not during the forty days, but after them. Therefore when the Lord hungred, it was not that the effects of abstinence then first came upon Him, but that His humanity was left to its own strength. For the Devil was to be overcome, not by the God, but by the flesh. By this was figured, that after those forty days which He was to tarry on earth after His passion were accomplished, He should hunger for the salvation of man, at which time He carried back again to God His Father the expected gift, the humanity which He had taken on Him."
