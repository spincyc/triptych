text = "25. And Jesus knew their thoughts, and said unto them, “Every kingdom divided against itself is brought to desolation; and every city or house divided against itself shall not stand; 26. And if Satan cast out Satan, he is divided against himself; how shall then his kingdom stand?” Jerome: The Pharisees ascribed the works of God to the Prince of the daemons; and the Lord makes answer not to what they said, but to what they thought, that even thus they might be compelled to believe His power, Who saw the secrets of the heart; “Jesus, knowing their thoughts, said unto them.” Chrys., Hom. xli: Above they had accused Christ of having cast out daemons by Beelzebub; but then He did not reprove them, suffering them, if they would, to acknowledge Him from further miracles, and to learn His greatness from His doctrine. But because they continued to maintain the same things, He now rebukes them, although their accusation had been very unreasonable. But jealousy reeks not what it says, so that only it say somewhat. Yet does not Christ contemn them, but answers with a gracious mildness, teaching us to be gentle to our enemies, and not to be troubled, even though they should speak such things against us, as we neither acknowledge in us, nor have any reasonableness in themselves. Therein also He proves that the things which they had said against Him were false, for it is not of one having a daemon to shew such mercy, and to know the thoughts. Moreover, because this their accusation was very unreasonable, and they feared the multitude, they did not dare to proclaim it openly, but kept it in their thoughts; wherefore he says, “Knowing their thoughts.” He does not repeat their thoughts in His answer, not to divulge their wickedness; but He brings forward an answer; it was His object to do good to the sinners, not to proclaim their sin. He does not answer them out of the Scriptures, because they would not hearken to Him as they explained them differently, but He refutes them from common opinions. For assaults from without are not so destructive as quarrels within; and this is so in bodies and in all other things. But in the mean while He draws instances from matters more known, saying, “Every kingdom divided against itself shall be brought to desolation;” for there is nothing on earth more powerful than a kingdom, and yet that is destroyed by contention. What then must we say concerning a city or a family; that whether it be great or small, it is destroyed when it is at discord within itself. Hilary: For a city or family is analogous to a kingdom; as it follows, “And every city or house divided against itself shall not stand.” Jerome: For as small things grow by concord, so the greatest fall to pieces through dissensions. Hilary: But the word of God is rich, and whether taken simply, or examined inwardly, it is needful for our advancement. Leaving therefore what belongs to the plain understanding thereof, let us dwell on some of the more secret reasons. The Lord is about to make answer to that which they had said concerning Beelzebub, and He casts upon those to whom He made answer a condition of their answering. Thus; The Law was from God and the promise of the kingdom to Israel was by the Law; but if the kingdom of the Law be divided in itself, it must needs be destroyed; and thus Israel lost the Law, when the nation whose was the Law, rejected the fulfilment of the Law in Christ. The city here spoken of is Jerusalem, which when it raged with the madness of its people against the Lord, and drove out His Apostles with the multitude of them that believed, after this division shall not stand; and thus (which soon happened in consequence of this division) the destruction of that city is declared. Again He puts another case, “And if Satan cast out Satan, he is divided against himself; how then shall hie kingdom stand? Jerome: As much as to say, If Satan fight against himself, and, daemon be an enemy to daemon, then must the end of the world be at hand, that these hostile powers should have no place there, whose mutual war is peace for men. Gloss. ord.: He holds them therefore in this dilemma. For Christ casts out daemons either by the power of God, or by the Prince of the daemons. If by the power of God, their accusations are malicious; if by the Prince of the daemons, his kingdom is divided, and will not stand, and therefore let them depart out of his kingdom. And this alternative He intimates that they had chosen for themselves, when they refused to believe in Him. Chrys.: Or thus; If he is divided, he is made weak, and perishes; but if he perishes, how can he cast out another? Hilary: Otherwise; If the daemon was driven to this division to the end that he should thus afflict the daemons, even thus must we attribute higher power to Him who made the division than to those who are thus divided; thus the kingdom of the Devil, after this division made, is destroyed by Christ. Jerome: But if ye think, ye Scribes and Pharisees, that the daemons depart out of the possessed in obedience to their Prince, that men may be imposed upon by a concerted fraud, what can ye say to the healing of diseases which the Lord also wrought? It is something more if ye assign to the daemons even bodily infirmities, and the signs of spiritual virtues."
