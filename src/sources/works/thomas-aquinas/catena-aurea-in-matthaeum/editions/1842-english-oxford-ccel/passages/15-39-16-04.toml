text = "39. And he sent away the multitude, and took ship, and came into the coasts of Magdala. 1. The Pharisees also with the Sadducees came, and tempting desired him that he would shew them a sign from heaven. 2. He answered and said unto them, “When it is evening, ye say, It will be fair weather: for the sky is red. 3. And in the morning, It will be foul weather today: for the sky is red and lowring. O ye hypocrites, ye can discern the face of the sky; but can ye not discern the signs of the times? 4. A wicked and adulterous generation seeketh after a sign; and there shall no sign be given unto it, but the sign of the prophet Jonas.” And he left them, and departed. Chrys.: As the Lord sent the multitudes away after the miracle of the five loaves, so also now, not on foot, but by boat, that the multitudes may not follow Him; “And He sent away the multitude, and entered into a ship, and came into the coasts of Magedan.” Aug., de Cons. Ev., ii, 51: Mark says Dalmanutha; no doubt the same place under a different name; for many copies of the Gospel according to Mark have Magedan. Raban.: This Magedan is the country opposite Gerasa, and is interpreted ‘fruits,’ or ‘a messenger.’ It signifies a garden, of which it is said, “A garden enclosed, a fountain sealed,” [Song of Songs 4:!2] wherein the fruits of virtues grow, and where the name of the Lord is announced. It teaches us that preachers having ministered the word to the multitude ought to be refreshed themselves with the fruits of the virtues within the chamber of their own heart. It follows; “And there come unto him Pharisees and Sadducees tempting him, and desired him to shew them a sign from heaven.” Remig.: Wondrous blindness of the Pharisees and Sadducees! They asked a sign from heaven, as though the things they now saw were not signs. John shews what sign it was they desired; for he relates, that after the feeding with the five loaves, the multitudes came to the Lord and said, “What sign doest thou, that we may see it and believe on thee? Our fathers did eat manna in the desert, as it is written, He gave them bread to eat from heaven.” [John 6:30-31] Therefore when they say here, Shew us a sign from heaven, they mean, Cause that it rain manna for one or two days, that the whole people may eat, as was done for a long time in the desert. He looking into their thoughts as God, and knowing that even if a sign from heaven should be shewed them they would not believe, would not give them the sign for which they asked, as it follows, “But he answered and said unto them, When the evening is come, ye say, It will be fair weather; for the sky is red, &c.” Jerome: This is not found in most copies of the Greek text [ed. note: That is, ver 2 and 3. They are omitted in many manuscripts and versions]. But the sense is clear, that fair and rainy days may be foretold by the condition and harmony of the elements. But the Scribes and Pharisees who seemed to be doctors of the Law could not discern the Saviour’s coming by the predictions of the Prophets. Aug., Quaest Ev., i, 20: We might also understand this saying, “When it is evening, ye say, It will be fair weather, for the sky is red,” in this way, By the blood of Christ’s passion at His first coming, indulgence of sin is given. “And in the morning, It will be foul weather today, for the sky is red and lowring;” that is, at His second coming He will come with fire before Him. Gloss.: Otherwise; “The sky is red and lowring;” that is, the Apostles suffer after the resurrection, by which ye may know that I shall judge hereafter; for if I spare not the good who are mine from present suffering, I shall not spare others hereafter; “Ye can therefore discern the face of the sky, but the signs of the times ye cannot.” Raban.: “The signs of the times” He means of His own coming, or passion, to which the evening redness of the heavens may be likened; and the tribulation which shall be before His coming, to which the morning redness with the lowring sky may be compared. Chrys.: As then in the sky there is one sign of fair weather, and another of rain, so ought ye to think concerning me; now, in this My first coming, there is need of these signs which are done in the earth; but those which are done in heaven are reserved for the time of the second coming. Now I come as a physician, then as a judge; now I come in secret, then with much pomp, when the powers of the heavens shall be shaken. But now is not the time of these signs, now have I come to die, and to suffer humiliations; as it follows, “An evil and adulterous generation seeketh after a sign, and there shall no sign he given it, but the sign of Jonas the prophet.” Aug.: This Matthew has already given; whence we may store up for our information, that the Lord spoke the same things many times, that where there are contradictions which cannot be explained, it may be understood that the same sayings were uttered on two different occasions. Gloss. interlin.: He says, “Evil and adulterous generation,” that is, unbelieving, having carnal, and not spiritual understanding. Raban.: To this generation that thus tempted the Lord is not given a sign from heaven, such as they sought for, though many signs are given on the earth; but only to the generation of such as sought the Lord, in whose sight He ascended into heaven, and sent the Holy Spirit. Jerome: But what is meant by the sign of Jonas has been explained above. Chrys.: And when the Pharisees heard this, they ought to have asked Him, What it was He meant? But they had not asked at first with any desire of learning, and therefore the Lord leaves them, as it follows, “And he left them, and went his way.” Jerome: That is, leaving the evil generation of the Jews, He passed over the strait, and the people of the Gentiles followed Him. Hilary: Observe, we do not read here as in other places, that He sent the multitudes away and departed; but because the error of unbelief held the minds of the presumptuous, it is said that He left them."
