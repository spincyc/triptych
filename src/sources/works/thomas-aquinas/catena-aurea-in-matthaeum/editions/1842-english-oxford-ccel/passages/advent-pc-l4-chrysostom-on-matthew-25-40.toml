physical_line_ranges = [[6252, 6252]]
text = "Chrys.: But if they are His brethren, why does He call them “the least?” Because they are lowly, poor, and outcast. By these He means not only the monks who have retired to the mountains, but every believer though he should be secular, though an hungred, or the like, yet He would have him obtain merciful succours, for baptism and communication of the Divine mysteries makes him a brother."
