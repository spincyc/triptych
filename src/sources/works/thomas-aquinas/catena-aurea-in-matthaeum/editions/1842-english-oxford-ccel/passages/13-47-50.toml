text = "47. “Again, the kingdom of heaven is like unto a net, that was cast into the sea, and gathered of every kind: 48. Which, when it was full, they drew to shore, and sat down, and gathered the good into vessels, but cast the bad away. 49. So shall it be at the end of the world: the angels shall come forth, and sever the wicked from the just, 50. And shall cast them into the furnace of fire: there shall be wailing and gnashing of teeth.” Chrys.: In the foregoing parables He has commended the Gospel preaching; now, that we may not trust in preaching only, nor think that faith alone is sufficient for our salvation, He adds another fearful parable, saying, “Again, the kingdom of heaven is like unto a net cast into the sea.” Jerome: In fulfilment of that prophecy of Hieremias, who said, “I will send unto you many fishers,” [Jer 16:16] when Peter and Andrew, James and John, heard the words, “Follow me, I will make you fishers of men,” they put together a net for themselves formed of the Old and New Testaments, and cast it into the sea of this world, and that remains spread until this day, taking up out of the salt and bitter and whirlpools whatever falls into it, that is good men and bad; and this is that He adds, “And gathered of every kind.” Gregory, Hom. in Ev., xi. 4: Or otherwise; The Holy Church is likened to a net, because it is given into the hands of fishers, and by it each man is drawn into the heavenly kingdom out of the waves of this present world, that he should not be drowned in the depth of eternal death. This net gathers of every kind of fishes, because the wise and the foolish, the free and the slave, the rich and the poor, the strong and the weak, are called to forgiveness of sin; it is then fully filled when in the end of all things the sum of the human race is completed. As it follows, “which, when it was filled, they drew out, and sitting down on the shore gathered the good into vessels, but the bad they cast away.” For as the sea signifies the world, so the sea shore signifies the end of the world; and as the good are gathered into vessels, but the bad cast away, so each man is received into eternal abodes, while the reprobate having lost the light of the inward kingdom are cast forth into outer darkness. But now the net of faith holds good and bad mingled together in one; but the shore shall discover what the net of the Church has brought to land. Jerome: For when the net shall be drawn to the shore, then shall be shewn the true test for separating the fishes. Chrys.: Wherein does this parable differ from the parable of the tares? There, as here, some perish and some are saved; but there, because of their heresy of evil dogmas; in the first parable of the sower, because of their not attending to what was spoken; here, because of their evil life, because of which, though drawn by the net, that is, enjoying the knowledge of God, they cannot be saved. And when you hear that the wicked are cast away, that you may not suppose that this punishment may be risked, He adds an exposition shewing its severity, saying, “These shall it be in the end of the world; the angels shall come forth and sever the wicked from among the just, and shall cast them into the furnace of fire, there shall be wailing and gnashing of teeth.” Though He elsewhere declares, that He shall separate them as a shepherd separates the sheep from the goats; He here declares, that the Angels shall do it, as also in the parable of the tares. Gregory: To fear becomes us here, rather than to expound; for the torments of sinners are pronounced in plain terms, that none might plead his ignorance, should eternal punishment be threatened in obscure sayings. Jerome: For when the end of the world shall be come, then shall be shewn the true test of separating the fishes, and as in a sheltered harbour the good shall be sent into the vessels of heavenly abodes, but the flame of hell shall seize the wicked to be dried up and withered."
