text = "32. “Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven. 33. But whosoever shall deny me before men, him will I also deny before my Father which is in heaven.” Chrys.: The Lord having banished that fear which haunted the minds of His disciples, adds further comfort in what follows, not only casting out fear, but by hope of greater rewards encouraging them to a free proclamation of the truth, saying, “Every man who shall confess me before men, I also will confess him before my Father which is in heaven.” And it is not properly “shall confess me,” but as it is in the Greek, “shall confess in me,” shewing that it is not by your own strength but by grace from above, that you confess Him whom you do confess. Hilary: This He says in conclusion, because it behoves them after being confirmed by such teaching, to have a confident freedom in confessing God. Remig.: Here is to be understood that confession of which the Apostle speaks, “With the heart men believe unto justification, with the mouth confession is made unto salvation.” [Rom 10:10] That none therefore might suppose that he could be saved without confession of the mouth, He says not only, “He that shall confess me,” but adds, “before me;” and again, “He that shall deny me before men, him will I also deny before my Father which is in heaven.” Hilary: This teaches us, that in what measure we have borne witness to Him upon earth, in the same shall we have Him to bear witness to us in heaven before the face of God the Father. Chrys.: Here observe that the punishment is manifold more than the evil done, and the reward more than the good done. As much as to say, your deed was more abundant in confessing or denying Me here; so shall My deed to you be more abundant in confessing or denying you there. Wherefore if you have done any good thing, and have not received retribution, be not troubled, for a manifold reward awaits you in the time to come. And if you have done any evil, and have not paid the punishment thereof, do not think that you have escaped, for punishment will overtake you, unless you are changed and become better. Raban.: It should be known that not even Pagans can deny the existence of God, but the infidels may deny that the Son as well as the Father is God. The Son confesses men before the Father, because by the Son we have access to the Father, and because the Son saith, “Come, ye blessed of my Father.” [Matt 25:34] Remig.: And thus He will deny the man that hath denied Him, in that he shall not have access to the Father through Him, and shall be banished from seeing either the Son of the Father in their divine nature. Chrys.: He not only requires faith which is of the mind, but confession which is by the mouth, that He may exalt us higher, and raise us to a more open utterance, and a larger measure of love. For this is spoken not to the Apostles only, but to all; He gives strength not to them only, but to their disciples. And he that observes this precept will not only teach with free utterance, but will easily convince all; for the observance of this command drew many to the Apostles. Raban.: Or, He confesses Jesus who by that faith that worketh by love, obediently fulfils His commands; he denies Him who is disobedient."
