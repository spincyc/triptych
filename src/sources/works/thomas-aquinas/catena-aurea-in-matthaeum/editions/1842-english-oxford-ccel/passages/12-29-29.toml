text = "29. “Or else how can one enter into a strong man’s house, and spoil his goods, except he first bind the strong man? and then he will spoil his house.” Chrys.: Having concluded the second answer, He brings forward yet a third, saying, “Or how can any enter into a strong man’s house? For that Satan cannot cast out Satan is clear from what has been said; and that no other can cast him out, till he have first overcome him, is plain to all. Thus the same as before is established yet more abundantly; for He says, So far am I from having the Devil for my ally, that I rather am at war with him, and bind him; and in that I cast out after this sort, I therein spoil his goods. Thus He proves the very contrary of that they strove to establish. They would shew that He did not cast out demons of His own power; He proves that not only daemons, yea but the prince, also of the daemons He hath bound, as is shewn by that which He hath wrought. For if their Prince were not overcome, how were the daemons who are His subjects thus spoiled. This speech seems also to me to be a prophecy; inasmuch as He not only casts out daemons, but will take away all error out of the world, and dissolve the craft of the Devil; and He says not rob, but spoil, shewing that He will do it with power. Jerome: His “house” is this world, which is set in evil, not by the majesty of the Creator, but by the greatness of the sinner. The strong man is bound and chained in tartarus, bruised by the Lord’s foot. Yet ought we not therefore to be careless; for here the conqueror Himself pronounces our adversary to be strong. Chrys.: He calls him “strong,” shewing therein his old reign, which arose out of our sloth. Aug.: For he held us, that we should not by our own strength be able to free ourselves from him, but by the grace of God. By his goods, he means all the unbelievers. He has bound the strong man, in that He has taken away from him all power of hindering the faithful from following Christ, and gaining the kingdom of heaven. Raban.: Therefore He has spoiled his house, in that them, whom He foresaw should be His own, He set free from the snares of the Devil, and has joined to the Church. Or in that He has divided the whole world among His Apostles and their successors to be converted. By this plain parable therefore He shews that He does not join in a deceitful working with the daemons as they falsely accused Him, but by the might of His divinity He frees men from the daemons."
