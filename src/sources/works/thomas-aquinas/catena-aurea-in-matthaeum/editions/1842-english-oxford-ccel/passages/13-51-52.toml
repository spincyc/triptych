text = "51. Jesus saith unto them, “Have ye understood all these things?” They say unto him, “Yea, Lord.” 52. Then said he unto them, “Therefore every Scribe which is instructed unto the kingdom of heaven is like unto a man that is an householder, which bringeth forth out of his treasure things new and old.” Gloss., non occ.: When the multitude had departed, the Lord spoke to His disciples in parables, by which they were instructed only so far as they understood them; wherefore He asks them, “Have ye understood all these things? They say unto him, Yea, Lord.” Jerome: For this is spoken especially to the Apostles, whom He would have not to hear only as the multitude, but to understand as having to teach others. Chrys.: Then He praises them because they had understood; He saith unto them; “Therefore every Scribe instructed in the kingdom of heaven is like unto an householder who bringeth out of his treasure things new and old.” Aug., City of God, book xx, ch. 4: He said not ‘old and new,’ as He surely would have said had He not preferred to preserve the order of value rather than of time. But the Manichaeans while they think they should keep only the new promises of God, remain in the old man of the flesh, and put on newness of error. Aug., Quaest. in Matt., q. 16: By this conclusion, whether did He desire to shew Aug. whom He intended by the treasure hid in the field — in which case we might understand the Holy Scriptures to be here meant, the two Testaments by the things new and old — or did He intend that he should be held learned in the Church who understood that the Old Scriptures were expounded in parables, taking rules from these new Scriptures, seeing that in them also the Lord proclaimed many things in parables. If He then, in whom all those old Scriptures have their fulfilment and manifestation, yet speaks in parables until His passion shall rend the vail, when there is nothing hid that shall not be revealed; much more those things which were written of Him so long time before we see to have been clothed in parables; which the Jews took literally, being unwilling to be learned in the kingdom of heaven. Gregory: But if by things “new and old” in this passage we understand the two Testaments, we deny Abraham to have been learned, who although he knew indeed some deeds of the Old Testament, yet had not read the words. Neither Moses may we compare to a learned householder, for although he composed the Old Testament, yet had he not the words of the New. But what is here said may be understood as meant not of those who had been, but of such as might hereafter be in the Church, who then “bring forth things new and old” when they speak the preachings of both Testaments, in their words and in their lives. Hilary: Speaking to His disciples, He calls them Scribes on account of their knowledge, because they understood the things that He brought forward, both new and old, that is from the Law and from the Gospels; both being of the same householder, and both treasures of the same owner. He compares them to Himself under the figure of a householder, because they had received doctrine of things both new and old out of His treasury of the Holy Spirit. Jerome: Or the Apostles are called Scribes instructed, as being the Saviour’s notaries who wrote His words and precepts on fleshly tables of the heart with the sacraments of the heavenly kingdom, and abounded in the wealth of a householder, bringing forth out of the stores of their doctrine things new and old; whatsoever they preached in the Gospels, that they proved by the words of the Law and the Prophets. Whence the Bride speaks in the Song of Songs [7:13]; “I have kept for thee my beloved the new with the old.” Gregory: Otherwise; The things old are, that the human race for its sin should suffer in eternal punishment; the things new, that they should be converted and live in the kingdom, First, He brought forward a comparison of the kingdom to a treasure found and a pearl of price; and after that, narrated the punishment of hell in the burning of the wicked, and then concluded with “Therefore every Scribe, &c.” as if He had said, He is a learned preacher in the Church who knows to bring forth things new concerning the sweetness of the kingdom, and to speak things old concerning the tenor of punishment; that at least punishment may deter those whom rewards do not excite."
