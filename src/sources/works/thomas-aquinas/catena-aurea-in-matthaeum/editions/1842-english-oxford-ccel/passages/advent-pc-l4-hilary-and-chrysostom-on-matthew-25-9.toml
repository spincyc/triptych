context = "Two consecutive Catena comments on go ye rather to them that sell (verse list at lines 6051-6063): Hilary, they that sell are the poor; Chrysostom, the poor are great merchants to us, found here and not there."
physical_line_ranges = [[6106, 6107]]
text = "Hilary: They that sell are the poor, who, needing the alms of the faithful, made them that recompense which they desire, selling in return for the relief afforded to their wants, a consciousness of good works. This is the abundant fuel of an undying light which may be bought and stored up for the fruits of mercy. Chrys.: You see then how great merchants the poor are to us; but the poor are not there, but here, and therefore we must store up oil here, that we may have it to use there when occasion shall require."
