text = "5. Then went out to him Jerusalem, and all Judaea, and all the region round about Jordan, 6. And were baptized of him in Jordan, confessing their sins. Pseudo-Chrys.: Having described the preaching of John, he goes on to say, “There went out to him,” for his severe life preached yet more loudly in the desert than the voice of his crying. Chrys.: For it was wonderful to see such fortitude in a human body; this it was that chiefly attracted the Jews, seeing in him the great Elias. It also contributed to fill them with wonder that the grace of Prophecy had long failed among them, and now seemed to have at length revived. Also the manner of his preaching being other than that of the old prophets had must effect; for now they heard not such things as they were wont to hear, such as wars, and conquests of the king of Babylon, or of Persia; but of Heaven and the Kingdom there, and the punishment of hell. Gloss. interlin.: This baptism was only a forerunning of that to come, and did not forgive sins. [ed. note: Tertullian (de Bapt. 10. 11) S. Jerome (adv. Lucifer. 7) S. Gregory (Hom. in Evang. vii. 3) Theophylact in Marc. ch. i. S. Augustine (de Bapt. e Donat. v. 10) considered that S. John’s baptism gave a sort of suspensive or implicit remission, to be realized in the Atonement; and S. Cyril. Hieros. Cat. iii. 7-9. S. Greg. Nyss. in laud. Bas. t. 3. p. 482. vid. Dr. Pusey on Baptism, Ed. 2. pp. 242-271] Remig.: The baptism of John bare a figure of the catechumens. As children are only catechized that they may become meet for the sacrament of Baptism; so John baptized, that they who were thus baptized might afterwards by a holy life become worthy of coming to Christ’s baptism. He baptized in Jordan, that the door of the Kingdom of Heaven might be there opened, where an entrance had been given to the children of Israel into the earthly kingdom of promise. Pseudo-Chrys.: Compared with the holiness of John, who is there that can think himself righteous? As a white garment if placed near snow would seem foul by the contrast; so compared with John every man would seem impure; therefore they confessed their sins. Confession of sin is the testimony of a conscience fearing God. And perfect fear takes away all shame. But there is seen the shame of confession where there is no fear of the judgment to come. But as shame itself is a heavy punishment, God therefore bids us confess our sins that we may suffer this shame as punishment; for that itself is a part of the judgment. Rabanus: Rightly are they who are to be baptized said to go out to the Prophet; for unless one depart from sin, and renounce the pomp of the Devil, and the temptations of the world, he cannot receive a healing baptism. Rightly also in Jordan, which means their descent, because they descended from the pride of life to the humility of an honest confession. Thus early was an example given to them that are to be baptized of confessing their sins and professing amendment."
