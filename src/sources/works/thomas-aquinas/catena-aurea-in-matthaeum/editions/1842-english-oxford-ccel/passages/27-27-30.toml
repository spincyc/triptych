text = "27. Then the soldiers of the governor took Jesus into the common hall, and gathered unto him the whole band of soldiers. 28. And they stripped him, and put on him a scarlet robe. 29. And when they had platted a crown of thorns, they put it upon his head, and a reed in his right hand: and they bowed the knee before him, and mocked him, saying, “Hail, king of the Jews!” 30. And they spit upon him, and took the reed and smote him on the head. Aug., de Cons. Ev., iii, 9: After the Lord’s trial comes His Passion, which thus begins, “Then the soldiers of the governor took Jesus into the common hall,” &c. Jerome: He had been styled King of the Jews, and the Scribes and Priests had brought this charge against Him, that He claimed sovereignty over the Jewish nation; hence this mockery of the soldiers, taking away His own garments, they put on Him a scarlet cloak to represent that purple fringe which kings of old used to wear, for the diadem they put on Him a crown of thorns, and for the regal sceptre give Him a reed, and perform adoration to Him as to a king. Aug.: Hence we understand what Mark means by “clothed him with purple;” [Mark 15:17] instead of the royal purple, this scarlet cloak was used in mockery; and there is a shade of purple which is very like scarlet. Or it may be, that Mark spoke of the purple which the cloak contained, though its colour was scarlet. Chrys., Hom. lxxxvii: What should we henceforth care if any one insults us, after Christ has thus suffered? The utmost that cruel outrage could do was put in practice against Christ; and not one member only, but His whole body suffered injuries; His head from the crown, the reed, and the buffetings; His face which was spit upon; His cheeks which they smote with the palms of their hands; His whole body from the scourging, the stripping to put on the cloak, and the mockery of homage; His hands from the reed which they put into them in mimicry of a sceptre; as though they were afraid of omitting aught of indignity. Aug.: But Matthew seems to introduce this here as recollected from above, not that it was done at the time Pilate gave Him up for crucifixion. For John puts it before He is given up by Pilate. Jerome: All these things we may understand mystically. For as Caiaphas said that “it is expedient that one man should die for the people,” [John 11:50] not knowing what he said, so these, in all they did, furnished sacraments to us who believe, though they did them with other intention. In the scarlet robe He bears the bloody works of the Gentiles; by the crown of thorns He takes away the ancient curse; with the reed He destroys poisonous animals; or He held the reed in His hand wherewith to write down the sacrilege of the Jews. Hilary: Or otherwise; The Lord having taken upon Him all the infirmities of our body, is then covered with the scarlet coloured blood of all the martyrs, to whom is due the kingdom with Him; He is crowned with thorns, that is, with the sins of the Gentiles who once pierced Him, for there is a prick in thorns of which is woven the crown of victory for Christ. In the reed, He takes into His hand and supports the weakness and frailty of the Gentiles; and His head is smitten therewith that the weakness of the Gentiles sustained by Christ’s hand may rest on God the Father, who is His head. Origen: Or, The reed was a mystery signifying that before we believed we trusted in that reed of Egypt, or Babylon, or of some other kingdom opposed to God, which He took that He might triumph over it with the wood of the cross. With this reed they smite the head of Christ, because this kingdom ever beats against God the Father, who is the head of the Saviour. Remig.: Or otherwise, By the scarlet robe is denoted the Lord’s flesh, which is spoken of as red by reason of shedding of His blood; by the crown of thorns His taking upon Him our sins, because He appeared “in the likeness of sinful flesh.” [Rom 8:3] Raban.: They smite the head of Christ with a reed, who speak against His divinity, and endeavour to maintain their error by the authority of Holy Scripture, which is written by a reed. They spit upon His face who reject in abominable words the presence of His grace, and deny that Jesus is come in the flesh. And they mock Him with adoration who believe on Him, but despise Him with perverse works. Aug., Quaest. Ev., ii, in fin: That they took from off the Lord in His passion His own garment, and put on Him a coloured robe, denotes those heretics who said that He had a shadowy, and not a real body."
