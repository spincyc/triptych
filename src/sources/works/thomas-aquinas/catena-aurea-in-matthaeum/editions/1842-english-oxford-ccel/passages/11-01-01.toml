text = "1. And it came to pass, when Jesus had made an end of commanding his twelve disciples, he departed thence to teach and to preach in their cities. Rabanus: The Lord having sent out His disciples to preach with the foregoing instructions, Himself now fulfils in action what He had taught in words, offering His preaching first to the Jews; “And it came to pass when Jesus had ended all these sayings, he passed thence.” Chrys., Hom, xxxvi: Having sent them forth, He withdrew Himself, giving them opportunity and time to do the things that He had enjoined; for while He was present and ready to heal, no man would come to His disciples. Remig.: He well passes from the special teaching which He had delivered to His disciples, to the general which He preached in the cities; passing therein as it were from heaven to earth, that He might give light to all. By this deed of the Lord, all holy preachers are admonished that they should study to benefit all."
