  { line = 3259, text = "Chrys.: Otherwise according to the first exposition. The Jews were indeed ignorant of Christ, but of the Holy Ghost they had had a sufficient communication, for the Prophets spake by Him. What He here saith then is this; Be it that ye have stumbled at Me because of the flesh which is around Me; but can ye in the same manner say of the Holy Spirit, We know Him not? Wherefore this blasphemy cannot be forgiven you, and ye shall be punished both here and hereafter, for since to cast out daemons and to heal diseases are of the Holy Spirit, you do not speak evil against Me only, but also against Him; and so your condemnation is inevitable both here and hereafter." },
  { line = 3260, text = "For there are who are punished in this life only; as they who among the Corinthians were unworthy partakers of the mysteries; others who are punished only in the life to come, as the rich man in hell; but those here spoken of are to be punished both in this world, and in the world to come, as were the Jews, who suffered horrible things in the taking of Jerusalem, and shall there undergo most heavy punishment." },
  { line = 3261, text = "Gloss., ap. Anselm, vid. infra in cap. 25: This passage destroys that heresy of Origen, who asserted that after many ages all sinners should obtain pardon; for it is here said, this shall not be forgiven either in this world, or in the world to come." },
  { line = 3262, text = "Greg., Dial., iv, 39: Hence we may gather that there are some sins that are remitted in this world, and some in the world to come; for what is denied of one sin, must be supposed to be admitted of others. And this may be believed in the case of trifling faults; such as much idle discourse, immoderate laughter, or the sin of carefulness in our worldly affairs, which indeed can hardly be managed without sin even by one who knows how he ought to avoid sin; or sins through ignorance (if they be lesser sins) which burden us even after death, if they have not been remitted to us while yet in this life. But it should be known that none will there obtain any purgation even of the least sin, but he who by good actions has merited the same in this life." },
]
