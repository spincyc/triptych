text = "31. “Wherefore I say unto you, All manner of sin and blasphemy shall be forgiven unto men: but the blasphemy against the Holy Ghost shall not be forgiven unto men, 32. And whosoever speaketh a word against the Son of man, it shall be forgiven him: but whosoever speaketh against the Holy Ghost, it shall not be forgiven him, neither in this world, neither in the world to come.” Chrys.: The Lord had refuted the Pharisees by explaining His own actions, and He now proceeds to terrify them. For this is no small part of correction, to threaten punishment, as well as to set right false accusation. Hilary: He condemns by a most rigorous sentence this opinion of the Pharisees, and of such as thought with them, promising pardon for all sins, but releasing it to blasphemy against the Spirit; “Wherefore I say unto you, All manner of sin and blasphemy shall be forgiven unto men.” Remig.: But it should be known that they are not forgiven to all men universally, but to such only as have performed due penitence for their guiltinesses. So by these words is overthrown the error of Novatian, who said that the faithful could not rise by penitence after a fall, nor merit pardon of their sins, especially they who in persecution denied. [ed. note: Novatian, a presbyter of Rome, separated from the Church in the middle of the third century, and formed a sect, on the ground of the Church’s restoring the lapsed in persecution upon their repentance. In consequence they considered the Church in a state of corruption, and they were led to maintain that none were in God’s favour who had sinned grievously after Baptism] Aug., Serm., 71, 13: For what difference does it make to the purpose, whether it be said, “The spirit of blasphemy shall not be forgiven,” or, “Whoso shall blaspheme against the Holy Spirit it shall not be forgiven him,” as Luke speaks [Luke 12:10]; except that the same sense is expressed more clearly in the one place than in the other, the one Evangelist not overthrowing but explaining the other? “The spirit of blasphemy” it is said shortly, not expressing what spirit; to make which clear it is added, “And whoso shall speak a word against the Son of man, it shall be forgiven him.” After having said the same of all manner of blasphemy, He would in a more particular way speak of that blasphemy which is against the Son of Man, and which in the Gospel according to John He shews to be very heavy, where He says concerning the Holy Ghost, “He shall convince the world of sin, of righteousness, and of judgment; of sin, because they believe not on me.” That then which here follows, “He who shall speak a word against the Holy Ghost, it shall not be forgiven him, neither in this world, nor in that which is to come,” is not said because the Holy Spirit is in the Trinity greater than the Son, which no heretic ever affirmed. Hilary: And what is so beyond all pardon as to deny that in Christ which is of God, and to take away the substance of the Father’s Spirit which is in Him, seeing that He performs every work in the Spirit of God, and in Him God is reconciling the world unto Himself. Jerome: Or the passage may be thus understood; Whoso speaks a word against the Son of Man, as stumbling at My flesh, and thinking of Me as no more than man, such opinion and blasphemy though it is not free from the sin of heresy, yet finds pardon because of the little worth of the body. But whoso plainly perceiving the works of God, and being unable to deny the power of God, speaks falsely against them prompted by jealousy, and calls Christ who is the Word of God, and the works of the Holy Ghost, Beelzebub, to him it shall not be forgiven, neither in this world, nor in the world to come. Aug.: But if this were said in such manner, then every other kind of blasphemy is omitted, and that only which is spoken against the Son of Man, as when He is pronounced to be mere man, is to be forgiven. That then that is said, “All manner of sin and blasphemy shall be forgiven unto men,” without doubt blasphemy spoken against the Father is included in its largeness; though here again that alone is declared irremissible which is spoken against the Holy Ghost. What then, hath the Father also taken upon Him the form of a servant, that the Holy Ghost is thus as it were spoken of as greater? For who could not be convicted of having spoken a word against the Holy Spirit, before He become a Christian or a Catholic? First, the Pagans themselves when they say that Christ wrought miracles by magic arts, are they not like those who said that He cast out daemons by the Prince of the demons? Likewise the Jews and all such heretics as confess the Holy Spirit, but deny that He is in the body of Christ, which is the Church Catholic, are like the Pharisees, who denied that the Holy Spirit was in Christ. Some heretics even contend that the Holy Spirit Himself is either a creature, as the Arians, Eunomians, and Macedonians, or deny Him at least in such sort that they may deny the Trinity in the Godhead; others assert that the Father alone is God, and the same is sometimes spoken of as the Son, sometimes as the Holy Spirit, as the Sabellians. The Photinians also say, that the Father only is God, and that the Son is nothing more than a man, and deny altogether that there is any third Person, the Holy Spirit. It is clear then that the Holy Spirit is blasphemed, both by Pagans, Jews, and heretics. Are all such then to be left out, and looked upon as having no hope? For if the word they have spoken against the Holy Spirit is not forgiven them, then in vain is the promise made to them, that in Baptism or in the Church they should receive the forgiveness of their sins. For it is not said, ‘It shall not be forgiven him in Baptism;’ but, “Neither in this world, nor in the world to come;” and so they alone are to be supposed clear of the guilt of this most heavy sin who have been Catholics from their infancy. Some again think that they only sin against the Holy Ghost, who having been washed in the laver of regeneration in the Church, do afterwards, as though ungrateful for such a gift of the Saviour, plunge themselves into some deadly sin, such as adultery, murder, or quitting the Christian name, or the Church Catholic. But whence this meaning can be proved, I know not; since place for penitence of sins however great was never denied in the Church, and even heretics are exhorted to embrace it by the Apostle. “If God peradventure will give them repentance to the acknowledging of the truth.” [2 Tim 2:25] Lastly, the Lord says not, ‘If any Catholic believer,’ but, “Whoso shall speak a word,” that is, whosoever, “it shall not be forgiven him neither in this world, nor in the world to come.” Aug., Serm. in Mount, 1, 22: Otherwise; The Apostle John says, “There is a sin unto death; I do not say that he shall pray for it.” [1 John 5:16] This sin of the brother unto death I judge to be, when any one having come to the knowledge of God, through the grace of our Lord Jesus Christ, opposes Himself against the brotherhood, or is roused by the fury of jealousy against that grace by which he was reconciled to God. The stain of this sin is so great, that it may not submit to the humility of prayer, even when the sinful conscience is driven to acknowledge and proclaim its own sin. Which state of mind because of the greatness of their sin we must suppose some may be brought to; and this perhaps may be to sin against the Holy Ghost, that is through malice and jealousy to assail brotherly charity after having received the grace of the Holy Spirit; and this sin the Lord declares shall be forgiven neither in this world, nor in that to come. Whence it may be enquired whether the Jews sinned this sin against the Holy Ghost when they said that the Lord cast out daemons by Beelzebub the Prince of the daemons. Are we to suppose this spoken of our Lord Himself, because He said in another place, “If they have called the master of the house Beelzebub, how much more they of his household?” [Matt. 10:24] Seeing they thus spoke out of jealousy, ungrateful for so great present benefits, are they, though not Christians, to be supposed by the very greatness of that jealousy to have sinned the sin against the Holy Spirit? This cannot be gathered from the Lord’s words. Yet He may seem to have warned them that they should come to grace, and that after that grace received they should not sin as they now sinned. For now their evil word had been spoken against the Son of Man, but it might be forgiven them, if they should be converted, and believe on Him. But if after they had received the Holy Spirit, they should be jealous against the brotherhood, and should fight against that grace which they had received, it should not be forgiven them neither in this world, nor in the world to come. For if He had there condemned them in such sort that no hope remained for them, He would not have added an admonition, “Either make the tree good, &c.” Aug., Retract., i, 19: But I do not say this for certain, by saying that I think thus; yet thus much might have been added; If he should close this life in this impious hardness of heart, yet since we may not utterly despair of any however evil, so long as he is in this life, so neither is it unreasonable to pray for him of whom we do not despair. Aug., Serm., 71, 8: Yet is this enquiry very mysterious. Let us then seek the light of exposition from the Lord. I say unto you, beloved, that in all Holy Scripture there is not perhaps so great or so difficult a question as this. First then I request you to note that the Lord said not, Every blasphemy against the Spirit shall not be forgiven, nor, Whoso shall speak any word against — but, “Whoso shall speak the word.” Wherefore it is not necessary to think that every blasphemy and every word spoken against the Holy Spirit shall be without pardon; it is only necessary that there be some word which if spoken against the Holy Spirit shall be without pardon. For such is the manner of Scripture, that when any thing is so declared in it as that it is not declared whether it is said of the whole, or a part, it is not necessary that because it can apply to the whole, it therefore is not to be understood of the part. As when the Lord said to the Jews, “If I had not come and spoken unto them, they had not had sin,” [John 15:22] this does not mean that the Jews would have been altogether without sin, but that there was a sin they would not have had, if Christ had not come. What then is this manner of speaking against the Holy Ghost, comes now to be explained. Now in the Father is represented to us the Author of all things, in the Son birth, in the Holy Spirit community of the Father and the Son. What then is common to the Father and the Son, through that they would have us have communion among ourselves and with them; “The love of God is shed abroad in our hearts by the Holy Ghost which he hath given us,” [Rom 5:5] and because by our sins we were alienated from the possession of true goods, “Charity shall cover the multitude of sins.” [1 Pet 4:8] And for that Christ forgives sins through the Holy Spirit, hence may be understood how, when He said to his disciples, “Receive ye the Holy Spirit,” [Jon 20:22] He subjoined straight, “Whosoever sins ye forgive, they shall be forgiven them.” The first benefit therefore of them that believe is forgiveness of sins in the Holy Spirit. Against this gift of free grace the impenitent heart speaks; impenitence itself therefore is the blasphemy against the Spirit which shall not be forgiven, neither in this world, nor in that to come. For indeed he speaks the evil word against the Holy Spirit either in his thought, or with his tongue, who by his hard and impenitent heart treasures up for himself wrath against the day of wrath. Such impenitence truly has no forgiveness, neither in this world nor in the world to come, for penitence obtains forgiveness in this world which shall hold in the world to come. But that impenitence as long as any lives in the flesh may not be judged, for we must despair of none so long as the patience of God leads to repentance. For what if those whom you discover in any manner of sin, and condemn as most desperate, should before they close this life betake themselves to penitence, and find true life in the world to come? But this kind of blasphemy though it be long, and comprised in many words, yet the Scripture is wont to speak of many words as one word. It was more than a single word which the Lord spoke with the prophet, and yet we read, The word which came unto this or that prophet. Here perhaps some may enquire whether the Holy Spirit only forgives sins, or the Father and the Son likewise. We answer the Father and the Son likewise; for the Son Himself saith of the Father, “Your Father shall forgive you your sins,” [Matt 6:14] and He saith of Himself, “The Son of Man hath power on earth to forgive sins.” [Matt 9:6] Why then is that impenitence which is never forgiven, spoken of as blasphemy against the Holy Spirit only? Forasmuch as he who falls under this sin of impenitence seems to resist the gift of the Holy Spirit, because in that gift is conveyed remission of sin. But sins, because they are not remitted out of the Church, must be remitted in that Spirit by which the Church is gathered into one. Thus this remission of sins which is given by the whole Trinity is said to be the proper office of the Holy Spirit alone, for it is He, “The Spirit of adoption, in which we cry, Abba Father,” [Rom 8:15] so that to Him we may pray, “Forgive us our sins; And hereby we know:” speaks John, “that Christ abideth in us, by the Holy Spirit which He hath given unto us.” [1 John 4:13] For to Him belongs that bond by which we are made one body of the only-begotten Son of God; for the Holy Spirit Himself is in a manner the bond of the Father and the Son. Whosoever then shall be found guilty of impenitence against the Holy Spirit, in whom the Church is gathered together in unity and one bond of communion, it is never remitted to him. Chrys.: Otherwise according to the first exposition. The Jews were indeed ignorant of Christ, but of the Holy Ghost they had had a sufficient communication, for the Prophets spake by Him. What He here saith then is this; Be it that ye have stumbled at Me because of the flesh which is around Me; but can ye in the same manner say of the Holy Spirit, We know Him not? Wherefore this blasphemy cannot be forgiven you, and ye shall be punished both here and hereafter, for since to cast out daemons and to heal diseases are of the Holy Spirit, you do not speak evil against Me only, but also against Him; and so your condemnation is inevitable both here and hereafter. For there are who are punished in this life only; as they who among the Corinthians were unworthy partakers of the mysteries; others who are punished only in the life to come, as the rich man in hell; but those here spoken of are to be punished both in this world, and in the world to come, as were the Jews, who suffered horrible things in the taking of Jerusalem, and shall there undergo most heavy punishment. Gloss., ap. Anselm, vid. infra in cap. 25: This passage destroys that heresy of Origen, who asserted that after many ages all sinners should obtain pardon; for it is here said, this shall not be forgiven either in this world, or in the world to come. Greg., Dial., iv, 39: Hence we may gather that there are some sins that are remitted in this world, and some in the world to come; for what is denied of one sin, must be supposed to be admitted of others. And this may be believed in the case of trifling faults; such as much idle discourse, immoderate laughter, or the sin of carefulness in our worldly affairs, which indeed can hardly be managed without sin even by one who knows how he ought to avoid sin; or sins through ignorance (if they be lesser sins) which burden us even after death, if they have not been remitted to us while yet in this life. But it should be known that none will there obtain any purgation even of the least sin, but he who by good actions has merited the same in this life."
