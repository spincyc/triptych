text = "10. “Blessed are they which are persecuted for righteousness’ sake: for theirs is the kingdom of heaven.” Chrys.: “Blessed are they who suffer persecution for righteousness’ sake,” that is for virtue, for defending others, for piety, for all these things are spoken of under the title of righteousness. This follows the beatitude upon the peacemakers, that we may not be led to suppose that it is good to seek peace at all times. Aug., Serm. in Mont., i, 2: When peace is once firmly established within, whatever persecutions he who has been cast without raises, or carries on, he increases that glory which is in the sight of God. Jerome: “For righteousness’ sake” He adds expressly, for many suffer persecution for their sins, and are not therefore righteous. Likewise consider how the eighth beatitude of the true circumcision is terminated by martyrdom. [margin note: vid. Phil. 3:2-3] Pseudo-Chrys.: He said not, Blessed are they who suffer persecution of the Gentiles; that we may not suppose the blessing pronounced on those only who are persecuted for refusing to sacrifice to idols; yea, whoever suffers persecution of heretics because he will not forsake the truth is likewise blessed, seeing he suffers for righteousness. Moreover, if any of the great ones, who seem to be Christians, being corrected by you on account of his sins, shall persecute you, you are blessed with John the Baptist. For if the Prophets are truly martyrs when they are killed by their own countrymen, without doubt he who suffers in the cause of God has the reward of martyrdom though he suffers from his own people. Scripture therefore does not mention the persons of the persecutors, but only the cause of persecution, that you may learn to look, not by whom, but why you suffer. Hilary: Thus, lastly, He includes those in the beatitude whose will is ready to suffer all things for Christ, who is our righteousness. For these then also is the kingdom preserved, for they are in the contempt of this world poor in spirit. Aug.: Or, the eighth beatitude, as it were, returns to the commencement, because it shews the perfect complete character. In the first then and the eighth, the kingdom of heaven is named, for the seven go to make the perfect man, the eighth manifests and proves his perfectness, that all may be conducted to perfection by these steps. Ambrose, in Luc., vi. 23: Otherwise; the first kingdom of heaven was promised to the Saints, in deliverance from the body; the second, that after the resurrection they should be with Christ. For after your resurrection you shall begin to possess the earth delivered from death, and in that possession shall find comfort. Pleasure follows comfort, and Divine mercy pleasure. But on whom God has mercy, him He calls, and he whom He calls, beholds Him that called him. He who beholds God is adopted into the rights of divine birth, and then at length as the son of God is delighted with the riches of the heavenly kingdom. The first then begins, the last is perfected. Chrys.: Wonder not if you do not hear ‘the kingdom’ mentioned under each beatitude; for in saying “shall be comforted, shall find mercy,” and the rest, in all these the kingdom of heaven is tacitly understood, so that you must not look for any of the things of sense. For indeed he would not be blessed who was to be crowned with those things which depart with this life. Aug.: The number of these sentences should be carefully attended to; to these seven degrees of blessedness agree the operation of that seven-form Holy Spirit which Isaiah described. But as He began from the highest, so here He begins from the lowest; for there we are taught that the Son of God will descend to the lowest; here that man will ascend from the lowest to the likeness of God. Here the first place is given to fear, which is suitable for the humble, of whom it is said, “Blessed are the poor in spirit,” that is, those who think not high things, but who fear. The second is piety, which belongs to the meek; for he who seeks piously, reverences, does not find fault, does not resist; and this is to become meek. The third is knowledge, which belongs to those that mourn, who have learned to what evils they are enslaved which they once pursued as goods. The fourth, which is fortitude, rightly belongs to those who hunger and thirst, who seeking joy in true goods, labour to turn away from earthly lusts. The fifth, counsel, is appropriate for the merciful, for there is one remedy to deliver from so great evils, viz. to give and to distribute to others. The sixth is understanding, and belongs to the pure in heart, who with purged eye can see what eye seeth not. The seventh is wisdom, and may be assigned to the peacemakers, in whom is no rebellious motion, but they obey the Spirit. Thus the one reward, the kingdom of heaven, is put forth under various names. In the first, as was right, is placed the kingdom of heaven, which is the beginning of perfect wisdom; as if it should be said, “The fear of the Lord is the beginning of wisdom.” To the meek, an inheritance, as to those who with piety seek the execution of a father’s will. To those that mourn, comfort, as to persons who know what they had lost, and in what they were immersed. To the hungry, plenty, as a refreshment to those who labour for salvation. To the merciful, mercy, that to those who have followed the best counsel, that may be shewed which they have shewed to others. To the pure in heart the faculty of seeing God, as to men bearing a pure eye to understand the things of eternity. To the peacemakers, the likeness of God. And all these things we believe may be attained in this life, as we believe they were fulfilled in the Apostles; for as to the things after this life they cannot be expressed in any words."
