text = "34. And when they were gone over, they came into the land of Gennesaret. 35. And when the men of that place had knowledge of him, they sent out into all that country round about, and brought unto him all that were diseased; 36. And besought him that they might only touch the hem of his garment: and as many as touched were made perfectly whole. Remig.: The Evangelist had related above that the Lord had commanded His disciples to enter the boat, and to go before Him across the strait; he now proceeds with the same intention to relate whither they arrived by their passage, “And when they were gone over, they came into the land of Gennezareth.” Raban.: The land of Gennezar, by the lake of Gennezareth, takes its name from a natural power which it is said to have of spontaneously modulating its waters so as to excite a breeze; the Greek words importing, ‘creating for itself the breeze.’ Chrys.: But the Evangelist shews that it was now long time since Christ had come into these parts; for it follows, “And where the men of that place knew him, they sent into all that region.” Jerome: They knew Him by fame, not by sight; although indeed by reason of the greatness of the signs which He did among the people, He was known by face to great numbers. And note how great the faith of the men of the land of Gennezareth, that they were not content with the healing of the men of that country only, but sent to all the towns round about. Chrys.: Nor do they now as before drag Him to their houses, and seek the touch of His hand, but they draw Him by their greater faith, for they brought unto him all them that were sick, and besought him that they might touch but the hem of his garment. For the woman who suffered under the issue of blood had taught them all this wisdom, namely, that by touching the hem only of Christ’s garment they might be saved. Therefore it follows, “And as many as touched, were made whole.” Jerome: If we knew what the word Gennezareth would convey in our tongue, we might understand how under the type of the Apostles and the boat, Jesus guides to shore the Church when He has delivered it from the wreck of persecution, and makes it to rest in a most tranquil harbour. Raban.: Genezar is interpreted, ‘rise,’ ‘beginning.’ For then will complete rest be given to us, when Christ shall have restored to us our inheritance of Paradise, and the joy of our first robe. Hilary: Otherwise; When the times of the Law were ended, and five thousand out of Israel were entered within the Church, it was then that the people of believers met Him, then those that were saved out of the Law by faith set before the Lord the rest of their sick and weak; and they that were thus brought sought to touch the hem of His garment, because through their faith they would be healed. And as the virtue of the hem proceeded from the whole garment, so the virtue of the grace of the Holy Spirit went forth from our Lord Jesus Christ, and imparted to the Apostles, who proceeded as it were from the same body, administers salvation to such as desire to touch. Jerome: Or, by the hem of the garment understand His least commandment, which whosoever transgresses, shall be called least in the kingdom of heaven; or, again, His assumption of the body, by which we come to the Word of God. Chrys.: But we have not a hem or a garment only of Christ, but have even His body, that we may eat thereof. If then they who touched the hem of His garment derived so much virtue therefrom, much more they that shall receive Himself whole."
