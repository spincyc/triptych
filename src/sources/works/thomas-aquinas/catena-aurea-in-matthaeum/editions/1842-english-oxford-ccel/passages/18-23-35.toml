  { line = 4627, text = "Never; that “until” is put for infinity; and the meaning is, He shall be ever paying, and shall never quit the debt, but shall be ever under punishment." },
  { line = 4628, text = "Chrys.: By this is shewn that his punishment shall be increasing and eternal, and that he shall never pay. And however irrevocable are the graces and callings of God, yet wickedness has that force, that it seems to break even this law." },
  { line = 4629, text = "Aug., Serm., 83, 7: For God says, “Forgive, and ye shall be forgiven;” [Luke 6:37] I have first forgiven, forgive you then after Me; for if you forgive not, I will call you back, and will require again all that I had remitted to you. For Christ neither deceives nor is deceived; and He adds here, “Thus will my heavenly Father do unto you, if ye from your hearts forgive not every one his brother their trespasses.” It is better that you should cry out with your mouth, and forgive in your heart, than that you should speak smoothly, and be unrelenting in your heart. For the Lord adds, “From your hearts,” to the end that though, out of affection you put him to discipline, yet gentleness should not depart out of your heart." },
  { line = 4630, text = "What is more beneficial than the knife of the surgeon? He is rough with the sore that the man may be healed; should he be tender with the sore, the man were lost." },
  { line = 4631, text = "Jerome: Also this, “from your hearts,” is added to take away all feigned reconciliations. Therefore the Lord’s command to Peter under this similitude of the king and his servant who owed him ten thousand talents, and was forgiven by his lord upon his entreaty, is, that he also should forgive his fellow servants their lesser trespasses." },
  { line = 4632, text = "Origen: He seeks to instruct us, that we should be ready to shew clemency to those who have done us harm, especially if they offer amends, and plead to have forgiveness." },
  { line = 4633, text = "Raban.: Allegorically; The servant here who owed the ten thousand talents, is the Jewish people bound to the Ten Commandments in the Law. These the Lord oft forgave their trespasses, when being in difficulties they besought His mercy; but when they were set free, they exacted the utmost with great severity from all their debtors; and of the gentile people which they hated, they required circumcision and the ceremonies of the Law; yea, the Prophets and Apostles they barbarously put to death. For all this the Lord gave them over into the hands of the Romans as to evil spirits, who should punish them with eternal tortures." },
]
