text = "21. And she shall bring forth a Son, and thou shalt call His name Jesus: for He shall save His people from their sins. Chrys.: What the Angel thus told Joseph, was beyond human thought, and the law of nature, therefore he confirms his speech not only be revealing to him what was past, but also what was to come; “She shall bring forth a Son.” Gloss., ap Anselm: That Joseph should not suppose that he was no longer needed in this wedlock, seeing the conception had taken place without his intervention, the Angel declares to him, that though there had been no need of him in the conception, yet there was need of his guardianship; for the Virgin should bear a Son, and then he would be necessary both to the Mother and her Son; to the Mother to screen her from disgrace, to the Son to bring Him up and to circumcise Him. The circumcision is meant when he says, “And thou shalt call His name Jesus;” for it was usual to give the name in circumcision. Pseudo-Chrys.: He said not, “Shall bear thee a Son,” as to Zacharias, “Behold, Elisabeth thy wife shall bear thee a son.” For the woman who conceives of her husband, bears the son to her husband, because he is more of him than of herself; but she who had not conceived of man, did not bear the Son to her husband, but to herself. Chrys.: Or, he left it unappropriated, to shew that she bare Him to the whole world. Raban.: “Thou shalt call His name,” he says, and not, “shalt give Him a name,” for His name had been given from all eternity. Chrys.: This further shews that this birth should be wonderful, because it is God that sends down His name from above by His Angel; and that not any name, but one which is a treasure of infinite good. Therefore also the Angel interprets it, suggesting good hope, and by this induces him to believe what was spoken. For we lean more easily to prosperous things, and yield our belief more readily to good fortune. Jerome: Jesus is a Hebrew word, meaning Saviour. He points to the etymology of the name, saying, “For He shall save His people from this sins.” Remig.: He shews the same man to be the Saviour of the whole world, and the Author of our salvation. He saves indeed not the unbelieving, but His people; that is, He saves those that believe on Him, not so much from visible as from invisible enemies; that is, from their sins, not by fighting with arms, but by remitting their sins. Chrysologus: Let them approach to hear this, who ask, Who is He that Mary bare? “He shall save His people;” not any other man’s people; from what? “from their sins.” That it is God that forgives sins, if you do not believe the Christians so affirming, believe the infidels, or the Jews who say, “None can forgive sins but God only.” [Luke 5:1]"
