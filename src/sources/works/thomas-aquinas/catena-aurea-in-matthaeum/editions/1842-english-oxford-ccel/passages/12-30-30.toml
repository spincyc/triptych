text = "30. “He that is not with me is against me; and he that gathereth not with me scattereth abroad.” Chrys.: After that third reply, here follows a fourth, “He that is not with me is against me.” Hilary: Wherein He shews how far He is from having borrowed any power from the Devil; teaching us how great the danger to think amiss of Him, not to be with Whom, is the same as to be against Him. Jerome: But let none think that this is said of heretics and schismatics; though we may apply it besides to such; but it is shewn by the context to refer to the Devil; in that the works of the Saviour cannot be compared with the works of Beelzebub. He seeks to hold men’s souls in captivity, the Lord to set them free; he preaches idols, the Lord the knowledge of the true God; he draws men to sin, the Lord calls them back to virtues. How then can these have agreement together, whose works are so opposite? Chrys.: Therefore whoso gathereth not with me, nor is with me, may not be compared together with me, that with me he should cast out daemons, but rather seeks to scatter what is mine. But tell me; If you were to have fought together with some one, and he should not be willing to come to your aid, is he not therefore against you? The Lord also Himself said in another place, “He that is not against you is for you.” [Luke 9:50] To which that which is here said is not contrary. For here He is speaking of the Devil who is our adversary — there of some man who was on their side, of whom it is, said, “We saw one casting out daemons in thy name.” Here He seems to allude to the Jews, classing them with the Devil; for they were against Him, and scattered what He would gather. But it is fair to allow that He spoke this of Himself; for He was against the Devil, and scattered abroad the things of the Devil."
