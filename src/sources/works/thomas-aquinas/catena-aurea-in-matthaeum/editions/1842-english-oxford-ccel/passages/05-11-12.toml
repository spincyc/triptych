text = "11. “Blessed are ye, when men shall revile you, and persecute you, and shall say all manner of evil against you falsely, for My sake. 12. Rejoice, and be exceeding glad: for great is your reward in heaven: for so persecuted they the prophets which were before you.” Rabanus: The preceding blessings were general; He now begins to address His discourse to them that were present, foretelling them the persecutions which they should suffer for His name. Aug.: It may be asked, what difference there is between ‘they shall revile you,’ and ‘shall speak all manner of evil of you;’ to revile, it may be said, being but to speak evil of. But a reproach thrown with insult in the face of one present is a different thing from a slander cast on the character of the absent. To persecute includes both open violence and secret snares. Pseudo-Chrys.: But if it be true that he who offers a cup of water does not lose his reward, consequently he who has been wronged but by a single word of calumny, shall not be without a reward. But that the reviled may have a claim to this blessing, two things are necessary, it must be false, and it must be for God’s sake; otherwise he has not the reward of this blessing; therefore He adds, “falsely for my sake.” Aug., Serm. in Mont., i, 5: This I suppose was added because of those who wish to boast of persecutions and evil reports of their shame, and therefore claim to belong to Christ because many evil things are said of them; but either these are true, or when false yet they are not for Christ’s sake. Greg., Hom. in Ezech. i. 9, 17: What hurt can you receive when men detract from you, though you have no defence but only your own conscience? But as we ought not to stir up wilfully the tongues of slanderers, lest they perish for their slander, yet when their own malice has instigated them, we should endure it with equanimity, that our merit may be added to. “Rejoice,” He says, “and exult, for your reward is abundant in heaven.” Gloss. ap. Anselm: Rejoice, that is, in mind, exult with the body, for your reward is not great only but “abundant in heaven.” Aug., Serm. in Mont., i, 5: Do not suppose that by heaven here is meant the upper regions of the sky of this visible world, for your reward is not to be placed in things that are seen, but by “in heaven” understand the spiritual firmament, where everlasting righteousness dwells. Those then whose joy is in things spiritual will even here have some foretaste of that reward; but it will be made perfect in every part when this mortal shall have put on immortality. Jerome: This it is in the power of any one of us to attain, that when our good character is injured by calumny, we rejoice in the Lord. He only who seeks after empty glory cannot attain this. Let us then rejoice and exult, that our reward may be prepared for us in heaven. Pseudo-Chrys.: For by how much any is pleased with the praise of men, by so much is he grieved with their evil speaking. But if you seek your glory in heaven, you will not fear any slanders on earth. Gregory, Hom. in Ezech., i, 9, 17: Yet ought we sometimes to check our defamers, lest by spreading evil reports of us, they corrupt the innocent hearts of those who might hear good from us. Gloss. non occ.: He invites them to patience not only by the prospect of reward, but by example, when He adds, “for so persecuted they the Prophets who were before you.” Remig.: For a man in sorrow receives great comfort from the recollection of the sufferings of others, who are set before him as an example of patience; as if He had said, Remember that ye are His Apostles, of whom also they were Prophets. Chrys.: At the same time He signifies His equality in honour with His Father, as if He had said, As they suffered for my Father, so shall ye suffer for me. And in saying, “The Prophets who were before you,” He teaches that they themselves are already become Prophets. Aug.: “Persecuted” He says generally, comprehending both reproaches and defamation of character."
