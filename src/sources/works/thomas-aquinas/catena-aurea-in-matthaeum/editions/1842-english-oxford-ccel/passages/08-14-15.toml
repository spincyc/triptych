text = "14. And when Jesus was come into Peter’s house, he saw his wife’s mother laid, and sick of a fever. 15. And he touched her hand, and the fever left her: and she arose, and ministered unto them. Anselm: Matthew having in the leper shewn the healing of the whole human race, and in the centurion’s servant that of the Gentiles, now figures the healing of the synagogue in Peter’s mother-in-law. He relates the case of the servant, first, because it was the greater miracle, and the grace was greater in the conversion of the Gentile; or because the synagogue should not be fully converted till the end of the age when the fulness of the Gentiles should have entered in. Peter’s house was in Bethsaida. Chrys., Hom. xxvii: Why did He enter into Peter’s house? I think to take food; for it follows, “And she arose, and ministered to them.” For He abode with His disciples to do them honour, and to make them more zealous. Observe Peter’s reverence towards Christ; though his mother-in-law lay at home sick of a fever, yet he did not force Him thither at once, but waited till His teaching should be completed, and others healed. For from the beginning he was instructed to prefer others to himself. Wherefore he did not even bring Him thither, but Christ went in of Himself; purposing, because the centurion had said, “I am not worthy that thou shouldest come under my roof,” to shew what He granted to a disciple. And He did not scorn to enter the humble hut of a fisherman, instructing us in every thing to trample upon human pride. Sometimes He heals by a word, sometimes He reaches forth His hand; as here, “He touched her hand, and the fever left her.” For He would not always work miracles with display of surpassing power, but would sometimes be hid. By touching her body He not only banished the fever, but restored her to perfect health. Because her sickness was such as art could cure, He shewed his power to heal, in doing what medicine could not do, giving her back perfect health and strength at once; which is intimated in what the Evangelist adds, “And she arose, and ministered to them.” Jerome: For naturally the greatest weakness follows fever, and the evils of sickness begin to be felt as the patient begins to recover; but that health which is given by the Lord’s power is complete at once. Gloss., non occ.: And it is not enough that she is cured, but strength is given her besides, for “she arose and ministered unto them.” Chrys.: This, “she arose and ministered unto them,” shews at once the Lord’s power, and the woman’s feeling towards Christ. Bede: Figuratively, Peter’s house is the Law, or the circumcision, his mother-in-law the synagogue, which is at it were the mother of the Church committed to Peter. She is in a fever, that is, she is sick of zealous hate, and persecutes the Church. The Lord touches her hand, when He turns her carnal works to spiritual uses. Remig.: Or by Peter’s mother-in-law may be understood the Law, which according to the Apostle was made weak through the flesh, i.e. the carnal understanding. But when the Lord through the mystery of the Incarnation appeared visibly in the synagogue, and fulfilled the Law in action, and taught that it was to be understood spiritually; straightway it thus allied with the grace of the Gospel received such strength, that what had been the minister of death and punishment, because the minister of life and glory. Rabanus: Or, every soul that struggles with fleshly lusts is sick of a fever, but touched with the hand of Divine mercy, it recovers health, and restrains the concupiscence of the flesh by the bridle of continence, and with those limbs with which it had served uncleanness, it now ministers to righteousness. Hilary: Or; In Peter’s wife’s mother is shewn the sickly condition of infidelity, to which freedom of will is near akin, being united by the bonds as it were of wedlock. By the Lord’s entrance into Peter’s house, that is into the body, unbelief is cured, which was before sick of the fever of sin, and ministers in duties of righteousness to the Saviour. Aug., De Cons. Evan., ii, 21: When this miracle was done, that is, after what, or before what, Matthew has not said. For we need not understand that it took place just after that which it follows in the relation; he may be returning here to what he had omitted above. For Mark relates this after the cleansing of the leper, which should seem to follow the sermon on the mount, concerning which Mark is silent. Luke also follows the same order in relating this concerning Peter’s mother-in-law as Mark; also inserting it before that long sermon which seems to be the same with Matthew’s sermon on the mount. But what matters it in what order the events are told, whether something omitted before is brought in after, or what was done after is told earlier, so long as in the same story he does not contradict either another or himself? For as it is in no man’s power to choose in what order he shall recollect the things he has once known, it is likely enough that each of the Evangelists thought himself obliged to relate all in that order in which it pleased God to bring to his memory the various events. Therefore when the order of time is not clear, it cannot import to us what order of relation any one of them may have followed."
