text = "10. His disciples say unto him, “If the case of the man be so with his wife, it is not good to marry.” 11. But he said unto them, “All men cannot receive this saying, save they to whom it is given. 12. For there are some eunuchs, which were so born from their mother’s womb: and there are some eunuchs, which were made eunuchs of men: and there be eunuchs, which have made themselves eunuchs for the kingdom of heaven’s sake. He that is able to receive it, let him receive it.” Jerome: A wife is a grievous burden, if it is not permitted to put her away except for the cause of fornication. For what if she be a drunkard, an evil temper, or of evil habits, is she to be kept? The Apostles, perceiving this burdensomeness, express what they feel; “His disciples say unto him, If the case of the man be so with his wife, it is not good to marry.” Chrys.: For it is a lighter thing to contend with himself, and his own lust, than with an evil woman. Pseudo-Chrys.: And the Lord said not, It is good, but rather assented that it is not good. However, He considered the weakness of the flesh; “But he said unto them, All cannot receive this saying;” that is, All are not able to do this. Jerome: But let none think, that wherein He adds, “save they to whom it is given,” that either fate or fortune is implied, as though they were virgins only whom chance has led to such a fortune. For that is given to those who have sought it of God, who have longed for it, who have striven that they might obtain it. Pseudo-Chrys.: But all cannot obtain it, because all do not desire to obtain it. The prize is before them; he who desires the honour will not consider the toil. None would ever vanquish, if all shunned the struggle. Because then some have fallen from their purpose of continence, we ought not therefore to faint from that virtue; for they that fall in the battle do not slay the rest. That He says therefore, “Save they to whom it is given,” shews that unless we receive the aid of grace, we have not strength. But this aid of grace is not denied to such as seek it, for the Lord says above, “Ask; and ye shall receive.” Chrys.: Then to shew that this is possible, He says, “For there are some eunuchs, which were made eunuchs of men;” as much as to say, Consider, had you been so made of others, you would have lost the pleasure without gaining the reward. Pseudo-Chrys.: For as the deed without the will does not constitute a sin; so a righteous act is not in the deed unless the will go with it. That therefore is honourable continence, not which mutilation of body of necessity enforces, but which the will of holy purpose embraces. Jerome: He speaks of three kinds of eunuchs, of whom two are carnal, and one spiritual. One, those who are so born of their mother’s womb; another, those whom enemies or courtly luxury has made so; a third, those who have made themselves so for the kingdom of heaven, and who might have been men, but become eunuchs for Christ. To them the reward is promised, for to the others whose continence was involuntary, nothing is due. Hilary: The cause in one item he assigns nature; in the next violence, and in the last his own choice, in him, namely, that determined to be so from hope of the kingdom of heaven. Pseudo-Chrys.: For they are born such, just as others are born having six or four fingers. For if God according as He formed our bodies in the beginning, had continued the same order unchangeably, the working of God would have been brought into oblivion among men. The order of nature is therefore changed at times from its nature, that God the framer of nature may be had in remembrance. Jerome, cf Origen in loc.: Or we may say otherwise. The eunuchs from their mothers’ wombs are they whose nature is colder, and not prone to lust. And they that are made so of men are they whom physicians made so, or they whom worship of idols has made effeminate, or who from the influence of heretical teaching pretend to chastity, that they may thereupon claim truth for their tenets. But none of them obtain the kingdom of heaven, save he only who has become a eunuch for Christ’s sake. Whence it follows, “He that is able to receive it, let him receive it;” let each calculate his own strength, whether he is able to fulfil the rules of virginity and abstinence. For in itself continence is sweet and alluring, but each man must consider his strength, that he only that is able may receive it. This is the voice of the Lord exhorting and encouraging on His soldiers to the reward of chastity, that he who can fight might fight and conquer and triumph. Chrys.: When he says, “Who have made themselves eunuchs,” He does not mean cutting off of members, but a putting away of evil thoughts. For he that cuts off a limb is under a curse, for such an one undertakes the deeds of murderers, and opens a door to Manichaeans who depreciate the creature, and cut off the same members as do the Gentiles. For to cut off members is of the temptation of daemons. But by the means of which we have spoken desire is not diminished but made more urgent; for it has its source elsewhere, and chiefly in a weak purpose and an unguarded heart. For if the heart be well governed, there is no danger from the natural motions; nor does the amputation of a member bring such peacefulness and immunity from temptation as does a bridle upon the thoughts."
