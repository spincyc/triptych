text = "20. Now when the even was come, he sat down with the twelve. 21. And as they did eat, he said, “Verily I say unto you, that one of you shall betray me.” 22. And they were exceeding sorrowful, and began every one of them to say unto him, “Lord, is it I?” 23. And he answered and said, “He that dippeth his hand with me in the dish, the same shall betray me. 24. The Son of man goeth as it is written of him: but woe unto that man by whom the Son of man is betrayed! it had been good for that man if he had not been born.” 25. Then Judas, which betrayed him, answered and said, “Master, is it I?” He said unto him, “Thou hast said.” Jerome: The Lord had above foretold His Passion, He now foretels who is to be the traitor; thus giving him place of repentance, when he should see that his thoughts and the secret designs of his heart were known. Remig.: “With the twelve,” it is said, for Judas was personally among them, though he had ceased to be so in merit. Jerome: Judas acts in every thing to remove all suspicion of his treachery. Remig.: And it is beautifully said, “When even was come,” because it was in the evening that the Lamb was wont to be slain. Raban.: For this reason also, because in Christ’s Passion, wherein the true sun hasted to his setting, eternal refreshment was made ready for all believers. Chrys.: The Evangelist relates how as they sat at meat, Jesus declares Judas’ treachery, that the wickedness of the betrayer may be more apparent from the season and the circumstances. Leo, Serm. 58, 3: He shews that the conscience of His betrayer was known to Him, not meeting his wickedness with a harsh and open rebuke, that penitence might find a readier way to one who had not been disgraced by public dismissal. Origen: Or, He spoke generally, to prove the nature of each of their hearts, and to evince the wickedness of Judas, who would not believe in One who knew his heart. I suppose that at first he supposed that the thing was hid from Him, deeming Him man, which was of unbelief; but when he saw that his heart was known, he embraced the concealment offered by this general way of speaking, which was shamelessness. This also shews the goodness of the disciples, that they believed Christ’s words more than their own consciences, “for they began each to say, Lord, is it I?” For they knew by what Jesus had taught them that human nature is readily turned to evil, and is in continual struggle with “the rulers of the darkness of this world;” [Eph 6:12] whence they ask as in fear, for by reason of our weakness the future is an object of dread to us. When the Lord saw the disciples thus alarmed for themselves, He pointed out the traitor by the mark of the prophetic declaration, “He that hath eaten bread with me hath wantonly overthrown me.” [Ps 41:9] Jerome: O wonderful endurance of the Lord, He had said before, “One of you shall betray me.” The traitor perseveres in his wickedness; He designates him more particularly, yet not by name. For Judas, while the rest were sorrowful, and withdrew their hands, and bid away the food from their months, with the same hardihood and recklessness which led him to betray Him, reached forth his hand into the dish with his Master, passing off his audacity as a good conscience. Chrys.: I rather think that Christ did this out of regard for him, and to bring him to a better mind. Raban.: What Matthew calls ‘paropsis,’ Mark calls ‘catinus.’ The ‘paropsis’ is a square dish for meat, ‘catinus,’ an earthen vessel for containing fluids; this then might be a square earthen vessel. Origen: Such is the wont of men of exceeding wickedness, to plot against those of whose bread and salt they have partaken, and especially those who have no enmity against them. But if we take it of the spiritual table, and the spiritual food, we shall see the more abundant and overflowing measure of this man’s wickedness, who called to mind neither his Master’s love in providing carnal goods, nor His teaching in things spiritual. Such are all in the Church who lay snares for their brethren whom they continually meet at the same table of Christ’s Body. Jerome: Judas, not withheld by either the first or second warning, perseveres in his treachery; the Lord’s long-suffering nourishes his audacity. Now then his punishment is foretold, that denunciations of wrath may correct where good feeling has no power. Remig.: It belongs to human nature to come and go, Divine nature remains ever the same. So because His human nature could suffer and die, therefore of the Son of Man it is well said that “he goeth.” He says plainly, “As it is written of him,” for all that He suffered had been foretold by the Prophets. Chrys.: This He said to comfort His disciples, that they might not think that it was through weakness that He suffered; and at the same time for the correction of His betrayer. And notwithstanding His Passion had been foretold, Judas is still guilty; and not his betrayal wrought our salvation, but God’s providence, which used the sins of others to our profit. Origen: He said not, By whom “the Son of Man is betrayed,” but “through whom,” [John 13:2] pointing out another, to wit the Devil, as the author of His betrayal, Judas as the minister. But woe also to all betrayers of Christ! and such is every one who betrays a disciple of Christ. Remig.: Woe also to all who draw near to Christ’s table with an evil and defiled conscience! who though they do not deliver Christ to the Jews to be crucified, deliver Him to their own sinful members to be taken. He adds, to give more emphasis, “Good were it for that man if he had never been born.” Jerome: We are not to infer from this that man has a being before birth; for it cannot be well with any man till he has a being; it simply implies that it is better not to be, than to be in evil. Aug., Quaest. Ev., i, 40: And if it be contended that there is a life before this life, that will prove that not only not for Judas, but for none other is it good to have been born. Can it mean, that it were better for him not to have been born to the Devil, namely, for sin? Or does it mean that it had been good for him not to have been born to Christ at his calling, that he should now become apostate? Origen: After all the Apostles had asked, and after Christ had spoken of him, Judas at length enquired of himself, with the crafty design of concealing his treacherous purpose by asking the same question as the rest; for real sorrow brooks not suspense. Jerome: His question feigns either great respect, or a hypocritical incredulousness. The rest who were not to betray Him, said only “Lord;” the actual traitor addresses Him as “Master,” as though it were some excuse that he denied Him as Lord, and betrayed a Master only. Origen: Or, out of sycophancy he calls Him Master, while be holds Him unworthy of the title. Chrys.: Though the Lord could have said, Hast thou covenanted to receive silver, and darest to ask Me this? But Jesus, most merciful, said nothing of all this, therein laying down for us rules and landmarks of endurance of evil. “He saith unto him, Thou hast said.” Remig.: Which may be understood thus; Thou sayest it, and thou sayest what is true; or, Thou hast said this, not I; leaving him room for repentance so long as his villainy was not publicly exposed. Raban.: This might have been so said by Judas, and answered by the Lord as not to be overheard by the rest."
