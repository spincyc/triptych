text = "7. “But when ye pray, use not vain repetitions, as the heathen do: for they think that they shall be heard for their much speaking. 8. Be ye not therefore like unto them: for your Father knoweth what things ye have need of, before ye ask Him.” Aug.: As the hypocrites use to set themselves so as to be seen in their prayers, whose reward is to be acceptable to men; so the Ethnici (that is, the Gentiles) use to think that they shall be heard for their much speaking; therefore He adds, “When ye pray, do not ye use many words.” Cassian, Collat. ix. 36: We should indeed pray often, but in short form, lest if we be long in our prayers, the enemy that lies in wait for us, might suggest something for our thoughts. Aug., Epist., 130, 10: Yet to continue long in prayer is not, as some think, what is here meant, by “using many words.” For much speaking is one thing, and an enduring fervency another. For of the Lord Himself it is written, that He continued a whole night in prayer, and prayed at great length, setting an example to us. The brethren in Egypt are said to use frequent prayers, but those very short, and as it were hasty ejaculations, lest that fervency of spirit, which is most behoveful for us in prayer, should by longer continuance be violently broken off. Herein themselves sufficiently shew, that this fervency of spirit, as it is not to be forced if it cannot last, so if it has lasted is not to be violently broken off. Let prayer then be without much speaking, but not without much entreaty, if this fervent spirit can be supported; for much speaking in prayer is to use in a necessary matter more words than necessary. But to entreat much, is to importune with enduring warmth the heart Him to whom our entreaty is made; for often is this business effected more by groans than words, by weeping more than speech. Chrys.: Hereby He dissuades from empty speaking in prayer; as, for example, when we ask of God things improper, as dominions, fame, overcoming of our enemies, or abundance of wealth. He commands then that our prayers should not be long; long, that is, not in time, but in multitude of words. For it is right that those who ask should persevere in their asking; “being instant in prayer,” as the Apostle instructs; but does not thereby enjoin us to compose a prayer of ten thousand verses, and speak it all; which He secretly hints at, when He says, “Do not ye use many words.” Gloss. ord.: What He condemns is many words in praying that come of want of faith; “as the Gentiles do.” For a multitude of words were needful for the Gentiles, seeing the daemons could not know for what they petitioned, until instructed by them; they think they shall be heard for their much speaking. Aug.: And truly all superfluity of discourse has come from the Gentiles, who labour rather to practise their tongues than to cleanse their hearts, and introduce this art of rhetoric into that wherein they need to persuade God. Greg., Mor. xxxiii. 23: True prayer consists rather in the bitter groans of repentance, than in the repetition of set forms of words. Aug.: For we use many words then when we have to instruct one who is in ignorance, what need of them to Him who is Creator of all things; “Your heavenly Father knoweth what ye have need of before you ask Him” Jerome: Or this there starts up a heresy of certain Philosophers [margin note: Epicureans] who taught the mistaken dogma that if God knows for what we shall pray, and, before we ask, knows what we need, our prayer is needlessly made to one who has such knowledge. To such we shortly reply, That in our prayers we do not instruct, but entreat; it is one thing to inform the ignorant, another to beg of the understanding: the first were to teach; the latter is to perform a service of duty. Chrys.: You do not then pray in order to teach God your wants, but to move Him, that you may become His friend by the importunity of your applications to Him, that you may be humbled, that you may be reminded of your sins. Aug.: Nor ought we to use words in seeking to obtain of God what we would, but to seek with intense and fervent application of mind, with pure love, and suppliant spirit. Aug., Epist. 130. 9: But even with words we ought at certain periods to make prayer to God, that by these signs of things we may keep ourselves in mind, and may know what progress we have made in such desire, and may stir up ourselves more actively to increase this desire, that after it have begun to wax warm, it may not be chilled and utterly frozen up by divers cares, without our continual care to keep it alive. Words therefore are needful for us that we should be moved by them, that we should understand clearly what it is we ask, not that we should think that by them the Lord is either instructed or persuaded. Aug., Serm. in Mont., ii, 3: Still it may be asked, what is the use of prayer at all, whether made in words or in meditation of things, if God knows already what is necessary for us. The mental posture of prayer calms and purifies the soul, and makes it of more capacity to receive the divine gifts which are poured into it. For God does not hear us for the prevailing force of our pleadings; He is at all times ready to give us His light, but we are not ready to receive it, but prone to other things. There is then in prayer a turning of the body to God, and a purging of the inward eye, whilst those worldly things which we desired are shut out, that the eye of the mind made single might be able to bear the single light, and in it abide with that joy with which a happy life is perfected."
