text = "11. And Jesus stood before the governor: and the governor asked him, saying, “Art thou the King of the Jews?” And Jesus said unto him, “Thou sayest.” 12. And when he was accused of the Chief Priests and elders, he answered nothing. 13. Then said Pilate unto him, “Hearest thou not how many things they witness against thee? 14. And he answered him to never a word; insomuch that the governor marvelled greatly. Aug., de Cons. Ev., iii, 7: Matthew, having finished his digression concerning the traitor Judas, returns to the course of his narrative saying, “Jesus stood before the governor.” Origen: Mark how He that is ordained by His Father to be the Judge of the whole creation, humbled Himself, and was content to stand before the judge of the land of Judaea, and to be asked by Pilate either in mockery or doubt, “Art thou the King of the Jews?” Chrys., Hom. lxxxvi: Pilate asked Christ that which His enemies were continually casting in His teeth, for because they knew that Pilate cared not for matters of their Law, they had recourse to a public charge. Origen: Or, Pilate spoke this affirmatively, as he afterwards wrote in the inscription, “The King of the Jews.” By answering to the Chief Priest, “Thou hast said,” He indirectly reproved his doubts, but now He turns Pilate’s speech into an affirmative, “Jesus saith unto him, Thou sayest it.” Chrys.: He acknowledges Himself to be a King, but a heavenly one, as it is more expressly said in another Gospel, “My kingdom is not of this world [John 18:36], so that neither the Jews nor Pilate were excusable for insisting on this accusation. Hilary: Or, when asked by the High Priest whether He were Jesus the Christ, He answered, “Thou hast said,” because He had ever maintained out of the Law that Christ should come, but to Pilate who was ignorant of the Law, and asks if He were the King of the Jews, He answers, “Thou sayest,” because the salvation of the Gentiles is through faith of that present confession. Jerome: But observe, that to Pilate who asked the question unwillingly He did answer somewhat; but to the Chief Priests and Priests He refused to answer, judging them unworthy of a word; “And when he was accused by the Chief Priests and Elders he answered nothing.” Aug., de Cons. Ev., iii, 8: Luke explains what were the accusations alleged against Him, “And they began to accuse him, saying, We found this fellow perverting the nation, and forbidding to give tribute to Caesar, saying that he himself is Christ a King.” [Luke 23:2] But it is of no consequence to the truth in what order they relate the history, or that one omits what another inserts. Origen: Neither then nor now did Jesus make any reply to their accusations, for the word of God was not sent to them, as it was formerly to the Prophets. Neither was Pilate worthy of an answer, as be had no fixed or abiding opinion of Christ, but veered about to contradictory suppositions. “Hearest thou not how many things they witness against thee?” Jerome: Thus though it is a Gentile who sentences Jesus, he lays the cause of His condemnation upon the Jews. Chrys.: He said this out of a wish to release Him, if He should justify Himself in His answer. But the Jews, though they had so many practical proofs of His power, His meekness and humbleness, were yet enraged against Him, and urged on by a perverted judgment. Wherefore He answers nothing, or if He makes any answer He says little, that total silence might not be construed into obstinacy. Jerome: Or, Jesus would not make any answer, lest if He cleared Himself the governor should have let Him go, and the benefit of His cross should have been deferred. Origen: “The governor marvelled” at His endurance, as knowing that he had power to condemn Him, He yet continued in a peaceful, placid, and immovable prudence and gravity. He marvelled “greatly,” for it seemed to him a great miracle that Christ, produced before a criminal tribunal, stood thus fearless of death, which all men think so terrible."
