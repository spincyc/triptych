text = "6. “Blessed are they which do hunger and thirst after righteousness: for they shall be filled.” Ambrose: As soon as I have wept for my sins, I begin to hunger and thirst after righteousness. He who is afficted with any sort disease, hath ho hunger. Jerome: It is not enough that we desire righteousness, unless we also suffer hunger for it, by which expression we may understand that we are never righteous enough, but always hunger after works of righteousness. Pseudo-Chrys.: All good which men do not from love of the good itself is unpleasing before God. He hungers after righteousness who desires to walk according to the righteousness of God; he thirsts after righteousness who desires to get the knowledge thereof. Chrys.: He may mean either general righteousness, or that particular virtue which is the opposite of covetousness. As He was going on to speak of mercy, He shews before hand of what kind our mercy should be, that it should not be of the gains of plunder or covetousness, hence He ascribes to righteousness that which is peculiar to avarice, namely, to hunger and thirst. Hilary: The blessedness which He appropriates to those who hunger and thirst after righteousness shews that the deep longing of the saints for the doctrine of God shall receive perfect replenishment in heaven; then “they shall be filled.” Pseudo-Chrys.: Such is the bounty of a rewarding God, that His gifts are greater than the desires of the saints. Aug.: Or He speaks of food with which they shall be filled at this present; to wit, that food of which the Lord spake, “My food is to do the will of my Father,” that is, righteousness, and that water of which whoever drinks it shall be in him “a well of water springing up to life eternal.” Chrys.: Or, this is again a promise of a temporal reward; for as covetousness is thought to make many rich, He affirms on the contrary that righteousness rather makes rich, for He who loves righteousness possesses all things in safety."
