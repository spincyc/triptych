text = "10. And his disciples asked him, saying, “Why then say the Scribes that Elias must first come?” 11. And Jesus answered and said unto them, “Elias truly shall first come, and restore all things. 12. But I say unto you, That, Elias is come already, and they knew him not, but have done unto him whatsoever they listed. Likewise shall also the Son of man suffer of them.” 13. Then the disciples understood that he spake unto them of John the Baptist. Jerome: It was a tradition of the Pharisees following the Prophet Malachi, that Elias should come before the coming of the Saviour, and bring back the heart of the fathers to the children, and the children to the fathers, and restore all things to their ancient state. The disciples then consider that this transformation which they had seen in the mount was His coming in glory, and therefore it is said, “And his disciples asked him, saying, How then say the Scribes that Elias must first come? As though they had said, If you have already come in glory, how is it that your forerunner appears not yet? And this they say chiefly because they see that Elias is departed again Chrys., Hom., lvii: The disciples knew not of the coming of Elias out of the Scriptures; but the Scribes made it known to them; and this report was current among the ignorant multitude, as was that concerning Christ. Yet the Scribes did not explain the coming of Christ and of Elias, as they ought to have done. For the Scriptures speak of two comings of Christ; that which has taken place, and that which is yet to be. But the Scribes, blinding the people, spake to them only of His second coming, and said, If this be the Christ, then should Elias have come before Him. Christ thus resolves the difficulty, He answered and said, “Elias truly shall come, and restore all things; but I say unto you, that Elias has already come.” Think not that here is a contradiction in His speech, if He first say that Elias shall come, and then that he is come. For when He says that Elias shall come and restore all things, He speaks of Elias himself in his own proper person, who indeed shall restore all things, in that he shall correct the unbelief of the Jews, who shall then be to be found; and that is the turning the hearts of the fathers to the children, that is, the hearts of the Jews to the Apostles Aug., Quaest Ev., i, 21: Or; “He shall restore all things,” that is those whom the persecution of Antichrist shall have overthrown; as He Himself should restore by His death those whore He ought. Chrys.: But if there shall so much good arise out of the presence of Elias, why did He not send him at that time? We shall say, Because they then held Christ to be Elias, and yet believed not on Him. But they shall hereafter believe Elias, because when he shall come after so great expectation announcing Jesus, they will more readily receive what shall be taught by Him. But when He says that Elias is come already, He calls John the Baptist Elias from the resemblance of their ministry; for as Elias shall be the forerunner of His second coming, so was John the forerunner of His first. And He calls John Elias, to shew that His first coming was agreeable to the Old Testament, and to prophecy. Jerome: He then who at the Saviour’s second coming should come in the truth of His body, come now in John in power and spirit. It followers, “And they knew him not, but did unto him whatsoever they would,” that is, despised and beheaded him. Hilary: As he announced the Lord’s coming, so he was also to foreshew His passion by the example of his own suffering and wrong; whence it follows, “So also shall the Son of Man suffer of them.” Chrys.: He takes the opportunity from the passion of John to refer to His own passion, thus giving them much comfort. Jerome: It is enquired how, seeing that Herod and Herodias were they that killed John, it can be said that Jesus also was crucified by them, when we read that He was put to death by the Scribes and Pharisees! It must be answered briefly, that the party of the Pharisees consented to the death of John, and that in the Lord’s crucifixion Herod united his approval, when having mocked and set Him at nought, he sent Him back to Pilate, that he should crucify Him. Raban.: From the mention of His own passion which the Lord had often foretold to them, and from that of His forerunner, which they beheld already accomplished, the disciples perceived that John was set forth to them under the name of Elias; whence it follows; “Then understood the disciples that he spake to them of John the Baptist.” Origen: That He says of John, “Elias is already come,” is not to be understood of the soul of Elias, that we fall not into the doctrine of metempsychosis, which is foreign to the truth of Church doctrine, but, as the Angel had foretold, he came “in the spirit and spirit of Elias.”"
