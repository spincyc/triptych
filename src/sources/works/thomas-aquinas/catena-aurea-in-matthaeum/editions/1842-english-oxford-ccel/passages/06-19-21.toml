text = "19. “Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal: 20. But lay up for yourselves treasures in Heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal: 21. For where your treasure is, there will your heart be also.” Chrys.: When He has driven away the disease of vanity, He does well to bring in speech of contempt of riches. For there is no greater cause of desire of money than love of praise; for this men desire troops of slaves, horses accoutred in gold, and tables of silver, not for use or pleasure, but that they may be seen of many; therefore He says, “Lay not up for yourselves treasure on earth.” Aug., Serm. in Mont., ii, 13: For if any does a work with the mind of gaining thereby an earthly good, how will his heart be pure while it is thus walking on earth? For any thing that is mingled with an inferior nature is polluted therewith, though that inferior be in its kind pure. Thus gold is alloyed when mixed with pure silver; and in like manner our mind is defiled by lust of earthly things, though earth is in its own kind pure. Pseudo-Chrys.: Otherwise; As the Lord had above taught nothing concerning alms, or prayer, or fasting, but had only checked a pretence of them, He now proceeds to deliver a doctrine of three portions, according to the division which He had before made, in this order. First, a counsel that alms should be done; second, to shew the benefit of almsgiving; third, that the fear of poverty should be no hindrance to our purpose of almsgiving. Chrys.: Saying, “Lay not up for yourselves treasure on earth,” He adds, “where rust and moth destroy,” in order to shew the insecurity of that treasure that is here, and the advantage of that which is in Heaven, both from the place, and from those things which harm. As though He had said; Why fear you that your wealth should be consumed, if you should give alms? Yea rather give alms, and they shall receive increase, for those treasures that are in Heaven shall be added to them, which treasures perish if ye do not give alms. He said not, You leave them to others, for that is pleasant to men. Rabanus, ap. Anselm: Here are three precepts according to the three different kinds of wealth. Metals are destroyed by rust, clothes by moth; but as there are other things which fear neither rust nor moth, as precious stones, He therefore names a common damage, that by thieves, who may rob wealth of all kinds. Pseudo-Chrys.: Another reading is, “Where moth and banqueting consume.” For a threefold destruction awaits all the goods of this life. They either decay and are eaten of moths as cloth; or are consumed by their master’s luxurious living; or are plundered by strangers, either by violence, or pilfering, or false accusation, or some other unjust doing. For all may be called thieves who hasten by any unlawful means to make other men’s goods their own. But you will say, Do all who have these things, perforce lose them? I would answer by the way, that if all do not, yet many do. But ill-hoarded wealth, you have lost spiritually if not actually, because it profits you not to your salvation. Rabanus: Allegorically; Rust denotes pride which obscures the brightness of virtue. Moth which privily eats out garments, is jealousy which frets into good intention, and destroys the bond of unity. Thieves denote heretics and demons, who are ever on the watch to rob men of their spiritual treasure. Hilary: But the praise of Heaven is eternal, and cannot be carried off by invading thief, nor consumed by the moth and rust of envy. Aug., Serm. in Mont., ii, 13: By heaven in this place I understand not the material heavens, for every thing that has a body is earthly. But it behoves that the whole world be despised by him who lays up his treasure in that Heaven, of which it is said, “The heaven of heavens is the Lord’s,” [Ps 115:16] that is, in the spiritual firmament. “For heaven and earth shall pass away;” [Matt 24:35] but we ought not to place our treasure in that which passes away, but in that which abides for ever. Pseudo-Chrys.: Which then is better? To place it on earth where its security is doubtful, or in Heaven where it will be certainly preserved? What folly to leave it in this place whence you must soon depart, and not to send it before you thither, whither you are to go? Therefore place your substance there where your country is. Chrys.: But forasmuch as not every earthly treasure is destroyed by rust or moth, or carried away by thieves, He therefore brings in another motive, “For where your treasure is, there will your heart be also.” As much as to say; Though none of these former losses should befall you, you will yet sustain no small loss by attaching your affections to things beneath, and becoming a slave to them, and in falling from Heaven, and being unable to think of any lofty thing. Jerome: This must be understood not of money only, but of all our possessions. The god of a glutton is his belly; of a lover his lust; and so every man serves that to which he is in bondage; and has his heart there where his treasure is. Pseudo-Chrys.: Otherwise; He now teaches the benefit of almsgiving. He who places his treasure on earth has nothing to look for in Heaven; for why should he look up to Heaven where he has nothing laid up for himself? Thus he doubly sins; first, because he gathers together things evil; secondly, because he has his heart in earth; and so on the contrary he does right in a twofold manner who lays up his treasure in Heaven."
