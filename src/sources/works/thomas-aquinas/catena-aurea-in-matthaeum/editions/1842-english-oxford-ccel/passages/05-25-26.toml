text = "25. “Agree with thine adversary quickly, whiles thou art in the way with him; lest at any time the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison. 26. Verily I say unto thee, Thou shalt by no means come out thence, till thou hast paid the uttermost farthing.” Hilary: The Lord suffers us at no time to be wanting in peaceableness of temper, and therefore bids us be reconciled to our adversary quickly, while on the road to life, lest we be cast into the season of death before peace by joined between us. Jerome: The word here in our Latin books is ‘consentiens,’ in Greek, εὐνοῶν, which means, ‘kind,’ ‘benevolent.’ Aug., Serm. in Mont, i, 11: Let us see who this adversary is to whom we are bid to be benevolent. It may then be either the Devil, or man, or the flesh, or God, or His commandments. But I do not see how we can be bid be benevolent, or agreeing with the Devil; for where there is good will, there is friendship, and no one will say that friendship should be made with the Devil, or that it is well to agree with him, having once proclaimed war against him when we renounced him; nor ought we to consent with him, with whom had we never consented, we had never come into such circumstances. Jerome: Some, from that verse of Peter, “Your adversary the Devil, &c.” [1 Pet 5:8] will have the Saviour’s command to be, that we should be merciful to the Devil, not causing him to endure punishment for our sakes. For as he puts in our way the incentives to vice, if we yield to his suggestions, he will be tormented for our sakes. Some follow a more forced interpretation, that in baptism we have each of us made a compact with the Devil by renouncing him. If we observe this compact, then we are agreeing with our adversary, and shall not be cast into prison. Aug.: I do not see again how it can be understood of man. For how can man be said to deliver us to the Judge, when we know only Christ as the Judge, before whose tribunal all must be sisted [?]. How then can he deliver to the Judge, who has himself to appear before Him? Moreover if any has sinned against any by killing him, he has no opportunity of agreeing with him in the way, that is in this life; and yet that hinders not but that he may be rescued from judgment by repentance. Much less do I see how we can be bid be agreeing with the flesh; for they are sinners rather who agree with it; but they who bring it into subjection, do not agree with it, but compel it to agree with them. Jerome: And how can the body be cast into prison if it agree not with the spirit, seeing soul and body must go together, and that the flesh can do nothing but what the soul shall command? Aug.: Perhaps then it is God with whom we are here enjoined to agree. He may be said to be our adversary, because we have departed from Him by sin, and “He resisteth the proud.” Whosoever then shall not have been reconciled in this life with God through the death of His Son, shall be by Him delivered to the Judge, that is, the Son, to whom He has committed all judgment. And man may be said to be “in the way with God,” because He is every where. But if we like not to say that the wicked are with God, who is every where present, as we do not say that the blind are with that light which is every where around them, there only remains the law of God which we can understand by our adversary. For this law is an adversary to such as love to sin, and is given us for this life that it may be with us in the way. To this we ought to agree quickly, by reading, hearing, and bestowing on it the summit of authority, and that when we understand it, we hate it not because it opposes our sins, but rather love it because it corrects them; and when it is obscure, pray that we may understand it. Jerome: But from the context the sense is manifest; the Lord is exhorting us to peace and concord with our neighbour; as it was said above, Go, be reconciled to thy brother. Pseudo-Chrys.: The Lord is urgent with us to hasten to make friends with our enemies while we are yet in this life, knowing how dangerous for us that one of our enemies should die before peace is made with us. For if death bring us while yet at enmity to the Judge, he will deliver us to Christ, proving us guilty by his judgment. Our adversary also delivers us to the Judge, when he is the first to seek reconciliation; for he who first submits to his enemy, brings him in guilty before God. Hilary: Or, the adversary delivers you to the Judge, when the abiding of your wrath towards him convicts you. Aug.: by the Judge I understand Christ, for, “the Father hath committed all judgment to the Son;” [John 5:22] and by the officer, or minister, an Angel, for “Angels came and ministered unto Him;” and we believe that He will come with his Angels to judge. Pseudo-Chrys.: “The officer,” that is, the ministering Angel of punishment, and he shall cast you into the prison of hell. Aug.: By the prison I understand the punishment of the darkness. And that none should despise that punishment, He adds, “Verily I say unto thee, thou shalt not come out thence till thou hast paid the very last farthing.” Jerome: A farthing is a coin containing two mites. What He says then is, ‘Thou shalt not go forth thence till thou hast paid for the smallest sin.’ Aug.: Or it is an expression to denote that there is nothing that shall go unpunished; as we say ‘To the dregs,’ when we are speaking of any thing so emptied that nothing is left in it. Or by “the last farthing” [margin note: quadrans] may be denoted earthly sins. For the fourth and last element of this world is earth. “Paid,” that is in eternal punishment; and “until” used in the same sense as in that, “Sit thou on my right hand until I make thy enemies thy footstool;” [Ps 110:1] for He does not cease to reign when His enemies are put under His feet. So here, “until thou hast paid,” is as much as to say, thou shalt never come out thence, for that he is always paying the very last farthing while he is enduring the everlasting punishment of earthly sins. Pseudo-Chrys.: Or, If you will make your peace yet in this world, you may receive pardon of even the heaviest offences; but if once damned and cast into the prison of hell, punishment will be exacted of you not for grievous sins only, but for each idle word, which may be denoted by “the very last farthing.” Hilary: For because “charity covereth a multitude of sins,” we shall therefore pay the last farthing of punishment, unless by the expense of charity we redeem the fault of our sin. Pseudo-Chrys.: Or, the prison is worldly misfortune which God often sends upon sinners. Chrys.: Or, He here speaks of the judges of this world, of the way which leads to this judgment, and of human prisons; thus not only employing future but present inducements, as those things which are before the eyes affect us most, as St. Paul also declares, “If thou doest evil fear the power, for he beareth not the sword in vain.” [Rom 13:4]"
