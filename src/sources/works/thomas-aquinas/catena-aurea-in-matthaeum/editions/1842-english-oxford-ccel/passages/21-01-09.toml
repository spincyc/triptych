  { line = 5061, text = "Raban.: Whence Matthew, who wrote his Gospel to the Jews, is the only one who mentions that the ass was brought to the Lord, to shew that this same Hebrew nation, if it repent, need not despair of salvation." },
  { line = 5062, text = "Pseudo-Chrys.: Men are likened to animals, from some resemblance they bear in their not recognising the Son of God. And this animal is unclean, and beyond all other brutes incapable of reasoning, a stupid, helpless, ignoble drudge. Such were men before the coming of Christ, unclean with divers passions; unreasoning, that is, lacking the reason of the Word; stupid, in their disregard of God; weak in soul; ignoble, because forgetting their heavenly birth they became slaves of their passions, and of the demons; drudges, because they toiled under the load of error laid upon them by the daemons, or the Pharisees." },
  { line = 5063, text = "The ass was tied, that is, bound in the chain of diabolic error, so that it had not liberty to go whither it would; for before we do any sin we have free will to follow, or not, the will of the Devil; but if once by sinning we have bound ourselves to do his works, we are no longer able to escape by our own strength, but, like a vessel that has lost its rudder is tossed at the mercy of the storm, so man, when by sin he has forfeited the aid of Divine grace, no longer acts as he wills, but as the Devil wills. And if God, by the mighty arm of His mercy, do not loose him, he will abide till death in the chain of his sins. Therefore He saith to His disciples, “Loose them,” that is, by your teaching and miracles, for all the Jews and Gentiles were loosed by the Apostles; “and bring them to me,” that is, convert them to My glory." },
  { line = 5064, text = "Origen: Whence also, when He ascended into heaven, He gave command to His disciples that they should loose sinners, for which also He gave them the Holy Spirit. But being loosed, and making progress, and being nourished by the Divinity of the Word, they are held worthy to be sent back to the place whence they were taken, but no more to their former labours, but to preach to them the Son of God, and this is what He signifies when He says, “And straightway He will send them.”" },
  { line = 5065, text = "Hilary: Or by the ass and the colt is shewn the twofold calling from among the Gentiles. For the Samaritans did serve after a certain fashion of obedience, and they are signified by the ass; but the other Gentiles wild and unbroken are signified by the colt. Therefore two are sent to loose them that are bound by the chains of error; Samaria believed through Philip, and Cornelius as the first-fruits of the Gentiles was brought by Peter to Christ." },
  { line = 5066, text = "Remig.: But as it was then said to the Apostles, “If any man say ought to you, say ye, The Lord hath need of them;” so now it is commanded to the preachers, that though any opposition he made to them, they should not slack to preach." },
  { line = 5067, text = "Jerome: The Apostles’ clothes which are laid upon the beasts may be understood either as the teaching of virtues, or discernment of Scriptures, or verities of ecclesiastical dogmas, with which, unless the soul be furnished and instructed, it deserves not to have the Lord take His seat there." },
  { line = 5068, text = "Remig.: The Lord sitting upon the ass goes towards Jerusalem, because presiding over the Holy Church, or the faithful soul, He both guides it in this life, and after this life leads it to the view of the heavenly country. But the Apostles and other teachers set their garments upon the ass, when they gave to the Gentiles the glory which they had received from Christ. The multitudes spread their garments in the way, when they of the circumcision who believed, despised the glory which they had by the Law. They cut down branches from the trees, because out of the Prophets they had heard of the green “Branch” as an emblem of Christ. [marg. note: Isa 11:1, Jer 23:5]" },
  { line = 5069, text = "Or, the multitudes who spread their garments in the way, are the martyrs who gave to martyrdom for Christ their bodies, which are the clothing of their minds. Or, they are signified, who subdue their bodies by abstinence. They who cut down the branches of the trees, are they who seek out the sayings and examples of the holy fathers for their own or their children’s salvation." },
  { line = 5070, text = "Jerome: When He says, “The multitudes that went before and that followed,” He shews that both people, those who before the Gospel, and those who after the Gospel, believed on the Lord, praise Jesus with the harmonious voice of confession." },
  { line = 5071, text = "Pseudo-Chrys.: Those prophesying spoke of Christ who was to come; these speak in praise of the coming of Christ already fulfilled." },
]
