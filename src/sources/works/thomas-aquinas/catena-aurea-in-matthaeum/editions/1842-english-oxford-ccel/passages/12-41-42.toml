text = "41. “The men of Nineveh shall rise in judgment with this generation, and shall condemn it: because they repented at the preaching of Jonas; and, behold, a greater than Jonas is here. 42. The queen of the south shall rise up in the judgment with this generation, and shall condemn it: for she came from the uttermost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon is here.” Chrys.: That none should think that the same things would come to pass now among the Jews, as had of old been among the Ninevites; that as Jonas converted them and their city was delivered out of danger, so the Jews should be converted after the resurrection, the Lord now shews the contrary, that they should have no fruit of the benefit of the passion, but should suffer moreover grievous things, as He signifies below in the example of the daemon. But now He first shews what just punishment they shall suffer, saying, “The men of Nineveh shall rise in judgment with this generation.” Remig.: The Lord shews in these words that there shall be one resurrection of the good and the bad against certain heretics, who said that there should be two, one of the good, another of the bad. These words likewise overthrow that fable of the Jews, who use to say that the Resurrection shall be held a thousand years before the Judgment; these words clearly proving that the Judgment shall ensue straight upon the Resurrection. “And shall condemn it. Jerome: Not by a sentence of judgment, but by the comparison of their example; as He adds, “For they repented at the preaching of Jonas; and, behold, a greater than Jonas is here.” This word ‘hic’ is to be taken as an adverb of place, not as a pronoun. Jonas (according to the LXX) preached for three days, I for this so long time; he to the Assyrians an unbelieving nation, I to God’s own people the Jews; he preached with his voice only, doing no miracles, I, doing so many wonders, am falsely accused as Beelzebub. Chrys.: Yet does not the Lord stay here, but adds another denunciation, saying, “The queen of the south shall rise in the judgment with this generation, and shall condemn it, for she came from the ends of the earth to hear the wisdom of Solomon.” This was yet more than that first. Jonas went to them; the queen of the south waited not for Solomon to come to her, but herself sought him. Both a woman and a barbarian, and dwelling so far away, she was not afraid of death in her desire to hear his wise words. This woman went to Solomon, I came hither; she rose up from the ends of the earth, I go round about your towns and villages; he spake of trees and wood, I of unspeakable mysteries. Jerome: So the queen of the south will condemn the Jews in the same manner as the men of Nineveh will condemn unbelieving Israel. This is the queen of Saba, of whom we read in the book of Kings and Chronicles, who leaving her nation and kingdom came through so many difficulties to hear the wisdom of Solomon, and brought him many gifts. Also in these instances of Nineveh and the queen of Saba, the faith of the Gentiles is significantly set above that of Israel. Raban.: The Ninevites typify those who cease from sin — the queen those that know not to sin; for penitence puts away sin, wisdom shuns it. Remig.: Beautifully is the Church gathered out of the Gentiles spoken of as a queen who honours how to rule her ways. Of her the Psalmist speaks; “The queen stood on, thy right hand.” [Ps 45:9] She is the queen of the south because she abounds in the fervour of the Holy Spirit. Solomon, interpreted ‘peaceful,’ signifies Him of whom it is said, “He is our peace.” [Eph 2:14]"
