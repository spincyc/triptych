text = "1. “Judge not, that ye be not judged. 2. For with what judgment ye judge, ye shall be judged: and with what measure ye mete, it shall be measured to you again.” Aug.: Since when these temporal things are provided beforehand against the future, it is uncertain with what purpose it is done, as it may be with a single or double mind, He opportunely subjoins, “Judge not.” Pseudo-Chrys.: Otherwise; He has drawn out thus far the consequences of his injunctions of almsgiving; He now takes up those respecting prayer. And this doctrine is in a sort of continuation of that of the prayer; as though it should run, “Forgive us our debts,” and then should follow, “Judge not, that ye be not judged.” Jerome: But if He forbids us to judge, how then does Paul judge the Corinthian who had committed uncleanness? Or Peter convict Ananias and Sapphira of falsehood? Pseudo-Chrys.: But some explain this place after a sense, as though the Lord did not herein forbid Christians to reprove others out of good will, but only intended that Christians should not despise Christians by making a show of their own righteousness, hating others often on suspicion alone, condemning them, and pursuing private grudges under the show of piety. Chrys.: Wherefore He does not say, ‘Do not cause a sinner to cease,’ but do not judge; that is, be not a bitter judge; correct him indeed, but not as an enemy seeking revenge, but as a physician applying a remedy. Pseudo-Chrys.: But that not even thus should Christians correct Christians is shewn by that expression, “Judge not.” But if they do not thus correct, shall they therefore obtain forgiveness of their sins, because it is said, “and ye shall not be judged?” For who obtains forgiveness of a former sin, by not adding another thereto? This we have said, desiring to shew that this is not here spoken concerning not judging our neighbour who shall sin against God, but who may sin against ourselves. For whoso does not judge his neighbour who has sinned against him, him shall not God judge for his sin, but will forgive him his debt even as he forgave. Chrys.: Otherwise; He does not forbid us to judge all sin absolutely, but lays this prohibition on such as are themselves full of great evils, and judge others for very small evils. In like manner Paul does not absolutely forbid to judge those that sin, but finds fault with disciples that judged their teacher, and instructs us not to judge those that are above us. Hilary: Otherwise; He forbids us to judge God touching His promises; for as judgements among men are founded on things uncertain, so this judgment against God is drawn from somewhat that is doubtful. And He therefore would have us put away the custom from us altogether; for it is not here as in other cases where it is sin to have given a false judgment; but here we have begun to sin if we have pronounced any judgment at all. Aug., Serm. in Mont., ii, 18: I suppose the command here to be no other than that we should always put the best interpretation on such actions as seem doubtful with what mind they were done. But concerning such as cannot be done with good purpose, as adulteries, blasphemies, and the like, He permits us to judge; but of indifferent actions which admit of being done with either good or bad purpose, it is rash to judge, but especially so to condemn. There are two cases in which we should be particularly on our guard against hasty judgments, when it does not appear with what mind the action was done; and when it does not yet appear, what sort of man any one may turn out, who now seems either good or bad. Wherefore he should neither blame those things of which we know with what mind they are done, nor so blame those things which are manifest, as though we despaired of recovery. Here one may think there is difficulty is what follows, “With what judgment ye judge ye shall be judged.” If we judge a hasty judgment, will God also judge us with the like? Or if we have measured with a false measure, is there with God a false measure whence it may be measured to us again? For by measure I suppose is here meant judgment. Surely this is only said, that the haste in which you punish another shall be itself your punishment. For injustice often does no harm to him who suffers the wrong; but must always hurt him who does the wrong. Aug., City of God, xxi, 11: Some say, How is it true that Christ says, “And with what measure ye shall mete it shall be measured to you again,” if temporal sin is to be punished by eternal suffering? They do not observe that it is not said “the same measure,” because of the equal space of time, but because of the equal retribution - namely, that he who has done evil should suffer evil, though even in that sense it might be said of that of which the Lord spoke here, namely of judgments and condemnations. Accordingly, he that judges and condemns unjustly, if he is judged and condemned, justly receives in the same measure though not the same thing that he gave; by judgment he did what was unjust, by judgment he suffers what is just."
