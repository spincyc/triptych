text = "44. “Again, the kingdom of heaven is like unto treasure hid in a field; the which when a man hath found, he hideth, and for joy thereof goeth and selleth all that he hath, and buyeth that field.” Chrys.: The foregoing parables of the leaven, and the grain of mustard-seed, are referred to the power of the Gospel preaching, which has subdued the whole world; in order to shew its value and splendour, He now puts forth parables concerning a pearl and a treasure, saying, “The kingdom of heaven is like unto treasure hid in a field.” For the Gospel preaching is hidden in this world; and if, you do not sell your all you will not purchase it; and this you ought to do with joy. Wherefore it follows, “which when a man hath found, he hideth it.” Hilary: This treasure is indeed found without cost; for the Gospel preaching is open to all, but to use and possess the treasure with its field we may not without price, for heavenly riches are not obtained without the loss of this world. Jerome: That he hides it, does not proceed of envy towards others, but as one that treasures up what he would not lose, he hides in his heart that which he prizes above his former possessions. Greg., Hom. in Ev., xi, 1: Otherwise; The treasure hidden in the field is the desire of heaven; the field in which the treasure is hidden is the discipline of heavenly learning; this, when a man finds, he hides, in order that he may preserve it; for zeal and affections heavenward it is not enough that we protect from evil spirits, if we do not protect from, human praises. For in this present life we are in the way which leads to our country, and evil spirits as robbers beset us in our journey. Those therefore who carry their treasure openly, they seek to plunder in the way. When I say this, I do not mean that our neighbours should not see our works, but that in what we do, we should not seek praise from without. The kingdom of heaven is therefore compared to things of earth, that the mind may rise from things familiar to things unknown, and may learn to love the unknown by that which it knows is loved when known. It follows, “And for joy thereof he goeth and selleth all that he hath, and buyeth that field.” He it is that selleth all he hath and buyeth the field, who, renouncing fleshly delights, tramples upon all his worldly desires in his anxiety for the heavenly discipline. [margin note: Col 2:3] Jerome: Or, That treasure “in which are hid all the treasures of wisdom and knowledge,” is either God the Word, who seems hid in Christ’s flesh, or the Holy Scriptures, in which are laid up the knowledge of the Saviour. Aug., Quaest. in Ev., i, 13: Or, He speaks of the two testaments in The Church, which, when any hath attained to a partial understanding of, he perceives how great things lie hid there, and “goeth and selleth all that he hath, and buyeth that;” that is, by despising temporal things he purchases to himself peace, that he may be rich in the knowledge of God."
