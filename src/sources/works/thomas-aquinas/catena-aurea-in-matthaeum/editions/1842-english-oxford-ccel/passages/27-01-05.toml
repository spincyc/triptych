text = "1. When the morning was come, all the Chief Priests and elders of the people took counsel against Jesus to put him to death: 2. And when they had bound him, they led him away, and delivered him to Pontius Pilate the governor. 3. Then Judas, which had betrayed him, when he saw that he was condemned, repented himself, and brought again the thirty pieces of silver to the Chief Priests and elders, 4. Saying, I have sinned in that I have betrayed the innocent blood. And they said, “What is that to us? see thou to that.” 5. And he cast down the pieces of silver in the temple, and departed, and went and hanged himself. Aug., de Cons. Ev., iii, 7: The Evangelist had above brought down his history, of what was done to the Lord as far as early morning; he then turned back to relate Peter’s denial, after which he returned to the morning to continue the course of events, “When the morning was come, &c.” Origen: They supposed that by His death they should crush His doctrine, and the belief in Him of those who believed Him to be the Son of God. With such purpose against Him they bound Jesus, Who looses them that are bound. [marg. note: see Isa 61:1] Jerome: Observe the evil zeal of the Chief Priests; they watched the whole night with a view to this murder. And they gave Him up to Pilate bound, for such was their practice to send bound to the judge any whom they had sentenced to death. Raban.: Though it should be observed that they did not now first bind Him, but before, when they first laid hands upon Him in the garden, as John relates. [John 18:12] Chrys., Hom. lxxxiv: They did not put Him to death in secret, because they sought to destroy His reputation, and the wonder with which He was regarded by many. For this reason they were minded to put Him to death openly before all, and therefore they led Him to the governor. Jerome: Judas, when he saw that the Lord was condemned to death, returned the money to the Priests, as though it had been in his power to change the minds of His persecutors. Origen: Let the propounders of those fables concerning intrinsically evil natures [ed. note: vid. S. Basil. Reg. Brev. 84.] answer me here, whence Judas came to the acknowledgment of his sin, “I have sinned in that I have betrayed righteous blood,” except through the good mind originally implanted in him, and that seed of virtue which is sown in every rational soul? But Judas did not cherish this, and so fell into this sin. But if ever any man was made of a nature that was to perish, Judas was yet more of such a nature. If indeed he had done this after Christ’s resurrection, it might have been said, that the power of the resurrection brought him to repentance. But he repented when he saw Christ delivered up to Pilate, perhaps remembering the things Jesus had so often spoken of His resurrection. Or, perhaps Satan who had “entered into him” [John 13:27] continued with him till Jesus was given up to Pilate, and then, having accomplished his purpose, departed from him; whereupon be repented. But how could Judas know that He was condemned, for He had not yet been examined by Pilate? One may perhaps say, that he foreboded the event in his own mind from the very first, when he saw Him delivered up. Another may explain the words, when “he saw that he was condemned,” of Judas himself, that be then perceived his evil case, and saw that he himself was condemned. Leo, Serm., 52, 5: When he says, “I have sinned, in that I have betrayed innocent blood,” he persists in his wicked treachery, seeing that amid the last struggles of death he believed not Jesus to be the Son of God, but merely man of our rank; for had he not thus denied His omnipotence, he would have obtained His mercy. Chrys.: Observe that he repents only when his sin is finished and complete; for so the Devil suffers not those who are not watchful to see the evil before they bring it to an end. Remig.: “But they said, What is that to us?” that is to say, What is it to us that He is righteous? “See thou to it,” i.e. to thy own deed what will come of it. Though some would read these in one [marg. note: Quid ad nos tu videris?], What must we think of you, when you confess that the man whom yourself have betrayed is innocent? Origen: But when the Devil leave any one, he watches his time for return, and having taken it, he leads him into a second sin, and then watches for opportunity for a third deceit. So the man who had married his father’s wife afterwards repented him of this sin, [1 Cor 5:1] but again the Devil resolved so to augment this very sorrow of repentance, that his sorrow being made too abundant might swallow up the sorrower. Something like this took place in Judas, who after his repentance did not preserve his own heart, but received that more abundant sorrow supplied to him by the Devil, who sought to swallow him up, as it follows, “And he went out, and hanged himself.” But had he desired and looked for place and time for repentance, he would perhaps have found Him who has said, “I have no pleasure in the death of the wicked.” [Ezek 33:11] Or, perhaps, he desired to die before his Master on His way to death, and to meet Him with a disembodied spirit, that by confession and deprecation he might obtain mercy; and did not see that it is not fitting that a servant of God should dismiss himself from life, but should wait God’s sentence. Raban.: He “hung himself,” to shew that he was hateful to both heaven and earth. Pseudo-Aug., Hil. Quaest. V. et N. Test. q. 94: Since the Chief Priests were employed about the murder of the Lord from the morning to the ninth hour, how is this proved that before the crucifixion Judas returned them the money he had received, and said to them in the temple, “I have sinned, in that I have betrayed innocent blood?” Whereas it is manifest that the Chief Priests and Elders were never in the temple before the Lord’s crucifixion, seeing that when He was hanging on the Cross they were there to insult Him. Nor indeed can this be proved hence, because it is related before the Lord’s Passion, for many things which were manifestly done before, are related after, that, and the reverse. It might have been done after the ninth hour, when Judas, seeing the Saviour dead and the veil of the temple rent, the earthquake, the bursting of the rocks, and the elements terrified, was seized with fear and sorrow thereupon. But after the ninth hour the Chief Priests and Elders were occupied, as I suppose, in the celebration of the Passover; and on the Sabbath, the Law would not have allowed him to bring money. Therefore it is to me as yet unproved on what day or at what time Judas ended his life by hanging."
