text = "29. “And if they right eye offend thee, pluck it out, and cast it from thee: for it is profitable for thee that one of thy members should perish, and not that thy whole body should be cast into hell. 30. And if they right hand offend thee, cut it off, and cast it from thee: for it is profitable for thee that one of thy members should perish, and not that thy whole body should be cast into hell.” Gloss, non occ.: Because we ought not only to avoid actual sin, but even put away every occasion of sin, therefore having taught that adultery is to be avoided not in deed only, but in heart, He next teaches us to cut off the occasions of sin. Pseudo-Chrys.: But if according to that of the Prophet, “there is no whole part in our body,” [Ps 38:3] it is needful that we cut off every limb that we have that the punishment may be equal to the depravity of the flesh. Is it then possible to understand this of the bodily eye or hand? As the whole man when he is turned to God is dead to sin, so likewise the eye when it has ceased to look evil is cut off from sin. But this explanation will not suit the whole; for when He says, “thy right eye offends thee,” what does the left eye? Does it contradict the right eye, and it is preserved innocent? Jerome: Therefore by the right eye and the right hand we must understand the love of brethren, husbands and wives, parents and kinsfolk; which if we find to hinder our view of the true light, we ought to sever from us. Aug., Serm. in Mont., i, 13: As the eye denotes contemplation, so the hand aptly denotes action. By the eye we must understand our most cherished friend, as they are wont to say who would express ardent affection, ‘I love him as my own eye.’ And a friend too who gives counsel, as the eye shews us our way. The “right eye,” perhaps, only means to express a higher degree of affection, for it is the one which men most fear to lose. Or, by the right eye may be understood one who counsels us in heavenly matters, and by the left one who counsels in earthly matters. And this will be the sense; Whatever that is which you love as you would your own right eye, if it “offend you,” that is, if it be an hindrance to your true happiness, “cut it off and cast it from you.” For if the right eye was not to be spared, it was superfluous to speak of the left. The right hand also is to be taken of a beloved assistant in divine actions, the left hand in earthly actions. Pseudo-Chrys.: Otherwise; Christ would have us careful not only of our own sin, but likewise that even they who pertain to us should keep themselves from evil. Have you any friend who looks to your matters as your own eye, or manages them as your own hand, if you know of any scandalous or base action that he has done, cast him from you, he is an offence; for we shall give account not only of our own sins, but also of such of those of our neighbours as it is in our power to hinder. Hilary: Thus a more lofty step of innocence is appointed us, in that we are admonished to keep free, not only from sin ourselves, but from such as might touch us from without. Jerome: Otherwise; As above He had placed lust in the looking on a woman, so now the thought and sense straying hither and thither He calls ‘the eye.’ By the right hand and the other parts of the body, He means the initial movements of desire and affection. Pseudo-Chrys.: The eye of flesh is the mirror of the inward eye. The body also has its own sense, that is, the left eye, and its own appetite, that is, the left hand. But the parts of the soul are called right, for the soul was created both with free-will and under the law of righteousness, that it might both see and do rightly. But the members of the body being not with free-will, but under the law of sin, are called the left. Yet He does not bid us cut off the sense or appetite of the flesh; we may retain the desires of the flesh, and yet not do thereafter, but we cannot cut off the having the desires. But when we wilfully purpose and think of evil, then our right desires and right will offend us, and therefore He bids us cut them off. And these we can cut off, because our will is free. Or otherwise; Every thing, however good in itself that offends ourselves or others, we ought to cut off from us. For example, to visit a woman with religious purposes, this good intent towards her may be called a right eye, but if often visiting her I have fallen into the net of desire, or if any looking on are offended, then the right eye, that is, something in itself good, offends me. For the “right eye” is good intention, the “right hand” is good desire. Gloss. ord.: Or, the “right eye” is the contemplative life which offends by being the cause of indolence or self-conceit, or in our weakness that we are not able to support it unmixed. The “right hand” is good works, or the active life, which offends us when we are ensnared by society and the business of life. If then any one is unable to sustain the contemplative life, let him not slothfully rest from all action; or on the other hand while he is taken up with action, dry up the fountain of sweet contemplation. Remig.: The reason why the right eye and the right hand are to be cast away is subjoined in that, “For it is better, &c.” Pseudo-Chrys.: For as we are every one members one of another, it is better that we should be saved without some one of these members, than that we perish together with them. Or, it is better that we should be saved without one good purpose, or one good work, than that while we seek to perform all good works we perish together with all."
