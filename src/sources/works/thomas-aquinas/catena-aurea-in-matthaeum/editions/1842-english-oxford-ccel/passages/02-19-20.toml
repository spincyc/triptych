text = "19. But when Herod was dead, behold, an Angel of the Lord appeareth in a dream to Joseph in Egypt, 20. Saying, “Arise, and take the young Child and His mother, and go into the land of Israel; for they are dead which sought the young Child’s life. Euseb., Eccles. Hist., 1, 8: For the sacrilege which Herod had committed against the Saviour, and his wicked slaughter of the infants of the same age, the Divine vengeance hastened his end; and his body, as Josephus relates, was attacked by a strange disease; so that the prophets declared that they were not human ailments, but visitations of Divine vengeance. Filled with mad fury, he gives command to seize and imprison the heads and nobles out of all parts of Judaea; ordering that as soon as ever he should breathe his last, they should be all put to death, that so Judaea, though unwillingly, might mourn at his decease. Just before he died he murdered his son, Antipater,(besides two boys put to death before, Alexander and Aristobulus.) Such was the end of Herod, noticed in those words of the Evangelist, “when Herod was dead,” and such the punishment inflicted. Jerome: Many here err from ignorance of history, supposing the Herod who mocked our Lord on the day of His passion, and the Herod whose death is here related, were the same. But the Herod who was then made friends with Pilate was son of this Herod and brother to Archelaus; for Archelaus was banished to Lyons in Gaul, and his father Herod made king in his room, as we read in Josephus. Pseudo-Dionysius, Dion. De Cael. Hierarch. 4: See how Jesus Himself, though far above all celestial beings, and coming unchanged to our nature, shunned not that ordinance of humanity which He had taken on Him, but was obedient to the dispositions of His Father made known by Angels. For even by Angels is declared to Joseph the retreat of the Son into Egypt, so ordained of the Father, and His return again to Judaea. Pseudo-Chrys.: See how Joseph was set for ministering to Mary; when she went into Egypt and returned, who would have fulfilled to her this so needful ministry, had she not been betrothed? For to outward view, Mary nourished and Joseph defended the Child; but in truth the Child supported His mother and protected Joseph. “Return into the land of Israel;” for He went down into Egypt as a physician, not to abide there, but to succour it sick with error. But the reason of the return is given in the words, “They are dead, &c.” Jerome: From this we see that not Herod only, but also the Priests and Scribes had sought the Lord’s death at that time. Remig.: But if they were many who sought his destruction, how came they all to have died in so short a time? As we have related above, all the great men among the Jews were slain at Herod’s death. Pseudo-Chrys.: And that is said to have been done by the counsel of God for their conspiring with Herod against the Lord; as it is said, “Herod was troubled, and all Jerusalem with him.” Remig.: Or the Evangelist uses a figure of speech, by which the plural is used for the singular. These words, “the Child’s life,” overthrow those heretics [margin note: or “soul,” i.e. the Apollinarians] who taught that Christ did not take a soul, but had His Divinity in place of a soul. Bede, Hom. in Nat. Innocent: This slaughter of the infants for the Lord’s sake, the death of Herod soon after, and Joseph’s return with the Lord and his mother to the land of Israel, is a figure shewing that all the persecutions moved against the Church will be avenged by the death of the persecutor, peace restored to the Church, and the saints who had concealed themselves return to their own places. Or the return of Jesus to the land of Israel on the death of Herod shews, that, at the preaching of Enoch and Elijah [see note, c, below], the Jews, when the fire of modern jealousy shall be extinguished, shall receive the true faith. [ed. note, c: That Enoch and especially Elias will come at the end of the world and by their preaching convert the Jews is affirmed by Tertullian, (de Anima 35. de Resur. c. 22) Origen, (in Joann, i. tom. 5. in Matt. tom. 13) Hilary, (in Matt. xx. 10. xxvi. 5) Chrysostom, (in Matt. xvii. 10) Augustine, (City of God 20, 29. Op. Imp. contra Julian. vi. 30) Pope Gregory, (in Job. lib. xiv. 23. in Joann. Hom. vii. 1) and Damascene, (de Fid. Orth. iv. 26 fin]"
