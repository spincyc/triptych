text = "10. When they saw the star, they rejoiced with exceeding great joy. 11. And when they were come into the house, they saw the young Child with Mary His mother, and fell down, and worshipped Him: and when they had opened their treasures, they presented unto Him gifts; gold, and frankincense, and myrrh. Gloss: This service of the star is followed by the rejoicing of the Magi. Remig.: And it was not enough to say, “They rejoiced,” but “they rejoiced with exceeding great joy.” Pseudo-Chrys.: They rejoiced, because their hopes were not falsified but confirmed, and because the toil of so great travel had not been undertaken in vain. Gloss. ord.: He rejoices indeed who rejoices on God’s account, who is the true joy. “With great joy,” he says, for they had great cause. Pseudo-Chrys.: By the mystery of this star they understood that the dignity of the King then born exceeded the measure of all worldly kings. Remig.: He adds, “greatly,” shewing that men rejoice more over what they have lost than over what they possess. Leo, Serm. in Epiph., 4. 3: Though in stature a babe, needing the aid of others, unable to speak, and different in nothing from other infants, yet such faithful witnesses, shewing the unseen Divine Majesty which was in Him, ought to have proved most certainly that was the Eternal Essence of the Son of God that had taken upon Him the true human nature. Pseudo-Chrys.: “Mary His mother,” not crowned with a diadem or laying on a golden couch; but with barely one garment, not for ornament but for covering, and that such as the wife of a carpenter when abroad might have. Had they therefore come to seek an earthly king, they would have been more confounded than rejoiced, deeming their pains thrown away. But now they looked for a heavenly King; so that though they saw nought of regal state, that star’s witness sufficed them, and their eyes rejoiced to behold a despised Boy, the Spirit shewing Him to their hearts in all His wonderful power, they fell down and worshipped, seeing the man, they acknowledged the God. Rabanus: Joseph was absent by Divine command, that no wrong suspicions might occur to the Gentiles. Gloss, Anselm: in these offerings we observe their national customs, gold, frankincense, and various spices abounding among the Arabians; yet they intended thereby to signify something in mystery. Greg., Hom. in Evan., 1, 106: Gold, as to a King; frankincense, as sacrifice to God; myrrh, as embalming the body of the dead. Aug.: Gold, as paid to a mighty King; frankincense, as offered to God; myrrh, as to one who is to die for the sins of all. Pseudo-Chrys.: And though it were not then understood what these several gifts mystically signified, that is no difficulty; the same grace that instigated them to the deed, ordained the whole. Remig.: And it is to be known that each did not offer a different gift, but each one the three kings, each one thus proclaiming the King, the God, and the man. Chrys.: Let Marcion and Paul of Samosata then blush, who will not see what the Magi saw, those progenitors of the Church adoring God in the flesh. That He was truly in the flesh, the swaddling clothes and the stall prove; yet that they worshipped Him not as mere man, but as God, the gifts prove which it was becoming to offer to a God. Let the Jews also be ashamed, seeing the Magi coming before them, and themselves not even earnest to tread in their path. Greg.: Something further may yet be meant here. Wisdom is typified by gold; as Solomon saith in the Proverbs, “A treasure to be desired is in the mouth of the wise.” By frankincense, which is burnt before God, the power of prayer is intended, as in the Psalms, “Let my speech come before thee as incense.” [Ps 141:2] In myrrh is figured mortification of the flesh. To a king at his birth we offer gold, if we shine in his sight with the light of wisdom; we offer frankincense, if we have power before God by the sweet savour of our prayers; we offer myrrh, when we mortify by abstinence the lusts of the flesh. Gloss, Anselm: The three men who offer, signify the nations who come from the three quarters of the earth. They open their treasures, i.e. manifest the faith of their hearts by confession. Rightly “in the house,” teaching that we should not vaingloriously display the treasure of a good conscience. They bring “three” gifts, i.e. the faith in the Holy Trinity. Or opening the stores of Scripture, they offer its threefold sense, historical, moral and allegorical; or Logic, Physic, and Ethics, making them all serve the faith."
