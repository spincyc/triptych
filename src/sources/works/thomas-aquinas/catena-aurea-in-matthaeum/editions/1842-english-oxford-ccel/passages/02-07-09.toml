text = "7. Then Herod, when he had privily called the wise men, enquired of them diligently what time the star appeared. 8. And he sent them to Bethlehem, and said, “Go and search diligently for the young Child; and when ye have found Him, bring me word again, that I may come and worship Him also.” 9. Whey they had heard the king, they departed. Pseudo-Chrys.: As soon as Herod had heard the answer, though doubly authenticated, both by the authority of the Priests, and the passage from the Prophets, he yet turned not to worship the King that was to be born, but sought how he might put Him to death by subtilty. He saw that the Magi were neither to be won by flattery, nor awed by threats, nor bribed by gifts, to consent to this murder; he sought therefore to deceive them; “he privily called the wise men;” that the Jews, whom he suspected, might not know of it. For he thought they would incline the rather to a King of their own nation. Remig.: “Diligently enquired;” craftily, for he feared they would not return to him, and then he should know how he should do to put the young Child to death. Pseudo-Aug., Serm. in App. 131, 3: The star had been seen, and with great wonder, nearly two years before. We are to understand that it was signified to them whose the star was, which was visible all that time till He, whom it signified, was born. Then as soon as Christ was made known to them they set out, and came and worshipped Him in thirteen days from the east. [ed. note: This is written upon the notion that the Magi presented themselves to Christ twelve days after His birth, according to the Latin date for celebrating the event. It seems really to have taken place after the Purification, on the return of St. Mary to Bethlehem. However, Aug. (Cons. Evan., ii. 11) places it before the Purification.] Chrys.: Or, the star appeared to them long time before, because the journey would take up some time, and they were to stand before Him immediately on His birth, that seeing Him in swaddling clothes, He might seem the more wonderful. Gloss: According to others, the star was first seen on the day of the nativity, and having accomplished its end, ceased to be. Thus Fulgentius [margin note: Serm. de Epiph.] says, “The Boy at His birth created a new star.” Though they now knew both time and place, he still would not have them ignorant of the person of the Child, “Go,” he says, “and enquire diligently of the young Child;” a commission they would have executed even if he had not commanded it. Chrys.: “Concerning the young Child,” he says, not ‘of the King;’ he envies Him the regal title. Pseudo-Chrys.: To induce them to do this, he put on the colour of devotion, beneath which he whetted the sword, hiding the malice of his heart under colour of humility. Such is the manner of the malicious, when they would hurt any one in secret, they feign meekness and affection. Greg., Hom. in Ev. i. 10. 3: He feigns a wish of worshipping Him only that he may discover Him, and put him to death. Remig.: The Magi obeyed the King so far as to seek the Lord, but not to return to Herod. Like in this to good hearers; the good they hear from wicked preachers, that they do; but do not imitate their evil lives."
