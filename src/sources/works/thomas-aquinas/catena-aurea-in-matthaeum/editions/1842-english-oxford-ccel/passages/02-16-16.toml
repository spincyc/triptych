text = "16. Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently enquired of the wise men. Pseudo-Chrys.: When the infant Jesus had subdued the Magi, not by the might of His flesh, but the grace of His Spirit, Herod “was exceeding wrath,” that they whom he, sitting on his throne, had no power to move, were obedient to an Infant lying in a manger. Then by their contempt of him the Magi gave further cause of wrath. For when kings’ wrath is stirred by fear for their crowns, it is a great and inextinguishable wrath. But what did he? “He sent and slew all the children.” As a wounded beast rends whatsoever meeteth it as if the cause of its smart, so he mocked by the Magi spent his fury on children. He said to himself in his fury, ‘Surely the Magi have found the Child whom they said should be King;’ for a king in fear for his crown fears all things, suspects all. Then he sent and slew all those infants, that he might secure one among so many. Aug.: And while he thus persecutes Christ, he furnished an army (or martyrs) clothed in white robes of the same age as the Lord. Aug., Serm. 220. App.: Behold how this unrighteous enemy never could have so much profited these infants by his love, as he did by his hate; for as much as iniquity abounded against them, so much did the grace of blessing abound on them. Aug., Serm. 373, 3: O blessed infants! He only will doubt of your crown in this your passion for Christ, who doubts that the baptism of Christ has a benefit for infants. He who at His birth had Angels to proclaim Him, the heavens to testify, and Magi to worship Him, could surely have prevented that these should not have died for Him, had He not known that they died not in that death, but rather lived in higher bliss. Far be the thought, that Christ who came to set men free, did nothing to reward those who died in His behalf, when hanging on the cross He prayed for those who put Him to death. Rabanus: He is not satisfied with the massacre at Bethlehem, but extends it to the adjacent villages; sparing no age from the child of one night old, to that of two years. Aug., Serm. 132, App.: The Magi had seen this unknown star in the heavens, not a few days, but two years before, as they had informed Herod when he enquired. This caused him to fix “two years old and under;” as it follows, “according to the time he had enquired of the Magi.” Gloss. ord.: Or because he feared that the Child to whom even stars ministered, might transform His appearance to greater or under that of His own age, or might conceal all those of that age: hence it seems to be that he slew all from one day to two years old. Aug., de Cons. Evan., 2, 11: Or, disturbed by pressure of still more imminent dangers, Herod’s thoughts are drawn to other thoughts than the slaughter of children, he might suppose that the Magi, unable to find Him whom they had supposed born, were ashamed to return to him. So the days of purification being accomplished, they might go up in safety to Jerusalem. And who does not see the one day they may have escaped the attention of a King occupied with so many cares, and that afterwards when the things done in the Temple came to be spread abroad, then Herod discovered that he had been deceived by the Magi, and then sent and slew the children. Bede, Hom. in Nat. Innocent: In this death of the children the precious death of all Christ’s martyrs is figured; that they were infants signifies, that by the merit of humility alone can we come to the glory of martyrdom; that they were slain in Bethlehem and the coasts thereof, that the persecution shall be both in Jerusalem whence the Church originated, and throughout the world; in those of two years old are figured the perfect in doctrine and works; those under that age the neophytes; that they were slain while Christ escaped, signifies that the bodies of the martyrs may be destroyed by the wicked, but that Christ cannot be taken from them."
