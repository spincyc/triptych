text = "9. And, lo, the star, which they saw in the east, went before them, till it came and stood over where the young Child was. Pseudo-Chrys.: This passage shews, that when the star had brought the Magi nearly to Jerusalem, it was hidden from them, and so they were compelled to ask in Jerusalem, “where Christ should be born?” and thus to manifest Him to them; on two accounts, first, to put to confusion the Jews, inasmuch as the Gentiles instructed only by sight of a star sought Christ through strange lands, while the Jews who had read the Prophets from their youth did not receive Him, though born in their country. Secondly, that the Priests, when asked where Christ should be born, might answer to their now condemnation, and while they instructed Herod, they were themselves ignorant of Him. “The star went before them,” to shew them the greatness of the King. Aug.: To perform its due service to the Lord, it advanced slowly, leading them to the spot. It was ministering to Him, and not ruling His fate; its light shewed the suppliants and filled the inn, shed over the walls and roof that covered the birth; and thus it disappeared. Pseudo-Chrys.: What wonder that a divine star should minister to the Sun of righteousness about to rise. It stood over the Child’s head, as it were, saying, ‘This is He;’ proving by its place what it had no voice to utter. Gloss. Anselm: It is evident that the star must have been in the air, and close above the house where the Child was, else it would not have pointed out the exact house. Ambrose, in Luc. 2, 45: The star is the way, and the way is Christ; and according to the mystery of the incarnation, Christ is a star. He is a blazing and a morning-star. Thus where Herod is, the star is not seen; where Christ is, there it is again seen, and points out the way. Remig.: Or, the star figures the grace of God, and Herod the Devil. He, who by sin puts himself in the Devil’s power, loses that grace; but if he return by repentance, he soon finds that grace again which leaves him not till it have brought him to the young Child’s house, i.e. the Church. Gloss. ord.: Or, the star is the illumination of faith, which leads him to the nearest aid; while they turn aside to the Jews, the Magi lose it; so those who seek counsel of the bad, lose the true light."
