text = "31. And after that they had mocked him, they took the robe off from him, and put his own raiment on him, and led him away to crucify him. 32. And as they came out, they found a man of Cyrene, Simon by name: him they compelled to bear his cross. 33. And when they were come unto a place called Golgotha, that is to say, a place of a skull, 34. They gave him vinegar to drink mingled with gall: and when he had tasted thereof, he would not drink. Gloss, non occ.: After the Evangelist had narrated what concerned the mocking of Christ, he proceeds to His crucifixion. Aug., de Cons. Ev., iii, 9: This is to be understood to have been done at the end of all when He was led off to crucifixion after Pilate had delivered Him up to the Jews. Jerome: It is to be noted, that when Jesus is scourged and spit upon, He has not on His own garments, but those which He took for our sins; but when He is crucified, and the show of His mockery is completed, then He takes again His former garments, and His own dress, and immediately the elements are shaken, and the creature gives testimony to the Creator. Origen: Of the cloak it is mentioned that they took it off Him, but of the crown of thorns the Evangelists have not spoken, so that there are now no longer those ancient thorns of ours, since Jesus has taken them from us upon HiS revered head. Chrys., Hom. de Cruc. et Lat., ii: The Lord would not suffer under a roof, or in the Jewish Temple, that you should not suppose that He was offered for that people alone; but without the city, without the walls, that you might know that the sacrifice was common, that it was the offering of the whole earth, that the purification was general. Jerome: Let none think that John’s narrative contradicts this place of the Evangelist. John says that the Lord went forth from the praetorium bearing His cross; Matthew tells, that they found a man of Cyrene upon whom they laid Jesus’ cross. We must suppose that as Jesus went out of the praetorium, He was bearing His cross, and that afterwards they met Simon, whom they compelled to bear it. Origen: Or, as they went out, they laid hold of Simon, but when they drew near to the place in which they would crucify Him, they laid the cross upon Him that He might bear it. Simon obtained not this office by chance, but was brought to the spot by God’s providence, that he might be found worthy of mention in the Scriptures of the Gospel, and of the ministry of the cross of Christ. And it was not only meet that the Saviour should carry His cross, but meet also that we should take part therein, filling a carriage so beneficial to us. Yet would it not have so profited us to take it on us, as we have profited by His taking it upon Himself. [marg. note: ἀγγαρεία] Jerome: Figuratively, the nations take up the cross, and the foreigner by obedience bears the ignominy of the Saviour. Hilary: For a Jew was not worthy to bear Christ’s cross, but it was reserved for the faith of the Gentiles both to take the cross, and to suffer with Him. Remig.: For this Simon was not a man of Jerusalem, but a foreigner, and denizen, being a Cyrenean; Cyrene is a town of Lybia. Simon is interpreted ‘obedient,’ and a Cyrenean ‘an heir;’ whence he well denotes the people of the Gentiles, which was strange to the testaments of God, but by believing became a fellow-citizen of the saints, of the household, and an heir of God. Greg., Hom. in. Ev., xxxii, 3: Or otherwise; By Simon who bears the burden of the Lord’s cross are denoted those who are abstinent and proud; these by their abstinence afflict their flesh, but seek not within the fruit of abstinence. Thus Simon bears the cross, but does not die thereon, as these afflict the body, but in desire of vain-glory live to the world. Raban.: “Golgotha” is a Syriac word, and is interpreted Calvary. Jerome: [ed. note, b: He probably refers to an anonymous disputant, of whom he speaks more at length in his Commentary on Ephesians 5, 14; but a tradition to the same effect is mentioned by Origen, whose words, as preserved in a MS. Catena quoted by Ruaeus, are, “A tradition has come down to us, preserved by the Hebrews, that the body of Adam is buried in Calvary, so that as in Adam all die, so in Christ may all be made alive.” And to the same effect Epiphanius cont. Tatian, and the Pseudo-Cyprian. ‘De Resur. Christi.’] I have heard Calvary expounded as the spot in which Adam was buried, as though it had been so called from the head of the old man being buried there. A plausible interpretation, and agreeable to the ears of the people, yet not a true one. Without the city outside the gate are the places where criminals are executed, and these have got the name of Calvary, that is, of the beheaded. And Jesus was crucified there, that where the plot of criminals had been, there might be set up the flag of martyrdom. But Adam was buried near Ebron and Arbee, as we read in the volume of Jesus the son of Nave. [ed. note: Josh. 14, 15. in the Vulgate, “Adam maximus ibi inter Enacim situs est;” departing from both the Heb. and LXX.] Hilary: Such is the place of the cross, set up in the centre of the earth, that it might be equally free to all nations to attain the knowledge of God. Aug., de Cons. Ev., iii, 11: “And they gave him to drink wine mingled with gall.” Mark says, “mingled with myrrh.” [Mark 16:23] Matthew put “gall” to express bitterness, but wine mingled with myrrh is very bitter; though indeed it might be, that gall together with myrrh would make the most bitter. Jerome: The bitter vine makes bitter wine; this they gave the Lord Jesus to drink, that that might be fulfilled which was written, “They gave me also gall for my meat.” [Ps 69:12] And God addresses Jerusalem, “I had planted there a true vine, how art thou turned into the bitterness of a strange vine?” [Jer 2:21] Aug.: “And when he had tasted thereof, he would not drink.” That Mark says, “But he received it not,” we understand to mean that He would not receive it to drink thereof. For that He tasted it Matthew bears witness; so that Matthew’s, “He could not drink thereof,” means exactly the same as Mark’s, “He received it not;” only Mark does not mention His tasting it. That He tasted but would not drink of it signifies that He tasted the bitterness of death for us, but rose again the third day. Hilary: Or, He therefore refused the “wine mingled with gall, because the bitterness of sin is not mingled with the incorruption of eternal glory."
