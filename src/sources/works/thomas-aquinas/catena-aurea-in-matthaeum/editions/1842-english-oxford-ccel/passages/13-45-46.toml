text = "45. “Again, the kingdom of heaven is like unto a merchant man, seeking goodly pearls: 46. Who, when he had found one pearl of great price, went and sold all that he had, and bought it.” Chrys.: The Gospel preaching not only offers manifold gain as a treasure, but is precious as a pearl; wherefore after the parable concerning the treasure, He gives that concerning the pearl. And in preaching, two things are required, namely, to be detached from the business of this life, and to be watchful, which are denoted by this merchant- man. Truth moreover is one, and not manifold, and for this reason it is one pearl that is said to be found. And as one who is possessed of a pearl, himself indeed knows of his wealth, but is not known to others, ofttimes concealing it in his hand because of its small bulk, so it is in the preaching of the Gospel; they who possess it know that they are rich, the unbelievers, not knowing of this treasure, know not of our wealth. Jerome: By the goodly pearls may be understood the Law and the Prophets. Hear then Marcion and Manichaeus; the good pearls are the Law and the Prophets. One pearl, the most precious of all, is the knowledge of the Saviour and the sacrament of His passion and resurrection, which when the merchantman has found, like Paul the Apostle, he straightway despises all the mysteries of the Law and the Prophets and the old observances in which he had lived blameless, counting them as dung that he may win Christ. [margin note: Phil 3:8] Not that the finding of a new pearl is the condemnation of the old pearls, but that in comparison of that, all other pearls are worthless. Gregory, Hom. in Ev., xi, 2: Or by the pearl of price is to be understood the sweetness of the heavenly kingdom, which, he that hath found it, selleth all and buyeth. For he that, as far as is permitted, has had perfect knowledge of the sweetness of the heavenly life, readily leaves all things that he has loved on earth; all that once pleased him among earthly possessions now appears to have lost its beauty, for the splendour of that precious pearl is alone seen in his mind. Aug., Quaest. in Matt., q. 13: Or, A man seeking goodly pearls has found one pearl of great price; that is, he who is seeking good men with whom he may live profitably, finds one alone, Christ Jesus, without sin; or, seeking precepts of life, by aid of which he may dwell righteously among men, finds love of his neighbour, in which one rule, the Apostle says [margin note: Rom 13:9], are comprehended all things; or, seeking good thoughts, he finds that Word in which all things are contained, “In the beginning was the Word,” [John 1:1] which is lustrous with the light of truth, stedfast with the strength of eternity, and throughout like to itself with the beauty of divinity, and when we have penetrated the shell of the flesh, will be confessed as God. But whichever of these three it may be, or if there be any thing else that can occur to us, that can be signified under the figure of the one precious pearl, its preciousness is the possession of ourselves, who are not free to possess it unless we despise all things that can be possessed in this world. For having sold our possessions, we receive no other return greater than ourselves, (for while we were involved in such things we were not our own,) that we may again give ourselves for that pearl, not because we are of equal value to that, but because we cannot give any thing more."
