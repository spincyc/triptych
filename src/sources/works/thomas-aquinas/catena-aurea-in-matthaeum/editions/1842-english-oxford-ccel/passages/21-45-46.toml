text = "45. And when the Chief Priests and Pharisees had heard his parables, they perceived that he spake of them. 46. But when they sought to lay hands on him, they feared the multitude, because they took him for a prophet. Jerome: Hard as were the hearts of the Jews in unbelief, they yet perceived that the Lord’s sentence was directed against themselves. Pseudo-Chrys., in fin. Hom. xxxix: Here is the difference between good and bad men. The good man when taken in a sin has sorrow because he has sinned, the bad man is grieved not because he has sinned, but because he is found out in his sin; and he not only does not repent, but is indignant with him that reproved him. Thus they being taken in their sins were stirred up to still greater wickedness; “And they sought to lay hands on him, but feared the multitude, because they took him for a Prophet.” Origen: One thing they know which is true concerning Him; they esteemed Him a Prophet, though not understanding His greatness in respect of His being the Son of God. But the rulers feared the multitude who thought thus of Him, and were ready to fight for Him; for they could not attain to the understanding which the multitude had, seeing they thought nothing worthy concerning Him. Further, know that there are two different kinds of desires to lay hands on Jesus. The desire of the rulers and Pharisees was one kind; another that of the Bride, “I held him, and would not let him go;” [ Song of Songs 3:4] intending to try Him still further, as she saith, “I will get me up into the palm tree, I will lay hold of its height.” [Song of Songs 7:8] All who think not rightly concerning His divinity, seek to lay hands on Jesus in order to put Him to death. Other words indeed excepting the word of Christ it is possible to seize and to hold, but the word of truth none can seize, that is, understand; none can hold it, that is, convict; nor separate it from the conviction of those that believe; nor do it to death, that is, destroy it. Pseudo-Chrys.: Every wicked man also, as far as his will is concerned, lays hands on God, and puts Him to death. For whoso tramples upon God’s commandments, or murmurs against God, or raises a sullen look to heaven, would not he, if he had the power, lay hands on God, and kill Him, that he might sin without restraints? Raban.: This, that they are afraid to lay hands on Jesus because of the multitudes, is daily acted in the Church, when any who is a brother only in name, is ashamed or afraid to assail the unity of faith and peace which he does not love, because of the good men with whom he lives."
