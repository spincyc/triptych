text = "20. Then charged he his disciples that they should tell no man that he was Jesus the Christ. 21. From that time forth began Jesus to shew unto his disciples, how that he must go unto Jerusalem, and suffer many things of the elders and Chief Priests and Scribes, and be killed, and be raised again the third day. Origen: Seeing Peter had confessed Him to be Christ the Son of the living God, because He would not have them preach this in the mean time, He adds, “Then charged he his disciples that they should tell no man, that he was Jesus the Christ.” Jerome: When then above He sends His disciples to preach, and commands them to proclaim His advent, this seems contrary to His command here, that they should not say that He is Jesus the Christ. To me it seems that it is one thing to preach Christ, and another to preach Jesus the Christ. Christ is a common title of dignity, Jesus the proper name of the Saviour. Origen: Or they then spake of Him in lowly words, as only a great and wonderful man, but as yet proclaimed Him not as the Christ. Yet if any will have it that He was even at the first proclaimed to be Christ, be may say that now He chose that first short announcement of His name to be left in silence and not repeated, that little which they had heard concerning Christ might be digested into their minds. Or the difficulty may be solved thus: that the fairer relation concerning their preaching Christ does not belong to the time before His Resurrection, but to the time that should be after the Resurrection; and that the command now given is meant for the time present; for it were of no use to preach Him, and to be silent conceiving His cross. Moreover, He commanded them that they should tell no man that He was the Christ, and prepared them that they should afterwards say that He was Christ who was crucified, and who rose again from the dead. Jerome: But that none should suppose that this is only any explanation, and not an evangelic interpretation, what follows explains the reasons of His forbidding them to preach Him at that time; “Then began Jesus to shew unto his disciples that he must needs go unto Jerusalem, and suffer many things of the elders and Scribes, and Chief Priests, and be put to death, and rise again the third day.” The meaning is; Then preach Me when I shall have suffered these things, for it will be of no avail that Christ be preached publicly, and His Majesty spread abroad among the people, when after a little time they shall see Him scourged and crucified. Chrys.: For what having once had root has afterwards been torn up, if it is again planted, is with difficulty retained among the multitude; but what having been once rooted has continued ever after unmoved, is easily brought on to a further growth. He therefore dwells on these sorrowful things, and repeats His discourse upon them, that He may open the minds of His disciples. Origen: And observe that it is not said, ‘He began to say,’ or ‘to teach,’ but “to shew;” for as things are said to be shewn to the sense, so the things which Christ spake are said to be shewn by Him. Nor indeed do I think, that to those who saw Him suffering many things in the flesh, were those things which they saw so shewn as this representation in words shewed to the disciples the mystery of the passion and resurrection of Christ. At that time, indeed, He only “began to shew them,” and afterwards when they were more able to receive it, He shewed them more fully; for all that Jesus began to do, that He accomplished. He must needs go to Jerusalem, to be put to death indeed in the Jerusalem which is below, but to rise again and reign in the heavenly Jerusalem. But when Christ rose again, and others were risen with Him, they no longer sought the Jerusalem which is beneath, or the house of prayer in it, but that which is above. He suffers many things from the elders of the earthly Jerusalem, that He may be glorified by those heavenly elders who receive His mercies. He rose again from the dead on the third day, that He may deliver from the evil one, and purchase for such as are so delivered this gift, that they be baptized in spirit, soul, and body, in the name of the Father, and the Son, and the Holy Spirit, who are three days perpetually present to those that through them have been made children of light."
