text = "Pseudo-Origen, Hom. in div. 5: And now also when the heads of Churches, holy men and acceptable to God, enter your roof, then in them the Lord also enters, and do you think of yourself as receiving the Lord. And when you eat and drink the Lord’s Body then the Lord enters under your roof, and you then should humble yourself, saying, “Lord, I am not worthy.” For where He enters unworthily, there He enters to the condemnation of him who receives Him."
