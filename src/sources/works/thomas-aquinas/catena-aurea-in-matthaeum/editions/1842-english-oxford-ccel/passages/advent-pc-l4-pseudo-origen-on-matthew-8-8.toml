notes = "Exact CCEL English digital witness of the Oxford Catena inspected on 2026-11-26; no facsimile collation and no collation with the Latin. Not verified. Attribute as the Catena gives it. The 1842 English editor's bracketed note (beginning ed. note: and citing the Liturgy of St. John Chrysostom, Andrewes and the Anglican Communion Service) and the comma after it are excluded; the text therefore runs Body then the Lord enters, and a quotation across that point marks the omission. The label names a Latin homily transmitted under Origen's name, not Origen."
