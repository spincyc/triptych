text = "3. And when the Tempter came to Him, he said, “If Thou be the Son of God, command that these stones be made bread.” 4. But He answered and said, “It is written, ‘Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.’ “ Pseudo-Chrys.: The Devil who had begun to despair when he saw that Christ fasted forty days, now again began to hope when he saw that “he was an hungred;” and “then the tempter came to him.” If then you shall have fasted and after been tempted, say not, I have lost the fruit of my fast; for though it have not availed to hinder temptation, it will avail to hinder you from being overcome by temptation. Greg.: If we observe the successive steps of the temptation, we shall be able to estimate by how much we are freed from temptation. The old enemy tempted the first man through his belly, when he persuaded him to eat of the forbidden fruit; through ambition when he said, “Ye shall be as gods;” through covetousness when he said, “Knowing good and evil;” for there is a covetousness not only of money, but of greatness, when a high estate above our measure is sought. By the same method in which he had overcome the first Adam, in that same was he overcome when he tempted the second Adam. He tempted through the belly when he said, “Command that these stones become loaves;” through ambition when he said, “If thou be the Son of God, cast thyself down from hence;” through covetousness of lofty condition in the words, “All these things will I give thee.” Ambrose, Ambros. in Luc., c. 4. 3: He begins with that which had once been the means of his victory, the palate; “If thou be the Son of God, command that these stones become loaves.” What means such a beginning as this, but that he knew that the Son of God was to come, yet believed not that He was come on account of His fleshly infirmity. His speech is in part that of an enquirer, in part that of a tempter; he professes to believe Him God, he strives to deceive Him as man. Hilary: And therefore in the temptation he makes a proposal of such a double kind by which His divinity would be made known by the miracle of the transformation, the weakness of the man deceived by the delight of food. Jerome: But thou art caught, O Enemy, in a dilemma. If these stones can be made bread at His word, your temptation is vain against one so mighty. If He cannot make them bread, your suspicions that this is the Son of God must be vain. Pseudo-Chrys.: But as the Devil blinds all men, so is he now invisibly made blind by Christ. He found Him “an hungred” at the end of forty days, and knew not that He had continued through those forty without being hungry. When he suspected Him not to be the Son of God, he considered not that the mighty Champion can descend to things that be weak, but the weak cannot ascend to things that are high. We may more readily infer from His not being “an hungred” for so many days that He is God, than from His being “an hungred” after that time that He is man. But it may be said, Moses and Elias fasted forty days, and were men. But they hungred and endured, He for the space of forty days hungred not, but afterwards. To be hungry and yet refuse food is within the endurance of man; not be hungry belongs to the Divine nature only. Jerome: Christ’s purpose was to vanquish by humility; Leo, Serm. 39, 3: hence he opposed the adversary rather by testimonies out of the Law, than by miraculous powers; thus at the same time giving more honour to man, and more disgrace to the adversary, when the enemy of the human race thus seemed to be overcome by man rather than by God. Greg.: So the Lord when tempted by the Devil answered only with precepts of Holy Writ, and He who could have drowned His tempter in the abyss, displayed not the might of His power; giving us an example, that when we suffer any thing at the hands of evil men, we should be stirred up to learning rather than to revenge. Pseudo-Chrys.: He said not, ‘I live not,’ but, “Man doth not live by bread alone,” that the Devil might still ask, “If thou be the Son of God.” If He be God, it is as though He shunned to display what He had power to do; if man, it is a crafty will that His want of power should not be detected. Rabanus: This verse is quoted from Deuteronomy. [margin note: c. 8. 3] Whoso then feeds not on the Word of God, he lives not; as the body of man cannot live without earthly food, so cannot his soul without God’s word. This word is said to proceed out of the mouth of God, where he reveals His will by Scripture testimonies."
