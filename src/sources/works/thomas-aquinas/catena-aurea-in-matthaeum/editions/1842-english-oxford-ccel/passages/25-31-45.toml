  { line = 6244, text = "Aug., Serm. 351, 8: But one will say, I desire not to reign, it is enough for me that I be saved. Wherein they are deceived, first, because there is no salvation for those whose iniquity abounds; and, secondly, because if there be any difference between those that reign, and those that do not reign, yet must all be within the same kingdom, lest they be esteemed for foes or aliens, and perish while the others reign. Thus all the Romans inherit the kingdom of Rome, though all do not reign in it." },
