  { line = 6248, text = "Greg., Mor. xxvi, 27: These, to whom as they stand on His right hand the Judge at His coming shall say, “I was an hungred &c.” are they who are judged on the side of the elect, and who reign; who wash away the stains of their life with tears; who redeem former sins by good deeds following; who, whatever unlawful thing they have at any time done, have covered it from the Judge’s eyes by a cloak of alms. Others indeed there are who are not judged, yet reign, who have gone even beyond the precepts of the Law in the perfection of their virtue." },
  { line = 6249, text = "Origen: It is from humility that they declare themselves unworthy of any praise for their good deeds, not that they are forgetful of what they have done. But He shews them His close sympathy with His own." },
  { line = 6250, text = "Raban.: “Lord, when saw we thee &c.” This they say not because they distrust the Lord’s words, but they are in amaze at so great exaltation, and at the greatness of their own glory; or because the good which they have done will seem to them to be so small according to that of the Apostle, “For the sufferings of this present time are not worthy to be compared to the glory that shall be revealed in us.” [Rom 8:18]" },
  { line = 6251, text = "Jerome: It were indeed free to us to understand that it is Christ in every poor man whom we feed when he is hungry, or give drink to when he is thirsty, and so of other things; but when He says, “In that ye have done it to one of the least of these my brethren,” He seems to me not to speak of the poor generally, but of the poor in spirit, those to whom He pointed and said, “Whosoever shall do the will of my Father which is in heaven, the same is my brother.” [Matt 12:50]" },
  { line = 6252, text = "Chrys.: But if they are His brethren, why does He call them “the least?” Because they are lowly, poor, and outcast. By these He means not only the monks who have retired to the mountains, but every believer though he should be secular, though an hungred, or the like, yet He would have him obtain merciful succours, for baptism and communication of the Divine mysteries makes him a brother." },
  { line = 6253, text = "Origen: As He had said to the righteous, “Come ye,” so He says to the wicked, “Depart ye,” for they who keep God’s commandment are near to the Word, and are called that they may be made more near; but they are far from it, though they may seem to stand hard by, who do not His commands; therefore it is said to them, “Depart ye,” that those who seemed to be living before Him, might be no more seen." },
  { line = 6254, text = "It should be remarked, that though He had said to the Saints, “Ye blessed of my Father,” He says not now, “Ye cursed of my Father,” because of all blessing the Father is the author, but each man is the origin of his own curse when he does the things that deserve the curse. They who depart from Jesus fall into eternal fire, which is of a very different kind from that fire which we use. For no fire which we have is eternal, nor even of any long continuance." },
  { line = 6255, text = "And note, that He does not say, ‘the kingdom prepared for the Angels,’ as He does say “everlasting fire prepared for the Devil and his Angels;” because He did not, as far as in Him lay, create men to perdition, but sinners yoke themselves to the Devil, so that as they that are saved are made equal to the holy Angels, they that perish are made equal with the Devil’s Angels." },
  { line = 6256, text = "Aug., City of God, xxi, 10: It is hence clear, that the same fire will be appropriated to the punishment of men and of daemons. If then it inflicts pain by corporeal touch, so as to produce bodily torment, how will there be in it any punishment for the evil spirits, unless the daemons have, as some have thought, bodies composed of gross and fluid air. But if any man asserts that the daemons have no bodies, we would not pugnaciously contend the point. For why may we not say, that truly, though wonderfully, even incorporeal spirit can feel pain of corporeal fire? If the spirits of men, though themselves incorporeal, can be now inclosed in bodily limbs, they can then be inseparably attached to the bonds of body. The daemons then will be united to a body of material fire, though themselves immaterial, drawing punishment from their body, not giving life to it. And that fire being material will torture such bodies as ours with their spirits; but the daemons are spirits without bodies." },
  { line = 6257, text = "Origen: Or it may be that fire is of such nature that it can burn invisible substances, being itself invisible, as the Apostle speaks, “The things which are seen are temporal, but the things which are not seen are eternal.” [2 Cor 4:18] Wonder not when you hear that there is afire which though unseen has power to torture, when you see that there is an internal fever which comes upon men, and pains them grievously." },
  { line = 6258, text = "It follows, “I was an hungred, and ye gave me no meat.” It is written to the believers, “Ye are the body of Christ.” [1 Cor 12:27] As then the soul dwelling in the body, though it hungers not in respect of its spiritual substance, yet hungers for the food of the body, because it is yoked to the body; so the Saviour suffers whatever His body the Church suffers, though He Himself be impassible." },
  { line = 6259, text = "And observe how in speaking to the righteous He reckons up their good deeds under their several kinds, but to the unrighteous He cuts short the description under the one head, “I was sick and in prison, and ye visited me not,” because it was the part of a merciful Judge to enlarge and dwell upon men’s good deeds, but to pass lightly and cursorily over their evil deeds." },
  { line = 6260, text = "Chrys.: Observe how they had failed in mercifulness, not in one or two respects only, but in all; not only did they not feed Him when He was hungry, but they did not even visit Him when He was sick, which was easier. And look how light things He enjoins; He said not, “I was in prison,” and ye did not set me free, but, and “ye visited me not.” Also His hunger required no costly dainties, but necessary food." },
  { line = 6261, text = "Each of these counts then is enough for their punishment. First, the slightness of His prayer, viz. for bread; secondly, the destitution of Him who sought it, for He was poor; thirdly, the natural feelings of compassion, for He was a man; fourthly, the expectation of His promise, for He promised a kingdom; fifthly, the greatness of Him who received, for it is God who receives in the poor man; sixthly, the preeminent honour, in that He condescended to take of men; and, seventhly, the righteousness of so bestowing it, for what He takes from us is our own. But avarice blinds men to all these considerations." },
  { line = 6262, text = "Greg.: They to whom this is said are the wicked believers, who are judged and perish; others, being unbelievers, are not judged and perish; for there is no examination of the condition of such as appear before the face of an impartial Judge already condemned by their unbelief; but those who hold the profession of the faith, but have not the works of their profession, are convicted that they may be condemned. These at least bear the words of their Judge, because they have at least kept the words of His faith. The others hear no words of their Judge pronouncing sentence of condemnation, because they have not paid Him honour even in word. For a prince who governs an earthly kingdom punishes after a different manner the rebellion of a subject and the hostile attempts of an enemy; in the former case, he recurs to his prerogative; against an enemy he takes arms, and does not ask what penalty the law attaches to his crime." },
  { line = 6263, text = "Chrys.: Thus convicted by the words of the Judge, they make answer submissively, “Lord, when saw we thee &c.”" },
  { line = 6264, text = "Origen: Mark how the righteous dwell upon each word, while the unrighteous answer summarily, and not going through the particular instances; for so it becomes the righteous out of humility to disclaim each individual generous action, when imputed to them publicly; whereas bad men excuse their sins, and endeavour to prove them few and venial." },
  { line = 6265, text = "And Christ’s answer conveys this. And to the righteous He says, “In that ye did it to my brethren,” to shew the greatness of their good deeds; to the sinners He says only, “to one of the least of these,” not aggravating their sin. For they are truly His brethren who are perfect; and a deed of mercy shewn to the more holy is more acceptable to God than one shewn to the less holy; and the sin of overlooking the less holy is less than of overlooking the more holy." },
  { line = 6266, text = "Aug., City of God, book xx, ch. 1: He is now treating of the last judgment, when Christ shall come from heaven to judge the quick and dead. This day of the Divine judgment we call the Last Day, that is, the end of time; for we cannot tell through how many days that judgment will be prolonged; but day, as is the use of holy Scripture, is put for time. And we therefore call it the last or latest judgment, because He both now judges and has judged from the beginning of the human race, when He thrust forth the first man from the tree of life, and spared not the Angels that sinned. But in that final judgment both men and Angels shall be judged together, when the Divine power shall bring each man’s good and evil deeds in review before his memory, and one intuitive glance shall present them to the perception, so that at once we shall be condemned or acquitted in our consciences." },
]
