text = "36. Then Jesus sent the multitude away, and went into the house: and his disciples came unto him, saying, “Declare unto us the parable of the tares of the field.” 37. He answered and said unto them, “He that soweth the good seed is the Son of man; 38. The field is the world; the good seed are the children of the kingdom; but the tares are the children of the wicked one; 39. The enemy that sowed them is the devil; the harvest is the end of the world; and the reapers are the angels. 40. As therefore the tares are gathered and burned in the fire; so shall it be in the end of this world. 41. The Son of man shall send forth his angels, and they shall gather out of his kingdom all things that offend, and them which do iniquity; 42. And shall cast them into a furnace of fire: there shall be wailing and gnashing of teeth. 43. Then shall the righteous shine forth as the sun in the kingdom of their Father. Who hath ears to hear, let him hear.” Chrys.: The Lord had spoken to the multitude in parables, that He might induce them to ask Him of their meaning; yet, though He had spoken so many things in parables, no man had yet asked Him aught, and therefore He sends them away; “Then Jesus sent the multitude away, and went into the house.” None of the Scribes followed Him here, from is which it is clear that they followed Him for no other purpose than that they might catch Him in His discourse. Jerome: The Lord sends away the multitude, and enters the house that His disciples might come to Him and ask Him privately of those things which the people neither deserved to hear, nor were able. Raban.: Figuratively; Having sent away the multitude of unquiet Jews, He enters the Church of the Gentiles, and there expounds to believers heavenly sacraments, whence it follows, “And his disciples came to him, saying, Explain to us the parable of the tares of the field.” Chrys.: Before, though desirous to learn, they had feared to ask; but now they ask freely and confidently because they had heard, “To you it is given to know the mystery of the kingdom of heaven;” and therefore they ask when alone, not envying the multitude to whom it was not so given. They pass over the parables of the leaven and the mustard-seed as plain; and ask concerning the parable of the tares, which has some agreement with the foregoing parable concerning the seed, and shews somewhat more than that. And accordingly the Lord expounds it to them, as it follows, “He answered and said unto them, He that sows the good seed is the Son of man.” Remig.: The Lord styles Himself the Son of Man, that in that title He might set an example of humility; or perhaps because it was to come to pass that certain heretics would deny Him to be really man; or that through belief in His Humanity we might ascend to knowledge of His Divinity. Chrys.: “The field is the world.” Seeing it is He that sows His own field, it is plain that this present world is His. It follows, “The good seed are the children of the kingdom.” Remig.: That is, the saints, and elect men, who are counted as sons. Aug., Cont. Faust., xviii, 7: The tares the Lord expounds to mean, not as Manichaeus interprets, certain spurious parts inserted among the true Scriptures, but all the children of the Evil one, that is, the imitators of the fraud of the Devil. As it follows, “The tares are the children of the evil one,” by whom He would have us understand all the wicked and impious. Aug., Quaest. Ev., i, 10: For all weeds among corn are called tares. Aug.: It follows, “The enemy who sowed this is the Devil.” Chrys.: For this is part of the wiles of the Devil, to be ever mixing up truth with error. “The harvest is the end of the world.” In another place He says, speaking of the Samaritans, “Lift up your eyes, and consider the fields that they are already white for the harvest;” [John 4:35] and again, “The harvest truly is great, but the labourers are few,” [Luke 10:2] in which words He speaks of the harvest as being already present. How then does He here speak of it as something yet to come? Because He has used the figure of the harvest in two significations;, as He says there that it is one that soweth, and another that reapeth; but here it is the same who both sows and reaps; indeed there He brings forward the Prophets, not to distinguish them from Himself, but from the Apostles, for Christ Himself by His Prophets sowed among the Jews and Samaritans. The figure of harvest is thus applied to two different things. Speaking of first conviction and turning to the faith, He calls that the harvest, as that in which the whole is accomplished; but when He enquires into the fruits ensuing upon the hearing the word of God, then He calls the end of the world the harvest, as here. Remig.: By the harvest is denoted the day of judgment, in which the good are to be separated from the evil; which will be done by the ministry of Angels, as it is said below, that the Son of Man shall come to judgment with His Angels. “As then the tares are gathered and burned in the fire, so shall it be in the end of this world. The Son of man shall send forth his Angels, and they shall gather out of his kingdom all offences, and them which do iniquity.” Aug., City of God, book xx, ch. 9: Out of that kingdom in which are no offences? The kingdom then is His kingdom which is here, namely, the Church. Aug., Quaest. Ev., i, 10: That the tares are first separated, signifies that by tribulation the wicked shall be separated from the righteous; and this is understood to be performed by good Angels, because the good can discharge duties of punishment with a good spirit, as a judge, or as the Law, but the wicked cannot fulfil offices of mercy. Chrys.: Or we may understand it of the kingdom of the heavenly Church; and then there will be held out here a two-fold punishment; first that they fall from glory as that is said, “And they shall gather out of his kingdom all offences,” to the end, that no offences should be seen in His kingdom; and then that they are burned. “And they shall cast them into a furnace of fire.” Jerome: The offences are to be referred to the tares. Gloss., non occ.: “The offences”, and, “them that do iniquity,” are to be distinguished as heretics and schismatics; the “offences” referring to heretics; while by “them that do iniquity” are to be understood schismatics. Otherwise; By “offences” may be understood those that give their neighbour an occasion of falling, by “those that do iniquity” all other sinners. Raban.: Observe, He says, “Those that do iniquity,” not, those who have done; because not they who have turned to penitence, but they only that abide in their sins are to be delivered to eternal torments. Chrys.: Behold the unspeakable love of God towards men! He is ready to shew mercy, slow to punish; when He sows, He sows Himself; when He punishes, He punishes by others, sending His Angels to that. It follows, “There shall be weeping and gnashing of teeth.” Remig.: In these words is shewn the reality of the resurrection of the body; and further, the twofold pains of hell, extreme heat, and extreme cold. And as the offences are referred to the tares, so the righteous are reckoned among the children of the kingdom; concerning whom it follows, “Then the righteous shall shine as the sun in the kingdom of their Father.” For in the present world the light of the saints shines before men, but after the consummation of all things, the righteous themselves shall shine as the sun in the kingdom of their Father. Chrys.: Not that they shall not shine with higher brightness, but because we know no degree of brightness that surpasses that of the sun, therefore He uses an example adapted to our understanding. Remig.: That He says, “Then shall they shine,” implies that they now shine for an example to others, but they shall then shine as the sun to the praise of God. “He that hath ears to hear, let him hear.” Raban.: That is, Let him understand who has understanding, because all these things are to be understood mystically, and not literally."
