text = "25. At that time Jesus answered and said, “I thank thee, O Father, Lord of heaven and earth, because thou hast hid these things from the wise and prudent, and hast revealed them unto babes. 26. Even so, Father: for so it seemed good in thy sight.” Gloss, non occ.: Because the Lord knew that many would doubt respecting the foregoing matter, namely, that the Jews would not receive Christ whom the Gentile world has so willingly received, He here makes answer to their thoughts; “And Jesus answered and said, I confess unto thee, Father, Lord of heaven and earth.” Gloss. ord.: That is, Who makest of heaven, or leavest in earthlinees, whom Thou wilt. Or literally, Aug., Serm., 67, 1: If Christ, from whom all sin is far, said, “I confess,” confession is not proper for the sinner only, but sometimes also for him that gives thanks. We may confess either by praising God, or by accusing ourselves. When He said, “I confess unto thee,” it is, I praise Thee, not I accuse Myself. Jerome: Let those hear who falsely argue, that the Saviour was not born but created, how He calls His Father “Lord of heaven and earth.” For if He be a creature, and the creature can call its Maker Father, it was surely foolish here to address Him as Lord of heaven and earth, and not of Him (Christ) likewise. He gives thanks that His coming has opened to the Apostles sacraments, which the Scribes and Pharisees knew not, who seemed to themselves wise, and understanding in their own eyes; “That thou hast hid these things from the wise and understanding, and hast revealed them unto babes.” Aug.: That the wise and understanding are to be taken as the proud, Himself opens to us when He says, “and hast revealed them unto babes;” for who are “babes” but the humble? Greg.: He says not ‘to the foolish,’ but to babes, shewing that He condemns pride, not understanding. Chrys.: Or when He says, “The wise,” He does not speak of true wisdom, but of that which the Scribes and Pharisees seemed to have by their speech. Wherefore He said not, ‘And hast revealed them to the foolish,’ but, “to babes,” that is, uneducated, or simple; teaching us in all things to keep ourselves from pride, and to seek humility. Hilary: The hidden things of heavenly words and their power are hid from the wise, and revealed to the babes; babes, that is, in malice, not in understanding; hid from the wise because of their presumption of their own wisdom, not because of their wisdom. Chrys.: That it is revealed to the one is matter of joy, that it is hid from the other not of joy, but of sorrow; He does not therefore joy on this account, but He joys that these have known what the wise have not known. Hilary: The justice of this the Lord confirms by the sentence of the Father’s will, that they who disdain to be made babes in God, should become fools in their own wisdom; and therefore He adds, “Even so, Father: for so it seemed good before thee.” Greg., Mor. xxv, 14: In which words we have a lesson of humility, that we should not rashly presume to discuss the counsels of heaven concerning the calling of some, and the rejection of others; shewing that that cannot be unrighteous which is willed by Him that is righteous. Jerome: In these words moreover He speaks to the Father with the desire of one petitioning, that His mercy begun in the Apostles might be completed in them. Chrys.: These things which the Lord spoke to His disciples, made them more zealous. As afterwards they thought great things of themselves, because they cast out demons, therefore He here reproves them; for what they had, was by revelation, not by their own efforts. The Scribes who esteemed themselves wise and understanding were excluded because of their pride, and therefore He says, Since on this account the mysteries of God were hid from them, fear ye, and abide as babes, for this it is that has made you partakers in the revelation. But as when Paul says, “God gave them over to a reprobate mind,” [Rom 1:28] he does not mean that God did this, but they who gave Him cause, so here, “Thou hast hid thee things from the wise and understanding.” And wherefore were they hid from them? Hear Paul speaking, “Seeking to set up their own righteousness, they were not subject to the righteousness of God.” [Rom 10:3]"
