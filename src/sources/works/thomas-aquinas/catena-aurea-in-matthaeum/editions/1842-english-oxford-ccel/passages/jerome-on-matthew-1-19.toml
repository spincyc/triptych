context = "Jerome's two comments on Matthew 1:19 in the Catena's block on that verse: how Joseph is called just (line 277), and Joseph's silence as a testimony to Mary (line 280); lines 278-279 between them are Chrysostom and Augustine and are not part of this passage."
physical_line_ranges = [[277, 277], [280, 280]]
text = "Jerome: But how is Joseph thus called, “just,” when he is ready to hide his wife’s sin? For the Law enacts, that not only the doers of evil, but they who are privy to any evil done, shall be held to be guilty. Jerome: Or this may be considered a testimony to Mary, that Joseph, confident in her purity, and wondering at what had happened, covered in silence that mystery which he could not explain."
