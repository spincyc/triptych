text = "32. Then Jesus called his disciples unto him, and said, “I have compassion on the multitude, because they continue with me now three days, and have nothing to eat: and I will not send them away fasting, lest they faint in the way. 33, And his disciples say unto him, “Whence should we have so much bread in the wilderness, as to fill so great a multitude?” 34. And Jesus saith unto them, “How many loaves have ye?” And they said, “Seven, and a few little fishes.” 35. And he commanded the multitude to sit down on the ground. 36. And he took the seven loaves and the fishes, and gave thanks, and brake them, and gave to his disciples, and the disciples to the multitude. 37. And they did all eat, and were filled: and they took up of the broken meat that was left seven baskets full. 38. And they that did eat were four thousand men, beside women and children. Jerome: Christ first took away the infirmities of the sick, and afterwards supplied food to them that had been healed. Also He calls His disciples to tell them what He is about to do; “Then Jesus called his disciples unto him, and said, I have compassion on the multitude.” This He does that He may give an example to masters of sharing their counsels with the young, and their disciples; or, that by this dialogue they might come to understand the greatness of the miracle. Chrys., Hom., iii: For the multitude when they came to be healed, had not dared to ask for food, but He that loveth man, and hath care of all creatures, gives it to them unasked; whence He says, “I have compassion upon the multitude.” That it should not be said that they had brought provision with them on their way, He says, “Because they continue with me now three days, and have nothing to eat.” For though when they came they had food, it was now consumed, and for this reason He did it not on the first or second day, but on the third, when all was consumed that they might have brought with them; and thus they having been first placed in need, might take the food that was now provided with keener appetite. That they had come from far, and that nothing was now left them, is shewn in what He says, “And I will not send them away fasting, lest they faint by the way.” Yet He does not immediately proceed to work the miracle, that He may rouse the disciples’ attention by this questioning, and that they may shew their faith by saying to Him, Create loaves. And though at the time of the former miracle Christ had done many things to the end that they should remember it, making them distribute the loaves, and divide the baskets among them, yet they were still imperfectly disposed, as appears from what follows; “And his disciples say unto him, Whence should we have so much bread in the wilderness as to fill so great a multitude?” This they spoke out of the infirmity of their thoughts, yet thereby making the ensuing miracle to be beyond suspicion; for that none might suspect that the loaves had been got from a neighbouring village, this miracle is wrought in the wilderness far distant from villages. Then to arouse His disciples’ thoughts, He puts a question to them, which may call the foregone miracle to their minds; “And Jesus saith unto them, How many loaves have ye? They said unto him, Seven, and a few little fishes.” But they do not add, ‘But what are they among so many?’ as they had said before; for they had advanced somewhat, though they did not yet comprehend the whole. Admire in the Apostles their love of truth, though themselves are the writers, they do not conceal their own great faults; and it is no light self-accusation to have so soon forgotten so great a miracle. Observe also their wisdom in another respect, how they had overcome their appetite, taking so little care of their meals, that though they had been three days in the desert, yet they had with them only seven loaves. Some other things also He does like to what had been done before. He makes them to sit down on the ground, and the bread to grow in the hands of the disciples; as it follows, “And he commanded the multitude to sit down on the ground.” Jerome, Sup. c. xiv, 15: As we have spoken of this above, it would be tedious to repeat what has been already said; we shall therefore only dwell on those particulars in which this differs from the former. Chrys.: The end of the two miracles is different; “And they took up of the broken meat that was left seven baskets full. Now they that had eaten were four thousand men, besides children and women.” Whence are the fragments fewer in this miracle than in the former, although they that ate were not so many? It is a either that the basket [margin note: sporta] in this miracle is of larger capacity than the basket [margin note: cophinus] in the former, or that by this point of difference they might remember the two separate miracles; for which reason also He then made the number of baskets equal to the number of the disciples, but now to the number of the loaves. Remig.: In this Gospel lection we must consider in Christ the work of His humanity, and of His divinity. In that He has compassion on the multitudes, He shews that He has feeling of human frailty; in the multiplication of the loaves, and the feeding the multitudes, is shewn the working of His divinity. So here is overthrown the error of Eutyches [margin note: vid. sup. p. 16], who said, that in Christ was one nature only. Aug., de Cons. Ev., ii, 50: Surely it will not be out of place to suggest upon this miracle, that if any of the Evangelists who had not given the miracle of the five loaves had related this of the seven loaves, he would have been supposed to have contradicted the rest. But because those who have related the one, have also related the other, no one is puzzled, but it is understood at once that they were two separate miracles. This we have said, that wherever any thing is found done by the Lord, wherein the accounts of any two Evangelists seem irreconcilable, we may understand them as two distinct occurrences, of which one is related by one Evangelist, and one by another. Gloss., ap. Anselm:. It should be noted, that the Lord first removes their sicknessess, and after that feeds them; because sin must be first wiped away, and then the soul fed with the words of God. Hilary: As that first multitude which He fed answers to the people among the Jews that believed; so this is compared to the people of the gentiles, the number of four thousand denoting an innumerable number of people out of the four quarters of the earth. Jerome: For these are not five, but four thousand; the number four being one always used in a good sense, and a four-sided stone is firm and rocks not, for which reason the Gospels also have been sacredly bestowed in this number. Also in the former miracle, because the people were neighbours unto the five senses [ed. note: That is, there were five thousand, and they were fed with five loaves], it is the disciples, and not the Lord, that calls to mind their condition; but here the Lord Himself says, that He has compassion upon them, “because they continue now three days” with Him, that is, they believed on the Father, Son, and Holy Spirit. Hilary: Or, they spend the whole time of the Lord’s passion with the Lord; either because when they should come to baptism, they would confess that they believed in His passion and resurrection; or, because through the whole time of the Lord’s passion they are joined to the Lord by fasting in a kind of union of suffering with Him. Raban.: Or, this is said because in all time there have only been three periods when grace was given; the first, before the Law; the second, under the Law; the third, under grace; the fourth, is in heaven, to which as we journey we are refreshed by the way. Remig.: Or, because correcting by penitence the sins that they have committed, in thought, word, and deed, they turn to the Lord. These multitudes the Lord would not send away fasting, that they should not faint by the way; because sinners turning in penitence, perish in their passage through the world, if they are sent away without the nourishment of sacred teaching. Gloss. ord.: The seven loaves are the Scripture of the New Testament, in which the grace of the Holy Spirit is revealed and given. And these are not as those former loaves, barley, because it is not with these, as in the Law, where the nutritious substance is wrapped in types, as in a very adhesive husk; here are not two fishes, as under the Law two only were anointed, the King, and the Priest, but a fewer, that is, the saints of the New Testament, who, snatched from the waves of the world, sustain this tossing sea, and by their example refresh us lest we faint by the way. Hilary: The multitudes sit down on the ground; for before they had not reposed on the works of the Law, but they had supported themselves on their own sins, as men standing on their feet. Gloss.: Or, they sit down there [margin note: xiv, 19] on the grass, that the desires of the flesh may be controlled, here on the ground, because the earth itself is commanded to be left. Or, the mountain in which the Lord refreshes them is the height of Christ; there, therefore, is grass upon the ground, because there the height of Christ is covered with carnal hopes and desires, on account of the carnal; here, where all carnal lust is banished, the guests are solidly placed on the basis of an abiding hope; there, are five thousand, who are the carnal subjected to the five senses; here, four thousand, on account of the four virtues, by which they are spiritually fortified, temperance, prudence, fortitude, and justice; of which the first is the knowledge of things to be sought and avoided; the second, the restraining of desire from those things that give pleasure in the world; the third, strength against the pains of life; the fourth, which is spread over all the love of God and our neighbour. Both there and here women and children are excepted, because in the Old and New Testament, none are admitted to the Lord who do not endure to the perfect man, whether through the infirmity of their strength, or the levity of their tempers. Both refreshings were performed upon a mountain, because the Scriptures of both Testaments commend the loftiness of the heavenly commands and rewards, and both preach the height of Christ. The higher mysteries which the multitudes cannot receive the Apostles discharge, and fill seven baskets, to wit, the hearts of the perfect which are enlightened to understand by the grace of the seven-fold spirit. [margin note: Isa 11:2] Baskets are usually woven of rushes, or palm leaves; these signify the saints, who fix the root of their hearts in the very fount of life, as a bulrush in the water, that they may not wither away, and retain in their hearts the palm of their eternal reward."
