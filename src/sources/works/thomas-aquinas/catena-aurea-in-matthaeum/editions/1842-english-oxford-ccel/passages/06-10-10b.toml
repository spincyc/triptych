text = "10. ——— “Thy will be done in earth as it is in Heaven.” Aug., Serm. in Mont., ii, 6: In that kingdom of blessedness the happy life will be made perfect in the Saints as it now is in the heavenly Angels; and therefore after the petition, “Thy kingdom come,” follows, “Thy will be done as in heaven, so in earth.” That is, as by the Angels who are in Heaven Thy will is done so as that they have fruition of Thee, no error clouding their knowledge, no pain marring their blessedness; so may it be done by Thy Saints who are on earth, and who, as to their bodies, are made of earth. So that, “Thy will be done,” is rightly understood as, ‘Thy commands be obeyed;’ “as in heaven, so in earth,” that is, as by Angels, so by men; not that they do what God would have them do, but they do because He would have them do it; that is, they do after His will. Chrys.: See how excellently this follows; having taught us to desire heavenly things by that which He said, “Thy kingdom come,” before we come to Heaven He bids us make this earth into Heaven, in that saying, “Thy will be done as in heaven, so in earth.” Jerome: Let them be put to shame by this text who falsely affirm that there are daily falls [margin note: ruinas] in Heaven. [ed. note: There were various opinions in the first ages about the indefectibility and perfection of good spirits, vid. Petav. de Angelis iii. 2, &c. Dissert. Bened. in Cyril. Hier. iii. 5. Huet. Origenian. ii. 5. n. 16. Nat. Alex. in prim. mund. aot. Diss. 7.] Aug.: Or; as by the righteous, so by sinners; as if He had said, As the righteous do Thy will, so also may sinners; either by turning to Thee, or in receiving every man his just reward, which shall be in the last judgment. Or, by the heaven and the earth we may understand the spirit and the flesh. As the Apostle says, “In my mind I obey the law of God,” [Rom 7:25] we see the will of God done in the spirit. But in that change which is promised to the righteous there, “Let thy will be done as in heaven, so in earth;” that is, as the spirit does not resist God, so let the body not resist the spirit. Or; “as in heaven, so in earth,” as in Christ Jesus Himself, so in His Church; as in the Man who did His Father’s will, so in the woman who is espoused of Him. And heaven and earth may be suitably understood as husband and wife, seeing it is of the heaven that the earth brings forth her fruits. Cyprian: We ask not that God may do His own will, but that we may be enabled to do what He wills should be done by us; and that it may be done in us we stand in need of that will, that is, of God’s aid and protection; for no man is strong by his own strength, but it safe in the indulgence and pity of God. Chrys.: For virtue is not of our own efforts, but of grace from above. Here again is enjoined on each one of us prayer for the whole world, inasmuch as we are not to say, Thy will be done in me, or in us; but throughout the earth, that error may cease, truth be planted, malice be banished, and virtue return, and thus the earth not differ from heaven. Aug., De Don. Pers., 3: From this passage is clearly shewn against the Pelagians that the beginning of faith is God’s gift, when Holy Church prays for unbelievers that they may begin to have faith. Moreover, seeing it is done already in the Saints, why do they yet pray that it may be done, but that they pray that they may persevere in that they have begun to be? Pseudo-Chrys.: These words, “As in heaven so in earth,” must be taken as common to all three preceding petitions. Observe also how carefully it is worded; He said not, Father, hallow Thy name in us, Let Thy kingdom come on us, Do Thy will in us. Nor again; Let us hallow Thy name, Let us enter into Thy kingdom, Let us do Thy will; that it should not seem to be either God’s doing only, or man’s doing only. But He used a middle form of speech, and the impersonal verb; for as man can do nothing good without God’s aid, so neither does God work good in man unless man wills it."
