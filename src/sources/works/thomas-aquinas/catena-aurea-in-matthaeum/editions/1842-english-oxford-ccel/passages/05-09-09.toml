text = "9. “Blessed are the peacemakers: for they shall be called the children of God.” Ambrose: When you have made your inward parts clean from every spot of sin, that dissentions and contentions may not proceed from your temper, begin peace within yourself, that so you may extend it to others. Aug., City of God, book 19, ch. 13: Peace is the fixedness of order; by order, I mean an arrangement of things like and unlike giving to each its own place. And as there is no man who would not willingly have joy, so is there no man who would not have peace; since even those who go to war desire nothing more than by war to come to a glorious peace. Jerome: The peacemakers [margin note: pacifici] are pronounced blessed, they namely who make peace first within their own hearts, then between brethren at variance. For what avails it to make peace between others, while in your own heart are wars of rebellious vices. Aug., Serm. in Mont., i, 2: The peacemakers within themselves are they who having stilled all disturbances of their spirits, having subjected them to reason, have overcome their carnal desires, and become the kingdom of God. There all things are so disposed, that that which is most chief and excellent in man, governs those parts which we have in common with the brutes, though they struggle against it; nay even that in man which is excellent is subjected to a yet greater, namely, the very Truth, the Son of God. For it would not be able to govern what is inferior to it, if it were not subject to what is above it. And this is the peace which is given on earth to men of good will. Aug., Retract., i, 19: No man can attain in this life that there be not in his members a law resisting the law of his mind. But the peacemakers attain thus far by overcoming the lusts of the flesh, that in time they come to a most perfect peace. Pseudo-Chrys.: The peacemakers with others are not only those who reconcile enemies, but those who unmindful of wrongs cultivate peace. That peace only is blessed which is lodged in the heart, and does not consist only in words. And they who love peace, they are the sons of peace. Hilary: The blessedness of the peacemakers is the reward of adoption, “they shall be called the sons of God.” For God is our common parent, and no other way can we pass into His family than by living in brotherly love together. Chrys.: Or, if the peacemakers are they who do not contend one with another, but reconcile those that are at strife, they are rightly called the sons of God, seeing this was the chief employment of the Only-begotten Son, to reconcile things separated, to give peace to things at war. Aug.: Or, because peace is then perfect when there is no where any opposition, the peacemakers are called the sons of God, because nothing resists God, and the children ought to bear the likeness of their Father. Gloss. ap. Anselm: The peacemakers have thus the place of highest honour, inasmuch as he who is called the king’s son, is the highest in the king’s house. This beatitude is placed the seventh in order, because in the sabbath shall be given the repose of true peace, the six ages being passed away."
