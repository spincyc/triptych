notes = "Historical preface, https://www.newmanreader.org/works/fathers/catena.html, credits Mark Pattison for the Matthew translation and introductory remarks, signed J. H. N. CCEL XML metadata incorrectly credits William Whiston in both deliveries; that catalog field is not adopted. The original Matthew translation appeared in 1841; 1842 here identifies the digital delivery's stated printing basis. This is a digital transcription with inherited defects, not a facsimile-collated diplomatic edition."
