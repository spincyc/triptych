context = "Corpus Thomisticum paragraph [87761], chapter 3 lectio 6 on Galatians 3:15-18, was inspected in full with the adjacent lectiones. Aquinas treats the divine promises as a firm testament: Abraham is the one for whom they are to be fulfilled and his Seed the one through whom they are fulfilled. He identifies the singular Seed as Christ, the only one through whom and in whom all can be blessed, and argues that the Law given later cannot void the promise or make the inheritance arise from Law rather than promise."
verified_on = "2026-08-21"
notes = "The Corpus Thomisticum controller uses paragraph [87761]. The registered claim is Aquinas's Christological and promissory reading of Galatians 3:15-18. It does not by itself establish the historical-linguistic range of the Hebrew collective noun in Genesis."
