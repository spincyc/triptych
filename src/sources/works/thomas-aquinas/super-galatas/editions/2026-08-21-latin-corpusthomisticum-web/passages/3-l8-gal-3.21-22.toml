context = "Corpus Thomisticum paragraph [87763], chapter 3 lectio 8, was inspected in full; the reusable passage bound here is its opening exposition of Galatians 3:21-22. Aquinas answers 'God forbid': the holy Law is not contrary to God's promises. It cannot confer the life of grace and eternal beatitude or justify in place of faith, but it serves the promised grace by making sin and human impotence known and thereby moving a person to seek Christ. He reads the promise as grace given through faith in Jesus Christ not only to Jews but to all believers."
verified_on = "2026-08-21"
notes = "Lectio 8 continues through Galatians 3:25. Its exposition of custody under the Law and the Law as pedagogue belongs to verses 23-25 and lies outside this registered Galatians 3:21-22 claim bound. The record therefore does not license presenting that later pedagogical exposition as wording on the narrower liturgical pericope."
