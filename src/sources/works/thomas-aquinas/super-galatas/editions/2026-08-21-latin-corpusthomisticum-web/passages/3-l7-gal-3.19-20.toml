context = "Corpus Thomisticum paragraph [87762], chapter 3 lectio 7 on Galatians 3:19-20, was inspected in full with lectiones 6 and 8. Aquinas orders the Old Law to four purposes: repressing malice, manifesting human weakness, taming concupiscence, and instructing ignorance by figures of future grace. He says it stood in an ordered place until Christ, the promised Seed. He permits either Moses and Aaron as God's messengers or angelic ministry in 'ordained by angels.' In 'the hand of a mediator' he names Christ Lord of the Law and the Law in Christ's power, while Moses, in whose hand it was given, signifies Christ. He then gives three expositions of the mediator: Christ is true God and man; he is not mediator of Jews alone but sufficient to reconcile all; and he mediates not one people only but Jews and Gentiles, the Son being mediator while God remains one."
verified_on = "2026-08-21"
notes = "The claim is bounded to Aquinas's own fourfold account and his several stated readings of Galatians 3:19-20. Aquinas expressly treats the increase of transgression after the written Law as sequential, not as the Law's causal production of sin. The passage neither denies Moses's historical ministry nor warrants collapsing other patristic readings of the mediator into Aquinas's synthesis."
