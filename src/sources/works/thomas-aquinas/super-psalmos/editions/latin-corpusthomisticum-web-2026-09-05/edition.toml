notes = "A dated web state distinct from the 2026-07-28 state already registered on this work, which holds the pages for Psalms 11-20, 21-30 and 41-50. The page for Psalms 31-40 is registered here; it carries the whole exposition of Psalm 39. The response labels the text as Reginald of Piperno's reportatio. No English edition of the Postilla super Psalmos is registered on this work; none was retrieved in this run, and the pairing gap is recorded rather than left silent."
