notes = "Nine supplied files cover the prologue and Psalms 1-54. Three exact responses (cps11, cps21, cps41) are already held under the 2026-07-28 web edition and are not duplicated; six remaining responses extend the holdings. Psalm 1 and Psalms 2-10 are separate responses, as are Psalm 51 and Psalms 52-54. This is the extent of Aquinas's offered commentary, not a 150-psalm work. Language pairing: Sought an English translation under Super Psalmos; In psalmos Davidis expositio; Thomas Aquinas; Reginald of Piperno in the canonical source-reader catalog and the recorded research receipts. No usable receipt for that counterpart was supplied. This registration stage may not retrieve additional sources; the absence is confined to the catalog and supplied receipts, not a claim that no public translation or original exists."
