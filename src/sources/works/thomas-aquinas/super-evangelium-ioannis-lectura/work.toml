description = "Aquinas's commentary on the Fourth Gospel, a reportatio of his lectures. Chapter 20, lecture 1 treats John 20:1-10: it endorses the argument that the disposition of the cloths excludes theft, expressly on Chrysostom's authority and with the added detail of the guards' presence, and it then reports both Augustine's and Chrysostom's readings of he saw and believed, giving Augustine's as the resolution and Chrysostom's as an alternative. A locus is chapter.lecture."
