context = "Fresh electronic inspection on 2026-10-23 of the complete lecture under anchor 87545. The lecture expounds John 18:33-40; the published Christ the King study uses its discussion of 18:33-37. It distinguishes Augustine’s people ruled from Chrysostom’s royal power, gives the latter a heavenly origin, joins not-from-hence with presence everywhere using Wisdom 8:1, Psalm 2:8 and Daniel 7:14, reports the temporal/eternal nativity alternatives at 18:37, and explains hearing truth as a gift of grace. The final discussion of truth and Barabbas reaches 18:38-40 and is context beyond the appointed 1962 Gospel."
