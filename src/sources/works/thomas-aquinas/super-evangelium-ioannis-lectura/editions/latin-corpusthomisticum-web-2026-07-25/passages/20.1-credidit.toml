context = "Aquinas's treatment of he saw and believed, read in the retrieved page within section 87552. Registered as the witness that the Latin tradition's chief systematizer gives Augustine's reading as the resolution and Chrysostom's as an alternative without deciding between them."
physical_line_ranges = [[1, 4]]
text = "Consequenter cum dicit et vidit, et credidit, ponitur effectus inquisitionis et in primo aspectu posset talem sensum habere, quod vidit illa scilicet et credidit quod Christus resurrexerit. Sed, secundum Augustinum, hoc non potest stare; quia sequitur nondum enim sciebant Scripturam et cetera. Ideo dicendum, quod vidit vacuum monumentum, et credidit his quae dixerat mulier, scilicet quod aliqui dominum asportassent. Vel, secundum Chrysostomum, vidit linteamina posita sic ordinata, quod non fuisset factum, si corpus furtim fuisset sublatum, et credidit, scilicet vera fide, quod Christus a morte resurrexerit. Et tunc hoc quod sequitur nondum enim sciebant Scripturam, refertur ad hoc quod dicit vidit, et credidit, quasi diceret: antequam videret non sciebat Scripturam, quia oportebat eum a mortuis resurgere. Sed quando vidit, credidit quod a mortuis resurrexisset."
