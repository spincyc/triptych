physical_line_ranges = [[1, 3]]
text = "Sed quare Evangelista sic diligenter omnia narrat? Ad quod dicendum, secundum Chrysostomum, ut excluderet falsam opinionem a Iudaeis divulgatam, quod corpus Christi furtim sublatum esset. Nam si hoc modo aliqui transtulissent illud: non utique eum denudassent, praecipue cum oportuisset eos festinanter hoc facere propter praesentiam custodum: neque etiam fuissent ita solliciti ut levarent sudarium, et involverent, et seorsum in unum locum ponerent, sed ea simpliciter ut contigisset, suscepto corpore, dimisissent. Huius etiam rei causa permisit quod sepultus fuit cum myrrha et aloe quae conglutinant corpori linteamina, ita quod non potuissent tam cito a corpore separari."
