notes = "The reference ut habetur Matth. ult., 13, which stands in the delivered text at the end of the first sentence, is omitted from the transcription. The clause praecipue cum oportuisset eos festinanter hoc facere propter praesentiam custodum is not in the Nicene and Post-Nicene Fathers text of Chrysostom's homily; the corresponding detail about the guards stands in Theophylact's comment on Luke 24:12."
