notes = "A dated delivery state of a public-domain-era translation on a copyrighted host, registered separately from the Prima Secundae pages already held under this work because the delivery state of one page proves nothing about another. Tertia Pars q. 59 is Aquinas's own text; it is the only place in the Summa proper where the judgment that takes place at death and the general judgment are compared. The translation is a working aid; the Latin governs wording-critical claims."
