notes = "A dated delivery state of a public-domain-era translation on a copyrighted host, registered on the pattern of the six sibling New Advent states already in this family and not merged with any of them. The translation is a historical working aid; the Latin witness governs wording and technical-term distinctions, and the Latin of these two questions was not retrieved by this run. The Latin of the work is registered here in the Leonine edition and in several dated Corpus Thomisticum states, so the work itself is not held in translation only; these two questions are."
