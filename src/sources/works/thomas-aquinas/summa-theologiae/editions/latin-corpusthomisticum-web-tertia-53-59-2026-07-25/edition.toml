notes = "A dated delivery state of an electronic transcription, registered separately from the Prima Secundae pages already held under this work. The site identifies the text as the Leonine edition; no collation against the printed Leonine volume was performed for this page, and the bracketed paragraph numbers are the site's own. The same site's index does not present the Supplementum as part of this corpus: it heads that section 'Fr. Rainaldus Romanus, Supplementum' and links to an external facsimile instead of a transcription."
