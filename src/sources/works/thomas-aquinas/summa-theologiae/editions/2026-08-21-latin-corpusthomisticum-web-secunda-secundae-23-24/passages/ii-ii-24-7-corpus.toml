context = "The complete article, Corpus Thomisticum paragraphs [39836]-[39843], was inspected in the exact response. Corpus [39840] denies a fixed upper limit to charity's increase in this life because charity participates in infinite charity, which is the Holy Spirit, God who increases it is of infinite power, and increased charity enlarges the subject's capacity for further growth."
verified_on = "2026-08-21"
notes = "The conclusion is that no upper terminus can be assigned to wayfarer charity in this life, not that a creature possesses actually infinite charity. Reply 3 also distinguishes the mode of wayfarer charity under faith from heavenly charity under open vision. No printed-Leonine collation is claimed."
