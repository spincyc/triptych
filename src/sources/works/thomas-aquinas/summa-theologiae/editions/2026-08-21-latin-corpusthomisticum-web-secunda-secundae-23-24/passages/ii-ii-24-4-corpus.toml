context = "The complete article, Corpus Thomisticum paragraphs [39812]-[39819], was inspected in the exact response. Corpus [39816] teaches that the charity of wayfarers can increase because progress toward God consists in the mind's drawing nearer to him through charity; reply 1 identifies this increase as greater intensity of love, and reply 2 distinguishes charity's supreme object from a wayfarer's still-imperfect intensity."
verified_on = "2026-08-21"
notes = "This article establishes charity's capacity for real increase in the wayfaring state. It does not decide whether every act of charity immediately effects such increase; Aquinas treats that question in II-II.24.6. No printed-Leonine collation is claimed."
