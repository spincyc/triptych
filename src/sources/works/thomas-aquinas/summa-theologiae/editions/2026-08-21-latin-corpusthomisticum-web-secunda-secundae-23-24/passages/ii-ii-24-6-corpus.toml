context = "The complete article, Corpus Thomisticum paragraphs [39828]-[39835], was inspected in the exact response. Corpus [39832] distinguishes disposition from actual increase: every act of charity disposes a person toward increase by making further charitable action readier, while actual increase occurs when growing readiness issues in a more fervent act directed toward progress in charity."
verified_on = "2026-08-21"
notes = "Reply 1 says every act of charity merits an increase, but not that the increase is immediately given. This article does not itself treat charity's first infusion; I-II.114.8 supplies the registered relation between increase, grace, charity, and merit. No printed-Leonine collation is claimed."
