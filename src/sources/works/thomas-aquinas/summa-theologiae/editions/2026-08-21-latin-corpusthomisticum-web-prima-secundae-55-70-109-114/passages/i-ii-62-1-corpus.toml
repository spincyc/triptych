context = "The complete article, Corpus Thomisticum paragraphs [36099]-[36106], was inspected in the exact response. Corpus [36103] teaches that natural principles do not suffice to order man to beatitude beyond human nature, so God superadds the theological virtues: they have God as object, are infused by God alone, and are made known by divine revelation."
verified_on = "2026-08-21"
notes = "This article establishes the supernatural origin, object, and end of the theological virtues. It does not establish their number, their functional relations, their precedence, or their increase. No printed-Leonine collation is claimed."
