context = "The complete article, Corpus Thomisticum paragraphs [36115]-[36122], was inspected in the exact response. Corpus [36119] places faith in the intellect with respect to supernatural credibilia apprehended in divine light, hope in the will's intending and tending toward the supernatural end as attainable, and charity in the spiritual union and conformity by which the will is transformed toward that end."
verified_on = "2026-08-21"
notes = "This article establishes the triad and these functional relations. It does not establish the twofold precedence of faith, hope, and charity, which Aquinas treats in I-II.62.4, or fully specify divine assistance as hope's formal ground. No printed-Leonine collation is claimed."
