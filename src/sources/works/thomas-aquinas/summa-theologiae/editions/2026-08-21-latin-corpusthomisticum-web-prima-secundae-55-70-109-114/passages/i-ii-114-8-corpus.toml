context = "The complete article, Corpus Thomisticum paragraphs [38711]-[38718], was inspected in the exact response. Corpus [38715] places the increase of grace and charity within grace's movement toward eternal life and concludes that this increase falls under condign merit; reply 3 says every meritorious act merits increase, but the increase is given in its proper time when the person is sufficiently disposed."
verified_on = "2026-08-21"
notes = "The article concerns merit proceeding from grace or charity already possessed. It neither makes first grace merited nor says that every meritorious act immediately increases grace. It does not address the distinct question of final perseverance, which follows in I-II.114.9. No printed-Leonine collation is claimed."
