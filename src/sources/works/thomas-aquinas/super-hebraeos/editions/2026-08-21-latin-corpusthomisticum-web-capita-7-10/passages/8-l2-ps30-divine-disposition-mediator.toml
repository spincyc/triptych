context = "The complete Corpus Thomisticum paragraph [87955], chapter 8 lectio 2, was inspected from its opening through its end in the exact response, with its boundaries at [87954] and [87956] confirmed. Explaining Christ's better ministry, the lectura reads 'sortitus est' as receiving by lot and cites Psalm 30:15, 'in manibus tuis sortes meae.' It says that what is received by lot is awaited from the Lord, that things given according to the distribution of divine judgment are said to be given by lot, and that Christ attained this ministry by divine disposition. It then calls every priest a mediator, defines mediation as reconciling the extremes, and says that Christ both brought divine things to us—through whom we were made partakers of the divine nature—and offers our things to God."
verified_on = "2026-08-21"
notes = "This verifies the wording and argument of the Corpus Thomisticum web witness at [87955]. The page identifies the textual state as the Reportatio vulgata and its print base only as a Turin 1953 text; no autograph claim, printed-volume collation, or independent judgment about the reportatio's textual history is made. The cited Psalm numbering and Latin wording are those used by this witness."
