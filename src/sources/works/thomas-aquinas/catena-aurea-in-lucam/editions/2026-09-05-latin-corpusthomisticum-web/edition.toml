notes = "A dated electronic witness, not a critical edition, and not the whole work: the host serves the Catena in Lucam in several pages and this edition holds the page carrying capita 4-8. Bracketed numbers such as [85817] are Corpus Thomisticum web paragraph identifiers, not the Marietti printed paragraph numbers. Language pairing: this is the work's original Latin; the Oxford Library of the Fathers English of 1841-1845 is public domain and was not retrieved in the sweep that produced this record."
