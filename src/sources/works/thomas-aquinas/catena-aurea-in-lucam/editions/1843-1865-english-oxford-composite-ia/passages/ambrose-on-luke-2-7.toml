text = "Ambrose; On thy account then am I weak, in thee am I strong. On thy account am I poor, in thee am I rich. Consider not what thou seest, but acknowledge that thou art redeemed. I owe more, O Lord Jesus, to Thy sufferings that I am redeemed, than to Thy works that I am created. It were no advantage to be born, had it not advantaged me to be redeemed also."
