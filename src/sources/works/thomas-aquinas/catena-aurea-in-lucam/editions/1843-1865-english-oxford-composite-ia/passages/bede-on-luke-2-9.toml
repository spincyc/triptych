text = "Bede; No where in the whole course of the Old Testament do we find that the Angels who so constantly appear to the Patriarchs, came in the day time. This privilege was rightly kept for this time when there arose in the darkness a light to them that were true of heart. Hence it follows, and the glory of God shone round about them. He is sent forth from the womb, but He shines from heaven. He lies in a common inn, but He lives in celestial light."
