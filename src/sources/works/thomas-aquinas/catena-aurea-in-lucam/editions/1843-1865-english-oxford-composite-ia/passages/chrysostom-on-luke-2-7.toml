physical_line_ranges = [[1, 4]]
text = "Chrys. Surely if He had so willed it, He might have come moving the heavens, making the earth to shake, and shooting forth His thunderbolts; but such was not the way of His going forth; His desire was not to destroy, but to save; and to trample upon human pride from its very birth, therefore He is not only man, but a poor man, and has chosen a poor mother, who had not even a cradle where she might lay her new born Child; as it follows, and she laid him in the manger."
