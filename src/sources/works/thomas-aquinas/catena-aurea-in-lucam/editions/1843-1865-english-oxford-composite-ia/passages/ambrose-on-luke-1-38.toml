context = "The whole of the Ambrose comment on Behold the handmaid of the Lord, from AMBROSE; after Augustine's comment to the conception of the wish, where GREEK EX. begins. No marginal attribution stands beside it; the margin note Geo-meter. belongs to the Greek Expositor that follows."
physical_line_ranges = [[1, 9]]
text = "Ambrose; Behold now the humility, the devotion of the virgin. For it follows, But Mary said, Behold the handmaid of the Lord. She calls herself His handmaid, who is chosen to be His mother, so far was she from being exalted by the sudden promise. At the same time also by calling herself handmaid, she claimed to herself in no other way the prerogative of such great grace than that she might do what was commanded her. For about to bring forth One meek and lowly, she was bound herself to shew forth lowliness. As it follows, Be it unto me according to thy word. You have her submission, you see her wish. Behold the handmaid of the Lord, signifies the readiness of duty. Be it unto me according to thy word, the conception of the wish."
