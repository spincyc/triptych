text = "Cyril; He finds man in his corrupt affections become like the beasts that perish, and therefore He is laid in the manger, in the place of food, that we changing the life of beasts, might be brought to the knowledge that befits man, partaking not of hay, but of the heavenly bread, the lifegiving body."
