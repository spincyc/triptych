physical_line_ranges = [[1, 2]]
text = "Bede; The infancy of the Saviour was impressed upon us, both by frequent heraldings of Angels and testimonies of Evangelists, that we might be the more deeply penetrated in our hearts by what has been done for us. And we may observe, that the sign given us of the new-born Saviour was, that He would be found not clothed in Tyrian purple, but wrapped in poor swaddling clothes, not laying on gilded couches, but in a manger."
