text = "Maximus; But if perhaps the swaddling clothes are mean in thy eyes, admire the Angels singing praises together. If thou despisest the manger, raise thy eyes a little, and behold the new star in heaven proclaiming to the world the Lord’s nativity. If thou believest the mean things, believe also the mighty. If thou disputest about those which betoken His lowliness, look with reverence on what is high and heavenly."
