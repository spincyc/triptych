text = "50. And He led them out as far as to Bethany, and He lifted up His hands, and blessed them. 51. And it came to pass, while He blessed them, He was parted from them, and carried up into heaven. 52. And they worshipped Him, and returned to Jerusalem with great joy: 53. And were continually in the temple, praising and blessing God. Amen. Bede. Having omitted all those things which may have taken place during forty-three days between our Lord and His disciples, St. Luke silently joins to the first day of the resurrection, the last day when He ascended into heaven, saying, And He led them out as far as to Bethany. First, indeed, because of the name of the place, which signifies \" the house of obedience.\" For He who descended because of the disobedience of the wicked, ascended because of the obedience of the converted. Next, because of the situation of the same village, which is said to be placed on the side of the mount of Olives; because He has placed the foundations, as it were, of the house of the obedient Church, of faith, hope, and love, in the side of that highest mountain, namely, Christ. But He blessed them to whom He had delivered the precepts of His teaching; hence it follows, And He lifted up His hands, and blessed them. Theophyl. Perhaps pouring into them a power of preservation, until the coming of the Spirit; and perhaps instructing them, that as often as we go away, we should commend to God by our blessing those who are placed under us. Origen. But that He blessed them with uplifted hands, signifies that it becomes him who blesses any one to be furnished with various works and labours in behalf of others. For in this way are the hands raised up on high. Chrys. But observe, that the Lord submits to our sight the promised rewards. He had promised the resurrection of the body; He rose from the dead, and conferred with His disciples for forty days. It is also promised that we shall be caught up in the clouds through the air; this also He made manifest by His works. For it follows, And it came to pass, while He blessed them, He was parted, &c. Theophyl. And Elias indeed was seen, as it were, to be taken up into heaven, but the Saviour, the forerunner of all, Himself ascended into heaven to appear in the Divine sight in His sacred body; and already is our nature honoured in Christ by a certain Angelic power. Chrys. But you will say, How does this concern me? Because thou also shalt be taken up in like manner into the clouds. For thy body is of like nature to His body, therefore shall thy body be so light, that it can pass through the air. For as is the head, so also is the body; as the beginning, so also the end. See then how thou art honoured by this beginning. Man was the lowest part of the rational creation, but the feet have been made the head, being lifted up aloft into the royal throne in their head. Bede. When the Lord ascended into heaven, the disciples adoring Him where His feet lately stood, immediately return to Jerusalem, where they were commanded to wait for the promise of the Father; for it follows, And they worshipped Him, and returned, &c. Great indeed was their joy, for they rejoice that their God and Lord after the triumph of His resurrection had also passed into the heavens. Greek Ex. And they were watching, praying, and fasting, because indeed they were not living in their own homes, but were abiding in the temple, expecting the grace from on high; among other things also learning from the very place piety and honesty. Hence it is said, And were continually in the temple. Theophyl. The Spirit had not yet come, and yet their conversation is spiritual. Before they were shut up; now they stand in the midst of the chief priests; distracted by no worldly object, but despising all things, they praise God continually; as it follows, Praising and blessing God. Bede. And observe that among the four beasts in heaven, Luke is said to be represented by the calf, for by the sacrifice of a calf, they were ordered to be initiated who were chosen to the priesthood; and Luke has undertaken to explain more fully than the rest the priesthood of Christ; and his Gospel, which he commenced with the ministry of the temple in the priesthood of Zacharias, he has finished with the devotion in the temple. And he has placed the Apostles there, about to be the ministers of a new priesthood, not in the blood of sacrifices, but in the praises of God and in blessing, that in the place of prayer and amidst the praises of their devotion, they might wait with prepared hearts for the promise of the Spirit. Theophyl. Whom imitating, may we ever dwell in a holy life, praising and blessing God; to Whom be glory and blessing and power, for ever and ever. Amen."
