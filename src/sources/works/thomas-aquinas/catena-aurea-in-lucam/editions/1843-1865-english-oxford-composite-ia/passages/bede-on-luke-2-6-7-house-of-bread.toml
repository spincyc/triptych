text = "Bede; But down to the very end of time, the Lord ceases not to be conceived at Nazareth, to be born at Bethlehem, whenever any of His hearers taking of the flour of the word makes himself a house of eternal bread. Daily in the Virgin’s womb, i. e. in the mind of believers, Christ is conceived by faith, born by baptism."
