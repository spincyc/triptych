text = "Greg. Bethlehem is by interpretation the house of bread. For it is the Lord Himself who says, I am the bread of life which came down from heaven. The place therefore where the Lord was born was before called the house of bread, because it was there that He was to appear in His fleshly nature who should refresh the souls of the elect with spiritual fulness."
