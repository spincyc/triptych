text = "Ambrose; The soul of Mary therefore magnifies the Lord, and her spirit rejoiced in God, because with soul and spirit devoted to the Father and the Son, she worships with a pious affection the one God from whom are all things. But let every one have the spirit of Mary, so that he may rejoice in the Lord. If according to the flesh there is one mother of Christ, yet, according to faith, Christ is the fruit of all. For every soul receives the word of God if only he be unspotted and free from sin, and preserves it with unsullied purity."
