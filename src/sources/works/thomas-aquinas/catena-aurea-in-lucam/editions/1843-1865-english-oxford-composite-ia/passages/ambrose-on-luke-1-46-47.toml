notes = "COLLATION WITH CSEL 32/4 pp. 55-56 (passage ambrose-expositio-lucae-2.26 of the CSEL edition, and the close of II.27 read on PDF page 109): the first sentence renders the close of II.27 (magnificat autem anima Mariae dominum, et exsultat spiritus eius in deo, eo quod et anima et spiritu patri filioque deuota unum deum, ex quo omnia, et unum dominum, per quem omnia, pio ueneretur adfectu), dropping et unum dominum, per quem omnia; the rest renders II.26 out of order, keeping only sit in singulis spiritus Mariae, ut exsultet in deo (let every one have the spirit of Mary), si secundum carnem ... fructus est Christus, and omnis enim anima accipit dei uerbum ... custodiat. DROPPED from II.26: quaecumque enim crediderit anima et concipit et generat dei uerbum et opera eius agnoscit, and sit in singulis Mariae anima, ut magnificet dominum. Receives renders accipit, not concipit. OCR AGAINST PAGE (ocr-1455eb5f lines 2477-2486): the wording agrees."
