notes = "The margin of page 38, beside filled with God, reads plena Deo. COLLATION WITH CSEL 32/4 p. 52 (passage ambrose-expositio-lucae-2.19 of the CSEL edition): the first comment renders II.19 from et ideo angelus to contenderet, omitting morale est omnibus ...; rejoicing in the fulfilment of her wish, and conscientious in the observance of her duty, she gladly went forth renders laeta pro uoto, religiosa pro officio, festina pro gaudio. The second comment joins nescit tarda molimina sancti spiritus gratia (the close of II.19) to a condensed discite, uirgines, non ... demorari in plateis, non ... in publico miscere sermones (II.21). OCR AGAINST PAGE (ocr-1455eb5f lines 2230-2246): buildup for build up; P-ena for the marginal plena; otherwise the wording agrees."
