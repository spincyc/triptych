context = "Two Ambrose comments on Mary's going into the hill country with haste (Luke 1:39): the first from AMBROSE; at the foot of page 37, after the lemma Luke 1:39-45, to with haste! on page 38; the second, after an interposed Origen comment (For Jesus who was in her womb hastened to sanctify John ... with haste.), from AMBROSE; to public talk, where THEOPHYL. begins. Origen's comment is not transcribed; the two Ambrose comments are not contiguous in print."
physical_line_ranges = [[1, 5]]
text = "Ambrose; The Angel, when he announced the hidden mysteries to the Virgin, that he might build up her faith by an example, related to her the conception of a barren woman. When Mary heard it, it was not that she disbelieved the oracle, or was uncertain about the messenger, or doubtful of the example, but rejoicing in the fulfilment of her wish, and conscientious in the observance of her duty, she gladly went forth into the hill country. For what could Mary now, filled with God, but ascend into the higher parts with haste! Ambrose; The grace of the Holy Spirit knows not of slow workings. Learn, ye virgins, not to loiter in the streets, nor mix in public talk."
