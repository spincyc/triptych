context = "The opening of the Bede comment under the lemma Luke 2:13-14, from BEDE; at the foot of page 71 to Glory to God on page 72; the comment continues As it follows, Praising God and saying ... to return praise to God, where CHRYS. begins. The quoted extent stops at a full stop within the comment."
physical_line_ranges = [[1, 3]]
text = "Bede; Lest the authority of a single Angel should appear small, as soon as one had revealed the sacrament of the new birth, straightway there was present a multitude of the heavenly host. Rightly has the attending Chorus of Angels received the name of heavenly host, seeing they both humbly bring their aid to that Leader mighty in battle, Who has appeared to put down the powers of the air, and also themselves by their celestial arms bravely vanquish those opposing powers lest they should prevail as they wish in tempting men. But because He is both God and man, rightly do they sing Peace to men and Glory to God."
