notes = "LOCUS CORRECTION: the R3 dossier assigns this comment to Hom. 20.3 alone. The margin, read at 300 dots per inch, reads Greg. 7, 20. in Ev., and the Latin bears it out: the first sentence (John cries in the desert ... deserted and forsaken Judaea) answers Hom. 7.2 (Qui etiam in deserto clamat, quia derelictae destitutaeque Judaeae solatium Redemptoris annuntiat; Wikisource artifact complete-extracted-text-dc25dd69 line 81), and the rest (For they who preach true faith and good works ...) answers Hom. 20.3 (Omnis qui fidem rectam et bona opera praedicat ...; same artifact line 235). The Catena joins the two without a mark. OCR AGAINST PAGE (ocr-1455eb5f lines 5706-5716): the margin reads 7  20. with the comma lost; Judaea for Judæa; otherwise the wording agrees."
