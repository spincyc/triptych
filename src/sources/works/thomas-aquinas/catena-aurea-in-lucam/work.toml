composed_basis = "The conventional dating of the Catena aurea's gospel volumes, the Luke volume among those made for Urban IV and after; recorded as scholarship gives it and not derived from the 1953 Turin printing that the delivery registered here transcribes."
description = "Aquinas's continuous chain of patristic comment on Luke, arranged by chapter and lectio, each excerpt introduced by the name of the father it is taken from. Chapter 14 lectio 1 covers Luke 14:1-6 and lectio 2 covers 14:7-11. A locus is chapter.lectio."
