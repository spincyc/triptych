description = "Aquinas's commentary on the four books of Peter Lombard's Sentences, delivered at Paris in the 1250s and the earliest of his large systematic works. It is addressed by book, distinction, question, article, and quaestiuncula, then by the article division. Book IV, distinctions 43-50 treat the resurrection, the general judgment, and the final states; the Supplementum printed after the unfinished Tertia Pars of the Summa theologiae is a later transcription from this book and is registered as a separate work, not as part of the Summa. Not every article of the Scriptum is divided into quaestiunculae -- book IV, distinction 46, question 1, article 3 is not -- so the quaestiuncula segment of the locus grammar is optional, and the article division may also be the article title."
