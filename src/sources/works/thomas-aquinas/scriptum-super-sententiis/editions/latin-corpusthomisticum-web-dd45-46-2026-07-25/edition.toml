notes = "A dated delivery state of the Corpus Thomisticum electronic text. It is a distinct page and a distinct retrieval from the distinction-group page covering book IV, distinctions 47-48, which is registered separately under this work. The delivery prints its own bracketed paragraph numbers alongside the traditional book-distinction-question-article reference; distinction 46 question 1 article 3 occupies paragraphs 21988-22004 and is not divided into quaestiunculae. The site states the printed editions underlying its texts on its own pages; this record does not assert which printing supplied these distinctions, and no printed edition was collated here."
