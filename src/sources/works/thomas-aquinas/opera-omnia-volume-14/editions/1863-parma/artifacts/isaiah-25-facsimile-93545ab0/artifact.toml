notes = "Two pages only: parent PDF pages 521 and 522, printed pp. 501-502. They carry Thomas Aquinas, Expositio super Isaiam ad litteram, caput XXV whole: the Vulgate lemma of 25:1-12; the exposition (the feast in monte hoc, quia ibi Christus passus est, vel quia ibi judicabit, with Matthew 22:4; death cast down, with 1 Corinthians 15:54, Hosea 13:14 and Apocalypse 21:4; the Moabites); and the notes on confession, on Amen and on the triple convivium (of the Church militant, of the soul, of the heavenly court); and the opening of caput XXVI. All other parent pages are omitted; the parent stays remote for its measured size."
