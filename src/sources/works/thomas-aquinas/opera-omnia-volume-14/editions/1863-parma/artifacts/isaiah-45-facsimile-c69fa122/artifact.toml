notes = "Two pages only: parent PDF pages 558 and 559, printed pp. 538-539. They carry Thomas Aquinas, Expositio super Isaiam ad litteram, caput XLV: the Vulgate lemma of 45:1-25 (from 538) and the exposition of 45:1-10 and following (539): Christo, idest regi, non propter unctionem, sed propter regiam dignitatem; the fruit of power required of Cyrus, the knowledge of God, and the liberation of the people; assimilavi, as other saints whose names the Lord foretold; non cognovisti me, permanens in idolis; the fruit in others, fulfilled when Cyrus wrote in praise of God or when all praised God seeing the Jews freed; the note on Israel electum meum; the potter and the clay. All other parent pages are omitted; the parent stays remote for its measured size."
