notes = "The title page at artifact PDF page 3 reads 'editio altera Veneta ad plurima exempla comparata, et emendata'; the Internet Archive catalogue, from the University of Turin copy digitized by Google, gives Bettinelli and 1745. This is the eighteenth-century vulgate text of the two lectures and carries marginal variant notes. No identity with the Marietti or the Leonine text is asserted; at John 10:14 it prints 'probationis' where modern texts print 'approbationis'. Printed page numbers are eighteen behind artifact PDF pages in the ranges read."
