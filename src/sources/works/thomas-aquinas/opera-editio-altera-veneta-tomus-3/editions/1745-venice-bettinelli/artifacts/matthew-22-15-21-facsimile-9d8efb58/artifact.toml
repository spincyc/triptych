notes = "Two pages only: parent PDF pages 301 and 302, printed pp. 283-284. They carry Aquinas, Super Matthaeum c. 22, the exposition of Matthew 22:15-21 after its opening on printed p. 282 (retained in the matthew-22 facsimile of this edition): why the disciples were sent with the Herodians, the flattery (homines mali ab adulatione incipiunt), Christ verax as joined to God, the question's two members (honour of God, favour of men), the census as a head-tax, the answer first to their mind and then to their words, the hypocrite as one who has one thing in the mouth and another in the heart, the denarius and its image, the question asked by dispensation, Reddite read literally (natural riches such as bread and wine to God, artificial such as denarii to Caesar) and mystically (the soul, made to God's image, rendered to God), and 22:22; then the exposition of 22:23-33. All other parent pages are omitted; the parent stays remote for its measured size."
