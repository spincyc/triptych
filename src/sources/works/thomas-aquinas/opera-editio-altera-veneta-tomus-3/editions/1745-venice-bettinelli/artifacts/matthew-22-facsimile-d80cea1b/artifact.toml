notes = "Five pages only: parent PDF pages 296-300, printed pp. 278-282. They carry the end of Super Matthaeum c. 21, the Vulgate text of Matthew 22 printed at the head of c. 22, and Aquinas's exposition of Matthew 22:1-14 (the wedding read four ways, the double invitation and the excuses, the king's armies as angelic spirits or the Romans under Titus and Vespasian, the call of the gentiles, the wedding garment as Christ put on by sacrament, charity, remembrance of death and conformity of works, and v. 14), into the exposition of 22:15. All other parent pages are omitted; the parent stays remote for its measured size."
