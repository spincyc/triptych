notes = "A dated web state of the Latin. The site divides the commentary by transmission state and labels each page: chapters 1 to 7 verse 10 from Thomas's own hand, chapters 11 to 13 verse 11 as the reportatio of Reginald of Piperno, chapters 11 to 16 as the reportatio vulgata, and chapters 7 to 10 as an insert from Peter of Tarentaise. Consumers must record which page and therefore which transmission state a quotation comes from. The site's own edition and presentation retain their stated rights; only checked wording at identified loci is used, and no bulk text is incorporated here."
