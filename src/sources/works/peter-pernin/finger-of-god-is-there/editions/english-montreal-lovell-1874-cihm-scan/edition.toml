notes = "Public domain (printed 1874; author died 1909). The Robinsonville Appendix is at printed pp. 94-102. The OCR is badly damaged in one sentence of the fire passage (p. 99), and the consuming publication marks its reading there as a reconstruction from the French plus surviving English fragments; elsewhere only plain within-word scanner misreads were corrected and no wording was supplied. Title page carries the approbation of the Bishop of Montreal and the Marinette fundraising statement. Exact scan bytes not retained."
