notes = "Public domain. The Appendice is at printed pp. 91-101. Collated clause by clause against the English printing of the same year by the consuming publication; the two agree substantively. Recorded divergences: 'seven miles and a-half' renders 'deux lieues et demi'; 'the tree sanctified by her apparent touch' renders 'l'arbre sur lequel s'est faite l'apparition'; 'about six acres' renders 'six arpents'. Used as a textual control and to restore one damaged English line. Exact scan bytes not retained."
