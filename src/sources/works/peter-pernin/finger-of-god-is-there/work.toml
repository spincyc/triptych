description = "Pernin's memoir of the Peshtigo firestorm of the night of 8 October 1871, which he survived in the Peshtigo River, published at Montreal in 1874 in French and English with the approbation of the Bishop of Montreal and for the benefit of the Church of Our Lady of Lourdes at Marinette, Wisconsin. An Appendix, separate from the memoir proper, narrates the reported apparitions to Adele Brise at Robinsonville and the preservation of the chapel enclosure on the same night. The Appendix is the second earliest published narrative of the Champion events located by the consuming publication, and its only early witness to the 1871 preservation. Pernin declares his own abridgement, declines to call the preservation a miracle, and records that ecclesiastical authority had not yet spoken."
