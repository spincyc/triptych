context = "The complete final stanza, read with the preceding Sea of Faith stanza in the identified first-edition transcription. Lines 29–34 move from a plea that two lovers remain true to an accumulating neither/nor catalogue in which the world lacks love and consolation. The form and context support describing a strong structural and verbal echo or inversion of Romans 8:38–39; they do not establish conscious authorial dependence, quotation, or Arnold's intended biblical source."
physical_line_ranges = [[273, 284]]
text = "Ah, love, let us be true To one another! for the world, which seems To lie before us like a land of dreams, So various, so beautiful, so new, Hath really neither joy, nor love, nor light, Nor certitude, nor peace, nor help for pain; And we are here as on a darkling plain Swept with confused alarms of struggle and flight, Where ignorant armies clash by night."
