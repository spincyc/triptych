notes = "PDF p. 1 is an e-rara cover. PDF pp. 2–5 show fols. 68r–69v, including the end of Mark X, all of XI, and the start of XII. The checked unit is the Mark 11:24–25 lemma and exposition at the foot of 69r and head of 69v (PDF pp. 4–5), through the comment on forgiving a brother, before the next lemma about returning to Jerusalem. The preceding fig-tree discussion was read for context. No full-work collation or digital transcription is asserted. Catalogue: https://www.e-rara.ch/zuz/content/titleinfo/7285107."
