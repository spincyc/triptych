description = "Theophylact's commentary on the Fourth Gospel, written in the late eleventh or early twelfth century and largely an epitome of Chrysostom. On John 20 it reproduces Chrysostom's argument that the disposition of the cloths tells against theft, and then reads he saw and believed with Augustine, as belief that the body had been stolen. A locus is the Gospel chapter commented on. Migne's Patrologia Graeca 124 prints the Greek with a facing Latin translation; the modern English translation is under copyright and is not registered here."
