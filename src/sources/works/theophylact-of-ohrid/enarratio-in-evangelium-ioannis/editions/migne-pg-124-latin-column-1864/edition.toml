notes = "Registered as the Latin column of Migne's bilingual printing, not as Theophylact's Greek. The commentary on John 20 stands at columns 289 to 292. This record is registered against the Internet Archive optical character recognition of the volume, which reproduces the Latin column far more reliably than the Greek; the Greek column was not collated for this record and no claim about its exact wording is made here."
