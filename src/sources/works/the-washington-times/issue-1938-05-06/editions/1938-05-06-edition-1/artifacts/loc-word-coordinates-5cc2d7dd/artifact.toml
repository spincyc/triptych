rights_basis = "Rights in this issue are not established and are not assumed. It was published in the United States in 1938, which is late enough that the term depends on facts about notice and renewal that neither the retrieving research lane nor this registration checked. What the lane did record is narrower and is recorded as what it is: that the Library of Congress digitised the title in the National Digital Newspaper Program, 'which selects titles it has cleared for open access', and that the Library asserts no rights restriction in its own record. A digitiser's selection policy and the absence of an asserted restriction are not a determination that the underlying issue is out of copyright, and this record does not treat them as one. `unresolved` keeps the guard that matters, since TRACKABLE_RIGHTS excludes it and nothing may install the payload. A reader with no network cannot presently reopen this page here, and closing that needs a rights check on this title rather than an assertion from this stage. The index is the Library's optical reading of this page and can carry no better right than the page it reads."
