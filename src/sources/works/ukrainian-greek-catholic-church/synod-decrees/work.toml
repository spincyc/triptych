description = "Entire official HTML fetched. Decree 4 and promulgation/effective-date clauses read in source Ukrainian; portal marks the record active at retrieval. Decree 4 identifies the Rome 1953 Order of Vespers, Matins and Divine Liturgy, together with Sacrosanctum Concilium and the 1996 Eastern instruction, as obligatory for the entire UGCC. This is a 2006 statement of obligation, not proof that the book first acquired force then or a new edition of the Liturgikon."
