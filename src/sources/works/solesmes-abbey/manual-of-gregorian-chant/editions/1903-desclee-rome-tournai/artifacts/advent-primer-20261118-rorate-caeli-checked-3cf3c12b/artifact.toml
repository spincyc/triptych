notes = "Printed pp. 313-315, PDF pp. 365-367: the section heading, the antiphon Rorate caeli and four verses, each followed by the response Rorate. THE HEADING THAT SHOWS ITS USE: every page carries the running head Benediction of the Most Blessed Sacrament, and the piece is no. 1 of PIECES TO BE SUNG IN THE VARIOUS SEASONS OF THE YEAR, under Advent: in this book it is a seasonal piece for Benediction, not a Mass or Office proper. The verses differ from Gueranger's 1870 English edition of the same chant (Liturgical Year: Advent pp. 155-156): there domus sanctificationis nostrae, here tuae; there quare comprehendit te dolor, here quia innovavit te dolor; and pointing throughout. No English is printed. R2 and the lane prompt cited pp. 312-315; the chant begins on p. 313. 9 LF-terminated lines."
