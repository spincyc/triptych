transformation = "Read on page images rendered at 130 dpi from the exact whole PDF, with the antiphon and verse 4 re-read at 300 dpi, on 2026-11-18. One sense unit per LF-terminated UTF-8 line, each prefixed by a braced printed-page locator; a verse running across a page break carries both pages. The chant underlay is joined into words: syllable hyphens and the extra spacing of the underlay are removed, the large initial R of the antiphon is read as the first letter of Rorate, printed acute accents are removed, and æ and œ are expanded (caeli, moerore). The printer's space before a colon is not reproduced. The piece number 1. printed in the margin before the antiphon's staff is not reproduced; the verse numbers 1.-4. are. The response sign is U+211F. Italic and roman are not distinguished (Repeat is italic). Musical notation is not transcribed."
