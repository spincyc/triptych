rights_basis = "Public domain in the United States by publication date. The title page of this copy (PDF p. 11, read on the image on 2026-11-18) reads A MANUAL OF GREGORIAN CHANT COMPILED FROM THE SOLESMES BOOKS AND FROM ANCIENT MANUSCRIPTS. SOCIETY OF SAINT JOHN THE EVANGELIST DESCLEE, LEFEBVRE & Co., Publishers to the Holy See & Printers to the S. Congr. of Rites. ROME. - TOURNAI (Belgium). 1903.; its verso (PDF p. 12) prints two Roman imprimaturs of 9 October 1903 and the reservation Jus proprietatis sibi reservant Editores. A work first published abroad in 1903 is out of United States copyright on the pre-1931 line guidance/missals.md section 5 records, written here as derived for calendar year 2026; the publishers' reservation of rights does not extend a United States term. Restoration under 17 U.S.C. 104A cannot keep it protected: a restored term runs no longer than ninety-five years from publication, and ninety-five years from 1903 ended with 1998. No life-based term is relied on. This focused transcription reproduces only the printed Latin chant text and English headings of that book; the notation is not reproduced and nothing is added."
