notes = "Identified from the page images of Internet Archive item manualofgregoria00dela (Harold B. Lee Library, Brigham Young University copy; scanner scribe4.provo, scanned 2011-11-02), read on 2026-11-18. Chant texts are Latin under square notation; headings and rubrics are English. Printed p. 313 = PDF p. 365 (PDF = printed + 52 at pp. 313-315). The Advent chant Rorate caeli with four verses stands at pp. 313-315, numbered 1 among PIECES TO BE SUNG IN THE VARIOUS SEASONS OF THE YEAR OR IN HONOUR OF SPECIAL MYSTERIES OR SAINTS, under the running head Benediction of the Most Blessed Sacrament."
