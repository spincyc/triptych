publication = "Rome and Tournai (Belgium): Society of Saint John the Evangelist, Desclee, Lefebvre & Co., Publishers to the Holy See & Printers to the S. Congr. of Rites, 1903. Title page read at PDF p. 11 of Internet Archive item manualofgregoria00dela; verso (PDF p. 12): Imprimatur. Romae, die 9 Octobris 1903. Fr. Albertus Lepidi O. P., S. P. Ap. Magister. / Imprimatur. Romae, die 9 Octobris 1903. Jos. Ceppetelli Patriarch. Constantinop. Vicesg. / Jus proprietatis sibi reservant Editores. An earlier title leaf (PDF p. 9) carries the number No 581."
