description = "A one-volume chant book for English-speaking users, with English rubrics and headings, compiled from the Solesmes chant editions and published by the Society of Saint John the Evangelist (Desclee, Lefebvre & Co.): chants of the Mass and Office for the year, with a section of Benediction chants and pieces for the seasons. It is a practical anthology, not an official liturgical book. The Internet Archive catalogue names Paul Delatte and the Abbaye Saint-Pierre de Solesmes as creators; the title page names neither, and the attribution is the catalogue's. A locus is printed page and piece."
