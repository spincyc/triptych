rights_basis = "Migne's nineteenth-century Paris printing is in the public domain in the United States: the repository's own rights reading, recorded at guidance/missals.md section 5 against Cornell's public-domain chart current at 1 January 2026, is that a work first published abroad before 1931 is in the public domain with no term running. The Internet Archive's optical character recognition of a public-domain printing is a mechanical transcription that adds no original authorship and is served without a copyright claim asserted over it, so nothing in the rights forbids retention. The bytes are not retained on the demonstrated-size ground guidance/sources.md allows: 8.70 MB, against 5.88 MB, which is the largest payload this library retains today across 10,461 files. THE COST OF THAT IS REAL AND IS STATED HERE RATHER THAN GLOSSED. What a reader with no network loses is the ability to replay this run's whole-volume searches of this volume, including its bounded negatives; what that reader keeps is the page images of the quoted columns, which are retained beside this record and carry the words themselves. The optical layer is in any case unusable as a text of record here, because its recognition of the polytonic Greek column is corrupt and the retrieving lane forbade quotation from it."
