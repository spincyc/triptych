description = "The catena fragments on the Psalms printed under Origen's name in Migne's Patrologia Graeca 12. This run reads them on the Introit psalm, where they quote Psalm 83:2-3a and 83:10-11a together as one argument, cutting at exactly the words the antiphon ends on and glossing 'faciem Christi tui' as naming Christ explicitly; and on the Offertory psalm at Psalm 33:8. The attribution is the printing's and is recorded as an attribution: a catena fragment carries its lemma's name and not necessarily its author's."
