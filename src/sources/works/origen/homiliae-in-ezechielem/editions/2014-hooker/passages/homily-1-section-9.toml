text = "9. “And the word of the Lord came to Ezekiel132 the priest, the son of Buzi”133—that is, the word of the Lord that was with134 the Father in the begin- ning—God the Word135—the word that makes those who believe into gods. For “if [the Psalmist] called ‘gods’ those to whom the word of God came, and the Scripture cannot be annulled,”136 and therefore all people to whom the word of God has come have become137 gods—then Ezekiel also was a god,138 since the word of God came to him. “I said, ‘You are gods, and you are all children of the Most High’; but you will die like human beings, and like one of the rulers139 you will fall.”140 Where can you find in the New Testament a promise of this kind? If it were right to distinguish between the Testaments,141 and thus to speak of gods disagreeing with each other—of course, it is abominable142 even to con- template this, but I am speaking by way of rhetorically pressing the matter143— then I tell you, I would say audaciously that much greater beneficence is dis- played in the Old Testament than in the New. “I said, ‘You are gods, and you are all children of the Most High.’” He does not say, “Some of you are gods, and some are not,” but rather, “You are all gods.” If you sin, however, listen to what follows: “But you will die like human beings.” This result is not the fault of the one who calls us to salvation: the one who summons us to divinity and to the adoption of heavenly nature is not himself the cause of death. Rather, the state- ment, “But you will die like human beings, and like one of the rulers you will fall,” rests on our wickedness and our sin. There were many rulers, and one of them fell, with reference to whom it is also written in Genesis, “Behold! Adam has become”144—not like us, but—“like one of us.”145 Therefore, when Adam fell, he became like the one who fell."
