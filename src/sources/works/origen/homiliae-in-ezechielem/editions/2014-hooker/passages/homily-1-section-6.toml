text = "6. “By the river Chebar.”106 That is, by that most weighty stream of the world. “And the heavens were opened.”107 The heavens had been closed, and were opened at the arrival of Christ, so that once they had been thrown open, the Holy Spirit would come in the form of a dove over him.108 For [the Spirit] was not able to make his way to us either, without having first come down to the one who shared his nature. Jesus “‘went up on high; he led captivity cap- tive; he received gifts among mankind.’ He who descended is the very one who ascended above all the heavens in order to fill everything. And he himself gave some to be apostles, others prophets, others evangelists, others pastors and teachers, for the perfection of the saints.”109"
