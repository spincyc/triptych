text = "8. “On the fifth of the month—this was the fifth year of the captivity of King Jehoiachin.”129 In the thirtieth year of Ezekiel’s life and the fifth of the captivity of Jehoiachin, the prophet is sent to the Jews. The most forbearing Father did not disdain, did not leave the people without warnings or remind- ers130 for a long time. It is the fifth year. How much time has elapsed? Five years have flowed past while they have been slaving away in captivity—and im- mediately the Holy Spirit came down and opened the heavens, so that those who were being crushed under the yoke of captivity might see those things which were seen by the prophet. For when he said, “And the heavens were opened,”131 in a certain way they themselves too contemplated with the eyes of the heart what he had also looked upon with the eyes of the flesh."
