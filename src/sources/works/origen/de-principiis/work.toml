description = "Origen's early third-century systematic treatise in four books, addressed by book, chapter, and numbered section. Its textual transmission is exceptional and every consumer must state which witness it relies on: the work survives complete only in the Latin translation Rufinus made in 397-398, and Rufinus states in his own preface that he removed or corrected passages he judged to have been interpolated by heretics. A body of Greek fragments survives independently, chiefly in the Philocalia of Basil and Gregory Nazianzen and in the hostile excerpts assembled by Jerome and by the emperor Justinian. Where Rufinus and the Greek witnesses can be compared they sometimes differ on exactly the doctrinal points for which Origen was later censured, so an argument about what Origen held is an argument about a reconstructed text."
