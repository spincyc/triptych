notes = "Direct reading from 200-dpi rendered PNG images of Tuki 1736 PDF pp. 389-409 (Part II pp. 96-116). UTF-8 NFC, LTR, LF line endings. All Coptic-column letters—including Greek liturgical acclamations set in Tuki's single Bohairic Coptic typeface—are encoded strictly in Unicode Coptic (U+2C80-U+2CFF) and the seven Demotic-derived Coptic letters in Greek-and-Coptic (U+03E2-U+03EF: Ϣ/ϣ, Ϥ/ϥ, Ϧ/ϧ, Ϩ/ϩ, Ϫ/ϫ, Ϭ/ϭ, Ϯ/ϯ), with zero non-Coptic Greek-block letters (U+0370-U+03E1). Bohairic jinkim/syllabic grave marks are encoded as combining grave accent (U+0300); nomina sacra/abbreviation bars (Ⲡϭ̅ⲥ̅, Ⲓⲏ̅ⲥ̅, Ⲡⲭ̅ⲥ̅, Ⲡⲛ̅ⲁ̅, ⲉⲑ̅ⲩ̅, Ⲕⲉ̅, Ⲑ̅ⲥ̅, ⲁ̀ⲗ̅) as combining overline (U+0305); printed red 8-pointed cross-rosettes marking signs of the cross as ✠ (U+2720). Tuki's line-end double-slash word-wrap hyphens ('//') are joined across lines; page-foot catchwords, running heads, Coptic page numerals and Arabic column/rubrics are excluded. Printed punctuation normalized as ':' (colon), '·' (U+00B7, Tuki's raised s-shaped/single stop), and '.' (full stop). Tuki's printed readings are preserved verbatim without silent emendation (including ⲫⲓⲙ and ⲉ̀ⲧⲟ̀ϩⲓⲉ̀ⲣⲁⲧⲟⲩ p. 391, ⲡⲉⲛⲉⲩⲙⲁⲧⲓ p. 392, ⲛ̀ⲑⲉⲕ, ⲉⲑⲛⲉⲥⲟⲥ, ϯⲑⲉⲟ̀ⲧⲩⲕⲟⲥ, ⲡⲓⲁ̀ⲙⲟϩⲓ, and ⲙ̀ⲙⲁⲓⲣⲡⲙⲓ p. 394, ⲩⲫⲱⲣϣ, ⲁⲩⲧⲩⲛ, and ⲧⲩⲛ p. 395, ⲟⲩⲙⲟⲛⲉ̀ⲃⲟⲗ p. 397, letterpress ⲉ̀ⲃⲟⲗϧⲛ p. 402 excluding later purple superscript ⲉ, Ⲁϥϫⲉⲙϯⲡⲓ p. 403, Ⲡⲭ̅ⲥ̅ in Epiclesis p. 407, and Ⲡⲣⲩⲥⲭⲱⲙⲉⲛ p. 407)."
