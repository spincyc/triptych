notes = "Complete Arabic Creed in Tuki’s 1736 Coptic-Arabic Catholic printing, 139 whitespace-separated words after the declared normalization. The parallel Coptic text, surrounding rubrics and the remainder of the service are outside this component. This text records the printed procession clause from the Father and the Son; it does not reconstruct Tuki’s manuscript exemplar or establish the first historical insertion. The whole offered Bonn sequence is retained, but the 676-image sequence does not reconcile with Bonn’s catalogue extent of 288, 479 pages. No whole physical volume or whole text completeness is claimed."
