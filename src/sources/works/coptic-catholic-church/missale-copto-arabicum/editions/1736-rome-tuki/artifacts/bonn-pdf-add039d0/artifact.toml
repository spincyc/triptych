transformation = "Read the 676 exact JPEG resources from the parent ZIP in sequence.json order and embed each complete byte stream unchanged in a PDF DCTDecode image object. One image fills each PDF page; page dimensions in points equal pixel dimensions. No cropping, reordering, resampling, color conversion, OCR or text alteration. The exact images and manifest remain in the parent ZIP. This is a lossless facsimile derivative, not a Bonn-issued PDF."
