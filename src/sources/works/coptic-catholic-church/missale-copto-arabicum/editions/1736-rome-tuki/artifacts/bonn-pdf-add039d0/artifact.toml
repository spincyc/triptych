notes = "All 676 canvases and exact default 1000-pixel-wide JPEG deliveries in the complete Bonn IIIF manifest are retained in provider order. No missing or failed canvas IDs. The provider sequence includes covers, blanks, two separately paginated parts, errata and the colophon. This establishes completeness of the offered digital sequence, not physical completeness of the historical volume or a complete transcription. Direct image inspections include title and incense openings, part II pp. 3, 86–87, 110–111, 212 and 317, and colophon. Blue reader annotations at part II pp. 110–111 are not evidence of the original printed wording. No OCR is included. Bonn’s catalogue extent is 288, 479 pages; this is not reconciled with the 676-image sequence. Part I printed p. 288 is artifact 293, errata begin at 667 and the colophon is 672. No correction of the library’s extent or certification of the physical copy is inferred."
