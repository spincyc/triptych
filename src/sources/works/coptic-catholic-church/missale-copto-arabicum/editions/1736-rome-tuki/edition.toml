notes = "Raphael Tuki edition identified by ULB Bonn. Original Coptic-Arabic colophon at artifact page 672 gives completion on 3 Baunah, corresponding to 13 June 1736 (year 1452 of the Martyrs). Parts I and II are complementary sections of one printing, not chronological revisions. All 676 canvases and exact default 1000-pixel-wide JPEG deliveries in the complete Bonn IIIF manifest are retained in provider order. No missing or failed canvas IDs. The provider sequence includes covers, blanks, two separately paginated parts, errata and the colophon. This establishes completeness of the offered digital sequence, not physical completeness of the historical volume or a complete transcription. Bonn’s catalogue extent is 288, 479 pages; this is not reconciled with the 676-image sequence. Part I printed p. 288 is artifact 293, errata begin at 667 and the colophon is 672. No correction of the library’s extent or certification of the physical copy is inferred."
