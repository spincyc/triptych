notes = "The Catholic Public Domain Version as its translator publishes it at sacredbible.org, which is the text source the CrossWire SWORD module CPDV itself names. It is registered from the site rather than from that module deliberately: the module is a zText binary whose verse boundaries are read from a SWORD versification table this library does not hold, so decoding it would mean inferring the numbering, while each page of the site prints the chapter and verse number in front of every verse and needs no inference at all. This is a dated web state and not a printing; the record pins the exact bytes of each of the 73 book pages as they stood on 31 July 2026, and it asserts nothing about their continuing availability. What makes this edition worth holding is that it is a modern-English translation carrying the Vulgate's own chapter and verse numbers throughout, which the World English Bible Catholic Edition, the King James Version and the Revised Version registered here do not: sixty-four of its 73 books agree with the Clementine Vulgate registered here exactly, and eight of the remaining nine differ by a single verse division, in 2 Kings 13, Isaias 45, Amos 9, John 11, 2 Corinthians 1, 1 Thessalonians 4, 2 Thessalonians 2 and Ecclesiasticus 29, with the Canticle of Canticles carrying eleven more. Its psalter is the Gallican one the Vulgate prints, its psalm numbers are the Septuagint and Vulgate ones the 1962 Missal cites, and a psalm's inscription is numbered as verse 1. Three limits must not be lost in reuse. First, it is a one-man translation without imprimatur or ecclesiastical approbation, and it is registered as a further English witness to the Vulgate's wording and versification and not as an authority; no claim may rest on it alone. Second, its Esther is not addressable by Vulgate numbers at all. The translator prints Esther in the Septuagint arrangement, with the Greek additions standing where the Greek puts them instead of gathered into an appendix after chapter 10, and in fifteen chapters against the Vulgate's sixteen; its 1:1 is the Vulgate's 11:2, its 3:1 is the Vulgate's 1:1, and its 13:9 is part of the king's letter where the Vulgate's 13:9 is Mardochai's prayer. Every locus of that book is withheld in the verse-alias table, so the 1962 Missal's Esther 13:9-11 and 14:12-13 refuse here rather than resolving to the wrong words. Third, the translator interleaves his own explanatory notes in the running text, in square brackets signed with his name; they are commentary and not scripture, and the derivation drops them."
