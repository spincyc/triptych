rights_basis = "The translator dedicated this version to the public domain and forbade anyone to take a right in it. His own statement, distributed with the CrossWire SWORD module and repeated on the site: “Since the Latin editions of the Bible used in this translation are in the public domain, as the sole translator and editor of the Catholic Public Domain Version of the Sacred Bible, I hereby place the Catholic Public Domain Version of the Sacred Bible in the public domain in perpetuity. As a text in the public domain, the Catholic Public Domain Version of the Sacred Bible has no copyright, trademark, or other legal restrictions. The only restriction is that there can be no restriction. No one may copyright this version of the Bible.” Each page of sacredbible.org carries a copyright meta element saying “Entire text, including all html and css code, is in the public domain. No copyright.” The Latin the version renders, the Sixto-Clementine Vulgate, is out of copyright everywhere by age. This derivative contains only the scripture text with a mechanical reference column, and none of the translator's own bracketed commentary, page navigation, or headings."
rights_jurisdiction = "United States"
