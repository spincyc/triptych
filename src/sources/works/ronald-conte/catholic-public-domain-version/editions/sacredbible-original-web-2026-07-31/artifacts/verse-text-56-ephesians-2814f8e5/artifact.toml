notes = "Ephesians (Eph): 6 chapters and 155 verses, one LF-terminated line per verse after a header line. Chapter and verse numbers are the Vulgate ones the 1962 Missal cites, taken from the page's own {chapter:verse} markers, and the psalm inscription is numbered as verse 1. This is a translation of the Sixto-Clementine Latin, not of the Hebrew or the Greek."
