transformation = "Read sacredbible.org's per-book page for this book, which prints one verse to a line as “{chapter:verse} text” between the page's begin and end comments, and take the chapter and verse numbers from those markers rather than from any versification table. Decode the page as windows-1252, which is the character set it declares. Strip HTML tags, unescape entities, and drop the translator's own bracketed explanatory notes, which he signs (Conte) inside square brackets in the running text and which are commentary and not scripture. Anything outside a {chapter:verse} marker is chapter heading or page navigation and is dropped with it. Collapse runs of whitespace to one space and strip the ends. Emit \"book<TAB>chapter<TAB>verse<TAB>text<TAB>usfm\" with a header line, LF terminated, the usfm column carrying the page's own file stem. Book tokens, ordinals, file names and names are those of the Douay-Rheims Challoner book index, because this version carries the same 73 books of the Catholic canon in the same Vulgate order and must be addressed by the same tokens; the mapping is by the book named on each page and not by file order, and every book's chapter and verse counts were checked against both the Douay-Rheims and the Clementine Vulgate registered in this library before the mapping was accepted. Sixty-four of the 73 books agree with the Clementine exactly; the nine that do not are recorded in the book index."
