provenance = "Compiled by Triptych on 2026-07-31 from sacredbible.org's per-book pages of the Catholic Public Domain Version, Original Edition. Each page was matched to its row by the book it names and its chapter and verse counts read from the extracted text, then checked against both the Douay-Rheims Challoner text and the Clementine Vulgate registered in this library. The token, ordinal, file name, Douay title, modern name, Missal abbreviation and alternate names are those of the Douay-Rheims Challoner book index, because this version carries the same 73 books of the Catholic canon in the same Vulgate order and must be addressed by the same tokens. Sixty-four books agree with the Clementine exactly. Nine do not, and every one is recorded in the note column; eight differ by a single verse division, and the ninth is Esther, which this version prints in the Septuagint arrangement and which no Vulgate citation can reach."
