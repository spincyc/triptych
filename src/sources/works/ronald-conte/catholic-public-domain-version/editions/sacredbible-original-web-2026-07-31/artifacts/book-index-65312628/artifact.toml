notes = "73 books: 46 Old Testament and 27 New Testament, the Catholic canon fixed at Trent, in the Vulgate order, with 1333 chapters and 35827 verses — one fewer chapter than the Douay-Rheims, Esther having fifteen here against its sixteen. Tokens are shared with the Douay-Rheims and the Clementine Vulgate so a citation resolves to the same book in any of them. Every chapter count agrees with both of those editions except Esther, which has fifteen chapters here against their sixteen and is not addressable by Vulgate numbers at all; see its note and the verse-alias table."
