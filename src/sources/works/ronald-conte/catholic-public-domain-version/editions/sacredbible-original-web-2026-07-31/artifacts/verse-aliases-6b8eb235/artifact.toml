notes = "Every row is a withholding covering the whole of Esther, whose fifteen chapters this version arranges as the Septuagint does and not as the Vulgate does, with one further row for Psalm 115:10, which this version renumbers. An empty resolves_to means a citation naming that locus cannot be answered from this edition, whatever it prints at those numbers. No verse of this edition is merged away, so no row of the other kind is needed."
