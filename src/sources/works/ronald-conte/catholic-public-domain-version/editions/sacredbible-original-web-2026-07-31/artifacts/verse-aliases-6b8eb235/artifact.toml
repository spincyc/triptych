notes = "Five hundred and four rows withhold the whole of Esther, whose fifteen chapters this version arranges as the Septuagint does and not as the Vulgate does, and thirty-one derived rows rule on the six psalms this version numbers differently from the concordance's witness. An empty resolves_to means a citation naming that locus cannot be answered from this edition, whatever it prints at those numbers. The psalm rows are derived rather than typed: `tools/tests/test_psalter.py` and `index-bible check` both fail if they and the derivation disagree."
