context = "The Second Journey heading gives Passover, A.U.C. 779 - about Pentecost, 780, includes John 2-5 among its references, and explicitly locates the prayer at Cana for the dying son at Capharnaum after Jesus returns to Galilee. The date belongs to the encompassing journey; no narrower absolute date is assigned to this healing. The article separately equates A.U.C. 782 with A.D. 29. Applying that source-internal calibration places the encompassing journey in A.D. 26-27, a project derivation rather than an A.D. interval printed beside the incident."
verified_on = "2026-10-05"
notes = "The registered retained normalized text was read at these exact physical lines and its SHA-256 checked. The live New Advent article was also reopened on the verification date. The normalized witness has a damaged phrase at the prayer's subject; John 4:46-53 independently controls the identification as the ruler's son. This record does not amend the existing Third and Fifth Journeys passage or its evidence fingerprint."
