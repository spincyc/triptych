context = "Maas heads the Third Journey 'About Pentecost, A.U.C. 780- Autumn, 780', cites Luke 7-8 among its controlling chapters, and immediately places within it the missionary tour through Galilee on which Jesus 'resuscitates the son of the widow at Naim'. He heads the Fifth Journey 'Spring, A.U.C. 781', cites John 6, and places within it the crossing of the Sea of Galilee, the feeding of the five thousand, and the next day's Bread of Life discourse at Capharnaum. Printed p. 378 expressly equates A.U.C. 782 with A.D. 29. Thus, within Maas's own stated reckoning, subtracting 753 from an A.U.C. year yields its A.D. equivalent: A.U.C. 780 corresponds to A.D. 27 and A.U.C. 781 to A.D. 28."
artifact_page_ranges = [[430, 430], [432, 432]]
verified_on = "2026-09-04"
notes = "The chronology key, both journey headings, their cited Gospel chapters, Naim episode, and Bread of Life discourse were read directly in the printed page images. The A.D. equivalents are not printed beside the Third and Fifth Journey headings; they are reproducible project derivations from Maas's express A.U.C. 782 = A.D. 29 equation and remain identified as derived wherever used."
