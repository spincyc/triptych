context = "The Ninth journey heading runs from February to Passover in A.U.C. 782 and cites Matthew 19-26 among its chapters. In the Holy Week paragraph Maas narrates the Tuesday: the disciples' wonder at the withered fig tree and the instruction on faith, the questions in the Temple, the parables, the woes, the widow's mites, and then: 'Jesus ended this day by uttering the prophecies concerning the destruction of Jerusalem, His second coming, and the future judgement; these predictions are interrupted by the parable of the ten virgins and the talents.' Wednesday follows. The passage places the discourse of Matthew 24-25 at the close of the same Tuesday as the fig-tree instruction. It names no place for the discourse; Matthew 24:3 supplies Mount Olivet. The prophesied events are the discourse's subject, not dates Maas assigns to it."
verified_on = "2026-11-16"
notes = "Read in the complete tracked normalized article (hash recomputed and matched), lines 131-134, by the research stage (iteration 1) of proper-study run 11c5af05fe374203. The sentence was also compared with printed p. 381, right column, in Internet Archive's page image of the same scanned volume (item catholicencyclop0008unse_u7y2, leaf n432, PDF p. 433), which reads 'the future judgment; these predictions are interrupted by the parable of the ten virgins, and of the talents'; the normalized text differs only in spelling and that phrase. The page image was not hash-matched to the registered facsimile PDF; maas-journeys-six-seven-nine separately records the facsimile-verified Ninth Journey heading and the A.U.C. 782 = A.D. 29 calibration. This record identifies the episode and its day within Maas's harmony; it supplies no calendar date by itself."
