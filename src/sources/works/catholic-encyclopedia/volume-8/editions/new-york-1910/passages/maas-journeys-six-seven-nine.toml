notes = "Dates, place sequence, and qualifications such as 'probably' were checked against the printed page images. This passage records Maas's 1910 chronology in his own signed article. It is not a chronology supplied by Internet Archive, New Advent, or Triptych, and it does not silently promote Maas's proposed sequence into an exact date asserted by the Gospel text itself."
