context = "Maas places the Sixth Journey from about May through September A.U.C. 781 (A.D. 28): Genesar; the borders of Tyre and Sidon; north, east, and southeast through northern Decapolis, probably along the foot of Lebanon; eastern Galilee; the vicinity of Dalmanutha and Magedan; Bethsaida Julias; Caesarea Philippi; probably Mount Thabor; and Capharnaum. He locates Mark 7's Syrophoenician exorcism within the borders of Tyre and Sidon and the deaf-mute's healing in Decapolis. He places the Seventh Journey from September through December A.U.C. 781 (A.D. 28): from Galilee east of the Jordan after Samaritan refusal, through Peraea; he locates Luke 10's return of the seventy-two probably in lower Peraea and the Good Samaritan discourse in the vicinity of Jericho, followed by the home of Mary and Martha and Bethania-to-Jerusalem. He places the Ninth Journey from February A.U.C. 782 through Passover 782 (A.D. 29): from Ephrem north through Samaria, east along Galilee's border into Peraea, south through Peraea, west across the Jordan, then Jericho, Bethania on Mount Olivet, Bethphage, and Jerusalem; Luke 17's ten lepers are in the most northern part of that journey. Printed p. 378 expressly equates A.U.C. 782 with A.D. 29, so the A.D. equivalents here report Maas's own chronological system rather than a later editor's reconstruction."
