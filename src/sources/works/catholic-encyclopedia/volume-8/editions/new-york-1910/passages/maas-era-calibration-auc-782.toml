notes = "Both equations and their context were checked against printed p. 378 (Internet Archive leaf n429, https://archive.org/download/catholicencyclop0008unse_u7y2/page/n429/mode/1up). The range identifies the complete one-paragraph subsection in the exact normalized article. The print and the normalized text differ in spacing and small wording such as 'again' in the first equation."
