context = "Within subsection (3), Maas explicitly equates A.D. 29 and A.U.C. 782 twice, first in the reckoning from the destruction of Jerusalem and then in the reckoning from preaching to the Gentiles. This paragraph supplies his era equivalence. The Ninth Journey heading and Tuesday episodes have their own loci."
