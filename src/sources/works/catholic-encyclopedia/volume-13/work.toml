description = "The thirteenth volume (1912) of the sixteen-volume Catholic Encyclopedia (New York: Robert Appleton Company, 1907-1912). Signed articles are cited by article title; the volume's container identity remains distinct from each contributor's article. Herbert Thurston's articles 'The Rosary' (with Andrew Shipman for the Eastern section) and 'Feast of the Holy Rosary' belong to this volume."
