context = "Under the heading 'Origin according to the commonly accepted view', Vander Heeren says that Alexandrian Jews undertook a Greek translation of the Pentateuch and states: 'This happened about the middle of the third century B.C.' He distinguishes this Pentateuch date from the gradual translation of the other Hebrew books and says only that the Law, Prophets, and at least part of the hagiographies existed in Greek before 130 B.C."
