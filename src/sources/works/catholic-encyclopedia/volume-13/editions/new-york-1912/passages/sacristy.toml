context = "Meehan defines the sacristy by its storage, assembly, and vesting functions. His furnishing paragraph names a crucifix or other suitable image in a prominent position for the departure and return bow, a lavatory for handwashing, and, as customary, a holy-water font and a bell at the door leading to the sanctuary to admonish the congregation of the clergy's advent. This controls a dated specialist description and local/usual recognition only; it does not establish a universal 1962 furnishing code, a bell mechanism or operator, or a prescribed lavatory form."
verified_on = "2026-07-28"
notes = "Verified in the exact New Advent HTML artifact. New Advent identifies Andrew Meehan, not J. F. G. Gilmartin, as the article's author."
