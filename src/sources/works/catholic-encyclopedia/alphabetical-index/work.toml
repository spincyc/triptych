languages = ["en"]
description = "The alphabetical index to the original Catholic Encyclopedia (New York: Robert Appleton Company, 1907-1912), as New Advent delivers it: one page per initial letter, listing every article the encyclopedia carries under that letter. Registered as a work of its own because the index belongs to no numbered volume, and because a chronology gap row's evidence can be the ABSENCE of an entry from it."
