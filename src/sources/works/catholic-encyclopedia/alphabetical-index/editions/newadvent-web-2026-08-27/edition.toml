notes = "A current New Advent delivery of the index, not a facsimile of a printed volume. This edition holds two kinds of page and they bear different weight: the abridged per-letter page, which prints above its first entry that it lists \"only a tiny fraction\" of the site's articles, and the unabridged <letter>-ce page it links to as the \"full index\", which prints no such limitation but no attestation of completeness either. An absence recorded against either is bounded by that page and correctable; neither settles on its own whether the encyclopedia carries an article on a given subject."
