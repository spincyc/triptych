notes = "New Advent's UNABRIDGED index of Catholic Encyclopedia articles beginning with 'N', titled on the page itself \"CATHOLIC ENCYCLOPEDIA: Index for N\": 287 links to encyclopedia articles, 282 of them distinct, against the 110 of the abridged page at &lt;https://www.newadvent.org/cathen/n.htm&gt;. WHAT IT CAN BEAR: it carries no exhaustiveness disclaimer, and no positive attestation of completeness either. The only warrant for calling it complete is the abridged page's own link text, \"full index for N\", in a sentence that describes it as \"a more complete list\". An absence recorded against it is therefore bounded and correctable: it says that New Advent's fullest published list for this letter carries no such entry, not that the encyclopedia carries no such article anywhere. Retained because a chronology gap row rests on what this page does NOT list. Remote bytes are not retained."
