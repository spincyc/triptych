notes = "The Catholic Encyclopedia's ABRIDGED New Advent index of articles beginning with 'N': 110 links to encyclopedia articles, against the 287 of the unabridged page at &lt;https://www.newadvent.org/cathen/n-ce.htm&gt;. Above its first entry the page prints: \"This list represents only a tiny fraction of articles available on the New Advent website. For a more complete list, please see the full index for N or use the search box at the top of this page.\" Retained as the control that records that limitation and names where the fuller list is - not as evidence that the encyclopedia carries no article on a subject, which this page disclaims of itself. The record that bears that negative for this letter is index-n-ce-5fd9c5e7. The exact page is not retained here: its navigation, styling, advertising markup, support solicitation and \"About this page\" apparatus are New Advent's and carry no republication permission. The encyclopedia article itself is retained and may be reopened offline, extracted from these exact bytes, at artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-n-ef3ba0eb-article-text."
