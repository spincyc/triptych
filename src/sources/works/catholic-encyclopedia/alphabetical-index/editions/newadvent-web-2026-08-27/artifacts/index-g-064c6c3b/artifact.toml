rights_basis = "This page is not a Catholic Encyclopedia article and no public-domain basis is claimed for it. It is New Advent's own compilation: a list of links to encyclopedia articles, each followed by a one-line description, and on the abridged letter pages a paragraph of New Advent's own site prose. The article TITLES it lists are the encyclopedia's; the selection, the arrangement and the descriptive glosses are New Advent's work, and at least some of the glosses are demonstrably not the articles' own opening words. These exact bytes are therefore not redistributed from this repository and no text derivative of them is retained. What this record holds is the source URL, the retrieval date, the SHA-256 and the byte size, against which a reader with a network can reauthenticate the page; what it can bear as evidence is written out in the passage record for this page. Settled in src/sources/inventories/catholic-encyclopedia-rights-v1.toml, section [the_index_pages], which also states why the encyclopedia's own articles are public domain and these pages are not."
