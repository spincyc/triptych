notes = "The Catholic Encyclopedia's ABRIDGED New Advent index of articles beginning with 'G': 155 links to encyclopedia articles, against the 540 of the unabridged page at &lt;https://www.newadvent.org/cathen/g-ce.htm&gt;. Above its first entry the page prints: \"This list represents only a tiny fraction of articles available on the New Advent website. For a more complete list, please see the full index for G or use the search box at the top of this page.\" Retained as the control that records that limitation and names where the fuller list is - not as evidence that the encyclopedia carries no article on a subject, which this page disclaims of itself. The record that bears that negative for this letter is index-g-ce-5c91a95b. The exact page is not retained here, and neither is any text extracted from it. The page is New Advent's own compilation of links and descriptive glosses, not a Catholic Encyclopedia article, so it holds no public-domain article text to extract: a normalized-text derivative registered against it on 2026-09-02 under the encyclopedia's public-domain basis was de-registered the same day for exactly that reason, and its bytes were removed. What this record can bear is set out in passage.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-g, and it is re-checkable by refetching <https://www.newadvent.org/cathen/g.htm> and verifying the sha256 and byte_size above."
