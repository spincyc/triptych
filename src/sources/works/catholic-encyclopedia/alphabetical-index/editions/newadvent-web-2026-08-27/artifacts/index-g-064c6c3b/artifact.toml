notes = "The Catholic Encyclopedia's ABRIDGED New Advent index of articles beginning with 'G': 155 links to encyclopedia articles, against the 540 of the unabridged page at &lt;https://www.newadvent.org/cathen/g-ce.htm&gt;. Above its first entry the page prints: \"This list represents only a tiny fraction of articles available on the New Advent website. For a more complete list, please see the full index for G or use the search box at the top of this page.\" Retained as the control that records that limitation and names where the fuller list is - not as evidence that the encyclopedia carries no article on a subject, which this page disclaims of itself. The record that bears that negative for this letter is index-g-ce-5c91a95b. Remote bytes are not retained."
