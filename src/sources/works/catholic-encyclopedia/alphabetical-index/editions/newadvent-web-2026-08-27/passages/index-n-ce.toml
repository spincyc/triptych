context = "The page carries 287 links to encyclopedia articles, 282 of them distinct, and prints no limitation sentence of any kind; the paragraph that carries one on the abridged page is absent here. The run where an article on the book of Numbers would fall reads, in order, \"Nubia\" (11147a), \"Nueva Caceres\" (11148a), \"Nueva Pamplona\" (11149a), \"Nueva Segovia\" (11149b), \"Nugent, Francis\" (11150a), \"Nugent, James\" (11150b), \"Numbers, Use of, in the Church\" (11151a), \"Numismatics\" (11152a), \"Nun of Kent\" (02319b). The word \"Numbers\" occurs once in the whole page, as that one entry, which is Thurston's article on the ritual use of numbers and whose own title on its page is \"Use of Numbers in the Church\"; there is no entry for the book, and no occurrence of \"Numbers, Book of\". Corroborating the run: 11151b.htm, the unassigned article number, returns HTTP 404, and 11150a and 11152a resolve to \"Francis Nugent\" and \"Numismatics\"."
verified_on = "2026-08-27"
notes = "An index control over New Advent's fullest published list for this letter. It is not attested complete by the page itself: the only warrant is the abridged page's link text, \"full index for N\", in a sentence offering it as \"a more complete list\". The absence it records is therefore bounded and correctable - New Advent's fullest list carries no such entry - and is not proof that no article elsewhere in the encyclopedia discusses the book. The Numbers gap row rests on \"Pentateuch\" for the substantive silence."
