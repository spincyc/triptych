context = "The page carries 540 links to encyclopedia articles, 537 of them distinct, and prints no limitation sentence of any kind; the paragraph that carries one on the abridged page is absent here. The run where an article on the book of Genesis would fall reads, in order, \"Genealogy (in the Bible)\" (06408a), \"Genealogy of Christ\" (06410a), \"General Judgment\" (08552a), \"General Chapter\" (06412b), \"Generation\" (06412c), \"Genesareth\" (06413a), \"Genesius\" (06413c), \"Genevieve, Saint\" (06413f), \"Genezareth, Land of\" (06415a). There is no entry for the book, and the string \"Genesis\" does not occur anywhere in the page. New Advent's index files an article under its keyword inverted - 11151a, whose own title is \"Use of Numbers in the Church\", is indexed as \"Numbers, Use of, in the Church\" - so an entry for the book would read \"Genesis\" or \"Genesis, Book of\"; neither string occurs. Corroborating the run: 06413b.htm, the one unassigned article number between \"Genesareth\" (06413a) and \"Genesius\" (06413c), returns HTTP 404."
verified_on = "2026-08-27"
notes = "An index control over New Advent's fullest published list for this letter. It is not attested complete by the page itself: the only warrant is the abridged page's link text, \"full index for G\", in a sentence offering it as \"a more complete list\". The absence it records is therefore bounded and correctable - New Advent's fullest list carries no such entry - and is not proof that no article elsewhere in the encyclopedia discusses the book. The Genesis gap row rests on \"Pentateuch\" for the substantive silence."
