context = "Above its first entry the page prints, verbatim: \"This list represents only a tiny fraction of articles available on the New Advent website. For a more complete list, please see the full index for G or use the search box at the top of this page.\" It stands in its own paragraph immediately after the letter heading G, and immediately before the first entry, \"Gabbatha\" (06328b). The whole page carries 155 links to encyclopedia articles, 153 of them distinct. The run where an article on the book of Genesis would fall reads, in order, \"Genealogy (in the Bible)\" (06408a), \"Genealogy of Christ\" (06410a), \"General Judgment\" (08552a), \"Generation\" (06412c), \"Genesius\" (06413c), \"Genevieve, Saint\" (06413f); the string \"Genesis\" does not occur anywhere in the page. The abridgement is demonstrable from the page itself: \"General Chapter\" (06412b) and \"Genesareth\" (06413a) are real articles of the encyclopedia and neither number occurs here."
verified_on = "2026-08-27"
notes = "An index control, and by the page's own words a partial one. It records what New Advent's ABRIDGED letter page lists under G on this date, and it cannot bear an absence claim about the encyclopedia: the page disclaims exactly that. The unabridged index it sends a reader to is registered separately as index-g-ce-5c91a95b, and that record, not this one, is what a Genesis gap row rests on for the index evidence. Neither is proof that no article elsewhere in the encyclopedia discusses the book; the Genesis gap row rests on \"Pentateuch\" for the substantive silence."
