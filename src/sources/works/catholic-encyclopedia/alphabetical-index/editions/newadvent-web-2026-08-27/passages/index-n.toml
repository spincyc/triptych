context = "Above its first entry the page prints, verbatim: \"This list represents only a tiny fraction of articles available on the New Advent website. For a more complete list, please see the full index for N or use the search box at the top of this page.\" It stands in its own paragraph immediately after the letter heading N, and immediately before the first entry, \"Nagasaki\" (10667c). The whole page carries 110 links to encyclopedia articles, 108 of them distinct. The run where an article on the book of Numbers would fall reads, in order, \"Nubia\" (11147a), \"Numbers, Use of, in the Church\" (11151a), \"Numismatics\" (11152a), \"Nun of Kent\" (02319b); there is no entry for the book. The abridgement is demonstrable from the page itself: \"Nugent, Francis\" (11150a) is a real article of the encyclopedia and its number does not occur here."
verified_on = "2026-08-27"
notes = "An index control, and by the page's own words a partial one. It records what New Advent's ABRIDGED letter page lists under N on this date, and it cannot bear an absence claim about the encyclopedia: the page disclaims exactly that. The unabridged index it sends a reader to is registered separately as index-n-ce-5fd9c5e7, and that record, not this one, is what a Numbers gap row rests on for the index evidence. Neither is proof that no article elsewhere in the encyclopedia discusses the book; the Numbers gap row rests on \"Pentateuch\" for the substantive silence."
