notes = "Catalog-level record created 2026-07-25. The 1908 American printing is public domain. Registered exact artifacts now include the complete remote Internet Archive facsimile and a restricted dated New Advent transcription of the Credence article. The facsimile controls the verified segment for John Corbett's signed article 'David, King' and its bounded chronology passage; the New Advent artifact remains a later-revision web transcription rather than a facsimile of this printing."
