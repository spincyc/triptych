context = "Corbett reports as the 'usual chronology' that David was born in 1085 B.C. and reigned from 1055 to 1015 B.C.; he immediately distinguishes this conventional scheme from recent writers who, influenced by Assyrian inscriptions, dated the reign thirty to fifty years later. This passage supports attribution of the 1055-1015 B.C. reign span to Corbett's named conventional chronology, not its presentation as an exact date supplied by the biblical text or as the encyclopedia's account of modern critical consensus."
