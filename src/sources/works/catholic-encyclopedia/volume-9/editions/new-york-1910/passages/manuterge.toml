context = "Braun distinguishes the sacristy towel from the manuterge used at the Mass Lavabo, places the latter with the finger-bowl and cruets on the credence, and reports historical customary forms. The consumer uses the terminology and distinction only. The article's customary dimensions, lace, embroidery, circular sacristy-towel form, pontifical statements, and historical claims are not generalized as a 1962 norm."
