notes = "MacRory, Joseph. \"Gospel of Saint Mark.\" The Catholic Encyclopedia. Vol. 9. New York: Robert Appleton Company, 1910. &lt;https://www.newadvent.org/cathen/09674b.htm&gt;. Article text only, extracted from the exact hashed New Advent delivery named in derived_from. A dated reference work of 1907-1912, not a magisterial or current one. POST-IMPRINT CONTENT, RECORDED 2026-09-02: this article text carries the Biblical Commission's decisions of 1913, which is after the edition year this record hangs under. The delivery is therefore a later state of the article than the first printing of that volume, and the \"edition-identified\" requirement of authority ranks 3 and 6 in src/sources/chronology/profiles.yaml is not met for it. No chronology claim in this repository rests on the 1913 material, and the rights conclusion is unaffected: the volume is public domain by date of publication and a 1913 decision printed in it is a United States government-of-the-Church document reproduced in the same public-domain volume."
