notes = "Durand, Alfred. \"The New Testament.\" The Catholic Encyclopedia. Vol. 14. New York: Robert Appleton Company, 1912. A SECOND DELIVERY OF A PAGE THIS EDITION ALREADY REGISTERS: 76,687 bytes against the 77,046 registered on 2026-08-26 at artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c, whose SHA-256 a fresh delivery no longer reproduces. THE ARTICLE IS UNCHANGED: the transformation recorded on artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c-article-text, re-applied by script to these bytes on 2026-10-01, reproduces that retained file byte for byte (SHA-256 c4e12a4a6127e8af8b7ac8e2176448f78a2be2cb2080ab5ffb6f885f8fcaa259, 52,109 bytes). The whole difference therefore lies in New Advent's page apparatus outside the article; the deficit is the uniform 359 bytes recorded for this class at artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05485a-e144286e, and the host still sends an x-mod-pagespeed header. That is an inference from the uniform deficit, not a diff, because the earlier bytes were not retained. NO SECOND COPY OF THE ARTICLE TEXT IS RETAINED HERE: a reader without the network opens artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c-article-text, and registering a second extraction of an unchanged article would put the same words in the tree twice. Registered to record the drift (guidance/sources.md: changed bytes receive a new artifact record, and consumers remain pinned until reviewed); the chronology claims citing artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c stay pinned to it, because the words they rest on are the retained extraction of those bytes. Three further fetches the same day returned these exact bytes."
