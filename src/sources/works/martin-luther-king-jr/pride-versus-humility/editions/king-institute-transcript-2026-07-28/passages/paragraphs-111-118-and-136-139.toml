context = "Paragraphs 111-118 turn the Pharisee's ceremonialism into an indictment of imperial oppression, lynching, the acquittal in the Emmett Till murder case, and Christians who separate emotional worship from moral life; paragraph 118 returns to disparaging comparison. Paragraphs 136-137 return to the publican's distance, shame, and plea for mercy. Paragraph 139 preserves the file-folder dating note. This supports a civil-rights redirection of the parable, not quotation of King's protected wording or certainty about date and place."
