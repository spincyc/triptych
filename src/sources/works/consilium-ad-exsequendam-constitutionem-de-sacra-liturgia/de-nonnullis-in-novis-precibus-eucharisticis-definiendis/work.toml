description = "Declaration dated 6 November 1968, signed by A. Bugnini, secretary, by mandate of the President. It addresses preparation of vernacular translations of the new Eucharistic Prayers, prescribes uniform institution formulas through a Latin exemplar and stronger type, and adds the bishop-celebrant self-reference in the intercessions, at least in editions for bishops. The document gives no separate commencement date and is not evidence that the original May 1968 booklet already printed the November formulas."
