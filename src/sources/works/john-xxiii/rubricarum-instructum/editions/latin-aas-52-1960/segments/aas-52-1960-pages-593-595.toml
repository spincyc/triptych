notes = "Artifact PDF pages 593-595 correspond to printed Acta pp. 593-595. The whole constituent was read in the artifact's optical text layer and its boundaries were checked against the neighbouring headings; no page-image collation of every line was performed. Re-collated on 2026-11-18 (verification lane V1): the controlling artifact is an OCR re-typesetting, not a page facsimile (see its notes), so the boundaries were read again on the microfilm page facsimile artifact.holy-see.acta-apostolicae-sedis.volume-52-1960.ia-microfilm-issue-pdf-51e41032 at 300 dpi. Printed p. 593 (PDF p. 5) opens with ACTA IOANNIS PP. XXIII, Litterae apostolicae motu proprio datae, NOVUM RUBRICARUM BREVIARII ET MISSALIS ROMANI CORPUS APPROBATUR; printed p. 595 (PDF p. 7) closes with the dating clause of 25 July 1960 and IOANNES PP. XXIII; the Sacred Congregation of Rites section opens on p. 596 (PDF p. 8). Art. 1 (effective 1 January 1961) and art. 3 (revocation of contrary statutes, privileges, indults and customs) on p. 594 (PDF p. 6) and n. 5 on p. 595 were also read on the images. The boundaries agree; the rest of the text was not collated line by line."
