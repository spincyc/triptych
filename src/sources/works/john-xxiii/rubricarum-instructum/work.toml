description = "John XXIII's apostolic letter given motu proprio of 25 July 1960 approving the new body of rubrics of the Roman Breviary and Missal. It contains a historical preamble and six numbered dispositions fixing the code's three-part structure, its binding force from 1 January 1961, the repeal of the earlier general rubrics and additions, the revocation of contrary privileges and customs, the preparation of new editions, and the conforming of particular calendars and propers."
