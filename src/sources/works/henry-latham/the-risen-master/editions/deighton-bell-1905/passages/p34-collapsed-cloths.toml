text = "In this recess, on the lower part of the ledge, lay the grave-clothes. They were in no disorder, they were just as they were when Joseph and others had wrapped them round the body of the Lord, only they were lying flat, fold over fold, for the body was gone. On the raised part of the ledge at the far end, all by itself, was the napkin that had gone round the head; this was not lying flat, but was standing up a little, retaining the twirled form which had been given it when it had been twined round the head of the Lord. Nothing in the place gave any sign of the touch of human hands: the body had been embedded in the powdered aloes and myrrh, but of this there was not a trace; the spice remained enclosed by the cloths between which it had been placed when the body was laid on the slab."
