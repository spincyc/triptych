notes = "The printing sets the participle entetyligmenon in Greek type in parenthesis after rolled up; it is omitted from this transcription, which carries no Greek. Latham's footnotes on the same page give the Greek of John 20:6 and 20:7 and the remark that the word apart is emphasised. Two pages later, at printed page 45, Latham writes that the Greek word used about the napkin does not imply a folding up for neatness' sake."
