context = "Latham on the participle at John 20:7, read on printed page 43 rendered from the hashed facsimile. Registered because a proponent of the arrangement argument here states against interest that the Greek does not mean folded."
physical_line_ranges = [[1, 2]]
text = "Now the word used for rolled up is employed (Matthew xxvii. 59, and Luke xxiii. 53) to express the wrapping of the Lord's body in the linen cloths, and it implies here that the napkin had been wrapped round the head and partially retained the annular form thus given it; I take it to mean that it was not folded so as to lie flat like the cloths. Now the Greek says that the napkin was not lying with the linen cloths, but rolled up apart in a place by itself. Our Revised Version leaves out the word apart, but what the Evangelist means I believe to be, that the napkin was separated from the rest of the clothes, and lay by itself on the raised part of the ledge, where there was nothing else."
