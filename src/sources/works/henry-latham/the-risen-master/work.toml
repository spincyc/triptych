description = "Latham's 1901 study of the resurrection narratives, whose second and third chapters propose that the burial cloths in the empty tomb were found collapsed where the body had lain, with the head-cloth retaining the annular form given it by the head. Latham credits the central idea to a pamphlet by the Rev. Arthur Beard of St John's College, Cambridge, which has not been located. The proposal is the ancestor of most later English writing on the disposition of the cloths. A locus is the chapter."
