description = "The fact-checking assessment that rates the folded-napkin claim Fiction. Registered for two things: its statement that numerous Bible study sources were checked and nothing was found about the alleged Jewish custom, and its estimate, honestly labelled as one, that the claim seems to have originated in 2007, which later writers copied as established fact."
