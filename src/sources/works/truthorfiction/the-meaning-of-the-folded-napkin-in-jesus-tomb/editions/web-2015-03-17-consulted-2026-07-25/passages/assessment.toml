context = "The whole assessment, read in the retrieved page. It sets out how seven English versions render John 20:7, notes that the Greek soudarion is not specifically a table napkin and that entulisso is from words that may mean to twist or to entwine, states that numerous Bible study sources were checked and nothing was found about the alleged Jewish custom, reports that a lifelong Orthodox Jewish scholar living in Jerusalem had never heard of it, and gives the estimate that the only references found are internet postings and emails that seem to have originated in 2007."
notes = "The 2007 estimate is labelled as an estimate on the page itself. Consuming publications record that this sentence is the source of the date repeated elsewhere, and that a dated 2006 appearance of the claim was located independently."
