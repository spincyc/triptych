schema = 1
record_type = "work"
id = "work.charles-wood.expectans-expectavi"
title = "Expectans Expectavi"
responsible = "Charles Wood"
work_type = "choral-setting"
composed = "1919"
composed_basis = "Wood set Sorley's poem after the poet's death at Loos in 1915; the IMSLP work record gives 1919 as the year of first publication. The composition date is therefore no later than 1919 and is recorded as that year, with the bound that the record states publication and not composition."
alternate_titles = ["Expectans expectavi (anthem)", "This sanctuary of my soul"]
languages = ["en", "la"]
locus_pattern = 'page-[1-7]'
description = "Charles Wood's choral setting of Charles Hamilton Sorley's poem 'Expectans Expectavi', whose title is the Latin incipit of the Offertory antiphon of the Fifteenth Sunday after Pentecost. The setting keeps the Latin title over an English text that begins 'This sanctuary of my soul'. Only the IMSLP catalogue record for it is registered here; the score itself was not retrieved."
