context = "The English headings give, in order, Genesis 1:1–13, Numbers 24:2b–3, 5–9, 17c–18, Micah 4:6–7 and 5:1–3, Isaiah 11:1–10, Baruch 3:36–4:4, Daniel 2:31–36 and 44b–45, Isaiah 9:5–6, and Isaiah 7:10–16b with 8:1–4 and 8:8b–10. In the second reading Balaam’s oracle includes the star from Jacob. The third names Bethlehem and the fourth describes the shoot of Jesse."
verified_on = "2026-11-23"
notes = "The service announces the fifth lesson under Jeremiah and identifies Baruch in its chapter-and-verse heading. The seventh reading’s Greek label gives Isaiah 9:6–7 and its English label gives 9:5–6. The Gospel later in the same book is Luke 2:1–20. These appointments describe the cited service and preserve its own numbering."
