context = "The fourth festal sticheron at Vespers asks how creation receives the coming of Christ. Heaven offers the star, the earth the cave and the wilderness the manger. The angels sing, the shepherds marvel and the Magi bring gifts. Humanity offers the Virgin Mother."
verified_on = "2026-11-23"
notes = "In the two December 25 Menaion columns locate meVE.Stichera04.text before the entrance. The Greek puts the Magi before the shepherds. Fr. Seraphim Dedes’s English translation [SD] reverses those two. The correspondences agree."
