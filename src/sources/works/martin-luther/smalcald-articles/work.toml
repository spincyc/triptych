description = "The articles drawn up by Martin Luther in 1537 and received among the Lutheran symbolical books. Part I lists the articles of the divine majesty held in common with Rome, including the confession that the Son was conceived by the Holy Ghost without the cooperation of man and born of the pure, holy Virgin Mary. Cited in Triptych publications as a document of that communion, never as Catholic authority."
