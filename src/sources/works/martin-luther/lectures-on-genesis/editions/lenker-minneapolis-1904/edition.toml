notes = "Volumes I and II of Lenker's series 'The Precious and Sacred Writings of Martin Luther', based on the Kaiser chronological edition with reference to the Erlangen and Walch editions. This translation covers only the opening of the lectures: volume I, 'Luther on the Creation', runs Genesis 1 to 4, and volume II, 'Luther on Sin and the Flood', runs Genesis 4 to 9. Luther lectured through Genesis 50, so this edition is a bounded part of the work and must not be read as the whole; the remainder reaches English only in the twentieth-century American Edition (Luther's Works 1 to 8, Concordia 1958 to 1966), which is in copyright. Lenker died in 1929 and the printing is of 1904, so this translation is in the public domain in the United States by date of publication."
