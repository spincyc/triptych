description = "Luther's lectures on Genesis, delivered at Wittenberg between 1535 and 1545 and the last and longest of his exegetical courses, running the whole book from the creation to the death of Joseph. They were taken down by hearers, edited by Veit Dietrich and others, and first printed 1544 to 1554; the extent of the editors' hand in the printed text is disputed and the dispute belongs to this record rather than to any translation of it. The work is named here by its Latin title because the lectures were delivered and printed in Latin, and reaches the reader in English only in parts."
