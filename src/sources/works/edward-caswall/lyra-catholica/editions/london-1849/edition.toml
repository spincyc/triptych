publication = "London: James Burns, 17 Portman Street, MDCCCXLIX. Title leaf transcribed from the page image at Internet Archive item LyraCatholica1849, leaf n8: \"LYRA CATHOLICA: CONTAINING ALL THE BREVIARY AND MISSAL HYMNS, WITH OTHERS FROM VARIOUS SOURCES. Translated by EDWARD CASWALL, M.A. [rule] DOMINE DILEXI DECOREM DOMUS TUAE [rule] LONDON: JAMES BURNS, 17 PORTMAN STREET. MDCCCXLIX.\" The printer's leaf facing it reads \"LONDON: PRINTED BY LEVEY, ROBSON, AND FRANKLYN, Great New Street, Fetter Lane.\" Internet Archive item LyraCatholica1849; OCLC 680510609; OpenLibrary OL26387751M."
date = "1849"
notes = "THE FIRST PRINTING, AND NOT THE ONE THE PROJECT'S GUIDANCE NAMES. guidance/propers-for-agents.md's open-items row cites Internet Archive item `lyracatholicaco00caswgoog` for \"Caswall's Lyra Catholica (London, 1849)\". That item is a different book: its metadata gives E. Dunigan, New York, 1851, its leaf n9 is headed PREFACE OF THE AMERICAN EDITOR, and that preface refers to Caswall's own version as \"published in London, 1849\" as something other than itself. The London 1849 is Internet Archive item LyraCatholica1849, which this record registers. The two items also differ in the ONE respect the guidance row turns on -- the shape of the Google matter in their text layers -- and in the opposite direction from what that row states; see the artifact records under this edition.\n\nThe title-page date reads MDCCCXLIX at the page image, with the L and the first X partly broken by the scan; the item metadata, the OCLC record and the American editor's preface in the 1851 reprint all give 1849 independently, so the year is not in doubt.\n\nA LITERARY TRANSLATION, NOT A LITURGICAL ONE. The book carries no imprimatur, no approbation and no decree in the front matter that was read here (leaves n5-n11 and n8 in particular). Its English has no liturgical standing whatever, in 1849 or since, and the same is true of every rival version -- Neale's, Aylward's, the Marquess of Bute's. Which voice this project prints is an editorial choice reserved to the maintainer; this record establishes only what this book contains and on what terms it may be reproduced.\n\nWHAT IT REACHES. All five sequences the 1962 Missale Romanum appoints. Four stand together in a section running to the head HYMNS FROM THE MISSAL, at printed pp. 233-244: Victimae Paschali laudes (p. 233, headed `Sequence, Easter-Sunday.`), Veni Sancte Spiritus (p. 234, `Sequence, Whit-Sunday.`), Lauda Sion Salvatorem (p. 236, `Sequence, Solemnity of Corpus Christi.`) and Dies irae dies illa (p. 241, `Sequence, Mass for the Dead.`). The Stabat Mater is not reprinted there: p. 244 prints the direction \"For Stabat Mater dolorosa, see page 138.\", and p. 138 heads it `Friday after Passion-Sunday. FEAST OF THE SEVEN DOLOURS OF THE BLESSED VIRGIN MARY. VESPERS. Stabat Mater dolorosa.`, continued under MATINS (p. 140) and LAUDS (p. 141), each marked \"(The same continued.)\". The three hours together carry the twenty strophes of the Missal sequence and nothing else: no doxology is added at any of the three breaks, and the last stanza renders both `Christe, cum sit hinc exire` and `Quando corpus morietur`, which is the Missal's ending and not the Breviary hymn's. Read on the page images at leaves n175-n179 and n270-n281 on 2026-08-20."
