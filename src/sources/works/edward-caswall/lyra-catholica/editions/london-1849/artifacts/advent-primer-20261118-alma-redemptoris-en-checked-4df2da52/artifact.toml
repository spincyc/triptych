notes = "Printed p. 38, artifact page 76: section heading, the blackletter season heading, the italic Latin incipit and Caswall's six-line verse rendering, entire. CASWALL'S SEASON HEADING DIFFERS FROM THE BREVIARY: he heads it From the First Sunday in Advent, where the 1888 Breviary begins it at Vespers of the Saturday before. The 1915 Little Office prints a variant of this English with a different last line (Pure Virgin first and last, look on our misery.) and other differences of pointing and capitals; it does not name a translator. It is a free metrical rendering, not a literal translation. 9 LF-terminated lines."
