notes = "THE ARTIFACT THE ENGLISH WAS ACTUALLY READ FROM, in its per-leaf image form. The same images are served leaf by leaf at https://archive.org/download/LyraCatholica1849/page/n<leaf>_w1400.jpg, which is the route used here; those are renderings of these pages and not a separate acquisition.\n\nLEAF RULE, DERIVED AND CHECKED, NOT ASSUMED: leaf = printed page + 37 through the body. Established at leaf n270, whose running head and folio read `FROM THE MISSAL. 233`, and held at every one of the twelve leaves opened between n270 and n281 and at all five between n175 and n179 (n175 = printed 138). It was not tested in the front matter or the indexes and must not be carried there.\n\nLEAVES OPENED AND WHAT EACH CARRIES, all read at 1400 px width on 2026-08-19 and 2026-08-20: n8 the title leaf; n175 printed 138, the head `Friday after Passion-Sunday ... VESPERS. Stabat Mater dolorosa.` and its first three lines; n176-n179 printed 139-142, the Stabat Mater continued under MATINS and LAUDS to `Safe in Paradise with Thee.`; n270 printed 233, the end of the Good-Friday Crux fidelis and the head `Sequence, Easter-Sunday. Victimae Paschali laudes.`; n271 printed 234, the rest of it and the head `Sequence, Whit-Sunday. Veni Sancte Spiritus.`; n272-n273 printed 235-236, the rest of that and the head `Sequence, Solemnity of Corpus Christi. Lauda Sion Salvatorem.`; n274-n277 printed 237-240, the Lauda Sion entire, with the bracketed marker `[Ecce panis angelorum.]` standing at the head of its eleventh stanza on printed 240; n278 printed 241, the head `Sequence, Mass for the Dead. Dies irae dies illa.`; n279-n281 printed 242-244, the Dies irae entire, ending `Grant the Faithful light and rest.`, followed by `For Stabat Mater dolorosa, see page 138.` and `END OF HYMNS FROM THE MISSAL.`\n\nQUALITY. The type is clean and unbroken at 1400 px and no line needed a second reading for its words. Two typographic details were not settled at that width and are recorded as open in the transcription artifact: the spacing around the two em dashes, and whether the printing sets a comma after `who died` in the third stanza of the Victimae paschali, where the text layer reads a full stop and the image reads a comma."
