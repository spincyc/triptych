notes = "A LEAD, NOT A SOURCE. Nothing in this project's Sequence transcription was read out of this file; every line was read on the page images and this text layer served only to find the leaves. It corrupts the incipits it prints -- `Fictimee Paschali laudes` for Victimae Paschali laudes, `Vent Sancte Spirttu` for Veni Sancte Spiritus, `Sequence, 0a»ter-Stm&aj?` for the blackletter `Sequence, Easter-Sunday.` -- so a reading taken from it would be composition.\n\nSTORAGE. Registered `remote` because this lane may not add tracked payload bytes. The rights case above is affirmative and complete, so an upgrade to `tracked` is available on the 1843 precedent (`artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.roman-missal-1843-text-6949d12f`) if a searchable text layer for this edition is wanted; the file is 222,340 bytes over 15,282 LF-terminated lines, valid UTF-8, no CR bytes.\n\nTHE GOOGLE CENSUS, RUN OVER THE WHOLE 222,340 BYTES ON 2026-08-20, CASE-INSENSITIVE. Absent: 'usage guidelines' 0, 'about this book' 0, 'about google book search' 0, 'books.google' 0, 'do not assume' 0, 'watermark' 0, 'non-commercial' 0, 'attribution' 0, 'creative commons' 0, 'all rights' 0, 'public domain' 0, 'copyright' 0. Present: the page-foot stamp, 'google' 311 times over 38 distinct line spellings and 358 lines, the commonest being 'Digitized by GoOgle' (160), a bare 'Google' (77), 'litized by Google' (48), 'Digitized by G00gle' (10), down through 'Digitized by CjOCK^Ic' and '>y Google'. That is the SAME SHAPE the 1843 audit found in `roman-missal-1843-text-6949d12f` and decided by retaining the stamp: no single stated deletion removes it and a pattern loose enough to catch the tail would delete real text.\n\nTHE THEN-CURRENT GUIDANCE SAID THE OPPOSITE, WHICH IS WHY THE CENSUS IS HERE. The superseded guidance/propers-for-agents.md row recorded that \"the 1849 Caswall bytes carry Google's front matter as a single contiguous head block, which is the shape the 1843 audit records as admitting the stated-deletion derivative route, unlike the 1861's page-foot stamp\". The head-block shape is real, but it belongs to Internet Archive item `lyracatholicaco00caswgoog`, which is the New York 1851 Dunigan reprint and not this book: measured the same day, that file has 'google' on 11 lines, all in lines 1-46, with 'usage guidelines' 1, 'do not assume' 2, 'public domain' 9, 'copyright' 5, and 'digitized by' 0 -- no page-foot stamp at all. The two items are exactly each other's opposite in this respect, and the superseded guidance row attached the wrong shape to the wrong year. The derivative route is available for THAT item and is not needed for THIS one.\n\nIDENTITY. Item LyraCatholica1849, uploaded 2017-10-17 by a private uploader, collections catholictexts, folkscanomy_religion, folkscanomy; 354 page images at 600 ppi; creator 'Catholic Church; Caswall, Edward, 1814-1878'; publisher 'London : J. Burns'; date 1849. NOTE THE SAME METADATA TRAP THE 1843 RECORD RECORDS: the item's `scanner` field says 'Internet Archive HTML5 Uploader 1.6.3', which describes how a private person uploaded the file and not who made the page images. The images are a Google digitisation -- the stamp is at the foot of every page image opened here, leaves n8, n175-n179 and n270-n281 among them -- so this item is a re-upload of Google-scanned pages re-recognised with ABBYY, and a record reading the `scanner` field alone would state the provenance backwards."
