rights_basis = "THE BOOK. Published at London in 1849. Any work published before 1931 is out of United States copyright; that is the line guidance/missals.md records from Cornell's public-domain chart, and it is written here AS DERIVED FOR CALENDAR YEAR 2026, not as a standing rule -- on 1 January 2027 it becomes before 1932 and a later reader must re-derive it. An 1849 London imprint clears the line by eighty-two years. This is a FOREIGN publication, so its United States term cannot be followed to its end from a domestic registration the way the 1843 Cummiskey's can; the age line is the whole of the case and is stated as such. Restoration under 17 U.S.C. 104A reaches only works still protected in the source country on 1 January 1996: Caswall died in 1878, so United Kingdom protection (life of the author plus seventy years) ended in 1948, and there was nothing left to restore. The basis is a United States one; a reader elsewhere must establish the position in their own jurisdiction.\n\nTHE SCAN AND ITS TEXT LAYER ADD NOTHING FOR ANYONE TO OWN. A faithful mechanical reproduction of a public-domain work is not original authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y. 1999)), and machine optical character recognition adds no human authorship on top of it: the item's own metadata names the recogniser as ABBYY FineReader 11.0 (Extended OCR), an autonomous program and not a person.\n\nAND THE GOOGLE MATTER WAS LOOKED FOR IN THESE BYTES RATHER THAN ASSUMED; SEE `notes`. Google's front-matter statement and usage guidelines are ABSENT from this file. What is present is the page-foot stamp alone, in 38 distinct spellings over 358 lines, carrying no notice and reserving nothing.\n\nNOT RELIED ON, EXPRESSLY: that the Internet Archive item is available, that the download succeeded, or that the item carries a Public Domain Mark 1.0 licence URL -- it does, at `licenseurl`, and guidance/sources.md holds that host marks and successful downloads are insufficient. The 1849 book's own printed English is public domain independently of this digitisation."
