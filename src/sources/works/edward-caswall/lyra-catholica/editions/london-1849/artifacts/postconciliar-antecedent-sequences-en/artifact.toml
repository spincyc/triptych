notes = "One header line and three data lines. Columns: entry_key, mass, form_id, proper, cycle, occurrence, english_json. `english_json` contains exactly one valid JSON string literal; decoding it yields the complete multiline English body, without a terminal LF. Coverage is limited to the three Caswall Sequences used as antecedents in the postconciliar translation overlay: Victimae Paschali laudes, Veni Sancte Spiritus, and Lauda Sion Salvatorem. The existing missal-sequences-en artifact remains the line-level transcription and page locator for all five historical Sequences; this smaller artifact exists only to give each publishable overlay body one atomic, hash-pinned row."
