notes = "Printed pp. 43-45, artifact pages 81-83: the Advent heading under HYMNS FROM THE BREVIARY, Part II (Hymns belonging to the Proper of the Season), the Vespers hymn in six stanzas (the sixth the doxology), and the alternative bracketed doxology for the Octave of the Conception at the head of p. 45. The section and part headings above the Advent heading are not transcribed. Stanza lines: 4-7, 8-11, 12-15, 16-19, 20-23, 24-27; alternative doxology 28-32. A free verse rendering of the revised Breviary hymn, not a literal translation. 32 LF-terminated lines."
