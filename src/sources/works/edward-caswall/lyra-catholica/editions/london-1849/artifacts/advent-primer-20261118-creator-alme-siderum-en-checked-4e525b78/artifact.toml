transformation = "Read on page images rendered at 250 dpi from the exact registered whole PDF (SHA-256 c8f7b620f69a376613e1e8956b41c4047485aee0ab3d5726be60b666305238f9, re-fetched whole on 2026-11-18 and matched before use); artifact page = printed page + 38 throughout pp. 38-47, checked on every running folio opened. One printed verse line or heading per LF-terminated UTF-8 line, each prefixed by a braced printed-page locator. Wording, spelling, elision, capitalization and pointing as printed; the apostrophe is U+2019 and the double quotation marks U+201C and U+201D, which is what the printing sets. Not reproduced: indentation of the second and fourth lines, stanza spacing, the capital-and-small-capital setting of each hymn's first word (rendered in ordinary case), the printer's space before ! : ; and ?, running heads, rules and the Google stamp. Headings in capitals or blackletter are transcribed as words with their printed capitalization where it is capitals, otherwise in ordinary case. The OCR text layer was used only to find the pages."
