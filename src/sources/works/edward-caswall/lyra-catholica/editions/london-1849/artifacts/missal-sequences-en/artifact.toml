notes = "One header line and 246 data lines. Columns: hymn, latin_incipit, printed_page, ia_leaf, stanza, line, english. `hymn` is one of victimae-paschali, veni-sancte-spiritus, lauda-sion, dies-irae, stabat-mater. `printed_page` and `ia_leaf` are the page and the zero-based Internet Archive leaf at which THAT LINE stands, so a strophe broken across a page break carries two different values and can be found at either.\n\nCOVERAGE: the five sequences the 1962 Missale Romanum appoints, entire, and nothing else from the book. Victimae Paschali laudes 6 stanzas / 19 lines; Veni Sancte Spiritus 10 stanzas / 30 lines; Lauda Sion Salvatorem 12 stanzas / 80 lines; Dies irae 19 stanzas / 57 lines; Stabat Mater dolorosa 10 stanzas / 60 lines.\n\nSTROPHE CORRESPONDENCE AGAINST THE LATIN THIS REPOSITORY CARRIES, counted, not assumed, on 2026-08-20 against src/sources/calendars/roman-1962/propers.yaml. Caswall sets the Latin's tercets two to a stanza and each of the five is complete strophe for strophe: Victimae paschali, 8 Latin strophes against 6 English stanzas, the fifth of which carries the two short strophes `Sepulcrum Christi viventis` and `Angelicos testes` together; Veni Sancte Spiritus, 10 against 10, one for one; Lauda Sion, 24 against 12, two for one throughout, with the Latin's two eight-line strophes (`Fracto demum` + `Nulla rei`) and its two closing ten-line strophes falling out as Caswall's eight- and ten-line stanzas; Dies irae, 19 against 19, one for one; Stabat Mater, 20 against 10, two for one throughout. NO CLAIM IS MADE HERE ABOUT FIDELITY OF WORDING. The count establishes that nothing is missing and nothing is added; whether a given English line renders its Latin well is an editorial judgement this file does not make.\n\nWHAT THE ENGLISH DOES NOT RENDER. The 1962 Missal prints `Amen.` after the Stabat Mater and after the Dies irae, `Amen. Alleluja.` after the Victimae paschali, the Veni Sancte Spiritus and the Lauda Sion, and September's setting of the Stabat Mater ends `Amen. Alleluia.` Caswall prints none of these: the English simply ends. A consumer that needs the acclamation must supply it from the Latin proper and must not read its absence here as a variant reading.\n\nTWO READINGS LEFT OPEN AT 1400 PX, both punctuation and neither affecting sense. The spacing around the em dash in `Heal our wounds — our strength renew;` (p. 235) and in `Signs, not things, are all we see;—` (p. 238) is transcribed as it appeared and was not re-read at a higher resolution; the two are recorded differently here because they appeared differently. And p. 234 line `The Prince of Life, who died,` is read with a comma on the image where the item's OCR reads a full stop; the image was preferred, per the rule that the text layer is a lead.\n\nTHE STABAT MATER IS TAKEN FROM THE BOOK'S OFFICE SECTION, ON THE BOOK'S OWN INSTRUCTION. Its Missal section prints, at p. 244, `For Stabat Mater dolorosa, see page 138.`, and p. 138 heads the text `Friday after Passion-Sunday ... VESPERS`, continuing under `MATINS (The same continued.)` at p. 140 and `LAUDS (The same continued.)` at p. 141. The three hours together are the twenty strophes of the Missal sequence with no doxology added at any break, and the closing stanza renders BOTH `Christe, cum sit hinc exire` and `Quando corpus morietur`, which is the Missal's ending; the eighteenth-century Breviary recension of this hymn ends otherwise. So this is the sequence and not a hymn cut down from it, and the cross-reference is the book's own."
