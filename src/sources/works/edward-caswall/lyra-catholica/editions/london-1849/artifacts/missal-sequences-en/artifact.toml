transformation = "Project transcription from page images. Each of the five sequences was located from its printed heading, and every line was read off the leaf image at 1400 px width and typed here; the item's OCR text layer was used to find the leaves and for nothing else, and no line in this file was taken from it. One physical line per printed verse line. Line-terminal hyphenation does not occur in this setting and none was closed up. Nineteenth-century spelling, capitalisation and elision are reproduced as printed and were not modernised or corrected against the Latin: `reconcil'd`, `turn'd`, `Giv'n`, `Heav'n-supplied`, `curs'd`, `swoon'd`, `pass'd`, `confess'd`, `'tis`, `'Twas`. The apostrophe is transcribed as U+2019 throughout, which is the mark the printing sets. TWO THINGS ARE DELIBERATELY NOT CARRIED. The printing indents the second and third line of each strophe and this file does not record indentation. And one turn-over is restored to its own line: printed p. 234 sets `We know that Christ indeed has risen from the` and puts the word that finishes it, bracketed, at the end of the line below -- `Hail, thou King of Victory! [grave:` -- which is the compositor's device for a line too long for the measure, so the transcription reads `We know that Christ indeed has risen from the grave:` and the bracket is not reproduced. That is a typographic restoration and it is the only one; nothing else in this file was moved, joined, or supplied."
