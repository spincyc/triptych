description = "Morin's edition of the gospel lists of the Wuerzburg manuscript. Its post-Laurentii series heads the Masses 'EBD. II-IIII POST SCI. LAUR.' rather than by a Sunday after Pentecost, which is the seventh-century form of the asymmetry between the chant strand and the reading strand that this run is tracing."
