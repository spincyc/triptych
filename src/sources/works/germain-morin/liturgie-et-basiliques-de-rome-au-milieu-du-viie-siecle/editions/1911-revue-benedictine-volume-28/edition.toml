notes = "Registered on the pattern this library uses for a constituent of a larger volume: the edition is the article as the Revue Benedictine prints it, and the artifacts are the Internet Archive's derivatives of the whole journal volume, which is the narrowest exact witness that was retrieved. The article stands at printed pages 296-330 of the volume; the post-Laurentii gospel entries read for this run are at printed page 314 with Morin's notes 3 to 6. The article is in French and the texts it edits are in Latin; the edition language records the article's own language."
