description = "Morin's edition of the epistle list of the Wuerzburg comes, the oldest surviving Roman lectionary list. Item CCXXVIII is the Galatians pericope 'Spiritu ambulate ... carnem suam crucifixerunt', which is the Epistle of the Roman Fourteenth Sunday after Pentecost. Morin's own note at printed page 68 records that items CCXIIII-CCLV are a block of some forty Pauline pericopes carried without titles, which is what makes the identification of any one of them with a Sunday an inference rather than a heading read off the manuscript."
