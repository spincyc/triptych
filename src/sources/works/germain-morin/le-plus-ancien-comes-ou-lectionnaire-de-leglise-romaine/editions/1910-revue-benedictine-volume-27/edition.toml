notes = "Registered on the pattern this library uses for a constituent of a larger volume: the edition is the article as the Revue Benedictine prints it, and the artifacts are the Internet Archive's derivatives of the whole journal volume, which is the narrowest exact witness that was retrieved. The article stands at printed pages 41-74 of the volume. Morin's statement at printed page 42 that the gospel list is 'visiblement et de tout point independant de l'Epistolier qui precede' is what keeps the two Wuerzburg lists separate works and separate editions here. The article is in French and the texts it edits are in Latin; the edition language records the article's own language."
