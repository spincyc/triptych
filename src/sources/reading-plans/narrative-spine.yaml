    label: Patriarchs
    summary: |
      Genesis 12-50, less chapter 36: the promise given to Abraham, carried through Isaac and Jacob, and preserved in Egypt through Joseph. The genealogy of Esau (36), the genealogy of Nachor (22:20-24) and the generations of Ismael (25:12-18) are passed over.
