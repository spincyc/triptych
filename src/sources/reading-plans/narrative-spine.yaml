schema: triptych-reading-plan/v1
title: 'The Story of Salvation: an abridged reading of the whole arc in order'
canon: catholic-73
numbering: vulgate
tiers:
  landmarks:
    readings: 36
    label: Landmarks
    description: |
      Thirty-six sittings, two to four in each period: the hinge readings, without which the arc does not stand. 1,210 verses, 3.4 per cent of the Bible. It is deliberately jumpy - a skeleton, not yet a story.

      The three tiers nest. Every reading carries the tier at which it first appears, and no reading appears twice, so a tier is read by taking every reading marked at that tier or above, in order. The lower tiers therefore fill the gaps between the higher ones rather than restating them, and no passage is read twice in one pass.
  story:
    readings: 111
    label: The Story
    description: |
      The story told continuously: 111 readings, the 36 above plus 75 more, at 3,675 verses or 10.3 per cent of the Bible. Adds the connecting episodes, so that cause and consequence hold from Genesis 12 to Acts 28. Confined to the consensus narrative spine, and to it alone: at this tier the plan reads no prophet, no psalm, no gospel but St. Luke, and none of the narrative deuterocanon but 1 Machabees.
  full-account:
    readings: 357
    label: The Full Account
    description: |
      The full spine at about a chapter to a reading: 357 readings, 13,867 verses, 38.7 per cent of the Bible, touching 454 chapters in 31 books. Adds to the narrative tier the three remaining gospels where they give what St. Luke does not; the narrative deuterocanon - Daniel, Esther, Tobias, Judith and 2 Machabees 6-7; and the non-narrative passages the story is unintelligible without: the messianic prophecies of Isaias, the new covenant of Jeremias, the shepherd and the dry bones of Ezechiel, and sixteen psalms. At roughly a reading a day it runs a year with eight days to spare.
omissions: |
  This plan is an abridgement, and the honest account of an abridgement is what it
  leaves out. All figures below are verse counts taken from the Douay-Rheims
  (Challoner) text indexed in this repository, whose 73 books hold 35,804 verses.
  Percentages computed on a 66-book canon run higher for every class named here,
  because the denominator is smaller; the commonly quoted figures of about 19.8 per
  cent for the prophets, 14.4 per cent for wisdom and poetry and 8.1 per cent for
  the epistles are of that kind.

  At its fullest tier this plan reads 13,867 verses, 38.7 per cent of the Bible.
  The story tier reads 3,675 verses, 10.3 per cent. The landmarks tier reads
  1,210 verses, 3.4 per cent.

  The reduction does not come from cutting genealogies and law codes. Those are
  small: every genealogy and register dropped here comes to 297 verses, 0.8 per
  cent of the Bible, and the whole of Leviticus, Exodus 25-31 and 35-40, Numbers
  1-9 and 26-30 and Deuteronomy 12-26 together come to 2,217 verses, 6.2 per cent.
  Seven per cent, between them. The reduction comes from dropping three whole
  classes of book that are not narrative, which come to 15,519 verses, 43.3 per
  cent of the Bible.

  Not read at any tier:

    The prophets, 5,875 verses, 16.4 per cent of the Bible (counting Lamentations,
    Baruch and Daniel among them). What survives is fifteen passages in thirteen
    readings, and the narrative chapters of Daniel: Isaias 7:1-17, 9:1-7, 11:1-10,
    52:13-53:12, 54:5-14 and 55:1-11; Jeremias 31:31-40, 36 and 38:1-13; Baruch
    3:9-15 with 3:32-4:4; Ezechiel 34, 36:16-28 and 37:1-14; Lamentations 3:19-33;
    Daniel 1-6, 13 and 14. Everything else is absent - the whole of Osee through
    Malachias, all but six passages of Isaias, all but three of Jeremias, Daniel's
    visions, and every oracle against the nations. A reader who finishes this plan
    has not read the prophets.

    The wisdom and poetical books, 6,881 verses, 19.2 per cent. Job, Proverbs,
    Ecclesiastes, the Canticle of Canticles, Wisdom and Ecclesiasticus are not read
    at all. Of the 150 psalms, sixteen are read, each because a narrative moment
    demands it.

    The epistles, 2,763 verses, 7.7 per cent. All twenty-one, and Hebrews with
    them. The plan follows the Church's expansion through the Acts and stops; it
    does not read what the apostles wrote to the churches they founded. That is the
    largest gap in its New Testament coverage, and no narrative plan can close it,
    because the epistles are not narrative.

    The Apocalypse, but for 21:1-22:5, read as the close of the arc opened in
    Genesis 1.

  Also not read, being narrative or historical but doubled, legal, or list:
  Leviticus entire; Exodus 25-31 and 35-40; Numbers 1-9 and 26-30 apart from
  chapter 27; Deuteronomy 12-26; Josue 12-22; Judges 17-21; 1 and 2 Paralipomenon
  entire, as a second telling of reigns already read in Samuel and Kings; Aggeus,
  Zacharias and Malachias, though they belong to the Return; and 2 Machabees but
  for chapters 6 and 7.

  Genealogies and registers dropped: Genesis 5, 10, 22:20-24, 25:12-18 and 36;
  Exodus 6:14-30; Esdras 2; Nehemias 3 and 7. Genesis 11:10-32 and St. Matthew 1
  are kept, because they are the two genealogies that carry the plot.

  The consensus narrative spine within the twelve periods is 334 chapters. This
  plan reads 331 of them, holding back only Esdras 2, Nehemias 3 and Nehemias 7,
  and adds the material listed at the year tier. It touches 454 chapters in 31 of
  the 73 books.

  The cost is stated here because every abridgement that concealed it has been
  attacked for concealing it. A reader who wants the Bible should read the Bible.
  What this offers is the story in order, at three depths, with the seams visible.
precedents: |
  Derivation. The selection was made independently. Four widely used narrative
  schemes were consulted to establish where they agree - Ascension's Great
  Adventure Bible Timeline, Zondervan's The Story, Tyndale's narrative
  arrangement, and BibleProject's reading plans. The agreement was measured, not
  transcribed: the overlap is a fact about those schemes, and facts about a work
  are not the work. It comes to 334 chapters, about 30.7 per cent of the Bible by
  verse, and it is the spine of the landmarks and story tiers here. No scheme's
  chapter list, sequence, division into readings, reading titles, notes or
  commentary has been copied, and none was consulted while the readings below were
  divided, ordered or titled. All four are protected compilations and remain so.

  Rights caution, and what was done about it. This file was first drafted with
  the twelve period names of Ascension's Great Adventure Bible Timeline - Early
  World, Desert Wanderings, Royal Kingdom, Divided Kingdom, Return, Messianic
  Fulfilment, The Church, and the five that are plain historical terms anyway. A
  division of sacred history into named periods is a system rather than an
  expression, and each label on its own is a short descriptive phrase; but the set
  of twelve taken together was recognisably that scheme's, and Ascension's terms
  ask that their material not be reproduced or altered. The labels have therefore
  been replaced with the periodization ordinary in biblical scholarship -
  Primeval History, The Wilderness, The United Monarchy, The Divided Monarchy,
  Return and Restoration, The Life of Christ, The Apostolic Church - which any
  scheme arrives at independently. The period keys did not change and no reading
  moved, because the keys were made stable for exactly this reason.

  Text and numbering. Book names are the modern_name column of this repository's
  Douay-Rheims book index, so that Douay 1 and 2 Kings appear as 1 and 2 Samuel and
  Douay 3 and 4 Kings as 1 and 2 Kings; the Douay titles are given in the period
  summaries and in the first reading of each affected book. Chapter and verse are
  Vulgate throughout, verified against the verse text of the Challoner edition
  indexed here. Psalms therefore carry Vulgate numbers: the shepherd psalm is 22,
  not 23, and every psalm reading below states its Hebrew equivalent in a note.
  Tobias, Judith, Esther and Ecclesiasticus are divided differently in the Vulgate
  than in the Greek behind most modern versions, and those references will not
  transfer unchanged; the readings concerned say so.

  Public-domain Catholic precedent, drawn on freely. Friedrich Justus Knecht, A
  Practical Commentary on Holy Scripture (1910), whose selection of Old Testament
  narratives for continuous reading stands behind the shape of the first six
  periods. Ignaz Schuster, Bible History (Handbuch zur biblischen Geschichte), in
  its nineteenth-century English editions, whose two-testament arrangement and its
  insistence that the deuterocanonical histories carry the period between the
  Testaments stand behind the Maccabean period here. Both are out of copyright.

  Liturgical precedent, and the Church's own abridgement. The seven Old Testament
  lessons of the Easter Vigil are the oldest surviving abridgement of salvation
  history in Catholic use, and they are treated here as a constraint rather than a
  model: every one of them is read, at the range the Missal appoints. They are
  Genesis 1:1-2:2, Genesis 22:1-18, Exodus 14:15-15:1, Isaias 54:5-14, Isaias
  55:1-11, Baruch 3:9-15 with 3:32-4:4, and Ezechiel 36:16-28. Each carries a note
  at its reading.
periods:
  - key: early-world
    label: Primeval History
    summary: |
      From the creation to the scattering at Babel: the world God made, the fault that broke it, and the first covenant made with a remnant. Genesis 5 and 10, which are genealogies, are passed over; Genesis 11:10-32 is kept because it is the bridge to Abram.
    readings:
      - order: 1
        tier: landmarks
        title: Creation
        book: Genesis
        ranges:
          - {begin: {chapter: 1, verse: 1}, end: {chapter: 2, verse: 2}}
        note: |
          The first lesson of the Easter Vigil. The Vigil's own abridgement of salvation history governs this plan: every one of its lessons is read at some tier.
      - order: 2
        tier: full-account
        title: The seventh day and the garden
        book: Genesis
        ranges:
          - {begin: {chapter: 2, verse: 3}, end: {chapter: 2, verse: 25}}
        note: |
          The sabbath blessing, and the second account, in which man is placed in the garden and given the woman.
      - order: 3
        tier: landmarks
        title: The fall
        book: Genesis
        ranges:
          - {begin: {chapter: 3, verse: 1}, end: {chapter: 3, verse: 24}}
        note: |
          The protoevangelium at 3:15 is the seed of everything the plan afterwards follows.
      - order: 4
        tier: story
        title: Cain and Abel
        book: Genesis
        ranges:
          - {begin: {chapter: 4, verse: 1}, end: {chapter: 4, verse: 16}}
      - order: 5
        tier: full-account
        title: 'The sons of Cain, and calling on the name of the Lord'
        book: Genesis
        ranges:
          - {begin: {chapter: 4, verse: 17}, end: {chapter: 4, verse: 26}}
        note: |
          Kept, against the general omission of genealogies, because it divides the two lines from which the flood narrative proceeds.
      - order: 6
