          disputed between 641 and 639.
        date:
          precision: relative
          relative:
            of: israel.divided-kingdom.josias-reign
            statement: in the eighteenth year of king Josias
          label: "in the eighteenth year of king Josias"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Florentine Bechtel's "First and Second Books of Kings" (Catholic
          Encyclopedia, New York, 1910), fixing the latest possible date for
          those books, dates the reform in passing: "The latest date, on the
          other hand, must be assigned to a time prior to Josias's reform (621
          B.C.)."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08647b-a445d5a7]
        note: >-
          The figure is incidental to an argument about the composition of 1-2
          Kings, and it agrees with the eighteenth regnal year only on Gigot's
          reckoning, and then only approximately.
        date:
          precision: year
          from: {year: 621, era: bc}
          label: "Josias's reform (621 B.C.)"

  - id: israel.exile.carchemish
    title: The battle of Carchemish and the beginning of Juda's Babylonian vassalage
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) states: "The Egyptians were defeated at Carchemish in
          the year 605 by Nabuchodonosor (Nebuchadnezzar) ... Joakim
          (Jehoiakim), a son of Josias, was forced to exchange Egyptian for
          Babylonian vassalage."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        note: >-
          "605" is printed without "B.C." in this sentence; the surrounding
          article is B.C. throughout. The article attaches no year to the
          deportation of Daniel 1:1, and this corpus does not supply one.
          4 Kings 24:1 says only that "Joakim became his servant three years:
          then again he rebelled against him."
        date:
          precision: year
          from: {year: 605, era: bc}
          label: "in the year 605"

  - id: israel.exile.joakim-accession
    title: The accession of Joakim, king of Juda
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Petavius table in Sloet's "Chronology of the Kings" (Catholic
          Encyclopedia, New York, 1910) sets "Joachaz" and "Joakim" both against
          "B.C. 610" in the Juda column.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Table extraction: thirteen labels map onto thirteen years, paired by
          position, and two consecutive labels share the year 610. Re-verify
          against a page image before publishing. This is the only accession
          figure for Joakim inspected for this lane.
        date:
          precision: year
          from: {year: 610, era: bc}
          label: "B.C. 610"

  - id: israel.exile.first-captivity
    title: "The first captivity of Juda, under Joakim"
    note: >-
      No Catholic source inspected for this lane attaches a B.C. year to this
      deportation. Reid's "Captivities of the Israelites" dates Carchemish to
      605 but not the carrying away itself.
    dates:
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The 2014 Loreto / Feeney Memorial printing of the Douay-Rheims with
          Haydock's commentary, in its note at Psalm 70:1, prints a chronology
          "explicitly attributed to Usher" which gives the first captivity under
          Joakim as A.M. 3398, the second under Jechonias as A.M. 3405, and the
          last, when Jerusalem was destroyed and Sedecias was taken, as A.M.
          3416.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.psalm-70-captivities-usher-chronology]
        note: >-
          This is the Haydock edition reporting Usher, whose chronology this
          profile never admits alone and never as a source of record; the
          testimony recorded is the Catholic edition's printing of it. The Anno
          Mundi figure is kept in the era it was printed in and is not converted
          to B.C., because no epoch has been inspected. The same record notes
          that the note itself calls the Greek title of Psalm 70 "of no great
          authority", so the chronology is no textual control on the Hebrew
          superscription. It is the only absolute figure any inspected source
          attaches to this deportation, but it stands below Scripture's own
          regnal anchor, because precision is not authority in this profile.
        date:
          precision: year
          from: {year: 3398, era: am}
          label: "A.M. 3398"
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Daniel 1:1 gives the Scriptural anchor for
          the first siege: "In the third year of the reign of Joakim, king of
          Juda, Nabuchodonosor, king of Babylon, came to Jerusalem, and besieged
          it."
        sources: [bible:douay-rheims:Dan.1.1]
        note: >-
          Daniel 1:1 says "third year" where Jeremias 25:1 and 46:2 speak of the
          fourth year of Joakim; the divergence stands in the text and is not
          harmonised here. Howlett's "Biblical Chronology" declines to use
          Daniel as a chronological authority at all.
        date:
          precision: relative
          relative:
            of: israel.exile.joakim-accession
            statement: In the third year of the reign of Joakim, king of Juda
          label: "In the third year of the reign of Joakim, king of Juda"

  - id: israel.exile.second-captivity
    title: "The second captivity of Juda, under Jechonias"
    note: >-
      Scripture at 4 Kings 24:8 and 24:12 says that Joachin "reigned three
      months in Jerusalem" and that "the king of Babylon received him in the
      eighth year of his reign", while 2 Paralipomenon 36:9 in the same Douay
      text reads "eight years old ... three months and ten days". The divergence
      is preserved, not resolved. "Jechonias" is the Douay name for Joachin.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Haydock edition's note at Psalm 70:1 prints a chronology
          explicitly attributed to Usher which gives "the second under Jechonias
          as A.M. 3405", between the first captivity at A.M. 3398 and the
          destruction of Jerusalem at A.M. 3416.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.psalm-70-captivities-usher-chronology]
        note: >-
          Usher's figure as transmitted by the Haydock edition; it is that
          edition's testimony, not Haydock's own reckoning and not Usher as a
          source of record. Recorded in the era it was printed in and never
          converted; it is not the Anno Mundi equivalent of any B.C. figure held
          beside it.
        date:
          precision: year
          from: {year: 3405, era: am}
          label: "A.M. 3405"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) dates the surrender: "Joachin (Jehoiachin), who
          meanwhile had succeeded to the crown of Juda, was forced to surrender
          the beleaguered city, 597 B.C. ... numbering in all 10,000, were
          carried captive to Chaldea."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        note: >-
          This B.C. figure and the Anno Mundi figure preferred above come from
          different sources on different reckonings and must never be presented
          as one another's conversion.
        date:
          precision: year
          from: {year: 597, era: bc}
          label: "597 B.C."

  - id: israel.exile.sedecias-reign
    title: The reign of Sedecias
    note: >-
      Meistermann's "Jerusalem (Before A.D. 71)" calls Sedecias "third son of
      Josias" succeeding "his nephew", where 2 Paralipomenon 36:10 in the Douay
      text calls him Joachin's uncle.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Barnabas Meistermann's "Jerusalem (Before A.D. 71)" (Catholic
          Encyclopedia, New York, 1910) writes: "Sedecias, third son of Josias,
          succeeded his nephew (596-587). Urged by the Egyptian party, he, too,
          rebelled against his suzerain."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          "B.C." is not repeated on this parenthesis; the surrounding article is
          B.C. throughout.
        date:
          precision: range
          from: {year: 596, era: bc}
          to: {year: 587, era: bc}
          label: "(596-587)"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Petavius table in Sloet's "Chronology of the Kings" (Catholic
          Encyclopedia, New York, 1910) sets "Joachin" and "Sedecias" both
          against "B.C. 599", the table then closing at 588 with the Remarks
          cell "Capture of Jerusalem".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          An accession year, not a reign span, and three years earlier than
          Meistermann's. Table extraction; re-verify against a page image.
        date:
          precision: year
          from: {year: 599, era: bc}
          label: "B.C. 599"

  - id: israel.exile.final-siege
    title: The beginning of the final siege of Jerusalem
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 4 Kings (2 Kings) 25:1-2 dates the siege to
          the day within Sedecias's reign: "in the ninth year of his reign, in
          the tenth month, the tenth day of the month, that Nabuchodonosor, king
          of Babylon, came ... And the city was shut up and besieged till the
          eleventh year of king Sedecias."
        sources:
          - bible:douay-rheims:4Kings.25.1
          - bible:douay-rheims:4Kings.25.2
        note: >-
          Day-precise, but only within Sedecias's own regnal reckoning and in
          the Hebrew months; there is no era anchor in the passage.
        date:
          precision: relative
          relative:
            of: israel.exile.sedecias-reign
            statement: >-
              in the ninth year of his reign, in the tenth month, the tenth day
              of the month, and besieged till the eleventh year
          label: >-
            in the ninth year of his reign, in the tenth month, the tenth day of
            the month

  - id: israel.exile.third-captivity
    title: "The third captivity of Juda: the destruction of Jerusalem under Sedecias"
    note: >-
      The Catholic Encyclopedia is not internally consistent about this year:
      the articles inspected here print 586, 587, 588 and, in one place that
      contradicts its own article, 536.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Haydock edition's note at Psalm 70:1 prints a chronology
          explicitly attributed to Usher giving "the last, when Jerusalem was
          destroyed and Sedecias was taken, as A.M. 3416", after the first
          captivity at A.M. 3398 and the second at A.M. 3405.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.psalm-70-captivities-usher-chronology]
        note: >-
          Usher's figure as transmitted by the Haydock edition, recorded as that
          Catholic edition's testimony and never as Usher standing alone. The
          Anno Mundi figure is kept exactly as printed and is not converted. The
          passage record states that these figures are not printed at Psalm 88
          and do not prove the Babylonian setting proposed there.
        date:
          precision: year
          from: {year: 3416, era: am}
          label: "A.M. 3416"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) writes that "the Babylonians finally entered through a
          breach in the wall, 586 B.C.", and Meistermann's "Temple of Jerusalem"
          (1912) says the Temple "was destroyed by Nabuchodonozor in 586 B.C."
        sources:
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2
          - artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14499a-82b12b6e
        note: >-
          Two Catholic Encyclopedia articles agreeing on 586 against three other
          figures inside the same encyclopedia. "Nabuchodonozor" is the Temple
          article's spelling.
        date:
          precision: year
          from: {year: 586, era: bc}
          label: "586 B.C."
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Joseph Schets's "Third and Fourth Books of Kings" (Catholic
          Encyclopedia, New York, 1910), arguing about the date of those books,
          dates the event in passing: Jeremias, if the author, "wrote the book
          not long before, or shortly after, the fall of Jerusalem (587 B.C.)".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08652a-189e1a8f]
        note: >-
          Incidental to an argument about authorship, and one year later than
          the figure Reid prints. Meistermann's "Jerusalem (Before A.D. 71)"
          likewise ends Sedecias's reign at 587.
        date:
          precision: year
          from: {year: 587, era: bc}
          label: "the fall of Jerusalem (587 B.C.)"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Petavius table in Sloet's "Chronology of the Kings" (Catholic
          Encyclopedia, New York, 1910) closes the Juda column at "B.C. ... 588"
          after Sedecias, and the Remarks cell attached to that final entry
          reads "Capture of Jerusalem".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Table extraction, with the Remarks cell paired to the final Sedecias
          entry. Re-verify against a page image before publishing.
        date:
          precision: year
          from: {year: 588, era: bc}
          label: "B.C. 588"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) ends its summary of the period: "The fall of Samaria in 722 or
          721, and the destruction of Jerusalem 536 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Recorded exactly as printed and deliberately not corrected. It
          contradicts the same article, which elsewhere gives 586 and puts the
          return under Cyrus at 536; it has the look of a printing error, but
          this corpus does not silently repair a source.
        date:
          precision: year
          from: {year: 536, era: bc}
          label: "the destruction of Jerusalem 536 B.C."

  - id: israel.exile.burning-of-the-temple
    title: The burning of the Temple and of Jerusalem
    parent: israel.exile.third-captivity
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 4 Kings (2 Kings) 25:8-9 dates the burning to
          the day: "In the fifth month, the seventh day of the month, the same
          is the nineteenth year of the king of Babylon, came Nabuzardan ... And
          he burnt the house of the Lord, and the king's house, and the houses
          of Jerusalem."
        sources:
          - bible:douay-rheims:4Kings.25.8
          - bible:douay-rheims:4Kings.25.9
        note: >-
          Jeremias 52:12 in the same Bible gives the tenth day of the fifth
          month, not the seventh; the divergence is in the text and is
          preserved. The regnal year here is Nabuchodonosor's, not Sedecias's.
        date:
          precision: relative
          relative:
            of: israel.exile.final-siege
            statement: >-
              in the fifth month, the seventh day of the month, the nineteenth
              year of the king of Babylon
          label: >-
            In the fifth month, the seventh day of the month, the same is the
            nineteenth year of the king of Babylon

  - id: israel.exile.deportations-of-nabuchodonosor
    title: Nabuchodonosor's deportations, counted by his regnal years
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Jeremias 52:28-30 counts three carryings-away
          by the king of Babylon's own regnal years: "in the seventh year, three
          thousand and twenty-three Jews. In the eighteenth year of
          Nabuchodonosor, eight hundred and thirty-two souls from Jerusalem. In
          the three and twentieth year of Nabuchodonosor, Nabuzardan the general
          carried away of the Jews seven hundred and forty-five souls."
        sources:
          - bible:douay-rheims:Jer.52.28
          - bible:douay-rheims:Jer.52.29
          - bible:douay-rheims:Jer.52.30
        note: >-
          These regnal years, 7, 18 and 23, do not line up straightforwardly
          with the 4 Kings scheme, which speaks of the eighth and nineteenth
          years of the king of Babylon. Both stand in the tracked Douay text and
          neither is adjusted to the other.
        date:
          precision: relative
          relative:
            of: israel.exile.third-captivity
            statement: >-
              in the seventh year, in the eighteenth year, and in the three and
              twentieth year of Nabuchodonosor
          label: >-
            in the seventh year ... In the eighteenth year of Nabuchodonosor ...
            In the three and twentieth year of Nabuchodonosor

  - id: israel.exile.seventy-years
    title: The seventy years of servitude to Babylon
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Jeremias 25:11-12 gives the oracle's own
          measure: "all these nations shall serve the king of Babylon seventy
          years. And when the seventy years shall be expired, I will punish the
          king of Babylon, and that nation, saith the Lord, for their iniquity."
        sources:
          - bible:douay-rheims:Jer.25.11
          - bible:douay-rheims:Jer.25.12
        note: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          1908) calls the figure a round number, not to be taken literally. 2
          Paralipomenon 36:21-22 reports its fulfilment "till the seventy years
          were expired ... in the first year of Cyrus king of the Persians".
        date:
          precision: relative
          relative:
            of: israel.exile.first-captivity
            statement: >-
              these nations shall serve the king of Babylon seventy years, from
              the first subjection of Juda
          label: "seventy years"

  - id: israel.restoration.decree-of-cyrus
    title: The decree of Cyrus and the return from captivity
    note: >-
      Scripture dates the decree only regnally. 1 Esdras 1:1 and 2 Paralipomenon
      36:22 both read "In the first year of Cyrus king of the Persians", and 2
      Paralipomenon adds that it came when "the seventy years were expired". The
      Catholic Encyclopedia articles inspected here put that first year two
      years apart and nothing settles them.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) writes: "Cyrus, accordingly, in the first year of his
          rule at Babylon, 538 B.C., forty-eight years after the destruction of
          Jerusalem issued an edict in which he allowed and recommended the
          return of all the Hebrews in his domain to the fatherland, ordered the
          rebuilding of the Temple".
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        date:
          precision: year
          from: {year: 538, era: bc}
          label: "in the first year of his rule at Babylon, 538 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) writes: "The first band of captives returned to Jerusalem under
          Zorobabel in the first year of Cyrus, i.e. 536 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        date:
          precision: year
          from: {year: 536, era: bc}
          label: "in the first year of Cyrus, i.e. 536 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) opens its restoration section: "In 536 B.C. Cyrus, King of
          Persia, authorized the Jews to return to Palestine and rebuild the
          Temple of the Lord."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          Agrees with Howlett's 536 against Reid's 538, a two-year disagreement
          inside one encyclopedia.
        date:
          precision: year
          from: {year: 536, era: bc}
          label: "In 536 B.C."

  - id: israel.restoration.temple-raised-by-zorobabel
    title: The raising of the second Temple by Zorobabel
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Meistermann's "Temple of Jerusalem" (Catholic Encyclopedia, New York,
          1912) writes: "After the return from captivity Zorobabel raised it
          again from its ruins (537 B.C.), but in such modest conditions that
          the ancients who had seen the former Temple wept."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14499a-82b12b6e]
        note: >-
          This is Meistermann's date for the raising, not for the completion,
          which other Catholic Encyclopedia articles put at 516 or 514. It also
          stands a year before the decree that other articles in the same work
          date to 536.
        date:
          precision: year
          from: {year: 537, era: bc}
          label: "(537 B.C.)"

  - id: israel.restoration.temple-work-resumed
    title: The resumption of the work on the Temple under Darius
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
