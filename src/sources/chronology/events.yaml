  - id: apostolic-age.martyrdom-of-saint-peter
    title: The Martyrdom of St Peter
    note: >-
      The Catholic Encyclopedia's own article on St Peter declines to settle
      this: "The date of Peter's death is thus not yet decided." Nothing here may
      be displayed as the traditional answer.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "St. Peter, Prince of the Apostles"
          (Kirsch, vol. 11) reports the reckoning of Eusebius's Chronicle: "the
          thirteenth or fourteenth year of Nero is given as that of the death of
          Peter and Paul (67-68); this date, accepted by Jerome, is that
          generally held."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11744a-3bac29d1]
        note: >-
          The A.D. equivalent of the regnal years is the encyclopedia's, not
          Eusebius's. Jerome, De viris illustribus 1, states the same regnal
          anchor with the manner of death: Peter held the chair at Rome "for
          twenty-five years until the last, that is the fourteenth, year of Nero.
          At his hands he received the crown of martyrdom being nailed to the
          cross with his head towards the ground."
        date:
          precision: interval
          from: {year: 67, era: ad}
          to: {year: 68, era: ad}
          label: "(67-68)"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same article records a rival third-century entry: "A different
          statement is furnished by the 'Chronograph of 354' ... This refers St.
          Peter's arrival in Rome to the year 30, and his death and that of St.
          Paul to 55."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11744a-3bac29d1]
        date:
          precision: year
          from: {year: 55, era: ad}
          label: "his death and that of St. Paul to 55"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same article's own conclusion refuses both and leaves a window
          open: "the period between July, 64 (outbreak of the Neronian
          persecution), and the beginning of 68 (on 9 July Nero fled from Rome
          and committed suicide) must be left open for the date of his death."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11744a-3bac29d1]
        note: >-
          The article adds that the day is unknown: "29 June, the accepted day of
          his feast since the fourth century, cannot be proved to be the day of
          his death."
        date:
          precision: interval
          from: {year: 64, era: ad, month: 7}
          to: {year: 68, era: ad}
          label: "the period between July, 64 ... and the beginning of 68"

