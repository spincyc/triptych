          Kings 18.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.second-kings-18-absalom-defeat-chronology]
        note: >-
          The passage record warns that an OCR derivative misreads A.C. 1023 as
          1093 at 2 Kings 16; the page image prints 1023. These pages do not
          erase the A.M. 2979 / A.C. 1025 marker at the opening of 2 Kings 15.
          The A.C. figure is the edition's own; this corpus converts no Anno
          Mundi figure.
        date:
          precision: year
          from: {year: 2981, era: am}
          label: "A. M. 2981, A. C. 1023"

  - id: israel.monarchy.david-flight-from-absalom
    title: David's flight from the face of Absalom
    dates:
