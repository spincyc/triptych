          the Temple, which was finished in 516."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        date:
          precision: year
          from: {year: 516, era: bc}
          label: "the Temple, which was finished in 516"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) says the second temple "was not completed until the sixth
          year of the reign of Darius (514)".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          This figure is unique to this article among those inspected and
          conflicts with the 516 printed elsewhere in the same encyclopedia.
        date:
          precision: year
          from: {year: 514, era: bc}
          label: "the sixth year of the reign of Darius (514)"

  - id: israel.restoration.esdras-return
    title: The return of Esdras to Jerusalem
    note: >-
      Scripture dates the return only to "the seventh year of Artaxerxes the
      king" (1 Esdras 7:7-8), and which Artaxerxes is meant is expressly
      disputed in the Catholic Encyclopedia. The two rival orderings put Esdras
      sixty-one years apart, and the sources inspected here leave the question
      open.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) writes: "The hitherto accepted order places the Esdras
          gola in the seventh year of Artaxerxes (458 B.C.), and hence before
          the appointment of Nehemias ... But several exegetes have recently
          advanced strong reasons for reversing this order."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        date:
          precision: year
          from: {year: 458, era: bc}
          label: "the seventh year of Artaxerxes (458 B.C.)"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) writes: "In 458, under Artaxerxes I, Esdras came to
          Jerusalem with 1500 Jews as governor of Judea and completed the
          political and religious restoration of Israel."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        date:
          precision: year
          from: {year: 458, era: bc}
          label: "In 458, under Artaxerxes I"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) writes: "But it is commonly held that Esdras returned in 457 and
          Nehemias in 444 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Howlett's own hedge, "it is commonly held", is his and is kept; the
          same paragraph records Van Hoonacker's contrary view. This is one year
          from the 458 printed in two other articles.
        date:
          precision: year
          from: {year: 457, era: bc}
          label: "it is commonly held that Esdras returned in 457"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Charles Souvay's article "Esdras" (Catholic Encyclopedia, New York,
          1909) sets out the two rival orders: "The former view holds that
          Esdras came to Jerusalem about 458 B.C., and Nehemias first in 444 and
          the second time about 430 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        note: >-
          The article's own "about" is kept, and it deliberately leaves the
          question open.
        date:
          precision: approximate-year
          from: {year: 458, era: bc}
          label: "about 458 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same article gives the opposite opinion in the same sentence:
          "whereas, according to the opposite opinion, Esdras's mission might
          have taken place as late as 397 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        note: >-
          Sixty-one years from the same article's other figure. The hedge
          "might have taken place as late as" is the article's and is not
          resolved into an exact year here.
        date:
          precision: approximate-year
          from: {year: 397, era: bc}
          label: "might have taken place as late as 397 B.C."

  - id: israel.restoration.nehemias-mission
    title: The mission of Nehemias and the restoration of the Holy City
    note: >-
      Scripture dates the commission to "the month of Nisan, in the twentieth
      year of Artaxerxes the king" (2 Esdras 2:1), and the identity of that
      Artaxerxes is disputed in the same articles that dispute Esdras's.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) writes: "But it is commonly held that Esdras returned in 457 and
          Nehemias in 444 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Souvay's "Esdras" gives the same 444 for Nehemias's first mission.
          Howlett's hedge, "it is commonly held", is his.
        date:
          precision: year
          from: {year: 444, era: bc}
          label: "Nehemias in 444 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Souvay's "Esdras" (Catholic Encyclopedia, New York, 1909) places the
          first mission with the same figure: "Nehemias first in 444 and the
          second time about 430 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        date:
          precision: year
          from: {year: 444, era: bc}
          label: "Nehemias first in 444"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) dates the mission only by an interval from Esdras's:
          "Thirteen years later Nehemias, with the authorization of Artaxerxes,
          completely restored the Holy City."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          The article prints no year for Nehemias, and this corpus computes none
          from its 458 for Esdras; the interval is recorded as the interval it
          is.
        date:
          precision: relative
          relative:
            of: israel.restoration.esdras-return
            statement: Thirteen years later
          label: "Thirteen years later"

  - id: israel.restoration.nehemias-second-mission
    title: The second mission of Nehemias
    parent: israel.restoration.nehemias-mission
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Souvay's "Esdras" (Catholic Encyclopedia, New York, 1909) distinguishes
          the two: "Nehemias first in 444 and the second time about 430 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        note: >-
          The article's own "about" is kept, and the whole ordering it belongs
          to is one of two the article declines to choose between.
        date:
          precision: approximate-year
          from: {year: 430, era: bc}
          label: "the second time about 430 B.C."

  - id: israel.maccabees.seleucid-era
    title: "The Seleucid era, 'the kingdom of the Greeks'"
    note: >-
      The era by which 1 and 2 Machabees date their events. This corpus records
      Seleucid year-numbers as the books print them and converts none of them.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Florentine Bechtel's "The Books of Machabees" (Catholic Encyclopedia,
          New York, 1910) writes: "The more important events are carefully dated
          according to the Seleucid era, which began with the autumn of 312
          B.C." Howlett's "Biblical Chronology" likewise says the chief events
          of 1 Machabees "are dated according to the Seleucid Era, 312 B.C."
        sources:
          - artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09495a-6afd1136
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
        note: >-
          Bechtel adds the warning that governs every Seleucid date in these two
          books: "the author begins the year with spring (the month Nisan),
          whereas the author of II Mach. begins it with autumn (the month
          Tishri). By reason of this difference some of the events are dated a
          year later in the second than in the first book." No Seleucid year is
          converted to B.C. here.
        date:
          precision: year
          from: {year: 312, era: bc}
          label: "the Seleucid era, which began with the autumn of 312 B.C."

  - id: israel.maccabees.antiochus-accession
    title: The accession of Antiochus IV Epiphanes
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 1:11 dates the accession by the
          Seleucid era: "And there came out of them a wicked root, Antiochus the
          Illustrious ... and he reigned in the hundred and thirty-seventh year
          of the kingdom of the Greeks."
        sources: [bible:douay-rheims:1Mach.1.11]
        note: >-
          "The kingdom of the Greeks" is the Seleucid era. The year-number is
          recorded as printed; converting it would require carrying Bechtel's
          warning that 1 and 2 Machabees begin their years in different seasons.
        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: >-
              in the hundred and thirty-seventh year of the kingdom of the
              Greeks
          label: "in the hundred and thirty-seventh year of the kingdom of the Greeks"

  - id: israel.maccabees.temple-plundered
    title: Antiochus's plundering of the Temple
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 1:21-23 dates the plundering by
          the Seleucid era: "And after Antiochus had ravaged Egypt, in the
          hundred and forty-third year, he returned and went up against Israel
          ... And he proudly entered into the sanctuary, and took away the
          golden altar, and the candlestick of light, and all the vessels
          thereof."
        sources:
          - bible:douay-rheims:1Mach.1.21
          - bible:douay-rheims:1Mach.1.22
          - bible:douay-rheims:1Mach.1.23
        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: in the hundred and forty-third year
          label: "in the hundred and forty-third year"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Meistermann's "Temple of Jerusalem" (Catholic Encyclopedia, New York,
          1912) writes: "In 168 B.C. the precious metals adorning the Temple
          aroused the covetousness of Antiochus Epiphanes, who 'took away the
          golden altar, and the candlestick of light, and all the vessels
          thereof'".
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14499a-82b12b6e]
        note: >-
          Scripture itself dates this to Seleucid year 143, and the corpus does
          not present the two as one another's conversion.
        date:
          precision: year
          from: {year: 168, era: bc}
          label: "In 168 B.C."

  - id: israel.maccabees.abomination-of-desolation
    title: The setting up of the abomination of desolation upon the altar
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 1:57 dates the profanation to the
          day: "On the fifteenth day of the month, Casleu, in the hundred and
          forty-fifth year, king Antiochus set up the abominable idol of
          desolation upon the altar of God."
        sources: [bible:douay-rheims:1Mach.1.57]
        note: >-
          This is the terminus that 1 Machabees 4:52-54 measures the
          rededication against, three years later to the day.
        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: >-
              on the fifteenth day of the month, Casleu, in the hundred and
              forty-fifth year
          label: >-
            On the fifteenth day of the month, Casleu, in the hundred and
            forty-fifth year

  - id: israel.maccabees.rising-under-mathathias
    title: The rising under Mathathias
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) narrates the book's contents with dates: "Then comes an account
          of the rising under Mathathias, in 167, and his death. Next followed
          his son Judas who continued the struggle till he died in 161."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          No "B.C." is printed on these bare numbers; the article's context is
          B.C. throughout. Meistermann's Jerusalem article instead dates
          Mathathias's death to 166, one year later than Howlett's rising.
        date:
          precision: year
          from: {year: 167, era: bc}
          label: "the rising under Mathathias, in 167"

  - id: israel.maccabees.mathathias-death
    title: The death of Mathathias
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Florentine Bechtel's "The Machabees" (Catholic Encyclopedia, New York,
          1910) writes of Mathathias: "He died, however, within a year (166
          B.C.). At his death he exhorted his sons to carry on the fight for
          their religion, and appointed Judas". Meistermann's "Jerusalem (Before
          A.D. 71)" agrees, writing of "Judas, succeeding on the death of his
          father (166)".
        sources:
          - artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09493b-376c059b
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662
        note: >-
          Meistermann prints the bare "(166)" without "B.C."; his context is
          B.C. throughout. Driscoll's "Judas Machabeus" instead dates Judas's
          designation by his dying father to 167.
        date:
          precision: year
          from: {year: 166, era: bc}
          label: "He died, however, within a year (166 B.C.)"

  - id: israel.maccabees.judas-leadership
    title: The leadership of Judas Machabeus
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          James F. Driscoll's "Judas Machabeus" (Catholic Encyclopedia, New
          York, 1910) opens: "Judas was designated by his dying father as the
          new leader of the band of guerrilla warriors in year 167 B.C., and he
          remained in command until the year 161."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08541a-c5cd9fc4]
        note: >-
          Howlett's "Biblical Chronology" likewise says Judas "died in 161",
          while Meistermann's Jerusalem article puts his succession at 166, a
          year later than Driscoll's 167.
        date:
          precision: range
          from: {year: 167, era: bc}
          to: {year: 161, era: bc}
          label: "in year 167 B.C. ... until the year 161"

  - id: israel.maccabees.temple-rededication
    title: The rededication of the Temple by Judas Machabeus
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 4:52-54 dates the rededication to
          the day by the Seleucid era: "they arose before the morning on the
          five and twentieth day of the ninth month, (which is the month of
          Casleu) in the hundred and forty-eighth year ... According to the
          time, and according to the day wherein the heathens had defiled it, in
          the same was it dedicated anew."
        sources:
          - bible:douay-rheims:1Mach.4.52
          - bible:douay-rheims:1Mach.4.53
          - bible:douay-rheims:1Mach.4.54
        note: >-
          Bechtel's "The Machabees" says only that "The temple was cleansed and
          rededicated on the day on which three years before it had been
          profaned", giving no year, and Driscoll's "Judas Machabeus" describes
          the eight-day feast without one either.
        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: >-
              the five and twentieth day of the ninth month, the month of
              Casleu, in the hundred and forty-eighth year
          label: >-
            the five and twentieth day of the ninth month, (which is the month
            of Casleu) in the hundred and forty-eighth year
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) attaches a year in passing: "Judas, succeeding on the
          death of his father (166), gained four victories over the Syrian
          armies, occupied Jerusalem (164), purified the Temple, strengthened
          the fortifications, and erected a new altar of holocausts."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          Thinly attested: this is the only sentence inspected for this lane
          that attaches a B.C. year to the rededication, "B.C." is not printed
          on the bare number, and the year is attached to the occupation of
          Jerusalem in a list of which the purification is the next item.
        date:
          precision: year
          from: {year: 164, era: bc}
          label: "occupied Jerusalem (164), purified the Temple"

  - id: israel.maccabees.feast-of-dedication
    title: The annual feast of the Dedication
    parent: israel.maccabees.temple-rededication
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 4:59 institutes a recurring
          observance: "that the day of the dedication of the altar should be
          kept in its season from year to year for eight days, from the five and
          twentieth day of the month of Casleu". 2 Machabees 10:5 names the same
          day: "on the five and twentieth day of the month of Casleu".
        sources:
          - bible:douay-rheims:1Mach.4.59
          - bible:douay-rheims:2Mach.10.5
        note: >-
          A recurring liturgical day, not a one-time year, which is why no year
          is recorded. Casleu is the ninth month, as 1 Machabees 4:52 states,
          and the endpoint is written in the Hebrew calendar. 2 Machabees
          reckons its year from Tishri and 1 Machabees from Nisan, so the two
          books' year-numbers for one event can differ by one; the day does not.
        date:
          precision: month-day
          from: {month: 9, day: 25, calendar: hebrew}
          label: "from the five and twentieth day of the month of Casleu"

  - id: israel.maccabees.simon-rule
    title: The rule of Simon Machabeus
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) closes its account of 1 Machabees: "Simon was made ruler in 141,
          was murdered in 135, and was succeeded by his son John Hyrcanus in the
          same year."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          No "B.C." is printed on these bare numbers; the article's context is
          B.C. throughout. The same article says 1 Machabees "gives information
          about the period 174-135", where Bechtel's "The Books of Machabees"
          gives 175-135 B.C. for the same book.
        date:
          precision: range
          from: {year: 141, era: bc}
          to: {year: 135, era: bc}
          label: "Simon was made ruler in 141, was murdered in 135"
