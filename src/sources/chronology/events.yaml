  - id: israel.divided-kingdom.division
    title: "The division of the kingdom: the revolt of the Ten Tribes"
    note: >-
      Scripture reports the revolt without a year. 3 Kings 12:19-20 says only
      that "Israel revolted from the house of David, unto this day", and that
      the assembly "made him king over all Israel", so no date is authored from
      that locus.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) names the received figure while arguing against it: "We have
          fixed roughly the date of the revolt of the Ten Tribes for the year
          936 B.C. But the traditional date is 975, and if we follow the dates
          for the kings down to the taking of Samaria, it will be found that the
          usual interpretation of the Biblical chronology makes those dates
          about 40 years earlier than is possible according to the Assyrian
          chronological canon."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Preferred not by authority rank, which every claim here shares, but
          because the article itself names this figure "the traditional date"
          while the competing figures are its author's own reconstruction from
          the Assyrian canon, which this profile does not admit as an authority.
          The Petavius table independently sets Roboam at B.C. 975.
        date:
          precision: year
          from: {year: 975, era: bc}
          label: "the traditional date is 975"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Petavius table reproduced in Sloet's "Chronology of the Kings"
          (Catholic Encyclopedia, New York, 1910) sets "Roboam" against "B.C.
          975" in the Juda column, immediately after the Building of the Temple
          at 1012.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          The table gives Roboam's accession year, which in this scheme is the
          year of the revolt. Table extraction; re-verify against a page image.
        date:
          precision: year
          from: {year: 975, era: bc}
          label: "B.C. 975"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The same sentence of Howlett's "Biblical Chronology" states his own
          conclusion: "We have fixed roughly the date of the revolt of the Ten
          Tribes for the year 936 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Howlett's own figure, reached by preferring the Assyrian chronological
