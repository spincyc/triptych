          Gentile converts (Acts 13:13 - 14:24)."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08537a-e2154141]
        note: >-
          The article states the window, not where in it the foundations fall.
          It is the same span the "St. Paul" article gives for the first mission
