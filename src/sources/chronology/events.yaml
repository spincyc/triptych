  # === lane kings ===
  # --- Samuel, Heli and the ark (1 Kings 1-7) -------------------------------
  - id: israel.judges.samuel-at-silo
    title: The birth of Samuel and his childhood ministry at Silo under Heli
    parent: israel.judges.period
    note: >-
      No source inspected for this lane attaches an Anno Mundi or a B.C. year to
      Samuel's birth. The Catholic Encyclopedia's article on Saul, read in full
      for this lane, calls Samuel "the last of the great Judges of Israel" and
      prints no date of any kind; its article on the First and Second Books of
      Kings dates the writing and not the events. What Scripture does state is
      the containing tenure, and that is what is recorded here.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims places the whole episode inside Heli's tenure at
          Silo. 1 Kings (1 Samuel) 1:3, "And this man went up out of his city
          upon the appointed days, to adore and to offer sacrifice to the Lord
          of hosts in Silo. And the two sons of Heli, Ophni and Phinees, were
          there priests of the Lord."; 1:20, "And it came to pass when the time
          was come about, Anna conceived and bore a son, and called his name
          Samuel: because she had asked him of the Lord."; and 2:11, "but the
          child ministered in the sight of the Lord before the face of Heli the
          priest."
        sources:
          - bible:douay-rheims:1Kings.1.3
          - bible:douay-rheims:1Kings.1.20
          - bible:douay-rheims:1Kings.2.11
        note: >-
          Containment, not an interval and not a year. The forty years of
          1 Kings 4:18 are Heli's whole judgeship; the text nowhere says how far
          into them Samuel was born, and this corpus does not supply a figure.
          The recurring "appointed days" and "every year" of 1:3, 1:7 and 2:19
          are a yearly observance, not a chronological anchor.
        date:
          precision: relative
          relative:
            of: israel.judges.heli-judgeship
            statement: >-
              the two sons of Heli, Ophni and Phinees, were there priests of
              the Lord ... the child ministered in the sight of the Lord
              before the face of Heli the priest
          label: "in the days when the two sons of Heli were priests of the Lord in Silo"

  - id: israel.judges.call-of-samuel
    title: The call of Samuel in the temple at Silo
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Kings (1 Samuel) 3:1-2 sets the call inside
          Heli's tenure and at the end of it: "Now the child Samuel ministered
          to the Lord before Heli, and the word of the Lord was precious in
          those days, there was no manifest vision. And it came to pass one day
          when Heli lay in his place, and his eyes were grown dim, that he could
          not see."
        sources:
          - bible:douay-rheims:1Kings.3.1
          - bible:douay-rheims:1Kings.3.2
        note: >-
          "In those days" and "one day" are the only temporal words the passage
          carries, and neither is a date. Heli's failing sight at 3:2 is repeated
          at 4:15, where he is "ninety and eight years old"; the corpus does not
          turn that into an interval, because the text does not say how long
          stood between the two notices.
        date:
          precision: relative
          relative:
            of: israel.judges.heli-judgeship
            statement: >-
              Now the child Samuel ministered to the Lord before Heli ... And
              it came to pass one day when Heli lay in his place, and his eyes
              were grown dim
          label: "Now the child Samuel ministered to the Lord before Heli"

  - id: israel.judges.capture-of-the-ark
    title: The defeat at Aphec and the taking of the ark of God
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims joins the taking of the ark to the last day of Heli's
          judgeship. 1 Kings (1 Samuel) 4:11, "And the ark of God was taken: and
          the two sons of Heli, Ophni and Phinees, were slain."; 4:12, "And there
          ran a man of Benjamin out of the army, and came to Silo the same day";
          and 4:18, where Heli, hearing it, "fell from his stool backwards by the
          door, and broke his neck and died. For he was an old man, and far
          advanced in years: And he judged Israel forty years."
        sources:
          - bible:douay-rheims:1Kings.4.11
          - bible:douay-rheims:1Kings.4.12
          - bible:douay-rheims:1Kings.4.18
        note: >-
          The forty years are Heli's, not the ark's, and the text states only
          that the news reached Silo "the same day" and that Heli died on
          hearing it. So the capture closes the forty years; it is not dated to
          any year of them, and no era figure is asserted here.
        date:
          precision: relative
          relative:
            of: israel.judges.heli-judgeship
            statement: >-
              And the ark of God was taken ... And when he had named the ark
              of God, he fell from his stool backwards by the door, and broke
              his neck and died
          label: "on the day the ark of God was taken, at the close of Heli's judgeship"

  - id: israel.judges.ark-among-the-philistines
    title: The seven months of the ark in the land of the Philistines
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Kings (1 Samuel) 6:1 states the length
          outright: "Now the ark of God was in the land of the Philistines seven
          months." The stay begins at 5:1, "And the Philistines took the ark of
          God, and carried it from the Stone of help into Azotus."
        sources:
          - bible:douay-rheims:1Kings.5.1
          - bible:douay-rheims:1Kings.6.1
        note: >-
          A duration. It runs from the capture, which itself carries no era
          figure, so nothing here yields a year. The seven months run from Azotus
          through Geth and Accaron to the sending back by the kine to Bethsames,
          and end where the twenty years at Cariathiarim begin.
        date:
          precision: duration
          duration:
            months: 7
            statement: the ark of God was in the land of the Philistines seven months
          label: "Now the ark of God was in the land of the Philistines seven months"

  - id: israel.judges.victory-at-maspha
    title: "Samuel's assembly at Maspha and the deliverance from the Philistines"
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims sets the assembly in the twentieth year of the ark's
          abode at Cariathiarim, the year already held as an event by this
          corpus. 1 Kings (1 Samuel) 7:2, "from the day the ark of the Lord abode
          in Cariathiarim, days were multiplied (for it was now the twentieth
          year) and all the house of Israel rested, following the Lord"; and 7:3,
          which follows straight upon it, "And Samuel spoke to all the house of
          Israel, saying: If you turn to the Lord with all your heart, put away
          the strange gods from among you".
        sources:
          - bible:douay-rheims:1Kings.7.2
          - bible:douay-rheims:1Kings.7.3
        note: >-
          The twentieth year is counted from the ark's arrival at Cariathiarim
          and from no era. 7:13-14 says the Philistines "did not come any more
          into the borders of Israel ... all the days of Samuel", which is a
          statement about the rest of Samuel's life and not a further date for
          this assembly.
        date:
          precision: relative
          relative:
            of: israel.judges.ark-at-cariathiarim
            statement: >-
              from the day the ark of the Lord abode in Cariathiarim, days
              were multiplied (for it was now the twentieth year) and all the
              house of Israel rested, following the Lord
          label: "for it was now the twentieth year"

  # --- The demand for a king and Saul (1 Kings 8-12) ------------------------
  - id: israel.monarchy.demand-for-a-king
    title: The elders of Israel ask Samuel for a king
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims dates the demand by Samuel's age. 1 Kings (1 Samuel)
          8:1, "And it came to pass, when Samuel was old, that he appointed his
          sons to be judges over Israel."; and 8:5, "Behold thou art old, and thy
          sons walk not in thy ways: make us a king, to judge us, as all nations
          have." James Driscoll's "Saul" in the Catholic Encyclopedia (New York,
          1912) narrates the same occasion in the same terms: "The prophet
          Samuel, who is counted as the last of the great Judges of Israel, was
          growing old and the administration of civic and religious affairs had
          been confided to his sons."
        sources:
          - bible:douay-rheims:1Kings.8.1
          - bible:douay-rheims:1Kings.8.5
          - artifact.catholic-encyclopedia.volume-13.new-york-1912.newadvent-13486d-f838ad5f
        note: >-
          The Catholic Encyclopedia's article on Saul was read in full for this
          lane and contains no date of any kind, in any era; it is cited here for
          its placing of the demand in Samuel's old age and for nothing else.
          Samuel's old age is a point in the period of the judges and not a year,
          and the corpus does not convert it into one.
        date:
          precision: relative
          relative:
            of: israel.judges.period
            statement: >-
              when Samuel was old, that he appointed his sons to be judges
              over Israel
          label: "when Samuel was old"

  - id: israel.monarchy.anointing-of-saul
    title: Saul's search for the asses and his anointing by Samuel in private
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims puts the private anointing before the public election
          by lot. 1 Kings (1 Samuel) 10:1, "And Samuel took a little vial of oil,
          and poured it upon his head, and kissed him, and said: Behold, the Lord
          hath anointed thee to be prince over his inheritance"; and 10:17, which
          opens the next scene, "And Samuel called together the people to the
          Lord in Maspha".
        sources:
          - bible:douay-rheims:1Kings.10.1
          - bible:douay-rheims:1Kings.10.17
        note: >-
          Order, not interval: Scripture says the anointing came first and gives
          no length of time between it and Maspha. The "three days ago" of 9:20
          measures how long the asses had been lost and dates nothing else. James
          Driscoll's "Saul" in the Catholic Encyclopedia narrates the anointing
          and then says "A month after these events the newly-chosen king, who
          had hitherto refrained from asserting his royal prerogatives, justifies
          his election by defeating the Ammonites and delivering Jabes Galaad" —
          which would measure the month from this episode, where 1 Kings 11:1
          measures it from Maspha. The two are not harmonised here, and neither
          is offered as a rival claim, because "these events" in the article has
          no determinate antecedent.
        date:
          precision: relative
          relative:
            of: israel.monarchy.saul-accession
            statement: >-
              the Lord hath anointed thee to be prince over his inheritance
              ... And Samuel called together the people to the Lord in Maspha
          label: "Behold, the Lord hath anointed thee to be prince over his inheritance"

  - id: israel.monarchy.deliverance-of-jabes-galaad
    title: "Saul's defeat of Naas the Ammonite and the deliverance of Jabes Galaad"
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Kings (1 Samuel) 11:1 dates it by an
          interval from what precedes: "And it came to pass about a month after
          this, that Naas, the Ammonite, came up, and began to fight against
          Jabes Galaad."
        sources: [bible:douay-rheims:1Kings.11.1]
        note: >-
          The month runs from the election by lot at Maspha, which is the scene
          immediately before it, and the sacred text's own "about" is kept. The
          renewal of the kingdom at Galgal (11:14-15) belongs to the same event
          this date is measured from and follows the deliverance, so the anchor
          spans this episode on both sides. James Driscoll's "Saul" in the
          Catholic Encyclopedia gives the same month — "A month after these
          events ... he justifies his election by defeating the Ammonites and
          delivering Jabes Galaad" — but appears to count it from the private
          anointing instead; the difference is recorded and not resolved.
        date:
          precision: relative
          relative:
            of: israel.monarchy.saul-accession
            statement: about a month after the people were called together to the Lord in Maspha
          label: "about a month after this"

  # --- Saul's death and the house of Saul (1 Kings 31; 2 Kings 1-4) ---------
  - id: israel.monarchy.death-of-saul
    title: The battle of Gelboe and the death of Saul and his sons
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims closes the reign with the battle. 1 Kings (1 Samuel)
          31:6, "So Saul died, and his three sons, and his armourbearer, and all
          his men that same day together."; and 1 Paralipomenon 10:14, "And
          trusted not in the Lord: therefore he slew him, and transferred his
          kingdom to David the son of Isai."
        sources:
          - bible:douay-rheims:1Kings.31.6
          - bible:douay-rheims:1Par.10.14
        note: >-
          The terminus of the reign, on the day of the battle in mount Gelboe.
          No era figure attaches to it in any source inspected for this lane: the
          Catholic Encyclopedia's article on Saul carries no date at all, and the
          only figure this corpus holds for the founding of the monarchy is
          Howlett's 1020 B.C., which it does not display first. The length of the
          reign is the notorious 1 Kings 13:1, already held apart under the reign
          itself.
        date:
          precision: relative
          relative:
            of: israel.monarchy.saul-reign
            statement: >-
              So Saul died, and his three sons, and his armourbearer, and all
              his men that same day together
          label: "So Saul died, and his three sons ... that same day together"

  - id: israel.monarchy.news-of-sauls-death
    title: "The news of Saul's death brought to Siceleg, and David's lamentation"
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Kings (2 Samuel) 1:1-2 counts the days:
          "Now it came to pass, after Saul was dead, that David returned from the
          slaughter of the Amalecites, and abode two days in Siceleg. And on the
          third day, there appeared a man who came out of Saul's camp, with his
          garments rent, and dust strewed on his head".
        sources:
          - bible:douay-rheims:2Kings.1.1
          - bible:douay-rheims:2Kings.1.2
        note: >-
          The two days are counted from David's return to Siceleg, and the third
          day from the same point; the text does not say how many days stood
          between the battle in Gelboe and that return, so the interval from
          Saul's death itself is not stated and is not supplied here.
        date:
          precision: relative
          relative:
            of: israel.monarchy.death-of-saul
            statement: >-
              after Saul was dead, that David returned from the slaughter of
              the Amalecites, and abode two days in Siceleg. And on the third
              day, there appeared a man who came out of Saul's camp
          label: "and abode two days in Siceleg. And on the third day"

  - id: israel.monarchy.isboseth-reign
    title: The two years of Isboseth over Israel and the war with the house of David
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Kings (2 Samuel) 2:10-11 states both reigns
          together: "Isboseth the son of Saul was forty years old when he began
          to reign over Israel, and he reigned two years; and only the house of
          Juda followed David. And the number of the days that David abode,
          reigning in Hebron over the house of Juda, was seven years and six
          months."
        sources:
          - bible:douay-rheims:2Kings.2.10
          - bible:douay-rheims:2Kings.2.11
        note: >-
          Two years set beside seven years and six months in one breath, and the
          sacred text reconciles them nowhere; neither does this corpus. 2 Kings
          3:1 calls the intervening struggle "a long war between the house of
          Saul and the house of David" and gives it no length. John Corbett's
          "King David" in the Catholic Encyclopedia (New York, 1908) reports the
          longer figure without the shorter — "His reign at Hebron over Juda
          alone had lasted seven years and a half" — and offers no reckoning of
          Isboseth's two years against it.
        date:
          precision: duration
          duration:
            years: 2
            statement: >-
              he reigned two years over Israel, while David reigned in Hebron
              over the house of Juda seven years and six months
          label: "he reigned two years"

  # --- David: birth and the numbering of the people -------------------------
  - id: israel.monarchy.birth-of-david
    title: The birth of David at Bethlehem
    note: >-
      The one year any source inspected for this lane prints for David's birth.
      It is a rank-6 witness reporting what it calls "the usual chronology", and
      it is recorded with that hedge and with the article's own caveat against
      it. Being the only figure is not a reason to prefer it, which is why its
      disposition is `disputed` and not `preferred`.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          John Corbett's "King David" in the Catholic Encyclopedia (New York,
          1908) opens its account with the figure: "According to the usual
          chronology, David was born in 1085 and reigned from 1055 to 1015 B.C.
          Recent writers have been induced by the Assyrian inscriptions to date
          his reign from 30 to 50 years later."
        sources: [artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04642b-f1c0bed3]
        note: >-
          "According to the usual chronology" is the article's own qualification
          and is kept. Corbett does not assert 1085 in his own voice: he reports
          a received reckoning and immediately names a competing one, which is
          the same shape as a figure attributed to Klaproth or to "some few
          Catholic writers" and differs only in that the other voice is
          unnamed. That is why this claim is `disputed`.

          The disposition also has to agree with itself across the corpus. The
          reign figures in the very same sentence, 1055 to 1015 B.C., agree with
          the Petavius table, and this corpus already holds that reckoning as
          one of three `disputed` claims for David's accession. Preferring the
          birth on a reckoning whose accession the corpus refuses to prefer
          would have made the two entries disagree about one sentence. This
          entry settles neither dispute, and is not adjusted by the article's
          remark that recent writers would move the reign 30 to 50 years
          later. The corpus derives nothing
          from 1085 and 2 Kings 5:4's "thirty years old" together; that
          subtraction is not made in any source inspected here.
        date:
          precision: year
          from: {year: 1085, era: bc}
          label: "According to the usual chronology, David was born in 1085"

  - id: israel.monarchy.numbering-of-the-people
    title: "David's numbering of Israel and Juda, and the pestilence"
    parent: israel.monarchy.david-reign
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Kings (2 Samuel) 24:8 gives the census its
          own length: "And having gone through the whole land, after nine months
          and twenty days, they came to Jerusalem." 1 Paralipomenon 27:24 records
          that it was broken off: "Joab the son of Sarvia began to number, but he
          finished not: because upon this there fell wrath upon Israel."
        sources:
          - bible:douay-rheims:2Kings.24.8
          - bible:douay-rheims:1Par.27.24
        note: >-
          A duration inside the reign of David and not a year of any era. The
          three days of pestilence at 2 Kings 24:13-15 are a separate figure and
          are not added to the nine months and twenty days here. John Corbett's
          "King David" in the Catholic Encyclopedia narrates the census and the
          pestilence and attaches no date to either, saying of the neighbouring
          famine only that "It is not possible to fix the exact date of the
          famine."
        date:
          precision: duration
          duration:
            months: 9
            days: 20
            statement: >-
              having gone through the whole land, after nine months and twenty
              days, they came to Jerusalem
            within: israel.monarchy.david-reign
          label: "after nine months and twenty days"
  # === lane numbers ===
  - id: israel.wilderness.encampment-at-sinai
    title: The encampment of Israel in the desert of Sinai
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          A derived span, not a source's own figure. Scripture dates both of its
          ends and this corpus already holds each as an event: Exodus 19:1, "In
          the third month of the departure of Israel out of the land of Egypt,
          on this day they came into the wilderness of Sinai", and Numbers
          10:11-12, "The second year, in the second month, the twentieth day of
          the month, the cloud was taken up from the tabernacle of the covenant.
          And the children of Israel marched by their troops from the desert of
          Sinai, and the cloud rested in the wilderness of Pharan." The
          encampment is the stretch between the two, and it is the
          occasion in which Numbers 1:1 - 10:10 stands: Numbers 1:1 speaks "in
          the desert of Sinai", Numbers 9:1 again "in the desert of Sinai", and
          Numbers 10:12 is the marching out of it.
        sources:
          - bible:douay-rheims:Ex.19.1
          - bible:douay-rheims:Num.1.1
          - bible:douay-rheims:Num.9.1
          - bible:douay-rheims:Num.10.11
        note: >-
          Recorded as relative because both ends are counted from the Exodus and
          neither is a year of any era. The span is a project derivation and is
          marked as one: no source inspected for this corpus prints it as a
          single figure, and it must never be read as one. It dates the
          encampment, not any particular law given in it - the divine speeches
          of Numbers 5, 6, 8 and 10:1-10 carry no date of their own beyond
          standing inside this stretch, and none is supplied for them.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "from the third month of the departure of Israel out of the land of Egypt until the second year, in the second month, the twentieth day of the month"
          label: "from the third month of the departure until the second year, the second month, the twentieth day of the month"
          derivation:
            rule: >-
              The span between two points Scripture dates in the era of the
              departure from Egypt, the arrival in the wilderness of Sinai and
              the marching out of it, taken as the extent of the encampment
              between them. No arithmetic is performed and no year of any era
              is produced.
            inputs:
              - israel.wilderness.arrival-at-sinai
              - israel.wilderness.departure-from-sinai
            note: >-
              Both inputs are themselves relative to israel.exodus.the-exodus,
              so the derived span is relative too. Nothing here converts the
              interval into months or into an Anno Mundi or Christian-era
              figure.
  - id: israel.wilderness.numbering-at-sinai
    title: The numbering of Israel in the desert of Sinai
    parent: israel.wilderness.encampment-at-sinai
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Numbers opens with its own dateline. Numbers 1:1 in the Douay-Rheims:
          "And the Lord spoke to Moses in the desert of Sinai in the tabernacle
          of the covenant, the first day of the second month, the second year of
          their going out of Egypt, saying:" - and the command that dateline
          carries is the next verse, Numbers 1:2, "Take the sum of all the
          congregation of the children of Israel by their families, and houses,
          and the names of every one, as many as are of the male sex". Numbers
          1:18 dates the execution to the
          same day: Moses and Aaron "assembled them on the first day of the
          second month, reckoning them up by the kindreds, and houses, and
          families, and heads, and names of every one from twenty years old and
          upward", and 1:19 adds "And they were numbered in the desert of
          Sinai."
        sources:
          - bible:douay-rheims:Num.1.1
          - bible:douay-rheims:Num.1.18
        note: >-
          Recorded as relative rather than as a month and a day because the
          second year is counted from the going out of Egypt and is not a year
          of any era, exactly as the erection of the tabernacle is recorded from
          Exodus 40:15. The command and the assembling fall on one day; the
          numbering of the Levites that follows at Numbers 3:14-16 and 4:1-3 is
          commanded "in the desert of Sinai" without a further date, and none is
          supplied for it. Numbers 26:64 looks back to this numbering as the one
          made "by Moses and Aaron in the desert of Sinai".
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "the first day of the second month, the second year of their going out of Egypt"
          label: "the first day of the second month, the second year of their going out of Egypt"
  - id: israel.wilderness.dedication-of-the-altar
    title: The offerings of the princes at the dedication of the altar
    parent: israel.wilderness.encampment-at-sinai
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Numbers 7:1 dates the chapter by the day the tabernacle was set up -
          "And it came to pass in the day that Moses had finished the
          tabernacle, and set it up, and had anointed and sanctified it with all
          its vessels, the altar likewise and all the vessels thereof," the
          sentence running on into the offering of the princes at 7:2. That day
          is the one Exodus 40:15 dates, "the first month of the second year,
          the first day of the month", which this corpus holds as the erection
          of the tabernacle.
        sources:
          - bible:douay-rheims:Num.7.1
          - bible:douay-rheims:Num.7.10
          - bible:douay-rheims:Ex.40.15
        note: >-
          The offering is not confined to one day. Numbers 7:11 has the Lord
          say "Let each of the princes one day after another offer their gifts
          for the dedication of the altar", and twelve princes follow in order,
          so the chapter runs twelve days from the day it is dated by; Numbers
          7:10 and 7:84 nevertheless speak of "the day when it was anointed"
          and "the day wherein it was consecrated". The corpus keeps the datum
          the text gives - the opening day - and does not compute the closing
          one. This day falls in the first month of the second year and the
          dateline of Numbers 1:1 falls in the second month of the same year, so
          the chapter stands before the book's opening date; the distance
          between them is not stated here, because crossing from one month into
          the next would require a month length no source inspected for this
          corpus states. Numbers is not arranged in the order of its own dates
          and this corpus does not rearrange it.
        date:
          precision: relative
          relative:
            of: israel.wilderness.erection-of-the-tabernacle
            statement: "in the day that Moses had finished the tabernacle, and set it up, and had anointed and sanctified it with all its vessels"
          label: "in the day that Moses had finished the tabernacle, and set it up"
  - id: israel.wilderness.phase-in-the-desert-of-sinai
    title: The phase kept in the desert of Sinai in the second year
    parent: israel.wilderness.encampment-at-sinai
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Numbers 9:1-3 in the Douay-Rheims: "The Lord spoke to Moses in the
          desert of Sinai, the second year after they were come out of the land
          of Egypt, in the first month, saying: Let the children of Israel make
          the phase in its due time, The fourteenth day of this month in the
          evening." Numbers 9:5 records the keeping of it: "And they made it in
          its proper time: the fourteenth day of the month at evening, in mount
          Sinai."
        sources:
          - bible:douay-rheims:Num.9.1
          - bible:douay-rheims:Num.9.3
          - bible:douay-rheims:Num.9.5
          - bible:douay-rheims:Ex.40.15
        note: >-
          The first anniversary of the phase of the departure. Three datelines
          stand around it and the corpus states them rather than reckoning
          between them: the tabernacle was set up on the first day of the first
          month of the second year (Exodus 40:15), the phase was kept on the
          fourteenth day of that month (Numbers 9:3, 9:5), and Numbers 1:1 is
          dated the first day of the second month. No interval is computed
          across them, and crossing from the first month into the second would
          in any case require a month length no source inspected for this corpus
          states. Numbers 9:10-11 then institutes a second phase for the
          unclean and the traveller, "In the second month, on the fourteenth day
          of the month in the evening"; that is a standing ordinance and not an
          event of this year, and no event is authored from it.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "the second year after they were come out of the land of Egypt, in the first month ... The fourteenth day of this month in the evening"
          label: "the second year after they were come out of the land of Egypt, in the first month, the fourteenth day of this month in the evening"
  - id: israel.wilderness.departure-from-sinai
    title: The going forward of Israel from the desert of Sinai
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Numbers 10:11-12 in the Douay-Rheims: "The second year, in the second
          month, the twentieth day of the month, the cloud was taken up from the
          tabernacle of the covenant. And the children of Israel marched by
          their troops from the desert of Sinai, and the cloud rested in the
          wilderness of Pharan." The itinerary of Numbers 33:16 records the same
          removal without a date: "But departing also from the desert of Sinai,
          they came to the graves of lust."
        sources:
          - bible:douay-rheims:Num.10.11
          - bible:douay-rheims:Num.33.16
        note: >-
          Recorded as relative because the second year is counted from the
          Exodus. It is the end of the encampment at Sinai that began in the
          third month of the departure, and it stands in the same second month
          as the dateline of Numbers 1:1, which is the first day of it; the
          corpus states both datelines and computes no interval between them.
          The three days' journey of Numbers 10:33 is measured from
          this removal and is not given a date of its own.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "The second year, in the second month, the twentieth day of the month, the cloud was taken up from the tabernacle of the covenant"
          label: "The second year, in the second month, the twentieth day of the month"
  - id: israel.wilderness.coming-to-cades
    title: The coming into the desert of Sin at Cades, and the death of Mary
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Scripture gives the month and no year. Numbers 20:1 in the
          Douay-Rheims: "And the children of Israel, and all the multitude came
          into the desert of Sin, in the first month: and the people abode in
          Cades. And Mary died there, and was buried in the same place." The
          year is supplied by the Catholic Encyclopedia's "Aaron", which opens
          its account of this stage: "In the first month of the thirty-ninth
          year after the Exodus, the Hebrews camped at Cades, where Mary,
          Aaron's sister, died and was buried."
        sources:
          - bible:douay-rheims:Num.20.1
          - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01003a-5adaeca0
        note: >-
          Rank 1 states the month and is silent on the year, so the year is
          taken from rank 6 and from nowhere else. The encyclopedia's own
          reckoning does not sit quietly beside Scripture's: the same article
          continues that the sentence excluding Moses and Aaron from the land
          "received, four months later, its fulfilment in Aaron's case", which
          on its own figures would put Aaron's death in the fifth month of the
          thirty-ninth year, whereas Numbers 33:38 says he "died in the fortieth
          year of the coming forth of the children of Israel out of Egypt, the
          fifth month, the first day of the month." This corpus records both and
          reconciles neither; the death of Aaron keeps Scripture's fortieth
          year. The waters of contradiction and the embassy to Edom that follow
          at Numbers 20:2-21 stand at this same Cades but carry no date, and
          none is supplied for them.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "In the first month of the thirty-ninth year after the Exodus, the Hebrews camped at Cades"
          label: "the first month of the thirty-ninth year after the Exodus"
  - id: israel.wilderness.mourning-for-aaron
    title: The thirty days' mourning for Aaron
    parent: israel.wilderness.death-of-aaron
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Numbers 20:30 in the Douay-Rheims: "And all the multitude seeing that
          Aaron was dead, mourned for him thirty days throughout all their
          families." The Catholic Encyclopedia's "Aaron" reports the same
          measure at the close of its narrative: "Moses then came down with
          Eleazar and all the multitude mourned for Aaron thirty days."
        sources:
          - bible:douay-rheims:Num.20.30
          - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01003a-5adaeca0
        note: >-
          A length of thirty days from a death this corpus already dates by
          Numbers 33:38, carried as the duration the verse states rather than
          resolved into a month and a day, because adding thirty days to the
          first day of the fifth month would require a month length no source
          inspected here states.
        date:
          precision: duration
          duration:
            days: 30
            statement: "all the multitude seeing that Aaron was dead, mourned for him thirty days throughout all their families"
          label: "thirty days"
  - id: israel.wilderness.encampment-in-the-plains-of-moab
    title: The encampment of Israel in the plains of Moab over against Jericho
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          A derived span, not a source's own figure. Scripture dates neither the
          pitching nor the striking of this camp, but it fixes the camp between
          two points this corpus already holds. Numbers 33 puts it after the
          death of Aaron: "there he died in the fortieth year of the coming
          forth of the children of Israel out of Egypt, the fifth month, the
          first day of the month" (33:38), and then, eleven stations later, "And
          departing from the mountains of Abarim, they passed to the plains of
          Moab, by the Jordan, over against Jericho" (33:48). Deuteronomy 1:3
          finds Israel still there, in the land of Moab beyond the Jordan
          (1:5), when "In the fortieth year, the eleventh month, the first day
          of the month, Moses spoke to the children of Israel all that the Lord
          had commanded him to say to them." Numbers 22:1 is the pitching -
          "And they went forward and encamped in the plains of Moab, over
          against where Jericho is situate beyond the Jordan" - and Numbers
          26:3, 33:50, 35:1 and 36:13 keep the book there to its last verse.
        sources:
          - bible:douay-rheims:Num.22.1
          - bible:douay-rheims:Num.33.38
          - bible:douay-rheims:Num.33.48
          - bible:douay-rheims:Num.36.13
          - bible:douay-rheims:Deut.1.3
        note: >-
          The derivation bounds the encampment; it does not date its beginning.
          Scripture says only that the camp was pitched after the first day of
          the fifth month of the fortieth year and was standing on the first day
          of the eleventh month of the same year, and this corpus states exactly
          that and no more. It is the occasion in which Numbers 22:1 - 36:13
          stands, which is why that stretch is bound to it under
          historical-setting; it dates none of the events narrated there. The
          Catholic Encyclopedia's "Pentateuch" agrees on where the book ends
          without adding a figure of its own: Numbers "takes up the account from
          the first month of the second year, and brings it down to the eleventh
          month of the fortieth year."
        date:
          precision: relative
          relative:
            of: israel.wilderness.death-of-aaron
            statement: "after the death of Aaron on mount Hor in the fortieth year, the fifth month, the first day of the month, and still standing in the fortieth year, the eleventh month, the first day of the month"
          label: "between the fortieth year, fifth month, first day and the fortieth year, eleventh month, first day"
          derivation:
            rule: >-
              An encampment Scripture does not date is bounded by the two dated
              points Scripture places on either side of it: the last dated event
              before the camp is pitched, and the first dated event that finds
              the camp standing. Neither bound is asserted as the date of the
              pitching, and no arithmetic is performed on them.
            inputs:
              - israel.wilderness.death-of-aaron
              - israel.wilderness.moses-final-discourse
            note: >-
              Both inputs are relative to israel.exodus.the-exodus, so the
              bounded span is relative too. The later bound is a Deuteronomy
              datum used only as a bound; nothing here dates any part of
              Deuteronomy from it.
  - id: israel.wilderness.mary-stricken-at-haseroth
    title: The fault of Aaron and Mary at Haseroth, and Mary's leprosy
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Scripture places the episode and dates nothing: Numbers 11:34, "And
          departing from the graves of lust, they came unto Haseroth, and abode
          there", and Numbers 13:1, "And the people marched from Haseroth, and
          pitched their tents in the desert of Pharan", with the fault standing
          between them. The only temporal statement any source inspected for
          this corpus makes about it is the Catholic Encyclopedia's "Aaron": "A
          few months later, when the Hebrews reached Haseroth, the second
          station after Mount Sinai, Aaron fell into a new fault."
        sources:
          - bible:douay-rheims:Num.11.34
          - bible:douay-rheims:Num.12.1
          - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01003a-5adaeca0
        note: >-
          The hedge is the encyclopedia's and is kept: "a few months" is not a
          number of months and is not made into one. The article's "later" is
          measured from the END of the stay at Sinai, not from its beginning:
          the sentence it follows is still at Sinai, on the precepts of
          Leviticus 16, 17, 21 and 22, and the same sentence calls Haseroth
          "the second station after Mount Sinai", counting stations from the
          removal. The anchor is therefore the going forward from Sinai, which
          Numbers 10:11 dates to the second year, the second month, the
          twentieth day. It was formerly israel.wilderness.encampment-at-sinai,
          which this corpus authors as a SPAN beginning in the third month of
          the first year, so "a few months later" read from the anchor's start
          placed Haseroth about a year before the itinerary puts it. Scripture
          supplies no interval whatever, and the itinerary of Numbers 33:16-17
          confirms only the order, desert of Sinai, graves of lust, Haseroth.
          Nothing here dates the murmuring and the quails of Numbers 11:1-34,
          for which no source inspected states any time at all.
        date:
          precision: relative
          relative:
            of: israel.wilderness.departure-from-sinai
            statement: "A few months later, when the Hebrews reached Haseroth, the second station after Mount Sinai"
          label: "A few months later"
  # === lane psalms-1-50 ===
  - id: israel.monarchy.david-delivered-from-his-enemies
    title: David's deliverance from all his enemies and from the hand of Saul
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Kings (2 Samuel) 22:1 names the occasion of
          the canticle: "And David spoke to the Lord the words of this canticle,
          in the day that the Lord delivered him out of the hand of all his
          enemies, and out of the hand of Saul." The superscription of Psalm 17
          (Vulgate; Hebrew 18), which carries the same canticle, asserts the same
          occasion in its own words, Ps 17:1: "Unto the end, for David, the
          servant of the Lord, who spoke to the Lord the words of this canticle,
          in the day that the Lord delivered him from the hand of all his
          enemies, and from the hand of Saul: and he said:"
        sources:
          - bible:douay-rheims:2Kings.22.1
          - bible:douay-rheims:Ps.17.1
        note: >-
          An occasion, not a year. Neither text carries a chronological marker,
          and no source inspected for this lane attaches an Anno Mundi or a B.C.
          figure to the day. The anchor is deliberately the reign as a whole and
          nothing narrower, because the two witnesses do not agree on where in
          the reign the day falls: 2 Kings prints the canticle at chapter 22,
          after the wars of chapters 8 and 10, while the deliverance "out of the
          hand of Saul" belongs to the reign's beginning. This corpus does not
          resolve that, and nothing here may be read as placing the day early or
          late within the reign.
        date:
          precision: relative
          relative:
            of: israel.monarchy.david-reign
            statement: >-
              in the day that the Lord delivered him out of the hand of all
              his enemies, and out of the hand of Saul
          label: >-
            in the day that the Lord delivered him out of the hand of all his
            enemies, and out of the hand of Saul
  - id: israel.monarchy.david-house-built
    title: The building of David's house at Jerusalem
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Kings (2 Samuel) 5 places the building four
          verses after the taking of the stronghold: "But David took the castle
          of Sion, the same is the city of David" (5:7), and then "Hiram the king
          of Tyre sent messengers to David, and cedar trees, and carpenters, and
          masons for walls: and they built a house for David" (5:11). The
          Catholic Encyclopedia's "King David" sets the two in the same order in
          its own voice: "A notable exploit at the beginning of his reign was the
          conquest of the Jebusite city of Jerusalem, which he made the capital
          of his kingdom, 'the city of David', the political centre of the
          nation. He built a palace, took more wives and concubines, and begat
          other sons and daughters."
        sources:
          - bible:douay-rheims:2Kings.5.7
          - bible:douay-rheims:2Kings.5.11
          - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04642b-f1c0bed3
        note: >-
          A sequence, not a year. No source inspected for this lane attaches an
          Anno Mundi or a B.C. figure to the building of the house: the "about
          the year 1058 B.C." this corpus holds dates the capture of the castle
          of Sion and must not be transferred to the house, which is why this
          claim is relative and not absolute. Neither text says how long after
          the capture the house was finished, and the dedication of the house —
          the occasion the title of Psalm 29 (Vulgate; Hebrew 30) names — is a
          further occasion again, which this corpus does not hold and this event
          does not claim to be.
        date:
          precision: relative
          relative:
            of: israel.monarchy.david-capture-of-sion
            statement: >-
              But David took the castle of Sion, the same is the city of David
              ... Hiram the king of Tyre sent messengers to David, and cedar
              trees, and carpenters, and masons for walls: and they built a
              house for David
          label: "and they built a house for David"
  # === lane psalms-51-100 ===
  - id: israel.monarchy.david-in-the-cave
    title: David's flight from Saul into the cave
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The 2014 Loreto / Feeney Memorial printing of the Douay-Rheims with
          Haydock's commentary carries a continuous marginal chronology in the
          historical books. The verified record read across artifact pages
          400-401 for 1 Kings 23 states of the following chapter that "the
          ensuing 1 Kings 24 begins under the next marker, A.M. 2946, A.C.
          1058". 1 Kings 24 is the chapter this edition's own bracketed
          cross-reference sends the reader to in the title of Psalm 56, "when he
          fled from Saul into the cave. [1 Kings 24.]", and 1 Kings 24:4 is
          where David and his men are in the cave and Saul enters it.
        sources:
          - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.first-kings-23-maon-chronology
          - bible:douay-rheims:Ps.56.1
          - bible:douay-rheims:1Kings.24.4
        note: >-
          The year marker is the edition's own uninitialled biblical apparatus
          and is NOT attributed personally to Haydock, Calmet, Menochius or
          Salien; the A.C. 1058 is the edition's own printed equivalent, and
          this corpus records the Anno Mundi figure as printed and converts
          nothing. Two cautions belong to this event. First, the passage record
          that carries the figure was inspected at 1 Kings 23, whose locus is
          1K.23.1-28: it reports the A.M. 2946 marker as the marker of the
          chapter that follows, so anyone publishing this year should re-verify
          it against the page image at the head of 1 Kings 24. Second, this
          event is not David and his men in the desert of Maon, which the same
          record dates A.M. 2945 at the head of 1 Kings 23, and it is not the
          cave or stronghold of Odollam of 1 Kings 22, which the Catholic
          Encyclopedia's "David" names separately as the place where his band
          of four hundred gathered. The title of Psalm 141 also names a cave and
          carries the same bracketed "[1 Kings 24.]"; this event is not thereby
          bound to it, and that psalm belongs to another lane's range.
        date:
          precision: year
          from: {year: 2946, era: am}
          label: "A. M. 2946, A. C. 1058"
