  - id: israel.exile.ezechiel.death-of-the-prophets-wife
    title: The death of the wife of Ezechiel, and his forbidden mourning
    parent: israel.exile.ezechiel.ministry
    note: >-
      Ezechiel 24 carries one dateline, at 24:1, and it belongs to the oracle of
      the rusty pot, which was uttered on the day the siege of Jerusalem began.
      The word at 24:15 opens with the book's undated revelation formula, "And
      the word of the Lord came to me, saying", and Scripture attaches no year,
      month or day to it. The chapter's dateline is therefore NOT carried onto
      this event, on the same rule the lane applied at Ezech. 30:1. Schets's
      "Ezekiel" keeps the two in one group without dating the second: "On the
      day on which the siege of Jerusalem began, the prophet represents, under
      the figure of the rusty pot, what was to befall the inhabitants of the
      city. On the occasion of the death of his wife, God forbids him to mourn
      openly, in order to teach the exiles that they should be willing to lose
      that which is dearest to them without grieving over it (xxiv)."
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Ezechiel 24:18 narrates the death and its day
          within the day: "So I spoke to the people in the morning, and my wife
          died in the evening: and I did in the morning as he had commanded me."
          The only temporal statement Scripture makes about it is that sequence,
          and 24:16-17 gives the command it obeys, "thou shalt not lament, nor
          weep ... make no mourning for the dead".
        sources:
          - bible:douay-rheims:Ezech.24.16
          - bible:douay-rheims:Ezech.24.17
          - bible:douay-rheims:Ezech.24.18
          - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
        note: >-
          Anchored to the ministry and to nothing narrower, because nothing
          narrower is stated: the death falls inside the prophetic ministry and
          Scripture places it no more exactly than "in the evening" of the day
          the prophet had spoken in the morning. It is deliberately not anchored
          to israel.exile.final-siege, whose day the chapter's other oracle
          carries: the text does not say the two fell together, and dating this
          by the neighbouring dateline would be exactly the borrowing this lane
          refuses elsewhere.
        date:
          precision: relative
          relative:
            of: israel.exile.ezechiel.ministry
            statement: >-
              So I spoke to the people in the morning, and my wife died in the
              evening
          label: >-
            I spoke to the people in the morning, and my wife died in the
            evening

