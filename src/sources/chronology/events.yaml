          designation by his dying father to 167.
        date:
          precision: year
          from: {year: 166, era: bc}
          label: "He died, however, within a year (166 B.C.)"

  - id: israel.maccabees.judas-leadership
    title: The leadership of Judas Machabeus
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          James F. Driscoll's "Judas Machabeus" (Catholic Encyclopedia, New
