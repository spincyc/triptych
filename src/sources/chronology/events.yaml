          attributes to Usher by the siglum standing after the figures: "This
          first captivity happened under Joakim, A.M. 3398, the second, under
          Jechonias, 3405, and the last, when the city was destroyed and
          Sedecias was taken, 3416 Usher."
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.psalm-70-captivities-usher-chronology]
        note: >-
          Usher's figure as transmitted by the Haydock edition; it is that
          edition's testimony, not Haydock's own reckoning and not Usher as a
          source of record. Recorded in the era it was printed in and never
          converted; it is not the Anno Mundi equivalent of any B.C. figure held
          beside it. It stands below the regnal anchor at 4 Kings 24:12 for the
          same reason it stands below Daniel 1:1 on
          israel.exile.first-captivity: a lower rank is consulted only where
          every higher rank is silent, and precision is not authority in this
          profile. The retained OCR of artifact PDF page 776 renders "A.M." as
          "A.M:" and the second figure's leading 3 as an 8; the passage record,
          read from the page image itself, gives A.M. 3398, 3405 and 3416.
        date:
          precision: year
          from: {year: 3405, era: am}
          label: "A.M. 3405"
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 4 Kings (2 Kings) 24:12 dates the surrender
          and the carrying away by the Babylonian king's own regnal year: "And
          Joachin, king of Juda, went out to the king of Babylon, he, and his
          mother, and his servants, and his nobles, and his eunuchs: and the
          king of Babylon received him in the eighth year of his reign." The
          same chapter states Joachin's own reign at 24:8: "Joachin was
          eighteen years old when he began to reign, and he reigned three
          months in Jerusalem."
        sources:
          - bible:douay-rheims:4Kings.24.12
          - bible:douay-rheims:4Kings.24.8
        note: >-
          Scripture's own regnal anchor, and displayed first for the reason
          Daniel 1:1 is displayed first on israel.exile.first-captivity: a
          lower rank is consulted only where every higher rank is silent, and
          Scripture is not silent here. "The eighth year of his reign" is the
          king of Babylon's, who is its nearest antecedent and the only one of
          the two kings the verse names who had an eighth year - 24:8 gives
          Joachin three months - which is why the anchor is Nabuchodonosor's
          accession. No year of any era is asserted. 2 Paralipomenon 36:9 in
          the same Douay text reads "eight years old ... three months and ten
          days" against 24:8; that divergence is recorded in the subject note
          and is not resolved here.
        date:
          precision: relative
          relative:
            of: israel.exile.nabuchodonosor-accession
            statement: >-
              and the king of Babylon received him in the eighth year of his
              reign
          label: "in the eighth year of his reign"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) dates the surrender: "Joachin (Jehoiachin), who
          meanwhile had succeeded to the crown of Juda, was forced to surrender
          the beleaguered city, 597 B.C. ... numbering in all 10,000, were
          carried captive to Chaldea."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        note: >-
          This B.C. figure and the Anno Mundi figure recorded above come from
          different sources on different reckonings and must never be presented
          as one another's conversion.
        date:
          precision: year
          from: {year: 597, era: bc}
          label: "597 B.C."

