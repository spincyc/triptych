          the day: "In the fifth month, the seventh day of the month, the same
          is the nineteenth year of the king of Babylon, came Nabuzardan ... And
          he burnt the house of the Lord, and the king's house, and the houses
          of Jerusalem."
        sources:
          - bible:douay-rheims:4Kings.25.8
          - bible:douay-rheims:4Kings.25.9
        note: >-
          Jeremias 52:12 in the same Bible gives the tenth day of the fifth
          month, not the seventh; the divergence is in the text and is
          preserved. The regnal year here is Nabuchodonosor's, not Sedecias's,
          which is why it is counted from his first year and not from the siege
          the burning ends.
        date:
          precision: relative
          relative:
            of: israel.exile.nabuchodonosor-accession
            statement: >-
              in the fifth month, the seventh day of the month, the nineteenth
              year of the king of Babylon
          label: >-
            In the fifth month, the seventh day of the month, the same is the
            nineteenth year of the king of Babylon

  - id: israel.exile.deportations-of-nabuchodonosor
    title: Nabuchodonosor's deportations, counted by his regnal years
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Jeremias 52:28-30 counts three carryings-away
          by the king of Babylon's own regnal years: "in the seventh year, three
          thousand and twenty-three Jews. In the eighteenth year of
          Nabuchodonosor, eight hundred and thirty-two souls from Jerusalem. In
          the three and twentieth year of Nabuchodonosor, Nabuzardan the general
          carried away of the Jews seven hundred and forty-five souls."
        sources:
          - bible:douay-rheims:Jer.52.28
          - bible:douay-rheims:Jer.52.29
          - bible:douay-rheims:Jer.52.30
        note: >-
          These regnal years, 7, 18 and 23, do not line up straightforwardly
          with the 4 Kings scheme, which speaks of the eighth and nineteenth
          years of the king of Babylon. Both stand in the tracked Douay text and
          neither is adjusted to the other. All three are counted from
          Nabuchodonosor's own first year, not from any one of the deportations
          they date.
        date:
          precision: relative
          relative:
            of: israel.exile.nabuchodonosor-accession
            statement: >-
              in the seventh year, in the eighteenth year, and in the three and
              twentieth year of Nabuchodonosor
          label: >-
            in the seventh year ... In the eighteenth year of Nabuchodonosor ...
            In the three and twentieth year of Nabuchodonosor

  - id: israel.exile.seventy-years
    title: The seventy years of servitude to Babylon
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Jeremias 25:11-12 gives the oracle's own
          measure: "all these nations shall serve the king of Babylon seventy
          years. And when the seventy years shall be expired, I will punish the
          king of Babylon, and that nation, saith the Lord, for their iniquity."
        sources:
          - bible:douay-rheims:Jer.25.11
          - bible:douay-rheims:Jer.25.12
        note: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          1908) calls the figure a round number, not to be taken literally. 2
          Paralipomenon 36:21-22 reports its fulfilment "till the seventy years
          were expired ... in the first year of Cyrus king of the Persians".
        date:
          precision: duration
          duration:
            years: 70
            statement: >-
              all these nations shall serve the king of Babylon seventy years
          label: "seventy years"

  - id: israel.restoration.decree-of-cyrus
    title: The decree of Cyrus and the return from captivity
    note: >-
      Scripture dates the decree only regnally. 1 Esdras 1:1 and 2 Paralipomenon
      36:22 both read "In the first year of Cyrus king of the Persians", and 2
      Paralipomenon adds that it came when "the seventy years were expired". The
      Catholic Encyclopedia articles inspected here put that first year two
      years apart and nothing settles them.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) writes: "Cyrus, accordingly, in the first year of his
          rule at Babylon, 538 B.C., forty-eight years after the destruction of
          Jerusalem issued an edict in which he allowed and recommended the
          return of all the Hebrews in his domain to the fatherland, ordered the
          rebuilding of the Temple".
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        date:
          precision: year
          from: {year: 538, era: bc}
          label: "in the first year of his rule at Babylon, 538 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) writes: "The first band of captives returned to Jerusalem under
          Zorobabel in the first year of Cyrus, i.e. 536 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        date:
          precision: year
          from: {year: 536, era: bc}
          label: "in the first year of Cyrus, i.e. 536 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) opens its restoration section: "In 536 B.C. Cyrus, King of
          Persia, authorized the Jews to return to Palestine and rebuild the
          Temple of the Lord."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          Agrees with Howlett's 536 against Reid's 538, a two-year disagreement
          inside one encyclopedia.
        date:
          precision: year
          from: {year: 536, era: bc}
          label: "In 536 B.C."

  - id: israel.restoration.temple-raised-by-zorobabel
    title: The raising of the second Temple by Zorobabel
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Meistermann's "Temple of Jerusalem" (Catholic Encyclopedia, New York,
          1912) writes: "After the return from captivity Zorobabel raised it
          again from its ruins (537 B.C.), but in such modest conditions that
          the ancients who had seen the former Temple wept."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14499a-82b12b6e]
        note: >-
          This is Meistermann's date for the raising, not for the completion,
          which other Catholic Encyclopedia articles put at 516 or 514. It also
          stands a year before the decree that other articles in the same work
          date to 536.
        date:
          precision: year
          from: {year: 537, era: bc}
          label: "(537 B.C.)"

  - id: israel.restoration.temple-work-resumed
    title: The resumption of the work on the Temple under Darius
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) writes: "It was not till these were aroused by the
          reproaches of the prophets Aggeus (Haggai) and Zacharias that
          Zorobabel and Josue could begin anew the work under Darius Hystaspis
          (521), sixteen years after its suspension."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        note: >-
          Reid adds that "four years later the second Temple was completed" but
          prints no resulting year, and this corpus computes none.
        date:
          precision: year
          from: {year: 521, era: bc}
          label: "under Darius Hystaspis (521)"

  - id: israel.restoration.second-temple-completed
    title: The completion of the second Temple
    note: >-
      Which Darius is meant is disputed among the Catholic sources themselves.
      Howlett says "Without much doubt, Darius I" and puts the completion at
      516, while Meistermann's Jerusalem article puts the same sixth year at
      514.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Esdras (Ezra) 6:15 dates the completion to
          the day within a Persian regnal year: "And they were finishing this
          house of God, until the third day of the month of Adar, which was in
          the sixth year of the reign of king Darius." Esther 3:7 in the same
          Bible states the month's ordinal: "there came out the twelfth month,
          which is called Adar."
        sources:
          - bible:douay-rheims:1Esd.6.15
          - bible:douay-rheims:Esth.3.7
        note: >-
          The month and the day are the verse's own, and Adar is numbered only
          because Esther 3:7 numbers it, which is the one ground on which this
          corpus numbers a Hebrew month. The year is not carried: "the sixth
          year of the reign of king Darius" is a regnal year, this corpus holds
          no first year of Darius to count it from, and the identity of the
          Darius is disputed in the Catholic Encyclopedia articles inspected
          here. It stands in the label and the basis, where the source put it,
          and is neither converted nor measured from the resumption of the work,
          which is not what the verse counts from.
        date:
          precision: month-day
          from: {month: 12, day: 3, calendar: hebrew}
          label: >-
            until the third day of the month of Adar, which was in the sixth
            year of the reign of king Darius
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) writes of the returned captives: "They laid the foundation of
          the Temple, which was finished in 516."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        date:
          precision: year
          from: {year: 516, era: bc}
          label: "the Temple, which was finished in 516"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) says the second temple "was not completed until the sixth
          year of the reign of Darius (514)".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          This figure is unique to this article among those inspected and
          conflicts with the 516 printed elsewhere in the same encyclopedia.
        date:
          precision: year
          from: {year: 514, era: bc}
          label: "the sixth year of the reign of Darius (514)"

  - id: israel.restoration.esdras-return
    title: The return of Esdras to Jerusalem
    note: >-
      Scripture dates the return only to "the seventh year of Artaxerxes the
      king" (1 Esdras 7:7-8), and which Artaxerxes is meant is expressly
      disputed in the Catholic Encyclopedia. The two rival orderings put Esdras
      sixty-one years apart, and the sources inspected here leave the question
      open.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) writes: "The hitherto accepted order places the Esdras
          gola in the seventh year of Artaxerxes (458 B.C.), and hence before
          the appointment of Nehemias ... But several exegetes have recently
          advanced strong reasons for reversing this order."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        date:
          precision: year
          from: {year: 458, era: bc}
          label: "the seventh year of Artaxerxes (458 B.C.)"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) writes: "In 458, under Artaxerxes I, Esdras came to
          Jerusalem with 1500 Jews as governor of Judea and completed the
          political and religious restoration of Israel."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        date:
          precision: year
          from: {year: 458, era: bc}
          label: "In 458, under Artaxerxes I"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) writes: "But it is commonly held that Esdras returned in 457 and
          Nehemias in 444 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Howlett's own hedge, "it is commonly held", is his and is kept; the
          same paragraph records Van Hoonacker's contrary view. This is one year
          from the 458 printed in two other articles.
        date:
          precision: year
          from: {year: 457, era: bc}
          label: "it is commonly held that Esdras returned in 457"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Charles Souvay's article "Esdras" (Catholic Encyclopedia, New York,
          1909) sets out the two rival orders: "The former view holds that
          Esdras came to Jerusalem about 458 B.C., and Nehemias first in 444 and
          the second time about 430 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        note: >-
          The article's own "about" is kept, and it deliberately leaves the
          question open.
        date:
          precision: approximate-year
          from: {year: 458, era: bc}
          label: "about 458 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same article gives the opposite opinion in the same sentence:
          "whereas, according to the opposite opinion, Esdras's mission might
          have taken place as late as 397 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        note: >-
          Sixty-one years from the same article's other figure. The hedge
          "might have taken place as late as" is the article's and is not
          resolved into an exact year here.
        date:
          precision: approximate-year
          from: {year: 397, era: bc}
          label: "might have taken place as late as 397 B.C."

  - id: israel.restoration.nehemias-mission
    title: The mission of Nehemias and the restoration of the Holy City
    note: >-
      Scripture dates the commission to "the month of Nisan, in the twentieth
      year of Artaxerxes the king" (2 Esdras 2:1), and the identity of that
      Artaxerxes is disputed in the same articles that dispute Esdras's.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) writes: "But it is commonly held that Esdras returned in 457 and
          Nehemias in 444 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Souvay's "Esdras" gives the same 444 for Nehemias's first mission.
          Howlett's hedge, "it is commonly held", is his.
        date:
          precision: year
          from: {year: 444, era: bc}
          label: "Nehemias in 444 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Souvay's "Esdras" (Catholic Encyclopedia, New York, 1909) places the
          first mission with the same figure: "Nehemias first in 444 and the
          second time about 430 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        date:
          precision: year
          from: {year: 444, era: bc}
          label: "Nehemias first in 444"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
