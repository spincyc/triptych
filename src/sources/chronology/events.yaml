  - id: apostolic-age.exile-of-saint-john-to-patmos
    title: The Exile of St John to Patmos
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "St. John the Evangelist" (Fonck, vol. 8)
          states: "With Eusebius (Church History III.13.1) and others we are
          obliged to place the Apostle's banishment to Patmos in the reign of the
          Emperor Domitian (81-96)." Eusebius, Church History III.18.1, is the
          witness it appeals to: "It is said that in this persecution the apostle
          and evangelist John ... was condemned to dwell on the island of Patmos."
        sources:
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08492a-68d29c7c
          - artifact.eusebius.ecclesiastical-history.english-mcgiffert-npnf2-1-newadvent-web-2026-07-27.newadvent-250103-4d77d36f
        note: >-
          The parenthesis dates Domitian's reign, not the banishment: the exile
          falls at an unknown point within it, and no source inspected for this
          lane prints a single A.D. year for it. Narrower regnal figures exist and
          are not converted here: Irenaeus places the vision "at the end of
          Domitian's reign", Eusebius's Chronicle "the fourteenth of Domitian's
          reign", and Jerome's clause (De viris illustribus 9) is rendered by NPNF
          "In the fourteenth year then after Nero" while the encyclopedia's
          "Apocalypse" article reads the same Latin as the fourteenth year of
          Domitian — two different dates from one sentence. Apocalypse 1:9, the
          verse everything is anchored to, carries no date, no emperor and no
          interval.
        date:
          precision: interval
          from: {year: 81, era: ad}
          to: {year: 96, era: ad}
          label: "the reign of the Emperor Domitian (81-96)"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Apocalypse" (Van den Biesen, vol. 1)
          records and rejects a rival: "Against the united testimony of these
          three witnesses of tradition the statement of Epiphanius placing the
          Seer's banishment in the reign of Claudius, A.D. 41-54, appears
          exceedingly improbable."
        sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01594b-7f47696f]
        note: >-
          Kept because the encyclopedia reports it, and marked alternate because
          the same article calls it "exceedingly improbable" against Irenaeus,
          Eusebius and Jerome. The years bound Claudius's reign, not the exile.
        date:
          precision: interval
          from: {year: 41, era: ad}
          to: {year: 54, era: ad}
          label: "the reign of Claudius, A.D. 41-54"

  - id: apostolic-age.return-of-saint-john-from-patmos
    title: The Return of St John from Patmos
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Eusebius, Church History III.23.1, ends the exile with the emperor's
          death: John was "still living in Asia, and governing the churches of
          that region, having returned after the death of Domitian from his exile
          on the island." The Catholic Encyclopedia's "St. John the Evangelist"
          (Fonck, vol. 8) says the same: "After Domitian's death the Apostle
          returned to Ephesus during the reign of Trajan."
        sources:
          - artifact.eusebius.ecclesiastical-history.english-mcgiffert-npnf2-1-newadvent-web-2026-07-27.newadvent-250103-4d77d36f
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08492a-68d29c7c
        note: >-
          Neither source gives a year. Eusebius adds, on Irenaeus's authority,
          only that John "remained among them until the time of Trajan".
        date:
          precision: relative
          relative:
            of: apostolic-age.exile-of-saint-john-to-patmos
            statement: "having returned after the death of Domitian from his exile on the island"
          label: "after the death of Domitian"

  - id: apostolic-age.death-of-saint-john
    title: The Death of St John the Evangelist
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "St. John the Evangelist" (Fonck, vol. 8)
          states: "After Domitian's death the Apostle returned to Ephesus during
          the reign of Trajan, and at Ephesus he died about A.D. 100 at a great
          age."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08492a-68d29c7c]
        note: >-
          Hedged "about", and the only A.D. figure any source inspected for this
          lane prints. Jerome (De viris illustribus 9) reckons instead that John,
          "worn out by old age, died in the sixty-eighth year after our Lord's
          passion", which is a Passion-relative measure this corpus does not
          convert and does not equate with A.D. 100; Eusebius (Church History
          III.23) says only that he remained "until the time of Trajan".
        date:
          precision: approximate-year
          from: {year: 100, era: ad}
          label: "about A.D. 100"

  # --- ot-events-early ---------------------------------------------------
  - id: israel.primeval.creation
    title: The Creation of the world
    note: >-
      The subject the tradition dates least, and says so. The Catholic
      Encyclopedia's "Biblical Chronology" opens its treatment by refusing the
      question outright, and its "General Chronology" reports the Anno Mundi
      era as an abandoned attempt rather than as a reckoning it adopts.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "General Chronology" reports the figure
          rather than adopting it: "that event being placed by Christian
          chronologists, such as Archbishop Usher, in 4004 B.C., and by the
          Jews in 3761 B.C." The article is the source of record; Usher is the
          chronologist it reports, and the same sentence closes "But any
          attempt thus to determine the age of the world has been long since
          abandoned."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03738a-5eb03e5b]
        note: >-
          Usher's 4004 B.C. follows the Hebrew text. The same encyclopedia's
          "Biblical Chronology" reports the Roman Martyrology putting the
          creation of Adam at 5199 B.C., which follows the Septuagint - nearly
          twelve hundred years apart, both within Christian reckoning. The
          Jewish era of 3761 B.C. is printed in the same sentence and is not a
          claim of this profile.
        date:
          precision: year
          from: {year: 4004, era: bc}
          label: "4004 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" describes the whole
          field of proposals and rejects the premise: "At least 200 dates have
          been suggested, varying from 3483 to 6934 years B.C., all based on
          the supposition that the Bible enables us to settle the point. But it
          does nothing of the sort."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          This is the encyclopedia refusing to date the Creation, not dating
          it. The endpoints bound two hundred other men's suggestions; they are
          not a Catholic chronology of the Creation and must never be displayed
          as one. Recorded as an interval because the article's own sentence is
          that the true date lies somewhere in that spread and Scripture will
          not narrow it.
        date:
          precision: interval
          from: {year: 6934, era: bc}
          to: {year: 3483, era: bc}
          label: "varying from 3483 to 6934 years B.C."
  - id: israel.primeval.creation-of-adam
    title: The creation of Adam
    parent: israel.primeval.creation
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" reports the Roman
          liturgical figure: "in the Martyrology for Christmas Day, the
          creation of Adam is put down in the year 5199 B.C., which is the
          reading of the Septuagint." The encyclopedia cites it to show that
