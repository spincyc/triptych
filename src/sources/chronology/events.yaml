  - id: israel.egypt.sojourn
    title: The sojourn of Israel in Egypt
    note: >-
      Three numbers, none of which any ranked source inspected for this corpus
      reconciles: four hundred and thirty at Exodus 12:40, four hundred
      foretold at Genesis 15:13, and two hundred and fifteen on the Samaritan
      and Greek reading of the same Exodus verse. Genesis 15:16 adds a fourth
      measure, "in the fourth generation they shall return hither."
