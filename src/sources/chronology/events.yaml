  - id: israel.exile.nabuchodonosor-accession
    title: The accession of Nabuchodonosor, king of Babylon
    note: >-
      Held for the reason apostolic-age.accession-of-vespasian is held: it is
      the origin of the regnal years Scripture counts the deportations and the
      burning of the Temple by, and a dateline in a king's years whose first
      year this corpus does not hold is measured from nothing.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Jeremias 25:1 identifies the first year of
          Nabuchodonosor with a year of Juda's own reckoning: "The word that
          came to Jeremias concerning all the people of Juda, in the fourth year
          of Joakim the son of Josias king of Juda, (the same is the first year
          of Nabuchodonosor king of Babylon,)". Jeremias 46:2 dates the defeat
          of Pharao Nechao at Charcamis by the same year of Joakim.
        sources:
          - bible:douay-rheims:Jer.25.1
          - bible:douay-rheims:Jer.46.2
        note: >-
          The identification is Jeremias's own, in his own parenthesis, and is
          carried as he prints it; no year of any era is asserted here. Daniel
          1:1 says "the third year of the reign of Joakim" where Jeremias says
          the fourth, a divergence already recorded on
          israel.exile.first-captivity and not harmonised here.
        date:
          precision: relative
          relative:
            of: israel.exile.joakim-accession
            statement: >-
              in the fourth year of Joakim the son of Josias king of Juda, the
              same is the first year of Nabuchodonosor king of Babylon
          label: "the same is the first year of Nabuchodonosor king of Babylon"

  - id: israel.exile.first-captivity
    title: "The first captivity of Juda, under Joakim"
    note: >-
      No Catholic source inspected for this lane attaches a B.C. year to this
      deportation. Reid's "Captivities of the Israelites" dates Carchemish to
      605 but not the carrying away itself.
    dates:
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The 2014 Loreto / Feeney Memorial printing of the Douay-Rheims with
          Haydock's commentary, in its note at Psalm 70:1, prints a chronology
          the page attributes to Usher by the siglum standing after the
          figures: "This first captivity happened under Joakim, A.M. 3398, the
          second, under Jechonias, 3405, and the last, when the city was
          destroyed and Sedecias was taken, 3416 Usher"
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.psalm-70-captivities-usher-chronology]
        note: >-
          This is the Haydock edition reporting Usher, whose chronology this
          profile never admits alone and never as a source of record; the
          testimony recorded is the Catholic edition's printing of it. The Anno
          Mundi figure is kept in the era it was printed in and is not converted
          to B.C., because no epoch has been inspected. The same record notes
          that the note itself calls the Greek title of Psalm 70 "of no great
          authority", so the chronology is no textual control on the Hebrew
          superscription. It is the only absolute figure any inspected source
          attaches to this deportation, but it stands below Scripture's own
          regnal anchor, because precision is not authority in this profile.
          The retained OCR of artifact PDF page 776 renders "A.M." as "A.M:"
          and the second figure's leading 3 as an 8; the passage record, read
          from the page image itself, gives A.M. 3398, 3405 and 3416.
        date:
          precision: year
          from: {year: 3398, era: am}
          label: "A.M. 3398"
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Daniel 1:1 gives the Scriptural anchor for
          the first siege: "In the third year of the reign of Joakim, king of
          Juda, Nabuchodonosor, king of Babylon, came to Jerusalem, and besieged
          it."
        sources: [bible:douay-rheims:Dan.1.1]
        note: >-
          Daniel 1:1 says "third year" where Jeremias 25:1 and 46:2 speak of the
          fourth year of Joakim; the divergence stands in the text and is not
          harmonised here. Howlett's "Biblical Chronology" declines to use
          Daniel as a chronological authority at all.
        date:
          precision: relative
          relative:
            of: israel.exile.joakim-accession
            statement: In the third year of the reign of Joakim, king of Juda
          label: "In the third year of the reign of Joakim, king of Juda"

  - id: israel.exile.second-captivity
    title: "The second captivity of Juda, under Jechonias"
    note: >-
      Scripture at 4 Kings 24:8 and 24:12 says that Joachin "reigned three
      months in Jerusalem" and that "the king of Babylon received him in the
      eighth year of his reign", while 2 Paralipomenon 36:9 in the same Douay
      text reads "eight years old ... three months and ten days". The divergence
      is preserved, not resolved. "Jechonias" is the Douay name for Joachin.
