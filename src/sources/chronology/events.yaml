        date:
          precision: relative
          relative:
            of: israel.primeval.deluge
            statement: "one hundred and twenty years before it occurred, and therefore when he was four hundred and eighty years old"
          label: "one hundred and twenty years before it occurred"
  - id: israel.patriarchs.begetting-of-arphaxad
    title: Sem begetting Arphaxad
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 11:10 in the Douay-Rheims opens the post-diluvian genealogy
          with an interval measured from the Flood itself: "Sem was a hundred
          years old when he begot Arphaxad, two years after the flood."
        sources: [bible:douay-rheims:Gen.11.10]
        note: >-
          The Catholic Encyclopedia's "Biblical Chronology" observes that the
          Greek line of this genealogy is not the same length: "the name of
          Cainan, whose age at the birth of Sale is given as 130 years, is to be
          found in the Greek only." The Douay and Hebrew chain has no Cainan
