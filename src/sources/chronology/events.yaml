        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          The article prints no year for Nehemias, and this corpus computes none
          from its 458 for Esdras; the interval is recorded as the interval it
          is.
        date:
          precision: relative
          relative:
            of: israel.restoration.esdras-return
            statement: Thirteen years later
          label: "Thirteen years later"

  - id: israel.restoration.nehemias-second-mission
    title: The second mission of Nehemias
    parent: israel.restoration.nehemias-mission
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Souvay's "Esdras" (Catholic Encyclopedia, New York, 1909) distinguishes
          the two: "Nehemias first in 444 and the second time about 430 B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        note: >-
          The article's own "about" is kept, and the whole ordering it belongs
          to is one of two the article declines to choose between.
        date:
          precision: approximate-year
          from: {year: 430, era: bc}
          label: "the second time about 430 B.C."

  - id: israel.maccabees.seleucid-era
    title: "The Seleucid era, 'the kingdom of the Greeks'"
    note: >-
      The era by which 1 and 2 Machabees date their events. This corpus records
      Seleucid year-numbers as the books print them and converts none of them.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Florentine Bechtel's "The Books of Machabees" (Catholic Encyclopedia,
          New York, 1910) writes: "The more important events are carefully dated
          according to the Seleucid era, which began with the autumn of 312
          B.C." Howlett's "Biblical Chronology" likewise says the chief events
          of 1 Machabees "are dated according to the Seleucid Era, 312 B.C."
        sources:
          - artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09495a-6afd1136
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
        note: >-
          Bechtel adds the warning that governs every Seleucid date in these two
          books: "the author begins the year with spring (the month Nisan),
          whereas the author of II Mach. begins it with autumn (the month
          Tishri). By reason of this difference some of the events are dated a
          year later in the second than in the first book." No Seleucid year is
          converted to B.C. here.
        date:
          precision: year
          from: {year: 312, era: bc}
          label: "the Seleucid era, which began with the autumn of 312 B.C."

  - id: israel.maccabees.antiochus-accession
    title: The accession of Antiochus IV Epiphanes
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 1:11 dates the accession by the
          Seleucid era: "And there came out of them a wicked root, Antiochus the
          Illustrious ... and he reigned in the hundred and thirty-seventh year
          of the kingdom of the Greeks."
        sources: [bible:douay-rheims:1Mach.1.11]
        note: >-
          "The kingdom of the Greeks" is the Seleucid era. The year-number is
          recorded as printed; converting it would require carrying Bechtel's
          warning that 1 and 2 Machabees begin their years in different seasons.
        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: >-
              in the hundred and thirty-seventh year of the kingdom of the
              Greeks
          label: "in the hundred and thirty-seventh year of the kingdom of the Greeks"

  - id: israel.maccabees.temple-plundered
    title: Antiochus's plundering of the Temple
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 1:21-23 dates the plundering by
          the Seleucid era: "And after Antiochus had ravaged Egypt, in the
          hundred and forty-third year, he returned and went up against Israel
          ... And he proudly entered into the sanctuary, and took away the
          golden altar, and the candlestick of light, and all the vessels
          thereof."
        sources:
          - bible:douay-rheims:1Mach.1.21
          - bible:douay-rheims:1Mach.1.22
          - bible:douay-rheims:1Mach.1.23
        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: in the hundred and forty-third year
          label: "in the hundred and forty-third year"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Meistermann's "Temple of Jerusalem" (Catholic Encyclopedia, New York,
          1912) writes: "In 168 B.C. the precious metals adorning the Temple
          aroused the covetousness of Antiochus Epiphanes, who 'took away the
          golden altar, and the candlestick of light, and all the vessels
          thereof'".
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14499a-82b12b6e]
        note: >-
          Scripture itself dates this to Seleucid year 143, and the corpus does
          not present the two as one another's conversion.
        date:
          precision: year
          from: {year: 168, era: bc}
          label: "In 168 B.C."

  - id: israel.maccabees.abomination-of-desolation
    title: The setting up of the abomination of desolation upon the altar
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 1:57 dates the profanation to the
