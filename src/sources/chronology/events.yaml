  - id: israel.divided-kingdom.fall-of-samaria
    title: The fall of Samaria and the deportation of Israel
    note: >-
      Scripture dates the fall only regnally: 4 Kings 17:5-6 gives "in the ninth
      year of Osee" after a three-year siege, and 4 Kings 18:9-10 synchronises
      it with the fourth and sixth years of Ezechias. Sloet's "Chronology of the
      Kings" argues at length that those Ezechias-Osee synchronisms are not
      historical and prints in its own table the remark that "Third year of
      Osee" is incorrect, so no relative claim is authored from them here.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          George Reid's "Captivities of the Israelites" (Catholic Encyclopedia,
          New York, 1908) states: "Samaria, the capital, held out desperately
          against a besieging Assyrian army for three years, and was not taken
          till 722 B.C., Sargon II having meanwhile succeeded Shalmaneser."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03315a-9cb437e2]
        date:
          precision: year
          from: {year: 722, era: bc}
          label: "was not taken till 722 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" declines to choose: "The fall of
          Samaria in 722 or 721, and the destruction of Jerusalem 536 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The source's own two-year uncertainty is kept rather than resolved.
        date:
          precision: interval
          from: {year: 722, era: bc}
          to: {year: 721, era: bc}
          label: "The fall of Samaria in 722 or 721"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Petavius table in Sloet's "Chronology of the Kings" ends the
          Israel column "Osee " "(end)" against "B.C. ... 738 730 721", and the
          Remarks column for that half of the table reads "Taking of Samaria".
