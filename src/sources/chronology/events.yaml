        date:
          precision: relative
          relative:
            of: israel.primeval.deluge
            statement: "Sem was a hundred years old when he begot Arphaxad, two years after the flood"
          label: "two years after the flood"
  - id: israel.patriarchs.birth-of-abram
    title: The birth of Abram
    note: >-
      No source inspected for this corpus prints an Anno Mundi or B.C. numeral
      for Abraham's birth. What the Catholic Encyclopedia supplies is an
      interval from the Flood, and its three text-families give three
      irreconcilable lengths.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology", in its section
          from the Flood to Abraham, gives the Hebrew total: "the numbers in
          the table above differ in the Hebrew, Samaritan, and Septuagint,
          being respectively 367, 1017, and 1147." This claim carries the
          Hebrew figure.
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The section is headed "The flood to the birth of Abraham", but the
          table it refers to reaches Abraham's call, adding the seventy-five
          years of Genesis 12:4; the terminus is recorded here as stated in the
          heading and the ambiguity is not resolved. The encyclopedia adds that
          these numbers "must be greatly augmented, in order to allow time for
          such a development of civilization" - its own modern reckoning, set
          against the totals it has just printed.
        date:
          precision: relative
          relative:
            of: israel.primeval.deluge
            statement: "367 years from the flood, in the Hebrew"
          label: "367"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same sentence of the Catholic Encyclopedia's "Biblical
          Chronology" gives the Samaritan total as 1017, against the Hebrew's
          367: "as a rule, the Greek and Samaritan agree against the Hebrew."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        date:
          precision: relative
          relative:
            of: israel.primeval.deluge
            statement: "1017 years from the flood, in the Samaritan"
          label: "1017"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same sentence of the Catholic Encyclopedia's "Biblical
          Chronology" gives the Septuagint total as 1147, the largest of the
          three: "being respectively 367, 1017, and 1147."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The spread between the Hebrew and the Septuagint here is seven
          hundred and eighty years, wider than the whole antediluvian
          disagreement, and no ranked source inspected for this corpus settles
          it.
        date:
          precision: relative
          relative:
            of: israel.primeval.deluge
            statement: "1147 years from the flood, in the Septuagint"
          label: "1147"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" sums the patriarchal
          ages forward instead: Abraham 100 at Isaac's birth, Isaac 60 at
          Jacob's, Jacob 130 on arriving in Egypt, "These figures, added, give
          290; add to this 430 (the number of years spent by Israel in Egypt)
          and we get 720 years, which would be the length of time between the
          birth of Abraham and the Exodus."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
