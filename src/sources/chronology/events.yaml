          precision: duration
          duration:
            years: 430
            statement: "the abode of the children of Israel that they made in Egypt, was four hundred and thirty years"
          label: "four hundred and thirty years"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Genesis 15:13 in the Douay-Rheims foretells a different term to
          Abram: "Know thou beforehand that thy seed shall be a stranger in a
          land not their own, and they shall bring them under bondage, and
          afflict them four hundred years."
        sources: [bible:douay-rheims:Gen.15.13]
        note: >-
          Four hundred here against four hundred and thirty at Exodus 12:40;
          Scripture states both and reconciles neither, and this corpus does
          not average them. The figure is spoken as prophecy to Abram, so a
          consumer wanting when the oracle was uttered wants a different
          relation from the length of the sojourn it foretells.
        date:
          precision: duration
          duration:
            years: 400
            statement: "they shall bring them under bondage, and afflict them four hundred years"
          label: "four hundred years"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" reports the rival
          text: the Samaritan Pentateuch and the Septuagint read at Exodus
          12:40 "in Egypt and the land of Canaan", and "If this be correct,
          then only 215 years are left for the sojourn in Egypt, 215 years
          being required for the sojourn in Canaan."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The encyclopedia refuses to decide, adding that "not all the
