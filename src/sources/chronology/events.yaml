        date:
          precision: relative
          relative:
            of: israel.primeval.deluge
            statement: "Sem was a hundred years old when he begot Arphaxad, two years after the flood"
          label: "two years after the flood"
  - id: israel.patriarchs.birth-of-abram
    title: The birth of Abram
    note: >-
      No source inspected for this corpus prints an Anno Mundi or B.C. numeral
      for Abraham's birth. The Catholic Encyclopedia's Flood-to-Abraham table
      does print a Flood-to-birth figure - the unlabelled row 292 / 942 / 1072
      that its subtraction reaches, before the table adds Abraham's seventy-five
      years at his call - but this corpus does not carry it, because nothing in
      the article states it as a claim in its own right. What the table states
      is its total, and that total is an interval to the CALL, held at
      israel.patriarchs.call-of-abram. The three text-family figures 367 / 1017
      / 1147 were carried here until 2026-08-27 and were wrong by exactly those
      seventy-five years.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" sums the patriarchal
          ages forward instead: Abraham 100 at Isaac's birth, Isaac 60 at
          Jacob's, Jacob 130 on arriving in Egypt, "These figures, added, give
          290; add to this 430 (the number of years spent by Israel in Egypt)
          and we get 720 years, which would be the length of time between the
          birth of Abraham and the Exodus."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The encyclopedia's own "would be" is its hedge, and its next sentence
          undoes the sum: on the Samaritan and Septuagint reading of Exodus
          12:40 only 215 years are left for Egypt, "215 years being required
          for the sojourn in Canaan, as we have to subtract 75, the age of
          Abraham when he came to Canaan, from 290." This corpus records the
          720 as printed and does not recompute it.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "720 years, which would be the length of time between the birth of Abraham and the Exodus"
          label: "720 years"
  - id: israel.patriarchs.call-of-abram
    title: The call of Abram and his going forth from Haran
    note: >-
      The Catholic Encyclopedia's Flood-to-Abraham table ends at this event, not
      at the birth. Its final row is labelled "Hence, number of years from Flood
      to Call of Abraham" and is reached from the row above it by "Add for age
      of Abraham at time of his call: 75". The three text-family totals below
      were held on israel.patriarchs.birth-of-abram until 2026-08-27, where they
      overstated the interval by those seventy-five years; the cold audit of
      2330d63a5 found it, and the anchor's own A.M. 1656 settles it - 1656 + 292
      reaches the birth, 1656 + 367 reaches the call.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 12:4 in the Douay-Rheims states Abram's age at the departure:
          "Abram was seventy-five years old when he went forth from Haran." An
          age, and so an interval from his birth, not a date.
        sources: [bible:douay-rheims:Gen.12.4]
        note: >-
          Genesis 11:26 gives Thare seventy years at Abram's begetting and
          Genesis 11:32 gives him two hundred and five at his death in Haran;
          the three figures cannot all be read as one straightforward sequence,
          and Genesis does not settle the order of Thare's sons. The Catholic
          Encyclopedia's Flood-to-Abraham table reaches this departure by adding
          these seventy-five years.
