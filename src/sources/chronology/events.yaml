  - id: israel.monarchy.solomon-accession
    title: The accession of Solomon
    note: >-
      Three Catholic Encyclopedia figures, more than fifty years apart, and
      nothing inspected settles them. The Catholic Encyclopedia's own article on
      Solomon carries no B.C. date at all.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Petavius table reproduced in Sloet's "Chronology of the Kings"
          (Catholic Encyclopedia, New York, 1910) sets "Solomon" against "B.C.
          1015" in the Juda column, between David at 1055 and the Building of
          the Temple at 1012.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Table extraction: label cells and year cells are separate in the HTML
          and were paired by position, twelve labels onto twelve years. Verify
          against a page image before publishing.
        date:
          precision: year
          from: {year: 1015, era: bc}
          label: "B.C. 1015"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Sloet's own table in the same article, harmonised with the Assyrian
          data, sets "Solomon" against "B.C. 972".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Sloet's blanket hedge governs this table: the dates are "--within a
          year, earlier or later--more or less inaccurate" except those marked
          with an asterisk, and this entry carries none.
        date:
          precision: approximate-year
          from: {year: 972, era: bc}
          label: "B.C. 972"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) concludes "the monarchy was founded by Saul, 1020; David mounted
          the throne, 1002; Solomon in 962, and the Temple was begun, 958 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Howlett's own reconstruction from Egyptological and Assyriological
          synchronisms, recorded as this article's testimony and not as the
          traditional Catholic date.
        date:
          precision: year
          from: {year: 962, era: bc}
          label: "Solomon in 962"

  - id: israel.monarchy.solomon-reign
    title: The reign of Solomon
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 3 Kings (1 Kings) 11:42 states the length:
          "And the days that Solomon reigned in Jerusalem, over all Israel, were
          forty years." Gabriel Oussani's article "Solomon" in the Catholic
          Encyclopedia (New York, 1912) says the same, adding that "Solomon was
          eighteen years old when he ascended the throne, or at least no older
          than this, and his successful reign of forty years speaks well for his
          intelligence, ability, and statesmanship."
        sources:
          - bible:douay-rheims:3Kings.11.42
          - artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14135b-7923b46e
        note: >-
          A duration, not an anchored date. Howlett's "Biblical Chronology"
          observes that forty is a recurring round number in this part of
          Scripture. The eighteen-years-old figure is Oussani's, is not in the
          Douay text of 3 Kings, and carries his own hedge.
        date:
          precision: duration
          duration:
            years: 40
            statement: he reigned in Jerusalem, over all Israel, forty years
          label: >-
            the days that Solomon reigned in Jerusalem, over all Israel, were
            forty years

  - id: israel.monarchy.temple-begun
    title: The beginning of the building of Solomon's Temple
    note: >-
      The anchor verse of the whole Old Testament chronology, and the most
      contested figure in this lane: the Catholic Encyclopedia articles
      inspected here print 1012, 1010 (Ussher, reported), 969, 966 and 958 for
      it, and one article prints two of those itself.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 3 Kings (1 Kings) 6:1 dates the beginning
          twice over, from the Exodus and from Solomon's reign: "in the four
          hundred and eightieth year after the children of Israel came out of
          the land of Egypt, in the fourth year of the reign of Solomon over
          Israel, in the month Zio, (the same is the second month) he began to
          build a house to the Lord."
        sources: [bible:douay-rheims:3Kings.6.1]
        note: >-
          The verse is contested: Howlett's "Biblical Chronology" notes that the
          Septuagint reads 440, not 480, and that some critics treat the verse
          as a late insertion. This corpus prints the Douay number and picks
          neither.
        date:
          precision: relative
          relative:
            of: israel.monarchy.solomon-accession
            statement: >-
              in the fourth year of the reign of Solomon over Israel, in the
              month Zio, and in the four hundred and eightieth year after the
              children of Israel came out of the land of Egypt
          label: >-
            in the four hundred and eightieth year after the children of Israel
            came out of the land of Egypt, in the fourth year of the reign of
            Solomon over Israel, in the month Zio
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Petavius table reproduced in Sloet's "Chronology of the Kings"
          (Catholic Encyclopedia, New York, 1910) sets "(Building of the
          Temple)" against "B.C. 1012" in the Juda column.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Table extraction: the labels and the years stand in separate cells and
          were paired by position. Anyone publishing "Temple 1012 B.C.
          (Petavius)" should re-verify against a page image first.
        date:
          precision: year
          from: {year: 1012, era: bc}
          label: "B.C. 1012"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Howlett's "Biblical Chronology" prints Ussher's reckoning and computes
          from it: "Ussher dates the reign of King Solomon from 1014-975
          B.C. But as the Temple was begun in the fourth year of that king, or
          in 1010, the Exodus took place in the year 1490 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          This is the Catholic Encyclopedia reporting Ussher, not Ussher as a
          source of record; this profile admits him only as reported by a ranked
          Catholic source, and never alone. Howlett does not reject the figures
          where he prints them: he asks "How do these results square with the
          teaching of science?" and later reaches a different figure of his own,
          958 B.C., on Egyptological grounds, which is held separately below.
        date:
          precision: year
          from: {year: 1010, era: bc}
          label: "the Temple was begun in the fourth year of that king, or in 1010"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Sloet's own table in "Chronology of the Kings" sets "(Building of the
          Temple)" against "B.C. 969".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Governed by Sloet's blanket hedge that his dates are "--within a year,
          earlier or later--more or less inaccurate" unless asterisked; this one
          is not. Table extraction.
        date:
          precision: approximate-year
          from: {year: 969, era: bc}
          label: "B.C. 969"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Howlett's "Biblical Chronology" summarises the next period thus: "We
          conclude then that the Temple was built about 969. The secession of
          the Ten Tribes took place about 937. The fall of Samaria in 722 or
          721, and the destruction of Jerusalem 536 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The same article gives "the Temple was begun, 958 B.C." at the close
          of its preceding section, "The Exodus to the building of Solomon's
          Temple". Both are recorded; the contradiction is the source's and is
          not resolved here. Howlett writes "the Temple was built", not
          "begun", and this corpus holds israel.monarchy.temple-finished as a
          separate event; the label preserves his wording so a consumer can see
          the reading.
        date:
          precision: approximate-year
          from: {year: 969, era: bc}
          label: "the Temple was built about 969"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Howlett's "Biblical Chronology" closes his reckoning of the previous
          period with "Solomon in 962, and the Temple was begun, 958 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Howlett's own reconstruction, not the traditional figure, and
          contradicted in the next section by the same article's "about 969".
        date:
          precision: year
          from: {year: 958, era: bc}
          label: "the Temple was begun, 958 B.C."
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Barnabas Meistermann's "Temple of Jerusalem" (Catholic Encyclopedia,
          New York, 1912) opens: "The temple which Solomon erected to the Lord
          about 966 B.C. was destroyed by Nabuchodonozor in 586 B.C."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14499a-82b12b6e]
        note: >-
          The article's own "about" is kept. "Nabuchodonozor" is this article's
          spelling.
        date:
          precision: approximate-year
          from: {year: 966, era: bc}
          label: "about 966 B.C."

