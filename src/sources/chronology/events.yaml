        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The encyclopedia refuses to decide, adding that "not all the
          manuscripts of the Septuagint adopt this reading" and that we are
          "only face to face with another such diversity between the Greek and
