  - id: israel.exodus.the-exodus
    title: The Exodus from Egypt
    note: >-
      The one subject in this lane where a ranked Catholic source stages the
      traditional and the modern reckoning against each other on a single page,
      and says which is which. The modern side of that staging is Howlett's own
      conclusion, "that the date of the Exodus was about 1277", reached on
      Sayce's Egyptological dates for Ramses II and on Wellhausen's and Stade's
      treatment of 3 Kings 6:1 as a late insertion, and the article itself says
      of it: "This is not the traditional date of the Exodus, but as Father
      Hummelauer (Genesis, p. 29) says, it is the conclusion of most men in
      these days." It is recorded here and is not held as a claim under this
      profile, because a modern chronology is a separate profile with its own
      id and is not consulted, adjusted with, or treated as a correction here.
      The same article concedes that its own arithmetic will not close - "we
      are left with only about 327 years, as against 480 required by 1 Kings
      6:1" - and that for the Catholic "that passage seems to settle the
      question".
    dates:
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" computes the
          traditional date from Scripture and reported regnal years: "the
          fourth year of King Solomon is said to have fallen in the 480th year
          after the Exodus; and Ussher dates the reign of King Solomon from
          1014-975 B.C. But as the Temple was begun in the fourth year of that
          king, or in 1010, the Exodus took place in the year 1490 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The traditional figure, and a profile boundary: the encyclopedia
          builds it on Usher's regnal years - reportable here only because a
          Catholic reference work prints them - then asks "How do these results
          square with the teaching of science?" and answers that they do not,
          concluding instead for a modern-critical figure this profile does not
          hold and which is recorded in the subject note above rather than as a
          claim. It is held below 3 Kings 6:1 because a rank-6 report of
          Usher's regnal years never outranks Scripture's own interval. The
          Haydock edition's Exodus chronology prints "A. C. 1491" at the
          burning bush and at Moses' approach to Pharao, within a year of this
          figure; that apparatus is itself an Usher-attributed reckoning, as
          the claims on israel.exodus.burning-bush and
          israel.exodus.moses-before-pharao both state, so it is not
          corroboration reached independently of it.
        date:
          precision: year
          from: {year: 1490, era: bc}
          label: "the year 1490 B.C."
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          3 Kings 6:1 in the Douay-Rheims states the interval on which the
          whole traditional reckoning hangs: "in the four hundred and eightieth
          year after the children of Israel came out of the land of Egypt, in
          the fourth year of the reign of Solomon over Israel, in the month
          Zio, (the same is the second month) he began to build a house to the
          Lord."
        sources: [bible:douay-rheims:3Kings.6.1]
        note: >-
          Scripture's own statement, and the hinge by which everything in this
          lane is pinned to the kings. It is displayed first because a higher
          rank never yields to a lower one, and because the same verse is
          already the preferred claim on israel.monarchy.temple-begun, which is
          the other end of the same interval. The same number is read
          differently in the Greek, which the Catholic Encyclopedia prints as
          440 and which is held below as an alternate; the Douay and Clementine
          Vulgate read four hundred and eighty.
        date:
          precision: relative
          relative:
            of: israel.monarchy.temple-begun
            statement: "in the four hundred and eightieth year after the children of Israel came out of the land of Egypt, in the fourth year of the reign of Solomon over Israel"
          label: "the four hundred and eightieth year after the children of Israel came out of the land of Egypt"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" prints the Greek
          variant of the same interval: "The Third Book of Kings (vi, 1) states
          that Solomon began to build the Temple in the 480th year (the
          Septuagint gives 440 years) after the Exodus."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Forty years of difference in the one interval every traditional
          computation rests on, printed by a Catholic reference work and left
          undecided by it. It is held as an alternate to the Douay reading
          above and not as a rival to it, because a rank-6 report of a Greek
          variant does not displace the rank-1 verse it varies from; the same
          variant is reported in a note, and not authored as a claim, on
          israel.monarchy.temple-begun.
        date:
          precision: relative
          relative:
            of: israel.monarchy.temple-begun
            statement: "the 480th year (the Septuagint gives 440 years) after the Exodus"
          label: "the Septuagint gives 440 years"
