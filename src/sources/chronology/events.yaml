    parent: israel.primeval.deluge
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 7:24 in the Douay-Rheims states a second duration: "And the
          waters prevailed upon the earth a hundred and fifty days."
        sources: [bible:douay-rheims:Gen.7.24]
        note: >-
          Genesis states the forty days of rain and the hundred and fifty days
          of prevailing waters without saying how they are to be added, and
          this corpus does not add them.
        date:
          precision: relative
          relative:
            of: israel.primeval.deluge-begins
            statement: "And the waters prevailed upon the earth a hundred and fifty days"
          label: "a hundred and fifty days"
  - id: israel.primeval.deluge-waters-abate
