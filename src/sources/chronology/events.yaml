          is the encyclopedia's report of what the Martyrology prints. The
          figure follows the Septuagint and is therefore incompatible with the
          4004 B.C. that the same encyclopedia reports from Usher on the
          Hebrew, which is recorded on the Creation of the world.
        date:
          precision: year
          from: {year: 5199, era: bc}
          label: "5199 B.C."
  - id: israel.primeval.birth-of-seth
    title: The birth of Seth
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 5:3 in the Douay-Rheims states the interval in Adam's own
          life: "And Adam lived a hundred and thirty years, and begot a son to
          his own image and likeness, and called his name Seth." Scripture's
          own chronological statement, carrying no era and no absolute year.
        sources: [bible:douay-rheims:Gen.5.3]
        note: >-
          A hundred and thirty is the Hebrew and Vulgate figure. The Catholic
          Encyclopedia's "Biblical Chronology" gives the Septuagint reading of
          the same datum as 230 years, so the Douay number is not the only
          number a Catholic source prints; the verbatim wording of that table
          was not inspected for this corpus and no separate claim is authored
          from it.
        date:
          precision: relative
          relative:
            of: israel.primeval.creation-of-adam
            statement: "And Adam lived a hundred and thirty years, and begot a son to his own image and likeness, and called his name Seth"
          label: "a hundred and thirty years"
  - id: israel.primeval.death-of-adam
    title: The death of Adam
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 5:5 in the Douay-Rheims closes the notice of Adam with the
          total: "And all the time that Adam lived, came to nine hundred and
          thirty years, and he died." An interval within one life, not a date.
        sources: [bible:douay-rheims:Gen.5.5]
        date:
          precision: relative
          relative:
            of: israel.primeval.creation-of-adam
            statement: "And all the time that Adam lived, came to nine hundred and thirty years, and he died"
          label: "nine hundred and thirty years"
  - id: israel.primeval.deluge
    title: The Deluge
    note: >-
      Genesis dates the Flood inside Noe's life, not in any era. Every Anno
      Mundi figure below is a total of the Genesis 5 genealogy, and the totals
      differ by text-family, so the era figure a source prints is a
      consequence of which text it counted.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Deluge" article sets the era figures
          side by side: "the Masoretic text assigns it to the year 1656 after
          the creation, the Samaritan to 1307, the Septuagint to 2242, Flavius
          Josephus to 2256." This claim carries the Masoretic figure; its
          "Biblical Chronology" article prints the same 1656 as the Hebrew
          total of Genesis 5.
        sources:
          - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04702a-dd9aa535
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
        note: >-
          Recorded in the era it was printed in and not converted. The same
          passage adds B.C. figures from named modern computers - "the
          Masoretic text places it in B.C. 2350 (Klaproth) or 2253 (Lüken),
          the Samaritan in 2903, the Septuagint in 3134" - which are neither
          the encyclopedia's own voice nor this profile's, and are not
          authored as claims. The section ends "But as we have seen, we must be
          prepared to assign earlier dates to these events," a modern reckoning
          the article itself distinguishes from the traditional totals.
        date:
          precision: year
          from: {year: 1656, era: am}
          label: "the year 1656 after the creation"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Deluge" article gives the Samaritan
          reckoning in the same sentence as the Masoretic: "the Samaritan to
          1307." Its "Biblical Chronology" prints 1307 as the Samaritan total
          of the Genesis 5 genealogy.
        sources:
          - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04702a-dd9aa535
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
        date:
          precision: year
          from: {year: 1307, era: am}
          label: "the Samaritan to 1307"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Deluge" article gives the Greek
          reckoning: "the Septuagint to 2242." Its "Biblical Chronology" states
          the same total for Genesis 5, "in the Septuagint, 2242."
        sources:
          - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04702a-dd9aa535
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
        note: >-
          The encyclopedia contradicts itself here and the contradiction is
          preserved rather than resolved: the prose of "Biblical Chronology"
          reads 2242 while the table printed immediately below it on the same
          page reads 2342 for Creation to Flood. This claim records the figure
          both articles print in prose; the table's hundred-year difference is
          reported and not chosen between.
        date:
          precision: year
          from: {year: 2242, era: am}
          label: "the Septuagint to 2242"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Deluge" article adds a fourth reckoning
          to the three text-families: "Flavius Josephus to 2256." The
          encyclopedia is the source of record; Josephus is the computer it
          reports.
        sources: [artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04702a-dd9aa535]
        date:
          precision: year
          from: {year: 2256, era: am}
          label: "Flavius Josephus to 2256"
  - id: israel.primeval.deluge-begins
    title: The breaking up of the fountains of the great deep
    parent: israel.primeval.deluge
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 7:11 in the Douay-Rheims dates the onset by month and day
          within Noe's life: "In the six hundredth year of the life of Noe, in
          the second month, in the seventeenth day of the month, all the
          fountains of the great deep were broken up." Scripture's own
          chronological statement.
        sources: [bible:douay-rheims:Gen.7.11]
        note: >-
          The six hundredth year of Noe is a year of one man's life, not a year
          of any era, and is therefore carried in the label only. The month
          numbers here precede the reckoning imposed at Exodus 12:2, so the
          "second month" of Genesis and the "second month" of Exodus 16:1 are
          not the same month; no calendar is asserted for it.
        date:
          precision: month-day
          from: {month: 2, day: 17}
          label: "In the six hundredth year of the life of Noe, in the second month, in the seventeenth day of the month"
