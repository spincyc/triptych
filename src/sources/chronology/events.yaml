  - id: israel.patriarchs.jacob-service-with-laban
    title: The twenty years of Jacob's service with Laban
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 31:41 in the Douay-Rheims states the whole term and its two
          parts: "And in this manner have I served thee in thy house twenty
          years, fourteen for thy daughters, and six for thy flocks: thou hast
          changed also my wages ten times."
        sources:
          - bible:douay-rheims:Gen.31.41
          - bible:douay-rheims:Gen.30.25
          - bible:douay-rheims:Gen.29.20
          - bible:douay-rheims:Gen.29.30
        note: >-
          Genesis fixes where the twenty years divide but not where they begin
          in any era, and it does not measure the whole twenty from any event
          this corpus holds. The birth of Joseph is the one point inside the
          term that Genesis marks, and it falls fourteen years in, not at the
          start: Genesis 29:20 and 29:30 give the two sevens for Lia and Rachel
          - "So Jacob served seven years for Rachel" and, after the week of the
          match, "served with him other seven years" - and Genesis 30:25 puts
          the birth at the moment Jacob asks leave to go, "And when Joseph was
          born, Jacob said to his father-in-law: Send me away". The six years
          for the flocks that Genesis 31:41 distinguishes are what runs from
          that point. The twenty years below are therefore carried as the
          length they are, not as an interval from the birth, which falls
          fourteen years into them.
          Genesis 31:38 states the same twenty years in the same speech, and
          the six for the flocks are stated only at 31:41.
        date:
          precision: duration
          duration:
            years: 20
            statement: >-
              And in this manner have I served thee in thy house twenty years,
              fourteen for thy daughters, and six for thy flocks
          label: "twenty years, fourteen for thy daughters, and six for thy flocks"

  # --- Joseph in Egypt ------------------------------------------------------
  # The chain here runs backwards from an event the corpus already holds. The
  # descent into Egypt is dated by Jacob's own age at Genesis 47:9; Genesis 45:6
  # measures the famine from the moment that immediately precedes it; the years
  # of plenty are measured from the famine at Genesis 41:53-54; and Joseph's own
  # ages hang from the elevation. Nothing in the chain is computed here.
  - id: israel.egypt.years-of-famine
    title: The seven years of famine in Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 45:6 in the Douay-Rheims has Joseph state how much of the
          famine has run and how much remains, at the moment he makes himself
          known to his brethren: "For it is two years since the famine began to
          be upon the land, and five years more remain, wherein there can be
          neither ploughing nor reaping." Genesis 41:54 states the number of
          the years in Genesis's own voice: "The seven years of scarcity, which
          Joseph had foretold, began to come."
        sources: [bible:douay-rheims:Gen.45.6, bible:douay-rheims:Gen.41.54]
        note: >-
          Joseph speaks these words in Genesis 45, and Genesis 45:9-46:7 puts
          the sending for Jacob and the going down into Egypt immediately after
          them, with no interval stated, so the descent falls in the second year
          of the famine and is not a point the seven years are measured from.
          The seven is Genesis's own figure and not a sum of the two years and
          the five. Genesis 45:11 repeats the remainder in the same
          speech, "for there are yet five years of famine remaining". No source
          inspected for this corpus reaches any era from this famine.
        date:
          precision: duration
          duration:
            years: 7
            statement: "For it is two years since the famine began to be upon the land, and five years more remain"
          label: "two years since the famine began to be upon the land, and five years more remain"
  - id: israel.egypt.years-of-plenty
    title: The seven years of plenty in Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 41:53-54 in the Douay-Rheims joins the two terms end to end:
          "Now when the seven years of plenty that had been in Egypt were
          passed: The seven years of scarcity, which Joseph had foretold, began
          to come."
        sources:
          - bible:douay-rheims:Gen.41.53
          - bible:douay-rheims:Gen.41.54
        date:
          precision: duration
          duration:
            years: 7
            statement: "Now when the seven years of plenty that had been in Egypt were passed: The seven years of scarcity, which Joseph had foretold, began to come"
          label: "the seven years of plenty"
  - id: israel.egypt.joseph-before-pharao
    title: Joseph standing before Pharao and set over the land of Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 41:46-47 in the Douay-Rheims puts the elevation immediately
          before the first of the seven fruitful years: "(Now he was thirty
          years old when he stood before king Pharao), and he went round all the
          countries of Egypt. And the fruitfulness of the seven years came."
        sources:
          - bible:douay-rheims:Gen.41.46
          - bible:douay-rheims:Gen.41.47
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08506a-07813cad
        note: >-
          Genesis states the sequence and no measured interval between the
          elevation and the first year of plenty, and none is asserted here. The
          Catholic Encyclopedia's "Joseph" declines to give the career an era at
          all: "The date of his eventful career can be fixed only approximately
          at the present day, for the Biblical account of Joseph's life does not
          name the particular Pharaoh of his time", adding only that "His term
          of office in Egypt falls probably under one of the later Hyksos
          kings." That is a dynasty and a hedge, not a year, and no year is
          authored from it.
        date:
          precision: relative
          relative:
            of: israel.egypt.years-of-plenty
            statement: "and he went round all the countries of Egypt. And the fruitfulness of the seven years came"
          label: "when he stood before king Pharao"
  - id: israel.egypt.butler-and-baker
    title: The dreams of Pharao's chief butler and chief baker
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 41:1 in the Douay-Rheims measures the gap from the prison to
          the throne room: "After two years Pharao had a dream."
        sources:
          - bible:douay-rheims:Gen.41.1
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08506a-07813cad
        note: >-
          Genesis 40:20 measures the shorter interval inside the episode itself,
          "The third day after this was the birthday of Pharao", and the
          Catholic Encyclopedia's "Joseph" reads the two together: Joseph bade
          the chief butler remember him, "as indeed he was three days after, on
          Pharaoh's birthday (xl). Two years rolled by, after which the monarch
          himself had two dreams."
        date:
          precision: relative
          relative:
            of: israel.egypt.joseph-before-pharao
            statement: "After two years Pharao had a dream"
          label: "two years"
  - id: israel.patriarchs.birth-of-joseph
    title: The birth of Joseph
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 41:46 in the Douay-Rheims gives Joseph's age at his elevation
          and so the interval from his birth: "(Now he was thirty years old when
          he stood before king Pharao)."
        sources:
          - bible:douay-rheims:Gen.41.46
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08506a-07813cad
        note: >-
          Genesis 30:22-24 narrates the birth and gives no figure with it, so
          the interval is taken from the one verse that states an age. The
          Catholic Encyclopedia's "Joseph" adds a place and not a date: "He was
          born in Haran, of Rachel, Jacob's beloved and long-barren wife."
        date:
          precision: relative
          relative:
            of: israel.egypt.joseph-before-pharao
            statement: "Now he was thirty years old when he stood before king Pharao"
          label: "thirty years old"
  - id: israel.patriarchs.joseph-sold-into-egypt
    title: Joseph sold by his brethren into Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 37:2 in the Douay-Rheims gives Joseph's age at the accusation
          that opens the chapter: "Joseph, when he was sixteen years old, was
          feeding the flock with his brethren, being but a boy."
        sources: [bible:douay-rheims:Gen.37.2]
        note: >-
          The age is stated at the head of the chapter, before the dreams, the
          journey to Dothain and the selling; Genesis states no interval between
          them, and none is asserted here.
        date:
          precision: relative
          relative:
            of: israel.patriarchs.birth-of-joseph
            statement: "Joseph, when he was sixteen years old, was feeding the flock with his brethren, being but a boy"
          label: "sixteen years old"
  - id: israel.egypt.brethren-first-journey
    title: The first going down of Joseph's brethren into Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Joseph" measures the interval from the
          selling: "Admitted into Joseph's presence, his brothers failed to
          recognize in the Egyptian grandee before them the lad whom they had so
          cruelly treated twenty years before."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08506a-07813cad]
        note: >-
          Twenty years is the encyclopedia's figure; Genesis 42 states no
          interval at all. The journey itself falls inside the famine, which is
          separately dated and separately bound to the same chapters.
        date:
          precision: relative
          relative:
            of: israel.patriarchs.joseph-sold-into-egypt
            statement: "the lad whom they had so cruelly treated twenty years before"
          label: "twenty years before"
  - id: israel.patriarchs.death-of-jacob
    title: The death of Jacob in Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 47:28 in the Douay-Rheims gives both the years in Egypt and
          the total: "And he lived in it seventeen years: and all the days of
          his life came to a hundred and forty-seven years." The Catholic
          Encyclopedia's "Jacob" prints the same total: he "passed away at the
          age of 147 (xlvi, 29-xlix)."
        sources:
          - bible:douay-rheims:Gen.47.28
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08261a-9865c411
        note: >-
          The seventeen years in Egypt are counted from the descent, which
          Genesis 47:9 dates by Jacob's age of a hundred and thirty; the hundred
          and forty-seven are counted from his birth, which is the anchor used
          here because the corpus holds it as an event.
        date:
          precision: relative
          relative:
            of: israel.patriarchs.birth-of-jacob
            statement: "all the days of his life came to a hundred and forty-seven years"
          label: "a hundred and forty-seven years"
  - id: israel.patriarchs.mourning-for-jacob
    title: The embalming of Jacob and the mourning of Egypt
    parent: israel.patriarchs.death-of-jacob
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 50:3 in the Douay-Rheims states two durations: "And while they
          were fulfilling his commands, there passed forty days: for this was
          the manner with bodies that were embalmed, and Egypt mourned for him
          seventy days."
        sources: [bible:douay-rheims:Gen.50.3]
        note: >-
          Genesis states the forty days of embalming and the seventy days of
          mourning without saying how they are to be added, and this corpus does
          not add them. The length carried below is the seventy days of Egypt's
          mourning; the forty days of embalming stand in the same verse, in the
          statement, and are not added to it.
        date:
          precision: duration
          duration:
            days: 70
            statement: "there passed forty days: for this was the manner with bodies that were embalmed, and Egypt mourned for him seventy days"
          label: "forty days ... seventy days"
  - id: israel.patriarchs.death-of-joseph
    title: The death of Joseph in Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Genesis 50:25 in the Douay-Rheims: "And he died, being a hundred and
          ten years old. And being embalmed, he was laid in a coffin in Egypt."
          Genesis 50:22 states the same total. The Catholic Encyclopedia's
          "Joseph" prints it too: "He died at the age of 110, and his body was
          embalmed and put in a coffin in Egypt."
        sources:
          - bible:douay-rheims:Gen.50.25
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08506a-07813cad
        note: >-
          The same encyclopedia adds that the figure may be conventional rather
          than counted: "Even the age of 110 years, at which Joseph died,
          appears to have been regarded in Egypt - as is shown by several papyri
          - as the most perfect age to be desired." The hedge is reported and
          not resolved.
        date:
          precision: relative
          relative:
            of: israel.patriarchs.birth-of-joseph
            statement: "And he died, being a hundred and ten years old"
          label: "a hundred and ten years old"
  # === lane josue-judges ===
  # --- ot-events-josue ---------------------------------------------------
  - id: israel.conquest.sending-of-the-spies-to-jericho
    title: The sending of the spies to Jericho, three days before the passage
    note: >-
      Scripture anchors this stretch on the passage of the Jordan and on
      nothing else: the order at Josue 1:11 counts forward to it, the spies'
      stay counts the same three days, and Josue 3:2 counts them again. No
      source inspected for this lane gives the sending a month, a day or a
      year of its own.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Josue 1:11 in the Douay-Rheims counts the days to the passage:
          "Prepare your victuals: for after the third day you shall pass over
          the Jordan, and shall go in to possess the land, which the Lord your
          God will give you." Josue 2:22 says of the spies that "they went and
          came to the mountains, and stayed there three days, till they that
          pursued them were returned", and Josue 3:1-2 that the people "abode
          there for three days. After which, the heralds went through the midst
          of the camp".
        sources: [bible:douay-rheims:Jos.1.11, bible:douay-rheims:Jos.2.22, bible:douay-rheims:Jos.3.2]
        note: >-
          Three days before the coming up out of the Jordan that Josue 4:19
          dates to the tenth day of the first month. The corpus does not
          subtract the three days from the tenth to name a day for the sending;
          Scripture does not perform that subtraction and neither does any
          source inspected here.
        date:
          precision: relative
          relative:
            of: israel.conquest.crossing-of-the-jordan
            statement: "after the third day you shall pass over the Jordan"
          label: "after the third day you shall pass over the Jordan"

  - id: israel.conquest.war-against-the-kings-of-chanaan
    title: Josue's war against the kings of Chanaan
    note: >-
      Scripture gives the war no length in years and no era. Its one measure of
      duration is the narrator's "a long time" at Josue 11:18, and its one
      numerical figure anywhere in the conquest is Caleb's forty-five years at
      Josue 14:10, which this corpus holds once on
      israel.conquest.calebs-inheritance and does not subtract from. The
      Catholic Encyclopedia's article on the book supplies no year for the war
      either.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Josue 11:18 in the Douay-Rheims states the only duration the book
          gives the war: "Josue made war a long time against these kings." Its
          close is stated at Josue 11:23: "So Josue took all the land, as the
          Lord spoke to Moses, and delivered it in possession to the children
          of Israel, according to their divisions and tribes. And the land
          rested from wars."
        sources: [bible:douay-rheims:Jos.11.18, bible:douay-rheims:Jos.11.23]
        note: >-
          "A long time" is the sacred text's own phrase and is not a number. It
          is the war's OWN length, not an interval from the crossing, so it is
          stated in the basis and is deliberately not carried in the date: a
          consumer reading it beside this anchor would get "the war began a
          long time after the crossing", which no source says. It cannot become
          a duration either, because a duration's units must be whole and
          positive and "a long time" is neither, so no length is encoded here
          at all. The war begins after the passage of the Jordan that Josue
          4:19 dates to the tenth day of the first month, which is the anchor
          named here, and that anchor carries the order and nothing more; how
          long after, no inspected source says. Its close is stated at Josue
          11:23, "And the land rested from wars."
        date:
          precision: relative
          relative:
            of: israel.conquest.crossing-of-the-jordan
            statement: >-
              After the passage of the Jordan, and closing when "the land
              rested from wars"; the text states the order and not an interval
          label: "after the passage of the Jordan"

  - id: israel.conquest.division-of-the-land
    title: The division of the land among the tribes
    note: >-
      Walter Drum's Catholic Encyclopedia article on the book divides it at the
      same place - "The Book of Josue contains two parts: the conquest of the
      promised land and the division thereof", the second being "(b) The
      Division of the Land among the Tribes of Israel (xiii-xxii)" - and
      attaches no date to either part.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Josue 13:1 in the Douay-Rheims opens the division where the war of
          Josue 11:23 left off: "Josue was old, and far advanced in years, and
          the Lord said to him: Thou art grown old, and advanced in age, and
          there is a very large country left, which is not yet divided by lot."
        sources: [bible:douay-rheims:Jos.13.1, bible:douay-rheims:Jos.11.23]
        note: >-
          After the war and in Josue's old age; the text states the order and
          not an interval. The only number spoken inside the division is
          Caleb's, at Josue 14:10, and it is held once on
          israel.conquest.calebs-inheritance rather than repeated here.
        date:
          precision: relative
          relative:
            of: israel.conquest.war-against-the-kings-of-chanaan
            statement: >-
              And the land rested from wars ... Josue was old, and far
              advanced in years, and the Lord said to him: ... there is a very
              large country left, which is not yet divided by lot
          label: "when Josue was old, and far advanced in years"

  - id: israel.conquest.last-charge-and-death-of-josue
    title: The last charge and death of Josue
    note: >-
      Drum's article groups the two as one close to the book - "Epilogue: last
      message and death of Josue (xxiii and xxiv)" - and dates neither. Josue
      24:29 gives an age and not a date, and no source inspected for this lane
      dates the birth of Josue, so the hundred and ten years reach no era here.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Josue 23:1 in the Douay-Rheims sets the charge after the division:
          "And when a long time was passed, after that the Lord had given peace
          to Israel, all the nations round about being subdued, and Josue being
          now old, and far advanced in years". Josue 24:29 closes it: "And
          after these things Josue the son of Nun the servant of the Lord died,
          being a hundred and ten years old."
        sources: [bible:douay-rheims:Jos.23.1, bible:douay-rheims:Jos.24.29]
        note: >-
          "A long time" after the division, which is itself dated only
          relatively; the chain reaches no year in any era, which is the honest
          state of the text. Judges 2:8 repeats the age of a hundred and ten
          without adding a date.
        date:
          precision: relative
          relative:
            of: israel.conquest.division-of-the-land
            statement: >-
              when a long time was passed, after that the Lord had given peace
              to Israel, all the nations round about being subdued, and Josue
              being now old, and far advanced in years
          label: "when a long time was passed"

  # --- ot-events-judges --------------------------------------------------
  - id: israel.judges.after-the-death-of-josue
    title: The tribes' wars after the death of Josue, and the rebuke at Bochim
    note: >-
      Drum's Catholic Encyclopedia article on Judges marks this stretch off as
      the book's introduction - "(1) Introduction (i-xx, 5). A summary of the
      conquest of Chanaan (i, 1-36). The angel of Jahweh reproves the tribes
      that made league with the stranger (ii, 1-5)" - and gives it no date. The
      printed "i-xx, 5" is the article's misprint for i, 1-ii, 5, as its own
      next clause shows.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 1:1 in the Douay-Rheims dates the whole introduction from the
          death of Josue: "After the death of Josue, the children of Israel
          consulted the Lord, saying: Who shall go up before us against the
          Chanaanite, and shall be the leader of the war?"
        sources: [bible:douay-rheims:Judg.1.1]
        note: >-
          The verse states the order and no interval. Several of the wars
          summarised here are also told in Josue - the encyclopedia lists
          "Juda's siege of Dabir (1:10-15; Joshua 15:14-19), the Jebusites in
          Jerusalem (1:21; Joshua 15:63)" among them - and this corpus takes no
          position on which telling is the earlier.
        date:
          precision: relative
          relative:
            of: israel.conquest.last-charge-and-death-of-josue
            statement: "After the death of Josue, the children of Israel consulted the Lord"
          label: "after the death of Josue"

  - id: israel.judges.servitude-under-chusan-rasathaim
    title: The eight years' servitude under Chusan Rasathaim
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 3:8 in the Douay-Rheims states the span: the Lord "delivered
          them into the hands of Chusan Rasathaim, king of Mesopotamia, and
          they served him eight years."
        sources: [bible:douay-rheims:Judg.3.8]
        note: >-
          A duration inside the period of the Judges, contained where the text
          places it and nowhere else. This corpus does not add the stated
          spans of the judges together; whether they run consecutively or
          overlap is not settled by any source inspected for this lane.
        date:
          precision: duration
          duration:
            years: 8
            statement: they served him eight years
            within: israel.judges.period
          label: "they served him eight years"

  - id: israel.judges.othoniel-judgeship
    title: The judgeship of Othoniel, and the forty years' rest
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 3:11 in the Douay-Rheims closes the account of Othoniel with
          the first of the book's rest formulas: "And the land rested forty
          years, and Othoniel, the son of Cenez, died."
        sources: [bible:douay-rheims:Judg.3.11]
        note: >-
          The formula measures the land's rest, not the length of Othoniel's
          own rule, and Scripture does not equate the two. No total is computed
          from it here.
        date:
          precision: duration
          duration:
            years: 40
            statement: the land rested forty years
            within: israel.judges.period
          label: "the land rested forty years"

  - id: israel.judges.servitude-under-eglon
    title: The eighteen years' servitude under Eglon of Moab
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 3:14 in the Douay-Rheims states the span: "And the children of
          Israel served Eglon, king of Moab, eighteen years."
        sources: [bible:douay-rheims:Judg.3.14]
        note: A duration inside the period of the Judges; no absolute year is stated.
        date:
          precision: duration
          duration:
            years: 18
            statement: the children of Israel served Eglon, king of Moab, eighteen years
            within: israel.judges.period
          label: "eighteen years"

  - id: israel.judges.aod-judgeship
    title: The judgeship of Aod, and the eighty years' rest
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 3:30 in the Douay-Rheims: "And Moab was humbled that day under
          the hand of Israel: and the land rested eighty years."
        sources: [bible:douay-rheims:Judg.3.30]
        note: >-
          The only eighty in the book. Judges 3:31 adds Samgar without any
          number of years, so Samgar receives no event here.
        date:
          precision: duration
          duration:
            years: 80
            statement: the land rested eighty years
            within: israel.judges.period
          label: "the land rested eighty years"

  - id: israel.judges.servitude-under-jabin
    title: The twenty years' oppression under Jabin of Chanaan
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 4:3 in the Douay-Rheims states the span in the crying of
          Israel: Sisara "had nine hundred chariots set with scythes and for
          twenty years had grievously oppressed them."
        sources: [bible:douay-rheims:Judg.4.3]
        note: >-
          Judges 4:1 places it "after the death of Aod", which is an order and
          not an interval.
        date:
          precision: duration
          duration:
            years: 20
            statement: for twenty years had grievously oppressed them
            within: israel.judges.period
          label: "twenty years"

  - id: israel.judges.debbora-and-barac
    title: The judgeship of Debbora and Barac, and the forty years' rest
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 5:32 in the Douay-Rheims, the last verse of the canticle's
          chapter: "And the land rested for forty years."
        sources: [bible:douay-rheims:Judg.5.32]
        note: >-
          The tracked Douay carries the formula at 5:32, after the canticle;
          other versifications carry it at 5:31. The canticle itself is words
          sung on the day of the victory (Judges 5:1) and is bound as an
          utterance of this same event, not as a second one.
        date:
          precision: duration
          duration:
            years: 40
            statement: the land rested for forty years
            within: israel.judges.period
          label: "the land rested for forty years"

  - id: israel.judges.servitude-under-madian
    title: The seven years under the hand of Madian
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 6:1 in the Douay-Rheims: the Lord "delivered them into the
          hand of Madian seven years".
        sources: [bible:douay-rheims:Judg.6.1]
        note: A duration inside the period of the Judges; no absolute year is stated.
        date:
          precision: duration
          duration:
            years: 7
            statement: he delivered them into the hand of Madian seven years
            within: israel.judges.period
          label: "seven years"

  - id: israel.judges.gedeon-judgeship
    title: The judgeship of Gedeon, and the forty years' rest
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 8:28 in the Douay-Rheims attaches the rest to Gedeon's own
          presiding: "but the land rested for forty years, while Gedeon
          presided."
        sources: [bible:douay-rheims:Judg.8.28]
        note: >-
          Judges 8:32 adds only that Gedeon "died in a good old age", which is
          not a number of years. Drum's article calls Gedeon and Samson the
          chief heroes of the book and dates neither.
        date:
          precision: duration
          duration:
            years: 40
            statement: the land rested for forty years, while Gedeon presided
            within: israel.judges.period
          label: "the land rested for forty years, while Gedeon presided"

  - id: israel.judges.abimelech-reign
    title: The three years of Abimelech
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 9:22 in the Douay-Rheims: "So Abimelech reigned over Israel
          three years."
        sources: [bible:douay-rheims:Judg.9.22]
        note: >-
          The text says reigned, not judged, and the corpus keeps the word. The
          three years are not added to any other span here.
        date:
          precision: duration
          duration:
            years: 3
            statement: Abimelech reigned over Israel three years
            within: israel.judges.period
          label: "three years"

  - id: israel.judges.thola-judgeship
    title: The twenty-three years of Thola
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Judges 10:2 in the Douay-Rheims: "And he judged Israel three and
          twenty years, and he died, and was buried in Samir."
        sources: [bible:douay-rheims:Judg.10.2]
        note: >-
          Judges 10:1 places him "After Abimelech", which is an order and not
          an interval.
        date:
          precision: duration
          duration:
            years: 23
            statement: he judged Israel three and twenty years
            within: israel.judges.period
          label: "three and twenty years"

  - id: israel.judges.jair-judgeship
    title: The twenty-two years of Jair the Galaadite
