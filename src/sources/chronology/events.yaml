        disposition: preferred
        basis: >-
          Numbers 33:38 in the Douay-Rheims is the most exactly dated moment of
          the wilderness narrative: Aaron "died in the fortieth year of the
          coming forth of the children of Israel out of Egypt, the fifth month,
          the first day of the month."
        sources: [bible:douay-rheims:Num.33.38]
        note: >-
          A date in the era of the departure from Egypt, not an Anno Mundi
          figure, and recorded as relative because the fortieth year is counted
          from the Exodus.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "in the fortieth year of the coming forth of the children of Israel out of Egypt, the fifth month, the first day of the month"
          label: "the fortieth year of the coming forth of the children of Israel out of Egypt, the fifth month, the first day of the month"
  - id: israel.wilderness.moses-final-discourse
    title: Moses' final discourse to Israel
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Deuteronomy 1:3 in the Douay-Rheims dates the speech: "In the
          fortieth year, the eleventh month, the first day of the month, Moses
          spoke to the children of Israel all that the Lord had commanded him
          to say to them."
        sources: [bible:douay-rheims:Deut.1.3]
        note: >-
          Six months after Aaron's death on the same reckoning. The verse dates
          the speaking, not the writing of Deuteronomy; a composition date must
          not be taken from it.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "In the fortieth year, the eleventh month, the first day of the month, Moses spoke to the children of Israel"
          label: "In the fortieth year, the eleventh month, the first day of the month"
  - id: israel.wilderness.death-of-moses
    title: The death of Moses
    note: >-
      No source inspected for this corpus supplies a year in any era for the
      death of Moses. The widely circulated wilderness range of B.C. 1491-1451
      is not among them: the Haydock edition's page on the Mosaic title of
      Psalm 89 assigns no numerical wilderness date at all and states that it
      cannot by itself verify such a range. The Catholic Encyclopedia's "Moses"
      opens by placing him "in the thirteenth and early part of the twelfth
      century, B. C.", which follows that article's late Exodus of about 1277
      and is flatly incompatible with the A. C. 1491 the Haydock edition prints
      at Exodus 3 and 5; the two are recorded as a profile boundary and neither
      is averaged into the other.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Deuteronomy 34:7 in the Douay-Rheims gives the age and nothing else:
          "Moses was a hundred and twenty years old when he died: his eye was
          not dim, neither were his teeth moved."
        sources: [bible:douay-rheims:Deut.34.7]
        note: >-
          An age, not a date; Scripture gives no month or day for the death of
          Moses, and the forty years that separate this figure from the eighty
          of Exodus 7:7 are a subtraction this corpus does not perform.
        date:
          precision: relative
          relative:
            of: israel.exodus.birth-of-moses
            statement: "Moses was a hundred and twenty years old when he died"
          label: "a hundred and twenty years old"
  - id: israel.conquest.crossing-of-the-jordan
    title: The crossing of the Jordan under Josue
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Josue 4:19 in the Douay-Rheims dates the entry by month and day: "And
          the people came up out of the Jordan, the tenth day of the first
          month, and camped in Galgal, over against the east side of the city
          of Jericho."
        sources: [bible:douay-rheims:Jos.4.19]
        note: >-
          The verse supplies no year, and the months are those of the reckoning
          instituted at Exodus 12:2.
        date:
          precision: month-day
          from: {month: 1, day: 10, calendar: hebrew}
          label: "the tenth day of the first month"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Josue" narrates the same day with a year
          attached: "It is the tenth day of the first month, forty-one years
          since the Exodus."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08524a-98ab5e95]
        note: >-
          The forty-one years are the encyclopedia's computation, not a figure
          printed at Josue 4:19; Scripture nowhere says "forty-one". It is a
          reading of Numbers 33:38, Deuteronomy 1:3 and this verse together,
          and is kept as an alternate beneath Scripture's own dating for that
          reason.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "forty-one years since the Exodus"
          label: "forty-one years since the Exodus"
  - id: israel.conquest.first-pasch-in-the-land
    title: The first pasch in the land, and the ceasing of the manna
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Josue 5:10-12 in the Douay-Rheims dates the pasch: the children of
          Israel "kept the phase, on the fourteenth day of the month at
          evening, in the plains of Jericho", ate of the corn of the land the
          next day, "And the manna ceased after they ate of the corn of the
          land."
        sources: [bible:douay-rheims:Jos.5.10]
        note: >-
          Four days after the crossing of Josue 4:19, in the same first month.
          This is the terminus of the forty years of manna named at Exodus
          16:35.
        date:
          precision: month-day
          from: {month: 1, day: 14, calendar: hebrew}
          label: "on the fourteenth day of the month at evening"
  - id: israel.conquest.calebs-inheritance
    title: Caleb's inheritance, and his forty-five years
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Josue 14:10 in the Douay-Rheims puts the only internal measure of the
          conquest in Caleb's mouth: "It is forty and five years since the Lord
          spoke this word to Moses, when Israel journeyed through the
          wilderness: this day I am eighty-five years old."
        sources: [bible:douay-rheims:Jos.14.10]
        note: >-
          Josue 14:7 gives Caleb's age of forty at the spying. Subtracting the
          thirty-eight years still to be wandered would leave about seven years
          for the conquest, but Scripture never performs that subtraction and
          neither does this corpus; no source inspected here states a length
          for the conquest.
        date:
          precision: relative
          relative:
            of: israel.wilderness.forty-years-in-the-desert
            statement: "It is forty and five years since the Lord spoke this word to Moses, when Israel journeyed through the wilderness"
          label: "forty and five years"

  # --- ot-events-late ----------------------------------------------------
  - id: israel.judges.period
    title: The period of the Judges
    note: >-
      Scripture gives the judges no era anchor. The two figures the tracked
      Douay text carries are both durations: St Paul's "four hundred and fifty
      years" at Antioch of Pisidia, and Jephte's "three hundred years", which is
      held separately because it is an argument inside a diplomatic message.
      The Catholic Encyclopedia article on the Book of Judges carries no
      chronology at all, so no absolute year is authored here.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Acts 13:20, in St Paul's discourse at Antioch
          of Pisidia, measures the judges from what precedes them: "As it were,
          after four hundred and fifty years. And after these things, he gave
          unto them judges, until Samuel the prophet." The figure is hedged in
          the sacred text itself and carries no era.
        sources: [bible:douay-rheims:Acts.13.20]
        note: >-
          The Douay punctuation attaches the four hundred and fifty years to
          what precedes; other versions attach them to the judges. This is New
          Testament testimony bearing on an Old Testament interval and must not
          be used as a hard number.
        date:
          precision: relative
          relative:
            of: israel.monarchy.saul-accession
            statement: >-
              he gave unto them judges, until Samuel the prophet, as it were,
              after four hundred and fifty years
          label: "As it were, after four hundred and fifty years"

  - id: israel.judges.jephte-three-hundred-years
    title: Jephte's three hundred years of Israelite possession beyond Jordan
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Judges 11:26 has Jephte tell the king of the
          children of Ammon that Israel "hath dwelt in Hesebon, and the villages
          thereof, and in Aroer, and its villages, and in all the cities near
          the Jordan, for three hundred years."
        sources: [bible:douay-rheims:Judg.11.26]
        note: >-
          This is Jephte's own argument inside a diplomatic message, not the
          narrator's chronological statement, and the corpus records it as such.
        date:
          precision: relative
          relative:
            of: israel.judges.period
            statement: he hath dwelt in Hesebon ... for three hundred years
          label: "for three hundred years"

  - id: israel.judges.heli-judgeship
    title: The judgeship of Heli
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Kings (1 Samuel) 4:18, reporting Heli's
          death, states its length outright: "And he judged Israel forty years."
        sources: [bible:douay-rheims:1Kings.4.18]
        note: >-
          A duration, not an anchored date. Some Greek copies read twenty years;
          the Douay text here reads forty.
        date:
          precision: relative
          relative:
            of: israel.judges.period
            statement: he judged Israel forty years
          label: "And he judged Israel forty years"

  - id: israel.judges.ark-at-cariathiarim
    title: The twentieth year of the ark's abode at Cariathiarim
    parent: israel.judges.period
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Kings (1 Samuel) 7:2 dates Israel's turning
          to the Lord from the ark's arrival: "from the day the ark of the Lord
          abode in Cariathiarim, days were multiplied (for it was now the
          twentieth year)".
        sources: [bible:douay-rheims:1Kings.7.2]
        note: >-
          Relative to the ark's arrival at Cariathiarim, not to any era. The
          verse gives no length for Samuel's own tenure, and no source inspected
          for this lane supplies one.
        date:
          precision: relative
          relative:
            of: israel.judges.period
            statement: >-
              from the day the ark of the Lord abode in Cariathiarim, it was now
              the twentieth year
          label: "for it was now the twentieth year"

  - id: israel.monarchy.saul-accession
    title: The founding of the monarchy under Saul
    note: >-
      The Catholic Encyclopedia has no dated article on Saul; its article on him
      contains no dates at all. The one figure inspected for this lane is
      Howlett's, and it is his own reconstruction rather than a traditional
      reckoning, so this profile does not display it first.
    dates:
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          James Howlett's article "Biblical Chronology" in the Catholic
          Encyclopedia (New York, 1908) closes its section on the period with
          his own conclusion: "the monarchy was founded by Saul, 1020; David
          mounted the throne, 1002; Solomon in 962, and the Temple was begun,
          958 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Howlett reaches these figures by preferring Egyptological and
          Assyriological synchronisms over the received reckoning, and the same
          article elsewhere names 975 as "the traditional date" for the revolt
          of the Ten Tribes. This is therefore not offered as the traditional
          Catholic date, and this profile does not adjust any traditional figure
          by it.
        date:
          precision: year
          from: {year: 1020, era: bc}
          label: "the monarchy was founded by Saul, 1020"

  - id: israel.monarchy.saul-reign
    title: The reign of Saul
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Kings (1 Samuel) 13:1 prints the whole of
          what Scripture says about the length of Saul's reign: "Saul was a
          child of one year when he began to reign, and he reigned two years
          over Israel."
        sources: [bible:douay-rheims:1Kings.13.1]
        note: >-
          The verse is textually notorious and cannot be taken at face value as
          the total length of the reign. The Douay-Rheims prints it as it
          stands, and no Catholic source inspected for this lane resolves it, so
          none is offered.
        date:
          precision: relative
          relative:
            of: israel.monarchy.saul-accession
            statement: he reigned two years over Israel
          label: >-
            Saul was a child of one year when he began to reign, and he reigned
            two years over Israel

  - id: israel.monarchy.david-accession
    title: David's accession to the throne
    note: >-
      The three Catholic Encyclopedia figures inspected for this lane are fifty
      years apart and nothing in the inspected sources settles them, so all
      three are kept disputed and none is displayed first.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Dominicus Sloet's article "Chronology of the Kings" in the Catholic
          Encyclopedia (New York, 1910) reproduces the seventeenth-century
          Jesuit Petavius's tables, "which, as brought by him into relation with
          the pre-Christian chronology have, with few alterations, been in vogue
          for a long time." The Juda column opens "David Solomon (Building of
          the Temple) Roboam" against "B.C. 1055 1015 1012 975".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Extracted from an HTML table whose label cells and year cells are
          separate; the twelve labels map one-to-one onto the twelve years, but
          anyone publishing this figure should re-verify against a page image.
        date:
          precision: year
          from: {year: 1055, era: bc}
          label: "B.C. 1055"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same article's final table is Sloet's own chronology, harmonised
          with the Assyrian data, and its Juda column opens "David Solomon
          (Building of the Temple) Roboam" against "B.C. 1012 972 969 933-2".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08654a-645bba6c]
        note: >-
          Sloet attaches a blanket hedge to this table: "We have, therefore, to
          consider the dates B.C. here given as--within a year, earlier or
          later--more or less inaccurate. Dates marked with an asterisk (*) may,
          however, be regarded as reasonably exact." This entry carries no
          asterisk. Table extraction; re-verify against a page image.
        date:
          precision: approximate-year
          from: {year: 1012, era: bc}
          label: "B.C. 1012"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          James Howlett's "Biblical Chronology" (Catholic Encyclopedia, New
          York, 1908) concludes his own reckoning of the period with "David
          mounted the throne, 1002".
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Howlett's figure rests on Egyptological and Assyriological
          synchronisms he prefers to the received reckoning; it is recorded as
          this Catholic article's testimony, not as the traditional date.
        date:
          precision: year
          from: {year: 1002, era: bc}
          label: "David mounted the throne, 1002"

  - id: israel.monarchy.david-capture-of-sion
    title: David's capture of the castle of Sion
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Barnabas Meistermann's article "Jerusalem (Before A.D. 71)" in the
          Catholic Encyclopedia (New York, 1910) narrates the capture and then
          dates it: "This was about the year 1058 B.C."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          The article's own "about" is kept. This figure stands near the
          Petavius table's B.C. 1055 for David and far from Howlett's 1002, but
          it dates the capture of Sion, not the accession.
        date:
          precision: approximate-year
          from: {year: 1058, era: bc}
          label: "about the year 1058 B.C."

  - id: israel.monarchy.david-reign
    title: The reign of David
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Kings (2 Samuel) 5:4-5 states the reign's
          length and its division: "David was thirty years old when he began to
          reign, and he reigned forty years. In Hebron he reigned over Juda
          seven years and six months: and in Jerusalem he reigned three and
          thirty years over all Israel and Juda."
        sources:
          - bible:douay-rheims:2Kings.5.4
          - bible:douay-rheims:2Kings.5.5
        note: >-
          A duration measured from an accession the sources do not agree on. The
          seven years and six months plus three and thirty years do not sum
          exactly to forty; the text prints both figures without harmonising
          them, and neither does this corpus.
        date:
          precision: relative
          relative:
            of: israel.monarchy.david-accession
            statement: he reigned forty years
          label: >-
            David was thirty years old when he began to reign, and he reigned
            forty years

  - id: israel.monarchy.david-at-geth
    title: David's flight to Achis, king of Geth
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The 2014 Loreto / Feeney Memorial printing of the Douay-Rheims with
          Haydock's commentary carries a continuous marginal chronology in the
          historical books. It marks the opening of 1 Kings 20 "A. M. 2944, A.
          C. 1060" and keeps A.M. 2944 standing through the close of that
          chapter and into the next, so that the flight to Achis at 1 Kings
          21:10-15 falls between those bounding year marks.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.first-kings-21-achis-geth-chronology]
        note: >-
          These year markers are the edition's own uninitialled biblical
          apparatus and are NOT attributed personally to Haydock, Calmet,
          Menochius or Salien. The marker stands at the head of 1 Kings 20, not
          beside the Achis verse. The A.C. 1060 in the label is the edition's
          own printed equivalent; this corpus records the Anno Mundi figure as
          printed and converts nothing.
        date:
          precision: year
          from: {year: 2944, era: am}
          label: "A. M. 2944, A. C. 1060"

  - id: israel.monarchy.david-in-the-desert-of-maon
    title: David and his men in the desert of Maon
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The same Haydock edition marks the opening of 1 Kings 23 "A. M. 2945,
          A. C. 1059"; verses 24-25 of that chapter place David and his men in
          the desert and wilderness of Maon, and 1 Kings 24 then opens under the
          next marker, A.M. 2946, A.C. 1058.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.first-kings-23-maon-chronology]
        note: >-
          A chapter-head marker belonging to the edition's biblical apparatus,
          not to any named commentator. Do not convert A.M. 2945 to B.C.; the
          page's own equivalence is A.C. 1059. The superscription of Psalm 56,
          "when he fled from Saul into the cave", points at 1 Kings 24, which
          opens under the following marker.
        date:
          precision: year
          from: {year: 2945, era: am}
          label: "A. M. 2945, A. C. 1059"

  - id: israel.monarchy.nabal-in-the-wilderness-of-maon
    title: Nabal in the wilderness of Maon
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The same Haydock edition prints the chapter marker "A. M. 2947, A. C.
          1057" at 1 Kings 25, where verses 1-2 place Nabal in the wilderness of
          Maon.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.first-kings-25-maon-chronology]
        note: >-
          1 Kings 23 and 1 Kings 25 both mention Maon under different year
          markers, A.M. 2945 and A.M. 2947. The two Maon episodes must not be
          merged into one dated event. The marker is the edition's own
          uninitialled apparatus.
        date:
          precision: year
          from: {year: 2947, era: am}
          label: "A. M. 2947, A. C. 1057"

  - id: israel.monarchy.david-repentance
    title: David's sin with Bethsabee and his repentance under Nathan's rebuke
    note: >-
      The occasion the Church reads in the Miserere. No source inspected for
      this lane attaches an Anno Mundi or a B.C. year to it: there is no Haydock
      passage record among the thirteen this repository holds for 2 Kings 11-12,
      and no Catholic Encyclopedia article fetched for this lane dates it.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims superscription of Psalm 50 states the occasion:
          "Unto the end, a psalm of David, When Nathan the prophet came to him,
          after he had sinned with Bethsabee. [2 Kings 12.]" The narrative it
          points to, 2 Kings (2 Samuel) 12:13, gives the confession itself: "And
          David said to Nathan: I have sinned against the Lord."
        sources:
          - bible:douay-rheims:Ps.50.1
          - bible:douay-rheims:Ps.50.2
          - bible:douay-rheims:2Kings.12.13
        note: >-
          A superscription supplies a historical occasion, never a year, and
          neither passage carries a chronological marker. The bracketed
          "[2 Kings 12.]" is the Douay editors' cross-reference and is part of
          the printed text of this edition.
        date:
          precision: relative
          relative:
            of: israel.monarchy.david-reign
            statement: >-
              within the reign of David, when Nathan the prophet came to him
              after he had sinned with Bethsabee
          label: >-
            When Nathan the prophet came to him, after he had sinned with
            Bethsabee

  - id: israel.monarchy.absalom-preparations
    title: Absalom's political preparations
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The 2014 Loreto / Feeney Memorial Haydock edition marks the opening of
          2 Kings 15, before Absalom's political preparations, "A. M. 2979, A.
          C. 1025", and then prints a second marker inside the same chapter, "A.
          M. 2980, A. C. 1024", at verse 7.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.second-kings-15-absalom-conspiracy-chronology]
        note: >-
          Two different markers stand within one chapter, so anyone dating
          "Absalom's revolt" from 2 Kings 15 must say which marker is meant. The
          marker is the edition's own uninitialled apparatus, not a named
          commentator's reckoning, and the A.C. figure is the edition's own
          equivalent, not a conversion made here.
        date:
          precision: year
          from: {year: 2979, era: am}
          label: "A. M. 2979, A. C. 1025"

  - id: israel.monarchy.absalom-revolt
    title: "Absalom's revolt: the move to Hebron"
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Kings (2 Samuel) 15:7 dates the decisive
          move only by an interval: "And after forty years, Absalom said to king
          David: Let me go, and pay my vows which I have vowed to the Lord in
          Hebron."
        sources: [bible:douay-rheims:2Kings.15.7]
        note: >-
          The Haydock edition's commentary on this chapter treats "after forty
          years" as a manuscript problem and cites Salien and Usher on it. The
          number must not be presented as settled.
        date:
          precision: relative
          relative:
            of: israel.monarchy.david-reign
            statement: after forty years
          label: "And after forty years"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The same Haydock edition prints the marker "A. M. 2980, A. C. 1024"
          against 2 Kings 15:7, where the conspiracy moves to Hebron, the
          chapter itself having opened under A. M. 2979, A. C. 1025.
        sources: [passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.second-kings-15-absalom-conspiracy-chronology]
        note: >-
          A mid-chapter marker in the edition's own uninitialled chronology, not
          attributed to any named commentator. It does not erase the A.M. 2979 /
          A.C. 1025 marker at the head of the chapter, and the Anno Mundi figure
          is recorded as printed and not converted.
        date:
          precision: year
          from: {year: 2980, era: am}
          label: "A. M. 2980, A. C. 1024"

  - id: israel.monarchy.absalom-defeat
    title: The defeat and death of Absalom
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The same Haydock edition carries A.M. 2981 from the later part of 2
