  - id: apostolic-age.persecution-by-herod-agrippa
    title: Herod Agrippa I's Persecution of the Church at Jerusalem and the Imprisonment of St Peter
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "St. Peter, Prince of the Apostles"
          (Kirsch, vol. 11) dates the persecution as a span: "Herod Agrippa I
          began (A.D. 42-44) a new persecution of the Church in Jerusalem; after
          the execution of James, the son of Zebedee, this ruler had Peter cast
          into prison."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11744a-3bac29d1]
        note: >-
          The parenthesis dates the persecution, not Herod's death, which the
          "St. Paul" and "Biblical Chronology" articles both place in 44. No
          source inspected for this lane dates the martyrdom of St James the son
          of Zebedee separately from this persecution.
        date:
          precision: range
          from: {year: 42, era: ad}
          to: {year: 44, era: ad}
          label: "(A.D. 42-44)"

  - id: apostolic-age.death-of-herod-agrippa
    title: The Death of Herod Agrippa I
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Two articles of the Catholic Encyclopedia print the same year. "St.
          Paul" (Prat, vol. 11) argues from Josephus that Agrippa died in his
          reign's third year, which had begun in 41: "These combined facts bring
          us to the year 44." "Biblical Chronology" (Howlett, vol. 3) adds the
          numismatic argument: "from what Josephus says, and the evidence of the
          coinage, we cannot be far wrong in placing that event in the year 44."
        sources:
          - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
        note: >-
          Howlett's sentence hedges ("we cannot be far wrong"), and Prat warns
          that the synchronism between Herod's death and Paul's famine-relief
          mission "can only be approximate": the two are dated separately here
          and must not be collapsed. Eusebius, quoting Josephus (Church History
          II.10.9), gives only regnal and age reckonings — "in the fifty-fourth
          year of his age, and in the seventh year of his reign" — which this
          corpus does not convert.
        date:
          precision: year
          from: {year: 44, era: ad}
          label: "the year 44"

  - id: apostolic-age.famine-under-claudius
    title: The Famine in Judea Foretold by Agabus
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "St. Paul" (Prat, vol. 11), having reached
          44 for Agrippa's death, adds: "it is precisely in this year that
          Orosius (Hist., vii, 6) places the great famine which desolated
          Judea."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        note: >-
          Acts 11:28 itself dates the famine only by a reign — Agabus "signified
          by the Spirit that there should be a great famine over the whole world,
          which came to pass under Claudius" — and supports no year on its own.
        date:
          precision: year
          from: {year: 44, era: ad}
          label: "precisely in this year"

  - id: apostolic-age.saint-paul-second-visit-to-jerusalem
    title: St Paul's Second Visit to Jerusalem, with the Alms from Antioch
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "St. Paul" (Prat, vol. 11), having loosened
          the tie between Agrippa's death and the mission of Paul and Barnabas,
          concludes: "In any case, 45 seems to be the most satisfactory date."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        note: >-
          Displayed first because it is the same article's own resolution of the
          alternative its table leaves open; nothing of higher authority settles
          it, and the article's word is "seems". Prat's reason for loosening the
          synchronism is that "the account of the death of Agrippa may be a mere
          episode intended to shed light on the situation of the Church of
          Jerusalem about the time of the arrival of the delegates from Antioch."
        date:
          precision: approximate-year
          from: {year: 45, era: ad}
          label: "45 seems to be the most satisfactory date"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The chronological table of the same article prints the visit as
          undecided between two years: "second visit to Jerusalem, 44 or 45".
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        date:
          precision: interval
          from: {year: 44, era: ad}
          to: {year: 45, era: ad}
          label: "second visit to Jerusalem, 44 or 45"

  - id: apostolic-age.saint-paul-missionary-expeditions
    title: St Paul's Three Great Missionary Expeditions
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "St. Paul" (Prat, vol. 11) frames the
          whole missionary period as one span: "This period of twelve years
          (45-57) was the most active and fruitful of his life. It comprises
          three great Apostolic expeditions of which Antioch was in each instance
          the starting-point and which invariably ended in a visit to Jerusalem."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        note: >-
          The Catholic Encyclopedia's "Biblical Chronology" (Howlett, vol. 3)
          reckons the constituent journeys differently — second 51-54, third from
          the summer of 55 to the arrest in 59 — but states no span for the
          period as a whole, so its reckoning is recorded on the individual
          expeditions rather than here.
        date:
          precision: range
          from: {year: 45, era: ad}
          to: {year: 57, era: ad}
          label: "This period of twelve years (45-57)"

