        sources:
          - artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09493b-376c059b
          - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662
        note: >-
          Meistermann prints the bare "(166)" without "B.C."; his context is
