        date:
          precision: year
          from: {year: 167, era: bc}
          label: "the rising under Mathathias, in 167"

  - id: israel.maccabees.mathathias-death
    title: The death of Mathathias
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Florentine Bechtel's "The Machabees" (Catholic Encyclopedia, New York,
