# Reusable temporal subjects. An event is dated ONCE here and bound from every
# Scripture locus that narrates, quotes, recalls or prophesies it; bindings.yaml
# holds no dates for that reason. guidance/scripture-chronology.md owns the
# contract.
schema: triptych-chronology-events/v1

events:
  # --- life-of-christ ----------------------------------------------------
  - id: life-of-christ.nativity
    title: The Nativity of Our Lord
    note: >-
      The two chronology articles of the Catholic Encyclopedia reach different
      figures for the year and neither cites the other. Its "Christmas" article
      states independently that "Concerning the date of Christ's birth the
      Gospels give no help; upon their data contradictory arguments are based",
      so no calendar day is recorded here: 25 December is a feast, and the
      encyclopedia quotes both the Philocalian Calendar entry and the bracketed
      Hippolytus computation only in order to reject them.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (Howlett, vol. 3,
          New York 1908) works back from Herod's death and concludes that the
          Dionysian date "is not the right one, for it is after Herod's death",
          that Tertullian and Irenaeus "are nearer to the truth with the years 2
          or 3 B.C.; but it must be placed still further back", and that
          "probably the year 7 B.C. will not be found to be much astray."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The hedge is the article's own and is kept: it says "probably" and
          "will not be found to be much astray", not that the year is 7 B.C.
          The companion article "Chronology of the Life of Jesus Christ" (vol.
          8, 1910) instead writes "we are led to believe that Jesus may have
          been born A.U.C. 747, 748, 749" and says the census and the planetary
          conjunction "will not lead us to any more definite result"; that
          figure is printed in Anno Urbis Conditae, an era this corpus does not
          hold and will not convert, so it is not carried here as a second
          claim.
        date:
          precision: approximate-year
          from: {year: 7, era: bc}
          label: "probably the year 7 B.C."
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "General Chronology" (vol. 3, New York
          1908), treating the Christian Era, reports that "It is supposed by
          many that the calculation of Dionysius was incorrect, and that the
          birth of Christ really occurred three years earlier than he placed it,
          or in the year of Rome 750 which he styles 3 B.C."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03738a-5eb03e5b]
        note: >-
          Reported as a common opinion and expressly not adjudicated: "This,
          however, is immaterial for the purposes of chronology, the first year
          of the Christian Era being that fixed, rightly or wrongly, by
          Dionysius." The same encyclopedia's "Biblical Chronology" reaches
          about 7 B.C. instead, and reports the same 3 B.C. as the figure of
          "the early Fathers, St. Irenaeus and Tertullian, who fixed the date of
          the Nativity in the 41st year of Augustus, that is to say, 3 years B.
          C., or a. U. C. 751."
        date:
          precision: year
          from: {year: 3, era: bc}
          label: "the year of Rome 750 which he styles 3 B.C."
  - id: life-of-christ.death-of-herod
    title: The death of Herod the Great
    note: >-
      Not an episode of Our Lord's life but the terminus the sources use to date
      the infancy narrative (Matthew 2:19-20); held here as a dated subject so
      that the flight into Egypt, which Scripture dates only by it, can name it.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (vol. 3, New York
          1908) states "it is most probable that it was in the year 4 B.C.",
          corroborated by "an eclipse of the moon from 12 March to 13 March, 4
          B.C." The encyclopedia's "Magi" article (Drum, vol. 9, New York 1910)
          independently calls 4 B.C. (A.U.C. 750) "the probable date of Herod's
          death at Jericho."
        sources:
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
          - artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09527a-ef2e5fd8
        note: >-
          Both articles hedge, and the first keeps three years open: "These
          calculations do not make it sure whether Herod died in the year 3, 4,
          or 5 B. C." The companion article "Chronology of the Life of Jesus
          Christ" places the death in "A.U.C. 749, 750, 751" and dates the
          eclipse "from 12 to 13 March, A.U.C. 750"; those figures are printed
          in Anno Urbis Conditae and this corpus neither records that era nor
          converts it.
        date:
          precision: approximate-year
          from: {year: 4, era: bc}
          label: "most probable that it was in the year 4 B.C."
  - id: life-of-christ.circumcision
    title: The Circumcision of Our Lord
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          St Luke states the interval himself: "And after eight days were
          accomplished, that the child should be circumcised, his name was
          called JESUS." Scripture's own statement of sequence is this profile's
          first authority, and it fixes an interval from the Nativity, never a
          year.
        sources: [bible:douay-rheims:Luke.2.21]
        note: >-
          Preferred over the encyclopedia's restatement because it is the
          rank-1 witness saying the same thing. The date is only as fixed as the
          Nativity is, and the Nativity is disputed.
        date:
          precision: relative
          relative:
            of: life-of-christ.nativity
            statement: after eight days from the Nativity
          label: "after eight days were accomplished"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Feast of the Circumcision" (Tierney, vol.
          3, New York 1908) states that Our Lord, "though not bound by the law,
          was circumcised on the eighth day (Luke 2:21)".
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03779a-e10c093b]
        note: >-
          The article's 1 January is a feast day and asserts no year; the
          article adds only a place-claim, that the circumcision took place "not
          in the Temple, though painters sometimes so represent it, but in some
          private house."
        date:
          precision: relative
          relative:
            of: life-of-christ.nativity
            statement: on the eighth day from the Nativity
          label: "on the eighth day"
  - id: life-of-christ.presentation
    title: The Presentation of Our Lord in the Temple
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Candlemas" article (Holweck, vol. 3, New
          York 1908) states that "Forty days after the birth of Christ Mary
          complied with this precept of the law, she redeemed her first-born
          from the temple (Numbers 18:15), and was purified by the prayer of
          Simeon the just."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03245b-5d312e9f]
        note: >-
          An interval from the Nativity and no year. The article's calendar
          dates are liturgical and must not be read as historical: the feast was
          kept at Jerusalem on 14 February because "it was simply called the
          fortieth day after Epiphany", and moved to 2 February only when 25
          December arrived.
        date:
          precision: relative
          relative:
            of: life-of-christ.nativity
            statement: forty days after the birth of Christ
          label: "Forty days after the birth of Christ"
  - id: life-of-christ.flight-into-egypt
    title: The Flight into Egypt
    note: >-
      The encyclopedia's "Chronology of the Life of Jesus Christ" sets out three
      incompatible reconstructions of the infancy and finds objections to each;
      the interval between the Nativity and the coming of the Magi, which
      immediately precedes the flight, is given by different authorities as
      "about two years after Christ's birth" (Eusebius, Epiphanius), "about a
      year and thirteen days" (Papebrochi), and "about two weeks after the
      purification" (Patrizi). Nothing here fixes when the flight began.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          St Matthew gives the sojourn's terminus and nothing else: Joseph "took
          the child and his mother by night, and retired into Egypt: and he was
          there until the death of Herod." Scripture is this profile's first
          authority and states no length for the sojourn.
        sources: [bible:douay-rheims:Matt.2.14]
        note: >-
          A terminus, not a duration. Any stated length of the stay in Egypt is
          inference; no source inspected for this corpus states one.
        date:
          precision: relative
          relative:
            of: life-of-christ.death-of-herod
            statement: in Egypt until the death of Herod
          label: "he was there until the death of Herod"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Magi" article (vol. 9, New York 1910)
          places the flight immediately after the Magi's departure — "No sooner
          were the Magi departed than the angel bade Joseph take the Child and
          its Mother into Egypt (Matthew 2:13)" — and dates that visit by
          Herod's life: it was "in the days of King Herod" (Matthew 2:1), "i.e.
          before the year 4 B.C. (A.U.C. 750), the probable date of Herod's
          death at Jericho."
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09527a-ef2e5fd8]
        note: >-
          This article's ordering — Presentation, then Magi, then flight — is
          one option among the several the companion article lays out, and the
          two are not harmonised with each other. The same article warns against
          reading the feast back into history: "Neither liturgical date is
          certainly the historical date."
        date:
          precision: relative
          relative:
            of: life-of-christ.death-of-herod
            statement: before the death of Herod
          label: "in the days of King Herod, i.e. before the year 4 B.C."
  - id: life-of-christ.finding-in-the-temple
    title: The Finding of Our Lord in the Temple
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          St Luke dates the episode by Our Lord's age and by nothing else: "And
          when he was twelve years old, they going up into Jerusalem, according
          to the custom of the feast." Scripture's own statement is this
          profile's first authority.
        sources: [bible:douay-rheims:Luke.2.42]
        note: >-
          An age, not a date. The "after three days, they found him in the
          Temple" of the following verses is an interval inside the episode, not
          its date.
        date:
          precision: relative
          relative:
            of: life-of-christ.nativity
            statement: when he was twelve years old
          label: "when he was twelve years old"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Chronology of the Life of Jesus Christ"
          (Maas, vol. 8, New York 1910) dates the hidden life only by ages and
          intervals, repeating Luke's "When he was twelve years old" and
          concluding that "the hidden life of Jesus extending through thirty
          years is far different from what one should have expected."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08377a-f81e2c23]
        note: >-
          The article assigns the hidden life no absolute date whatever; its
          "thirty years" is the round figure of Luke 3:23's "about the age of
          thirty years".
        date:
          precision: relative
          relative:
            of: life-of-christ.nativity
            statement: when he was twelve years old
          label: "When he was twelve years old"
  - id: life-of-christ.baptism
    title: The Baptism of Our Lord
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (vol. 3, New York
          1908), under "Date of the beginning of the ministry", adopts Ramsay's
          reckoning of Tiberius's years and says it "would allow enough time for
          the baptism of Our Lord in A.D. 27."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The article concedes that its own data conflict: "The fifteenth year
          of Tiberius Caesar would be A.D. 28, and would make it necessary for
          us, if correct, to alter the date fixed for Our Saviour's baptism."
          The sentence carrying A.D. 27 also prints "That would take us to A.D.
          6 for the beginning of St. John's ministry", which does not follow
          from the figures it reckons with and is quoted here uncorrected. The
          companion article "Chronology of the Life of Jesus Christ" works the
          same question wholly in Anno Urbis Conditae and gives no A.D.
          equivalent, and Eusebius (Church History I.10) adds a synchronism the
          Gospels do not — "the fourth year of the governorship of Pontius
          Pilate" — which puts him on the sole-reign reckoning, four years later
          than Ramsay's.
        date:
          precision: year
          from: {year: 27, era: ad}
          label: "A.D. 27"
  - id: life-of-christ.public-ministry-begins
    title: The beginning of the public ministry of Our Lord
    note: >-
      The length of the ministry is disputed three ways among the sources
      inspected and none of the three is recorded here as a date, because a
      duration is not one: the "Chronology of the Life of Jesus Christ" counts
      four paschs and gets "three years and a few months", "Biblical Chronology"
      counts three and gets "a duration of two years", and Eusebius (Church
      History I.10), reckoning from the high-priestly succession, gets "not
      quite four full years".
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (vol. 3, New York
          1908), under "Date of the beginning of the ministry", reckons from the
          forty-six years of John 2:20: "We should thus arrive at the year A.D.
          27, for the date of the Pasch following Our Saviour's baptism."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The same page immediately raises the contrary datum — "The fifteenth
          year of Tiberius Caesar would be A.D. 28" — and resolves it only by
          adopting Ramsay's associate-reign reckoning. The companion article
          "Chronology of the Life of Jesus Christ" places the beginning of the
          public life "about A.U.C. 779", within a period of "777-779 A.U.C.",
          and gives no A.D. equivalent; this corpus does not convert Anno Urbis
          Conditae, so that answer is not carried here as a second claim.
        date:
          precision: year
          from: {year: 27, era: ad}
          label: "A.D. 27"
  - id: life-of-christ.last-supper
    title: The Last Supper
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Chronology of the Life of Jesus Christ"
          (vol. 8, New York 1910) states that the first three Evangelists "place
          the Last Supper on the fourteenth day of Nisan, as may be seen from
          Matthew 26:17-20, Mark 14:12-17 and Luke 22:7-14", and reads John 13:1
          the same way: the supper was held "before the festival day of the
          Pasch", "i.e. on 14 Nisan".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08377a-f81e2c23]
        note: >-
          Nisan is recorded as the first month of the Hebrew calendar, which is
          what Scripture calls it (Exodus 12:2; Esther 3:7); it is not January,
          and the year is unknown. This date belongs to one article's whole
          reconstruction, in which the Supper falls on 14 Nisan and the death on
          15 Nisan. The companion article "Biblical Chronology" puts the death
          itself on 14 Nisan, which necessarily rearranges the Supper, and the
          two articles' Nisan dates may not be combined.
        date:
          precision: month-day
          from: {month: 1, day: 14, calendar: hebrew}
          label: "the fourteenth day of Nisan"
  - id: life-of-christ.crucifixion
    title: The Crucifixion of Our Lord
    note: >-
      Every claim below is disputed because the Catholic Encyclopedia itself
      declines to settle the question: "We are left, then, with the years 29,
      30, and 33 to choose between for the death of Jesus Christ. We cannot be
      certain in our choice", and the same article closes by affirming that "the
      time has not yet come to fix an authoritative chronology of the Bible."
      Its two chronology articles, both bearing nihil obstat and imprimatur and
      neither citing the other, agree on A.D. 29 for the year and contradict
      each other head-on on the day of the month. Two further data recorded here
      carry no date structure of their own: that Our Lord died on a Friday,
      which "Biblical Chronology" calls clearly laid down in the Gospels and
      "Chronology of the Life of Jesus Christ" calls near-unanimous among the
      authorities, though it lists dissenters (Epiphanius on Tuesday,
      Lactantius on Saturday, Westcott on Thursday); and the hours of Mark
      15:25,33-34 — "it was the third hour: and they crucified him", darkness
      "from the sixth hour to the ninth hour" — which the encyclopedia's
      articles do not reconcile with John 19:14's "about the sixth hour". The
      encyclopedia's "Christmas" article independently glosses the consular date
      of the death, "duobus Geminis coss.", as A.D. 29.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Chronology of the Life of Jesus Christ"
          (Maas, vol. 8, New York 1910) gathers four traditional data — the
          fifteenth (or sixteenth) year of Tiberius, the consulship of the
          Gemini, "forty-two years before the destruction of Jerusalem", and
          twelve years before the preaching of the Gospel to the Gentiles — and
          finds them converging: "the forty second year before the destruction
          of Jerusalem is A.D. 29, or A.U.C. 782", and the Gentile-mission
          reckoning "brings us to the same year, A.D. 29 or A.U.C. 782".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08377a-f81e2c23]
        note: >-
          A convergence, not a certainty, and the article concedes each joint:
          the fifteenth year of Tiberius is "either 778 or 782, according to its
          computation from the beginning of Tiberius's associate or sole reign";
          the tradition itself says "fifteenth (or sixteenth)"; and the
          conversion of Cornelius that anchors the Gentile-mission count "fell
          probably in A.D. 40 or 41".
        date:
          precision: year
          from: {year: 29, era: ad}
          label: "A.D. 29, or A.U.C. 782"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (Howlett, vol. 3,
          New York 1908), unable to decide the question on its own evidence,
          falls back on testimony: "we find a very ancient tradition, going back
          to A.D. 150, for the date A.D. 29, in the consulship of the Gemini. In
          favour of it are Clement of Alexandria, Origen, the Apocryphal Acts of
          Pilate, Hippolytus, and the Pseudo-Tertullian."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Reached by preferring tradition, immediately after the article's own
          "We cannot be certain in our choice", and against a named dissent on
          the astronomical test: "von Soden, in Cheyne's 'Encyclopaedia', is of
          opinion that the year 29 does not do so."
        date:
          precision: year
          from: {year: 29, era: ad}
          label: "A.D. 29, in the consulship of the Gemini"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same article, having tested which years satisfy the paschal and
          weekday conditions, states its result as an open choice: "We are left,
          then, with the years 29, 30, and 33 to choose between for the death of
          Jesus Christ. We cannot be certain in our choice."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The article names exactly three candidate years, not a continuous
          window; the endpoints recorded here are the first and last of the
          three and the years between them are not thereby asserted. The label
          carries the article's own words.
        date:
          precision: interval
          from: {year: 29, era: ad}
          to: {year: 33, era: ad}
          label: "the years 29, 30, and 33 to choose between"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The same article fixes the outer bracket from the governorship: "It is
          clear that the Crucifixion took place under Pontius Pilate, and hence
          Our Saviour must have died between A.D. 26 and 36 (Ant., XVIII, iv,
          2)."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The article at once narrows the upper end: "It may also be taken that
          it did not occur after 33, because in the next year Caiphas was
          deposed from the high-priesthood by Vitellius." A bracket, not a date.
        date:
          precision: interval
          from: {year: 26, era: ad}
          to: {year: 36, era: ad}
          label: "between A.D. 26 and 36"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Chronology of the Life of Jesus Christ"
          states the same kind of bracket from the high priesthood: "According
          to the Evangelists, Jesus suffered under the high priest Caiphas
          (A.U.C. 772-90, or A.D. 18-36), during the governorship of Pontius
          Pilate A.U.C. 780-90). But this leaves the time rather indefinite."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08377a-f81e2c23]
        note: >-
          The source itself calls this "rather indefinite"; it is the widest
          claim on this event and is kept only because it is what the article
          asserts. Only the A.D. figures are recorded: the parallel A.U.C.
          figures are in Anno Urbis Conditae, which this corpus does not hold,
          and the Pilate bracket is printed defectively in the source, without
          its opening parenthesis.
        date:
          precision: interval
          from: {year: 18, era: ad}
          to: {year: 36, era: ad}
          label: "A.U.C. 772-90, or A.D. 18-36"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Chronology of the Life of Jesus Christ"
          concludes from John 18:28 that the pasch the Jews had in view was the
          Chagighah, "eaten on 15 Nisan", and so states flatly: "Jesus died on
          Friday, the fifteenth day of Nisan."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08377a-f81e2c23]
        note: >-
          Nisan is recorded as the first month of the Hebrew calendar, which is
          what Scripture calls it (Exodus 12:2; Esther 3:7); it is not January,
          and the year is unknown. The Friday is the near-unanimous part of this
          sentence and the 15 Nisan is the article's own argument; the companion
          article decides the other way, and the two must be kept apart.
        date:
          precision: month-day
          from: {month: 1, day: 15, calendar: hebrew}
          label: "Friday, the fifteenth day of Nisan"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" decides the same
          question the other way: "St. John, we know, favours the 14th of
          Nisan... Besides, the weight of Christian antiquity is in favour of
          the 14th of Nisan, as are such competent modern scholars as Professor
          Sanday and the late Bishop Westcott."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Nisan is recorded as the first month of the Hebrew calendar (Exodus
          12:2; Esther 3:7), not January, and the year is unknown. The article
          remains conditional about the consequence — "If we could make up our
          mind fully that the Crucifixion took place on the 14th of Nisan, it
          would help us to determine in what year it happened" — and it
          contradicts the companion article's 15 Nisan inside the same
          encyclopedia.
        date:
          precision: month-day
          from: {month: 1, day: 14, calendar: hebrew}
          label: "the 14th of Nisan, on a Friday"
  - id: life-of-christ.resurrection
    title: The Resurrection of Our Lord
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (vol. 3, New York
          1908) states the interval and the three that follow from it: "the
          Resurrection took place three days after the Crucifixion; the
          Ascension 40 days after that, and ten days later the Holy Ghost
          descended on the Apostles."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          The interval is firm; its anchor is not. The sentence opens "Taking
          the year 29 as that of the Crucifixion", and the same article has just
          said it cannot be certain among 29, 30 and 33. The article also
          cautions on the counting itself: "according to the Greek and Jewish
          mode of reckoning, the third day is what we should call the second
          day." The weekday is separately attested — "he rising early the first
          day of the week" (Mark 16:9) — and is not a date.
        date:
          precision: relative
          relative:
            of: life-of-christ.crucifixion
            statement: three days after the Crucifixion
          label: "three days after the Crucifixion"
  - id: life-of-christ.ascension
    title: The Ascension of Our Lord
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Ascension" article (vol. 1, New York
          1907) defines the event as taking place "the fortieth day after His
          Resurrection", and its "Biblical Chronology" article states the same
          interval in its chain of consequences: "the Ascension 40 days after
          that".
        sources:
          - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01767a-f5dca100
          - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
        note: >-
          An interval and no year; neither article supplies one, and no source
          inspected for this corpus gives the Ascension a calendar date.
          Scripture states the forty days of the appearances — "for forty days
          appearing to them" (Acts 1:3) — without itself saying that the
          Ascension fell on the fortieth day, which is the encyclopedia's and
          the liturgy's reading.
        date:
          precision: relative
          relative:
            of: life-of-christ.resurrection
            statement: the fortieth day after the Resurrection
          label: "the fortieth day after His Resurrection"
  - id: life-of-christ.pentecost
    title: The Descent of the Holy Ghost at Pentecost
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Pentecost (Whitsunday)" article (vol. 15,
          New York 1912) dates the Descent of the Holy Ghost "fifty days after
          the Resurrection of Christ, on the ancient Jewish festival called the
          'feast of weeks' or Pentecost (Exodus 34:22; Deuteronomy 16:10)".
        sources: [artifact.catholic-encyclopedia.volume-15.new-york-1912.newadvent-15614b-98cc8fd9]
        note: >-
          Preferred over the alternate not by rank — both claims are the same
          encyclopedia — but because this article states the interval from the
          Resurrection directly, where the other reaches it by addition; the two
          agree, forty days and ten days being fifty. An interval and no year.
          Scripture names only the Jewish feast: "when the days of the Pentecost
          were accomplished" (Acts 2:1).
        date:
          precision: relative
          relative:
            of: life-of-christ.resurrection
            statement: fifty days after the Resurrection
          label: "fifty days after the Resurrection of Christ"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (vol. 3, New York
          1908) reaches the same day by counting from the Ascension: "the
          Ascension 40 days after that, and ten days later the Holy Ghost
          descended on the Apostles."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Kept as a distinct claim because it is anchored to a different event.
          Its whole chain begins "Taking the year 29 as that of the
          Crucifixion", a year the same article declines to be certain of.
        date:
          precision: relative
          relative:
            of: life-of-christ.ascension
            statement: ten days after the Ascension
          label: "ten days later the Holy Ghost descended on the Apostles"

  # --- apostolic ---------------------------------------------------------
  - id: apostolic-age.martyrdom-of-saint-stephen
    title: The Martyrdom of St Stephen
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (Howlett, vol. 3)
          reaches Stephen's death by counting back from St Paul's conversion:
          "We may place the martyrdom of St. Stephen a year earlier (i.e. in 33)
          not more; for Saul was still 'breathing out threatenings and slaughter'
          (Acts 9:1) at the date of his conversion." The figure is the article's
          own inference, hedged by "we may place".
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Wholly dependent on the same article's chosen date for the Council of
          Jerusalem (51), from which its conversion date of 34 and this figure
          are both computed backwards; the section opens by quoting Blass that
          "we cannot be certain of our dates within a less period than about ten
          years". No source inspected for this lane dates Stephen's martyrdom
          independently.
        date:
          precision: approximate-year
          from: {year: 33, era: ad}
          label: "a year earlier (i.e. in 33)"

  - id: apostolic-age.conversion-of-saint-paul
    title: The Conversion of St Paul
    note: >-
      Two articles of the same encyclopedia give two years, and neither is a
      datum: each is the output of a reconstruction anchored elsewhere.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "St. Paul" (Prat, vol. 11) closes its
          chronology section with a table of "the chief dates in the life of
          Paul", opening "Conversion, 35". The table is offered as the
          arrangement in which "all certain or probable data seem to be
          satisfactorily taken into account", not as a fixed year.
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        note: >-
          The same article warns that the wished-for synchronism between Paul's
          life and profane history "has not yet been indicated with certainty",
          and its discussion of the ethnarch of King Aretas concludes only that
          "St. Paul's conversion was not prior to 34" — a bound, on an expressly
          conjectural hypothesis about Caligula, not the year the table prints.
        date:
          precision: approximate-year
          from: {year: 35, era: ad}
          label: "Conversion, 35"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (Howlett, vol. 3)
          computes instead: from Galatians 1:18, "St. Paul's conversion took
          place three years previously, in 34" — three years before the first
          Jerusalem visit it has just placed in 37.
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Derived backwards from this article's own council date of 51; move
          that and this moves with it.
        date:
          precision: year
          from: {year: 34, era: ad}
          label: "in 34"

  - id: apostolic-age.saint-paul-first-visit-to-jerusalem
    title: St Paul's First Visit to Jerusalem after his Conversion
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Galatians 1:18 states the interval in the Apostle's own words: "Then,
          after three years, I went to Jerusalem to see Peter: and I tarried
          with him fifteen days." Scripture fixes the distance from the
          conversion and no absolute year.
        sources: [bible:douay-rheims:Gal.1.18]
        note: >-
          Preferred because it is the rank-1 witness: the two encyclopedia
          figures below are reconstructions built on this interval, not
          independent data. The Catholic Encyclopedia notes the disputed
          question whether these three years are included in, or added to, the
          fourteen of Galatians 2:1.
        date:
          precision: relative
          relative:
            of: apostolic-age.conversion-of-saint-paul
            statement: "Then, after three years, I went to Jerusalem to see Peter"
          label: "after three years"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "St. Paul" (Prat, vol. 11) table prints
          "first visit to Jerusalem, 37"; the same article's Aretas hypothesis
          reaches the same figure as a lower bound — "nor his escape from
          Damascus and his first visit to Jerusalem, to 37".
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        date:
          precision: approximate-year
          from: {year: 37, era: ad}
          label: "first visit to Jerusalem, 37"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (Howlett, vol. 3)
          reaches the same year by a different road: "For (Galatians 2:1) it was
          14 years before the council, or in the year 37."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          Computed from this article's own council date of 51. The two
          encyclopedia articles agree on 37 while disagreeing on the conversion
          year (35 against 34), which is possible only because they measure the
          three years of Galatians 1:18 differently.
        date:
          precision: year
          from: {year: 37, era: ad}
          label: "in the year 37"

