        date:
          precision: interval
          from: {year: 45, era: ad}
          to: {year: 49, era: ad}
          label: "between A.D. 45-49"

  - id: apostolic-age.council-of-jerusalem
    title: The Council of Jerusalem
    note: >-
      Four articles of the 1907-1914 Catholic Encyclopedia date this council four
      ways, and none of them settles the others. No claim on this subject may be
      displayed as the traditional answer.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "St. Paul" (Prat, vol. 11), identifying
          Galatians 2 with Acts 15, lists among the marks of identity that "the
          date is the same, about A.D. 50".
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        note: >-
          Hedged "about". The same article's summary table prints the same visit
          as "third visit to Jerusalem, 49 or 50".
        date:
          precision: approximate-year
          from: {year: 50, era: ad}
          label: "about A.D. 50"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "St. Peter, Prince of the Apostles"
          (Kirsch, vol. 11) dates the council by the apostles present: "In
          addition to James, Peter and John were then (about A.D. 50-51) in
          Jerusalem."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11744a-3bac29d1]
        date:
          precision: interval
          from: {year: 50, era: ad}
          to: {year: 51, era: ad}
          label: "about A.D. 50-51"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Judaizers" (Bechtel, vol. 8) heads its
          treatment of the council "Council of Jerusalem (A.D. 50 or 51)",
          offering two years and choosing neither.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08537a-e2154141]
        note: >-
          The figure appears in a section heading; the body of the section gives
          no year of its own.
        date:
          precision: interval
          from: {year: 50, era: ad}
          to: {year: 51, era: ad}
          label: "A.D. 50 or 51"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          The Catholic Encyclopedia's "Biblical Chronology" (Howlett, vol. 3)
          reports "much difference of opinion as to the date" and then decides:
          "It would seem most likely to have occurred in 51, the year of the
          beginning of the second missionary journey, for it was concluded only
          'some days' (xv, 36) before that expedition was begun."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          This article's whole Pauline chain — conversion 34, first visit 37,
          martyrdom of Stephen 33 — is computed backwards from this figure. The
          rival dates it names before deciding (Harnack 47, Ramsay 50, Lightfoot
          51) are the opinions of critics the article is weighing, not claims of
          the tradition, and are recorded here only as the article's own context.
        date:
          precision: approximate-year
          from: {year: 51, era: ad}
          label: "most likely to have occurred in 51"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Galatians 2:1 states the interval in the Apostle's own words: "Then,
          after fourteen years, I went up again to Jerusalem with Barnabas,
          taking Titus also with me." The "St. Paul" article (Prat, vol. 11) is
          what identifies that visit with this council: "Here it is to be
          assumed that Galatians 2 and Acts 15 relate to the same fact."
        sources:
          - bible:douay-rheims:Gal.2.1
          - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
        note: >-
          The verse fixes an interval and no year, and it does not itself say
          which visit of Acts it belongs to. The Catholic Encyclopedia records
          the further disputed question whether the fourteen years run from the
          conversion or from the first Jerusalem visit; this claim is anchored on
          the first visit without prejudice to that question.
        date:
          precision: relative
          relative:
            of: apostolic-age.saint-paul-first-visit-to-jerusalem
            statement: "Then, after fourteen years, I went up again to Jerusalem with Barnabas"
          label: "after fourteen years"

