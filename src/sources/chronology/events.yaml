        date:
          precision: month-day
          from: {month: 2, day: 27}
          label: "In the second month, the seven and twentieth day of the month"
  - id: israel.primeval.noe-warned
    title: The warning given to Noe
    parent: israel.primeval.deluge
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Catholic Encyclopedia's "Noah" states the interval: "According to
          the common interpretation of Genesis 6:3, Noah first received divine
          warning of the impending destruction one hundred and twenty years
          before it occurred, and therefore when he was four hundred and eighty
          years old (cf. 7:11)."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11088a-f05fae40]
        note: >-
          The encyclopedia flags this as "the common interpretation" of Genesis
          6:3 rather than a certainty, and the age of four hundred and eighty
          is its own subtraction from the six hundredth year of Genesis 7:11,
          not a number Scripture prints. The same article says the later,
