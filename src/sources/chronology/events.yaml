          label: "in year 167 B.C. ... until the year 161"

  - id: israel.maccabees.temple-rededication
    title: The rededication of the Temple by Judas Machabeus
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 4:52-54 dates the rededication to
          the day by the Seleucid era: "they arose before the morning on the
          five and twentieth day of the ninth month, (which is the month of
          Casleu) in the hundred and forty-eighth year ... According to the
          time, and according to the day wherein the heathens had defiled it, in
          the same was it dedicated anew."
        sources:
          - bible:douay-rheims:1Mach.4.52
          - bible:douay-rheims:1Mach.4.53
          - bible:douay-rheims:1Mach.4.54
        note: >-
          Bechtel's "The Machabees" says only that "The temple was cleansed and
          rededicated on the day on which three years before it had been
          profaned", giving no year, and Driscoll's "Judas Machabeus" describes
          the eight-day feast without one either.
        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: >-
              the five and twentieth day of the ninth month, the month of
              Casleu, in the hundred and forty-eighth year
          label: >-
            the five and twentieth day of the ninth month, (which is the month
            of Casleu) in the hundred and forty-eighth year
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          Meistermann's "Jerusalem (Before A.D. 71)" (Catholic Encyclopedia, New
          York, 1910) attaches a year in passing: "Judas, succeeding on the
          death of his father (166), gained four victories over the Syrian
          armies, occupied Jerusalem (164), purified the Temple, strengthened
          the fortifications, and erected a new altar of holocausts."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662]
        note: >-
          Thinly attested: this is the only sentence inspected for this lane
          that attaches a B.C. year to the rededication, "B.C." is not printed
          on the bare number, and the year is attached to the occupation of
          Jerusalem in a list of which the purification is the next item.
        date:
          precision: year
          from: {year: 164, era: bc}
          label: "occupied Jerusalem (164), purified the Temple"

  - id: israel.maccabees.feast-of-dedication
    title: The annual feast of the Dedication
    parent: israel.maccabees.temple-rededication
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Machabees 4:59 institutes a recurring
          observance: "that the day of the dedication of the altar should be
          kept in its season from year to year for eight days, from the five and
          twentieth day of the month of Casleu". 2 Machabees 10:5 names the same
          day: "on the five and twentieth day of the month of Casleu".
        sources:
          - bible:douay-rheims:1Mach.4.59
          - bible:douay-rheims:2Mach.10.5
        note: >-
          A recurring liturgical day, not a one-time year, which is why no year
          is recorded. Casleu is the ninth month, as 1 Machabees 4:52 states,
          and the endpoint is written in the Hebrew calendar. 2 Machabees
          reckons its year from Tishri and 1 Machabees from Nisan, so the two
          books' year-numbers for one event can differ by one; the day does not.
        date:
          precision: month-day
          from: {month: 9, day: 25, calendar: hebrew}
          label: "from the five and twentieth day of the month of Casleu"

  - id: israel.maccabees.simon-rule
    title: The rule of Simon Machabeus
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
          1908) closes its account of 1 Machabees: "Simon was made ruler in 141,
          was murdered in 135, and was succeeded by his son John Hyrcanus in the
          same year."
        sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04]
        note: >-
          No "B.C." is printed on these bare numbers; the article's context is
          B.C. throughout. The same article says 1 Machabees "gives information
          about the period 174-135", where Bechtel's "The Books of Machabees"
          gives 175-135 B.C. for the same book.
        date:
          precision: range
          from: {year: 141, era: bc}
          to: {year: 135, era: bc}
          label: "Simon was made ruler in 141, was murdered in 135"
  # === lane esdras ===
  - id: israel.restoration.return-and-temple-rebuilding
    title: The return under Zorobabel and the rebuilding of the Temple
    note: >-
      The subject of the first part of 1 Esdras, from the decree of Cyrus to
      the dedication of the second Temple. Scripture dates its stages only
      regnally; the span below is the Catholic Encyclopedia's own, and its
      closing figure is a fourth one beside the 537 this corpus already holds
      for the raising, and the 516 and 514 it already holds for the
      completion. Nothing here reconciles them.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Charles Souvay's article "Esdras" (Catholic Encyclopedia, New York,
          1909), describing the former of the two parallel parts of I Esdras,
          writes: "In the former, with the decree of Cyrus (i, 1-4) and the
          enumeration of the most prominent members of the caravan (ii), we
          read a detailed account of the rebuilding of the Temple and its
          successful completion, in spite of bitter opposition (iii-iv). The
          events therein contained cover twenty-one years (536-515)."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
        note: >-
          A range: the events narrated SPAN these years, they do not fall
          somewhere within them. The binding built on this event leaves 1
          Esdras 4:6-23 out and gives those verses their own event, and it does
          so on Souvay's own words for the break -- "due allowance being made
          for the break in the narrative -- Ezra 4:6-23" -- which are his, in
          his own voice, and name that passage. What that parenthesis is NOT is
          a caution about the order of the book: it stands inside a sentence
          about the order of the two missions -- "Many Biblical scholars still
          cling to the view suggested by the traditional order of the sacred
          text (due allowance being made for the break in the narrative -- Ezra
          4:6-23), and place the mission of Esdras before that of Nehemias" --
          and what it qualifies is the scholars' view of whether Esdras came
          before Nehemias. The break it names stands; the framing is corrected.
          Souvay's 536 agrees with Howlett and Meistermann for the decree and
          disagrees with Reid's 538; his 515 agrees with neither the 516 nor
          the 514 the encyclopedia prints elsewhere for the completion.
        date:
          precision: range
          from: {year: 536, era: bc}
          to: {year: 515, era: bc}
          label: "twenty-one years (536-515)"

  - id: israel.restoration.altar-restored
    title: The restoring of the altar and the first holocausts after the return
    parent: israel.restoration.return-and-temple-rebuilding
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Esdras 3:1 opens "And now the seventh
          month was come, and the children of Israel were in their cities: and
          the people gathered themselves together as one man to Jerusalem",
          and 3:6 dates the beginning of the sacrifices to the day: "From the
          first day of the seventh month they began to offer holocausts to the
          Lord: but the temple of God was not yet founded."
        sources: [bible:douay-rheims:1Esd.3.1, bible:douay-rheims:1Esd.3.6]
        note: >-
          Scripture gives the month and the day and no year at all. The
          following verse but two, 3:8, dates the laying of the foundations to
          "the second year of their coming to the temple of God in Jerusalem,
          the second month", which is a regnal-style anchor and not an era
          date; this corpus converts neither.
        date:
          precision: month-day
          from: {month: 7, day: 1, calendar: hebrew}
          label: "From the first day of the seventh month"

  - id: israel.restoration.walls-forbidden-by-artaxerxes
    title: The forbidding of the rebuilding of the walls of Jerusalem
    note: >-
      1 Esdras 4:6-23 is the break in the narrative of the book: an accusation
      under Assuerus and a second under Artaxerxes, standing between the
      opposition to the Temple under Cyrus and the resumption under Darius.
      Souvay's "Esdras" flags the break in passing -- "due allowance being made
      for the break in the narrative -- Ezra 4:6-23" -- and Van Hoonacker's
      "Book of Nehemiah" dates it.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Albin Van Hoonacker's "Book of Nehemiah" (Catholic Encyclopedia, New
          York, 1911) writes: "Already in the reign of Xerxes (B. C. 485-65),
          and especially during the first half of the reign of Artaxerxes I
          (B. C. 465-24), the Jews had attempted, but with only partial
          success, to rebuild the walls of their capital, a work, up to then,
          never sanctioned by the Persian kings (see Ezra 4:6-23). In
          consequence of the edict of Artaxerxes, given in I Esd., iv, 18-22,
          the enemies of the Jews at Jerusalem forcibly stopped the work
          (ibid., 23) and pulled down a part of what had already been
          accomplished."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067]
        note: >-
          An interval and NOT a range: the article does not say the forbidding
          spanned these sixty-one years, it says the attempts fell within the
          reign of Xerxes and especially within the FIRST HALF of the reign of
          Artaxerxes I. The structured bounds are the two reigns entire, which
          is wider than the claim -- 424 B.C. is the end of the reign the
          article prints, not the end of the attempts it describes -- so the
          bounds say only that what is dated falls somewhere inside them, and
          the narrowing is in the label. composition.first-book-of-paralipomenon
          discloses the same gap between bounds and claim the same way. The
          article's identification of the Assuerus of 4:6 with Xerxes and of the
          Artaxerxes of 4:7-23 with Artaxerxes I is the article's; this corpus
          does not settle it.
        date:
          precision: interval
          from: {year: 485, era: bc}
          to: {year: 424, era: bc}
          label: >-
            in the reign of Xerxes (B. C. 485-65), and especially during the
            first half of the reign of Artaxerxes I (B. C. 465-24)

  - id: israel.restoration.first-pasch-in-the-second-temple
    title: The pasch kept after the dedication of the second Temple
    parent: israel.restoration.second-temple-completed
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Esdras 6:19 dates it to the day: "And the
          children of Israel of the captivity kept the phase, on the
          fourteenth day of the first month."
        sources: [bible:douay-rheims:1Esd.6.19]
        note: >-
          Month and day, and no year. The year is the one 6:15 gives regnally
          for the finishing of the house, "the sixth year of the reign of king
          Darius", and which Darius that is is disputed among the Catholic
          sources; that dispute lives on the completion event and is not
          restated here.
        date:
          precision: month-day
          from: {month: 1, day: 14, calendar: hebrew}
          label: "on the fourteenth day of the first month"

  - id: israel.restoration.esdras-reform-of-marriages
    title: The reform of the strange marriages under Esdras
    note: >-
      Scripture places the reform after Esdras's arrival and gives it no year
      of its own; the two stages below carry the month and day the text does
      give.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Esdras 9:1 anchors the reform to what
          precedes it and to nothing else: "And after these things were
          accomplished, the princes came to me, saying: The people of Israel,
          and the priests and Levites have not separated themselves from the
          people of the lands". Souvay's "Esdras" (Catholic Encyclopedia, New
          York, 1909) places it the same way: "The first task which confronted
          him was that of dealing with mixed marriages."
        sources:
          - bible:douay-rheims:1Esd.9.1
          - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778
        note: >-
          Relative to the return of Esdras, whose own year is disputed in the
          Catholic Encyclopedia between about 458 and as late as 397 B.C. That
          dispute is held on the return event and is not resolved here.
        date:
          precision: relative
          relative:
            of: israel.restoration.esdras-return
            statement: >-
              And after these things were accomplished, the princes came to me
          label: "after these things were accomplished"

  - id: israel.restoration.strange-wives-assembly
    title: The assembly at Jerusalem concerning the strange wives
    parent: israel.restoration.esdras-reform-of-marriages
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Esdras 10:9 dates the assembly to the
          day: "Then all the men of Juda, and Benjamin gathered themselves
          together to Jerusalem within three days, in the ninth month, the
          twentieth day of the month: and all the people sat in the street of
          the house of God, trembling because of the sin, and the rain."
        sources: [bible:douay-rheims:1Esd.10.9]
        note: >-
          Month and day, and no year; the year is the disputed one of Esdras's
          mission.
        date:
          precision: month-day
          from: {month: 9, day: 20, calendar: hebrew}
          label: "in the ninth month, the twentieth day of the month"

  - id: israel.restoration.strange-wives-put-away
    title: The sessions of the commission and the putting away of the strange wives
    parent: israel.restoration.esdras-reform-of-marriages
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 1 Esdras 10:16 gives the commission's first
          sitting -- the heads of families "went and sat down in the first day
          of the tenth month to examine the matter" -- and 10:17 its last:
          "And they made an end with all the men that had taken strange wives
          by the first day of the first month." Souvay's "Esdras" (Catholic
          Encyclopedia, New York, 1909) states the same span as a duration:
          "For three full months this commission held its sessions; at the end
          of that time the 'strange wives' were dismissed."
        sources:
          - bible:douay-rheims:1Esd.10.16
          - bible:douay-rheims:1Esd.10.17
          - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778
        note: >-
          The two endpoints are months and days without years, and they cross
          the turn of the year, so no range with endpoints can be authored
          from them; the three full months Souvay states are carried instead,
          as the length they are.
        date:
          precision: duration
          duration:
            months: 3
            statement: >-
              For three full months this commission held its sessions; at the
              end of that time the 'strange wives' were dismissed
          label: >-
            sat down in the first day of the tenth month ... made an end ... by
            the first day of the first month

  - id: israel.restoration.reign-of-artaxerxes-i
    title: The reign of Artaxerxes I
    note: >-
      Held only because it is the origin the regnal years of 1 and 2 Esdras are
      counted from, the way apostolic-age.accession-of-vespasian is held only
      as the origin of a patristic reckoning. This corpus holds no other
      Persian regnal chronology and authors none here.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Albin Van Hoonacker's "Book of Nehemiah" (Catholic Encyclopedia, New
          York, 1911) prints the reign in his own voice: "Already in the reign
          of Xerxes (B. C. 485-65), and especially during the first half of the
          reign of Artaxerxes I (B. C. 465-24), the Jews had attempted, but
          with only partial success, to rebuild the walls of their capital."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067]
        note: >-
          A range: the reign SPANS these years, and its first year is the
          origin the twentieth year of 2 Esdras 1:1 and 2:1 is counted from.
          The figures are the article's own and are not reconciled with any
          other chronology this corpus holds. The article's further sentence
          that "the first mission of Nehemiah fell in the year B.C. 445" is
          deliberately NOT carried anywhere in this corpus: the article grounds
          it on "the opinion of most historians of Israel" and on the
          Elephantine papyri published by Sachau, which is a reported opinion
          and a modern-critical ground, and this profile adopts neither.
        date:
          precision: range
          from: {year: 465, era: bc}
          to: {year: 424, era: bc}
          label: "Artaxerxes I (B. C. 465-24)"

  - id: israel.restoration.nehemias-tidings-of-jerusalem
    title: The tidings of Jerusalem brought to Nehemias at Susa
    parent: israel.restoration.nehemias-mission
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Esdras 1:1 dates it regnally and by the
          month: "The words of Nehemias the son of Helchias. And it came to
          pass in the month of Casleu, in the twentieth year, as I was in the
          castle of Susa". Van Hoonacker's "Book of Nehemiah" (Catholic
          Encyclopedia, New York, 1911) reads it the same way: Nehemias
          "relates how, at the court of Artaxerxes at Susa where he fulfilled
          the office of the king's cup-bearer, he received the news of this
          calamity in the twentieth year of the king".
        sources:
          - bible:douay-rheims:2Esd.1.1
          - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067
        note: >-
          Casleu is named without a day and the twentieth year is a regnal
          year, not an era year, and it is counted from the first year of the
          king: the anchor is therefore the reign itself, whose first year Van
          Hoonacker prints as B.C. 465, and no era year is produced here. It
          was formerly anchored on the calamity the tidings report, the event
          israel.restoration.walls-forbidden-by-artaxerxes, on the ground that
          "this corpus holds no first year of Artaxerxes to count it from";
          that ground was false against the registered source, and the
          substitution gave the regnal number no determinate origin at all,
          because that event is an interval of sixty-one years spanning two
          reigns. The calamity is still what the tidings report -- the forcible
          stopping of the work under that king's edict, which Van Hoonacker's
          sentence calls "this calamity" -- and it is named in the basis rather
          than made the origin of a numbered regnal year. The mission the
          tidings occasion stands later in the same twentieth year, "the month
          of Nisan, in the twentieth year of Artaxerxes the king" (2 Esdras
          2:1).
        date:
          precision: relative
          relative:
            of: israel.restoration.reign-of-artaxerxes-i
            statement: >-
              in the month of Casleu, in the twentieth year
          label: "in the month of Casleu, in the twentieth year"

  - id: israel.restoration.wall-of-jerusalem-finished
    title: The finishing of the wall of Jerusalem in fifty-two days
    parent: israel.restoration.nehemias-mission
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Esdras 6:15 dates the finishing to the
          day and gives the work's length: "But the wall was finished the five
          and twentieth day of the month of Elul, in two and fifty days."
        sources:
          - bible:douay-rheims:2Esd.6.15
          - bible:douay-rheims:1Mach.14.27
          - bible:douay-rheims:1Mach.4.52
        note: >-
          Elul is named and not numbered. No source inspected for this corpus
          numbers it: 2 Esdras 6:15 gives the name alone, 1 Machabees 14:27
          likewise ("The eighteenth day of the month Elul"), and neither
          Souvay's "Esdras" nor Van Hoonacker's "Book of Nehemiah" assigns it
          an ordinal. So no month number is carried, and the
          claim states the fifty-two days as the duration they are, contained
          in the mission. The corpus numbers a Hebrew month only where a ranked
          source states the ordinal -- Casleu is
          written as month 9 on israel.maccabees.feast-of-dedication because 1
          Machabees 4:52 states it -- and nothing states this one. The year is
          the twentieth of Artaxerxes, a regnal year, and is not converted here.
          Van Hoonacker's "Book of Nehemiah" prints a different figure
          for the duration -- "We learn from vii, 15 that the work was
          completely finished within fifty-one days" -- and reports and rejects
          a third: "Josephus (Ant., V, 7, 8) says that it lasted two years and
          four months, but his testimony, often far from reliable, presents no
          plausible reason for setting aside the text." Neither is harmonized
          with the Douay-Rheims fifty-two.
        date:
          precision: duration
          duration:
            days: 52
            statement: >-
              finished the five and twentieth day of the month of Elul, in two
              and fifty days
            within: israel.restoration.nehemias-mission
          label: "the five and twentieth day of the month of Elul, in two and fifty days"

  - id: israel.restoration.reading-of-the-law
    title: The reading of the Law by Esdras before the people
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Esdras 8:2 dates it to the day: "Then
          Esdras the priest brought the law before the multitude of men and
          women, and all those that could understand, in the first day of the
          seventh month." Souvay's "Esdras" (Catholic Encyclopedia, New York,
          1909) reports it identically and names the month: "On the first day
          of the seventh month (Tishri), a great meeting was held 'in the
          street that was before the watergate', for the purpose of reading
          the Law."
        sources:
          - bible:douay-rheims:2Esd.8.2
          - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778
        note: >-
          Month and day; no year is stated by either witness. Souvay places
          the reading after the rebuilding of the walls -- "At any rate we find
          him again in the latter city at the reading of the Law which took
          place after the rebuilding of the walls" -- while Van Hoonacker's
          "Book of Nehemiah" holds that at this time "Esdras was at the
          beginning of his career" and that his own mission followed under
          Artaxerxes II. The two orderings are the standing dispute carried on
          the Esdras and Nehemias events, and nothing here settles it.
        date:
          precision: month-day
          from: {month: 7, day: 1, calendar: hebrew}
          label: "in the first day of the seventh month"

  - id: israel.restoration.covenant-renewed
    title: The fast of the twenty-fourth day and the renewing of the covenant
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of 2 Esdras 9:1 dates the assembly to the day:
          "And in the four and twentieth day of the month the children of
          Israel came together with fasting and with sackcloth, and earth upon
          them." Van Hoonacker's "Book of Nehemiah" (Catholic Encyclopedia,
          New York, 1911) supplies the month the verse leaves implicit: "When
          this feast is over, the people gather together again on the
          twenty-fourth day of the seventh month (ix, 1 ff.) to praise God,
          confess their sins, and to bind themselves by a written covenant
          faithfully to observe their obligations."
        sources:
          - bible:douay-rheims:2Esd.9.1
          - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067
        note: >-
          The month is the article's reading of "the month" of 9:1, carried
          forward from the seventh month of 8:2; the verse itself names no
          month. Souvay's "Esdras" places the fast the same way without
          numbering the month: "two days after its close a strict fast was
          held". No year is stated by any witness inspected.
        date:
          precision: month-day
          from: {month: 7, day: 24, calendar: hebrew}
          label: "in the four and twentieth day of the month"
  # === lane exodus ===
  # --- Exodus: the years before the going out ---------------------------------
  - id: israel.exodus.moses-in-madian
    title: The flight of Moses into Madian and the years of his shepherd life
    note: >-
      Exodus itself dates this stretch only by two vague phrases - "In those
      days, after Moses was grown up" at 2:11 and "after a long time the king
      of Egypt died" at 2:23. The forty years are St Stephen's, in the Acts,
      and are recorded here because Scripture states them somewhere, not
      because the number would otherwise be convenient.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Acts 7:23 in the Douay-Rheims dates the flight by Moses' age: "And
          when he was full forty years old, it came into his heart to visit his
          brethren, the children of Israel." Acts 7:29-30 then measures the
          sojourn that followed: "And Moses fled upon this word: and was a
          stranger in the land of Madian, where he begot two sons. And when
          forty years were expired, there appeared to him, in the desert of
          mount Sina, an angel in a flame of fire in a bush."
        sources:
          - bible:douay-rheims:Acts.7.23
          - bible:douay-rheims:Acts.7.30
          - bible:douay-rheims:Ex.2.11
        note: >-
          A span measured in Moses' own years and in no era. St Stephen's two
          forties are a speech in the Acts about an event in Exodus; they are
          used here as Scripture's own chronological statement, which is what
          rank 1 of the authority hierarchy is, and the corpus does not add
          them to anything to reach a year.
        date:
          precision: relative
          relative:
            of: israel.exodus.birth-of-moses
            statement: "And when he was full forty years old, it came into his heart to visit his brethren, the children of Israel"
          label: "full forty years old"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Moses" states the same term of the
          shepherd life in its own voice: "After forty years of shepherd life,
          Moses speaks with God."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10596a-59d1207b]
        note: >-
          Not a rival claim about the same moment. The preferred claim above
          dates the beginning of this stretch, by Moses' age when he fled - Acts
          7:23, "when he was full forty years old" - and this one dates its end,
          the vision at the bush after the shepherd years were over, which is
          the same terminus Acts 7:30 states in the words "And when forty years
          were expired". The two are the two ends of one span and they agree;
          this one is kept beneath the other because the corpus dates the event
          from its beginning, and because the encyclopedia is a rank-6 source
          where Acts is Scripture's own statement at rank 1. The title is
          compound for that reason: it holds the flight and the years that
          followed it as one stretch, and the two claims fix its two ends. The
          article prints no year in any era for the flight; the only absolute
          figure on its page is the opening sentence placing Moses "in the
          thirteenth and early part of the twelfth
          century, B. C.", which follows that article's late Exodus and is the
          profile boundary already recorded at the death of Moses.
        date:
          precision: relative
          relative:
            of: israel.exodus.burning-bush
            statement: "After forty years of shepherd life, Moses speaks with God"
          label: "forty years of shepherd life"
  - id: israel.exodus.return-of-moses-to-egypt
    title: The return of Moses from Madian into Egypt
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 4:18-20 narrates the return as the immediate sequel of the
          vocation at the bush, with no interval between them: "Moses went his
          way, and returned to Jethro his father in law, and said to him; I
          will go and return to my brethren into Egypt ... Moses therefore took
          his wife, and his sons, and set them upon an ass; and returned into
          Egypt, carrying the rod of God in his hand."
        sources:
          - bible:douay-rheims:Ex.4.18
          - bible:douay-rheims:Ex.4.20
        note: >-
          Scripture states no length for the journey and no year for it, so
          nothing but the sequence is recorded. The Haydock edition's
          uninitialled apparatus prints A. M. 2513 at the head of Exodus 3 and
          A. M. 2518 at the transition into Exodus 5, five years apart across
          the chapters this event stands between; that discrepancy is already
          recorded at the two events themselves and is not resolved by putting
          this journey in either year.
        date:
          precision: relative
          relative:
            of: israel.exodus.burning-bush
            statement: "Moses went his way, and returned to Jethro his father in law, and said to him; I will go and return to my brethren into Egypt"
          label: "I will go and return to my brethren into Egypt"
  - id: israel.exodus.the-plagues-of-egypt
    title: The ten plagues of Egypt
    note: >-
      A series, not a point. The only measured interval inside it that
      Scripture states is the seven days of Exodus 7:25; the only seasonal
      bracket a ranked source prints is the Catholic Encyclopedia's, and that
      article opens by refusing the question outright.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 7:25 in the Douay-Rheims measures the one interval Scripture
          states within the series: "And seven days were fully ended, after
          that the Lord struck the river." Exodus 9:31-32 fixes the season of
          the seventh plague by the state of the crops: "The flax therefore,
          and the barley were hurt, because the barley was green, and the flax
          was now bolled; But the wheat, and other winter corn were not hurt,
          because they were lateward."
        sources:
          - bible:douay-rheims:Ex.5.1
          - bible:douay-rheims:Ex.7.25
          - bible:douay-rheims:Ex.9.31
          - bible:douay-rheims:Ex.12.29
        note: >-
          The series runs from the first audience at Exodus 5 to the slaying of
          the firstborn on the night of the departure at Exodus 12:29, which is
          the tenth plague and belongs also to the Exodus itself; that first
          audience is the anchor named here and it carries the opening of the
          series and nothing else. The seven days of Exodus 7:25 are NOT
          measured from it and are deliberately no longer carried in the date:
          the verse counts them from the striking of the river, "And seven days
          were fully ended, after that the Lord struck the river", and between
          the audience of Exodus 5 and that striking stand Moses's return to
          Pharao and the rod-and-serpent sign, so anchor plus that clause
          asserted an interval Scripture does not state. They are an interval
          INSIDE the series, between the first plague and the second, and this
          corpus holds no event for the striking of the river to carry them on;
          the alternate claim below records the Catholic Encyclopedia reading
          them the same way. Scripture gives the whole no year and no total
          length, and the state of the barley and flax is a season and not a
          month; neither is turned into one here.
        date:
          precision: relative
          relative:
            of: israel.exodus.moses-before-pharao
            statement: >-
              The series opens at the first audience before Pharao, "Moses and
              Aaron went in, and said to Pharao: Thus saith the Lord God of
              Israel: Let my people go", and closes at the slaying of the
              firstborn, "at midnight, the Lord slew every firstborn in the
              land of Egypt"
          label: "from the first audience before Pharao to the slaying of the firstborn"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis: >-
          The Catholic Encyclopedia's "Plagues of Egypt" brackets the close of
          the series by the season: "The last four must have followed in close
          succession between the beginning of March and the first days of
          April. For when the hail fell barley was in the ear and flax in bud,
          which in Lower Egypt happens about March, and the Israelites left on
          the 14th of Nisan, which falls in the latter part of March or the
          early part of April."
        sources: [artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12143a-0612afa4]
        note: >-
          The article's own first word on the question is a refusal - "The
          interval of time within which they occurred cannot be stated with
          certainty" - and it holds the refusal open for the earlier plagues:
          "The first six seem also to have succeeded one another at short
          intervals, but the interval, if any, between them and the last four
          is uncertain." What it prints is therefore a season for four of the
          ten and no year in any era for any of them, and it is recorded as
          such rather than as a date for the series. The same article states
          that "The second plague came seven days later", which is the
          encyclopedia reading the seven days of Exodus 7:25 the same way this
          entry's preferred claim does. The anchor named here stands at the
          window's CLOSE and not at its start: the article reaches the bracket
          by reasoning back from the departure, "the Israelites left on the
          14th of Nisan, which falls in the latter part of March or the early
          part of April", so the Exodus is what closes the season, and the
          statement says the whole of what the article states. The corpus holds
          no shape for a month-to-month window with no year - precision
          interval requires years in an era - so the season is carried as the
          article's own sentence and not as endpoints.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: "The last four must have followed in close succession between the beginning of March and the first days of April"
          label: "the last four, between the beginning of March and the first days of April"

  - id: israel.exodus.passage-of-the-red-sea
    title: The passage of the Red Sea
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 14:21-22 in the Douay-Rheims narrates the crossing: "And when
          Moses had stretched forth his hand over the sea, the Lord took it away
          by a strong and burning wind blowing all the night, and turned it into
          dry ground: and the water was divided. And the children of Israel went
          in through the midst of the sea dried up; for the water was as a wall
          on their right hand and on their left." The itinerary of Numbers 33:8
          enters the same passage: "And departing from Phihahiroth, they passed
          through the midst of the sea into the wilderness."
        sources:
          - bible:douay-rheims:Ex.14.21
          - bible:douay-rheims:Ex.14.22
          - bible:douay-rheims:Num.33.8
        note: >-
          Held because it is the origin both Exodus 15:22 and Numbers 33:8
          measure the three days' march to Mara from, and this corpus held no
          event for it. Scripture gives the passage no year, month or day of any
          era and none is supplied: Numbers 33:3-7 puts Soccoth, Etham and
          Phihahiroth between the departure from Ramesses on the fifteenth day
          of the first month and the sea, and states no interval for any of
          them, so the anchor below carries the order of the itinerary and no
          length at all.
        date:
          precision: relative
          relative:
            of: israel.exodus.the-exodus
            statement: >-
              And departing from Phihahiroth, they passed through the midst of
              the sea into the wilderness
          label: "they passed through the midst of the sea into the wilderness"

  # --- The wilderness: the stages of the march to Sinai -----------------------
  - id: israel.wilderness.mara-and-elim
    title: The three days' march to Mara, and the encampment at Elim
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 15:22 in the Douay-Rheims measures the march from the sea:
          "And Moses brought Israel from the Red Sea, and they went forth into
          the wilderness of Sur: and they marched three days through the
          wilderness, and found no water." Numbers 33:8 enters the same three
          days in the itinerary: "having marched three days through the
          desert of Etham, they camped in Mara."
        sources:
          - bible:douay-rheims:Ex.15.22
          - bible:douay-rheims:Num.33.8
        note: >-
          Both cited verses measure the three days from the passage of the Red
          Sea and not from the departure out of Egypt - "And Moses brought
          Israel from the Red Sea ... and they marched three days through the
          wilderness", "And departing from Phihahiroth, they passed through the
          midst of the sea into the wilderness: and having marched three days
          through the desert of Etham, they camped in Mara" - and Numbers
          33:3-7 puts Soccoth, Etham and Phihahiroth between the departure from
          Ramesses and the sea, so the departure is not the origin of the three
          days. The anchor is therefore the passage of the sea. The far end of
          the stretch is fixed by Exodus 16:1, which puts the departure from
          Elim and the coming into the desert of Sin on the fifteenth day of
          the second month after the going out; Scripture does not say how long
          the camp at Elim lasted, and the corpus does not subtract to find out.
        date:
          precision: relative
          relative:
            of: israel.exodus.passage-of-the-red-sea
            statement: "they marched three days through the wilderness, and found no water"
          label: "three days through the wilderness"
  - id: israel.wilderness.raphidim
    title: The encampment at Raphidim, the water from the rock, and the battle with Amalec
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 17:1 in the Douay-Rheims places the camp between two dated
          stages: "Then all the multitude of the children of Israel setting
          forward from the desert of Sin, by their mansions, according to the
          word of the Lord, encamped in Raphidim, where there was no water for
          the people to drink." Exodus 19:2 closes it: "For departing out of
          Raphidim, and coming to the desert of Sinai, they camped in the same
          place, and there Israel pitched their tents over against the
          mountain."
        sources:
          - bible:douay-rheims:Ex.17.1
          - bible:douay-rheims:Ex.19.2
        note: >-
          Bounded on one side by the fifteenth day of the second month at
          Exodus 16:1 and on the other by the third month at Exodus 19:1, and
          given no day of its own by any source inspected for this corpus.
          Numbers 33:12-14 interposes the stations of Daphca and Alus between
          the desert of Sin and Raphidim without dating either.
        date:
          precision: relative
          relative:
            of: israel.wilderness.manna
            statement: "setting forward from the desert of Sin, by their mansions, according to the word of the Lord, encamped in Raphidim"
          label: "setting forward from the desert of Sin ... encamped in Raphidim"
  - id: israel.wilderness.jethro-and-the-judges
    title: The visit of Jethro and the appointment of the judges
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 18:5 in the Douay-Rheims places the visit at the camp by the
          mountain of God: "And Jethro, the kinsman of Moses, came with his
          sons, and his wife to Moses into the desert, where he was camped by
          the mountain of God." That camp is the one of the preceding chapter,
          where the Lord says at Exodus 17:6 "Behold I will stand there before
          thee, upon the rock Horeb, and thou shalt strike the rock, and water
          shall come out of it that the people may drink." The
          Catholic Encyclopedia's "Moses" narrates the same order: "The
          meeting with Jethro ends in an alliance with Madian, and the
          appointment of a corps of judges subordinate to Moses, to attend to
          minor decisions. At Sinai the Ten Commandments are promulgated."
        sources:
          - bible:douay-rheims:Ex.18.5
          - bible:douay-rheims:Ex.17.6
          - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10596a-59d1207b
        note: >-
          Where this episode stands in the march is a question the sources
          inspected for this corpus do not settle, and this claim does not
          settle it either: it records only that Exodus narrates it at the camp
          by the mountain of God, between Raphidim and the third month of
          Exodus 19:1. Deuteronomy 1:9-18 recalls the appointment of judges at
          Horeb before the departure from the mount, which some read as putting
          it after the promulgation of the Law rather than before; no year, and
          no month or day, is printed for it anywhere this corpus has read.
        date:
          precision: relative
          relative:
            of: israel.wilderness.raphidim
            statement: "came with his sons, and his wife to Moses into the desert, where he was camped by the mountain of God"
          label: "where he was camped by the mountain of God"

  # --- The wilderness: Sinai --------------------------------------------------
  - id: israel.wilderness.promulgation-of-the-law
    title: The promulgation of the Law at Sinai
    parent: israel.wilderness.arrival-at-sinai
    note: >-
      Held apart from the arrival at Sinai deliberately: the note on that event
      says that Exodus 19:1 "dates the arrival at Sinai, not the promulgation
      of the Law that follows at Exodus 20", and this is the event it was held
      apart from.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 19:11 in the Douay-Rheims appoints the day: "And let them be
          ready against the third day; for on the third day the Lord will come
          down in the sight of all the people, upon Mount Sinai." Exodus 19:16
          records it arriving: "And now the third day was come, and the morning
          appeared: and behold thunders began to be heard, and lightning to
          flash, and a very thick cloud to cover the mount, and the noise of the
          trumpet sounded exceeding loud; and the people that was in the camp,
          feared."
        sources:
          - bible:douay-rheims:Ex.19.11
          - bible:douay-rheims:Ex.19.16
        note: >-
          The third day is counted from the sanctifying commanded at Exodus
          19:10, which follows the coming into the wilderness of Sinai in the
          third month of the departure. It is a day within that month and not a
          day of any era, so it is recorded as relative and not as a month-day.
          The Catholic Encyclopedia's "Moses" says only "At Sinai the Ten
          Commandments are promulgated" and prints no date for it.
        date:
          precision: relative
          relative:
            of: israel.wilderness.arrival-at-sinai
            statement: "And now the third day was come, and the morning appeared"
          label: "the third day"
  - id: israel.wilderness.covenant-at-sinai
    title: The sealing of the covenant at the foot of the mount
    parent: israel.wilderness.arrival-at-sinai
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Exodus 24:3-4 in the Douay-Rheims dates the sacrifice to the morning
          after the words were told to the people: "So Moses came and told the
          people all the words of the Lord, and all the judgments ... And Moses
          wrote all the words of the Lord: and rising in the morning, he built
          an altar at the foot of the mount, and twelve titles according to the
          twelve tribes of Israel."
        sources:
          - bible:douay-rheims:Ex.24.3
          - bible:douay-rheims:Ex.24.4
        note: >-
          Exodus 24:4 also states that Moses wrote the words, and Exodus 24:7
          that he read "the book of the covenant" to the people. That is a
          statement about writing and would be a composition claim, not a
          narrated event; it is deliberately not authored as one here, because
          the extent it would cover is a matter this corpus has inspected no
          ranked source settling, and because the received Catholic apparatus
          dates the writing of Exodus nowhere at all.
        date:
          precision: relative
          relative:
            of: israel.wilderness.promulgation-of-the-law
            statement: "rising in the morning, he built an altar at the foot of the mount"
          label: "rising in the morning"
  - id: israel.wilderness.making-of-the-tabernacle
    title: The making of the tabernacle and its furniture
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Scripture dates the work by its completion and by nothing else.
          Exodus 39:43: "And when Moses saw all things finished, he blessed
          them." Exodus 40:2 gives the day the finished work was to be raised:
          "The first month, the first day of the month, thou shalt set up the
          tabernacle of the testimony", and Exodus 40:15 records it done: "So
          in the first month of the second year, the first day of the month,
          the tabernacle was set up."
        sources:
          - bible:douay-rheims:Ex.39.43
          - bible:douay-rheims:Ex.40.2
          - bible:douay-rheims:Ex.40.15
        note: >-
          No source inspected for this corpus states when the work began, how
          long it took, or what year in any era it fell in. What is recorded is
          only that Exodus places its completion before the day the tabernacle
          was set up, and that day is itself counted from the Exodus and is not
          a day of any era. The Catholic Encyclopedia's "Moses" passes over the
          work in a subordinate clause - "After instituting the priesthood and
          erecting the Tabernacle, Moses orders a census" - and dates neither.
        date:
          precision: relative
          relative:
            of: israel.wilderness.erection-of-the-tabernacle
            statement: "And when Moses saw all things finished, he blessed them"
          label: "And when Moses saw all things finished, he blessed them"
  # === lane ezechiel ===
  # --- Ezechiel: the prophet's ministry, and the fourteen oracles he dates ---
  # Ezechiel dates his own oracles by the years of the captivity of Joachin,
  # which is why every claim below is `relative` and anchored to
  # israel.exile.second-captivity rather than converted to a year of any era.
  # No inspected source performs that conversion, so this corpus does not.
  - id: israel.exile.ezechiel.ministry
    title: The prophetic ministry of Ezechiel among the exiles by the river Chobar
    note: >-
      Schets's "Ezekiel" (Catholic Encyclopedia, New York, 1909) says the
      prophet was "one of the priests who, in the year 598 B.C., had been
      deported together with Joachim as prisoners from Jerusalem". That 598 is
      one year earlier than the "597 B.C." George Reid's "Captivities of the
      Israelites" gives for the same deportation and is held as an alternate on
      israel.exile.second-captivity, and it is on a different reckoning again
      from the "A.M. 3405" the Haydock edition prints and that event prefers.
      The three figures are not one another's conversions and are not
      harmonised here; the ministry itself carries only the length the
      encyclopedia states and no B.C. year of its own, and the dateline of its
      beginning is held where Scripture puts it, on
      israel.exile.ezechiel.call.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Schets's "Ezekiel" in the Catholic Encyclopedia fixes both ends of the
          ministry without printing a year for either: "In the fifth year after
          the captivity of Joachim, and according to some, the thirtieth year of
          his life, Ezekiel received his call as a prophet (Ezek. i, 2, 4 etc)
          in the vision which he describes in the beginning of his prophecy",
          and "From Ezek. xxix, 17 it appears that he prophesied during at least
          twenty-two years." The Douay-Rheims text supplies the two datelines
          the article reckons from: "the fifth year of the captivity of king
          Joachin" (Ezech. 1:2) and "in the seven and twentieth year in the
          first month, in the first of the month" (Ezech. 29:17).
        sources:
          - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
          - bible:douay-rheims:Ezech.1.2
          - bible:douay-rheims:Ezech.29.17
        note: >-
          "At least twenty-two years" is the encyclopedia's own bound and its
          own hedge, drawn by subtracting the fifth year of the captivity from
          the twenty-seventh; the duration carries the twenty-two as the
          minimum the encyclopedia states, and its "at least" stands in the
          statement, because it is a minimum and not a span: nothing in the
          book says the ministry ended at its latest dateline. That latest
          dateline is Ezech. 29:17, "the seven and twentieth year", and no verse
          of Ezechiel carries the reckoning past it: the vision of Ezech. 40:1,
          which stands last in the book, is dated two years EARLIER, "in the
          five and twentieth year of our captivity". The book's order is not its
          chronology here any more than it is at Ezech. 26:1 and 29:1. The
          encyclopedia leaves the two reckonings of "the thirtieth year" of
          Ezech. 1:1 unsettled and so does this claim.
        date:
          precision: duration
          duration:
            years: 22
            statement: >-
              From Ezek. xxix, 17 it appears that he prophesied during at
              least twenty-two years
          label: "he prophesied during at least twenty-two years"

  - id: israel.exile.ezechiel.call
    title: The call of Ezechiel and the vision of the glory by the river Chobar
    parent: israel.exile.ezechiel.ministry
    note: >-
      Scripture gives two reckonings in two consecutive verses and says of the
      first only "the thirtieth year", without saying of what. Ezech. 1:2 is the
      fixed point and is what this claim is anchored to. The other reckoning is
      reported by the Catholic Encyclopedia as an opinion and not adopted:
      "according to some, the thirtieth year of his life".
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text of Ezechiel 1:1-2 dates the vision to the day
          within the captivity: "Now it came to pass in the thirtieth year, in
          the fourth month, on the fifth day of the month, when I was in the
          midst of the captives by the river Chobar, the heavens were opened,
          and I saw the visions of God. On the fifth day of the month, the same
          was the fifth year of the captivity of king Joachin". Schets's
          "Ezekiel" in the Catholic Encyclopedia reads the same two verses the
          same way: "In the fifth year after the captivity of Joachim ...
          Ezekiel received his call as a prophet (Ezek. i, 2, 4 etc) in the
          vision which he describes in the beginning of his prophecy."
        sources:
          - bible:douay-rheims:Ezech.1.1
          - bible:douay-rheims:Ezech.1.2
          - bible:douay-rheims:Ezech.1.3
          - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
        note: >-
          Day-precise, but only within the captivity's own reckoning and in the
          Hebrew months; there is no era anchor in the passage and no inspected
          source converts one. The "thirtieth year" is carried in the statement
          exactly as printed and is not resolved.
        date:
          precision: relative
          relative:
            of: israel.exile.second-captivity
            statement: >-
              in the thirtieth year, in the fourth month, on the fifth day of
              the month ... the same was the fifth year of the captivity of
              king Joachin
          label: >-
            in the thirtieth year, in the fourth month, on the fifth day of the
            month ... the same was the fifth year of the captivity of king
            Joachin

  - id: israel.exile.ezechiel.watchman-charge
    title: The word making Ezechiel watchman to the house of Israel, seven days after the vision
    parent: israel.exile.ezechiel.ministry
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          The Douay-Rheims text dates this word by counting from the vision it
          follows: "I remained there seven days mourning in the midst of them"
          (Ezech. 3:15), "And at the end of seven days the word of the Lord came
          to me, saying" (Ezech. 3:16).
        sources:
          - bible:douay-rheims:Ezech.3.15
          - bible:douay-rheims:Ezech.3.16
        note: >-
          The only one of Ezechiel's fourteen datelines that names no year,
          month or day at all: it is an interval from the preceding vision, so
          it is anchored to that vision and to nothing else.
        date:
          precision: relative
          relative:
            of: israel.exile.ezechiel.call
            statement: at the end of seven days
          label: "at the end of seven days"

