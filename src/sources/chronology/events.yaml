        date:
          precision: relative
          relative:
            of: israel.maccabees.seleucid-era
            statement: >-
              on the fifteenth day of the month, Casleu, in the hundred and
              forty-fifth year
          label: >-
            On the fifteenth day of the month, Casleu, in the hundred and
            forty-fifth year

  - id: israel.maccabees.rising-under-mathathias
    title: The rising under Mathathias
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Howlett's "Biblical Chronology" (Catholic Encyclopedia, New York,
