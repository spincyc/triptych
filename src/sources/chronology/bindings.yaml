  # --- Retrospective: passages that RECALL, and do not narrate --------------
  - relation: retrospective-event
    event: israel.exodus.the-exodus
    scope:
      - {book: Ps, chapter: 77, first: 12, last: 13}
      - {book: Ps, chapter: 77, first: 42, last: 53}
      - {book: Ps, chapter: 104, first: 26, last: 38}
      - {book: Ps, chapter: 104, first: 43, last: 43}
      - {book: Ps, chapter: 105, first: 7, last: 12}
      - {book: Ps, chapter: 105, first: 21, last: 22}
      - {book: Ps, chapter: 113, first: 1, last: 5}
      - {book: Ps, chapter: 135, first: 10, last: 15}
      - {book: Ps, chapter: 80, first: 6, last: 7}
      - {book: 2Esd, chapter: 9, first: 9, last: 12}
      - {book: Acts, chapter: 7, first: 36, last: 36}
    note: >-
      The classic case of the distinction this corpus exists to make. Not one
      of these passages narrates the going out of Egypt; each recites it as
      something already done, to a people already delivered. Psalms are in
      vulgate numbers: 77 is the Hebrew 78, 104 the Hebrew 105, 105 the Hebrew
      106, 113 the Hebrew 114-115, 135 the Hebrew 136.
    sources:
      - bible:douay-rheims:Ps.77.12
      - bible:douay-rheims:Ps.104.26
      - bible:douay-rheims:Ps.105.7
      - bible:douay-rheims:Ps.113.1
      - bible:douay-rheims:Ps.135.10
      - bible:douay-rheims:2Esd.9.9
  - relation: retrospective-event
    event: israel.wilderness.manna
    scope:
      - {book: Ps, chapter: 77, first: 23, last: 25}
      - {book: Ps, chapter: 104, first: 40, last: 40}
      - {book: Deut, chapter: 8, first: 3, last: 3}
      - {book: 2Esd, chapter: 9, first: 15, last: 15}
      - {book: 2Esd, chapter: 9, first: 20, last: 20}
    note: >-
      "He had rained down manna upon them to eat" — recital, not narration. The
      narration is Exodus 16, bound above.
    sources: [bible:douay-rheims:Ps.77.24, bible:douay-rheims:Deut.8.3]
  - relation: retrospective-event
    event: israel.wilderness.forty-years-in-the-desert
    scope:
      - {book: Deut, chapter: 8, first: 2, last: 4}
      - {book: Deut, chapter: 29, first: 5, last: 5}
      - {book: Jos, chapter: 5, first: 6, last: 6}
      - {book: Ps, chapter: 94, first: 9, last: 11}
      - {book: Ps, chapter: 77, first: 40, last: 41}
      - {book: Ps, chapter: 105, first: 24, last: 27}
      - {book: Ps, chapter: 135, first: 16, last: 16}
      - {book: 2Esd, chapter: 9, first: 21, last: 21}
      - {book: Acts, chapter: 7, first: 42, last: 42}
    note: >-
      Every one of these looks back on the forty years as completed or nearly
      so — Moses in Moab, the narrator of Josue in a parenthesis, the psalmists
      long after. Numbers 32:13 narrates it and is bound separately.
    sources:
      - bible:douay-rheims:Deut.8.2
      - bible:douay-rheims:Jos.5.6
      - bible:douay-rheims:Ps.94.10
      - bible:douay-rheims:2Esd.9.21
  - relation: retrospective-event
    event: israel.wilderness.golden-calf
    scope:
      - {book: Deut, chapter: 9, first: 8, last: 21}
      - {book: Ps, chapter: 105, first: 19, last: 20}
      - {book: 2Esd, chapter: 9, first: 18, last: 18}
      - {book: Acts, chapter: 7, first: 39, last: 41}
    note: >-
      Deuteronomy 9 is Moses recounting Horeb to the generation that did not see
      it; the psalm and Esdras recite it in a confession; St Stephen recites it
      before the council.
    sources: [bible:douay-rheims:Deut.9.16, bible:douay-rheims:Ps.105.19]
  - relation: retrospective-event
    event: israel.wilderness.forty-days-on-the-mount
    scope:
      - {book: Deut, chapter: 9, first: 9, last: 11}
      - {book: Deut, chapter: 9, first: 18, last: 18}
    note: >-
      Moses' own recollection of the two fasts of forty days. Exodus 24:18 and
      34:28 narrate them.
    sources: [bible:douay-rheims:Deut.9.9]
  - relation: retrospective-event
    event: israel.wilderness.arrival-at-sinai
    scope:
      - {book: 2Esd, chapter: 9, first: 13, last: 14}
      - {book: Acts, chapter: 7, first: 38, last: 38}
    note: '"Thou camest down also to mount Sinai" — a recital in the mouth of the Levites, and of St Stephen.'
    sources: [bible:douay-rheims:2Esd.9.13]
  - relation: retrospective-event
    event: israel.primeval.creation
    scope:
      - {book: Ps, chapter: 135, first: 5, last: 9}
      - {book: 2Esd, chapter: 9, first: 6, last: 6}
    note: >-
      Both recite the making of heaven and earth in praise. Genesis 1 narrates
      it, and the two relations are deliberately not the same binding.
    sources: [bible:douay-rheims:Ps.135.5, bible:douay-rheims:2Esd.9.6]
  - relation: retrospective-event
    event: israel.patriarchs.call-of-abram
    scope:
      - {book: Jos, chapter: 24, first: 2, last: 3}
      - {book: 2Esd, chapter: 9, first: 7, last: 8}
      - {book: Acts, chapter: 7, first: 2, last: 5}
    note: >-
      "I took your father Abraham from the borders of Mesopotamia"; "thou ...
      broughtest him forth out of the fire of the Chaldeans"; "before he dwelt
      in Charan". Three recitals of the going forth narrated at Genesis 12.
    sources:
      - bible:douay-rheims:Jos.24.3
      - bible:douay-rheims:2Esd.9.7
      - bible:douay-rheims:Acts.7.2
  - relation: retrospective-event
    event: israel.patriarchs.covenant-of-circumcision
    scope:
      - {book: Acts, chapter: 7, first: 8, last: 8}
    note: '"And he gave him the covenant of circumcision" — St Stephen reciting Genesis 17.'
    sources: [bible:douay-rheims:Acts.7.8]
  - relation: retrospective-event
    event: israel.egypt.descent
    scope:
      - {book: Jos, chapter: 24, first: 4, last: 4}
      - {book: Ps, chapter: 104, first: 23, last: 23}
      - {book: Acts, chapter: 7, first: 14, last: 15}
    sources: [bible:douay-rheims:Ps.104.23, bible:douay-rheims:Acts.7.14]
  - relation: retrospective-event
    event: israel.egypt.sojourn
    scope:
      - {book: Ps, chapter: 104, first: 24, last: 25}
      - {book: Acts, chapter: 7, first: 6, last: 6}
      - {book: Acts, chapter: 7, first: 17, last: 19}
    note: >-
      Acts 7:6 recites the four hundred years as they were foretold to Abraham;
      the corpus keeps that figure beside Exodus 12:40's four hundred and thirty
      on the event, and reconciles neither.
    sources: [bible:douay-rheims:Ps.104.24, bible:douay-rheims:Acts.7.6]
  - relation: retrospective-event
    event: israel.exodus.burning-bush
    scope:
      - {book: Acts, chapter: 7, first: 30, last: 34}
    note: St Stephen's recital, which supplies the forty years before the vision that Exodus 3 does not state.
    sources: [bible:douay-rheims:Acts.7.30]
  - relation: retrospective-event
    event: israel.wilderness.erection-of-the-tabernacle
    scope:
      - {book: Acts, chapter: 7, first: 44, last: 45}
    sources: [bible:douay-rheims:Acts.7.44]
  - relation: retrospective-event
    event: israel.conquest.crossing-of-the-jordan
    scope:
      - {book: Jos, chapter: 24, first: 11, last: 11}
      - {book: Ps, chapter: 113, first: 3, last: 5}
    note: >-
      Josue reciting at Sichem what Josue 3-4 narrates, and the psalm asking the
      Jordan why it was turned back. Neither is the crossing.
    sources: [bible:douay-rheims:Jos.24.11, bible:douay-rheims:Ps.113.3]
  - relation: retrospective-event
    event: israel.judges.jephte-three-hundred-years
    scope:
      - {book: Judg, chapter: 11, first: 26, last: 26}
    note: >-
      Jephte's message to the king of Ammon recalls three hundred years of
      possession already elapsed. The verse asserts a completed span; it
      narrates nothing, and the corpus does not treat it as the narration of the
      period.
    sources: [bible:douay-rheims:Judg.11.26]
  - relation: retrospective-event
    event: israel.judges.period
    scope:
      - {book: Acts, chapter: 13, first: 19, last: 20}
    note: >-
      St Paul at Antioch of Pisidia: "he gave unto them judges, until Samuel the
      prophet", with the four hundred and fifty years. A recital in a sermon,
      centuries after, and not a narration of the period.
    sources: [bible:douay-rheims:Acts.13.20]
