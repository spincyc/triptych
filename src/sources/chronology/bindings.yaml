  - relation: narrated-event
    event: israel.judges.samson-judgeship
    scope:
      - {book: Judg, chapter: 13, first: 2, through: 16}
    note: >-
      From the annunciation to Manue's wife to the burial between Saraa and
      Esthaol, the stretch across which the tracked Douay states the twenty
      years twice, at 15:20 and again at 16:31.
    sources: [bible:douay-rheims:Judg.15.20, bible:douay-rheims:Judg.16.31]
  # === lane kings ===
  # --- Samuel, Heli and the ark (1 Kings 1-7) -------------------------------
  - relation: narrated-event
    event: israel.judges.samuel-at-silo
    scope:
      - {book: 1Kings, chapter: 1, first: 1, last: 28}
      - {book: 1Kings, chapter: 2, first: 11, last: 26}
    note: >-
      Elcana at Silo, Anna's vow, the birth and weaning of Samuel and his
      presentation; then the child ministering before Heli while Heli's own sons
      grow worse. The canticle of Anna at 2:1-10 is bound separately as an
      utterance, and the oracle against Heli's house at 2:27-36 separately again,
      so that three different kinds of claim are not made to stand on one row.
    sources: [bible:douay-rheims:1Kings.1.20, bible:douay-rheims:1Kings.2.11]
  - relation: utterance
    event: israel.judges.samuel-at-silo
    scope:
      - {book: 1Kings, chapter: 2, first: 1, last: 10}
    note: >-
      The canticle of Anna, spoken at the presentation of the child at Silo:
      "My heart hath rejoiced in the Lord, and my horn is exalted in my God."
      Bechtel's "First and Second Books of Kings" marks off the same ten verses
      as a distinct piece — "The canticle of Anna (I, ii, 1-10) ... very probably
      also drawn from a written source" — which is a claim about a source and
      not about a date, and this binding carries no date either.
    sources:
      - bible:douay-rheims:1Kings.2.1
      - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08647b-a445d5a7
  - relation: prophecy-given
    event: israel.judges.heli-judgeship
    scope:
      - {book: 1Kings, chapter: 2, first: 27, last: 36}
      - {book: 1Kings, chapter: 3, first: 11, last: 14}
    note: >-
      Two oracles against the house of Heli, uttered while he still judged
      Israel: the man of God at 2:27, "And there came a man of God to Heli, and
      said to him: Thus saith the Lord", and the Lord's word to Samuel at 3:12,
      "In that day I will raise up against Heli all the things I have spoken
      concerning his house." This relation dates the speaking, which falls inside
      the forty years; what the oracles point forward to is a separate binding.
    sources: [bible:douay-rheims:1Kings.2.27, bible:douay-rheims:1Kings.3.12]
  - relation: prophetic-referent
    event: israel.judges.capture-of-the-ark
    scope:
      - {book: 1Kings, chapter: 2, first: 27, last: 36}
      - {book: 1Kings, chapter: 3, first: 11, last: 14}
    note: >-
      What the two oracles are read as foretelling, and the text itself makes the
      identification: 2:34, "And this shall be a sign to thee, that shall come
      upon thy two sons, Ophni and Phinees: in one day they shall both of them
      die", answered at 4:11, "And the ark of God was taken: and the two sons of
      Heli, Ophni and Phinees, were slain." A referent is not a narration: these
      verses do not report the day of Aphec, and the binding must not be read as
      saying they do.
    sources: [bible:douay-rheims:1Kings.2.34, bible:douay-rheims:1Kings.4.11]
  - relation: narrated-event
    event: israel.judges.call-of-samuel
    scope:
      - {book: 1Kings, chapter: 3, first: 1, last: 21}
    sources: [bible:douay-rheims:1Kings.3.1]
  - relation: narrated-event
    event: israel.judges.capture-of-the-ark
    scope:
      - {book: 1Kings, chapter: 4, first: 1, last: 11}
      - {book: 1Kings, chapter: 4, first: 19, last: 22}
    note: >-
      The battle at Aphec and the taking of the ark, and the death in childbirth
      of the wife of Phinees that follows on the same news. The intervening
      verses 12-18, which report the news reaching Silo and Heli's death, already
      carry the judgeship's own binding, where the forty years are counted.
    sources: [bible:douay-rheims:1Kings.4.11, bible:douay-rheims:1Kings.4.21]
  - relation: narrated-event
    event: israel.judges.ark-among-the-philistines
    scope:
      - {book: 1Kings, chapter: 5, first: 1, last: 12}
      - {book: 1Kings, chapter: 6, first: 1, last: 21}
    note: >-
      Azotus, Geth and Accaron, and then the sending back by the kine to
      Bethsames and the message to Cariathiarim. The seven months are stated at
      6:1, at the head of the return. 7:1-2, the arrival at Cariathiarim and the
      twentieth year, is the next event and is already bound.
    sources: [bible:douay-rheims:1Kings.6.1]
  - relation: narrated-event
    event: israel.judges.victory-at-maspha
    scope:
      - {book: 1Kings, chapter: 7, first: 3, last: 14}
    note: >-
      Samuel's summons to put away Baalim and Astaroth, the assembly and fast at
      Masphath, and the Philistine rout. 7:15-17, Samuel judging Israel all the
      days of his life, is the summary that closes the section and belongs to the
      period of the judges, where it is already bound.
    sources: [bible:douay-rheims:1Kings.7.6]

  # --- The demand for a king and Saul (1 Kings 8-12) ------------------------
  - relation: narrated-event
    event: israel.monarchy.demand-for-a-king
    scope:
      - {book: 1Kings, chapter: 8, first: 1, last: 22}
    sources: [bible:douay-rheims:1Kings.8.5]
  - relation: narrated-event
    event: israel.monarchy.anointing-of-saul
    scope:
      - {book: 1Kings, chapter: 9, first: 1, last: 27}
      - {book: 1Kings, chapter: 10, first: 1, last: 16}
    note: >-
      The search for the asses, the meeting with the seer, the anointing with the
      vial of oil and the signs, down to Saul's silence about the kingdom before
      his uncle. The election by lot from 10:17 is the founding of the monarchy
      and is bound to that event, not to this one.
    sources: [bible:douay-rheims:1Kings.10.1]
  - relation: narrated-event
    event: israel.monarchy.deliverance-of-jabes-galaad
    scope:
      - {book: 1Kings, chapter: 11, first: 1, last: 13}
    note: >-
      Naas the Ammonite before Jabes Galaad and Saul's relief of the city, "about
      a month after" the assembly at Maspha. The renewal of the kingdom at Galgal
      at 11:14-15 follows it and is already bound to the founding of the
      monarchy.
    sources: [bible:douay-rheims:1Kings.11.1]
  - relation: utterance
    event: israel.monarchy.saul-accession
    scope:
      - {book: 1Kings, chapter: 12, first: 1, last: 25}
    note: >-
      Samuel's discourse at Galgal, spoken at the renewal of the kingdom that
      11:14-15 reports and that the accession event already covers: "And Samuel
      said to all Israel: Behold I have hearkened to your voice in all that you
      said to me, and have made a king over you." An utterance binding says when
      the words were spoken and takes no position on when the chapter was
      written, which the composition unit over the book holds separately.
    sources: [bible:douay-rheims:1Kings.12.1]

  # --- Saul's death and the house of Saul (1 Kings 31; 2 Kings 1-4) ---------
  - relation: narrated-event
    event: israel.monarchy.death-of-saul
    scope:
      - {book: 1Kings, chapter: 31, first: 1, last: 13}
      - {book: 1Par, chapter: 10, first: 1, last: 14}
    note: >-
      Two accounts of one battle, kept as two scopes on one binding so that the
      parallel cannot acquire two dates. The warrant for treating them as one
      is the source's, not this corpus's: Bechtel's "First and Second Books of
      Kings" infers a shared document "from the passages common to I-II Kings
      and the First Book of Paralipomenon (Chronicles), which are shown in the
      following list", and the list's first row pairs "I K., xxxi" with
      "1 Chronicles 10:1-12". Of the list as a whole he writes that "these
      passages often agree word for word" and that "both authors made use of
      the same document". These verses already stand inside the reign of Saul;
      this binding says more narrowly that they narrate its last day. Bechtel's
      pairing stops at 1 Paralipomenon 10:12; the run carries two verses
      further because 10:13-14 is that book's judgment on Saul's death, which
      adds no chronology and belongs to the same day.
    sources:
      - bible:douay-rheims:1Kings.31.6
      - bible:douay-rheims:1Par.10.14
      - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08647b-a445d5a7
  - relation: narrated-event
    event: israel.monarchy.news-of-sauls-death
    scope:
      - {book: 2Kings, chapter: 1, first: 1, last: 27}
    note: >-
      The Amalecite's report at Siceleg on the third day, his execution, and the
      lamentation over Saul and Jonathan. The lament itself is bound again as an
      utterance.
    sources: [bible:douay-rheims:2Kings.1.2]
  - relation: utterance
    event: israel.monarchy.news-of-sauls-death
    scope:
      - {book: 2Kings, chapter: 1, first: 17, last: 27}
    note: >-
      The lament, spoken on the day the news came: "And David made this kind of
      lamentation over Saul, and over Jonathan his son." Bechtel's "First and
      Second Books of Kings" notes that the sacred writer here names an older
      book — "One such document, 'The Book of the Just', is mentioned in
      connection with David's lament over Saul and Jonathan (II, i, 18)" — which
      bears on the sources of the text and not on when the words were spoken.
    sources:
      - bible:douay-rheims:2Kings.1.17
      - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08647b-a445d5a7
  - relation: utterance
    event: israel.monarchy.david-accession
    scope:
      - {book: 2Kings, chapter: 2, first: 5, last: 7}
    note: >-
      David's message to the men of Jabes Galaad, sent as soon as he was anointed
      at Hebron and continuous with 2:4, which the accession's own binding
      already covers. The words quoted stand at 2 Kings 2:7, the last verse of
      the message: "Let your hands be strengthened, and be ye men of valour:
      for although your master Saul be dead, yet the house of Juda hath
      anointed me to be their king." The message opens at 2:5, which is why the
      scope begins there and why both verses are cited.
    sources: [bible:douay-rheims:2Kings.2.5, bible:douay-rheims:2Kings.2.7]
  - relation: narrated-event
    event: israel.monarchy.isboseth-reign
    scope:
      - {book: 2Kings, chapter: 2, first: 8, through: 4, last: 12}
    note: >-
      Abner's raising of Isboseth, the fight at Gabaon, the long war, Abner's
      going over to David and his murder by Joab, and the murder of Isboseth
      himself. The regnal formula at 2:10 is inside the run, and 2 Kings 5:1-3,
      where all Israel comes to David, belongs to the accession and is bound
      there.
    sources: [bible:douay-rheims:2Kings.2.10, bible:douay-rheims:2Kings.3.1]

  # --- David: birth and the numbering of the people -------------------------
  - relation: retrospective-event
    event: israel.monarchy.birth-of-david
    scope:
      - {book: 2Kings, chapter: 5, first: 4, last: 4}
    note: >-
      "David was thirty years old when he began to reign" looks back to a birth
      the sacred text nowhere dates. The binding records that the verse recalls
      it; the only year in the corpus for that birth is the Catholic
      Encyclopedia's "usual chronology" figure, and no arithmetic is done here
      between the two.
    sources: [bible:douay-rheims:2Kings.5.4]
  - relation: narrated-event
    event: israel.monarchy.numbering-of-the-people
    scope:
      - {book: 2Kings, chapter: 24, first: 1, last: 25}
      - {book: 1Par, chapter: 21, first: 1, last: 30}
    note: >-
      Two accounts of one census and one pestilence, kept as two scopes on one
      binding. The warrant is again Bechtel's own list of "the passages common
      to I-II Kings and the First Book of Paralipomenon", whose last row pairs
      "xxiv" with "21" — this census and this one. 1 Paralipomenon 27:23-24,
      which reports that Joab "began to number, but he finished not", is a
      notice inside the lists and is left out of the run; it is cited on the
      event instead. The two books name different movers, 2 Kings 24:1 "the
      anger of the Lord" and 1 Paralipomenon 21:1 "Satan"; this binding takes
      no position on that, because what both narrate is the numbering, and the
      numbering is what is dated.
    sources:
      - bible:douay-rheims:2Kings.24.8
      - bible:douay-rheims:1Par.21.1
      - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08647b-a445d5a7
  # === lane numbers ===
  # === bind-numbers ====================================================
  # Numbers dates itself more often than any other book of the Pentateuch, and
  # the datelines are the spine of these rows: Num 1:1, 7:1, 9:1-5, 10:11,
  # 20:1, 33:3 and 33:38. Where the book states no date, nothing here supplies
  # one; the legislative and census material is bound to the encampment it
  # stands in and to nothing finer.
  - relation: historical-setting
    event: israel.wilderness.encampment-at-sinai
    scope:
      - {book: Num, chapter: 1, through: 9}
      - {book: Num, chapter: 10, first: 1, last: 10}
    note: >-
      The occasion of the whole first section, and deliberately not a date for
      any part of it. Numbers 1:1 speaks "in the desert of Sinai", Numbers 9:1
      again "in the desert of Sinai", Numbers 9:5 keeps the phase "in mount
      Sinai", and Numbers 10:12 marches "from the desert of Sinai", so the
      section stands wholly inside the encampment. The three dated moments
      inside it - the numbering, the dedication of the altar, the phase - carry
      their own narrated-event bindings and their own dates. The divine
      speeches of Numbers 5, 6, 8 and 10:1-10, the cloud of Numbers 9:15-23,
      and the numbering of the Levites in Numbers 3 and 4 carry no date beyond
      this occasion and are given none.
    sources:
      - bible:douay-rheims:Num.1.1
      - bible:douay-rheims:Num.9.1
      - bible:douay-rheims:Num.10.12
  - relation: narrated-event
    event: israel.wilderness.numbering-at-sinai
    scope:
      - {book: Num, chapter: 1, through: 4}
    note: >-
      The census and the ordering of the camp that Numbers 1:1 dates to "the
      first day of the second month, the second year of their going out of
      Egypt". Chapters 2 to 4 are the same operation continued - the camp drawn
      up by standards, and the sons of Levi numbered "in the desert of Sinai"
      (3:14-15) - and are bound with it because Numbers 26:64 looks back on the
      whole as what was "numbered before by Moses and Aaron in the desert of
      Sinai". They carry no separate date and none is authored.
    sources:
      - bible:douay-rheims:Num.1.1
      - bible:douay-rheims:Num.3.14
  - relation: narrated-event
    event: israel.wilderness.dedication-of-the-altar
    scope:
      - {book: Num, chapter: 7, first: 1, last: 89}
    note: >-
      Dated by its own first verse to "the day that Moses had finished the
      tabernacle, and set it up", which is the day Exodus 40:15 dates. Verse 89,
      Moses entering the tabernacle to consult the oracle, closes the chapter in
      the same tabernacle and on the same occasion and is bound with it; it
      states no date of its own.
    sources: [bible:douay-rheims:Num.7.1]
  - relation: narrated-event
    event: israel.wilderness.phase-in-the-desert-of-sinai
    scope:
      - {book: Num, chapter: 9, first: 1, last: 14}
    note: >-
      Numbers 9:1-5 dates the keeping of the phase; 9:6-14 is the case of the
      unclean and the ordinance given for it, arising on the same occasion. The
      "second month, on the fourteenth day" of 9:11 is the standing remedy the
      ordinance appoints, not a second event of this year, and no event is
      authored from it.
    sources:
      - bible:douay-rheims:Num.9.1
      - bible:douay-rheims:Num.9.5
  - relation: narrated-event
    event: israel.wilderness.departure-from-sinai
    scope:
      - {book: Num, chapter: 10, first: 11, last: 36}
      - {book: Num, chapter: 33, first: 16, last: 16}
    note: >-
      Two ranges, one removal. Numbers 10:11 dates it - "The second year, in the
      second month, the twentieth day of the month" - and Numbers 33:16 enters
      the same departure in the itinerary without a date, "But departing also
      from the desert of Sinai, they came to the graves of lust." The three
      days' journey of 10:33 and the order of the march belong to it.
    sources:
      - bible:douay-rheims:Num.10.11
      - bible:douay-rheims:Num.33.16
  - relation: retrospective-event
    event: israel.wilderness.numbering-at-sinai
    scope:
      - {book: Num, chapter: 26, first: 64, last: 64}
    note: >-
      NOT narrated-event. Numbers 26 narrates the second census, taken in the
      plains of Moab; verse 64 looks back to the first, which Numbers 1:1 dates
      to "the first day of the second month, the second year of their going out
      of Egypt": "Among whom there was not one of them that were numbered
      before by Moses and Aaron in the desert of Sinai." The verse recalls the
      earlier numbering and does not date the later one, for which Scripture
      gives no date at all. How far apart the two censuses stand is not stated
      here: no source inspected for this corpus dates the second, and the
      distance between them is not something this corpus computes.
    sources: [bible:douay-rheims:Num.26.64, bible:douay-rheims:Num.1.1]
  - relation: narrated-event
    event: israel.wilderness.coming-to-cades
    scope:
      - {book: Num, chapter: 20, first: 1, last: 1}
    note: >-
      One verse, because one verse is what carries the datum: the coming into
      the desert of Sin "in the first month", the abiding in Cades, and the
      death and burial of Mary. The year is not Scripture's but the Catholic
      Encyclopedia's, and the event records the tension that creates with
      Numbers 33:38. What follows at 20:2-21 - the waters of contradiction and
      the embassy to Edom - happens at the same Cades and is left unbound
      because nothing dates it.
    sources:
      - bible:douay-rheims:Num.20.1
      - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01003a-5adaeca0
  - relation: narrated-event
    event: israel.wilderness.mourning-for-aaron
    scope:
      - {book: Num, chapter: 20, first: 30, last: 30}
    note: >-
      The thirty days' mourning, which follows the death bound at Numbers
      20:22-29 and is dated from it rather than with it.
    sources: [bible:douay-rheims:Num.20.30]
  - relation: historical-setting
    event: israel.wilderness.encampment-in-the-plains-of-moab
    scope:
      - {book: Num, chapter: 22, first: 1, through: 36, last: 13}
    note: >-
      The occasion of the last fifteen chapters, and deliberately not a date for
      anything narrated in them. Numbers 22:1 pitches the camp "in the plains of
      Moab, over against where Jericho is situate beyond the Jordan"; 26:3,
      33:50, 35:1 and the book's closing verse 36:13 all keep it there. Balaam
      and Balac, Beelphegor, the second census, the war on Madian, the
      settlement of Ruben and Gad, the itinerary of chapter 33, the bounds of
      the land, the cities of refuge and the daughters of Salphaad are dated by
      no source inspected for this corpus, and the Catholic Encyclopedia's
      "Balaam", read in full, prints no date of any kind for the episode it
      treats. The itinerary is the sharpest case: chapter 33 dates exactly two
      of its stations, the departure from Ramesses (33:3) and the death of
      Aaron on mount Hor (33:38), which are bound elsewhere, and lists some
      forty more with no date at all. Those stations are left undated here.
    sources:
      - bible:douay-rheims:Num.22.1
      - bible:douay-rheims:Num.36.13
      - artifact.catholic-encyclopedia.volume-2.new-york-1907.newadvent-02214b-53ac6d68
  - relation: prophetic-referent
    event: israel.wilderness.death-of-moses
    scope:
      - {book: Num, chapter: 27, first: 12, last: 14}
      - {book: Num, chapter: 31, first: 2, last: 2}
    note: >-
      NOT narrated-event. Numbers does not narrate the death of Moses;
      Deuteronomy 34 does. These two passages announce it: "And when thou shalt
      have seen it, thou also shalt go to thy people, as thy brother Aaron is
      gone" (27:13), and "Revenge first the children of Israel on the
      Madianites, and so thou shalt be gathered to thy people" (31:2). The event
      they point to carries no year in any era in any source inspected for this
      corpus, and this binding supplies none.
    sources:
      - bible:douay-rheims:Num.27.13
      - bible:douay-rheims:Num.31.2
  - relation: historical-setting
    event: israel.wilderness.coming-to-cades
    scope:
      - {book: Num, chapter: 20, first: 2, last: 21}
    note: >-
      NOT a date for the waters of contradiction, which Scripture does not date.
      The occasion is the camp at Cades that verse 1 records: Numbers 20:14 has
      Moses send messengers "from Cades to the king of Edom", and the Catholic
      Encyclopedia's "Aaron" keeps the whole passage at that one halt, going on
      in the same breath as its dateline - "In the first month of the
      thirty-ninth year after the Exodus, the Hebrews camped at Cades, where
      Mary, Aaron's sister, died and was buried. There the people were in want
      of water and soon murmured against Moses and Aaron." The encyclopedia's
      year is the event's, with the difficulty the event records against
      Numbers 33:38, and this binding adds nothing to it.
    sources:
      - bible:douay-rheims:Num.20.14
      - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01003a-5adaeca0
  - relation: narrated-event
    event: israel.wilderness.mary-stricken-at-haseroth
    scope:
      - {book: Num, chapter: 12, first: 1, last: 15}
    note: >-
      The fault committed at Haseroth. The arrival is the closing clause of
      Numbers 11:34, "And departing from the graves of lust, they came unto
      Haseroth, and abode there", but that verse is chiefly the burial at the
      graves of lust and is left with it. The murmuring, the
      seventy elders and the quails of Numbers 11:1-33 are left unbound: they
      stand between the same two dated points but no source inspected for this
      corpus places them, and the encyclopedia's "a few months later" is
      attached to Haseroth and not to them.
    sources:
      - bible:douay-rheims:Num.11.34
      - bible:douay-rheims:Num.12.1
  - relation: prophecy-given
    event: israel.wilderness.forty-years-in-the-desert
    scope:
      - {book: Num, chapter: 14, first: 33, last: 34}
    note: >-
      NOT narrated-event. These two verses are the sentence as the Lord speaks
      it at the return of the spies - "Your children shall wander in the desert
      forty years, and shall bear your fornication, until the carcasses of their
      fathers be consumed in the desert, According to the number of the forty
      days, wherein you viewed the land: a year shall be counted for a day." -
      so the forty years are announced here and not narrated as elapsed. The
      event is dated from these words and names them as its source record, and
      the verses that carry them must therefore reach it. Numbers 32:13 narrates
      the running out of the sentence and is bound separately; Deuteronomy
      1:34-40 is Moses recalling it in Moab. The rest of the speech, Numbers
      14:26-32 and 14:35, is the doom on the fathers rather than the measure of
      the wandering, and no source inspected for this corpus dates it, so it is
      left under the silence the Numbers gap row records.
    sources:
      - bible:douay-rheims:Num.14.33
      - bible:douay-rheims:Num.14.34
  # === lane psalms-1-50 ===
  # --- Psalm 17 (Vulg.; Hebr. 18): the title, the canticle, and tradition -----
  - relation: superscription-setting
    event: israel.monarchy.david-delivered-from-his-enemies
    scope:
      - {book: Ps, chapter: 17}
    note: >-
      The title itself names the occasion, Ps 17:1: "Unto the end, for David,
      the servant of the Lord, who spoke to the Lord the words of this canticle,
      in the day that the Lord delivered him from the hand of all his enemies,
      and from the hand of Saul: and he said:". The same canticle stands at 2
      Kings (2 Samuel) 22, whose verse 1 asserts the same occasion in the
      narrative's own voice, so the occasion here does not rest on the title
      alone. VULGATE numbering: this is Hebrew 18. A title asserts an occasion
      and never a year; the year, such as it is, belongs to the event, which
      carries only a relative claim and an explicit refusal to place the day
      within the reign.
    sources:
      - bible:douay-rheims:Ps.17.1
      - bible:douay-rheims:2Kings.22.1
  - relation: utterance
    event: israel.monarchy.david-delivered-from-his-enemies
    scope:
      - {book: Ps, chapter: 17, first: 2, last: 51}
    note: >-
      Not the psalm's setting but the speaking of its words, which is a
      different assertion and is carried by a different verse. 2 Kings 22:1
      states it as narrative: "And David spoke to the Lord the words of this
      canticle, in the day that the Lord delivered him out of the hand of all
      his enemies, and out of the hand of Saul." The scope begins at verse 2, "I
      will love thee, O Lord, my strength", because verse 1 is the
      superscription and is not part of the canticle spoken; it runs to verse 51,
      the last verse of the psalm in this numbering. VULGATE numbering: Hebrew
      18.
    sources:
      - bible:douay-rheims:2Kings.22.1
      - bible:douay-rheims:Ps.17.2
  - relation: historical-setting
    event: israel.monarchy.saul-reign
    scope:
      - {book: Ps, chapter: 7}
      - {book: Ps, chapter: 17}
    note: >-
      Tradition's occasion, not the titles' own, and for the two psalms it
      reaches it is a different claim from anything their titles assert. The
      Catholic Encyclopedia's article on the Psalms lists the psalms whose titles
      it takes to name an occasion and refers them: "Thirteen Davidic psalms have
      such titles. Pss. vii, xviii, xxxiv, lii, liv, lvi, lvii, lix, cxlii (vii,
      xvii, xxxiii, li, liii, lv, lvi, lviii, cxli) are referred to the time of
      David's persecution by Saul". The article prints Hebrew numbers first and
      the Vulgate ones in brackets, so its "vii" and "xvii" in the bracketed list
      are Vulgate 7 and Vulgate 17, which is the numbering this corpus is
      authored in. The occasion the article names is "the time of David's
      persecution by Saul", for which this corpus holds no event of its own; the
      event it does hold that contains that time is the reign of Saul, and that
      is what is bound, at reign granularity and no finer. Two cautions belong
      here and not to the event. First, the title of Psalm 7 names an occasion
      the corpus cannot reach at all — "The psalm of David, which he sung to the
      Lord, for the words of Chusi, the son of Jemini" — and no source inspected
      for this lane identifies Chusi or dates his words, so Psalm 7 carries no
      superscription-setting. Second, the title of Psalm 17 names the deliverance
      from Saul, which is the end of the persecution and not the time of it; that
      is authored separately as superscription-setting, and the two assertions
      are kept apart on purpose. Vulgate 33, also in the article's bracketed
      list, already carries a superscription-setting binding whose note quotes
      this same sentence, and is deliberately not re-bound here.
    sources:
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25
      - bible:douay-rheims:Ps.7.1
      - bible:douay-rheims:Ps.17.1

  # --- Psalm 29 (Vulg.; Hebr. 30): the dedication of David's house -----------
  - relation: superscription-setting
    event: israel.monarchy.david-house-built
    scope:
      - {book: Ps, chapter: 29}
    note: >-
      Ps 29:1: "A psalm of a canticle, at the dedication of David's house." What
      the title asserts is the dedication of the house. This corpus holds no
      event for the dedication; what it now holds, and what is bound here, is the
      building of the house, which 2 Kings (2 Samuel) 5:11 narrates: "Hiram the
      king of Tyre sent messengers to David, and cedar trees, and carpenters, and
      masons for walls: and they built a house for David." The binding should be
      read as reaching no further than the title's own words: if a later lane
      authors an event for the dedication itself, this binding should move to it.
      It carries no date and implies none, and the event it names carries only a
      relative claim, deliberately, so that the "about the year 1058 B.C." this
      corpus holds for the capture of the castle of Sion is not transferred to
      this psalm. One ranked source reads the title differently and is recorded
      rather than suppressed: the Catholic Encyclopedia's article on the Psalms
      files this title not among the thirteen historical titles but among the
      liturgical ones, quoting it without the word David and offering a use
      rather than an occasion — "Psalm xxx (xxix) is entitled 'A Song at the
      Dedication of the House'. The psalm may have been used at the Feast of the
      Dedication of the Temple, the Encaenia (John 10:22)." That is a hedged
      claim about liturgical use ("may have been used"), not a statement of the
      psalm's setting, and it is not authored as one; what is authored here is
      what the printed title of this edition asserts, which is the dedication of
      David's house. VULGATE numbering: Hebrew 30.
    sources:
      - bible:douay-rheims:Ps.29.1
      - bible:douay-rheims:2Kings.5.11
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25

  # --- Psalms read of Christ, in the range Vulgate 1-50 ----------------------
  - relation: prophetic-referent
    event: life-of-christ.crucifixion
    scope:
      - {book: Ps, chapter: 2, first: 1, last: 2}
    note: >-
      NOT narrated-event: David does not report the Passion as history. The
      identification is the Apostles' own, made in prayer at Acts 4:25-27, which
      quotes the two verses and then names the day they were fulfilled on: "Who,
      by the Holy Ghost, by the mouth of our father David, thy servant, hast
      said: Why did the Gentiles rage: and the people meditate vain things? The
      kings of the earth stood up: and the princes assembled together against the
      Lord and his Christ. For of a truth there assembled together in this city
      against thy holy child Jesus, whom thou hast anointed, Herod, and Pontius
      Pilate, with the Gentiles and the people of Israel". The psalm's own words
      in this edition are "Why have the Gentiles raged, and the people devised
      vain things? The kings of the earth stood up, and the princes met together,
      against the Lord, and against his Christ" (Ps 2:1-2). The scope is the two
      verses Acts quotes and no more; Psalm 2 is numbered alike in the Vulgate
      and the Hebrew. The rest of the psalm is deliberately left unbound — see
      the lane notes on verse 7.
    sources:
      - bible:douay-rheims:Acts.4.25
      - bible:douay-rheims:Acts.4.26
      - bible:douay-rheims:Acts.4.27
      - bible:douay-rheims:Ps.2.1
      - bible:douay-rheims:Ps.2.2
  - relation: prophetic-referent
    event: life-of-christ.resurrection
    scope:
      - {book: Ps, chapter: 15}
    note: >-
      NOT narrated-event, and the New Testament is explicit that it is not: St
      Peter at Acts 2:29-31 first sets David's own death aside — "he died and was
      buried; and his sepulchre is with us to this present day" — and then says
      of the words he has just quoted, "Foreseeing this, he spoke of the
      resurrection of Christ. For neither was he left in hell: neither did his
      flesh see corruption." The words quoted at Acts 2:25-28 are this psalm's:
      "Because thou wilt not leave my soul in hell; nor wilt thou give thy holy
      one to see corruption" (Ps 15:10). St Paul repeats the same verse to the
      same purpose at Acts 13:35-37. VULGATE numbering: this is Hebrew 16. The
      scope is the whole psalm rather than the quoted verses because the
      canonical Clementine division gives this psalm ten verses where the tracked
      Douay-Rheims prints eleven, and a verse-range scope would be asserting
      something about a verse boundary this corpus does not hold; the psalm is
      one psalm and the claim is made of it.
    sources:
      - bible:douay-rheims:Acts.2.27
      - bible:douay-rheims:Acts.2.31
      - bible:douay-rheims:Acts.13.35
      - bible:douay-rheims:Ps.15.10
  - relation: prophetic-referent
    event: life-of-christ.nativity
    scope:
      - {book: Ps, chapter: 17}
      - {book: Ps, chapter: 49}
    note: >-
      NOT narrated-event and NOT the psalms' own setting, both of which are
      authored separately where they exist. The Catholic Encyclopedia's article
      on the Psalms states in its own voice that "The Fathers are unanimous in
      interpreting many psalms as prophecies of the coming, kingdom, priesthood,
      passion, death, and resurrection of the Messias. The coming of the Messias
      is predicted in Pss. xviii, l, lxviii, xcvi-xcviii (xvii, xlix, lxvii,
      xcv-xcvii)." The bracketed numbers are the Vulgate ones, so the two psalms
      of that list falling in this range are Vulgate 17 and Vulgate 49, which
      `_psalms` confirms are Hebrew 18 and Hebrew 50. One step in this binding is
      the binding's own and is stated rather than hidden: the article says
      "coming" and names no event, and the event this corpus holds for the coming
      of the Messias is the Nativity. Nothing here asserts that either psalm
      speaks of the circumstances of the Nativity, and nothing here dates either
      psalm. Psalm 49's own text is what the article is reading — "God shall come
      manifestly: our God shall come, and shall not keep silence" (Ps 49:3). The
      same article's further list, "The kingdom of the Messias is predicted in
      Pss. ii, xviii, xx, xxi, xlv, lxi, lxxii, lxxxix, cx, cxxxii (ii, xvii,
      xix, xx, xliv, lx, lxxi, lxxxviii, cix, cxxxi)", is deliberately not
      authored: this corpus holds no event for the kingdom of the Messias, and
      inventing one to receive Vulgate 19, 20 and 44 would be manufacturing a
      subject out of a sentence.
    sources:
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25
      - bible:douay-rheims:Ps.49.3
  # === lane psalms-101-150 ===
  # --- Psalter, Vulgate 101-150 ------------------------------------------------
  # Four psalms out of fifty carry something a ranked source actually dates.
  # The other forty-six are left to the psalter-policy lane's book-scoped gap
  # row on purpose; NOTES.md in this lane says of each one why. No composition
  # unit and no gap row is authored here.
  - relation: superscription-setting
    event: israel.restoration.decree-of-cyrus
    scope:
      - {book: Ps, chapter: 111}
    note: >-
      The occasion is carried by the Latin title alone. The tracked
      Douay-Rheims prints no title at this psalm at all — its verse 1 is the
      first body line, "Blessed is the man that feareth the Lord: he shall
      delight exceedingly in his commandments" — so what is recorded here is
      read from the tracked Clementine Vulgate, whose Ps 111:1 begins
      "Alleluja, reversionis Aggæi et Zachariæ." The clause that names an
      occasion is "reversionis", of the return, and the event this corpus holds
      for the return from the Babylonian captivity is the decree of Cyrus and
      the return under it. The title says the return and no more: it does not
      name Cyrus, does not name Babylon, and does not distinguish the decree
      from the journey, and this note is the record that it does not. The rest
      of the title, "Aggæi et Zachariæ", is an ascription and is deliberately
      not converted into an occasion — the Catholic Encyclopedia's "Aggeus
      (Haggai)" says outright that "Aggeus has also been credited, but
      wrongly, with the authorship of Psalms 111 and 145", numbering them as
      this corpus does in the Vulgate, and the same encyclopedia's "Psalms"
      records that St Augustine "thinks that all the Psalms are Davidic and that the names of
      Aggeus and Zacharias were superscribed by the poet in prophetic spirit".
      Nothing here rests on either prophet having written the psalm. VULGATE
      numbering: this is Hebrew 112, whose Massoretic title is the bare
      Hallelujah and carries none of this.
    sources:
      - bible:clementine-vulgate:Ps.111.1
      - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01209d-02397b81
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25

  - relation: superscription-setting
    event: israel.monarchy.saul-reign
    scope:
      - {book: Ps, chapter: 143}
    note: >-
      Another title the tracked English Douay does not print. Its Ps 143:1 is
      body — "Blessed be the Lord my God, who teacheth my hands to fight, and
      my fingers to war" — while the tracked Clementine Vulgate reads "Psalmus
      David. Adversus Goliath." at the same verse. "Adversus Goliath" names an
      occasion: the single combat with the Philistine giant. This corpus holds
      no event for that combat and none is authored here, because no ranked
      source inspected for this lane dates it; the Catholic Encyclopedia's
      "King David" narrates it without a year, saying only that it happened
      "whilst his three elder brothers were in the field, fighting under Saul
      against the Philistines". What that same sentence does establish is the
      period, and the period is the dated event bound here. The binding
      therefore asserts the reign of Saul and nothing narrower; it is a
      widening of the title's claim, not a substitution for it, and if a later
      lane authors an event for the combat with Goliath this binding should
      move to it. VULGATE numbering: Hebrew 144, whose Massoretic title is
      "Of David" alone.
    sources:
      - bible:clementine-vulgate:Ps.143.1
      - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04642b-f1c0bed3

  - relation: superscription-setting
    event: israel.monarchy.david-in-the-cave
    scope:
      - {book: Ps, chapter: 141}
    note: >-
      Ps 141:1, printed in the tracked Douay: "Of understanding for David, A
      prayer when he was in the cave. [1 Kings 24.]" — the bracket is
      Challoner's cross-reference apparatus and not part of the inspired title;
      the Clementine reads "Intellectus David, cum esset in spelunca, oratio."
      The occasion asserted is the cave of 1 Kings 24, where Saul came into
      David's power at Engaddi. That is the SAME occasion Ps 56's title sends
      the reader to under the same bracketed "[1 Kings 24.]", so the two psalms
      bind to one event and cannot acquire two answers. This entry was first
      authored against `israel.monarchy.saul-reign`, on the ground that the
      corpus held no event for the episode; it held none when that was written
      and holds one now, `israel.monarchy.david-in-the-cave` having been
      authored in the same wave from Ps 56's title. Two psalms with one title
      answering differently is precisely the drift an event held once exists to
      prevent, so the narrower event wins here as it does there. The Catholic
      Encyclopedia's "King David" reports the episode — "In the deserts of
      Engaddi he was again in great danger, but when Saul was at his mercy, he
      generously spared his life" — and attaches no date to it; the date this
      binding reaches is the Haydock edition's A.M. 2946 marker, carried once
      on the event and never on a binding. The containing reign remains
      asserted over this psalm by the `historical-setting` binding below, which
      is a different witness making a different claim. Read this binding as
      asserting
      the period and not the episode, and move it if the cave is ever given an
      event of its own. The corpus's neighbouring events are deliberately not
      used: David in the desert of Maon is 1 Kings 23 and David's flight to
      Achis is 1 Kings 21, and neither is the cave. VULGATE numbering: Hebrew
      142.
    sources:
      - bible:douay-rheims:Ps.141.1
      - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04642b-f1c0bed3

  - relation: historical-setting
    event: israel.monarchy.saul-reign
    scope:
      - {book: Ps, chapter: 141}
    note: >-
      A second assertion on Ps 141, from a different witness, which is why it
      is a second binding and not a widening of the one above. The title's
      claim is the cave; tradition's is the persecution, and the Catholic
      Encyclopedia's "Psalms" states it in its own voice, listing the thirteen
      Davidic psalms with historical titles: "Pss. vii, xviii, xxxiv, lii, liv,
      lvi, lvii, lix, cxlii (vii, xvii, xxxiii, li, liii, lv, lvi, lviii, cxli)
      are referred to the time of David's persecution by Saul". That article
      follows the Hebrew numeration and brackets the Vulgate, so its "cxlii
      (cxli)" is this psalm, Vulgate 141. "The time of David's persecution by
      Saul" is a period and not an episode, and the dated event this corpus
      holds for it is the reign of Saul. No year passes through this binding:
      the reign's own claim rests on 1 Kings 13:1, a verse the event's note
      calls textually notorious and refuses to resolve.
    sources:
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25
      - bible:douay-rheims:Ps.141.1

  - relation: historical-setting
    event: israel.exile.seventy-years
    scope:
      - {book: Ps, chapter: 136}
    note: >-
      The psalm names its own occasion in its opening line, Ps 136:1: "Upon the
      rivers of Babylon, there we sat and wept: when we remembered Sion". This
      is historical-setting and not superscription-setting, because the tracked
      Douay prints no title here — verse 1 is body — and the Clementine's title
      at the same verse, "Psalmus David, Jeremiæ", is an ascription and names
      no occasion. It is not narrated-event either: what the psalm tells of is
      the sitting and the weeping and the demand for a song of Sion, and the
      event this corpus holds is not that but the state the singers are in.
      WHICH exile event: the corpus holds seven, and the text distinguishes
      only one of them. The first, second and third captivities, the beginning
      of the final siege, the burning of the Temple and Nabuchodonosor's
      counted deportations are each a single occasion, and the psalm says
      nothing that would choose among them — it does not say which carrying-off
      brought these singers to Babylon, and nothing here will pick one to be
      decisive. What the psalm does assert is that it is sung from inside the
      servitude, in Babylon, with the fall of Jerusalem already a thing
      remembered and prayed against: "Remember, O Lord, the children of Edom,
      in the day of Jerusalem: Who say: Rase it, rase it, even to the
      foundation thereof" (v. 7), and "O daughter of Babylon, miserable"
      (v. 8), whose punishment is still to come. The seventy years of servitude
      to Babylon is the only one of the seven that is that state rather than a
      day within it, and it is the one bound. The binding carries no date, and
      the event's own claim is relative — Jeremias 25:11's seventy years,
      measured from the first subjection of Juda — so nothing here converts the
      psalm into a year. Verses 7-9 additionally recall the destruction of
      Jerusalem as an earlier event; that is retrospective-event, a different
      relation, and it is not authored here. VULGATE numbering: this is Hebrew
      137.
    sources:
      - bible:douay-rheims:Ps.136.1
      - bible:douay-rheims:Ps.136.7
      - bible:douay-rheims:Ps.136.8

  - relation: prophetic-referent
    event: life-of-christ.ascension
    scope:
      - {book: Ps, chapter: 109, first: 1, last: 1}
    note: >-
      NOT narrated-event, and not a composition date: David does not report the
      session at the right hand as history. That the psalm is read of Christ is
      stated by the Catholic Encyclopedia's "Messias" in its own voice and, for
      once, in Vulgate numbers — "The Messianic priest is described by David in
      Psalm 109, with reference to Genesis 14:14-20. That this psalm was
      generally understood in a Messianic sense is not disputed, while the
      universal consent of the Fathers puts the matter beyond question for
      Catholics." WHICH event: Scripture supplies it at the verse bound. St
      Peter at Pentecost quotes this verse and makes his argument turn on the
      ascent into heaven — "For David ascended not into heaven; but he himself
      said: The Lord said to my Lord: Sit thou on my right hand, Until I make
      thy enemies thy footstool" (Acts 2:34-35), having just said "Being
      exalted therefore by the right hand of God" (Acts 2:33). The words of Ps
      109:1 are thus read, in Scripture itself, of the Christ who ascended, and
      the dated event this corpus holds for that is the Ascension. The extent
      is verse 1 alone, the verse that is quoted; verses 2-7 get nothing from
      this binding. Two things this binding is deliberately not. It is not a
      claim about Acts 2 or Matthew 22: a passage quoting an older text does
      not make the quoted words that passage's narrated event, and Our Lord's
      question to the Pharisees, "How then doth David in spirit call him Lord"
      (Matt. 22:43-44), is an utterance at its own locus and belongs to
      whatever lane authors the Gospels. And it is not the whole of what the
      sources say about this psalm: the same "Psalms" article assigns to Ps.
      cx — Vulgate 109, that article numbering by the Hebrew and bracketing the
      Vulgate — both "the kingdom of the Messias" and "the priesthood", and the
      encyclopedia's "Melchisedech" ties verse 4 to Hebrews, "Christ is 'a
      priest forever according to the order of Melchisedech' (Hebrews 7:6;
      Psalm 109:4)". Neither the kingdom nor the priesthood is an event this
      corpus holds or that any inspected source dates, so neither is authored.
      VULGATE numbering: this is Hebrew 110.
    sources:
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10212c-f915c8f4
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10156b-8737c8f5
      - bible:douay-rheims:Acts.2.34
      - bible:douay-rheims:Ps.109.1
  # === lane psalms-51-100 ===
  # --- Psalms 51-100 (Vulg.): titles that name an occasion --------------------
  - relation: superscription-setting
    event: israel.monarchy.saul-reign
    scope:
      - {book: Ps, chapter: 51}
    note: >-
      Ps 51.1-2: "Unto the end, understanding for David, / When Doeg the Edomite
      came and told Saul: David went to the house of Achimelech." The title
      names two moments standing in two different chapters of 1 Kings — Doeg's
      report to Saul at 1 Kings 22:9-10, and the visit to Achimelech at Nobe at
      1 Kings 21:1 — and this corpus holds an event for neither. What it does
      hold under the 1 Kings 21 year marker is David's flight to Achis, king of
      Geth, A.M. 2944, and that is a different episode of that chapter, so it is
      not bound here. The event bound is the reign of Saul, which the title
      itself names and which contains both moments: this binding asserts that
      containment and nothing narrower, and should be moved to an event for
      Doeg's denunciation if a later lane authors one. The Catholic
      Encyclopedia's "Psalms" refers the title no more precisely either, listing
      it among the thirteen historical titles: "Pss. vii, xviii, xxxiv, lii,
      liv, lvi, lvii, lix, cxlii (vii, xvii, xxxiii, li, liii, lv, lvi, lviii,
      cxli) are referred to the time of David's persecution by Saul". That
      article follows the Hebrew numeration and brackets the Vulgate, so its
      "lii (li)" is this psalm. A title asserts an occasion and never a year,
      and the year on the bound event is the notoriously unresolved 1 Kings 13:1
      figure, which is the event's problem and not the title's. VULGATE
      numbering: this is Hebrew 52.
    sources:
      - bible:douay-rheims:Ps.51.1
      - bible:douay-rheims:Ps.51.2
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25

  - relation: superscription-setting
    event: israel.monarchy.david-in-the-cave
    scope:
      - {book: Ps, chapter: 56}
    note: >-
      Ps 56.1: "Unto the end, destroy not, for David, for an inscription of a
      title, when he fled from Saul into the cave. [1 Kings 24.]" The bracketed
      reference is the Challoner edition's cross-reference apparatus and not
      part of the inspired title; it is what fixes which cave is meant, and the
      event bound is dated from the year marker standing at the head of that
      chapter. The Catholic Encyclopedia's "Psalms" quotes this same title, in
      the Hebrew numeration and from the Massoretic text, as its example of a
      title that carries both an author and an occasion: "Of the Director, to
      the tune 'Destroy not', of David, a chosen piece (Mikhtam), when he fled
      from the face of Saul into the cave" (Ps. lvii), and it lists the psalm
      among those "referred to the time of David's persecution by Saul". Neither
      the title nor that article supplies a year; the year is the bound event's
      and is an Anno Mundi figure recorded as printed. VULGATE numbering: this
      is Hebrew 57.
    sources:
      - bible:douay-rheims:Ps.56.1
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25

  - relation: superscription-setting
    event: israel.monarchy.saul-reign
    scope:
      - {book: Ps, chapter: 58}
    note: >-
      Ps 58.1: "Unto the end, destroy not, for David for an inscription of a
      title, when Saul sent and watched his house to kill him. [1 Kings 19.]"
      ("for David for" is as printed in the tracked text; the bracket is
      Challoner's cross-reference.) The occasion is the watch set on David's
      house at 1 Kings 19:11, and this corpus holds no event for it: no Haydock
      passage record has been inspected for 1 Kings 19, and the Catholic
      Encyclopedia's "David", which narrates the episode, dates no episode of
      David's life at all. The reign of Saul is bound because the title names
      Saul and the occasion falls inside it; the binding asserts containment
      only and should move to an event for the watch on the house if one is ever
      authored. The Catholic Encyclopedia's "Psalms" places this title among
      those "referred to the time of David's persecution by Saul", its "lix
      (lviii)" being this psalm. VULGATE numbering: this is Hebrew 59.
    sources:
      - bible:douay-rheims:Ps.58.1
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25

  - relation: superscription-setting
    event: israel.monarchy.david-reign
    scope:
      - {book: Ps, chapter: 59}
    note: >-
      Ps 59.1-2: "Unto the end, for them that shall be changed, for the
      inscription of a title, to David himself, for doctrine, / When he set fire
      to Mesopotamia of Syria and Sobal: and Joab returned and slew of Edom, in
      the vale of the saltpits, twelve thousand men." The Catholic
      Encyclopedia's "Psalms" refers this one title to a different occasion from
      the twelve others it lists, and to this one: "Ps. lx (lix) to that of the
      victories in Mesopotamia and Syria", its bracketed number being the
      Vulgate one. This corpus holds no event for those victories — they are
      narrated at 2 Kings 8 and 1 Paralipomenon 18, for which no chronological
      record has been inspected — so the reign of David is bound as the event
      that contains them, and this binding asserts nothing narrower. The
      numbers, moreover, are not to be harmonised here: the title says twelve
      thousand men of Edom, where 2 Kings 8:13 says "eighteen thousand" of Syria
      in the valley of the saltpits and 1 Paralipomenon 18:12 gives the
      "eighteen thousand" to Abisai son of Sarvia against the Edomites. The
      corpus records the discrepancy and settles none of it. VULGATE numbering:
      this is Hebrew 60.
    sources:
      - bible:douay-rheims:Ps.59.1
      - bible:douay-rheims:Ps.59.2
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25

  # --- Psalms 51-100 (Vulg.): what the Church reads in them -------------------
  - relation: prophetic-referent
    event: life-of-christ.nativity
    scope:
      - {book: Ps, chapter: 67}
      - {book: Ps, chapter: 95}
      - {book: Ps, chapter: 96}
      - {book: Ps, chapter: 97}
    note: >-
      NOT narrated-event and NOT composition. The Catholic Encyclopedia's
      "Psalms", treating the Messianic psalms in its own voice, states that "The
      coming of the Messias is predicted in Pss. xviii, l, lxviii, xcvi-xcviii
      (xvii, xlix, lxvii, xcv-xcvii)", the bracketed numbers being the Vulgate
      ones: of that list, 67 and 95-97 fall in this range and 17 and 49 do not.
      The article says "the coming of the Messias" and does not itself name the
      Nativity; the Nativity is the event this corpus holds for that coming, and
      the sequence the same paragraph runs through — "the coming, kingdom,
      priesthood, passion, death, and resurrection of the Messias" — is what
      settles that the first coming is meant. Nothing here dates the writing of
      any of these psalms: the same article dates the writing of only two psalms
      and one group in the whole Psalter, and none of them is one of these. Ps
      95 also carries a superscription-setting binding to the rebuilding of the
      house after the captivity; the two relations are two claims about one
      psalm and the corpus keeps both. VULGATE numbering: these are Hebrew 68
      and 96-98.
    sources:
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25

  - relation: prophetic-referent
    event: life-of-christ.ascension
    scope:
      - {book: Ps, chapter: 67, first: 19, last: 19}
    note: >-
      One verse, and the Apostle names it. The Catholic Encyclopedia's "Psalms"
      states that "St. Paul (Ephesians 4:8) interprets of Christ's ascent into
      heaven the words of Ps. lxviii, 18, description of Jahweh's ascent after
      conquering the world" — Hebrew 68:18 being Vulgate 67:19, which reads
      "Thou hast ascended on high, thou hast led captivity captive; thou hast
      received gifts in men", against Ephesians 4:8, "Wherefore he saith:
      Ascending on high, he led captivity captive: he gave gifts to men." The
      extent is the verse and not the psalm, because it is the verse St Paul
      quotes; the whole psalm carries the separate binding to the coming of the
      Messias, which is the article's own wider statement about it.
    sources:
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25
      - bible:douay-rheims:Ps.67.19
      - bible:douay-rheims:Eph.4.8

  - relation: prophetic-referent
    event: life-of-christ.crucifixion
    scope:
      - {book: Ps, chapter: 68}
    note: >-
      NOT narrated-event: the psalmist does not report Calvary as history. The
      Catholic Encyclopedia's "Psalms" states that "The passion and death of the
      Messias are clear in the sufferings of the Servant of Jahweh of Pss. xxii,
      xl, lxix (xxi, xxxix, lxviii)" — the third of that list, Hebrew 69, being
      this psalm, Vulgate 68. This corpus already binds the first of them,
      Vulgate 21, to the same event on the same sentence. The narrower warrant
      stands at Ps 68:22, "And they gave me gall for my food, and in my thirst
      they gave me vinegar to drink", against St John's account of the death:
      "Afterwards, Jesus knowing that all things were now accomplished, that the
      scripture might be fulfilled, said: I thirst... Jesus therefore, when he
      had taken the vinegar, said: It is consummated" (John 19:28-30). The
      binding is scoped to the psalm and not to that verse because the article's
      claim is about the psalm. The same article separately reports the Biblical
      Commission of 1 May 1910 naming Hebrew lxix among the psalms whose Davidic
      authorship "can it not be denied" — an authorship claim, which this corpus
      does not convert into either a composition date or an occasion. VULGATE
      numbering: this is Hebrew 69.
    sources:
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25
      - bible:douay-rheims:Ps.68.22
      - bible:douay-rheims:John.19.28
  # === lane tail ===
  # === bind-micheas-bethlehem ==========================================
  - relation: prophetic-referent
    event: life-of-christ.nativity
    scope:
      - {book: Mich, chapter: 5, first: 2, last: 3}
    note: >-
      NOT narrated-event. Micheas does not report the Nativity as history; the
      Church reads the birth at Bethlehem in his oracle. Van Hoonacker's "Book of
      Micheas" in the Catholic Encyclopedia states of this passage, in its own
      voice, that "the prophet introduces the Messianic king whose place of
      origin is to be Bethlehem-Ephrata; Yahweh will only give up his people
      'till the time wherein she that travaileth shall bring forth', an allusion
      to the well-known passage of Isaiah 7:14." The article does not name Christ;
      what identifies the Messianic king born at Bethlehem is St Matthew, quoted
      here as the rank-1 witness he is: Herod "inquired of them where Christ
      should be born. But they said to him: In Bethlehem of Juda. For so it is
      written by the prophet: And thou Bethlehem the land of Juda art not the
      least among the princes of Juda: for out of thee shall come forth the
      captain that shall rule my people Israel" (Matt. 2:4-6). NUMBERING: the
      article's chapter-5 verse numbers are neither the Douay's nor the Hebrew's
      and are not used to fix this scope. It states its own offset in passing -
      "in 5:4-5 (Vulgate 5-6)" - which puts its 5:1 at Vulgate 5:2, and the same
      encyclopedia's "Bethlehem" article writes the reference out as "Mich., v, 2
      (1)". The scope is fixed instead from the tracked Douay text, where "And
      thou Bethlehem Ephrata" stands at Mich. 5:2 and the sentence the article
      quotes, "till the time wherein she that travaileth shall bring forth", at
      Mich. 5:3. Verse 3 is included because the encyclopedia's sentence covers
      it and ties it to Isaias 7:14, which this corpus already binds to the same
      event. When Micheas uttered the oracle is a different assertion and is
      carried by the composition unit for chapters 4-5, not by this binding.
    sources:
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10278a-734c8637
      - bible:douay-rheims:Mich.5.2
      - bible:douay-rheims:Matt.2.5
      - bible:douay-rheims:Matt.2.6
  # === bind-apostolic-age ==============================================
  # The events below are already dated with full provenance in events.yaml; these
  # rows only say which Scripture tells of them. Extents follow the Acts ranges
  # the Catholic Encyclopedia's "St. Paul" (Prat, vol. 11) prints in its own
  # section headings and cross-references, checked against the tracked Douay text
  # verse by verse, because the article's chapter-and-verse citations are in the
  # modern numbering and the Douay is not always at the same number.
  - relation: narrated-event
    event: apostolic-age.martyrdom-of-saint-stephen
    scope:
      - {book: Acts, chapter: 7, first: 54, last: 59}
    note: >-
      The "St. Paul" article keys the martyrdom to "Acts 7:58-60; 22:20". Those
      numbers are the modern ones; the Douay chapter ends at verse 59, and the
      stoning stands at 7:57-59, "And casting him forth without the city, they
      stoned him ... And when he had said this, he fell asleep in the Lord."
      The scope opens at 7:54, "Now hearing these things, they were cut to the
      heart", which is where the Douay begins the scene the article points at.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.7.57
      - bible:douay-rheims:Acts.7.59
  - relation: retrospective-event
    event: apostolic-age.martyrdom-of-saint-stephen
    scope:
      - {book: Acts, chapter: 22, first: 20, last: 20}
    note: >-
      NOT narrated-event: this is St Paul, years later on the steps of the
      Antonia, recalling what he had been at the stoning. The Douay verse is "And
      when the blood of Stephen thy witness was shed, I stood by and consented:
      and kept the garments of them that killed him." The "St. Paul" article
      names the same verse beside the narrative one.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.22.20
  - relation: narrated-event
    event: apostolic-age.conversion-of-saint-paul
    scope:
      - {book: Acts, chapter: 9, first: 1, last: 19}
    note: >-
      The "St. Paul" article states the extent itself: "We read in the Acts of
      the Apostles three accounts of the conversion of St. Paul (9:1-19; 22:3-21;
      26:9-23) presenting some slight differences, which it is not difficult to
      harmonize." The first of the three is the narrative; the other two are
      bound separately as retrospective. The Douay range runs from "And Saul, as
      yet breathing out threatenings and slaughter against the disciples of the
      Lord" to "And when he had taken meat, he was strengthened."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.9.1
      - bible:douay-rheims:Acts.9.19
  - relation: retrospective-event
    event: apostolic-age.conversion-of-saint-paul
    scope:
      - {book: Acts, chapter: 22, first: 3, last: 21}
      - {book: Acts, chapter: 26, first: 9, last: 23}
    note: >-
      Two ranges, one conversion, neither of them a narration of it: both are St
      Paul on trial recounting what happened to him on the Damascus road. The
      "St. Paul" article numbers them with the narrative account as the second
      and third of "three accounts of the conversion of St. Paul (9:1-19;
      22:3-21; 26:9-23)", and describes them as speeches - the first "delivered
      in Hebrew on the steps of the Antonia before the threatening crowd; herein
      Paul relates his conversion and vocation to the Apostolate", the second
      "pronounced before the Governor Festus, King Agrippa, and his wife
      Berenice, again relates the history of Paul's conversion". The Douay
      supports both bounds: 22:3 opens "I am a Jew, born at Tarsus in Cilicia",
      and 26:9 opens "And I indeed did formerly think that I ought to do many
      things contrary to the name of Jesus of Nazareth."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.22.3
      - bible:douay-rheims:Acts.26.9
  - relation: narrated-event
    event: apostolic-age.saint-paul-first-visit-to-jerusalem
    scope:
      - {book: Acts, chapter: 9, first: 26, last: 29}
    note: >-
      "And when he was come into Jerusalem, he essayed to join himself to the
      disciples" (Acts 9:26) to "But they sought to kill him" (9:29), which is
      the visit; verse 30, the sending away to Tarsus, belongs to the sojourn
      that follows and is bound there. The "St. Paul" article joins the same
      stretch to the Apostle's own account: "He went to Jerusalem to see Peter
      (Galatians 1:18), but remained only fifteen days, for the snares of the
      Greeks threatened his life."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.9.26
      - bible:douay-rheims:Acts.9.29
  - relation: retrospective-event
    event: apostolic-age.saint-paul-first-visit-to-jerusalem
    scope:
      - {book: Gal, chapter: 1, first: 18, last: 19}
    note: >-
      St Paul recalling the visit in a letter written long after it, which is the
      same sentence the event's preferred claim rests its interval on: "Then,
      after three years, I went to Jerusalem to see Peter: and I tarried with him
      fifteen days. But other of the apostles I saw none, saving James the
      brother of the Lord." The interval is the event's; this binding carries no
      date.
    sources: [bible:douay-rheims:Gal.1.18]
  - relation: narrated-event
    event: apostolic-age.saint-paul-sojourn-at-tarsus
    scope:
      - {book: Acts, chapter: 9, first: 30, last: 30}
      - {book: Acts, chapter: 11, first: 25, last: 25}
    note: >-
      Two verses, not a range, because Acts narrates the going and the fetching
      and nothing between: "they brought him down to Caesarea and sent him away
      to Tarsus" (9:30), and "And Barnabas went to Tarsus to seek Saul: whom,
      when he had found, he brought to Antioch" (11:25). The "St. Paul" article
      says exactly that of the years the event dates: "He then left for Tarsus
      and is lost to sight for five or six years (Acts 9:29-30; Galatians 1:21).
      Barnabas went in search of him and brought him to Antioch."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.9.30
      - bible:douay-rheims:Acts.11.25
  - relation: narrated-event
    event: apostolic-age.saint-paul-apostolate-at-antioch
    scope:
      - {book: Acts, chapter: 11, first: 25, last: 26}
    note: >-
      "And they conversed there in the church a whole year: and they taught a
      great multitude, so that at Antioch the disciples were first named
      Christians" (Acts 11:26). The "St. Paul" article cites the same two verses
      for it: "Barnabas went in search of him and brought him to Antioch where
      for a year they worked together and their apostolate was most fruitful
      (Acts 11:25-26)." The verse this shares with the Tarsus sojourn is shared
      deliberately: 11:25 ends one and opens the other.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.11.26
  - relation: narrated-event
    event: apostolic-age.persecution-by-herod-agrippa
    scope:
      - {book: Acts, chapter: 12, first: 1, last: 19}
    note: >-
      "And at the same time, Herod the king stretched forth his hands, to afflict
      some of the church. And he killed James, the brother of John, With the
      sword. And seeing that it pleased the Jews, he proceeded to take up Peter
      also" (Acts 12:1-3), through the deliverance and Herod's departure to
      Caesarea at verse 19. The event's own claim, from the Catholic
      Encyclopedia's "St. Peter, Prince of the Apostles", describes this passage:
      "after the execution of James, the son of Zebedee, this ruler had Peter
      cast into prison." The martyrdom of St James is inside this scope and has
      no event of its own, because no source inspected for this corpus dates it
      apart from the persecution.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11744a-3bac29d1
      - bible:douay-rheims:Acts.12.2
      - bible:douay-rheims:Acts.12.3
  - relation: narrated-event
    event: apostolic-age.death-of-herod-agrippa
    scope:
      - {book: Acts, chapter: 12, first: 20, last: 23}
    note: >-
      The scene at Caesarea, ending "And forthwith an angel of the Lord struck
      him, because he had not given the honour to God: and, being eaten up by
      worms, he gave up the ghost" (Acts 12:23). The year is the event's, argued
      by the Catholic Encyclopedia from Josephus and the coinage; Acts gives the
      manner and no year, and this binding carries none.
    sources: [bible:douay-rheims:Acts.12.23]
  - relation: narrated-event
    event: apostolic-age.famine-under-claudius
    scope:
      - {book: Acts, chapter: 11, first: 27, last: 28}
    note: >-
      "And in these days there came prophets from Jerusalem to Antioch. And one
      of them named Agabus, rising up, signified by the Spirit that there should
      be a great famine over the whole world, which came to pass under Claudius."
      The event's own note already records that this verse "dates the famine only
      by a reign ... and supports no year on its own"; the year is Orosius's, by
      way of the "St. Paul" article, and is held on the event.
    sources: [bible:douay-rheims:Acts.11.28]
  - relation: narrated-event
    event: apostolic-age.saint-paul-second-visit-to-jerusalem
    scope:
      - {book: Acts, chapter: 11, first: 29, last: 30}
      - {book: Acts, chapter: 12, first: 25, last: 25}
    note: >-
      The going and the returning, with the intervening chapter belonging to
      Herod and Peter: "the disciples, every man according to his ability,
      purposed to send relief to the brethren who dwelt in Judea. Which also they
      did, sending it to the ancients, by the hands of Barnabas and Saul"
      (11:29-30), and "And Barnabas and Saul, returned from Jerusalem, having
      fulfilled their ministry" (12:25). The "St. Paul" article names the alms
      mission with the same reference: "Together also they were sent to Jerusalem
      to carry alms to the brethren on the occasion of the famine predicted by
      Agabus (Acts 11:27-30)."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.11.30
      - bible:douay-rheims:Acts.12.25
  - relation: narrated-event
    event: apostolic-age.saint-paul-first-mission
    scope:
      - {book: Acts, chapter: 13, through: 14, first: 1, last: 27}
    note: >-
      The extent is the article's own section heading, "First mission (Acts
      13:1-14:27)", in the Catholic Encyclopedia's "St. Paul". The Douay range
      closes at 14:27, "And they abode no small time with the disciples", after
      the return to Antioch of Syria.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.14.27
  - relation: narrated-event
    event: apostolic-age.founding-of-the-south-galatian-churches
    scope:
      - {book: Acts, chapter: 13, through: 14, first: 13, last: 24}
    note: >-
      The Catholic Encyclopedia's "Judaizers" (Bechtel, vol. 8) gives the extent
      with the event's own dated sentence: "Soon after (between A.D. 45-49) Saul,
      now called Paul, and Barnabas founded the South Galatian churches of
      Antioch in Pisidia, Iconium, Derbe, and Perge, thus increasing the Gentile
      converts (Acts 13:13 - 14:24)." The Douay bounds match: 13:13 is the
      arrival at "Perge in Pamphylia" and 14:24 the return through Perge to
      Attalia. Nested inside the first mission and not a duplicate of it: one is
      the journey, the other the churches founded on it.
    sources:
      - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08537a-e2154141
      - bible:douay-rheims:Acts.13.13
      - bible:douay-rheims:Acts.14.24
  - relation: narrated-event
    event: apostolic-age.council-of-jerusalem
    scope:
      - {book: Acts, chapter: 15, first: 1, last: 35}
    note: >-
      From the Judaizers coming down from Judea (15:1) to Paul and Barnabas
      continuing at Antioch (15:35); the second mission begins at 15:36 and is
      bound separately, on the article's own division. The event's claim already
      rests on the identification the same article makes: "Here it is to be
      assumed that Galatians 2 and Acts 15 relate to the same fact."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.15.1
      - bible:douay-rheims:Acts.15.35
  - relation: retrospective-event
    event: apostolic-age.council-of-jerusalem
    scope:
      - {book: Gal, chapter: 2, first: 1, last: 10}
    note: >-
      NOT narrated-event: St Paul recalls the assembly in a letter, and the
      recollection is the source of the fourteen-year interval the event holds as
      its alternate claim, "Then, after fourteen years, I went up again to
      Jerusalem with Barnabas, taking Titus also with me" (Gal. 2:1). The
      identification of this passage with Acts 15 is the encyclopedia's and not
      this corpus's: "the actors are the same, Paul and Barnabas on the one hand,
      Peter and James on the other; the discussion is the same, the question of
      the circumcision of the Gentiles; the scenes are the same, Antioch and
      Jerusalem; the date is the same, about A.D. 50; and the result is the same,
      Paul's victory over the Judaizers." The scope stops at 2:10, the right
      hands of fellowship and the charge to remember the poor; the dispute with
      Peter at Antioch from 2:11 is a different occasion and is not bound here.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Gal.2.1
      - bible:douay-rheims:Gal.2.9
  - relation: narrated-event
    event: apostolic-age.saint-paul-second-mission
    scope:
      - {book: Acts, chapter: 15, through: 18, first: 36, last: 22}
    note: >-
      The extent is the article's own section heading, "Second mission (Acts
      15:36-18:22)". The Douay closes the range at 18:22, "And going down to
      Caesarea, he went up to Jerusalem and saluted the church: and so came down
      to Antioch."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.18.22
  - relation: narrated-event
    event: apostolic-age.saint-paul-at-corinth
    scope:
      - {book: Acts, chapter: 18, first: 1, last: 18}
    note: >-
      "After these things, departing from Athens, he came to Corinth" (18:1) to
      the departure by sea at 18:18; the stay's length, which the event carries
      as its claim, is stated inside the range at 18:11, "And he stayed there a
      year and six months, teaching among them the word of God." The "St. Paul"
      article describes the same stretch: "He carried on his apostolate in this
      manner for eighteen months, while the Jews vainly stormed against him."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.18.1
      - bible:douay-rheims:Acts.18.11
  - relation: narrated-event
    event: apostolic-age.saint-paul-fourth-visit-to-jerusalem
    scope:
      - {book: Acts, chapter: 18, first: 22, last: 22}
    note: >-
      One verse, and the Douay names the city outright: "And going down to
      Caesarea, he went up to Jerusalem and saluted the church: and so came down
      to Antioch." The identification of this as the FOURTH visit is the "St.
      Paul" article's own arrangement and not an inference of this corpus: its
      chronological table numbers the visits first (37), second (44 or 45), third
      (49 or 50), fourth (53), fifth with the arrest (57), and its narrative puts
      this one at the close of the second mission, "Finally he decided to go to
      Jerusalem in fulfillment of a vow made perhaps in a moment of danger. From
      Jerusalem, according to his custom, he returned to Antioch." No year is
      asserted here; the year is the event's.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.18.22
  - relation: narrated-event
    event: apostolic-age.saint-paul-third-mission
    scope:
      - {book: Acts, chapter: 18, through: 21, first: 23, last: 26}
    note: >-
      The extent is the article's own section heading, "Third mission (Acts
      18:23-21:26)". The Douay opens at 18:23, "And after he had spent some time
      there, he departed and went through the country of Galatia and Phrygia";
      the arrest that follows at 21:27 is a separate event and a separate row.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.18.23
  - relation: narrated-event
    event: apostolic-age.saint-paul-at-ephesus
    scope:
      - {book: Acts, chapter: 19}
    note: >-
      The whole chapter: the arrival at Ephesus (19:1), the three months in the
      synagogue and the school of Tyrannus (19:8-9), the two years of 19:10 which
      the event holds as one of its two disputed lengths, and the silversmiths'
      riot which ends the stay. The "St. Paul" article treats the same chapter as
      the Ephesian ministry and adds the reason the corpus keeps two lengths
      rather than one: "After a stay at Ephesus of two years and a half, perhaps
      more (Acts 20:31: trietian), he departed for Macedonia."
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.19.10
  - relation: retrospective-event
    event: apostolic-age.saint-paul-at-ephesus
    scope:
      - {book: Acts, chapter: 20, first: 18, last: 31}
    note: >-
      NOT narrated-event: the Miletus address is St Paul at the end of the third
      mission recalling the years already past at Ephesus - "You know from the
      first day that I came into Asia, in what manner I have been with you, for
      all the time" (20:18) - and closing with the reckoning the event carries as
      its second disputed claim, "keeping in memory that for three years I ceased
      not with tears to admonish every one of you, night and day" (20:31). Acts
      states the length twice and the two statements do not agree; the corpus
      keeps both on the event and neither here.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.20.18
      - bible:douay-rheims:Acts.20.31
  - relation: narrated-event
    event: apostolic-age.arrest-of-saint-paul-at-jerusalem
    scope:
      - {book: Acts, chapter: 21, first: 27, last: 40}
    note: >-
      The article opens its captivity section at exactly this verse - "Captivity
      (Acts 21:27-28:31)" - and describes what the Douay range carries: "Falsely
      accused by the Jews of having brought Gentiles into the Temple, Paul was
      ill-treated by the populace and led in chains to the fortress Antonia by
      the tribune Lysias." The scope ends at 21:40, where he is on the stairs and
      begins the first of the five discourses of the captivity.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.21.27
      - bible:douay-rheims:Acts.21.33
  - relation: narrated-event
    event: apostolic-age.saint-paul-imprisonment-at-caesarea
    scope:
      - {book: Acts, chapter: 23, through: 24, first: 23, last: 27}
    note: >-
      From the night escort out of Jerusalem, "Make ready two hundred soldiers to
      go as far as Caesarea" (23:23), to the sentence the event's claim rests on,
      "But when two years were ended, Felix had for successor Portius Festus. And
      Felix being willing to shew the Jews a pleasure, left Paul bound" (24:27).
      The "St. Paul" article describes the same stretch: "Felix kept him in chains
      for two years and even left him in prison in order to please the Jews,
      until the arrival of his successor, Festus." What follows under Festus and
      Agrippa is bound to the next event.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.24.27
  - relation: narrated-event
    event: apostolic-age.saint-paul-sent-to-rome
    scope:
      - {book: Acts, chapter: 25, first: 1, last: 12}
      - {book: Acts, chapter: 27, first: 1, last: 2}
    note: >-
      Two ranges because the event is two things the article names together,
      "arrival of Festus, departure for Rome": the new governor's coming and the
      appeal that settles where the case will be heard - "Now when Festus was
      come into the province, after three days, he went up to Jerusalem from
      Caesarea" (25:1) and "I appeal to Caesar ... To Caesar shalt thou go"
      (25:11-12) - and the embarkation, "And when it was determined that he should
      sail into Italy and that Paul, with the other prisoners, should be
      delivered to a centurion, named Julius" (27:1). The hearing before Agrippa
      that stands between them (chapter 26) is bound to the conversion as a
      retrospective account and is not bound here.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.25.12
      - bible:douay-rheims:Acts.27.1
  - relation: narrated-event
    event: apostolic-age.saint-paul-first-roman-captivity
    scope:
      - {book: Acts, chapter: 28, first: 16, last: 31}
    note: >-
      "And when we were come to Rome, Paul was suffered to dwell by himself, with
      a soldier that kept him" (28:16) to the last verse of the book. The two
      years the event's alternate claim carries stand inside the range at 28:30,
      "And he remained two whole years in his own hired lodging", and the "St.
      Paul" article closes its narrative on the same words: "With these words the
      Acts of the Apostles conclude." The composition date of Acts is built on
      the same verse by other units and is a different assertion.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8
      - bible:douay-rheims:Acts.28.30
  - relation: prophetic-referent
    event: apostolic-age.martyrdom-of-saint-peter
    scope:
      - {book: John, chapter: 21, first: 18, last: 19}
    note: >-
      NOT narrated-event: no book of Scripture narrates the martyrdom, and this
      passage foretells it. The Gospel states the referent in its own voice,
      which is why nothing outside Scripture is needed for the relation: "But when
      thou shalt be old, thou shalt stretch forth thy hands, and another shall
      gird thee and lead thee whither thou wouldst not. And this he said,
      signifying by what death he should glorify God." The date is the event's,
      where the Catholic Encyclopedia leaves it unsettled between three claims;
      this binding carries none of them.
    sources:
      - bible:douay-rheims:John.21.18
      - bible:douay-rheims:John.21.19
  - relation: prophetic-referent
    event: apostolic-age.fall-of-jerusalem
    scope:
      - {book: Luke, chapter: 19, first: 43, last: 44}
    note: >-
      NOT narrated-event, and not a second date for the fall: the Catholic
      Encyclopedia's "Jerusalem (Before A.D. 71)" (Meistermann, vol. 8), telling
      the Roman war, names these two verses as the prophecy the Christians of the
      city were acting on - "The Christians, recalling Christ's prophecies (Luke
      19:43, 44), withdrew beyond the Jordan into Agrippa's territory, led by
      their bishop, St. Simeon." The Douay verses are "thy enemies shall cast a
      trench about thee and compass thee round and straiten thee on every side,
      And beat thee flat to the ground, and thy children who are in thee. And
      they shall not leave in thee a stone upon a stone." The corpus already
      binds Daniel 9:24-27 to the destruction of Jerusalem on the same kind of
      claim; this is the Gospel's own. The article names the two verses without
      distributing them between the siege, the burning of the Temple and the
      capture, which this corpus holds as three separate events, so only the
      event the article's own sentence is about is bound.
    sources:
      - artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08344a-e6625662
      - bible:douay-rheims:Luke.19.43
      - bible:douay-rheims:Luke.19.44
  - relation: narrated-event
    event: apostolic-age.exile-of-saint-john-to-patmos
    scope:
      - {book: Apoc, chapter: 1, first: 9, last: 9}
    note: >-
      The one verse of Scripture that tells of the exile, and the event's own note
      already says what it does not carry: "Apocalypse 1:9, the verse everything
      is anchored to, carries no date, no emperor and no interval." The Douay is
      "I, John, your brother and your partner in tribulation and in the kingdom
      and patience in Christ Jesus, was in the island which is called Patmos, for
      the word of God and for the testimony of Jesus." The reign of Domitian, and
      the rival reckonings from Irenaeus, Eusebius and Jerome, are held on the
      event and not here.
    sources: [bible:douay-rheims:Apoc.1.9]
  - relation: narrated-event
    event: life-of-christ.public-ministry-begins
    scope:
      - {book: Luke, chapter: 3, first: 23, last: 23}
    note: >-
      The Catholic Encyclopedia's "Biblical Chronology" opens its section "Date of
      the beginning of the ministry" on this verse, calling it "St. Luke's
      statement, 'And Jesus himself was beginning about the age of thirty years'
      (iii, 23)", and immediately refuses to compute a year from it: the phrase
      "might without any straining of its sense be used for a year or two more or
      less than thirty", which "would leave us with the indefinite result that it
      might have taken place anywhere between A.D. 23 and 27." The A.D. 27 the
      event carries comes from the forty-six years of John 2:20 instead, which
      dates the Pasch that followed the baptism and does not narrate this; John
      2 is therefore NOT bound here. The Baptism in the Jordan is a separate
      event, already bound at Luke 3:21-22, immediately before this verse.
    sources:
      - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
      - bible:douay-rheims:Luke.3.23
