  # === lane josue-judges ===
  # --- The conquest, continued --------------------------------------------
  - relation: retrospective-event
    event: israel.wilderness.death-of-moses
    scope:
      - {book: Jos, chapter: 1, first: 1, last: 1}
    note: >-
      The book opens by dating itself from an event Deuteronomy 34 narrates:
      "Now it came to pass after the death of Moses, the servant of the Lord,
      that the Lord spoke to Josue". It recalls that death; it does not narrate
      it.
    sources: [bible:douay-rheims:Jos.1.1]
  - relation: narrated-event
    event: israel.conquest.sending-of-the-spies-to-jericho
    scope:
      - {book: Jos, chapter: 1, first: 10, last: 18}
      - {book: Jos, chapter: 2, first: 1, last: 24}
    note: >-
      The order to prepare victuals "for after the third day you shall pass
      over the Jordan" and the three days the spies lay hid, which are the same
      three days Josue 3:1-2 counts again. Josue 1:1-9, the Lord's charge, names
      no day and is left out of the run.
    sources: [bible:douay-rheims:Jos.1.11, bible:douay-rheims:Jos.2.22]
  - relation: narrated-event
    event: israel.conquest.war-against-the-kings-of-chanaan
    scope:
      - {book: Jos, chapter: 6, through: 12}
    note: >-
      Jericho, Hai, the Gabaonites, the kings of the south and the kings at the
      waters of Merom, and the catalogue of the conquered kings; the part Drum's
      Catholic Encyclopedia article calls "The Conquest (i-xii)", from the point
      where the dated days of Josue 4-5 end. Scripture dates none of these
      battles to a month or a day, and the seven days' compassing of Jericho at
      Josue 6:15 is a length without an anchor, so no separate event is authored
      for it.
    sources: [bible:douay-rheims:Jos.11.18, bible:douay-rheims:Jos.11.23]
  - relation: narrated-event
    event: israel.conquest.division-of-the-land
    scope:
      - {book: Jos, chapter: 13, first: 1, last: 33}
      - {book: Jos, chapter: 14, first: 1, last: 5}
      - {book: Jos, chapter: 15, through: 22}
    note: >-
      Josue 14:6-15, Caleb's own portion and his forty-five years, is dated
      separately on israel.conquest.calebs-inheritance and is left out of this
      run so that the one number spoken inside the division is not restated.
    sources: [bible:douay-rheims:Jos.13.1]
  - relation: narrated-event
    event: israel.conquest.last-charge-and-death-of-josue
    scope:
      - {book: Jos, chapter: 23, through: 24}
      - {book: Judg, chapter: 2, first: 6, last: 10}
    note: >-
      One event, two tellings: the assembly at Sichem and the burial in
      Thamnathsare at Josue 23-24, and the same dismissal, death and burial
      again at Judges 2:6-9, with the passing of that whole generation at Judges
      2:10. The recitals inside Josue 24 that recall the call of Abram, the
      descent into Egypt and the crossing of the Jordan are bound separately as
      retrospective, and are not this event.
    sources: [bible:douay-rheims:Jos.23.1, bible:douay-rheims:Jos.24.29, bible:douay-rheims:Judg.2.8]

