  # === lane deuteronomy ===
  # --- Deuteronomy: the one dated occasion, and what it recalls -------------
  # Deuteronomy 1:3 dates the speaking; the events Moses recalls across
  # chapters 1-11 are bound separately as retrospective-event. The two are not
  # collapsed: a verse in which Moses recalls Horeb in the fortieth year
  # carries both relations, which is what the model is for.
  - relation: utterance
    event: israel.wilderness.moses-final-discourse
    scope:
      - {book: Deut, chapter: 1, first: 6, through: 4, last: 40}
      - {book: Deut, chapter: 5, first: 1, through: 26, last: 19}
      - {book: Deut, chapter: 27, first: 1, through: 30, last: 20}
      - {book: Deut, chapter: 31, first: 1, through: 33, last: 29}
    note: >-
      The words themselves, spoken on the occasion Deuteronomy 1:3 dates: "In
      the fortieth year, the eleventh month, the first day of the month, Moses
      spoke to the children of Israel all that the Lord had commanded him to
      say to them." The four spans are the Catholic Encyclopedia's own division
      of the book in its "Pentateuch" article, which is where its stub
      "Deuteronomy" sends the introductory questions: "Introduction, i, 1-5",
      "(1) First Discourse, i, 6-iv, 40", "(2) Second Discourse, v, 1-xxvi,
      19", "(3) Third Discourse, xxvii, 1-xxx, 20", "(4) Historical Appendix,
      xxxi, 1-xxxiv, 12". Of the first three that article says: "The main body
      of the book consists of three discourses delivered by Moses to the people
      in the eleventh month of the fortieth year." The fourth span stops at
      33:29 because chapter 34 narrates the death and is bound to that event
      instead. The appendix carries no date of its own in that article, and is
      bound here on Scripture's own continuity - 31:1 resumes without a break,
      "And Moses went, and spoke all these words to all Israel", and 32:48 puts
      the Lord's command to go up Nebo on "the same day" as the canticle - and
      on the Catholic Encyclopedia's "Moses", which keeps the canticle and the
      blessings with the discourses in one last occasion: "Moses in his last
      days pronounces the three memorable discourses preserved in Deuteronomy
      ... He then bursts forth into a sublime song of praise to Jahweh and adds
      prophetic blessings for each of the twelve tribes." This binding says
      when the words were spoken and nothing about when the book was written;
      Deuteronomy's composition is a gap row, not a date.
    sources:
      - bible:douay-rheims:Deut.1.3
      - bible:douay-rheims:Deut.32.48
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11646c-5333461d
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10596a-ae23faf9
      - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04761b-babad506
  - relation: narrated-event
    event: israel.wilderness.moses-final-discourse
    scope:
      - {book: Deut, chapter: 4, first: 41, last: 49}
      - {book: Deut, chapter: 5, first: 1, last: 1}
      - {book: Deut, chapter: 27, first: 1, last: 1}
      - {book: Deut, chapter: 27, first: 9, last: 9}
      - {book: Deut, chapter: 27, first: 11, last: 11}
      - {book: Deut, chapter: 29, first: 1, last: 2}
      - {book: Deut, chapter: 31, first: 1, through: 33, last: 29}
    note: >-
      What the narrator tells of the same occasion, as against the words
      themselves. Deuteronomy 1:1-5 is bound elsewhere; these are the remaining
      frames. Of 4:41-49 the Catholic Encyclopedia's "Pentateuch" says: "By way
      of parenthesis, the sacred writer adds here (i) the appointment of three
      cities of refuge across the Jordan, iv, 41-43; (ii) an historical
      preamble, preparing us for the second discourse, iv, 44-49." Chapters
      31-33 are that article's "Historical Appendix" and both narrate and
      quote, so they stand under this relation and under utterance at once.
    sources:
      - bible:douay-rheims:Deut.1.3
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11646c-5333461d
  - relation: prophecy-given
    event: israel.wilderness.moses-final-discourse
    scope:
      - {book: Deut, chapter: 18, first: 15, last: 19}
    note: >-
      The oracle of the PROPHET to come, uttered on the dated occasion - "The
      Lord thy God will raise up to thee a PROPHET of thy nation and of thy
      brethren like unto me: him thou shalt hear:" - and carried on in the
      Lord's own words at 18:18, "I will raise them up a prophet out of the
      midst of their brethren like to thee: and I will put my words in his
      mouth, and he shall speak to them all that I shall command him."
      Authored beside the utterance binding rather than folded into it, so that
      the referent binding below has an oracle to answer to.
    sources: [bible:douay-rheims:Deut.18.15, bible:douay-rheims:Deut.18.18]
  - relation: prophetic-referent
    event: life-of-christ.nativity
    scope:
      - {book: Deut, chapter: 18, first: 15, last: 19}
    note: >-
      NOT narrated-event and NOT utterance. Scripture applies the words to Our
      Lord twice in its own voice: St Peter, "For Moses said: A prophet shall
      the Lord your God raise up unto you of your brethren, like unto me: him
      you shall hear according to all things whatsoever he shall speak to you"
      (Acts 3:22), and St Stephen, "This is that Moses who said to the children
      of Israel: A prophet shall God raise up to you of your own brethren, as
      myself" (Acts 7:37). The Catholic Encyclopedia's "Moses" says the same of
      the passage - "his chief utterance relates to a future Prophet, like to
      himself, whom the people are to receive" - and closes on "the
      incomparable Antitype whose coming he had predicted". No source inspected
      names a moment; the referent is bound to the coming in the flesh because
      that is the word the encyclopedia uses and because it is where this
      corpus already binds the prophecies of the Messias's coming at Isaias
      7:14 and Micheas 5:2. The choice of moment is this corpus's and not the
      source's, and nothing here dates the utterance, which the binding above
      holds.
    sources:
      - bible:douay-rheims:Acts.3.22
      - bible:douay-rheims:Acts.7.37
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10596a-ae23faf9

