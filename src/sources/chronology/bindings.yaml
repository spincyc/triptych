  # --- Abraham --------------------------------------------------------------
  - relation: narrated-event
    event: israel.patriarchs.abram-contact-with-egypt-and-elam
    scope:
      - {book: Gen, chapter: 12, first: 10, last: 20}
      - {book: Gen, chapter: 14, first: 1, last: 24}
    note: >-
      Two scopes on one binding because the Catholic Encyclopedia's "Israelites"
      names both chapters in one clause and puts both at the arrival in Chanaan.
    sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08193a-4931095f]
  - relation: prophetic-referent
    event: israel.egypt.sojourn
    scope:
      - {book: Gen, chapter: 15, first: 13, last: 13}
    note: >-
      The four hundred years are foretold to Abram here, and the corpus already
      holds them as one of the disputed measures of the sojourn. The relation is
      prophetic-referent and not narrated-event: Genesis 15 does not report the
      bondage, it foretells it.
    sources: [bible:douay-rheims:Gen.15.13]
  - relation: prophetic-referent
    event: israel.exodus.the-exodus
    scope:
      - {book: Gen, chapter: 15, first: 14, last: 16}
      - {book: Gen, chapter: 46, first: 3, last: 4}
      - {book: Gen, chapter: 50, first: 23, last: 24}
    note: >-
      Three places in Genesis where the going up out of Egypt is promised before
      it happens: "after this they shall come out with great substance" (15:14),
      "I will go down with thee thither, and will bring thee back again from
      thence" (46:4), and Joseph's "God will visit you after my death, and will
      make you go up out of this land" (50:23), with the oath about his bones
      that Exodus 13:19 discharges.
    sources:
      - bible:douay-rheims:Gen.15.14
      - bible:douay-rheims:Gen.46.4
      - bible:douay-rheims:Gen.50.23
  - relation: narrated-event
    event: israel.patriarchs.birth-of-ismael
    scope:
      - {book: Gen, chapter: 16, first: 1, last: 16}
    note: Genesis 16:3 dates the taking of Agar and 16:16 the birth itself.
    sources: [bible:douay-rheims:Gen.16.16]
  - relation: prophetic-referent
    event: israel.patriarchs.birth-of-isaac
    scope:
      - {book: Gen, chapter: 17, first: 15, last: 21}
      - {book: Gen, chapter: 18, first: 9, last: 15}
    note: >-
      The promise of Isaac, twice given and twice dated in the Douay text -
      Genesis 17:21, "whom Sara shall bring forth to thee at this time in the
      next year", and Genesis 18:10, "I will return and come to thee at this
      time, life accompanying" - and fulfilled at Genesis 21:2, "at the time
      that God had foretold her". The birth itself is bound under
      narrated-event at Genesis 21; these verses foretell it.
    sources:
      - bible:douay-rheims:Gen.17.21
      - bible:douay-rheims:Gen.18.10
  - relation: narrated-event
    event: israel.patriarchs.theophany-at-mambre
    scope:
      - {book: Gen, chapter: 18, first: 1, last: 33}
    sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01051a-8bd3c845]
  - relation: narrated-event
    event: israel.patriarchs.destruction-of-sodom
    scope:
      - {book: Gen, chapter: 19, first: 1, last: 29}
    note: >-
      The scope stops where the source stops. The Catholic Encyclopedia's
      "Abraham" carries the episode from the coming of the angels to Sodom
      through to "Next morning Abraham, looking from his tent towards Sodom,
      sees the smoke of destruction ascending to heaven", which is Genesis
      19:27-28, and says nothing after it. Genesis 19:30-38, Lot and his
      daughters in the cave and the begetting of Moab and Ammon, is a separate
      episode after the destruction; nothing inspected for this corpus dates
      it, and it stands under the book-scoped gap row instead.
    sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01051a-8bd3c845]
  - relation: narrated-event
    event: israel.patriarchs.death-of-sara
