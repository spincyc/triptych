    sources: [bible:douay-rheims:Gen.23.1]
  - relation: narrated-event
    event: israel.patriarchs.marriage-of-isaac
    scope:
      - {book: Gen, chapter: 24, first: 1, last: 67}
      - {book: Gen, chapter: 25, first: 20, last: 20}
    note: >-
      Genesis 24 narrates the bringing of Rebecca and Genesis 25:20 states the
      age; one event, two scopes, one date.
    sources: [bible:douay-rheims:Gen.25.20]
  - relation: narrated-event
