      NOT utterance of the promulgation and NOT a second promulgation. Moses in
      the fortieth year repeats to the generation in Moab the ten words the Lord
      spoke on the third day at Sinai, and Deuteronomy 5:22 says in the same
      breath whose words they are and where they were spoken: "These words the
      Lord spoke to all the multitude of you in the mountain, out of the midst
      of the fire and the cloud, and the darkness, with a loud voice, adding
      nothing more: and he wrote them in two tables of stone, which he delivered
      unto me." The utterance of these verses as Moses speaks them is already
      carried by the discourse's own binding, which Deuteronomy 1:3 dates to the
      fortieth year; this binding is the earlier occasion the recital recalls.
      Exodus 20:1-17 carries the same words as utterance of the promulgation
      itself.
    sources:
      - bible:douay-rheims:Deut.5.22
      - bible:douay-rheims:Ex.20.1
  - relation: retrospective-event
    event: israel.wilderness.forty-years-in-the-desert
    scope:
      - {book: Deut, chapter: 1, first: 34, last: 40}
      - {book: Deut, chapter: 1, first: 46, last: 46}
      - {book: Deut, chapter: 2, first: 1, last: 1}
      - {book: Deut, chapter: 2, first: 7, last: 7}
      - {book: Deut, chapter: 2, first: 14, last: 16}
      - {book: Deut, chapter: 8, first: 15, last: 16}
      - {book: Deut, chapter: 9, first: 7, last: 7}
      - {book: Deut, chapter: 11, first: 5, last: 5}
      - {book: Deut, chapter: 32, first: 10, last: 12}
    note: >-
      Moses recalling the sentence and its running out. 1:34-40 is his
      recollection of the oath sworn at Cades - "Not one of the men of this
      wicked generation shall see the good land" - which Numbers 14:33-34
      narrates and which the event is dated from; 2:7 says "how thou hast
      passed through this great wilderness, for forty years"; 2:14 gives the
      other measure the corpus does not reconcile with it, "the time that we
      journeyed from Cadesbarne till we passed over the torrent Zared, was
      thirty-eight years". 32:10-12 is the canticle's recital of the same
      leading, "He found him in a desert land ... The Lord alone was his
      leader". Deuteronomy 8:2-4 and 29:5 are already bound.
    sources:
      - bible:douay-rheims:Deut.1.35
      - bible:douay-rheims:Deut.2.7
      - bible:douay-rheims:Deut.2.14
  - relation: retrospective-event
    event: israel.wilderness.forty-days-on-the-mount
    scope:
      - {book: Deut, chapter: 9, first: 25, last: 25}
      - {book: Deut, chapter: 10, first: 1, last: 5}
      - {book: Deut, chapter: 10, first: 10, last: 11}
    note: >-
      The second forty days and the second tables, which Exodus 34 narrates:
      "And I lay prostrate before the Lord forty days and nights" (9:25), "And
      I stood in the mount, as before, forty days and nights" (10:10). The
      first fast is recalled at 9:9-11 and 9:18, already bound.
    sources: [bible:douay-rheims:Deut.9.25, bible:douay-rheims:Deut.10.10]
  - relation: retrospective-event
    event: israel.wilderness.golden-calf
    scope:
      - {book: Deut, chapter: 9, first: 25, last: 29}
    note: >-
      Moses' intercession after the calf, recalled in his own words: "destroy
      not thy people, and thy inheritance, which thou hast redeemed in thy
      greatness". Deuteronomy 9:8-21 is already bound to the same event.
    sources: [bible:douay-rheims:Deut.9.26]
  - relation: retrospective-event
    event: israel.wilderness.manna
    scope:
      - {book: Deut, chapter: 8, first: 16, last: 16}
    note: >-
      "And fed thee in the wilderness with manna which thy fathers knew not" -
      a second recital in the same discourse; 8:3 is already bound.
    sources: [bible:douay-rheims:Deut.8.16]
  - relation: retrospective-event
    event: israel.wilderness.death-of-aaron
    scope:
      - {book: Deut, chapter: 10, first: 6, last: 6}
      - {book: Deut, chapter: 32, first: 50, last: 50}
    note: >-
      "Mosera, where Aaron died and was buried, and Eleazar his son succeeded
      him in the priestly office" (10:6), and the Lord's own comparison at
      32:50, "as Aaron thy brother died in mount Hor, and was gathered to his
      people". Numbers 20 and 33:38-39 narrate it, and 33:38 is what dates it;
      Deuteronomy 10:6 names Mosera where Numbers names mount Hor, and this
      corpus records the recollection without reconciling the place.
    sources: [bible:douay-rheims:Deut.10.6, bible:douay-rheims:Deut.32.50]
  - relation: retrospective-event
    event: israel.egypt.descent
    scope:
      - {book: Deut, chapter: 10, first: 22, last: 22}
      - {book: Deut, chapter: 26, first: 5, last: 5}
    note: >-
      "In seventy souls thy fathers went down into Egypt" (10:22), and the
      firstfruits confession, "The Syrian pursued my father, who went down into
      Egypt, and sojourned there in a very small number" (26:5).
    sources: [bible:douay-rheims:Deut.10.22, bible:douay-rheims:Deut.26.5]
  - relation: retrospective-event
    event: israel.egypt.sojourn
    scope:
      - {book: Deut, chapter: 26, first: 6, last: 7}
    note: >-
      The bondage, in the same confession: "And the Egyptians afflicted us, and
      persecuted us, laying on us most grievous burdens: And we cried to the
      Lord God of our fathers: who heard us, and looked down upon our
      affliction, and labour, and distress:" No number of years is recited here
      and none is imported.
    sources: [bible:douay-rheims:Deut.26.6, bible:douay-rheims:Deut.26.7]
  - relation: retrospective-event
    event: israel.primeval.creation-of-adam
    scope:
      - {book: Deut, chapter: 4, first: 32, last: 32}
    note: >-
      "Ask of the days of old, that have been before thy time from the day that
      God created man upon the earth" - the furthest back the discourse
      reaches, and a recital, not a narration.
    sources: [bible:douay-rheims:Deut.4.32]
  # === lane esdras ===
  # --- 1 Esdras: the return under Zorobabel and the Temple ------------------
  - relation: narrated-event
    event: israel.restoration.return-and-temple-rebuilding
    scope:
      - {book: 1Esd, chapter: 1}
      - {book: 1Esd, chapter: 2}
      - {book: 1Esd, chapter: 3}
      - {book: 1Esd, chapter: 4, first: 1, last: 5}
      - {book: 1Esd, chapter: 4, first: 24, last: 24}
      - {book: 1Esd, chapter: 5}
      - {book: 1Esd, chapter: 6}
    note: >-
      The former of the two parallel parts of the book, which Souvay's "Esdras"
      says covers twenty-one years, 536-515. Chapter 4:6-23 is deliberately
      left out: the same article calls it "the break in the narrative" and Van
      Hoonacker dates it to two later reigns, so it carries its own event.
    sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778]
  - relation: narrated-event
    event: israel.restoration.decree-of-cyrus
    scope:
      - {book: 1Esd, chapter: 1, first: 5, last: 11}
      - {book: 1Esd, chapter: 2}
    note: >-
      The going up itself and the roll of those who went up, which the text
      places at the decree: "these are the children of the province, that went
      out of the captivity ... and who returned to Jerusalem and Juda". Souvay
      describes chapter ii as "the enumeration of the most prominent members of
      the caravan". The existing binding covers only the decree at 1:1-4.
    sources: [bible:douay-rheims:1Esd.2.1, bible:douay-rheims:1Esd.1.11]
  - relation: narrated-event
    event: israel.restoration.altar-restored
    scope:
      - {book: 1Esd, chapter: 3, first: 1, last: 7}
    note: >-
      The seventh month, the altar set upon its bases, the feast of
      tabernacles, and the holocausts begun before the temple was founded.
    sources: [bible:douay-rheims:1Esd.3.6]
  - relation: narrated-event
    event: israel.restoration.walls-forbidden-by-artaxerxes
    scope:
      - {book: 1Esd, chapter: 4, first: 6, last: 23}
    note: >-
      The break in the narrative: the accusation under Assuerus, the letter to
      Artaxerxes, his rescript and the forcible stopping of the work. Van
      Hoonacker reads exactly these verses as belonging to the reigns of Xerxes
      and Artaxerxes I, decades after the Temple was finished.
    sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067]
  - relation: narrated-event
    event: israel.restoration.first-pasch-in-the-second-temple
    scope:
      - {book: 1Esd, chapter: 6, first: 19, last: 22}
    note: The phase on the fourteenth day of the first month, and the seven days of unleavened bread.
    sources: [bible:douay-rheims:1Esd.6.19]

  # --- 1 Esdras: the mission of Esdras --------------------------------------
  - relation: narrated-event
    event: israel.restoration.esdras-return
    scope:
      - {book: 1Esd, chapter: 7, first: 1, last: 5}
      - {book: 1Esd, chapter: 7, first: 11, last: 28}
      - {book: 1Esd, chapter: 8}
    note: >-
      Esdras's descent, which the text places at his introduction "in the reign
      of Artaxerxes king of the Persians" and which Souvay reads there -- "Esdras
      was of priestly descent and belonged to the line of Sardoc (Ezra 7:1-5)";
      the edict of Artaxerxes; and the caravan, its roll, the fast at the river
      Ahava and the journey from the twelfth day of the first month to the
      arrival at Jerusalem. Souvay: "Opening with the decree of Artaxerxes (vii)
      and the census of the members of the party, it briefly relates the journey
      across the desert (viii)". The existing binding covers only 7:6-10.
    sources:
      - bible:douay-rheims:1Esd.7.1
      - bible:douay-rheims:1Esd.8.1
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778
  - relation: narrated-event
    event: israel.restoration.esdras-reform-of-marriages
    scope:
      - {book: 1Esd, chapter: 9}
      - {book: 1Esd, chapter: 10, first: 1, last: 8}
    note: >-
      The discovery of the strange marriages, Esdras's mourning and prayer, the
      counsel of Sechenias, the oath, and the proclamation summoning the people
      within three days.
    sources: [bible:douay-rheims:1Esd.9.1]
  - relation: utterance
    event: israel.restoration.esdras-reform-of-marriages
    scope:
      - {book: 1Esd, chapter: 9, first: 6, last: 15}
    note: >-
      Esdras's prayer, spoken at the evening sacrifice on the day the
      transgression was reported to him. The words quoted and the occasion they
      were spoken on are two assertions, not one.
    sources: [bible:douay-rheims:1Esd.9.5]
  - relation: narrated-event
    event: israel.restoration.strange-wives-assembly
    scope:
      - {book: 1Esd, chapter: 10, first: 9, last: 15}
    note: The gathering in the street of the house of God, in the rain, and the appointing of the rulers.
    sources: [bible:douay-rheims:1Esd.10.9]
  - relation: narrated-event
    event: israel.restoration.strange-wives-put-away
    scope:
      - {book: 1Esd, chapter: 10, first: 16, last: 44}
    note: >-
      The three months of the commission's sessions and the roll of those found
      to have taken strange wives, which the text places at the sessions that
      examined them.
    sources: [bible:douay-rheims:1Esd.10.16]

  # --- 2 Esdras: the first mission of Nehemias ------------------------------
  - relation: narrated-event
    event: israel.restoration.nehemias-tidings-of-jerusalem
    scope:
      - {book: 2Esd, chapter: 1}
    note: The month of Casleu in the twentieth year, at the castle of Susa.
    sources: [bible:douay-rheims:2Esd.1.1]
  - relation: utterance
    event: israel.restoration.nehemias-tidings-of-jerusalem
    scope:
      - {book: 2Esd, chapter: 1, first: 5, last: 11}
    note: >-
      Nehemias's prayer, spoken in the days of fasting that followed the
      tidings and before he stood before the king.
    sources: [bible:douay-rheims:2Esd.1.4]
  - relation: narrated-event
    event: israel.restoration.nehemias-mission
    scope:
      - {book: 2Esd, chapter: 2, first: 9, last: 20}
      - {book: 2Esd, chapter: 3}
      - {book: 2Esd, chapter: 4}
      - {book: 2Esd, chapter: 5}
      - {book: 2Esd, chapter: 6, first: 1, last: 14}
      - {book: 2Esd, chapter: 6, first: 17, last: 19}
      - {book: 2Esd, chapter: 7, first: 1, last: 5}
      - {book: 2Esd, chapter: 11}
      - {book: 2Esd, chapter: 12, first: 27, last: 46}
      - {book: 2Esd, chapter: 13, first: 1, last: 3}
    note: >-
      The whole of Van Hoonacker's Section I apart from the tidings at Susa,
      together with the parts of Section II he assigns to the same mission: the
      journey and the night survey of the wall; chapter iii, which he calls "a
      document of the highest importance for determining the area of Jerusalem
      in the middle of the fifth century B.C.", and which is a builders' roll
      standing at the work it records; the opposition of Sanaballat, the usury,
      the twelve years of the governorship; the numbering of the people (vii,
      1-5); the peopling of Jerusalem and its census, of which he says "verses
      3-36 give the census of Jerusalem and of other towns as Nehemiah's
      measures left it"; the dedication of the walls, "In chapter xii, 27-43,
      we have the account of the solemn dedication of the walls of Jerusalem";
      and the commission and separation of xii, 44-xiii, 3, which he groups
      with the covenant -- "After chapter x it is advisable to read xii,
      43-xiii, 1-3". The existing binding covers only 2:1-8 and 6:15-16. The
      list at xii, 1-26 is deliberately left unbound: see the notes.
    sources:
      - bible:douay-rheims:2Esd.5.14
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067
  - relation: narrated-event
    event: israel.restoration.wall-of-jerusalem-finished
    scope:
      - {book: 2Esd, chapter: 6, first: 15, last: 16}
    note: >-
      The twenty-fifth of Elul, in fifty-two days. The existing binding already
      reaches these verses from the mission as a whole; this one carries the
      day the mission event cannot.
    sources: [bible:douay-rheims:2Esd.6.15]
  - relation: retrospective-event
    event: israel.restoration.decree-of-cyrus
    scope:
      - {book: 2Esd, chapter: 7, first: 6, last: 73}
    note: >-
      Not what Nehemias did, but the book he found: "I found a book of the
      number of them who came up at first". Van Hoonacker: "He gives (vii, 5
      ff.) the list of the families who had returned from captivity with
      Zorobabel. This list is in I Esd., ii." The occasion the list stands in
      is the numbering of the people, bound above; the return it records is a
      century earlier, and a passage that recalls an event does not narrate it.
    sources:
      - bible:douay-rheims:2Esd.7.6
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067

  # --- 2 Esdras: the Law read and the covenant renewed ----------------------
  - relation: narrated-event
    event: israel.restoration.reading-of-the-law
    scope:
      - {book: 2Esd, chapter: 8}
    note: >-
      The first day of the seventh month and the days that followed it: the
      reading, the joy of the people, the second day's exposition, and the
      feast of tabernacles kept seven days with the reading continued "from the
      first day till the last".
    sources: [bible:douay-rheims:2Esd.8.2]
  - relation: narrated-event
    event: israel.restoration.covenant-renewed
    scope:
      - {book: 2Esd, chapter: 9}
      - {book: 2Esd, chapter: 10}
    note: >-
      The fast of the twenty-fourth day, the confession, and the written
      covenant with the roll of its subscribers, which the text places at the
      sealing: "And the subscribers were Nehemias, Athersatha the son of
      Hachelai". Chapter 9 already carries retrospective bindings to the events
      the confession recalls; this is the occasion those words were the
      confession of.
    sources: [bible:douay-rheims:2Esd.9.1, bible:douay-rheims:2Esd.9.38]
  - relation: utterance
    event: israel.restoration.covenant-renewed
    scope:
      - {book: 2Esd, chapter: 9, first: 5, last: 38}
    note: >-
      The Levites' confession, spoken on the twenty-fourth day. What it recalls
      is bound elsewhere under retrospective-event and is not this assertion.
    sources: [bible:douay-rheims:2Esd.9.5]

  # --- 2 Esdras: the second mission -----------------------------------------
  - relation: narrated-event
    event: israel.restoration.nehemias-second-mission
    scope:
      - {book: 2Esd, chapter: 13, first: 4, last: 5}
      - {book: 2Esd, chapter: 13, first: 8, last: 31}
    note: >-
      Van Hoonacker's Section III: "it is with his doings during this second
      mission that xiii, 4-31 is concerned" -- the storeroom of Tobias cast out,
      the tithes restored, the sabbath enforced, the strange wives driven off.
      The existing binding covers only 13:6-7.
    sources:
      - bible:douay-rheims:2Esd.13.6
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067
  # === lane exodus ===
  # --- Exodus: from the birth of Moses to the going out ----------------------
  - relation: narrated-event
    event: israel.exodus.moses-in-madian
    scope:
      - {book: Ex, chapter: 2, first: 11, last: 25}
    note: >-
      From the slaying of the Egyptian to the death of the king of Egypt, which
      is the whole of the forty years the Acts assign to the Madian sojourn.
      Exodus dates the opening of the run only as "In those days, after Moses
      was grown up" and its close as "after a long time"; the number is the
      event's, from Acts 7:23 and 7:30, and not this binding's.
    sources: [bible:douay-rheims:Ex.2.11, bible:douay-rheims:Ex.2.23]
  - relation: narrated-event
    event: israel.exodus.return-of-moses-to-egypt
    scope:
      - {book: Ex, chapter: 4, first: 18, last: 31}
    note: >-
      The leave-taking from Jethro, the journey, the meeting with Aaron at the
      mountain of God, and the first assembly of the ancients. The run opens at
      4:18 because the vocation dialogue that the burning-bush event carries
      closes at 4:17.
    sources: [bible:douay-rheims:Ex.4.18]
  - relation: narrated-event
    event: israel.exodus.moses-before-pharao
    scope:
      - {book: Ex, chapter: 6, first: 1, last: 13}
      - {book: Ex, chapter: 6, first: 28, last: 30}
      - {book: Ex, chapter: 7, first: 1, last: 5}
    note: >-
      The renewal of the commission after the first audience failed, and the
      charge given immediately before the plagues begin. It joins the two runs
      the corpus already binds to this event - Exodus 5 and Exodus 7:6-13 - so
      that the whole approach to Pharao stands together. Exodus 6:28 marks the
      occasion in the text's own words, "In the day when the Lord spoke to
      Moses in the land of Egypt". The genealogy at 6:14-27 is bound
      separately, because it looks back over the sojourn rather than forward to
      Pharao.
    sources: [bible:douay-rheims:Ex.6.28]
  - relation: retrospective-event
    event: israel.egypt.sojourn
    scope:
      - {book: Ex, chapter: 6, first: 14, last: 27}
    note: >-
      The genealogy of the heads of the houses of Ruben, Simeon and Levi down
      to Aaron and Moses, with the lifetimes of Levi, Caath and Amram. It
      recalls the generations of the sojourn in Egypt, which is the event the
      corpus already dates at Exodus 12:40; it is not a narrative of anything
      happening at Exodus 6, and it is not a chronology of its own. The years
      the passage prints are lifetimes, not dates, and the corpus does not add
      them into one.
    sources: [bible:douay-rheims:Ex.6.16, bible:douay-rheims:Ex.6.20]
  - relation: narrated-event
    event: israel.exodus.the-plagues-of-egypt
    scope:
      - {book: Ex, chapter: 7, first: 14, through: 11}
      - {book: Ex, chapter: 12, first: 29, last: 30}
    note: >-
      The nine plagues from the striking of the river to the darkness, and the
      tenth at Exodus 12:29-30. Those two verses carry the Exodus itself as
      well, because the slaying of the firstborn is at once the last plague and
      the night of the going out; that is one event narrated under two heads
      and not two dates. The Catholic Encyclopedia's "Plagues of Egypt" heads
      its article with a wider range than this scope - "Ten calamities
      inflicted on the Egyptians ... (Exodus 7:8 - 12:30)" - but puts the first
      five verses of it outside the count, treating the rod turned into a
      serpent as a wonder wrought before the plagues began: "the wonder of
      changing Aaron's rod into a serpent, which was wrought in proof of Moses's
      Divine mission, made no impression, as it was imitated by the Egyptian
      magicians (Exodus 5; 7:8-13). A series of afflictions, culminating in the
      destruction of all the first-born of Egypt, was required before Pharao
      yielded." So it begins the count where Scripture's first plague begins,
      which is where this scope begins, and the difference between the two
      extents is Exodus 7:8-13, bound to no plague here either.
    sources:
      - bible:douay-rheims:Ex.7.14
      - bible:douay-rheims:Ex.12.29
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12143a-0612afa4

  # --- Exodus: the march to Sinai --------------------------------------------
  - relation: utterance
    event: israel.exodus.the-exodus
    scope:
      - {book: Ex, chapter: 15, first: 1, last: 21}
    note: >-
      The canticle of Moses and the canticle of Mary, sung at the sea on the
      day of the passage: "Then Moses and the children of Israel sung this
      canticle to the Lord, and said: Let us sing to the Lord: for he is
      gloriously magnified, the horse and the rider he hath thrown into the
      sea." The words are quoted, not narrated, so the relation is utterance;
      the passage of the sea it celebrates is the event
      the corpus already dates, and the singing carries no separate date.
    sources: [bible:douay-rheims:Ex.15.1, bible:douay-rheims:Ex.15.20]
  - relation: narrated-event
    event: israel.wilderness.mara-and-elim
    scope:
      - {book: Ex, chapter: 15, first: 22, last: 27}
    note: >-
      The three days' march through the wilderness of Sur, the bitter waters,
      and the encampment at Elim.
    sources: [bible:douay-rheims:Ex.15.22]
  - relation: narrated-event
    event: israel.wilderness.raphidim
    scope:
      - {book: Ex, chapter: 17, first: 1, last: 16}
    note: >-
      The setting forward from the desert of Sin, the water struck from the
      rock Horeb, and the battle with Amalec, all at the one encampment.
    sources: [bible:douay-rheims:Ex.17.1]
  - relation: narrated-event
    event: israel.wilderness.jethro-and-the-judges
    scope:
      - {book: Ex, chapter: 18, first: 1, last: 27}
    note: >-
      The whole chapter is one visit: Jethro's coming to the camp by the
      mountain of God, the sacrifice, the counsel, the appointment of the
      rulers, and the departure at 18:27. Where the visit stands in the march
      is a question the event's note leaves open, and this binding does not
      close it.
    sources: [bible:douay-rheims:Ex.18.5]

  # --- Exodus: Sinai ---------------------------------------------------------
  - relation: narrated-event
    event: israel.wilderness.promulgation-of-the-law
    scope:
      - {book: Ex, chapter: 20, first: 1, last: 26}
    note: >-
      The day the Lord came down on the mount and spoke the ten words, the
      people's fear at 20:18-21, and the first ordinance given to Moses in the
      cloud. The date is the third day of Exodus 19:16 and belongs to the
      event.
    sources: [bible:douay-rheims:Ex.20.1]
  - relation: utterance
    event: israel.wilderness.promulgation-of-the-law
    scope:
      - {book: Ex, chapter: 20, first: 1, last: 17}
      - {book: Ex, chapter: 20, through: 23, first: 22, last: 33}
    note: >-
      The words themselves: the ten commandments as spoken, and the judgments
      the Lord spoke to Moses in the cloud from 20:22 onward - "These are the
      judgments which thou shalt set before them" - which Moses tells to the
      people at Exodus 24:3 and reads to them out of the book of the covenant
      at 24:7. Quoted words and the narrative that frames them are two
      assertions on the same verses, which is what the two relations are for.
    sources: [bible:douay-rheims:Ex.20.22, bible:douay-rheims:Ex.21.1, bible:douay-rheims:Ex.24.7]
  - relation: narrated-event
    event: israel.wilderness.covenant-at-sinai
    scope:
      - {book: Ex, chapter: 24, first: 1, last: 11}
    note: >-
      The altar and the twelve titles, the blood of the covenant, and the
      seventy ancients who went up and saw the God of Israel. The run closes at
      24:11 because the ascent into the cloud at 24:12 is the forty days, which
      the corpus binds separately.
    sources: [bible:douay-rheims:Ex.24.4]
  - relation: narrated-event
    event: israel.wilderness.forty-days-on-the-mount
    scope:
      - {book: Ex, chapter: 25, through: 31}
    note: >-
      What Moses received during the first forty days: the pattern of the
      tabernacle and its vessels, the priesthood and its vestments, the rites
      of consecration, and at 31:18 the two stone tables. Exodus 31:18 says so
      in the text's own words - "the Lord, when he had ended these words in
      Mount Sinai, gave to Moses two stone tables of testimony" - which is what
      makes these seven chapters one stay on the mount and not seven dates.
    sources: [bible:douay-rheims:Ex.31.18, bible:douay-rheims:Ex.24.18]
  - relation: utterance
    event: israel.wilderness.forty-days-on-the-mount
    scope:
      - {book: Ex, chapter: 25, through: 31, last: 17}
    note: >-
      The same seven chapters as words spoken: "And the Lord spoke to Moses,
      saying" at 25:1, running to the end of the discourse at 31:17. The
      narration of the giving of the tables at 31:18 is not part of the speech
      and is left to the narrated-event binding.
    sources: [bible:douay-rheims:Ex.25.1]
  - relation: narrated-event
    event: israel.wilderness.golden-calf
    scope:
      - {book: Ex, chapter: 33, first: 1, last: 23}
    note: >-
      The immediate sequel of the calf and part of the same episode: the Lord's
      refusal to go up in the midst of the people, their mourning and the
      laying aside of their ornaments "by Mount Horeb" at 33:6, the tabernacle
      pitched without the camp, and Moses' prayer to see the glory. Exodus 34
      opens the second forty days and is bound to that event instead, so this
      run closes at 33:23. The Anno Mundi figure the Haydock edition prints at
      the head of Exodus 32 is a year and covers this run without being
      stretched to a day.
    sources: [bible:douay-rheims:Ex.33.1, bible:douay-rheims:Ex.33.6]
  - relation: narrated-event
    event: israel.wilderness.forty-days-on-the-mount
    scope:
      - {book: Ex, chapter: 34, first: 1, last: 26}
      - {book: Ex, chapter: 34, first: 29, last: 35}
    note: >-
      The second of the two stays, which the event's own note already records
      from Exodus 34:28 and which the Catholic Encyclopedia's "Moses" states as
      "two periods of forty days each". The run opens at 34:1 with the command
      to hew the second tables and the ascent at 34:4, and resumes at 34:29
      with the descent, the horned face and the veil; 34:27-28, which carries
      the forty days themselves, is already bound.
    sources: [bible:douay-rheims:Ex.34.4, bible:douay-rheims:Ex.34.29]

  # --- Exodus: the tabernacle -------------------------------------------------
  - relation: narrated-event
    event: israel.wilderness.making-of-the-tabernacle
    scope:
      - {book: Ex, chapter: 35, through: 39}
    note: >-
      Five chapters of one work: the calling of the people and their offerings,
      Beseleel and Ooliab, the curtains, the boards, the ark, the table, the
      candlestick, the altars, the court, the vestments, and at 39:43 Moses
      seeing all things finished. The date is the event's and is a terminus,
      not a start.
    sources: [bible:douay-rheims:Ex.35.4, bible:douay-rheims:Ex.39.43]
  - relation: narrated-event
    event: israel.wilderness.erection-of-the-tabernacle
    scope:
      - {book: Ex, chapter: 40, first: 1, last: 13}
    note: >-
      The command that carries the date. Exodus 40:2 in this Douay numbering is
      the verse that names the day - "The first month, the first day of the
      month, thou shalt set up the tabernacle of the testimony" - and the run
      stops at 40:13, the last verse of that command. The doing begins at 40:14,
      "And Moses did all that the Lord had commanded", and is carried by the
      separate 40:14-33 binding on this same event, which is where 40:15, the
      verse that records the tabernacle set up, is reached. The command and the
      doing are two ranges on one event and not two events.
    sources: [bible:douay-rheims:Ex.40.2]
  - relation: narrated-event
    event: israel.wilderness.forty-years-in-the-desert
    scope:
      - {book: Ex, chapter: 40, first: 34, last: 36}
    note: >-
      The last three verses of the book leave the day the tabernacle was raised
      and describe the whole march: "If at any time the cloud removed from the
      tabernacle, the children of Israel went forward by their troops ...
      throughout all their mansions." That is the wilderness period, not the
      erection, and it is bound to the wilderness period accordingly. Numbers
      9:15-23 tells the same thing at greater length.
    sources: [bible:douay-rheims:Ex.40.34, bible:douay-rheims:Ex.40.36]
  # === lane ezechiel ===
  # === bind-ezechiel ===================================================
  # The book of Ezechiel, whose fourteen datelines are the most precise
  # self-dating in the prophets. Each dated oracle is bound at the extent the
  # next dateline fixes, except where Schets's "Ezekiel" in the Catholic
  # Encyclopedia marks a structural boundary of its own; every such decision is
  # stated on the binding that made it. Two bindings cover the whole book,
  # because the exile is the occasion of all of it and the ministry is the span
  # all of it was uttered in.
  - relation: historical-setting
    event: israel.exile.second-captivity
    scope:
      - {book: Ezech}
    note: >-
      The whole book, under historical-setting and never under narrated-event:
      this says what occasion tradition associates the text with, not that
      every verse narrates it. Schets's "Ezekiel" (Catholic Encyclopedia, New
      York, 1909) places the prophet's whole life there from that deportation:
      he "was the son of Buzi, and was one of the priests who, in the year 598
      B.C., had been deported together with Joachim as prisoners from Jerusalem
      (2 Kings 24:12-16; cf. Ezekiel 33:21, 40:1)", and "With the other exiles
      he settled in Tell-Abib near the Chobar (Ezek. i,1; iii, 15) in Babylonia,
      and seems to have spent the rest of his life there." Scripture says the
      same of the place at Ezech. 1:1, "when I was in the midst of the captives
      by the river Chobar". The article's "598 B.C." is one year earlier than
      the "597 B.C." held as an alternate on this event and is on a different
      reckoning from the "A.M. 3405" it prefers; the disagreement lives on the
      event, and this binding carries no date at all.
    sources:
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
      - bible:douay-rheims:Ezech.1.1
  - relation: prophecy-given
    event: israel.exile.ezechiel.ministry
    scope:
      - {book: Ezech}
    note: >-
      The span, not a day: every oracle in the book was uttered inside the
      ministry, and the ministry's own claim is relative and bounded only at
      its beginning. Schets's "Ezekiel" gives the bound and its hedge: "From
      Ezek. xxix, 17 it appears that he prophesied during at least twenty-two
      years." The chapters that carry a dateline of their own are bound again,
      more narrowly, below; this binding is what reaches the chapters that
      carry none — Ezech. 12-19, 25, 30:1-19 and 33:1-20 — and it reaches them
      with a span and not with a date those chapters do not have.
    sources:
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
      - bible:douay-rheims:Ezech.29.17
  # --- the fourteen datelines, in the order they stand in the book ----------
  - relation: prophecy-given
    event: israel.exile.ezechiel.call
    scope:
      - {book: Ezech, chapter: 1, through: 3, first: 1, last: 15}
    note: >-
      Boundary fixed at 3:15 because the next dateline falls at 3:16, "And at
      the end of seven days the word of the Lord came to me". Schets's
      "Ezekiel" runs its introduction one section further, to "the vision of
      the calling of the prophet (Ezek. i-iii, 21)", but that division is not a
      dating and the seven-day interval inside it is: 3:16 is separately dated
      and separately bound, so the earlier bound is taken.
    sources:
      - bible:douay-rheims:Ezech.1.1
      - bible:douay-rheims:Ezech.3.15
  - relation: prophecy-given
    event: israel.exile.ezechiel.watchman-charge
    scope:
      - {book: Ezech, chapter: 3, through: 7, first: 16, last: 27}
    note: >-
      Boundary fixed at 7:27 because the next dateline falls at 8:1, and the
      run is confirmed by Schets's "Ezekiel", which keeps the same material in
      one group: "After a second revelation, in which God discloses to the
      prophet His course of action (iii, 22-27), the prophet foretells by
      symbolic acts (iv, v) and in words (vi-vii), the siege and capture of
      Jerusalem, and the banishment of Juda."
    sources:
      - bible:douay-rheims:Ezech.3.16
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.ezechiel.vision-of-the-abominations
    scope:
      - {book: Ezech, chapter: 8, through: 11, first: 1, last: 25}
    note: >-
      Boundary fixed at 11:25 and NOT at the next dateline, which is nineteen
      verses into chapter 20. Two controls agree against the mechanical rule
      here. Scripture closes the vision itself at 11:25, "And I spoke to them of
      the captivity all the words of the Lord, which he had shewn me"; and
      Schets's "Ezekiel" makes viii-xi one group and opens a new one at xii:
      "In a prophetic vision, in the presence of the elders of Israel, God
      reveals to him the cause of these punishments... With this the judgment
      which the prophet communicates to the exiles ends (xi). In the third
      group (xii-xix) many different prophecies are brought together, whose
      sole connection is the relation they bear to the guilt and punishment of
      Jerusalem and Juda." Carrying the sixth year over xii-xix would date
      eight chapters no source dates; they stand under the book-wide bindings
      instead.
    sources:
      - bible:douay-rheims:Ezech.8.1
      - bible:douay-rheims:Ezech.11.25
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.ezechiel.elders-inquiry
    scope:
      - {book: Ezech, chapter: 20, through: 23, first: 1, last: 49}
    note: >-
      Boundary fixed at 23:49 because the next dateline falls at 24:1, and
      Schets's "Ezekiel" bounds the same group the same way, from "In the
      presence of the elders the prophet denounces the whole people of Israel
      ... (xx)" through "but Juda is more guilty than Israel has ever been
      (xxiii)".
    sources:
      - bible:douay-rheims:Ezech.20.1
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.final-siege
    scope:
      - {book: Ezech, chapter: 24}
    note: >-
      No new event: Scripture says this oracle was uttered on the day the siege
      of Jerusalem began, which the corpus already holds. Ezech. 24:1-2 reads
      "And the word of the Lord came to me in the ninth year, in the tenth
      month, the tenth day of the month, saying: Son of man, write thee the
      name of this day, on which the king of Babylon hath set himself against
      Jerusalem to day", and 4 Kings 25:1, which dates the event, reads "in the
      ninth year of his reign, in the tenth month, the tenth day of the month,
      that Nabuchodonosor, king of Babylon, came". The two texts count in two
      reckonings — Ezechiel from the captivity of Joachin, 4 Kings from the
      reign of Sedecias — and they fall on the same year, month and day;
      Ezechiel's own verse is what identifies the day, and nothing is
      harmonised beyond what it says. Boundary fixed at 24:27 because Schets's
      "Ezekiel" ends the first part there and opens the prophecies against the
      Gentiles at xxv, and because it ties this chapter to that day in so many
      words: "On the day on which the siege of Jerusalem began, the prophet
      represents, under the figure of the rusty pot, what was to befall the
      inhabitants of the city."
    sources:
      - bible:douay-rheims:Ezech.24.1
      - bible:douay-rheims:Ezech.24.2
      - bible:douay-rheims:4Kings.25.1
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.ezechiel.oracle-against-tyre
    scope:
      - {book: Ezech, chapter: 26, through: 28, first: 1, last: 26}
    note: >-
      Boundary fixed at 28:26 because the next dateline falls at 29:1, and
      Schets's "Ezekiel" runs the same stretch before the Egyptian oracles
      begin: "He treats more at length of Tyre and its king (xxxvi-xxviii,19),
      after which he casts a glance at Sidon (xxviii, 20-26)." The "xxxvi" is a
      transcription slip for xxvi in the source, as its own terminus at
      xxviii,19 shows. Chapter 25, the oracles on Ammon, Moab, Edom and the
      Philistines, carries no dateline and is deliberately left outside this
      scope: the encyclopedia groups it with the Gentile prophecies but dates
      nothing in it.
    sources:
      - bible:douay-rheims:Ezech.26.1
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.ezechiel.first-oracle-against-egypt
    scope:
      - {book: Ezech, chapter: 29, first: 1, last: 16}
    note: >-
      Boundary fixed at 29:16 because the next dateline falls at 29:17, inside
      the same chapter.
    sources: [bible:douay-rheims:Ezech.29.1]
  - relation: prophecy-given
    event: israel.exile.ezechiel.egypt-as-wages-for-nabuchodonosor
    scope:
      - {book: Ezech, chapter: 29, first: 17, last: 21}
    note: >-
      Boundary fixed at the chapter's end and NOT at the next dateline, which
      falls at 30:20. Ezech. 30:1-19 opens with its own undated revelation
      formula, "And the word of the Lord came to me, saying" (30:1), so the
      twenty-seventh year is not carried across it; it stands under the
      book-wide bindings instead. Schets's "Ezekiel" counts "Six prophecies
      against Egypt... dating from different years (xxix-xxxii" without saying
      where each begins or ends, so it does not settle the question either way.
    sources:
      - bible:douay-rheims:Ezech.29.17
      - bible:douay-rheims:Ezech.30.1
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.ezechiel.broken-arm-of-pharao
    scope:
      - {book: Ezech, chapter: 30, first: 20, last: 26}
    note: >-
      Boundary fixed at 30:26 because the next dateline falls at 31:1, the
      first verse of the next chapter.
    sources: [bible:douay-rheims:Ezech.30.20]
  - relation: prophecy-given
    event: israel.exile.ezechiel.parable-of-the-cedar
    scope:
      - {book: Ezech, chapter: 31}
    note: >-
      Boundary fixed at 31:18 because the next dateline falls at 32:1, so this
      oracle is exactly the chapter.
    sources: [bible:douay-rheims:Ezech.31.1]
  - relation: prophecy-given
    event: israel.exile.ezechiel.lamentation-for-pharao
    scope:
      - {book: Ezech, chapter: 32, first: 1, last: 16}
    note: >-
      Boundary fixed at 32:16 because the next dateline falls at 32:17, inside
      the same chapter.
    sources: [bible:douay-rheims:Ezech.32.1]
  - relation: prophecy-given
    event: israel.exile.ezechiel.lamentation-for-the-multitude-of-egypt
    scope:
      - {book: Ezech, chapter: 32, first: 17, last: 32}
    note: >-
      Boundary fixed at the chapter's end and NOT at the next dateline, which
      falls at 33:21. Schets's "Ezekiel" closes the Gentile prophecies at
      xxxii and opens the third part at xxxiii — "The third part
      (xxxiii-xlviii), is occupied with the Divine utterances on the subject of
      Israel's restoration" — so the twelfth year is not carried into a section
      the source separates. Ezech. 33:1-20, the watchman discourse that opens
      that third part, carries no dateline of its own and stands under the
      book-wide bindings.
    sources:
      - bible:douay-rheims:Ezech.32.17
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.ezechiel.news-of-the-fall-of-jerusalem
    scope:
      - {book: Ezech, chapter: 33, through: 39, first: 21, last: 29}
    note: >-
      Boundary fixed at 39:29 because the next and last dateline falls at 40:1.
      This is the longest carry in the book and it is stated plainly: only the
      coming of the fugitive at 33:21-22 is dated, and the restoration oracles
      that follow it — the shepherds and the second David (xxxiv), Mount Seir
      and the new spirit (xxxv-xxxvii), the dry bones (xxxvii), and Gog
      (xxxviii-xxxix) — carry no dateline of their own. Schets's "Ezekiel"
      treats them as one movement from that announcement, opening the third
      part at xxxiii and running it unbroken to xlviii, so no earlier boundary
      is available from the source, and the next dateline is the only bound
      Scripture gives.
    sources:
      - bible:douay-rheims:Ezech.33.21
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: prophecy-given
    event: israel.exile.ezechiel.vision-of-the-new-temple
    scope:
      - {book: Ezech, chapter: 40, through: 48, first: 1, last: 35}
    note: >-
      Boundary fixed at the book's end because 40:1 is the last dateline and
      Schets's "Ezekiel" treats the whole of it as one vision: "In the last
      prophetic vision, God shows the new temple (xl-xliii), the new worship
      (xliii-xlvi), the return to their own land, and the new division thereof
      among the twelve tribes (xlvii-xlviii) ..." -- the sentence running on in
      the source, "as a figure of His foundation of a kingdom where He shall
      dwell among His people". The same article defends these
      chapters against the charge that they are apocryphal: "Some few consider
      chapters xl-xlviii to be apocryphal, because the plan there described in
      the building of the temple was not followed, but they overlook the fact
      that Ezekiel here gives a symbolic representation of the temple, that was
      to find spiritual realization in God's new kingdom." That is a statement
      about what the vision means, not about a later event this corpus holds,
      so no prophetic-referent is authored from it. See the lane report.
    sources:
      - bible:douay-rheims:Ezech.40.1
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  # --- where Ezechiel narrates rather than prophesies -----------------------
  # prophecy-given answers when an ORACLE was uttered. Two passages in this book
  # utter none: they tell what happened to the prophet. They are bound under
  # narrated-event and the rest of the book is not, because the rest of the book
  # is oracle.
  - relation: narrated-event
    event: israel.exile.ezechiel.death-of-the-prophets-wife
    scope:
      - {book: Ezech, chapter: 24, first: 18, last: 20}
    note: >-
      Three verses of narrative inside a chapter of oracle. Ezech. 24:15-17 is
      the word of the Lord and 24:21-27 is the oracle he was told to speak; both
      stand under the chapter's prophecy-given binding. What lies between them
      is told, not foretold: "So I spoke to the people in the morning, and my
      wife died in the evening: and I did in the morning as he had commanded me"
      (24:18), "And the people said to me: Why dost thou not tell us what these
      things mean that thou doest?" (24:19), "And I said to them: The word of
      the Lord came to me, saying:" (24:20). Schets's "Ezekiel" reads the
      passage the same way, as an occasion rather than an oracle: "On the
      occasion of the death of his wife, God forbids him to mourn openly, in
      order to teach the exiles that they should be willing to lose that which
      is dearest to them without grieving over it (xxiv)." The scope stops at
      24:20 and does not take the chapter, and no other chapter of Ezechiel is
      bound under this relation.
    sources:
      - bible:douay-rheims:Ezech.24.18
      - bible:douay-rheims:Ezech.24.19
      - bible:douay-rheims:Ezech.24.20
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  - relation: narrated-event
    event: israel.exile.ezechiel.news-of-the-fall-of-jerusalem
    scope:
      - {book: Ezech, chapter: 33, first: 21, last: 22}
    note: >-
      No oracle is uttered here. A man arrives and speaks, and the passage
      reports it: "there came to me one that was fled from Jerusalem, saying:
      The city is laid waste" (33:21), and "the hand of the Lord had been upon
      me in the evening, before he that was fled came: and he opened my mouth
      till he came to me in the morning, and my mouth being opened, I was silent
      no more" (33:22). The event is the coming of the fugitive, and it is the
      same event whose dateline dates the oracles that follow, which is why it
      is bound twice over these two verses and under two relations: the arrival
      is what these verses narrate, and the day of the arrival is when the
      oracles of xxxiii-xxxix were given. What the fugitive REPORTS is a third
      thing, earlier than either, and is bound below under retrospective-event.
    sources:
      - bible:douay-rheims:Ezech.33.21
      - bible:douay-rheims:Ezech.33.22
  # --- what two of Ezechiel's datelines look back to ------------------------
  - relation: retrospective-event
    event: israel.exile.third-captivity
    scope:
      - {book: Ezech, chapter: 33, first: 21, last: 21}
      - {book: Ezech, chapter: 40, first: 1, last: 1}
    note: >-
      Two verses recall the destruction of Jerusalem and neither narrates it.
      At 33:21 the news arrives in Babylonia: "there came to me one that was
      fled from Jerusalem, saying: The city is laid waste." At 40:1 the same
      event is used as a second measure of the date: "the fourteenth year after
      the city was destroyed". Schets's "Ezekiel" cites exactly these two
      verses when placing the prophet among the deported: "cf. Ezekiel 33:21,
      40:1". The event holds four traditional figures and no preferred one; a
      binding carries none of them.
    sources:
      - bible:douay-rheims:Ezech.33.21
      - bible:douay-rheims:Ezech.40.1
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070
  # === lane genesis ===
  # --- Genesis: the second account and the book of the generations ----------
  - relation: retrospective-event
    event: israel.primeval.creation
    scope:
      - {book: Gen, chapter: 2, first: 4, last: 6}
    note: >-
      Genesis 2:4-6 does not narrate the six days again; it looks back on them -
      "These are the generations of the heaven and the earth, when they were
      created, in the day that the Lord God made the heaven and the earth" - and
      the relation says so rather than dating the verses a second time.
    sources: [bible:douay-rheims:Gen.2.4]
  - relation: retrospective-event
    event: israel.primeval.creation-of-adam
    scope:
      - {book: Gen, chapter: 5, first: 1, last: 2}
    note: >-
      The heading of the genealogy recalls the day itself: "In the day that God
      created man, he made him to the likeness of God. He created them male and
      female."
    sources: [bible:douay-rheims:Gen.5.1]

  # --- Genesis 5: the ten antediluvian patriarchs ---------------------------
  # One binding per notice. Each patriarch's begetting verse and its "lived
  # after" verse go to the birth of the son; the total-and-death verse goes to
  # the death. No scope overlaps another for the same event.
  - relation: narrated-event
    event: israel.primeval.birth-of-enos
    scope:
