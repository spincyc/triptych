      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.exodus-5-pharao-chronology
      - bible:douay-rheims:Ex.7.7
  - relation: narrated-event
    event: israel.exodus.the-exodus
    scope:
      - {book: Ex, chapter: 12, through: 14}
      - {book: Num, chapter: 33, first: 3, last: 5}
    note: >-
      The Exodus proper: the phase and the slaying of the firstborn, the going
      out, and the passage of the sea. Numbers 33:3-5 is the same departure
      entered in the itinerary, with its month and day.
    sources: [bible:douay-rheims:Ex.12.2, bible:douay-rheims:Num.33.3]

  # --- The wilderness -------------------------------------------------------
  - relation: narrated-event
    event: israel.wilderness.manna
    scope:
      - {book: Ex, chapter: 16, first: 1, last: 36}
    note: >-
      Exodus 16:1 dates the coming into the desert of Sin to the fifteenth day
      of the second month after the going out.
    sources:
      - bible:douay-rheims:Ex.16.1
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.exodus-16-manna-chronology
  - relation: narrated-event
    event: israel.wilderness.arrival-at-sinai
    scope:
      - {book: Ex, chapter: 19, first: 1, last: 25}
    note: Exodus 19:1 dates it to the third month of the departure.
    sources: [bible:douay-rheims:Ex.19.1]
  - relation: narrated-event
    event: israel.wilderness.forty-days-on-the-mount
    scope:
      - {book: Ex, chapter: 24, first: 12, last: 18}
      - {book: Ex, chapter: 34, first: 27, last: 28}
    note: >-
      The first forty days at Exodus 24:18 and the second, after the calf, at
      Exodus 34:28.
    sources: [bible:douay-rheims:Ex.24.18]
  - relation: narrated-event
    event: israel.wilderness.golden-calf
    scope:
      - {book: Ex, chapter: 32, first: 1, last: 35}
    sources:
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.exodus-32-golden-calf-chronology
  - relation: narrated-event
    event: israel.wilderness.erection-of-the-tabernacle
    scope:
      - {book: Ex, chapter: 40, first: 14, last: 33}
    note: >-
      Exodus 40:15 in the Douay numbering carries the date — the first month of
      the second year, the first day.
    sources: [bible:douay-rheims:Ex.40.15]
  - relation: narrated-event
    event: israel.wilderness.forty-years-in-the-desert
    scope:
      - {book: Num, chapter: 32, first: 13, last: 13}
    note: >-
      The narrator's own statement that the Lord made them wander forty years.
      The sentence itself, at Numbers 14:33-34, is an oracle spoken at Cades and
      belongs to prophecy-given, not here.
    sources: [bible:douay-rheims:Num.32.13]
  - relation: narrated-event
    event: israel.wilderness.death-of-aaron
    scope:
      - {book: Num, chapter: 20, first: 22, last: 29}
      - {book: Num, chapter: 33, first: 38, last: 39}
    note: >-
      Numbers 33:38-39 dates it: the fortieth year of the coming forth, the
      fifth month, the first day, Aaron a hundred and twenty-three years old.
    sources: [bible:douay-rheims:Num.33.38]
  - relation: narrated-event
    event: israel.wilderness.moses-final-discourse
    scope:
      - {book: Deut, chapter: 1, first: 1, last: 5}
    note: >-
      Deuteronomy 1:3 dates the discourse to the fortieth year, the eleventh
      month, the first day. The discourse's own words are an utterance and are
      not claimed here.
    sources: [bible:douay-rheims:Deut.1.3]
  - relation: narrated-event
    event: israel.wilderness.death-of-moses
    scope:
      - {book: Deut, chapter: 34, first: 1, last: 12}
    sources: [bible:douay-rheims:Deut.34.7]

  # --- The conquest ---------------------------------------------------------
  - relation: narrated-event
    event: israel.conquest.crossing-of-the-jordan
    scope:
      - {book: Jos, chapter: 3, through: 4}
    note: Josue 4:19 dates the coming up out of the Jordan to the tenth day of the first month.
    sources: [bible:douay-rheims:Jos.4.19]
  - relation: narrated-event
    event: israel.conquest.first-pasch-in-the-land
    scope:
      - {book: Jos, chapter: 5, first: 10, last: 12}
    sources: [bible:douay-rheims:Jos.5.10]
  - relation: narrated-event
    event: israel.conquest.calebs-inheritance
    scope:
      - {book: Jos, chapter: 14, first: 6, last: 15}
    note: >-
      Josue 14:10 is Caleb's own reckoning of forty-five years, spoken within
      the scene the passage narrates.
    sources: [bible:douay-rheims:Jos.14.10]

  # --- The judges -----------------------------------------------------------
  - relation: narrated-event
    event: israel.judges.period
    scope:
      - {book: Judg, chapter: 2, first: 11, through: 16}
      - {book: 1Kings, chapter: 7, first: 15, last: 17}
    note: >-
      The cycle stated at Judges 2:11-19 and the judges it introduces, down to
      the death of Samson; and Samuel judging Israel, the last of them. Judges
      17-21 is appended matter without a judge and is left out of the run.
    sources: [bible:douay-rheims:Judg.2.16]
  - relation: narrated-event
    event: israel.judges.heli-judgeship
    scope:
      - {book: 1Kings, chapter: 4, first: 12, last: 18}
    note: >-
      The forty years are stated at 1 Kings 4:18, in the notice of Heli's death,
      which is the only place the tracked text counts them.
    sources: [bible:douay-rheims:1Kings.4.18]
  - relation: narrated-event
    event: israel.judges.ark-at-cariathiarim
    scope:
      - {book: 1Kings, chapter: 7, first: 1, last: 2}
    sources: [bible:douay-rheims:1Kings.7.2]

  # --- Saul -----------------------------------------------------------------
  - relation: narrated-event
    event: israel.monarchy.saul-accession
    scope:
      - {book: 1Kings, chapter: 10, first: 17, last: 27}
      - {book: 1Kings, chapter: 11, first: 14, last: 15}
    note: >-
      The election by lot at Maspha and the renewal of the kingdom at Galgal.
      The anointing in private at 1 Kings 10:1 is not the founding of the
      monarchy and is left out.
    sources: [bible:douay-rheims:1Kings.10.24]
  - relation: narrated-event
    event: israel.monarchy.saul-reign
    scope:
      - {book: 1Kings, chapter: 13, through: 31}
    note: >-
      1 Kings 13:1 is the regnal formula and the tracked Douay text reads "a
      child of one year ... he reigned two years", which no figure in this
      corpus is derived from.
    sources: [bible:douay-rheims:1Kings.13.1]
  - relation: narrated-event
    event: israel.monarchy.david-at-geth
    scope:
      - {book: 1Kings, chapter: 21, first: 10, last: 15}
    note: >-
      The flight to Achis and the feigned madness. The Haydock edition's year
      mark stands at the head of 1 Kings 20, not beside these verses.
    sources:
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.first-kings-21-achis-geth-chronology
  - relation: narrated-event
    event: israel.monarchy.david-in-the-desert-of-maon
    scope:
      - {book: 1Kings, chapter: 23, first: 24, last: 28}
    sources:
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.first-kings-23-maon-chronology
  - relation: narrated-event
    event: israel.monarchy.nabal-in-the-wilderness-of-maon
    scope:
      - {book: 1Kings, chapter: 25, first: 1, last: 42}
    sources:
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.first-kings-25-maon-chronology

  # --- David ----------------------------------------------------------------
  - relation: narrated-event
    event: israel.monarchy.david-accession
    scope:
      - {book: 2Kings, chapter: 2, first: 1, last: 4}
      - {book: 2Kings, chapter: 5, first: 1, last: 5}
    note: >-
      The anointing over Juda at Hebron and the anointing over all Israel seven
      years and six months later. 2 Kings 5:4-5 carries both figures.
    sources: [bible:douay-rheims:2Kings.5.4]
  - relation: narrated-event
    event: israel.monarchy.david-capture-of-sion
    scope:
      - {book: 2Kings, chapter: 5, first: 6, last: 9}
      - {book: 1Par, chapter: 11, first: 4, last: 8}
    note: >-
      The two accounts of one taking of the castle of Sion, kept as two scopes
      on one binding, which is what stops the parallel acquiring two dates.
    sources: [bible:douay-rheims:2Kings.5.7, bible:douay-rheims:1Par.11.5]
  - relation: narrated-event
    event: israel.monarchy.david-reign
    scope:
      - {book: 2Kings, chapter: 5, through: 24}
      - {book: 3Kings, chapter: 2, first: 10, last: 11}
    note: >-
      The reign narrative, closed by the summary at 3 Kings 2:11 — forty years,
      seven in Hebron and thirty-three in Jerusalem.
    sources: [bible:douay-rheims:3Kings.2.11]
  - relation: narrated-event
    event: israel.monarchy.david-repentance
    scope:
      - {book: 2Kings, chapter: 11, through: 12, last: 25}
    note: >-
      The sin, Nathan's parable and rebuke, and the confession at 2 Kings 12:13,
      which is the occasion the title of the Miserere asserts. The psalm's own
      binding is a superscription-setting, not this.
    sources: [bible:douay-rheims:2Kings.12.13]
  - relation: narrated-event
    event: israel.monarchy.absalom-preparations
    scope:
      - {book: 2Kings, chapter: 15, first: 1, last: 6}
    sources:
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.second-kings-15-absalom-conspiracy-chronology
  - relation: narrated-event
    event: israel.monarchy.absalom-revolt
    scope:
      - {book: 2Kings, chapter: 15, first: 7, last: 12}
    note: >-
      2 Kings 15:7 is the "after forty years" whose reckoning the tradition
      disputes; the binding asserts only that these verses narrate the move to
      Hebron.
    sources:
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.second-kings-15-absalom-conspiracy-chronology
  - relation: narrated-event
    event: israel.monarchy.david-flight-from-absalom
    scope:
      - {book: 2Kings, chapter: 15, first: 13, through: 16, last: 14}
    sources: [bible:douay-rheims:2Kings.15.14]
  - relation: narrated-event
    event: israel.monarchy.absalom-defeat
    scope:
      - {book: 2Kings, chapter: 18, first: 1, last: 18}
    sources:
      - passage.george-leo-haydock.douay-rheims-with-haydock-commentary.2014-loreto-feeney-memorial.second-kings-18-absalom-defeat-chronology

  # --- Solomon and the Temple ----------------------------------------------
  - relation: narrated-event
    event: israel.monarchy.solomon-accession
    scope:
      - {book: 3Kings, chapter: 1, first: 32, last: 40}
      - {book: 3Kings, chapter: 2, first: 12, last: 12}
    note: The anointing at Gihon, and the notice that he sat upon the throne of David.
    sources: [bible:douay-rheims:3Kings.2.12]
  - relation: narrated-event
    event: israel.monarchy.solomon-reign
    scope:
      - {book: 3Kings, chapter: 2, first: 12, through: 11}
    note: The reign narrative, closed by the forty years of 3 Kings 11:42.
    sources: [bible:douay-rheims:3Kings.11.42]
  - relation: narrated-event
    event: israel.monarchy.temple-begun
    scope:
      - {book: 3Kings, chapter: 6, first: 1, last: 2}
      - {book: 2Par, chapter: 3, first: 1, last: 2}
    note: >-
      The anchor verse of the whole Old Testament reckoning — the four hundred
      and eightieth year after the coming out of Egypt, the fourth of Solomon —
      and the Paralipomenon parallel, which gives the regnal year without the
      interval.
    sources: [bible:douay-rheims:3Kings.6.1, bible:douay-rheims:2Par.3.2]
  - relation: narrated-event
    event: israel.monarchy.temple-finished
    scope:
      - {book: 3Kings, chapter: 6, first: 37, last: 38}
    note: The eleventh year, the month Bul, seven years in building.
    sources: [bible:douay-rheims:3Kings.6.38]

  # --- The divided kingdom --------------------------------------------------
  - relation: narrated-event
    event: israel.divided-kingdom.division
    scope:
      - {book: 3Kings, chapter: 12, first: 1, last: 20}
      - {book: 2Par, chapter: 10, first: 1, last: 19}
    note: >-
      Both accounts of the assembly at Sichem and the revolt. Neither gives a
      year; the event holds what the sources say about that.
    sources: [bible:douay-rheims:3Kings.12.19, bible:douay-rheims:2Par.10.19]
  - relation: narrated-event
    event: israel.divided-kingdom.sesac-invasion
    scope:
      - {book: 3Kings, chapter: 14, first: 25, last: 28}
      - {book: 2Par, chapter: 12, first: 2, last: 9}
    note: Both accounts date it to the fifth year of Roboam.
    sources: [bible:douay-rheims:3Kings.14.25, bible:douay-rheims:2Par.12.2]
  - relation: narrated-event
    event: israel.divided-kingdom.fall-of-samaria
    scope:
      - {book: 4Kings, chapter: 17, first: 1, last: 6}
      - {book: 4Kings, chapter: 18, first: 9, last: 12}
    note: >-
      The two notices of one fall: 4 Kings 17:5-6 counts it by the years of
      Osee, 4 Kings 18:9-10 synchronises the same siege and taking with the
      fourth and sixth years of Ezechias.
    sources: [bible:douay-rheims:4Kings.17.6, bible:douay-rheims:4Kings.18.10]
  - relation: narrated-event
    event: israel.divided-kingdom.ezechias-accession
    scope:
      - {book: 4Kings, chapter: 18, first: 1, last: 3}
      - {book: 2Par, chapter: 29, first: 1, last: 3}
    note: >-
      The regnal formula in both books — twenty-five years old, twenty-nine
      years' reign.
    sources: [bible:douay-rheims:4Kings.18.2, bible:douay-rheims:2Par.29.1]
  - relation: narrated-event
    event: israel.divided-kingdom.sennacherib-invasion
    scope:
      - {book: 4Kings, chapter: 18, first: 13, through: 19}
      - {book: 2Par, chapter: 32, first: 1, last: 22}
      - {book: Is, chapter: 36, through: 37}
    note: >-
      Three accounts of one invasion. 4 Kings 18:13 and Isaias 36:1 both date it
      to the fourteenth year of Ezechias in the same words, which is the
      warrant for binding them to one event; Isaias 36-37 is narrative within a
      prophetic book, not oracle, so the relation is narrated-event.
    sources:
      - bible:douay-rheims:4Kings.18.13
      - bible:douay-rheims:Is.36.1
      - bible:douay-rheims:2Par.32.1
  - relation: narrated-event
    event: israel.divided-kingdom.josias-reign
    scope:
      - {book: 4Kings, chapter: 22, first: 1, last: 2}
      - {book: 2Par, chapter: 34, first: 1, last: 2}
    note: Eight years old at his accession, thirty-one years' reign, in both books.
    sources: [bible:douay-rheims:4Kings.22.1, bible:douay-rheims:2Par.34.1]
  - relation: narrated-event
    event: israel.divided-kingdom.josias-reform
    scope:
      - {book: 4Kings, chapter: 22, first: 3, through: 23, last: 25}
      - {book: 2Par, chapter: 34, first: 3, through: 35, last: 19}
    note: >-
      The repair of the Temple, the finding of the book, and the Pasch. Both
      accounts date the finding and the Pasch to the eighteenth year, and
      2 Paralipomenon 34:3 adds the eighth and twelfth years for the earlier
      stages of the reform.
    sources: [bible:douay-rheims:4Kings.23.23, bible:douay-rheims:2Par.35.19]

  # --- The exile ------------------------------------------------------------
  - relation: narrated-event
    event: israel.exile.joakim-accession
    scope:
      - {book: 4Kings, chapter: 23, first: 34, last: 37}
      - {book: 2Par, chapter: 36, first: 4, last: 5}
    sources: [bible:douay-rheims:4Kings.23.36, bible:douay-rheims:2Par.36.5]
  - relation: narrated-event
    event: israel.exile.carchemish
    scope:
      - {book: 4Kings, chapter: 24, first: 1, last: 2}
    note: >-
      The verse narrates the second half of this event only — the beginning of
      Juda's Babylonian vassalage, three years' service and then revolt. The
      battle itself is named at Jeremias 46:2, in the heading of an oracle
      against Egypt, which is prophecy-given and not authored here.
    sources: [bible:douay-rheims:4Kings.24.1]
  - relation: narrated-event
    event: israel.exile.first-captivity
    scope:
      - {book: Dan, chapter: 1, first: 1, last: 7}
      - {book: 2Par, chapter: 36, first: 6, last: 7}
    note: >-
      Daniel 1:1 dates the siege to the third year of Joakim; 2 Paralipomenon
      36:6-7 reports the same binding of Joakim and carrying away of the
      vessels without a year.
    sources: [bible:douay-rheims:Dan.1.1, bible:douay-rheims:2Par.36.6]
  - relation: narrated-event
    event: israel.exile.second-captivity
    scope:
      - {book: 4Kings, chapter: 24, first: 8, last: 16}
      - {book: 2Par, chapter: 36, first: 9, last: 10}
    note: >-
      The surrender of Joachin and the ten thousand carried away. 4 Kings 24:8
      and 2 Paralipomenon 36:9 disagree about his age in the tracked Douay text,
      and the disagreement is kept on the event, not resolved here.
    sources: [bible:douay-rheims:4Kings.24.12, bible:douay-rheims:2Par.36.9]
  - relation: narrated-event
    event: israel.exile.sedecias-reign
    scope:
      - {book: 4Kings, chapter: 24, first: 17, last: 20}
      - {book: 2Par, chapter: 36, first: 11, last: 13}
      - {book: Jer, chapter: 52, first: 1, last: 3}
    note: >-
      Three regnal notices of one reign — twenty-one years old, eleven years'
      reign.
    sources: [bible:douay-rheims:4Kings.24.18, bible:douay-rheims:Jer.52.1]
  - relation: narrated-event
    event: israel.exile.final-siege
    scope:
      - {book: 4Kings, chapter: 25, first: 1, last: 3}
      - {book: Jer, chapter: 52, first: 4, last: 6}
      - {book: Jer, chapter: 39, first: 1, last: 2}
    note: >-
      The ninth year, the tenth month, the tenth day, in three places in the
      same words. One event, three scopes.
    sources: [bible:douay-rheims:4Kings.25.1, bible:douay-rheims:Jer.52.4]
  - relation: narrated-event
    event: israel.exile.third-captivity
    scope:
      - {book: 4Kings, chapter: 25, first: 4, last: 21}
      - {book: Jer, chapter: 52, first: 7, last: 27}
      - {book: 2Par, chapter: 36, first: 17, last: 20}
    sources: [bible:douay-rheims:4Kings.25.21, bible:douay-rheims:Jer.52.27]
  - relation: narrated-event
    event: israel.exile.burning-of-the-temple
    scope:
      - {book: 4Kings, chapter: 25, first: 8, last: 10}
      - {book: Jer, chapter: 52, first: 12, last: 14}
      - {book: 2Par, chapter: 36, first: 19, last: 19}
    note: >-
      4 Kings 25:8 puts it on the seventh day of the fifth month and Jeremias
      52:12 on the tenth, both in the nineteenth year of Nabuchodonosor. The
      day is a disagreement between two scriptural witnesses to one event, and
      it is kept, not harmonised.
    sources: [bible:douay-rheims:4Kings.25.8, bible:douay-rheims:Jer.52.12]
  - relation: narrated-event
    event: israel.exile.deportations-of-nabuchodonosor
    scope:
      - {book: Jer, chapter: 52, first: 28, last: 30}
    note: The seventh, eighteenth and twenty-third years, with their totals; the only such list in the canon.
    sources: [bible:douay-rheims:Jer.52.28]
  - relation: narrated-event
    event: israel.exile.seventy-years
    scope:
      - {book: 2Par, chapter: 36, first: 20, last: 21}
    note: >-
      The narrated fulfilment. The oracle that states the seventy years, at
      Jeremias 25:11-12, is prophecy-given and is not authored here.
    sources: [bible:douay-rheims:2Par.36.21]

  # --- The restoration ------------------------------------------------------
  - relation: narrated-event
    event: israel.restoration.decree-of-cyrus
    scope:
      - {book: 1Esd, chapter: 1, first: 1, last: 4}
      - {book: 2Par, chapter: 36, first: 22, last: 23}
    note: >-
      The same decree at the end of Paralipomenon and the opening of Esdras,
      dated in both to the first year of Cyrus and to nothing else.
    sources: [bible:douay-rheims:1Esd.1.1, bible:douay-rheims:2Par.36.22]
  - relation: narrated-event
    event: israel.restoration.temple-raised-by-zorobabel
    scope:
      - {book: 1Esd, chapter: 3, first: 8, last: 13}
    note: The second year of the coming to Jerusalem, the second month; the laying of the foundations.
    sources: [bible:douay-rheims:1Esd.3.8]
  - relation: narrated-event
    event: israel.restoration.temple-work-resumed
    scope:
      - {book: 1Esd, chapter: 4, first: 24, last: 24}
      - {book: 1Esd, chapter: 5, first: 1, last: 2}
    note: >-
      1 Esdras 4:24 dates the interruption's end to the second year of Darius,
      and 5:1-2 narrates the resuming under Aggeus and Zacharias.
    sources: [bible:douay-rheims:1Esd.4.24]
  - relation: narrated-event
    event: israel.restoration.second-temple-completed
    scope:
      - {book: 1Esd, chapter: 6, first: 14, last: 18}
    note: >-
      The third day of Adar in the sixth year of Darius. Which Darius is meant
      is disputed among the Catholic sources, and that dispute lives on the
      event.
    sources: [bible:douay-rheims:1Esd.6.15]
  - relation: narrated-event
    event: israel.restoration.esdras-return
    scope:
      - {book: 1Esd, chapter: 7, first: 6, last: 10}
    note: The seventh year of Artaxerxes, first month to fifth month.
    sources: [bible:douay-rheims:1Esd.7.7]
  - relation: narrated-event
    event: israel.restoration.nehemias-mission
    scope:
      - {book: 2Esd, chapter: 2, first: 1, last: 8}
      - {book: 2Esd, chapter: 6, first: 15, last: 16}
    note: >-
      The commission in Nisan of the twentieth year of Artaxerxes, and the
      finishing of the wall in fifty-two days on the twenty-fifth of Elul.
    sources: [bible:douay-rheims:2Esd.2.1, bible:douay-rheims:2Esd.6.15]
  - relation: narrated-event
    event: israel.restoration.nehemias-second-mission
    scope:
      - {book: 2Esd, chapter: 13, first: 6, last: 7}
    note: The two and thirtieth year of Artaxerxes, and the return to Jerusalem after it.
    sources: [bible:douay-rheims:2Esd.13.6]

