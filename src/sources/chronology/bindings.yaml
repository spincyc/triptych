    note: >-
      Israel at Horeb, recalled in Moab: "The Lord our God spoke to us in
      Horeb" (1:6), "From the day in which thou didst stand before the Lord thy
      God in Horeb" (4:10), "The Lord our God made a covenant with us in Horeb"
      (5:2), "beside that covenant which he made with them in Horeb" (29:1),
      "The Lord came from Sinai" (33:2). Deuteronomy 5:6-21 repeats the words
      spoken there and is deliberately NOT authored as an utterance of this
      event: the event is dated at the arrival, and its own note says the verse
      that dates it "dates the arrival at Sinai, not the promulgation of the
      Law that follows at Exodus 20". The promulgation is a separate event in
      this corpus, dated from Exodus 19:11 and 19:16 to the third day, and the
      words the Decalogue recites belong to it; so Deuteronomy 5:6-21 is bound
      as a retrospective-event of the promulgation in the binding that follows
      this one, and is left out of the scope here for that reason and not
      because nothing reaches it. What Deuteronomy 5 does in the fortieth year
      is recite, and both bindings say so.
