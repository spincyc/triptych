    scope:
      - {book: Judg, chapter: 6, first: 7, through: 8, last: 32}
    note: >-
      The calling of Gedeon, the rout of Madian, and the forty years' rest
      "while Gedeon presided" at Judges 8:28, down to his death at 8:32. The
      run stops there and does not carry the chapter's last three verses:
      Judges 8:33 opens "But after Gedeon was dead, the children of Israel
      turned again, and committed fornication with Baalim", which is the
      apostasy that follows the judgeship and introduces Abimelech, not part of
      the forty years' rest this event dates.
    sources: [bible:douay-rheims:Judg.8.28, bible:douay-rheims:Judg.8.33]
  - relation: narrated-event
    event: israel.judges.abimelech-reign
    scope:
      - {book: Judg, chapter: 9, first: 1, last: 57}
    sources: [bible:douay-rheims:Judg.9.22]
  - relation: narrated-event
    event: israel.judges.thola-judgeship
    scope:
      - {book: Judg, chapter: 10, first: 1, last: 2}
    sources: [bible:douay-rheims:Judg.10.2]
  - relation: narrated-event
    event: israel.judges.jair-judgeship
    scope:
      - {book: Judg, chapter: 10, first: 3, last: 5}
    sources: [bible:douay-rheims:Judg.10.3]
  - relation: narrated-event
    event: israel.judges.oppression-by-ammon
    scope:
      - {book: Judg, chapter: 10, first: 6, last: 18}
    sources: [bible:douay-rheims:Judg.10.8]
  - relation: narrated-event
    event: israel.judges.jephte-judgeship
    scope:
      - {book: Judg, chapter: 11, through: 12, last: 7}
    note: >-
      The six years are stated only at Judges 12:7, in the notice of Jephte's
      death, and cover the whole of his rule as the book tells it. The three
      hundred years he argues at Judges 11:26 are a different figure and are
      held on a different event.
    sources: [bible:douay-rheims:Judg.12.7]
  - relation: narrated-event
    event: israel.judges.abesan-judgeship
    scope:
      - {book: Judg, chapter: 12, first: 8, last: 10}
    sources: [bible:douay-rheims:Judg.12.9]
  - relation: narrated-event
    event: israel.judges.ahialon-judgeship
    scope:
      - {book: Judg, chapter: 12, first: 11, last: 12}
    sources: [bible:douay-rheims:Judg.12.11]
  - relation: narrated-event
    event: israel.judges.abdon-judgeship
    scope:
      - {book: Judg, chapter: 12, first: 13, last: 15}
    sources: [bible:douay-rheims:Judg.12.14]
  - relation: narrated-event
    event: israel.judges.servitude-under-the-philistines
    scope:
      - {book: Judg, chapter: 13, first: 1, last: 1}
