          year of Nero ... the twenty-seventh year after our Lord's passion",
          with no A.D. year; that reckoning is not converted here.
        date:
          precision: year
          from: {year: 67, era: ad}
          label: "(2 Timothy), martyrdom, 67"

  - id: composition.epistle-to-the-hebrews
    title: The Epistle to the Hebrews
    scope: {book: Heb}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Fonck's article "Epistle to the Hebrews" in the Catholic Encyclopedia
          (vol. 7, 1910): "The most probable date for its composition is,
          therefore, the second half of the year 63 or the beginning of 64, as
          Paul after his release from imprisonment probably soon undertook the
          missionary journey 'as far as the boundaries of Western Europe'."
        sources: [artifact.catholic-encyclopedia.volume-7.new-york-1910.newadvent-07181a-f2f73f92]
        note: >-
          The article reaches the figure between bounds it asserts rather than
          finds attested: after the death of James, Bishop of Jerusalem (62),
          before the outbreak of the Jewish War (67) and the destruction of
          Jerusalem (70). It gives the place as Italy, "more precisely Rome".
          Authorship is separately disputed in the sources: Jerome reports that
          the Epistle "is not considered his", being reckoned "either according
          to Tertullian to be the work of Barnabas, or according to others, to
          be by Luke the Evangelist or Clement".
        date:
          precision: interval
          from: {year: 63, era: ad}
          to: {year: 64, era: ad}
          label: "the second half of the year 63 or the beginning of 64"

  - id: composition.epistle-of-st-james
    title: The Epistle of St James
    scope: {book: James}
    note: >-
      Two articles of the Catholic Encyclopedia take opposite views of when
      this Epistle was written, and the second says in terms that the grounds
      for the first "are not entirely convincing", so neither is preferred.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Camerlynck's article "Epistle of St. James" in the Catholic
          Encyclopedia (vol. 8, 1910): "The Epistle was probably written about
          A.D. 47. The reference to the persecutions (ii, 6) is in the present
          tense, and indicates a stage of suffering which has not yet receded
          into the past of history."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08275b-53821a60]
        note: >-
          The article's upper bound is the Council of Jerusalem, which it dates
          to A.D. 51: "the author could not have written after the Council of
          Jerusalem (A.D. 51), where James acted as president, without some
          allusion to his decision."
        date:
          precision: approximate-year
          from: {year: 47, era: ad}
          label: "probably written about A.D. 47"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Merk's article "Epistle to the Romans" in the Catholic Encyclopedia
          (vol. 13, 1912) rejects the early dating and proposes a later one:
          "the grounds for the assigning of this date to the Epistle are not
          entirely convincing, since the Epistle fits in better with the
          conditions of the succeeding decades. ... If the Epistle of St. James
          were composed shortly after the year 60, it might ... have been
          influenced by the misunderstood views of the teachings of St. Paul."
        sources: [artifact.catholic-encyclopedia.volume-13.new-york-1912.newadvent-13156a-dd2f7a55]
        note: >-
          The article puts the figure conditionally, in the course of arguing
          that James may answer misunderstandings of St Paul; it is recorded
          here as the rival Catholic dating the encyclopedia carries, not as a
          flat assertion. The same passage dismisses the second-century dating
          of Baur, Hilgenfeld, Holtzmann, von Soden and Julicher as "scarcely
          intelligible", and those figures are no part of this profile.
        date:
          precision: approximate-year
          from: {year: 60, era: ad}
          label: "shortly after the year 60"

  - id: composition.first-epistle-of-st-peter
    title: The First Epistle of St Peter
    scope: {book: 1Pet}
