        date:
          precision: interval
          from: {year: 63, era: ad}
          to: {year: 64, era: ad}
          label: "about the end of the year 63 or the beginning of 64"

  - id: composition.second-epistle-of-st-peter
    title: The Second Epistle of St Peter
    scope: {book: 2Pet}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Vander Heeren's article "Epistles of Saint Peter" in the Catholic
          Encyclopedia (vol. 11, 1911): "the advocates of its authenticity
          maintain that it was written after 63-4, the date of the First
          Epistle, and before 64-5, the date believed to be that of the death
          of St. Peter (i, 14). Like the First, it was written at Rome."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11752a-2d7ff54c]
        note: >-
          The window is wholly derived from two dates the same article leaves
          unsettled, that of the First Epistle and that of Peter's death; the
          endpoints recorded here are the outer years the article names. The
          "about 150" it also reports is expressly the position of those who
          reject the Epistle's authenticity. Jerome, De viris illustribus 1,
          records the ancient doubt that the Second Epistle "on account of its
          difference from the first in style, is considered by many not to be
          by him".
        date:
          precision: interval
          from: {year: 63, era: ad}
          to: {year: 65, era: ad}
          label: "after 63-4, the date of the First Epistle, and before 64-5"

  - id: composition.epistle-of-st-jude
    title: The Epistle of St Jude
    scope: {book: Jude}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Camerlynck's article "Epistle of Saint Jude" in the Catholic
          Encyclopedia (vol. 8, 1910): "we have shown that the Epistle of St.
          Jude was written before II Peter, which latter was probably written
          A.D. 64 (65). Therefore St. Jude must have written shortly before 64
          (65)."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08542b-4e4b3466]
        note: >-
          The article opens by saying "It is difficult to state the exact time
          at which St. Jude wrote his Epistle", and the figure is entirely
          derivative: it depends on Jude's priority to the Second Epistle of St
          Peter and on that Epistle's own unsettled date. The article also
          records a contrary internal signal, that "the doctrines against which
          he inveighs ... seem to indicate the end of the Apostolic age", and
          its own upper bound, that "Jude seems to have written before A.D. 70;
          otherwise in vv. 5-7 he would have spoken of the destruction of
          Jerusalem".
        date:
          precision: approximate-year
          from: {year: 64, era: ad}
          label: "shortly before 64 (65)"

