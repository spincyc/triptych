      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Camerlynck's article "Epistle of St. James" in the Catholic
          Encyclopedia (vol. 8, 1910): "The Epistle was probably written about
          A.D. 47. The reference to the persecutions (ii, 6) is in the present
