# Composition chronology, by textual unit. A unit's scope reaches every verse
# inside it, so a book-level claim needs no row per verse; the narrowest unit
# covering a verse wins, and two units of equal width over one verse is a load
# error rather than a tie this corpus breaks.
schema: triptych-chronology-composition/v1
# Every locus below is numbered in the vulgate system, the one
# scripts/_projection.py projects into. Declared here so that no row's
# numbering is a thing the reader assumed.
numbering: vulgate
updated: '2026-08-26'

units:
  # --- nt-composition ----------------------------------------------------
  - id: composition.gospel-of-matthew
    title: The Gospel of St Matthew
    scope: {book: Matt}
    note: >-
      The Catholic Encyclopedia's article on the First Gospel opens its section
      on the date by saying that "Ancient ecclesiastical writers are at variance
      as to the date of the composition of the First Gospel" and closes its
      survey of modern opinion with "In our day opinion is rather divided". It
      settles nothing, so every claim below is disputed and none is preferred.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: reported-traditional
        basis: >-
          Jacquier's article "Gospel of St. Matthew" in the Catholic
          Encyclopedia (vol. 10, 1911) reports that "Eusebius (in his
          Chronicle), Theophylact, and Euthymius Zigabenus are of opinion that
          the Gospel of Matthew was written eight years, and Nicephorus
          Callistus fifteen years, after Christ's Ascension --i.e. about A.D.
          38-45." The article prefaces the whole survey with the statement that
          the ancient writers "are at variance" and reaches no conclusion.
        sources:
          - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10057a-e7b6ccef
          - artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c
        note: >-
          "About A.D. 38-45" is the encyclopedia's own conversion of the
          ancients' reckoning in years after the Ascension; the eight-year and
          fifteen-year figures are what the sources themselves state. The caution
          that "we must not expect from the ancients the precision of our modern
          chronology" is Durand's, in "The New Testament" (Catholic Encyclopedia,
          vol. 14, New York, 1912), and not this article's; it is cited here as
          his.
        date:
          precision: interval
          from: {year: 38, era: ad}
          to: {year: 45, era: ad}
          label: "about A.D. 38-45"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The same article draws a second date from the tradition of the
          dispersal of the Apostles: "following a certain tradition (admittedly
          not too reliable), the Apostles separated twelve years after the
          Ascension, hence the Gospel would have been written about the year
          40-42". Eusebius is its authority for the peg, since "According to
          Eusebius, Matthew wrote his Gospel in Hebrew when he left Palestine."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10057a-e7b6ccef]
        note: >-
          The article itself calls the twelve-year tradition "admittedly not
          too reliable" and immediately offers the alternative reckoning that
          produces about the year 60-68 from the same peg.
        date:
          precision: interval
          from: {year: 40, era: ad}
          to: {year: 42, era: ad}
          label: "about the year 40-42"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The same article's alternative reading of the same peg: "following
          Eusebius (Church History III.5.2), it is possible to fix the
          definitive departure of the Apostles about the year 60, in which
          event the writing of the Gospel would have taken place about the year
          60-68." The article presents this beside the 40-42 reckoning without
          choosing between them.
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10057a-e7b6ccef]
        date:
          precision: interval
          from: {year: 60, era: ad}
          to: {year: 68, era: ad}
          label: "about the year 60-68"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: reported-traditional
        basis: >-
          The same article quotes St Irenaeus, "somewhat more exact concerning
          the date of the First Gospel": "Matthew produced his Gospel when
          Peter and Paul were evangelizing and founding the Church of Rome,
          consequently about the years 64-67."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10057a-e7b6ccef]
        note: >-
          The article at once qualifies the testimony: "However, this text
          presents difficulties of interpretation which render its meaning
          uncertain and prevent us from deducing any positive conclusion."
        date:
          precision: interval
          from: {year: 64, era: ad}
          to: {year: 67, era: ad}
          label: "about the years 64-67"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: reported-traditional
        basis: >-
          For modern opinion the same article states: "In our day opinion is
          rather divided. Catholic critics, in general, favour the years
          40-45". This is the position it attributes to Catholic critics as a
          body, as against the individual figures it goes on to list.
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10057a-e7b6ccef]
        note: >-
          The same sentence records individual Catholic departures from 40-45 —
          Patrizi 36-39, Aberle 37, Belser 41-42, Conely 40-50, Schafer 50-51,
          and Hug, Reuschl, Schanz and Rose 60-67 — which are not authored
          separately here. The article also fixes its own upper bound: "Matthew
          must have written his Gospel before the year 70". The long list of
          Protestant and rationalist figures in the same paragraph (Renan later
          than 85, Baur about 130-34, and the rest) is reported there in order
          to be refuted and is no part of this profile.
        date:
          precision: interval
          from: {year: 40, era: ad}
          to: {year: 45, era: ad}
          label: "the years 40-45"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Durand's article "The New Testament" in the Catholic Encyclopedia
          (vol. 14, 1912) dates the lost Aramaic Matthew instead: "The original
          text of St. Matthew is certainly prior to the ruin of Jerusalem,
          there are even reasons for dating it earlier than the Epistles of St.
          Paul and consequently about the year 50."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c]
        note: >-
          This dates the Aramaic original, not the canonical Greek text: the
          next sentence says "We know nothing definite of the date of its being
          rendered into Greek." A consumer that reads it as the date of the
          Greek Matthew is reading it wrongly.
        date:
          precision: approximate-year
          from: {year: 50, era: ad}
          label: "about the year 50"

  - id: composition.gospel-of-mark
    title: The Gospel of St Mark
    scope: {book: Mark}
    note: >-
      MacRory's article on the Second Gospel opens its section on the date with
      "The date of the Gospel is uncertain. The external evidence is not
      decisive, and the internal does not assist very much." Nothing in the
      inspected sources settles the question, so every claim below is disputed.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: reported-traditional
        basis: >-
          MacRory's article "Gospel of Saint Mark" in the Catholic Encyclopedia
          (vol. 9, 1910) reports that "The subscription of many of the later
          unical and cursive manuscripts states that it was written in the
          tenth or twelfth year after the Ascension (A.D. 38-40)."
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09674b-f5a5a8a9]
        note: >-
          The article does not endorse this figure; it suspects it: "Possibly
          these early dates may be only a deduction from the tradition that
          Peter came to Rome in the second year of Claudius, A.D. 42."
        date:
          precision: interval
          from: {year: 38, era: ad}
          to: {year: 40, era: ad}
          label: "the tenth or twelfth year after the Ascension (A.D. 38-40)"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The same article: 'The "Paschal Chronicle" assigns it to A.D. 40.'
          The figure is reported as the Chronicle's, among the early dates the
          article lists and then treats with reserve.
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09674b-f5a5a8a9]
        date:
          precision: year
          from: {year: 40, era: ad}
          label: "A.D. 40"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The same article: 'the "Chronicle" of Eusebius [assigns it] to the
          third year of Claudius (A.D. 43).' The parenthetical A.D. year is the
          encyclopedia's gloss on Eusebius's regnal reckoning.
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09674b-f5a5a8a9]
        date:
          precision: year
          from: {year: 43, era: ad}
          label: "the third year of Claudius (A.D. 43)"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The same article's own conclusion: "Taking the external and internal
          evidence together, we may conclude that the date of the Gospel
          probably lies somewhere between A.D. 50 and 67." The upper bound is
          Peter's death, which the article leaves at "A.D. 64 or 67".
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09674b-f5a5a8a9]
        note: >-
          The lower bound rests on the article's premise that Mark xvi, 20 is
          from Mark's own pen. The article also sets aside St Irenaeus, who
          "seems to place the composition of the Gospel after the death of
          Peter and Paul", judging that "it seems much more reasonable to
          believe that Irenaeus was mistaken than that all the other
          authorities are in error".
        date:
          precision: interval
          from: {year: 50, era: ad}
          to: {year: 67, era: ad}
          label: "somewhere between A.D. 50 and 67"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Durand's article "The New Testament" in the Catholic Encyclopedia
          (vol. 14, 1912) gives a different window in the same encyclopedia:
          "Everything seems to indicate the date of the composition of St. Mark
          as about the time of St. Peter's death, consequently between 60 and
          70."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c]
        note: >-
          A different contributor from the Mark article, writing two years
          later; neither supersedes the other and the encyclopedia does not
          reconcile them.
        date:
          precision: interval
          from: {year: 60, era: ad}
          to: {year: 70, era: ad}
          label: "between 60 and 70"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The decisions of the Pontifical Biblical Commission of 26 June 1913,
          printed in the appendix to Aherne's "Gospel of Saint Luke" (Catholic
          Encyclopedia vol. 9, 1910), rule that "after Matthew, Mark wrote his
          Gospel second and Luke third" and that "It is not lawful to put the
          date of the Gospels of Mark and Luke as late as the destruction of
          Jerusalem or after the siege had begun." The ruling gives an order
          and an upper bound and no year.
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09420a-9b79d2a9]
        note: >-
          A binding ruling reported verbatim, not one contributor's survey, and
          of a different order of authority from the dated opinions above; it
          nevertheless fixes no year, and it is recorded here as the relative
          statement it is. The same decision allows "that the second and third
          Gospels were composed before the Greek version of the first Gospel".
        date:
          precision: relative
          relative:
            of: composition.gospel-of-matthew
            statement: >-
              second, after Matthew, and not as late as the destruction of
              Jerusalem or after the siege had begun
          label: "after Matthew, and not as late as the destruction of Jerusalem"

  - id: composition.gospel-of-luke
    title: The Gospel of St Luke
    scope: {book: Luke}
    note: >-
      The Catholic Encyclopedia's own Luke article carries no date-of-
      composition section; its dating material is the appended Biblical
      Commission decisions, which give bounds and an order but no year. The
      only year in the inspected sources comes from a different article and is
      in tension with those bounds, so both claims are disputed.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Durand's article "The New Testament" in the Catholic Encyclopedia
          (vol. 14, 1912) asks "What then was the date of his own work?" and
          answers "About the year 70", adding at once that "we must not expect
          from the ancients the precision of our modern chronology."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c]
        note: >-
          This sits against the 1913 Biblical Commission ruling recorded in the
          next claim, which forbids dating Luke as late as the destruction of
          Jerusalem.
        date:
          precision: approximate-year
          from: {year: 70, era: ad}
          label: "About the year 70"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The decisions of the Pontifical Biblical Commission of 26 June 1913,
          printed in the appendix to Aherne's "Gospel of Saint Luke" (Catholic
          Encyclopedia vol. 9, 1910): "It is not lawful to put the date of the
          Gospels of Mark and Luke as late as the destruction of Jerusalem or
          after the siege had begun. The Gospel of Luke preceded his Acts of
          the Apostles, and was therefore composed before the end of the Roman
          imprisonment, when the Acts was finished (Acts 28:30-31)."
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09420a-9b79d2a9]
        note: >-
          A binding ruling reported verbatim rather than a contributor's
          opinion, and of a different order of authority from the survey dates;
          it states bounds and an order and prints no year, so it is recorded
          as a relative claim anchored to the composition of Acts.
        date:
          precision: relative
          relative:
            of: composition.acts-of-the-apostles
            statement: >-
              before the Acts of the Apostles, and therefore before the end of
              the Roman imprisonment, and not as late as the destruction of
              Jerusalem
          label: "before the end of the Roman imprisonment, when the Acts was finished"

  - id: composition.gospel-of-john
    title: The Gospel of St John
    scope: {book: John}
    note: >-
      Fonck's article states at the outset that "As to the date of its
      composition we possess no certain historical information", and the two
      Catholic Encyclopedia articles that give figures give differently shaped
      ones, so neither is preferred here.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Fonck's article "Gospel of St. John" in the Catholic Encyclopedia
          (vol. 8, 1910): "According to the general opinion, the Gospel is to
          be referred to the last decade of the first century, or to be still
          more precise, to 96 or one of the succeeding years." The PRECEDING
          sentence admits that "As to the date of its composition we possess no
          certain historical information".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08438a-7620a92c]
        note: >-
          The same article reaches the same figure by a second route, from the
          Monarchian Prologue's statement that John wrote the Gospel "after he
          had composed the Apocalypse on the Island of Patmos", which "would
          therefore refer the composition of the Gospel to A.D. 96 or one of
          the years immediately following" — an argument that puts the Gospel
          later than the Apocalypse. Recorded as an interval and not as an
          approximate year: the source prints no "about", and both bounds are
          its own — "the last decade of the first century" caps it and "96 or
          one of the succeeding years" opens it. The approximate-year encoding
          this claim carried until now was rendered to consumers as "about 96
          A.D.", a hedge the source does not print, and it both admitted years
          the source excludes (94-95) and excluded years it allows (97-100).
        date:
          precision: interval
          from: {year: 96, era: ad}
          to: {year: 100, era: ad}
          label: "96 or one of the succeeding years"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Durand's article "The New Testament" in the Catholic Encyclopedia
          (vol. 14, 1912) dates the Johannine corpus as a body: "The Johannine
          writings belong to the end of the first century, from the year 90 to
          100 (approximately)."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c]
        note: >-
          The window is asserted of the Johannine writings collectively — the
          Gospel, the three Epistles and, with a noted exception, the
          Apocalypse — not of the Fourth Gospel by itself.
        date:
          precision: interval
          from: {year: 90, era: ad}
          to: {year: 100, era: ad}
          label: "from the year 90 to 100 (approximately)"

  - id: composition.acts-of-the-apostles
    title: The Acts of the Apostles
    scope: {book: Acts}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Breen's article "Acts of the Apostles" in the Catholic Encyclopedia
          (vol. 1, 1907): "Writers are quite concordant in placing the date of
          Paul's coming to Rome in the year 62; hence the year 64 is the most
          probable date for the Acts." The article says of itself that "we may
          at most assign a probable date for the completion of the book".
        sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01117a-582c8526]
        note: >-
          The figure is the article's own inference from Paul's arrival at Rome
          in 62 plus the two years of Acts xxviii, 30, not an independently
          attested date; the same encyclopedia's St. Paul article instead puts
          the departure for Rome in 59 and the Roman captivity at 60-62, which
          would move it. Jerome (De viris illustribus 7) ties the book's
          composition to Rome and to the terminus of its narrative in "the
          fourth year of Nero", giving no A.D. year; that regnal reckoning is
          not converted here.
        date:
          precision: approximate-year
          from: {year: 64, era: ad}
          label: "the year 64 is the most probable date"

  - id: composition.epistle-to-the-romans
    title: The Epistle to the Romans
    scope: {book: Rom}
    note: >-
      The Catholic Encyclopedia's own Romans article says "The time of
      composition is thus exactly determined" and then prints no year at all;
      it places the writing "at the end of the third missionary journey", at
      Corinth, "shortly before Paul's departure for Macedonia". The two years
      below come from two other articles of the same encyclopedia and disagree
      with each other.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Prat's article "St. Paul" in the Catholic Encyclopedia (vol. 11,
          1911) sets out a chronology of the Apostle's life in which the
          Epistles are placed by year: "third mission, 53-57; (1 and 2
          Corinthians; Galatians), 56; (Romans), 57".
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        note: >-
          Offered as a reconstruction in which "all certain or probable data
          seem to be satisfactorily taken into account", not as an attested
          date.
        date:
          precision: year
          from: {year: 57, era: ad}
          label: "(Romans), 57"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Ladeuze's article "Epistle to the Ephesians" in the Catholic
          Encyclopedia (vol. 5, 1909) dates Romans in passing while arguing
          about the captivity letters: their doctrine "belongs to an epoch
          subsequent to the composition of the Epistle to the Romans (58)".
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05485a-66d722ae]
        note: >-
          An incidental figure inside another article's argument, and one year
          later than the St. Paul article's; the encyclopedia never reconciles
          the two.
        date:
          precision: year
          from: {year: 58, era: ad}
          label: "the Epistle to the Romans (58)"

  - id: composition.first-epistle-to-the-corinthians
    title: The First Epistle to the Corinthians
    scope: {book: 1Cor}
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Aherne's article "Epistles to the Corinthians" in the Catholic
          Encyclopedia (vol. 4, 1908): "St. Paul at once wrote the First
          Epistle to the Corinthians and sent it by Titus about Easter A.D.
          57." The same article places the writing "towards the end" of Paul's
          nearly three years at Ephesus.
        sources: [artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04364a-2b6b401d]
        note: >-
          The year is stated flatly; the hedge "about" governs the point within
          the year, which the article does not fix beyond Easter.
        date:
          precision: year
          from: {year: 57, era: ad}
          label: "about Easter A.D. 57"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Prat's article "St. Paul" in the same encyclopedia (vol. 11, 1911)
          assigns a different year in its reconstructed chronology: "(1 and 2
          Corinthians; Galatians), 56".
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        date:
          precision: year
          from: {year: 56, era: ad}
          label: "(1 and 2 Corinthians; Galatians), 56"

  - id: composition.second-epistle-to-the-corinthians
    title: The Second Epistle to the Corinthians
    scope: {book: 2Cor}
    note: >-
      The Catholic Encyclopedia's Corinthians article prints no A.D. year for
      the Second Epistle at all; it gives only an interval from the First. The
      St. Paul article's single year for both letters cannot be squared with
      the Corinthians article's own "about Easter A.D. 57" for the First plus
      "a few months", so neither claim is preferred.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Aherne's article "Epistles to the Corinthians" in the Catholic
          Encyclopedia (vol. 4, 1908): "The Second Epistle was written a few
          months after the First, in which St. Paul had stated that he intended
          to go round by Macedonia." He "purposely delayed in Macedonia, and
          sent them this Epistle".
        sources: [artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04364a-2b6b401d]
        note: >-
          Recorded as a relative claim because the article states an interval
          from the First Epistle and no absolute year; the year that follows
          depends on which date for the First Epistle is taken.
        date:
          precision: relative
          relative:
            of: composition.first-epistle-to-the-corinthians
            statement: a few months after the First, from Macedonia
          label: "a few months after the First"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Prat's article "St. Paul" in the same encyclopedia (vol. 11, 1911)
          assigns both Corinthian letters to one year in its reconstructed
          chronology: "(1 and 2 Corinthians; Galatians), 56".
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        date:
          precision: year
          from: {year: 56, era: ad}
          label: "(1 and 2 Corinthians; Galatians), 56"

  - id: composition.epistle-to-the-galatians
    title: The Epistle to the Galatians
    scope: {book: Gal}
    note: >-
      Aherne's article sets out three datings, each resting on a different
      answer to the North- versus South-Galatian question, which the same
      article treats at length and does not close. It ranks them without
      deciding, so all four claims here are disputed.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          Aherne's article "Epistle to the Galatians" in the Catholic
          Encyclopedia (vol. 6, 1909), first opinion: "Prof. Sir W. Ramsay ...
          and a Catholic professor, Dr. Valentin Weber ... maintain that it was
          written from Antioch, before the council (A.D. 49-50)", Marcion
          having asserted that it was the first of St Paul's Epistles.
        sources: [artifact.catholic-encyclopedia.volume-6.new-york-1909.newadvent-06336a-508d2398]
        note: >-
          Of this earliest dating the article says: "Weber's arguments are very
          plausible, but not quite convincing."
        date:
          precision: interval
          from: {year: 49, era: ad}
          to: {year: 50, era: ad}
          label: "A.D. 49-50"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: traditional-catholic
        basis: >-
          The same article, second opinion: "Cornel and the majority of the
          upholders of the South-Galatian theory suppose, with much greater
          probability, that it was written about A.D. 53, 54."
        sources: [artifact.catholic-encyclopedia.volume-6.new-york-1909.newadvent-06336a-508d2398]
        note: >-
