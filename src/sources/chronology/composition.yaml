          into the past of history."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08275b-53821a60]
        note: >-
          The article's upper bound is the Council of Jerusalem, which it dates
          to A.D. 51: "the author could not have written after the Council of
          Jerusalem (A.D. 51), where James acted as president, without some
          allusion to his decision."
        date:
          precision: approximate-year
          from: {year: 47, era: ad}
          label: "probably written about A.D. 47"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Merk's article "Epistle to the Romans" in the Catholic Encyclopedia
          (vol. 13, 1912) rejects the early dating and proposes a later one:
          "the grounds for the assigning of this date to the Epistle are not
          entirely convincing, since the Epistle fits in better with the
          conditions of the succeeding decades. ... If the Epistle of St. James
          were composed shortly after the year 60, it might ... have been
          influenced by the misunderstood views of the teachings of St. Paul."
        sources: [artifact.catholic-encyclopedia.volume-13.new-york-1912.newadvent-13156a-dd2f7a55]
        note: >-
          The article puts the figure conditionally, in the course of arguing
          that James may answer misunderstandings of St Paul; it is recorded
          here as the rival Catholic dating the encyclopedia carries, not as a
          flat assertion. The same passage dismisses the second-century dating
          of Baur, Hilgenfeld, Holtzmann, von Soden and Julicher as "scarcely
          intelligible", and those figures are no part of this profile.
        date:
          precision: approximate-year
          from: {year: 60, era: ad}
          label: "shortly after the year 60"

