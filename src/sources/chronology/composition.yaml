  - id: composition.first-book-of-paralipomenon
    title: The First Book of Paralipomenon
    scope: {book: 1Par}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: reported-traditional
        basis: >-
          Bechtel's "The Books of Paralipomenon (Chronicles)" in the Catholic
          Encyclopedia reports that "The older writers generally attributed the
          authorship to Esdras" and that "most Catholic authors still adhere to
          Esdrine authorship, and place the time of composition at the end of the
          fifth or at the beginning of the fourth century B. C." The article prefaces
          both views with "The Books of Paralipomenon were undoubtedly written after
          the Restoration."
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11472a-5b13e868]
        note: >-
          The source names centuries, not years. The structured bounds are the fifth
          and fourth centuries B.C. entire, which is wider than the claim: the article
          places the composition at the TURN of those centuries. The narrowing is in
          the label and is the machine-readable claim's own limit, not a licence to
          treat 500 or 301 B.C. as asserted. This is a statement of what "most Catholic
          authors" hold, not a magisterial determination. PROFILE BOUNDARY: the same
          paragraph reports that "Most modern non-Catholic scholars attribute the work
          to an unknown writer and place its date between 300 and 250 B.C." — a modern
          critical dating this profile does not consult.
        date:
          precision: interval
          from: {year: 500, era: bc}
          to: {year: 301, era: bc}
          label: "the end of the fifth or at the beginning of the fourth century B. C."

