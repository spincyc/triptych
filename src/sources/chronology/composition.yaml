  - id: composition.book-of-tobias
    title: The Book of Tobias
    scope: {book: Tob}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Drum's "Tobias" in the Catholic Encyclopedia concludes that "If we accept the
          story as fact-narrative, we naturally conclude that it was written originally
          during the Babylonian Exile , in the early portion of the seventh century
          B.C.; and that all save the last chapter was the work of the elder and
          younger Tobias."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14749c-337eb42a]
        note: >-
          The claim is conditional in the source on its own premise, "If we accept the
          story as fact-narrative," which the article defends but does not treat as
          self-evident. The source names a century, not a year, and narrows within it
          to "the early portion"; the structured bounds are the seventh century B.C.
          entire and are therefore wider than the claim. The article adds that "It is
          likely that the elder Tobias wrote at least that part of the original work in
          which he uses the first person singular." The article's own placement of the
          deportation of Nephthali at 734 B.C. sits oddly beside a seventh-century
          date; the source does not reconcile the two and neither does this corpus.
          PROFILE BOUNDARY: the same paragraph records the datings it rejects —
          "Almost all Protestant scholars consider the book post-Exilic. Ewald assigns
          it to 350 B.C.; Hgen, the bulk to 280 B.C.; Gratz , to A.D. 130; Kohut, to
          A.D. 226."
        date:
          precision: interval
          from: {year: 700, era: bc}
          to: {year: 601, era: bc}
          label: "during the Babylonian Exile, in the early portion of the seventh century B.C."

  - id: composition.book-of-esther
    title: The Book of Esther
    scope: {book: Esth}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          McMahon's "Esther" in the Catholic Encyclopedia states that "the absence in
          the text of allusion to Jerusalem seems to lead to the conclusion that the
          book was written and published in Persia at the end of the reign of Xerxes I
          (485-465 B.C.) or during the reign of his son Artaxerxes I (465-425 B.C.)".
          Those are the only regnal years the article attaches to the writing.
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05549a-ab721ede]
        note: >-
          The sentence is concessive: the article states this date and immediately
          qualifies it, adding that "the text seems to offer several facts which may be
          adduced with some show of reason in favour of a later date." It opens the same
          discussion with "As to the authorship of the Book of Esther there is nothing
          but conjecture," and records that "The Talmud (Baba Bathra 15a) assigns it to
          the Great Synagogue; St. Clement of Alexandria ascribes it to Mardochai; St.
          Augustine suggests Esdras as the author." PROFILE BOUNDARY: the same page
          lists the late datings it declines to adopt — "135 B.C., 167 B.C., 238 B.C.,
          the beginning of the third century B.C., or the early years of the Greek
          period which began 332 B.C." — of which "The majority accept the last
          opinion." Those are the modern critical positions, not this claim.
        date:
          precision: interval
          from: {year: 485, era: bc}
          to: {year: 425, era: bc}
          label: "at the end of the reign of Xerxes I (485-465 B.C.) or during the reign of his son Artaxerxes I (465-425 B.C.)"

  - id: composition.book-of-wisdom
    title: The Book of Wisdom
    scope: {book: Wis}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Book of Wisdom" in the Catholic Encyclopedia states that "It is
          universally admitted that when the writer describes a period of moral
          degradation and persecution under unrighteous rulers who are threatened with
          heavy judgment, he has in view the time of either Ptolemy IV Philopator
          (221-204 B.C.), or Ptolemy VII Physicon (145-117 B.C.), for it is only under
          these depraved princes that the Egyptian Jews had to endure persecution ."
        sources: [artifact.catholic-encyclopedia.volume-15.new-york-1912.newadvent-15666a-999fbc07]
        note: >-
          The article does not choose between the two reigns — "it is confessedly
          difficult to decide which of these two monarchs the author of Wisdom had
          actually in view" — and allows that the work "was published after the demise
          of those princes," so the structured bounds are the envelope of the two
          reigns the source prints, not a single stated window. This is the case where
          the Catholic Encyclopedia's own position DISPLACES the older tradition: it
          holds that "the fact that the entire Book of Wisdom was composed in Greek
          rules out its Solomonic authorship" and that "At the present day, it is freely
          admitted that Solomon is not the writer of the Book of Wisdom." The displaced
          tradition is recorded and not asserted here: "ecclesiastical writers of the
          first centuries commonly assumed this authorship on the basis of the title of
          the book ... But this view of the matter never was unanimous in the Early
          Christian Church." No Solomonic date for Wisdom stands on this source.
        date:
          precision: interval
          from: {year: 221, era: bc}
          to: {year: 117, era: bc}
          label: "the time of either Ptolemy IV Philopator (221-204 B.C.), or Ptolemy VII Physicon (145-117 B.C.)"

  - id: composition.book-of-ecclesiasticus
    title: Ecclesiasticus
    scope: {book: Ecclus}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Ecclesiasticus" in the Catholic Encyclopedia computes the date from
          the translator's prologue: the grandson came to Egypt in "the year 132 B.C.",
          so "the translator's grandfather, the author of Ecclesiasticus, may be
          regarded as having lived and written his work between forty and sixty years
          before (between 190 and 170 B.C.)". The article concludes "that the author of
          Ecclesiasticus lived about the beginning of the second century B.C."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05263a-c3fe190d]
        note: >-
          Preferred because the article reaches this by its own argument and states
          that "recent Catholic scholars, in increasing number, prefer this position"
          over the rival identification of the high priest Simon of Sirach 50 with
          Simon I. Three dates in this article must not be conflated: the composition
          of the Hebrew original (190-170 B.C.), the grandson's arrival in Egypt (132
          B.C.), and the Greek translation made "not long after" that arrival. The
          article also rejects the Solomonic ascription, citing Augustine that "the more
          learned ... know full well that it should not be referred" to Solomon.
        date:
          precision: interval
          from: {year: 190, era: bc}
          to: {year: 170, era: bc}
          label: "between 190 and 170 B.C."
      - profile: catholic-traditional-v1
        disposition: alternate
        basis_class: traditional-catholic
        basis: >-
          The same article of the Catholic Encyclopedia records a competing Catholic
          dating turning on which high priest Simon is meant: identifying the Simon of
          Sirach 50 with Simon I "refers the composition of the book to about a century
          earlier (about 280 B.C.)".
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05263a-c3fe190d]
        note: >-
          Kept because it is a Catholic position the source prints, not a critical one.
          The article gives it as the view "recent Catholic scholars, in increasing
          number" prefer the second-century dating TO, and its own argument from Simon
          II's repairing of the Temple and the persecution under Ptolemy Philopator
          runs against it. The source's own hedge "about" is preserved.
        date:
          precision: approximate-year
          from: {year: 280, era: bc}
          label: "about 280 B.C."

  # --- The Greek Ecclesiasticus, natively -----------------------------------
  # The hard case Correction A exists for, and it was already latent here: the
  # unit above carries a note warning that three dates in Gigot's article "must
  # not be conflated", written by an author who had nowhere to put the second
  # one. `{book: Ecclus}` means the VULGATE's Ecclesiasticus, so 190-170 B.C.
  # reached every verse of the Latin text - including the pluses the same
  # article calls "foreign not only to the Greek, but also to the Hebrew text".
  #
  # This unit is admissible because authoring it here does not restate a fact
  # the preferred locus holds. The concordance refuses 1 355 of the Greek
  # book's 1 356 loci - "there is no numbering of 'Sirach' that both editions
  # are numbering differently; there are two texts", `guidance/versification.md`
  # section 4 - and the load-time gate would refuse this scope if what it
  # authored were already held in the vulgate.
  #
  # THE ONE LOCUS THAT IS NOT REFUSED LIES INSIDE THIS SCOPE, DELIBERATELY.
  # Greek Ecclus 36:16 is the single locus the concordance carries safely to
  # the Vulgate - the introit Da pacem Domine sustinentibus te, the Vulgate's
  # 36:18 - and the scope is NOT split to exclude it, because splitting would
  # delete the only assertion true of that verse about the Greek text: the
  # vulgate-scoped unit dates the Hebrew original and reaches the Latin
  # version, and holds nothing at all about the Greek translation. A query at
  # greek Ecclus 36:16 therefore answers at vulgate Ecclus 36:18 and returns
  # both units, which is what the gate now asks for - a native scope is
  # refused where it would RESTATE a claim the preferred locus already holds
  # under the same relation, not wherever the two texts happen to correspond.
  - id: composition.book-of-ecclesiasticus.greek
    title: Ecclesiasticus, the Greek translation
    scope: {system: greek, book: Ecclus}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Ecclesiasticus" in the Catholic Encyclopedia dates the Greek
          translation by its own translator's prologue, and separately from the
          Hebrew work it renders: "the thirty-eighth year of Ptolemy
          Euergetes", in which "the grandson of Jesus, the son of Sirach, came
          to Egypt, is the year 132 B.C.", and it was "not long after which he
          rendered into Greek his grandfather's work."
        sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05263a-c3fe190d]
        note: >-
          The article's own hedge "not long after" is kept and not turned into a
          year: 132 B.C. dates the grandson's arrival, and the translation
          followed it by an interval the source does not measure. So this is an
          approximate year and not the exact one the arrival carries.

          What this unit does NOT say is as important. It does not date the
          Hebrew original, which the vulgate-scoped
          `composition.book-of-ecclesiasticus` holds at 190-170 B.C.; the two
          are different acts of composition on different texts, and this corpus
          now has somewhere to put both. It does not date the Latin version
          either: the same article puts that at "probably the second century of
          our era", made "directly from the Greek", and says it "abounds in
          additional lines or even verses foreign not only to the Greek, but
          also to the Hebrew text." That third fact is still unauthored, and
          the honest consequence is recorded for the cold audit: the Vulgate
          unit's 190-170 B.C. currently reaches Latin pluses that the same
          source dates three centuries later. Narrowing it needs a verse-level
          account of which loci are pluses, which this repository does not hold.
        date:
          precision: approximate-year
          from: {year: 132, era: bc}
          label: "not long after ... the year 132 B.C."

  - id: composition.book-of-isaias
    title: The Book of Isaias
    scope: {book: Is}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Souvay's "Isaias" in the Catholic Encyclopedia places the prophetical
          ministry "from the closing year of Ozias, King of Juda," which it gives as
          the year of that prince's death, "(740 B.C. )", and holds that "since no
          prophecies appear to be later than 701 B.C. , it is doubtful if Isaias saw the
          reign of Manasses at all." Of the collection the article says it "might still
          possibly be attributed to the last years of the Prophet's life or shortly
          afterwards."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08179b-d4ee13fd]
        note: >-
          The two years date the PROPHET'S MINISTRY, which is the period the book's
          prophecies come from; the article assigns no year to the writing or final
          assembly of the collection and is expressly guarded about it — "The foregoing
          analysis does not enable us to assert indubitably that this first collection
          as such is the work of Isaias." 740 is attached by the article to the death of
          Ozias while reporting Jerome's view of chapter vi, and 701 is the article's own
          inference ("appear to be"). The traditional position on AUTHORSHIP carries no
          year and is therefore not a second claim: the Pontifical Biblical Commission,
          28 June 1908, decided that "There are no solid arguments to the fore, even
          taken cumulatively, to prove that the book of Isaias is to be attributed not to
          Isaias himself alone, but to two or rather to many authors". The article
          concedes that the author of xl-lxvi "does speak from the point of view of the
          Babylonian Captivity."
        date:
          precision: range
          from: {year: 740, era: bc}
          to: {year: 701, era: bc}
          label: "from the closing year of Ozias, King of Juda (740 B.C.); no prophecies appear to be later than 701 B.C."

  - id: composition.book-of-jeremias
    title: The Book of Jeremias
    scope: {book: Jer}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Faulhaber's "Jeremias" in the Catholic Encyclopedia states that "Jeremias is
          directed to write down, either personally or by his scribe Baruch, the
          discourses he had given up to the fourth year of Joakim (604 B.C. )," and
          that "This first authentic recension of the prophecies forms the basis of the
          present Book of Jeremias."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08334a-dd4ae528]
        note: >-
          604 B.C. dates the FIRST authentic recension, which the article says forms
          the basis of the present book; it does not date the finished book. The same
          paragraph records growth after it — "the first transcript was enlarged by
          various insertions and additions from the pen of Baruch or of a later
          prophet" — and singles out the last chapter as "an addition of the
          post-Jeremianic period based on 2 Kings 24:18 - 25:30 , on account of the
          concluding statement of li: 'Thus far are the words of Jeremias.'" The article
          arranges the book by reign, from Josias through the period after the
          destruction of Jerusalem, so parts of it are later than 604 on the article's
          own showing.
        date:
          precision: year
          from: {year: 604, era: bc}
          label: "the fourth year of Joakim (604 B.C.)"

  - id: composition.book-of-daniel
    title: The Book of Daniel
    scope: {book: Dan}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Book of Daniel" in the Catholic Encyclopedia states the traditional
          view and its date of composition together: "The traditional view, in vigour
          chiefly among Catholics , is to the effect that the whole work, as found in
          the Hebrew Bible, should be directly referred to Daniel, whose name it
          bears", and calls it, in the same section, "this time-honoured position
          which ascribes to Daniel the authorship of the book which bears his name,
          and admits 570-536 B.C. as its date of composition".
        sources: [artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04621b-2a74931e]
        note: >-
          570-536 B.C. is the article's own date of composition for the traditional
          view, printed in that view's own name, and it is what this claim now holds.
          586-536 B.C. is NOT that: it is the article's parenthetical gloss on "the
          Exile" inside the question it poses at the head of the section, "Is this
          sole writer the Prophet Daniel who composed the work during the Exile
          (586-536 B.C.)". That gloss stood here as the composition interval - wider
          at its begin endpoint than the source supports - while the article's own
          interval went unrecorded. The traditional view as the article states it
          covers the whole work "as found in the Hebrew Bible"; the three
          deuterocanonical portions are treated in a separate section which dates
          them differently, and they now carry units of their own, so this claim no
          longer reaches them by inheritance. The view "admits, indeed, that numerous
          alterations have been introduced into the primitive text of the book in the
          course of ages." PROFILE BOUNDARY: against it the article sets out at length
          "a comparatively recent theory which has been widely accepted by
          contemporary scholars", placing an unknown author "in the time of Antiochus
          IV, Epiphanes (175-164 B.C.)"; it is kept out of this profile under 4.1 and
          not silently corrected, and the article's own verdict is that "Despite the
          fact that some of these arguments against the Danielic authorship have not
          yet been fully disproved, Catholic scholars generally abide by the
          traditional view, although they are not bound to it by any decision of the
          Church".
        date:
          precision: interval
          from: {year: 570, era: bc}
          to: {year: 536, era: bc}
          label: "admits 570-536 B.C. as its date of composition"

  - id: composition.book-of-daniel.prayer-of-azarias
    title: The Prayer of Azarias and the Song of the Three Children (Dan. iii, 24-90)
    scope: {book: Dan, chapter: 3, first: 24, last: 90}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Book of Daniel", in its section "Deutero-canonical portions",
          judges of this fragment: "In reality, there are wellnigh insuperable
          difficulties to such an early date for Dan ., iii, 24-90, so that this
          fragment also, like the other two, should most likely be ascribed to some
          unknown Jewish author who lived long after the Exile."
        sources: [artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04621b-2a74931e]
        note: >-
          The article's own judgment, given against the view it has just reported -
          "it is maintained by nearly all Catholic writers, that the Prayer of Azarias
          and the Song of the Three Children cannot be dissociated from the preceding
          and the following context in Daniel 3 , and that therefore they should be
          referred to the time of Daniel, if not to that Prophet himself". Both stand
          in the same rank-6 article, so this note, and not a rank difference, is what
          settles the order under SS4.4; the reported contrary view is recorded here
          rather than authored, because the article states it in order to reject it.
          "Most likely" is the source's hedge and is kept. No year: the article prints
          none for these fragments, and the anchor is the Exile, which the same
          article glosses as 586-536 B.C. without attaching that gloss to this
          fragment. Until this unit existed the whole-book claim reached these verses
          with "during the Exile", which is what this same article denies of them.
          Verse bounds read in the tracked Douay: 3:23 is the three men falling bound,
          3:24 opens "And they walked in the midst of the flame", 3:90 closes the
          Benedicite and 3:91 resumes Nabuchodonosor.
        date:
          precision: relative
          relative:
            of: israel.exile.seventy-years
            statement: >-
              ascribed to some unknown Jewish author who lived long after the Exile
          label: "most likely long after the Exile"

  - id: composition.book-of-daniel.susanna-and-bel
    title: The histories of Susanna and of Bel and the dragon (Dan. xiii-xiv)
    scope:
      - {book: Dan, chapter: 13}
      - {book: Dan, chapter: 14}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Book of Daniel" states of the last two deutero-canonical fragments:
          "It is readily granted by conservative scholars (Vigouroux, Gilly, etc.)
          that the last two are probably from a different and later author than the
          rest of the book", and of all three together that each "should most likely
          be ascribed to some unknown Jewish author who lived long after the Exile."
        sources: [artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04621b-2a74931e]
        note: >-
          Two chapters, one statement: the article groups them as "the last two" and
          dates them together, so they are one unit and not two. The concession is
          granted by named conservative Catholic scholars and reported approvingly,
          not in the modern critical voice 4.3 excludes. No year is printed and none
          is supplied; the hedges "probably" and "most likely" are the source's. The
          article adds that whatever is thought "concerning these literary or
          historical questions, there cannot be the least doubt that in decreeing the
          sacred and canonical character of these fragments the Council of Trent
          proclaimed the ancient and morally unanimous belief of the Church of God ."
          Sole claim on this subject, so SS4.4 is trivially satisfied.
        date:
          precision: relative
          relative:
            of: israel.exile.seventy-years
            statement: >-
              probably from a different and later author than the rest of the book,
              who lived long after the Exile
          label: "most likely long after the Exile"

  # === lane osee ===
  # NO composition unit is authored for Osee, and the withdrawal is deliberate.
  # Calès's "Osee" (Catholic Encyclopedia, vol. 11, New York, 1911) dates the
  # PROPHET and not the book. Both of its ranges stand in the section "Time of
  # his ministry": the title-derived "from about 750 to 725 B.C.", and, after the
  # title is set aside as "not quite satisfactory", "The era of the Prophet,
  # therefore, if it is to be judged from his writings, ought to be placed about
  # 750-735". Neither is a date of writing, and the article treats the writing or
  # compilation of the book nowhere -- as the withdrawn unit's own preferred note
  # conceded. guidance/scripture-chronology.md 5 says a superscription-setting is
  # not a composition and a title "is evidence about a setting ... not proof of a
  # year", and 8 admits authorship toward composition only to the degree an
  # inspected source actually dates or bounds the writing. Both ranges are now
  # held once, on the event israel.divided-kingdom.osee-ministry, and reached from
  # Osee by a prophecy-given binding over the book and a superscription-setting
  # binding over the title verse.

  - id: composition.book-of-joel
    title: The Prophecy of Joel
    scope: {book: Joel}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: reported-traditional
        basis: >-
          Faulhaber's "Joel" in the Catholic Encyclopedia reports the traditional
          dating: "The early commentators, in agreement with Jerome , placed the era of
          composition in the eighth century B.C. ; they took Joel, therefore, as a
          contemporary of Osee and Amos ." Their reasons were the book's place among the
          twelve between Osee and Amos, and its silence about the Assyrians.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08419a-c5e20537]
        note: >-
          The article REPORTS this dating and endorses no dating at all. It opens "The
          most difficult problem in the investigation of Joel is the date, and the many
          hypotheses have not led to any convincing result," undercuts the
          eighth-century argument in the next sentence — "However, in a book of three
          chapters not much weight can be attached to an argument from silence" — and
          closes "None of the chronological hypotheses concerning Joel can claim to
          possess convincing proof ." Preferred only in the sense that it is the sole
          claim this profile holds on the subject and it is the position the early
          commentators and Jerome took; it is not a settled date. The article prints two
          alternatives without adopting either: the period of King Josias, and, by
          "Later commentators", the period after the Exile. The source names a century,
          not a year, so the structured bounds are the eighth century B.C. entire.
        date:
          precision: interval
          from: {year: 800, era: bc}
          to: {year: 701, era: bc}
          label: "the eighth century B.C."

  - id: composition.book-of-abdias
    title: The Prophecy of Abdias
    scope: {book: Abd}
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis_class: reported-traditional
        basis: >-
          Gigot's "Abdias" in the Catholic Encyclopedia reports that "Many among them
          (Keil, Orelli, Vigouroux, Trochon, Lesêtre, etc.) assign its composition to
          about the reign of Joram (ninth century B.C.)," and that "it is inferred that
          the prophecy of Abdias originated between the reign of Joram and the time of
          Joel and Amos , that is, about the middle of the ninth century B.C."
        sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01030b-f708bbb1]
        note: >-
          The article does not decide. It opens by saying "there are various reasons,
          literary and exegetical , which prevents scholars from agreeing upon the date
          of its composition," and reports rather than endorses this dating ("we are
          told", "it is inferred", "is said also to be confirmed"). The whole case turns
          on identifying the capture of Jerusalem in Abdias 11-14 with the sacking under
          Joram rather than with Nabuchodonosor. The source names a century and narrows
          within it to "about the middle", so the structured bounds are the ninth
          century B.C. entire and are wider than the claim. Two further opinions stand
          in the same section. The second is not the modern critical voice SS4.3
          excludes and could be authored: Meyrick, Jahn, Ackerman and Allioli "refer
          the composition of the book to about the time of the Babylonian Captivity ,
          some three centuries after King Joram," which is a statement of position and
          not of silence, and Jahn and Allioli are Catholic authors reported by a
          ranked Catholic source. The third - "Others again, ascribe the present book
          of Abdias to a still later date" - is NOT authorable here: the article names
          no author for it, and its whole ground is a dating of Joel, Daniel and
          Zacharias 9-14 "long after the return from Babylon", which is the modern
          critical chronology SS4.3 excludes. Neither prints a year, and that is
          not why the second is left unauthored: the correction that made this
          claim disputed on 2026-08-27 authored no new claims, and the opinion is
          set down here in the article's own words so that it can be authored on
          the evidence rather than rediscovered. The ninth-century date is not this profile's own and is not
          displayed first: the only ground the article gives for it stands in the voice of
          "Many among them (Keil, Orelli, Vigouroux, Trochon, Lesêtre, etc.)", and every
          step of the argument is reported with a distancing verb, so it is a named third
          party's claim rather than the source's assertion. Two of those five names are
          not Catholic authorities at all, and the three Catholic commentators are cited
          without edition identity, so this corpus holds no ranked record standing behind
          them. The claim is kept, with its provenance, as the unsettled disagreement the
          article says it is.
        date:
          precision: interval
          from: {year: 900, era: bc}
          to: {year: 801, era: bc}
          label: "about the reign of Joram (ninth century B.C.)"

  - id: composition.book-of-micheas.chapters-1-3
    title: The Prophecy of Micheas, chapters 1-3
    scope: {book: Mich, chapter: 1, through: 3}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Van Hoonacker's "Book of Micheas" in the Catholic Encyclopedia states of the
          first part that "There is a general consensus of opinion to attribute to the
          Prophet Micheas the authorship of this part of the book" and that "Chapters
          1-3 must have been composed shortly before the destruction of the Kingdom of
          Samaria by the Assyrians (722 B.C.)."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10278a-0de24478]
        note: >-
          Scoped to chapters 1-3 because that is exactly what the source dates. The
          article gives NO year for chapters 4-5 or 6-7: it argues against post-exilic
          origin for 4-5 without proposing a date, and says of 6-7 that "The opinions of
          critics are much divided on the composition of these chapters." The article
          notes "serious doubts have been expressed only concerning 2:11-12". The
          prophet's ministry is separately placed "under the Kings Joathan (c. 740-735 B.
          C.), Achaz (735-727?), and Ezechias (727-698?)" — the question marks are the
          source's own — with the remark "We do not, however, appear to possess any of
          his addresses prior to the reign of Ezechias."
        date:
          precision: approximate-year
          from: {year: 722, era: bc}
          label: "shortly before the destruction of the Kingdom of Samaria by the Assyrians (722 B.C.)"

  - id: composition.book-of-nahum.chapters-2-3
    title: The Prophecy of Nahum, chapters 2-3
    scope: {book: Nah, chapter: 2, through: 3}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: unreviewed
        basis: >-
          Souvay's "Nahum" in the Catholic Encyclopedia bounds the oracle on Ninive at
          both ends: "Thebes was captured and destroyed by Assurbanipal in 664-663 B.C.",
          which fixes the upper limit, and "The lower limit which it is allowable to
          assign to this part of the book of Nahum is, of course, the fall of Ninive,
          which a well-known inscription of Nabonidus permits us to fix at 607 or 606
          B.C."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10670a-2f9e032c]
        note: >-
          Scoped to chapters 2-3 because the article's bounding argument is expressly
          about "this part of the book". It names no year of writing, says the date
          "cannot be determined to the year", and offers only "a sufficiently accurate
          approximation"; the structured bounds are the envelope of the years it prints.
          This is a case where the Catholic Encyclopedia EXPLICITLY DISCARDS an older
          tradition on Assyriological grounds: Josephus's placing of the prophecy "115
          years before the fall of Ninive (about 721 B.C.)" and Nicephorus's making
          Nahum a contemporary of Phacee "ought to be discarded as impossible." It also
          excludes Eutychius's view that Nahum prophesied five years after the downfall
          of Jerusalem, "therefore about 583-581". The article opens the same section
          noting that "Until a recent date, both the unity and authenticity of the Book
          of Nahum were undisputed."
        date:
          precision: interval
          from: {year: 664, era: bc}
          to: {year: 606, era: bc}
          label: "after the capture of Thebes (No-Ammon) in 664-663 B.C. and before the fall of Ninive at 607 or 606 B.C."

  - id: composition.book-of-habacuc
    title: The Prophecy of Habacuc
    scope: {book: Hab}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Habacuc (Habakkuk)" in the Catholic Encyclopedia, after surveying the
          opinions, states that "the view which ascribes the book to 605-600 B.C. 'is
          best in harmony with the historical circumstances under which the Chaldeans
          are presented in the prophecy of Habacuc' (Van Hoonacker)."
        sources: [artifact.catholic-encyclopedia.volume-7.new-york-1910.newadvent-07097a-8ad7be64]
        note: >-
          The preference is quoted from Van Hoonacker, not asserted flatly, and the
          article says only that "these various views do not enjoy the same amount of
          probability" and that "it is no easy matter to choose among them." A COMPETING
          TRADITIONAL POSITION stands in the same section and is not authored as a second
          claim because the source prints no year for it: "Ancient rabbis, whose view is
          embodied in the Jewish chronicle entitled Seder olam Rabbah , and is still
          accepted by many Catholic scholars ( Kaulen , Zschokke, Knabenbauer, Schenz,
          Cornely , etc.), refer the composition of the book to the last years of
          Manasses's reign." Do not merge the two. The article also prints Clement of
          Alexandria's "Habacuc still prophesied in the time of Sedecias" (599-588 B.C.),
          Jerome's ascription to the Babylonian Exile — which it calls "decidedly the
          least probable" and notes "is now that propounded by many rationalists" — and
          "Some recent scholars ... place it under Josias (641-610 B.C.)". On chapter iii
          the article records real doubt about authorship.
        date:
          precision: interval
          from: {year: 605, era: bc}
          to: {year: 600, era: bc}
          label: "605-600 B.C."

  - id: composition.book-of-sophonias
    title: The Prophecy of Sophonias
    scope: {book: Soph}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Faulhaber's "Sophonias (Zephaniah)" in the Catholic Encyclopedia states that
          "The date of the Prophet's activity fell in the reign of King Josias (641-11)"
          and that "Sophonias is one of the few Prophets whose chronology is fixed by a
          precise date in the introductory verse of the book."
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14146a-4ff4aa4c]
        note: >-
          The source prints the reign as "(641-11)", an abbreviated form for 641-611
          with no era letters; the label keeps the source's own printing and the
          structured endpoints spell out the terminal year. The range dates the
          PROPHET'S ACTIVITY, not the writing of the book, and the article does not
          narrow further within the reign, though it places the setting "only a few
          decades before its downfall (586)."
        date:
          precision: interval
          from: {year: 641, era: bc}
          to: {year: 611, era: bc}
          label: "the reign of King Josias (641-11)"

  - id: composition.book-of-aggeus
    title: The Prophecy of Aggeus
    scope: {book: Agg}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Gigot's "Aggeus (Haggai)" in the Catholic Encyclopedia states that the
          passages about the prophet "refer simply to the occasion on which he had to
          deliver a divine message in Jerusalem , during the second year of the reign of
          the Persian King, Darius I (520 B.C.)", and that "The book of Aggeus is made up
          of four prophetical utterances, each one headed by the date on which it was
          delivered."
        sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01209d-02397b81]
        note: >-
          520 B.C. is the year the four utterances the book is made up of were
          DELIVERED, each internally dated; the article says nothing separately about
          when the book was compiled. The article is expressly sceptical of the
          biographical traditions about Aggeus: "Obviously, these and similar traditions
          deserve but little credence."
        date:
          precision: year
          from: {year: 520, era: bc}
          label: "the second year of the reign of the Persian King, Darius I (520 B.C.)"

  - id: composition.book-of-zacharias
    title: The Prophecy of Zacharias
    scope: {book: Zach}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Drum's "Zacharias" in the Catholic Encyclopedia states that "The author of the
          entire prophecy is Zacharias. The time of part first is the second and fourth
          years of the reign of Darius in Babylon (520 and 522 B.C.). The time of part
          second is probably toward the end of the reign of Darius or the beginning of
          that of Xerxes (485 B.C.)."
        sources: [artifact.catholic-encyclopedia.volume-15.new-york-1912.newadvent-15741b-434202d2]
        note: >-
          The source prints "(520 and 522 B.C.)" in that order, second year then fourth
          year, so the numbers are not ascending on the page; the label reproduces the
          printing and the structured range runs from the earlier year. The second
          part's date is doubly hedged, "probably" and "toward the end ... or the
          beginning", and the article's occasion for it is a conjecture: "that of the
          second part is perhaps the approach of the Prophet's death." The traditional
          unity of authorship is the article's own ground: "this unanimity shows that
          both in Judaism and the Church there has never been a serious doubt in the
          matter of the unity of authorship of Zacharias."
        date:
          precision: range
          from: {year: 522, era: bc}
          to: {year: 485, era: bc}
          label: "the second and fourth years of the reign of Darius (520 and 522 B.C.) ... toward the end of the reign of Darius or the beginning of that of Xerxes (485 B.C.)"

  - id: composition.book-of-malachias
    title: The Prophecy of Malachias
    scope: {book: Mal}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Van Hoonacker's "Malachias (Malachi)" in the Catholic Encyclopedia states that
          "Critics are practically agreed in dating the book from about the middle of
          the fifth century B.C.", and that the proposal placing it in the second
          century B.C. "has received no support."
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09562b-38fb6fcd]
        note: >-
          The source is explicit that "The text itself does not furnish any explicit
          information"; the date rests on inference from the Persian title Peha and from
          the state of worship, "because not only the Temple exists, but relaxation in
          the exercise of worship already prevails". It is given as a scholarly consensus
          ("Critics are practically agreed"), not as a tradition and not as a magisterial
          determination. The source names a century and narrows within it to "about the
          middle", so the structured bounds are the fifth century B.C. entire and are
          wider than the claim.
        date:
          precision: interval
          from: {year: 500, era: bc}
          to: {year: 401, era: bc}
          label: "about the middle of the fifth century B.C."

  - id: composition.first-book-of-machabees
    title: The First Book of Machabees
    scope: {book: 1Mach}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Bechtel's "The Books of Machabees" in the Catholic Encyclopedia bounds the
          first book at both ends: "the book cannot have been written till some time
          after the beginning of the reign of John Hyrcanus (135-105 B.C.)", and "The
          latest possible date is generally admitted to be prior to 63 B. C., the year of
          the occupation of Jerusalem by Pompey", concluding "The date would, therefore,
          in any case, be within the last years of the second century B.C."
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09495a-6afd1136]
        note: >-
          The structured bounds are the article's own outer limits; it narrows within
          them to "the last years of the second century B.C.", as the label records. The
          author is unknown — "No data can be found either in the book itself or in later
          writers which would give us a clue as to the person of the author" — and the
          article says only that he "was a native of Palestine". Whether Hyrcanus was
          still alive when the book was written is left open: "Many understand it to
          indicate that Hyrcanus was then still alive, and this seems to be the more
          natural meaning. Others, however, take it to imply that Hyrcanus was already
          dead."
        date:
          precision: interval
          from: {year: 135, era: bc}
          to: {year: 63, era: bc}
          label: "after the beginning of the reign of John Hyrcanus (135-105 B.C.) ... prior to 63 B. C. ... in any case, within the last years of the second century B.C."

  - id: composition.second-book-of-machabees
    title: The Second Book of Machabees, the book proper (ii, 20-xv, 40)
    scope: {book: 2Mach, chapter: 2, through: 15, first: 20, last: 40}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Bechtel's "The Books of Machabees" in the Catholic Encyclopedia states that
          the second book "is, as has been said, an epitome of a larger work by a certain
          Jason of Cyrene", that "The epitome cannot have been written earlier than the
          date of the first letter, that is 124 B.C.", and that "In the very probable
          supposition that the first letter was sent with a copy of the book, the latter
          would be of about the same date ."
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09495a-6afd1136]
        note: >-
          The article adds "As to the exact date there is great divergence," and 124 B.C.
          is a floor which its "very probable supposition" turns into an approximate date
          of writing; the approximation is the source's own and is not resolved here.
          Three distinct compositions must not be collapsed, and no longer are:
          Jason's lost original, whose author "must have finished his work shortly
          after the death of Nicanor, and before disaster overtook Judas Machabeus";
          this epitome, whose extent the article gives as "The book proper (ii,
          20-xv, 40)"; and the two prefixed letters, "(i, 1-ii, 19)", which the same
          article says "otherwise have no connexion with the book" and which now
          carry composition units of their own. The author of the epitome is unknown.
        date:
          precision: approximate-year
          from: {year: 124, era: bc}
          label: "not earlier than ... 124 B.C. ... the latter would be of about the same date"

  - id: composition.second-book-of-machabees.first-letter
    title: The first letter prefixed to II Machabees (i, 1-10a)
    scope: {book: 2Mach, chapter: 1, first: 1, last: 10}
    note: >-
      Bechtel divides the two letters at i, 10a, which falls inside the Douay's
      verse 1:10: its opening clause, "In the year one hundred and eighty-eight",
      closes this letter and carries its date, and the remainder of the verse opens
      the second. A scope cannot split a verse, so 1:10 is held here, with the
      letter whose date it prints, and the second letter's unit begins at 1:11. The
      two units deliberately do not overlap: a verse covered by two units of equal
      width is settled by authoring order, not by the narrowest-wins rule, because
      Unit.width() ranks whole-book, whole-chapter and verse-range and not verse
      counts.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Bechtel's "The Books of Machabees" in the Catholic Encyclopedia states that
          "The book proper (ii, 20-xv, 40) is preceded by two letters of the Jews of
          Jerusalem to their Egyptian coreligionists (i, 1-ii, 19)", of which "The
          first (i, 1-10a), dated in the year 188 of the Seleucid era (i.e. 124
          B.C.)".
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09495a-6afd1136]
        note: >-
          The letter carries its own date, which is why the epitome's floor is taken
          from it: "The epitome cannot have been written earlier than the date of the
          first letter, that is 124 B.C." The same article says the two letters
          "otherwise have no connexion with the book", which is why they are units of
          their own and not part of the epitome's scope. The Seleucid year is the
          source's own and so is the B.C. equivalent it prints; no conversion is made
          here. Sole claim on this subject, so SS4.4 is trivially satisfied.
        date:
          precision: year
          from: {year: 124, era: bc}
          label: "dated in the year 188 of the Seleucid era (i.e. 124 B.C.)"

  - id: composition.second-book-of-machabees.second-letter
    title: The second letter prefixed to II Machabees (i, 10b-ii, 19)
    scope: {book: 2Mach, chapter: 1, through: 2, first: 11, last: 19}
    note: >-
      The scope begins at 1:11 and not at 1:10b because a scope cannot split a
      verse; see the note on the first letter's unit.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Bechtel's "The Books of Machabees" states that "The second (i, 10b-ii, 19),
          which is undated", and then dates it from its contents: "The second letter
          must have been written soon after the death of Antiochus, before the exact
          circumstances concerning it had become known in Jerusalem , therefore about
          163 B.C."
        sources: [artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-09495a-6afd1136]
        note: >-
          "About" is the source's own and is not resolved. The article dates this
          letter four decades before the epitome it stands in front of, which is what
          made the withdrawn whole-book scope over 2Mach false: it answered the whole
          of this letter, 2Mach.1.11 to 2:19, with the epitome's 124 B.C. The article
          adds that the Antiochus in question "is Antiochus IV and not Antiochus III,
          as many Catholic commentators maintain". Sole claim on this subject, so
          SS4.4 is trivially satisfied.
        date:
          precision: approximate-year
          from: {year: 163, era: bc}
          label: "therefore about 163 B.C."
  # === lane esdras ===
  # NO composition unit is authored for 1 or 2 Esdras, and the withdrawal is
  # deliberate. The only year either inspected article prints for the writing
  # of these books is Van Hoonacker's, and it stands inside a clause he
  # attributes to others -- the documents "underwent compilation and redaction
  # together at the hands probably, as most critics think, of the author of
  # Paralipomenon about B.C. 300" -- which is modern critical chronology and
  # is excluded by guidance/scripture-chronology.md 4.3. Souvay's "Esdras"
  # prints no year for the writing at all. Both books therefore stand under
  # undated-in-tradition rows in gaps.yaml, where the refusals are quoted.
  # === lane josue-judges ===
  # --- ot-composition-josue-judges ---------------------------------------
  - id: composition.book-of-josue
    title: The Book of Josue
    scope: {book: Jos}
    note: >-
      Walter Drum's article "Josue (Joshua)" in the Catholic Encyclopedia (vol.
      8, New York, 1910) was read in full for this corpus. Unlike the
      Pentateuch article, it does treat the date of writing, and it prints no
      year of any era for it: what it gives are two bounds and an estimate, all
      of them relative to persons and events. Its one printed numeral, "Tyre
      (twelfth century B.C.)", dates the rise of Tyre over Sidon inside the
      argument and is not the date of the book. The bounds and the estimate are
      one argument by one author, not rival traditions, so the bound the
      article calls certain is displayed first and the estimate it calls
      favoured by internal evidence is kept beneath it.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Drum's article opens its section on authorship with the bound it
          calls certain: "The Book of Josue was certainly written before the
          time of David, for the Chanaanite still dwelt in Gazer (xvi, 10), the
          Jebusite in Jerusalem (xv, 63), and Sidon held supremacy in Phoenicia
          (xiv, 28); whereas, before the time of Solomon, the Egyptians had
          driven the Chanaanite from Gazer (1 Kings 9:16), David had captured
          Jerusalem in the eighth year of his reign (2 Samuel 5:5), and Tyre
          (twelfth century B.C.) had supplanted Sidon in the supremacy of
          Phoenicia."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08524a-98ab5e95]
        note: >-
          This is the article's own "certainly", and it is what settles the
          display order against the estimate below, which the same article
          hedges. Of the later editing that many Catholic authors admit, the
          article adds that "all insist that this editing was done before the
          Exile", so the pre-exilic bound covers the redaction as well as the
          first writing. The article rejects the critics' "final redaction is
          post-Exilic a work done about 440-400 B.C." as their theory and not
          its own, and that figure is therefore not a claim of this corpus.
        date:
          precision: relative
          relative:
            of: israel.monarchy.david-accession
            statement: certainly written before the time of David
          label: "certainly written before the time of David"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis_class: traditional-catholic
        basis: >-
          The same article's next paragraph states the narrower estimate and
          hedges it: "Internal evidence favours the view that the author lived
          not long after the death of Josue." It reasons from the exactness of
          the tribal allotments, which "could not be explained were we to admit
          that the narrative is post-Exilic in its final redaction."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08524a-98ab5e95]
        note: >-
          "Favours the view" is the article's hedge and is kept. On whether
          Josue himself wrote all but the epilogue the same article declines to
          decide - "Catholics are divided" - so this claim dates a writing and
          settles no question of authorship. It is displayed beneath the
          certain bound above, not against it.
        date:
          precision: relative
          relative:
            of: israel.conquest.last-charge-and-death-of-josue
            statement: the author lived not long after the death of Josue
          label: "not long after the death of Josue"

  - id: composition.book-of-judges
    title: The Book of Judges
    scope: {book: Judg}
    note: >-
      Walter Drum's article "Judges" in the Catholic Encyclopedia (vol. 8, New
      York, 1910) was read in full for this corpus. It reasons to a date of
      writing in six numbered steps and reaches a conclusion in its own voice,
      but it prints no year of any era for the book. Its one B.C. numeral, the
      "not later than 621 B.C." at which Moore's pre-Deuteronomic redactor is
      said to have united J and E, belongs to the critical hypothesis the
      article reports in order to refuse it - "Catholics may not go the way of
      Rationalists and of Protestants in the matter of the so-called late and
      manifold redaction of Judges" - and is not a date of this corpus. The
      conclusion and the bounds are one argument by one author, so the
      conclusion is displayed first and the tightest bound is kept beneath it.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Drum's article states the conclusion of its own argument: "(5) Since,
          then, Judges was most likely written in the first years of Saul's
          reign, there is no more probable writer thereof than Samuel." It
          reaches it from step (4), that "it is likely that Judges antedates
          even the first seven years of David's reign and the last years of
          Saul's", because in that period "Saul had rooted out the magicians
          and soothsayers from the land" and the book's purpose "to keep the
          children of Israel from idolatry" would have had no occasion.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08547a-5242e582]
        note: >-
          "Most likely" and "it is likely" are the article's own hedges and are
          kept. The article's ascription to Samuel, which it shares with
          Cornely and Hummelauer, who "both consider that the writer of Judges
          was probably Samuel", is an author and not a date, and nothing here
          rests on it. The claim is displayed first because it is the article's
          own conclusion, of which the bound below is one premise.
        date:
          precision: relative
          relative:
            of: israel.monarchy.saul-accession
            statement: most likely written in the first years of Saul's reign
          label: "in the first years of Saul's reign"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis_class: traditional-catholic
        basis: >-
          The same article's step (3) states the tightest bound it argues for:
          "This last editor must have written before David had reigned seven
          years. For Jerusalem was still called Jebus and was occupied by the
          Jebusites (xix, 11); whereas, in the seventh year of his reign, David
          took the citadel of Sion, called it the city of David, and destroyed
          the Jebusites (2 Samuel 5)."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08547a-5242e582]
        note: >-
          The outer bounds of the same argument are steps (1) and (2), neither
          of which is a year: "Judges, in its present state, cannot have been
          written before Israel had a king", because of "In those days there
          was no king in Israel" at xvii, 6; and "The book was not written
          after Solomon had done evil." The capture of Sion named here is the
          event this corpus holds as israel.monarchy.david-capture-of-sion, and
          the bound is recorded against it rather than against any of the
          disputed years for David's accession.
        date:
          precision: relative
          relative:
            of: israel.monarchy.david-capture-of-sion
            statement: >-
              the last editor must have written before David had reigned seven
              years, when he took the citadel of Sion
          label: "before David had reigned seven years"
  # === lane kings ===
  - id: composition.first-book-of-kings
    title: The First Book of Kings
    scope: {book: 1Kings}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Florentine Bechtel's "First and Second Books of Kings" in the Catholic
          Encyclopedia (New York, 1910) treats I-II Kings as one work, refuses a
          precise date and then states the limits it will allow: "No sufficient
          data are at hand to fix a precise date. We can, however, assign certain
          limits of time within which the work must have been composed. ... The
          earliest date cannot, therefore, be placed before the reign of Abiam.
          The latest date, on the other hand, must be assigned to a time prior to
          Josias's reform (621 B.C.)." It adds that "The purity of language
          speaks for an early rather than a late date within the above limits."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08647b-a445d5a7]
        note: >-
          The upper limit is the only bound the article expresses as a year, and
          the year belongs to Josias's reform, which this corpus already holds as
          an event; that is why the claim is anchored on the reform rather than
          printed as an interval. The lower limit is a reign, not a year: the
          article names "the reign of Abiam" and prints no figure for it, and
          this corpus will not borrow one from the Petavius or Sloet tables in
          the neighbouring article, because that subtraction is a derivation no
          source makes. On the author the same article is flatly negative — "we
          can only say that the author is unknown" — and its survey of proposals
          ranges from "the last days of David" (Hummelauer) to "between the death
          of David and the destruction of the Kingdom of Juda" (Clair), none of
          which it adopts. PROFILE BOUNDARY: the article also reports that
          "According to recent critics it belongs to the seventh century, but
          received retouches as late as the fifth or even the fourth century",
          which is a modern critical dating this profile does not consult. This
          unit is authored per book because the corpus is keyed per book, and it
          asserts of 1 Kings exactly what the article asserts of the single work.
        date:
          precision: relative
          relative:
            of: israel.divided-kingdom.josias-reform
            statement: >-
              not before the reign of Abiam and prior to Josias's reform (621
              B.C.), with the purity of language speaking for an early rather
              than a late date within those limits
          label: "prior to Josias's reform (621 B.C.)"

  - id: composition.second-book-of-kings
    title: The Second Book of Kings
    scope: {book: 2Kings}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Florentine Bechtel's "First and Second Books of Kings" in the Catholic
          Encyclopedia (New York, 1910) treats the two books as one work whose
          division "was first introduced into the Septuagint, to conform to the
          shorter and more convenient size of scrolls in vogue among the Greeks",
          and assigns that one work its limits: "The earliest date cannot,
          therefore, be placed before the reign of Abiam. The latest date, on the
          other hand, must be assigned to a time prior to Josias's reform (621
          B.C.)." Its refusal stands in the same paragraph: "No sufficient data
          are at hand to fix a precise date."
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08647b-a445d5a7]
        note: >-
          The same limits as the first book, because the article dates one work
          and not two. One caveat belongs to this book alone and is recorded
          rather than acted on: the article divides the contents so that "(5)
          xxi-xxiv, appendix containing miscellaneous matter" is the appendix of
          II Kings, and then says "The appendix, however, may possibly be due to
          a somewhat later hand", adding that "additions by a subsequent inspired
          revisor may be admitted without difficulty." That is a hedged
          possibility with no date attached, so no narrower unit is authored over
          2 Kings 21-24 and this unit is not withdrawn from them; anyone
          publishing a date for the appendix must carry the article's "may
          possibly". PROFILE BOUNDARY: the Wellhausen-Budde source analysis the
          article reports at length, with its ninth-century J and its
          seventh-century E, is modern critical chronology this profile does not
          consult.
        date:
          precision: relative
          relative:
            of: israel.divided-kingdom.josias-reform
            statement: >-
              not before the reign of Abiam and prior to Josias's reform (621
              B.C.), the appendix at chapters xxi-xxiv possibly being due to a
              somewhat later hand
          label: "prior to Josias's reform (621 B.C.)"
  # === lane psalter-policy ===
  - id: composition.psalm-73
    title: Psalm 73, "Ut quid, Deus, repulisti in finem?" (Hebrew 74)
    scope: {book: Ps, chapter: 73}
    note: >-
      One of the twelve psalms the titles ascribe to Asaph, and one of only two
      psalms in the whole Psalter whose writing Drum's "Psalms" dates at all.
      The article numbers in Hebrew and brackets the Vulgate - "In the course of
      this article, we shall follow the Hebrew numeration and bracket that of
      the Septuagint and Vulgate" - so its "Ps. lxxiv (lxxiii)" is authored here
      at the vulgate Ps.73 that scripts/_psalms.py reaches from Hebrew 74.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: unreviewed
        basis: >-
          Drum's "Psalms" in the Catholic Encyclopedia (vol. 12, 1911), treating
          the Asaph psalms, states: "Ps. lxxiv (lxxiii) was probably written, as
          Briggs surmises, during the Babylonian Exile, after 586 B.C." The same
          paragraph refuses any single date for the group, saying the Asaph
          psalms "are all national in character and pertain to widely-separated
          periods of Jewish history".
        sources: [artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25]
        note: >-
          The article's own hedge is "probably written, as Briggs surmises", and
          it is kept. The claim is a lower bound and a period, not a year: the
          article prints no year for the end of the Exile, so this is recorded
          as the relative statement it is rather than given an invented upper
          endpoint. 586 B.C. is one of three figures this corpus already holds
          for the destruction of Jerusalem, which is why the anchor is that
          event and not a bare year.
        date:
          precision: relative
          relative:
            of: israel.exile.third-captivity
            statement: >-
              during the Babylonian Exile, after 586 B.C.
          label: "probably written during the Babylonian Exile, after 586 B.C."

  - id: composition.psalm-82
    title: Psalm 82, "Deus, quis similis erit tibi?" (Hebrew 83)
    scope: {book: Ps, chapter: 82}
    note: >-
      The second of the two psalms whose writing Drum's "Psalms" dates. The
      article's "Ps. lxxxiii (lxxxii)" is Hebrew 83, which scripts/_psalms.py
      reaches at the vulgate Ps.82 authored here. The article dates it against
      Briggs rather than with him, which is why the disagreement it reports is
      named in the basis and not silently dropped.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: unreviewed
        basis: >-
          Drum's "Psalms" in the Catholic Encyclopedia (vol. 12, 1911) states:
          "Ps. lxxxiii (lxxxii), although assigned by Briggs ("Psalms", New
          York, 1906, p. lxvii) to the early Persian period, seems to have been
          written at the time of the havoc wrought by the Assyrian invasion of
          Tiglath-pileser III in 737 B.C."
        sources: [artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25]
        note: >-
          "Seems to have been written" is the article's own hedge and is kept.
          737 B.C. is the year the article prints for the Assyrian invasion, not
          a year it prints for the act of writing, so the claim is approximate
          and the label carries the article's whole sentence. Briggs's "early
          Persian period" is the opinion the article is rejecting, not a second
          traditional date, so it is reported here and not authored as an
          alternate.
        date:
          precision: approximate-year
          from: {year: 737, era: bc}
          label: "at the time of the havoc wrought by the Assyrian invasion of Tiglath-pileser III in 737 B.C."

  - id: composition.psalms-of-the-sons-of-korah
    title: The Psalms of the Sons of Korah
    scope:
      - {book: Ps, chapter: 41, through: 48}
      - {book: Ps, chapter: 83}
      - {book: Ps, chapter: 84}
      - {book: Ps, chapter: 86}
      - {book: Ps, chapter: 87}
    note: >-
      A group unit, not a book unit: the Psalter is an anthology and gets no
      single date. The extent is the article's own, printed in its own bracketed
      Vulgate numbers - "The Sons of Korah are named in the titles of eleven
      psalms - xlii-xlix, lxxxiv, lxxxv, lxxxvii, lxxxviii (xli-xlviii, lxxxiii,
      lxxxiv, lxxxvi, lxxxvii)". The article counts eleven while its own range
      spans twelve psalms, because vulgate Ps.42 (Hebrew 43) is one of the
      "orphan psalms" that carry no title and is elsewhere in the same article
      said to be "broken from" the psalm before it. The range is authored as the
      article printed it and the discrepancy is recorded rather than resolved.
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Drum's "Psalms" in the Catholic Encyclopedia (vol. 12, 1911), of the
          psalms titled "of the sons of Korah": "From their Messianic ideas and
          historical allusions, these psalms seem to have been composed between
          the days of Isaias and the return from exile." The same paragraph says
          of their authorship only that "each was rather composed by some member
          of the guild of Korah; or, perhaps, all were gathered from the various
          sources into one liturgical hymnal by the guild of the sons of Korah."
        sources: [artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25]
        note: >-
          The article prints no year of any era for these psalms, so nothing
          here is a year. It bounds them by two termini and this corpus holds
          only one anchor per relative claim, so the anchor is the later
          terminus, the return from exile, and the article's whole sentence is
          carried in the statement. The corpus's own date for that return is
          itself disputed between 538 and 536 B.C., which is a further reason
          not to convert this bound into numbers. The article is not saying the
          sons of Korah wrote them; it leaves composition by a member of the
          guild and mere collection by the guild open side by side.
        date:
          precision: relative
          relative:
            of: israel.restoration.decree-of-cyrus
            statement: >-
              between the days of Isaias and the return from exile
          label: "between the days of Isaias and the return from exile"
  # === lane tail ===
  - id: composition.book-of-micheas.chapters-4-5
    title: The Prophecy of Micheas, chapters 4-5
    scope: {book: Mich, chapter: 4, through: 5}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Van Hoonacker's "Book of Micheas" in the Catholic Encyclopedia dates the
          second part of the book apart from the first and in the same breath:
          "The difference of tone and contents clearly show that 4-5 must have
          been composed in other circumstances than 1-3. They probably date from
          shortly after the fall of Samaria in 722 B.C."
        sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10278a-734c8637]
        note: >-
          The hedge "probably" is the article's own and is kept. The year 722 is
          not a date of writing but the anchor the article writes these chapters
          against: chapters 1-3 it places shortly BEFORE the fall of Samaria and
          these shortly AFTER it, which is why the two units carry the same
          numeral and are not the same claim. The occasion the article assigns is
          not a date and is recorded only in its own words: "Chapters 4-5 have
          preserved us an echo of the joy caused in Jerusalem by the removal of
          the danger." It rejects the rival dating without proposing another:
          "Several recent critics have maintained that chapters 4-5, either
          wholly or in part, are of post-exilic origin. But their arguments,
          principally based on considerations inspired by certain theories on the
          history of the Messianic doctrine, are not convincing." It allows two
          passages to be later than the rest and dates neither - "The connexion of
          ideas, it is true, is interrupted in 4:10, and in 5:4-5 (Vulgate 5-6),
          both of which may be later additions" - so no narrower unit is authored
          inside this scope. SOURCE RECORD: the article was re-fetched and read in
          full for this lane, and New Advent's page furniture had changed since
          the earlier retrieval, so the bytes hash differently from the record the
          chapters-1-3 unit cites; the artifact named here is the retrieval
          actually read, and every sentence the sibling unit quotes stands
          verbatim in it.
        date:
