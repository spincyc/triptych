  - id: composition.apocalypse
    title: The Apocalypse of St John
    scope: {book: Apoc}
    note: >-
      Van den Biesen's article records the tradition and at once records what
      stands against it — "Tradition assigns the Apocalypse to the reign of
      Domitian. But according to the computation given above, the Seer himself
      assigns his work to the reign of Vespasian" — and a second Catholic
      Encyclopedia article dates the Johannine writings differently, so neither
      claim is preferred.
    dates:
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Van den Biesen's article "Apocalypse" in the Catholic Encyclopedia
          (vol. 1, 1907) states that "Tradition assigns the Apocalypse to the
          reign of Domitian", following Irenaeus, who "places the Seer's exile
          in Patmos at the end of Domitian's reign", and prints the reign
          itself as "The Emperor Domitian reigned A.D. 81-96."
        sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01594b-7f47696f]
        note: >-
          The endpoints are the article's own years for Domitian's reign, which
          is the widest window its testimony supports; the sharper pegs it
          reports are regnal and are not converted here — Eusebius "adds as the
          year of the Seer's exile the fourteenth of Domitian's reign", and
          Jerome follows "the same tradition". The dated occasion is the exile
          to Patmos, which the article treats as the occasion of the book.
          Epiphanius's rival placing of the banishment "in the reign of
          Claudius, A.D. 41-54" the article calls "exceedingly improbable", and
          it is not authored here.
        date:
          precision: interval
          from: {year: 81, era: ad}
          to: {year: 96, era: ad}
          label: "the reign of Domitian ... A.D. 81-96"
      - profile: catholic-traditional-v1
        disposition: disputed
        basis: >-
          Durand's article "The New Testament" in the Catholic Encyclopedia
          (vol. 14, 1912) includes the Apocalypse in the Johannine corpus it
          dates "from the year 90 to 100 (approximately)", adding the
          qualification "except perhaps the Apocalypse, which some modern
          critics date from about the end of the reign of Nero, A.D. 68".
        sources: [artifact.catholic-encyclopedia.volume-14.new-york-1912.newadvent-14530a-0a19aa2c]
        note: >-
          The A.D. 68 exception is attributed by the article to "some modern
          critics" and is not authored here; this profile does not treat modern
          critical chronology as an authority.
        date:
          precision: interval
          from: {year: 90, era: ad}
          to: {year: 100, era: ad}
          label: "from the year 90 to 100 (approximately)"

  # --- ot-composition ----------------------------------------------------
  - id: composition.third-book-of-kings
    title: The Third Book of Kings
    scope: {book: 3Kings}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis: >-
          Schets's "Third and Fourth Books of Kings" in the Catholic Encyclopedia
          states that "The Books of Kings were not completed in their present form
          before the middle of the Exile," and that on the Talmudic attribution to
          Jeremias, "If Jeremias be indeed the author, it must be accepted as
          probable that he wrote the book not long before, or shortly after, the
          fall of Jerusalem (587 B.C. )". The 587 figure is the only year the
          article attaches to the writing.
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08652a-189e1a8f]
        note: >-
          The year is CONDITIONAL in the source on Jeremias being the author, which
          the article reports as an opinion ("Not a few among both older and more
          recent exegetes consider this probable"), not as settled. The article's own
          unconditional statement carries no year: the books "were not completed in
          their present form before the middle of the Exile." It adds that "the last
          verses (xxv, 27-30) have possibly been added by a different hand"; the 562
          date in the same passage belongs to Joachim's release from bondage, not to
          the writing.
        date:
          precision: approximate-year
          from: {year: 587, era: bc}
          label: "not long before, or shortly after, the fall of Jerusalem (587 B.C.)"

