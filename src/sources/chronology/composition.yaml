  - id: composition.third-book-of-kings
    title: The Third Book of Kings
    scope: {book: 3Kings}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Schets's "Third and Fourth Books of Kings" in the Catholic Encyclopedia
          states, without condition and in its own voice, that "The Books of Kings
          were not completed in their present form before the middle of the
          Exile," and grounds it on the book's own closing notice, that "2 Kings
          25:27-30 , relates that Joachim was released from bondage (562)".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08652a-189e1a8f]
        note: >-
          Displayed first although both claims on this unit rest on the same rank-6
          article; this note is what SS4.4 requires in place of a rank difference.
          This is the ONLY statement the article makes about the writing that
          carries no condition. The 587 B.C. sibling holds only "If Jeremias be
          indeed the author", an attribution the article reports from the Babylonian
          Talmud and from exegetes who "consider this probable", and does not settle.
          No year is put on "the middle of the Exile" and none is supplied here: the
          562 the article prints belongs to Joachim's release from bondage, is quoted
          as the article's ground, and is not converted into an endpoint. The anchor
          is the seventy years of servitude to Babylon, which is the period the
          article calls the Exile; nothing computes from a relative date.
        date:
          precision: relative
          relative:
            of: israel.exile.seventy-years
            statement: >-
              not completed in their present form before the middle of the Exile
          label: "not completed in their present form before the middle of the Exile"
      - profile: catholic-traditional-v1
        disposition: alternate
        basis_class: traditional-catholic
        basis: >-
          The same article adds, on the Talmudic attribution to Jeremias, that "If
          Jeremias be indeed the author, it must be accepted as probable that he
          wrote the book not long before, or shortly after, the fall of Jerusalem
          (587 B.C. )".
        sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08652a-189e1a8f]
        note: >-
          NO LONGER PREFERRED. The year is CONDITIONAL in the source on Jeremias
          being the author, which the article reports as an opinion ("Not a few
          among both older and more recent exegetes consider this probable") rather
          than settles; an assertion the article makes only inside a condition it
          does not settle is not the article's unconditional answer, and does not
          hold the profile's first slot. SS15.1(3) is the near case rather than
          the rule itself - the two Esdras units were withdrawn for a year
          standing in a third party's voice. It is kept as an alternate rather
          than withdrawn because the year is Schets's own consequence and not a
          third party's figure. It also stands EARLIER than the article's own
          unconditional floor - the books were "not completed in their present form
