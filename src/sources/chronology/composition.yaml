        sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01594b-7f47696f]
        note: >-
          The endpoints are the article's own years for Domitian's reign, which
          is the widest window its testimony supports; the sharper pegs it
          reports are regnal and are not converted here — Eusebius "adds as the
          year of the Seer's exile the fourteenth of Domitian's reign", and
