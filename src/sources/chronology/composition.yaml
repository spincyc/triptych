  - id: composition.second-epistle-to-timothy
    title: The Second Epistle to Timothy
    scope: {book: 2Tim}
    dates:
      - profile: catholic-traditional-v1
        disposition: preferred
        basis_class: traditional-catholic
        basis: >-
          Prat's article "St. Paul" in the Catholic Encyclopedia (vol. 11,
          1911) puts the Second Epistle to Timothy at the end of its
          chronology of the Apostle's life: "(2 Timothy), martyrdom, 67".
        sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11567b-bff0dda8]
        note: >-
          A reconstruction: the encyclopedia's article on the Epistles to
          Timothy and Titus prints no composition year. Jerome, De viris
          illustribus 5, independently places the letter on the eve of Paul's
