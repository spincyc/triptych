  - status: undated-in-tradition
    scope: [{book: Mich, chapter: 6, through: 7}]
    reason: >-
      Van Hoonacker's "Book of Micheas" in the Catholic Encyclopedia dates the
      book's first two parts and refuses the third. Of chapters 1-3 it says they
      "must have been composed shortly before the destruction of the Kingdom of
      Samaria by the Assyrians (722 B.C.)"; of chapters 4-5, that they "probably
      date from shortly after the fall of Samaria in 722 B.C."; of chapters 6-7
      it says only "The opinions of critics are much divided on the composition
      of these chapters." What it then settles is authorship and not time: "it
      seems unnecessary to deny to the Prophet Micheas the authorship of these
      two chapters." Its only temporal remark about them is relative and names no
      year - on its own hypothesis the prophet "casts a retrospective look at the
      causes which brought about the fall of Samaria" - and its defence is framed
      as a compatibility, "there is nothing which does not exactly tally with the
      circumstances of Micheas's time", not as a date of writing. The reigns the
      article prints for the ministry, "Joathan (c. 740-735 B. C.), Achaz
      (735-727?), and Ezechias (727-698?)", date kings, and the same article
      warns that "We do not, however, appear to possess any of his addresses
      prior to the reign of Ezechias"; neither sentence may be read as the date
      of these chapters. No other source inspected for this corpus dates them.
    sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10278a-734c8637]
  - status: undated-in-tradition
    scope: [{book: Nah, chapter: 1}]
    reason: >-
      Souvay's "Nahum" in the Catholic Encyclopedia dates the book's second part
      and leaves the first without a year of any kind. Its dating argument is
      expressly bounded and expressly partial: "The date of this second part
      cannot be determined to the year", and the limits it then fixes - Thebes
      "captured and destroyed by Assurbanipal in 664-663 B.C." and the fall of
      Ninive "at 607 or 606 B.C." - are given for "this part of the book of
      Nahum". When the article turns back - "We may now return to the first part
      of the book. This first chapter, on account of the transcendent ideas it
      deals with, and of the lyric enthusiasm which pervades it throughout has
      not inappropriately been called a psalm" - it discusses only the chapter's
      alphabetical form and whether it is Nahum's at all, and prints no date. It
      reports the argument for a late one without adopting it: "This explanation
      of the textual condition of the poem implies the assumption that this
      chapter is not to be attributed to Nahum, but is a later addition ... the
      artificiality of the acrostic form is characteristic of a late date. These
      arguments, however, are not unanswerable. In any case it cannot be denied
      that the psalm is a most fitting preface to the prophecy." The chapter is
      thus left undated in both directions: the 664-606 envelope is not extended
      to it, and the "late date" the acrostic argument would imply is neither
      accepted nor numbered. The scholars the article lists for the poem's
      reconstruction - Frohnmeyer, Bickell, Gunkel, Nowack, Gray, Arnold, Happel,
      Marti, Lohr, Van Hoonacker - are cited on the text, not on its date, and
      several are outside this profile in any case. This row stops at the end of
      chapter 1 although the article's own first part runs one verse further
      (Douay 2:2), because that verse is covered by the composition unit for
      chapters 2-3 and a gap may not be laid over a verse that carries an
      assertion. No other source inspected for this corpus dates the chapter.
    sources: [artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10670a-83d20cfa]
  - status: undated-in-tradition
    scope: [{book: Jdt}]
    reason: >-
      The Catholic Encyclopedia's "Book of Judith" (Hugh Pope, vol. 8, 1910,
      newadvent.org/cathen/08554a.htm) was read in full for this corpus and
      has no section on authorship or on the date of composition at all: its
      headings are History, The text, Historicity and Canonicity. Its
      conservative position - that "the book is perfectly historical and deals
      with facts which actually took place" - is a claim about historicity and
      not about when the book was written, and the only dating language on the
      page belongs to the view it attributes to "Some few Catholic writers",
      that the story "was committed to writing at a period long subsequent to
      the facts." No year is stated for the writing, and none for the events
      the book narrates. The one pair of numerals on the page that could be
      mistaken for either, "Artaxerxes the Great (464-424 B.C.)", dates a
      Persian king's reign inside that same reported opinion, which infers from
      the high priest Joachim that he "must therefore have lived" in it; the
      rival conservative identification the article reports, Vigouroux's
      referring of the events to "the time of the captivity of Manasses under
      Assur-bani-pal", carries no numerals at all. The article adopts neither.
    sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08554a-689b854e]
  # === lane esdras ===
  - status: undated-in-tradition
    scope: [{book: 1Esd}]
    reason: >-
      No source inspected for this corpus dates the writing of the First Book
      of Esdras on any authority this profile consults, and this row replaces
      a composition unit that was withdrawn for that reason. Souvay's "Esdras"
      (Catholic Encyclopedia, vol. 5, New York, 1909) treats the question and
      prints no year in its own voice or on Catholic authority. Of authorship
      it reports: "The composition of the work has long been attributed
      without discussion to Esdras himself. This view, taught by the Talmud,
      and still admitted by scholars of good standing, is, however, abandoned
      by several modern Biblical students, who, although their opinions are
      widely at variance on the question of the date, fairly agree,
      nevertheless, that the book is later than 330 B.C." The traditional half
      of that sentence names an author and no time; its one figure, 330 B.C.,
      is reported of "several modern Biblical students" and is modern critical
      chronology, which guidance/scripture-chronology.md 4.3 excludes from this
      profile. The same article's account of how the book was made is undated
      throughout: "I Esd. is a compilation the various parts of which differ in
      nature, in origin, and even in language. At least three of the parts may
      be recognized: the personal memoirs of Esdras (vii, 27-ix, 15); lists
      very likely taken from public documents (ii, 1-70; vii, 1-5); Aramaic
      writings (iv, 7-vi, 18; vii, 12-26), supposed with some probability to be
      a portion of ..." - the source completing the sentence with Stade's
      phrase, "a more comprehensive history of the restored community". Not one
      of those three parts, and not the compiler's own work upon them, is given
      a date. Van Hoonacker's "Book of Nehemiah" (vol. 10, New York, 1911),
      which treats the two books as one compilation, prints the only year
      either article carries for the writing, and prints it inside a clause
      attributed to others: the documents of which the books are composed
      "underwent compilation and redaction together at the hands probably, as
      most critics think, of the author of Paralipomenon about B.C. 300." That
      is a report of what most critics think. It is the same kind of sentence
      as the "Most modern non-Catholic scholars ... place its date between 300
      and 250 B.C." that composition.first-book-of-paralipomenon quarantines,
      and it makes none of the distinction that unit's accepted clause makes
      when it says "most Catholic authors". No unit is authored from it.
      Souvay's "twenty-one years (536-515)" dates the events the first part of
      the book narrates and is held on
      israel.restoration.return-and-temple-rebuilding; it is a date of what is
      told, not of the telling, and must not be borrowed to fill this. The row
      is book-scoped, so an assertion always beats it and it contradicts none
      of the narrated events bound across the book; what it answers is the
      composition question, which is the thing the corpus has nothing for.
    sources:
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067
  - status: undated-in-tradition
    scope: [{book: 2Esd}]
    reason: >-
      The same silence, on the same two articles, and this row likewise
      replaces a withdrawn composition unit. Souvay's "Esdras" does not treat
      this book at all: its whole section on it reads "II Esdras - See the Book
      of Nehemiah." Van Hoonacker's "Book of Nehemiah" (Catholic Encyclopedia,
      vol. 10, New York, 1911) is therefore the article of record, and the one
      year it prints for the writing stands inside a clause it attributes to
      others: the documents of which the two books are composed "underwent
      compilation and redaction together at the hands probably, as most critics
      think, of the author of Paralipomenon about B.C. 300." A date reported of
      "most critics" is modern critical chronology, which
      guidance/scripture-chronology.md 4.3 excludes from this profile, and it
      is not made Catholic authority by the article's reporting it; the
      neighbouring "most Catholic authors" that
      composition.first-book-of-paralipomenon does accept shows the encyclopedia
      making the distinction where it means it. What the article says in its own
      voice about the making of this book names authors and a redactor and no
      time at all: the book "is made up, at least in the great part, from the
      authentic memoirs of the principal figure"; chapters 1-6 comprise "the
      account, written by Nehemiah himself, of the restoration of the walls of
      Jerusalem"; and of section II's dependence on I Esdras it says only that
      it "is probably due to the redactor, who in this place gave a new form to
      the notes supplied him by the Jewish governor's memoirs which also
      explains the latter's being spoken of in the third person, Neh., viii,
      9." The regnal and era years the article does print - the twentieth year
      of Artaxerxes, "B. C. 433" for the return to Susa, "B. C. 398" for
      Esdras's return - date events the book narrates and are held on the
      restoration events; none of them dates the book. The row is book-scoped
      and an assertion always beats it, so it neither contradicts nor displaces
      those events; it records that the composition of this book is undated in
      the tradition inspected here. One stretch of the book does resolve to it
      outright, and only because nothing else in the corpus reaches those
      verses: 2 Esdras 12:1-26, the list of priests and Levites, which the same
      article sets aside in so many words -- "The list in xii, 1-26, has no
      connexion whatever with the events of this epoch." No event is bound
      across it for that reason, and with no composition unit over the book it
      now stands under this row, which is the honest answer for it.
    sources:
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10737c-8f80f067
      - artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05535a-50771778
  # === lane ezechiel ===
  - status: undated-in-tradition
    scope: [{book: Ezech}]
    reason: >-
      This row is about the COMPOSITION of Ezechiel and about the chapters no
      dateline in the book reaches. It is not about the dated oracles: it is
      book-scoped and therefore names no chapter, an assertion always beats a
      gap, and every verse of Ezechiel already carries the two book-wide
      bindings, so nothing here contradicts the fourteen datelines Scripture
      states to the day. It exists because no composition unit is authored for
      this book and, without it, the corpus would record that silence nowhere,
      though it records it for every other book it has inspected. Schets's
      "Ezekiel" (Catholic Encyclopedia, vol. 5, New York, 1909) was read in
      full. It dates the prophet and never the book: "in the year 598 B.C." for
      the deportation he was carried off in, "In the fifth year after the
      captivity of Joachim ... Ezekiel received his call as a prophet", and
      "From Ezek. xxix, 17 it appears that he prophesied during at least
      twenty-two years." A ministry is not a writing, and the article nowhere
      says when the prophecies were set down, by whom they were collected, or
      whether the collecting was the prophet's own act. Where it does treat the
      book as a book it settles authenticity and not date: "The genuineness of
      the book of Ezekiel is generally conceded. Some few consider chapters
      xl-xlviii to be apocryphal, because the plan there described in the
      building of the temple was not followed, but they overlook the fact that
      Ezekiel here gives a symbolic representation of the temple, that was to
      find spiritual realization in God's new kingdom." That defends the last
      nine chapters and gives them no more of a date than it gives the rest.
      The nearest thing to a time anywhere on the page belongs to the copyists
      and is unnumbered: "a number of copyist mistakes have crept into the text,
      and that at an early date, since the Septuagint has some of them in common
      with the earliest Hebrew text we have." No year, century or era is printed
      for the writing in that sentence or in any other. The second silence this
      row covers is the stretches the datelines do not reach - Ezech. 12-19, 25,
      30:1-19 and 33:1-20 - which carry no date of their own; the two book-wide
      bindings reach them with the occasion and the span of the ministry and
      with no day, and no source inspected here dates them more nearly. The
      dateline of a neighbouring section must not be borrowed to fill either
      silence.
    sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05737b-06e3e070]
