  # === lane numbers ===
  - status: undated-in-tradition
    scope: [{book: Num}]
    reason: >-
      Two silences, and this row is honest about which of them it actually
      catches. The first is composition, and it runs the whole book: no source
      inspected for this corpus dates the writing of Numbers. The Catholic
      Encyclopedia has no article on the book at all - its full index for N
      carries only "Numbers, Use of, in the Church" (11151a), and the
      neighbouring article numbers are unassigned - so the question is treated
      only inside "Pentateuch", which states an author and no time: it reports
      the Biblical Commission's reply that the critics' arguments do not give
      the right "to maintain that these books have not Moses as their author",
      and attaches no year, century or expressible period to the act of
      writing. Its section on Numbers dates the narrative instead - the book
      "takes up the account from the first month of the second year, and brings
      it down to the eleventh month of the fortieth year" - which is a
      statement about what is told, not about when it was told. On Numbers
      33:1-2 the same article says only "Here we are informed that Moses wrote
      the list of the people's encampments in the desert", again an author with
      no time. The nearest thing to a period anywhere is the "Moses" article's
      "It is during this period that tradition places the composition of a
      large part of the Pentateuch", said of the thirty-eight years in the
      Badiet et-Tih; it names no year, no era and no book, and "a large part of
      the Pentateuch" cannot be scoped to Numbers, so it is not carried as a
      date. The second silence is narrower and is what a verse actually
      resolves to this row for. The book was swept end to end for its own
      datelines, and every one of them is authored: 1:1, 7:1, 9:1-5, 10:11,
      20:1, 33:3 and 33:38, with the encampments at Sinai and in the plains of
      Moab bounding the sections that stand under them. One passage outside
      those datelines is nevertheless reached, and is named here so that this
      row is not read as covering it: Numbers 14:33-34, the sentence of the
      forty years as the Lord pronounces it at the return of the spies, is
      bound as prophecy-given to the forty years in the desert, which is the
      event dated from those very words. What is left over is Numbers 11, 13,
      14:1-32, 14:35-45, 15-19 and 21 - the murmuring and the quails, the spies
      and the consternation, the doom on the fathers and the death of the
      spies, the laws of the offerings, Core's rebellion, Aaron's rod, the
      priestly dues, the red heifer, Arad, the brazen serpent, Sehon and Og
      - and nothing dates them. Scripture gives them no dateline; the Catholic
      Encyclopedia's "Aaron" accounts for the largest part of the silence
      rather than filling it, saying that "Of the next thirty-seven years of
      Aaron's life, the Bible gives no detail; its narrative is concerned only
      with the first three and the last years of the wandering life of the
      Hebrews in the desert"; its "Balaam", read in full, prints no date of any
      kind; and its "Biblical Chronology" dates nothing in Numbers, opening
      instead with Silvester de Sacy's "There is no Chronology of the Bible"
      and granting that "for large parts of the Bible there is little to guide
      us to an exact determination as to when the events related happened."
      Where a verse of Numbers carries a dated assertion the corpus answers
      with it and this row is not reached; where it does not, this row is the
      answer, and it must not be read as licence to borrow the dateline of a
      neighbouring section.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11646c-b7ab7001
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10596a-59d1207b
      - artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01003a-5adaeca0
      - artifact.catholic-encyclopedia.volume-2.new-york-1907.newadvent-02214b-53ac6d68
      - artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04
  # === lane psalter-policy ===
  - status: undated-in-tradition
    scope: [{book: Ps}]
    reason: >-
      Drum's "Psalms" in the Catholic Encyclopedia was read in full for this
      corpus and dates the writing of no psalm except three cases authored
      separately in composition.yaml: Ps.73 and Ps.82 in this vulgate numbering,
      and the psalms of the sons of Korah as a group. Everywhere else it settles
      authorship and refuses date. Of David, its strongest sentence is the
      Biblical Commission's of 1 May 1910, that "It cannot be prudently denied
      that David is the chief author of the songs of the Psalter" - an author,
      not a year, a reign or a period, and the same decree adds that neither the
      councils nor the Fathers "have such weight as to determine that David is
      sole author of the whole Psalter". Of the Asaph psalms it says they
      "pertain to widely-separated periods of Jewish history"; of Moses and
      Solomon in the titles it offers imitation rather than date, "this
      imitation may be the reason of the title"; of the Machabean question it
      says "There are no certain proofs that these or any psalms are Machabean"
      and "leaves that question still open". The historical superscriptions are
      occasions and not compositions: thirteen Davidic psalms are merely
      "referred to the time of David's persecution by Saul", to his sin, or to
      his flight from Absalom, and the article expressly denies that the titles
      settle even authorship - "Does this preposition mean authorship? No in
      every title" - so none of them may be promoted to a date. The one dated
      thing the article does offer about the collection is the closing of the
      canon, not the writing of the text: the Palestinian canon "was practically
      closed during the time of Esdras", and at the latest the Jewish canon of
      the Psalms "was undoubtedly closed before the date of the Septuagint
      translation. This date is 285 B.C. ... or, at the very latest 132 B.C." A
      canon closing is not a text being written, and this corpus will not borrow
      it. The Psalter is an anthology and is given no book-wide composition date
      here; psalms that carry a superscription-setting, a historical setting or
      a prophetic referent are asserted individually and those assertions stand
      over this row.
    sources: [artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12533a-cb9d9a25]
