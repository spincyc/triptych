# Where the corpus knowingly says nothing dated, and why. Only the statuses an
# author may assert appear here: undated-in-tradition, not-alignable,
# textually-distinct. A locus reached by none of them and by no assertion is
# research-pending, which is the honest default and is not authored.
schema: triptych-chronology-gaps/v1
# Every locus below is numbered in the vulgate system, the one
# scripts/_projection.py projects into. Declared here so that no row's
# numbering is a thing the reader assumed.
numbering: vulgate
updated: '2026-08-26'

gaps:
  # === type-the-gaps ===================================================
  - status: undated-in-tradition
    scope: [{book: Lev}]
    reason: >-
      The received Catholic apparatus dates the writing of Leviticus nowhere.
      The Catholic Encyclopedia has no article on the book - "Leviticus"
      (09207a) is a stub that refers the introductory questions to
      "Pentateuch" - and the "Pentateuch" article, which is where the question
      is actually treated, states authorship and no time: it reports the
      Biblical Commission's reply of 27 June 1906 that the critics' arguments
      do not give the right "to maintain that these books have not Moses as
      their author", and attaches no year, century or expressible period to
      the act of writing. Moses is an author, not a date. The Anno Mundi and
      A.C. figures the Haydock edition prints in Exodus date narrated events
      and must not be borrowed to fill this. Genesis, Exodus, Numbers and
      Deuteronomy stand under the same silence about composition, but they
      carry narrated events that are separately dated, so only Leviticus is
      recorded here.
    sources: [artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11646c-b7ab7001]
  - status: undated-in-tradition
    scope: [{book: Ruth}]
    reason: >-
      The Catholic Encyclopedia's "Book of Ruth" opens its section on the
      question by refusing it: "The name of the author of the book of Ruth is
      unknown, and so is also the precise date of its composition." It offers
      only the unnumbered bound "most likely written before the Babylonian
      exile", and says the internal data "remain indecisive with regard to the
      precise date to which its composition should be referred, as clearly
      appears from the conflicting inferences which have been drawn from them
      by recent Catholic scholars." No year of any era is printed for the book
      or for anything in it, and no other ranked source inspected for this
      corpus supplies one.
    sources: [artifact.catholic-encyclopedia.volume-13.new-york-1912.newadvent-13276a-df1b3002]
  - status: undated-in-tradition
    scope: [{book: Job}]
    reason: >-
      The Catholic Encyclopedia's "Job" states the refusal outright: "The
      author of the book is unknown, neither can the period in which it was
      written be exactly determined." What it then offers is bounded by
      reigns and not by years - not earlier than the reign of Solomon, earlier
      than Ezechiel - and of the Solomonic dating many Catholic investigators
      hold it says "The proofs, however, are not very convincing." The book's
      own patriarchal setting is dated by no source inspected for this corpus
      either. Nothing here is a year, and nothing here should be made into one.
    sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08413a-56b4c047]
  - status: undated-in-tradition
    scope: [{book: Prov}]
    reason: >-
      The Catholic Encyclopedia's "Book of Proverbs" ascribes the principal
      collections to Solomon and dates nothing: Catholic writers are "wellnigh
      unanimous in ascribing them to Solomon", yet the article leaves the
      book's assembly open "at whatever time - either under Ezechias, or as
      late as Esdras - all the collections embodied in the Book of Proverbs
      reached their present form and arrangement." The ascription is also
      expressly partial, most Catholic scholars being free to treat the Agur,
      Lamuel and "the wise" collections as non-Solomonic, so it could not be
      carried across the whole book even if it carried a date. It carries none.
    sources: [artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12505b-04e7ea59]
  - status: undated-in-tradition
    scope: [{book: Eccles}]
    reason: >-
      The Catholic Encyclopedia's "Ecclesiastes" defends the tradition of
      Solomonic authorship - "we must listen to the voice of tradition, which
      has always attributed Ecclesiastes to him" - and prints no year. Its one
      temporal sentence is conditional and relative: "If Solomon wrote
      Ecclesiastes towards the end of his life, the sombre tone of the book is
      easily explained." The same article allows a later editorial layer ("It
      is possible that Ecclesiastes was received into the canon in some such
      later edition"), so tradition here settles an author and declines a date.
    sources: [artifact.catholic-encyclopedia.volume-5.new-york-1909.newadvent-05244b-2fe7b66b]
  - status: undated-in-tradition
    scope: [{book: Cant}]
    reason: >-
      The Catholic Encyclopedia's "Canticle of Canticles" reports that
      "Tradition, in harmony with the superscription, attributes the song to
      Solomon" and prints no year for it. The nearest thing to a period on the
      page is not the encyclopedia's own voice but its quotation of De Wette,
      "The entire series of pictures and relationships and the freshness of
      the life connect these songs with the age of Solomon"; and of the rival
      post-exilic proposals the article says only "for all this there is a
      lack of clear proof." An author and an ascribed age, with no date in
      either.
    sources: [artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03302a-0e74e2ad]
  - status: undated-in-tradition
    scope: [{book: Lam}]
    reason: >-
      The Catholic Encyclopedia has no article on the Lamentations; they are
      treated inside "Jeremias", which gives them an author and an occasion
      and no year. What it reports is the Septuagint superscription - "after
      Israel was carried into captivity, and Jerusalem was desolate, that
      Jeremias the prophet sat weeping" - and it is careful that this
      inscription "was not written by the author of Lamentations", so it is
      evidence of a setting and not a date of writing. The book itself carries
      no chronological statement, and no source inspected for this corpus
      dates any part of it.
    sources: [artifact.catholic-encyclopedia.volume-8.new-york-1910.newadvent-08334a-dd4ae528]
  - status: undated-in-tradition
    scope: [{book: Bar}]
    reason: >-
      The Catholic Encyclopedia's "Baruch" accepts the book's own statement
      that it "was written by Baruch at Babylon in the fifth year after
      Jerusalem had been burned by the Chaldeans", and then declines to turn
      that into a year. The article prints 599 B.C. for the plundering of the
      temple and 588 B.C. for the fall of the Holy City elsewhere on the same
      page and never computes the fifth year from either, so no B.C. figure
      for this book stands in any source inspected for this corpus. Chapter 6,
      the Epistle of Jeremias, which the article says is "truly distinct from
      the rest of the work", is given no date of its own either.
    sources: [artifact.catholic-encyclopedia.volume-2.new-york-1907.newadvent-02319c-ccd7f7e3]
  - status: undated-in-tradition
    scope: [{book: Amos}]
    reason: >-
      The Catholic Encyclopedia's "Amos" upholds the traditional ascription -
      "all scholars maintain the correctness of the traditional view which
      refers the book of Amos to the Judean prophet of that name" - and gives
      the writing no year, saying only that the prophet withdrew to Juda
      "where at leisure he arranged his oracles in their well-planned
      disposition." Nor does it date the ministry: "Amos's mission to Israel
      was but a temporary one. It extended apparently from two years before to
      a few years after an earthquake, the exact date of which is unknown."
      The one pair of numerals on the page, "Jeroboam II (c. 781-741 B.C.)",
      dates a king's reign and must never be read as the date of the book.
    sources: [artifact.catholic-encyclopedia.volume-1.new-york-1907.newadvent-01435a-42725cc2]
  # === lane deuteronomy ===
  - status: undated-in-tradition
    scope: [{book: Deut}]
    reason: >-
      The received Catholic apparatus dates the writing of Deuteronomy nowhere.
      The Catholic Encyclopedia's "Deuteronomy" (04761b) is a stub that treats
      only the meaning of the title and then refers the question away: "The
      introductory questions concerning the Book of Deuteronomy are treated in
      the article PENTATEUCH." The "Pentateuch" article, where the question is
      actually treated, settles authorship and attaches no time to the writing:
      it reports the Biblical Commission's reply of 27 June 1906 that the
      critics' arguments do not give the right "to maintain that these books
      have not Moses as their author, but are compiled from sources for the
      greatest part later than the Mosaic age", and prints no year, century or
      expressible period for the act of composition. Moses is an author, not a
      date. Deuteronomy 1:3 dates the speaking of the discourses and is bound
      as utterance; it is not a composition date and must not be read as one.
      Two further silences are kept rather than smoothed. First, chapter 34
      narrates Moses' own death, and the same article treats that as a distinct
      question, not as part of the book's Mosaic authorship: "The Pentateuch in
      its present form does not present itself as a complete literary
      production of Moses. It contains an account of Moses' death, it tells the
      story of his life in the third person and in an indirect form"; the
      Commission's fourth reply allows "post-Mosaic additions either appended
      by an inspired author or inserted into the text as glosses and
      explanations"; and the article reports as a strict reading of that decree
      that "With the exception of those portions that belong to the time after
      the death of Moses, and of certain accidental changes of the text due to
      transcribers, the whole of the Pentateuch is the work of Moses." Whatever
      chapter 34 is, then, no source inspected for this corpus says when it was
      written, and this row covers it with the rest. Second, the article
      reports datable redaction hypotheses without adopting them - of Vetter,
      that "he places the first redaction of the Pentateuch in the time of the
      erection of Solomon's temple, and its last redaction in the time of
      Esdras" - and those are one scholar's opinion about the Pentateuch,
      reported in a survey of several incompatible ones, not the encyclopedia's
      own claim about this book. The "Moses" article's remark that of the
      thirty-eight years in the desert "It is during this period that tradition
      places the composition of a large part of the Pentateuch" is likewise no
      date for Deuteronomy, whose own frame puts its discourses in the fortieth
      year. Nothing above is a year and nothing above is made into one. This
      row is a record of that silence rather than a live answer: every verse of
      Deuteronomy carries at least one dated event assertion, so no query
      reaches this status, and the Leviticus row's remark that Deuteronomy
      "stands under the same silence about composition" is now recorded where a
      reader of this book will find it.
    sources:
      - artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-04761b-babad506
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11646c-5333461d
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10596a-ae23faf9
  # === lane exodus ===
  - status: undated-in-tradition
    scope: [{book: Ex}]
    reason: >-
      Nothing inspected for this corpus dates the writing of Exodus. The
      Catholic Encyclopedia has no article on the book at all: its alphabetical
      index carries "Exodus" only as a cross-reference to "Pentateuch"
      (11646c), which is where the question is actually treated, and that
      article states an author and no time. What it settles is authorship - the
      Biblical Commission's reply of 27 June 1906 that the critics' arguments
      are "not of such weight as to give us the right ... to maintain that
      these books have not Moses as their author" - and it expressly leaves the
      manner of the writing open, allowing "the hypothesis of those can be
      admitted who believe that he entrusted the composition of the work itself
      ... to others". The years the article prints are other men's, not its
      own. Most of them belong to the critical hypotheses it is rebutting - 621
      B.C. for the law-book found in the temple, "about 444 B.C." for Esdras
      reading the Priestly Code, the fourth century B.C. for the Samaritans'
      acceptance - and the remaining ones are the redaction dates of a Catholic
      scholar reported as an opinion rather than adopted, Vetter, of whom the
      article says that "he places the first redaction of the Pentateuch in the
      time of the erection of Solomon's temple, and its last redaction in the
      time of Esdras", set down in a list of the incompatible ways Catholic
      scholars interpret the Biblical Commission's allowance of post-Mosaic
      additions. Neither kind is the encyclopedia's own date for the writing of
      Exodus, and neither is scoped to this book. Moses is an author, not a
      date. The two Exodus-specific articles read for this lane add nothing:
      "Plagues of Egypt" (12143a) opens by refusing even the interval of the
      events it treats - "The interval of time within which they occurred
      cannot be stated with certainty" - and "Moses" (10596a) says of the
      thirty-eight years in the Badiet et-Tih that "It is during this period
      that tradition places the composition of a large part of the Pentateuch",
      which names no year, no era and no book. The Pentateuch contains Exodus,
      so that sentence is not about another book; but "a large part of the
      Pentateuch" cannot be scoped to Exodus any more than it can to Numbers,
      where the same sentence is read the same way, and a period named only as
      "this period" is not a date. It is therefore not carried as one. The
      Anno Mundi and A. C. figures the Haydock edition prints on its four
      Exodus chronology pages - A. M. 2513 at Exodus 3, A. M. 2518 at Exodus 5,
      A. M. 2513 after Exodus 16:30, A. M. 2518 at Exodus 32 - date narrated
      events and are recorded on those events; they are not composition
      evidence and must never be borrowed to fill this. What this row catches
      is every verse of Exodus that carries no assertion at all, and as the
      corpus now stands that is none of them: all
      1211 verses of the book are reached by a narrated-event, utterance or
      retrospective-event binding, so the row asserts the inspected silence
      about composition without displacing anything. It becomes visible the
      moment any of those bindings is withdrawn, which is exactly when a reader
      needs to be told that the silence here was looked into rather than
      skipped.
    sources:
      - artifact.catholic-encyclopedia.volume-11.new-york-1911.newadvent-11646c-b7ab7001
      - artifact.catholic-encyclopedia.volume-12.new-york-1911.newadvent-12143a-0612afa4
      - artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10596a-59d1207b
  # === lane genesis ===
  - status: undated-in-tradition
    scope: [{book: Gen}]
    reason: >-
      The received Catholic apparatus dates the writing of Genesis nowhere. The
      Catholic Encyclopedia has no article on the book at all - the New Advent
      edition's index for G runs "Genealogy (in the Bible)", "Genealogy of
      Christ", "General Judgment", "Generation", "Genesius", "Genevieve, Saint",
      carrying nothing for the book at the place between "Generation" and
      "Genesius" where it would fall, and the encyclopedia's own articles across
      that stretch of the alphabet are "General Chapter" (06412b), "Generation"
      (06412c), "Genesareth" (06413a) and "Genesius" (06413c), the article
      number between the last two being unassigned - and the introductory
      questions are treated in "Pentateuch", which states an author and no time:
      it reports the Biblical Commission's reply of 27 June 1906 that the
      critics' arguments do not give the right "to maintain that these books
      have not Moses as their author", and attaches no year, century or
      expressible period to the act of writing. Moses is an author, not a date.
      The one place where a ranked source inspected for this corpus does print
      years for the making of the book of Genesis is the Catholic
      Encyclopedia's "Abraham", and it prints them expressly in another man's
      voice. The paragraph that carries them, under "Viewpoint of Old
      Testament", opens "Quite a different view on the section of Genesis
      treating of Abraham, and indeed of the whole of Genesis, is taken by
      modern critical scholars. They almost unanimously hold", and it stays in
      the third person to its end: the collections J and E "closed before the
      time of the prophets; J some time in the ninth century B.C., and E early
      in the eighth century", and of the later priestly writing, "according to
      the critics the moral standpoint is that of the fifth century B.C." The
      writer says what he thinks of the method further down the article, of a
      different question and under a different heading, "Viewpoint of legend":
      "In setting forth the critical view on the subject, I must not be taken as
      giving my own views also." A date the source refuses to assert is not a
      date this corpus may carry.
      This row is book-scoped and therefore reaches every verse of Genesis, but
      an assertion always beats it: what it actually catches is the verses where
      this corpus carries no assertion at all, which after this lane's work are
      Genesis 3:1-24, 4:1-24, 6:1-2, 6:4-12, 9:1-27, 11:1-9, 11:28-30, 13, 15:1-12,
      15:17-21, 19:30-38, 20, 21:9-34, 22, 25:27-34, 26:1-33, 27, 28, 32, 33, 34,
      35:1-26, 36, 38 and 39 - the Fall, Cain and Abel, the wickedness before the
      Flood, the covenant with Noe and the cursing of Chanaan, the tower of Babel,
      the parting of Abram and Lot, the covenant sacrifice, Lot and his daughters
      in the cave and the begetting of Moab and Ammon, Abimelech at Gerara, the
      casting out of Agar, the sacrifice of Isaac, the pottage of lentils, Isaac
      at Gerara, the stolen blessing, the ladder at Bethel, Phanuel and the
      meeting with Esau, Dina, the return to Bethel and the death of Rachel, the
      generations of Esau, Juda and Thamar, and Joseph in Putiphar's house. The
      whole book was swept for this row. Genesis itself states an age, an
      interval or a month and day at every place this lane has bound, and states
      none at any of the places listed above; the Catholic Encyclopedia's
      "Biblical Chronology", "Israelites", "Abraham", "Isaac", "Jacob",
      "Joseph", "Deluge" and "Noah" were read for them and date none of them
      either. Its "Adam", "Cain", "Sodom and Gomorrha" and "Sara" were fetched,
      registered and read in full for the same purpose, and add nothing: "Cain"
      and "Sodom and Gomorrha" print no figure of any kind, and "Adam" and
      "Sara" print only figures Scripture states first and this corpus already
      carries from it - "Adam" quoting Genesis 5, "And Adam lived a hundred and
      thirty years, and begot a son to his own image and likeness, and called
      his name Seth ... And all the time that Adam lived came to nine hundred
      and thirty years, and he died", and "Sara" retelling her ages, "who though
      sixty-five years of age is very beautiful", "After having been barren till
      the age of ninety", and "Sara lived to the age of one hundred and
      twenty-seven years". None of the four says anything of the passages listed
      above. The relative dates this corpus does hold for Genesis reach no era:
      the Anno Mundi figures the encyclopedia prints for the Deluge are totals
      of a genealogy that differs by text-family, and they must not be borrowed
      to fill this.
    sources:
