# Chronology profiles: what a date in this corpus is a date *under*.
#
# A profile is a policy, not a fact. It says which authorities win when they
# disagree, what "traditional" is being asserted, and what the profile refuses
# to do. Facts live in events.yaml, composition.yaml and bindings.yaml and name
# the profile they were authored under.
#
# guidance/scripture-chronology.md owns the semantics. Nothing here restates it.
schema: triptych-chronology-profiles/v1

profiles:
  - id: catholic-traditional-v1
    title: Traditional Catholic chronology, first profile
    intent: >-
      The chronology a traditional Catholic apparatus states about Scripture:
      what Scripture says about its own sequence, what the Roman liturgical
      books assert, what the received Catholic biblical apparatus prints, and
      what the Fathers and traditional Catholic commentators transmit. It is
      the default profile for every consumer in this repository.
    authority:
      # Read in order. A lower rank is consulted only where every higher rank
      # is silent, and a higher rank never yields to a lower one merely because
      # the lower one is more precise. Precision is not authority.
      - rank: 1
        name: Scripture's own chronological and relational statements
        what: >-
          An interval, regnal year, age, or ordering the sacred text itself
          states. Read from the tracked editions under src/sources/bibles.
        holds_in_repository: src/sources/bibles
      - rank: 2
        name: Roman liturgical witnesses, where they make a chronological claim
        what: >-
          A date the Roman books themselves assert, not a date inferred from
          the day a feast is kept. Most feasts assert nothing chronological and
          this rank is therefore silent far more often than it speaks.
        holds_in_repository: src/sources/calendars
      - rank: 3
        name: The received Catholic biblical apparatus, edition-identified
        what: >-
          A traditional Catholic annotated Bible or chronological table tied to
          an identified printing. Haydock's Douay-Rheims commentary is the
          instance this repository holds.
        holds_in_repository: src/sources/works/george-leo-haydock
      - rank: 4
        name: Patristic and early ecclesiastical chronological testimony
        what: >-
          A Father or early ecclesiastical writer stating a date, sequence, or
          composition circumstance. Eusebius and Jerome are the chronological
          witnesses proper; others speak where they speak.
        holds_in_repository: src/sources/works/eusebius, src/sources/works/jerome
      - rank: 5
        name: Traditional Catholic commentators and chronologists
        what: >-
          A major traditional Catholic commentator reporting or computing a
          date. Cornelius a Lapide is the instance this repository holds.
        holds_in_repository: src/sources/works/cornelius-a-lapide
      - rank: 6
        name: Later traditional Catholic reference works
        what: >-
          A traditional Catholic reference work consulted where every stronger
          rank is silent. The 1907-1914 Catholic Encyclopedia is the instance
          this repository holds.
        holds_in_repository: src/sources/works/catholic-encyclopedia
      - rank: 7
        name: Project derivation from the above
        what: >-
          A date this project computed from ranked claims by an explicit rule.
          Permitted only with basis "derived", a named rule, and every input
          claim identified. A derivation never overwrites a sourced assertion.
        holds_in_repository: src/sources/chronology
    non_authorities:
      # Named because they are the ones that would otherwise arrive silently.
      - name: Protestant chronologies, Ussher in particular
        rule: >-
          May be cited as comparison or corroboration, and may be reported
          where a ranked Catholic source itself reports it — Haydock prints
          Usher's Anno Mundi figures and that printing is Haydock's testimony,
          recorded as such. Ussher is never the source of record for this
          profile, and no assertion may name him alone.
      - name: Modern critical, archaeological, Egyptological and Assyriological chronology
        rule: >-
          Not consulted, not used to adjust a traditional date, and not treated
          as a correction. A divergence between this profile and modern
          scholarship is a profile boundary, not an error in either. A modern
          chronology, if ever wanted, is a separate profile with its own id.
      - name: Any model's unsourced recollection
        rule: >-
          Never an authority at any rank. A date nobody read is research-pending,
          which is a status this corpus can hold.
    admissibility:
      # ADMISSIBILITY IS NOT RANK, AND IT IS DECIDED FIRST.
      #
      # `authority` above orders evidence. It says which testimony wins when two
      # admissible sources disagree. It cannot say whether a particular printed
      # number belongs in this profile's answers at all, and reading it as
      # though it could is the defect this block exists to close: a work sits at
      # a rank, so everything it prints was treated as ranked testimony, and a
      # modern-critical figure reprinted in a Catholic reference work arrived as
      # traditional chronology because of the shelf it was standing on.
      #
      # Two questions, asked in this order:
      #
      #     1. is the SOURCE admissible?              `authority` / `non_authorities`
      #     2. is the BASIS OF THIS VALUE admissible? here
      #
      # and only then, over what survives both, 3. which rank wins?
      rule: >-
        A chronology value may be returned as a candidate answer under this
        profile only when BOTH the source AND the basis — the method by which
        that particular value was arrived at — are admissible under this
        profile. Either one failing is enough to make the value non-answerable.
      own_voice: >-
        A Catholic author's own grammatical voice is not sufficient. Where the
        value is explicitly derived from, harmonised to, or adopted from a
        chronology methodology this profile excludes, the value is not
        answerable — whatever the rank of the work that prints it, whatever
        voice it is printed in, and however Catholic the publication context.
        Publication context is not a basis.
      before_rank: >-
        Admissibility is determined BEFORE source rank. Rank orders admissible
        evidence; rank never makes an inadmissible methodology admissible, and
        there is no rank at which an excluded basis becomes answerable. The rule
        reads identically at rank 1 and at rank 6: there is no rank-6 exception,
        and no rank-6-only rule.
      preservation: >-
        A figure may be worth preserving as documentary evidence without being
        an answerable chronology assertion. Refusing a basis is not an
        instruction to delete what a source printed.
      # The basis classes this profile knows, and whether each is admissible.
      # A claim names one in `basis_class`. An unlisted name is a load error:
      # a vocabulary that admits what it does not recognise cannot tell a typo
      # from a policy.
      unstated: unreviewed
      bases:
        - id: scripture
          admissible: true
          what: >-
            The sacred text's own chronological or relational statement, read
            at a locus in a tracked edition. Rank 1, and the basis nothing
            lower-ranked may suppress.
        - id: liturgical
          admissible: true
          what: >-
            A chronological claim the Roman books themselves assert. Not the
            day a feast is kept, which asserts nothing chronological.
        - id: patristic
          admissible: true
          what: >-
            A Father or early ecclesiastical writer's own chronological
            testimony.
        - id: traditional-catholic
          admissible: true
          what: >-
            A ranked traditional Catholic authority stating or computing the
            value on traditional grounds — Scripture, the Fathers, the received
            apparatus, or its own traditional reckoning.
        - id: reported-traditional
          admissible: true
          what: >-
            A ranked work reporting another admissible traditional chronology.
            The reporting is the reporting work's testimony and is recorded as
            such; the basis is still traditional, so the value stays answerable.
        - id: derived
          admissible: true
          what: >-
            This project's derivation from admissible ranked claims by a named
            rule, with every input identified. Rank 7. A derivation whose inputs
            are not answerable is not answerable either.
        - id: unreviewed
          admissible: true
          what: >-
            The basis is stated in the claim's own `basis` prose and has not yet
            been classified under this contract. This is the state a claim
            authored before the contract carries, and it is admissible because
            the standing rule those claims were authored under was that only
            ranked traditional sources may be cited — NOT because anything has
            found the basis admissible. It is a debt, it is counted by
            `tools/tpt scripture-chronology validate --json`, and the correction
            lanes exist to empty it. THE DEBT IS NOW EMPTY. The last five were
            ruled on 2026-09-01 - Nahum 2-3, Psalms 73 and 82, and the two Abram
            claims - and the disposition of each is recorded in
            src/sources/chronology/profile-contract-corrections.tsv, row PCC-08.
            The class stays in this vocabulary because a claim authored without a
            `basis_class` still lands on it by the `unstated` rule above, so the
            count is now an alarm and not a backlog: a claim carrying it is an
            unruled claim that arrived after the corpus had none.
        - id: modern-critical
          admissible: false
          what: >-
            Modern critical, archaeological, Egyptological or Assyriological
            chronology. Excluded by `non_authorities` whoever prints it. A
            Catholic work printing it is a Catholic work reporting a chronology
            this profile does not hold.
        - id: profane-harmonisation
          admissible: false
          what: >-
            A value arrived at by harmonising Scripture with secular or profane
            history — the source's own account of its method, not an inference
            about it. A source that says its table works "in conjunction with
            the data of profane history" has stated this basis for the values
            that table carries.
        - id: reported-excluded
          admissible: false
          what: >-
            A ranked work reporting or adopting a chronology this profile
            excludes. Preservation is permitted; a default answer is not. The
            only lift is a `reporting_exception` declared below, by name.
        - id: rejected-by-source
          admissible: false
          what: >-
            A figure the citing source itself rejects. Recording what a source
            refused is provenance; returning it as that source's chronology
            would invert the source.
        - id: refusal-to-date
          admissible: false
          what: >-
            A source's statement that it will not assign a date. This is not a
            date assertion at all: it is negative evidence, methodological
            testimony, and a reason a locus may be undated. It may never be
            returned as a date candidate, and a claim carrying it must be
            `preserved`.
        - id: comparison-only
          admissible: false
          what: >-
            A figure printed for comparison with the profile's own chronology
            rather than asserted as it.
        - id: superseded
          admissible: false
          what: >-
            A figure this corpus once carried and has withdrawn, kept so an
            audit can trace what changed and why.
        - id: unresolved
          admissible: false
          what: >-
            The basis is mixed or unclear and the source has not settled it.
            Not answerable while it stays unresolved: an unknown basis is not a
            traditional one, and guessing which it is would be the fluent wrong
            answer this apparatus exists to catch.
      # NARROW, NAMED, AND NOT A PRECEDENT. Each exception lifts exactly one
      # basis class for exactly one named non-authority, and lifts it nowhere
      # else. It is not a general licence for chronology printed in a Catholic
      # work, and it does not extend by analogy to any other name.
      reporting_exceptions:
        - id: ussher-reported-by-a-ranked-catholic-source
          named: Ussher
          basis: reported-excluded
          requires: >-
            The claim's source of record is the ranked Catholic work that
            printed the figure — Haydock prints Usher's Anno Mundi figures — and
            the claim records the printing as that work's testimony. Ussher is
            never the source of record and no assertion may name him alone.
          display: >-
            Answerable, at the rank of the reporting work and never higher,
            carrying the reporting work's provenance and its own note saying
            whose computation is being reported.
          does_not_generalise: >-
            This exception names Ussher and no one else. It does not extend to
            Sayce, Driver, Wellhausen, Sloet, or any other excluded authority,
            and it does not make `modern-critical`, `profane-harmonisation` or
            any other inadmissible basis answerable. A claim naming this
            exception whose basis class is anything but `reported-excluded` is
            a load error, which is what stops the analogy being drawn.
    answerability:
      # ANSWERABLE CHRONOLOGY IS NOT THE SAME THING AS PRESERVED EVIDENCE, and
      # the corpus holds both. A claim states which it is; the query layer reads
      # this profile to decide, and a claim whose basis this profile excludes
      # cannot be authored as answerable at all.
      unstated: answerable
      states:
        answerable: >-
          May be returned by a normal chronology query as candidate chronology.
          Explicit Scriptural chronology, admissible traditional Catholic
          chronology, and admissible traditional alternatives and disagreements.
        preserved: >-
          Retained for provenance, history, comparison, methodology, rejection
          or audit traceability, and excluded from the default candidate set.
          Modern-critical chronology printed by a Catholic source, secular
          harmonisation this profile excludes, chronology the source itself
          rejects, a source's refusal to assign a date, comparison-only figures,
          and superseded figures kept so the record can be traced.
      query: >-
        The default candidate set is every answerable claim and nothing else.
        Preserved evidence is reachable only through the provenance, detail and
        audit surfaces, which a caller opens deliberately. The exclusion is
        STRUCTURAL: it is decided here, by this profile, in the query layer,
        before anything is ordered or preferred. A note that says "do not
        display" is not a control, and a claim whose only protection was such a
        note was returned by every default consumer that ever asked.
      refusal: >-
        A source statement refusing to assign a date is not a chronology date
        assertion. It may support a methodological note, source-specific
        negative evidence, an undated state where this corpus permits one, and
        provenance. It may not be returned as a date candidate.
      dispositions: >-
        Answerability is a separate axis from `disposition`. `alternate` and
        `disputed` are positions WITHIN the candidate set and leave a claim
        answerable; they are not a way to half-exclude one. A preserved claim
        may not be `preferred`, and preserved claims take no part in the
        one-preferred-per-subject arithmetic, because that arithmetic is about
        what this profile answers with.
    conflict:
      # What happens when ranked sources actually disagree.
      rule: >-
        Preserve the disagreement. Every sourced claim is kept with its own
        provenance and a disposition. Exactly one claim per temporal subject
        per profile may be "preferred", and only when a higher authority rank
        settles it or the profile's own note records why. Where nothing settles
        it, every claim is "disputed" and the query returns them all.
      dispositions:
        preferred: >-
          The claim this profile displays first. Requires either a strictly
          higher authority rank than every alternate, or an explicit note.
        alternate: >-
          A sourced claim this profile does not display first, kept queryable
          with its provenance.
        disputed: >-
          A sourced claim in unsettled disagreement with another. No claim on
          the subject is preferred while any is disputed.
      forbidden: >-
        No numeric confidence, no model score, and no silent harmonisation of
        two claims into a third nobody asserted.
    display:
      rule: >-
        A source's own printed form is preserved in "label" and is never the
        machine truth. Anno Mundi figures are recorded in the era they were
        printed in and are not converted to B.C. by this corpus; a conversion
        is a derivation and needs its own rule, inputs, and epoch.
      era_epochs: >-
        No Anno Mundi epoch is fixed by this profile. Traditional sources use
        several and this corpus has inspected none of them as an epoch claim.
    non_goals:
      - Deciding questions the Church has not defined.
      - Dating every verse. A verse the sources do not date stays undated and says so.
      - Reconciling traditional chronology with modern chronology.
      - Serving as the composition date of any *edition*; guidance/sources.md owns that.
    versioning: >-
      The id ends in a version because a change of authority policy is a new
      profile, not an edit of this one. Correcting a typo or adding a rank's
      repository instance is an edit; changing what wins is not.
