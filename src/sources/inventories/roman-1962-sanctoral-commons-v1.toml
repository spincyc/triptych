2026-08-02 at 200 and again at 400 dpi with the rest of the February run. The
pointer reads `Missa In medio, de Communi Doctorum [22], cum orationibus ut
infra:` and the day prints three orations, nos. 2155, 2157 and 2159, every one
marked P. So the transcription is not the obstacle; the witness is. S. Cyrillus
Alexandrinus was extended to the universal calendar in 1882, twenty years after
the Pustet Ratisbon 1862 was printed, and that book runs Die viii S. Joannis de
Matha, Die ix S. Appoloniae, Die x S. Scholasticae with no Cyril between them and
carries him nowhere else; its calendar index knows only Cyril and Methodius at 9
March. The Vatican 1604 and the Venice 1570 are older and carry him not at all.
`january_run` set the standard that a landed prayer is found in a tracked
public-domain witness BEFORE it is written, and this one cannot be, so nothing is
landed here - not even the pointer alone, which would serve the Common's `beati
N.` in place of the prayer the book prints for him. This is the case
`january_run` predicted the February run would meet, and the disposition it named
is the one taken.
"""

