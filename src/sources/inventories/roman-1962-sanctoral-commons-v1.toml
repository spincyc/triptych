# Which Mass of the Commune Sanctorum each day of the 1962 Proprium Sanctorum
# takes, as the Missal itself prints it.
#
# A recovery, not a landing. Five of these rows are in
# src/sources/calendars/roman-1962/propers.yaml; the other 143 are not, and this
# file exists so that the reading does not have to be done a fourth time and so
# that each row can be checked before it is used.
#
# THE DEFECT THIS FILE IS BUILT AGAINST. A pointer that names the right Common
# and the wrong saint gives that saint an entire Mass that is not his. It
# resolves cleanly, it renders, and it reads correctly. Two lanes before this
# one recovered 109 and then 153 such candidates from a linear pass over the
# text and landed NONE of them, rightly: that pass took each candidate's date
# from the nearest preceding DIE N MENSIS heading, and the scan loses enough
# headings that eleven consecutive candidates fell under 21 December.

inventory_schema = 1
record_type = "roman-1962-sanctoral-commons"
recorded_on = "2026-08-01"

method = """
The book is set in two columns and the pointer stands in the same column as the
day heading it belongs to, three or four lines below it. So the recovery is
geometric, not proximate:

  1. `pdftotext -bbox-layout` over the tracked CMAA facsimile, sha256
     648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a.
  2. Every WORD assigned to a column by its own x, and a line element that
     spans both columns cut at the gap that ends the left column and begins the
     right one. A display line -- a feast title set across the page -- is never
     cut.
  3. Each page read in BANDS delimited by its full-width lines, left column
     then right within a band. Reading the full-width lines last, as a first
     draft did, put a day's heading after the columns it heads and gave
     S. Wenceslaus the Gospel of S. Michael.
  4. Each `Die N mensis` heading opens a day; the printed name and class line
     follow it; the pointer is taken only from the lines before the day's first
     oration or antiphon.

That yielded 308 day headings over digital pp. 509-944 and 149 pointers.
"""

corroboration = """
Four checks, each independent of the extraction:

  THE BRACKET. Every pointer prints the Commune's own page, `de Communi
  Virginum II loco [30]`. Those pages were read in a separate pass, when the
  Commune Sanctorum itself was transcribed, and are recorded in each common
  mass's notes. 146 of 148 pointers name a Common whose printed first page is
  exactly the bracket they print. The two that do not are recorded at
  `[[divergences]]` below and were read on the page image; both name the right
  Common.

  THE SAINT'S NAME. Each day was attached to an entry of the calendar index by
  matching the name printed under the heading against the entry's name, never
  by position. A date carrying a feast and a commemoration offers two entries
  and the match must choose; where it could not choose clearly, the day is
  absent from this file.

  THE DATE SEQUENCE. The headings were checked for monotonicity through the
  book. Exactly one fell out of order -- S. Caeciliae, whose `Die 22 novembris`
  the scan reads as `Die 12` -- and it is not in this file.

  THE PAGE IMAGE. Five rows were rendered at 140 dpi and read. Those five are
  the only ones marked `landed`.
"""

what_blocks_the_rest = """
Not doubt about the Common. The Missal names it plainly and two independent
readings agree. What blocks a row is that the day usually prints ORATIONS OF
ITS OWN -- `praeter orationem sequentem`, `cum orationibus ut infra` -- and this
repository has not transcribed them. Landing the pointer without them would
serve the Common's `beati N.` under the saint's name, in place of the prayer the
book prints for him. That is the same defect in a smaller costume, so the rows
are held.

  87 rows  the day prints orations of its own
  12 rows  the day carries several pointers, or one under a seasonal condition
           this schema cannot express (`Tempore paschali ... Extra tempus
           paschale ...`)
   2 rows  the day could not be attached to an entry, or its rubric was not
           recognised
  42 rows  nothing blocks them but that no one has read the page image yet
   5 rows  landed, two of them with the day's own Collect transcribed from the
           same image

The 42 are the cheapest remaining work in this file: each is a page image, a
reading, and a two-line reference. The 87 are the next cheapest, and each is
one Collect or three orations off a page this file already names.
"""

[[divergences]]
date = "06-17"
printed = "Missa Statuit, de Communi Confessoris Pontificis I loco [4]"
mass = "s-gregorii-barbadici-episcopi-confessoris"
finding = """
Read on the page image at printed p. 554. The bracket is [4], where the Mass
Statuit ei Dominus is printed in full under the Commune unius Martyris; the
Commune Confessoris Pontificis prints the same formulary at [19] with its own
orations. The Common NAMED is Confessoris Pontificis I loco, and that is the one
a landing should take, because this file's Commons carry orations and the
orations are what differ.
"""

[[divergences]]
date = "09-22"
printed = "Missa Statuit, de Communi Confessoris Pontificis I loco [20]"
mass = "s-thomae-villanova-episcopi-confessoris"
finding = """
Read on the page image at printed p. 665. The Commune Confessoris Pontificis
Missa I runs pp. [19]-[20], so the bracket falls inside the Mass it names and
the row is sound; only the equality test on the first page fails.
"""

