# Which Mass of the Commune Sanctorum each day of the 1962 Proprium Sanctorum
# takes, as the Missal itself prints it.
#
# A recovery, not a landing. Thirteen of these rows are in
# src/sources/calendars/roman-1962/propers.yaml; the other 135 are not, and this
# file exists so that the reading does not have to be done a fourth time and so
# that each row can be checked before it is used.
#
# THE DEFECT THIS FILE IS BUILT AGAINST. A pointer that names the right Common
# and the wrong saint gives that saint an entire Mass that is not his. It
# resolves cleanly, it renders, and it reads correctly. Two lanes before this
# one recovered 109 and then 153 such candidates from a linear pass over the
# text and landed NONE of them, rightly: that pass took each candidate's date
# from the nearest preceding DIE N MENSIS heading, and the scan loses enough
# headings that eleven consecutive candidates fell under 21 December.

inventory_schema = 1
record_type = "roman-1962-sanctoral-commons"
recorded_on = "2026-08-01"

method = """
The book is set in two columns and the pointer stands in the same column as the
day heading it belongs to, three or four lines below it. So the recovery is
geometric, not proximate:

  1. `pdftotext -bbox-layout` over the tracked CMAA facsimile, sha256
     648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a.
  2. Every WORD assigned to a column by its own x, and a line element that
     spans both columns cut at the gap that ends the left column and begins the
     right one. A display line -- a feast title set across the page -- is never
     cut.
  3. Each page read in BANDS delimited by its full-width lines, left column
     then right within a band. Reading the full-width lines last, as a first
     draft did, put a day's heading after the columns it heads and gave
     S. Wenceslaus the Gospel of S. Michael.
  4. Each `Die N mensis` heading opens a day; the printed name and class line
     follow it; the pointer is taken only from the lines before the day's first
     oration or antiphon.

That yielded 308 day headings over digital pp. 509-944 and 149 pointers.
"""

corroboration = """
Four checks, each independent of the extraction:

  THE BRACKET. Every pointer prints the Commune's own page, `de Communi
  Virginum II loco [30]`. Those pages were read in a separate pass, when the
  Commune Sanctorum itself was transcribed, and are recorded in each common
  mass's notes. 146 of 148 pointers name a Common whose printed first page is
  exactly the bracket they print. The two that do not are recorded at
  `[[divergences]]` below and were read on the page image; both name the right
  Common.

  THE SAINT'S NAME. Each day was attached to an entry of the calendar index by
  matching the name printed under the heading against the entry's name, never
  by position. A date carrying a feast and a commemoration offers two entries
  and the match must choose; where it could not choose clearly, the day is
  absent from this file.

  THE DATE SEQUENCE. The headings were checked for monotonicity through the
  book. Exactly one fell out of order -- S. Caeciliae, whose `Die 22 novembris`
  the scan reads as `Die 12` -- and it is not in this file.

  THE PAGE IMAGE. Six pages were rendered at 140 dpi and read, settling
  thirteen rows. Those thirteen are the only ones marked `landed`. Reading the
  image also settled two things the text layer could not: the letter C or P the
  Missal prints beside each oration heading, which says whether that oration is
  of the Common or proper to the day, and the numeral after it, which says
  WHICH set of the Common's orations. S. Bedae is marked C 2 under a pointer
  that names only `de Communi Doctorum [22]`, and C 2 is the set pro Doctore
  non Pontifice; landing the bracket alone would have given a Doctor who was
  not a bishop the bishop's Secret and Postcommunion. The letters survive OCR
  in about a quarter of cases, so they are a reason to read the image, not a
  substitute for reading it.
"""

what_blocks_the_rest = """
Not doubt about the Common. The Missal names it plainly and two independent
readings agree. What blocks a row is that the day usually prints ORATIONS OF
ITS OWN -- `praeter orationem sequentem`, `cum orationibus ut infra` -- and this
repository has not transcribed them. Landing the pointer without them would
serve the Common's `beati N.` under the saint's name, in place of the prayer the
book prints for him. That is the same defect in a smaller costume, so the rows
are held.

  84 rows  the day prints orations of its own
  12 rows  the day carries several pointers, or one under a seasonal condition
           this schema cannot express (`Tempore paschali ... Extra tempus
           paschale ...`)
   2 rows  the day could not be attached to an entry, or its rubric was not
           recognised
   0 rows  nothing blocks them but that no one has read the page image
  50 rows  landed, six of them with the day's own orations transcribed from the
           same image

The 36 that were blocked on nothing but an unread page are all read and all
landed, and one of the 85 went with them: 08-09 S. Romani, whose two proper
orations were transcribed off a page this pass had opened for another reason.
The remaining 84 are now the cheapest work, and each is one Collect or three
orations off a page this file already names.
"""

second_image_pass = """
All 36 were read on 2026-08-01 and all 36 are landed, over 34 page images and
six continuation leaves. Each page was rendered at 140 dpi from the tracked PDF
and read beside a geometric extraction of the same page -- every word assigned
to a column by its own x, each page read in bands delimited by its full-width
lines -- so each row rests on two readings that had to agree.

WHAT THE IMAGE SETTLED AND THE TEXT LAYER COULD NOT. Not one of the 36 pointers
carries a qualifier: every one ends at the bracket with a full stop. And not one
oration on any of the 36 days is marked P. Every oration a day of this set
prints is marked C, of the Common, with the saint's name merely supplied. So all
36 take the whole Mass and none of them holds a prayer of its own, which is why
all 36 land as a reference and nothing else.

That the absence is an absence, and not a scan losing a line, is settled on the
same pages: neighbouring days print the qualifier plainly and legibly. 09-29
reads `de Communi Doctorum [22], cum orationibus ut infra:`, 07-21 `praeter
orationem sequentem:`, 08-18 `cum orationibus et Evangelio ut infra:`, 08-31
`praeter orationem sequentem:`, 11-13 `praeter orationem sequentem:`. Twelve
such contrasts were read, on eleven of the 34 pages.

WHICH SET, WHERE THE COMMON HAS TWO. 04-04 S. Isidori and 04-21 S. Anselmi both
point at `de Communi Doctorum [22]`, which is the bracket that gave S. Bedae the
wrong Secret before anyone read his page. Both are marked C 1 on the Secret and
the Postcommunion, and set 1 is pro Doctore Pontifice; both were bishops, so
both take commune-doctorum-pontificis, and the numeral says so rather than the
bracket. The Collect of each is marked with a bare C, because the Commune
Doctorum prints one Collect and two sets of the other two orations.

A CHECK THAT DID NOT HAVE TO PASS. 12-16 and 02-03 land on the same Common,
unius Martyris II loco, and the Missal prints all three of their orations out in
full under each day. The two printings agree word for word with each other and
with the Common's own text once `beati N.` is read for the saint's name. A
pointer naming the wrong Common would not have produced that agreement. The same
test passes at 11-26, whose commemoration Collect the Missal prints in full
inside another day's Mass, and which is the Collect of commune-unius-martyris-1
word for word.

Six days needed a second leaf, their orations running over the page: 12-16,
05-30, 07-11, 07-27, 03-21 and 10-21. An oration that begins on the last line of
a page is exactly what a reading of one page at a time loses.

TWO DEFECTS THIS PASS FOUND IN OTHER WORK. 09-01 and 11-26 were not bare
placeholders when the landing reached them: each carried a full set of scripture
citations that the page proves is not that day's. Both came from the pass that
gave 149 saints' Masses their citations off this book's text layer, and both
failed the same way -- it matched a day heading and then took the propers
printed after it, without stopping at the heading that stood between. At 09-01
the intervening heading was `Eodem die 1 septembris / Ss. duodecim Fratrum
Martyrum`, whose whole Mass S. Aegidius was holding; those propers are now on
the Twelve Brothers, where the Missal prints them. At 11-26 there was no next
day at all: that heading is the last of the Proprium Sanctorum, and what follows
it over the leaf is the Commune Sanctorum, so S. Petrus Alexandrinus was holding
the opening of `Commune unius aut plurium Summorum Pontificum` -- Introit `Io.
21, 15-17 Si diligis me` and the six propers after it. Those are removed and not
moved, because the Commune's own scripture propers need their own reading.

Both were found only because a landing tried to write where they sat, so the
class was then hunted rather than waited for. 29 dates carry the shape the
failure leaves -- a scripture-bearing entry beside a placeholder-only sibling on
the same date -- and 9 of those carried it in what looked like the suspicious
direction, the scripture on the COMMEMORATION while the day's third-class feast
held nothing. All nine pages were read.

EIGHT OF THE NINE ARE THE BOOK'S OWN LAYOUT AND NOT A DEFECT. At 01-28, 06-12,
06-18, 06-19, 07-21, 08-08, 08-30 and 09-22 the Missal really does print the
scripture propers under the commemoration's own `Eodem die` heading while the
third-class feast beside it takes its Mass from a Common. 06-18 is the clean
specimen, both halves on one page: `S. Ephraem Syri ... III classis / Missa In
medio, de Communi Doctorum [22], praeter orationem sequentem:` with no propers at
all, against `Ss. Marci et Marcelliani ... Commemoratio` with Introit, Oration
and Epistle. A commemoration outranking its feast in printed matter is normal
here and is not evidence of anything.

THE NINTH WAS REAL. At 08-09 the propers belong to the third-class Vigil of
S. Laurentius, which held only a placeholder, and the Gospel `Mt. 16, 24-27` and
Communion `Mt. 16, 24` sat on comm-s-romani-martyris. S. Romanus has no Mass on
that leaf at all, only a commemoration inside the Vigil's. Both are moved, the
Vigil now carries its whole scripture-bearing Mass off printed pp. 620-621, and
S. Romanus's own pointer is landed with the two orations marked P.

So the count is three misattributions found and fixed, out of 149 masses that
pass gave citations to, and the 29-date shape is not by itself a detector: it
was right twice in eleven tries.
"""

