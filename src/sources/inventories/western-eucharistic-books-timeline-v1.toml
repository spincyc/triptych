# Metadata-only research inventory. Witness census is not a version genealogy.
schema = "western-eucharistic-books-research-inventory/v1"
researched_on = "2026-10-19"
scope = "Non-exhaustive Western Eucharistic service-book research census: current Catholic traditions, shared historical ancestors and extinct local uses. Original liturgical-language books have priority. Witnesses and revision candidates are distinguished; metadata only."
evidence_limit = "Catalogue and official metadata are supplemented by linked canonical source artifacts and bounded original-page inspection. Each row distinguishes whole provider delivery, retained component or selected pages, unverified OCR and checked transcription. Complete acquisition does not establish physical-copy completeness, complete text coverage, normative revision or local reception. Attributed scholarly comparisons remain distinct from independent original-book collation."
further_leads_not_researched = ["Verona LXXXV(80): obtain holding-library manuscript description and cleared old full edition; distinguish collected Roman libelli from a complete annual sacramentary.", "Additional early Gallican and Roman-Frankish witnesses, Mone Masses, Gregorian supplements and Old Gelasian layers: manuscript-wide census and textual relationships remain open.", "Medieval Ambrosian sacramentaries, 1582/1588 reforms and subsequent Latin typical editions: direct witnesses and reform instruments still needed.", "Old Hispanic manuscripts beyond BL Add MS 30846; distinguish Liber misticus, Liber missarum, Liber ordinum and Liber commicus by actual Eucharistic contents.", "Roman-curial/Haymo manuscript succession and full missal revisions remain incomplete. Burchard1501/1502 ceremonial states and specified reception are now documented, with partial comparison limits.", "Roman experimental Easter Vigil stages, 1969 separate Ordo Missae and later amendments: coordinate with existing Roman and Holy Week inventories instead of duplicating acts.", "Slavonic/Glagolitic Roman books: distinguish source-recension changes from permissions and translations; original historical source status and publication rights need review.", "Order trajectories still lacking a revision census: Benedictine houses/Cassinese, Teutonic, Paulines, Gilbertines, Windesheim, Camaldolese, Augustinian, Humiliati, Trinitarian, Minims and Discalced Carmelite.", "Four Iberian local-use catalogue witnesses are now identified (Barcelona, Salamanca, Seville, Toledo Roman); the broader census and original-book comparisons remain incomplete. Toledo Roman must remain separate from Old Hispanic.", "Book of Divine Worship edition history, later Divine Worship corrections, Zaire source-language edition and approved regional adaptations beyond it need primary front matter.", "Post-medieval diocesan missals require comparison of prayers, rubrics, calendar and order. A long dated printing series is not a revision series."]
research_scope = "agreed-current-Catholic-traditions-shared-ancestors-and-extinct-local-uses"
exhaustive = false
new_complete_source_books_acquired = 2
new_complete_texts_collated = 0
publication_class = "This inventory contains project-created bibliographic metadata only. Linked source-library artifacts retain separately governed historical text; they are not republished inside this inventory."
integration_status = "Research inventory only; not the frozen source-library schema, a source-text manifest, or a set of accepted act-history stations. Existing records and generated ancestry remain unchanged."
existing_inventories = ["src/sources/inventories/latin-missal-acts-v1.toml", "src/sources/inventories/roman-holy-week-acts-v1.toml", "src/sources/inventories/missal-acquisition-audit-v1.toml"]
coverage_note = "Systematic trajectory checklist plus selected catalogue witnesses, not an exhaustive manuscript or edition census. A trajectory may have thousands of witnesses. Documented witness dates are not automatically dates of normative revision. Existing inventories remain the references for already represented Roman and order editions."
distinctness_rules = ["A distinct source state requires demonstrated substantive changes to prayers, rubrics, calendar or order, or an authoritative instrument specifying such changes. A different printer, year or scanner alone is insufficient; approval alone may concern a translation or reprint.", "Distinguish complete books, partial Orders, supplements, lectionaries, calendar amendments and legislation about permission to use a book.", "Keep translations and other language expressions separate from underlying source recensions; an approval applies only to its stated textual extent.", "Complementary volumes belong to one edition unless evidence establishes a later revision; their publication dates do not form a succession of recensions.", "Critical editions and reprints witness earlier texts; editorial apparatus alone does not demonstrate a normative liturgical reform.", "Keep composition, manuscript copying, approval, publication, effective use and reprinting dates distinct. Approximate or disputed dates remain explicit.", "Chronological continuity within a use does not prove textual descent. Do not infer a universal Western trunk or direct parentage by sorting dates.", "A bibliographic record or partial text is not a complete missal. Missing acquired content does not demonstrate ritual absence.", "A manuscript with interleaved books, later additions, correctors or independent supplements may preserve multiple textual states. Do not make the whole codex a single normative edition.", "A witness census, a bibliography of printed editions and a genealogy of substantive versions are separate datasets. Retain one-to-many links and unresolved duplicate records.", "A named religious house or order in a catalogue origin field does not establish that all its holdings represent a distinctive order use; pre-foundation manuscript dates require special scrutiny.", "For historical extinct uses, identify manuscripts, printed witnesses and reform evidence without implying that the use survives today as an independent Catholic rite."]
language_priority = "Original source books first, including books originally composed or adapted in a modern language. Independently translated expressions are deferred. Latin is not assumed to be the original language of every modern Catholic adaptation."
chronology_policy = "Dates from inspected official records, catalogues and identified critical or original scholarly studies receive integer coordinates. chronology_kind distinguishes redaction, copying, approval and publication. Attributed or approximate dates remain explicit; witness dates do not become normative acts."
usuarium_attribution = "Data retrieved from USUARIUM (Eötvös Loránd University, Budapest), built by Miklós István Földváry and colleagues, Research Group of Liturgical History, 2015 onwards; https://usuarium.elte.hu. This inventory paraphrases selected bibliographic facts and links the underlying records."
usuarium_census_limit = "Seven origin-index pages inspected (offsets 0,100,300,400,500,600,700); offset 200 could not be fetched. Cached pages overlap and reflect different crawl dates. No stable total or exhaustive use count is asserted. Origins mix Mass, Office and other ritual books; an origin association alone does not establish the age or normative use of a religious-order rite."
record_count_note = "Catalogue rows are research objects, not distinct-version counts. The generated catalogue provides current counts; exact artifacts and acquisition routes retain their own evidence limits."
initial_catalogue_pass_complete_books_acquired = 0
acquisition_update_registered_witnesses = 4
acquisition_update_new_artifacts = 5
acquisition_update_new_text_artifacts = 3
acquisition_count_note = "Two newly retained complete scan volumes: Stowe1915 VolII and Bobbio1917 facsimile VolI. Three new text artifacts: Stowe host OCR,Gregorian extraction from an existing432-page scan,and Gelasian historical-book OCR excluding modern wrapper. Four edition witnesses gain registered access; this is not four newly downloaded complete books. No text was fully collated."
source_library_binding_policy = "A manuscript candidate may link a much later critical edition or facsimile as evidence. The linked edition publication date never replaces the manuscript copying date. Original manuscripts,facsimile volumes,edited texts,OCR derivatives and corrected transcriptions remain separate. Acquisition of a complete host delivery does not establish page-by-page completeness or verified readings."
modern_research_update = "Bounded primary-act/official-publication pass establishes five substantive source reforms or adaptations; intermediate translation, volume and printing relationships remain qualified per row. No modern full book acquired or transcribed, and no complete source collation performed."
continuity_research_update = "Medieval-to-modern pass adds exact ceremonial witnesses and scoped comparisons. Relationship proposals are separately reviewed; no inferred universal Western trunk, full-book identity or new verified source transcription. Seven early manuscript/contact witnesses and four historical-interpretation corrections integrated after review of the early research lane; canonical1861 native Latin comparison witness also linked."

