# Metadata-only research inventory. See evidence_limit and distinctness_rules.
schema = "western-eucharistic-books-research-inventory/v1"
researched_on = "2026-10-16"
scope = "Non-exhaustive Western Catholic Eucharistic book candidates and historical witnesses, compared with latin-missal-acts-v1.toml and missal-acquisition-audit-v1.toml. Metadata only; no liturgical text."
evidence_limit = "Web-tool rendered catalogue/official-page/PDF text inspected as specified. No complete book newly acquired, no prayer collated, no modern edition cleared for republication. Shell retrieval failed DNS; PDF screenshots failed cache fetch. Checked metadata is not source-text verification under repository policy."
further_leads_not_researched = ["Verona sacramentary manuscript LXXXV(80), Roman prayer libelli; no simple complete universal missal ancestor", "Gallican Missale Gothicum and Missale Gallicanum Vetus: Vatican Reg.lat.317 and Pal.lat.493 identities/date need catalogue verification; viewer alone did not establish content", "Stowe and Bobbio missals, Old Hispanic Liber misticus/Liber missarum and Liber mozarabicus sacramentorum manuscripts; medieval Ambrosian sacramentaries", "Franciscan-curial manuscript reforms and Haymo of Faversham; manuscript evidence before 1474", "Ambrosian 1582/1588 reforms and subsequent 1902 typical edition: source them directly before timeline promotion", "Cistercian early printed missals, Dominican 1256 prototype, Carmelite medieval ordinal and twentieth-century revisions, Premonstratensian 1936: existing witnesses or leads need revision-level work", "Neo-Gallican diocesan missals, Paris/Lyon reforms; Esztergom, Cologne, Rouen, Nidaros and other historic diocesan uses: catalogue-driven selection required", "Roman 1951 experimental Easter Vigil and 1952 iteration; 1969 Ordo Missae separate from 1970 complete missal; post 2008 formularies/rubrical amendments separately", "Slavonic Roman missal line beyond existing 1893 witness; ritual-language permission and translation are distinct from source recension", "Book of Divine Worship editions, Divine Worship later corrected printings; exact publication and approval records needed"]
research_scope = "provisional-current-Catholic-ancestry-pending-user-clarification"
exhaustive = false
new_complete_source_books_acquired = 0
new_complete_texts_collated = 0
publication_class = "Project-created bibliographic metadata; no third-party liturgical source text retained."
integration_status = "Research inventory only; not the frozen source-library schema, a source-text manifest, or a set of accepted act-history stations. Existing records and generated ancestry remain unchanged."
existing_inventories = ["src/sources/inventories/latin-missal-acts-v1.toml", "src/sources/inventories/roman-holy-week-acts-v1.toml", "src/sources/inventories/missal-acquisition-audit-v1.toml"]
coverage_note = "This pass concentrates on gaps in the existing Latin inventories. Already catalogued Roman editions, local-use printings and order witnesses are not duplicated here. Candidate clusters are not counts of distinct recensions. Historic local uses and sacramentaries are contextual witnesses; ancestry edges require separate evidence."
distinctness_rules = ["A new normative source state needs an approving instrument or demonstrated material textual or rubrical change; a different printer, year or scanner alone does not establish one.", "Distinguish complete books, partial Orders, supplements, lectionaries, calendar amendments and legislation about permission to use a book.", "Keep translations and other language expressions separate from underlying source recensions; an approval applies only to its stated textual extent.", "Complementary volumes belong to one edition unless evidence establishes a later revision; their publication dates do not form a succession of recensions.", "Critical editions and reprints witness earlier texts; editorial apparatus alone does not demonstrate a normative liturgical reform.", "Keep composition, manuscript copying, approval, publication, effective use and reprinting dates distinct. Approximate or disputed dates remain explicit.", "Chronological continuity within a use does not prove textual descent. Do not infer a universal Western trunk or direct parentage by sorting dates.", "A bibliographic record or partial text is not a complete missal. Missing acquired content does not demonstrate ritual absence."]

