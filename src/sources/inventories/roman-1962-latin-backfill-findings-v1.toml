corroboration = "1604 and 1570 swept whole and negative as well; see notes."
evidence = "1955 composition. The formula for marking the paschal candle with the cross, Alpha, Omega and the four numerals of the current year enters the Roman rite with the 1955 Ordo Hebdomadae Sanctae; the pre-1955 books mark no candle and print no such formula. Whole-book sweep of all three tracked public-domain witnesses -- 1862 Pustet (108,905 lines / 336,898 words), 1604 Vatican typica (63,205 lines / 241,066 words) and 1570 Venice (84,443 lines / 229,696 words), the last two read with long s folded to s. Search was on rare word PAIRS taken adjacent in the 1962 text, matched fuzzily (>=0.85 character similarity, same initial) within a 12-word window, so an ornamental drop capital or a damaged accent cannot hide a hit. POSITIVE CONTROL: the identical procedure fires on prayers this lane proved present -- oblationibus+hostiarum 3 hits in the 1862 (Vigil Secret), hostiarum+initiata 2, productum+silice 1 and paschalia+inflammari 1 (blessing of the new fire), illustras+conserva 1 (Vigil Collect), segetum+spinarum 1 (third prophecy collect). RESULT: every distinctive pair returns zero in all three books -- imperium+aeternitatis, universa+aeternitatis, imperium+universa, aeternitatis+saecula, tempora+saecula, ipsius+tempora. Single tokens: Alpha occurs once in the whole 1604 and never in the 1862 or 1570; Omega occurs in none of the three; Principium is never within twelve words of Finis in any of them; heri is never adjacent to hodie in the 1862 or the 1570, and its two 1604 neighbourhoods (lines 41169, 56011) are Hebrews 13:8, the scriptural source the formula draws on, not the formula. PAGES ACTUALLY OPENED in the 1862: the whole Holy Saturday run, text-layer lines 33300-33700, which prints the blessing of the fire, the blessing of the five grains of incense and the Lumen Christi with nothing between them. The related no. 973, Per sua sancta vulnera, swept negative on the same evidence (vulnera never near gloriosa, custodiat never near conservet, in any of the three books)."

