evidence = "1951/1955 composition. The renewal of baptismal promises is introduced with the restored Vigil; no pre-1955 Missal has a vernacular-style allocution or the interrogations at this point. Whole-book sweep of all three tracked public-domain witnesses -- 1862 Pustet (108,905 lines / 336,898 words), 1604 Vatican typica (63,205 lines / 241,066 words) and 1570 Venice (84,443 lines / 229,696 words), the last two read with long s folded to s. Search was on rare word PAIRS taken adjacent in the 1962 text, matched fuzzily (>=0.85 character similarity, same initial) within a 12-word window, so an ornamental drop capital or a damaged accent cannot hide a hit. POSITIVE CONTROL: the identical procedure fires on prayers this lane proved present -- oblationibus+hostiarum 3 hits in the 1862 (Vigil Secret), hostiarum+initiata 2, productum+silice 1 and paschalia+inflammari 1 (blessing of the new fire), illustras+conserva 1 (Vigil Collect), segetum+spinarum 1 (third prophecy collect). RESULT: all twelve distinctive pairs return zero in all three books -- quapropter+quadragesimali, quadragesimali+exercitatione, exercitatione+absoluta, promissiones+renovemus, renovemus+satanae, apostolus+consepulti, novitate+ambulare, gloriosam+laetabunda, redamando+vigilat, catholica+promisimus, serviamus+existimemus. Single tokens: abrenuntiatis, abrenuntiamus and Abrenuntio occur nowhere in any of the three; recolens is never within twelve words of Ecclesia; sepulturam never near recolens. NOTE what the sweep does NOT say: the allocution quotes Romans 6, which of course stands in all three books as the Holy Saturday epistle -- the 1862's consepulti near baptismum at line 48825 is that epistle, not this text. The quotation is scripture; the frame around it is 1955."

