evidence = "Confirmed absent by an end-to-end sweep of all four public-domain witnesses (1862 Pustet, 344,645 tokens; 1922 Mame -raw, 357,228; 1604, 245,807; 1570, 253,039), appendices included, using consonant-skeleton alignment that tolerates the recognisers' damage and the long s. The best window each witness returns is a different prayer: its content words do not belong to this text. Positive control on the same run: the Collect of S. Antonius Abbas scored 0.86 (0 of 12 content words missing), the Secret of Ss. Marius and companions 0.90 (0 of 14) and the Secret of S. Hermenegildus 0.93 (0 of 16); and over the 369 committed readings whose provenance is publication_status=permitted the same scorer put the best public-domain witness at a median of 0.91 with none below 0.60. The three orations of this commemoration are those of the Commune Summorum Pontificum (the Mass Si diligis me), a Common that entered the Roman Missal only in the twentieth century; none of the four pre-1931 witnesses prints a Common of Supreme Pontiffs at all, so the ceiling here is the Common's own institution date and not the saint's. The best 1862 window (printed p. 328) and the best Mame window are a different oration about the apostles and the heavenly hierarchies."

