corroboration = "not attempted in the 1570 or 1604; their records forbid resting a negative on a raw search over them and I did not read their Good Friday leaves for this | 1604 and 1570 swept whole in the second pass; see notes."
evidence = "WHAT I CHECKED. (1) I read the 1862's own end of the Good Friday liturgy, text-layer lines 33352-33460, printed pp. 178-179. After the priest's communion it prints `Quod ore sumpsimus, Domine...` and then, in terms, `Non dicitur Corpus tuum, Domine, nec Postcommunio, nec Placeat tibi, nec datur benedictio: sed, facta reverentia Altari, Sacerdos cum ministris discedit`. The pre-1955 rite has NO prayers after Communion on this day; the 1955 Ordo added three, because it restored the Communion of the people. (2) I then searched the whole 1862 by incipit and by four distinctive phrases -- `Super p.pulum tuum`, `benedicti. copi.sa`, `indulg.ntia veniat`, `succr.scat`, `devota mente` -- over the flattened, dehyphenated stream. `Super populum` occurs many times as the Lenten rubric `Oratio super populum` and once as `benedictio copiosa descendat: quae et sanctificationem nobis clementer...`, which is a DIFFERENT Lenten super populum prayer, not this one. `devota mente` and `succrescat` occur nowhere in the book. SAME CANDOUR AS FOR no. 924: the prayer is very likely ancient, but no tracked public-domain witness carries it, so it may not be published from this facsimile on the evidence available here. || THREE-BOOK SWEEP ADDED IN THE SECOND PASS. The lane's first pass swept the 1862 alone. On the coordinator's rule that new-matter needs the whole shelf behind it, I re-swept all three tracked public-domain witnesses -- 1862 Pustet (108,905 lines), 1604 Vatican typica (63,205 lines), 1570 Venice (84,443 lines), the last two with long s folded to s -- on rare word PAIRS taken adjacent in the 1962 text and matched fuzzily (>=0.85 character similarity, same initial letter) within a twelve-word window, so neither a lost ornamental capital nor a damaged accent can hide a hit. POSITIVE CONTROL for the procedure: it fires on prayers this lane proved present (oblationibus+hostiarum 3 hits in the 1862, hostiarum+initiata 2, productum+silice 1, paschalia+inflammari 1, illustras+conserva 1, segetum+spinarum 1). RESULT: zero in all three books on succrescat+firmetur, firmetur+eundem, devota+recoluit, recoluit+copiosa, copiosa+indulgentia, tribuatur+succrescat, succrescat+redemptio, redemptio+firmetur. Single token succrescat occurs nowhere in any of the three. The two isolated ones (indulgentia+consolatio in the 1862, recoluit+descendat in the 1862 and 1570) are common-word coincidences, opened and not this prayer."

