  "PETITION 4 IS A DIFFERENT PRAYER. 1862 invitatory: `Oremus et pro Christianissimo Imperatore nostro N. ut Deus, et Dominus noster subditas illi faciat omnes barbaras nationes, ad nostram perpetuam pacem.` 1962 invitatory: `Oremus et pro omnibus res publicas moderantibus, eorumque ministeriis et potestatibus: ut Deus et Dominus noster mentes et corda eorum secundum voluntatem suam dirigat ad nostram perpetuam pacem.` They share only `Oremus et pro`, `ut Deus et Dominus noster` and the closing `ad nostram perpetuam pacem`.",
