evidence = "The 1962 prints this under FERIA QUINTA IN CENA DOMINI / DE MISSA CHRISMATIS at printed pp. 152-153. Swept end to end, by distinctive interior words as well as by incipit, over the whole of four public-domain witnesses: the Pustet Ratisbon 1862 (108,905 lines), the 1922 Tours Mame text layer, the Vatican 1604 and the Venice 1570 (long s allowed to read as f in the last two). Words with ZERO hits in the whole book: 1862 ['plebibus', 'perseverantem', 'famulatum']; Mame ['plebibus']; 1604 ['regenerandis', 'plebibus', 'perseverantem']; 1570 ['regenerandis', 'plebibus', 'perseverantem', 'famulatum']. The best co-occurrence window anywhere in any of the four gathers only 4 of the 12 searched tokens, and those are the common words of any oration. POSITIVE CONTROL on the same tooling: the Holy Wednesday Secret, searched the same way, gathers 9 of its 12 tokens in a 12-line window of the 1862 at line 31210, which is where that prayer stands. The Missa chrismatis was instituted by Pius XII in 1955 (Maxima redemptionis nostrae mysteria, 16 November 1955) and no Missal printed before 1931 contains the Mass at all, so this is a real absence and not a failed search. NOT CHECKED: the Pontificale Romanum, which this repository does not track and where an older form of some of this matter may stand; on the Missal witnesses available the row should stay typed as it is."

