record_schema = 1
record_type = "roman-1962-latin-backfill-findings"
calendar = "roman-1962"
recorded_on = "2026-09-04"
scope = "Every appointed oration of the 1962 calendar the 2026-09-03/04 Latin backfill did NOT publish, with the evidence for each."

# The backfill published 1,034 Latin oration bodies and left 100 unpublished.
# On 2026-10-01 (KI-054) the 32 `blocked` among them were read on the 1962
# page images at 200 and 400 dpi, corroborated word for word on a page image
# of the 1862 Pustet or the 1922 Mame, and published; their entries were
# removed from this file and their evidence now lives in the provenance-ledger
# rows that publish them. 68 remain: absent 41, variant 17, new-matter 10.
# The verdicts below are why. They are kept because the reasoning cost more than
# the reading did: each rests on a sweep of the four public-domain witnesses, and
# without it a later pass re-derives an answer this one already has.
#
# `blocked` was the only class likely to become publishable: the collation stood
# and only the stored 1962 string was recogniser damage. All 32 were cleared on
# the page images, so no entry of that class remains. Most had been quarantined
# by an earlier, broader damage screen whose false positives (da, pia, ita,
# gaudiis, posset) the current screen allows.
#
# `absent` means no pre-1931 witness prints the text. The bound is a TEXT's first
# publication, not a saint's canonisation -- St John Leonardi was canonised in
# 1938 and his Mass is in the 1922 Mame as a Blessed.
#
# `variant` means a witness prints a recognisably related prayer whose WORDS
# differ, so 17 U.S.C. 103(b) does not reach the 1962's form of it.
#
# `new-matter` means the 1955 or 1960 reform composed it.
#
# The rules these verdicts were reached under are in
# guidance/propers-for-agents.md; the rights position is in
# missale-romanum-1962-facsimile-rights-v1.toml.

