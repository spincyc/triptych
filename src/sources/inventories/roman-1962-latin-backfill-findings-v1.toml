evidence = "The 1944 feast of the Immaculate Heart took its orations from the older votive Mass of the Most Pure Heart of Mary, which the 1922 Mame prints complete in its Missae pro aliquibus locis appendix at bracketed p. [18] (running head M. P. A. L. (Purissimi Cordis B. M. V.)), PDF p. 1048, which I read at 400 dpi. This is the Rita of Cascia case: reading only the universal sanctoral would have produced a false whole-book absence. But the words are not the same. The Mame reads purissimi Cordis where the 1962 reads immaculati Cordis, and the 1962 adds the parenthetical alternative (commemorationem) that the Mame does not have. One substituted adjective and one added parenthesis is more than pointing, so this is variant and not publishable on this witness. The 1862 carries the same older Mass at layer lines 96699-96714."

