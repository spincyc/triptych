evidence = "WHAT I CHECKED. (1) I opened the 1862's Good Friday opening, text-layer lines 31916-31998, printed pp. 165-166: the rubric there reads `Sacerdos, et ministri induti paramentis nigri coloris ... procedunt ad Altare: et ante illud prostrati aliquamdiu orant`, and the very next thing printed is the first Prophecy (Osee 6) with no prayer between. The pre-1955 rite has no oration at the prostration; the 1955 Ordo inserted one. (2) I then searched the WHOLE 1862 text layer by incipit and by five distinctive phrases, over a stream flattened for the scan's double spaces and rejoined across hyphenated line breaks: `portavimus` / `port.vimus`, `posterit`, `hereditar` / `h.reditar`, `conformes`, `necessit.te`. The only hit anywhere in 108,905 lines was `qui portavimus pondus` at line 18544, which is the Septuagesima Gospel (Mt 20:12), not this prayer. (3) I did not stop at the Holy Week run: the searches covered the sanctoral, the votive Masses and the appendices, and nothing filed this prayer under another day. WHY new-matter RATHER THAN absent. This is an insertion made by the 1955 Ordo into this book, so `new-matter` names the fact the rights record cares about. BUT BE CANDID ABOUT ONE THING: the prayer's wording is very probably ancient (it reads as a Gelasian collect), and 103(b) would free it if a pre-1931 public-domain printing of it could be produced. None of the three tracked missal witnesses carries it. So the correct operational result is: not publishable from this facsimile on the evidence available here; a sacramentary edition outside this run might change that. || THREE-BOOK SWEEP ADDED IN THE SECOND PASS. The lane's first pass swept the 1862 alone. On the coordinator's rule that new-matter needs the whole shelf behind it, I re-swept all three tracked public-domain witnesses -- 1862 Pustet (108,905 lines), 1604 Vatican typica (63,205 lines), 1570 Venice (84,443 lines), the last two with long s folded to s -- on rare word PAIRS taken adjacent in the 1962 text and matched fuzzily (>=0.85 character similarity, same initial letter) within a twelve-word window, so neither a lost ornamental capital nor a damaged accent can hide a hit. POSITIVE CONTROL for the procedure: it fires on prayers this lane proved present (oblationibus+hostiarum 3 hits in the 1862, hostiarum+initiata 2, productum+silice 1, paschalia+inflammari 1, illustras+conserva 1, segetum+spinarum 1). RESULT: zero in all three books on every distinctive pair -- veteris+hereditariam, posteritatis+successerat, solvisti+conformes, imaginem+naturae, naturae+portavimus, portavimus+imaginem, portemus+eundem, imaginem+terreni, terreni+naturae, terreni+portavimus. Single tokens: posteritatis and successerat occur nowhere in any of the three."

