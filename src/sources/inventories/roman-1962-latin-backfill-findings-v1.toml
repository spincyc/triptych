corroboration = "1922 Mame at artifact PDF p. 821, alignment 0.64"
evidence = "VARIANT, not absent. The 1862 (text-layer lines 73317ff.) and the 1922 Mame both print a closely related Postcommunion for St Raymund Nonnatus: from 'mysterio satiatis' onward the two run together word for word, including the whole petition 'ut, intercedente ... in gratiarum semper actione maneamus'. What differs is the opening clause: the 1962 names the Corpus et Sanguis, the antecedent does not, and the saint named in the middle is Raymund and not John. Three of fifteen content words are missing from the antecedent, and they are the ones that carry the difference. Half a prayer corroborated is not a prayer corroborated, so this is recorded as variant and NOT proposed for publication on this witness. St John Bosco was canonised in 1934 and his Mass composed for that canonisation, which is after every one of the four witnesses (1570, 1604, 1862, 1922). The absence is therefore what the calendar's date predicts."

