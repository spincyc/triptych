]
corroboration = "1604 and 1570 swept whole; neither carries it. The Benziger 1962 conformed printing does carry it, as expected of the same edition, but its rights status is unresolved and it is never a publication basis."
evidence = "Swept whole, end to end, by canon-folded 3-gram and character probe: the Pustet 1862 (108,905 lines), the 1922 Mame (1,162 pages), the 1604 and the 1570. Not a failed grep: I opened the leaf where 23 November falls in both books. The 1922 Mame at printed p. 761-762 (artifact PDF pp. 875-876) prints 'DIE 23 NOVEMBRIS / SANCTI CLEMENTIS I PAPAE ET MART.' with a wholly different formulary - Collect 'Deus, qui nos annua beati Clementis Martyris tui atque Pontificis solemnitate laetificas', Secret 'Munera tibi, Domine, oblata sanctifica', Postcommunion 'Corporis sacri, et pretiosi sanguinis repleti libamine'. The Pustet 1862 prints that same pre-1955 Collect at text-layer line 79137. Neither book carries the 1962's three orations in any place. They are the Commune Summorum Pontificum formulary, which guidance/propers-for-agents.md records as having no Common in any pre-1931 Missal. The 1862 does contain the phrase 'gregem tuum, Pastor aeterne' exactly once, at text-layer lines 40990-40999 - but inside the PREFACE OF THE APOSTLES ('Vere dignum et justum est... ut gregem tuum Pastor aeterne non deseras: sed per beatos Apostolos tuos continua protectione custodias'), a different text of a different genre that merely shares the vocative. That is a shared address, not a variant of this Collect, so the verdict is absent rather than variant. Positive control: the same search, run on this lane's other 91 targets, located each of them in a public-domain witness at 0.76-1.00 coverage, and located this mass's neighbours on the same leaves - so the search would have found these texts had they been there. An exact-substring probe was also tried and discarded because its own controls failed."

