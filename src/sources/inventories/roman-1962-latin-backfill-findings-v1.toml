evidence = "The Commune unius aut plurium Summorum Pontificum is not printed in any of the four public-domain witnesses. This was established by opening the leaf where it would stand, not by a failed search: the 1862 Pustet Commune Sanctorum opens at text-layer line 79496 with In vigilia unius Apostoli and runs straight into Commune unius Martyris Pontificis at line 79578, with no Summorum Pontificum formulary between them; the 1922 Mame Commune opens on artifact PDF pp. 879-880 (printed pp. 1*-2*) with the Common of an Apostle and its printed p. 3* (PDF p. 881) is already Commune unius Martyris extra tempus paschale. Each oration was then swept end to end against all four witnesses by its rarest interior words, not by its incipit alone, and every one returns chance-level agreement (0.14-0.54) where present orations return 0.90-0.99 in the same run; the Benziger reading of the same 1962 text returns 0.87-0.97, which is the positive control that the target text itself is sound. This Common is a twentieth-century addition postdating all four witnesses, so 17 U.S.C. 103(b) gives no public-domain basis for it here. It is NOT publishable on this evidence. What I did not check: post-1922 but pre-1931 printings, which the repository does not hold. the CMAA text layer drops the ornamental initial of the first word; the opening word is taken from this repository's own recorded incipit for this oration"

