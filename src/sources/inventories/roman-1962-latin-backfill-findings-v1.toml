  "1962 sets `Responde mihi!` with an exclamation and repeats the refrain in full after each verse of section II; 1862 sets `responde mihi.` and abbreviates the refrain to the cue `Chorus: Popule meus.` That is the 1962's typographic expansion of a cue, not a different text.",
