corroboration = "none attempted for the seven that match; the 1604 and 1570 were not consulted on this item"
evidence = "THIS IS ONE WORK-LIST ITEM COVERING EIGHTEEN PRINTED TEXTS, and its single verdict is the pessimistic one because two of the nine petitions are not corroborated. THE COORDINATOR SHOULD SPLIT IT. Seven of the nine petitions -- invitatory and collect alike -- stand verbatim in the 1862 and are as publishable as anything in this lane; the fourth is a 1955 substitution and the eighth carries John XXIII's 1959 revision, and neither may be published from this facsimile. If the item stays whole it must stay `variant`, because half a body corroborated is not a body corroborated. I did NOT verify the invitatory pointing on the page images; the chant staves make the text layer's commas and colons unreliable for the nine invitatories specifically, and a publication pass should settle those on images."

