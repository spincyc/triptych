corroboration = "Swept end to end by folded character 7-grams over the whole of four public-domain witnesses -- Pustet Ratisbon 1862 (1,572,371 folded characters), Tours Mame 1922 (1,681,602), Vatican typica 1604 (1,305,147) and Venice 1570 (1,046,101), appendices and Commons included -- on the incipit and on distinctive interior words together, over the column-correct -raw extractions. Positive control: the same index and the same query located 99 of this lane's other 103 orations at char-level agreement 0.893-0.994."
evidence = "Absent, and the leaf was opened rather than grepped. The 1962 sends this day to the Commune unius aut plurium Summorum Pontificum, a Common that Pius XII created in 1942 and that no pre-1931 Missal contains at all. The Tours Mame 1922 page image for 26 August (printed p. 701, artifact PDF p. 815, rendered at 300 dpi) was read: it sends S. Zephyrinus to the Commune unius Martyris and prints a wholly different proper Oratio for him. The 1862 files him at its own 26 August (text-layer lines 72493 and 72763) and the sweep found nothing there either. Best char-level agreement anywhere in any of the four public-domain witnesses is 0.53, against 0.893-0.994 for this lane's located orations. The calendar's existing witness-gap typing is correct and should stand. NOT checked: whether some non-Roman or later-than-1931 public-domain printing carries the Commune Summorum Pontificum; this lane holds only the four registered witnesses."

[[findings]]
mass = "commune-summorum-pontificum"
proper = "Collect"
occurrence = 1
