evidence = "Swept all four public-domain witnesses end to end with the same machinery: the whole text of each book was reduced to a letter-only normal form (ae/oe folded to e, j to i, v to u, diacritics stripped, long s folded to s in the 1604 and 1570) and every fourth-word window of the 1962 reading was counted against it. Windows returning any hit at all - 1862: 1 of 16 windows; mame1922: 1 of 16 windows; 1604: 1 of 16 windows; 1570: 0 of 16 windows. Positive control: the identical sweep run on this lane's Ss. Peter and Paul Collect returns 11 of 18 four-word windows in the 1862 and 11 of 18 in the 1922 Mame, on St Barnabas's Collect 6 of 12 and 5 of 12, and on the Nativity of St John the Baptist Collect 2 of 13 and 7 of 13; the search therefore finds these prayers when they are there. This is not a witness gap of position: I opened the leaf where the day stands in both older books. The 1862 prints the commemoration of St Urban I inside the Mass of St Gregory VII on 25 May at text-layer lines 63364-63377 ('Pro commemorat. S. Urbani Papae et Martyris. Oratio.'), and the 1922 Mame prints it at raw-text line 54071 ('Die 25 Maji - Pro S. Urbano I Papa et Mart.'); in BOTH books the prayer there is 'Da, quaesumus omnipotens Deus: ut, qui beati Urbani Martyris tui atque Pontificis solemnia colimus...', which is a different petition from the 1962's. The 1962 Collect is the first oration of the Commune unius aut plurium Summorum Pontificum, the Common that entered the Missal in 1942 with the Mass Si diligis me, and the calendar entry itself records that this day takes its orations from that Common. No pre-1931 book carries it."

