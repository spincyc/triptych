evidence = "THIS IS THE DOCUMENTED CEILING, NOT A READING FAILURE. Albert the Great was canonised and declared a Doctor of the Church by Pius XI in December 1931 and his Mass entered the Missal after that. No pre-1931 printing can carry it, and guidance/propers-for-agents.md already names him among the cases established on 2026-08-08. The right disposition for this row is `witness-gap` against the witnesses actually consulted -- NOT `rights-withheld` against the 1962 typica, which would assert something about that edition the repository's own rights record denies. SWEEP BEHIND THIS FINDING. Four public-domain witnesses were searched WHOLE, not positionally: the tracked Pustet Ratisbon 1862 (108,905 lines, main sanctoral plus its APPENDIX MISSARUM PROPRIARUM at lines 101726-106552 and its FESTA NOVISSIMA at 106553 onward, whose only added feasts are 27 April, 13 September and 17 October), the 1604 and 1570 (degraded, corroboration only), and the 1922 Tours Mame including its Missae pro aliquibus locis appendix at PDF pp. 1031-1127 and its alphabetical index of all feasts at PDF pp. 1128-1136. Tokens used, on a consonant-skeleton matcher that survives accent and ligature damage: `magisterii`, `inhaerere vestigiis`, `divinae fidei subicienda magnum`, `luce perfecta fruamur`, `pio consequamur affectu`, `hostium nos impugnatione defende`, `perpetua pace respirare concede`. POSITIVE CONTROL: the same matcher, on `mansionem praeparasti` from the Gertrude Collect that sits on the very leaf in question, returns 1862 line 78586 and Mame PDF p. 872 -- so the search would have found Albert's text had it been there. AND THE LEAF WAS OPENED, not merely searched: the 1862's 15 November is S. Gertrudis Virginis (text-layer line 78574, between 13 November Didacus at 78554 and 17 November Gregory Thaumaturgus at 78598), and the 1922 Mame's 15 November was read on its 400 dpi PAGE IMAGE at PDF p. 872, printed p. 758, which prints DIE 15 NOVEMBRIS / SANCTAE GERTRUDIS VIRGINIS directly under the end of 14 November and runs on to 17 November. Neither book has a 15 November Albert to print. The only `Albert` anywhere in the 1862 is S. Adalbertus at 23 April in its appendix (line 102841); the only three in the Mame are the archbishop's imprimatur signature, a calendar line for S. Joannes Gualbertus, and the same at PDF p. 768. No clause of this Collect stands in any of the four witnesses."

