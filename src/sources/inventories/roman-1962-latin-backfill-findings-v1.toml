corroboration = "1604 at line 27494 reads `Ego quidem plantaui te vineam meam speciosissima[m]: et tu facta es mihi nimis amara` (long s as f, u for v), independently corroborating the 1862's shorter reading and confirming that `electam` entered with the 1955 Ordo rather than being dropped by the Pustet | 1604 and 1570 swept whole in the second pass; see notes."
evidence = "A single adjective decides this. Everything else in eighteen verses, two antiphons, a hymn of eight stanzas and a doxology is identical, and the divergence is corroborated in two public-domain witnesses, so there is no doubt about which book carries which reading. If the coordinator wants this text published it can have all of section II, all of section III and all of section IV on the 1862; what it cannot have is the third improperium of section I as the 1962 prints it. I did NOT check whether `electam` appears in any other pre-1931 printing -- the 1570's OCR of this passage was not legible enough to read. || SECOND-PASS CHECK OF THE GAP THE FIRST PASS LEFT OPEN. The first pass recorded that it had not checked whether the 1962's added adjective stands in any other pre-1931 printing. It does not. Sweeping all three books on adjacent rare pairs: plantavi+vineam fires (1862 twice, 1604 once) and vineam+speciosissimam fires (1862 once), so the verse itself is squarely present in the older books; but vineam+electam and plantavi+electam return zero in the 1862, the 1604 and the 1570 alike. The 1962's reading is not corroborated anywhere on the public-domain shelf, and the variant verdict stands on all three witnesses rather than on one."

