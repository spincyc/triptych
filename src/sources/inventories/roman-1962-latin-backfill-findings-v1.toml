# The backfill published 1,034 Latin oration bodies and left 100 unpublished.
# The verdicts below are why. They are kept because the reasoning cost more than
# the reading did: each rests on a sweep of the four public-domain witnesses, and
# without it a later pass re-derives an answer this one already has.
#
# `blocked` is the only class likely to become publishable. The collation stands
# and the stored 1962 string was recogniser damage rather than a page reading, so
# what those need is eyes on a page image, not another sweep.
#
# `absent` means no pre-1931 witness prints the text. The bound is a TEXT's first
# publication, not a saint's canonisation -- St John Leonardi was canonised in
# 1938 and his Mass is in the 1922 Mame as a Blessed.
#
# `variant` means a witness prints a recognisably related prayer whose WORDS
# differ, so 17 U.S.C. 103(b) does not reach the 1962's form of it.
#
# `new-matter` means the 1955 or 1960 reform composed it.
#
# The rules these verdicts were reached under are in
# guidance/propers-for-agents.md; the rights position is in
# missale-romanum-1962-facsimile-rights-v1.toml.

