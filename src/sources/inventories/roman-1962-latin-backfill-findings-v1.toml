[[findings]]
mass = "palm-sunday"
proper = "Oration to Conclude the Procession"
occurrence = 1
section = "seasonal"
verdict = "new-matter"
confidence = "high"
lane = "passiontide"
target_locus = "printed p. 135, no. 843; artifact PDF p. 216, right column, under 'Oremus. Oratio' after rubric 22"
corroboration = "Neither further witness prints it. The pre-1955 rite has NO oration at the end of the procession at all: the 1862 goes straight from Ingrediente Domino (lines 28857-28867) to 'Deinde celebratur Missa' at line 28871, and the 1570 and the 1604 do the same. The 1955 reform created the slot as well as filling it."
evidence = "WHAT I ACTUALLY CHECKED, AND ONE PARTIAL OVERLAP A REVIEWER SHOULD SEE. Continuous reading of the 1862's Palm Sunday formulary at lines 28094-29005 (printed pp. 130-138) plus a whole-book sweep. 'Rex ac Redemptor' none; 'Redemptor noster' none; 'gestantes' none; 'decantavimus' none; 'solemnes laudes' none; 'deportati' none; 'profligata' none; 'quocumque hi rami' none - the nine whole-book hits for 'quocumque' are all other contexts (the Epact rubric, 'quocumque introibat in vicos', 'quocumque loco', 'quocumque perrexeris'). 'illusione' returns exactly one hit in the whole book, at line 11382, 'diabolica illusione' in the general rubrics on Communion. The letterform-folded whole-book regex for 'rexacredemptor', 'ramosgestantes', 'solemneslaudesdecantauimus', 'quocumquehirami', 'daemonuminiquitate' and 'illusioneprofligata' returns nothing. THE PARTIAL OVERLAP: the clause 'dextera tua protegat, quos redemit' is NOT new - it stands in the 1862 at lines 28491-28493, in the second oration of the pre-1955 blessing of palms, 'Deus, qui dispersa congregas', which ends 'et omni adversitate effugata, dextera tua protegat, quos redemit Iesus Christus Filius tuus Dominus noster.' The 1955 composer reused that cadence with a different ablative absolute in front of it. One reused clause inside an otherwise new prayer does not make the prayer preexisting, and half a prayer corroborated is not a prayer corroborated. CONCLUSION: 1955 new matter; not publishable from the facsimile."

