[[findings]]
mass = "palm-sunday"
proper = "Blessing of the Palms"
occurrence = 1
section = "seasonal"
verdict = "variant"
confidence = "high"
lane = "passiontide"
target_locus = "printed p. 130, no. 827; artifact PDF p. 211, right column, under 'Oremus. Oratio' after rubric 7"
antecedent_locus = "printed p. 134 (folio marker at text-layer line 28498); text-layer lines 28564-28574, under the heading 'Oremus.' at line 28562. It is the FIFTH and last oration of the pre-1955 blessing of palms, after 'Petimus, Domine sancte' (28457-28473), 'Deus, qui dispersa congregas' (28479-28501), 'Deus, qui miro dispositionis ordine' (28504-28544) and 'Deus, qui per olivae ramum' (28547-28559)."
differences = [
  "THE VERDICT TURNS ON THIS ONE. 1962 reads 'hos palmarum (seu olivarum aut aliarum arborum) ramos'; 1862 reads 'hos palmarum seu olivarum ramos'. The three words 'aut aliarum arborum', and the parentheses that mark the whole as an alternative, are target matter with no pre-1931 witness. They match rubric 7 of the 1955 rite on the facing column, which directs the celebrant to say hos palmarum ramos, or hos olivarum ramos, or hos arborum ramos as suits the branches - i.e. the parenthesis is part of what 1955 built.",
  "1962 reads 'hodierno die'; 1862 reads 'hodierna die'. A change of the gender of dies, not an orthographic variant.",
  "1962 sets no comma before 'et opus misericordiae'; 1862 sets one",
  "1862 sets no comma after 'quaesumus'",
  "1862 conclusion is the short cue 'Per Dominum.'; 1962 writes 'Per Christum Dominum nostrum.' These are two different conclusion formulas rather than one at two lengths - but see corroboration: the 1570 prints 'Per Christum Dominum nostrum' here, so this difference is the 1862's own and NOT a 1955 contribution.",
]
corroboration = "Both further public-domain witnesses were read by eye at their Palm Sunday runs, not searched. Venice 1570 at text-layer lines 24752-24761 reads (long s as f throughout) 'Bene dic quaesumus domine hos palmarum seu olivarum ramos: et praesta, ut, quod populus tuus in tua venerationem hodierna die corporaliter agit, hoc spiritualiter summa devotione perficiat de hoste victoriam reportando, et opus misericordiae summopere diligendo. Per Christum Dominum nostrum.' Vatican typica 1604 at text-layer lines 24701-24719 reads 'hos palmarum, seu olivarum ramos: et praesta, vt quod populus tuus in tui venerationem hodierna die corporaliter agit, hoc spiritualiter summa devotione perficiat, de hoste victoriam reportando et opus misericordiae summopere diligendo. Per Dom...' - its conclusion is broken at a column edge and I do not read it. So all three public-domain witnesses read 'seu olivarum ramos' with no third option and all three read 'hodierna die'. The two divergences are the 1955 book's and not scan damage. Recorded as corroboration only; these are degraded-latin artifacts and no claim rests on a raw search over them."
evidence = "NOT PUBLISHABLE ON THIS WITNESS as the 1962 prints it. The body of the prayer from 'ramos: et praesta' to 'summopere diligendo' is word-for-word the 1862's and is plainly preexisting; what is uncorroborated is the parenthetical alternative and the inflection. A coordinator who wanted this oration could reasonably ask whether printing the 1862's own text ('hos palmarum seu olivarum ramos ... hodierna die ... Per Dominum') as an 1862 reading is a separate and available act; that is a different question from the one this lane was asked, and I have not decided it. What I have decided is that the 1962 target text cannot be published on the 1862. Confidence is high on the readings on both sides; it is the verdict boundary, not the evidence, that is the soft part."

[[findings]]
mass = "s-alberti-magni-episcopi-confessoris-ecclesiae"
proper = "Secret"
occurrence = 1
section = "sanctoral"
verdict = "variant"
confidence = "high"
lane = "sanctoral-w-3"
target_locus = "printed p. 719, no. 4107, marked P; artifact PDF p. 800 (15 November)"
antecedent_locus = "printed p. 141 area, Passion-season Secret, text-layer lines 19766-19772; and printed p. 492 area, 26 July S. Annae, text-layer lines 69408-69415"
differences = [
  "THE OPENING CLAUSE IS THE SAME PRAYER: `Sacrificiis praesentibus, Domine, quaesumus, intende placatus:` stands verbatim in the 1862 at line 19766 (and, with the two words transposed, at 69408).",
  "THE PETITION IS NOT. The 1862's first printing continues `ut et devotioni nostrae proficiant, et saluti`; its second inserts a clause naming S. Anne and then ends the same way. The 1962's Albert Secret continues `ut quod Passionis Filii tui Domini nostri mysterio gerimus, beati Alberti intercessione et exemplo, pio consequamur affectu`, which no witness carries.",
  "So the two texts part immediately after `intende placatus:` and share nothing after it but the conclusion.",
]
corroboration = "1862 in two places for the opening clause only; the 1604 and 1570 were swept for the petition and carry nothing"
evidence = "HALF A PRAYER CORROBORATED IS NOT A PRAYER CORROBORATED. This is the same shape as the S. Petri Canisii case the guidance records: a public-domain opening clause with a different petition after it. It is NOT publishable on this witness, and the entry should stay withheld. THIS IS THE DOCUMENTED CEILING, NOT A READING FAILURE. Albert the Great was canonised and declared a Doctor of the Church by Pius XI in December 1931 and his Mass entered the Missal after that. No pre-1931 printing can carry it, and guidance/propers-for-agents.md already names him among the cases established on 2026-08-08. The right disposition for this row is `witness-gap` against the witnesses actually consulted -- NOT `rights-withheld` against the 1962 typica, which would assert something about that edition the repository's own rights record denies. SWEEP BEHIND THIS FINDING. Four public-domain witnesses were searched WHOLE, not positionally: the tracked Pustet Ratisbon 1862 (108,905 lines, main sanctoral plus its APPENDIX MISSARUM PROPRIARUM at lines 101726-106552 and its FESTA NOVISSIMA at 106553 onward, whose only added feasts are 27 April, 13 September and 17 October), the 1604 and 1570 (degraded, corroboration only), and the 1922 Tours Mame including its Missae pro aliquibus locis appendix at PDF pp. 1031-1127 and its alphabetical index of all feasts at PDF pp. 1128-1136. Tokens used, on a consonant-skeleton matcher that survives accent and ligature damage: `magisterii`, `inhaerere vestigiis`, `divinae fidei subicienda magnum`, `luce perfecta fruamur`, `pio consequamur affectu`, `hostium nos impugnatione defende`, `perpetua pace respirare concede`. POSITIVE CONTROL: the same matcher, on `mansionem praeparasti` from the Gertrude Collect that sits on the very leaf in question, returns 1862 line 78586 and Mame PDF p. 872 -- so the search would have found Albert's text had it been there. AND THE LEAF WAS OPENED, not merely searched: the 1862's 15 November is S. Gertrudis Virginis (text-layer line 78574, between 13 November Didacus at 78554 and 17 November Gregory Thaumaturgus at 78598), and the 1922 Mame's 15 November was read on its 400 dpi PAGE IMAGE at PDF p. 872, printed p. 758, which prints DIE 15 NOVEMBRIS / SANCTAE GERTRUDIS VIRGINIS directly under the end of 14 November and runs on to 17 November. Neither book has a 15 November Albert to print. The only `Albert` anywhere in the 1862 is S. Adalbertus at 23 April in its appendix (line 102841); the only three in the Mame are the archbishop's imprimatur signature, a calendar line for S. Joannes Gualbertus, and the same at PDF p. 768."

