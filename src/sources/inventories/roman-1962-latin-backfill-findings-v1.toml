evidence = "Swept whole, end to end, by canon-folded 3-gram and character probe: the Pustet 1862 (108,905 lines), the 1922 Mame (1,162 pages), the 1604 and the 1570. Not a failed grep: I opened the leaf where 3 October falls in the 1922 Mame (artifact PDF pp. 842-843) - the book runs from the Guardian Angels on 2 October straight to St Francis on 4 October, and has no 3 October entry. Searching the whole Mame for her name returns three tokens, all Teresa of AVILA (artifact PDF p. 851, her 15 October feast) plus one calendar entry; Therese of the Child Jesus is nowhere in it. She was canonised in 1925 and her feast extended to the universal Church in 1927, both after this 1922 printing, so the book cannot carry her; the 1862 cannot either. This is the documented post-1931 sanctoral ceiling behaving exactly as expected. The apparent 0.32 alignment in the Mame is spurious: it landed on the Postcommunion of St Jane Frances de Chantal, a different prayer that shares the 'amoris igne' image. Positive control: the same search, run on this lane's other 91 targets, located each of them in a public-domain witness at 0.76-1.00 coverage, and located this mass's neighbours on the same leaves - so the search would have found these texts had they been there. An exact-substring probe was also tried and discarded because its own controls failed."

