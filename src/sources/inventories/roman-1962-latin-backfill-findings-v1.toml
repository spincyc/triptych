  "antecedent witness is the Mame, Tours 1922 (editio quarta iuxta typicam Vaticanam); 76% of the 1962 body's tokens align in order after canon folding",
  "the 1962 writes 'sanctae Teresiae Virginis tuae' where the witness prints 'beati N Apostoli' at the day's-saint slot",
  "the witness text layer damages 'honoére' where the 1962 prints 'honore'",
  "the Mame prints j where the 1962 prints i (Iesum/Jesum, eius/ejus) and its recogniser renders the ae ligature as 'z' or 'e'; both are orthographic",
  "pointing: the antecedent's reading is recorded verbatim above so its commas and colons can be compared, but its punctuation is NOT safely collatable - the recogniser turns commas into full stops, semicolons and question marks - so no punctuation difference here should be read as a difference between the printings",
  "the 1962 prints the conclusion as 'Per Dominum nostrum.'; conclusion length was excluded from the alignment and is recorded here as printed, per the settled rule",
]
corroboration = "Pustet 1862 text-layer lines 53484-53492 (52% coverage); Benziger 1962 conformed printing at line 94838 (62%; comparison only, never a publication basis)"
evidence = "THIS ENTRY NEEDS A REVIEWER'S EYE, because it is the one place where this lane matched a text belonging to a feast the witness cannot contain. St Therese herself is absent from every pre-1931 witness (canonised 1925, feast 1927) and this mass's Collect and Postcommunion are proposed absent for that reason. Her SECRET is different: it is not proper to her at all but a Common formulary, and the 1922 Mame prints it word for word in its Missae votivae section (printed p. 69*, artifact PDF p. 947, read by me on the page image) with 'N.' standing in the saint's slot - 'Sacrificium nostrum tibi, Domine, quaesumus, beati N. Apostoli precatio sancta conciliet: ut, in cujus honore solemniter exhibetur, ejus meritis efficiatur acceptum.' The same Mame prints it again at artifact PDF p. 809 with 'beati Laurentii' in that slot. The 1962 writes 'sanctae Teresiae Virginis tuae' there and changes nothing else. Under the maintainer's ruling of 2026-09-03 that filling a rubrical blank is not authorship, that is matched; but the witness's slot carries an Apostle's designation rather than a Virgin's, so the substitution spans a title as well as a name, and I have set confidence to medium and flagged it rather than let it pass silently. I did NOT locate a Virgin-form instance of this formula in the Mame's Commune Virginum. The antecedent reading is taken from that witness's text layer, not from a page image, so its letterforms are inferred rather than read; only the 1962 target was read on a page. I did not collate the antecedent's Introit, readings, chants or any Secunda Oratio / Alia Secreta / Alia Postcommunio. || DOWNGRADED by the coordinator to variant. The rubrical-blank ruling covers a NAME written into a slot the rubric leaves open; here the witness prints 'beati N. Apostoli' and the 1962 'sanctae Teresiae Virginis tuae', so besides the name two words change - beati to sanctae and Apostoli to Virginis tuae, a different order of saint. Under the settled rule a transformation changes how a word is spelled and a variant changes which word is said, so this is a variant. The lane flagged it rather than letting it pass."

