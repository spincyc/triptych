antecedent_locus = "1862 Pustet: printed p. 548, text-layer lines 75201-75212, under the heading Oratio. at line 75199, inside the formulary headed at lines 75188-75198 (In Festo B. Mariae Virginis [de Mercede], with the directive Missa. Salve sancta Parens ... praeter Orationes sequentes). The folio marks at lines 75123 (548) and 75249 (549) bound it. This agrees with the locus the calendar entry already records for this day - leaf n633 of Internet Archive item bub_gb_E7sPAAAAIAAJ, printed page 548 - and is the same text reached here through the tracked text-layer artifact rather than through that item. Read from the text layer alone; this book's page images are not available to this lane. Like the 1962 and like the Mame, the 1862 prints ONE proper oration for this day and no proper Secret or Postcommunion: line 75214 onwards leaves the formulary and line 75218 opens Die xxv."
differences = [
  "The 1862 sets no comma after Matrem",
  "The 1862 sets a full stop after paganorum where the 1962 sets a comma",
  "The 1862 sets no colon after es",
  "The 1862 sets no comma after intercessione",
  "The 1862 sets a comma after omnibus where the 1962 sets none",
  "The 1862 sets Paganorum with a capital",
  "The 1862 reads eumdem where the 1962 reads eundem",
  "The 1862 does not carry the words Christi that close the 1962 text (conclusion length; see notes)",
  "The 1922 Mame spells liberandos as lJiberandos",
  "The 1922 Mame sets no colon after es",
  "The 1922 Mame sets Operis with a capital",
  "The 1922 Mame reads eumdem where the 1962 reads eundem",
]
corroboration = "Both public-domain witnesses carry the whole oration: the 1862 Pustet (text layer, printed p. 548) and the 1922 Mame (text layer AND 400 dpi page image, printed p. 724). The 1604 and 1570 were not searched. That is a deliberate omission and is recorded as one: the feast of B. Mariae Virginis de Mercede was extended to the universal Church in 1696 and cannot be in a 1570 or a 1604 book, so a negative there would carry no information, and two witnesses already print the text whole."
evidence = "This is the strongest single result in this lane: forty-five words, every one of them read on a page image in at least one public-domain witness, and the 1962 and the Mame agree on all forty-five. Only three differences of any kind, and all three are inside the settled tolerance - the Mame prints ejus where the 1962 prints eius, it prints eumdem where the 1962 prints eundem, and it uses the French spacing before its colon and semicolon. The conclusion is the SAME LENGTH in all three books here (Per eundem Dominum.), which is unusual in this backfill and worth a reviewer noting. WHAT THIS DOES NOT SETTLE: the calendar entry for this day carries the 1862's wording and says in terms that the two books are not asserted to agree. They do agree, and that is now established on the 1962's own page image. WHAT I DID NOT CHECK: the 1862's pointing, for the usual reason. ONE OBSERVATION A REVIEWER SHOULD HAVE, outside this lane's work list: the 1962 prints, immediately after this Collect, a Secreta at no. 3708 and a Postcommunio at no. 3709 whose incipits are Tua, Domine, propitiatione and Sumptis, Domine, salutis nostrae subsidiis - the same two texts this lane's work list assigns to 21 November. They are the Common of the Blessed Virgin's Secret and Postcommunion, and the 1962 prints them in more than one place. Neither the 1862 nor the Mame prints them here. That does not affect this entry, whose scope is the Collect alone, but it does mean the day's rubric (praeter orationem sequentem, singular) and what the page actually sets are worth one look before anything is landed for 24 September beyond the Collect. AN UNEXPLAINED MARGINAL LETTER: this page sets a single capital in the outer margin beside each oration heading (P beside Oratio, C beside Secreta and Postcommunio). It is apparatus, not text; every extraction in this lane excludes it, and the Benziger picks it up as a stray token. || QUARANTINED: recogniser damage (pie); needs re-reading on a page image."

