corroboration = "Swept all four public-domain witnesses end to end by character 5-gram similarity over the whole book (1922 Mame 1162 pages, 1862 108905 layer lines, 1604, 1570): best window similarity 0.18-0.35, which is noise. Positive control: the same routine finds the Vigil Collect of 14 August in the Mame at 0.74 and the Purification Collect in the 1862 at 0.65. I also opened the leaf where the day stands: 1922 Mame printed pp. 691-692, Die 15 Augusti, In Assumptione B. Mariae Virg., which prints the old Gaudeamus formulary (Oratio Famulorum tuorum, Secreta Subveniat Domine plebi tuae, Postcommunio Mensae caelestis participes) at 300 dpi."
