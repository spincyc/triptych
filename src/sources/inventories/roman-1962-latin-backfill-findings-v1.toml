differences = [
  "COLLATED MECHANICALLY, word by word, after normalising case, punctuation, i/j and ae/oe: 586 words in the 1962 against 593 in the Mame, sequence ratio 0.957, and exactly SEVENTEEN diff blocks. Nine of them are the Mame's French colon spacing (a space before the colon makes it a separate token) and one is eumdem against eundem. The remaining seven form ONE contiguous divergence.",
  "THE DIVERGENCE: the 1962's final petition (1962 words 530-562, the sentence beginning Respice etiam ad eos) is a different petition from the Mame's, which is the imperial commemoration (Respice etiam ad devotissimum Imperatorem nostrum N., cuius tu, Deus, desiderii vota praenoscens ... tranquillum perpetuae pacis accommoda: et caelestem victoriam cum omni populo suo). The two share only the formulaic ineffabili pietatis et misericordiae tuae munere and the closing cum omni populo tuo/suo.",
  "Everything else is verbatim: 553 of the 1962's 586 words stand in the Mame in the same order.",
  "Orthography and pointing, not counted as substance: 1962 iam/Iesum/iustum/eius/huius/cuius against Mame jam/Jesum/justum/ejus/hujus/cujus; 1962 Mare Rubrum and cereus iste against Mame mare Rubrum and Cereus iste; 1962 sets a comma after patres nostros and after Ut and after Qui licet where the Mame sets none; 1962 sets no comma after victoria, after omnipotentem or after lampadis where the Mame does; 1962 lowercases et nox illuminatio where the Mame capitalises Et; Mame prints eumdem, 1962 eundem.",
  "Two Mame pointing marks are ambiguous in the scan and I did not repair them: after adornata fulgoribus (printed p. 229) and after aggregare (printed p. 229) the mark reads as a single low dot at 400 dpi, most likely a colon and a comma with the upper dot broken. Recorded as read.",
]
corroboration = "1862 text layer at line 34233 (Imperator and coronatus tokens, the pre-1955 imperial petition with its Si non est coronatus rubric) - corroborating the ANTECEDENT reading, not the target. Negative sweep for the 1962 petition's distinctive tokens across all four public-domain witnesses: operos / opero / ofitate / potestate regunt / cogitationes eorum return 0 hits in the 1862, 1604, 1570 and the column-correct Mame raw extraction; the positive control is that Imperator returns 3/2/0/7 and coronatus 1/0/0/3 in the same files. That sweep is weak on its own, because all four books set the Praeconium to chant and syllabify it in their layers - which is why the finding rests on the Mame PAGE IMAGE at printed pp. 237-238, where the imperial petition is printed in full and the 1962's petition is not there."
evidence = "WHAT CHANGED FROM THE TWO EARLIER LANES: they reported blocked because no text layer yields the string. The string is now had - I transcribed all ten 1962 pages and all eleven Mame pages off the page images at 400 dpi, and the target_text_1962 above is complete, passes scripts/_latin_body_damage.py clean, and is the whole Praeconium from Exsultet to R. Amen. What the transcription then revealed is why this row cannot be matched: the 1955 reform did not merely move this text, it REPLACED one petition in it. The Praeconium is otherwise ancient and stands verbatim in a 1922 public-domain book, but 103(b) runs per text and the text the 1962 prints contains a sentence the 1962's antecedents do not. Publishing the whole body on the Mame would be publishing 33 words that the Mame does not carry. WHAT I DID NOT CHECK: whether some other pre-1931 printing (a missal for a republic, where the imperial commemoration had to be adapted) carries the 1955 wording; I read only the four registered witnesses. If the coordinator wants this row published, the tractable route is to publish the body with the divergent petition excised or flagged, which is an editorial decision above my level, not a collation finding."

