evidence = "This is the one oration of the seven whose antecedent was read on a page image rather than inferred from a text layer, and it settles the only place where the two public-domain witnesses disagree with each other: the 1862 layer reads suae, where the 1962 reads suo, and the Mame page image prints suo, plainly. The 1862 reading is that book's recogniser, which damages this whole passage (bedtae, Marfce, tuse, recens6mus, suortimque within four lines). The Mame prints the French spacing before its colons and semicolon, prints Jesu for Iesu and cruce for Cruce, and ends at the short cue Qui vivis. where the 1962 writes the conclusion out. ANTECEDENT PLACEMENT: The 1862 files this Mass NOT in its Temporale but in its sanctoral run Festa Martii, under the heading 'In Festo' with the running head 'Festum VII. Dolorum B. M. Virg.' (line 59852) and a date-line rubric tying it to the Friday after Passion Sunday (lines 59747-59766). Its September observance, at Festa Septembris (Dom. III - 15. 16.), line 74314, prints no formulary at all: it directs the reader back to this one, 'sub mense Martii fol. 419'. So the 1862 prints ONE Seven Sorrows Mass and the 1962 prints two; the day moved and the words did not. The 1922 Mame also files it in its March sanctoral, printed pp. 561-564 = artifact PDF pp. 675-678 (offset checked on the page image: the printed folio 561 stands in the head of PDF p. 675, 562 on p. 676, 563 on p. 677, 564 on p. 678; pdf page = printed page + 114). Unlike the 1862 the Mame ALSO prints a separate September formulary at PDF pp. 828-829, so the Mame is the witness that can separate the two settings. || QUARANTINED by the coordinator: stored target carries recogniser damage (OfFerimus) rather than a page reading. The collation stands; the words need re-reading on a 1962 or 1922 page image."

