evidence = "WHAT I CHECKED FOR THE NEGATIVE. I searched the whole 1862 text layer, flattened for the scan's double spaces and rejoined across hyphenated line breaks, for `Per lignum servi`, `lignum servi`, `sed.xit nos`, `Salv.tor mundi`, `auxili.re nobis`, `Cruc.m et S.nguinem` and `deprec.mur, Deus noster`. `Salvator mundi` has five hits, all of them Christmas or Trinity texts; the rest have none. I also read the 1862's own rubric for this moment of the rite (lines 33156-33204) rather than resting on a failed grep. WHY variant AND NOT absent OR new-matter. `absent` would be false because the first antiphon's words are in the book, filed under the votive Mass of the Holy Cross -- the brief's `filed under a different day` case exactly. `new-matter` would be false for the same reason. The set as the 1962 prints it is not corroborated, and that is `variant`. IF THE COORDINATOR SPLITS THIS ITEM: antiphon 1 is `matched` on 1862 appendix page [48], lines 85068-85072; antiphons 2 and 3 are `new-matter` of the 1955 Ordo. || SECOND-PASS THREE-BOOK SWEEP. arboris+seduxit, liberati+arboris, redemit+salvator, auxiliare+deprecamur, redemisti+auxiliare, redemisti+lignum, fructus+arboris and fructus+seduxit all return zero in the 1862, the 1604 and the 1570; sanguinem+redemisti fires twice in the 1570 only and sanctam+liberati in the 1862 and the 1570. Partial corroboration, scattered, and not of these antiphons as the 1962 prints them: the variant verdict stands."

