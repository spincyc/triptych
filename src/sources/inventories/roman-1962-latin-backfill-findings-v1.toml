corroboration = "Two independent public-domain printings carry the poem whole - the 1862 Pustet (text layer) and the 1922 Mame (text layer plus 400 dpi page images) - and BOTH ALSO DIRECT, IN TERMS AND FOR THIS VERY DAY, THAT ALLELUJA IS ADDED AFTER THE SEQUENCE. The 1862, at Dominica III. Septembris - In Festo VII. Dolorum B. M. Virginis, text-layer lines 74314-74324: Missa dicatur ut in alio Festo Septem Dolorum posito sub mense Martii fol. 419, praeter Orationem sequentem, et post Sequentiam additur Alleluja, quod omittendum erit in fine Gradualis. The 1922 Mame, at Die 15 Septembris, PDF p. 828 right column lines 32-36, read on the page image: Missa Stabant, ut in fine mensis Martii 561, praeter Orationem seq., Alleluja Stabat ut infra, et addendo Alleluja in fine Sequentiae. The 1604 and the 1570 were swept end to end on three separate strophes and return nothing above noise (best 3 of 15 skeleton tokens). That is the expected result and not a failure: the Stabat Mater entered the Roman Missal in 1727, long after both books, and the sweep is the positive control showing this lane searched them rather than assuming them."
evidence = "EVERY WORD OF THIS SETTING IS NOW ACCOUNTED FOR IN PRE-1931 PRINT, INCLUDING THE TRAILING ALLELUIA. 216 of the 217 words stand verbatim in both public-domain witnesses, in the single printing each book gives the poem under its March formulary. The 217th, the trailing Alleluia., is not printed at the end of either book's poem - and it does not need to be, because both books carry an explicit rubric AT 15 SEPTEMBER directing that Alleluja be added after the Sequence on this day. See corroboration for both rubrics quoted from their own lines. So the September setting is not a 1962 composition and is not even a 1962 arrangement: it is the older books' own instruction, carried out in type by a later printer. THE TWO COMMAS GO THE SAME WAY. Both witnesses print the comma after fleret in the fifth strophe and after stare in the fourteenth, which the 1962 prints HERE and not at the Friday after Passion Sunday. So all three of the points where the calendar records the two 1962 settings as differing are now attested in public-domain print or public-domain rubric for this day, and none of them is new matter. Both witnesses also carry the votive-omission rubric that the 1962 prints only here. HOW THIS ENTRY WAS RE-TESTED. Every whole-witness sweep behind it was re-run against the column-correct extractions of both PDF witnesses after the coordinator's correction about pdftotext -layout, and one factual error was found and is recorded in antecedent_locus_1922_mame. The per-page readings were never at risk: this lane extracted every target and Mame page from word bounding boxes with the page's own gutter from the start, and read the page images besides. NOT CHECKED: the Mame's pointing glyph by glyph - its text layer fuses adjacent words in three places (Juxiacrucem, Quisest, neurar) and those are layer artefacts, not readings; and the 1862's pointing at all, because its recogniser damages commas and turns printed accents into digits throughout. || QUARANTINED: stored