evidence = "THE SINGLE MOST IMPORTANT FINDING FOR THIS PROPER. Both public-domain witnesses print the Sequence with the votive-omission rubric that the 1962 prints only at 15 September, and both end Paradisi gloria. Amen. with no Alleluia, which is how the 1962 ends it HERE and not at 15 September. Both also print the comma after fleret in the fifth strophe and after stare in the fourteenth, which the 1962 prints at 15 September and not here. So the wording of this setting is preexisting in full; the three-place pointing that the calendar records as separating the two 1962 settings is 1962 typography, not new composition, and 103(b) does not reach it. AND THE DISTINCTION ITSELF IS THE OLDER BOOKS' OWN: each of them prints this poem once, ending Amen., for the March use, and each carries a separate rubric AT THE SEPTEMBER DAY directing that Alleluja be added after the Sequence there - the 1862 at its text-layer lines 74314-74324, the 1922 Mame at printed p. 714 = artifact PDF p. 828, right column lines 32-36, read on the 400 dpi page image. So the very difference between the 1962's two settings is prescribed by both antecedents, and neither setting is new matter. The 1962 prints incliti where both witnesses print inclyti - read on the 400 dpi page image; the Benziger reads inclyti and is wrong. NOT CHECKED: the Mame's pointing glyph by glyph; its text layer fuses adjacent words in several places (Juxiacrucem, Quisest, neurar) and those are layer artefacts, not readings. ANTECEDENT PLACEMENT: The 1862 files this Mass NOT in its Temporale but in its sanctoral run Festa Martii, under the heading 'In Festo' with the running head 'Festum VII. Dolorum B. M. Virg.' (line 59852) and a date-line rubric tying it to the Friday after Passion Sunday (lines 59747-59766). Its September observance, at Festa Septembris (Dom. III - 15. 16.), line 74314, prints no formulary at all: it directs the reader back to this one, 'sub mense Martii fol. 419'. So the 1862 prints ONE Seven Sorrows Mass and the 1962 prints two; the day moved and the words did not. The 1922 Mame also files it in its March sanctoral, printed pp. 561-564 = artifact PDF pp. 675-678 (offset checked on the page image: the printed folio 561 stands in the head of PDF p. 675, 562 on p. 676, 563 on p. 677, 564 on p. 678; pdf page = printed page + 114). Unlike the 1862 the Mame ALSO prints a separate September formulary at PDF pp. 828-829, so the Mame is the witness that can separate the two settings. RE-TESTED: every whole-witness sweep behind this entry was re-run against the column-correct extractions of both PDF witnesses after the coordinator's correction about pdftotext -layout. The single locus for this poem in the Mame (PDF pp. 676-677) and the two loci in the 1962 (PDF pp. 581-582 and p. 738) are confirmed at 12 of 12 and 15 of 15 skeleton tokens against noise of 4 or less. No page reading in this entry ever came from a -layout extraction: every target and Mame page here was rebuilt from word bounding boxes with the page's own gutter. || QUARANTINED: stored target carries recogniser damage (posset) rather than a page reading. The collation stands; the words need re-reading on a 1962 or 1922 page image."

