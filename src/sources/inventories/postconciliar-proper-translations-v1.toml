match_coverage = 0.9062
ancient_reading = "Deus, qui errantes ut in via possint redire, veritatis tuae lumen ostendis, da cunctis, qui Christiana professione censentur, et ilia respuere quae huic inimica sunt nomini, et ea quae sunt apta sectari."
divergence = """
The Gelasian reads *Deus qui errantes, ut in via possint redire*; the Missal reads *errantibus ... in viam*, turning the accusative of the wanderers into a dative and the ablative *via* into an accusative of motion. The English follows the Missal.
"""
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, who show the light of your truth to those who go astray, that they may be able to return to the way, grant to all who are counted by the Christian profession both to reject what is at enmity with that name and to follow after what befits it. Through our Lord.
"""

[[entries]]
