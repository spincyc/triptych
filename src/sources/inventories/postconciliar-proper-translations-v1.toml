`Cf. Ps 66: 2` to the right, then the red repetition cue `And the antiphon is
repeated:` followed by `We adore . . .` in black. All three elements answer this
calendar's recorded Latin, whose own text carries the antiphon, the `Deus
misereatur nostri` verse and the cue `Et repetitur antiphona: Crucem tuam...`

NO GRAIL QUESTION HERE, and it is worth saying why rather than leaving it to be
re-checked. The psalm verse in this chant is Psalm 66(67): 2 in the exemplar's
Vulgate numbering, which this calendar records as `Psalm 67:2` in Hebrew
numbering. The three psalms the exemplar's copyright page reserves to The Revised
Grail Psalms are 23(24), 46(47) and 115(116). Psalm 66(67) is none of them, and
