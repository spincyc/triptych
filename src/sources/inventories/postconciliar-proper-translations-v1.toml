ancient_witness = "Sacramentarium Veronense (Leonianum), ed. C. L. Feltoe (Cambridge, 1896)"
witness_edition_id = "edition.catholic-church.sacramentarium-veronense.feltoe-1896"
witness_artifact_id = "artifact.catholic-church.sacramentarium-veronense.feltoe-1896.ia-djvu-ocr-sacramentariuml00feltgoog"
match_coverage = 1.0
ancient_reading = "Da nobis quaesumus Dne Ds noster in tua semper devotione gaudere quia perpetua est et plena felicitas si bonorum omnium iugiter serviamus auctori"
corpus_orationum = ["934"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Grant us, we beseech you, O Lord our God, always to rejoice in devotion to you, for happiness is lasting and full if we serve without ceasing the author of all good things. Through our Lord.
"""

[[entries]]
mass = "ot-4"
form = ""
proper = "Collect"
incipit = "Concede nobis, Domine Deus noster"
relation = "verbatim"
ancient_witness = "Sacramentarium Veronense (Leonianum), ed. C. L. Feltoe (Cambridge, 1896)"
witness_edition_id = "edition.catholic-church.sacramentarium-veronense.feltoe-1896"
witness_artifact_id = "artifact.catholic-church.sacramentarium-veronense.feltoe-1896.ia-djvu-ocr-sacramentariumle00cath"
match_coverage = 1.0
ancient_reading = "Concede nobis Dne Ds noster ut et te tota mente veneremur et omnes homines rationabili diligamus affectu"
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Grant us, O Lord our God, to worship you with our whole mind, and to love all men with a right affection. Through our Lord.
"""

[[entries]]
mass = "ot-4"
form = ""
proper = "Prayer over the Offerings"
incipit = "Altaribus tuis"
relation = "variant"
ancient_witness = "Sacramentarium Veronense (Leonianum), ed. C. L. Feltoe (Cambridge, 1896)"
witness_edition_id = "edition.catholic-church.sacramentarium-veronense.feltoe-1896"
witness_artifact_id = "artifact.catholic-church.sacramentarium-veronense.feltoe-1896.ia-djvu-ocr-sacramentariuml00feltgoog"
match_coverage = 0.9286
ancient_reading = "Altaribus tuis Dne munera nostrae servitutis inferimus quae placatus accipiens^ et acceptum tibi nostrum quaesumus famulatum et sacramentum nostrae redemptionis efficias*"
corpus_orationum = ["252"]
divergence = """
The Veronense reads *quae placatus accipiens, et acceptum tibi nostrum, quaesumus, famulatum et sacramentum nostrae redemptionis efficias*; the Missal reads *quae, placatus assumens, sacramentum nostrae redemptionis efficias*, dropping the clause about the acceptance of our service and putting *assumens* for *accipiens*. The English follows the Missal.
"""
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
We bring to your altars, O Lord, the gifts of our service, which, receiving them with favour, you may make the sacrament of our redemption. Through Christ our Lord.
"""

[[entries]]
mass = "ot-7"
form = ""
proper = "Collect"
incipit = "Praesta, quaesumus, omnipotens Deus"
relation = "verbatim"
ancient_witness = "Sacramentarium Gregorianum (Hadrianum), ed. H. A. Wilson, HBS 49 (London, 1915)"
witness_edition_id = "edition.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915"
witness_artifact_id = "artifact.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915.ia-djvu-ocr-gregoriansacrame00cath"
match_coverage = 0.9412
ancient_reading = "Presta quaesumus omnipotens deus ut semper rationabilia meditaiites quae tibi sunt placita et /dictis exsequamur [fo. \\2'jv et factis"
corpus_orationum = ["4557a"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Grant, we beseech you, almighty God, that, pondering always what is according to reason, we may carry out what is pleasing to you both in word and in deed. Through our Lord.
"""

[[entries]]
mass = "ot-7"
form = ""
proper = "Prayer over the Offerings"
incipit = "Mysteria tua, Domine"
relation = "verbatim"
ancient_witness = "Sacramentarium Veronense (Leonianum), ed. C. L. Feltoe (Cambridge, 1896)"
witness_edition_id = "edition.catholic-church.sacramentarium-veronense.feltoe-1896"
witness_artifact_id = "artifact.catholic-church.sacramentarium-veronense.feltoe-1896.ia-djvu-ocr-sacramentariumle00cath"
match_coverage = 0.9
ancient_reading = "Mysteria tua Diie debitis7 servitii8 exsequentes supplices te rogamus ut quod ad honorem tuae maiestatis ofiferimus nobis proficiat ad salutem"
corpus_orationum = ["3542"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Carrying out your mysteries, O Lord, with the service that is owed, we humbly ask you that what we offer to the honour of your majesty may profit us unto salvation. Through Christ our Lord.
"""

[[entries]]
mass = "ot-8"
form = ""
proper = "Collect"
incipit = "Da nobis, quaesumus, Domine"
relation = "verbatim"
ancient_witness = "Sacramentarium Gregorianum (Hadrianum), ed. H. A. Wilson, HBS 49 (London, 1915)"
witness_edition_id = "edition.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915"
witness_artifact_id = "artifact.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915.ia-djvu-ocr-gregoriansacrame00cath"
match_coverage = 0.9474
ancient_reading = "Da nobis domine quaesumus ut et mundi cursus pacifico nobis tuo ordine dirigatur et ecclesia tua tranquilla deuotione laetetur"
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Grant us, we beseech you, O Lord, that the course of the world may be directed for us in peace by your ordering, and that your Church may rejoice in tranquil devotion. Through our Lord.
"""

[[entries]]
mass = "ot-8"
form = ""
proper = "Prayer over the Offerings"
incipit = "Deus, qui offerenda tuo nomini tribuis"
relation = "verbatim"
ancient_witness = "Sacramentarium Veronense (Leonianum), ed. C. L. Feltoe (Cambridge, 1896)"
witness_edition_id = "edition.catholic-church.sacramentarium-veronense.feltoe-1896"
witness_artifact_id = "artifact.catholic-church.sacramentarium-veronense.feltoe-1896.ia-djvu-ocr-sacramentariumle00cath"
match_coverage = 0.9615
ancient_reading = "Ds qui offerenda tuo nomini tribuis et oblata devotioni nostrae servitutis adscribis3 quaesumus clementiam tuam ut quod praestas unde sit meritum proficere nobis largiaris ad praemium"
corpus_orationum = ["4011"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, who grant us what we are to offer to your name, and reckon what is offered to the devotion of our service, we beg your mercy, that what you supply as the ground of merit you may bountifully grant to profit us unto our reward. Through Christ our Lord.
"""

[[entries]]
mass = "ot-9"
form = ""
proper = "Collect"
incipit = "Deus, cuius providentia"
relation = "verbatim"
ancient_witness = "Liber sacramentorum Romanae aeclesiae (Gelasianum Vetus), ed. H. A. Wilson (Oxford, 1894)"
witness_edition_id = "edition.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894"
witness_artifact_id = "artifact.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.ia-djvu-ocr-libersacramentorum"
match_coverage = 1.0
ancient_reading = "Deus, cuius providentia in sui dispositione non fallitur, te supplices exoramus, ut noxia cuncta submoveas, et omnia nobis profutura concedas."
corpus_orationum = ["1188"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, whose providence does not fail in what it appoints, we humbly entreat you to put away from us all that is harmful and to grant us all that will profit us. Through our Lord.
"""

[[entries]]
mass = "palm-sunday"
form = ""
proper = "Prayer over the People"
incipit = "Respice, quaesumus, Domine"
relation = "verbatim"
ancient_witness = "Sacramentarium Gregorianum (Hadrianum), ed. H. A. Wilson, HBS 49 (London, 1915)"
witness_edition_id = "edition.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915"
witness_artifact_id = "artifact.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915.ia-djvu-ocr-gregoriansacrame00cath"
match_coverage = 0.9545
ancient_reading = "Respice domine quaesumus super hanc familiam tuam pro qua dominus noster iesus christus non dubitauit manibus tradi nocentium et crucis /subire tormentum"
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Look, we beseech you, O Lord, upon this your family, for which our Lord Jesus Christ did not hesitate to be given over into the hands of the wicked and to undergo the torment of the cross. Who lives and reigns for ever and ever.
"""

[[entries]]
mass = "pentecost"
form = "Mass during the Day"
proper = "Collect"
incipit = "Deus, qui sacramento festivitatis hodiernae"
relation = "variant"
ancient_witness = "Liber sacramentorum Romanae aeclesiae (Gelasianum Vetus), ed. H. A. Wilson (Oxford, 1894)"
witness_edition_id = "edition.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894"
witness_artifact_id = "artifact.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.ia-djvu-ocr-libersacramentorum"
match_coverage = 0.9231
ancient_reading = "Deus, qui Sacramento festivitatis hodiemae universam ecclesiam tuam in omni gente et natione sanctificas, in totam mundi latitudinem Spiritus tui sancti dona defunde®, ut quod inter ipsa evangelicae praedicationis exordia operata est divina dignatio nunc quoque per credentium corda"
corpus_orationum = ["2057"]
divergence = """
The Gelasian reads *Spiritus tui sancti dona defunde, ut quod inter ipsa*; the Missal reads *Spiritus Sancti dona defunde, et quod inter ipsa*, and closes with *per credentium corda perfunde*, where the Gelasian's clause runs on. The English follows the Missal.
"""
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, who by the sacrament of this day's feast sanctify your whole Church in every people and nation, pour out the gifts of the Holy Spirit over the whole breadth of the world, and what your divine goodness worked at the very beginnings of the preaching of the Gospel pour out now also through the hearts of believers. Through our Lord.
"""

