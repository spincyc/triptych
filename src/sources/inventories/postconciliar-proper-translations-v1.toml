ancient_reading = "Deus virtutum, cuius est totum quod est optimum, insere pectoribus nostris amorem tui nominis, et praesta ut in nobis religionis augmento quae sunt bona nutrias, ac vigilanti studio quae sunt nutrita custodias."
corpus_orationum = ["2210"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God of hosts, to whom belongs all that is best, graft into our hearts the love of your name, and grant that by growth in religion you may nourish in us what is good, and by watchful care keep safe what you have nourished. Through our Lord.
"""

[[entries]]
