witness_note = "The complete literal historical English and its actual Who liveth conclusion come from the adjacent Latin/English prayer in the Benziger 1915 Little Office, printed Latin 252/254 and English 253/255. It is historical study English, not approved contemporary English. The exact official 2008 Variationes at Notitiae printed 373 / artifact 55 correct the August 5 prayer tail to de actibus nostris, add Domini nostri and replace Per Dominum by Qui tecum; those exact historical words and same conclusion family are independently witnessed here. Genitricis/Genetricis is an explicitly recorded spelling difference. The official correction witnesses only the changed tail; it does not authenticate the whole 2008 prayer or an expanded 2008 ending. The photographed 1970 and secondary digitally typeset 2002 bodies have the old tail, so they are not silently used to restore a whole 2008 body. This entry presents only the complete historical antecedent and retains the target Latin witness gap and approved-English limits. The separately printed R. Amen. and following office versicles are not appended."
