[[entries]]
mass = "pentecost"
form = "Mass during the Day"
proper = "Sequence"
incipit = "Veni, Sancte Spiritus"
witness = "caswall-1849"
witness_relation = "antecedent"
witness_note = '''Same transcription as the 1962 row; the two Latin texts are the same ten strophes.'''

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.edward-caswall.lyra-catholica.london-1849"
text = '''
Holy Spirit! Lord of light!
From thy clear celestial height,
Thy pure beaming radiance give:

Come, Thou Father of the poor!
Come, with treasures which endure!
Come, Thou Light of all that live!

Thou, of all consolers best,
Visiting the troubled breast,
Dost refreshing peace bestow;

Thou in toil art comfort sweet;
Pleasant coolness in the heat;
Solace in the midst of woe.

Light immortal! light divine!
Visit Thou these hearts of thine,
And our inmost being fill:

If Thou take thy grace away,
Nothing pure in man will stay;
All his good is turn’d to ill.

Heal our wounds — our strength renew;
On our dryness pour thy dew;
Wash the stains of guilt away:

Bend the stubborn heart and will;
Melt the frozen, warm the chill;
Guide the steps that go astray.

Thou, on those who evermore
Thee confess and Thee adore,
In thy sevenfold gifts, descend:

Give them comfort when they die;
Give them life with Thee on high;
Give them joys which never end.
'''

