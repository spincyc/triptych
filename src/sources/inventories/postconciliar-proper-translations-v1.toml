verified_note = "Read on the image. The oration stands at the top of the page as `P. COMM. Caelestibus.—Being fed, O Lord, with heavenly dainties, we beseech thee, that we may always hunger after them, as they preserve our life. Thro.'`, above the rubric `If there be not VI. Sundays between the Epiphany and Septuagesima, what remains are omitted, ana taken in between the XXIII. and the last Sunday after Pentecost.`, which fixes the Mass as the VI Sunday after the Epiphany. Text matches the overlay row exactly; the printed `Thro.'` is normalised to `Thro'.` by that file's own declared correction, carried through unaltered. DEFECT FOUND IN A TRACKED FILE: the 1962 overlay row records `printed_page = 104` for this leaf. The running head reads 101 (verified at 3x magnification, saved as n114-pagenum.png). The leaf is right, the page number is wrong by three, and the leaf-to-page offset is not constant in this printing (88->n98 is +10, 446->n454 is +8), so the field cannot be repaired by arithmetic. Reported, not fixed."
