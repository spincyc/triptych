ancient_reading = "Suscipe munera, quaesumus, Domine, quae tibi de tua largitate deferimus ut haec sacrosancta mysteria, gratiae tuae operante virtute, praesentis vitae nos conversatione sanctificent, et ad gaudia sempiterna perducant."
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Receive, we beseech you, O Lord, the gifts we bring you out of your own bounty, that these most holy mysteries, by the working power of your grace, may sanctify us in the conduct of this present life and bring us to everlasting joys. Through Christ our Lord.
"""

