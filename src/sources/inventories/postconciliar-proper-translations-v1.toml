# English translations for the text-bearing propers of the postconciliar calendar.
#
# This file was empty by decision until 2026-08-01, and the decision was right on
# the evidence it had. What changed is not the rights position -- that is
# unaltered and now written down once, with its citations, in
# src/sources/inventories/liturgical-english-rights-v1.toml -- but the discovery
# that most of these prayers are not the reform's to withhold. They were restored
# from sacramentaries of the sixth, seventh and eighth centuries, and where the
# Missal prints one of them unaltered, the words on its page are words in which
# nobody holds a right.
#
# 70 orations are therefore translated here by that route, and `census` below
# counts what it left. A second route was opened later and is not a variant of
# the first: 59 further entries publish no new English at all but carry English
# that public-domain nineteenth-century books made for ANTECEDENT texts. Their
# relation was recorded against bodies formerly held by this calendar; those
# Latin bodies were quarantined from the current Git tree on 2026-08-27 and
# survive here only as stable slot identities and audit prose. Fifty-six entries use an
# 1861 lay missal's orations; three use Caswall's 1849 sequence translations.
# Those entries are `public-domain`, not `project-created`; they are never the
# Missale Romanum 2002's text, which is in copyright and not held here; and
# `merge` below states what marks them. Every count in `census` was measured
# before that second route existed and is scoped to the first. Read `census`
# before reading anything else, and read its date beside it.
#
# The numerical prose below preserves dated 2026-08 audit snapshots, not the
# current coverage count; `tools/mass-propers census` derives current coverage.
# On 2026-10-23 direct inspection recovered Advent IV's historical English from
# a subsidiary prayer on the same page a prior refusal had inspected too narrowly.
# Its complete Latin body and differing conclusion cues are documented below;
# this is a historical antecedent, with no authenticated 2008 target claim.

translations_schema = 1
record_type = "calendar-proper-translations"
calendar = "postconciliar"
target = "src/sources/calendars/postconciliar/propers.yaml"
recorded_on = "2026-10-29"

merge = """
Dated 2026-10-29, temporal source increment: five complete old petitions support original study English with exact finite variants and source cues preserved. Lent5's full conventional ending has its own independently witnessed old complete formula and explicit two-inflection assessment; it is not expanded from the old per cue. Historical page proofs are retained separately from whole-artifact controllers. Printed2002 and2008 correspondence remains unresolved; earlier unavailable source routes and fingerprints are conserved.

Dated 2026-10-29, Saint Mary Major historical increment: a complete bilingual1915 Little Office prayer supplies independently reviewed literal human English and its own complete Who-liveth conclusion. The official2008 correction witnesses the changed target tail only; whole2008 fidelity remains unresolved. The old Bute through-the-same conclusion refusal is not overwritten or adapted.

Dated 2026-10-29, exact official2008 extended Pentecost Vigil excerpt: a separately named partial form adds eight composed coordinates, including six after-reading prayer options and two Collect pointers. One old petition plus independently witnessed conventional short conclusion/response supports fresh study English; seven English gaps remain explicit. Four Old Testament reading seats are ordered source facts, not an all-four obligation. The unavailable Ordinary frame retains unresolved opening, Vespers, silence, omission and continuation branches. Existing simple Vigil and Day forms remain exact.

Dated 2026-10-29, acclamation verse increment: five exact OLM1981 source-local recipients now quote three complete historical Lasance1945 human-English verses. Alleluia framing, other verses, kneeling directions and the Sequence remain outside the independently inspected verse spans. Historical verse availability does not establish bundled approved English, target2008 fidelity, or a new Latin body. All five earlier unavailable dictionaries and quarantine fingerprints remain in the dated source admission receipt.

Dated 2026-10-29, late-Easter source increment: two composed Communion antiphons now have fresh study English from independently witnessed 1862 and 1815 Latin, with the exact one-word variation and one-word abridgment disclosed. The 1815 bound container and separately titled constituent remain distinct source identities. No target Latin body, received English, or authenticated 2008 wording is supplied. Both former unavailable dictionaries remain in the dated source admission receipt.

Dated 2026-10-29, Virgo source increment: one independently image-checked 1888 initial respond sentence supplies two finite abridged OLM1981 acclamation study uses, Cecilia and Lucy. The following versicle and repetition are outside the source selection; no word is added or substituted. Both source and English/policy reviews are recorded separately. Authenticated2008 and approved-English limits remain.

Dated 2026-10-29, September 8: the official 2008 Supplementum establishes one added offering prayer and at least one retained older option, a bounded minimum rather than a complete prior-option census. One fresh study English follows independently read Hadrianum Latin with one omitted clause and exactly two word substitutions; the complete older human-English donor remains refused. The retained-option wording is an explicit new no-exemplar gap. No prior entry, absence or source text is changed, and no whole-book authentication is inferred.

Dated 2026-10-29, phase1: seventeen source-qualified historical English uses and five independently image-checked ancient-derived study translations replace twenty-two exact unavailable identities. The preserved original unavailable dictionaries concern the separate approved-English or prior source route and remain in workflows/reviews/missal-english-completion-2026-10-29/postconciliar/phase1-admission.json. Historical sources and secondary-2002 comparisons do not authenticate 2008 wording. No approved ICEL body or protected modern Latin is added; every prior positive and every unselected unavailable dictionary remains exact.

Each entry names one proper by mass key, form label and proper name, and carries
the `translations` array verbatim into that proper. The array holds exactly the
keys `check-calendar-masses` validates, so the merge copies a structure and does
not translate between schemas. Two routes reach this file and an entry states which one it is on.

Most entries are `project-created` and name no `source_id`, because the project
is its own witness; the witness fields beside the array (`ancient_witness`,
`witness_edition_id`, `witness_artifact_id`, `match_coverage`, `relation`,
`divergence`, `ancient_reading`) are evidence for the entry and are not part of
what merges.

The rest are ANTECEDENT entries, marked by `witness_relation = "antecedent"`, a
`witness` naming a declared `[[sources]]` row, and a `witness_note`. The Missale
Romanum 2002 is in copyright and is not held here, so no entry in this file is a
translation of it. An antecedent entry prints the English a public-domain book
made for an OLDER liturgical text that a historical comparison associated with
this stable slot: the oration entries use an 1861 lay missal, and the sequences use
sequences from Caswall's 1849 *Lyra Catholica*. Its `witness_note` states that
recorded comparison and every difference then observed. On 2026-08-27 every
full `antecedent_latin_here` body was removed from this inventory along with
the postconciliar calendar's bodies. These records are evidence/search leads;
they do not establish a target-edition transcription source or exactness. The English is the
antecedent's, never the reform's, and a page showing it must say so. These rows
carry `rights = "public-domain"` and the `source_id` of the printing the words
were read out of, which is the one thing the project-created rows never carry.

Two ids and what each one is for, because conflating them is how this file
served 63 translations with no attribution and no caution for the length of a
branch. `witness` names a `[[sources]]` row of THIS file by its `id`; the row is
a BOOK, and `source_attestation_problems` in check-calendar-masses holds it to
the act history by that id. `witness_relation` says what the entry is doing with
that book, and `antecedent` is a relation between two Latin texts, not a
printing -- there is no antecedent edition of anything. The two were once run
together as a single invented witness id, `cummiskey-1861-antecedent`, which no
`[[sources]]` row declared and which therefore resolved nowhere: the act-history
cross-check never engaged, and the browser's witness manifest, which keys these
rows by `source_id`, found no row and printed a bare dotted id in place of a
label with `caution` left null. Never encode a relation in a witness id. Declare
the book and state the relation beside it.

Check `incipit` against the target proper before merging. An entry whose mass,
form, proper or incipit no longer answers the target is stale and must be
re-derived, never merged on the strength of its mass key alone.

`untranslated` merges nothing. It is the ledger of propers deliberately left
without English, each with the reason it was left, so that a proper carrying no
`translations` key can be told from one nobody reached, and so a page can say
that no English is recorded rather than showing Latin as though it were the
answer.
"""

scope = """
The original project-created census is scoped to the seasonal section.
Later source-reviewed increments also identify nonseasonal prayers and chants
whose Latin is independently established in a public-domain witness. Their
exact sources, differences and review limits are recorded per entry; an older
witness does not become target-edition attestation. When the original census
was measured on 2026-08-01 the marian,
christological and sanctoral sections were a placeholder skeleton whose `text`
fields said "Placeholder", so there was nothing there to translate; as those
sections fill, the same census must be run over them and this file's counts will
change.

The antecedent route is not so bounded, because it goes where the older text
survives rather than where a section boundary falls. Its 59 entries stand 24 in
the seasonal section, 28 in the sanctoral, 6 in the christological and 1 in the
marian; 55 are orations, 1 is an Entrance Antiphon, and 3 are Sequences. Those
figures were counted from this file's own entries against
src/sources/calendars/postconciliar/propers.yaml on 2026-08-27; they are not
part of the `census` block below and must not be read into it.
"""

census = """
Measured on 2026-08-01, not estimated.

The seasonal section carries 289 text-bearing propers. 215 of them are orations
-- Collect, Prayer over the Offerings, Prayer after Communion, Prayer over the
People. Every one of those 215 was compared, word by word, against the corpus
`corpus.catholic-church.ancient-sacramentaries-2026-08-01`: the Veronense in
Feltoe's edition, the Old Gelasian in Wilson's, the Hadrianum in Wilson's, and
the Mozarabic, Gothic and Bobbio books, eight optical text layers in all.

Coverage is the fraction of the missal's words, conclusion excluded, that align
with the best-matching window of an ancient book under a normalisation that
folds orthography, expands the manuscript contractions, and ignores punctuation.

    coverage >= 0.99   28
    0.95 - 0.99        15
    0.90 - 0.95        27
    0.75 - 0.90        51
    0.50 - 0.75        34
    below 0.50         60

So 155 of 215 orations -- 72 per cent -- have an identifiable ancient ancestor
inside that boundary, and 70 have one close enough to publish against.

70 orations are translated here. Every one of the 70 was translated by this
project from the Latin; none is taken from any existing English, approved or
otherwise. That number is deliberately not folded into a total: it is new
English, written by a language model in an editorial role, unreviewed by any
human at the time of writing, and it should be weighed as such.

145 orations are left untranslated, and so are 74 other text-bearing propers --
antiphons, sequences, the Exsultet, the solemn intercessions, the blessings of
Holy Week -- for 219 in all. Each carries its own reason in `untranslated`, and
the reasons are not the same reason.

The other route was tested and refused. The 1962 index in this repository holds
public-domain English for 153 of its orations. Comparing all 215 postconciliar
orations against all 559 Latin texts of that index on the same day found 4
substantively identical and 10 more at or above 0.95 similarity. Transferring
the 1861 English on a looser match would attach one prayer's English to
another's Latin, which is this repository's governing defect, so no 1962 English
was transferred.
"""

method = """
Reproducible, and worth restating because the result is only as good as it.

Each ancient edition was fetched whole from the Internet Archive with curl, its
length checked against the length the item's own metadata declares, and hashed
before use; the eight artifacts and their digests are registered in the source
library and listed in the corpus record. Nothing in the retrieval path passed
through a model, and no ancient text was recalled rather than read.

Comparison is mechanical. Each file is de-hyphenated across line breaks and
reduced to a word stream; each word is lowercased, stripped of non-letters,
expanded where it is a known manuscript contraction (Dne, Ds, Spm, scs, oms, qs
and the rest), and folded for orthography (j to i, v to u, ae and oe to e). The
missal's oration is reduced the same way with its conclusion removed. Every
three-word window of the oration that occurs fewer than 300 times in a book is
used as an anchor, candidate windows around each anchor are aligned with a
longest-matching-block diff, and the window with the highest word coverage wins.
The reported divergence is that diff, read.

Two independent scans are held of the Veronense and of the Gelasian, and this
matters: where two optical text layers of one book agree, a reading is far more
likely to be the book's, and where they disagree the disagreement is the
detector. Most apparent divergences at high coverage turned out to be optical
damage -- `adiicias` for `adicias`, `hodieme` for `hodiernae`, `earn` for `eam`,
`prsta` for `praesta`, Wilson's marginal sigla and Cambrai's folio marks read as
words -- and each was adjudicated by reading it, not by a threshold.

Three limits, stated because a census that hides them is worse than none. The
boundary is six editions and not the tradition: it holds no eighth-century
Gelasian, no Ambrosian book, no medieval diocesan sacramentary. The search is
literal over uncorrected optical text and cannot see a paraphrase or a heavily
recentonised descendant. And nothing here has been collated against a page
image: every match is a lead until someone opens the printed page. `verified` is
claimed for no entry in this file.
"""

what_is_published = """
Two routes publish English here and their tests are different. This section
states the first; `what_is_published_by_the_antecedent_route` states the second.
Neither route supplies the approved English of the Roman Missal. The
project-created route supplies original study English of independently
established public-domain expression; a finite target-edition comparison is
identified only where actually performed. The antecedent route supplies the
historical human translator's words. No ICEL wording is retained or reproduced.

THE PROJECT-CREATED ROUTE. Study English is published for a prayer or chant
only where its Latin adds nothing to the independently established ancient or
public-domain witness that could be anyone's authorship. Three relations
qualify, and each entry says which it is.

`verbatim` -- the two texts differ only in orthography, punctuation, word order,
or demonstrable optical damage. The English renders both.

`abridged` -- the missal drops words the ancient book has and adds none. An
omission is not authorship, so the English still renders only public-domain
words. `divergence` says exactly what was dropped.

`variant` -- the missal substitutes a word or two, or changes an inflection.
`divergence` quotes both readings and says which the English follows, which is
always the missal's, so that the English and the Latin beside it on the page
answer each other. A substitution of one or two words is too small to be
protected expression, and the entry shows the whole of it rather than asserting
it.

Everything else -- a recomposition, a centonisation, a rewriting, a prayer with
no ancient witness in the boundary at all -- is untranslated, and says so.

Where the line falls is this project's judgement. It was made conservatively and
it is shown in full; a reader who disagrees with any single entry can see
precisely what was judged and reach their own answer.
"""

what_is_published_by_the_antecedent_route = """
THE ANTECEDENT ROUTE writes no English at all. It carries, unaltered, the English
that public-domain nineteenth-century books already made for DIFFERENT and older
liturgical texts, and it carries that English only where this calendar's own
recorded Latin reproduces the antecedent. 59 entries take this route, 69
translation rows between them, and every one is `rights = "public-domain"`
naming the printing the words were read out of.

What is published is therefore the ANTECEDENT text's English. It is not a
translation of the Missale Romanum 2002, it is not offered as one, and it must
never be presented as one; the 2002 Missal is in copyright, is not held here, and
its approved English is ICEL's. The two Latin texts standing in an identity
relation is what licenses the quotation, and that relation is argued in each
entry's `witness_note` from both texts, with every difference the two show set
out down to orthography and pointing. Where the Latin diverges beyond that, the
entry is not written.

Three things this route does NOT establish, said here because each has been
assumed elsewhere in this repository and each was wrong. It does not establish
the target's relation to the named antecedent -- that is an editorial
determination on the Latin, made entry by entry. It does not make either
nineteenth-century book a witness to this calendar: the `[[sources]]` rows hold
both on a date bound at `si-quid-est-1634`, which places them before the reform,
and that bound is the reason they can be quoted, not an exception to it. And it
does not put the wording under CC BY 4.0; this project claims no exclusive right
in it and originates none by carrying it.

The general refusal recorded in
src/sources/inventories/liturgical-english-rights-v1.toml stands and is not
weakened by this route. That record refuses the transfer of a pre-1930 hand
missal's English onto a postconciliar oration on a similarity score, because a
loose match attaches one prayer's English to another's Latin. Nothing here rests
on a score. Each entry rests on a named antecedent, a stated Latin identity and
an enumerated difference list. Retained Cummiskey entries bind both the
exact inspected 1861 page-image passage and one complete TSV body in a separate
tracked public-domain transcription; the Caswall source row records its separate
page-image transcription basis.
"""

caution = """
Nothing in this file is an approved liturgical translation, and nothing in it may
be used for recitation. The approved English of the Roman Missal is the
International Commission on English in the Liturgy's, it is not reproduced here
in whole or in part, and no wording here was derived from it. Beyond that the two
routes must be weighed differently, and a reader who takes the file as one thing
will misweigh both.

The project-created entries are study English, made by this project from
independently witnessed public-domain Latin and published under CC BY 4.0 with
the project's authorship identified at the point of use. The original 70-entry
census described drafts not yet reviewed against source images. Later
increments retain their own completed source and AI-review records; none
claims human review or ecclesiastical approval. Every entry retains the
qualifications of its actual Latin witness and target comparison.

The antecedent entries are not this project's English and are not under CC BY
4.0. The oration entries carry a pre-1955 lay hand missal's English for antecedent
orations; three carry Caswall's English for antecedent sequences. Both books are
recorded as public domain in the United States, and neither supplies the Missale
Romanum 2002's text. This project claims no exclusive right in their wording.
Their rubrics and textual arrangements are not this calendar's, their English is
nineteenth-century devotional English, and the identity that licenses each
quotation is a judgement on two Latin texts shown in the entry rather than
asserted.
"""

