[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Almighty, everlasting God, direct our actions according to your good pleasure, that in the name of your beloved Son we may deserve to abound in good works. Through our Lord.
"""

[[entries]]
mass = "ot-30"
