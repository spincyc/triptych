[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, who ratified the diversity of the sacrifices of the Law in the perfection of one sacrifice, receive this sacrifice from your devoted servants, and hallow it with the same blessing as the gifts of Abel, that what each has offered to the honour of your majesty may profit all unto salvation. Through Christ our Lord.
"""

[[entries]]
mass = "ot-17"
