[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, author of sincere devotion and of peace, grant, we beseech you, that by this offering we may fittingly honour your majesty, and by sharing in the holy mystery be faithfully made one in mind. Through Christ our Lord.
"""

[[entries]]
