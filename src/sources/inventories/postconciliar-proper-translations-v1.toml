corpus_orationum = ["3909"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Almighty, everlasting God, who govern the things of heaven and of earth alike, hear with mercy the pleadings of your people, and grant your peace in our days. Through our Lord.
"""

[[entries]]
