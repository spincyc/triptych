# English translations for the text-bearing propers of the postconciliar calendar.
#
# There are none, and this file records why. It is the companion of
# roman-1962-proper-translations-v1.toml and carries the same schema; its
# `entries` array is empty by decision, not by omission.

translations_schema = 1
record_type = "calendar-proper-translations"
calendar = "postconciliar"
target = "src/sources/calendars/postconciliar/propers.yaml"
recorded_on = "2026-07-31"
merge = """
Nothing here merges into propers.yaml. `entries` is empty; `untranslated` is the
whole content, and it is data: a proper listed here is one that was examined and
deliberately left without English, which a page may state, rather than one nobody
reached. Do not fall back to the Latin and present it as though it were the
English a reader asked for.
"""
finding = """
The approved English of the postconciliar Roman Missal is the translation of the
International Commission on English in the Liturgy, confirmed for the dioceses of
the United States in 2011 and published under the authority of the episcopal
conferences. It is in copyright, held by ICEL, and reproduction of its orations
requires ICEL's permission. This project has not obtained it.

The imprimatur the project holds for the alpha does not supply it. An imprimatur
is an ecclesiastical judgement that a book is free of doctrinal error; it is
granted by an ordinary under canon law, it conveys no proprietary interest in
anyone's text, and it cannot license the reproduction of a third party's
copyrighted translation. The two instruments answer different questions and
neither substitutes for the other.

That is also this repository's own settled position, stated in its publications
before this record: the Mount Carmel novena leaves three collects unquoted
because 'ICEL publication permission has not been obtained'; the postconciliar
propers guides state that no English oration or antiphon is reproduced in whole
or in part; and the comparative study says in terms that the ICEL English is
never reproduced at any length. Nothing found in this review disturbs that.

One statement in the repository reads the other way and should be corrected or
substantiated by the project owner. THIRD_PARTY.md, in the paragraph added on
2026-07-30 with the `translations` contract itself, says the ICEL translation
'is carried under permission granted to this project'. No permission record
exists anywhere in the repository, no ICEL text is in fact carried, and every
other statement in the tree denies that permission was obtained. Until the owner
produces the grant, that sentence is a forward-looking illustration standing
where a rights record should be, and it must not be relied on.
"""
if_permission_is_obtained = """
A licence to reproduce is not a licence to publish, and the two must be settled
separately. The `translations` contract already anticipates the first: an entry
with rights = "licensed" carries the notice its licensor requires. The second is
not yet handled anywhere in this machinery, and that is a defect to fix before
any licensed text is written into propers.yaml.

The Knox bible is the precedent for withholding: its artifacts are kept outside
the repository, `index-bible` marks its edition publishable = false, and
`public-alpha` omits an unpublishable edition from the site's manifest. No
equivalent exists for a calendar translation. `mass-propers structure` copies
`proper.get("translations")` into the browser's data file with no regard to the
`rights` value on it, so a licensed translation written into propers.yaml would
be baked into the public artifact by the ordinary build, and nothing would
report it. Tracked-but-unpublishable is therefore not a state this repository can
currently express for a proper's translation, whatever a licence might allow.
"""
alternatives_considered = """
Three, none of which yields publishable English for these orations.

A public-domain English of the postconciliar orations does not exist. The Latin
editio typica is of 1970 and later, so no pre-1930 book can witness it, and every
complete English of it is ICEL's. Where a postconciliar oration is textually the
same prayer as one in the 1962 books, an old English of the 1962 prayer renders
that Latin and not the postconciliar text; the reform edited a great many of the
prayers it kept, and asserting identity without collating the two Latin texts
oration by oration is exactly the kind of plausible wrong answer this repository
refuses. No such collation was done here, and no 1962 English was transferred.

A project-created translation is permitted by the contract as rights =
"project-created" and would be publishable under CC BY 4.0 with its authorship
identified. It is not attempted here. It is a decision for the owner, not for
this lane: it is a large body of new liturgical English, it would sit beside
approved texts that readers may mistake it for, and the contract's requirement
that project authorship be identified at the point of use is a presentation
question the browser lane would have to answer.

Divinum Officium was examined and rejected as a source. Its repository carries an
MIT licence, but that licence covers the software; its own sources page says the
English of the Mass was taken from the Tridentine Latin Rite Missal Project 'with
the permission of the owner', from a collection by Fr Brian T. Austin FSSP
described only as 'a free project', and from The Catholic Missal (New York: P. J.
Kenedy and Sons, 1943). A personal permission granted to that project's author is
not a licence to this one, an informal declaration is not a rights record, and a
1943 American imprint raises a renewal question nobody has answered. An MIT
licence on a repository is not evidence that the text inside it was the
repository's to license.
"""

