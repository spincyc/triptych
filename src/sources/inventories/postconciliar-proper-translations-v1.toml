verified_note = """
Read at 200 dpi on the page image. The 1861 prints this day a FULL proper Mass, not a pointer into a Common. The page prints no point after `children`; recorded as printed. 20 July in the 1861 and the 1862; 8 February in the postconciliar calendar. Saint Josephine Bakhita, canonised in 2000, is now a separate same-date identity; no printing of this date can reach her and this row does not answer her orations.
"""
witness_note = """
REVISED HISTORICAL ANTECEDENT; this English is not a translation of the appointed modern Collect. It remains verbatim Cummiskey 1861 English for the older prayer, including its reference to merits. The complete older Latin was freshly read on the Pustet 1862 image, printed p.493 / IA leaf n578, and compared with the full photographed Vatican 1970 Collect, printed p.528 / PDF515: passage.catholic-church.missale-romanum.vatican-typica-1970.postconciliar-jerome-emiliani-collect-comparison-20261023.
Every substantive difference in the body is recorded here. The older opening Deus misericordiarum Pater is reordered to Deus, Pater misericordiarum. The old per merita et intercessionem beati Hieronymi, quem orphanis adiutorem et patrem esse voluisti is recast as a direct relative clause beginning qui beatum Hieronymum, followed by adiutorem et patrem orphanis providisti; the intercession request is relocated and now reads eius nobis intercessione concede. Thus the older merita is absent, the saint's grammatical case changes, the orphan phrase moves, esse voluisti becomes providisti, and nobis is explicit in the new intercession request. The entire following ut spiritum adoptionis petition through fideliter custodiamus agrees apart from accents and pointing; both actually print the same Per Dominum cue. The older English's merits and willing language belongs to the older text, not the revised one. No abbreviated conclusion is expanded.
The separately viewed secondary2002 PDF427 agrees with the photographed1970 reading. This comparison does not establish the secondary reproduction's fidelity to a printed2002 book or certify the governing2008 text. The reader must retain the historical-antecedent label and this revision caution. No protected modern body or new prayer translation is supplied.
"""

