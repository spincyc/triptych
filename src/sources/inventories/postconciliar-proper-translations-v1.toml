verified_on_page = "2026-08-22"
verified_artifact_page = 1
verified_heading = "THE EASTER VIGIL / First Part: The Solemn Beginning of the Vigil or Lucernarium / Procession"
verified_url = "https://www.icelweb.org/musicfolder/Lucernarium.pdf"
witness_note = """
Read from the text layer of Lucernarium.pdf. The Deacon sings 'The Light of
Christ' three times (at the door, in the middle of the church, and before the
altar), and the people reply 'Thanks be to God' each time. The text is carried
once, as the proper carries it. The Latin alternatives 'Lumen Christi' and 'Deo
gratias' are printed beside the English. The response 'R. Thanks be to God' is
carried because it is part of the antiphonal text the proper carries, not a
congregational acclamation like 'Amen'.
"""
