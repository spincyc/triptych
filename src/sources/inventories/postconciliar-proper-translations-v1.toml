match_coverage = 1.0
ancient_reading = "Deus, qui fidelium mentes unius efficis voluntatis da populis tuis, id amare quod praecipis, id desiderare quod promittis, ut inter mundanas varietates ibi nostra fixa sint corda ubi vera sunt gaudia."
corpus_orationum = ["1633"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, who make the minds of the faithful to be of one will, grant your peoples to love what you command and to desire what you promise, that amid the changes of this world our hearts may be fixed where true joys are. Through our Lord.
"""

[[entries]]
mass = "ot-22"
