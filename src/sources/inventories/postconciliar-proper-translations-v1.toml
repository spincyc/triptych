verified_url = "https://archive.org/download/romanmissaltran00churgoog/page/n453_w1400.jpg ; https://archive.org/download/romanmissaltran00churgoog/page/n454_w1400.jpg"
verified_note = "FIRST PAGE READING THIS ROW HAS EVER HAD. The 1962 overlay row carries no `collated` and no `ia_leaf`; it rests on `detector = second-printing-partly-agrees`, `second_printing_coverage = 0.7872` and `ia_text_layer_line = 26087`, and that file's own prose says such a row has never been seen on a page. It has now. The antiphon opens at the FOOT of p. 445 with a drop capital, `I AM the Saviour of my people, saith the`, beside the Latin `SALUS populi ego sum, dicit Dominus: de qua-`, and continues at the top of p. 446, `Lord: in whatever distress they call on me, I will hear them: and will be their Lord for ever. Ps. Attend, O my people, to my law, incline your ears to the words of my mouth. V. Glory.` Joined across the break that is the overlay row's text character for character; the 0.7872 shortfall is the parallel-column setting, as that file predicted. The 1962 row can be promoted to `collated = page-image, 2026-08-20`, `printed_page = 445-446`, `ia_leaf = 453` by the lane that owns it."
witness_note = "The MR2002 text is not held here; this is the English of the antecedent chant roman-1962/pentecost-19/Introit, whose antiphon Latin is identical to the formerly recorded postconciliar Latin modulo punctuation (`dicit Dominus.` for `dicit Dominus:`, `exaudiam eos,` for `exaudiam eos:`). CAUTION ON SCOPE: the antecedent row renders the whole 1962 Introit, so its English carries in addition the psalm verse `Ps. Attend, O my people, to my law, incline your ears to the words of my mouth.` and the cue `V. Glory.`, which this calendar's Entrance Antiphon does not include — the postconciliar slot is the antiphon alone. The text is copied exactly from the 1962 row; whether to trim the psalm verse and Gloria cue is an editorial decision this lane does not make, since trimming would be altering the witness's text."

