# ---------------------------------------------------------------------------
# ICEL-ORATIONS HARVEST, 2026-08-21. Forty-three orations of the postconciliar
# Roman Missal in the approved ICEL English, read on the page images of two
# witnesses and landed under ICEL's standing web permission. Three (the
# First Sunday of Advent's Collect and Prayer over the Offerings, and the
# Epiphany's Prayer over the Offerings at the Mass during the Day) were read in
# ICEL's own PresidentialTones.pdf -- the rightsholder's own copy, the highest
# tier of exemplar, `exemplar_tier = "icel-published"`, witness
# `icel-chants-2010`. Forty were read in the Federation of Diocesan Liturgical
# Commissions' "Mystagogical Reflections on Texts of the Roman Missal", which
# reprints them under the acknowledgment "Excerpt from The Roman Missal, Third
# Edition (c) 2010, ICEL. Reprinted with approval of the Committee on Divine
# Worship, United States Conference of Catholic Bishops" -- a second-tier
# exemplar the maintainer has accepted, `exemplar_tier = "fdlc-reprint"`,
# witness `fdlc-mystagogy-2016` or `fdlc-mystagogy-2012`. The de-syllabification
# of the chant entries is an editorial transformation each entry states; the
# FDLC entries are carried as printed. Every Collect ending "one God, for ever
# and ever" records that superseded reading where it falls; the correction
# belongs to the emendation apparatus and not to a transcriber's hand. See
# .scratch/lanes/icel-orations/report.md for the full lane record.
# ---------------------------------------------------------------------------

[[entries]]
mass = "advent-1"
form = ""
proper = "Collect"
incipit = "Da, quaesumus, omnipotens Deus"
witness = "icel-chants-2010"
exemplar_tier = "icel-published"
witness_relation = "approved-translation"
verified_on_page = "2026-08-21"
verified_artifact_page = 2
verified_heading = "Tones for the Presidential Prayers / Solemn Tone / Collect (First Sunday of Advent)"
verified_url = "https://www.icelweb.org/musicfolder/PresidentialTones.pdf"
superseded_reading = """
The conclusion is printed here as "one God, for ever and ever". "One" has since
been struck: the Prefect of the Congregation for Divine Worship wrote to the
Anglophone conferences in May 2020 that it has no warrant in the Latin, and the
conferences implemented the correction on their own dates. So this is the
approved English of 2010 and not the text in force in any territory today. The
word stands in the transcription because the rightsholder's page has it and
because exactness is a condition of the grant; the correction belongs to
whatever emendation apparatus the ledger grows, not to a transcriber's hand.
"""
witness_note = """
The approved ICEL English of this slot, read on the page image of ICEL's own
PresidentialTones.pdf, where it is printed whole as a pointing example for the
solemn tone. It is printed a second time on artifact page 5 under "Simple Tone",
and the two settings were collated word by word: they agree at every locus,
including the superseded "one God". The file carries no printed pagination, so
no `verified_printed_page` is recorded; the artifact page is the PDF page.

The Latin this answers is the calendar's own recorded text, "Da, quaesumus,
omnipotens Deus, hanc tuis fidelibus voluntatem, ut, Christo tuo venienti iustis
operibus occurrentes, eius dexterae sociati, regnum mereantur possidere
caeleste. Per Dominum...", and the English matches it clause for clause.

EDITORIAL TRANSFORMATION, stated because the licence demands exactness. The
chant syllabifies across neumes and points the cadences. Removed: the hyphens at
"com-ing", "heav-en-ly" and "ev-er and ev-er", and the grave and acute accents
at "com-ìng", "heav-èn-ly" and "Kíngdom", which mark where the voice descends to
G and rises to A and are not orthography. The capital in "Kingdom" is the
Missal's and is kept. The people's "R. Amen." is a response and is not carried
into the oration's text. Nothing else was altered.

WHAT THIS WITNESS IS NOT. PresidentialTones.pdf is a tone sheet for cantors and
celebrants, not a missal and not an excerpt of the Proper of Time. It prints
three orations in the whole file and prints them as examples of pointing. It
must never be cited as the Missal, and it establishes who says so and not as of
when -- see `superseded_reading`.
"""
[[entries.translations]]
lang = "en"
rights = "permission"
source_id = "edition.international-commission-on-english-in-the-liturgy.music-for-the-roman-missal.2010-chants-web-2026-08-21"
notice = "The English translation and chants of The Roman Missal © 2010, International Commission on English in the Liturgy Corporation. All rights reserved."
text = "Grant your faithful, we pray, almighty God, the resolve to run forth to meet your Christ with righteous deeds at his coming, so that, gathered at his right hand, they may be worthy to possess the heavenly Kingdom. Through our Lord Jesus Christ, your Son, who lives and reigns with you in the unity of the Holy Spirit, one God, for ever and ever."

[[entries]]
mass = "advent-1"
form = ""
proper = "Prayer over the Offerings"
incipit = "Suscipe, quaesumus, Domine"
witness = "icel-chants-2010"
exemplar_tier = "icel-published"
witness_relation = "approved-translation"
verified_on_page = "2026-08-21"
verified_artifact_page = 6
verified_heading = "Tones for the Presidential Prayers / Simple Tone / Prayer over the Offerings (The First Sunday of Advent)"
verified_url = "https://www.icelweb.org/musicfolder/PresidentialTones.pdf"
witness_note = """
The approved ICEL English of this slot, read on the page image of ICEL's own
PresidentialTones.pdf, where it is printed whole as a pointing example for the
simple tone. Unlike the Collect and the Epiphany Prayer over the Offerings, this
one is printed ONCE in the file: the solemn-tone section carries the Collect and
the Epiphany prayer only, so there is no second setting to collate it against
and it stands on a single reading. The file carries no printed pagination, so no
`verified_printed_page` is recorded.

The Latin this answers is the calendar's own recorded text, "Suscipe,
quaesumus, Domine, munera quae de tuis offerimus collata beneficiis, et, quod
nostrae devotioni concedis effici temporali, tuae nobis fiat praemium
redemptionis aeternae. Per Christum...", and the English matches it clause for
clause; the conclusion printed with the chant, "Through Christ our Lord", is the
one the Latin's "Per Christum" abbreviates.

EDITORIAL TRANSFORMATION. Removed: the hyphen and grave at "redemp-tiòn", the
grave at "hère", and the flex sign set above the vowel of "us". Nothing else was
altered. The people's "R. Amen." is not carried.

Its conclusion is a short one and carries no "one God", so the May 2020
correction that reaches the Collect above does not reach this prayer.
"""
[[entries.translations]]
lang = "en"
rights = "permission"
source_id = "edition.international-commission-on-english-in-the-liturgy.music-for-the-roman-missal.2010-chants-web-2026-08-21"
notice = "The English translation and chants of The Roman Missal © 2010, International Commission on English in the Liturgy Corporation. All rights reserved."
text = "Accept, we pray, O Lord, these offerings we make, gathered from among your gifts to us, and may what you grant us to celebrate devoutly here below gain for us the prize of eternal redemption. Through Christ our Lord."

[[entries]]
mass = "epiphany"
form = "Mass during the Day"
proper = "Prayer over the Offerings"
incipit = "Ecclesiae tuae, quaesumus, Domine"
witness = "icel-chants-2010"
exemplar_tier = "icel-published"
witness_relation = "approved-translation"
verified_on_page = "2026-08-21"
verified_artifact_page = 2
verified_heading = "Tones for the Presidential Prayers / Solemn Tone / Prayer over the Offerings (The Epiphany of the Lord, The Mass during the Day)"
verified_url = "https://www.icelweb.org/musicfolder/PresidentialTones.pdf"
witness_note = """
The approved ICEL English of this slot, read on the page image of ICEL's own
PresidentialTones.pdf. The prayer begins on artifact page 2 under "Solemn Tone"
and its last two lines run over to artifact page 3; it is printed a second time
entire on artifact page 6 under "Simple Tone", and the two settings were
collated word by word and agree at every locus. The file carries no printed
pagination, so no `verified_printed_page` is recorded.

THIS SLOT IS THE LANE'S ONE NEW FINDING. The earlier survey in
.scratch/lanes/icel-official-sources/sources.md scored this file as covering two
slots, both of the First Sunday of Advent, and its sect. 3 and sect. 4 tables are
built on that count. The file in fact prints three orations, and the third is
this one. The 154-with-no-official-source figure in that document is therefore
153, and its "Collect 1 / Prayer over the Offerings 1" row should read 1 and 2.

The Latin this answers is the calendar's own recorded text, "Ecclesiae tuae,
quaesumus, Domine, dona propitius intuere, quibus non iam aurum, thus et myrrha
profertur, sed quod eisdem muneribus declaratur, immolatur et sumitur, Iesus
Christus. Qui vivit et regnat in saecula saeculorum." The English matches it
clause for clause, and its conclusion "Who lives and reigns for ever and ever"
is the proper conclusion the Latin's "Qui vivit et regnat" requires, not the
common "Per Christum" -- which is a second, independent check that the chant was
matched to the right slot.

The heading names the form as well as the day, "The Mass during the Day", so the
Vigil Mass's own Prayer over the Offerings ("Suscipe, quaesumus, Domine, munera
nostra pro apparitione") is untouched by this entry and remains ledgered.

EDITORIAL TRANSFORMATION. Removed: the hyphen and grave at "frankin-cènse", the
grave at "Chùrch", the double grave above the vowel of "Christ", and the
syllable break at "ev-er". Nothing else was altered. The people's "R. Amen." is
not carried.
"""
[[entries.translations]]
lang = "en"
rights = "permission"
source_id = "edition.international-commission-on-english-in-the-liturgy.music-for-the-roman-missal.2010-chants-web-2026-08-21"
notice = "The English translation and chants of The Roman Missal © 2010, International Commission on English in the Liturgy Corporation. All rights reserved."
text = "Look with favor, Lord, we pray, on these gifts of your Church, in which are offered now not gold or frankincense or myrrh, but he who by them is proclaimed, sacrificed and received, Jesus Christ. Who lives and reigns for ever and ever."

