witness_note = "Historical antecedent English for study, not approved contemporary English or an exact target-edition translation. Lasance/Walsh ordinary printed p. 502 / PDF 500 / IA n499 prints this complete English of the old Holy Saturday prayer after Prophecy 1. Complete historical Latin petition agrees word for word with the photographed 1970 and separately inspected secondary 2002 petitions, after accent, case, ligature, pointing and line-wrap normalization only. Every conclusion is separately compared: Lasance prints Per Dominum. and Through our Lord.; both modern witnesses print Per Christum Dominum nostrum. followed by the response Amen. No complete-prayer string identity, cue equivalence, English ending expansion, or added Amen is asserted. The English is exactly the older prayer's, not a translation of the modern prayer. Photographed 1970 is direct primary evidence; printed-2002 fidelity of the secondary digital witness and correspondence to the 2008 reimpressio remain unresolved. Comparison controllers: passage.catholic-church.missale-romanum.vatican-typica-1970.postconciliar-easter-vigil-first-reading-alternative-20261023 and passage.catholic-church.missale-romanum.vatican-typica-tertia-2002.postconciliar-easter-vigil-first-reading-alternative-20261023."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = "O God, Who hast wonderfully created man and more wonderfully redeemed him, grant us, we beseech Thee, to withstand by strength of spirit the allurements of sin, that we may be worthy to reach everlasting joys. Through our Lord."


