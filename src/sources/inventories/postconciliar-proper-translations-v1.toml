[[entries]]
mass = "palm-sunday"
form = ""
proper = "Procession Antiphon 1"
incipit = "Pueri Hebraeorum, portantes ramos olivarum"
witness = "icel-antiphonary-2010"
witness_relation = "approved-translation"
verified_on_page = "2026-08-21"
verified_artifact_page = 41
verified_printed_page = "33"
verified_heading = "HOLY WEEK (running head) / [PALM SUNDAY OF THE PASSION OF THE LORD, The Commemoration of the Lord's Entrance into Jerusalem, First Form: The Procession, from artifact page 40] / Antiphon 1"
verified_url = "https://www.liturgyoffice.org.uk/Missal/Music/Antiphonary.pdf"
grail = "split-recorded"
grail_carried = "the ICEL antiphon, three sense lines, entire"
grail_left = "the whole of Psalm 23 as the exemplar prints it beneath the antiphon, five strophes, in the Revised Grail rendering"
witness_note = """
A GRAIL SLOT, AND THE SPLIT IS CLEAN. The exemplar prints, in this order: the
heading `Antiphon 1`; the ICEL antiphon in three sense lines; the red Graduale
assignment `(Psalm 23[24]: GR, p. 139)`; the red rubric `If appropriate, this
antiphon is repeated between the strophes of the following Psalm.`; the centred
heading `Psalm 23`; and then the whole psalm in five strophes, each followed by
the red `(The antiphon is repeated)`.

WHAT IS CARRIED: the antiphon, and nothing else. WHAT IS LEFT: every word beneath
the `Psalm 23` heading. The exemplar's own copyright page at artifact page 2
reserves "the English translation of Psalms 23(24), 46(47), and 115(116) from The
Revised Grail Psalms © 2010 Conception Abbey/The Grail, administered by GIA
Publications, Inc." GIA is not ICEL, ICEL's grant does not reach a word of it,
and this project holds nothing from GIA. Not one word of those five strophes
appears in this entry or anywhere in this harvest.

THE SPLIT COSTS THIS SLOT NOTHING, and that is why it is clean rather than hard.
This calendar's proper for `Procession Antiphon 1` carries as its `text` the
antiphon alone -- `Pueri Hebraeorum, portantes ramos olivarum, obviaverunt
Domino, clamantes et dicentes: Hosanna in excelsis.` -- and records the psalm
only in its note, "Sung with Psalm 24, the antiphon repeated between the
strophes". So the slot is the antiphon and the psalm is a reference. The
reference resolves against whichever bible the reader has selected, from the
public-domain editions this repository already indexes, which is what
guidance/liturgical-text-publication-policy.md section 5.1 established when it
withdrew the earlier and broader Grail objection. A Grail rendering is never
needed and never wanted here.

The red Graduale assignment in parentheses is a CITATION and carries no Grail
text; it is the compiler's reference and is not the thing at issue.

ONE CORRECTION TO A SIBLING RECORD, offered so it can be fixed rather than
inherited. The passage record
`passage.catholic-church.missale-romanum.2010-english-icel-antiphonary.palm-sunday-procession-antiphons`
describes this antiphon as "four sense lines". It is three, as printed and as
read on the page image at 200 dpi on 2026-08-21. The record's substantive
finding -- that the page holds an ICEL antiphon above a Grail psalm -- is exactly
right and is what this row rests on.
"""
[[entries.translations]]
lang = "en"
rights = "permission"
source_id = "edition.catholic-church.missale-romanum.2010-english-icel-antiphonary"
notice = "The English translation of The Roman Missal © 2010, International Commission on English in the Liturgy Corporation. All rights reserved."
text = """
The children of the Hebrews, carrying olive branches,
went to meet the Lord, crying out and saying:
Hosanna in the highest.
"""

[[entries]]
mass = "palm-sunday"
form = ""
proper = "Procession Antiphon 2"
incipit = "Pueri Hebraeorum vestimenta prosternebant"
witness = "icel-antiphonary-2010"
witness_relation = "approved-translation"
verified_on_page = "2026-08-21"
