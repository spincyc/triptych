verified_note = "Read on the image. Printed as `P. COMM. of the Sunday. Augeatur.—May the efficacy of thy power, O Lord, be increased in us, that being fed with thy divine sacraments, we may, thro' thy bounty, be prepared to receive what they promise. Thro'.` — the 1962 row's claim that the witness sets the Sunday's Postcommunion inside the Mass of the Holy Name is confirmed on the page, as is the printed_page/ia_leaf pair. Text matches the overlay row exactly. THIS IS THE LOUDEST DIVERGENCE OF THE FOUR PROPOSALS: the English says `thy divine sacraments` where this calendar's Latin reads `caelestibus`, heavenly. See dispositions.md section 6; demoting this entry costs one proposal and nothing else."
