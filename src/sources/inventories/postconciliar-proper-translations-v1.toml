witness_note = """
Printed under the heading `Antiphon` with the citation `Cf. Ez 47, 1-2, 9` --
comma rather than colon after the book, which is the exemplar's own inconsistency
at this one locus -- following the red rubric "After the Renewal of Baptismal
Promises, the Priest sprinkles the people with the blessed water, while all
sing:". That rubric places it exactly where this calendar files the slot, and
the citation answers this calendar's recorded `Ezekiel 47:1-2, 9`. Four sense
lines.

THE `Ant.` MARKER IS NOT CARRIED, and the omission is deliberate. This calendar's
recorded Latin opens `Ant. Vidi aquam`, but the exemplar prints no such marker in
the text: it prints the word `Antiphon` as a red slot heading above the four
lines, in the same position and typography as `Entrance Antiphon` elsewhere in
the document. Copying the Latin's marker onto the English would be interpolating
a word into a text whose permission requires it be followed exactly. The Good
Friday and Ubi caritas rows in this harvest DO carry `Ant.`, because there the
exemplar prints it inside the text as part of the chant's alternation.

AN EMENDATION. The exemplar's fourth line reads, on the page image and in the
text layer alike, `were saved and shall say: Alleluia, aleluia.` -- the second
alleluia missing an l. That is a misprint of this PDF, and the same document
settles it: at artifact page 241, printed page 233, in Appendix II's Rite for the
Blessing and Sprinkling of Water, the exemplar prints the same antiphon `During
Easter Time` as `Antiphon 1` and reads `were saved and shall say: Alleluia,
alleluia.` Read on the page image at 200 dpi on 2026-08-21. The correction is
therefore made from the exemplar's own second printing and from no outside
source.

ONE DIFFERENCE BETWEEN THE TWO PRINTINGS IS NOT EMENDED, because it is not
plainly an error. The Easter Vigil printing ends its second line `from its
right-hand side, alleluia;` with a semicolon; the Appendix printing ends it
`alleluia:` with a colon. The row carries the Easter Vigil printing's semicolon,
because that is the printing of the slot being filled, and the divergence is
recorded here rather than resolved. A later lane filling the Rite of Sprinkling
from artifact page 241 should carry the colon and cite that page.
"""
