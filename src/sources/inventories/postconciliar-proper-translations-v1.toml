source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, the Father of mercies: grant, by the merits and intercession of blessed Jerome, whom thou wast pleased to make a helper and father to poor orphans, that we may faithfully preserve the spirit of adoption, by which we are called, and are in reality thy children Thro'.
"""

