match_coverage = 1.0
ancient_reading = "Deus, qui diligentibus te bona invisibilia praeparasti, infunde cordibus nostris tui amoris affectum, ut te in omnibus et super omnia diligentes, promissiones tuas, quae omne desiderium superant, consequamur."
corpus_orationum = ["1532"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
O God, who have prepared unseen good things for those who love you, pour into our hearts the love of you, that loving you in all things and above all things we may obtain your promises, which surpass all desire. Through our Lord.
"""

[[entries]]
mass = "ot-21"
