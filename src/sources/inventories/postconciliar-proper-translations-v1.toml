verified_note = "Read on the image. Printed as `P. COMM. of the Sunday. Augeatur.—May the efficacy of thy power, O Lord, be increased in us, that being fed with thy divine sacraments, we may, thro' thy bounty, be prepared to receive what they promise. Thro'.` — the 1962 row's claim that the witness sets the Sunday's Postcommunion inside the Mass of the Holy Name is confirmed on the page, as is the printed_page/ia_leaf pair. Text matches the overlay row exactly. THIS IS THE LOUDEST DIVERGENCE OF THE FOUR PROPOSALS: the English says `thy divine sacraments` where this calendar's Latin reads `caelestibus`, heavenly. See dispositions.md section 6; demoting this entry costs one proposal and nothing else."
witness_note = "The MR2002 text is not held here; this is the English of the antecedent oration roman-1962/epiphany-2/Postcommunion, whose Latin differs from the formerly recorded postconciliar Latin in one phrase: the 1962 index reads `ut divinis vegetati sacramentis`, this calendar reads `ut, refecti caelestibus sacramentis` — two words substituted (`divinis` -> `caelestibus`, `vegetati` -> `refecti`), every other word of the body identical modulo punctuation. The English is the antecedent's and renders the 1962 reading: `being fed with thy divine sacraments`, where this calendar's Latin says heavenly, not divine. If that divergence is judged too loud to print, this entry falls to a dispositions row; it is proposed because the substitution is two words in one clause and is stated here in full."

