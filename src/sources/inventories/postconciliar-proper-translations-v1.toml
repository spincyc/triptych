every one as a lead of the same standing as the Latin beside it.

The 56 antecedent entries are not this project's English and are not under CC BY
4.0. They are the English of a pre-1955 lay hand missal, in the public domain in
the United States by publication date, quoted for the ANTECEDENT of the prayer
and never as the Missale Romanum 2002's text. This project claims no exclusive
