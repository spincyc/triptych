[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Graciously sanctify these gifts, O Lord, we beseech you, and, accepting the offering of this spiritual sacrifice, make us ourselves an everlasting gift to you. Through Christ our Lord.
"""

[[entries]]
