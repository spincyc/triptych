witness_note = "Complete historical antecedent English for study, not approved contemporary English or an exact target-edition translation. Cummiskey printed p. 317, PDF p. 326 / IA n325, prints the complete Prayer Deus qui nos after old Prophecy VII, with the English short ending Thro’. and a separately printed response R. Amen. The payload preserves only the prayer body and its actual short ending; no ending is expanded and no response is appended. Complete corresponding historical Latin was independently read on Pustet1862 printed p. 196, PDF p. 282 / IA n281. Its entire petition has the same words as the photographed1970 p. 279 / PDF272 and separately viewed secondary2002 PDF215, with these explicit spelling differences: Pustet intelligere versus modern intellegere and Pustet expectatio versus modern exspectatio. These are received spellings of the same words, not a substituted petition; no broad donor normalization or inferred word is used. Accents, capitalization, ligatures, pointing and line wraps also differ. Actual conclusions are different and separately retained: Pustet prints Per Dominum nostrum etc.; Cummiskey prints Thro’. with separate R. Amen.; both modern witnesses print Per Christum Dominum nostrum. with separate R. Amen. No complete-prayer string identity or cue equivalence is asserted. Photographed1970 is primary evidence for its own reading; the digital2002 reproduction has unestablished printed-book fidelity, and correspondence to the2008 reimpressio remains unresolved. No protected Latin body, ICEL English or reconstructed Lasance words are imported. Controllers: passage.catholic-church.missale-romanum.pustet-ratisbon-1862.postconciliar-easter-vigil-seventh-alternative-latin-20261023; passage.catholic-church.missale-romanum.vatican-typica-1970.postconciliar-easter-vigil-seventh-alternative-comparison-20261023; passage.catholic-church.missale-romanum.vatican-typica-tertia-2002.postconciliar-easter-vigil-seventh-alternative-comparison-20261023."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O God, who by the scriptures of both testaments teachest us to celebrate the Paschal sacrament: give us such a sense of thy mercy, that, by receiving thy present favours, we may have a firm hope of thy future blessings. Thro’."

