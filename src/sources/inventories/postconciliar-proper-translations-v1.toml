[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Pour into us, O Lord, the Spirit of your love, that those whom you have fed with the one bread of heaven you may make of one mind in devotion. Through Christ our Lord.
"""

[[entries]]
mass = "ot-20"
form = ""
proper = "Collect"
incipit = "Deus, qui diligentibus te bona invisibilia praeparasti"
