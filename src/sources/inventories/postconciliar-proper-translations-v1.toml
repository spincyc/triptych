The Gelasian reads *sed iugiter eius praeveniat effectus*; the Missal reads *sed eius praeveniat semper effectus*. The two adverbs are synonyms. The English follows the Missal.
"""
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
May the working of this heavenly gift take possession of our minds and bodies, we beseech you, O Lord, so that it is not our own sense that goes before in us, but always its effect. Through Christ our Lord.
"""

