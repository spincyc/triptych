witness_note = """
Historical antecedent English for study, not approved contemporary English or
an exact target-edition translation. Direct inspection of Cummiskey printed
p. 52, artifact PDF p. 63 / IA n62, overturns the former no-exemplar note:
the page prints the primary Advent I Postcommunion Suscipiamus AND the entire
subsidiary Marian Postcommunion Gratiam tuam beneath it. The English below
reproduces that subsidiary prayer, including its printed Thro’. without expansion.

The complete historical Latin was read on Pustet Ratisbon 1862 printed p. [52],
artifact PDF p. 722 / IA n721, in the Marian votive Mass in Advent; the retained
image is controlled by passage.catholic-church.missale-romanum.pustet-ratisbon-1862.postconciliar-advent4-antecedent-latin-20261023.
The whole body and conclusion were compared with the separately inspected
secondary 2002 reproduction, artifact PDF pp. 96-97, controlled by
passage.catholic-church.missale-romanum.vatican-typica-tertia-2002.postconciliar-advent4-collect-comparison-20261023.
Every body word agrees. Differences are accents and ae ligature typography;
Pustet ejus versus the secondary source's eius; Pustet omits the comma after
quaesumus that the secondary source prints; Pustet's colon after infunde,
semicolon after cognovimus and comma after crucem correspond to the secondary
source's comma, comma and no comma;
and conclusion cues Per eumdem Dominum nostrum. versus Per Dominum.
The cues were compared and remain different: no expanded conclusion or
complete-prayer string identity is asserted. Cummiskey's Thro’. is preserved.
This bounded comparison establishes the historical antecedent route only.
The 2002 file is a secondary digitally typeset reproduction of unestablished
printed-book fidelity; correspondence to the 2008 reimpressio is unresolved.
No protected Latin body or ICEL English is imported.
"""
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Pour forth, we beseech thee, O Lord, thy grace into our hearts, that we, who, by the message of an angel, have known the incarnation of thy Son, the Christ, may by his passion and cross, come to the glory of his resurrection. Thro’.
"""

