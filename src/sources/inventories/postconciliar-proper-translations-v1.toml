match_coverage = 1.0
ancient_reading = "Ecclesiae tuae, Domine, munera placatus assume, quae et misericors offerenda tribuisti, et in nostrae salutis potenter efficis transire mysterium."
corpus_orationum = ["2400"]
[[entries.translations]]
lang = "en"
rights = "project-created"
text = """
Receive with favour, O Lord, the gifts of your Church, which in your mercy you gave her to offer, and which by your power you make pass over into the mystery of our salvation. Through Christ our Lord.
"""

[[entries]]
