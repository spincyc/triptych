lang = "en"
rights = "project-created"
text = """
May your sacraments, O Lord, we beseech you, accomplish in us what they contain, so that what we now carry out under appearances we may lay hold of in the truth of the things themselves. Through Christ our Lord.
"""

[[entries]]
mass = "ot-31"
