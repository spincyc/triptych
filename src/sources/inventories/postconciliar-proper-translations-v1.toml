verified_printed_page = "34"
verified_heading = "LENT (running head, wrong -- the section is PALM SUNDAY OF THE PASSION OF THE LORD, which begins at artifact page 40) / Antiphon 2"
verified_url = "https://www.liturgyoffice.org.uk/Missal/Music/Antiphonary.pdf"
grail = "split-recorded"
grail_carried = "the ICEL antiphon, three sense lines, entire"
grail_left = "the whole of Psalm 46 as the exemplar prints it beneath the antiphon, four strophes, in the Revised Grail rendering"
emendation = "blesssed -> blessed"
witness_note = """
The same construction as Antiphon 1 and the same clean split: heading
`Antiphon 2`, the ICEL antiphon in three sense lines, the red Graduale
assignment `(Psalm 46[47]: GR, p. 140)`, the red repetition rubric, the centred
heading `Psalm 46`, and the whole psalm in four strophes. The antiphon is
carried; not one word beneath the `Psalm 46` heading is. Psalm 46(47) is the
second of the three psalms the exemplar's copyright page reserves to The Revised
Grail Psalms, Conception Abbey/The Grail, administered by GIA Publications, whom
ICEL's grant does not reach. This calendar's proper again carries the antiphon
alone as its `text` and records the psalm only in its note, so the split costs
the slot nothing.

AN EMENDATION, AND IT IS THE ONE PLACE ON THIS ROW WHERE THE TEXT DEPARTS FROM
THE PAGE. The exemplar's third line reads, on the page image at 200 dpi and in
its text layer alike, `blesssed is he who comes in the name of the Lord.` --
`blesssed` with three consecutive letters s. That is a misprint of this PDF and
not the ICEL translation, and it is corrected here to `blessed`.

Two independent things establish the correction, and neither is a memory or a
guess:

  1. A SECOND OFFICIAL WITNESS. The Liturgy Office of the Bishops' Conference of
     England and Wales publishes the same rite as `Lords-Entrance.pdf`,
     registered at
     artifact.catholic-church.missale-romanum.2011-english-cbcew-excerpts.lords-entrance-pdf,
     sha256 6b78359836f0cb67bf3b569f6c950d1fa558aeb5c701c5fdcebe6b630633bcb7,
     12 pages. Its page 10, printed page 306, prints Antiphon 2 in the same three
     sense lines with the same words and reads `blessed`. Read on the page image
     at 180 dpi on 2026-08-21. That file is an England-and-Wales publication and
     is a witness to the universal ICEL text where the text is universal, which
     this antiphon is; its own rubric on the facing matter spells `honour`, and
     no such national spelling occurs inside the antiphon.
  2. THE SAME DOCUMENT, TWO PAGES EARLIER. The exemplar's own artifact page 40
     prints the phrase correctly inside the Hosanna antiphon: `blessed is he who
     comes in the name of the Lord,`.

The emendation is recorded rather than made silently because condition (3) of
ICEL's grant requires the translation be followed exactly, and reproducing a
misprint would be following the file exactly and the translation inexactly. If
the coordinator would rather carry the page reading, the printed form is
`blesssed` and this note is where it is written down.
"""
[[entries.translations]]
lang = "en"
rights = "permission"
source_id = "edition.catholic-church.missale-romanum.2010-english-icel-antiphonary"
notice = "The English translation of The Roman Missal © 2010, International Commission on English in the Liturgy Corporation. All rights reserved."
text = """
The children of the Hebrews spread their garments on the road,
crying out and saying: Hosanna to the Son of David;
blessed is he who comes in the name of the Lord.
"""

