flagged, for a reason that is itself a finding. The 1962 witness contains no
decree of approbation of a 1962 typical edition, no Quo primum, and only three
occurrences of the word DECRETUM in 136,068 lines, all belonging to the 1960
documents. Its authority pages are the 1960 pair and a New York imprimatur.

So: an edition certainly was promulgated -- both parent acts order their content
into the typical editions of the Missal, and a book exists that carries both --
but the instrument was not found here and is not asserted from memory. Dropping
the station would leave the two reforms on branches that never join, which is
false in the other direction and is the error `parallel stays parallel` exists to
prevent in reverse. So the node stands and says plainly that its act is missing.
A reader can see the gap; a reader cannot see a node that was never drawn.

The instrument now has a name it did not have when this station was first drawn.
guidance/time-machine.md section 4 records, from separate research, that the 1962
decree is `Novo rubricarum corpore` and that it is not in Acta Apostolicae Sedis
54 -- which explains why searching an AAS volume and a missal scan for it found
nothing. Naming it does not promote the station: no text of it has been read
here, so `act_citation` stays `not-found` and will stay there until someone reads
the decree rather than a report of it.
"""
attested_in = ["benziger-iuxta-typicam-1962"]
read_from = "ocr-only"
locus = "benziger-iuxta-typicam-1962 OCR, Holy Week at lines 34462-43654"
date_note = """
The day is not established. The corpus that supplied the scan records only the
year, and no decree of approbation was located in the scan's front matter, whose
OCR is decorative noise for its first hundred lines. The date used for ordering
is a conventional one and is marked here rather than passed off as read.
"""
effect = "Carries the 1955 reform into the typical edition."
effect_established = true

