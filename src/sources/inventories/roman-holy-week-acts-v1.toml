# The Roman Holy Week as a history of acts, 1570-1962.
#
# A tracer. It carries four liturgies of one week across the acts that changed
# them, and nothing else. Everything the missal does in the other fifty-one
# weeks is outside it and is not asserted here in any direction.
#
# This file sits in inventories/ for the reason the translations sidecar beside
# it gives: `check-calendar-masses` reads every .yaml under src/sources/calendars
# as a mass index, `scripts/_calendars.py` makes an unrecognised schema in a
# calendar directory a hard failure, and `source-library validate` rejects any
# file under src/sources outside its own schema except .md and .toml under
# inventories/. A new calendar directory would also be discovered by
# calendar-days, calendar-rubrics, the census, the harvest corpus and the
# browser's missal control, none of which this tracer is ready to answer to.
# When the shape is settled its home is a calendar-scoped companion schema
# registered in COMPANION_SCHEMAS.

acts_schema = 1
record_type = "liturgical-act-history"
slice = "roman-holy-week"
recorded_on = "2026-07-31"

model = """
The station is the ACT, not the book. Every commit in the history this file
generates is a promulgation, a revision, a reform, a rubrical code, or a
documented exemption, and each one cites its instrument. A printing is not an
act: it is a WITNESS, and it hangs beneath the history rather than standing in
it. That single rule is what keeps a scanner out of the record. Two printings of
one text differ constantly -- in spelling, in setting, in what the optical
character recognition made of a broken letter -- and none of those differences
has an act behind it, so none of them can become a commit. What the reader sees
change is what an authority changed.

Two things are kept apart throughout, because they have different lifetimes.
The ACT is fixed: its date, its author, its instrument and its text do not move
once cited. What is UNDERSTOOD to have changed is a historical judgement, is
revisable, and is contested for some acts. A revision of the second must never
move a station of the first, so effects are recorded per act in `effect` and
`effect_established`, never folded into the act's identity.

The base is the state left by the earliest act this tracer represents, and each
later act records only its DEPARTURES from the state it inherits. An act that
changed nothing in Holy Week writes no row and still gets its station:
`divino-afflatu-1911` is here for exactly that reason. The departure vocabulary
is the one guidance/recensions.md section 3 fixes -- absent, added, replaced,
renamed, moved, reslotted, unrecorded -- and this file exercises all seven.
"""

evidence = """
Nothing in this file has been read against a page image. Every quotation, line
number and reading below comes from Internet Archive DjVu optical-character-
recognition text layers of public-domain scans, which are a discovery aid and
not a witness to wording. Each unit and each act therefore carries `read_from`,
whose only values here are `ocr-only` and `not-read`; no row claims
`page-image`, and `inspected` in the sense of guidance/sources.md is the ceiling
reached, never `verified`.

That matters more here than usual. On 2026-07-31 this repository collated 99
orations that had been taken from an OCR text layer of a single 1861 printing
against the page images of that same printing, and corrected 38 of them --
`Lard` for `Lord`, `tliese` for `these`, a comma where the page prints a full
stop. A difference between two OCR texts is therefore worth nothing on its own
as evidence about the books. It is worth something only where an act stands
behind it, which is why the act rule above is the whole design and not a
convention.

OCR damage is reproduced exactly in every quotation, including obvious errors
(`coDsnetudine`, `(fucentos`, `Gabbato`). Correcting a quotation to make a
difference look cleaner would destroy the only signal that tells a reading from
a reading of a scan.
"""

extent = """
Four liturgies: Palm Sunday, Thursday, Friday and Saturday of Holy Week. Within
them this tracer claims only the units it lists. It says nothing about the
Ordinary, the Canon, the chants' notation, the ceremonies not reduced to a text
unit here, the Office, or Monday, Tuesday and Wednesday of Holy Week. Silence in
this file is silence because nothing was established, never because the state
was checked and found unchanged: guidance/recensions.md Rule 4.
"""

open_items = """
- The instrument that removed `perfidis` and `perfidiam` from the Good Friday
  prayer for the Jews is not cited here. The change is visible between the
  witnesses, and it is commonly attributed to John XXIII in 1959, but no
  instrument for it was found in this corpus and none is asserted from memory.
  It is recorded as a departure of kind `unrecorded` against the act it cannot
  be attached to, and it must not be moved onto `editio-typica-1962` merely
  because that is the first witness in which the words are gone.
- The typical edition of 1900 stands between `si-quid-est-1634` and
  `editio-typica-1920` and is not represented: the 1920 decree says its text was
  drawn from it. The edge is drawn with `via_unrepresented` set, so the history
  says "descends from" and not "immediately follows".
- No act is cited here that let the pre-1955 Holy Week continue in use after
  25 March 1956. The tracer therefore draws no such branch. The absence is a
  statement about this corpus and this search, not about history.
- The 1570 and 1604 witnesses were not read for any unit below. Their Holy Week
  is locatable in the OCR but its two-column scans interleave, so unit-level
  reading needs the page images.
"""

# --- Lines ------------------------------------------------------------------
#
# A line is a sequence of acts that stayed together. Lines never rejoin: where
# two of them run side by side, they run side by side to the end of the record,
# and no act here joins one to another. A branch is born at an act, never at an
# observation that two books differ.

[[lines]]
id = "typica"
label = "Roman typical editions"
note = "The line Quo primum established and every act that revised it."

[[lines]]
id = "exempt-uses"
label = "Uses exempted by Quo primum"
note = """
Quo primum did not abolish every other use. It excepted those whose institution
was approved by the Apostolic See or whose custom had been kept above two hundred
years, and said of them in terms that it took their manner of celebrating away by
no means. Those uses -- among them the Ambrosian, the Lyonese, and the uses of
the Dominicans, Carmelites and Carthusians -- kept their own Holy Week and never
returned to this line. This tracer holds no witness for any of them, so the line
has its birth act and nothing after it. An empty branch that is honestly empty
is the point: the fork is in the record because an act put it there, and its
emptiness measures what this corpus holds, not what happened.
"""

