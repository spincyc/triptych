sha256 = "e2ec59f7d46f0673f40239a1185c7005f955959e0cb5eeb40e5daa55f2a254e7"
finding = "The Global Computer Networks clause is conditional, limited to a qualifying Internet site, requires exact text and acknowledgement at display boundaries, disclaims other publication forms and endorsement, and reserves modification or termination."

[[evidence]]
authority = "Triptych repository"
title = "Liturgical text publication policy"
path = "guidance/liturgical-text-publication-policy.md"
reviewed_on = "2026-08-26"
finding = "Sections 3.4, 5-7, 11, 13-14, and 17 separate text, rightsholder, source, territory, notice, and publication surface and already require fail-closed treatment at the public bundle."

[[change_triggers]]
trigger = "The Day reader's purpose, ordering, Ordinary controls, text coverage, client data route, downloadability, financing, access terms, or intended use changes."
action = "Repeat this review before release; do not inherit the current provisional classification."

[[change_triggers]]
trigger = "ICEL modifies or terminates its web permission, the USCCB issues implementing guidance, the effective date changes, or a competent authority supplies a surface-specific determination."
action = "Record the new evidence, scope it to the actual text and surface, and rerun the release gate."

[[change_triggers]]
trigger = "A new rightsholder, national adaptation, Lectionary rendering, Scripture translation, chant, rubric, or liturgical option enters the Day-reader dependency graph."
action = "Withhold its payload until its independent provenance, exactness, permission, notice, and surface decision are complete."

[non_assertions]
statements = [
  "This does not say the Day reader is legally or canonically a participation aid.",
  "This does not say the Day reader is an academic, devotional, or other non-liturgical publication.",
  "This does not say ICEL's standing permission is rescinded, sufficient for the data bundle, or irrelevant to a different live-web surface.",
  "This does not say USCCB guidance transfers ownership of ICEL text or that ICEL permission clears USCCB, CCD, Lectionary, NAB/NABRE, psalm, music, or national text.",
  "This does not say an acknowledgement, imprimatur, authentication, public URL, source citation, or exact transcription is a copyright license.",
  "This does not clear current or historical Git payloads and does not decide whether repository-history remediation is required.",
]

[history_residual]
status = "requires maintainer release-policy/counsel decision"
record = """
Removing a payload from the current tree and public build does not erase Git
objects that carried it in earlier commits. The mandatory review must inventory
that history and explicitly decide, with appropriate advice if needed, whether
a rewrite, repository replacement, access change, notice, or another remedy is
required. This record authorizes none of those destructive or external actions.
"""
