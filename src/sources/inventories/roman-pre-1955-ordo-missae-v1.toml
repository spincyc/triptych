# ---------------------------------------------------------------- absences

[[absences]]
key = "no-facing-latin"
label = "The 1861 witness prints this block only in English"
kind = "witness-gap"
what = "The 1861 book sets this block across the full measure in English only and prints no Latin text for it; the facing-column Latin of every block that has one is transcribed. The absence is the witness's, not a rights or effort gap. It holds for 83 elements - 53 rubrics, 21 English headings, 8 prayers (a-cunctis, munda-cor-meum, dominus-sit-in-corde-meo, per-evangelica-dicta, accendat-in-nobis, secreta-ii, postcommunio-mundet, et-famulos) and the form benedicat-vos-omnipotens-deus - and each was established by opening the leaf, not inferred: leaves n25-n56 were all read. Whether the 1920 Ordo Missae prints any of these is a separate target-edition question; the reason is scoped to this witness's page and says nothing about the rite."

[[absences]]
key = "appointment-not-established"
label = "This day’s Ordinary appointment is not established"
kind = "model-gap"
what = "Nothing in this repository yet establishes which text the day appoints here: no reading of the celebrated formulary's own direction is recorded, no dated span stated by the accepted pre-1955 witness covers the date, and no sourced default applies. A formulary's Preface is recorded only where the Bonn witness prints it (the `attested_appointments` of src/sources/calendars/roman-pre-1955/propers.yaml), and no span or default is declared: the witness's general rubrics (Additiones et variationes tit. VIII, artifact p. 59*) let a commemorated feast's proper Preface or an octave's displace the de Tempore and common Prefaces, and commemorations and octaves are not modelled in this recension. The stand-in replaces printing every Preface the 1861 witness holds, which claimed all of them were said."

[[absences]]
key = "preface-not-in-witness"
label = "An exact source for this Preface is not joined in this language"
kind = "witness-gap"
what = "The 1861 Cummiskey witness has no Sacred Heart, Christ the King, St Joseph or Dead Preface. Four separate complete historical English bodies are joined from the Lasance witness; this remaining gap applies to the unjoined Latin sides. Historical St Joseph alternatives remain unselected and its English has a closed formulary scope. No other Preface is substituted for a missing language."

[[absences]]
key = "proper-canon-form-not-held"
label = "An exact source for this Canon form is not joined in this language"
kind = "witness-gap"
what = "The accepted pre-1955 Bonn witness prints these proper Communicantes and Hanc igitur forms in its Canon at printed pp.336–337 (artifact pp.440–441). The historical English is now joined separately from the Lefebvre and Lasance witnesses, but no Latin side is joined for these forms; the 1861 Cummiskey Canon carries only common forms (canon-missae-en seq8 and10). This remaining absence applies only to the missing language. No common form is shown in a proper form's place."

# ---------------------------------------------------------------- appointments
#
# The Ordinary variables a DAY appoints (C2 gap G5, 2026-10-19). Each element
# that prints one option carries an `appointed` condition below; a day whose
# appointment is not established shows a typed stand-in, never the common form.

[[appointments]]
variable = "preface"
name = "The Preface"
what = "Which Preface the day takes. The formulary's own printed direction, as the Bonn witness prints it: src/sources/calendars/roman-pre-1955/propers.yaml records it under `attested_appointments` for each inherited formulary, with the expected-target row and page that locate it, and an inherited formulary takes no 1962 direction (2026-10-19; the 1962 index's directions are the 1962 book's rubric, not evidence of this one). No dated span or default is declared. The Bonn general rubrics state the rule (Rubricae generales tit. XII nn. 2-5, artifact p. 42*-43*; Additiones et variationes tit. VIII, artifact p. 59*, read on the text layer as leads): the Mass's proper Preface, failing it that of the first commemorated Mass or Office having one, then the Preface of a common octave or de Tempore, then the common Preface, with the Nativity octave and other exceptions. Its second and third steps turn on commemorations and octaves, which this recension does not model, so a day whose formulary records none is unappointed rather than given a de Tempore or common Preface the rubric might displace."
options = [
  { id = "communis", name = "Common Preface" },
  { id = "trinitate", name = "Preface of the Most Holy Trinity" },
  { id = "nativitate", name = "Preface of the Nativity" },
  { id = "epiphania", name = "Preface of the Epiphany" },
  { id = "quadragesima", name = "Preface of Lent" },
  { id = "sancta-cruce", name = "Preface of the Holy Cross" },
  { id = "paschalis", name = "Paschal Preface" },
  { id = "ascensione", name = "Preface of the Ascension" },
  { id = "spiritu-sancto", name = "Preface of the Holy Spirit" },
  { id = "beata-maria-virgine", name = "Preface of the Blessed Virgin Mary" },
  { id = "apostolis", name = "Preface of the Apostles" },
  { id = "sacro-corde", name = "Preface of the Sacred Heart" },
  { id = "christo-rege", name = "Preface of Christ the King" },
  { id = "sancto-ioseph", name = "Preface of St Joseph" },
  { id = "defunctis", name = "Preface of the Dead" },
]

[[appointments]]
variable = "communicantes"
name = "Communicantes"
what = "Which Communicantes the Canon says: the common form, or the proper form a formulary or the book's own dated heading appoints."
options = [
  { id = "common", name = "The common Communicantes" },
  { id = "nativitate", name = "Communicantes of the Nativity" },
  { id = "epiphania", name = "Communicantes of the Epiphany" },
  { id = "pascha", name = "Communicantes of Easter" },
  { id = "ascensione", name = "Communicantes of the Ascension" },
  { id = "pentecoste", name = "Communicantes of Pentecost" },
]
default = "common"
default_basis = "The accepted pre-1955 witness, the Bonn 2004 reimpressio of the 28th edition iuxta typicam (sha256 b676ce5c...), prints in its Canon (artifact PDF pp. 439-440, printed pp. 335-336; read at 200 dpi on 2026-10-19) the common Communicantes followed by its five seasonal inserts, each under its own heading: 'In Nativitate Domini et per Octavam', 'In Epiphania Domini et per Octavam', 'A Sabbato sancto usque ad Sabbatum in Albis', 'In Ascensione Domini et per Octavam', 'A Vigilia Pentecostes usque ad sequens Sabbatum inclusive'. Every date the dated spans below do not reach therefore says the common Communicantes. This is the witness's rule, applied to the 1962 formularies this recension inherits uncollated."

[[appointments.spans]]
option = "nativitate"
from = "12-25"
to = "01-01"
locus = "Bonn Canon, 'In Nativitate Domini et per Octavam', printed p. 336, artifact PDF p. 440"

[[appointments.spans]]
option = "epiphania"
from = "01-06"
to = "01-13"
locus = "Bonn Canon, 'In Epiphania Domini et per Octavam', printed p. 336, artifact PDF p. 440"

[[appointments.spans]]
