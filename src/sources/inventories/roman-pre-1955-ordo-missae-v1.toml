[[sections.element_conditions]]
element = "a-cunctis"
conditions = [{ kind = "include-when-any", predicates = ["a-cunctis-season"], basis = "The seasonal second oration A cunctis with its Secret and Postcommunion. Established as NOT said outside the windows its rubrics name, the union of the 1861 witness's own rubrics (ordinarium-oblatio-en seq 1 and 54, ordinarium-conclusio-en seq 6: Candlemas to Passion Sunday, the third Sunday after Pentecost to Advent) and the Bonn reimpressio's Additiones et Variationes in Rubricis Missalis tit. VI n. 1 and 3) (artifact p. 56*, read at 200 dpi on 2026-10-19: 3 February to the Tuesday after Quinquagesima, the first Sunday after Pentecost to the Saturday before Advent). Inside a window it is said only in semidouble and simple offices (RG IX n. 1; tit. VI n. 1), and the rank of the day is not held here, so it stays unresolved there. Added 2026-10-19 (C2 gap G5)." }]

[[sections.element_conditions]]
element = "rubrica-collecta-concede"
conditions = [{ kind = "include-when-any", predicates = ["concede-season"], basis = "The paschal substitution Concede for the seasonal orations. Established as NOT said from Passion Sunday to Saturday in albis and through the octave of Pentecost, where a single oration contra persecutores is said instead (Bonn Additiones tit. VI n. 1 and 6), artifact pp. 56*-57*), and on the vigil of Pentecost, which omits the seasonal orations (tit. VI n. 1; Proprium printed p. 399). Elsewhere the rank of the day decides and it stays unresolved. Added 2026-10-19 (C2 gap G5)." }]

