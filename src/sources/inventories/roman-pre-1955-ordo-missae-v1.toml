to = 6
locus = "Bonn Canon, 'A Sabbato sancto usque ad Sabbatum in Albis', printed p. 336, artifact PDF p. 440"

[[appointments.spans]]
option = "ascensione"
anchor = "ascension_thursday_form"
from = 0
to = 7
locus = "Bonn Canon, 'In Ascensione Domini et per Octavam', printed p. 336, artifact PDF p. 440"

[[appointments.spans]]
option = "pentecoste"
anchor = "pentecost"
from = -1
to = 6
locus = "Bonn Canon, 'A Vigilia Pentecostes usque ad sequens Sabbatum inclusive', printed p. 336, artifact PDF p. 440; Holy Spirit Preface footer, printed p. 328, PDF 432"

[[appointments.spans]]
withheld = true
anchor = "easter"
from = -3
to = -3
locus = "Feria V in Cena Domini prints its own Communicantes and Hanc igitur in the Proprium (Bonn artifact PDF p. 309, printed p. 205, located by missal-expected-targets-v1 rows roman-pre-1955:temporal:slot:feria-5-in-cena-domini:*, not re-read here); the date is left unappointed rather than given the common form."

[[appointments]]
variable = "hanc_igitur"
name = "Hanc igitur"
what = "Which Hanc igitur the Canon says: the common form, or the proper Easter and Pentecost insertion its heading appoints."
options = [
  { id = "common", name = "The common Hanc igitur" },
  { id = "pascha-pentecoste", name = "Hanc igitur of Easter and Pentecost" },
]
default = "common"
default_basis = "The same Bonn Canon prints the common Hanc igitur and one insertion (artifact PDF p. 441, printed p. 337) headed 'A Sabbato sancto usque ad Sabbatum in Albis incl. et a Vigilia Pentecostes usque ad sequens Sabbatum incl. additur'; every other date says the common Hanc igitur."

[[appointments.spans]]
option = "pascha-pentecoste"
anchor = "easter"
from = -1
to = 6
locus = "Bonn Canon Hanc igitur insertion heading, printed p. 337, artifact PDF p. 441"

[[appointments.spans]]
option = "pascha-pentecoste"
anchor = "pentecost"
from = -1
to = 6
locus = "Bonn Canon Hanc igitur insertion heading, printed p. 337, artifact PDF p. 441"

[[appointments.spans]]
withheld = true
anchor = "easter"
from = -3
to = -3
locus = "Feria V in Cena Domini prints its own Communicantes and Hanc igitur in the Proprium (Bonn artifact PDF p. 309, printed p. 205, located by missal-expected-targets-v1 rows roman-pre-1955:temporal:slot:feria-5-in-cena-domini:*, not re-read here); the date is left unappointed rather than given the common form."

