# How this repository treats a scan whose front matter carries Google's
# usage-guidelines page, settled once so that it is not settled again, for PDFs,
# page images and text layers alike.
#
# This file exists because the repository had been holding two answers to one
# question at the same time, and a third in silence. Twenty-one artifact records
# refuse to retain bytes because Google's front matter or stamp is in them, all
# resting on the absence of a distribution grant and most of them citing the
# Cummiskey 1843 text layer's disposition as settled. Seven tracked payloads
# carry Google's front matter: two Mozarabic text layers retain it after arguing
# an implied licence in src/sources/inventories/ambrosian-and-mozarabic-rights-v1.toml,
# and five retain it without a word, among them the tracked PDF of The Liturgical
# Year volume XI, whose own text layer was refused for exactly that page. A
# rights position stated in three places in three wordings is three positions
# (guidance/sources.md, "Settle a recurring rights question once"). The
# maintainer's decision D9 of 2026-09-22
# (guidance/liturgy/liturgical-commentators-plan-2026-09-22.md) asked for one.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. Where it states a proposition of law it states the
# jurisdiction, and the jurisdiction throughout is the United States.

rights_schema = 1
record_type = "google-usage-guidelines-rights"
recorded_on = "2026-09-22"
jurisdiction = "United States"

rule = """
An exact artifact is never refused retention, and never recorded unresolved,
merely because its front matter carries Google's usage-guidelines page: the page
is kept in the exact bytes unaltered, identified in the artifact's record as
Google's and not the book's, never quoted, cited or counted as the book's text,
and the artifact's storage is decided on the ordinary grounds of
guidance/sources.md -- the printing's own United States rights basis, measured
size, duplication -- with a non-Google scan of the same printing preferred when
it is equally complete and legible.
"""

holding = """
The same rule governs a PDF, a page-image set and an optical text layer, because
the page is the same prose in each and the reasoning below does not depend on
the medium. It also governs Google's shorter front matter, "This is a
reproduction of a library book that was digitized by Google ...", and the
four-word page-foot stamp "Digitized by Google" (see `the_other_google_matter`).

What the rule does not do: it does not make the page the book, it does not
license the page to anyone under Triptych's CC BY 4.0 licence (THIRD_PARTY.md:
retained source bytes "keep their own status"), and it does not reach any
question other than Google's own front matter and stamp. `not_settled_here`
names the adjacent Google questions it leaves open.

Existing records are not edited by this file. Every record whose disposition
this rule supersedes is listed in `census`, with what it needs at its next
deliberate revision. Their records are fingerprinted and pinned by reviewed
source bindings, so the correction is a consumer review, not a mechanical
rewrite (guidance/sources.md, "A changed fingerprint is a consumer review
obligation").
"""

[the_page]
question = "What is Google's usage-guidelines page, in its own words?"
answer = "Modern prose of Google's authorship that Google put at the front of every Google Books file, asking that its attribution travel with the file."
reasoning = """
It is quoted here from bytes this repository already tracks, so a reader with no
network can check every word: lines 56922-56954 of
artifact.jacques-paul-migne.patrologia-graeca-volume-29.1860-paris.full-text-layer-2898b217
carry it entire, and so does PDF page 1 of
artifact.prosper-gueranger.the-liturgical-year.english-duffy-1900-volume-11.ia-pdf-95ba98e2.
It has three parts.

1. A statement: "This is a digital copy of a book that was preserved for
   generations on library shelves before it was carefully scanned by Google as
   part of a project to make the world's books discoverable online. It has
   survived long enough for the copyright to expire and the book to enter the
   public domain."
2. "Usage guidelines": "Google is proud to partner with libraries to digitize
   public domain materials and make them widely accessible. Public domain books
   belong to the public and we are merely their custodians. ... We also ask that
   you: + Make non-commercial use of the files ... we request that you use these
   files for personal, non-commercial purposes. + Refrain from automated
   querying Do not send automated queries of any sort to Google's system ...
   + Maintain attribution The Google "watermark" you see on each file is
   essential for informing people about this project and helping them find
   additional materials through Google Book Search. Please do not remove it.
   + Keep it legal ..."
3. "About Google Book Search": a paragraph on Google's mission, ending with the
   address of books.google.com.

It is Google's writing, not a reproduction of anything, so the faithful-copy
reasoning of Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y.
1999) does not reach it, as the Mozarabic record already observed. It reserves
nothing: it claims no copyright in the book or the scan, it frames every use
term as a request ("We also ask that you", "we request that you"), and the only
term addressed to the file itself is that its attribution not be removed.
"""

[why_it_may_be_retained]
question = "On what footing does this repository redistribute Google's page inside a retained file?"
answer = "An implied non-exclusive licence manifested by the page itself, and, independently, fair use."
reasoning = """
IMPLIED LICENCE. A non-exclusive licence needs no writing and may be implied
from conduct (17 U.S.C. Sec. 101 excludes a non-exclusive licence from a
"transfer of copyright ownership", so Sec. 204(a)'s writing requirement does not
apply to it; Effects Associates, Inc. v. Cohen, 908 F.2d 555, 558 (9th Cir.
1990)). Google wrote this page to travel inside a freely downloadable file of a
public-domain book, says in it that such books "belong to the public", and asks
that its attribution not be removed. Passing the file on intact, with the page
in it, is the use the page contemplates and asks for. This is the reasoning of
ambrosian-and-mozarabic-rights-v1.toml `[the_hosts]`
`shape_three_google_scan_and_its_own_front_matter`, adopted here for every
medium and every Google-scanned book, not only the Mozarabic ones.

THE REQUESTS ARE NOT CONDITIONS. "Personal, non-commercial" use is requested,
not made a condition of any licence to the book, and the book is not Google's
to license. The repository's own use is non-commercial research. It does not
offer the page, or any retained source bytes, under its own CC BY 4.0 licence
(THIRD_PARTY.md, "Retained Reusable Source Artifacts"), so it purports to
authorise nobody's commercial use of Google's words. "Refrain from automated
querying" is addressed to Google's systems, not to the file.

FAIR USE, INDEPENDENTLY. If no licence were implied, reproducing the page as an
incidental part of an unaltered evidentiary copy of a public-domain book would
be fair use under 17 U.S.C. Sec. 107, on this repository's reading: the purpose
is archival and evidentiary, not the page's own; the page is informational and
functional; it is reproduced whole only because the exact bytes are the
evidence; and no market for the page exists or is touched -- the retention
carries Google's attribution further, which is what the page asks. This is the
project's reasoning, not a holding, and it is recorded so that it can be
attacked on its own terms.

WHAT IS NOT RELIED ON. That the file downloaded, that the Internet Archive
serves it, that any host labels the item public domain, or that Google has not
objected. The United States status of the book inside the file must still be
established per artifact, on its own evidence, as guidance/sources.md requires.
"""

[conditions]
question = "What must a record do when it retains such a file?"
answer = "Four things, and a fifth when it chooses."
items = """
1. KEEP THE EXACT BYTES EXACT. Never strip the page from an exact artifact. A
   notice-free derivative may be made, as a separate artifact with its own
   record, a stated replayable cut and a derived_from edge -- the Dessain route
   of artifact.thomas-aquinas.in-omnes-pauli-epistolas-commentaria.dessain-volume-2-1857.book-ocr-2b7b11dc
   ("Take exact parent bytes from byte offset 3010 ... removes exactly 50
   LF-delimited wrapper lines") -- but it is not required and is not a rights
   precondition.
2. SAY WHERE THE PAGE IS. The record names its physical lines or its artifact
   page and says it is Google's, not the book's. Of the seven tracked payloads
   that carry Google front matter today, two say so (the Mozarabic records) and
   five do not; `census` lists them.
3. NEVER TREAT IT AS THE BOOK. It is not quoted as source text, not cited as
   evidence about the book, and not counted by a search or a negative: a
   raw-line query that could match "public domain", "google" or "copyright"
   inside such a file must bound its lines to exclude the page.
4. DECIDE STORAGE ON THE ORDINARY GROUNDS. The printing's own United States
   rights basis, measured size and duplication, as for any other artifact. A
   large Google PDF may still stay `remote` on a measured size argument; it may
   not stay `unresolved` on account of the page.
5. PREFER A NON-GOOGLE SCAN WHEN IT IS AS GOOD. Where a non-Google scan of the
   same printing is equally complete and legible -- an Internet Archive Scribe
   scan, a library's own digitisation -- register that one first. This is the
   maintainer's D9 preference, kept as a quality preference: such scans carry no
   third-party prose to identify, and their text layers are usually better. It is
   no longer a rights requirement. The 2026-09-22 Time-after-Pentecost
   acquisitions followed it: all eight are Toronto Scribe scans with no Google
   matter at all.
"""

[the_other_google_matter]
question = "Does the same answer govern Google's shorter reproduction statement and its page-foot stamp?"
answer = "Yes for the statement; and the stamp alone never bars retention."
reasoning = """
THE REPRODUCTION STATEMENT. Older Google files open instead with "This is a
reproduction of a library book that was digitized by Google as part of an
ongoing effort to preserve the information in books and make it universally
accessible", followed by "Google books" and the address of books.google.com.
It is Google's front matter doing the same job in fewer words, and it is
treated exactly as the usage-guidelines page. Three tracked Revue bénédictine
text layers carry it at lines 1-3 (`census`); one Migne text layer was refused
for it.

THE STAMP. "Digitized by Google" at the foot of each page is four words naming
the digitiser. Words and short phrases are not subject to copyright (37 C.F.R.
Sec. 202.1(a)); the stamp carries no notice, reserves nothing, and is the very
attribution the usage guidelines ask users to keep. The library already tracks
it in many files, with that reasoning written out at
artifact.catholic-church.missale-romanum.pustet-ratisbon-1862.missale-romanum-1862-text-f34bc7cf
and artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.roman-missal-1843-text-6949d12f,
and it is retained there deliberately as the only page-boundary evidence in
those layers. Five Gerbert records nevertheless refused bytes for the stamp
alone, calling it "Google-authored matter" and citing the Cummiskey 1843
refusal, which was about the front-matter page and not the stamp. Under this
record the stamp is never a ground for non-retention.
"""

[the_contradiction_reconciled]
question = "Which existing dispositions does this settle, and which way?"
answer = "The retaining records were right; the refusals rest on superseded reasoning."
reasoning = """
THE LITURGICAL YEAR VOLUME XI, which the plan names. The tracked PDF
artifact.prosper-gueranger.the-liturgical-year.english-duffy-1900-volume-11.ia-pdf-95ba98e2
carries the usage-guidelines page as its PDF page 1, and its record does not
mention it. The text layer of the same Internet Archive item,
artifact.prosper-gueranger.the-liturgical-year.english-duffy-1900-volume-11.ia-djvu-ocr-f4c31a52,
carries the same page at its lines 1-44 (read on 2026-09-22 in a fresh fetch
whose SHA-256 matched the record) and was refused for it. Under this record the
PDF's disposition stands, its record should say where the page is, and the text
layer is retainable; see `duplicate_text_layer_records` for why that record is
not the one to change now.

THE CHAIN OF REFUSALS. The Cummiskey 1843 text layer
(artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1843.ia-djvu-ocr)
was recorded "remote and unresolved" because "no distribution grant was
established" for Google's page. Later records adopted that disposition by
citation -- often in the words "following the disposition already settled at"
it -- for the usage-guidelines page, for the reproduction statement, and for the
stamp. None engaged the implied-licence reasoning the Mozarabic record had set
out, and none noted that the same repository tracked the same prose elsewhere.
The absence of an express grant was treated as a refusal; this record holds that
the page itself is the grant, and that fair use would suffice without it.

WHY THE RETAINING SIDE AND NOT THE REFUSING ONE. Three reasons, in order of
weight. The retaining side has an argued basis and the refusing side has only
an absence. The retaining side is what the repository actually does with its
tracked bytes, in seven payloads; choosing refusal would have declared seven
live retentions unlawful with no way to correct them now, since their records
are fingerprinted and pinned. And refusal costs evidence: it is why, until
2026-09-22, this library held no searchable English text file of The Liturgical
Year's Time after Pentecost volume II that a reader could open offline; the
tracked PDF's embedded text is not registered as an indexable artifact.
"""

