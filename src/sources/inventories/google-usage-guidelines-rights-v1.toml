checks = '''
Each command was run against this checkout on 2026-09-22, before and after the
eight Time-after-Pentecost editions were added, and the output quoted is what it
printed.

1. TRACKED PAYLOADS THAT CARRY GOOGLE FRONT MATTER. Text layers are read as
   files, PDFs through pdftotext; runs of non-alphanumeric characters are
   collapsed because these scans double their spaces:

     python3 -c "
     import glob,re,subprocess,tomllib
     for p in sorted(glob.glob('src/sources/works/**/artifact.toml',recursive=True)):
         r=tomllib.load(open(p,'rb'))
         if r.get('storage')!='tracked' or not r.get('path'): continue
         mt=r.get('media_type','')
         if mt.startswith('text/'): t=open(r['path'],encoding='utf-8',errors='replace').read()
         elif mt=='application/pdf': t=subprocess.run(['pdftotext',r['path'],'-'],capture_output=True,text=True).stdout
         else: continue
         n=re.sub('[^a-z0-9]+',' ',t.lower())
         if any(k in n for k in ('usage guidelines','about google book search','this is a reproduction of a library book')): print(r['id'])
     "

   Seven ids: the three Revue bénédictine text layers, the two Mozarabic text
   layers, the Patrologia Graeca 29 text layer and the Liturgical Year volume XI
   PDF, as listed in `census`.

2. RECORDS REFUSED ON GOOGLE-MATTER GROUNDS:

     python3 -c "
     import glob,re,tomllib
     pat=re.compile(r\"Google's own prose|Google-authored|Google's own front matter|modern Google notice|Google.s modern opening notice\")
     for p in sorted(glob.glob('src/sources/works/*/*/editions/*/artifacts/*/artifact.toml')):
         r=tomllib.load(open(p,'rb'))
         if r.get('storage')!='tracked' and pat.search(r.get('rights_basis') or ''): print(r['id'])
     "

   Twenty-one ids, classified in `census` as thirteen for the usage-guidelines
   page, one for the reproduction statement, and seven for the stamp or a
   parent's disposition.

3. RECORDS REFUSED ON THE GENERIC TWO-PART REASON: the same loop with the
   literal "digitiser's own front matter where the file carries it" in place of
   the pattern. Seventeen ids.

4. DIGESTS DESCRIBED BY MORE THAN ONE ARTIFACT RECORD:

     python3 -c "
     import glob,tomllib,collections
     by=collections.defaultdict(list)
     for p in glob.glob('src/sources/works/**/artifact.toml',recursive=True):
         r=tomllib.load(open(p,'rb'))
         if r.get('sha256'): by[r['sha256']].append(r['id'])
     print(sum(1 for v in by.values() if len(v)>1))
     "

   19. The pair of `duplicate_text_layer_records` is the one whose two ids share
