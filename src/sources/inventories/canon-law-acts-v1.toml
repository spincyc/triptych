attests_kind = "book-states-it"
attests_basis = "Its title page reads PARS PRIOR / DECRETUM MAGISTRI GRATIANI / LIPSIAE MDCCCLXXIX, and the Decretum begins in it at CONCORDIA DISCORDANTIUM CANONUM, Distinctio Prima."
read_from = "ocr-only"
