text = "Codex vigentem huc usque disciplinam plerumque retinet, licet opportunas immutationes afferat. Itaque : 1. ° Leges quaelibet, sive universales sive particulares, praescriptis huius Codicis oppositae, abrogantur, nisi de particularibus legibus aliud expresse caveatur; 2. ° Canones qui ius vetus ex integro referunt, ex veteris iuris auctoritate, atque ideo ex receptis apud probatos auctores interpretationibus, sunt aestimandi; 3. ° Canones qui ex parte tantum cum veteri iure congruunt, qua congruunt, ex iure antiquo aestimandi sunt; qua discrepant, sunt ex sua ipsorum sententia diiudicandi; 4. ° In dubio num aliquod canonum praescriptum cum veteri iure discrepet, a veteri iure non est recedendum; 5. ° Quod ad poenas attinet, quarum in Codice nulla fit mentio, spirituales sint vel temporales, medicinales vel, ut vocant, vindicativae, latae vel ferendae sententiae, eae tanquam abrogatae habeantur; 6. ° Si qua ex ceteris disciplinaribus legibus, quae usque adhuc viguerunt, nec explicite nec implicite in Codice contineatur, ea vim omnem amisisse dicenda est, nisi in probatis liturgicis libris reperiatur, aut lex sit iuris divini sive positivi sive naturalis."
