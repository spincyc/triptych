# --- The Code of 1983, and the acts that have amended it --------------------
#
# Twelve amending acts and fourteen occasions on which a Pope disposed of an
# authentic interpretation, in one chain in date order. Almost every edge is
# `line-order`, which is the weakest kind there is and the honest one: these
# acts stand on one line in this order and, with the exceptions noted on the
# rows themselves, none recites the one before it. An amending act recites the
# CODE, not its predecessor.
#
# NOT ONE OF THESE ROWS QUOTES ITS ACT. See the head of this file: the Latin of
# a modern act of the Holy See is claimed text and this project holds no licence
# for it, so each basis says in this project's English what the act says and
# names the article and the line of the retrieved delivery where it says it.

[[acts]]
id = "sacrae-disciplinae-leges-1983"
line = "johanno-pauline"
station_kind = "promulgated"
kind = "promulgation"
date = "1983-01-25"
title = "Sacrae disciplinae leges promulgates the Code now in force"
instrument = "Constitutio apostolica Sacrae disciplinae leges"
authority = "John Paul II"
act_citation = "cited-externally"
read_from = "ocr-only"
effect_established = true
