parents = ["postquam-apostolicis-litteris-1952"]
parent_kind = "line-order"
parent_basis = """
The fourth of the four, in order. This one was not read reciting the three
before it; the act that recites all four is Sacri canones.
"""
effect = """
Titles II, III, IV, V and XVII of the draft -- the largest of the four, running
to 168 pages of the Acta -- in force from 25 March 1958.
"""
effect_note = """
THE CODIFICATION STOPPED THREE FIFTHS OF THE WAY THROUGH, and the CCEO's own
preface says so: of the 2,666 canons of the 1945 draft, the four motu proprios
promulgated about three fifths, and 1,095 canons stayed in the Commission's
archive. That is the shape of this line between 1957 and 1990 -- part of the
Eastern law codified and promulgated, and part of it drafted and not.
"""

[[acts]]
id = "sacri-canones-1990"
line = "orientale"
station_kind = "promulgated"
kind = "promulgation"
date = "1990-10-18"
title = "Sacri canones promulgates the Code of Canons of the Eastern Churches"
instrument = "Constitutio apostolica Sacri canones"
authority = "John Paul II"
act_citation = "cited-in-corpus"
read_from = "ocr-only"
effect_established = true
citation = "Ioannes Paulus II, const. ap. Sacri canones, 18 Octobris 1990, AAS 82 (1990) 1033-1044; the Code itself at AAS 82 (1990) 1045-1363."
parents = ["cleri-sanctitati-1957"]
parent_kind = "act-states-it"
parent_basis = """
The constitution names all four of the partial codifications in one parenthesis,
in order, as what the Apostolic See promulgated of the draft: `quattuor Litteris
apostolicis motu proprio datis (Crebrae allatae sunt, Sollicitudinem Nostram,
Postquam Apostolicis Litteris et Cleri sanctitati) promulgavit`. An act that
names what it completes has drawn its own edge, and the edge is drawn to the
last of the four.
"""
effect = """
It takes force on 1 October 1991, and the constitution says why that day: the
feast of the Protection of the Blessed Virgin Mary in most of the Churches of
the East.
"""
effect_note = """
THE LINE IS SEPARATE BY DESIGN AND THE ACT SAYS SO. The constitution records the
constant will of the Roman Pontiffs, from the beginnings of Eastern canonical
codification, to promulgate TWO Codes, one for the Latin Church and one for the
Eastern Catholic Churches, so that the Church may breathe with her two lungs of
East and West. It states parity rather than subordination -- the canons of the
Eastern Code are to have the same firmness as the laws of the Latin Code -- and
it describes the whole as completed by juxtaposition, the Eastern Code standing
beside the Latin Code of 1983 and the constitution on the Roman Curia of 1988,
which is ADDED TO BOTH.

TWO WITNESSES, AND THEY DIFFER IN THEIR HEADING. The Acta prints no
`CONSTITUTIO APOSTOLICA` title block: the page runs the papal style straight
into the incipit, and only the running head calls it a constitution. The
vatican.va delivery adds the title block. The datelines agree, allowing for the
Acta scan reading `xvin` for XVIII.
"""

