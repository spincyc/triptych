The Eastern half of the same document. Canon 598 gains a second paragraph in the
same terms as Latin c. 750 §2, its existing text becoming §1; c. 1436 §2 is
reissued with words referring to the new c. 598 §2.
"""
effect_note = """
THIS IS THE SAME INSTRUMENT AS `ad-tuendam-fidem-1998` AND NOT A SECOND ONE. It
stands twice because two Codes are two lines and a commit cannot leave a state
on both; `act-history check` refuses the pair unless both rows agree on the
instrument, the authority, the date and the citation.

THE HOLY SEE'S OWN CONSOLIDATED EASTERN TEXT HAS NEVER APPLIED IT AT can. 598.
The delivery serves that canon as a single unnumbered paragraph, with a spurious
semicolon in it, where this act requires two paragraphs. See the note on the
witness row.
"""

