"""
units_read_note = """
THE LONGEST NOTE IN THIS FILE, AND IT EARNS IT. This delivery is the text most
people read when they read the Eastern Code, and on the canons this record
carries it is wrong in five ways. Two of its three parts hash byte for byte to
artifacts this repository registered on 2026-07-25 and 2026-07-28, so these are
defects in bytes this project has already cited.

ONE. Iam pridem's new paragraph is served at the wrong canon, and duplicated.
The act puts a new §3 into can. 102 and renumbers the old §3 as §4. The delivery
leaves can. 102 with the 1990 text and unmarked, and instead marks can. 104 as
amended and gives it a §3 with the new eighty-year rule and a §4 that is
VERBATIM THE SAME PARAGRAPH AS can. 102 §3. The Acta of 1990 has can. 102 with
three paragraphs and can. 104 with two.

TWO. In consequence, the delivery's cann. 149 and 183 §1 do carry the new
cross-reference `firmo can. 102, § 3`, and in that same delivery can. 102 §3 is
the paragraph about inviting experts, not the eighty-year rule. The
cross-reference resolves, and to the wrong text.

THREE. Can. 66 §1 is flagged as amended and is not: the delivery prints it
without the cross-reference Iam pridem art. 1 requires, and its own `previous
version` block prints the identical string, as does the 1990 Acta.

FOUR. Competentias quasdam decernere is nowhere applied. Six canons this record
carries -- 489 §2, 496 §1, 499, 552 §1, 1052 §1, 1054 §1 -- all still read as
they read in the Acta of 1990. Can. 489 §2 still says three years where the act
of 2022 says five. And where the delivery DID apply a later act, at can. 501 §2,
its `previous version` block prints the 1990 text and silently collapses the
2022 step in between.

FIVE. Mitis et misericors Iesus is not applied at all. The delivery serves the
1990 text of the whole marriage-nullity article -- cann. 1357 and 1358 in their
1990 form, matching the Acta -- which is structurally incompatible with the act
of 2015 that folded the old 1358 into 1357 §2. No amendment marks, no footnote,
nothing.

AND ONE MORE, at can. 598: Ad tuendam fidem requires two paragraphs and the
delivery prints one, with a semicolon in it that the Acta does not have. Can.
1436 §2 is present only because Vocare peccatores restated it in 2023.

THIS IS WHY THE RECORD IS KEYED ON ACTS. Every one of the six is invisible to
anyone reading the consolidated text, and every one of them is obvious the
moment the acts are laid out in order beside it.
"""

