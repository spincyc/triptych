# Books and deliveries. A witness attests an act and is not a station, and the
# distinction bites hardest here at the Holy See's own consolidated Eastern
# text, which is a witness that has not caught up with four of the acts this
# record carries -- see its row, which is the longest in this file and earns it.

[[witnesses]]
