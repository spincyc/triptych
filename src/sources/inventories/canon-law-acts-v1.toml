parents = ["sacrosanctae-romanae-ecclesiae-1298"]
parent_kind = "line-order"
parent_basis = """
Two acts on one line in this order, and nothing in either names the other. The
address is again to the doctors and scholars of Bologna, and the closing clause
directs that the constitutions be used henceforth in the courts and in the
schools without reciting the collections that precede them.
"""
quotation = """
Ioannes Episcopus servus servorum Dei, dilectis filiis doctoribus et scholaribus
universis Bononiae commorantibus, salutem et apostolicam benedictionem. Quoniam
nulla iuris sanctio, quantumcunque perpenso digesta consilio, ad humanae.
"""
date_note = """
THE DAY IS READ AND THE YEAR IS DERIVED, and this record says which is which
because the two are not equally strong.

The bull's own dating clause, printed at its foot, reads `Data Avinione VIII.
Kal. Novembris Pontificatus nostri anno secundo` -- Avignon, the eighth kalends
of November, the second year of the pontificate. That is the 25th of October,
read. Friedberg's apparatus at that place records that one manuscript witness
omits the `VIII.`

The Anno Domini year is NOT in the bull. It comes from Friedberg's surrounding
prose, which argues that the constitutions were used in the schools and the
courts before 1317 and that the compilation was sent to the universities in the
third year after Clement V's death, with that death dated `die XX. mensis
Aprilis A. 1314`.

DO NOT CORROBORATE IT FROM FRIEDBERG'S OWN CHRONOLOGICAL TABLE. The table on
p. LXV carries a row reading `VIII. Kal. Nov. II. 1317`, which looks like exactly
this bull and belongs to a different document, and Friedberg's Addenda et
Corrigenda then revoke both its year and its pontifical year: `LXV. no. 5. lin.
1.: 1316. = 1317.` and `12.: VIII. Kal. Nov. II. : = III.` A reference that
resolves successfully and wrongly, printed inside the source it would be checked
against.
"""
effect_note = """
A SECOND AND EARLIER INSTRUMENT EXISTS FOR THE SAME COLLECTION AND IS NOT DRAWN
AS A STATION. Friedberg prints, from a Kassel manuscript, a letter of Clement V
himself to the university of Orleans -- `Cum nuper in generali concilio
Viennensi et ante et post quasdam constitutiones super certis articulis duximus
promulgandas` -- directing that the constitutions sent under his bull be used in
the courts and in the schools, and he says he found another of the same tenor
sent to Paris. The footnote to John XXII's bull records that in two witnesses
John's bull is absent and Clement's stands in its place.

It has no station because IT CARRIES NO DATE ANYWHERE IN THESE BYTES: no year,
no place, no Potthast number. A station needs a date and this record will not
invent one. It is written down here so that whoever can date it knows where to
put it.
"""

