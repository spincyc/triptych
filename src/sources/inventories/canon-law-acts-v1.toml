Gratiano collectorum ... Iubemus igitur, ut que emendata et reposita sunt, omnia
quam diligentissime retineantur, ita ut nihil addatur, mutetur aut imminuatur
... Datum Romae apud sanctum Petrum sub annulo Piscatoris, die secunda Iunii,
M. D. LXXXII. Pontificatus nostri anno undecimo. ANT. BUCCAPADULIUS.
"""
effect = """
The correctores Romani did not restore the Decretum as Gratian composed it.
Friedberg says as much of them in terms: their aim was not to restore the text
as Gratian had made it but as Gratian ought to have made it.
"""
effect_note = """
A DISCREPANCY INSIDE THE SOURCE, and it is Friedberg's and not a scanner's. The
sentence introducing these two briefs reads `Duobus quae secuntur brevibus a.
