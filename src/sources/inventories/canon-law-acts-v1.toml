language = "la"
printed = "1582"
attests = "emendationem-decretorum-1582"
attests_kind = "book-states-it"
attests_basis = "Its title page says the edition was published by order of Gregory XIII at the press of the Roman people in 1582, which is the act this station stands on. The title page is read in Friedberg's transcription of it rather than from the book."
read_from = "ocr-only"
rights = "public-domain"
rights_basis = "A 1582 printing. Digitised copies on the Internet Archive from the Biblioteca Nazionale Centrale di Roma, items bub_gb_9y96LgFXWv8C, bub_gb_x0KFK3xeuXUC and bub_gb_F3wgAkM6cZ8C."
units_read_note = """
THE TEXT LAYER OF THIS BOOK IS UNUSABLE AND THAT IS A MEASUREMENT. Normalised
whole-file searches of one of the three scans for `Humanum genus duobus`,
`Concordia discordantium`, `Emendationem decretorum`, `Cum pro munere`, `annulo
Piscatoris`, `Buccapadulius`, `Glorierius` and `MDLXXXII` return 0 each. It is a
scan of heavily glossed folio and the scanner made noise of it. Everything this
record says about the 1582 edition is therefore read in Friedberg's 1879
reprint.

The three Internet Archive items are almost certainly three scans of one
printing and are counted as ONE witness. They were not collated.
"""

