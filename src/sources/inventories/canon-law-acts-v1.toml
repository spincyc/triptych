# --- The divisions of the Eastern Code --------------------------------------
#
# THREE, AND THE COARSENESS IS THE FINDING. No structural index of the CCEO was
# parsed for this record, so an Eastern canon is placed in a division only where
# an ACT names the division it stands in -- which two of them do, by title and
# chapter and article. Everything else stands at the Code, which is what this
# record can support. The bare designations and English descriptions follow the
# same rights rule as the 1983 Code's.

[[divisions]]
id = "cceo"
at = "sacri-canones-1990"
book = "cceo"
designation = "Codex Canonum Ecclesiarum Orientalium"
title = "The Code as a whole, for canons this record does not place more finely"
note = """
A canon stands here where no act read for this record names the title it belongs
to. That is a statement about what was read and not about the Eastern Code,
which is divided into thirty titles.
"""

[[divisions]]
id = "cceo-tit-xxvi-cap-i-art-i"
at = "sacri-canones-1990"
book = "cceo"
designation = "Titulus XXVI > Caput I > Articulus I"
title = "Cases for declaring the nullity of a marriage"
within = "cceo"
note = """
cann. 1357-1377. NAMED BY THE ACT THAT SUBSTITUTED IT: Mitis et misericors Iesus
decrees that Title XXVI, chapter I, article I of the Eastern Code, on cases for
declaring the nullity of a marriage, cann. 1357-1377, be substituted entire.
[Latin delivery, line 61.]
"""

[[divisions]]
id = "cceo-tit-xxvii"
at = "sacri-canones-1990"
book = "cceo"
designation = "Titulus XXVII"
title = "Penal law: delicts and penalties"
within = "cceo"
note = """
NAMED BY THE ACT THAT REFORMED IT: Vocare peccatores says it is reforming
twenty-two canons from Title XXVII together with can. 1152. [Latin delivery,
line 44.] It does not print the Title's canon range, so no range is written
here.
"""

