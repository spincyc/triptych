parents = ["ad-tuendam-fidem-cceo-1998"]
parent_kind = "line-order"
parent_basis = "Two acts on this line in this order; nothing in either names the other."
effect = """
The Eastern twin of Mitis Iudex, issued the same day and drawn as its own
instrument. It substitutes entire, from 8 December 2015, Title XXVI, chapter I,
article I of the Eastern Code -- cann. 1357 to 1377, twenty-one canons, the same
count as the Latin chapter.
"""
effect_note = """
IT IS JUSTIFIED BY THE SEPARATENESS OF THE TWO LINES. The act says it is issuing
norms BY DISTINCT LETTERS given motu proprio, and it quotes and cites Sacri
canones' two-lungs passage by page of the Acta to say why. So the strongest
evidence in this record that the Eastern line does not rejoin the Latin one is
the pair of acts that most obviously march in step.

The delivery misspells its own incipit in the title block -- `MITIS ET MISERICOS
IESUS` -- and spells it correctly two lines later in the body. Confirmed once in
the HTML; it is the Holy See's typography.
"""

