# --- The divisions of the 1917 Code -----------------------------------------
#
# THESE CARRY THE BOOK'S OWN LATIN RUBRICS, because the 1918 printing is public
# domain and this project may print it. Set that beside the 1983 divisions
# above, which carry a bare designation and an English description, and the
# rights position is visible in the record's own texture rather than only in its
# prose.
#
# Every rubric and every canon range below was read in the printing's own table
# of contents, at the line named on the row. Where the contents' range for a
# finer division is destroyed in the scan, the canon is placed at the division
# above and the row says so -- which is why cann. 87 and 132 stand at Liber
# Secundus and no finer, though the book divides that Book into three Parts and
# thirty Titles.

[[divisions]]
id = "cic17-lib-i"
at = "providentissima-mater-1917"
book = "cic-1917"
designation = "Liber Primus"
title = "Normae generales"
note = "cann. 1-86, read at line 112 of the 1918 printing's table of contents."

[[divisions]]
id = "cic17-lib-i-tit-i"
at = "providentissima-mater-1917"
book = "cic-1917"
designation = "Titulus I"
title = "De legibus ecclesiasticis"
within = "cic17-lib-i"
note = "cann. 8-24, read at line 114 of the 1918 printing's table of contents."

[[divisions]]
id = "cic17-lib-ii"
at = "providentissima-mater-1917"
book = "cic-1917"
designation = "Liber Secundus"
title = "De personis"
note = """
cann. 87-725, read at line 129 of the 1918 printing's table of contents. THE
CANONS THIS RECORD PLACES HERE STAND NO FINER THAN THE BOOK, and that is a bound
on the reading and not on the Code: the contents leaf prints this Book's Parts,
Sections and Titles by name -- Pars Prima De clericis, Sectio I De clericis in
genere, Titulus III De obligationibus clericorum -- and the scan has lost their
canon ranges, so the range that would place a canon under one of them cannot be
read. The headings are there to be read by anyone with a better scan.
"""

