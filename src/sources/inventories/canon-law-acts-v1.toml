# The Code of Canon Law as a history of acts.
#
# The base unit here is the CANON, because a canon lawyer arrives with a
# citation and not with a date. The question this record exists to answer is
# `what did c. 1095 say before Mitis Iudex, and which act changed it` -- and the
# answer that record gives for that particular canon is `nothing, and none`,
# which is the shape of finding this apparatus is for. Mitis Iudex substituted
# the twenty-one canons of the process for declaring a marriage null. It did not
# touch the canon on matrimonial consent that those processes are usually about.
#
# Written 2026-08-01 on the model of latin-missal-acts-v1.toml and under the
# rules of guidance/act-histories.md. Everything that document settles holds
# here: the station is the act, a printing is a station only where no act is
# claimed and says so, every edge declares what it rests on, lines never rejoin,
# and commonality is computed rather than written down.
#
# ---------------------------------------------------------------------------
# WHAT MAY BE PRINTED HERE, AND WHAT MAY NOT
#
# canon-law-rights-v1.toml settles this and it is not settled again. In short:
#
#   the 1917 Code, Latin      PUBLISHED. Rome, 1918; a foreign publication
#                             before 1931 is in the United States public domain.
#   the 1983 Code             WITHHELD, and so are the CCEO and every act
#                             amending either, because Vatican City State Law
#                             N. CXCVII of 1 September 2017, article 2, applies
#                             copyright to the texts of the laws and official
#                             acts of the Holy See by name.
#
# The consequence runs further than the canons and is worth stating, because it
# is the one thing about this file a reader will find strange. IN EVERY OTHER
# SLICE OF THIS PROJECT AN EDGE QUOTES THE SENTENCE IT RESTS ON. Here it cannot,
# for anything later than 1929: the basis of an edge is a sentence of an act of
# the Holy See, and quoting it is publishing it. So every basis below states, in
# this project's own English, what the act says and exactly where -- the
# delivery, its sha256, the article or paragraph, and the line of the retrieved
# artifact -- so that the claim is checkable to the byte without the protected
# text being reproduced. Where the source is public domain, which is the 1917
# Code and the whole of the Corpus Iuris Canonici, it is quoted as usual, and
# the difference in texture between those rows and the modern ones is the rights
# position showing through the record rather than being hidden by it.
#
# Division rubrics follow the same rule, which the rights record settles in
# terms: a division of the 1917 Code carries the Latin rubric its book prints; a
# division of the 1983 Code or the CCEO carries its bare designation -- `Liber
# IV > Pars I > Titulus VII` -- and a description of its subject written by this
# project in English.
#
# ---------------------------------------------------------------------------
# THE TWO QUESTIONS THE READING PAGE TAKES A POSITION ON, ANSWERED THE SAME WAY
#
# AN AUTHENTIC INTERPRETATION IS A STATION AND IS NOT A DEPARTURE. It is a
# station because an authority acted, on a date, citing an instrument, which is
# the whole test this history applies. It is not a departure because every
# departure kind in guidance/recensions.md section 3 is a claim about the TEXT,
# and an interpretation settles a meaning while altering no syllable. The canon
# it interprets shows an unchanged file, and that is the record working.
#
# ITS FORCE DECIDES WHETHER IT BINDS RETROACTIVELY, AND NOT ONE OF THE SOURCES
# STATES A FORCE. 1917 c. 17 §2, whose Latin this record carries and may print,
# divides an interpretation given by way of law into one that merely DECLARES
# words certain in themselves -- which `promulgatione non eget et valet
# retrorsum` -- and one that restricts, extends or explains a doubtful law, which
# `non retrotrahitur et debet promulgari`. 1983 c. 16 §2 keeps the division. So
# the force is the whole practical question, and:
#
#   a whole-file search of the Holy See's Latin collection of the
#   interpretations for `declarativ`, `restrictiv`, `extensiv`, `retroactiv`,
#   `vim legis` and `promulgatione` returns 0, 0, 0, 0, 0 and 0. The same six
#   searches over the twenty-six pages the Dicastery for Legislative Texts now
#   serves return nothing either.
#
# Every interpretation below therefore carries `force = "unstated"`, and that is
# a fact about the sources rather than about this search. What the sources DO
# state is how the Pope disposed of the decision, in two fixed formulae -- he
# ordered it published (22 times), or he confirmed it and ordered it promulgated
# (4 times) -- and since under c. 16 §2 an interpretation needing promulgation is
# by that fact not merely declarative, the formula bears on the question without
# settling it. It is carried in `papal_act` as a controlled value. TURNING IT
# INTO A FORCE WOULD BE THIS RECORD DECIDING A POINT OF CANON LAW, which is the
# one thing it must not do.
#
# THE 1917 AND 1983 NUMBERINGS DO NOT CORRESPOND, AND THIS RECORD DRAWS NO MAP
# BETWEEN THEM. Not one row here joins a canon of one Code to a canon of the
# other. They are separate lines, they are numbered independently, and the
# resemblance between 1917 c. 1081 on matrimonial consent and 1983 c. 1095 on
# incapacity to consent is a scholarly claim that would have to arrive with its
# source. The two stand in this record side by side and unjoined, which is what
# the record actually knows.
#
# ---------------------------------------------------------------------------
# WHAT WAS SEARCHED
#
# Repositories: vatican.va (the Holy See portal, the `archive/cod-iuris-canonici`
# and `archive/aas` document roots, and the Pontifical Council for Legislative
# Texts' collection); press.vatican.va; delegumtextibus.va (the Dicastery's
# present site); the Internet Archive; the Bavarian State Library (MDZ), for its
# IIIF manifests, its MARCXML and its hOCR page transcriptions; Gallica, whose
# SRU interface answered and whose 25 retrieved records held nothing on point;
# the Google Books API, which was quota-exhausted and returned HTTP 429 for the
# whole run and is therefore UNSEARCHED rather than empty; and this repository's
# own source library, which turned out to hold the 1917 printing, the 1983 Book
# VI HTML and the AAS volume carrying the CCEO already, each matching by sha256.
#
# Aliases resolved before searching, and applied to every repository rather than
# to the one where each was discovered: `corpus iuris canonici` / `corpus juris
# canonici`; `Codex Iuris Canonici` / `Codicis Iuris Canonici`; `interpretatio
# authentica` / `interpretationes authenticae` / `interpretazioni autentiche` /
# `responsum ad propositum dubium`; `Pontificia Commissio Codici Iuris Canonici
# Authentice Interpretando` / `Pontificium Consilium de Legum Textibus` /
# `Pontificio Consiglio per i Testi Legislativi` / `Dicastero per i Testi
# Legislativi`; `Competentias quasdam decernere` / `Assegnare alcune competenze`,
# which is one instrument under two names and is served from the Italian URL.
#
# Every whole-file Latin search was normalised -- NFD, combining marks dropped,
# lowercased, ae and oe ligatures folded, non-alphanumerics collapsed -- because
# a literal search is a search for a typesetting decision. That is not a
# formality. A LITERAL whole-file search of the 1918 printing's text layer for
# `LIBER PRIMUS` RETURNS 0 AND THE BOOK PRINTS IT ON ITS FIRST LEAF; normalised,
# the same search returns 10. Two of the three medieval promulgating bulls were
# likewise invisible to a literal search of the Internet Archive text layer --
# `Quoniam nulla` returns 0 because that scan reads `Ouoniam` with a letter O --
# and were found by searching a fragment that avoided the damaged glyph, then
# re-read in a second and cleaner transcription.

acts_schema = 1
vocabulary = "law"
slice = "code-of-canon-law"
identity = "Canon law act tracer <act-history@triptych.invalid>"

extent = """
Four bodies of law, on four lines that never rejoin, from Gratian to 2023.

WHAT IS HERE. The classical Corpus Iuris Canonici as six stations, of which
three carry a promulgating bull whose text was read and three claim no act at
all. The 1917 Pio-Benedictine Code, whose Latin is public domain and is printed
here for the canons this record carries. The 1983 Code with the twelve acts that
have amended it and the fourteen occasions on which the Pope disposed of an
authentic interpretation of it. The 1990 Code of Canons of the Eastern Churches,
with the four motu proprios of Pius XII that partly codified Eastern law before
it and the six acts that have since amended it.

WHAT IS NOT HERE, AND WHY.

No text of the 1983 Code, of the CCEO, or of any act amending either. Those
canons stand with their number, their paragraph, their place in the structure,
every act that established or changed them, and a stated reason where the words
would be. That is a rights position and not ignorance, and the two are drawn
differently everywhere.

No text of any canon of the Corpus Iuris Canonici. Those three lines carry
stations, witnesses and descent, and no law. The Decretum alone runs to some
3,800 chapters; transcribing any part of it is a different lane's work, and
until it is done a query about what two lines share can report acts and cannot
report text.

Not every canon of any of these Codes. This record carries a canon when an act
touched it, when an authentic interpretation was given on it, when this
repository already held a verified reading of it, or when it is the canon the
whole apparatus is built to answer a question about. Counted at the tips: 86
canons of the 1983 Code in 99 base units, 39 of the Eastern Code in 45, and 12
of the 1917 Code in 25. The 1983 Code has 1752 canons, so this is five per cent
of one Code and a smaller fraction of the others.

Not the whole of Book VI of the 1983 Code. Pascite gregem Dei substituted the
entire Book -- cann. 1311-1399, eighty-nine canons, confirmed by counting the
canon numbers in the Latin PDF the Holy See serves -- and this record carries
the five of them that some other act or interpretation independently reaches. So
that station's diff is five canons wide and the act was eighty-nine wide, and
saying so here is the only way the difference does not read as a claim.
"""

commonality_reading = """
`act-history commonality` answers two different questions and they must not be
run together.

THE SHARED BASE IS ABOUT ACTS, and in this record the answer between any two
lines is NONE. That is not a defect. The Corpus Iuris Canonici, the 1917 Code
and the Eastern line are drawn as roots because no instrument was found that
states a descent, and the one cross-line edge this record does draw -- from the
1917 Code to the 1983 Code, because Sacrae disciplinae leges recounts the
decision to reform the Code promulgated in 1917 -- makes the 1917 promulgation
the shared base of those two and of nothing else.

THE DIVERGENCE IS ABOUT TEXT, and here the reading runs the other way and this
record CANNOT YET SUPPORT IT. Three of the four lines carry no unit at all, and
the fourth carries canons whose words are withheld, so a comparison of two lines'
trees reports what has been transcribed and what may be printed, and nothing
else. A reader who took a count of shared files for a statement about the two
Codes would have it exactly backwards. The 1917 and the 1983 Codes have almost
nothing in common as files in this record and a great deal in common as law.
"""

[withheld]
holy-see-post-1929 = """
a work of the Holy See later than 1929, over whose text Vatican City State Law
N. CXCVII of 2017 art. 2 asserts copyright by name; this project holds no licence
"""

# --- The lines --------------------------------------------------------------
#
# Four, and not one of them rejoins another. The two Codes now in force were
# promulgated seven years apart by the same Pope precisely so that they would
# stay two: Sacri canones states the constant will of the Roman Pontiffs to
# promulgate two Codes, one for the Latin Church and one for the Eastern
# Churches, and CCEO can. 1 -- which this repository has verified against the
# Acta page image -- bounds the Eastern Code to the Eastern Churches alone.

[[lines]]
id = "ius-antiquum"
label = "The Corpus Iuris Canonici"
note = """
The classical law: Gratian's concordance and the four papal collections that
grew around it, gathered and corrected by order of Gregory XIII in 1582 and in
force until the 1917 Code abrogated it. Six stations, no unit of law
transcribed, and four of the six standing as roots because no instrument was
found that says what any of them follows.
"""

[[lines]]
id = "pio-benedictine"
label = "The Pio-Benedictine Code (1917)"
note = """
The first codification of Latin canon law, begun under Pius X, promulgated by
Benedict XV on 27 May 1917 and in force from 19 May 1918 until the 1983 Code
took effect. This is the only body of law in this record whose words may be
printed here, and they are.
"""

[[lines]]
id = "johanno-pauline"
label = "The Code of 1983"
note = """
The Code now in force for the Latin Church, with every act that has amended it
and every occasion on which the Pope disposed of an authentic interpretation of
it. It is the one line here that descends from another: Sacrae disciplinae leges
recounts the announcement of a reform of the Code of 1917, and 1983 c. 6 §1 1°
abrogates that Code by name.
"""

[[lines]]
id = "orientale"
label = "The Code of Canons of the Eastern Churches (1990)"
note = """
Eastern law, codified in part by four motu proprios of Pius XII between 1949 and
1957 and wholly by John Paul II in 1990. It is a line of its own and never
rejoins the Latin one. A whole-file search of the CCEO's three Latin deliveries
for `Codicis Iuris Canonici` returns 0; the Latin Church appears in it ten times
and every one of them is in the form `of any Church sui iuris, the Latin Church
included`.
"""

# --- The Corpus Iuris Canonici ----------------------------------------------
#
# Eight stations, three of which carry a promulgating bull whose text was read
# in two independent transcriptions, and three of which claim no instrument at
# all. All of them are dated from Friedberg's critical edition of 1879-1881
# rather than from a medieval witness, and that bound is on every row.
#
# THE NEGATIVE THAT SHAPES THIS WHOLE LINE, run once and applied to all of it: a
# normalised whole-file search of Friedberg's second volume for `servus servorum
# Dei`, the opening of every papal letter, returns FIVE hits. Three of them are
# the three collection-level bulls below. The other two stand inside individual
# decretals. So there is no collection-level papal address anywhere in either
# Extravagantes collection, and none in the Decretum, and that is why four of
# these eight stations claim no act.

[[acts]]
id = "gratianus-decretum-1150"
line = "ius-antiquum"
station_kind = "printed"
kind = "compilation"
date = "1150"
title = "Gratian gathers the discordant canons into a concordance"
printing = "friedberg-1879-decretum"
act_citation = "none-claimed"
read_from = "ocr-only"
effect_established = false
citation = "Gratianus, Concordia discordantium canonum, in Corpus Iuris Canonici, ed. Aemilius Friedberg, pars prior, Lipsiae 1879."
root_basis = """
The record starts here because nothing was found that this collection follows,
and because the Decretum is where the classical law begins to be one book.
"""
distinct_edition_basis = """
It is the Decretum and nothing else: Friedberg gives it a volume of its own,
whose title page reads PARS PRIOR / DECRETUM MAGISTRI GRATIANI / LIPSIAE
MDCCCLXXIX. The four papal collections are the second volume and are separate
stations here.
"""
date_note = """
THE YEAR IS AN APPROXIMATION AND IS NOT A READING. Friedberg writes `Confectum
esse hunc librum circa annum MCL`, and he reaches it by internal argument -- the
book contains canons of Lateran II of 1139 and letters of Innocent II which he
dates between 1130 and 1148 -- rather than from any act or colophon. `1150` is
that `circa annum MCL` written to the precision the source gives, which is a
year, and no month or day is invented so that a filename will sort.

Worth recording because the round figure `c. 1140` is the one usually met, and
it is not what these bytes say.
"""
effect_note = """
NO INSTRUMENT EXISTS TO FIND, AND FRIEDBERG NEVER CLAIMS ONE. His prolegomena to
the volume are divided into five sections -- on the book's character and plan,
on its distinctions and paleae, on its sources, on the collections it drew on,
and on its editions -- and not one of them concerns authority, approbation or
promulgation. Normalised whole-file searches of the volume for `auctoritate
apostolica confirmamus`, `ad perpetuam rei memoriam`, `Bulla Gratiani`,
`Decretum promulgatum`, `publicam auctoritatem` and `auctoritate publica` return
0 each. `Eugenius III` returns one hit and it is a note of the Correctores about
a canon that Pope repeated at the Lateran, not an approbation. `approbatio`
returns seven and every one stands inside a canon.

So the Decretum is a private compilation that acquired authority by use and by
being taught, and this record says that by giving it a station of the weaker
kind rather than by asserting an approval nobody has produced.
"""

