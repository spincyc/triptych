units_read_note = """
NO UNIT OF THE DECRETUM IS TRANSCRIBED HERE. The volume's text layer is 8.5 MB
and the collection runs to some 3,800 chapters; reading any of it into this
record is a different lane's work.
"""

[[witnesses]]
id = "friedberg-1881-decretales"
label = "Corpus Iuris Canonici, ed. Aemilius Friedberg, pars secunda: Decretalium collectiones, Lipsiae 1881"
language = "la"
printed = "1881"
attests = "rex-pacificus-1234"
attests_kind = "book-states-it"
attests_basis = "It prints Rex pacificus at the head of the Decretals of Gregory IX, with Friedberg's dating footnote naming Spoleto and Potthast 9694, and it prints the promulgating bulls of the Sext and of the Clementines in the same way at the head of each."
read_from = "ocr-only"
rights = "public-domain"
rights_basis = "A German publication of 1881. Read in two transcriptions: the Internet Archive text layer of item corpusjuriscanon00richuoft and the Bavarian State Library's page transcriptions of bsb11501303, shelfmark 4 J.can.f. 116 i-2."
related_record = """
THE INTERNET ARCHIVE ITEM NUMBERS ARE INVERTED and a reader will be caught by
it: `corpusjuriscanon00richuoft` is volume TWO of 1881 and
`corpusjuriscanon01rich` is volume ONE of 1879. Both were opened at their title
pages before either was cited.
"""
units_read_note = """
The three promulgating bulls were read in both transcriptions and the Munich one
is the one quoted, because the Internet Archive layer is measurably worse on
exactly the sentences that matter: `Quoniam nulla` is unfindable in it, since it
renders the initial as `Ouoniam` with a letter O, and the dating footnote to Rex
pacificus comes out as `Kott Septanh ... (5. Sc^t. I234.)`.
"""

[[witnesses]]
