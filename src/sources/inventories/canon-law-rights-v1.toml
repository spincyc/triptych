[free_grants]
question = "Is there any free grant or open licence over a Latin or English text of either Code?"
answer = "None that reaches the 1983 Code or the CCEO. Two exist over the 1917 Code, and neither is needed."
examined = """
Five hosts were examined.

IntraText carries the 1917 Code in Latin and the CCEO in English, both under a
Creative Commons Attribution-NonCommercial-ShareAlike 3.0 licence stated on its
terms page: attribution to the IntraText Digital Library, no commercial use, and
share-alike on anything built from it. Two problems. NonCommercial and
ShareAlike are not compatible with this project's CC BY 4.0 outputs. And the
English CCEO is the Divinum Officium case again, exactly as the liturgical
rights record describes it: the host asserts a Creative Commons licence over a
translation whose source it records as "Printed version 1992" and whose owner it
does not name, with "Printed source: Not available". A licence on a host is not
evidence that the text inside it was the host's to license. It is not relied on.

Latin Wikisource carries the 1917 Code under Creative Commons
Attribution-ShareAlike. It is genuinely the 1917 Code -- its header gives the
year 1918 and it indexes Books I to V -- and a search of that site for the
Codex returns the 1917 Code and its books and a separate Eastern code, with the
1983 Code not among the results. The grant is real and adds nothing: the
underlying text is already public domain, so ShareAlike would impose an
obligation on this project in exchange for a permission it does not need.

canonlaw.info serves the complete Latin of both the 1917 and the 1983 Codes.
Its footer claims "Original Materials © Edward N. Peters" -- a claim over the
site's own material, expressly not over the Latin, and not a grant to anyone.
It is not a route to the 1983 text.

The Gregorian University's iuscangreg.it is a link directory that points back at
vatican.va and hosts nothing of its own to grant.

vatican.va grants nothing: see the Terms of Use above.

So for the 1917 Code the cleanest route is the one this repository already owns
-- the Internet Archive scan of the 1918 Vatican Polyglot printing, registered
as edition.catholic-church.codex-iuris-canonici-1917.vatican-polyglot-1918 --
and for the 1983 Code and the CCEO there is no route at all.
"""
unregistered_sources = [
  "intratext-copyright-terms-2026-08-01",
  "intratext-cic-1917-latin-2026-08-01",
  "latin-wikisource-codex-iuris-canonici-2026-08-01",
]

