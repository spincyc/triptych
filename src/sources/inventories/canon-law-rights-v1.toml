[what_is_published]
question = "What does this project actually publish, and what does it write instead where it may not?"
answer = "The 1917 Latin; for everything later, the canon's identity and a stated absence."
what_is_published = """
For the 1917 Code: the Latin text of the canons this lane has read, each
carrying whether it was read from a page image or only from the Internet Archive
optical-character-recognition text layer, and the date of any collation.

For the 1983 Code, the CCEO and the amending acts: the canon's number, the
paragraph where an act touched one, the division of the code it stands in, every
act that established or changed it with that act's date and citation, and the
authentic interpretations recorded against it. All of those are facts about the
law rather than the law's words.

Division titles are handled deliberately. For the 1917 Code, which is public
domain, a division carries the Latin rubric as the book prints it. For the 1983
Code and the CCEO, a division carries its bare designation -- Liber IV -- and a
description of its subject written by this project in English. The Code's own
rubrics are not reproduced. This is more conservative than it needs to be and
costs nothing.
"""
what_is_written_instead = """
Never a blank and never a quiet omission. A canon whose text is withheld renders
in the emitted repository as

    can. 1671
    [text withheld: <the reason, in one sentence, from this record>]
    text established by: <the act that established the text being withheld>

so that a reader sees three things at once: which canon it is, that the absence
is a rights position and not ignorance, and which act's words are the ones being
withheld. The third line is what makes an act that substituted twenty-one
canons show a twenty-one-line diff instead of an empty one, and it is derived
from the act that applied the departure rather than typed beside it.

A unit whose words were never read renders with an empty second line instead. A
renderer that showed those two alike would report a rights position as
ignorance, which guidance/the-shape.md section 4 forbids.
"""
seeking_a_licence = """
The route exists and only the project owner may take it. A request would go to
the Libreria Editrice Vaticana and to the Dicastery for Communication, whose
Terms of Use name written authorisation as the mechanism and give
spc@spc.va as the contact. It would have to state the extent sought, the medium,
whether anything is sold, and the notice carried. No agent may make such a
request: it is a representation about who is asking and what they will do.

And, as the liturgical record says of the same situation, a licence to reproduce
is not a licence to publish, and this lane's machinery is not ready for the
second. `withheld` is a first-class field and there is no state meaning
"tracked, licensed, and publishable". Build that before writing any licensed
canon into this record.
"""

