[liturgiam_authenticam_does_not_reach_it]
question = "Does Liturgiam authenticam n. 111, which settled the liturgical question, settle this one?"
answer = "No, and reaching for it would have been a reference that resolved successfully and wrongly."
reasoning = """
n. 111 reads, in the passage this repository has already verified: "As regards
the liturgical books of the Roman Rite promulgated in an editio typica either
before or after the Second Vatican Council by decree of the Congregations
competent at the time, the Apostolic See, through the Administratio Patrimonii
or, in its name and by its mandate, through the Libreria Editrice Vaticana,
possesses and reserves to itself the right of ownership commonly known as
'copyright'."

Three things in that sentence exclude a code of canon law.

Its subject is LITURGICAL BOOKS, and n. 110 lists the books in view and names
the Missale Romanum first. A code is not among them.

Its trigger is promulgation IN AN EDITIO TYPICA BY DECREE OF A CONGREGATION. The
1983 Code was promulgated by an apostolic constitution of the Roman Pontiff,
Sacrae disciplinae leges of 25 January 1983; the Eastern Code by Sacri canones
of 18 October 1990. Neither is a Congregation's decree and neither book is an
editio typica in that sense.

And its instrument type is an instruction of a Congregation, which states what
the Apostolic See claims and directs how its officers are to act. It is not an
adjudication, as the liturgical record already says of it.

Recorded at length because the argument from analogy is the obvious one, it
produces the right answer for the wrong reason, and a right answer resting on a
wrong instrument is the failure guidance/the-shape.md section 1 is about. The
correct instrument is below, and it is stronger.
"""
source_ids = [
  "passage.congregation-for-divine-worship-and-the-discipline-of-the-sacraments.liturgiam-authenticam-2001.english-vatican-web-2026-07-25.111",
]

