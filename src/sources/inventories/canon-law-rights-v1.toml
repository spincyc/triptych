[the_1917_code]
question = "May the Latin text of the 1917 Code be published here?"
answer = "Yes. It is in the public domain in the United States."
reasoning = """
The Code was promulgated by Benedict XV's apostolic constitution Providentissima
Mater Ecclesia, dated in the book itself Datum Romae apud S. Petrum die festo
Pentecostes anno millesimo nongentesimo decimo septimo, and printed at Rome by
the Vatican Polyglot Press. The copy this project reads is the 1918 printing
with Cardinal Gasparri's fontes, digitized from the University of Illinois
exemplar as Internet Archive item codexiuriscanoni00cath.

A work first published outside the United States before 1931 is in the United
States public domain, with no conditions attached. The Copyright Office states
the domestic form of the rule -- "all works published in the United States
before January 1, 1931, are in the public domain" (Circular 15a) -- and the
Cornell Copyright Information Center's chart, in its row for works first
published outside the United States by foreign nationals, gives Date of
Publication "Before 1931", Conditions "None", Term "In the public domain".

Restoration under 17 U.S.C. 104A cannot revive it. The section restores a work
only "for the remainder of the term of copyright that the work would have
otherwise been granted in the United States if the work never entered the public
domain", and for a 1918 publication that counterfactual term -- ninety-five
years from publication -- expired at the end of 2013.

Nothing later reaches back onto it. 17 U.S.C. 103(b) provides that copyright in
a derivative work "extends only to the material contributed by the author of
such work, as distinguished from the preexisting material employed in the work,
and does not imply any exclusive right in the preexisting material". So neither
a modern reprint, nor a modern translation, nor a website's transcription
acquires anything in the 1918 Latin.
"""
limits = """
One live question, and it is circuit-specific rather than academic. The Cornell
chart's first special case records that in the Ninth Circuit -- Alaska, Arizona,
California, Hawaii, Idaho, Montana, Nevada, Oregon and Washington, with Guam and
the Northern Mariana Islands -- a work published between 1 July 1909 and 1978 in
a language other than English, without subsequent republication with a copyright
notice, is treated as unpublished until a United States-compliant publication
occurred. The authority is Twin Books v. Walt Disney Co. (9th Cir. 1996), which
concluded that "publication without a copyright notice in a foreign country did
not put the work in the public domain in the United States".

The 1918 Vatican Polyglot printing is exactly a non-English foreign publication.
WHETHER IT BEARS A UNITED STATES-COMPLIANT NOTICE HAS NOT BEEN CHECKED. No
title-page or colophon leaf of the scan has been acquired and read for one. That
check is cheap and it has not been done; it is recorded here as an open item
rather than assumed either way.

A second, smaller thing. Five artifact manifests in this repository state the
threshold as "before 1930". That was right when written and is not wrong now --
1918 is before both -- but the threshold moves forward every first of January,
and the sources now read 1931. A record that hard-codes a moving threshold will
drift; the manifests should cite the rule rather than a year.
"""
source_ids = [
  "artifact.catholic-church.codex-iuris-canonici-1917.vatican-polyglot-1918.archive-ocr-text",
  "artifact.catholic-church.codex-iuris-canonici-1917.vatican-polyglot-1918.leaf-85-image",
  "artifact.catholic-church.codex-iuris-canonici-1917.vatican-polyglot-1918.leaf-693-image",
]
unregistered_sources = [
  "cornell-public-domain-chart-2026",
  "us-copyright-office-circular-15a",
  "us-code-title-17-chapter-1",
]

