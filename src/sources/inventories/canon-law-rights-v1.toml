# The rights position on the texts of canon law, settled once so that it is not
# settled again.
#
# This file is the canon-law counterpart of liturgical-english-rights-v1.toml
# and is written to the same pattern: the question, the answer, the reasoning,
# the limits, and the evidence each rests on. It exists because a lane building
# an act-keyed history of the Codex has to know, before it transcribes a single
# canon, which canons it may publish -- and because this project has already
# paid once for reaching that answer three times in three places without writing
# down the citations.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. Where it states a proposition of law it states the
# jurisdiction, and the jurisdiction throughout is the United States.
#
# THE SHORT FORM, for anyone who reads no further:
#
#   1917 Code, Latin        PUBLISHABLE. Published at Rome in 1918, and a
#                           foreign publication before 1931 is in the United
#                           States public domain unconditionally.
#   1983 Code, Latin        WITHHELD. A work of the Holy See, and the Holy See
#                           legislates copyright over the texts of its own laws
#                           and official acts by name.
#   CCEO 1990, Latin        WITHHELD, on the same ground, and its own delivery
#                           carries a Libreria Editrice Vaticana notice.
#   the amending acts       WITHHELD, on the same ground.
#   English translations    WITHHELD. No publisher's grant was located, and the
#                           two Creative Commons transcriptions that exist do
#                           not reach either current code.
#
# Withheld is not silent. Every canon whose text may not be printed here stands
# in the record with its number, its place, the acts that changed it, and a
# stated reason in place of its words. See canon-law-acts-v1.toml.

rights_schema = 1
record_type = "canon-law-rights"
recorded_on = "2026-08-01"
jurisdiction = "United States"

holding = """
The Latin of the 1917 Pio-Benedictine Code may be published here and is. The
Latin of the 1983 Code, of the 1990 Code of Canons of the Eastern Churches, and
of the acts amending them may not, and translating them afresh does not escape
that, because the underlying text is claimed. The standard English translations
are separately encumbered and no grant over any of them was located. So this
project publishes the 1917 text, carries the later codes' canons by identity --
number, place, the acts that touched them, the dates -- and writes an absence
with its reason where the words would stand.

The instrument that settles the second half is not the one this project reached
for first. Liturgiam authenticam n. 111, which settled the liturgical question,
is about liturgical books and does not reach a code of canon law. The right
instrument is Vatican City State Law N. CXCVII of 1 September 2017, whose
article 2 applies copyright to the texts of laws and official acts of the Holy
See in terms.
"""

