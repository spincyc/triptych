[the_english_translations]
question = "May the standard English translations be reproduced?"
answer = "No, and the reason is weaker than one would like: no publisher's notice could be read at all."
reasoning = """
Three translations are in view: the Canon Law Society of America's Latin-English
edition of the 1983 Code and its Latin-English edition of the CCEO; the Canon
Law Society of Great Britain and Ireland's; and Edward Peters's translation of
the 1917 Code, published by Ignatius Press in 2001.

Each rests on a text this project may not publish, except Peters's, which rests
on one it may. Peters's translation is nonetheless a derivative work of a
public-domain original, and 17 U.S.C. 103(b) protects what its author
contributed. A 2001 United States publication is protected for ninety-five years
from publication. Age is not a route here and will not be a route in any
reader's lifetime.

WHAT COULD NOT BE ESTABLISHED, and it is stated as a failure rather than dressed
as a finding. Not one of the three publishers' own copyright or permissions
statements could be read. The Canon Law Society of America's site returns HTTP
403 behind a Cloudflare interstitial on every attempt, and the Wayback Machine
holds no snapshot of a copyright or permissions page; its archived store and
product pages carry no notice. The British and Irish society's site is at
canonlawsociety.org -- canonlawsociety.org.uk does not resolve and clsgbi.org
times out -- and its publications page covers only Canon Law Abstracts and its
newsletter, saying nothing about rights in any translation. Ignatius Press's
product page for the Peters translation carries the ISBN and the author and no
copyright notice for the work.

So the refusal to publish rests on the ordinary operation of copyright over a
recent commercially published book, and NOT on any licence term this project has
read. If someone later reaches those notices, this section should be rewritten
with them.
"""
a_further_unknown = """
The English served from vatican.va at /archive/cod-iuris-canonici/eng/ names no
translator and carries no notice. Which translation it is cannot be established
from the delivery. The repository's family ledger already records it as an
unofficial aid whose translator the pages do not name, and that remains the
position.
"""
unregistered_sources = [
  "clsa-store-wayback-2025",
  "canon-law-society-gb-ireland-web-2026-08-01",
  "ignatius-press-pio-benedictine-product-2026-08-01",
]

