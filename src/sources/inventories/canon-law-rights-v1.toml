[the_1983_code_and_the_cceo]
question = "May the Latin of the 1983 Code, the CCEO, or the acts amending them be published here?"
answer = "No. The Holy See legislates copyright over the texts of its own laws by name."
reasoning = """
Vatican City State Law N. CXCVII, promulgated 1 September 2017 and in force from
1 October 2017, is the governing claim. Article 1 adopts the law in force in
Italy for copyright, so far as not contrary to divine law, to the general
principles of canon law or to the Lateran Pacts. Then, in terms:

  Art. 2 -- "Le norme relative alla protezione e alla gestione del diritto di
  autore si applicano anche ai testi delle leggi e degli atti ufficiali
  pubblicati, in qualunque forma, dalla Santa Sede e dallo Stato della Citta del
  Vaticano."

  Art. 5 §1 -- "Spetta alla Santa Sede ed allo Stato della Citta del Vaticano il
  diritto di autore sulle opere create o pubblicate sotto il loro nome o
  realizzate per loro conto."

  Art. 5 §2 -- for the purposes of the law the Holy See means, besides the Roman
  Pontiff, the Dicasteries and Organisms of the Roman Curia and the institutions
  connected with it.

  Art. 5 §4 -- the term of the exclusive rights of economic exploitation is
  seventy years from the year of first publication.

That is a copyright claim over the text of a law, made by the legislator, and it
names the very class this lane wants to publish. Many jurisdictions place their
own statutes outside copyright; article 2 exists precisely to say that this one
does not.

The claim is enforceable in the United States on ordinary principles. The Holy
See acceded to the Berne Convention on 19 July 1935, in force 12 September 1935
-- WIPO's contracting-party table and the Copyright Office's own Circular 38a
agree on both dates, and Circular 38a lists the party as "Holy See" with no
separate Vatican City State entry. A work first published under its authority is
therefore a work of a treaty party, and the 1983 and 1990 codes and every act
amending them are twentieth- and twenty-first-century works. A translation is a
derivative work, and the right to prepare one is among those reserved.

The web deliveries are separately restricted. The vatican.va Terms of Use, which
every modern document page links as Legal Notes, say the portal and its contents
are owned by the Dicastery for Communication; that access "is intended for
personal and non-profit use only"; that "the reproduction and collection of
Contents for reasons other than personal use is expressly prohibited in the
absence of prior authorization issued in writing"; and that the contents "are
protected by the copyright regulations in force in the State of Vatican City and
by international copyright regulations". This is the basis the repository's
existing artifact manifests for the 1983 Code already record, and it is
unchanged.
"""
what_the_pages_themselves_say = """
Checked page by page, because a notice is evidence and its absence is not.

  CCEO, Latin index -- carries "© Copyright 1990 - Libreria Editrice Vaticana".
  Sacrae disciplinae leges, Latin -- carries "© Copyright 1983 - Libreria
    Editrice Vaticana".
  Mitis Iudex Dominus Iesus, Latin -- carries only the site footer, "Copyright ©
    Dicasterium pro Communicatione".
  Pascite gregem Dei, Latin -- the same.
  The 1983 Code's own Latin and English delivery pages -- NO copyright line at
    all, in the index or in the text pages.

The absence of a line on the Code's own pages proves nothing in either
direction. A copyright notice has not been a condition of protection in the
United States for works published on or after 1 March 1989, and article 2 of
Law N. CXCVII does not condition its claim on a notice. The pages were read so
that this record rests on what they say rather than on what a reader expects
them to say.
"""
limits = """
What was quoted of Law N. CXCVII is WIPO Lex's HTML rendering of the law, not
the promulgated text in the Supplement to the Acta Apostolicae Sedis. The
Vatican State site's laws page returns 404 and WIPO's own PDF link is a signed
URL that redirected. The prior Law N. CXXXII of 19 March 2011 was not fetched,
and nothing here establishes whether article 2 operates on a text published in
1917 -- which does not matter, because the 1917 answer rests on United States
term, not on Vatican law, and a Vatican statute does not fix a United States
term in any event.

And the position stated here is the position this project acts on, not a
prediction of how a court would rule. This project has not tested the claim and
does not propose to.
"""
source_ids = [
  "artifact.world-intellectual-property-organization.wipo-lex-berne-contracting-parties.web-2026-08-01.contracting-parties-html",
  "artifact.catholic-church.codex-iuris-canonici-1983.latin-vatican-web-codex-2026-07-25.vatican-liber1-html",
  "artifact.catholic-church.codex-iuris-canonici-1983.english-vatican-web-codex-2026-07-25.vatican-cann1-6-html",
]
unregistered_sources = [
  "vatican-city-state-law-cxcvii-2017",
  "vatican-va-legal-notes-2026-08-01",
  "us-copyright-office-circular-38a",
  "cceo-latin-index-delivery-2026-08-01",
  "sacrae-disciplinae-leges-latin-delivery-2026-08-01",
]

