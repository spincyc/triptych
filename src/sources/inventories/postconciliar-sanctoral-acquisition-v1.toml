label = "catholic-daily-readings, West Wong"
url = "https://github.com/westhong/catholic-daily-readings"
what_it_carries = """
`data/lectionary/readings.json` (1,582,805 bytes): 1,799 records over 1,763
dates from 2023-01-01 to 2027-10-31, citation-only by design with no scripture
text, 1,798 of them carrying a Lectionary number. Its `wiki/` also holds the
USCCB correspondence quoted under `the_citation_question`.
"""
already_registered = false
surveyed = true
survey_method = "Surveyed by a delegated read-only lane using curl. The copyright-correspondence page was refetched and read first-hand by this lane on 2026-08-01."
rights = "unresolved"
redistributable = false
rights_basis = "No LICENSE file. MIT is claimed only in prose on a wiki page. A claim in prose is not a grant."
accuracy_verdict = "refused"
accuracy_basis = """
The shape is wrong and the provenance is worse. It is DATE-keyed, not
celebration-keyed, so it records only the Mass actually celebrated on a date in
a year: 1,737 of 1,763 dates hold exactly one record, which means an optional
memorial that was superseded has no entry at all. This calendar is keyed by
celebration and needs every formulary, superseded or not. It is also the United
States calendar. And the repository ships a 1.86 MB `hallucination-db.json` and
an 866 KB hallucination log, being a running record of an automated job
re-checking entries against the live source and finding stored citations
truncated or invented - the data passed through a generative phase before its
scrape-verification. Reviewed, not authoritative.
"""
landed = false

[[works]]
id = "graduale-romanum-digital-editions"
label = "Digital editions of the Graduale Romanum 1974 and the Graduale Simplex"
what_it_carries = "The sung Propers, including the sanctoral Introits and Communions that are the antiphons this lane could not reach."
already_registered = false
surveyed = true
survey_method = "Surveyed by a delegated read-only lane using curl over the Internet Archive metadata API, GregoBase, CMAA and four GitHub repositories."
rights = "third-party-copyright"
may_publish_text = "no"
redistributable = false
rights_basis = """
No lawfully redistributable digital edition was located, and the near misses
say why. The Church Music Association of America publishes a United States
Copyright Office letter of 4 October 2006 reporting no renewal for the 1953
Graduale and the 1952 Liber usualis, which is why it may host those; the letter
says nothing about the 1974 Graduale Romanum, a separate later work still in
term. The Internet Archive's 1974 Desclee copy is access-restricted with no
licence. GregoBase releases its own transcriptions under CC0 and its maintainer
states plainly that he has no permission from Solesmes for the scans he hosts
and relies on a forum "general consensus" that the melodies rather than the
books are free - which is a position, not a licence - and it attests only 43
Introits and 37 Communions as appearing in the 1974 Graduale in any case. One
GitHub repository mirrors full scans of the Graduale, the Gregorian Missal and
the Ordo cantus Missae with no licence file at all; it is an apparent
infringing mirror and this project must not touch it. A Portuguese adaptation
of the Graduale Simplex asserts CC BY-SA 4.0 over two encumbered upstreams.
"""
landed = false

