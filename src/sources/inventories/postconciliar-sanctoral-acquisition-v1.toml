[collation]
what = "Fifteen sanctoral formularies, read in the Ordo lectionum page images and compared with both compilations."
method = """
Artifact pages 328-329 and 346-348 of internet-archive-scan-pdf-ed4bc14e
(printed pages 274-275 and 292-294) were rendered at 200 dpi and read. They
carry nn. 514-521 and 583-592 without a break, so the sample is two contiguous
stretches of the book rather than a choice of convenient entries, and between
them they span every shape the Proprium de Sanctis has: a memorial taking a
Common with a sub-selection, a memorial with proper readings, a memorial whose
first reading alone is proper, a feast with a Vel alternative, a solemnity with
distinct Vigil and Day formularies, and celebrations this calendar joins under
one key or does not carry.
"""
sample = 15
litcal_divergences = 2
tamil_divergences = 0
tamil_note = """
The two compilations were measured against the same pages and did not perform
alike. LitCal diverges twice in eight, once wholly. The Tamil lectionary
diverges in no reading and no Common pointer over all fifteen, and is right in
both places LitCal is wrong. That is why one is refused and the other is
recorded as the next lane's candidate; see `[[works]]` for each.
"""
divergence_1 = """
DECISIVE. At the Nativity of Saint John the Baptist, the Ordo prints n. 586 Ad
Missam in Vigilia and n. 587 Ad Missam in die with entirely different readings.
LitCal's `NativityJohnBaptist` gives its `vigil` and its `day` objects
byte-identical values, and the values are the Vigil's. On the Solemnity itself
it therefore serves the Vigil Mass's four readings. A page that took it would
resolve cleanly, print four well-formed citations, and be wrong about the whole
Mass of a solemnity of the General Roman Calendar.
"""
divergence_2 = """
At Saints John Fisher and Thomas More the Ordo prints the Alleluia verse at
Mt 5, 10 (n. 717,1); LitCal gives Luke 9:24. This one is not necessarily an
error — a later national lectionary may appoint differently — but LitCal
declares no edition for its lectionary data at all, so the divergence cannot
even be attributed, which is itself the finding.
"""
numbering_finding = """
A third class, systematic rather than per-entry. The Ordo lectionum 1981 prints
its responsorial psalms in VULGATE numbering — Ps 70, Ps 138, Ps 88, Ps 36,
Ps 18, Ps 33, Ps 15, Ps 123 across this sample, verified in the page images.
LitCal silently converts some to Hebrew (Psalmo 16, 40, 71, 126) and renders
others in a dual form (Psalmo 88 (89), 36 (37), 18 (19)), with nothing saying
which convention an entry follows. That is exactly the disease this calendar
already records under `open_collation_items` and pays for with 28 declared
`psalm_numbering_exceptions`, and importing 210 more entries of it would have
multiplied it.

Worth recording against `guidance/versification.md`, which states that the Ordo
lectionum cites in Nova Vulgata numbering and that the Nova Vulgata numbers
psalms Hebrew-first. Whatever is true of the Nova Vulgata, the 1981 Ordo's own
printed pages do not follow it for the responsorial psalms, and this lane read
them.
"""
verdict = """
A compilation with a two-in-eight substantive divergence rate from the primary
witness on a contiguous sample, whose provenance its own maintainers do not
state, is a lead and not a witness. It is not landed. The lesson is the one the
repository already holds at guidance/the-shape.md section 5: a pointer that
resolves to the wrong formulary gives a saint a Mass that is not his, resolves
cleanly, and looks right.
"""

