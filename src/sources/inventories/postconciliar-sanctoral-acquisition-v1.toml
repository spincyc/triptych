# What may be acquired for the postconciliar sanctoral, and what it is worth.
#
# The postconciliar calendar index carries 268 Masses. Its whole sanctoral —
# every saint's day, every Marian and Christological feast — was a placeholder
# skeleton, because the Missal's Latin and the approved English are both
# encumbered and no witness to the antiphons and readings was on disk. An
# earlier lane wrote that acquiring one "is a lane of its own; I did not start
# it rather than guess at citations". This is that lane's record.
#
# It is an acquisition SURVEY with a bounded landing. It names the candidate
# witnesses, says what each actually contains, says what may lawfully be
# republished from it, and lands only what was collated against page images. It
# is not legal advice; where it states a proposition of law it states the
# jurisdiction, and the jurisdiction throughout is the United States.
#
# The rights position on the TEXT of the postconciliar orations is settled in
# src/sources/inventories/liturgical-english-rights-v1.toml and is not reopened
# here. What that record does not answer, and what blocks the sanctoral, is a
# different question: whether a CITATION may be published where the words may
# not. `the_citation_question` below answers it.

acquisition_schema = 1
record_type = "calendar-sanctoral-acquisition"
calendar = "postconciliar"
target = "src/sources/calendars/postconciliar/propers.yaml"
recorded_on = "2026-08-01"
jurisdiction = "United States"

the_gap = """
Measured against the index on 2026-08-01, before this lane: 205 of 268 Masses
held nothing but a placeholder proper, and 210 propers were named
`Placeholder`. All 181 sanctoral Masses, all 14 Marian and all 7 Christological
were placeholders; the 3 seasonal ones are the Chrism-adjacent gaps recorded in
rubrics.yaml. Sixty-three Masses, every one of them seasonal, carried real
text.

What is missing from a sanctoral Mass is four things, and they come from three
different books:

  the two antiphons        the Missal, Proprium de Sanctis or a Common
  the three orations       the Missal, Proprium de Sanctis or a Common
  the Lectionary readings  the Ordo lectionum Missae, Proprium de Sanctis
  which Common it takes    both books say it, and they need not agree

Only the third is reachable, and only as a citation. That is the finding this
record exists to state.
"""

# ---------------------------------------------------------------------------

[the_citation_question]
question = "The words of a Lectionary may not be republished here. May the citation?"
answer = "A citation, yes. A transcription of the book's whole table, not on this record's evidence."
reasoning = """
This matters because a scripture proper in this repository holds NO TEXT. It
holds a book, a range of verses and a printed reference, and the words are
resolved at render time from the repository's own public-domain bibles. The
`Entrance Antiphon` of the Eleventh Sunday in Ordinary Time is stored as
`Psalm 26:7, 9` and nothing else. So the question is not whether the Lectionary
may be reprinted — it plainly may not — but whether the pointer may be carried.

A citation identifies a passage. It is a fact about which verses these are, and
under United States law facts are not copyrightable however much labour found
them. A compilation of facts is protected, but only in the compiler's own
original selection, coordination and arrangement, and the protection does not
extend to the facts themselves. Which pericope is appointed on which day is
also a fact of a second kind: it is what a promulgated ecclesiastical norm
provides, and reporting the content of a norm is reporting a fact about it.

The limit is real and is stated rather than argued away. The choice of
pericopes across the whole Ordo lectionum IS a selection, and it is original;
it was made by the Consilium and promulgated by the Apostolic See. Transcribing
that table entire — 600 pages of it, in order, as a table — would take the
selection and not merely the facts, and this record does not claim a right to
do it. What this repository does instead is carry, for each celebration it
already holds by identity, the citation appointed for that celebration, beside
its own calendar's own arrangement, resolving the words from bibles nobody
holds a right in. That is a per-celebration fact in this project's own
structure, not a reproduction of the book's table.

It should be said plainly which parts of this are firm and which are judgement.
That facts are not copyrightable is firm. That a lectionary's selection is
original is firm and is conceded here rather than contested. Where the line
falls between the two — how many citations, in what arrangement, before a
per-celebration fact becomes the book's table — is judgement, and it is this
project's own, made conservatively.
"""
what_follows_operationally = """
1. A citation may be carried; the reading's TEXT may not be taken from the
   Lectionary, and is never stored here at all.
2. The Lectionary's own pericope TITLES — the italic Latin phrases the Ordo
   prints in guillemets after each citation — are the compilers' composition
   and are not carried. Neither is the psalm response.
3. The witness and the exact page a citation was read at travel with it, on the
   Mass, so that a later reader can go back to the bytes.
4. Nothing is carried that was not read. A citation recalled rather than read
   is the failure this repository is built to prevent, and the index's own
   header already confesses to 1,059 of them; see `the_seasonal_leads`.
"""
evidence = "recorded"
evidence_note = """
The propositions of law above are this project's reading and were not verified
against a witness in this repository. No case report or section of the United
States Code was read here. `liturgical-english-rights-v1.toml` was read in
full, and Liturgiam authenticam n. 111 is registered as a passage there. Anyone
relying on this should read the authorities rather than this paragraph.
"""
corroboration = """
One body that owns liturgical copyright has said the same thing in writing, and
it is worth recording because this project reached its position independently.
A page in the `westhong/catholic-daily-readings` repository records an exchange
dated 2026-04-20 with Mary Sperry, Associate Director for Copyright and
Permissions at the United States Conference of Catholic Bishops, and quotes her
reply: "No permission is needed for using the reading citations and the names of
the various feast days. However, the information posted on the USCCB website
presents the liturgical calendar for the United States. The calendars of other
countries can and do differ. Permission is not granted to serve the NABRE text.
That text is not approved for liturgical use... As you are based in Canada, you
should seek permission from your local episcopal conference."

The distinction is exactly this record's: the citations are free, the words are
not.

What this is NOT. It is a third party's transcript of an email, retrieved by
this lane on 2026-08-01 from
raw.githubusercontent.com/westhong/catholic-daily-readings/HEAD/wiki/Copyright-Correspondence.md
(4,241 bytes, sha256 2b6e8a954ba73cf5...), and read there. The original
correspondence has not been seen, the reply was given to somebody else about
their project, the USCCB speaks for neither the Holy See nor ICEL, and a
permissions office's view is not an adjudication. It corroborates; it does not
establish, and nothing here rests on it.
"""

[the_seasonal_leads]
what = "A prior defect this record did not create and does not cure."
finding = """
The index's own `verification` header says the seasonal section "carries
unverified model-generated leads whose every citation and text requires
collation against the controlling edition before any evidentiary reuse". That
is 533 scripture-sourced propers holding 1,059 book-references, none of them
read at a witness. `guidance/sources.md` forbids source text routing through a
model in terms, and a citation produced by recall is the same defect wearing
the costume of a number.

This lane did not touch them. It is recorded here because an acquisition record
that reports the sanctoral gap while passing over 1,059 unread seasonal
citations would be describing the smaller of the two problems. The route this
lane proved — read the Ordo's page images, encode with `tools/citations`,
convert psalms with `scripts/_psalms` — is the route that would clear them, at
roughly one artifact page per two celebrations.
"""
cleared = """
CLEARED, 1 August 2026, by exactly that route. 845 of the seasonal section's
1,058 references were read over 79 artifact pages of the Ordo lectionum, 731
confirming the lead and 114 correcting it; the 213 that remain are the antiphons
the Missal prints and the Ordo does not, plus two Vigils for which the Ordo prints
no distinct formulary and one verse it prints without a reference. The rate this
record estimated held: one artifact page per two celebrations for the sanctoral,
and about one per Sunday for the temporal, where three cycles share a page.

See src/sources/inventories/postconciliar-seasonal-collation-v1.toml, which also
records the finding that made the psalms convertible at all — the Ordo prints its
responsorial psalms in Vulgate numbering, which this record flagged under
`[collation].numbering_finding` and which is now settled in
guidance/versification.md with the pages it was read at.
"""

