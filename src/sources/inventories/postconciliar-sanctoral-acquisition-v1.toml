why_the_split_was_not_done = """
Measured on 2026-08-01 by the lane that landed the second wave, which was sent
to split `saint-fabian-pope-martyr` and `saint-paulinus-nola-bishop` and
declined after measuring the cost. Three findings, none of them an argument
against splitting and all of them about who must do it.

First, the registry scheme cannot hold two Masses on one date without a new
rule. `tools/calendar-spine` derives every postconciliar registry id as
`pc-<MM-DD>` straight from the civil date, one entry per row of the calendar
reference `50-general-calendar.tex`, and that reference prints both saints on
one row joined by a semicolon. So the second entry of a split pair has no id the
spine can produce. The 1962 index met the same wall and answered it with the
synthetic `1962-<date>-comm` form, declaring in its own header that the id is
synthetic and that a scheme must be settled at collation - but its discriminator
names a rank the book itself prints, `comm.`, and two co-equal optional
memorials give no such discriminator. That same 1962 header records the one
place it declined to split for exactly this reason: 25 April, `Litania maior;
S. Marci Evangelistae`, two co-equal celebrations in one entry, left joined
because the reference prints no `comm.` there. A postconciliar split therefore
needs a stated id rule, not an improvised suffix.

Second, the change is not four calendar entries. Adding a Mass key to this index
invalidates three generated layers: `src/web/data/structure/propers/`,
`src/web/data/structure/rubrics/postconciliar.json`, whose `keys` map carries
every mass key with its name and assignment, and the roughly 100 year files
under `src/web/data/structure/calendar/postconciliar/`, which list each date's
candidate keys. Commit 575fc4c7f, which added exactly one Mass, touched 108
files for this reason. `calendar-rubrics check` fails on the stale rubrics layer
even for a bare rename, which was verified against a scratch copy rather than
assumed.

Third, the rank must change with the name, and the rank is what rubrics.yaml
keys on. A split entry is rank `Optional memorial`, not `Optional memorials`,
and the plural rank exists in rubrics.yaml solely to describe the joined state -
its assignment rule carries a note saying the index does not separate them.
Splitting all eighteen joined keys would leave that rule matching nothing, and
`calendar-rubrics check` fails an assignment rule that matches nothing. So the
last split cannot land without editing rubrics.yaml in the same change.

The conclusion is that this is one coherent change owned by whoever owns
rubrics.yaml and the generated layers, not a four-line edit to the mass index:
settle the id rule, split all eighteen joined keys at once, retire the plural
rank and its assignment rule, and regenerate the three layers together. Doing
two of the eighteen in isolation would leave the file in two conventions at once
and break a gate.
"""

