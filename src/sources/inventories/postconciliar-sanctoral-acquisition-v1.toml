The sixth wave read a different part of the book: the Communia, artifact pages
375 to 398, printed pages 321 to 344, nn. 701 to 742, on 2026-08-02. It landed
no Mass and no citation, which is the whole of its finding and not a shortfall;
`the_communia_read` states why, and it is the first wave whose result is a
closure rather than an addition. With it the six runs cover artifact pages 328
to 398 continuously.

The artifact is `storage = restricted`, so its bytes are not retained here; on
each wave it was re-acquired over HTTPS from the recorded `source_url`, its
