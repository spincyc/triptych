waves = """
Three lanes, one method, one witness. The first landed twelve Masses and sixty
citations from artifact pages 328-329 and 346-348 on 2026-08-01. The second
continued the book from artifact page 330 - the page the first lane stopped
before - and read 330 to 335 without a break, printed pages 276 to 281, nn. 522
