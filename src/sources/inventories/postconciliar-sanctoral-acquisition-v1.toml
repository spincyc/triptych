the_communia_read = """
Read on 2026-08-02 at 200 dpi, artifact pages 375 to 398, printed pages 321 to
344, nn. 701 to 742; artifact page 375 is the COMMUNIA divider, 376 is blank,
and artifact page 399 begins the MISSAE RITUALES, so the section is bounded at
both ends by what was read and not by an estimate. Six loci were read again at
400 dpi, over five pages. NOTHING WAS LANDED. Three separate reasons say so, and each is worth
keeping apart, because only the first was foreseen.

FIRST, at the time of this 2026-08-02 reading the calendar carried no Common as
a Mass, so there was no entry to fill. The seven edition-identified Common
identities were modeled later with typed unavailable/rights dispositions; no
target-edition formulary text was supplied.

SECOND, and this is the finding that changes `the_commons`: the Ordo's Communia
are not formularies at all. They are LISTS OF OPTIONS. Each of the seven Commons
is six numbered entries - Lectiones I e Vetere Testamento, Lectiones I e Novo
Testamento tempore paschali, Psalmi responsorii, Lectiones II e Novo Testamento,
Alleluia et Versus ante Evangelium, Evangelia - and each entry is a numbered
list of interchangeable choices. The Commune sanctorum et sanctarum offers 18
first readings and 26 Gospels. Counted from the page images, the 42 entries hold
289 numbered options in all: 26 for the Dedication of a church, 41 for the
Blessed Virgin Mary, 37 for martyrs, 53 for pastors, 30 for Doctors of the
Church, 14 for virgins and 88 for saints and holy women.

That defeats the mechanism the earlier note assumed. `takes_from` resolves a
borrowed proper BY NAME, and a Mass's own propers replace the borrowed ones by
name; a Common holding eighteen propers all named `First Reading` gives a
pointer nothing to resolve to. So landing the Ordo's Communia as Masses would
not let the 139 Masses that record a `De Communi` heading resolve it. It would
give them somewhere to point and nothing to find. What a `takes_from` needs is a
Common that names ONE reading per slot, and that is a Missal's Common, not this
book's.

THIRD, and decisively, landing them would be the one thing `the_citation_question`
expressly declines to claim a right to do. That record concedes that the choice
of pericopes across the Ordo lectionum is an original selection and says the
project carries per-celebration facts beside its own arrangement rather than the
book's table. The Communia ARE the book's table, in the book's own order, with
no celebration to attach them to: 289 citations in seven lists is a transcription
of the compilers' selection and nothing else. The position taken in five waves
would not survive doing it, and it was not done.

What the reading did settle is the seven cross-references the five waves left
standing, and it settled all seven the same way. Six of the 289 options carry no
scriptural citation at all - they are chant texts - and all six sit in the
