# The rights position on English liturgical texts, settled once so that it is
# not settled again.
#
# This file exists because the same question kept being reopened: may this
# project publish an English translation of the orations of the postconciliar
# Roman Missal? The answer had been reached at least three times in three
# places, in three different wordings, and no record held the reasons or the
# citations. What follows is the position, the evidence it rests on, the routes
# that were examined and refused, and the one route that works.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. Where it states a proposition of law it states the
# jurisdiction, and the jurisdiction throughout is the United States.

rights_schema = 1
record_type = "liturgical-english-rights"
recorded_on = "2026-08-01"
jurisdiction = "United States"

holding = """
The approved English of the postconciliar Roman Missal may not be published
here, and translating the Latin afresh does not escape that, because the Latin
is claimed too. But most of the Missal's orations are not new compositions: they
were restored from sacramentaries a thousand years and more out of copyright,
and where the Missal prints such a prayer unchanged, the words on its page are
the ancient words, in which nobody holds a right. Those may be translated and
published. Where the reform composed or substantially rewrote a prayer, they may
not, and this repository says so and shows the gap.
"""

[the_latin]
question = "Does translating the Latin editio typica afresh avoid the encumbrance?"
answer = "No, not by itself."
reasoning = """
The Holy See claims copyright in the Latin books in terms. Liturgiam
authenticam n. 111 reads: "As regards the liturgical books of the Roman Rite
promulgated in an editio typica either before or after the Second Vatican
Council by decree of the Congregations competent at the time, the Apostolic See,
through the Administratio Patrimonii or, in its name and by its mandate, through
the Libreria Editrice Vaticana, possesses and reserves to itself the right of
ownership commonly known as 'copyright'." n. 110 lists the books in view and
names the Missale Romanum first.

That claim is enforceable in the United States on ordinary principles. The Holy
See is a party to the Berne Convention -- WIPO's contracting-party table gives
its accession as 19 July 1935, in force 12 September 1935 -- so a work first
published under its authority is a work of a treaty party. The 1970 editio typica
and the 2002 editio typica tertia are both twentieth- and twenty-first-century
works, and the 2002 book postdates the abolition of United States formalities
for works published on or after 1 March 1989 outright. A translation is a
derivative work, and the right to prepare one is among the rights reserved to
the owner of the underlying work.

So a fresh English of a prayer the reform composed is a derivative of a
protected Latin text, and doing the translating oneself changes nothing about
that. This is the point the project had not previously written down, and it is
the point that makes the ancient-source route necessary rather than merely
convenient.
"""
limits = """
An ecclesiastical instruction states what the Holy See claims and directs how
its officers are to act. It is not an adjudication. Whether copyright subsists
in any particular text, and in whom it vests, would be decided by a court under
the law of the forum, and this project has not tested the claim and does not
propose to.
"""
source_ids = [
  "passage.congregation-for-divine-worship-and-the-discipline-of-the-sacraments.liturgiam-authenticam-2001.english-vatican-web-2026-07-25.111",
  "artifact.world-intellectual-property-organization.wipo-lex-berne-contracting-parties.web-2026-08-01.contracting-parties-html",
]

[the_icel_translation]
question = "May the approved English be reproduced?"
answer = "Not without a licence, which this project does not have."
reasoning = """
The English of the Roman Missal, third edition, is the work of the International
Commission on English in the Liturgy, a mixed commission of eleven bishops'
conferences set up at Rome in 1963 and erected as a mixed commission under
Liturgiam authenticam on 15 September 2003. Liturgiam authenticam n. 117 directs
that "the rights of publication and the copyright for all translations of
liturgical books ... remain with the Conferences of Bishops or their national
liturgical Commissions", and n. 118 provides for a licensing agreement where the
copyright is common to several conferences, which is exactly the case of the
English.

ICEL's own published terms say the rest. The acknowledgement it requires is
"The English translation of The Roman Missal (c) 2010, International Commission
on English in the Liturgy Corporation. All rights reserved." Its texts are "made
available to publishers without distinction, on a non-exclusive basis", and "all
requests for permission should be directed to the ICEL Secretariat". Any
publication produced for sale is subject to a royalty or flat fee, and the
classes named include electronic media; material not used during a celebration --
textbooks, commentaries, religious education material, private prayerbooks --
"may be assessed a royalty or flat fee".

There is exactly one royalty-free class, and a corpus like this one is not in
it. It covers reprinting "in a publication for use at a specific Mass or
celebration of an individual congregation or institution", on four conditions:
not produced by a publishing firm, not sold, carrying the notice, and following
the official editions exactly. A permanently published website of the whole
temporale fails the first condition on its face and is not "for use at a
specific Mass" at all.
"""
imprimatur_does_not_supply_it = """
An imprimatur is an ordinary's judgement under canon law that a book is free of
doctrinal error. It conveys no proprietary interest in anyone's text and cannot
license the reproduction of a third party's copyrighted translation. The two
instruments answer different questions and neither substitutes for the other.
This has been the repository's position since before this record and nothing
found here disturbs it.
"""
source_ids = [
  "passage.international-commission-on-english-in-the-liturgy.publication-policies.web-2026-08-01.permissions-and-royalties",
  "artifact.international-commission-on-english-in-the-liturgy.publication-policies.web-2026-08-01.what-is-icel-html",
]

[public_celebration]
question = "Does a text said aloud in public, week after week, fall into the public domain?"
answer = "No. There is no such doctrine."
reasoning = """
The intuition behind the question is a real thing misremembered. Before 1989,
United States law did attach consequences to publication without the required
notice, and a work could be forfeited that way. The Berne Convention
Implementation Act of 1988 removed the notice requirement for works published on
or after 1 March 1989, and even before that the rule was about publication of
copies, not about performance.

Reciting or singing a text is a performance. Performance is one of the rights
the owner holds; exercising it, or licensing others to exercise it, is the
opposite of abandoning the work. Nor does the fact that a congregation is
expected to say the words along with the celebrant amount to a dedication: the
same is true of every hymn under copyright that a parish sings from a licensed
hymnal.

Recording this because the argument is intuitive, is made often, and is wrong,
and because an intuitive wrong argument left unanswered is one that gets made
again.
"""

[the_1973_translation]
question = "Is the first ICEL Sacramentary of 1973 available instead?"
answer = "No. It is in copyright, and it is not the approved text either."
reasoning = """
The 1973 English is ICEL's work under its own notice in the same form as the
2011 text -- ICEL's current acknowledgement table shows the same corporate claim
on its other translations by year, the Lectionary for Mass at 1969, 1981 and
1997 and Eucharistic Prayers for Masses with Children at 1975. A United States
work published in 1973 with notice is protected for 95 years from publication,
so the 1973 Sacramentary does not enter the public domain until the end of 2068.
The renewal question that hangs over a 1943 imprint does not arise: renewal
became automatic for works first published from 1964 onwards.

Age is therefore not a route, and it will not be a route in any reader's
lifetime. Two further things are worth saying so nobody reaches for it as a
lesser evil. The 1973 text is no longer the approved translation anywhere in the
English-speaking world; printing it beside the current Latin would misdescribe
the book. And it was a dynamic-equivalence rendering that in many orations does
not stand in a word-for-word relation to the Latin at all, which is the very
property that made it unusable as a study text and provoked its replacement.
"""

[the_ellc_grant]
question = "The project already publishes nine texts under a free grant. Does that grant reach the orations?"
answer = "No. It is not close, and its bound is explicit."
reasoning = """
The grant is the English Language Liturgical Consultation's, over Praying
Together (1998): "The texts in Praying Together may be used freely and without
the need for prior permission. The liturgical text(s) should be properly
acknowledged." This repository relies on it, correctly, and carries the
acknowledgement it requires wherever the texts are served.

Its scope is the ecumenical common texts and nothing else: the Lord's Prayer,
Kyrie eleison, Gloria in excelsis, the Nicene and Apostles' Creeds, the Sursum
corda, the Sanctus and Benedictus, the Agnus Dei, the Gloria Patri, the Te Deum
and the three gospel canticles. Nine of them are used here, in the Order of Mass
inventory. Every one is an invariable text of the Ordinary. Not one is a proper,
and no oration of any Sunday or feast is within a hundred miles of the grant.

The Consultation is also not a Catholic body and its texts are not the approved
English of the Roman Rite. Where the two can be compared the difference is
immediate: ELLC reads "And also with you" where the 2011 Missal reads "And with
your spirit", and "We believe in one God" where it reads "I believe in one God".
Treating an ELLC text as a Roman Missal text would be a rights error and an
accuracy error at once.
"""
source_ids = [
  "artifact.english-language-liturgical-consultation.praying-together.1998.permissions-page",
