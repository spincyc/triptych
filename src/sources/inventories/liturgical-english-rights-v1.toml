]

[other_freely_granted_corpora]
question = "Is there any other body of English liturgical text under a free grant that reaches these orations?"
answer = "None was found, and the near misses are instructive."
examined = """
Four were examined.

The ELLC texts, above: a real grant, bounded to the common Ordinary texts.

Divinum Officium, examined and rejected in an earlier review and rejected again
here. Its repository carries an MIT licence, but that licence covers the
software. Its own sources page says the English of the Mass came from the
Tridentine Latin Rite Missal Project "with the permission of the owner", from a
collection by Fr Brian T. Austin FSSP described only as "a free project", and
from The Catholic Missal (New York: P. J. Kenedy and Sons, 1943). A personal
permission granted to that project's author is not a licence to this one, an
informal declaration is not a rights record, and a 1943 American imprint raises
a renewal question nobody has answered. An MIT licence on a repository is not
evidence that the text inside it was the repository's to license. It is in any
case a witness to the 1962 books, not to the postconciliar Missal.

The pre-1930 English hand missals, of which this repository already carries one:
the 1861 Cummiskey. These are genuinely in the public domain and are already
used, for the roman-1962 calendar, where 153 orations carry their English. They
cannot serve the postconciliar calendar, because they translate the Tridentine
Latin. Where the reform kept a prayer unchanged the old English does render the
same words; but the reform edited a great many of the prayers it kept, and the
divergences are exactly the kind that read correctly and say something else.
This route was tested mechanically against the 1962 index in this repository on
2026-08-01: of 215 postconciliar orations, only four are word-for-word identical
to a 1962 formulary under a normalising comparison, and ten more reach 0.95
similarity. It is a small yield bought at a high risk, and it was not taken.

National conferences' own vernacular texts, for territories outside ICEL's
membership. Every one of them is a conference's property under Liturgiam
authenticam n. 117 in the same way ICEL's is, and none is published under a
free grant. Nothing here was found.
"""

[seeking_a_licence]
question = "What would it take to carry the approved English?"
answer = "A written grant from ICEL, and a second decision this repository cannot presently execute."
what_would_be_involved = """
The route is not secret and not hostile. ICEL states it: requests go to the ICEL
Secretariat, 1100 Connecticut Avenue NW, Suite 710, Washington DC 20036, and to
permission@eliturgy.org, and texts are made available to publishers "without
distinction, on a non-exclusive basis". A request would have to state the extent
sought (the orations of the temporale, or the whole Missal), the medium (a
freely readable website), whether anything is sold (nothing is), and the
acknowledgement carried. A royalty or flat fee may be assessed even for material
not used during celebration. The position of a member conference would have to
be settled beside it, since ICEL provides content to the conferences and the
conferences authorise publishers.

Only the project owner can ask, and only the project owner should: a licence
request is a representation about who is asking and what they will do, and no
agent may make one.
"""
the_machinery_is_not_ready = """
This has to be said plainly, because a licence obtained tomorrow could not
safely be used. A licence to reproduce is not a licence to publish, and the two
are separate decisions. The translations contract already anticipates the first:
an entry with rights = "licensed" carries the notice its licensor requires. The
second is handled nowhere.

`mass-propers structure` filters translations by their rights basis and
publishes only "public-domain" and "project-created", so a licensed text would
in fact be withheld from the site today -- which is the safe failure, but by
accident of a filter and not by anyone's decision, and there is no way to say
"tracked, licensed, and publishable" or "tracked, licensed, and not". The Knox
bible is the precedent for the second state and has its own machinery
(`publishable = false` on the edition, and `public-alpha` omitting it); no
equivalent exists for a calendar translation. Build that before writing any
licensed text into a propers file.
"""

[the_route_that_works]
question = "What may be published?"
answer = "A translation of the ancient prayer, wherever the Missal prints the ancient prayer."
reasoning = """
Most of the postconciliar orations are not compositions of the reform. They were
restored from the Veronense, the Old Gelasian and the Hadrianum -- books of the
sixth, seventh and eighth centuries, in critical editions of 1896, 1894 and 1915.
Nothing in any of them is in copyright anywhere.

Where the Missal prints such a prayer word for word, the words on the Missal's
page are the ancient words. Copyright protects original expression; a verbatim
reproduction of a public-domain text is not original, and copyright in a
derivative work extends only to the material contributed by its author, not to
the pre-existing material it uses. A compilation copyright in the Missal as a
book -- in its selection and arrangement -- would not reach the text of a single
prayer that its editors did not write. So an English of that prayer is an
English of a public-domain text, however the reader happens to have met it.

Where the reform altered the ancient prayer, the alteration is the reform's, and
the question becomes how much of it there is. This project's rule is stated in
the postconciliar translations inventory and applied there prayer by prayer: an
English is published only where the Missal's Latin adds nothing to its ancient
witness beyond orthography, punctuation, word order, an omission, or a
substitution too small to be anyone's authorship, and every such difference is
recorded in the entry, word for word, so that a reader can see the whole of what
was judged. Where the reform composed, recentonised, or rewrote, nothing is
published and the absence is recorded with its reason.

The line between a de minimis edit and an authored one is a judgement, and it is
the project's judgement, made conservatively and shown in full rather than
asserted. It is the only part of this record that a reasonable person could
disagree with, which is why the evidence for every entry travels with it.
"""
what_is_published = """
Project-created English, rights = "project-created", carrying no source_id
because the project is its own witness, offered under CC BY 4.0 with the
project's authorship identified at the point of use. It is never presented as
approved, as liturgical, or as ICEL's; the Latin stands beside it; and it must
not be used for recitation. See
src/sources/inventories/postconciliar-proper-translations-v1.toml for the
entries, the witnesses, the divergences and the count.
"""
