[what_is_retained]
question = "What actually enters the repository, and under what disposition?"
answer = "The article text, as a tracked derivative; never the exact page."
reasoning = """
For every New Advent Catholic Encyclopedia ARTICLE delivery whose exact
acquired bytes this project still holds and can authenticate against the hash
its record already carried, two artifacts now exist. The qualifier is load-
bearing: the four letter-index pages of `the_index_pages` are deliveries under
the same work but are not articles, and they have no second artifact.

The exact HTML response keeps its identity and stays `remote`: hash, byte size,
retrieval date, source URL, and an access limitation saying in plain words that
the site's own apparatus is what is withheld and naming the retained derivative
a reader should open instead. Its `rights_status` is corrected from
`restricted` to `public-domain`, because that field states the standing of the
work the artifact carries, and the encyclopedia is public domain; the reason the
bytes are not republished is a fact about New Advent's apparatus and belongs in
`rights_basis`, where it now is. The four index deliveries are the one place
where that correction was made and then withdrawn: their `rights_status` is
`restricted`, because the work THEY carry is New Advent's own compilation.

The article text is a second artifact, `artifact_type = "normalized-text"`,
`storage = "tracked"`, `rights_status = "public-domain"`, jurisdiction United
States, `derived_from` the exact HTML artifact and pinned to its hash, with the
extraction rule recorded in `transformation`. It is `indexable`, so the source
library's own search reaches it, and it is the artifact a cold reviewer with no
network opens.

The extraction is mechanical and was performed by a script over the exact bytes.
No source text passed through a language model, as guidance/sources.md requires.
The rule: take the region of the delivery beginning at the article's own H1
heading and ending at New Advent's "About this page" block, or at the site
footer where no such block is present; drop script and style elements and the
support-solicitation paragraph; convert block-level element boundaries to line
breaks; discard all remaining markup; decode HTML entities; collapse runs of
horizontal whitespace and blank lines; and emit LF-terminated UTF-8.

Two consequences are stated because they bound what the derivative can prove.
It is a normalization, not a facsimile: hyphenation, line breaks and typography
of the printed page are not recoverable from it, and any claim about the printed
setting must go to the Internet Archive facsimile instead. And it is a
derivative of a web transcription, so it inherits whatever that transcription
got wrong; it witnesses what New Advent published, which is the same thing every
consuming claim in this repository was already resting on.
"""

[what_was_not_retained]
question = "After the retention pass of 2026-09-02, what is still not held here, and why?"
answer = "Eight deliveries: four for a reason of evidence, four because they are not articles."
reasoning = """
The 122 New Advent deliveries registered in this library divide as follows.
114 are Catholic Encyclopedia articles whose exact bytes were held and
authenticated: 110 of them now carry their own tracked text derivative, and the
other 4 carry none because their extracted text proved byte-identical to a
sibling delivery of the same article, so it is held once rather than twice and
each record names the sibling to open. Every one of the 111 article deliveries
the Scripture chronology corpus cites is among the 114, where before this pass
none was reopenable offline.

Four more are the letter-index pages of `the_index_pages`. They are not
encyclopedia articles, they carry no article text to extract, and the
derivatives briefly registered against them on 2026-09-02 were de-registered the
same day. That is a question of what the pages are, not of evidence, and it is
settled in its own section.

The remaining four are not retained for a reason of evidence:

  artifact.catholic-encyclopedia.volume-4.new-york-1908.newadvent-credence-html
  artifact.catholic-encyclopedia.volume-9.new-york-1910.newadvent-manuterge-html
  artifact.catholic-encyclopedia.volume-13.new-york-1912.newadvent-sacristy-html
  artifact.catholic-encyclopedia.volume-13.new-york-1912.newadvent-sedilia-html

Nothing about their rights is different; the encyclopedia articles they carry
are public domain on exactly the basis stated above. The obstacle is that their
exact acquired bytes are no longer held anywhere this lane could reach, and a
fresh retrieval on 2026-09-02 did not reproduce them: each fetched page differed
from its recorded artifact by three bytes and by hash. A fresh fetch that does
not authenticate is a different artifact, and registering its text as an
extraction of the recorded one would be a false provenance, so it was not done.
The six chronology-cited articles that were in the same state were re-fetched
first and DID authenticate, hash and byte size, against the values their records
already carried; those six are retained.

These four records were also left otherwise untouched, including their
now-superseded `rights_status = "restricted"`, because three of them are pinned
by reviewed source bindings in
src/gpt/liturgy/roman-rite/1962/reference/roman-sanctuary-dictionary/altar-server/research/source-bindings.toml
whose recorded fingerprints would go stale on any edit. Re-pinning a reviewed
binding without re-reviewing it defeats what the pin is for. Correcting these
four is a small, bounded follow-up for whoever re-reviews those bindings: refetch
until a delivery authenticates or register the fresh delivery as its own
artifact, extract its text, and bring the record into line with this file.
"""

[routes_examined]
question = "What else was considered for getting these bytes into the repository?"
answer = "Five routes. One works, one is held in reserve, three were refused."
examined = """
RETAIN THE EXACT HTML AS TRACKED. Refused. It would redistribute New Advent's
navigation, styling, advertising markup, solicitation and "About this page"
apparatus, which are theirs and for which no permission exists. It would also
put the whole of 4,599,797 bytes of delivery into the repository to carry the
2,522,626 bytes of article text that were actually wanted, both measured by the
command in `how_to_check_this_record`. The project's rule is that `tracked`
needs an affirmative distribution basis, and there is none for the apparatus.

EXTRACT THE ARTICLE AND TRACK THAT. Adopted. It is the route
`guidance/sources.md` already prescribes in terms — "Distinguish the underlying
public-domain text from a host's markup, annotations, typography, database, or
newly created transcription" and "Put normalization, corrected OCR, extracted
text ... in separate artifacts linked to their inputs" — and it had a working
precedent in this library before this record was written, at
artifact.jerome.de-viris-illustribus.english-richardson-npnf2-3.ch-2-gospel-of-the-hebrews-checked-text-f0f92de5,
where a New Advent page's public-domain text is tracked and the delivery is not.

TRACK THE INTERNET ARCHIVE FACSIMILES INSTEAD. Held in reserve, not adopted
now, on measured size. The two volumes already registered are 112,731,583 and
135,877,116 bytes; sixteen volumes at that scale is roughly 2 GB, against a
repository that holds 885 tracked artifacts in total after this pass, counted by
the command in `how_to_check_this_record`. This is the one
place in this record where a genuine size argument exists, and it is recorded
with the measurement rather than asserted. Extracting per-article text from the
facsimiles' OCR layer would be a way to keep the evidence without the bulk; it
was not attempted here because the New Advent extraction already answers the
question, and OCR text would need its own accuracy record.

WIKISOURCE AND OTHER MIRRORS. Examined and not pursued. Other hosts carry the
1913 encyclopedia, and their text would raise exactly the same two-component
question this record answers, with the added defect that the corpus's 463 dated
chronology claims — 281 of which cite a Catholic Encyclopedia article, both
figures measured by the command in `how_to_check_this_record` — were read
against New Advent's pages and not against a mirror's. Substituting a different host's transcription would change what the
claims are evidence of. If the New Advent extraction ever has to be abandoned,
the replacement should be the printed volumes, not another website.

ASK NEW ADVENT FOR PERMISSION. Not done, and not for an agent to do. The site
publishes no terms-of-use or permissions page; its footer notice and a contact
address are the whole of its stated position, and its contact page says the
editor cannot answer most mail. A permission request is a representation about
who is asking and what they will do, so only the project owner may make one. It
is in any case unnecessary for the article text, which needs no permission, and
would only be needed to republish the apparatus, which the project does not
want.
"""

[what_would_change_this]
question = "What would move the position, and in which direction?"
answer = "Four things, and the record should be edited rather than argued around."
reasoning = """
A STATED TERM FROM NEW ADVENT. If the site publishes terms of use, or writes to
the project, saying something specific about reuse of the article text, that
statement goes here in its own words and the position is re-read against it. A
grant would widen what may be retained; a refusal would not narrow it, because
the article text is not New Advent's to withhold, but it would be recorded and
the extraction would be re-derived from the facsimiles rather than from the
site, to keep the project's dealings straight.

AN AUTHORITY HOLDING THAT A FAITHFUL TRANSCRIPTION IS ORIGINAL. The
transcription judgement in `the_host_delivery` is the load-bearing one and the
one a reasonable person could dispute. A controlling decision the other way
would mean replacing the 110 extracted files with extractions from the Internet
Archive facsimiles of the printed volumes, which no transcription question
touches. That is work, not a crisis, and it is why the facsimiles stay
registered.

AN ARTICLE THAT IS NOT FROM THE 1907-1912 IMPRINT. New Advent's cathen tree is
the original encyclopedia, but if any page ever proves to carry a later
revision, a supplement, or an editorial addition rather than the printed
article, that page falls outside this record entirely and needs its own basis.
The check that can be run here is the one `the_underlying_text` describes: the
volume and year of the page's own citation line, quoted in the delivery's
tracked record, against the volume and year of the edition it is filed under.
That catches a page filed to the wrong volume. It cannot catch a later revision
that New Advent left the citation line untouched for; nothing retained here can,
because the article files are a transcription of the site and not of the print,
and a reader who needs that answer must compare against a facsimile of the
printed volume. `the_index_pages` records the one case where a page under this
work proved not to be an article at all, and it was caught by reading the page,
not by any check stated here.

A JURISDICTION OTHER THAN THE UNITED STATES. Stated in `limits` above and
repeated because it is the likeliest way for this record to be misused: it
settles nothing for a life-plus-70 country, and a reader who needs that answer
must trace the individual contributors.
"""

[how_to_check_this_record]
question = "Which of this record's assertions can a reader with no network reopen, and how?"
answer = "Every count and the imprint. Seven commands, run from the repository root."
limits = '''
These commands check what this repository holds. They do not check the printed
volumes, and nothing offline here can: the two facsimiles are remote and the
article text is a transcription of a website. What they establish is that the
imprint this record reasons from is recorded in tracked bytes, is internally
consistent, and is not something a reader has to take on trust from this file.
'''
checks = '''
Each command was run against this checkout on 2026-09-02, and the output quoted
under it is what it printed. If a figure in this record and a figure here
disagree, this section is the one that was measured.

1. THE IMPRINT, read off tracked bytes. Every New Advent article delivery
   quotes its page own citation line in its record notes, and each retained
   derivative inherits its parent notes:

     grep -ho "New York: Robert Appleton Company, [0-9]*\." \
