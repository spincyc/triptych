# The rights position on the Catholic Encyclopedia (New York, 1907-1912) and on
# the New Advent web delivery through which this project reads most of it.
#
# This file exists because the repository had been holding two answers to one
# question at the same time. The Internet Archive facsimiles of volumes 4 and 8
# were recorded as `rights_status = "public-domain"`, jurisdiction United
# States. All 122 New Advent deliveries registered under the same work — 118 of
# them of the very same articles, and four of New Advent's own letter indexes —
# were recorded as `rights_status = "restricted"`, with the reason given only in
# prose, and with the note "Remote bytes are not retained." on them. The
# encyclopedia cannot be both. Calling a public-domain text restricted because
# the page it was read on carries somebody's footer is the error this record
# exists to stop, and it had already cost the project the ability to reopen
# offline the 281 of the Scripture chronology corpus's 463 dated claims that
# cite a Catholic Encyclopedia article. Both figures are measured, by the
# command in `how_to_check_this_record`, not estimated.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. Where it states a proposition of law it states the
# jurisdiction, and the jurisdiction throughout is the United States.

rights_schema = 1
record_type = "catholic-encyclopedia-rights"
recorded_on = "2026-09-02"
revised_on = "2026-09-02"
revision_note = """
Revised the same day it was written, on a cold reader's finding. The first
draft said the imprint years could be read off "the citation block this project
retains" and that "the check is the page's own printed volume and year, which
the retained bytes carry". That was false of the files it pointed at: the
extraction stops AT New Advent's "About this page" block, so no *-article-text
file contains "Robert Appleton" or "The Catholic Encyclopedia. Vol". The
conclusion did not move; the stated method did, to the place the evidence
actually is, and `how_to_check_this_record` now gives the commands. The same
pass found four New Advent letter-index pages registered as public-domain
encyclopedia articles and de-registered their derivatives; see
`the_index_pages`.
"""
jurisdiction = "United States"

holding = """
The text of The Catholic Encyclopedia (New York: Robert Appleton Company,
volumes 1-15, 1907-1912) is in the public domain in the United States. Nothing
about the website a reader happens to meet it on changes that. The project may
therefore retain, republish, quote and index the encyclopedia's own words, and
must do so rather than leaving a reader dependent on a third party's uptime.

What the project does not redistribute is the exact newadvent.org response: that
file is mostly not the encyclopedia. It carries the site's navigation, styling,
advertising slots, a solicitation, and an "About this page" apparatus that New
Advent wrote — its APA and MLA citation forms, its transcriber credit and
dedication, and its editor's contact details — under a footer reading
"Copyright (c) 2026 by New Advent LLC." Those are New Advent's, no permission to
republish them was sought or granted, and they are not needed for anything.

So the two components part company, and the record says so per artifact. The
exact HTML delivery stays `remote`, hashed, with its access limitation written
out. The encyclopedia article inside it is extracted mechanically, retained as a
tracked derivative under `rights_status = "public-domain"`, and is what every
consuming claim can be reopened against offline.

All of that is about the encyclopedia's articles. It does not reach New Advent's
own per-letter index pages, which are its compilation and not the encyclopedia's
text at all; `the_index_pages` says why they fall outside this record and what
was done about the four of them registered here.
"""

[the_underlying_text]
question = "Is the encyclopedia's own text in copyright in the United States?"
answer = "No. Its longest possible term expired at the end of 2007."
reasoning = """
The Catholic Encyclopedia was published in New York by the Robert Appleton
Company in sixteen volumes. The fifteen volumes of articles carry imprint years
from 1907 to 1912, and the index volume 1914.

Those years are not assumed here, and it matters exactly where they can be read,
because the first draft of this record named the wrong place. They are NOT in
the retained article text. The extraction described in `what_is_retained` stops
at New Advent's "About this page" block, which is precisely where the page
prints its citation, so not one of the 110 retained *-article-text files
contains the string "Robert Appleton" or the string "The Catholic Encyclopedia.
Vol". A reader told to look there would find nothing.

They are in the tracked artifact records. The `notes` field of each New Advent
article delivery quotes that page's own citation line, in the form

  <author>. "<title>." The Catholic Encyclopedia. Vol. <n>. New York: Robert
  Appleton Company, <year>.

and each retained derivative's record inherits its parent's notes, so the line
stands in 224 tracked `artifact.toml` files: the 114 article deliveries and the
110 derivatives extracted from them. In all 224 the volume and the year that
line states agree with the volume and the year in the record's own `edition_id`.
Reading the imprint back is therefore a grep and a comparison over tracked
bytes, and `how_to_check_this_record` gives both commands and their output. The
years so read are: volumes 1-2, 1907; 3-4, 1908; 5-6, 1909; 7-9, 1910; 10-12,
1911; 13-15, 1912. The latest year on any of them is 1912. The same mapping is
carried independently by the fifteen tracked `edition.toml` records, whose
`publication` lines read "New York: Robert Appleton Company, <year>".

Eight registered New Advent deliveries carry no such line, and neither is an
exception to any of this. Four are the letter-index pages of `the_index_pages`,
which are not encyclopedia articles. Four are the deliveries of
`what_was_not_retained`, registered before this convention, each naming its
article and its printed year in prose instead.

One line of New Advent's citation apparatus is thus retained, deliberately, in
the artifact records — and only there, never in the article files. It is kept
because it is the imprint evidence and nothing else held here carries it. It is
a single bibliographic sentence naming author, title, volume, publisher and
year, quoted to identify a source, and what this record rests on is the facts it
states rather than its wording.

The two Internet Archive facsimiles registered in this library are of the
printed volumes themselves, and their records report that the page images were
rendered and inspected — volume 4 dated 1908, volume 8 dated 1910. That is
recorded provenance and not an offline check, and it is named as such: both are
`storage = "remote"`, at 112,731,583 and 135,877,116 bytes, so a reader who
wants to see a title page must refetch the file and verify it against the
sha256 its record carries.

A work published in the United States in 1912 secured its copyright on
publication with notice under the Copyright Act of 1909, for a first term of 28
years renewable once. 17 U.S.C. Sec. 304, as amended by the Sonny Bono Copyright
Term Extension Act of 1998, gives a copyright subsisting in its renewal term a
total of 95 years from the date copyright was originally secured, and 17 U.S.C.
Sec. 305 runs every term to the end of its calendar year. 1912 plus 95 is 2007.
So even on the most generous assumption available to a claimant — that every
volume carried notice, that every one was renewed, and that the renewal
subsisted into 1998 — protection in the last of these volumes ended on 31
December 2007, and in the earliest on 31 December 2002.

The general rule reaches the same place with nothing to compute: as of 1 January
2026, everything published in the United States before 1 January 1931 is in the
public domain. 1912 is nineteen years the safe side of that line, and no
plausible correction to the imprint dates would move it across.
"""
limits = """
This is a statement about United States law only. Terms elsewhere run from an
author's death rather than from publication, so a contributor who died after
1955 could still be in copyright in a life-plus-70 jurisdiction. The
encyclopedia's contributors are numerous, signed by surname, and mostly
undated here, and the project has not traced them. Anyone republishing outside
the United States must do that work themselves; this record does not do it for
them.
"""
source_ids = [
  "artifact.catholic-encyclopedia.volume-4.new-york-1908.ia-facsimile-pdf-d1b059b1",
  "artifact.catholic-encyclopedia.volume-8.new-york-1910.ia-facsimile-pdf-ac62a7ca",
]

[the_host_delivery]
question = "Does New Advent hold anything in the pages this project reads?"
answer = "Yes, and it is worth separating carefully, because it is not the article."
reasoning = """
A newadvent.org cathen page is an HTML document of which the encyclopedia
article is one part. Around it the site supplies a navigation bar and a search
box; a stylesheet and scripts; several advertising containers; a paragraph
soliciting support with a link to a paid download; and, after the article, a
block New Advent titles "About this page", holding an APA citation form, an MLA
citation form, a transcription credit naming the volunteer who typed the
article and often a dedication, the printed volume's Nihil Obstat and
Imprimatur, and the editor's own contact paragraph. The page closes with
"Copyright (c) 2026 by New Advent LLC."

The selection, arrangement, wording and design of that apparatus are New
Advent's own work and this project treats them as protected. Nothing in this
record disputes the footer's application to them, and nothing here redistributes
them: the extraction described in `what_is_retained` cuts the page at the
article's own heading and stops at the "About this page" block. That was
checked, over the retained bytes, and it holds: none of the 110 retained
*-article-text files contains any of "Robert Appleton", "The Catholic
Encyclopedia. Vol", "About this page", "New Advent", "Nihil Obstat",
"Imprimatur", "Transcribed" or "Copyright". `how_to_check_this_record` gives
the one command that shows it.

Two qualifications, because the sentence above is easy to over-read. It is a
statement about the retained article files only. The artifact RECORDS do quote
one line of the apparatus — the page's own bibliographic citation — and
`the_underlying_text` says why and treats it as retained. And the description
of the rest of the page in this section is of bytes that are remote: nobody can
open them from this checkout, and a reader who wants to confirm the navigation,
the advertising containers, the solicitation or the footer must refetch a
delivery and authenticate it against the sha256 and byte_size its record
carries.

What the footer does not do is make the article copyrighted. A notice on a page
is a claim about the page, and a claim is not a determination; the encyclopedia
text under it entered the public domain decades before New Advent existed, and
17 U.S.C. Sec. 103(b) is explicit that copyright in a compilation or derivative
work "extends only to the material contributed by the author of such work" and
"does not imply any exclusive right in the preexisting material". Reading a
blanket site notice as reaching the pre-existing text is the error this record
was written to stop.
"""
the_transcription = """
The remaining question is New Advent's transcription itself: someone typed the
1907-1912 pages into HTML, and this project's earlier records treated that act
as possibly originating a right, in the words "New Advent's exact transcription,
revisions, markup, and presentation ... are not assumed redistributable".

Markup and presentation, yes, and they are excluded. The transcription, no. In
the United States copyright requires originality, and originality means
independent creation plus "at least some minimal degree of creativity" (Feist
Publications, Inc. v. Rural Telephone Service Co., 499 U.S. 340, 345 (1991)).
A faithful retyping of an existing text is the paradigm of the labour that Feist
held insufficient: the effort is real and the result is not original, because
its whole aim is to reproduce someone else's expression exactly. A district
court applied the same reasoning to exact photographic reproductions of
public-domain paintings in Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d
191 (S.D.N.Y. 1999), which is persuasive rather than binding and is cited here
as reasoning, not as authority.

Where a transcriber does add something of their own — a new introduction,
editorial notes, a fresh translation, corrections and conjectures that are the
transcriber's judgement rather than the printed page's words — that addition is
theirs, and this record does not reach it. New Advent's cathen ARTICLE pages
carry no such additions inside the article body: they carry the article,
hyperlinked. The project's position is that the article text on a New Advent
cathen article page is the public-domain article and nothing more.

New Advent's per-letter index pages are the counterexample and are the reason
that sentence names article pages rather than pages. Those are New Advent's own
writing throughout, and `the_index_pages` treats them separately.

Recorded as a judgement, because it is one. If it is wrong, it is wrong in one
direction only: the extracted files would contain a transcription New Advent
could claim, and the remedy would be to replace them with extractions from the
Internet Archive facsimiles, which are of the printed volumes and raise no such
question. `what_would_change_this` says what that would take.
"""
source_ids = [
  "artifact.catholic-encyclopedia.volume-3.new-york-1908.newadvent-03731a-f5f96f04",
]

[the_index_pages]
question = "Do New Advent's per-letter index pages fall under this record?"
answer = "No. They are New Advent's own compilations, not encyclopedia articles."
reasoning = """
Four artifacts registered under work.catholic-encyclopedia.alphabetical-index
are not Catholic Encyclopedia articles at all, and for part of 2026-09-02 this
project registered extractions of them as though they were, under the
public-domain basis stated above. They are New Advent's per-letter indexes:

  artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-g-064c6c3b
  artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-g-ce-5c91a95b
  artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-n-ce-5fd9c5e7
  artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-n-ef3ba0eb

Each is a list of links to encyclopedia articles, every link followed by a
one-line description. The article titles are the encyclopedia's. The selection,
the arrangement and the descriptions are New Advent's, and the descriptions are
frequently not the article's own words. Two comparisons, both openable in this
repository. The encyclopedia's "Nahum" article opens, under its title, "One of
the Prophets of the Old Testament, the seventh in the traditional list of the
twelve Minor Prophets."; the index entry for it read "Essay on the Old Testament
prophet and the book which bears his name". The encyclopedia's "Genesius"
article opens, under its title, "Genesius (of Rome)"; the index entry for it
read "Five people with this name including: Genesius of Rome; Genesius of Arles;
Genesius, Bishop of Clermont; Genesius Count of Clermont; and Genesius of
Lyons". The two encyclopedia openings are in
the retained text of newadvent-10670a-2f9e032c and newadvent-06413c-a10d26f7,
named in full in `source_ids` below. The two abridged pages also carried, above
their first entry, a paragraph that is New Advent's site prose and nobody
else's: "This list represents only a tiny fraction of articles available on the
New Advent website. For a more complete list, please see the full index for G or
use the search box at the top of this page."

So the two-component analysis of `the_host_delivery` does not reach these pages.
There is no pre-existing public-domain article sitting inside a host's
presentation here. There is a host's compilation, and it is the whole page. A
derivative of it cannot be retained under the encyclopedia's basis, because the
encyclopedia's basis is about the encyclopedia's words and these are not they.

What was done, on 2026-09-02: the four `*-article-text` derivatives were
de-registered and their bytes removed; the four delivery records had
`rights_status` corrected from `public-domain` to `restricted` and their
`rights_basis` rewritten to say what the page actually is; and the sentence
"The exact page is not retained here", which had been copied onto the very files
that WERE the retained text, went with the files it was false on.

De-registering cost nothing that was in use. No chronology record cited the
derivatives — the gap rows that rest on these pages cite the remote deliveries,
which are untouched, hash and byte size intact — and nothing else in the
repository referred to them. What each page can and cannot bear as evidence
was already written out in its passage record and stays there.

This record does not decide whether New Advent's compilation is protected, and
does not need to. The project has no use for the page's prose, does not
redistribute the bytes, and the disposition would be the same either way. The
four glosses and the one paragraph quoted above are quoted as the evidence for
that disposition, not republished as content.
"""
source_ids = [
  "artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-g-064c6c3b",
  "artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-g-ce-5c91a95b",
  "artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-n-ce-5fd9c5e7",
  "artifact.catholic-encyclopedia.alphabetical-index.newadvent-web-2026-08-27.index-n-ef3ba0eb",
  "artifact.catholic-encyclopedia.volume-10.new-york-1911.newadvent-10670a-2f9e032c-article-text",
