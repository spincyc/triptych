     python3 -c "
     import glob,re,tomllib
     n=0;bad=[]
     for p in glob.glob('src/sources/works/catholic-encyclopedia/*/editions/*/artifacts/*/artifact.toml'):
         r=tomllib.load(open(p,'rb'))
         m=re.search(r'The Catholic Encyclopedia[.] Vol[.] (\d+)[.] New York: Robert Appleton Company, (\d{4})[.]', r.get('notes','') or '')
         if not m: continue
         n+=1
         e=r['edition_id']
         if ('volume-%s.'%m.group(1)) not in e or ('new-york-%s'%m.group(2)) not in e: bad.append(r['id'])
     print(n,'records carry the printed citation;',len(bad),'disagree with their edition_id')
     "

