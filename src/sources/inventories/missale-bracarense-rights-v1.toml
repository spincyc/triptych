# --- What would overturn this ---------------------------------------------------

[what_would_overturn_this]
note = "Stated concretely, so a later reader can attack this record on its own terms rather than re-deriving it."
items = """
  1.  A DIGITISATION OF A CLEAN 1924 COPY. Any copy without the bound-in
      supplement makes the whole of this record moot for the artifact it names:
      that file would be a 1924 book end to end, and Braga would become readable
      immediately -- SUBJECT TO ITS OWN DISPOSITION QUESTION, which the copy
      being clean does not answer; see
      `[the_scan_and_the_text_layer].a_host_saying_domaine_public_is_not_a_grant`.
      The clause `tracked` and `public-domain` originally stood here without that
      qualification and it was too fast.

      SEARCHED ON 2026-08-02 AND NOT FOUND, over twenty-four services. The hunt
      is recorded in full at `[the_clean_1924_hunt]`, with the services that
      answered separated from the services that refused. A later lane must read
      that section BEFORE repeating any of it. Three things it establishes that
      this item stated wrongly or did not know:

        the Biblioteca Nacional de Portugal ANSWERED and HOLDS A COPY, shelfmark
        R. 7413 A., which it has not digitised -- it was never unreachable;
        the Arquivo Distrital de Braga is a DOCUMENTARY ARCHIVE and a poor
        prospect for a printed altar book, and the URL commonly cited for it does
        not resolve;
        the strongest untried holder is the BIBLIOTECA PÚBLICA DE BRAGA, legal
        deposit for Braga since 1931, whose catalogue refused this network
        specifically -- it is blocked, not empty, and it is the best next move.

      A second catalogued copy stands at Barcelos, and its collation is the
      control the carve-out route was missing. This condition therefore remains
      UNSATISFIED, and it is now cheaper to attack than it was.

  2.  A LEAF MAP WITH A CONTROL, per `[routes_examined_and_refused]`. It would not
      overturn the finding; it would make the finding operational, splitting one
      unresolved artifact into a free 1924 stratum and a protected supplement.

  3.  EVIDENCE THAT A LEAF DATED HERE IS NOT WHAT IT SAYS. Every date above is an
      approbation or imprimatur READ IN THE SCAN. If any of the datable
      subscriptions belongs to a facing page rather than to the leaf it appears
      to date, the count of supplement leaves moves. The latest date would have to
      move by thirty years to disturb the holding.

  4.  A DEMONSTRATION THAT THE SUPPLEMENT IS OUT OF COPYRIGHT ANYWAY -- for
      instance, that these leaves were published simultaneously in the United
      States, or that the Archdiocese of Braga has placed them in the public
      domain, or that the source-country term had run before 1 January 1996 for a
      given leaf. Any of these frees the leaf it covers and none of them frees the
      others.

  5.  A CHANGE IN LAW shortening restored terms. Nothing of the kind is pending;
      recorded because a rights record that lists no such condition claims a
      permanence it does not have.

Note what does NOT overturn it: an Internet Archive public-domain mark, the
absence of any rights field on the item, the absence of a copyright notice in the
book, the fact that the download succeeded, or the three records in this
repository that already called this book publishable. The last of those is the
reason this file exists.
"""

