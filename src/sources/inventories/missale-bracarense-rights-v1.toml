# --- The scan and the text layer -----------------------------------------------

[the_scan_and_the_text_layer]
bridgeman = """
A faithful mechanical reproduction of a public-domain work is not original
authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y.
1999)), and machine optical character recognition adds no human authorship on top
of it. This text layer was produced autonomously by tesseract 5.3.0-6-g76ae with
`-l lat`, per the item's own metadata fields, and there is no author to hold a
right in it. So NO SEPARATE LAYER of rights was created by the scanning or by the
recognition, and neither the uploader nor the Alma Bracarense blog nor the
Internet Archive acquired anything to grant.
"""
what_bridgeman_does_not_do = """
IT DOES NOT MAKE A PHOTOGRAPH OF A 1955 PAGE FREE. Bridgeman is a proposition
about originality in the copy, not a permission covering what was copied: a
faithful reproduction of protected matter is a reproduction of protected matter.
The page-image artifact is therefore the worse of the two cases, not the better
one, and no image of this book may be published anywhere in this repository. The
conflation of the two propositions is the error corrected on the 1920 artifact on
2026-08-02, and it is written out here so the correction survives.
"""
not_relied_on = """
Expressly not links in this chain: that the Internet Archive item is available;
that the download succeeded; that the item carries no rights or licence field.
guidance/sources.md:395-400 holds the first two insufficient for `tracked`, and
the third is a fact about an item's metadata, not about a book. This item happens
to carry no `licenseurl` at all. Had it carried a Public Domain Mark, this record
would read exactly as it does -- which is the standing position of
src/sources/inventories/lt-hist-rights-audit-v1.toml, where a host's mark was the
whole of a prior corpus's ground and was refused.
"""

