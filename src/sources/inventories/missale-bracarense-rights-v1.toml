# --- What would overturn this ---------------------------------------------------

[what_would_overturn_this]
note = "Stated concretely, so a later reader can attack this record on its own terms rather than re-deriving it."
items = """
  1.  A DIGITISATION OF A CLEAN 1924 COPY. Any copy without the bound-in
      supplement makes the whole of this record moot for the artifact it names:
      that file would be a 1924 book end to end, `tracked` and `public-domain`,
      and Braga would become readable immediately. This is the single most
      valuable thing a later lane could find, and the most likely places are the
      Biblioteca Nacional de Portugal, the Arquivo Distrital de Braga, and the
      seminary and cathedral libraries of Braga -- none of which was reachable as
      a digitisation from this run.

  2.  A LEAF MAP WITH A CONTROL, per `[routes_examined_and_refused]`. It would not
      overturn the finding; it would make the finding operational, splitting one
