"""
quoting_under_103b = """
EXAMINED AND NOT USED HERE. 17 U.S.C. 103(b) -- a revised edition's copyright
extends only to what that edition contributed and does not enlarge protection in
preexisting material -- is what this repository relies on to quote ancient Latin
out of the 1962 facsimile [recorded, missale-romanum-1962-facsimile-rights-v1.toml].
It would support quoting the 1924 text from these bytes. It is not invoked as a
