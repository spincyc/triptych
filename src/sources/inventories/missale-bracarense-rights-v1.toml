holding = """
THE 1924 EDITION IS FREE. THE ONLY DIGITISATION OF IT IS NOT, AND THE TWO
SENTENCES ARE BOTH TRUE AT ONCE.

The Missale Bracarense promulgated by the bull Inter multiplices gravesque curas
of 8 December 1924 and declared typical by the Sacred Congregation of Rites on
9 December 1924 was first published at Rome in 1924. It is out of United States
copyright: any work first published outside the United States before 1931 is,
and 1924 clears that line by seven years. Nothing can restore it -- URAA
restoration runs at most 95 years from publication, which for 1924 ended in 2019.
This holds however the line moves, since the line moves later each January and
this book only recedes from it.

The one copy that has been digitised is a working altar book of a living rite. At
least fifteen supplement leaves and gatherings are bound into it, each with its
own approbation of the Sacred Congregation of Rites and its own Braga imprimatur,
dated from 17 May 1925 to 21 November 1961, printing twelve feasts that did not
exist when the Missal was promulgated -- Christ the King of 1925, St John
Leonardi of 1938, St John de Brito of 1947, the Assumption in the Mass Signum
magnum of 1950, St Anthony Mary Claret of 1950, the Queenship of the Blessed
Virgin Mary and St Pius X of 1954, St Joseph the Worker of 1955, St Gregory
Barbarigo of 1960, and three canonisations of 1925. Two of them are headed
`3. classis`, the vocabulary of the 1960 Code of Rubrics, which appears nowhere
else in the book. So the file is a photograph of the 1924 edition AND of matter
first published up to thirty-seven years later, and the pre-1931 line reaches
only the first.

DISPOSITION. Both artifacts stand `remote` and `unresolved`; no byte of either is
in Git; the bytes are recoverable from the Internet Archive and authenticated by
sha256. Nothing of this book may be published from these files -- not the 1924
text either, until a leaf map exists that can prove which page a given passage
came from. That last clause is the whole practical effect of this record, and it
is a bound on method rather than a doubt about 1924.
"""

