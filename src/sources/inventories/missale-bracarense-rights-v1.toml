claim = "The 1924 Missale Bracarense is `an ARCHDIOCESAN book rather than a Holy See imprint, so the post-1929 Holy See class does not reach it`, given as the second limb of its rights basis [recorded, latin-missal-acts-v1.toml witness row 1924-missale-bracarense; missal-acquisition-audit-v1.toml book row missale-bracarense]."
finding = "The title page reads ROMAE / TYPIS POLYGLOTTIS VATICANIS / MDCCCCXXIV at lines 33-36, and the Congregation's decree calls the edition Vaticana [verified]. It was printed at the Vatican Polyglot Press. What is archdiocesan is the Archbishop of Braga's sollicitudo in procuring it, and the rite."
effect = "The limb is struck and the holding is unchanged: the operative limb was always the year, and 1924 precedes both the pre-1931 line and the 1929 Lateran Treaty. Recorded because a rights basis carrying a false limb cannot be checked by the next reader, and because the corrected fact is the reason the edition slug is vatican-typica-1924. THE ROWS THEMSELVES WERE NOT EDITED: the act-history inventories were outside this lane's ownership."

[[corrections]]
id = "may-publish-text-yes"
claim = "`may_publish_text = \"yes\"` for the Braga missal [recorded, missal-acquisition-audit-v1.toml book row missale-bracarense], and `rights = \"public-domain\"` with `digitisation` naming this item on the witness row [recorded, latin-missal-acts-v1.toml]."
finding = "True of the 1924 EDITION and false of THIS DIGITISATION. The item carries at least fifteen supplement leaves dated 1925 to 1961 and twelve post-1924 formularies, at the loci in `[the_supplement]` [verified]. The audit's own evidence class was `verified`, and it was verified -- for the instruments in the front matter, which is what it read. Nobody read the sanctoral."
effect = "Reverses the stated disposition for the artifacts: `remote` and `unresolved`, no bytes in Git, instead of `tracked` and `public-domain`. The edition's own status is unchanged, and so is the audit's priority ranking -- Braga is still the cheapest use to reach, because the book is still whole, still fetchable, and still out of copyright as an edition. What changed is that reaching it now needs a leaf map first."

