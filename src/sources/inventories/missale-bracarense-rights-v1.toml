# --- Routes examined and refused ------------------------------------------------

[routes_examined_and_refused]
carve_out = """
REFUSED, AND NOT FOR EFFORT. The pattern this repository uses when a tracked text
carries matter its basis does not cover is a single stated replayable
transformation on printed-page boundaries -- `sed '140854,141805d' SOURCE > OUT`
on the Lasance artifact, one contiguous appendix, no program, no judgement
[recorded]. Three things stop it here.

  1. THERE ARE NO PAGE BOUNDARIES IN THE FILE. The djvu text layer carries no form
     feeds and no leaf markers, so no line range over it is a printed-page range.
     A line-range deletion would be exactly the `source_lines: 20001-30324` shape
     that the venice-1570 artifact record refuses in terms.

  2. THE INSERTIONS ARE SCATTERED, not appended. They stand at twelve places
     through the sanctoral and after the Mass tones at the end of the volume, out
     of date order where the binder put them -- St John Eudes for 19 August sits
     AFTER St Bernard of 20 August; the Queenship for 31 May and St Pius X for
     3 September stand after the appendix pagination [176]-[188] has closed.

  3. THE LIST COULD NOT BE PROVED COMPLETE. There is no clean 1924 Braga missal
     anywhere this lane could reach to diff against: the Internet Archive holds
     exactly one Braga item, which is this one; the Alma Bracarense scans are its
     upstream, the same copy; and the 1558, 1538 and 1498 printings are different
     books of an earlier state of the use. A hand-picked deletion list presented
     as exhaustive, with no control, is the undisclosed editorial hand that
     src/sources/inventories/lt-hist-rights-audit-v1.toml refused in its own
     words.

ONE THING IS BETTER HERE THAN ON THE 1920, and it is recorded so a later lane does
not inherit the wrong reasoning. The 1920's route died partly because two
insertions REPLACED older Masses, so a deletion could only leave a hole. In this
book the 1924 Assumption `[G]audeamus omnes in Domino` survives at lines
96594-96600 BESIDE the 1950 `Signum magnum` at 96685-96689 [verified]. The later
leaf sits next to what it displaced in use rather than in place of it. So the
severability objection does not bite here; objections 1 and 3 do, and either is
enough.
"""
