# Whether the 1924 Missale Bracarense may be published here, settled once so that
# it is not settled again -- and in particular so that the difference between the
# EDITION and the COPY THAT WAS SCANNED is not collapsed a second time.
#
# This file exists because the question was about to be answered by inheritance.
# Three records in this repository already said the Braga missal was publishable
# on the pre-1931 United States line -- src/sources/inventories/latin-missal-acts-v1.toml
# at the witness row 1924-missale-bracarense, src/sources/inventories/missal-acquisition-audit-v1.toml
# at the book row missale-bracarense with `may_publish_text = "yes"`, and
# guidance/act-histories.md at section 16, which names Braga as the first use to
# read -- and all three were reasoning about a book published in 1924. They were
# right about the book. The acquisition lane fetched the only digitisation any of
# them names, read it, and found the scanned volume is that book plus at least
# fifteen supplement leaves printed between 1925 and 21 November 1961.
#
# The immediate cause of this file is that the identical failure was caught the
# same day one door down. The 1920 Missale Romanum was folded in on 2026-08-01 on
# the pre-1931 line and withdrawn on 2026-08-02 when its appendix proved to print
# a Mass granted to a society erected in 1970. guidance/sources.md is explicit
# that `tracked` requires an affirmative recorded distribution basis and that
# availability and a successful download are insufficient. What follows is the
# position, the evidence it rests on, what was searched for and did NOT appear,
# what is NOT freed, and what would overturn it.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. It is the project's own reading, held to the same
# standard as any other claim here. The jurisdiction throughout is the United
# States.

