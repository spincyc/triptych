# --- The scan and the text layer -----------------------------------------------

[the_scan_and_the_text_layer]
bridgeman = """
A faithful mechanical reproduction of a public-domain work is not original
authorship (Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y.
1999)), and machine optical character recognition adds no human authorship on top
of it. This text layer was produced autonomously by tesseract 5.3.0-6-g76ae with
`-l lat`, per the item's own metadata fields, and there is no author to hold a
right in it. So NO SEPARATE LAYER of rights was created by the scanning or by the
recognition, and neither the uploader nor the Alma Bracarense blog nor the
Internet Archive acquired anything to grant.
"""
what_bridgeman_does_not_do = """
IT DOES NOT MAKE A PHOTOGRAPH OF A 1955 PAGE FREE. Bridgeman is a proposition
about originality in the copy, not a permission covering what was copied: a
faithful reproduction of protected matter is a reproduction of protected matter.
The page-image artifact is therefore the worse of the two cases, not the better
one, and no image of this book may be published anywhere in this repository. The
conflation of the two propositions is the error corrected on the 1920 artifact on
2026-08-02, and it is written out here so the correction survives.
"""
a_host_saying_domaine_public_is_not_a_grant = """
WRITTEN HERE ON 2026-08-02 BECAUSE THE NEXT ATTEMPT ON BRAGA WILL PROBABLY BE AT
GALLICA, and the shape of Gallica's rights statement is not the shape it looks
like at a glance.

Gallica holds the 1558 Braga missal (ark:/12148/bpt6k993722f, BnF Réserve
B-1478, 554 views), and the acquisition audit records it as `domaine public by
Gallica's own record`. That is accurate and it was verified at the item on
2026-08-02. It is ALSO not a distribution basis, for a reason visible in
Gallica's own metadata: the two statements live in different files and say
different things.

  THE OAI-PMH RECORD carries `<dc:rights xml:lang="fre">domaine public</dc:rights>`
  and `<dc:rights xml:lang="eng">public domain</dc:rights>`. That is a statement
  about THE BOOK -- a sixteenth-century printing, out of copyright everywhere by
  age, which nobody disputes and which needs no host to certify it.

  THE IIIF MANIFEST for the identical ark carries
  `"license": "https://gallica.bnf.fr/html/und/conditions-dutilisation-des-contenus-de-gallica"`
  and `"attribution": "Bibliothèque nationale de France"`. That is a statement
  about THE IMAGE FILES the BnF delivers, and it is a conditions-of-use document,
  not a public-domain mark and not a grant of redistribution.

BOTH WERE READ AT THE BYTES ON 2026-08-02 [verified], for that ark and for four
others. So the rule this repository already applies to an Internet Archive
Public Domain Mark applies unchanged to a Gallica `domaine public`: it is
evidence about the work's age, it is not an affirmative recorded distribution
