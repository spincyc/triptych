[[entries]]
mass = "good-friday"
form = ""
proper = "Collect"
incipit = "Deus, a quo et Judas"
witness = "cummiskey-1861"
printed_page = "271"
ia_leaf = 279
collated = "page-image, 2026-08-01"
collation_result = "recorded from the page"
witness_note = "Recorded untranslated until now, on the ground that the book prints no text here and refers the reader back to Maundy Thursday. Both halves of that are true and the conclusion drawn from them was not. At its Good Friday the witness prints `COLLECT. Deus, a quo, as p. 271.`, and p. 271 is where it sets the prayer whole, under Maundy Thursday; the reference is the book telling a reader where its own text is, not an absence. The 1962 books print the same prayer twice in full, once in each formulary, so this entry and the mass-of-the-lords-supper Collect above are two 1962 slots served from one printed English, and neither is a copy of the other."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, from whom both Judas received the punishment of his sin, and the thief the reward of his confession: grant us the effects of thy mercy; that as our Lord Jesus Christ, at the time of his passion, bestowed on both different rewards according to their merits; so, having destroyed the old man in us, he may give us grace to rise again with him. Who liveth.
"""

