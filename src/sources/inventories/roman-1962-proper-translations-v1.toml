detector = "second-printing-agrees"
second_printing_coverage = 0.9444
harvest_note = "Printed under `SECRET.` in the same Mass, answering Haec hostia, quaesumus, Domine, quam sanctorum Martyrum tuorum natalicia recensentes offerimus. THE WITNESS RENDERS THIS LATIN TWICE AND DIFFERENTLY: at St Prisca it reads `the sacrifice we offer in honour of the martyrdom of thy saints`, and here `the sacrifice which we offer thee in honour of the triumphs of thy Martyrs`. The day's own printing is the one recorded. Both printings agree on this day's wording."
ia_text_layer_line = 33163

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
We beseech thee, O Lord, that the sacrifice which we offer thee in honour of the triumphs of thy Martyrs, may loose the bonds of our sins, and procure us the gifts of thy mercy. Thro'.
"""

