source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
May the intercession, O Lord, of blessed Gorgonius, thy martyr, bring comfort to thy people; and fill them with spiritual joy on this his sacred festival. Thro'.
"""

[[entries]]
mass = "comm-ss-proti-hyacinthi-martyrum"
