note = "the witness keeps this day and prints it -- XXX. St. PETER NOLASCUS, c. at p. 548 = leaf n556, whose Collect is recorded above from that page -- but it does not appoint this Secret there. It directs `All as in Mass XIV. p. 489, except` the Collect, and its MASS XIV, Justus ut palma, sets a different Secret at p. 491, Praesta nobis, quaesumus, rendered `Grant, we beseech thee, O Almighty God, that our humble offerings may be acceptable to thee`, where the 1962 sets Laudis tibi, Domine, hostias immolamus in tuorum commemoratione Sanctorum. The prayer the 1962 does appoint the witness prints whole and with no name to supply, at its MASS XIII, Os justi, p. 489 = leaf n497, read there on 2026-08-02; its English is recorded in this file at commune-confessoris-non-pontificis-1. Attaching it here would be this file deciding that a Common the witness never sends this day to answers this day. That is a reader's alignment and not the books', and it is refused on the same ground as the comm-s-canuti rows above. This is a difference of appointment between a pre-1955 book and the 1962, not a gap in the witness's English, and it is recorded as a decision so that reversing it needs only a judgement and not another search"

