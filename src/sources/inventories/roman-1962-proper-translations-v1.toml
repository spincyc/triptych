prints two sets of orations. Those three gaps account for all 18 orations of the
Commune left without English, and each carries its reason.

Two of its Masses print no orations of their own but send the reader into the
temporal: its Advent Mass of the Blessed Virgin to the second Collect, Secret and
Postcommunion of the First Sunday of Advent, and its Christmas-to-Candlemas Mass
to the Circumcision. Both were followed and both pages read. That is the third
time in two days that a cross-reference in this book has turned out to be the
book saying where its own text is, and the second time this file had to be
corrected for having read one as an absence.

**The witness's sanctoral was reached for the first time on 2026-07-31.** Every
entry above it in this file renders a temporal oration, because the temporal is
all anyone had looked at. The 1861 book is not confined to the temporal. It
prints a Common of Saints in English from p. 459, as fourteen numbered Masses -
its MASS XII, In medio, is the Mass of Doctors at p. 486 - and a Proper of
Saints from p. 495. Its own front matter says so at p. 5, referring the reader
to "the Common of Saints, commencing at p. 459" and to "the Proper of Saints".
The 1843 printing carries both as well, at the same numbering, which means the
byte-level detector this file has wanted for the sanctoral already exists and
needs nothing new acquired.

So the premise that project-created English would be needed for the Commons is
false, at least for this Common: a public-domain witness this repository already
tracks prints it, in the same `Blessed N.` form the Latin uses. **No oration in
this file is a project-created translation. The count is zero, and it is zero
because a witness was found, not because none was attempted.**

Two limits were measured rather than assumed, and both matter to whoever
continues. The first is that the 1861 Common of Saints is a *pre-1955* Common:
where the 1962 typica prints two forms of a Secret or a Postcommunion, the
witness prints one, and its one English does not always answer either Latin.
Three propers of the Commune Doctorum are recorded `untranslated` for exactly
that reason, and the reason is written into each row. The second is that the
1861 Proper of Saints does not print every day the 1962 calendar keeps, and
how much of it the witness does reach has not been counted.

**Corrected 2026-08-01.** This paragraph used to name S. Hilarii at 14 January
