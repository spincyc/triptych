witness_note = "A cross-reference followed, as at the Vincent Secret above, and this time for all three orations of the mass. At 25 January the witness prints the Conversion of St Paul and sets the commemoration of St Peter by reference: at printed p. 544 = leaf n552 it prints `Of St. PETER, Deus, qui beato, as on the Feast of his Chair at Rome, the 18th of January, p. 538.` Printed p. 538 = leaf n546 is where it sets the prayer whole, as the Collect of its own 18 January Mass, cued `Deus, qui beato.`; the 1962 Latin is Deus, qui beato Petro Apostolo, collatis clavibus regni caelestis. The 1962 books print the same prayer twice in full, once at the Cathedra and once as this commemoration, so the reference is the 1861 economising where the typica repeats, and the prayer is the same prayer. Read at 200 dpi and again at 400 dpi, on both leaves -- the one that makes the reference and the one that prints the text; no OCR text layer supplied a reading."

