collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 663 = leaf n671, day heading `XXII. St. THOMAS of Villa Nova, bp. c.`, Latin cue `Deus, qui.`, matching the 1962 incipit. The day sends the rest of its Mass to Mass X p. 482."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, by whose gifts the blessed bishop Thomas became eminent for his charity towards the poor: we beseech thee by his intercession plentifully to pour forth the riches of thy mercy on all those who call upon thee. Thro'.
"""

[[entries]]
mass = "comm-s-theclae-virginis-martyris"
form = ""
proper = "Collect"
incipit = "Da, quaesumus omnipotens Deus"
witness = "cummiskey-1861"
printed_page = "664"
ia_leaf = 672
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 664 = leaf n672, printed inside the day `XXIII. St. LINUS, p. m.` as `COLLECT. of St. Thecla. (Da quaesumus.)`, the cue matching the 1962 incipit. The witness sends her Secret (`Receive,`) and P. Comm. (`Auxilientur,`) to p. 495; only the Collect is printed at the day."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we who celebrate the passion of blessed Thecla, thy virgin and martyr may find joy on this her yearly solemnity, and be improved by the example of so great a faith. Thro'.
"""

[[entries]]
mass = "comm-ss-cypriani-iustinae-virginis-martyrum"
form = ""
proper = "Collect"
incipit = "Beatorum Martyrum Cypriani et Justinae"
witness = "cummiskey-1861"
printed_page = "664"
ia_leaf = 672
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 664 = leaf n672, day heading `XXVI. SS. CYPRIAN and JUSTINA, mm.`, Latin cue `Beatorum.`, matching the 1962 incipit. The day sends the rest of its Mass to Mass IX p. 479 and its Secret (`We bring`) and P. Comm. (`Praesta.`) to p. 479."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
May these, thy holy martyrs Cyprian and Justina, O Lord, be a continual protection to us, for thou wilt never let thy mercy be wanting to those, whom thou favourest with such assistance. Thro'.
"""

[[entries]]
mass = "s-wenceslai-ducis-martyris"
form = ""
proper = "Collect"
incipit = "Deus, qui beatum Wenceslaum"
witness = "cummiskey-1861"
printed_page = "665"
ia_leaf = 673
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Begins on the 1861 page image at printed p. 665 = leaf n673, day heading `XXVIII. St. WENCESLAUS, m.`, Latin cue `Deus, qui.`, matching the 1962 incipit, and concludes at printed p. 666 = leaf n674; both leaves read at w1400. The day sends the rest of its Mass to Mass III p. 466."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who by a glorious martyrdom, was pleased to remove blessed Wenceslaus from an earthly government to the kingdom of heaven: grant, that by his prayers, we may be preserved from all adversity, and at length admitted to partake of the same glory. Thro'.
"""

[[entries]]
mass = "s-hieronymi-presbyteri-confessoris-ecclesiae-doctoris"
form = ""
proper = "Collect"
incipit = "Deus, qui Ecclesiae tuae"
witness = "cummiskey-1861"
printed_page = "668"
ia_leaf = 676
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 668 = leaf n676, day heading `XXX. St. JEROME, pr. c. and D.`, Latin cue `Deus, qui.`, matching the 1962 incipit. The day sends the rest of its Mass to Mass XI p. 484."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who, to expound the holy scriptures, wast pleased to provide for thy holy church that great doctor, the blessed Jerome: grant, we beseech thee, that by his merits and thy grace, we may live according to what he taught us by word and example. Thro'.
"""

[[entries]]
mass = "s-brunonis-confessoris"
form = ""
proper = "Collect"
incipit = "Sancti Brunonis Confessoris"
witness = "cummiskey-1861"
printed_page = "671"
ia_leaf = 679
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Begins on the 1861 page image at printed p. 671 = leaf n679, day heading `VI. St. BRUNO, c.`, Latin cue `Sancti Brunonis.`, matching the 1962 incipit, and concludes at printed p. 672 = leaf n680; both leaves read at w1400. The day sends the rest of its Mass to Mass XIII p. 488."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, O Lord, we may be assisted by the holy prayers of blessed Bruno, thy Confessor, that we, who have grievously offended thy divine Majesty, may, through his merits and intercession, obtain pardon of all our sins. Thro'.
"""

[[entries]]
mass = "comm-ss-sergii-bacchi-marcelli-apuleii"
form = ""
proper = "Collect"
incipit = "Sanctorum Martyrum tuorum nos, Domine, Sergii"
witness = "cummiskey-1861"
printed_page = "672"
ia_leaf = 680
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 672 = leaf n680, printed as `Of SS. Sergius, Bacchus, &c. (Sanctorum.)` inside the day `VII. St. MARK, p. c.`: the witness keeps this commemoration at 7 October where the 1962 keeps it at 8 October with St Bridget. The cue `(Sanctorum.)` matches the 1962 incipit. The page prints `Appuleius` where the 1962 Latin prints `Apuleii`, and prints no `Thro'.` after this commemoration oration; both are reproduced as printed."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
We beseech thee, O Lord, that the eminent virtues of thy holy martyrs, Sergius, Bacchus, Marcellus, and Appuleius, may be a benefit to our souls, and encourage us to be always fervent in thy love.
"""

[[entries]]
mass = "s-francisci-borgiae-confessoris"
form = ""
proper = "Collect"
incipit = "Domine Jesu Christe, verae humilitatis"
witness = "cummiskey-1861"
printed_page = "674"
ia_leaf = 682
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 674 = leaf n682, day heading `XI. St. FRANCIS BORGIA, c.` under the running head `11th OCTOBER`: the witness keeps this feast at 11 October where the 1962 keeps it at 10 October. Latin cue `Domine Jesu.`, matching the 1962 incipit. The day sends the rest of its Mass to Mass XIII p. 488."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Lord Jesus Christ, who art both the model and the reward of true humility, we beseech thee, that as by thy grace blessed Francis became a glorious follower of thee in the contempt of earthly grandeur: so we also, by the like imitation of thee, may attain to the same glory. Who livest.
"""

[[entries]]
mass = "s-eduardi-regis-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui beatum regem Eduardum"
witness = "cummiskey-1861"
printed_page = "675"
ia_leaf = 683
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 675 = leaf n683, day heading `XIII. St. EDWARD, King, c.`, Latin cue `Deus qui.`, matching the 1962 incipit. The day sends the rest of its Mass to Mass XIII p. 488."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who hast crowned the blessed King Edward, thy confessor, with a diadem of glory; grant that we may honour him in such a manner on earth, as to hereafter reign with him in heaven. Thro'.
"""

[[entries]]
mass = "s-callisti-i-papae-martyris"
form = ""
proper = "Collect"
incipit = "Deus, qui nos conspicis"
witness = "cummiskey-1861"
printed_page = "675"
ia_leaf = 683
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 675 = leaf n683, day heading `XIV. St. CALISTUS, p. m.`, Latin cue `Deus qui.`, matching the 1962 incipit. The day sends the rest of its Mass to Mass II p. 464."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who seest that we faint under our own infirmities: mercifully grant, that the examples of the saints may raise us up to the sincere love of thee. Thro'.
"""

[[entries]]
mass = "s-teresiae-virginis"
form = ""
proper = "Collect"
incipit = "Exaudi nos Deus salutaris noster"
witness = "cummiskey-1861"
printed_page = "676"
ia_leaf = 684
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 676 = leaf n684, day heading `XV. St. TERESA, v.`, Latin cue `Exaudi.`, matching the 1962 incipit. The day sends the rest of its Mass to Mass XIX p. 498. The English's last clause, `and inflamed with the love of thee`, renders the 1962 Latin's `et piae devotionis erudiamur affectu` freely; the cue and the body of the prayer leave the identity in no doubt."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Hear us, O God, our Saviour, and as we rejoice on the solemnity of blessed Teresa, thy virgin, so may our souls be improved by her heavenly instructions, and inflamed with the love of thee. Thro'.
"""

[[entries]]
mass = "s-ioannis-s-facundo-confessoris"
form = ""
proper = "Collect"
incipit = "Deus auctor pacis"
witness = "cummiskey-1861"
printed_page = "592"
ia_leaf = 600
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n600 = printed p. 592, under the day heading `XII. St. JOHN A FACUNDO, c.` with the running head `12th JUNE`. The day is printed by reference -- `All as in Mass XIII. p. 488, except` -- and then sets this Collect as its own, cued `Deus auctor`, which answers the 1962's `Deus auctor pacis, et amator caritatis`. The same page continues with a separate `COLLECT, (Sanctorum) of SS. BASILIDES, &c. mm.`, which is the commemoration and is not this row."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, the author of peace and lover of charity, who gavest to blessed John, thy confessor, the extraordinary grace of reconciling those who were at variance : grant, by his merits and intercession, that being well-grounded in thy charity, we may be by no temptations separated from thee. Thro'.
"""

[[entries]]
mass = "s-antonii-padua-confessoris-ecclesiae-doctoris"
form = ""
proper = "Collect"
incipit = "Ecclesiam tuam, Deus"
witness = "cummiskey-1861"
printed_page = "593"
ia_leaf = 601
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n601 = printed p. 593, under `XIII. St. ANTHONY of PADUA, c.` with the running head `13th AND 14th JUNE`. Cue `Ecclesiam.`, answering the 1962's `Ecclesiam tuam, Deus, beati Antonii Confessoris tui solemnitas votiva laetificet`. DIVERGENCE OF STYLE, NOT OF TEXT: the witness styles him `c.` and sends the day to its Mass XIII (Confessor not a Bishop, p. 488), where the 1962 styles him Confessor et Ecclesiae Doctor and sends the day to the Commune Doctorum -- Anthony was declared a Doctor of the Church in 1946, long after this printing. The Collect the two books set is the same one."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
May this solemnity, O God, of blessed Anthony, thy confessor, be a comfort to thy church : that thy people may never want the assistance of thy grace, and at length come to the possession of eternal joys. Thro'.
"""

[[entries]]
mass = "s-iulianae-falconeriis-virginis"
form = ""
proper = "Collect"
incipit = "Deus, qui beatam Julianam"
witness = "cummiskey-1861"
printed_page = "597"
ia_leaf = 605
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n605 = printed p. 597, under `XIX. St. JULIANA de FALCONERIS, v.` with the running head `19th AND 20th JUNE`. The day is printed by reference -- `All as in Mass XIX. p. 498, except` -- and sets this Collect as its own, cued `Deus qui.`, answering the 1962's `Deus, qui beatam Julianam Virginem tuam, extremo morbo laborantem`. The witness prints NO conclusion cue after `country.` where the 1962 prints `Per eumdem Dominum`; the transcription reproduces the page and does not supply one. The day's own text is followed on the same page by a `Commem. of SS. Gervasius and Protasius`, which is not this row."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who vouchsafedst to refresh blessed Juliana, thy virgin, in a miraculous manner, with the precious body of thy Son in her last sickness ; grant, we beseech thee, by her merits and intercession, that we also, in our last conflict, may be so refreshed and strengthened with the same, as to be brought to our heavenly country.
"""

[[entries]]
mass = "s-gulielmi-abbatis"
form = ""
proper = "Collect"
incipit = "Deus, qui infirmitati nostrae"
witness = "cummiskey-1861"
printed_page = "602"
ia_leaf = 610
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "The oration straddles two leaves and both were opened: it begins at leaf n610 = printed p. 602, under `XXV. St. WILLIAM, of York. ab. c.` / `All as in Mass XV. * p. 491, except` / `COLLECT. Deus, qui.--O God, who in thy`, running head `25th JUNE`, and finishes at leaf n611 = printed p. 603, running head `26th JUNE`, at `...and tread in his steps. Thro'.` DIVERGENCE OF ATTRIBUTION, NOT OF TEXT: this English recension identifies the 25 June Abbot as William of York, and the body of the prayer names him `the blessed Abbot William`; the 1962's day is S. Gulielmi Abbatis (William of Vercelli). The words answer the 1962's Latin clause for clause -- `in Sanctis tuis exemplum, et praesidium collocasti` / `hast afforded both an example and help to our weakness`, `ad terendam salutis viam` / `to walk in the road of salvation`, `ut ejusdem excipiamus suffragia, et vestigia` / `that we may feel the benefit of his suffrages, and tread in his steps`."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who in thy saints hast afforded both an example and help to our weakness, in order to enable us to walk in the road of salvation : grant us so to revere the merits of the blessed Abbot William, that we may feel the benefit of his suffrages, and tread in his steps. Thro'.
"""

[[entries]]
mass = "s-elisabeth-reginae-viduae"
form = ""
proper = "Collect"
incipit = "Clementissime Deus"
witness = "cummiskey-1861"
printed_page = "615"
ia_leaf = 623
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n623 = printed p. 615, under `VIII. St. ELIZABETH, w.` / `All as in Mass XXI. p. 502, except`, running head `8th AND 10th JULY`. Cue `Clementissime.`, answering the 1962's `Clementissime Deus, qui beatam Elisabeth Reginam ... bellici furoris sedandi praerogativa decorasti`. The witness's heading styles her `w.` (widow) without the royal title the 1962 prints (Reginae, Viduae); the body of the prayer names her `blessed Elizabeth` in both."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O most merciful God, who, amongst other admirable endowments, didst privilege blessed Elizabeth with the gift of making wars cease : grant, by her prayers, that after having enjoyed the peace, which we humbly crave in this mortal life, we may be received into everlasting bliss. Thro'.
"""

[[entries]]
mass = "comm-ss-naboris-felicis-martyrum"
form = ""
proper = "Collect"
incipit = "Praesta, quaesumus Domine: ut sicut nos"
witness = "cummiskey-1861"
printed_page = "617"
ia_leaf = 625
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n625 = printed p. 617, running head `14th AND 15th JULY`, at the head of the page under `Commem. of SS. Nabor and Felix, mm.` -- the commemoration carried over from the 12 July Mass of St John Gaulbert, which begins on the preceding page (leaf n624 = p. 616, running head `12th JULY`) and prints no oration of the commemoration there. Cue `Praesta.` The rendering is FREE and the integrator should weigh it: the 1962 Latin is `Praesta, quaesumus Domine: ut sicut nos sanctorum Martyrum tuorum Naboris et Felicis natalitia celebranda non deserunt; ita jugiter suffragiis comitentur`, and the witness renders `natalitia celebranda non deserunt` as `we make a yearly commemoration` and `jugiter suffragiis comitentur` as `always be partakers of their intercession`, and says `these thy holy martyrs` where the Latin names Nabor and Felix. The saints are named in the heading immediately above, so nothing is supplied here that the witness does not print; but this is a paraphrase, not a close rendering, and no name has been written into it."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee O Lord, that as we make a yearly commemoration of these thy holy martyrs : so we may always be partakers of their intercession. Thro'.
"""

[[entries]]
mass = "s-henrici-imperatoris-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui hodierna die beatum Henricum"
witness = "cummiskey-1861"
printed_page = "623"
ia_leaf = 631
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "DATE DIVERGENCE, NOT TEXT DIVERGENCE. The witness keeps Henry on 21 JULY, not 15 July: read at leaf n631 = printed p. 623, running head `21st AND 22d JULY`, under `XXI. St. HENRY, Emperor.` / `All as in Mass XIII. Os justi, p. 488, except`. Its 15 July (leaf n625 = p. 617) is `XV. St. SWITHIN, bp. of Winchester, c.`, an English proper. The Collect cued `Deus, qui.` answers the 1962's `Deus, qui hodierna die beatum Henricum Confessorem tuum e terreni culmine imperii ad regnum aeternum transtulisti` word for word, `hodierna die` included -- which in the witness points at 21 July and in the 1962 at 15 July. The 1962's Common pointer (Confessor non Pontifex, Missa I: Os justi) is the same one the witness prints."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst this day remove blessed Henry thy confessor from his earthly throne to an eternal kingdom : we humbly beseech thee, that as by the assistance of thy grace, he was proof against all the temptations of the world : so we may follow his example in withstanding all the flatteries of this world, and serve thee with clean hearts. Thro'.
"""

[[entries]]
mass = "comm-ss-felicis-simplicii-faustini-beatricis"
form = ""
proper = "Collect"
incipit = "Praesta, quaesumus Domine: ut, sicut populus christianus"
witness = "cummiskey-1861"
printed_page = "630"
ia_leaf = 638
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n638 = printed p. 630, running head `29th JULY`, under `XXIX. St. MARTHA, v.` whose rubric reads `All as in Mass XIX. p. 498, except the Gospel, Luke x. as on August 15, with a Comm. of SS. FELIX, &c. mm. as follows :`, and then prints this Collect. So the witness reaches these four martyrs exactly as the 1962 does, as a commemoration inside the 29 July Mass, and prints their own oration rather than sending it to a Common. Cue `Praesta.`, answering `Praesta, quaesumus Domine: ut, sicut populus christianus Martyrum tuorum Felicis, Simplicii, Faustini, et Beatricis temporali solemnitate congaudet, ita perfruatur aeterna`. The witness spells the names `Felix, Simplicius, Faustin, and Beatrix` and abbreviates martyrs to `mm.` in the body of the prayer; both are reproduced as printed."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, O Lord, we beseech thee, that as thy christian people rejoice on the solemnity of thy holy mm. Felix, Simplicius, Faustin, and Beatrix ; so they may partake of their eternal joys, and be one day possessed of that happiness which they now so earnestly desire. Thro'.
"""

[[entries]]
mass = "comm-ss-hippolyti-cassiani-martyrum"
form = ""
proper = "Collect"
incipit = "Da, quaesumus omnipotens Deus"
witness = "cummiskey-1861"
printed_page = "640"
ia_leaf = 648
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n648 = printed p. 640, running head `11th AND 13th AUGUST`, under its own heading `XIII. Commem. of SS. HYPPOLITE, &c. mm.` Cue `Da, quaesumus.`, answering the 1962's `Da, quaesumus omnipotens Deus: ut beatorum Martyrum tuorum Hippolyti, et Cassiani veneranda solemnitas, et devotionem nobis augeat, et salutem`. The witness spells `Hyppolite and Cassian`. The last two lines of the oration are heavily inked at the right margin of this leaf; `a help to salvation` and the closing `Thro'.` were read on the image and are legible, but the integrator may wish to re-open the leaf at 400 dpi before publishing. This 1962 entry currently holds BOTH a real Collect and a Placeholder proper; this row answers the Collect."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that the sacred solemnity of thy holy martyrs, Hyppolite and Cassian, may be to us an increase of devotion and a help to salvation. Thro'.
"""

[[entries]]
mass = "s-ioannae-franciscae-fremiot-chantal-viduae"
form = ""
proper = "Collect"
incipit = "Omnipotens et misericors Deus"
witness = "cummiskey-1861"
printed_page = "646"
ia_leaf = 654
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "The oration straddles two leaves and both were opened: it begins at leaf n654 = printed p. 646, running head `18th AND 21st AUGUST`, under `XXI. St. JANE FRANCES, w.` / `All as in Mass XXI. p. 502, except` / `COLLECT. Omnipotens.--O Almighty and mer`, and finishes at leaf n655 = printed p. 647, running head `22d AUGUST`, at `...with the help of thy heavenly grace. Thro'.` Cue `Omnipotens.`, answering the 1962's `Omnipotens et misericors Deus, qui beatam Joannam Franciscam tuo amore succensam, admirabili spiritus fortitudine per omnes vitae semitas in via perfectionis donasti, quique per illam illustrare Ecclesiam ...`. The witness names her `Jane Frances`."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O Almighty and merciful God, who hast granted blessed Jane Frances, inflamed with the love of thee, a wonderful degree of fortitude through all the paths of life, and wast pleased through her, to adorn thy church with a new offspring : grant, by her merits and prayers, that we who, sensible of our weakness, confide in thy strength, may overcome all adversities with the help of thy heavenly grace. Thro'.
"""

[[entries]]
mass = "comm-ss-timothei-sociorum-martyrum"
form = ""
proper = "Collect"
incipit = "Auxilium tuum nobis, Domine"
witness = "cummiskey-1861"
printed_page = "647"
ia_leaf = 655
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n655 = printed p. 647, running head `22d AUGUST`, under `XXII. OCTAVE of the ASSUMPTION.` / `All as on the Feast, p. 642, with the following Commem. of SS. TIMOTHY, &c. mm.` -- the same shape the 1962 has, a commemoration on the Octave day, and the witness prints the commemoration's own three orations rather than sending them to a Common. Cue `Auxilium.`, answering the 1962's `Auxilium tuum nobis, Domine, quaesumus, placatus impende: et intercedentibus beatis Martyribus tuis Timotheo, Hippolyto, et Symphoriano, dexteram super nos tuae propitiationis extende`. The witness spells `Tymothy, Hyppolite and Symphorian`; the line break in `us un / der` is joined."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Help us, O Lord, in thy mercy, and, by the intercession of thy martyrs, Tymothy, Hyppolite and Symphorian, shelter us under the protection of thy goodness. Thro'.
"""

[[entries]]
mass = "s-philippi-benitii-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui per beatum Philippum"
witness = "cummiskey-1861"
printed_page = "648"
ia_leaf = 656
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n656 = printed p. 648, running head `23d AND 24th AUGUST`, under `XXIII. St. PHILIP BENITIUS, c.` / `Al. as in Mass XIV. p. 489, except`. Cue `Deus, qui.`, answering the 1962's `Deus, qui per beatum Philippum Confessorem tuum, eximium nobis humilitatis exemplum tribuisti: da famulis tuis, prospera mundi ex ejus imitatione despicere, et coelestia semper inquirere`. The Common the witness names (its Mass XIV, p. 489) is the second Confessor-not-a-Bishop Mass, which is the same one the 1962 names (Missa II: Justus ut palma). TWO READING CAUTIONS on this leaf: the right-hand margin of the block is inked, so the terminal letters of `blessed`, `humility`, `despise` and `hearts` are damaged and were read from their remaining strokes and the sense of the line; and the oration ends `Thro'` with NO closing full stop, which is reproduced. The witness reads `has left us` where a modern editor would set `hast left us`; the page is reproduced."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who in blessed Philip, thy confessor, has left us an example of humility : grant that, in imitation of him, we may despise the prosperity of this world, and have our hearts always fixed on the happiness of the next. Thro'
"""

[[entries]]
mass = "comm-s-zephyrini-papae-martyris"
