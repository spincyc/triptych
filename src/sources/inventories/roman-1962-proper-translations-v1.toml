ia_leaf = 594
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "The witness keeps the day on 21 May, not the 1962's 19 May: heading XXI. St. PETER CELESTINE, p. c., under the running head 21st and 25th May, p. 586 = leaf n594; its Kalendar (p. 770 = leaf n778) gives 19 May to St Dunstan and 21 May to Peter Celestine. Directive `All as in Mass X*. p. 482, except`; cue `Deus, qui beatum.` answers the 1962 incipit."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst raise blessed Celestine to the dignity of chief bishop, which thou taughtest him to quit for a more humble and private state: mercifully grant, that, by his example, we may despise the things of this world, and happily obtain the blessings promised to the humble. Thro'.
"""

[[entries]]
mass = "comm-s-urbani-i-papae-martyris"
