source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Holy Mary, the Queen of heaven and Lady of the world, stood full of grief by the cross of our Lord Jesus Christ. V. O all you that pass by the way, attend and see if there be any sorrow like unto mine.
"""

