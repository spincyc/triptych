May the offerings of us thy servants, O Lord, be acceptable to thee, by the intercession of blessed Gorgonius, thy martyr.
"""

[[entries]]
mass = "comm-s-gorgonii-martyris"
form = ""
proper = "Postcommunion"
incipit = "Familiam tuam, Deus, suavitas aeterna"
