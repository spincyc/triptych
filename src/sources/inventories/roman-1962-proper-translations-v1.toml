note = "the witness reaches this day, and reaches it by reference. Its own Kalendar (p. 766 = leaf n774, read on the page image 2026-08-19) gives 11 January as `Of the Octave. Com. of St. Hyginus, p. m.` referred to p. 461, its MASS I. Statuit, of a MARTYR and BP. That Mass was opened at pp. 461-462 = leaves n469 and n470 the same day, and its Collect prints `Have regard, O Almighty God to our weakness; and as we sink under the weight of our doings, let the glorious intercession of blessed N. thy Martyr and Bishop, be a protection to us` -- the same Latin the 1962 prints for this day (Infirmitatem nostram respice ... beati Hygini Martyris tui atque Pontificis intercessio gloriosa), but with N. where the 1962 prints the name. Writing Hyginus in is project-composed text and is not done -- the s-hilarii refusal. The Common's English is recorded at commune-unius-martyris-1, where the witness prints it and where the Latin still reads N."

