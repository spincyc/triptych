witness_note = "The witness prints `XXX. St. PETER NOLASCUS, c.` at printed p. 548 = leaf n556 under the direction `All as in Mass XIV. p. 489, except`, and its MASS XIV is `Justus ut palma, of the same`, which is the Common the 1962 sends the day to -- Missa Iustus de Communi Confessoris non Pontificis II loco. The two books agree on the Mass and on this Collect, cued `Deus, qui.` and answering Deus, qui in tuae caritatis exemplum ad fidelium redemptionem sanctum Petrum Ecclesiam tuam nova prole fecundare divinitus docuisti. They do not agree on what else is proper: the 1962 sets a Secret and a Postcommunion of its own where the 1861 takes Mass XIV's, so those two slots stand `untranslated` below with the reason on each. The 1861's own Roman Calendar keeps this saint on 31 January and its Proper of Saints prints him under the heading XXX, where the 1962 keeps 28 January; the Collect is the same prayer either way. Read at 200 dpi and again at 400 dpi; no OCR text layer supplied a reading."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who, in imitation of thy charity, didst inspire blessed Peter to institute a new order in the Church for the redemption of captives; grant, by his intercession, that being delivered from the slavery of sin, we may enjoy everlasting liberty in our heavenly country. Thro'.
"""

