ia_text_layer_line = 33167

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Being filled with thy heavenly gifts, we humbly beseech thee, O Lord, that what we perform as an homage due to thee, may avail us to salvation. Thro'.
"""

[[entries]]
mass = "s-fidelis-sigmaringa-martyris"
form = ""
proper = "Collect"
incipit = "Deus, qui beatum Fidelem"
witness = "cummiskey-1861"
detector = "second-printing-agrees"
second_printing_coverage = 0.9857
harvest_note = "The witness keeps the day -- `XXIV. St. FIDELIS, m.` -- and sets this Collect proper to it, cued `Deus, qui.` and answering Deus, qui beatum Fidelem, seraphico spiritus ardore succensum, in verae fidei propagatione martyrii palma et gloriosis miraculis decorare dignatus es."
ia_text_layer_line = 33271

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst fill the heart of blessed Fidelis with the fire of seraphic love; and whilst he laboured in the propagation of the true faith, didst honour him with the crown of martyrdom and the gift of miracles: grant, we beseech thee, that by his merits and intercession, we may be so confirmed by thy grace, as to be found faithful in thy service even unto death. Thro'.
"""

[[entries]]
mass = "s-catharinae-senensis-virginis"
