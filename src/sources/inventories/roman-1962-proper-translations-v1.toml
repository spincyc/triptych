[[untranslated]]
mass = "palm-sunday"
form = ""
proper = "Procession Antiphon"
reason = "the 1962 Missal's Holy Week is the Ordo Hebdomadae Sanctae instauratus promulgated under Maxima redemptionis nostrae mysteria in 1955, and this witness is an 1861 printing of the rite that order replaced. Its source row's `caution` already says in terms that its Holy Week is not that of 1962. The two rites do not stand in a one-to-one relation here -- the procession, the afternoon liturgy and the vigil differ in what is said, in what order, and in how many items there are, and the pre-1955 vigil reads twelve prophecies where the 1962 reads four -- so the witness's English cannot be attached to a 1962 slot without a reader deciding which pre-1955 item answers it. That decision is exactly the recension error this repository records having made 176 times, and it is refused. NOT A CLAIM THAT THE WORDS DIFFER: several of these texts, the Exsultet, the Improperia and the Mandatum antiphons among them, were carried into the reformed order substantially unaltered, and a targeted collation against a 1962 altar book would very likely reach them. That collation was run on 2026-08-07 and returned nothing attachable. Each of the 39 was measured against the whole 1861 text layer by word coverage: only the Pange lingua clears 0.85, at 0.886, and the book prints it in Latin with no English beside it. The Exsultet scores 0.052, the Improperia 0.047, the Solemn Intercessions 0.046. Where the book does print English -- the Improperia -- it gives Latin for two verses only, so there is nothing to prove the alignment against. Reaching these slots needs another witness, not another reading of this one."

[[untranslated]]
mass = "palm-sunday"
