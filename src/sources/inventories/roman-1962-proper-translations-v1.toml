witness_note = "The witness prints 16 January as `XVI. S. MARCELLUS, p. m.` at printed p. 537 = leaf n545 and sets this Collect proper to the day, cued `Preces.` before the English; the 1962 Latin is Preces populi tui, quaesumus, Domine, clementer exaudi. Both books make the Collect and only the Collect proper here -- the 1962 pointer says praeter orationem sequentem -- so this is the single slot the day appoints and the one entry it needs. The two books differ on the Mass, and the difference is the one this file has already had to record: the 1861 has no Common of Supreme Pontiffs at all, so it sends the day to its MASS I, Statuit, of a Martyr and Bishop, where the 1962 sends it to Missa Si diligis me de Communi Summorum Pontificum. That Common's nine orations remain `untranslated` below for want of any counterpart in this book; the day's own Collect is not affected by it, because the witness prints the prayer itself. Read at 200 dpi and again at 400 dpi; no OCR text layer supplied a reading."

