# 1862 Pustet Latin Missal (Internet Archive item bub_gb_E7sPAAAAIAAJ), whose
# Latin is the same the 1962 index carries. See each entry's `harvest_note`
# and `latin_identity_leaf` for the per-row evidence.

[[entries]]
mass = "commemoratione-omnium-fidelium-defunctorum"
form = "First Mass (Ad primam Missam)"
form_id = "first"
proper = "Sequence"
cycle = "all"
occurrence = 1
incipit = "Dies irae, dies illa"
witness = "caswall-1849"
detector = "read-on-page-images"
harvest_note = '''Read at printed pp. 241-244 = leaves n278-n281, under `Sequence, Mass for the Dead.` and the incipit `Dies irae dies illa.` Nineteen stanzas against the Missal's nineteen strophes, one for one; the closing `Amen.` is not rendered. This corrected the recovered lane brief and the then-current guidance row, which had misidentified the London edition's contents. The London 1849 prints it, in its Missal section, between the Lauda Sion and the cross-reference to the Stabat Mater. An independent English of this sequence is therefore not needed for coverage; the alternative Irons text below is offered as a choice of voice, not as a gap-filler. The existing untranslated row for this slot refuses the 1861 witness's own English as a verse paraphrase in the manner of Roscommon; that refusal stands and is not disturbed by this row, which comes from a different book.'''

disagreement = '''
Two independent metrical translations of this sequence are carried side by side
by the maintainer's choice recorded in this overlay. Caswall 1849 is the
through-line across all five Missal sequences; Irons 1890 (*Hymns Ancient and
Modern*, Complete Edition, hymn 398) is offered as the alternative for this one
slot, and is the version
that renders the closing Amen that Caswall omits. This is a choice of voice and
not a correction: neither reading is in error, neither is settled against the
other, and both are served. The two source rows `caswall-1849` and
`hymns-ancient-and-modern-1890` are declared among the [[sources]] above.
'''

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.edward-caswall.lyra-catholica.london-1849"
text = '''
Nigher still, and still more nigh
Draws the Day of Prophecy,
Doom’d to melt the earth and sky.

Oh, what trembling there shall be,
When the world its Judge shall see,
Coming in dread majesty!

Hark! the trump, with thrilling tone,
From sepulchral regions lone,
Summons all before the throne:

Time and Death it doth appal,
To see the buried ages all
Rise to answer at the call.

Now the books are open spread;
Now the writing must be read,
Which condemns the quick and dead:

Now, before the Judge severe
Hidden things must all appear;
Nought can pass unpunish’d here.

What shall guilty I then plead?
Who for me will intercede,
When the Saints shall comfort need?

King of dreadful Majesty!
Who dost freely justify!
Fount of Pity, save Thou me!

Recollect, O Love divine!
’Twas for this lost sheep of thine
Thou thy glory didst resign:

Satest wearied seeking me;
Sufferedst upon the Tree:
Let not vain thy labour be.

Judge of Justice, hear my prayer!
Spare me, Lord, in mercy spare!
Ere the Reckoning-day appear.

Lo! thy gracious face I seek;
Shame and grief are on my cheek;
Sighs and tears my sorrow speak.

Thou didst Mary’s guilt forgive;
Didst the dying thief receive;
Hence doth hope within me live.

Worthless are my prayers, I know;
Yet, oh, cause me not to go
Into everlasting woe.

Sever’d from the guilty band,
Make me with thy sheep to stand,
Placing me on thy right hand.

When the curs’d in anguish flee
Into flames of misery;
With the Blest then call Thou me.

Suppliant in the dust I lie;
My heart a cinder, crush’d and dry;
Help me, Lord, when death is nigh!

Full of tears, and full of dread,
Is the day that wakes the dead,
Calling all, with solemn blast,
From the ashes of the past.

Lord of mercy! Jesu blest!
Grant the Faithful light and rest.
'''

