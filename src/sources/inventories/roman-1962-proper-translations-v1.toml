witness_note = "Slot displacement of the kind this file has recorded four times, and this time it did not hide anything, because the book flags it. The witness has no Mass of St Prisca. It prints 18 January as `XVIII. St. PETER's CHAIR at ROME, &c.` and sets her three orations inside that Mass as commemorations, each marked with a dagger and headed `Of St. Prisca`, the rubric under the title saying that by omitting the commemoration of St Prisca the same Mass serves for the Chair at Antioch on 22 February. The Collect stands at printed p. 538 = leaf n546, cued `Da quaesumus.`; the 1962 Latin is Da, quaesumus, omnipotens Deus: ut, qui beatae Priscae Virginis et Martyris tuae natalicia colimus, and the book names her. The 1962 gives the commemoration Missa Me exspectaverunt de Communi Virginum II loco cum orationibus ut infra, so both books make these three proper to the day and differ only on where they print them. Read at 200 dpi and again at 400 dpi; no OCR text layer supplied a reading."

