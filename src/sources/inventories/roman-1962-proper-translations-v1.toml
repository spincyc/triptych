note = "the witness reaches this day, and reaches it by reference. Its 5 January is V. Octave of St. THOMAS of CANTERBURY (p. 534 = leaf n542, read on the page image 2026-08-19), whose rubric commemorates St. Telesphorus `by the Collect, &c. of Mass II. p. 464, &c.` MASS II. Sacerdotes Dei was opened at p. 464 = leaf n472 the same day, and its Collect prints `O God, who, by the yearly solemnity of blessed N. thy Martyr and Bishop, rejoicest the hearts of thy faithful` -- the same Latin the 1962 prints for this day (Deus, qui nos beati Telesphori, Martyris tui atque Pontificis, annua solemnitate laetificas), but with N. where the 1962 prints the name. The only step from one to the other is to write Telesphorus into a prayer the witness does not write him into, and that step is project-composed text, so it is not taken -- the same refusal this file records at s-hilarii. The Common's English is recorded at commune-unius-martyris-2, where the witness prints it and where the Latin still reads N."

