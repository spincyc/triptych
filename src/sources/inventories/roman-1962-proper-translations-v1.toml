source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
We offer thee, O Lord Jesus Christ, our prayers and sacrifices, humbly intreating thee, that we, who, in our prayers of this day, commemorate the transfixion of the most sweet soul of blessed Mary thy mother, may receive our reward with her and her blessed companions that stood under thy cross, this holy assembly being multiplied, through the merits of thy death. Who livest.
"""

