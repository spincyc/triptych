collated = "page-image and tracked transcription, 2026-08-27"
collation_result = "confirmed"
witness_note = "The pre-1955 FOURTH prophecy (Exodus 14, with the tract Cantemus Domino) is the 1962's SECOND, and its oration went with it. The 1862 at p. 193 prints `Deus, cujus antiqua miracula etiam nostris saeculis coruscare sentimus ... totius mundi transeat plenitudo. Per Dominum.`, the 1962 index word for word. The 1861 prints the English under the cue `Deus cujus.` after the same prophecy and the same tract. THE POSITION MOVED AND THE TEXT DID NOT: this row is filed under the 1962's numbering, not the 1861's. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O God, whose ancient miracles we see renewed in our days: whilst, by the water of regeneration, thou performest, for the salvation of the Gentiles, that which by the power of thy right hand thou didst for the deliverance of one people from the Egyptian persecution; grant that all the nations of the world may become the children of Abraham, and partake of the dignity of the people of Israel. Thro'. R. Amen."

