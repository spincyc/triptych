reason = "the same appointment and the same refusal as the Secret above. The witness's MASS XIV sets Quaesumus, omnipotens Deus at p. 491, rendered `by the intercession of thy holy confessor N. the heavenly food we have received may defend us from all adversity`, where the 1962 sets Refecti cibo potuque caelesti, Deus noster. The 1962's prayer stands at the witness's MASS XIII, p. 489 = leaf n497, and its English is recorded at commune-confessoris-non-pontificis-1; it is not attached here for the reason given on the Secret"

