reason = "the witness does not keep the day. St John Eudes was canonised in 1925, sixty-four years after this printing. Leaf n654, printed p. 646, running head `18th AND 21st AUGUST.`, runs from `XVIII. Commem. of St. AGAPETE, m.` straight to `XXI. St. JANE FRANCES, w.` with no 19 August between them, and the Kalendar at leaf n781, printed p. 773, gives 19 August as `Of the Octave 646`. The 1962 slot is in any case still a placeholder in propers.yaml: no Latin has been transcribed for it either"

