source_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.temporal-orations-en"
artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.temporal-orations-en"
label = "The Roman Missal translated into the English language for the use of the laity, first revised edition (Philadelphia: Eugene Cummiskey, 1861), in this project's transcription of its temporal orations"
attests = "si-quid-est-1634"
attests_kind = "date-bound"
attests_basis = """
The same book as cummiskey-1861 above and therefore the same edge, drawn on the
same date bound and no stronger. A transcription attests what the printing it
transcribes attests and not one thing more: this row exists because the reading
is a second and independent one, not because the object read is a second book.

One limit, stated rather than left to be discovered. The act history carries the
witness under the id `cummiskey-1861`, and `check-calendar-masses` binds a source
row to the act history by that id, so it is the row above and not this one that
the cross-check actually holds. This row is given a distinct id because it names a
different artifact of the same printing and a reader has to be able to tell the
two rows apart; the values are copied from the row the check does hold, and if
they ever drift the drift will be visible here rather than caught there.
"""
rights = "public-domain"
rights_jurisdiction = "United States"
rights_basis = "The 1861 printing's own English, on the same United States publication-date basis as the edition row above, and with the same caveat for a reader elsewhere. What differs is the bytes: this row's `artifact_id` names a file this repository TRACKS, a project-made tab-separated transcription carrying only the printing's own wording, where the edition row's names a remote Google-produced text layer whose rights the source library records as unresolved. A faithful transcription of a public-domain text originates no new copyright, so nothing here is the project's to license; the artifact record states the same and pins the file by sha256."
role = """
Second witness, and the only row in this file whose text is attached beside
another's rather than instead of it. `witness` on every entry still names
cummiskey-1861, because that is the reading this file collated and corrected; this
row's wording is carried as a second `[[entries.translations]]` on each of the 156
orations it reaches, keyed `(lang, source_id)` so the two stand side by side.

It is NOT a corroborating-only witness in the way cummiskey-1843 is. The 1843 is a
second printing consulted before a page is opened; this is a second reading of the
same pages, made independently of the first out of the same text layer, and its
disagreements with the first are the sharpest error detector this corpus has: at
the 45 loci where the two once differed sat every one of the 38 errors the site was
serving, and at the 54 where they agreed the reading was right 54 times out of 54.
`check-calendar-masses` now derives that comparison on every run; see
`witness_disagreement`.
"""
# One line, unlike the prose above it, because `mass-propers` copies `caution`
# into the browser's witness manifest and a reader is shown it beside the offer.
caution = "The same pre-1955 caution as the printing it transcribes, and one that belongs to this row alone: it is uncorrected. Ten of its readings are contradicted by the 1861 page images, each named in the `disagreement` key of the entry that holds it, and the artifact has not been amended because its bytes are pinned by sha256 in its own artifact record, in 84 passage records and in tracked document prose, so correcting it is a co-ordinated change and not a lane-local one. It is offered rather than served: the collated edition witness above reaches more of the missal and is the default at every proper."
publication_decision = """
Attaching 146 of this witness's readings and suppressing the 10 the page images
contradict was considered and refused. It would make the row a curated blend of
two transcriptions rather than a witness to either, which is the hand-typed
restatement this repository keeps deleting; and the 10 are the evidence that the
detector works, so hiding them would hide the reason for having it. What makes
the refusal safe is the ordering `mass-propers` already applies -- witnesses are
ranked by how much of the missal each reaches, and the collated edition witness
covers 261 entries to this one's 156 -- so the corrected reading is the default
at every proper and this one is an offered alternative under the `caution` above.
"""

[[sources]]
id = "lasance-1945"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
artifact_id = "artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.new-roman-missal-text-80b34759"
label = "The New Roman Missal in Latin and English, revised edition, by F. X. Lasance and Francis Augustine Walsh (New York: Benziger Brothers, 1945), ca. 1955-56 printing (Internet Archive delivery locator fr-lasance-missal-1937; locator mislabelled)"
attests = "editio-typica-1920"
attests_kind = "date-bound"
attests_basis = """
The book names no Latin exemplar on any page opened for this lane. Its own
edition record in this repository states that the Latin it prints in the left
column is the Missale Romanum as revised through Benedict XV, and the pages read
here bear that out negatively rather than positively: the body carries the
pre-1955 Holy Week, the Assumption still has its octave, and no page read here
cites a typical edition or a decree. So the edge is a date bound and nothing
stronger. The base text is the 1945 revision, which falls after the typical
edition of 1920 and before maxima-redemptionis-1955, and editio-typica-1920 is
the state it can be translating.

What that bound settles is the same thing it settles for the two Cummiskey
printings this file already carries: every English word quoted from this book is
PRE-1955 English. It witnesses nothing about the restored Holy Week, and the
nineteen Holy Week rows in `untranslated` are beyond its reach for that reason
and not for want of looking.

The act history does not carry this witness. `check-calendar-masses` binds a
source row to the act history only where both files hold the same id, so this
row states its edge on its own account. If the act history later takes the book
up, the two must be held to agree, as the Cummiskey rows already are.

ONE THING THE HELD ARTIFACT IS NOT. The scanned printing is of about 1955-56,
not of 1945, and it carries matter added after 1945. Which matter, and what
follows for the entries below, is set out in the lane report under "the lettered
pages". Five readings formerly quoted from pages numbered 1302a to 1302d were
quarantined on 2026-08-26 because those inserted leaves are not within the
rights basis established for this book. Their text-free targets remain in the
untranslated ledger below.
"""
rights = "public-domain"
rights_jurisdiction = "United States"
rights_basis = "Public domain in the United States by failure to renew, on the affirmative registration-number record established at src/sources/inventories/lasance-new-roman-missal-rights-v1.toml: A 110108, copyright 15 July 1937, renewal window closed 15 July 1965; A 192159, copyright 1 November 1945, renewal window closed 1 November 1973. That holding is the repository's own and is recorded there with its citations, its controls, and what would overturn it; nothing here re-argues it. It does not cover the lettered inserts at printed pages 1298a-1298n or 1302a-1302d. The tracked publication artifact removes both complete page-bounded ranges, and no entry below quotes either."
caution = "A lay hand missal of the 1945 revision, printed about 1955-56, not an approved liturgical translation and never an altar book. Its Holy Week is the pre-1955 rite, its sanctoral is not the 1962 sanctoral, and its second and third orations are not those of 1962. It is carried only where a 1962 formulary is the same prayer, and nothing here may be used for recitation."
role = "Second English witness alongside cummiskey-1861, and independent of it in every way that matters: a different translator, a different publisher, a different century, and a book that keeps feasts and Commons the 1861 printing is older than. Where the two witnesses cover the same slot the 1861 entry stands and this one is not added; every entry below is for a slot that had no English at all."

[[sources]]
id = "caswall-1849"
source_id = "edition.edward-caswall.lyra-catholica.london-1849"
artifact_id = "artifact.edward-caswall.lyra-catholica.london-1849.missal-sequences-en"
label = "Lyra Catholica: containing all the Breviary and Missal hymns, with others from various sources, translated by Edward Caswall (London: James Burns, 1849)"
attests = "si-quid-est-1634"
attests_kind = "date-bound"
attests_basis = '''
THIS IS NOT A MISSAL AND WITNESSES NO PRINTING OF ONE. It is a verse translation
of the hymns and sequences of the Roman Breviary and Missal, published at London
in 1849 with no imprimatur, no approbation and no decree in the front matter read
here. It names no Latin exemplar and it prints no Latin beside the English, so it
cannot say which book was on the translator's desk, and its English never had and
does not now have any liturgical standing.

The edge therefore rests on the date alone, which is the weakest kind and is
labelled as such, on the same footing as roman-missal-laity-1806, cummiskey-1843
and cummiskey-1861 in roman-holy-week-acts-v1.toml. 1849 falls after Urban VIII's
revision of 1634 and before Divino afflatu of 1911, so the state of the Roman
books it can be translating is the one si-quid-est-1634 left. It is drawn only
because a date bound is a real bound.

WHAT THE DATE BOUND IS WORTH FOR THESE FIVE TEXTS, and it is worth more here than
it would be for an oration: no act between 1634 and 1962 altered the words of
Victimae paschali laudes, Veni Sancte Spiritus, Lauda Sion Salvatorem or Dies
irae, and the Stabat Mater was appointed as a sequence in 1727, more than a
century before this book. The strophe-for-strophe correspondence against the
Latin this repository carries was counted for each of the five and is recorded in
the transcription artifact. So the recension question that governs the 1861
witness's Holy Week does not arise for this material -- which is a statement
about these five texts and must not be generalised to anything else in this book.
'''
rights = "public-domain"
rights_jurisdiction = "United States"
rights_basis = '''
Published at London in 1849, so out of United States copyright on the pre-1931
line, AS DERIVED FOR CALENDAR YEAR 2026 and not as a standing rule: on 1 January
2027 the line becomes before 1932 and a later reader must re-derive it rather
than quote this sentence. This is a foreign publication, so the term cannot be
followed to its end from a domestic registration; the age line is the whole of
the case and is stated as such. Restoration under 17 U.S.C. 104A reaches only
works still protected in the source country on 1 January 1996, and United Kingdom
protection for Edward Caswall, who died in 1878, ended in 1948, so nothing was
restored. The basis is a United States one and a reader elsewhere must establish
the position in their own jurisdiction.

That covers the 1849 book's own English, which is what this file carries. The
`artifact_id` names a project transcription made from the item's page images and
holding nothing but that English; the item's OCR text layer is registered
separately, was used as a finding aid only, and supplied no word recorded here.
NOT RELIED ON: that the Internet Archive item is available, that the download
succeeded, or that the item carries a Public Domain Mark 1.0 licence URL, which
it does.
'''
caution = '''
A LITERARY TRANSLATION, CHOSEN AS A VOICE. Caswall, Neale, Aylward and Bute
differ materially over these five texts, and guidance/propers-for-agents.md
reserves the choice among them to the maintainer. This row records that the
maintainer named Caswall; it does not argue that Caswall is right.

The English is metrical verse and is not a clause-for-clause rendering. Where the
Latin sets a short strophe Caswall may fold two into one six-line stanza, and the
stanza divisions in the text recorded here are his and not the Missal's. He
renders no Amen and no Alleluia anywhere: every one of these five propers ends in
the Latin with an acclamation that the English simply does not have.
'''

[[sources]]
id = "hymns-ancient-and-modern-1890"
source_id = "edition.hymns-ancient-and-modern-proprietors.hymns-ancient-and-modern.london-complete-edition-1890"
artifact_id = "artifact.hymns-ancient-and-modern-proprietors.hymns-ancient-and-modern.london-complete-edition-1890.dies-irae-irons-en"
label = "Hymns Ancient and Modern, Complete Edition with accompanying tunes (London: printed for the proprietors by William Clowes and Sons), hymn 398, W. J. Irons's English of the Dies irae"
attests = "unestablished"
attests_kind = "date-bound"
attests_basis = '''
AN ANGLICAN HYMN BOOK AND NO WITNESS TO A ROMAN PRINTING AT ALL. It is carried
for one text, hymn 398, and that text is a literary translation with no
liturgical standing in the Roman rite. Where the companion volume of 1889 prints
the Latin this hymn is set against, the Latin is a SARUM recension -- its first
strophe reads `Crucis expandens vexilla` where the Roman books read `Teste David
cum Sibylla` -- so the compilers were not even working from the Roman text at
that point. `attests` is written `unestablished` because no act of the Roman
books stands behind this printing in any degree; the kind is recorded as
`date-bound` because the only bound this witness offers is that it is a
nineteenth-century printing, and the vocabulary admits no weaker word.
'''
rights = "public-domain"
rights_jurisdiction = "United States"
rights_basis = '''
The text is W. J. Irons's English of the Dies irae, dated 1853 by the 1889
Historical Companion, by an author who died in 1883, printed here in a
nineteenth-century London imprint catalogued 1890 and undated on its own title
leaf. It is out of United States copyright on the pre-1931 line as derived for
calendar year 2026; 17 U.S.C. 104A restoration is unavailable because United
Kingdom protection expired in 1953. The proprietors' copyright notice printed at
p. iv of the book was read on the page image and is quoted in the edition record;
it is a live claim of its own day over a compilation now long past publication.
NOT RELIED ON: availability, successful download, or any host mark.
'''
caution = '''
THIS IS HYMNS ANCIENT AND MODERN'S TEXT OF IRONS AND NOT DEMONSTRABLY IRONS'S
OWN. That book's compilers are widely said to have altered what they received;
this lane established no instance of alteration in this hymn and ran no collation
against a printing of Irons's own, because none was located. The claim that this
is Irons's translation rests on the 1889 Historical Companion's attribution, read
on its page image; the claim that it is UNALTERED rests on nothing and is not
made.

Most of the hymn is set under vocal score in this printing, so 22 of its 58 lines
were read syllable by syllable from under the staves. That is the weakest point
of the transcription.
'''

