collation_result = "recorded from the page; this proper had been filed as untranslated, and it was not"
witness_note = "The book prints this oration under its own SECRET heading, but across a page break: p. 273 ends `SECRET.--We beseech thee, O holy Lord, Al-` as its last line and p. 274 opens `mighty Father`. A search that reads one page at a time finds neither half, which is how the earlier pass concluded that no oration answering this proper was in the witness. The oration is here, and the absence was the reader's."

