passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.verify-roman-1962-most-holy-name-of-jesus--main--secret--all--1"
publication_artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.roman-1962-recovered-en"
publication_artifact_sha256 = "c61752839c8b04282bac27592749d63a4f0227d3fa051e62418f609c562eb54a"
publication_passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.publish-roman-1962-most-holy-name-of-jesus--main--secret--all--1"
collated = "page-image and tracked transcription, 2026-08-27"
collation_result = "confirmed"
witness_note = "Leaf n106, printed p. 96, running head `THE FEAST OF, &c.` The page sets no Latin cue before this Secret, and sets a second `SECRET of the Sunday` after it; the one recorded here is the first, the Mass's own. The conclusion is printed `Thro' the same.` Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "May thy blessing, O most merciful God, by which every creature is enlivened and subsists, sanctify this our sacrifice, which we offer thee in honour of the name of thy Son, our Lord Jesus Christ: that it may be acceptable to the praise of thy majesty, and available to our salvation. Thro' the same."

[[entries]]
mass = "most-holy-name-of-jesus"
form_id = "main"
proper = "Postcommunion"
cycle = "all"
occurrence = 1
incipit = "Omnipotens aeterne Deus"
witness = "cummiskey-1861"
printed_page = "96-97"
ia_leaf = 104
ia_leaf_range = [104, 105]
artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-scan-pdf"
passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.verify-roman-1962-most-holy-name-of-jesus--main--postcommunion--all--1"
publication_artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.roman-1962-recovered-en"
publication_artifact_sha256 = "c61752839c8b04282bac27592749d63a4f0227d3fa051e62418f609c562eb54a"
publication_passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.publish-roman-1962-most-holy-name-of-jesus--main--postcommunion--all--1"
collated = "page-image and tracked transcription, 2026-08-27"
collation_result = "confirmed"
witness_note = "Latin cue `Omnipotens`, answering the 1962's `Omnipotens aeterne Deus`. The page spells `honor` here and `honour` in the Secret above it; both are left as printed. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O almighty and eternal God, who didst both create and redeem us, mercifully hear our prayers, and vouchsafe, with a pleasing and kind countenance, to receive the sacrifice of this victim of our salvation, which we have offered to thy divine majesty, in honor of the name of thy Son, our Lord Jesus Christ; that thy grace being poured on us, thro' the glorious name of Jesus, as a pledge of our eternal predestination, we may rejoice that our names are written in heaven. Thro' the same."

