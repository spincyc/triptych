[[entries]]
mass = "good-friday"
form = ""
proper = "Improperia"
incipit = "Popule meus, quid feci tibi?"
witness = "cummiskey-1861"
printed_page = "292-294"
ia_leaf = 300
collated = "page-image, 2026-08-19"
collation_result = "read"
latin_identity_leaf = "1862 Pustet leaves n259-n260, printed pp. 174-175"
harvest_note = "This is the slot the sixth pass refused for want of Latin to prove the alignment against, and the 1862 supplies it: pp. 174-175 print every versicle of the Improperia in the order the 1962 index carries them, `Popule meus` through `Ego te exaltavi magna virtute`, with the Greek-and-Latin Trisagion between the first three. The 1861 gives Latin for the first two versicles and the Trisagion only, and English for the whole; read against the 1862 the English answers the 1962 Latin versicle for versicle. Transcribed from leaves n300 (p. 292), n301 (p. 293) and n302 (p. 294). The book's choral rubrics (`Two of I. Choir`, `The whole Choir`) are dropped and the refrain is written out once as `My people, &c.` exactly as the book abbreviates it."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
V. My people, what have I done to thee? Or in what have I grieved thee? Answer me.

V. Because I brought thee out of the land of Egypt; thou hast prepared a cross for thy Saviour.

Agios Theos. Sanctus Deus. O holy God. Agios Ischyros. Sanctus Fortis. O Most Holy One. Agios Athanatos eleison imas. Sanctus immortalis, miserere nobis. O Holy Immortal One, have mercy on us.

V. Because I was thy guide through the desert for forty years, and fed thee with manna, and brought thee into an excellent land, thou hast prepared a cross for thy Saviour.

V. What more should I have done to thee, and have not done? I have planted thee for my most beautiful vineyard: and thou hast proved very bitter to me, for in my thirst thou givest me vinegar to drink; and piercedst the side of thy Saviour with a spear.

V. For thy sake I scourged Egypt with her first-born; and thou hast delivered me up to be scourged. My people, what have I done to thee? or in what have I grieved thee? Answer me.

V. I led thee out of Egypt, having drowned Pharaoh in the Red Sea; and thou hast delivered me up to the chief priests. My people, &c.

V. I opened the sea before thee; and thou hast opened my side with a spear. My people, &c.

V. I went before thee in a pillar of cloud; and thou hast brought me to the court of Pilate. My people, &c.

V. I fed thee with manna in the desert; and thou hast beaten me with buffets and stripes. My people, &c.

V. I gave thee wholesome water to drink out of the rock, and thou hast given me for my drink gall and vinegar. My people, &c.

V. For thy sake I smote the king of Canaan; and thou hast smote my head with a cane. My people, &c.

V. I gave thee a royal sceptre; and thou hast given me a crown of thorns. My people, &c.

V. By great might I raised thee on high; and thou hast hanged me on the gibbet of the cross. My people, &c.
"""

[[entries]]
