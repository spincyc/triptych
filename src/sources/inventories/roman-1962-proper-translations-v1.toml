witness_note = "Read on the 1861 page image at printed p. 657 = leaf n665, day heading `IX. COMMEM. of St.--GORGONIUS, m.` (the page sets a rule between `St.` and the name), Latin cue `Sanctus.`, matching the 1962 incipit. The witness prints the commemoration's three orations and nothing else for the day, as the 1962 rank Comm. expects."

[[entries.translations]]
lang = "en"
