witness_note = "Read on the 1861 page image at printed p. 659 = leaf n667, under `XV. OCTAVE of the NATIVITY of B. M. V. ... with the following Commem. of St. Nicomedes`, Latin cue `Adesto.`, matching the 1962 incipit. The scan's ink at the word `people` is broken and renders like `pecple`; the word is recorded as `people`, the damaged glyph being a defective sort of an ordinary English word and not another word. The construction `for the obtaining thy mercy` is the page's own and is kept."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Be merciful, O Lord, to thy people, that being improved by the singular virtues of blessed Nicomedes thy martyr, they may have the continual assistance of his prayers, for the obtaining thy mercy. Thro'.
"""

[[entries]]
mass = "s-thomae-villanova-episcopi-confessoris"
form = ""
