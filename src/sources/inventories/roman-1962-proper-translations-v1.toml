Bless, + O Lord, we beseech thee, these branches of the palm-tree, or olive-tree; and grant that what thy people this day act corporally for thy honour, they may perform the same spiritually with the greatest devotion, by gaining a victory over their enemy, and ardently loving mercy. Thro'. R. Amen
"""

