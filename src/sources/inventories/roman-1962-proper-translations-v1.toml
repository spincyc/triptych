note = "the witness keeps the commemoration in its Kalendar and prints no text for it anywhere. Its Kalendar at p. 777, leaf n785, reads `5 S. Birinus, c. bp. d. Com. of S. Salbas, ab.   Mass x.   482` -- `Salbas` for Sabbas, the `l` a scan artefact of a long s or a broken b -- and the page it names, 482, is the Common of a Confessor Bishop, which is St Birinus's Mass, not the commemoration's. The sanctoral itself has no 5 December entry at all: leaf n534 (printed p. 526, running head `3d AND 4th DECEMBER.`) ends with `IV. St. PETER CHRYSOLOGUS, c.`, and leaf n535 (printed p. 527, running head `6th DECEMBER.`) finishes that day's Collect, adds `COLLECT, in commemoration of St. Barbara`, and then passes straight to `VI. St. NICHOLAS, bp. c.`. Nothing stands between 4 and 6 December. The Collect the commemoration would take is the Common of Abbots at printed p. 491, which this file already records at commune-abbatum and which reads `May the intercession, O Lord, of the blessed Abbot N, recommend us to thee ...` -- `N`, with no saint's name. That is the same prayer the 1962 sets here with `Sabbae` written in, so as at the Mennas row above, an English for this slot would have to be composed by writing a name the witness does not print"

