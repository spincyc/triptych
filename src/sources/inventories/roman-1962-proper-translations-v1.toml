witness = "cummiskey-1861"
printed_page = "584"
ia_leaf = 592
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at XVII. St. PASCHAL BAYLON., under the running head 14th, 16th, 17th, and 18th May, p. 584 = leaf n592. Directive `All as in Mass XIII. p. 488, except`; cue `Deus, qui.` answers the 1962 incipit. The 1962 Latin ends Qui vivis (the prayer addresses Christ, `thy body and blood`); the witness prints the conclusion as `Thro'.` and it is recorded as printed."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst adorn blessed Paschal, thy confessor, with an admirable love of the sacred mysteries of thy body and blood: grant, we beseech thee, that we may be made worthy partakers of the same spiritual nourishment which he so abundantly received from this divine banquet. Thro'.
"""

