note = "the witness keeps the commemoration and prints no proper Collect for it, only a pointer into its Common. Leaf n699, printed p. 691, running head `10th AND 12th NOVEMBER.`, ends its 11 November entry (`XI. St. MARTIN, bp. c.`) with the line `Commem. of St. Mennas, by the Collect, Secret and P. Comm. of Mass III. p. 466.` and prints no text for him. Its Kalendar at p. 776, leaf n784, says the same: `11 S. Martin, c. bp. d. Com. of S. Menna, m. 691`. Mass III was then opened: leaf n474, printed p. 466, heading `MASS III. In virtute, of a MARTYR not a BISHOP`, prints `COLLECT. Praesta.-Grant, we beseech thee, O Almighty God, that we, who celebrate the festival of blessed N. thy Martyr, may, by his intercession, be strengthened in the love of thy name.` -- with `N.` and no saint's name, and with no conclusion. That is the same prayer the 1962 sets here with `Mennae` written in, and this file already records it at commune-unius-martyris-3 (printed_page 466, collated 2026-08-01). The English for THIS slot would therefore have to be made by writing a name the witness does not print, which is the ground already taken at the three `s-hilarii` rows. The row this would become is reversible from leaf n474 alone if that ground is ever relaxed"

