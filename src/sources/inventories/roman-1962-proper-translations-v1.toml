ia_text_layer_line = 33762

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we who celebrate the festival of blessed Catharine, thy Virgin, may rejoice in her yearly solemnity, and profit by the example in her eminent virtues. Thro'.
"""

[[entries]]
mass = "s-catharinae-senensis-virginis"
form = ""
proper = "Secret"
incipit = "Ascendant ad te, Domine"
witness = "cummiskey-1861"
detector = "second-printing-partly-agrees"
second_printing_coverage = 0.8571
harvest_note = "Printed under `SECRET.` in the same Mass, answering Ascendant ad te, Domine, quas in beatae Catharinae solemnitate offerimus, preces, et hostia salutaris, virgineo fragrans odore. BOTH SCANS ARE DAMAGED AT ONE WORD: the 1861 renders it `freaght` and the 1843 `hi ght`, where the sense of virgineo fragrans odore and the shape of the 1861's letters give `fraught`. That word is a reading of two damaged scans and not a collation; it is the only word in this row that has not been seen intact in either printing."
ia_text_layer_line = 33769

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
May the prayers we offer on the festival of blessed Catharine ascend to thee, O Lord, together with the victim of our salvation, fraught with heavenly sweetness. Thro'.
"""

