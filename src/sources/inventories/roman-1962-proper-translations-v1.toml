witness_note = "Harvested from the witness's Common of Saints on 2026-08-01. The 1962 Mass and the 1861 Mass are joined by the Introit both books print at the head of the Mass -- the VOTIVE MASSES of the B. V. MARY, from Candlemas to Advent, p. 507 -- and this oration to that Mass's by the abbreviated Latin cue the 1861 sets before its English, which is the two books' own alignment rather than a reader's judgement. Read out of the text layer of Internet Archive item romanmissaltran00churgoog, compared against the text layer of item romanmissaltran00englgoog, the 1843 Philadelphia printing of the same translation at the same page numbers, and read on the 1861 page image wherever the two scans did not agree. The 1962 Missal prints this prayer twice, at no. 4488 and here, differing only in how far it sets out the conclusion; the witness's English renders the conclusion as its own abbreviated cue and does not track that difference, so the one English answers both settings and is recorded at both."

