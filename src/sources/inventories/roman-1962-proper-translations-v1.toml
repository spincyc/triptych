[[entries]]
mass = "most-holy-name-of-jesus"
form_id = "main"
proper = "Collect"
cycle = "all"
occurrence = 1
incipit = "Deus, qui Unigenitum"
witness = "cummiskey-1861"
printed_page = "95"
ia_leaf = 103
ia_leaf_range = [103, 103]
artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-scan-pdf"
passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.verify-roman-1962-most-holy-name-of-jesus--main--collect--all--1"
publication_artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.roman-1962-recovered-en"
publication_artifact_sha256 = "c61752839c8b04282bac27592749d63a4f0227d3fa051e62418f609c562eb54a"
publication_passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.publish-roman-1962-most-holy-name-of-jesus--main--collect--all--1"
collated = "page-image and tracked transcription, 2026-08-27"
collation_result = "confirmed"
witness_note = "The 1861 keeps this feast on the Second Sunday after Epiphany, not on the Sunday between 2 and 5 January as the 1962 does. Leaf n104, printed p. 94, heads it `II. SUNDAY after EPIPHANY. The FEAST of the HOLY NAME JESUS.` over the Introit `In nomine Jesu`, and its Kalendar at leaf n774, printed p. 766, prints `Second Sunday after Epiphany- Feast of the most Holy Name of Jesus, d. of II. class 94`. The formulary is the same one, and the Latin cue set before this English is `Deus qui`, which answers the 1962's `Deus, qui Unigenitum`. The day placement is a recension difference and not a difference of text. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O God, who didst appoint thy only begotten Son the Saviour of mankind, and commandest that his name should be called JESUS: mercifully grant, that we who venerate his holy name on earth, may also enjoy his sight in heaven. Thro'."

[[entries]]
mass = "most-holy-name-of-jesus"
form_id = "main"
proper = "Secret"
