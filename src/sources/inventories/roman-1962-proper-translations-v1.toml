witness_note = "The pre-1955 ELEVENTH prophecy (Deuteronomy 31, with the tract Attende coelum) is the 1962's FOURTH. The 1862 at p. 198 prints `Deus, celsitudo humilium, et fortitudo rectorum ... quod denuntiatum est in ultionem, transeat in salutem. Per Dominum etc.`, the 1962 index word for word. The 1861 prints the English under the cue `Deus celsitudo.` after the same prophecy and tract. Filed under the 1962's numbering. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O God, who, raisest the humble, and givest strength to the righteous: and who by thy holy servant Moses, wast pleased so to instruct thy people by the singing of the sacred canticle, that the repetition of the law might be also our direction: shew thy power to all the multitude of Gentiles justified by thee, and, by mitigating thy terrors, grant them joy: that all their sins being pardoned by thee, the threatened vengeance may contribute to their salvation. Thro'. R. Amen."

[[entries]]
mass = "easter-vigil"
form_id = "main"
proper = "Blessing of the Baptismal Water"
cycle = "all"
occurrence = 1
incipit = "Omnipotens sempiterne Deus, adesto magnae pietatis tuae mysteriis"
witness = "cummiskey-1861"
printed_page = "323-327"
ia_leaf = 331
ia_leaf_range = [331, 335]
artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-scan-pdf"
passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.verify-roman-1962-easter-vigil--main--blessing-of-the-baptismal-water--all--1"
publication_artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.roman-1962-recovered-en"
publication_artifact_sha256 = "c61752839c8b04282bac27592749d63a4f0227d3fa051e62418f609c562eb54a"
publication_passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.publish-roman-1962-easter-vigil--main--blessing-of-the-baptismal-water--all--1"
collated = "page-image and tracked transcription, 2026-08-27"
collation_result = "confirmed"
witness_note = "The longest of the fourteen and the one that took five leaves to read: n331 (p. 323), n332 (p. 324), n333 (p. 325), n334 (p. 326), n335 (p. 327). The 1862 at p. 201 prints the opening prayer `Omnipotens sempiterne Deus, adesto magnae pietatis tuae mysteriis, adesto sacramentis ...` under the heading Benedictio Fontis, word for word as the 1962 index carries it, and continues into the preface `Vere dignum et justum est ...` The 1861's English runs from that prayer through the preface, the exorcism, the blessing of the creature of water, the sinking of the paschal candle and the three oil-and-chrism formulas, in the 1962 index's order and with no clause of the index unanswered. The book's ceremonial rubrics are given in square brackets so they can be stripped; they are the book's own italic directions and not part of the prayer. TWO PRINTER'S ERRORS ARE REPRODUCED, NOT MENDED: `the word by fire` for `et saeculum per ignem` (the type reads `word`, the sense is `world`), and the run-on `Thro'--who is to come`. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O Almighty and eternal God, be present at these mysteries, be present at these sacraments of thy great goodness: and send forth the spirit of thy adoption to regenerate the new people, whom the font of baptism bringeth forth: that what is to be done by the ministry of us thy servants, may be accomplished by the effect of thy power. Thro'. R. Amen. It is truly meet and just, right and available to salvation, to give thee thanks always, and in all places, O holy Lord, almighty Father, and eternal God: who, by thy invisible power, dost wonderfully produce the effects of thy sacraments: and, though we are unworthy to administer such great mysteries, yet, as thou dost not abandon the gifts of thy grace, so thou inclinest the ears of thy goodness even to our prayers. O God, whose spirit in the very beginning of the world moved upon the waters; that even then the nature of water might receive the virtue of sanctification: O God, who by water didst wash away the crimes of a guilty world, and by the overflowing of the deluge didst give us a figure of regeneration; that one and the same element might, in a mystery, be the end of vice, and the origin of virtue: look down, O Lord, on thy Church, and multiply in her thy regenerations, who by the streams of thy abundant grace, fillest thy city with joy, and openest the fonts of baptism all over the world for the renewal of the Gentiles; that by the command of thy majesty it may receive the grace of thy Son from the Holy Ghost. Who, by a secret mixture of his divine virtue, may render this water fruitful for the regeneration of men: to the end that those, who are to be sanctified in the immaculate womb of this divine font, and are to be born again new creatures, may come forth a heavenly offspring; and that all, however, distinguished by age in time, or sex in body, may be brought forth to the same infancy by grace, their spiritual mother. Therefore may all unclean spirits, by thy command, O Lord, depart from hence; may all the malice of diabolical wiles be entirely banished; may no power of the enemy prevail here; let him not fly about to lay his snares: let him not creep in by his secret artifices; let him not corrupt with his infection. May this holy and innocent creature be free from all assaults of the enemy, and purified by the destruction of all his malice. May it become a living fountain, a regenerating water, a purifying stream: that all those, that are to be washed in this saving bath, may obtain, by the efficacy of the Holy Ghost, the grace of a perfect purification. Wherefore I bless thee, O creature of water, by the living + God, by the true + God, by the holy + God; by that God, who in the beginning separated thee by his word from the dry land, and whose spirit moved upon thee. Who made thee flow from the fountain of paradise, and commanded thee to water the whole earth with thy four rivers. Who changing thy bitterness in the desert into sweetness, made thee fit to drink; and produced thee out of a rock to quench the thirst of the people. I + bless thee also by our Lord Jesus Christ, his only Son: who, in Cana of Galilee, changed thee into wine, by a wonderful miracle of his power. Who walked upon thee dry-foot, and was baptized in thee by John in the Jordan. Who made thee flow out of his side, together with his blood, and commanded his disciples that such as believed should be baptized in thee, saying: Go, teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost. Do thou, O Almighty God, mercifully assist us who observe this commandment: do thou graciously inspire us. Do thou with thy mouth bless these clear waters; that besides their natural virtue of cleansing the body, they may also prove effectual for purifying the soul. May the virtue of the Holy Ghost descend into all the water of this font. And make the whole substance of this water fruitful, and capable of bringing to a new life. Here may the stains of all sin be washed out; here may human nature, created to thy image, and reformed to the honour of its author, be cleansed from the filth of the old man: that all who receive this sacrament of regeneration, may be born again new children of true innocence. Thro'--who is to come to judge the living and the dead, and the word by fire. R. Amen. May this font be sanctified and made fruitful by the oil of salvation for such as are to be born anew in it, unto life everlasting. R. Amen. May this infusion of the chrism of our Lord Jesus Christ, and of the Holy Ghost the Comforter, be performed in the name of the Holy Trinity. R. Amen. May this mixture of the chrism of sanctification, and of the oil of salvation, and of the water of baptism, be performed in the name of the Father, and of the Son, and of the Holy Ghost. R. Amen."

