rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who by thy only Son, the chief corner-stone of thy Church, hast bestowed on the faithful the fire of thy divine love: bless + this new fire produced from a flint for our use: and grant that during this paschal solemnity. we may be so inflamed with heavenly desires, that with purity of mind, we may come to those festivals, where we may enjoy a light which will never end. Thro' the same. R. Amen.
