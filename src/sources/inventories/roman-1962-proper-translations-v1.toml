collation_result = "recorded from the page"
witness_note = "The 1962 Missal prints this formulary at printed p. 40 under the heading MISSA DOMINICAE PRIMAE post Epiphaniam, for the ferias of that week, because the Holy Family occupies the Sunday. The 1861 witness is older than the Holy Family and simply prints it as I. SUNDAY after EPIPHANY at its pp. 92-94, so the day the witness heads is not the day the 1962 books keep, but the formulary is the same one and its orations are read from there."

