The roman-1962 calendar appoints 269 distinct orations once every `takes_from`
is resolved, so 242 served leaves 27 without English, and all 27 carry an
`untranslated` row saying why. Nothing in that calendar's oration slots is
unaccounted for: there is no longer a proper that has neither English nor a
recorded reason for having none. **No oration in this file is a project-created
translation, and the count is still zero.**

**The witness's Common of Saints was harvested whole on 2026-08-01**, and it
answers 77 of the 95 orations the 1962 Commune Sanctorum prints. What the
harvest measured, rather than assumed, is where it does not reach. The 1861 book
has no Common of Summorum Pontifices at all -- that Common is later than the
