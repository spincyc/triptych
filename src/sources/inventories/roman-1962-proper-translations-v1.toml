**Eleven entries and one `untranslated` row removed, 2026-07-31.** They were
the four resumed Sundays after the Epiphany, which held the same three
orations this file already carried under `epiphany-3` through `epiphany-6`.
They were duplicates of the worst kind - the same English recorded twice
