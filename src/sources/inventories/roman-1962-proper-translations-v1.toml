text = """
O God, the bestower of all good gifts, who in thy servant Bibiana joinedst the palm of martyrdom with the flower of virginity, grant, that through her intercession, our hearts may be united to thee by charity; and that being delivered from all dangers, we may obtain everlasting rewards. Thro'.
"""

