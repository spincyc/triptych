witness = "cummiskey-1861"
printed_page = "698"
ia_leaf = 706
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on leaf n706, printed p. 698, running head `24th AND 25th NOVEMBER.`. Day heading verified: `XXIV. St. JOHN of the CROSS. c.` above `All as in Mass XIII. p. 488, except`; the whole oration stands at the head of this page. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui sanctum Joannem Confessorem tuum`. Date agrees: 24 November in both books; Kalendar p. 776 (leaf n784) `24 S. John of the Cross, c. d. Com. of S. Chrysogonus, m. 698`. RECENSION NOTE: the 1962 keeps him as a Doctor of the Church and sends the Mass to commune-doctorum-pontificis; this 1861 witness, printing before the 1926 doctorate, keeps him as a Confessor and sends the Mass to its Mass XIII (a Confessor not a Bishop). The Collect wording is unaffected -- neither text names him a Doctor -- but the surrounding formulary in this witness is NOT the 1962's."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst inspire blessed John, thy confessor, with an ardent love of self-denial and of the cross: grant, we may so follow his example, as to obtain eternal glory. Thro'.
"""

[[entries]]
mass = "comm-s-chrysogoni-martyris"
form = ""
proper = "Collect"
incipit = "Adesto, Domine, supplicationibus"
witness = "cummiskey-1861"
printed_page = "698"
ia_leaf = 706
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on leaf n706, printed p. 698, running head `24th AND 25th NOVEMBER.`. The witness prints this commemoration under the 24 November heading `XXIV. St. JOHN of the CROSS. c.`, as `Of St. CHRYSOGONUS. Adesto.` immediately after that day's own Collect, with a Secret and a P. Comm. `Of the same` below it. The Latin cue `Adesto` answers the 1962 incipit `Adesto, Domine, supplicationibus nostris`. Kalendar p. 776 (leaf n784) confirms the join. Date agrees: 24 November in both books. PUNCTUATION AS PRINTED, FLAGGED: the page reads `Give ear, O God. to our prayers` -- a full stop, not a comma, after `God`. The mark was examined at 4x magnification on the page image and it has no comma tail, unlike `ear,` two words earlier on the same line. It is reproduced here unmended. This is exactly the class the file's `corrections` block already handles (`a full stop falling inside a clause was removed`); the integrator, not this lane, should decide whether to apply that standing rule."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Give ear, O God. to our prayers, that we, who in all humility acknowledge the guilt of our offences, may, by the prayers of blessed Chrysogonus, thy martyr, be delivered from the burden of our sins. Thro'.
"""

[[entries]]
mass = "s-catharinae-virginis-martyris"
form = ""
proper = "Collect"
incipit = "Deus, qui dedisti legem Moysi"
witness = "cummiskey-1861"
printed_page = "698"
ia_leaf = 706
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on leaf n706, printed p. 698, running head `24th AND 25th NOVEMBER.`. Day heading verified: `XXV. St. CATHARINE, v. m.` above `All as in Mass XVI. p. 493, except`; the oration is the last thing on the page and the page ends there. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui dedisti legem Moysi in summitate montis Sinai`. Date agrees: 25 November in both books; Kalendar p. 776 (leaf n784) `25 S. Catharine, v. m. d. 698`. TERMINAL PUNCTUATION FLAGGED: the word `Christ` sits at the right margin and its last letters are blotted with ink in this scan, so whether a full stop follows it could not be read even at 4x. A full stop is written here because the line ends and `Who liveth.` begins the next line, which is the same layout this witness uses at Hedwiges (`by embracing thy cross. Who livest.`, p. 677); that is an inference from the book's habit and NOT a reading, and the integrator may prefer to drop it. Nothing else on this oration is uncertain. The witness prints no conclusion beyond `Who liveth.`, answering the 1962's `Qui vivis`."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who gavest the law to Moses on Mount Sinai, and didst wonderfully translate the body of blessed Catharine, thy virgin and martyr thither, by the ministry of holy angels: mercifully grant, by her merits and prayers, that we may safely come to the mount which is Christ. Who liveth.
"""

[[entries]]
mass = "comm-s-saturnini-martyris"
