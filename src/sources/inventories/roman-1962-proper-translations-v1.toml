[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we who celebrate the festival of blessed Boniface, thy martyr, may, by his prayers, find the effects of thy divine assistance. Thro'.
"""

[[entries]]
mass = "s-ubaldi-episcopi-confessoris"
form = ""
proper = "Collect"
