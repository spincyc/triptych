source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
I am the Saviour of my people, saith the Lord: in whatever distress they call on me, I will hear them: and will be their Lord for ever. Ps. Attend, O my people, to my law, incline your ears to the words of my mouth. V. Glory.
"""

