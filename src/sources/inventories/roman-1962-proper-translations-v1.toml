witness_note = "First entry in this file for this mass. The calendar's Latin for the three orations landed on 2026-08-01 off the 1962 CMAA facsimile; until then there was no Latin here for an English to answer, and this file carried neither an entry nor an `untranslated` row for the formulary -- a hole in its own ledger rather than a decision, which is what the `second_witness` block recorded when it registered the sibling transcription and found three of its rows with nothing to attach to. The hole is closed the way this file closes them, by opening the page. The witness prints the Mass at CORPUS CHRISTI, printed p. 395 = leaf n403, and sets the Latin cue `Deus, qui.` before the English, which with the running head is the alignment argument for this oration; the 1962 Latin is Deus, qui nobis sub Sacramento mirabili. Read at 200 dpi and again at 400 dpi. What the book prints around these three prayers is not 1962 and is not carried: its Corpus Christi has the Octave that 1962 abolished, and the rubric under its Secret directs the Preface Quia per Incarnati on the day and through the Octave. The three orations themselves are the same three prayers, which is the only ground on which a pre-1955 hand missal's English is attached here at all; see the `caution` on the source row."

