witness_note = "This file recorded all three orations of this Sunday as untranslated, on the ground that the block the book prints for it could not be identified in the text layer. The block is there and is not hard to see once the witness's calendar is allowed for. The 1861 printing gives the Second Sunday after the Epiphany to the Feast of the Holy Name of Jesus, so the Sunday's own orations stand inside that Mass as commemorations, each headed `of the Sunday` -- COLLECT of the Sunday at p. 95, SECRET of the Sunday at p. 96, P. COMM. of the Sunday at p. 97. A matcher looking for a heading naming the Sunday finds a feast instead and reports the Sunday absent."
disagreement = "the artifact drops the comma this file prints in `supreme Ruler, both of heaven and earth`. This locus was outside the 2026-07-31 comparison of the two transcriptions, because this file then carried no entry for `epiphany-2` at all; the wording here was read off the page image on 2026-08-01 and the artifact has never been collated at it. The page settles it for this file, and this is the divergence the hand comparison could not have found."

