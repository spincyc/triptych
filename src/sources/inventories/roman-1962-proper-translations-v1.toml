collation_result = "recorded from the page"
witness_note = "The witness sets this prayer twice, and not identically. At p. 94, under the First Sunday after the Epiphany, it reads `always enliven and defend us`; at p. 110, under Sexagesima, `always enliven us and defend us`. This entry takes the p. 94 setting because that is where the witness prints the formulary this mass carries; the sexagesima entry takes the p. 110 setting for the same reason. Neither is a copy of the other and the difference is the book's own."

