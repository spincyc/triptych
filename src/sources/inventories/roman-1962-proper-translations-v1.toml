[[entries]]
mass = "easter-vigil"
form = ""
proper = "Blessing of the Baptismal Water"
incipit = "Omnipotens sempiterne Deus, adesto magnae pietatis tuae mysteriis"
witness = "cummiskey-1861"
printed_page = "323-327"
ia_leaf = 331
collated = "page-image, 2026-08-19"
collation_result = "read"
latin_identity_leaf = "1862 Pustet leaf n286, printed p. 201 (opening prayer and the head of the preface)"
harvest_note = "The longest of the fourteen and the one that took five leaves to read: n331 (p. 323), n332 (p. 324), n333 (p. 325), n334 (p. 326), n335 (p. 327). The 1862 at p. 201 prints the opening prayer `Omnipotens sempiterne Deus, adesto magnae pietatis tuae mysteriis, adesto sacramentis ...` under the heading Benedictio Fontis, word for word as the 1962 index carries it, and continues into the preface `Vere dignum et justum est ...` The 1861's English runs from that prayer through the preface, the exorcism, the blessing of the creature of water, the sinking of the paschal candle and the three oil-and-chrism formulas, in the 1962 index's order and with no clause of the index unanswered. The book's ceremonial rubrics are given in square brackets so they can be stripped; they are the book's own italic directions and not part of the prayer. TWO PRINTER'S ERRORS ARE REPRODUCED, NOT MENDED: `the word by fire` for `et saeculum per ignem` (the type reads `word`, the sense is `world`), and the run-on `Thro'--who is to come`."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O Almighty and eternal God, be present at these mysteries, be present at these sacraments of thy great goodness: and send forth the spirit of thy adoption to regenerate the new people, whom the font of baptism bringeth forth: that what is to be done by the ministry of us thy servants, may be accomplished by the effect of thy power. Thro'. R. Amen.

V. The Lord be with you. R. And with thy spirit. V. Raise up your hearts on high. R. We have them raised up to the Lord. V. Let us give thanks to the Lord our God. R. It is meet and just.

It is truly meet and just, right and available to salvation, to give thee thanks always, and in all places, O holy Lord, almighty Father, and eternal God: who, by thy invisible power, dost wonderfully produce the effects of thy sacraments: and, though we are unworthy to administer such great mysteries, yet, as thou dost not abandon the gifts of thy grace, so thou inclinest the ears of thy goodness even to our prayers. O God, whose spirit in the very beginning of the world moved upon the waters; that even then the nature of water might receive the virtue of sanctification: O God, who by water didst wash away the crimes of a guilty world, and by the overflowing of the deluge didst give us a figure of regeneration; that one and the same element might, in a mystery, be the end of vice, and the origin of virtue: look down, O Lord, on thy Church, and multiply in her thy regenerations, who by the streams of thy abundant grace, fillest thy city with joy, and openest the fonts of baptism all over the world for the renewal of the Gentiles; that by the command of thy majesty it may receive the grace of thy Son from the Holy Ghost.

[Here the Priest divides the Water in the form of a Cross.]

Who, by a secret mixture of his divine virtue, may render this water fruitful for the regeneration of men: to the end that those, who are to be sanctified in the immaculate womb of this divine font, and are to be born again new creatures, may come forth a heavenly offspring; and that all, however, distinguished by age in time, or sex in body, may be brought forth to the same infancy by grace, their spiritual mother. Therefore may all unclean spirits, by thy command, O Lord, depart from hence; may all the malice of diabolical wiles be entirely banished; may no power of the enemy prevail here; let him not fly about to lay his snares: let him not creep in by his secret artifices; let him not corrupt with his infection.

[Here he touches the Water with his Hand.]

May this holy and innocent creature be free from all assaults of the enemy, and purified by the destruction of all his malice. May it become a living fountain, a regenerating water, a purifying stream: that all those, that are to be washed in this saving bath, may obtain, by the efficacy of the Holy Ghost, the grace of a perfect purification.

[Here he makes the Sign of the Cross thrice over the Font, saying:]

Wherefore I bless thee, O creature of water, by the living + God, by the true + God, by the holy + God; by that God, who in the beginning separated thee by his word from the dry land, and whose spirit moved upon thee.

[Here he divides the Water with his Hand, and throws some of it out towards the four quarters of the World.]

Who made thee flow from the fountain of paradise, and commanded thee to water the whole earth with thy four rivers. Who changing thy bitterness in the desert into sweetness, made thee fit to drink; and produced thee out of a rock to quench the thirst of the people. I + bless thee also by our Lord Jesus Christ, his only Son: who, in Cana of Galilee, changed thee into wine, by a wonderful miracle of his power. Who walked upon thee dry-foot, and was baptized in thee by John in the Jordan. Who made thee flow out of his side, together with his blood, and commanded his disciples that such as believed should be baptized in thee, saying: Go, teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost.

Do thou, O Almighty God, mercifully assist us who observe this commandment: do thou graciously inspire us.

[Here breathing thrice upon the Water in Form of a Cross, he says:]

Do thou with thy mouth bless these clear waters; that besides their natural virtue of cleansing the body, they may also prove effectual for purifying the soul.

[Then he sinks the Paschal Candle into the Water three different times, saying each time:]

May the virtue of the Holy Ghost descend into all the water of this font.

[Then breathing thrice on the Water, he goes on,]

And make the whole substance of this water fruitful, and capable of bringing to a new life.

[Here the Paschal Candle is taken out of the Water, and the Priest goes on,]

Here may the stains of all sin be washed out; here may human nature, created to thy image, and reformed to the honour of its author, be cleansed from the filth of the old man: that all who receive this sacrament of regeneration, may be born again new children of true innocence. Thro'--who is to come to judge the living and the dead, and the word by fire. R. Amen.

[Afterwards the Oil of the Catechumens is poured in, in the Form of a Cross, the Priest saying:]

May this font be sanctified and made fruitful by the oil of salvation for such as are to be born anew in it, unto life everlasting. R. Amen.

[Then he pours the Chrism into it, saying:]

May this infusion of the chrism of our Lord Jesus Christ, and of the Holy Ghost the Comforter, be performed in the name of the Holy Trinity. R. Amen.

[Lastly, he pours the Oil and Chrism into the Water in the Form of a Cross, saying:]

May this mixture of the chrism of sanctification, and of the oil of salvation, and of the water of baptism, be performed in the name of the Father, and of the Son, and of the Holy Ghost. R. Amen.
"""

[[entries]]
mass = "most-holy-name-of-jesus"
form = ""
proper = "Collect"
incipit = "Deus, qui Unigenitum"
witness = "cummiskey-1861"
printed_page = "95"
ia_leaf = 105
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page; the mark the page sets after `JESUS` is a damaged sort read here as a colon"
witness_note = "The 1861 keeps this feast on the Second Sunday after Epiphany, not on the Sunday between 2 and 5 January as the 1962 does. Leaf n104, printed p. 94, heads it `II. SUNDAY after EPIPHANY. The FEAST of the HOLY NAME JESUS.` over the Introit `In nomine Jesu`, and its Kalendar at leaf n774, printed p. 766, prints `Second Sunday after Epiphany- Feast of the most Holy Name of Jesus, d. of II. class 94`. The formulary is the same one, and the Latin cue set before this English is `Deus qui`, which answers the 1962's `Deus, qui Unigenitum`. The day placement is a recension difference and not a difference of text."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst appoint thy only begotten Son the Saviour of mankind, and commandest that his name should be called JESUS: mercifully grant, that we who venerate his holy name on earth, may also enjoy his sight in heaven. Thro'.
"""

[[entries]]
mass = "most-holy-name-of-jesus"
form = ""
proper = "Secret"
incipit = "Benedictio tua, clementissime"
witness = "cummiskey-1861"
printed_page = "96"
ia_leaf = 106
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Leaf n106, printed p. 96, running head `THE FEAST OF, &c.` The page sets no Latin cue before this Secret, and sets a second `SECRET of the Sunday` after it; the one recorded here is the first, the Mass's own. The conclusion is printed `Thro' the same.`"
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
May thy blessing, O most merciful God, by which every creature is enlivened and subsists, sanctify this our sacrifice, which we offer thee in honour of the name of thy Son, our Lord Jesus Christ: that it may be acceptable to the praise of thy majesty, and available to our salvation. Thro' the same.
"""

[[entries]]
mass = "most-holy-name-of-jesus"
form = ""
proper = "Postcommunion"
incipit = "Omnipotens aeterne Deus"
witness = "cummiskey-1861"
printed_page = "96-97"
ia_leaf = 106
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page; the oration runs over the leaf, beginning on leaf n106 (p. 96) and ending on leaf n107 (p. 97)"
witness_note = "Latin cue `Omnipotens`, answering the 1962's `Omnipotens aeterne Deus`. The page spells `honor` here and `honour` in the Secret above it; both are left as printed."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O almighty and eternal God, who didst both create and redeem us, mercifully hear our prayers, and vouchsafe, with a pleasing and kind countenance, to receive the sacrifice of this victim of our salvation, which we have offered to thy divine majesty, in honor of the name of thy Son, our Lord Jesus Christ; that thy grace being poured on us, thro' the glorious name of Jesus, as a pledge of our eternal predestination, we may rejoice that our names are written in heaven. Thro' the same.
"""

[[entries]]
mass = "s-ioannis-matha-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui per sanctum Joannem"
witness = "cummiskey-1861"
printed_page = "557"
ia_leaf = 565
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Leaf n565, printed p. 557, running head `8th AND 10th FEBRUARY`, heading `VIII. St. JOHN of MATHA, c.`, rubric `All as in Mass XIII. p. 488, except`. Latin cue `Deus.`, answering `Deus, qui per sanctum Joannem`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who by Holy John was pleased under thy heavenly directions to institute the Order of the Most Holy Trinity, for the redemption of captives out of the hands of the Saracens: grant, we beseech thee, that by his merits we may be delivered, by thy grace, from all captivity of both body and mind. Thro'.
"""

[[entries]]
mass = "comm-s-pauli-apostoli"
form = ""
proper = "Collect"
incipit = "Deus, qui multitudinem gentium"
witness = "cummiskey-1861"
printed_page = "538"
ia_leaf = 546
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "The 1861 prints one Mass for both Chairs of St Peter. Leaf n546, printed p. 538, heads it `XVIII. St. PETER's CHAIR at ROME, &c.` and rubricates `By omitting the COMM. of St. Prisca +, this Mass serves also for his Chair at Antioch on the 22d February.`, so the 22 February commemoration of St Paul is the `Of St. PAUL` oration printed here. Latin cue `Deus, qui multitudinem.` The Kalendar at leaf n775, printed p. 767, sends 22 February to the same p. 538."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who by the preaching of blessed Paul the Apostle, didst instruct the multitude of the Gentiles: grant, we beseech thee, that whilst we celebrate his memory, we may find the effects of his prayers. Thro'.
"""

[[entries]]
mass = "comm-s-pauli-apostoli"
form = ""
proper = "Secret"
incipit = "Apostoli tui Pauli precibus"
witness = "cummiskey-1861"
printed_page = "539"
ia_leaf = 547
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Leaf n547, printed p. 539, running head `18th JANUARY.`, second Secret of the Chair Mass, headed `Of St. PAUL.` and set with no Latin cue. Reached for 22 February by the same rubric as the Collect above."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Sanctify, O Lord, the offerings of thy people by the prayers of Paul thy apostle: that what is acceptable to thee, because by thee instituted, may become still more acceptable by his intercession.
"""

[[entries]]
mass = "comm-s-pauli-apostoli"
form = ""
proper = "Postcommunion"
incipit = "Sanctificati, Domine, salutari"
witness = "cummiskey-1861"
printed_page = "540"
ia_leaf = 548
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Leaf n548, printed p. 540, headed `Of St. PAUL.` with the Latin cue `Sanctificati.`, answering `Sanctificati, Domine, salutari`. Reached for 22 February by the same rubric as the Collect above."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Being sanctified, O Lord, by these saving mysteries, we pray that we may never be deprived of his intercession whom thou hast appointed our patron and guide.
"""

[[entries]]
mass = "s-gregorii-i-papae-confessoris-ecclesiae"
form = ""
proper = "Secret"
incipit = "Annue nobis, quaesumus"
witness = "cummiskey-1861"
printed_page = "563"
ia_leaf = 571
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "The 12 March Mass begins on leaf n570, printed p. 562, headed `XII. St. GREGORY, p. c.`, and its Secret and Postcommunion stand at the head of leaf n571, printed p. 563, under the running head `17th AND 19th MARCH`. The Secret is set with no Latin cue; it answers `Annue nobis, quaesumus`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Lord, by the intercession of blessed Gregory, that this sacrifice may be beneficial to us, by the offering of which thou hast been pleased to cancel the sins of the world. Thro'.
"""

[[entries]]
mass = "s-gregorii-i-papae-confessoris-ecclesiae"
form = ""
proper = "Postcommunion"
incipit = "Deus, qui beatum Gregorium"
witness = "cummiskey-1861"
printed_page = "563"
ia_leaf = 571
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Same leaf as the Secret above. Latin cue `Deus, qui.`, answering `Deus, qui beatum Gregorium`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst equal blessed Gregory, thy Bishop, to the rest of thy saints in merit: mercifully grant, that as we celebrate his memory, we may also follow his example. Thro'.
"""

[[entries]]
mass = "comm-ss-alexandri-eventii-theoduli-martyrum"
form = ""
proper = "Secret"
incipit = "Super has hostias, quaesumus Domine"
witness = "cummiskey-1861"
printed_page = "579"
ia_leaf = 587
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "The 3 May Mass of the Finding of the Holy Cross begins on leaf n585, printed p. 577, where this file already records the commemoration's Collect. Its second Secret, `SECRET. Of SS. ALEXANDER, &c.`, stands on leaf n587, printed p. 579, and is set with no Latin cue; it answers `Super has hostias, quaesumus Domine`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Let thy heavenly blessing, we beseech thee, O Lord, plentifully descend upon these oblations, which, through thy bounty, sanctify us and fill us with joy in the solemnity of thy saints. Thro'.
"""

[[entries]]
mass = "comm-ss-alexandri-eventii-theoduli-martyrum"
form = ""
proper = "Postcommunion"
incipit = "Refecti participatione muneris sacri"
witness = "cummiskey-1861"
printed_page = "579"
ia_leaf = 587
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Same leaf as the Secret above, headed `P. COMM. Of SS. ALEXANDER, &c.` The witness abbreviates the companions as `Alexander, &c.` where the 1962 writes `Alexandro, Eventio, Theodulo, et Juvenale`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Being refreshed by the participation of these sacred mysteries, we beseech thee, O Lord, that we may find the effects of what we celebrate, by the intercession of thy blessed Martyrs, Alexander, &c. Thro'.
"""

[[entries]]
mass = "comm-s-bonifatii-martyris"
form = ""
proper = "Secret"
incipit = "Muneribus nostris, quaesumus Domine"
witness = "cummiskey-1861"
printed_page = "472"
ia_leaf = 480
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Leaf n592, printed p. 584, heads 14 May `XIV. St. BONIFACE, m.` and rubricates `All as in Mass V. p. 470, except COLLECT. Da, quaesumus.` -- so the day prints its own Collect only, and its Secret is Mass V's. Mass V is `Protexisti`, of a Martyr in Paschal time; leaf n480, printed p. 472, prints under it `SECRET. Of a Martyr not a Bishop.` with no name in it, word for word the 1962's `Muneribus nostris, quaesumus Domine`. Boniface is a martyr and not a bishop, and 14 May falls in Paschal time, so that is the form the pointer reaches."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Receive, O Lord, we beseech thee, our offerings and prayers: purify us by those heavenly mysteries, and mercifully hear us. Thro'.
"""

[[entries]]
mass = "comm-s-petri-apostoli-2"
form = ""
proper = "Collect"
incipit = "Deus, qui beato Petro Apostolo tuo"
witness = "cummiskey-1861"
printed_page = "538"
ia_leaf = 546
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Two pointers reach this text. Leaf n617, printed p. 609, heads 30 June `XXX. COMMEMORATION of St. PAUL.` and rubricates `All as on January 25, p. 543`; leaf n552, printed p. 544, then prints for 25 January `Of St. PETER, Deus, qui beato, as on the Feast of his Chair at Rome, the 18th of January, p. 538.` The oration itself stands on leaf n546, printed p. 538, with the Latin cue `Deus, qui beato.` The 1962 index reprints the same three orations under 01-25 and 06-30, and this file already records them at comm-s-petri-apostoli; the English is therefore recorded twice, as at the three commemorations named in the 1962 open_collation_items."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who by delivering to the blessed apostle Peter the keys of the kingdom of heaven, didst give him the power of binding and loosing: grant that, by his intercession, we may be freed from the bonds of our sins. Who livest.
"""

[[entries]]
mass = "comm-s-petri-apostoli-2"
form = ""
proper = "Secret"
incipit = "Ecclesiae tuae, quaesumus Domine"
witness = "cummiskey-1861"
printed_page = "539"
ia_leaf = 547
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Reached by the same two pointers as the Collect above. Leaf n547, printed p. 539, first Secret of the Chair Mass, set with no Latin cue; it answers `Ecclesiae tuae, quaesumus Domine`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
May the intercession, we beseech thee, O Lord, of Bishop Peter thy apostle, render the prayers and offerings of thy church acceptable to thee: that the mysteries we celebrate in his honour, may obtain for us the pardon of our sins. Thro'.
"""

[[entries]]
mass = "comm-s-petri-apostoli-2"
form = ""
proper = "Postcommunion"
incipit = "Laetificet nos, Domine, munus oblatum"
witness = "cummiskey-1861"
printed_page = "540"
ia_leaf = 548
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Reached by the same two pointers as the Collect above. Leaf n548, printed p. 540; the oration begins on leaf n547 at the foot of p. 539 and ends here. It answers `Laetificet nos, Domine, munus oblatum`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
May the sacrifice we have offered, O Lord, fill us with holy joy: that as we publish the miracles thou hast wrought in the person of thy Apostle Peter, so we may, through his prayers receive the abundant effects of thy mercy. Thro'.
"""

[[entries]]
mass = "comm-ss-symphorosae-septem-eius-filiorum"
form = ""
proper = "Secret"
incipit = "Munera tibi, Domine, nostrae devotionis offerimus"
witness = "cummiskey-1861"
printed_page = "479"
ia_leaf = 487
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Leaf n627, printed p. 619, keeps 18 July as `XVIII. St. CAMILLUS de LELLIS, c.` and rubricates `Commem. of St. SYMPHOROSA, &c. by the Collect, &c. of Mass VIII. p. 477.` Mass VIII is `Sapientiam`, of Many Martyrs; its Secret, on leaf n487, printed p. 479, carries no name at all and answers the 1962's `Munera tibi, Domine, nostrae devotionis offerimus` word for word. Its Collect and Postcommunion do carry `N. and N.` and are ledgered untranslated."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
We bring thee, O Lord, the offerings of our devotion; and may they be acceptable to thee in honour of thy saints, and, by thy mercy, available to our salvation. Thro'.
"""

[[entries]]
mass = "comm-ss-hippolyti-cassiani-martyrum"
