[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
There was a man whose name was Job, and that man was simple and upright, and fearing God: and Satan asked to tempt him; and power was given him by the Lord over his possessions, and over his flesh: and he destroyed all his substance, and his sons: and he wounded his flesh with a grievous ulcer.
"""

[[entries]]
mass = "comm-septem-dolorum-beatae-mariae-virginis"
form = ""
proper = "Collect"
incipit = "Deus, in cujus passione, secundum Simeonis prophetiam"
witness = "cummiskey-1861"
detector = "second-printing-partly-agrees"
second_printing_coverage = 0.7857
harvest_note = "The witness keeps this Mass and prints it whole under `ON FRIDAY IN PASSION WEEK. The SEVEN DOLOURS of the B. V. MARY.`, which is the day the 1962 keeps it on. This Collect is cued `Deus, in cujus.` and answers Deus, in cujus passione, secundum Simeonis prophetiam, dulcissimam animam gloriosae Virginis et Matris Mariae doloris gladius pertransivit."
ia_text_layer_line = 13460

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, in whose passion, according to Simeon's prophecy, the sword of grief pierced the sweet soul of glorious Mary, the Virgin-mother; grant in thy mercy, that we, who with honour commemorate her sorrows and sufferings, may be helped by the glorious merits and prayers of all the saints that faithfully stood by thy cross, so as to partake of the happy fruits of thy passion. Who liveth.
"""

