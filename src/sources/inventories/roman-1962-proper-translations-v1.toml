collation_result = "recorded"
witness_note = "Printed inside III. The FINDING of the HOLY CROSS (3 May), p. 577 = leaf n585, under the sub-heading `Commem. of SS. Alexander, Eventius, and Theodulus, Martyrs, and Juvenalis, Confessor.` with the cue `Praesta.` (the page sets it `Præsta.`). The English names all four saints, Juvenalis included, exactly as the 1962 Latin does, so the commemoration answers the day's own Collect and not a Common's."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we who celebrate the festival of thy saints, Alexander, Eventius, Theodulus, and Juvenalis, may by their intercession, be delivered from all impending misfortunes. Thro'.
"""

[[entries]]
mass = "s-pii-v-papae-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui ad conterendos"
witness = "cummiskey-1861"
printed_page = "583"
ia_leaf = 591
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "The witness keeps St Pius V on 11 May, not the 1962's 5 May: its heading is XI. St. PIUS, Pope Conf., under the running head 11th and 12th May at p. 583 = leaf n591, and its own Kalendar (p. 770 = leaf n778) says the same. Directive `All as in Mass X.* p. 482, except`; cue `Deus, qui.` answers the 1962 incipit. The clause `make us by thy grace, so diligently in all that concerneth thy service` is what the page prints, re-read at doubled magnification; the elliptical syntax is the book's own."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who wast pleased to raise blessed Pius to the dignity of chief bishop, in order to depress the enemies of thy church, and restore the divine worship: make us by thy grace, so diligently in all that concerneth thy service, that we may defeat the treacherous designs of our enemies, and rejoice in everlasting peace. Thro'.
"""

