[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, for whose honour the glorious bishop Stanislaus fell by the swords of wicked men: grant, we beseech thee, that all who implore his aid, may obtain the happy effect of their prayers. Thro'.
"""

[[entries]]
