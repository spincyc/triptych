[[entries]]
mass = "septem-dolorum-beatae-mariae-virginis"
form = ""
proper = "Sequence"
incipit = "Stabat Mater dolorosa"
witness = "caswall-1849"
detector = "read-on-page-images"
harvest_note = '''The same transcription as the Friday-after-Passion-Sunday commemoration above, and this index reprints the Latin twice rather than referencing it once, so the English is recorded twice with it. The 15 September setting differs from the March one in the Latin -- a comma after `fleret` and after `stare`, and the ending `Paradisi gloria. Amen. Alleluia.` against `Paradisi gloria. Amen.` -- and NOT in anything the English renders; Caswall renders neither the Amen nor the Alleluia. If the two masses are ever joined by a `takes_from`, this row is the one to drop.'''

