[[untranslated]]
mass = "s-hilarii-episcopi-confessoris-ecclesiae-doctoris"
form_id = "main"
proper = "Collect"
cycle = "all"
occurrence = 1
lang = "en"
extent = "body"
availability = "unavailable"
reason = { kind = "witness-gap", source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861" }
note = "the witness reaches this day, and reaches it by reference. At XIV. St. HILARY, bp. c. it prints `All as in Mass XII. p. 485, with a Commem. of St. Felix`, and Mass XII is its Mass of Doctors, whose Collect it sets as `O God, who didst give Blessed N. to thy people for a minister of eternal salvation`. The 1962 Missal does not print N. here. At 14 Ianuarii it prints the Common's Mass by the same kind of reference and then sets the day's own orations with the saint named -- beatum Hilarium, Sancti Hilarii Pontificis, beatus Hilarius Pontifex tuus. So the witness's English answers the Common's Latin and not this day's, and the only step from one to the other is to write the saint's name into a prayer the witness does not write it into. That step is short and it is still project-composed text, so it is not taken. The Common's English is recorded at commune-doctorum-pontificis, where the witness prints it and where the Latin still reads N."

