collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at leaf n659 = printed p. 651, running head `26th AND 27th AUGUST`, under `XXVI. St. ZEPHYRINE, p. m.` / `All as in Mass II. p. 464, except`. RANK DIVERGENCE, NOT TEXT DIVERGENCE: the witness keeps 26 August as Zephyrinus's own feast, where the 1962 keeps him only as a commemoration on the day of St Joseph Calasanctius. Cue `Praesta.`, answering the 1962's `Praesta, quaesumus, omnipotens Deus: ut beati Zephyrini Martyris tui atque Pontificis, cujus gaudemus meritis, instruamur exemplis`. The witness spells `Zephyrine` and abbreviates bishop to `bp.`, and prints no comma after `bp.` This 1962 entry currently holds BOTH a real Collect and a Placeholder proper; this row answers the Collect."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that as we rejoice in the merits of blessed Zephyrine, thy martyr and bp. we may receive benefits from his example. Thro'.
"""

[[entries]]
mass = "comm-s-hermetis-martyris"
form = ""
