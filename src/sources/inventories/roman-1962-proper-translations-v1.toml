rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
We beseech thee, O Lord, that the constancy of thy holy martyrs, Protus and Hyacinth, may be an encouragement to us in our sufferings; and that, by their prayers, we may find a continual protection. Thro'.
"""

[[entries]]
mass = "comm-s-nicomedis-martyris"
