witness_note = "The 1862 prints `Lumen Christi. R. Deo gratias.` under chant notation, sung three times; the 1962 keeps the same two lines and moves them from the triple reed to the paschal candle, which is a change of what is carried and not of what is said. The 1861 prints its English inside a rubric and in quotation marks -- `whilst the Deacon sings alone: \"Behold the light of Christ,\" to which, all kneeling, add: \"R. Thanks be to God.\"` -- so the quoted words are the book's rendering and the surrounding rubric is not part of it. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

