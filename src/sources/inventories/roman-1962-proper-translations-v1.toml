source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, O Lord Jesus Christ, that the sacrifice we have partaken of, while with devotion we celebrate the transfixion of thy blessed Virgin-mother, may, through thy mercy, obtain for us the effect of every salutary good. Who livest.
"""

