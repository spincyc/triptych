witness_note = "Leaf n696, printed p. 688, heads 2 November `II. COMMEM. of the FAITHFUL, departed.` and rubricates `All as in the Mass (Requiem) p. 510. except the Collect, Fidelium, with its Secret and P. COMM, as in the Common Mass. p. 518, and what follows.` The oration stands on leaf n526, printed p. 518, in `The COMMON MASS for the DEAD`, under the sub-heading `For all the Faithful departed.` with the Latin cue `Fidelium.` The conclusion is printed `Who livest.` The 1861 is a pre-1915 printing and keeps one Mass on 2 November, not three; the `For all the Faithful departed` set it points at is the 1962 First Mass's three orations word for word, which is why this row names that form. The witness's `For Brethren, Friends, and Benefactors` set on the same leaves is the 1962 Third Mass's. A bounded page-image collation confirms the complete target identity. For All Souls this is the first 2-November form only; the second and third forms remain quarantined for substantive wording differences."

