witness_note = "The pre-1955 EIGHTH prophecy (Isaias 4, with the tract Vinea facta est) is the 1962's THIRD. The 1862 at p. 196 prints `Deus, qui in omnibus Ecclesiae tuae filiis, sanctorum Prophetarum voce manifestasti ... digna efficiantur fruge fecundi. Per Dominum nostrum etc.`, the 1962 index word for word. The 1861 prints the English under the cue `Deus, qui.` after the same prophecy and tract. Filed under the 1962's numbering. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O God, who by the mouths of the holy prophets hast declared, that through the whole extent of thy empire it is thou that sowest the good seed, and improvest the choicest branches that are found in all the children of thy church: grant to thy people, who are called by the names of vineyards and corn, that they may root out all thorns and briers, and bring forth good fruit in plenty. Thro'. R. Amen."

