harvest_note = "The witness keeps the day -- `V. St. VINCENT FERRERIUS, c.` -- and sets this Collect proper to it, cued `Deus.` and answering Deus, qui Ecclesiam tuam beati Vincentii Confessoris tui meritis et praedicatione illustrare dignatus es."
ia_text_layer_line = 33086

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who wast pleased to enlighten thy Church by the virtues and preaching of blessed Vincent, thy confessor: grant, that we thy servants may be instructed by his example, and by his prayers, delivered from all evil. Thro'.
"""

