[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who hast consecrated this day by the triumph of blessed Venantius, thy martyr, mercifully hear the prayers of thy people: and grant that we, who honour his virtues, may imitate the constancy of his faith. Thro'.
"""

[[entries]]
mass = "s-petri-caelestini-papae-confessoris"
