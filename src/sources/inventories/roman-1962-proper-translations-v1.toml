corrections = """
The retained English is not a diplomatic transcription. Optical damage to
ordinary English words was corrected from a substitution table built by reading
the generated file, spacing before punctuation was closed up, a full stop
falling inside a clause was removed, and the book's abbreviated conclusion was
normalised to Thro'. Nothing was modernised, no wording was supplied, and no
oration was completed from another source. Two extents that the general rules
cut in the wrong place were restored by rereading the text layer at those two
points, and are marked `boundary_restored`. Where the scan broke off mid-clause
the oration is recorded as untranslated rather than mended.

On 2026-07-31 a further 38 entries were corrected from the page images rather
than from the text layer, and are marked `collation_result = "corrected"`. The
damage that collation found was of four kinds: letter substitutions the earlier
substitution table had missed (`eterna]`, `Lard`, `tliese`, `aud`, `humiliauon`,
`draw iown`, `mertiful`, `wliat`, `G Lord`, `grent`); one word read as another
(`the attacks of the evil` for the printed `devil`, `all committed offences`
for the printed `all their offences`, `has ted` for the printed `has granted`);
two orations truncated mid-clause where the earlier rules had cut them (`to
him, who.` and `Grant we humbly be.`); and, most often, a terminal full stop
turned into a comma or dropped before the abbreviated conclusion. Nothing was
supplied that the page does not print, and where the page prints no conclusion
none was added.

The page also settled three readings in the other direction, against the
sibling temporal-orations-en transcription, and those entries are marked
`collation_result = "confirmed; the sibling ... is wrong"`. The 1861 book does
not always print `Thro'.`: at Quinquagesima's postcommunion it prints no
conclusion at all, at Quinquagesima's collect it prints `adversity Thro'.` with
no stop after `adversity`, and at Easter Sunday's postcommunion, Pentecost's
collect and Pentecost's postcommunion it prints the conclusion out in full
(`Thro'-in the unity of the Holy Ghost.` and the like). Those are reproduced as
printed here.

The second pass of 2026-07-31, over Holy Week and the Easter Vigil, found
three more corrections and no new class of damage except one. Palm Sunday's
secret and Maundy Thursday's postcommunion each carried a terminal full stop
after `Thro'` that the page does not print - the same class of fault this file
had already recorded against the sibling at Quinquagesima, where the sibling
supplied stops and whole conclusions the book does not set. Both were removed,
and in each case another oration on the same page or the next prints `Thro'.`
with the stop, so the omission is the book's and not the scan's. The Easter
Vigil's secret had lost the space in `Receive, O Lord` and it was restored.
The one new thing is Maundy Thursday's postcommunion, which ended
`Thro' \\ >`: the `\\ >` is the scan's own margin rule, which the text layer
carried into the first line of the next leaf, and it was never text. Two orations were newly
recorded rather than corrected, and are marked
`collation_result = "recorded from the page"`; see `english_oration_census`.

`Thro'.` remains the normal form here even where the page sets it otherwise.
The Easter Vigil's secret prints `Thro.'`, with the stop inside the
abbreviation rather than after it; that is the transposition the normalisation
rule above exists for, and it is normalised. A missing stop is not: where the
page prints `Thro'` and stops, so does this file.
"""

