collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1316, printed p. 1302 -- an ordinary numbered page, not a lettered insert -- under the black-letter heading `Common of One or More Supreme Pontiffs (Si diligis me)` and the sub-heading `Prayer`. The Latin column prints the 1962 slot's text with its parenthesis intact: `Gregem tuum, Pastor aeterne, placatus intende: et per beatum N. (Martyrem tuum atque) Summum Pontificem, perpetua protectione custodi; quem totius Ecclesiae praestitisti esse pastorem. Per Dominum.` CORROBORATED ON A SECOND ORDINARY PAGE: the same English, with `Sylvester` for `N. (Thy Martyr and)`, stands at leaf n163, printed p. 164, running head `DEC. 31-ST. SYLVESTER`, in the temporal -- so this translation is not confined to the inserted leaves."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O eternal Shepherd, do Thou look favorably upon Thy flock, which we beseech Thee to guard and keep for evermore through the Blessed N. (Thy Martyr and) Supreme Pontiff, whom Thou didst choose to be the chief shepherd of the whole Church. Through Our Lord.
"""

[[entries]]
mass = "commune-summorum-pontificum"
form = ""
proper = "Collect (Altera oratio)"
incipit = "Deus, qui Ecclesiam"
witness = "lasance-1945"
printed_page = "1302a"
ia_leaf = 1317
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1317, printed p. 1302a -- A LETTERED INSERT LEAF -- running head `COMMON OF A SUPREME PONTIFF`, under the rubric `If a Commemoration is to be made of another Supreme Pontiff, the following prayer is said:` and the heading `Prayer`. Latin as the 1962 slot: `Deus, qui Ecclesiam tuam in apostolicae petrae soliditate fundatam, ab infernarum eruis terrore portarum: praesta, quaesumus, ut intercedente beato N. (Martyre tuo atque) Summo Pontifice, in tua veritate persistens; continua securitate muniatur. Per Dominum.` CORROBORATED ON AN ORDINARY PAGE: the same English, with `Urban` for `N. (Thy Martyr and)`, stands at leaf n1017, printed p. 1025, running head `MAY 25-ST. GREGORY VII, POPE`, as the commemoration of St Urban I."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, Who didst establish Thy church upon the most firm foundation of an apostolic rock in order to deliver her from the dreadful powers of hell, grant her, we beseech Thee, that through the intercession of the blessed N. (Thy Martyr and) Supreme Pontiff, she may adhere always to Thy truth so as to enjoy at all times a sure defence. Through Our Lord.
"""

[[entries]]
mass = "commune-summorum-pontificum"
form = ""
proper = "Secret"
incipit = "Oblatis muneribus, quaesumus"
witness = "lasance-1945"
printed_page = "1302c"
ia_leaf = 1319
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1319, printed p. 1302c -- A LETTERED INSERT LEAF -- running head `COMMON OF A SUPREME PONTIFF`, under `Secret`. Latin as the 1962 slot: `Oblatis muneribus, quaesumus Domine, Ecclesiam tuam benignus illumina: ut, et gregis tui proficiat ubique successus, et grati fiant nomini tuo, te gubernante, pastores. Per Dominum.` The prayer names no saint, so no substitution arises."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
In Thy loving kindness, we beseech Thee, Lord, be moved by the offering of our gifts and enlighten Thy Church: that Thy flock may prosper everywhere and the shepherds, under Thy guidance, may be rendered acceptable to Thee. Through our Lord.
"""

[[entries]]
mass = "commune-summorum-pontificum"
form = ""
proper = "Secret (Altera secreta)"
incipit = "Munera, quae tibi"
witness = "lasance-1945"
printed_page = "1302c"
ia_leaf = 1319
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Same leaf n1319, printed p. 1302c, under the heading `Another Secret as above`. Latin: `Munera, quae tibi, Domine, laetantes offerimus, suscipe benignus, et praesta: ut intercedente beato N., Ecclesia tua et fidei integritate laetetur, et temporum tranquillitate semper exultet. Per Dominum.` The 1962 slot adds the plural alternative `(intercedentibus beatis N. et N.)`, which this witness does not print; the singular is word for word. CORROBORATED ON AN ORDINARY PAGE: the same English, with `Urban` for `N.`, at leaf n1017, printed p. 1025."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Receive, O Lord, in Thy loving kindness the joyful offering of our gifts, and through the intercession of blessed N., grant that Thy Church may enjoy integrity of faith and rejoice in the tranquillity of peaceful times.
"""

[[entries]]
mass = "commune-summorum-pontificum"
form = ""
proper = "Postcommunion"
incipit = "Refectione sancta enutritam"
witness = "lasance-1945"
printed_page = "1302d"
ia_leaf = 1320
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1320, printed p. 1302d -- A LETTERED INSERT LEAF -- running head `COMMON OF A MARTYR-BISHOP` (the next Common begins lower on the same page), under `Postcommunion`. Latin as the 1962 slot: `Refectione sancta enutritam guberna, quaesumus, Domine, tuam placatus Ecclesiam: ut potenti moderatione directa, et incrementa libertatis accipiat et in religionis integritate persistat. Per Dominum.`"

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Since Thy Church has been nourished by the sacred repast, govern her in Thy clemency, we beseech Thee, O Lord, so that under the guidance of Thy mighty rule she may enjoy greater freedom and abiding integrity of religion. Through our Lord.
"""

[[entries]]
mass = "commune-summorum-pontificum"
form = ""
proper = "Postcommunion (Altera postcommunio)"
incipit = "Multiplica, quaesumus, Domine"
witness = "lasance-1945"
printed_page = "1302d"
ia_leaf = 1320
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Same leaf n1320, printed p. 1302d, under `Another Postcommunion as above`. Latin as the 1962 slot, parenthesis and all: `Multiplica, quaesumus Domine, in Ecclesia tua spiritum gratiae, quem dedisti: ut beati N. (Martyris tui atque) Summi Pontificis deprecatione, nec pastori obedientia gregis nec gregi desit cura pastoris. Per Dominum.` CORROBORATED ON AN ORDINARY PAGE: the same prayer, with `Urban` for `N.`, begins at leaf n1017, printed p. 1025, and runs over to p. 1026."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Increase, we beseech Thee, O Lord, in Thy Church the spirit of grace Thou hast given her: that through the prayers of the blessed N. (Thy Martyr and) Supreme Pontiff, the flock may never fail in obedience to their shepherd nor the shepherd in the faithful care of his flock. Through our Lord.
"""

# --- Commune Dedicationis ecclesiae (4 of 4) --------------------------------

[[entries]]
mass = "commune-dedicationis-ecclesiae"
form = ""
proper = "Collect (In ipso die Dedicationis)"
incipit = "Deus, qui invisibiliter"
witness = "lasance-1945"
printed_page = "1389"
ia_leaf = 1407
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1407, printed p. 1389, running head `COMMON OF DEDICATION OF A CHURCH`. The anniversary Prayer `Deus, qui nobis per singulos annos` stands first; then the rubric `On the actual day of Dedication and during its Octave, the following Prayer is said, otherwise it is omitted.`; then this one. That rubric is what identifies the slot: it is the witness's own name for `In ipso die Dedicationis`. Latin as the 1962 slot, with `illustrat` for `illustra`: `Deus, qui invisibiliter omnia contines, et tamen pro salute generis humani signa tuae potentiae visibiliter ostendis: templum hoc potentia tuae inhabitationis illustrat, et concede; ut omnes, qui huc deprecaturi conveniunt, ex quacumque tribulatione ad te clamaverint, consolationis tuae beneficia consequantur. Per Dominum.`"

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, Who dost invisibly contain all things, and yet dost visibly show the signs of Thy power for the salvation of mankind, illumine this temple by the virtue of Thine indwelling, and grant that all who assemble here to pray, from whatsoever tribulation they shall call upon Thee, may obtain the blessings of Thy consolation. Through our Lord.
"""

[[entries]]
mass = "commune-dedicationis-ecclesiae"
form = ""
proper = "Secret (Extra ecclesiam ipsam dedicatam)"
incipit = "Annue, quaesumus, Domine"
witness = "lasance-1945"
printed_page = "1392"
ia_leaf = 1410
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1410, printed p. 1392, running head `COMMON OF DEDICATION OF A CHURCH`, under `Secret`, preceded by the rubric `The words within parentheses in the following Secret are said only when the Mass is offered within the very walls of the church, the feast of whose dedication is being celebrated.` The 1962 prints the two cases as two Secrets and this witness prints them as one text with a bracket; the bracketed words ARE the difference between them, so the 1962's Extra ecclesiam form is this text with the parenthesis omitted, on the book's own instruction. The parenthesis is left standing in the entry rather than resolved -- see the lane report, question Q1, which is the same question as the Doctors' `(or confessor)`. Latin: `Annue, quaesumus, Domine, precibus nostris: (ut quicumque intra templi hujus, cujus anniversarium dedicationis diem celebramus, ambitum continemur, plena tibi, atque perfecta corporis et animae devotione placeamus) ut, dum haec vota praesentia reddimus, ad aeterna praemia, te adjuvante, pervenire mereamur. Per Dominum.`"

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Bow down to our prayers, O Lord, we beseech Thee (that all of us who are within the precincts of this temple, the anniversary of whose dedication we celebrate, may please thee with full and perfect devotion of body and soul) that, while we pay our vows here below, we may, by Thine assistance, be worthy to attain unto everlasting rewards. Through our Lord.
"""

[[entries]]
mass = "commune-dedicationis-ecclesiae"
form = ""
proper = "Secret (In ipso die Dedicationis)"
incipit = "Deus, qui sacrandorum"
witness = "lasance-1945"
printed_page = "1392"
ia_leaf = 1410
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Same leaf n1410, printed p. 1392, the second `Secret` on the page, introduced by `On the actual day of Dedication and during its Octave the following Secret is said, otherwise it is omitted.` Latin as the 1962 slot: `Deus, qui sacrandorum tibi auctor es munerum, effunde super hanc orationis domum benedictionem tuam: ut ab omnibus in ea invocantibus nomen tuum, defensionis tuae auxilium sentiatur. Per Dominum.`"

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, Who art the author of the gifts that are to be consecrated to Thee, pour forth Thy blessing upon this house of prayer, that the help of Thy defence may be felt by all who here invoke Thy name. Through our Lord.
"""

[[entries]]
mass = "commune-dedicationis-ecclesiae"
form = ""
proper = "Postcommunion (In ipso die Dedicationis)"
incipit = "Quaesumus, omnipotens Deus"
witness = "lasance-1945"
printed_page = "1393"
ia_leaf = 1411
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1411, printed p. 1393, running head `COMMON OF DEDICATION OF A CHURCH`, the second `Postcommunion` on the page, introduced by `On the actual day of Dedication and during its Octave the following Postcommunion is said, otherwise it is omitted.` Latin as the 1962 slot: `Quaesumus omnipotens Deus: ut in hoc loco, quem nomini tuo indigni dedicavimus; cunctis petentibus aures tuae pietatis accomodes. Per Dominum.`"

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
We pray Thee, O almighty God, that in this place, which we, unworthy, have dedicated to Thy name, the ears of Thy loving-kindness may be inclined unto all who make their petitions. Through our Lord.
"""

# --- sanctoral singles printed in full, name in both columns (5) ------------

[[entries]]
mass = "ss-perpetuae-felicitatis-martyrum"
form = ""
proper = "Postcommunion"
incipit = "Mysticis, Domine, repleti"
witness = "lasance-1945"
printed_page = "938"
ia_leaf = 936
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n936, printed p. 938, running head `MARCH 7-ST. THOMAS AQUINAS` (the day before's Mass ends at the head of the page), under `Postcommunion` of the Mass headed `March 6-Sts. Perpetua and Felicitas, Martyrs`. Latin as the 1962 slot: `Mysticis, Domine, repleti sumus votis et gaudiis: praesta, quaesumus; ut intercessionibus sanctarum Martyrum tuarum Perpetuae et Felicitatis, quae temporaliter agimus, spiritualiter consequamur. Per Dominum.` The names are printed in both columns."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Thou hast filled us, O Lord, with mystic graces and joys: grant, we beseech Thee, that through the prayers of Thy holy Martyrs, Perpetua and Felicitas, we may profit eternally from having in this our time ministered to Thee. Through our Lord.
"""

[[entries]]
mass = "s-bedae-venerabilis-confessoris-ecclesiae-doctoris"
form = ""
proper = "Collect"
incipit = "Deus, qui Ecclesiam tuam"
witness = "lasance-1945"
printed_page = "1028-1029"
ia_leaf = 1020
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Begins on leaf n1020, printed p. 1028, running head `MAY 27-ST. BEDE`, under the heading `May 27-St. Bede, Confessor, Doctor of the Church (White) / Double / Mass, In medio, page 1344, except Prayer as below:` and then `Prayer`; finishes on leaf n1021, printed p. 1029. Both leaves were opened. Latin as the 1962 slot: `Deus, qui Ecclesiam tuam beati Bedae Confessoris tui atque Doctoris eruditione clarificas: concede propitius famulis tuis; ejus semper illustrari sapientia et meritis adjuvari. Per Dominum.`"

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, Who dost enlighten Thy Church with the learning of blessed Bede, Thy confessor and doctor, mercifully grant Thy servants ever to be illuminated by his wisdom and assisted by his merits. Through our Lord.
"""

[[entries]]
mass = "comm-s-romani-martyris"
form = ""
proper = "Postcommunion"
incipit = "Quaesumus, omnipotens Deus"
witness = "lasance-1945"
printed_page = "1151"
ia_leaf = 1143
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1143, printed p. 1151, running head `AUG. 10-ST. LAWRENCE`, under the rubric `Commemoration of St. Romanus.` and the heading `Postcommunion`, inside the Mass of the Vigil of St Lawrence. Latin as the 1962 slot with the name printed: `Quaesumus, omnipotens Deus: ut, qui caelestia alimenta percepimus, intercedente beato Romano Martyre tuo, per haec contra omnia adversa muniamur. Per Dominum.` This is why the row is closable and its Secret's twin was not: the witness's own Common of a Confessor prints the same formula with `beato N. Confessore tuo`, but the sanctoral prints it out again for the day with `Romano Martyre`, so no substitution is needed."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
We beseech Thee, almighty God, that we who have partaken of the food of heaven may, by the intercession of blessed Romanus, Thy martyr, be strengthened by it against all harm. Through our Lord.
"""

[[entries]]
mass = "s-gregorii-vii-papae-confessoris"
form = ""
proper = "Collect"
incipit = "Deus in te sperantium fortitudo"
witness = "lasance-1945"
printed_page = "1025"
ia_leaf = 1017
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1017, printed p. 1025, running head `MAY 25-ST. GREGORY VII, POPE`, under the heading `May 25-St. Gregory VII, Pope, Conf. (White) / Double / St. Urban I, Pope, Martyr (White) / Mass, Si diligis me, page 1302, except:` and then `Prayer`. The 1861 witness keeps this saint on 28 May and by pointer alone; this one keeps him on the 1962's own 25 May and prints the oration in full. Latin as the 1962 slot: `Deus, in te sperantium fortitudo, qui beatum Gregorium, Confessorem tuum atque Pontificem, pro tuenda Ecclesiae libertate, virtute constantiae roborasti: da nobis, ejus exemplo et intercessione, omnia adversantia fortiter superare. Per Dominum.`"

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, the strength of them that trust in Thee, Who didst fortify blessed Gregory, Thy Confessor and Pontiff, with the virtue of constancy, for the defense of the liberty of the Church, grant us by his example and intercession courageously to overcome all adversities. Through our Lord.
"""

[[entries]]
mass = "s-angelae-mericiae-virginis"
form = ""
proper = "Collect"
incipit = "Deus, qui novum per beatam Angelam"
witness = "lasance-1945"
printed_page = "1031"
ia_leaf = 1023
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1023, printed p. 1031, running head `JUNE 1 - ST. ANGELA MERICI`, under the heading `June 1-St. Angela Merici, Virgin (White) / Double / Mass, Dilexisti, Page 1370, except:` and then `Prayer`. Latin as the 1962 slot: `Deus, qui novum per beatam Angelam sacrarum virginum collegium in Ecclesia tua florescere voluisti; da nobis, ejus intercessione, angelicis moribus vivere; ut, terrenis omnibus abdicatis, gaudiis perfrui mereamur aeternis. Per Dominum.` THE BOOK PRINTS THIS PRAYER TWICE AND NOT IDENTICALLY: at leaf n1586, in the section of Masses for particular places, the same prayer is set with `should blossom in Thy Church` where this page has `should flourish in Thy Church`. This entry takes the 1 June setting because that is the day the 1962 keeps and the place the witness's own sanctoral prints it; the other setting is recorded here so the difference is not discovered as an error."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, Who hast willed that, through blessed Angela, a new family of consecrated virgins should flourish in Thy Church, grant us, through her intercession, to lead an angelic life, that, putting aside all earthly joys, we may deserve to attain those that are eternal. Through our Lord.
"""

# --- proposed untranslated ledger rows ---------------------------------------

[[entries]]
mass = "s-rosae-limanae-virginis"
form = ""
proper = "Collect"
incipit = "Bonorum omnium largitor"
witness = "cummiskey-1861"
printed_page = "654"
ia_leaf = 662
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page images at printed p. 654 = leaf n662 (day heading `XXX. St. ROSE of LIMA`, 30th August, Latin cue `Bonorum.`, matching the 1962 incipit) and concluded at printed p. 655 = leaf n663; both leaves read at w1400. The day sends the rest of its Mass to Mass XIX p. 498. The page prints `he giver` where the sense wants `the giver`: the leaf shows no `t` at all, so the reading is of a dropped or unstruck sort, and the text is recorded as the page prints it."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O Almighty God, he giver of all good gifts, who wast pleased that blessed Rose, abundantly favoured with the dew of heavenly grace, should beautify the Indies with her purity and patience: grant that we thy servants, following the perfume of her virtues, may become an agreeable odour to Christ. Thro'.
"""

[[entries]]
mass = "s-raymundi-nonnati-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui in liberandis"
witness = "cummiskey-1861"
printed_page = "655"
ia_leaf = 663
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on the 1861 page image at printed p. 655 = leaf n663, day heading `September 1. St. RAYMOND NONNATUS, c.`, Latin cue `Deus, qui.` The witness keeps this feast at 1 September where the 1962 keeps it at 31 August; the day and the saint are the same and the cue answers the 1962 incipit. The day sends the rest of its Mass to Mass XIII p. 488."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst make blessed Raymond, thy confessor, wonderfully eminent by redeeming the faithful out of captivity: grant, by his prayers, that being freed from the bonds of sin, we may cheerfully perform what is most pleasing to thee. Thro'.
"""

[[entries]]
mass = "comm-s-gorgonii-martyris"
