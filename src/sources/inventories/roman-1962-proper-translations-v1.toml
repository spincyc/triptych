witness_note = "The commemoration begins at the foot of leaf n648, printed p. 640, where this file already records its Collect; its Secret and Postcommunion stand at the head of leaf n649, printed p. 641, running head `14th AUGUST`. The Secret is set with no Latin cue; it answers `Respice, Domine, munera populi tui`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Receive, O Lord, our offerings on this festival of thy saints: and may their bearing witness of thy truth advance our salvation. Thro'.
"""

[[entries]]
