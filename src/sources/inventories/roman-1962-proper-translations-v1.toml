source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Help us, O Lord, we beseech thee, in thy mercy: and grant, by the intercession of blessed Ubaldus, thy bishop and confessor, that we may be defended by thy right hand against all the snares of the devil. Thro'.
"""

[[entries]]
mass = "s-paschalis-baylon-confessoris"
