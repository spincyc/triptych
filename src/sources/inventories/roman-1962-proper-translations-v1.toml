collated = "page-image and tracked transcription, 2026-08-27"
collation_result = "confirmed"
witness_note = "The 1955 order cut the twelve prophecies to four, keeping the pre-1955 first, fourth, eighth and eleventh WITH THEIR OWN ORATIONS UNCHANGED. This is the pre-1955 first: the 1862 prints `Deus, qui mirabiliter creasti hominem ... ut mereamur ad aeterna gaudia pervenire. Per Dominum.` after Genesis 1, which is the 1962 index word for word, and the 1962's First Prophecy is that same Genesis 1. The 1861 prints the English under the Latin cue `Deus, qui.` in the same position. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O God, who didst wonderfully create man, and redeem him by a still greater wonder: grant us, we beseech thee, such strength of mind and reason against all the allurements of sin, that we may deserve to obtain eternal joys. Thro'. R. Amen."

