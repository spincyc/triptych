# English translations for the text-bearing propers of the roman-1962 calendar.
#
# This file sits in inventories/ rather than beside its calendar because the two
# validators leave nowhere else: `check-calendar-masses` reads every .yaml under
# src/sources/calendars as a mass index, and `source-library validate` rejects any
# file under src/sources outside its own schema. Its eventual home is inside each
# proper in propers.yaml, which is where the contract in
# src/sources/calendars/README.md puts `translations`; it is here only because
# another lane owns that file. See `merge` below.

translations_schema = 1
record_type = "calendar-proper-translations"
calendar = "roman-1962"
target = "src/sources/calendars/roman-1962/propers.yaml"
recorded_on = "2026-07-31"
merge = """
Each entry names one proper by mass key, form label and proper name. Set that
proper's `translations` key to the entry's `translations` array verbatim: the
array already carries exactly the keys `check-calendar-masses` validates -- lang,
text, rights, and source_id for a public-domain or licensed basis -- so the merge
copies a structure and does not translate between schemas.

Check `incipit` against the target proper before merging. An entry whose mass,
form, proper or incipit no longer answers the target is stale and must be
re-derived from the witness, never merged on the strength of its mass key alone.

`untranslated` merges nothing. It is the ledger of propers deliberately left
without English, so that a proper carrying no `translations` key can be
distinguished from one nobody looked at, and so that a page can say that no
English is recorded rather than showing Latin as though it were the answer.
"""
verification = """
Partly collated. Of the 162 entries, 108 carry `printed_page`, `ia_leaf`,
`collated` and `collation_result`: those were read against the page images of
Internet Archive item romanmissaltran00churgoog, the same 1861 printing this
file quotes, at
`https://archive.org/download/romanmissaltran00churgoog/page/n<leaf>_w1400.jpg`
on 2026-07-31. 65 were confirmed as printed, 41 were corrected against the
page, and 2 were recorded from the page in propers this file had declared the
witness does not print. The remaining 54 entries carry no such keys: they have
still been read out of an optical-character-recognition text layer and
collated against nothing, and must be treated as unverified.

The collation ran in two passes on that day. The first 99 were not chosen at
random. They are every entry that disagreed with the project's independent
transcription of the same book (the artifact temporal-orations-en registered
on this edition), plus a seeded random sample
of the entries that agreed with it, plus every further oration that happened to
be printed on a page opened for one of those two reasons. That sampling is
biased towards the loci most likely to be wrong, so the measured 38 per cent
correction rate over that set is an upper bound on the error rate of the file
as a whole, not an estimate of it.

The second pass, later the same day, took the nine Holy Week orations the
first had left: it read every entry no detector could reach, plus the two
propers this file had recorded as absent from the witness. That sampling is
not biased at all -- it is the whole of a stratum -- and within it three of
seven entries were corrected and two absences were refuted. Nine orations is
too few to rate, and the stratum was selected for having no evidence, so
nothing about the other 153 follows from it.

The alignment of each oration to its mass was settled by reading the English
against the Latin the calendar carries. That is a judgement and not a
collation, and it was necessary: the book abbreviates its Latin incipits, dozens
of orations open `Deus qui`, and the scan damages italic worst of all, so
matching on incipits alone produced confident wrong answers. Where the scan lost
a part label, two masses share one block; those cases are named in the entries
that depend on them. The page collation confirmed the alignment wherever it
opened a page, because the 1861 headings are visible there, but it did not
re-derive the alignment of the 54 uncollated entries.

`printed_page` and `ia_leaf` were taken from the sibling temporal-orations-en
transcription and independently confirmed by the page actually opening on the
oration named. Where an oration runs over a page break it is filed at the page
where it begins, and the following leaf was read as well.

The sibling stops before Holy Week, so it supplied no leaf number for any of
the nine orations collated in the second pass. Those were derived instead from
the Internet Archive item's own page-number map,
`romanmissaltran00churgoog_page_numbers.json`, which gives a printed page
number per leaf; the derivation was checked by reproducing the `ia_leaf` this
file already carried at pp. 52, 212, 332 and 457, and then confirmed the same
way as the rest, by the page opening on the oration named. That map is where
the sibling's own record says it computed its leaves from, so the leaf numbers
for Holy Week were available from the beginning; see
`english_oration_census` for what was concluded from their absence instead.
The offset from printed page to leaf is not constant across this scan: it is
+10 from printed p. 1 through p. 261 and +8 from p. 262 to the end, the step
falling inside Holy Week itself. A leaf must therefore be read out of the map
and never extrapolated from a neighbouring entry.

Treat every entry without a `collated` key as a lead of the same standing as
the Latin beside it in propers.yaml, whose own `verification` field says the
same of itself.
"""
corrections = """
The retained English is not a diplomatic transcription. Optical damage to
ordinary English words was corrected from a substitution table built by reading
the generated file, spacing before punctuation was closed up, a full stop
falling inside a clause was removed, and the book's abbreviated conclusion was
normalised to Thro'. Nothing was modernised, no wording was supplied, and no
oration was completed from another source. Two extents that the general rules
cut in the wrong place were restored by rereading the text layer at those two
points, and are marked `boundary_restored`. Where the scan broke off mid-clause
the oration is recorded as untranslated rather than mended.

On 2026-07-31 a further 38 entries were corrected from the page images rather
than from the text layer, and are marked `collation_result = "corrected"`. The
damage that collation found was of four kinds: letter substitutions the earlier
substitution table had missed (`eterna]`, `Lard`, `tliese`, `aud`, `humiliauon`,
`draw iown`, `mertiful`, `wliat`, `G Lord`, `grent`); one word read as another
(`the attacks of the evil` for the printed `devil`, `all committed offences`
for the printed `all their offences`, `has ted` for the printed `has granted`);
two orations truncated mid-clause where the earlier rules had cut them (`to
him, who.` and `Grant we humbly be.`); and, most often, a terminal full stop
turned into a comma or dropped before the abbreviated conclusion. Nothing was
supplied that the page does not print, and where the page prints no conclusion
none was added.

The page also settled three readings in the other direction, against the
sibling temporal-orations-en transcription, and those entries are marked
`collation_result = "confirmed; the sibling ... is wrong"`. The 1861 book does
not always print `Thro'.`: at Quinquagesima's postcommunion it prints no
conclusion at all, at Quinquagesima's collect it prints `adversity Thro'.` with
no stop after `adversity`, and at Easter Sunday's postcommunion, Pentecost's
collect and Pentecost's postcommunion it prints the conclusion out in full
(`Thro'-in the unity of the Holy Ghost.` and the like). Those are reproduced as
printed here.

The second pass of 2026-07-31, over Holy Week and the Easter Vigil, found
three more corrections and no new class of damage except one. Palm Sunday's
secret and Maundy Thursday's postcommunion each carried a terminal full stop
after `Thro'` that the page does not print - the same class of fault this file
had already recorded against the sibling at Quinquagesima, where the sibling
supplied stops and whole conclusions the book does not set. Both were removed,
and in each case another oration on the same page or the next prints `Thro'.`
with the stop, so the omission is the book's and not the scan's. The Easter
Vigil's secret had lost the space in `Receive, O Lord` and it was restored.
The one new thing is Maundy Thursday's postcommunion, which ended
`Thro' \\ >`: the `\\ >` is the scan's own margin rule, which the text layer
carried into the first line of the next leaf, and it was never text. Two orations were newly
recorded rather than corrected, and are marked
`collation_result = "recorded from the page"`; see `english_oration_census`.

`Thro'.` remains the normal form here even where the page sets it otherwise.
The Easter Vigil's secret prints `Thro.'`, with the stop inside the
abbreviation rather than after it; that is the transposition the normalisation
rule above exists for, and it is normalised. A missing stop is not: where the
page prints `Thro'` and stops, so does this file.
"""

sibling_transcription = """
This file is the second English transcription of the 1861 Cummiskey missal in
the repository. The first is the artifact

  artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.temporal-orations-en

whose 183 rows cover the same temporal orations, carry a `printed_page` and
`ia_leaf` per row, and are cited by 84 passage records and by the
`source-bindings.toml` of several tracked documents. Neither transcription is
derived from the other: both were read independently out of the same Internet
Archive text layer, and on 2026-07-31 they disagreed at 45 of the 153 orations
they both carry. The page collation recorded above settled every one of those
45. The artifact was right at 37 of them and this file was right at 8. This
file has been corrected; the artifact has not, because its bytes are pinned by
sha256 in its own `artifact.toml`, in the `artifact_sha256` of all 84 passage
records, and in the prose of at least one tracked document, so correcting it is
a co-ordinated change and not a lane-local one.

The eight rows of the artifact that the page images contradict, with the
printed reading, are:

  advent-4 collect (p. 69, n79)        `may hasten, what is delayed` - the
                                       artifact drops the printed comma
  quinquagesima collect (p. 111, n121) `all adversity Thro'.` - the artifact
                                       adds a full stop the page does not print
  quinquagesima postcommunion          `defended from all adversity.` - the
    (p. 113, n123)                     artifact appends a `Thro'.` that the
                                       page does not print at all
  easter-sunday postcommunion          `Thro'-in the unity of the Holy Ghost.`
    (p. 332, n340)                     - the artifact truncates it to `Thro'.`
  easter-5 postcommunion               `Grant, O Lord by the power` - the
    (p. 357, n365)                     artifact inserts a comma after `Lord`
  pentecost collect (p. 375, n383)     `Thro'-in the unity of the same, &c.` -
                                       the artifact truncates it to `Thro'.`
  pentecost postcommunion              `Thro' our Lord-in the unity of the
    (p. 378, n386)                     same, &c.` - the artifact truncates it
  pentecost-6 collect (p. 407, n415)   `an increase of religion that thou
                                       mayest improve` - the artifact inserts a
                                       semicolon after `religion`

Six of the eight are the artifact normalising the book's conclusions where the
book is not uniform, which its own `transformation` note says it did not do.
Two transcriptions of one book will keep drifting; the standing rule is one
derived table with no hand-typed restatement beside it, and this file is that
restatement. It should end as `translations` inside propers.yaml derived from
the artifact, not as a parallel reading of the same pages.
"""

english_oration_census = """
Recorded 2026-07-31, when the question was widened from this file's 99
collated entries to every English rendering of a non-scriptural proper the
repository carries. The honest total is small and worth stating plainly,
because it is easy to read the corrections above as the end of the problem
rather than as the result of having looked at two thirds of one file.

The repository serves English for exactly 162 non-scriptural propers, all of
them here. `src/web/data/structure/propers/roman-1962.json` carries 1,465
propers, of which 561 are non-scriptural, and 162 of those 561 hold a
`translations` array - 54 collects, 55 secrets, 53 postcommunions. Every one
comes from this file: `tools/mass-propers` builds the browser's data by
overlaying this inventory onto propers.yaml and reads no other translation
source. The postconciliar calendar carries 498 non-scriptural propers and no
English at all, by the ICEL rights decision recorded in
`postconciliar-proper-translations-v1.toml`, so no unverified English is being
served there. Outside the two calendars the only other English orations in the
tree are quotations of the sibling artifact through passage records, not an
independent rendering.

Of the 162:

  108  read against the 1861 page images on 2026-07-31 - 65 confirmed,
       41 corrected, and 2 recorded from the page in propers this file had
       declared the witness does not print. These carry `collated` and
       `collation_result`.
   54  never seen on a page, but matched byte for byte by the independent
       temporal-orations-en transcription of the same book. These carry
       `detector = "sibling-agrees"`.
    0  never seen on a page and with no sibling row at all.

The detector field is the disagreement test of `sibling_transcription` above,
run over the whole file and recorded rather than left to be re-derived. It
came back with no open disagreements, which is the expected result: the
collation settled all 45 of them. What it does establish is the shape of what
remains. The 54 are backed by two independent readings of one book that agree,
and where those two agreed the page vindicated them 54 times out of 54 - good
evidence, and not the same thing as having looked.

**Corrected in place, 2026-07-31.** This census first reported a third
category, 7 entries that had "no evidence of any kind":

  palm-sunday               collect, secret, postcommunion
  mass-of-the-lords-supper  collect, postcommunion
  easter-vigil              collect, secret

and said of them: "The sibling deliberately excludes Palm Sunday, the rest of
Holy Week and the Easter Vigil, so no detector for these can ever exist and
only the page will settle them."

The first clause is true. The conclusion drawn from it was false. The 1861
Cummiskey printing this file already quotes prints Holy Week complete, from
Palm Sunday at printed p. 230 (leaf n240) to the end of Holy Saturday at p. 329
(leaf n337); every one of those seven orations is on those pages, and all seven
have now been read there. What was missing was never the page. It was the leaf
number. This file took `printed_page` and `ia_leaf` from the sibling; the
sibling stops before Holy Week; so no leaf number existed for any Holy Week
oration, no page was ever opened on one, and the gap in the borrowed apparatus
was written up as a gap in the evidence. The Internet Archive item's own
page-number map carries a printed page for every leaf in the book, and the
sibling's own artifact record says in terms that that map is where its leaves
came from. The means of settling these seven was one file away for as long as
the claim stood.

Two `untranslated` rows fell with it, and they are the more serious half.
Maundy Thursday's secret and the Easter Vigil's postcommunion were both
recorded as "no oration answering this proper was found in the witness", and
the witness prints both. The first straddles the page break at pp. 273-274 and
so is invisible to a search that reads one page at a time. The second is slot
displacement: the pre-1955 Mass on Holy Saturday has no postcommunion at all,
and the book prints that oration a page later as the Vespers prayer Spiritum on
p. 329. A matcher keyed on (mass, proper-name) will report such a prayer absent
from every pre-1956 witness while the words sit in print, which is exactly the
false absence recorded here; that reason is now written into the entry rather
than left to be re-derived by whoever meets it next.

Four `untranslated` rows still carry the same "not found in the witness"
wording - pentecost-3 collect, pentecost-6 secret and postcommunion,
pentecost-7 collect. Nothing in this pass re-tested them, and on the evidence
of the two that fell they should be read as untested rather than as settled.

The rule the seven were left under still holds and is why they were left: an
unverified entry recorded as verified is a worse defect than the OCR error it
hides. What it does not license is the inference that was drawn beside it. An
absence recorded against a witness is a claim about a reader until someone has
looked at the page.
"""

