harvest_note = "This 1962 entry does not print an oration of its own: it reprints, character for character after orthographic folding, the Latin the same index carries at commune-plurimorum-martyrum-1, whose English the witness prints in its Common of Saints under MASS VII. Intret, of MANY MARTYRS, p. 475 and which is recorded in this file at that mass. The identity of the two Latin texts was derived mechanically over this index on 2026-08-07 and is the whole of the join: the witness never sends its Common to this commemoration, and this row does not claim it does. What it claims is narrower and checkable -- that the 1962 sets the same words here, and that this is the witness's English for those words. The alternative shape, a `takes_from` on the mass so that neither the Latin nor the English is carried twice, is the better one and belongs to the lane that owns propers.yaml; it is named here rather than taken."
