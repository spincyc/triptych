[[entries]]
mass = "corpus-christi"
form = ""
proper = "Secret"
incipit = "Ecclesiae tuae, quaesumus, Domine, unitatis et pacis"
witness = "cummiskey-1861"
printed_page = "398"
ia_leaf = 406
collated = "page-image, 2026-08-02"
collation_result = "recorded from the page; the page ends the oration `in these offerings. Thro` and prints neither the apostrophe nor the full stop"
witness_note = "The same Mass as the Collect above, running on to printed p. 398 = leaf n406, where the Secret, the Communion and the P. Comm. of Corpus Christi stand above the rule that opens the Second Sunday after Pentecost. The running head of that page already reads II. SUNDAY AFTER PENTECOST while the Corpus Christi Mass is still being printed under it, which is one more way a matcher keyed on a heading reports a false absence -- the same class of fault this file has now recorded at Maundy Thursday, Good Friday, the Easter Vigil and the Second Sunday after the Epiphany. This is the one of the three orations the book sets with no Latin cue before it: the alignment rests on its place in the Mass and on the English rendering unitatis et pacis propitius dona concede: quae sub oblatis muneribus mystice designantur word for word. Read at 200 dpi and again at 400 dpi, and the conclusion at 800 per cent, because the reading turned on whether anything followed `Thro`."
disagreement = "the artifact ends the oration `offerings. Thro’.` and the page prints `offerings. Thro` with neither apostrophe nor full stop; the word ends well short of the right margin, so nothing was cropped, and the same page prints `Thro’.` in full at the Second Sunday after Pentecost's Collect, which makes the omission the book's and not the scan's. The apostrophe is supplied here under the normalisation `corrections` declares for the abbreviated conclusion and the stop is not, under the same block's rule that where the page prints `Thro'` and stops, so does this file; seven entries above already stand that way. The page settles it for this file. It is the same class as the eight divergences under `sibling_transcription` -- the artifact regularising a conclusion the book does not set uniformly -- found this time on a locus the artifact had never been compared against, because this file had no entry here to compare it with."

