collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on leaf n698, printed p. 690, running head `8th ND 9th NOVEMBER.`. The witness prints this commemoration inside its 9 November entry, whose heading is `IX. DEDICATION of our SAVIOUR'S CHURCH.` above `All as in the Anniversary Mass, p. 504.`; the oration is set immediately under it as `COLLECT. (Deus, qui.) of St. Theodore.` and is followed by `SECRET. Of the same.` for the same saint. The Latin cue `Deus, qui` answers the 1962 incipit `Deus, qui nos beati Theodori Martyris tui`. The Kalendar at p. 776 (leaf n784) confirms the join: `9 Dedication of the Church of our Saviour, d. Com. of S. Theodore 690`. Date agrees: 9 November in both books. The witness prints only the Common's Mass for the Dedication itself -- see the `untranslated` row for `dedicatione-archibasilicae-mi-salvatoris` below."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who comfortest and protectest us by the glorious confession of blessed Theodore, thy martyr: grant we may be strengthened by his example, and assisted by his prayers. Thro'.
"""

[[entries]]
mass = "s-didaci-confessoris"
form = ""
proper = "Collect"
