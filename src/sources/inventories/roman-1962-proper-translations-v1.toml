We offer thee, O Lord, in memory of thy holy martyrs, Protus and Hyacinth, the gifts which are due to thee: grant, we beseech thee, that we may thereby receive the assistance necessary for eternal life.
"""

[[entries]]
mass = "comm-ss-proti-hyacinthi-martyrum"
form = ""
proper = "Postcommunion"
incipit = "Ut percepta nos, Domine, tua sancta purificent"
witness = "cummiskey-1861"
printed_page = "658"
