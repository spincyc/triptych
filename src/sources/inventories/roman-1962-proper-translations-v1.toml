reason = "the witness prints no proper Postcommunion for the day, only a pointer: leaf n672, printed p. 664, gives `XXVI. SS. CYPRIAN and JUSTINA, mm. All as in Mass IX. p. 479, except COLLECT. Beatorum. ... SECRET, (We bring) and P. Comm.(Praesta.) p. 479`. Page 479 was then opened: leaf n487 prints `P. COMM. Praesta.-Grant, we beseech thee, O Lord, by the intercession of thy holy Martyrs N. and N. that what we have taken with our mouths we may receive with a pure soul. Thro'.` -- with `N. and N.` where the 1962 writes `Cypriano et Justina`. The Secret named in the same rubric carries no name and is recorded as an entry above"

