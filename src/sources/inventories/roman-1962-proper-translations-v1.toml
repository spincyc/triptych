proper = "Collect"
incipit = "Da, quaesumus omnipotens Deus"
witness = "cummiskey-1861"
printed_page = "586"
ia_leaf = 594
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Printed inside XXV. St. ALDHELM, bp. of Salisbury, c. (25 May), p. 586 = leaf n594, under the cue line `Of St. URBAN. Da quaesumus.` The witness commemorates Urban within St Aldhelm's Mass where the 1962 sets the commemoration beside St Gregory VII on the same date; the date and the prayer are the same and the English names Urban, `thy martyr and bishop`, answering the 1962 Latin `beati Urbani Martyris tui, atque Pontificis`. The page prints no comma after `bishop`."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we who celebrate the feast of blessed Urban, thy martyr and bishop may be aided by his prayers to thee in our behalf. Thro'.
"""

[[entries]]
mass = "s-mariae-magdalenae-pazzis-virginis"
