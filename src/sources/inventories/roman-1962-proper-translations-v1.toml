note = "the witness keeps 5 January and prints no proper oration for St Telesphorus, only a pointer into its Common. Leaf n542, printed p. 534, running head `5th AND 13th JANUARY.`, gives `V. Octave of St. THOMAS of CANTERBURY. Mass as on his Feast, p. 85, with Commems. of the Eve of the Epiphany, of the Sunday within the Octave of Christmas, and of St. Telesphorus, by the Collect, &c. of Mass II. p. 464, &c.` Mass II was then opened: leaf n473, printed p. 465, running head `OF A MARTYR AND BISHOP`, prints `SECRET.-Sanctify, O Lord, the offerings consecrated to thee: and being appeased thereby, mercifully look upon us, by the intercession of blessed N. thy Martyr and Bishop. Thro'.` -- with `N.` and no saint's name. That is the same prayer the 1962 sets here with `Telesphoro` written in. An English for this slot would have to be made by writing a name the witness does not print, as at the Mennas, Sabbas and Sylvester rows. Reversible from leaf n473 alone if that ground is relaxed"

