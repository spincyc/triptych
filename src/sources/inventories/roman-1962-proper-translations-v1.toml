witness_note = "Leaf n1410, printed p. 1392. The witness prints the within-the-church clause in parentheses and directs that it is said only inside the church whose dedication is celebrated. This exact row addresses the extra-ecclesiam branch but preserves the witness's parenthesis instead of silently rewriting its English."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Bow down to our prayers, O Lord, we beseech Thee (that all of us who are within the precincts of this temple, the anniversary of whose dedication we celebrate, may please thee with full and perfect devotion of body and soul) that, while we pay our vows here below, we may, by Thine assistance, be worthy to attain unto everlasting rewards. Through our Lord.
"""

