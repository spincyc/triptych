ia_leaf = 660
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page"
witness_note = "Leaf n660, printed p. 652, running head `28th AUGUST`, heading `XXVIII. St. AUGUSTIN, bp. c. D.`, under which the day's commemoration is printed as `SECRET. (Of St. Hermes.)` with no Latin cue. It answers `Sacrificium tibi, Domine, laudis offerimus`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
We offer thee, O Lord, the sacrifice of praise in commemoration of thy saints: grant, therefore, we beseech thee, that what hath procured glory for them may avail to our salvation. Thro'.
"""

[[entries]]
mass = "comm-s-hermetis-martyris"
form = ""
proper = "Postcommunion"
incipit = "Repleti, Domine, benedictione coelesti"
witness = "cummiskey-1861"
printed_page = "652"
ia_leaf = 660
collated = "page-image, 2026-08-20"
collation_result = "recorded from the page; the page sets `tny clemency` with a turned h, corrected here to `thy` under the rule in `corrections`"
witness_note = "Same leaf as the Secret above, headed `P. COMM. (Of St. Hermes.)` and set with no Latin cue. It answers `Repleti, Domine, benedictione coelesti`. The page prints no comma after `thy martyr`."
[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Being fed with thy heavenly food, O Lord, we beseech thy clemency, that by the prayers of blessed Hermes, thy martyr we may partake of the salutary effects of the mysteries which we celebrate with humility. Thro'.
"""

[[entries]]
mass = "comm-s-gorgonii-martyris"
