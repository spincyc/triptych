collation_result = "provenance corrected; wording confirmed"
witness_note = "This entry carried printed_page 94 and ia_leaf 104, which is where the witness prints the same prayer under the First Sunday after the Epiphany. Page 94 does not print this wording: it reads `always enliven and defend us`, without the second `us`. The witness sets the prayer a second time, in full, at p. 110 under Sexagesima, and that setting is the one recorded here. Both pages were read on 2026-08-01. The wording was right and the page it was attributed to was wrong -- a citation that resolved successfully and to the wrong page, with the text it named on neither side of the error visible to any check."

