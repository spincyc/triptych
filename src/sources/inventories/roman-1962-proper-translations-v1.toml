[[untranslated]]
mass = "s-hilarii-episcopi-confessoris-ecclesiae-doctoris"
form = ""
proper = "Collect"
reason = "the witness reaches this day, and reaches it by reference. At XIV. St. HILARY, bp. c. it prints `All as in Mass XII. p. 485, with a Commem. of St. Felix`, and Mass XII is its Mass of Doctors, whose Collect it sets as `O God, who didst give Blessed N. to thy people for a minister of eternal salvation`. The 1962 Missal does not print N. here. At 14 Ianuarii it prints the Common's Mass by the same kind of reference and then sets the day's own orations with the saint named -- beatum Hilarium, Sancti Hilarii Pontificis, beatus Hilarius Pontifex tuus. So the witness's English answers the Common's Latin and not this day's, and the only step from one to the other is to write the saint's name into a prayer the witness does not write it into. That step is short and it is still project-composed text, so it is not taken. The Common's English is recorded at commune-doctorum-pontificis, where the witness prints it and where the Latin still reads N."

[[untranslated]]
mass = "s-hilarii-episcopi-confessoris-ecclesiae-doctoris"
form = ""
proper = "Secret"
reason = "the same reference and the same refusal as the Collect above, and a second reason on top of it: the witness's one Secret for Doctors renders `the pious prayers of thy holy servant N.`, which answers neither Latin form the 1962 typica prints, so it would not answer Sancti Hilarii Pontificis tui atque Doctoris even with the name supplied. See the commune-doctorum rows"

[[untranslated]]
mass = "s-hilarii-episcopi-confessoris-ecclesiae-doctoris"
form = ""
proper = "Postcommunion"
reason = "the same reference and the same refusal, and again a second reason: the witness's one Postcommunion for Doctors names a Confessor, `thy Confessor and great Doctor`, where this day's Latin reads beatus Hilarius Pontifex tuus et Doctor egregius. It answers the non Pontifice form of the Common, not this one"
