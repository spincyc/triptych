# English translations for the text-bearing propers of the roman-1962 calendar.
#
# This file sits in inventories/ rather than beside its calendar because the two
# validators leave nowhere else: `check-calendar-masses` reads every .yaml under
# src/sources/calendars as a mass index, and `source-library validate` rejects any
# file under src/sources outside its own schema. Its eventual home is inside each
# proper in propers.yaml, which is where the contract in
# src/sources/calendars/README.md puts `translations`; it is here only because
# another lane owns that file. See `merge` below.

translations_schema = 1
record_type = "calendar-proper-translations"
calendar = "roman-1962"
target = "src/sources/calendars/roman-1962/propers.yaml"
recorded_on = "2026-08-02"
