printed_page = "588"
ia_leaf = 596
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "The witness keeps the feast on 3 June, not the 1962's 29 May: heading III. St. MARY MAGDALEN of PAZZI, v., under the running head 2d, 3d, and 6th, June, p. 588 = leaf n596; its Kalendar (p. 771 = leaf n779) says the same and leaves 29 May empty. Directive `All as in Mass XIX. p. 498, except`; cue `Deus, virginitatis.` answers the 1962 incipit."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, the lover of purity, who didst inflame the breast of blessed Mary Magdalen with the fire of thy love, and enrich it with heavenly graces: grant we may imitate her purity and charity, whose festival we celebrate. Thro'.
"""

[[entries]]
mass = "s-norberti-episcopi-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui beatum Norbertum"
witness = "cummiskey-1861"
printed_page = "588"
ia_leaf = 596
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at VI. St. NORBERT, bp. c., under the running head 2d, 3d, and 6th, June, p. 588 = leaf n596. Directive `All as in Mass X.* p. 482, except`; cue `Deus, qui.` answers the 1962 incipit. Two readings settled at doubled magnification: the page prints no stop after `practised` before `Thro'.`, and that omission is reproduced (this file already records the book omitting stops before its conclusion elsewhere); the colon after `church` inks only its upper point on the scan and is written as the colon the syntax and the sentence's own grant-clause require."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst raise up blessed Norbert, thy confessor and bishop, to be an eminent preacher of thy word, and by him wast pleased to institute a new order in thy church: grant, we beseech thee, that by his merits we may obtain the help of thy grace to live according to what he taught and practised Thro'.
"""

[[entries]]
mass = "s-margaritae-reginae-viduae"
form = ""
proper = "Collect"
incipit = "Deus, qui beatam Margaritam Reginam"
witness = "cummiskey-1861"
printed_page = "590"
ia_leaf = 598
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at X. St. MARGARET, Queen of Scots, under the running head 10th and 11th June, p. 590 = leaf n598. Directive `All as in Mass XXI. p. 502. except`. CUE MISMATCH IN FORM: the page prints the cue `Deus, qui beatum.` (masculine) where the 1962 Latin reads `Deus, qui beatam Margaritam`; the reading was confirmed at doubled magnification and the cue is the book's own slip or its Latin's, since the English that follows names Margaret, `blessed Margaret Queen of the Scots`, and answers the day's Latin clause for clause. Recorded as what the page prints; the integrator decides what the mismatch means."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst render blessed Margaret Queen of the Scots, truly wonderful for her charities towards the poor: grant by her prayers and example, that thy charity may continually increase in our hearts. Thro'.
"""

# --- lasance-1945 entries, spliced 2026-08-21 --------------------------------
#
# Twenty-four mergeable English renderings read from the page images of the
# Lasance 1945 revised missal (Internet Archive item fr-lasance-missal-1937),
# witness `lasance-1945` above. Every row below is for a slot that had no
# English at all under the Cummiskey 1861 witness: the corresponding
# `[[untranslated]]` rows have been removed. The seven HELD rows from the same
# lane are NOT spliced here, because the 1962 slot's own Latin is still a
# placeholder; see the lane report.

# --- Holy Family (3) --------------------------------------------------------

[[entries]]
mass = "holy-family"
form = ""
proper = "Collect"
incipit = "Domine Jesu Christe, qui, Mariae"
witness = "lasance-1945"
printed_page = "179"
ia_leaf = 179
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n179, printed p. 179, running head `HOLY FAMILY`, under the heading `Prayer` inside the Mass headed `Holy Family` at pp. 178-182. The Latin column prints `Domine Jesu Christe, qui Mariae et Joseph subditus, domesticam vitam ineffabilibus virtutibus consecrasti: fac nos, utriusque auxilio, Familiae sanctae tuae exemplis instrui; et consortium consequi sempiternum: Qui vivis.`, which is the 1962 slot's text; the witness prints `Qui vivis` where the 1962 prints `Qui vivis et regnas`, a conclusion cue and not a variant."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O Lord Jesus Christ, Who, in the days of Thy subjection to Mary and Joseph, didst consecrate home life by ineffable acts of virtue; by the intercession of Thy holy Mother and of Thy foster-Father, make us so to profit by the example they with Thee have set us, that we may be counted members of Thy household for evermore. Who livest.
"""

[[entries]]
mass = "holy-family"
form = ""
proper = "Secret"
incipit = "Placationis hostiam"
witness = "lasance-1945"
printed_page = "181"
ia_leaf = 181
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n181, printed p. 181, running head `HOLY FAMILY`, under `Secret`. The Latin column reads `Placationis hostiam offerimus tibi, Domine, suppliciter deprecantes: ut, per intercessionem Deiparae Virginis cum beato Joseph, familias nostras, in pace et gratia tua firmiter constituas. Per eumdem Dominum.` The 1962 slot has `suppliciter ut` where the witness has `suppliciter deprecantes: ut`; the English renders the witness's reading, `humbly beseeching Thee that`."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
To appease Thee, O Lord, we offer the Victim of Salvation, humbly beseeching Thee that, through the prayers of the Virgin Mother of God and of St. Joseph, Thou wouldst establish our households in Thy peace and favor. Through the same.
"""

[[entries]]
mass = "holy-family"
form = ""
proper = "Postcommunion"
incipit = "Quos coelestibus reficis"
witness = "lasance-1945"
printed_page = "181-182"
ia_leaf = 181
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Begins on leaf n181, printed p. 181, under `Postcommunion`, and finishes on leaf n182, printed p. 182, running head `SUNDAY WITHIN THE OCTAVE`. Both leaves were opened. The Latin runs `Quos caelestibus reficis sacramentis, fac, Domine, Jesu sanctae Familiae tuae exempla jugiter imitari: ut, in hora mortis nostrae, occurrente gloriosa Virgine Matre tua cum beato Joseph; per te in aeterna tabernacula recipi mereamur: Qui vivis.` -- the 1962 slot's text, the witness's comma after `Domine` being the only difference."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Do Thou, O Lord, bring us whom Thou hast refreshed with heavenly mysteries to imitate the example of Thy holy Family, that at the hour of our death, with the Virgin Mother and blessed Joseph at hand, we may be received by Thee into our everlasting home. Who livest.
"""

# --- Commune Doctorum (3) ---------------------------------------------------

[[entries]]
mass = "commune-doctorum-pontificis"
form = ""
proper = "Secret"
incipit = "Sancti N. Pontificis"
witness = "lasance-1945"
printed_page = "1347-1348"
ia_leaf = 1365
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Begins on leaf n1365, printed p. 1347, running head `COMMON OF A DOCTOR OF THE CHURCH`, under `Secret`, and finishes on leaf n1366, printed p. 1348. Both leaves were opened. The Latin column prints ONE Secret, `Sancti N. Pontificis (vel Confessoris) tui atque Doctoris nobis, Domine, pia non desit oratio: quae et munera nostra conciliet; et tuam nobis indulgentiam semper obtineat. Per Dominum.`, and the English column carries the same alternative as `Thy bishop (or confessor)`. This slot's 1962 Latin is the Pontificis branch of that alternative, word for word outside the parenthesis, so the entry answers it; the parenthesis is left standing because resolving it would be an editorial act the witness did not perform. The same text is entered on commune-doctorum-non-pontificis for the other branch, and it is one reading of one page, not two."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
May the loving prayers of N., Thy bishop (or confessor), not be wanting to us, O Lord, to commend our gifts and ever to obtain pardon for us. Through our Lord.
"""

[[entries]]
mass = "commune-doctorum-non-pontificis"
form = ""
proper = "Secret"
incipit = "Sancti N. Confessoris"
witness = "lasance-1945"
printed_page = "1347-1348"
ia_leaf = 1365
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "The same one Secret on the same two leaves as the row above, taken here on its `(vel Confessoris)` / `(or confessor)` branch, which is this slot's 1962 Latin outside the parenthesis. One reading of one page serves both 1962 forms because the witness prints the alternative rather than the split."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
May the loving prayers of N., Thy bishop (or confessor), not be wanting to us, O Lord, to commend our gifts and ever to obtain pardon for us. Through our Lord.
"""

[[entries]]
mass = "commune-doctorum-pontificis"
form = ""
proper = "Postcommunion"
incipit = "Ut nobis, Domine"
witness = "lasance-1945"
printed_page = "1348"
ia_leaf = 1366
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n1366, printed p. 1348, running head `COMMON OF A DOCTOR OF THE CHURCH`, under `Postcommunion`. The Latin column prints `Ut nobis, Domine, tua sacrificia dent salutem: beatus N. Pontifex (vel Confessor) tuus et Doctor egregius, quaesumus, precator accedat. Per Dominum.` The 1861 witness had only a Confessor here, which is why this slot stood untranslated; this witness prints the Pontifex branch first and the entry answers it. The target file's existing commune-doctorum-non-pontificis Postcommunion entry, from cummiskey-1861, is left where it is: this row does not displace it."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
That Thy sacrifices may give us health, O Lord, may blessed N., Thy bishop (or confessor) and illustrious doctor, we beseech Thee, act as our intercessor. Through our Lord.
"""

# --- Comm. S. Canuti Regis, Martyris, 19 January (3) ------------------------

[[entries]]
mass = "comm-s-canuti-regis-martyris"
form = ""
proper = "Collect"
incipit = "Deus, qui ad illustrandam"
witness = "lasance-1945"
printed_page = "874"
ia_leaf = 872
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n872, printed p. 874, running head `JAN. 19-STS. MARIUS AND COMPANIONS`, under the rubric `Commemoration of St. Canute.` and the heading `Prayer`. The Latin column prints the 1962 slot's text entire, with `Dominicae` misprinted `Domincae`: `Deus, qui ad illustrandam Ecclesiam tuam, beatum Canutum regem martyrii palma et gloriosis miraculis decorare dignatus es: concede propitius: ut, sicut ipse Domin[i]cae passionis imitator fuit, ita nos per ejus vestigia gradientes, ad gaudia sempiterna pervenire mereamur. Per eumdem Dominum.` The name is printed, not an N., so nothing is substituted."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, Who for the enlightenment of Thy Church didst vouchsafe to distinguish blessed King Canute with the palm of martyrdom and with glorious miracles, mercifully grant, that as he was an imitator of the Lord's passion, so we, walking in his footsteps, may deserve to enter into everlasting joys. Through our Lord.
"""

[[entries]]
mass = "comm-s-canuti-regis-martyris"
form = ""
proper = "Secret"
incipit = "Accepta sit in conspectu"
witness = "lasance-1945"
printed_page = "876"
ia_leaf = 874
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n874, printed p. 876, same running head, under a second `Commemoration of St. Canute.` and `Secret`. Latin as the 1962 slot: `Accepta sit in conspectu tuo, Domine, nostra devotio: et ejus nobis fiat supplicatione salutaris, pro cujus solemnitate defertur. Per Dominum.` The prayer names no saint in either column, so the English is the Common's wording and the day's alike; that is the book's, not this file's, and it is why the English says `the holy martyr` where the heading says Canute."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
May our devout offerings, O Lord, be acceptable in Thy sight; and by the intercession of the holy martyr on whose festival they are laid before Thee, may they profit us unto salvation. Through our Lord.
"""

[[entries]]
mass = "comm-s-canuti-regis-martyris"
form = ""
proper = "Postcommunion"
incipit = "Refecti participatione muneris"
witness = "lasance-1945"
printed_page = "877"
ia_leaf = 875
collated = "page-image, 2026-08-21"
collation_result = "read-from-page"
witness_note = "Leaf n875, printed p. 877, running head `JAN. 20-STS. FABIAN AND SEBASTIAN`, under a third `Commemoration of St. Canute.` and `Postcommunion`. The Latin column reads `Refecti participatione muneris sacris` where the 1962 prints `muneris sacri`; `sacris` for `sacri` is a compositor's slip in this printing and does not reach the English. Everything else is the 1962 slot's text, with the name printed: `intercedente beato Canuto Martyre tuo`."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
Our strength renewed from having shared in Thy sacred gift, we beseech Thee, O Lord our God, that, by the intercession of blessed Canute Thy martyr, we may ever feel the mighty power of the Sacrament we worship. Through our Lord.
"""

# --- Commune Summorum Pontificum (6 of 9) ------------------------------------

[[entries]]
mass = "commune-summorum-pontificum"
form = ""
proper = "Collect"
incipit = "Gregem tuum, Pastor"
witness = "lasance-1945"
