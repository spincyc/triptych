reason = "the witness prints no proper Collect for this day. At 16 September, XVI. SS. CORNELIUS and CYPRIAN, mm., printed p. 660 = leaf n668, it prints `All as in Mass VII. p. 475, with a Commem. of SS. Euphemia, &c. mm.` and then only the commemoration's three orations (Collect Praesta, of Euphemia, Lucy and Geminianus). The 1962 Missal prints a proper Collect for this day -- the index's Collect slot is still a placeholder because the CMAA text layer wrecked it -- and the 1861 has no counterpart to it under any alignment: its whole formulary for the day is its Common, Collect included. The leaf was read at w1400 on 2026-08-19; the page that would reverse this row is p. 660 itself."

[[untranslated]]
mass = "comm-ss-placidi-sociorum-martyrum"
form = ""
proper = "Collect"
reason = "the witness reaches this day and reaches it by reference. At 5 October, V. SS. PLACIDUS and COMPANIONS, mm., printed p. 671 = leaf n679, it prints `All as in Mass IX. p. 479, except the Collect, Secret, and P. Comm. which are taken from Mass VIII. pp. 478, 479` and no oration of its own. Printed p. 478 = leaf n486 was opened as well: Mass VIII's Collect renders `O God, by whose favour we celebrate the festival of thy holy Martyrs N. and N. grant that we may enjoy their fellowship in eternal bliss` -- the same Latin form the 1962 fills for this day as Placidi et Sociorum ejus, but with the names left as N. and N. Writing `Placidus and his Companions` into it is project-composed text and is not done -- the same refusal as s-hilarii and comm-s-sabinae. The Common's English is recorded at commune-plurimorum-martyrum-2, where the witness prints it. Both leaves were read at w1400 on 2026-08-19."

