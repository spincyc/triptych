[[entries]]
mass = "easter-sunday"
form = ""
proper = "Sequence"
incipit = "Victimae paschali laudes"
witness = "caswall-1849"
detector = "read-on-page-images"
harvest_note = '''Read at Internet Archive item LyraCatholica1849, printed pp. 233-234 = leaves n270-n271, under the heading `Sequence, Easter-Sunday.` and the Latin incipit `Victimae Paschali laudes.` Six English stanzas answer the Missal's eight strophes, the fifth stanza carrying `Sepulcrum Christi viventis` and `Angelicos testes` together. The Missal's closing `Amen. Alleluja.` is not rendered; Caswall prints no acclamation.'''

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.edward-caswall.lyra-catholica.london-1849"
text = '''
Forth to the paschal Victim, Christians, bring
Your sacrifice of praise:

The Lamb redeems the sheep;
And Christ, the Sinless One,
Hath to the Father sinners reconcil’d.

Together, Death and Life
In a strange conflict strove;
The Prince of Life, who died,
Now lives and reigns.

What thou sawest, Mary, say,
As thou wentest on the way.

I saw the tomb wherein the Living One had lain;
I saw his glory as He rose again;
Napkin and linen clothes, and Angels twain:
Yea, Christ is risen, my hope, and He
Will go before you into Galilee.

We know that Christ indeed has risen from the grave:
Hail, thou King of Victory!
Have mercy, Lord, and save.
'''

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "artifact.edward-caswall.lyra-catholica.london-1849.missal-sequences-en"
