Current disposition, 2026-08-27: only 28 positive entries remain -- nine
Cummiskey rows with exact page-image and tracked-publication bindings, thirteen
Lasance rows with exact facsimile bindings, and six public-domain Sequence rows.
The other 501 exact identities are typed, text-free `untranslated` records. Of
those, 425 replace former positive leads that lacked the evidence their claims
required: 406 Cummiskey rows lacked a publication binding and 19 Lasance rows
lacked an exact artifact, passage and IA leaf-range binding.

Each retained entry names one proper by mass key, form label and proper name.
Set that proper's `translations` key to the entry's `translations` array
verbatim: the array already carries exactly the keys
`check-calendar-masses` validates -- lang, text, rights, and source_id for a
public-domain basis -- so the merge copies a structure and does not translate
between schemas.

Check `incipit` against the target proper before merging. An entry whose mass,
form, proper or incipit no longer answers the target is stale and must be
re-derived from the witness, never merged on the strength of its mass key alone.

`untranslated` merges nothing. It is the ledger of propers deliberately left
without English, so that a proper carrying no `translations` key can be
distinguished from one nobody looked at, and so that a page can say that no
English is recorded rather than showing Latin as though it were the answer.
"""
