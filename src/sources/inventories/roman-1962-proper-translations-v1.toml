Refreshed with the divine mysteries, O Lord, we humbly beseech Thee that, aided by the examples and the merits of blessed Cyril Thy Bishop, we may be able to serve worthily the most holy Mother of Thine only-begotten Son, Who with Thee liveth.
"""

