source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we who celebrate the festival of thy saints, Alexander, Eventius, Theodulus, and Juvenalis, may by their intercession, be delivered from all impending misfortunes. Thro'.
"""

[[entries]]
mass = "s-pii-v-papae-confessoris"
form = ""
proper = "Collect"
