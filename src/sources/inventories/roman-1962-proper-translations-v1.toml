[[entries]]
mass = "easter-vigil"
form_id = "main"
proper = "Blessing of the New Fire"
cycle = "all"
occurrence = 1
incipit = "Deus, qui per Filium tuum, angularem scilicet lapidem"
witness = "cummiskey-1861"
printed_page = "300"
ia_leaf = 308
ia_leaf_range = [308, 308]
artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ia-scan-pdf"
passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.verify-roman-1962-easter-vigil--main--blessing-of-the-new-fire--all--1"
publication_artifact_id = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.roman-1962-recovered-en"
publication_artifact_sha256 = "c61752839c8b04282bac27592749d63a4f0227d3fa051e62418f609c562eb54a"
publication_passage_id = "passage.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.publish-roman-1962-easter-vigil--main--blessing-of-the-new-fire--all--1"
collated = "page-image and tracked transcription, 2026-08-27"
collation_result = "confirmed"
witness_note = "The 1862 prints this as the FIRST of three prayers over the new fire; the 1955 order kept this one and dropped `Domine Deus, Pater omnipotens` and `Domine sancte, Pater omnipotens` (both of which the 1861 also prints, in English, on the same page). Its text at p. 179 is the 1962 index's word for word, the only difference being that the page sets the blessing cross inside the word, `sancti + fica`, where the index writes `sanctifica`. The 1861 renders that as `bless + this new fire`. The witness's `during this paschal solemnity. we may be so inflamed` reproduces a full stop the type sets there for a comma; it is left as printed. Page-image collation confirms that this historical English body answers the complete target Latin identity; publication is limited to the 1861 wording and does not claim that Cummiskey appoints the 1962 celebration."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = "O God, who by thy only Son, the chief corner-stone of thy Church, hast bestowed on the faithful the fire of thy divine love: bless + this new fire produced from a flint for our use: and grant that during this paschal solemnity. we may be so inflamed with heavenly desires, that with purity of mind, we may come to those festivals, where we may enjoy a light which will never end. Thro' the same. R. Amen."

