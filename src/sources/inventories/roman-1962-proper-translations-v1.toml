witness_note = "The witness prints `XXIII. St. RAYMOND of PENNAFORT, c.` at printed p. 543 = leaf n551 under the direction `All as in Mass XIII. p. 488, except`, and its MASS XIII is `Os justi, of a CONFESSOR not a BP` -- the same Common the 1962 sends the day to, Missa Os iusti de Communi Confessoris non Pontificis I loco, and the same single exception, praeter orationem sequentem. The two books agree on the Mass, on the one proper oration, and on its text: the Collect is cued `Deus, qui beatum` and names Raymond, as Deus, qui beatum Raymundum paenitentiae sacramenti insignem ministrum elegisti does. One divergence between the books is worth recording and does not touch the text: the 1861's own Roman Calendar for the United States, at printed p. 766 = leaf n774, keeps Raymond on 28 January and gives 23 January to the Espousals of the Blessed Virgin, while its Proper of Saints prints him under the heading XXIII. The page prints `port of eternal salvation. Thro'` and stops, with no full stop after the abbreviation and the next line beginning the commemoration of St Emerentiana; that is reproduced as printed, under the rule in `corrections` that a missing stop is not supplied. Read at 200 dpi and again at 400 dpi, and the conclusion at 400 again; no OCR text layer supplied a reading."

