witness_note = "The last of the three, headed `P. COMM. Quaesumus. Of the same.` at the head of printed p. 536 = leaf n544, above the rule that opens the Mass of St Paul the first Hermit. The Latin cue `Quaesumus.` and the named saint join it to the 1962 Quaesumus, Domine, salutaribus repleti mysteriis: ut, beati Felicis Martyris tui, cujus solemnia celebramus, orationibus adjuvemur. The Common's setting of the same prayer, at MASS VII p. 477, renders the clause in the plural and without a name, so the two are distinguishable and this is the day's. Read at 200 dpi and again at 400 dpi; no OCR text layer supplied a reading."

