english_oration_census = """
Recorded 2026-07-31, when the question was widened from this file's 99
collated entries to every English rendering of a non-scriptural proper the
repository carries. The honest total is small and worth stating plainly,
because it is easy to read the corrections above as the end of the problem
rather than as the result of having looked at two thirds of one file.

The repository serves English for 165 non-scriptural propers, all of them
here - 56 collects, 54 secrets, 55 postcommunions. Every one comes from this
file: `tools/mass-propers` builds the browser's data by overlaying this
inventory onto propers.yaml and reads no other translation source. The
browser's data serves each of them at every mass that takes it, which is
more days than there are entries. The postconciliar calendar carries 498 non-scriptural propers and no
English at all, by the ICEL rights decision recorded in
`postconciliar-proper-translations-v1.toml`, so no unverified English is being
served there. Outside the two calendars the only other English orations in the
tree are quotations of the sibling artifact through passage records, not an
independent rendering.

Of the 165, revised 2026-08-01:

  113  read against the 1861 page images on 2026-07-31 and 2026-08-01 - 59
       confirmed, 39 corrected, 14 recorded from the page in propers this file
       had declared the witness does not print, and 1 whose wording was
       confirmed and whose cited page was corrected. These carry `collated` and
       `collation_result`.
    2  never seen on a page, but matched word for word against a second
       Philadelphia printing of the same translation, the 1843 of Internet
       Archive item romanmissaltran00englgoog. These carry
       `detector = "second-printing-agrees"`.
   50  never seen on a page, but matched byte for byte by the independent
       temporal-orations-en transcription of the same book. These carry
       `detector = "sibling-agrees"`.
    0  never seen on a page and with no second reading of any kind.

The roman-1962 calendar appoints 174 distinct orations once every `takes_from`
is resolved, so 165 served leaves 9 without English, and all 9 carry an
`untranslated` row saying why. Nothing in that calendar's oration slots is
unaccounted for: there is no longer a proper that has neither English nor a
recorded reason for having none.

**The witness's sanctoral was reached for the first time on 2026-07-31.** Every
entry above it in this file renders a temporal oration, because the temporal is
all anyone had looked at. The 1861 book is not confined to the temporal. It
prints a Common of Saints in English from p. 459, as fourteen numbered Masses -
its MASS XII, In medio, is the Mass of Doctors at p. 486 - and a Proper of
Saints from p. 495. Its own front matter says so at p. 5, referring the reader
to "the Common of Saints, commencing at p. 459" and to "the Proper of Saints".
The 1843 printing carries both as well, at the same numbering, which means the
byte-level detector this file has wanted for the sanctoral already exists and
needs nothing new acquired.

So the premise that project-created English would be needed for the Commons is
false, at least for this Common: a public-domain witness this repository already
tracks prints it, in the same `Blessed N.` form the Latin uses. **No oration in
this file is a project-created translation. The count is zero, and it is zero
because a witness was found, not because none was attempted.**

Two limits were measured rather than assumed, and both matter to whoever
continues. The first is that the 1861 Common of Saints is a *pre-1955* Common:
where the 1962 typica prints two forms of a Secret or a Postcommunion, the
witness prints one, and its one English does not always answer either Latin.
Three propers of the Commune Doctorum are recorded `untranslated` for exactly
that reason, and the reason is written into each row. The second is that the
1861 Proper of Saints does not print every day the 1962 calendar keeps, and
how much of it the witness does reach has not been counted.

**Corrected 2026-08-01.** This paragraph used to name S. Hilarii at 14 January
as the instance of that second limit, and said the witness has no entry for
him. It has one. At `XIV. St. HILARY, bp. c.` the 1861 book prints `All as in
Mass XII. p. 485, with a Commem. of St. Felix`, and Mass XII is its Mass of
Doctors. The day is reached, by the same kind of reference the 1962 Missal uses
at the same date. What stops the English attaching is not absence but the
letter `N.`: the witness prints the Common's orations with the placeholder, and
the 1962 Missal prints this day's with the saint's name written in, so the two
texts are not the same text. The three rows now stand `untranslated` on that
ground and not on a false absence. Note what the wrong reason cost -- an
absence recorded against a witness had been read as a fact about the book when
it was a fact about a reader, which is the same error this file has now made
and corrected four times.

The detector field is the disagreement test of `sibling_transcription` above,
run over the whole file and recorded rather than left to be re-derived. It
came back with no open disagreements, which is the expected result: the
collation settled all 45 of them. What it does establish is the shape of what
remains. The 51 are backed by two independent readings of one book that agree,
and where those two agreed the page vindicated them 54 times out of 54 - good
evidence, and not the same thing as having looked.

**Eleven entries and one `untranslated` row removed, 2026-07-31.** They were
the four resumed Sundays after the Epiphany, which held the same three
orations this file already carried under `epiphany-3` through `epiphany-6`.
They were duplicates of the worst kind - the same English recorded twice
because the same Latin was recorded twice - and one had already drifted from
its twin, `resumed-epiphany-4`'s Collect carrying the incipit `Deus, qui nos,
in tantis periculis` where `epiphany-4` carried `Deus, qui nos`. The calendar
now says in data what RGMR 298 says in print, that those Sundays take the
Mass of the Sunday after the Epiphany they resume, and `mass-propers` looks a
borrowed proper's translation up under the mass that prints it. So the English
is served at eight masses from four entries rather than at eight masses from
eight, and the count above fell by eleven while nothing a reader sees was
lost.

**Corrected in place, 2026-07-31.** This census first reported a third
category, 7 entries that had "no evidence of any kind":

  palm-sunday               collect, secret, postcommunion
  mass-of-the-lords-supper  collect, postcommunion
  easter-vigil              collect, secret

and said of them: "The sibling deliberately excludes Palm Sunday, the rest of
Holy Week and the Easter Vigil, so no detector for these can ever exist and
only the page will settle them."

The first clause is true. The conclusion drawn from it was false. The 1861
Cummiskey printing this file already quotes prints Holy Week complete, from
Palm Sunday at printed p. 230 (leaf n240) to the end of Holy Saturday at p. 329
(leaf n337); every one of those seven orations is on those pages, and all seven
have now been read there. What was missing was never the page. It was the leaf
number. This file took `printed_page` and `ia_leaf` from the sibling; the
sibling stops before Holy Week; so no leaf number existed for any Holy Week
oration, no page was ever opened on one, and the gap in the borrowed apparatus
was written up as a gap in the evidence. The Internet Archive item's own
page-number map carries a printed page for every leaf in the book, and the
sibling's own artifact record says in terms that that map is where its leaves
came from. The means of settling these seven was one file away for as long as
the claim stood.

Two `untranslated` rows fell with it, and they are the more serious half.
Maundy Thursday's secret and the Easter Vigil's postcommunion were both
recorded as "no oration answering this proper was found in the witness", and
the witness prints both. The first straddles the page break at pp. 273-274 and
so is invisible to a search that reads one page at a time. The second is slot
displacement: the pre-1955 Mass on Holy Saturday has no postcommunion at all,
and the book prints that oration a page later as the Vespers prayer Spiritum on
p. 329. A matcher keyed on (mass, proper-name) will report such a prayer absent
from every pre-1956 witness while the words sit in print, which is exactly the
false absence recorded here; that reason is now written into the entry rather
than left to be re-derived by whoever meets it next.

Four `untranslated` rows still carried the same "not found in the witness"
wording - pentecost-3 collect, pentecost-6 secret and postcommunion,
pentecost-7 collect - and this paragraph said of them that nothing had
re-tested them and that on the evidence of the two that fell they should be
read as untested rather than as settled. **All four were tested on 2026-08-01
and all four fell.** The witness prints every one of them, three of the four on
pages this file had already opened and cited for a neighbouring oration in the
same mass. The prediction in the sentence above was right, and it is worth
leaving both halves of it standing, because the useful part is not that the
four were wrong: it is that the file could say which of its own claims were
untested, and that saying so is what got them tested.

The rule the seven were left under still holds and is why they were left: an
unverified entry recorded as verified is a worse defect than the OCR error it
hides. What it does not license is the inference that was drawn beside it. An
absence recorded against a witness is a claim about a reader until someone has
looked at the page.
"""

