note = "the witness reaches this day and reaches it by reference. At 5 October, V. SS. PLACIDUS and COMPANIONS, mm., printed p. 671 = leaf n679, it prints `All as in Mass IX. p. 479, except the Collect, Secret, and P. Comm. which are taken from Mass VIII. pp. 478, 479` and no oration of its own. Printed p. 478 = leaf n486 was opened as well: Mass VIII's Collect renders `O God, by whose favour we celebrate the festival of thy holy Martyrs N. and N. grant that we may enjoy their fellowship in eternal bliss` -- the same Latin form the 1962 fills for this day as Placidi et Sociorum ejus, but with the names left as N. and N. Writing `Placidus and his Companions` into it is project-composed text and is not done -- the same refusal as s-hilarii and comm-s-sabinae. The Common's English is recorded at commune-plurimorum-martyrum-2, where the witness prints it. Both leaves were read at w1400 on 2026-08-19."

