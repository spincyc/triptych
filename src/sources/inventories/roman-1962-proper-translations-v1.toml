[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945"
text = """
O God, Who didst make blessed Cyril, Thy Confessor and Bishop, the invincible champion of the most blessed Virgin Mary's divine maternity, grant through his intercession that we, who verily believe her to be the Mother of God, may be saved by her maternal protection. Through the same.
"""

