[[entries]]
mass = "commune-doctorum-pontificis"
form = ""
proper = "Collect"
incipit = "Deus, qui populo tuo"
witness = "cummiskey-1861"
detector = "second-printing-agrees"
witness_note = "The 1861 book prints the Common of Saints in English from p. 459, and the Mass of Doctors is its MASS XII, In medio, at p. 486. The Latin of this Collect is the same in both forms of the 1962 Commune Doctorum, and the witness prints one Collect, so the alignment is not in question. Read out of the text layer of Internet Archive item romanmissaltran00churgoog and matched word for word against the text layer of item romanmissaltran00englgoog, the 1843 Philadelphia printing of the same translation at its p. 486 -- two independent scans of two independent printings, which is the byte-level detector this file has wanted. No page image was opened."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst give Blessed N. to thy people for a minister of eternal salvation: grant we beseech thee, that he who was the instructor of our life here on earth, may become our intercessor in heaven. Thro'.
"""

[[entries]]
mass = "commune-doctorum-non-pontificis"
form = ""
proper = "Postcommunion"
incipit = "Ut nobis, Domine"
witness = "cummiskey-1861"
detector = "second-printing-agrees"
witness_note = "The witness prints one Postcommunion where the 1962 typica prints two, and its wording answers the second - thy Confessor and great Doctor against beatus N. Confessor tuus et Doctor egregius. It is therefore attached to the non Pontifice form only. The Pontifex form, beatus N. Pontifex tuus, has no English here; see the untranslated rows. Same two scans, agreeing word for word, and no page image opened."

