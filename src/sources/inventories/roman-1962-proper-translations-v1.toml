witness = "cummiskey-1861"
detector = "second-printing-partly-agrees"
second_printing_coverage = 0.8857
harvest_note = "The witness keeps the day -- `XII. St. GREGORY, p. c.` -- and sets this Collect proper to it, cued `Deus, qui.` and answering Deus, qui animae famuli tui Gregorii aeternae beatitudinis praemia contulisti. It does not print this day's Secret or Postcommunion; both stand untranslated below."
ia_text_layer_line = 32798

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who hast rewarded the soul of blessed Gregory, thy servant, with eternal bliss: mercifully grant that we who are oppressed by the weight of our sins, may find relief by his intercession. Thro'.
"""

[[entries]]
mass = "s-patricii-episcopi-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui ad praedicandam"
witness = "cummiskey-1861"
detector = "second-printing-agrees"
second_printing_coverage = 0.9231
harvest_note = "The witness keeps the day -- `XVII. St. PATRICK, ap. and patron of Ireland.` -- and sets this Collect proper to it, cued `Deus, qui.` and answering Deus, qui ad praedicandam gentibus gloriam tuam beatum Patricium Confessorem atque Pontificem mittere dignatus es."
ia_text_layer_line = 32844

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who wast pleased to send blessed Patrick thy Bishop and Confessor, to preach thy glory to the Gentiles: grant, that by his merits and intercession we may, through thy grace, be enabled to keep thy commandments. Thro'.
"""

[[entries]]
mass = "s-vincentii-ferrerii-confessoris"
