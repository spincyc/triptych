# English translations for the text-bearing propers of the roman-1962 calendar.
#
# This file sits in inventories/ rather than beside its calendar because the two
# validators leave nowhere else: `check-calendar-masses` reads every .yaml under
# src/sources/calendars as a mass index, and `source-library validate` rejects any
# file under src/sources outside its own schema. Its eventual home is inside each
# proper in propers.yaml, which is where the contract in
# src/sources/calendars/README.md puts `translations`; it is here only because
# another lane owns that file. See `merge` below.

translations_schema = 1
record_type = "calendar-proper-translations"
calendar = "roman-1962"
target = "src/sources/calendars/roman-1962/propers.yaml"
recorded_on = "2026-08-02"
merge = """
Each entry names one proper by mass key, form label and proper name. Set that
proper's `translations` key to the entry's `translations` array verbatim: the
array already carries exactly the keys `check-calendar-masses` validates -- lang,
text, rights, and source_id for a public-domain or licensed basis -- so the merge
copies a structure and does not translate between schemas.

Check `incipit` against the target proper before merging. An entry whose mass,
form, proper or incipit no longer answers the target is stale and must be
re-derived from the witness, never merged on the strength of its mass key alone.

`untranslated` merges nothing. It is the ledger of propers deliberately left
without English, so that a proper carrying no `translations` key can be
distinguished from one nobody looked at, and so that a page can say that no
English is recorded rather than showing Latin as though it were the answer.
"""
