printed_page = "548"
ia_leaf = 556
collated = "page-image, 2026-08-02"
collation_result = "recorded from the page"
witness_note = "The witness prints `XXIX. St. FRANCIS de SALES.` at printed p. 548 = leaf n556, on the same leaf as Peter Nolascus, and sets this Collect proper to the day, cued `Deus, qui.` and answering Deus, qui ad animarum salutem beatum Franciscum Confessorem tuum atque Pontificem omnibus omnia factum esse voluisti word for word, down to `should become all to all` for omnibus omnia factum. Where the books part is the Mass, and the reason is datable: the 1861 directs `All as in Mass X. * p. 482`, which is its Common of a Confessor and Bishop, while the 1962 directs Missa In medio, de Communi Doctorum -- the witness's own MASS XII at p. 485. Francis de Sales was not declared a Doctor of the Church until 1877, sixteen years after this printing, so the 1861 could not have filed him among the Doctors and did not. The day's one proper Collect is unaffected: it names him Confessor and Bishop in both books, and the pointer is what moved. This is the third divergence of Mass in this batch and the second where the witness is simply older than the 1962 arrangement; see the `caution` on the source row. Read at 200 dpi and again at 400 dpi; no OCR text layer supplied a reading."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who for the salvation of souls wast pleased that blessed Francis, thy Confessor and Bishop, should become all to all: mercifully grant, that, being plentifully enriched with the sweetness of thy charity, by following his directions, and by the help of his merits, we may obtain life everlasting. Thro'.
"""

