[[entries]]
mass = "comm-s-felicis-presbyteri-martyris"
form = ""
proper = "Collect"
incipit = "Concede, quaesumus, omnipotens"
witness = "cummiskey-1861"
printed_page = "535"
ia_leaf = 543
collated = "page-image, 2026-08-02"
collation_result = "recorded from the page"
witness_note = "First entry in this file for this mass, and the first for any day of the 1861 Proper of Saints: everything above renders a temporal oration or one of the Common of Saints. The witness reaches 14 January and reaches the commemoration by name. At `XIV. St. HILARY, bp. c.` it prints `All as in Mass XII. p. 485, with a Commem. of St. Felix, by the following Collect, &c.` and then sets the three commemoration orations under the day, this one cued `Concede.` before the English; the 1962 Latin is Concede, quaesumus, omnipotens Deus, and neither book writes a saint's name into it. That heading and that cue are the two books' own alignment and not a reader's. What the books do NOT agree on is the Mass: the 1962 gives this commemoration Missa Laetabitur, de Communi unius Martyris IV loco, and the 1861 has the day at its Mass XII of Doctors, because its 14 January is St Hilary's and it keeps Felix under him. Only the three orations are carried; see the `caution` on the source row. Read at 200 dpi and again at 400 dpi from `https://archive.org/download/romanmissaltran00churgoog/page/n543_w1400.jpg`; no OCR text layer supplied a reading. The sibling temporal-orations-en transcription reaches nothing in this batch -- its own `notes` exclude the whole sanctoral cycle -- so this entry and the fifteen after it carry one witness and no detector."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that the examples of thy saints may excite us to the amendment of our lives: that as we celebrate their festivals, so we may imitate their virtues. Thro'.
"""

[[entries]]
mass = "comm-s-felicis-presbyteri-martyris"
form = ""
proper = "Secret"
incipit = "Hostias tibi, Domine"
witness = "cummiskey-1861"
printed_page = "535"
ia_leaf = 543
collated = "page-image, 2026-08-02"
collation_result = "recorded from the page; the page prints no comma after `O Lord`"
witness_note = "Headed `SECRET of the same.` under the Commem. of St. Felix and straddling the page break: printed p. 535 = leaf n543 ends `by the merits` and printed p. 536 = leaf n544 opens `of blessed Felix thy Martyr`. Filed at the page where it begins, and the following leaf was read as well, which is the rule this file already applies at Maundy Thursday. The book names Felix in the prayer, as the 1962 Latin does -- beati Felicis Martyris tui -- so nothing is supplied and no `N.` stands in the way here as it does at s-hilarii. The witness sets this same prayer twice more with the placeholder, at MASS I p. 463 (`the offerings dedicated to thee ... of blessed N. thy Martyr and Bishop`) and at MASS XVII p. 497 (`by the merits of blessed N. thy Virgin and Martyr ... to us a continual support`); this is a third and distinct setting and is taken from the day, not from either Common. The page prints `Mercifully receive, O Lord the offerings` with no comma after `Lord`, on a line where `Lord` stands mid-line with the comma's place plainly empty; it is reproduced as printed. Read at 200 dpi and again at 400 dpi; no OCR text layer supplied a reading."

