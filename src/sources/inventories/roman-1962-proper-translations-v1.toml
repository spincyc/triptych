witness_note = "A cross-reference followed, the move that already settled the Collect of good-friday, the Advent Mass of the Blessed Virgin and the Christmas-to-Candlemas Mass. At 22 January the witness prints `SECRET.--We bring, as in Mass VIII. p. 479.` and prints no text there; p. 479 = leaf n487 is where it sets the prayer whole, and that is the book saying where its own text is, not an absence. The oration read at p. 479 is the last of Mass VIII before the rule that opens `MASS IX. Salus autem, of the same`, and the running head of that page already reads MASS IX while Mass VIII is still being printed under it -- the same trap recorded at corpus-christi. The English answers the 1962 Munera tibi, Domine, nostrae devotionis offerimus: quae et pro tuorum tibi grata sint honore justorum, et nobis salutaria, te miserante, reddantur clause for clause, and the 1962 sets the same prayer as this day's proper Secret while giving the day the FIRST Mass of the Common; the witness reaches it through the second. Two 1962 slots are therefore served from one printed English, this one and commune-plurimorum-martyrum-2's Secret above, and neither is a copy of the other. The page sets `of our devotion ; and` with a space before the semicolon, closed up here under the rule `corrections` declares. Read at 200 dpi and again at 400 dpi; no OCR text layer supplied a reading."

