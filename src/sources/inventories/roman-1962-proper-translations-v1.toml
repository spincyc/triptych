note = "the witness prints no proper Collect for this day. At 16 September, XVI. SS. CORNELIUS and CYPRIAN, mm., printed p. 660 = leaf n668, it prints `All as in Mass VII. p. 475, with a Commem. of SS. Euphemia, &c. mm.` and then only the commemoration's three orations (Collect Praesta, of Euphemia, Lucy and Geminianus). The 1962 Missal prints a proper Collect for this day -- the index's Collect slot is still a placeholder because the CMAA text layer wrecked it -- and the 1861 has no counterpart to it under any alignment: its whole formulary for the day is its Common, Collect included. The leaf was read at w1400 on 2026-08-19; the page that would reverse this row is p. 660 itself."

