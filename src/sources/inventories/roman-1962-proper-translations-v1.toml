text = """
O God, who amidst the delights of a court, and the attractive snares of the world, didst preserve holy Casimir constant and faithful in thy service: grant, we beseech thee, that by his intercession, thy people may despise the transitory things of this world, and eagerly pursue those that are everlasting. Thro'.
"""

