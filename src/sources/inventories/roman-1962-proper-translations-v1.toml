[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Let the participation of thy sacraments, O Lord, save us: and confirm us in the light of thy truth. Thro'.
"""

[[entries]]
mass = "comm-s-hermetis-martyris"
form = ""
proper = "Secret"
incipit = "Sacrificium tibi, Domine, laudis offerimus"
witness = "cummiskey-1861"
