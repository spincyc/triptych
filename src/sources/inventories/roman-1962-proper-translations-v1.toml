note = "the witness keeps the day and prints no proper Collect for it, only a pointer into its Common. Leaf n541, printed p. 533, running head `31st DECEMBER AND 2d JANUARY.`, gives the heading `XXXI. St. SYLVESTER, p. c.` and under it `INTROIT, Sacerdotes, p. 484. Collect, Secret and P. Comm. as in p. 482, with Commemorations of all the Festivals, from Christmas-day inclusively.`, printing an Epistle, Gradual, Gospel, Offertory and Communion for the day but no oration of any kind. Its Kalendar at p. 777, leaf n785, says the same: `31 S. Sylvester, c. bp. d. Com. of octaves 533`. Page 482 was then opened: leaf n490, running head `MASS X.* STATUIT,`, prints `COLLECT. Da, quaesumus.-Grant, we beseech thee, O Almighty God, that the venerable solemnity of blessed N. thy Confessor and Bishop, may improve our devotion, and strengthen in us the hopes of salvation. Thro'.` -- with `N.` and no saint's name. That is the same prayer the 1962 sets here with `Silvestri` written in, and this file already records it at commune-confessoris-pontificis-1 (printed_page 482, collated 2026-08-01). So an English for this slot would have to be made by writing a name the witness does not print, as at the Mennas and Sabbas rows above. Reversible from leaf n490 alone if that ground is relaxed"

