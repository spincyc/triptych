[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who gavest blessed Hermes, thy martyr, strength and constancy in his sufferings : grant, by his example, that for thy love we may despise whatever this world esteems great, and dread none of its terrors. Thro'.
"""

[[entries]]
mass = "s-hedwigis-viduae"
form = ""
proper = "Collect"
incipit = "Deus, qui beatam Hedwigem"
witness = "cummiskey-1861"
printed_page = "676"
ia_leaf = 684
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on leaves n684 (printed p. 676, running head `15th AND 17th OCTOBER.`) and n685 (printed p. 677, running head `18th OCTOBER.`), where the oration runs over the page break; filed at the page where it begins. Day heading verified: `XVII. St. HEDWIGES, w.` above `All as in Mass XXI. p. 502, except`. The Latin cue the witness prints before the English is `Deus qui`, which answers the 1962 incipit `Deus, qui beatam Hedwigem`. DATE DIVERGENCE, not a text divergence: this witness keeps Hedwiges on 17 OCTOBER, where the 1962 keeps her on 16 October; its Kalendar for November/October confirms the book's own placement. The 1962 mass carries `takes_from` commune-non-virginum-2 and the witness likewise sends the day to its own Common (Mass XXI, p. 502) `except` this Collect, so both books agree that the Collect is the day's own."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst teach blessed Hedwiges to fly from the pomps of the world and with her whole heart to embrace the humility of the cross: grant, by her merits and example, that we also may learn to tread under our feet the fading pleasures of this world, and to overcome all that standeth in the way of our salvation, by embracing thy cross. Who livest.
"""

[[entries]]
mass = "comm-ss-ursulae-ac-sociarum-virginum"
form = ""
proper = "Collect"
incipit = "Da nobis, quaesumus Domine"
witness = "cummiskey-1861"
printed_page = "678"
ia_leaf = 686
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on leaves n686 (printed p. 678, running head `19th AND 21st OCTOBER.`) and n687 (printed p. 679, running head `22d OCTOBER.`), the oration running over the page break; filed at the page where it begins. Day heading verified: `XXI. SS. URSULA and her Companions, mm.` above `All as in Mass XVIII. p. 497, except`. The Latin cue printed before the English is `Da nobis`, which answers the 1962 incipit `Da nobis, quaesumus Domine Deus noster`. Date agrees: 21 October in both books. The witness keeps Ursula as a day of her own where the 1962 keeps her as a commemoration; the oration is the same slot in both."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we may celebrate the victories of thy holy virgins, SS. Ursula and her companions, with a constant devotion: and that although we cannot celebrate them as we ought, we may however aim at this duty with all humility. Thro'.
"""

[[entries]]
mass = "s-caroli-episcopi-confessoris"
