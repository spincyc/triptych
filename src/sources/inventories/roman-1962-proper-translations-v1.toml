collation_result = "recorded"
witness_note = "Read on leaf n702, printed p. 694, running head `15th, 16th, AND 17th NOVEMBER.`. Day heading verified: `XV. St. GERTRUDE, v.` above `All as in Mass XIX. p. 498, except`; the whole oration stands on this page. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui in corde beatae Gertrudis Virginis`. DATE DIVERGENCE, not a text divergence: this witness keeps Gertrude on 15 NOVEMBER, where the 1962 keeps her on 16 November. Its own Kalendar agrees with itself -- p. 776, leaf n784, `15 S. Gertrude, v. d. 694` and `16 S. Edmund, c. bp. d. 694` -- so this is the book's calendar and not a misreading of the heading."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who didst prepare an agreeable abode for thyself in the heart of blessed Gertrude, the Virgin, graciously cleanse our hearts, we beseech thee, through her merits and intercession, from all stains, and grant we may enjoy the same happiness with her. Thro'.
"""

[[entries]]
mass = "s-felicis-valois-confessoris"
form = ""
proper = "Collect"
incipit = "Deus, qui beatum Felicem"
witness = "cummiskey-1861"
printed_page = "699"
ia_leaf = 707
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read on leaf n707, printed p. 699, running head `26th AND 27th NOVEMBER.`. Day heading verified: `XXVI. St. FELIX VALOIS, c.` above `All as in Mass XIV. p. 489, except`; the whole oration stands on this page, and the Proper of Saints ends four inches below it, `VOTIVE MASSES.` beginning on the same page. The Latin cue printed before the English is `Deus, qui`, which answers the 1962 incipit `Deus, qui beatum Felicem Confessorem tuum`. DATE DIVERGENCE, not a text divergence: this witness keeps Felix of Valois on 26 NOVEMBER, where the 1962 keeps him on 20 November. Checked both ways on the page: leaf n703 (printed p. 695, running head `19th AND 20th NOVEMBER.`) gives 20 November to `XX. St. EDMUND, King and m.`, and the Kalendar at p. 776 (leaf n784) reads `20 S. Edmund, king and m. d. 695` and `26 S. Felix of Valois, c. d. 699`. The book is consistent with itself; it is not the 1962's calendar."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who by thy heavenly inspiration didst call blessed Felix thy confessor, out of the desert to exercise his charity in the redemption of captives: grant, that having obtained thy grace by his intercession, we may be freed from the captivity of sin, and brought safe to our heavenly country. Thro'.
"""

[[entries]]
