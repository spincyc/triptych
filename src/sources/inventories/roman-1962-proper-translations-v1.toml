note = "the witness reaches this day and reaches it by reference. At 29 August, under XXIX. DECOLLATION of St. J. BAPTIST at printed p. 653 = leaf n661, it prints `Collect, &c. of St. Sabina, as in p. 493` and no Collect of its own for her. Printed p. 493 = leaf n501 was opened as well: it is MASS XVI. Loquebar, of a Virgin and Martyr, and its Collect renders `we, who solemnize the festival of blessed N. thy Virgin and Martyr, may, by following her example, come to thee` -- the name left as N. and the style Virgin and Martyr, where the 1962's own Collect for this day names her and reads beatae Sabinae Martyris tuae, without Virginis. The only step from the witness's English to this day's Latin is to write a name the witness does not print into a prayer whose form it does not print either, and that step is project-composed text, so it is not taken -- the same refusal as s-hilarii. The Common's English is recorded at commune-virginum-1, where the witness prints it. Both leaves were read at w1400 on 2026-08-19."

