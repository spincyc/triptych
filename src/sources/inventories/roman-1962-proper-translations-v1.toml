ia_text_layer_line = 40117

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Enlighten the hearts of thy faithful, O most merciful God, and by the prayers of blessed Elizabeth, grant we may despise the pleasing things of this world, and ever be refreshed with the comforts of heaven. Thro'.
"""

[[entries]]
mass = "commemoratione-omnium-fidelium-defunctorum"
form = "First Mass (Ad primam Missam)"
proper = "Offertory"
incipit = "Domine Jesu Christe, Rex gloriae"
witness = "cummiskey-1861"
detector = "second-printing-partly-agrees"
second_printing_coverage = 0.7292
harvest_note = "The witness keeps no Mass for 2 November: its Proper of Saints goes from All Saints to `IV. St. CHARLES BORROMEUS`. It does print this Offertory whole, in its parallel Latin and English columns, in its MASSES FOR THE DEAD, beside `Domine Jesu Christe, Rex gloriae, libera animas omnium fidelium defunctorum de poenis inferni, et de profundo lacu` -- the same text, word for word, that the 1962 sets at all three of this day's Masses. The join is the Latin the witness prints beside its own English and not a reader's alignment, and it holds for all three forms because the 1962 prints one Offertory for all three. What the witness does NOT reach is this day's proper orations; those stand untranslated below."
ia_text_layer_line = 30218

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Lord Jesus Christ, King of Glory, deliver the souls of all the faithful departed from the flames of hell, and from the deep pit. Deliver them from the lion's mouth, lest hell swallow them, lest they fall into darkness: and let the standard bearer, St. Michael, bring them into the holy light: * Which thou promisedst of old to Abraham and his posterity. V. We offer thee, O Lord, a sacrifice of praise and prayers: accept them in behalf of the souls we commemorate this day: and let them pass from death to life. * Which, &c.
"""

[[entries]]
mass = "commemoratione-omnium-fidelium-defunctorum"
form = "First Mass (Ad primam Missam)"
proper = "Tract"
incipit = "Absolve, Domine, animas omnium fidelium defunctorum"
witness = "cummiskey-1861"
detector = "second-printing-agrees"
