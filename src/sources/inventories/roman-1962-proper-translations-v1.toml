corrected. 37 of those 45 were this file being wrong and have been fixed against
the page; what remains is the 8 the artifact got wrong and has not been corrected
for, plus two loci the 2026-07-31 comparison could not have seen, because this
file then carried no entry for `epiphany-2` or for `corpus-christi` at all. Those
two are the argument for making the detector standing rather than running it once:
each is a divergence that appeared after the hand comparison, and no hand was
going to run it again. The second of them says more than the first, because it
did not appear when an absence was refuted -- it appeared when a mass this file
had never mentioned was entered for the first time, which is a source of new
divergences that will keep producing them for as long as the calendar keeps
landing formularies.

The check does not fail on a disagreement. It fails on an UNRECORDED one, and on
a `disagreement` left at a locus where the two witnesses now agree. The line is
drawn there and not at disagreement itself because the base rate is high -- 45 in
153 before correction, and near a third of any future batch if it holds -- and a
gate that is red on arrival gets silenced rather than answered, which is how a
check stops meaning anything. A gate on the unrecorded case asks for one sentence
per locus and cannot rot in either direction: a new divergence fails until
somebody looks, and a note left behind by a correction fails until it is deleted.

Agreement is checked too, in the one direction this file had already asserted it.
50 entries carry `detector = "sibling-agrees"`, which until now was a claim typed
beside the text and read by nothing; it is now held to the attached second witness
and fails if the two differ or if there is no second witness to compare. All 50
hold as recorded. That is worth having: of the 54 loci where the two
transcriptions agreed before the collation, the reading was right at 54.
"""

