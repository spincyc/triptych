collation_result = "recorded"
witness_note = "Read on leaf n701, printed p. 693, running head `13th AND 14th NOVEMBER.`. Day heading verified: `XIII. St. DIDACUS, c.` above `All as in Mass XIV. p. 489, except`, and the whole oration stands on this one page. The Latin cue printed before the English is `Omnipotens`, which answers the 1962 incipit `Omnipotens sempiterne Deus, qui dispositione mirabili`. Date agrees: 13 November in both books; Kalendar p. 776 (leaf n784) `13 S. Didacus, c. sd. 693`. Both books send the day to a Common `except` this Collect -- the 1962 to commune-confessoris-non-pontificis-2, the witness to its Mass XIV, p. 489."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O Almighty and eternal God, who, by a wonderful providence, makest choice of the weak things of this world to confound the strong: mercifully grant, that, being perfected in all humility, we may be raised by the prayers of thy holy Confessor, blessed Didacus, to the everlasting glory of heaven. Thro'.
"""

[[entries]]
mass = "s-gertrudis-virginis"
form = ""
proper = "Collect"
incipit = "Deus, qui in corde beatae Gertrudis"
witness = "cummiskey-1861"
printed_page = "694"
