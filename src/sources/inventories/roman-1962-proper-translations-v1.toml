witness = "cummiskey-1861"
printed_page = "696"
ia_leaf = 704
collated = "page-image, 2026-08-19"
collation_result = "recorded"
witness_note = "Read at the day's own heading, XXI. PRESENTATION of the B. V. MARY, under the running head 21st, 22d, and 23d November, p. 696 = leaf n704. The witness's directive is `All as in the Votive Mass, p. 507, except` followed by this Collect; the printed cue `Deus, qui.` answers the 1962 incipit. The English closes `presented before thy divine Majesty in the temple of God` where the 1962 Latin reads `in templo gloriae tuae praesentari mereamur`; the rendering is free but the cue and the day are the book's own join, and the text is recorded as printed."

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
O God, who wast pleased that blessed Mary, ever a Virgin, become an abode for the Holy Ghost should this day be presented to thee in the temple: grant, by her intercession, that we may be presented before thy divine Majesty in the temple of God. Thro'.
"""

