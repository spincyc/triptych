ia_leaf = 337
collated = "page-image, 2026-07-31"
collation_result = "recorded from the page; this proper had been filed as untranslated, and it was not"
witness_note = "Slot displacement, not absence. The pre-1955 Mass on Holy Saturday has no postcommunion -- the same page directs that neither Agnus Dei, Communion nor P. Comm. are said -- and the book prints this oration a page later as the PRAYER Spiritum of the Vespers that follow the Mass. A matcher keyed on (mass, proper-name) therefore reports the prayer absent from every pre-1956 witness while the words sit in print. The 1962 Missal appoints the same oration as the Vigil's postcommunion, and the wording here is the book's own, not the Easter Sunday postcommunion on p. 332, which it differs from: `love; and those` for `love: that those`, and no comma after `goodness`."

