harvest_note = "As the Offertory above: not printed at 2 November, which the witness does not keep, but printed whole in its MASSES FOR THE DEAD beside `Absolve, Domine, animas omnium fidelium defunctorum ab omni vinculo delictorum` with both its verses, which is the text the 1962 sets at all three of this day's Masses."
ia_text_layer_line = 29885

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Release, O Lord, the souls of all the faithful departed from the bonds of their sins. V. And by the assistance of thy grace may they escape the sentence of condemnation. V. And enjoy the bliss of eternal light.
"""

