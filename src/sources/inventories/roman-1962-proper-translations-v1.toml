ia_text_layer_line = 33157

[[entries.translations]]
lang = "en"
rights = "public-domain"
source_id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
text = """
Grant, we beseech thee, O Almighty God, that we who solemnize the festival of thy holy Martyrs, Tiburtius, Valerian, and Maximus, may likewise imitate their virtues. Thro'.
"""

[[entries]]
mass = "comm-ss-tiburtii-valeriani-maximi-martyrum"
