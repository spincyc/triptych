# Page collation of the 63 seasonal entries the calendar read out of an OCR
# text layer. This file records what the facsimile says; it does not change
# propers.yaml.

collation_schema = 1
record_type = "calendar-proper-citation-collation"
calendar = "roman-1962"
section = "seasonal"
target = "src/sources/calendars/roman-1962/propers.yaml"
collated_on = "2026-07-31"

scope = """
The 63 seasonal entries added to `propers.yaml` for the temporal days the
Missal keeps and the file did not - the three Advent Ember Days; Ash Wednesday
and the three days after it; every feria of Lent weeks 1-4 with the Lenten
Ember Days; the ferias of Passion week and Holy Week to Wednesday; the Chrism
Mass; the Easter octave; the Rogation Mass; the Vigil of the Ascension, the
Ascension and the Vigil of Pentecost; the Whitsun octave with its Ember Days;
the Mass of the First Sunday after Pentecost; Corpus Christi; the Sacred Heart;
and the September Ember Days.

The set was not taken from the file's own prose. It was derived as the
difference between the seasonal mass keys at ca03d9ad^ (62) and at ca03d9ad
(125), which is exactly 63 keys, and every one of them is still present at
HEAD. Each entry carries only its scripture-bearing propers; its orations and
composed chants were never transcribed, so nothing here collates an oration.
Four of the 63 carry two forms - a longer and a shorter Mass - and both forms
of each were read.

Across the 63 entries the recorded propers hold 490 citation loci. Every one
was compared against the printed page.
"""

witness = """
CMAA-hosted facsimile of the 1962 Vatican editio typica, artifact
`artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf`,
sha256 648fdb8fe830ed65a08aa4a95de6f94424c533ddf2398c8fc26b18735fd3518a,
82,815,941 bytes, 1,088 PDF pages. The artifact record declares the payload
remote; a copy already present under untracked `build/` was hashed and matched
that digest before any reading was taken from it, so this collation rests on
the exact bytes the repository pins.

`printed_page` is the page number the 1962 book prints; `pdf_page` is the page
of that PDF. Throughout the Proprium de Tempore the offset is constant:
pdf_page = printed_page + 81. That relation was not assumed - it was read off
the printed folios visible on the rendered pages.
"""

method = """
The pages holding the 63 formularies were rasterized at 200 dpi in greyscale
and read as images. No OCR text layer was allowed to supply a reading: the text
layer is the very witness under audit, and the two would not have been
independent. The PDF's text layer was used only to locate a formulary's pages
before rendering.

Only what the page prints was collated: the mass heading, the printed rank
(`I classis` and the rest), the printed part labels, and the scriptural
reference printed beside each part. Nothing was changed on the strength of
plausibility. Where the recorded form and the printed form differ only in
notation - `Ps. 18, 6 et 7` against a recorded range 6-7, or `Ps. 24, 17, 18
et 1-4` against `Psalm 24:17-18, 1-4` - the locus is confirmed, because the
two denote the same verses. The book's `i` for the file's `j` and the file's
English book names for the book's Latin abbreviations are declared conversions
in `propers.yaml` and are likewise not defects.
"""

findings = """
468 of the 490 loci are confirmed as printed. 22 are wrong, and all 22 are of
one kind: the page prints a reference the file does not carry. 21 are an
Introit or blessing antiphon whose printed psalm verse - the `Ps. ibid., N`
that follows the antiphon's own reference - was dropped, so the entry records
the antiphon alone. The 22nd is Ember Saturday of Lent, whose Third Gradual the
book gives as `Ps. 89, 13 et 1` and the file records as `Psalm 89:13`.

Not one citation that the file does record was found to be misread. The defect
is uniformly omission, not corruption, which is consistent with a text layer
that lost small italic figures rather than one that garbled them.

The file already suspected this class: its open collation items say that "an
Introit's psalm verse was recorded only where the scan showed its printed verse
numbers, so a new Introit carrying one passage is not evidence that the Missal
appoints no psalm verse there". That warning is now answered for these 63
entries - the Missal does appoint one at all 21 places, and the page names it.

The file also contradicts itself at two of the 22, which is how the defect
could have been caught without the facsimile. `Convertere, Domine,
aliquantulum` is recorded as `Psalm 89:13, 1` at Ember Friday of September and
at Ember Saturday of September, and as `Psalm 89:13` at Ember Saturday of Lent;
the page prints `Ps. 89, 13 et 1` at all three. The Introit `Miserere mihi,
Domine, quoniam tribulor` carries its psalm verse at Saturday of Passion week
and not at Friday of Passion week; the page prints it at both.

Three entries are confirmed with a qualification, recorded in `qualified`
below. Nothing else in the 63 was disturbed.
"""

qualified = """
easter-thursday, Introit psalm verse (printed p. 336, pdf p. 417). The Missal
prints `Ps. 79, 1` over the words `Cantate Domino canticum novum: quia
mirabilia fecit`, which are Psalm 97:1 and not Psalm 79:1. The file records
`Psalm 97:1` and its open collation items say "the scan reads the Introit psalm
verse as Ps. 79, 1". The page confirms that this is not a scanning artefact:
the book itself prints `Ps. 79, 1`. So the file's recorded value is a
deliberate emendation of the printed reference, and the note should say the
Missal prints it rather than that the scan reads it. Left as recorded, because
correcting the entry to the printed `Psalm 79:1` would point the reader at
verses the antiphon does not quote.

rogation-mass (printed pp. 347-349, pdf pp. 428-430). The file records no rank.
The book prints no `classis` line under this heading either, so the absence is
right; but the rubric on printed p. 348 does say the Mass is celebrated
`tamquam votiva II classis`, which a rank field could carry.

vigil-of-the-ascension, Alleluia (printed p. 350, pdf p. 431). The Missal
prints two Alleluia verses here. The first, `Surrexit Christus, et illuxit
nobis`, carries no reference; the second, `Exivi a Patre`, is referenced
`Ioann. 16, 28`. The entry takes its incipit from the first verse and its
citation from the second. Both readings are as printed, but the pairing is the
file's and not the book's.
"""

applying = """
Nothing here has been applied. The 22 corrections belong in
`src/sources/calendars/roman-1962/propers.yaml`, which another lane held open
while this collation ran - at the time of writing its working copy does not
parse - so this file states the printed reading and leaves the edit to the
owner of that path. `should_read` gives the full `ref` string each proper's
`verses` list should produce once the missing citation is added; the omitted
reference is always a second entry in that list, never a change to the one
already there.

When they are applied, the corresponding open collation item in `propers.yaml`
- the one warning that an Introit's psalm verse was recorded only where the
scan showed its numbers - can be narrowed to the entries outside these 63,
and the note on easter-thursday can be restated as above.
"""
