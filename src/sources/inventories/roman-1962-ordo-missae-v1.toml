note = "ANTECEDENT WORDING, COLLATED WORD-EXACT (C26 common Hanc igitur). The 1861 Cummiskey facing Latin (canon-missae-la seq 10, unchanged in canon-missae-la-turn-divided-2026-10-20, printed pp. xxxiv-xxxv, IA leaves n44-n45, artifact PDF pp. 45-46) was collated in full, Hanc through Amen, on 2026-10-20 with the 1962 typical edition, n. 1091, printed p. 303, artifact PDF p. 384, both read on page images at 200 and 400 dpi. All 39 spoken words agree exactly under the declared orthography; no prayer word is added, omitted or substituted. Differences are transformations only: ligatures, stress accents, capitals, jubeas/iubeas and pointing, including the source em rule between nostrum. and Amen., which is retained. The target Iungit manus. after numerari. and before Per Christum is an inline hand-joining rubric, absent from this source Latin row and separately accounted as ritual action, not a spoken wording variant. This finding establishes prayer wording only and supplies no target rubric, source change, new role or rights basis."



