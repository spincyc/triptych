schema = "triptych-ordo-missae/v1"
calendar = "roman-1962"
title = "The Ordinary of the Mass"

advisory = """
A pre-1955 lay hand missal's Ordinary, and never a book to celebrate from. \
The English here is the anonymous translation an 1861 Philadelphia printing \
made for the laity to follow the Mass with; it is not an approved liturgical \
translation, it was never an altar book, and nothing in it may be used for \
recitation. It is carried under the 1962 Missal because the Ordinary is \
substantially the same rite, but it is a witness to the discipline in force \
before the 1955 and 1960 reforms, and it differs from the 1962 typical edition \
in orthography and in some rubrics. Six blocks whose own source rows say in \
terms that the 1962 Ordo Missae does not contain them, and the six blocks of \
the second-Postcommunion regime and the added prayer Et famulos that the \
verified 1962 Ordo passages show it does not print, are excluded from the \
target frame and retained in its explicit exclusion accounting; a difference \
that does not establish non-membership remains an uncollated antecedent. Both \
of the book's columns are now \
transcribed: the Latin named below is the 1861 printing's own, read from the \
facing column of the same openings, and it is a pre-1955 witness to the rite \
and never the text of the 1962 typical edition - its Communicantes prints no \
clause naming St Joseph, its Prefaces are the eleven this book knew, and its \
spelling, its j and its ae and oe ligatures are its own. Where the book sets a \
block across the full measure in English and prints no facing Latin at all, \
that silence is the witness's own and the element says so. Where the 1962 \
Missal appoints a text the 1861 book does not print, or prints differently, \
the element names its own witness: the proper Communicantes and Hanc igitur of \
Pentecost and Easter and the continuation the 1962 Canon prints for every \
Communicantes come from a project editorial projection over public-domain \
printings, and the Hanc igitur's English from the Lasance hand missal.
"""

derived_from = """
Every element but those the canon section inserts with a witness of its own \
is read from a tab-separated artifact under \
edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861, one row \
per printed block, transcribed visually from page images of the facsimile \
registered as that edition's ia-scan-pdf artifact at 640 dpi with doubtful \
characters re-read at 1600 dpi. The book's facing Latin column is transcribed \
in six sibling artifacts of the same edition, named on the sections below as \
artifact_latin, on the same division into printed blocks and joined to the \
English by element_key; they were read on 2026-08-20 from that item's own page \
images, and they carry a row only where the page prints facing Latin. Nothing \
about an element's order, kind, speaker, page or wording is restated in this \
file: it names the artifacts and the order they stand in, and the artifacts \
carry the words and the hashes.
"""

slots_derived_from = """
Where each proper of the day stands inside this frame is read from the 1962 \
typical edition itself - the Ritus servandus in celebratione Missae and the \
Ordo Missae - and not from the 1861 witness whose words the elements carry. \
Each slot names the paragraph of the Ritus servandus that states the place; \
where the position of a seasonal chant is stated instead by a rubric of the \
Proprium de Tempore, the slot names that rubric beside it, by its marginal \
number and printed page. \
The two books agree on the order of these nine positions, which is why the \
anchors below are 1861 elements and the loci are 1962 rubrics; where they did \
not agree, no slot would be declared.
"""

qualified_variants = """
A slot marked `qualified` claims, besides the names it lists, any name of the \
form `<listed name> (<qualifier>)`. The parenthesis is this project's own way \
of writing a further or alternative text of the same kind in \
src/sources/calendars/roman-1962/propers.yaml; it is a naming convention, it \
carries no liturgical claim, and nothing acquires a place by being parsed. \
What carries the claim is the slot's own locus, which has to say on what \
rubric such a text stands in that same place. The flag is set per slot and per \
calendar, so an inventory that sets none keeps exactly the names it lists.

What the flag does NOT settle is whether a given variant is said IN ADDITION \
to its family or INSTEAD of it. `Collect (Altera oratio)` is a further oration \
and `Collect (in plurali)` an alternative wording, and both stand in the same \
place, which is all a seat can say. That choice is not modelled anywhere in \
this repository and is recorded as an open item in the calendar's own \
`open_collation_items`.
"""

not_decided_here = [
  "What the 1962 typical edition prints. This is an 1861 witness to the same rite, not a transcription of the 1962 altar book, and the two are collated element by element only where an element's own provenance says so: since 2026-10-19 (C2 gap G19) that is the Latin of every element the 1962 Pentecost Missal mode exercises, except the 1861's own Gloria heading and the Dominus vobiscum before the Postcommunion, which the 1962 Ordo prints at no place of its own.",
  "Which Preface, Communicantes or Hanc igitur a given formulary takes. The formulary's own printed direction is the mass index's `ordinary_appointments`; this file declares only what the frame shows for each appointed option, the dated spans and defaults the book's own Canon headings state (`[[appointments]]`), and a typed stand-in where nothing establishes the appointment.",
  "Anything about how the rite is performed. The rubrics transcribed here are the book's own, in its own words, and are evidence of what it printed in 1861 and of nothing else.",
  "Whether any element's Latin is the wording the 1962 typical edition prints, except where an element's own provenance declares a collation. The Latin here is this 1861 book's own, transcribed from its facing column; the departures that are known are named on the elements that carry them and in the advisory above. Element-level collations (2026-10-19, `element_provenance` below) cover the Holy Spirit Preface, the head of the common Communicantes and, under C2 gap G19, the Latin of every other element the 1962 Pentecost Missal mode exercises: 85 of those agree word for word and are exact-target; twelve are recorded as variants or abbreviated bodies with their differences named, and stay antecedents. Every other 1861 element stays uncollated.",
  "Where a proper stands that the Ordo Missae does not place. A slot is declared only where the 1962 book states the position in terms; the oration super populum of the Lenten ferias, the chants of an Ember Saturday after the first, and the whole of Good Friday and the paschal Vigil are left unplaced, and a page that reads this file must show them in the missal's own order rather than guess at a seat for them.",
]

