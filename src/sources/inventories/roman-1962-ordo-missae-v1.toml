lang = "en"
basis = "Source 1861 Cummiskey printed p. xxxix, IA leaf n49; target 1962 Ordo Missae nn. 1114 and 1116, printed pp. 312, 313, 314, 315, artifact PDF pp. 393, 394, 395, 396; both source and target page images read at 200 and 400 dpi on 2026-10-20. Both settings begin Pater noster without V.; the final petition remains unmarked. Each prints R. before Sed libera nos a malo. Each then prints Sacerdos secrete dicit: Amen. The Amen has neither V. nor R., despite being expressly assigned to the priest. Primary setting: n. 1114, pp. 312-313. Alternative tone: n. 1116, pp. 314-315; the rubric names ferias, vigils II and III class, votive Masses IV class, and Masses of the dead. No separate prose recitation printing was inspected; the preceding direction covers saying audibly or singing."
