through = { la = "Jesu Christi:", en = "Jesus Christ:" }
basis = "The 1962 Canon continues the common Communicantes after these words with the clause naming Saint Joseph and the list of the Apostles and Martyrs (n. 1090, printed pp. 302-303), as it continues every proper head after its dagger (printed p. 305); the 1861 row's remainder lacks the clause, so the frame carries the row's head and the 1962 continuation (communicantes-continuatio) instead of the remainder."

