[[sections.exclusions]]
element = "rubrica-postcommunio-secunda"
basis = "Source row artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ordinarium-conclusio-en seq 6 introduces the seasonal second Postcommunion, the counterpart of the excluded oblatio/rubrica-secreta. The verified page-image passages of the 1962 Ordo Missae, passage.catholic-church.missale-romanum.vatican-typica-1962.ordo-missae-communio (marginal nn. 1113-1131) and passage.catholic-church.missale-romanum.vatican-typica-1962.ordo-missae-conclusio (nn. 1132-1139), run from Corpus tuum straight to Ite missa est and print no second Postcommunion, no seasonal Postcommunion rubric and no added prayer; RGMR 505 makes the Postcommunions follow the number and order of the orations at the beginning of Mass, and the seasonal second-oration regime they answered to is abolished by the 1960 code (see oblatio/a-cunctis). Excluded 2026-10-19 (C2 gap G6)."

[[sections.exclusions]]
