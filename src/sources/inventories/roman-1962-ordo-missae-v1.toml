# ---------------------------------------------------------------- slots
#
# A slot is a seat in this frame for a proper of the day. It names one element
# of the Ordinary and whether the proper stands before or after it, the proper
# names it receives, and the rubric of the 1962 book that puts it there.
#
# This is DATA and not a renderer's rule, for the reason everything else in
# this file is: where a proper sits inside the Ordinary is liturgical fact, it
# is the same fact for every page that ever draws this frame, and a fact
# expressed as code in one page is a fact no other reader of these files can
# check. The `locus` is what makes a placement falsifiable: it names the
# paragraph, and anyone with the facsimile can say whether it is right.
#
# The slots are declared in the order the rite runs, and the generator refuses
# a file whose slots run backwards against the elements they anchor to. So the
# order below is not decoration: it is checked against the artifacts.

[[slots]]
key = "introitus"
after = "praeparatio/rubrica-benedictio-incensi-et-introitus"
propers = ["Introit"]
locus = "Ritus servandus IV, 2"

[[slots]]
key = "collecta"
before = "oblatio/rubrica-post-collectam"
propers = ["Collect"]
locus = "Ritus servandus V, 1"

# One rubric names the Epistle and the chants that follow it in one breath, so
# the two slots that carry them share its locus. `Lesson` sits here on the
# authority of Ritus servandus V, 4, which says the Lectio is read exactly as
# the Epistle is; `First Lesson` opens an Ember Saturday, whose remaining
# lessons and chants ride with the chant that precedes them.
[[slots]]
key = "epistola"
after = "oblatio/rubrica-epistola"
propers = ["Epistle", "Lesson", "First Lesson"]
locus = "Ritus servandus VI, 1; V, 4 for the Lectio"

[[slots]]
key = "graduale"
before = "oblatio/rubrica-munda-cor-meum"
propers = ["Gradual", "First Gradual", "Alleluia", "First Alleluia", "Tract"]
locus = "Ritus servandus VI, 1"

[[slots]]
key = "evangelium"
after = "oblatio/rubrica-evangelium-proprium"
propers = [
  "Gospel",
  "Passion according to Matthew",
  "Passion according to Mark",
  "Passion according to Luke",
  "Passion according to John",
]
locus = "Ritus servandus VI, 2"

[[slots]]
key = "offertorium"
after = "oblatio/rubrica-offertorium"
propers = ["Offertory"]
locus = "Ritus servandus VII, 1"

[[slots]]
key = "secreta"
before = "oblatio/rubrica-secreta"
propers = ["Secret"]
locus = "Ritus servandus VII, 7"

[[slots]]
key = "communio"
after = "conclusio/rubrica-communio"
propers = ["Communion"]
locus = "Ritus servandus XI, 1"

[[slots]]
key = "postcommunio"
before = "conclusio/rubrica-postcommunio-secunda"
propers = ["Postcommunion"]
locus = "Ritus servandus XI, 1"
