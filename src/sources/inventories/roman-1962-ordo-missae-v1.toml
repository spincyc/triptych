# praefatio-communis" (praefationes-en seq 2 and the row notes). The 1962
# prints the Preface continuously (n. 1081). This occurrence carries the common
# Preface's own row as far as that printed junction, so the appointed Preface
# reads whole; it adds no words (C3, 2026-10-19). Only the Holy Spirit Preface
# takes it here: the other asterisk Prefaces' junctions are not yet collated.
