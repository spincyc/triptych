  { id = "nativitate", name = "Communicantes of the Nativity" },
  { id = "epiphania", name = "Communicantes of the Epiphany" },
  { id = "pascha", name = "Communicantes of Easter" },
  { id = "ascensione", name = "Communicantes of the Ascension" },
  { id = "pentecoste", name = "Communicantes of Pentecost" },
]
default = "common"
default_basis = "RGMR 501 (front matter, artifact PDF p. 32, printed xxxiv; read at 200 and 400 dpi on 2026-10-19): Communicantes, Hanc igitur and Qui pridie vary only as 'suo loco in propriis Missis adnotatur', and within the octaves of the Nativity, Easter and Pentecost also in Masses not of the octave. The Canon prints the common Communicantes (n. 1090, printed p. 302, PDF 383) under the cross-reference 'Pro Communicantes propr., ut infra 304', and the proper forms only under the five headings of nn. 1093-1097 (printed p. 304, PDF 385); the Preface footers limit the Epiphany and Ascension forms to the feast (n. 1074, p. 285: 'in festo tantum'; n. 1078, p. 289: 'die festo tantum'), and the Ascension formulary says so again (p. 352, after Secret n. 1288). Every Mass the formulary appointments and dated spans below do not reach therefore says the common Communicantes."

