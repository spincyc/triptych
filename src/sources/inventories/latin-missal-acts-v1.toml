[[corrections]]
id = "carthusian-internet-archive-negative"
severity = "medium"
target = "src/sources/inventories/missal-acquisition-audit-v1.toml, aliases_method and the missale-cartusiense row"
target_says = """
`One alias class produced nothing and the negative is recorded rather than
dropped: no Carthusian missal was found on the Internet Archive under
cartusiense, cartusiensis, cartusianum, or chartreux [verified].`
"""
finding = """
THE NEGATIVE IS TRUE AND THE CONCLUSION DRAWN FROM IT WAS TOO STRONG, and the
audit had already written the remedy two paragraphs above.

A title search of the Internet Archive including `carthusiense` -- the same word
with an h -- returns `missale-carthusiense`, a whole 1620 printing with a PDF of
452,460,457 bytes and an OCR text layer of 1,277,278 bytes, plus a duplicate
upload of the same book [verified here at the advanced-search and metadata APIs].

The audit's own alias lesson says that `cartusiense` and `carthusiense` return
different result sets in a union catalogue. It applied that to the union
catalogue and not to the Internet Archive search it had already run, so the
four-alias negative was recorded as though the spelling question had been
settled. It had been settled -- one paragraph earlier, about a different
repository.
"""
consequences = """
- A Carthusian station of 1620 is carried here, on the Internet Archive item.
- The audit's sentence should gain the fifth alias and the result.
- THE RULE THIS ADDS, and it is a small one worth having: an alias set must be
  applied to EVERY repository searched, not to the repository where it was
  discovered. A lesson learnt at one host and applied at one host is half a
  lesson.
"""
status = "recorded here; the audit file is another lane's surface and is not edited from here"

[[corrections]]
id = "station-is-the-act-amended"
severity = "high"
target = "guidance/act-histories.md, and the rule the base slice is built on"
target_says = """
`The station is the ACT, not the book ... A printing is not an act: it is a
WITNESS, and it hangs beneath the history rather than standing in it. That
single rule is what keeps a scanner out of the record.`
"""
finding = """
THE RULE IS AMENDED, NARROWLY, ON THE MAINTAINER'S RULING OF 2026-08-01, AND THE
REASON BEHIND IT IS UNCHANGED.

The reason was and is that two printings of one prayer differ constantly with no
act behind the difference, so a history keyed on books publishes scanner
artefacts as liturgical change. That danger is real and this file meets it
repeatedly -- see the eight OCR differences between two witnesses of ONE 1970
decree, recorded at `celebrationis-eucharisticae-1970`.

What the unamended rule could not do is carry a missal for which no act has been
located, and before Trent that is most of them. Refusing them is not neutrality;
it is a record that says nothing about books that exist. So:

- A PRINTING MAY BE A STATION only where no act has been located for it, and
  only where it is a distinct edition rather than a reprint or a rescan of one
  already carried.
- Every station declares `station_kind`, which is `promulgated` or `printed`.
- A `printed` station is a weaker claim and reads as one everywhere, including
  in the emitted repository's commit subject, which begins `[printed]`.
- `act_citation` keeps its existing values and gains `none-claimed`, which only
  a printed station may use. `not-found` still means an instrument is believed
  to exist and nobody has read it.

THE DANGER THE OLD RULE GUARDED AGAINST IS NOW GUARDED BY THE EDGES INSTEAD.
A printed station cannot quietly assert descent, because every edge declares
what it rests on and the weakest available claim -- `use-continuity` -- says in
terms that it does NOT assert the later book was set from the earlier. The
1862 Pustet and 1962 Benziger cases the base slice caught would still be caught:
both are printings CONFORMED to a typical edition, so an act stands behind them
and they remain witnesses, not stations.
"""
consequences = """
- `tools/act-history` refuses a printed station that names an instrument, that
  does not name its printing, that does not say why it is a distinct edition, or
  whose `act_citation` is anything but `none-claimed`.
- Twenty-six printed stations are carried here and none on the Roman typical
  line, where every station has its instrument.
- guidance/act-histories.md carries the amendment beside the path convention.
"""
status = "applied on 2026-08-01"

[[corrections]]
id = "dates-lead-the-path-not-the-identity"
severity = "medium"
target = "the emitted repository's `acts/`, `witnesses/` and `gaps/` listings, and the browser's per-act fragments"
target_says = "`acts/<id>.txt`, `witnesses/<id>.txt`, `<slice>/station/<id>.json` -- names that sort as an alphabet."
finding = """
A LISTING OF A HISTORY THAT SORTS ALPHABETICALLY HIDES THE ONE PROPERTY THE
HISTORY HAS. `acts/` and `witnesses/` are directories a reader browses on
GitHub, and with fifty-nine stations running from 1484 to 2023 the ordering
matters more than it did with twelve.

Every per-act and per-witness path now takes its date as a prefix:
`acts/1570-07-14-quo-primum.txt`, `witnesses/1862-pustet.txt`.

TWO BOUNDARIES, AND THEY ARE THE POINT.

1. THE PREFIX IS DERIVED, in one function, from the date already in the record.
   It is never typed beside it. A hand-typed prefix and a date field are two
   copies of one fact and guidance/the-shape.md section 2 predicts they will
   differ.
2. A PATH IS NOT AN IDENTITY. The eight witness ids inherited from the base
   slice are NOT renamed, and the reason is concrete rather than cautious:
   several of them are also edition ids in this repository's source library --
   `benziger-iuxta-typicam-1962` is a directory under
   src/sources/works/catholic-church/missale-romanum/editions -- and re-keying a
   record so that a listing sorts would break the alignment between the two in
   order to fix a filename. Their paths are date-prefixed all the same, because
   the prefix comes from `printed` and not from the id.

   New witness ids in THIS file do carry the year, because they are new and
   nothing depends on their old shape. `sorted_name` is idempotent, so an id
   that already leads with its year is not given it twice, and an id that ends
   with the same year has it moved to the front rather than printed twice:
   `quo-primum-1570` with date 1570-07-14 becomes `1570-07-14-quo-primum`.

AND A DATE IS NEVER INVENTED TO MAKE A NAME SORT. `date` is written to the
precision the record has -- `1497` for a book dated only by its year, `1971` for
a reprint whose leaf gives no month -- and `date_precision` is DERIVED from it,
with `check` refusing a stated precision that disagrees. Twenty-nine stations
here carry year-only dates, and not one of them has a fabricated day.
"""
consequences = """
- Emitted paths and the browser's `<slice>/station/*.json` and
  `<slice>/state/*.json` fragments are date-prefixed.
- The derived names are PUBLISHED on the map spine as `station_path` and
  `state_path`, so the page reads a name rather than building one. A name built
  in two places comes apart the first time the convention moves.
- The convention is the scripture one keyed on date instead of canon position,
  and both are written down in their guidance.
"""
status = "applied on 2026-08-01"

[[corrections]]
id = "gallica-unreachable-in-this-run"
severity = "low"
target = "this file's own Lyon, Mozarabic editio princeps, Braga 1558 and Carthusian 1679 rows"
target_says = "Nothing yet; this entry exists so that a bound is recorded before it is forgotten."
finding = """
GALLICA WAS NOT REACHABLE FROM THIS RUN. Every request to gallica.bnf.fr
returned `Recv failure: Connection reset by peer`, including the IIIF manifest
and a request carrying a browser user agent [verified]. The Bavarian State
Library's IIIF API and the Internet Archive's APIs answered normally in the same
minutes, so the failure is specific.

The consequence is that four things the missal acquisition audit verified at
Gallica on this same day are carried here as [recorded] and not [verified]: the
two Lyon printings, the Cisneros Mozarabic editio princeps of 1500, the Braga
printing of 1558, and the Carthusian general chapter instrument of 1679.

THE LYON LINE RESTS ENTIRELY ON THIS. It is the only line in the file whose
single station could not be checked here, and it is carried rather than dropped
because the alternative -- writing the Lyonnais use out of the record on a
network failure -- is precisely the error the audit had already corrected once,
when it wrote `not-located` for Lyon on the strength of an Internet Archive
search while the books sat at the Bibliotheque nationale de France.
"""
consequences = "Recorded on each affected row, not only here. A bound named once in a preface is a bound a reader of a row will not see."
status = "recorded"

