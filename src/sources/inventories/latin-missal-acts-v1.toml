# The Latin missal as a history of acts, from the Council of Trent to 2008,
# with the uses and the order rites as lines that never rejoin.
#
# THIS FILE EXTENDS `roman-holy-week-acts-v1.toml` AND DOES NOT COPY IT. The
# twelve Holy Week acts, their witnesses, their four masses and their
# thirty-eight units live in that file and are read from it. Two copies of a
# fact are a prediction that they will differ, and guidance/the-shape.md
# section 2 records that the prediction has never failed here. What is below is
# what that slice does not hold: the Tridentine acts standing before Quo primum,
# the postconciliar line down to 2008, the acts governing which missal may be
# used, the Ordinary of the Mass as base units, and fifteen further lines for
# the uses and the order rites.
#
# It lives in inventories/ for the reason its base gives: `source-library
# validate` rejects any file under src/sources outside its own schema except
# .md and .toml under inventories/.

acts_schema = 1
extends = "roman-holy-week-acts-v1.toml"
record_type = "liturgical-act-history"
slice = "latin-missal"
recorded_on = "2026-08-01"

model = """
The station is the ACT. That rule stands and is the whole design: two printings
of one prayer differ constantly, no act stands behind those differences, and a
history keyed on books would publish a scanner's mistakes as liturgical change.

THERE IS NOW ONE EXCEPTION AND IT IS NARROW. Before Trent there are missals for
which no act has been located at all, and a record that refused them would be
silent about books that survive -- which is a different falsehood, not a smaller
one. So every station declares which kind it is:

  promulgated  an act stands behind it, and its instrument is cited.
  printed      a missal survives, and NO act is claimed for it.

A `printed` station is a WEAKER CLAIM and reads as one everywhere it appears:
in `act-history check`, in the station's own record under acts/, and in the
commit subject, which begins `[printed]` and carries a paragraph saying what is
not being asserted. It is never a synonym for `act_citation = "not-found"`.
Not-found means an instrument is believed to exist and nobody here has read it;
printed means no instrument is claimed at all. And a station is a DISTINCT
EDITION, never a rescan: two Internet Archive items of one printing are one
witness and one station, and every printed station says in
`distinct_edition_basis` why it is not a duplicate of one already carried.

PARENTAGE IS THE HARD PART AND IS WHERE THE INVENTION WOULD GO. A chain of
printings ordered by date is not a chain of descent. So every edge declares what
it rests on, in `parent_kind`, and the values are ordered by strength:

  act-states-it   an instrument's own text draws the edge.
  book-states-it  a title page or colophon names what the book follows.
  attributed      a scholarly attribution, cited to its source.
  use-continuity  two printings DECLARE THE SAME USE and this is their order.
                  It does not assert that the later was set from the earlier.
  line-order      two acts stand on one line in this order, and nothing in
                  either names the other.

WHERE DESCENT IS UNKNOWN THE STATION IS A ROOT. This file has many roots and
that is the honest shape: fourteen of the seventeen lines below begin with one,
because no act and no colophon joins a use's earliest surviving printing to
anything this record carries. A single invented trunk would read better and
would be a fabrication.
"""

