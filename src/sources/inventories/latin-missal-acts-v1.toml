effect = "No departure. No unit of this use has been read."
effect_established = false
effect_note = """
THIS STATION IS THE COUNTER-EXAMPLE THAT KEEPS A GENERALISATION HONEST, and it
is why the exempt-uses line is drawn the way it is. The two signatories here --
Cardinal Vico as Prefect and Alexander Verde as Secretary -- are THE SAME TWO MEN
who signed the Roman typical edition's decree of 25 July 1920, in the same
offices, four years apart. So the diocesan uses do not legislate their own
typical editions: Rome does, through the same congregation.

And yet no edge is drawn from the Roman line into this one. One congregation
acting for two rites is a fact about who signs, not a descent of one rite from
the other, and drawing it would make the Braga use look like a branch of the
Roman typical editions. The distinction between an authority and a lineage is
exactly what this file's edges exist to keep.
"""

# --- The Ordinary of the Mass ------------------------------------------------
#
# WHY THESE UNITS ENTER AT 1962, WHICH LOOKS ABSURD AND IS NOT. The Offertory
# prayers of the Roman Mass are older than every act in this file. They enter
# the record at `editio-typica-1962` because THAT IS THE EARLIEST WITNESS IN
# THIS CORPUS WHOSE TEXT LAYER CARRIES THEM, and for no other reason. The base
# slice made the same move for the same reason, entering its Holy Week units at
# the 1634 revision because the earliest scan it could read was of 1862.
#
# THE MEASUREMENT BEHIND THAT, made here [corpus]. A search of the 1570, 1604,
# 1862, 1894 and 1920 text layers for `Suscipe, sancte Pater`, `Aufer a nobis`,
# `Veni sanctificator`, `Placeat tibi` and `In principio erat Verbum`, in both
# literal and accent-normalised form, returns ZERO in every one of the five, and
# returns them in the 1962 Benziger scan. All five books print the Ordinary.
# What the older scans lose is the ORDO MISSAE SPECIFICALLY, which is set in
# large type with rubrics in red and drop capitals, and which the scanners of
# those items did not resolve -- the same failure the base slice measured on the
# chanted Introits, in a different part of the book.
#
# So the entry point is a fact about five scanners. A reader who took it for a
# claim that the Offertory prayers date from 1962 would have it exactly wrong,
# and this note is here so that nobody can.
#
# THE DROP CAPITAL IS THE WORST PLACE FOR OCR DAMAGE TO FALL, and it falls
# there every time. Each incipit below is reproduced AS THE SCAN GIVES IT, with
# only the scan's own hyphenated line breaks closed up. That is why several
# begin with nonsense: `"Pv eus, qui humanae` is a drop-cap D read as `Pv`,
# `a&te, fratres` is `Orate` with the O lost, `1n principio` is `In principio`,
# and `T av&bo` is `Lavabo`. An incipit is by definition the first words of a
# prayer, so an OCR failure concentrated on initials is an OCR failure aimed at
# exactly the thing an incipit is. Correcting them here would hide the single
# most useful measurement in this section.

