derived_by = "python3 tools/act-history check --source src/sources/inventories/latin-missal-acts-v1.toml"
one_assertion_under_test = """
`printed` stations must never appear on the `typica` line. That is the model's
remaining hard rule -- the Roman line's every station has its instrument -- and
it is expressed as a query rather than a number:

  python3 tools/act-history graph --source src/sources/inventories/latin-missal-acts-v1.toml \\
    | grep '^\\* typica'

must print nothing. A printed station on that line would mean a book had been
allowed to stand where an act belongs.
"""
