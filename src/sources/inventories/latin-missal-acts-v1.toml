# --- What the 1970 typical edition did to the Ordinary -----------------------
#
# EVERY ROW BELOW RESTS ON A SEARCH AND NOT ON A TRANSCRIPTION, and that is a
# rights position as much as a method. The 1970 typical edition is a book of the
# Holy See that this project may READ and may not PUBLISH, so nothing of it is
# copied here: an absence is established by looking for a prayer and not finding
# it, which produces a claim about the 1962 book -- that its prayer is gone --
# without reproducing a word of the 1970 one.
#
# Every search was accent-normalised, for the reason `evidence` gives at length:
# the 1970 book prints `Oráte` and a literal search for `Orate` returns nothing.
#
# TWO SEARCHES RETURNED A HIT THAT WAS NOT THE UNIT, and both are recorded on
