commonality_reading = """
HOW TO READ `act-history commonality`, BECAUSE IT IS EASY TO READ WRONGLY.

The verb answers two different questions and they must not be run together.

THE SHARED BASE IS ABOUT ACTS. It is `git merge-base` on two lines' heads, run
against the emitted repository and checked against the act graph, which refuses
if the two disagree. For almost every pair of lines below the answer is NONE,
and that is a FINDING rather than a failure: the Sarum use and the Roman line
share no act in this record, because no act joining them was located, and the
graph says so by drawing no edge. The exempt-uses line and the Roman line DO
share one, `quo-primum-1570`, because one instrument stands behind both; and the
usus-antiquior line shares `editio-typica-1962` with the Roman line, because the
1962 edition is what its acts are about.

THE DIVERGENCE IS ABOUT TEXT, and here the reading runs the other way. Two lines
with no shared act may still hold the same prayer, and agreement without an edge
is the most interesting thing this shape can show: inheritance older than
anything the record carries. THIS FILE CANNOT SHOW IT YET. No unit of any use
has been read, so every use line's tree is empty and the verb reports zero units
in common with everything. That is a statement about what has been transcribed
and about nothing else, and a reader who took it for a statement about the rites
would have it exactly backwards.

The acquisition order that follows is short and is already written in the missal
acquisition audit: the first use whose units should be read is Braga, because it
is the only one where both the book and its promulgating acts are in hand and
publishable.
"""

