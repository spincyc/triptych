evidence = "PDF 2 identifies the second revised edition; its handwritten 1929 is not treated as a printed imprint. PDF 3 independently prints Herder1929, with1927 approvals. The original Christ-the-King extent, printed1104–1108/PDF1174–1178, remains unchanged. The additional20October2026 review directly inspects the seven Latin blocks and printing continuity: John of the Cross is core1138/PDF1208; core ends1144/PDF1214, then the second pagination begins/PDF1215 and ends[281]/PDF1495. Front contents PDF11/XII explicitly lists Vianney[265], Therese[266], Sacred Heart[269], and index[275]; inspected boundaries run[264]/PDF1478 through newly prescribed feasts[265–274]/PDF1479–1488 to index[275]/PDF1489. Independent German Liturgical Institute catalog67078, https://dli.institute/dlibib/dlibibkatwp.php?layout=dbk&ausgabe=1&nummer=67078&Bestand=c&NurSchweiz=0, read whole20October2026, records Bihlmeyer/Schott, second revised edition, Herder/Freiburg1929, XII,64*,1144,281pages, Schott1. Its retained HTML SHA256 is b924f875ca7c5faae9ccc8b2e85293a4d75beb0af64c3ca6d9714652e8937efd. The matching edition, exact pagination and integral contents corroborate attribution of the appendix blocks to this1929 printing; no separate dated appendix imprint is asserted. Source passage passage.anselm-schott.das-vollstandige-romische-messbuch.herder-second-revised-1929.seven-additional-latin-orations-extent-review-2026-10-20 records the exact additional extent."
allowed = "The original historical Latin wording on printed1104–1108/PDF1174–1178, plus ONLY these seven additional Latin prayer blocks: John of the Cross Collect, printed1138/PDF1208; Vianney Collect, printed[265]/PDF1479; Therese Collect, printed[266]/PDF1480; Therese Secret and Postcommunion, printed[268]/PDF1482; Sacred Heart Collect, printed[269]/PDF1483; Sacred Heart Secret, printed[272]/PDF1486. These bounded historical words may be collated against the1962 controller. Transcription may normalize typography only with disclosure, retain each historical conclusion at its actual length, and keep any target-controlled projection separately identified."
excluded = "Complete PDF remains restricted and metadata-only. German renderings, English, page images/layout, modern watermark, digital packaging, any missing or reconstructed scan page, and all neighbouring prayers outside the expressly allowed extents are excluded. The additional seven-block finding includes no Sacred Heart Preface, rubric, historical commemoration or alternate Mass branch. The host1927 label is not the printing date. No inactive seasonal branch is established by the original Christ-the-King pages; older Sunday commemorations and last Gospel do not govern1962. The1962 target artifact rights remain unchanged; no source-family or inherited pre1955 target grade follows."
