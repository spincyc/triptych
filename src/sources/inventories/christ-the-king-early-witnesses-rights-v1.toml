holding = """
The bounded historical text of Joseph Husslein's Christ the King, copyrighted
1926 in New York by America Press, and the Latin formulary in the 1929 Herder
printing of Schott/Bihlmeyer's second revised Meßbuch are public domain in the
United States by expiry of the maximum 95-year published-work term. Even if
renewed, a 1926 copyright expired at the end of 2021 and a 1929 copyright at the
end of 2024. This finding concerns the identified historical wording. It is
not a whole-delivery license and does not depend on the absence of a renewal.
"""

