# Two witness rows, and the second is where this element's own note above
# becomes visible in the words: the older book sets Per omnia saecula saeculorum
# as a separate versicle of priest and minister, and this Missal makes it the
# end of the doxology, answered by the people. The witness's P. and R. marks are
# left standing so that the difference can be seen rather than described.
#
# The doxology is not one of Eucharistic Prayer I's twelve split children. It is
# common to all four prayers, the Missal prints it as its own numbered element,
# and the study places Per ipsum inside the stretch it calls substantially identical.
absent_english = "approved-english-publication-restriction"
[sections.elements.latin]
witness = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
artifact = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.canon-missae-la"
elements = ["per-ipsum", "per-omnia-saecula"]
column = "latin"
relation = "antecedent"
collation = "uncollated"
note = """
ANTECEDENT, NOT THE CONTROLLING EDITION. The Latin here is the facing column of \
the 1861 Philadelphia Cummiskey hand missal at its Per ipsum and the versicle \
that closes its Canon, printed pages xxxviii-xxxix, Internet Archive leaves \
48-49, joined from that book's own two blocks. The controlling 2008 text is not \
distributable on this surface and is not served here. The repository holds and \
has read a verified 2002 Ordo witness and the official bounded 2008 variation \
list, but that evidence does not establish this word identity; these are the \
1861 printing's words. Carried as printed and normalised nowhere: the book prints no cross \
signs in this block, which the older Roman rite marks five times; it reads \
saecula saeculorum with the ae-ligature, set unbroken here where the same \
versicle at the foot of xxvii prints a full stop after saecula; and it sets \
the Amen in italic. THE SHAPE DIFFERS AND THE MARKS SHOW IT: the witness's \
P. and R. divide the closing versicle between priest and minister, which is the \
older Order, where this Missal makes per omnia saecula saeculorum the end of the \
doxology itself and the people's Amen answers the whole. The marks are the \
witness's and are not this Missal's rubric. \
UNCOLLATED: the identity of this text with the controlling edition's is not \
established here. This repository's study of this Order of Mass records at \
00-order-of-mass/sections/55-roman-canon.tex:114 that the prayer text is \
substantially identical from Te igitur to Per ipsum apart from the changes to \
the dominical words, which fall elsewhere in the Canon and not in this element. \
It quotes no 2002 Latin of the doxology, so no word-level comparison has been \
made.
"""

