# ---------------------------------------------------------------- slots
#
# A seat in this frame for a proper of the day, named the same way as in the
# 1962 inventory: one element of the Ordinary, whether the proper stands before
# or after it, the proper names it receives, and a locus.
#
# Almost every element these slots anchor to carries no text at all, and that
# changes nothing here. An element that names its absence is still an element,
# and it still marks the place. The Collect below is the plainest case: the
# element says the prayer is withheld and why, and the day's Collect, whose
# Latin this project does hold, is seated immediately after it. A reader sees
# what is withheld and what is not, at the moment each falls due.

[[slots]]
key = "antiphona-ad-introitum"
after = "ritus-initiales/introitus"
propers = ["Entrance Antiphon", "Entrance Antiphon (alternative)"]
locus = "Ordo Missae n. 1"

[[slots]]
key = "collecta"
after = "ritus-initiales/collecta"
propers = ["Collect"]
locus = "Ordo Missae n. 9"

[[slots]]
key = "lectio-prima"
after = "liturgia-verbi/lectio-prima"
propers = ["First Reading"]
locus = "Ordo Missae n. 10"

[[slots]]
key = "psalmus-responsorius"
after = "liturgia-verbi/psalmus-responsorius"
propers = ["Responsorial Psalm"]
locus = "Ordo Missae n. 11"

[[slots]]
key = "lectio-secunda"
after = "liturgia-verbi/lectio-secunda"
propers = ["Second Reading"]
locus = "Ordo Missae n. 12"

# The Sequence is deliberately absent from this slot. The Missal sings it
# before the Alleluia, and the propers layer already prints it there, so a
# proper that rides with the reading before it lands in the right place; naming
# it here would seat it after the acclamation and be wrong.
[[slots]]
key = "acclamatio-ante-evangelium"
after = "liturgia-verbi/acclamatio-ante-evangelium"
propers = ["Gospel Acclamation", "Verse Before the Gospel"]
locus = "Ordo Missae n. 13"

[[slots]]
key = "evangelium"
after = "liturgia-verbi/evangelium"
propers = ["Gospel"]
locus = "Ordo Missae nn. 14-16"

[[slots]]
key = "super-oblata"
after = "praeparatio-donorum/super-oblata"
propers = ["Prayer over the Offerings"]
locus = "Ordo Missae n. 30"

[[slots]]
key = "antiphona-ad-communionem"
after = "ritus-communionis/communio"
propers = ["Communion Antiphon", "Communion Antiphon (alternative)"]
locus = "Ordo Missae nn. 133-136"

[[slots]]
key = "post-communionem"
after = "ritus-communionis/post-communionem"
propers = ["Prayer after Communion"]
locus = "Ordo Missae n. 139"

[[slots]]
key = "super-populum"
before = "ritus-conclusionis/benedictio"
propers = ["Prayer over the People"]
locus = "Ordo Missae nn. 141-143"

# ---------------------------------------------------------------- variants

[[variants]]
group = "eucharistic-prayer"
name = "Eucharistic Prayer"
what = """
The postconciliar Missal prints four Eucharistic Prayers and the priest chooses \
among them; the first may always be used, and the Missal states where the fourth \
may not. The 1962 Missal has one Canon and no such choice, so this control \
belongs to this missal alone. The option marked default here is the first the \
Missal itself prints. That is the only order this project can state without \
preferring one prayer over another, and it is not a recommendation.
"""

[[variants.options]]
id = "ep-i"
name = "I — the Roman Canon"
default = true

[[variants.options]]
id = "ep-ii"
name = "II"
default = false

[[variants.options]]
id = "ep-iii"
name = "III"
default = false

[[variants.options]]
id = "ep-iv"
name = "IV"
default = false
