ANTECEDENT, NOT THE CONTROLLING EDITION. The Latin here is the facing column of \
the 1861 Philadelphia Cummiskey hand missal at its Quod ore sumpsimus, printed \
pages xlii-xliii, Internet Archive leaves 52-53, the block running over the page \
