# The Latin of the Agnus Dei is carried here and NOWHERE ELSE in this file. The
# element below it exists only because the ecumenical witness prints two ENGLISH
# forms of one invocation; the Missal prints one Latin text, and printing it
# twice under two keys would assert a Latin variant that does not exist.
[sections.elements.latin]
witness = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
artifact = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ordinarium-communio-la"
elements = ["agnus-dei"]
column = "latin"
relation = "antecedent"
collation = "uncollated"
note = """
ANTECEDENT, NOT THE CONTROLLING EDITION. The Latin here is the facing column of \
the 1861 Philadelphia Cummiskey hand missal at its Agnus Dei, printed page xl, \
Internet Archive leaf 50. The Latin of the Missale Romanum, editio typica tertia \
2002 with its emended reprint of 2008, is under copyright and is not held by \
this project; these are the 1861 printing's words and not that book's. Carried \
as printed and normalised nowhere: the book does not write the invocation out \
three times. It sets three asterisks at the head of three short lines, \
* miserere nobis, twice and then * dona nobis pacem., the asterisk marking where \
Agnus Dei, qui tollis peccata mundi is resumed, and they are run in here as the \
sibling English row runs them. A reader must expand them as the book intends and \
not read four clauses where the rite has three invocations. \
UNCOLLATED: the identity of this text with the controlling edition's is not \
established here. This repository's study of this Order of Mass describes n. 130 \
at 00-order-of-mass/sections/70-communion-rite.tex:86-91 and names the Agnus Dei \
among the texts retained with little or no change of wording, on a comparison \
for which it states that both books were read directly; it quotes the 2002 Latin \
of the ending dona nobis pacem only, which this witness matches. The invocation \
itself has been compared with nothing.
"""

