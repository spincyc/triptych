# The same 1861 Philadelphia printing that witnesses this project's 1962 frame,
# doing a different job here. Under that frame it is a witness to the rite the
# frame declares. Under this one it is an ANTECEDENT: an older book printing the
# ancient prayers this Order of Mass received, standing in for a controlling
# edition that is in copyright and is not held here at all.
#
# That difference is a relation between two texts and not a property of a
# printing, so it is NOT encoded here. There is no antecedent edition of
# anything. `id` is the edition's real record, because `source_id` reaches the
# page as attribution and a second id minted to carry the relation would
# misattribute the words to a book that does not exist; the propers side did
# exactly that once and served 63 translations under a dotted id no witness row
# declared, with no label and no caution. The relation is declared per element,
# on the element's own `latin` block, with the grade of what has been
# established about it and a note that says it beside the words.
#
# The label leads with the disclaimer and the caution leads with the disclaimer,
# for one reason: both are option text in narrow browser controls, and a label
# truncated in a narrow control must lose the bibliography, never the warning.
[[witnesses]]
id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
lang = "la"
label = "Antecedent Latin (NOT the Missale Romanum's text): the facing Latin column of The Roman Missal translated into the English language for the use of the laity, first revised edition (Philadelphia: Eugene Cummiskey, 1861)"
rights = "public-domain"
caution = "NOT the Latin of the Missale Romanum. The postconciliar Missal's Latin is a work of the Holy See, is under copyright, and is not held by this project; nothing served under this witness is that book's text and no element here claims to be. What is here is the facing Latin column of an 1861 Philadelphia lay hand missal - never an altar book, never an approved liturgical translation, and pre-1955 in its rubrics and its discipline - which prints the ancient prayers this Order of Mass received. It is joined element by element, and only where an element's Latin is that ancient prayer; where the reform composed, recast or rearranged, nothing is carried and the element says why. Its orthography and its misprints are its own and are carried as printed: justum for iustum, Jesu for Iesu, Et expecto for Et exspecto, the ae- and oe-ligatures, and nodie for hodie at In spiritu humilitatis are the 1861 printer's and not the Holy See's. Every element carrying Latin states beside its own words which prayer of that book it is, at which printed page and Internet Archive leaf, which accidents it carries, and whether its identity with the controlling edition has been established or is so far only asserted. Nothing here may be used for recitation."
