note = """
ANTECEDENT, NOT THE CONTROLLING EDITION. The Latin here is the facing column of \
the 1861 Philadelphia Cummiskey hand missal at its Quod ore sumpsimus, printed \
pages xlii-xliii, Internet Archive leaves 52-53, the block running over the page \
break at fiat nobis re- / medium. The controlling 2008 text is not distributable \
on this surface and is not served here. The repository holds and has read a \
verified 2002 Ordo witness and the official bounded 2008 variation list; the \
words carried here are the 1861 printing's. Carried as printed and normalised \
nowhere: the book points a comma after \
temporali which the study's quotation of the 2002 text does not. \
COLLATED. The cited study quotes the 2002 Latin of this prayer entire at n. 137 \
and calls it a post-Communion prayer of great antiquity, retained; set beside \
this row the two agree word for word, the sole divergence being that comma.
"""

