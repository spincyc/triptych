# fetched and hash-verified against the registered artifacts. This witness
# metadata establishes provenance, not a distribution basis: the standing grant
# is limited to a qualifying free, noncommercial website display and does not
# reach tracked Git, public data, downloadable files, or PDFs. Every word was de-syllabified
# from the chant setting: ICEL's pages print the text syllable by syllable under
# the neumes, and joining the syllables is an editorial transformation performed
# on every string. The chant tonic accents are pointing and not orthography:
# the pages print "Kýrie, e-lé-i-son" under the notes and "Kyrie, eleison" in
# their own prose rubric, and the prose form is what is carried. Where ICEL's
# own printing spells "Savior" and "honor" the United States form is carried;
# the England-and-Wales files spell "Saviour" and "honour" and the divergence is
# recorded per element rather than harmonised.
