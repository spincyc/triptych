schema = "triptych-ordo-missae/v1"
calendar = "postconciliar"
title = "The Order of Mass"

advisory = """
A finding aid for the shape of the rite, and never a book to celebrate from. \
Most of this Order of Mass is missing here, and every element says which of its \
two texts is missing and why, because they are not missing for one reason. The \
English side has six reasons. Twenty-five elements record a rights absence \
rather than text on this distribution surface. Sixteen modelled elements \
have official exemplars registered but no tracked payload this generator may \
join to them. Six variable \
texts belong to the Propers rather than this frame. Three elements have no fixed \
words, three span parts with different availability, and six are prayers the \
Priest says quietly for which no exact exemplar is held. The Latin side \
has six reasons, and they run from the reform's own new matter, which is the \
Holy See's and is withheld, to a rubric that has no words in any book. Where a \
text is missing what stands in its place is the element's received Latin \
incipit, which is a reference and not the prayer. THE LATIN THAT IS HERE IS NOT \
THIS MISSAL'S. Twenty elements carry Latin, and at every one of them it is the \
facing column of an 1861 Philadelphia lay hand missal printing the ancient \
prayer this Order of Mass received. The controlling 2008 Latin is not \
distributable on this surface and is not served as an element text anywhere on \
this page. Each of the twenty says beside its own words which prayer of that older book \
it is, at which printed page and leaf, which accidents of that printing it \
carries unnormalised, and whether its identity with the controlling edition has \
been established by a collation this repository holds or is so far only \
asserted. Five are established; fifteen are not, and they say so.
"""

derived_from = """
The order, the numbering, the Latin incipits, the speakers and the conditions \
are transcribed from this repository's own collated study of the Order of Mass, \
src/claude/liturgy/roman-rite/postconciliar/2008-latin-2011-us-english/ordinary/\
00-order-of-mass, and in particular its research/sequence-inventory.md, which \
gives one row per received boundary in the Missal's own order and numbering \
against the 2008 editio typica tertia emendata. That study's own scope record \
states the boundary this file inherits: the Latin is quoted there where an \
argument requires it, as evidence and not as text for recitation, and the \
approved English is not reproduced. The Latin texts here are drawn from a \
DIFFERENT BOOK, and that is the whole of \
what has to be understood about them: the six ordinarium, praefationes and \
canon-missae `-la` artifacts of \
edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861, which \
transcribe the facing Latin column of an 1861 Philadelphia lay hand missal from \
a registered scan at 640 dpi, one physical line per printed block, each row \
carrying its own printed page, Internet Archive leaf and transcriber's note. \
Those artifacts are already the Latin of this project's 1962 frame; here they \
are joined to a second calendar, element by element, because the older book \
prints the ancient prayer the postconciliar Missal received and for no other \
reason. Nothing is transcribed afresh for this file and nothing is normalised: \
the join names artifact rows that already exist and already carry their hash.
"""

slots_derived_from = """
Where each proper of the day stands inside this frame is read from the same \
collated study as the order of the elements, and each slot's locus is the \
Missal's own numbering of the element it is anchored to. This repository holds \
and has read a verified witness of the 2002 Ordo Missae and the official bounded \
list of the 2008 variations, but no complete facsimile of the controlling 2008 \
reprint. Unlike the 1962 frame, these placements therefore rest on that study \
and on the Missal's numbering rather than on a complete 2008 exemplar; every \
slot below anchors to an element whose number this file already carries.
"""

not_decided_here = [
  "Which Eucharistic Prayer a priest should use. The Missal offers four and the choice is his; the option this file marks default is simply the first the Missal prints.",
  "Whether the Latin editio typica itself may be republished. That question is open, this file does not answer it, and nothing here depends on the answer. Of the fifty-nine elements, sixteen are empty in Latin because their target wording is the Holy See's post-1929 matter and is withheld; twenty-three are empty because of a witness or a modelling gap and no rightsholder has refused them; and twenty carry Latin that is not the editio typica's at all, but an 1861 lay printing's of the ancient prayer this Order received. No word of the editio typica is reproduced here, in any element.",
  "The Prefaces, of which the Missal prints fifty; they are proper to the day and belong to the propers layer, not to the invariant frame.",
  "Where a proper stands that this file does not seat. The Sequence, the chants of the Paschal Triduum and the whole of the Good Friday liturgy are left unplaced; a page reading this file must show them in the Missal's own order beside the proper they follow rather than invent a seat for them.",
  "Whether the fifteen elements carried here at the `uncollated` grade are word-identical with the editio typica. They are carried because the words themselves are attested in a public-domain witness this project has read at a named leaf, never because an older text has been silently relabelled as the target. That is not an established identity and it is not written down as one. At the Pax the study quotes the target versicle but does not establish the response at n. 127; eight Roman Canon children each name the untested extent or configuration that keeps the complete older row uncollated; and the other six state their own exact evidence bounds beside their words. The repository's verified 2002 Ordo evidence plus the official bounded 2008 variation list does not by itself establish all fifteen identities; settling them requires the missing word-level comparisons.",
  "Whether an antecedent witness's spelling should ever be brought toward the controlling edition's. It is not, anywhere here. The 1861 column prints justum for iustum, Jesu for Iesu, the ae- and oe-ligatures, Et expecto for Et exspecto, and at least one plain misprint - nodie for hodie - and every one of them is carried as printed and named in the element's own note. Smoothing them would manufacture a target witness this project has not established; carrying them silently under a heading naming the editio typica would attribute a lay printer's misprints to the Holy See. Naming them is the only honest third option and it is what this file does.",
]

# ---------------------------------------------------------------- witnesses

# The same 1861 Philadelphia printing that witnesses this project's 1962 frame,
# doing a different job here. Under that frame it is a witness to the rite the
# frame declares. Under this one it is an ANTECEDENT: an older book printing the
# ancient prayers this Order of Mass received, standing in for controlling 2008
# text that is not distributable on this surface and is not served here.
#
# That difference is a relation between two texts and not a property of a
# printing, so it is NOT encoded here. There is no antecedent edition of
# anything. `id` is the edition's real record, because `source_id` reaches the
# page as attribution and a second id minted to carry the relation would
# misattribute the words to a book that does not exist; the propers side did
# exactly that once and served 63 translations under a dotted id no witness row
# declared, with no label and no caution. The relation is declared per element,
# on the element's own `latin` block, with the grade of what has been
# established about it and a note that says it beside the words.
#
# The label leads with the disclaimer and the caution leads with the disclaimer,
# for one reason: both are option text in narrow browser controls, and a label
# truncated in a narrow control must lose the bibliography, never the warning.
[[witnesses]]
id = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
lang = "la"
label = "Antecedent Latin (NOT the Missale Romanum's text): the facing Latin column of The Roman Missal translated into the English language for the use of the laity, first revised edition (Philadelphia: Eugene Cummiskey, 1861)"
rights = "public-domain"
caution = "NOT the Latin of the Missale Romanum. The controlling 2008 Latin is a work of the Holy See, is under copyright, is not distributable on this surface, and is not served under this witness; no element here claims that the 1861 words are that book's text. The repository does hold and has read a verified 2002 Ordo witness and the official bounded 2008 variation list, but that evidence does not establish every antecedent identity. What is here is the facing Latin column of an 1861 Philadelphia lay hand missal - never an altar book, never an approved liturgical translation, and pre-1955 in its rubrics and its discipline - which prints the ancient prayers this Order of Mass received. It is joined element by element, and only where an element's Latin is that ancient prayer; where the reform composed, recast or rearranged, nothing is carried and the element says why. Its orthography and its misprints are its own and are carried as printed: justum for iustum, Jesu for Iesu, Et expecto for Et exspecto, the ae- and oe-ligatures, and nodie for hodie at In spiritu humilitatis are the 1861 printer's and not the Holy See's. Every element carrying Latin states beside its own words which prayer of that book it is, at which printed page and Internet Archive leaf, which accidents it carries, and whether its identity with the controlling edition has been established or is so far only asserted. Nothing here may be used for recitation."
