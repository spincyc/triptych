[[sections.elements]]
key = "prex-eucharistica-i"
kind = "prayer"
speaker = "priest"
name = "Eucharistic Prayer I, the Roman Canon"
latin_incipit = "Te igitur, clementissime Pater"
missal_number = "nn. 83-98"
variant = "ep-i"
note = "Te igitur, Memento Domine, Communicantes, Hanc igitur, Quam oblationem, Qui pridie, the Mysterium fidei and the people's acclamation, Unde et memores, Supra quae, Supplices, Memento etiam, Nobis quoque, Per quem haec omnia, Per ipsum. THIS IS NOT THE CANON OF THE 1962 MISSAL, and the English Canon this site serves under that missal is not a translation of this prayer. Established Latin against Latin from hash-verified facsimiles of both books, they differ at eleven places, among them both consecratory forms: this prayer adds quod pro vobis tradetur over the bread, DELETES mysterium fidei from the form over the chalice, replaces Haec quotiescumque feceritis with Hoc facite in meam commemorationem, and adds a Mysterium fidei acclamation the older book has nowhere. The 1962 book prints nineteen signs of the cross over the pages compared; this prayer prints one."

[[sections.elements]]
key = "prex-eucharistica-ii"
kind = "prayer"
speaker = "priest"
name = "Eucharistic Prayer II"
latin_incipit = "Vere Sanctus es, Domine, fons omnis sanctitatis"
missal_number = "nn. 99-106"
variant = "ep-ii"
note = "With a preface of its own, which may be replaced. Its shape is drawn from the anaphora of the so-called Apostolic Tradition; the drafting history is not established here."

[[sections.elements]]
key = "prex-eucharistica-iii"
kind = "prayer"
speaker = "priest"
name = "Eucharistic Prayer III"
latin_incipit = "Vere Sanctus es, Domine, et merito te laudat"
missal_number = "nn. 107-115"
variant = "ep-iii"
note = "Has no preface of its own and takes the day's. A formula for the dead stands at n. 115."

[[sections.elements]]
key = "prex-eucharistica-iv"
kind = "prayer"
speaker = "priest"
name = "Eucharistic Prayer IV"
latin_incipit = "Confitemur tibi, Pater sancte"
missal_number = "nn. 116-123"
variant = "ep-iv"
note = "Its preface is fixed and may not be replaced, so it is excluded whenever a proper Preface is appointed."

[[sections.elements]]
key = "mysterium-fidei"
kind = "dialogue"
speaker = "all"
name = "The acclamation after the consecration"
latin_incipit = "Mysterium fidei"
missal_number = "n. 91"
note = "Three alternative acclamations. This element has no counterpart in the 1962 Missal, where mysterium fidei stands inside the form over the chalice instead."

[[sections.elements]]
key = "doxologia"
kind = "prayer"
speaker = "priest"
name = "The final doxology"
latin_incipit = "Per ipsum, et cum ipso, et in ipso"
missal_number = "n. 98"
note = "The people's Amen closes it. Here per omnia saecula saeculorum is part of the doxology itself; in the 1962 book it follows as a separate versicle of priest and minister."

