absent_latin = "not-a-text"
note = "Omitted where another liturgical action follows immediately."

# ---------------------------------------------------------------- slots
#
# A seat in this frame for a proper of the day, named the same way as in the
# 1962 inventory: one element of the Ordinary, whether the proper stands before
# or after it, the proper names it receives, and a locus.
#
# Almost every element these slots anchor to carries no text at all, and that
# changes nothing here. An element that names its absence is still an element,
# and it still marks the place. The Collect below is the plainest case: the
# element says the prayer is withheld and why, and the day's Collect, whose
# Latin this project does hold, is seated immediately after it. A reader sees
# what is withheld and what is not, at the moment each falls due.

[[slots]]
key = "antiphona-ad-introitum"
after = "ritus-initiales/introitus"
propers = ["Entrance Antiphon", "Entrance Antiphon (alternative)"]
locus = "Ordo Missae n. 1"

[[slots]]
key = "collecta"
after = "ritus-initiales/collecta"
propers = ["Collect"]
locus = "Ordo Missae n. 9"

[[slots]]
key = "lectio-prima"
after = "liturgia-verbi/lectio-prima"
propers = ["First Reading", "First Reading (alternative)", "First Reading (shorter form)", "First Reading (ad libitum)"]
locus = "Ordo Missae n. 10"

[[slots]]
key = "psalmus-responsorius"
after = "liturgia-verbi/psalmus-responsorius"
propers = ["Responsorial Psalm", "Responsorial Psalm (alternative)"]
locus = "Ordo Missae n. 11"

[[slots]]
key = "lectio-secunda"
after = "liturgia-verbi/lectio-secunda"
propers = ["Second Reading", "Second Reading (shorter form)", "Second Reading (common provision)", "Second Reading (Year C optional)"]
locus = "Ordo Missae n. 12"

# The Sequence has its own seat, immediately BEFORE the acclamation element:
# naming it in the acclamation slot below would seat it after the acclamation
# and be wrong. Added 2026-10-19 (C2 gap G7): until then no slot claimed it, so
# every form appointing a Sequence had to withhold the whole frame.
[[slots]]
key = "sequentia"
before = "liturgia-verbi/acclamatio-ante-evangelium"
propers = ["Sequence"]
locus = "IGMR 64 (Institutio generalis Missalis Romani, editio typica tertia 2002), which says the Sequence, optional except on the days of Easter and Pentecost, is sung before the Alleluia; read on 2026-10-19 in the registered 2002 Latin General Instruction segment"

[[slots]]
key = "acclamatio-ante-evangelium"
after = "liturgia-verbi/acclamatio-ante-evangelium"
propers = [
  "Gospel Acclamation", "Gospel Acclamation (alternative)",
  "Verse Before the Gospel",
]
locus = "Ordo Missae n. 13"

[[slots]]
key = "evangelium"
after = "liturgia-verbi/evangelium"
propers = [
  "Gospel", "Gospel (alternative)", "Gospel (shorter form)",
  "Gospel (alternative, longer form)", "Gospel (alternative, shorter form)", "Gospel (ad libitum)",
  "Passion of the Lord",
]
locus = "Ordo Missae nn. 14-16"

[[slots]]
key = "super-oblata"
after = "praeparatio-donorum/super-oblata"
propers = ["Prayer over the Offerings", "Prayer over the Offerings (retained option)"]
locus = "Ordo Missae n. 30. The exact retained-option label represents the source index's bounded minimum of at least one earlier offering option after the 2008 September 8 Superoblata insertion and Vel: Notitiae 503-504, artifact pp. 55-56 / printed pp. 373-374; added prayer repeated at artifact p. 67 / printed p. 385. Both alternatives occupy the offering-prayer seat; prior-option wording and total extent remain unresolved. No other qualified label is admitted."

[[slots]]
key = "antiphona-ad-communionem"
after = "ritus-communionis/communio"
propers = ["Communion Antiphon", "Communion Antiphon (alternative)"]
locus = "Ordo Missae nn. 133-136"

[[slots]]
key = "post-communionem"
after = "ritus-communionis/post-communionem"
propers = ["Prayer after Communion"]
locus = "Ordo Missae n. 139"

[[slots]]
key = "super-populum"
before = "ritus-conclusionis/benedictio"
propers = ["Prayer over the People"]
locus = "Ordo Missae nn. 141-143"

# ---------------------------------------------------------------- variants

[[variants]]
group = "penitential-act"
name = "Penitential Act"
what = """
The Missal prints three forms at Ordo Missae nn. 4-6, and one form is used in \
this place. The source study records the three forms and their shared bounds at \
src/claude/liturgy/roman-rite/postconciliar/2008-latin-2011-us-english/ordinary/00-order-of-mass/sections/10-introductory-rites.tex:88-105. \
The first is marked as the display default only because it is the first form the \
Missal prints; that is not a preference or an appointment for a day.
"""

[[variants.options]]
id = "pa-i"
name = "Form I — Confiteor"
default = true

[[variants.options]]
id = "pa-ii"
name = "Form II"
default = false

[[variants.options]]
id = "pa-iii"
name = "Form III"
default = false

[[variants]]
group = "creed"
name = "Creed"
what = """
The Missal prints the Nicene-Constantinopolitan Creed at n. 18 and permits the \
Apostles' Creed at n. 19 in its place, especially in Lent and Eastertide, as \
recorded and sourced in src/claude/liturgy/roman-rite/postconciliar/2008-latin-2011-us-english/ordinary/00-order-of-mass/sections/30-creed-and-universal-prayer.tex:16-24. \
The Nicene Creed is marked as the display default because it is the principal \
form printed first; the marker does not appoint a Creed on a day when none is \
said.
"""

[[variants.options]]
id = "creed-nicene"
name = "Nicene Creed"
default = true

[[variants.options]]
id = "creed-apostles"
name = "Apostles' Creed"
default = false

[[variants]]
group = "eucharistic-prayer"
name = "Eucharistic Prayer"
what = """
The postconciliar Missal prints four Eucharistic Prayers and the priest chooses \
among them; the first may always be used, and the Missal states where the fourth \
may not. The 1962 Missal has one Canon and no such choice, so this control \
belongs to this missal alone. The option marked default here is the first the \
Missal itself prints. That is the only order this project can state without \
preferring one prayer over another, and it is not a recommendation.
"""

[[variants.options]]
id = "ep-i"
name = "I — the Roman Canon"
default = true

[[variants.options]]
id = "ep-ii"
name = "II"
default = false

[[variants.options]]
id = "ep-iii"
name = "III"
default = false

[[variants.options]]
id = "ep-iv"
name = "IV"
default = false

[[variants]]
group = "salutatio-form"
name = "Opening greeting"
what = "The three ordinary greetings printed at Ordo Missae n.2 are alternatives, followed by one common response. The first printed form is only the display default. The bishop-only greeting is a nondefault option shown only by explicit selection of that named form; no date or formulary infers a bishop's presence."

[[variants.options]]
id = "greeting-trinitarian"
name = "Trinitarian greeting"
default = true

[[variants.options]]
id = "greeting-grace-peace"
name = "Grace and peace"
default = false

[[variants.options]]
id = "greeting-lord"
name = "The Lord be with you"
default = false


[[variants.options]]
id = "greeting-bishop"
name = "Bishop only — Pax vobis"
default = false
