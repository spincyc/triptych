# ---------------------------------------------------------------- absences

[[absences]]
key = "icel"
kind = "no-exemplar"
what = "The approved English of the Roman Missal for the dioceses of the United States is the International Commission on English in the Liturgy's, © ICEL, and is under copyright until well into the 2060s. It is not reproduced here. Every escape route was tested and each closes: the texts postdate 1929 so no term has expired; the first United States publication of the new Eucharistic Prayers, the 1968 Benziger booklet, carries a facially valid 1909-Act notice, so nothing was forfeited for want of one; registration was never a condition under that Act; and the Copyright Renewal Act of 1992 made renewal automatic for 1964-1977 works. What was written here before -- that ICEL's licence confines free use to worship aids for a single celebration -- was wrong, and the error is instructive. ICEL's Publication Policies carry, at page 25, an express permission to reproduce its approved, recognised and promulgated texts on a non-commercial website without written or oral permission, under six conditions; its summary page does not mention it and directs every reader to the Secretariat, and this project's own record of that book admits the fuller booklet was never retrieved. So the permission is not the reason. Two other reasons are, and both are recorded in guidance/liturgical-text-publication-policy.md: condition (3) requires the text be followed exactly and no reachable authoritative source supplies it, this library holding no witness of the English Missal at all; and condition (4) grants no licence to publish in any other form, while this project ships installed PDFs, a public JSON corpus and a public Git history. Hence `no-exemplar`: the rightsholder permits the use and this project has no exact copy of the words."

# Six reasons stand where one stood, because one key over all 48 elements said a
# rights refusal thirty-six times where no rightsholder has refused anything.
# The 48 are classified element by element in .scratch/lanes/ordinary-latin-classify/
# against this repository's own collated study of this Order of Mass at
# src/claude/liturgy/roman-rite/postconciliar/2008-latin-2011-us-english/ordinary/
# 00-order-of-mass, and each key below covers exactly the elements that earn it.
# No element gains or loses a word here: the change is to what the file says
# about why an element is empty, and to nothing else.

[[absences]]
key = "editio-typica-new-matter"
kind = "rights-withheld"
what = "The reform's own new matter, and this is the class for which the rights refusal is the true reason. The Latin of the postconciliar Missal is a work of the Holy See, first published in 1969, revised in 1975 and 2002, with the emended reprint of 2008; it is a post-1929 foreign work, protected in the United States, and this project has established no distribution basis for it. For these twelve elements no public-domain antecedent establishes the wording either, so nothing may be carried from an older book instead. This repository's tracked study of this Order of Mass states, at the loci its endnotes give, that the two Penitential Act forms II and III are new compositions in their present arrangement; that the two Benedictus es prayers over the bread and the chalice are new compositions which replaced the medieval offertory prayers Suscipe sancte Pater and Offerimus tibi Domine; that Prayers II, III and IV are twentieth-century compositions, Prayer II being an adaptation which does not print the ancient anaphora it is built on; and that the acclamation after the consecration is wholly new. Four more are recastings of ancient matter, where the older prayer is public domain and is NOT this element's text: the mingling formula is a shortened form of a Roman Christmas collect and the older witness carries an opening clause and a full conclusion the Missal deleted; the washing of hands prints a shortened verse of a different psalm from the one the older Order recited; the invitation to Communion is the older Ecce Agnus Dei joined to the beatitude of Revelation 19:9, which the study places among the substantially changed; and the two-word Communion formula with the communicant's Amen replaces the longer formula the older Order gave the priest alone. What is refused is the Missal's own composed or recast wording. Nothing here refuses the ancient prayers underneath the recastings, which are public domain and are not what these elements print."

[[absences]]
key = "antecedent-held-not-carried"
kind = "witness-gap"
what = "An ancient text this project holds an antecedent of and does not carry onto this element, and no rightsholder has refused any of it. No witness this project holds prints the Latin of the postconciliar Missal itself; that book is in copyright and is not held here. What IS held is the facing-column Latin of the 1861 Philadelphia Cummiskey hand missal, public domain and transcribed in six tracked artifacts, and ten elements of this file now carry it. These four do not, and each is refused for a reason about itself rather than about anyone's permission. The Kyrie: the witness sets the Greek acclamations as three rows of three, the ninefold form, and this Missal prints six, two to each invocation, a simplification this repository's study names in terms; joining the witness's rows would print nine acclamations under an element of six, and dropping three of them to fit would be an editorial act performed on a witness, which is as much a fabrication as normalising its spelling. The prayer for peace: the study quotes the 2002 Latin entire and its endnote states the prayer is retained from the older Roman Order - and the two strings are still not the same strings. The witness reads ne respicias peccata MEA where the quoted text reads peccata NOSTRA, and the witness carries a conclusion, qui vivis et regnas Deus per omnia saecula saeculorum Amen, that the quoted text does not. Publishing on the strength of the word retained would have put the wrong pronoun into the Rite of Peace on every day of this calendar. The priest's private preparation: the same study names the second of the two prayers Perceptio Corporis et Sanguinis tui and the witness prints Perceptio corporis tui, which does not name the Blood. The alternative Agnus Dei: that element exists only because the ecumenical English witness prints two ENGLISH forms of one invocation, while the Missal prints one Latin text of it, which the element above already carries; giving this one Latin as well would print one Latin text twice under two keys and assert a Latin variant the Missal does not have. The Kyrie becomes reachable when the element or the witness's arrangement is modelled honestly. The two divergent prayers are not reachable from this witness at all, and no older book can supply what they need, because the difference at each is the Missal's own. The alternative Agnus Dei is settled and correct as it stands."

[[absences]]
key = "no-antecedent-witness"
kind = "witness-gap"
what = "An ancient text for which this project holds no Latin witness at all, which is the witness's silence and not a rights question. The Apostles' Creed is not an element of the Tridentine or 1962 Order of Mass, so neither the 1861 Cummiskey nor the 1862 Pustet Ordo prints it, and a search of this repository finds it in no book, in no language column; locating a public-domain Latin witness of the Roman baptismal symbol is a clean acquisition task nobody has opened. The fraction and commingling formula is printed by the 1861 inside an English rubric set across the full measure, with no facing Latin - the same class the 1962 file records as no-facing-latin - and this repository's study places that formula on its retained list, so the text is ancient and the gap is a page nobody here has read. The 1862 Pustet would print it, but that artifact is uncorrected OCR whose own record says to quote from it only through a checked passage, and no passage record stands over it."

[[absences]]
key = "element-spans-mixed-matter"
kind = "witness-gap"
what = "The element models a span of the Missal wider than any one prayer, and the span contains matter this repository's own study places on both sides of its retained-and-changed line, so no witness can be joined to the element as it stands. This is a modelling fact about this file and not a refusal by anyone. Element by element: the Greeting carries four forms, of which the 1861 holds one; the first Penitential Act carries an invitation the witness does not have at all, and its Confiteor is printed there only as Confiteor Deo omnipotenti &c. with the transcriber's own note that the full prayer is not obtainable from it, its other form being the ministers' prayer addressed to the priest; the Gospel dialogue announces Lectio sancti Evangelii where the witness announces Sequentia vel initium, and the witness has no Verbum Domini after the Gospel; the embolism at n. 125 carries with it the people's doxology Quia tuum est regnum, which the study calls ancient in the Greek East and never part of the Roman Mass, a genuine importation, and the witness's own embolism differs in extent at both ends; the Pax carries n. 127, whose versicle and response the witness holds verbatim, together with n. 128 Offerte vobis pacem, for which it holds nothing; the Blessing carries three regimes - simple, solemn or prayer over the people, and the pontifical form - of which the witness supplies none in Latin; and the Dismissal carries the ancient Ite missa est with its answer together with the three formulas the 2008 reprint added, while the witness's own alternative is Benedicamus Domino, which is none of the three. Split any of these at the Missal's own numbering and its ancient half becomes sourceable at once; until then there is no honest single sourcing."

[[absences]]
key = "canon-not-split"
kind = "witness-gap"
what = "This element models the whole Roman Canon as one span, nn. 83-98, Te igitur through Per ipsum with the institution narrative inside it, and that is why nothing can be sourced onto it. The obstacle is the model and not the rights: this repository's study calls the Roman Canon the only one of the four Eucharistic Prayers not composed or assembled in the twentieth century, and the 1861 witness sets it in twenty-one public-domain rows. But the two Canons were established Latin against Latin from hash-verified facsimiles of both books and differ at eleven places, among them both consecratory forms, and every one of those places falls inside this element's extent. Carrying the older Canon here would print the reform's changes as though they were not there. The element must first be split into the received sub-prayers the older book already sets separately - Te igitur, Memento Domine, Communicantes, Hanc igitur, Quam oblationem, Qui pridie, Unde et memores, Supra quae, Supplices, Memento etiam, Nobis quoque, Per quem, Per ipsum - after which the places the reform changed are isolated and the rest are reachable. That split is a larger change than this file, and until it is made this element stays empty."

[[absences]]
key = "not-a-text"
kind = "witness-gap"
what = "These twelve elements carry no words of their own at this layer, so nothing is withheld and nothing is missing; the key exists because calling their emptiness a rights refusal would turn a modelling fact into a claim that the rite omits something. Eight are frame markers for an action or a chant - the entrance and the veneration of the altar, the first and second readings, the responsorial psalm, the Alleluia or Lenten acclamation, the homily, the universal prayer whose n. 20 is one line and no formulary, and the veneration and departure - and six of the twelve carry no Latin incipit at all. Four are propers of the day, whose text belongs to the propers layer and not to this invariant frame: the Collect, the Prayer over the Offerings, the Preface, and the Prayer after Communion. The Prefaces are the one row here with mixed matter underneath: the constitution's own two categories are taken from the more ancient tradition of the Roman Church or newly composed, the two must not be conflated in either direction, and whoever opens that corpus must classify prayer by prayer rather than treat it as one thing."

