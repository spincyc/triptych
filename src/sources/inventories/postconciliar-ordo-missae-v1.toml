schema = "triptych-ordo-missae/v1"
calendar = "postconciliar"
title = "The Order of Mass"

advisory = """
A finding aid for the shape of the rite, and never a book to celebrate from. \
Almost every text of this Order of Mass is withheld here, and the two reasons \
are kept apart at every element because they are different reasons: the \
approved English is the International Commission on English in the Liturgy's \
and this project has no licence to reproduce it, while the Latin editio typica \
is a post-1929 work of the Holy See for which this project has established no \
distribution basis at all. What stands in their place is each element's \
received Latin incipit, which is a reference and not the prayer. \
The English that IS here is the ecumenical text of the English Language \
Liturgical Consultation, which the rightsholder grants freely and which is NOT \
what is said at Mass in the dioceses of the United States. Where the two \
differ a reader will see it at once: this text answers the greeting "And also \
with you" and opens the Creed "We believe in one God", where the 2011 Roman \
Missal has "And with your spirit" and "I believe in one God".
"""

derived_from = """
The order, the numbering, the Latin incipits, the speakers and the conditions \
are transcribed from this repository's own collated study of the Order of Mass, \
src/claude/liturgy/roman-rite/postconciliar/2008-latin-2011-us-english/ordinary/\
00-order-of-mass, and in particular its research/sequence-inventory.md, which \
gives one row per received boundary in the Missal's own order and numbering \
against the 2008 editio typica tertia emendata. That study's own scope record \
states the boundary this file inherits: the Latin is quoted there where an \
argument requires it, as evidence and not as text for recitation, and the \
approved English is not reproduced. The English texts here are drawn from the \
artifact registered at \
artifact.english-language-liturgical-consultation.praying-together.1998.common-texts-en.
"""

slots_derived_from = """
Where each proper of the day stands inside this frame is read from the same \
collated study as the order of the elements, and each slot's locus is the \
Missal's own numbering of the element it is anchored to. No facsimile of the \
editio typica is held here, so unlike the 1962 frame these placements rest on \
that study and on the Missal's numbering rather than on pages this project has \
opened; the numbering is nonetheless the Missal's own statement of the order, \
and every slot below anchors to an element whose number this file already \
carries.
"""

not_decided_here = [
  "Which Eucharistic Prayer a priest should use. The Missal offers four and the choice is his; the option this file marks default is simply the first the Missal prints.",
  "Whether the Latin editio typica may be republished. The question is open and unstarted; until it is settled this file carries incipits and no Latin text.",
  "Whether the ecumenical text may lawfully be used in the liturgy anywhere. The grant recorded here is a copyright licence and nothing else; an imprimatur is not a copyright licence and a copyright licence is not liturgical approval.",
  "The Prefaces, of which the Missal prints fifty; they are proper to the day and belong to the propers layer, not to the invariant frame.",
  "Where a proper stands that this file does not seat. The Sequence, the chants of the Paschal Triduum and the whole of the Good Friday liturgy are left unplaced; a page reading this file must show them in the Missal's own order beside the proper they follow rather than invent a seat for them.",
]

# ---------------------------------------------------------------- witnesses

[[witnesses]]
id = "edition.english-language-liturgical-consultation.praying-together.1998"
lang = "en"
label = "Praying Together, the ecumenical common texts (English Language Liturgical Consultation, 1998)"
rights = "licensed-free"
acknowledgement = "English translations of the Kyrie eleison, Gloria in Excelsis, the Nicene Creed, the Apostles' Creed, the Sursum Corda, the Sanctus and Benedictus, the Agnus Dei and the Lord's Prayer, © 1998, English Language Liturgical Consultation (ELLC), and used by permission. www.englishtexts.org"
caution = "NOT the approved English of the Roman Missal, which is ICEL's and is under copyright. This is the ecumenical text agreed among English-speaking churches, and it differs from the Missal's English in wording a reader will notice. It is offered here because its rightsholder grants free use in terms, and for no other reason. Nothing here may be used for recitation."
artifacts = ["artifact.english-language-liturgical-consultation.praying-together.1998.common-texts-en"]

# ---------------------------------------------------------------- absences

[[absences]]
key = "icel"
what = "The approved English of the Roman Missal for the dioceses of the United States is the International Commission on English in the Liturgy's, © ICEL, and is under copyright until well into the 2060s. It is not reproduced here. Every escape route was tested and each closes: the texts postdate 1929 so no term has expired; the first United States publication of the new Eucharistic Prayers, the 1968 Benziger booklet, carries a facially valid 1909-Act notice, so nothing was forfeited for want of one; registration was never a condition under that Act; and the Copyright Renewal Act of 1992 made renewal automatic for 1964-1977 works. ICEL's own licence terms confine free use to non-commercial worship aids for a single celebration, which this site is not."

[[absences]]
key = "editio-typica"
what = "The Latin of the postconciliar Missal is a work of the Holy See first published in 1969 and revised in 1975 and 2002, with the emended reprint of 2008. It is a post-1929 foreign work, protected in the United States, and this project has established no distribution basis for it. This repository's own study of this Order of Mass draws the same line, quoting the Latin as evidence for an argument and not as text for recitation. Each element therefore carries its received Latin incipit, which identifies the prayer without reproducing it, and no more. This is the one blocking question for anyone who wants the Latin served here."

