schema = "triptych-ordo-missae/v1"
calendar = "postconciliar"
title = "The Order of Mass"

advisory = """
A finding aid for the shape of the rite, and never a book to celebrate from. \
Most of this Order of Mass is missing here, and every element says which of its \
two texts is missing and why, because they are not missing for one reason. The \
English side has one reason, recorded here as `icel`: the approved English is \
the International Commission on English in the Liturgy's, and this project holds \
no exact copy of the words. The Latin side has six, and they run from the \
reform's own new matter, which is the Holy See's and is withheld, to a rubric \
that has no words in any book. Where a text is missing what stands in its place \
is the element's received Latin incipit, which is a reference and not the prayer. \
THE LATIN THAT IS HERE IS NOT THIS MISSAL'S. Ten elements carry Latin, and at \
every one of them it is the facing column of an 1861 Philadelphia lay hand \
missal printing the ancient prayer this Order of Mass received. The Latin of the \
editio typica itself is in copyright and is not held by this project, in any \
element, anywhere on this page. Each of the ten says beside its own words which \
prayer of that older book it is, at which printed page and leaf, which accidents \
of that printing it carries unnormalised, and whether its identity with the \
controlling edition has been established by a collation this repository holds or \
is so far only asserted. Four are established; six are not, and they say so. \
The English that IS here is the ecumenical text of the English Language \
Liturgical Consultation, which the rightsholder grants freely and which is NOT \
what is said at Mass in the dioceses of the United States. Where the two \
differ a reader will see it at once: this text answers the greeting "And also \
with you" and opens the Creed "We believe in one God", where the 2011 Roman \
Missal has "And with your spirit" and "I believe in one God".
"""

derived_from = """
The order, the numbering, the Latin incipits, the speakers and the conditions \
are transcribed from this repository's own collated study of the Order of Mass, \
src/claude/liturgy/roman-rite/postconciliar/2008-latin-2011-us-english/ordinary/\
00-order-of-mass, and in particular its research/sequence-inventory.md, which \
gives one row per received boundary in the Missal's own order and numbering \
against the 2008 editio typica tertia emendata. That study's own scope record \
states the boundary this file inherits: the Latin is quoted there where an \
argument requires it, as evidence and not as text for recitation, and the \
approved English is not reproduced. The English texts here are drawn from the \
artifact registered at \
artifact.english-language-liturgical-consultation.praying-together.1998.common-texts-en. \
The Latin texts here are drawn from a DIFFERENT BOOK, and that is the whole of \
what has to be understood about them: the six ordinarium, praefationes and \
canon-missae `-la` artifacts of \
edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861, which \
transcribe the facing Latin column of an 1861 Philadelphia lay hand missal from \
a registered scan at 640 dpi, one physical line per printed block, each row \
carrying its own printed page, Internet Archive leaf and transcriber's note. \
Those artifacts are already the Latin of this project's 1962 frame; here they \
are joined to a second calendar, element by element, because the older book \
prints the ancient prayer the postconciliar Missal received and for no other \
reason. Nothing is transcribed afresh for this file and nothing is normalised: \
the join names artifact rows that already exist and already carry their hash.
"""

slots_derived_from = """
Where each proper of the day stands inside this frame is read from the same \
collated study as the order of the elements, and each slot's locus is the \
Missal's own numbering of the element it is anchored to. No facsimile of the \
editio typica is held here, so unlike the 1962 frame these placements rest on \
that study and on the Missal's numbering rather than on pages this project has \
opened; the numbering is nonetheless the Missal's own statement of the order, \
and every slot below anchors to an element whose number this file already \
carries.
"""

not_decided_here = [
  "Which Eucharistic Prayer a priest should use. The Missal offers four and the choice is his; the option this file marks default is simply the first the Missal prints.",
  "Whether the Latin editio typica itself may be republished. That question is open, this file does not answer it, and nothing here depends on the answer. Of the forty-eight elements, twelve are empty in Latin because the reform's own new matter is the Holy See's and is withheld; twenty-six are empty because of a witness or a modelling gap and no rightsholder has refused them; and ten carry Latin that is not the editio typica's at all, but an 1861 lay printing's of the ancient prayer this Order received. No word of the editio typica is reproduced here, in any element.",
  "Whether the ecumenical text may lawfully be used in the liturgy anywhere. The grant recorded here is a copyright licence and nothing else; an imprimatur is not a copyright licence and a copyright licence is not liturgical approval.",
  "The Prefaces, of which the Missal prints fifty; they are proper to the day and belong to the propers layer, not to the invariant frame.",
  "Where a proper stands that this file does not seat. The Sequence, the chants of the Paschal Triduum and the whole of the Good Friday liturgy are left unplaced; a page reading this file must show them in the Missal's own order beside the proper they follow rather than invent a seat for them.",
  "Whether the six elements carried here at the `uncollated` grade are word-identical with the editio typica. They are carried because this repository's own study of this Order of Mass, made on a direct reading of both books, places them among the texts the postconciliar Order retained with little or no change of wording, and because the words themselves are attested in a public-domain witness this project has read at a named leaf. That is not an established identity and it is not written down as one. No word-level comparison against the controlling edition has been made at any of the six; the study quotes no 2002 Latin at all at five of them; and its own coarse retention list is known to mislead, because at two elements of this very file that list says retained and the words are still not the same words. Each of the six says so beside its own words. Settling it means opening the controlling edition, which this project does not hold and has not opened.",
  "Whether an antecedent witness's spelling should ever be brought toward the controlling edition's. It is not, anywhere here. The 1861 column prints justum for iustum, Jesu for Iesu, the ae- and oe-ligatures, Et expecto for Et exspecto, and at least one plain misprint - nodie for hodie - and every one of them is carried as printed and named in the element's own note. Smoothing them would manufacture a witness to a book nobody opened; carrying them silently under a heading naming the editio typica would attribute a lay printer's misprints to the Holy See. Naming them is the only honest third option and it is what this file does.",
]

