note = """
ANTECEDENT, NOT THE CONTROLLING EDITION. The Latin here is the facing column of \
the 1861 Philadelphia Cummiskey hand missal at its Per ipsum and the versicle \
that closes its Canon, printed pages xxxviii-xxxix, Internet Archive leaves \
48-49, joined from that book's own two blocks. The controlling 2008 text is not \
distributable on this surface and is not served here. The repository holds and \
has read a verified 2002 Ordo witness and the official bounded 2008 variation \
list, but that evidence does not establish this word identity; these are the \
1861 printing's words. Carried as printed and normalised nowhere: the book prints no cross \
signs in this block, which the older Roman rite marks five times; it reads \
saecula saeculorum with the ae-ligature, set unbroken here where the same \
versicle at the foot of xxvii prints a full stop after saecula; and it sets \
the Amen in italic. THE SHAPE DIFFERS AND THE MARKS SHOW IT: the witness's \
P. and R. divide the closing versicle between priest and minister, which is the \
older Order, where this Missal makes per omnia saecula saeculorum the end of the \
doxology itself and the people's Amen answers the whole. The marks are the \
witness's and are not this Missal's rubric. \
UNCOLLATED: the identity of this text with the controlling edition's is not \
established here. This repository's study of this Order of Mass records at \
00-order-of-mass/sections/55-roman-canon.tex:114 that the prayer text is \
substantially identical from Te igitur to Per ipsum apart from the changes to \
the dominical words, which fall elsewhere in the Canon and not in this element. \
It quotes no 2002 Latin of the doxology, so no word-level comparison has been \
made.
"""

# ================================================================ F. Ritus communionis

[[sections]]
key = "ritus-communionis"
name = "The Communion Rite"

[[sections.elements]]
key = "pater-noster"
kind = "prayer"
speaker = "all"
name = "The Lord's Prayer"
latin_incipit = "Praeceptis salutaribus moniti"
missal_number = "n. 124"
absent_english = "approved-english-publication-restriction"
note = "The Roman Rite does not say the prayer continuously: the doxology follows the embolism Libera nos rather than preceding it."

# Two witness rows to one element, and the witness's own speaker marks are left
# standing inside the second. They record the older Order, where the priest said
# the prayer and the ministers answered the last petition; this Missal has all
# say it together. That is a change of speaker and not of words, and deleting
# the marks would have hidden the one difference there is to see.
[sections.elements.latin]
witness = "edition.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861"
artifact = "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.ordinarium-communio-la"
elements = ["praeceptis-salutaribus", "pater-noster"]
column = "latin"
relation = "antecedent"
collation = "uncollated"
note = """
ANTECEDENT, NOT THE CONTROLLING EDITION. The Latin here is the facing column of \
the 1861 Philadelphia Cummiskey hand missal at its Praeceptis salutaribus and \
Pater noster, printed page xxxix, Internet Archive leaf 49, joined from that \
book's own two blocks. The controlling 2008 text is not distributable on this \
surface and is not served here. The repository holds and has read a verified \
2002 Ordo witness and the official bounded 2008 variation list, but that evidence \
does not establish this word identity; these are the 1861 printing's words. Carried \
as printed and normalised nowhere: the invitation opens with a two-line drop P \
followed by Raeceptis, a capital R and the rest lower-case, with the \
ae-ligature, given here as printed; the prayer reads coelis and coelo with the \
oe-ligature and quotidianum for cotidianum; and the book runs the response R. \
Sed libera nos a malo and the priest's italic P. Amen. into the same block, \
which is the older Order's division of the prayer between priest and ministers \
and not this Missal's. \
UNCOLLATED: the identity of this text with the controlling edition's is not \
established here. This repository's study of this Order of Mass quotes the 2002 \
Latin of the INVITATION at n. 124, in \
00-order-of-mass/sections/70-communion-rite.tex:19-23, and that quotation and \
this witness's first row agree word for word. It quotes no 2002 Latin of the \
Our Father itself, which is the larger half of this element and has been \
compared with nothing. The study names the Pater noster with its introduction \
among the texts retained with little or no change of wording, and records the \
change that is real: the people now say it with the priest, where in the older \
Roman Order the priest said it and the ministers answered the last petition.
"""

