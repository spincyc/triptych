[what_was_searched]
method = """
Thirty-two probes per book, case-folded and accent-stripped, with j folded to i,
v to u, ae- and oe-digraphs expanded and `&` read as `ae`, so that `GONZAG&`,
`Gonzagae` and `gonzagae` all match one pattern. Run over every leaf of every
book. Every probe is named below with its outcome, INCLUDING THE ONES THAT FOUND
NOTHING, because a sweep reported only by its hits is indistinguishable from a
lucky one.

THE METHOD HAD TO BE REBUILT MID-RUN AND THAT IS THE MOST TRANSFERABLE FINDING
HERE. The first pass probed the `_djvu.txt` text layers LINE BY LINE. All five
books returned clean. THEY WERE NOT CLEAN: these missals set two columns to the
page and the Internet Archive's text layer interleaves them, so a two-word
heading like `SANCTI IOANNIS / NEPOMUCENI` is split across two text lines and a
line-oriented pattern can never match it. The second pass probed WHOLE LEAVES,
reconstructed from each item's own per-leaf recognition (`<id>_djvu.xml`), and
St Aloysius Gonzaga and St John Nepomucene appeared immediately in the 1712 --
the two saints that turned out to date its bound-in fascicles. EVERY NEGATIVE
REPORTED BELOW IS FROM THE LEAF-LEVEL PASS. A later lane running a negative
search over any of these artifacts must do the same, or say that it did not.

THE PROBES HAVE A SECOND, UNFIXED LIMIT AND IT IS REPORTED RATHER THAN BURIED.
The leaf-level battery ALSO missed St Charles Borromeo in the 1640, where he is
plainly present: the index at n7 reads `Caroli, Epifc.Mcdiol.4.Nouembris.` and
the body has `S. Caroli,Epi(c. Mediol. folemne.` The probe looked for `Borromaei`
and for `Caroli ... Mediol`; this book never uses the surname, and the scan reads
`Mediol` as `Mcdiol`. He was found by reading, not by searching. Borromeo is 1610
and expected in a 1640 book, so nothing turned on it -- but A BATTERY THAT CAN
MISS A SAINT IT IS HUNTING IS A BATTERY WHOSE NEGATIVES CARRY THAT LIMIT, and
the limit is attached to every negative in this file.
"""
