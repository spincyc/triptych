# --- The line, and why it is a conclusion --------------------------------------

[the_line]
statement = """
Any work first published outside the United States before 1931 is out of United
States copyright. That is the line guidance/missals.md records from Cornell's
public-domain chart as current on 1 January 2026 [recorded].

THE LINE MOVES EVERY JANUARY. guidance/missals.md:249 says so in terms, so it is
stated here as DERIVED FOR CALENDAR YEAR 2026 and not as a standing rule: on
1 January 2027 it becomes before 1932, on 1 January 2028 before 1933, and a later
reader must re-derive it rather than quote this sentence. The movement is always
in these books' favour and none of them is close enough for the movement to
matter:

  1499  clears the 2026 line by 432 years
  1640  clears it by 291 years
  1712  clears it by 219 years; the 1733 matter bound into it by 198
  1755  clears it by 176 years
  1862  clears it by  69 years -- the narrowest margin in this acquisition
"""
uraa_is_closed = """
Restoration under 17 U.S.C. 104A cannot reach any of them. A restored copyright
subsists for the remainder of the term the work would have had with United States
formalities complied with, which for a foreign work is 95 years from publication:
1594 for the 1499, 1735 for the 1640, 1807 for the 1712, 1828 for the 1733
matter, 1850 for the 1755, and 1957 for the 1862. Every one of those dates is in
the past, several of them by centuries. This is the same closure
missale-bracarense-rights-v1.toml states for 1924 and it is what makes a
pre-1931 date a conclusion rather than a presumption.
"""

