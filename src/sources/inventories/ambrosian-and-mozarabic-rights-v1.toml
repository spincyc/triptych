A NOTE ON A FALSE POSITIVE, because it nearly became a finding. Line 970 of the
1499 reads `0ancri marroli arcbiepifcopi mediolani` and was first read as Sancti
CAROLI archiepiscopi Mediolani -- Charles Borromeo, canonized 1610, in a 1499
book, which would have refused it. It is St MAROLUS, archbishop of Milan, died
423, feast 23 April. The neighbouring entries are of the same kind: `Sancti
Castriciani archiepiscopi Mediolani` at line 2550, Castritian being the first
bishop of Milan. AN AMBROSIAN KALENDAR IS FULL OF LATE-ANTIQUE MILANESE
ARCHBISHOP-SAINTS and a sweep of this rite must expect it.
"""

# --- The hosts, which are three different shapes ---------------------------------

[the_hosts]
why_this_section_exists = """
The commissioning brief said the Sainte-Genevieve and Bayerische Staatsbibliothek
items are NOT Internet Archive items and that their hosts' conditions of use are
`a different rights shape from a bare public-domain mark`. THE FIRST HALF IS
WRONG AND THE SECOND HALF IS RIGHT, and disentangling them is worth a section
because the same confusion will recur on every institutional digitisation this
project meets.

All six files were fetched from archive.org. What differs is WHO PUT THEM THERE
and WHAT THEY SAY ABOUT THEM, and there are three distinct shapes in this
acquisition.
"""
shape_one_library_uploads_its_own_scan = """
THE 1499. Internet Archive item `OEXV698`, in the collections
`bibliothequesaintegenevieve` and `bibliothequesaintegenevievelivres`, uploaded
BY the library from `bsg.numerisation@sorbonne-nouvelle.fr` [verified]. The item
carries `rights = "domaine public"` and `licenseurl =
http://creativecommons.org/publicdomain/mark/1.0/`, and `source = "Bibliotheque
Sainte-Genevieve, OEXV 698 RES"` [verified]. The library's practice of
distributing its digitised incunabula on the Internet Archive under the Public
Domain Mark since 2010 is consistent with both [sourced].

This is the CLEANEST shape and the one that most tempts a lane to lean on it. IT
IS NOT LEANED ON HERE. A digitising library's statement is a statement about its
scans; it cannot enlarge or shrink the copyright status of a book printed in
1499, and where an institution asserts terms over a faithful reproduction of
public-domain matter this repository's position is the Bridgeman one.
"""
shape_two_third_party_reupload_of_a_library_scan = """
THE 1712. Internet Archive item `10869665bsb`, uploaded on 24 May 2026 by a
PRIVATE INDIVIDUAL, `pavelserebrjanyi@gmail.com`, into `german-online-libraries`,
with `source_url = https://www.digitale-sammlungen.de/en/view/bsb10869665`
[verified]. The scan is the Bayerische Staatsbibliothek's: its own digitisation
card is bound into the file as leaf n624, reading `Bayerische StaatsBibliothek /
MDZ Munchener DigitalisierungsZentrum / Digitale Bibliothek / Missale
Ambrosianum / Mediolanum 1712 / Res/2 Liturg. 182 /
urn:nbn:de:bvb:12-bsb10869665-9` [verified].

THE ITEM CARRIES NO `licenseurl` AND NO RIGHTS FIELD AT ALL [verified]. So unlike
the 1499 there is no host mark here even to decline to rely on, and the basis
rests entirely on the imprints and on Bridgeman -- which is where it should rest
anyway. The MDZ's published practice is to serve public-domain digitisations
under the Public Domain Mark 1.0, permitting copying, modification and
distribution including for commercial purposes without permission, and to state
its rights position per object [sourced]. THE OBJECT PAGE ITSELF COULD NOT BE
LOADED FROM THIS RUN -- three attempts on 2026-08-02 returned the MDZ's error
page -- SO IT IS NOT RELIED ON IN EITHER DIRECTION and is recorded as an
unverified gap rather than as a licence.

The shape's hazard is worth naming: a re-upload's metadata is the uploader's, not
the library's. This item's `language` field says `English` for a wholly Latin
book, and its `date` field says 1712 for a volume that also contains 1733 matter.
Neither error would have been made by the holding library and both are in the
record a consumer would read first.
"""
shape_three_google_scan_and_its_own_front_matter = """
THE 1640, THE TWO 1755 COPIES AND THE 1862, all scanned by Google for the
National Central Library of Rome, the National Central Library of Florence, the
New York Public Library and Harvard respectively.

TWO OF THESE FILES CONTAIN MODERN PROSE OF GOOGLE'S OWN AUTHORSHIP AND IT IS IN
THE TRACKED BYTES. `missalemixtumse00leslgoog_djvu.txt` at lines 1-43 and
`liturgiamozarab01churgoog_djvu.txt` at lines 1-46 carry Google's `Usage
guidelines` page [verified]: `Google is proud to partner with libraries to
digitize public domain materials...`, `+ Make non-commercial use of the files We
designed Google Book Search for use by individuals, and we request that you use
these files for personal, non-commercial purposes`, `+ Maintain attribution The
Google "watermark" you see on each file is essential... Please do not remove it`.
The two `bub_gb_*` items DO NOT carry it -- the Wikimedia `bub` upload chain
stripped it, leaving only the watermark as OCR noise, `gitized by Godgle`
[verified].

BRIDGEMAN DOES NOT REACH THAT PAGE, because it is not a reproduction of anything;
it is new writing of the 2000s. This is structurally the same problem as Braga's
-- the exact artifact carries matter its basis does not cover -- and it is
answered rather than ignored:

  1. GOOGLE WROTE AND INSERTED THAT PAGE PRECISELY TO TRAVEL WITH THE FILE and
     asks in it that the attribution not be removed. Redistributing it unaltered
     is exactly what it requests, and that is an implied licence to do so. It is
     redistributed unaltered.
  2. THE NON-COMMERCIAL SENTENCE IS A REQUEST AND NOT A CONDITION. Google's
     wording is `we request that you use these files for personal,
     non-commercial purposes`, and the same page says `Public domain books
     belong to the public and we are merely their custodians`. Google asserts no
     copyright in the books or in the scans and could not sustain one in a
     faithful reproduction.
  3. IT IS SEVERABLE, WHICH BRAGA'S SUPPLEMENT WAS NOT. `sed '1,43d'` on the New
     York file and `sed '1,46d'` on the Migne file are stated replayable
     transformations on a boundary the files actually have. That route is not
     taken, because it is not needed and because the exact acquired bytes are
     worth more than a tidier file; it is recorded so that a later lane that
     wants the book without the notice knows the cut is clean. Contrast
     missale-bracarense-rights-v1.toml `[routes_examined_and_refused]`, where the
     supplement was scattered through the sanctoral and no such cut existed.

Nothing in this repository quotes the notice as source text.
"""

# --- What may and may not be done -------------------------------------------------

[the_practical_answer]
may = """
  Publish, quote, index, search and redistribute the text of all five books from
  these six artifacts.
  Retain the exact acquired bytes in Git, which is what `tracked` means and what
  has been done.
  Build derivatives -- normalisation, OCR correction, page maps, extracted
  passages -- as SEPARATE artifacts linked to these as inputs, per
  guidance/sources.md. Do not silently correct these files in place.
"""
may_not = """
  Quote any of these text layers as a reading of the liturgy without checking it
  against the page images. Every one of the six is uncorrected OCR and two of
  them are `degraded-latin`. `read_from = "not-read"` on the Ambrosian and
  Mozarabic witness rows in src/sources/inventories/latin-missal-acts-v1.toml is
  still correct and was not touched by this lane.
  Rest a NEGATIVE search on the 1499 or on the Florence 1755. At 0.0537 and
  0.0509 Latin function-word share, an absent string in either is evidence about
  the recognition and not about the book.
  Attribute a formulary from leaves n596-n614 of the 1712 file to the year 1712.
  Those are the 1733 fascicles.
  Cite `liturgiamozarab00churgoog` as a Mozarabic MISSAL. It is the Breviarium
  Gothicum, Patrologia Latina 86.
  Treat the New York 1755 copy as containing the whole book. It stops at its
  leaf n401.
"""

# --- What would overturn this -----------------------------------------------------

[what_would_overturn_this]
note = "Stated concretely, so a later reader can attack this record on its own terms rather than re-deriving it."
items = """
  1.  EVIDENCE THAT ANY OF THE FIVE BOOKS WAS FIRST PUBLISHED LATER THAN ITS
      IMPRINT SAYS. Every date above is a colophon or title page READ IN THE SCAN
      or, for the 1640, corroborated by the book's own paschal table. A
      demonstration that one of these scans is of a later re-impression carrying
      an old date would move that book -- though for four of the five it would
      have to move it by more than a century and a half to reach the line.

  2.  POST-1931 MATTER IN ANY OF THE SIX FILES THAT THE SWEEP MISSED. This is
      the live risk and it is not hypothetical: the sweep's own limits are
      documented in `[what_was_searched].method`, it demonstrably missed a saint
      it was hunting in the 1640, and its negatives over the 1499 and the
      Florence 1755 are worthless for the reason given. THE MOST LIKELY PLACE
      FOR SUCH MATTER IS THE END OF A VOLUME, where the 1712's 1733 fascicles
      were found and where Braga's 1961 leaves were. The 1499, 1640 and Florence
      1755 were each read to their last substantive leaf here; the 1862 and the
      New York 1755 were not read leaf by leaf to the end, only swept.

  3.  A DETERMINATION THAT GOOGLE'S `Usage guidelines` PAGE IS NOT REDISTRIBUTABLE
      on the reasoning in `[the_hosts].shape_three_google_scan_and_its_own_front_matter`.
      It would not touch the books. It would require deleting lines 1-43 of the
      New York 1755 artifact and lines 1-46 of the 1862 artifact, on the stated
      replayable cuts, and re-hashing both.

  4.  A CHANGE IN LAW SHORTENING OR EXTENDING RESTORED TERMS. Nothing of the kind
      is pending; recorded because a rights record that lists no such condition
      claims a permanence it does not have.

  5.  A CLAIM BY A DIGITISING INSTITUTION over its scans of these books. It would
      be met with Bridgeman and with `[the_hosts]`, and it is recorded as a thing
      that could be asserted rather than as a thing that would succeed.

Note what does NOT overturn any of this: an Internet Archive public-domain mark,
the absence of any rights field on an item, the absence of a copyright notice in
a book, or the fact that a download succeeded. The last of those is the point
guidance/sources.md:395-400 makes in terms, and the first is the ground refused
at src/sources/inventories/lt-hist-rights-audit-v1.toml.
"""

# --- Corrections to records already in this repository, and to the brief ----------

[[corrections]]
id = "1755-new-york-copy-is-not-whole"
claim = "The 1755 Lesley Mozarabic missal digitised as `missalemixtumse00leslgoog` is `the first edition of the rite anyone here can read whole` [recorded, src/sources/inventories/latin-missal-acts-v1.toml, witness row 1755-missale-mixtum-lesley]."
finding = "True of the EDITION and false of THAT COPY. The New York Public Library scan's last text leaf, n401 of 408, breaks off inside the sanctoral at `IN JEJUNIO KALENDARUM NOVEMBRIUM` with no explicit and no end matter. The complete text is in the National Central Library of Florence copy, Internet Archive `bub_gb_hAJaQabODUYC`, whose leaf n591 of 761 prints `Expletum est Missale Mixtum secundum regulam Beati Isidori dictum Mozarabes` [verified]."
effect = "Both copies are registered as artifacts of the one 1755 edition, with the difference stated on each and in the edition record, so that a reader who needs the end of the book knows where it is and a reader who needs legible Latin knows the New York copy is far better OCR (0.1294 against 0.0509) for as far as it goes. THE ROW ITSELF WAS NOT EDITED: the act-history inventories were outside this lane's ownership. Nothing about the row's identifier, image count, byte sizes or rights is wrong; all four were re-verified here."

[[corrections]]
id = "hAJaQabODUYC-is-not-a-duplicate"
claim = "`bub_gb_hAJaQabODUYC` is a duplicate of the Lesley 1755 the act history already carries [the commissioning brief for this lane, 2026-08-02]."
finding = "It is a different copy of the same edition and it carries more of the book: 761 leaves against 408, and it runs to the work's explicit where the other stops part way through the sanctoral [verified]. Its OCR is much worse. Neither copy substitutes for the other."
effect = "Registered as a second artifact of the 1755 edition rather than discarded. guidance/sources.md names both failures this avoids -- a false absence, where the end of a book is held under a name nobody searched, and a false duplicate, where two copies drift and nothing compares them. Recorded because `duplicate` was the reason the brief gave for not looking, and looking took four minutes."

[[corrections]]
id = "liturgiamozarab00churgoog-is-a-breviary"
claim = "`liturgiamozarab00churgoog` is a duplicate of the Migne 1862 Mozarabic missal [the commissioning brief for this lane, 2026-08-02]."
finding = "IT IS A DIFFERENT BOOK AND A DIFFERENT GENRE. Its Internet Archive `volume` field says 2; its own pages say `TOMUS POSTERIOR` and carry the running signature `PATROL. LXXXVI.` throughout. It is Patrologia Latina 86, the Breviarium Gothicum recognised by Lorenzana -- a BREVIARY, 819 leaves, carrying the office and not the Mass. The missal is Patrologia Latina 85, `TOMUS PRIOR`, Internet Archive `liturgiamozarab01churgoog`, 685 leaves, which is the item the act history names and the one registered here [verified]."
effect = "Not registered. Folding it in as a second copy of the missal would have put an office book under a missal's identity. It is named here so that the next reader does not re-derive it; the two items share the set title `Liturgia Mozarabica ... in duos tomos divisa`, which is the whole reason the confusion is easy, and the `volume` field is the quickest discriminator."

[[corrections]]
id = "the-1712-scan-is-a-composite"
claim = "`10869665bsb` is a digitisation of the Missale Ambrosianum, Milan 1712 [the Internet Archive item's own title and description; the Bayerische Staatsbibliothek digitisation card bound into the scan; the commissioning brief]."
finding = "The volume is that book PLUS Masses printed at Milan in 1733 by order of Cardinal Odescalchi, bound in after the Missal's own last quire, two of which print saints canonized after 1712 -- St Aloysius Gonzaga (1726) at leaf n602 and St John Nepomucene (1729) at n604. The added fascicles carry their own title pages dated MDCCXXXIII at leaves n606 and n612 and a terminal colophon of the same year at n598 [verified, and the n606 title page read in the page image]."
effect = "The edition record's title says so, and the artifact record locates the strata. NO RIGHTS CONSEQUENCE: 1733 clears the pre-1931 line by a hundred and ninety-eight years, so unlike Braga this is a bibliographic finding and not a refusal. Recorded because an edition record reading `1712` flat would be false about the bytes, and because the next lane to quote a Mass off leaf n602 as evidence of the Ambrosian use in 1712 would be twenty-one years wrong."

[[corrections]]
id = "the-hosts-are-all-internet-archive"
claim = "The Sainte-Genevieve and Bayerische Staatsbibliothek items are NOT Internet Archive items, and their hosts have their own conditions of use, which is a different rights shape from a bare public-domain mark [the commissioning brief for this lane, 2026-08-02]."
finding = "Both ARE Internet Archive items and both were fetched from archive.org: `OEXV698`, uploaded by the Bibliotheque Sainte-Genevieve itself into its own Internet Archive collection, and `10869665bsb`, uploaded by a private individual from the Bayerische Staatsbibliothek's digitisation [verified]. The brief's second clause nevertheless identifies something real, and it is not what the first clause implies: the difference between these items is not archive.org versus elsewhere but WHO UPLOADED AND WHAT THEY SAID. The 1499 carries a library's own `rights = domaine public` and a CC Public Domain Mark; the 1712 carries no rights field of any kind; the four Google-scanned items carry a Public Domain Mark or a `NOT_IN_COPYRIGHT` guess, and two of them carry Google's own modern usage notice inside the bytes."
effect = "`[the_hosts]` sets out the three shapes and the position on each. The operative point survives the correction: a host's mark is never a link in any basis in this file, and the one host whose object page could not be loaded is recorded as an unverified gap rather than as a licence."

[[corrections]]
id = "the-1640-imprint-is-not-only-a-printing-licence"
claim = "The 1640 Ambrosian missal's `impress. archiep.` imprint `is a licence to print and NOT an act revising the rite`, which is why its station is `printed` and not `promulgated` [recorded, src/sources/inventories/latin-missal-acts-v1.toml, witness row 1640-missale-ambrosianum-sirtori]."
finding = "The imprint limb is right about the imprint. But the book prints, at leaf n6 and before anything else, a letter of `CAESAR ... CARDINALIS MONTIVS, ARCHIEPISCOPVS` to the whole clergy of Milan, in which the archbishop says a new edition was called for -- `iam temporis edacitas nouam Missalis editionem postulabat` -- and that he has had particular orations and whole Masses of certain saints placed each in its own place, some of them instituted by himself: `collocari suis locis, prout ratio temporum exigebat, peculiares quorundam Sanctorum Orationes, et integra etiam eorum Sacra, quae ... Nos ipsi ad maiorem Dei gloriam instituimus` [verified]. That is an act of the metropolitan of the rite upon the book, not merely a licence to a printer."
effect = "Nothing was changed. The station's classification is the act history's and the act-history inventories were outside this lane's ownership; the finding is recorded on the edition record and here so that a lane that does own them can weigh it. It is a candidate for reclassification and is expressly NOT asserted as one: whether an archbishop's preface saying he revised the book is a `promulgation` in this file's vocabulary is a question about the vocabulary, and the acquisition lane is not the place to answer it."

