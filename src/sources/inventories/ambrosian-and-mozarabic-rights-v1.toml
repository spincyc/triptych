  Regis`, `Christi Regis`, `Quas primas`, `Dominica ultima Octobris`.
  ST THERESE OF LISIEUX, canonized 1925 and universal 1927 -- 0 hits on
  `a Iesu Infante`, `ab Infante Iesu`, `Infante Iesu`.
  THE IMMACULATE HEART OF MARY AS `duplex II classis`, 1944 -- 0 hits on
  `Immaculati Cordis`, `Cordis Immaculati`.
  THE ASSUMPTION IN THE MASS SIGNUM MAGNUM, 1950 -- 0 hits on `Signum magnum`
  AND 0 ON `ignum magnum`, THE FORM IT TAKES WHERE A SCAN DROPS AN ORNAMENTAL
  INITIAL. That second form is the string that hid the 1920's true date for a
  day and it was probed for deliberately in every book here.
  THE 1960 CODE OF RUBRICS CLASS RANKS -- 0 hits on `I classis`, `II classis`,
  `III classis`, `1. classis`, `2. classis`, `3. classis`, `duplex II classis`.
  Two such labels in a book that otherwise never uses them were what exposed the
  Braga supplement.

Also absent from all five [verified]:

  St Rose of Lima (1671), St Vincent de Paul (1737), St Alphonsus Liguori (1839),
  St Joan of Arc (1920), St Bernadette Soubirous (1933), St John Bosco (1934),
  Thomas More and John Fisher (1935), St Maria Goretti (1950), St Anthony Mary
  Claret (1950) -- 0 hits each.
  The Immaculate Conception dogma, `Ineffabilis Deus` (1854) -- 0 hits.
  The 1929 Mass of the Sacred Heart, `Cogitationes cordis` as an Introit --
  0 hits.
  Our Lady of Fatima -- 0 hits. Our Lady of Lourdes and the 1907 feast --
  0 hits.
  The restored Holy Week of 1955 -- 0 hits on `Vigilia paschalis`, `Ordo
  Hebdomadae Sanctae`, `instauratus ordo`.
  St Joseph in the Canon, inserted 1962 -- 0 hits on `eiusdem Virginis Sponsi`.
  Rubricarum instructum, John XXIII, the Second Vatican Council, Sacrosanctum
  Concilium, any post-conciliar matter -- 0 hits.
  Any copyright notice or reservation of rights in five languages -- 0 hits on
  `all rights reserved`, `tutti i diritti`, `todos los derechos`, `tous droits`,
  `proprieta letteraria`. NOT RELIED ON IN EITHER DIRECTION: after the URAA a
  foreign work needs no notice to be protected, so an absence proves nothing.
  This is the same discipline missale-bracarense-rights-v1.toml applied to the
  same absence.
  Any arabic year later than each book's imprint, outside the paschal tables of
  the 1640 and the worked examples in the 1712's epact rubric, and outside the
