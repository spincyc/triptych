[[open_questions]]
id = "lasance-renewal"
version = "1937-lasance-new-roman-missal-english"
status = "CLOSED 2026-08-01"
question = "Was the copyright in Lasance's The New Roman Missal (Benziger Brothers, notice dated 1936) renewed in its 28th year?"
answer = "No, for either registered edition. The text is in the public domain in the United States by failure to renew."
settled_in = "src/sources/inventories/lasance-new-roman-missal-rights-v1.toml"
what_settled_it = """
What this row asked for, and more of it. Not an OCR search of scanned volumes
but a search at REGISTRATION-NUMBER level across five independent bodies of
record: the Catalog of Copyright Entries registration volumes for 1936, 1937,
1942, 1945 and 1946; the Stanford Copyright Renewal Database dump of 27 April
2017 (246,448 rows); NYPL's `cce-renewals` (445,386 rows, 1950-2001);
`leonardr/cce-spreadsheets`, which places both registrations in
FINAL-not-renewed; and the raw OCR of the four Catalog volumes covering the
window, searched with three positive controls so that the negative could be
distinguished from a failed search.

  A 110108, copyright 15 July 1937, Benziger Brothers, CCE NS 34 (1937) p. 1396,
  LCCN 37-23958. Window 15 Jul 1964 - 15 Jul 1965. No renewal.

  A 192159, copyright 1 November 1945, Benziger bros., inc., CCE NS 42 (1945)
  p. 307. Window 1 Nov 1972 - 1 Nov 1973. No renewal.

Two corrections this row itself needs. Its window arithmetic was drawn from the
1936 NOTICE and gave 1963-1966; the registration dates are 15 July 1937 and
1 November 1945, so the windows are 1964-65 and 1972-73, and the second edition
-- which this row did not know about -- needed a search eight years later than
anything contemplated here. And "public domain from 1966" is wrong twice over:
the term expired at the close of the twenty-eighth year, in 1965, and the 1945
edition's did not expire until 1973.
"""
what_did_not_come_free = """
The settled record is not a blanket. Three things it excludes belong in this file
because a fold-in would meet them:

  The appendix at pages 1298a-1298n of lt-hist's own downloaded OCR is new
  matter first published after October 1954 under no registration found, and is
  EXCLUDED until the printing is dated from a physical copy.

  The inserted Common at pages 1302a-1302d has not been established as part of
  either unrenewed registered edition and is EXCLUDED until edition evidence or
  another affirmative basis resolves it.

  Other Lasance titles WERE renewed. The New Missal for Every Day -- one word
  from this title, same author, same publisher, same William R. Kelly -- carries
  three renewals: R85220, R247840 and R101887. It is not free and must not be
  conflated with this one.
"""
and_the_artifact_is_misidentified = "See the version row's `identification_corrected`. The file lt-hist holds is a printing of about 1955-56 of the 1945 edition, not a 1937 printing. The verdict is unaffected; the citation is not."
default_taken = "none -- the question was answered, not defaulted"

