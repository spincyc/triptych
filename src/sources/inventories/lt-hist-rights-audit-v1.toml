load-bearing: it is why every prayer this repository has published off these
bytes is still publishable, and why the 1962 facsimile rights record's holding
survives. It is not a permission to redistribute the added matter. A basis that
STATED the distinction would be right about the passages and would still be
false about the file, because the file is the thing `tracked` speaks about.
