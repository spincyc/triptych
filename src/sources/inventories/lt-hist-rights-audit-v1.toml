premise:

  "Post-1962 OCR imports are included under the project assumption that the
  underlying official liturgical texts are public domain."
  -- /home/ksh/git/lt-hist/STATUS.md:3 [verified]

The same premise, differently worded, at POST_1962_SOURCES.md:3 and in
sources/manifest.json:2 `scope_note` [verified]. Nothing anywhere in the corpus
supports it. No statute, no case, no treaty, no Copyright Office record, no
policy of any conference or of the Holy See is cited for it in any of the
fourteen files that restate it. It is asserted and then relied on.
"""
