# --- The two structural conditions --------------------------------------------

[[structural_conditions]]
id = "settle-the-holy-see-question-once"
anchor = "guidance/sources.md:402-413"
rule = """
"Settle a recurring rights question once, in a rights record. Where the same
question governs a whole body of material and keeps being reopened, the answer
belongs in one file under `src/sources/inventories/`, with its citations, the
routes examined and refused, and what would change if the position changed. A
rights position stated only in prose, in three places, in three wordings, is
three positions." `liturgical-english-rights-v1.toml` is the named precedent.
"""
the_question = """
MAY THIS PROJECT PUBLISH THE LATIN OF A POSTCONCILIAR LITURGICAL BOOK OF THE
HOLY SEE? One question, and it governs six of the fourteen excluded rows:
1969 Ordo lectionum Missae, 1970 Missale Romanum, 1975 editio typica altera,
1981 OLM altera, 1988 Ordo cantus Missae, 2002 editio typica tertia. It very
likely governs a seventh at a different date -- the 1955 AAS row -- and the
answer there should be taken from the settled record rather than derived
separately.
"""
requirement = """
It must be settled in ONE record, not as six prose notes in six version rows and
not as a sentence repeated in six artifact manifests. The material for it
already exists and is currently scattered across at least four places:

  liturgical-english-rights-v1.toml `[the_latin]` -- Liturgiam authenticam
    n. 111 and n. 110, Berne accession of the Holy See 12 September 1935,
    derivative-work analysis.
  guidance/missals.md -- the 2002 copyright leaf naming APSA with LEV as sales
    agent; the Secretariat of State decree of 31 May 2005 vesting in LEV, and
    the unreconciled tension between them; Vatican Law N. CXCVII (2017) art. 2
    and the seventy-year term at art. 5; URAA restoration under 17 U.S.C. 104A;
    the correction that 1935 and not 1929 is the US watershed.
  missal-acquisition-audit-v1.toml -- `rights = "holy-see-post-1929"` on seven
    book rows, a label whose own year missals.md has since corrected.
  this file -- six rows pointing at the question.

Note the defect visible in that list: the acquisition audit's rights label still
says 1929 while missals.md has established that the date is 1935 and that the
1929 boundary is unrecorded. That is what a scattered position costs -- a stale
label survives in a machine-readable field because the correction landed in
prose somewhere else.
"""
why_it_is_stated_here = """
Because this file must not become the seventh place. Six version rows above each
say "governed by `settle-the-holy-see-question-once`" and none of them argues the
question. That is deliberate: a pointer to an unwritten record is an honest debt,
and six restatements of a position would be six positions.

lt-hist's failure mode was exactly this and at scale: one position, restated 56
times in 15 wordings across 14 files, argued zero times. The count is in
`[the_assumption]`. Do not reproduce it in the other direction -- a correct
conclusion repeated 56 times without a reason is the same artifact as a wrong
one.
"""
blocking = false
blocking_note = "This audit's verdicts do not wait on it. All six rows are `excluded` either way; the settled record would supply the REASON in one citable place and would additionally dispose of the 1955 row."

[[structural_conditions]]
id = "text-status-may-not-travel"
rule = "lt-hist's `text_status` vocabulary must not cross into this repository, for any version, including the six admissible ones."
the_facts = """
134 of the 140 section files carry a `text_status` beginning `public-domain-`
[verified]. The full census:

  68  public-domain-ocr-latin
  26  public-domain-ocr-english
  18  public-domain-promulgation-ocr-latin
  11  public-domain-promulgation-ocr-english
   8  public-domain-ocr
   3  restricted-source-not-included
   2  public-domain-aas-ocr-latin
   2  metadata-only
   1  public-domain-ocr-latin-partial
   1  copyrighted-source-located-not-included

CORRECTING THE BRIEF, which said all 140. Six do not: the three
`restricted-source-not-included` (1974, 1985, 1994), the one
`copyrighted-source-located-not-included` (2008), and the two `metadata-only`
(1963, 1969 constitution).

The substantive claim survives the correction intact and is if anything sharper.
ALL TEN of the excluded-with-bytes versions carry `public-domain-*`, verified
version by version [verified]: 1969 OLM, 1970 GIRM English, 1970 Missale
Romanum, 1972 NLC, 1975, 1981, 1988, 1998 ICEL, 2002, 2011. The six that do not
are exactly the six with no bytes to mislabel. The vocabulary is wrong wherever
it had the opportunity to be wrong.
"""
the_danger = """
`text_status` sits in YAML front matter at the top of every section file. Copying
a section file copies the front matter, and copying the front matter copies a
false rights claim into this repository's own tracked text -- where it would then
be read by tooling, indexed, and inherited by anything built on it. The 2011
Roman Missal's section files say `public-domain-ocr-english`. That single string,
moved once, asserts on this project's behalf that the current approved English of
the Roman Missal is in the public domain.
"""
and_for_the_admissible_six = """
The field must be RE-DERIVED, not transcribed, even where the conclusion will
match. Two reasons, and the second is the one that binds.

First, the strings are wrong on their own terms: `public-domain-ocr` is one token
doing three jobs -- a rights conclusion, a jurisdiction that is never stated, and
a note about how the bytes were made. This repository separates all three, and
`sources.md:395-400` requires the basis to be recorded, which this vocabulary has
no slot for.

Second and decisively: transcribing the field would import the CONCLUSION while
leaving the REASONING behind, and the reasoning is the whole difference between
the six rows that may come and the ten that may not. lt-hist wrote
`public-domain-ocr-latin` on the 1570 Missale Romanum and `public-domain-ocr-latin`
on the 2002 editio typica tertia. The strings are identical. Only the reason
differs, and only one of the two reasons exists.
"""
required_action = """
Any fold-in extracts the OCR TEXT ONLY, discards lt-hist's front matter entirely,
and writes a fresh source manifest whose rights fields are derived from this
record's `verdict_basis` for that version. Do not copy a section file. Do not
copy `versions/*/metadata.json`. Do not copy `sources/manifest.json`.
"""

