post-1920 matter sits in five different parts of it at once: eight interleaved
day-entries in the kalendarium table, a Praefatio indexed in three places,
occurrence and transfer rubrics in the general rubrics, nine formularies through
the temporal and sanctoral, and the appendix Mass. AND TWO OF THE NINE ARE
REPLACEMENTS RATHER THAN ADDITIONS, which is what makes the route impossible
rather than merely laborious. The 1950 Assumption displaced the older Mass, so
deleting it leaves 15 August with no Mass at all rather than with its 1920 one.
