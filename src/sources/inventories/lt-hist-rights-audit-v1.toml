# Whether the lt-hist corpus may be folded in, decided version by version.
#
# A RIGHTS AUDIT, not an acquisition and not a migration. Nothing from
# `~/git/lt-hist` was copied into this repository to write this file, and
# nothing below authorizes copying anything. Every row is an identification, a
# rights position and a verdict, so that a later lane can move six texts
# deliberately instead of moving twenty-five by default.
#
# It exists because the audit itself is the deliverable. The question "may
# lt-hist be folded in?" had an answer that lived only in a conversation, and an
# answer with no record is an answer that gets re-derived -- which is precisely
# the failure the corpus being audited exhibits. See `[[structural_conditions]]`
# `settle-the-holy-see-question-once`.
#
# It sits in inventories/ for the reason its siblings
# `missal-acquisition-audit-v1.toml` and `pre-1955-rubrics-sources-v1.toml`
# give: `source-library validate` rejects any file under src/sources outside its
# own schema except .md and .toml under inventories/, and none of this is ready
# to be a work in the library. Nothing here is a source manifest, an evidence
# state, or a binding target.
#
# It is not legal advice and it binds nobody outside this repository. Where it
# states a proposition of law it states the jurisdiction, and the jurisdiction
# throughout is the United States.

audit_schema = 1
record_type = "external-corpus-rights-audit"
slice = "lt-hist"
corpus_path = "/home/ksh/git/lt-hist"
recorded_on = "2026-08-01"
jurisdiction = "United States"

holding = """
Seven of the twenty-five versions in lt-hist may be folded in. Fourteen may not,
and their bytes must not enter Git under any disposition. Four need the
maintainer and are recorded as open questions rather than resolved by default.

AS FIRST WRITTEN THIS SAID SIX AND FIVE. The seventh is the 1937 Lasance, whose
open question `lasance-renewal` was closed on 2026-08-01 by
`src/sources/inventories/lasance-new-roman-missal-rights-v1.toml`: neither
registered edition was renewed, so the text is public domain in the United
States by failure to renew. It is admissible on THAT ground, not on age and not
on lt-hist's. One exclusion travels with it -- the appendix at pages 1298a-1298n
-- and the artifact is a printing of about 1955-56, not of 1937. See its row.

The six that may come on age are admissible because they were published before
1931, and on that ground alone. They are NOT admissible on the ground lt-hist gives
for them, which is that the Internet Archive marks the scan public domain. That
ground is insufficient here by rule -- guidance/sources.md is explicit that
online availability and successful download are not a distribution basis -- and
it is the same ground lt-hist used to import the 2011 Roman Missal.

The fourteen that may not come have a named claimant, no permission, and no
expiry. Ten of them are sitting in lt-hist as downloaded OCR right now, and four
of those ten carry the claimant's own copyright notice inside the very bytes
lt-hist downloaded. See `[[notices]]`.
"""

