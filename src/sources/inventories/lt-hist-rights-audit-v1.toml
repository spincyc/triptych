# Whether the lt-hist corpus may be folded in, decided version by version.
#
# A RIGHTS AUDIT, not an acquisition and not a migration. Nothing from
# `~/git/lt-hist` was copied into this repository to write this file, and
# nothing below authorizes copying anything. Every row is an identification, a
# rights position and a verdict, so that a later lane can move six texts
# deliberately instead of moving twenty-five by default.
#
# It exists because the audit itself is the deliverable. The question "may
# lt-hist be folded in?" had an answer that lived only in a conversation, and an
# answer with no record is an answer that gets re-derived -- which is precisely
# the failure the corpus being audited exhibits. See `[[structural_conditions]]`
# `settle-the-holy-see-question-once`.
#
# It sits in inventories/ for the reason its siblings
# `missal-acquisition-audit-v1.toml` and `pre-1955-rubrics-sources-v1.toml`
# give: `source-library validate` rejects any file under src/sources outside its
# own schema except .md and .toml under inventories/, and none of this is ready
# to be a work in the library. Nothing here is a source manifest, an evidence
# state, or a binding target.
#
# It is not legal advice and it binds nobody outside this repository. Where it
# states a proposition of law it states the jurisdiction, and the jurisdiction
# throughout is the United States.

audit_schema = 1
record_type = "external-corpus-rights-audit"
slice = "lt-hist"
corpus_path = "/home/ksh/git/lt-hist"
recorded_on = "2026-08-01"
jurisdiction = "United States"

holding = """
Six of the twenty-five versions in lt-hist may be folded in. One was folded in
and then withdrawn. Fourteen may not, and their bytes must not enter Git under
any disposition. Four need the maintainer and are recorded as open questions
rather than resolved by default.

THE WITHDRAWN ONE IS THE 1920, AND IT IS THE SHARPEST THING IN THIS FILE. It was
folded in on 2026-08-01 as `tracked` and `public-domain` on the ground of
publication before the pre-1931 line, "and on that ground alone", and the ground
was withdrawn on 2026-08-02 by the lane that had laid it: the scanned book is not
a 1920 printing. It carries nine feasts instituted between 1925 and 1955 as full
formularies with their ranks, and its appendix carries a Mass of St Pius X whose
rubric grants the Fraternitas sacerdotalis S. Pii X -- a body erected on
1 November 1970 -- a rank and a privileged octave, so the printing is 1970 or
later. THIS AUDIT REJECTED lt-hist's BASIS FOR THAT ROW AND INHERITED ITS FACT,
which is the failure worth taking from this file: refusing a bad ground is not
the same act as checking the assertion it was offered for. The text of the 1920
typical edition is public domain and nothing here disturbs it; the bytes are not
that edition alone. See the row and `[[corrections]]`
`the-1920-printing-is-post-1970`.

AS FIRST WRITTEN THE ADMISSIBLE COUNT SAID SIX AND FIVE, AND IT IS SIX AGAIN BY A
DIFFERENT ROUTE. The seventh was the 1937 Lasance, whose
open question `lasance-renewal` was closed on 2026-08-01 by
`src/sources/inventories/lasance-new-roman-missal-rights-v1.toml`: neither
registered edition was renewed, so the text is public domain in the United
States by failure to renew. It is admissible on THAT ground, not on age and not
on lt-hist's. Two page-bounded exclusions travel with it -- the appendix at pages
1298a-1298n and the unestablished insert at pages 1302a-1302d -- and the artifact
is a printing of about 1955-56, not of 1937. See its row.

The six that may come on age are admissible because they were published before
1931, and on that ground alone. They are NOT admissible on the ground lt-hist gives
for them, which is that the Internet Archive marks the scan public domain. That
ground is insufficient here by rule -- guidance/sources.md is explicit that
online availability and successful download are not a distribution basis -- and
it is the same ground lt-hist used to import the 2011 Roman Missal.

The fourteen that may not come have a named claimant, no permission, and no
expiry. Ten of them are sitting in lt-hist as downloaded OCR right now, and four
of those ten carry the claimant's own copyright notice inside the very bytes
lt-hist downloaded. See `[[notices]]`.

ALL SEVEN WERE FOLDED IN AND SIX REMAIN FOLDED IN. What follows
records how, in the order it happened. The Lasance went first and alone on
2026-08-01, to establish the pattern: a fresh acquisition through the source
library, a rights basis rewritten from the renewal record, the two excluded
lettered inserts removed from the tracked bytes rather than disclaimed beside
them, the text
landed as a plain OCR artifact and not as structured liturgical records, and
nothing whatever inherited from the corpus -- which was not even the route the
bytes came by.

The 1570, the 1806 and the 1920 followed the same day, on the SAME pattern and
on a DIFFERENT ground: all three rest on publication before the pre-1931 line,
derived for calendar year 2026 and recorded as derived for it, because that line
moves every January. All three were fetched again from the Internet Archive here
and hashed BYTE-IDENTICAL to the corpus copies, so three more retrievals were
controlled and no byte has yet crossed out of lt-hist. See their
`folded_in_note`s and `[counts]`. THE 1920 DID NOT SURVIVE THE NEXT DAY, and the
sentence above is exactly the sentence that failed: "publication before the
pre-1931 line" is a proposition about a date, and the fold-in never established
that the date belonged to these bytes. THE OTHER TWO WERE SPOT-CHECKED FOR THE
SAME FAILURE ON 2026-08-02 AND NEITHER SHOWS IT [verified]. The 1570 payload
returns zero for every post-Tridentine canonization tried -- Teresa of Avila,
Charles Borromeo, Francis Xavier, Philip Neri, Ignatius Loyola, Pius V -- and
zero for the Rosary and the Immaculate Conception; the 180 raw hits for "Neri"
are `venerit`, `digneris`, `muneribus` and their kind, which is the same
substring trap this file warns about elsewhere. The 1806 payload returns zero for
Christ the King, Lisieux, Bosco, the Immaculate Conception, the Immaculate Heart,
Lourdes, Bernadette, Pius IX and Pius X. These are spot-checks against named
later matter, not a page-by-page reading, and they are recorded as what they are:
enough to say the 1920's defect was not found in the other two, not enough to say
those two were audited the way the 1920 has now been.

THE LAST THREE FOLLOWED ON THE SAME DAY, and they were the three this file knew
were awkward: the 1604, the 1862 and the 1843 are all Google digitisations, and
the 1843 was already registered here as an edition of the Cummiskey work, so
folding it meant adding an artifact to an existing edition rather than making a
new one. All three were also fetched again here and hashed BYTE-IDENTICAL to the
corpus copies, so seven retrievals out of seven were controlled and NO BYTE HAS
EVER CROSSED OUT OF lt-hist.

THE GOOGLE QUESTION WAS DECIDED BY READING THE FILES, AND THE PREMISE OF IT WAS
FALSE. Two routes had been prescribed for those bytes -- a derivative with the
Google matter removed by one stated transformation, or `remote` and `unresolved`
holding nothing -- and neither was taken, because none of the three files contains
Google's front-matter statement or its usage guidelines at all. What they contain
is the four-word page-foot stamp. The searches, the counts, the contrast with the
one artifact in this library that DOES carry the block, and the reason each route
was refused are at `[[corrections]]`
`the-google-scans-carry-a-stamp-and-not-the-boilerplate`. Two edits this lane
could not make itself are at `[[open_items]]`.

The 1862 additionally had to be registered as a PRINTING and not a typical
edition, which its own approbation, its publisher's note to the reader and its
appendix establish out of the book's own words; see its row. Two
`[[corrections]]` from the Lasance lane, three from the 1570/1806/1920 lane and
one from this one record what the awkward rows cost.
"""

