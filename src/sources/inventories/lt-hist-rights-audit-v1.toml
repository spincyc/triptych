from the Internet Archive and authenticated by the sha256 already recorded; what
is gone is the repository's distribution of it and the claim that it was lawful.

ROUTE (a) WAS EXAMINED AND IS NOT AVAILABLE. The Lasance pattern -- two stated
replayable deletions, `sed -e '140854,141805d' -e '142275,142800d' SOURCE > OUT`
