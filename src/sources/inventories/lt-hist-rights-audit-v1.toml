who survive here only as the commemoration attached to it at kalendarium
7421-7422, and its rubric at 87803-87804 suppresses what would otherwise be said
of the Assumption octave that day -- so deleting it leaves a commemoration with
no feast to hang on. A deletion cannot put back a text that was displaced; it can
only take away the thing that displaced it. AND NO LIST COULD BE PROVED
COMPLETE, because there is no 1920 typical edition in this repository to diff
against -- the tracked 1570 and 1604 witness the ancient stratum, not what Divino
afflatu changed in 1920. That is a hand-picked deletion list with no control,
