# --- The rule this audit is applying -----------------------------------------

[the_governing_rule]
anchor = "guidance/sources.md:395-400"
text = """
Record rights per artifact, not merely per abstract work. Distinguish the
underlying public-domain text from a host's markup, annotations, typography,
database, or newly created transcription. Record the known public-domain
jurisdiction and basis, license, permission, legal exception, restriction, or
unresolved status. `tracked` requires an affirmative recorded distribution
basis; online availability and successful download are insufficient.
"""
why_it_decides_this = """
The last sentence decides nineteen of the twenty-five rows on its own. lt-hist's
rights basis for every postconciliar import is availability plus a successful
download, restated as an assumption. That is the exact pair the rule names as
insufficient, and it is insufficient whether or not the download succeeded,
whether or not the Internet Archive item is open, and whether or not the text is
an official act of the Church.

The first sentence decides the shape of this file. Rights are recorded PER
ARTIFACT, so a single verdict over "lt-hist" would be wrong in both directions:
it would either import the 2011 Roman Missal or refuse the 1570 Missale
Romanum. Twenty-five rows is the minimum honest granularity.
"""

[the_disposition_vocabulary]
anchor = "guidance/sources.md:375-386"
tracked = "the exact artifact is lawful to distribute from the repository, reasonably sized, and materially improves reproducibility or reuse"
remote = "the exact artifact is not retained because of demonstrated size, duplication, or a stable authoritative/public delivery route, but its retrieval location, acquired hash when known, and rights status are recorded"
restricted = "lawful project access does not include repository redistribution; tracked metadata may identify the artifact, but its bytes must not enter Git, build products, tests, fixtures, or public artifacts"
unavailable = "the record identifies an expected or previously consulted object whose exact bytes cannot presently be obtained or authenticated"
how_used_here = """
`verdict = "admissible"` is a proposal that the artifact could be `tracked` once
acquired properly through the source library, with a rights basis recorded on
its own manifest. It is not itself that basis and it does not create one.

`verdict = "excluded"` means `restricted` at best: metadata may be recorded, and
the bytes may not enter Git, build products, tests, fixtures, or public
artifacts. Several of these are additionally `remote` candidates -- an Internet
Archive identifier is a stable retrieval route -- and nothing here objects to
recording the route. The objection is to the bytes.

`verdict = "undecided"` maps to nothing in the vocabulary on purpose. It is not
`unavailable`: the bytes are obtainable and in several cases already obtained.
It is a question addressed to the maintainer, and writing it as a disposition
would be answering it.
"""

