basis = "The index does not enumerate every numbered formulary beneath its headings. A body walk of printed pp. 891-969, with each form, oration alternative, seasonal condition and cross-reference resolved, is required. The Mary Ordinary Time heading demonstrably begins with numbered formulary 1 at artifact p. 540; treating these 33 headings as 33 complete formularies would undercount."

