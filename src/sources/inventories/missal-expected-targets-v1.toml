basis = "Unlisted edition dispositions are not evaluated, not absent. US All Souls reading pools, conditional Scrutinies, weekday fallback compositions and territorial replacements are outside this baseline slice; neither the 205 nor 211 registry alternatives establishes a US-edition denominator."

