basis = "Solemn blessing and prayer-over-the-people entries identify alternative classes, not every numbered prayer. Internal role turns, Roman Canon seasonal inserts, memorial acclamations, optional intercessions and supplementary Eucharistic Prayers still need source-defined atomic target reconciliation."

[[boundaries]]
id = "postconciliar-common-numbered-formularies"
slice_id = "postconciliar-common-index-headings"
kind = "common"
