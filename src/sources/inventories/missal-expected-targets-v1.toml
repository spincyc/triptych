basis = "The registered passage explicitly excludes Prefaces printed with proper formularies. The book index also names ritual, dedication, Chrism and supplementary Eucharistic Prayer Prefaces; these require a separate identity reconciliation, including repeated Prefaces, before a whole-book denominator is possible."

[[boundaries]]
