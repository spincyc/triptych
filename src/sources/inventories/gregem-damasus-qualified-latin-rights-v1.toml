decision = "Adopt the qualified per-text assessment for these two exact forms. The continuous older whole petition supplies the arrangement; the bounded rank/name/agreement and conventional conclusion redaction is assessed together as routine rather than a new developed petition. The theological-redaction originality objection remains disclosed and limits confidence. This is not literal whole-prayer identity or an unqualified public-domain claim. Damasus is assessed independently under the same rationale, never used as authority for Common."
whole_arrangement_assessment = "The old single prayer supplies the continuous governing sequence: look upon the flock and keep it under perpetual protection through the appointed shepherds. The exact later edit retains that sequence. The change in addressee epithet, singular name/office/martyr slot, necessary relative and predicate agreement, removal of Filii tui vicarios, and conventional conclusion completion form a limited adaptation of that one template. Taken together, these do not add a new narrative, juxtaposition of separate source prayers, or independently developed petition. This supports the qualified view that the new contribution remains routine and below sufficient original authorship."
strongest_contrary_argument = "Replacing apostles/vicars of the Son with a SupremePontiff and omitting the vicar clause is a theological redaction, not wholly mechanical grammar. The aggregate could be treated as minimally creative expressive adaptation. The cited authorities do not decide this prayer, so publication is proposed under policy priority6 rather than asserted as an unqualified historical whole-prayer public-domain identity."
source_fact = "Feltoe1896 printed42 physical66 corrected by same-edition erratum physical24; this is a critical printed witness, not an exact manuscript reproduction. AAS1942 and1962 supply exact later target attestation and are separately disclosed."
source_comparison = "Feltoe 1896 printed p.42 lines8-10 has Pater; the same-edition erratum at PDF24 directs Pastor. Corrected whole foundation is23words, Common26words, Damasus23words; neither is complete-word identity. No age or first-composition date is inferred from a partial match or printing date."
source_use = "AAS34(1942) issue4 printed107/PDF23 supplies the later Common, with ellipsis after N. and comma after Pontificem. The 1962 typica printed[1] no.4176/PDF809 controls received Common pointing. Damasus is directly witnessed by 1962 printed439 no.1887/PDF520 and Lasance printed855/IA n853. Neither modern facsimile nor its typography/apparatus is redistributed."
routes_examined_and_refused = ["Priority1/3: the old whole foundation is public domain but not the complete later word sequence; its age does not itself clear every later addition.", "Priorities2/4/5: no body-specific holder permission, general grant or authorized syndication is established on this bounded record.", "Priority6: adopt the bounded whole-arrangement nonoriginality assessment, with moderate confidence and its contrary theological-redaction argument.", "No inference from project carrier ownership, Lasance English renewal, similarity percentage, religious purpose or shortness alone.", "No blanket AAS/1962 public-domain claim or unperformed foreign-term/renewal investigation."]
overturning_evidence = ["A specific enforceable reservation or holder evidence concerning the exact new contribution.", "A better per-text originality analysis establishing sufficient creative expressive redaction in the actual full arrangement.", "A material source mismatch or proof failing to bind the exact received target."]
excluded = ["AlbertCollect", "AlbertSecret", "AlbertPostcommunion", "all other Common prayers or recipient fanout", "English translations", "wholeAAS/1962/Lasance PDFs", "modern page images/typography/editorial apparatus", "source acquisition or availability inferred from this rights decision"]
surfaces = ["web", "corpus-data", "public-git", "download", "print", "cli"]
prior_Damasus_rationale = "Supersedes only the current Damasus publication rationale that combined project projection ownership and Lasance renewal. Those facts do not independently clear the later Latin contribution. Its Latin bytes, English, historical source metadata and old audit remain unchanged."
prior_Common_absence = "The old Pustet/Mame/1604/1570 finding stays as historical bounded evidence. The newly received AAS target and older whole foundation supersede a global missing-source inference for this one Collect only."

