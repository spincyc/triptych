provenance_evidence = "Complete old foundation, secondary comparison, exact candidate Latin and English, and separate conclusion independently reviewed in workflows/reviews/missal-reader-resume-2026-11-12/postconciliar-ot8-ot12/independent-merits-review.json SHA d46d3d4b792606f359f827b50a3a5f3c976a3a1ca1ae81f60f97319c42f6692c. Collation is of the declared study assembly only."
