transformations = ["Hostias => Munera nostra: Replaces sacrificial offerings by conventional gifts wording and explicitly states the speakers as offerers.", "oblatas => : Removes the redundant offered modifier.", "quas => quae: Required feminine-to-neuter gender agreement; accusative plural retained across the result-clause recast.", "efficias salutares => salutaria fore concede: Recasts the existing requested salvific result as granting the gifts to be salutary; no independent benefit or new clause coordination.", "Do not expand actual old cue; append independently sourced complete short conclusion and marked response."]
