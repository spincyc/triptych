"verification_locator" = "Secondary digital whole prayer and source-local IGMR 54; authenticated 2008 unresolved"
"transformations" = ["{\"full_old_petition\": \"Propitiare, Dne, famulis tuis, et clementer gratiae tuae super nos dona multiplica: ut fidei, speique et charitatis amore ferventes, semper in mandatis tuis vigili custodia perseverent.\", \"exact_ordered_replacements\": [{\"old\": \"Dne,\", \"new\": \"Domine,\", \"class\": \"abbreviation expansion\"}, {\"old\": \"super nos\", \"new\": \"super eos\", \"class\": \"third-person reference regularization to famulis\"}, {\"old\": \"fidei, speique et charitatis amore\", \"new\": \"spe, fide et caritate\", \"class\": \"same conventional theological-virtue triad; genitive-with-amore simplified to ablatives; first two reordered; h removed in received spelling\"}], \"pointing\": \"Source pointing retained; no allegation of exact modern punctuation\", \"old_cue_excluded_only_in_assembly\": \"Per.\", \"modern_cue_inspected\": \"Per Dominum.\", \"selected_latin_petition\": \"Propitiare, Domine, famulis tuis, et clementer gratiae tuae super eos dona multiplica: ut spe, fide et caritate ferventes, semper in mandatis tuis vigili custodia perseverent.\", \"selected_latin_petition_sha256\": \"22bfebb5f40899507638af8a6c51f87aea6629abd0139ced4a6c1230ebb930ff\"}"]
"provenance_evidence" = "Exact body and recipient decision independently reviewed; source library binds the complete historical foundation and distinct formula and response."
