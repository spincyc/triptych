transformations = ["cuius te voluisti dignanter immolatione placari => placationis et laudis: Replaces the gracious divine acceptance/appeasement relative clause with a conventional purpose description, adding praise.", "praesta, quaesumus => et praesta: Adds a coordinating conjunction and removes the conventional request marker.", "Do not expand actual old cue; append independently sourced complete short conclusion and marked response."]
provenance_evidence = "Exact transcription of the declared finite adaptation carrier, with a separate old source and individually recorded transformations. This is neither exact transcription of the old petition nor exact-to-authenticated-modern-target."
