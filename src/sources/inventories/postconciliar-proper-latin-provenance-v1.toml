"publication_source_ids" = ["artifact.triptych.ordinarytime-remaining-five-latin-study-reconstruction-20261113.2026-11-13.ot-20-postcommunion", "artifact.diocese-of-paris.missale-parisiense.1738-paris-bibliopolae.google-page-lxv-1f5fed6c", "artifact.catholic-church.missale-romanum.vatican-typica-tertia-2002.secondary-digital-pdf-0b458944", "artifact.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.internet-archive-pdf-006a38a3", "artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.english-completion-20261029-postconciliar-opening2-lasance-conclusion217-d85c36fb"]
"publication_locator" = "Complete historical prayer; separate full formula and marked response; exact whole-expression assessment"
"publication_evidence" = "CONDITIONAL POSTIMAGE ONLY. Separate exact owner/body/proof/surface admission remains required. The one1738 whole text already makes sacramental participation in Christ the basis for humble appeal, likeness to his image on earth and participation in heaven. Removal of the variable saint accompaniment makes the same prayer general; the ordinary case alternative leaves the image relation; eius replaces glory with the Christ referent expressly present in the opening and image clause. The altered object is real, but the new expression is conventional pronominal reference within an entirely inherited earth/heaven parallel, not a newly composed parallel or a fresh coordination of unrelated source phrases. Assessed jointly with the standard ending, the modifications remain minor written variation of that whole. Strongest contrary and resolution: The new version closes more tightly on Christ, instead of pairing his image with glory and named-saint companionship. This can be a deliberate theological and stylistic concentration, not merely a variable deletion. But the specific new contribution does not originate the Christ-participation idea, earthly/heavenly relation, or sentence structure: each is already in the complete old text, and the substitution is an ordinary referential compression. That finite combination does not supply sufficient new expressive authorship here. The affirmative does not license a general method of deleting saint clauses or changing objects in other prayers."
