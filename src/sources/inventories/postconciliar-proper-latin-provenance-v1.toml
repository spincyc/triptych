"publication_evidence" = "CONDITIONAL POSTIMAGE ONLY. Separate exact owner/body/proof/surface admission remains required. One1904 printed whole sentence supplies the invocation, adoption in grace, children-of-light premise, request to avoid the darkness of errors, and affirmative remaining-in-truth contrast, in the same order and language. The candidate retains that entire old petition; it does not construct a new prayer from old fragments. Its different punctuation and separately witnessed conventional long ending add no fresh substantive petition expression. The complete exact-old-petition route therefore supports a qualified affirmative for this disclosed assembly. Strongest contrary and resolution: The modern editors selected an Ambrosian processional prayer for a Roman Sunday, supplied a Roman cue, and may hold rights in a wider selection or edition. This review does not license that compilation or establish the Roman role from the Ambrosian book. It assesses this one complete preexisting text and separately sourced formula. The same-artifact modern heading and IGMR54 establish only the source-qualified study application. No new expressive petition arrangement has been taken from the modern edition."
