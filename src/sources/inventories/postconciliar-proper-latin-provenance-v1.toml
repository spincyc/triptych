"publication_evidence" = "CONDITIONAL POSTIMAGE: separate Root finite Latin admission required. The decisive comparison is with Wilson as a complete prayer, rather than with Feltoe alone. Wilson already petitions acceptance of an offering so that the worshippers may attain in devout affection what they celebrate in the Passion mystery. The alternate independently old acceptance formula leaves that complete expressive relation intact. Filii tui makes the already identified Passion referent explicit; pio affectu and its placement are conventional grammatical recasting. On that bounded basis I recommend qualified admission, despite the author holding this borderline case. Strongest contrary: Selecting Feltoe's sacrifices-and-favorable-regard opening instead of Wilson's acceptance-and-operation opening is a discretionary compositional choice; the combined expression need not be protected only when it adds a new doctrine. Nevertheless this particular join exchanges conventional acceptance scaffolding around the preexisting whole distinctive petition, rather than composing a new relation between unrelated literary images. This narrow rationale does not clear centonization generally."
