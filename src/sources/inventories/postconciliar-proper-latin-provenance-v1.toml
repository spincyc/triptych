publication_source_ids = ["artifact.triptych.postconciliar-ot8-ot12-historical-latin-study-assembly.2026-11-12.ot-12-postcommunion", "artifact.catholic-church.sacramentarium-veronense.feltoe-1896.internet-archive-pdf-3b991b13", "artifact.catholic-church.sacramentarium-veronense.feltoe-1896.ot-12-postcommunion-reviewed-whole-20261112", "artifact.catholic-church.missale-romanum.vatican-typica-tertia-2002.secondary-digital-pdf-0b458944", "artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.english-completion-20261029-postconciliar-opening2-lasance-conclusion217-d85c36fb"]
publication_locator = "Exact per-owner old prayer and full formula in accepted candidate; complete whole-expression merits and adverse case in independent receipt"
publication_evidence = "CONDITIONAL POSTIMAGE ONLY: Root finite Latin decision is required. Individualized old whole expression plus conventional revisions; no permission inferred from English acceptance. The complete old prayer supplies the reception-and-renewal opening, appeal to divine clemency and antithesis between recurring ritual celebration and secured redemption. Alimonia changes the instrumental noun from sacramental draught/offering to nourishment; that lexical and semantic distinction is acknowledged, not normalized away. In this particular sentence, however, it remains an ordinary sacramental-food designation governed by the same Body-and-Blood genitives and modifying the same renovati. Moving the participle after that instrument and rearranging gerimus/devotione frequenti preserves the old linked construction. Assessed as a whole, these revisions do not develop the food term into a new comparison, add an image to the redemption petition, or recast the inherited coordination. I find the changes conventional and minor in expression, despite their real semantic nuance. The affirmative basis is the complete old composition plus that individualized judgment, not a rule that single-noun changes are always free. Strongest contrary: Alimonia can deliberately foreground nourishment where libamen foregrounds a draught or offering, and in a brief prayer even one word can make an original expressive change. The rearranged opening could therefore be alleged to be a newly fashioned presentation of eucharistic renewal. This is the strongest of the three adverse cases. It does not prevail here because the new noun functions as a routine direct label within the unchanged old instrumental phrase; the rest of the expressive coordination, including the devotion/redemption contrast, is inherited complete. The record supports a qualified affirmative under the repository presumption, not certainty that a court would decide the same way."
notice = "Source-based Latin study reconstruction of a complete historical prayer with individually reviewed conventional changes, followed by a separately witnessed short conclusion and distinct response. The comparison and conclusion rule belong to a secondary digital2002 witness. Authenticated printed2002 and complete2008 correspondence remain unestablished; this is not an approved liturgical text or recitation authorization."
note = "Source-based Latin study reconstruction of a complete historical prayer with individually reviewed conventional changes, followed by a separately witnessed short conclusion and distinct response. The comparison and conclusion rule belong to a secondary digital2002 witness. Authenticated printed2002 and complete2008 correspondence remain unestablished; this is not an approved liturgical text or recitation authorization."

