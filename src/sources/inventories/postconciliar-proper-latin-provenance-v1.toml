publication_source_ids = ["artifact.triptych.ordinarytime-offerings-historical-adaptations.2026-11-12.ot-12-complete-la", "artifact.catholic-church.sacramentarium-gelasianum-vetus.wilson-1894.ordinarytime-ot-12-whole-text-20261112", "artifact.francis-xavier-lasance.the-new-roman-missal.benziger-revised-1945.english-completion-20261029-postconciliar-opening2-lasance-conclusion217-d85c36fb"]
publication_locator = "One complete old-text transcription and separately witnessed complete short conclusion; original PDFs retained only as separately qualified verification evidence"
