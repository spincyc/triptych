publication_evidence = "The complete one-source prayer already gives the expressive order: receive the sacrifice by which God is appeased; purify those offering it through its operation; accept their inward devotion. All of the final, distinctive petition is retained. The shorter opening uses the independently old formula placationis et laudis to describe the same sacrifice, then ordinary coordination joins the existing second petition. It does not import a new developed petition or reorder the old prayer. This supports a narrow qualified nonoriginality inference for the aggregate, not a rule that every phrase-sized replacement is free. Strongest contrary: Praise is newly explicit, divine willingness is removed, and the reform chooses a shorter classification of the sacrifice from elsewhere. Even a conventional phrase can be selected and coordinated creatively. The complete resulting prayer was not found verbatim in an older book."
note = "Source-based Latin study reconstruction with individually reviewed conventional changes to a complete historical prayer, joined to a separately sourced complete conclusion and marked response. Comparison is limited to a secondary digital 2002 witness; authenticated printed 2002 fidelity and correspondence with the 2008 Missal remain unestablished. This is not an official Missal text and supplies no authority for liturgical use."

