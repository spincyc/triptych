publication_evidence = "One complete old prayer already connects creatures made to support human frailty with their becoming a sacrament of eternity. The shortened expression retains that distinctive creation-to-eternity relationship and its order. It removes the intermediate dedication statement and an explicit repetition of present help, then makes the minimum case and verb changes needed to connect the surviving clauses. It neither imports a separate donor prayer nor invents a new proposition. The finite proposal is a qualification for this exact single-source condensation, not a general claim that deletion is nonoriginal. Strongest contrary: This is not deletion-only: two substantive clauses are removed and the sentence is grammatically reworked. The modern version chooses which theology to retain, suppresses an express dedication command and one benefit, and sharpens the earthly-to-eternal contrast. An abridgment can carry protected authorship under Compendium709.3, and the omission example there concerns a mere beginning/end cut rather than this internal condensation."
