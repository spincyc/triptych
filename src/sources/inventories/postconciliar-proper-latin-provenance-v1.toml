"transformations" = ["{\"full_old_petition\": \"Adesto, Domine, famulis tuis, et perpetuam benignitatem largire poscentibus: ut iis, qui te auctore et gubernatore gloriantur, et congregata restaures, et restaurata conserves.\", \"exact_ordered_replacements\": [{\"old\": \"ut iis,\", \"new\": \"ut his,\", \"class\": \"conventional demonstrative-pronoun variation\"}, {\"old\": \"te auctore et gubernatore gloriantur\", \"new\": \"te auctorem et gubernatorem gloriantur habere\", \"class\": \"same author/ruler proposition expanded with infinitive and regular accusative objects\"}, {\"old\": \"congregata restaures\", \"new\": \"creata restaures\", \"class\": \"common-participle substitution; actual semantic difference explicitly assessed, not called spelling\"}], \"pointing\": \"Source punctuation retained; no exact modern pointing claim\", \"old_cue_excluded_only_in_assembly\": \"Per Dominum.\", \"modern_cue_inspected\": \"Per Dominum.\", \"selected_latin_petition\": \"Adesto, Domine, famulis tuis, et perpetuam benignitatem largire poscentibus: ut his, qui te auctorem et gubernatorem gloriantur habere, et creata restaures, et restaurata conserves.\", \"selected_latin_petition_sha256\": \"dd77dd78c86a18c6cf1e06303f05e9329416e5ab026e8be0c04d41ce10a5c32a\"}"]
"provenance_evidence" = "Exact body and recipient decision independently reviewed; source library binds the complete historical foundation and distinct formula and response."
