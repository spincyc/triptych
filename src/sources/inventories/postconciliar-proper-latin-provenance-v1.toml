"note" = "Source-based Latin study reconstruction from a complete historical prayer, with separately sourced full conclusion and marked response. The historical wording and individually reviewed revisions are recorded in the source apparatus. The comparison witness is a secondary digital reproduction. Correspondence with an authenticated printed 2002 or 2008 Missal remains unverified. This is a study text, not an approved liturgical edition."

