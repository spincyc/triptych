"transformations" = ["Change the old Son-addressed quos pascis corpore tuo to the Father-addressed quos pascis Filii tui Corpore et Sanguine; the coordinated Sanguine explicitly adds the other conventional Eucharistic element.", "Add solum after non, qualifying the opposition between word/tongue and deed/truth.", "Omit the predicate Dominum after veritate, retaining te as the confessed addressee.", "Normalize ligatures, stress accents, capitalization and punctuation; replace ampersand with et.", "Preserve the literal historical long cue in source apparatus, but use the independently old short Per Christum Dominum nostrum with separate R. Amen for the explicitly Father-addressed study selection."]
