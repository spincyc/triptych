[[persons]]
id = "theophylact-of-ohrid"
namespaces = ["theophylact-of-ohrid"]
name = "Theophylact of Ohrid"
names = ["Theophylact of Ohrid", "Theophylact", "Theophylactus", "Theophylact of Achrida", "Theophylact of Bulgaria"]
died = "1107, as the Catholic Encyclopedia's 'Exegesis, Biblical' gives it ('Theophylactus (d. 1107)'); the other articles read give no date"
standing = "ecclesiastical-writer"
standing_basis = "Greek exegete and Archbishop of Achrida (Ohrid) in Bulgaria after the breach of 1054. 'Theophylactus of Achrida (1078) was one of the most famous of the medieval Greek exegetes', in a see whose Bulgaria 'was incorporated with the Byzantine patriarchate' at Constantinople in 869, whose metropolitan Leo signed Michael Caerularius's circular letter against the Latin Church in 1053: 'In reality Achrida was during this period seldom in communion with either Constantinople or Rome' (Catholic Encyclopedia, 'Achrida'); 'Theophylactus, Archbishop in Bulgaria (eleventh)' is among the Greek catenists (Catholic Encyclopedia, 'Commentaries on the Bible'). No cultus is recorded in these sources. The standing is the maintainer's settlement of 2026-09-23 (guidance/liturgy/liturgical-commentators-plan-2026-09-22.md, 'Standing settlements'): an ecclesiastical writer and not a writer outside Catholic communion under decision D3, for his long Western reception and because his commentary is not schismatic polemic. The reception, as far as it was counted: Aquinas's Catena aurea, in the Corpus Thomisticum text of every Catena page its index links, names Theophylactus 1,033 times, in the volumes on Mark (362), Luke (423) and John (248), and not in the volume on Matthew."
basis_sources = [
  "https://www.newadvent.org/cathen/01103b.htm",
  "https://www.newadvent.org/cathen/04157a.htm",
  "https://www.newadvent.org/cathen/05692b.htm",
  "https://www.corpusthomisticum.org/iopera.html",
  "work.theophylact-of-ohrid.enarratio-in-evangelium-ioannis",
]
confession = "Byzantine, as Archbishop of Achrida after 1054"
notes = "EVIDENCE AGAINST THE SETTLEMENT, RECORDED AND NOT ADOPTED: the Catholic Encyclopedia's 'Exegesis, Biblical' names 'Photius (d. 891), Œcumenius (tenth century), Theophylactus (d. 1107), and Euthymius (d. 1118)' as 'adherents of the Greek Schism, but their exegetical works deserve attention'. The settlement did not cite that sentence; the row keeps the maintainer's standing and records the sentence beside it."

[[persons]]
id = "rabanus-maurus"
name = "Rabanus Maurus"
names = ["Rabanus Maurus", "Hrabanus Maurus", "Rhabanus Maurus", "Rabanus", "Maurus Magnentius Rabanus"]
died = "4 February 856"
standing = "saint"
standing_basis = "The current Roman Martyrology (Martyrologium Romanum, 2004, p. 133) gives his feast on 4 February and qualifies him as a Saint, 'sanctus', as reported by the English Wikipedia article 'Rabanus Maurus' (read 2026-09-23), which the maintainer supplied on 2026-09-23 in settling his standing; the printed Martyrology itself was not read. Earlier witnesses: Abbot of Fulda and Archbishop of Mainz, born at Mainz about 776 (784?), died at Winkel near Mainz on 4 February 856 (Catholic Encyclopedia, 'Blessed Maurus Magnentius Rabanus'). That article is headed 'Blessed' and gives the title's basis: 'Mabillon and the Bollandists style him \"Blessed\", and his feast is celebrated in the dioceses of Fulda, Mainz, and Limburg on 4 February.' Migne's PL 107 (Paris, 1864) calls him 'B. Rabani Mauri' on its title page (edition record) and in its running head ('B. RABANI MAURI ARCHIEP. MOGUNT. OPERUM PARS I.', read on the page image of columns 871-872). The Roman Martyrology does not name him on 4 February, Pridie Nonas Februarii, in the Latin recension printed at Rome in 1902, nor on that day or in the index of the English translation of the edition printed at Rome in 1914 (Baltimore: John Murphy, 1916). Those older recensions omit him; the 2004 edition's entry is what establishes the standing recorded here. NOT READ DIRECTLY: the printed Martyrologium Romanum of 2004, which Internet Archive offers only as a controlled loan."
basis_sources = [
  "https://en.wikipedia.org/wiki/Rabanus_Maurus",
  "https://www.newadvent.org/cathen/12617a.htm",
  "edition.jacques-paul-migne.patrologia-latina-volume-107.1864-paris",
  "artifact.jacques-paul-migne.patrologia-latina-volume-107.1864-paris.columns-869-874-facsimile-9d084bb1",
  "https://archive.org/download/gtu_32400004276022/gtu_32400004276022_djvu.txt",
  "https://archive.org/download/romanmartyrology00cathuoft/romanmartyrology00cathuoft_djvu.txt",
]
confession = "Catholic"
notes = "Settled as a saint by the maintainer on 2026-09-23 on the evidence of the 2004 Martyrologium Romanum entry, superseding the ecclesiastical-writer standing first recorded when only the 1902 and 1914 recensions had been read. As a saint he may be one of an interpretation's two authors and may anchor a Blessed under decision D1. No library namespace: his works are held inside the PL 107 container (src/sources/inventories/source-containment-v1.toml), not under a work record of his own."

