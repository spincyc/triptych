# Who an author is, as the Church has judged him: one row per person.
#
# THE QUESTION THIS ANSWERS. A proper study's reading rests on "Fathers or
# saints", and a liturgical commentator is a witness of another kind. Nothing
# recorded which author is which: the component checker counted any two names,
# and the commentary harvest's `role` is a model's lead data, which tags Rupert
# of Deutz `saintly` on some rows and `ecclesiastical-writer` on others. Standing
# is a fact about a person, and this file is its one home. Locus rows
# (`src/sources/commentary/formulary-loci.yaml`), harvest tags and study records
# point here and never restate it.
#
# THE CLOSED SET, IN PRECEDENCE ORDER. A person carries the first that is true
# of him, so Augustine is `father` although he is also a Doctor and a saint; the
# basis says the rest.
#
#   father                 a Father of the Church: the patristic age, with the
#                          notes the Catholic Encyclopedia's "Fathers of the
#                          Church" gives after Fessler -- orthodox doctrine and
#                          learning, holiness of life, antiquity -- and the
#                          Church's approval
#   doctor                 a canonized saint declared a Doctor of the Church
#   saint                  canonized, by a papal act or by the ancient cultus
#   blessed                beatified
#   venerable              heroic virtue decreed
#   servant-of-god         a cause opened
#   ecclesiastical-writer  an orthodox Catholic writer with none of the above;
#                          the Catholic Encyclopedia's term for an early author
#                          "who fail[s] to reach this standard"
#   historian              a modern historian or editor of the liturgy
#   non-catholic           outside Catholic communion
#
# WHAT A ROW CLAIMS, AND ON WHAT. `standing_basis` states the act or the
# convention and its date; `basis_sources` cites every source the basis was read
# from, as an https URL or a library record id. Every source was fetched whole
# with curl on 2026-09-22, or on 2026-09-23 for the rows added or corrected that
# day, and read locally; none passed through a model. A web
# search was used only to locate a page, never to read one. Where a source
# gives no date, `died` says so rather than supplying one. `censures` records a
# judgment on a point -- the body, the year, the point, the source -- and a
# study never cites the person for that point.
#
# `id` is the person's work-id namespace where the library has one; `namespaces`
# lists every namespace that is this person (Augustine has two). `names` are the
# forms a study's lane or the commentary index cites him by, compared with case
# and spacing folded; a name belongs to one person only.
#
# WHAT IS CHECKED. `tools/tpt commentary-work-index standing`, run by `make
# check-sources`, refuses unknown fields, a standing outside the set, a basis
# citing nothing, a source that is neither a URL nor a library record, a
# repeated person, name or namespace, and a namespace the library does not have.
# It REPORTS, and does not fail on, a liturgical commentary or a published lane
# author with no row: the judgment is the maintainer's, and a new registration
# must not turn the source gate red for want of it.
#
# WHAT THIS FILE DOES NOT SAY. How a study may use a person of each standing is
# not decided here. The maintainer's decision D1 of 2026-09-22 is recorded in
# guidance/liturgy/liturgical-commentators-plan-2026-09-22.md, and the rule that
# applies it lands in the proper-study guidance and its opt-in component
# contract, which read this file.

schema = "triptych-author-standing/v1"
record_type = "author-standing"
audited_on = "2026-09-23"

