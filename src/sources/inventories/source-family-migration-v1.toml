notes = "This corpus-plan owns the Holy See's coordinated teaching and discipline acts on Catholic membership in Masonic associations, 1738-2023: Clement XII's In eminenti of 28 April 1738, Benedict XIV's Providas Romanorum of 1751 confirming it, Leo XIII's Humanum genus of 20 April 1884 reviewing the chain of condemnations, the CDF declaration of 17 February 1981 correcting misreadings of the 1974 letter on canon 2335, the declaration Quaesitum est of 26 November 1983 restating the negative judgment under the new Code, the unsigned 1985 L'Osservatore Romano reflections explaining it, and the DDF note of 13 November 2023 applying it for the Diocese of Dumaguete. The seven acts, papal and dicasterial, form one family rather than per-work families because they are a single regulatory thread about one object, each later act confirming, interpreting, explaining, or applying an earlier one - the manifests' relation fields record the chain - matching the family.roman-missal.older-use-discipline-acts precedent for a bounded corpus of coordinated acts; the codified canons themselves stay owned by the 1917 and 1983 code families, and the UGLE self-description is a separate non-ecclesial family. Six acts have exact restricted artifacts and verified complete-text passages (Quaesitum est also in its Latin original; Humanum genus's Latin state is hashed but uncollated and carries no passage). Providas Romanorum is catalog-level only with no registered witness - its papalencyclicals.net page is a text-free stub - and the witnesses preserve day-of-issue disagreements (18 March against 18 May 1751; 28 against 24 April 1738), so availability, storage, and the evidence ceiling stay mixed. The In eminenti English witness is an unattributed papalencyclicals translation whose page carries injected advertising text, recorded as a witness-quality defect; the Latin originals in the Bullarium and the Acta printings of the modern acts remain unregistered."

