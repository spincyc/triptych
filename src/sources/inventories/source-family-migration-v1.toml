notes = "The circular letter of 20 June 2020 to the presidents of episcopal conferences, signed by Cardinal Sarah and Archbishop Roche, communicating Francis's decision to insert Mater misericordiae, Mater spei, and Solacium migrantium into the Litany of Loreto, owns its catalog-level work and the Holy See Press Office bulletin B0350 of 20 June 2020 that carries the Latin original with the official Italian and English translations in one delivery. The family stays per-work on the ledger's precedent for independent curial acts, the same precedent that keeps family.holy-see.mater-populi-fidelis and family.holy-see.norms-supernatural-phenomena-2024 apart: it is a single dicasterial act, not a link in a chain of coordinated acts whose relations the manifests record. The letter is unnumbered and cited as a whole, no exact artifact is registered, and any capture of the press.vatican.va page would be stored restricted, so evidence stops at the edition. The Litany itself and the indulgences attached to it remain owned by their own families."

