notes = "The composite English devotional volume first published in 1961 by Alba House as The Secret of Peace and Happiness, reissued by St. Raphael Editions in 1978 and 1980 and from 1983 in cooperation with TAN Books as Trustful Surrender to Divine Providence, owns its catalog-level work at part, chapter, and numbered-head loci. It stays its own family rather than forming one cluster with the sources it is assembled from: Saint-Jure's treatise and Colombiere's sermons are independent seventeenth-century intellectual works with their own authors, language, genres, dates, and transmission, they are cited as direct witnesses in their own right at their own loci, and the recorded relation runs one way only, from the anthology to them, so the contract's independent-intellectual-family test keeps them apart. That also follows the ledger's container precedent, in which family.acta.aas-ass owns the Acta containers while their promulgated constituents keep separate families and family.santuario-de-fatima.dcf-selecao-1917-1930 owns the DCF printing while the Leiria pastoral letter stays with family.fatima.ecclesial-acts: a container neither absorbs its constituents nor is absorbed by them. The 1961 Paul Garvin translation is in copyright and no edition or artifact record is registered, so evidence stops at the work; the authorized witness is the publisher's own posted preview of the 2012 TAN printing (title leaf, copyright page, publisher's note, contents, and opening pages), which is partial, and any exact capture would be stored restricted. The compiler is unnamed in the printed book, the 1961 Alba House first edition was not obtainable, and the volume's attribution of Part II chapter V to Colombiere is contradicted by that chapter's correspondence with Saint-Jure book 3 chapter 8 section 10, so the relation gap stays open."

