notes = "The Congregation for the Doctrine of the Faith's declaration Dominus Iesus of 6 August 2000 (AAS 92 [2000] 742-765), signed by Cardinal Ratzinger as Prefect and Archbishop Bertone as Secretary, ratified and confirmed by John Paul II at the audience of 16 June 2000 and ordered published, owns its catalog-level work in twenty-three numbered paragraphs and the dated 2026-07-25 Vatican English web state. No existing Holy See family covers doctrinal declarations as a class: family.holy-see.masonic-membership-acts is a bounded corpus of coordinated acts about one object, while family.holy-see.mater-populi-fidelis and family.holy-see.norms-supernatural-phenomena-2024 are both per-work on the ledger's precedent for independent curial acts, which this declaration follows. The Latin text in the Acta governs and remains unregistered together with the other language expressions; no exact artifact is registered and any capture of the copyrighted Vatican page would be stored restricted, so evidence stops at edition and paragraph loci."

