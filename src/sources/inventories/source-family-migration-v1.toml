notes = "The large seventeenth-century French treatise of the Jesuit Jean-Baptiste Saint-Jure (1588-1657) on the knowledge and love of Christ owns its catalog-level work at book, chapter, and section loci; book 3 chapter 8 treats the conformity of the human will to the divine will and closes at section 10 with a particular exercise toward divine providence. The family stays per-work rather than merging with the Alba House composite volume that extracts it: the treatise is an independent intellectual work with its own author, language, date, and transmission, it is cited as a direct witness in its own right, and the ledger's container precedent keeps a compilation and its constituents in separate families. The witness read is the public-domain Internet Archive OCR of volume 2 of the Paris (Perisse freres) 1877 re-edition, whose running heads confirm the divisions cited and which carries only the end of book 2 and book 3 through chapter 10, leaving the treatise's other volumes unexamined; that printing is not registered as an edition, no seventeenth-century printing was consulted, no collation was performed, and the 1630s first-publication date was not verified at a witness, so date, edition, and artifact gaps stand and evidence stops at the work."

