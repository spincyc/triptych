reviewed_on = "2026-07-27"
notes = "This corpus-plan now owns a canonical slice of the council's acts. The canons and decrees are registered as one work whose loci are session, canon, and decree, rather than as one work per session, and the family owns that work with two editions: the Latin stereotype reprint of the Roman edition (Leipzig: Tauchnitz, 1887, printing the Roman edition's page numbers in the margin) and Waterworth's standard nineteenth-century English translation in the undated Burns and Oates reprint whose Ld. imprint places it after 1885. Each edition has one exact remote public-domain page image and verified session XXIV passages, canons 9 and 10 in Latin and canon 9 in English, canon 9 anathematizing the assertion that clerics in sacred orders or solemnly professed regulars can validly contract marriage and canon 10 the assertion that the married state is to be preferred to virginity or celibacy. Both page images are mechanical reproductions of pre-1930 printings whose United States public-domain basis was reviewed and recorded, and neither is retained in the repository. The Tauchnitz orthography (solenniter, caelibatus, quum, iungi, coniugalem) and Waterworth's own footnote glossing anteponendum as preferred before are recorded as edition witnesses rather than corrected. The promulgated original and the manuscript tradition remain unregistered editions, other vernacular translations remain unregistered expressions, and Denzinger locators stay separate witnesses owned by family.denzinger.enchiridion-symbolorum."

