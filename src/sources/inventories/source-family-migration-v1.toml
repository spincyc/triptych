notes = "The 1881 Chicago subscription county history owns its work and the Internet Archive OCR text of that imprint. It is registered for one purpose only, as a bounded negative-search corpus for the absence of Adele Brise and the Robinsonville chapel from a large regional history published twenty-two years after the reported apparitions, and the family is classified secondary because that is what a subscription county history is: a compilation about the events, not a witness to them. The search boundary must travel with the result. Roughly ten megabytes of uncorrected OCR were searched literally and case-insensitively one physical line at a time for Brise, Brisse, Good Help, Bon Secours, and Robinsonville; the single Robinsonville hit is a Fort Howard biographical sketch about a school under the Winnebago Presbytery. Such a search cannot exclude hyphenation across lines, variant spellings, damaged recognition, or a mangled passage, page images were not checked, and the negative result is therefore bounded and correctable and must be phrased so by every consumer. The 1881 imprint is public domain and the scan is remote; no exact artifact is registered, which is the artifact gap and the reason the ceiling is edition-locus rather than a registered corpus boundary."

