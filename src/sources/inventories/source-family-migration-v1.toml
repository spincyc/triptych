notes = "The sermons of the Jesuit Claude de la Colombiere (1641-1682), preached largely in England during his chaplaincy to the Duchess of York and printed after his death with his retreat notes and Reflexions chretiennes, own their catalog-level work at the volume-and-page loci of the 1832 collected Oeuvres, whose public-domain Internet Archive OCR of volume 5, with volumes 1-4 and the 1684 Reflexions chretiennes searched by keyword, is the witness read. The family stays per-work rather than merging with the composite Alba House volume that prints a compilation from these sermons: they are an independent intellectual work with their own author, date, genre, and transmission, and the ledger's container precedent keeps a compilation and its constituents in separate families. Individual sermons are identified by title and printed thesis rather than by number, so the collection's internal work boundaries stay unsettled and loci are edition-bound; no edition or artifact record is registered, so evidence stops at the work, and the transmission history of the posthumously published texts was not investigated. The keyword search of the five volumes found no parallel to Saint-Jure's exercise toward divine providence, but that search ran over OCR and does not exhaust the corpus."

