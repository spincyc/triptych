reviewed_on = "2026-07-27"
notes = "The current Latin code now owns a canonical Book VI slice and its promulgation layer. The code work and the dated 2026-07-25 Latin and English Vatican web states of revised Book VI, with exact restricted artifacts and verified canon 1374 passages in both expressions, cover the penal law in force since 8 December 2021; canon 1374 names no association, and the English delivery is an unofficial aid. John Paul II's apostolic constitution Sacrae disciplinae leges of 25 January 1983 and Francis's Pascite gregem Dei of 23 May 2021 join this family rather than per-work families because each is a promulgation act of the code line the family owns - the one promulgating the code, the other promulgating its revised Book VI whose canons the registered editions deliver - matching the promulgation-act precedent of family.roman-missal.third-edition-latin-us-english for the Missale Romanum constitution and the amendment-act precedent of family.catholic-church.catechism for the 2267 rescript, while each remains a distinct intellectual work, so the family becomes a mixed-cluster. Each constitution has a work, dated official English Vatican web edition, exact restricted artifact, and verified complete-text passage; their authoritative Latin texts and any Acta printings remain unregistered, as do the code's other books, consolidated states, and translations, so availability stays mixed. The 1917 code and CCEO stay in separate coordinated family rows. The wave-seven registrations widen the canonical slice beyond Book VI for the law article: a dated 2026-07-25 English codex web state of fifteen canon-range pages (cann. 1 through 1363 in selection, including the Book VI Part I page) and a dated 2026-07-25 Latin codex web state of one page per book for Books I-V and VII, with twenty-one exact restricted Vatican page artifacts and eighty-five verified canon passages across the two codex editions covering the general-norms, governance, teaching-office, sanctifying-office, temporal-goods, and penal canons in use; three further Book VI passages (English canon 1399, Latin canons 1315 and 1399, the Latin 1315 recording the delivery's 'divinamcongrua' spacing defect) under the previously registered Book VI editions, whose Book VI page refetched byte-identical on 2026-07-25; and a same-date English refetch artifact and complete-text passage of Pascite gregem Dei whose different exact bytes record an observed instance of Vatican delivery mutability, reinforcing the dated-state discipline. The English codex delivery remains an unofficial aid whose translator the pages do not name. The wave-ten registrations widen the canonical slice again for the celibacy article: two further exact restricted English codex page artifacts, cann. 208-329 and cann. 573-606, and sixty-one further verified canon passages across the four registered codex and Book VI editions, covering the clerical obligations and rights of cann. 273, 277, 285, and 288-293, the requirements and impediments for orders in cann. 1024-1050, the marriage canons 1055, 1087, 1088, and 1135, vows and their dispensation in cann. 1191-1197, departure from an institute in cann. 691-693 and the counsel of chastity in c. 599, the penal canons 1394, 1395, and 1398 in both expressions, and the interpretative canons 18, 32, 33, and 194. The English codex delivery prints aVected for affected at several canons, an apparent ligature defect recorded rather than repaired, and remains an unofficial aid whose translator the pages do not name. The authentic interpretations of this code are owned by their own collection family, and the Eastern Code stays in family.holy-see.cceo-1990. Two wave-eleven registrations join here rather than following the studies that prompted them, on the boundary this ledger already applies to the canons an act invokes: the exact English web artifact for cann. 731-746 on societies of apostolic life, read for the study of the Priestly Fraternity of Saint Peter's erection and autonomy, extends the already owned dated English web edition of the Code, and the separate English web edition of Book IV, Part III, Title I, cann. 1205-1243 on sacred places, read for the Champion study's treatment of the legal category of shrine and national shrine in cann. 1230-1234, is a further dated delivery state of the same Code. Both are the law rather than the acts that apply it; the acts stay with their own families and the Latin text remains controlling for both."

