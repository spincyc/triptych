notes = "Francis de Sales's twelve-book treatise on the love of God, first published at Lyon in 1616 and addressed to Theotimus, owns its catalog-level work at book-and-chapter loci; books 8 and 9 carry the Salesian account of the signified will and the will of good pleasure and the distinction of resignation from holy indifference. It is a separate family from the Alba House composite volume and its two constituents, and from the Caussade treatise, per the ledger's per-work norm for independent intellectual works: nothing relates them beyond a shared subject, and no manifest records a relation. The witness read is Henry Benedict Mackey's complete public-domain English translation at the Christian Classics Ethereal Library, whose chapter divisions govern the loci cited; no collation against the French Annecy edition was performed, and neither that translation nor any French printing is registered as an edition, so evidence stops at the work and no exact artifact is registered. Section and paragraph divisions vary by edition and translation, so consumers cite book and chapter only."

