notes = "The expanded first-person text that Melanie Calvat subscribed at Castellammare on 21 November 1878, printed at Lecce in 1879 under a diocesan Nihil obstat: imprimatur and reprinted at Louvain by J. Lefever in 1881 with a preface, two of her recent letters, and a letter of Salvatore Luigi Zola, Bishop of Lecce and formerly her spiritual director, owns its catalog-level work at front-matter, letter, subscription, and printed-page loci and the 1881 Louvain imprint read in the public-domain Internet Archive scan. It is a private printed booklet by the seer, not an ecclesial act, so it stays its own family and is not folded into family.la-salette.ecclesial-acts: the recorded relations run one way, from the Holy Office decrees of 1915 and 1923 to this imprint as their object, which is the independent-intellectual-work test the ledger applies in family.alba-house.trustful-surrender-to-divine-providence, and a condemned book is not a member of the condemning authority's own act thread. The record exists so that the document's identity, printing permission, and custody chronology can be cited accurately; its content is not summarized in the manifests, no approval of that content is implied, and none is recorded. The 1881 imprint is public domain by age, but the scan is a user-contributed copy whose text layer is poor and usable for navigation only, the page images being the authoritative reading; no exact artifact is registered, so evidence stops at edition and page loci. A page-image collation of 2026-07-25 withdrew an earlier reported discrepancy between the imprimatur formula of 15 November 1879 at p. 22 and Zola's letter at p. 31, which the text layer had misread, and consumers who recorded that discrepancy must review; two items stay open, the ambiguous two-digit number at p. 9 and the title page's 'depuis 1867' against Zola's own 'de 1868 jusqu'en 1873'. The 1879 Lecce imprint this volume reprints has not been reached and the 1922 Societe Saint-Augustin reprint condemned in 1923 is unregistered, so the edition gap stays open."

