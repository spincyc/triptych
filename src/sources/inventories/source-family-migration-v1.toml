reviewed_on = "2026-07-27"
notes = "The canonical membership covers two bounded slices without conflating them: the current United States GIRM controls already recorded, and a Latin third-edition slice comprising the exact restricted 2002 secondary digital reproduction, genuine Missal formularies and proper headings, separately owned constituent acts and calendar works, the metadata-only 2008 altar-book identity, and the exact official Notitiae container, status notice, and variation-list passages. The variation list is not treated as the complete 2008 altar book. The complete split-HTML GIRM presentation, the 2011 U.S. altar book, direct 2008 reprint-page collation, later variations, and other territorial expressions remain separate migration work. The Latin slice now also owns the promulgation layer of the postconciliar Missal line reproduced in the same restricted 2002 artifact: Paul VI's apostolic constitution Missale Romanum of 3 April 1969, with its dated official English web state, exact restricted artifact, and verified complete-text passages in both expressions; the 26 March 1970 decree Celebrationis eucharisticae declaring the first typical edition; and the 27 March 1975 act De editione typica altera declaring the second. Each is a separately owned constituent work pinned to physical pages of the reproduction, exactly as Mysterii Paschalis and the 2000 third-edition decree already are, so the constitution joins this family rather than a per-work family: it promulgates the Missal line this family owns and is printed as a constituent of the registered container. The preconciliar Missal it superseded stays owned by family.roman-missal.1962, and the discipline acts on the older Missal's continued use form the separate family.roman-missal.older-use-discipline-acts."

