notes = "Bernard of Clairvaux's letter collection, transmitted in Jean Mabillon's Benedictine edition (Paris, 1690) and its descendants, owns its catalog-level work and Samuel J. Eales's English selection Some Letters of Saint Bernard (London: John Hodges, 1904), public domain from its 1904 publication and read in the Christian Classics Ethereal Library republication. The family stays per-work per the ledger's norm for independent intellectual works: the letter to the canons of Lyons on the Conception of the Blessed Virgin Mary is cited only as the classic medieval objection with its closing submission to the See of Rome, and Pius IX's definition keeps its own family. Letter numbering is not stable across editions, the letter commonly cited as Ep. 174 being Letter XLV in the Eales selection, and the work carries no edition-independent locus system, so consumers state the edition whose numbering they use. Eales translated a selection rather than the whole collection and no Latin collation was performed; the Mabillon Latin and the modern critical Sancti Bernardi opera remain unregistered and no exact artifact is registered, so evidence stops at edition loci."

