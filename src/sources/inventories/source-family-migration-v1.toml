notes = "This corpus-plan owns the coordinated acts by which the Priestly Fraternity of Saint Peter came into canonical existence and has since been governed: the founders' private declaration of 2 July 1988 and their act of foundation at Hauterive of 18 July 1988, the Pontifical Commission Ecclesia Dei's declaration to Fr Bisig of 22 July 1988, its decree conceding the 1962 liturgical books of 10 September 1988, its decree of erection of 18 October 1988 (Prot. N. 234/88), its letter to the general chapter of 29 June 2000 (Prot. N. 748/2000) and its decree on the chapter's recourse of 12 October 2000 (Prot. 823/2000), the constitutions in the only publicly available Part I excerpt, and Francis's decree of 11 February 2022 renewing the liturgical grant. They form one family rather than nine because each answers, applies, or amends another on a single object - the erection, constitution, governance, and just autonomy of one institute - which is the relation test the ledger's other corpus-plan rows satisfy; the private founding acts belong with the Roman answers because the Roman acts respond to them by name. It is deliberately not folded into family.holy-see.lefebvre-sspx-canonical-acts. That family's object is the canonical standing of Archbishop Lefebvre's Society, from the 1976 rupture to the 2026 declaration of schism; this family's object is a distinct institute of pontifical right in full communion. The two threads touch at the protocol of 5 May 1988 and the consecrations of 30 June 1988, which the founders' declaration invokes, but a shared hinge is not a shared object, and that family's own boundary rule - that a society's self-descriptive material is not an act of the Holy See - would be broken by absorbing private foundation acts into it. The general older-use discipline stays with family.roman-missal.older-use-discipline-acts, which owns Ecclesia Dei of 1988 and now also Universae Ecclesiae, the 1999 responsa Post liturgicam, and the 2019 motu proprio suppressing the Commission; canons 586 and 731-746 stay with family.holy-see.cic-1983; and Pietras's canonical article, which quotes several of these acts, is secondary literature and keeps its own family. Every member has an exact artifact and a verified complete-text passage, so availability is canonicalized and the ceiling is passage-pin, but the witness quality is uneven and the identity gaps say so: six acts are reached only through fssp.org's English presentation, the 2000 letter only through a German rendering on unavox.it, the 2000 recourse decree and the 1999 responsa only through a French archive at amdg.asso.fr, several were never printed in Acta Apostolicae Sedis, and the German original of the 22 July 1988 declaration, the Latin of the 1988 decrees, and the complete constitutions are unreached. Storage is restricted throughout because none of those hosts grants redistribution, and rights review is partial in the same sense as the neighbouring act families: the delivery states were reviewed and none may be retained, while the underlying acts' own publication status is unsettled."

