reviewed_on = "2026-07-27"
notes = "Volumes 56 (1964), 57 (1965), and 58 (1966) now have canonical container editions and exact restricted Holy See PDF artifacts. The series now also owns the Acta Sanctae Sedis work and the volume 6 (1870-1871) container edition with its exact restricted 776-page Holy See OCR PDF artifact, whose Postquam Dei munere constituent is pinned by the separate Vatican I family without absorbing the container. Other cited volumes and acts remain only partially resolved; each promulgated act remains a distinct work, and OCR remains a finding aid until checked against the official pages. The wave-eight registrations add AAS volumes 22 (1930), 23 (1931), and 60 (1968) as catalog-level container editions without exact artifacts, per the volume-6 ASS container precedent: they map the Bellarmine canonization-miracle decree and Pius XI's decretal letter Lux illa, his apostolic letter Providentissimus Deus declaring Bellarmine a Doctor (distinct from Leo XIII's 1893 encyclical of the same incipit), and Paul VI's apostolic letter Roma altera, all of which remain distinct unregistered constituent works; consumers using the vatican.va OCR scans record their access routes and dates locally. The wave-ten registrations add five more container editions with exact restricted Holy See artifacts: the complete 1967 and 1990 volumes as OCR PDFs, carrying Sacerdotalis caelibatus at pp. 657-697 and the promulgation of the Eastern Code with Sacri canones at pp. 1033-1363, and three monthly fascicles, 106 (2014) fascicle 6, 107 (2015) fascicle 3, and 107 (2015) fascicle 10, which are born-digital text-layer PDFs rather than scans because from 2003 the Holy See's archive serves monthly fascicles instead of whole-volume scans. Their constituent acts keep their own families and reach these bytes through bounded segments, as the Pontificia Praecepta, In Erythraea nova constituitur, Sacri canones, Eastern Code, and Sacerdotalis caelibatus rows now do. The volume 82 rasters render and were read visually for the cited canons; the volume 59 rasters could not be rendered by the tools available, so readings from it are text-layer readings corroborated elsewhere, and its OCR layer remains a finding aid in either case. The wave-eleven registrations add fourteen further container editions with exact restricted Holy See artifacts, acquired for the Society of Saint Pius X history: eight whole-volume OCR scans, 39 (1947), 40 (1948), 54 (1962), 66 (1974), 67 (1975), 68 (1976), 76 (1984), and 80 (1988), and six born-digital monthly fascicles, 101 (2009) fascicles 2, 4, and 8, 107 (2015) fascicle 9, 108 (2016) fascicle 12, and 109 (2017) fascicle 4, the fascicle form again following the Holy See's practice from 2003. They carry the Propaganda Fide and consistorial provisions on Marcel Lefebvre's appointments, Paul VI's consistorial allocution of 24 May 1976, Quattuor abhinc annos, John Paul II's letter of 8 April 1988 and Ecclesia Dei, the 2009 note, remission decree, papal letter, and Ecclesiae unitatem, and the 2015-2017 concessions of confession and marriage faculties. Volumes 66 (1974) and 67 (1975) were acquired and read for a negative result and carry no cited act; that is a bounded absence in those volumes' text layers, not a claim about the Acta as a whole. As before, the constituent acts remain distinct unregistered works read at the cited pages through each volume's own text layer, which stays a finding aid; the separately registered acts on Lefebvre and the Society keep their own family. No container edition is registered for the volumes carrying the separately registered La Salette acts (ASS 11 (1878) and AAS 7 (1915), 8 (1916), 15 (1923), and 38 (1946)); if one is registered later it belongs here, and their act-level editions stay with family.la-salette.ecclesial-acts."

