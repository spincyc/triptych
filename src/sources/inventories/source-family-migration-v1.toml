trace_patterns = ["(?:Ecclesia Dei(?: adflicta)?|ecclesia-dei)", "(?:Post liturgicam|Prot\\.?\\s*1411/99)", "(?:Rescriptum ex audientia|rescriptum-traditionis-custodes)", "(?:Responsa ad dubia|responsa-ad-dubia)", "Summorum Pontificum", "Traditionis custodes", "Universae Ecclesiae"]
reviewed_on = "2026-07-27"
notes = "This corpus-plan owns the coordinated discipline acts governing use of the Roman liturgy prior to the reform of 1970: John Paul II's motu proprio Ecclesia Dei of 2 July 1988, Benedict XVI's Summorum Pontificum with its accompanying letter to the bishops of 7 July 2007, Francis's Traditionis custodes with its accompanying letter of 16 July 2021, the Congregation's Responsa ad dubia of 4 December 2021, and the Dicastery's Rescriptum ex audientia of 20 February 2023. Each act has a canonical work, dated official English Vatican web edition, exact restricted artifact, and verified complete-text passage. The acts form one family rather than per-work families because they are a single regulatory thread about one object, each later act answering, implementing, or restricting an earlier one, while remaining distinct intellectual works inside the cluster, matching the family.vatican-ii.papal-acts precedent for a bounded corpus of coordinated acts. The authoritative Latin or Italian originals and any Acta printings remain unregistered expressions; the 1962 Missal itself stays owned by family.roman-missal.1962, the reformed Missal line and its promulgation acts by family.roman-missal.third-edition-latin-us-english, and the 1984 indult Quattuor abhinc annos remains an identified but unregistered lead. Three acts join this thread in wave eleven rather than the Fraternity of Saint Peter's own family, because each governs the older use generally and not one institute: the instruction Universae Ecclesiae of 30 April 2011, which is the implementing norm of Summorum Pontificum already owned here and is registered for citable identity at work, dated Vatican English web edition, and exact restricted artifact, its Acta locus being reported from the canonical literature rather than the gazette; Francis's motu proprio of 17 January 2019, which decommissioned the Pontifical Commission Ecclesia Dei erected by the 1988 motu proprio this family owns and moved its competence to the Congregation for the Doctrine of the Faith, with the Italian promulgated text governing over the English state registered here; and the Congregation for Divine Worship's responsa officialia Post liturgicam of 3 July 1999, Prot. 1411/99, holding that a priest of a community enjoying the 1962 faculty may and sometimes must celebrate with the Missal of Paul VI, that superiors may not forbid it, and that concelebration in the current rite may not be forbidden. The 1999 responsa breaks this family's otherwise uniform witness quality and the exception is recorded rather than hidden: it is reached only through an unofficial French rendering on a third-party archive with no named translator, its Latin printing in Notitiae 35 (1999) 307-309 was not obtained, and it therefore sits squarely inside this family's existing expression and language gaps. Its later application to one institute, in the Commission's letter of 29 June 2000 to that institute's general chapter, stays with family.priestly-fraternity-of-saint-peter.canonical-acts."

