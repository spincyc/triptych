reviewed_on = "2026-07-27"
notes = "Mansi's eighteenth-century collection of conciliar acts, cited by volume and column, owns its container work and the two tomi registered so far: tomus II (Florence 1759, in the Welter photo-reprint) carrying Elvira and Nicaea, and tomus XXI (Venice 1776, likewise reprinted) carrying the First and Second Lateran Councils and the Council of Pisa of 1135, with seven exact remote public-domain page images and seven verified column passages. Mansi is not joined to family.patristics.anf-npnf-schaff. That family's identity is Schaff's English Ante-Nicene and Nicene and Post-Nicene translation series, and the ledger's container precedent is that a container family owns its own volumes while constituent works keep their own families; it does not merge unrelated series. Mansi is a different collection by a different editor in a different century, Latin rather than English, conciliar acts rather than patristic translations, with its own apparatus and its own printing history, so it takes its own container family on the same precedent that gives family.ante-nicene-fathers.volume-1-buffalo-1887 a bounded row of its own. The collection is a container witness: the councils and papal acts printed within it retain their own identity and remain unregistered, as do its other tomi, and its apparatus records variant recensions that consumers must not collapse. Mansi prints Elvira canon 33 twice, at coll. 11-12 and again at coll. 245-246 in parallel Vulgatus and Emendatus columns whose addressees and wording differ, prints two Latin recensions of Nicaea canon 3, and records in the Lateran I headnote that Baluze printed those canons from the Anianum manuscript in a different order and with variant readings. Every registered page image is a mechanical reproduction of a pre-1930 printing with its United States public-domain basis reviewed and recorded, and none is retained in the repository."

