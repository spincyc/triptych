reviewed_on = "2026-07-27"
notes = "Lumen gentium, Sacrosanctum Concilium, Dei Verbum, Gaudium et spes, Dignitatis humanae, Ad gentes, Presbyterorum ordinis, Orientalium Ecclesiarum, Unitatis redintegratio, Nostra aetate, Perfectae caritatis, Apostolicam actuositatem, Christus Dominus, Gravissimum educationis, Inter mirifica, and Optatam totius now have distinct work, Latin Acta, dated Latin and English web, exact artifact, complete-numbered-text, and high-reuse passage identities. The normalized AAS constituents reuse their existing volume container artifacts without making those containers or their other constituents part of any act; Ad gentes, Presbyterorum ordinis, Nostra aetate, and Perfectae caritatis also preserve Acta cross-references to common subscription pages without absorbing those pages into their segments. The separately printed conciliar notifications, the Nota explicativa praevia, the common 6 March 1964 Doctrinal Commission declaration, the Orientalium Ecclesiarum vacatio-legis notice, and the later Ecclesiae Sanctae implementation act remain distinct works; the declaration has separate AAS 57 and AAS 58 reproduction witnesses. Unitatis redintegratio's Latin web delivery appends the distinct Lumen gentium apparatus; Nostra aetate's delivery appends a distinct vacatio-legis notice and incomplete shared subscription block; Ad gentes' delivery appends duplicated promulgation matter and an incomplete shared subscription block; and Perfectae caritatis' Latin delivery appends its promulgation matter and an incomplete shared subscription block. Each appendix is explicitly excluded from the act's numbered passage boundary. Apostolicam actuositatem, Christus Dominus, Gravissimum educationis, Inter mirifica, and Optatam totius likewise keep their appended promulgation apparatus, subscription blocks, and source notes outside their numbered passage boundaries. All sixteen conciliar acts are now represented, and neither the Vatican website nor the 1955 decree Cum hac nostra aetate is treated as part of this intellectual family merely by name. The wave-ten registrations add five further high-reuse passages under the already registered conciliar editions for the celibacy article: Lumen gentium n. 29 in both the Latin and English 2026-07-23 web states, Optatam totius n. 10 in both the Latin and English 2026-07-24 web states, and Presbyterorum ordinis n. 16 in the Latin 2026-07-23 state. Optatam totius' work record also widened its locus pattern to admit articles 10 through 19, which the earlier pattern excluded; that is a corrected locus grammar for the same 22-article act, not a change of identity."

