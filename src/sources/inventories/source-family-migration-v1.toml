reviewed_on = "2026-07-24"
notes = "Lumen gentium, Sacrosanctum Concilium, Dei Verbum, Gaudium et spes, Dignitatis humanae, Presbyterorum ordinis, and Orientalium Ecclesiarum now have distinct work, Latin Acta, dated Latin and English web, exact artifact, complete-numbered-text, and high-reuse passage identities. The normalized AAS constituents reuse their existing volume container artifacts without making those containers or their other constituents part of any act; Presbyterorum ordinis also preserves the Acta's cross-reference to common subscription pages without absorbing those pages into its segment. The separately printed conciliar notifications, the Nota explicativa praevia, the common 6 March 1964 Doctrinal Commission declaration, and the Orientalium Ecclesiarum vacatio-legis notice remain distinct works; the declaration has separate AAS 57 and AAS 58 reproduction witnesses. Other conciliar acts remain pending, and the Vatican website is not treated as the intellectual family."

