nd the Press Office bulletin establish no repository redistribution permission, and no member is a candidate for tracked storage. Mutability is mixed rather than fixed because the acts are fixed but their only registered witnesses are dated web and bulletin states, and because the 2026 acts are weeks old and their reception is not closed. The Communicationes 29 (1997) 239-243 printing of the 1996 note, any Acta printing of the 2026 acts, the other language versions of Paul VI's two 1976 letters, and the Society's own replies remain unregistered; the Society's self-descriptive material is not an act of the Holy See and does not belong in this family."

