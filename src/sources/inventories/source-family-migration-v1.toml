trace_patterns = ["Cummiskey", "roman-missal-english-laity"]
reviewed_on = "2026-07-27"
notes = "The anonymous English lay hand missal published at Philadelphia by Eugene Cummiskey, first revised edition of 1861, owns its work, that one edition, two artifacts, and seventy-nine passages. The tracked artifact is the project's own tab-separated transcription of one hundred and eighty-three orations of the temporal cycle, keyed by the 1962 Missale Romanum formulary rather than by the 1861 heading and drafted from the remote Internet Archive DjVuTXT derivative of the Google digitisation, which remains registered because it is what was searched but does not control wording. Rights were reviewed for both: the 1861 text is public domain, so the transcription is tracked, while the scan derivative's own rights are unresolved and it is therefore remote and unretained - review completion is not clearance. The ceiling is passage-pin because each registered oration is a verified passage that a raw-line search returns as exactly one line. The identity gap is relational: the book states no Latin exemplar, and its formularies were matched to the 1962 Missal by collation, not by a stated descent, so it is a pre-1955 witness whose Holy Week, octaves, vigils, and seasonal second and third orations follow the older discipline and must never be read as 1962 rubrics. It stays a separate family from the other two hand missals registered in the same wave. They are three independently authored books - an anonymous Philadelphia translation of 1861, Husenbeth's English translation approved by the Vicars Apostolic, and Dom Gaspar Lefebvre's Belgian-American bilingual missal of 1925 - whose only common object is the Latin Missal that family.roman-missal.1962 already owns, and whose availability, rights, evidence ceiling, and disposition differ on every axis the ledger records; grouping them would collapse a genre, not an intellectual source. The Latin formularies themselves stay with family.roman-missal.1962, and the sanctoral and common portions of this book remain unregistered."

