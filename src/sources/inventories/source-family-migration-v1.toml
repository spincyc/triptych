notes = "Robinson and Pierpont's Greek New Testament in the Byzantine textform, registered for the Saint Peter biography, which reads the Greek directly rather than through a translation. The family owns the work, the one maintained electronic edition, and the eight tracked CSV artifacts actually acquired - Matthew, Luke, John, Acts, Galatians, 1 and 2 Peter, and Jude - each public domain on the repository's own declaration and reviewed individually. Membership is an edition family rather than a work family because only this electronic expression is registered, matching the shape of family.scripture.vulgata-clementina-hetzenauer-1914. Two limits are load-bearing and are the reason the family stops at artifact-pin with an artifact identity gap. First, these files are the repository's own Unicode conversion of Professor Robinson's official BETA-code CCAT files; that conversion input was not separately acquired or hashed, so no member witnesses the printed 2005 or 2018 editions and no claim of identity with them is registered here. Second, the inline {NA ...} and {Byz ...} braces sit inside the verse text, so a raw-line literal search can match apparatus wording as well as edition wording, and those braces are divergence notes, not a critical apparatus: a consumer relying on a variant states which reading it uses and whether the note records a divergence. No passage record is registered, and the biography's transliterated quotations bind the artifacts. Other Greek textforms and the eclectic critical editions are not registered and are not members; the Vulgate and its English translations keep their own families."

