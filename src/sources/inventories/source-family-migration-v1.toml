notes = "The Eastern Code now owns a canonical slice and its promulgation layer. The code work, its authentic Latin promulgation text in Acta Apostolicae Sedis 82 (1990) 1045-1363, pinned to those printed pages through a bounded segment of the exact restricted volume artifact owned by family.acta.aas-ass and carrying nineteen verified canon passages read from the page images, and a dated 2026-07-25 Latin Vatican web state of the first part with its own exact restricted artifact and six further verified canon passages, used for canons whose Acta rasters did not render. John Paul II's apostolic constitution Sacri canones of 18 October 1990 joins this family rather than taking a per-work row because it is the act promulgating the code this family owns, its manifest records the relation, and it is printed in the gazette immediately before the Code at pp. 1033-1044, where its own segment and complete-text passage pin it; that is exactly the promulgation-act precedent by which family.holy-see.cic-1983 owns Sacrae disciplinae leges beside the Latin code, and the family therefore becomes a mixed-cluster while each act remains a distinct intellectual work. There is no official translation of the Code, so the Latin promulgation text is authentic and the expression and language gaps stay open; the code remains officially mutable, so consumers record the consolidated as-of date, amendments, authentic interpretations, and applicable particular law, the last of which the Eastern Code leaves to each Church sui iuris. The 1917 and 1983 Latin codes stay in their own coordinated family rows, and the Vatican delivery's 'Ritus, de quibus in Codice agitur' at c. 28 par. 2 is recorded as a delivery reading rather than repaired."

