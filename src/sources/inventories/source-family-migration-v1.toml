notes = "The Congregation for the Eastern Churches' act of 14 June 2014, approved by Francis in the audience of 23 December 2013, conferring on Eastern Hierarchs and Ordinaries outside the traditional Eastern territories the faculty to permit the pastoral service of married Eastern clergy and to ordain married candidates, owns its catalog-level work, its Italian Acta edition, and verified nota introduttiva and disposizioni passages pinned to printed pages 496-499 of the June 2014 fascicle through a bounded segment of the exact restricted fascicle artifact owned by family.acta.aas-ass. The act stays per-work rather than heading an Eastern-married-clergy cluster with the 2015 Eritrean constitution: the two are acts of different authorities about different objects, and neither manifest records a relation to the other, so they fail the test the ledger's corpus-plan rows meet, a single regulatory thread about one object whose chain the relation fields record. The act's own relation edges run instead to the Eastern Code and to the Acta, and the Code is owned by family.holy-see.cceo-1990. The gazette prints the act in Italian only, with no Latin version, and it has no artifact record of its own, so it is read through the shared volume artifact on the family.holy-see.index-notification-1966 precedent."

