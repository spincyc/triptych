[[families]]
id = "family.champion.ecclesial-acts"
label = "Ecclesial acts on the Champion (Robinsonville) apparitions of 1859"
kind = "corpus-plan"
source_categories = ["canon-law", "magisterial"]
identity_confidence = "confirmed"
identity_gaps = ["artifact", "expression"]
artifact_availability = "candidate-complete"
storage_plan = ["remote"]
rights_review = "partially-reviewed"
mutability = "fixed"
freshness_rule = "not-applicable"
evidence_ceiling = "edition-locus"
disposition = "canonicalize"
priority = "p2"
canonical_ids = ["edition.diocese-of-green-bay.decree-apparitions-1859-2010.english-shrine-web-2026-07-25", "work.diocese-of-green-bay.decree-apparitions-1859-2010"]
trace_patterns = ["(?:Diocese of Green Bay|diocese-of-green-bay)", "(?:Our Lady of Good Help|Shrine of Our Lady of Good Help)", "(?:Ricken|decree-apparitions-1859-2010)"]
reviewed_on = "2026-07-27"
notes = "Following the Lourdes, Fatima, and La Salette precedent, the ecclesial judgment thread on one object - the events reported by Adele Brise at Robinsonville, now Champion, Wisconsin, in October 1859 - takes its own corpus-plan row rather than being folded into the narrative witnesses. It currently has a single member, Bishop David Ricken's decree of 8 December 2010 declaring with moral certainty that the events, apparitions, and locutions exhibit the substance of supernatural character and approving them as worthy of belief, which is the competent positive diocesan judgment for this apparition exactly as the mandements of 1851 and 1862 are for La Salette and Lourdes; the row is opened as a plan because that thread is not closed, later diocesan and conference acts on the shrine's status being identified but unregistered. The 1978 CDF norms under which the decree was made are general legislation and keep their own family, as the 2024 norms already do and as the Lourdes family's boundary rule requires; the custodial shrine's presentation of the same events is not an act and keeps its own family; and canons 1230-1234 on shrines stay with family.holy-see.cic-1983. Evidence stops at edition and page loci. The decree is registered at work and edition level only: the four-page signed PDF the National Shrine publishes is identified and hashed on the edition manifest but is not a registered artifact, its own rights are unresolved, and page 4 - which carries the operative clause, the date, the signatures, the seal, and the chancellor's attestation Concordat cum Originali - has no text layer and was read from a rendering, so the artifact gap is real. The diocesan original was not consulted and no Latin or other expression is registered, which is the expression gap; a consumer quoting the operative clause cites this witness and says so."

