notes = "The fifth agreed statement of the second phase of the Anglican-Roman Catholic International Commission, signed at Seattle on 2 February 2004 and published in 2005, owns its catalog-level work in eighty numbered paragraphs and the dated 2026-07-25 delivery state on the Holy See's Christian-unity site. It stays per-work rather than joining a shared non-Catholic-confessional cluster with the 1895 Constantinopolitan encyclical and the Smalcald Articles: those three documents share only the role they play in one consuming publication, family membership records source identity rather than a consumer's use, and the ledger's corpus-plan precedents (family.holy-see.masonic-membership-acts, family.fatima.ecclesial-acts, and family.roman-missal.older-use-discipline-acts) all bind acts of one authority about one object in a chain the manifests' relation fields record, whereas a 1537 Lutheran confession, an 1895 Orthodox synodal reply, and a 2004 bilateral dialogue text have no such relation. The proposed shared label would also misdescribe this document, which is not another communion's own act at all: its own status paragraph states that it is not an authoritative declaration by the Roman Catholic Church or by the Anglican Communion, and presentation on christianunity.va is a presentation, not a magisterial act. That status paragraph is unnumbered and falls outside the paragraph locus system, the 2005 printed edition and any exact artifact remain unregistered, and any capture of the copyrighted Holy See page would be stored restricted, so evidence stops at edition and paragraph loci."

