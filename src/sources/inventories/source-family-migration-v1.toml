notes = "The Nahuatl tract printed at Mexico by Juan Ruiz in 1649 under the licences of Baltasar Gonzalez and Pedro de Barrientos Lomelin and published by Luis Laso de la Vega, chaplain of the Guadalupe hermitage at Tepeyac, owns its catalog-level work and its first-edition imprint, cited by the tract's sections and printed folios. It is the first securely datable witness of the apparition narrative conventionally called the Nican mopohua, and it stays per-work rather than joining a Guadalupe cluster: the four Guadalupe sources of this wave are a devotional imprint, a private report, a modern monograph, and a papal exhortation of four different centuries, authorities, languages, and genres, and no manifest records a relation among them, which is the ledger's test for a bounded corpus. The imprint's identity is confirmed, but the manifest records that authorship of the narrative itself and its date of composition are contested, so the authority and date gaps stay open beside the missing exact artifact. The text is public domain and was consulted through the John Carter Brown Library digitization, whose page images the library offers under CC BY 4.0, with a second digitized copy at the Library of Congress; the John Carter Brown volume is a composite binding whose later bilingual Guadalupe sermon, separately paginated, is not part of the 1649 tract."

