reviewed_on = "2026-07-27"
notes = "This corpus-plan owns the ecclesial judgment and reception thread on one object, the reported apparition of 19 September 1846 on the mountain of La Salette in the parish of Corps, following the family.lourdes.ecclesial-acts and family.fatima.ecclesial-acts precedent: Bishop Philibert de Bruillard's mandement of 19 September 1851 judging that the apparition bears in itself all the characteristics of truth and authorizing the cult - the competent positive diocesan judgment, retained in its historical formula under the 2024 norms and cited at its operative clause in their presentation - his mandement of 1 May 1852 instituting the Missionaries of Notre-Dame de La Salette, the Sacred Congregation of Rites' rescript Portus Aloisii of 12 May 1877 whose Ad II states that such apparitions have been neither approved nor reprobated by the Apostolic See but only permitted as piously credible by human faith, the Holy Office decree of 21 December 1915 forbidding all discussion of the so-called Secret de la Salette, the Holy Office declaration and Index decree of 1916 against Mariave's Exegese du Secret, the Holy Office decree of 9 May 1923 condemning the 1922 reprint of Melanie Calvat's text, Pius XII's centenary letter to Fr Etienne Cruveiller of 8 October 1945, and John Paul II's letter to Bishop Louis Dufaux of 6 May 1996. Episcopal, dicasterial, and papal, they form one family rather than per-work families because each later act receives, applies, or restricts an earlier one on the same object and the manifests' relation fields record that chain; the secret-discipline sub-thread of 1915-1923 belongs here on the same test, being the same authority acting on the same apparition, while the booklet it condemns is an independent intellectual work by the seer and stays with family.melanie-calvat.secret-complet-de-la-salette, as the one-way relation test applied in family.alba-house.trustful-surrender-to-divine-providence requires. Evidence stops at edition and locus level throughout: no exact artifact is registered for any member. No French printing of the integral 1851 mandement was reached, so that act is witnessed only by the abridged English rendering of its declaration in Ullathorne 1854 pp. 120-121, by the Italian of the four considerations and eight articles in the 1854 translation of Rousselot's pilgrim's manual pp. 42-47, and by the Sanctuary's partial French transcription of article 1 with its own bracketed ellipsis, which consumers must reproduce and must not fill; the 1852 mandement is witnessed only by the institute's custodial publication of its founding passage. The Holy See archive files for ASS 11 (1878) and AAS 7 (1915), 8 (1916), 15 (1923), and 38 (1946) are typeset transcriptions without page images, so image collation is impossible by that route and their recorded defects - 'cum' for the second correlative tum, 'Beconciliatricis' for Reconciliatricis, the condemned pamphlet's title-year printed 1845, broken accents and a title broken across line ends - stay on the edition manifests as witness-quality facts rather than being silently corrected. Those files would be stored restricted per the family.acta.aas-ass precedent, while the public-domain Rousselot and Ullathorne scans are remote, so the storage plan and availability are honestly split rather than uniform. Mutability is mixed because three members are dated custodial or Vatican web transcriptions that can change under the reader. The container volumes are not registered here: when a container edition for ASS 11 or those AAS volumes is registered it belongs to family.acta.aas-ass, as the already registered volumes do. The general 2024 apparition norms are not a La Salette act and keep their own family, Ullathorne's book and Roubaud's pamphlet keep theirs, and Bishop Ginoulhiac's mandements of 30 September and 4 November 1854 condemning later books remain identified but unregistered leads."

