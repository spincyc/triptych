notes = "The custodian's own published presentation of the Champion events - the narrative, the historical timeline, and the solemnity pages - registered as one work with a single dated web state of 2026-07-25. It is a family of its own and not part of family.champion.ecclesial-acts because a custodial institution's self-description is not an ecclesial act, the same boundary that keeps the Fatima sanctuary's documentation distinct from the Fatima acts. Its evidentiary ceiling is institutional self-description and nothing higher: the narrative page states its own method, that Adele Brise never learned to read or write and that the account was compiled from oral history, historical documents, and second and third-hand accounts in the shrine's archives, so it is never an independent historical witness to 1859 or 1871. Two internal inconsistencies are recorded rather than harmonized - the timeline's five acres against Pernin's six in both 1874 printings, and its placing of the beginning of the 15 August devotions in 1871 although Starr describes the August procession as already annual in a volume copyright-entered that year - and the fire section attributes to Pernin a paragraph that the consuming publication collated against both printings and found is not his text. Storage is restricted because the pages are the publisher's copyright with no redistribution permission, so exact bytes are not retained and the artifact gap stands; the date gap is the mutability itself, the three pages carrying different stamps of April 2026, January 2026, and July 2026 within one retrieval state."

