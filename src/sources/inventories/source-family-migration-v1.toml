notes = "Tilton's compilation of accounts, casualty lists, and relief subscriptions for the Wisconsin firestorms of 8 October 1871, published at Green Bay in the same year, owns its work and the one edition reached. Its registered role is as the nearest contemporary record against which the Champion preservation tradition can be tested: chapter XIV names Robinsonville among the largest settlements destroyed in that track of fire and records no exception there, a bounded and correctable silence rather than a disproof. The edition gap is the reason this family is not simply a public-domain 1871 imprint: what is registered is a modern reset reproduction digitized in 2022, not a facsimile, so its readings cannot be assigned to the 1871 compositor, and the one textual crux found - chapter XIV printing 3 October for the east-shore firestorm against the volume's own preface and map - was verified on the page image and cannot be located to a printing. The 1871 Green Bay imprint was not reached and no exact artifact is registered, so evidence stops at printed-page loci. It is a compilation of others' accounts, not an eyewitness memoir, and stays a separate work family from Pernin's book and from the apparition act and custodial families."

