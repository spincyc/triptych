notes = "The twenty-volume national edition of Galileo's works and correspondence (Florence: Barbera, 1890-1909), edited by Antonio Favaro, forms one container family for the whole critical edition, mirroring the ANF/NPNF and Catholic Encyclopedia series-container precedent: one registered container maps its constituent volume editions rather than spawning per-volume families, and the edition, not Galileo's individual works, is the registered identity because it is the controlling documentary witness for the Bellarmine-Galileo thread - the 1611 Roman College letters (vol. XI, nos. 515, 520, 709), the 12 April 1615 letter to Foscarini (vol. XII, no. 1110, pp. 171-172, printed from the Lincei contemporary copy), and the Vatican trial dossier in volume XIX including the qualifiers' censure, the February-March 1616 minutes and Index decree, and Bellarmine's 26 May 1616 certificate in its two dossier witnesses (autograph p. 348; Galileo's copy p. 342). Volumes 11, 12, and 19 were read in public Internet Archive scans (Gallica/BnF digitizations for the two correspondence volumes; the umich scan of volume 19, whose title page verifies the 1907 imprint), but the correspondence volumes' individual imprint years were not verified and carry the series range instead, keeping a date gap. The 1890-1909 Barbera printings are public domain, but no exact artifact is registered, so evidence stops at edition and printed-page loci; the underlying manuscripts, the remaining seventeen volumes, and the constituent documents and letters inside the registered volumes remain unregistered, and Bellarmine's own works keep their separate per-work families."

