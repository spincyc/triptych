notes = "The peer-reviewed canon-law article in Prawo Kanoniczne 69/1 (2026) 165-186, DOI 10.21697/pk.2026.69.1.07, studying the Fraternity of Saint Peter under the just autonomy of canon 586 as applied to societies of apostolic life by canon 732. It owns its work, the journal issue edition, the exact remote article PDF, and a complete-text passage. It is secondary literature and keeps its own family rather than joining family.priestly-fraternity-of-saint-peter.canonical-acts, on the same principle by which Lasserre's and Ullathorne's narratives stay outside the Lourdes and La Salette act families: an author's argument about a corpus of acts is not one of the acts, and the relation runs one way. Its evidentiary value here is nevertheless partly documentary and that is the recorded relation gap - it quotes in the original language several acts of which it is, for some, the only reached witness or the only corroboration, including the 2003 rescript approving the constitutions, which has no canonical record of its own; a consumer relying on those quotations is relying on Pietras's reading of a document it has not seen and must say so. Rights are settled rather than merely reviewed: the article is distributed under Creative Commons Attribution, so the artifact could be tracked, and it is remote only because the publisher's own delivery is stable and the file adds nothing to reproducibility that the pinned hash does not already give. The acts it discusses stay with their own families, and Part II of the study is not registered."

