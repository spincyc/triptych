notes = "This family owns the complete registered Douay-Rheims deposit, now the repository's standard witness for scriptural English: one translation work of the English College in exile, five materially distinguished editions, eighty-one artifacts, four segments, and ten passages. It is one family and not five because all five editions are states of a single translation whose differences are the whole point of registering them - the Rheims New Testament of 1582 and the Douay Old Testament of 1610 before Challoner, Challoner's revision of 1749-1752 in the Project Gutenberg eBook 1581 electronic state, the Baltimore John Murphy printing of 1914 as a print control on that e-text, and the eBible.org engDRA electronic form of the 1899 American edition as a textual control - so keeping them in one work family preserves the collation instead of scattering it across sibling rows. Seventy-eight artifacts are tracked: the exact Gutenberg source text, the seventy-three per-book verse tables derived from it, the collation table of the 1859 verses where the vendored Challoner text keeps an older reading against the settled American edition, and three project-created index tables (book index, psalm numbering, verse aliases) whose editorial authorship is recorded on their own manifests and which no consumer may cite as though they were the source. Three are remote: the Murphy 1914 Internet Archive OCR text and page-image PDF and the engDRA verse-per-line file. Rights were reviewed artifact by artifact and every one carries an affirmative basis - public domain by age for a 1582-1610 translation revised by a bishop who died in 1781, with Project Gutenberg's and eBible.org's own declarations recorded per file - so nothing is tracked on availability alone. The ceiling is passage-pin because ten Missal loci are verified verse by verse at Vulgate versification, and the four appendix segments (the Rheims preface to the reader, the explication of hard words, Jude, and Abdias in original spelling) are bounded extents of the Gutenberg file registered under the 1582 and 1610 editions they actually witness, which does not make that file part of those editions. Two identity gaps stay open and consumers must respect both: Project Gutenberg names no printing for its e-text, so the Challoner exemplar is not exactly identifiable and the Murphy 1914 agreement establishes structure rather than wording; and no complete text of the 1582 or 1610 originals is held, only those appendix samples. Loci are the Vulgate chapter and verse numbers the 1962 Missal cites, so a consumer matching a modern printed Bible must convert through the registered psalm-numbering and verse-alias tables. The Latin this version renders stays owned by family.scripture.vulgata-clementina-hetzenauer-1914, and family.scripture.vulgate-editions keeps the still-unresolved wider Vulgate cluster whose Douay-Rheims trace pattern this family now answers for canonical membership."

