notes = "Francis's post-synodal apostolic exhortation of 2 February 2020 owns its catalog-level work, the dated 2026-07-25 English Vatican web state with its exact restricted artifact, and verified passages at nn. 2-4 and 85-93. It stays per-work rather than clustering with the Synod's 2019 Documento final: the exhortation is an act of the papal magisterium and the final document a consultative synodal act of a different authority, the work manifest records that the exhortation presents the assembly's document without citing it, and neither manifest records a relation to the other, so the ledger's per-work norm for independent papal acts governs. The artifact manifest records a bounded negative finding of some consequence for consumers, that a case-insensitive literal search of the text extracted from those exact bytes found no occurrence of celibacy, celibate, viri probati, married men, ordain, or ordination, the only cognate being the phrase ordained ministers at n. 93; that finding is bounded by the searched delivery state and is not a claim about the Spanish original. The Spanish original, the Acta printing, and the other language expressions remain unregistered."

