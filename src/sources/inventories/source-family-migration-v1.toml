ost-nicene-fathers.series-2-volume-2", "work.nicene-and-post-nicene-fathers.series-2-volume-3", "work.nicene-and-post-nicene-fathers.series-2-volume-6", "work.nicene-and-post-nicene-fathers.series-2-volume-7"]
trace_patterns = ["Ante-Nicene Fathers", "Nicene and Post-Nicene Fathers", "\\b(?:ANF|NPNF)\\b"]
reviewed_on = "2026-07-27"
notes = "Treat ANF and NPNF as identified public-domain translation series and map each constituent work and volume; New Advent and other hosts are delivery routes, not identities. The series now owns catalog-level container work and edition records for ANF volume 3 (Tertullian's apologetic, anti-Marcionite, and ethical works), volume 4 (Tertullian's ascetic and disciplinary works with Minucius Felix, Commodian, and Origen), volume 6 (Gregory Thaumaturgus through Arnobius, Buffalo 1886), NPNF first series volume 1 (Augustine's Confessions and selected letters in the Pilkington and Cunningham translations, New York 1886), NPNF second series volume 6 (Jerome's letters and select works, New York 1893), and NPNF second series volume 14 (Percival's edition of the canons, definitions, and selected acts of the seven ecumenical councils, New York 1900), all registered without exact artifacts, so those members stop at edition-locus support while other legacy series citations differ, leaving the ceiling mixed. ANF volume 1 and its Justin and Irenaeus constituents stay owned by their separate bounded families, and the constituent works and translated editions printed within the registered containers remain unregistered. NPNF second series volume 1 (Eusebius's Church History in McGiffert's annotated translation with Richardson's Constantinian works, New York 1890) now joins the registered containers on the same catalog-level basis without an exact artifact; its Eusebian constituent works and translated editions remain unregistered. NPNF second series volume 11 (Sulpitius Severus, the Commonitory of Vincent of Lerins, and the works of John Cassian, Edinburgh: T. and T. Clark with the Christian Literature Company, New York, 1894) likewise joins the registered containers on the same catalog-level basis without an exact artifact, per the same container precedent; Vincent's Commonitory, Cassian's works, and the Roberts, Heurtley, and Gibson translations printed inside that volume remain unregistered constituent works, and Gibson's editorial introduction is cited as the volume editor's own reported witness. The wave-ten registrations add four further container works and editions on the same catalog-level basis, NPNF first series volume 7 (Augustine's Homilies on the Gospel of John, the Homilies on the First Epistle of John, and the Soliloquies in Gibb and Innes's translation, Buffalo 1888), NPNF second series volume 7 (Cyril of Jerusalem and Gregory Nazianzen, New York 1894), and NPNF second series volume 12 (Leo the Great and Gregory the Great in Feltoe's translation, New York 1895), together with NPNF second series volume 2 (the Church Histories of Socrates and Sozomen, New York 1890), which arrives with exact evidence: two remote public-domain page images and verified Socrates I.11 and Sozomen I.23 passages on Paphnutius. The already registered NPNF second series volume 14 also gains ten remote public-domain page images and nine verified passages, Nicaea canon 3, the Paphnutius section and Percival's quotation of Hefele's authenticity dispute, the Excursus on the Marriage of the Clergy, and the Trullo introductory note with canons 6, 12, 13, 30, and 48. Availability is therefore mixed rather than candidate-partial: some members now carry exact artifacts and pinned passages while others stop at edition loci. Percival's and Feltoe's editorial matter is cited as the volume editor's own reported witness and not as the councils' or fathers' text, and the constituent works and translated editions printed inside every registered container remain unregistered. Latin collections that are not part of Schaff's series stay outside this family: Mansi's conciliar collection and Migne's Patrologia Latina take their own container rows, and the Payne Smith and Allies translations take their own work rows. Wave eleven adds three further container works and editions on the same catalog-level basis, without exact artifacts and therefore at edition-locus support: ANF volume 5 (Hippolytus, the works and letters of Cyprian in Wallis's translation, the fragments of Caius, and Novatian, Buffalo 1886), ANF volume 9 (Menzies's supplementary volume with Keith's Clementine epistles and Patrick's Origen commentaries on Matthew and John, Buffalo 1896), and NPNF second series volume 3 (Theodoret's ecclesiastical history with the historical and biographical writings of Jerome, Gennadius, and Rufinus, Richardson translating Jerome's De viris illustribus, 1892). They join here rather than taking per-volume rows because they are containers of the same two Schaff series already mapped here, and the bounded exceptions stay bounded: only ANF volume 1, with its Justin and Irenaeus constituents, has its own family, and it has one because exact artifacts were registered for it. ANF volume 5 prints one recension of Cyprian's De ecclesiae catholicae unitate 4 and not the alternative recension, and Origen's Commentary on Matthew survives only in part in Greek; both are facts about those volumes that consumers state rather than facts about the series. The constituent works and translations printed inside all three remain unregistered."

