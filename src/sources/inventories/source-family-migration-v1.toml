notes = "The two documents of 22 February 1998, the Congregation for Catholic Education's Basic Norms for the Formation of Permanent Deacons and the Congregation for the Clergy's Directory for the Ministry and Life of Permanent Deacons, are registered as one work because the Holy See published them together under one joint declaration, that declaration is itself the source of the Directory's binding force as a general executory decree under CIC c. 32, and one Vatican delivery carries both with their separate note series. The family therefore owns that single work, the dated 2026-07-25 English Vatican web state, its exact restricted artifact, and verified passages at the joint declaration, Basic Norms nn. 36-38, and Directory nn. 61-62. It stays per-work on the ledger's precedent for independent curial acts rather than joining any celibacy corpus-plan; the acts it stands beside in the consuming article are not linked to it by any recorded relation. The delivery prints a corrupted word in Directory n. 61, authentic interpersonal relationships, OIC, recorded rather than repaired. The Latin and Italian originals, the printed edition, and the Acta printing remain unregistered."

