notes = "The Sacred Congregation for the Doctrine of the Faith's procedural norms approved by Paul VI on 24 February 1978 and dated 25 February 1978, owning their work and the dated 2026-07-25 Vatican English web state. They keep their own family for the reason already decided for family.holy-see.norms-supernatural-phenomena-2024 and restated in the Lourdes family: general legislation on the discernment of all presumed apparitions is not an act about any one apparition, and the apparition studies cite it as the governing framework, so it must not be absorbed into family.champion.ecclesial-acts even though the 2010 Green Bay decree was made under it. Its registered role is as the regime in force when that decree issued: the three-step path, the pro nunc nihil obstare formula, the positive and negative criteria and their indicative and cumulative character, the rule that permission of cult is not approval of supernatural nature, and the competences of the Ordinary, the conference, and the Apostolic See. Its own replacement is part of its identity and consumers state it. Evidence stops at edition and article loci: no exact artifact is registered and any capture of the copyrighted Vatican page would be restricted, which is the artifact gap; the Latin original and the question of when and in what form the text was first made public are the expression and language gaps, and this family makes no claim about either."

