canonical_ids = ["edition.william-bernard-ullathorne.holy-mountain-of-la-salette.london-richardson-1854-archive-web", "work.william-bernard-ullathorne.holy-mountain-of-la-salette"]
trace_patterns = ["(?:The Holy Mountain of La\\s+Salette|holy-mountain-of-la-salette)", "(?:Ullathorne|william-bernard-ullathorne)"]
reviewed_on = "2026-07-27"
notes = "The narrative of the Bishop of Birmingham's 1854 journey to Corps and the mountain, written with access to the diocesan documents of the 1847 inquiry and reproducing them in English translation, owns its container work at printed-page loci and the 1854 London Richardson imprint read in the public-domain Internet Archive scan. Following the container precedent decided for the Fatima DCF Selecao and applied to family.henri-lasserre.notre-dame-de-lourdes, the book's identity stays distinct from the diocesan act it carries: the mandement of 19 September 1851 and its ullathorne-1854-english reproduction edition are owned by family.la-salette.ecclesial-acts, while the book itself, its apologetic argument, and the documents it transmits - the depositions of Pierre Selme and Jean-Baptiste Pra signed 27 November 1847, the superioress of Corps's 1847 opinion of both children, the recital of the discourse in parallel French, patois, and English columns, the interrogation answers about the secret including the report that Melanie's was given in patois and Maximin's in French, and the 1850 Ars episode with Maximin's reported answers - stay here. It is a bishop's pilgrimage narrative, openly favourable to La Salette and apologetic in argument, not a critical edition, and consumers use it at that ceiling and name it when its translations are the only witness. The 1854 imprint is public domain (Ullathorne died 1889), but no exact artifact is registered, so evidence stops at edition and page loci; the OCR text was used for reading and search without page-image collation and is imperfect, printing 1840 where Pra's deposition requires 1846, and the French originals of the documents it renders are the unregistered expression gap."

