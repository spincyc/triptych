reviewed_on = "2026-07-27"
notes = "The twelve-page pamphlet of the priest I. Roubaud, an open letter of 18 July 1882 answering the Semaine religieuse d'Amiens communique of 25 June 1882 against the secret Melanie Calvat had published in 1879, owns its catalog-level work at printed-page loci and the second Louvain edition of 1882, printed by the same house as the 1881 reprint it defends and read in the public-domain Internet Archive scan. It is an independent partisan work by a named author, neither an ecclesial act nor a documentary edition, so it stays per-work rather than joining family.la-salette.ecclesial-acts or being merged with the booklet it defends: the relation its manifest records runs one way, from the reply to Melanie Calvat's imprint and to the 1915 decree, which is the independent-intellectual-work test applied in family.alba-house.trustful-surrender-to-divine-providence and family.edmundo-ogorman.destierro-de-sombras. Its evidentiary value lies entirely in what it concedes while defending - that opponents sought a condemnation at Rome, that the Congregation of the Index refused one, that the Holy Office took the matter up, that Cardinal Caterini's letter of 14 August 1880 conveyed the Holy See's displeasure and the desire that the booklet be withdrawn from the faithful 'si la chose est possible', that the author's party knew that letter only in translation and never saw the Latin original, and that the charge answered in 1882 was the non-conformity of the Lecce text with the text sent to Pius IX in 1851 - so consumers must keep that concessive character visible and must not read the pamphlet as evidence of approval. It carries no imprimatur, only the author's own submission to the judgment of the Apostolic See. Public domain by age; no exact artifact is registered, so evidence stops at edition and page loci. The scan's text layer is damaged in exactly the pages of evidentiary value, so pp. 8-10 were read in the page images on 2026-07-25; the first edition, said to have been sent to every cardinal and to the French hierarchy, has not been reached, which is the open edition gap."

