notes = "This corpus-plan owns the ecclesial judgment and reception thread on one object, the 1858 apparitions at the Grotto of Massabielle, mirroring family.fatima.ecclesial-acts: the Bishop of Tarbes's mandement of 18 January 1862 judging that the Immaculate Mary really appeared to Bernadette Soubirous and authorizing the diocesan cult (the competent positive diocesan judgment, retained in its historical formula under the 2024 norms), the Sacred Congregation of Rites' Urbis et Orbis decree of 13 November 1907 extending the feast of the Apparition to the universal Church in its ASS 40 edition, the canonization acts of Bernadette Soubirous of 8 December 1933 (rite, homily, and Litterae decretales) in their AAS 26 edition, and Pius XII's centenary encyclical Le pelerinage de Lourdes of 2 July 1957 in its dated 2026-07-25 Vatican English web state. The four acts, episcopal, dicasterial, and papal, form one family rather than per-work families because they are a single judgment-and-reception thread about one apparition event, each later act receiving and confirming the earlier ones, matching the Fatima and older-use-discipline-acts precedent for a bounded corpus of coordinated acts. The mandement's registered edition is its reproduction at pp. 397-409 of Lasserre's 1870 Notre-Dame de Lourdes - following the DCF-container precedent, this family owns the mandement work and that reproduction edition while the book container stays owned by family.henri-lasserre.notre-dame-de-lourdes - and that reproduction abridges articles 3-4, the 1862 diocesan imprint and Tarbes archive original being unconsulted, so an edition gap remains. Every member is registered at work and dated edition level only, so evidence stops at edition loci: the public-domain Internet Archive scan carrying the mandement is a complete remote candidate, the Holy See's ASS 40 and AAS 26 OCR scans would be stored restricted per the family.acta.aas-ass precedent with their material OCR defects recorded on the edition manifests (the elided garbled year clause of the 1907 decree; the canonization formula's 'exarationem' for 'exaltationem'), and any capture of the copyrighted Vatican web page would be restricted. The Acta container volumes stay owned by family.acta.aas-ass, and the general 2024 apparition norms keep their own family."

