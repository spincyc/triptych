notes = "The first canonical slice identifies Leonine volume 4 (1888), its exact remote Internet Archive PDF, and a tracked checked transcription and passage for I q.1 a.1 corpus opening. Rights review covers both known exact artifacts and leaves the remote PDF unresolved rather than treating review completion as clearance. Continue to keep other Leonine volumes, Latin printings, public-domain translations, and Corpus Thomisticum delivery artifacts separate at stable part-question-article loci. The family now also owns two dated 2026-07-25 web delivery states of the treatise on law, I-II qq. 90-97: the New Advent English presentation of the public-domain-era English Dominican translation (one exact restricted page artifact per question) and the Corpus Thomisticum Latin presentation the site identifies as the Leonine text (four exact restricted question-group page artifacts), with sixty verified passages pinning the cited corpus and reply loci in both expressions, including the I-II q. 90 a. 4 definition of law. Both hosts' electronic presentations carry copyright notices without established redistribution permission, so those exact bytes are restricted and not retained while the underlying texts are out of copyright; each artifact's reviewed rights basis is on its manifest, keeping the known-artifact rights review complete. Because the plan field cannot combine tracked with restricted storage, the plan keeps its remote, tracked, and unknown entries and the restricted treatment of the web deliveries is recorded on the artifact manifests, which remain controlling. No collation of either web text against the printed Leonine or Benziger pages is claimed."

