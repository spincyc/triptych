notes = "Fr Peter Pernin's memoir of the Peshtigo firestorm of 8 October 1871, which he survived in the river, owns its work and both Montreal printings of 1874, the French of Eusebe Senecal and the English of John Lovell, each read in a Canadian Institute for Historical Microreproductions scan on the Internet Archive. Two editions and not two works: they are the same author's same memoir in two languages of the same year, collated clause by clause by the consuming publication and substantively agreeing, with the recorded divergences (seven miles and a-half for deux lieues et demi, the tree sanctified by her apparent touch for l'arbre sur lequel s'est faite l'apparition, about six acres for six arpents) belonging on the edition manifests as translation facts. The book is a fire memoir, and its Appendix on Robinsonville is the second earliest located narrative of the Champion events and the only early witness to the 1871 preservation, which is why the family is historical-primary and separate from the apparition act and custodial families, on the same principle that keeps Lasserre's and Ullathorne's books outside the Lourdes and La Salette act families. Pernin declares his own abridgement, declines to call the preservation a miracle, and records that ecclesiastical authority had not yet spoken; a consumer must not upgrade him. Both 1874 imprints are public domain and their scans are remote, but no exact artifact is registered and evidence stops at printed-page loci, which is the artifact gap; the English OCR is badly damaged in one sentence of the fire passage at p. 99, where the consuming publication's reading is a marked reconstruction from the French plus surviving fragments and must stay marked."

