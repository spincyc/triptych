notes = "This corpus-plan owns the acts of and around the First Vatican Council: the dogmatic constitutions Dei Filius and Pastor aeternus, the convocation bull Aeterni Patris of 29 June 1868, and the suspension letter Postquam Dei munere of 20 October 1870. The two constitutions and the convocation bull have canonical work, dated Latin Vatican web edition, exact restricted artifact, and verified complete-text passage records; Postquam Dei munere's official Latin constituent is pinned to printed pages 65-67 of the shared restricted Acta Sanctae Sedis volume 6 OCR artifact, and that volume container and artifact stay owned by family.acta.aas-ass. English translations and other expressions remain unregistered, and Leo XIII's 1879 encyclical Aeterni Patris is a distinct work outside this family, so the convocation bull is traced only alongside its 1868-1869 dates."

