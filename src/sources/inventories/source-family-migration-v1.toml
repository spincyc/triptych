canonical_ids = ["edition.benedict-xvi.interview-flight-portugal-2010.english-vatican-web-2026-07-25", "edition.diocese-of-leiria.carta-pastoral-fatima-1930.dcf-selecao-2013", "edition.francis.act-consecration-immaculate-heart-2022.english-vatican-web-2026-07-25", "edition.francis.homily-canonization-fatima-2017.english-vatican-web-2026-07-25", "edition.holy-see.communique-third-secret-fatima-2016.english-press-vatican-web-2026-07-25", "edition.holy-see.message-of-fatima.english-vatican-web-2026-07-25", "work.benedict-xvi.interview-flight-portugal-2010", "work.diocese-of-leiria.carta-pastoral-fatima-1930", "work.francis.act-consecration-immaculate-heart-2022", "work.francis.homily-canonization-fatima-2017", "work.holy-see.communique-third-secret-fatima-2016", "work.holy-see.message-of-fatima"]
trace_patterns = ["(?:Act of Consecration.{0,60}Immaculate Heart|act-consecration-immaculate-heart-2022)", "(?:Carta Pastoral|carta-pastoral-fatima-1930)", "(?:Message of Fatima|Messaggio di Fatima|message-of-fatima)", "(?:Third Secret of Fatima|communique-third-secret-fatima)", "(?:canonization.{0,60}(?:Francisco|Jacinta)|homily-canonization-fatima-2017)", "(?:interview.{0,40}flight to Portugal|interview-flight-portugal-2010)"]
reviewed_on = "2026-07-27"
notes = "This corpus-plan owns the ecclesial judgment and reception thread on one object, the 1917 apparitions at the Cova da Iria: the Bishop of Leiria's pastoral letter of 13 October 1930 declaring the visions worthy of belief and permitting the cult (its registered edition is the critical printing in the 2013 DCF Selecao, Doc. 133, whose container stays owned by family.santuario-de-fatima.dcf-selecao-1917-1930), the CDF's documentary publication The Message of Fatima of 26 June 2000 with the third part of the secret and Ratzinger's commentary, the Press Office communique of 21 May 2016 confirming the publication complete, Francis's canonization homily for Francisco and Jacinta Marto of 13 May 2017, and his Act of Consecration to the Immaculate Heart of 25 March 2022. The acts form one family rather than per-work families because they are a single judgment-and-reception thread about one apparition event, each later act interpreting, confirming, or answering the earlier ones, matching the family.roman-missal.older-use-discipline-acts and family.vatican-ii.papal-acts precedent for a bounded corpus of coordinated acts. Every member is registered at work and dated edition level only: the known Vatican web deliveries and the restricted DCF printing are complete candidates, but no exact artifact bytes are registered, so evidence stops at edition loci; the 2000 dossier's English web state carries a double-encoding defect and a 1981 date slip recorded on its manifest, and Portuguese and Italian originals and translator identities remain unregistered. The general 2024 apparition norms are not a Fatima act and keep their own family. The wave-eleven review adds Benedict XVI's in-flight interview of 11 May 2010 on the way to Portugal in its dated 2026-07-25 Vatican English web state, and widens the label accordingly: the interview is not an act but ordinary papal teaching given to journalists and published by the Holy See among his speeches. It belongs here rather than in a family of its own because its third answer is a direct authoritative gloss on a member already in this family, the CDF's Message of Fatima of 26 June 2000: it restates the anthropology of apparition as a supernatural impulse expressed according to the capacities of the subject and refuses to confine the third part's vision to the attack of 13 May 1981, saying that an indication is given of realities involving the future of the Church. That is reception of the same object by the same authority, which is what this family records, and the per-work alternative would isolate a text whose whole significance is its bearing on the 2000 dossier. Like the other members it is registered at work and dated edition level only, with no exact artifact, so the family's edition-locus ceiling is unchanged; the Italian original, the printed Insegnamenti text, and the translators remain unregistered."

