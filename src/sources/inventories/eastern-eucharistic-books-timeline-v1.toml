note = "The title includes the liturgies of Chrysostom, Basil and the Presanctified gifts; a bounded original Greek witness is acquired in full as offered. Rome and Propaganda Fide are catalogue attributions. Physical completeness, the catalogue 128+100 extent and a direct relationship to the 1754 Euchologion are unresolved. Finisher evidence (2026-10-19): the BnF record cb39303242b transcribes the same Greek title, including the office of Holy Communion, with April of AM 7246 / AD 1738, so identity and date are not disputed. In the offered 202-image witness the first pagination reaches printed p. 91 at provider PP97 (end of the Presanctified Liturgy), followed by an unnumbered dismissal leaf at PP98, whereas BnF gives [2]-128-100 pages; the Sunday Apostle and Gospel readings named on the title were not located in the bounded inspection, so the witness may lack about 36 pages of the first series. Raes (Enciclopedia Cattolica VII, 1951) reports a nine-volume Roman reprint of Arcudius's Anthologion in 1738, and BnF catalogues four further April 1738 Greek office books attributed to Propaganda; whether this volume belongs to such a set is unestablished. Cold review (2026-10-19): the dismissal leaf at PP98 ends with the catchword Ἀπος, which points to Apostle readings that the offered witness does not carry before the second pagination begins at PP99; this strengthens the inference that the Sunday Apostle and Gospel series named on the title is missing from this witness. Charon (Chrysostomika, 1908, printed p. 560) calls this book the Roman edition of the three Liturgies of 1738 and reports that its prototype was the Venice Euchologion of 1727, on which Benedict XIV's commission also based the 1754 Euchologion; that reported common source is recorded without adopting graph ancestry and does not establish direct dependence between 1738 and 1754."
