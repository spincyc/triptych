locus = "Lists the Italo-Greek books printed at Rome or Grottaferrata: the three Liturgies (1601), the Liturgikon arranged like a plenary missal (1683), Horologia (1677 and 1772), a Psalter (1685), the small Euchologion (1831) and the Horologion of 1950. It also reports the Triodion of 1724 with a deliberately false Bologna imprint, the reprint of Arcudius's Anthologion in nine volumes in 1738, and the 1754 Euchologion with Ex quo primum. It further reports that from 1873 to 1902 all the Byzantine liturgical books except the Typikon were printed at Rome in 16 volumes, that the Horologion was resumed in 1937, and that an Archieratikon and a Hagiasmatarion were in preparation; its bibliography cites C. Korolevsky on the Roman edition of the Greek Menaia (Bollettino della Badia greca di Grottaferrata, 1949-1950)."
limitation = "A 1951 encyclopedia survey, read in translation; it gives Ex quo primum as 1 April 1756, while the Vatican text used by the inventory gives 1 March 1756, so the inventory date is kept. The original Italian columns were not checked."
