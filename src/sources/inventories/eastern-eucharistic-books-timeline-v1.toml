[coverage_limits]
book_set_limit = "Primary celebrant books are the focus. Epistle, Gospel, calendar, chant, proper and pontifical volumes are not exhaustively enumerated."
byzantine = "Greek 1754 selected-rubric borrowing and dual Roman Slavonic 1940/1941/1942 series distinguished. Russian-use 1953 supplement and medieval Latin/Slavonic parallels documented. Albanian and Macedonian source-book slots remain unresolved; Slovak reception of the shared Lviv 1905 book is source-described, while exact copies and later Roman implementation remain open. Bulgarian shared-recension link is intended audience only."
alexandrian = "Early Mark papyri, Aksumite collection and narrowed Or 6877 copy date added. 1945 Catholic Ge'ez substantive revision identified by liturgist, not book collation. Coptic 1898 remains an unverified exact-book lead."
armenian = "Holding catalogue verifies Armenian/Latin Rome 1642 Ordo before 1677/1823 line; direct succession unproved. Armenian textual borrowing evidence remains at recension/component level, not modern-book identity."
west_syriac = "Pampakuda 1934 contemporary bibliographic candidate identified; exact Syriac book remains unacquired. 1966 Malayalam scan and 2007 language-unresolved release are distinct. Early manuscript and Maronite prayer links do not prove wholesale book descent."
east_syriac = "1774 ordinary, 1775 lection composite, named 1845 exemplar, 1959 Latin Ordo and 1960 Latin proper/Syriac Taksa distinguished. Primary 1906 permissions identify rearrangements; exact earlier exemplars and complete revision chain remain uncollated."
ancestry = "Shared or collateral witnesses are labelled explicitly. No manuscript transmission graph, universal first edition, exact extinction chronology, or complete anaphora census established."
negative_claim_boundary = "Open means not settled by this bounded English/native-title web search and the particular institutional/catalogue pages cited, not unavailable worldwide."
next_steps = ["Obtain current Annuario Pontificio named Church enumeration and resolve Albanian slot discrepancy", "Collate source-language title pages, approbations, contents, calendars and rubrics before assigning substantive-version status", "Complete each Church coverage gap; do not fill missing source-book history with translation dates", "Trace exact shared manuscript relationships and extinct local uses without assuming a linear five-family genealogy", "Register acquired complete artifacts through owning source lane with hashes and exact rights layers", "Map ordinary, proper, lectionary, gospel, chant and pontifical dependencies", "Keep approved vernacular and lay translation chronology as later independent work"]
followup_boundary = "Two census slots remain without linked source-language candidate: Albanian and Macedonian. Slovak reception is now linked to the shared 1905 Lviv book through cited research; exact copies and later implementation remain unresolved. Malankara 1934 has contemporary bibliography only; Bulgarian actual receipt is unproved. No Church history or edition chain is complete."

[census]
coverage_slots = 23
status = "named-coverage-census-with-enumeration-discrepancy"
source_ids = ["census-sico-2007", "census-vatican-news-2025", "census-parenti-2022", "eritrea-2015-act"]
source_urls = ["https://www.vatican.va/roman_curia/congregations/orientchurch/sico/SICO_PDF/SICO%202007.pdf", "https://www.vaticannews.va/en/church/news/2025-05/rome-hosts-jubilee-of-eastern-churches-may.html", "https://www.ppoomm.va/content/dam/ppoomm/documentazioni/pubblicazioni/pubblicazioni-pum/libri/the-mission-of-the-universal-church-an-oriental-perspective/The-Mission-of-the-Universal-Church-An-Oriental-PerspectiveUUP.pdf", "https://www.vatican.va/content/francesco/la/apost_constitutions/documents/papa-francesco_costituzione-ap_20150119_ecclesia-metropolitana-asmarensis.html"]
method = "Use the 22 named coverage slots in SICO 2007 plus the Eritrean Church established in 2015; Vatican News in 2025 reports 23. The official-hosted 2022 scholarly chapter instead enumerates 22 and omits Albanian. Retain the Albanian slot with unresolved current classification. This reconciliation is not a directly inspected current Annuario Pontificio named list."
five_families = "Alexandrian; Antiochene/West Syriac; Armenian; Chaldean/East Syriac; Constantinopolitan/Byzantine. These are broad ecclesial categories, not a demonstrated five-node textual stemma."
genealogical_caution = "The 2022 chapter challenges a simple Alexandrian derivation for the Ethiopian tradition and treats Maronite origins separately. These category labels do not establish manuscript descent."
non_version_act = "The 2015 Eritrean establishment supplies Church identity evidence only; it is not a missal revision."

