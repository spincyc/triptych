# Project-created research metadata only; no source liturgical text.
# Coverage slots, witnesses, substantive versions, translations and acquisition are distinct.
audit_schema = 1
record_type = "eastern-eucharistic-books-timeline-research"
recorded_on = "2026-10-16"
research_scope = "agreed-current-traditions-shared-ancestry-extinct-local-uses"
completeness = "systematic-coverage-census-with-incomplete-edition-chronologies"
text_acquisition = "six-complete-scans-acquired; remaining-records-metadata-only"
source_schema_manifest = false
station_assignments = "not-made"
scope = "Eastern coverage census for present-day Catholic traditions, shared ancestry and extinct local uses; original liturgical-language service books first; not a complete edition catalogue"
evidence_ceiling = "Catalogue, institutional history, official acts and selected manuscript research inspected. Six historical provider-marked public-domain scans acquired and registered by the source lane: 2,024 PDF pages. Bounded title/approval leaves inspected; no complete transcription or book-to-book collation. Two further Bonn candidates have catalogue and access-route evidence only."
identity_model = "Church, rite family, recension, anaphora, translation, edition, printing, artifact and promulgating act are separate objects. These candidate IDs identify research rows, not canonical source works or history stations."
rights = "Project-created metadata and paraphrase only. Specific provider notices are recorded for acquisition candidates; they do not authorize publication of unrelated sources or modern editorial layers."
currentness_limit = "Checked on the recorded date; this is not a declaration that a book is currently obligatory in every territory or that no later edition exists."
governing_guidance = ["guidance/sources.md", "guidance/missals.md", "guidance/liturgical-text-publication-policy.md", "guidance/editorial.md", "guidance/repository.md"]
scope_status = "agreed"
chronology_policy = "Integer bounds represent only the explicitly identified event or witness date in chronology_kind, never the lifetime of a rite or inferred duration of use. Approximate centuries use stated calendar bounds and preserve the original wording; unknown dates have no numeric bounds."
coverage_link_policy = "Church candidate_ids identify checked relevant Catholic book/reform candidates; a common book may cover multiple Churches when reception evidence supports the mapping; ancestry_candidate_ids identify comparison witnesses, not proven lineal ancestors or approved Catholic editions. Empty candidate_ids are an explicit gap, not proof that no book exists."
version_count = "not-established; record count includes witnesses, printings, translations and acts-linked candidates, not a count of materially distinct versions"
recension_policy = "Recension designations require textual or authoritative evidence. The separate recension_research table distinguishes an explicitly named recension from a project research target; a Church or language alone does not establish one."
scope_questions_remaining = "Scope agreed. Exact manuscript transmission paths, extinct-use boundaries and exhaustive substantive-edition sequences remain research questions."
coverage_definition = "A version requires evidence of substantive changes to prayers, rubrics, calendar or order. A manuscript witness, printing date, script change, Church union, or institutional erection alone is not a new version. Keep historical liturgical-language books first; approved vernacular and lay translations form later independent work. Modern-language original composition remains in scope and must be distinguished from translation."
source_library_manifest_limit = "This inventory links canonical source-library identities; it is not itself a source artifact manifest. Scan acquisition does not establish checked transcription, complete structured contents, a substantive version boundary or edition-to-edition descent."

