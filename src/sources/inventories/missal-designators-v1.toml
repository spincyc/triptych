# Added 2026-11-14 on the maintainer's default: an order's or a diocese's
# edition receives a designator where the authority statement can be read on a
# copy the corpus holds or registers (a source-library edition, or a copy
# recorded by hash). The qualification names the statement's locus, never the
# liturgical text. A diocesan printing qualifies only as the missal of a
# distinct use, not as the Roman text with a local proper (guidance/missals.md
