# One affirmative designator for every coherent missal the corpus identifies.
#
# The owner of the display name. Every reader, CLI, generated metadata and
# prose use takes the name from here: `scripts/_missal_designators.py`
# validates it and derives the short form (the final comma-separated segment);
# `_calendars.index_header` and `_calendars.load_document` hand it to every
# calendar consumer, and `tools/tpt check-calendar-masses` refuses a calendar
# index that restates it. guidance/missals.md section 10 records the decision.
#
# A row is a coherent missal: a whole altar book whose normative identity the
# records establish through a recorded instrument or official record -- a
# declared typical edition, an emended reprint, a use's edition issued by its
# competent authority, or an approved translation or adaptation. A printing,
# lay missal, facsimile, critical edition, manuscript or partial book is a
# WITNESS: it keeps its bibliographic identity in the source library, appears
# here only under `witnesses`, and receives no designator.
#
# `designator` names what the book IS. Limits, cut-off dates, witnesses and
# inherited material belong in `qualification`. `key` is a stable opaque id
# (the recension catalog id where one exists); `calendar` is the reader's
# opaque calendar key, which is not a name and is never displayed as one.

schema = "triptych-missal-designators/v1"
as_of = "2026-11-14"

