[reconsideration]
triggers = [
  "An item supplies an identified historical printing and exact body boundaries.",
  "A rights holder supplies a grant covering the actual repository, PDF, and presentation surfaces.",
  "A particular translation or digital edition supplies an applicable license and required attribution.",
  "A textual comparison identifies modern additions or materially different wording in a retained candidate.",
  "The relevant jurisdiction or source conditions materially change.",
]
effect = "Review affected artifacts and consumers; do not mechanically clear a whole language or pontificate."
