"""
what_is_new_matter = """
The 1962 edition's own contribution, which 103(b) does NOT free and which this
project must not publish from this scan:

  -  The restored Holy Week of 1955 (Ordo Hebdomadae Sanctae instauratus): Palm
     Sunday through the Easter Vigil, wholly rewritten.
  -  The 1960 Code of Rubrics as printed in this book: the Rubricae generales
     Missalis romani at nn. 424-513 and the Additiones et variationes, together
