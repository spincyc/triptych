The 1962 edition is a revision of the 1920 typical edition of Benedict XV, which
is a revision of the 1900, descending through 1604 to the editio princeps of
1570. Four of those states are now TRACKED in this repository as public-domain
full text [recorded]: venice-1570, vatican-typica-1604, pustet-ratisbon-1862 and
vatican-typica-1920. Anything the 1962 book reprints from them carries no 1962
