# Whether this repository may do what it does with the CMAA facsimile of the
# 1962 Missale Romanum, settled once so that it is not settled again.
#
# TASK-114 reported that the scan this project collates against carries a
# CC BY-NC-ND 3.0 licence rather than a public-domain status. The report is
# right about the tag and wrong about what follows from it, and the three
# things it ran together have to be separated before any of them can be
# answered:
#
#   1. the rights in the SCAN, which is where the CC tag lives;
#   2. the rights in the BOOK the scan reproduces, which is a different
#      question with a different answer; and
#   3. what THIS PROJECT ACTUALLY DOES, which is the only question with a
#      practical consequence.
#
# guidance/sources.md:402-413 requires exactly this file: "Settle a recurring
# rights question once, in a rights record ... A rights position stated only in
# prose, in three places, in three wordings, is three positions." That is
# literally the state this question was in. It is stated in the artifact
# manifest as `unresolved`, in `missal-acquisition-audit-v1.toml` as
# `may_publish_text = "no"`, and in published prose at
# web/claude/liturgy/roman-rite/1962/propers/temporal/45-eighth-after-pentecost.md
# as "The 1962 Latin liturgical text is public domain and the project asserts no
# rights in it." Three positions, and the third is the one the public can read.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. It is the project's own reading, held to the same
# standard as any other claim here. Where it states a proposition of law it
# states the jurisdiction, and the jurisdiction throughout is the United States.

rights_schema = 1
record_type = "missale-romanum-1962-facsimile-rights"
recorded_on = "2026-08-01"
