the_artifact = "artifact.catholic-church.missale-romanum.vatican-typica-1920.missale-romanum-1920-text-aa646196. CORRECTED 2026-08-02: it is now `storage = \"remote\"`, `rights_status = \"unresolved\"`, and its 2,918,085 bytes are NOT on disk. It was tracked and public-domain when this record was written, on a pre-1931 basis that its own pages disprove; the payload was withdrawn from Git the same day and stays re-fetchable and hash-authenticated. The substitution argument below is unaffected, because it rests on 17 U.S.C. 103(b) and on what the 1920 text WITNESSES, not on where its bytes are kept [recorded]."

[the_1920_substitution.the_distinction]
text = """
A WITNESS AND A RIGHTS BASIS ARE DIFFERENT JOBS AND THE 1920 CAN ONLY DO ONE.

It cannot be the witness. The calendar's own rule is that a reading must come
from a page image and not from a text layer, because the text layer is the thing
under audit [recorded, roman-1962-seasonal-citation-collation-v1.toml:49-58]; the
1920 artifact is text-only, so "under the rule stated above it cannot supply a
reading for this calendar" [recorded, ibid. 122-143]. And it is a witness to a
DIFFERENT EDITION: its own record says it "is a witness to the state of the Roman
Missal that the 1962 edition revised, not to the 1962 edition" [recorded,
editions/vatican-typica-1920/edition.toml].

It can be the rights basis, and that is the job that was vacant. Where the 1962
page and the 1920 text agree, the 1962 facsimile establishes WHAT THE 1962 BOOK
PRINTS and the 1920 establishes THAT THE WORDS MAY BE PUBLISHED. Neither does
both. The pairing is what moves a transcription from an inference about the age
of a prayer to a recorded public-domain basis.
"""

