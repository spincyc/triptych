closes_open_question = "the-1962-contradiction, src/sources/inventories/lt-hist-rights-audit-v1.toml"
governs_artifact = "artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf"

holding = """
THE SCAN'S CC BY-NC-ND CONFERS NOTHING, AND THAT IS NOT THE GOOD NEWS IT LOOKS
LIKE. It was applied by a private uploader who is neither the rights holder nor
the scanner, over bytes in which no new copyright subsists under Bridgeman, and
the identical file sits on Internet Archive a second time under no licence at
all. A tag two strangers set differently on the same sha1 is not a grant. But
disposing of the tag removes the only instrument that would have PERMITTED
anything, and leaves the project standing on the underlying book's copyright
with no licence at all.

THE UNDERLYING 1962 TYPICAL EDITION IS PROBABLY PROTECTED IN THE UNITED STATES
UNTIL THE END OF 2057, by URAA restoration under 17 U.S.C. 104A. This record
does not find it public domain and the evidence does not support finding it so.
`unresolved` on the artifact therefore stands, and the reason it stands has
moved: it is no longer "nobody has looked" but "we looked, and the likely answer
is that it is in copyright."

WHAT SAVES THE PROJECT IS NOT A CLEARANCE BUT 17 U.S.C. 103(b). A new typical
edition's copyright "extends only to the material contributed by the author of
such work, as distinguished from the preexisting material employed in the work,
and does not imply any exclusive right in the preexisting material." Nearly
everything this project quotes out of the 1962 book -- the Canon, the Ordo
Missae prayers, the seasonal orations -- the 1962 book inherited verbatim from
typical editions long in the public domain, and this repository now TRACKS four
of them. The 1962 edition's own new matter is the 1955 Holy Week, the 1960 Code
of Rubrics, the sanctoral added after 1920, and its own front matter, and that
is the material the project must not publish from this scan.

THE BRIEF THAT COMMISSIONED THIS RECORD WAS WRONG ABOUT THE ONE FACT THAT
MATTERS MOST. It stated that the project publishes "no image and no Latin text
taken from it." Full Latin prayer texts read off this facsimile's page images
are published: the whole of Lauda Sion, the Corpus Christi Collect, Secret and
Postcommunion, the All Souls formularies and the Commune orations, in
`src/sources/calendars/roman-1962/propers.yaml` and in `web/`. The project does
act (b). See `[[corrections]]` `no-latin-is-published`.
"""

