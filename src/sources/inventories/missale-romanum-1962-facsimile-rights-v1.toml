# --- What would change the answer ---------------------------------------------

[what_would_change_the_answer]
note = "Stated concretely, so that a later reader can attack this record on its own terms rather than re-deriving it."
items = """
  1.  A GRANT FROM SOMEBODY WHO HAS ONE. A statement from the Libreria Editrice
      Vaticana, or from CMAA if CMAA in fact holds anything, would move the
      artifact off `unresolved` in a single step. Nothing in the chain of custody
      has ever purported to grant anything, so this is the shortest route and
      nobody has walked it.

  2.  A HOLDING THAT 104A(h)(6)(B) EXCLUDES WORKS NEVER PROTECTED IN THE SOURCE
      COUNTRY, together with a finding that the Missale was a text of an official
      act under Italian l. 633/1941 art. 5 as applied in Vatican City in 1996.
      Both are needed; either alone does nothing. This is the strongest route to
      a public-domain finding and it is set out at
      `[the_underlying_edition.the_official_acts_argument]` at full strength.

  3.  EVIDENCE OF SIMULTANEOUS UNITED STATES PUBLICATION within thirty days of
      the Vatican publication, which would defeat restoration under
      104A(h)(6)(D). This record infers the contrary from the edition structure
      and did not verify it against a physical copy.

  4.  THE PASSAGE OF TIME, WHICH RUNS THE OTHER WAY FOR ONCE. The Vatican term
      expires at the end of 2032 (seventy years from 1962 under Law N. CXCVII
      art. 5); the restored United States term at the end of 2057. Neither is
      near, and the second is what governs here.

  5.  A CHANGE IN THE PROJECT'S ACTS. If this repository ever publishes a page
      image from this facsimile, or transcribes the 1955 Holy Week or the 1960
      rubrics out of it, the analysis at `[the_three_acts]` does not cover the
      new act and this record must be reopened before the act, not after.

  6.  PASSAGE RECORDS OVER THE 1920. The basis this record assigns the 1920 is
      sound but presently unexercised: ZERO passage records exist for that
      edition, and its own artifact says "Quote from this artifact only through a
      checked passage" [recorded]. Until those exist, the 103(b) pairing is an
      argument rather than an apparatus.

Note what does NOT change it: the presence or absence of a Creative Commons tag
on any Internet Archive item, a public-domain mark on any of them, the continued
availability of the CMAA download, or a successful re-download. guidance/sources.md:399-400
holds that availability and successful download are insufficient, and this record
relies on neither.
"""

