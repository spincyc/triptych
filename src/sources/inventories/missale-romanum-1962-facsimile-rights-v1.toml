[the_underlying_edition]
question = "Independently of any scan, is the 1962 Vatican editio typica of the Missale Romanum in copyright in the United States?"
answer = "PROBABLY YES, TO THE END OF 2057, by restoration under 17 U.S.C. 104A. This record finds no public-domain basis and does not manufacture one."
the_book = "Missale Romanum ex decreto SS. Concilii Tridentini restitutum, Summorum Pontificum cura recognitum, editio typica, declared typical by decree of the Sacred Congregation of Rites of 23 June 1962 [recorded, guidance/missals.md:44-66, read at the facsimile's own p. 2], published at Vatican City by Typis Polyglottis Vaticanis."

[the_underlying_edition.us_formalities]
what_happened = """
The book carries no copyright notice: guidance/missals.md records that the
facsimile shows none across all 54,807 extracted lines [recorded]. For a work
published in 1962 that is decisive under the 1909 Act as ordinarily applied --
publication without notice forfeited United States copyright.

There is a contrary line for works first published abroad: Twin Books Corp. v.
Walt Disney Co., 83 F.3d 1162 (9th Cir. 1996), held that foreign publication
without notice did not inject a work into the United States public domain. It is
a minority position and it is not needed here.
"""
why_it_does_not_matter = """
BOTH BRANCHES END IN THE SAME PLACE, WHICH IS WHY THIS RECORD DOES NOT HAVE TO
CHOOSE. On the ordinary branch the work fell into the public domain in 1962 for
want of notice, and 17 U.S.C. 104A(h)(6)(C)(i) restores works that are in the
public domain through "noncompliance with formalities imposed at any time by
United States copyright law, including failure of renewal". On the Twin Books
branch the work had United States copyright from 1962, its renewal fell due in
1990, and the Copyright Renewal Act of 1992 made renewal automatic only for works
first copyrighted from 1964 -- so an unrenewed 1962 work lapsed in 1991, which is
again failure of renewal and again within 104A(h)(6)(C)(i).

Restoration was automatic on 1 January 1996 for Berne-source works. It is what
governs on either branch.
"""

[the_underlying_edition.uraa_conditions]
note = "Worked through element by element, because the conclusion runs against this project's convenience and should be attackable."
eligible_country = "The Holy See acceded to the Berne Convention on 12 September 1935 [sourced, Wikimedia Commons Copyright rules by territory/Vatican City, fetched 2026-08-01; also recorded at guidance/missals.md]. An eligible country under 104A(h)(3)."
author_nationality = "104A(h)(6)(D) requires an author who was, when the work was created, a national or domiciliary of an eligible country. The Sacred Congregation of Rites is an organ of the Holy See. Satisfied."
first_publication = "104A(h)(6)(D) also requires first publication in an eligible country and no United States publication within the following thirty days. The typical edition was published at Vatican City. Benziger's New York printings iuxta typicam are SEPARATE EDITIONS under separate United States registrations, not simultaneous publication of this one. THIS IS AN INFERENCE FROM THE EDITION STRUCTURE AND WAS NOT VERIFIED AGAINST A PHYSICAL COPY."
not_expired_in_source_country = "104A(h)(6)(B) excludes works in the public domain in the source country through expiration of term. On 1 January 1996 a 1962 Vatican publication was thirty-four years old against a seventy-year term. Not expired."
term_if_restored = "104A(a)(1)(B) gives the remainder of the term the work would have had. For a work published in 1962 that is ninety-five years from publication: 31 DECEMBER 2057."

[the_underlying_edition.the_official_acts_argument]
what_it_is = """
THE ONE ARGUMENT THAT COULD DEFEAT RESTORATION, STATED AT ITS STRONGEST BECAUSE
IT IS THE ARGUMENT THIS PROJECT WOULD WANT TO WIN.

Vatican Law N. CXCVII is of 2017 and cannot govern what was protected in 1996.
What governed in 1996 was the Italian Copyright Act, l. 633 of 22 April 1941,
applied in Vatican City on a supplementary basis by virtue of the 1929 Law on
Sources of Law [sourced, Wikimedia Commons Copyright rules by territory/Vatican
City, fetched 2026-08-01]. Article 5 of that Act provides that "the provisions of
this Law shall not apply to the texts of official acts of the State or of public
administrations, whether Italian or foreign" [sourced, WIPO Lex and cyberlaws.it,
fetched 2026-08-01].

If the Missale Romanum was a text of an official act of the Holy See, then on
1 January 1996 it was not protected in its source country at all, and the case
for restoration is at least awkward.
"""
why_it_probably_fails = """
Three reasons, and the first is fatal on the statute's own words.

  1.  104A(h)(6)(B) EXCLUDES ONLY WORKS IN THE PUBLIC DOMAIN "THROUGH EXPIRATION
      OF TERM OF PROTECTION". A work that never had a term because its
      subject matter was excluded is not in the public domain through expiry of
      one. On the literal reading the condition is satisfied and the work is
      restored. The argument needs the statute to say something it does not say.

  2.  ARTICLE 5 IS READ NARROWLY. It reaches laws, decrees and administrative
      documents. A missal is a book of prayers, chants, lessons and rubrics. The
      DECREE that declares it typical is plausibly an official act; the 1,088
      pages the decree introduces are not obviously one, and Italian practice
      also preserves protection in the "elaborazione e forma di presentazione"
      of such texts even where the substance is free [sourced].

  3.  THERE IS NO SUBJECT-MATTER ROUTE EITHER. 104A(h)(6)(C)(ii), the
      lack-of-subject-matter-protection limb, is confined on its face to "sound
      recordings fixed before February 15, 1972" [sourced,
      law.cornell.edu/uscode/text/17/104A, fetched 2026-08-01]. A printed book
      cannot enter through it, so the argument has nowhere to go but (B), where
      reason 1 stops it.

  4.  THE HOLY SEE IS NOT VATICAN CITY STATE. Article 5 speaks of official acts
      of the State. The Missale was issued by a dicastery of the Holy See, a
      distinct sovereign subject, and the Holy See has asserted copyright in its
      own publications continuously -- through LEV, and through the decree of
      31 May 2005 vesting in LEV the exclusive financial rights over the
      documents by which the Supreme Pontiff exercises his Magisterium
      [recorded, guidance/missals.md].

Vatican Law N. CXCVII art. 2 now extends copyright expressly to "the texts of
laws and official acts published, in whatever form, by the Holy See", with a
seventy-year term from first fixation under art. 5 [sourced, vaticanstate.va and
ULSA bulletin 26, fetched 2026-08-01; also recorded at guidance/missals.md].
That is 2017 law and does not reach the 1996 test date, but it settles the
present-day position in the source country: 1962 plus seventy is the end of 2032,
and the "it is an official act, therefore free" route is closed at home as well.
"""
disposition = "RECORDED AS THE STRONGEST ROUTE OUT AND NOT TAKEN. It would need a court to read 104A(h)(6)(B) as covering works never protected, AND a finding that a missal is an official act of the State. This project does not build a publication basis on two contested readings stacked."

[the_underlying_edition.the_limit_that_actually_matters]
statute = "17 U.S.C. 103(b)"
text = """
"The copyright in a compilation or derivative work extends only to the material
contributed by the author of such work, as distinguished from the preexisting
material employed in the work, and does not imply any exclusive right in the
preexisting material. The copyright in such work is independent of, and does not
affect or enlarge the scope, duration, ownership, or subsistence of, any
copyright protection in the preexisting material."

Quoted verbatim from 17 U.S.C. 103(b) [sourced, law.cornell.edu/uscode/text/17/103,
fetched 2026-08-01]. THE SECOND SENTENCE IS THE STRONGER ONE FOR THIS RECORD: the
1962 edition's copyright does not "affect or enlarge the ... duration" of any
protection in the preexisting material. Whatever the 1962 edition is, it did not
restart a clock on the Canon.
"""
application = """
THIS IS THE FINDING THAT DOES THE WORK, AND IT SURVIVES EVERY BRANCH ABOVE. Even
on the least favourable reading -- the 1962 typical edition fully restored and in
copyright until 2058 -- that copyright reaches only what the 1962 edition
CONTRIBUTED. It gives no exclusive right in the preexisting material, and the
