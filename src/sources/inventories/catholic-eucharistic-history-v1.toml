[[comparisons]]
id = "cistercian-1606-1657-offertory-constituents"
kind = "parallel-liturgical-unit-comparison"
membership_status = "established"
basis = "Complete source-bounded offertory constituents within the 1606 Præparationes ante Missam and 1657 Ordo Missæ. The 1606 combined paten/chalice offering is compared with the 1657 separate offerings, water prayer, incense prayers, Lavabo and later Suscipe Trinitas. All included rubrics and response cues retain their source order. This aligns a liturgical function, rather than identifying every prayer as the same composition."
apparatus_caveat = "Each complete declared constituent has its own source boundaries and normalization; neither is a complete Ordinary or Missal. The 1657 extent includes its final Secreta/preface posture rubric; the 1606 extent ends with the Dominus sit response. Printing dates do not establish first introduction of every change. Institutional revision does not establish direct descent between these exact copies; both native versions have no Git parents or text inheritance. The earlier selected-prayer comparisons retain their narrower scope."
