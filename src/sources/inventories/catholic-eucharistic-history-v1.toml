source_ref = "src/sources/inventories/eastern-eucharistic-books-timeline-v1.toml#byz-greek-1754"
basis = "Ex quo primum §§8–9 identifies four prefatory monita added to the new book, including directions for commemorations. This establishes a rubrical addition at book level; §17 describes earlier obligations, so the underlying commemoration practice is not dated to 1754. No full textual collation."
