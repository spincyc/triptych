[[classifications]]
id = "western:ambrosian-1981-latin"
substantive_status = "substantive-established"
source_ref = "src/sources/inventories/eucharistic-stages/ambrosian.json#ambrosian-ward-1996"
basis = "Ward supplies edition-specific comparisons for the Latin 1981 Sanctoral prefaces: the Nativity-of-John preface is shortened and reordered, the Passion-of-John preface is replaced, and the Sebastian preface is replaced. His quoted predecessor and successor loci establish substantive prayer changes, rather than publication date alone."
scope = "Selected Latin Sanctoral prefaces in the 1981 published book; replaces the earlier unestablished classification, without dating first introduction to 1981."
evidence_level = "scholarly-description"
stage_dossier_ref = "src/sources/inventories/eucharistic-stages/ambrosian.json"
stage_transition_ids = ["ambrosian-nativity-preface-revision"]
stage_source_ids = ["ambrosian-ward-1996"]
source_urls = ["https://www.cultodivino.va/content/dam/cultodivino/rivista-notitiae/1990/notitiae-32-(1996)/Notitiae-357-1996.pdf"]
locus = "pp. 242–244; pp 241–242/PDF 63–64; pp 266–267/PDF 88–89"
limitations = "Three selected Sanctoral preface comparisons are described by Ward; none is an independent collation of the original altar books. No immediate 1902-to-1981 whole-book succession, complete-book inheritance or first-introduction date is established. Ward distinguishes 1902 abstersit from 1954 abstulit, so the quoted 1954 predecessor must not be silently labelled 1902 wording. The Nativity-of-John preface is shortened/reordered; the Passion-of-John preface is replaced; Sebastian’s replacement is distinct from reuse of older related material as a Common-of-Martyrs collect. The source receipt and corrected transition record article-page image inspection on 2026-10-17."
classification_review_caveat = "The article-page image check on 2026-10-17 establishes the scholarly description; independent altar-book collation remains open."
source_inspection_dates = ["ambrosian-ward-1996 = 2026-10-17"]

