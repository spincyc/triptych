[[comparisons]]
id = "brightman-1896-greek-basil-chrysostom-anamnesis-oblation"
kind = "parallel-liturgical-unit-comparison"
membership_status = "established"
basis = "The complete bounded priestly anamnesis with its offering continuation in the Basil and Chrysostom liturgies, as actually printed in Brightman 1896. The original Greek texts were independently checked against the exact retained pages. The paired liturgical functions and explicit prayer boundaries establish comparison membership; shared wording and variants do not establish borrowing direction or a common ancestor."
apparatus_caveat = "The witnesses are mediated by the 1896 editorial collection. Modern Basil and Chrysostom derive from the source-described Venice 1869 text; Greek James is attributed to Paris gr. 2509, with its stated date corrected to the fifteenth century in the edition’s corrigenda. Source typography marks scriptural quotations, and speech-block/rubric normalization is explicitly recorded. No Catholic reception, original composition date or date of textual introduction follows from this comparison."
source_refs = ["artifact.frank-edward-brightman.liturgies-eastern-and-western.1896-oxford-clarendon-volume-1.ia-pdf-254f7d21", "passage.frank-edward-brightman.liturgies-eastern-and-western.1896-oxford-clarendon-volume-1.basil-anamnesis-oblation", "passage.frank-edward-brightman.liturgies-eastern-and-western.1896-oxford-clarendon-volume-1.chrysostom-anamnesis-oblation"]

