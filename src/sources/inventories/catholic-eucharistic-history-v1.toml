[[comparisons]]
id = "dominican-1550-1604-suscepimus-collect"
kind = "parallel-liturgical-unit-comparison"
membership_status = "established"
basis = "The complete printed collect entries in two Suscepimus Deus formularies perform the same liturgical function but are different compositions: Deus cuius providentia in 1550 and Largire nobis in 1604. The named formulary supplies the pairing anchor. The earlier heading is Dominica octava after Trinity; the later heading is Dominica sexta after the octave of Trinity. No identical numbered Sunday is assumed."
apparatus_caveat = "Only the selected collect entries have been transcribed and independently checked, not the entire formularies or books. Each is one continuous priestly block. Printed shortened conclusions Per. and Per Dominum nostrum. are retained without supplying a doxology. Abbreviations, long s, u/v, ae ligatures and line layout are normalized as declared in the artifacts. The separate retained pages establish the changed Gospel and Sunday heading; those observations are not represented as full Gospel transcriptions. Printing dates do not date the introduction of the changes; intervening editions and immediate ancestry remain unestablished."
source_refs = ["passage.order-of-preachers.missale.1550-venice.suscepimus-collect", "passage.order-of-preachers.missale.1604-rome-xavierre.suscepimus-collect", "passage.order-of-preachers.missale.1550-venice.suscepimus-folio-125r", "passage.order-of-preachers.missale.1604-rome-xavierre.suscepimus-page-238"]
[comparisons.left]
text_set = "dominican-1550-suscepimus"
unit_ids = ["unit.dominican-1550-suscepimus.suscepimus-collect"]
record_id = "latin-missal:praedicatorum-venetiis-1550"
[comparisons.right]
text_set = "dominican-1604-suscepimus"
unit_ids = ["unit.dominican-1604-suscepimus.suscepimus-collect"]
record_id = "latin-missal:praedicatorum-xavierre-1604"

[[comparisons]]
id = "carmelite-1574-1621-october-05-calendar"
kind = "parallel-liturgical-unit-comparison"
membership_status = "established"
basis = "The same bounded printed October 5 calendar row is compared in two Carmelite missals. In 1574 the date numeral is present and its feast cell is empty; the normalized body is therefore only 5. In 1621 the cell names Teresa, duplex minus, with Placidus and companions commemorated and page reference 409. Calendar entries are explicitly typed as calendar rows, not spoken prayers."
apparatus_caveat = "This is one dated calendar cell, not a claim that Teresa is absent from every part of the 1574 missal or that the whole calendar has been collated. Other computistical columns are omitted. The 1621 printed date remains October 5 and is not modernized to October 15. Abbreviations, ampersands and the cōm. macron are preserved; e-caudata/ligature and long s are normalized as declared. The printed common-Mass reference at p.409 is separately retained, with manuscript alterations excluded. Exact introduction date, chapter intervention and immediate textual ancestry remain unestablished."
source_refs = ["passage.carmelite-order.missale.1574-venice-giunta.october-05-calendar-entry", "passage.carmelite-order.missale.1621-venice-giunta.october-05-calendar-entry", "passage.carmelite-order.missale.1574-venice-giunta.october-calendar", "passage.carmelite-order.missale.1621-venice-giunta.october-calendar"]
[comparisons.left]
text_set = "carmelite-1574-october-calendar"
unit_ids = ["unit.carmelite-1574-october-calendar.october-05-calendar-entry"]
record_id = "latin-missal:carmelitarum-venetiis-1574"
[comparisons.right]
text_set = "carmelite-1621-october-calendar"
unit_ids = ["unit.carmelite-1621-october-calendar.october-05-calendar-entry"]
record_id = "latin-missal:carmelitarum-capitulum-1621"

