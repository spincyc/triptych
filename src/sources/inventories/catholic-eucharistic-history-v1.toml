[[classifications]]
id = "eastern:alex-coptic-1898"
substantive_status = "substantive-established"
source_ref = "src/sources/inventories/eucharistic-stages/alexandrian.json#alexandrian-stages-lietzmann1926"
basis = "Lietzmann explicitly contrasts Tuki 1736 with Cairo 1898: the intercession, printed within the earlier Cyril anaphora, is placed before all anaphoras with alterations. The original 1736 loci were checked; the 1898 arrangement is scholarly-described."
scope = "Placement of the intercession in the Coptic-Arabic Eucharistic book; exact altered words and first introduction date remain unresolved."
evidence_level = "scholarly-description"
stage_dossier_ref = "src/sources/inventories/eucharistic-stages/alexandrian.json"
stage_transition_ids = ["alexandrian-stages-coptic1736-1898-intercession"]
stage_source_ids = ["alexandrian-stages-lietzmann1926", "alexandrian-stages-tuki1736"]
source_urls = ["https://archive.org/details/MesseUndHerrenmahlEineStudieZurGeschichteDerLiturgie", "https://digitale-sammlungen.ulb.uni-bonn.de/content/titleinfo/253288"]
locus = "Printed p. 12, opening paragraph; Part II pp. 272, 277, 282 and 287–290"
limitations = "The original 1736 placement is checked at bounded pages, while the 1898 relocation and re-edition’s dependence on Tuki remain scholarly descriptions by Lietzmann and Chaîne. The mixed comparison is therefore classified at scholarly-description level. Exact altered words and the date when relocation first entered the line remain unproved."
source_inspection_dates = ["alexandrian-stages-lietzmann1926 = 2026-10-16", "alexandrian-stages-tuki1736 = 2026-10-17"]

[[classifications]]
id = "eastern:arm-1677-liturgia"
substantive_status = "substantive-established"
source_ref = "src/sources/inventories/eucharistic-stages/armenian.json#armenian-eucharistic-stages:ordo1642"
basis = "The directly inspected 1642 Ordo passes from the Western-form Creed ending directly to the doxology; the 1677 Lyturgia prints the Armenian-form Creed and Nicene anathema before that doxology."
scope = "Creed structure in the celebrant Lyturgia, native p. 8; the complementary Ministerium is not promoted by this evidence."
evidence_level = "text-collated"
stage_dossier_ref = "src/sources/inventories/eucharistic-stages/armenian.json"
stage_transition_ids = ["armenian-eucharistic-stages:creed1642-1677"]
stage_source_ids = ["armenian-eucharistic-stages:ordo1642", "armenian-eucharistic-stages:rome1677", "armenian-eucharistic-stages:ohanjanyan2020"]
source_urls = ["https://books.google.com/books?id=ct5lAAAAcAAJ", "https://books.google.com/books?id=ZYYB9ymm0iAC", "https://societyforarmenianstudies.com/wp-content/uploads/2025/05/JSAS-Vol-27-1.pdf"]
locus = "Printed p. 48; Native p. 8; p. 39, nn. 119–121"
limitations = "This is a bounded comparison of published states. It does not prove that the entire 1677 edition was revised directly from the 1642 printing. Ohanjanyan’s 1646 citation remains a bibliographic discrepancy but is no longer the sole basis for the 1642 reading. Exact complete Creed transcription and normalization remain undone."
source_inspection_dates = ["armenian-eucharistic-stages:ordo1642 = 2026-10-17", "armenian-eucharistic-stages:rome1677 = 2026-10-17", "armenian-eucharistic-stages:ohanjanyan2020 = 2026-10-16"]

[[classifications]]
id = "eastern:byz-sinai-slav-nf5"
substantive_status = "substantive-established"
source_ref = "src/sources/inventories/eucharistic-stages/byzantine.json#byzantine-stages:miklas"
basis = "Miklas identifies a passage absent in the main Apollinaris copy and a later Demetrius diptych addition naming Mastal, Petrunia and Romald. This establishes a substantive prayer-layer difference within one dispersed manuscript witness, at scholarly-description level."
