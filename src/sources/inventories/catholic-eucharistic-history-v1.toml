[[comparisons]]
id = "roman-sanctus-stowe-and-cummiskey-1861"
kind = "same-prayer-witness-comparison"
membership_status = "established"
basis = "Complete sanctus units selected by their incipit, bounded ending and liturgical position. Each body was checked against the identified printed page; the alignment is explicit same-prayer witness membership, not a text ancestry edge."
apparatus_caveat = "The witnesses are mediated by their identified printed editions. Printed edition dates do not date introduction, borrowing or a common ancestor. Native words, spelling, accents and case remain in each normalized source; typographic or punctuation normalization is declared per owning artifact. Warner's italic expansion type is flattened and ligature sorts expanded; specified compound punctuation is represented by colons. The facsimile, not that editorial encoding, controls diplomatic punctuation. Stowe includes its printed Christological continuation through per dominum and begins with two Sanctus acclamations. Cummiskey's unit is its complete printed Sanctus. The comparison preserves the difference in extent rather than trimming the continuation to inflate similarity."
source_refs = ["passage.catholic-church.stowe-missal.warner-1915-vol-2.sanctus", "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.praefationes-la"]
