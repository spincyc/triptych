[[comparisons]]
id = "roman-canon-memento-wilson-r-and-cummiskey-1861"
kind = "same-prayer-witness-comparison"
membership_status = "established"
basis = "The complete Memento for the living in Wilson's 1915 Gregorian main text, printed page 2, is aligned with the ordered Memento and Et omnium blocks of Cummiskey's 1861 Canon. The latter's intervening English-only rubric is not part of the Latin prayer. Joining those two maintained blocks with one space is a comparison operation, not a change to their source identities. Wilson follows R (Reginae 337), with other manuscript readings in the apparatus; this is comparison through a critical edition, not direct manuscript collation or asserted descent."
apparatus_caveat = "Wilson page 2 note 6 already reports pro quibus tibi offerimus vel in O (Ottobonianus 313). Its presence in Cummiskey and absence from Wilson's main text do not establish a nineteenth-century introduction. Printed edition dates, represented manuscript dates and the unknown date of a textual change remain separate. Orthographic and punctuation differences are preserved, not counted automatically as substantive revisions."
source_refs = ["artifact.catholic-church.sacramentarium-gregorianum-hadrianum.wilson-1915.ia-pdf-96fd93c7", "artifact.eugene-cummiskey.roman-missal-english-laity.philadelphia-1861.canon-missae-la"]

[comparisons.left]
record_id = "western:gregorian-wilson-1915-critical-edition"
text_set = "wilson-1915-gregorian-canon-memento"
unit_ids = ["unit.wilson-1915.gregorian.canon-missae.memento-vivorum"]

