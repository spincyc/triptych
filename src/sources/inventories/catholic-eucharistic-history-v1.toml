[[comparisons]]
id = "carmelite-1574-1621-october-05-calendar"
kind = "parallel-liturgical-unit-comparison"
membership_status = "established"
basis = "The same bounded printed October 5 calendar row is compared in two Carmelite missals. In 1574 the date numeral is present and its feast cell is empty; the normalized body is therefore only 5. In 1621 the cell names Teresa, duplex minus, with Placidus and companions commemorated and page reference 409. Calendar entries are explicitly typed as calendar rows, not spoken prayers."
apparatus_caveat = "This is one dated calendar cell, not a claim that Teresa is absent from every part of the 1574 missal or that the whole calendar has been collated. Other computistical columns are omitted. The 1621 printed date remains October 5 and is not modernized to October 15. Abbreviations, ampersands and the cōm. macron are preserved; e-caudata/ligature and long s are normalized as declared. The printed common-Mass reference at p.409 is separately retained, with manuscript alterations excluded. Exact introduction date, chapter intervention and immediate textual ancestry remain unestablished."
source_refs = ["passage.carmelite-order.missale.1574-venice-giunta.october-05-calendar-entry", "passage.carmelite-order.missale.1621-venice-giunta.october-05-calendar-entry", "passage.carmelite-order.missale.1574-venice-giunta.october-calendar", "passage.carmelite-order.missale.1621-venice-giunta.october-calendar"]
