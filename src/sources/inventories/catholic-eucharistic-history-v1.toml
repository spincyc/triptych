[[presentation_groups]]
id = "servites"
label = "Servite Order"
families = ["Servites"]
note = "BAV Pal. lat. 505 describes a Servite witness; OSZK cites a 1745 proper, Notitiae attests the 1971 proper approval, and Baroffio PDF p. 230 identifies both 1998 volumes. Original 1998 front matter remains unexamined. Source IDs: additional-orders-src-servite-pal505, additional-orders-src-servite-1971-approval, additional-orders-src-servite-bibliography, additional-orders-src-servite-oszk-1745. Presentation grouping only; no independent recension or parentage asserted."

[[presentation_groups]]
