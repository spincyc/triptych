label = "Order of Mercy (Mercedarians)"
families = ["Mercedarians"]
note = "USUARIUM book 8573 and 8574 separate 1507 and 1560 missal reports; Biblioteca Virtual de Madrid identifies the 1617 supplement; Notitiae records 1976 proper confirmation. A title or bound supplement is not recension proof. Source IDs: additional-orders-src-merced-1507, additional-orders-src-merced-1560, additional-orders-src-merced-1617, additional-orders-src-merced-1976. Presentation grouping only; no independent recension or parentage asserted."

[[presentation_groups]]
id = "santiago-military"
label = "Military Order of Santiago"
families = ["Santiago military"]
note = "USUARIUM origin 890 indexes Santiago books; IEC study printed p. 73 calls the 1560 print the third missal and cites a 1536 authorization letter and 1541 Uclés inventory for an earlier edition. The Andalusian thesis p. 116 supplies the BNE MS 931 manuscript lead. Earlier print exemplars and the direct BNE record remain uninspected. Source IDs: additional-orders-src-santiago-usuarium, additional-orders-src-santiago-iec, additional-orders-src-santiago-thesis. Presentation grouping only; no independent recension or parentage asserted."

