[[comparisons]]
id = "cistercian-1606-1657-canon-constituents"
kind = "parallel-liturgical-unit-comparison"
membership_status = "established"
basis = "Complete declared Canon constituents in the independently collated 1606 and 1657 witnesses. The 1606 strict Canon span contains its five seasonal Communicantes forms and Easter/Pentecost Hanc igitur; the 1657 selection includes five Communicantes and two separately printed Hanc igitur forms, their headings and governing cues from the preceding preface section, followed by the main Canon. Each side retains its own physical source order and complete declared wording, including rubrics. This aligns a liturgical function without treating every rubric or paragraph division as the same composition."
apparatus_caveat = "The 1606 extent is printed sequence 190–197 (the fourth page is misnumbered 192); the 1657 extent is discontiguous proper-form blocks on printed 176, 177, 181, 183, 184 plus the Canon title and main 203–213, ending before Oremus/Pater. Other preface texts and all other book divisions are excluded. Different physical placement does not establish abolition of the seasonal forms. Source spelling, accents, punctuation and rubric segmentation retain their declared normalizations; unequal unit counts do not establish substantive ritual revision or an introduction date. Both native Canon versions remain parentless: Roman reception and institutional revision do not yet identify the exact predecessor textual states. No whole-book completeness or text inheritance is claimed."
