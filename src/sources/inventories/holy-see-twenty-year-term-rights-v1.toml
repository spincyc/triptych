# Whether a Holy See publication first issued in Vatican City between 1931 and
# 1975 was "restored" in the United States by 17 U.S.C. 104A, settled once so
# that it is not settled again.
#
# On 1 January 1996 -- the date 104A tests -- the copyright law in force in
# Vatican City was the Italian Copyright Act, l. 633/1941, as received by
# Vatican Law N. XII of 12 January 1960. That Act gives a work created and
# published under the name and at the expense of a public body a term of twenty
# years from first publication. If that term reached the Holy See's own
# publications, every such work first published 1931-1975 had already expired
# at home on the test date, and a work already in the United States public
# domain for want of a formality was never restored.
#
# This record OWNS that holding. Every other page that speaks to the United
# States status of twentieth-century Holy See publications points here rather
# than restating it (guidance/sources.md, "Settle a recurring rights question
# once"). It is text-free: it contains no liturgical wording, and statute text
# is quoted only where the holding turns on it.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. Jurisdiction throughout: the United States. Evidence
# labels: [verified] read on 2026-11-14 from bytes fetched that day (sha256
# given); [sourced] from a cited secondary source fetched that day; [recorded]
# from a tracked repository record; [inference] reasoning, never evidence.

rights_schema = 1
record_type = "holy-see-twenty-year-term-rights"
recorded_on = "2026-11-14"
jurisdiction = "United States"
status = "adopted"
basis_token = "qualified-public-domain"
policy_basis = "guidance/liturgical-text-publication-policy.md section 1, priority 6: ambiguous but defensible basis -- prefer publication, document the argument, mark the basis explicitly"
confidence = "medium-low"
civil_law_status = "defensible-not-adjudicated"
supersedes_in_part = [
  "src/sources/inventories/missale-romanum-1962-facsimile-rights-v1.toml [the_underlying_edition] (its United States term finding, for the 1962 edition's own 1931-1975 matter)",
]

[decision]
decided_on = "2026-11-14"
decided_by = "the maintainer"
instruction = "if the italian copyright holds, apply it"
reading = """
The decision of record. The research put to the maintainer (lane r2-rights,
2026-11-14; its memo, renewal sweep and fetched evidence stayed in campaign
scratch and are restated here so that this record stands alone) found that the
route HOLDS WITH LIMITS: defensible as a policy section 1 priority-6 basis, not as
a priority-1 public-domain finding, confidence medium-low. The instruction is
applied exactly that far: within the limits L1-L5 below, under the explicit
token `qualified-public-domain`, and nowhere else.

It reverses a recorded rights position -- the 1962 facsimile record's finding
that the 1962 typical edition is "probably protected in the United States until
the end of 2057" -- for the 1931-1975 Holy See matter this record covers. Under
the publication policy a reversal of a recorded rights position is the
maintainer's decision and belongs in a rights record; this is that record. A
further reversal, in either direction, is likewise the maintainer's and must be
recorded here with its date.
"""

holding = """
A HOLY SEE PUBLICATION FIRST PUBLISHED IN VATICAN CITY IN 1931-1975 THAT WAS
ALREADY IN THE UNITED STATES PUBLIC DOMAIN FOR WANT OF A FORMALITY WAS ARGUABLY
NOT RESTORED BY 17 U.S.C. 104A, BECAUSE ITS SOURCE-COUNTRY TERM HAD EXPIRED BY
1 JANUARY 1996. This is a defensible basis, not an adjudicated or a probable one:
confidence medium-low that a United States court would so hold, high that the
statutes say what is quoted below. It is published on the explicit, visible
token `qualified-public-domain`, never as `public-domain`.

The chain. Every link is statute text read from fetched bytes except link 4.

  1.  17 U.S.C. 104A(h)(6)(B): a restored work "is not in the public domain in
      its source country through expiration of term of protection". For a source
      country adhering to Berne the date of restoration is 1 January 1996
      (104A(h)(2)(A)); the source country of a published work is the eligible
      country of first publication (104A(h)(8)(C)). The Holy See has adhered to
      Berne since 12 September 1935 (Copyright Office Circular 38a).
  2.  On 1 January 1996 Vatican City applied "la legislazione dello Stato
      italiano" on copyright by force of Law N. XII of 12 January 1960, art. 1,
      "in quanto" not contrary to divine law, the general principles of canon
      law or the 1929 Treaty and Concordat, and so far as "ivi applicabile".
      Its art. 2 applies copyright protection to "i testi delle leggi e degli
      atti ufficiali pubblicati dalla Santa Sede e dallo Stato della Città del
      Vaticano"; its art. 3 repeals the copyright reception of the 1929 Law on
      the sources of law. Law XII stood until Law N. CXXXII of 19 March 2011.
  3.  That legislation was l. 633/1941. Art. 11: "Alle Amministrazioni dello
      Stato, al Partito Nazionale Fascista, alle Provincie ed ai Comuni spetta il
      diritto di autore sulle opere create e pubblicate sotto il loro nome ed a
      loro conto e spese", with the same right for non-profit private bodies and
      for academies and other public cultural bodies. Art. 29: the duration of
      the rights held under art. 11 "è di vent'anni a partire dalla prima
      pubblicazione, qualunque sia la forma nella quale la pubblicazione è stata
      effettuata". Art. 199 applies the Act to works published before it.
      Arts. 5, 11 and 29 were never amended: normattiva gives each, as in force
      on 1 January 1996, as the text in force since 18-12-1942.
  4.  [INFERENCE -- THE DECISIVE LINK] As received "in quanto applicabile" in
      Vatican City, art. 11 reached works created and published under the name
      and at the expense of the Holy See and its Curia. Support: Law XII art. 2
      places Holy See publications inside the received regime, and the only
      rule the Act has for a work published under a public body's name at its
      expense is art. 11 with art. 29; Law CXXXII of 2011, art. 5, re-enacted
      art. 11's "sotto il loro nome" pattern for the Holy See and Vatican City
      and, in its section 4, art. 29's operative phrase "qualunque sia la forma
      nella quale la pubblicazione è stata effettuata" with seventy years for
      twenty -- naturally read as lengthening a term the legislator understood
      to apply. Italian administrative practice and Wikimedia Commons read
      arts. 11 and 29 as a twenty-year term for ITALIAN public bodies; they say
      nothing of the Holy See. No Vatican judgment or doctrine applying or
      refusing art. 29 for the Holy See was located.
  5.  Hence, on that inference, a work first published 1931-1975 had a source
      term that ended no later than 31 December 1995 (art. 30: terms in years
      run from the year of publication, fractions of a year to the author, and
      for periodicals from the end of each year) and was not restored. If it
      was in the United States public domain through a formality, it stays
      there.

Where the inference is not needed [inference from the same statutes]: if
art. 11 did NOT reach the Holy See, a liturgical text published without an
individual author's name is an anonymous or collective work, fifty years from
first publication (arts. 26-27 as received in 1960). That term too had ended by
31 December 1995 for works first published 1931-1945. The decisive link is
therefore load-bearing for 1946-1975 publications, which include everything
of the 1950s, the 1955 Holy Week and the 1962 typical edition.
"""

