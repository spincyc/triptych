  "The Missale Romanum editio typica of 1962 (Typis Polyglottis Vaticanis) for its own new matter first published in it -- the 1960 rubrics as printed, post-1920 sanctoral formularies first published there -- with the Twin Books risk of L3 live, because the book carries no notice [recorded, guidance/missals.md].",
]
first_publication_rule = """
