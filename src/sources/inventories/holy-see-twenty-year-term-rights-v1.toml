[limits]
L1_years = "First publication 1931-1975 inclusive. 1975 has zero margin: twenty years from a 1975 publication ends no later than 31 December 1995 on any counting [inference from art. 29 and art. 30, 'le frazioni di anno giovano all'autore']. 1976 and later fail."
L2_body = "Created and published under the name AND at the expense of the Holy See or Vatican City (art. 11 wording), first published in Vatican City. A Typis Polyglottis Vaticanis imprint or an AAS printing is taken as satisfying this [inference]; the expense limb was not separately evidenced for any item."
L3_us_formalities = """
This record only removes RESTORATION. The work must independently be in the
United States public domain: (i) published abroad without a United States
notice -- the majority rule and the Copyright Office's reading; or (ii) published
1931-1963 with a notice and never renewed. A 1964-1977 publication with notice is
protected (automatic renewal). In the Ninth Circuit, Twin Books Corp. v. Walt
Disney Co., 83 F.3d 1162 (9th Cir. 1996), treats a foreign-language work
published abroad without notice as UNPUBLISHED in the United States, so neither
the formality lapse nor this record applies there; Cornell's chart (last updated
1 January 2026) lists that special case -- "Published in a language other than
English, and without subsequent republication with a copyright notice" ->
"Treat as an unpublished work" -- and says it "may apply in the rest of the
country" [verified]. This is the largest residual risk for the no-notice items,
the 1962 typical edition among them.
"""
L4_simultaneous = "104A(h)(6)(D): a United States publication within 30 days of the Vatican one takes the work out of 104A altogether; then United States notice and renewal alone decide, and an unrenewed 1931-1963 United States printing leaves the text public domain without this record. Not a bar in itself. No Vatican first-publication date was verified. The one United States Latin-and-English Holy Week printing found (Benziger, A237569, 21 Feb 1956) is unrenewed; the first United States restored-Holy-Week printings bear 14 February - 21 March 1956 notice dates [verified, CCE], against a decree of 16 November 1955."
L5_canonical = "This record addresses United States civil copyright only. The canonical permission norms (Postquam Summus Pontifex n. 3; can. 826 section 3) are governed by liturgical-text-publication-policy.md section 8.1 and are untouched. The Holy See's present-day ownership claims (PSP n. 2; the 2005 Secretariat of State decree) are not answered here: they speak to current Vatican law and to canonical permission, not to the 1996 source-country term."
L6_derivatives = "An English translation is a derivative of its Latin (Copyright Office Circular 14: 'The copyright in a derivative work covers only the additions, changes, or other new material'; 'The unauthorized adaptation of a work may constitute copyright infringement' [verified]). Where this record frees the Latin, a United States English translation is free only if its own copyright lapsed (unrenewed 1931-1963 registration, or published without notice), one printing at a time; it is then carried as `qualified-public-domain` with notices.english_carried. A project study translation over Latin admitted here stays `project-created` and carries notices.english_study. Where this record does not apply, an unrenewed English translation of protected Latin still reproduces protected matter."

# ==============================================================================
# THE COUNTER-ARGUMENTS, AND WHAT WOULD OVERTURN THE HOLDING
# ==============================================================================

[against]
note = "Stated at strength, ranked, because the holding is medium-low and a reader must be able to attack it on its own terms."
items = [
  "1. Art. 11 may not reach the Holy See. No authority applies or refuses art. 29 for it (WIPO Lex, Commons, Ius Ecclesiae and web searches found none). The only located doctrinal commentary (J. C. Riofrío Martínez-Villalba, Ius Ecclesiae 24 (2012) 209-232) never mentions arts. 11 or 29 and says 'La legislación vaticana nunca había fijado un plazo de protección', pointing to Berne art. 7 [sourced]. Art. 11 names Italian public-law categories; the Holy See is not Vatican City State; and Law CXXXII art. 5 section 2 had to DEFINE 'Santa Sede', which can be read as filling a gap. If so, 1946-1975 items were not expired on 1 January 1996 and were restored.",
  "2. Twin Books, for every no-notice foreign-language publication (L3).",
  "3. A 1964-1977 notice on a given printing (excluded by L3; decisive for the 1970 and 1975 editions).",
  "4. A RENEWED United States printing within 30 days of the Vatican publication (L4). None found.",
  "5. Art. 11's 'expense' limb is unproven per item; Italian doctrine mostly treats creation (art. 6) as the original title and art. 11 original ownership as a minority reading [sourced, Riofrío], which a court could use to narrow art. 11.",
  "6. For 1931-1959 items the received law before 1960 was the 1925 Italian decree (official acts in the public domain; anonymous works fifty years, no State-works term); l. 633 reached them only through art. 199 from 1960 [verified text; application inference].",
  "7. Law XII art. 1 receives Italian law only so far as it is not contrary to the general principles of canon law and is applicable in Vatican City; one could argue a short term over the Church's liturgical books is inapplicable. No source argues it.",
  "8. A United States court must find Vatican law under FRCP 44.1 with no Vatican precedent; expert evidence could go either way.",
]

[what_would_overturn_it]
items = [
  "The 2010 Relazione illustrativa to Law CXXXII (cited by Riofrío; not public), a Vatican judgment, or an authoritative Vatican commentary stating that arts. 11/29 of l. 633/1941 did not reach Holy See publications before 2011. The general received terms would then govern (fifty years from publication for anonymous or collective works), and 1946-1975 works were not expired in 1996.",
  "A reading that art. 11 confers only exploitation rights for twenty years after which individual authors' own rights revive (art. 29's second sentence provides such a reversion only for academies' communications; its first sentence provides none).",
  "A United States court adopting Twin Books outside the Ninth Circuit, or a showing that a given item was published with a United States-effective notice and renewed (or, for 1964-1977, published with notice at all).",
  "Evidence of a RENEWED United States publication within 30 days of a Vatican first publication.",
  "Evidence that a given item was first published outside Vatican City, or not under the Holy See's name and at its expense.",
]
what_does_not_overturn_it = [
  "Vatican Laws N. CXXXII (2011) and N. CXCVII (2017), which fix seventy years: 104A tests the source-country status on 1 January 1996, and a later source-country term does not restore a United States copyright.",
  "Present-day claims of the Holy See or LEV (the 2005 Secretariat of State decree; Postquam Summus Pontifex n. 2; the 2002 edition's APSA notice): they speak to current Vatican law and canonical permission, not to the 1996 source-country term of a 1931-1975 work.",
  "The l. 633/1941 art. 5 'official acts' route, which missale-romanum-1962-facsimile-rights-v1.toml refused. This record does not use it, and Vatican Law XII art. 2 independently closes it: from 1960 Vatican law applied copyright protection to the texts of the Holy See's laws and official acts.",
  "Internet Archive tags, the absence of a work from the Copyright Office's online catalog, or the availability of a download.",
]

