[reception]
note = "Corrects the reception history the 1962 facsimile record stated; see that record's [[corrections]] id holy-see-twenty-year-term-2026-11-14."
periods = [
  "1929-1960. Law N. II of 7 June 1929 on the sources of law: art. 3 receives the Kingdom's laws 'in via suppletiva' as in force at its date, so far as applicable; art. 20 c) n. 2 receives the Italian legislation then in force on 'la proprietà artistica e letteraria' [verified, WIPO Lex typed transcription, not the AAS Supplement facsimile]. The Italian law in force on 7 June 1929 was R.D.L. 7 November 1925 n. 1950 (official acts in the public domain, art. 7; life plus fifty, art. 26; anonymous works fifty years from publication, art. 29; no State-works term) [verified, normattiva at 1929-06-08]. l. 633/1941 did NOT reach Vatican City under the 1929 law.",
  "1960-2011. Law N. XII of 12 January 1960: art. 1 receives the Italian copyright legislation; art. 2 protects Holy See and Vatican City official texts; art. 3 repeals art. 20 c) n. 2 of the 1929 law; art. 4 in force on publication [verified, page image]. l. 633/1941 with arts. 11, 29 and 199 governs. THIS IS THE LAW ON 1 JANUARY 1996. Whether the 1960 reception was static or dynamic (Riofrío and a 2011 L'Osservatore Romano account relayed by the SDB archive both say static) does not matter: arts. 5, 11 and 29 were unchanged throughout.",
  "2009. Law N. LXXI on the sources of law (in force 1 January 2009): Italian legislation is received only 'previo recepimento'; no change to copyright [verified, Ius Ecclesiae transcription].",
  "2011-2017. Law N. CXXXII of 19 March 2011: art. 2 official texts protected 'in qualunque forma'; art. 5 sections 1-4 copyright of the Holy See and Vatican City in works 'create o pubblicate sotto il loro nome o realizzate per loro conto', 'Santa Sede' defined to include the dicasteries and organisms of the Roman Curia, SEVENTY years from the year of first publication; art. 8 repeals all earlier copyright provisions [verified, page images].",
  "2017-. Law N. CXCVII of 1 September 2017, in force 1 October 2017: same arts. 1, 2 and 5 (seventy years) [verified].",
]
