gives publisher `apud Ioannem Variscum, & haeredes Bartholomaei Faletti, &
socios` and NO PLACE. That consortium's name is the one associated with the
Rome first edition, so a lane that stopped at the catalogue would have recorded
this as the editio princeps -- a reference that resolves successfully and
wrongly, in the exact shape guidance/the-shape.md section 1 describes.

The whole OCR text layer was fetched and its colophon read. It says, with its
blackletter OCR damage:

  YENE TIUS / zipud 3oannem Aarifcum et heredes / Bartho iFaletti Socios. /
  zinno $omint. / z MODLSESX.

That is `VENETIIS apud Ioannem Variscum et heredes Bartholomaei Faletti Socios,
Anno Domini M.D.LXX.` The title page independently reads `CVM PRIVILEGIIS.
vENETI` [verified]. Venice, not Rome. The book is a genuine 1570 witness and is
not the editio princeps, and the difference took one whole-file retrieval to
establish.
"""
priority = 3
priority_basis = "Useful. A legible-colophon 1570 witness with a complete text layer, worth having as the earliest datable printing actually in hand, but it is not the book the station names."
evidence = "verified"

