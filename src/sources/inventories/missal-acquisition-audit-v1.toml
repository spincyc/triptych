# --- Deferred: the Eastern Catholic books -----------------------------------

[[deferred]]
id = "eastern-catholic-liturgical-books"
label = "The liturgical books of the Eastern Catholic Churches"
status = "flagged, not attempted"
why_deferred = """
It is a different problem in four ways at once, and attempting it inside a
missal audit would produce a list that is wrong in all four:

1. THE BOOK IS NOT A MISSAL. The Eucharistic liturgy in these Churches is not
   carried by a single altar book analogous to the Missale Romanum. The
   equivalents are distributed across several books, and the vocabulary differs
   by tradition. A row keyed on `missal` will find nothing and record an
   absence.
2. THE ACT MODEL DIFFERS. A Roman typical edition is declared `typica` by a
   Roman congregation. Eastern books are promulgated through a patriarchal or
   synodal authority together with the Holy See, and this audit has established
   NOTHING about how those instruments are shaped, dated or published. Applying
   the Roman act vocabulary to them would be an assertion, not a finding.
3. THE LANGUAGES ARE NOT LATIN. Retrieval, search and OCR quality all change,
   and this project's raw-line search is a literal one.
4. THE COUNT IS REPORTED AND NOT VERIFIED. A research pass reports TWENTY-THREE
   sui iuris Eastern Catholic Churches, grouped into five liturgical traditions
   -- Alexandrian, Armenian, Byzantine, East Syriac, West Syriac -- and notes
   that the figure is sometimes given as twenty-four depending on whether the
   Latin Church is counted, with the canonical enumeration ultimately resting on
   the Annuario Pontificio, which was NOT reached [reported]. The number is
   recorded as a lead. It is not `verified` and must not be printed as settled.

SCOPE IT SEPARATELY. The right first deliverable is not an inventory but a
single sourced page establishing the list of Churches, the name of the principal
eucharistic book in each tradition, and the promulgating authority -- and only
then a search.
"""
do_not = "Do not extend this file to cover them. A Roman-shaped row about an Eastern book is a reference that will resolve successfully and wrongly."
starting_points = """
Reported, not verified, and worth having so the separate track does not start
from nothing [reported]:

- THE PROMULGATING AUTHORITY IS ONE BODY. The Dicastery for the Eastern
  Churches, whose competence is set out in Praedicate Evangelium arts. 82-87,
  and whose own page cites CCEO can. 657 to the effect that all liturgical texts
  to be published are always submitted to its recognitio or approval.
- THE BOOK NAMES DIFFER BY TRADITION, which is the first reason a missal-shaped
  search fails. Byzantine: the Divine Liturgy of St John Chrysostom or of St
  Basil, carried in the Hieratikon, the Sluzhebnik, the Archieratikon, within
