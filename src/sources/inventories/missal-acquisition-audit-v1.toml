# ===== Group: the Latin uses and orders =====================================
#
# Every book in this group descends from the exempting clause of Quo primum,
# not from the general command. The existing act history draws that fork and
# then records that it holds no witness for any of them, calling the branch
# `honestly empty`. THIS GROUP IS WHAT FILLS IT.
#
# One structural finding governs the whole group and is stated once here rather
# than repeated on every row. THESE LINES HAVE THEIR OWN PROMULGATING ACTS, and
# those acts are not papal. They are decrees of a general chapter and orders of
# a master general, a prior general or an abbot -- and, unlike the Roman line,
# the act is very often printed ON THE TITLE PAGE, in the `iussu editum` clause.
# Three read here at the bytes:
#
#   Carthusian 1679  `ex ordinatione capituli Generalis. Anno Domini
#                    M.D.CLXXVII. Celebrati sub R. P. D. Innocentio le Masson
#                    Priore Cartusiae ac totius eiusdem ordinis generali`
#   Carmelite 1621   `Capituli Generalis decreto ... Et reuerendissimi prioris
#                    generalis magistri Sebastiani Fantoni Romani iussu`
#   Dominican 1604   `Sub r.mo P.F. Hieronymo Xauierre Caesaraugustano, totius
#                    praefati Ordinis Generali magistro recognitum & emendatum,
#                    & auctoritate Apostolica approbatum & confirmatum`
#
# So the act rule extends to these lines without modification, and the cost of
# establishing a station is LOWER here than in the Roman line, because the
# catalogue record often carries the instrument. That is the opposite of what
# this audit expected before it looked.

