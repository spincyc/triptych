[[corrections]]
id = "cmaa-facsimile-licence"
severity = "medium"
target = "artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf, rights_status unresolved"
target_says = "`rights_status = \"unresolved\"`, on the ground that no artifact-level statement establishing redistribution rights was located."
finding = """
The audit did not close the question and did SHARPEN it, which is the useful
outcome. Three hosts serve what are demonstrably the same bytes, and they
disagree:

  host                                          bytes         licence asserted
  media.musicasacra.com/pdf/missale62.pdf       82,815,941    none on the file
  archive.org/details/missale_romanum-1962      82,815,941    CC BY-NC-ND 3.0
  archive.org/details/missale-romanum-1962-...  82,815,941    none

All three sizes are identical and the first matches the registered SHA-256
exactly [verified]. So ONE artifact carries three different rights labels
depending on where it is fetched from.

Two observations that bear on TASK-114:

- The CC BY-NC-ND is applied at an Internet Archive item whose `creator` field
  names the Church Music Association of America. That names the SCANNER, not
  necessarily the uploader, and an uploader-applied licence is an assertion by
  whoever filled in the field, not a grant by a rights holder.
- Whatever the digitisation's status, the UNDERLYING BOOK is a 1962 typical
  edition of the Holy See. A licence on a scan cannot enlarge what may be done
  with the text inside it.

So the licence does not resolve `unresolved`, and a lane that treated it as
permission would be relying on a stranger's dropdown for a rights claim about
the Holy See's book.
"""
consequences = "None applied. The recommendation is that `unresolved` STANDS, and that TASK-114 be answered `the CC BY-NC-ND is an uploader assertion on a third-party scan and confers nothing` rather than left open."
status = "recommendation only; no record changed"

