counts_note = """
`books_that_are_stations = 0` is an assertion under test, not a tally. It is the
model's central rule -- the station is the act, never the book -- expressed as a
number that must stay at zero. If a later edit sets `station = true` on any book
row, this count moves and the rule has been broken visibly rather than quietly.

`retrievable_whole = 23` of 32 is the audit's most encouraging figure and its
most misleading one, so read it with `may_publish_yes = 15` and
`may_publish_conditional = 1`. Nearly three quarters of these books can be READ
in full today; sixteen may be PUBLISHED from, one only after the title-page
confirmation its row names. The newly registered Mame printing is one of the
unconditional fifteen, but its public-domain historical text is not by itself
evidence that a postconciliar target-edition prayer is identical.

`retrievable_not_located` first fell from 6 to 4 during the audit. Two rows had
been written
`not-located` on the strength of an Internet Archive search alone, and the books
were at the Bibliotheque nationale de France the whole time. Later, the object
formerly treated as the whole 1920 typical edition was proved to be a later
composite. That disqualification did not itself search for a replacement, so
the exact 1920 impression is `unresolved`, as is the 1971 reimpressio that was
discovered by reading rather than searching. The separate 1922 Mame conformed
printing became a new `whole` row, and the whole count therefore stays 23.
`[[corrections]]` `not-located-verdicts` and `1920-witness-identity` record the
movements. Treat every remaining `not-located` as provisional on the same
ground: each one now names the repository searched, and none of them names every
repository there is.
"""

# --- Recommended acquisition order ------------------------------------------

[acquisition_order]
principle = """
Ordered by what each acquisition SETTLES, not by chronology and not by what is
easiest to download. Three rules produced this order:

1. Prefer a book that closes a gap the existing record already admits, over a
   book that adds a new area. A flagged gap is a debt; a new area is an
   expansion.
2. Prefer a book whose rights permit publication, where two books would settle
   the same question, because a cite-only acquisition cannot be shown to a
   reader.
3. Do not acquire a book to answer a question no record is currently asking.
   guidance/act-histories.md ends by warning against enlarging the corpus, and
   that warning is still in force: this order is deliberately short at the top.
"""

step_1 = """
THE 1956 ORDO HEBDOMADAE SANCTAE INSTAURATUS. The 1955 reform carries 34 of the
42 departures in the existing act history, and that history reads it entirely
from the AAS decree and from missal OCR -- never from the reformed rite's own
book. It is the thinnest point in the strongest part of the record.
Cite-only, and access-restricted at the only host found, so the first task is
finding an open copy rather than downloading one. `ordo-hebdomadae-sanctae-1956`.
"""

step_2 = """
THE 1900 TYPICAL EDITION. It is the single `via_unrepresented` edge in the whole
Holy Week graph -- the one place the record admits it crosses a station it does
not hold. It is pre-1931 and therefore publishable, and the 1920 decree naming
it as parent has been read here, so the target is exactly identified.
`missale-romanum-1900-typica`.
"""

step_3 = """
THE 1884 INSTRUMENT, VIA THE 1889 DESCLEE PRINTING. Not a scan acquisition but a
READING: the printing is already whole and fetchable, its title page names Leo
XIII's authority, and the audit's largest `unrecorded` is that act. Cheapest
gap-closure in the file. `missale-romanum-1889-desclee`, act `editio-typica-1884`.
"""

step_4 = """
THE 1975 EDITIO TYPICA ALTERA. The only postconciliar typical edition with no
whole witness anywhere -- what exists is the Ordo Missae alone, three orders of
magnitude too small. A 1970-to-2002 comparison that skips it silently
misattributes 1975's changes to 2002. Cite-only. `missale-romanum-1975-typica-altera`.
"""

step_5 = """
THE FIRST USE, AND IT SHOULD NOW BE BRAGA. Revised during the audit. The
exempt-uses line has been a root with nothing after it since it was drawn, and
Braga is the cheapest thing that ends that, because it is the only row in the
file where BOTH the book and its promulgating acts are in hand and publishable:
a whole 1924 typical edition, pre-1931 and therefore printable, and two
instruments -- a bull of Pius XI of 8 December 1924 and a Congregation of Rites
decree of 9 December 1924 -- now read at the bytes and recorded in `[[acts]]`.

A complete station-plus-witness pair for a non-Roman use is exactly what the
empty branch needs, and nothing else in this file offers one.
`missale-bracarense`. Sarum remains the best CRITICAL text and the Ambrosian is
now the highest-priority rite; both follow.
"""

step_6 = """
THE ROME 1570 EDITIO PRINCEPS, or an explicit refusal. The project's 1570
station currently hangs on a witness its own record calls unchecked, and this
audit could not find the Rome printing. Either it is found, or the fact that two
passes failed is written down as a settled negative. `missale-romanum-1570-rome`.
"""

not_now = """
Deliberately NOT in the order, with reasons, because an acquisition order that
does not say what it refuses is a wish list:

- The 1474 Milan missal and the curial missal. The project takes no position on
  the pre-Tridentine question and acquiring them would not change that.
- The 1634 edition. Two independent passes failed to find it in the same
  repository; the next attempt should be a different library, not another query,
  and that is research rather than acquisition.
- The 1970, 2002 and 2011 books. All three are already identified, and all three
  are cite-only. Nothing is gained by holding bytes that may not be printed.
- The Eastern Catholic books. Scoped separately; see `[[deferred]]`.
- Any modern order missal -- Dominican 1965, Carmelite 1935, Carthusian 1981,
  Premonstratensian 1936. None has an established rights basis, and the early
  printings of the same uses are whole and publishable.
"""
