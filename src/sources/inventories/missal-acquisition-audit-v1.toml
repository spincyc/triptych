[[corrections]]
id = "icel-internet-clause"
severity = "medium"
target = "this project's standing treatment of postconciliar English as simply unpublishable, recorded as `absent: icel`"
target_says = "guidance/the-shape.md section 4 gives `absent: icel` as its example of an absence with a reason: `a postconciliar text nobody may publish`."
finding = """
HISTORICAL FINDING, RECORDED ON 2026-08-01:

`NOBODY MAY PUBLISH` IS TOO STRONG AS STATED, AND THE REAL POSITION IS A
CONFLICT BETWEEN TWO BODIES rather than a single prohibition.

ICEL's own published policy contains a conditional, surface-specific permission
for reproduction on a non-commercial site on the live Internet. It is not a
blanket permission for a corpus, public Git repository, command-line response,
or downloadable data bundle. `Publication Policies of the International
Commission on English in the Liturgy`, under `Use of ICEL Materials on Global
Computer Networks`
[sourced: https://icelweb.org/PubPolicy.PDF, and the summary at
https://icelweb.org/copyright.htm]: approved, recognised and promulgated ICEL
texts `may be reproduced in a non-commercial site ... on the global computer
network commonly known as the Internet WITHOUT OBTAINING WRITTEN OR ORAL
PERMISSION`, subject to conditions -- no access fee, the copyright
acknowledgment on first and last pages, the texts followed exactly, and ICEL
reserving the right to terminate or modify.

The USCCB's policy points the other way. `Policy on Electronic Copyrights`
[sourced: https://www.usccb.org/committees/divine-worship/policies]: `With the
exception of publication permission for single daily collects from the Roman
Missal, no permission will be given for the publication of liturgical texts on
the Internet at this time.`

So one body publishes a conditional standing permission and the other says
permission will not be given. This audit does not resolve which governs a given
text in a given territory, and it must not: that is a rights judgement for the
maintainer, not a finding.

RESOLUTION, APPLIED ON THE MAINTAINER'S DIRECTION:

The maintainer answered that reserved judgement in the governing publication
policy adopted on 2026-08-20. For ICEL-owned text, the actual rightsholder's
specific express permission governs unless rescinded or superseded; the
USCCB's generic electronic-publication policy does not itself establish that
rescission. The resolution is deliberately narrower than publication: ICEL's
grant is conditional and surface-specific, supplies no exact text, reaches no
other rightsholder, and does not authorize the tracked corpus, public Git,
downloadable data, or PDFs. [recorded:
guidance/liturgical-text-publication-policy.md sections 2, 3.4, 6, and 15.2].
"""
consequences = """
Applied without opening a refused surface or adding payload. Current records
preserve ICEL's conditional permission and classify each silence by its actual
blocker: `approved-english-publication-restriction` where this distribution
surface is outside the grant, `official-exemplar-not-carried` where no eligible
exact payload is held, and separate typed reasons for another rightsholder,
territory or version, or model boundary. The whole 2011 book remains
`may_publish_text = "no"` because it is a mixed-rightsholder artifact and the
recorded distribution surfaces remain ineligible, not because ICEL issued a
blanket prohibition.
"""
status = "applied on 2026-08-27"

