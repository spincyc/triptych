# ===== Group: the Latin uses and orders =====================================
#
# Every book in this group descends from the exempting clause of Quo primum,
# not from the general command. The existing act history draws that fork and
# then records that it holds no witness for any of them, calling the branch
# `honestly empty`. THIS GROUP IS WHAT FILLS IT.
#
# One structural finding governs the whole group, and it had to be CORRECTED
# once during the audit, so it is stated in its corrected form with the error
# left visible.
#
# THESE LINES HAVE THEIR OWN PROMULGATING ACTS. The first version of this note
# went on to say that those acts `are not papal -- they are decrees of a general
# chapter and orders of a master general, a prior general or an abbot`. THAT IS
# TRUE OF THE ORDERS AND FALSE OF THE DIOCESAN USES, and the counter-example is
# in this file: the Braga missal of 1924 was promulgated by a BULL OF PIUS XI of
# 8 December 1924 and declared typical by a decree of the SACRED CONGREGATION OF
# RITES of 9 December 1924 -- signed by Cardinal Vico and Alexander Verde, THE
# SAME TWO MEN who signed the Roman typical edition's decree of 25 July 1920.
# Both were read here at the bytes.
#
# So the corrected statement is two-part:
#
#   THE ORDERS  legislate for themselves. The act is a general chapter decree or
#               a superior's order, and it is very often printed ON THE TITLE
#               PAGE in the `iussu editum` clause.
#   THE DIOCESAN USES  have their typical editions declared by ROME, through the
#               same congregation and sometimes the same officials as the Roman
#               line. Braga is the proved case; Sarum, having no modern typical
#               edition at all, is not a counter-example but a different
#               situation again.
#
# The generalisation was made from three order missals and then applied to a
# group that also contains diocesan uses. It is exactly the failure this project
# keeps meeting -- a claim that was true of what had been read and was written as
# though it were true of the class.
#
# The three order instruments, read here at the bytes, which remain correct:
#
#   Carthusian 1679  `ex ordinatione capituli Generalis. Anno Domini
#                    M.D.CLXXVII. Celebrati sub R. P. D. Innocentio le Masson
#                    Priore Cartusiae ac totius eiusdem ordinis generali`
#   Carmelite 1621   `Capituli Generalis decreto ... Et reuerendissimi prioris
#                    generalis magistri Sebastiani Fantoni Romani iussu`
#   Dominican 1604   `Sub r.mo P.F. Hieronymo Xauierre Caesaraugustano, totius
#                    praefati Ordinis Generali magistro recognitum & emendatum,
#                    & auctoritate Apostolica approbatum & confirmatum`
#
# So the act rule extends to these lines without modification, and the cost of
# establishing a station is LOWER here than in the Roman line, because the
# catalogue record often carries the instrument. That is the opposite of what
# this audit expected before it looked.

