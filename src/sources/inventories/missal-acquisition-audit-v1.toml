# Which missals this project should acquire, and in what order.
#
# An acquisition audit, not an acquisition. Nothing below was added to the
# repository: every row is an identification, a rights position and a retrieval
# route, so that a later lane can acquire deliberately rather than by finding
# whatever a search returns first.
#
# This file sits in inventories/ for the reason the act-history sidecar beside
# it gives: `source-library validate` rejects any file under src/sources outside
# its own schema except .md and .toml under inventories/, and a new directory
# under calendars/ would be discovered by tooling this audit is not ready to
# answer to. See guidance/act-histories.md section 9.

audit_schema = 1
record_type = "missal-acquisition-audit"
slice = "roman-line-and-latin-uses"
recorded_on = "2026-08-01"

model = """
The station is the ACT, never the book. guidance/act-histories.md settles this
and this audit obeys it: a bull, a decree, an instruction or a documented
exemption is a station; a printing is a WITNESS that hangs beneath the history.

That rule has a consequence this audit exists to make usable. A TYPICAL EDITION
is not a station either. It is a book -- the book an act declared normative --
and the distinction that matters for acquisition is therefore three-way and not
two-way:

  ACT               the instrument. Dateable, citable, and what the history is
                    keyed on. Recorded in `[[acts]]`.
  TYPICAL EDITION   the book an act declared `typica`, to which later printings
                    must conform. A witness, and the strongest kind, because it
                    is the object the act names. `is_typical_edition = true`.
  PRINTING          any other book: a commercial edition conformed to a typical
                    one, a lay translation, a critical or facsimile edition.
                    A witness, and a weaker one. `is_typical_edition = false`.

Every book row therefore carries `station = false`. The field is written out
rather than left implicit because the failure this project keeps meeting is a
generator that chains books by date and thereby asserts that a rite descends
through a publisher. It has been caught twice already in this repository -- the
1862 Pustet printing and the 1962 Benziger printing -- and both are below.
"""

evidence = """
Three evidence levels are used, and no row claims one it did not reach.

  [verified]  Read here, on 2026-08-01, from bytes this audit fetched: an
              exact PDF, an exact OCR text layer, or the Internet Archive
              metadata API queried directly by URL. Reproducible.
  [sourced]   Read from an external document that is cited by URL and, where
              applicable, by identifier.
  [recorded]  Taken from a record already in this repository, cited by path.
              Not independently re-verified here unless the row says so.

Nothing below is asserted from recall. Where a date, a rank, an authority or an
attribution could not be sourced, the field says `unrecorded` and the acquisition
order treats establishing it as the work.

Two mechanical routes were used so that identification never passed through a
model. Candidates were found with the Internet Archive advanced-search API
(`https://archive.org/advancedsearch.php`) and confirmed against the metadata
API (`https://archive.org/metadata/<identifier>`), both queried by `curl`.
Where a book's identity mattered, its own OCR text layer or PDF was fetched
whole and its title page and colophon read locally with `pdftotext` or `grep`.
That is what caught the misidentification recorded at `missale-romanum-1570-venice`.
"""

rights_frame = """
Rights decide what may be PUBLISHED, not what may be read, and the two are
recorded separately throughout. guidance/sources.md is explicit: retrieval and
redistribution are separate acts, and the rights record decides the disposition
after the retrieval, not before it.

THE FRAME THIS AUDIT STARTED WITH WAS WRONG IN TWO PLACES, AND THE CORRECTED
ONE IS BELOW. The brief this audit answers supplied the premise `post-1929 works
of the Holy See are protected in the US; pre-1929 printings are generally
clear`. A dedicated rights pass could source NEITHER HALF of that sentence. What
replaced it is sourced line by line. See `[[corrections]]` entry
`rights-frame-premise` for what changed and why it matters.

- **The US public-domain line is BEFORE 1931, not before 1930.** Cornell's
  `Copyright Term and the Public Domain in the United States`, in its revision
  current as of 1 January 2026, gives for works first published abroad by
  foreign nationals: `Before 1931 | None | In the public domain`
  [verified at https://guides.library.cornell.edu/copyright/publicdomain].
  Every `public-domain-us-pre-1931` row rests on this. The line moves each
  January and this file will go stale; that is a property of the rule, not a
  defect in the row.
- **1929 IS NOT A SOURCED WATERSHED FOR THE HOLY SEE, and 1935 is.** US
  Copyright Office Circular 38a lists the Holy See's copyright relations with
  the United States in full as `Berne (Paris) Sept. 12, 1935; UCC Geneva Oct. 5,
  1955; Phonograms July 18, 1977; UCC Paris May 6, 1980` [verified at
  https://www.copyright.gov/circs/circ38a.pdf]. There is NO bilateral-treaty
  date and no WTO entry. So the Holy See had no US copyright relation of any
  kind before 12 September 1935, and 11 February 1929 appears in none of it.
  The 1929 date is real in Vatican law -- it is the date of the Lateran Pacts,
  cited in Vatican Law CXCVII art. 1 -- but nothing sourced here makes it a US
  copyright boundary. Recorded as `unrecorded` rather than repeated.
- **The Holy See asserts copyright in its own official acts, by statute.**
  Vatican Law N. CXCVII of 1 September 2017, art. 2: `Le norme relative alla
  protezione e alla gestione del diritto di autore si applicano anche ai testi
  delle leggi e degli atti ufficiali pubblicati, in qualunque forma, dalla Santa
  Sede e dallo Stato della Citta del Vaticano.` Art. 5 sets the term at seventy
  years from first publication [sourced:
  https://www.wipo.int/wipolex/en/legislation/details/22802]. This is the
  opposite of the US government-edicts rule and it is why an argument from
  `it is an official act, therefore free` fails here.
- **The altar book's own claim is the operative one, and it names APSA.** The
  2002 typical edition prints on the leaf after its title page, read at the
  bytes [verified]: `" Copyright " apud Administrationem Patrimonii Sedis
  Apostolicae in Civitate Vaticana / Venditio operis fit cura Librariae
  Editricis Vaticanae`. So the holder of record for the Missal is the
  ADMINISTRATION OF THE PATRIMONY OF THE APOSTOLIC SEE, with Libreria Editrice
  Vaticana as SALES AGENT only -- not, as is usually assumed, LEV as owner.
  This sits awkwardly beside the Secretariat of State decree of 31 May 2005
  vesting in LEV `every moral copyright and all the exclusive financial rights
  ... over all the deeds and documents through which the Supreme Pontiff
  exercises his own Magisterium` [sourced:
  https://www.vatican.va/roman_curia/secretariat_state/2005/documents/rc_seg-st_20050531_decreto-lev_en.html].
  Nothing located reconciles the two. Recorded as an open tension, not resolved.
- **URAA restoration applies and its date is 1 January 1996.** 17 U.S.C. 104A
  restored US copyright in foreign works that had fallen into the US public
  domain for failure of formalities, effective 1 January 1996 for Berne and WTO
  members, for the remainder of a term generally running 95 years from first
  publication [sourced: https://www.copyright.gov/circs/circ38b.pdf]. This is
  the mechanism that matters for twentieth-century Holy See printings, and it
  is a stronger and better-sourced reason for CITE-ONLY than the 1929 story it
  replaces.
- **A digitisation of a public-domain book creates no new US copyright.**
  `Bridgeman Art Library v. Corel Corp.`, 36 F. Supp. 2d 191 (S.D.N.Y. 1999):
  slavish photographic reproduction lacks originality [sourced]. The Internet
  Archive disclaims any determination of its own -- `The Internet Archive does
  not make guarantees as to the copyright status of items on archive.org`
  [sourced: https://help.archive.org/help/rights/] -- and HathiTrust states of
  Google-digitised public-domain works that `There are no restrictions on use of
  text transcribed from the images` [sourced:
  https://www.hathitrust.org/the-collection/search-access/access-use-policy/].
  So an uploader-applied licence is an ASSERTION BY WHOEVER FILLED IN THE FIELD
  and is never treated here as a grant. See `[[corrections]]`
  `cmaa-facsimile-licence`, where that abstraction is made concrete.

`rights` takes one of: `public-domain-us-pre-1931`,
`public-domain-us-not-renewed`, `holy-see-post-1929`,
`third-party-copyright`, `unresolved`, `mixed`.
`may_publish_text` is the operative field and is `yes`, `yes, subject to the
title-page confirmation named in rights_basis`, `no`, `mixed`, or `unresolved`.
A row may be freely readable and still `may_publish_text = "no"`.

The value `holy-see-post-1929` is RETAINED AS A LABEL for continuity with the
brief and with sibling records, but it now means `a modern liturgical book of
the Holy See, protected in the United States by URAA restoration and by the
Holy See's own asserted rights`. The year in the label is not the reason. A
later pass may rename it; renaming it here would break the one cross-reference
it has without improving what it means.
The controlling operational analysis is now
`postconciliar-latin-rights-v1.toml`; the retained label is not itself a legal
conclusion.
"""

extent = """
This audit covers the Roman line proper and the Latin uses and orders in
communion with Rome. It does not cover, and asserts nothing about:

- the Eastern Catholic liturgical books, which are a different problem and are
  scoped rather than attempted; see `[[deferred]]`;
- the Office, the Pontifical, the Ritual, the Ceremonial, the Gradual and the
  other liturgical books, except where one of them is the only carrier of a
  missal act -- the 1956 Ordo Hebdomadae Sanctae is the case;
- lectionaries, which after 1969 are a separate book from the Missal;
- vernacular hand missals, except the two Cummiskey printings already in the
  repository and the one 1806 printing recorded beside them;
- whether any text below is doctrinally or liturgically preferable to any
  other. guidance/editorial.md, `No side in what is described`.

Silence here is silence because nothing was established, never because a thing
was checked and found absent. guidance/recensions.md Rule 4.
"""

aliases_method = """
Every search below was driven from a resolved alias set rather than from one
string, because a work looked for under one name reads afterwards as an
absence. guidance/sources.md requires the aliases a retrieval used be recorded
with it, so each book row carries `aliases_tried` and each carries
`aliases_that_hit`.

The alias classes that actually mattered here, in the order they paid off:

1. The Latin title as catalogued, which is usually the full incipit of the
   title page and not the short form anyone uses: `Missale Romanum ex decreto
   sacrosancti Concilii Tridentini restitutum ...`.
2. The ORDER's Latin genitive rather than its English adjective. `praedicatorum`
   returns the Dominican missal; `dominican` does not.
3. The place in Latin, not the vernacular: `lugdunensis` not `Lyon`,
   `bracarense` not `Braga`, `cartusiense` not `Carthusian`.
4. The EDITOR's surname, for the critical editions, which are often catalogued
   under the editor and not under the book: Lippe, Legg, Lesley, Lorenzana.
5. The date of the printing as a range rather than a point, because catalogue
   dates for early printings are frequently the year of a preface.

One alias class produced nothing and the negative is recorded rather than
dropped: no Carthusian missal was found on the Internet Archive under
`cartusiense`, `cartusiensis`, `cartusianum`, or `chartreux` [verified]. That
is a statement about that repository under those names, not about the book.
"""

