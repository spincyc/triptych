# --- Books ------------------------------------------------------------------
#
# Every row here is a WITNESS. `station = false` on all of them, by the rule in
# `model`. `is_typical_edition` separates the book an act declared normative
# from every other printing.
#
# `retrievable` is the field a later acquisition lane reads:
#   "whole"       the entire document is fetchable by the recorded route
#   "bounded"     only part is fetchable; `bound_reached` says exactly what
