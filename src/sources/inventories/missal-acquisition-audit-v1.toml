- ONE OFFICIAL HOLY SEE PUBLICATION IS ALREADY ONLINE: the Instruction for
  Applying the Liturgical Prescriptions of the Code of Canons of the Eastern
  Churches, Vatican City 1996, on the Dicastery's own site.
- NO INDIVIDUAL CHURCH'S OFFICIAL SERVICE BOOK was verified as available online.
