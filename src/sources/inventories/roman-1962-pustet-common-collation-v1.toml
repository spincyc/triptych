scope = "Seventeen newly transcribed Roman Common and Saturday Blessed Virgin Mary chant bodies compared visually between the controlling 1962 CMAA facsimile and exact retained page images of the public-domain 1862 Pustet printing."
method = "Read each target and verification locus on its exact page image. Transcribe the Pustet wording after only the controlled mechanical transformations below, hash both the live YAML text field and that transformed Pustet transcription, and record every remaining Unicode difference. A public-domain page does not authorize a non-exact 1962 target string."
comparison_preimage = "UTF-8 fields joined by TAB in this order: mass, form, proper, course, cycle, decimal occurrence, target_text_sha256, verification_text_sha256, outcome; followed by LF."
result = "1 collated-exact-after-mechanical-normalization with publication unresolved; 16 collated-non-exact and explicitly withheld; all 17 have empty serving surfaces."

[[mechanical_transformations]]
id = "strip-stress-accents"
description = "Remove printed stress accents only where the underlying base-letter sequence is unchanged."

[[mechanical_transformations]]
id = "expand-print-ligatures"
description = "Expand printed ae and oe ligature glyphs to their underlying ae or oe letter sequence; do not change oe to ae."

[[mechanical_transformations]]
id = "join-line-breaks"
description = "Remove discretionary line-end hyphenation and join or normalize page line wrapping and whitespace to the YAML field representation."

[[mechanical_transformations]]
id = "map-liturgical-layout"
description = "Represent printed V. versicles and seasonal Alleluia/rubric layout using the canonical body's punctuation and conditional notation without substituting letters or words."

