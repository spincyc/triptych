[what_the_grant_reaches]
question = "Which texts does it reach?"
answer = "ICEL's own, approved, recognised and promulgated. Four facts, each established per text."
reasoning = """
The clause names four qualifications and each is a fact about the text, never an
inference from the book it is printed in.

(a) IT IS ICEL'S. Settled for the Mass texts by ICEL's own published inventory
of its property, which names the Order of Mass, the Proper of Seasons, the
Proper of Saints, the Commons, Ritual Masses, Masses and Prayers for Various
Needs and Intentions, the Antiphons, Votive Masses, Masses for the Dead, the
Eucharistic Prayers including those for Masses with Children and for
Reconciliation, the GIRM, and the Appendix and Supplement -- all now carried by
the single 2010 Roman Missal acknowledgment.

(b) APPROVED BY THE CONFERENCES OF BISHOPS, (c) RECOGNISED BY THE HOLY SEE, and
(d) PROMULGATED FOR USE. For the 2011 Roman Missal as a whole these are matters
of public record rather than open questions. They are not satisfied by a
provisional, Green Book or Gray Book text, by the 1998 Sacramentary the Holy See
declined to confirm, or by the 1973 translation, which is ICEL's but is no longer
promulgated anywhere in the English-speaking world.

The narrow proposition this record supports, and no broader one: this English
text is ICEL-owned and falls within ICEL's standing permission for approved,
recognised and promulgated ICEL texts on a non-commercial website, subject to the
six stated conditions.
"""

[what_the_grant_does_not_reach]
question = "What is in the same books and is not ICEL's?"
answer = "Four other parties, and for three of them the answer is a written prohibition."
reasoning = """
The 2011 United States Missal's own front matter divides one volume six ways:
the Latin to Libreria Editrice Vaticana 2008; the English translation and chants
to ICEL 2010; the Lectionary for Mass to the Confraternity of Christian
Doctrine, with its own express prohibition on reproduction; three psalms to the
Revised Grail Psalms, Conception Abbey/The Grail, administered by GIA; the
particular adaptations and proper texts for the Dioceses of the United States to
the USCCB, with its own express prohibition; and one musical setting to Robert
Snow.

Two consequences. The sentence "no portion of this text may be reproduced by any
means without permission in writing" is NOT a global reservation over the book;
it is the tail of the CCD's lectionary notice and governs the readings. And
neither express prohibition printed in that book reaches an ICEL oration: the
CCD's governs the readings, the USCCB's governs the United States adaptations
and propers, and the ICEL line's terms are stated in ICEL's own published
policy, which is this record.

For the CCD, the NAB, the Lectionary for Mass and The Abbey Psalms and Canticles
there is no competing standing grant, the holder's own statement is the
governing source, and the answer is no. That is not a close call and no lane
should treat it as ambiguous.
"""

[the_revised_grail_carve_out]
question = "The Grail psalms are a different rightsholder. Where does that actually bite?"
answer = "In exactly three places in the ICEL Antiphonary, and in a fourth, harder place inside a single Palm Sunday antiphon."
reasoning = """
The ICEL Antiphonary's own copyright page reserves "the English translation of
Psalms 23(24), 46(47), and 115(116) from The Revised Grail Psalms (c) 2010
Conception Abbey/The Grail, administered by GIA Publications, Inc." -- the same
three the United States Missal's front matter names. GIA is not ICEL and has
granted this project nothing, so ICEL's clause does not reach a word of them.

The trap is not that psalms are cited; it is that psalms are PRINTED. Read at
the bytes on 2026-08-21 by enumerating every centred "Psalm N" heading across all
265 pages, the Antiphonary prints psalm strophes in exactly three places, and
they are exactly those three psalms:

  artifact page 41  Psalm 23, under Palm Sunday Procession Antiphon 1
  artifact page 42  Psalm 46, under Palm Sunday Procession Antiphon 2
  artifact page 242 Psalm 115, in the Rite of Blessing a Chalice and a Paten

Everywhere else in the document a psalm appears as a red Graduale ASSIGNMENT in
parentheses, which is a citation and carries no Grail text, or as an ICEL
antiphon that happens to translate a psalm verse -- Ps 115: 15 and Ps 115: 12-13
are Missal antiphons and are ICEL's. The distinction is between a psalm printed
as a psalm and a verse translated as an antiphon, and only the first is GIA's.

THE FOURTH LOCUS IS THE HARD ONE. At artifact page 44 the Palm Sunday Simple
Entrance Antiphon is cited "Cf. Jn 12: 1, 12-13; Ps 23: 9-10" and prints those
verses INSIDE the antiphon, between two repetitions of its refrain, in the same
wording as page 41. So on that slot the unit of rights is smaller than the
sentence. A schema that assigns one rights token per proper cannot express it,
and both failure directions are real: withholding the slot withholds ICEL text
ICEL permits, and publishing it publishes GIA text nobody permitted.

THE THIRD PSALM IS NOW LOCATED. guidance/liturgical-text-publication-policy.md
section 5.1 recorded that Psalm 115(116) had not been found in this repository's
ledger and should be before any Triduum antiphon is considered. It is not in a
Triduum antiphon. It is at artifact page 242, in an appended ritual Mass.

AND A NOTICE IS NOT EVIDENCE OF A RIGHT. The CBCEW Liturgy Office's
Lords-Entrance.pdf prints Psalm 23 and Psalm 46 entire and carries NO Revised
Grail notice -- only ICEL and a Revised Standard Version notice for the
procession Gospels -- while the Antiphonary prints the same psalms and does carry
one. Two conference-published documents, the same psalms, different attribution.
Never infer a rights position from whether a notice appears on the file in hand.

OPERATIVE RULE. Where a slot's text includes Psalm 23(24), 46(47) or 115(116) as
printed psalm verses, carry the ICEL antiphon and NOT the psalm verse, and record
the split. Where the psalm appears only as a citation or as an ICEL antiphon
translating a verse, there is no split to record.
"""
