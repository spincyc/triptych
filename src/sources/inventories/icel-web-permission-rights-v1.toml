# ICEL's standing web permission, settled once, with the sources behind it.
#
# This file exists so that no later lane has to re-derive the answer to "may
# this project publish the English of the Roman Missal, and on what terms". It
# was derived independently at least three times before this, in three wordings,
# from a summary page that does not carry the grant -- and each time the answer
# came out wrong in the same direction. The grant is now registered in the source
# library as bytes, hashed, with the clause read at artifact page 26. Cite this
# file and those records; do not reason from a web page again.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. Where it states a proposition of law it states the
# jurisdiction, and the jurisdiction throughout is the United States.
#
# Relationship to the two records beside it. `liturgical-english-rights-v1.toml`
# reached the opposite conclusion on the permission and reached it honestly, from
# the only ICEL document then held; its `[the_icel_translation]` section is
# superseded by this file and everything else in it stands. The governing
# presumption and the surface rules live in
# guidance/liturgical-text-publication-policy.md; where that page and this record
# differ on a FACT, this record is right, and where they differ on the
# PRESUMPTION, that page is right.

rights_schema = 1
record_type = "icel-web-permission-rights"
recorded_on = "2026-08-21"
jurisdiction = "United States"

holding = """
ICEL's own published Publication Policies grant the reproduction of ICEL texts
and translations that have been approved by the Conferences of Bishops, have
received the recognition of the Holy See, and have subsequently been promulgated
for use, on a non-commercial Internet site, WITHOUT obtaining written or oral
permission, subject to six conditions. This project is such a site. The grant
therefore reaches the English of the Roman Missal that ICEL owns, and no licence
need be sought for it.

Three things the grant does not do, and all three are ordinary conditions of the
rightsholder rather than doubts about the permission.

It does not reach texts ICEL does not own. The Lectionary for Mass, the New
American Bible, The Abbey Psalms and Canticles, the United States national
adaptations and proper texts, and the Revised Grail Psalms are four other
parties' property, three of which carry express written-permission
restrictions. Rights are decided per text, never per book.

It does not supply text. Condition (3) requires the translations be followed
exactly, so every published word must resolve to an exact copy this project has
opened. This lane acquired and registered the exemplars that exist: ICEL's own
free chant library of 188 files, the ICEL Antiphonary of every antiphon in the
Missal, and the England-and-Wales Order of Mass and Eucharistic Prayers.

It does not license every form of publication. Condition (4) is about FORM, not
fee, and the site's own pages are one form while a downloadable file, an
installed PDF and a clonable Git repository are others. The decision is per text
AND per surface.
"""

