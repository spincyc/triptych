   English in the United States is the Confraternity of Christian Doctrine's and
   is not publishable at all. FLAGGED, NOT DECIDED. Getting this wrong in the
   permissive direction would be the single worst error available here.

4. A TEXT TURNING OUT NOT TO BE PROMULGATED. Gray Book and Green Book texts,
   provisional section texts and the 1998 Sacramentary are outside the grant by
   its terms. Our Lady of Loreto is the live instance: ICEL's News page records
   its texts transmitted to the conferences in Gray Book form in May 2021.

5. THE SURFACE CHANGING. The basis is decided per text and per surface. If a
   surface of this site ever becomes an aid to participation in a celebration
   rather than a reader for study, the publication category changes and the
   analysis must be redone for it. The USCCB's 2025 guidelines put the tie-break
   the other way in doubt -- "in cases of ambiguity, it is better to err on the
   side of following the requirements for the participation aid" -- and name the
   remedy: publishers may ask the Secretariat.
