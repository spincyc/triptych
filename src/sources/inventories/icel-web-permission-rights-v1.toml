[what_would_overturn_this]
question = "What would change the position?"
answer = "Five things, and condition (5) makes the first a standing obligation."
reasoning = """
1. ICEL EXERCISING CONDITION (5). ICEL reserves the right to terminate or modify
   the permission. This record therefore has a retrieval date and not a
   conclusion: re-fetch https://www.icelweb.org/PubPolicy.PDF, compare the hash
   recorded here, and re-read artifact page 26 before relying on it again.

2. EVIDENCE THAT THE CLAUSE WAS RESCINDED OR SUPERSEDED. None was found. The
   USCCB's 2021 Copyright Permission Requirements says "typically, permission is
   not granted to post the liturgical texts online", and that is the most adverse
   statement in this analysis and is not to be minimised. It describes what that
   Secretariat grants, not what a different rightsholder has already granted, and
   a third party's permissions FAQ does not revoke a published licence of the
   owner's. For text the USCCB or CCD actually owns, that page IS the holder's
   own statement and the answer is no. The two are reconcilable on their faces
   and neither is asserted here to be rescinded; but 51 pages of the 2025
   guidelines do not mention the Internet clause anywhere, and this is the point
   on which a reasonable person could most easily disagree with this record.

3. A TEXT TURNING OUT NOT TO BE ICEL'S. The live one is the Gospel Acclamation:
   in the postconciliar rite the acclamation verse belongs to the LECTIONARY, not
   the Missal, and if that is so for the six in this repository's ledger their
   English in the United States is the Confraternity of Christian Doctrine's and
   is not publishable at all. FLAGGED, NOT DECIDED. Getting this wrong in the
   permissive direction would be the single worst error available here.

4. A TEXT TURNING OUT NOT TO BE PROMULGATED. Gray Book and Green Book texts,
   provisional section texts and the 1998 Sacramentary are outside the grant by
   its terms. Our Lady of Loreto is the live instance: ICEL's News page records
   its texts transmitted to the conferences in Gray Book form in May 2021.

5. THE SURFACE CHANGING. The basis is decided per text and per surface. If a
   surface of this site ever becomes an aid to participation in a celebration
   rather than a reader for study, the publication category changes and the
   analysis must be redone for it. The USCCB's 2025 guidelines put the tie-break
   the other way in doubt -- "in cases of ambiguity, it is better to err on the
   side of following the requirements for the participation aid" -- and name the
   remedy: publishers may ask the Secretariat.
"""

