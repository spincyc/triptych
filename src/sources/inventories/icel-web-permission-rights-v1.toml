[exactness]
question = "Condition (3) says the translations must be followed exactly. What does that require of a corpus?"
answer = "Sense lines, and page-image transcription. Both are stated by ICEL, and neither is presentation."
reasoning = """
ICEL's Publication Policies devote a section to sense lines and say of them:
"Such sense lines must be respected in the reproduction of texts -- as well as in
paragraphing, division into stanzas, and the like." The specimen contract in the
same booklet states it as a term: the publisher must follow "the wording,
spacing, sense lines, capitalization, and punctuation of such printed text". The
USCCB's 2025 guidelines demand the same thing in their own words. A schema that
cannot carry line structure cannot store an ICEL oration and satisfy condition
(3).

The second requirement follows from the files themselves. Every PDF registered
here has a text layer and none is byte-exact. ICEL's chant files syllabify sung
text across neumes, use ligature glyphs, and mis-map at least one glyph pair --
"attain" extracts as "aHain" in GoodFriday6.pdf. LY-Composers-Guide.pdf extracts
"Saintt Joseph" in the Litany. So the text layer is a FINDING AID; transcription
is from the page images, and de-syllabification is an editorial transformation
that must be recorded on a text whose permission demands exactness.

No unofficial source substitutes for this. Not blogs, not unofficial missal
sites, not scraped parish or seminary PDFs, not OCR unverified against page
images, and never a model: retrieval fetches and hashes whole byte streams and
seeks within them locally.
"""
source_ids = [
  "passage.international-commission-on-english-in-the-liturgy.publication-policies.2013-amended-booklet.sense-lines",
]

[storage_and_surface]
question = "Does the standing web grant permit the source files or normalized text payloads to be retained in this public repository?"
answer = "No. The exact publisher files remain remote, and the former normalized-text payloads are restricted metadata records with no tracked path or indexable text."
reasoning = """
Two layers, and conflating them is the error most available here.

THE TEXT is ICEL's and may be displayed only through a qualifying no-fee,
noncommercial Internet-site route that follows the clause's exactness and
first-and-last-frame conditions. This repository's current public Git corpus
and bundled static-web data are clonable, downloadable forms of publication;
they are not that route and carry no ICEL text payload on the strength of this
permission.

THE FILE is somebody's typographical work, delivered on its own separate and
narrower terms, and none of those terms reaches redistribution from a public Git
repository:

  ICEL's Music for the Roman Missal index page grants reproduction "free of
  charge IN PRINTED FORM, for non-commercial purposes, in publications not for
  sale, BY PARISHES, DIOCESES, SCHOOLS, AND RELIGIOUS COMMUNITIES". Print, and a
  named class of user this project is not in. This is the generous-sounding grant
  and it is the wrong one to lean on.

  The CBCEW Liturgy Office grants that its leaflets "may be reproduced for local
  parish use", and its Holy Week excerpts are "intended for printing and
  insertion in a worthy folder for use in the liturgy". Bounded, and not a
  permanent website.

  ICEL's Publication Policies booklet carries no reuse grant over itself; it is a
  corporate policy document and not an approved liturgical translation, so its
  own clause does not reach it. That record is rights_status = unresolved.

And condition (4) independently withholds "a license to publish texts in any
other form". guidance/sources.md requires an AFFIRMATIVE RECORDED DISTRIBUTION
BASIS for `tracked`, and says in terms that online availability and successful
download are insufficient. There is no such basis for these bytes. The
artifact-level rights census is therefore 233 `restricted`, three `unresolved`,
and zero `permission`; the ICEL permission belongs to qualifying text display,
not to any source PDF as a downloadable file. Storage is a separate axis, so:

  storage = remote for 219 publisher artifacts, with the exact URL, sha256 and
  byte size recorded, page count recorded for the 217 PDFs, and no payload
  retained. Within the chant
  edition, that is 170 standalone publisher-PDF records plus 17 exact
  publisher-PDF parent records for the quarantined transcriptions. Seventeen
  former normalized-text TSV artifacts are storage = restricted,
  non-indexable, pathless metadata records; their hashes identify the removed
  payloads for audit without redistributing the words. The precedent is
  edition.catholic-church.ordo-lectionum-missae.english-liturgy-office-web-2026-07-25,
  a Liturgy Office PDF already held the same way.

This preserves the evidence the project needs: a hash and URL can identify a
publisher artifact, and a hash can identify a quarantined transcription,
without carrying either payload. Any later transcription may be displayed only
through a separately reviewed, qualifying non-bundled route; it may not be
restored to the public Git corpus or static-data bundle on this record alone.

THE SAME PER-SURFACE LOGIC GOVERNS THE TEXT, and this is where the mechanical
hazard sits. LICENSE offers project-created content under CC BY 4.0 and carves
out third-party material only where a file or THIRD_PARTY.md says otherwise --
a real mechanism, and a manual one. ICEL text entering the corpus without a
THIRD_PARTY.md entry and a file-level marker would be swept into an outbound CC
BY 4.0 offer, purporting to sublicense ICEL's translation to the world. That
would happen by omission rather than by decision, which is why
guidance/liturgical-text-publication-policy.md section 3.4 holds text out of the
corpus files until the rights model can express a per-text, per-surface decision
and the publication filter can act on it. A qualifying non-bundled web-display
route is a missing mechanism; Git, CLI, PDF, API and download redistribution
remain outside the recorded permission. Neither fact may be flattened into a
blanket conclusion about every surface.
"""

[routes_examined_and_refused]
question = "Free and complete copies of the Missal's English are easy to find. Why are these the sources?"
answer = "Because authority is a property of the publisher of the copy, not of the text inside it."
tiers = """
Four tiers. The line falls between 2 and 3.

  1  ICEL itself, the owner of the translation. Passes; nothing establishes
     exactness better than the rightsholder's own copy.
  2  An ICEL member episcopal conference, or its liturgy office, publishing on
     its own site. Passes; it is a body that approved the text and to which the
     Holy See's confirmation was addressed.
  3  A diocese, seminary, parish, religious institute, or licensed commercial
     publisher. FAILS. An accurate copy, probably; but the copier neither owns
     nor approved the text and nothing on the page establishes exactness.
  4  Devotional aggregators, apps, personal projects, user-uploaded scans.
     FAILS, however accurate.
"""
refused = """
THE INTERNET ARCHIVE SCAN of the 2011 Missal. Retrievable, whole, and refused on
the authority of the copy: uploaded by a private individual, no licence, a
re-uploader supplying metadata for a scan they did not make of a book they do not
own. ICEL's permission to reproduce ICEL's text is not a warrant to source it
from an unauthorised reproduction of a whole book whose front matter carries two
other bodies' express prohibitions. This repository has ruled on it twice before
and this record adopts that ruling.

liturgy.au -- a free ePub of the complete approved Roman Missal in Australian and
USA editions, $0.00, current enough to advertise the 2025 papal-name and 2020
collect-ending changes, and almost certainly accurate. Its About page: "This
project ... began when the first iPad was released back in 2011 ... So I began to
develop these." A private individual's project. No conference, no licence
claimed, no notice of authority. TIER 4, and the clearest illustration available
that free and correct is not the same as established.

ProcessionalBook.pdf, the Society of Saint Gregory's Processional, published on
the CBCEW's own site "with the approval of the Department of Christian Life &
Worship". Fetched on 2026-08-21 (135 pp) and DELIBERATELY NOT REGISTERED. Its own
copyright page shows it mixes the 2010 Missal with The Simple Gradual 1968, with
psalm-verse assignments from "The Sacramentary (c) 1997, ICEL" and antiphons
"proposed in the unpublished ICEL Antiphonal of 1997" -- the Sacramentary the
Holy See declined to confirm. Unpromulgated text is outside ICEL's grant by the
grant's own terms, and A CONFERENCE ENDORSEMENT DOES NOT CURE AN UNPROMULGATED
INGREDIENT. Registering it would put a trap in the library.

Diocesan, seminary and parish PDFs; tarsus.ie; catholic-resources.org;
Universalis; iBreviary. Tier 3 or 4, refused.

Not refused but not reached by this lane: the USCCB's own PDFs under
/resources/, which return real bytes to plain curl and carry post-2011 Mass
formularies with both Roman decrees. They are the natural UNITED STATES witness
and the natural next acquisition. The USCCB's HTML is behind a proof-of-work
interstitial; solving it would be circumventing an access control the operator
installed, which this lane did not do and no agent should. A human with a browser
saving the page is the ordinary alternative.
