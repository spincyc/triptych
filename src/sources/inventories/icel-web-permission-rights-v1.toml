[territory]
question = "An England-and-Wales file is in hand. What is it a witness to?"
answer = "To the universal ICEL text where the text is universal, and to nothing of the United States."
reasoning = """
ICEL is a mixed commission of eleven Catholic bishops' conferences and the
translation it makes is common to them. A national adaptation is not: it belongs
to the conference that made it, under the same principle by which the vernacular
copyright is the conference's. So a document published by one conference
witnesses the universal text where the text is universal, and witnesses that
conference alone where the text is its own.

Applied to what this lane registered:

  ICEL's Music for the Roman Missal -- the rightsholder's own copy, universal.
  The ICEL Antiphonary -- universal. Hosted by the CBCEW Liturgy Office, but the
    host is not the territory: the file carries no CBCEW claim, its notices name
    only Libreria Editrice Vaticana, ICEL and the Revised Grail, and its foreword
    cites the GIRM of the 2011 Roman Missal.
  The CBCEW Order of Mass leaflets, Eucharistic Prayers, Holy Week excerpts and
    composers' guides -- England and Wales. They witness the universal ICEL text
    where it is universal; they are NOT witnesses to a United States adaptation,
    disposition or spelling, and nothing in them may be carried onto a United
    States surface without that being established element by element.

Two live illustrations that this is not a formality. Our Lady of Loreto: both
the USCCB and the CBCEW direct the English Collect to an existing Missal
formulary, the Common of the Blessed Virgin Mary for Advent, while the Latin
decree has a proper Collect and this repository's ledger records the proper Latin
incipit. Resolve that at the confirming decree, not at either conference's page.
And ICEL itself records liturgical texts for Loreto transmitted to the
conferences in GRAY BOOK form, which is draft and outside the grant by its own
terms.

Spelling is the one variance ICEL's own specimen contract contemplates -- "the
sole exception that spelling may vary (e.g., honor/honour) to accommodate the
usage in a particular country" -- so an England-and-Wales spelling is not a
defect in that file and is not the United States reading either.
"""

[as_of_when]
question = "An authoritative publisher establishes who says so. Does it establish when?"
answer = "No, and two of the files registered here prove it."
reasoning = """
Every document registered by this lane is dated 2010-2014, and the Missal has
been emended since: the collect conclusions after the Prefect of the
Congregation for Divine Worship wrote to the Anglophone conferences in May 2020
that "one" has no warrant in the Latin; the 2013 insertion of Saint Joseph into
Eucharistic Prayers II-IV; the reigning Pope's name; and a growing Proper of
Saints. Each conference implements on its own date, so an emendation does not
even have one date.

Two demonstrations, both read at the bytes:

ICEL's own PresidentialTones.pdf prints the Collect and Prayer over the
Offerings of the First Sunday of Advent whole, as pointing examples, and sets the
Collect with the conclusion ending "one God, for ever and ever" -- the superseded
reading. The rightsholder's own file, wrong on this point today.

The CBCEW's EP2-A4.pdf, EP3-A4.pdf and EP4-A4.pdf were produced on 1 September
2011 and contain no occurrence of the name Joseph, while the Liturgy Office page
that serves them announces the 2013 insertion on its own face.

OPERATIVE RULE. Record the state and the territory every acquisition witnesses,
and collate it against the emendations in force before publishing, exactly as a
missal witness would be collated. Treating a 2010 conference PDF as the current
text of another territory is the same class of error as reading a 1962 printing
under a 1920 heading.
"""

[the_acknowledgment]
question = "Condition (2) requires the appropriate acknowledgment. Which words?"
answer = "The ones ICEL prints today, in the form the file the text was read from carries -- generated from metadata, never typed beside the text."
reasoning = """
ICEL's Publication Policies, Part Three, list five elements the acknowledgment
must always include: the name of the ICEL work being reproduced, in italics or
underlined; the symbol (c), or "Copyright", or "Copr."; THE YEAR OF ORIGINAL
PUBLICATION of that work; ICEL's corporate title in full; and the phrase "All
rights reserved" at the end. For an excerpt it is preferable to name the elements
or the specific rites being reproduced.

THE BOOKLET'S OWN CORPORATE TITLE IS THE OLD ONE AND MUST NOT BE COPIED. Part
Three says "International Committee on English in the Liturgy, Inc." throughout.
ICEL's current copyright page, and the notice ICEL itself prints at the foot of
every page of its own chant files, both read "International Commission on English
in the Liturgy Corporation". Condition (2) sends the reader to the web page for
the appropriate acknowledgment, so the current form governs.

THE FORM DEPENDS ON THE FILE, and this is easy to get wrong. Read at the bytes:

  ICEL's chant files carry "The English translation AND CHANTS of The Roman
  Missal (c) 2010, International Commission on English in the Liturgy
  Corporation. All rights reserved."

  The ICEL Antiphonary carries the plain "The English translation of The Roman
  Missal (c) 2010, ..." without "and chants".

  The CBCEW leaflets carry "EXCERPTS FROM the English translation of The Roman
  Missal (c) 2010, ..." beside "Compilation & layout (c) 2011 Catholic Bishops'
  Conference of England and Wales".

  The CBCEW Holy Week excerpts and composers' guides carry "Excerpts from the
  English translation and chants ...", and Lords-Entrance.pdf adds a Revised
  Standard Version notice for the procession Gospels.

  EP1-A4.pdf, EP2-A4.pdf, EP3-A4.pdf, EP4-A4.pdf and Word-bookmark.pdf carry NO
  acknowledgment at all. A file that does not carry one cannot supply it.

The year is not constant either: the Roman Missal English is 2010, Eucharistic
Prayers for Masses with Children is ICEL's at its own year, the Lectionary for
Mass at 1969, 1981 and 1997. So one acknowledgment cannot be generated for the
whole corpus, and the acknowledgment must travel with the words from typed
metadata rather than be written once in a footer.

Condition (2) also fixes the display boundary: the acknowledgment must appear on
the FIRST AND LAST pages or frames within the site displaying the text. And
condition (4) forbids any use of ICEL's name that implies affiliation,
sponsorship or endorsement -- so the acknowledgment says whose the words are and
never suggests that ICEL stands behind this site.
"""
