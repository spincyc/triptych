# ---------------------------------------------------------------------------
# The searches, so that a negative can be read as a bound on a search rather
# than as a claim about the world. guidance/sources.md requires the aliases a
# retrieval used be recorded with it.
# ---------------------------------------------------------------------------

aliases_method = """
Every search was driven from a resolved alias set rather than from one string,
because a work looked for under one name reads afterwards as an absence. The
alias classes that paid off here, in order:

1. THE SEASONAL PART, not the book. `Breviarium Romanum` returns 85 items and
   mostly the wrong centuries; `title:(breviarium) AND (hiemalis OR aestiva OR
   verna OR autumnalis)` was the best single query in the whole search. A
   four-part Breviary is catalogued four times and the useful volume is one of
   them -- see `breviarium-romanum-1942-desclee`, `structural_finding`.
2. THE GAZETTE INSTEAD OF THE BOOK. The decisive source was not found by looking
   for a Breviary at all. The rubrics were promulgated in the Acta and are
   catalogued as a volume of the Acta, under no liturgical title whatever.
3. The Latin heading as printed, for confirming identity inside a text layer:
   `DE OFFICIO DUPLICI`, `DE ORDINANDO OFFICIO`, `ad normam Bull`.

TWO ALIAS CLASSES PRODUCED NOTHING AND THE NEGATIVES ARE RECORDED. On the
Internet Archive, `"rubricis breviarii"` and `"Additiones et Variationes"` each
return ZERO items. Both are the standard printed headings. That is a fact about
full-text search over that repository's holdings under those strings, and not a
fact about the books, every one of which prints them.
"""

[[repositories_searched]]
id = "internet-archive"
how = "advancedsearch.php for candidates, the metadata API to confirm, and each item's own text layer to identify."
aliases_that_hit = [
  'title:("Breviarium Romanum") -- 85',
  'title:(breviarium) AND (hiemalis OR aestiva OR verna OR autumnalis) -- 55, the best query',
  'title:("Breviarium Romanum") AND year:[1912 TO 1955] -- 8',
  'title:(hebdomadae sanctae) AND year:[1955 TO 1962] -- 3',
]
aliases_that_produced_nothing = [
  '"rubricis breviarii" -- 0',
  '"Additiones et Variationes" -- 0',
  '"Maxima Redemptionis" -- 0',
  "creator:(O'Connell) AND rubrics AND breviary -- 0",
]
weak_hits = [
  '"Divino afflatu" -- 6, no Breviary editions among them',
  '"Rubricae generales" -- 4, nothing after 1911',
  'title:("Roman Breviary") -- 111, English devotional only',
]
misidentification_caught = """
`breviariumroman00churgoog` and its two siblings are catalogued by the Internet
Archive as `1946, Benziger`. All three carry `year = 1799` in their own metadata
and their text layers are long-s eighteenth-century type. They are not
post-Divino afflatu books and must not be used. This is the same class of error
the missal audit caught at `missale-romanum-1570-venice`, and it was caught the
same way -- by reading the object instead of the catalogue record.
"""

