# What the pre-1955 recension needs before it can decide a day, and where it is.
#
# A SOURCING RECORD, not an acquisition. Nothing below was added to the
# repository as payload: every row is an identification, a rights position, a
# retrieval route, or a bounded negative, so that a later lane can act
# deliberately rather than on whatever a search returns first.
#
# It sits in inventories/ for the reason its sibling
# `missal-acquisition-audit-v1.toml` gives: `source-library validate` rejects any
# file under src/sources outside its own schema except .md and .toml under
# inventories/, and this record is not ready to be a work in the library.
#
# WHY IT IS SEPARATE FROM THE MISSAL AUDIT. That audit's own `extent` excludes
# the Office `except where one of them is the only carrier of a missal act`. The
# finding recorded here is that for PRECEDENCE the Office is exactly that: the
# pre-1955 Missal says in its own general rubrics that the order of Masses is the
# order of the Office and that translation follows the Breviary. So the books
# this recension needs are not missals, and the audit that covers missals was
# right to leave them out rather than wrong to.

audit_schema = 1
record_type = "recension-rubrics-sources"
slice = "roman-pre-1955"
recorded_on = "2026-08-01"

question = """
`src/sources/calendars/roman-pre-1955/` serves 490 masses and resolves 316 of
the 365 dates of 2026, and it ships no `rubrics.yaml`, so the browser's missal
selector does not offer it. guidance/recensions.md Rule 6 makes that the right
way round -- a recension is offered only where it can be served -- and this file
is the record of what would have to be true for it to be served.

`tools/calendar-rubrics` will not accept a rubrics source that does not state a
precedence table: `check_precedence` fails on `precedence.stated: false` with
`this file exists to state it`, and requires the rows to number 1..N in order.
That is a deliberate refusal to ship a rubrics source that decides nothing, and
it is the reason this file exists rather than a `rubrics.yaml` with a hole in it.

So the whole question reduces to one thing: WHERE IS THE PRE-1955 ORDER OF
PRECEDENCE PRINTED? The answer is not in the Missal, and that is not an
inference. It is what the Missal says.

IT WAS THEN FOUND, AND THE ANSWER MOVED THE PROBLEM RATHER THAN SOLVING IT. The
rule is in the Acta Apostolicae Sedis of 1911, open and publishable. It is not a
table. See `[[findings]]` `the-rule-is-criteria-not-rows`, which is now the
blocking item and is a fact about this repository's tooling rather than about the
availability of any book.
"""

evidence = """
Three evidence levels, and no row claims one it did not reach. The classes are
the ones `missal-acquisition-audit-v1.toml` fixed, used identically here.

  [verified]  Read on 2026-08-01 from bytes fetched for this record, at a
              recorded sha256. Reproducible.
  [sourced]   Read from an external document cited by URL or identifier.
  [recorded]  Taken from a record already in this repository, cited by path,
              and not independently re-verified unless the row says so.

Nothing is asserted from recall. Where a position could not be sourced the field
says `unresolved` or `unrecorded`, and establishing it is treated as the work.
"""

ocr_bound = """
Every pre-1955 reading in this repository, this file included, is through an
Internet Archive OCR text layer. That grade is `ocr-only` in
`roman-holy-week-acts-v1.toml` and it is not a witness to WORDING: this
repository collated 99 orations from one such layer against that printing's page
images and corrected 38 [recorded, guidance/recensions.md section 8.4].

It is admissible for STRUCTURE, and the distinction is what this file rests on.
Whether a book contains a section titled `De Translatione Festorum`, and whether
a numbered table of precedence appears anywhere between two headings, are facts
about the presence and absence of large printed structures over hundreds of
lines. They survive character-level error; a table cannot be spelt away. Every
Latin phrase quoted below is quoted as the OCR gives it and is offered as a
locator, never as a transcription fit to publish.
"""

derivative_hazard = """
INTERNET ARCHIVE DERIVATIVES ARE REGENERATED, AND THIS REPOSITORY ALREADY HOLDS
LOCI PINNED TO OLD ONES. `roman-holy-week-acts-v1.toml` records the 1920 witness
as `MissaleRomanum1920_djvu.txt, 123278 lines, 2918085 bytes`. The copy fetched
on 2026-08-01 from the same item is 119621 lines and 2932349 bytes [verified], so
line numbers pinned against the older derivative land somewhere else in the newer
