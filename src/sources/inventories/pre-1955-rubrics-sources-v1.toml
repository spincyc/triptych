[[wanted]]
id = "breviarium-romanum-pre-1955"
priority = 1
what = "A pre-1955 Breviarium Romanum carrying Rubricae generales Breviarii and the tables of occurrence and concurrence."
why = """
It is the book the Missal points at, and it is the ONLY thing standing between
this recension and a `rubrics.yaml`. Everything else in this file is a smaller
question.

The 1962 calendar's precedence table has 28 rows because the 1960 code prints 28
numbered rows and the rows are addresses later rubrics cite. The pre-1955 regime
has no such table in the Missal, and whether it has one anywhere -- as against an
order recoverable only from prose about occurrence, translation and
commemoration -- is itself unestablished here. If it turns out the pre-1955 order
is nowhere printed as a numbered table, that is a finding about the rite and not
a failure of the search, and `calendar-rubrics` would have to be taught the
difference before a source could be written. THAT QUESTION IS OPEN.
"""
status = "unrecorded"
status_note = """
Left `unrecorded` rather than `not-located`. The distinction is the one
`missal-acquisition-audit-v1.toml` paid for in its `not-located-verdicts`
correction: two rows were written `not-located` on the strength of one
repository's search and the books were in another library the whole time. This
row records that the search has not been completed here, which is a weaker and
truer claim than saying the book was not found.
"""

