THE DRIFT WAS MEASURED, AND IT IS NOT AN OFFSET. Four loci the recension cites
against the 1920 witness were looked for in the 2026-08-01 bytes [verified]:

  cited   found   drift   passage
   9614    9710    +96    Rubricae generales XV, De hora celebrandi Missam
