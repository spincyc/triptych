[[wanted]]
id = "pre-1955-kalendarium-read-as-data"
priority = 3
what = "A pre-1955 general calendar, read from a pre-1955 book, as a list of days with their grades and their octaves and vigils."
why = """
The March 1955 decree names what SURVIVES the simplification and says `omnes
aliae supprimuntur` of the rest. Turning that into departures needs the rest, and
the rest is a pre-1955 kalendarium. Subtracting the 1962 calendar would be the
pre-1955 book reconstructed by undoing 1962, which this recension exists to
refuse.

This is the largest single body of work the recension has left, and it is
deliberately placed below the rubrics, because octaves and vigils are ranked
days and a calendar of ranked days with no rule to rank them by would serve
nothing.
"""
status = "unrecorded"
status_note = """
Both held witnesses print a kalendarium -- the 1942 Benziger at lines 3067-4470
of its text layer. It is set as a multi-column table and the OCR fragments it:
counting `Octava` in that span returns 33 hits and counting `Vigilia` returns 7,
and neither number is a count of anything. It is a floor produced by broken
column reconstruction, and it is recorded here as the reason no figure is stated
rather than as a figure. This must be read from page images.
"""

