"""
not_the_same_book_as = """
`work.catholic-church.ritus-pontificalis-ordinis-hebdomadae-sanctae-instaurati`,
the Ritus Pontificalis Ordinis Hebdomadae Sanctae Instaurati, Vatican 1957, which
