# What the pre-1955 recension needs before it can decide a day, and where it is.
#
# A SOURCING RECORD, not an acquisition. Nothing below was added to the
# repository as payload: every row is an identification, a rights position, a
# retrieval route, or a bounded negative, so that a later lane can act
# deliberately rather than on whatever a search returns first.
#
# It sits in inventories/ for the reason its sibling
# `missal-acquisition-audit-v1.toml` gives: `source-library validate` rejects any
# file under src/sources outside its own schema except .md and .toml under
# inventories/, and this record is not ready to be a work in the library.
#
# WHY IT IS SEPARATE FROM THE MISSAL AUDIT. That audit's own `extent` excludes
# the Office `except where one of them is the only carrier of a missal act`. The
# finding recorded here is that for PRECEDENCE the Office is exactly that: the
# pre-1955 Missal says in its own general rubrics that the order of Masses is the
# order of the Office and that translation follows the Breviary. So the books
# this recension needs are not missals, and the audit that covers missals was
# right to leave them out rather than wrong to.

audit_schema = 1
record_type = "recension-rubrics-sources"
slice = "roman-pre-1955"
recorded_on = "2026-08-01"

question = """
`src/sources/calendars/roman-pre-1955/` serves 490 masses and resolves 316 of
the 365 dates of 2026, and it ships no `rubrics.yaml`, so the browser's missal
selector does not offer it. guidance/recensions.md Rule 6 makes that the right
way round -- a recension is offered only where it can be served -- and this file
is the record of what would have to be true for it to be served.

`tools/calendar-rubrics` will not accept a rubrics source that does not state a
precedence table: `check_precedence` fails on `precedence.stated: false` with
`this file exists to state it`, and requires the rows to number 1..N in order.
That is a deliberate refusal to ship a rubrics source that decides nothing, and
it is the reason this file exists rather than a `rubrics.yaml` with a hole in it.

So the whole question reduces to one thing: WHERE IS THE PRE-1955 ORDER OF
PRECEDENCE PRINTED? The answer is not in the Missal, and that is not an
inference. It is what the Missal says.
"""

evidence = """
Three evidence levels, and no row claims one it did not reach. The classes are
the ones `missal-acquisition-audit-v1.toml` fixed, used identically here.

  [verified]  Read on 2026-08-01 from bytes fetched for this record, at a
              recorded sha256. Reproducible.
  [sourced]   Read from an external document cited by URL or identifier.
  [recorded]  Taken from a record already in this repository, cited by path,
              and not independently re-verified unless the row says so.

Nothing is asserted from recall. Where a position could not be sourced the field
says `unresolved` or `unrecorded`, and establishing it is treated as the work.
"""

ocr_bound = """
Every pre-1955 reading in this repository, this file included, is through an
Internet Archive OCR text layer. That grade is `ocr-only` in
`roman-holy-week-acts-v1.toml` and it is not a witness to WORDING: this
repository collated 99 orations from one such layer against that printing's page
images and corrected 38 [recorded, guidance/recensions.md section 8.4].

It is admissible for STRUCTURE, and the distinction is what this file rests on.
Whether a book contains a section titled `De Translatione Festorum`, and whether
a numbered table of precedence appears anywhere between two headings, are facts
about the presence and absence of large printed structures over hundreds of
lines. They survive character-level error; a table cannot be spelt away. Every
Latin phrase quoted below is quoted as the OCR gives it and is offered as a
locator, never as a transcription fit to publish.
"""

derivative_hazard = """
INTERNET ARCHIVE DERIVATIVES ARE REGENERATED, AND THIS REPOSITORY ALREADY HOLDS
LOCI PINNED TO OLD ONES. `roman-holy-week-acts-v1.toml` records the 1920 witness
as `MissaleRomanum1920_djvu.txt, 123278 lines, 2918085 bytes`. The copy fetched
on 2026-08-01 from the same item is 119621 lines and 2932349 bytes [verified], so
line numbers pinned against the older derivative land somewhere else in the newer
one, or nowhere. Nothing in that inventory is changed here.

Every locus in this file therefore carries the sha256 of the bytes it was read
from, and a locus without one should be treated as unreproducible rather than as
wrong.
"""

# ---------------------------------------------------------------------------
# The finding. It is the reason this file is short and the reason no
# `rubrics.yaml` accompanies it.
# ---------------------------------------------------------------------------

[[findings]]
id = "the-missal-defers-precedence-to-the-office"
claim = "The pre-1955 Missal does not state an order of precedence, and says so itself."
grade = "verified"
basis = """
Two sentences, both in the Missal's own Rubricae generales, both read in two
independent pre-1955 witnesses.

FIRST, the opening rubric of the whole apparatus, before title I:
`Missa quotidie dicitur secundum Ordinem Officii: de Festo Duplici, vel
Semiduplici, vel Simplici: de Dominica, vel Feria, vel Vigilia, vel Octava: et
extra Ordinem Officii, Votiva, vel pro Defunctis.`
The Mass follows the ORDER OF THE OFFICE. The Missal is telling the reader that
the ranking is not its own.

SECOND, title VI, `De Translatione Festorum`, in terms:
`In dicendis Missis servetur Ordo Breviarii de Translatione Festorum Duplicium,
quando majori aliquo Festo, seu Dominica impediuntur.`
When a feast is impeded, what governs is the ORDER OF THE BREVIARY.

That is a book declining jurisdiction over the decision `rubrics.yaml` exists to
record, and it is the single most useful thing established here.
"""
loci = [
  "missale-romanum-1920 8894-8897 (opening rubric) and 9134-9136 (title VI), sha256 eaf3ba379d4d9c0227ce991ac34be66e5177ab52642a8e0376776be81fd0041a",
  "benziger-1942 4497-4501 (opening rubric) and 4722-4726 (title VI), sha256 724a04fa083f780580a066b6ff2cad806190406d0c2112f74d2d8b8efbfc4bcb",
]
consequence = """
A pre-1955 `rubrics.yaml` CANNOT BE BUILT FROM A MISSAL WITNESS, and this
repository holds only missal witnesses for the period. The 1962 calendar's
rubrics source could be built from a missal because the 1960 code reprints its
pars prima and pars tertia at the front of the 1962 typical edition; the
pre-1955 books carry no such reprint, because before 1960 there was no such code.

This is not a gap that a more careful reading of the Missal would close. It is
the Missal saying the answer is in another book.
"""

[[findings]]
id = "the-two-witnesses-disagree-about-the-hour"
claim = "The general rubric De hora celebrandi Missam differs between two pre-1955 printings."
grade = "verified"
basis = """
The 1920 typical edition prints `Missa privata saltem post Matutinum et Laudes
quacumque hora ab aurora usque ad meridiem dici potest`. The 1942 Benziger
prints the same title with a wider window, `ab una hora ante auroram usque ad
unam horam post meridiem`, which is the measure of canon 821 of the 1917 Code
rather than the older rubric.

Recorded because `src/sources/calendars/roman-pre-1955/propers.yaml` argues from
this rubric in its largest departure, the Easter Vigil, and because it is a
worked example of the hazard guidance/recensions.md Rule 5 names: `pre-1955` is
a boundary and not an edition, and one witness does not speak for the state.
"""
loci = [
  "missale-romanum-1920 9710-9713, sha256 eaf3ba379d4d9c0227ce991ac34be66e5177ab52642a8e0376776be81fd0041a",
  "benziger-1942 5248-5250, sha256 724a04fa083f780580a066b6ff2cad806190406d0c2112f74d2d8b8efbfc4bcb",
]
consequence = """
The Easter Vigil row's conclusion is untouched -- one hour after noon is still
not the night the reform moved the Vigil to -- and its reasoning is narrowed.
Both are recorded in that file's `open_collation_items`.
"""

[[findings]]
id = "holy-thursday-carries-one-mass"
claim = "Neither pre-1955 witness prints a Chrism Mass; Holy Thursday has one Introit."
grade = "verified"
basis = """
In each witness the span from the Holy Thursday heading to the Good Friday
heading contains exactly one `Introitus`, `Gal. 6, 14`, `Nos autem gloriari`, and
the string `Chrismatis` occurs nowhere in Holy Week in either book. Immediately
before the heading the 1920 witness prints `Triduo sequenti prohibentur omnes
Missae privatae`, which forbids the other Masses rather than merely omitting them.

This closed an open question that had been carried deliberately unanswered, and
the departure now stands in the recension with this reading as its basis.
"""
loci = [
  "missale-romanum-1920 34612-35196, single Introit at 34620, next day at 35197",
  "benziger-1942 32721-33444, single Introit at 32730",
]
consequence = """
It is a statement about THE MISSAL. In the pre-1955 rite the oils are blessed
within the one Mass of the Lord's Supper by a rite the Pontificale Romanum
carries; no pre-1955 Pontificale has been read here, so the recension says
nothing about the blessing of the oils. See `[[wanted]]` `pontificale-pre-1955`.
"""

