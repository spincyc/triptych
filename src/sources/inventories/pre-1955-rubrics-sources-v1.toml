[[findings]]
id = "the-missal-defers-precedence-to-the-office"
claim = "The pre-1955 Missal does not state an order of precedence, and says so itself."
grade = "verified"
basis = """
Two sentences, both in the Missal's own Rubricae generales, both read in two
independent pre-1955 witnesses.

FIRST, the opening rubric of the whole apparatus, before title I:
`Missa quotidie dicitur secundum Ordinem Officii: de Festo Duplici, vel
Semiduplici, vel Simplici: de Dominica, vel Feria, vel Vigilia, vel Octava: et
extra Ordinem Officii, Votiva, vel pro Defunctis.`
The Mass follows the ORDER OF THE OFFICE. The Missal is telling the reader that
the ranking is not its own.

SECOND, title VI, `De Translatione Festorum`, in terms:
`In dicendis Missis servetur Ordo Breviarii de Translatione Festorum Duplicium,
quando majori aliquo Festo, seu Dominica impediuntur.`
When a feast is impeded, what governs is the ORDER OF THE BREVIARY.

That is a book declining jurisdiction over the decision `rubrics.yaml` exists to
record, and it is the single most useful thing established here.
"""
loci = [
  "missale-romanum-1920 8894-8897 (opening rubric) and 9134-9136 (title VI), sha256 eaf3ba379d4d9c0227ce991ac34be66e5177ab52642a8e0376776be81fd0041a",
  "benziger-1942 4497-4501 (opening rubric) and 4722-4726 (title VI), sha256 724a04fa083f780580a066b6ff2cad806190406d0c2112f74d2d8b8efbfc4bcb",
]
consequence = """
A pre-1955 `rubrics.yaml` CANNOT BE BUILT FROM A MISSAL WITNESS, and this
repository holds only missal witnesses for the period. The 1962 calendar's
rubrics source could be built from a missal because the 1960 code reprints its
pars prima and pars tertia at the front of the 1962 typical edition; the
pre-1955 books carry no such reprint, because before 1960 there was no such code.

This is not a gap that a more careful reading of the Missal would close. It is
the Missal saying the answer is in another book.
"""

[[findings]]
id = "the-rule-is-criteria-not-rows"
claim = "The pre-1955 order of precedence is five ordered criteria, not a numbered table, and this repository's rubrics schema can only express a numbered table."
grade = "verified"
basis = """
The rule was located and read whole. It is Titulus II, `De Festorum praestantia`,
of the `RUBRICAE IN RECITATIONE DIVINI OFFICII ET IN MISSARUM CELEBRATIONE
SERVANDAE AD NORMAM CONSTITUTIONIS APOSTOLICAE DIVINO AFFLATU`, at Acta
Apostolicae Sedis 3 (1911) 641-642. It opens by saying what it is for:

  `Ut recte dignoscatur quale ex pluribus Officiis sit praestantius et proinde
  sive in occurrentia, sive in concurrentia, sive in ordine repositionis aut
  translationis praeferendum, sequentes praestantiae characteres considerandi
  sunt`

and then gives five characters, in order:

  a) `Ritus altior`, unless a Sunday, a feria, a privileged octave or any octave
     day under the Rubrics occurs;
  b) `Ratio Primarii aut Secundarii`;
  c) `Dignitas Personalis`, in a stated order -- feasts of the Lord, of the
     Blessed Virgin, of the Angels, of St John the Baptist, of St Joseph, of the
     Apostles and Evangelists;
  d) `Sollemnitas externa`, that is, whether the feast is of obligation or has an
     octave;
  e) `Proprietas Festorum`, which n. 2 says applies IN OCCURRENCE AND IN
     REPOSITION OR TRANSLATION ONLY and not in concurrence, with its own
     exceptions for Sundays, ferias, privileged octaves and vigils, and primary
     first-class feasts of the universal Church.

THIS IS A COMPARISON, NOT A POSITION. Two days are ranked by taking the criteria
in order until one separates them. The 1960 code replaced it with a table of
twenty-eight numbered rows whose numbers later rubrics cite as addresses, and
that is the shape `tools/calendar-rubrics` models: `check_precedence` requires
`rows` numbering 1..N in order, and `check_bases` requires each competing basis
to name one of those rows.

There is no honest mapping. Criterion (a) alone ranges over grades and over four
exceptions that are not grades; criterion (e) applies to some questions and not
others, so the same two days can be ordered differently in occurrence and in
concurrence -- which a single row number cannot express, because a row number is
one order for all questions.
"""
loci = [
  "AAS 3 (1911) 641-642, in AAS-03-1911-ocr.pdf, sha256 590a78b670da67f013ea6fc0b62bb7ed347dc89a9267fbb7ddc0380f1e872f7c, 3418093 bytes, fetched from vatican.va 2026-08-01; pdftotext lines 24105-24125",
]
consequence = """
THE BLOCKER IS NO LONGER SOURCING. The rule is found, it is open, it is
`public-domain-us-pre-1931`, and it may be published. What is missing is that
this repository's rubrics schema admits one shape of precedence, and the
pre-1955 rite has another.

Writing a `rubrics.yaml` anyway would mean inventing a linear table by flattening
five criteria that do not flatten, giving each row a number no book prints, and
letting `assembly-model.js` compare those numbers. It would validate, it would
resolve every day, and it would decide days wrongly -- the exact failure
guidance/the-shape.md section 1 says wears every costume, committed in the file
written to prevent it.

So guidance/recensions.md Rule 6 still holds and now has a sharper reason: the
calendar is not offered because the tool cannot yet state its rule, not because
nobody has found the book. What would have to change is `check_precedence`, and
after it the winner comparison in `assembly-model.js`, which today is
`for (const one of standing) if (one.row < best.row) best = one` -- a comparison
of one integer. That is a deliberate design change and not a patch, and it should
be argued before it is written.
"""

[[findings]]
id = "the-1955-simplification-states-its-own-extent"
claim = "The 23 March 1955 decree names the vigils and octaves that survive, so the size of that departure set comes from the act rather than from comparing calendars."
grade = "verified"
basis = """
`DE RUBRICIS AD SIMPLICIOREM FORMAM REDIGENDIS`, Sacred Congregation of Rites,
`die 23 mensis Martii anni 1955`, at AAS 47 (1955) 218-224, read whole. It takes
effect `kalendis Ianuariis anni 1956`. Titulus II, `VARIATIONES IN CALENDARIO`,
states the extent in three places:

  n. 1  `Gradus et ritus semiduplex supprimitur.` The semidouble grade is
        abolished outright, which is the ranking-vocabulary change.
  n. 9  Common vigils are Ascension, the Assumption, St John the Baptist, SS
        Peter and Paul, and St Lawrence; privileged are the Nativity and
        Pentecost (n. 8). `Omnes aliae vigiliae, etiam quae calendariis
        particularibus sunt inscriptae, supprimuntur.`
  n. 11 `Celebrantur tantum octavae Nativitatis Domini, Paschatis et Pentecostes,
        suppressis omnibus aliis`, in the universal and in particular calendars
        alike. n. 15 suppresses the octave of the Epiphany by name.

SEVEN VIGILS AND THREE OCTAVES SURVIVE, AND EVERY OTHER ONE GOES. That is the
extent of the largest unstated departure set in the recension, stated by the act
itself.
"""
loci = [
  "AAS 47 (1955) 218-224, in AAS-47-1955-ocr.pdf, sha256 87faf82170a12abb564990fb189f289258327b1279469768be4af4883eb74d58, 4272421 bytes, fetched from vatican.va 2026-08-01; pdftotext lines 11479-11625",
]
consequence = """
The recension still states none of these departures, and now says so with a
citation rather than with a shrug. They are calendar-wide and rubrical, and they
cannot be written without the rubrics source this file is about.

Note what the decree does NOT give: it names what survives, not what dies. Turning
`omnes aliae supprimuntur` into a list of departures needs a pre-1955 calendar to
subtract from -- and subtracting the 1962 calendar would be the pre-1955 book
reconstructed by undoing 1962. The list has to come from a pre-1955 book's own
kalendarium.
"""

[[findings]]
id = "the-two-witnesses-disagree-about-the-hour"
claim = "The general rubric De hora celebrandi Missam differs between two pre-1955 printings."
grade = "verified"
basis = """
The 1920 typical edition prints `Missa privata saltem post Matutinum et Laudes
quacumque hora ab aurora usque ad meridiem dici potest`. The 1942 Benziger
prints the same title with a wider window, `ab una hora ante auroram usque ad
unam horam post meridiem`, which is the measure of canon 821 of the 1917 Code
rather than the older rubric.

Recorded because `src/sources/calendars/roman-pre-1955/propers.yaml` argues from
this rubric in its largest departure, the Easter Vigil, and because it is a
worked example of the hazard guidance/recensions.md Rule 5 names: `pre-1955` is
a boundary and not an edition, and one witness does not speak for the state.
"""
loci = [
  "missale-romanum-1920 9710-9713, sha256 eaf3ba379d4d9c0227ce991ac34be66e5177ab52642a8e0376776be81fd0041a",
  "benziger-1942 5248-5250, sha256 724a04fa083f780580a066b6ff2cad806190406d0c2112f74d2d8b8efbfc4bcb",
]
consequence = """
The Easter Vigil row's conclusion is untouched -- one hour after noon is still
not the night the reform moved the Vigil to -- and its reasoning is narrowed.
Both are recorded in that file's `open_collation_items`.
"""

[[findings]]
id = "holy-thursday-carries-one-mass"
claim = "Neither pre-1955 witness prints a Chrism Mass; Holy Thursday has one Introit."
grade = "verified"
basis = """
In each witness the span from the Holy Thursday heading to the Good Friday
heading contains exactly one `Introitus`, `Gal. 6, 14`, `Nos autem gloriari`, and
the string `Chrismatis` occurs nowhere in Holy Week in either book. Immediately
before the heading the 1920 witness prints `Triduo sequenti prohibentur omnes
Missae privatae`, which forbids the other Masses rather than merely omitting them.

This closed an open question that had been carried deliberately unanswered, and
the departure now stands in the recension with this reading as its basis.
"""
loci = [
  "missale-romanum-1920 34612-35196, single Introit at 34620, next day at 35197",
  "benziger-1942 32721-33444, single Introit at 32730",
]
consequence = """
It is a statement about THE MISSAL. In the pre-1955 rite the oils are blessed
within the one Mass of the Lord's Supper by a rite the Pontificale Romanum
carries; no pre-1955 Pontificale has been read here, so the recension says
nothing about the blessing of the oils. See `[[wanted]]` `pontificale-pre-1955`.
"""

