[[wanted]]
id = "de-rubricis-simpliciorem-1955"
priority = 3
what = "The decree De rubricis ad simpliciorem formam redigendis, Sacred Congregation of Rites, 23 March 1955, in Acta Apostolicae Sedis 47 (1955)."
why = """
`src/sources/inventories/latin-missal-acts-v1.toml` already models this act. It
removed most octaves and vigils and changed the ranking vocabulary, and those are
calendar-wide rubrical departures -- probably the largest set this recension will
ever carry. NOT ONE of them is stated in the recension, because they are rubrical
and it ships no rubrics source.

The decree is what fixes the extent of that set. Without it the recension cannot
say which octaves and vigils the pre-1955 books keep that the 1962 book does not,
and an attempt to answer it by comparing calendars would be the pre-1955 book
reconstructed by undoing 1962.
"""
