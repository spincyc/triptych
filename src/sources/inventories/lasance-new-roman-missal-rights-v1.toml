# --- The scan and its OCR text layer ------------------------------------------

[the_ocr_text_layer]
question = "Does the scan, or its machine-generated text layer, carry a copyright of its own?"
answer = "No."
reasoning = """
A faithful mechanical reproduction of a public-domain work is not original
authorship: Bridgeman Art Library v. Corel Corp., 36 F. Supp. 2d 191 (S.D.N.Y.
1999). Machine OCR adds no human authorship on top of that -- it is a
transcription performed by a program, and there is no author to hold a right.
So there is no new layer between the reader and the underlying text.
"""
the_repository_already_reasons_this_way = """
This is the SAME reasoning already applied here to the CMAA 1962 facsimile
[recorded, guidance/missals.md:325-346], and the comparison is worth drawing
because the two cases end differently.

There, the scan argument stood ALONE. It disposed of a licence somebody had
applied to the bytes -- "it confers nothing" -- and left the underlying question
exactly where it was, which is why `unresolved` on that artifact stands and is
correct: absence of a notice is not a grant.

Here the underlying work has an affirmative basis of its own. The scan argument
therefore completes a case instead of substituting for one. That difference is
the whole difference, and it is why this record exists at all.
"""
what_it_does_not_do = """
It does not make availability a basis. guidance/sources.md is explicit that
online availability and successful download are insufficient, and this record
relies on neither: it relies on two registration numbers and five searched
corpora. An Internet Archive public-domain mark on this item would add nothing
to this file and its absence would subtract nothing.
"""

# --- The 1942 Benziger, settled by the same method ----------------------------

