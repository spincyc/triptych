id = "english-translation"
what = "The English of the Mass and of the propers -- the valuable layer, and the reason this decision was worth making."
basis = "Inside A 110108 and A 192159, both unrenewed. Public domain in the United States."
why_it_matters = "It is the only twentieth-century English witness this project has below the postconciliar line: the only English rendering of the recension the 1962 books belong to, in the English of the century that used them [recorded, lt-hist-rights-audit-v1.toml]. Everything else English in that corpus is an 1806 or 1843 lay missal of the older recension, or an ICEL text nobody may publish."

[[layers_freed.layer]]
id = "devotional-and-instructional-matter"
what = "Lasance's and Walsh's own prefaces, instructions, meditations, glossary of liturgical terms, saints' lives and prayers for private devotion -- the material the 1937 registration entry itemises at length."
basis = "Inside the same two unrenewed registrations."

[[layers_freed.layer]]
