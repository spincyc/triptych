# --- The residual gap, recorded as an exclusion -------------------------------

[the_appendix_exclusion]
what = "Pages 1298a-1298n of the local artifact: the four post-1954 feasts, their propers and their notes."
disposition = "EXCLUDED from any publication basis until the printing is dated from a physical copy."
why = """
This is new matter, first published after October 1954, and no registration for
it was found. Searching the 1923-63 registration corpus and the whole renewal
corpus turns up no Benziger or Lasance registration of The New Roman Missal
after A 192159, and no renewal naming Lasance anywhere in the 1978-2001 files
[verified].

That leaves two branches and this record cannot choose between them from the
text:

  If first published 1955-1963, its own renewal window fell in 1983-1991. The
  NYPL corpus covers those years from the Copyright Office database, and it
  contains no Lasance renewal at all after 1963 [verified]. On that branch the
  appendix is public domain too.

  If first published 1964 or later, renewal became automatic and it would be
  protected for 95 years from publication -- to the end of 2059 at the earliest.

Internal evidence puts it at 1955-56: it prints two feasts of late 1954 and its
body was not reset for the 1955 Holy Week reform. That is an inference from the
text, not a record, and this project does not convert an inference into a rights
basis. The whole point of this file is that a conclusion without a record is the
thing being corrected.
"""
what_would_close_it = "A physical copy, or a scan of a title page or copyright leaf, giving the printing's own date. Fourteen pages of a 1,298-page book are at stake; the exclusion costs almost nothing and closing it is not urgent."
evidence = "verified"

# --- What is freed ------------------------------------------------------------

[layers_freed]
note = "Rights are recorded per layer, as guidance/sources.md requires, because a book like this is four or five works bound together and they do not all have the same history."

