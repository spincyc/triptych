# --- The controls that make the negative mean something -----------------------

[positive_controls]
why = """
THIS IS THE PART THAT DISTINGUISHES THIS RECORD FROM THE ONE IT SUPERSEDES. An
OCR search of dense small-type multi-column print fails silently: a miss on a
number returns exactly what a genuine absence returns. So the same search, run
the same way, over the same bytes, was pointed at registrations that ARE known
to have been renewed. If it finds those and not this one, the negative is
evidence. If it found nothing at all, it would be noise.

All three controls were retrieved from Third Series vol. 18, Part 1, Number 2 --
Books and Pamphlets, July-December 1964 -- which is precisely the volume in
which a renewal of A 110108 filed at the earliest opportunity would have been
printed.
"""

[[positive_controls.control]]
kind = "same registration day"
registration = "A 108209, 15 July 1937"
renewal = "R341887, 22 July 1964"
as_printed = "DAVIS, CLYDE BRION. The anointed. (c) 15Jul37; A108209. David B. Davis (C); 22Jul64; R341887."
located = "catalogofcopyrig31812libr.txt line 387194-387196"
evidence = "verified"

[[positive_controls.control]]
kind = "same registration day"
registration = "A 109027, 15 July 1937"
renewal = "R344660, 11 September 1964"
as_printed = "MONTGOMERY, RUTHERFORD. Yellow Eyes. Illustrated by L. D. Cram. (c) 15Jul37; A109027. Rutherford Montgomery (A); 11Sep64; R344660."
located = "catalogofcopyrig31812libr.txt line 400866-400868"
evidence = "verified"

[[positive_controls.control]]
kind = "adjacent registration number, different day"
registration = "A 110619, 16 September 1937"
renewal = "R346639, 15 October 1964"
as_printed = "AIGLER, RALPH W. Cases on the law of negotiable paper and banking. (American casebook series, Warren A. Seavey, general editor) (c) 16Sep37; A110619. West Pub. Co. (PWH); 15Oct64; R346639."
located = "catalogofcopyrig31812libr.txt line 379190-379193"
note = "Adjacent in number to A 110108, five hundred and eleven registrations away, but registered two months later. It controls for the number range, not for the day; the first two control for the day."
evidence = "verified"

[positive_controls.reading]
text = """
Two registrations made on the very day A 110108 was made, and one made 511
numbers above it, are all retrievable from the OCR by number. A 110108 is not.
That is what makes "no renewal" a finding rather than a failed search.
"""

# --- The honest caveat, which is not omitted ----------------------------------

[the_publishers_programme]
what_it_would_have_shown = """
The strongest form of a non-renewal argument is a publisher who plainly was
renewing, title by title, in the relevant years, and who visibly did not renew
this one. Benziger renewed Lasance titles systematically. Among 15 Lasance
renewals in the NYPL corpus [verified]:

  R63317   1950-06-19  Holy souls book                 A677977, 1922
  R74070   1951-02-09  My God and my all               A698801, 1923
  R83896   1951-10-01  Our Lady book                   A792096, 1924
  R85220   1951-10-29  The new missal for every day     A792943, 1924
  R101887  1952-10-31  New missal for every day, rev.   A822299, 1925
  R101895  1952-10-31  Let us pray                      A829379, 1925
  R129414  1954-04-28  Lift up your hearts              A958277, 1926
  R188970  1957-04-02  Come Holy Spirit                 AA32477, 1929
  R211842  1958-03-31  Sweet Sacrament, we Thee adore   A36356, 1930
  R224775  1958-11-07  Let us go to Jesus               A46349, 1951
  R247840  1959-12-23  The new missal for every day     A58107, 1932
  R257384  1960-05-23  Road to happiness                A62537, 1933
  R283542  1961-10-17  Novenas ... Holy Ghost           AA159718, 1934
  R285774  1961-11-27  Holiness and happiness           A78223, 1934
  R311234  1963-02-27  Self conquest                    A121510, 1936

Self conquest is the closest analogue: a 1936 Lasance registration, renewed by
Benziger as proprietor on 27 February 1963 [verified, NYPL 1963-1.tsv line 1648,
CCE Third Series vol. 17 Part 1 no. 1 p. 959]. A 1936 registration renewed and a
1937 registration not renewed, by the same publisher, on the same author, would
be a visible choice.
"""
but = """
IT IS NOT A VISIBLE CHOICE, AND THIS RECORD SAYS SO RATHER THAN LEAVING IT OUT.
Benziger's renewal filings, counted by year over the whole NYPL corpus
[verified], are:

  1950  10    1955  16    1960  11    1965   0    1970   0    1975   2
  1951  17    1956   2    1961  12    1966   0    1971   0    1976   1
  1952  19    1957   9    1962   2    1967   0    1972   0    1977   0
  1953   0    1958  28    1963   4    1968   0    1973   0
  1954  23    1959  10    1964   0    1969   4    1974   0

Benziger filed ZERO renewals in 1964 through 1968. The 1937 edition's window
falls entirely inside that gap. So this title's absence sits inside a hole in
the publisher's own programme rather than beside a decision to renew its
neighbours, and the batch inference is correspondingly weak.

The legal conclusion is untouched. A lapsed renewal programme produces
public-domain works exactly as surely as a decision does; the Copyright Act
attached the consequence to the absence of a filing, not to the state of mind
behind it. What is weakened is the rhetorical support, and this record does not
help itself to support it does not have.
"""
and_the_second_window = """
The 1945 edition had a wholly separate window, 1 November 1972 to 1 November
1973, and it was missed too. That is a second independent failure to renew, at a
different date, on a different registration.

CORRECTING THE BRIEF, AGAINST THIS RECORD'S OWN INTEREST. The brief said the
1972-73 window fell "in a period when Benziger WAS filing again". It did not.
Benziger's four 1969 filings were all made on a single day, 14 May 1969, all on
1941 registrations; the corpus then records nothing from Benziger in 1970, 1971,
1972, 1973 or 1974, and only three more ever -- the Summa theologica volumes in
1975 and 1976 [verified]. Both windows therefore fall in quiet stretches. The
two failures remain independent of one another and remain dispositive; they are
not two instances of a publisher choosing.
"""
evidence = "verified"

# --- What is deliberately NOT relied on ---------------------------------------

[the_online_catalog_is_not_relied_on]
why = """
A negative result in the Copyright Office's online catalog would prove almost
nothing about a 1964-65 renewal, and this record does not use one. The Office
publishes its own digitisation progress, and the two figures that matter are
[sourced, https://www.copyright.gov/historic-records/, fetched 2026-08-01]:

  Card Catalog (1870-1977)          99% digitally available online,
                                    22.1% SEARCHABLE IN CPRS
  Catalog of Copyright Entries      100% digitally available online,
                                    0% SEARCHABLE IN CPRS

Zero per cent. The Catalog of Copyright Entries -- which is the publication in
which a 1964 or 1965 book renewal was printed, and the publication this record's
whole negative rests on -- is not searchable in the online system at all, and
just over a fifth of the card catalog is. Anyone who searches the online catalog
for this title, finds nothing, and reports the work free has produced no
evidence whatever. That is recorded here so the negative in this file is not
mistaken for that one.
"""
what_this_record_did_instead = "Searched the printed record itself, in four independent transcriptions and one raw OCR layer, at the level of the registration number, with positive controls drawn from the same layer."
the_residual_repository = """
The Virtual Card Catalog is the one repository this record could not search
exhaustively. It is an image browse over roughly 41.5 million scanned cards with
no programmatic query interface, so it cannot be swept the way the corpora above
were swept [sourced]. If a renewal exists that every transcription above missed,
that is where it would be. This record does not claim to have excluded it; it
claims that five independent routes through the published record found nothing
while demonstrably being able to find its neighbours.
"""

