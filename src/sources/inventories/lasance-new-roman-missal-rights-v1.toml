# Whether Lasance and Walsh's The New Roman Missal may be published here,
# settled once so that it is not settled again.
#
# This file exists because the question was live in three places at once and
# answered in none of them: `lt-hist-rights-audit-v1.toml` recorded it as the
# open question `lasance-renewal` and called it "THE HIGHEST-VALUE DECISION IN
# THE FILE"; the sibling corpus at ~/git/lt-hist asserted the answer 56 times in
# 15 wordings without arguing it once; and this repository's own guidance had
# nothing. guidance/sources.md is explicit that a rights position stated only in
# prose, in three places, in three wordings, is three positions. What follows is
# the position, the record it rests on, the controls that make a negative
# meaningful, what is NOT freed, and what would overturn it.
#
# It is not legal advice, it is not an opinion of counsel, and it binds nobody
# outside this repository. It is the project's own reading, held to the same
# standard as any other claim here. Where it states a proposition of law it
# states the jurisdiction, and the jurisdiction throughout is the United States.

rights_schema = 1
record_type = "lasance-new-roman-missal-rights"
recorded_on = "2026-08-01"
jurisdiction = "United States"
closes_open_question = "lasance-renewal, src/sources/inventories/lt-hist-rights-audit-v1.toml"

holding = """
The New Roman Missal of F. X. Lasance and Francis Augustine Walsh is in the
public domain in the United States, in both of its registered editions, because
the copyright in neither was renewed in its twenty-eighth year. The 1937 first
edition was registered A 110108 on 15 July 1937 and its renewal window closed on
15 July 1965 unused. The 1945 revised edition was registered A 192159 on
1 November 1945 and its renewal window closed on 1 November 1973 unused.

The finding is established at REGISTRATION-NUMBER level in the Copyright
Office's own published record, not by a title search, and it carries positive
controls: the same mechanical search that returns nothing for these two numbers
returns renewals of registrations made on the identical day and at adjacent
numbers. A negative without controls is indistinguishable from a bad search,
which is the exact failure mode of the earlier attempt this record supersedes.

Two things are NOT freed and must travel with any use of this text. The appendix
at pages 1298a-1298n of the local artifact is later matter, first published about
1955 under no registration this record could find, and is EXCLUDED. And other
Lasance titles WERE renewed -- The New Missal for Every Day is a different book
and is not free. See `[not_freed]`.
"""

