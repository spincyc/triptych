"""
not_verified_here = "The brief dated A 101487 to 16 September 1936. This lane did not confirm that date: the spreadsheet rows carry no registration date and the 1936 registration volume was not opened for it. The date is unrecorded here rather than restated."

[[layers_freed.layer]]
id = "latin-missale-romanum"
what = "The Latin of the Missale Romanum printed opposite the English."
basis = "Clear on its own age, independently of any renewal question: the text is that of the Tridentine recension as revised through Benedict XV, and this repository's line for works first published abroad is before 1931 [recorded, guidance/missals.md]. Nothing in this record is needed for it, and nothing in this record disturbs it."
caveat = "THAT LINE GOES STALE EVERY JANUARY [recorded, guidance/missals.md:257]. Do not take 'pre-1931' from this file as a standing rule."

[authors]
lasance = "Francis Xavier Lasance, 1860 - 11 December 1946 [sourced]."
walsh = "Francis Augustine Walsh, 1884 - 1938 [sourced, the Library of Congress name-authority form 'Walsh, Francis Augustine, 1884-1938']. The brief gave 12 August 1938; this lane could not confirm the day and records only the year."
why_it_is_here = """
Both authors were dead before the 1964 window opened, so the renewal right did
not lie with them or fall to be exercised by them. On a composite work made for
or acquired by a publisher, and on this record's face, the renewal fell to
Benziger Brothers as proprietor -- which is how Benziger is recorded as claimant
(PWH) on every one of the fifteen Lasance renewals it did file. Benziger did not
file for this one. There is no surviving author or heir whose separate right
might have been exercised and gone unrecorded under a different heading.
"""

