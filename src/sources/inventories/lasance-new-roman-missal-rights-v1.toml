guidance/missals.md:345].
"""
the_search_that_was_missing = """
It has now been run, by the same method and over the same corpora. Benziger's
Missale Romanum registrations of the period, with their CCE entries read here
[verified]:

  A 165097   29 May 1942   "Missale ro-manum. Editio juxta vaticanam. U. S. A.
                           Liturgical ed."          CCE NS 39 (1942) p. 179
  A 169238   13 Oct 1942   "Editio juxta typicam vaticanam. [Small quarto
                           [ed. no. 4]"             CCE NS 39 (1942) p. 301
  A 174919   1943          "Editio juxta typicam Vaticanam"   [date unverified]
  A 180761   1944          registration entry not opened here [date unverified]
  A 186310   22 Aug 1944   "Editio III juxta typicam Vaticanam."
                                                    CCE NS 42 (1945) p. 45
  A 5373     20 Oct 1945   "Editio IV juxta typicam vaticanam amplificata II
                           ... Neo Eboraci, Bostonioe [etc.] Benziger brothers,
                           inc. [1945]"             CCE NS 43 (1946) p. 109

Five of the six -- A 165097, A 169238, A 174919, A 180761, A 186310 -- stand in
FINAL-not-renewed.tsv with disposition "Not renewed." [verified]. None of the
six is cited by any renewal in the Stanford dump or in the NYPL corpus
[verified]. Benziger filed no renewal at all in 1970-1974, which is where the
windows of the 1942 and 1943 registrations fall.
"""
the_sixth_registration = """
A 5373 IS DIFFERENT AND THE BRIEF WAS WRONG ABOUT IT. It is NOT in
FINAL-not-renewed. It sits in FINAL-renewed.tsv with disposition "Possibly
renewed, but none of these renewals seem like a good match." [verified].

The apparent match is a registration-number collision within class A: A 5373 was
also the number of a 1929 Harper registration, renewed as R172595 on 13 June
1956 -- "ODENCRANTZ, LOUISE C. The social worker in family, medical and
psychiatric social work. (c) 15Feb29; A5373. Louise C. Odencrantz (A); 13Jun56;
R172595." [verified, NYPL 1956-1.tsv line 1489]. That renewal is a different
work by a different claimant on a registration made sixteen years earlier. It is
not a renewal of the Benziger missal, and the spreadsheet's own README warns
that exactly this happens.

So A 5373 is unrenewed on the evidence, but it reaches that state through a
disambiguation rather than through a clean lookup, and this record says which.
"""
the_other_collision = """
A 169238 has a collision too, and the brief named it correctly: AA 169238 is
Rossini's Canticum novum, renewed R298828 on 20 July 1962 [verified, NYPL
1962-1.tsv line 4754]. Class AA, not class A -- a different registration series.

There is a SECOND false-positive route the brief did not name: R169238 is itself
a renewal number, belonging to King's Trends in Philanthropy [verified, NYPL
1956-1.tsv line 1123]. A bare string search for "169238" therefore returns two
irrelevant hits before it returns none that matter. Recorded so the next reader
does not mistake either for a renewal of the missal.
"""
verdict = """
MOVED FROM `unresolved` TO A RENEWAL-BASED BASIS, SUBJECT TO CONFIRMATION FROM
THE ARTIFACT'S OWN TITLE PAGE. Those words are the disposition, not a hedge
around it.

The renewal question is answered: every Benziger Missale Romanum registration of
1942-1945 is unrenewed, and the artifact's recorded copyright line of "1942 and
1944" corresponds to A 169238 and A 186310. What has NOT been done is opening
the artifact's own title page and copyright leaf to confirm WHICH registration
this scan corresponds to. Nobody has done it, this lane did not do it, and the
identification therefore rests on a copyright line recorded elsewhere in this
repository rather than on the book.

There is a live tension in that identification which is a further reason to
confirm it: the artifact is LABELLED "editio IV iuxta typicam Vaticanam", and
"Editio IV ... amplificata II" is A 5373 of 1945 -- the one registration of the
six with a collision to disambiguate -- while the recorded copyright line of
1942 and 1944 points instead at A 169238 and A 186310. The label and the
copyright line do not point at the same registration. Since all six are
unrenewed the verdict is the same on every branch, which is why the basis may
move now; but the identification is unsettled and is recorded as unsettled.
"""
evidence = "verified"

# --- What would overturn this -------------------------------------------------

[what_would_overturn_this]
note = "Stated concretely, so that a later reader can attack this record on its own terms rather than re-deriving it."
items = """
  1.  A RENEWAL REGISTRATION citing A 110108 or A 192159. Any single one
      overturns the finding for the edition it names. The most likely place for
      one to be hiding is the Virtual Card Catalog, which could not be swept --
      see `[the_online_catalog_is_not_relied_on]`. A renewal filed under a
      heading none of the five routes above would reach is the only failure mode
      this record cannot exclude, and the corporate heading "Catholic church.
      Liturgy and ritual." is precisely the kind of heading that would do it.

  2.  A THIRD REGISTRATION, later than A 192159, on a further revised edition
      whose window fell in or after 1964, where renewal was automatic. None was
      found in the 1923-63 corpus, but that corpus stops in 1963 and the
      appendix proves that printings continued.

  3.  EVIDENCE THAT THE APPENDIX IS 1964 OR LATER, which would not disturb the
      two editions but would harden the exclusion at `[the_appendix_exclusion]`
      from a precaution into a finding.

  4.  A DEMONSTRATION THAT THE CONTROLS DO NOT CONTROL -- for instance, that the
      volume in which A 108209 and A 109027 were found was indexed by a
      different process from the pages where A 110108 would have appeared. The
      controls were taken from the same volume and the same OCR file for exactly
      this reason, but the argument is available and would bite if it held.

  5.  A CHANGE IN LAW restoring or extending terms for unrenewed 1937 and 1945
      United States works. Nothing of the kind is pending; recorded because a
      rights record that lists no such condition is claiming a permanence it
      does not have.

Note what does NOT overturn it: absence from the Copyright Office online
catalog, absence of an Internet Archive public-domain mark, presence of an
Internet Archive mark of any kind, or the "Copyright, 1936, by Benziger
Brothers" notice at line 70 of the local artifact. A notice establishes that a
term began. This record establishes that it ended.
"""

