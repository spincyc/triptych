# ---------------------------------------------------------------------------
# What the book is, physically, which decides the cost of everything else
# ---------------------------------------------------------------------------

[layout]
evidence = "verified"
finding = """
SCRIPTURE IS ON THE VERSO ONLY. Each opening carries the scripture on the
left-hand page and the introduction-and-notes on the facing right-hand page.
Printed p. 308 is scripture, p. 309 is notes, p. 310 is scripture, and so on
through the volume. In John the scripture sits on the even image indices 324 to
414 and the notes on the odd ones -- 46 scripture pages out of 91 images for the
book, and the reason a 942-image volume holds only about 441 pages of text.

THE SCRIPTURE PAGE has one text column with inline verse numbers, indented
paragraph openings, and a marginal column at the outer edge carrying three
different things that a harvest must not confuse:

  small-caps section headings   THE CALL OF THE APOSTLES.
  italic side glosses           Andrew and John.   The Paralytic.
  cross-references              Mt. iii.11-12;  Mk. i.7-8; Lk. iii 16-17.

Only the first two are structure. The third is apparatus, and it is 31% of the
marginal blocks, so a harvest that does not separate them will import a third
again as much noise as signal.

CHAPTERS open with an inline compound number and extra leading -- `5. 1. After
these things` -- not with a display heading, so a chapter opening is detectable
but is not typographically privileged over a paragraph.
"""

