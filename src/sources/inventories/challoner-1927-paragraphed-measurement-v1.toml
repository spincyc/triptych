per_scripture_page = 4.65
per_verse = 0.243
evidence = "verified"
per_chapter = [8, 6, 11, 14, 9, 14, 13, 16, 8, 10, 12, 12, 11, 9, 8, 8, 6, 11, 12, 9, 7]
per_chapter_note = """
Chapters 1 to 21 in order, summing to the 214 real breaks. Two are known
undercounts and are left uncorrected rather than padded: the break at John 1:1
is excluded because the book's opening page carries a display title that the
indent detector cannot distinguish from a paragraph, and chapter 16 is counted
