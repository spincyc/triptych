# What one book of a paragraphed Challoner costs, measured rather than estimated.
#
# A MEASUREMENT, NOT AN ACQUISITION. Nothing below was imported. No break was
# written into a bible, no passage record was created, no bible index was
# touched. Every number here comes from one book -- St John -- of one witness,
# extracted for this file and discarded, so that a later lane can decide about
# the other twenty-six books on a number instead of on an estimate.
#
# It sits in inventories/ for the reason `pre-1955-rubrics-sources-v1.toml`
# gives: `source-library validate` rejects any file under src/sources outside
# its own schema except .md and .toml under inventories/, and this record is a
# measurement of a candidate, not a work in the library.
#
# THE QUESTION, in one line: this project's bibles are verse-per-line, so they
# carry no record of where the sense breaks fall. A paragraphed witness carries
# exactly that and nothing else this project needs. Is the structure recoverable
# from a public scan at a quality worth having?
#
# THE ANSWER, in three numbers:
#
#   97.2%   of paragraph breaks in John land on a verse boundary, so a
#           paragraph harvest is mechanical.
#   34.8%   of marginal headings and glosses land INSIDE a verse rather than at
#           a boundary, so a heading harvest is not.
#   97.7%   is the verse-boundary rate for the subset of headings that coincide
#           with a paragraph break -- which is the rule that separates the two.
#
# THE ROUTE THAT WORKED was the Internet Archive, anonymously, with no
# credentials and no page images. HathiTrust holds the item and confirms its
# rights but will not serve bytes to a program. Google Books has no view of this
# edition at all. All three are recorded below with what each returned.
#
# ONE CORRECTION IS OWED TO WHATEVER RECORD CARRIES THE SUBJECT. The HathiTrust
# identifier is `uc1.$b493001`. The dollar sign is part of the identifier; the
# form `uc1.b493001` resolves to an empty record, and `uc1.b4930010` resolves
# successfully to a Chilean archaeology journal. See [identity_correction].

measurement_schema = 1
record_type = "paragraphed-witness-measurement"
subject_id = "the-laymans-new-testament-1927"
scope = "St John only"
recorded_on = "2026-08-01"
jurisdiction = "United States"

question = """
TASK-126 asked for one book of the 1927 paragraphed Challoner to be measured
before any decision about the New Testament, and named the number it wanted:
how often does a marginal heading land inside a verse rather than at a verse
boundary. That question is the right one because it is the one that decides
whether the harvest is arithmetic or judgment. A break that falls on a verse
boundary can be written into a verse-per-line bible by a rule. A break that
falls inside a verse cannot: something has to decide which verse it belongs to,
and something deciding is a person.

The measurement below answers it, and then answers the question the answer
raises -- whether the inside-a-verse cases are separable from the rest before
the work starts, rather than discovered one at a time during it. They are.
"""

method = """
The scan's hOCR layer carries a bounding box and a confidence for every word.
That is enough to do the whole measurement geometrically, without reading the
text as a stream and without guessing where the margin ends:

  1. Split each OCR line at the page's gutter, computed per page from the
     distribution of line left edges, so that marginal matter and scripture are
     separated by position rather than by content. A line with words on both
     sides of the gutter is a contamination event and is counted as one.
  2. Detect paragraph starts by indentation, against a per-page least-squares
     model of the column's left edge fitted to the lower 62% of residuals. The
     pages are skewed -- the left edge drifts up to 45 px down a single page --
     so a fixed threshold would be worthless. Against the fitted baseline the
     separation is clean: paragraph starts sit +39 to +48 px, every other line
     within +/-5 px.
  3. Track chapter and verse by matching numerals against the expected next
     verse, anchored at every page by the running head, which prints its own
     chapter and verse range ("308 ST. JOHN. i. 21 - 41"). The head anchor is
     what makes this safe: pure sequential tracking silently relabelled all of
     John 16 as John 15 when three verse numbers in a row were lost to OCR, and
     produced a well-formed, wrong answer. The anchor caught it at the page
     boundary.
  4. Group marginal lines into blocks by vertical contiguity, classify each
     block as a section heading, a side gloss, or a cross-reference, and align
     each block's first line to the scripture line it overlaps most.
  5. Compare every result against src/sources/bibles/douay-rheims, read from
     the repository rather than assumed.

Two page images were fetched and read directly to confirm that the geometry
means what the code assumed it means. Both pages agreed with the extraction
block for block. That check is the reason the classification is stated as
measured rather than as inferred.
"""

evidence = """
Evidence classes, used exactly as `pre-1955-rubrics-sources-v1.toml` fixed them.

  [verified]  Read on 2026-08-01 from bytes fetched for this record, at a
              recorded sha256. Reproducible from [reproduce].
  [sourced]   Read from an external document cited by URL or identifier.
  [recorded]  Taken from a record already in this repository, cited by path.

Nothing is asserted from recall. The counts are machine-derived from the bytes
in [reproduce] and every one of them can be recomputed.
"""

