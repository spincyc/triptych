The title page confirms the revision. The reason to import no wording turns out
not to be only that it is a different revision: at 0.980 token similarity to the
Challoner already in this repository, and with 8.3% of lines clipped at the page
edge, importing this wording would trade quality for nothing. The constraint
should be kept for both reasons.
"""

[[limits_checked]]
limit = "No machine-readable structure, and hOCR contamination merges glosses into scripture"
verdict = "confirmed in kind, overstated in degree, and understated in kind"
evidence = "verified"
detail = """
No machine-readable structure: true, and worse than recorded. The plain text
derivative has no page separators at all, so the layout work must be done in
hOCR whether or not contamination existed.

Contamination: 1.38% of lines, all of it on 5 of 46 pages. Lower than the limit
implies, and concentrated rather than diffuse.

Understated in kind: contamination is the third-largest OCR defect here, behind
154 right-clipped lines and 30 dropped lines. A record that names only the
contamination would leave a later lane surprised by the other two.
"""

[[limits_checked]]
limit = "Estimated cost ~470 page images and 2,500-3,000 breaks for the whole NT"
verdict = "pages right, unit wrong, breaks under-counted"
evidence = "verified"
detail = """
441 scripture pages, so ~470 is close. But the harvest needs no page images at
all -- one 49 MB hOCR file, range-fetchable, carries everything. And the break
count is roughly 4,500 combined rather than 2,500-3,000. See
[cost.whole_nt_projected].
"""

# ---------------------------------------------------------------------------
# The recommendation
# ---------------------------------------------------------------------------

[recommendation]
verdict = "proceed for a subset"
evidence = "verified"
holding = """
PROCEED, for paragraph breaks NT-wide and for the safe subset of headings; do
not proceed for the rest of the headings, and do not import wording.

  1. HARVEST PARAGRAPH BREAKS ACROSS THE NEW TESTAMENT. 97.2% of them land on a
     verse boundary, they are derivable from indentation geometry by the code
     already written for John, the verse divisions match this repository's Douay
     exactly, and the whole apparatus is one 49 MB download. This is the part
     that turns a verse-per-line bible into one that knows where the sense
     breaks, and it is nearly free.

  2. IMPORT A MARGINAL HEADING ONLY WHERE ITS ANCHOR LINE IS ALSO A PARAGRAPH
     START. That rule keeps 64% of the headings at 97.7% verse-boundary
     reliability. Queue the other 36% for review or leave them out; do not
     import them on the same footing, because in that population only 6.3% are
     verse-aligned.

  3. IMPORT NO WORDING, for both recorded reasons and the measured one: 0.980
     similarity to a cleaner text already held.

  4. BEFORE COMMITTING TO THE NT-WIDE NUMBERS, MEASURE ONE NARRATIVE BOOK AND
     ONE EPISTLE -- Mark and Romans -- with the same code. Two more books at a
     few minutes each. John is a discourse gospel and its paragraph rate should
     not be assumed to hold for Acts or for Hebrews, and the +/-30% band above is
     an admission that it has not been tested rather than a measurement of
     variance.

  5. TREAT THE CONTAMINATED AND CLIPPED PAGES AS A REPAIR LIST, NOT AS A REASON
     TO STOP. Five pages of John needed the image rather than the OCR; roughly
     fifty will across the NT. That is a bounded, enumerable list, produced by
     the same pass that produces the breaks.

WHY NOT "PROCEED TO THE FULL NT" WITHOUT QUALIFICATION: because 34.8% of the
headings land inside a verse, and an unqualified import would place a third of
them by guess. The qualification costs nothing -- the discriminating rule falls
out of the same geometry -- and it is the difference between an import that can
be checked and one that cannot.

WHY NOT "DO NOT PROCEED": because the thing this witness was wanted for came
through almost intact. The paragraph structure is 97.2% verse-aligned, the
versification agrees with the repository's own bible with no divergence at all,
and the cost is one file. Refusing that on account of the heading noise would be
discarding the signal to avoid the apparatus.
"""

[recommendation.what_would_change_it]
detail = """
If Mark and Romans return paragraph rates that differ from John's by more than
the stated band, or return a versification divergence where John returned none,
the NT-wide projection here is void and the decision should be retaken on those
measurements rather than on this one. If a paragraphed Challoner Old Testament
is ever identified, the New-Testament-only limit stops being a limit and the
whole question is worth reopening at bible scale.
"""

