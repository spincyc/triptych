page in the book. Both are visible in [measurement.could_not_place]; neither
was inferred back in.
"""
mid_verse_loci = ["John 8:4", "John 8:6", "John 8:9", "John 11:41", "John 14:12", "John 19:15"]
note = """
THIS IS THE NUMBER THAT MAKES THE HARVEST WORTH DOING. 208 of 214 paragraph
breaks fall exactly on a verse boundary, so they can be written into a
verse-per-line bible as "a break precedes John 4:7" with no judgment involved.

The six that do not are real and are worth keeping as data rather than
smoothing: the 1927 begins a paragraph in the middle of John 8:4, 8:6, 8:9,
11:41, 14:12 and 19:15, most often at the start of reported speech ("And Jesus
lifting up his eyes said: Father, I give thee thanks", inside 11:41). Two of the
six, 8:4 and 8:6, sit on the single worst-OCR page in the book and are the least
certain of the set.

One further apparent mid-verse break, at the foot of image 384, is a detector
artifact: the page's left edge is skewed enough that the fitted baseline
over-predicts at the last line. It is excluded above and is recorded here so
that a later run reproducing 215 rather than 214 knows which one to discard.
"""

[measurement.marginal_blocks]
total = 423
section_headings = 98
side_glosses = 181
cross_references = 130
too_corrupt_to_classify = 14
evidence = "verified"
note = """
Block counts, not heading counts: a heading whose lines the OCR broke apart is
counted once where the lines were rejoinable and more than once where they were
not. Fragmentation inflates the heading and gloss counts by an estimated 5-10%,
which is stated as a limit rather than corrected, because correcting it would
require the page images this measurement deliberately did not fetch.
"""

[measurement.headline]
question = "how often does a marginal heading land inside a verse rather than at a verse boundary"
placeable_blocks = 267
continued_from_previous_page = 12
inside_a_verse = 93
inside_a_verse_pct = 34.8
at_a_verse_boundary = 174
evidence = "verified"
answer = """
34.8%. Of 267 marginal headings and glosses in John that begin on their own
page, 93 sit beside a scripture line that does not begin a verse. The printer
could only ever set a heading beside a LINE, and a line begins mid-verse about
two times in three, so this is a fact about the typography and not about the
editor's intention -- but it is exactly the fact that a verse-anchored import
runs into.

BROKEN DOWN, because the two kinds do not behave alike:

  major section headings   20 of 93 land inside a verse    21.5%
  minor italic glosses     73 of 174 land inside a verse   41.9%

The glosses are twice as likely to miss, which follows from what they are: a
gloss is set beside the phrase it names, and a phrase starts wherever it starts.
"""

[measurement.headline.resolvability]
resolvable_by_rule = 83
unplaceable = 10
unplaceable_pct = 3.7
evidence = "verified"
finding = """
Of the 93 that land inside a verse, 83 have exactly one verse start somewhere
within the heading block's own vertical extent, so the rule "assign the heading
to the first verse beginning beside it" places them without a judgment. On the
two pages read as images, that rule agreed with the sense every time: `Andrew
and John.` beside the line carrying verse 40 belongs to verse 40, `Simon.`
beside verse 41 belongs to verse 41, `The Paralytic.` spanning the lines that
carry the end of 5:4 and the start of 5:5 belongs to 5:5.

That agreement is a two-page check, not a proof, and it should not be reported
as one. The rule is defensible and unverified at scale.

Ten blocks (3.7% of 267) have no verse start within their extent at all. Those
cannot be placed by any rule and need either the page image or a decision.
"""

[measurement.headline.the_useful_discriminator]
evidence = "verified"
finding = """
THE INSIDE-A-VERSE CASES ARE SEPARABLE BEFORE THE WORK STARTS, and this is the
most actionable result in the file.

A heading whose anchor line is ALSO a paragraph start is at a verse boundary
168 times out of 172 -- 97.7%. A heading whose anchor line is not a paragraph
start is at a verse boundary 6 times out of 95 -- 6.3%.

  anchor is a paragraph start      172 blocks   97.7% at a verse boundary
  anchor is not a paragraph start   95 blocks    6.3% at a verse boundary

So the same geometry that yields the paragraph breaks also sorts the headings
into a set that can be imported mechanically and a set that cannot, in advance,
without inspecting either. 64% of the headings fall in the safe set. The other
36% can be left out, or queued for review, but they do not have to be discovered
one at a time during an import.
"""

[measurement.contamination]
question = "how often does the OCR merge a marginal gloss into a scripture line"
merged_lines = 40
ocr_lines = 2893
rate_pct = 1.38
affected_pages = 5
evidence = "verified"
by_image = [[346, 9], [356, 22], [360, 1], [384, 1], [390, 7]]
finding = """
1.38% of OCR lines, and the recorded limit is confirmed in kind but overstated
in degree: the contamination is real, and it is not spread thin. All 40 events
fall on 5 of the 46 pages, and image 356 alone carries 22 of them -- 49% of that
page's lines. On the clean 41 pages the rate is zero.

That distribution changes what the defect costs. Contamination at 1.4% spread
evenly would poison every page a little and would have to be handled everywhere.
Contamination at 1.4% concentrated on 11% of the pages is a five-page repair
list.

It is also not a cosmetic defect where it occurs. On image 356 the merge is what
destroyed the verse tracking: `Their 40. Of that multitude therefore` and
`SOUNCIL, QuTt Ati laid hands upon him` are single OCR lines carrying a marginal
heading and scripture together, and a harvest splitting on line left edge --
which is the obvious way to do it -- would classify the whole line as margin and
silently drop nine verses of scripture. Splitting at the gutter by WORD position
recovers them. The naive method and the correct method differ by a page of John
7 and give no signal that they differ.
"""

[measurement.ocr_damage]
evidence = "verified"
right_edge_clipped_lines = 154
right_edge_clipped_pct = 8.3
clipped_pages = 14
lines_dropped_entirely = 30
verse_numbers_lost = 21
verse_numbers_lost_pct = 2.4
finding = """
The contamination is not the largest defect in this scan; it is the third
largest. Measured on the same 46 pages:

  154 scripture lines (8.3%) run to the physical edge of the page image and
      lose their last word or characters, on 14 of the 46 pages. Image 390 has
      26 such lines. This is the scanner's recorded tight-binding note, on the
      outer edge rather than the inner.

  30 scripture lines are missing from the OCR altogether, detected as gaps in
     the line pitch after excluding chapter and paragraph leading. Image 352
     loses four consecutive lines carrying John 6:70-71.

  21 of John's 879 verse numbers (2.4%) were not recovered.

NONE OF THESE DEFECTS TOUCHES THE STRUCTURE THIS PROJECT WANTS. A clipped line
still has its left edge, so its indentation -- and therefore whether it starts a
paragraph -- is intact. A dropped line loses a break that would have been at
that line, which is why the paragraph count is a floor rather than an exact
figure. The defects would be fatal to a wording harvest and are survivable by a
structure harvest, which is the same conclusion the recorded constraint reached
from the other direction.
"""

[measurement.could_not_place]
evidence = "verified"
summary = """
The task asked how many breaks could not be placed confidently, and why. Four
buckets, 55 items, against 214 paragraph breaks and 267 heading blocks:

  10  heading blocks with no verse start anywhere in their vertical extent.
      Unplaceable by rule. Need the page image or a decision.
  14  marginal blocks whose OCR confidence is below 60 and whose text is not
      legible enough to classify as heading, gloss, or cross-reference at all
      (`XVile oe`, `[savxlos`, `Ween si`). Not placed, and not counted as
      headings above.
   2  mid-verse paragraph breaks -- John 8:4 and 8:6 -- that fall on the worst
      OCR page in the book and are recorded with lower confidence than the
      other four.
  ~30 breaks that may exist on the 30 lines the OCR dropped and that this
      measurement therefore cannot see. This is why the paragraph count is a
      floor.

Everything else placed. 208 of 214 paragraph breaks and 257 of 267 heading
blocks resolved to a chapter and verse without a judgment call.
"""

