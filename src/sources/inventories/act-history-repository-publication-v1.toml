document in this repository: if a later lane writes one -- a runbook for
publishing a slice -- the same three propositions belong in it in its own words,
because a person about to configure a remote is reading that, not a README of a
repository they have not created yet.
"""

# --- Open questions -----------------------------------------------------------

[[open_questions]]
id = "the-rule-admits-two-grounds-and-this-is-a-third"
question = """
`guidance/sources.md:389` admits measured source size or rights constraints. The
justification that survives measurement is neither: it is that git operations
are the artifact and no in-tree form serves them. Should the rule be amended to
admit a consumability ground, or should a derived repository be governed
somewhere else entirely?
"""
why_it_is_open = """
This lane owns this file and one section of `guidance/act-histories.md`. It does
not own `guidance/sources.md` and will not read a third ground into a rule from
outside it. The measurement is complete; the amendment is a ruling.
"""
what_would_settle_it = """
A sentence in `guidance/sources.md` beside the existing two grounds, or an
explicit ruling that a derived build output is not a "dedicated data repository"
within the meaning of that rule at all -- which is arguable, since the rule's
subject is where SOURCES live and this artifact holds no source.
"""

[[open_questions]]
id = "two-post-1929-witnesses"
question = """
`benziger-iuxta-typicam-1962` and `aas-47-1955` in the roman-holy-week slice are
recorded `public-domain` on the strength of an Internet Archive marking, which
`guidance/sources.md` refuses as a distribution basis and which
`lt-hist-rights-audit-v1.toml` refused for six other rows. What is their actual
basis?
"""
why_it_is_open = """
The exposure predates this decision: the text is already tracked in
`src/web/data/structure/act-history/` and already served. Only three departures
in the slice introduce text under a post-1929 act, and all three were read and
are Vulgate Scripture or a rubrical heading. So it does not block publication of
a repository that adds no byte to what is already published -- but it is a
weakness in a rights record, it is exactly the weakness this project has already
ruled against twice, and it should not survive because it was found in the wrong
lane.
"""
what_would_settle_it = """
The route `lt-hist-rights-audit-v1.toml` used for its own equivalent: a stated
jurisdiction, a stated basis, and a refusal to rest on a host's marking. It very
likely belongs to the same single question that audit's
`settle-the-holy-see-question-once` condition raises about postconciliar Holy See
material, and the 1955 AAS row is named in that condition already.
"""

[[open_questions]]
id = "does-the-host-write-a-commit-graph"
question = """
Does a hosting service write a commit-graph for a pushed repository, and is its
own commit list date-ordered from one? If both, [dates.commit_graph_overflow]
reaches the published view and not only a local clone.
"""
why_it_is_open = """
NOTHING IN THIS LANE COULD ANSWER IT WITHOUT PUSHING, AND PUSHING IS THE ACT
THIS LANE IS FORBIDDEN TO PERFORM. It is recorded as unverified rather than
asserted, because an assertion about a service's internals from a lane that
never touched the service is exactly the kind of confident wrong answer this
whole record is about.
"""
what_would_settle_it = """
One private push of the smallest slice by the maintainer, followed by fetching
the repository back and running `fsck --strict` on the fetched copy, and reading
the commit list's ordering. That is a five-minute check and it should be the
FIRST thing done after the first publication, before anyone relies on the view.
"""

[[open_questions]]
id = "head-opens-on-the-wrong-line"
question = """
`emit` points HEAD at the line of the first act in topological order
(tools/act-history:1765). For latin-missal that is `praedicatorum`, so a clone
checks out 7 files and a 1604 Dominican tip; the Roman line is a branch the
reader must know to ask for. For code-of-canon-law it is `ius-antiquum`, 8 files,
a 1582 tip. Should a slice be able to declare its landing branch?
"""
why_it_is_open = """
It is not a rights or a size question and blocks nothing. It is a
misrepresentation question: the default view of a published repository is the
view most readers will take for the whole of it. This repository already made
the equivalent ruling for the browser -- a manifest that declares which slice
the page opens on -- and the same reasoning applies to HEAD.
"""

# --- Corrections this record makes to things already written -------------------

[[corrections]]
id = "the-1-3-mb-figure-measured-the-filesystem"
corrects = "the prior estimate that the only emitted slice was 1.3 MB"
correction = """
`du -sh` on a freshly emitted roman-holy-week reports 728K here and 1.3M on the
run that produced the figure; `du -sb` reports 78,602 bytes and the packed
repository is 42,409 bytes. The difference is block allocation over 148 loose
objects. The estimate was not wrong about what `du -sh` printed; it was a
measurement of filesystem rounding presented as a measurement of the artifact
[verified].
"""

[[corrections]]
id = "a-repository-can-be-consumed-from-inside-a-repository"
corrects = "the claim that git log, git diff and merge-base cannot be run against a subdirectory of this repository"
correction = """
They can, if the subdirectory is a bare repository whose files were committed:
git's discovery recognises the directory as a git directory before walking up.
It was run and it worked. The finding that replaces the claim is worse, not
better -- in a CLONE the same commands silently answer with the OUTER
repository's history, because `refs/` is empty, git does not track empty
directories, and discovery therefore fails and walks up. `mkdir refs` in the
clone repairs it entirely [verified]. See [consumability] `route_b_bare`.
"""

[[corrections]]
id = "fsck-is-not-the-only-date-hazard"
corrects = "the standing account that the date hazard is `fsck --strict` calling a negative timestamp badDate"
correction = """
That account is correct and incomplete. A POSITIVE shifted stamp passes `fsck
--strict` on a fresh emit, and then FAILS it, exit 16 on every commit, as soon
as anything writes a commit-graph -- because the commit-graph stores a date in
34 bits and the shifted stamps are eighteen times too large. `git gc` writes one
by default. The date hazard is therefore in two halves, and only the first half
was written down [verified]. See [dates.commit_graph_overflow].
"""
