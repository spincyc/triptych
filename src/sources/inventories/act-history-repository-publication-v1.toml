"""

# --- 4. The date problem ------------------------------------------------------

[dates]
finding = "what-a-reader-of-a-published-repository-would-actually-see"
the_shift = """
Every commit stamp is the act's true date shifted forward ten thousand years
(`YEAR_SHIFT = 10000`, tools/act-history:284). Git rejects a pre-1970 date:
`fsck --strict` calls a negative timestamp `badDate` and a hosting service that
runs fsck on receive refuses the push. The shift is the workaround, and
`emit` writes the commit object directly with `hash-object --literally` because
`commit-tree` parses the date through git's own reader (tools/act-history:1755).
"""
what_the_date_column_shows = """
MEASURED, ON THE EMITTED code-of-canon-law REPOSITORY, FOR ONE COMMIT WHOSE TRUE
DATE IS 2022-04-26:

    git log -1 --format=%ad --date=default    Tue Apr 26 12:00:00 12022 +0000
    git log -1 --format=%ad --date=short      12022-04-26
    git log -1 --format=%ad --date=iso        12022-04-26 12:00:00 +0000
    git log -1 --format=%ad --date=relative   in the future
    git log -1 --format=%ad --date=rfc        Tue, 26 Apr 12022 12:00:00 +0000
    git log -1 --format=%ad --date=human      Apr 26 12022

and the raw object carries `author ... 317220494400 +0000` [verified].

A reader who sorts or filters by date is reading five-digit years. A reader of a
relative date is told "in the future" and nothing else. Neither is wrong -- the
stamp is honestly unusable and was chosen to be unmistakable -- but a published
repository is read by people who did not choose it.
"""
where_the_true_date_rides = """
IN THE SUBJECT LINE AND IN AN `Act-date:` TRAILER, BOTH [verified]:

    e70bc26 2022-04-26  Recognitum Librum VI repairs a cross-reference ...
    ...
    Act-date: 2022-04-26

`git log --oneline` and `--graph` therefore read correctly, because the subject
is the only part of a commit those views show. The trailer is the machine-
readable copy, and `acts/<date>-<id>.txt` in the tree is the third. The emitted
README states all of this already, at length, including why a smaller shift was
rejected: the least shift clearing 1970 is about four hundred years, which would
date Quo primum to 1970 -- plausible enough to be mistaken for a real date
[verified, read out of the emitted README].
"""

[dates.commit_graph_overflow]
finding = "NEW HERE, AND NOT RECORDED ANYWHERE ELSE IN THIS REPOSITORY"
statement = """
`git gc` BREAKS THE EMITTED REPOSITORY, AND `fsck --strict` THEN CALLS IT
CORRUPT. This was not known before this measurement.

A freshly emitted repository passes `git fsck --strict` with exit 0. Run
`git gc` on it -- which writes a commit-graph by default -- and `fsck --strict`
exits 16 and reports every single commit:

    commit date for commit 0ab7009... in commit-graph is 4558644288
        != 313796289600

Twelve commits, twelve reports, for roman-holy-week. The commit-graph format
stores a commit date in 34 bits, so the largest date it can hold is 2^34-1 =
17,179,869,183 -- about the year 2514. The shifted stamps are near 3.15e11, some
eighteen times too large, and every one of them wraps.

IT IS NOT COSMETIC. It changes what git prints. `rev-list --all --date-order` on
the packed repository puts a 1570 commit FIRST, ahead of 1962; on the same
repository packed with `gc.writeCommitGraph=false` the same command returns
strict descending order from 1962. The truncated dates are what the date-ordered
traversal reads [verified, both directions, 2026-08-02].

    clean:            11962-06-23, 11960-07-26, 11960-07-25, 11955-11-16, ...
    with commit-graph: 11570-07-14, 11962-06-23, 11960-07-26, 11960-07-25, ...

MITIGATION, AND ITS LIMIT. `git -c gc.writeCommitGraph=false gc` leaves the
repository clean, and `objects/info/` then contains only `packs`. That is under
this project's control for a local emit and NOT under its control on a hosting
service, which runs its own maintenance. Whether a given service writes a
commit-graph, and whether its own commit list is date-ordered from one, could
not be verified from this lane. See [[open_questions]]
`does-the-host-write-a-commit-graph`.
"""

# --- 5. Replaceability --------------------------------------------------------

[replaceability]
finding = "a-published-derived-repository-needs-its-own-written-authority"
determinism = """
THE EMIT IS DETERMINISTIC. Emitting roman-holy-week twice from the same source
produces the identical set of 12 commit ids [verified]. So a re-emit that
changes nothing changes nothing, and the artifact is reproducible.
"""
blast_radius = """
BUT A CORRECTION IS NOT A COMMIT; IT IS A NEW HISTORY. Correcting one word in
one act's title -- `Clement VIII issues the emended Missal`, the 1604 station --
and re-emitting from a source file of the same name changed 10 of the 12 commit
ids. The two commits that survived are the two 1570 roots, which precede it. A
correction rewrites the corrected station and every descendant [verified].

AND A PURELY ADMINISTRATIVE MOVE REWRITES ALL OF THEM. The first attempt at the
measurement above emitted from a source file with a different NAME and changed
12 of 12. The reason is `render_readme` (tools/act-history:1188): every commit's
tree carries a README naming the source file it was built from, so renaming or
relocating the inventory changes a blob in every tree and therefore every commit
id. Moving a file in `src/sources/inventories/` would force-push the whole
published history [verified, both runs].
"""
the_governing_prohibition = """
`PROJECT-WORK.md:27`: the standing authority "does not authorize force-pushing,
amending or otherwise rewriting published history, changing remotes, integrating
a retained worker, or triggering another deployment mechanism."
`PROJECT-WORK.md:177`: "Retained-worker integration, non-Pages deployment,
remote changes, force-pushing, and all other history rewriting remain separately
authorized operations." `PROJECT-WORK.md:482` records the same boundary again in
the ledger.

THE PROHIBITION IS ADDRESSED TO A HISTORY THAT IS A RECORD OF WORK. A derived
repository is not that. It is a build output, like a PDF, and the emitted README
says so in its first paragraph. Every correction to it is a force-push, and
force-push is not an exception to its normal operation -- it IS its normal
operation. Published under the existing authority, it would be governed by a
rule it structurally cannot obey, and the first correction would either violate
the rule or freeze the artifact at its first error.
"""
requirement = """
A PUBLISHED DERIVED REPOSITORY NEEDS ITS OWN WRITTEN AUTHORITY, in
`PROJECT-WORK.md`, saying in terms that:

  - a repository emitted by `tools/act-history` is a BUILD OUTPUT and not a
    record of work;
  - it is REPLACED IN FULL on every publication, by force-push, and that
    replacement is ordinary rather than an exception;
  - the record it derives from is the tracked inventory under
    `src/sources/inventories/`, which is where the history-rewriting prohibition
    continues to apply undiminished; and
  - no other repository, and no branch of this one, may be force-pushed under
    that authority.

Without it, the answer to "may this be published" is no, whatever the
measurements say, because publishing it would create an obligation this project
has already decided it will not take on.
"""

# --- 6. The lt-hist hazard ----------------------------------------------------

[lt_hist]
finding = "extraction-of-named-files-from-a-working-tree-is-the-only-admissible-route"
recorded_at = "src/sources/inventories/lt-hist-rights-audit-v1.toml:147-163"
what_it_records = """
[recorded, and not re-verified here -- this lane ran no git command against
/home/ksh/git/lt-hist]

`/home/ksh/git/lt-hist` itself has no `.git`. But `~/git/lt-hist/build/roman-
liturgy-history` IS a git repository: 25 commits, 78 tracked files, a
16,505,844-byte `.git`, no remote configured. Its commits narrate the corpus
version by version; the tip is "The Roman Missal English translation
implemented".

The audit calls this "the most dangerous fact in the file", because a fold-in
has a route nobody would have to choose deliberately: fetch or merge that
history. It would bring in every excluded byte -- the 2011 Roman Missal, the
1998 ICEL Sacramentary, the 2002 typical edition -- together with commit
messages asserting they were implemented, and it would do so IRREVERSIBLY,
because deleting a file in a later commit does not remove it from history. Every
section file in those commits also carries `text_status:` front matter that the
audit's `text-status-may-not-travel` condition forbids from travelling.

Its ruling, quoted: "The generated repository must not be fetched, merged,
cherry-picked, submoduled, or subtree-merged. Any fold-in extracts named files
from the working tree."
"""
why_it_binds_this_decision = """
BECAUSE A PARALLEL-REPO WORKFLOW IS EXACTLY THE WORKFLOW THAT MAKES THAT ROUTE
EASY. Once this project routinely operates git repositories beside the main one
-- cloning them, fetching them, pointing remotes at them -- `git fetch <path>`
and `git remote add` become ordinary gestures rather than deliberate ones. The
audit's ruling was written for a fold-in; it has to be restated for a workflow.

ANY WORKFLOW AROUND PUBLISHED ACT-HISTORY REPOSITORIES MUST STATE, IN ITS OWN
WORDS AND NOT BY REFERENCE:

  - no emitted or published act-history repository is ever a fetch, merge,
    cherry-pick, submodule or subtree source FOR THIS REPOSITORY, in either
    direction, for the same reason lt-hist's is not: history is not withdrawable
    and a mistaken import is permanent;
  - the only admissible movement of content is extraction of NAMED FILES from a
    WORKING TREE, deliberately, one at a time; and
  - `~/git/lt-hist/build/roman-liturgy-history` remains under the audit's
    existing prohibition, unchanged and not narrowed by anything here.
"""

# --- The four hazards, and which of them `private` answers --------------------

[[hazards]]
id = "consumability"
hazard = "The artifact's whole content is git operations, and no in-tree form serves them."
does_private_resolve_it = "YES, COMPLETELY."
reasoning = """
Visibility is orthogonal to consumability. A private repository is a real
repository: clone, `git log`, `git diff`, `git merge-base` and `--graph` all
work for anyone with access, exactly as they would in a public one. Everything
in [consumability] is satisfied by a private repository. This hazard is the
argument FOR a repository, and privacy costs it nothing.
"""

[[hazards]]
id = "date-presentation"
hazard = "The date column reads 12022, and `--date=relative` reads 'in the future'."
does_private_resolve_it = "SUBSTANTIALLY YES, BUT PRIVACY IS NOT THE MITIGATION."
reasoning = """
Private narrows the readership to people who can be told, which removes the
public-misreading case. It does not make the dates readable, and the maintainer
still reads them. The actual mitigation is the one already in place -- the true
date leads every subject line, rides in an `Act-date:` trailer and is written
into `acts/` -- plus the README notice, which exists. What the README does NOT
yet say is [dates.commit_graph_overflow], and that gap is a condition below.
"""

[[hazards]]
id = "replaceability"
hazard = "Every correction is a force-push, which the standing authority excludes."
does_private_resolve_it = "YES, CONDITIONALLY."
reasoning = """
`PROJECT-WORK.md`'s prohibition is on rewriting PUBLISHED history. A private
repository holding a build output, published under an authority that says in
terms that it is a build output replaced in full, is not the thing the
prohibition is about. But the authority has to be WRITTEN. Private without it
does not resolve the hazard; it only makes the violation less visible, which is
worse. See [replaceability] `requirement`.
"""

[[hazards]]
id = "rights"
hazard = "Restricted bytes must not enter Git, build products, tests, fixtures, or public artifacts."
does_private_resolve_it = "NO. THIS IS THE ONE."
reasoning = """
`guidance/sources.md:382-384` draws its line at whether the bytes ENTERED Git
and a build product. A private repository is Git. An emitted repository is a
build product. Both halves of the sentence are satisfied by a private repository
just as they are by a public one, so privacy cannot be the answer to this
hazard; the answer has to be that the bytes do not enter.

Today they do not enter -- 237 of 237 post-1929 canon blobs carry the withheld
banner and none carries words, and 0 of 507 unit text lines across all three
slices are absent from the browser data this repository already serves. That is
a fact about the current inventories. Nothing in the tool makes it a fact about
the tool, and [[findings]] `nothing-enforces-withheld` is the proof. Privacy
reduces the audience for a future leak; it does not prevent one, and it does not
make one withdrawable.
"""

# --- Findings -----------------------------------------------------------------

[[findings]]
id = "nothing-enforces-withheld"
severity = "blocking, for the two slices that depend on withholding"
statement = """
`tools/act-history check` DOES NOT REFUSE A UNIT OR DEPARTURE THAT CARRIES BOTH
`withheld` AND `text`. `unit_body` (tools/act-history:734-762) writes the
withheld banner in place of an empty incipit and then appends `text`
unconditionally, so a row carrying both emits the banner AND the words -- the
words underneath the notice that says they are not there.

The `interpretations` table HAS the guard: an interpretation carrying `withheld`
must supply `question` and `answer` in this project's own words and is refused
if it also carries `dubium` or `responsum` (tools/act-history:1514-1524). The
`units` and `departures` tables have no equivalent. The units loop in `check`
validates `mass`, `slot`, `name`, `order`, the slug forms, `read_from` and the
page-image collation date, and says nothing about `withheld`.
"""
proof = """
NOT REASONED FROM THE SOURCE -- PROVED BY EMITTING A PROBE, in the scratch tree,
outside this repository. A copy of `canon-law-acts-v1.toml` was patched to add
one line to the CCEO can. 1 unit, which already carried
`withheld = "holy-see-post-1929"`:

    text = "PROTECTED WORDS PASTED HERE BY MISTAKE, canon 1 of the CCEO."

`tools/act-history check` on the patched file reported ZERO problems and the
same 47 acts, 159 base units, 131 departures and 29 interpretations as the
tracked file. `emit` then wrote this blob into a commit object:

    can. 1
    [text withheld: a work of the Holy See later than 1929, over whose text
    Vatican City State Law N. CXCVII of 2017 art. 2 asserts copyright by name;
    this project holds no licence]
    text established by: sacri-canones-1990

    PROTECTED WORDS PASTED HERE BY MISTAKE, canon 1 of the CCEO.

[verified 2026-08-02]. The banner and the words in one file, and no check
between them.
"""
why_it_blocks = """
Because the artifact is irreversible and the defect is not. 174 rows in the
canon-law slice and 2 in the missal slice rest on a withholding that the tool
does not enforce; one lane pasting a canon's Latin into the wrong field would
pass every check this repository runs and land protected text in a permanent
history. Fixing `check` is a small change to one file. Un-publishing a commit
object is not a change anyone can make.
"""
the_fix = """
`check` must append a problem where a `units` or `departures` row carries
`withheld` together with a non-empty `text` or `incipit`, in the same shape as
the interpretations guard already there: "carries `text` and also withholds its
words; one or the other". That fix is NOT attempted in this lane, which owns
only this file and one guidance section.
"""

[[findings]]
id = "the-emitted-readme-does-not-state-a-rights-position"
severity = "condition on publication"
statement = """
`render_readme` (tools/act-history:1188-1219) writes the slice's title, the
build-artifact notice, the source encoding it came from, the act/witness
distinction, the `[printed]` exception, and four paragraphs on the date shift.
It says NOTHING about rights: not what the withheld banner means, not what a
reader may do with the text that is there, not that the withholdings are a
rights position rather than a gap in the research [verified, read out of the
emitted README of all three slices].

The generator says it once elsewhere, in the apparatus of the printed plate:
"whose text is withheld here. That is a rights position and not ignorance"
(tools/act-history:3042). The README, which is the first file a reader of a
published repository opens, does not.
"""
now = """
FIXED. `render_readme` writes both, counted from the rows; see [[conditions]]
`the-readme-states-rights-and-the-gc-hazard` `met_how` (a) and (b). The
statement above describes the README as it stood on 2026-08-02 before that
change and is left as the record of what was measured.
"""

[[findings]]
id = "the-emitted-readme-does-not-warn-about-gc"
severity = "condition on publication"
statement = """
The README explains the ten-thousand-year shift thoroughly and does not mention
that `git gc` writes a commit-graph whose 34-bit date field cannot hold the
shifted stamp, that `fsck --strict` then exits 16 on every commit, and that
date-ordered traversal then returns a wrong order. A reader who clones a
published repository and runs routine maintenance produces a repository their
own tools call corrupt, with no warning from the artifact. See
[dates.commit_graph_overflow] for the measurement.
"""
now = """
FIXED. The README states the ceiling, the overflow, what `fsck --strict` then
reports, the wrong date order, the `gc.writeCommitGraph=false` mitigation and
