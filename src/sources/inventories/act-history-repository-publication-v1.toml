[rights.irreversibility]
statement = """
A GIT HISTORY IS THE ONE ARTIFACT THIS PROJECT PRODUCES THAT CANNOT BE
CORRECTED, ONLY REPLACED. Deleting a file in a later commit does not remove it
from history -- `lt-hist-rights-audit-v1.toml` says exactly this about the
lt-hist build repository, and it is equally true of ours. A published object
survives in every clone taken before the rewrite and, on a hosting service, in
the dangling-object views for as long as that service keeps them.

