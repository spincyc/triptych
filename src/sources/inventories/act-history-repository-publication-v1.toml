"""

# --- The decision, slice by slice ---------------------------------------------

[[decision]]
slice = "roman-holy-week"
verdict = "MAY BE PUBLISHED -- private or public -- once [[conditions]] 1, 2 and 3 are met."
ground = "consumability, not size and not rights"
reasoning = """
It carries no withheld row: 0 of 38 units, 0 of 42 departures, no `[withheld]`
table [verified]. So the unenforced guard is not load-bearing for it -- there is
no withholding for a missing check to fail to protect. Every text line in its
emitted repository is already in the tracked browser data this repository serves
[verified, 84 of 84]. It packs to 42 kilobytes.

Private or public makes no difference to its admissibility, because none of the
four hazards turns on visibility for this slice. Public is the more useful form
and this record does not prefer private for it. The conditions below are about
the artifact's own honesty, not about who reads it.
"""
what_remains_open_and_does_not_block = """
Two of its nine witnesses are post-1929 and rest on an Internet Archive marking,
which `guidance/sources.md` refuses as a distribution basis. That exposure
already exists in the published browser data, is not created by this decision,
and is not cleared by it. See [[open_questions]] `two-post-1929-witnesses`. If
the maintainer wants that settled before anything is published, it settles
first; this record does not decide it either way.
"""

[[decision]]
slice = "latin-missal"
verdict = "MAY NOT BE PUBLISHED -- public OR private -- until the withheld guard lands."
ground = "rights, unenforced"
reasoning = """
Two of thirteen departures rest on a withholding for the 1970 typical edition
[verified]. The count is small and the current emit is clean -- exactly two
blobs carry the banner and no blob carries the withheld words -- but the
smallness cuts the wrong way: two rows in a file of 3,265 lines is a withholding
a later lane can lose without noticing, in a slice whose other 31 witnesses are
public domain and invite exactly that inattention.

The guard is one condition in one function and it protects this slice and the
next one together. Publishing before it means accepting a permanent artifact
whose rights position is maintained by care alone.

PRIVATE DOES NOT CHANGE THIS. See [[hazards]] `rights`.
"""

[[decision]]
slice = "code-of-canon-law"
verdict = "MAY NOT BE PUBLISHED -- public OR private -- until the withheld guard lands."
ground = "rights, unenforced, at scale"
reasoning = """
174 rows rest on a withholding: 134 of 159 units, 11 of 131 departures, 29 of 29
interpretations [verified]. The emit is clean today -- 237 of 237 post-1929
canon blobs across all 47 commits carry the banner and none carries words
[verified] -- and that cleanliness is a property of the inventory, not of the
tool, and the probe in [[findings]] `nothing-enforces-withheld` shows precisely
how it would stop being true.

This is the slice where the mistake is most likely, because it is the slice
where withholding is the norm rather than the exception, and where the words
being withheld are the words a contributor most naturally reaches for. It is
also the slice where a leak would be most consequential: a named claimant, a
copyright asserted by name in Vatican City State Law N. CXCVII of 2017 art. 2,
and no licence held.

PRIVATE DOES NOT CHANGE THIS EITHER, AND HERE IS WHERE THAT MATTERS MOST. A
private repository still puts the bytes into Git and into a build product, which
is what `guidance/sources.md:382-384` forbids, and a private history is exactly
as unwithdrawable as a public one.
"""

# --- What must be true first --------------------------------------------------

[[conditions]]
id = "the-withheld-guard"
applies_to = ["latin-missal", "code-of-canon-law"]
requirement = """
`tools/act-history check` refuses a `units` or `departures` row that carries
`withheld` together with a non-empty `text` or `incipit`, and a test covers it.
Until then those two slices are not publishable in any visibility.
"""
verifiable_by = """
Re-running the probe in [[findings]] `nothing-enforces-withheld`: a patched copy
of the canon-law inventory carrying both fields must make `check` exit non-zero
and name the row.
"""
met = "yes, in commit 606327ea5"
met_how = """
`withheld_and_carried` (tools/act-history) reports every field a row carries
beside its marker, and `check` calls it for `units`, `departures` and
`interpretations` alike. The refusal is not the CLI's ordering: `build` refuses
at the one function `emit`, `structure`, `plate`, `graph` and `commonality` all
take their bytes from, and refuses on the STATE as well as on the rows, so a
`replaced` departure that marks a unit withheld while leaving inherited words
standing is refused too -- a combination no reading of the rows can see.

The probe is run rather than described, in both tests:
`tests/tools/act-history.test` patches the tracked canon-law inventory and
requires `check` and `emit` to refuse it and to leave no repository behind, and
`tools/tests/test_act_history_withheld.py` carries the other row kinds, the
state-only case, and the case a blunt guard would break -- an act that withholds
words it once published and CLEARS them, which must still be allowed.
"""

