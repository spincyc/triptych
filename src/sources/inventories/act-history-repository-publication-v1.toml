met = "yes"
met_how = """
`render_readme` now writes four sections a clone could not otherwise learn, and
EVERY NUMBER IN THEM IS COUNTED FROM THE ROWS at render time rather than typed
beside them. A README that named a rights position the slice does not hold would
be `guidance/the-shape.md` section 1's defect -- a reference that resolves
