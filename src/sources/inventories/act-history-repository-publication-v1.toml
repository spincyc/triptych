NO REPOSITORY WAS CREATED, NO REMOTE WAS CONFIGURED AND NOTHING WAS PUSHED TO
WRITE THIS FILE. Registering a repository is the maintainer's act. Every emitted
repository read here was written under `build/`, which `.gitignore` excludes at
line 1 (`/build/`), and none of it appears in `git status`. This record states
what may be published, on what ground, and what must be true first; it is the
predicate for that act and not the act.
"""

governing_rule = """
`guidance/sources.md:389`, in full and with its anchor:

"Default to `tracked` for lawful, reasonably sized plain text and other reusable
artifacts. Do not introduce a separate object service, credential requirement,
large-file extension, or dedicated data repository until measured source size
or rights constraints justify the contribution and distribution cost."

Two grounds are admitted and no third: MEASURED SOURCE SIZE, or RIGHTS
CONSTRAINTS. Section 1 below measures the first and finds it absent. Section 3
measures the second and finds that it cuts AGAINST publication rather than for
it. The ground the artifact actually stands on is neither, and section 2 records
what it is and why the rule should be read as reaching it.

The second rule this record answers to is `guidance/sources.md:382-384`, the
`restricted` disposition: "lawful project access does not include repository
redistribution; tracked metadata may identify the artifact, but its bytes must
not enter Git, build products, tests, fixtures, or public artifacts". A private
repository is still Git. An emitted repository is still a build product. That
sentence is why `private` is not an answer to the rights hazard, and section 3
is the measurement of how close the current emit runs to it.
"""

evidence = """
Three evidence levels are used, and no row claims one it did not reach.

  [verified]  Measured here on 2026-08-02 by running the tool or reading the
              objects it wrote. The command is given and is reproducible.
  [recorded]  Taken from a record already in this repository, cited by path and
              line. Not independently re-derived here unless the row says so.
  [inferred]  Reasoned from the two above, flagged wherever it matters.

Nothing below is asserted from recall. Two propositions that would ordinarily be
asserted -- that GitHub renders a shifted date a particular way, and that GitHub
runs its own commit-graph maintenance -- are NOT verified here, because nothing
in this lane could reach GitHub without doing the thing this lane is forbidden
to do. They are recorded as open questions rather than smuggled in as findings.
"""

