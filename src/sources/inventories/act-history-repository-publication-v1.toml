# --- 2. Consumability ---------------------------------------------------------

[consumability]
finding = "the-operative-justification"
claim_as_put = """
THE CLAIM UNDER TEST: "a git repository cannot be consumed from inside another
git repository -- `git log`, `git diff` and `merge-base` are the whole point of
the artifact and none of them can be run against a subdirectory of this repo."

AS PUT, IT IS TOO STRONG, AND THE TRUE VERSION IS WORSE. `git log` CAN be run
against a subdirectory of another repository, if that subdirectory is a bare
repository whose files were committed. It was run, and it worked. What then
happens on a CLONE is the finding, and it is sharper than the claim it replaces.
"""
route_a_non_bare = """
ROUTE A -- COMMIT THE EMITTED REPOSITORY AS AN ORDINARY (NON-BARE) REPOSITORY.
Git refuses. `git add` writes a gitlink and warns:

    warning: adding embedded git repository: slice
    hint: Clones of the outer repository will not contain the contents of
    hint: the embedded repository and will not know how to obtain it.

and the index entry is `160000 <sha> 0 slice` -- a submodule pointer with no
URL. The objects are not stored. Resolving it means declaring a submodule, and a
submodule needs a repository at a URL, which is the thing being avoided. Route A
does not fail because it is inconvenient; it terminates in the same requirement
[verified, scratch repositories outside this tree].
"""
route_b_bare = """
ROUTE B -- COMMIT THE EMITTED REPOSITORY'S BARE FILES. This is the route that
appears to work, and it is the dangerous one.

Committing a packed bare repository stores 26 files: HEAD, config, description,
info/, packed-refs, the hook samples, and objects/pack/*. `git add` takes all of
them without complaint and nothing is left untracked. In the working tree where
they were committed, `cd slice && git log --oneline` prints the SLICE's history
-- 12 commits, 1570 to 1962 -- because git's repository discovery recognises the
directory itself as a bare git directory before it walks up to the parent.

THEN CLONE THE PARENT. In the clone, the same `git log --oneline` in the same
directory prints the PARENT's two commits instead. It does not error. It does
not warn. It answers a question about the Roman missal with a log of the outer
repository.

The mechanism is one sentence: git does not track empty directories, `refs/` is
empty once the refs are packed, so `refs/` does not exist in the clone,
`is_git_directory()` fails on the missing `refs`, discovery walks up, and the
parent answers. `mkdir refs` inside the clone repairs it completely --
`git log`, `git merge-base typica exempt-uses` and `git rev-list --all --count`
all then work and return 12 [verified].

So the honest form of the claim is not that the in-tree route is impossible. It
is that the in-tree route is EITHER REFUSED BY GIT (route A) OR SILENTLY WRONG
FOR EVERY READER WHO CLONES (route B), and that the second failure produces a
confident wrong answer with no diagnostic. That is `guidance/the-shape.md`
section 1's defect exactly -- a reference that resolves successfully and wrongly
-- and this repository has already ruled that class worse than an error.
"""
verdict = """
CONSUMABILITY IS THE OPERATIVE JUSTIFICATION, AND SIZE IS NOT.

`git log`, `git diff`, `git merge-base` and `git log --graph` are not
presentations of the artifact; they ARE the artifact. `guidance/act-histories.md`
is built on that: the diff of a station is the acceptance test, commonality is
computed by merge-base, and `reslotted` is carried by git's own rename
detection. A form of the artifact that cannot answer those commands to a reader
who did not build it is not a smaller version of it. It is a different thing.

The two in-tree routes are the only two there are, and both fail. A repository
of its own is therefore not a storage optimisation and cannot be justified on
storage grounds -- the measurements in [size] show it would be a storage
PESSIMISATION. It is the only form in which the artifact is what it claims to be.

WHETHER `guidance/sources.md:389` REACHES THIS IS A QUESTION FOR THE MAINTAINER
AND NOT FOR THIS RECORD. The rule admits two grounds, measured size and rights
constraints, and this is neither. It is a consumability constraint. This record
does not read a third ground into the rule on its own authority; it states the
measurement, states that the two admitted grounds fail, and leaves the amendment
to whoever owns `guidance/sources.md`. See [[open_questions]]
`the-rule-admits-two-grounds-and-this-is-a-third`.
"""
basis = "[verified] 2026-08-02, in scratch repositories outside this tree; no git write command was run against this repository."

