[rights]
finding = "private-does-not-resolve-this"
the_rule = """
`guidance/sources.md:382-384`: a `restricted` artifact's "bytes must not enter
Git, build products, tests, fixtures, or public artifacts."

A PRIVATE REPOSITORY IS STILL GIT. AN EMITTED REPOSITORY IS STILL A BUILD
PRODUCT. The rule's line is drawn at whether the bytes entered, not at who may
read them. Making a repository private changes the size of the audience for a
leak; it does not convert a leak into a non-leak, and it does not make the bytes
not have entered. This is the hazard `private` does not resolve, and it is the
whole reason this section is a measurement rather than a paragraph.
