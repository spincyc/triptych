# Whether the emitted act-history slices may be published as repositories.
#
# A DECISION RECORD, not a publication and not an authorization to publish.
# Nothing below registers a repository, configures a remote or pushes anything.
# Every number here was measured on 2026-08-02 by running `tools/act-history`
# against the tracked inventories and reading the emitted objects; nothing is
# taken from an estimate, a brief or a recollection.
#
# It exists because `guidance/sources.md:389` forbids a dedicated data
# repository "until measured source size or rights constraints justify the
# contribution and distribution cost", and the justification offered for these
# slices had never been measured. It is written so that the maintainer can act
# on a measurement rather than on an argument, and so that a later lane does not
# re-derive the answer from the same unmeasured premises.
#
# THE MEASUREMENT REVERSED THE ARGUMENT IT WAS ASKED TO CHECK. Size does not
# justify a separate repository for any slice. It justifies the opposite: every
# emitted repository is SMALLER than the browser data this repository already
# tracks and serves for the same slice, by factors of five, four and nineteen.
# The justification that survives is a different one, and it is recorded here
# with the measurement that establishes it.
#
# It sits in inventories/ for the reason its siblings `lt-hist-rights-audit-v1
# .toml` and `missal-acquisition-audit-v1.toml` give: `source-library validate`
# rejects any file under src/sources outside its own schema except .md and .toml
# under inventories/, and none of this is a source manifest, an evidence state
# or a binding target.
#
# It is not legal advice and it binds nobody outside this repository. Where it
# states a proposition of law it states the jurisdiction, and the jurisdiction
# throughout is the United States.

