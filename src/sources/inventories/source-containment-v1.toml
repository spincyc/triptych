# ---------------------------------------------------------------------------
# Whole Migne volume layers entered 2026-09-22 after a systematic audit
#
# A cold review found the whole of PG 124 registered under Theophylact's John
# commentary and entered nowhere, so `discover` reported no holding for his
# Pauline commentary at 1 Corinthians 1:4, which the layer prints at line 45001.
# Its provenance says "the whole Patrologia Graeca volume 124", which the
# pattern '\bwhole[- ]volume\b' could not see; the second artifact pattern
# above now reads "whole" and "volume" with up to three words between them, and
# finds no other record. Every registered text layer or facsimile naming a
# Migne volume was then listed and read: the rest are single-work extracts
# (Wikisource and Corpus Corporum texts, Documenta Catholica Omnia PDFs of one
# work each) or are already entered. PL 85, whose notes call it "the first tome
# of Migne's Liturgia Mozarabica, Patrologia Latina 85" without the word
# "whole", is entered below by that reading rather than by a pattern, and PL 172
# is the Gemma animae layer registered the same day. Each entry's constituents
# were read in the layer itself.
# ---------------------------------------------------------------------------

