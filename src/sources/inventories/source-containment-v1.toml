# Which library records hold other works inside them, and how much of each.
#
# THE QUESTION THIS ANSWERS. A commentary lead names a work; the library holds
# that work either under its own record or INSIDE another one -- a Migne
# volume, an Opera omnia tome, an NPNF or ANF anthology, a periodical, or a
# whole-volume optical layer filed under whichever constituent a lane happened
# to be reading. Nothing linked a container to what it contains, so a sweep
# that asked each lead's own record reported held witnesses as absent: the
# Venice tomus of Aquinas holds Super Matthaeum entire, and its own record said
# only in prose that the commentary was "not yet registered as such".
# `tools/tpt commentary-work-index discover` reads this file and reports, for
# every lead, the containers that hold it and whether the passage asked about
# falls inside the constituent's extent there. `guidance/catena.md` §11 owns
# the rule that a sweep asks through discover, never by work record alone.
#
# WHY HERE AND NOT ON THE RECORDS. `source-library`'s `source_fingerprint()`
# hashes each record's whole data and its ancestors', and reviewed bindings pin
# those fingerprints; a field added to any work or artifact record would move
# every fingerprint under it. This file adds nothing to any record. It sits in
# inventories/ because `source-library validate` accepts .toml there and
# nowhere else outside its own schema.
#
# WHAT A ROW CLAIMS, AND ON WHAT EVIDENCE. Every constituent and every extent
# below was read off the container's own description, notes or title, off a
# constituent edition that names the container as its printing, or off a
# segment or catena fragment that already points into the container's bytes.
# Each row's `basis` says which. Nothing is supplied from general knowledge of
# what such a volume usually holds: where a record says "among other works",
# the other works are not listed, and the container says so in `unresolved`.
#
#   status = "resolved"    every work the record says the container prints is
#                          listed
#   status = "partial"     some are listed; `unresolved` says what is not
#   status = "unresolved"  no constituent could be named from the record
#
#   scripture = [...]      the constituent's reach INSIDE this container, in
#                          canonical (Vulgate) numbering, `Book C[:V][-C[:V]]`;
#                          discover tests the asked passage against it
#   whole = true           the whole work, as it survives, is printed here;
#                          its reach is the work's own, which the index attests
#   locator                where in the container it stands (columns, pages,
#                          physical lines), when that is all the record states
#   extent_unresolved      why no extent could be established
#
# A constituent the commentary index lists is named exactly as the index names
# it (`author`, `title`), because that is the key discover joins on;
# `work_id`, where the library has one, joins it to the library's record too.
#
# SNAPSHOT DISCIPLINE. Every entry pins `manifest_sha256`, the SHA-256 of the
# container record's own manifest (work.toml, or artifact.toml for a
# whole-volume layer). A record edited after review fails the check until its
# entry is re-read and re-pinned; a pin is never refreshed without re-reading.
#
# WHAT FAILS `make check-sources`, through `commentary-work-index containment`:
#   - a container-shaped record with no entry: a work whose work_type is in
#     `shapes.work_types` or whose description matches
#     `shapes.description_patterns`; an artifact whose own notes match
#     `shapes.artifact_patterns` and whose owning work is not itself a
#     container; and, derived and undeclarable, any work whose bytes another
#     work's segment or catena fragment already points into;
#   - an entry naming a record the library does not have;
#   - a malformed extent, or a manifest changed since review;
#   - a segment or fragment showing a constituent the entry does not list;
#   - a constituent named other than the index names it.
# A record shaped like a container that holds no other work is entered under
# `not_containers` with the reason, so the judgment is recorded, not skipped.
#
# `identities` joins an index lead to a library work that no exact name match
# can reach -- an author spelled differently, or a library record that holds
# one part of the work the index names whole. Each row says which.

schema = "triptych-source-containment/v1"
record_type = "source-containment"
audited_on = "2026-09-23"
numbering = "vulgate"

[shapes]
work_types = [
  "anthology",
  "biblical-commentary-collection",
  "collected-volume",
  "collected-works",
  "collected-works-volume",
  "conciliar-collection",
  "conciliar-translation-anthology",
  "congregation-documentary-dossier",
  "critical-documentary-selection",
  "critical-source-collection",
  "devotional-anthology",
  "doctrinal-compilation",
  "edited-anthology",
  "edited-sermon-collection",
  "edited-source-collection",
  "encyclopedia-volume",
  "legislative-proceedings",
  "liturgical-source-collection",
  "medieval-penitential-compilation",
  "newspaper",
  "newspaper-issue",
  "official-gazette",
  "official-liturgical-periodical",
  "official-periodical",
  "official-record",
  "official-report",
  "patristic-collection",
  "patristic-translation-anthology",
  "periodical-issue",
  "periodical-volume",
  "reference-encyclopedia",
  "scholarly-journal-volume",
]
description_patterns = [
  '\bcontainer (?:identit|volume|work|witness)',
  '\bwork-level container\b',
  '\b(?:periodical|anthology) container\b',
  '\bregistered (?:here )?as a container\b',
  '\bcontainer identity distinct\b',
]
artifact_patterns = [
  '\bwhole[- ]volume\b',
  '\bwhole (?:[a-z]+ ){1,3}volume\b',
  '\bwhole of (?:the )?(?:leonine )?volume\b',
  '\bamong other works\b',
  '\bcomplete collected volume\b',
  '\bcomplete optical text of the volume\b',
  '\bcomplete offered ocr of the volume\b',
]

