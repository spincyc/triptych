vigils = 15
vigils_note = """
The Epiphany and the Ascension carry a Vigil Mass form in this file, and the Ordo
prints one formulary for each celebration - n. 20 and n. 58 - with no distinct
Vigil readings. Rather than assert that the Vigil takes the day's readings, which
