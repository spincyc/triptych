[structural_findings]
what = "Places where the file's SHAPE, not its numbers, departs from the book."
ad_libitum_folded_into_cycles = """
The Holy Family, the Baptism of the Lord, the Ascension and Pentecost each print,
in the Ordo, one main formulary plus an `Ad libitum, pro anno B` and/or
`pro anno C` set of alternatives. This file folds those alternatives into an A/B/C
`cycles` mapping, as though the book appointed them by year. It does not. At the
Baptism, n. 21, the first reading is Isaiah 42:1-4, 6-7 in ALL THREE years, the
psalm is Ps 28 in all three and the second reading is Acts 10:34-38 in all three;
Isaiah 55 and Isaiah 40 are optional alternatives offered in years B and C. Only
the Gospel varies by year there, and the Ordo says so by lettering it A, B, C.
The same holds for the Holy Family's Alleluia, for the Ascension's second reading
(n. 58, `Ad libitum, pro annis B et C`) and for Pentecost's second reading and
Gospel (n. 63).

Every one of those citations was read and every one is right. What is wrong is the
claim the structure makes about them. They were landed where the file put them and
the divergence is recorded here rather than silently restructured, because
restructuring is a decision about what this index means by `cycles`, and that
decision belongs to whoever owns the schema.
"""
slots_the_file_lacks = """
Two Sundays carry no Gospel Acclamation proper at all although the Ordo prints
one: the Third Sunday of Easter (n. 46, `Cf. Lc 24, 32`) and the Fifteenth Sunday
in Ordinary Time (n. 103, `Semen est verbum Dei`, printed without a reference).
Adding a proper is a structural edit and was not made here.
"""
lent_slot_names = """
The First to Third Sundays of Lent name the slot `Verse Before the Gospel` and the
Fourth and Fifth name it `Gospel Acclamation`. The Ordo heads all five the same
way, `V ANTE Ev.`, because Lent has no Alleluia. The inconsistency is this file's,
it is cosmetic, and it is recorded rather than fixed for the same reason as above.
"""

