# Recovery of every current dated postconciliar Mass whose own calendar
# record identifies a Common. This table is not a resolver input and supplies
# no Common formulary. It preserves evidence already present in the calendar
# notes/common-direction records so identity splits and prose revisions cannot
# silently lose the reading.

inventory_schema = 1
record_type = "postconciliar-sanctoral-commons-recovery"
recorded_on = "2026-08-27"
calendar = "postconciliar"
target_edition = "Missale Romanum, editio typica tertia, reimpressio emendata 2008"
calendar_path = "src/sources/calendars/postconciliar/propers.yaml"
status = "recovery-not-resolution"
projection_disposition = "not-projected"

purpose = """
One row names one stable, singular dated Mass identity and preserves the Common
evidence its current calendar record carries. The old 113-row estimate preceded
the split of composite date entries and later official additions; it is not an
inventory count. Counts below are derived from the current rows and are enforced
against the calendar.
"""

authority_boundary = """
An Ordo lectionum Missae heading governs the Lectionary provision only. It does
not establish the target Missal's antiphons, orations, internal Common
subdivisions, or a whole-formulary pointer. An Antiphonary direction governs
antiphons only: that excerpt contains no orations and is not a ritual edition.
The four later official addition notes preserve both headings reported by their
current calendar records, but this recovery table does not independently
register or re-verify those remote annexes. Every row therefore remains
resolvable = false and target_formulary_body_authority = false. The table must
never be consumed as takes_from/common_from data.
"""

wrong_edition_rule = """
wrong_edition_evidence marks a row whose calendar note also discusses an 1862
Tridentine antecedent. The flag quarantines that evidence from the target
postconciliar edition; it does not negate the separately recorded Ordo heading
on the same row and it never licenses the antecedent as target-Missal evidence.
"""

[counts.rows]
rows = 163
ordo_1981 = 144
official_additiones = 4
