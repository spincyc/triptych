required_result = "If sections/13-concise-commentary.tex:53 is reopened in a future edit, cite both loci ('\\work{Sermon}~19.1; cf.~\\work{Sermon}~12.4') or narrow the clause to Sermon 19.1's own call to self-restraint against gluttony and worldly cares."
accepted_because = "This compressed citation stands in settled prose outside REVIEW_SCOPE and mirrors upstream study-review accepted finding STU-012; repairing it would reopen settled synthesis prose without changing substance, and a reader is not misled about St. Leo's Advent teaching because bound Sermon 19.1 directly expounds Luke 21:34 against gluttony and worldly cares while bound Sermon 12.4 (already cited at line 44 and in References at 14:28) supplies the triad of prayer, fasting, and almsgiving."

[[advisories]]
stage = "homily-review"
id = "HOM-006"
severity = "advisory"
location = "sections/21-homily-note.tex:10, 20"
problem = "Both the source note (line 10) and the Holy Scripture reference entry (line 20) name the secondary Douay-Rheims textual control 'Challoner Gutenberg~1581' immediately beside '1899 American edition'. Per edition.english-college-of-douay.douay-rheims-bible.challoner-gutenberg-1581 (edition.toml), '1581' is Project Gutenberg eBook number 1581 (released 1998 from Challoner's 1749-1752 revision), not a 1581 printing; placing 'Gutenberg 1581' beside '1899 American edition' mirrors advisories STU-013 and SYN-008 and risks reading like a publication year (one year before the 1582 Rheims New Testament), though it does not appear in the spoken homily or mislead a listener."
required_result = "In any future edit touching sections/21-homily-note.tex, expand 'Challoner Gutenberg~1581' at lines 10 and 20 to 'Project Gutenberg eBook~1581 of the Challoner revision' so the catalog number cannot be misread as a printing year."

