[[accepted]]
stage = "study-review"
id = "STU-012"
severity = "accepted"
location = "sections/04-lane-eschatological.tex:30, 45"
problem = "Line 30 cites St. Leo the Great's Sermon 19.1 alone for the Advent discipline 'fasting, prayer, and almsgiving keep the heart from being weighed down by gluttony and worldly cares before that sudden Day,' and line 45 (Moral sense) repeats 'prayer, fasting, and almsgiving ... (Rom. 13:13; Leo, Serm. 19.1).' Direct inspection of the bound checked passage (passage.nicene-and-post-nicene-fathers.series-2-volume-12.new-york-1895.leo-sermo-19.1) and the full CCEL text of Sermon XIX.1 (ccel-text-7bb1db6e) confirms that Sermon 19.1 expounds Luke 21:34 against gluttony, drunkenness, and worldly cares and commends bodily self-restraint without mentioning prayer or almsgiving (fasting and almsgiving appear in unbound sections XIX.2-3). The tenth-month triad 'prayer, fasting, and almsgiving' comes from bound Sermon 12.4 (leo-sermo-12.4.toml), which research/interpretations.md:24 cited beside 19.1 as '(Sermons 19.1, 12.4)' and sections/09-references.tex:28 already lists."
required_result = "If sections/04-lane-eschatological.tex is reopened in a future edit, cite both loci ('Sermon 19.1; cf. Sermon 12.4' at line 30 and 'Leo, Serm. 12.4, 19.1' at line 45) or narrow line 30 to Sermon 19.1's own call to self-restraint against gluttony and worldly cares."
accepted_because = "This compressed citation stands in settled prose untouched in iteration 4 (where only line 43 moved to replace a bare chronology reference), repairing it would reopen settled study prose and trigger unnecessary downstream re-reviews, and a reader is not misled about St. Leo's Advent teaching because Sermon 19.1 genuinely expounds Luke 21:34 against gluttony and worldly cares while Sermon 12.4 (already cited at sections/06-lane-conversion.tex:14, 41 and sections/09-references.tex:28) supplies the tenth-month triad of prayer, fasting, and almsgiving."

[[accepted]]
stage = "synthesis-review"
id = "SYN-006"
severity = "accepted"
location = "sections/13-concise-commentary.tex:21; sections/14-concise-apparatus.tex:19"
problem = "At sections/13-concise-commentary.tex:21, compression of sections/04-lane-eschatological.tex:22 omitted the clause stating that St. Bede transmits St. Gregory's exposition of Luke 21:28-29 while retaining the opening scope phrase 'On vv.~28--29 and~32--33, St.~Bede (\\work{In Lucae Evangelium Expositio}~VI) notes that \\latin{Amen}...' ahead of a sentence whose content comes from v. 32 (followed by a separate sentence 'On verse~33...'). Consequently, vv. 28-29 (also listed in sections/14-concise-apparatus.tex:19 as 'on Luke~21:28--29, 32--33') receives no explicit exposition in the concise study."
required_result = "If sections/13-concise-commentary.tex:21 is reopened in a future edit, either add a brief clause noting that Bede transmits Gregory on vv. 28-29 before explaining Amen and generatio haec on v. 32, or narrow the lead-in to 'On verse~32' and trim '28--29,' from sections/14-concise-apparatus.tex:19."
accepted_because = "This standing minor compression slip (already accepted at synthesis-review iteration 2) stands in settled prose untouched in iteration 3; repairing it would disturb settled text on a tightly balanced concise layout while a reader who never learns that Bede transmitted Gregory on vv. 28-29 is not misled about Gregory's exposition of vv. 28-29 (already summarized at lines 11 and 19) or Bede's actual teaching on Luke 21:32-33."

