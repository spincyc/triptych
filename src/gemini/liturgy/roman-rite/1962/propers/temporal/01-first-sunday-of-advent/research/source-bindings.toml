loci = [
  "St. Augustine, De civitate Dei XX.14 (CCEL NPNF1-2 lines 37271-37339, trans. Marcus Dods: world passes 'by transmutation, not by absolute destruction' and 'The figure, therefore, passes away, not the nature', expounding Apoc 20:9-13 [esp. v. 11], anticipating Apoc 21:1, and quoting 1 Cor 7:31-32)",
  "St. Augustine, De civitate Dei XX.16 (CCEL NPNF1-2 lines 37406-37450, trans. Marcus Dods: 'then shall the figure of this world pass away in a conflagration of universal fire... so that, as the world itself is renewed to some better thing, it is fitly accommodated to men, themselves renewed in their flesh to some better thing', expounding Apoc 21:1 with Apoc 20:11 and 1 Cor 7:31)",
  "St. Augustine, De civitate Dei XX.24 (CCEL NPNF1-2 lines 38160-38338, trans. Marcus Dods: anti-Porphyry exposition of Ps 101:26-28 [Heb. 102:25-27] correlating 1 Cor 7:31, 1 John 2:17, and Matt 24:35 [not Luke 21:33] as milder expressions and 2 Pet 3:6-11 / the Flood to argue only the lower atmospheric heavens perish while the starry firmament remains safe; followed by Ps 49:3-5 [Heb. 50:3-5] on Christ's manifest judgment)"
]
context = "Patristic analogue witness (trans. Marcus Dods, NPNF1-2) underlying St. Bede's direct Luke 21:33 synthesis: XX.14 teaches transmutation rather than destruction (figure passes away, not nature); XX.16 teaches renewal through universal fire to something better; XX.24 argues against Porphyry from Ps 101:26-28 and 2 Pet 3:6-11 (citing Matt 24:35, not Luke 21:33, in passing) that only the lower atmospheric heavens perish as in the Flood. St. Bede (In Lucae Evangelium Expositio VI on Luke 21:33, passage.bede.in-lucae-evangelium-expositio.latin-migne-corpus-corporum-web-2026-07-25.luke-21-33) directly applies these threads to Luke 21:33 with his own wording (per imaginem vs. per essentiam; per ignem tergetur)."
