locus_1962 = "Missale Romanum (1962), Rubricae Generales Cap. XIX (137); Caeremoniale Episcoporum (1948) II.8 n. 18"
comparison = "The cope continues from 1962 usage in processions, solemn Office, and Eucharistic Benediction (GIRM 341; HCWEOM nn. 91–92). Following Tres abhinc annos (1967) no. 26 and GIRM 51 and 337, postconciliar rubrics permit the chasuble rather than requiring a cope for rites integrated directly into Mass such as the Sunday sprinkling rite and Ash Wednesday imposition of ashes."

