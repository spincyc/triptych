[symbolism]
has_sourced_symbolism = true
text = "Covering the minister's hands in clean white cloth while raising the monstrance or ciborium expresses profound reverence before Christ's Real Presence and visibly manifests that Christ Himself—not the human minister—imparts the Eucharistic blessing."
evidence_class = "liturgical-source"
attribution = "Holy Communion and Worship of the Eucharist Outside Mass (1973) nn. 91–92; Roman Missal (2008/2011), Evening Mass of the Lord's Supper"

[counterpart_1962]
relationship = "changed use"
locus_1962 = "Missale Romanum (1962), Ritus Servandus VII.9, X.8; Holy Thursday Transfer"
comparison = "In the 1962 Roman Missal, the humeral veil served both Eucharistic Benediction and processions and—at Solemn High Mass—the subdeacon, who wore it from Offertory to the Pater Noster to hold the empty paten (RS VII.9, X.8). After Paul VI's Ministeria quaedam (1972) suppressed the subdiaconate and the 1969/1970 Order of Mass omitted subdiaconal paten-holding, the humeral veil's liturgical use is dedicated exclusively to Eucharistic Benediction, processions, and Holy Thursday transfer."

