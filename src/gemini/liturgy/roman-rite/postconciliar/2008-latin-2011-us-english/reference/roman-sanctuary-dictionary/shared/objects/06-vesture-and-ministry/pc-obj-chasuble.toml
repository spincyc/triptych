[symbolism]
has_sourced_symbolism = true
text = "The chasuble is the outer liturgical sign proper to the priest celebrant’s presidential and sacrificial office at Mass (GIRM 335, 337). In devotional tradition distinct from the General Instruction, the traditional Roman sacristy vesting prayer echoes Christ’s words, “For my yoke is sweet and my burden light” (Matt 11:30), Christian tradition connects its all-enveloping mantle with charity—“But above all these things have charity, which is the bond of perfection” (Col 3:14)—and Amalarius of Metz sees in it the works of justice and holiness."
evidence_class = "liturgical-source"
attribution = "GIRM 335, 337; Matt 11:30; Col 3:14; traditional Roman sacristy vesting prayer (Ad Casulam); Amalarius of Metz, Liber Officialis II.19"

[counterpart_1962]
relationship = "continued"
locus_1962 = "Missale Romanum (1962), Rubricae Generales nn. 133–134, 137; Ritus Servandus I.4; Praeparatio ad Missam (Ad Casulam)"
comparison = "Both the 1962 Roman Missal (RG 133–134; RS I.4) and the 2002/2008 GIRM (119a, 337) prescribe the chasuble as the proper Mass vestment of the priest celebrant over alb and stole. Postconciliar rubrics additionally allow the chasuble for rites immediately joined to Mass such as the Sunday sprinkling, Ash Wednesday ashes, and funeral commendation (Tres abhinc annos 26; GIRM 337), emphasize graceful form and noble fabric over heavy ornament (GIRM 344), and introduce a narrow omission faculty for non-principal concelebrants in genuine need (GIRM 209; RS 124)."

