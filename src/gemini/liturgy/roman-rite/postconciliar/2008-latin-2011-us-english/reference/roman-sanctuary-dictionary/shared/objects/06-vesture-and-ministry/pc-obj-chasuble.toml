scope_level = "universal-roman"
territorial_note = "While universal Roman law requires the chasuble for the priest celebrant at Mass (GIRM 337; RS 123–124), USCCB adaptations at GIRM 346e and 346h permit white, violet, or black chasubles at funeral Masses and Masses for the Dead, and gold or silver chasubles on more solemn occasions."

[identification]
summary = "The chasuble is the full-draping sleeveless outer vestment proper to a bishop or priest celebrating Mass and sacred rites immediately joined to Mass."
appearance = "Worn over the white alb, amice, and straight stole by the priest on the left of Plate VIII, this ample Gothic-cut chasuble drapes evenly over shoulders and arms without separate sleeves and is accented down the chest and over the shoulders by a woven Y-shaped orphrey band."
placement_and_use = "Unless the rubrics provide otherwise, the chasuble is always worn by the priest celebrant—and by the principal celebrant at a concelebrated Mass—over the alb and stole at Mass and during actions directly connected with Mass, such as the Sunday sprinkling rite, Ash Wednesday imposition of ashes, and the final commendation at a funeral Mass (GIRM 337; RS 123; Tres abhinc annos 26). Concelebrating priests other than the principal celebrant wear the chasuble as well, omitting it only for a just reason such as a large gathering of priests or a scarcity of vestments, in which case they wear the stole over the alb (GIRM 209; RS 124). Deacons, instituted ministers, extraordinary ministers of Holy Communion, and altar servers never wear a chasuble (RS 126). Its nobility derives from quality fabric and graceful form rather than lavish ornament (GIRM 344), following the seasonal color cycle of GIRM 346."
liturgical_colors = "Follows GIRM 346: white, red, green, violet, rose (Gaudete and Laetare Sundays), black where customary for Masses for the Dead, and—in the United States under USCCB GIRM 346e and 346h—white, violet, or black for funerals and gold or silver on more solemn occasions."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest"]
prepares = ["sacristan"]
server_boundary = "clergy-reserved"
server_boundary_summary = "Strictly reserved to bishops and priests celebrating or concelebrating Mass (GIRM 337); deacons, instituted acolytes, instituted lectors, extraordinary ministers, and altar servers never wear a chasuble (RS 126). During Mass, servers keep lighted candles and hot thuribles safely clear of its wide flowing drape."
safety_warning = ""

[audience_text]
altar_server = "The chasuble is the sleeveless, flowing outer vestment worn exclusively by the bishop or priest celebrating Mass (GIRM 337). Compare it with the deacon’s rectangular sleeved dalmatic on the right of Plate VIII and the open-fronted cope in Plate IX. Servers never wear a chasuble (RS 126); take extra care during the elevation, Gospel, and incensations not to brush candle flames or a hot censer against its broad folds."
sacristan = "Lay out a clean, blessed chasuble of the appointed liturgical color (GIRM 335, 346; US 346e, 346h) paired with its matching priestly stole over wide contoured hangers so the shoulders never crease. For concelebrated Masses, prepare matching chasubles for concelebrants wherever available, reserving omission solely for genuine necessity (GIRM 209; RS 124)."
general_reader = "Enveloping the priest from shoulders to shins, the chasuble is the unmistakable outer garment of the Eucharistic celebrant at Mass (GIRM 337). Its seasonal color—white for Easter and Christmas, red for Pentecost and martyrs, green for Ordinary Time, violet for Advent and Lent, rose twice a year, and black, white, or gold where appointed—sets the visual tone of the day’s celebration (GIRM 346)."

