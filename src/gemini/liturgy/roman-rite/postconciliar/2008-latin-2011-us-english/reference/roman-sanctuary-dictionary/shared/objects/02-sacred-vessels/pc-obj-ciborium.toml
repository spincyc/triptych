locus_1962 = "Missale Romanum (1962), Ritus Servandus II.3, VII.3, X.6; CIC (1917) can. 1269"
comparison = "Both the 1962 Roman Missal (using Latin pyxis or vas) and the 2008/2011 IGMR (continuing Latin pyxis, rendered “ciborium” in English) appoint a blessed covered vessel for consecrating, distributing, and reserving the Sacred Hosts. Postconciliar norms expand distribution use to broad dignified bowls alongside stemmed ciboria, admit approved non-metal solid noble materials in the United States (US GIRM 329), and treat the silk ciborium veil as customary rather than universally mandated."

