locus_1962 = "Missale Romanum (1962), Ritus Servandus I.2, II.1, VI.8; Caeremoniale Episcoporum (1948) I.11 §5"
comparison = "In the 1962 Roman Missal, cassock and surplice were the standard vesture of altar servers, choir clergy, and priests administering many non-Mass rites with a stole (RS II.1, VI.8). Postconciliar GIRM 336 replaces surplice-and-stole with alb-and-stole whenever rubrics prescribe a stole alone or beneath chasuble/dalmatic, while retaining cassock and surplice for choir dress (RS 128) and permitting them for altar servers alongside the alb (US GIRM 339; CE 1984 no. 65)."

