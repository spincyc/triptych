[symbolism]
has_sourced_symbolism = true
text = "Holy Communion takes on a fuller form as a sign when received under both kinds, manifesting more clearly the Eucharistic banquet and the new and eternal Covenant ratified in Christ's Blood (GIRM 281; USCCB Norms 32–33). It echoes 1 Cor 11:25–26 (“This chalice is the new testament in my blood. This do ye, as often as you shall drink, for the commemoration of me.”) and Matt 26:27–28 (“Drink ye all of this.”)."
evidence_class = "liturgical-source"
attribution = "GIRM 281; USCCB Norms for Holy Communion under Both Kinds (2011) 32–33; Matt 26:27–28; 1 Cor 10:16; 1 Cor 11:25–26"

[counterpart_1962]
relationship = "newly provided"
locus_1962 = "Missale Romanum (1962), Rubricae Generales 503; Ritus Servandus X.6"
comparison = "In the 1962 Roman Missal, lay faithful received Holy Communion exclusively under the species of bread (RG 503; RS X.6), so no supplementary Communion chalices existed. Following Sacrosanctum Concilium 55, GIRM 281–287 and the USCCB Norms newly provide for additional chalices governed by the full sacred-vessel standards of GIRM 328–330."

