[edition_disposition]
edition_locale = "2008-latin-2011-us-english"
as_of = "2026-11-25"
disposition = "territorial adaptation"
scope_level = "territorial-usccb"
territorial_note = "Under GIRM 283 and the USCCB Norms for the Distribution and Reception of Holy Communion under Both Kinds in the Dioceses of the United States of America (2002; revised 2011), Communion from the chalice is broadly extended across United States dioceses. Liturgical law treats every Communion cup as a chalice governed by full sacred-vessel standards (GIRM 328, 330; RS 117)."

[identification]
summary = "A Communion cup is a supplementary footed chalice placed on the altar before the Eucharistic Prayer so that the Precious Blood of Christ may be distributed to the faithful when Holy Communion is given under both kinds."
appearance = "Shown at bottom center of Plate III as a simpler footed metal goblet with a smooth flared rim for clean sipping and a weighted base; Plate X displays two Communion cups flanking the principal chalice on the unfolded corporal, each paired with a neatly folded white purificator."
placement_and_use = "Every Communion cup is a true liturgical chalice and must be blessed before use and crafted with a nonabsorbent bowl—precious metal gilded inside if less precious than gold, never glass, earthenware, clay, or common domestic tableware (GIRM 328, 330, 333; RS 117–118; USCCB Norms 35). Wine is poured into all Communion chalices at the Preparation of the Gifts before the Eucharistic Prayer begins; pouring the Precious Blood from a flagon or from one chalice into another after consecration is strictly forbidden (RS 106; USCCB Norms 35–38). Each chalice is accompanied by a clean purificator to wipe the rim after each communicant (GIRM 286). After Communion, remaining Precious Blood is immediately consumed at the altar by the bishop, priest, deacon, or instituted acolyte—or by an extraordinary minister from his or her own chalice only with the diocesan bishop's permission—and all cups are purified strictly by the priest, deacon, or instituted acolyte (GIRM 279; RS 119; USCCB Norms 52–53)."
liturgical_colors = "Precious metal with gilded or nonabsorbent noble interior (GIRM 328, 330); paired with white linen purificator."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon", "instituted-acolyte", "extraordinary-minister"]
prepares = ["sacristan", "deacon", "instituted-acolyte", "altar-server"]
server_boundary = "prepares"
server_boundary_summary = "Servers may set empty, clean Communion cups and folded purificators on the credence table before Mass and carry empty cups to the altar at the Preparation of the Gifts before consecration. Once the Eucharistic Prayer begins, servers never touch, carry, consume from, or purify Communion cups (GIRM 279; RS 119; USCCB Norms 53)."
safety_warning = "Strict liturgical law: wine must be poured into Communion cups before consecration—never pour the consecrated Precious Blood from a flagon or between chalices (RS 106). Following the October 2006 non-renewal of the temporary U.S. indult, extraordinary ministers and altar servers never purify Communion cups; purification is reserved strictly to priest, deacon, or instituted acolyte (USCCB Norms 53)."

[audience_text]
altar_server = "Communion cups are smaller, simpler chalices used when the congregation receives the Precious Blood. You may place empty Communion cups and clean purificators on the credence table before Mass and carry empty cups to the altar at the Preparation of the Gifts so the priest or deacon can fill them with wine before the Eucharistic Prayer. Once Mass enters the Eucharistic Prayer, never touch any Communion cup, never pour wine or Precious Blood into one, and never wash or wipe them after Communion."
sacristan = "Set out the exact number of blessed Communion chalices needed for the congregation, paired one-for-one with clean folded purificators (GIRM 286; USCCB Norms 35). Inspect interior gilding and verify no glass, ceramic, or clay cups are ever used (GIRM 330; RS 117). Estimate wine quantities carefully before Mass so all wine is poured into chalices before the Eucharistic Prayer without excess remaining Precious Blood afterward (RS 106). After Mass, leave unpurified cups covered on a corporal exclusively for the priest, deacon, or instituted acolyte (GIRM 279; USCCB Norms 53)."
general_reader = "Because the postconciliar Roman Rite restored Communion under both kinds to the lay faithful, parishes regularly place additional chalices—commonly called Communion cups—beside the main chalice on the altar. Each cup meets the same sacred-vessel standard as the principal chalice, is filled before the consecration, and is paired with a white purificator so the rim is wiped reverently for every communicant (GIRM 285–286; USCCB Norms 32–36)."

