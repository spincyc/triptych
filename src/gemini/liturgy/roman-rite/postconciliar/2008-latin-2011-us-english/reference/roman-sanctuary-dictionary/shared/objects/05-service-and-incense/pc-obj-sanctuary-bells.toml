locus_1962 = "Missale Romanum (1962), Rubricae Generales n. 528; Ritus Servandus VII.8, VIII.6, X.6"
comparison = "Whereas the 1962 Roman Missal required a small bell on the Epistle-side table and prescribed ringing at the Sanctus and elevations (RG 528; RS VII.8, VIII.6), the 2002/2008 GIRM makes the bell optional according to local custom—shortly before the consecration and at each showing of the Host and Chalice—omitting the mandatory Sanctus and Communion rings (GIRM 150)."

