[edition_disposition]
edition_locale = "2008-latin-2011-us-english"
as_of = "2026-11-25"
disposition = "required"
scope_level = "universal-roman"
territorial_note = "While the stole’s wearing and reservation to ordained ministers follow universal Roman law (GIRM 340; RS 123–126), USCCB adaptations at GIRM 346e and 346h permit white, violet, or black stoles for funerals and Masses for the Dead, and gold or silver stoles on more solemn occasions."

[identification]
summary = "The stole is the long woven band of liturgical color worn exclusively by ordained ministers—bishops, priests, and deacons—as the outward insignia of Holy Orders."
appearance = "A narrow scarf-like woven band finished with matching fringed ends hangs straight in twin parallel panels beneath the priest’s chasuble on the left of Plate VIII, crosses diagonally from left shoulder to right hip on the center deacon, and peeks cleanly beneath the right hem of the dalmatic on the right deacon."
placement_and_use = "At Mass, the priest wears the stole around his neck hanging straight down in front of his chest—not crossed over the breast—over the alb and beneath the chasuble, matching the bishop’s manner (GIRM 337, 340). The deacon wears the stole diagonally from his left shoulder across his chest and back to be fastened at his right side, always beneath the dalmatic when the dalmatic is worn (GIRM 338, 340). A priest or deacon may never celebrate Mass wearing only a stole over ordinary street clothes or a monastic habit without the alb and appointed outer vestment, nor may a surplice replace the alb when only a stole is worn (GIRM 336; RS 123–126). Laypersons—including instituted acolytes, instituted lectors, extraordinary ministers of Holy Communion, and altar servers—are strictly prohibited from wearing a stole (RS 126). The stole follows the seasonal color of the day (GIRM 346): white, red, green, violet, rose (Gaudete and Laetare Sundays), black where customary, or festive gold or silver in the United States."
liturgical_colors = "Follows GIRM 346 seasonal colors: white, red, green, violet, rose (Third Sunday of Advent and Fourth Sunday of Lent), black where customary for Masses for the Dead, and—under USCCB GIRM 346e and 346h—white, violet, or black for funerals and gold or silver on more solemn occasions."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan"]
server_boundary = "clergy-reserved"
server_boundary_summary = "Strictly reserved to bishops, priests, and deacons; altar servers, instituted acolytes, instituted lectors, and extraordinary ministers of Holy Communion never wear a stole (RS 126). A sacristan lays out the matching seasonal priestly or diaconal stole cleanly in the sacristy."
safety_warning = ""

[audience_text]
altar_server = "Watch how the stole immediately identifies who is ordained in the sanctuary: a bishop or priest wears the stole around his neck hanging straight down in front beneath the chasuble, while a deacon wears it diagonally from his left shoulder to his right hip beneath the dalmatic (GIRM 340). Never put on a stole yourself—neither altar servers, instituted acolytes, instituted lectors, nor extraordinary ministers of Holy Communion may ever wear clerical insignia (RS 126)."
sacristan = "Lay out the matching seasonal priestly stole with every chasuble and the matching diaconal stole (tailored to fasten cleanly at the right hip) with every dalmatic, checking GIRM 346 and the United States color options for funerals and solemnities (US GIRM 346e, 346h). Hang stoles flat or draped cleanly without creasing embroidered orphreys, and keep a violet and white sacramental stole ready for Confessions and pastoral visits."
general_reader = "More than any other garment, the woven stole identifies an ordained minister at a glance. In the postconciliar Roman Rite, both bishop and priest wear it hanging straight down in front of the chest, while the deacon wears it sash-like from his left shoulder to his right hip under the dalmatic (GIRM 340)."

