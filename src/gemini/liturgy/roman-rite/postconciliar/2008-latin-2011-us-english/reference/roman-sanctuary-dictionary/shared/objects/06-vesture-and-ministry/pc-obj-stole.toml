[symbolism]
has_sourced_symbolism = true
text = "The stole outwardly signifies ordained ministry within the Body of Christ, distinguishing episcopal and presbyteral order from diaconal order by the manner in which it is worn (GIRM 335, 340). In devotional tradition distinct from the General Instruction, the traditional Roman sacristy vesting prayer asks the Lord to restore the robe of immortality lost by our first parents, while Amalarius of Metz sees in the stole the sweet yoke of the Gospel (Matt 11:29–30)."
evidence_class = "liturgical-source"
attribution = "GIRM 335, 340; traditional Roman sacristy vesting prayer (Ad Stolam); Matt 11:29–30; Amalarius of Metz, Liber Officialis II.20"

[counterpart_1962]
relationship = "changed use"
locus_1962 = "Missale Romanum (1962), Rubricae Generales n. 137; Ritus Servandus I.3–4; Praeparatio ad Missam (Ad Stolam)"
comparison = "While the deacon’s diagonal wearing from left shoulder to right hip continues unchanged from 1962, the 1962 Roman Missal required a priest celebrating Mass to cross the stole across his breast and anchor it with the cincture, reserving straight hanging to bishops and prelates (RS I.3–4). Under GIRM 340, every priest now wears the stole hanging straight down in front of his chest."

