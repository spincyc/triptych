locus_1962 = "Rituale Romanum (1925/1952), Title IV, ch. 2; Missale Romanum (1962), Ritus Servandus X.6"
comparison = "The portable hinged metal pyx carried in a pouch for Communion of the sick continues unchanged in construction from the 1962 Roman Ritual (Title IV, ch. 2) into postconciliar discipline (GIRM 329; CIC can. 939). Postconciliar pastoral law narrows English usage of “pyx” specifically to this portable sick-call container and extends its authorized pastoral carriage to formally deputed extraordinary ministers alongside clergy."

