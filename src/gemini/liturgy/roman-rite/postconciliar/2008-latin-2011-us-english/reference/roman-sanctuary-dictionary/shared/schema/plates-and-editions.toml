# ============================================================================
# SEVEN-TIER MINISTERIAL TAXONOMY (GIRM + REDEMPTIONIS SACRAMENTUM + CIC)
# ============================================================================

[[ministry_distinctions]]
minister = "Bishop (Episcopus)"
vesture = "Alb, cincture, amice (if needed), pectoral cross, straight stole, pontifical dalmatic (at major pontifical Masses), chasuble or cope, miter, ring, crosier."
sanctuary_role = "Principal liturgist of the diocese (GIRM 92); dedicates fixed altars, consecrates Sacred Chrism, blesses Holy Oils, judges tabernacle placement (GIRM 315), ordinary minister of Holy Communion."

[[ministry_distinctions]]
minister = "Priest (Presbyter)"
vesture = "Alb, cincture (unless fitted), amice (if collar exposed), straight vertical stole, chasuble at Mass (GIRM 337); cope outside Mass (GIRM 341); choir dress or cassock and surplice when not concelebrating (RS 128)."
sanctuary_role = "Confects the Eucharist in the person of Christ the Head (GIRM 93; RS 154); blesses vessels and vestments (GIRM 333, 335); ordinary minister of Holy Communion; consumes remaining Precious Blood and purifies sacred vessels."

[[ministry_distinctions]]
minister = "Deacon (Diaconus)"
vesture = "Alb, cincture (unless fitted), amice (if collar exposed), diagonal stole over left shoulder fastened at right hip (GIRM 340), dalmatic worn over stole (GIRM 338; omission discouraged by RS 125)."
sanctuary_role = "Carries Book of the Gospels and proclaims Gospel; prepares altar and chalice; elevates chalice at doxology; ordinary minister of Holy Communion and especially of the chalice (GIRM 182); purifies vessels (GIRM 279)."

[[ministry_distinctions]]
minister = "Instituted Acolyte (Acolythus institutus)"
vesture = "Alb (common garment of instituted ministers, GIRM 336) or other dignified attire in U.S. (GIRM 339); never stole, dalmatic, or chasuble (RS 126)."
sanctuary_role = "Layperson formally instituted by the bishop (Ministeria quaedam 1972; CIC can. 230 as amended by Spiritus Domini 2021). Assists at altar; extraordinary minister of Holy Communion ex officio; uniquely among laity may purify sacred vessels (GIRM 279; USCCB Norms 53)."

[[ministry_distinctions]]
minister = "Instituted Lector (Lector institutus)"
vesture = "Alb (GIRM 336) or dignified attire in U.S. (GIRM 339); never stole, dalmatic, or chasuble (RS 126)."
sanctuary_role = "Layperson formally instituted by the bishop (CIC can. 230). Carries Book of the Gospels in entrance procession only in the deacon's absence (GIRM 120d, 194); proclaims Scripture readings other than the Gospel and intentions of Universal Prayer."

[[ministry_distinctions]]
minister = "Extraordinary Minister of Holy Communion (EMHC)"
vesture = "Dignified lay attire or alb per diocesan directive (GIRM 339); never clerical vestments or stole (RS 126)."
sanctuary_role = "Deputed layperson acting strictly in genuine pastoral necessity (GIRM 100, 162; RS 155--158). Approaches altar only after the priest communicates (USCCB Norms 38); distributes Communion from handed vessels; may not purify sacred vessels (GIRM 279; Oct 2006 CDWDS decision; USCCB Norms 53)."

[[ministry_distinctions]]
minister = "Altar Server (Ministrans)"
vesture = "Alb (with cincture if unfitted) or black cassock with white surplice (never surplice without cassock, CE 65) or other dignified attire approved in U.S. (GIRM 339); never clerical insignia."
sanctuary_role = "Non-instituted lay server (GIRM 107; RS 47). Carries processional cross, candles, thurible, boat, bells, cruets, lavabo, and aspersorium; holds Missal or Book of the Chair; brings unconsecrated vessels at Preparation of Gifts. Never opens tabernacle, carries consecrated species, carries Book of Gospels in procession, or purifies vessels."

[[ministry_distinctions]]
minister = "Sacristan (Sacrista)"
vesture = "Ordinary dignified attire in the sacristy (vested in alb or cassock and surplice only when also exercising a sanctuary ministry)."
sanctuary_role = "Prepares sacred vessels, linens, liturgical books, vestments, candles, and credence table before Mass and sees to orderly care, sacrarium first-rinsing of linens (RS 120), and storage after Mass (GIRM 105)."

# ============================================================================
# EDITION INTROS & CATEGORY INTROS
# ============================================================================

[editions.comprehensive]
edition_noun = "comprehensive adult reference dictionary"
opening_prose = "Every object gathered in a Catholic sanctuary serves the one sacrifice of Christ made present upon the altar and the proclamation of the Word of God that prepares the faithful to share in it. From the freestanding stone mensa and the stationary ambo to the smallest linen purificator, the Roman Rite arranges physical matter with quiet clarity so that the eye recognizes what the Church celebrates without distraction. The plates that follow present forty principal furnishings, vessels, linens, books, service articles, and vestments of the postconciliar Roman sanctuary in monochrome graphite, separating universal Roman law from United States territorial adaptations and comparing each item directly with its counterpart in the 1962 Roman Missal."
sanctuary_reading_prose = "Look first across the whole sanctuary in Plate I. In the postconciliar Roman arrangement (GIRM 296--318), the architectural focus is clear and uncluttered: the freestanding altar stands at the center so that ministers may move around it and celebrate facing the congregation where possible (GIRM 299); the stationary ambo announces the dignity of the Liturgy of the Word (GIRM 309); the presidential chair expresses the priest's office of presiding and leading prayer without resembling a throne (GIRM 310); the credence table holds vessels and linens off the mensa until the Preparation of the Gifts (GIRM 118c, 306); and the solid, locked tabernacle with its continuously burning oil or wax lamp honors the Eucharistic Reservation apart from the altar of celebration (GIRM 314--316)."

[editions.altar-server]
edition_noun = "altar server visual dictionary"
opening_prose = "Serving at Mass places you close to the holiest mysteries on earth. A good altar server knows not only the items carried in procession or handed to the priest, but also every vessel, book, and vestment around the sanctuary—including the consecrated vessels and clergy-reserved appointments that a server recognizes with reverence and never touches. Use Plate I to orient yourself across the sanctuary before checking each functional plate for exact handling boundaries, handoff cues, and immediate safety rules."

[editions.sacristan]
edition_noun = "sacristan visual dictionary"
opening_prose = "Quiet, accurate preparation in the sacristy allows the sacred liturgy to unfold without hurry or confusion. The General Instruction of the Roman Missal (nos. 105, 117--119, 304--349) entrusts the sacristan with arranging the altar cloths, credence table, sacred vessels, folded linens, marked liturgical books, candles, incense, and seasonal vestments before the procession begins, and with guarding the reverent post-Mass care of altar linens and vessels. Every plate below pairs visual identification with the exact preparation standards of the 2008 Latin and 2011 United States Roman Missal."

[editions.general-reader]
edition_noun = "general reader visual dictionary"
opening_prose = "Walking into a Catholic church for Mass, a worshiper encounters stone, linen, metal, wax, parchment, and woven cloth arranged with centuries of liturgical memory. Forty principal furnishings, vessels, linens, books, service items, and vestments of the postconciliar Roman sanctuary are gathered in the plates that follow, showing what each object is, how the Church uses it in worship, what grounded symbolism the liturgy attaches to it, and how it continues or differs from the 1962 Roman Missal."

[category_intros]
sanctuary-furnishings = "The architecture of the sanctuary directs the assembly toward two tables—the table of God's Word at the ambo and the table of Christ's Body at the altar—while reserving a noble place apart for the tabernacle and a clear visible setting for the font of Baptism."
sacred-vessels = "Among all sanctuary appointments, sacred vessels receive special honor because they hold the Body and Blood of Christ (GIRM 327). Universal law prescribes precious metal gilded inside where necessary, while United States adaptations permit solid, non-breaking, non-absorbent noble materials for patens, ciboria, and pyxes—never glass, earthenware, or clay, and never flagons for holding or pouring the consecrated Precious Blood."
linens = "Five white linens serve the altar and sacred vessels. Because the corporal and purificator come into direct contact with the Sacred Species, the Church distinguishes them sharply from practical service towels both in fold geometry and in sacristy laundering, requiring first-rinse water to be poured into the sacrarium or clean earth (Redemptionis Sacramentum 120)."
liturgical-books = "In the postconciliar Roman Rite, the single 1962 altar Missal was divided into distinct ritual volumes reflecting the structure of Mass: the Roman Missal for presidential prayers and the Eucharistic Prayer, the Lectionary for the three-year Sunday and two-year weekday Scripture cycles, the ornate Book of the Gospels carried in solemn procession, and in the United States the lighter Book of the Chair for presidential prayers away from the altar."
service-and-incense = "Processional and service articles—cross, candles, cruets, lavabo, bells, holy water, and incense—give visible, audible, and fragrant reverence to the entrance of Christ's ministers, the proclamation of the Gospel, the offering of the gifts, and the consecration of the Eucharist."
vesture-and-ministry = "Diversity of vestments outwardly manifests the diversity of ministries within Christ's Body (GIRM 335). Every minister—bishop, priest, deacon, instituted acolyte, instituted lector, extraordinary minister of Holy Communion, and altar server—wears attire proper to that office, and lay ministers never assume the stole, dalmatic, or chasuble reserved to Holy Orders (Redemptionis Sacramentum 126)."
sacramental-adjacent = "Plate X unites the in-use arrangement of Communion under both kinds on an unfolded corporal with the three holy oils consecrated and blessed annually at the Chrism Mass (Sacred Chrism, Oil of Catechumens, and Oil of the Sick) and the baptismal font that stands at the threshold of Christian initiation."
superseded-postconciliar = "Postconciliar liturgical law developed across three typical editions of the Roman Missal (1970, 1975, and 2002/2008) together with papal motu proprios and dicasterial instructions. The three chronological entries below record provisions and practices that occurred during earlier postconciliar decades and have since been abolished, clarified, or explicitly prohibited. They are documented here strictly as historical stages and never as current liturgical law."

# ============================================================================
# CHRONOLOGICAL POSTCONCILIAR CHANGE TABLE (1963--2021)
# ============================================================================

[[chronology]]
date = "4 Dec 1963"
act = "Sacrosanctum Concilium (Second Vatican Council)"
sanctuary_effect = "Mandates revision of the Roman Missal (no. 50), richer proclamation of Scripture (nos. 35, 51), noble simplicity in rites, vestments, and art (nos. 34, 122--128), and extension of Communion under both kinds (no. 55)."

[[chronology]]
date = "26 Sept 1964"
act = "Inter Oecumenici (SCR / Consilium; effective 7 Mar 1965)"
sanctuary_effect = "First structural implementation of conciliar reform; recommends freestanding altar built separate from the wall (no. 91) and introduces ambo, chair, and tabernacle adjustments."

[[chronology]]
date = "4 May 1967"
act = "Tres abhinc annos (SCR / Consilium; effective 29 June 1967)"
sanctuary_effect = "Declares the maniple no longer required (no. 25); reduces altar kisses, genuflections, and signs of the cross."

[[chronology]]
date = "3 Apr 1969"
act = "Missale Romanum (Ap. Const., Paul VI; Order of Mass effective 30 Nov 1969)"
sanctuary_effect = "Promulgates the revised Roman Missal, three additional Eucharistic Prayers, and the three-year Sunday / two-year weekday Lectionary separation."

[[chronology]]
date = "26 Mar 1970"
act = "Missale Romanum, editio typica prima (Decree Celebrationis eucharisticae, Prot. 166/70)"
sanctuary_effect = "First typical edition of postconciliar Missal and IGMR. Briefly retains transitional subdeacon (nos. 142--152) and tunicle (no. 301); omits chalice veil mention and explicit corpus on altar cross; uses broad vessel-material wording."

[[chronology]]
date = "3 Dec 1970"
act = "Ordo benedicendi oleum (SCDW; editio typica 1971)"
sanctuary_effect = "Revises Chrism Mass and blessing of Holy Oils; permits vegetable oils in addition to olive oil."

[[chronology]]
date = "15 Aug 1972"
act = "Ministeria quaedam (Motu Proprio, Paul VI; effective 1 Jan 1973)"
sanctuary_effect = "Suppresses first tonsure, minor orders, and the major order of subdeacon in the Latin Church; establishes the two lay instituted ministries of Lector and Acolyte."

[[chronology]]
date = "29 Jan 1973"
act = "Immensae caritatis (SCDS)"
sanctuary_effect = "Establishes universal discipline for Extraordinary Ministers of Holy Communion in genuine pastoral need."

[[chronology]]
date = "21 June 1973"
act = "De sacra communione et de cultu mysterii eucharistici extra Missam (SCDW)"
sanctuary_effect = "Publishes postconciliar norms for Communion outside Mass, Eucharistic exposition, processions, and Benediction (retaining white cope and humeral veil)."

[[chronology]]
date = "27 Mar 1975"
act = "Missale Romanum, editio typica altera (Decree Cum Missale Romanum)"
sanctuary_effect = "Removes subdeacon and tunicle from IGMR, substituting instituted acolyte and lector; retains 1975 nos. 270, 276, and 290--291 wording on cross, tabernacle, and vessel materials."

[[chronology]]
date = "21 Jan 1981"
act = "Ordo lectionum Missae, editio typica altera (SCSD)"
sanctuary_effect = "Expanded General Introduction to the Lectionary affirming dignity of the Lectionary and strongly commending a separate Book of the Gospels (nos. 35--37)."

[[chronology]]
date = "25 Jan 1983"
act = "Codex Iuris Canonici (John Paul II; effective 27 Nov 1983)"
sanctuary_effect = "Codifies universal law on lay ministries (can. 230), holy oils (can. 847), parish baptismal font (can. 858), ministers of Communion (can. 910), tabernacle, pyx, and sanctuary lamp (cann. 938--940), and fixed/movable altars (cann. 1235--1239)."

[[chronology]]
date = "14 Sept 1984"
act = "Caeremoniale Episcoporum, editio typica (CDW)"
sanctuary_effect = "Codifies episcopal and solemn ceremonial appointments, Chrism Mass (no. 274), and vestment norms including that the surplice is always worn over a cassock (no. 65)."

[[chronology]]
date = "20 Apr 2000 / 2002"
act = "Missale Romanum, editio typica tertia & CDWDS Response (25 Sept 2000, Prot. N. 2036/00/L)"
sanctuary_effect = "Restores mandatory figure of Christ crucified on the cross (GIRM 308), precious metal as primary vessel norm (328--330), explicit praise of the optional chalice veil (118), two co-equal tabernacle options judged by the bishop (314--315), and clarifies GIRM 299 freestanding altar wording."

[[chronology]]
date = "22 Mar 2002"
act = "USCCB Norms for Holy Communion under Both Kinds (Prot. 1383/01/L; revised 2011)"
sanctuary_effect = "Establishes particular law for U.S. dioceses on Communion under both kinds; paired initially with a 3-year EMHC purification indult whose non-renewal CDWDS confirmed in October 2006."

[[chronology]]
date = "25 Mar 2004"
act = "Redemptionis Sacramentum (CDWDS; AAS 96 [2004] 549--601)"
sanctuary_effect = "Strictly prohibits post-consecration pouring and flagons for the Precious Blood (no. 106), reprobates glass, earthenware, and clay sacred vessels (no. 117), mandates sacrarium first-rinsing of linens (no. 120), and guards ordained vesture and EMHC limits (nos. 121--128, 154--160)."

[[chronology]]
date = "2008"
act = "Missale Romanum, editio typica tertia, reimpressio emendata (Notitiae 44 [2008] 367--388)"
sanctuary_effect = "Emended Latin reprint incorporating textual corrections, new dismissals, and Supplementum; IGMR sanctuary, vessel, linen, book, and vesture provisions remain unchanged."

[[chronology]]
date = "27 Nov 2011"
act = "The Roman Missal, Third Edition (United States of America)"
sanctuary_effect = "Implements third typical edition in U.S. dioceses with CDWDS-confirmed U.S. GIRM adaptations (nos. 283, 301, 304, 329, 339, 346e, 346h) and harmonized 2011 USCCB Communion Norms."

[[chronology]]
date = "2018 / 2021"
act = "USCCB Excerpts from the Roman Missal (2018), Spiritus Domini (10 Jan 2021), and Postquam Summus Pontifex (22 Oct 2021)"
sanctuary_effect = "Publishes official U.S. Book of the Chair (2018); amends CIC can. 230 §1 to open instituted Lector and Acolyte to lay men and women (Spiritus Domini); adjusts liturgical-book preliminary norms to amended can. 838 (Prot. n. 394/21, incorporated with Prot. n. 228/20 in the U.S. online GIRM)."

# ============================================================================
# SACRISTAN PREPARATION CHECKLIST
# ============================================================================

[[sacristan_checklist]]
stage = "Before Mass: Sanctuary and Altar (GIRM 117--118, 304--316)"
items = [
  "Confirm at least one clean white linen altar cloth covers the mensa smoothly, with any additional festive colored under-cloth permitted by US GIRM 304 neat and unwrinkled.",
  "Confirm the required number of wax/oil candles (2, 4, or 6; 7 for the diocesan bishop) are trimmed and positioned harmoniously on or around the altar without blocking sightlines (GIRM 117, 307).",
  "Confirm one cross bearing the figure of Christ crucified is clearly visible on or near the altar (or prepared for the entrance procession so it stands as the sole altar cross per GIRM 122, 308).",
  "Verify that the sanctuary lamp near the tabernacle has an active oil or wax flame (GIRM 316; CIC can. 940) and that the tabernacle key is safeguarded properly.",
  "Keep the altar mensa completely bare of cruets, Missal stand, and spare papers until the Preparation of the Gifts (GIRM 306), except for the Book of the Gospels placed there at the entrance procession.",
]

[[sacristan_checklist]]
stage = "Before Mass: Credence Table and Sacred Vessels (GIRM 118c, 327--333; RS 106, 117)"
items = [
  "Set out the blessed principal chalice (gilded interior/nonabsorbent bowl), wide paten, folded 3x3 corporal, folded purificator, optional pall, and optional chalice veil (white or color of the day, GIRM 118c).",
  "If Communion under both kinds is celebrated, place the required number of blessed footed Communion chalices and one clean purificator per chalice on the credence table (GIRM 286; never glass, ceramic, or clay, RS 117).",
  "Prepare clean stoppered wine and water cruets on their tray (or wine flagon for the offertory procession, ensuring wine is poured into chalices before consecration, RS 106), plus lavabo pitcher, basin, and folded lavabo towel.",
  "Prepare the Communion-plate (if used), sanctuary bell (according to local custom, GIRM 150), and aspersorium with fresh water and aspergillum if the Sunday sprinkling rite replaces the Penitential Act (GIRM 51).",
]

[[sacristan_checklist]]
stage = "Before Mass: Liturgical Books and Vestments (GIRM 118, 335--349)"
items = [
  "Verify the Lectionary is open to the exact Sunday (Year A/B/C) or weekday (Year I/II) readings on the ambo—never placed in the entrance procession (GIRM 118b, 120d, 194).",
  "Mark the ornate Book of the Gospels for the deacon (or lector if no deacon) to carry in the entrance procession (GIRM 120d, 133).",
  "Set ribbons and tabs in the Roman Missal (and in the Book of the Chair / Excerpts from the Roman Missal beside the presidential chair, GIRM 118a) for the day's Collect, Prayer over the Offerings, Preface, Eucharistic Prayer, and Prayer after Communion.",
  "Lay out clean vestments in the correct liturgical color (GIRM 346, US 346e/h): alb, cincture, amice (if collar exposed), straight stole, and chasuble for the priest; alb, diagonal stole, and dalmatic for the deacon; albs or cassocks and surplices for servers.",
]

[[sacristan_checklist]]
stage = "After Mass: Purification Boundary and Linen Care (GIRM 279; RS 119--120)"
items = [
  "Leave any unpurified sacred vessels suitably covered on a corporal at the altar or credence table strictly for the priest, deacon, or instituted acolyte to purify (GIRM 279; RS 119; USCCB Norms 53)—never wash unpurified vessels in an ordinary sink.",
  "Soak and hand-rinse used corporals, purificators, and palls first in a dedicated basin and pour the first rinse water into the sacrarium (or directly into clean earth) before ordinary laundering (RS 120).",
  "Extinguish candles cleanly with a snuffer, check that thurible coals are extinguished safely in a fireproof vessel, and inspect the ambry of holy oils before annual Chrism Mass renewal (CIC can. 847).",
]

