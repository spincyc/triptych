[identification]
summary = "A low, angled wooden, metal, or cushioned bookrest placed on the altar at the Preparation of the Gifts to support the open Roman Missal at a readable slope without obstructing the assembly's view."
appearance = "At top left of Plate V, directly beneath the open Roman Missal, the low hinged wooden stand features a shallow front ledge that holds the heavy volume securely from sliding while keeping the book well below eye level across the altar."
placement_and_use = "Although neither a stand nor a cushion is expressly mandated by name in GIRM 118 or 306, a low stand or firm cushion is widely customary on the altar during the Liturgy of the Eucharist (GIRM 139, 306). Kept off the bare mensa during the Introductory Rites and Liturgy of the Word, it is brought to the altar at the Preparation of the Gifts and positioned cleanly to the left of the corporal—never overlapping the linen and low enough not to impede the faithful's view of what takes place at the altar (GIRM 306--307)—then removed after vessel purification or Mass."
liturgical_colors = "Finished in natural wood, brass, or subtle metal harmonious with the altar; where a fabric Missal cushion is used, it may match the white altar cloth or the liturgical color of the day."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest"]
prepares = ["sacristan", "deacon", "instituted-acolyte", "altar-server"]
server_boundary = "handles"
server_boundary_summary = "Servers keep the Missal stand off the altar mensa before the Preparation of the Gifts, carry it to the altar alongside the Roman Missal at the Preparation of the Gifts, set it neatly to the left of the corporal without overlapping the linen, and remove it cleanly after purification or Mass."
safety_warning = "Verify that hinged wooden or metal stands lock firmly at a low angle before setting the heavy Roman Missal upon them so the stand cannot collapse during the Eucharistic Prayer, and never set any edge of the stand over the unfolded corporal."

[audience_text]
altar_server = "Look directly beneath the open Roman Missal at top left of Plate V to see the low angled Missal stand. Keep the stand on the credence table—never sitting empty on the bare altar—until the Preparation of the Gifts (GIRM 139, 306). When you carry it to the altar, double-check that its folding hinge is locked securely, set it squarely to the left of the unfolded corporal without touching the linen or edging toward a candle, and remove it neatly after purification when directed."
sacristan = "Select a low-profile, sturdy Missal stand (or firm cushion) proportioned to the altar so it supports the heavy third-edition Roman Missal without forming a visual barrier between the celebrant and the assembly (GIRM 307). Check hinges, lips, and protective felt base pads regularly so the stand neither collapses nor scuffs the altar cloth, and stage it on the credence table rather than on the mensa before Mass (GIRM 306)."
general_reader = "This low angled wooden rest—or, in some churches, a firm tailored cushion—supports the heavy Roman Missal at a legible slope for the priest during the Liturgy of the Eucharist. It remains off the altar during the first half of Mass so the mensa stays uncluttered, and its low height preserves an unobstructed view of the Eucharistic action (GIRM 306--307)."

