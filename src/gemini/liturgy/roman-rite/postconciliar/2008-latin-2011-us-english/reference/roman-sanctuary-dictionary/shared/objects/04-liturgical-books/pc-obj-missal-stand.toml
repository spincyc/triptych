[counterpart_1962]
relationship = "continued"
locus_1962 = "Missale Romanum (1962), Rubricae Generales 527; Ritus Servandus VI.5, XI.1"
comparison = "The Missal stand or cushion continues in practical form from the 1962 Roman Missal, which expressly required a cushion or bookstand beneath the Missal on the altar from the start of Mass and directed the server to move it from the Epistle side to the Gospel side and back (RG 527; RS VI.5, XI.1). In the postconciliar Roman Rite, it is neither mandated by name nor kept on the altar before the Preparation of the Gifts, but set once on the mensa for the Liturgy of the Eucharist and removed afterward (GIRM 139, 306)."

