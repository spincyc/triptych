locus_1962 = "Missale Romanum (1962), Rubricae Generales 528 (negative witness: small wine and water cruets only)"
comparison = "The 1962 Roman Missal had no counterpart to a wine flagon because lay Communion was distributed under the species of bread alone and small cruets on the credence table sufficed (RG 528). The flagon emerged with the postconciliar gifts procession and Communion under both kinds, and was strictly restricted to pre-consecration wine transport by Redemptionis Sacramentum 106 (2004)."

