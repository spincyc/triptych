[symbolism]
has_sourced_symbolism = true
text = "As the single white garment shared by ordained and instituted ministers of every rank, the alb outwardly recalls baptismal dignity in Christ (GIRM 335–336), echoing St. Paul, “For as many of you as have been baptized in Christ have put on Christ” (Gal 3:27), and the saints who “have washed their robes and have made them white in the blood of the Lamb” (Apoc 7:14). Outside the norms of the General Instruction, the traditional Roman sacristy vesting prayer asks the Lord to make the minister pure and white in the blood of the Lamb, and Amalarius of Metz interprets the loose linen tunic as Christian freedom and bodily discipline."
evidence_class = "liturgical-source"
attribution = "GIRM 335–336; Gal 3:27; Apoc 7:13–14; traditional Roman sacristy vesting prayer (Ad Albam); Amalarius of Metz, Liber Officialis II.18"

[counterpart_1962]
relationship = "changed use"
locus_1962 = "Missale Romanum (1962), Rubricae Generales Tit. XIX.1; Ritus Servandus I.2–3, II.1, VI.8; Praeparatio ad Missam (Ad Albam)"
comparison = "In the 1962 Roman Missal, the alb was worn solely by ordained sacred ministers at Mass (bishop, priest, deacon, and subdeacon, RS I.2–3), while altar servers and minor clerics wore cassock and surplice (RS II.1, VI.8). Under the 2002/2008 GIRM, the alb becomes the universal common garment of all ordained and instituted ministers, may never be replaced by a surplice under a chasuble, dalmatic, or stole alone (GIRM 336), and in the United States is also permitted for altar servers, readers, and other lay ministers (US GIRM 339)."

