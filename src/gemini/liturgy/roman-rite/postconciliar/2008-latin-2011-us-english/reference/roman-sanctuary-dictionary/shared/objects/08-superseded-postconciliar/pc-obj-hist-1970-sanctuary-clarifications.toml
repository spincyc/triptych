territorial_note = "All four clarifications belong to universal Roman law (2002/2008 IGMR and the 25 September 2000 CDWDS Response) and stand unchanged in the 2011 United States Roman Missal."

[identification]
summary = "The third typical edition of the Roman Missal (2002/2008) together with a formal Roman clarification in 2000 resolved four sanctuary ambiguities inherited from the 1970 and 1975 editions. First, whereas 1975 GIRM no. 270 spoke only of a cross visible to the assembly without specifying a corpus—producing widespread bare crosses—2002/2008 GIRM no. 308 explicitly mandates a cross bearing the figure of Christ crucified (cum figura Christi crucifixi) on or near the altar, remaining there appropriately even outside Mass. Second, when the freestanding altar wording of GIRM no. 299 raised questions about historic churches, the Congregation for Divine Worship and the Discipline of the Sacraments issued its Response of 25 September 2000 (Prot. N. 2036/00/L; Notitiae 36:171–173), clarifying that expedit expresses desirability rather than an absolute ban on historic wall-attached altars or celebration ad orientem. Third, 2002/2008 GIRM nos. 314–315 refined 1975 GIRM no. 276 by placing two tabernacle locations on equal footing under the judgment of the diocesan bishop: either in the sanctuary apart from the altar of celebration (including on a former altar no longer used for Mass) or in an organically connected, readily noticeable adoration chapel. Fourth, the three 1962 altar cards (tabellae secretarum) were omitted from the 1970 Missal and remain excluded from the mensa under GIRM no. 306, whereas 2002/2008 GIRM no. 118c restored explicit praise of covering the prepared chalice with a veil (color of the day or white), leaving the burse unnamed as a customary accessory."
appearance = "These four clarifications govern the visual profile of the postconciliar sanctuary: a crucifix rather than a bare cross at or near the altar, preservation of historic wall altars alongside freestanding altars, a solid locked tabernacle placed either in the sanctuary apart from the altar of celebration or in a connected chapel, a mensa free of framed altar cards, and an optional cloth veil draped over the prepared chalice on the credence table."
placement_and_use = "Records the normative clarifications introduced between the 1970/1975 first and second typical editions and the 2002/2008 third typical edition of the Roman Missal."
liturgical_colors = "When used, the chalice veil is either the liturgical color of the day or white (GIRM no. 118c); not applicable to the altar cross, tabernacle, or superseded altar cards."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan"]
server_boundary = "superseded-historical"
server_boundary_summary = "Historically superseded ambiguities; current practice requires a corpus on the altar or processional cross, keeps altar cards off the mensa, follows the diocesan bishop's judgment on tabernacle placement, and welcomes an optional chalice veil."
safety_warning = ""

[audience_text]
altar_server = "The altar or processional cross always bears the sculpted figure of Christ crucified, no altar cards are placed on the altar table, and a fabric chalice veil may cover the prepared chalice on the credence table before the Preparation of the Gifts."
sacristan = "Confirm that the altar or processional cross bears the figure of Christ crucified (GIRM no. 308), keep altar cards off the mensa (GIRM no. 306), observe diocesan directives for the tabernacle, and prepare a clean white or color-of-the-day chalice veil when used in the parish (GIRM no. 118c)."
general_reader = "Between 1970 and 2008, the Church clarified several sanctuary details: requiring the figure of Christ crucified on the altar cross rather than a bare cross, confirming that historic wall altars and celebration facing east remain lawful, giving the diocesan bishop two equal options for locating the tabernacle, keeping old altar cards off the altar table, and explicitly commending the optional chalice veil."

