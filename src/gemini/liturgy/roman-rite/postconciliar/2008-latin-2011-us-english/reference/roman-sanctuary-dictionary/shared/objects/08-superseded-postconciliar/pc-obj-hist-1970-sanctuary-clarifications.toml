[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Rubricae Generales nn. 526–527; Ritus Servandus I.1, II.2; CIC 1917 cann. 1268–1269"
comparison = "The 1962 Roman Missal required a central altar crucifix, ordinarily placed the tabernacle in the middle of the high altar, prescribed three altar cards during Mass, and mandated a silk chalice veil with matching burse. Postconciliar clarifications in 2000–2008 reaffirm the crucifix, permit freestanding or historic wall altars, place sanctuary and chapel tabernacle sites on equal footing under the diocesan bishop's judgment, supersede the three altar cards on the mensa, and commend the chalice veil as a praiseworthy optional practice while leaving the burse as an unnamed custom."

[historical_transition]
is_superseded = true
period_range = "1970–2002/2008"
controlling_act = "CDWDS Response (25 Sept 2000, Prot. N. 2036/00/L); GIRM (2002/2008) nos. 118c, 299, 306, 308, 314–315"
current_status = "The altar or processional cross must display the figure of Christ crucified (GIRM no. 308); freestanding altars are recommended where possible without banning historic wall altars or celebration ad orientem (GIRM no. 299; CDWDS 25 Sept 2000); the diocesan bishop judges between placing the tabernacle in the sanctuary apart from the altar of celebration or in an organically connected adoration chapel (GIRM nos. 314–315); altar cards are excluded from the mensa (GIRM no. 306); and covering the prepared chalice with a veil of the color of the day or white is explicitly praised, with the burse remaining an unnamed customary accessory (GIRM no. 118c)."

