[symbolism]
has_sourced_symbolism = true
text = "Named from the Latin corpus (“body”), the corporal is made of pure white linen because Christ's body was wrapped in a clean linen shroud at his burial: “And Joseph taking the body wrapped it up in a clean linen cloth” (Matt 27:59; cf. John 20:6, “and saw the linen cloths lying”). Following ancient Roman tradition expounded by St. Thomas Aquinas, the white linen signifies purity of conscience and recalls the Passion of Christ."
evidence_class = "scriptural-patristic"
attribution = "St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 3, ad 7 (citing De Consecr. dist. 1); Matt 27:59; John 20:6"

[counterpart_1962]
relationship = "continued"
locus_1962 = "Missale Romanum (1962), Ritus Servandus I.1, II.2, VI.7"
comparison = "The square white linen corporal folded inward in nine squares continues directly from the 1962 Roman Missal (RS I.1). In postconciliar Mass with a congregation, it is placed on the altar at the Preparation of the Gifts rather than drawn from a stiff burse at the start of Low Mass (1962 RS II.2), and GIRM 118c no longer mandates a burse."

