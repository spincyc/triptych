[identification]
summary = "The thurible is a chained metal censer in which fragrant resin incense is burned upon glowing charcoal during Mass, Eucharistic Benediction, solemn Liturgy of the Hours, and funerals."
appearance = "A footed metal bowl decorated in relief hangs from a top finger ring on outer rim chains (two visible in profile on Plate VII), while a central chain lifts the perforated domed cover to expose the removable circular charcoal fire-pan and grate shown in the center detail of Plate VII."
placement_and_use = "Incense may be used optionally in any form of Mass at five appointed moments: during the entrance procession, at the start of Mass to incense the cross and altar, at the Gospel procession and proclamation, after the bread and chalice are placed on the altar to incense the offerings, cross, altar, priest, and people, and at the showing of the Host and Chalice after the consecration (GIRM 120a, 133, 144, 150, 276). The priest imposes incense onto the charcoal and blesses it silently with the Sign of the Cross (GIRM 277). Incensation follows the rhythmic swing pattern of GIRM 277—three swings (tribus ductibus) for the Blessed Sacrament, a relic of the True Cross, images of the Lord, the offerings, the altar cross, the Book of the Gospels, the paschal candle, the priest, and the people; two swings (duobus ductibus) for relics and images of the Saints; and continuous single swings while walking around the altar (each ductus being executed as a paired double swing in Roman ceremonial custom, Caeremoniale Episcoporum 92)—framed by a profound bow before and after except when incensing the altar and offerings."
liturgical_colors = "Not governed by the seasonal color cycle; crafted in heat-resistant polished brass, bronze, silver-plate, or sterling silver."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon", "instituted-acolyte", "altar-server"]
prepares = ["sacristan", "altar-server", "instituted-acolyte"]
server_boundary = "handles"
server_boundary_summary = "The thurifer lights charcoal safely in the sacristy, leads the entrance procession with the smoking thurible, raises the dome steadily for the priest to impose incense, hands the censer to the priest or deacon, and—when no deacon serves—incenses the priest, assembly, and consecrated Host and Chalice at the elevations (GIRM 120a, 150, 277)."
safety_warning = "Handle burning charcoal exclusively with metal tongs, never with bare fingers. Keep the hot bowl and chains clear of vestments, white altar linens, and narrow aisles, swing only with controlled short wrist movements, and empty spent coals into a dedicated fireproof metal ash vessel rather than an ordinary trash bin."

[audience_text]
altar_server = "As thurifer, ignite the charcoal fully in the sacristy with tongs until it glows evenly before leading the entrance procession. Hold the top ring in your left hand and pull the central chain cleanly when opening the dome for the priest to spoon incense onto the coals. Before handing the thurible to the priest or deacon, shorten the chains smoothly so he can grip the bowl securely; when no deacon is present, you incense the priest, the congregation, and the elevated Host and Chalice with three reverent swings (executed as paired double swings in Roman ceremonial custom, Caeremoniale Episcoporum 92) framed by profound bows (GIRM 150, 277)."
sacristan = "Keep the removable fire-pan free of built-up resin slag and inspect chain links, ring clasps, and dome vents before every solemnity so no chain snaps mid-swing. Provide quick-lighting or briquette charcoal, metal tongs, a safe heatproof lighter, a stable stand, and a lidded fireproof metal ash bucket in the sacristy for safe cooling after Mass."
general_reader = "When clouds of fragrant smoke curl upward from the swinging metal thurible at the entrance, Gospel, Preparation of the Gifts, and consecration, the liturgy enlists the sense of smell alongside sight and sound to honor Christ. In the postconciliar Roman Rite, incense may be used optionally in any Mass—not solely at Solemn High Mass—at five clearly defined moments (GIRM 276)."

