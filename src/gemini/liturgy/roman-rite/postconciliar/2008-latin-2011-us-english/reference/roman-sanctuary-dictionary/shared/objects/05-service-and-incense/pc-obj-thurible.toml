[symbolism]
has_sourced_symbolism = true
text = "Incensation expresses reverence and rising prayer before God (GIRM 276), grounded directly in Sacred Scripture: “Let my prayer be directed as incense in thy sight; the lifting up of my hands, as evening sacrifice” (Ps 140:2 [Heb 141:2]), and in the heavenly liturgy of the Apocalypse, “And the smoke of the incense of the prayers of the saints ascended up before God from the hand of the angel” (Apoc 8:4; cf. Apoc 5:8, 8:3). St. Thomas Aquinas adds that the fragrant smoke signifies the grace of Christ spreading through His ministers, echoing St. Paul’s words that God “manifesteth the odour of his knowledge by us in every place” (2 Cor 2:14)."
evidence_class = "liturgical-source"
attribution = "GIRM 276; Ps 140:2 [Heb 141:2]; Apoc 5:8, 8:3–4; 2 Cor 2:14; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 5, ad 2"

[counterpart_1962]
relationship = "changed use"
locus_1962 = "Missale Romanum (1962), Ritus Servandus IV.4, VI.5, VII.10, VIII.8; Ordo Missae nn. 1035–1038"
comparison = "In the 1962 Roman Missal, incense at Mass was restricted to Solemn Mass and permitted sung Masses (never Low Mass) and accompanied by spoken blessing and incensation prayers (Ordo Missae 1035–1038). The 2002/2008 GIRM permits incense optionally in any form of Mass at five enumerated moments, replaces the spoken blessing with a silent Sign of the Cross, and codifies standardized sets of three, two, and single swings (GIRM 276–277)."

