[identification]
summary = "The credence table is the side table set in a convenient corner of the sanctuary to hold sacred vessels, altar linens, cruets, and lavabo articles off the altar until they are needed."
appearance = "Shown at the far right of Plate I beside the presidential chair as a compact, four-legged rectangular wooden side table with a lower shelf, carrying the paired glass cruets on their tray and folded white linens neatly stacked below."
placement_and_use = "GIRM 118c appoints the credence table (abacus) as the preparation station for every Mass with a congregation, holding the chalice, folded corporal, purificator, optional pall and chalice veil, paten, ciboria, bread and wine cruets (unless carried in the Procession of Gifts), vessel of blessed water for the Sunday sprinkling rite, Communion-plate, and lavabo pitcher, basin, and towel. Keeping these items on the credence table preserves an uncluttered altar mensa until the Preparation of the Gifts (GIRM 139, 306). After Communion or immediately after Mass, sacred vessels may also be purified at the credence table by a priest, deacon, or instituted acolyte (GIRM 279)."
liturgical_colors = "Ordinarily dressed with a plain clean white linen cloth, without seasonal color changes."

[ministers_and_handling]
ordinary_ministers = ["priest", "deacon", "instituted-acolyte"]
prepares = ["sacristan", "instituted-acolyte", "altar-server"]
server_boundary = "prepares"
server_boundary_summary = "Servers help arrange clean unconsecrated vessels, linens, cruets, and lavabo equipment on the credence table before Mass, carry needed items to the altar at the Preparation of the Gifts, and bring the water cruet for purification without touching unpurified sacred vessels."
safety_warning = "After Communion, never purify sacred vessels at the credence table and never disturb unpurified vessels left suitably covered upon a corporal there; purification belongs strictly to the priest, deacon, or instituted acolyte (GIRM 279; Redemptionis Sacramentum 119; USCCB Norms 53)."

[audience_text]
altar_server = "Think of the credence table at the side of the sanctuary as your staging station during Mass. Before the procession, check that the unconsecrated chalice, folded linens, cruets, lavabo pitcher, basin, towel, and Communion-plate are arranged neatly with room to work. At the Preparation of the Gifts, bring the vessels, linens, cruets, and lavabo smoothly to the altar and return empty cruets right back to the credence table so nothing crowds the altar cloth. After Communion, bring the water cruet if asked, but never touch or wash any unpurified vessel resting on a corporal."
sacristan = "Cover the credence table with a clean white linen cloth and verify every item listed in GIRM 118c: blessed principal chalice with folded corporal, purificator, optional pall and chalice veil; paten and any extra ciboria or Communion chalices with one purificator apiece; stoppered wine and water cruets on their tray; lavabo pitcher, basin, and finger towel; Communion-plate; and aspersorium when the sprinkling rite is scheduled. Leave open space on the tabletop so the priest, deacon, or instituted acolyte can purify vessels cleanly on a corporal after Communion or after Mass (GIRM 279)."
general_reader = "Tucked unobtrusively to one side of the sanctuary, the credence table performs an essential practical service: it holds the chalice, paten, cruets, handwashing basin, and altar linens before they are brought to the altar at the offertory. By staging every necessary article within quiet reach of the servers and clergy, it allows the main altar table to remain visually calm and uncluttered until the Liturgy of the Eucharist begins."

