locus_1962 = "Missale Romanum (1962), Rubricae Generales 528; Ritus Servandus II.5; Caeremoniale Episcoporum (1948) I.12"
comparison = "Both the 1962 Roman Missal (RG 528; RS II.5) and the 2008/2011 GIRM (118c, 139, 279) appoint a sanctuary side table (abacus) for cruets, lavabo articles, Communion-plate, and vessels. In postconciliar Mass with a congregation, its role expands because the chalice and linens also ordinarily wait there until the Preparation of the Gifts (rather than being carried to the altar by the priest at the start of Low Mass) and vessel purification commonly takes place at the credence table (GIRM 279)."

