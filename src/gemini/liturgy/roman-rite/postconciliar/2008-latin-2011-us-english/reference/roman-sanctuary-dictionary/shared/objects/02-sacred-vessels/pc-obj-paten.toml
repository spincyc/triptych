related_objects = ["pc-obj-chalice", "pc-obj-corporal", "pc-obj-purificator", "pc-obj-hist-fragile-vessels-pouring"]

[symbolism]
has_sourced_symbolism = true
text = "Together with the chalice, the paten receives special honor as the receptacle of the Eucharistic Bread (GIRM 327). A larger paten holding hosts for priest, deacon, ministers, and assembly visibly expresses 1 Cor 10:17 (“For we, being many, are one bread, one body: all that partake of one bread.”). St. Thomas Aquinas pairs the paten with the chalice as a figure of the tomb that held the Lord's Body, grounding the demand for noble, unbreakable material in reverence for Christ."
evidence_class = "liturgical-source"
attribution = "GIRM 327, 331; 1 Cor 10:17; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 3, obj. 6 & ad 6"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Ritus Servandus I.1, VII.9, X.1–2, X.7"
comparison = "In the 1962 Roman Missal, the paten was a small flat gilded metal disc consecrated by a bishop, sized for the celebrant's single host, kissed and used to sign the celebrant at the Libera nos, and held veiled by the subdeacon at Solemn Mass (RS I.1, VII.9, X.1–2). The 2008/2011 GIRM omits the signing and kissing at the Libera nos, introduces a broad paten fittingly holding hosts for clergy and faithful alike (GIRM 331), and under USCCB GIRM 329 admits solid noble non-metal materials."

