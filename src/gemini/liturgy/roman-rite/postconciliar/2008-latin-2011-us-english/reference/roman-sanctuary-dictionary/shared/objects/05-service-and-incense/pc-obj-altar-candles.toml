[symbolism]
has_sourced_symbolism = true
text = "Candles are lighted at every liturgical celebration to express reverence and festive honor before God (GIRM 117, 307). Their living flame recalls Christ, who declares in the Gospel, “I am the light of the world. He that followeth me walketh not in darkness, but shall have the light of life” (John 8:12)."
evidence_class = "liturgical-source"
attribution = "GIRM 117, 307; John 8:12"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Rubricae Generales n. 527; Ritus Servandus II.5, VI.5; Fortescue (1943), pp. 17, 89–90"
comparison = "Both the 1962 Roman Missal (RG 527) and the 2002/2008 GIRM (117, 307) scale candle counts from two up to six, or seven for the Diocesan Bishop. In 1962, altar candlesticks stood directly on the altar or its gradine flanking the central crucifix, supplemented by separate Sanctus and elevation torches; postconciliar GIRM 117, 122, and 307 permit candlesticks to stand either on or around the altar—including processional candlesticks placed near it—so that the faithful maintain an unobstructed view of the altar table."

