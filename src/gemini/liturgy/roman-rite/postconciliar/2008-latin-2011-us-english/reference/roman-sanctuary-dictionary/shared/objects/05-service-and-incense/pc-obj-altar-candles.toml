[edition_disposition]
edition_locale = "2008-latin-2011-us-english"
as_of = "2026-11-25"
disposition = "required"
scope_level = "universal-roman"
territorial_note = "GIRM 117 and 307 are universal Roman norms without a separate territorial insertion for the United States. Guidance of the USCCB Committee on Divine Worship maintains real living flames of wax or oil rather than electric lights."

[identification]
summary = "Altar candles are lighted wax or oil candles mounted in dignified candlesticks on or around the altar for every liturgical celebration, as well as paired candlesticks carried in processions."
appearance = "Two slender footed candlesticks bearing tall white wax tapers flank the central crucifix on the freestanding altar in Plate I, each fitted with a shallow wax bobeche to catch melted drips."
placement_and_use = "At every celebration of Mass, lighted candles are placed on or around the altar: at least two candlesticks, or four or six especially for Sunday Mass and Holy Days of Obligation, and seven when the Diocesan Bishop celebrates (GIRM 117). Candlesticks are arranged harmoniously with the architecture of the altar and sanctuary so that they never obstruct the assembly’s clear view of what takes place upon the mensa (GIRM 307). Two lighted candles also accompany the processional cross at the entrance procession and flank the Book of the Gospels during the Gospel procession and proclamation at the ambo (GIRM 120b, 133, 175)."
liturgical_colors = "Not governed by the seasonal color cycle; candles are traditionally white or unbleached natural beeswax, mounted in brass, bronze, silver, wood, or stone candlesticks."

[ministers_and_handling]
ordinary_ministers = ["instituted-acolyte", "altar-server"]
prepares = ["sacristan", "altar-server"]
server_boundary = "handles"
server_boundary_summary = "Servers light altar candles shortly before Mass, extinguish them cleanly with a snuffer afterward, and carry processional and Gospel candles upright at matching heights without bowing or genuflecting while holding them (GIRM 120b, 133, 274)."
safety_warning = "Keep open flames well clear of hair, albs, ribbons, vestments, and the pages of the Roman Missal. Carry processional candles strictly upright, watch for dripping hot wax, and extinguish every flame with a brass snuffer rather than blowing melted wax onto the white altar cloth."

[audience_text]
altar_server = "Light the altar candles before Mass with a lighting taper and extinguish them afterward with a snuffer—never blow them out across the white linen cloth. When carrying a candle beside the processional cross or flanking the ambo for the Gospel, hold your candlestick upright at the same height as your partner’s, omit bows and genuflects while holding it (GIRM 274), and keep the open flame safely away from hair, sleeves, and books."
sacristan = "Set out the required number of trimmed wax or oil candles (two, four, or six, and seven when the Diocesan Bishop presides, GIRM 117) on or around the altar without blocking sightlines across the mensa (GIRM 307). Inspect oil followers or wax tubes for adequate fuel, clean hardened wax from drip shields, and keep a taper lighter and snuffer ready in the sacristy."
general_reader = "Lighted candles burn on or near the altar at every Mass, scaling from two on ordinary weekdays to four or six on Sundays and solemnities, and seven when the Diocesan Bishop celebrates (GIRM 117). Carried alongside the cross at the entrance and around the ambo for the Gospel, their living flames honor the presence of Christ in His Word and His Eucharistic sacrifice."

