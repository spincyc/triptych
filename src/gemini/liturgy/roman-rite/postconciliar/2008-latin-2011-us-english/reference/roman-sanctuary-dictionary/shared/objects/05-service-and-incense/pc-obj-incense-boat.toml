[identification]
summary = "The incense boat is a small lidded metal container with a companion spoon used to hold unburned resin incense grains and transfer them onto the glowing charcoal of the thurible."
appearance = "Shaped like a miniature hull resting on a flared pedestal foot, the vessel features a hinged half-lid lifted by a side knob to reveal granular resin incense inside, accompanied by a slender long-handled metal spoon resting beside its base."
placement_and_use = "Whenever incense is employed during Mass, Benediction, or solemn Liturgy of the Hours (GIRM 120, 276–277), the incense boat accompanies the thurible. A dedicated boat-bearer—or the thurifer holding the boat in the left hand when serving alone—presents the opened vessel to the priest or deacon so that the priest may spoon resin grains onto the hot coals and bless them silently with the Sign of the Cross (GIRM 277)."
liturgical_colors = "Not governed by the seasonal color cycle; finished in matching brass, bronze, pewter, or silver to pair with the thurible."

[ministers_and_handling]
ordinary_ministers = ["priest", "deacon", "instituted-acolyte", "altar-server"]
prepares = ["sacristan", "altar-server"]
server_boundary = "presents"
server_boundary_summary = "The boat-bearer (or lone thurifer) opens the hinged lid and offers the spoon handle toward the priest or deacon before each imposition of incense, closing the lid promptly before walking so resin grains do not spill on sanctuary steps (GIRM 277)."
safety_warning = ""

[audience_text]
altar_server = "Walk quietly beside the thurifer with the incense boat closed until you approach the priest or deacon. Flip the hinged half-lid open and offer the handle of the small spoon toward the priest so he can transfer incense grains onto the charcoal cleanly, then close the lid before stepping away so hard resin granules never scatter across the floor."
sacristan = "Fill the incense boat about halfway with dry, properly sized resin grains before Mass—overfilling makes the lid jam and causes spills during processions. Store the companion spoon securely with the boat and brush away fine resin dust from the hinge periodically so the cover opens smoothly."
general_reader = "Named navicula in Latin for its classic miniature-ship silhouette, the incense boat is the practical companion vessel to the thurible. Filled with aromatic frankincense or myrrh resin granules and fitted with a small spoon, it allows the priest to place fresh grains onto the charcoal before each incensation."

