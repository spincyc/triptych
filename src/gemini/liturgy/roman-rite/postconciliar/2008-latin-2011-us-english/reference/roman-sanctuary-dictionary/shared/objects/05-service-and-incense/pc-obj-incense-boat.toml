comparison = "Both the 1962 Roman Missal (RS IV.4, VII.10) and the 2002/2008 GIRM (120, 276–277) pair the incense boat and spoon with the thurible. In postconciliar practice, the priest imposes incense silently with a Sign of the Cross rather than speaking the 1962 blessing formula, and neither the spoon nor the celebrant’s hand is kissed at the presentation."

