territorial_note = "In the United States, the 2002/2008 GIRM restoration of precious metal (with the narrow USCCB GIRM 329 adaptation for solid, non-breaking, non-absorbent patens, ciboria, and pyxes), Redemptionis Sacramentum (2004) nos. 106 and 117, the October 2006 CDWDS decision declining to renew the 2002–2005 EMHC purification indult, and the revised 2011 USCCB Norms (no. 53) definitively supersede these earlier practices."

[identification]
summary = "The 1970 and 1975 editions of the General Instruction of the Roman Missal (nos. 290–291) omitted precious metal as an explicit primary norm for sacred vessels, directing only that vessels be fashioned from solid materials esteemed as noble in each region (with preference for materials not easily broken or rendered unusable) and that the chalice bowl be nonabsorbent. Over the next three decades, some parishes adopted glass, stoneware, ceramic, or clay chalices and bowls, and consecrated wine in large flagons or pitchers from which the Precious Blood was poured into Communion cups after consecration. The third typical edition (2002/2008 GIRM nos. 328–330) restored precious metal—gilded inside whenever the metal rusts or is less precious than gold—as the universal primary standard, while the United States adaptation (US GIRM no. 329) narrowed secondary solid noble materials such as hard woods to patens, ciboria, and pyxes that do not easily break, deteriorate, or absorb liquids. On 25 March 2004, the Congregation for Divine Worship and the Discipline of the Sacraments issued Redemptionis Sacramentum, which strictly forbade post-consecration pouring of the Precious Blood and barred flagons or bowls from holding the Blood of Christ (no. 106), while explicitly reprobating glass, earthenware, clay, and fragile or rusting vessels (no. 117). Finally, a temporary three-year United States indult (2002–2005) allowing extraordinary ministers of Holy Communion to purify sacred vessels expired without renewal per the Congregation's letter of October 2006, and the 2011 USCCB Norms (no. 53) strictly reserve purification to the priest, deacon, or instituted acolyte."
appearance = "Superseded items included glass, ceramic, pottery, or earthenware chalices and host bowls, as well as glass or stoneware wine flagons placed directly on the altar for consecration and subsequent pouring into smaller Communion cups."
placement_and_use = "Employed in some parishes between 1970 and 2004 under the broader vessel wording of the 1970/1975 General Instruction, alongside the temporary 2002–2005 United States indult permitting vessel purification by extraordinary ministers; all three practices are excluded under current 2008/2011 law."
liturgical_colors = "Not applicable."

[ministers_and_handling]
ordinary_ministers = ["priest", "deacon", "instituted-acolyte"]
prepares = ["sacristan"]
server_boundary = "superseded-historical"
server_boundary_summary = "Historically superseded and prohibited; glass, earthenware, or clay sacred vessels, post-consecration pouring from flagons, and vessel purification by non-instituted lay ministers are never permitted."
safety_warning = "Never set glass, earthenware, or clay vessels on the altar for consecration, never leave a wine flagon on the mensa during the Eucharistic Prayer for post-consecration pouring, and never permit an altar server or extraordinary minister of Holy Communion to purify sacred vessels."

[audience_text]
altar_server = "Servers bring only approved noble-metal chalices to the altar before consecration, remove any emptied wine flagon before the Eucharistic Prayer begins, and leave the purification of sacred vessels strictly to the priest, deacon, or instituted acolyte."
sacristan = "Glass, pottery, earthenware, and clay vessels must never be prepared as sacred vessels, wine flagons serve exclusively to bring unconsecrated wine to the altar before consecration, and unpurified vessels covered on a corporal after Mass await purification solely by a priest, deacon, or instituted acolyte."
general_reader = "Between 1970 and 2004, broad wording in earlier editions of the General Instruction led some parishes to use glass or pottery vessels, pour the Precious Blood from flagons after consecration, and enlist extraordinary ministers to purify chalices under a temporary United States indult. The 2002/2008 Roman Missal, Redemptionis Sacramentum (2004), and the 2011 United States norms ended all three practices to safeguard reverence for the Eucharist."

