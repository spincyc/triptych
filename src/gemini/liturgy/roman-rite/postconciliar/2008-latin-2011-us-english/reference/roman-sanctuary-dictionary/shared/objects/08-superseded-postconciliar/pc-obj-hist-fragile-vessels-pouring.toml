locus_1962 = "Missale Romanum (1962), Ritus Servandus I.1, X.5–6; Rubricae Generales n. 503"
comparison = "Fragile or porous sacred vessels, post-consecration pouring from flagons, and lay vessel purification had no counterpart in the 1962 Roman Missal, which mandated gold or interior-gilded silver chalices and patens, distributed Communion to the laity under bread alone, and restricted ablutions exclusively to the priest celebrant. The 2002/2008 Missal, Redemptionis Sacramentum (2004), and the 2011 United States norms restore precious metal as the universal primary norm, bar fragile materials and post-consecration pouring, and restrict purification to the priest, deacon, or instituted acolyte."

[historical_transition]
is_superseded = true
period_range = "1970–2006/2011"
controlling_act = "GIRM (2002/2008) nos. 279, 328–330; Redemptionis Sacramentum (2004) nos. 106, 117, 119; CDWDS letter (Oct 2006); USCCB Norms (2011) no. 53"
current_status = "Sacred vessels are made primarily of precious metal gilded inside where necessary (GIRM no. 328), with nonabsorbent bowls for all chalices (no. 330) and the United States adaptation limiting solid noble alternatives to hard, non-breaking, non-absorbent patens, ciboria, and pyxes (US GIRM no. 329). Glass, earthenware, and clay vessels and post-consecration pouring from flagons are strictly prohibited (Redemptionis Sacramentum nos. 106, 117). Wine brought in a flagon is poured into chalices before the Eucharistic Prayer, and vessel purification belongs exclusively to the priest, deacon, or instituted acolyte (GIRM no. 279; USCCB Norms no. 53)."

