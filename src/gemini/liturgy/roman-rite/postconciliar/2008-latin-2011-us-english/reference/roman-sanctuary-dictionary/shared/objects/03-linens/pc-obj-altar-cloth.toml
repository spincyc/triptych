[edition_disposition]
edition_locale = "2008-latin-2011-us-english"
as_of = "2026-11-25"
disposition = "required"
scope_level = "universal-roman"
territorial_note = "In the Dioceses of the United States of America, the confirmed territorial adaptation at GIRM 304 permits additional altar cloths beneath or alongside the primary cloth to bear other colors of Christian honorific or festive significance, provided the uppermost cloth covering the mensa is always white."

[identification]
summary = "A clean white linen cloth dressing the top surface of the altar for every celebration of Mass."
appearance = "At bottom right of Plate IV, a finely hemmed corner of smooth white linen drapes cleanly over the stone edge of the mensa; Plates I and II show it dressing the entire freestanding altar. Proportioned to the altar's shape and size, it may bear restrained hemstitching, woven bands, or subtle lace suited to noble simplicity."
placement_and_use = "Laid smoothly over the altar mensa before Mass so that at least one clean white cloth always covers the table of sacrifice (GIRM 117, 304). Any under-cloths—including festive colored under-cloths permitted in United States dioceses—lie neatly beneath the white uppermost cloth. Until the Preparation of the Gifts, the dressed mensa remains uncluttered, holding no cruets, stands, or loose papers (GIRM 306)."
liturgical_colors = "Always white for the required uppermost cloth (GIRM 117, 304); in the United States, additional under-cloths may employ other liturgical or festive colors of Christian honorific significance (US GIRM 304)."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan", "instituted-acolyte", "altar-server"]
server_boundary = "prepares"
server_boundary_summary = "Servers may assist the sacristan in laying or smoothing a clean altar cloth before Mass with clean hands, keeping wax, ink, and unauthorized items off the mensa and reporting any spill of the Precious Blood immediately to the priest or deacon."
safety_warning = "Never blot or wash a spill of the Precious Blood on the altar cloth yourself; notify the priest or deacon at once so the spot is washed with water and the ablution poured into the sacrarium (GIRM 280; RS 120). Guard the linen against candle flames and molten wax."

[audience_text]
altar_server = "Look at bottom right of Plate IV and across the altar on Plates I and II: the smooth white altar cloth covers the mensa for every Mass. If asked to help smooth or lay a fresh cloth before Mass, make sure your hands are spotless and never lean on the covered altar. When extinguishing altar candles after Mass, use a snuffer so hot wax never splatters on the white linen. If a drop of the Precious Blood ever falls onto the altar cloth, never try to wipe it yourself—alert the priest or deacon right away."
sacristan = "Verify before every Mass that at least one spotless, freshly pressed white linen altar cloth covers the mensa cleanly and matches the altar's proportions (GIRM 117, 304). Where your parish uses the United States adaptation permitting festive colored under-cloths beneath the white top cloth (US GIRM 304), align hems evenly with no wrinkled layers. Inspect regularly for wax drips or stains, and if the Precious Blood has touched the altar cloth, wash the affected area first by hand and pour the rinse water into the sacrarium or clean earth before ordinary laundering (GIRM 280; RS 120)."
general_reader = "Before Mass begins, the bare stone or wood altar is vested in clean white linen. The Church prescribes at least one white altar cloth out of reverence for the memorial of Christ's sacrifice and the Eucharistic banquet offered upon the mensa (GIRM 117, 304). In the United States, parishes may layer additional cloths of festive Christian colors underneath, while always keeping white as the uppermost cloth."

[relationships]
