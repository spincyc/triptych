related_objects = ["pc-obj-altar", "pc-obj-corporal", "pc-obj-altar-candles"]

[symbolism]
has_sourced_symbolism = true
text = "The white altar cloth expresses reverence for the celebration of the Lord's memorial and the sacred banquet in which his Body and Blood are offered. In the scholastic tradition of St. Thomas Aquinas, the clean linen dressing the altar also evokes the burial cloth of Christ—“And Joseph taking the body wrapped it up in a clean linen cloth” (Matt 27:59)—calling to mind purity of conscience and the Passion of the Lord."
evidence_class = "liturgical-source"
attribution = "GIRM 304; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 3, ad 7; Matt 27:59"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Rubricae Generales 526"
comparison = "The 1962 Roman Missal required three clean blessed white linen cloths covering the altar, with the uppermost cloth reaching the ground at both sides (RG 526). Postconciliar law requires at least one white cloth suited to the altar's shape and size (GIRM 117, 304), while the United States adaptation permits additional festive colored under-cloths beneath the white top cloth."

