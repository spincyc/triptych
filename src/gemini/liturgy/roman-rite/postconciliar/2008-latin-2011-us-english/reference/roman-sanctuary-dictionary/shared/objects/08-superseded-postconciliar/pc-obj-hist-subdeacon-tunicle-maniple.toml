[audience_text]
altar_server = "The subdeacon's tunicle and the maniple belong to an earlier historical period and are not used in the postconciliar Mass. Roles formerly carried out by the subdeacon now belong to instituted lectors, instituted acolytes, or deputed altar servers vested in the alb or in cassock and surplice."
sacristan = "Neither the tunicle nor the maniple is laid out for celebrations of the 2008/2011 Roman Missal. Matching tunicles and maniples surviving in older parish vestment chests are preserved solely as historical artifacts or for celebrations authorized under the 1962 Roman Missal."
general_reader = "During the early postconciliar transition, the maniple ceased to be required in 1967 and was omitted from the 1970 Missal, while the subdeacon and his tunicle remained briefly in the 1970 edition before Pope Paul VI suppressed the subdiaconate in 1972 and instituted the lay ministries of Lector and Acolyte."

