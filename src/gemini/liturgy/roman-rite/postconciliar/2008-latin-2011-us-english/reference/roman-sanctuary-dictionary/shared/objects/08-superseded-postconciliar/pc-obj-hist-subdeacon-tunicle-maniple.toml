as_of = "2026-11-25"
disposition = "superseded"
scope_level = "historically-superseded"
territorial_note = "Neither the subdiaconate nor the tunicle and maniple appear in the 2002/2008 Latin or 2011 United States Roman Missal; the suppression of the subdiaconate took effect uniformly across the Latin Church on 1 January 1973 under Ministeria quaedam."

[identification]
summary = "Between 1967 and 1975, two vestments inherited from the preconciliar sanctuary passed out of postconciliar Roman use in stages. First, the Sacred Congregation of Rites Instruction Tres abhinc annos (4 May 1967, effective 29 June 1967), no. 25, declared that the maniple—the ornamental strip of liturgical cloth worn on the left forearm of the priest, deacon, and subdeacon—was no longer required; it ceased to be prescribed and was omitted from the 1970 General Instruction of the Roman Missal rather than being formally banned by decree. Second, the first typical edition of the postconciliar Missale Romanum (26 March 1970, Prot. 166/70) briefly retained the liturgical office of the subdeacon (1970 IGMR nos. 142–152) and his sleeved outer vestment, the tunicle (no. 301). Pope Paul VI's Motu Proprio Ministeria quaedam (15 August 1972, AAS 64:529–534; effective 1 January 1973) then suppressed first tonsure, the four minor orders, and the major order of subdeacon in the Latin Church, establishing the lay instituted ministries of Lector and Acolyte. The second typical edition of the Missale Romanum (27 March 1975) excised the subdeacon and tunicle from the General Instruction, and the Caeremoniale Episcoporum (14 September 1984) no. 56 retained only a single light pontifical dalmatic beneath the bishop's chasuble on solemnities, omitting the separate pontifical tunicle."
appearance = "The tunicle was a sleeved, knee-length tunic matching the liturgical color of the day, slightly narrower and less ornate than the deacon's dalmatic; the maniple was a short, narrow band of matching fabric bearing a central cross, fastened over the left forearm."
placement_and_use = "During the 1967–1972 transition, the maniple ceased to be required in June 1967 and disappeared from the 1970 Missal, while the subdeacon wore the tunicle over the alb at solemn celebrations under the 1970 typical edition until the subdiaconate ended on 1 January 1973."
liturgical_colors = "Historically matched the seasonal or festive liturgical color of the Mass vestments (white, red, green, violet, rose, or black)."

