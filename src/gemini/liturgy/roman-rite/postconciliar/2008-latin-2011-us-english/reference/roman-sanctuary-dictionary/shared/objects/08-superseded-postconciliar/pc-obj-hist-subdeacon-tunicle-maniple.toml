[symbolism]
has_sourced_symbolism = true
text = "In the traditional Roman sacristy vesting prayers, the maniple evoked faithful endurance in sorrowful labor rewarded with joy, echoing the psalmist's words, “They that sow in tears shall reap in joy. Going they went and wept, casting their seeds. But coming they shall come with joyfulness, carrying their sheaves” (Ps 125:5–7), while Amalarius of Metz traced it to the linen cloth carried on the left hand to wipe tears and sweat. The traditional episcopal vesting prayer for the tunicle asked to be clothed with the tunic of gladness and garment of joy, and Amalarius interpreted the inner tunic as signifying interior virtues of mercy, humility, patience, faith, and hope."
evidence_class = "devotional-tradition"
attribution = "Traditional Roman Missal vesting prayers (Praeparatio ad Missam); Ps 125:5–7; Amalarius of Metz, Liber Officialis II.22, II.24"

[counterpart_1962]
relationship = "superseded"
locus_1962 = "Missale Romanum (1962), Rubricae Generales nn. 134, 137; Ritus Servandus I.3–4; Praeparatio ad Missam p. LXXIV; Caeremoniale Episcoporum (1948) II.8 n. 18"
comparison = "In the 1962 Roman Missal, the maniple was required on the left forearm of the priest, deacon, and subdeacon during Mass, and the tunicle served both as the proper outer vestment of the subdeacon at Solemn Mass and as the inner layered garment beneath the bishop's dalmatic and chasuble. Both vestments passed out of postconciliar law between 1967 and 1975 (and from episcopal layering in 1984), remaining in liturgical use only where the 1962 Missal is celebrated."

[historical_transition]
is_superseded = true
period_range = "1967–1972"
controlling_act = "Tres abhinc annos (1967) no. 25; Ministeria quaedam (1972); 1975 Missale Romanum; CE (1984) no. 56"
current_status = "The 2002/2008 Latin and 2011 United States Roman Missal prescribe neither the subdiaconate nor the tunicle and maniple (GIRM nos. 119, 335–341). Duties formerly assigned to the subdeacon belong to instituted lectors and acolytes vested in the alb (GIRM no. 336; CIC can. 230, par. 1, as amended by Spiritus Domini, 2021), and on major pontifical occasions the bishop wears only a single light dalmatic beneath the chasuble (Caeremoniale Episcoporum 1984 no. 56)."

