territorial_note = "Officially titled Excerpts from the Roman Missal, this lighter companion ritual volume was prepared by the United States Conference of Catholic Bishops, confirmed by the Congregation for Divine Worship and the Discipline of the Sacraments, and published in 2018 to fulfill GIRM 118a at the presidential chair alongside the complete altar Missal."

[identification]
summary = "A slimmer, lighter Holy-See-confirmed United States ritual volume containing the presidential texts prayed away from the altar—such as the Introductory Rites, Collects, Prayers after Communion, and Solemn Blessings—designed for comfortable holding at the presidential chair."
appearance = "At bottom right of Plate V, the closed Book of the Chair is markedly thinner and lighter than the thick altar Roman Missal at top left, bound in clean dignified covers with two silk ribbon markers extending from the foot of the spine and without the heavy fore-edge tab bank required for the Eucharistic Prayers."
placement_and_use = "Placed beside the presidential chair before Mass (fulfilling GIRM 118a) and held open by an altar server or set on a discreet chair stand for the Introductory Rites, Collect, concluding prayer of the Universal Prayer, Prayer after Communion, and Final Blessing. Because it omits the Prefaces and Eucharistic Prayers, it is never placed on the altar mensa in place of the complete Roman Missal (GIRM 139, 306)."
liturgical_colors = "Dignified cloth or leather binding (commonly red or complementary dark tones); the cover color does not change by liturgical season."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest"]
prepares = ["sacristan", "altar-server"]
server_boundary = "presents"
server_boundary_summary = "Servers hold the Book of the Chair open flat and steady at the priest's reading angle during the Introductory Rites, Collect, Universal Prayer conclusion, Prayer after Communion, and Final Blessing, and never place it on the altar in place of the complete Roman Missal."
safety_warning = "Never carry the Book of the Chair to the altar for the Liturgy of the Eucharist or the Eucharistic Prayer—it does not contain the Order of Mass altar prayers or Eucharistic Prayers, which require the complete Roman Missal (GIRM 306)."

[audience_text]
altar_server = "This slimmer ceremonial book at bottom right of Plate V was created with altar servers in mind. Because the full altar Roman Missal is heavy to hold steadily for long prayers, the Book of the Chair (officially Excerpts from the Roman Missal) contains only the prayers spoken at the presidential chair and entrance. Before Mass, confirm that both ribbons mark the Collect and Prayer after Communion; step promptly before the priest when he rises for prayer, hold the book open flat at a comfortable height without tipping the pages, and return it beside the chair—never to the altar."
sacristan = "Mark both ribbons in Excerpts from the Roman Missal before Mass for the day's Collect, Prayer after Communion, and any Solemn Blessing or Prayer over the People, setting it neatly beside the presidential chair (GIRM 118a). Always prepare the full Roman Missal separately on the credence table (marked for the Prayer over the Offerings, Preface, and Eucharistic Prayer) so the Liturgy of the Eucharist never lacks its complete altar book (GIRM 139, 306)."
general_reader = "During the opening and closing prayers of Mass, you will often see an altar server step before the priest at the presidential chair holding a noticeably slimmer book than the thick volume later used at the altar. Officially titled Excerpts from the Roman Missal and published in 2018 for United States dioceses, this practical companion gathers the prayers spoken at the chair while reserving the complete Roman Missal for the altar."

