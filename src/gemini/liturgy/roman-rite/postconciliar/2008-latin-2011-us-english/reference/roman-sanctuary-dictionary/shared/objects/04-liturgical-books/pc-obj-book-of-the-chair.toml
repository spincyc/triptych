[counterpart_1962]
relationship = "no established counterpart"
locus_1962 = "No presbyteral counterpart in Missale Romanum (1962), Rubricae Generales 527; episcopal book-bearer precedent only in Caeremoniale Episcoporum (1948) I.20"
comparison = "Because the priest in the 1962 Roman Missal prayed the Collect and Postcommunion at the altar rather than at a presidential chair (RG 527), there was no presbyteral Book of the Chair (only a minister holding the Missal for a bishop under Caeremoniale Episcoporum I.20). The Holy-See-confirmed USCCB volume Excerpts from the Roman Missal (2018) is a distinct postconciliar practical companion fulfilling GIRM 118a."

