[edition_disposition]
edition_locale = "2008-latin-2011-us-english"
as_of = "2026-11-25"
disposition = "required"
scope_level = "universal-roman"
territorial_note = "While USCCB GIRM 329 permits solid, noble, non-breaking, non-absorbent materials such as hard woods for patens, ciboria, and pyxes, universal law requires the chalice bowl to be completely nonabsorbent (GIRM 330) and precious metal gilded inside if the metal rusts or is less precious than gold (GIRM 328); glass, earthenware, and clay chalices are strictly reprobated (Redemptionis Sacramentum 117)."

[identification]
summary = "The chalice is the principal footed sacred vessel in which wine mingled with a drop of water is offered, consecrated into the Precious Blood of Christ, elevated in adoration, and consumed at Mass."
appearance = "Shown at top left of Plate III with a deep, smooth flared cup, a baluster stem bearing a central grip node (nodus) for steady elevation, and a broad weighted circular foot; Plate X shows it standing at the center of the unfolded corporal alongside the paten, veiled ciborium, and Communion cups."
placement_and_use = "Before Mass with a congregation, the chalice stands prepared on the credence table with the corporal, purificator, optional pall, and—as a praiseworthy practice commended in GIRM 118c—covered with a chalice veil of the color of the day or white (GIRM 118c). At the Preparation of the Gifts, the deacon, instituted acolyte, or server brings it to the altar, where the priest or deacon pours wine and a little water into it (GIRM 139, 142, 178). After the consecration, the priest elevates the chalice and the deacon elevates it during the final doxology (GIRM 150–151, 180). Following Communion, any remaining Precious Blood is consumed reverently at the altar and the chalice is purified strictly by the priest, deacon, or instituted acolyte—never poured into the sacrarium or ground (GIRM 279; RS 119; USCCB Norms 52–55). Every chalice is blessed before liturgical use according to the Roman Ritual, praiseworthily by the diocesan bishop or by a priest (GIRM 333; RS 118)."
liturgical_colors = "Precious metal (gilded interior); optional chalice veil matches the liturgical color of the day or is white (GIRM 118c)."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan", "deacon", "instituted-acolyte", "altar-server"]
server_boundary = "prepares"
server_boundary_summary = "Servers may place the empty, unconsecrated chalice on the credence table before Mass and carry it to the altar at the Preparation of the Gifts if no deacon or instituted acolyte serves (GIRM 139). After consecration, servers never touch a chalice holding the Precious Blood, never consume from it, and never purify it (GIRM 279; RS 119; USCCB Norms 53)."
safety_warning = "Once consecrated, the chalice contains the Blood of Christ: servers and extraordinary ministers never purify it (strictly reserved to priest, deacon, or instituted acolyte), and remaining Precious Blood is never poured into the sacrarium or onto the ground (USCCB Norms 53–55)."

[audience_text]
altar_server = "You may handle the chalice only while it is empty and unconsecrated—setting it neatly on the credence table before Mass and carrying it with both hands (one on the node, one steadying the top) to the altar at the Preparation of the Gifts when no deacon or instituted acolyte is serving. Once the Eucharistic Prayer begins, the chalice holds the Precious Blood of Christ: never touch it, never pour from it, never drink remaining drops, and never wash or wipe it afterward. Bring the water cruet for the priest, deacon, or instituted acolyte when they purify the chalice."
sacristan = "Verify that the chalice has been blessed (GIRM 333), that its interior gilding is intact and clean, and that no porous or breakable vessel (glass, ceramic, or clay) is ever substituted (GIRM 328, 330; RS 117). Prepare it on the credence table with a clean folded purificator, paten, optional pall, and—where customary—a white or seasonal chalice veil (GIRM 118c). After Mass, leave any unpurified chalice suitably covered on a corporal strictly for the priest, deacon, or instituted acolyte to purify before ordinary washing (GIRM 279; USCCB Norms 53)."
general_reader = "Among all sacred vessels in the sanctuary, the chalice receives foremost honor because it holds the Precious Blood of Christ offered on the altar (GIRM 327). Shaped with a deep cup, a central node for secure lifting, and a stable base, it stands quietly on the credence table during the Liturgy of the Word and comes to the center of the altar for the Eucharistic sacrifice."

