[symbolism]
has_sourced_symbolism = true
text = "The chalice bears singular honor as the cup of the New Covenant, recalling the Lord’s words at the Last Supper in Matt 26:27–28 (“Drink ye all of this. For this is my blood of the new testament, which shall be shed for many unto remission of sins.”), St. Paul in 1 Cor 10:16 (“The chalice of benediction which we bless, is it not the communion of the blood of Christ?”), and Ps 115:13 [Heb 116:13] (“I will take the chalice of salvation; and I will call upon the name of the Lord.”). St. Thomas Aquinas teaches that the chalice signifies both the Passion of Christ and the joy of the blessed, and explains that non-porous precious metal—rather than wood, stone, or glass—is required out of reverence for Christ’s Blood."
evidence_class = "liturgical-source"
attribution = "GIRM 327; Matt 26:27–28; 1 Cor 10:16; Ps 115:13 [Heb 116:13]; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 3, ad 6 & a. 5, ad 9"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Ritus Servandus I.1, II.1, VIII"
comparison = "Whereas the 1962 Roman Missal required a gold or silver-cupped chalice consecrated with Sacred Chrism by a bishop and carried into Low Mass veiled with a stiff burse by the priest himself (RS I.1, II.1), the 2008/2011 Missal appoints a liturgical blessing by bishop or priest (GIRM 333), ordinarily prepares the chalice on the credence table until the Preparation of the Gifts (GIRM 118c, 139), and commends the chalice veil as a praiseworthy optional practice while leaving the burse unnamed."

