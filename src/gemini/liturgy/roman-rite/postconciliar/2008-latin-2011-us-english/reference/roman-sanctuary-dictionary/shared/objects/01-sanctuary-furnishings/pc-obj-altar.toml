[symbolism]
has_sourced_symbolism = true
text = "The Church reveres the altar as the sign of Christ Himself—both Priest and Victim—and as the table of the Lord where the Sacrifice of the Cross is made present under sacramental signs. A fixed stone altar permanently signifies Christ the Living Stone, recalling 1 Pet 2:4 (“Unto whom coming, as to a living stone, rejected indeed by men but chosen and made honourable by God:”), 1 Cor 10:4 (“and the rock was Christ.”), and Heb 13:10 (“We have an altar whereof they have no power to eat who serve the tabernacle.”). St. Thomas Aquinas similarly teaches that the altar signifies Christ Himself and, when made of stone, calls to mind both Christ the Rock and the stone sepulchre in which His body rested."
evidence_class = "liturgical-source"
attribution = "GIRM 296, 298; 1 Pet 2:4; 1 Cor 10:4; Heb 13:10; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 3"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Rubricae Generales 526–527; Ritus Servandus II.2, IV.5, V.3"
comparison = "Whereas the 1962 Roman Missal ordinarily presupposed a stone altar (or recessed consecrated altar stone holding relics inside the mensa) dressed with three cloths, candlesticks, central crucifix, three altar cards, and normally the tabernacle, the 2008/2011 Missal recommends a single freestanding altar wherever possible (GIRM 299, 303), deposits saints' relics beneath the altar (GIRM 302), clears the mensa of altar cards and extraneous items (GIRM 306), and in the United States permits solid wood for a fixed altar mensa (US GIRM 301)."

