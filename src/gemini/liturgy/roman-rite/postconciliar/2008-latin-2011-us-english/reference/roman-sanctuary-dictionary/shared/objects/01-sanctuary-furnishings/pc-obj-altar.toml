plate_position = "Top left (Plate II); center (Plate I)"
preferred_english_name = "Altar"
latin_headword = "Altare"
alternate_english_names = ["Altar Table", "Mensa"]
alternate_latin_names = ["Mensa Domini", "Altare fixum", "Altare mobile"]
pronunciation_key = "ahl-TAH-reh"

[edition_disposition]
edition_locale = "2008-latin-2011-us-english"
as_of = "2026-11-25"
disposition = "required"
scope_level = "universal-roman"
territorial_note = "In the Dioceses of the United States of America, the Bishops' Conference adaptation to GIRM 301 permits a fixed altar table to be crafted from dignified, solid, well-worked wood rather than natural stone, provided the structure remains permanently immovable; United States GIRM 304 likewise allows festive colored cloths beneath the required white uppermost cloth."

[identification]
summary = "The altar is the sacred table at the heart of the sanctuary upon which the Sacrifice of the Cross is made present under sacramental signs and the people of God gather for the Eucharistic banquet."
appearance = "Shown in Plate II as a freestanding rectangular stone table resting on twin paneled pedestals with molded plinths and dressed smoothly in an overhanging white linen cloth, and in Plate I centered in the sanctuary with two lighted candles and a crucifix—free of gradines, altar cards, or an attached rail."
placement_and_use = "Universal Roman law recommends a single fixed altar in newly built churches, set apart from the rear wall so ministers may walk around it and celebrate Mass facing the people wherever possible (GIRM 299, 303), while the Holy See clarified on 25 September 2000 (Prot. N. 2036/00/L) that this expresses pastoral desirability rather than a juridical ban on historical wall-attached altars or celebration facing the apse. A fixed altar is solemnly dedicated by the bishop (GIRM 300; CIC can. 1235), with relics of saints fittingly placed beneath it rather than recessed into the mensa (GIRM 302). From the start of Mass until the Preparation of the Gifts, only the Book of the Gospels rests upon the dressed mensa; during the Liturgy of the Eucharist, only the corporal, sacred vessels, Roman Missal, and necessary items appear there (GIRM 306)."
liturgical_colors = "Always covered on top with at least one clean white cloth (GIRM 117, 304); in the United States, additional under-cloths of seasonal or festive colors are permitted beneath the white cloth (US GIRM 304)."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan", "deacon", "instituted-acolyte", "altar-server"]
server_boundary = "recognizes-only"
server_boundary_summary = "Servers venerate the altar with a profound bow on approaching or departing (genuflecting instead if the Blessed Sacrament is reserved in the sanctuary), place the Roman Missal and unconsecrated vessels upon it at the Preparation of the Gifts when needed, and never lean upon, clutter, or kiss the mensa (kissing the altar belongs to the bishop, priest, and deacon)."
safety_warning = "Keep the altar table clear of spare papers, cruets, and extraneous items (GIRM 306), guard against candle flames and dripping wax near the white cloth, and notify the priest or deacon immediately if any Precious Blood is spilled—never attempt to blot or wash a spill yourself (GIRM 280)."

[audience_text]
altar_server = "The freestanding altar at the center of the sanctuary is the sacred table where Christ's sacrifice is offered. Whenever you arrive at or leave the sanctuary during Mass, make a profound bow to the altar (or genuflect if the tabernacle with the Blessed Sacrament stands in the sanctuary, except when carrying the processional cross or lighted candles). At the Preparation of the Gifts, bring the Roman Missal, folded linens, and empty sacred vessels cleanly to the edge of the mensa when no deacon or instituted acolyte does so. Never lean on the altar, leave cruets sitting on the cloth, or kiss the mensa—venerating the altar with a kiss belongs to the bishop, priest, and deacon."
sacristan = "Ensure the mensa is clean, level, and dressed with at least one smoothly pressed white linen cloth proportioned to the altar's shape (GIRM 117, 304); where United States festive under-cloths are used (US GIRM 304), verify that the uppermost cloth remains white. Before Mass begins, keep the mensa completely bare of cruets, Missal stands, spare bulletins, and loose papers so that only the Book of the Gospels rests there during the Liturgy of the Word (GIRM 306). Inspect the mensa after Mass for wax drips and confirm that any Precious Blood spill has been tended exclusively by the priest or deacon (GIRM 280)."
general_reader = "Standing at the focal center of the church, the altar is both the sacrificial table of Calvary made present in the Mass and the banquet table of the Lord's Body and Blood. Postconciliar churches ordinarily build one freestanding fixed altar—traditionally of natural stone, or in the United States also of dignified solid wood—so the priest can move around it and face the gathered assembly where architecture allows. Stripped of clutter before the offertory and clothed in crisp white linen, the altar directs every eye to the Eucharistic offering."

