[symbolism]
has_sourced_symbolism = true
text = "The cross adorned with the figure of Christ crucified remains visibly before the assembly during Mass and outside liturgical celebrations so as to recall the saving Passion of the Lord (GIRM 308). St. Paul proclaims, “But we preach Christ crucified” (1 Cor 1:23) and “But God forbid that I should glory, save in the cross of our Lord Jesus Christ” (Gal 6:14), through whom God reconciles all things, “making peace through the blood of his cross” (Col 1:20). St. Thomas Aquinas affirms that the consecration of the Eucharist, the acceptance of the sacrifice, and all its fruits flow from the virtue of the Cross of Christ."
evidence_class = "liturgical-source"
attribution = "GIRM 308; 1 Cor 1:23; Gal 6:14; Col 1:20; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 5, ad 3"

[counterpart_1962]
relationship = "changed use"
locus_1962 = "Missale Romanum (1962), Rubricae Generales n. 527; Fortescue (1943), pp. 17, 71, 78–79"
comparison = "Whereas the 1962 Roman Missal required a separate crucifix standing in the center of the altar (RG 527) and did not ordinarily prescribe a carried cross at a priest’s High Mass entrance, the 2002/2008 GIRM assigns the processional cross with the figure of Christ crucified a regular place in the entrance procession (GIRM 120b) and permits it to stand near the altar as the sole altar cross (GIRM 122, 308). The 2002 third typical edition also restored the explicit requirement of the sculpted corpus that had been omitted in the 1970 and 1975 editions."

