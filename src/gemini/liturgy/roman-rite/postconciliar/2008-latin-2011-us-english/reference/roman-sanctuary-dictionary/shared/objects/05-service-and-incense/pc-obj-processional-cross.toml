[identification]
summary = "The processional cross is a tall staff-mounted crucifix carried at the head of liturgical processions and often stationed beside the altar to serve as the single altar cross during Mass."
appearance = "A Latin cross bearing the sculpted figure of Christ crucified is fitted into a ringed socket atop a slender cylindrical wooden or metal staff, matching the standing altar crucifix shown at the center of the mensa in Plate I."
placement_and_use = "During the entrance procession, an instituted acolyte or altar server carries the processional cross between two ministers bearing lighted candles (GIRM 120b). On reaching the sanctuary, the cross may be set in a floor stand near the altar to serve as the altar cross, in which case it must be the only cross present; otherwise it is placed away in a dignified spot while a separate crucifix remains clearly visible on or near the altar (GIRM 117, 122, 308). It is fitting that the cross with the figure of Christ crucified remain near the altar even outside liturgical celebrations (GIRM 308)."
liturgical_colors = "Not governed by the seasonal color cycle; crafted in dignified wood, brass, bronze, silver, or other noble metal with a visible sculpted corpus."

[ministers_and_handling]
ordinary_ministers = ["instituted-acolyte", "altar-server"]
prepares = ["sacristan", "altar-server"]
server_boundary = "carries"
server_boundary_summary = "The cross-bearer carries the processional cross upright with the figure of Christ facing forward, omits bowing and genuflecting while holding it (GIRM 274), and sets it securely in its floor stand near the altar or puts it away if another altar cross already stands there (GIRM 122)."
safety_warning = "Do not bow or genuflect while holding the processional cross (GIRM 274), both to honor the rubric and to prevent the tall staff from pitching forward. Keep the staff clear of low doorways and hanging lights, and confirm that its weighted floor stand is level and stable before releasing it."

[audience_text]
altar_server = "As cross-bearer (crucifer), hold the staff upright with both hands at a steady height so the sculpted figure of Christ faces forward as you lead the ministers behind the thurifer. Never bow or genuflect while carrying the cross (GIRM 274). Once you reach the sanctuary, seat the staff firmly in its floor stand near the altar—or put it away cleanly if a separate altar crucifix is already stationed on or beside the altar (GIRM 122)."
sacristan = "Ensure that a cross bearing a clear figure of Christ crucified is prepared for the entrance procession or already stationed visibly on or near the altar (GIRM 117, 308). Check that the socket joint is tight and that the sanctuary floor stand is weighted, unobstructed, and does not duplicate an existing altar crucifix (GIRM 122)."
general_reader = "At the beginning of Mass, the processional cross leads the entrance of the ministers into the sanctuary, directing the eyes of the assembly to Christ crucified. In the postconciliar Roman Rite, this carried crucifix frequently stands beside the altar throughout Mass as the single altar cross, keeping the saving Passion of the Lord visibly present at the heart of Eucharistic worship (GIRM 122, 308)."

