[identification]
summary = "The baptismal font is the permanent stone or metal water basin required in every parish church for administering the Sacrament of Baptism."
appearance = "Illustrated at bottom right of Plate X as a carved octagonal stone basin decorated with foliate relief panels, raised on a matching paneled pedestal and stepped plinth, with a ribbed domed cover resting ajar to expose the smooth interior basin."
placement_and_use = "The baptismal font is governed by universal canon law (CIC can. 858 §1, requiring a font in every parish church), the Rite of Baptism for Children (General Introduction 25, 45–47), and the Easter Vigil rubrics of the Roman Missal. Local architecture places it either in a distinct baptistery or in a prominent, clearly visible area near the church entrance or sanctuary so the assembly can participate in Baptisms and process to the font at the Easter Vigil; its design accommodates clean flowing or poured water (and, where provided, immersion). Bishops, priests, and deacons are the ordinary ministers of Baptism (CIC can. 861 §1)."
liturgical_colors = "Remains in its natural carved stone, wood, or metal finish; during Easter Time the tall white Paschal Candle stands beside it."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan", "deacon", "altar-server"]
server_boundary = "recognizes-only"
server_boundary_summary = "Servers walk in procession to the font with cross, candles, ritual book, or drying towels during Baptisms and the Easter Vigil, never pouring sacramental water or disposing of blessed baptismal water improperly."
safety_warning = "Never empty blessed baptismal water into an ordinary sink or sewer drain; blessed water must be poured reverently into the sacrarium or directly into clean earth. Wipe any splashed water from stone or tiled steps immediately to prevent slipping."

[audience_text]
altar_server = "You will serve around the octagonal baptismal font during parish Baptisms and the Easter Vigil procession. Your role is to accompany the priest or deacon carrying the processional cross, lighted candles, the ritual book, or a clean tray with linen towels and the closed holy-oil stocks when requested. Leave the pouring of water and all anointings to the clergy, watch for slippery droplets on the floor around the basin, and never dump blessed baptismal water down an ordinary drain."
sacristan = "Before every Baptism and especially before the Easter Vigil, scrub the font basin thoroughly and fill it with fresh, clean water (warmed gently when infants are baptized). Keep the removable domed cover clean and steady when lifted, stage clean linen towels, a pouring shell or pitcher, the baptismal candle, and the labeled Oil of Catechumens and Sacred Chrism nearby, and verify that any drained blessed water flows strictly into the sacrarium or clean earth."
general_reader = "Required in every parish church by canon law, the baptismal font marks the threshold of Christian life where believers are reborn of water and the Holy Spirit. Traditionally carved with eight sides to recall the eighth day of Christ's Resurrection, the postconciliar font is placed prominently where the whole parish can gather around it for Baptisms and return to it during the Easter Vigil to renew their baptismal promises."

