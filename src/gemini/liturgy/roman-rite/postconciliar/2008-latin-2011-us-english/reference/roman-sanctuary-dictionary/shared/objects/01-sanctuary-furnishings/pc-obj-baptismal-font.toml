[symbolism]
has_sourced_symbolism = true
text = "The ancient Roman Easter Vigil blessing calls the baptismal font the motherly womb from which the Church brings forth new children in Christ, uniting the Lord's teaching in John 3:5 (“unless a man be born again of water and the Holy Ghost, he cannot enter into the kingdom of God.”) with St. Paul's mystery of death and resurrection in Rom 6:3–4 (“Know you not that all we who are baptized in Christ Jesus are baptized in his death? For we are buried together with him by baptism into death: that, as Christ is risen from the dead by the glory of the Father, so we also may walk in newness of life.”). Early Christian catechesis, including St. Cyril of Jerusalem, expounds the font as both tomb and womb of new creation, reflected architecturally in the classic octagonal basin of the eighth day."
evidence_class = "liturgical-source"
attribution = "Roman Missal Easter Vigil; CCC 1237–1243; John 3:5; Rom 6:3–4; St. Cyril of Jerusalem, Mystagogical Catechesis 2.4"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Vigilia Paschalis (cf. Missale Romanum 1922, Holy Saturday); Rituale Romanum (1925/1952), Tit. II"
comparison = "Both 1962 discipline and CIC (1983) can. 858 require a baptismal font in every parish church. Whereas 1962 practice ordinarily enclosed the font inside a gated baptistery near the church entrance and blessed the year's water at the Easter Vigil with an infusion of Oil of Catechumens and Sacred Chrism directly into the basin, postconciliar rites bless fresh water at each Baptism outside Easter Time without pouring oils into the font and favor congregationally visible placement suited to pouring or immersion."

