territorial_note = ""

[identification]
summary = "The sanctuary lamp is the dedicated oil or wax lamp kept burning continuously near the tabernacle to announce and honor the Eucharistic presence of Christ."
appearance = "Shown at bottom right of Plate II and beside the recessed rear niche in Plate I as a rounded metal lamp bowl suspended on three chains from a ceiling mount or wall bracket, cradling a cylindrical glass globe (traditionally red or clear) that shields a living oil or beeswax flame."
placement_and_use = "Universal Roman law and canon law require a special lamp, nourished by oil or wax rather than an electric bulb, to shine permanently day and night beside every tabernacle in which the Most Holy Eucharist is reserved (GIRM 316; CIC can. 940). It is extinguished only when the tabernacle is completely emptied of the Blessed Sacrament, notably from the Mass of the Lord's Supper on Holy Thursday evening until reservation resumes at the Easter Vigil."
liturgical_colors = "Not governed by the seasonal vestment colors; custom commonly uses a red glass globe (or clear glass) so the living flame stands out unmistakably near the tabernacle."

[ministers_and_handling]
ordinary_ministers = ["priest", "sacristan"]
prepares = ["sacristan"]
server_boundary = "recognizes-only"
server_boundary_summary = "Servers look to the burning sanctuary lamp as the unmistakable sign that Christ is reserved in the tabernacle and never light, move, or extinguish it during Mass; any maintenance outside Mass follows sacristan direction with fire-safety care."
safety_warning = "Never extinguish, move, or adjust the sanctuary lamp during Mass, and never extinguish it while the Blessed Sacrament remains reserved in the tabernacle. If assisting the sacristan outside Mass to replace a sanctuary candle or oil vessel, allow hot glass and oil to cool safely, guard against open flame, and never open the tabernacle."

[audience_text]
altar_server = "Whenever you enter the sanctuary, glance first toward the hanging sanctuary lamp beside the tabernacle. Its steady living flame tells you immediately that the Blessed Sacrament is reserved inside, signaling when to genuflect before the tabernacle. Servers never light, extinguish, or touch the sanctuary lamp during Mass; if the sacristan asks for help replenishing it outside Mass, handle hot glass and open flame with patience and care."
sacristan = "Inspect the sanctuary lamp daily so that a living oil or wax flame—never a substitute electric light—shines without interruption whenever the Eucharist is reserved (GIRM 316; CIC can. 940). Replace seven-day or fourteen-day beeswax cylinders or refill oil reservoirs before the flame burns low, letting heated glass cool before handling and keeping spare wicks and globes clean. Extinguish and remove the flame only when the tabernacle has been completely emptied, as on Good Friday."
general_reader = "Hanging quietly beside the tabernacle, the sanctuary lamp is the Church's silent beacon announcing that Christ is sacramentally present inside. Fed continuously by real oil or wax in fidelity to ancient biblical and Roman custom, its single steadfast flame invites every worshiper entering the church to pause, genuflect, and pray before the Lord."

[relationships]
