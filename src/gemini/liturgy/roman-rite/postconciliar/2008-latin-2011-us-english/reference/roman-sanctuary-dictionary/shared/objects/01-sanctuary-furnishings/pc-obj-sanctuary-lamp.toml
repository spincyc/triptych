[symbolism]
has_sourced_symbolism = true
text = "The continuously burning oil or wax lamp openly signals Christ's abiding sacramental presence in the tabernacle and renders silent honor to Him day and night, echoing the perpetual lamp commanded before the Old Covenant sanctuary in Ex 27:20–21 (“Command the children of Israel that they bring thee the purest oil of the olives, and beaten with a pestle: that a lamp may burn always, In the tabernacle of the testimony, without the veil that hangs before the testimony”) and Lev 24:2–3 (“to furnish the lamps continually, Without the veil of the testimony in the tabernacle of the covenant”)."
evidence_class = "liturgical-source"
attribution = "GIRM 316; CIC (1983) can. 940; Ex 27:20–21; Lev 24:2–3"

[counterpart_1962]
relationship = "continued"
locus_1962 = "Codex Iuris Canonici (1917) can. 1271"
comparison = "Postconciliar discipline continues the 1917/1962 requirement without interruption: both CIC (1917) can. 1271 and CIC (1983) can. 940 together with GIRM 316 require a special living flame of oil or wax to burn continually before or near the tabernacle whenever the Eucharist is reserved."

