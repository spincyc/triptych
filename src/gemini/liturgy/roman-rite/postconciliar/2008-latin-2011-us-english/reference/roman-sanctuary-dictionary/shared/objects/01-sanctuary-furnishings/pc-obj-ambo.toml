[symbolism]
has_sourced_symbolism = true
text = "The General Instruction pairs the ambo with the altar as the two tables of the Mass—the table of God's Word and the table of Christ's Body—directing that the dignity of Sacred Scripture be honored by a fixed, noble place toward which the congregation naturally turns. Its prominence visibly echoes the Psalmist's confession in Ps 118:105 [Heb 119:105]: “Thy word is a lamp to my feet, and a light to my paths.”"
evidence_class = "liturgical-source"
attribution = "GIRM 28, 309; Ordo lectionum Missae (1981) Praenotanda 32–34; Ps 118:105 [Heb 119:105]"

[counterpart_1962]
relationship = "newly provided"
locus_1962 = "Missale Romanum (1962), Ritus Servandus VI.4–5 (no fixed sanctuary ambo prescribed)"
comparison = "The 1962 Roman Missal did not prescribe a permanent sanctuary ambo: at Low Mass the priest read the Epistle and Gospel from opposite corners of the altar, and at Solemn Mass the subdeacon and deacon sang them from the sanctuary floor with the subdeacon holding the Gospel book (RS VI.4–5). Postconciliar law restores a dedicated stationary ambo as a standard architectural appointment of every sanctuary (Inter Oecumenici 96; GIRM 309)."

