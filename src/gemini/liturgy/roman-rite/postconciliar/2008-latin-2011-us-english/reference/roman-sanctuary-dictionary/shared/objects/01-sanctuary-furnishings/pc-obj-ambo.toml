disposition = "required"
scope_level = "universal-roman"
territorial_note = ""

[identification]
summary = "The ambo is the stationary architectural stand in the sanctuary reserved exclusively for proclaiming the Word of God during the liturgy."
appearance = "Depicted in Plate II as a permanent paneled stone structure resting on a molded base with a rear minister's step and an inclined book desk sized for the Lectionary or Book of the Gospels, and placed in the left foreground of Plate I in clear visual harmony with the freestanding altar."
placement_and_use = "Universal Roman law prescribes a permanent, stationary ambo—never a lightweight movable lectern—positioned so that the attention of the faithful turns naturally toward it during the Liturgy of the Word and ministers can be clearly seen and heard (GIRM 309; Ordo lectionum Missae 32–34). Only the Scripture readings, the Responsorial Psalm, and the Easter Proclamation (Exsultet) are proclaimed from the ambo, together with the homily and the intentions of the Universal Prayer; parish announcements, commentary, and the leading of general singing belong at a separate stand elsewhere."
liturgical_colors = "Normally left in its unadorned stone or wood architectural finish; where local custom drapes an ambo antependium or hanging, it follows the liturgical color of the day (GIRM 346)."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon", "instituted-lector"]
prepares = ["sacristan", "instituted-lector", "altar-server"]
server_boundary = "recognizes-only"
server_boundary_summary = "Servers flank the ambo with lighted candles and incense during the Gospel proclamation and may confirm before Mass that the Lectionary rests open upon the desk, but never proclaim readings or lead prayers from the ambo unless separately deputed as readers."
safety_warning = "Watch the rear step of the ambo when moving into place with lighted Gospel candles or a smoking thurible, keeping flames well clear of the microphone, Lectionary pages, and ministers' vestments."

[audience_text]
altar_server = "The permanent stone or wood ambo stands toward the front of the sanctuary for the Liturgy of the Word. Before Mass, you may check that the Lectionary is open to the right page on its sloped desk, and during the Gospel procession you walk ahead with lighted candles or the thurible and stand neatly beside the ambo facing the deacon or priest. Keep an eye on the step behind the ambo when carrying lighted candles, and remember that altar servers do not read from the ambo unless separately scheduled as readers."
sacristan = "Before Mass, place the Lectionary—never a disposable booklet—neatly upon the ambo desk and open it to the appointed first reading (GIRM 118b, 349). Confirm that the desk is clear of parish announcements, music folders, and stray papers, that any lighting or microphone works cleanly without obstructing the Book of the Gospels, and that a separate lectern stands outside the ambo's focal area for a commentator or song leader when needed (GIRM 309)."
general_reader = "Because Catholic worship nourishes the faithful at two tables—the table of God's Word and the table of Christ's Body—the postconciliar sanctuary pairs its central altar with a solid, stationary ambo. Built to match the altar's dignity rather than serving as a utilitarian podium, the ambo is set apart strictly for Scripture, the Responsorial Psalm, the Easter Proclamation, the homily, and the Prayer of the Faithful, drawing the entire assembly's gaze when God speaks through the sacred readings."

