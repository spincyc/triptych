comparison = "The 1962 Roman Missal required a blessed small linen pall on every prepared chalice stack to cover the host and chalice throughout the Offertory and Canon (RS I.1, VII.5, VIII.7). Postconciliar law expressly makes the pall optional, prescribing it “if appropriate” (pro opportunitate, GIRM 118c)."

