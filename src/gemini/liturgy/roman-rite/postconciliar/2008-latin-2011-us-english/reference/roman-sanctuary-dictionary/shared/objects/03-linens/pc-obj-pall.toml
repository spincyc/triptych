[identification]
summary = "A stiffened flat square of white linen placed optionally over the mouth of the chalice to shield the wine and Precious Blood from dust, lint, or insects."
appearance = "Shown at bottom left of Plate IV: a rigid, flat square of crisp white linen (typically six to seven inches across) bordered with fine hemstitching or drawn-thread work, held flat either by heavy starching of layered linen or by a removable waterproof insert inside a washable linen slipcover."
placement_and_use = "Prepared on the credence table atop the chalice and paten whenever appropriate—explicitly qualified as optional (pro opportunitate, “if appropriate”) in GIRM 118c—and permitted on the altar mensa during the Liturgy of the Eucharist (GIRM 139, 306). The priest or deacon lifts it before pouring, consecrating, or drinking, and replaces it whenever dust, drafts, or insects threaten an open chalice, especially in warm seasons or outdoor Masses."
liturgical_colors = "White linen on its functional body and underside; restrained white embroidery or subtle decorative trim occasionally adorns the upper face."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan", "deacon", "instituted-acolyte", "altar-server"]
server_boundary = "prepares"
server_boundary_summary = "Servers may set a clean pall atop the unconsecrated chalice on the credence table and bring it to the altar at the Preparation of the Gifts; once the Eucharistic Prayer begins, servers do not place or remove the pall over a chalice containing the Precious Blood."
safety_warning = "Remove any rigid insert before washing a slipcover pall; if drops of the Precious Blood ever touch the linen underside, soak and hand-rinse the linen first into the sacrarium or clean earth before ordinary laundering (RS 120)."

[audience_text]
altar_server = "Look at bottom left of Plate IV: unlike the folded corporal above it, the pall is completely flat and stiff so it rests steadily across the chalice rim without sagging into the wine. If your parish uses a pall, set it cleanly atop the paten on the unconsecrated chalice at the credence table and carry it steadily to the altar at the Preparation of the Gifts. Once the Eucharistic Prayer begins, leave placing and removing the pall to the priest or deacon."
sacristan = "Keep clean, unwarped palls ready on the credence table whenever appropriate (GIRM 118c)—especially during summer months, open-window ventilation, or outdoor celebrations where dust or insects might fall into the chalice. Inspect the underside before every Mass for stains; remove any plastic or card insert before washing, and whenever the linen has contacted the Precious Blood, perform the sacrarium first-rinse mandated by Redemptionis Sacramentum 120 before regular laundering."
general_reader = "This crisp, stiffened white square rests flat across the top of the chalice like a clean linen lid. Serving a practical office of reverence, it protects the wine and the Precious Blood from dust or insects, and postconciliar rubrics make its use optional whenever pastoral conditions call for it (GIRM 118c)."

