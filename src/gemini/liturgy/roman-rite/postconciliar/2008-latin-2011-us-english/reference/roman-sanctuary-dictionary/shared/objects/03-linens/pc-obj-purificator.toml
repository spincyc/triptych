comparison = "The folded white linen purificator continues directly from the 1962 Roman Missal (RS I.1, X.5), where a single purificator served the celebrant's chalice and ablutions. In postconciliar celebration, Communion under both kinds expands its use so that a separate clean purificator accompanies every Communion chalice (GIRM 286)."

