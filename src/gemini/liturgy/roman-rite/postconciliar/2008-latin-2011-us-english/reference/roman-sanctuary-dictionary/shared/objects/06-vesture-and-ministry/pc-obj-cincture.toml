[symbolism]
has_sourced_symbolism = true
text = "The General Instruction prescribes the cincture strictly for the practical task of fastening an unfitted alb at the waist (GIRM 336). Distinct from that rubrical rule, the traditional Roman sacristy vesting prayer asks God to gird the minister with the belt of purity, continence, and chastity, echoing the Gospel and Epistles—“Let your loins be girt and lamps burning in your hands” (Luke 12:35) and “Stand therefore, having your loins girt about with truth” (Eph 6:14)—while Amalarius of Metz likewise reads the cincture as an emblem of self-mastery."
evidence_class = "devotional-tradition"
attribution = "Practical norm: GIRM 336; devotional tradition: Roman sacristy vesting prayer (Ad Cingulum); Luke 12:35; Eph 6:14; Amalarius of Metz, Liber Officialis II.22"

[counterpart_1962]
relationship = "optional"
locus_1962 = "Missale Romanum (1962), Ritus Servandus I.3; Praeparatio ad Missam (Ad Cingulum)"
comparison = "In the 1962 Roman Missal, the cincture was unconditionally mandatory with every alb both to gather the tunic and to anchor the priest’s crossed stole across the breast (RS I.3). Under the 2002/2008 GIRM, the cincture becomes conditionally optional whenever an alb is tailored to fit cleanly without one (GIRM 336), and the priest’s stole hangs straight rather than crossing through the cincture (GIRM 340)."

