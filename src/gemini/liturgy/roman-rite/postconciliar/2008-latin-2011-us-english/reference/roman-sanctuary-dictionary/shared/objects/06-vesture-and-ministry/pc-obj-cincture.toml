[identification]
summary = "The cincture is a braided cord or cloth band tied around the waist over an unfitted alb to gather its folds neatly and hold its length clear of the floor."
appearance = "Shown looped at the waist of the center deacon in Plate VIII with twin tasseled ends hanging neatly at his left side, and coiled in the lower right inset, the cincture is a supple rope cord finished with fringed tassels at both ends."
placement_and_use = "Universal Roman law directs that the alb be secured at the waist with a cincture unless the alb is specifically tailored to fit cleanly without one (GIRM 336; RS 122; Caeremoniale Episcoporum 65). Any bishop, priest, deacon, instituted acolyte, instituted lector, or altar server wearing an unfitted alb ties the cincture smoothly around the waist so that the garment hangs evenly at ankle height. For a deacon serving without a dalmatic, the cincture may also steady the diagonal stole at the waist, whereas the postconciliar priest’s straight stole hangs freely over or beside the cincture rather than crossing beneath it (GIRM 340)."
liturgical_colors = "Ordinarily white, though a cord matching the liturgical color of the day may be worn by clergy or by servers where parish custom avoids confusing colored cords with clerical insignia."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon", "instituted-acolyte", "instituted-lector", "altar-server"]
prepares = ["sacristan", "altar-server"]
server_boundary = "handles"
server_boundary_summary = "Altar servers tie the cincture neatly around the waist whenever wearing an unfitted alb, keeping the tasseled ends even and well clear of the floor and never confusing a colored waist cord with an ordained stole."
safety_warning = "Tie the cincture securely so loose cord ends cannot drag on sanctuary steps, snag on pew corners or candle stands, or brush against open candle flames and hot thuribles."

[audience_text]
altar_server = "Whenever your alb is loose-fitting rather than tailored to sit smoothly without a belt, wrap a cincture around your waist and tie it cleanly at the side so the tasseled ends hang evenly above your knees (GIRM 336). Keep the knot tight so cords never dangle near candle flames or steps, and remember that even a colored server cincture is only a practical waist cord—never a clerical stole."
sacristan = "Keep braided cinctures neatly hung or coiled beside the albs so cords do not tangle or fray at the tassels. Provide white cinctures as the standard pairing for clergy and servers, and verify that unfitted albs always have a matching cincture available in the vesting sacristy (GIRM 336)."
general_reader = "Because a traditional linen alb is cut generously, a woven rope cincture gathers it comfortably at the waist and adjusts the hem so it clears the floor cleanly. Under current Roman law, the cincture is required whenever an alb is not tailored to fit smoothly on its own (GIRM 336)."

