[symbolism]
has_sourced_symbolism = true
text = "The metal stocks themselves are practical protective containers; sacramental symbolism belongs to the consecrated and blessed oils they hold. In the Church's liturgy, oil signifies cleansing, healing, strength, and spiritual joy, while balsam-perfumed Sacred Chrism signifies the seal of the Holy Spirit conforming the anointed to Christ as priest, prophet, and king and spreading the “fragrance of innocence” prayed for in the Roman Chrism Preface. St. Paul writes, “Now he that confirmeth us with you in Christ and that hath anointed us, is God: Who also hath sealed us and given the pledge of the Spirit in our hearts” (2 Cor 1:21–22), and St. James instructs the Church concerning the sick, “Is any man sick among you? Let him bring in the priests of the church and let them pray over him, anointing him with oil in the name of the Lord. And the prayer of faith shall save the sick man” (James 5:14–15)."
evidence_class = "liturgical-source"
attribution = "CCC 1294–1300; Ordo benedicendi oleum (1970); Roman Chrism Preface; 2 Cor 1:21–22; James 5:14–15"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Feria V in Coena Domini (Missa Chrismatis) and Vigilia Paschalis (Blessing of Baptismal Water); Pontificale Romanum (1859), De benedictione oleorum"
comparison = "The 1962 rites required pure olive oil exclusively, blessed strictly on Holy Thursday morning, and poured both Oil of Catechumens and Sacred Chrism directly into the Easter Vigil baptismal font. Postconciliar discipline (Ordo benedicendi oleum 1970; CIC 1983 can. 847, par. 1) permits oil pressed from olives or other plants, allows moving the Chrism Mass to an earlier day in Holy Week to foster presbyteral participation, discontinues pouring oils into the font water, and encourages prominent reservation in a locked ambry near the baptistery or sanctuary."

