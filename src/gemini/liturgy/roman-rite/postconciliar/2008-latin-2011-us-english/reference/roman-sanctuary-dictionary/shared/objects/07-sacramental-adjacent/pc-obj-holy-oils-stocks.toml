[edition_disposition]
edition_locale = "2008-latin-2011-us-english"
as_of = "2026-11-25"
disposition = "required"
scope_level = "universal-roman"
territorial_note = "Universal canon law (CIC can. 847) requires every parish to obtain newly consecrated and blessed oils each year from its diocesan bishop and safeguard them diligently. In the United States, parishes commonly receive the new oils during the Evening Mass of the Lord's Supper on Holy Thursday using the USCCB Order for the Reception of the Holy Oils, and many churches display the locked ambry visibly near the baptismal font or sanctuary."

[identification]
summary = "The three Holy Oils—Sacred Chrism (SC), Oil of Catechumens (OC), and Oil of the Sick (OI)—are olive or other plant oils consecrated or blessed annually by the diocesan bishop for sacramental anointing, kept in matching labeled metal or glass oil stocks and safeguarded in a locked ambry (armarium oleorum)."
appearance = "Matching cylindrical metal stocks with tightly fitted domed lids and rounded finials stand together on a rimmed tray; larger display urns hold the parish supply in the locked ambry, while smaller screw-top pocket stocks lined with oil-saturated cotton serve baptisms and sick calls. In parish use, actual stocks and lids bear unmistakable marks—SC or CHR for Sacred Chrism, OC (or older Latin OS, Oleum Sanctum—never to be confused with English “Oil of the Sick”) for Oil of Catechumens, and OI or INF for Oil of the Sick—so that vessels and caps are never transposed."
placement_and_use = "At the annual Chrism Mass (Missa Chrismatis), celebrated on Holy Thursday morning or an earlier day in Holy Week close to Easter, the diocesan bishop blesses the Oil of the Sick and the Oil of Catechumens and mixes balsam or fragrance into oil to consecrate Sacred Chrism (Ordo benedicendi oleum 1970; Caeremoniale Episcoporum 1984 no. 274). Parishes receive fresh oils each year and reserve them under lock in a clean, dignified ambry in the sanctuary, baptistery, or sacristy (CIC can. 847, par. 2). Sacred Chrism anoints the newly baptized, the confirmed, newly ordained priests and bishops, and dedicated churches and altars; Oil of Catechumens is used in pre-baptismal anointing; and Oil of the Sick is administered in the Anointing of the Sick."
liturgical_colors = "Not applicable to the vessels themselves; white vestments are worn at the Chrism Mass and Baptism, red or white at Confirmation, and violet or white at Anointing of the Sick according to the rite."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["priest", "sacristan"]
server_boundary = "moves-only-by-direction"
server_boundary_summary = "Carry closed oil urns in procession only when designated (such as at the Chrism Mass or Holy Thursday reception of the oils) and hold a service tray with cotton and towel for the minister during Baptism or Confirmation; never open a stock, anoint anyone, transpose caps, or handle the ambry key."
safety_warning = "Never open an oil stock, attempt to anoint anyone, or interchange caps between SC, OC, and OI vessels. Hold closed oil urns upright with both hands during processions to prevent oil spills on sanctuary steps, and never discard previous year's oils in ordinary sinks, trash, or plumbing; old oils are burned reverently (commonly absorbed in cotton or consumed in the Easter fire) or poured into the sacrarium or clean earth according to diocesan direction."

[audience_text]
altar_server = "You will see the three matching cylindrical oil stocks on Plate X beside the baptismal font, and in church you may see larger urns reserved behind a locked ambry door. If assigned to carry one of the closed urns during the Chrism Mass or the Holy Thursday reception of the holy oils, hold it level and steady with both hands and never loosen the lid. During Baptisms or Confirmations, you may hold a small tray with cotton, a slice of lemon, and a finger towel for the priest or bishop to cleanse his hands after anointing, while leaving the stocks themselves strictly to the ordained minister."
sacristan = "Before the Chrism Mass, clean and thoroughly dry the parish urns and portable stocks, check that engraved abbreviations (SC/CHR for Sacred Chrism, OC—or older Latin OS, Oleum Sanctum, never to be confused with English “Oil of the Sick”—for Oil of Catechumens, and OI/INF for Oil of the Sick) match cleanly on both body and lid, and replace oil-soaked cotton in pocket stocks with fresh absorbent cotton. After the fresh oils arrive, coordinate with the pastor to dispose of the previous year's oils reverently by burning or via the sacrarium or clean earth per diocesan direction—never down ordinary drains—and keep the ambry clean and locked (CIC can. 847, par. 2). Before Baptisms or Confirmations, set out the required stock alongside cotton, lemon, warm water, and a hand towel."
general_reader = "Every year during Holy Week, the diocesan bishop gathers with his priests at the Chrism Mass to bless the Oil of the Sick and the Oil of Catechumens and to consecrate perfumed Sacred Chrism, sending fresh oils home to every parish. Kept in three matching lidded stocks inside a locked parish cabinet called an ambry, these oils trace the arc of a Catholic life: strengthening catechumens before Baptism, sealing the baptized and confirmed with the gift of the Holy Spirit, healing and fortifying the gravely ill, and consecrating priests, bishops, churches, and altars."

