[symbolism]
has_sourced_symbolism = true
text = "The General Instruction assigns the amice a practical purpose—covering ordinary attire at the neck whenever the alb leaves it exposed (GIRM 336). Distinct from that practical rule, the traditional Roman sacristy vesting prayer—recalling the custom of resting the amice momentarily on the head before lowering it to the shoulders—prays for the helmet of salvation against demonic assaults, echoing St. Paul: “And take unto you the helmet of salvation and the sword of the Spirit (which is the word of God)” (Eph 6:17). Amalarius of Metz reads the cloth encircling the neck as a guard over speech, citing the Psalms, “I have set a guard to my mouth” (Ps 38:2 [Heb 39:1]) and “Set a watch, O Lord, before my mouth” (Ps 140:3 [Heb 141:3])."
evidence_class = "devotional-tradition"
attribution = "Practical norm: GIRM 336; devotional tradition: Roman sacristy vesting prayer (Ad Amictum); Eph 6:17; Ps 38:2 [Heb 39:1]; Ps 140:3 [Heb 141:3]; Amalarius of Metz, Liber Officialis II.17"

[counterpart_1962]
relationship = "optional"
locus_1962 = "Missale Romanum (1962), Ritus Servandus I.3; Praeparatio ad Missam (Ad Amictum)"
comparison = "In the 1962 Roman Missal, the amice was unconditionally required as the first Mass vestment for every bishop, priest, deacon, and subdeacon, kissed at its center cross and placed briefly upon the head before settling on the shoulders (RS I.3). Under the 2002/2008 GIRM, the amice is conditionally required only when the alb fails to cover ordinary attire at the neck (GIRM 336)."

