[identification]
summary = "The amice is a rectangular white linen shoulder cloth with long tie strings worn beneath a wide-necked alb whenever ordinary attire would otherwise show at the collar."
appearance = "Resting neatly around the priest’s neck inside the chasuble collar at left in Plate VIII and shown folded in the upper right inset, the amice is an oblong hemmed white cloth sewn with two long flat cloth ribbons extending from its upper corners to tie around the waist."
placement_and_use = "Universal Roman law directs that before putting on the alb, a minister is to wear an amice whenever the alb does not completely cover ordinary clothing at the neck (GIRM 336; RS 121–122; Caeremoniale Episcoporum 65). Draped across the shoulders, its tie strings pass under the arms, cross behind the back, and tie in front at the waist before the alb is slipped over it; the folded edge is then turned neatly over the neckline of the alb or chasuble so street or clerical collars remain concealed and outer vestments stay protected from perspiration."
liturgical_colors = "Always white linen or cotton (GIRM 336)."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon", "instituted-acolyte", "instituted-lector", "altar-server"]
prepares = ["sacristan", "altar-server"]
server_boundary = "handles"
server_boundary_summary = "Servers wearing a wide-necked alb that exposes ordinary shirt collars put on an amice beforehand (or use a high-collared alb that fully conceals street attire per GIRM 336), and assist in vesting a priest or bishop in the sacristy only when requested."
safety_warning = ""

[audience_text]
altar_server = "Look for the two long cloth tie strings sewn to the upper corners—they immediately distinguish a folded amice from an altar corporal or lavabo towel. If your alb has an open neckline that leaves your shirt collar showing, put on an amice first so ordinary street clothing is neatly covered (GIRM 336). Never lay an amice on the altar or credence table."
sacristan = "Keep clean, ironed amices stacked flat in the vesting case beside any wide-necked albs, folding the cloth smoothly with its tie strings coiled neatly inside. Launder amices regularly with ordinary sacristy linens—unlike corporals and purificators, they do not come into contact with the Sacred Species and do not require sacrarium first-rinsing."
general_reader = "Often noticed only as a crisp white linen fold framing the priest’s collar beneath the chasuble, the amice is a practical shoulder cloth fastened with long waist ties. Current Roman law calls for it whenever an alb’s neckline does not completely cover ordinary clothing at the neck (GIRM 336)."

