[symbolism]
has_sourced_symbolism = true
text = "The Church honors the tabernacle as the consecrated dwelling of Christ's abiding sacramental presence in the midst of His people, recalling the Lord's promise to Israel in Ex 25:8 (“And they shall make me a sanctuary, and I will dwell in the midst of them:”). Setting the tabernacle apart from the altar of celebration keeps distinct the sign of Christ's reserved presence for adoration and Viaticum from the sacrificial action of Mass, fulfilling the constant pastoral care that St. Thomas Aquinas grounds in bringing the Eucharist to the sick without delay."
evidence_class = "liturgical-source"
attribution = "GIRM 314–315; Eucharisticum Mysterium (1967) 53–55; Ex 25:8; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 5, ad 11"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Codex Iuris Canonici (1917) cann. 1268–1269; Missale Romanum (1962), Ritus Servandus II.2"
comparison = "Both the 1917 Code (cann. 1268–1269) and current law (CIC 1983 can. 938; GIRM 314) mandate a single immovable, solid, opaque, securely locked tabernacle. Whereas 1917/1962 discipline ordinarily fixed the veiled tabernacle in the middle of the high altar of celebration, GIRM 315 considers it clearer as a sign not to place it on the altar where Mass is celebrated, entrusting the Diocesan Bishop to choose either another worthy place in the sanctuary or an organically connected adoration chapel, and no longer universally mandating a tabernacle veil."

