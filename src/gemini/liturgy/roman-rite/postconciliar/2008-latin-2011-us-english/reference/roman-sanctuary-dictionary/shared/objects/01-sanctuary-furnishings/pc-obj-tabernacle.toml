[identification]
summary = "The tabernacle is the immovable, solid, locked sacred shrine in which the Most Holy Eucharist is reserved for Viaticum, Communion of the sick, and the adoration of the faithful."
appearance = "Illustrated at bottom right of Plate II as a rectangular solid metal safe with lockable double doors bearing relief crosses anchored upon a stone pedestal, and in Plate I as a domed opaque metal tabernacle set atop a pillar inside a recessed arched niche at the rear of the sanctuary, accompanied in both views by a hanging sanctuary lamp."
placement_and_use = "Universal Roman law requires ordinarily one tabernacle in a church or oratory, immovable, crafted of solid opaque material, securely locked against danger of profanation, and blessed before liturgical use (GIRM 314; CIC can. 938; Redemptionis Sacramentum 130). Because the sign of Mass is clearer when the tabernacle does not stand upon the altar of celebration, universal law (GIRM 315) entrusts the Diocesan Bishop to place it either in the sanctuary apart from the altar of celebration—not excluding a former high altar no longer used for Mass—or in a distinct chapel suitable for private adoration that is organically connected to the church and readily visible to the faithful. The pastor or rector must diligently safeguard the tabernacle key (CIC can. 938 §5)."
liturgical_colors = "Ordinarily displayed in its noble metal or architectural finish; a traditional fabric tabernacle veil (conopaeum) in white or the seasonal color of the day remains a lawful ornament where local custom retains it, though no longer universally mandated by GIRM 314."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["priest", "deacon"]
server_boundary = "clergy-reserved"
server_boundary_summary = "Strictly reserved to clergy (and to instituted acolytes or duly deputed extraordinary ministers solely for Communion distribution or reposition); altar servers never open the tabernacle, handle its key, or touch reserved vessels, and genuflect before it outside Mass and at the beginning and end of Mass when it stands in the sanctuary (GIRM 274)."
safety_warning = "Never open the tabernacle, touch the tabernacle key, or retrieve or repose the Blessed Sacrament. Key custody belongs strictly to the pastor or rector (CIC can. 938 §5). Genuflect on the right knee before the tabernacle outside Mass and at the beginning and end of Mass when it stands in the sanctuary (GIRM 274)."

[audience_text]
altar_server = "Inside the locked tabernacle rests the Body of Christ Himself. Whenever the sanctuary lamp burns beside it, genuflect smoothly on your right knee when passing before it outside Mass and at the entrance and exit of Mass when it stands in the sanctuary (unless you are carrying the processional cross or lighted candles, GIRM 274). An altar server never opens the tabernacle, never takes or holds the tabernacle key, and never reaches inside—only clergy, or instituted acolytes and duly mandated extraordinary ministers for Communion, handle what is reserved there."
sacristan = "Keep the exterior of the tabernacle, its stone pedestal, and its surrounding prayer area spotless, while respecting the canonical security of the key under the pastor's responsibility (CIC can. 938 §5). Never leave the key resting unattended in the lock or on an open sacristy hook. Confirm that a clean linen corporal lines the interior floor (placed by clergy or an authorized minister), ensure that the continuous oil or wax sanctuary lamp burns beside it whenever hosts are reserved (GIRM 316), and prepare to leave the tabernacle empty and open on Good Friday until the Easter Vigil."
general_reader = "Set in a prominent, quiet place of honor, the tabernacle is the locked sacred dwelling where consecrated hosts are kept after Mass so that Christ can be carried immediately to the sick and dying as Viaticum and adored by the faithful in silent prayer. Postconciliar Roman law places the tabernacle apart from the altar of celebration—either elsewhere in the sanctuary or in an adjoining Blessed Sacrament chapel as the Diocesan Bishop decides—so that worshipers clearly distinguish the unfolding Eucharistic action at the altar from Christ's abiding presence in reservation."

