[symbolism]
has_sourced_symbolism = true
text = "First among all liturgical books as a sign and symbol of heavenly realities, the Book of the Gospels receives elevation in procession, placement upon the altar, escort with lights and incense, and a reverent kiss because Christ himself speaks directly to his Church in the Gospel. St. Thomas Aquinas similarly distinguishes the earlier readings as preparatory instruction from the Gospel, by which Christ's own teaching instructs the faithful perfectly."
evidence_class = "liturgical-source"
attribution = "GIRM 62, 134, 175, 349; St. Thomas Aquinas, Summa Theologiae III, q. 83, a. 4, corpus"

[counterpart_1962]
relationship = "changed use"
locus_1962 = "Missale Romanum (1962), Ritus Servandus VI.5"
comparison = "In the 1962 Roman Missal, a separate Gospel book (liber Evangeliorum) belonged to Solemn Mass, where it was placed on the altar only before the Gospel, carried by the deacon in the Gospel procession, held by the subdeacon between lighted candles, incensed, and brought to the celebrant to kiss (RS VI.5). Postconciliar rubrics integrate the Book of the Gospels into ordinary Sunday and festive celebrations, carrying it slightly elevated in the entrance procession and resting it on the altar from the start of Mass until the Gospel procession (GIRM 120d, 122, 133--134, 306)."

