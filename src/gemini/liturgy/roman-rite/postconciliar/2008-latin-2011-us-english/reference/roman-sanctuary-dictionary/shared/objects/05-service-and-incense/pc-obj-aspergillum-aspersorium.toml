[symbolism]
has_sourced_symbolism = true
text = "The bucket and sprinkler are practical service instruments; the sacred symbolism belongs to the sprinkling rite itself, which recalls the grace and cleansing of Baptism (GIRM 51; Roman Missal, Appendix II). Its classic antiphon echoes the Psalmist: “Thou shalt sprinkle me with hyssop, and I shall be cleansed: thou shalt wash me, and I shall be made whiter than snow” (Ps 50:9 [Heb 51:7])."
evidence_class = "liturgical-source"
attribution = "GIRM 51; Roman Missal, Appendix II; Ps 50:9 [Heb 51:7]"

[counterpart_1962]
relationship = "changed use"
locus_1962 = "Missale Romanum (1962), Ordo ad aspergendam aquam benedictam, pp. [231]–[233]; Fortescue (1917), p. 16; Fortescue (1943), pp. 79–81"
comparison = "Although the portable metal bucket and sprinkler continue unchanged in form, the 1962 Roman Missal placed the Sunday Asperges me or Vidi aquam before the start of Mass, with the water blessed in the sacristy and the celebrant wearing a cope before putting on the chasuble. In the 2002/2008 Roman Missal, the Blessing and Sprinkling of Water takes place inside the Introductory Rites in place of the Penitential Act, celebrated by the priest already vested in his chasuble (GIRM 51, 118c; Appendix II)."

