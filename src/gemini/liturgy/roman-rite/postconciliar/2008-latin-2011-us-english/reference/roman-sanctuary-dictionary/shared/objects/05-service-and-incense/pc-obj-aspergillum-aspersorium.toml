[identification]
summary = "The aspersorium is the portable vessel that holds blessed water, paired with the aspergillum, the handheld sprinkler used to cast holy water over the assembly, altar, or blessed objects."
appearance = "A tapered cylindrical metal bucket rests on a molded circular foot with an arched wire bail handle hooked to twin rim lugs; beside it lies a turned metal sprinkler handle ending in a perforated hollow sphere (some parishes also use a bristled brush or natural evergreen branch)."
placement_and_use = "On Sundays, especially during Easter Time, the Order for the Blessing and Sprinkling of Water may replace the ordinary Penitential Act within the Introductory Rites of Mass (GIRM 51; Roman Missal, Appendix II). When the sprinkling rite is scheduled, the clean vessel of water to be blessed (or already blessed, as at the Easter Vigil) is prepared with the sprinkler on the credence table (GIRM 118c). The priest—vested in his chasuble—blesses the water, sprinkles himself and the ministers, and walks through the church sprinkling the faithful while a deacon or server carries the bucket beside him. The same paired instruments serve at funerals, church blessings, and sacramentals in the Book of Blessings."
liturgical_colors = "Not governed by the seasonal color cycle; made of brass, bronze, pewter, silver-plate, or stainless metal that resists water corrosion."

[ministers_and_handling]
ordinary_ministers = ["bishop", "priest", "deacon"]
prepares = ["sacristan", "altar-server"]
server_boundary = "presents"
server_boundary_summary = "Servers fill the clean vessel on the credence table before Mass, bring it to the priest for the blessing and sprinkling rite, accompany him through the nave holding the bucket steady, and return both articles cleanly to the credence table afterward (GIRM 51, 118c)."
safety_warning = "Fill the bucket only half to two-thirds full so water does not slosh over the rim onto stone or polished sanctuary steps and create a slipping hazard for ministers and communicants."

[audience_text]
altar_server = "Before a Sunday sprinkling rite, confirm that the clean holy-water bucket is filled roughly two-thirds full on the credence table with the sprinkler beside it (GIRM 118c). Bring both to the priest at the chair or altar when signaled, hand him the sprinkler handle first, and walk steadily at his side through the aisle holding the bucket level so he can dip easily without spilling water on the steps. Return both pieces to the credence table as soon as the sprinkling ends."
sacristan = "Clean and dry the interior liner of the aspersorium regularly so mineral deposits do not accumulate, and inspect the perforated head of the aspergillum to ensure its internal sponge (if fitted) is clean and free of mildew. Set fresh clean water in the vessel on the credence table before any Mass using the Sunday sprinkling rite (GIRM 51, 118c), and pour any remaining blessed water after use into the sacrarium or clean earth."
general_reader = "On Sundays—especially during the fifty days of Easter Time—the priest may bless water during the Introductory Rites and walk down the aisle sprinkling the congregation with this metal bucket and perforated sprinkler (GIRM 51). This shower of blessed water recalls every baptized Christian’s entry into Christ’s death and resurrection."

