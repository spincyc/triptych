locus_1962 = "Missale Romanum (1962), Rubricae Generales 528; Ritus Servandus VII.6--7, VII.10; Ordo Missae 1039"
comparison = "The hand towel (manutergium) prepared with water and basin on the credence table continues directly from the 1962 Roman Missal (RG 528; RS VII.6--7, VII.10). In the postconciliar rite, the priest washes his hands rather than only thumb and forefinger tips, and replaces Psalm 25:6--12 (Lavabo inter innocentes) with the single verse of Psalm 50:4 [51:2] praying for interior cleansing (GIRM 76, 145)."

