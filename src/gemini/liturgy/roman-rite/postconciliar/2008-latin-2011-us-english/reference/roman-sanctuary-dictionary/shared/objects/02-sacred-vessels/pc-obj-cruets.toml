locus_1962 = "Missale Romanum (1962), Rubricae Generales 528; Ritus Servandus VII.4, VII.6, VII.10"
comparison = "Both the 1962 Roman Missal (using Latin ampullae, RG 528) and the 2008/2011 IGMR (using Latin urceoli, GIRM 118c) appoint paired wine and water cruets on the credence table for the Offertory mixing and ablutions. Postconciliar rubrics omit kissing the cruets and signing the water cruet with the cross, and allow the wine to be carried from the nave in the Procession of the Gifts (GIRM 140)."

