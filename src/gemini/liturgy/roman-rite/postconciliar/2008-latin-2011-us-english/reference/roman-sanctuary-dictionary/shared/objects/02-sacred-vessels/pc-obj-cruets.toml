[identification]
summary = "Cruets are paired small stoppered vessels—ordinarily clear glass or metal—that hold the unconsecrated wine and pure water prepared for the Preparation of the Gifts, the handwashing rite, and the purification of sacred vessels."
appearance = "Depicted at top left of Plate VI as two matching clear glass pitchers with looped handles, pouring spouts, and fitted glass stoppers resting on an oval metal tray; Plate I shows them standing ready atop the credence table."
placement_and_use = "Before Mass, the cruets of wine and water are prepared on the credence table (unless the wine is brought forward in the Procession of the Gifts, in which case the water cruet still remains ready on the credence table: GIRM 118c, 140). At the Preparation of the Gifts, the server or instituted acolyte brings the cruets to the deacon or priest at the altar, who pours wine and a few drops of water into the chalice (GIRM 142, 178, 190). After Communion, the server brings the water cruet again so the priest, deacon, or instituted acolyte may purify the paten, chalice, and ciboria (GIRM 163, 279). Because cruets hold unconsecrated elements and are not sacred vessels, clear glass is customary and helpful so ministers tell wine from water at a glance."
liturgical_colors = "Clear glass or noble metal (non-liturgical color)."

[ministers_and_handling]
ordinary_ministers = ["priest", "deacon", "instituted-acolyte", "altar-server"]
prepares = ["sacristan", "altar-server"]
server_boundary = "presents"
server_boundary_summary = "Cruets are core altar-server equipment: servers prepare them cleanly on the credence table, carry them to the altar with stoppers removed and handles turned toward the priest or deacon, return them promptly off the altar mensa (GIRM 306), and bring the water cruet back for vessel purification after Communion."
safety_warning = "Remove glass stoppers safely on the credence table before approaching the altar so stoppers are not dropped on stone steps; never leave cruets sitting on the altar table during the Eucharistic Prayer (GIRM 306)."

[audience_text]
altar_server = "Cruets are among the most frequent items you will handle at Mass. Check before Mass that you know which holds wine and which holds water—clear glass makes this easy. Leave the stoppers safely on the credence tray, carry the cruets steadily to the side of the altar at the Preparation of the Gifts with handles turned toward the priest or deacon (wine first, then water), bow when stepping back, and return them immediately to the credence table. After Communion, bring the water cruet promptly for the priest, deacon, or instituted acolyte to purify the sacred vessels."
sacristan = "Fill the wine cruet with valid natural grape wine (pure, unspoiled, free of foreign substances, CIC can. 924 §3) and the water cruet with fresh clean water, setting both on a small tray on the credence table (GIRM 118c). Keep stoppers clean to guard against dust or insects, and wash glass cruets thoroughly after Mass so no dried wine residue accumulates."
general_reader = "Resting quietly on the side credence table, the small pair of wine and water cruets supplies the unconsecrated wine that becomes Christ's Blood and the water mingled into it before the Eucharistic Prayer—as well as the water used afterward to purify the sacred vessels. Clear glass has long been preferred so the server and priest can distinguish wine from water immediately."

