[symbolism]
has_sourced_symbolism = true
text = "The General Instruction assigns the presidential chair a clear functional sign value: it manifests the priest celebrant's office of presiding over the gathered assembly and directing its prayer, while explicitly excluding any likeness to a royal throne."
evidence_class = "liturgical-source"
attribution = "GIRM 310"

[counterpart_1962]
relationship = "materially changed"
locus_1962 = "Missale Romanum (1962), Ritus Servandus VI.4; Caeremoniale Episcoporum (1948) I.12–13; Fortescue (1943), pp. 8–9"
comparison = "In the 1962 Roman Rite, presbyteral seating consisted of a three-seat bench (sedilia) placed along the Epistle side of the sanctuary solely for sitting during sung chants and lessons while all orations were spoken at the altar. Postconciliar law replaces those lateral seats with a focal single chair from which the priest leads the Introductory Rites, Liturgy of the Word, and Concluding Rites (Inter Oecumenici 92; GIRM 310)."

