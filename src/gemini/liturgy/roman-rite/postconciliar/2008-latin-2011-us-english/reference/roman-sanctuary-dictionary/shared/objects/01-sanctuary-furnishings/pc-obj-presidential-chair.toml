[identification]
summary = "The presidential chair is the single seat appointed for the priest celebrant from which he presides over the liturgical assembly and leads its opening and closing prayers."
appearance = "Shown at bottom left of Plate II as a dignified wooden armchair with an arched paneled high backrest, sturdy armrests, and squared legs, and positioned at rear right in Plate I beside the credence table—clearly superior to server seating yet deliberately devoid of canopy, royal steps, or throne-like ornament."
placement_and_use = "Under universal Roman law, the chair is best set at the head of the sanctuary facing the congregation unless architectural distance or a centrally placed tabernacle behind the altar makes another clear position more suitable (GIRM 310). From this seat the priest conducts the Introductory Rites (including the Collect), listens to the Scripture readings and may preach the homily, leads the Universal Prayer, and concludes Mass with the Prayer after Communion and dismissal (GIRM 124, 127–130, 165–167). The Roman Missal—or, in the United States, the lighter Book of the Chair—and any needed hymnal are prepared beside it (GIRM 118a). In a cathedral church, the diocesan bishop presides from his permanent cathedra rather than a presbyteral chair (Caeremoniale Episcoporum 1984)."
liturgical_colors = "Left in its natural wood or neutral upholstered finish without seasonal color changes."

[ministers_and_handling]
ordinary_ministers = ["priest", "bishop"]
prepares = ["sacristan", "altar-server"]
server_boundary = "clergy-reserved"
server_boundary_summary = "Reserved strictly to the priest celebrant (or bishop when celebrating outside his cathedral); altar servers never sit in the presidential chair and approach it solely to hold the Roman Missal or Book of the Chair during prayers."
safety_warning = ""

[audience_text]
altar_server = "The stately single wooden armchair in the sanctuary belongs exclusively to the presiding priest—servers never sit in it, even before or after Mass. Your main job here as book-bearer is to step cleanly beside or in front of the priest when he stands for the Collect, the conclusion of the Prayer of the Faithful, and the Prayer after Communion, holding the Roman Missal or the lighter Book of the Chair steady at a comfortable reading angle without blocking his view of the congregation."
sacristan = "Before Mass, set the marked Roman Missal—or the official United States Excerpts from the Roman Missal (Book of the Chair)—along with a hymnal or worship aid neatly on a small stand beside the presidential chair (GIRM 118a). Verify that the chair sits cleanly in its appointed place with clear floor space in front for the book-bearer, and keep loose notes, water bottles, or clutter out of sight."
general_reader = "In the postconciliar Roman sanctuary, the priest celebrant presides over the opening prayers, the Liturgy of the Word, and the final blessing from a distinct single chair before moving to the altar for the Liturgy of the Eucharist. Its noble simplicity expresses the priest's spiritual office of leading the assembly in prayer as head of the local gathering, while deliberately avoiding the canopy or trappings of a royal throne."

