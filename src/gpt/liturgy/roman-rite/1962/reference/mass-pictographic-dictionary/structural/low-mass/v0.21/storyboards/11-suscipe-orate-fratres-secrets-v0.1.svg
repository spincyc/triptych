<text x="1224" y="46" text-anchor="middle" class="ser title">11-SUSCIPE-ORATE-FRATRES-SECRETS</text>
<text x="1224" y="80" text-anchor="middle" class="ser h">Suscipe sancta Trinitas, Orate fratres and the Secrets · LM-079A–LM-083A · spoken 1962 Low Mass, two servers</text>
<g transform="translate(30,118)">
<rect width="780" height="480" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-079A</text>
<text x="20" y="52" class="sans s">Suscipe, sancta Trinitas said in a medium body bow</text>
<text x="20" y="74" class="sans s">“Suscipe, sancta Trinitas, hanc oblationem” (low)</text>
<text x="20" y="99" class="sans tiny">priest: standing · bow body-medium · predella-centre · faces altar · eyes downcast ·</text>
<text x="20" y="124" class="sans tiny">joined-at-mensa-edge</text>
<text x="20" y="149" class="sans tiny">→ raise-eyes</text>
<text x="20" y="174" class="sans tiny">→ lower-eyes</text>
<text x="20" y="199" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="249" class="sans tiny">altar-cross @ altar-cross [upright]</text>
<text x="20" y="274" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="299" class="sans tiny">pall @ corporal-back-centre [horizontal]</text>
<text x="20" y="324" class="sans tiny">host @ corporal-front-centre [flat-on-mensa]</text>
<text x="20" y="349" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="374" class="sans tiny">paten @ corporal-right-edge [flat-on-mensa]</text>
<text x="20" y="399" class="sans tiny">purificator @ corporal-right-edge [open-ends-toward-back]</text>
<text x="20" y="424" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="449" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-OBJ-01</text>
</g>
<g transform="translate(834,118)">
<rect width="780" height="480" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-080A</text>
<text x="20" y="52" class="sans s">The altar kiss</text>
<text x="20" y="74" class="sans tiny">priest: bowing-low-over-altar · predella-centre · faces altar · eyes altar ·</text>
<text x="20" y="99" class="sans tiny">palm-on-mensa-outside-corporal</text>
<text x="20" y="124" class="sans tiny">→ altar-kiss</text>
<text x="20" y="149" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="174" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="199" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="224" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="249" class="sans tiny">pall @ corporal-back-centre [horizontal]</text>
<text x="20" y="274" class="sans tiny">host @ corporal-front-centre [flat-on-mensa]</text>
<text x="20" y="299" class="sans tiny">paten @ corporal-right-edge [flat-on-mensa]</text>
<text x="20" y="324" class="sans tiny">purificator @ corporal-right-edge [open-ends-toward-back]</text>
<text x="20" y="349" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="374" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-OBJ-01</text>
</g>
<g transform="translate(1638,118)">
<rect width="780" height="480" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-081A</text>
<text x="20" y="52" class="sans s">Orate, fratres said turned toward the people</text>
<text x="20" y="74" class="sans s">“Orate, fratres” (audible)</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces people · eyes downcast · joined-before-breast</text>
<text x="20" y="124" class="sans tiny">→ turn-right</text>
<text x="20" y="149" class="sans tiny">→ separate-hands</text>
<text x="20" y="174" class="sans tiny">→ join-hands</text>
<text x="20" y="199" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="249" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="274" class="sans tiny">pall @ corporal-back-centre [horizontal]</text>
<text x="20" y="299" class="sans tiny">host @ corporal-front-centre [flat-on-mensa]</text>
<text x="20" y="324" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="349" class="sans tiny">paten @ corporal-right-edge [flat-on-mensa]</text>
<text x="20" y="374" class="sans tiny">purificator @ corporal-right-edge [open-ends-toward-back]</text>
<text x="20" y="399" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="424" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-OBJ-01</text>
</g>
<g transform="translate(30,622)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-081B</text>
<text x="20" y="52" class="sans s">The rightward circle completed back to the altar</text>
<text x="20" y="74" class="sans s">“ut meum ac vestrum sacrificium acceptabile fiat apud Deum Patrem</text>
<text x="20" y="99" class="sans s">omnipotentem” (low)</text>
<text x="20" y="124" class="sans tiny">priest: standing · predella-centre · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="149" class="sans tiny">→ turn-right</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="199" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="249" class="sans tiny">pall @ corporal-back-centre [horizontal]</text>
<text x="20" y="274" class="sans tiny">host @ corporal-front-centre [flat-on-mensa]</text>
<text x="20" y="299" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="324" class="sans tiny">paten @ corporal-right-edge [flat-on-mensa]</text>
<text x="20" y="349" class="sans tiny">purificator @ corporal-right-edge [open-ends-toward-back]</text>
<text x="20" y="374" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="399" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-OBJ-01</text>
</g>
<g transform="translate(834,622)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-082A</text>
<text x="20" y="52" class="sans s">The servers' Suscipiat and the priest's Amen</text>
<text x="20" y="74" class="sans s">“Suscipiat Dominus sacrificium de manibus tuis” (low)</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="124" class="sans tiny">AC1: kneeling-erect · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="149" class="sans tiny">AC2: kneeling-erect · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="174" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="199" class="sans tiny">pall @ corporal-back-centre [horizontal]</text>
<text x="20" y="224" class="sans tiny">host @ corporal-front-centre [flat-on-mensa]</text>
<text x="20" y="249" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="274" class="sans tiny">paten @ corporal-right-edge [flat-on-mensa]</text>
<text x="20" y="299" class="sans tiny">purificator @ corporal-right-edge [open-ends-toward-back]</text>
<text x="20" y="324" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="349" class="sans tiny">AC1: “Suscipiat Dominus sacrificium de manibus tuis ad laudem et gloriam nominis sui, ad</text>
<text x="20" y="374" class="sans tiny">utilitatem quoque nostram, totiusque Ecclesiae suae sanctae.”</text>
<text x="20" y="399" class="sans tiny">AC2: “Suscipiat Dominus sacrificium de manibus tuis ad laudem et gloriam nominis sui, ad</text>
<text x="20" y="424" class="sans tiny">utilitatem quoque nostram, totiusque Ecclesiae suae sanctae.”</text>
<text x="20" y="449" class="sans tiny">priest: “Amen.”</text>
<text x="20" y="474" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="499" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(1638,622)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-083A</text>
