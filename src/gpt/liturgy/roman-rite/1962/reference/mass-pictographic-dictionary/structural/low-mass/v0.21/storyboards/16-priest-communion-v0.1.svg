<svg xmlns="http://www.w3.org/2000/svg" width="2448" height="1481" viewBox="0 0 2448 1481">
<rect width="100%" height="100%" fill="white"/>
<style>
text{fill:#000}.ser{font-family:serif}.sans{font-family:sans-serif}.title{font-size:33px;font-weight:bold}.h{font-size:20px}.s{font-size:15px}.tiny{font-size:12px}.box{fill:#fff;stroke:#000;stroke-width:2}
</style>
<text x="1224" y="46" text-anchor="middle" class="ser title">16-PRIEST-COMMUNION</text>
<text x="1224" y="80" text-anchor="middle" class="ser h">The priest's Communion · LM-134A–LM-135C · spoken 1962 Low Mass, two servers</text>
<g transform="translate(30,118)">
<rect width="780" height="755" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-134A</text>
<text x="20" y="52" class="sans s">The three Communion prayers</text>
<text x="20" y="74" class="sans s">“"Domine Jesu Christe, qui dixisti Apostolis tuis..." / "Domine Jesu Christe,</text>
<text x="20" y="99" class="sans s">Fili Dei vivi..." / "Perceptio Corporis tui..."” (low)</text>
<text x="20" y="124" class="sans tiny">priest: standing · bow body-medium · predella-centre · faces altar · eyes host ·</text>
<text x="20" y="149" class="sans tiny">joined-at-mensa-edge</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="199" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="249" class="sans tiny">paten @ corporal-front-centre [flat-on-mensa]</text>
<text x="20" y="274" class="sans tiny">host-halves @ corporal-front-centre [flat-on-mensa]</text>
<text x="20" y="299" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="324" class="sans tiny">pall @ corporal-back-centre [flat-on-mensa]</text>
<text x="20" y="349" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="374" class="sans tiny">bell @ step-1-epistle</text>
<text x="20" y="399" class="sans tiny">VARIANT [requiem] In a Requiem the first prayer, "Domine Jesu Christe, qui dixisti Apostolis</text>
<text x="20" y="424" class="sans tiny">tuis...", is omitted; the priest says only "Domine Jesu Christe, Fili Dei vivi..." and</text>
<text x="20" y="449" class="sans tiny">"Perceptio Corporis tui...".</text>
<text x="20" y="474" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="499" class="sans tiny">INV-OBJ-01, INV-HAND-01</text>
</g>
<g transform="translate(834,118)">
<rect width="780" height="755" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-134B</text>
<text x="20" y="52" class="sans s">Panem caelestem accipiam</text>
<text x="20" y="74" class="sans s">“Panem caelestem accipiam...” (low)</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces altar · eyes host · L holding-host-and-paten / R</text>
<text x="20" y="124" class="sans tiny">on-altar-outside-corporal</text>
<text x="20" y="149" class="sans tiny">→ genuflect</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="199" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="249" class="sans tiny">paten @ In the priest's left hand, held behind the Host halves above the corporal.</text>
<text x="20" y="274" class="sans tiny">[nearly-horizontal] — by priest</text>
<text x="20" y="299" class="sans tiny">host-halves @ In the priest's left hand, before the paten and above the corporal.</text>
<text x="20" y="324" class="sans tiny">[nearly-horizontal] — by priest</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">pall @ corporal-back-centre [flat-on-mensa]</text>
<text x="20" y="399" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="424" class="sans tiny">bell @ step-1-epistle</text>
<text x="20" y="449" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="474" class="sans tiny">INV-OBJ-01, INV-HAND-01</text>
</g>
<g transform="translate(1638,118)">
<rect width="780" height="755" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-134C</text>
<text x="20" y="52" class="sans s">Domine, non sum dignus three times, with three rings</text>
<text x="20" y="74" class="sans s">“Domine, non sum dignus...” (audible)</text>
<text x="20" y="99" class="sans tiny">priest: standing · bow body-medium · predella-centre · faces altar · eyes host · L</text>
<text x="20" y="124" class="sans tiny">holding-host-and-paten / R striking-breast</text>
<text x="20" y="149" class="sans tiny">→ strike-breast</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · L joined-before-breast / R</text>
<text x="20" y="199" class="sans tiny">holding-bell</text>
<text x="20" y="224" class="sans tiny">→ ring-bell</text>
<text x="20" y="249" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="274" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="299" class="sans tiny">paten @ In the priest's left hand, held behind the Host halves above the corporal.</text>
<text x="20" y="324" class="sans tiny">[nearly-horizontal] — by priest</text>
<text x="20" y="349" class="sans tiny">host-halves @ In the priest's left hand, before the paten and above the corporal.</text>
<text x="20" y="374" class="sans tiny">[nearly-horizontal] — by priest</text>
<text x="20" y="399" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="424" class="sans tiny">pall @ corporal-back-centre [flat-on-mensa]</text>
<text x="20" y="449" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="474" class="sans tiny">bell @ step-1-epistle — by AC1</text>
<text x="20" y="499" class="sans s">BELL AC1 ×1 — The first priestly opening of "Domine, non sum dignus", said</text>
<text x="20" y="524" class="sans s">aloud.</text>
<text x="20" y="549" class="sans s">BELL AC1 ×1 — The second priestly opening of "Domine, non sum dignus", said</text>
<text x="20" y="574" class="sans s">aloud.</text>
<text x="20" y="599" class="sans s">BELL AC1 ×1 — The third priestly opening of "Domine, non sum dignus", said</text>
<text x="20" y="624" class="sans s">aloud.</text>
<text x="20" y="649" class="sans tiny">UNRESOLVED: The approved material does not fix the moment at which AC1 takes up the bell before</text>
<text x="20" y="674" class="sans tiny">the first "Domine, non sum dignus".</text>
<text x="20" y="699" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="724" class="sans tiny">INV-OBJ-01, INV-HAND-01, INV-BELL-02</text>
</g>
<g transform="translate(30,897)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-135A</text>
<text x="20" y="52" class="sans s">The priest receives the Sacred Host</text>
<text x="20" y="74" class="sans s">“Corpus Domini...” (low)</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces altar · eyes downcast · joined-at-chin-height</text>
<text x="20" y="124" class="sans tiny">→ cross-with-host</text>
<text x="20" y="149" class="sans tiny">→ consume-host</text>
<text x="20" y="174" class="sans tiny">→ rub-fingers-over-paten</text>
<text x="20" y="199" class="sans tiny">→ join-hands</text>
<text x="20" y="224" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="249" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="274" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="299" class="sans tiny">host-halves @ Consumed; no longer present on the altar. — by priest</text>
<text x="20" y="324" class="sans tiny">paten @ corporal-right-edge [flat-on-mensa] — by priest</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">pall @ corporal-back-centre [flat-on-mensa]</text>
<text x="20" y="399" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="424" class="sans tiny">bell @ step-1-epistle — by AC1</text>
<text x="20" y="449" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="474" class="sans tiny">INV-OBJ-01, INV-HAND-01</text>
</g>
<g transform="translate(834,897)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-135B</text>
<text x="20" y="52" class="sans s">Quid retribuam and the collection of the fragments</text>
<text x="20" y="74" class="sans s">“Quid retribuam Domino” (low)</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces altar · eyes paten · L holding-paten / R</text>
<text x="20" y="124" class="sans tiny">palm-on-corporal</text>
<text x="20" y="149" class="sans tiny">→ remove-pall</text>
<text x="20" y="174" class="sans tiny">→ genuflect</text>
<text x="20" y="199" class="sans tiny">→ purify-paten</text>
<text x="20" y="224" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="249" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="274" class="sans tiny">corporal @ mensa-centre [unfolded] — by priest</text>
<text x="20" y="299" class="sans tiny">pall @ mensa-epistle [flat-on-mensa] — by priest</text>
<text x="20" y="324" class="sans tiny">chalice @ corporal-back-centre [upright] — by priest</text>
<text x="20" y="349" class="sans tiny">paten @ In the priest's left hand, resting on the corporal. [nearly-horizontal] — by priest</text>
<text x="20" y="374" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="399" class="sans tiny">bell @ step-1-epistle</text>
<text x="20" y="424" class="sans tiny">UNRESOLVED: The approved material does not fix where the pall is laid when the chalice is</text>
<text x="20" y="449" class="sans tiny">uncovered; the corpus places it on the mensa toward the Epistle side.</text>
<text x="20" y="474" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="499" class="sans tiny">INV-OBJ-01, INV-HAND-01</text>
</g>
<g transform="translate(1638,897)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-135C</text>
<text x="20" y="52" class="sans s">The priest receives the Precious Blood</text>
<text x="20" y="74" class="sans s">“Calicem salutaris... / Sanguis Domini...” (low)</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces altar · eyes chalice · L palm-on-corporal / R</text>
<text x="20" y="124" class="sans tiny">holding-chalice-node</text>
<text x="20" y="149" class="sans tiny">→ cross-with-chalice</text>
<text x="20" y="174" class="sans tiny">→ consume-precious-blood</text>
<text x="20" y="199" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="249" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="274" class="sans tiny">chalice @ mensa-epistle [upright] — by priest</text>
<text x="20" y="299" class="sans tiny">paten @ corporal-front-centre [flat-on-mensa] — by priest</text>
<text x="20" y="324" class="sans tiny">pall @ mensa-epistle [flat-on-mensa]</text>
<text x="20" y="349" class="sans tiny">missal @ mensa-gospel [priest-reads-facing-left]</text>
<text x="20" y="374" class="sans tiny">bell @ step-1-epistle</text>
<text x="20" y="399" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="424" class="sans tiny">INV-OBJ-01, INV-HAND-01</text>
</g>
</svg>
