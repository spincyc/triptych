    notes: >-
      INV-GLORIA-01 governs the whole Gloria block. The Gloria in excelsis is
      said STANDING AT THE CENTRE of the altar with the feet fixed there, and
      never at the Missal. The approved opening gesture is a sequence - extend
      the hands, elevate them, rejoin them - of which this scene holds the
      extension and the elevation; the rejoining falls with the bow at 'Deo' in
      LM-022B. 'Gloria' unqualified is the Gloria in excelsis, this hymn, and
      not the Introit doxology of LM-019A.

