      note: >-
        The priest at the Epistle-side Missal with hands extended before him in
        the orans position, eyes on the book; both servers kneeling and level
        with one another on the lowest step.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-epistle-corner
        side: epistle
        depth_rank: 4
        posture: standing
        bow: none
        facing: missal
        gaze: missal
        hands: {joined: false, left: extended, right: extended}
        gestures:
          - extend-hands
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 2
        posture: kneeling
        bow: none
        facing: altar-cross
        gaze: cross
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 2
        posture: kneeling
        bow: none
        facing: altar-cross
        gaze: cross
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: missal
        placement: mensa-epistle
        orientation: priest-reads-facing-left
        state_before: "Open on the Epistle side at the Collect."
        state_after: "Open on the Epistle side; it stays there for the Epistle and is not moved in this section."
        handled_by: none
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: chalice
        placement: corporal-back-centre
        orientation: not-applicable
        state_before: "Empty and veiled on the corporal."
        state_after: "Empty and veiled on the corporal."
        handled_by: none
      - id: burse
        placement: mensa-gospel
        orientation: not-applicable
        state_before: "Empty, on the Gospel side."
        state_after: "Empty, on the Gospel side."
        handled_by: none
    transitions:
      - "The priest extends his hands and says the Collect from the Missal."
      - "Where more than one Collect is said, each is said in the same manner with the hands extended."
      - "The servers answer 'Amen' from their kneeling places at the end of each Collect."
    responses:
      - actor: AC1
        text: "Amen."
        voice: audible
      - actor: AC2
        text: "Amen."
        voice: audible
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
    variants: []
    unresolved:
      - "The number of Collects said depends on the commemorations of the day and is not fixed by the approved record."
    notes: >-
      No text_cue is given because the Collect is proper to the Mass. The
      Missal stays open on the Epistle side through this whole section, in the
      orientation in which the priest reads it turned toward his left; the
      transfer to the Gospel side belongs to a later section and to AC1 alone.
