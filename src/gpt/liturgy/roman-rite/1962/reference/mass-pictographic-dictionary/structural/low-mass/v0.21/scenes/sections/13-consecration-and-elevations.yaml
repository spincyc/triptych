    notes: >-
      The elevation carries ONE ring, not three. Under INV-BELL-01 the spoken
      Low Mass baseline gives one ring at the first genuflection, one ring here
      at the elevation, and one ring at the second genuflection; three rings
      concentrated at the elevation is the rejected baseline and must never be
      drawn or encoded. Both servers lift the chasuble ONLY SLIGHTLY: the
      underside of the chasuble is not exposed. AC1 lifts with his LEFT hand
      because the bell is in his RIGHT; AC2, on the Gospel side, lifts with his
      RIGHT hand. The priest's thumb and index fingertips stay joined except as
      the Host itself requires (INV-HAND-01).
