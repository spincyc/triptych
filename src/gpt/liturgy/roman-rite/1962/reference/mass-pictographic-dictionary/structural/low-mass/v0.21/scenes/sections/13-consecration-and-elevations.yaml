scenes:
  - scene_id: "LM-096A"
    order: 132
    cluster: "LM-096"
    title: "The servers ascend and kneel beside the priest"
    kind: transition
    liturgical_moment: "The Canon: the servers take their places for the Consecration"
    voice: secret
    condition: "ALWAYS"
    predecessor: "LM-095D"
    successor: "LM-097A"
    camera:
      view: nave-front
      note: >-
        The predella carries all three figures. The priest stands at the centre;
        AC1 kneels on the Epistle side and AC2 on the Gospel side, one on each
        side of him and slightly behind him, both at the same depth as one
        another. A true side orthographic view collapses AC1 and AC2 onto one
        another, and that is correct: they are never displaced into a
        front/back arrangement to make both visible.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: none
        facing: altar
        gaze: host
        hands: {joined: false, left: holding-host, right: holding-host}
        gestures: []
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: predella-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling-erect
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: false, left: on-breast, right: holding-bell}
        gestures: [ascend]
        path:
          from: step-1-epistle
          to: predella-epistle
          note: >-
            AC1 rises from his ordinary kneeling place on the lowest step,
            ascends on the Epistle side carrying the bell, and kneels on the
            predella at the priest's Epistle side, slightly behind him.
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: predella-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling-erect
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: [ascend]
        path:
          from: step-1-gospel
          to: predella-gospel
          note: >-
            AC2 rises from his ordinary kneeling place on the lowest step,
            ascends on the Gospel side, and kneels on the predella at the
            priest's Gospel side, slightly behind him.
    objects:
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: host
        placement: "Held between the thumb and index finger of both of the priest's hands, just above the front-centre fold of the corporal."
        orientation: horizontal
        state_before: "Unconsecrated, blessed at benedixit, held between the thumb and index finger of both of the priest's hands."
        state_after: "Unconsecrated, still held between both thumb and index pairs; the priest is stopped immediately before the words of Consecration."
        handled_by: priest
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Standing on the back-centre fold of the corporal, holding the wine and water, covered with the pall."
        state_after: "Standing on the back-centre fold of the corporal, holding the wine and water, covered with the pall."
        handled_by: none
      - id: pall
        placement: "Lying flat on the mouth of the chalice."
        orientation: horizontal
        state_before: "Covering the chalice."
        state_after: "Covering the chalice."
        handled_by: none
      - id: paten
        placement: corporal-right-edge
        orientation: horizontal
        state_before: "Halfway under the right edge of the corporal, toward the Epistle side, with the purificator laid on its exposed half."
        state_after: "Halfway under the right edge of the corporal, with the purificator laid on its exposed half."
        handled_by: none
      - id: purificator
        placement: corporal-right-edge
        orientation: open-ends-toward-back
        state_before: "Lying on the exposed half of the paten, open ends toward the back."
        state_after: "Lying on the exposed half of the paten, open ends toward the back."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open at the Canon on the Gospel side, near the centre and left of the corporal, oriented so that the priest reading it is turned toward his left."
        state_after: "Open at the Canon on the Gospel side, unmoved."
        handled_by: none
      - id: bell
        placement: "Carried up from the lowest step and held in AC1's right hand on the predella, Epistle side."
        orientation: upright
        state_before: "In AC1's right hand at his ordinary kneeling place on the lowest step, silent since the warning cue."
        state_after: "In AC1's right hand on the predella, silent."
        handled_by: AC1
      - id: chasuble
        placement: "On the priest."
        orientation: not-applicable
        state_before: "Hanging free."
        state_after: "Hanging free; no server has yet touched it."
        handled_by: none
    transitions:
      - "The priest, having blessed the Host at benedixit, stands at the centre of the predella holding the Host between the thumb and index finger of both hands, stopped immediately before the words of Consecration."
      - "Both acolytes rise from the lowest step; AC1 takes the bell in his right hand."
      - "Both ascend to the predella, AC1 on the Epistle side and AC2 on the Gospel side."
      - "They kneel one on each side of the priest, slightly behind him: AC1 remains the Epistle-side server and AC2 the Gospel-side server."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-ROLE-01
      - INV-BELL-01
      - INV-MISSAL-01
      - INV-OBJ-01
    variants: []
    unresolved:
      - "Whether the servers make any reverence as they leave the lowest step and ascend to the predella is not fixed by the approved record."
      - "The resting position of AC1's free left hand between the bell rings is not fixed by the approved record; it is depicted at his breast."
    notes: >-
      This is a side-by-side arrangement, not a front/back one. The servers
      kneel ONE ON EACH SIDE of the priest and slightly behind him, AC1 on the
      Epistle side and AC2 on the Gospel side; they are at the same depth as
      one another and are given a depth_rank one greater than the priest's
      solely to record that they kneel slightly behind him. Under INV-GEO-03
      they must never be redrawn into a front/back arrangement to make both
      figures individually visible. The move is triggered by the warning cue
      shortly before the Consecration, which is a separate bell action
      belonging to LM-094B and is not repeated here. AC1 holds the bell in his
      RIGHT hand; his LEFT hand is the one that will take the chasuble at the
      elevations.
