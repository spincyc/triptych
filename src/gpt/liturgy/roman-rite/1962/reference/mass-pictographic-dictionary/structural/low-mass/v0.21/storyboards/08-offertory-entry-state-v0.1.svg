<text x="1224" y="46" text-anchor="middle" class="ser title">08-OFFERTORY-ENTRY-STATE</text>
<text x="1224" y="80" text-anchor="middle" class="ser h">Offertory entry object state · LM-054A–LM-054A · spoken 1962 Low Mass, two servers</text>
<g transform="translate(30,118)">
<rect width="780" height="455" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-054A</text>
<text x="20" y="52" class="sans s">The object state at the entry to the Offertory</text>
<text x="20" y="74" class="sans tiny">priest: standing · predella-centre · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="99" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="124" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="149" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="174" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="199" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="224" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="249" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="274" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="299" class="sans tiny">purificator @ corporal-back-centre [folded]</text>
<text x="20" y="324" class="sans tiny">paten @ corporal-back-centre [horizontal]</text>
<text x="20" y="349" class="sans tiny">host @ corporal-back-centre [horizontal]</text>
<text x="20" y="374" class="sans tiny">pall @ corporal-back-centre [horizontal]</text>
<text x="20" y="399" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="424" class="sans tiny">INV-OBJ-01</text>
</g>
</svg>
