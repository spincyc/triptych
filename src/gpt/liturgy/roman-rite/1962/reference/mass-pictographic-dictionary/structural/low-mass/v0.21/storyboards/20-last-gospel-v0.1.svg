<svg xmlns="http://www.w3.org/2000/svg" width="2448" height="1177" viewBox="0 0 2448 1177">
<rect width="100%" height="100%" fill="white"/>
<style>
text{fill:#000}.ser{font-family:serif}.sans{font-family:sans-serif}.title{font-size:33px;font-weight:bold}.h{font-size:20px}.s{font-size:15px}.tiny{font-size:12px}.box{fill:#fff;stroke:#000;stroke-width:2}
</style>
<text x="1224" y="46" text-anchor="middle" class="ser title">20-LAST-GOSPEL</text>
<text x="1224" y="80" text-anchor="middle" class="ser h">The Last Gospel · LM-139A–LM-139B · spoken 1962 Low Mass, two servers</text>
<g transform="translate(30,118)">
<rect width="780" height="1005" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-139A</text>
<text x="20" y="52" class="sans s">The Last Gospel begun at the Gospel corner</text>
<text x="20" y="74" class="sans s">“Dominus vobiscum - Initium sancti Evangelii secundum Joannem - In principio</text>
<text x="20" y="99" class="sans s">erat Verbum” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: standing · predella-gospel-corner · faces last-gospel-card · eyes altar · L</text>
<text x="20" y="149" class="sans tiny">on-altar-outside-corporal / R signing</text>
<text x="20" y="174" class="sans tiny">→ sign-text-with-thumb</text>
<text x="20" y="199" class="sans tiny">→ small-cross-forehead</text>
<text x="20" y="224" class="sans tiny">→ small-cross-lips</text>
<text x="20" y="249" class="sans tiny">→ small-cross-breast</text>
<text x="20" y="274" class="sans tiny">AC1: standing · plano-epistle · faces altar · eyes altar · L at-side / R signing</text>
<text x="20" y="299" class="sans tiny">→ small-cross-forehead</text>
<text x="20" y="324" class="sans tiny">→ small-cross-lips</text>
<text x="20" y="349" class="sans tiny">→ small-cross-breast</text>
<text x="20" y="374" class="sans tiny">AC2: standing · plano-gospel · faces altar · eyes altar · L at-side / R signing</text>
<text x="20" y="399" class="sans tiny">→ small-cross-forehead</text>
<text x="20" y="424" class="sans tiny">→ small-cross-lips</text>
<text x="20" y="449" class="sans tiny">→ small-cross-breast</text>
<text x="20" y="474" class="sans tiny">last-gospel-card @ mensa-gospel-corner [upright]</text>
<text x="20" y="499" class="sans tiny">missal @ mensa-epistle-corner [priest-reads-facing-left]</text>
<text x="20" y="524" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="549" class="sans tiny">AC1: “Et cum spiritu tuo”</text>
<text x="20" y="574" class="sans tiny">AC2: “Et cum spiritu tuo”</text>
<text x="20" y="599" class="sans tiny">AC1: “Gloria tibi, Domine”</text>
<text x="20" y="624" class="sans tiny">AC2: “Gloria tibi, Domine”</text>
<text x="20" y="649" class="sans tiny">VARIANT [seasonal] A Mass with a proper Last Gospel rather than John 1:1-14, as on Palm Sunday</text>
<text x="20" y="674" class="sans tiny">when the Mass does not follow the blessing of palms.</text>
<text x="20" y="699" class="sans tiny">VARIANT [seasonal] The Last Gospel is omitted entirely at the third Mass of Christmas and at the</text>
<text x="20" y="724" class="sans tiny">Easter Vigil Mass, and after 'Benedicamus Domino' when an incompatible function immediately</text>
<text x="20" y="749" class="sans tiny">follows the Mass.</text>
<text x="20" y="774" class="sans tiny">VARIANT [requiem] At a Requiem followed by the absolution over the catafalque the Last Gospel is</text>
<text x="20" y="799" class="sans tiny">omitted. A Requiem not followed by the absolution keeps it.</text>
<text x="20" y="824" class="sans tiny">UNRESOLVED: Whether the servers stand on the lowest altar step or on the sanctuary floor in</text>
<text x="20" y="849" class="sans tiny">plano for the Last Gospel is not fixed by the approved record.</text>
<text x="20" y="874" class="sans tiny">UNRESOLVED: Whether a proper Last Gospel is read from the Missal rather than from the Last</text>
<text x="20" y="899" class="sans tiny">Gospel card, and how the Missal would reach the Gospel side for it, is not fixed by the approved</text>
<text x="20" y="924" class="sans tiny">record.</text>
<text x="20" y="949" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="974" class="sans tiny">INV-NAME-01, INV-OBJ-01</text>
</g>
<g transform="translate(834,118)">
<rect width="780" height="1005" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-139B</text>
<text x="20" y="52" class="sans s">Et Verbum caro factum est: all genuflect</text>
<text x="20" y="74" class="sans s">“Et Verbum caro factum est” (audible)</text>
<text x="20" y="99" class="sans tiny">priest: genuflecting · predella-gospel-corner · faces last-gospel-card · eyes altar ·</text>
<text x="20" y="124" class="sans tiny">on-altar-outside-corporal</text>
<text x="20" y="149" class="sans tiny">→ genuflect</text>
<text x="20" y="174" class="sans tiny">AC1: genuflecting · plano-epistle · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="199" class="sans tiny">→ genuflect</text>
<text x="20" y="224" class="sans tiny">path plano-epistle → plano-centre</text>
<text x="20" y="249" class="sans tiny">AC2: genuflecting · plano-gospel · faces altar · eyes altar · joined-before-breast</text>
<text x="20" y="274" class="sans tiny">→ genuflect</text>
<text x="20" y="299" class="sans tiny">path plano-gospel → plano-centre</text>
<text x="20" y="324" class="sans tiny">last-gospel-card @ mensa-gospel-corner [upright]</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">missal @ mensa-epistle-corner [priest-reads-facing-left]</text>
<text x="20" y="399" class="sans tiny">AC1: “Deo gratias”</text>
<text x="20" y="424" class="sans tiny">AC2: “Deo gratias”</text>
<text x="20" y="449" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-ROLE-01, INV-OBJ-01</text>
</g>
</svg>
