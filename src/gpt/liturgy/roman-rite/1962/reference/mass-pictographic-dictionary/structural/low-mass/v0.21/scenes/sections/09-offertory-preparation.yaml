    liturgical_moment: "The Offertory: the unveiling of the chalice"
    voice: none
    condition: "ALWAYS"
    predecessor: "LM-054A"
    successor: "LM-056A"
    camera:
      view: nave-front
      note: >-
        The priest stands at the centre of the predella; AC1 has come up on the
        Epistle side and takes the veil across. AC2 is still kneeling on the
        Gospel side and has not yet moved.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 3
        posture: standing
        bow: none
        facing: epistle-side
        gaze: hands
        hands: {joined: false, left: holding-veil, right: holding-veil}
        gestures: []
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-3-epistle
        side: epistle
        depth_rank: 2
        posture: standing
        bow: none
        facing: inward-to-priest
        gaze: inward-to-priest
        hands: {joined: false, left: holding-veil, right: holding-veil}
        gestures: []
        path:
          from: step-1-epistle
          to: step-3-epistle
          note: >-
            AC1 rises from his ordinary kneeling place and approaches the
            Epistle side of the altar to receive the veil.
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: chalice-veil
        placement: "in the priest's two hands, passing across to AC1 on the Epistle side"
        orientation: not-applicable
        state_before: "Covering the whole chalice stack at the centre of the corporal."
        state_after: "Lifted clear with both hands and given into AC1's two hands; not yet folded."
        handled_by: priest
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Empty and veiled, standing on the back-centre fold of the corporal under the purificator, paten with the Host, and pall."
        state_after: "Empty and now unveiled, standing on the back-centre fold of the corporal, still bearing the purificator, the paten with the Host, and the pall."
        handled_by: none
      - id: purificator
        placement: corporal-back-centre
        orientation: not-applicable
        state_before: "Spread over the mouth of the chalice cup, under the paten."
        state_after: "Spread over the mouth of the chalice cup, under the paten, now uncovered by the veil."
        handled_by: none
      - id: paten
        placement: corporal-back-centre
        orientation: horizontal
        state_before: "Resting on the purificator above the chalice cup, bearing the Host."
        state_after: "Resting on the purificator above the chalice cup, bearing the Host, under the pall."
        handled_by: none
      - id: host
        placement: corporal-back-centre
        orientation: flat-on-mensa
        state_before: "Lying on the paten at the top of the chalice stack."
        state_after: "Lying on the paten at the top of the chalice stack."
        handled_by: none
      - id: pall
        placement: corporal-back-centre
        orientation: flat-on-mensa
        state_before: "Lying flat over the paten at the top of the chalice stack."
        state_after: "Lying flat over the paten, now exposed by the removal of the veil."
        handled_by: none
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar since the beginning of Mass."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: burse
        placement: mensa-gospel
        orientation: not-applicable
        state_before: "Empty, on the Gospel side."
        state_after: "Empty, on the Gospel side."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open near the centre, to the left of the corporal, where the Offertory antiphon has just been read."
        state_after: "Open near the centre, to the left of the corporal."
        handled_by: none
    transitions:
      - "The priest takes the chalice veil in both hands and lifts it clear of the chalice stack."
      - "He turns slightly toward the Epistle side and hands the veil across."
      - "AC1, having risen from his kneeling place, has come up on the Epistle side and receives the veil in both hands."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
    variants: []
    unresolved:
      - "The exact level at which AC1 stands on the Epistle side to receive the veil is not fixed by the approved record."
    notes: >-
      Depth ranks are assigned consistently across this section by anchor
      depth: predella 1, step-3 2, credence 3, step-1 4, plano 5. The corporal
      is already unfolded and is not unfolded here or anywhere in the
      Offertory. The veil is removed with both hands; no single-handed
      unveiling is depicted.

