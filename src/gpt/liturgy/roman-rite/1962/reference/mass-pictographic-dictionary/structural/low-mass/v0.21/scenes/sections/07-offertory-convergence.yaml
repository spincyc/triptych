provenance: repository-recovery-from-approved-baseline
section:
  id: "07-offertory-convergence"
  title: "Convergence into the Offertory"
authority:
  - "../../handoff/HANDOFF-SUMMARY.md"
  - "../../recovery/approved-choreography-baseline.md"

scenes:
  - scene_id: "LM-050A"
    order: 70
    cluster: "LM-050"
    title: "The altar kiss at the centre"
    kind: action
    liturgical_moment: "Convergence into the Offertory"
    voice: none
    condition: "ALWAYS"
    predecessor: "LM-049A"
    successor: "LM-051A"
    camera:
      view: nave-front
      note: >-
        Both branches meet here. The priest is at the centre of the predella,
        bowed low over the altar with both palms flat on the mensa outside the
        corporal, kissing the altar. Both servers are kneeling on the lowest
        step and do nothing.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: bowing-low-over-altar
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: false, left: on-altar-outside-corporal, right: on-altar-outside-corporal}
        gestures: [altar-kiss, join-hands]
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar-cross
        gaze: cross
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar-cross
        gaze: cross
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: missal
        placement: mensa-centre
        orientation: priest-reads-facing-left
        state_before: "Open, near the centre just left of the corporal, where it was moved with its stand after the Gospel."
        state_after: "Open, near the centre just left of the corporal."
        handled_by: none
      - id: missal-stand
        placement: mensa-centre
        orientation: not-applicable
        state_before: "Near the centre, just left of the corporal, carrying the open Missal."
        state_after: "Near the centre, just left of the corporal."
        handled_by: none
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar since the beginning of Mass."
        state_after: "Unfolded at the centre of the altar; the priest's palms rest on the mensa outside it, never upon it."
        handled_by: none
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Empty and veiled on the corporal."
        state_after: "Empty and veiled on the corporal."
        handled_by: none
      - id: chalice-veil
        placement: corporal-back-centre
        orientation: not-applicable
        state_before: "Covering the chalice and the stack upon it."
        state_after: "Covering the chalice and the stack upon it."
        handled_by: none
      - id: burse
        placement: mensa-gospel
        orientation: not-applicable
        state_before: "Empty, on the Gospel side."
        state_after: "Empty, on the Gospel side."
        handled_by: none
    transitions:
      - "The priest places both hands on the altar outside the corporal."
      - "He kisses the altar."
      - "He stands erect."
      - "He joins his hands."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
    variants: []
    unresolved: []
    notes: >-
      This is the convergence: the Credo branch and the no-Credo branch both
      reach this scene. Its predecessor on the default path is LM-049A, the
      last Credo scene; when the Credo is not prescribed the order arrives here
      from LM-043A by that scene's bypass_successor, which belongs to the
      Gospel section and is not set here. The inclination of the kiss is
      carried by the posture bowing-low-over-altar; the bow field records only
      prescribed head and body bows and is therefore none. The depicted
      instant is the kiss; by the end of the scene the priest is erect again
      with his hands joined, which is the state LM-051A opens in. The hands
      rest on the mensa outside the corporal and never on the corporal itself.
