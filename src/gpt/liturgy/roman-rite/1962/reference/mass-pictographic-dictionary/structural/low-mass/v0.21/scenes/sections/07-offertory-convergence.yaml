        gestures: []
    objects:
      - id: missal
        placement: mensa-centre
        orientation: priest-reads-facing-left
        state_before: "Open, near the centre just left of the corporal."
        state_after: "Open, near the centre just left of the corporal."
        handled_by: none
      - id: missal-stand
        placement: mensa-centre
        orientation: not-applicable
        state_before: "Near the centre, just left of the corporal."
        state_after: "Near the centre, just left of the corporal."
        handled_by: none
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Empty and veiled on the corporal."
        state_after: "Empty and veiled on the corporal."
        handled_by: none
      - id: chalice-veil
        placement: corporal-back-centre
        orientation: not-applicable
        state_before: "Covering the chalice and the stack upon it."
        state_after: "Covering the chalice and the stack upon it."
        handled_by: none
      - id: burse
        placement: mensa-gospel
        orientation: not-applicable
        state_before: "Empty, on the Gospel side."
        state_after: "Empty, on the Gospel side."
        handled_by: none
    transitions:
      - "With hands joined, the priest turns by his right, toward the Epistle side, to face the people."
      - "He separates his hands WITHOUT elevating them and says \"Dominus vobiscum\"."
      - "He rejoins his hands while saying it."
    responses:
      - actor: AC1
        text: "Et cum spiritu tuo"
        voice: audible
      - actor: AC2
        text: "Et cum spiritu tuo"
        voice: audible
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
    variants: []
    unresolved:
      - "The approved record does not restate the downcast eyes at this 'Dominus vobiscum'; it fixes them at the identically described turn to the people before the Collect, and 'downcast' is recorded here on that basis alone."
      - "The approved record does not state whether the servers turn their heads toward the priest at this 'Dominus vobiscum'; it records no change to their kneeling orientation, so none is drawn."
    notes: >-
      The separation of the hands here is emphatically WITHOUT elevation: the
      hands part at breast height and are rejoined while the words are said.
      The priest's feet do not leave the centre of the predella; he pivots in
      place. The turn is by his right, i.e. toward the Epistle side, which is
      viewer right in the canonical nave-facing view. The servers' response
      "Et cum spiritu tuo" is the invariable response of the rite and is
      recorded in the approved baseline in that form at the Pax Domini; the
      baseline names only the priest's words at this point.
