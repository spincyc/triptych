        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: none
        facing: people
        gaze: downcast
        hands: {joined: false, left: extended, right: extended}
        gestures: [turn-right, separate-hands, join-hands]
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar-cross
        gaze: cross
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
