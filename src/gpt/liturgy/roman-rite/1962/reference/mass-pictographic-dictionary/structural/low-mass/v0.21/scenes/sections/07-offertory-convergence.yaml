      - INV-ROLE-01
      - INV-OBJ-01
    variants: []
    unresolved:
      - "The approved record prescribes no bow for the servers at this 'Oremus'; they are therefore drawn kneeling and unbowed."
    notes: >-
      The return is by the priest's left, completing the pivot begun in
      LM-051A; his feet have not left the centre of the predella throughout.
      The separation and rejoining of the hands at "Oremus" is a distinct
      gesture from the one at "Dominus vobiscum" and is accompanied here by a
      profound head bow toward the cross, which the "Dominus vobiscum" is not.
      The depicted instant is the bow, with the hands already rejoined.
