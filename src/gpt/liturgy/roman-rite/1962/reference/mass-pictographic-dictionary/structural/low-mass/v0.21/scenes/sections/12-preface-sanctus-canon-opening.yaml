    voice: audible
    condition: "ALWAYS"
    predecessor: "LM-083A"
    successor: "LM-085A"
    camera:
      view: nave-front
      note: >-
        The priest stands at the centre of the predella with his hands joined
        before his breast. He does not turn to the people at this "Dominus
        vobiscum". Both servers are kneeling on the lowest altar step in their
        ordinary places.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: none
        facing: altar
        gaze: missal
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open at the end of the Secrets, standing on the Gospel side of the mensa near the centre-left of the corporal since the Gospel."
        state_after: "Open at the Preface dialogue, unmoved."
        handled_by: none
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar since the beginning of Mass."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: host
        placement: corporal-front-centre
        orientation: flat-on-mensa
        state_before: "Unconsecrated, lying on the front-centre fold of the corporal since the offering of the Host."
        state_after: "Unconsecrated, lying on the front-centre fold of the corporal."
        handled_by: none
      - id: paten
        placement: corporal-right-edge
        orientation: horizontal
        state_before: "Halfway under the right edge of the corporal, its exposed half toward the Epistle side."
        state_after: "Unmoved, halfway under the right edge of the corporal."
        handled_by: none
      - id: purificator
        placement: corporal-right-edge
        orientation: open-ends-toward-back
        state_before: "Lying on the exposed half of the paten, open ends toward the back."
        state_after: "Unmoved on the exposed half of the paten."
        handled_by: none
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Standing on the back-centre fold of the corporal, charged with wine and water and covered by the pall."
        state_after: "Standing covered on the back-centre fold of the corporal."
        handled_by: none
      - id: pall
        placement: "On the cup of the chalice."
        orientation: horizontal
        state_before: "Covering the cup of the chalice."
        state_after: "Covering the cup of the chalice."
        handled_by: none
      - id: altar-cross
        placement: altar-cross
        orientation: upright
        state_before: "Standing at the centre of the altar."
        state_after: "Standing at the centre of the altar."
        handled_by: none
      - id: bell
        placement: step-1-epistle
        orientation: upright
        state_before: "On the lowest altar step at AC1's right hand, silent."
        state_after: "Silent, untouched."
        handled_by: none
    transitions:
      - "The priest concludes the last Secret and says 'Per omnia saecula saeculorum' aloud, his hands joined before his breast."
      - "Both servers answer 'Amen' together, kneeling."
      - "The priest says 'Dominus vobiscum' aloud, still facing the altar and not turning to the people."
      - "Both servers answer 'Et cum spiritu tuo' together, kneeling."
    responses:
      - actor: AC1
        text: "Amen."
        voice: audible
      - actor: AC2
        text: "Amen."
        voice: audible
      - actor: AC1
        text: "Et cum spiritu tuo."
        voice: audible
      - actor: AC2
        text: "Et cum spiritu tuo."
        voice: audible
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
    variants: []
    unresolved: []
    notes: >-
      Both responses are made by AC1 and AC2 together; they are listed once per
      server only because a response record names a single actor. The approved
      record fixes no hand movement at this "Dominus vobiscum": the first hand
      movement it fixes in the dialogue is the raising of the hands at "Sursum
      corda".

