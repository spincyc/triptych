  - scene_id: "LM-087A"
    order: 116
    cluster: "LM-087"
    title: "Sanctus: the priest's medium body bow"
    kind: action
    liturgical_moment: "The Sanctus"
    text_cue: "Sanctus, Sanctus, Sanctus, Dominus Deus Sabaoth."
    voice: audible
    condition: "ALWAYS"
    predecessor: "LM-086A"
    successor: "LM-087B"
    camera:
      view: nave-front
      note: >-
        The bow must read as a medium bow of the body, and the joined hands must
        read as held before the breast and clear of the altar. Do not rest them
