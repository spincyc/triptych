<svg xmlns="http://www.w3.org/2000/svg" width="2448" height="1206" viewBox="0 0 2448 1206">
<rect width="100%" height="100%" fill="white"/>
<style>
text{fill:#000}.ser{font-family:serif}.sans{font-family:sans-serif}.title{font-size:33px;font-weight:bold}.h{font-size:20px}.s{font-size:15px}.tiny{font-size:12px}.box{fill:#fff;stroke:#000;stroke-width:2}
</style>
<text x="1224" y="46" text-anchor="middle" class="ser title">07-OFFERTORY-CONVERGENCE</text>
<text x="1224" y="80" text-anchor="middle" class="ser h">Convergence into the Offertory · LM-050A–LM-053A · spoken 1962 Low Mass, two servers</text>
<g transform="translate(30,118)">
<rect width="780" height="655" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-050A</text>
<text x="20" y="52" class="sans s">The altar kiss at the centre</text>
<text x="20" y="74" class="sans tiny">priest: bowing-low-over-altar · predella-centre · faces altar · eyes altar ·</text>
<text x="20" y="99" class="sans tiny">on-altar-outside-corporal</text>
<text x="20" y="124" class="sans tiny">→ altar-kiss</text>
<text x="20" y="149" class="sans tiny">→ join-hands</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="199" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="249" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="274" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="299" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="324" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="349" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="374" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="399" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(834,118)">
<rect width="780" height="655" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-051A</text>
<text x="20" y="52" class="sans s">Turn right to the people for Dominus vobiscum</text>
<text x="20" y="74" class="sans s">“Dominus vobiscum” (audible)</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces people · eyes downcast · extended</text>
<text x="20" y="124" class="sans tiny">→ turn-right</text>
<text x="20" y="149" class="sans tiny">→ separate-hands</text>
<text x="20" y="174" class="sans tiny">→ join-hands</text>
<text x="20" y="199" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="249" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="274" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="299" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="324" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="349" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="374" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="399" class="sans tiny">AC1: “Et cum spiritu tuo”</text>
<text x="20" y="424" class="sans tiny">AC2: “Et cum spiritu tuo”</text>
<text x="20" y="449" class="sans tiny">UNRESOLVED: The approved record does not restate the downcast eyes at this 'Dominus vobiscum';</text>
<text x="20" y="474" class="sans tiny">it fixes them at the identically described turn to the people before the Collect, and 'downcast'</text>
<text x="20" y="499" class="sans tiny">is recorded here on that basis alone.</text>
<text x="20" y="524" class="sans tiny">UNRESOLVED: The approved record does not state whether the servers turn their heads toward the</text>
<text x="20" y="549" class="sans tiny">priest at this 'Dominus vobiscum'; it records no change to their kneeling orientation, so none</text>
<text x="20" y="574" class="sans tiny">is drawn.</text>
<text x="20" y="599" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="624" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(1638,118)">
<rect width="780" height="655" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-052A</text>
<text x="20" y="52" class="sans s">Turn left back to the altar and Oremus</text>
<text x="20" y="74" class="sans s">“Oremus” (audible)</text>
<text x="20" y="99" class="sans tiny">priest: standing · bow head-profound · predella-centre · faces altar-cross · eyes cross ·</text>
<text x="20" y="124" class="sans tiny">joined-before-breast</text>
<text x="20" y="149" class="sans tiny">→ turn-left</text>
<text x="20" y="174" class="sans tiny">→ separate-hands</text>
<text x="20" y="199" class="sans tiny">→ join-hands</text>
<text x="20" y="224" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="249" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="274" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="299" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="324" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="399" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="424" class="sans tiny">UNRESOLVED: The approved record prescribes no bow for the servers at this 'Oremus'; they are</text>
<text x="20" y="449" class="sans tiny">therefore drawn kneeling and unbowed.</text>
<text x="20" y="474" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="499" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(30,797)">
<rect width="780" height="355" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-053A</text>
<text x="20" y="52" class="sans s">The Offertory antiphon read with hands joined</text>
<text x="20" y="74" class="sans tiny">priest: standing · predella-centre · faces missal · eyes missal · joined-before-breast</text>
<text x="20" y="99" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="124" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="149" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="174" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="199" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="224" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="249" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="274" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="299" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="324" class="sans tiny">INV-OBJ-01</text>
</g>
</svg>
