scenes:
  - scene_id: "LM-068A"
    order: 93
    cluster: "LM-068"
    title: "Offerimus tibi: the purificator laid on the paten and the chalice taken"
    kind: action
    liturgical_moment: "The Offertory: the offering of the chalice"
    text_cue: "Offerimus tibi, Domine, calicem salutaris"
    voice: low
    condition: "ALWAYS"
    predecessor: "LM-067A"
    successor: "LM-069A"
    camera:
      view: over-shoulder
      note: >-
        Behind and above the priest at the centre, so that the exposed half of
        the paten outside the right edge of the corporal, the purificator laid
        upon it, and both hands on the chalice are all legible at once.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: none
        facing: altar
        gaze: hands
        hands: {joined: false, left: supporting-chalice-base, right: holding-chalice-node}
        gestures: []
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar from the beginning of Mass."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: host
        placement: corporal-front-centre
        orientation: flat-on-mensa
        state_before: "Lying on the front-centre fold of the corporal."
        state_after: "Lying on the front-centre fold of the corporal."
        handled_by: none
      - id: paten
        placement: corporal-right-edge
        orientation: flat-on-mensa
        state_before: "Empty, lying halfway under the right edge of the corporal, its outer half exposed toward the Epistle side."
        state_after: "Empty, still halfway under the right edge of the corporal, its exposed half now carrying the purificator."
        handled_by: none
      - id: purificator
        placement: corporal-right-edge
        orientation: open-ends-toward-back
        state_before: "Left at the node of the chalice after the drops were wiped from its rim, the priest's hands joined."
        state_after: "Laid on the exposed half of the paten with its open ends toward the back of the altar."
        handled_by: priest
      - id: chalice
        placement: "held in the priest's hands above the mensa at the centre"
        orientation: upright
        state_before: "Prepared with wine and water and set on the mensa toward the centre, its rim wiped, not yet on the corporal."
        state_after: "Taken up: the node in the priest's right hand, the base supported by the fingers and thumb of his left hand."
        handled_by: priest
      - id: pall
        placement: mensa-epistle-corner
        orientation: upright
        state_before: "Standing against the Epistle altar card."
        state_after: "Standing against the Epistle altar card."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side of the corporal, near the centre, where it has stood since the Gospel."
        state_after: "Open on the Gospel side of the corporal, near the centre."
        handled_by: none
    transitions:
      - "AC1 and AC2 carry the wine and water cruets back to the credence and resume their kneeling places."
      - "The priest takes up the purificator from the node of the chalice and lays it on the exposed half of the paten, the half that lies outside the right edge of the corporal."
      - "The purificator is laid with its open ends toward the back of the altar."
      - "He takes the chalice at the node with his right hand."
      - "He supports the base of the chalice with the fingers and thumb of his left hand."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-OBJ-01
    variants: []
    unresolved:
      - "The approved record does not fix what the servers do between presenting the cruets and the Lavabo; they are depicted returning the cruets to the credence and kneeling in their ordinary places until they rise for the Lavabo at LM-075A."
    notes: >-
      The grip is the approved one and must be drawn exactly: the node in the
      right hand, the base supported from beneath by the left fingers and
      thumb. The purificator's orientation is load-bearing: its open ends face
      the back of the altar, not the priest.

  - scene_id: "LM-069A"
