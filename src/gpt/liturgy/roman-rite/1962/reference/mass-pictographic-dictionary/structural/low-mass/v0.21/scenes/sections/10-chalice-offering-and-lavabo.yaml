        placement: mensa-epistle-corner
        orientation: upright
        state_before: "Standing against the Epistle altar card."
        state_after: "Standing against the Epistle altar card."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side of the corporal, near the centre."
        state_after: "Open on the Gospel side of the corporal, near the centre."
        handled_by: none
    transitions:
      - "The priest lowers the chalice from eye height to just above the corporal, keeping the same grip."
      - "He makes a sign of the cross with the chalice itself, in a horizontal plane just above the corporal, over the place where the chalice is to stand."
      - "His eyes come down from the cross to the chalice as he lowers it."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-OBJ-01
    variants: []
    unresolved: []
    notes: >-
      The sign is made with the chalice, in a horizontal plane just above the
      corporal, exactly as the paten's sign was made earlier at the offering of
      the Host. The chalice itself stays upright; it is the plane of the
      movement that is horizontal.

