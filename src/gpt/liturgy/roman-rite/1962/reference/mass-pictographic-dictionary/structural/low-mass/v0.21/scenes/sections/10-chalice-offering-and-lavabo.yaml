        orientation: upright
        state_before: "Held at eye height, the node in the right hand, the base supported by the left fingers and thumb."
        state_after: "Lowered to just above the corporal and moved through a horizontal sign of the cross over the place where it will stand."
        handled_by: priest
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: host
        placement: corporal-front-centre
        orientation: flat-on-mensa
        state_before: "Lying on the front-centre fold of the corporal."
        state_after: "Lying on the front-centre fold of the corporal."
        handled_by: none
      - id: paten
        placement: corporal-right-edge
        orientation: flat-on-mensa
        state_before: "Halfway under the right edge of the corporal, carrying the purificator."
        state_after: "Halfway under the right edge of the corporal, carrying the purificator."
        handled_by: none
      - id: purificator
        placement: corporal-right-edge
        orientation: open-ends-toward-back
        state_before: "Laid on the exposed half of the paten, open ends toward the back."
        state_after: "Laid on the exposed half of the paten, open ends toward the back."
        handled_by: none
