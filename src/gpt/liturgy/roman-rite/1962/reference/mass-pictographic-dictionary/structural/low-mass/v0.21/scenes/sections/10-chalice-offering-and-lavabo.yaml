        gestures: []
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: chalice
        placement: "held at the priest's eye height above the corporal at the centre"
        orientation: upright
        state_before: "Held at the node in the right hand, the base supported by the left fingers and thumb."
        state_after: "Raised to the priest's eye height and held there for the whole of the prayer."
        handled_by: priest
      - id: altar-cross
        placement: altar-cross
        orientation: upright
        state_before: "Standing at the centre of the altar."
        state_after: "Standing at the centre of the altar; the priest's gaze rests on it throughout the prayer."
        handled_by: none
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: host
        placement: corporal-front-centre
        orientation: flat-on-mensa
        state_before: "Lying on the front-centre fold of the corporal."
        state_after: "Lying on the front-centre fold of the corporal."
        handled_by: none
      - id: paten
        placement: corporal-right-edge
        orientation: flat-on-mensa
        state_before: "Halfway under the right edge of the corporal, carrying the purificator on its exposed half."
        state_after: "Halfway under the right edge of the corporal, carrying the purificator on its exposed half."
        handled_by: none
      - id: purificator
        placement: corporal-right-edge
        orientation: open-ends-toward-back
        state_before: "Laid on the exposed half of the paten, open ends toward the back."
        state_after: "Laid on the exposed half of the paten, open ends toward the back."
        handled_by: none
      - id: pall
        placement: mensa-epistle-corner
        orientation: upright
        state_before: "Standing against the Epistle altar card."
        state_after: "Standing against the Epistle altar card."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side of the corporal, near the centre."
        state_after: "Open on the Gospel side of the corporal, near the centre."
        handled_by: none
    transitions:
      - "The priest raises the chalice to eye height, holding it at the node with the right hand and supporting the base with the left."
      - "He looks at the altar cross and keeps his eyes there for the entire prayer."
      - "He says the whole of the prayer in a low voice with the chalice held at that height."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-OBJ-01
    variants: []
    unresolved: []
    notes: >-
      Eye height, not breast height and not an elevation: the chalice is level
      with the priest's eyes. Throughout the whole prayer he looks at the
      cross, never at the chalice. Both facts are approved and neither may be
      softened in the drawing.

