      - "At \"Sicut erat\" he begins the return along the predella to the centre."
      - "He finishes the psalm as he returns and stands at the centre with his hands joined."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-NAME-01
      - INV-OBJ-01
    variants:
      - id: "lavabo-doxology-omitted"
        kind: seasonal
        applies_when: "PASSIONTIDE-OR-REQUIEM"
        description: >-
          In Passiontide and at Requiem Masses the psalm doxology "Gloria
          Patri" is omitted from the Lavabo psalm. The bow that belongs to it
          and the cue for beginning the return therefore fall away with it.
          This is a departure from the baseline, not an alteration of it: the
          baseline says the doxology, bows at it, and begins the return at
          "Sicut erat".
        baseline: false
    unresolved:
      - "The approved record fixes that the priest bows toward the cross at the doxology but does not fix the depth of that bow; it is depicted as a moderate bow of the head."
    notes: >-
      "Gloria Patri" here is the psalm doxology at the end of the Lavabo psalm.
      It is never to be called "the Gloria": an unqualified Gloria means the
      Gloria in excelsis, which belongs to a different part of the Mass
      entirely. The two cues are distinct and both are approved -- the bow at
      the doxology, the start of the return at "Sicut erat" -- so the return
      must not be drawn as beginning at the bow.

