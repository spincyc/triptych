rite: roman-1962
form: low-mass
mode: spoken
server_count: 2
provenance: repository-recovery-from-approved-baseline
section:
  id: "17-ablutions-and-coordinated-transfer"
  title: "The ablutions and the coordinated transfer"
authority:
  - "../../handoff/HANDOFF-SUMMARY.md"
