<text x="1224" y="46" text-anchor="middle" class="ser title">06-CREDO</text>
<text x="1224" y="80" text-anchor="middle" class="ser h">The Credo · LM-044A–LM-049A · spoken 1962 Low Mass, two servers</text>
<g transform="translate(30,118)">
<rect width="780" height="505" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-044A</text>
<text x="20" y="52" class="sans s">Credo in unum Deum: the opening gesture</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans s">“Credo in unum Deum” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: standing · predella-centre · faces altar-cross · eyes cross · elevated</text>
<text x="20" y="149" class="sans tiny">→ extend-hands</text>
<text x="20" y="174" class="sans tiny">→ elevate-hands</text>
<text x="20" y="199" class="sans tiny">→ join-hands</text>
<text x="20" y="224" class="sans tiny">→ lower-hands</text>
<text x="20" y="249" class="sans tiny">AC1: kneeling · step-1-epistle · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="274" class="sans tiny">AC2: kneeling · step-1-gospel · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="299" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="324" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="349" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="374" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="399" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="424" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="449" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="474" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(834,118)">
<rect width="780" height="505" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-044B</text>
<text x="20" y="52" class="sans s">The profound head bow at Deum</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans s">“Credo in unum Deum” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: standing · bow head-profound · predella-centre · faces altar-cross · eyes cross ·</text>
<text x="20" y="149" class="sans tiny">joined-before-breast</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · bow head-slight · step-1-epistle · faces altar-cross · eyes cross ·</text>
<text x="20" y="199" class="sans tiny">joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · bow head-slight · step-1-gospel · faces altar-cross · eyes cross ·</text>
<text x="20" y="249" class="sans tiny">joined-before-breast</text>
<text x="20" y="274" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="299" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="324" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="399" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="424" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="449" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(1638,118)">
<rect width="780" height="505" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-045A</text>
<text x="20" y="52" class="sans s">The head bow at Jesum Christum</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans s">“Et in unum Dominum Jesum Christum” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: standing · bow head-profound · predella-centre · faces altar-cross · eyes cross ·</text>
<text x="20" y="149" class="sans tiny">joined-before-breast</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · bow head-slight · step-1-epistle · faces altar-cross · eyes cross ·</text>
<text x="20" y="199" class="sans tiny">joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · bow head-slight · step-1-gospel · faces altar-cross · eyes cross ·</text>
<text x="20" y="249" class="sans tiny">joined-before-breast</text>
<text x="20" y="274" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="299" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="324" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="399" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="424" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="449" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(30,647)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-046A</text>
<text x="20" y="52" class="sans s">Et incarnatus est: hands on the mensa and the genuflection</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans s">“Et incarnatus est de Spiritu Sancto ex Maria Virgine” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: genuflecting · predella-centre · faces altar-cross · eyes cross ·</text>
<text x="20" y="149" class="sans tiny">palm-on-mensa-outside-corporal</text>
<text x="20" y="174" class="sans tiny">→ genuflect</text>
<text x="20" y="199" class="sans tiny">AC1: kneeling · bow head-moderate · step-1-epistle · faces altar-cross · eyes cross ·</text>
<text x="20" y="224" class="sans tiny">joined-before-breast</text>
<text x="20" y="249" class="sans tiny">AC2: kneeling · bow head-moderate · step-1-gospel · faces altar-cross · eyes cross ·</text>
<text x="20" y="274" class="sans tiny">joined-before-breast</text>
<text x="20" y="299" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="324" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="349" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="374" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="399" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="424" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="449" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="474" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(834,647)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-046B</text>
<text x="20" y="52" class="sans s">The genuflection held through Et homo factus est</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans s">“Et homo factus est” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: genuflecting · predella-centre · faces altar-cross · eyes cross ·</text>
<text x="20" y="149" class="sans tiny">palm-on-mensa-outside-corporal</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · bow head-moderate · step-1-epistle · faces altar-cross · eyes cross ·</text>
<text x="20" y="199" class="sans tiny">joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · bow head-moderate · step-1-gospel · faces altar-cross · eyes cross ·</text>
<text x="20" y="249" class="sans tiny">joined-before-breast</text>
<text x="20" y="274" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="299" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="324" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="399" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="424" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="449" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(1638,647)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-047A</text>
<text x="20" y="52" class="sans s">The priest rises and rejoins his hands</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans tiny">priest: standing · predella-centre · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="124" class="sans tiny">→ join-hands</text>
<text x="20" y="149" class="sans tiny">AC1: kneeling-erect · step-1-epistle · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="174" class="sans tiny">AC2: kneeling-erect · step-1-gospel · faces altar-cross · eyes cross · joined-before-breast</text>
<text x="20" y="199" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="224" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="249" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="274" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="299" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="324" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="349" class="sans tiny">UNRESOLVED: The approved record fixes that the priest remains genuflected through 'Et homo</text>
<text x="20" y="374" class="sans tiny">factus est' and then rises, but does not name the words at which he rises; no text_cue is</text>
<text x="20" y="399" class="sans tiny">therefore asserted for this scene.</text>
<text x="20" y="424" class="sans tiny">UNRESOLVED: The approved record does not say at which words the servers come erect from their</text>
<text x="20" y="449" class="sans tiny">moderate bow.</text>
<text x="20" y="474" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="499" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(30,1201)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-048A</text>
<text x="20" y="52" class="sans s">The head bow at simul adoratur</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans s">“Qui cum Patre et Filio simul adoratur, et conglorificatur” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: standing · bow head-profound · predella-centre · faces altar-cross · eyes cross ·</text>
<text x="20" y="149" class="sans tiny">joined-before-breast</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling · bow head-slight · step-1-epistle · faces altar-cross · eyes cross ·</text>
<text x="20" y="199" class="sans tiny">joined-before-breast</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling · bow head-slight · step-1-gospel · faces altar-cross · eyes cross ·</text>
<text x="20" y="249" class="sans tiny">joined-before-breast</text>
<text x="20" y="274" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="299" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="324" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="399" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="424" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="449" class="sans tiny">INV-OBJ-01</text>
</g>
<g transform="translate(834,1201)">
<rect width="780" height="530" rx="10" class="box"/>
<text x="20" y="30" class="sans h">LM-049A</text>
<text x="20" y="52" class="sans s">Et vitam venturi saeculi: all three sign themselves</text>
<text x="20" y="74" class="sans tiny">ONLY WHEN CREDO-PRESCRIBED</text>
<text x="20" y="99" class="sans s">“Et vitam venturi saeculi. Amen.” (audible)</text>
<text x="20" y="124" class="sans tiny">priest: standing · predella-centre · faces altar-cross · eyes cross · L on-breast / R signing</text>
<text x="20" y="149" class="sans tiny">→ sign-of-the-cross</text>
<text x="20" y="174" class="sans tiny">AC1: kneeling-erect · step-1-epistle · faces altar-cross · eyes cross · L on-breast / R signing</text>
<text x="20" y="199" class="sans tiny">→ sign-of-the-cross</text>
<text x="20" y="224" class="sans tiny">AC2: kneeling-erect · step-1-gospel · faces altar-cross · eyes cross · L on-breast / R signing</text>
<text x="20" y="249" class="sans tiny">→ sign-of-the-cross</text>
<text x="20" y="274" class="sans tiny">missal @ mensa-centre [priest-reads-facing-left]</text>
<text x="20" y="299" class="sans tiny">missal-stand @ mensa-centre</text>
<text x="20" y="324" class="sans tiny">corporal @ mensa-centre [unfolded]</text>
<text x="20" y="349" class="sans tiny">chalice @ corporal-back-centre [upright]</text>
<text x="20" y="374" class="sans tiny">chalice-veil @ corporal-back-centre</text>
<text x="20" y="399" class="sans tiny">burse @ mensa-gospel</text>
<text x="20" y="424" class="sans tiny">UNRESOLVED: The approved record does not fix the position of the left hand during this sign of</text>
<text x="20" y="449" class="sans tiny">the cross, for the priest or for either server.</text>
<text x="20" y="474" class="sans tiny">invariants: INV-FORM-01, INV-GEO-01, INV-GEO-02, INV-GEO-03, INV-MISSAL-01, INV-ROLE-01,</text>
<text x="20" y="499" class="sans tiny">INV-OBJ-01</text>
