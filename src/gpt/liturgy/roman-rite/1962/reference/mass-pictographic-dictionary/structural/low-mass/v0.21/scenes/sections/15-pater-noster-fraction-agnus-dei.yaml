      is VERTICAL and begins at the TOP; the outer edges bend TOWARD the priest;
      the RIGHT half goes to the paten. INV-HAND-01 is in force in its permitted
      form: both thumb-and-index pairs are separated from their joined position
      only because they are holding and dividing the Sacred Host, and hold
      nothing else. The head bow at the Holy Name falls within the conclusion
      said during the Fraction; the depicted state is the division itself.

