scenes:
  - scene_id: "LM-128A"
    order: 160
    cluster: "LM-128"
    title: "Oremus and the bow to the Host before the Pater noster"
    kind: action
    liturgical_moment: "The introduction to the Pater noster"
    text_cue: "Oremus. Praeceptis salutaribus moniti, et divina institutione formati, audemus dicere:"
    voice: audible
    condition: "ALWAYS"
    predecessor: "LM-112D"
    successor: "LM-128B"
    camera:
      view: nave-front
      note: >-
        The priest alone on the predella at the centre, bowed toward the Sacred
        Host with his hands joined before his breast. Both servers kneel on the
        lowest step. The whole altar, its three steps and the predella are in
        frame.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: head-moderate
        facing: host
        gaze: host
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures:
          - join-hands
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side, where it has stood since the Gospel."
        state_after: "Open on the Gospel side."
        handled_by: none
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: host
        placement: corporal-front-centre
        orientation: flat-on-mensa
        state_before: "The consecrated Host lying entire on the front-centre fold of the corporal."
        state_after: "The consecrated Host lying entire on the front-centre fold of the corporal."
        handled_by: none
      - id: chalice
        placement: corporal-back-centre
        orientation: not-applicable
        state_before: "Standing on the corporal, containing the Precious Blood, covered by the pall."
        state_after: "Standing on the corporal, containing the Precious Blood, covered by the pall."
        handled_by: none
      - id: pall
        placement: "covering the chalice on the corporal"
        orientation: horizontal
        state_before: "Replaced over the chalice after the minor elevation."
        state_after: "Covering the chalice."
        handled_by: none
      - id: paten
        placement: corporal-right-edge
        orientation: flat-on-mensa
        state_before: "Lying halfway under the right edge of the corporal, toward the Epistle side."
        state_after: "Lying halfway under the right edge of the corporal."
        handled_by: none
      - id: purificator
        placement: mensa-epistle
        orientation: folded
        state_before: "Folded, lying on the mensa at the right of the corporal, toward the Epistle side."
        state_after: "Folded, lying on the mensa at the right of the corporal."
        handled_by: none
    transitions:
      - "The servers having answered 'Amen' to 'Per omnia saecula saeculorum', the priest joins his hands before his breast."
      - "He bows toward the Sacred Host while saying 'Oremus'."
      - "He remains bowed through 'Praeceptis salutaribus moniti, et divina institutione formati'."
      - "He raises his head after 'audemus dicere' and extends his hands to begin the Pater noster."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-HAND-01
      - INV-OBJ-01
    variants: []
    unresolved:
      - "The approved record prescribes a bow to the Host at 'Oremus' but does not grade its depth."
    notes: >-
      INV-HAND-01 is in force: the thumb and index fingertips of both hands
      remain joined while the hands are joined before the breast. The bow is
      rendered as a moderate head bow toward the Sacred Host, the approved
      record having fixed the bow but not its depth. The head is raised and the
      hands extended at the very end of the scene, which is the state LM-128B
      opens in.

