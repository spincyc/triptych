# The canonical ordered registry of the spoken 1962 Low Mass. Read it to get
# every structural scene needed to draw the Mass in order: sort by `order`,
# never by scene ID. Each row names the file that implements the scene.
#
# `sections/` must implement this registry exactly. `../validate.py` fails if
# a scene appears in one and not the other, or if the two disagree on cluster,
# order, title, condition, file, or linkage.

coverage:
  first_scene: "LM-001A"
  last_scene: "LM-140C"
  scene_count: 197
  cluster_count: 125
  span: "Prayers at the Foot of the Altar through the Leonine prayers and the recessional"
  complete: true

numbering:
  scene_id_form: "LM-NNN plus a scene letter; LM-NNN alone names the cluster"
  committed_ids_preserved:
    - "LM-134A through LM-134C"
    - "LM-135A through LM-135C"
    - "LM-137A"
    - "LM-137C"
    - "LM-138A through LM-138D"
    - "LM-139A through LM-139B"
    - "LM-140A through LM-140C"
  unassigned:
    - id: "LM-137B"
      reason: >-
        Absent from the approved storyboard. The recovery preserves the
        absence rather than inventing a scene to close the letter sequence.
  reserved_gap:
    from: "LM-113"
    to: "LM-127"
    reason: >-
      Deliberately unassigned so that a later insertion between the Canon and
      the Pater noster cannot force the renumbering of a committed late scene.
      Numeric contiguity is not a coverage claim; `order` is.

# One-stop answers for the questions a rendering agent asks of this registry.
related:
  which_invariants_govern_a_scene:
    file: "invariants.yaml"
    note: >-
      Each invariant declares the cluster ranges it governs in `applies_to`, and
      the stale contradiction it rejects. Each scene lists the ones that bind it.
  which_branches_are_conditional:
    file: "conditions.yaml"
    note: >-
      A scene whose `condition` is not ALWAYS belongs to a conditional block.
      The scene before the block carries `bypass_successor`, which names where
      the order resumes when the condition fails. Three blocks exist: the Gloria
      in excelsis, the Credo, and the Leonine prayers.
  where_the_actors_and_objects_stand:
    file: "geometry.yaml"
  what_the_fields_mean:
    file: "schema.md"
  which_material_is_superseded:
    file: "../corpus.yaml"
    key: "historical_review_projections"
    note: >-
      Two raster projections under ../review-history/ are superseded and must
      never control a render: the LM-134/LM-135 v0.1 sheet, which predates
      Acolyte 1's three Domine, non sum dignus bell cues, and the
      LM-136/LM-137 v0.1 sheet, which predates the Acolyte-1-only ablutions and
      the coordinated crossing order. The older sibling altar-server-guides tree
      is likewise not an input; see ../recovery/recovery-notes.md.
  how_the_storyboards_are_made:
    file: "../render-storyboards.py"
    note: >-
      Storyboards under ../storyboards/ are generated from this registry and the
      section files. Regenerate them; never hand-edit them.

