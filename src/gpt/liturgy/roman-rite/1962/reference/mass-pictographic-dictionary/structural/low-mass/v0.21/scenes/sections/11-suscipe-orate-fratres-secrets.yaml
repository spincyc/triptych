    notes: >-
      There is NO "Oremus" before the Secrets: the hand movement that precedes
      the Collects is made, but the word is not said. The order is extend,
      join, extend again, then read. The reading is in a low voice, from the
      Missal, which is still on the Gospel side of the corporal where it has
      stood since the Gospel and which is oriented, there as everywhere, so
      that the priest reading it is turned toward his left. The last Secret is
      followed by the Preface dialogue, which belongs to the next section.
