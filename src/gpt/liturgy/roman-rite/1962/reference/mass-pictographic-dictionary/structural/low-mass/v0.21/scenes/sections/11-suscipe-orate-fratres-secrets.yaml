      The turn toward the people is to the RIGHT. The eyes stay cast down for
      the whole time he faces the people: he never looks at them. The hands
      separate only while he is facing them and are rejoined on the words
      themselves. ONLY the two words "Orate, fratres" are audible; everything
      after them is said in a low voice. He does not linger facing the people
      -- the turn continues at once into LM-081B and is never held as a pause.

