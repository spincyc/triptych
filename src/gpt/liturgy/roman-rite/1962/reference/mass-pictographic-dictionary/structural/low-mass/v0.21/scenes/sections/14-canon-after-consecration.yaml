    transitions:
      - "Immediately after the second genuflection at the chalice both servers rise from their kneeling places on the predella."
      - "Both turn inward, toward the centre, and descend the altar steps without casually turning their backs to the Blessed Sacrament."
      - "They meet at the centre below the lowest step, AC2 on the Gospel side of the pair and AC1 on the Epistle side."
      - "They genuflect together on the floor below the steps."
      - "AC1 goes to his ordinary place at the Epistle end of the lowest step and AC2 to his ordinary place at the Gospel end, and both kneel."
      - "The priest remains standing erect at the centre of the predella throughout the servers' return."
    responses: []
    bells: []
    invariants:
