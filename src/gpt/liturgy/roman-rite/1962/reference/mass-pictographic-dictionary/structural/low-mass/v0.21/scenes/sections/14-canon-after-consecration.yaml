        role: "acolyte-gospel-side"
        anchor: plano-centre-gospel
        side: centre
        depth_rank: 1
        posture: genuflecting
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: [turn-inward, descend, genuflect]
        path:
          from: predella-gospel
          to: step-1-gospel
          via: [plano-centre]
          note: >-
            Rises from the predella, turns inward toward the centre and descends
            the steps without casually turning his back to the Blessed
            Sacrament, genuflects with AC1 at the centre below the steps, then
            goes to his ordinary place at the Gospel end of the lowest step and
            kneels.
    objects:
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side, near the centre-left of the corporal, where it has stood since the Gospel."
