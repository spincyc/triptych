    cluster: "LM-104"
    title: "The servers return to the lowest step"
    kind: transition
    liturgical_moment: "Canon of the Mass, immediately after the Consecration of the chalice"
    voice: none
    condition: "ALWAYS"
    predecessor: "LM-103C"
    successor: "LM-105A"
    camera:
      view: nave-front
      note: >-
        The panel depicts the instant of the servers' joint genuflection at the
        centre below the lowest step, with the priest standing erect at the
        centre of the predella above them. AC2 kneels on the Gospel side of the
        pair and AC1 on the Epistle side.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: plano-centre-epistle
        side: centre
        depth_rank: 1
        posture: genuflecting
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: false, left: at-side, right: holding-bell}
        gestures: [turn-inward, descend, genuflect]
        path:
          from: predella-epistle
          to: step-1-epistle
          via: [plano-centre]
          note: >-
            Rises from the predella, turns inward toward the centre and descends
            the steps without casually turning his back to the Blessed
            Sacrament, genuflects with AC2 at the centre below the steps, then
            goes to his ordinary place at the Epistle end of the lowest step and
            kneels.
