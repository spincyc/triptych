        handled_by: none
      - id: pall
        placement: "covering the cup of the chalice"
        orientation: horizontal
        state_before: "Laid over the cup of the chalice with the right hand after the chalice elevation."
        state_after: "Covering the cup of the chalice."
        handled_by: none
      - id: paten
        placement: corporal-right-edge
        orientation: flat-on-mensa
        state_before: "Halfway under the right edge of the corporal, its exposed half carrying the purificator."
        state_after: "Halfway under the right edge of the corporal, its exposed half carrying the purificator."
        handled_by: none
      - id: purificator
        placement: "on the exposed half of the paten"
        orientation: open-ends-toward-back
        state_before: "Lying on the exposed half of the paten, open ends toward the back."
        state_after: "Lying on the exposed half of the paten, open ends toward the back."
        handled_by: none
      - id: chalice-veil
        placement: "folded, on the Epistle side of the altar near the Lavabo card"
        orientation: folded
        state_before: "Folded by AC1 at the Offertory and left at its approved Epistle-side place."
        state_after: "Folded, at its approved Epistle-side place."
        handled_by: none
      - id: burse
        placement: mensa-gospel
        orientation: not-applicable
        state_before: "Empty, on the Gospel side."
        state_after: "Empty, on the Gospel side."
        handled_by: none
      - id: bell
        placement: "at AC1's place at the Epistle end of the lowest step"
        orientation: not-applicable
        state_before: "In AC1's right hand on the predella, rung once at the second chalice genuflection."
        state_after: "Back at AC1's place on the lowest step, Epistle side. It is not rung again anywhere in this section."
