    notes: >-
      The rubbing of the thumb and index over the cup of the chalice releases any
      adhering fragment of the Sacred Host into the Precious Blood; immediately
      afterwards the fingertips are rejoined and INV-HAND-01 continues in force
      until the finger ablutions. The order is fixed: chalice replaced, Host
      replaced, fingers rubbed, chalice covered, hands on the corporal,
      genuflection. Only "Per omnia saecula saeculorum" is said aloud; it is the
      first audible word since the raised opening of "Nobis quoque peccatoribus".
