      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
      - INV-HAND-01
    variants: []
    unresolved:
      - "The approved record does not fix the moment at which AC1 sets the bell down at his place on the lowest step as he returns."
    notes: >-
      INV-HAND-01 is in force from the Consecration of the Host to the finger
      ablutions and therefore governs every scene of this section: the thumb and
      index fingertips of both of the priest's hands remain joined, separating
      only as needed to touch or handle the Sacred Host. The priest's hands are
      shown joined before the breast here; the approved record does not fix his
      hand position in the instant between rising from the second chalice
      genuflection and extending his hands at "Unde et memores". geometry.yaml
      offers no paired anchor for two actors standing side by side at the centre
      below the steps, so both servers are recorded at plano-centre and the
      pairing is given in the camera note.

