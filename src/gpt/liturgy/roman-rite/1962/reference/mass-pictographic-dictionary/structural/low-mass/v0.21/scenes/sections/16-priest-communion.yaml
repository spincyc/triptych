      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: false, left: joined-before-breast, right: holding-bell}
        gestures:
          - ring-bell
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: paten
        placement: "In the priest's left hand, held behind the Host halves above the corporal."
        orientation: nearly-horizontal
        state_before: "In the left hand behind the Host halves."
        state_after: "In the left hand behind the Host halves."
        handled_by: priest
      - id: host-halves
        placement: "In the priest's left hand, before the paten and above the corporal."
        orientation: nearly-horizontal
        state_before: "Held in the left hand with the paten behind them."
        state_after: "Held in the left hand with the paten behind them."
        handled_by: priest
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Standing on the corporal, covered by the pall."
        state_after: "Standing on the corporal, covered by the pall."
        handled_by: none
      - id: pall
        placement: corporal-back-centre
        orientation: flat-on-mensa
        state_before: "Covering the chalice."
        state_after: "Covering the chalice."
