    transitions:
      - "The priest bows the body medium over the altar, the two Host halves and the paten held in his left hand."
      - "He says the opening \"Domine, non sum dignus\" aloud, striking his breast once with the last three fingers of his right hand; AC1 rings the bell once."
      - "He completes the repetition in a low voice."
      - "He says the second opening \"Domine, non sum dignus\" aloud, striking his breast once with the last three fingers of his right hand; AC1 rings the bell once."
      - "He completes the second repetition in a low voice."
      - "He says the third opening \"Domine, non sum dignus\" aloud, striking his breast once with the last three fingers of his right hand; AC1 rings the bell once."
      - "He completes the third repetition in a low voice."
      - "The medium body bow is held until the final \"anima mea\"."
      - "AC2 remains kneeling and reverent throughout and does not touch the bell."
    responses: []
    bells:
      - actor: AC1
        count: 1
        cue: "The first priestly opening of \"Domine, non sum dignus\", said aloud."
      - actor: AC1
        count: 1
        cue: "The second priestly opening of \"Domine, non sum dignus\", said aloud."
      - actor: AC1
        count: 1
        cue: "The third priestly opening of \"Domine, non sum dignus\", said aloud."
