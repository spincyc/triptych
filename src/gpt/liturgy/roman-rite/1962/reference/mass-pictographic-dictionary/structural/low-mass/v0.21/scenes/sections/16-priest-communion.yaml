    voice: audible
    condition: "ALWAYS"
    predecessor: "LM-134B"
    successor: "LM-135A"
    camera:
      view: nave-front
      note: >-
        The priest is bowed medium over the altar, the Host and paten in his left
        hand, his right hand at his breast. AC1, kneeling on the lowest step on
        the Epistle side, holds the bell and rings it once at each of the three
        openings. AC2 kneels reverent and still.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: body-medium
        facing: altar
        gaze: host
        hands: {joined: false, left: holding-host-and-paten, right: striking-breast}
        gestures:
