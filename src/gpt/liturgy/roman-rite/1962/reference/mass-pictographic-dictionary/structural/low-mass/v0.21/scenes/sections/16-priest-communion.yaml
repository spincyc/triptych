scenes:
  - scene_id: "LM-134A"
    order: 176
    cluster: "LM-134"
    title: "The three Communion prayers"
    kind: action
    liturgical_moment: "The three prayers before the priest's Communion"
    text_cue: >-
      "Domine Jesu Christe, qui dixisti Apostolis tuis..." /
      "Domine Jesu Christe, Fili Dei vivi..." /
      "Perceptio Corporis tui..."
    voice: low
    condition: "ALWAYS"
    predecessor: "LM-133C"
    successor: "LM-134B"
    camera:
      view: nave-front
      note: >-
        The priest is held in one sustained medium body bow at the centre of the
        predella, his hands joined on the altar edge and his eyes on the Sacred
        Host. Both servers kneel on the lowest step and do not move.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: body-medium
        facing: altar
        gaze: host
        hands: {joined: true, left: joined-at-mensa-edge, right: joined-at-mensa-edge}
        gestures: []
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: paten
        placement: corporal-front-centre
        orientation: flat-on-mensa
        state_before: "Resting on the corporal before the priest, bearing the two halves of the Sacred Host."
        state_after: "Resting on the corporal before the priest, bearing the two halves of the Sacred Host."
        handled_by: none
      - id: host-halves
        placement: corporal-front-centre
        orientation: flat-on-mensa
        state_before: "The two halves of the consecrated Host lie together on the paten, the particle already dropped into the chalice."
        state_after: "The two halves of the consecrated Host lie together on the paten."
        handled_by: none
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Standing on the corporal behind the paten, containing the Precious Blood with the commingled particle, covered by the pall."
        state_after: "Standing on the corporal behind the paten, covered by the pall."
        handled_by: none
      - id: pall
        placement: corporal-back-centre
        orientation: flat-on-mensa
        state_before: "Covering the chalice."
        state_after: "Covering the chalice."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side of the altar, where it has stood since the Gospel."
        state_after: "Open on the Gospel side of the altar."
        handled_by: none
      - id: bell
        placement: step-1-epistle
        orientation: not-applicable
        state_before: "On the floor of the lowest step at AC1's right hand, silent."
        state_after: "On the floor of the lowest step at AC1's right hand, silent."
        handled_by: none
    transitions:
      - "The priest, standing at the centre of the predella, bows the body medium over the altar and joins his hands resting on the altar edge."
      - "He fixes his eyes on the Sacred Host and keeps them there throughout."
      - "In a low voice he says the first prayer, \"Domine Jesu Christe, qui dixisti Apostolis tuis...\"."
      - "In a low voice he says the second prayer, \"Domine Jesu Christe, Fili Dei vivi...\"."
      - "In a low voice he says the third prayer, \"Perceptio Corporis tui...\"."
      - "The medium body bow and the joined hands on the altar edge are held unbroken through all three prayers."
      - "AC1 and AC2 remain kneeling and reverent on the lowest step and do nothing."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
      - INV-HAND-01
    variants:
      - id: "requiem-omits-first-prayer"
        kind: requiem
        applies_when: "REQUIEM"
        description: >-
          In a Requiem the first prayer, "Domine Jesu Christe, qui dixisti
          Apostolis tuis...", is omitted; the priest says only "Domine Jesu
          Christe, Fili Dei vivi..." and "Perceptio Corporis tui...".
        baseline: false
    unresolved: []
    notes: >-
      No additional Holy Name head bow is made in this scene, because the priest
      is already bowed in reverence; a renderer must not add one. INV-HAND-01,
      the post-Consecration thumb and index discipline, is in force from this
      scene onward and remains in force until the finger ablution in LM-136B, so
      the joined thumb and index fingertips of both hands must be visible in any
      close view. Detail preserved from the approved review sheet
      review/current/LM-134-135-priest-communion-storyboard-v0.2.png.

