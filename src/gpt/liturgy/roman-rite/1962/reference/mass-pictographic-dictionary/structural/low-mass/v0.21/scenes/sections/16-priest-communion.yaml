      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
      - INV-HAND-01
      - INV-BELL-02
    variants: []
    unresolved:
      - "The approved material does not fix the moment at which AC1 takes up the bell before the first \"Domine, non sum dignus\"."
    notes: >-
      Three rings in total, all by AC1 on the Epistle side, one at each of the
      three priestly openings; they are recorded as three separate bell entries
      so that none can be lost in aggregation, per INV-BELL-02. Each opening
      "Domine, non sum dignus" is aloud and the remainder of each repetition is
      low; the single-valued `voice` field cannot carry both, so it records the
      audible openings and this note records the low remainder. The right hand
      strikes the breast once per repetition, with the last three fingers, while
      the left hand holds both the Host and the paten; INV-HAND-01 remains in
      force. Detail preserved from the approved review sheet
      review/current/LM-134-135-priest-communion-storyboard-v0.2.png.

  - scene_id: "LM-135A"
    order: 179
    cluster: "LM-135"
    title: "The priest receives the Sacred Host"
    kind: action
    liturgical_moment: "The priest's Communion under the species of bread"
    text_cue: "Corpus Domini..."
    voice: low
    condition: "ALWAYS"
    predecessor: "LM-134C"
    successor: "LM-135B"
    camera:
      view: nave-front
      note: >-
        The principal depictable instant is the priest bowed low over the altar
        with his forearms on the altar and the paten under his chin as he
        consumes the Host. The actor fields record the state at the end of the
        scene, when he has stood again with his hands joined before his face.
    actors:
      - id: priest
        role: "celebrant"
        anchor: predella-centre
        side: centre
        depth_rank: 2
        posture: standing
        bow: none
        facing: altar
        gaze: downcast
        hands: {joined: true, left: joined-at-chin-height, right: joined-at-chin-height}
        gestures:
          - cross-with-host
          - consume-host
          - rub-fingers-over-paten
          - join-hands
      - id: AC1
        role: "acolyte-epistle-side"
        anchor: step-1-epistle
        side: epistle
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
      - id: AC2
        role: "acolyte-gospel-side"
        anchor: step-1-gospel
        side: gospel
        depth_rank: 1
        posture: kneeling
        bow: none
        facing: altar
        gaze: altar
        hands: {joined: true, left: joined-before-breast, right: joined-before-breast}
        gestures: []
    objects:
      - id: corporal
        placement: mensa-centre
        orientation: unfolded
        state_before: "Unfolded at the centre of the altar."
        state_after: "Unfolded at the centre of the altar."
        handled_by: none
      - id: host-halves
        placement: "Consumed; no longer present on the altar."
        orientation: not-applicable
        state_before: "The two halves held in the priest's left hand with the paten behind them."
        state_after: "Aligned together, taken in the right thumb and index, and consumed. The Sacred Host is no longer on the altar."
        handled_by: priest
      - id: paten
        placement: corporal-right-edge
        orientation: flat-on-mensa
        state_before: "In the priest's left hand, behind the Host halves."
        state_after: "Placed to the front and right of the chalice, on the corporal toward the Epistle side; the priest has rubbed his fingers over it."
        handled_by: priest
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Standing on the corporal, covered by the pall."
        state_after: "Standing on the corporal, covered by the pall, with the paten now to its front and right."
        handled_by: none
      - id: pall
        placement: corporal-back-centre
        orientation: flat-on-mensa
        state_before: "Covering the chalice."
        state_after: "Covering the chalice."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side of the altar."
        state_after: "Open on the Gospel side of the altar."
        handled_by: none
      - id: bell
        placement: step-1-epistle
        orientation: not-applicable
        state_before: "In AC1's right hand."
        state_after: "Set down again on the floor of the lowest step at AC1's right hand, silent."
        handled_by: AC1
    transitions:
      - "The priest stands erect and aligns the two Host halves together."
      - "He takes them in the right thumb and index near the bottom edge."
      - "He makes a large vertical sign of the cross with the Host over the paten, keeping the Host within the edges of the paten."
      - "He says \"Corpus Domini...\" in a low voice, bowing the head at the Holy Name."
      - "He bows low over the altar, his forearms on the altar and the paten held under his chin."
      - "He consumes the Sacred Host."
      - "He stands erect again and places the paten to the front and right of the chalice."
      - "He rubs his fingers over the paten and rejoins the tips of his thumbs and index fingers."
      - "He holds his joined hands before his face for a brief swallowing and meditation pause."
      - "AC1 and AC2 remain kneeling and reverent on the lowest step."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
      - INV-HAND-01
    variants: []
    unresolved: []
    notes: >-
      The sign of the cross with the Host is large and vertical and is made over
      the paten; the Host must not pass beyond the edges of the paten. The bow at
      the Holy Name in the "Corpus Domini" formula is a head bow within the
      scene, distinct from the low bow over the altar that follows. At the close
      of the scene the Host is consumed, the paten lies to the front and right of
      the chalice, and the thumb and index fingertips are rejoined; INV-HAND-01
      remains in force. Detail preserved from the approved review sheet
      review/current/LM-134-135-priest-communion-storyboard-v0.2.png.

