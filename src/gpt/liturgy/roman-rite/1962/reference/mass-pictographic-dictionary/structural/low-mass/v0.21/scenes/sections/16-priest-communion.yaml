        state_before: "Resting on the corporal, bearing the two Host halves."
        state_after: "Taken up into the left hand and held behind the Host halves, so that the Host is framed at the centre of the paten above the corporal."
        handled_by: priest
      - id: host-halves
        placement: "In the priest's left hand, before the paten and above the corporal."
        orientation: nearly-horizontal
        state_before: "The two halves lie together at the centre of the paten on the corporal."
        state_after: "Slid toward the upper right of the paten, then taken up and held in the left hand with the paten behind them."
        handled_by: priest
      - id: chalice
        placement: corporal-back-centre
        orientation: upright
        state_before: "Standing on the corporal, covered by the pall."
        state_after: "Standing on the corporal, covered by the pall."
        handled_by: none
      - id: pall
        placement: corporal-back-centre
        orientation: flat-on-mensa
        state_before: "Covering the chalice."
        state_after: "Covering the chalice."
        handled_by: none
      - id: missal
        placement: mensa-gospel
        orientation: priest-reads-facing-left
        state_before: "Open on the Gospel side of the altar."
        state_after: "Open on the Gospel side of the altar."
        handled_by: none
      - id: bell
        placement: step-1-epistle
        orientation: not-applicable
        state_before: "On the floor of the lowest step at AC1's right hand, silent."
        state_after: "On the floor of the lowest step at AC1's right hand, silent."
        handled_by: none
    transitions:
      - "The priest lays his palms on the corporal and genuflects."
      - "While rising he says in a low voice \"Panem caelestem accipiam...\"."
      - "Standing erect, he slides the two Host halves toward the upper right of the paten."
      - "He takes the Host halves and transfers them to his left hand."
      - "He places the paten behind the Host in the same left hand, so that the Host is framed at the centre of the paten, above the corporal."
      - "AC1 and AC2 remain kneeling and reverent on the lowest step."
    responses: []
    bells: []
    invariants:
      - INV-FORM-01
      - INV-GEO-01
      - INV-GEO-02
      - INV-GEO-03
      - INV-MISSAL-01
      - INV-ROLE-01
      - INV-OBJ-01
      - INV-HAND-01
    variants: []
    unresolved: []
    notes: >-
      The Host halves and the paten are arranged as in the approved late assets:
      the halves slid to the upper right of the paten, taken into the left hand,
      the paten placed behind them in the same hand, the Host framed at the
      centre of the paten above the corporal. INV-HAND-01 remains in force; the
      thumb and index fingertips separate only as far as handling the Sacred
      Host requires. The priest's free right hand rests on the altar outside the
      corporal between the genuflection and the breast strikes of LM-134C.
      Detail preserved from the approved review sheet
      review/current/LM-134-135-priest-communion-storyboard-v0.2.png.

  - scene_id: "LM-134C"
