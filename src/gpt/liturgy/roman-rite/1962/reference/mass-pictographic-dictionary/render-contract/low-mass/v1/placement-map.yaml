schema: triptych.mass_pictographic.placement_map
version: "1.0"
status: render-contract
structural_baseline_commit: "d2e97b5ca"

# Free-text object placements, resolved for the render-contract compiler.
#
# Most `placement` values in the structural corpus are a named anchor from
# geometry.yaml or a named mensa position, and the compiler resolves those
# directly. The 85 keys below are the remainder: prose strings that name a
# place, a pair of hands, or an explicit refusal to fix either. Each key is
# the corpus string VERBATIM, byte for byte, including capitalisation and any
# trailing full stop, because the compiler matches on exact equality and a
# paraphrase silently fails to match.
#
# Nothing here revises approved choreography. This file only says, for each
# prose string, which of three dispositions the compiler must apply.
#
#   held       The object is in an actor's hands or on his person. The
#              compiler parents its transform to that actor, so the file gives
#              `held_by` and no coordinates. Preferred wherever an actor has
#              the object: it is more truthful than a point in space, and it
#              invents nothing.
#
#   positioned The string names a definite place the world frame can express.
#              The file gives explicit world `position: [x, y, z]`, derived
#              from geometry.yaml anchors and mensa positions. Identical
#              physical places carry identical coordinates.
#
#   unplaced   The approved record DELIBERATELY declines to fix the place, and
#              inventing one would be exactly the guessing this contract layer
#              exists to prevent. No coordinates are given; the note says why.
#              Used only where the string itself, or the affected scene's
#              `unresolved` list, shows the record declines to fix it -- never
#              as a resting place for a string that was merely hard.
#
# World frame (world-frame.yaml): +X epistleward, -X gospelward, +Y altarward,
# -Y naveward, +Z up; dimensionless-synthetic units. The mensa surface is
# z = 1.55 and mensa positions sit at y = 1.5. An object resting on the mensa,
# or on the corporal or a paten upon it, is at 1.55; the cup of the chalice
# standing on the corporal is at 1.79, the chalice being 0.24 tall.
# The mensa elevation is resolved from the structural ordinal by
# sanctuary-master.yaml:level_elevations; these literals follow it.

