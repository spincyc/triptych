[[audience_note]]
audience = "general-reader"
text = "This is the distinct under-chin Communion plate, not the priest's smaller paten; the pictured handle belongs to one dated commercial exemplar rather than a prescribed universal form."
claim_ids = ["clm-communion-plate-identity-use", "clm-communion-plate-hirten-exemplars"]

