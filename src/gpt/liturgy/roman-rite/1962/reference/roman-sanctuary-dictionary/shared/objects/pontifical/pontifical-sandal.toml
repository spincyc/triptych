[[claims]]
id = "clm-pontifical-sandal-identity"
kind = "identity"
text = "The Ceremonial distinguishes the pontifical sandal from the buskin and treats it as the outer member of the appointed footwear pair."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-footwear-ce"]

[[claims]]
id = "clm-pontifical-sandal-presence"
kind = "ceremonial-presence"
text = "At the checked Solemn Pontifical Mass vesting, sandals and buskins are brought covered from the credence and put on together, right side before left."
