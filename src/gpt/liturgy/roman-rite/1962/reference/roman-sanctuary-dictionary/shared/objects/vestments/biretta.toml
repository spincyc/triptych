schema_version = 1
id = "obj-biretta"
workflow_state = "art-reviewed"
preferred_english_name = "Biretta"
latin_headword = "biretum"
alternate_english_names = ["clerical square cap"]
alternate_latin_names = []
categories = ["priestly-vestments", "servers-ministers-and-choir"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["low-mass", "missa-cantata", "solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-mitre"]
related_objects = ["obj-cassock"]

[presence]
locations = ["Worn on the priest’s head during the approach to the altar; handed to the minister before the lowest step."]
contexts = ["The 1962 entrance rubric explicitly names the priest’s cap and its reception by the minister."]
local_variability = "possible"

[handling]
ordinary_handlers = ["priest", "other-server", "cleric"]
server_relation = "varies-by-ceremony"

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-biretta-identity"
kind = "identity"
text = "The biretta is the clerical square cap; the checked ordinary form is black cloth with three raised ridges."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-biretta-manual"]

[[claims]]
id = "clm-biretta-appearance"
kind = "appearance"
text = "Identify the square body and three ridges, leaving the fourth side without a ridge. This ordinary form does not establish the colors or privileges of other clerical ranks."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-biretta-manual"]

[[claims]]
id = "clm-biretta-placement"
kind = "placement"
text = "The priest approaches with his head covered, then removes the biretta before the lowest altar step and gives it to the minister."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-biretta-missal"]

[[claims]]
id = "clm-biretta-liturgical-use"
kind = "liturgical-use"
text = "At the entrance the biretta is received from the priest before he begins at the altar."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-biretta-missal"]

[[claims]]
id = "clm-biretta-ceremonial-presence"
kind = "ceremonial-presence"
text = "The 1962 Ritus servandus explicitly includes the cap in the priest’s preparation and arrival at the altar."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-biretta-missal"]

[[claims]]
id = "clm-biretta-handling-boundary"
kind = "handling-boundary"
text = "The minister’s reception of the priest’s biretta is a named action; the cap is not thereby assigned as ordinary server headwear."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-biretta-missal"]

[[sources]]
