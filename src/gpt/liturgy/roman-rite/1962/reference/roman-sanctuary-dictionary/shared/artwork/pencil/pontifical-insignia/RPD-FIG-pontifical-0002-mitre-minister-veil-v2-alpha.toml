Use case: scientific-educational
Asset type: corrected source-controlled graphite handling illustration for a Roman liturgical pictorial dictionary
Primary request: Create one portrait-oriented upper-body study of a mitre minister correctly supporting a plain Roman episcopal mitre through a single neck-hung oblong silk veil. Show one adult male minister from head through waist, wearing a plain cassock and plain white surplice. A single broad plain oblong cloth is unmistakably suspended around the back of his neck, descends continuously in two long front panels, wraps over both hands, and forms the only contact between his hands and the mitre he supports at chest height. Both neck suspension and cloth-covered hand contact must be simultaneously clear.
Source boundary: The official Ceremonial identifies the object only as an oblong silk veil or cloth worn from the neck by the mitre minister so he does not touch the mitre with bare hands, unless vested in a cope. Do not prescribe exact dimensions, color, fastening, fold system, ornament, or a universal mitre profile. Use a deliberately generic plain representative two-panel pointed mitre with two hanging lappets.
Handling geometry: exactly one minister, exactly one mitre, exactly one continuous neck-hung veil, exactly two hands. The veil's left and right panels visibly run without interruption from the neck down to and over the corresponding hands. Fingers may shape the cloth from beneath, but no bare fingertip or palm may touch the mitre. The minister looks calmly forward; no ceremonial transfer or receiving person.
Style/medium: elegant monochrome graphite pencil drawing, fine controlled line, restrained cross-hatching and tonal modeling, historically attentive educational visual-atlas quality.
Composition/framing: centered upper-body portrait with the full head, shoulders, neck loop, both continuous cloth panels, both cloth-covered hands, entire mitre point, base, and paired lappets visible; generous crop safety and clear silhouette.
Backdrop: perfectly flat solid #00ff00 chroma-key background for removal, one uniform color with no shadow, gradient, texture, reflection, floor, horizon, or lighting variation. Keep subject fully separated and do not use green in it.
Constraints: no cope; no stole; no humeral veil around shoulders; no loose detached cloth; no bare-hand contact; no second person; no second mitre; no stand, case, table, throne, altar, crosier, crown, tiara, cross, jewels, coat of arms, words, letters, numerals, arrows, caption, label, border, watermark, cast shadow, scenery, or architecture.
Avoid: cloth that begins only at the hands, disconnected cloth panels, sleeves mistaken for the veil, mitten-like hands, impossible anatomy, copied museum ornament, prescribed dimensions, fantasy vestments, photorealism, cartoon, floating rectangle.
"""

