[[claims]]
id = "clm-mitre-minister-veil-use"
kind = "liturgical-use"
text = "The Ceremonial directs the mitre minister to wear a neck-hung oblong silk veil or cloth and use it to support the mitre without bare-hand contact, unless he wears a cope."
evidence_state = "checked-paraphrase"
source_ids = ["src-mitre-veil-ce"]
as_of = 1962-01-01

[[claims]]
id = "clm-mitre-minister-veil-identity"
kind = "identity"
text = "The Ceremonial identifies a veil or oblong silk cloth assigned to the mitre minister; this checked locus does not call it a vimpa."
evidence_state = "checked-paraphrase"
source_ids = ["src-mitre-veil-ce"]

[[claims]]
id = "clm-mitre-minister-veil-appearance"
kind = "appearance"
text = "The governing description establishes an oblong silk textile hung from the neck, but does not prescribe its dimensions, fastening, breadth, or drape."
evidence_state = "checked-paraphrase"
source_ids = ["src-mitre-veil-ce"]

[[claims]]
id = "clm-mitre-minister-veil-presence"
kind = "ceremonial-presence"
text = "When appointed and not vested in a cope, the mitre minister wears the cloth from his neck while supporting the mitre."
evidence_state = "checked-paraphrase"
source_ids = ["src-mitre-veil-ce"]

