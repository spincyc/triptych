[[claims]]
id = "clm-episcopal-throne-appearance"
kind = "appearance"
text = "The Ceremonial prescribes a high, elevated cathedra or immovable throne on three covered steps, with a silk covering matching the other appointments; a canopy is conditional rather than universal."
evidence_state = "checked-paraphrase"
source_ids = ["src-episcopal-throne-ce"]

[[claims]]
id = "clm-episcopal-throne-use"
kind = "liturgical-use"
text = "The bishop uses this proper seat at solemn Vespers and solemn Mass."
evidence_state = "checked-paraphrase"
source_ids = ["src-episcopal-throne-ce"]

[[claims]]
id = "clm-episcopal-throne-presence"
kind = "ceremonial-presence"
text = "The seat is appointed within the sanctuary according to the arrangement of the sanctuary and choir."
evidence_state = "checked-paraphrase"
source_ids = ["src-episcopal-throne-ce"]

