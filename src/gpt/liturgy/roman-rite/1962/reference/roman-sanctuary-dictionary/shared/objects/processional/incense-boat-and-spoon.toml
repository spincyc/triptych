review_note = "Boundary-safe transparent successor to the project-owned generated edit that removed unsupported granular contents. The grayscale drawing and geometry are unchanged; only the near-white paper matte was converted to graduated alpha. The boat-form body, lid, foot, and separate spoon are bounded by the checked Missal identity and Met exemplar; decorative morphology is illustrative."

[[audience_note]]
audience = "altar-server"
text = "Recognize the boat as the loose-incense container and the spoon as its separate transfer tool; keep the set together. A lay holder or handoff is local training, because the checked Solemn-Mass rubric names the deacon ministering it to the celebrant."
claim_ids = ["clm-incense-boat-identity", "clm-incense-spoon-identity"]

[[audience_note]]
audience = "sacristan"
text = "Prepare and store the boat with its separate spoon; do not treat the exemplar's silver, dimensions, foot, hinge, or ornament as a universal specification."
claim_ids = ["clm-incense-boat-identity", "clm-incense-spoon-identity", "clm-incense-boat-exemplar", "clm-incense-spoon-exemplar"]

[[audience_note]]
audience = "mc-trainer"
text = "Name the boat and spoon distinctly while teaching them as one functional set. Keep the checked deacon-to-celebrant relationship separate from any local lay boat-bearer assignment and both objects away from the hot thurible."
claim_ids = ["clm-incense-boat-identity", "clm-incense-spoon-identity"]

[[audience_note]]
audience = "general-reader"
text = "The boat is the container and its spoon the separate transfer tool; they form one functional set. The pictured hinged, footed form is illustrative rather than prescribed."
claim_ids = ["clm-incense-boat-identity", "clm-incense-spoon-identity", "clm-incense-boat-exemplar"]

[[audience_note]]
audience = "pontifical"
text = "Treat the boat and spoon as one ordinary incense-service set, not as pontifical insignia or a distinct pontifical form."
claim_ids = ["clm-incense-boat-identity", "clm-incense-spoon-identity"]
