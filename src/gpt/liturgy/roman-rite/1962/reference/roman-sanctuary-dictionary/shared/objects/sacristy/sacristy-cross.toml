editorial_note = "The 1962 Missal prescribes the departure reverence toward a cross or image; checked 1943 ceremonial and 1912 specialist witnesses support the return reverence. The isolated pencil figure is one representative plain cross and does not narrow the rubric's image alternative or prescribe morphology."
