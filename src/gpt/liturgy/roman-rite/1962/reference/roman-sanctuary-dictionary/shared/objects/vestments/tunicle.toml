schema_version = 1
id = "obj-tunicle"
workflow_state = "publication-ready"
preferred_english_name = "Tunicle"
latin_headword = "tunicella"
sort_name = "03 Tunicle"
categories = ["deacon-and-subdeacon"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-dalmatic"]
related_objects = ["obj-amice", "obj-alb", "obj-cincture", "obj-maniple"]

[presence]
locations = ["Worn as the subdeacon's outer Mass vestment."]
contexts = ["Part of the subdeacon's ordinary Mass vesture in ceremonies that appoint a subdeacon."]
local_variability = "common"

[handling]
ordinary_handlers = ["subdeacon"]
server_relation = "varies-by-ceremony"
prepares = ["sacristan", "other-server"]
presents = ["acolyte", "other-server"]
warnings = ["Its distinction from the dalmatic can be modest and contextual; the pictured sleeve relation is representative, not universal.", "Checked ceremonial assistance is conditional and does not create a universal acolyte assignment."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-tunicle-identity"
kind = "identity"
text = "The tunicle is the subdeacon's outer Mass vestment."
evidence_state = "checked-paraphrase"
source_ids = ["src-tunicle-fortescue-1943"]

[[claims]]
id = "clm-tunicle-appearance"
kind = "appearance"
text = "A checked ceremonial places the tunicle in the same vestment family as the dalmatic and notes a form with sleeves somewhat longer and narrower; the plate presents that distinction as representative, modest, and non-universal."
evidence_state = "checked-paraphrase"
source_ids = ["src-tunicle-fortescue-1943"]

[[claims]]
id = "clm-tunicle-use"
kind = "liturgical-use"
text = "The checked ceremonial baseline places the tunicle on the subdeacon over the alb, cincture, and maniple."
evidence_state = "checked-paraphrase"
source_ids = ["src-tunicle-fortescue-1943"]

[[claims]]
id = "clm-tunicle-presence"
kind = "ceremonial-presence"
text = "The 1962 General Rubrics retain the subdeacon's tunicle while expressly discontinuing folded chasubles and the broad stole."
evidence_state = "checked-paraphrase"
source_ids = ["src-tunicle-rubrics-1962"]

[[claims]]
id = "clm-tunicle-color"
kind = "variation"
text = "The vestment color follows the Mass or Office under the 1962 General Rubrics, with legitimate indults and customs preserved; the monochrome plate does not encode color."
evidence_state = "checked-paraphrase"
source_ids = ["src-tunicle-color-1962"]

[[claims]]
id = "clm-tunicle-assistance"
kind = "handling-boundary"
text = "A checked contemporary ceremonial describes an acolyte assisting the subdeacon to vest in particular Solemn-Mass preparations; that practical branch is conditional, not a universal server assignment."
evidence_state = "checked-paraphrase"
source_ids = ["src-tunicle-fortescue-assistance-1943"]

[[sources]]
id = "src-tunicle-rubrics-1962"
binding = "artifact.catholic-church.missale-romanum.vatican-typica-1962.cmaa-facsimile-pdf"
locus = "Rubricae generales 133-137, printed p. XX, artifact PDF p. 18."
role = "governing-liturgical-book"
verification_state = "claim-verified"
