[[artwork]]
id = "art-vestments-0009-tunicle"
view = "comparison"
asset = "shared/artwork/pencil/vestments/RPD-FIG-vestments-0009-tunicle-v2.png"
review_state = "approved"
depicts = ["obj-tunicle"]
review_note = "One complete plain representative tunicle is shown front and back. The modest longer-and-narrower sleeve relation is one documented form, not a universal distinction."

[[audience_note]]
audience = "altar-server"
text = "Recognize the tunicle as the subdeacon's outer Mass vestment; present or arrange it only under direction."
claim_ids = ["clm-tunicle-identity", "clm-tunicle-assistance"]

[[audience_note]]
audience = "sacristan"
text = "Ready it with the subdeacon's vestments and applicable color; no fold, storage, fastening, or decorative form is prescribed."
claim_ids = ["clm-tunicle-presence", "clm-tunicle-color", "clm-tunicle-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach it as the subdeacon's outer layer, with dalmatic comparison kept contextual and assistance kept conditional."
claim_ids = ["clm-tunicle-identity", "clm-tunicle-appearance", "clm-tunicle-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The tunicle is the subdeacon's outer Mass vestment; its visual distinction from the dalmatic may be modest."
claim_ids = ["clm-tunicle-identity", "clm-tunicle-appearance"]

[[audience_note]]
audience = "pontifical"
text = "Use this as the ordinary subdiaconal recognition baseline within pontifical compositions; no pontifical layering sequence is inferred."
claim_ids = ["clm-tunicle-presence"]
