[[claims]]
id = "clm-pontifical-gloves-vesting"
kind = "liturgical-use"
text = "In the checked pontifical-vesting sequence the deacon puts the glove on the bishop's right hand and the subdeacon puts the glove on his left."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-gloves-ce"]
as_of = 1962-01-01

[[claims]]
id = "clm-pontifical-gloves-variation"
kind = "variation"
text = "The 1893 catalog documents bishops' gloves in several colors, plain or with embroidered crosses, without making any treatment universal."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-gloves-benziger"]

[[claims]]
id = "clm-pontifical-gloves-identity"
kind = "identity"
text = "The Ceremonial identifies the pontifical gloves as a paired episcopal vesting object, one for each hand."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-gloves-ce"]

[[claims]]
id = "clm-pontifical-gloves-appearance"
kind = "appearance"
text = "The catalog witness shows that pontifical gloves may be plain or cross-embroidered and occur in several colors; it establishes no universal cuff, textile, dimensions, or construction."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-gloves-benziger"]

[[claims]]
id = "clm-pontifical-gloves-presence"
kind = "ceremonial-presence"
text = "In the checked Solemn Pontifical Mass vesting, the gloves are put on before the chasuble and before the ring."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-gloves-ce"]

