[[audience_note]]
audience = "altar-server"
text = "The sacristy lavatory is where the clergy wash their hands before vesting. Never guess whether a similar-looking fitting is the piscina or where anything may be poured: ask the priest or sacristan."
claim_ids = ["clm-sacristy-lavatory-identity", "clm-sacristy-lavatory-form", "clm-sacristy-lavatory-distinction"]

[[audience_note]]
audience = "sacristan"
text = "Identify the local clergy handwashing arrangement and keep ordinary washing distinct from the special disposal route. Purpose, outlet, and disposal practice require local direction, not visual inference."
claim_ids = ["clm-sacristy-lavatory-identity", "clm-sacristy-lavatory-form", "clm-sacristy-lavatory-distinction"]
