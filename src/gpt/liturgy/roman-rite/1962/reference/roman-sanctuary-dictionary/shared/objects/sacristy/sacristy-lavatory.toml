schema_version = 1
id = "obj-sacristy-lavatory"
workflow_state = "source-audited"
presentation_mode = "text-only"
editorial_note = "The universal 1962 rule is the priest's preparatory handwashing action. The dated specialist witness calls the practical sacristy furnishing a lavatory, but neither source establishes a universal sink or basin form, plumbing, outlet, furniture, or fixed location. The canonical record is retained for terminology and comparison but excluded from pictorial publication until a checked material exemplar can control an honest drawing."
preferred_english_name = "Sacristy lavatory"
latin_headword = "unresolved"
alternate_english_names = ["clergy handwashing sink", "clergy handwashing basin", "sacristy sink", "handwashing place"]
categories = ["church-and-sanctuary"]
periods = ["roman-1962-horizon"]
statuses = ["practical-local-furnishing"]
ceremonies = ["low-mass", "missa-cantata", "solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-piscina-sacrarium"]
artwork = []

[presence]
locations = ["A locally appointed place in or near the sacristy for the celebrant's preparatory handwashing."]
contexts = ["The priest's handwashing action is prescribed before he arranges the chalice and vests; the furnishing that serves it is practical and locally variable."]
composition_ids = []
local_variability = "defining"

[handling]
ordinary_handlers = ["priest", "bishop", "cleric", "sacristan"]
server_relation = "recognizes-only"
warnings = ["Learn locally which fitting or arrangement serves ordinary handwashing and which, if any, is the piscina or sacrarium.", "Never infer a fitting's purpose, outlet, or disposal use from appearance; follow local direction."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "useful"

[[claims]]
id = "clm-sacristy-lavatory-identity"
kind = "identity"
text = "A sacristy lavatory is the practical local sink, basin, or other appointed place at which the clergy wash their hands; the universal 1962 rule is the priest's preparatory handwashing action, not one prescribed furnishing form."
evidence_state = "checked-paraphrase"
source_ids = ["src-sacristy-lavatory-missal", "src-sacristy-lavatory-ce"]

[[claims]]
id = "clm-sacristy-lavatory-form"
kind = "appearance"
text = "The governing rubric prescribes the handwashing action but not a basin, sink, plumbing arrangement, furniture form, material, dimension, or fixed location."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-sacristy-lavatory-missal"]

[[claims]]
id = "clm-sacristy-lavatory-distinction"
kind = "identity"
text = "An ordinary handwashing fitting is not identified as a piscina or sacrarium merely because it has a basin or drain; purpose, outlet, and disposal practice must be learned locally."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-sacristy-lavatory-missal", "src-sacristy-lavatory-ce"]

[[claims]]
id = "clm-sacristy-lavatory-offertory"
kind = "liturgical-use"
text = "The fixed or locally appointed sacristy lavatory is distinct from the portable water vessel, basin, and manuterge used for the Offertory Lavabo."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-sacristy-lavatory-missal"]

