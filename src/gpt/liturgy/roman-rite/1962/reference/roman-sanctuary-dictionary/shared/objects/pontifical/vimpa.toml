schema_version = 1
id = "obj-vimpa"
workflow_state = "publication-ready"
preferred_english_name = "Vimpa"
latin_headword = "vimpa"
alternate_english_names = ["Insignia-bearer's veil"]
alternate_latin_names = ["velum", "mappa"]
sort_name = "Vimpa"
categories = ["pontifical-and-prelatial", "linens-and-textiles"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["pontifical-mass", "ceremony-surrounding-mass"]
confusable_with = ["obj-mitre-minister-veil", "obj-gremial"]
related_objects = ["obj-mitre", "obj-crosier"]
component_objects = []
editorial_note = "Fortescue supports the familiar headword and matching mitre- and crosier-bearer use. The official locus expressly controls the mitre minister's veil; its crosier section instead describes the cotta-end method."

[presence]
locations = ["Worn by an appointed insignia bearer."]
contexts = ["Mitre-bearing under the checked official locus and mitre- or crosier-bearing in the checked contemporary customary account."]
composition_ids = ["plt-pontifical-insignia"]
local_variability = "possible"

[handling]
ordinary_handlers = ["cleric"]
server_relation = "recognizes-only"
prepares = ["sacristan"]
presents = []
receives = []
stores = ["sacristan"]
warnings = ["Do not describe the crosier-bearer vimpa as an express prescription of the checked official passage."]

[audience_relevance]
altar_server = "exclude"
sacristan = "exclude"
mc_trainer = "exclude"
general_reader = "exclude"
pontifical = "required"

[[claims]]
id = "clm-vimpa-customary-identity"
kind = "identity"
text = "Fortescue calls the thin silk scarf-like veil a vimpa and describes matching use by the mitre- and crosier-bearers."
evidence_state = "checked-paraphrase"
source_ids = ["src-vimpa-fortescue"]

[[claims]]
id = "clm-vimpa-mitre-function"
kind = "liturgical-use"
text = "The Ceremonial expressly provides the mitre minister a neck-hung oblong silk veil or cloth with which to support the mitre without bare-hand contact."
evidence_state = "checked-paraphrase"
source_ids = ["src-vimpa-ce"]
as_of = 1962-01-01

[[claims]]
id = "clm-vimpa-customary-appearance"
kind = "appearance"
text = "Fortescue describes the customary vimpa as a thin white silk scarf, like a broad stole, worn around the neck and tied in front; this account does not prescribe exact dimensions, ornament, or construction."
evidence_state = "checked-paraphrase"
source_ids = ["src-vimpa-fortescue"]

[[claims]]
id = "clm-vimpa-ceremonial-presence"
kind = "ceremonial-presence"
text = "At pontifical functions in Fortescue's account, the mitre- and crosier-bearers hold those insignia through matching vimpae; the checked Ceremonial expressly prescribes the neck-hung cloth for the mitre minister, while its crosier provision instead directs use of the cotta's end."
evidence_state = "checked-paraphrase"
source_ids = ["src-vimpa-fortescue", "src-vimpa-ce"]
as_of = 1962-01-01

[[sources]]
id = "src-vimpa-fortescue"
binding = "passage.adrian-fortescue.ceremonies-of-the-roman-rite-described.seventh-revised-1943.p-10"
locus = "Printed p. 10; see also registered p. 157 passage for the bearer context."
role = "manual"
verification_state = "claim-verified"
checked_on = 2026-07-28

[[sources]]
id = "src-vimpa-ce"
