[[artwork]]
id = "art-related-ceremonies-0003-basilical-conopaeum"
view = "isolated"
asset = "shared/artwork/pencil/processional-objects/RPD-FIG-related-ceremonies-0003-basilical-conopaeum-v3-alpha.png"
review_state = "approved"
depicts = ["obj-basilical-conopaeum"]
scale_mode = "not-applicable"
review_note = "Project-generated graphite recognition view of one partially opened conical form. Alternating hatching, finial, panel count, opening state, staff details, dimensions, material, color, and ornament are representative rather than universal."

[[audience_note]]
audience = "sacristan"
text = "Treat this as conditional institutional insignia. Prepare, place, or store it only under the basilica's actual privilege and local assignment; the plate prescribes no construction or method."
claim_ids = ["clm-basilical-conopaeum-identity", "clm-basilical-conopaeum-appearance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach this only in a basilical or institutional branch, paired conceptually with the tintinnabulum and kept distinct from every Eucharistic canopy."
claim_ids = ["clm-basilical-conopaeum-identity"]

[[audience_note]]
audience = "pontifical"
text = "Cross-reference this as basilical institutional insignia only; it is not pontifical insignia and creates no pontifical ceremonial assignment."
claim_ids = ["clm-basilical-conopaeum-identity"]
