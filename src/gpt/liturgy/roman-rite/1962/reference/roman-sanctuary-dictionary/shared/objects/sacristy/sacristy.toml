disclosed_gaps = [
  { id = "gap-sacristy-composition", kind = "scope", target_ids = ["obj-sacristy", "art-sacristy-preparation-plate"], summary = "The representative objects are isolated on one plate and do not establish what every sacristy contains or where furnishings stand." },
  { id = "gap-sacristy-composition-art", kind = "artwork", target_ids = ["art-sacristy-preparation-plate"], summary = "The generated plate has not passed factual, visual, print, priestly, or consumer review." },
]
review_prompts = [
  { id = "prq-sacristy-composition", question = "Does this bounded definition and generated review plate match the sacristy a server needs to recognize, and what liturgically relevant room feature is missing without turning the entry into a catalog of incidental furniture?", gap_ids = ["gap-sacristy-composition", "gap-sacristy-composition-art"], target_ids = ["obj-sacristy", "art-sacristy-preparation-plate"] },
