editorial_note = "The universal-Roman tag identifies the ordinary Roman clothing context, not a universal requirement that every server wear this exemplar or color. This bounded entry establishes ordinary Low-Mass and choir recognition; rank-specific dress and other ceremony branches remain outside it."

[presence]
locations = ["Worn beneath the surplice by a server in the checked ordinary dress arrangement."]
contexts = ["Ordinary server and choir dress described by Fortescue–O'Connell (1943)."]
composition_ids = ["plt-server-clothing"]
local_variability = "common"

[handling]
ordinary_handlers = ["other-server", "cleric", "choir-member"]
server_relation = "handles"
warnings = ["The checked ceremonial records a recognized custom of serving in lay dress; the pictured black cassock is a common arrangement, not a color rule for every server. The pictured tailoring and button count are representative."]

[audience_relevance]
altar_server = "required"
sacristan = "useful"
mc_trainer = "required"
general_reader = "required"
pontifical = "useful"

[[claims]]
id = "clm-cassock-identity"
kind = "identity"
text = "The cassock is the long garment worn beneath the surplice in ordinary server dress."
