source_ids = ["src-cassock-fortescue-1943", "src-cassock-hirten-1952"]

[[claims]]
id = "clm-cassock-appearance"
kind = "appearance"
text = "A 1952 catalog shows a long-sleeved, full-length cassock. The drawing represents that general form; its tailoring and button count are not prescribed."
evidence_state = "checked-paraphrase"
source_ids = ["src-cassock-hirten-1952"]

[[claims]]
id = "clm-cassock-use"
kind = "liturgical-use"
text = "Fortescue–O'Connell describes the server putting on cassock and surplice before Low Mass."
