schema_version = 1
id = "obj-dalmatic"
workflow_state = "publication-ready"
preferred_english_name = "Dalmatic"
latin_headword = "dalmatica"
sort_name = "02 Dalmatic"
categories = ["deacon-and-subdeacon"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-tunicle"]
related_objects = ["obj-amice", "obj-alb", "obj-cincture", "obj-maniple", "obj-deacon-stole"]

[presence]
locations = ["Worn as the deacon's outer Mass vestment."]
contexts = ["Part of the deacon's ordinary Mass vesture in ceremonies that appoint a deacon."]
local_variability = "common"

[handling]
ordinary_handlers = ["deacon"]
server_relation = "varies-by-ceremony"
prepares = ["sacristan", "other-server"]
presents = ["acolyte", "other-server"]
warnings = ["The pictured plain T-shaped form is representative, not a prescribed or universal cut.", "Checked ceremonial assistance is conditional and does not create a universal acolyte assignment."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-dalmatic-identity"
kind = "identity"
text = "The dalmatic is the deacon's outer Mass vestment, worn over the alb and diagonal stole."
evidence_state = "checked-paraphrase"
source_ids = ["src-dalmatic-fortescue-1943"]

[[claims]]
id = "clm-dalmatic-appearance"
kind = "appearance"
text = "The plate shows one representative loose T-shaped form with a round head opening, broad short sleeves, and modest lower side openings; cut, length, opening, textile, ornament, and proportion are not prescribed here."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-dalmatic-fortescue-1943"]

[[claims]]
id = "clm-dalmatic-use"
kind = "liturgical-use"
text = "The checked ceremonial baseline places the dalmatic on the deacon over the alb, cincture, maniple, and diagonal stole."
evidence_state = "checked-paraphrase"
source_ids = ["src-dalmatic-fortescue-1943"]

[[claims]]
id = "clm-dalmatic-presence"
kind = "ceremonial-presence"
text = "The 1962 General Rubrics retain the deacon's dalmatic while expressly discontinuing folded chasubles and the broad stole."
evidence_state = "checked-paraphrase"
source_ids = ["src-dalmatic-rubrics-1962"]

[[claims]]
id = "clm-dalmatic-color"
kind = "variation"
text = "The vestment color follows the Mass or Office under the 1962 General Rubrics, with legitimate indults and customs preserved; the monochrome plate does not encode color."
evidence_state = "checked-paraphrase"
source_ids = ["src-dalmatic-color-1962"]

[[claims]]
id = "clm-dalmatic-assistance"
kind = "handling-boundary"
text = "A checked contemporary ceremonial describes an acolyte assisting the deacon to vest in particular Solemn-Mass preparations; that practical branch is conditional, not a universal server assignment."
evidence_state = "checked-paraphrase"
source_ids = ["src-dalmatic-fortescue-assistance-1943"]

