[[audience_note]]
audience = "altar-server"
text = "Recognize the dalmatic as the deacon's outer Mass vestment; present or arrange it only under direction."
claim_ids = ["clm-dalmatic-identity", "clm-dalmatic-assistance"]

[[audience_note]]
audience = "sacristan"
text = "Ready it with the deacon's vestments and applicable color; no fold, storage, fastening, or decorative form is prescribed."
claim_ids = ["clm-dalmatic-presence", "clm-dalmatic-color", "clm-dalmatic-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach it as the deacon's outer layer over the diagonal stole, while separating conditional assistance from universal rules."
claim_ids = ["clm-dalmatic-identity", "clm-dalmatic-presence", "clm-dalmatic-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The dalmatic is the deacon's outer Mass vestment; the pictured cut is representative."
claim_ids = ["clm-dalmatic-identity", "clm-dalmatic-appearance"]

[[audience_note]]
audience = "pontifical"
text = "Use this as the ordinary diaconal recognition baseline within pontifical compositions; no pontifical layering sequence is inferred."
claim_ids = ["clm-dalmatic-presence"]
