schema_version = 1
id = "obj-priest-stole"
workflow_state = "publication-ready"
preferred_english_name = "Priest's stole"
latin_headword = "stola"
sort_name = "05 Priest stole"
categories = ["priestly-vestments"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["low-mass", "missa-cantata", "solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-maniple"]
related_objects = ["obj-cincture", "obj-chasuble"]

[presence]
locations = ["Placed around the priest's neck, crossed over the breast, and secured by the cincture."]
contexts = ["Put on after the maniple and before the chasuble in the ordinary priest's sequence."]

[handling]
ordinary_handlers = ["priest"]
server_relation = "varies-by-ceremony"
prepares = ["sacristan", "other-server"]
presents = ["other-server"]
warnings = ["The crossed arrangement is the ordinary priest's arrangement in this exact 1962 locus; it is not the bishop's or deacon's arrangement."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-priest-stole-identity"
kind = "identity"
text = "The priest's stole is the long narrow neck-worn vestment put on after the maniple."
evidence_state = "checked-paraphrase"
source_ids = ["src-priest-stole-missal-1962", "src-priest-stole-fortescue-1943"]

[[claims]]
id = "clm-priest-stole-appearance"
kind = "appearance"
text = "The plate pairs one plain long narrow band with the checked ordinary priestly crossed-front arrangement; fringe, end shape, crosses, dimensions, textile, and ornament are representative only."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-priest-stole-missal-1962", "src-priest-stole-fortescue-1943", "src-priest-stole-fortescue-1917", "src-priest-stole-casanowicz", "src-priest-stole-met"]

[[claims]]
id = "clm-priest-stole-use"
kind = "liturgical-use"
text = "The ordinary priest places it around his neck, crosses it over the breast, and secures both ends with the cincture."
evidence_state = "checked-paraphrase"
source_ids = ["src-priest-stole-missal-1962"]

[[claims]]
id = "clm-priest-stole-presence"
kind = "ceremonial-presence"
text = "It belongs to the ordinary priestly vesture for Mass at the 1962 horizon."
evidence_state = "checked-paraphrase"
source_ids = ["src-priest-stole-missal-1962"]

[[claims]]
id = "clm-priest-stole-assistance"
kind = "handling-boundary"
text = "A checked contemporary ceremonial permits preparation by the sacristan or partly by the server according to custom and describes handing or arranging the stole; this is not a universal server assignment."
evidence_state = "checked-paraphrase"
source_ids = ["src-priest-stole-fortescue-1943"]

