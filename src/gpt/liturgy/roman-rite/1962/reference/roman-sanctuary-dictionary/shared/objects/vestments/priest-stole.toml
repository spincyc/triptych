[[artwork]]
id = "art-vestments-0005-priest-stole-v3-alpha"
view = "comparison"
asset = "shared/artwork/pencil/vestments/RPD-FIG-vestments-0005-priest-stole-v3-alpha.png"
review_state = "approved"
depicts = ["obj-priest-stole"]
review_note = "One complete isolated stole and one anonymous torso inset show only the ordinary priest's crossed, cincture-secured arrangement. No episcopal or diaconal arrangement is implied."

[[audience_note]]
audience = "altar-server"
text = "Recognize the priest's long stole and crossed-front arrangement; offer or arrange it only under direction."
claim_ids = ["clm-priest-stole-identity", "clm-priest-stole-use", "clm-priest-stole-assistance"]

[[audience_note]]
audience = "sacristan"
text = "In the checked reverse-order table arrangement, ready it beneath the maniple and above the chasuble; this record gives no folding or storage prescription."
claim_ids = ["clm-priest-stole-use", "clm-priest-stole-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach sequence and the priest's crossed arrangement while distinguishing the bishop's hanging and deacon's diagonal arrangements."
claim_ids = ["clm-priest-stole-use", "clm-priest-stole-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The priest wears this long band around the neck, crossed and secured by the cincture."
claim_ids = ["clm-priest-stole-identity", "clm-priest-stole-use"]

[[audience_note]]
audience = "pontifical"
text = "Use this to contrast the ordinary priest's crossed arrangement with the bishop's hanging stole."
claim_ids = ["clm-priest-stole-use"]
