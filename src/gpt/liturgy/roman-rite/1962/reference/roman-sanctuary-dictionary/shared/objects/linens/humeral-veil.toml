text = "Recognize the broad shoulder veil and the subdeacon’s role; this entry assigns no sacred-vessel handling to a lay server."
claim_ids = ["clm-humeral-veil-identity", "clm-humeral-veil-appearance", "clm-humeral-veil-placement", "clm-humeral-veil-liturgical-use", "clm-humeral-veil-ceremonial-presence", "clm-humeral-veil-handling-boundary"]

[[audience_note]]
audience = "sacristan"
text = "Keep the humeral veil distinct from an amice or stole; the present record controls its Solemn Mass use only."
claim_ids = ["clm-humeral-veil-identity", "clm-humeral-veil-appearance", "clm-humeral-veil-placement", "clm-humeral-veil-liturgical-use", "clm-humeral-veil-ceremonial-presence", "clm-humeral-veil-handling-boundary"]

[[audience_note]]
audience = "mc-trainer"
