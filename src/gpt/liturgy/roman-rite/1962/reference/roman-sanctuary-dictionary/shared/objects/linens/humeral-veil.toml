schema_version = 1
id = "obj-humeral-veil"
workflow_state = "art-reviewed"
preferred_english_name = "Humeral veil"
latin_headword = "velum humerale"
alternate_english_names = ["shoulder veil"]
alternate_latin_names = []
categories = ["deacon-and-subdeacon", "related-ceremonies"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["solemn-mass"]
confusable_with = ["obj-amice", "obj-priest-stole", "obj-deacon-stole", "obj-vimpa"]
related_objects = ["obj-paten", "obj-chalice", "obj-cope"]

[presence]
locations = ["Across the shoulders, with its ends extending over the hands for the appointed carrying or holding action."]
contexts = ["This record verifies the subdeacon’s use in Solemn Mass; related-ceremony uses require their own precise rite controls."]
local_variability = "possible"

[handling]
ordinary_handlers = ["subdeacon", "deacon"]
server_relation = "recognizes-only"
warnings = ["Shoulder-and-hand study only; the wearer’s plain clothing is illustrative."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-humeral-veil-identity"
kind = "identity"
text = "The humeral veil is a broad oblong shoulder textile whose ends cover the hands for the appointed use."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-humeral-veil-manual"]

[[claims]]
id = "clm-humeral-veil-appearance"
kind = "appearance"
text = "The ceremonial describes a broad oblong of silk, worn over the shoulders. Width and hand-covering purpose distinguish it from a narrow stole; the isolated study prescribes no dimensions, ornament, pockets or fastener."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-humeral-veil-manual"]

[[claims]]
id = "clm-humeral-veil-placement"
kind = "placement"
text = "In Solemn Mass the veil is suspended from the subdeacon’s neck and covers the left hand as he brings the chalice from the credence."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-humeral-veil-missal"]

[[claims]]
id = "clm-humeral-veil-liturgical-use"
kind = "liturgical-use"
text = "After the Offertory preparation, the deacon gives the paten into the subdeacon’s right hand and covers it with the end of the shoulder veil; the subdeacon holds it behind the celebrant."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-humeral-veil-missal"]

[[claims]]
id = "clm-humeral-veil-ceremonial-presence"
kind = "ceremonial-presence"
text = "The 1962 Ritus servandus describes this use at Solemn Mass and expressly excludes the subdeacon’s holding of the paten in Masses for the dead."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-humeral-veil-missal"]

[[claims]]
id = "clm-humeral-veil-handling-boundary"
kind = "handling-boundary"
text = "The described paten handoff belongs to the deacon and subdeacon. Recognition of the veil gives a lay server no assignment to carry the chalice or hold the paten in this role."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-humeral-veil-missal"]

[[sources]]
