source_ids = ["src-missale-1962-ritus-vii-x", "src-asg-source-audit-cruets", "src-gorham-1914-cruets", "src-met-200141-cruet-pair"]
as_of = 1962-01-01

[[claims]]
id = "clm-altar-cruet-presence-use"
kind = "liturgical-use"
text = "The 1962 Offertory and ablution rites require wine and water to be supplied to the celebrant; the checked server model uses two altar cruets for that service."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-missale-1962-ritus-vii-x", "src-asg-source-audit-cruets"]
as_of = 1962-01-01

[[claims]]
id = "clm-altar-cruet-ceremonial-presence"
