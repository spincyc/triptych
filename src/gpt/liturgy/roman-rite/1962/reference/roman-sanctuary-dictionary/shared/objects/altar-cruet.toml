schema_version = 1
id = "obj-altar-cruet"
workflow_state = "publication-ready"
editorial_note = "The checked Missal and disclosed server-manual synthesis support the wine-and-water service. A dated manufacturer catalog and two cataloged museum witnesses support a small paired-cruet teaching plate while demonstrating substantial variation in material, body, ornament, marking, closure, and handle. A Latin headword is deliberately not asserted because the present audit did not close the lexical question; any universal arrangement remains open."
preferred_english_name = "Altar cruet"
latin_headword = "Latin term not asserted"
alternate_english_names = ["Cruet", "Paired altar cruets"]
alternate_latin_names = []
sort_name = "Cruet, altar"
categories = ["service-objects"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["low-mass", "missa-cantata", "solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass", "holy-thursday"]
confusable_with = ["obj-chalice"]
related_objects = ["obj-chalice"]
component_objects = []

[presence]
locations = ["Prepared near the altar, ordinarily at the credence."]
contexts = ["A cruet supplies wine or water at the Offertory or ablutions; two are ordinarily prepared together for the wine-and-water service."]
composition_ids = []
local_variability = "possible"

[handling]
ordinary_handlers = ["acolyte", "other-server", "sacristan", "priest", "deacon", "subdeacon"]
server_relation = "presents"
prepares = ["sacristan"]
presents = ["acolyte", "other-server"]
receives = ["acolyte", "other-server"]
stores = ["sacristan"]
warnings = ["Identify which cruet contains wine and which contains water before presentation; markings and vessel forms vary locally."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "useful"

[[claims]]
id = "clm-altar-cruet-identity"
kind = "identity"
text = "An altar cruet is a small pouring vessel prepared to supply wine or water for the Mass; two are ordinarily prepared together for the wine-and-water service."
