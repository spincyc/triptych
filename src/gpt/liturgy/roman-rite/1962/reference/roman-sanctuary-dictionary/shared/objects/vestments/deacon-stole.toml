schema_version = 1
id = "obj-deacon-stole"
workflow_state = "publication-ready"
preferred_english_name = "Deacon's stole"
latin_headword = "stola"
sort_name = "01 Deacon stole"
categories = ["deacon-and-subdeacon"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-priest-stole", "obj-maniple"]
related_objects = ["obj-amice", "obj-alb", "obj-cincture", "obj-maniple", "obj-dalmatic"]

[presence]
locations = ["Worn by the deacon over the alb and beneath the dalmatic."]
contexts = ["Part of the deacon's ordinary Mass vesture in ceremonies that appoint a deacon."]

[handling]
ordinary_handlers = ["deacon"]
server_relation = "varies-by-ceremony"
prepares = ["sacristan", "other-server"]
presents = ["acolyte", "other-server"]
warnings = ["The diagonal arrangement belongs to the deacon, not the priest.", "Checked ceremonial assistance is conditional and does not create a universal acolyte assignment."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-deacon-stole-identity"
kind = "identity"
text = "The deacon's stole is the long narrow vestment worn diagonally from the left shoulder under the right arm."
evidence_state = "checked-paraphrase"
source_ids = ["src-deacon-stole-fortescue-1943"]

[[claims]]
id = "clm-deacon-stole-use"
kind = "liturgical-use"
text = "The checked ceremonial baseline places it over the alb and beneath the dalmatic, with the two ends secured at the right side."
evidence_state = "checked-paraphrase"
source_ids = ["src-deacon-stole-fortescue-1943"]

[[claims]]
id = "clm-deacon-stole-appearance"
kind = "appearance"
text = "The plate shows one representative complete diagonal arrangement on an anonymous front-and-back torso study; proportions, fastening, hanging lengths, textile, and ornament are illustrative rather than prescribed."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-deacon-stole-fortescue-1943"]

[[claims]]
id = "clm-deacon-stole-presence"
kind = "ceremonial-presence"
text = "At the 1962 horizon the deacon retains the stole and dalmatic; the folded chasuble and broad stole are expressly no longer used."
evidence_state = "checked-paraphrase"
source_ids = ["src-deacon-stole-rubrics-1962"]

[[claims]]
id = "clm-deacon-stole-color"
kind = "variation"
text = "The vestment color follows the Mass or Office under the 1962 General Rubrics, with legitimate indults and customs preserved; the monochrome plate does not encode color."
evidence_state = "checked-paraphrase"
source_ids = ["src-deacon-stole-color-1962"]

[[claims]]
id = "clm-deacon-stole-assistance"
kind = "handling-boundary"
text = "A checked contemporary ceremonial describes an acolyte assisting the deacon to vest in particular Solemn-Mass preparations; that practical branch is conditional, not a universal server assignment."
evidence_state = "checked-paraphrase"
source_ids = ["src-deacon-stole-fortescue-assistance-1943"]

[[sources]]
