[[artwork]]
id = "art-vestments-0007-deacon-stole"
view = "comparison"
asset = "shared/artwork/pencil/vestments/RPD-FIG-vestments-0007-deacon-stole-v4-alpha.png"
review_state = "approved"
depicts = ["obj-deacon-stole"]
review_note = "Anonymous front and back torso studies show one representative complete diagonal route. Alb, cincture, proportions, fastening, and hanging lengths are illustrative; no decoration or universal fastening method is implied."

[[audience_note]]
audience = "altar-server"
text = "Recognize the deacon by the stole running from left shoulder to right side; assist with it only under direction."
claim_ids = ["clm-deacon-stole-identity", "clm-deacon-stole-assistance"]

[[audience_note]]
audience = "sacristan"
text = "Ready it with the deacon's Mass vestments and applicable color; this record prescribes no fold, storage, or fastening method."
claim_ids = ["clm-deacon-stole-use", "clm-deacon-stole-color", "clm-deacon-stole-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach the left-shoulder diagonal route beneath the dalmatic, while keeping conditional assistance and the abolished broad-stole branch distinct."
claim_ids = ["clm-deacon-stole-use", "clm-deacon-stole-presence", "clm-deacon-stole-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The deacon's stole crosses diagonally from the left shoulder instead of hanging like the priest's stole."
claim_ids = ["clm-deacon-stole-identity"]

[[audience_note]]
audience = "pontifical"
text = "Use this as the ordinary diaconal recognition baseline within pontifical compositions; it does not establish a pontifical vesting sequence."
claim_ids = ["clm-deacon-stole-presence"]
