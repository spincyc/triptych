[[audience_note]]
audience = "altar-server"
text = "Recognize the amice as the first layer. Offer or arrange it only under the celebrant's or local ceremonial direction."
claim_ids = ["clm-amice-identity", "clm-amice-use", "clm-amice-assistance"]

[[audience_note]]
audience = "sacristan"
text = "In the checked reverse-order table arrangement, ready the amice uppermost so it is taken first; exact folding and local allocation are not prescribed here."
claim_ids = ["clm-amice-use", "clm-amice-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach the amice before the alb; distinguish Missal sequence from locally assigned assistance."
claim_ids = ["clm-amice-use", "clm-amice-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The rectangular linen amice covers the neck and clothing collar beneath the alb."
claim_ids = ["clm-amice-identity", "clm-amice-appearance", "clm-amice-use"]

[[audience_note]]
audience = "pontifical"
text = "Use this as the ordinary priestly baseline only; it does not establish an episcopal vesting sequence."
claim_ids = ["clm-amice-presence"]

