[[claims]]
id = "clm-amice-identity"
kind = "identity"
text = "The amice is the first vestment in the 1962 Missal's ordinary priestly vesting sequence."
evidence_state = "checked-paraphrase"
source_ids = ["src-amice-missal-1962"]

[[claims]]
id = "clm-amice-appearance"
kind = "appearance"
text = "A checked contemporary ceremonial describes it as a rectangular linen cloth with two long ties; the plate does not prescribe dimensions, fold, cross, apparel, ornament, or tying method."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-amice-fortescue-1943", "src-amice-fortescue-1917", "src-amice-casanowicz"]

[[claims]]
id = "clm-amice-use"
kind = "liturgical-use"
text = "The priest puts on the amice before the alb."
evidence_state = "checked-paraphrase"
source_ids = ["src-amice-missal-1962"]

[[claims]]
id = "clm-amice-presence"
kind = "ceremonial-presence"
text = "It belongs to the ordinary priestly vesture for Mass at the 1962 horizon."
evidence_state = "checked-paraphrase"
source_ids = ["src-amice-missal-1962"]

[[claims]]
id = "clm-amice-assistance"
kind = "handling-boundary"
text = "A checked contemporary ceremonial permits preparation by the sacristan or partly by the server according to custom and describes server assistance with handing vestments; this is a practical/custom model, not a universal assignment."
evidence_state = "checked-paraphrase"
source_ids = ["src-amice-fortescue-1943"]

