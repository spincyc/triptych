[[audience_note]]
audience = "sacristan"
text = "In the checked reverse-order table arrangement, ready the amice uppermost so it is taken first; exact folding and local allocation are not prescribed here."
claim_ids = ["clm-amice-use", "clm-amice-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach the amice before the alb; distinguish Missal sequence from locally assigned assistance."
claim_ids = ["clm-amice-use", "clm-amice-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The amice is the first, rectangular linen layer in the ordinary priestly sequence."
claim_ids = ["clm-amice-identity", "clm-amice-appearance"]

[[audience_note]]
audience = "pontifical"
text = "Use this as the ordinary priestly baseline only; it does not establish an episcopal vesting sequence."
claim_ids = ["clm-amice-presence"]
