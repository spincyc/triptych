schema_version = 1
id = "obj-pontifical-ring"
workflow_state = "publication-ready"
preferred_english_name = "Pontifical ring"
latin_headword = "annulus pontificalis"
alternate_english_names = ["Episcopal ring"]
alternate_latin_names = []
sort_name = "Ring, pontifical"
categories = ["pontifical-and-prelatial"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["pontifical-mass", "ceremony-surrounding-mass"]
confusable_with = []
related_objects = ["obj-pontifical-gloves"]
component_objects = []
editorial_note = "The isolated ring's substantial scale and plain raised oval setting are editorial recognition conventions, not prescribed features."

[presence]
locations = ["On the ring finger of the bishop's right hand when appointed."]
contexts = ["Pontifical vesting after the gloves in the checked sequence."]
composition_ids = ["plt-pontifical-insignia"]
local_variability = "possible"

[handling]
ordinary_handlers = ["bishop", "priest", "sacristan"]
server_relation = "recognizes-only"
prepares = ["sacristan"]
presents = ["priest"]
