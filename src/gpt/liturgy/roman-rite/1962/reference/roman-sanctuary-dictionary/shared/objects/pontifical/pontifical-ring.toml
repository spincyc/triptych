stores = ["sacristan"]
warnings = []

[audience_relevance]
altar_server = "exclude"
sacristan = "exclude"
mc_trainer = "exclude"
general_reader = "exclude"
pontifical = "required"

[[claims]]
id = "clm-pontifical-ring-vesting"
kind = "liturgical-use"
text = "After the intervening vesting actions, the assistant priest puts the pontifical ring on the ring finger of the bishop's right hand."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-ring-ce"]
as_of = 1962-01-01

[[claims]]
id = "clm-pontifical-ring-class"
kind = "appearance"
text = "The 1893 catalog identifies episcopal rings as a manufactured class but does not prescribe a universal stone, bezel, metal, heraldry, ornament, or dimensions."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-ring-benziger"]

[[claims]]
id = "clm-pontifical-ring-identity"
kind = "identity"
text = "The checked sources identify a distinct pontifical or episcopal ring used in the bishop's vesting."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-ring-ce", "src-pontifical-ring-benziger"]

[[claims]]
id = "clm-pontifical-ring-presence"
kind = "ceremonial-presence"
text = "In the checked Solemn Pontifical Mass vesting, the assistant priest places the ring after the intervening actions that follow gloving."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-ring-ce"]

[[sources]]
