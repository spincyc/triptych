[[audience_note]]
audience = "altar-server"
text = "Recognize this object only in a specifically appointed public Communion, Viaticum, or transfer route; the plate creates no ordinary Mass assignment."
claim_ids = ["clm-eucharistic-ombrellino-use", "clm-eucharistic-ombrellino-distinction"]

[[audience_note]]
audience = "sacristan"
text = "Prepare this small canopy only when the exact public Communion or Viaticum rite and local assignment call for it; the plate prescribes no fabric, color, dimensions, fringe, construction, or storage method."
claim_ids = ["clm-eucharistic-ombrellino-use", "clm-eucharistic-ombrellino-appearance"]

[[audience_note]]
audience = "mc-trainer"
text = "Keep the optional where-available branch and the distinction from both the larger baldachin and basilical conopaeum explicit; assign carrying only from the governing ceremonial plan."
claim_ids = ["clm-eucharistic-ombrellino-use", "clm-eucharistic-ombrellino-distinction"]

[[audience_note]]
audience = "pontifical"
text = "Include this only in Eucharistic processional contexts; it is neither pontifical insignia nor the basilical conopaeum."
claim_ids = ["clm-eucharistic-ombrellino-distinction"]
