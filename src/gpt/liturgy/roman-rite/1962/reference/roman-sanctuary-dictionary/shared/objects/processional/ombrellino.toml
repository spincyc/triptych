locus = "Patrick Morrisroe, Canopy (1908), New Advent transcription, paragraph beginning Two kinds of canopy: small flat single-staff ombrellino and larger rectangular baldacchino."
role = "specialist-secondary"
verification_state = "claim-verified"
checked_on = 2026-11-05
note = "The whole dated web article was read; the 1908 printed page was not collated. This historical transcription controls only the attributed terminology and broad morphology, not a 1962 rubric or universal construction."

