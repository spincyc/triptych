[presence]
locations = ["Prepared with the articles for public Communion or Viaticum only where this small canopy is available and appointed."]
contexts = ["A small single-staff canopy used over the priest carrying the Blessed Sacrament in the public Communion or Viaticum rite; it is not the basilical conopaeum."]
local_variability = "defining"

[handling]
ordinary_handlers = ["other-server", "cleric"]
