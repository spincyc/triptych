schema_version = 1
id = "obj-ombrellino"
workflow_state = "publication-ready"
preferred_english_name = "Eucharistic ombrellino"
latin_headword = "umbella"
alternate_english_names = ["Eucharistic umbrella", "small Eucharistic canopy", "ombrellino"]
categories = ["related-ceremonies"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["procession", "ceremony-surrounding-mass"]
confusable_with = ["obj-basilical-conopaeum"]
editorial_note = "The Roman-context tag identifies the object class, not an obligation at every Mass. The checked witnesses are a modern reset of the 1925 Ritual, Fortescue–O'Connell (1943), and a web transcription of a 1908 article. The 1952 Ritual was not collated; the entry supports recognition and attributed earlier practice, not a complete 1962 operational direction."

[presence]
locations = ["Carried over the Blessed Sacrament in the particular routes described by the checked earlier witnesses."]
contexts = ["The 1925 Ritual's public Communion-to-the-sick route, and short transfers within a church described in 1943; the small Eucharistic canopy is distinct from basilical insignia."]
local_variability = "defining"

[handling]
ordinary_handlers = ["other-server", "cleric"]
server_relation = "varies-by-ceremony"
warnings = ["The checked witnesses describe earlier practice; the 1952 Ritual was not collated. Recognition does not assign a bearer or supply a complete ceremonial direction; consult the exact applicable rite and local assignment."]

[audience_relevance]
altar_server = "useful"
sacristan = "useful"
mc_trainer = "useful"
general_reader = "required"
pontifical = "useful"

[[claims]]
id = "clm-eucharistic-ombrellino-use"
kind = "ceremonial-presence"
text = "The checked 1925 Ritual text calls for an umbrella or baldachin, where available, over the priest carrying the Blessed Sacrament to the sick. Its wording has not been collated against the 1952 Ritual."
evidence_state = "checked-paraphrase"
source_ids = ["src-eucharistic-ombrellino-ritual"]

[[claims]]
id = "clm-eucharistic-ombrellino-position"
kind = "liturgical-use"
text = "Fortescue–O'Connell (1943) describes a smaller umbrella-like canopy on one rod for short transfers of the Blessed Sacrament within a church, such as from one altar to another."
evidence_state = "checked-paraphrase"
source_ids = ["src-eucharistic-ombrellino-fortescue"]

[[claims]]
id = "clm-eucharistic-ombrellino-distinction"
kind = "identity"
text = "The Eucharistic ombrellino is the small one-staff umbrella form, distinct both from the larger processional baldachin and from the institutional basilical conopaeum."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-eucharistic-ombrellino-fortescue", "src-eucharistic-ombrellino-ce"]

[[claims]]
id = "clm-eucharistic-ombrellino-appearance"
kind = "appearance"
text = "The plate shows one representative shallow, nearly flat canopy on a single long staff. The historical secondary witness supports that recognition class, not a universal material, color, fringe, panel pattern, dimensions, foot, or ornament."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-eucharistic-ombrellino-ce"]

[[sources]]
id = "src-eucharistic-ombrellino-ritual"
binding = "artifact.catholic-church.rituale-romanum.latin-typical-1925.liturgia-reset-pdf-d020e285"
locus = "1925 Ritual, Titulus IV, caput IV, nn. 10-13; Laudate Dominum reset PDF pp. 71-72 (not a facsimile)."
role = "historical-primary"
verification_state = "claim-verified"
checked_on = 2026-11-05
note = "The displayed 10 June 1925 decree and locus were checked. Earlier text only: neither the 1952 wording nor a complete 1962 operational sequence has been verified."

[[sources]]
id = "src-eucharistic-ombrellino-fortescue"
binding = "artifact.adrian-fortescue.ceremonies-of-the-roman-rite-described.seventh-revised-1943.dli-internet-archive-pdf"
locus = "Seventh revised edition (1943), printed p. 17, Instruments, final canopy paragraph; artifact PDF p. 38."
role = "ceremonial-book"
verification_state = "claim-verified"
checked_on = 2026-11-05
note = "The title page and displayed printed page were checked. Small one-rod canopy and intra-church transfer context only; no new claim about unchanged 1962 ceremonial law."

[[sources]]
id = "src-eucharistic-ombrellino-ce"
