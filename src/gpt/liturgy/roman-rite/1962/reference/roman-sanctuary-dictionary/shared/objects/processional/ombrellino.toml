binding = "article.catholic-encyclopedia.baldachinum-of-the-altar.1908"
locus = "Distinction between the small single-staff ombrellino and the larger rectangular processional baldachin."
role = "specialist-secondary"
verification_state = "claim-verified"
checked_on = 2026-07-28

[[artwork]]
id = "art-related-ceremonies-0004-eucharistic-ombrellino"
view = "isolated"
