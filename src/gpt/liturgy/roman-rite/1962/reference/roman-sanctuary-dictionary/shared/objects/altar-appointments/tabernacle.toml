checked_on = 2026-11-05

[[audience_note]]
audience = "altar-server"
text = "The celebrant opens and closes the tabernacle in the Communion rite. Recognize it without opening it or handling its key."
claim_ids = ["clm-tabernacle-identity", "clm-tabernacle-use"]

[[audience_note]]
audience = "general-reader"
text = "The tabernacle is the secure enclosure in which the Blessed Sacrament is reserved."
claim_ids = ["clm-tabernacle-identity"]

[[audience_note]]
audience = "sacristan"
text = "Leave sufficient space before the tabernacle for the altar vessels, and follow the responsible priest’s direction for access and the key."
claim_ids = ["clm-tabernacle-appearance", "clm-tabernacle-key"]

[[audience_note]]
audience = "mc-trainer"
text = "Distinguish the fixed enclosure from the ciborium the celebrant removes and returns during Communion."
claim_ids = ["clm-tabernacle-identity", "clm-tabernacle-use"]

[[audience_note]]
audience = "pontifical"
text = "Identify the actual place of reservation; a tabernacle is not inferred on every altar from the presence of pontifical furnishings."
claim_ids = ["clm-tabernacle-identity", "clm-tabernacle-placement"]

[[artwork]]
id = "art-tabernacle-casket-study"
view = "isolated"
asset = "shared/artwork/pencil/furnishings/RPD-FIG-tabernacle-study.png"
review_state = "liturgically-checked"
depicts = ["obj-tabernacle"]
review_note = "Two doors attach to visible side hinges and open outward. Keyhole is clear; interior empty. No handles, rays, throne, Eucharistic contents, or surrounding architecture. This isolated study cannot depict permanent mounting. Full-size and small white-ground inspection passed; use on white only. Current plate, consumer, and print review are recorded separately in research/artwork-revision-2026-11-05.md."
