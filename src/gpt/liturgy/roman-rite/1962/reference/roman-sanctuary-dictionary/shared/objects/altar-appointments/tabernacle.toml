schema_version = 1
id = "obj-tabernacle"
workflow_state = "art-reviewed"
preferred_english_name = "Tabernacle"
latin_headword = "tabernaculum"
categories = ["altar-and-appointments", "church-and-sanctuary"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["low-mass", "missa-cantata", "solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
related_objects = ["obj-altar", "obj-ciborium", "obj-sanctuary-lamp", "obj-altar-cards"]
confusable_with = []

[presence]
locations = ["Fixed in the middle part of the altar at which the Blessed Sacrament is reserved."]
contexts = ["Reservation furniture; its presence is conditional on reservation at that altar, not on every celebration of Mass."]
local_variability = "common"

[handling]
ordinary_handlers = ["priest"]
server_relation = "recognizes-only"
warnings = ["The celebrant opens and closes the tabernacle in the Communion rite. Recognize it without opening it or handling its key."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-tabernacle-identity"
kind = "identity"
text = "The tabernacle is the secure enclosure in which the Blessed Sacrament is reserved."
evidence_state = "checked-paraphrase"
source_ids = ["src-tabernacle-code", "src-tabernacle-fortescue"]

[[claims]]
id = "clm-tabernacle-appearance"
kind = "appearance"
text = "The contemporary ceremonial describes a fixed safe or casket, usually with outward-opening doors, leaving space in front for the vessels used at the altar."
evidence_state = "checked-paraphrase"
source_ids = ["src-tabernacle-fortescue"]

[[claims]]
id = "clm-tabernacle-placement"
kind = "placement"
text = "At the 1962 horizon canon 1269 requires an immovable tabernacle in the middle part of the altar, solidly closed and guarded, and empty of unrelated things."
evidence_state = "checked-paraphrase"
source_ids = ["src-tabernacle-code"]

[[claims]]
id = "clm-tabernacle-use"
kind = "liturgical-use"
text = "The unveiled study shows the enclosure; a veil covers it where the Blessed Sacrament is reserved. When Communion is given from reserved Hosts, the celebrant opens the tabernacle and takes out the ciborium; after Communion he covers and replaces it, genuflects, and closes the door."
evidence_state = "checked-paraphrase"
source_ids = ["src-tabernacle-fortescue", "src-tabernacle-missal"]

[[claims]]
id = "clm-tabernacle-veil"
kind = "appearance"
text = "The contemporary ceremonial describes a veil covering the tabernacle where the Blessed Sacrament is reserved; an unveiled identification view does not show the complete prepared arrangement."
evidence_state = "checked-paraphrase"
source_ids = ["src-tabernacle-fortescue"]

[[claims]]
id = "clm-tabernacle-key"
kind = "handling-boundary"
text = "Canon 1269 places the serious responsibility for safeguarding the tabernacle key on the priest in charge of the church or oratory."
evidence_state = "checked-paraphrase"
source_ids = ["src-tabernacle-code"]

[[sources]]
id = "src-tabernacle-missal"
