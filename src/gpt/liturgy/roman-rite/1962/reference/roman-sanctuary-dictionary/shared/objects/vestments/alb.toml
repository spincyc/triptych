[[audience_note]]
audience = "sacristan"
text = "In the checked reverse-order table arrangement, ready the alb immediately beneath the amice; this record prescribes no fold or storage method."
claim_ids = ["clm-alb-use", "clm-alb-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach alb after amice and before cincture, and keep the Missal's exact minister action distinct from local assignments."
claim_ids = ["clm-alb-use", "clm-alb-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The alb is the long linen layer worn over the amice."
claim_ids = ["clm-alb-identity"]

[[audience_note]]
audience = "pontifical"
text = "Use this as a relational base layer only; ordinary-priest arrangement does not establish episcopal timing or assistance."
