source_ids = ["src-alb-missal-1962", "src-alb-fortescue-1943"]

[[claims]]
id = "clm-alb-appearance"
kind = "appearance"
text = "A checked contemporary ceremonial describes a loose, long-sleeved linen garment reaching to the feet; the plate does not prescribe lace, apparels, crosses, construction, ornament, or exact folds."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-alb-fortescue-1943", "src-alb-fortescue-1917", "src-alb-casanowicz"]

[[claims]]
id = "clm-alb-use"
kind = "liturgical-use"
text = "The priest puts on the alb after the amice and before the cincture."
