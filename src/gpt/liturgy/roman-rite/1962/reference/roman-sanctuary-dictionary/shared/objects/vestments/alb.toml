[presence]
locations = ["Put on over the amice and under the cincture."]
contexts = ["The second layer in the ordinary priest's six-vestment sequence."]

[handling]
ordinary_handlers = ["priest"]
server_relation = "varies-by-ceremony"
prepares = ["sacristan", "other-server"]
