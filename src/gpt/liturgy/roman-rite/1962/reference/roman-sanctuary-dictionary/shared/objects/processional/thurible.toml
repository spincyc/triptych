[[audience_note]]
audience = "sacristan"
text = "Prepare and store the thurible only by the church's trained fire-safe practice; the representative drawing prescribes no material, dimensions, ornament, charcoal procedure, or resting arrangement."
claim_ids = ["clm-thurible-identity", "clm-thurible-appearance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach the named thurifer relationship and the four-chain component distinction without converting this recognition plate into a handoff, swinging, charcoal, or route procedure."
claim_ids = ["clm-thurible-identity", "clm-thurible-appearance"]

[[audience_note]]
audience = "general-reader"
text = "The thurible is the vessel used for the appointed incensations; the pictured four-chain construction is one source-bounded representative form, not a universal silhouette."
claim_ids = ["clm-thurible-identity", "clm-thurible-appearance"]

[[audience_note]]
audience = "pontifical"
text = "Treat the thurible as an ordinary incense-service object used in pontifical Mass, not as pontifical insignia or a distinct pontifical form."
claim_ids = ["clm-thurible-identity"]
