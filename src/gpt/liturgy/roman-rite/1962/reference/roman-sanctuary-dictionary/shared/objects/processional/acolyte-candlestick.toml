[[audience_note]]
audience = "mc-trainer"
text = "Teach the two candle-bearing acolytes and the footed, self-standing distinction without deriving one universal grip, height, or silhouette from this representative drawing."
claim_ids = ["clm-acolyte-candlestick-missal", "clm-acolyte-candlestick-distinction", "clm-acolyte-candlestick-representative-form"]

[[audience_note]]
audience = "general-reader"
text = "This is the footed candlestick of a candle-bearing acolyte, distinct from both an altar candlestick and a footless elevation torch; the pictured turned form is representative."
claim_ids = ["clm-acolyte-candlestick-distinction", "clm-acolyte-candlestick-representative-form"]

[[audience_note]]
audience = "pontifical"
text = "Treat the acolyte candlestick as an ordinary supporting object used by candle-bearing acolytes, not as pontifical insignia or a distinct pontifical form."
