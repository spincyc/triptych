[[claims]]
id = "clm-acolyte-candlestick-missal"
kind = "ceremonial-presence"
text = "The 1962 Missal names two candle-bearing acolytes in the solemn entrance and places them on either side of the subdeacon holding the Gospel book."
evidence_state = "checked-paraphrase"
source_ids = ["src-acolyte-candlestick-missal"]

[[claims]]
id = "clm-acolyte-candlestick-distinction"
kind = "appearance"
text = "Fortescue describes the acolytes’ candles as tall, footed candlesticks that can stand on the credence, unlike footless elevation torches that require a rack."
evidence_state = "checked-paraphrase"
source_ids = ["src-acolyte-candlestick-fortescue"]

[[claims]]
id = "clm-acolyte-candlestick-identity"
kind = "identity"
text = "An acolyte candlestick is the tall, footed, self-standing candle support distinguished from a footless elevation torch."
evidence_state = "checked-paraphrase"
source_ids = ["src-acolyte-candlestick-fortescue"]

[[claims]]
id = "clm-acolyte-candlestick-use"
kind = "liturgical-use"
text = "At solemn Mass, two candle-bearing acolytes carry their lights in the entrance and flank the subdeacon holding the Gospel book."
evidence_state = "checked-paraphrase"
source_ids = ["src-acolyte-candlestick-missal"]

[[claims]]
id = "clm-acolyte-candlestick-representative-form"
kind = "appearance"
text = "The separate empty acolyte-candlestick drawing is a representative support form; it does not assert universal material, ornament, dimensions, proportions, or exact silhouette."
