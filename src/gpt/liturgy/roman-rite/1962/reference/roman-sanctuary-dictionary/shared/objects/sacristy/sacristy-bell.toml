editorial_note = "The 1943 ceremonial calls the departure bell a practice in many churches, and the 1912 specialist article calls it customary. Neither witness establishes a universal rubric, one mechanism, fixed placement, operator, or visual form."
preferred_english_name = "Local sacristy signal bell"
latin_headword = "campanula"
alternate_english_names = ["sacristy door bell", "departure signal bell"]
categories = ["service-objects"]
periods = ["roman-1962-horizon"]
statuses = ["institutional"]
ceremonies = ["low-mass", "missa-cantata", "solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-altar-bells"]

[presence]
locations = ["At a locally appointed sacristy or departure point; the checked witnesses mention the sacristy door."]
contexts = ["Where locally used, signals that the clergy and ministers are about to enter."]
composition_ids = []
local_variability = "defining"

[handling]
ordinary_handlers = ["sacristan", "other-server", "cleric"]
server_relation = "varies-by-ceremony"
warnings = ["Ring only when and as locally directed; mechanism, placement, operator, and cue vary.", "Do not confuse this departure signal with the altar bells used at Mass."]

[audience_relevance]
