[[audience_note]]
audience = "altar-server"
text = "Recognize the short left-arm band and keep it distinct from the longer stole; assist only under direction."
claim_ids = ["clm-maniple-identity", "clm-maniple-use", "clm-maniple-assistance"]

[[audience_note]]
audience = "sacristan"
text = "In the checked reverse-order table arrangement, ready it beneath the cincture and above the stole; the cope branch excludes it."
claim_ids = ["clm-maniple-use", "clm-maniple-presence", "clm-maniple-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach left-arm placement, sequence, and the cope branch; keep priest, bishop, deacon, and subdeacon timing distinct."
claim_ids = ["clm-maniple-use", "clm-maniple-presence", "clm-maniple-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The maniple is the short band worn on the left arm, not the longer neck-worn stole."
claim_ids = ["clm-maniple-identity"]

[[audience_note]]
audience = "pontifical"
text = "This is the ordinary priestly baseline only; episcopal maniple timing differs."
claim_ids = ["clm-maniple-use"]
