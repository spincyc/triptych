[[artwork]]
id = "art-maniple-central-cross-study"
view = "isolated"
asset = "shared/artwork/pencil/vestments/RPD-FIG-vestments-0004-maniple-cross-2026.png"
review_state = "liturgically-checked"
depicts = ["obj-maniple"]
review_note = "Cross sits on and follows the visible outer crown of the fold. Two unfringed hanging ends and band width remain recognizably those of input. Generation rescaled and modestly redrew texture, so this is not a pixel-exact edit. No added terminal crosses, arms, hands, or ornaments. Full-size and small white-ground inspection passed; use on white only. Current plate, consumer, and print review are recorded separately in research/artwork-revision-2026-11-05.md."
