schema_version = 1
id = "obj-maniple"
workflow_state = "publication-ready"
preferred_english_name = "Maniple"
latin_headword = "manipulus"
sort_name = "04 Maniple"
categories = ["priestly-vestments"]
periods = ["roman-1962-horizon"]
statuses = ["universal-roman"]
ceremonies = ["low-mass", "missa-cantata", "solemn-mass", "pontifical-mass", "requiem-mass", "nuptial-mass", "ritual-mass"]
confusable_with = ["obj-priest-stole"]
related_objects = ["obj-amice", "obj-alb", "obj-cincture", "obj-chasuble"]

[presence]
locations = ["Worn on the priest's left arm for Mass."]
contexts = ["Put on after the cincture and before the stole in the ordinary priest's sequence."]

[handling]
ordinary_handlers = ["priest"]
server_relation = "varies-by-ceremony"
prepares = ["sacristan", "other-server"]
presents = ["other-server"]
warnings = ["The checked practical manual's assistance model is conditional/custom; no fastening method or universal server handoff is prescribed."]

[audience_relevance]
altar_server = "required"
sacristan = "required"
mc_trainer = "required"
general_reader = "required"
pontifical = "required"

[[claims]]
id = "clm-maniple-identity"
kind = "identity"
text = "The maniple is the short vestment band worn on the priest's left arm."
evidence_state = "checked-paraphrase"
source_ids = ["src-maniple-missal-1962", "src-maniple-fortescue-1943"]

[[claims]]
id = "clm-maniple-appearance"
kind = "appearance"
text = "The plate shows one short, narrow, flexible plain band; end shape, fringe, crosses, dimensions, lining, fastening, textile, and ornament are not prescribed."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-maniple-fortescue-1943", "src-maniple-fortescue-1917", "src-maniple-casanowicz", "src-maniple-met"]

[[claims]]
id = "clm-maniple-use"
kind = "liturgical-use"
text = "The ordinary priest puts it on the left arm after the cincture and before the stole."
evidence_state = "checked-paraphrase"
source_ids = ["src-maniple-missal-1962"]

[[claims]]
id = "clm-maniple-presence"
kind = "ceremonial-presence"
text = "It is part of ordinary priestly Mass vesture; the 1962 General Rubrics distinguish the cope branch, in which the maniple is not worn."
evidence_state = "checked-paraphrase"
source_ids = ["src-maniple-missal-1962", "src-maniple-rubrics-1962"]

[[claims]]
id = "clm-maniple-assistance"
kind = "handling-boundary"
text = "A checked contemporary ceremonial permits preparation by the sacristan or partly by the server according to custom and describes handing vestments; it does not prescribe a universal server handoff or fastening method."
evidence_state = "checked-paraphrase"
source_ids = ["src-maniple-fortescue-1943"]

