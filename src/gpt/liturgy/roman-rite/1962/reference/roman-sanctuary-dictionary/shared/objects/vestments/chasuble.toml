[[claims]]
id = "clm-chasuble-identity"
kind = "identity"
text = "The chasuble is the outer priestly vestment put on last for Mass."
evidence_state = "checked-paraphrase"
source_ids = ["src-chasuble-missal-1962", "src-chasuble-rubrics-1962"]

[[claims]]
id = "clm-chasuble-appearance"
kind = "appearance"
text = "The comparison plate shows representative narrower Roman-cut and fuller Gothic silhouettes as material-culture variation; neither form is normative or exhaustive, and no orphrey, neckline, length, textile, ornament, tie, or exact proportion is prescribed."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-chasuble-fortescue-1943", "src-chasuble-fortescue-1917", "src-chasuble-casanowicz", "src-chasuble-met-french", "src-chasuble-met-spanish"]

[[claims]]
id = "clm-chasuble-use"
kind = "liturgical-use"
text = "The priest puts the chasuble on after the stole as the final layer."
evidence_state = "checked-paraphrase"
source_ids = ["src-chasuble-missal-1962"]

[[claims]]
id = "clm-chasuble-presence"
kind = "ceremonial-presence"
text = "The 1962 General Rubrics direct the priest always to use the planeta or casula at Mass; they separately abolish folded chasubles and the broad stole."
evidence_state = "checked-paraphrase"
source_ids = ["src-chasuble-rubrics-1962"]

[[claims]]
id = "clm-chasuble-color"
kind = "variation"
text = "The vestment color follows the Mass or Office under the 1962 General Rubrics, with legitimate indults and customs preserved; the monochrome plate does not encode color."
evidence_state = "checked-paraphrase"
source_ids = ["src-chasuble-color-1962"]

[[claims]]
id = "clm-chasuble-assistance"
kind = "handling-boundary"
text = "The Missal requires the vestments to be intact, clean, beautiful, and blessed where blessing applies; a checked contemporary ceremonial's reverse-stack preparation and handing model remains practical/custom rather than a universal assignment."
evidence_state = "checked-paraphrase"
source_ids = ["src-chasuble-missal-1962", "src-chasuble-fortescue-1943"]

