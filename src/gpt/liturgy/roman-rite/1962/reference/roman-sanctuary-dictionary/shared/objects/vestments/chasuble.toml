related_objects = ["obj-priest-stole", "obj-maniple"]

[presence]
locations = ["Outermost ordinary priestly vestment for Mass."]
contexts = ["Put on last over the stole."]
local_variability = "common"

[handling]
ordinary_handlers = ["priest"]
server_relation = "varies-by-ceremony"
prepares = ["sacristan", "other-server"]
