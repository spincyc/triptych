[[audience_note]]
audience = "altar-server"
text = "Recognize the chasuble as the final outer layer; present or arrange it only under direction."
claim_ids = ["clm-chasuble-identity", "clm-chasuble-use", "clm-chasuble-assistance"]

[[audience_note]]
audience = "sacristan"
text = "In the checked reverse-order table arrangement, ready it lowest so it is taken last, checking condition and the applicable color; no folding, storage, or tie method is prescribed."
claim_ids = ["clm-chasuble-use", "clm-chasuble-color", "clm-chasuble-assistance"]

[[audience_note]]
audience = "mc-trainer"
text = "Teach it as the final layer and keep ordinary priest, bishop, deacon, cope, and abolished folded-chasuble branches distinct."
claim_ids = ["clm-chasuble-use", "clm-chasuble-presence", "clm-chasuble-assistance"]

[[audience_note]]
audience = "general-reader"
text = "The chasuble is the priest's outer Mass vestment; the two pictured cuts are representative variations."
claim_ids = ["clm-chasuble-identity", "clm-chasuble-appearance"]

[[audience_note]]
audience = "pontifical"
text = "Use this as the ordinary outer-vestment baseline while keeping episcopal layering and assistance distinct."
claim_ids = ["clm-chasuble-presence"]
