Asset type: corrected source-controlled graphite detail illustration for a Roman liturgical pictorial dictionary
Primary request: Create one landscape two-part educational study. LEFT: a generic Roman episcopal mitre in clear rear three-quarter view with exactly two long hanging lappets (vittae), separate and fully visible. RIGHT: a close handling view in which exactly two clearly anatomical human hands, each with visible fingers and thumb, support one plain mitre from below while a single plain oblong silk cloth is folded over and around both hands. The cloth must visibly intervene between every fingertip, palm, and the mitre: no skin touches it. No person beyond wrists and hands; no sleeves.
