[[claims]]
id = "clm-pontifical-tunicle-layer"
kind = "liturgical-use"
text = "The 1962 Missal and checked Ceremonial place the tunicle beneath the pontifical dalmatic and chasuble in the appointed vesting sequence."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-vestment-missal", "src-pontifical-vestment-ce"]
as_of = 1962-01-01

[[claims]]
id = "clm-pontifical-tunicle-identity"
kind = "identity"
text = "The 1962 Missal and Ceremonial identify the pontifical tunicle as a distinct episcopal vestment, separate from the pontifical dalmatic and from the subdeacon's outer tunicle."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-vestment-missal", "src-pontifical-vestment-ce"]

[[claims]]
id = "clm-pontifical-tunicle-appearance"
kind = "appearance"
text = "The checked sources establish the tunicle's inner layer and separate vesting action but prescribe no universal cut, sleeve relation, dimensions, textile, or ornament."
evidence_state = "source-grounded-synthesis"
source_ids = ["src-pontifical-vestment-missal", "src-pontifical-vestment-ce"]

[[claims]]
id = "clm-pontifical-tunicle-presence"
kind = "ceremonial-presence"
text = "The 1962 General Rubrics appoint the tunicle beneath the dalmatic and chasuble when a bishop or another person enjoying pontificals celebrates solemnly, and at specified Low Masses, while permitting omission for a reasonable cause."
evidence_state = "checked-paraphrase"
source_ids = ["src-pontifical-vestment-missal"]
as_of = 1962-01-01

