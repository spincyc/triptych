problem = "The homily says that the Secret 'asks Christ for unity and peace among the nations', carrying forward the same claim from the research summaries and both studies. The actual Secret addresses the Father: Missale Romanum (1962), printed p. 698, no. 3947, explicitly calls Jesus Christ 'Filius tuus' and closes 'Qui tecum'. Its petition asks the Father that the Son offered in sacrifice himself bestow unity and peace. The identification of Christ as the giver is correct, but it does not make him the prayer's addressee. This is a factual misdescription of an appointed prayer used to connect the sermon’s argument to the Eucharist, rather than a stylistic preference."
required_result = "Correct the owning research summaries to distinguish the Father addressed from the Son whose gift is sought, retaining the supported connection between Christ's sacrifice and his gift of unity and peace. Carry that distinction into the dependent study, concise study and spoken homily through their normal authoring and review stages; an accurate formulation may say that the Secret asks the Father that Christ bestow unity and peace, or simply that it asks for these gifts from the sacrificial Christ without identifying Christ as the person addressed. The existing verified text and cited page image already supply the necessary evidence; preserve them and the rest of the supported argument."
repair_target = "research"
