reason = "Drum's \"Psalms\" in the Catholic Encyclopedia was read in full for this corpus and dates the writing of no psalm except three cases authored separately in composition.yaml: Ps.73 and Ps.82 in this vulgate numbering, and the psalms of the sons of Korah as a group. Of those three, two are still answered with and one is not, so this row now reaches Ps.73 as well and the reader is owed the reason. Ps.73 is the one the article does not date on its own authority: it gives the date \"as Briggs surmises\", adopting the surmise of the modern critical commentary it cites by page in the same treatment of the Asaph psalms - Briggs's \"Psalms\", New York, 1906 - and this profile admits no such adoption - its one narrow lift is named for Ussher and says in terms that it extends to no one else. That figure is therefore held in composition.yaml as preserved evidence, legible under --evidence, and is not a candidate answer; a reader who reaches this row at Ps.73 is being told that the tradition this profile answers under dates the psalm nowhere, not that nobody looked at it. Ps.82 is different and is untouched: there the article names Briggs's dating and rejects it, asserting its own reading, so that claim stands and this row never reaches Ps.82 at all. Everywhere else it settles authorship and refuses date. Of David, its strongest sentence is the Biblical Commission's of 1 May 1910, that \"It cannot be prudently denied that David is the chief author of the songs of the Psalter\" - an author, not a year, a reign or a period, and the same decree adds that neither the councils nor the Fathers \"have such weight as to determine that David is sole author of the whole Psalter\". Of the Asaph psalms it says they \"pertain to widely-separated periods of Jewish history\"; of Moses and Solomon in the titles it offers imitation rather than date, \"this imitation may be the reason of the title\"; of the Machabean question it says \"There are no certain proofs that these or any psalms are Machabean\" and \"leaves that question still open\". The historical superscriptions are occasions and not compositions: thirteen Davidic psalms are merely \"referred to the time of David's persecution by Saul\", to his sin, or to his flight from Absalom, and the article expressly denies that the titles settle even authorship - \"Does this preposition mean authorship? No in every title\" - so none of them may be promoted to a date. The one dated thing the article does offer about the collection is the closing of the canon, not the writing of the text: the Palestinian canon \"was practically closed during the time of Esdras\", and at the latest the Jewish canon of the Psalms \"was undoubtedly closed before the date of the Septuagint translation. This date is 285 B.C. ... or, at the very latest 132 B.C.\" A canon closing is not a text being written, and this corpus will not borrow it. The Psalter is an anthology and is given no book-wide composition date here; psalms that carry a superscription-setting, a historical setting or a prophetic referent are asserted individually and those assertions stand over this row."

