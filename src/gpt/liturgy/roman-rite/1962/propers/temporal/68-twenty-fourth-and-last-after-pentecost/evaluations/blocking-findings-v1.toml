[[findings]]
stage = "synthesis-review"
id = "SYN-THEMES-TWO-FULL-PAGES"
severity = "blocking"
location = "sections/concise/04-themes.tex:20–28, 41–56, 59–65, 83–88, 107–112 (native synthesis pp. 3–4)"
problem = "Both forced breaks cut off the themes prose about 2.3 and 2.8 inches above their page’s footnote rule. The four sections cover the appointments in order, but the comparison of the Gradual’s past and future speech at lines 41–44 gives two conclusions without showing how the verses move from the past tense to the future. At lines 59–65 the reader is told that Chrysostom explains the obstacles to escape, without hearing what he says about a pregnant woman or a nursing mother. The Offertory and Secret at lines 83–88 are reported consecutively before the prose moves on to the Preface. These compressed bridges leave the required two-page opening underdeveloped."
required_result = "Use details already supported in the expansive study to make both pages substantive at the current type size. The Gradual paragraph could begin, “The singers thank God for rescue and promise to praise him forever. Augustine takes the future praise as a clue that the rescue also lies ahead. Bellarmine hears people who remember being rescued and now need help again.” The line on Chrysostom could develop the scene. “Jesus tells someone on a roof to leave his possessions in the house. Chrysostom asks how a pregnant woman could make such a hurried escape or a nursing mother leave her infant behind.” The repeated Offertory cry can lead into the Secret by explaining what help the worshippers are now asking for as they bring their gifts. Keep the developed commentary on page 5 and check both themes pages with the settled rendering."
repair_target = "synthesis"

[[findings]]
stage = "synthesis-review"
id = "SYN-COMMUNION-TEMPORAL-PRAYER-BOUND"
severity = "blocking"
location = "sections/concise/10-commentary.tex:244–259, 278–298 (native synthesis p. 8)"
problem = "The Communion question asks what Jesus’ assurance allows readers to expect. It reports Theophylact’s broad assurance, Bede’s specific assurance of pardon and the physical help in Bede’s account of Gregory. The revised flight paragraph teaches that continued danger cannot reveal someone else’s faith, but it drops the expansive study’s conclusion for the person praying in that danger. The need may be real and legitimately the subject of prayer, and the timing and form of help remain with God (sections/40-prayer-and-conversion.tex:273–290 and research/interpretations.md:486–497). Without this qualification the section leaves the reader to infer whether confident petition warrants expecting the particular temporal result requested."
required_result = "State beside the conjunction of Mark’s assurance, Bede’s example and Matthew’s flight that Christ teaches disciples to ask for real help while entrusting the timing and form of that help to God. Keep Bede’s particular assurance about pardon and retain the concrete case in which God gives someone the capacity to forgive while the conflict continues. Present the conclusion as the study’s inference across those passages."
repair_target = "synthesis"

[[findings]]
stage = "web-review"
id = "WEB-STUDY-RESTATEMENT-001"
severity = "blocking"
location = "sections/30-deliverance-and-waiting.tex lines 3–7, 44–51, 102–107, 119–124 and 137–142 (canonical Markdown lines 413, 425, 439, 445 and 449)"
problem = "Several paragraphs in the first interpretation state a point and then restate it before moving the argument forward. The opening says three times that rescue has occurred and that endurance remains necessary. The Bellarmine paragraph explains the contrast in tense twice around the empty sentence ‘The difference concerns how the verse says what it says.’ The paragraph applying Jeremiah opens with an empty label and ends by generalizing the application it has just made. The paragraph on continuing prayer restates the need to grow after Chrysostom’s comparison with competitors, and the paragraph on Job states twice that joy can coexist with grief. The repeated summaries slow the development of an otherwise distinct argument, and they recur through the section under the editorial register criterion."
required_result = "State each step once while retaining the concrete evidence, attribution and distinction between past rescue and future fulfilment. At lines 3–7, for example, write ‘Paul thanks the Father for rescuing the faithful from darkness and asks him to strengthen them so they can endure.’ At lines 44–51, write ‘Bellarmine hears the past tense as thanksgiving for rescues already received. The people who remember those rescues now lament a fresh affliction. On either account, the faithful can thank God while they suffer.’ The preceding paragraph already explains Augustine’s prophetic perfect. At lines 102–107, keep Jeremiah’s work in exile and its specific application to the Collect. At lines 119–124 and 137–142, let the competitors and Job supply the conclusions without repeating the points in general terms."
repair_target = "study"

[[advisories]]
stage = "homily-review"
id = "HOM-GOS-001"
severity = "advisory"
location = "sections/homily/10-body.tex:9–13"
problem = "The second mention of 'the disciples' can sound like the very disciples who asked Jesus about the Temple would have to flee in Judea. Chrysostom's Homily 76 §1 expressly places the Apostles elsewhere by the time of the siege, and Mt 24:16 gives the warning to those in Judea. The reading of the two events and the prayer Jesus asks for remain clear."
required_result = "Name those in Judea as the people who must heed the warning and flee. Keep the disciples' question and Christ's final gathering in their present roles."

