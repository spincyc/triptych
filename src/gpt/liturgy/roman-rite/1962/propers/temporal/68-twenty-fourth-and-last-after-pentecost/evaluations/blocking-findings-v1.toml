id = "STU-PINPOINT-001"
severity = "advisory"
location = "sections/30-deliverance-and-waiting.tex:58–63; sections/20-commentary.tex:29–38"
problem = "The general citation of Augustine's exposition of Psalm 84 contains the argument, but the highlighted section ranges are ambiguous across editions. The later request for conversion is the explicit evidence for the prophetic past in Latin §6 and NPNF Psalm LXXXV §4. The part of the same exposition on bondage to sin is Latin §4."
required_result = "Name the numbering of the edition used. For the inference from the later request for conversion, cite Latin §6 or NPNF Psalm LXXXV §4, and distinguish the pinpoint for captivity where both claims share a footnote."

[[advisories]]
stage = "synthesis-review"
id = "SYN-BEDE-MOUNTAIN-REFERENT"
severity = "advisory"
location = "sections/concise/10-commentary.tex:261–276"
problem = "The mountain in Bede signifies the devil himself, who lifts himself up in pride. The concise passage identifies it with the devil’s pride instead, which makes Bede’s next step about casting out spiritual mountains harder to follow. His exact distinction appears in In Marci evangelium expositio III, registered Latin transcription line 338, and the expansive study states it at sections/40-prayer-and-conversion.tex:255–263."
required_result = "Say that Bede sees the devil in the mountain because the devil raises himself against God in pride."

