[[advisories]]
stage = "homily-review"
id = "HOM-GOS-001"
severity = "advisory"
location = "sections/homily/10-body.tex:9–13"
problem = "The second mention of 'the disciples' can sound like the very disciples who asked Jesus about the Temple would have to flee in Judea. Chrysostom's Homily 76 §1 expressly places the Apostles elsewhere by the time of the siege, and Mt 24:16 gives the warning to those in Judea. The reading of the two events and the prayer Jesus asks for remain clear."
required_result = "Name those in Judea as the people who must heed the warning and flee. Keep the disciples' question and Christ's final gathering in their present roles."

[[advisories]]
stage = "research-review"
id = "RES-LASANCE-SANCTUS-CASE"
severity = "advisory"
location = "src/gpt/liturgy/roman-rite/1962/propers/temporal/68-twenty-fourth-and-last-after-pentecost/propers/verified.md:401"
problem = "The retained historical English at the Sanctus junction capitalizes “Who” where Lasance printed p. 774 (PDF p. 773) has “who” in the phrase “Blessed is He who cometh.” This isolated case difference leaves the wording and meaning intact."
required_result = "Use the Lasance capitalization in the historical English transcription."

[[advisories]]
stage = "study-review"
id = "STU-PINPOINT-001"
severity = "advisory"
location = "sections/20-commentary.tex:29–38; sections/30-deliverance-and-waiting.tex:84–91"
problem = "Both footnotes cite the full Psalm 84 exposition, which contains the argument they report, but direct the reader especially to §§2–4 or §§2–5. Augustine explicitly asks why the prophet still prays for a restoration just called accomplished in Latin §6, on Ps 84:5. Section 4 supports the distinct explanation of Jacob’s captivity as bondage to sin."
required_result = "Include Latin §6 among the highlighted pinpoints, or distinguish §4 for captivity and §6 for the inference from the later petition. Keep the existing argument and broad reference where relevant."
