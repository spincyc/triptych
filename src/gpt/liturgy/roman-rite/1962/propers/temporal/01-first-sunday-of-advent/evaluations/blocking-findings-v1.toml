[[advisories]]
stage = "homily-review"
id = "HOM-GRADUAL-ORAL-CUE"
severity = "advisory"
location = "sections/homily/10-body.tex:15, the two sentences introducing the omitted petition"
problem = "On first hearing, “In the psalm we sang after the Epistle there is a line” sounds as though the assembly actually sang the plea for the unjust to be put to shame. The next sentence clears this up, after the listener has had to revise that impression."
required_result = "Identify the change on first mention, for example, “After the Epistle we sang only part of the psalm. We passed over the line asking that those who act unjustly be put to shame.” The next sentence can then give the words the assembly did sing."

[[advisories]]
stage = "research-review"
id = "RES-005"
severity = "advisory"
location = "research/scope.md:36, research/source-bindings.toml:254 and 262, research/source-dispositions.toml:482 and 493"
problem = "The local descriptions call the two historical encyclopedia articles “Synoptics” and “Epistles.” The bound article on Luke is The New Testament, under “Origin” (line 33), and the one dating Romans to A.D. 58 is Epistle to the Ephesians, under “Date and place of composition; occasion” (line 69). Both dates are supported."
required_result = "Use the printed article titles and section names in the local descriptions so readers can retrieve both dates directly."

[[advisories]]
stage = "research-review"
id = "RES-LASANCE-INTROIT-P103"
severity = "advisory"
location = "propers/verified.md:17, Lasance, printed p. 103, PDF 104R, Introit opening"
problem = "The historical English Introit adds a comma after “O Lord.” The enlarged page image shows “To Thee, O Lord have I lifted up my soul”. The phrasing and sense are intact."
required_result = "Transcribe the opening punctuation as printed in the Lasance comparison. The Douay–Rheims study rendering has its own punctuation."

[[advisories]]
stage = "study-review"
id = "STU-LUKE-ADDRESS"
severity = "advisory"
location = "sections/30-the-judge.tex:5, immediately after the reference to raising their heads"
problem = "The phrase 'change of addressee' and the closing question can give the impression that Jesus first addresses the frightened nations. The Missal introduces the entire speech as addressed to his disciples. The paragraph itself correctly distinguishes speaking of the nations from speaking to the disciples."
required_result = "State the change from description to exhortation directly. For example, 'Jesus has been telling his disciples what others will fear. Now he tells the disciples what they themselves may hope for.'"

[[advisories]]
stage = "study-review"
id = "STU-SCOPE-RECORDS"
severity = "advisory"
location = "sections/90-apparatus.tex:5–9, Appendix: Scope and Qualifications"
problem = "Readers get precise edition references and a description of the commentary's scope, but the appendix omits the pointers to the detailed text collation and research record called for in the 1962 profile's Terminal Apparatus section."
required_result = "Add a short pointer in the appendix identifying propers/verified.md for the element-by-element collation and research/scope.md for the reception search and its limits."

[[advisories]]
stage = "synthesis-review"
id = "SYN-NAV-001"
severity = "advisory"
location = "sections/concise/10-commentary.tex:56–64, subsection heading on proof page 8"
problem = "The heading ‘After the people have received’ takes a reader looking for Communion first to the Offertory, the Secret and the Preface. Those two paragraphs develop the approach to Communion and belong here, but the heading describes only the second half of the subsection."
required_result = "A heading such as ‘From the Offertory to the Postcommunion’ would identify the full span of the discussion."

[[advisories]]
