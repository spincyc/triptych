[[findings]]
stage = "homily-review"
id = "HOM-001"
severity = "blocking"
location = "sections/homily/10-body.tex lines 7 and 11, the traveler and the runner"
problem = "Both named illustrations change the conduct the Father asks his hearers to consider. Gregory I.1.3 describes someone exhausted by the labor of the road who still wants the journey to continue. Calling him “weary of being away from home” already gives him the homesickness the listener is supposed to distinguish from exhaustion. Chrysostom’s runners make a greater effort near the prize. The Romans whose first zeal has cooled need their example. The homily attributes to Chrysostom the picture of a runner slowing down and a spectator calling encouragement to him. That loses the reason Chrysostom invokes a race. The study preserves both distinctions in sections/30-the-judge.tex lines 9 and 19."
required_result = "Let a listener hear both comparisons in their original direction. For Gregory, for example, “Gregory asks his people to picture a traveler worn out by the road who still wants the journey to go on. He asks them whether they want to see the Lord at its end.” For Chrysostom, “Chrysostom says runners make a greater effort when they can see the prize. Paul reminds Christians whose first eagerness has cooled how near their salvation is.” If the imagined spectator stays, give that illustration in the preacher’s own voice."
repair_target = "homily"

[[findings]]
stage = "homily-review"
id = "HOM-002"
severity = "blocking"
location = "sections/homily/90-apparatus.tex line 3, “Jesus addresses his disciples while the signs of trouble are beginning”"
problem = "The note puts the onset of the signs in the scene of Jesus’ address. In Luke 21:25–28 Jesus foretells the signs and tells his disciples ahead of time how to respond when they begin. The spoken body itself relies on the interval in lines 1 and 3, where the disciples can learn now what they will need to remember then."
required_result = "Correct the account of the timing in the source note. For example, “Jesus tells the disciples in advance whose coming they can expect when the signs begin.”"
repair_target = "homily"

[[advisories]]
stage = "homily-review"
id = "HOM-003"
severity = "advisory"
location = "sections/homily/10-body.tex line 19, after the description of fruit appearing on the branches"
problem = "The preacher explains how fruit announces summer and then moves directly to the disciples’ never having seen the day Jesus promises. On a single hearing the listener has to supply the second half of Jesus’ comparison, precisely where the homily offers reassurance about that day."
required_result = "Give the listener Jesus’ own second half in one short sentence. In Luke 21:31 he says that when the disciples see these things happening, they will know God’s kingdom is near. That identifies the promise whose truth the next sentence asks the assembly to trust."

[[advisories]]
stage = "research-review"
id = "RES-005"
severity = "advisory"
location = "research/scope.md:36, research/source-bindings.toml:254 and 262, and research/source-dispositions.toml:482 and 493"
problem = "The local research calls two Catholic Encyclopedia articles ‘Synoptics’ and ‘Epistles’. The bound witnesses give different titles. Alfred Durand’s The New Testament, under Origin, explicitly dates Luke to about A.D. 70 at line 33 of the extracted article. Paulin Ladeuze’s Epistle to the Ephesians, under Date and place of composition, places Romans in A.D. 58 at line 69. The artifact identities and the dates in the generated table are correct."
required_result = "Use the actual article titles and sections in the local source descriptions and any bibliography prepared from them. Cite Durand, The New Testament, ‘Origin’, for Luke, and Ladeuze, Epistle to the Ephesians, ‘Date and place of composition’, for Romans."

[[advisories]]
stage = "study-review"
id = "STU-006"
severity = "advisory"
location = "sections/40-the-promised-son.tex, line 17, ‘a woman of our own people’"
problem = "‘Our own people’ can mean the congregation's ethnic community. Bellarmine identifies Mary with ‘our land’ and explains her virginal motherhood. His paragraph makes no claim that the congregation shares an ancestry with her. The surrounding discussion of Israel and other peoples makes the pronoun briefly ambiguous."
required_result = "Name the shared humanity directly, for example ‘Christ takes our human flesh from Mary.’ Keep Bellarmine's account of the Spirit overshadowing her and her bearing the Son."

[[advisories]]
stage = "synthesis-review"
id = "SYN-003"
severity = "advisory"
location = "sections/concise/10-commentary.tex:12"
problem = "The paragraph moves from what the congregation sings to 'Just before the lesson begins, Paul speaks of the love we owe our neighbor.' A reader following the order of Mass could understand this as something else heard in church. Romans 13:8–10 precedes the appointed passage in the letter."
required_result = "Locate the debt of love in the letter explicitly, for example, 'In the verses of his letter just before this Sunday's lesson, Paul speaks of the love we owe our neighbor.'"
