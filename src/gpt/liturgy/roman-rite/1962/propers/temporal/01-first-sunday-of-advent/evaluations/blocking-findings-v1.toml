severity = "advisory"
location = "sections/90-apparatus.tex:5–9"
problem = "The appendix identifies the historical editions and their limits, but readers looking for the line-by-line collation or the account of the reception search get no pointer to those two records."
required_result = "Identify propers/verified.md as the collation and research/scope.md as the record of the exegetical sources and search limits."

[[advisories]]
stage = "synthesis-review"
id = "SYN-AUG-085-ATTR"
severity = "advisory"
location = "sections/concise/04-themes.tex:14, the Alleluia paragraph"
problem = "The paragraph credits Augustine with posing a question about what the singers have asked to receive and then answering it. In English Psalm LXXXV §6 he asks what light brings joy, identifies Christ as the light, and directly explains the psalm’s ‘salvation’ as Christ. The concise study gives the right interpretation but assigns its framing question to him."
required_result = "State the explanation directly in one sentence, for example, ‘Augustine understands the salvation they ask to receive as Christ himself.’ The following sentence can then draw the study’s connection to the Son’s human face."

[[advisories]]
