[[findings]]
stage = "web-review"
id = "WEB-001"
severity = "blocking"
location = "sections/00-opening.tex:25, sections/20-commentary.tex:29 (note 9) and sections/90-apparatus.tex:9. The canonical Markdown shows the three references at lines 39, 572 and 526, respectively."
problem = "Each passage gives “Appendix 7” as the locator for Scriptural Date and Location. Following the link reaches that section, but neither its heading nor the contents assigns it an appendix number. Two references give only the spurious number. The same three numeric references in the canonical TeX point to an unnumbered heading, and the compiled PDF prints an empty locator each time."
required_result = "Refer to the section by its printed title, Scriptural Date and Location, in each of the three places. Preserve a working section link in the reader and verify that the visible wording is complete in both the reader and the typeset study."
repair_target = "study"

[[advisories]]
stage = "research-review"
id = "RES-005"
severity = "advisory"
location = "research/scope.md:36, research/source-bindings.toml:254 and 262, and research/source-dispositions.toml:482 and 493"
problem = "The local research calls two Catholic Encyclopedia articles ‘Synoptics’ and ‘Epistles’. The bound witnesses give different titles. Alfred Durand’s The New Testament, under Origin, explicitly dates Luke to about A.D. 70 at line 33 of the extracted article. Paulin Ladeuze’s Epistle to the Ephesians, under Date and place of composition, places Romans in A.D. 58 at line 69. The artifact identities and the dates in the generated table are correct."
required_result = "Use the actual article titles and sections in the local source descriptions and any bibliography prepared from them. Cite Durand, The New Testament, ‘Origin’, for Luke, and Ladeuze, Epistle to the Ephesians, ‘Date and place of composition’, for Romans."

[[advisories]]
stage = "study-review"
id = "STU-LUKE-ADDRESS"
severity = "advisory"
location = "sections/30-the-judge.tex:5, immediately after the reference to raising their heads"
problem = "The phrase 'change of addressee' and the closing question can give the impression that Jesus first addresses the frightened nations. The Missal introduces the entire speech as addressed to his disciples. The paragraph itself correctly distinguishes speaking of the nations from speaking to the disciples."
required_result = "State the change from description to exhortation directly. For example, 'Jesus has been telling his disciples what others will fear. Now he tells the disciples what they themselves may hope for.'"

[[advisories]]
stage = "study-review"
id = "STU-SCOPE-RECORDS"
severity = "advisory"
location = "sections/90-apparatus.tex:5–9, Appendix: Scope and Qualifications"
problem = "Readers get precise edition references and a description of the commentary's scope, but the appendix omits the pointers to the detailed text collation and research record called for in the 1962 profile's Terminal Apparatus section."
required_result = "Add a short pointer in the appendix identifying propers/verified.md for the element-by-element collation and research/scope.md for the reception search and its limits."

[[advisories]]
stage = "synthesis-review"
id = "SYN-003"
severity = "advisory"
location = "sections/concise/10-commentary.tex:12"
problem = "The paragraph moves from what the congregation sings to 'Just before the lesson begins, Paul speaks of the love we owe our neighbor.' A reader following the order of Mass could understand this as something else heard in church. Romans 13:8–10 precedes the appointed passage in the letter."
required_result = "Locate the debt of love in the letter explicitly, for example, 'In the verses of his letter just before this Sunday's lesson, Paul speaks of the love we owe our neighbor.'"

[[advisories]]
stage = "web-review"
id = "WEB-002"
severity = "advisory"
location = "Canonical Markdown lines 49–51 (Introit) and 207–213 (Preface dialogue), corresponding to the multi-paragraph latinproper blocks in sections/10-appointed-text.tex."
problem = "The shared Latin quotation style covers the whole block in the source. Chromium displays only the first paragraph in italics. The repeated Introit antiphon and the final three Latin exchanges of the Preface dialogue switch to the upright treatment used for the English. The words and quotation boundaries survive."
required_result = "Carry the Latin quotation’s italic style through every paragraph in each multi-paragraph block. Verify the repeated antiphon and the final three exchanges in the rendered reader."
