[[observations]]
stage = "study-review"
location = "sections/30-allegiance.tex; sections/40-response.tex; sections/50-comparison.tex"
note = "The first reading asks how real earthly duties and goods remain subordinate to God; Jerome’s unknowing Cyrus, Chrysostom’s bounded tribute, Aquinas’s explicitly mystical divine-image application and Augustine’s worldwide new song contribute different reasoning. The second asks how the person becomes willing and able to serve; Aquinas’s inward divine action and Chrysostom’s costly faith, love and hope carry the argument, with Jerome’s gifted teacher and Bede’s prior saving gift contributing further reasoning. These are distinguishable complementary interpretations, not two versions of one application. Each engages all ten ritual positions and both Communion alternatives, and differentiates literal, allegorical, moral and anagogical senses."

[[observations]]
stage = "study-review"
location = "sections/10-treatment.tex; sections/30-allegiance.tex; Jerome, Commentary on Isaiah XII, DCO Pars 3 pp.126–129"
note = "Consequential-difficulty test passed. The checked passage identifies Cyrus as the literal anointed king, rejects transferring his ignorance of God to Christ, yet permits a limited typological relation. The study explains why the ignorance clause controls that distinction and why useful political action is not proof of conversion. Its use of Jerome’s concluding application to the gifted ecclesial teacher follows the actual source argument. The electronic witness remains identified as modern typesetting with no established historical exemplar."

[[observations]]
stage = "study-review"
location = "sections/10-treatment.tex; sections/30-allegiance.tex; Chrysostom, Matthew LXX §§1–2; Aquinas, Matthew 22.2 (87389)"
note = "Consequential-difficulty test passed. Chrysostom’s distinction between rendering a debt and making a gift, with godliness limiting civil dues, supports the literal political obligation. Aquinas’s later soul/image application is explicitly mystical in the checked Latin and is correctly distinguished from that literal answer. The study therefore neither abolishes civil duties nor turns Caesar’s claim into an unlimited claim on the person."

[[observations]]
stage = "study-review"
location = "sections/40-response.tex; Aquinas, Philippians 2, lectio 3 (87838), and lectio 4 (87839)"
note = "Consequential-difficulty test passed. The checked Latin rejects both autonomous saving choice and the elimination of free choice; divine movement acts inwardly in the will. It also rejects assigning the beginning of willing to the person independently and only completion to God, or treating help as payment for merit before grace. The study teaches these successive distinctions and connects them intelligibly to the Collect and to received light. Philippians 2:12–13 is explicitly identified as context, not the appointed acclamation."

[[observations]]
stage = "study-review"
location = "sections/10-treatment.tex; sections/40-response.tex; Bede, In Marci III, Mark 10:42–45, PL 92 cols.236A–B"
note = "The PL print image confirms Bede’s sequence: the servant’s form and blood shed for the world, followed by his gloss of for many as those willing to believe. The study presents reception of Christ’s saving gift without claiming that Bede here supplies an independent origin of faith or an automatic salvation of every person. Its separate appeal to Aquinas on willing is correctly identified. Gregory Nazianzen Oration XLV §22 and Aquinas III q.48 a.4, reply 3, really differ in payee formulation; the study explains the distinct arguments without erasing the disagreement. The Gutenberg fourth-article heading’s erroneous Art.3 is disclosed."

