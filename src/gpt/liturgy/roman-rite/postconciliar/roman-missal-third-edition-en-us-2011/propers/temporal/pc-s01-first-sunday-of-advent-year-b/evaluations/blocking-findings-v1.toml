id = "HOM-001"
severity = "advisory"
location = "sections/homily-10-spoken.tex, line 7, opening sentence"
problem = "The phrase “the one hour he was to have watched” can sound as if Peter knew in advance how long Jesus expected him to stay awake. In Mark 14:34 Jesus asks the three to keep watch, and only on returning in verse 37 does he mention an hour."
required_result = "Keep the hour in Jesus’ question on his return. For example, “Jesus calls him Simon and asks if he couldn’t stay awake for one hour.”"

