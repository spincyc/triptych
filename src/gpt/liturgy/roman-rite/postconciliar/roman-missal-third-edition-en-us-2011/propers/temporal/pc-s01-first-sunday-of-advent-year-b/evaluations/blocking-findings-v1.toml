stage = "study-review"
id = "STU-ISA-002"
severity = "advisory"
location = "sections/30-turned-to-god.tex:19, second sentence, on Jerome’s use of Psalm 79:4"
problem = "“He pictures them” assigns the confession and psalm prayer specifically to Isaiah’s ancient speakers. At p. 158 Jerome shifts to “Nos autem” and invites his readers to invoke the Lord with him. The citation of Psalm 79:4 is correct, and the next sentence already distinguishes its use at Mass."
required_result = "Give Jerome’s invitation its first-person force. For example, “Jerome invites his readers to confess their sin, hear God’s promise of pardon and ask in the words of Psalm 79:4 to see his face and be saved.”"
