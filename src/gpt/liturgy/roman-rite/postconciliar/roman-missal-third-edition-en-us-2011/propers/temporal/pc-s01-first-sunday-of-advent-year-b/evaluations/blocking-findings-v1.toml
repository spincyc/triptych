[[findings]]
stage = "web-review"
id = "WEB-JEROME-LINK-001"
severity = "blocking"
location = "sections/90-apparatus.tex:67, References item 7, rendered Markdown line 426"
problem = "The link to Jerome’s Commentary on Isaiah, the source for notes 9–11 and 13, fails in a browser. Chromium reports ERR_CERT_DATE_INVALID. The certificate for documentacatholicaomnia.eu expired on 23 November 2026 at 14:07:08 UTC. The conversion preserves the URL supplied in the study. The printed pages and citations are accurate."
required_result = "Give readers a working route from item 7 to the cited part IV, book XVII, pp. 149–159, and follow it using normal browser certificate checks. The same www host and path over HTTP currently returns the complete 643374-byte PDF with SHA-256 97785e2b71a8bdc60e866af2309a205b119bce40cc16a237692a2cdda41ab7e9, identical to the checked witness. A working HTTPS copy of that witness or a renewed certificate on the existing route would also resolve this."
repair_target = "study"

[[advisories]]
stage = "homily-review"
id = "HOM-ISA-001"
severity = "advisory"
location = "sections/homily-10-spoken.tex line 9, “they can hardly remember anyone”"
problem = "Isaiah 64:6 makes a present confession that no one calls on God. The homily turns that into a recollection and leaves room for exceptions. The following paragraph still makes the point that the people are praying as they confess their neglect."
required_result = "Let the hearer recognize the confession in the first reading. For example, “They tell God that no one among them even calls on him.”"

[[advisories]]
stage = "synthesis-review"
id = "SYN-004"
severity = "advisory"
location = "sections/synthesis-05-commentary.tex:22, Jerome on Isaiah 64 and the Sunday psalm response"
problem = "Calling the shift ‘surprising’ anticipates the reader’s reaction. Later, ‘sings those words too’ follows a sentence about confessing a fault and leaves the reader to decide whether the congregation sings a confession or the petition to see God’s face. Jerome’s Latin distinguishes the two."
required_result = "Open directly with ‘When Isaiah says God has hidden his face, Jerome begins to pray with his readers.’ At the transition to Mass, name what both people sing, for example ‘Beside him another worshipper sings the same plea to see God’s face.’"

[[advisories]]
stage = "web-review"
id = "WEB-PSALM-HEADINGS-001"
severity = "advisory"
location = "sections/90-apparatus.tex:23 and 37, rendered Markdown lines 372, 376 and 390"
problem = "Under the level-three heading “When an Advent common psalm is sung,” Psalm 25 and Psalm 85 both render at level five. The reader contents lists headings through level four, so neither named option appears there, although both passages remain legible in the article."
required_result = "Place the two psalm headings immediately below their common parent at the next heading level, so a reader using the article outline can navigate directly to either alternative."
