  status = "pass"
  evidence = ["src/web/browser/catena/catena-model.js", "tools/tests/test_catena_wave_1.py"]

  [[deliverables.requirements]]
  id = "contradiction-and-partial-license-no-rights-prose"
  criterion = "Where recognised findings contradict each other the rights conclusion is declined and no selected rights prose is emitted — not the harsher claim, not the longest, not the first or last listed — and the same set reads identically in any order; and only a valid typed parent finding together with a partial value of the exact accepted representation produces partial-rights prose, with the accepted representation enforced at the generator as well as the route."
  status = "pass"
  evidence = ["src/web/browser/catena/catena-model.js", "scripts/_catena.py", "tools/tests/test_catena.py", "tools/tests/test_catena_wave_1.py"]

