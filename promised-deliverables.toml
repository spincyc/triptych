  criterion = "The ChatGPT and Claude Ark studies appear in one Mariology catalog row with their distinct titles visible in the provider link labels; both provider PDFs remain distinct, the GPT web reader remains current, every published provider-qualified route carries the intended edition and artwork, and regression coverage prevents either edition from replacing the other."
