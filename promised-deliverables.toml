  criterion = "Every invalid-root and rejected-action path terminates coherently, and the proof asserts the exact final aria-busy, status, live-region contents, announcement journal, tally, visible rows, route, history behaviour, focus target and request ownership; work completing after a newer state has settled — including after a terminal transaction has invalidated the render in flight — alters none of them, and the late completion is counted rather than assumed."
  status = "pass"
  evidence = ["src/web/browser/catena/catena.js", "tools/tests/test_catena_wave_1.py"]

