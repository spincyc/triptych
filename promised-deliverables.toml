[[deliverables]]
id = "gpt-mary-new-ark-journey-2026-08-15"
owner = "src/gpt/theology/mariology/ark-of-the-covenant/research/scope.md"
promise = "Publish a source-audited Catholic Marian study that tells the Ark's scriptural journey, presents Mary as its living New-Covenant fulfillment in Christ, synthesizes authenticated patristic and saintly reception, relates the four Marian dogmas, gives Joseph and Mary's true virginal marriage a positive and proper place in the typology, applies the requested spiritual pedagogy, and includes a source-controlled detailed graphite map and Ark/sanctuary plates in the reviewed GPT PDF and web edition."
state = "complete"

  [[deliverables.requirements]]
  id = "ark-narrative-and-scripture"
  criterion = "The publication gives a vivid source-bound account of the Ark from Sinai through its final scriptural and heavenly horizons, and distinguishes narrated movement, canonical tradition, vision, and geographic uncertainty."
  status = "pass"
  evidence = ["src/gpt/theology/mariology/ark-of-the-covenant"]

  [[deliverables.requirements]]
  id = "new-ark-typology-and-lexical-audit"
  criterion = "The Annunciation and Visitation synthesis checks the overshadowing, hill-country, household, blessing, question, leaping, three-month, and Greek or Septuagintal claims without weakening the Church's affirmative New-Ark reading or overstating verbal identity."
  status = "pass"
  evidence = ["src/gpt/theology/mariology/ark-of-the-covenant/research/lexical-parallels-audit.md"]

  [[deliverables.requirements]]
  id = "patristic-saintly-and-liturgical-reception"
  criterion = "Every patristic, saintly, and liturgical Ark witness used in the publication has an exact locus, edition or checked witness, date and attribution status, while traditional pseudonymous reception is preserved under its honest name."
  status = "pass"
  evidence = ["src/gpt/theology/mariology/ark-of-the-covenant/research/patristic-typology-audit.md"]

  [[deliverables.requirements]]
  id = "four-dogma-synthesis"
  criterion = "The four Marian dogmas are stated according to their exact objects and authorities and presented as the full unfolding of Mary's Ark vocation under Christ's definitive covenantal fulfillment, not as deductions from isolated details."
  status = "pass"
  evidence = ["src/gpt/theology/mariology/ark-of-the-covenant/research/dogma-and-typology-inventory.md"]

  [[deliverables.requirements]]
  id = "virginal-marriage-fulfillment"
  criterion = "Joseph and Mary's true, freely shared virginal marriage receives a positive typological synthesis grounded in Joseph's obedient reception, guardianship, Davidic service, and the ordered custody of holy presence; Uzzah remains a bounded contrast rather than a claim that marriage is defiling or Mary physically dangerous."
  status = "pass"
  evidence = ["src/gpt/theology/mariology/ark-of-the-covenant/research/virginal-marriage-typology.md"]

  [[deliverables.requirements]]
  id = "spiritual-pedagogy"
  criterion = "Original prose and exercises adapt the requested pedagogical movements from C. S. Lewis, Dom Chautard, and Réginald Garrigou-Lagrange while keeping them distinct from biblical, patristic, or dogmatic evidence and respecting rights."
  status = "pass"
  evidence = ["src/gpt/theology/mariology/ark-of-the-covenant/research/pedagogy-plan.md"]

  [[deliverables.requirements]]
  id = "pencil-map"
  criterion = "The reviewed PDF contains a very finely detailed graphite cartographic composition—not rough wavy-line diagram styling—built from pinned Natural Earth and Mapzen inputs with a project-authored semantic overlay whose geography, routes, uncertainties, typological correspondences, accessibility equivalent, provenance, rights, and production checks reconcile to a tracked source matrix."
  status = "pass"
  evidence = ["src/gpt/theology/mariology/ark-of-the-covenant/research/map-provenance.md"]

  [[deliverables.requirements]]
  id = "ark-and-sanctuary-diagrams"
  criterion = "The reviewed publication includes very finely detailed graphite illustrations of the Ark's commanded form and its attested placement in the wilderness Tabernacle, Shiloh, David's tent on Zion, and Solomon's Temple, replacing rough wavy-line schematics while keeping architectural or locational uncertainty explicit and treating no generated pixel as factual evidence."
  status = "pass"
  evidence = [
    "src/gpt/theology/mariology/ark-of-the-covenant/sections/57-ark-and-sanctuaries.tex",
    "src/gpt/theology/mariology/ark-of-the-covenant/research/ark-diagram-audit.md",
  ]

  [[deliverables.requirements]]
  id = "publication-installation"
  criterion = "The settled PDF and faithful web edition are installed under the mirrored GPT Mariology paths, every PDF page and the web conversion are reviewed, and the owning catalog and alpha release record discover the work."
  status = "pass"
  evidence = [
