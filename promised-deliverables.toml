[[deliverables]]
id = "corpus-browser-catena-e1-corrections-v16-2026-08-27"
owner = "src/web/browser/catena"
promise = "Answer the E1 Catena V15 independent review (SEMANTIC CHANGES REQUIRED and EVIDENCE CHANGES REQUIRED, CHANGES REQUIRED overall, at exact head b9202882badbbbc364f1dd3d9057d2710ee47552, recorded at review commit 67247ecc39a6e5f6224c64ca3ab1af163ee023b1 on review/catena-wave-1-e1-corrections-v15-independent) with exactly its stated next action and nothing else: normalize fragment payloads once, at settlement, into an owner-independent, null-prototype, frozen, scalar-only record taken by own descriptor over a fixed key set; publish that finished value by path and never the initiating owner's pending promise, so no reentrant lookup can retrieve unresolved or partial work at any instant; carry a per-caller completion envelope containing the exact row transport owner to the body sink, sealed so a same-shaped literal is not one, and require that owner at application against the transport held for that very row and the projection that made it; record the body only after the DOM write is confirmed, and leave no entry at all for a write that throws or silently does not take; rebind a finished cached value to a later owner through that owner's own completion; add the missing provenance-specific === assertion and correct the observation accounting and its vocabulary; re-run every V15 and V14 closure the review passed and count them as REGRESSIONS rather than as new closures; and rebuild the evidence package with executable post-sanitization commands and explicit cwd and environment, unambiguous repo variables, a classifier that rejects prose and a checker that does not trust its own label, mechanically derived tool execution with its drivers classified correctly and one phase-labelled count set, the complete nine-attempt V15 predecessor history and a complete V16 attempt history, the corrected example figures stated apart and never summed, per-row compare-gate diagnostics beside the sound whole-report verdict, a final-state completeness check naming the outer sanitize and scan logs, direct authority bindings, and an explicit shipped-versus-local retained-artifact privacy boundary. Record every other blocker open and untouched, raise no ceiling, and return that head for fresh independent review."
state = "in_progress"

  [[deliverables.requirements]]
  id = "no-reentrant-pending-publication"
  criterion = "No unresolved or partial work is reachable by path at any instant, including reentrantly. The page runs the finalizer to completion and only then publishes: `M.textPayload(file)` produces the finished value before `fragmentTexts.set(path, content)` runs, so the V15 ordering in which `fragmentTexts.set(path, asked)` executed inside the fulfilment handler of the promise returned by `.then()` — leaving `Promise { <pending> }` briefly path-visible and publishing before the freeze — cannot recur. A synchronous reentrant path lookup taken at the moment of publication observes a finished, frozen value or nothing."
  status = "pass"
  evidence = ["src/web/browser/catena/catena.js", "src/web/browser/catena/catena-model.js"]

  [[deliverables.requirements]]
  id = "finalized-immutable-cache-values"
  criterion = "What is shared by path is a finalized value and never a promise, a raw parsed file or a partially projected record. `sealText` produces a frozen, null-prototype, scalar-only record over the fixed key set `M.TEXT_SCHEMA`, admitting a boolean or `sound()`'s string and nothing else, so no nested mutable structure can be present in the shared value to be mutated afterwards. `M.NO_TEXT` is the finished value for a row that resolves no address, a finalized value like any other rather than a sentinel recognized by identity."
  status = "pass"
  evidence = ["src/web/browser/catena/catena-model.js"]

  [[deliverables.requirements]]
  id = "mutable-prototype-payload-closed"
  criterion = "The finalized record is built from own data alone. Every field is taken by own descriptor through `ownData`, so nothing inherited is visible and no own accessor is invoked, closing the V15 defect in which a shallow-frozen raw file with a mutable prototype was read at render time by ordinary prototype-sensitive lookup and a frozen empty object could turn from unreadable to readable between one reader and the next by prototype mutation alone, or by a getter answering differently on a second read."
  status = "pass"
  evidence = ["src/web/browser/catena/catena-model.js"]

  [[deliverables.requirements]]
  id = "completion-envelope-exact-owner"
  criterion = "A settled transport is sealed into one frozen envelope carrying the exact `rowTransport` owner beside the finalized content. `M.textCompleted(owner, content)` and `M.textFailed(owner, error)` mint an envelope only against an owner the model is currently holding for that owner's own row and, for a success, only around content the model itself finalized; membership is held in a `WeakSet`, so a literal of the same shape is not one of these. The envelope is per-caller by construction and never becomes the shared path-cache value, and a finished cached value is rebound to a later owner through that owner's own envelope."
  status = "pass"
  evidence = ["src/web/browser/catena/catena-model.js"]

  [[deliverables.requirements]]
  id = "cross-owner-content-rejected"
  criterion = "An actual projected row presented with content it never asked for applies nothing. `M.bodyAsked(row, completed)` refuses a completion the model did not seal, a completion sealed for any other owner, and any value supplied in place of one, closing the V15 boundary at which `bodyAsked(row, content)` authorized ANY content whenever `row` occurred in `rowOwners` — so that an actual B row accepted arbitrary A content, and the V15 direct test deliberately accepted `{text: \"x\"}` with no owned completion behind it."
  status = "pass"
  evidence = ["src/web/browser/catena/catena-model.js"]

  [[deliverables.requirements]]
  id = "body-application-completion-owned"
  criterion = "Application is authorized by three exact-object comparisons and by nothing weaker: the completion is one this model sealed, its owner is the transport the model holds for that very row, and the owner's projection is the projection that made the row. No path, id, string or generation counter takes part. A row no projection of the model made applies nothing, and a reported transport failure is owned exactly as a fulfilled body is."
  status = "pass"
  evidence = ["src/web/browser/catena/catena.js", "src/web/browser/catena/catena-model.js"]

  [[deliverables.requirements]]
  id = "post-write-body-journal"
  criterion = "The body journal follows the DOM write instead of preceding it. `M.bodyApplied(row, completed, wrote)` appends only when the completion is still owner-valid and the write is confirmed, and each entry binds the owner object, the row, the projection, the address, the finalized content value itself and the post-write success state — not a path and a row id that two rows could share. The confirmation is read back from the node, and its scope is recorded honestly: it confirms the fragment's body text, not the acknowledgement block or the apparatus paragraphs written beside it."
  status = "pass"
  evidence = ["src/web/browser/catena/catena.js", "src/web/browser/catena/catena-model.js"]

  [[deliverables.requirements]]
  id = "write-failure-no-applied-record"
  criterion = "A write that fails leaves no applied-body record at all. The write runs inside a `try`, so a throwing write appends nothing and resets the retry flag truthfully; a write that silently does not take is caught by the read-back comparison and likewise appends nothing. An append-only body journal that cannot say a body reached the page stays silent about it rather than recording a body that was never written."
  status = "pass"
  evidence = ["src/web/browser/catena/catena.js"]

  [[deliverables.requirements]]
  id = "provenance-identity-assertion"
  criterion = "The committed equality matrix carries a provenance-specific `===` assertion. The V15 review confirmed by source inspection and independent replay that provenance already consumes the authoritative projection object, and recorded that the committed matrix nonetheless lacked the assertion that proves it; the assertion is added so the roster proves the identity rather than resting on inspection."
  status = "open"
  evidence = ["tools/tests/test_catena_wave_1.py"]

  [[deliverables.requirements]]
  id = "corrected-observation-accounting"
  criterion = "The observation accounting states every kind of observation the run performs and uses one consistent vocabulary. The `getPrototypeOf` observation caused by key enumeration is counted and named, where V15's prose omitted it while calling its list exhaustive; the conflicting use of `has` for what is an own-property test performed through the descriptor trap is corrected; and the \"four kinds\"/\"nothing else\" phrasing is replaced with the claim the lane is entitled to make — that no consumer runs a hostile value accessor and no consumer reaches past the projection to observe the record again. The reproduced figures stand: zero value reads, zero `in` tests, three descriptor observations per source key, two per stated field, one per absent field, one key enumeration."
  status = "open"
  evidence = ["PROJECT-WORK.md", "tools/tests/test_catena_wave_1.py"]

  [[deliverables.requirements]]
  id = "executable-command-representation"
  criterion = "Every authoritative command row is recorded as text that can be run as written. No row is a paraphrase, a prose sentence, an elision, or a shell fragment missing its arguments, its working directory or its environment. The V15 defect this closes is a `checks.txt` that called all 24 rows `LITERAL` while only 16 were replayable with their recorded context."
  status = "open"
  evidence = ["guidance/external-review-handoffs.md"]

  [[deliverables.requirements]]
  id = "unambiguous-repo-variables"
  criterion = "No command row single-quotes `$WORKSPACE` or `$REPO` where expansion is required, and no row overloads one variable for two distinct locations. V15 had seven load-bearing rows containing `'$WORKSPACE/...'` or `'$REPO/...'` anchors that cannot expand with no assignments supplied, and a parent replay that used `$REPO` for both the parent working directory and the distinct V15 test source, so unquoting alone could not recover the recorded execution. The package-comparison row states its required package working directory and agrees with the ledger."
  status = "open"
  evidence = ["guidance/external-review-handoffs.md"]

  [[deliverables.requirements]]
  id = "prefix-prose-rejection"
  criterion = "The command classifier rejects prose rather than accepting it by prefix match, and the handoff checker tests each row instead of trusting a precomputed `LITERAL` label. The packaged mutation tests exercise quoted anchors, ambiguous working directories, `cp`, uppercase quoted data and prefix overmatch — the cases V15's tests omitted, in modules V15 then classified as not executed — and the classifier no longer accepts `format`, `installing` or `zipcode` as commands."
  status = "open"
  evidence = ["guidance/external-review-handoffs.md"]

  [[deliverables.requirements]]
  id = "mechanically-derived-tool-execution"
  criterion = "Execution state is derived mechanically from the authoritative attempt logs, not hand-maintained and not synthesized. No row is manufactured for a tool that never ran: V15 synthesized six not-executed rows carrying a fabricated `at` (the render instant), a fabricated `phase` and a fabricated `log` — three fields a tool that never ran cannot have — and sampled repeated Python and Git uses rather than counting them. One phase-labelled schema carries tool identity, unique tool count, invocation count, executed state, trusted source identity, shipped state and transcript references, and the package contains exactly one such count set per phase, each labelled, where V15 sealed two unlabelled and irreconcilable sets: `verify-final.log` and `.tool-bytes.json` at 20 unique tools with 11 executed and 22 shipped-executed invocations, against `.assemble.log` at `executed_tools 14, executed_invocations 27, merged_battery_invocations 6`."
  status = "open"
  evidence = ["guidance/external-review-handoffs.md"]

  [[deliverables.requirements]]
  id = "executed-drivers-classified"
  criterion = "Every script that drove the build is classified as executed. V15 marked both `assemble.sh` and `battery.sh` not executed although the assembly transcript proves they ran and produced the package; a driver the record's own logs prove ran is labelled executed, and a classification contradicted by a transcript sealed in the same package fails the handoff check rather than shipping."
  status = "open"
  evidence = ["guidance/external-review-handoffs.md"]

  [[deliverables.requirements]]
  id = "nine-attempt-predecessor-history"
  criterion = "The V15 predecessor history is stated completely and truthfully: nine package attempts across three ledgers — eight resolved non-authoritative and one final authority — plus four battery attempts, not five refusals followed by a sixth seal. The statement names the shipped ledger (`SIDE.attempts.jsonl`, 107 rows, ordinals 01-06) and the two retired-and-unshipped ledgers (2,501 bytes over 5 rows, SHA-256 64683c0b8bb9624278cb136e8e8cbcbd4875bff571a1a128a870bdb6cb01ed90; 45,619 bytes over 80 rows, SHA-256 5b0c380cf7fab7b507dfedd6bdc0a6ade71cea38522937bf1a6bf851565ec117); the five retired attempts refused at P2, P5, P5, P4 and, after sealing, at the ledger audit before P7 for a package timestamp minted an hour before the attempts it named; ordinal 03 superseded on a final-verification exit 1, ordinal 04 sealed then briefly AUTHORITATIVE at P9 then superseded at P10 when the authority-coherence gate refused, ordinal 05 discarded at the P5 attempt-log audit, and ordinal 06 the shipped authority; the three ordinal reissues caused by file-scoped allocation across two ledger moves; the retired battery with no terminal row because nothing terminated it; and the `PROVENANCE.md` declaration that the lane set no cohort aside, made while two green retired batteries had their figures declined."
  status = "open"
