[[deliverables]]
id = "liturgy-reader-state-m1-2026-08-03"
owner = "src/web/browser/liturgy/reader-state.js"
promise = "Define the first W1/W9 shared semantic reader-state, URL, fixture, and Day/Propers/CLI parity contract without changing production reader behavior."
state = "complete"

  [[deliverables.requirements]]
  id = "shared-contract"
  criterion = "A versioned DOM-free, fail-closed contract distinguishes Day and Propers, rejects malformed or unknown v1 state, enforces mode and entrance consistency, and represents typed coverage, absence, unresolved authorized choices, and entrance-specific Compare anchors."
  status = "pass"
  evidence = [
    "src/web/browser/liturgy/reader-state.js",
    "src/web/browser/liturgy/reader-state-adapters.js",
    "guidance/liturgy-reader-state.md",
  ]

  [[deliverables.requirements]]
  id = "url-compatibility"
  criterion = "Every current Day and Propers URL key is inventoried and tested for manifest validation, precedence, storage-free operation, fail-closed explicit values, safe unknown-key handling, and canonical round trips."
  status = "pass"
  evidence = ["tools/tests/test_liturgy_reader_state.py"]

  [[deliverables.requirements]]
  id = "semantic-fixtures-and-parity"
  criterion = "Versioned production-backed and non-public synthetic fixtures prove semantic parity across Day, Propers, and mass-today --expanded without duplicating calendar or seating logic, including structured cycle alternatives that cannot be merged or selected by order."
  status = "pass"
  evidence = [
    "tools/tests/fixtures/liturgy-reader-state/v1",
    "tools/tests/test_liturgy_reader_state.py",
  ]

  [[deliverables.requirements]]
  id = "production-behavior-boundary"
  criterion = "Current route HTML, CSS, JavaScript, liturgical/generated data, selector contents, and supported URL meanings remain unchanged; the M1 modules are not loaded by either route."
  status = "pass"
  evidence = [
    "src/web/browser/liturgy/day.html",
    "src/web/browser/liturgy/index.html",
    "tools/tests/test_liturgy_reader_state.py",
  ]

  [[deliverables.requirements]]
  id = "external-acceptance"
  criterion = "The immutable M1 handoff receives external review and every blocking finding is resolved before M1 is marked accepted."
  status = "pass"
  evidence = [
    "guidance/liturgy-browser-roadmap.md",
    "PROJECT-WORK.md",
  ]
  check = "contains"
  path = "guidance/liturgy-browser-roadmap.md"
  needle = "c1a590f5854215d68d167d9040e188f41762663e"

[[deliverables]]
id = "liturgy-reader-shell-m2-candidate-2026-08-03"
owner = "src/web/browser/liturgy/prototypes/reader-shell"
promise = "Prototype and measure one shared responsive reader shell for the distinct Day and Propers entrances without integrating production routes, later mode engines, search, comparison semantics, recension work, or liturgical data changes."
state = "candidate"

  [[deliverables.requirements]]
  id = "shared-responsive-prototype"
  criterion = "One noindex, unlinked, non-production prototype reuses the current Proper renderer and demonstrates both entrances, all four global actions, persistent and scroll-reveal reachability variants, representative states, semantic Contents, coherent Study, and print composition."
  status = "pass"
  evidence = [
    "src/web/browser/liturgy/prototypes/reader-shell",
    "guidance/liturgy-reader-shell-prototype.md",
  ]

  [[deliverables.requirements]]
  id = "interaction-accessibility-and-measurement"
  criterion = "Focused unit and real-browser checks, accessibility review, performance and size measurements, required viewport captures, deep-scroll checks, 320-pixel reflow, and print review support a measured shell recommendation."
  status = "pass"
  evidence = [
    "tools/tests/test_liturgy_reader_shell.py",
    "guidance/liturgy-reader-shell-prototype.md",
  ]

  [[deliverables.requirements]]
  id = "production-boundary"
  criterion = "Current Day and Propers production route sources and behavior, M1 semantics, public generated data and manifests, selector contents, and existing URL meanings remain unchanged; the nested prototype is excluded from production navigation and the public artifact."
  status = "pass"
  evidence = [
    "src/web/browser/liturgy/day.html",
    "src/web/browser/liturgy/index.html",
    "tools/tests/test_liturgy_reader_shell.py",
  ]

  [[deliverables.requirements]]
  id = "external-review-candidate"
  criterion = "The immutable responsive prototype handoff is ready for external review and the roadmap records M2 only as a candidate pending that review."
  status = "pass"
  evidence = [
    "guidance/liturgy-browser-roadmap.md",
    "guidance/liturgy-reader-shell-prototype.md",
  ]

