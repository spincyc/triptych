  id = "published-hash-contracts-pinned"
  criterion = "Every published hash key of every instrument is pinned by test before any router cleanup, including the keys that are deliberately input-only."
  status = "pass"
  evidence = [
    "tools/tests/test_browser_url_contract.py",
  ]

  [[deliverables.requirements]]
  id = "shared-shell-blocking-collisions-resolved"
  criterion = "The four selector and plumbing hazards that block a shared shell are resolved with an unchanged rendered DOM: the `#reading`/`#banner` hard-coding, history's `.field`, texts' `.detail`, and `day-missal.css`'s unscoped `body > .site-header`."
  status = "open"
  evidence = [
    "src/web/browser/shared/browser-core.js",
    "src/web/browser/history/history.css",
    "src/web/browser/texts/texts.css",
    "tools/tests/test_browser_collisions.py",
