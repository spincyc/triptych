name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# These declarations are consumed only by the manual print and toolchain-image
# workflows. Keeping their shared immutable baseline here preserves the image
# publisher's existing contract; normal Pages deployment never pulls this image
# or installs these packages.
env:
  ARCH_IMAGE: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
  ARCH_SNAPSHOT: "2026/09/04"
  ARCH_PACKAGES: >-
    texlive-bin texlive-basic texlive-latex texlive-latexrecommended
    texlive-latexextra texlive-pictures texlive-fontsrecommended
    texlive-fontsextra poppler python python-yaml make git diffutils
  TEXLIVE_IMAGE: ghcr.io/spincyc/triptych-texlive@sha256:fd64daf839c719eef559ca0c74b0b93fb3d6f710ce057561b76500adcd150617

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRIPTYCH_BROWSER_DATA_ROOT: build/browser-data
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install source publication dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-public-alpha.txt -r requirements-tools.txt

      - name: Identify exact browser products
        id: browser-products
        run: |
          set -euo pipefail
          identity="$(python tools/tpt browser-products key)"
          [[ "$identity" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid browser product content identity' >&2; exit 1; }
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      # A prefix match supplies candidate family entries only. The source gate
      # verifies current family identities and every byte before any consumer
      # reads them; a miss derives the exact products offline from sources.
      - name: Restore browser product candidates
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/browser-data
          key: triptych-browser-products-v1-${{ steps.browser-products.outputs.identity }}
          restore-keys: |
            triptych-browser-products-v1-

      # This optional public pack contains untrusted candidates, never authority.
      # Only explicit CI bootstrap may fetch it; ordinary builds remain offline.
      - name: Bootstrap optional browser product candidates
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python scripts/_browser_cache_bootstrap.py --fetch

      # public-site prepares and verifies the committed product descriptor before
      # source gates and consumers. Missing families reproduce its exact bytes
      # offline; stale inputs fail without a whole-corpus research replay.
      - name: Validate sources and build public artifact
        run: make public-site

      # Keep the restored path constant so GitHub can reuse older per-family
      # candidates. Save mechanically verified products before the independent
      # site verification, so a later failure does not repeat the cold build.
      - name: Retain verified current browser products
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python tools/tpt browser-products prune

      - name: Save verified browser products
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/browser-data
          key: triptych-browser-products-v1-${{ steps.browser-products.outputs.identity }}

      - name: Verify artifact and GitHub Pages compatibility
        run: python tools/tpt public-alpha verify --deployment-target github-pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload verified artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/public-alpha/site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
