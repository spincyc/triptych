name: Publish GitHub Pages

on:
  push:
    branches: [main]
    # Operational status has no browser-product or published-site inputs.
    paths-ignore:
      - PROJECT-WORK.md
      - promised-deliverables.toml
  workflow_dispatch:

# Each job widens this explicitly. Only `deploy` can publish: it alone holds
# the Pages write and OIDC grants after the verified site and print shards agree.
permissions:
  contents: read

concurrency:
  # Main retains its production lock. A branch timing run never queues or
  # supersedes a production deployment.
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-verify-{0}', github.ref) }}
  cancel-in-progress: false

# These declarations are the shared immutable TeX baseline. The manual print
# and toolchain-image workflows read them from this file, and the
# `print-compile` job below builds its compiler from TEXLIVE_IMAGE and
# ARCH_SNAPSHOT. The `build` job runs TEXLIVE_IMAGE only to compile web-edition
# figures (TikZ to SVG); it installs none of these packages.
env:
  ARCH_IMAGE: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
  ARCH_SNAPSHOT: "2026/09/04"
  ARCH_PACKAGES: >-
    texlive-bin texlive-basic texlive-latex texlive-latexrecommended
    texlive-latexextra texlive-pictures texlive-fontsrecommended
    texlive-fontsextra texlive-xetex texlive-langeuropean gnu-free-fonts
    poppler python
    python-yaml make git diffutils
  TEXLIVE_IMAGE: ghcr.io/spincyc/triptych-texlive@sha256:4098e7c164c67b3e7abf78ef2748716926f5f935b25e54d1e8d98bdd1314c6ec

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      print-site-key: ${{ steps.print-site-key.outputs.key }}
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      pages: read
    env:
      TRIPTYCH_BROWSER_DATA_ROOT: build/browser-data
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # Full commit and tree history, blobs only for HEAD: each edition's
      # "Last revised" stamp is derived from `git log` over its sources
      # (scripts/_edition_revision.py), which refuses a shallow clone.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # Changed-path Bloom filters accelerate the edition revision queries.
      - name: Index changed paths in Git history
        run: git rev-parse HEAD | git commit-graph write --stdin-commits --changed-paths

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install source publication dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-public-alpha.txt -r requirements-tools.txt

      # These are native browser compiler inputs, not generated PDFs. Cached
      # bytes remain untrusted until the committed runtime manifest verifies
      # every engine, package, font and notice. No TeX engine runs in this job;
      # `print-compile` typesets every admitted edition in parallel with it.
      - name: Restore native TeX runtime candidates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/native-tex-runtime
          key: triptych-native-tex-v1-${{ hashFiles('src/common/native-tex-runtime.json') }}

      - name: Hydrate and verify native TeX runtime assets
        run: python scripts/_native_tex_assets.py hydrate --fetch

      # The descriptor's digest selects candidates cheaply. pages-site checks
      # current canonical sources and every selected file before publication.
      # A prefix match supplies candidate family entries only. The source gate
      # verifies current family identities and every byte before any consumer
      # reads them; a miss derives the exact products offline from sources.
      - name: Restore browser product candidates
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/browser-data
          key: triptych-browser-products-v1-${{ hashFiles('release/browser-products.json') }}
          restore-keys: |
            triptych-browser-products-v1-

      # This optional public pack contains untrusted candidates, never authority.
      # Only explicit CI bootstrap may fetch it; ordinary builds remain offline.
      - name: Bootstrap optional browser product candidates
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python scripts/_browser_cache_bootstrap.py --fetch

      # Web readers are converted from canonical TeX at build time (the
      # `web-editions` product family). Install exactly the pinned official
      # converter so a cold family reproduces the committed bytes.
      - name: Install the pinned web-edition converter
        run: |
          set -euo pipefail
          python scripts/_install_web_edition_pandoc.py --fetch --bin-dir "$RUNNER_TEMP/web-edition-toolchain"
          printf '%s\n' "$RUNNER_TEMP/web-edition-toolchain" >> "$GITHUB_PATH"

      # Only the checkout binds a figure's source, compiler, image, SVG size
      # and SHA-256. A restored file is just a candidate for those checks.
      - name: Restore web figure candidates
        id: figure-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/pages-web-figures
          key: triptych-pages-figures-v1-${{ runner.arch }}-${{ hashFiles('.github/web-figure-digests.json', 'scripts/_web_edition_figures.py') }}
          restore-keys: |
            triptych-pages-figures-v1-${{ runner.arch }}-

      # The first run can recover the preceding deployment's SVGs without a
      # multi-gigabyte image pull. A partial download is usable; the compiler
      # verifies candidates again and double-compiles every remaining miss.
      - name: Bootstrap optional published web figure candidates
        if: steps.figure-cache.outputs.cache-hit == ''
        run: |
          timeout 15s python .github/scripts/bootstrap-web-figures.py .scratch/pages-web-figures || echo "Continuing with available figure candidates"

      # The writer and verifier authenticate separate source catalogs from
      # the print workers. The verifier prepares its canonical expectations
      # while Make builds the site, then waits for every source gate and the
      # writer to succeed before it opens and checks the resulting artifact.
      - name: Validate sources, build and verify public artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TRIPTYCH_BROWSER_PRUNE: ${{ steps.browser-cache.outputs.cache-hit != 'true' && '1' || '' }}
          TRIPTYCH_WEB_FIGURE_CANDIDATES: .scratch/pages-web-figures
        run: python .github/scripts/pages-native-reference.py --verify-site

      - name: Retain current web figures
        if: steps.figure-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf -- .scratch/pages-web-figures
          cp -R build/web-figures .scratch/pages-web-figures

      - name: Save verified browser products
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/browser-data
          key: triptych-browser-products-v1-${{ hashFiles('release/browser-products.json') }}

      - name: Identify every print bundle in the verified artifact
        id: print-site-key
        run: |
          key="$(python .github/scripts/verify-native-print.py site-key --site build/public-alpha/site --revision "$GITHUB_SHA")"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The `github-pages` artifact is deployed only by `deploy`, after the
      # print gate has also passed.
      - name: Upload verified artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/public-alpha/site
          include-hidden-files: true

  corpus-check:
    name: canonical-check (check-corpus-index)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # Changed-path Bloom filters accelerate the edition revision queries.
      - name: Index changed paths in Git history
        run: git rev-parse HEAD | git commit-graph write --stdin-commits --changed-paths

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install source preparation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-public-alpha.txt -r requirements-tools.txt

      - name: Run canonical source check
        run: make check-corpus-index

  # Every admitted print edition (provider publications and companions, Bibles,
  # papal selections, reading-plan volumes) is typeset from the exact source
  # bundle the site serves under native-tex/, with the engine that bundle names
  # and the browser's pass policy, in the pinned TeX Live toolchain. It fails
  # when an edition does not compile, produces no PDF or does not settle, when
  # the admitted and materialized sets differ, or when any edition opens a file
  # outside its bundle and the browser runtime's `texFiles`, so no bundle can
  # silently depend on a file the WebAssembly runtime lacks. Bundle preparation
  # reads only tracked sources: it needs neither the hydrated browser runtime
  # nor any print asset hydration. Native engines are not the WebAssembly
  # engines; this proves the bundle and runtime closure, not byte identity.
  print-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PRINT_COMPILE_OUT: .scratch/native-print-compile
      PRINT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

    steps:
      # Bundles carry each edition's derived revision stamp; see `build`.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # Changed-path Bloom filters accelerate the edition revision queries.
      - name: Index changed paths in Git history
        run: git rev-parse HEAD | git commit-graph write --stdin-commits --changed-paths

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install source preparation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-public-alpha.txt -r requirements-tools.txt

      # The service image's `toolchain` stage: the pinned TeX Live image plus
      # archive-pinned XeTeX and Latin Babel support, verified by its own font
      # and hyphenation probes. The anonymous base pull needs no token.
      - name: Prepare this partition and build the pinned print toolchain
        run: |
          set -euo pipefail
          [[ "$TEXLIVE_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo 'TEXLIVE_IMAGE must name an immutable digest' >&2; exit 1; }
          [[ "$ARCH_SNAPSHOT" =~ ^[0-9]{4}/[0-9]{2}/[0-9]{2}$ ]] || { echo 'ARCH_SNAPSHOT must name a daily archive' >&2; exit 1; }
          docker build --target toolchain \
            --build-arg "PRINT_BASE=$TEXLIVE_IMAGE" --build-arg "ARCH_SNAPSHOT=$ARCH_SNAPSHOT" \
            --tag "triptych-print-compile:$GITHUB_RUN_ID" containers/native-print &
          image_pid=$!
          # These gates read canonical sources. Their reference cannot be
          # uploaded until they pass, even if the same job is retried.
          (
            case "$PRINT_SHARD" in
              2/*) make check-proper-chronology-current ;;
              3/*) make check-source-graph ;;
            esac
          ) &
          gate_pid=$!
          status=0
          python tools/tpt native-print-compile prepare --shard "$PRINT_SHARD" --out "$PRINT_COMPILE_OUT" \
            --publication-sources --export-reference "$RUNNER_TEMP/native-print-reference" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" || status=$?
          wait "$image_pid" || status=$?
          wait "$gate_pid" || status=$?
          exit "$status"

      - name: Share the source-derived native partition with the site builder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-print-reference-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/native-print-reference
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Compile every edition in the partition from its bundle alone
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --tmpfs /tmp --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 \
            "triptych-print-compile:$GITHUB_RUN_ID" \
            python tools/tpt native-print-compile compile --out "$PRINT_COMPILE_OUT" --jobs "$(nproc)"

      - name: Show the print compile summary
        if: ${{ !cancelled() }}
        run: cat "$PRINT_COMPILE_OUT/summary.json" || true

      - name: Upload print compile receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-print-compile-${{ github.run_id }}-shard-${{ matrix.shard }}
          overwrite: true
          path: |
            ${{ env.PRINT_COMPILE_OUT }}/summary.json
            ${{ env.PRINT_COMPILE_OUT }}/receipts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Read only the receipts from this workflow run. The build computed its key
  # from the exact site it verified and uploaded. A partial retry can reuse
  # successful sibling shards from the same run and source revision.
  print-verify:
    needs: [build, print-compile, corpus-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the receipt verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/verify-native-print.py
            /scripts/_native_print_compile.py

      - name: Download this run's native print receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-print-compile-${{ github.run_id }}-shard-*
          path: .scratch/print-shards

      - name: Match all compiled mounts to the verified artifact
        env:
          SITE_KEY: ${{ needs.build.outputs.print-site-key }}
        run: python .github/scripts/verify-native-print.py join --receipts .scratch/print-shards --shards 8 --revision "$GITHUB_SHA" --site-key "$SITE_KEY"

  # Publishing is this job's only act. Both gates must have passed the join.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [print-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
