name: Publish GitHub Pages

on:
  push:
    branches: [main]
    # Operational status has no browser-product or published-site inputs.
    paths-ignore:
      - PROJECT-WORK.md
      - promised-deliverables.toml
  workflow_dispatch:

# Each job widens this explicitly. Only `deploy` can publish: it alone holds
# the Pages write and OIDC grants, and it needs both `build` and `print-compile`.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# These declarations are the shared immutable TeX baseline. The manual print
# and toolchain-image workflows read them from this file, and the
# `print-compile` job below builds its compiler from TEXLIVE_IMAGE and
# ARCH_SNAPSHOT. The `build` job runs TEXLIVE_IMAGE only to compile web-edition
# figures (TikZ to SVG); it installs none of these packages.
env:
  ARCH_IMAGE: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
  ARCH_SNAPSHOT: "2026/09/04"
  ARCH_PACKAGES: >-
    texlive-bin texlive-basic texlive-latex texlive-latexrecommended
    texlive-latexextra texlive-pictures texlive-fontsrecommended
    texlive-fontsextra texlive-xetex texlive-langother poppler python
    python-yaml make git diffutils
  TEXLIVE_IMAGE: ghcr.io/spincyc/triptych-texlive@sha256:fd64daf839c719eef559ca0c74b0b93fb3d6f710ce057561b76500adcd150617

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    env:
      TRIPTYCH_BROWSER_DATA_ROOT: build/browser-data
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # Full commit and tree history, blobs only for HEAD: each edition's
      # "Last revised" stamp is derived from `git log` over its sources
      # (scripts/_edition_revision.py), which refuses a shallow clone.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install source publication dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-public-alpha.txt -r requirements-tools.txt

      # These are native browser compiler inputs, not generated PDFs. Cached
      # bytes remain untrusted until the committed runtime manifest verifies
      # every engine, package, font and notice. No TeX engine runs in this job;
      # `print-compile` typesets every admitted edition in parallel with it.
      - name: Restore native TeX runtime candidates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/native-tex-runtime
          key: triptych-native-tex-v1-${{ hashFiles('src/common/native-tex-runtime.json') }}

      - name: Hydrate and verify native TeX runtime assets
        run: python scripts/_native_tex_assets.py hydrate --fetch

      - name: Identify exact browser products
        id: browser-products
        run: |
          set -euo pipefail
          identity="$(python tools/tpt browser-products key)"
          [[ "$identity" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid browser product content identity' >&2; exit 1; }
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      # A prefix match supplies candidate family entries only. The source gate
      # verifies current family identities and every byte before any consumer
      # reads them; a miss derives the exact products offline from sources.
      - name: Restore browser product candidates
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/browser-data
          key: triptych-browser-products-v1-${{ steps.browser-products.outputs.identity }}
          restore-keys: |
            triptych-browser-products-v1-

      # This optional public pack contains untrusted candidates, never authority.
      # Only explicit CI bootstrap may fetch it; ordinary builds remain offline.
      - name: Bootstrap optional browser product candidates
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python scripts/_browser_cache_bootstrap.py --fetch

      # Web readers are converted from canonical TeX at build time (the
      # `web-editions` product family). Install exactly the pinned official
      # converter so a cold family reproduces the committed bytes.
      - name: Install the pinned web-edition converter
        run: |
          set -euo pipefail
          python scripts/_install_web_edition_pandoc.py --fetch --bin-dir "$RUNNER_TEMP/web-edition-toolchain"
          printf '%s\n' "$RUNNER_TEMP/web-edition-toolchain" >> "$GITHUB_PATH"

      # public-site prepares and verifies the committed product descriptor before
      # source gates and consumers. Missing families reproduce its exact bytes
      # offline; stale inputs fail without a whole-corpus research replay. Its
      # figure step (tools/web-edition figures) compiles each web edition's TikZ
      # figures, twice and refused unless byte-identical, inside the pinned TeX
      # image (no network); the SVGs are not committed products, and the site
      # build checks every reader's figure set against them.
      - name: Validate sources and build public artifact
        run: |
          set -euo pipefail
          [[ "$TEXLIVE_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo 'TEXLIVE_IMAGE must name an immutable digest' >&2; exit 1; }
          make public-site WEB_FIGURES_RUNNER="docker:$TEXLIVE_IMAGE"

      # Keep the restored path constant so GitHub can reuse older per-family
      # candidates. Save mechanically verified products before the independent
      # site verification, so a later failure does not repeat the cold build.
      - name: Retain verified current browser products
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python tools/tpt browser-products prune

      - name: Save verified browser products
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/browser-data
          key: triptych-browser-products-v1-${{ steps.browser-products.outputs.identity }}

      - name: Verify artifact and GitHub Pages compatibility
        run: python tools/tpt public-alpha verify --deployment-target github-pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The `github-pages` artifact is deployed only by `deploy`, after the
      # print gate has also passed.
      - name: Upload verified artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/public-alpha/site
          include-hidden-files: true

  # Every admitted print edition (provider publications and companions, Bibles,
  # papal selections, reading-plan volumes) is typeset from the exact source
  # bundle the site serves under native-tex/, with the engine that bundle names
  # and the browser's pass policy, in the pinned TeX Live toolchain. It fails
  # when an edition does not compile, produces no PDF or does not settle, when
  # the admitted and materialized sets differ, or when any edition opens a file
  # outside its bundle and the browser runtime's `texFiles`, so no bundle can
  # silently depend on a file the WebAssembly runtime lacks. Bundle preparation
  # reads only tracked sources: it needs neither the hydrated browser runtime
  # nor any print asset hydration. Native engines are not the WebAssembly
  # engines; this proves the bundle and runtime closure, not byte identity.
  print-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PRINT_COMPILE_OUT: .scratch/native-print-compile

    steps:
      # Bundles carry each edition's derived revision stamp; see `build`.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install source preparation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-public-alpha.txt -r requirements-tools.txt

      - name: Prepare every admitted native print bundle
        run: python tools/tpt native-print-compile prepare --out "$PRINT_COMPILE_OUT"

      # The service image's `toolchain` stage: the pinned TeX Live image plus
      # archive-pinned XeTeX and Latin Babel support, verified by its own font
      # and hyphenation probes. The anonymous base pull needs no token.
      - name: Build the pinned print toolchain
        run: |
          set -euo pipefail
          [[ "$TEXLIVE_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo 'TEXLIVE_IMAGE must name an immutable digest' >&2; exit 1; }
          [[ "$ARCH_SNAPSHOT" =~ ^[0-9]{4}/[0-9]{2}/[0-9]{2}$ ]] || { echo 'ARCH_SNAPSHOT must name a daily archive' >&2; exit 1; }
          docker build --target toolchain \
            --build-arg "PRINT_BASE=$TEXLIVE_IMAGE" --build-arg "ARCH_SNAPSHOT=$ARCH_SNAPSHOT" \
            --tag "triptych-print-compile:$GITHUB_RUN_ID" containers/native-print

      - name: Compile every admitted edition from its bundle alone
        run: |
          set -euo pipefail
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --tmpfs /tmp --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 \
            "triptych-print-compile:$GITHUB_RUN_ID" \
            python tools/tpt native-print-compile compile --out "$PRINT_COMPILE_OUT" --jobs "$(nproc)"

      - name: Show the print compile summary
        if: ${{ !cancelled() }}
        run: cat "$PRINT_COMPILE_OUT/summary.json" || true

      - name: Upload print compile receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-print-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PRINT_COMPILE_OUT }}/summary.json
            ${{ env.PRINT_COMPILE_OUT }}/receipts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Publishing is this job's only act, and it needs both gates.
  deploy:
    needs: [build, print-compile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
