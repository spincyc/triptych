name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The typesetting toolchain, pinned by content address, and pinned to the
  # distribution this corpus was authored and reviewed under rather than to
  # whichever TeX Live happens to be packaged elsewhere.
  #
  # The first attempt at this used Island of TeX's Debian-based scheme-full
  # image. It was also TeX Live 2026, and it still could not typeset this
  # corpus: its longtable had already dropped the \vss page-split tails the
  # altar-server format corrects, and its xltabular overflowed a dimension in
  # the ecclesiastical-latin reference lexicon. Both documents build here.
  # Two unrelated incompatibilities in two runs is not a run of bad luck; it
  # is the wrong toolchain. The Makefile names ARCH_TEX_PACKAGES, the recorded
  # PDF digests were produced against those packages, and 162 of 188 documents
  # were verified byte-identical against them. The build belongs there.
  #
  # Reproducibility comes from two pins, not one. ARCH_IMAGE fixes the base by
  # digest; ARCH_SNAPSHOT points pacman at the Arch Linux Archive, whose
  # per-day trees are immutable, so the package set resolves identically on
  # every run rather than following the rolling mirrors. The snapshot carries
  # texlive-bin 2026.0-2 and texlive-* 2026.1-1, which is exactly the set that
  # builds this corpus today. Moving either pin is a deliberate change of
  # baseline and needs the corpus rebuilt against it, not a version bump.
  ARCH_IMAGE: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
  ARCH_SNAPSHOT: "2026/09/04"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Checkout of the large publication tree can itself take more than ten
    # minutes on a cold runner, and the PDFs are now typeset here rather than
    # read out of the tree: roughly two hundred documents, each compiled until
    # its auxiliary files stop moving, on four vCPUs. Budget, worst case:
    # ~10 checkout, ~5 image pull, ~30 typesetting, ~6 source gate, ~3 site,
    # ~3 verification, ~5 upload and deploy -- about an hour. Ninety minutes
    # leaves half again as much headroom for a cold runner or a slow registry
    # while still killing a hung job far inside the six-hour default, which
    # matters here because the `pages` concurrency group serialises deploys
    # behind whatever is stuck.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PDF text extraction dependency
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      # The source gate runs the PyYAML-backed Missal generators before the
      # public renderer runs. Keep both exact locks here: setup-python provides
      # an interpreter, not the repository's third-party modules.
      - name: Install site and deployment-check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-public-alpha.txt -r requirements-tools.txt

      # The six volumes under pdf/reading-plans/ are the one part of pdf/ this
      # workflow does not build. release/public-alpha.json binds each of them
      # to an exact SHA-256 as part of the operator's publication
      # authorization, and `public-alpha verify` enforces those hashes;
      # rebuilding them on any other toolchain would break the authorization
      # rather than refresh it, and refreshing it is an operator's act. They
      # stay tracked -- 7.4 MiB against the 244 MiB of per-provider
      # publication PDFs that no longer are. Asked here, in seconds, rather
      # than left to surface as a wall of hash mismatches an hour in.
      - name: Confirm the release-bound reading-plan tracks are present
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path("release/public-alpha.json").read_text(encoding="utf-8"))
          bound = sorted(
              path
              for authorization in manifest["authorizations"].values()
              for path in authorization.get("site_sources", {})
              if path.startswith("pdf/")
          )
          missing = [path for path in bound if not Path(path).is_file()]
          if missing:
              print("release/public-alpha.json binds PDFs this tree does not carry:", file=sys.stderr)
              for path in missing:
                  print(f"  {path}", file=sys.stderr)
              print(
                  "\nThese are published under an approved SHA-256 and are not built by "
                  "this workflow. Restore them, or refresh and re-approve the release "
                  "bindings before untracking them.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"{len(bound)} release-bound PDF(s) present")
          PY

      # Nothing here is cached, deliberately. There is no TeX package cache to
      # keep: the toolchain arrives whole inside the pinned image, and staging
      # its layers through actions/cache would replace one content-addressed
      # copy with a mutable one for no gain. A build/ cache would be worse than
      # useless -- Make decides staleness by mtime, every checkout stamps every
      # source file with a fresh one, and a restored tree could carry a PDF
      # built from an earlier commit's sources into the published artifact,
      # which is exactly the reproducibility this pin exists to protect. The
      # pip install is two version-locked wheels and is not worth a cache.
      #
      # Pulled as its own step so a registry failure reads as one, and so the
      # 2.7 GiB this costs is visible in the timings rather than hidden inside
      # the build.
      - name: Pull the pinned TeX Live toolchain
        run: docker pull "$ARCH_IMAGE"

      # Every provider, not the Makefile's PROVIDER default of gpt: the site's
      # publication records span all of them. The Makefile computes PROVIDERS
      # from src/*/**/main.tex but exposes no target that installs across them,
      # so the same derivation is repeated here (Makefile ALL_MAIN_SOURCES /
      # PROVIDERS) and the loop is this workflow's.
      #
      # `make install` and not a pdflatex loop, because the real pipeline is
      # what has to run: check-metadata first, then per document the
      # generate-roman-sanctuary-dictionary prerequisite that the six
      # roman-sanctuary-dictionary leaves fail without, the compile to a fixed
      # point, the curriculum-structure check, the generation-metadata
      # validation, and finally the hash-checked staged install into pdf/.
      #
      # The container runs as root because poppler-utils has to be added to it:
      # the generation-metadata validator shells out to pdftotext and pdfinfo,
      # and the image ships neither. Only pdflatex's own inputs are pinned by
      # the digest; poppler reads the PDFs and cannot change their bytes. The
      # step after this one gives the workspace back to the runner user.
      - name: Typeset every provider's PDFs in the pinned container
        run: |
          set -euo pipefail
          providers="$(find src -mindepth 2 -type f -name main.tex -print | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          test -n "$providers"
          printf 'providers: %s\n' "$providers"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir "${GITHUB_WORKSPACE}" \
            --env "TRIPTYCH_PROVIDERS=${providers}" \
            --env "TRIPTYCH_SNAPSHOT=${ARCH_SNAPSHOT}" \
            "$ARCH_IMAGE" \
            bash -euo pipefail -c '
              # One immutable archive tree, not the rolling mirrors: a rebuild
              # has to resolve the same packages the reviewed run resolved.
              printf "Server=https://archive.archlinux.org/repos/%s/\$repo/os/\$arch\n" \
                "${TRIPTYCH_SNAPSHOT}" > /etc/pacman.d/mirrorlist
              # -Syu, not -Sy then -S: the image base is older than the
              # snapshot, and installing into a half-upgraded system is the
              # one way to break an Arch container.
              pacman -Sy --noconfirm --needed archlinux-keyring
              pacman -Syu --noconfirm --needed \
                texlive-bin texlive-basic texlive-latex texlive-latexrecommended \
                texlive-latexextra texlive-pictures texlive-fontsrecommended \
                texlive-fontsextra poppler python python-yaml make git diffutils
              pdflatex --version | sed -n 1,2p
              python3 -c "import sys, tomllib; assert sys.version_info >= (3, 11), sys.version"
              for provider in ${TRIPTYCH_PROVIDERS}; do
                echo "::group::make install PROVIDER=${provider}"
                make --jobs="$(nproc)" install "PROVIDER=${provider}"
                echo "::endgroup::"
              done
            '

      # Everything the container wrote is root-owned, including the __pycache__
      # directories Python leaves beside the imported modules under scripts/.
      # The whole workspace is handed back rather than build/ and pdf/ alone,
      # so nothing downstream discovers a directory it cannot write.
      - name: Return the workspace to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      # This gate used to run before anything was built, which was correct
      # while the PDFs were tracked. It no longer is: `document-library check`
      # reads the title and subject out of each built PDF, and
      # `document-library structure --check` re-derives the tracked catalogue
      # under src/web/data from those same PDFs, page counts included. Both
      # need pdf/ populated, so the gate follows the typesetting.
      - name: Verify deployable sources and inventories
        run: make check-deployment-sources

      - name: Build public artifact
        run: make public-site

      - name: Verify artifact and GitHub Pages compatibility
        run: python tools/tpt public-alpha verify --deployment-target github-pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload verified artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/public-alpha/site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
